  author: lanyard-textile
  text: 'I have what I like to call a semiphotographic memory. I can abstractly remember
    the positions, shapes, colors and numbers of things extremely well. I can remember
    sequences of words very well. I can strongly associate it with sensory memories.<p>But
    I have some weaknesses with it, like temporal trouble. It&#x27;s hard to natively
    remember dates and sequences of events. I can strongly remember what the pieced
    together moments were like, but it&#x27;s difficult to recall &quot;Did that happen
    before X or Y?&quot;<p>With things like that I <i>need</i> to remember, I visualize
    a timeline or a graph in my head or draw it out and take a mental snapshot of
    that. I&#x27;ve also found that&#x27;s why I&#x27;m a &quot;visual&quot; person
    when it comes to things like project management.<p>I&#x27;ve imagined a lot of
    memory management for others must be like that: You find your innate abilities
    of mental organization, and use it to map the world outside to the world inside.
    I imagine it looks very different for everyone.'
  score: 0
