  author: ssl-3
  text: Myself and a friend treated ourselves to a bunch of Marylin Manson shows early
    in 1997 because we were into that.  Sometimes, we&#x27;d have assigned seats.  Once
    or twice, we elected to sit on the balcony by ourselves and watch everything from
    afar.  One time, in Harrisburg, I wanted to be in the pit but I did not have a
    ticket for that.<p>I decided I was going to sneak onto the floor anyway.<p>So
    I positioned myself to be ready for the lights to drop as the opener, Rasputina,
    finished up and I hopped over the bar and tried to disappear into the crowd on
    the floor below.<p>It didn&#x27;t work.  I was instantly spotlighted by a man
    with a flashlight.  Someone else grabbed my shoulder and corrected me by indicating
    rather forcefully that my intended destination was not the mosh pit, but was instead
    the entrance gate at the back of the arena.<p>They didn&#x27;t kick me out, but
    once we got back to that quieter area I was informed that since I didn&#x27;t
    have a ticket to be in the pit, then I was definitely not going to be in the pit.  I
    was further made aware that I would not be trying this kind of thing again.<p>So
    I sauntered back to the assigned seat that I started from and watched the show
    from there, where some usher became increasingly livid at the despondent teenagers
    who were smoking cigarettes at a rock show in the 1990s (but who was apparently
    powerless to do anything about it).<p>The show was good.  I&#x27;d seen it before,
    and I would also see it again.<p>---<p>That was almost 30 years ago.  Certainly,
    some aspects have been lost to time.<p>Was it Harrisburg?  Maybe it was Pittsburgh.  It
    probably wasn&#x27;t Wheeling -- that show was differently-memorable because I
    had Gideon&#x27;s bible in my pocket and people were getting arrested for throwing
    snowballs at the Christians who were holding a vigil across the street, with candles,
    as they prayed for our souls.  It might have been Wheeling anyway.<p>And the usher?  I
    definitely remember issues between smokers and an usher.  But maybe that guy was
    at a show somewhere in Ohio instead.<p>Did I make my move during Rasputina, or
    maybe it was some other opener?  Was Rasputina even at that show?  (Maybe it was
    unrelated to the opening act?)<p>I do know that I hopped over a barrier and immediately
    got sent to the back, and that&#x27;s the important part of the story that I wanted
    to convey.  The rest is just context.<p>And the trick is to just fill in enough
    believable details about that context that the story works.  (It&#x27;s even easier
    if you believe those details yourself.)
  score: 0
