  title: Sneaking into the auditorium for the Windows 2000 launch rehearsal - The
    Old New Thing
  fetch_status: success
  content: "![](https://devblogs.microsoft.com/oldnewthing/wp-content/uploads/sites/38/2019/02/RaymondChen_5in-150x150.jpg)\n\n[Raymond
    Chen](https://devblogs.microsoft.com/oldnewthing/author/oldnewthing)\n\nThe Windows
    2000 launch in San Francisco was accompanied by an expo, and a large number of
    Windows 2000 team members were dispatched to run the various booths and stations,
    give informal presentations on the new features of Windows 2000, and answer technical
    questions from the various attendees. And from among the people who were sent
    to the expo, a smaller group was selected to attend the launch event itself in
    person.\n\n**Related reading** : [A ticket to the Windows 95 launch](https://devblogs.microsoft.com/oldnewthing/20050824-12/?p=34453
    \"A ticket to the Windows 95 launch\").\n\nAfter a few of us arrived early at
    the Civic Auditorium for the launch event, we had to entertain ourselves until
    the doors opened. There was some speculation as to who the celebrity host would
    be, since it hadn’t been announced. One of my colleagues tried to sneak into what
    looked like a VIP tent.¹ I, on the other hand, went exploring.\n\nI found an unlocked
    door that took me into the empty upper level of the main auditorium.\n\nI took
    a seat and tried not to be noticed.\n\nThe stage was set up with a 10-meter tall
    mock laptop, screens to the left and right of the stage for projecting slides,
    prerecorded videos, or to get a better look at on-stage close-ups, gray curtains
    unobtrusively hung to shield from view what would turn out to be various surprises
    throughout the event, and various other desks, demo areas, and even an airplane
    cabin set.²\n\nWhile I sat and took in the complexity of the stage, there was
    an announcement that they would be rehearsing the opening in one minute. The lights
    dimmed in preparation. The lid of the giant laptop closed _very slowly_.\n\nAbout
    ten minutes after the announcement, the rehearsal actually began.\n\nThe laptop
    lid opened, and on the laptop screen, it looked like someone was signing into
    Windows 2000, and then the mouse clicked the Start button. This led to a video
    montage, and when the montage was over, a voice announced, “Ladies and Gentlemen,
    please welcome Patrick Stewart!”\n\nOh my goodness, Patrick Stewart is going to
    be the presenter for the Windows 2000 launch!\n\nMere seconds later, onto the
    stage bounded… a crew member wearing a headset pretending to be Patrick Stewart
    so that the camera and lighting crew could make sure they were properly positioned.\n\nOkay,
    that’s the end of the rehearsal. The lights come back on, and the auditorium once
    again buzzes with the sound of equipment being moved and people discussing things.\n\nI
    left the auditorium and went back to join the crowd of people waiting to get in.
    I didn’t tell them who the host was.\n\nThe event itself seemed to go off pretty
    much as planned. With the real Patrick Stewart.\n\nPatrick Stewart had such a
    commanding presence. If he had come out on stage and announced, “It is the dawn
    of a new era: The era of lime Jell-O”, people would say, “Yeah, lime Jell-O, I
    need to upgrade to lime Jell-O.” But instead of trying to spark a new dessert
    trend, he talked about Windows 2000, reading words from a teleprompter that he
    almost certainly didn’t understand, but he made them sound great.\n\n¹ My colleague
    eventually returned with a Commemorative Edition boxed copy of Windows 2000.\n\n²
    The airplane cabin was used for a sketch that demonstrated mobile business computing.
    The demoer took their laptop on a plane trip, where they happened to sit next
    to a character named William Wentworth, portrayed by actor John O’Hurley, president
    of William Wentworth Worldwide. (He gave his email address as .) The sketch demonstrated
    infrared file sharing and other mobile scenarios. Remember infrared file sharing?
    Of course you don’t.\n\n### Category\n\n- [Old New Thing](https://devblogs.microsoft.com/oldnewthing/category/oldnewthing/)\n\n###
    Topics\n\n- [History](https://devblogs.microsoft.com/oldnewthing/tag/history/)\n\n###
    Share\n\n- \n- \n- \n\n## Author\n\n ![Raymond Chen](https://devblogs.microsoft.com/oldnewthing/wp-content/uploads/sites/38/2019/02/RaymondChen_5in-150x150.jpg)\n\n[Raymond
    Chen](https://devblogs.microsoft.com/oldnewthing/author/oldnewthing)\n\nRaymond
    has been involved in the evolution of Windows for more than 30 years. In 2003,
    he began a Web site known as The Old New Thing which has grown in popularity far
    beyond his wildest imagination, a development which still gives him the heebie-jeebies.
    The Web site spawned a book, coincidentally also titled The Old New Thing (Addison
    Wesley 2007). He occasionally appears on the Windows Dev Docs Twitter account
    to tell stories which convey no useful information.\n\n## 6 comments \n\nJoin
    the discussion.\n\n### [Leave a comment](javascript:void(0) \"Leave a comment\")[Cancel
    reply](/oldnewthing/20261102-00/?p=112818%2F#respond)\n\n[Sign in](https://devblogs.microsoft.com/oldnewthing/wp-login.php?redirect_to=https%3A%2F%2Fdevblogs.microsoft.com%2Foldnewthing%2F20261102-00%2F%3Fp%3D112818%2F%23comments)\n\nSort
    by :\n\nNewest\n\n[Newest](javascript:void(0))[Popular](javascript:void(0))[Oldest](javascript:void(0))\n\n-
    \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyAQMAAACQ++z9AAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAD0lEQVQokWNgGAWjYGgCAAK8AAGBAoNpAAAAAElFTkSuQmCC)\n\n_I_
    remember infrared file sharing. There’s probably still IrDA stuff in use, or at
    least code still on shipped devices even if not enabled by default and without
    the hardware for it.\n\nAnd thank you for sharing your memories.\n\n  - \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyAQMAAACQ++z9AAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAD0lEQVQokWNgGAWjYGgCAAK8AAGBAoNpAAAAAElFTkSuQmCC)\n\nAs
    of Windows 11 26H2 26340.9843, IrDA is still available as Feature-on-Demand that
    you can enable in Settings → System → Optional features.\n\n  - \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAoAQMAAAC2MCouAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADElEQVQImWNgGFkAAADwAAFTiaRLAAAAAElFTkSuQmCC)\n\nI
    remember being so excited when I got my Windows XP Tablet (remember THOSE?!?)
    that it had an IR port which I could use to HotSync my Palm m100…\n\nAnd then
    I used it.\n\nAnd I bought a USB to serial adapter so I could use my old dock
    with it because IR was slow and finicky.\n\n  - \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyAQMAAACQ++z9AAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAD0lEQVQokWNgGAWjYGgCAAK8AAGBAoNpAAAAAElFTkSuQmCC)\n\nMe
    too! I had an old Nokia camera phone with some photos that I didn’t know how to
    get off the device, but it did have an infrared port. Lo and behold, I also happened
    to have a laptop with an infrared port. I made them stare at each other, clicked
    some buttons that looked like they were relevant to infrared devices, and mission
    accomplished.\n\nI also had a Lego Mindstorms set, which also used infrared for
    transmitting programs to the controller unit.\n\n- \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAoAQMAAAC2MCouAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADElEQVQImWNgGFkAAADwAAFTiaRLAAAAAElFTkSuQmCC)\n\nRIP
    Patrick Stewart. He left us a few days earlier.\n\n- \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwAQMAAABtzGvEAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADUlEQVQYlWNgGAXUBAABUAABeLzIBgAAAABJRU5ErkJggg==)\n\nAnd
    that leaves me nostalgic for the world that still had both Patrick Stewart and
    releases of Windows that brought fine new toys to the developers’ toolbox with
    a start menu that still respected me in the morning (plus MSJ on paper, the stack
    of MSDN discs…)\n\n## Read next\n\nOctober 30, 2026\n\n### [The Microsoft building
    that was reportedly haunted](https://devblogs.microsoft.com/oldnewthing/20261030-00/?p=112815/)\n\n
