  author: bonoboTP
  text: I guess the critique of the trad critique is that there is no single clear
    bright line between beautiful buildings everywhere and some sudden arrival of
    gray boxes everywhere. The beautiful buildings often had conflicting ideologies
    behind them, it was not a static landscape of eternal proportion and principle
    that was one day toppled when some evil people decided to bring misery to all.
    Of course this is an exaggeration.<p>The whole thing is anyway an ideological
    thing today as it was back then. The online trad architecture aesthetic is associated
    with the right wing, who see it as a return to order from today&#x27;s decadence
    and overly guilt ridden elite zeitgeist. Urbanism and human scale architecture
    is associated with certain parts of the left who admire Nordic and Western European
    social democracies like the Netherlands and Denmark against what they see as the
    hegemonic capitalist state of the US.<p>The point is, architecture doesn&#x27;t
    live in a vacuum, it is inextricably linked to political and ideological tribalism,
    and choices in architecture are expressions of what other tribe one rejects and
    consciously differentiates from etc.
