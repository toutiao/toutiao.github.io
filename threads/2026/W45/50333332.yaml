  author: toyg
  text: 'One thing nobody ever mentions, probably because it&#x27;s not fashionable,
    is that all these buildings require <i>maintenance</i> after getting built. Maintaining
    a modernist block, with its flat surfaces and straight lines, is utterly trivial
    compared to more decorative styles - where you have to constantly fight pigeons
    and the elements to not appear derelict. Also, it is typically complicated to
    fix decorative pieces when they break, as they often do.<p>I do understand and
    share the view that the current mainstream is utterly boring, but I also acknowledge
    the (somewhat) irresistible forces that shape it: money, time, effort. And I don&#x27;t
    believe AI can do anything to counter them in a significant manner, sadly.'
