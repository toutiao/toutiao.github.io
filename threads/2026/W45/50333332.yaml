  author: recursivedoubts
  text: 'Read from bauhaus to our house, by tom wolfe.  In america we had the Arts
    &amp; Crafts movement (e.g. greene &amp; greene) as a native folk form.<p>It was
    all killed because two dynamics came together to push &quot;the yale box&quot;:
    corporate america&#x27;s love of cheap buildings (although the buildings are cheap
    to <i>build</i> but often nightmares to maintain and use... somebody else&#x27;s
    problem) and the ideological purity spiraling post WW2 driven by the academic
    environment and the rise of abstract architectural criticism over the practical
    building arts.<p>post modernism acknowledged the failure of the yale box but,
    because going back to traditional building forms was unthinkable (of course),
    had to do ironic kitsch instead'
