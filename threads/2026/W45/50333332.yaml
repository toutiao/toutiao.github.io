  author: DubiousPusher
  text: Dude, it&#x27;s labor. It is no coincidence that essentially every intricate
    form of architecture gave way to simplified forms at the exact same time that
    wages for trade workers were rapidly rising.<p>Hand placed parquet that took a
    master craftsman several weeks to lay disappeared. Intricate carvings upon otherwise
    utilitarian and common structures likewise.<p>Art Deco itself is a compromise
    with this creeping reality. Not fully modern minimalist but economically efficient
    in using flattened elements, prefabs and striaght accents for detailing.<p>When
    a trad person posts their diatribe online it is a simple tell. They know next
    to nothing about how the built world is actually created. And they don&#x27;t
    understand how wages came to form the basis of respect for working people. The
    act of decrying the utilitarian transition is itself a form of disrespect via
    ignorance. Because what you are essentially saying is that your aesthetic preferences
    are more important than the time of expert laborers, whether you know it or not.
  score: 0
