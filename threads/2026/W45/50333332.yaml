  text: |-
    Der von Ludwig Mies van der Rohe entworfene Deutsche Pavillon ist ein edles Stück Architektur und hat nichts mit den Stahl- und Glaskästen zu tun, die die Landschaft verschandeln. Wie setzte sich diese Architektur durch? Ludwig Mies van der Rohe stand mit einem Stahlbaron im oberen Stockwerk eines Hochhauses, deutete auf das Panorama der Steinbauten und sagte: „All das könnte aus Stahl und Glas sein.” So einfach lief das ab.
    ---
    The German Pavilion, designed by Ludwig Mies van der Rohe, is a masterpiece of architecture and bears no resemblance to the steel-and-glass boxes that mar the landscape. How did this style of architecture gain acceptance? Ludwig Mies van der Rohe stood with a steel magnate on the top floor of a high-rise, pointed to the panorama of stone buildings, and said, “All of that could be made of steel and glass.” It was that simple.
