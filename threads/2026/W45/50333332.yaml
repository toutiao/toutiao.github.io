    too. And I really don&#x27;t care the general consensus is that it is wonderful.<p>And
    the Sagrada Familia, has as already been noted in this thread, is certainly nothing
    like Art Nouveau (someone described it in this thread as &quot;closer to H.R.
    Giger&#x27;s Alien than Art Nouveau&quot; and I fully agree).<p>As a sidenote
    I&#x27;d say architects have a duty to make things that are sustainable. Something
    so grotesque that it takes decades after your death to even only finish, let alone
    maintain, means &quot;architecture&quot; went somewhere deeply wrong.<p>I don&#x27;t
    doubt it&#x27;s great PR for the city of Barcelona though.<p>As the saying goes:
    <i>&quot;To each their own bad tastes&quot;</i> (&quot;A chacun ses mauvais gouts&quot;)."
