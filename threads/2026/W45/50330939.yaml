    U.S workers just took home their smallest share of capital since at least 1947—and
    the lowest ever recorded\n\n ![Sasha Rogelberg](https://fortune.com/img-assets/wp-content/uploads/2024/01/Unknown_52c650.jpeg?format=webp&w=1440&quality=75)\n\nBy
    \n[Sasha Rogelberg](/author/sasha-rogelberg/)\nSasha Rogelberg\nReporter\n\n ![Sasha
    Rogelberg](https://fortune.com/img-assets/wp-content/uploads/2024/01/Unknown_52c650.jpeg?format=webp&w=1440&quality=75)\n\nBy
    \n[Sasha Rogelberg](/author/sasha-rogelberg/)\nSasha Rogelberg\nReporter\n\nOctober
    31, 2026, 10:38 AM ET\n\n ![A worker in a green jacket operates a welding tool.](https://fortune.com/img-assets/wp-content/uploads/2026/01/GettyImages-1322099863-e1768339483475.jpg?format=webp&w=1440&quality=75)\n\nU.S.
    workers are earning the smallest share of U.S. GDP on record.Lea Suzuki/The San
    Francisco Chronicle—Getty Images\n\nAdd Fortune on Google for similar content.\n\nAs
    corporate earnings soar and U.S. GDP balloons, the American workforce isn’t feeling
    the same boom. American workers are taking home less of the country’s overall
    income, data from the Bureau of Labor Statistics shows, and employment in the
    U.S. is set to continue to slow.\n\nRecommended Video\n* * *\n\nLabor share, or
    the portion of the U.S.’s economic output that workers receive through salary
    and wages, decreased to 52.8% in the second quarter of 2026, its lowest level
    since the BLS started recording this data in 1947, according to its [labor productivity
    and costs report](https://www.bls.gov/opub/ted/2026/labor-share-at-its-lowest-level-52-8-percent-in-second-quarter-2026.htm).
    In the previous quarter, labor share was at 53.6%. This decade, the labor share
    average was about 55.6%.\n\nThat’s despite corporate earnings skyrocketing, with
    profits for Fortune 500 companies [hitting a record $2.1 trillion](https://fortune.com/2026/06/19/fortune-500-employment-profits-revenue-hiring-jobs-ai/)
    in 2025. The [U.S. GDP grew 3.4%](https://www.bea.gov/data/gdp/gross-domestic-product)
    in the third quarter last year, exceeding economists’ predictions.&nbsp;\n\nThat
    growth has not only come at the expense of how much of the pie of wealth workers
    are taking home, but also how many Americans are in the workforce, economists
    warn.\n\n“That decline in the share of labor has got to be either falling earnings
    or falling numbers of people,” Raymond Robertson, a labor economist at Texas A&M’s
    Bush School of Government, told _Fortune._ “The falling share of income is having
    to do with the shift towards capital.”\n\nIndeed, there are growing signs that
    as national income balloons, the U.S. workforce is deflating. Unemployment [ticked
    up to 4.2%](https://www.bls.gov/news.release/empsit.nr0.htm) in September, and
    employers added just 584,000 jobs in 2025 compared to 2 million added in 2024.
    The U.S. added 29,000 jobs in September, about one-third of economists’ projections.\n\nThe
    bifurcation of corporate victories and weak labor data raises concerns among economists
    of [jobless growth](https://fortune.com/2026/01/07/jobless-expansion-low-hire-fire-economy-k-shaped-december-november-data-jolts-reaction/)
    jeopardizing the U.S. workforce, as well as a [K-shaped economy](https://fortune.com/2025/11/07/what-is-the-k-shaped-economy-wealth-inequality-explainer/),
    where the rich get richer while the poor get poorer, becoming more exaggerated.\n\n“Data
    right now is very mixed,” Robertson said. “But I think it also all consistently
    points to this idea that things are getting worse for workers and much better
    for billionaires.”\n\n## **What is causing jobless growth?**\n\nRobertson attributes
    weakening labor share averages to the rise in automation, which he noted is displacing
    workers, with productivity—a metric essentially measuring worker output—continuing
    to rise. Second-quarter GDP data showed nonfarm productivity growth [grew 1.4%
    last quarter](https://www.bls.gov/news.release/prod2.nr0.htm), though the rate
    has slowed from 2.2% in the same quarter a year ago.\n\n“All these things, bit
    by bit, are replacing people, and they’re concentrating income and their share
    of capital,” he said.\n\n[Goldman Sachs](https://fortune.com/company/goldman-sachs-group/)
    analysts [Joseph Briggs](http://linkedin.com/in/joseph-briggs-997140100) and [Sarah
    Dong](https://www.linkedin.com/in/sarahfdong/) estimated in a report, based on
    Department of Labor job numbers, that AI automation could [displace 25% of all
    work hours](https://fortune.com/2026/01/13/humans-could-go-the-way-of-horses-goldman-ai-job-apocalypse-unemployment/).
    They predicted that over the course of the AI adoption period, a 15% increase
    in AI-driven productivity would displace 6% to 7% of jobs, and, at its peak, a
    1 million increase in unemployed workers, though job displacement as a result
    of AI has [not shown up meaningfully](https://fortune.com/2026/02/02/ai-labor-market-yale-budget-lab-ai-washing/)
    in any economic data.\n\nThe displacement could be substantial, the analysts said,
    but said the impacts of automation will be tempered by a wealth of new jobs created
    as a result of the technological changes.\n\nAutomation is expected to be a boon
    to corporate profits and GDP, projected to boost GDP by 1.5% by 2035, according
    to a [Wharton brief](https://budgetmodel.wharton.upenn.edu/issues/2025/9/8/projected-impact-of-generative-ai-on-future-productivity-growth)
    published in September 2025. Early signs indicate AI could drive productivity
    gains, with around 80% of employees reporting AI makes them faster at specific
    tasks, but only 37% of companies seeing an impact of that productivity on operating
    profits, according to [McKinsey data](https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai),
    and AI operating costs continue to constrain its deployment.\n\nRobertson added
    that growing unemployment, which he expects to see rise over the next few months,
    keeps wages down, allowing margins and profits to expand.\n\nTo be sure, the recent
    productivity surge has been an “[open question](https://fortune.com/2026/01/12/why-is-productivity-up-4-9-percent-gdp-growth-jobs-ai-layoffs/),”"
