  author: AnthonyMouse
  text: '&gt; 3 pointless multi-trillion dollar tax cuts<p>This is a misunderstanding
    of how &quot;tax cuts&quot; work under the US income tax. Federal receipts as
    a percent of GDP:<p><a href="https:&#x2F;&#x2F;fred.stlouisfed.org&#x2F;series&#x2F;FYFRGDA188S"
    rel="nofollow">https:&#x2F;&#x2F;fred.stlouisfed.org&#x2F;series&#x2F;FYFRGDA188S</a><p>Notice
    the lack of &quot;tax cuts&quot;. GDP goes up, taxes go up by exactly the same
    amount. The number from the most recent year is basically the same as the number
    from 50 years prior in 1975. Ratio hasn&#x27;t changed meaningfully since the
    end of WWII. But Congress somehow keeps passing &quot;tax cuts&quot;, so how does
    that work?<p>It&#x27;s because the tax cuts are fake. They set the tax brackets
    in dollars rather than percentiles, but the tax <i>rates</i> are in percentages,
    so that&#x27;s not a stable ratio. In 1995 the median household income was $34,080,
    now it&#x27;s $87,460. If they left the tax brackets the same, it would shove
    the middle class into the tax brackets meant for the rich. De facto middle class
    tax hike whenever they do nothing.<p>Naturally Congress loves this, because every
    few years they get to pass a bill re-adjusting the numbers to keep the true tax
    rate the same while calling it a &quot;tax cut&quot;, and thereby get to claim
    credit for something people want while not really changing anything. Which is
    their absolute favorite thing, and why they never fix it by setting the tax brackets
    in percentiles.'
