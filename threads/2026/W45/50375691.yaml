  author: grehbies
  text: Even worse when you were running a fossil because your parents saw a merely-working
    computer as good enough. Boy, I would really like to get into 3D modeling. Windows
    98SE can&#x27;t run Maya PLE, Blender chugs, I guess we&#x27;re using Anim8or.
