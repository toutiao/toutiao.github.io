  author: coldpie
  text: 'I built some homebrew games for the PlayStation Portable circa 2004, in the
    middle of high school.  I had some C and C++ knowledge, but barely knew what I
    was doing.  Setting up the toolchain for building PSP homebrew on Windows XP involved
    a cygwin instance and all sorts of bizarre compiler and library packages that
    made almost zero sense to me at the time, and I had pretty much no Unix experience.  I
    remember if I ever got linker errors, I&#x27;d just back up my source code (copy
    the whole dir to &quot;game_backup_20040102&quot; etc), delete everything, and
    re-do the entire installation from scratch, because I had no idea what a linker
    was or what the errors meant.<p>It&#x27;s wild to me that I actually built and
    shipped two decent little games with that setup, lol.  I put them on Itch a couple
    years ago: <a href="https:&#x2F;&#x2F;coldpie.itch.io&#x2F;" rel="nofollow">https:&#x2F;&#x2F;coldpie.itch.io&#x2F;</a>'
