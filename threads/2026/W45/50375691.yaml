article:
  url: https://jaytholen.net/teengamedev/
  title: Being a kid making games in the early 2000s - Jay Tholen
  fetch_status: success
  content: "it's 1996 or something. 10-year-old me is eating breakfast with the principal
    in an elementary school cafeteria. this extraordinarily hyped-up breakfast event
    is my reward for achieving a high score on the FCAT state writing test. i'm disappointed
    that the food is standard Florida elementary school breakfast fare and not something
    fancier. they'd played this thing up to be a big deal.   \n  \n it's fine though,
    i don't think i deserved the honor. they gave me an expository essay prompt to
    \"explain what makes a Historical figure notable\" (or something like that??)
    and I instead penned a comedy-fantasy with a shoehorned-in Lincoln cameo. my influences
    were narrow so it probably read like an unserious R.L. Stine short minus the horror.
    towards the end i threw in a cheeky joke about not following the rules hoping
    that my judges were amenable to snarky little scofflaws. i guess they were.\n\n
    \ \n this was often a thing with me. starting at the age of 8 i simply would (could?)
    not start assignments i found too challenging (long division destroyed me. it
    snowballed into never passing pre-algebra by my senior year of highschool) or
    creative exercises i found pointless (persuasive essays. why would I try to persuade
    someone regarding a topic I had no interest in or knowledge of?) and instead opted
    to write short form fantasy and science fiction stories or draw detailed maps
    of made-up places.   \n  \n i was also bonkers about computers and the World Wide
    Web, though we couldn't afford a PC and i suspected we never would. didn't stop
