    just taken the rest of the world 20 years to catch up.<p>A lot of people go &quot;Blender
    UI was horrible, but they redesigned the whole thing and now it is good&quot;
    Having used blender in a minor role for 20 years(i think I started on 1.7), I
    think this was just a big psyop by the blender team. Sort of how the client goes
    &quot;Change things&quot; and you change nothing, wait a day, and tell the client
    &quot;I made the changes you requested&quot; client: &quot;I love it&quot;<p>I
    am not saying the blender team has not made substantial improvements to the UI
    over the years, but the core is still that same quick blender workflow, This is
    very different from the normal clunky GUI design of 3d modelers of the era and
    as such blender got a reputation for having a weird UI which was easily translated
    to blender having a bad UI. So what do you do when you have an unwarranted bad
    reputation? Especially now that the rest of the world has caught up and is using
    your flows and they are not so weird anymore. Make a dark mode and put out a big
