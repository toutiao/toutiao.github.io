  title: 'Inside Replit’s New Sandbox Engine, Part 1: The Path to MicroVMs'
  fetch_status: success
  content: "Sections\n\nAgent sandboxes are all the rage. A new sandbox startup is
    announced every couple of weeks. At Replit, we’ve been running sandboxes for nearly
    a decade. For years, we’ve run our custom sandbox infrastructure to make it easy
    for anyone to code online, and now Agents use these sandboxes to build applications
    without requiring any coding at all.\n\nIn the past few months, we finished rolling
    out a complete rewrite of our sandbox engine to improve security, capabilities,
    and portability across clouds. Our Bring Your Own Cloud offering brings Replit
    into customers’ AWS, Google Cloud, or Azure environments. As with most infrastructure
    work, we had to pull this off without anyone even noticing. We migrated hundreds
    of millions of projects smoothly, without data loss. In this post, we’ll dive
    into how we changed the isolation boundary, kept sandboxes fast, and made the
    new engine work at scale.\n\nIn this post, we’ll dive into how we changed the
    isolation boundary and kept our sandboxes fast. In Part 2, we cover how we orchestrate
    tens of thousands of microVMs at once on Kubernetes.\n\n## Why our work matters\n\nSecurity,
    alignment, and containment are among the hottest topics in the AI industry. OpenAI’s
    Hugging Face incident and Anthropic’s evaluation incidents showed the world that
    autonomous agents can reach and harm real systems beyond their intended scope.
    Although these evaluations might have had reduced model safeguards, the clear
    takeaway is that traditional security boundaries are no longer sufficient in the
    age of AI. NIST’s agent standards initiative and congressional scrutiny put isolation,
    identity, and monitoring firmly on the industry’s agenda.\n\nSandboxing was not
    a new category for Replit. It was infrastructure our customers had depended on
    since the early days, and a foundation of our defense-in-depth approach. Early
    on, we realized that as AI agents become increasingly autonomous and widely adopted,
    the environment in which they operate needs to evolve too. The industry is now
    converging on the same requirements. DeepSeek’s DSec reinforces the case for elastic
    sandboxed compute infrastructure, and extra validation comes from open-source
    initiatives such as Kubernetes Agent Sandbox or Google’s AX and Agent Substrate.
    Early this year, selected agent-infrastructure startup rounds announced since
    2025 totaled **$59.3 million** in funding across Daytona, E2B, Runloop, and Blaxel.\n\nIn
    November 2025, we set out to rebuild our sandbox infrastructure for more autonomous
    agents, persistent workspaces, and much higher concurrency. By February, we were
    already using it internally. We spent the following months hardening it and rolling
    it out.\n\n## The Path to MicroVMs\n\nOur sandbox engine started out simple: stateless
    code execution in Docker, spread across Google Compute Engine VMs. Over the years,
    we added persistent workspaces, public endpoints, cached Nix packages, regional
    clusters, and bottomless storage with instant disk forks. As we set out to chart
    the path towards microVMs, we realized it would be much easier to start from scratch
    than to port the existing runtime from Docker to microVMs. This also allowed us
    to prototype and develop rapidly without risking the existing system.\n\nA microVM
    is a lightweight virtual machine with its own Linux kernel and a minimal set of
    virtual devices. We use KVM to separate each sandbox from the host and from other
    customers’ workloads.\n\n ![Container isolation compared with microVM isolation.](/article-images/replit-sandbox-engine-microvms-part-1/isolation.webp)\n\nContainers
    still separate processes inside each sandbox. Hardware-assisted virtualization
    now separates the sandboxes themselves.\n\nFirst, we needed to pick a virtual
    machine monitor (VMM) to run each microVM. We chose Cloud Hypervisor, which shares
    reusable rust-vmm components with Firecracker and includes features such as virtiofs,
    transparent huge pages, device hotplug, and live migration. Nested virtualization
    also lets us run development environments that launch VMs of their own. Hotplug
    and memory snapshots were particularly useful for our design, as they allowed
    attaching customers’ disks on demand to running warm-pooled VMs. We also patched
    Cloud Hypervisor to improve snapshot portability across our supported bare-metal
    and virtualized environments.\n\nA minimal init process inside each microVM starts,
    stops, and monitors its containers. The host communicates with it over gRPC using
    vsock, a host-to-guest channel that does not require an IP network.\n\nWith all
    the primitives in place, we needed a single supervisor to set up the sandbox:
    start the microVM, configure its network, launch the containers, and run the servers
    clients use to interact with it through our river protocol.\n\n ![Sandbox architecture
    showing the supervisor, Cloud Hypervisor, and guest containers.](/article-images/replit-sandbox-engine-microvms-part-1/architecture.webp)\n\nThese
    are general-purpose Linux VMs, not environments tied to a single app-building
    workflow. We use the same foundation for our self-driving company: agents investigate
    incidents, review code, analyze business data, and triage support tickets. In
    late January, we combined microVMs and remote filesystems with access policies,
    token proxies, audit logging, and our ZeroTrust network so teams could run agents
    in parallel against the systems they actually use. People set the goals. Isolated
    environments give the agents somewhere to do the work.\n\n## Security and isolation\n\nOver
    the past year, there have been a large number of Linux kernel CVEs that can lead
    to Local Privilege Escalation (LPE): Copy Fail, Dirty Frag (xfrm-ESP), Dirty Frag
    (RxRPC), Fragnesia, DirtyClone, epoll race-condition PE bug, Bad Epoll, GhostLock,
    FUSE filesystem driver flaw. Many of these bugs have been around for years, but
    developments in AI have increased the rate at which these are being discovered.\n\nOur
    previous runtime used Linux containers, which share the host kernel. A reachable
    vulnerability in that kernel can let an attacker escape a container and reach
    other workloads, credentials, or network endpoints on the host. Not every kernel
    CVE is exploitable in every configuration, but sharing the kernel makes a successful
    escape much more consequential.\n\nWith microVMs, compromising a sandbox’s guest
    kernel does not by itself compromise the host kernel. An attacker still has to
    cross the virtualization boundary.\n\nGiving each sandbox its own kernel also
    lets us support tools such as Docker, which require privileges we could not safely
    expose in the shared-kernel runtime.\n\n### Minimized privileges and kernel surface\n\nIn
    our new design, a sandbox consists of a microVM with minimal runc containers running
    inside. Alongside the development environment, supporting services handle PostgreSQL,
    git backups, and secure request proxying. We considered a microVM for each component,
    but decided the extra overhead was not worth it and did not meaningfully change
    the tenant isolation model. Containers still provide separate namespaces, resource
    limits, and role-specific permissions inside the microVM guest.\n\nThe virtualization
    boundary does not make every process inside it equally trusted. We configure namespaces,
    seccomp, device access, and capabilities by role, so a user process does not inherit
    a monitoring agent’s permissions. Docker gets the additional privileges it needs
    inside the guest, and never reaches the physical host.\n\nThe VMM itself runs
    under an unprivileged identity with no Linux capabilities.\n\n### Smaller kernel,
    smaller attack surface\n\nOur guest kernel starts from `tinyconfig`, not a standard
    distribution configuration. We leave out hardware subsystems a microVM does not
    need, including Bluetooth, wireless, USB, and display drivers. Your coding agent
    definitely doesn’t need a Nintendo Switch controller. Required drivers are built
    in, and guest initialization disables module loading. Given the increasing rate
    of kernel CVE disclosures "
