  author: oooyay
  text: I think this is stated confusingly.<p>gVisor and Firecracker are nothing alike.
    gVisor is an application kernel written in Go. Application kernels will make your
    system much slower and can only solve a subset of security issues that would affect
    the kernel. They&#x27;re like a kernel proxy of sorts.<p>Firecracker is a KVM
    virtual machine but made much more efficient. It&#x27;s the most desirable of
    the two. Firecracker and KVM don&#x27;t require bare metal, but in a virtualized
    environment they will require nested virtualization support. Nested virtualization
    is supported by just about every hyperscaler.<p>The reason KVM is preferable is
    because it provides strong isolation of the host kernel interface and independent
    emulation of host devices.
