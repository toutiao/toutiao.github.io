  author: tptacek
  text: 'The general vibe I hear from security practitioners is that they (gvisor
    and Firecracker&#x2F;Cloud-Hypervisor) are comparable. You generally do Firecracker
    if you can get away with it, because it&#x27;s simpler and faster, but to do it
    well you generally need bare-metal hosts.<p>I think &quot;hardware&quot; vs. &quot;software&quot;
    is the wrong way to frame this. The big difference is between shared-kernel multitenant
    and guest kernels. gVisor (in some configurations) is like an 80% solution; a
    partially emulated guest kernel. I think the verdict is in on shared-kernel vs.
    not: don&#x27;t share kernels between tenants.<p>The hardware isolation itself
    --- AMD-V, VT-X, &amp;c --- has held up for almost 2 decades now. You never know,
    of course, but if you were going to place a bet it probably wouldn&#x27;t be on
    hardware isolation failing before software did.'
