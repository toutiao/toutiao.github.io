  content: "[Investing](https://247wallst.com/investing/)\n\n# OpenAI Just Raised
    $11 Billion at a $1.25 Trillion Valuation, Below the $1.4 Trillion It First Sought\n\nOpenAI
    got its money, but not on the terms it wanted, and the gap between its growth
    story and investor appetite is landing on two giants. One faces a bookkeeping
    hit, the other a deeper dependency on the funding flow.\n\n ![](https://secure.gravatar.com/avatar/dac1a1f2adf30aac00a449ddbb2a0950?s=44&d=mm&r=g)\n\n
    By [Omor Ibne Ehsan](https://247wallst.com/author/omor-ibne-ehsan/)\n\n Published
    November 7, 2026, 8:38am ET · 3 min read \n\n[\U0001D54F](https://twitter.com/intent/tweet?url=https%3A%2F%2F247wallst.com%2Finvesting%2F2026%2F11%2F07%2Fopenai-just-raised-11-billion-at-a-1-25-trillion-valuation-below-the-1-4-trillion-it-first-sought%2F&text=OpenAI%20Just%20Raised%20%2411%20Billion%20at%20a%20%241.25%20Trillion%20Valuation%2C%20Below%20the%20%241.4%20Trillion%20It%20First%20Sought)[f](https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2F247wallst.com%2Finvesting%2F2026%2F11%2F07%2Fopenai-just-raised-11-billion-at-a-1-25-trillion-valuation-below-the-1-4-trillion-it-first-sought%2F)\n\nThis
    post may contain links from our sponsors and affiliates, and Flywheel Publishing
    may receive compensation for actions taken through them.\n\n![OpenAI Just Raised
    $11 Billion at a $1.25 Trillion Valuation, Below the $1.4 Trillion It First Sought](https://247wallst.com/wp-content/uploads/2026/11/openai-just-raised-11-billion-at-a-1-25-trillion-v-featured-1794023504517-400x225.webp)\n_©
    24/7 Wall St._\n\nAbout $11 billion in new money reached OpenAI’s accounts by
    Friday, November 6, 2026, people familiar with the deal said. That cash is the
    first part of a round priced at a $1.25 trillion pre-money valuation, a figure
    the company’s CFO, Sarah Friar, confirmed in a TV interview. OpenAI declined to
    comment on the funding.\n\nPress reports said OpenAI first set out to raise $30
    billion or more at a $1.4 trillion valuation. Two investors put the first ask
    at $1.5 trillion. Friar challenged that account on air, saying the higher figure
    started with a media report and never came from OpenAI.\n\nWhichever starting
    point you accept. The round ended up smaller and cheaper after AI stocks sold
    off, even as OpenAI says its business is accelerating. That gap affects shareholders
    of **Microsoft** ([NASDAQ:MSFT](https://247wallst.com/companies/MSFT/) | [MSFT
    Price Prediction](https://247wallst.com/companies/msft/price-prediction)) and
    **NVIDIA** ([NASDAQ:NVDA](https://247wallst.com/companies/NVDA/)) because both
    depend on OpenAI’s ability to fund its plans.\n\n## Cash Wired Versus Cash Promised\n\nThe
    closed amount covers about 37% of the original target. SoftBank and Abu Dhabi’s
    MGX took part in the round.\n\nThe rest could lift the total to as much as $20
    billion, and a separate report put the follow-on at up to another $9 billion.
    That second portion has not closed. Lead investors, terms, and use of proceeds
    were not disclosed.\n\nFriar called the price almost 50% above March, when OpenAI
    raised $122 billion at $852 billion. The implied step-up is roughly 46.7%, but
    treat it as approximate, because her figure is pre-money and March’s basis is
    unclear.\n\n## Growth Claims Meet a Tighter Market\n\nFriar said OpenAI’s business
    grew 70% quarter over quarter in the third quarter, its enterprise business doubled,
    and revenue splits about 50% each between consumer and enterprise. She cited 1.2
    billion weekly ChatGPT users and an ads run rate of $1 billion by August.\n\nShe
    gave no revenue dollar figures. Asked about the election, she said, “The demand
    for AI is real.”\n\nInvestors still paid less than the earliest reported asking
    price. Rival Anthropic plans to list on Nasdaq in mid-November. Some investors
    now value it at about $1.5 trillion, down from roughly $2 trillion in earlier
    expectations.\n\n## Microsoft Feels This Through GAAP Earnings\n\nMicrosoft closed
    at $530.61, down 0.99%, for a market value of $3.94 trillion. The funding report
    came out around the close, so that move had other causes.\n\nGains on the OpenAI
    stake added $207 million to GAAP net income in the September quarter, compared
    with $3.1 billion in net losses a year earlier. A smaller valuation increase reduces
    future gains on the stake, although that is minor next to 48% Azure growth.\n\n![MSFT
    price target](https://247wallst.com/images/widget-price-target-msft/full?v=ba4fa8eba82c)\n\n##
    NVIDIA Depends on This Money Flowing\n\nNVIDIA rose 2.78% to $186.64 as chip stocks
    rallied, and **Oracle** ([NYSE:ORCL](https://247wallst.com/companies/ORCL/)) added
    0.78%. NVIDIA is still down 21.4% over one month.\n\n![NVDA price target](https://247wallst.com/images/widget-price-target-nvda/full?v=3cf6abf9474a)\n\nNVIDIA
    has said OpenAI’s existing and planned commitments add up to about 12 gigawatts
    of its compute. Management also said frontier labs “are growing faster than what
    their balance sheets and credit profiles can support.” A round that fills in stages
    shows that strain.\n\n![NVDA analyst ratings](https://247wallst.com/images/widget-analyst-ratings-nvda/full?v=4bbf5c49436a)\n\n##
    What OpenAI’s Smaller Round Means for AI Stock Investors\n\nThe optimistic view
    is that demand still exceeds supply. Microsoft says it has more demand than capacity,
    and NVIDIA guided to $108.0 billion in third-quarter revenue.\n\nThe bearish argument
    depends on financing. Private valuations can drop further, the second portion
    may close below full size, and a weak Anthropic debut could pull both labs’ valuations
    down.\n\nMicrosoft looks less exposed to OpenAI’s funding pace than NVIDIA, because
    OpenAI affects its accounting gains far more than the cloud business behind its
    earnings. NVIDIA is more exposed to how well the labs can raise money.\n\nTwo
    milestones will test this view: whether OpenAI’s round reaches $20 billion, and
    whether NVIDIA meets its guidance when it reports on Tuesday, November 17.\n\n_Contact
    [[email&nbsp;protected]](/cdn-cgi/l/email-protection#)
