  text: 'Maybe. The problem with the MCP economy is that it&#x27;s not clear yet what
    shape it can take. If it takes the shape of API integration solutions, then it
    won&#x27;t be 5x. If it takes the shape of an App Store, then yes.<p>I think arguments
    for either direction are valid. On one hand, MCPs are <i>essentially</i> APIs
    used by developers. Developers will demand some form of open reusable standard,
    &quot;MCP gateways&quot; or hosts will spring up to host them, hyperscaleres will
    offer them, and ultimately it will be another cloud commodity.<p>On the other
    hand, some of the target users of MCPs is the consumer market rather than the
    developer market. An App Store model makes sense there and the provider&#x2F;platform
    can collect the lucrative 30% cut and end consumers’ numbers makes for massive
    revenue opportunity. This dictates a walled garden &quot;Agent&quot; like Muse
    or Instant.<p>If #1 is the direction the market goes in, then more batteries-included
