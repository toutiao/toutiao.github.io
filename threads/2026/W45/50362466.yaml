  author: adrian_b
  text: 'The author did not really find from where SIMULA 67 had taken &quot;new&quot;.<p>In
    November 1965, C.A.R. Hoare published an extremely influential paper: &quot;Record
    Handling&quot;. This was a proposed extension for the successor of ALGOL 60.<p>Almost
    all of the features that were added in SIMULA 67 over its predecessor, the SIMULA
    language, come directly from the paper of Hoare, with two big exceptions: class
    inheritance and the &quot;virtual&quot; procedures, which were invented by the
    SIMULA 67 creators (Kristen Nygaard &amp; Ole-Johan Dahl) and which are essential
    for object-oriented programming.<p>The SIMULA 67 keywords &quot;class&quot; and
    &quot;new&quot; were taken from Hoare&#x27;s paper (Hoare actually had taken &quot;class&quot;
    from COBOL 60, which used a very different terminology in comparison with ALGOL
    60, among the many differences being the use of &quot;class&quot; instead of the
    &quot;type&quot; used by ALGOL 60).<p>Hoare&#x27;s paper discussed a lot of programming
    language features, most of which were new, including defining structured types
    with constructors and destructors, discriminated unions (taken from John McCarthy),
    enumerations, the NULL pointer and many others.<p>SIMULA 67 was one of the first
    languages which implemented many of the features proposed by Hoare. Other languages
    that implemented some of the proposed features were IBM PL&#x2F;I, ALGOL 68, then
    a couple of years later, in 1970-11, Pascal.<p>The keyword &quot;new&quot; had
    already been used for the first time by Niklaus Wirth, but at Wirth it had a different
    meaning than at Hoare. It declared a variable that was local to a block, which
    would hide any old variable with the same name that had been declared outside
    that block. So &quot;new&quot; at Wirth was equivalent with &quot;auto&quot; and
    &quot;register&quot; of the language C.<p>Later, in the language Pascal, Wirth
    abandoned his original use of &quot;new&quot;, replacing it with the &quot;new&quot;
    introduced by Hoare.'
