  author: dgrunwald
  text: 'But it&#x27;s possible for `delete tmp;` to call a user-defined `operator
    delete()` in the derived class! <a href="https:&#x2F;&#x2F;godbolt.org&#x2F;z&#x2F;hvePa6jMP"
    rel="nofollow">https:&#x2F;&#x2F;godbolt.org&#x2F;z&#x2F;hvePa6jMP</a><p>The way
    this works under the hood is that every polymorphic class has two destructors
    (so two destructor entries in the vtable): the &quot;complete object destructor&quot;
    is the ~A() you know from C++, and then there&#x27;s also the &quot;deleting destructor&quot;
    which combines ~A() + delete.<p>So the deleting destructor can call free() while
    knowing the derived object size, even for a delete-via-base-class-pointer.'
