  author: OskarS
  text: I don&#x27;t know what the exact impact would be, but it&#x27;s certainly
    not zero, and multiplied by every malloc, it adds up. My point is mostly that
    the API for malloc()&#x2F;free() is designed in such a way to both limit the kind
    of implementations you can make for it, and make most implementations a tiny bit
    slower than they need to be.<p>BTW, when malloc() takes 10,000 cycles, you&#x27;ve
    either hit some weird edge case in an allocator or (much more likely) malloc()
    has run out pages it can use to hand over to the application and has to ask the
    kernel for more memory. I measured malloc() for a recent change in one of our
    products, and in my test the median time was less than 100ns. malloc() is usually
    very fast. But with a better API, it could be faster. Multiplied by every memory
    allocation on every computer in the world (more or less) for the last half-century,
    it&#x27;s becomes a very big number.
