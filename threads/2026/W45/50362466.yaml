  author: adrian_b
  text: 'Many allocators must keep 2 sizes for every allocated object: the size of
    the allocated memory and the size actually occupied by the requested object.<p>Some
    allocators keep other extra information for each object. Thus they need all that
    information and if the &quot;memory free&quot; function gives them only the size
    of the object, that is not enough.<p>Since the size is not enough, it is superfluous
    for the user program to provide it. When given a pointer to an object, the memory
    allocator will know where to find all the associated data. It might be in the
    cache line that is immediately before the pointed memory, or it might be in an
    array, at an index that can be deduced somehow from the value of the pointer,
    or all the information might be implicit, e.g. when objects are allocated from
    stacks of objects of the same size, when the size can be deduced from the pointer
    value, so it is not stored anywhere.<p>Therefore the correct definition for a
    memory free function is to have only a pointer as parameter, to give freedom to
    the allocator to use whichever strategy is deemed better.'
