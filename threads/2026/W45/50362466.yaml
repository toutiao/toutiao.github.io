  text: |-
    In C++, the destructor doesn&#x27;t call free() because the destructor doesn&#x27;t know if it&#x27;s on the stack or heap.<p>Consider:<p><pre><code>    void f(){
            A* tmp = someFunction(stuff);
            foo(tmp);
            delete tmp;
        }

        void g(){
            A tmp; &#x2F;&#x2F; destructor will be called, but no free&#x2F;delete
        }
    </code></pre>
    What is the size of A? Answer: you never know in C++ due to polymorphism. It might be a B or other subclass. It is truly a variable length operation.<p>And secondly, the destructor cannot tell if it&#x27;s f() or g()
