  author: OskarS
  text: "&gt; Not only that, mfree() receives the size of the object it is deallocating,
    <i>as it should</i>.<p>I&#x27;ve always thought that one of the biggest tiny mistakes
    in the history of this industry. It means, more or less, that you&#x27;re forcing
    the memory allocator to keep track of these sizes when it shouldn&#x27;t have
    to. There&#x27;s virtually no sensible case where the person calling free() doesn&#x27;t
    know the size of the allocation, so now we&#x27;re keeping that book-keeping twice,
    in &quot;user-space&quot; and inside the memory allocator. Like, think about the
    cases when you&#x27;d call malloc:<p>* For allocating a single object of type
    T, the size is just `sizeof(T)`, so you can just pass that to free()<p>* For allocating
    an array of objects, the size is `count * sizeof(T)`, and I can&#x27;t think of
    a single time where you DON&#x27;T know what `count` is. It&#x27;s either statically
    sized (in which case it&#x27;s just a constant), or if you have a dynamically
    growing array, you need to keep track of the reserved space to know when you reallocate.
    If nothing else, you need it for bounds-checking.<p>* For chunks of raw memory,
    you also presumably know when deallocating what the size of the raw memory you
    allocated is, for the same reasons as the previous point. Like, just having a
    raw char* pointer lying around with no size information is just terrible C practice.<p>If
    you truly don&#x27;t know the size of your allocation (very hard to imagine when
    this would ever happen), you should be forced on the user-side to keep track of
    it somehow, not delegate that to the allocator.<p>It&#x27;s a tiny amount of overhead,
    but it&#x27;s for EVERY SINGLE MEMORY ALLOCATION since like 1975. Imagine how
    many times malloc() and free() has called since then! How much electricity, CPU
    usage, and memory has been wasted! It boggles the mind!"
