  author: Veserv
  text: No, having the size would be immensely useful. Consider the standard allocator
    design.<p>You have a fixed number of small-size block allocators (say 8-256 bytes)
    and then a sequence of exponentially-sized large block allocators.<p>For small-size
    block allocators you want limited allocator overhead, limited over-allocation,
    high speed, and likely the ability to support certain alignments like 8, 16, and
    64 (cache line). Attaching a requested size and actual size (or even just one)
    to every block would be tremendous overhead.<p>For large blocks you care less
    about allocator overhead and over-allocation since it is less overhead as a percentage.
    So, attaching requested size and actual size to every block is a small cost. However,
    you likely also want the ability to support certain alignments like 4K, 16K, 2MB,
    etc. (natural hardware or OS sizes).<p>So, you generally want two distinct strategys
    and bookkeeping mechanisms based on the size of the allocation. If deallocation
    does not take the requested size, then your very first problem is figuring out
    which mechanism you are using. The problem with this is that you want small-size
    allocations to have small overhead, so the discrimination mechanism must also
    be small-overhead.<p>If you pass in the requested size, then it becomes trivial
    to distinguish with zero allocator overhead. Is it less than 256 bytes (or whatever
    small size you choose)? Cool, it is small-size. Round up to the nearest small-size
    block. Release the memory to the identified small-size block allocator. This has
    zero per-block overhead, is totally trivial, extremely fast, and preserves alignment.<p>If
    the allocated size is in the large-block regime, then you know you can use a per-block
    overhead scheme. Except, this is still better. If you do not know the requested
    block size, then you are limited to either a header at negative offset or a auxiliary
    data structure keyed on the pointer value to determine the actual size. The former
    messes with your alignments and the latter requires the allocator to be stealing
    unrelated memory for its own data structures. If deallocation tells you the requested
    size, then you can easily use a footer scheme instead. Just always over-allocate
    enough space for a footer and then you can always just jump forward by the requested
    block size to find the footer and you do not mess up your alignments.<p>Getting
    the requested size, which the caller is basically always already remembering via
    type information, gives you a lot of advantages and optimization levers.
  score: 0
