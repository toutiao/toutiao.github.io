  text: '&gt; Many allocators must keep 2 sizes for every allocated object<p>And wouldn&#x27;t
    it be nice to just make them keep one number! That&#x27;s a size_t and a couple
    of cycles saved for every malloc()!<p>I will say, this is not some far-out niche
    idea of mine, it&#x27;s basically universal for all &quot;new&quot; implementations
    of memory allocators to require exactly this information for deallocation. There&#x27;s
    a reason Zig allocators take a slice and not a pointer [0], why std::pmr::polymorphic_allocator::deallocate
    takes a size [1] and why Rust allocators require it as well (in the layout param)
    [2]. It&#x27;s just a better API design.<p>EDIT: for C++, the better reference
    is the Allocator named requirement, which the polymorphic allocator is just one
    example of. But you can see it there as well in the deallocate() method [3]<p>[0]:
    <a href="https:&#x2F;&#x2F;ziglang.org&#x2F;documentation&#x2F;master&#x2F;std&#x2F;#std.mem.Allocator.rawFree"
