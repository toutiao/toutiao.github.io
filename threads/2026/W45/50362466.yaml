  text: "&gt;  What is the size of A? Answer: you never know in C++ due to polymorphism.
    It might be a B or other subclass. It is truly a variable length operation.<p>You
    could easily go around it.<p>The compiler <i>knows</i> when creating the destructor
    for B.<p>In your example, to have <i>correct</i> C++, you <i>need</i> to have
    declared a virtual destruct-or for B. You could encode the size of B in a static
    offset from the virtual destructor or simply as a return value from it.<p>This
    is not how it is done now, mainly because how <i>free</i> was designed in C.<p>free()
    design is a terrible mistake. Probably one of the worst design mistake of C with
    the null terminated &#x2F; no-length specified string and the preprocessor."
