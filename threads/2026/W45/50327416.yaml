  author: bradknowles
  text: This is not new.  Back when I worked at the Defense Information Systems Agency
    in the basement of the Pentagon (1989-1995), there was a point when we suddenly
    had a whole bunch of strange guys come into our DISAnet LAN datacenter room.  I
    recognized one of the guys, who was part of the ASSIST.MIL CERT team, and I had
    just helped them get their domain online in the span of one week.<p>He quietly
    told me “These guys don’t exist.  We were never here.”  I still had my TOP SECRET&#x2F;SCI
    clearance at the time, and so I knew what that meant.  I didn’t ask any questions.<p>About
    a month later, he told me why they were there.  Everybody from the FBI, DIA, NSA,
    and some other agencies I don’t remember, were all investigating this one senior
    GS-whatever manager.  Turns out he had filled up the hard drive on his desktop
    computer with highly illegal porn.  Then he decided to fill up the hard drives
    on all the servers with more highly illegal porn.<p>For a brief period of time,
    all of the servers we had in that room were unable to do their normal job for
    all of the DISA employees in the building, because their hard drives were full.<p>I
    don’t know what kind of crimes they convicted that guy of, but those servers were
    archived, wiped, and restored from backup pretty quickly.
