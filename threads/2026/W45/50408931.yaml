  text: 'Sorry for the shameless plug but I would really love some feedback and discussion
    on some of the features in the code forge I am building.<p>1. Hunk checkpoints
    - If it&#x27;s a moderately sized PR (which most of the agentic PRs nowadays are),
    I as a developer find myself like to think in terms of hunks whether I finished
    reviewing that part or not. GitHub allows you to mark only files as reviewed and
    nothing else.<p>2. I am trying to add semantic diffs to code reviews. That way
