  text: '&gt; A PR centric cycle is like being in a factory and standing next to a
    conveyor belt of PRs. Humans can&#x27;t possibly review properly.<p>Then something
    is either wrong with your conception of PRs or whatever process you have been
    submitted to. PR is asking for feedback from people that already understand the
    software. It&#x27;s also a learning place for anyone that is not yet familiar
    with the part being modified. So you have the author, the reviewers, and the learners.
    Which is three separate sets of people.<p>The PR review itself shouldn&#x27;t
    take a lot of time (10mn is already a lot), because it&#x27;s either a small change
    which is easily understood[0] or it&#x27;s a more complex one [1] that should
    have a design discussion thread attached. This discussion is orthogonal to the
    code itself. Both should have a description good enough for the reviewer to have
    an idea why the change is necessary before looking at the code.<p>So a PR is an
    exchange of ideas around a real artifact, the code. If no idea is being exchanged,
    then it&#x27;s merely a gatekeeping activity.<p>[0] <a href="https:&#x2F;&#x2F;cgit.freebsd.org&#x2F;src&#x2F;commit&#x2F;?id=73b1453e6d87f9af4c4761049640c238fcee3bcd"
