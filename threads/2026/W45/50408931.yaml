  author: wizardmeridian
  text: Individual files, for sure. I feel like plenty of times You have a changeset
    that involves an new&#x2F;updated internal helper module of some kind, and also
    changes&#x2F;additions to other places that use it, and its helpful to see them
    in a particular order, but file or folder hierarchies put things into a different
    order. I feel like a PR comment along the lines of &quot;Look here [link-to-file]
    first&quot; happens more than occasionally on my team.<p>As for changing the display
    of hunks within one file, I think that could be interesting for a couple reasons
    (but I totally get that could be obnoxious to both build and present a UI for).
    I can try to dig up an example later, but off the top of my head there&#x27;s
    two situations I&#x27;ve seen infrequently this might help with? (I&#x27;m sorry
    if I&#x27;m vague - I cannot share any of the code I do for work, which is 99%
    of the PRs I deal with).<p>1. A specific file was refactored in such a way that
    code was moved, deleted, and added, and the interpreted hunks together are intermingled.
    I feel like I see diffs where it&#x27;s hard to tell what&#x27;s going on because
    there are delete&#x2F;addition&#x2F;delete&#x2F;addition blocks alternating, but
    they form separate contexts&#x2F;actions (and often have different indentation
    levels or other styling quirks) it&#x27;s just the diff algorithm displaying them
    poorly that is causing the problem. This is normally the spot where I might switch
    between a side-by-side diff viewer and a unified viewer, but sometimes neither
    is good. (This could probably be solved with more careful individual commits,
    although sometimes this is unavoidable).<p>2. We have a few large modules (singluar
    classes in 2000+ln files) that often have a wide public interface, with multiple
    functions eventually calling the same internal helper (a trivial example would
    be a multiple separate search functions providing different kinds of windows&#x2F;orderings&#x2F;etc
    of a data source, sharing an private function that really does most of the main
    work), but this private function is not first in the file. It&#x27;d be helpful
    to order this to be seen first - &quot;here&#x27;s what I changed&#x27; followed
    by &#x27;here&#x27;s how it is used now&#x27;.<p>Maybe what I want could just
    be solved with a commit-by-commit ordering of things, but just showing multiple
    commits together on screen, with later commits coming further down the page (as
    opposed to showing the whole unified diff of a group of commits - Github does
    that, and that is pretty much never what I want other than &#x27;what&#x27;s changed
    since I last saw this&#x27;).<p>I can attempt to find some specific examples later
    this week and try to explain these situations clearer if the above is confusing.
