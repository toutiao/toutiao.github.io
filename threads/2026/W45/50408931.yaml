  text: I don’t believe that nobody is doing it well. May I ask who is doing it well?
    Either in house or with an AI reviewer vendor.<p>For me, what works is highly
    templated directory structure and rules that linters can quickly check and enforce.
    Every PR is a cookie cutter design filled in. There are only a handful of things
    you need and they’re all just CRUD at the end of the day. You can employ the same
    very few design patterns and primitives across a lot of your stack. Review is
    so fast, if you trust your CI to do its job and the developer to actually QA their
    own work.<p>What isn’t working is the sheer volume of PRs. Even with CODEOWNERS
    directing attention to only high impact changes, it is a constant distraction.
    I’m not sure how to handle SOC2 where we need a human reviewer on all code. Lastly,
    agents shit the bed when they touch spaghetti, esp when it’s sitting next to structured
    patterns. IME, the best way to get around this is to just rewrite features from
    scratch. But in this current world of instant completion and reward, it’s been
    challenging to convince people to commit to more ambitious lifts.<p>Finally, I
    want review more than ever. A team can’t keep up with the pace of change even
    if it was all perfect. I like the idea of more up front planning, but the code
    is ultimately what matters.
