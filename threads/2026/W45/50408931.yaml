  author: sickcodebruh
  text: 'Been using Graphite all year. I had trouble adapting my GitHub mind to it
    at first and I still don’t love everything about Graphite, but _wow_ is Graphite’s
    PR review page organized better than GitHub. GitHub’s new PR stack is superior
    (atomic merges are life-changing) and having one fewer tokens to manage CLI to
    install is fantastic, but I’m still mostly Graphite because the page is just organized
    better.<p>Specifically, graphite wins on:<p>- I land on the page and immediately
    see an overview of my whole PR stack: what’s in the stack, what’s passing, what’s
    failing, what’s draft, unresolved and total comments. I know exactly where to
    spend my time. GitHub PR stacks offer no such convenience.<p>- Description is
    below stack details, then code, and I never have to switch tabs or pages. This
    hierarchy makes sense: top of the page is broad whole stack details, and as we
    go down we get more specific. GitHub forces me to jump between pages to see all
    of this.<p>- Comments in a drawer are nice. Being able to quickly scan them helps
    me get a sense of what’s there, who’s commenting, I can jump between them quickly.<p>-
    Approval, request, labels, etc are also logically oriented at the top near other
    metadata. GitHub sprawls this around the page. It’s especially rough on mobile
    browser.<p>I just checked the new overview. It’s a step up. Curious to see if
    it helps the PR stack experience. I’d love to fully migrate off Graphite, the
    non-atomic merge is truly a nightmare across a large stack, but at the end of
    the day I haven’t been able to give up the UX gains of managing my work on Graphite
    compared to GitHub.'
