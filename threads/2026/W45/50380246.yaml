  text: I may be misremembering this, but the desire to move missiles around may be
    downstream of the START and New START arms limitation treaties.<p>These give the
    US and Russian governments what are supposed to be adequate inspection regimes
    to <i>count</i> the number of active missiles, but of course make no requirement
    on the signatories to make it easy to <i>locate</i> all the missiles at any given
    moment.<p>So there’s a strong strategic incentive to shuffle them around between
    treaty-mandated inspections.
