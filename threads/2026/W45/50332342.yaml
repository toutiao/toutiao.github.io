    # KatamariMet

    Roll up the Metropolitan Museum of Art.

    Every single thing in this gallery is a real object from The Met's Open&nbsp;Access collection, at its real size. Start small. Coins, thimbles, netsuke. End with the Temple of Dendur.

    Loading the collection…

    This is a project by [Jay Mollica](https://www.jaymollica.com). Objects: The Metropolitan Museum of Art, Open Access (CC0). The building is traced from the Met's floor plans; wall and floor textures come from photographs on Wikimedia Commons; music by Kevin MacLeod (CC BY 4.0). [All credits](#).
