  author: erentz
  text: I feel like whenever S230 comes up and I see people defending it I get confused
    because the defense doesn&#x27;t seem to address what seems to be the concern
    of the people saying it needs removing (or more realistically reforming).<p>The
    concerned is one of consistency in how media is regulated. E.g. Facebook, is the
    worlds largest media company, and it truly acts and behaves as a publisher now.
    It acquires its content from an army of paid and unpaid providers. They may be
    individuals, often they are influencers, often they may be nefarious agents and
    companies. It then decides how to place that content in it&#x27;s &quot;publication&quot;,
    which just happens to be an app and website. It goes out and tells the market,
    &quot;I have this great publication in which you can place ads!&quot;. It then
    sells ads to those people, and makes a decision on how to place those advertisements
    inside its publication alongside that content that it acquired.<p>So how is it
    not a publisher? And why should it be regulated to any kind of different standard
    from other publishers?
  score: 0
