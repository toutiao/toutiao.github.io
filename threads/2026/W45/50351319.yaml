article:
  url: https://dfarq.homeip.net/charles-tandy-the-mastermind-behind-radio-shack/
  title: Charles Tandy, the mastermind behind Radio Shack - The Silicon Underground
  fetch_status: success
  content: "[Home](https://dfarq.homeip.net/) » [Retro Computing](https://dfarq.homeip.net/category/retro-computing/)
    » **Charles Tandy, the mastermind behind Radio Shack**\n\n [Dave Farquhar](https://dfarq.homeip.net/author/admin/
    \"Dave Farquhar\") [Retail](https://dfarq.homeip.net/category/retail/), [Retro
    Computing](https://dfarq.homeip.net/category/retro-computing/) [](https://dfarq.homeip.net/charles-tandy-the-mastermind-behind-radio-shack/
    \"6:00 am\") [0 Comment](https://dfarq.homeip.net/charles-tandy-the-mastermind-behind-radio-shack/#respond)\n\nCharles
    David Tandy was the chairman of the board, president, and chief executive officer
    of the Tandy Corporation. He was born May 15, 1918 and died November 4, 1978.
    Tandy was involved in the creation or expansion of three retail chains: Tandy
    Leather, Radio Shack, and Pier 1 Imports.\n\n## Early life\n\n[![a black and white
    photo of Charles Tandy](https://i0.wp.com/dfarq.homeip.net/wp-content/uploads/2026/03/CharlesDavidTandy.jpg?resize=216%2C300&ssl=1)](https://dfarq.homeip.net/?attachment_id=41325)\n_Charles
    Tandy was instrumental in creating three retail empires: Tandy Leather, Pier 1
    Imports, and Radio Shack._\n\nTandy was the second of three children born to Carmen
    (née McLain) and David Lewis Tandy in Brownsville, Texas, on May 15, 1918. Charles’
    youngest brother, Bill, went on to run his own chain of leather craft stores in
    the early 1950s before merging with Tandy Corporation.\n\nAt the age of 10, Charles
    and a classmate started selling scraps of leather from his father’s store to classmates
    for spare change, teaching them how to make belts out of them. With another classmate
    whose father owned a boot company, they started making heavier belts from scraps
    of boot leather that they sold to department stores.\n\nIn 1935 Tandy graduated
    from Central High School in Fort Worth, Texas.\n\n## Charles Tandy’s education
    and early career\n\nTandy’s father co-owned the Hinckley-Tandy Leather Company
    with his friend Norton Hinckley.\n\nAfter flunking out of Rice Instutute in his
    freshman year, he graduated from Texas Christian Academy in 1940. While in college,
    he sold women’s shoes. He attended Harvard Business School but did not graduate.
    In the spring of 1941, the Navy offered commissions to Harvard Business School
    students. Tandy applied and was accepted, serving 6 years.\n\nWhile in the Navy
    he set a record for selling war bonds. In 1945, he married Gwen Johnston, a wealthy
    widow 14 years his senior.\n\nWhile he was in the Navy, he observed patients recovering
    in Navy hospitals doing leathercraft for therapy and recreation. He wrote a letter
    to his father suggesting this might be a way to expand Hinckley-Tandy’s business
    after World War II ended. This led to them setting up a mail order business, Tandycraft,
    after he left the Navy.\n\nTandy developed his small family leather business into
    an international corporation. He first turned it into a leather craft company
    when shoe rationing in World War II almost killed the business, and later expanded
    into selling leather and tools to make such products as wallets. Hinckley and
    Tandy split in 1950, with Hinckley taking the part of the business that sold shoe
    findings, and Tandy taking the leathercraft business.\n\n## Taking Tandy Corporation
    Public\n\nIn 1954, David Tandy suffered a heart attack, exposing a weakness in
    the corporate structure. Since Tandy was a private company, his death would have
    forced a liquidation of the company in order to pay the inheritance taxes. They
    sought a way to take the company public to protect it. The company wasn’t really
    large enough to conduct a traditional IPO, so instead, they sought to merge with
    a company that was already listed on the New York Stock Exchange. After shopping
    around for prospects, Charles Tandy engineered a leveraged buyout of the Tandy
    Leather Company by the American Hide and Leather Company, based in Boston, in
    1955.\n\nThe Tandys and their leadership didn’t agree with the direction American
    Hide and Leather took the company after the merger. A power struggle ensued, resulting
    in the Tandys, their extended family, and Tandy managers buying as much stock
    in the company as they could, often using borrowed money. In 1959, they forced
    a proxy battle to take over the company. As a result, Tandy partisans received
    five of the nine seats on the board. They quickly divested three unprofitable
    subsidiaries American Hide and Leather had purchased after merging with Tandy,
    moved the corporate headquarters to New York to facilitate the divestitures, then
    moved operations to Fort Worth. In 1960, they changed the name to Tandy Corporation,
    taking the ticker symbol TAN.\n\n## Pier 1 Imports\n\nBy 1962, Charles Tandy had
    concluded he had ambitions bigger than the leather craft business could satisfy.\n\nOne
    of the businesses they looked into was Cost Plus Imports, which sold imported
    furniture and other goods out of a converted warehouse at near-wholesale prices.
    A failed public offering left the company in a cash crunch. Charles and Gwen were
    already planning a vacation to San Francisco in August 1962, so they visited the
    store as part of the trip. They found a 15,000 square foot store, several times
    larger than a Tandy store, selling $7-$8 million worth of merchandise per year
    when a Tandy store might sell $200,000. Tandy called one of his lieutenants, Luther
    Henderson, to come visit the store.\n\nTandy bought into the business, acquiring
    with it the right to operate stores under the Cost Plus name under Henderson’s
    leadership. But the partnership only lasted three years. Tandy found the business
    model worked well for one giant store in San Francisco, but needed substantial
    adjustment to work as a chain throughout the country. In 1965, they parted ways,
    with the Tandy-backed operation taking the name Pier 1 Imports.\n\nBut Henderson
    and Tandy found the way Tandy operated its leathercraft stores didn’t fit the
    furniture business, with its longer lead times. In 1966, Tandy sold Pier 1 to
    Henderson for $1.8 million.\n\nHenderson and Tandy remained friendly, with Tandy
    even taking a seat on Pier 1’s board. Tandy chided Henderson, asking why they
    didn’t run the company that way when it was part of Tandy Corporation. The 1992
    book Tandy’s Money Machine quoted Henderson as saying Tandy was a good mentor
    but he didn’t take the time to understand the differences between Pier 1’s and
    Tandy Leather’s business models. Given more room, Henderson thought the partnership
    could have worked.\n\n## Radio Shack\n\nCharles Tandy saw the electronics business
    as a natural expansion for Tandy Corporation, another hobby with a similar business
    model. He approached Lafayette Electronics and Allied Electronics to no avail.
    So in 1961, he opened an electronics store called Electronics Crafts, soon opening
    a second and a third.\n\nMeanwhile, in Boston, the same bank that had helped Tandy
    match up with American Hide and Leather had another creditor who was having trouble
    meeting its obligations, an electronics store called [Radio Shack](https://dfarq.homeip.net/how-tandy-bought-radio-shack/).
    The bank had told Tandy about Radio Shack before, when he was talking with Lafayette
    and Allied. Tandy wasn’t able to work with Milton Deutschmann, the head of Radio
    Shack, but with the company $7 million in debt and losing $200,000 a month, the
