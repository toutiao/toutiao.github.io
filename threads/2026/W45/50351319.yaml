  text: "&gt; ...but more importantly available a few miles away within practically
    any city.<p>We&#x27;re around the same age and likely have similar memories. I
    poured over Radio Shack catalogs and weekly ads when I was a kid. When my family
    went to the local mall I&#x27;d make a beeline for the Radio Shack and play w&#x2F;
    the various computers there until my parents pried me away.<p>When I started doing
    PC tech work (in rural Western Ohio in the late 90s) it was always an option,
    no matter how far out in &quot;the sticks&quot; you were working, to drive to
    a Radio Shack for emergency parts. They might not have exactly what you needed,
    and you&#x27;d probably pay a hefty price, but you could get the job done.<p>That
    ubiquity definitely left an impression on IT technicians of my generation. I was
    recently doing some work w&#x2F; a legacy system that called for some serial gender-bender&#x2F;null
    modem cables. Not having any handy I had to improvise with some DE-9 to RJ-45
    hoods and creative crimping to get what I needed. A cow-orker commented &quot;We
    used to be able to just go to Radio Shack when we needed stuff like that in a
    hurry.&quot;"
