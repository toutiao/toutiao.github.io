  author: chasil
  text: 'I think their cash registers ran SCO Xenix. I ran the free version on my
    desktop at work for a few months in the late 90s (I think that I still have the
    installation media).<p>They had the same virtual console behavior as we see in
    Linux.<p>I had a friend who worked in one of the stores, and I scared the daylights
    out of him by hitting Ctrl-Alt-F4 on his cash register to get a login. After switching
    back to F1, he learned the scary trick himself. I have no idea why all of the
    gettys were enabled in &#x2F;etc&#x2F;inittab.<p>Edit: I had no idea about Pier
    1 (rest in peace), the 1959 proxy battle for the family takeover, Tandy&#x27;s
    sale of Pier 1 in 1966, Tandy&#x27;s purchase of a controlling interest in the
    failing Radio Shack for $300k, Tandy&#x27;s abrasive management style, or his
    early demise at 60 from a heart attack.<p>Peir 1 folded just as we entered the
    COVID pandemic.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pier_1_Imports"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pier_1_Imports</a>'
