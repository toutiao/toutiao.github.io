  author: ssl-3
  text: 'The cheapest price Digikey shows me for shipping a single 1&#x2F;8W 1k through-hole
    resistor is $4.99.  That&#x27;s a very expensive, very mundane resistor.  It will
    not be delivered swiftly: I&#x27;ve had orders made on the same day show up faster
    from AliExpress sellers in China than the cheap shipping from Digikey and Mouser.<p>I
    used to get assortments from Radio Shack with dozens of mundane resistors for
    a few dollars.  That was also expensive per-part, but the convenience of have-it-now,
    cash-and-carry has a price.<p>Today, I can order a kit with 1,000 1&#x2F;8W resistors,
    of 50 different values, for $7.99 from Amazon.  I can build any specific resistor
    value I want with that kit.  It will show up tomorrow, but if I&#x27;d looked
    earlier in the day then I&#x27;d have found that I could have it yet today for
    an extra $3.<p>Or:  I can get an assembled <i>book</i> of 2900 1&#x2F;8W through-hole
    resistors from AliExpress.  145 values, in pockets with plainly-readable labels,
    one value per pocket, all wrapped up in durable-enough 6-ring binder.  That&#x27;s
    $25 and ships free; I&#x27;d expect it to arrive in a week or two.<p>---<p>So
    what I&#x27;ve done for noodling around at home is buy inexpensive assortments.  In
    this way, I&#x27;ve already got resistors in stock at home.  And capacitors, diodes,
    transistors, and even jellybean ICs -- along with a better selection of small
    metric stainless hardware than Ace Hardware offers.  I don&#x27;t miss Radio Shack
    for these parts, and I&#x27;m done paying 53 cents for each M3 x 10mm screw at
    the hardware store.<p>It did not cost very much to procure this stuff (and I bought
    it slowly over time, as-needed, which spread out the expense and avoided effort
    to forecast need), and it doesn&#x27;t take up much room to keep it around.<p>It&#x27;s
    pretty good to be able to build a thing on a whim.'
