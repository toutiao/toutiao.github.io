article:
  url: https://www.cnbc.com/2026/11/04/stock-market-today-live-updates.html
  title: 'Stock market today: Live updates'
  fetch_status: success
  content: "Traders work on the floor of the New York Stock Exchange (NYSE) in New
    York, US, on Wednesday, Nov. 4, 2026.\n\nMichael Nagle | Bloomberg | Getty Images\n\nStocks
    plummeted on Thursday, erasing the [sharp gains](https://www.cnbc.com/2026/11/03/stock-market-today-live-updates.html)
    from the rally seen in the wake of the [U.S. midterm elections](https://www.cnbc.com/2026/11/03/midterm-elections-2026-live-updates.html),
    as investors accelerated their move away from technology stocks on fears of a
    data-center buildout slowdown.\n\nThe [Nasdaq Composite](/quotes/.IXIC/) declined
    5.2% and dipped into correction territory, trading more than 10% below a record
    set last month. The [S&P 500](/quotes/.SPX/) was down 4.1%, heading for its worst
    day since April 2025. The [Dow Jones Industrial Average](/quotes/.DJI/) shed 1,728
    points, or 3.2%. The Dow erased about all of its advance from Wednesday's massive
    postelection rally. The small-cap [Russell 2000](/quotes/.RUT/) index decreased
    4.5% and also entered a correction.\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nNasdaq
    Composite, 5-day\n\nStocks related to the artificial intelligence trade, particularly
    those linked to the chips industry and data centers, slid for a second day. Investors
    fear that a Democratic sweep of both chambers of Congress as well as victories
