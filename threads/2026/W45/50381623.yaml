  content: "Traders work on the floor of the New York Stock Exchange (NYSE) in New
    York, US, on Wednesday, Nov. 4, 2026.\n\nMichael Nagle | Bloomberg | Getty Images\n\nStocks
    plummeted on Thursday, erasing the [sharp gains](https://www.cnbc.com/2026/11/03/stock-market-today-live-updates.html)
    from the rally seen in the wake of the [U.S. midterm elections](https://www.cnbc.com/2026/11/03/midterm-elections-2026-live-updates.html),
    as investors accelerated their move away from technology stocks on fears of a
    data-center buildout slowdown.\n\nThe [Nasdaq Composite](/quotes/.IXIC/) declined
    5.2% and dipped into correction territory, trading more than 10% below a record
    set last month. The [S&P 500](/quotes/.SPX/) was down 4.1%, heading for its worst
    day since April 2025. The [Dow Jones Industrial Average](/quotes/.DJI/) shed 1,728
    points, or 3.2%. The Dow erased about all of its advance from Wednesday's massive
    postelection rally. The small-cap [Russell 2000](/quotes/.RUT/) index decreased
    4.5% and also entered a correction.\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nNasdaq
    Composite, 5-day\n\nStocks related to the artificial intelligence trade, particularly
    those linked to the chips industry and data centers, slid for a second day. Investors
    fear that a Democratic sweep of both chambers of Congress as well as victories
    in key gubernatorial races could [decelerate the data center buildout](https://www.cnbc.com/2026/11/04/ai-stocks-texas-governor-data-centers.html).\n\nFor
    instance, Sen. [Bernie Sanders](https://www.cnbc.com/bernie-sanders/) of Vermont
    — who caucuses with Democrats — has called for a national data center moratorium.
    In a [post on X](https://x.com/SenSanders/status/2118131101562454038?a=sGTFehdEW2IGfUiheqA&s=20)
    Wednesday evening, Sanders wrote that \"Americans don't want Big Tech oligarchs
    wrecking the environment, gutting jobs and threatening humanity's future.\"\n\nChipmakers
    [Broadcom](/quotes/AVGO/) and [Nvidia](/quotes/NVDA/) each fell 8% Thursday, while
    software stock [Oracle](/quotes/ORCL/) moved lower by 7%. Another chip stock,
    [Qualcomm](/quotes/QCOM/), reported earnings that [beat estimates](https://www.cnbc.com/2026/11/04/qualcomm-qcom-earnings-report-q4-2026.html)
    **,** but the stock dropped 10% on a weaker-than-expected earnings outlook. The
    [iShares Semiconductor ETF (SOXX)](/quotes/SOXX/) was down more than 10%, which
    would be its worst day since the Covid-19 breakout of March 2020.\n\nShares of
    neocloud companies also retreated, with [CoreWeave](/quotes/CRWV/) losing 11%
    and [Nebius](/quotes/NBIS/) as well as [Iren](/quotes/IREN/) sliding 16%, amid
    those worries about a [backlash to the industry](https://www.cnbc.com/2026/11/04/data-center-ballot-measures-2026-midterm.html)
    in light of the election results in various states.\n\nInvestors are \"stepping
    away until they get a better sense of the implications of the midterms around
    the AI capex cycle in particular, which is the biggest economic tailwind we've
    had going for us for the last, call it, three years,\" said Tim Holland, chief
    investment officer at Orion. \"It's about tone and tenor from the party that did
    really well, incredibly well, at the federal level and at the state level.\"\n\nThursday's
    selling pressure was so intense that it spread to other parts of the market. Shares
    of industrial giant [Caterpillar](/quotes/CAT/) declined 5%, while financial stock
    [JPMorgan](/quotes/JPM/) fell 4%. Aerospace name [Boeing](/quotes/BA/) and retailer
    [Nike](/quotes/NKE/) pulled back 3%.\n\n\"Unlike yesterday, you're just seeing
    that the sell-off in tech, the size of it, is now feeding itself into the broader
    market,\" said Keith Lerner, chief investment officer at Truist Wealth. \"The
    rubber band is becoming increasingly stretched.\"\n\nOn Wednesday, the Dow [jumped
    more than 1,500 points](https://www.cnbc.com/2026/11/03/stock-market-today-live-updates.html)
    to notch its best day since April 2025 after a decisive midterm win for Democrats.
    The S&P 500 and Nasdaq Composite also popped more than 1% each. Areas related
    to AI were under pressure, however, while economically-sensitive stocks rose.\n\n##
    Wells Fargo raises outlook for McDonald’s\n\n[McDonald's](/quotes/MCD/) jumped
    more than 6% on Wednesday after reporting [better-than-expected earnings](https://www.cnbc.com/2026/11/04/mcdonalds-is-about-to-report-earnings-heres-what-to-expect.html).
    Wells Fargo liked the numbers too.\n\nThe bank reiterated its overweight rating
    on the fast food company's stock in a Wednesday note, and raised its price target
    to $300. That indicates a 7% gain from Wednesday's close. Analyst Zachary Fadem
    said the company's financial report showed numbers that were encouraging.\n\n\"Q3
    cleared a low bar, shares were washed out & MCD cited notable progress on value
    w/ new steps in '27,\" he wrote in the note. \"Skepticism likely persists… but
    [Wednesday's] print is a step in the right direction.\"\n\nIn afternoon trading
    Thursday, shares were pulling back by more than 1%.&nbsp;\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nMcDonald's
    5-day. \n\n— _Davis Giangiulio&nbsp;_\n\n## Tech sell-off drags Nasdaq Composite
    below its 200-day moving average\n\nThe tech-heavy [Nasdaq Composite](/quotes/.IXIC/)
    tumbled more than 5% on Thursday afternoon, sending the index below its 200-day
    moving average for the first time since April.\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nNasdaq
    Composite in the past day\n\nThe [S&P 500](/quotes/.SPX/) is also near its 200-day
    moving average, trading less than 1% from that level. If the broad market index
    were to slip below that threshold, that would mark its first time doing so since
    April.\n\nBig tech players dipping below their respective 200-day moving averages
    include Nvidia, Advanced Micro Devices, Marvell Technology, Micron Technology,
    Sandisk and Cisco.\n\nThe sell-off in the tech sector comes as a Democratic sweep
    in the midterm elections is now raising fears that the data center build-out could
    be in for a slowdown.\n\nWhen an asset or an index trades below its 200-day moving
    average, it suggests that a longer-term downtrend may be unfolding. This is especially
    the case if it closes below the 200-day moving average.\n\n_— Darla Mercado and
    Nick Wells_\n\n## All S&P 500 sectors suffer losses\n\nAll 11 [S&P 500](/quotes/.SPX/)
    sectors were trading in negative territory on Thursday afternoon as selling across
    the U.S. equity market picked up steam.\n\nInformation technology was the biggest
    laggard, dropping 6.6%. The group's declines were then followed by a fall in consumer
    discretionary stocks as well as industrials. Those two sectors were down 4.1%
    and 4%, respectively.\n\nMost stocks in the broad market index were also trading
    lower, as the S&P 500 recorded 419 losers and 84 gainers. The index was last down
    3.9%.\n\n_— Sean Conlon_\n\n## Wall Street’s fear gauge jumps to highest level
    since March\n\nThe [Cboe Volatility Index](/quotes/.VIX/) briefly climbed to 28.09
    Thursday, its highest level since March 31, when it touched 29.64. Currently,
    the VIX is at 26.26.\n\nThe VIX, which measures expected stock-market volatility
    and is often called Wall Street's \"fear gauge,\" last traded above 30 on March
    30, when it reached 31.52.\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nVIX\n\n_—
    Deena Zaidi and Gina Francolla_\n\n## Chip stocks plunge for worst day since March
    2020\n\nTraders work at the New York Stock Exchange on Nov. 2, 2026. \n\nNYSE\n\nChip
    stocks tumbled Thursday, with the [iShares Semiconductor](/quotes/SOXX/) ETF falling
    close to 11%. A closing decline greater than 10.44% marks its worst day since
    March 2020 with every component down more than 6%.\n\nAfter a [Democratic sweep
    of both chambers of Congress](https://www.cnbc.com/2026/11/04/democrats-2026-midterm-election-results.html),
    which could spell more regulation of the AI buildout, stocks tied to the AI trade,
    particularly those linked to the"
