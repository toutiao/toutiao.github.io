    147 days happened all in a row that would mean the nasdaq dropped to 0.25% of
    its original value in about 4 months, which would be catastrophic.<p>The real
    answer is presumably somewhere in the middle, but the specifics are what determines
    if it&#x27;s worth noting or not.
