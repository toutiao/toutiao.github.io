  author: hedgerow-dev
  text: Fair point and I agree, Shodan isn&#x27;t the only source. For the reason,
    for Danfoos the login page comes straight from the firmware package that Danfoss
    publishes. It&#x27;s byte for byte identical, so it hashes the same as thousands
    of real units. Dixell was matched against Shodan records, so that one is weaker,
    you’re right.<p>The datacenter IP is the bigger tell. Real controllers sit on
    shop or ISP connections. Moving one decoy onto a residential line is on my list.<p>Along
    the way I did some hunting for vulnerabilities on the Danfass units, quite interesting
    stuff actually.
