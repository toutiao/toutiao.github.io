  author: throw0101d
  text: '&gt; <i>The read-write head has 32 read-write elements. Each element contains
    a write component sandwiched between two read components – one for reading, the
    other for read-after-write checking. The overall read-write head reads or writes
    32 adjacent tracks at once. This group of 32 adjacent tracks running the length
    of the tape is called a wrap. The write tracks are partially overlapped, leaving
    a clearly readable read track, narrower and in the middle of its write track.
    This track overlapping is called shingling after shingled roof tiles, and is a
    way of cramming more write tracks into a data band to increase the tape’s capacity.</i><p>*
    <a href="https:&#x2F;&#x2F;www.blocksandfiles.com&#x2F;tape&#x2F;2025&#x2F;07&#x2F;29&#x2F;why-lto-10-fell-short-on-speed-and-backward-compatibility&#x2F;1588360"
    rel="nofollow">https:&#x2F;&#x2F;www.blocksandfiles.com&#x2F;tape&#x2F;2025&#x2F;07&#x2F;29&#x2F;why-lto-10-fe...</a><p>&gt;
    <i>The tape drives use a strong error correction algorithm that makes data recovery
    possible when lost data is within one track. Also, the head assembly includes
    separate read heads positioned just &quot;behind&quot; each write head, to verify
    the data just written without making a separate verification pass. This allows
    the drive to write a second copy of any data that fails the verify without the
    help of the host system.</i><p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Linear_Tape-Open#Logical_structure"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Linear_Tape-Open#Logical_struc...</a>'
  score: 0
