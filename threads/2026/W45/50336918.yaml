  author: GuB-42
  text: Done right, cloud backup actually is &quot;the right thing&quot;.<p>There
    are problems with cloud backups, but they are solvable. One is confidentiality&#x2F;privacy,
    that&#x27;s what encryption is for. The other is that you can lose your data because
    the could provider doesn&#x27;t like you, it is a failure mode, in the same way
    that your tapes can burn. Use redundancy, like with any unreliable storage solution.<p>With
    an onsite NAS, local copies and cloud backup, you meet the &quot;3 2 1&quot; rule
    (3 copies, 2 storage types, 1 offsite) without the hassle of dealing with tapes,
    and it will probably be cheaper too, unless you are particularly data-hungry.
