  author: dylan604
  text: 'Anyone that&#x27;s never had the (dis)pleasure of working with tapes, there&#x27;s
    some gotchas to know about before archiving and forgetting about it.<p>When you
    create an archive, do not skip the step of reading it back. I&#x27;m not talking
    about just having the system confirm it is readable. I mean actually restoring
    the data from the tape. I&#x27;ve had tapes fail to retrieve data off of the tape
    even though the writing app confirmed it was readable.<p>Drives can have issues
    reading data written by another drive. Drives can have issues reading a tape it
    wrote itself.<p>Why write one when you can write two at twice the time&#x2F;cost?
    In all of my experience with tape, I&#x27;ve never written just one tape. In the
    early days of DVDs, the images were written to LTO to send to have the discs pressed.
    Two were always sent on the chance one wasn&#x27;t readable and schedules were
    so tight that the loss of a couple of days to send a new tape would wreck delivery
    dates. Another facility wrote three tapes: one kept on site, one sent to IronMountain,
    one sent to the client directly. Plenty of occasions saw the local copy unreadable
    and the IronMountain copy was retrieved. These were managed by large robotic tape
    libraries so each tape was written in a different drive at the same time so it
    was 3x cost while only 1x time.<p>Use the drive cleaning cassette as recommended.
    Your dirty heads can cause the data to not be written&#x2F;read correctly depending
    on which head is dirty. If you&#x27;re having issues reading, clean the heads
    before giving up on the tape. If you&#x27;re having issues reading a tape just
    written, do not think someone else will be able to read it.<p>Ensure whoever might
    be using a tape you&#x27;ve written understands what was used to write the tape.
    Not all archivers are compatible. If you use the tar command to write to tape,
    people using a GUI app won&#x27;t be able to read it.'
  score: 0
