    newest&#x2F;hottest bits are on NVMe, anything older than (e.g.) 3 months gets
    move to SSD, anything older than that to spinning rust HDDs, and then to tape.<p>There
    are several file systems where this happens in the background: the file still
    shows up at &#x2F;path&#x2F;for&#x2F;stuff&#x2F;foo.txt but the contents are shuffled
    about behind the scenes.'
