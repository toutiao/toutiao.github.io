    witnessed enough disasters caused by data lost due to carelessness, so I have
    no intention for something like that to happen to me.<p>Therefore with HDDs I
    have always written the same data on 2 HDDs, and this saved me a few times, when
    after several years of storage both HDDs contained a few corrupted sectors, but
    not in the same places.<p>With tapes, I also always write at least 2, but frequently
    even 3, because their low cost makes this affordable. With tapes, the greatest
    danger is that if a drive malfunctions mechanically while a tape cartridge is
    inserted, it might damage that tape.<p>Having at least 2 copies of each tape or
    HDD also allows their storage in different locations.<p>Like I have said, I always
    combine this redundancy of having duplicate storage media with intra-archive-file
    redundancy, so I typically add 10% redundancy to each compressed and encrypted
    archive, so that for any corruption that affects less than 10% of the file the
    content is still recoverable.<p>I am still using the older LTO-7. While I might
    upgrade to LTO-8 or even LTO-9, an upgrade to LTO-10 is unlikely, unless great
    price reductions will happen in the future, which I doubt.<p>So I am very concerned
    by the lack of a good archival solution that is affordable by ordinary people
    and by small businesses, not only by very rich companies.<p>Microsoft has demonstrated
    an ideal archival medium (in glass), but for now the cost of their laser system
    is too great for commercialization. That appears to be mostly a chicken and egg
    problem, the lasers and the other optical components are too expensive because
    they currently are produced only in very small quantities, but they cannot be
    incorporated into a high-volume application, because they are too expensive.
