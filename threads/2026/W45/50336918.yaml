  author: matja
  text: 'Great points. To add some more:<p>* Don&#x27;t rely on vendor-specific compression
    and&#x2F;or encryption which may vary between different tape drives.<p>* If you
    do use encryption, try to ensure you have a way to recover from corruption in
    the middle of the bitstream (see parent&#x27;s point on two copies, or CTR&#x2F;GCM
    mode, or FEC&#x2F;erasure coding).<p>* Index the contents (file names, sizes,
    at least), or use an archive format that puts the index at the start of the tape
    (note: tar does not).'
