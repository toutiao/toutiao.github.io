  author: danadam
  text: By increasing the length of the FFT you lower the apparent noise floor in
    the FFT magnitude plot and are able to detect smaller signals. That&#x27;s called
    &quot;FFT processing gain&quot;. The formula is:<p>FFT gain = 10*log(M&#x2F;2)<p>where
    M is the number of points processed in the FFT. Doubling the number of points,
    lowers the apparent noise floor by 3 dB.<p>(I don&#x27;t know if that&#x27;s what
    the researchers actually did. I&#x27;m just explaining what the comment presumably
    meant.)
