  text: When you monitor a power line, you don&#x27;t get a tcpdump showing who&#x27;s
    producing and who&#x27;s consuming the power. You can&#x27;t just jump straight
    to the culprit.<p>It&#x27;s just bulk flows, so when a weird flow shows up, you&#x27;ve
    got to move up or down the line, past a few producers or consumers, and see if
    the flow changes. For a subtle effect, that might not even be so clear.<p>Worse,
    for an effect that&#x27;s most visible at the medium-voltage transmission level,
    simply placing a monitor might take weeks. These are planned installations with
    incredible safety considerations -- you don&#x27;t just plug in.<p>Finally they
    found a research campus with a bunch of battery storage systems, AND the ability
    to install a bunch of monitors, and persuaded them to install dozens of monitoring
    points. Finally a high-resolution view of the effect allowed them to confirm the
    behavior.
