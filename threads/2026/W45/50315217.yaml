  author: '0xbadcafebee'
  text: 'In computer&#x2F;systems&#x2F;distributed engineering this is called request
    smoothing or traffic shaping, and it&#x27;s implemented by adding jitter, which
    is a random time offset&#x2F;pad added to the interval.<p>The funny thing is,
    modern electrical codes already account for this phenomenon. In order to implement
    Net Metering (selling your power to the grid), modern standards implement two
    kinds of jitter:<p>- <i>Sandia Frequency Shift</i>: a minute shift in the power
    frequency generated by inverters. If the grid is connected, this is effectively
    eliminated; if the inverter is disconnected from the grid, it detects the frequency
    has shifted and disconnects the inverter from the grid.<p>- <i>Slip-Mode Frequency
    Shift</i>: basically the same thing, but phase shift (which I don&#x27;t understand).<p>Both
    of these are used for anti-islanding (don&#x27;t create an island of power). When
    the inverter detects it&#x27;s isolated and stops outputting current, it then
    has to check every 5 minutes, <i>with jitter</i>, for whether the grid is restored
    or not. It has to add random jitter, because otherwise all the mini battery&#x2F;solar
    installs will come online at the same time and swamp the grid, causing another
    outage.'
  score: 0
