  author: helterskelter2
  text: I&#x27;m late to this thread, and I&#x27;ve mentioned this story here before
    several times (under other usernames I lost the password to), but it bears repeating:<p>I
    had family who was experiencing symptoms of CRC in their late 30&#x27;s or early
    40&#x27;s, which they reported to their PCP. PCP repeatedly denied them a referral
    to a specialist and insisted they were too young for CRC. This goes on for about
    a year. Finally, with worsening symptoms, my family member &#x27;remembered&#x27;
    that their &#x27;aunt&#x27; had passed of CRC when they were very young. This
    got them a referral to gastroenterologist, who got them a colonoscopy. (All this
    trouble, even though their symptoms were textbook and got so bad they couldn&#x27;t
    make it ten steps to the bathroom).<p>However! The colonoscopy came out clean,
    but my family member was still experiencing worsening symptoms. Finally the gastroenterologist
    schedules a CT or MRI, which spotted a huge tumor in their colon and they were
    diagnosed stage 4. The tumor was in their sigmoid (the right-angle turn your colon
    makes), and only the tip of the tumor was protruding from the colon wall itself,
    so when the doctor performed the colonoscopy and failed to fully inflate the colon,
    they did not see anything there. This delayed diagnosis by another few months
    which may have been critical to their prognosis.<p>They fought for eight years
    against cancer and the insurance company, and were scheduled to undergo a procedure
    earlier this year at Yale which may have eliminated the cancer in their peritoneum
    (often the last holdout for metastasized CRC, and with our current medicine, basically
    impossible to remove, I&#x27;m told), until a certain American president cut funding
    to basically all medical research. They passed a few months after they would have
    had the procedure.<p>Do not ignore the symptoms, and make sure to absolutely force
    the issue with your PCP&#x2F;doctor if the symptoms persist, even if your colonoscopy
    comes back clear. PCP&#x27;s don&#x27;t want to upset insurers with useless referrals
    and many get their egos bruised if you think you know better. Even MD&#x27;s will
    half-ass a colonoscopy if they get too comfortable with their judgement. You have
    to be your own advocate in America&#x27;s medical system because nobody gives
    a shit if they get you killed, so long as they don&#x27;t have to pay for it.<p>IIRC
    doctors wanted to lower the age for CRC screening but insurers didn&#x27;t want
    to pay for it, so don&#x27;t fall into a sense of security because you &quot;aren&#x27;t
    old enough&quot;.<p>And for those of you worried about a stranger looking up your
    ass, I&#x27;ve had a coloscopy myself and it&#x27;s not that bad. These people
    look up stranger&#x27;s assholes all day every day.
