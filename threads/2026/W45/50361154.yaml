  text: I’m literally having a colonoscopy today (Wednesday), so I’ll say what my
    prep has been.<p>Starting on Friday, I followed a “low residue diet”. This primarily
    meant no fibrous fruits&#x2F;veg or whole nuts&#x2F;seeds. It was inconvenient
    but not hard.<p>Yesterday I started a “clear liquid diet”, which meant that I
    did not eat anything and only drank apple juice, gatorade, and the prescription
    prep solution. Starting at 5pm and going until about 6:45p, I drank half of the
    prep solution, which was like 64oz of stuff that tasted like flat Sprite. Right
    about the time I finished drinking, the draining out the other end began. It wasn’t
    a problem, and didn’t hurt, but I did visit the bathroom about 10 times over the
    next 2 hours with another few throughout the night.<p>I slept great overnight,
    and now I’m getting ready to start the second half of the prep solution. I’ll
    drink it over a 90 minute span, beginning four hours before I am scheduled to
    arrive at the endoscopy clinic.<p>(I’m also planning to have my colonoscopy without
    sedation. I have a very high pain tolerance, and was told that I’ll be able to
    watch the realtime video feed!)
