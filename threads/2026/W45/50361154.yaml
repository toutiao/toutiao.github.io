  url: https://www.dana-farber.org/newsroom/news-releases/2026/study-reveals-distinct-cellular-and-genetic-differences-in-colorectal-cancer-in-younger-patients
  title: Study reveals distinct cellular and genetic differences in colorectal cancer
    in younger patients | Dana-Farber Cancer Institute
  fetch_status: success
  content: "# Study reveals distinct cellular and genetic differences in colorectal
    cancer in younger patients \n\nPosted date\n\n### _Researchers identified age-associated
    differences in tumor composition and gene activity, creating a foundation for
    investigating why colorectal cancer can be more aggressive in younger adults_\n\nDana-Farber
    Cancer Institute researchers, along with Mass General Brigham researchers from
    the Gene Lay Institute of Immunology and Inflammation, and the Broad Institute,
    have uncovered biological clues to why colorectal cancer can behave more aggressively
    in younger people. Published today in [Nature Medicine](https://www.nature.com/articles/s41591-026-04721-y),
    the study — the largest of its kind — lays a foundation for understanding age-associated
    differences in colorectal cancer and exploring future treatments.\n\nIn the United
    States, colorectal cancer diagnosis rates among people younger than 50 rose 2.9%
    per year from 2013 through 2022, according to the [American Cancer Society](https://www.cancer.org/research/cancer-facts-statistics/colorectal-cancer-facts-figures.html).
    Its 2026 report identifies colorectal cancer as the leading cause of cancer death
    in this age group. Younger patients are also more likely to be diagnosed at advanced
    stages, underscoring the need to better understand the biology of early-onset
    disease.\n\n\"Through Dana-Farber’s Young-Onset Colorectal Cancer Center, we see
    how profoundly this disease can affect younger patients and their families, often
    during the busiest and most formative years of life,\" said co-senior author [Kimmie
    Ng, MD, MPH](/find-a-doctor/kimmie-ng \"Kimmie Ng, MD, MPH\"), who is the director
    of the [Young-Onset Colorectal Cancer Center at Dana-Farber](/cancer-care/treatment/gastrointestinal/programs/young-onset-colorectal-cancer
    \"Young-Onset Colorectal Cancer Center\"). \"This collaborative work with Mass
    General Brigham researchers from the Gene Lay Institute and researchers from the
    Broad Institute gives us important new insight into the biology of these tumors.
    The findings provide a valuable roadmap for further investigating the distinct
    features of young-onset colorectal cancer. Our ultimate goal is to discover novel
    strategies for prevention, diagnosis, and treatment for our young patients.\"\n\n\"The
    need to understand why colorectal cancer is affecting younger adults at increasing
    rates is urgent,\" said co-senior author Ana C. Anderson, PhD, a core faculty
    member of the Gene Lay Institute of Immunology and Inflammation at Brigham and
    Women’s Hospital, Massachusetts General Hospital, and Harvard Medical School.
    \"And that starts with understanding the biology of the disease across the entire
    lifespan. By looking beyond conventional age cutoffs, we’ve uncovered biological
    patterns that earlier studies may have missed and created a foundation for the
    field to investigate them further. While we’re still at the beginning of understanding
    what these differences mean, our work gives researchers a new direction to pursue
    in tackling this urgent problem in human disease.\"\n\nThe research team, led
    by first author Caroline Porter, PhD, of the Klarman Cell Observatory at the Broad
    Institute, studied specimens from surgeries stored in Dana-Farber’s Gastrointestinal
    Biobank from surgeries at Brigham and Women’s Hospital. Co-senior authors include
    Anderson, Ng, and Ramnik J. Xavier, MD, PhD, of the Broad Institute, Mass General
    Brigham, and the Gene Lay Institute. They analyzed 189 tumors from patients ages
    29 to 90+, including 54 diagnosed before age 50, and 135 diagnosed at age 50 or
    older. Using a technique called single-nucleus RNA sequencing, the researchers
    measured gene activity in more than 850,000 cancer cells and other cells in the
    tumors. The technique, which works with frozen tissue, enabled the team to build
    a detailed map of tumor cells by studying archived samples with extensive clinical
    record data.\n\nRather than dividing the tumor samples into two data sets and
    comparing the younger and older age groups, the researchers looked for factors
    that changed gradually with age, accounting for tumor location, stage, sex, and
    prior treatment in their analyses. This approach revealed subtle differences that
    likely would have been obscured by a simple two-data set comparison.\n\nAmong
    tumors of the most common colorectal cancer subtype, younger patients’ tumors
    had a significantly higher proportion of connective and supporting cells relative
    to cancer cells. A higher proportion of connective and supporting cells has been
    linked to chemotherapy resistance in several types of solid cancer. The team confirmed
    this pattern using gene-activity data from 564 other tumors and computer analysis
    of stained tissue images from another 712 tumors.&nbsp;\n\nYounger patients also
    had higher activity of long non-coding RNAs, molecules that can regulate genes
    without making proteins. Some appeared repeatedly across different types of cancer
    cells. Many are \"dark\" RNAs, whose functions remain largely unknown. The team
    also saw gene activity suggesting stronger signaling between cells that can help
    cancer cells move and invade nearby tissue in younger patients.\n\n\"Our study
    is an advance from previous work in that we analyzed tumors from a large number
    of patients and used single-cell approaches to find novel features unique to tumors
    from young patients,\" said Xavier, a co-senior author of the study, a core institute
    member at the Broad Institute, Kurt Isselbacher Professor at Massachusetts General
    Hospital and Harvard Medical School, and Vice Director of the Gene Lay Institute.
    Xavier is also a gastroenterologist at Mass General Brigham. \"This work sets
    the stage for future mechanistic studies on how these cell programs interact with
    chemicals from the diet and from gut microbes to cause early-onset colorectal
    cancer.\"&nbsp;\n\nAlthough the findings provide key insight into colorectal cancer
    in young individuals, they do not yet provide proof that these differences cause
    more aggressive disease. One remaining question is whether there are differences
    in immune responses in these tumors across ages — the researchers' methods captured
    relatively few immune cells. Future studies will explore how these changes may
    affect cancer growth and spread, and whether they offer opportunities for prevention
    or treatment.\n\n**Authorship:** Authors include Caroline B. M. Porter, Shane
    P. Murphy, Jules Cazaubiel, Toni M. Delorey, Liat Amir-Zilberstein, Orr Ashenberg,
    Liubou Klindziuk, Elizabeth Andrews, William Tan, Kosuke Matsuda, Atsushi Kondo,
    Satoko Ugai, Tomotaka Ugai, Shuji Ogino, Emily Finan, Jacques Deguine, Ewa Sicinska,
    Lauren K. Brais, Jennifer S. Thalappillil, Marios Giannakis, Ramnik J. Xavier,
    Ana C. Anderson and Kimmie Ng.\n\n**Disclosures:** Anderson is a member of the
