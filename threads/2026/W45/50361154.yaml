  text: I wonder if the higher proportion of stromal cells in young tumors is a direct
    result of specific dietary components or gut microbiome variations rather than
    just inherent biology. The study mentions looking at how cell programs interact
    with diet and microbes, but it seems early onset cases often present with distinct
    inflammatory profiles in the colon itself before tumor formation.<p>It would be
    interesting to see if these long non-coding RNAs show up consistently in pre cancerous
    polyps in younger patients or only after malignant transformation. If they are
    elevated early on, that could actually help solve the diagnosis problem where
