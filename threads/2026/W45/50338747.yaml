article:
  url: https://posthog.com/blog/moving-off-duckdb
  title: Why we're moving our warehouse off DuckDB
  fetch_status: success
  content: "![](data:image/svg+xml;charset=utf-8,%3Csvg%20height='1080'%20width='1920'%20xmlns='http://www.w3.org/2000/svg'%20version='1.1'%3E%3C/svg%3E)\n\n#
    Why we're moving our warehouse off DuckDB\n\n- [\n ![](https://res.cloudinary.com/dmukukwp6/image/upload/c_scale,w_50/Property_1_ben_k_40ace61c8e)\nBenjamin
    Knofe-Vider](/community/profiles/43006)\n\nNov 02, 2026\n\n- [Data warehouse](/blog/data-warehouse),
    \n- [Infrastructure](/blog/infrastructure), \n- [Engineering](/blog/engineering)\n\n####
    Contents\n\n- \n- \n- \n- \n- \n\nFive months ago, [we rebuilt our warehouse on
    DuckDB](/blog/why-we-rebuilt-our-data-warehouse) instead of ClickHouse. We did
    it because a shared ClickHouse cluster couldn't handle hours-long modeling queries,
    and it lacked a cost-based query optimizer. DuckDB gave every customer their own
    instance, and tools like dbt could connect over Postgres. We're still fans.\n\nBut
    we underestimated how big and complex our customers' workloads would get. We didn't
    want them to have just a good experience, we wanted the best experience you can
    get when you pay someone else to run your warehouse. It should work at any scale,
    at a fair price.\n\nSo we spent the last three months re-architecting it, this
    time without DuckDB.\n\n## DuckDB is brilliant on one machine\n\nWe love DuckDB.
    It's probably the best single-node tool for analyzing heaps of data, and that
    node can be your laptop. It's robust and reliable. It almost always finishes your
    query, and if it runs out of memory, it spills to disk.\n\nThe same features that
    are great locally gave us problems in the cloud. Customers ran more complex queries
    than we expected, so we had to add huge instances. Adding disks was an option,
    but queries would have been too slow and expensive to be viable.\n\nTo run a single-node
    engine safely in the cloud, we have to size the worker before the query arrives.
    The ergonomics here are wonky. We couldn't find a good way to tell customers what
    resources their queries would need. Predicting CPU and memory for a specific query
    was even harder.\n\nUsers shouldn't have to worry about this. They should be able
    to run whatever they need to get their work done. Our job is to handle the rest
    and make it as predictable as possible.\n\nWe hit other bottlenecks too, like
    fetching lots of data from S3 without async fetching. DuckDB only added that recently.\n\n##
    DuckLake is built for compatibility, not scale\n\nTo use DuckDB as a fully-fledged
    data warehouse, we installed the [DuckLake](https://ducklake.select/2025/05/27/ducklake-01/)
    extension by default. It is a new lakehouse format from the same creators and
    follows the same principles as DuckDB: keep things simple and run on almost any
    setup. That works well up to a point, but at PostHog's scale, we needed something
    designed for distributed scale from the start.\n\nDuckLake's catalog schema has
    to stay portable across many SQL databases, which limits engine-specific optimizations.
    At our scale, a single-table write could take more than three minutes because
    every commit re-read the statistics for the entire catalog.\n\nWe tuned DuckLake
    with table indexes and similar tweaks. But to keep offering DuckLake, we had to
    stay 100% compatible with its existing, \"official\" schema. This left us with
    fewer optimization options.\n\nAnother problem is that over 99% of the catalog's
    statistics rows belonged to tables that no longer existed. Cleaning them up made
    writes 30 to 50 times faster, but the rows kept growing back.\n\nWe also spent
    a lot of time on the number of connections DuckLake opens to metadata databases.
    That hurts on shared Postgres instances, where every connection has a real cost.\n\n##
    1 trillion rows was a challenge\n\nDuckLake at PostHog didn't start small and
    ramp up. We fully committed and put all of PostHog in a DuckLake to dogfood as
    the first customer.\n\nWhen we moved off it, it held about 2 PB: roughly 1 trillion
    rows and 15.3 million snapshots. It broke in lots of ways that were hard to fix
    within DuckLake's scope.\n\nWe'd rather have contributed to the existing community
    and helped it grow. But we couldn't land changes as fast as we needed, so we ended
    up carrying patches in a fork which defeats one of the main benefits of using
    DuckLake: the community.\n\n## Speaking Postgres is harder than it sounds\n\nOffering
    direct Postgres connections over port 5432 sounds like a great idea. In practice,
    it was much harder to scale than HTTP.\n\nMissing reconnects and managing TTLs
    and idle connections at scale is hard, and long-running connections are expensive.
    There's also very little tooling for load balancing pgwire compared with HTTP.
    Compare the ergonomics of an AWS NLB with an ALB and you'll see what we mean.
    HTTP headers also make routing in Kubernetes much more flexible.\n\nThere's also
    an endless list of Postgres clients, and each expects its own niche Postgres behavior.
    Customers kept asking us to fix their client or library. We spent a lot of time
    shipping many of those fixes, but coverage never got good enough. We'd rather
    spend our time building an excellent warehouse than chasing the long tail of Postgres
    compatibility.\n\n## We're rebuilding on Trino with HogLake\n\nWe've learned not
    to hype the tech behind a warehouse so much. What counts is the experience it
    gives you.\n\nStill, we're happy to share what we're cooking next. We rebuilt
    everything around our own flavor of [Trino](https://trino.io/) and created our
    own open table format, HogLake. And yes, we're testing it at PostHog's petabyte
    scale first. We made it solid before handing it to design partners.\n\nIf your
    current warehouse is slow or expensive, [let's talk](mailto:benjamin.k@posthog.com),
    especially if you have a lot of data to query. We're always looking for design
    partners.\n\n> PostHog is your product's context layer. With a full suite of developer
    tools – [AI observability](/ai-observability), [product analytics](/product-analytics),
    [session replay](/session-replay), [feature flags](/feature-flags), [experiments](/experiments),
    [error tracking](/error-tracking), [logs](/logs), and more – PostHog ingests and
    stores all the data agents need to diagnose problems, uncover opportunities, and
    ship fixes. A [data warehouse](/warehouse) and [CDP](/data-pipelines) tie it all
    together, unifying that context into one source agents can read across. You can
    steer it all from [Slack](/slack), [the web app](/ai), the desktop ([PostHog Desktop](/desktop)),
    or your own editor via [the MCP](/mcp).\n\n### Community questions"
