  author: hinkley
  text: Things like this are a part of why I push back on people telling me we can
    do important things later. I don’t want to swap the engine out of a machine that’s
    moving that fast. There’s no time to learn about how it behaves with real versus
    synthetic traffic and what the failure modes are when you’re doing many thousands
    of transactions per second.<p>Why wouldn’t you want to sort stuff like that out
    when the problem is still relatively small?<p>The only other reasonable option
    is to wait until the problem gets so big that it splits into several domains.
    And then you can move one domain over, see how that goes, and move more over if
    it goes well.<p>If you can’t know for certain how the system will behave under
    organic load that may mean migrating traffic onto the new system and then back
    to the old one several times, which means you need migrations in both directions
    and each transition is an opportunity for human error to destroy data or take
    the service offline.
  score: 0
