  author: hinkley
  text: I worked at a place with a couple of overly optimistic principals who were
    so happy about their computationally convoluted system responding to queries in
    600 ms, but it practically meant we needed almost half a CPU per request, and
    then pre-autoscaling, a strange requirement to be able to failover from taking
    a region offline so we ran each at around 60% utilization, putting us at about
    1 CPU per req&#x2F;s. Which is just fucking embarrassing.<p>The first big system
    I worked on is the one where I learned not to generate expensive responses from
    a read mostly system, instead you should make writes expensive so reads are cheap.
    That project had an almost equally convoluted responses, and yet we were doing
    30 req&#x2F;s per instance on, IIRC, 4 core boxes. Adjusted for hot spare capacity,
    that ancient system was servicing 4x as many requests per core, 8x as configured.<p>A
    big part of the problem, besides selling a “premium” service to customers, was
    drinking the flavor of Knuth’s “premature optimization” misquoted koolaid that
    convinces people that all substantial speed improvements come from major architectural
    shifts. Which is how in the time I was on that team of 6-9 people, I delivered
    over half of the response time and cluster size improvements. If you count the
    work done to support upgrading the runtime, which brought perf improvements of
    its own, then more like 2&#x2F;3.<p>Sounds a bit like this team might have the
    same disease.<p>The problem with internal service teams, of which this seems to
    be one, is that dealing with noisy neighbors is always a bigger problem than anyone
    is willing to tackle because it involves confrontation. Team X gets punished every
    time Team Y introduces a new feature that leans on the shared resource harder.
    It’s a multi tenant system without the fairness guarantees that we usually build
    into proper multi tenant systems.<p>Sometimes the easiest way to solve this is
    sharding. You end up deploying the same service many times and routing different
    classes of requests to different machines so if Team Y keeps trying to wreck the
    Commons they slow themselves down faster than they slow everyone else down. Those
    sped up consequences create a feedback loop that almost works instead of an amorphous
    one with consequences so far removed from actions as to become academic.<p>On
    that second team I mentioned we had an unfortunate situation of introducing things
    that took 100 ms off of response time and then three months later we were right
    back where we had been due to new features and creeping complexity of user content.
    It was demotivating for at least half of the team. My biggest contributions lowered
    the slope of that line, which allowed us to finally carry improvements over from
    year to year instead of being on the Red Queen problem.
  score: 0
