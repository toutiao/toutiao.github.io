  text: |-
    Reading such a passionate take as someone who has looked up is a strange experience, I must admit. Kinda like how the Bernard twist in S01 of Westworld felt. I&#x27;ll try to respond as substantively as I can, regardless:<p><pre><code>  That Claude rarely, if ever, actually &quot;remembers&quot;. Since these are just random markdown files randomly injected into the tiny context.
    </code></pre>
    Complaining about your anecdotal experiences with Claude(Code, hopefully?) isn&#x27;t a serious criticism, the markdown files are optimized to <i>not</i> be random, and calling 1,000,000 tokens of context &quot;tiny&quot; seems like a plainly unreasonable bar. How much of <i>War and Peace</i> can you hold in your head at once and quote flawlessly, and is it more than 133%?<p><pre><code>  What a useless experiment
    </code></pre>
    The experiment is testing their fixes to the problem you lamented just one sentence prior.<p><pre><code>  Define &quot;effectively&quot;
    </code></pre>
    They do exactly that in figure 3, as mentioned at the end of the sentence you&#x27;re quoting. Opus 5 used that advice to raise its benchmark score by 46.8%, and Opus 4.7 used it for a gain of 82.7%. The specific benchmark looks far from trivial, too: <a href="https:&#x2F;&#x2F;github.com&#x2F;pgasawa&#x2F;continual-learning-bench&#x2F;tree&#x2F;main&#x2F;src&#x2F;tasks&#x2F;database_exploration" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;pgasawa&#x2F;continual-learning-bench&#x2F;tree&#x2F;mai...</a><p><pre><code>  Then it&#x27;s not &quot;memory&quot;. It&#x27;s just telling the model to read a text&#x2F;spec file before implementing something
    </code></pre>
    It fits the colloquial definition, and there is no specific scientific definition in CogSci, CogPsych, Neuro, CogNeuro, NeuroPsych, nor philosophy. There&#x27;s lots of useful ones offered in different contexts, but they differ considerably.[1] Regardless, it&#x27;s well accepted industry jargon at this point: it doesn&#x27;t matter in the same way that it doesn&#x27;t matter than databases can never truly be &quot;queried&quot; because they can&#x27;t engage in linguistic discourse.<p><pre><code>  So, random injection of random things into context that depend on whether the short ToC entries have any relevance on what Claude is doing
    </code></pre>
    Isn&#x27;t this inevitably, undeniably true of any possible memory system, just from, say, a big-O perspective? If you have to persist every item in a list to decide which one is relevant enough to load into the same pool of memory, there&#x27;s no point in the second step anymore.<p><pre><code>  What is this bloated article about?
    </code></pre>
    This article is very plausibly wrong, misguided, or even philosophically bankrupt, but I don&#x27;t see any support for the claim that its topic is unclear. It&#x27;s discussing the efficacy of proactive state management during idle periods for longrunning LLM-backed agents.<p>---<p>[1]: For example, did you know that modern CogSci is generally convinced that memories are illusions that the brain creates through a process that merely <i>consults</i> ineffable underlying representations (usually), and not an object retrieved from storage? That definition would also contradict Anthropic&#x27;s wording here, but only in a way that weakens your criticism rather than supports it.
