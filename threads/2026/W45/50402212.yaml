n files whose only existence is assured by random
    harness injections and whatever claude retains in its current context from the first 200 lines of an injected ToC.<p>Yes, it&#x27;s an accepted industry jargon, but you don&#x27;t have to behave that it does something else than what it does.<p>Or that <i>explicitly</i> telling Claude &quot;read a specific markdown file in your memory&quot; is in any way, shape, or form different from &quot;read a specific markdown file in specs directory&quot;.<p>Of course it&#x27;s the only way to make Claude actually read and act on it.<p>&gt; It&#x27;s discussing the efficacy of proactive state management during idle periods for longrunning LLM-backed agents.<p>No. No it doesn&#x27;t. It considers &quot;components of agent memory&quot; and focuses solely on &quot;how we can write markdown files&quot;, and spends probably less than 1% on &quot;how we can make sure the agent actually uses them&quot;. Even the conclusion completely ignores it despite this:<p>--- start quote ---<p>Injected memories use up valuable tokens, and an incorrect note can be carried into every session. Loading a note also doesn’t guarantee that Claude acts on it: our documentation on Claude Code warns that longer instruction files reduce adherence [1 000 000 tokens of context is huge lol - troupo]<p>...<p>It loads only the first 200 lines or 25 KB of MEMORY.md [but we sure love the sound of our voice deacribing how well it can write the hundreds of tiny files – troupo]<p>--- end quote ---
