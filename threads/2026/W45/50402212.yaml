  author: yfontana
  text: 'So far I&#x27;ve turned off automatic memory creation in every harness I&#x27;ve
    used. Claude Code sometimes creates some anyway, and I probably delete 95% of
    them. The memories it creates are almost always relevant only to the specific
    task that it is currently working on. If it&#x27;s a task I&#x27;ll need to do
    again, then yeah, maybe that&#x27;s useful. But that isn&#x27;t the case most
    of the time, so I delete them to avoid cluttering context.<p>So the main improvement
    to memories I&#x27;d like to see is better judgment on which ones to create.<p>The
    parts about &quot;dreaming&quot; make me think of how agent transcripts contain
    a ton of information, which I think is currently under-utilized. I&#x27;ll repeat
    advice I&#x27;ve seen here a few times: ingest your own transcripts into duckdb
    (claude code will build that pipeline in about 10 minutes) and do some data analysis
    on them. Some ideas if you don&#x27;t know where to start: look at tool call failures
    to see if you can prevent common ones, check out if you have large cache misses
    and what causes them, look at various efficiency metrics over time (tokens per
    $, lines of code per tokens, etc.) with main thread vs sub-agents, etc. I started
    with this sort of things, and ended up following some threads to interesting insights.
    For example, I found indications that I tended to make Opus 5.5 &#x2F; Sol 6.1
    divide their work into units that were too small. They have the capacity to work
    on more stuff at once than older models, and I wasn&#x27;t really taking advantage
    of that.'
