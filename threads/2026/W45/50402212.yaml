  title: The components of agent memory \ Anthropic
  fetch_status: success
  content: "Søren Kierkegaard wrote that life can only be understood _backward_, but
    it must be lived _forward_. We’ve encountered a similar bind when designing memory
    for AI agents.\n\nAs humans, we encode memory constantly as we go about our lives.
    [The hippocampus](https://stanford.edu/~jlmcc/papers/McCMcNaughtonOReilly95.pdf)
    plays a central role in this, capturing experiences in the moment so that memories
    form quickly and are immediately available. But only [some experiences](https://www.science.org/doi/10.1126/science.adk8261?referrer=https%3A%2F%2Fwww.google.com%2F)
    are consolidated into long-term knowledge.\n\nMuch of that consolidation appears
    to happen when our brains are offline. As we sleep, and during quiet [rest](https://www.nature.com/articles/s41467-018-06213-1),
    the hippocampus replays our recent experiences. This is thought to gradually distill
    [those experiences and integrate them](https://www.nature.com/articles/s41593-019-0467-3)
    into the neocortex—the part of our brains that stores most of what we think of
    as knowledge.\n\nAgent memory can use a similar division of labor. Agents capture
    much of their work in logs or transcripts. Researchers at Letta and UC Berkeley
    proposed [sleep-time compute](https://arxiv.org/abs/2504.13171) as a way for models
    to use idle time between interactions to reorganize their existing context. The
    same idea can help agents organize their memory by reflecting on logs to fix mistakes
    or produce new notes and representations. This process is often [called](https://platform.claude.com/docs/en/managed-agents/dreams)
    [_dreaming_](https://research.google/blog/the-sleep-framework-a-new-way-for-llms-to-retain-knowledge-in-continual-learning/)
    (Figure 1).\n\nWe’ve found that dreaming has been a useful tool for helping us
    give Claude effective memory. In this post, we share how we’ve come to think about
    agent memory and walk through several evaluations we’ve used to explore agent
    memory, including the use of dreaming, and what each component contributes to
    memory organization.\n\n![Diagram of a memory hierarchy between one session and
    the next. From bottom to top: transcripts (a searchable event log), memory notes
    written by Claude, memory representations such as wikis, and injected context
    loaded into every session. Inside a box labeled “Dreaming,” arrows run from transcripts
    up to each layer, and in both directions between neighboring upper layers.](/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fa0bcfa203214d817d2b4261b7188aba8be6db5b2-3840x1754.png&w=3840&q=75)\n_Claude
    can use dreaming to organize memory. This can correct mistakes, create notes,
    build new memory representations, or shape what’s preemptively loaded into future
    sessions._\n\n### Memory notes\n\nBy “agent memory,” we mean knowledge that Claude
    gains from experience—including interactions with users and tasks it’s been assigned—and
    that it retains between sessions, saved as context it can read later. It excludes
    other ways models can learn or manage context, such as changes to their _weights_
    (the internal parameters set during training), [_in-context learning_](https://www.anthropic.com/research/in-context-learning-and-induction-heads)
    (knowledge gained within a single conversation), and [_compaction_](https://platform.claude.com/docs/en/build-with-claude/compaction)
    (summaries written by Claude that replace its older turns so it can continue working
    in a new context window).\n\nIn the human brain, chemical signals released before,
    during, or after an experience can [mark a memory](https://www.nature.com/articles/385533a0)
    as important. Marked memories tend to be replayed more often than unmarked ones
    during offline periods. This process, called _replay_, helps stabilize and integrate
    them into long-term memory.\n\nSimilarly, Claude can tag salient events in a session
    log as they happen, so they’re easier to find later, or it can [write](https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool)
    them to a memory store, such as a folder of memory notes (Figure 2). But how can
    Claude tell what’s salient in the moment, before it knows what’s coming next?\n\n![The
    same memory hierarchy, with the memory notes layer highlighted. An arrow runs
    from the session directly to the memory notes, described as salient observations
    written by Claude.](/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F2ef2bf5c81ea6d578749782782eff10cf3136de4-3840x1754.png&w=3840&q=75)\n_Claude
    can write notes to memory._\n\n### Memory can be a prediction about what the future
    will need\n\nMemory is, occasionally, a prediction. By writing down a rule, an
    agent predicts that the pattern it’s describing will be relevant again. For instance,
    writing down a verified fact is a prediction that an agent in a future session
    will want to rely on that fact without double-checking it. Over time, Claude has
    become much better at making these kinds of predictions.\n\nConsider a task from
    [Continual Learning Bench (CL-Bench) 1.0](https://continual-learning-bench.com/news/cl-bench-1-0/),
    a benchmark that measures an agent’s ability to use memory in order to tackle
    long-horizon tasks. One particular task asks Claude to answer a series of questions
    by looking up information in a database. After Claude gives an answer, it’s told
    the correct solution and can write a memory to help answer future questions.\n\nMemory
    can support a learning loop here. If Claude gets a question wrong, it can record
    the failure, come up with theories about what went wrong, test those theories,
    and turn what it finds into a rule about how to answer in the future.\n\nWe ran
    the CL-Bench 1.0 task using [Claude Managed Agents](https://platform.claude.com/docs/en/managed-agents/overview).
    Claude started each question in a fresh session, with one exception: it could
    retrieve files from a [memory directory](https://platform.claude.com/docs/en/managed-agents/memory)
    that persisted from one session to the next.\n\nDifferent models achieved different
    levels of success at creating their own learning loops. Claude Sonnet 4.6 got
    as far as generating theories about why an answer was wrong. Its memory directory
    contained a scattering of files, each listing several untested guesses.\n\n![Left:
    bar chart of mean reward on the CL-Bench database task, stateless baseline versus
    memory store. Opus 5.5: 0.655, 0.838. Sonnet 5.5: 0.644, 0.833. Opus 5: 0.564,
    0.828. Opus 4.7: 0.383, 0.700. Sonnet 5: 0.306, 0.610. Sonnet 4.6: 0.330, 0.364.
    Right: line chart of running-mean reward over 30 questions for the same models,
    with and without memory.](/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbb0d44c78cc431fb5e84fbf2cb17c4303bc6bd65-3840x2160.png&w=3840&q=75)\n_CL-Bench
    database task, comparing memory with a stateless baseline across models._\n\nClaude
    Opus 4.7 consolidated its notes into a single reference document and began marking
    which facts it had checked and which were still unconfirmed. Claude Sonnet 5 marked
    each answer as confirmed after the grader had checked it, and wrote a correction
    when it had answered wrong.\n\nClaude Opus 5 was the first of these models to
    close the loop. Most of its entries included a rule (and also how it knew the
    rule was true), answers to earlier questions, and clear warnings about traps it
    had discovered along the way (Figure 3).\n\nLike Opus 5, Claude Opus 5.5 and Claude
    Sonnet 5.5 both closed the loop, using memory to capture validated rules about
    how to best answer future questions. With memory, both scored about the same as
    Opus 5, though their baseline performance without memory was slightly higher.\n\n###
    Claude has learned to judge salience\n\nWe also evaluated Claude’s ability to
    play _Pokémon Red_, a game that [challenges Claude to navigate](https://www.youtube.com/watch?v=CXhYDOvgpuU)
    complex long-horizon tasks, as a test of Claude’s judgment about _what_ to save
    to memory. At the start of each run, we gave each model a folder "
