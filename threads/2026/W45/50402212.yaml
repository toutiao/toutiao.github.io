    not written for human eyes; useful for low-stakes ledgers, frustrating when the
    right kind of errant note can derail a longrun 2 weeks later.<p>- The memories
    seemed to err towards the side of remembering everything and recording incidental
    details; useful for remembering the user is gluten-free, but not for tracking
    spec changes over time.<p>- The memories could be specific to a subagent <i>or</i>
    the project <i>or</i> the whole system; an obvious &amp; elegant system for toy
    examples, but a terribly unweildy one for anyone working at scale over the span
    of months.<p>[1]: if curious, a somewhat-outdated version of it is here: <a href=\"https:&#x2F;&#x2F;gitlab.com&#x2F;doering-ai&#x2F;libs&#x2F;fleet\"
