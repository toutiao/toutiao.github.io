  text: 'So after reading the article, I asked a Claude Code session I&#x27;m working
    in at the moment about its memory and whether it needs to &quot;dream&quot; to
    reorganize itself because I honestly wasn&#x27;t sure what it was doing about
    it.<p>It explained that unlike Chat, each project in Claude Code creates memory
    files in ~&#x2F;.claude&#x2F;projects&#x2F;[project path]&#x2F;memory&#x2F; with
    notes about both the project and my impromptu directives or instructions, and
    a MEMORY.md index file that&#x27;s loaded for every new session. It told me that
    my current project - which has been going on for a while - has 61 files in its
    memory, so it suggested that now in fact would be a good time to clean them up.
    Perfect.<p>It gave some examples of things things it has memorized: Apparently
    I once told it to always capitalize the first letter after a colon. I don&#x27;t
    remember doing that, but hey, that&#x27;s basic English grammar, dammit, so I
    can see myself getting pissy about it. It had saved that bit of petulance on my
    part in the memory.<p>That&#x27;s great, but it was saved <i>only in the memory
    folder of that project</i>. This is good to know! I hadn&#x27;t realized that
    stuff wasn&#x27;t saved globally. Or rather, I vaguely remember turning that option
    off at some point and now I&#x27;m realizing that means I need to do some maintenance
    manually if I don&#x27;t want to have to constantly remind Claude to capitalize
    properly, (and to always refer to me as Mr. Big.)<p>Definitely a good article
    for me to read right now.'
