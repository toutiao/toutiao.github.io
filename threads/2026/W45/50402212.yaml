  author: antonvs
  text: '&gt; post-hoc conflict resolution process for memory (which is part of the
    theorized purpose of dreaming in the human brain)<p>That’s not accurate. One leading
    hypothesis is that the experience of dreaming is a <i>side effect</i> of memory
    processing and consolidation[1]. Using the name of a side effect to describe the
    process that produces it is misleading, and at best it goes well beyond what’s
    actually known.<p>[Edit: and the side effect in question, dreaming, is closely
    tied to consciousness in humans. Using an “analogy” with those connotations is
    an unfortunate mistake.]<p>[1] “The process of memory reactivation and consolidation
    in the sleeping brain appears to influence conscious experience during sleep,
    contributing to dream content recalled on awakening.” — <a href="https:&#x2F;&#x2F;pmc.ncbi.nlm.nih.gov&#x2F;articles&#x2F;PMC4704085&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;pmc.ncbi.nlm.nih.gov&#x2F;articles&#x2F;PMC4704085&#x2F;</a>'
