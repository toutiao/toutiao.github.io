  text: That&#x27;s kinda the point, right? Ideas are cheap, so companies can afford
    to buy 1000 humans worth of ideas to try and particle collider them together.
    Execution is rarely one person sitting in a room and pressing buttons and things
    change.<p>So my thought about sharing and not thinking about &quot;my secret sauce&quot;
    anymore is just necessary. Share what you think your cool flavor of an idea is,
    someone else can groove on it, and maybe you and them will grow it into something
    more.<p>A major problem as I see it is kinda geek-class-warfare coming to a head.
    So much of my personal and anecdotally collected experience from others is essentially
    being locked out of knowledge and ideation because a &quot;upper geek class&quot;
    decided that they were not worthy of having their idea shared, specifically because
    that class thought they could make money from it, or because they were insular
    for some other in group reason. That meant good ideas that just needed a single
    word or connecting bridge from one topic to another ended up withering, and mediocre
    ideas ended up being accelerated because of just sheer populace force.<p>And that
    just makes people feel bad. Someone working for 2 1&#x2F;2 years on an idea that
    just happens to come out on the Internet is not going to feel good. It&#x27;s
    going to make them feel invalidated, it&#x27;s going to make them feel exhausted,
    it&#x27;s going to make them feel like they didn&#x27;t do enough. When it&#x27;s
    just not the case.<p>Anyway. I just wanted to say something to this as well, because
    it&#x27;s sort of just dismisses a person&#x27;s ideas. I don&#x27;t think you&#x27;re
    intentionally doing that, but even repeating the phrase, &quot;ideas are cheap&quot;
    cheapens what it actually takes to come up with an idea. And now in 2026, when
    literally any idea can become something real, I really don&#x27;t think ideas
    being cheap means ideas aren&#x27;t valuable.
