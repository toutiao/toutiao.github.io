  author: ffsm8
  text: 'Think about it from an ops perspective: for running inference, a model is
    essentially a gigantic binary blob that needs to be loaded into ram to process
    the request.<p>Updating weights means your changing this model.<p>To facilitate
    this feature, the inference provider would need to have your personalized model
    loaded into ram to process your request in a timely manner. Now multiply that
    by the number of users they&#x27;re serving.<p>You can try to optimize it a bit
    by essentially gluing the changing weights as a &quot;overlay&quot; to be applied
    to the original model, but that comes with it&#x27;s own trade-offs (aside from
    the fact it hasn&#x27;t been implemented, just theoretically doable). And it would
    be seriously hard to implement well.<p>The amount of resources this would bind
    makes this infeasable for cloud inference like anthropic provides.'
