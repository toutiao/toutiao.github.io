  author: yfontana
  text: 'For most dev work I ask claude code &#x2F; codex to plan larger work as epics
    and stories (after ideation &#x2F; brainstorm if needed). I find that this works
    well to let the AI, my coworkers and me track what has been done so far and what&#x27;s
    left in the backlog. Sometimes I direct it on how to split the work, sometimes
    I don&#x27;t.<p>When analyzing my session logs, I tried to look at how story size
    relates to how much work the AI had to do to fully implement it (made easier by
    my sessions always having epic#.story# - like 2.6 - in their name). Neither &quot;story
    size&quot; nor &quot;AI work&quot; have fully obvious metrics, so I looked at
    a variety of things, like length of story plan, number of lines of codes written
    for the story, number of different files read&#x2F;written (and for AI work: number
    of tool calls, number of tokens for main thread &#x2F; implementer &#x2F; reviewer
    subagents, etc.).<p>The pattern is always pretty much the same: smaller stories
    are less token-efficient. One major factor for this is that in bigger stories,
    the average number of lines of code written per tool call is significantly higher
    (and not just a little bit, if I remember correctly it&#x27;s a factor of 1 to
    3 between my smallest and largest stories).<p>None of this is scientifically rigorous,
    but it&#x27;s consistent over a fairly significant sample (about 60 stories up
    to this point). I&#x27;m also only measuring amount of work and not quality, but
    when I find things wrong with a story, I generally ask the AI to fix the issues
    in the same session, so the two should be correlated (sometimes the issues are
    large enough that they require new, separate stories to fix, but this is normally
    caused by problems in ideation and&#x2F;or planning, not implementation). This
    is enough to encourages me to ask for more rather than less per story. It might
    also not apply to everyone, I&#x27;m sure this is dependent on everyone&#x27;s
    workflow and way to work with the AI. But yeah, that&#x27;s the sort of stuff
    you can explore when analyzing your session logs.'
