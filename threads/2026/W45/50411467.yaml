article:
  url: https://www.lorekit.io/blog/open-agent-memory-format
  title: Agent memory needs its OpenTelemetry moment — LoreKit blog
  fetch_status: success
  content: "[All posts](/blog)\n\n## [Count the memory formats on your machine](#count-the-memory-formats-on-your-machine)\n\nList
    every place your coding tools keep something they \"remember\". A typical setup
    today:\n\n- an `AGENTS.md` or `CLAUDE.md` in most repos, and `.cursor/rules/*.mdc`
    in a few\n- an agent writing files to a `/memories` directory through Anthropic's
    memory tool\n- Copilot keeping facts about each repo on GitHub's side\n- a memory
    MCP server keeping a JSONL knowledge graph\n\nThat's four different shapes, and
    **none of them can read the others**. A lesson your CI agent learns stays in whatever
    wrote it. Your editor agent can't read it, and neither can the next tool you try.\n\nEach
    format is reasonable on its own. Together, they rebuild the same small idea again
    and again: _a note an agent left for its future self, stored at some address,
    true for a while._\n\nAnd the list keeps growing. Browse r/ClaudeAI, r/LocalLLaMA
    or r/cursor and you'll find a steady stream of \"I built a memory layer for my
    agent\" posts, each with its own storage, its own schema and its own MCP tools.
    That's good evidence the problem is real: people keep hitting it badly enough
    to build something. But every new solution adds one more format that nothing else
    can read. **The problem isn't a missing tool. It's a missing agreement** , and
    that only comes from the community working on it together.\n\nI build one of these
    tools, LoreKit, which is open source. This isn't a pitch that LoreKit has solved
    memory. Its format is one proposal among several, with gaps of its own. The point
    is that **this is the moment to agree on a shared shape** , and that another field
    has already shown how.\n\n## [We've seen this before](#weve-seen-this-before)\n\nBefore
    2019, every observability vendor shipped its own agent, its own instrumentation
    library and its own data format. Switching vendors meant instrumenting your code
    again. Two open projects, OpenTracing and OpenCensus, tried to fix that and competed
    with each other too.\n\nIn 2019 they merged into **OpenTelemetry**. What mattered
    was what the vendors agreed to stop competing on:\n\n1. **A data model** : what
    a span, a metric and a log record are.\n2. **Semantic conventions** : shared names
    like `service.name` and `http.*`.\n3. **A protocol** : OTLP, one way to send the
    data.\n4. **Reference implementations** : shared SDKs and the Collector.\n\nVendors
    kept competing on what they _do_ with the data: storage, querying, analysis. Users
    instrument once. I work with OpenTelemetry every day at [Dash0](https://www.dash0.com),
    and that agreement is why a whole ecosystem of tools can read each other's data.\n\n![Two
    columns compare observability, which OpenTelemetry settled, with agent memory,
    which is still open, across four layers: data model, semantic conventions, protocol,
    and implementations. For memory, the first three layers are drawn dashed because
    nobody has agreed on them yet.](/blog/otel-parallel.svg)\n_The same four layers.
    Observability agreed on them and competes on what happens after the data arrives.
    Agent memory has plenty of implementations, but nothing agreed underneath them._\n\nAgent
    memory is where observability was before 2019. The timing is good: the formats
    are young enough to change, and there's already a neutral home for agent standards.
    MCP and `AGENTS.md` both sit under the Linux Foundation's Agentic AI Foundation.\n\n##
    [A tour of the shapes](#a-tour-of-the-shapes)\n\nThese change quickly, so treat
    the details as a snapshot from late 2026.\n\n| Family | Example | The unit of
    memory | Addressed by | Forgetting |\n| --- | --- | --- | --- | --- |\n| Instruction
    files | `AGENTS.md`, `CLAUDE.md`, Cursor `.mdc` rules | A whole Markdown file
    | File path (plus `globs` for Cursor) | Never. A person edits it |\n| Agent-managed
    files | Anthropic's memory tool | A file under `/memories` | A path the model
    picks | Never, unless the model deletes it |\n| Hosted repo facts | GitHub Copilot
    Memory | A fact with code citations | One repository | Deleted after 28 days unused
    |\n| Context blocks | Letta core memory | A labeled block with a character `limit`
    | A `label` on an agent | Never. Always in context |\n| Extracted facts | Mem0
    | A fact the service extracts from messages | `user_id` / `agent_id` / `run_id`
    / `app_id` | Optional expiration date |\n| Namespaced store | LangGraph `BaseStore`
    | A JSON `value` dict | A `namespace` tuple + `key` | Optional TTL, reset when
    the item is read (by default) |\n| Knowledge graph | MCP reference memory server
    | Entities, relations, observations | Entity name | Never |\n| Temporal graph
    | Graphiti / Zep | A fact on a graph edge | Entities + edge | Facts are invalidated
    rather than deleted, on two timelines |\n| Addressed record | LoreKit | A record
    with a scope, key and lifecycle | A scope string + `key` | Never, unless a TTL
    is set |\n\nA few of them got something right that a shared spec should keep.
    **Copilot Memory** pairs citations you can check against the code with forgetting
    by default, though it's locked inside one product. **LangGraph** shows how small
    the core can be: `put(namespace, key, value)`. **Graphiti** models time properly,
    with separate timelines for when a fact was true and when it was recorded. And
    **`AGENTS.md`** shows that a plain file at a known path can become a standard.\n\n###
    [The proposals that already exist](#the-proposals-that-already-exist)\n\nSeveral
    people have started on this. MacPaw Research's **Portable Memory** is a `.mem`
    bundle with byte-reproducible serialization, deletion tombstones and optional
    signing; its authors say it isn't widely adopted yet. The **Open Memory Protocol**
    is an April 2026 draft for moving conversations and the memories derived from
    them between platforms as a ZIP with a manifest. Cognee's **COGX** format imports
    from Mem0, Letta and Zep.\n\nThese mostly solve **export** : moving one person's
    memory from vendor A to vendor B. Coding tools also have a second, open problem:
    **live addressing**. When a CI job, an editor agent and a review bot work in the
    same repo at once, how do they read and write the _same_ place and agree on what
    it means? A complete spec needs both.\n\n![Two problems side by side. Left, export:
    memory in vendor A is packed into a bundle such as a .mem file, an .omp.zip or
    COGX, and unpacked in vendor B. Right, live addressing: a CI job, an editor agent
    and a review bot all read and write one address, repo::acme/checkout, at the same
    time.](/blog/export-vs-address.svg)\n_Export moves one owner's memory between
    vendors. Live addressing lets many tools share one place at the same time. The
    existing proposals focus on the first. A shared address could sit inside their
    records to cover the second._\n\n## [What a shared spec could look like](#what-a-shared-spec-could-look-like)\n\nStrip
    away the branding and every format answers the same four questions differently:
    **where** a memory is true, **what its identity is** (does a second write update
    it or duplicate it?), **what it says** , and **when it stops being true**. Nobody
    disagrees that those matter. The tools only disagree on the answers, which is
    where OpenTelemetry started too.\n\nThere's one real fork: **who writes the memory**.
    In instruction files it's a person. In the memory tool, Letta and LoreKit, it's
    the model. In Mem0 and Graphiti, a service extracts facts from the conversation.
    A spec doesn't need to pick one. It needs to _record_ which, so a reader knows
    how much to trust what it reads.\n\nHere's roughly what one record could look
    like as a file. It illustrates the data model; the field names aren't a proposal:\n\n
    \   ---\n    spec: agent-memory/0.1\n    id: 8f0c2a6e-4b1d-4c7a-9e2f-3a5b6c7d8e9f\n
    \   address: { level: repo, value: github.com/acme/checkout }\n    key: tests-need-local-postgres\n
    \   kind: lesson\n    written_by: { type: agent, name: claude-code }\n    content_type:
    text/markdown\n    lifecycle: { expires_at: null, extended_by: write }\n    attributes:
    { vcs.pr: 482, ci.run_url: \"https://ci.example/runs/123\" }\n "
