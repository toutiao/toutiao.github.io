  text: The issue with storing the memories in some encoded representation (e.g. in
    embedding space) is that this would turn that representation into something that
    has to be supported &quot;forever&quot;. I have projects that I have worked on
    with Opus 4.6, 4.7, 4.8, 5, 5.5, as well as Fable 5 and 5.1, and obvious some
    Sonnet subagents along the way. And I expect to keep working on the same codebase
    when Opus 6 and Opus 7 release. Text is trivially compatible with all of those,
    but their embeddings all differ. And whatever other representation you come up
    with right now in Opus 5.5 might no longer make sense in the model architecture
    of Opus 7<p>Imho the interesting challenges with memory are about &quot;what does
    this memory belong to&quot; (attaching it to lines of code or similar), &quot;what
    does it relate to&quot; (webs of memories), &quot;is this even still true&quot;
    (&quot;sleeping&quot;, &quot;reconciliation&quot;, etc). But there&#x27;s no real
    consensus what is even useful to handle, never mind how to handle it
