  text: |-
    GEOS and the like was a bit before my time, I mostly know about geoworks because back in the 2003 while in high school, I played a lot of &quot;Wyvern&quot; (<a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20030212212420&#x2F;http:&#x2F;&#x2F;www.cabochon.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20030212212420&#x2F;http:&#x2F;&#x2F;www.caboch...</a>), an online 2d rpg game primarily made by Steve Yegge. There seemed to be significant contributions from other GeoWorks related people early on and I had noticed the name come up from time to time.<p>Here&#x27;s some GEOS&#x2F;GeoWorks related internet archaeology you may find interesting<p>The GEOS Software Library: <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20021203000244&#x2F;http:&#x2F;&#x2F;www.tvakatter.org&#x2F;about.php" rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20021203000244&#x2F;http:&#x2F;&#x2F;www.tvakat...</a> (&quot;Två Katter&quot; = swedish for two cats, a play on tucows.com)<p>Video of the launch party for GeoWorks Ensemble 2.0 with CEO Brian Dougherty: <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=wOImkzTyJ7s" rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=wOImkzTyJ7s</a> &quot;Geoworks - Brian&#x27;s Got A Brand New Bag&quot;<p>Steve briefly mentioning that he worked for GeoWorks, and why he thinks&#x2F;thought it ultimately couldn&#x27;t keep up with changes.
    <a href="https:&#x2F;&#x2F;steve-yegge.blogspot.com&#x2F;2008&#x2F;05&#x2F;dynamic-languages-strike-back.html" rel="nofollow">https:&#x2F;&#x2F;steve-yegge.blogspot.com&#x2F;2008&#x2F;05&#x2F;dynamic-languages-s...</a><p>&gt;I went to the University of Washington and [then] I got hired by this company called Geoworks, doing assembly-language programming, and I did it for five years. To us, the Geoworkers, we wrote a whole operating system, the libraries, drivers, apps, you know: a desktop operating system in assembly. 8086 assembly! It wasn&#x27;t even good assembly! We had four registers! [Plus the] si [register] if you counted, you know, if you counted 386, right? It was horrible.<p>&gt;I mean, actually we kind of liked it. It was Object-Oriented Assembly. It&#x27;s amazing what you can talk yourself into liking, which is the real irony of all this. And to us, C++ was the ultimate in Roman decadence. I mean, it was equivalent to going and vomiting so you could eat more. They had IF! We had jump CX zero! Right? They had &quot;Objects&quot;. Well we did too, but I mean they had syntax for it, right? I mean it was all just such weeniness. And we knew that we could outperform any compiler out there because at the time, we could!<p>&gt;So what happened? Well, they went bankrupt. Why? Now I&#x27;m probably disagreeing – I know for a fact that I&#x27;m disagreeing with every Geoworker out there. I&#x27;m the only one that holds this belief. But it&#x27;s because we wrote fifteen million lines of 8086 assembly language. We had really good tools, world class tools: trust me, you need &#x27;em. But at some point, man...<p>&gt;The problem is, picture an ant walking across your garage floor, trying to make a straight line of it. It ain&#x27;t gonna make a straight line. And you know this because you have perspective. You can see the ant walking around, going hee hee hee, look at him locally optimize for that rock, and now he&#x27;s going off this way, right?<p>&gt;This is what we were, when we were writing this giant assembly-language system. Because what happened was, Microsoft eventually released a platform for mobile devices that was much faster than ours. OK? And I started going in with my debugger, going, what? What is up with this? This rendering is just really slow, it&#x27;s like sluggish, you know. And I went in and found out that some title bar was getting rendered 140 times every time you refreshed the screen. It wasn&#x27;t just the title bar. Everything was getting called multiple times.<p>&gt;Because we couldn&#x27;t see how the system worked anymore!
