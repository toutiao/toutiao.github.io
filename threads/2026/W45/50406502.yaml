  author: twotwotwo
  text: 'People often talk about how fast old software is, but one of the things that
    stands out about GeoWorks for me is how <i>small</i> it was while doing a lot.<p>Of
    course, lots of things that make modern software bigger are things we very much
    don&#x27;t want to do without--full Unicode support, accessibility, clever rendering,
    improvements to quality of life. But our &#x27;foundations&#x27; are also built
    higher; the Web platform and a bunch of native toolkits provide a lot out of the
    box. (The platform doesn&#x27;t include all the widgets that are now quasi-standard,
    of course, so we build a lot on top anyway.)<p>There are also a ton of useful
    third-party libraries you can call on without getting too bloated, and there&#x27;s
    a lot that would have been bloated then but not now: in the 90s you probably wouldn&#x27;t
    embed an SQL DB you didn&#x27;t really need, but SQLite is a pretty safe dependency
    now.<p>Nothing in particular I&#x27;m really driving towards here but I think
    &quot;how do I keep the code to functionality ratio good&quot; can still be an
    interesting angle from which to look at high-level design decisions even as a
    lot of the circumstances and numbers have changed over decades.'
