    We've been doing something like the first-pass-reject round mentioned above more in the networking world (originally HotNets, now NSDI), and I really like it. It is a bummer to have your paper rejected at that round since it means you get less feedback, but at least you get a result fast, and hopefully the proceedings will be more fun and useful to read, too!
    Unfortunately I don't think that "just write better" is a relatively easy fix -- learning to write well is hard, and improving requires time, experience, and feedback. Remember that papers are often being led by people new to writing scientific papers (i.e., students), which is part of how they learn how to write better. Not everyone is blessed with a group around them that can coach writing well, unfortunately, though I also agree that seeking out opportunities for technical writing outside of papers (e.g., blog posts) is so important for junior folks, especially if they don't have great writing support.
    And that circles back to the review challenges -- I realize it's a glass-half-full take, but I try to remember that poor writing can sometimes hide great contributions. Heck, sometimes authors and reviewers don't fully realize the contribution of a paper at the time of its writing, so of course it might not be easy to understand from the text without context!
