    That's part of what I meant with self-obsessed. The whole "too obvious" feels silly in a world where people have trouble reproducing findings and then not being sure if it's because they did something that wasn't explicitly mentioned.
    Leaving things out feels like the opposite of science.
    And terminology as well often times varies a bit, enough that reproducers who are working in the field end up being puzzled.
    And all of this (I'm exaggerating of to make a point) makes it feel like academia hinders scientific progress. And that feels just silly.
    We have so many people agreeing about shortcomings yet so little movement. We have so many people say we can and should do better but it feels like even in a field that comes with a certain degree of pride being a scientist/researcher that pride isn't enough to actually do better. Again generalizing, because I hope it's clear that with such a huge group of people every statement has exceptions.
    It's just sad because then people complain about things like "lack of trust in science". And while I know there's more to it it often seems like the culture is a s bit full of itself, but not in a scientific but ideological sense and that's where the whole concept of the scientific process falls apart and are replaced by things like biases.
    I hope that doesn't sound too ranty, but I care about neutral objective truths and the scientific process, and at least in my bubble people are unhappy about it and kind of have a "well it is what it is" attitude towards it. I was extremely happy when a few years ago steps to publish negative outcomes were taken and I hoped that this leads to more, but it feels like while there is scientific progress the philosophy of science so to say is only pulled out of the hat when people want to feel superior and too rarely is applied in daily practice.
    And I know there are many factors and I know it's tough and I would never blame anyone and I know that basically everyone wants to do better. I just sometimes wished that said pride would shift more towards "doing things right", because I do believe one can set examples.
    And I'm curious if people feel like there is movement, because I only have my tiny bubble as a non academic.
