  text: |-
    Sadly, the incentives often work the other way.  If a paper explains its core ideas well enough, reviewers often say that it is too obvious to merit being a contribution at a top-tier venue.  I tend to have the opposite view: if you have explained the problem so well that your solution is obvious after reading that part of the paper (but not before I started reading) then you're a best-paper candidate.  But I have had a lot of arguments with other reviewers about this in PC meetings.
    If a paper is hard to read, it makes you feel like you've done a lot of thinking to understand it and so it must be a difficult subject, so it must be a serious contribution.
    I'd love for papers to have a first-pass-reject round where anything where it takes more than five minutes to understand the problem that they're trying to solve and at least have a vague notion of their approach gets a quick reject.  Until we have something like that, I encourage academics to write blogs and extended technical-report editions of papers, which are easy to read and contain all of the important background.
