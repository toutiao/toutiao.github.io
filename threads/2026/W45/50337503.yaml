  text: IMO Astra isn’t really lazy, just extremely literal so when you use it side
    by side with gpt-6.1-sol, it might appear more lazy but it’s often just the big
    difference in prompting between the 2. Astra wants a clear goal definition of
    what you want it to do, while sol infers a bit more. And the Claude’s infer a
    lot lot more.<p>From memory, prompts like “this file is a bit messy” would trigger
    Sol and Claude to start editing the file immediately, while Astra wouldn’t. But
    if you give Astra a clear plan and a definition of what you want it to do, then
    it will keep working until that ask is fulfilled.<p>Especially compared with Claude
    that’s a huge difference, Claude is so proactive, I have to ESC it multiple times
    during the day and tell it to wait because I only asked a simple question.
