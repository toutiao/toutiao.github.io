  author: brkomir
  text: 'I usually run 4-5 claude sessions in parallel on the same branch, each with
    its own working plan or work item. They coordinate almost in real time, leaving
    messages in a shared queue and picking them up every 30 seconds. What keeps them
    from stepping over each other&#x27;s work is a commit script that allows only
    staged changes from one session to be committed at a time.<p>Where it actually
    pays off to have separate sessions is the code review. Every code change that
    affects how the app behaves is checked by a session that didn&#x27;t write the
    change. Some numbers: 4,454 verdicts on 4,471 commits since September. About four
    in five first reviews found something, and about half asked for changes.'
