  text: |-
    Generalizing a bit, one could say that:

    plain UDP DNS is bad, because it can be easily intercepted by the local ISP (who is evil and implements censorship)
    DoT/DoH is bad, because it cannot be easily intercepted by the local ISP (who is good and implements security controls)

    I don't think it's possible to reconcile these two problems – you fix one, you break the other. I feel that current state of things isn't such a bad balance: your ISP can mess with your traffic (as they can mess with all traffic; if they couldn't rewrite DNS responses, they could simply route traffic to the resulting IP to their own box), but you as a LAN administrator can mess with it too. There's a hobby forum that has blocked access from my entire country – I can configure my home network's DNS to point it at a tun2proxy instance connected to a VPN.
    If a service needs tamper resistance, it can be provided on the transport layer, which will protect not just from DNS tampering, but also from tampering on a routing level or (to some degree) OS level. TLS/https certificates provide a minimal level of protection here, most ISPs can't easily mint certs for any domain; depending on your threat model, you can add more mechanisms on top of that, all the way to mutually authenticated end–to–end encryption.
    DNS is so complex because name resolution is a complex problem: it has to work on all levels, from localhost and VMs running on one physical host, through LAN and local services, intranet level, to worldwide Internet. If it malfunctions, everything breaks ("It's always DNS"). If it's slow, it slows everything down – hence multiple layers of caching. As we all know, "there are only two hard things in Computer Science: cache invalidation and naming things" – DNS is both.
    It's amazing that it works at all.
