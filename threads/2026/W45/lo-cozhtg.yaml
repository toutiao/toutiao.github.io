    I found that my ISP (Virgin Media in the UK) was tampering with port 53, blocked DoT entirely, and block DoH to some (not all) well known servers. It took me a while to work around this - also with unbound.
    Mostly this doesn't bother me because at work I use a vpn; but that has drawbacks too. Recently I figured out why firefox would often fail to connect to our vercel sites, when chrome worked. It turned out that firefox will try to use DoH via mozilla/cloudflare's default server, making a TYPE65 request that returns (among other things) 'alpn=h3'. That causes firefox to try to use QUIC to reach vercel...which the vpn blocks!
    It works when DoH is off, because then firefox uses a "happy eyeballs" approach, making both the http/2 and http/3 requests and just using the first response (always /2 because QUIC was blocked). I couldn't test exactly what was doing this off vpn because... Virgin were blocking DoH as above, so firefox always used the fallback behaviour and managed to connect.
