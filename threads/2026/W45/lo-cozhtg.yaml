    I hate that DNS, as a technology, is so frigged up. Off the top of my head:

    As this article states, UDP DNS interception/rewriting is trivial. You don't even necessarily have to be a MitM if you have any visibility into the network, because UDP.
    DNS is supposed to be scalable and redundant, but in practice, well, there's a reason why, "It's always DNS" is a meme among tech engineers. If DNS is not working perfectly on your network, you will find out about it in the most annoying ways possible.
    DNSSEC is a good idea, but is complex, has poor adoption, and either goes too far or not far enough in terms of security, depending on who you talk to.
    DoT seems like a good idea on paper, but it allows software (trusted AND malware!) to subvert local network security controls.
    DoH has the same concern, but also requires clients to incorporate a whole full-featured HTTP stack.
    Even tech people tend to have a poor understanding of how DNS actually works. I still hear people to this day say "DNS record propagation" as if that is a real thing.

    I could go on...
