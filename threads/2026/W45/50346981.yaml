  text: It&#x27;s not about the tools.<p>I also regularly complain about AI generated
    content. I do that mostly, because it&#x27;s often either<p>- extremely uninspired
    design and UX wise (e.g. the classical beige&#x2F;serif AI slop website),<p>-
    full of obvious and stupid mistakes (e.g. those shitty infographics on social
    media),<p>- just mimics the real thing, but misses the actual purpose (e.g. again
    those shitty infographics on social media)<p>- or is ridiculously overloaded with
    features and documentation (e.g. many AI generated software tools on GitHub)<p>That&#x27;s
    repelling to me, because it screams that the human behind it is himself lazy and
    uninspired. It&#x27;s bland, overloaded or full of mistakes, because raw output
    is a commodity.<p>It feels like a waste of time to even consume something, that
    the author or developer wasn&#x27;t willing to put actual effort and thought into.<p>But
    that&#x27;s an artefact of how the author is using the tool and presenting the
    results.<p>It&#x27;s not an inherent property of AI use itself. HackerTimes for
