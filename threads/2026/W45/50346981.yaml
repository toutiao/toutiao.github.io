    ### Jobless tech workers are being left out of San Francisco's AI boom

    ## Technology

    ## Show HN Presents Hacker Times

    This submission concerns Hacker Times, the site you are reading. It presents Hacker News stories in a newspaper-style layout, with links to original sources and hourly editions.

    ## Hacker News Opens Its November Hiring Thread

    The monthly discussion invites employers to share active openings, including location and remote-work restrictions. Posts are limited to people at the hiring company, rather than recruiting firms or job boards.

    ## A Case for Thinking Alongside Coding Agents

    ## NIST Offers a Cybersecurity Primer for Solo Business Owners

    ## A Fingerprint Lock Concealed a Plain SD Card, Researcher Finds

    ## A European Initiative Builds a Reference Stack for Industrial RISC-V

    ## Software

    ## An Earlier Report Questions Ubuntu’s Kernel-Patch Delay

    In an October 31 article, freenode news reported that Ubuntu’s 22.04, 24.04 and 26.04 LTS releases still lacked kernels patched for CVE-2026-98432. This is the report’s account, not a fresh verification of Canonical’s current patch status.

    ## DiscImageStudio Turns Optical Discs Into Visible Artwork

    The open-source project converts pictures into data designed to create visible patterns on CDs, DVDs and single-layer Blu-ray discs. Its Windows app supports design and burning, while an experimental Linux and macOS command line generates images offline. The documentation warns that direct burning remains experimental.

    ## Scaling Git at OpenAI

    ## Nvidia’s Open Library Gives AI Agents a Shared Data Vocabulary

    ## Science

    ## Seeds Found in an Attic Help Revive an Old Italian Wheat

    After finding a sack of unfamiliar seeds, farmer Claudio Grossi helped bring a heritage wheat back into cultivation. Smithsonian follows the grain from his farm near Parma to research labs and artisan bakeries.

    ## An Argument for Mathematics Beyond Individual Credit

    In a guest essay on Terence Tao’s blog, Karthik C. S., Amit Sahai and Jie Xue argue that mathematical work should be valued for the understanding it brings, not for outperforming other people or machines. They urge a less ego-centered response to AI’s role in research.

    ## Researchers Find Conditions Under Which AI Models Learn a Shared Representation

