  author: jon128
  text: Please elaborate on details if you can.<p>What Uber posted there did prompt
    me to investigate the topic of Postgres old MVCC, OrioleDB, and MariaDB&#x27;s
    alternative MVCC.<p>Ultimately, one change in a row results in the entire row
    being written again, from what I read. Is this not accurate?<p>MariaDB&#x27;s
    MVCC doesn&#x27;t write the entire row again, only the delta. One of the newer
    more advanced MVCC for MariaDB are even more efficient.<p>In my view, &quot;runaway
    vacuum&quot; has never not been a case of either poorly done IT operations or
    poorly thought out (or just not thought out) database usage patterns by the in-house
    application developers. While &quot;throw hardware at the problem&quot; isn&#x27;t
    a great answer, I have never not seen NVDIMM for ZFS ZiL&#x2F;SLOG not mitigate
    &quot;runaway vacuum&quot;, as ugly as that is -- that was a long time ago though.<p>SSD
    endurance can get daunting in an advanced hosting environment. It&#x27;s odd that
    I don&#x27;t often see others have these metrics in their Prometheus+Grafana.
    The people who are telling me that OrioleDB alleviates their endurance concerns
    aren&#x27;t at liberty to show me their Grafana.<p>I might be able to get some
    real SSD endurance metrics comparisons at meaningful scale over the next couple
    years but I don&#x27;t know.<p>Beyond that, I think the only real way to find
    out is a snapshot of real-world application production Postgres databases and
    use logical replication to replay a year of database traffic to find out what
    the delta on SSD endurance impact is.<p>I don&#x27;t claim to be a Postgres expert
    relative to the upper echelon that frequents this site, always happy to get more
    insight to Postgres, my attention has generally been on either North or South
    side of that part of a webscale stack.
