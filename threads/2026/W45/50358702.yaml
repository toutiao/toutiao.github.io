  author: mike_hearn
  text: 'The MVCC article is good but feels like it&#x27;s trying too hard to be a
    &quot;on one hand, on the other hand&quot; kind of analysis. Postgres is the only
    database that uses its design because, as the article admits at the end, it has
    &quot;operationally loud failure modes&quot;.<p>Compare Postgres and Oracle (block
    undo based) for what happens when the database is underprovisioned:<p>• Postgres:
    bottlenecks on CPU. The database falls behind on vacuuming and dies.<p>• Oracle:
    bottlenecks on free disk space. Individual long running statements, SNAPSHOT and
    READ ONLY transactions get cancelled with a &quot;snapshot too old&quot; error.<p>In
    Oracle the database continues running and the blast radius is limited to a single
    statement. Because it&#x27;s the longest running statements that die first, that
    almost certainly means an asynchronous business report and not live user traffic
    - which is exactly what you&#x27;d hope for. Most businesses can tolerate a missing
    day in a report much better than customer-facing outages, and fixing it is just
    a single SQL statement if you have free disk space (adding more storage is easy
    due to the SAN).<p>That&#x27;s much preferable! How many post mortems do we see
    on HN from some startup bemoaning a multi-hour outage caused by Postgres&#x27;
    MVCC choices? Quite a lot. Now think about how often do you recall reading a post
    mortem of an outage at some big bank, hospital, shipping port etc that traces
    back to Oracle&#x27;s MVCC engine? I don&#x27;t think I ever read one. The startup
    world likes to make fun of Big Enterprise, but they have a much better track record
    of database uptime because they stay away from vacuum-based MVCC.<p>Disclosure:
    I have a part time role in the Oracle DB group. Unapproved opinions may be found
    above, caveat emptor.'
  score: 0
