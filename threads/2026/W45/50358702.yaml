  author: daniele_dll
  text: GET and SET (and similar) are easy, let me know if you keep the same performances
    once you start to need RMW operations or even transactions to deal with multi
    keys commands or add clustering support :)<p>Also going faster than Redis doing
    only GET and SET is fairly easy, the very very very early versions of cachegrand
    (pre 0.1) were doing well over 100M&#x2F;s of GET and SET on a 32 core &#x2F;
    64 threads machine with pipelining.<p>Once you start to chuck the rest to make
    it actually &quot;usable&quot; it&#x27;s where you start to massively lose performances.
