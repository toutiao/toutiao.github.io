  author: weitendorf
  text: |-
    Didn&#x27;t see alignment padding mentioned anywhere so I&#x27;ll drop it here: did you know that the order of a table&#x27;s columns affects how much space a record uses?<p><pre><code>  bigint, bigint, bool, bool: 18 bytes (8+8+1+1), aligned up to 24
      bool, bigint, bool, bigint: 32 bytes (1 + 7 (alignment padding) + 8 + 1 + 7 + 8)
    </code></pre>
    But wait! There is the per-row overhead of ~30bytes. Your 18 byte row actually takes 54bytes of space. Well, multiples of 54 depending on how often you update&#x2F;vacuum it. But don&#x27;t make your rows too big either or you&#x27;re TOAST
