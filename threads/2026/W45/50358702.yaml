    |\n\n### The Internals of PostgreSQL\n\nPostgreSQL is a well-designed, open-source
    multi-purpose relational database system which is widely used throughout the world.\n\nIt
    is one huge system with the integrated subsystems, each of which has a particular
    complex feature and works cooperatively with each other. Although understanding
    of the internal mechanism is crucial for both administration and integration using
    PostgreSQL, its hugeness and complexity make it difficult.\n\nThe main purposes
    of this documentation are to explain how each subsystem works, and to provide
    the whole picture of PostgreSQL.\n\nThis documentation covers versions 19-beta
    (excluding the new buffer page lock mechanism) and earlier.\n\n[Some academic
    papers](https://www.google.com/search?q=%22interdb.jp%22+site:acm.org) have referred
    to this docum"
