  author: senderista
  text: The Postgres approach to MVCC (&quot;append-only storage&quot; in the jargon
    of <a href="https:&#x2F;&#x2F;www.cs.cmu.edu&#x2F;~pavlo&#x2F;blog&#x2F;2023&#x2F;04&#x2F;the-part-of-postgresql-we-hate-the-most.html"
    rel="nofollow">https:&#x2F;&#x2F;www.cs.cmu.edu&#x2F;~pavlo&#x2F;blog&#x2F;2023&#x2F;04&#x2F;the-part-of-postg...</a>)
    is mandatory if you actually return object addresses to the client and thus need
    pointer stability (I&#x27;ve implemented such a DB). However, Postgres doesn&#x27;t
    actually have this requirement so it makes little sense in that context. The beauty
    of undo log-based MVCC is that all versions superseded by a committed transaction
    are freed at the same time and from the same contiguous region of memory or disk,
    which makes it both memory- and SSD-friendly (&quot;grouping by death time&quot;
    in the jargon of <a href="https:&#x2F;&#x2F;research.cs.wisc.edu&#x2F;wind&#x2F;Publications&#x2F;nvmw18-he.pdf"
    rel="nofollow">https:&#x2F;&#x2F;research.cs.wisc.edu&#x2F;wind&#x2F;Publications&#x2F;nvmw18-he.pdf</a>).
