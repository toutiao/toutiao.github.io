  author: mike_hearn
  text: You can do time travel with any MVCC design. Undo logging is well suited to
    it and Oracle ships several forms of time travelling SQL under the name Flashback.<p>The
    simplest form of Flashback just uses the undo logs. Normally undo is deleted once
    no live transaction uses it, but you can set a retention time to allow SELECT
    ... AS OF ... queries to go back at least that far.<p>However, keeping undo logs
    around forever isn&#x27;t practical. If you want to go back a year then there&#x27;s
    Flashback Time Travel which copies old data into tables in a form that the query
    engine can use to answer AS OF queries more efficiently.
