  text: 'Agree with this. I started down learning more about archival while I was
    adding it to my own thing [1]. I wish there was more of an existing toolset for
    diffing archivals as well - what changed is just as interesting as what is there.
    Equally, something I kind of think is lacking in WARC&#x2F;WACZ is exploration
    of the archives - maybe forensics is too strong a word but it would be nice to
    have an easier way to explore what you’ve captured and understand the data in
    different dimensions.<p>I’ve supported some of this in my own tool, ZShot - capture
    in sqlite, Quicklook extensions for WARC and WACZ. Just trying to make archiving
    easy and interpretable.<p>It’s also been interesting to see people use archival
    but for different uses: Kiwix [2] showed up in my reading recently, “archival
    but for offline internet”, which I’m kind of fascinated by.<p>[1]: <a href="https:&#x2F;&#x2F;zshot-app.com&#x2F;for&#x2F;archivists&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;zshot-app.com&#x2F;for&#x2F;archivists&#x2F;</a><p>[2]:
