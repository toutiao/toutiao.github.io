  author: philipkglass
  text: |-
    I don&#x27;t think that mainstream models will try to rewrite the past, but I wouldn&#x27;t trust models to helpfully engage with your intent. As search engines encode better understanding of queries, model-like recalcitrance for &quot;naughty&quot; queries becomes easier to implement. Just compare something like<p><pre><code>  Disclosure Day free stream
    </code></pre>
    across Yandex and Google. I&#x27;m sure that Google has indexed the same web sites, but Yandex has a free stream as the #1 result and Google has either deindexed it completely or pushed it below dozens of less-relevant, more-legal sites. (According to Google, the site Yandex showed me wasn&#x27;t even DMCA&#x27;d out of the results.)<p>This isn&#x27;t just relevant for piracy. Paid subscriptions to frontier models will refuse or downgrade answers to questions about the natural sciences and engineering. Unlike cybersecurity, where you can get specially approved to use models with fewer refusals, I don&#x27;t think there is any program you can join where Anthropic will treat you like a grownup who has already read Carleone&#x27;s <i>Tactical Missile Warheads</i> book. Opus just won&#x27;t discuss details of high explosive engineering at all. It&#x27;s tolerable as long as search engines still surface relevant documents that you can read with your own human eyeballs. If LLMs devour the market for search, it&#x27;s going to become alarming.
  score: 0
