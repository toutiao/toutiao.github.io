  author: ajb
  text: Around 2005, my employer at the time did a refresh of our it equipment, replacing
    all the cheap stuff we had been acquired with. They asked everyone to say if they
    need a laptop, as desktops were the default at the time. I said I didn&#x27;t,
    and was surprised when he turned out that almost everyone else said they did.
    Most of them didn&#x27;t really need one, and presumably were planning to use
    them for personal stuff.<p>The company was a bit salty about this as laptops are
    more expensive, but they got them. And of course the company befitted, as that
    was the end of a clear separation between work and home. You have your laptop,
    you can answer email and attend meetings with people in other time zones. Before,
    it was easy; work stuff stayed on work computers and those didn&#x27;t leave the
    office when you went home.
