  author: wahern
  text: Radiative cooling isn&#x27;t as big of an impediment as people think. It&#x27;s
    part of the reason why a desert that&#x27;s 120F+ during the day gets so cold
    so fast <i>unless</i> there&#x27;s cloud cover to radiate back.[1] IIUC correctly,
    the theoretical maximum is over 400 watts per square meter, and existing tech
    can achieve 80-90+% of that. It&#x27;s an engineering challenge, but no more than
    creating reusable rockets. The real challenge is building a reliable convective
    system from the heat source to the radiating mechanism(s), and just the general
    problems of building a compact package for delivery that then unpacks and orients
    itself once in orbit. No new science is required, and you can pencil things out
    today the same way Musk did when penciling out the economics of building a reusable
    rocket.<p>Another way to think about it is whether orbiting data centers can be
    solar powered. Few people seem to think they can&#x27;t. The amount of area you
    need to dissipate the incoming solar energy is approximately similar to what you
    need to capture it, so if you can do the later you can do the former.<p>Is it
    <i>actually</i> financially viable at all? And if so what fraction of data center
    build-out is sustainable at the increased marginal costs? I dunno. I agree there&#x27;s
    probably some irrational exuberance involved in analyses. But don&#x27;t underestimate
    the time value of money, marginal cost structures, and related financing and RoI
    dynamics.<p>[1] Convection effects are also involved, but that cuts both ways
    as the atmosphere is also radiating back at you, which is much less of a problem
    in space. A significant fraction of the net cooling is pure radiative.
