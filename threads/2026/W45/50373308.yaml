  author: antonvs
  text: 'This is an old idea, dating back to at least the 1940s. Many experiments
    have already been done in microgravity environments.<p>In the 1960s, they used
    sounding rockets to do experiments on how molten metals solidify in microgravity,
    with manufacturing applications in mind.<p>In the 1970s, they ran experiments,
    also on sounding rockets, on melting and solidifying materials without letting
    them touch a container: <a href="https:&#x2F;&#x2F;ntrs.nasa.gov&#x2F;citations&#x2F;19840059952"
    rel="nofollow">https:&#x2F;&#x2F;ntrs.nasa.gov&#x2F;citations&#x2F;19840059952</a><p>More
    recently, many microgravity experiments have been performed on the International
    Space Station. Experiments were done on protein crystal growth aboard the ISS
    in 2000, just a couple of years after it was launched. (I think it took some time
    to get the experimental facilities up and running.)<p>Here’s an assortment of
    links on the subject, starting with a good overview:<p><a href="https:&#x2F;&#x2F;www.nasa.gov&#x2F;missions&#x2F;station&#x2F;applications-within-reach&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.nasa.gov&#x2F;missions&#x2F;station&#x2F;applications-within-re...</a><p><a
    href="https:&#x2F;&#x2F;issnationallab.org&#x2F;research-and-science&#x2F;space-research-overview&#x2F;research-areas&#x2F;in-space-production-applications&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;issnationallab.org&#x2F;research-and-science&#x2F;space-resear...</a><p><a
    href="https:&#x2F;&#x2F;www.nasa.gov&#x2F;missions&#x2F;station&#x2F;the-benefits-of-microgravity&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.nasa.gov&#x2F;missions&#x2F;station&#x2F;the-benefits-of-microg...</a><p><a
    href="https:&#x2F;&#x2F;ntrs.nasa.gov&#x2F;citations&#x2F;20200001550" rel="nofollow">https:&#x2F;&#x2F;ntrs.nasa.gov&#x2F;citations&#x2F;20200001550</a><p><a
    href="https:&#x2F;&#x2F;ntrs.nasa.gov&#x2F;citations&#x2F;20150023126" rel="nofollow">https:&#x2F;&#x2F;ntrs.nasa.gov&#x2F;citations&#x2F;20150023126</a><p><a
    href="https:&#x2F;&#x2F;asmedigitalcollection.asme.org&#x2F;manufacturingscience&#x2F;article&#x2F;145&#x2F;2&#x2F;020801&#x2F;1146197&#x2F;In-Space-Additive-Manufacturing-A-Review"
    rel="nofollow">https:&#x2F;&#x2F;asmedigitalcollection.asme.org&#x2F;manufacturingscience&#x2F;...</a>'
