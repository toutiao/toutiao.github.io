  author: rdl
  text: 7702 made the attack a bit more efficient but wasn’t critical.  The core sin
    was the control plane to submit orders to the MPC signing system (I think it has
    been reported as MPC vs HSM but largely equivalent here) was not sufficiently
    isolated, and insufficient preventive controls and alerting on dev machines.  But
    the number one thing for me is that devs could get access to replace signing control
    systems without a multiple person involved review and approval process. Plus $6.5B
    or more in assets in that system given that level of controls.<p>With this architecture
    honestly surprised a suborned insider didn’t steal the assets before this time.
    No need for outsiders if individual insiders can instruct a payment to be made.<p>(It
    is clear 7702 wasn’t core to this because non-eth systems using the same signing
    infrastructure were also compromised.)<p>I had a few long and fairly unpleasant
    calls with insurance markets over the past few days on this point as we do billion
    dollar insurance policies for similar risks; would have caught these during underwriting
    and raised with client and excluded or not issued until fixed.
