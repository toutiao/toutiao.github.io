  author: dboreham
  text: 'Of course as usual the legacy media article fails to address that key issue.
    If I had to guess I&#x27;d say that their system uses some sort of HSM to sign
    chain transactions but there are not strong controls on what txn it will agree
    to sign. Therefore somewhere in their code there&#x27;s a place where you can
    just insert your transaction du jour and it&#x27;ll go through. Once you have
    that scenario anyone who can modify the system&#x27;s code will be able to steal
    as much money as they want. So the &quot;developer laptop&quot; may have only
    been used to push a PR or perhaps change code via a more direct route -- publishing
    a new container image or other build artifact. Using AI tools I think it would
    be quite feasible to point an agent at the pile of code on that laptop and just
    ask it &quot;what code do I need to change to allow any transaction to be sent
    on-chain&quot;? So the attacker didn&#x27;t need to have deep knowledge of the
    system.<p>Edit: Binance has now published some details on the attack. The attacker
    subverted an EIP-7702 contract rather than as I theorized an HSM authorization
    process.'
