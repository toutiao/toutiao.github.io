  author: legoktm
  text: |-
    HTTPS prevents the mirror system from working, because the DNS entry points at a variety of hosts, but there's no TLS certificate distributed to all of them. whydoesaptnotusehttps.com used to be a site that explained this, but it was taken down a while back, I guess because the arguments were outdated.
    Today https://deb.debian.org/ is backed by a CDN provider and so it has TLS while still being geographically available. Ubuntu enabled HTTPS on their primary repository server in ~December 2024. IMO no reason to not use TLS with APT today.
    (n.b. I previously researched all of this for SecureDrop).
  score: 13
