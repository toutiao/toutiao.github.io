  author: hasley
  text: |-
    Yes, a lot of the ideas are not new.
    Nevertheless, it is currently an active field of research. One of them is &quot;Integrated Sensing and Communication&quot; (ISAC [or ICAS&#x2F;JC&amp;S&#x2F;...]).<p>One idea is to exploit the signal&#x27;s structure - despite simply trying to correlate the received line-of-sight signal with its delayed copies.<p>Especially OFDM has a nice structure. You can estimate delays (-&gt; distances) as frequencies along the subcarriers and Doppler shifts (-&gt; velocities) as frequencies along consecutive OFDM symbols. Estimators like maximum likelihood, ESPRIT, MUSIC, and compressed sensing etc. are your friends here for high-resolution results.<p>Unfortunately OFDM has a problem with large Doppler shifts (velocities). Therefore, people are looking at other multiplexing schemes like OTFS or AFDM.
