    The obvious drawback to this way of doing things is that the server now needs to do a lot more work, since it needs to render an entire page’s worth of HTML on each user interaction.

    If you let the templater tell you what can be re-used and what needs to be changed, you can avoid re-sending the same static parts (and dynamic parts that aren't changed) within an SSE-session.
    https://phoenix-live-view.hexdocs.pm/1.2.13/assigns-eex.html#change-tracking
    https://youtu.be/FADQAnq0RpA?t=12m6s (Keynote: The Road To LiveView 1.0 - Chapter: Optimizing with LiveEEx)
