  text: |-
    Diffing is quite expensive (you always pay the diffing cost in addition to template generation). In practice you can scale further and have a simpler system if you lean on brolti/zstd and some shared fragment caching. The compression is for the duration of the users connection so if only a small dive changes that can be as little as 13bytes on the wire. Shared caching gives you something diffing doesn't. Fragments between users, fragments on fresh connection (after reconnect), fragments between frames that are not straight after each other. In all those cases diffing doesn't help you.
    My demos (one linked in the comment above) scale to 1000 concurrent users at 10FPS (3gb of html a second uncompressed) and that's the adversarial case (i.e assuming every frame has a change in all the users views and none of the users views are fully shared). With quick frame skipping (i.e don't render if nothing has changed between this frame and the last frame), it scales much further (not the same as a diff as it's a fast equality check that shortcuts).
    On a 10$ VPS.
