    You don't diff. Liveview turns a templates that basically says "a" + $x + "b" + $y + "c" + $z + "d" into {0: $x, 1: $y, 2: $z, static: ["a", "b", "c", d"]}. An update to $y will result in {1: $y_prime} being sent. You can see an example in the linked talk (that I forgot to annotate...).
    I'd say it's better to factor out the redundant parts by construction, but there's no harm in using brolti after the fact.

    Fragments between users

    How are you sharing caching. Are you not talking about a client-side cache?

    My demos (one linked in the comment above) scale to 1000 concurrent users at 10FPS (3gb of html a second uncompressed).

    Yeah, but my point is you don't always have to do that.

    Comprehensions in templates are optimized so the static parts of a comprehension are only sent once, regardless of the number of items. Furthermore, LiveView tracks changes within the collection given to the comprehension. [1]

    [1] https://phoenix-live-view.hexdocs.pm/1.2.13/assigns-eex.html#comprehensions
