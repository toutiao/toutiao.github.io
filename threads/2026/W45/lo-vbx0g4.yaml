  text: |-
    In many web apps there’s going to be some state that pertains to the client (for example, is the sidebar collapsed or not, are menu groups inside the sidebar collapsed or not, etc.), and some state that’s coming from the server. In many web apps, we’d like to retain the client state (the sidebar again), even if we move between different resources in our app.

    I don't see a problem with tracking some truly client-side state on the client and using Datastar's selector targeting to replace only the page-specific content. A nav menu is not really a resource in the REST sense, it is specific to the browser window—the client—of the person opening or closing the menu. I have only dabbled with Datastar, but it seems like this should be possible?
    Side note: simple nav menu state can also be achieved with pure CSS. :)
