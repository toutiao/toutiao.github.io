    at the Martian surface might be closer to the level at the ISS due to atmospheric
    shielding – ignoring the effect of thermal neutrons induced by GCR.&quot;<p>So
    a &quot;typical&quot; 18-22 month mission on Mars will still add up to 60 to 92
    YEARS of radiation exposure on Earth --  assuming 100% perfect shielding to and
    from Mars, which seems exceedingly unlikely.<p>The longest stay aboard the ISS
    was 437 days. The round trip to Mars alone would be between 360 and 540 days.
