  author: teachrdan
  text: 'I&#x27;ve got to strongly disagree with Mars being &quot;level 2&quot; anything.
    Just the 6-9 month trip to Mars would expose humans to a lifetime of radiation;
    a &quot;standard&quot; mission to Mars -- voyage plus 1.5 years on-planet and
    back -- would expose astronauts to a total of hundreds of years radiation. When
    calculating total exposure per astronaut, you&#x27;d obviously have to include
    their (normal) exposure on Earth as well. Not great!<p>Having said that, there
    would also be the cumulative effects of low&#x2F;no gravity on astronauts. Even
    a year on the ISS has profound negative effects on the human body. And humans
    have cumulatively spent less than a month total on the moon. We have no idea how
    astronauts would fare on Mars for 18 months, but it would likely be very bad.
    And then they&#x27;d have to successfully get home.<p>You also have abundant toxic
    chemicals in the Mars regolith. Whatever technology we&#x27;d use to extract drinking
    water from it would have to filter out perchlorates, which are extremely toxic
    to both mammal and plant life. AFAIK we&#x27;ve never done this at all on Mars,
    and now we&#x27;re talking about having to do it successfully for 18 months (even
    with water recycling). Not easy!<p>To be fair, a lot of proponents of human Mars
    exploration -- particularly here on HN -- see astronauts as essentially disposable.
    &quot;Who cares if they risk dying of cancer &#x2F; poisoning &#x2F; suicide?
    It&#x27;s worth it!&quot; But if you prioritize astronauts surviving both the
    mission to Mars and the return home there are many, many, many unanswered questions,
    questions which may indeed have no good answers at all.<p>Before you accuse me
    of being a hater: I fully support exploration of Mars, and the rest of the solar
    system. And the best way to do so, by cost and every other conceivable metric,
    is with robots. Lets spend way more on space exploration, do it with probes of
    all varieties, and learn more in our lifetime than in all previous human lifetimes
    put together!'
