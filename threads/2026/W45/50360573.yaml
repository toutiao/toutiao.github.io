  author: somenameforme
  text: Your numbers are quite off. The ambient radiation level on Mars is <i>less</i>
    than what astronauts on the ISS experience. And that&#x27;s direct exposure. We&#x27;ve
    had numerous astronauts spend years in space in total. That&#x27;d be the equivalent
    of sunbathing on Mars, which is obviously not exactly the plan there. And so far
    whatever effect the increased radiation has had is small enough that it&#x27;s
    not statistically detectable.<p>Some misleading articles (or one heinous book)
    try to count in-transit space weather events as part of the average to bring the
    numbers to the point of absurdity, but that&#x27;s plainly lying. Space weather
    events (like solar flares) are immediately lethal if not shielded against. Fortunately
    they&#x27;re easy to shield against since they&#x27;re predictable and all settlement
    ships will happen to have one of the best possible radiation shields in large
    quantities on board - water. Similarly for perchlorates. These can be filtered
    out with basic water purification tech and trace amounts are even present in much
    of what we consume on Earth, especially in certain areas.<p>I&#x27;m not accusing
    you of being a hater, which is quite pointless. But I would say you&#x27;ve probably
    been misinformed. And I suspect precisely by one book written by a comic book
