  author: somenameforme
  text: I don&#x27;t really think so. To start with there&#x27;s a lot of really interesting
    concepts in terms of habitation for Mars. For instance the water&#x2F;air stuff
    is oddly enough solved simultaneously, alongside fuel. The Sabatier Reaction [1]
    and various other characteristics of Mars <i>really</i> make it all feel like
    a video game where Mars is just clearly level 2. The reaction itself is CO2 +
    hydrogen = methane + water.<p>Since Mars atmosphere is 95% CO2 you&#x27;re pretty
    much good to go there with a moderate supply of hydrogen. And conveniently enough
    electrolysis of water yields of course hydrogen and oxygen. And water is shockingly
    widely available on Mars given the regolith is 2-5% water by volume (giving the
    unit bastardization of 1 cubic foot of regolith = 1+ liter of water).<p>Most of
    the issues people are concerned about like radiation aren&#x27;t, in reality,
    that big a deal. I say &#x27;in reality&#x27; to mean that the radiation isn&#x27;t
    enough to just give you immediate radiation sickness, so the real effect will
    be a probably reduced life expectancy due to greater rates of cancer. Even that
    isn&#x27;t so clear for reason outside the scope of this post, but it&#x27;s not
    a show stopper in any case. In general early colonists will have a significantly
    reduced life expectancy - it&#x27;s just the nature of colonization, and always
    has been.<p>---<p>Beyond that the Moon is a nightmare. Relatively minimal resources,
    2 week long days&#x2F;nights that vary between way beyond boiling hot and something
    close to absolute zero. No atmosphere at all so no protection against meteorites,
    somewhat higher radiation than Mars, and so on. There&#x27;s also gravity very
    near zero which can pose some issues with various processes (industrial&#x2F;etc).<p>And
    other destinations like Europa not only have dramatically more difficult &#x27;local
    settings&#x27;, but also have significantly greater distances. For instance Europa
    is about 10x as far as Mars and a somewhat more difficult trajectory to manage.
    In practice you&#x27;re probably looking at upwards of 5 years for a one-way trip.
    We probably need to level up the tech tree a few bumps before realistically looking
    at things like that and Mars is a good way to do that.<p>[1] - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Sabatier_reaction"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Sabatier_reaction</a>
  score: 0
