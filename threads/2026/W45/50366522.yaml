    good compromise. There&#x27;s a couple of streets where the bus lanes are always
    full of busses, but most of the bus lanes are a nice place to ride; unless they&#x27;ve
    got rails, of course.<p>Seattle has put in a lot more separated bike lanes since
    I&#x27;ve been there, but on routes I wouldn&#x27;t have used anyway, so I dunno.
    There was one on my route that was <i>terrible</i>, but I don&#x27;t think they
    used that pattern very often; they put a separated bike lane between parking and
    the side walk, and parking ended close to an intersection where many cars wanted
    to turn right; limited visibility and limited space made it hard to get to the
    center or left of the lane to avoid conflicts with vehicles turning right.<p>IMHO,
    there&#x27;s a conflict between bike infrastructure appropriate for beginner &#x2F;
    slow bicyclists and infrastructure appropriate for experienced &#x2F; faster bicyclists.
    Separated lanes can be nice, but they make it harder to mix with motor vehicles
    when that&#x27;s appropriate and desirable. If separated bike infrastructure makes
    me take a longer path or wait for a signal change to turn left, but lack of infrastructure
    (and the traffic situation) would have let me mix with motor vehicles and take
    a permissive left without waiting for a signal change, that&#x27;s a negative
    for me --- but the extra wait isn&#x27;t an issue for someone who wouldn&#x27;t
    have mixed with traffic for that left turn anyway."
