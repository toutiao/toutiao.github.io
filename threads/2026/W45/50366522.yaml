  author: mitthrowaway2
  text: It&#x27;s not necessarily at the expense of cars; the people riding bicycles
    on the bike lane are no longer driving cars blocking the way ahead of you, and
    parking their car in your favourite spot. Since bicycles use space more efficiently
    than cars, this can actually be a win for both the cyclists and the remaining
    drivers (who now have one less lane, but even less traffic). However this only
    happens if cycling adoption is high enough, which is why the bike routes have
    to be well connected.<p>Sometimes it doesn&#x27;t even require sacrificing a lane,
    because many North American cities have lanes that are wildly larger than necessary
    or even appropriate given the posted speed limits. The lanes can simply be narrowed,
    and then this also causes the drivers to naturally drive at safer speeds, reducing
    traffic accidents, speeding tickets, and the unplanned delays that those both
    cause.
  score: 0
