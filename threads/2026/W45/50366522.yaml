  author: nonethewiser
  text: Have you heard of &quot;The Copenhagen left&quot;?<p>It&#x27;s a method for
    a cyclist turning left at an intersection. Turning left from the bike lane on
    the right is of course impossible, because the land is on the right, despite being
    a basic function of biking somewhere.<p>So the cyclist wants to turn left. They
    go through the intersection and move off to the side, near any pedestrians waiting
    to cross. When the light turns they and the pedestrians can cross.<p>Otherwise
    the biker must leave the bike lane and merge across traffic.<p>In either case
    the bike lane is inherently problematic.
