  author: yorwba
  text: No. In a large enough state space, you can of course easily find a state that
    has never existed before. For example, if you pick a 1024-bit integer uniformly
    at random, it will certainly be different from any previous 1024-bit integer.
    However, it&#x27;s much more difficult to find a new integer that cannot be assembled
    out of bits taken from previous integers. Composition from a handful of base atoms
    can cover very large state spaces, and unbounded composition can cover infinite
    state spaces. Which is why only being able to combine things that already exist
    is not much of a limitation.<p>To demonstrate:<p>&quot;Are you saying that a&quot;
    <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49642931">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49642931</a><p>&quot;complex
    stateful system&quot; <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=14881439">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=14881439</a><p>&quot;cannot
    generate a&quot; <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=45956162">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=45956162</a><p>&quot;state
    that is not already&quot; <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=43013637">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=43013637</a><p>&quot;recorded
    in text&quot; <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44731577">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44731577</a><p>&quot;somewhere?&quot;
    <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50391679">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50391679</a><p>A
