  author: andai
  text: 'Gell-Mann Amnesia Effect:<p>&gt; Briefly stated, the Gell-Mann Amnesia effect
    works as follows. You open the newspaper to an article on some subject you know
    well. In Murray&#x27;s case, physics. In mine, show business. You read the article
    and see the journalist has absolutely no understanding of either the facts or
    the issues. Often, the article is so wrong it actually presents the story backward-reversing
    cause and effect. I call these the &quot;wet streets cause rain&quot; stories.
    Paper&#x27;s full of them. In any case, you read with exasperation or amusement
    the multiple errors in a story-and then turn the page to national or international
    affairs, and read with renewed interest as if the rest of the newspaper was somehow
    more accurate about far-off Palestine than it was about the story you just read.
    You turn the page, and forget what you know. —Michael Crichton<p>Edit: sibling
    comment explains it much more plainly.<p><a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50390237">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50390237</a>'
