    4DirectedEvolution
    I’ve been rewriting python functions to strip out variable names, comments, etc. and testing model abilities to determine what mathematical method the function implements. While increasing model size through Claude Opus 5.5 does improve success, there are many problems on which they consistently fail to recognize solutions unless supplied with a sufficient hint, even if provided with the results of automated test inputs. I want to flag that I don’t currently have a reproducible benchmark. There are just informal results I’ve obtained in the process of working on a codebase inspection tool. These and related results suggest to me that even advanced models continue to rely on name-matching to deliver low cost, reliable answers for many problems. Clearly, that’s nevertheless compatible with producing Fields-medal-quality mathematical proofs.

