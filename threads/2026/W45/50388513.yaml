    8Julian Bradshaw
    I agree with you. AIs are good when pointed in the right direction (the key sources to refer to, the best metric to hill-climb, the parts of the story a human would find most surprising), but a human often still has to point them in the right direction first. While it's nice that we Humans are still useful, it's sort of weird that this shepherding is still necessary. But IMO it bears out empirically, not just on vibes/anecdotes. The best evidence I'm aware of specifically for AI R&D automation is P-Zero's TasteVal, Epoch's InnovationEval, and Epoch's "Can AI automate Epoch?" These map to your confusion about AI R&D automation nicely: the first implies AI is great at it, the second terrible, the third not great. To be more specific, TasteVal shows a breakpoint in the trendlines on AI research taste around December 2025.[1] Models just prior to the breakpoint were at ~0.1x Human expert, and now Opus 5.5 is at 2.30x (95% CI 1.15-4.37x) Human expert in terms of compute efficiency, though only 1.14x [95% CI 1.01-1.31] in terms of normalized task score. Meanwhile, InnovationEval found that Fable 5 couldn't even reach 5% of Human real-world innovation gains in an AI R&D task,[2] despite claiming 40%+ performance.[3] And in "Can AI automate Epoch?", Fable 5.1 and GPT-6 Astra could only reach ~65% of Human Epoch employee performance. Personally I think the difference between P-Zero's and Epoch's research partly results from the fact that the former specified particular research problems tractable to known methods, while the latter involved work that either required novel ideas (InnovationEval) or was open-ended (automate Epoch). TasteVal disclaimed that "we do not measure significant aspects of taste, such as picking problems worth solving" and "the strongest submissions to our tasks did not use novel ideas or perform non-obvious cross-domain adaptation". Epoch AI notes in its InnovationEval that "AI did not discover anything comparable to the original innovation" and i

