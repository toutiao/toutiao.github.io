  author: datsci_est_2015
  text: This is a common rebuttal. But it falls flat, in my opinion, because LLMs
    appear to be a compression of language-based knowledge, and that compression is
    lossy. The result is that &quot;knowledge&quot; retrieved from the language-based
    storage model is biased towards the &quot;average&quot; idea.<p>As a concrete
    example, when you ask Claude Sonnet 5.5 to generate a small-to-medium-sized one-shot
    Python project, it will always fall into the same code patterns. Same structures
    of functions. Same file layout. Same package layout. They&#x27;re not even <i>good</i>
    patterns, because if you throw a few common linters at it (e.g. flake8, isort,
    mypy) there are a ton of linting errors to clean up.<p>The only way that it escapes
    this mediocrity is through context. If you give it enough guardrails or sample
    data (e.g. Python code to emulate), it will start to go off in a &quot;novel&quot;
    direction that is defined by that context.<p>Now, what&#x27;s the most likely
    way that &quot;novelty&quot; will be generated in an automated system like this?
    Randomly pulling in context and going for a random walk through the compressed
    language-based knowledge storage. It remains to be seen whether that&#x27;s an
    effective way of producing more than just parlor tricks for investors. Human+LLM
    is overwhelmingly more novel and effective than only LLM.
  score: 0
