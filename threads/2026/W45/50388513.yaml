  text: I&#x27;ve also found it very hard to leave AI agents up to their own devices
    for long periods and get much productive benefit from it.<p>I suppose it&#x27;s
    possible that frontier labs have internal models that are so far beyond that autonomous
    research becomes possible, but I&#x27;m not sure that&#x27;s it.<p>It seems to
    me like these models are like a very competent, important part of some hypothetical
    digital brain, but alone they don&#x27;t have all the facilities they need to
    be useful, like a genius with severe ADHD and short-term memory loss.<p>For anything
    where quality isn&#x27;t objective in a clear-cut way, very intentional context
    management is needed to get good outputs. As context size expands, performance
    degrades. As the number of tasks increases, performance degrees. As the number
    of independent decisions based on subjective criteria increases, performance degrees.<p>If
    you can get a harness that makes sure every decision is made one at a time, focused
    with only the context it needs, things work great. But making those harnesses
    is still hard, a lot of work, and something that agents seem to have no clue how
    to help you with.
