  text: "&gt; The main way they can surprise you today is pulling in information that’s
    new TO YOU<p>Many comments here are speaking in absolutes and being myopic about
    what&#x27;s &quot;novel&quot;. The truth is yes, LLMs output is essentially derivative,
    but it&#x27;s also true that  a lot of what we consider novel is also derivative.
    The two aren&#x27;t mutually exclusive at all.<p>Had a novel idea? You didn&#x27;t
    get it from thin air, everyone is standing on the shoulders of everyone who came
    before.  LLMs most of all, but that doesn&#x27;t mean it can&#x27;t bring disparate
    bits of word-encoded knowledge together and burp out something we&#x27;d consider
    &quot;novel&quot; if a person had made the same connections.<p>That was actually
    the basis of some of the mathematics proofs. It made connections from existing
    material. Nothing a human couldn&#x27;t do looking at the same material, but we&#x27;re
    talking speed and scale here - same as all computational processes.<p>A calculator
    does math faster but we don&#x27;t call it sentient or feel inferior or dismiss
    the results. The only difference is LLMs are intentionally nondeterministic, as
    that behaviour can be usefully harnessed, pun intended.<p>So there&#x27;s no need
    to argue about what&#x27;s novel or not. LLMs can make novel connections via raw
    speed and breadth of disparate data. The human brain is more complex and &quot;imaginative&quot;
    for whatever your definition of that is - I mean fundamentally one either believes
    we are just physical neurons, or that there&#x27;s a spiritual aspect on top,
    the end result is the same.<p>A six sided dice can also be novel if it happens
    to unexpectedly roll your phone number. It&#x27;s a novel occurrence, same as
    an idea coming to mind that, TO YOU, seems novel... but we can&#x27;t ask the
    other 8 billion people on the planet so who are we to judge what&#x27;s a novel
    idea anyway?"
