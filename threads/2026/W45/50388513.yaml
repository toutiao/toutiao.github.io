  author: BenoitP
  text: 'Strong agree, but with a major caveat: First since we humans don&#x27;t have
    a memory the size of the internet, new TO YOU is extremely easy to find. And second:
    a lot of discoveries can be made by trying to match two different domains and
    generate new insights at the seams.<p>A lot of math theorems are discovered that
    way by humans btw: find a difficult problem in a domain, map it to another domain,
    apply existing theorems there, go back to the original domain. The only difference
    is an LLM would have to search for an interesting problem, but that can be done
    by brute-forcing search at the seams and validating the problem does not previously
    exists. And there is no new TO YOU for the LLM: it can get help from a vast amount
    of helper domains.<p>IMHO there&#x27;s a shot at having category theory really
    unifying a large chunk of maths in the next decade. It&#x27;ll be a big ugly ball
    of Lean, but a queryable one at that.'
