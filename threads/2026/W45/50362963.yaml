    pH | Soil/Water |\n| Temperature | Root-zone temperature | °C | Soil/Water |\n|
    Oxygen (O₂) | [Dissolved Oxygen (DO)](https://en.wikipedia.org/wiki/Oxygen_saturation)
    | ppm | Soil/Water |\n\n\\* key measurements for small-scale systems\n\nWhy are
    these relevant? Plants perform two critical processes which are complementary:\n\n-
    Plants convert light energy into storable chemical energy (carbohydrates) during
    **photosynthesis**. In other words: ☀️ Light energy + \U0001F4A8 Carbon dioxide
    + \U0001F4A7 Water → \U0001F50B Stored energy + \U0001F4A8 Oxygen\n- Plants use
    the stored energy (carbohydrates) to fuel growth, in a process called **respiration**.
    In other words: \U0001F50B Stored energy + \U0001F4A8 Oxygen → \U0001F4A8 Carbon
    dioxide + \U0001F4A7 Water\n\n_[Light](#%E2%98%80%EF%B8%8F-Light)_ is the single
    most important environmental parameter as it literally provides energy for plant
    growth.\n\n_[Temperature](#%F0%9F%8C%A1-Temperature)_ dictates a plant’s metabolic
    rate and therefore also strongly influences growth rate.\n\nAdditionally, there
    is another critical process:\n\n- The evaporation of water through a plant’s leaves
    pulls water (containing dissolved nutrients) up from the roots. This is a passive
    process called **transpiration**.\n\n_[Soil pH](#pH)_ is sometimes called a “master
    variable” as it affects the solubility of soil nutrients (among other things,
    including microbial activity) and therefore nutrient availability, hence plant
    growth.\n\nAir _humidity_, _wind_, and _[temperature](#%F0%9F%8C%A1-Temperature)_
    all affect the rate of transpiration and also therefore nutrient uptake and plant
    growth. For this reason, poor ventilation actually can result in nutrient deficiencies.\n\nOn
    the other hand, excessive ventilation decreases relative humidity which, in combination
    with heating the cooler incoming air (air holds more water at warmer temperatures),
    can increase transpiration, which decreases plant temperature and increases ambient
    humidity, resulting in a vicious cycle. Alternatively, if transpiration occurs
    to the extent that there is not enough water in the plant (e.g. during peak hours
    of the day), then stomata (microscopic openings on the undersides of leaves) will
    close, which increases leaf temperatures and decreases CO₂ exchange… [1]\n\nHumidity
    can be reduced in three ways: 1) heating (air holds more water at warmer temperatures),
    2) ventilation (“out”), and 3) condensation (“in”).\n\nEnvironments:\n\n- In an
    indoor system, the environmental parameters are mostly controlled. Limiting factors
    are likely 1) light, 2) space (area), 3) water, 4) nutrition, 5) oxygen (for soil-less
    systems and compact soils).\n- In an outdoor system, think about sun, wind, temperature,
    water access, soil conditions. Look for planting calendars and first/last frost
