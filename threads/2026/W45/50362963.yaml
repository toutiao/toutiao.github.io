    links about well-known growing systems, techniques, and other resources. Finally,
    the last part examines the economics of market gardening.\n\n## \U0001F34E Concepts\n\n###
    ☯️ Environmental parameters\n\nWhen growing plants, your task is to balance a
    number of highly interdependent factors, as listed below. An insufficient amount
    of, say, light or nutrition creates a limiting factor in plant growth and development.
    On the other hand, excessive light or fertilizer (i.e. beyond what a specific
