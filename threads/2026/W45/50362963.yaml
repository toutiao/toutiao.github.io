  author: Joakal
  text: 'Watering is easy but one can overcomplicate it. Each plant has different
    water needs. Screw it up, you get likely get root rot or dry soil.<p>An engineer
    might analyse the soil and the plant water needs. Inject water to right levels,
    or set a timer. These settings need to be readjusted constantly without a hydrometer.<p>I
    found an ancient solution that worked incredibly efficient and required no electricity
    and far cheaper than spending hundreds on electronics. Ollas. The science is called
    capillary action.<p>I went a step further as an engineer, and did DIY terracotta
    pots + silicone. Added a testing stage, of course. Filled pots and sealed it over
    night. If leaking from seal, more silicone. For filling them up, I used irrigation
    fittings hooked up to a tank. If I wanted to, I could use rain water into tank
    (with overflow). That way watering is a fully automated pipeline.<p>I don&#x27;t
    have a picture on hand but others have done it like this: <a href="https:&#x2F;&#x2F;www.abc.net.au&#x2F;gardening&#x2F;how-to&#x2F;olla-watering-pots&#x2F;11988902"
    rel="nofollow">https:&#x2F;&#x2F;www.abc.net.au&#x2F;gardening&#x2F;how-to&#x2F;olla-watering-pots&#x2F;1...</a><p>Other
    fun topics I looked into:<p>- Companion plants (avoid spending on pesticides)<p>-
    Crop rotation (avoid spending on fertilisers)<p>- Composting (for compost)<p>Those
    are not easy to automate but other topics to make it far cheaper to grow crops
    without trips to nurseries.'
