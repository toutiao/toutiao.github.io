article:
  url: https://jrcpl.us/contrib/2020/gardening-for-engineers/
  title: Vegetable Gardening for Engineers | John Chang (jrc+)
  fetch_status: success
  content: "# Vegetable Gardening for Engineers\n\nThis is a starting point for understanding
    how to grow vegetables at home. I created this document out of dissatisfaction
    with popular gardening books (too little detail) and social media (too much talking
    and clickbait). I found myself organizing and synthesizing concepts, data, and
    advice from disparate sources. I even turned to material from agricultural university
    extension programs, crop guides from commercial seed and fertilizer companies,
    high school biology courses, live farmer training courses and gardening workshops,
    and techniques from indoor cannabis growers.\n\nThis document reflects my personal
    learning journey over the past years. You are welcome to submit pull requests
    or email me with feedback.\n\nCurrently the focus is on indoor and balcony growing
    in an urban apartment setting. Therefore, only hydroponics and container gardening
    are covered. Garden beds, composting, aquaculture, fungiculture, permaculture
    are not covered (yet).\n\n## Table of Contents\n\nThis document is organized broadly
