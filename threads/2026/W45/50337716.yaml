  author: mrandish
  text: "&gt; a benchmark for our expectations to see how much they&#x27;ve grown
    for new model releases?<p>Posters have been saying they&#x27;d be happy with open-weight
    Fable 5 since before F5 was public and I saw one poster on HN say it last week.
    And with those posts there&#x27;s usually a few mentioning the truism &#x27;goalposts
    tend to move&#x27; and we haven&#x27;t met our future selves or seen the future
    context we&#x27;ll be in.<p>Studies show humans are poor predictors of our own
    future wants, needs, preferences and behaviors and few are fully aware how far
    and often we gradually move goalposts. Some of those posters weren&#x27;t really
    making a precise, quantified statement. Many were expressing something more directional
    like &quot;Wouldn&#x27;t it great if <i>{best, most costly thing I want but can&#x27;t
    get or afford}</i> were <i>{readily available free or cheap }</i> ?&quot; Those
    variables update every time the sentence is output.<p>And in recent months models
    are saturating more of the benchmarks HN posters relate to and more of the real-world
    workloads we have. Six month ago, model flaws were more obvious and common. They
    still happen today, but for more of us, they&#x27;re rarer, more complex and workload
    dependent. It&#x27;s getting harder or takes longer for us to see clear, consistent
    differences between similar models and model versions. You can even see it in
    Simon&#x27;s fanciful bike-riding pelican &#x27;not-a-benchmark&#x27;.<p>I&#x27;m
    not saying that models are now great at everything (or even close), just that
    for a lot of us they&#x27;re good enough at <i>our</i> current things that it&#x27;s
    getting harder to personally gauge by how much. So we have to rely on complex
    composite benchmarks (which increasingly don&#x27;t reflect any one thing at high
    granularity) or proxy reports about &#x27;other people&#x27;s things&#x27; like
    frontier theoretical mathematics."
