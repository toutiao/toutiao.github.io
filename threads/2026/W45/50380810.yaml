  author: grapheneos
  text: Motorola was split into Motorola Solutions and Motorola Mobility in 2011.
    Everyone who owned the Motorola stock ended up owning both initially. Motorola
    Solutions kept the original stock ticker and Motorola Mobility kept ownership
    of the Motorola trademarks. Motorola Solutions uses the Motorola trademark under
    a perpetual license only permitting them to use it for the areas they already
    sold products. Motorola Solutions had more need for the original legal entity
    due to government contracts and Motorola Mobility had more need for the trademark
    due to selling retail products.<p>Motorola Mobility was purchased by Google in
    2011 and sold to Lenovo in 2014. Motorola Mobility is still based in the US but
    is well integrated as Lenovo&#x27;s mobile division. The devices are made by Lenovo
    with their in-house assembly&#x2F;manufacturing and external supply chain rather
    than the typical setup of a western company paying another company to build devices
    for them.<p>Motorola Mobility sells smartphones and tablets mainly via retail.
    Motorola Solutions sells cameras, radios and drones mainly via government contracts.
    They&#x27;re entirely separate companies with no business partnership. Motorola
    Mobility can use the Motorola brand for anything but Motorola Solutions would
    need to pay for a license to use it for new product lines.
