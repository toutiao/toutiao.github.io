    # Motorola sets a new flagship standard with motorola signature 27, featuring its most advanced camera system, next-generation agentic AI and the brightest display available in a smartphone

    November 5, 2026

    Motorola, a Lenovo Company, is designing to a higher standard with the new motorola signature 27, the company’s most advanced flagship smartphone to date, bringing together distinctive design, category-leading innovation and next-generation AI experiences. From its contoured edges, expressive finishes and refined craftsmanship to the breakthrough technologies within, every detail of the motorola signature 27 was purposefully built to deliver a premium experience without compromise. Featuring Motorola’s most advanced camera system yet,&nbsp; recognized with a DXOMARK Gold Label for image quality performance, the brightest Extreme AMOLED Duo Tandem display¹ available in a smartphone, the Snapdragon® 8 Elite Extreme Gen 6 Mobile Platform, making it among the first smartphones to unlock next-generation connectivity and AI experiences, and the only smartphone in-market with Audio by Bang & Olufsen, the motorola signature 27 represents the pinnacle of Motorola innovation.

    ### Motorola’s best camera system yet, recognized for imaging excellence

    The motorola signature 27 includes [the world’s best camera sytsem launched in 2026](https://motorolanews.com/motorola-signature-27-dxomark/), combining advanced hardware, cinematic video, and effortless photography. Awarded the coveted DXOMARK Gold Label in recognition of its industry-leading level of imaging quality performance and outranking all other Android and iOS devices, the motorola signature 27’s camera system delivers eye-catching photos and videos, with:

