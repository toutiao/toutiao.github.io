    ![Motorola sets a new flagship standard with motorola signature 27, featuring its most advanced camera system, next-generation agentic AI and the brightest display available in a smartphone](https://media.motorolanews.fiestic.com/2026/11/04151018/29260918_MOTOROLA_SIGNATURE_1047-scaled.png)

