  author: grapheneos
  text: It&#x27;s worth noting Motorola Mobility owns the Motorola trademark and can
    use it for any purpose. Motorola Solutions has a perpetual but very limited license
    for the trademark from a subsidiary for holding the trademark owned by Motorola
    Mobility. Motorola Solutions can continue making Motorola branded products in
    the same spaces as they did before but can&#x27;t enter new spaces with the brand.
    Most people wrongly assume it&#x27;s the other way around since Motorola Solutions
    is the original legal entity. They kept the legal entity the same for the company
    focused on government contracts and kept the trademark for the faster moving retail
    focused company where the brand is more important.
