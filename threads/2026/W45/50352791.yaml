  author: holgerschurig
  text: 'Well, I&#x27;m from Germany and it doesn&#x27;t sound wrong to me. And in
    Germany we don&#x27;t even have anglo-saxon law, but napoleonic laws (sample cases
    matter less, written law text matters more, for one big difference). We also don&#x27;t
    have &quot;copyright&quot; at all. We have a &quot;Urheberrecht&quot;, which is
    very similar, but also very different in details.<p>One of the things is: if a
    person creates something with a certain creativity level (I&#x27;m sure &quot;hello
    world&quot; programs don&#x27;t count) then the work has automatically &quot;Urheberrecht&quot;.
    There never was the need to register it, not even in history (like in the US,
    the origin of the &quot;(C) xxxx by yyyy&quot; markers). You also don&#x27;t need
    to write any sentence at all into your works. What exactly is &quot;certain creativity
    level&quot; isn&#x27;t in the law, that&#x27;s on a judge in case of dispute.
    Also data bases and things generated by machines aren&#x27;t covered.<p>And you
    automatically have &quot;Urheberrecht&quot; of it. And so automatically others
    aren&#x27;t allowed to copy your work! <a href="https:&#x2F;&#x2F;www.gesetze-im-internet.de&#x2F;urhg&#x2F;__2.html"
    rel="nofollow">https:&#x2F;&#x2F;www.gesetze-im-internet.de&#x2F;urhg&#x2F;__2.html</a><p>(There
    are more ways you can get protection, e.g. if something is a computer program,
    or if something is art.)<p>And while this this can be seen draconian, then non-draconianess
    comes from exceptions. Generally private people are allowed to make one copy for
    their personal usage.<p>IANAL and the usual jadda jadda --- this is another difference
    between anglo-saxon and napoleonic right: in napoleonic right one doesn&#x27;t
    have to state the obvious for fear of damages rulings ...    oh, and technically
    we don&#x27;t have napoleonic right in Germany either, as usual it&#x27;s more
    complicated ... <a href="https:&#x2F;&#x2F;de.wikipedia.org&#x2F;wiki&#x2F;Rechtskreis"
    rel="nofollow">https:&#x2F;&#x2F;de.wikipedia.org&#x2F;wiki&#x2F;Rechtskreis</a><p>And
    yet, UK and DE were together with many other countries in the EU. And so a lot
    of laws in the agricultural and trade realms are similar. Copying (and selling)
    stuff is IMHO trade related. So it doesn&#x27;t wonder me at all that in practice
    the have a similar outcome despite being in totally different law systems.'
