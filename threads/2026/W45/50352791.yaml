  author: Brian_K_White
  text: 'I myself have a site that has no particular UK content, not a .uk domain,
    not owned or operated by any person or business or other organization in the UK,
    but the physical hosting server is in the UK. It&#x27;s public info and I actually
    want it copied as much as possible, but that&#x27;s just lucky.<p>They didn&#x27;t
    say but they must mean the items in the identifiers list must be ANDed.<p>Take
    the inverse of your case: Anyone can put up a site with content about the UK that
    isn&#x27;t hosted in the UK nor owned by anyone living or operating in the UK.
    That meets one of the stated criteria. Does that give them the right to archive
    it?<p>That immediatly just exposes that there are bigger questions we have yet
    to figure out before we can answer that one. The entire premis of copyright broke
    a long time ago once the definitions of &quot;copy&quot;, &quot;redistribute&quot;,
    and &quot;view&quot; became vague, which happened once &quot;view&quot; started
    taking place via the technological means of sending a copy to you.<p>You could
    always resell a paper book. You could always lend a book that you already read,
    meaning multiple people get to read the same book.<p>Could you sell access to
    your private library?<p>Could you rent out a book? That&#x27;s what Blockbuster
    did, but IDK if they maybe had some extra voluntary private agreements with publishers
    to keep them from trying to shut them down or inhibit their ability to aquire
    inventory, seperately from what might have been strictly legal obligation.<p>So
    with all of that actually still up in the air, it&#x27;s hard to say if they have
    the right to archive anything on the internet that simply references the UK, or
    even stuff that is primarily about the UK. Many people publicly display things
    that they claim to retain copyright to, so they would argue that merely existing
    in public view on the internet does not grant anyone else the right to do anything
    but view it, and only grudgingly allow that most laws in most places also allow
    people to retain their own personal copy.<p>But if I view a public site and cache
    a copy on my laptop and don&#x27;t re-publish that anywhere, I may still let 10
    people come into my house and look at my screen. Though I think charging money
    for that is covered, like with bars with a cover charge and pay-per-view sports.<p>If
    I can cache any site I can see, and even let anyone else look at my cached copy,
    then how do you disallow the British Library from doing it?<p>So maybe in fact
    they didn&#x27;t mean for the points to all be ANDed, and maybe in fact they do
    intend to copy anything from anywhere published by anyone if it merely references
    the UK in any way?<p>But if they are ANDed, then merely meeting any one condition,
    or even meeting all but missing only one, means they don&#x27;t consider the site
    to qualify.<p>All in all it sounds like an underspecced undefined mess.'
