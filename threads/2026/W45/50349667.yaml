    of a key.<p>It&#x27;s almost as if Lisp has been quietly waiting for this moment.
    LLMs and Lisp REPLs make such a great duo - if you&#x27;re a programmer and haven&#x27;t
    seen it in practice yet, you should seriously be experiencing deep FOMO right
    now.
