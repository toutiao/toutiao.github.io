  author: AnimalMuppet
  text: 'In at least some cases, this is pretty clear cut.  Don&#x27;t roll your own
    crypto libraries.  You may think you know what you&#x27;re doing.  You don&#x27;t
    - not enough to produce genuinely secure crypto.<p>Don&#x27;t roll your own numeric
    libraries.  There are libraries with <i>decades</i> of improvements to handle
    corner cases and increase stability.  You won&#x27;t create a better one, not
    in one lifetime.<p>So, yes, in some cases code reuse through libraries really
    does improve software quality.<p>It fundamentally comes down to this question:  Can
    I, the user of this library, produce a library that is more robust <i>for my purpose</i>
    than the existing libraries?  Those who say &quot;yes&quot; often underestimate
    the amount of care needed to create code that actually <i>works</i> - that works
    solidly, that is robust against failures on certain inputs.<p>But, you say, you
    don&#x27;t actually <i>have</i> any of those inputs, so why do you care?  You
    don&#x27;t - now.  But the day may come when your program is going to have to
    handle those inputs, and when it does, then it&#x27;s <i>your</i> problem, because
