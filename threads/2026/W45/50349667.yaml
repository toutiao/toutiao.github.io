  text: These last few months, I have been building a capability-based language and
    runtime for fun based on the &quot;port EVERYTHING&quot; idea.<p>The language
    is restricted to permissions granted on startup and can only access the system
    via the runtime, which only supports a particular subset of linux syscalls. So,
    outside of the stdlib, whichever feature you need, you simply use an LLM to port
    an existing python&#x2F;rust&#x2F;JS&#x2F;TS&#x2F;Java library to the language
    and use it.<p>As the runtime has its own scheduler and GC, I have actually been
    wondering about the feasibility of skipping the linux kernel and making the runtime
    itself the &quot;os.&quot; Given that so much modern hosting is actually done
    on virtual hardware, the drivers could be hosted within the runtime as well.
