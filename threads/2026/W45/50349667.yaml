  author: d-us-vb
  text: 'This is rather interesting. But it misses the point somewhat.<p>The problem
    is whether or not we want to view code as a medium of communication between other
    humans vs code as an abstract machine that solves a problem. We know that &quot;programs&quot;
    in the general sense are fairly objective entities that can be studied objectively,
    which is where the famous Sussman line about this comes from.<p>But as a language
    for expressing execution semantics that a machine can then execute to produce
    a desirable effect on the real world (a solution to a problem), we would not expect
    such code to be written with other humans in mind, and as lisp is a strictly more
    expressive language (both for expressing the meaning of an algorithm that other
    humans will be able to study and understand and that a machine can execute), and
    that more people who program are concerned with producing a solution to a problem,
    the &quot;curse of lisp&quot; is the logical conclusion.<p>But it&#x27;s overblown.
    There exist many excellent and fairly complete libraries for Lisp: Closer MOP,
    UIOP, ASDF, Bordeaux Threads, etc. And no surprise, these libraries are virtually
    ubiquitous and considered (at least by me) to be more or less extensions to the
    language. And these libraries are written in a fairly readable style that anyone
    can go and try to understand the code.<p>Secondly, the curse isn&#x27;t really
    much of a curse at all. It is more likely to yield more robust programs. The assumption
    that code reuse through libraries increases software quality doesn&#x27;t really
    hold up in practice: libraries that are &quot;complete&quot; tend to add bloat
    to applications; managing different versions of libraries on the same platform
    leads to arguments about static vs. dynamic linking, and so on and so forth. Ever
    had to debug .so versioning bugs on Linux? It&#x27;s not fun. And yet, that is
    par for the course if you try to persist in the notion that &quot;libraries and
    code reuse is always better than reinventing the wheel&quot;.<p>As a reaction
    to the utter failures that have occurred due to following that ideology, entire
    programming communities have popped up to fight it, particularly the &quot;Handmade
    Hero&quot; that became Better Software Conferences as well as &quot;Software Should
    Work&quot;. And while those people aren&#x27;t a huge fan of Lisp, they really
    do embody the Lisp mindset of &quot;don&#x27;t be afraid of building your own
    system in your own solution&#x27;s language&quot;. And this does usually yield
    nicer systems to work with because programming is theory building: bringing in
    different ready-made libraries introduces conflicting theories that requires even
    more glue code to rectify and the glue code rarely foresees all the discrepancies.
    And so bugs appear in the integrations between them.<p>That&#x27;s not to say
    that increasing &quot;the curse of lisp&quot; always yields higher quality. The
    kinds of developers that make great software with that mindset are the ones that
    are allergic to inconsistency at any level and so squash bugs as quickly as possible
    and that is what leads their software to be better. But on the practical side
    of programming work, you feel a lot less inhibited in trying to fix bugs when
    you&#x27;re certain you understand the code and how the implementor decided to
    map the problem domain onto the range of possible solutions. This is where the
    issue with LLMs comes in: if programming is theory building (which I firmly believe),
    then what we&#x27;re really after with using LLMs to generate code is a more effective
    technique of translating high level theory of the problem into the low level code
    that executes to solve the problem. As such, maybe vibe coding can work if the
    vibe coder diligently keeps in their mind what they&#x27;re after. But usually
    what that means is writing notes about the desirable properties of the resultant
    application. And then they&#x27;re just back to theory building... just at a somewhat
    higher level.'
