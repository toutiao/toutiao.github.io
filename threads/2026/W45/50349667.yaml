    opened eca-emacs buffer, I didn&#x27;t even have to type the prompt - I used speech-recognition.
    Agent then (running in Elisp REPL),  connected to my WMs REPL driven by Fennel,
    using tools in my Clojure-made harness with its own REPL, tapped into the lua-based
