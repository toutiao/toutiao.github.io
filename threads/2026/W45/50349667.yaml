  text: "<i>&quot;I’d rather rely on proven libraries with well-defined abstractions
    than generate hundreds of lines of code which solve a local problem for me. “Not
    generated here” is just a different version of “Not invented here”.</i><p>I disagree
    generally, and the problem is two fold..<p>I&#x27;ve just seen &quot;well-defined&quot;
    abstractions go wrong too many times. Over- encapsulation, over-abstraction, or
    just overall over-cleverness in third party packages that has led me to spend
    large parts of my career just frustrated trying to glue third party dependencies
    together in a sensible way... and the abstractions only adding complication.<p>The
    joy and temptation of having an LLM &quot;just make it&quot; is that this goes
    away. The functionality fits my existing structure and abstractions and I&#x27;m
    not fighting a war with the architecture that the third party maintainer decided
    worked best for them. And getting only the parts I need, not your whole giant
    framework with it. (And yes, I know the LLM could easily hallucinate something
    far far worse, but let&#x27;s just... play pretend here for a minute)<p>The second
    part is that since the dawn of Maven, NPM, Crates.io generally there has just
    been this insane explosion in programs of transitive third party dependencies
    out into the stratosphere, and the cognitive, technical, and legal debt of so
    many deps generally is not sufficiently recognized by the community. Running &quot;cargo
    tree&quot; in my project is often frankly depressing. Multiple linked MD5&#x2F;SHA256
    implementations, random number generators, HTTP protocols, people dragging in
    tokio deps where I don&#x27;t want them, multiple versions of the same thing compiled
    and linked... It&#x27;s exceedingly frustrating, and with the explosion of security
    concerns we&#x27;ve seen recently, it&#x27;s also potentially dangerous.<p>I don&#x27;t
    <i>love</i> the idea of having LLMs &quot;just yeet it&quot; esp if people misapply
    this to things like security&#x2F;cryptography domains. But I&#x27;m also <i>more</i>
