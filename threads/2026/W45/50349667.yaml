  text: LLMs don&#x27;t let their users do whatever they want, users are limited to
    whatever the model and its training allow, because it makes the decisions based
    on randomness, not them. Even open weight models have the same limitation. You
    don&#x27;t have exact control over what the LLM does, much less (using any of
    the popular services) its training data therefore you can&#x27;t even claim that
    you created, much less own, that code.<p>And because LLMs can&#x27;t be audited
    and can&#x27;t track or respect the licenses of the software they use as sources,
    no software generated by an LLM respects the freedoms of Free Software.<p>&gt;That
    a user can instruct their agent (...) even if they barely have any programming
    knowledge themselves is a sign of software freedom.<p>It isn&#x27;t, because as
    I said, freedom presupposes knowledge. If you barely have programming knowledge
    and you don&#x27;t understand the code an LLM generates then you can&#x27;t 1)
    read it, 2) edit it or 3) redistribute it without an LLM. You are not exercising
    any freedoms in that case, you&#x27;re just being a consumer of a service.<p>&gt;so
    perhaps we need a Free Models movement too or something along these lines<p>I
    said what I think would be the minimum requirements for a model to respect free
    software - at the very least it should only be trained on free software, it should
    be provably auditable without hallucination (I don&#x27;t even think this is technically
    feasible) and it should respect the licenses of the software it incorporates,
    including attribution where necessary.<p>Beyond that there&#x27;s still the problem
    that training even open weight models requires expensive infrastructure making
    it implicitly proprietary. As long as we need data centers at all it&#x27;s never
    going to be as free as a text editor.
