  text: |-
    &gt; And they virtually never use things like the Python REPL, even though they use Python all the time.<p>REPLs in non-homoiconic languages like Python, and homoiconic Lisp do differ. Every single step in Read-Eval-Print-Loop does. That&#x27;s why Lispers sometimes refer to Lisp REPL as a &quot;true REPL&quot;, because in practical comparison, Python&#x27;s REPL is more like an &quot;interactive shell&quot;. Homoiconic means that code-is-data, and the Read step in REPL doesn&#x27;t need to do any acrobatics with parsing, building AST, etc, it&#x27;s just directly reading the code and passing to Eval as is.<p>Here&#x27;s a sense of what it looks like to be writing software with Lisp: <a href="https:&#x2F;&#x2F;youtu.be&#x2F;tHgApFhevrQ?t=2272" rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;tHgApFhevrQ?t=2272</a>
    I purposely moved the marker so you don&#x27;t have to watch the whole talk. Jeaye here coded his entire presentation from inside a terminal, embedded into a game.<p>That&#x27;s how typically Lispers write software - &quot;from inside out&quot;. Lisp, uniquely fits for LLMs, because when you give them a Lisp REPL, they stop guessing and start empirically analyzing current state of things and produce working solution faster, costing fewer tokens.<p>The typical flow with non-homoiconic PLs is is roughly the Unix&#x2F;pipe model - batch-style. Agent spawns process -&gt; reads stdout&#x2F;stderr -&gt; spawns next process. State lives in-between the calls and in files. Each tool invocation technically stateless. It is a whole different story with Lisp.<p>&gt; It seems sort of wasteful of tokens!<p>Clojure is proven to be one of the most token efficient languages. <a href="https:&#x2F;&#x2F;tokencalculator.ai&#x2F;most-token-efficient-languages-for-llms-ranked-priced" rel="nofollow">https:&#x2F;&#x2F;tokencalculator.ai&#x2F;most-token-efficient-languages-fo...</a>
