  text: |-
    You seem to have misunderstood this remark:<p>&gt; It seems sort of wasteful of tokens!<p>This was referring to the LLMs&#x27; tendency to blat out hundreds of tokens into a single tool call, not to Clojure.<p>The REPL in the part of the presentation you link to only evaluates two forms, (range 10) and (bounce!), neither of which takes much advantage of homoiconicity.<p>cchase88 was talking about a degree of homoiconicity in Tcl that has been abandoned by most dialects of Lisp:<p><pre><code>  : ~; tclsh
      % proc deproc {name} {return [list proc $name [info args $name] [info body $name]]}
      % deproc deproc
      proc deproc name {return [list proc $name [info args $name] [info body $name]]}
    </code></pre>
    (That might look wrong, but it&#x27;s actually correct. In Tcl the list {name} is exactly the same as the quasiquoted string &quot;name&quot; and the bare word name.)<p><pre><code>  % proc ack {m n} {
          if {$m == 0} {
              expr {$n + 1}
          } elseif {$n == 0} {
              ack [expr {$m - 1}] 1
          } else {
              ack [expr {$m - 1}] [ack $m [expr {$n - 1}]]
          }
      }
      % deproc ack
      proc ack {m n} {
          if {$m == 0} {
              expr {$n + 1}
          } elseif {$n == 0} {
              ack [expr {$m - 1}] 1
          } else {
              ack [expr {$m - 1}] [ack $m [expr {$n - 1}]]
          }
      }
    </code></pre>
    You can&#x27;t do that in Racket or SBCL, but it does exist in Clojure; it&#x27;s clojure.repl&#x2F;source.  However, the part of the presentation you link to doesn&#x27;t use anything similar, and it&#x27;s not really a mainstream part of Lisp development anymore, the way it was 50 years ago.
