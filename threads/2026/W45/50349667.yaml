  author: drob518
  text: After programming in multiple Lisp dialects over 20+ years, it’s only sorta
    true. The biggest problem is that “Lisp” is ambiguous. Common Lisp? Scheme? Emacs
    Lisp? Clojure? They are all legitimate Lisps, but they all have slightly different
    syntax, semantics, and standard libraries. Even among some Lisps, there are differences
    (notably Scheme, though Racket has helped by becoming somewhat dominant in some
    areas). Common Lisp helped reduce differences at the cost of supporting almost
    everything it was seeking to unify, and yet still has platform gaps that implementations
    have to fill in. But within a given Lisp, there is a lot of reuse. Racket has
    a large set of libs. Clojure runs on the JVM and it’s common to mix and match
    Clojure and Java libs.
