    to keep it truly internal. LLM code however? It might be slop, but it&#x27;s <i>accurately
    groomed</i> slop. Prompting the model to roleplay a public library author might
    even improve the output when it&#x27;s in fact not published at all. The investment
    is low, the extra cost of sharing is low, worst that could happen is others actually
    picking it up and that would not be bad at all.<p>Is that spamming the public
