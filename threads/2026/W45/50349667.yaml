  author: WillAdams
  text: When worldwideweb.app was first being developed an the RFCs and so forth for
    web servers and protocols were being discussed, one of the sticking point was
    what to call a URL --- the initial suggestion was &quot;Universal Resource Locator&quot;,
    but the argument was made that users and writers were not librarians and that
    the distributed nature would preclude a given web page having a universally agreed-upon
    location and name, so instead the present &quot;Uniform Resource Locator&quot;
    was adopted.<p>What if there was a code sharing site where it was unambiguous
    what a given snippet of code would be named and where it would be stored, so that
    a user could just browse it and find a list of implementations for a given problem?<p>This
    of course runs up against one what John Ousterhout notes is one of the most difficult
    problems in computer science --- naming things --- in his book:<p><a href="https:&#x2F;&#x2F;www.goodreads.com&#x2F;en&#x2F;book&#x2F;show&#x2F;39996759-a-philosophy-of-software-design"
    rel="nofollow">https:&#x2F;&#x2F;www.goodreads.com&#x2F;en&#x2F;book&#x2F;show&#x2F;39996759-a-philosophy...</a><p>I&#x27;ve
