  author: GMoromisato
  text: I&#x27;ve been reinventing the wheel since I started programming. Back then,
    we had no choice--there weren&#x27;t any open-source libraries. But I also enjoy
    reinventing the wheel because (a) the wheel can be exactly how I want it, and
    (b) I get to learn and understand new things.<p>Coding agents have actually cut
    both ways for me. I can reinvent the wheel more easily and with higher quality,
    but I can also integrate an external library much more easily than before.<p>The
    other day I needed my system to download SFTP, so I had the agent build an SFTP
    client. It turned out that I actually needed FTPS, so I had the agent build that
    too.<p>Another time I wanted to integrate with Git repos, but instead of trying
    to reinvent that, I asked the agent to integrate libgit2. Of course, I asked it
    to add an API that matched the semantics of my system, so from my perspective,
    the wheel was exactly how I wanted it.<p>I think what&#x27;s going to happen is
    that there will be more vertically integrated platforms that do it all. If you
    think about it, it&#x27;s really annoying to cobble together a system from different
    libraries, each of which might have different semantics.<p>What we want, as developers,
    is to have a single, well-designed, integrated platform that exposes all the functionality
    we need in a consistent way. That&#x27;s a lot easier now that LLMs can mold code
    to your exact specifications.<p>I&#x27;m biased, of course, because that&#x27;s
    exactly what I&#x27;m building with GridWhale.
