  author: sieve
  text: 'The language borrows syntax from Python (and a wee bit from Haskell) and
    is essentially syntactic sugar over facilities provided by the runtime:<p>- statically
    typed from end to end<p>- closed and open&#x2F;extensible types<p>- closed types
    are immutable, open ones have two variants: immutable and mutable<p>- arrays have
    two variants: immutable and mutable<p>- no OOP&#x2F;classes. inheritance is nominal
    and mainly exists to provide access to class membership (is X a Y?)<p>- functions
    operating on data<p>- UFCS exists to provide nice features like &quot;apple&quot;.substr(...)<p>-
    first class functions and closures<p>- monomorphized generics<p>- tailcalls<p>-
    operator overloading<p>- modules and namespaces to control access<p>- erlang&#x2F;beam
    style first class processes. So you `spawn` a function and communicate between
    processes using send&#x2F;recv instead of async&#x2F;await<p>Processes are completely
    isolated at the runtime level. Each has its own stack, heap, mailbox and GC.<p>The
    bytecode carries all type information. The VM will compile using AOT-on-load.<p>My
    own runtime-becomes-a-os idea is still just an idea. I haven&#x27;t really pursued
    it with seriousness. Will probably do that once the language and runtime stabilize.'
