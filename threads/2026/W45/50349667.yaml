    Sometimes I think maybe it is some kind of ego-defeating stance or whatever, maybe
    smart programmers just can&#x27;t believe how the stupidly simple idea of Lisp
    can ever satisfy their galaxy-sized brains? To me, Lisp is like a boundless sea
    of incredible idea generation on the spot, turning it into practical reality like
    some magic. Effortlessly, painlessly, and with joy.<p>I don&#x27;t know, maybe
    I had to go through the pain of learning the intricacies of a dozen different
    stacks, using them for years, only to discover Lisp later in my life. Perhaps
    I wouldn&#x27;t know the difference otherwise?<p>Just the other day, I was watching
    a YT video, which I of course fully control directly from Emacs - that is very
    useful for taking notes. I can mute, pause, speed-up, rewind, toggle subs, etc.
