  author: sfn42
  text: At the end of the day your work is your work. If you tell Claude or whatever
    to do a thing it will do that thing however you tell it to do the thing.<p>You
    can choose to ignore the fine details and just tell it what to build, or you can
    spend more time and effort and tell it how to do things, you can ask it to create
    a plan, review the plan and ask for changes etc, you can review the implementation
    and ask for changes there. You can simply tell it you don&#x27;t like how a feature
    is implemented and ask it for suggestions on how to improve it, include what you
    don&#x27;t like about it so it has direction.<p>It&#x27;s all about the effort
    you put in. LLMs are able to write clean beautiful and efficient code, they just
    can&#x27;t necessarily do exactly what you want on the first try without any direction.
    That&#x27;s why you should figure out what you want, ask for what you want and
    make sure it&#x27;s actually building what you want.
