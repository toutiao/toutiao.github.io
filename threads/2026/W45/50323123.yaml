  text: 'Well. One of the things that&#x27;s critical in all that analogy is that
    the BigBallOfMud that one user creates on Shopify cannot impact the other users
    - that&#x27;s why Shopify can keep the platform from becoming ABigBallofMud.<p>In
    order to be able to enforce this hard boundary, it means that one &quot;agent
    generated code&quot; in one place, not only &quot;can call a strictly defined
    set of APIs&quot; - but, more importantly, it implements an isolated piece of
    functionality. Think something like: I let the AI write the dashboards, so the
    dashboards may be slow, crappy, incorrect, whatever - but it doesn&#x27;t impact
    the rest of the product. However, I can&#x27;t let AI write &quot;metrics collection&quot;
    because that not only impacts dashboard, but potentially impacts core product
    efficiency too (memory consumption, cpu, IO, etc.)'
