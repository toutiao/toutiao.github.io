    don&#x27;t even disagree with the premise that convenience is a driving factor
    of our lives, but the justifications and conclusions drawn by this article are
    beyond stupid. Here&#x27;s my view of it: the desire for convenience is what pushes
    us onwards as a species. Hunting for food is inconvenient, so we invented agriculture.
    Going down to the river or well for water is inconvenient, so we invented indoor
    plumbing. Repeat ad infinitum until we have modern civilization. There is one
    part the pessimistic view overlooks; that to achieve maximum convenience long-term
    requires more effort in the short-term. Developing the skill of programming is
    inconvenient in the short-term but convenient in the long-term because of the
    possibilities this opens up to you. This remains true even in the current LLM
    era, and it will remain true for as long as we are not replaced wholesale by LLMs.'
