  author: rcxdude
  text: 'I see a bit of a split in people in creative roles of all kinds (and this
    is something I had noted before LLMs made the contrast more stark). some people
    get into it because they like the <i>process</i> of making the thing that they
    are making (in whole or in part). Others get into it because they have a thing
    that they want to exist in the world but no-one else has made it (I would also
    split this into people who just want the thing, or people who want to make something
    that crosses many domains and so want custom things that will fit into the whole).
    The former group tend to react with revulsion to automation, because it removes
    the part they like (though it may depend on what part is automated: most people
    will find some part of their work necessary but tedious). The latter are usually
    much more willing to embrace it, because it&#x27;s the end result that they care
    about moreso than the process.'
