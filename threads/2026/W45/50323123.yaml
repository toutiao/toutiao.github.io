  author: TonyStr
  text: It turns out that most people are fine with most of their things being mass-produced
    cheap stuff from IKEA, Amazon, Temu, etc. - if that means that the cost is significantly
    lower. The functional benefit of having a door is huge, while the aesthetic benefit
    of having a beautiful, hand-crafted door is much less important to most people.<p>Code
    is not like craftsmanship anyway. The end-user doesn&#x27;t see any difference
    whether I use microservices or hexagonal design or react or htmx or how I structure
    the code or which language I use. All they see is the design and the stability.
    Since the average developer was terrible at design anyway, the average design
    output from LLMs is actually an improvement in most cases, even if it always has
    that generic AI generated look. Stability... was not good before AI either. We
    have become accustomed to SAP taking 10 seconds to load each component on the
    page, or Atlassian spewing error messages in your face when you click submit on
    a ticket. It seems that the aspects that are most valued by our end users are
    QA and UX, not the craftsmanship of our code.
