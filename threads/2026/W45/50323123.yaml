  text: "On the ego-effect, I sometimes feel like cataloguing some PR-review quirks
    that are mostly caused by humans being humans:<p>1. Smaller PRs (that can be easily
    read) tend to receive more comments and nitpicks than a large change since it&#x27;s
    easier for us to have all the PR context in our heads at the same time.<p>2. Most
    people are ego-tied to their code even if they pretend that they are \nimpartial<p>3.
    Social dynamics around merging and reviewing code between senior&#x2F;junior and
    older&#x2F;newer employees<p>4. probably many more"
