article:
  url: https://servo.org/blog/2026/11/05/september-in-servo/
  title: 'September in Servo: &lt;progress>, rounded rectangles, and more! - Servo
    aims to empower developers with a lightweight, high-performance alternative for
    embedding web technologies in applications.'
  fetch_status: success
  content: "# September in Servo: \\<progress\\>, rounded rectangles, and more!\n\nPlus
    new CSS functions and WEbGL2 improvements.\n\nPosted 2026-11-05\n\n[**Servo 0.7.0**](https://github.com/servo/servo/releases/tag/v0.7.0)
    contains all of the changes we landed in September, spanning 527 commits!\n\n[![a
    black and white cat named Gary showing off new visual web platform features](/img/blog/2026-10-gary-banner.png)](/img/blog/2026-10-gary-banner.png)\n\nThe
    developer tools console now **eagerly evaluates** JS inputs, allowing faster feedback
    ([@freyacodes](https://github.com/freyacodes), [#47527](https://github.com/servo/servo/pull/47527)).\n\nWe’ve
    shipped new web platform features:\n\n- the **:checked** pseudoclass ([@skyz1](https://github.com/skyz1),
    [#47987](https://github.com/servo/servo/pull/47987))\n- the **user-select** property
    ([@SimonSapin](https://github.com/SimonSapin), [@mrobinson](https://github.com/mrobinson),
    [#48137](https://github.com/servo/servo/pull/48137), [#48242](https://github.com/servo/servo/pull/48242))\n-
    the **\\<progress\\>** element ([@rayguo17](https://github.com/rayguo17), [#46974](https://github.com/servo/servo/pull/46974))\n-
    CSS [typed arithmetic](https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Values_and_units/Using_typed_arithmetic)
    ([@Loirooriol](https://github.com/Loirooriol), [#48338](https://github.com/servo/servo/pull/48338))\n-
    the **alpha()** CSS function ([@Loirooriol](https://github.com/Loirooriol), [#48344](https://github.com/servo/servo/pull/48344))\n-
    the **font-width** property ([@Loirooriol](https://github.com/Loirooriol), [#47914](https://github.com/servo/servo/pull/47914))\n\nPlus
    a bunch of new DOM APIs:\n\n- **parentRule** on **CSSRule** and **CSSStyleDeclaration**
    ([@skyz1](https://github.com/skyz1), [#47743](https://github.com/servo/servo/pull/47743))\n-
    **version** on **HTMLHtmlElement** ([@SilvioPilato](https://github.com/SilvioPilato),
    [#47786](https://github.com/servo/servo/pull/47786))\n- **getComposedRanges()**
    and **direction** on **Selection** ([@mrobinson](https://github.com/mrobinson),
    [#47683](https://github.com/servo/servo/pull/47683))\n- **baseURL** on **CSSStyleSheet**
    ([@Gae24](https://github.com/Gae24), [#47783](https://github.com/servo/servo/pull/47783))\n-
    [**CSS modules**](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules#loading_non-javascript_resources)([@Gae24](https://github.com/Gae24),
    [#47813](https://github.com/servo/servo/pull/47813)) and **text modules** ([@Gae24](https://github.com/Gae24),
    [#47863](https://github.com/servo/servo/pull/47863))\n- **getContextAttributes()**
    on **CanvasRenderingContext2D** and **OffscreenCanvasRenderingContext2D** ([@Taym95](https://github.com/Taym95),
    [#47868](https://github.com/servo/servo/pull/47868))\n- the **Content-Language**
    header ([@TimvdLippe](https://github.com/TimvdLippe), [#47930](https://github.com/servo/servo/pull/47930))\n-
    **dir** on **Document** ([@yezhizhen](https://github.com/yezhizhen), [#48170](https://github.com/servo/servo/pull/48170))\n-
    **SVGAElement** , **SVGPatternElement** , **SVGTSpanElement** , **SVGTextContentElement**
    , **SVGTextElement** , **SVGTextPositioningElement** ([@mu-mostafa98](https://github.com/mu-mostafa98),
    [#48174](https://github.com/servo/servo/pull/48174))\n- the **MLKEM768-X25519**
    algorithm for **WebCrypto** ([@kkoyung](https://github.com/kkoyung), [#48240](https://github.com/servo/servo/pull/48240),
    [#48282](https://github.com/servo/servo/pull/48282), [#48313](https://github.com/servo/servo/pull/48313),
    [#48350](https://github.com/servo/servo/pull/48350))\n- **roundRect()** on **CanvasRenderingContext2D**
    ([@yezhizhen](https://github.com/yezhizhen), [#48293](https://github.com/servo/servo/pull/48293))\n-
    **paintTime** and **presentationTime** on **PerformancePaintTiming** ([@shubhamg13](https://github.com/shubhamg13),
    [#47926](https://github.com/servo/servo/pull/47926))\n- **getCueAsHTML()** on
    **VTTCue** ([@TimvdLippe](https://github.com/TimvdLippe), [#48146](https://github.com/servo/servo/pull/48146))\n\n##
    Security \n\nWe upgraded to **SpiderMonkey v153.3** and **mozangle v0.7** , both
    of which included fixes for security bugs reported upstream ([@sagudev](https://github.com/sagudev),
    [#48176](https://github.com/servo/servo/pull/48176), [#47655](https://github.com/servo/servo/pull/47655),
    [#48259](https://github.com/servo/servo/pull/48259)).\n\n## Real world compat
    \n\nThe [egui.rs](https://www.egui.rs/) demo now works as expected with `--pref
    dom._webegpu_enabled`.\n\n[![http://egui.rs rendering in Servo](/img/blog/2026-10-egui.png)](/img/blog/2026-10-egui.png)\n\nThis
    [Candy Crush](https://jooyouss.github.io/candy-crush/) game is now playable.\n\n[![A
    Candy Crush game rendering in Servo](/img/blog/2026-10-candycrush.png)](/img/blog/2026-10-candycrush.png)\n\nWe’re
    interested to hear how well your favourite websites run in Servo! Report successes
    in [this Zulip thread](https://servo.zulipchat.com/#narrow/channel/263398-general/topic/Servo.20web.20compat.20success.20stories/with/612898341)
    or [this Github discussion](https://github.com/servo/servo/discussions/49037),
    and failures [in our GitHub issues](https://github.com/servo/servo/issues).\n\n##
    Work in progress \n\nOur accessibility tree (`--pref accessibility_enabled`) now
    **reports geometry bounds** for inline elements ([@alice](https://github.com/alice),
    [#47905](https://github.com/servo/servo/pull/47905)) and does much less work when
    responding to DOM changes ([@alice](https://github.com/alice), [@mrobinson](https://github.com/mrobinson),
    [#47690](https://github.com/servo/servo/pull/47690)). Additionally, elements with
    `display: none` are reported as hidden ([@alice](https://github.com/alice), [#47772](https://github.com/servo/servo/pull/47772)).\n\nWe
    had lots of conformance improvements for our **WebGL2 implementation** (`--pref
    dom_webgl2_enabled`) ([@mxmgorin](https://github.com/mxmgorin), [#48423](https://github.com/servo/servo/pull/48423),
    [#48441](https://github.com/servo/servo/pull/48441), [#48470](https://github.com/servo/servo/pull/48470),
    [#48479](https://github.com/servo/servo/pull/48479), [#48495](https://github.com/servo/servo/pull/48495),
    [#48473](https://github.com/servo/servo/pull/48473), [#48536](https://github.com/servo/servo/pull/48536)).\n\nSupport
    for WSIWYG editors (which rely heavily on **`contenteditable`** ) is going very
    well: keyboard inputs are now hooked up when `--pref dom_exec_command_enabled`
    is present, so many editors are now usable ([example](https://www.tiny.cloud/docs/tinymce/latest/basic-example/)).\n\n**Closed
    captioning** for video elements is making progress. Text tracks now fire `enter`,
    `exit`, and `cuechange` events ([@TimvdLippe](https://github.com/TimvdLippe),
    [#47725](https://github.com/servo/servo/pull/47725)). Media elements now return
    the full sorted list of text tracks ([@TimvdLippe](https://github.com/TimvdLippe),
    [#47785](https://github.com/servo/servo/pull/47785)), and adding cues to a text
    track now sets that track correctly ([@TimvdLippe](https://github.com/TimvdLippe),
    [#48012](https://github.com/servo/servo/pull/48012)). Text track objects now reflect
    the attributes of the associated `<track>` element. Text track URLs are fetched
    at the correct time ([@TimvdLippe](https://github.com/TimvdLippe), [#48325](https://github.com/servo/servo/pull/48325)),
    and active cues are computed correctly ([@TimvdLippe](https://github.com/TimvdLippe),
    [#48305](https://github.com/servo/servo/pull/48305)), while text track cues are
    ordered as expected ([@TimvdLippe](https://github.com/TimvdLippe), [#48368](https://github.com/servo/servo/pull/48368)).
    Additionally, WebVTT parsing can now recover from errors ([@TimvdLippe](https://github.com/TimvdLippe),
    [#48391](https://github.com/servo/servo/pull/48391)).\n\nThe **Sanitizer API**
    (`--pref dom_sanitizer_enabled`) now accepts the `javascriptURLs` property ([@skyz1](https://github.com/skyz1),
    [#47867](https://github.com/servo/servo/pull/47867)).\n\n**IndexedDB** continues
    to improve: tables"
