    Hm I am not sure I see the connection between that Hague article and Unix being a "rebellious system" like Rails?  (I'm not sure it's clear that Rails is a rebellious system either, but that's a separate question.)
    Referring to only the Hague article:

    I'm comfortable pointing out the three reasons Unix makes sense:



    It works.
    It's reliable.
    It stays constant.



    But don't--do not--ever, make the mistake of those benefits being a reason to use Unix as a basis for your technical or design aesthetic.

    First, the benefits of Unix he points out aren't really "rebellious" -- it's a different dimension.
    Second, I see what he's saying about aesthetic, but I think it misses an important point: Unix was ABLE to grow because, like the web, it started out as the minimum thing that does the job.  It was contrarian compared to Multics, and that is exactly why Cantrill calls Unix rebellious.
    So I think that minimalism is an aesthetic worth thinking about, at least in open source.  If you have a lot of money, that does open up things, but it often makes things worse too.
    It's true that Linux a big mess in almost all ways now, but you have to choose carefully what you compare it to.  Windows?
    For a totally different aesthetic, I would randomly throw out say the Darklang project (which has featured on lobste.rs over the years).  And I would say coupling in its design fundamentally limited its applicability, and more.  So is this a "constructed" system?  If so, then I'd say it could be a counterexample
    ( I didn't watch the linked talk yet, but I hope to ... I did find Cantrill's earlier talk mentioning "rebellious systems" quite good, but I'll have to remind myself of his exact definition.  I am not sure I entirely agreed with the dimensions / taxonomy, but I remember the talk being good.
    Oh yes it was this one: The Complexity of Simplicity.)
