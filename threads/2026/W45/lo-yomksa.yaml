    Combining the quadrant of systems from this talk with this James Hague article, "Free Your Technical Aesthetic from the 1970s", I propose a variation on that title: "Free your technical aesthetic from rebellious systems".
    I think that a lot of programmers, myself included, have idolized rebellious systems too much. Unix, Rails, even the early microcomputers that we now look back on fondly. (I include the latter in this category because the rebellious streak in the early microcomputer industry is well-known.) But these rebellious systems sometimes throw out things that actually matter and then have to accrete them back. I think as working programmers, often the best we can hope for is a constructed system, and we shouldn't want so badly to follow in the footsteps of the rebellious systems.
