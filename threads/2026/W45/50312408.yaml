  author: '27183'
  text: 'I&#x27;m not very positive on the social, technical, or intellectual impact
    of AI on software development. Actually, that&#x27;s understating it. I think
    AI is basically cancer for the mind. That said, this framing gave me pause:<p>&gt;
    The long-term picture is less clear and in some ways more troubling: given that
    we have forty years of bugs that humans were unable to find but LLMs are quite
    capable of discovering, how are we ever going to catch up, and how will PostgreSQL
    continue to innovate? Right now, I’m not sure. What I do know is that I, and many
    others, are working really hard to figure it out.<p>Two thoughts:<p>1. If the
    signal quality is high--the bug reports are generally valid, the submitted fixes
    are generally viable (if needing some attention)--then this all seems great. Pause
    innovation for a while, you can afford it. Focus on burning down the bug count,
    and resume feature development when things are more stable.<p>2. If the signal
    quality isn&#x27;t good, or is sufficiently mixed that a lot of time is being
    wasted on low quality contributions... that&#x27;s more complex. I don&#x27;t
    know what to do about that. Maybe stop accepting contributions from unknown contributors?
    No idea.<p>From the post I&#x27;m not sure whether they&#x27;re experiencing a
    (1) or a (2). If it&#x27;s a (1) that&#x27;s really interesting, and gives me
    some glimmer of hope for the future.<p>[edit] this piece of shit website won&#x27;t
    let me reply &quot;you&#x27;re posting too fast..&quot; so I&#x27;ll respond to
    the two replies here (gondalez and sverhagen had basically the same point):<p>Yes
    that&#x27;s a very good point. Not every valid bugfix is equivalently urgent.
    That&#x27;s another critical dimension of quality--not burdening maintainers with
    pedantic bugs. This kind of contextual nuance is, coincidentally, something AI
    is absolutely awful at.'
