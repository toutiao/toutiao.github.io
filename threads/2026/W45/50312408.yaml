  author: berkes
  text: 'Indeed. And this is also why I&#x27;ve never once believed the &quot;no-code&quot;
    would replace developers. And why I see a clear role for software (prompt-, context-
    ?) engineers at least for a while.<p>I&#x27;ve worked for CEOs and managers that
    would insist on ridiculous ideas. Like that time a CEO (let&#x27;s call him Cedric)
    came in with a printed powerpoint slide that had a screenshot of the website with
    a &quot;login form&quot; drawn on top of it.<p>Cedric: &quot;I need you guys to
    put this onto that scrunt board thing and make this before friday&quot;.<p>Me
    (tech lead at that time): &quot;But what features would users need login for?
    Where or whom needs the profile data? We&#x27;d need to work this out in detail
    and plan it. Certainly not even this month&quot;.<p>Cedric: &quot;I don&#x27;t
    know, it&#x27;s for you to figure out&quot;. and then &quot;It can&#x27;t be hard,
    it&#x27;s just two squares one for a username one for a password&quot; (he forgot
    about the submit-button, the third &quot;square&quot;, he didn&#x27;t even fathom
    the idea that something has to lie &quot;behind&quot; the &quot;squares&quot;).<p>I
    recall this anecdote whenever I feel anxious about whether soon &quot;stakeholders&quot;
    can just chat to an AI agent and have it build features, rather than hire me to
    do so. Sure, a lot of them will be able to. But there&#x27;s always Cedrics. Those
    who not only fail to communicate their ideas in a way that even an AI agent would
    understand, they lack any understanding of what tradeoffs of their requested features
    are.<p>The Cedric&#x27;s would be happy with an AI agent that complies and starts
    churning away. An agent that blindly accepts any request and builds feature upon
    feature. Making their product worse in every sense: unusable, unmaintainable,
    debt-ridden, security-nightmares.<p>Their agent will build features that are plain
    illegal. Or features that users hate, or confuse them. It will oblige requests
    that drive users away, or changes parts that users&#x2F;integrations rely on.
    Their AI agent will gladly add a &quot;form&quot; to extract all PII from their
    database, but on request, will remove the authorization from it. Because &quot;you
    are absolutely right. If we don&#x27;t link to the page from the menu, no-one
    can reach it&quot;.<p>I&#x27;m not making the last one up. Another &quot;Cedric&quot;
    alike recently hired me to look at his vibe-coded app because his go-to developer
    gave up and dropped the project. It had loads of such extractors, dashboards and
    overviews. Online. Unauthenticated. His claude, however, did add the pages to
    the sitemap, so a customer found their private data on google and contacted &quot;Cedric&quot;,
    after which he asked me.<p>No, AI is getting smarter, but as long as the &quot;Cedrics&quot;
    remain as stupid as ever, I don&#x27;t fear for my job.'
