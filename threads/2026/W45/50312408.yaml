  text: |-
    I work on pgrust. We shouldn&#x27;t have submitted the preview when we did: it was still in active development, and its SQL coverage was far too narrow, though there was nothing in it giving it an unfair performance advantage<p>For the other two claims in the removal PR, we wrote scripts you can use to verify the behavior of the original 0.4-preview binary:<p><pre><code>  - Per-query kernels did not serve the benchmark queries[0]
      - The preview&#x27;s fast repeat LIKE queries came from a dictionary filter cache, not a cached query result[1]
    </code></pre>
    Our open-sourced 0.4-beta has now been merged and is back on ClickBench[2][3]<p>Across all queries and instance sizes on ClickBench, 0.4-beta is ~7% faster overall than the 0.4-preview binary that was removed. If 0.4-preview&#x27;s numbers had come from hardcoded kernels or faked results, the open-source general engine wouldn&#x27;t be beating it<p>[0] <a href="https:&#x2F;&#x2F;pgrust.com&#x2F;downloads&#x2F;archive&#x2F;2026-09-clickbench-snapshot&#x2F;verify-preview.sh" rel="nofollow">https:&#x2F;&#x2F;pgrust.com&#x2F;downloads&#x2F;archive&#x2F;2026-09-clickbench-snap...</a><p>[1] <a href="https:&#x2F;&#x2F;pgrust.com&#x2F;downloads&#x2F;archive&#x2F;2026-09-clickbench-snapshot&#x2F;verify-like-hot-runs.sh" rel="nofollow">https:&#x2F;&#x2F;pgrust.com&#x2F;downloads&#x2F;archive&#x2F;2026-09-clickbench-snap...</a><p>[2] <a href="https:&#x2F;&#x2F;benchmark.clickhouse.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;benchmark.clickhouse.com&#x2F;</a><p>[3] <a href="https:&#x2F;&#x2F;github.com&#x2F;ClickHouse&#x2F;ClickBench&#x2F;pull&#x2F;2751" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;ClickHouse&#x2F;ClickBench&#x2F;pull&#x2F;2751</a>
