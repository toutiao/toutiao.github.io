    I have mixed feelings about this post and the reactions to it. Over the years I have evolved from "oo, shiney Nosql, that looks new" to "just use Postgres, it's the standard and its solid".
    That postgres basically gobbles most new db paradigms, rendering all but the most niche-needy adopters with no choice but to stick with postgres, speaks of a development arc that has constantly added features and complexity. It was inevitable that it was going to reach some sort of "patch criticality" sooner or later.
    As a thought experiment, imagine a side universe where LLMs hadn't happened yet. And the postgres guys announced that they'd had it with ever swelling backlogs of bug fixes, and that the next release would be about "stability, refinement, and removing bugs". As software developers, we've cheered this type of move before. Good software engineers have cheered far and wide anytime Apple announces they're just going to do a release that fixes thing.
    So this idea that a large project slow the !$%@!$% down and give some attention to stability and quality is not new. It is cool, laudible, that AI "tools" (whatever) are being used to advance this cause for once, but the notion that AI has heralded in something new (an emphasis on quality) is weak, in my opinion. We still (mostly) direct these things. Kudos to the postgres dudes for pointing LLMs at quality, instead of more features (looking at you Particle DB), but the choice to make that the emphasis is about humans. Choices we've had the opportunity to make since long before LLMs arrived on the scene.
    One thing that will be interesting to me is the nature of all of these fixes. Like code generation, I find that these tools do certain types will and other parts not as well. They can be OCD about well established anti patterns. But getting them to do "less is more" and innovate so that whole classes of failures go away, that seems to be mostly outside of their ability to introspect and invent still.
