    So I read this title and thought "ah great, yet another article complaining about vibecoded features and their slop". But then I remembered reading some other article about PostgreSQL 19 in the last few weeks and how it claimed that none of its features had been written with the help of LLMs. Which made me curious to read it.
    The premise of the article, if I read it right, is that PostgreSQL 19 is late because LLMs found more bugs than would have been found in the past before the release. In my eyes... that's... good? So it's not late because AI is at "fault"; it sounds to me that it's late "thanks" to AI.
