    As someone who has been loudly in favor of LLMs for quality over velocity, I've really been struggling with a lot of this.
    Look, a lot of the systems I help maintain are quite good, right? Not to toot my own horn too much but I've been repeatedly recognized for being able to write solid, high-quality systems. Well, I pointed LLMs at some of those systems and I'm now sitting on several stacks of work, totalling over 100 fixes (before I stopped the LLMs from hunting for even more bugs). I've noticed a few things:

    Some of those bugs are quite serious but a lot of them are edge cases that no one is realistically going to hit. The Postgres devs' standards are probably even higher than mine, though.
    A lot of the fixes proposed by the LLM are relatively surface-level, and a more systemic understanding would likely result in fewer, better, root-cause fixes. But this kind of analysis is a lot of work that (at least currently) humans have to be in the drivers' seat making judgment calls for.
    Every change has a baseline risk -- the systems clearly work well enough today -- and some of the proposed fixes introduce regressions of their own, or at least aren't clearly better than the status quo.
    I have so many other things to do!

    So I've been very slowly processing the stack of fixes, 3-5 at a time, and not blocking releases on any of it. This is a new kind of judgment, though. In a sense you're effectively DoSing yourself with bug reports and fixes, then figuring out which ones are truly important.
