  text: Found similar results, but the economics of the models involved have changed
    so quickly that it becomes so task specific on what the right thing to do was.<p>With
    an assemblage of models like Jev + Opus or Jev + Qwen, Jev would often do the
    right thing when deciding to escalate to another model - I was impressed that
    it would usually make the right call, especially if you gave it good awareness
    of what the other model capabilities were.  &quot;ESCALATE to opus if you need
    good vision awareness&quot;.<p>When Haiku 5.5 came out though, for my tasks, the
    cost differences disappeared almost immediately. Haiku was good enough &#x2F;
    fast enough for so many things that introducing a decider layer didn&#x27;t offer
    huge wins. Jev&#x27;s &quot;millisecond&quot; level performance was nice but would
    get dwarfed by other latencies in my chain ( web browsing ), that it didn&#x27;t
    make a measurable difference in my tasks.
