  author: jeef_berky
  text: My bandaid fix for this is having a large number of sessions or &quot;agents&quot;
    and being ok with them being inactive at times, but they maintain their context.
    This has to be in some kind of system with appropriately sized &quot;departments&quot;
    to justify that agent&#x27;s existence, or to justify it splitting into two, or
    creating sub-agents, etc. Yes, there is a cost when you cold start an agent after
    a week, but for now I&#x27;d rather pull that whole 400k+ context back without
    layers and layers of &#x2F;compact. And then hopefully you keep that agent going
    for long enough to benefit from any cache-hit discounts.<p>Not really a good analogy,
    but it feels like having an image you like but every time you view it, it runs
    it through another loop of jpg compression. Use it when it&#x27;s most effective,
    otherwise let it preserve it&#x27;s details.
