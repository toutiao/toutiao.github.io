  author: beefsack
  text: I think whether it&#x27;s bottom-up or top-down, the core principle is still
    that you use cheap models for grunt work and use frontier models for expertise
    and direction.<p>In my setup, the orchestrator also drives a lot of the design
    and planning, and the less capable models get inputs from the more capable models
    by responding back up the chain. The more capable models also review everything
    that is produced by the cheaper models.<p>I&#x27;ve also had systems that invert
    this and allow cheaper models to call out to more capable models when they need
    to, but in my observation I found them quite bad at knowing even when to call
    out and I find wrapping the cheap models a bit more reliable in that problems
    tend to get caught before they bubble up to the user.
