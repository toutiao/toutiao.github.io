  text: 'It&#x27;s not a problem you can get right, because you can&#x27;t know if
    you need to escalate until after you escalate (and what you escalated to disagrees
    with what your first choice would have been). But that&#x27;s the point: how cautious
    you make the model is the knob that lets your trade cost for correctness.<p>I
    don&#x27;t believe the answer is ever &quot;how certain is the model?&quot; It&#x27;s
    &quot;how much is at stake?&quot; Or &quot;how hard of a problem does this appear
    to be?&quot; It&#x27;s not about teaching the model to have uncertainty, but rather
    to be avoidant of things that are sufficiently important to get right.'
