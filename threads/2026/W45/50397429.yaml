    This is probably what you&#x27;re looking for. TLDR; weaker orchestrator + strong
    workers scored higher than the reverse. Caveat with that, old paper: &quot;High-capability
    models: GPT-5, Claude Sonnet 4.5, Gemini-2.5 Pro; low-capability: GPT-5 nano,
    Claude Sonnet 3.7, Gemini-2.0 Flash.&quot;<p>With that said, there is evidence
    that we recently crossed over a line for &#x27;best practices&#x27; when it comes
    to systems of multiple agents. Comparing the shapes of &#x27;n agents working
    collaboratively&#x27; vs &#x27;1 agent spawning n agents to handle distinct work&#x27;,
    Opus 5.5[1] and Opus 5[4] performs better with the former, Sonnet 5.5[2] and Opus
    4.8[3] performs better with the ladder.<p>[1] <a href="https:&#x2F;&#x2F;www-cdn.anthropic.com&#x2F;fc1b44717c85dc068bc6ba5024219938094694bd&#x2F;Claude%20Opus%205.5%20System%20Card.pdf#page=190"
