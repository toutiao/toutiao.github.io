  author: pornel
  text: It&#x27;s expected. Cargo has very conservative cache cleanup (once per month
    IIRC).<p>There&#x27;s incremental compilation cache that generates lots of churn
    (although Rust&#x27;s compilation unit is a crate, &quot;queries&quot; in the
    compiler are cached individually, creating many cache entries per function per
    type).<p>The other half of the disk space is debug info, because abstractions
    that optimize down to zero runtime code still carry all of their source-level
    debug info.<p>These can be adjusted in build profiles if you&#x27;re ok with coarser
    debug info or less fine-grained caching.
