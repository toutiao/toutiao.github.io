  author: adrian_b
  text: I frequently compile big software projects, using fast multi-core CPUs, like
    AMD 9950X, with which the compilation itself is really fast.<p>Such compilations
    produce a ton of text messages. With any classic terminal, the text rendering
    in the terminal window becomes a bottleneck, slowing down the compilation very
    noticeably.<p>With modern terminals that use GPU text rendering, like ghostty
    and kitty, compilations are done much faster.<p>Of course, with classic terminals
    you can redirect the compiler output, to avoid this problem, but I prefer to glance
    at the progress of the compilation, to notice early if there are problems.<p>Even
    in normal interactive use, there are enough cases when the difference between
    the instant rendering of ghostty or kitty and the slowness of the classic terminals
    is noticeable.<p>To see the difference between a slow terminal emulator, like
    you probably use, and a fast terminal emulator, you can do a &quot;cat&quot; from
    a text file of a few megabytes, and you will see the speed difference.
