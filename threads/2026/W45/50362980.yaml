  author: latexr
  text: "&gt; I bet a designer would put lots of space around each box and hide stuff
    under menus and tabs<p>A designer might indeed add more space but not necessarily
    hide stuff. Design works within constraints, and if the constraint is everything
    should be visible, then it needs to work like that.<p>That interface <i>would</i>
    benefit from more space in areas. Note for example how the descenders of letters
    (look for “g” or “y”) bleed into the bottom shadow (the “side”) of the buttons.
    It’s definitely tight. It gets worse with the bold areas. On the top right you
    seem to have buttons, labels, and a text field, all using the exact same font
    at the exact same size, all in bold and with no spacing between them. It makes
    it harder to focus on information, and everything is so close together that you’ll
    either have misclicks or be slower as you put the cursor in just the right place.<p>Sure,
    have that interface for the hardcore users, including those who are going to use
    the keyboard to interact with every part of that, but it’s not a failing to add
    more space, and menus aren’t always wrong.<p>People love making fun of designers,
    but it’s the toupée fallacy, you notice it when it’s bad. There’s a reason “good
    design is invisible” is a maxim. Like on every field, there are good designers
    and bad designers."
