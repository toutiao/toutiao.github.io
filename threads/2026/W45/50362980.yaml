  author: flohofwoe
  text: 'Very similar, about the only difference from user perspective is that Kitty
    has a slight content &#x27;wobble&#x27; on macOS when resizing the window (this
    typically happens when the content is rendered via an MTKView or CAMetalLayer
    and its parent view&#x27;s &#x27;layerContentsPlacement&#x27; isn&#x27;t anchored
    to one side during window resizing). That would be trivial to fix though.<p>PS:
    another difference is installation size, on macOS Kitty is about 246 MB while
    Ghostty is 67 MB (and it looks like Kitty comes with a glslang shader compiler
    and python 3.14 frameworks, which together already take up 32 MB).<p>TL;DR: it
    feels like Ghostty is paying a bit more attention to platform-specific aspects
    than Kitty.<p>Also funny&#x2F;sad: both call themselves &#x27;cross-platform&#x27;,
    but then don&#x27;t support Windows (only various UNIX variants).'
