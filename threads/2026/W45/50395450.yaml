  content: |-
    [Free and open source](https://github.com/devvmhq/devvm)
    # One VM for every project

    An isolated sandbox with your project’s toolchain, ready for you or a coding agent to start coding.

    [Install](docs/getting-started/install/)[Read the docs](docs/)

    ## Quick start

        # Install devvm, and Lima with it
        brew trust --formula devvmhq/tap/devvm
        brew install devvmhq/tap/devvm

    The install script in the Linux tab also works on macOS, and [Installing](/docs/getting-started/install/#installing-devvm) lists its options.

        # Install devvm and what it needs
        curl -fsSL https://github.com/devvmhq/devvm/releases/latest/download/install.sh | bash

    The script asks before it installs Lima, QEMU or access to `/dev/kvm`.

    Claude Code needs your Claude login before its first start, which `devvm agent login claude` makes from the VM and keeps on your machine ([your first VM](/docs/getting-started/first-vm/#claude-codes-login)). The next time you run devvm in the folder, it opens the same VM, and `devvm tools` adds an agent to a VM you already have.

    ## What’s supported

    ## Why use devvm?

    - Developers face attacks every day, such as [supply chain attacks](https://en.wikipedia.org/wiki/Supply_chain_attack), leaked secrets, [prompt injections](https://en.wikipedia.org/wiki/Prompt_injection) and rogue agents.
    - A sandbox limits the [blast radius](https://en.wikipedia.org/wiki/Blast_radius#Uses_in_software) of an attack to what’s inside it.
    - You know you _should_ run your code and agents in a sandbox, but most tools need configuration and setup that’s hard to get right.
    - `devvm` ships with sensible defaults so you can start coding in a sandbox with a single command.

    ## FAQ

    ### What does it run on?

    `devvm` runs on macOS and on Linux, on arm64 or x86\_64. It needs [Lima](https://lima-vm.io/), which runs the VMs with Apple’s Virtualization framework on macOS and QEMU on Linux ([backends](/docs/backends/)). Homebrew installs Lima along with devvm, and on Linux, Lima also needs QEMU and access to `/dev/kvm`. [Installing](/docs/getting-started/install/) lists every requirement, and [known limits](/docs/using/limits/#linux-hosts) lists what Linux hosts lack, such as `.git` protection.

    ### Does the agent run on my machine?

    No. You start the agent in the VM’s shell, so it runs in the VM, and you never install it on your machine. There it sees only [what the VM can reach](/docs/safety/#what-a-vm-can-reach).

    ### Is it free?

    Yes. `devvm` is open source under the [MIT license](https://github.com/devvmhq/devvm/blob/main/LICENSE).

    ## Start coding in a sandbox

    Install `devvm`, then run `devvm` in any project folder.

    [Install](docs/getting-started/install/)[Read the docs](docs/)
