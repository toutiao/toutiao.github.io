  author: caymanjim
  text: To those who are replying with surprise and fear:<p>I work in healthcare-adjacent
    tech. You can use Claude with HIPAA&#x2F;PHI. You need to sign a BAA (Business
    Associate Agreement). It dictates how Anthropic may use and how they must safeguard
    the PHI (Private Health Information), including not training on it.<p>I assure
    you that Claude and other LLMs are used extensively in healthcare, with PHI access,
    just about everywhere.<p>Don&#x27;t be naive. Don&#x27;t be alarmist.<p>If anything,
    LLM use under these conditions is far more safe than the way most people use LLMs.
    Engineers who aren&#x27;t under any regulatory regime like HIPAA are using LLMs
    without the BAA safeguards, exposing personal data directly to the insecure, shared
    models, which are now training on all the personal data that&#x27;s being fed
    into them. People think their communication with LLMs is private and isolated,
    but without the BAAs in use by companies under compliance regimes, it&#x27;s not
    isolated.
