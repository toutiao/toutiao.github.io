  author: CharlieDigital
  text: It works, but requires full team buy in.<p>Key is to get folks to unload their
    heuristics and rules they use for their daily workflow and judgement.<p>What does
    good code look like?  What are you looking for when reviewing code?  What anti-patterns
    are your senior devs looking for? How can you see the evidence of agent adherence?<p>Some
    of it comes down to system architecture and essentially creating rails.  Agents
    are very good at following patterns and copying existing code (it&#x27;s all just
    text).  Establishing strong patterns, documenting them, and creating deterministic
    checks (linters, analyzers) helps unlock broader audience of builders.<p>There&#x27;s
    nothing that fundamentally cannot be written down as a set of heuristics and given
    to agents to enforce except that most folks in software are very bad at writing.
