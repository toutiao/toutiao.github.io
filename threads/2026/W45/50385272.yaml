  author: sunaookami
  text: 'It&#x27;s because Claude Code inserts a &quot;hidden&quot; (e.g. not visible
    to the user and very unexpected) info block to the system prompt that shows your
    email:<p>&gt;The user&#x27;s email address is xxx@example.com. Use it only to
    identify the user, such as for authorship, attribution, or filtering their own
    work. Never send it to an unrelated service, such as in a request header, URL,
    or payload, unless the user explicitly asks.<p>And Claude doesn&#x27;t care about
    what the text says and when it uses cURL it will often &quot;by accident&quot;
    send your mail in the User-Agent. You can e.g. use a mod to remove that block:
    <a href="https:&#x2F;&#x2F;pastebin.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;pastebin.com&#x2F;</a>
