  text: Some sites like Wikipedia have a policy where scripted clients identify themselves,
    and there&#x27;s a standard in HTTP to have a contact email in the User-Agent
    for such cases. Claude apparently tends to decide that this policy is worth following,
    and we now disallow this programmatically.<p>This is why alignment is important
    and highly non-trivial
