  author: mk89
  text: You mentioned only 2 websites you know of.<p>I burnt a few tokens to get some
    clarity on this (giving HN as source as well, so there is a reference to this
    thread):<p>&gt; This doesn&#x27;t appear to be Claude Code automatically attaching
    your email address to every outgoing request. The issue is that Claude has access
    to your account email in its context and can sometimes include it when generating
    HTTP requests (e.g. &quot;curl&quot; commands).<p>&gt; Wikipedia and the SEC were
    mentioned because they explicitly ask automated clients to identify themselves
    through the &quot;User-Agent&quot; header, often with contact information. Claude
    may try to comply with those requirements by inserting your personal email address.<p>&gt;
    That&#x27;s why the leak is probably concentrated on sites with these policies,
    rather than happening on every website. But Wikipedia and the SEC aren&#x27;t
    an exhaustive list (the EVE Online API was also mentioned), and there&#x27;s no
    technical guarantee that Claude couldn&#x27;t include the email in requests to
    other domains.<p>&gt; The important distinction is that this appears to be model-generated
    behavior, not a networking layer automatically adding your email to all requests.<p>&gt;
    So &quot;most likely Wikipedia and SEC&quot; is a reasonable hypothesis about
    where the leak is more likely to occur, not a confirmed limit on where your email
    could have been exposed.<p>I do see a lot of times curl being used (in Claude).
    I don&#x27;t check all the websites being fetched (shame on me!), but your answer
    doesn&#x27;t convince me.<p>My coincidence is clearly not proof. I am just a random
    online guy so why trust me. I just shared my recent experience. I used extensively
    copilot until roughly 3 weeks ago (I went all in on Claude, to try it out properly),
    and that&#x27;s when I started to see a lot of spam on my work account. Coincidence?
    Yes. Correlation? Yes. Causation? No. And I personally don&#x27;t care because
    I assume my work email account is somewhere to be harvested, but when I then see
    such a but report, it kind of rang a bell like WTF. I am as careful as possible
    about the requests I send, but I cannot remove the UA or know everything the harness
    is doing behind the scenes.<p>This type of bugs kind of kills the trust in the
    tooling. On the other hand, we&#x27;re being told to use more and more such black
    boxes.
