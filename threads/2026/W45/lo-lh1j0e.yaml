    This is the kind of thing that an LLM is very bad at. […] The LLM will tell you that your code looks like an antipattern. […] The LLM advice that I've seen for this kind of thing will let you avoid a pathological case at the expense of making the common case slower.

    I feel like rather than guessing what the LLM will say, we can just ask it. Here is what Opus 5.5 in Pi reports when you put it to the file and ask the following question: "Please review string.zig against the libc implementation": review.md
    Beyond the actual bugs if found, here is what it says on speed:



    Every call measures the whole string first. strchr, strspn, strcspn, strpbrk, strstr and strcasestr call std.mem.span/len on the full haystack, so even a match at index 0 costs O(strlen). musl stops at the first match. A common loop like while ((p = strchr(p, ','))) becomes quadratic.

    strtok_r and strsep are quadratic. They call span on the rest of the string on every call, so splitting a large buffer costs O(n²).


    I think those are completely accurate findings. But worse, it immediately found three behavior bugs in memccpy, strncmp and strchr. memccpy(dst, "abc", 'b', 4) for instance gives the wrong results in the new zig implementation and it noticed that strncmp reads one extra byte beyond n.
    (And it also confirmed that all three bugs are still in the latest version on git)
