  text: |-
    This is the kind of thing that an LLM is very bad at.
    For very small strings, any vectorisation is unlikely to give a win because all of the futzing with the unaligned starts and ends will cause problems.  For large strings, it's a big win but reading past the end of the buffer may cause problems (most architectures won't trap, but some will even for aligned reads).  If the string fits nicely in the cache then the strlen is warming the cache for you and the vectorised match will be incredibly fast.  For very large strings, the cost of the strlen will dominate.
    The LLM will tell you that your code looks like an antipattern.  But did you actually want to optimise for those very long strings?  Most of the data I've seen says that strings passed to standard-library string functions tend to be between 0 bytes and 1 KiB.  0 bytes is much more common than I'd expect, things above about 128 bytes are increasingly infrequent.  So what should you be optimising for?  The LLM advice that I've seen for this kind of thing will let you avoid a pathological case at the expense of making the common case slower.  Is that the tradeoff that you wanted to make?
