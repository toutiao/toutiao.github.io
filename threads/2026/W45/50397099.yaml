  author: crote
  text: Sorry, but <i>thousands</i> of pushes per second, per repository?! In what
    world could that <i>possibly</i> seem like a sound idea?<p>Sure, it&#x27;s nice
    that you can technically handle it, but to me it sounds like at that point something
    has gone absolutely horribly wrong in the way you set up your agents. Last time
    I checked, GitHub was intended as a platform to upstream <i>finished work items</i>,
    not a realtime cross-agent chat channel.<p>Handling thousands of git pushes per
    second implies thousands of issues, thousands of PRs, tens of thousands of comments,
    thousands of Actions runs, and dozens of releases. How&#x27;s <i>that</i> part
    of their infra going to scale?<p>How about introducing rate limits instead, nudging
    people to <i>not</i> have agents push every individual single-line changes to
    GH, but instead have them collaborate as a local cluster and only upstreaming
    PR-sized chunks of finished work?<p>If you <i>still</i> need thousands of pushes
    per second you&#x27;d be looking at millions of lines of code, and at that point
    you&#x27;re looking at an insane monorepo which is growing at a rate of <i>terabytes
    per day</i>, and which basically instantly becomes unusable due to being impossible
    to clone or check out.
  score: 0
