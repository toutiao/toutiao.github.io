  author: bob1029
  text: I think perforce might be the better VCS if you intend to have a bunch of
    autonomous agents attempt to collaborate over one big pile.<p>Multiple terabytes
    is no problem out of the box. You get exclusive locking of files. You can easily
    take partial checkouts of the monolith. Centralization is a <i>feature</i> in
    this particular context. Git works great if the need for coordination is moderate.
    If you&#x27;ve got thousands of automated developers with their hands in the cookie
    jar, exclusive locks start to look really compelling. Perforce sucks with a highly
    distributed team, but in the case of an AI agent swarm we presumably have the
    ability to instantly nuke an agent&#x27;s checkout if needed. I don&#x27;t have
    to contact the agent and wait for them to get out of bed.
