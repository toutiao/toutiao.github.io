    infra going to scale?<p>For each issue my agent might raise 5 independent PRs
    as experiments.<p>Further, the more changes there are, the more important it is
    that they don&#x27;t conflict, which means smaller changes, which means even more
    changes.<p>Bots interleaving typos, single line whitespace fixes, single dependency
    bumps, etc.
