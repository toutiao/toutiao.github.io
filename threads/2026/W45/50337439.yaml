    the 5-year-old company prepares to kick off its roadshow, it will have to reckon
    with growing [market jitters](https://www.cnbc.com/2026/10/31/anthropic-ipo-ai-spending.html)
    around the AI buildout. Wall Street has been worried that rising interest rates
    will make debt unaffordable for many data center developers and [neoclouds](https://www.cnbc.com/2026/10/28/neocloud-stocks-drop-after-microsoft-revises-capex-down.html),
    and quarterly reports from [Microsoft](/quotes/MSFT/), [Alphabet](/quotes/GOOGL/)
    and [Amazon](/quotes/AMZN/) last week [added fuel](https://www.cnbc.com/2026/10/29/microsoft-google-ai-capex-estimates.html?&qsearchterm=jordan%20novet)
    to those concerns.\n\nThe hyperscalers' aggressive AI spending is [eating into
    their cash flows](https://www.cnbc.com/2026/10/31/anthropic-ipo-ai-spending.html),
    causing some investors to worry that computing capacity may not come online quickly
    enough to meet Anthropic's demands. Anthropic gets much of its capacity from Amazon,
    Google and [SpaceX](https://www.cnbc.com/quotes/SPCX/), but it also relies on
    neoclouds for some compute as it races to expand as quickly as possible.\n\nIn
    the amended S-1, Anthropic said it has entered into purchase commitments and lease
    agreements with an aggregate committed spend of about $895.4 billion, \"substantially
    all of which is related to compute and infrastructure.\"\n\nAnthropic said its
    compute and infrastructure expenses increased by $14.4 billion for the nine months
    ended Sept. 30, up 329% compared with the same period last year.\n\n\"As our compute
    and infrastructure capacity grows, the associated compute and infrastructure expenses
    have increased,\" Anthropic said in the filing.\n\nThe company's CEO, Dario Amodei,
    co-founded Anthropic alongside a handful of other researchers who defected from
    [OpenAI](/quotes/OPENAI.FG/), now its chief rival.&nbsp;OpenAI [confidentially
    filed](https://www.cnbc.com/2026/06/08/openai-confidentially-files-for-ipo-prepping-wall-street-for-ai-debut.html)
    its prospectus with the SEC in June, but its executives have signaled that it's
    aiming for a [2027 debut](https://www.cnbc.com/2026/08/19/open-ai-ipo-timing-2027-friar.html).\n\nAnthropic
    has worked to position itself as more safety-conscious than its competitors, and
    its S-1 includes more than [90 pages of risk factors](https://www.cnbc.com/2026/10/27/anthropic-five-surprising-risks-s1.html).
    The company highlights risks, including potential political headwinds, its complex
    infrastructure needs as well as the difficulties that can come from balancing
    safety and commercial objectives.\n\n\"We consider it our personal responsibility
    to help the world understand these risks, to prevent or mitigate them when they
