  url: https://www.cnbc.com/2026/11/02/anthropic-ant-s-1-quarter-financials.html
  title: Anthropic releases amended IPO prospectus with Q3 financials
  fetch_status: success
  content: "Key Points\n\n- Anthropic reported updated financials as part of an amended
