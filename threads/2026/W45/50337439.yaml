    now\n\nVIDEO4:2604:26\n\nAnthropic releases amended IPO prospectus with third-quarter
    financials\n\n[Squawk on the Street](https://www.cnbc.com/squawk-on-the-street/)\n\n[Anthropic](/quotes/ANTHR.FG/)
    reported updated financials as part of an [amended Form S-1 filing](https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm)
    with the Securities and Exchange Commission on Monday, giving investors a more
    comprehensive look into the state of its business.&nbsp;\n\nThe [artificial intelligence](https://www.cnbc.com/ai-artificial-intelligence/)
    company said it generated $33.24 billion in revenue for the nine months ended
    Sept. 30, up roughly 1,200% from the same period last year. It reported a $104
    billion net loss during the period, though most of that was due to the change
    in fair value of convertible notes and derivative liabilities. Anthropic had a
    loss of $25.1 billion over the same stretch in 2025.\n\nAnthropic unveiled its
    [highly anticipated prospectus](https://www.cnbc.com/2026/10/31/anthropic-ipo-ai-spending.html)
    last week, bringing the company one step closer to a [potentially historic initial
    public offering](https://www.cnbc.com/2026/10/26/anthropic-ipo-founder-voting-control.html).
    The initial filing only included the Claude maker's financials through the first
    half of the year.\n\nDuring its third quarter, Anthropic generated roughly $17
    billion in revenue, up about 1,127% from the same period last year. Revenue growth
    slowed on a quarter-to-quarter basis, however. Third-quarter revenue increased
    around 47%, a steep drop from 144% growth in Q2 and 132% in Q1.\n\nThe company
    reported a net loss of $23.29 billion during its third quarter.\n\n## Read more
    CNBC Anthropic news\n\n- [Anthropic's path to the Nasdaq just got a lot bumpier](https://www.cnbc.com/2026/10/31/anthropic-ipo-ai-spending.html)\n-
