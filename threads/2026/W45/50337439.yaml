  author: skybrian
  text: 'It&#x27;s a good question: why are the GAAP rules what they are? It needs
    to be investigated, though.<p>The reason it happens in multiple quarters is likely
    that Anthropic&#x27;s valuation has increased in multiple quarters. Every time
    Anthropic&#x27;s valuation increases, the convertible bonds are worth more money.
    Other shareholders have &quot;lost&quot; money compared to what would have happened
    if Anthropic had sold regular bonds instead of convertible bonds. Except that
    no, the value of their shares is increasing too. An increased valuation is actually
    good for them.<p>That&#x27;s how equity works. If someone owns 1% of a company
    and its valuation doubles, their share is worth twice as much and so is yours
    and we wouldn&#x27;t even normally consider it to be diluting the other shareholders.<p>So
    the question is whether convertible bonds are worth more than regular bonds and
    the answer is, yes, absolutely, but they are partially equity, and it&#x27;s the
    equity part that&#x27;s increasing when the company&#x27;s valuation is increasing.<p>And
    if the company&#x27;s valuation went down then the value of the equity part of
    the convertible bonds would decrease. Maybe that would be a profit by GAAP rules?'
