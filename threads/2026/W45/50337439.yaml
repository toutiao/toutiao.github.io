  author: SpicyLemonZest
  text: Sometimes accounting is weird because it&#x27;s necessary to prevent tricks.
    Why do all your held-to-maturity bonds become &quot;tainted&quot; and get revalued
    at market prices when you sell a couple, even though nothing has changed about
    them? Because any other rule would let a company which cannot in fact hold bonds
    to maturity get up to tricks and systematically overstate their assets.<p>So while
    yes, this does look a lot like shareholder dilution, that doesn&#x27;t really
    satisfy the question of why it&#x27;s not treated that way under GAAP. Perhaps
    GAAP is just wrong, or perhaps there&#x27;s some possible tricks which Anthropic
    is provably not engaging in. What it&#x27;s definitely not is a one-time adjustment
    now that it&#x27;s happened in two consecutive quarters.
