  author: vintermann
  text: My sister went to high school in the US for a year some time in the early
    nineties - we are Norwegian. She got perfect grades and some kind of award for
    American history. She explained it by saying, US textbooks <i>wanted</i> you to
    succeed. Whereas she was used to the Norwegian ones which were only out to rank
    you (on a bell curve - the grading guidelines didn&#x27;t have set requirement,
    but instead told teachers to only give 5% the top grade), and if that meant being
    obtuse and reader-hostile, that was fine. If you were a really dedicated student
    you&#x27;d push through, right? So she thought it was ridiculously easy, but she
    didn&#x27;t necessarily <i>learn</i> less.<p>I can&#x27;t speak for the US textbooks
    at that level, but I can confirm that the Norwegian ones were pretty lousy, especially
    in history. I particularly remember they loved to hide crucial details in margin
    notes or image texts.
