  author: mncharity
  text: "&gt; US textbooks <i>wanted</i> you to succeed. Whereas [...] Norwegian ones
    were pretty lousy, especially in history. I particularly remember they loved to
    hide crucial details in margin notes or image texts.<p>Some years ago, at a first-tier
    US university, with students tending wealthy, it was suggested that they had long
    had such <i>excellent</i> teachers, well-resourced and supportive, explaining
    things so organized and clearly... that the incoming students now lacked both
    the skills and inclination, to wrestle with a body of knowledge and extract their
    own understanding.<p>As we work towards AI for excellent teaching, perhaps we
    should think of that as an incomplete goal."
