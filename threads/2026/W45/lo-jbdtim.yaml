    We use to be able to look at a certain level of quality of grammar and punctuation as a proxy for "this probably had enough effort put into it to be worth my time," and I get wanting that back. I don't think it's been a great heuristic for years, though. Think of how much useful information is in a poorly formatted forum post and how little is in a glossy, well edited corporate white paper. LLMs have made the latter widely accessible.
    I'd be more interested in an LLM tool that tries estimate how useful the content is. As a starting point: how concrete and widespread its jargon is, does it have concrete problem statements, does it provide advice or solutions in a form that bounds when they are useful and what you can reasonably expect from them.
