    I am not automatically bothered if an LLM was part of the writing process of a document I am reading. I understand that some people are, but, to me, the really upsetting thing is the flood of low-effort, uninteresting spam that we have had to endure since people started using LLMs to write. Putting a number on the amount of LLM use on an article does not resolve this issue.
    I am not exactly sure why there are so many LLM spam articles. Personally, I do involve LLMs in my writing process, albeit only sparsely to correct grammar, say, or to help me phrase a section I am struggling with. When I write something it's because I want to communicate my thoughts or my work, so, fundamentally, I do not understand why people publish slop articles.
    This makes me think that the slop articles we are all bothered by are just written in bad faith; to gain visibility, out of vanity, or as an advertisement. This has existed before AI, too, but I guess it wasn't such a problem because people actually had to spend time to write. To me, the problem is the bad faith part, not the LLM part. Checking the amount of LLM use is a bad proxy for detecting bad faith.
    I really don't know how to deal with this situation, though. To be honest, there existed plenty of articles in the era before LLMs whose style of writing and presentation I found insufferable. Take for instance the recent sshole page (https://sshhole.com/). All of it reads like this:

    so musl (the libc under alpine) goes ok fine, crypt() just won't return NULL anymore. if it fails, it returns a single character instead. that character can never match a real password, so programs don't crash, they just see a wrong password
    now guess which character they picked for that
    "*"
    yep. the star. again.

    This style of writing was a thing long before LLMs. It also seems like the content on the sshole page was written by a person. Still, I would appreciate it if things like this were not on here.
    I am bringing up this example, because this style of writing makes me feel disrespected, just like LLM slop articles do. I would like to see a taste filter or a care filter, but I have no idea how to implement such a thing. Link aggregators like Hacker News and Lobste.rs served this purpose for me in the past, but it's not working as well anymore. Maybe the reason is not actually that people can now use LLMs to write, but, rather, that people have discovered these link aggregators as a great way to boost their profile in an incredibly competitive job market. Or something along those lines.
