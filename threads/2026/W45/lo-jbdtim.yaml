    I get that it's coming from a place of good intent and care, but I don't like this idea one bit.
    The negative repercussions of witch-hunting people[0] with fallible tools would, in my opinion, severely outweigh any positive impact it might have. While we might be able to filter out some slop articles quicker, in return we'd pay dearly for any false positive and negatives.
    If you're an author who strongly objects to LLMs and would never use one for your posts, yet the machine thinks your article is generated, that brands on you a mark of shame you really don't deserve. If you're an author, who uses LLMs and it somehow flies under the radar, that means your readers have a false impression of what they are reading. Not to mention, the community would actually need to pay in cash too for all this as well...
    I think the current flagging works fine (even if, at least to me it seems, people occasionally apply them a little overzealously, but that's a different topic).
    [0]: I know that's not your goal, but if it walks like a duck and talks like a duck...
