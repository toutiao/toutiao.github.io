    I've seen multiple accounts of "AI writing detectors" (including humans that can "always tell") just encoding biases:

    https://marcusolang.substack.com/p/im-kenyan-i-dont-write-like-chatgpt
    https://kathleenschmidt.substack.com/p/exclusive-author-jerry-falade-reflects

    From Jerry Falade's article, I found this persuasive:

    The process will be absurd: I pay an AI detector $20 to confirm that I wrote the book I spent several months, perhaps years, writing. It gives me a 95% AI score. I spend months rewriting the book, killing my voice in the process. Then I pay again, and hope the machine is in a better mood. The future is looking bright for writers.

    Not only would this mean authors must pay a "Pangram tax" to ensure they aren't falsely accused, but critically I have to imagine people with more money than talent will just game the checkers anyway.
