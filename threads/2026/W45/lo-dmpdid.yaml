    Key quote for some of the problems they were encountering:

    “Just specify the column names!” you might say, and I agree. If only it were that easy to modify ORM-generated queries and five years of accumulated hand-written ones.

    This is a pretty good argument for having and using a (decent) ORM. A large fraction of the post could be solved by a decent ORM that doesn't do SELECT *, and/or provides a mechanism to control which columns are loaded e.g. defer in Django. You can put the defer() call on the model's base manager and have it applied by default.
    It could also be solved by some mechanism to analyse and clean up hand-written queries to remove the SELECT *. I guess I assumed that people who write a lot of queries by hand would have tools for this, but maybe they don't exist.
    A lot of people write SELECT *  in the first place because writing out all the columns is a pain, which is also what ORMs (decent ones) solve.
