    Yeah I wondered the same when reading it. I gathered that problems arise when there isn’t a clear idea in the schema or the queries of when the large TOASTy columns are needed, so they get pulled in unnecessarily. If the TOASTy column is moved to a separate table, such that queries must do a join to touch the TOAST, then it’s less likely for a query to accidentally pull in large amounts of wasted data. (Heh, I guess an ORM could easily undermine this trick.)
    In the past I was planning a schema design in which I made a mistake very similar to this; sadly it never got to production so I didn’t get the opportunity to learn from my own fuckup, but it’s good to belatedly learn from someone else’s experience.
