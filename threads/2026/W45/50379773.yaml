  author: wat10000
  text: Most satellites in low orbit are Starlink, and most Starlink satellites are
    at either 43° or 53° inclinations, so it&#x27;s probably those. These inclinations
    cover most of the population in the most efficient manner. Low inclinations don&#x27;t
    cover people at higher latitudes. (Inclination is equal to the highest latitude
    that the satellite will reach, and then coverage extends a little further since
    they have some slant range.) Higher inclinations waste more time over unpopulated
    regions.
