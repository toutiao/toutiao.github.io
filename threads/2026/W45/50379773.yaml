  author: happytoexplain
  text: 'People on HN who are &quot;upset&quot;, or believe (correctly, of course)
    that night sky observation&#x2F;recording&#x2F;appreciation is increasingly impeded
    over time, do not feel that way <i>because of this image</i>.<p>Yes, terrestrial
    light pollution has been the number one problem since we invented electric lights,
    but satellites and terrestrial light pollution are both separate problems with
    different effects and different coverage. E.g. even though light pollution is
    much more harmful, you <i>can</i> escape it with a short drive, even if you live
    in a densely populated region. You can&#x27;t escape the strings of satellites.<p>Separately:
    &quot;Shortly after sunset&quot; is a downplay. It can be hours. But in any case,
    it&#x27;s the time when the vast majority of stargazers are looking at the stars
    (with their eyes).<p>Satellites have the same awkward sociopolitical energy infecting
    them as all tech does nowadays. But remember: There is absolutely nothing wrong
    with being upset about the effect of these satellites, just like there is absolutely
    nothing wrong with being upset about the effect of electric lights. You can certainly
    get a lot of mileage out of weighing this against the consequences of having much
    fewer satellites, and that&#x27;s exactly where all the argument should be occupied.
    That they affect the night sky, which reasonably annoys many people, is just a
    fact.'
