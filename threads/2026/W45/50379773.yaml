  author: StellarScience
  text: Yes, this image is hand-crafted art that looks cool, but in fact both approaches
    can and have have been automated!<p>- Astronomers have automated software that
    anticipates each streak based on the space object catalog and automatically removes
    satellites from long-exposure wide field-of-view images.<p>- Those whose job is
    to track satellites and update the space object catalog have software that anticipates
    each star location based on star catalogs, and automatically removes stars so
    they can see where the satellites are.
