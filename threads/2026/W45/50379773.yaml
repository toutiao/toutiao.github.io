  author: bradgessler
  text: 'A few things:<p>Satellites are only visible shortly after sunset and before
    sunrise, known as astronomical twilight.<p>If the images in the photograph upset
    you and you think our night sky is ruined, the thing that kills it the most is
    light pollution. Flood lights, parking lights, and street lights that don’t direct
    light down to the ground make viewing much worse than satellites for everybody.<p>It’s
    just as easy to capture incredible images of the night sky, even during astronomical
    twilight, with image processing. Here’s photos I’ve captured in my driveway in
    the SF Bay Area: <a href="https:&#x2F;&#x2F;bradgessler.github.io&#x2F;observatory-blog&#x2F;observations&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;bradgessler.github.io&#x2F;observatory-blog&#x2F;observations&#x2F;</a><p>I
    captured said images with an Elixir software stack I installed on a Pi and hooked
    up to my telescope. It’s open-source at <a href="https:&#x2F;&#x2F;github.com&#x2F;bradgessler&#x2F;observatory"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;bradgessler&#x2F;observatory</a>
    for those who are interested. I hook Claude up to it and it runs observations
    for the night, processes images with deterministic tools, and publishes them as
    the night progresses.'
