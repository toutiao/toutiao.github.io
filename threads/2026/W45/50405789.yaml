  text: "&quot;Teaming&quot; (social) organisms are also fun, sure.  ;)<p>The Fermi
    paradox assumes we&#x27;d be good at observing aliens, and that aliens will leave
    evidence that&#x27;s conspicuous to us. These two statements are roughly equivalent,
