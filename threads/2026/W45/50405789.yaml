  text: 'One thing about panspermia math: why assume <i>current</i> travel conditions
    between the stars?<p>Today the Sun is very far from other stars, but early in
    star formation (within nebula) the stars are<p>1. <i>much</i> closer together<p>2.
    have a higher rate of material ejection (mass exchange)<p>3. likely have more
    benign radiation environments unless near a star, due to GCR shielding by nebula
    gas<p>4. likely have higher equilibrium temperature in interstellar&#x2F;interplanetary
    space<p>Combined, these factors yield orders of magnitude improvement in panspermia
    efficiency vs the Sun.'
