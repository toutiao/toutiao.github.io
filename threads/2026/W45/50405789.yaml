    just so different for interstellar travel too. Many civilizations, seeded from
    common dirty chemistry, then permanently separated by vast distance as the star
    migrates out of the nebula.<p>TL;DR nebula parameter differences solve Fermi even
    in a teeming universe, but I doubt we&#x27;d see the aliens even if they were
    here. ;)"
