  author: deadbabe
  text: 'I really hate these articles that come out with these deep philosophical
    questions and then you open it up and it’s something stupid about microbes in
    a meteor or whatever. I was expecting a much more relatable read.<p>To answer
    the question, you should really not “wait” for anything in life anymore past 30.
    At some point between 35-45 you will likely cross the halfway point of your life
    and will begin the journey of being on your way out. Life has a cadence, and it’s
    not fun to be past that point still “waiting” for things you thought you’d have.<p>Obviously
    this advice will hit differently for people past a certain age, I’m mostly talking
    to people in their 20s. They can be saved, but others it may be too late.<p>You
    must actualize the person you want to be as early as you can, so you can maximize
    your time in life <i>being</i> that person. That’s when you will have “arrived”
    to your life, and can focus on just living instead of constantly chasing who you
    want to be. If you don’t, you might never get there, and then in the end if you
    think too much you’ll realize your life will have been a waste. That is a private
    hell.<p>At some point, if you wait too long, there may no longer be enough time
    or resources to actually live the life destined for you, and then it’s all over.
    Your chance at life expires: dreams unfinished, like cutting off in the middle
    of sente'
