  author: Taek
  text: It depends on how much inelastic demand there is. For example:<p>Let&#x27;s
    say there are 10 companies that need 1 GB of RAM each in a life-or-death scenario.
    They would be willing to pay $100,000,000 per GB to get 1 GB of RAM.<p>At the
    same time, there are 90 more companies that need 1 GB of RAM each to make certain
    quarterly targets. They are willing to pay $10,000 per GB to get 1 GB of RAM.<p>If
    you make 9 GB of RAM, you can sell it for $900,000,000. If you make 99 GB of RAM,
    you can only sell it for $990,000, because the 10 life-or-death companies only
    need to bid high enough to push out a quarterly-target company.<p>It&#x27;s a
    bit of a contrived example, but it shows you how restricting supply can boost
    total revenue if there is a segment of the market that has inelastic demand. (this
    is why medicine pricing has to be regulated - in the medical industry, there are
    lots of inelastic demand scenarios that can lead to predatory pricing)
  score: 0
