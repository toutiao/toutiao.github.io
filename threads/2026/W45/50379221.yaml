  text: Hey! Not sure who downvoted you.<p>Workflow definitions looks similar to Temporal,
    by design. They want you to program in your native code and separate actions at
    boundaries - as do we. A few fundamental differences -<p>1. Temporal gets its
    durable execution properties by booting up a full interpreter (Python&#x2F;JS&#x2F;etc)
    just to replay the previous state of your workflow. This requires your full logic
    to be deterministic because it&#x27;s actually re-serializing variables from the
    cached state of the action outputs.<p>Waymark by contrast does everything by compiling
    your run definitions. This allows your logic to be nondeterministic as long as
    it implements the supported control flow. This compiled representation is also
    executed in our Rust VM core, so it&#x27;s easily parallelizable to your whole
    machine.<p>As an aside - the Temporal maintainers also have to re-implement async
    handling in each of their supported languages. They have a rust core iirc but
    because they actually hook into the native language, they need to implement their
    own async abstraction. There are a lot of footguns with these implementations
    that they need careful handling to avoid. Since we share the same workflow VM
    runner against all languages we anticipate being able to add language support
    and keep it maintained much easier.<p>2. Due to this compilation, it&#x27;s easier
    to catch errors locally and in CI before it reaches production. There&#x27;s no
    notion of &#x27;workflow changed&#x27; &#x2F; incompatibility errors with future
    waymark workflows.<p>3. We have a simpler hosting paradigm. Instead of needing
    a full broker that you need to scale separately, we use Postgres as the only external
    service required. You can leverage your existing database expertise instead of
    needing to move all the knobs and dials of Temporal&#x2F;RabbitMQ&#x2F;etc.
