  author: msteffen
  text: 'I guess I could add:<p>With Pachyderm, part of our model was that the &quot;actions&quot;
    were arbitrary, user-provided containers[^1], and the inputs&#x2F;outputs were
    mounted filesystems (`&#x2F;pfs&#x2F;my_first_input` was a directory containing
    the first input dataset, or one shard of it, etc, and `&#x2F;pfs&#x2F;out` was
    a writeable directory where the output for that shard would go[^2]). We built
    the (versioned) filesystem that data in &#x2F;pfs came from&#x2F;went to, but
    you could probably use ceph or something if you&#x27;re not trying to do versioning.
    That&#x27;s how we dealt with big inputs&#x2F;outputs.<p>We never tried to optimize
    the single-machine case, for better or worse.<p>[^1]: Using arbitrary containers
    was a good choice for us, though, because we were marketing to spark users and
    a lot of them were frustrated with how hard worker-dependency management is in
    spark. So we got to say &quot;put perl, weird sequence analysis libraries, whatever
    you want, in a container, and if it can read and write files, we&#x27;ll mapreduce
    it over your data&quot;.<p>[^2]: `&#x2F;pfs` was a terrible choice because it&#x27;s
    nonstandard. Really wish we&#x27;d used `&#x2F;mnt` or `&#x2F;mnt&#x2F;pfs` instead)'
