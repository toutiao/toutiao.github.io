  author: MOZGIII
  text: To add to the above - with Waymark, the durability of highly concurrent workflows
    specifically is where we shine - because under the hood we just have a state machine
    that we durable persist when it emits side-effects.<p>What this means is when
    you have an async fn that you spawn in a loop where each iteration also spawns
    a ton of async fns which in turn call actions - there&#x27;s no separate bookkeeping
    to do parallel to the execution itself. No replays (unlike other tools like Temporal),
    meaning the thing just goes, as-is, and when it crashes it can load the state
    and resume from where it left off - without the need to match the state of the
    interpreter to the persisted state of execution graph. We just store the real,
    actual runtime state.
