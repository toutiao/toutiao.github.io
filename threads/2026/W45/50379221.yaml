  author: msteffen
  text: Well, it was just that the models didn&#x27;t really line up.<p>To give a
    somewhat longer description of what Pachyderm does&#x2F;did:<p>1. Connect data-scale
    version control with pipeline orchestrator.<p>2. Version control tells orchestrator
    which shards have changed since the last run and which ones haven&#x27;t.<p>3.
    Orchestrator only processes changed shards from one run to the next, instead of
    all of them.<p>4. Profit.<p>That&#x27;s fine for e.g. one mapreduce, but,<p>1.
    If an action&#x27;s behavior changes, you can&#x27;t re-use its prior results
    (usually—sometimes you&#x27;re just adding print statements to debug a failing
    shard)<p>2. If the overall pipeline changes, you can&#x27;t re-use results from
    the first change onward<p>3. Figuring out if the overall pipeline changed is not
    necessarily easy, and if you&#x27;re always throwing out everything just in case,
    your product is not helping people.<p>So, the way Waymark uses a compiler for
    the orchestration layer would&#x27;ve worked <i>so well</i> with our model.<p>It&#x27;s
    also just satisfying—once I learned in detail how Bazel&#x2F;Nix work, I see a
    fit for that architecture pattern in anything remotely pipeline-y, and it drove
    me nuts that Airflow&#x2F;Beam&#x2F;Dataflow weren&#x27;t really using it. So
    I&#x27;m very happy to see this for that reason as well. And, as if that weren&#x27;t
    enough, it&#x27;s so cool that it introduces a pure language at the coordination
    layer (which this type of architecture basically needs, hence the Nix language&#x2F;Starlark)
    <i>without actually requiring a new language, or even a new file</i>. Amazing!
