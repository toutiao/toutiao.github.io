  author: MOZGIII
  text: Well, this is something we&#x27;ve been, kind of, getting ready to tackle
    with some of the aspects of the internal design of the VM. In short, it would
    be pretty easy for us to just add an &quot;instruction (sub)set&quot; to work
    with GPU kernels or pytorch or etc - and then to implement it via whatever means
    fir best (a third-party crate, a GPU offload via vulkan or sth, heck - even spawning
    a python interpreter to handle some big operation where the overhead of python
    bringup is negligible in on the table).<p>The main issue so far is that our VM
    that does the workflow orchestration and the actions runtime are living in separate
    processes - but we even then, we could do tricks to share memory between them
    for more efficient &#x2F; zero-copy data passing... That&#x27;s not something
    we have right now though.
