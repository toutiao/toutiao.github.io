  author: MOZGIII
  text: 'Oh, I get it. Let me give a simple example that hopefully explains waymark.
    Can&#x27;t guarantee it&#x27;d be helpful to you, but beyond the website (we got
    nice animations and explainers there, you should check it out if you haven&#x27;t)
    this might be helpful cause it comes from a well-known architectural problem.<p>Consider
    a microservices architecture (for the sake of example), where a user sign up needs
    to create an account in three services: auth-svc, avatars-svc and emails-svc.<p>Your
    options to do it are either an event-sourcing architecture where your services
    have to orchestrate together via somewhat-awkward message-passing, or write another
    reconciling service where you write the logic more-or-less directly, but with
    a ton of code-overhead to make the execution reliable.<p>Waymark would help with
    the second approach, because it soaks in all the durable execution complexity,
    and gives you a way to <i>just</i> write the logic code and handle the edge cases
    - with a fraction of the code and systems you&#x27;d need otherwise.<p>I&#x27;d
    even dare to say - a tool like waymark, the second approach is pretty much impractical
    altogether, hence why the event sourcing microserivce architectures dominate today.<p>But,
    yet again, that&#x27;s just one example of where waymark would be useful. If you
    can write the code where you can split the orchestration logic from the execution
    of the individual side effects - then with waymark your orchestration code can
    be just the logic you need, without the extra steps to persist the progress -
    thus making it easier to reason and mental model simpler.'
