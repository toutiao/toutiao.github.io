  author: JdeBP
  text: The PET lives on in odd ways.  I use the PET font, long since hoisted out
    of the ROMs by several people and via Unscii and Funscii, as the medium weight
    font for virtual terminals on my own Linux-based, NetBSD, and FreeBSD machines.<p>It
    pairs up nicely with the BBC Micro graphics font as the bold weight, as the PET
    characters have thinner (bitmap) &#x27;strokes&#x27; than the BBC ones.  Moreover,
    since they were originally 8×8 (although I have run them through an upscaler to
    get 16×16, and strictly the PET was 7×7) they work better with CJKV and &#x27;square&#x27;
    character cells than 9×16 PC fonts do.<p>* <a href="https:&#x2F;&#x2F;github.com&#x2F;jdebp&#x2F;unscii&#x2F;tree&#x2F;2.1.1f&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jdebp&#x2F;unscii&#x2F;tree&#x2F;2.1.1f&#x2F;</a><p>*
    <a href="https:&#x2F;&#x2F;github.com&#x2F;jdebp&#x2F;unscii&#x2F;blob&#x2F;2.1.1f&#x2F;src&#x2F;font-pet16.txt"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jdebp&#x2F;unscii&#x2F;blob&#x2F;2.1.1f&#x2F;src&#x2F;font-pet16.t...</a><p>I&#x27;ve
    also used Dragon (i.e. MC 6847T1) + Atari paired up for medium and bold, as there&#x27;s
    a similar different in &#x27;stroke&#x27; widths.  But the MC 6847T1 has a limited
    7-bit true 1963 ASCII repertoire.  The PETSCII fonts have all of the PET&#x27;s
    graphics characters as well, which of course are now mapped as of Unicode 13.
