  text: 'Let me try to steelman the parent&#x27;s argument.<p>There are a finite number
    of musicians in the world. Most of them are working on music that either 1) appeals
    to them, specifically, or 2) appeals to enough of an audience that they can eek
    out a living. And chances are, if you&#x27;re hearing it in public, you&#x27;re
    getting #2.<p>I want music that appeals to <i>me</i>. My tastes are broad but
    not infinite, and I&#x27;ve already thoroughly plumbed the depths of my favorite
    genres - many of which are largely ignored by modern musicians (see #2 above).
    AI offers a way of getting new music for neglected or underdeveloped genres. Spanish
    language 80s new wave combined with reggae? Why not?<p>I listen to a <i>lot</i>
    of music across many disparate genres. I even play music (for fun). I have also
    enjoyed some AI generated music. It&#x27;s not either&#x2F;or, I can listen to
    both.'
