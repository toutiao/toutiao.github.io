  title: How I use AI (Oct 2026) - Ben Stolovitz
  fetch_status: success
  content: "# How I use AI (Oct 2026)\n \n\nWow, things have changed.\n\n[Last October](/posts/how_use_ai_oct_2025),
    I took stock of how I was using AI — specifically the cool stuff like LLMs that
    we _call_ 'AI’. I’m so glad I did. Things are very, very different 12 months later.\n\n
    \n## [Background](#background)\n\nI still believe I use AI fairly typically, but
    I’ve had a notable change in background. Last October, I was an engineer on Microsoft’s
    Windows AI team. I am now a research engineer at Salesforce AI Research. I spend
    more time supporting scientists & building rapid prototypes, rather than working
    with a large team of engineers. I spend about ~$3,000/​month in tokens.\n\nIn
    any case, I mostly use AI in the same ways as last year:\n\n- Coding\n- Research
    & search\n- Summarization & transcription & (new) voice\n- Writing\n- Art & music
    & (new) video\n\nAlso new this year, I’ve drafted a personal **AI policy** ; we’ll
    start there.\n\nAs before, this remains purely my opinion & speculation. If you
    use AI differently, let me know!\n\n## [My AI policy](#my-ai-policy)\n\nThis year
    I began drafting a personal AI policy — as in, a document for how _I_ want to
    use AI in my life. I am very excited about it. I am also working on an explicit
    AI policy for this site (still thinkin’; probably based on [Hank Green’s policy](https://www.hankgreen.com/ai-policy/)),
    but a personal policy is to give me a framework for using these tools day-to-day.\n\nAI
    leaks into life. Teammates ask Claude to write their Slack messages, grandparents
    generate creepy memes of their grandchildren, and researchers delegate their thinking
    to machines. I’ve seen all of these things; even strong creators like [Hank Green](https://www.youtube.com/watch?v=ssE1rmt3EpE)
    and [BrainPOP](https://x.com/brainpop/status/2102857266584281519) get lost.\n\n![BrainPOP
    tweet with AI-generated poster and response 'oh that's... that's BrainPOP using
    AI'](/_astro/brainpop.DpRD3oS0_1VuPIN.webp)\n\n_BrainPOP using AI art, perhaps
    unknowingly_\n\nHumans clearly do not have norms for using these tools, and we’re
    messing up. I hope that a personal policy will ground me as AI becomes smarter.
    I hope to adapt that policy over time, and I’m eager to see how it evolves. I’m
    also open to draft 1 being utterly, hopelessly wrong.\n\nUltimately, I want to
    spend my life making cool things with other people. AI can help, AI can hurt.
    A policy helps me find the difference.\n\n## [Coding](#coding)\n\nWriting code
    is solved.\n\nLast year, I waxed poetic about how GitHub Copilot **autocomplete**
    transformed how I write code.\n\n![Autocomplete recommends several lines](/_astro/autocomplete-still-good.DvG72xfj_Z2tPw8d.webp)\n\n_Autocomplete
    is still good (the dim lines)_\n\nWell, uh, I no longer write much code. **Agentic
    coding** has made it obsolete.\n\nMy workday now means managing ~5–6 Claude Code
    (or OpenCode or Codex or Pi) agents. I’ll give Claude a feature to implement,
    or a bug to reproduce, or any other task I used to do by hand; each agent gets
    its own copy of the code (a Git worktree, if you’re technical), then just… gets
    to work. The agents write code, run tests, even create & review PRs.\n\n![Claude
    Code responds to 'can you add rnnoise to our audio pipeline in a worktree'](/_astro/busy-claude-code.BUuJVInW_Z22QHCN.webp)\n\n_Claude
    Code adds noise-reduction to (a worktree of) my Mumble client with one prompt_\n\nThey
    are nothing short of magic:\n\n- They _let me build fast_: agents will prototype
    any new feature in ~20 minutes. I truly cannot count the number of features, bugfixes,
    tests, and tools I’ve (AI’ve?) been able to build because of these agents. For
    example, AI let me test confusing audio code on [macOS](https://github.com/citelao/mac-native-echo-cancellation)
    _and_ [iOS](https://github.com/citelao/ios-native-echo-cancellation) in just a
    few minutes.\n\n- They _let me try crazy things_: human teams aim to [“fail fast”](https://en.wikipedia.org/wiki/Fail_fast_(business));
    agents can fail _ultra_-fast. I’m happy to test crazy new ideas and throw out
    what doesn’t work well. It was able to wire & test [a huge change to Mumble](https://github.com/mumble-voip/mumble/pull/7180)
    that added better noise cancelling; I use my beta build of it nearly every day.\n\n-
    They _remove drudgery_: I’ve had agents diagnose & fix urgent bugs with nothing
    more than a description and a “please fix!” while I continued working on other
    things.\n\n- They let me _be kinder_: since agents write everything, it is simple
    to propose sweeping changes to my teammates during code review, or even write
    my own versions — both things unthinkable in the era of hand-written code.\n\nI
    do not believe _engineering_ is solved: left to run on their own, agents will
    build poorly-functioning, over-architected, unreadable, self-congratulatory piles
    of slop. Every friend I’ve asked agrees that agents _still_ need human taste and
    experience to produce good work. Some of that is minutiae (like that annoying
    status dot Claude likes to throw onto sites), but most of it is critical. Agents
    tend to get lost on their own. My most successful work this year was hand-writing
    a tool, replacing ~4,000 lines of vibe-code with a few hundred. My system has
    proven more flexible, easier to test, and more generalizable than what it replaced.\n\nIt
    remains to be seen how long that human edge will last, though.\n\nI also now reckon
    with the _fatigue_ of using these agents. Managing 6 different conversations with
    6 different robots about 6 different features is overstimulating & exhausting
    in a way that coding never was. When I started using agents, I remember rushing
    to answer their questions like they were human colleagues waiting for help! While
    I have tempered that [anthropomorphic bias](https://en.wikipedia.org/wiki/Anthropomorphism#:~:text=people%20use%20their%20schemas%20about%20other%20humans%20as%20a%20basis%20for%20inferring%20the%20properties%20of%20non%2Dhuman%20entities%20in%20order%20to%20make%20efficient%20judgements%20about%20the%20environment%2C%20even%20if%20those%20inferences%20are%20not%20always%20accurate),
    it’s exhausting to juggle so many problems at once. The allure of sending just
    one more prompt before lunch… then dinner… oy. There is also, as I wrote in [Consider
    the chairmaker](/posts/consider-the-chairmaker), the decline of craft. My friend
    Peter laments ceding the joy of programming to machines: for many of us, honing
    the code, finding the right design, seeing the parts mesh together — that was
    the meditative purpose we found in our jobs. Now, we rarely write anything. We
    instead delegate it to agent number 7.\n\nBut let me return to the joy of working
    with agents: they are so fast, so open to feedback, and so intelligent. Working
    with them can be utterly delightful.\n\nFor example, while I was building a harness
    for voice agents, one programming agent decided (correctly) that my simple test
    harness was insufficient. So it used my Mac’s built-in text-to-speech to _directly
    test the voice agent it was building_. Then, newer agents started doing it, too.
    Either they had documented the technique, or they were each smart enough to independently
    discover it. Directly testing the product they were building. Absolutely brilliant.\n\nAgents
    frequently recommend knobs & settings that I’ll reject for being too complex and
    unnecessary — and, voilà, I’ll need the knob next week. Silly human!\n\nAnyway,
    because of agentic coding, **agentic pull requests** are increasingly the way
    I review agent code. “Make a draft PR,” I write, “I’ll review it soon!” And review
    it I do — agents still aren’t reliable enough to trust without validating, so
    I’ll still review their code & test it manually. However, I don’t do the “line-by-line”
    code reviews I used to do with humans. I focus instead on architecture, on larger
    patterns in the code. Are there systemic issues with an approach? Should I add
    new agent guidance to CLAUDE.md? Can I build better test harnesses, so the machines
    can test their own code?\n\nAgentic **code review** is surprisingly help"
