  author: epihelix
  text: "&gt; In Oct 2026, how many of us don&#x27;t know this already?<p>The comments
    to this article suggest that it&#x27;s still disputed.<p>Personally, I think it&#x27;s
    a bit of a silly phrase, because it implies an absolute, and all anyone needs
    to do to disprove it is to show that coding was <i>not</i> solved for problem
    X.  That&#x27;s still the case -- it&#x27;s just that the set of X is rapidly
    shrinking.<p>I think it&#x27;s more indicative to say how much you trust LLM code.
    \ A little over a year ago, I scrutinised every line carefully, and it was buggy
    as hell and I had to fix most generated code by hand.  Now, models write clean
    code with fewer bugs (far fewer) than I would.  A year ago, I was doing a lot
    of steering during planning; now, it&#x27;s rare that I don&#x27;t agree with
    the model&#x27;s first proposed solution, and even if I don&#x27;t, it&#x27;s
    most likely to fix a minor change in understanding, not to propose a substantial
    architectural change as it was before.<p>The one thing I&#x27;m not sure about
    is how much this is due to better prompting on my part.  I doubt that this contributes
    much, but I still suspect that continual usage does make you more aware of what
    works and what does not: how much detail to provide, how to describe a problem
    or change, how to propose solutions while still leaving other options open."
