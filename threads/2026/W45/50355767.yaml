  text: It contains plenty human expression. It&#x27;s ultimately made by people.<p>And
    I think it can be uniquely fun, because it allows for the very rare combination
    of truly off-beat ideas with excellent execution.<p>In real life, it very rarely
    happens that somebody will spend a lifetime learning, gather a band, and then
    record something extremely off-beat. Because there are risks to that. Destroying
    your image, having to find people that are on the same wavelength, having to justify
    the time and money it costs to record something weird and not marketable.<p>Sure,
    people make weird stuff once in a while, but very rarely, and generally it takes
    unique individuals that find some particular weird niche to work in, like Weird
    Al or Max Raabe. And even then they tend to pick something relatively tame and
    marketable and stick to that.<p>But AI can bypass all that, and that makes things
    interesting.
