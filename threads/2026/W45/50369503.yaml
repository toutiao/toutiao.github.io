article:
  url: https://www.conductor.build/announcement
  title: Conductor is joining Meta
  fetch_status: success
  content: "I have big news: Conductor is joining Meta.\n\nWe launched Conductor a
    lifetime ago, in the distant past of July 2025. Writing most of your code with
    agents (let alone a _team_ of coding agents) felt crazy back then. You trusted
    us to come along for the ride, and we cannot thank you enough!\n\nWe have some
