  author: AlienRobot
  text: The biggest issue with emoji is that it&#x27;s not an actual glyph. Just think
    about the gun emoji. It was supposed to be a gun. It changes from actual gun to
    toy gun to space gun depending on the platform and year.<p>Imagine if you wrote
    the word &quot;gun&quot; and then 5 tech giants decided it was their job to change
    the &quot;g&quot; to a &quot;b&quot;. It&#x27;s ridiculous how lightly we take
    preserving messages when the whole industry is supposed to be about data.<p>They
    are also not specific enough to encode what they are meant to convey. People pick
    emojis for what they look, and if they look even slightly different the message
    changes, yet platforms are allowed to design them however they want and then change
    the design year after year. The letter &quot;a&quot; is still going to be the
    letter &quot;a&quot; no matter what. The same can&#x27;t be said for &quot;emoji
    covering their own mouth&quot; which either looks shocked or mocking you depending
    on how it&#x27;s designed.
