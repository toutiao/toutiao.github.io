  text: "&gt; Take a sentence as volatile as &quot;I&#x27;m going to kill you.&quot;
    Standalone, I’m calling 9-1-1.<p>Had to do that once, pre-emoji. I have a domain
    in .com which is also a domain in .co.uk. That&#x27;s owned by one of the famous
    British &quot;public&quot; (i.e. private boarding) schools. I used to have a catchall
    email address for that domain, and once in a while I&#x27;d get student emails,
    which I&#x27;d return with a note about why the right TLD matters.<p>One day,
    I got a student-to-student email &quot;I am going to kill you tonight.&quot;\nNo
    indication of humor. \nThis was shortly after the Columbine massacre. I couldn&#x27;t
    ignore it.<p>I&#x27;m in California, and the message was from the UK, where it
    was late at night. I had some trouble getting the right phone number, but after
    a while I was on the phone with the very British headmistress of the school, who&#x27;d
    clearly been awakened for this.\nOnce I read her the message, she was thoroughly
    annoyed, but not at me.\nShe recognized the student&#x27;s name.  \nIt was made
    clear that someone was going to have a Very Bad Day. &quot;He&#x27;s only 12&quot;,
    she said.<p>If that message had come from a US school, there probably would have
    been a SWAT callout."
