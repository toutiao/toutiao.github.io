  author: ryandrake
  text: 'Maybe it&#x27;s just me, but I don&#x27;t want my computer suggesting <i>anything</i>
    to me unless I ask it for suggestions. A computer should be essentially a REPL.
    It waits for a command. The user inputs its command. The computer processes it.
    Then the computer loops back to wait. Now we have all sorts of nice GUIs and modes
    of interaction, but essentially the computer should behave that way: The user
    should tell it what to do, and it should only do what the user wants.<p>Any kind
    of &quot;proactive&quot; behavior on the part of the computer is unwelcome. If
    I don&#x27;t command it, I don&#x27;t expect my computer to do it. This includes
    ads but it also includes recommendations, and notifications, and &quot;you should
    do this!&quot; and &quot;try that app!&quot; and everything else modern computers
    are now throwing at us.<p>We need to get back to the user being in the driver&#x27;s
    seat.'
