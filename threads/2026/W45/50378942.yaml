  author: Anon1096
  text: No, the price that is charged in a specific impression is adjusted by the
    relevance to the user. If the user relevance is 0.001% a Ford ad would need to
    spend 100000x more dollars per impression than the same ad for Toyota with a user
    relevance of 100%. So in practice you might get some amounts of &quot;high cost
    lower relevance&quot; ads but not to the extent that people think. The advertising
    broker (as in Google for Google Search) has an active interest in showing good
    ads relevant ads for the user in order to not negatively impact Google Search
    metrics, and also maximize clickthroughs or other goal metrics for the advertiser.
    Poorly matched ads are antithetical to that purpose.<p>There is a big misconception
    that ads are just targeted as picking the max(advertiser spend) and it really
    fuels low quality discussion online.
