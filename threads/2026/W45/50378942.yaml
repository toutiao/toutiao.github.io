  author: khafra
  text: 'Since advertising spending is largely zero-sum, additional spending on advertising
    may shift market share, but it does so without delivering new factual utility
    or consumer surplus. The fact that there&#x27;s a pareto-superior equilibrium
    makes it a symmetric reciprocal externality: Robert H. Frank showed, in &quot;Positional
    Externalities Cause Large and Preventable Welfare Losses&quot; (2005) that positional
    arms races are shaped exactly like environmental pollution.<p>But, even if there&#x27;s
    a better equilibrium, isn&#x27;t loading a website crammed with obtrusive ads
    still a coasean bargain between two parties? Simon P. Anderson and Stephen Coate
    studied this question in &quot;Market Provision of Broadcasting: A Welfare Analysis&quot;
    (2005). They identified unpriced externalities like the common-pool attention
    tragedy, as has been raised in other comments here, and asymmetric information
    &amp; hold-up, which increase transaction costs.<p>Divide advertising spend into
    two components: Informative specs, and persuasive&#x2F;obtrusive spend. The margial
    external cost is the sum of profits foregone by rival businesses, and aggregate
    viewer nuisance. A pigouvian tax with an exemption threshold for factual spreadsheets
    and apunitive rate on expenditure above that (or visual intrusion metrics) both
    prices the cognitive nuisance imposed on readers, and collapses the positional
    arms race between rival firms; transforming the industry from a high-waste prisoner&#x27;s
    dilemma to a low-cost, high-information pareto optimum.<p>Obviously, you still
    have to watch out for firms goodharting the spreadsheet metric, but that&#x27;s
    both a partially solvable problem, and a much better situation than the current
    nash equilibrium.'
