    that adblocking&#x27;s primary argument is security.<p>Back in the bad old days
    of adobe and flash plugins in Internet explorer, malicious ads targetting those
    were the malware infection vector in something like 80% of cases. Browsers have
    gotten better, but it remains the case that ad networks are the single easiest
    way to inject your mal-content into another website.<p>In those days, any time
    I handled a client call about malware, I replaced everything with Chrome (built
    in pdf viewer, sandboxed&#x2F;autoupdated flash) and adblock plus. And then, my
    calls from those users stopped being about malware or slow internet.<p>We see
    headlines about this-- about the Israeli firm that was abusing this, for instance,
    to hit targets-- and I am left scratching my head. Of course...?<p>IMHO it&#x27;s
    the duty of any techie (with the social capital to influence digital hygiene)
    to ensure they and theirs are set up with at least ublock lite.
