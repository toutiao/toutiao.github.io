  author: smallmancontrov
  text: "&gt; What something&#x27;s worth is what somebody is willing to pay for it.<p>This
    is completely and definitionally true in the context of trading, but keep this
    definition on a leash because if you apply it outside a purely financial context
    it tends to smuggle wealth-weighted objectives into your thinking, and regardless
    of whether or not you think that&#x27;s moral you probably want to be aware of
    it. Example: feeding orphans is zero &quot;value&quot; because they can&#x27;t
    pay you but merging the banks into a mega-bank to raise fees and collect bailouts
    has extreme &quot;value&quot; because it can make a bunch of obscenely rich shareholders
    even more obscenely rich and they can carve you off a mighty slice.<p>Due to this
    mismatch I keep both definitions in my pocket: Wealth Weighted Value for finance,
    People Weighted Value for more colloquial settings or moral analysis. &quot;Exchange
    Value&quot; is a good quasi-synonym for WWV if you want something less confrontational."
  score: 0
