  author: smallmancontrov
  text: "&gt; if you tried to sell all Nvidia shares at once<p>That is something different:
    liquidation value. <i>Market cap</i> tells you the sum total of the numbers next
    to this ticker symbol in everyone&#x27;s brokerage account. It tells you the collective
    expectations about future returns and also the wealth effect that people feel
    based on their ability to individually obtain cash for shares.<p>It is true that
    neither of those things is liquidation value, but also liquidation value is neither
    of those things. If you expect a liquidation scenario, sure, use liquidation value.
    If you don&#x27;t expect a liquidation scenario but want to measure collective
    expectations of and confidence in a stock, use market cap."
  score: 0
