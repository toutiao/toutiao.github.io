  author: wat10000
  text: The point is that market cap doesn’t tell you what people are willing to pay
    for a company. When a stock price is $100, that means people are willing to pay
    $100 <i>for one share</i>. And then because big companies have a big market for
    their stocks, this can be extrapolated out to a few thousand or millions of shares
    without much loss of accuracy. But it falls apart when you go beyond a small fraction
    of outstanding shares. A $100 price may mean people are willing to pay $100 million
    for a million shares. But it probably doesn’t mean people are willing to pay $1
    trillion for ten billion shares. At some point the marginal willingness to pay
    will shift.<p>This becomes visible in buyouts where the cost of acquiring a company
    is significantly higher than the share price multiplied by number of outstanding
    shares.
  score: 0
