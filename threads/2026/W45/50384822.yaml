  author: danielmarkbruce
  text: Nobody said market cap is &gt; value. You seem to misinterpret basics. Buyouts
    happen at a premium because you can&#x27;t buy all the shares at last trade or
    current offer or anything of that nature. You can&#x27;t sell them all at last
    trade or current bid or anything of that nature either.<p>So, we are left with
    the last trade, or the mid point of the bid&#x2F;offer, as the best proxies. It
    is what it is.
