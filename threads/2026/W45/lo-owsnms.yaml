    POSIX doesn't normally allow routines to just invent new errors to be returned

    [citation needed].
    So sayeth POSIX:

    Implementations may support additional errors not included in this list, may generate errors included in this list under circumstances other than those described here, or may contain extensions or limitations that prevent some errors from occurring.
    […] Implementations shall not generate a different error number from one required by this volume of POSIX.1-2024 for an error condition described in this volume of POSIX.1-2024, but may generate additional errors unless explicitly disallowed for a particular function.

    — https://pubs.opengroup.org/onlinepubs/9799919799/functions/V2_chap02.html#tag_16_03
    Anyway, musl doesn't need to invent a new errno here, this is covered by EINVAL, which can be returned by any function defined by POSIX unless the definition explicitly states that it may not return other errors.
    (And this is exactly what OpenBSD does on invalid salts, btw.  See crypt.c and related files.)
