    Even without these obstacles it will take few years for the C working group to consider it, then a few more years before it lands in a C spec, then few more years before compilers ship it, then a few more years before distros switch to those compilers, then a few more years before notable C projects consider the syntax old enough to be acceptable to migrate to it. And even then, stdlib and POSIX probably won't ever change.
