    I wrote a summary of the things that led to this bug and one of the crucial issues that this article misses is standards conformance, and how standards can or don’t evolve to deal with new circumstances.
    In this case the problem is that the specification for crypt() doesn’t allow for error cases except for the complete absence of crypt() itself. In practice most code is written as if crypt(&str, &str) -> String (or perhaps more accurately with the moral equivalent of .unwrap()) which in the past was reasonable when the code only works on implementations that have crypt().
    So the question is then, how should crypt() evolve to support error cases that were not previously considered, such as malformed salt, salt that specifies an unsupported algorithm, unreasonably long passwords, etc. And there are two levels of answer to this question: at a small scale, what can or should the crypt() API look like, and at a larger scale, what are the standards and compatibility considerations for the various options.
    At the small scale, musl decided to return an in-band value that is poorly chosen because it conflicts with existing assumptions about what strings crypt() can return. (A better choice would have been “:” since that cannot appear inside a field in the password file, so it can never match an account that doesn’t allow password logins.) Other implemenentations have chosen to expand the vestigial NULL return so that it can be used for dynamic errors that did not previously exist.
    At the larger scale, the better choice depends on how the libc maintainers view their relationship with the programs that use libc and with POSIX. If you view the ecosystem as essentially fixed, too difficult to change, then musl’s in-band error is reasonable (except for the extremely dangerous choice of error value). On the other hand, if you think that the amount of effort needed to fix callers is small enough then it’s reasonable to improve the API.
    Then there’s the question of how to fix POSIX so that it doesn’t lead to poor choices like musl’s. And that depends on whether changes to POSIX should occur first in the spec or first in implementations (or perhaps in parallel). I tend to think that specs should not be treated as if they were handed down by god, and when (as in this case) there’s an obvious way to fix a bad API, implementations shouldn’t be scared to lead the effort to fix it by writing code that deviates from the spec, especially if that is likely to encourage the spec to be changed to match.
