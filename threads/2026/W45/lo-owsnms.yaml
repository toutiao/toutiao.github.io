  text: |-
    OpenSSH after determining that the account doesn't support password authentication and the request should fail, decides to call crypt with a different users salt to burn time. But then decides to act on the result on the call even though it already had determined that the login attempt should fail.

    I'm guessing that it was acting on the result to prevent an optimizing compiler from discarding the entire call to crypt() — compiler optimizations are known for breaking constant–time cryptography. In-band invalid result seems like a reasonable way to make sure that both paths have identical timings – they execute exactly the same code. As long as the invalid result is actually invalid, that is.
