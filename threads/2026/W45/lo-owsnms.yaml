    It doesn't have a type system able to express "this is a failure that the caller must handle".

    C23 has [[nodiscard]] functions, and there has been an equivalent feature for decades in GNU C.
    But in the case of crypt() the caller needs to use the return value to check the password, and if errors are represented by returning NULL in the idiomatic manner, then a caller will crash if it fails to handle the error.
    So this vulnerability would not have occurred if crypt() was written in idiomatic C.
    The vulnerability is caused in part because musl doesn’t return an error in the idiomatic way, but instead signals an error with a value that can match a disabled account (which should fail) in the same way that a successful return matches an account with the right password (which should succeed). (And in part because OpenSSH uses a dummy salt for checking disabled accounts.)
