    I think the problem is political and social:

    Microsoft thinks C is dead, so they won't add any such syntax to MSVC unless C++ also adopts it, but C++ won't adopt it because they have std::variant at home. Microsoft's veto has chilling effect on C standardization and adoption of features. Projects worrying about portability and back compat would end up wrapping it in macros, creating ugly syntax nobody likes.
