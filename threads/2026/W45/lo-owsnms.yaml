  text: |-
    As I understand it from fanf's summary, the error case has always been present, but originally it was only used if crypt wasn't available on a particular system. Based on current Rust API norms, I imagine that would probably have been written as Result<String, CryptError>, (or possibly a broader error type), with that error being non-exhaustive to allow for future possible error codes.
    All that said, I think this is a bit of a "if my grandmother had wheels, she'd be a bicycle" sort of discussion. A lot of Rust's design philosophies, and the tendencies in the Rust community, come from direct experience of the issues of C API design. There is no world where libc would have been designed then according to modern design sensibilities, and a lot of the constraints that were considered important then are no longer seen as important, while other issues (like designing APIs that can be evolved) were not as high a priority.
    I think the interesting observation here is how we can develop future APIs - and how important things like ADTs are for designing those APIs in such a way that the constraints and behaviours of the function are clear to callers of that function.
