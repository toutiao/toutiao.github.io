  text: |-
    For instance, a pool of interned null-terminated strings can be referenced using only 4 bytes each, as opposed to 16 bytes each for a pointer and length.

    If you can address terminated string using 4 byte indexes then you can do that with length-specified ones as well, and obviously if the entire buffer is accessible using 4 byte indexes you don't need more than that for the length. And if you have "a lot of references to short strings" then you would probably get away with 2 or even 1-byte lengths. And now you have an overhead of 5 bytes per, which is exactly what you have with terminated strings.
    And as a bonus the scheme now doesn't break when the strings are e.g. hashes which can contain nulls.
