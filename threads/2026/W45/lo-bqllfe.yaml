  text: |-
    The question is, is it a less-secure option? The NSA is recommending that the US government uses the non-hybrid scheme. There are three possibilities:

    They suspect China of having a quantum computer or the capability to build one soon and the hybrid schemes therefore add no security in their threat model but provide a greater attack surface.
    They know of some exploitable weakness in the hybrid modes and are happy if everyone else is vulnerable but, if someone else finds the same weakness, they don’t want their communications to be vulnerable. Recommending the non-hybrid schemes may even be a double bluff to try to make foreign governments that don’t trust the NSA use the hybrid schemes.
    They know of a weakness in the post-quantum algorithms that they think no one else in the world is smart enough to find, but that vulnerability doesn’t apply in the hybrid schemes and they’re gambling that making the US government not use the hybrid schemes will make other people trust them.

    Of these, my bet would be the first. This seems quite a plausible piece of threat modelling when your adversaries are all well-funded nation states that are willing to, for example, record 20 years of messages to and from embassies and hope that they can decrypt them later. The threat model for other people may be different. The last, which is the one the conspiracy theory depends on and it seems deeply implausible.
