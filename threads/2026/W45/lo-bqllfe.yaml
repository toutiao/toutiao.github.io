    Having read at least a few of Bernstein's posts on the subject of the TLS Working Group's proposed standardization, this article doesn't really assuage my concerns. I'm not a cryptographer, nor am I even that familiar with the subject matter, but i can definitely understand Bernstein's skepticism around the process, and the OP here doesn't do much to argue against many of Bernstein's points on the matter.
    Now don't get me wrong: he doesn't have evidence that something malicious is going on, and to my knowledge such evidence does not exist publicly. But absence of evidence does not imply absence of evidence, and it does seem weird for the NSA faction to be pushing for this as hard as they can; I think his skepticism towards the NSA here is not unreasonable.
    Since the OP didn't mention too much about the specifics of what Bernstein is opposed to, I'll quote him on the subject matter:

    It's normal for post-quantum cryptography to be rolled out as an extra layer of security on top of traditional pre-quantum cryptography, rather than as a replacement.
    For example, Google's CECPQ1 experiment was double encryption with traditional pre-quantum ECC (specifically X25519) and post-quantum NewHope1024. CECPQ2, a joint experiment between Google and Cloudflare, was ECC+NTRUHRSS701. CECPQ2b was ECC+SIKEp434. Ten SSH implementations support ECC+sntrup761. Today's usage of post-quantum cryptography by browsers is approaching half of the connections seen by Cloudflare, where 95% of that is ECC+MLKEM768 and 5% is ECC+Kyber768.
    If post-quantum cryptography is designed to be super-strong, so strong that it even survives future quantum computers, then why are we keeping the ECC layer? Same reason that you wear your seatbelt: in the real world, cars sometimes crash, and seatbelts reduce the damage.
    [...]
    The problem in a nutshell. Surveillance agency NSA and its partner GCHQ are trying to have standards-development organizations endorse weakening ECC+PQ down to just PQ [in the context of TLS].

    So even if the OP's alternate conspiracy theory is true (that the NSA has a quantum computer that can break currently available ECC encryption), that is not a good reason for them to be forcing exclusively PQ crypto. In the universe where practical quantum computers exist, ECC+PQ is exactly the same level of secure as just PQ (unless they also have some secret cryptanalysis that shows that combining a particular secure PQ encryption scheme with ECC makes it structurally weaker). Bernstein is not opposed to PQ crypto, nor even the particular scheme being chosen for standardization.
    Bernstein has argued, effectively in my eyes, that the TLS Working Group is eager to push through these changes despite concrete opposition, and is trying to change the rules of how these decisions are made. (He spells these points out better than I can; for more details, he has now written 9 blog posts on the topic.) His position is that if we read into the motivations of what is causing them to push this so hard, it implies that they think that PQ crypto (or perhaps this PQ crypto) is easier to break and also they don't have a quantum computer capable of breaking ECC. If they did have such a computer, from the SIGINT perspective, ECC+PQ is no more or less secure than just PQ, so why would they be pushing so hard to make sure that the standard is only ECC+PQ instead of just PQ?
