  content: "![Your Cryptography Conspiracy Theory is Wrong](https://i0.wp.com/soatok.blog/wp-content/uploads/2026/10/BlogHeader-2026-ConspiracyTheories-1.png?fit=1200%2C675&ssl=1)\n\nThis
    conversation plays out hundreds of times a day, but (thankfully) only a handful
    of those involve me:\n\n- Person: “I have [problem].”\n- Cryptography nerd: “Oh,
    you probably want to use [sensible recommendation].”\n- Person: “Ah, well, can
    I really trust that? The NSA probably backdoored it 30 years ago. Dual\\_EC, amirite?!”\n-
    Cryptography nerd: …\n- _Koblitz and Menezes, unheard: “[You fucking wot m8?](https://eprint.iacr.org/2015/1018)“_\n\nConspiracy
    theories about the NSA and/or NIST are a dime a dozen these days. And, ever since
    the Snowden disclosures in 2013, I am politically primed to _directionally agree_
    with distrusting the US government wholesale.\n\nBut most of the technical arguments
    baked into folks’ conspiracy theories **make no goddamn sense**.\n\n> This distrust
    is not exclusive to only the US government.\n> \n> The goal of this blog post
    is not to convince you that you should trust _any_ government; just that they
    are not magical or omniscient.\n\nTo that end, I’m going to explore some of the
    history of NSA, NIST, and cryptography standardization. Then, to explore some
    of the conspiracy theories that were being floated about such activity, and what
    we’ve learned in the years since (especially in the past month). Finally, I’m
    going to examine some of the current conspiracy theories floating around message
    boards and social media today, and explain why they’re almost certainly wrong.\n\nBuckle
    up, this is going to be a tedious one.\n\n![Soatok drinking coffee](https://i0.wp.com/soatok.blog/wp-content/uploads/2024/07/SoatokTelegrams2020-15.png?resize=512%2C512&ssl=1)\n_CMYKat_\n\n##
    Why should we listen to you?\n\nIf you find yourself asking a question like this,
    the correct answer is simply, “You shouldn’t.”\n\nAfter all, I have never held
    (let alone even applied for) a security clearance, and have no access to any non-public
    information. I’m also not a current or former government employee, and have no
    aspirations to ever become one. I have access to all the same facts anyone else
    does.\n\nIn balance, I have no horse in the race of who trusts whom. I’m just
    tired of hearing the same poorly reasoned arguments all the damn time, and would
    like to stop having to repeat myself when I encounter one.\n\n## Historical NSA
    Shenanigans\n\nThe sources for this, by the way, are [the declassified United
    States Senate Select Committee on Intelligence](https://cryptome.org/2012/05/nsa-crypto-des.pdf)
    and [United States Cryptologic History](https://archive.org/details/NSA-American-Cryptology-Cold-War/American%20Cryptology-Book%20III/).\n\n###
    DES\n\n_No, not that DES._\n\nThe Data Encryption Standard (DES) was published
    in the Federal Register in 1975 and then standardized in 1977.\n\nWe consider
    it weak these days, but DES was a real game-changer for its time: It offered a
    standard block cipher to use for sensitive (but not classified) commercial applications.
    Prior to DES, the history of cryptography was largely about military uses (except
    a few quirky mathematicians here and there), going back before [Caesar’s cipher](https://en.wikipedia.org/wiki/Caesar_cipher).\n\nFrom
    declassified documents, we now know the full story, but from the time that DES
    was first standardized, up until recent years, there have been a concerns about
    [NSA’s involvement](https://en.wikipedia.org/wiki/Data_Encryption_Standard#NSA's_involvement_in_the_design).\n\n>
    We sent the S-boxes off to Washington. They came back and were all different.\n\nTo
    say that academics did not trust DES would be putting it mildly: Martin Hellman
    (who, with Whitfield Diffie and Ralph Merkle, _invented_ public-key cryptography)
    sent a letter in 1975 to the National Bureau of Standards that stated:\n\n> Whit
    Diffie and I have become concerned that the proposed data encryption standard,
    while probably secure against commercial assault, may be extremely vulnerable
    to attack by an intelligence organization.\n\nAt the heart of the concern about
    DES was something called an S-box, which simply maps an input to an output, but
    whose purpose is to provide a non-linear transformation to obscure the relationship
    between the ciphertext and the key.\n\nThe S-box used by DES was chosen by NSA.
    This led a lot of people to suspect there was a backdoor in the selection of the
    S-boxes for DES. **It turned out to be the opposite, of course** : The NSA had
    discovered differential cryptanalysis in secret, and had selected S-boxes that
    were resistant to this technique, but did not want to reveal it publicly (lest
    they lose their advantage over rival nations).\n\nThere’s a lot more details to
    this story than I want to bore anyone with, so I recommend reading up on the history
    of cryptography and cryptanalysis if you’re interested in such things.\n\nIn balance,
    [at the advice of NSA](https://www.schneier.com/blog/archives/2004/10/the_legacy_of_d.html),
    the final DES design did only offer 56 bits of security (down from an original
    key size of 128 bits). This short key ultimately allowed [the EFF to crack DES
    in 1998](https://w2.eff.org/Privacy/Crypto/Crypto_misc/DESCracker/) with a hardware
    cost of about $250,000.\n\n![Clipboard Sticker](https://i0.wp.com/soatok.blog/wp-content/uploads/2021/04/soatok-telegrams-wave-3-commission-11.png?resize=512%2C512&ssl=1)\n_CMYKat_\n\n####
    What does this actually tell us?\n\nWhen IBM was designing DES, with feedback
    from NSA, the stated purpose was to use for commercial cryptographic applications
    in the United States.\n\nFact: NSA used secret cryptanalytic capabilities to ensure
    the resulting block cipher that became DES was _protected from the attack they
    knew about_ without revealing said technique.\n\nFact: NSA recommended reducing
    the key length from 128 bits to 64 bits (with 8 of the key bits serving as parity
    bits, thus making it only have 56-bit security).\n\nThis both strengthened and
    weakened DES in different ways. A 56-bit key can be broken by a distributed computing
    effort in under 24 hours, as of 2012.\n\n_DES’s 56-bit keys are at the heart of
    Moxie’s MSCHAPv2 break._\n\nThis is confusing until you remember NSA has two opposing
    missions, with (unfortunately) military jargon names.\n\n- COMSEC (Communications
    Security) — basically blue-teamers\n- SIGINT (Signals Intelligence) — basically
    red-teamers\n\nThe COMSEC folks have a mission to secure the US government and
    protect US interests (read: private sector).\n\nThe SIGINT folks have a mission
    to spy on other nations on behalf of the US.\n\nIn theory, the SIGINT folks aren’t
    supposed to spy on Americans _at all_. In practice, their Five Eyes partners gives
    them a stupid loophole: An allied nation can simply do the spying for them, so
    long as federal prosecutors are willing to engage in a little bit of [parallel
    construction](https://en.wikipedia.org/wiki/Parallel_construction).\n\nTake note
    of the DEA section of the previously linked Wikipedia page.\n\nYou cannot trust
    the government, but if you know the mission each department operates under, you
    can understand _their incentive structures_. Knowing their incentive structures
    lets you reason about their actual activities–or, failing that, create conspiracy
    theories with a cohesive narrative.\n\nThe COMSEC mission can be related to the
    S-box strengthening; the SIGINT mission, to the weaker key length.\n\n### Clipper
    Chip\n\nOkay, so the DES thing was a messy affair. Let’s look at an example of
    the NSA clearly being on the wrong side of privacy.\n\nThe [Clipper Chip](https://en.wikipedia.org/wiki/Clipper_chip),
    which was designed and promoted by the NSA in 1993 to secure voice messages, with
    a backdoor.\n\nClipper Chip was an early example of a NOBUS (Nobody But Us can
    exploit it) backdoor. Unlike DES’s 56-bit key, the cipher used (Skipjack) was
    promoted up to a whopping 80-bits.\n\nBut before you celebrate, be aware that
