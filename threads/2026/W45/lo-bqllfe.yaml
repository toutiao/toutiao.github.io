    You are arguing against something that isn’t happening:

    that is not a good reason for them to be forcing exclusively PQ crypto.

    Hybrid PQ remains the mainstream option. PQ-only is also an option for use by feds. Non-PQ remains an option. No-one is forcing exclusively PQ crypto.
    DJB doesn’t understand the IETF process: he thinks that votes matter, and as I wrote earlier that’s the kind of mistake that’s almost perfectly aimed to annoy the people he says he wants to persuade, especially when those people know DJB has been around long enough that he should know better. The IETF still loves the catchphrase “rough consensus and running code”, but what Dave Clark originally wrote was:

    We reject: kings, presidents and voting.
    We believe in: rough consensus and running code.

    And Clark’s first sentence is still kept in mind even though it’s less frequently quoted out loud than the second sentence.
