    Copied \n\n## Hungary released communist-era secret police files Wednesday, identifying
    up to 60,000 informants, a path for Hungary in reckoning with its repressive past.
    \n\nIn spite of Hungary's democratic transition in 1990, efforts to disclose communist-era
    archives have repeatedly failed, with critics blaming successive governments'
    reluctance to implicate public figures across the political spectrum.\n\n ![](/images/logos/logo-euronews-stacked-outlined-72x72-grey-9.svg)ADVERTISEMENT\n\n
    ![](/images/logos/logo-euronews-stacked-outlined-72x72-grey-9.svg)ADVERTISEMENT\n\nHungary's
    Prime Minister Peter Magyar ended this stall with a bill in September to grant
    unrestricted access for the public to the records for the first time.\n\n\"After
    36 years, we are finally fulfilling what was once one of the key promises of the
    1990 regime change — a promise that was later denied and lied about,\" Magyar
    told a media briefing at the state security archives.\n\n\"For decades, restrictions
    on public access provided opportunities for political hysteria, blackmail, the
    exertion of pressure, and silencing,\" he said.\n\n## Public figures featured
    in registry\n\nPoliticians, clergy members and TV personalities' names appeared
    in the registries. But a \"large proportion\" of the informants were \"people
    who did not make their mark on national public life,\" said Bendeguz Gergo Cseh,
    the head of the archive.\n\nThe government will set up hotlines offering emotional
    support and counselling for those affected by the revelations.\n\n\"Following
    today's disclosure, a great many families will be confronted with information
    that is difficult for them to bear,\" Magyar said, asking people to treat the
    disclosure with \"dignity and humanity.\"\n\n## Various types of documents disclosed\n\nUnder
    the law on the full disclosure of the previous regime’s secret service activities,
    four types of state security records dating from before 1990 will be made freely
    accessible to anyone.\n\nOn Wednesday morning, the three of these became accessible
    on the [nyitottaktak.hu _(source in Hungarian)_](https://nyitottaktak.hu/?fbclid=IwY2xjawVXvedleHRuA2FlbQIxMABwZG9mBWJyaWQRMGVsWThleUVUVW8ydmhwbjVzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEfIwh0Ulfhp7O0jbrbplybScWjAakcTPPwwyVUN4zi1Ki7epH03XTyNQzN8QQ%5Faem%5F1khUmHWOpr-SIT1sjt5h0A)
    website.\n\nThe \"6 card\" is the registration sheet for a network member. It
    contains the agent’s identifying data, including name, place and date of birth,
    mother’s name and occupation, but also the main details of the agent’s activity.
    Among them, the circumstances and motivations that led to them becoming an agent
    and how long they remained a network member.\n\nA register of recruitment between
    1957 and 1962 and a database of former agents' personal data and code names were
