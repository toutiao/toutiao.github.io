    they &quot;washed&quot; the teachers, that they demontaged most of the companies,
    that they seized the money from banks and companies and so on.<p>And don&#x27;t
    you think that there was no opposition. Many farmers, living on and from the land
    of their parents grandparents (etc, lasting generations back) were really tied
    to their land. So they were repressed, often with made-up claims, a  political
    process and than jail. But sometimes with death (death penalty existed under soviet
    occupation). But not only farmers were persecuted on opposition, also company
    owners and managers.<p>122671 germans were &quot;captured&quot; --- and I mean
    it. Often relatives weren&#x27;t told about the accusation or where they were
    injailed. Some came to normal jails, but 42889 died while in custody. That&#x27;s
    such a high percentage that one cannot assume normal die reasons. Studies estimate
    that 1% of the population was arrested and 30% of the arresed died due to &quot;circumstances&quot;.<p>And
    we know that even after the soviet occupation turned into the founding of east
    germany (GDR) that the east-german secret police, Stasi, occassionally killed
    political opponents by firing squads.<p>So, for the oppressed population it was
    known that anyone who opposes would be taken away with unknown destination. And
    that a good amount of them never returned.<p>And keep in mind that this was just
    after the Nazi time. Non-german people always focus on how the Nazis killed Jews.
    And they are totally right ... but they ALSO tortured and killed political opponents.
    So for a german in 1949 it was not unknown to some political police arriving at
    4 o clock in the morning and taking you to some torture camp. You didn&#x27;t
    need to be a jew, gypsi or Jehova&#x27;s Witness. Just the rumor that you opposed
    the system was enough.<p>It was a climate of feat. And the soviets and later the
    leading east germans continued that.
