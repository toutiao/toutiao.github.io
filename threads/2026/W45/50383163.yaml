  author: wildzzz
  text: Agents vs informants is a venn diagram. Some informants become active participants
    under orders of an intelligence officer, they are instructed to use their access
    for further tasks. Some agents infiltrate groups and inform their handler on group
    activities and membership. Not all agents inform (they may perform things like
    sabotage or murder) and not all informants are instructed to do anything (they
    are paid and never contacted again).
