  text: |-
    I mean, they're not necessarily doing anything wrong. But core is basically bare metal and compiler intrinsics. There's no way to allocate memory or really do anything at all. It's perfectly sensible for kernel-level code where you don't have a memory allocator until you build one. (The one thing you do get is a lot of iterator machinery, including over byte slices.)
    And while Rust is neat at that low a level, it's just barely recognizable as normal Rust.
    Also, this means that they're committing to rebuilding all their own collection types on top of custom fallible allocation routines and unsafe. Which means that they may not have as much security auditing as the Rust std library. std isn't perfect, but it's frequently used as a testbed for people's theorem provers. Which has flushed some bugs in the past.
    To be clear, I'm not criticizing them. I'm just pointing out that they're choosing to throw away pretty much everything but the borrow checker and iterators, and build from scratch, which likely requires lots of unsafe. So they won't see the same cost/benefit tradeoffs as "normal" Rust projects. Which may make sense.
    (EDIT: Looking at some of their code, they seem to have already rebuilt an entire standard library using their own abstractions. But they've made it far enough to start seeing many of the benefits of Rust at higher levels, by that point. But that was a lot of code to rewrite.)
