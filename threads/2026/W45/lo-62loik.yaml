    systemd doesn’t oppose the usage of external crates in principle, it is intentionally
    conservative in not accepting any dependency on them until the project has had
    some experience with the wider Rust ecosystem and community.\n\n- No-std Rust.
    systemd also doesn’t use the Rust standard library. We currently don’t need to
    consume anything that the standard library provides. To reiterate an earlier point
    by way of example, none of the path lookup functionality provided by Rust is currently
    acceptable in the security sensitive system components provided by systemd.\n\nNo-std
    Rust. systemd also doesn’t use the Rust standard library. We currently don’t need
    to consume anything that the standard library provides. To reiterate an earlier
    point by way of example, none of the path lookup functionality provided by Rust
    is currently acceptable in the security sensitive system components provided by
    systemd.\n\n- Fallible Allocations. Failing allocations in Rust cause panics.
    systemd always treats allocations as fallible and handles them gracefully whenever
    possible. So systemd provides its own allocator crate that makes memory handling
    across the whole systemd codebase uniform. Again, much like the kernel does.\n\nFallible
