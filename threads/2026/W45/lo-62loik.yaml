  content: "# systemd ❤️ Rust\n\nBy Christian Brauner and Lennart Poettering\n\nsystemd
    recently merged support for Rust. Going forward it will be possible to write systemd
    components in Rust in addition to C.\n\nThe choice to integrate another core language
    into a large and established project is always contentious. We have seen the same
    when Rust was adopted as an additional language for the Linux kernel. As we know
    by now, that has mostly been successful.\n\nRust support in systemd has two possible
    meanings:\n\n- leaf components (individual binaries)\n\n- root components (Rust
    in the fundamental libsystemd-shared.so shared library itself)\n\nThe project
    came to the conclusion that (1) is acceptable while (2) is (currently) not, as
    the scope and requirements are very different between these two options.\n\n##
    Rust in systemd Shared Libraries \U0001F97A\n\nOption (2) is complicated. The
    details are best left to another blog post but the gist is that we require first-class
    shared library support in Rust. In the Rust community, this is often referred
    to as the “stable ABI problem,” which is a well-known and long-standing issue.
    Until that is available we cannot integrate Rust into root components, otherwise
    every shared library and many binaries would be bloated by duplicated Rust code.\n\nStatic
    linking for a project like systemd that is split into many tiny components (>
    180 binaries currently) is simply not practical or desirable. Generally, static
    linking works for the leaves of the OS but the core often has different requirements.\n\n##
    Rust in systemd Binaries \U0001F60D\n\nOption (1) means that the shared code remains
    C-only, and we wrap this functionality as Rust crates. The crates are then used
    for Rust binaries. This allows us to consume all the core API functions uniformly
    across all components independent of whether they are written in Rust or in C.\n\n##
    Key Design Decisions\n\nWhen Rust was accepted into systemd, the project adopted
    the following principles:\n\n- Uniform Access to Core APIs. The systemd shared
    library has a wide range of helpers that provide features and security that are
    far beyond what either libc or any Rust crate provide. The clearest example is
    systemd’s chase*() family of functions. It is a purely fd-based API for path lookup
    that the whole tree uses. Any new kernel feature that improves on the security
    and reliability of path lookup is immediately adopted and securely abstracted.
    There is no equivalent to any of this in core Rust.\n\nUniform Access to Core
    APIs. The systemd shared library has a wide range of helpers that provide features
    and security that are far beyond what either libc or any Rust crate provide.\n\nThe
    clearest example is systemd’s chase*() family of functions. It is a purely fd-based
    API for path lookup that the whole tree uses. Any new kernel feature that improves
    on the security and reliability of path lookup is immediately adopted and securely
    abstracted. There is no equivalent to any of this in core Rust.\n\n- Uniform Behavior.
    Binaries in C and in Rust look and behave identically in how they parse options,
    display help, and output error messages. It is inherently unacceptable for binaries
    in Rust to spuriously differ from systemd’s C binaries. The user should never
    have to care about the specific language a binary is implemented in. It simply
    shouldn’t affect behavior.\n\nUniform Behavior. Binaries in C and in Rust look
    and behave identically in how they parse options, display help, and output error
    messages.\n\nIt is inherently unacceptable for binaries in Rust to spuriously
    differ from systemd’s C binaries. The user should never have to care about the
    specific language a binary is implemented in. It simply shouldn’t affect behavior.\n\n-
    Uniform Build System. Like most contemporary programming languages, Rust comes
    with its own build and dependency management ecosystem: cargo. Much like the kernel,
    systemd explicitly chose not to rely on cargo to build Rust. systemd uses meson
    as its build system and integrating a second build system next to it would be
    a bad idea in our opinion and a great way of complicating the lives of distribution
    maintainers. The security and supply-chain attack issues associated with cargo
    have been raised as a concern as well.\n\nUniform Build System. Like most contemporary
    programming languages, Rust comes with its own build and dependency management
    ecosystem: cargo. Much like the kernel, systemd explicitly chose not to rely on
    cargo to build Rust.\n\nsystemd uses meson as its build system and integrating
    a second build system next to it would be a bad idea in our opinion and a great
    way of complicating the lives of distribution maintainers.\n\nThe security and
    supply-chain attack issues associated with cargo have been raised as a concern
    as well.\n\n- Controlled Dependencies. systemd maintains strictly loose dependencies
    on other projects. Nowadays, systemd links exclusively against libc. Every other
    dependency is provided via dlopen() using ELF notes to mark the dependencies.
    Accepting a new dependency is a careful process and involves vetting the individual
    projects in terms of maintenance and security. While systemd doesn’t oppose the
    usage of external crates in principle, it is intentionally conservative in not
    accepting any dependency on them until the project has had some experience with
    the wider Rust ecosystem and community.\n\nControlled Dependencies. systemd maintains
