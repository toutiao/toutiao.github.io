    as fallible and handles them gracefully whenever possible. So systemd provides
    its own allocator crate that makes memory handling across the whole systemd codebase
    uniform. Again, much like the kernel does.\n\n- No Gratuitous Rewrites. Long-established
    and reliable parts of the codebase written in C will not be converted without
    good reason. If new languages have one downside it is that they cause rewrites
    of established and stable projects for the sake of using the language rather than
    solving an actual problem. One of the clearest examples is rewrites of components
    whose inherent attack surface is path-based lookup instead of memory safety. Projects
    ported to another language need more than a bug-for-bug compatible rewrite to
