  text: Bots give all the information required to block or rate limit them including
    those that try to look like a real browser <i>(some things they just can&#x27;t
    hide, even residential proxies via behavior.)</i>.   Ask the LLM how to change
    your log format to gather all the fields your web server can see.   Share the
    resulting updated logs with your favorite LLM.  Ask it for generalized rules to
    block the bots whilst permitting real browsers.  A tiny percentage of bots will
    still get through but the load becomes much more manageable.  Tell your LLM you
    also wish to spot fake chrome via CH and bots via ssl curves.  No need for JA3.  Nginx
    can expose the important aspects of GREASE.
