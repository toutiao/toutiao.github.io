  author: piltdownman
  text: The problem is unintentional DOS due to traffic can constitute a felony under
    the CFAA; the case in question being Pulte Homes, Inc. v. Laborers&#x27; International
    Union 2011.<p>After Pulte fired an employee represented by the union, LIUNA urged
    members to call and send email to the company, expressing their opinions. As a
    result of the increased traffic, the company&#x27;s email system crashed. The
    Sixth Circuit ruled that the LIUNA&#x27;s instruction to call and email &quot;intentionally
    caused damage,&quot; reversing the lower court&#x27;s decision.<p>Now thankfully
    we have Sandvig v. Barr, 2020 where the DC Federal Court ruled that the CFAA does
    not criminalize the violation of a website&#x27;s terms of service, but imo all
    bets are off in terms of interpretation of the law in the wild west of AI.
