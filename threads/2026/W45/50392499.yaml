  author: Bender
  text: 'Aside from the things I suggested asking LLM&#x27;s <i>(they will take one
    down some fun rabbit holes)</i> there are more crude methods such as forcing brotli
    or zstd on specific URLs accepting that older versions of Safari <i>pre-2026</i>
    will get gibberish if forcing zstd.  It&#x27;s rude and paternal but botters can
    be rude and childish so these are the games we play.<p>I love sharing methods
    with the botters so they step up their game, thus forcing me to step up my game.  Everything
    I use does not require javascript, cookies or authentication.  I save authentication
    as a last resort <i>which means I lost that round</i>.<p>Botters are welcome and
    encouraged to test their setup on my silly hobby sites.  Here&#x27;s one of them:
    [1]<p>[1] - <a href="https:&#x2F;&#x2F;altchan.org&#x2F;sh&#x2F;33" rel="nofollow">https:&#x2F;&#x2F;altchan.org&#x2F;sh&#x2F;33</a><p><i>P.S.
    These are the simplest crude methods for the obvious bots, let your LLM to help
    spot the fakers.  pre-2026 Safari will not work.  Do not visit image boards with
    unpatched browsers.</i>'
