  author: Bender
  text: LLM bots are the easiest to spot.  Rate limit them to 16kb&#x2F;s and 1 request
    every 5 seconds.  Give them a friendly multilingual WCAG status 429 page that
    says to slow down or status 444 and drop them into nftables ipsets if they continue
    to be aggressive.  Ask your favorite LLM how to set this up.  If your LLM gets
    session paused, ask Gemini or Grok.  Tell it if you are behind a CDN.  Enable
    logging of ssl curves, ciphers, etc... Show your LLM some examples from your access
    logs.
