    &#x27;Penny&#x27; for &#x27;Penelope&#x27;<p>&#x27;Ash&#x27; for &#x27;Ashley&#x27;.<p>&#x27;Tash&#x27;
    or &#x27;Tasha&#x27; for &#x27;Natasha&#x27;, &#x27;Nata(s)cha&#x27; (a variant
