  author: thaumasiotes
  text: "&gt; Andrea (on-dre-ah vs and-ree-ah) is a true name collision.<p>What do
    you mean? The Italian male name Andrea and the English female name Andrea aren&#x27;t
    unrelated names that happen to be spelled the same way. They are one and the same
    name, both derived from the Greek word for &quot;man&quot;; the Italian name has
    managed to remember that it&#x27;s overtly masculine and the English name has
    forgotten this."
