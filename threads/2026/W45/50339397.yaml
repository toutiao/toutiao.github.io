  author: Groxx
  text: 'Ends in &#x27;a&#x27; = female: a relatively safe assumption, as far as an
    assumption here can be safe, with no other context. A strong majority in many
    places will match that. Many of the exceptions will be obviously foreign names
    with traditional spelling, which can go either way (may follow that culture&#x27;s
    patterns, may not, highly varied).<p>Ends in vowel (sound) = female: probably
    mostly true, in that I strongly suspect it&#x27;s &gt;50%, but it&#x27;s unreliable
    enough that I&#x27;d avoid trying to base any assumptions off it.<p>Names really
    follow no rules at all here. For both good and bad. E.g. most recently I ran across
    a &quot;La-sia&quot; pronounced &quot;ladashsia&quot;. If it&#x27;s spelled vat-ik&#x27;Nff
    and pronounced &quot;King George&quot; and they&#x27;re female, then that&#x27;s
    what&#x27;s correct.'
