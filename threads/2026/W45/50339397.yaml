  author: FranchuFranchu
  text: 'Yes, it stems from Latin. See Latin&#x27;s case declension tables [0]<p>In
    Spanish and Portugese, -a is a feminine suffix and -o is masculine; that&#x27;s
    where we get Patricio vs Patricia.<p>There are very few female names that end
    with -o and very few male names that end with -a in Spanish.<p>Another example
    is -ine in Joseph&#x2F;Josephine. -ine&#x2F;-ino&#x2F;-in is a feminizing suffix
    in German and a diminutive in Spanish and French, that&#x27;s why it&#x27;s a
    femenine suffix in names. In English we have hero vs heroine.<p>[0]: <a href="https:&#x2F;&#x2F;dcc.dickinson.edu&#x2F;grammar&#x2F;latin&#x2F;case-endings-five-declensions"
    rel="nofollow">https:&#x2F;&#x2F;dcc.dickinson.edu&#x2F;grammar&#x2F;latin&#x2F;case-endings-five-de...</a>'
