  text: "&gt;Have you met anyone in your presumably English-speaking country who wrote
    their name in Korean characters? Probably not because they convert it to the nearest
    allowed name.<p>Having a list of &quot;allowed&quot; names implies another list
    of &quot;disallowed&quot; names.  I am not aware (including names with non 7-bit
    ASCII characters) of any such list of names that aren&#x27;t <i>legally</i> allowed
    to be used.<p>I&#x27;d note that the artist formerly known as Ƭ̵̬̊  <i>legally</i>
    changed their name to that symbol here in my &quot;presumably English-speaking&quot;
    country.<p>I am not aware of any such restrictions where I live.  Perhaps it&#x27;s
    just where you do?"
