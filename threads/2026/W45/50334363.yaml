  author: seemaze
  text: '&gt;Antimony is a computer-aided design (CAD) tool from a parallel universe
    in which CAD software evolved from Lisp machines rather than drafting tables<p>That&#x27;s
    an ironic take in that the most prolific CAD software in use, AutoCAD, has supported
    a a lisp dialect, named AutoLISP[0], natively as an alternative runtime for more
    than four decades. It is so prolific in the CAD industry, that other vendors have
    even adopted compatibility with the language.<p>It is heartening to see CAD referenced
    in relation to drafting tables. I spend much of my time trying to educate new
    CAD users about the different solutions offered between the &#x27;drafting table&#x27;
    metaphor and the &#x27;world model&#x27; metaphor present in most CAD applications.<p>[0]<a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;AutoLISP" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;AutoLISP</a>'
