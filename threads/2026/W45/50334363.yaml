  text: 'The great thing about OpenSCAD is that it makes it easy to model objects
    which may be represented by positioning&#x2F;stretching&#x2F;adding&#x2F;subtracting
    cubes, spheres, cylinders, and cones using mathematics.<p>The awful thing about
    OpenSCAD is what one can model in it is directly limited to ones fluency and facility
    with using math to position, stretch, add, and subtract cubes, spheres, cylineders,
    and cones.<p>There is an entire book series on using it didactically:<p>- Geometry:
    <a href="https:&#x2F;&#x2F;www.goodreads.com&#x2F;book&#x2F;show&#x2F;58059196-make"
