  text: my father was a draftsman and so I grew up with blueprints and a drafting
    table in the home. He was also a user of the earliest CAD systems, including AutoCAD
    (by a vendor named Autodesk). It had a Lisp-like language built-in named AutoLISP.
    It was the first Lisp running in my home that I can remember or at least the first
    I interacted with. CAD systems were clearly meant as a software tool for the kind
    of workflow previously done by hand, by draftsmen, involving printed blueprints.
    And a Lisp was exposed for user interaction about as early as you can get.<p>So
    I am not clear if the OP is just ignorant of CAD&#x27;s history, or they are making
    an intentionally baiting and misleading claim.
