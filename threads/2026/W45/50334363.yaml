article:
  url: https://www.mattkeeter.com/projects/antimony/3/
  title: Antimony
  fetch_status: success
  content: "## about\n\nAntimony is a computer-aided design (CAD) tool from a parallel
    universe in which CAD software evolved from Lisp machines rather than drafting
    tables.\n\n## demo\n\n([watch on Vimeo](https://vimeo.com/125111378) to see it
    in HD) \n\n## foundations\n\nAntimony is built on three mostly-orthogonal axes:\n\n-
    A framework for tracking information flow through directed acyclic graphs\n- A
    geometry engine for doing [CSG](http://en.wikipedia.org/wiki/Constructive_solid_geometry)\n-
    A standard library of shapes and transforms\n\n### Graph engine\n\nSolid modeling
    in Antimony is done by connecting nodes in a graph:  \n ![Graph example](images/graph.png)\n\nEach
    node is defined by a customizable script. Antimony uses Python 3.x plus a few
    extra magic keywords.\n\nHere's what the circle node above looks like:\n\n    import
    fab.shapes\n    \n    # Define a set of input ports\n    # (and inject variables
    into the local namespace)\n    input('x', float)\n    input('y', float)\n    input('r',
    float)\n    \n    # Call the 'circle' function in the standard shapes library\n
    \   # using the variables that came in from the input ports\n    c = fab.shapes.circle(x,
    y, r)\n    \n    # Create an output port that produces the circle shape\n    output('shape',
    c)\n\nNodes usually represent a primitive shape or transform. Links are tracked
    and changes are automatically propagated downstream.\n\n![Change propagation](images/tracking.gif)\n\nThe
    graph engine scales up to complex multi-part assembles.\n\n![Kelvin](images/big.png)\n\n![Kelvin](images/bigger.png)\n\n###
    Geometry engine\n\nAntimony's geometry engine uses[functional representations](http://en.wikipedia.org/wiki/Function_representation)for
    solid modeling. This representation is particularly suitable for modeling with
    boolean operations (union / intersection / difference).\n\n![Boolean example](images/csg.png)\n\nIn
    the application, the geometry engine renders shapes as shaded bitmaps. They're
    then blitted to a 3D viewport.\n\n![Application screenshot](images/app.png)\n\nAntimony
    can export heightmaps for 2.5D processes and `.stl` files for 3D manufacturing.
    The `.stl` export includes feature detection to keep corners and edges sharp.\n\n![Mesh](images/export.png)\n\n###
    Standard library\n\nAntimony's standard library defines many [shapes and transforms](https://github.com/mkeeter/antimony/blob/develop/py/fab/shapes.py),
    from basic (rotate, scale, boolean operations) to unusual (attract, repel, bend).\n\nThese
    shapes are used in node definitions, which typically add input and output ports
    and can optionally define UI features.\n\nHere's an example of a node that defines
    UI features:\n\n    import fab\n    \n    title('Rectangle')\n    \n    input('xmin',
    float)\n    input('ymin', float)\n    input('xmax', float, 1)\n    input('ymax',
    float, 1)\n    \n    output('shape', fab.shapes.rectangle(xmin, xmax, ymin, ymax))\n
    \   \n    # UI\n    sb.ui.wireframe([(xmin, ymin, 0), (xmax, ymin, 0),\n                     (xmax,
    ymax, 0), (xmin, ymax, 0)], close=True)\n    sb.ui.point(xmin, ymin, 0)\n    sb.ui.point(xmax,
    ymax, 0)\n\nIn the 3D viewport, the UI features defined at the bottom of the script
    are drawn over the rendering of the rectangle.\n\nThese UI features are hooked
    back into the graph: dragging the points at the rectangle's corners pushes changes
    to the graph node.\n\n![UI dragging](images/dragging.gif)\n\n**As an aside** :
    most users will be satisfied with the built-in shapes, but it's also possible
    to define custom shapes.\n\nShapes are represented with a prefix string syntax
    that's easy to parse but a bit cryptic to decipher. Here's the definition for
    the circle shape used above:\n\n    def circle(x0, y0, r):\n        return Shape(\n
    \               '-r+q-Xf%gq-Yf%gf%g' % (x0, y0, r), # math string\n                x0
    - r, y0 - r, x0 + r, y0 + r) # bounds\n\nUnpacking and hierarchically indenting
    the prefix string gives\n\n    -\n      r\n        +\n          q\n            -\n
    \             X\n              f%g\n          q\n            -\n              Y\n
    \             f%g\n      f%g\n    % (x, y, r)\n\nThis encodes a distance field
    representation of a 2D circle:\n\n    f(x,y) = sqrt(pow(x - x0, 2) + pow(y - y0,
    2)) - r\n\nwhere `x0`, `y0`, and `r` are the circle's center and radius (specified
    when `circle` is called).\n\nThe exact mapping from prefix strings to infix functions
    is left as an exercise for the reader (or can be looked up in Appendix A of[my
    thesis](../../../research/thesis.pdf)).\n\n## download\n\nA prebuilt Mac application
    can be downloaded [from the Github releases page](https://github.com/mkeeter/antimony/releases).\n\nAntimony's
    source is [available on Github](https://github.com/mkeeter/antimony), along with
    instructions for [building it](https://github.com/mkeeter/antimony/blob/master/BUILDING.md)on
    Mac and Linux.\n\n## development\n\nAntimony is a long-running project under [active
    development](https://github.com/mkeeter/antimony/graphs/contributors).\n\n![Development](images/development.png)\n\nIt's
    at a beta level of stability: solid, but not recommended for mission-critical
    use.\n\nIf you're interested in contributing, there's a pretty low bar for entry.
    Given basic Python knowledge, you can get started making custom nodes (like this
    [HSB color node](https://github.com/mkeeter/antimony/blob/develop/py/nodes/Color/set_color_hsb.node)contributed
    by [RobotGrrl](https://twitter.com/RobotGrrl) or the[plethora of nodes](https://github.com/mkeeter/antimony/commits?author=neilger)
    contributed by[Neil](http://ng.cba.mit.edu/)).\n\nFor more ambitious folks with
    C++ experience, there are a whole host of improvements that could be made, from
    speeding up rendering to cleaning up the UI and optimizing graph evaluation. Send
    me a note if this piques your interest.\n\n## history\n\nAntimony grew out of
    my work on powerful personal-scale CAD/CAM workflows at the [MIT Center for Bits
    and Atoms](http://cba.mit.edu).\n\nIt's the latest tool in a line of software
    that included[cad\\_ui](../../solver) and [kokopelli](../../kokopelli), and draws
    inspiration from [fabserver](http://kokompe.cba.mit.edu).\n\nFor a historical
    perspective, there are a set of earlier Antimony writeups:\n\n- [Early 2014](../1)
    (developed as a demo for the World Economic Forum)\n- [Fall 2014](../2) (updated
    for use in How to Make Almost Anything)\n\nThis update coincides with the 2015
    edition of [Fab Academy](http://fabacademy.org/); use [this search query](https://www.google.com/search?q=site%3Ahttp%3A%2F%2Ffabacademy.org%2Farchives%2F2015%2F%20antimony&rct=j)to
    see how people are using it.\n\n## press & discussion\n\n- [Hackaday write-up](http://hackaday.com/2015/05/29/otherworldy-cad-software-hails-from-a-parallel-universe/)\n-
    [Interview with Libre Graphics World](https://librearts.org/2015/05/introducing-antimony-node-based-cad-application/)\n-
    [Hacker News discussion](https://news.ycombinator.com/item?id=9623609)"
