  author: tonyarkles
  text: |-
    Yeah, I oscillate a ton between code-based CAD (OpenSCAD, Build123d) and Fusion 360 and they require very different ways of thinking about things, with different things being easier&#x2F;harder with each approach.<p>I hesitate a bit to call code-based CAD &quot;a toy&quot;, but there are a lot of times where what I think I actually want is some kind of, sorry for the phrasing here, fusion of Fusion 360 and OpenSCAD. The Fusion timeline is pretty phenomenal and having the ability to do something like code steps and manual &quot;click on all of the edges you want to put a fillet on&quot; steps interwoven seems like it has a lot of potential for my &quot;ultimate CAD workflow&quot;. The timeline part is kind of the magic that unlocks the whole thing:<p>- update a parameter or a piece of code, triggering a recompute
    - see that the fillet operation is now missing an edge
    - rewind the timeline, tweak the fillet edge set
    - fast-forward the timeline to let the rest of the code blocks re-execute<p>Things like MakerWorld let you upload parametric OpenSCAD files and that&#x27;s cool and all, but for my own uses I don&#x27;t care if I need to use the &quot;insert a manual step in the timeline&quot; feature occasionally. OpenSCAD on its own doesn&#x27;t have that and the idea of trying to do &quot;operations as code&quot; in Fusion (there is a scripting interface) is not super appealing as-is.<p>Being able to use hand-created objects as function inputs seems pretty powerful too. As an example, instead of needing to manually specify all of the points to make a polygon that I&#x27;m going to do a bunch of OpenSCAD extrudes with, just referencing a sketch earlier in the timeline. My current OpenSCAD &quot;hack&quot; for that is to draw those in FreeCAD as DXFs and then import them, but it&#x27;s not a smooth workflow at all.
