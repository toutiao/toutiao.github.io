  author: mkeeter
  text: 'Lots of stuff – my favorite part about implicit surfaces is that they&#x27;re
    a microcosm of CS as a whole, so there&#x27;s a huge number of directions to explore.<p>libfive
    [1] was the follow-up kernel, written in C++, with a big emphasis on fast evaluation
    and robust meshing.  It&#x27;s also in maintenance mode, but was shipped in a
    handful of commercial CAD tools.<p>In 2020, I wrote a SIGGRAPH paper [2] about
    doing implicit surface rendering on the GPU.  This was a fun and exciting experience!  This
    used libfive for the frontend, then did all of the compute-heavy rendering work
    on the GPU.<p>I then got tired of dealing with C++ and rewrote everything in Rust,
    which is what I&#x27;ve been using ever since: Fidget [3] is the new kernel and
    Halfspace [4] is the new IDE.  This is what I&#x27;m actively working on – the
    Halfspace blog post just went up a few weeks ago, and I&#x27;ve been implementing
    &#x2F; improving a GPU rendering backend in Fidget (with a backlog of several
    more blog posts).<p>In between, I nerd-sniped a bunch of people into writing their
    own f-rep evaluation engines [5] and gave a talk about the whole &quot;independent
    research&quot; thing [6].<p>[1] <a href="https:&#x2F;&#x2F;libfive.com" rel="nofollow">https:&#x2F;&#x2F;libfive.com</a><p>[2]
    <a href="https:&#x2F;&#x2F;www.mattkeeter.com&#x2F;projects&#x2F;siggraph&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.mattkeeter.com&#x2F;projects&#x2F;siggraph&#x2F;</a><p>[3]
    <a href="https:&#x2F;&#x2F;www.mattkeeter.com&#x2F;projects&#x2F;fidget&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.mattkeeter.com&#x2F;projects&#x2F;fidget&#x2F;</a><p>[4]
    <a href="https:&#x2F;&#x2F;www.mattkeeter.com&#x2F;projects&#x2F;halfspace&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.mattkeeter.com&#x2F;projects&#x2F;halfspace&#x2F;</a><p>[5]
