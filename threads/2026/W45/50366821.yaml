article:
  url: https://z1x.us/blog/four-hundred-bucks-of-e-waste
  title: four hundred bucks of e-waste / z1x.us
  fetch_status: success
  content: "in this post \n \n\n \n\n# introduction\n\nmy mother's phone started dropping
    calls\n\nit was a [nokia 1280](https://en.wikipedia.org/wiki/Nokia_1280). i kept
    it alive for years, multiple battery replacements and all, but it was an old nokia
    1280 and it ended like an old nokia 1280\n\nyou might be asking who the fuck uses
    that phone in the big 2026. i think your thinking is a bit linear. theres a use
    case for almost anything. my mother is visually impaired, and for her the familiarity
    of the buttons mattered the most. she never cared to learn how to use a smartphone
    or watch youtube on one (for that she has a shitty fire tv stick that she voice
    prompts, which i might also root one day)\n\nso we went looking for a new phone
    and stopped on a [kapsys smartvision3](https://www.kapsys.com/en/produit/smartphones-smartvision-3/).
    bought it used from ebay for 400 bucks. a whole fucking lot\n\ni didnt research
    it much, and thats on me. but it was presented as the perfect solution: a real
    keypad, a talking interface, [be my eyes](https://www.bemyeyes.com) built in,
    a pile of certifications for blind people. nothing could go wrong right?\n\noh
    god was i mistaken\n\nthis thing is a piece of e-waste. i didnt even look at the
    specs when i bought it. by the time i did there was no way back. it discharged
    like crazy and it lagged. their os came with a bunch of bloatware of their own,
    and to fix that, they shipped their own \"booster\" app. do i need to say it was
    also android 11?\n\nhalf a year had passed since she got it. she still hadnt learned
    anything on it apart from pressing the assistant button and asking it questions,
    while the whole thing crashed around her. that annoyed me more than it should
    have. my blood boiled every time she brought me its answers instead of asking
    me, and i dont even know why. but thats not the point\n\ni was pissed at the manufacturer.
    kapsys promised [updates till 2027](https://sastltd.zohodesk.eu/portal/en/kb/articles/smartvision-3-updating-to-android-13).
    the patch level on her phone said april 2024. half the apps crashed. telegram,
    the app everyone uses to call her because calls on her sim cost a fortune in roaming,
    didnt work in the background no matter what i did to stop android from killing
    it. the device was simply too weak\n\nso one thursday evening i decided its time\n\n0:46\n\n#
    what i was working with\n\nmy first idea was debloating. i looked into [universal
    android debloater ng](https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation),
    a tool that switches off preinstalled apps, but disabling apps on a rom thats
    rotten underneath never felt like enough. i searched [xda](https://xdaforums.com)
    and [4pda](https://4pda.to), the two big android modding forums. nothing on this
    phone. not a rom, not a root guide, not even someone complaining\n\nso i plugged
    it in and started poking at it over adb\n\n- android 11, security patch from april
    2024\n- the drivers underneath are even older, december 2021 (how??)\n- mediatek
    helio p60, 4 gb of ram\n- kernel 4.14.186. remember this number ![:ominouscat:](/blog/four-hundred-bucks-of-e-waste/ominouscat.webp
    \":ominouscat:\")\n- twenty-five heavy apps fighting over those 4 gb\n\nthe crashes
    had a boring cause. the google app had updated itself from the play store and
    was crash looping, and the phone sends all voice input through it, so dictation
    died with it. kapsys also says android 12 is [\"not possible\"](https://sastltd.zohodesk.eu/portal/en/kb/articles/smartvision-3-updating-to-android-13)
    on this phone\n\ni dont really take \"not possible\" well ![:catjlb:](/blog/four-hundred-bucks-of-e-waste/catjlb.webp
    \":catjlb:\")\n\n# what kapsys actually built\n\nthe plan was to put a modern
    android on it. but the whole point of this phone is the keypad. arrows and a middle
    key to move around, real number keys like on her nokia, and the phone reads out
    whatever she lands on. flash something else and she loses all of that. so first
    i had to know how kapsys did it\n\nim not much of an android dev. the last time
    i flashed a custom rom i was 13, and i had never built one. honestly not very
    good at reading decompiled java either. so i pulled every kapsys app and the android
    system files off the phone, decompiled them with [jadx](https://github.com/skylot/jadx),
    and handed the pile to a clanker to audit while i looked at the keypad myself\n\nmy
    guess was that some kapsys app catches the key presses and controls [talkback](https://support.google.com/accessibility/android/answer/6283677),
    google's screen reader. half an hour later the audit had rejected my thesis: kapsys
    patched the android itself. every key press on android goes through a system library
    called `libinput.so`, and kapsys added a function to it, literally called `SV3KeyboardForTalkback`,
    that turns arrow presses into talkback commands. they also patched the dialer,
    the status bar and settings\n\nso i couldnt just move their apps onto a new android...
    fine, i'll rebuild it\n\n# backups (lol)\n\ncontacts, sms, calendar and photos
    came off fine. app data did not. `adb backup` wants you to confirm on the phone,
    i pressed allow three times, and every time the file stayed at zero bytes. she
    barely used apps anyway, so i just ![:catwave:](/blog/four-hundred-bucks-of-e-waste/catwave.webp
    \":catwave:\")\n\nthe real backup was supposed to be a full copy of the phone's
    storage. on mediatek phones you do that with [mtkclient](https://github.com/bkerler/mtkclient)
    through brom, a tiny program burned into the chip that works even when everything
    else is broken. you get into it by holding the volume buttons while plugging in
    the cable\n\nfor forty minutes i held every button combination known to man while
    plugging the cable in. THIS SHIT DOES NOT WORK !!!! the phone showed up for about
    four seconds, then booted android like nothing happened. every. single. time.\n\n~/dev/sv3\n\n
    \   \\>uvrunmtk.pyrlbackup/raw--skipuserdataFor brom mode, press and hold vol
    up, vol dwn, or all hw buttons and connect usb.\n    For preloader mode, don't
    press any hw button and connect usb.\n    If it is already connected and on, hold
    power for 10 seconds to reset.\n    ..........Preloader\n    Preloader - [LIB]:Status:
    Handshake failed, retrying...Port - Hint:\n    Power off the phone before connecting.\n
    \   For brom mode, press and hold vol up, vol dwn, or all hw buttons and connect
    usb.\n    ...........~z1xusfish~ sv3~/dev/sv3\n\ni gave up. the only thing i was
    really scared of losing was the imei (no imei, no calls), and unlocking doesnt
    touch it. how bad could it be\n\nthere are two kinds of people: those who make
    backups, and those who are about to\n\n# first flash\n\nunlocking it took one
    toggle in developer options and one fastboot command. no account, no waiting period,
