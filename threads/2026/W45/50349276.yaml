  author: kragen
  text: That&#x27;s a good question, and I don&#x27;t know the answer, but I can try
    to guess.<p>An 80386 is about 10–13 Dhrystone MIPS, while a 200MHz Pentium Pro
    is about 90–450, according to <a href="https:&#x2F;&#x2F;netlib.org&#x2F;performance&#x2F;html&#x2F;dhrystone.data.col0.html"
    rel="nofollow">https:&#x2F;&#x2F;netlib.org&#x2F;performance&#x2F;html&#x2F;dhrystone.data.col0.html</a>.  So
    we&#x27;re talking about a further slowdown on the order of 20×.  I don&#x27;t
    know how to estimate how much that would lower its Elo.<p>The article says:<p>&gt;
    <i>By making a number of adjustments to the algorithm and tuning it to the Pentium,
    we can increase its Elo to 2846 ± 35 at 1 second per move, 3109 ± 79 at 10 seconds
    per move, and 3180 ± 80 at 30 seconds per move.</i><p>So making it 30× <i>faster</i>
    would raise its 1-second Elo by about 334 points, and ln(30) is 3.4, so that&#x27;s
    about 100 points per factor of <i>e</i>.  ln(10) is 2.3, so we&#x27;d interpolate
    a prediction of 230 points gained at 10× faster, reasonably close to the 263 points
    reported.<p>If we extrapolate that in the other direction, ln(20) is 3.0, so on
    the 80386 we&#x27;d expect a loss of about 300 Elo points, down from 2846 to 2550
    or so.  Still enough to wipe the floor with Crafty, but low enough that Kasparov
    would usually beat it.<p>But we don&#x27;t really know if that extrapolation is
    valid.
