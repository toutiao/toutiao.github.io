  author: AimHere
  text: Much of what&#x27;s happening is less like &#x27;calculations in the back
    of their head&#x27; and more like &#x27;pattern recognition&#x27;. Chess masters
    are recalling ideas and motifs (not necessarily actual positions) from earlier
    games or practice or study, and this recall is allowing them to either prune the
    decision tree or prioritize investigating more fruitful branches faster than amateur
    players, who have to actually calculate things that are instantly &#x27;seen&#x27;
    by the better players.<p>This is a known thing among chess players, and even low-skilled
    players do it to some extent. A newbie to chess can (and almost every teacher
    will say &#x27;should&#x27;) work their pattern recognition by just solving tactical
    chess puzzles and very quickly improve at spotting things like one or two move
    checkmate patterns or forks or pins or whatever.<p>It&#x27;s more of a memory
    thing than subconscious calculation.
