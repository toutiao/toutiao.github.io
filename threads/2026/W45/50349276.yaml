  text: Nice post, thanks.<p>On a kinda similar note i always wander that about indie
    video games. We have this massive hits like balatro, vampire survivors, that easily
    could be made in the era of SNES or N64. But somehow we have to wait 30 years
    to get them.<p>It clearly wasn&#x27;t technical side of things that prevented
    that, but also I don&#x27;t believe it was lack of creativity.<p>Some could argue
    that it is just what art is, we will get every year some new thing, creating all
    &quot;possible and meaningful&quot; art right now isn&#x27;t even valid thing
    to consider, because art isn&#x27;t about exhausting a finite set of possibilities.<p>But
    at the other hand some mechanics, design solutions in the hindsight seem kinda
    obvious and make me wonder, what things we do not see now, but will look obvious
    to people 30 years from now.
