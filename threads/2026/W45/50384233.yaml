  text: 'You haven&#x27;t spotted that it&#x27;s regularly being released the month
    following the revision number.  (-:  Because Microsoft will of course have a release
    pipeline that things have to go through.<p>They&#x27;re not a positional notation.  It&#x27;s
    version 11.2605.91 recently.  It was 11.2605.81 earlier this year.  There was
    an 11.2605.71 and an 11.2605.61 before that.  Last year, there was a 11.2504.451
    .  The year before there was a 11.2402.32 .<p>Microsoft&#x27;s versioning systems
    are not 4 columns where a tick around of one increments the one before it.  The
    easiest way to think of them is madness made for marketing purposes.  (Windows
    NT starting at 3.1, for example.)  There is some logic to it, but nowadays it&#x27;s
    often four entirely different things jammed together, ticking around independently.  Like
    the version of Windows, the year and month of the release, and perhaps a daily
    build number or some such.<p>Windows NT itself has a monotonically increasing
    build number as part of its versioning that started some time in 1992 and is currently
    just over 26 thousand.'
