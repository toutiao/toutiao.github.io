  author: brailsafe
  text: 'At a glance, it looks to me like it&#x27;s <i>plausible</i> that a good chunk
    of the tail end of the age group who&#x27;d have had their wealth considered for
    the &lt;35 age bracket for both 2019 and 2022 would have aged into the next bracket
    for 2025 and taken their pandemic gains with them. Between 2022 and 2025, the
    35-44 bracket continued increasing, albeit at a slower rate, so things do not
    look optimistic comparatively.<p>The pandemic created a ton of wealth for whomever
    would&#x27;ve had the most money in the market at that time and the most stability,
    to the point where there&#x27;s basically no chance anyone else reaching those
    same ages after the pandemic could catch up without some miracle. Ya it&#x27;s
