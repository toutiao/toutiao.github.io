  content: |-
    [Benchmarks](/benchmarks) · [Net worth](/benchmarks/net-worth) · 30–33

    # Net worth for people aged 30–33 in the U.S.

    Total assets minus total debts — bank accounts, investments, retirement accounts and home equity, less mortgages, loans and cards.

    Modeled estimate · federal survey data
    Household-level figures: the underlying survey (Fed SCF) measures households, grouped by the reference person's age — combined for a couple, and they read high for a single person. [Why, and how this changes as live data grows](/methodology#unit-of-analysis).

    Median

    $68K

    Upper quarter

    $235K

    Top 10%

    $440K

    Half of people aged 30–33 in the U.S. have a net worth above **$68,000**. Reaching the upper quarter takes about **$235,000** , and the top 10% starts at **$440,000** — roughly 6.5× the median. The lower quarter sits below $7,100, and the bottom 10% is negative — more owed than owned.

    Just want the number? [Try the percentile calculator](/benchmarks/calculator?age=30-33) — no signup, nothing leaves your browser.
