  author: tzs
  text: If you would be using it just locally, as opposed for road trips, note that
    it has an LFP battery. LFP batteries are perfectly happy to be always charged
    to 100% and discharged down to 10% (lower is OK but most people want to keep some
    spare in case they aren&#x27;t able to charge when they expected to).<p>Lithium
    nickel batteries suffer accelerated aging at high charge and at low charge, so
    it is usually recommended to stay in the 80-20% range, only going to 100% shortly
    before a road trip.<p>A Slate with a 200 mile range operated 100-10% would give
    you 180 miles between charges. That would be the same range as a lithium nickel
    battery EV with a 300 mile range operated 80-20%.
