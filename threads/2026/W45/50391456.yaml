  author: tarheels100
  text: I used to think this way, but it turns out that EV trucks hold up on range
    better than one would expect thanks to regenerative breaking. The added weight
    of cargo requires more energy to get up to speed, but you get most of that back
    when breaking, so it&#x27;s not lost energy. Meanwhile, a gas or diesel truck&#x27;s
    range plummets when hauling since all the energy used to accelerate the load is
    lost in breaking. I&#x27;m not saying that EV hauling is perfect or a solved problem,
    but that the trades offs aren&#x27;t as intuitive as they might seem.
  score: 0
