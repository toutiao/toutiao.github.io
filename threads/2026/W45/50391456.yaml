    the build-up of CO2.<p>If you replace the oxygen in a room with an odorless gas
    non-oxygen gas, your body doesn&#x27;t tell you.  You don&#x27;t feel like you&#x27;re
    suffocating.  You just start suffering the effects of lack of oxygen.  Dizziness,
    confusion, lightheadedness, but you likely won&#x27;t realize anything is wrong.
    \ Your judgement and ability to react goes away and you lose consciousness without
    ever experiencing the desperate urge to breathe.<p>Another good example of this
    is when pilots fly too high without supplemental oxygen or adequate cabin pressurization
    and become hypoxic.  They become confused and lose coordination while feeling
    perfectly fine.  By the time they realize something is wrong, they may no longer
    be able to do anything about it."
