  author: dzwdz
  text: "I don't think sum types solve the fundamental issue here, i.e. I don't think\nMaybe<Hash>
    crypt(Password, Hash);\r\n\nwould be a good interface. Leaving the actual hash
    comparision to the user is error-prone. It'd be better to have two different functions
    - one for creating new hashes, and another for verifying them, which just returns
    a boolean. I think I first saw this in PHP, but OpenBSD does also happens to have
    these:\nint crypt_checkpass(const char *password, const char *hash);\r\nint crypt_newhash(const
    char *password, const char *pref, char *hash, size_t hashsize);\r\n\n(the int
    is basically a boolean, I assume it's this way to follow convention. I looked
    around tech@ a bit and it turns out tedu wrote a short article about this in 2014
    too)\n\nI'm also inclined to argue that, as specified, crypt could be treated
    as returning a sum type? It either returns nonnull char* or NULL, and static analyzers
    can tell if you're treating a nullable value as non-null (Maybe<T> as T).\nNow,
    the entire reason musl made this change is that ~nobody actually does this, and
    I do also think that C programs could benefit a lot from sum types (untagged unions
    suck) - but I also feel like defending C a tiny bit here."
