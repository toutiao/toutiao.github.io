  text: |-
    This is a bad writeup IMO. It never bothers to explain how the different changes combined to produce the vulnerability, nor does it explain the changes with enough fidelity for a reader to piece it together themselves:

    If the first 2012 change did what the prose claims, users with * shadow entries on musl non-PAM distros would have been vulnerable as soon as the second 2012 change landed. So why does the intro claim 2016? The answer is in one of the screenshots, but the page doesn't explain it: crypt() takes the hashed password (or, at least, the algorithm and salt at the beginning of the hashed password) as its second argument, and the first 2012 change made sure not to return a hash of * when the hashed password starts with *, presumably to avoid this exact bug.
    Because that wasn't explained, it's unclear from the page why the 2016 change affected anything. (Knowing the above, it's clear that passing a different user's algorithm and salt as crypt()'s second argument is what broke musl's safety check from 2012.)
    I'm confused by the 2022 change. As described, it seems like Alpine's root user wasn't actually vulnerable until 2022, so why does the writeup say 2016? I guess because it's about the underlying bug in OpenSSH/musl rather than exploitability in a specific distro, but that's misleading at best given that Alpine seems to be one of the few distros with a vulnerable configuration. It also doesn't bother to explain why a hash of ! broke key login, which seems relevant in reconstructing how the vulnerability came to be.

    The animations are also pretty useless. By showing the arguments and return value of crypt() in different scenarios, they could have illustrated the bug even without clear text. Alas, the 2012 one omits the arguments and the 2016 one omits the return value.
