    I agree its not explained well, but I disagree that a reader can't piece it together themselves. A coworker and I read and (we think) understood it.

    I'm confused by the 2022 change. As described, it seems like Alpine's root user wasn't actually vulnerable until 2022, so why does the writeup say 2016?

    The root account was locked with ! between 2016 and 2022. OpenSSH checks for locked accounts and doesn't allow you to login even with a key. However other user accounts configured with * as a placeholder in /etc/shadow were vulnerable in this time.
    The 2022 change made it so that the root account is no longer locked, but merely has * as the password hash placeholder, which should match no password ever but did in the musl crypt implementation.
