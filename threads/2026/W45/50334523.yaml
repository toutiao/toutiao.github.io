  text: This cultish nonsense is one reason I&#x27;ve stopped taking RISC-V seriously
    for desktop&#x2F;server usage. There are other reasons too:<p>- RISC-V is &quot;open&quot;,
    except in none of the ways that matter to me. What I want is a well-documented
    platform able to run fully open software. RISC-V does not inherently provide the
    former and the latter has nothing to do with ISA. If anything, manufacturers seem
    to take GPL-licensed software, modify it then _not_ publish the modified source
    code.<p>- Lately I&#x27;ve started to care a lot more about minimal software stacks
    that are easier to prove to work as intended. Part of that includes generating
    raw machine code and I hate the terrible immediate encoding especially for C instructions.
    Compare with x86-64 where you can just write the constant straight to memory.
    x86-64 would actually be a nice ISA if it were not for prefixes + lack of explicit
    instruction length.<p>- It seems there is an excessive focus on hardware &quot;simplicity&quot;
    (for very small cores) while neglecting simplicity on the software side. I would
    benefit greatly from automatic bounds checks, checked arithmetic... and many &quot;safe&quot;
    languages would too. This &quot;simplicity&quot; apparently is also why the immediate
    encoding is so ridiculous.
