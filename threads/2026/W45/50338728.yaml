    MixRank (YC S11) | Software Engineers | 100% Remote (Global) | Full-Time MixRank processes petabytes of data every month through web crawling. Hundreds of customers use our data products, including Google, Amazon, Facebook, Intel, and Adobe, across industries such as finance, recruiting, sales, marketing, and security. We’re a fully remote company with a global footprint across 20+ countries. We’re growing, profitable, employee-owned, and have no dependence on outside funding. Applicants from all geographies and backgrounds are welcome. We’re looking for passionate individuals for whom programming is not just a job, but something they genuinely love to do. We’re obsessed with computers, programming, big data, databases, compilers, hardware, math, data science, and the internet. Does this sound like you? Please apply to join our team. Our codebase is friendly to new contributors. You’ll have a fully functional development environment within hours through full automation and will be pushing commits on your first day. Deployments to production happen multiple times per day and finish in under two minutes.Effectively all of our codebase is written in Python, Rust, SQL, JavaScript&#x2F;TypeScript, and Nix. The core technologies you’ll need familiarity with to be productive are Python, PostgreSQL, Linux, and Git.
    We operate at a larger scale than typical startups. We run two datacenters with high-performance servers we’ve built ourselves, capable of handling the volumes of data we process. We’ve implemented our own distributed file system, perform full-scale web crawls, and download and run static analysis on the entire universe of published Android APKs and iOS IPAs.<p>Unlike a typical startup where you might spend half your time in meetings and the other half fixing Jira tickets, at MixRank you’ll challenge yourself with difficult technical problems that help you grow as an individual. We’re continuously hiring for the positions below; these aren’t singular roles that close once filled. Our philosophy is that the candidate is more important than the position. For each new member of the team, we design a custom role and responsibilities around their interests. Other companies may create a long list of specific requirements with the expectation that you’ll exactly replace someone on the team or fit a role defined by committee. MixRank is more pragmatic: we first get excited about bringing a unique individual onto the team, then figure out the best way to support their specific talents.<p>Junior Software Engineer - Remote (Global), Full-Time<p>We’re looking for remote junior engineers with 0–3 years of professional software experience and 5+ years of curiosity exploring computers, programming, and technical hobby projects.<p>This is an open-ended entry role with mentorship and diverse opportunities to work across all areas of our product: databases, distributed systems, infrastructure and tooling, data analysis, machine learning, frontend&#x2F;backend web development, APIs, data mining, data modeling, and more.<p>To stand out, please highlight what makes you unique: passion for computing, curiosity and side projects, work ethic, niche research, or anything else that shows how you think and build.<p>Ideally, you’ve already graduated. But if you still have one or more years left of school, please feel free to apply anyway. If you’re the right fit for the team, we’ll figure out a way to accommodate your schedule.<p>Apply here: <a href="https:&#x2F;&#x2F;www.ycombinator.com&#x2F;companies&#x2F;mixrank&#x2F;jobs&#x2F;Fnwsojk-j">https:&#x2F;&#x2F;www.ycombinator.com&#x2F;companies&#x2F;mixrank&#x2F;jobs&#x2F;Fnwsojk-j</a><p>Software Engineer - Remote (Global), Full-Time<p>We’re hiring generalist software engineers to work on web applications, data mining, machine learning&#x2F;data science, data transformation&#x2F;ETL, data modeling, database scaling, infrastructure, DevOps, and more. We’ll tailor the role to the subset of areas that best match your interests.<p>Beneficial experience includes PostgreSQL, Python, Rust, Linux, TypeScript, Nix, frontend&#x2F;backend web development, and data mining.<p>Apply here: <a href="https:&#x2F;&#x2F;www.ycombinator.com&#x2F;companies&#x2F;mixrank&#x2F;jobs&#x2F;RXQspen-s">https:&#x2F;&#x2F;www.ycombinator.com&#x2F;companies&#x2F;mixrank&#x2F;jobs&#x2F;RXQspen-s</a><p>I’m Kiran, Chief of Staff at MixRank, a fully remote data startup building go-to-market intelligence. We’re US-incorporated but hire globally, and we’re bringing on new teammates to join a fast-moving team with real ownership and impact.
