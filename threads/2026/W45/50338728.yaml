    Opsin Security | Product, Backend &amp; AI Engineers | Full-time | $175K–$250K base + equity | Hybrid &#x2F; REMOTE (US) | Visa sponsorship<p>I’m Shay, a founding engineer at Opsin. We build security software that helps enterprises understand which AI agents they have, what those agents can access, and where they pose a risk. We recently raised funding (<a href="https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;blog&#x2F;opsin-raises-21m-to-expand-its-risk-protection-layer" rel="nofollow">https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;blog&#x2F;opsin-raises-21m-to-expan...</a>) and are growing our engineering team.<p>We’re hiring across three roles, from 3+ years of experience through Staff level:
    - Product Engineer: Build customer-facing features end to end, from understanding the problem to shipping and iterating. <a href="https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;jobs&#x2F;product-engineer" rel="nofollow">https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;jobs&#x2F;product-engineer</a>
    - Backend Engineer: Build and operate APIs, services, and data workflows behind our security platform. <a href="https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;jobs&#x2F;backend-engineer" rel="nofollow">https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;jobs&#x2F;backend-engineer</a>
    - AI Engineer: Build production AI systems that evaluate agents and turn identity, permissions, data, and activity into explainable risk insights. <a href="https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;jobs&#x2F;ai-engineer" rel="nofollow">https:&#x2F;&#x2F;www.opsinsecurity.com&#x2F;jobs&#x2F;ai-engineer</a><p>Location: San Francisco &#x2F; San Jose preferred; Boston and NYC areas also welcome. Hybrid means 2–3 days together in person each week. Fully remote within the US is also possible for the right person.<p>Compensation: $175K–$250K annual base, depending on level and qualifications, plus meaningful early-stage equity and comprehensive benefits through Justworks. Visa sponsorship available.<p>Apply: careers@opsinsecurity.com. No agencies, please.
