  text: 'ArtCraft | Senior Engineers | SF (Onsite) &#x2F; Atlanta (Onsite) | $150-$250k
    + Equity | <a href="https:&#x2F;&#x2F;getartcraft.com" rel="nofollow">https:&#x2F;&#x2F;getartcraft.com</a><p>Those
    fucking rent-seeking hyperscalers took the internet away from you, and we’re going
    to give it back to you and to everyone.<p>Web 1.0 was great - we had IRC, file
    sharing, third party chat clients. There were personal websites, forums. Flash
    was a format kids could use. Everything supported embedding and uploading. Websites
    actually had APIs and RSS. File sharing, FTP, MP3s, discs, owned media.<p>Broadband
    brought our parents and grandparents online, but the shift to the non-technical
    majority created an opportunity to grossly oversimplify everything. Everything
    dumbed down into a pre-packaged product. Startups began turning their offerings
    into walled gardens. Platforms took precedence over protocols. APIs and access
    and data export went away. And then the rent-seeking began. The era of ownership
    ended.<p>Corporate Memphis. Jesus Christ.<p>We’ve rallied a massive community
    to build MIT&#x2F;Apache-licensed alternatives to Adobe, Microsoft Office, Google
    Workspace, Autodesk, SolidWorks, Slack, Discord, Unreal Engine, OpenRouter, RunPod,
    and more. The goal is full feature parity, with code anyone can own, inspect,
    modify, and build on.<p>We’re digesting second-class apps and platforms into first-class
    applications, libraries, and APIs with full MCP support. We’re distilling out
    the good parts, and we’re building the connective tissue that draws them together.<p>100%
    of the internet is going to be open source soon, and we’re going to force it open.
    Loudly.<p>We have eight figures in run rate revenue, over 20M app downloads and
    growing. Our community is the best part, and it’s energetic like a wildfire. Everyone
    resonates with our mission.<p>We’re missionaries, not mercenaries. We are going
    to slay the incumbents by being better. Our motto is Google’s old motto - “Don&#x27;t
    be evil (tm)”.<p>We’re a tiny team looking for strong engineers to own major parts
    of the product: desktop apps, lots of completely open source backend infrastructure,
    agent workflows, agentic app factories. Stack: Rust, a sprinkle of TypeScript&#x2F;React,
    egui, Tauri, MySQL&#x2F;Postgres, Redis, Elasticsearch, Kubernetes. Lots and lots
    of Rust. We’re systems engineers by trade, but we like to vibe code Rust. Did
    I say Rust? Rust. Rust Rust Rust. Maybe that&#x27;s a filter.<p>You have to be
    self-directed and independent. If you want to open source Salesforce with half
    your time, do it! If you want to work on Solidworks 3D printing applications,
    great! Writing music apps and DAWs? Go for it! Custom Discord&#x2F;Slack clients
    for our custom, completely open source chat API and platform? Hell yeah. Our organization
    is flat, and we&#x27;re going to go after everybody and everything.<p>Everything
    you build here will be open source. We have no private repos.<p>We can reclaim
    the internet. That’s our mission.<p>Want to know more about us? Look up “Adobe
    ArtCraft” on YouTube &#x2F; TikTok &#x2F; your platform of choice.<p>If this resonates
    with you, email hn@storyteller.ai with your Github, a little about yourself and
    something you’ve built. Write the sentence, “don’t take my RAM, Sam!” so we know
    you’re one of the good guys.'
