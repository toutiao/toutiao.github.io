    - Own inbound leads and respond fast. Screen for fit first: are they on an EMR we integrate with, and is Strello the right answer for their phones?<p>- Run discovery and demo calls with physicians and clinic managers, then quote, close, send contracts and payment links, and keep the CRM current.<p>- Lead onboarding: workflow meetings with clinic staff, phone and EMR access, and launch coordination with our engineers.<p>- Stay the go-to contact after launch, and bring what you hear back to the product team.<p>You might be a fit if you&#x27;ve worked in sales, or clinic operations (MOA, coordinator, manager), or healthcare SaaS account management, or customer success.<p>You should be comfortable on the phone and on video with physicians, organized enough to run many clinics in parallel, and happy to help write the playbook at an early-stage company.<p>Apply: reza@strello.health with a few lines on the clinics or customers you&#x27;ve worked with.
