  author: possibilistic
  text: I&#x27;m modeling ourselves after Valve, which strongly emphasizes on-site.
    Valve gives its folks tons of latitude and freedom in exchange for working together
    in a tightly-knit culture.<p>I&#x27;m not a stickler for showing up to work on
    time, and I&#x27;m a late riser &#x2F; night owl myself. But the energy of being
    in a room together physically is extremely hard to beat.<p>I&#x27;m not doing
    this to micro-manage. I don&#x27;t have time for that. I&#x27;m doing this to
    be a better version of myself. I get energy from working close to others, and
    I voraciously learn from my peers. I want people teaching me and helping me be
    better every single day. That might be selfish, but I thrive in that environment.<p>What
    we&#x27;re doing is weird and experimental and there&#x27;s a metric ton of discovery
    in literally every path we take. A culture built around documenting and reading
    notes isn&#x27;t going to be fast enough. I&#x27;m more hands on than someone
    who can write 6-pagers and read everyone else&#x27;s - like Shia LaBeouf&#x27;s
    &quot;just do it&quot; energy.<p>I understand that this isn&#x27;t a great fit
    for everyone, and I&#x27;m sorry.<p>I&#x27;m not allergic to remote once we&#x27;re
    bigger, but we have an enormous mandate, and I want us to tackle it like an RPG
    final boss in the trenches together. We have a lot to build and prove and learn.
    Doing it together in person reduces the network hop effects and leads to more
    serendipity and exchange.<p>In a years&#x27; time, I want us to have built open
    source alternatives to large portions of the most used software. I want us to
    create a considerable shake up. I want us to have built new infrastructure to
    make the web more distributed and more P2P.<p>I think we stand a better chance
    if we&#x27;re in a room together, hacking and engineering together. That&#x27;s
    what my gut tells me.<p>I make films too, and that&#x27;s frankly something that
    could never be fully remote.
