    Memorang | Product Engineers + Technical Project Manager | Full-Time | Los Angeles (or US remote for exceptional hires)<p>Memorang is an &quot;AI stack for education&quot; that helps organizations build, launch, and monetize AI-powered learning and assessment products. Think Vercel plus Shopify for EdTech. We currently operate on an enterprise model, serving as the AI technology and commercial partner behind new product lines for organizations like ETS, McGraw-Hill, Pearson, and the ACT.<p>We’re hiring for two roles:<p>Product Engineers
    Own features from the first rough idea to production. You’ll work across AI workflows, backend systems, and user interfaces, making product decisions along the way. We’re looking for engineers who ask good questions, care about the details users notice, and can turn an ambiguous problem into something useful and shipped.<p>Stack: TypeScript, React&#x2F;Next.js, React Native, Node.js, AWS Lambda, Postgres, and Neo4j.<p>Technical Project Manager
    Turn complex work into clear plans and keep delivery moving. You’ll coordinate across engineering, design, and customer needs, surface dependencies early, resolve blockers, and keep owners and timelines clear as priorities change.<p>Ideal background: an engineer who moved into project management, with startup experience and enough technical depth to discuss APIs, architecture, and AI workflows with the people building them.<p>Why join?
    A small team, meaningful ownership, and products used by millions. You’ll help shape what we build and how we work, with a short path from an idea to seeing it in users’ hands.<p>Remote-first, async-friendly, with health and wellness stipends, home-office support, and paid time off.<p>Apply: Email careers@memorang.com with your CV, a few sentences about what interests you, and something you’re proud to have built or delivered.
