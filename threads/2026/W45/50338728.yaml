    Data Micro Technologies | Multiple Roles (OT, Networking, Security) | Jacksonville, FL | ONSITE<p>Data Micro Technologies provides specialized systems engineering, operational technology (OT), and infrastructure consulting.<p>The interview process will not be long and drawn out. We want to fill these roles quickly.
    We are actively hiring for the following roles:<p>1. Automation Network Engineer (1-Year Contract | Onsite)
    Designing and maintaining isolated network environments for automation, virtualization (Proxmox SDN), and on-prem Kubernetes clusters.
    - Stack&#x2F;Focus: SONiC (SonicNOS), Edgecore DCS202, SSE-C4632 100G switching, Linux administration, L2&#x2F;L3 segmentation, GitOps workflows.
    - Requirements: 5–7 years experience in data center&#x2F;industrial networking, container networking, and high-availability switch architectures.<p>2. Systems Engineer – Warehouse Automation &amp; OT ($105k | 1-Year Contract-to-Hire | Onsite)
    Bridging warehouse-floor industrial automation with IT&#x2F;OT infrastructure at the Deerwood campus and the new automated distribution center near JAX. Potential conversion to J&amp;J Vision Staff Engineer.
    - Stack&#x2F;Focus: Allen-Bradley&#x2F;Rockwell (ControlLogix, FactoryTalk, ladder logic), WMS&#x2F;WCS, conveyors, sortation, ASRS, and OT infrastructure.
    - Requirements: 5+ years in industrial automation&#x2F;systems engineering with 3+ years in PLC&#x2F;controls troubleshooting and automated material handling environments (FDA&#x2F;cGMP a plus).<p>3. Senior Cyber Security Risk and Governance Analyst – OT Supply Chain (90k–105k | Full-time | Onsite)
    Securing OT&#x2F;IT environments across manufacturing and supply chain operations; driving risk remediation in highly regulated medical device environments.
    - Stack&#x2F;Focus: OT&#x2F;ICS security, CSRI risk assessments, application whitelisting, Active Directory, network change reviews, vendor risk.
    - Requirements: 2+ years hands-on in security&#x2F;risk within manufacturing or OT environments; familiarity with NIST, ISA&#x2F;IEC 62443, or CIS Controls.<p>To apply: Send your resume to chase@datamicrotn.com with the role title in the subject line.
