  text: 'Paramark | Software Engineer (L4) | San Francisco HYBRID (3 days&#x2F;wk)
    or REMOTE (US) | Full-time | $199K–$249K + equity<p>Paramark helps Marketing teams
    optimize spend across all of their channels and programs. There are proven scientific
    ways to do this, but they are poorly understood and practiced by only a tiny fraction
    of teams. Our product ingests data from all of our customers&#x27; marketing channels
    and uses it to train open-source ML models for both measurement and experimentation.  This
    makes it possible for any marketer to use these methods.<p>In this domain, it&#x27;s
    hard to figure out what to build, and it&#x27;s even harder to be both accurate
    and simple. You&#x27;ll be joining a small team -- we have four product engineers.
    That means owning systems end to end and having real influence over what gets
    built. Your typical project will start with a high level goal, and you will figure
    out the rest.<p>Founded 2023, ~16 people, $8M from Greylock, cash-flow positive.
    Reasonable working hours: when the Mercury News covered the return of 996 culture,
    we were the counterexample. &quot;We don&#x27;t think early stage startup life
    requires 18-hour days, or even 12-hour days.&quot; <a href="https:&#x2F;&#x2F;www.mercurynews.com&#x2F;2025&#x2F;08&#x2F;25&#x2F;silicon-valley-startup-grind-long-hours&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.mercurynews.com&#x2F;2025&#x2F;08&#x2F;25&#x2F;silicon-valley-startu...</a>.
    4 weeks PTO plus federal holidays, medical&#x2F;dental&#x2F;vision (100% of employee
    premiums, 50% for family).<p>Looking for 8+ years, full-stack. Some exposure to
    statistics, experimentation, or A&#x2F;B testing helps.<p>Stack: TypeScript, React,
    Python, Postgres.  Google Cloud, Kubernetes, FastAPI, taskiq.<p>Process: intro
    call; technical phone screen; one-day onsite in SF (travel covered for remote
    candidates)<p>In-person: <a href="https:&#x2F;&#x2F;paramark.com&#x2F;careers&#x2F;software-engineer-l4"
    rel="nofollow">https:&#x2F;&#x2F;paramark.com&#x2F;careers&#x2F;software-engineer-l4</a><p>Remote:
