  text: 'Paradromics | Embedded Software Engineer | Austin, TX or Oakland, CA | Onsite
    | Full-time<p>Paradromics is building a high bandwidth brain-machine interface
    for clinical use. The implant we built is restoring function to patients by streaming
    out neural data from specific brain regions in real time, which we convert to
    e.g. speech using machine learning. Check out our recent article in the NYT: <a
    href="https:&#x2F;&#x2F;archive.ph&#x2F;C6CRb" rel="nofollow">https:&#x2F;&#x2F;archive.ph&#x2F;C6CRb</a>
    .<p>We&#x27;re looking for help in further developing and hardening our embedded
    Linux components, which work in tandem with FPGAs and our custom ASICs to read
    out neural data. Some of the ongoing efforts are: HIL testing on real devices,
    integrating new sensor ASICs, maintaining our Yocto build system, exploratory
    work on prototypes, improving our clinical UX, and improving the core code that
    receives and massages data. The code is largely written in Rust with a little
    Typescript, (and bash, and bitbake recipes, etc).<p>You&#x27;ll be expected to
    have experience constructing reliable and understandable software in Linux, and
    some level of experience in building and interacting with embedded hardware. Rust
    experience is ideal but not necessary. We&#x27;re not looking for a specific number
    of YoE, but for motivated and hungry engineers who want to push the frontier of
    brain-machine interfaces.<p>To apply visit <a href="https:&#x2F;&#x2F;paradromicsinc.applytojob.com&#x2F;apply&#x2F;u5hXN4N9ID&#x2F;Embedded-Software-Engineer"
    rel="nofollow">https:&#x2F;&#x2F;paradromicsinc.applytojob.com&#x2F;apply&#x2F;u5hXN4N9ID&#x2F;Embed...</a>
    or email your resume and a little about yourself to me, ehuber@paradromics.com
    . I&#x27;ll be glad to hear from you!'
