    Distru is the #1 ERP in the cannabis industry. $3.5B in annual GMV flows through our platform, and most of the top cannabis brands and distributors in the US run their entire operation on us to stay compliant.<p>We&#x27;re profitable, stable, and growing. No runway anxiety, and we&#x27;re reinvesting deeply into our AI transformation. We are building our product into an AI first ERP with a headless suite, MCP, unified data layer, and agents built for commerce. AI is at an inflection point for enterprise use cases and the System of Record (SOR) has never been more valuable. We want to build the best all in one AI stack for commerce operations.<p>We are investing in our internal AI transformation with premium accounts for Claude, ChatGPT, and Cursor&#x2F;Grok. We encourage people to go to AI conferences + use budget to experiment with AI.<p>We&#x27;re an intrinsically motivated team that works without ego, is constantly learning, and genuinely cares about our people (5&#x2F;5 on Glassdoor). We take a lot of pride in our human first culture. AI is cool, but people are cooler.<p>The roles: We&#x27;re looking for technically minded builders in all of our roles. You&#x27;ll own mission-critical parts of the AI product suite end to end, from planning and design through implementation, testing, and shipping. You will be on the front lines of experimenting with new product experiences built with AI. Implementing new tooling + infrastructure to help scale our agents and ensure consistency.<p>Stack: React + TypeScript, Elixir&#x2F;Phoenix + GraphQL, PostgreSQL, React Native, LangGraph, Python<p>Please apply at <a href="https:&#x2F;&#x2F;distru.com&#x2F;careers" rel="nofollow">https:&#x2F;&#x2F;distru.com&#x2F;careers</a> and mention Hacker News!
