  text: 'Stratirus (a Tennetech company) | AI Developer + Linux Admin (junior to mid)
    | REMOTE (US only, Central Time hours) | US work authorization required, no sponsorship
    | Full-time or part-time, contract or hire | $65k to $100k | No agencies<p>Our
    optional take-home is a broken Ubuntu server: a service that won&#x27;t stay up,
    a nightly report that hasn&#x27;t gone out in days, and a disk that keeps filling.
    Fix it, write a script that heals a fresh box, and build a small read-only MCP
    tool so an AI agent can check on it. 60 to 90 minutes, unpaid, no LeetCode. If
    that sounds like fun, read on.<p>We&#x27;re a small and growing AI and Microsoft
    365 consultancy in Franklin, TN. We build AI agents and automation for small and
    mid-sized businesses, and harden and run the systems underneath: Microsoft 365
    tenants, SharePoint, and Linux boxes. We&#x27;re AI-agnostic and use what fits
    the client, mostly Claude Code, the Microsoft 365 stack with Copilot and Copilot
    Studio, Gemini and Gemini Studio, and Oracle OBI. The role is about 60% agent
    development (MCP servers, Claude Code, Copilot Studio, Power Automate, Gemini)
    and 40% Ubuntu administration (systemd, Docker, patching, backups, monitoring).
    PeopleSoft experience is a plus. You&#x27;ll work directly with clients, so explaining
    things clearly to a small-business owner matters as much as the code. Early-career
    and career-switchers welcome.<p>We expect you to use AI every day. What we hire
    for is knowing when it&#x27;s wrong, so one of our three application questions
    asks about a time it fooled you.<p>To apply, email your resume to hiring@stratirus.com
    with short answers to: a time a client or boss made an unreasonable demand and
    how you handled it; a time an AI confidently gave you a wrong answer you followed,
    and how you caught it; and something you&#x27;ve built with AI that you still
    use. Work samples get strong preference. We read every application ourselves and
    reply to everyone, so please write your answers yourself.<p>Process: email application,
    a 45-minute video call where you walk us through something you&#x27;ve built,
    then a conversation about the role.<p>Remote within the US only, Central Time
    business hours. Must be legally authorized to work in the US without visa sponsorship,
    now or in the future. No recruiters or agencies, please.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;Stratirus&#x2F;ops-agent-challenge"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;Stratirus&#x2F;ops-agent-challenge</a><p>Questions:
    hiring@stratirus.com'
