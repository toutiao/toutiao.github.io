    Oh dear, this is the kind of slapstick that’s so painfully cringe it’s just sad.
    I was a bit surprised by the early history: my guess would have been that killing a negative PID was introduced with the rest of the process group / job control features in BSD in the early 1980s. So I had a look in the CSRG archives:


    userland kill(1) gained support in 1986 (same year as mentioned in the article) with a terse note that the kernel already supported it https://svnweb.freebsd.org/csrg/bin/kill/kill.c?r1=22692&r2=27200


    the kernel code was provided by Sun the previous year https://svnweb.freebsd.org/csrg?view=revision&revision=18336


    the man page (also 1985) says the feature was added for compatibility with System V https://svnweb.freebsd.org/csrg/lib/libc/sys/kill.2?r1=20034&r2=20999


    I don’t know of an archive of System V source code from the 1980s so that’s as far as I’ll look.
