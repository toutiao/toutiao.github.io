  content: "Skip to main content\n\n# How we’re training a Figma-fluent editing model\n\n-
    Inside Figma\n\n- Engineering\n\n- Figma agent\n\n- AI\n\n- News\n\nWe’ve increasingly
    seen that specialized post-training can compete with frontier models. Here, we’re
    sharing the research behind how we’re translating that to design editing workflows.\n\n##
    Share How we’re training a Figma-fluent editing model\n\nIllustrations by Pete
    Gamlen\n\nDesigners use Figma for a wide range of work, from exploring a new idea
    to building out an entire product. But a lot of the everyday work is smaller,
    more iterative, and often non-verifiable. Adjust the spacing. Change a color.
    Rework a layout after someone leaves feedback. Each change builds on decisions
    made along the way. That’s why when we set out to build the Figma agentThe Figma
    design agent is hereStarting today, work with an agent that is built for Figma—directly
    on the canvas., we started with a focused task: help designers make edits to the
    work already on their canvas.\n\n### The Figma design agent is here\n\nStarting
    today, work with an agent that is built for Figma—directly on the canvas.\n\nPrompt:
    Insert location tag component to the top left of the photo\n\nOutput: The requested
    location tag is present, legible, and contained; unrelated content is preserved\n\nWe
    wanted our agent to be both better at design and faster at those edits. And because
    designers make them throughout the day, speed matters. An edit that takes too
    long can interrupt the very workflow it’s supposed to help.\n\n## Teaching a model
    to edit in Figma\n\nWhen we started this work, frontier models couldn’t understand
    Figma syntax, and getting this to work would take a lot of system prompting that
    would be incredibly token-consumptive. Instead, we invested in supervised fine-tuning
    (SFT). Each training example paired a starting design with a generated synthetic
    edit request and a successful example of the change. We represented designs in
    Figma’s native file format, so the model learned to produce changes we could apply
    back to the canvas. When tasks required design system assets, we generated synthetic
    prompts covering changes to themes and components.\n\nWe then used larger teacher
    models to attempt those edits, checking the candidates with deterministic validators
    and visual model judges, including checks for valid output and request fulfillment.
    The generation pipeline could self-heal and revise an edit using evaluator feedback.\n\nThat
    approach got us surprisingly far. We were even able to get one of our earlier
    Llama 3.3 70B models, trained on more than 250,000 examples, to be competitive
    on editing tasks with top models at the time!\n\nOur earliest SFT pipeline\n\nBut
    since then, we’ve moved towards more capable base models including the newer Qwen
    models, Muse Spark Open, Inkling, and others. We also ran up against limits to
    using SFT alone for this particular objective. Imitation learning teaches the
    model to produce designs very similar to what it saw in training at the cost of
    loss of generalization. Plus, it was less sample efficient, which means training
    takes a lot of examples covering various facets of the task. So we’re also investing
    in Reinforcement Learning (RL) as part of our latest training recipe. Our focus
    is on better RL environments for the design domain, pushing on the overall diversity
    of examples we train on, shaping our reward models, and expanding our expert-written
    criteria so those rewards reflect what designers actually care about.\n\n## How
    we evaluate design edits\n\nTo determine whether a model is a good starting point,
    we run it through our internal evals. We care not only about how well it can work
    in Figma, follow instructions, and make useful changes to existing designs, but
    also the speed and cost of doing that work.\n\nGreat design is often subjective,
    but that doesn’t mean we have to treat quality as one unmeasurable thing. A design
    can have good alignment and poor contrast. An edit can look polished and still
    miss the request. A button can look right while using the wrong component.\n\nThe
    examples below show common errors with AI-generated designs:\n\nOverlapping icons
    and text\n\nClipped arrows\n\nOverlapping text elements\n\nWe evaluate those dimensions
    separately. We combine checks on the design’s structure with visual judges, then
    use expert designers to calibrate and review the results. That helps us understand
    where a model succeeds and what it still needs to learn.\n\nFor example, here
    are how several top models score on our internal Figma editing evals. Again, this
    is just one input among many we use to decide which models to consider using in
    our product.\n\nComparing the latest unreleased Figma edits model, post-trained
    on Qwen 3.8 27B with other third-party models on design editing tasks\n\n## Where
    this model fits in the Figma agent\n\nEarlier this month, we rolled out the Figma
    agent to all users3 ways product designers use the Figma agent for craft, speed,
    and creative expressionHere’s how teams at Uber, Granola, and Atlassian support
    high-quality, fast-moving work with the Figma agent, now generally available.,
    and it includes our first-party editing model. The agent runs both this specialized
    model and leading third-party models, using them for different parts of the work.
    For certain tasks like image generation, vectors, or brand new design explorations,
    we use the best third-party model available. For precise edits and iterations
    that our model handles well, we use our own.\n\n### 3 ways product designers use
    the Figma agent for craft, speed, and creative expression\n\nHere’s how teams
    at Uber, Granola, and Atlassian support high-quality, fast-moving work with the
    Figma agent, now generally available.\n\nThe surrounding canvas matters, too.
    The agent needs context from the canvas and the design system, along with tools
    that can make the requested changes. Post-training helps the model do its part
    of that work better.\n\nLearn more about how product designers use the Figma agent
    for craft, speed, and creative expression.\n\nWe’re encouraged by early results
    we’ve seen with the Figma agent. Even in the time between beta to general availability,
    typical tasks are about 20% faster. In head-to-head testing with expert designers,
    the new agent beats or matches the previous production agent 62% of the time.
    User ratings are 33% higher, and users undo the agent’s work 60% less often.\n\nWe’ve
    more than doubled the share of work powered by our own post-trained design model.
    And we’ve reduced the average cost per message. Those gains come from improvements
    across the agent, including the models, tools, and harness. Our editing model
    is one part of that progress, and it gives us a way to keep improving the tasks
    designers repeat most often.\n\n## Where we go next\n\nThis work has demonstrated
    that post-trained models can compete with frontier models on a specialized task
    like Figma editing. Starting with a focused problem allows us to turn progress
    into meaningful product updates for our users so they can spend less time managing
    individual edits and more time bringing their vision to life.\n\nIf you’re interested
    in design and post-training models for non-verifiable domains, check out our open
    roles—we’re hiring.\n\nWe train in a way that respects customer privacy and preferences.
    You can learn more about our approach here.\n\nJosh Clemm is Vice President of
    Engineering, overseeing Figma’s AI platform and context layer. Prior to joining
    Figma in 2026, Josh was VP of Engineering at Dropbox, responsible for AI engineering.
    Before that, he had a long tenure leading engineering for Uber Eats.\n\n## Subscribe
