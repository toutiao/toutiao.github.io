  author: miguel-muniz
  text: I&#x27;ve used various combinations of Codex, Claude Code, GitHub Copilot,
    Figma&#x27;s MCP, Figma Agent, Pen.dev, and Paper.design for product design. I
    have previous experience with front-end dev so I&#x27;m more technical than the
    average product designer.<p>In my experience, Figma Agent and Figma&#x27;s MCP
    leave something to be desired. I&#x27;m sure Figma Agent is useful for people
    who haven&#x27;t used Claude Code or similar before, but it really requires most
    of your product&#x27;s context to exist in Figma for it to do well.<p>As soon
    as your product&#x27;s context exists out of Figma, then it starts to drift and
    hallucinate its own styles. Using the MCP with an AI that has access to your code
    provides better results, but even it will have trouble remembering what page I&#x27;m
    asking it to edit.<p>I know they&#x27;re trying to address this by adding features
    such as guidelines and specs, along with linking your Figma files to GitHub repos,
    but my complaint with these features is a lot of the companies I have worked for
    do not use the very specific tech stack that Figma supports with these features.
    If it&#x27;s anything like code connect, it may take years to get more broad support.
    Every company I have worked for is a C# Microsoft&#x2F;Azure house.<p>This does
    not help with my broader frustration with Figma which is there is a lack of focus&#x2F;vision.
    They&#x27;re trying to compete on all fronts by developing all these different
    products&#x2F;features and it doesn&#x27;t really feel like they have a cohesive
    story for what the future or product design is. Granted, I think most of us in
    this industry don&#x27;t either, but when am I supposed to use Figma Make vs.
    Figma Agent vs. Code layers?<p>They keep blurring the line between them when in
    all honesty I&#x27;m more interested in just using the AI agent I pay for to code
    what I need and bring it into a canvas for archiving&#x2F;exploration when I need
    it.
