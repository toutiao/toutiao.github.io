  author: xoa
  text: "&gt;<i>Are you saying &quot;vibe-coded slop&quot; because of the quality
    of the end result? Who cares if it gives you the features with good-enough performance?</i><p>There
    are a few significant reasons worth considering when getting down to the level
    of OS and hardware drivers. Long term maintainability is one. But another big
    one is that such software is capable of physically and permanently destroying
    the hardware it&#x27;s operating on, with the textbook example for Macs being
    the speakers found in Macbooks. The only way to get the kind of performance they
    offer out of that physically light&#x2F;thin package is to give them the power
    to destroy themselves if run at full force continuously but then run it from software
    so that they aren&#x27;t run at full force continuously, but rather take advantage
    of the headroom that offers for very brief audio spikes whose overall integrated
    power still falls below safe limits. This all needs to be done from software since
    response of real world analog isn&#x27;t instant. That enables much more range
    then if they were hardware capped at the maximum level they could run constantly,
    but it also means that if they&#x27;re driven wrong, poof. The drivers have to
    <i>never</i> go to certain bad states, purely from software.<p>LLMs can&#x27;t
    offer those kinds of guarantees, they don&#x27;t really &quot;know&quot; how things
    work and then produce something deterministic off of that. It&#x27;s even worse
    if, as-is the case with this sort of vibecoding effort, the LLM operator is in
    fact depending on the LLM for that part because they don&#x27;t know how it really
    works either (vs someone who is just using it for boiler plate and knows exactly
    where the critical paths are).<p>Obviously everyone is welcome to roll the dice
    with their own hardware as they wish, and it may be ok. Or if using really old
    hardware one might just not care. And not all hardware is as sensitive as modern
    notebooks of course. Just be aware the analog world can be messy and you might
    not actually have the guardrails to screw up that you&#x27;re used to in a higher
    level software environment.<p>&gt;<i>Otherwise one can also say Asahi is compiler-generated
    slop compared to hand written assembler code.</i><p>No, one cannot say that. Or
    at least not without looking really stupid."
  score: 0
