  content: "# [Tracker. The biggest update yet](/t/tracker-the-biggest-update-yet/25120)\n\n[Announcements](/c/announcements/10)\n\n[tracker](https://backstage.polyend.com/tag/tracker),
    [mini](https://backstage.polyend.com/tag/mini), [tracker-plus](https://backstage.polyend.com/tag/tracker-plus)\n\n[Arek](https://backstage.polyend.com/u/Arek)1\n\n#
    Polyend releases the Tracker firmware source code\n\n[![tracker](https://backstage.polyend.com/uploads/default/optimized/2X/c/c8b0c5d69102af68a9917ba47dd1a7d629218a20_2_690x460.jpeg)\ntracker1920×1281
    145 KB\n](https://backstage.polyend.com/uploads/default/original/2X/c/c8b0c5d69102af68a9917ba47dd1a7d629218a20.jpeg
    \"tracker\")\n\nToday we’re publishing the firmware source code for the original
    Tracker, Tracker+ and Tracker Mini on GitHub. We’re also releasing **Tracker Community
    Edition 1.0** with tons of new features and improvements. You can install it on
    any of the three instruments, modify the firmware yourself and share your own
    version. We’ve built in a recovery system to keep a faulty firmware build from
    bricking your Tracker.  \n[Explore the Tracker Community Edition repository on
    GitHub](https://github.com/polyend/tracker-ce)\n\n> “Here at Polyend, creativity
    is what we value most. We’ve seen it firsthand in the unofficial Tracker mods
    you’ve built, and we’re sharing the firmware source code to support that work.
    \ \n> Maybe you want to build an entirely new instrument on the Tracker hardware.
    Or maybe there’s just one thing you wish your Tracker did differently. Either
    way, you can now try it on the unit you already own. I bet some of you already
    have ideas for the original Tracker that never crossed our minds.”  \n> **Piotr
    Raczyński, CEO of Polyend**\n\nWhat’s new in Community Edition 1.0\n\n[![](https://img.youtube.com/vi/LFv-LZgRjkA/maxresdefault.jpg
    \"Tracker. The Biggest Update Yet.\")](https://www.youtube.com/watch?v=LFv-LZgRjkA)\n\n-
    **Stream long samples from the SD card.** Bring full-length stems, loops and field
    recordings into a project using a fraction of the sample memory they’d normally
    need. This works even on the original Tracker.\n- **Record timing and velocity
    while keeping both step FX slots free.** Micro-move and Volume now have dedicated
    fields on every step. New Chance conditions let you bring in a snare fill every
    fourth pass.\n- **Load plugins in the Sample Editor.** Six effects and generators
    are included, from an analog-style kick generator to a stereo delay. The plugin
    SDK lets you build, share and sell your own.\n- **Play two new synths on Tracker+
    and Tracker Mini.**  **CHIP** and **DIRT** join the synth lineup. A new SDK lets
    you build your own synth engines.\n\nAll three models also get wavetable envelopes
    and LFOs, faster project loading and saving, and tighter MIDI clock timing. You
    can design custom Tracker themes and fonts in your browser.  \n[See all the new
    features, improvements and fixes in the full changelog](https://github.com/polyend/tracker-ce/blob/main/CHANGELOG.md)\n\n22
    Likes\n\n[Free up FX slots by moving Velocity and Gate into the Note parameter](https://backstage.polyend.com/t/free-up-fx-slots-by-moving-velocity-and-gate-into-the-note-parameter/11816/25)\n\n[More
    than 2 step fx (Tracker Mini and Plus)](https://backstage.polyend.com/t/more-than-2-step-fx-tracker-mini-and-plus/8577/53)\n\n[Convert
    samples to mono](https://backstage.polyend.com/t/convert-samples-to-mono/9091/36)\n\n[Offline
    synths for sample creation](https://backstage.polyend.com/t/offline-synths-for-sample-creation/7957/17)\n\n[Expand
    Envelope / LFO shapes (akin to the wavetables in XAOC Zadar)](https://backstage.polyend.com/t/expand-envelope-lfo-shapes-akin-to-the-wavetables-in-xaoc-zadar/4430/12)\n\n[Possibility
    to have more and more accessible color schemes](https://backstage.polyend.com/t/possibility-to-have-more-and-more-accessible-color-schemes/872/26)\n\n[Beat
    Slice mode allowing to play through to end of sample](https://backstage.polyend.com/t/beat-slice-mode-allowing-to-play-through-to-end-of-sample/890/43)\n\n[Granular
    Length Step FX](https://backstage.polyend.com/t/granular-length-step-fx/760/23)\n\n[Change
    Envelope Automation Values via StepFX](https://backstage.polyend.com/t/change-envelope-automation-values-via-stepfx/4361/13)\n\n[Live
    recording - Ability to disable OFF commands](https://backstage.polyend.com/t/live-recording-ability-to-disable-off-commands/7780/67)\n\n[A:B
    conditions for each sequencer pass](https://backstage.polyend.com/t/a-b-conditions-for-each-sequencer-pass/909/20)\n\n[Sandroid](https://backstage.polyend.com/u/Sandroid)2\n\nHuge
