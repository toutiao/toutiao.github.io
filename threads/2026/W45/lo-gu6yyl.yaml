  text: |-
    Oh wow, I had a feeling they may do this. There has been a lot of vibe-reverse-engineering done for this firmware over the past few weeks. I think this is the right call for a device that has fallen to the bottom of the Polyend catalogue. I love my Tracker but it definitely felt like Polyend was not going to support it for much longer (especially after the Tracker+ and Tracker MIni).
    This is on the heels of M-VAVE also doing the same after the onslaught of vibe-coded custom firmwares. It makes sense in my head as a software guy - sell the hardware and the package and let the software be free/open. Hopefully this actually grows the market for custom/free/open software on boutique hardware. I hear Behringer is going to do something like but I don't hold a lot of respect for that company or its leader.
