  author: jcranmer
  text: 'IQ is a very <i>bad</i> tool for measuring populations. That&#x27;s because
    IQ is definitionally designed to force a population to adhere a particular metric:
    a bell curve distribution, with the median at 100 and the standard deviation of
    10. Whatever the thing you&#x27;re measuring is--and there&#x27;s good reason
    to think it&#x27;s not &quot;intelligence&quot;--you&#x27;re crunching and distorting
    that measurement to get the number at the end of it to force the population to
    adhere to a standard distribution.<p>We don&#x27;t have a good model of what intelligence
    is. But since IQ studies are fairly common, there&#x27;s a lot of data collected
    that uses IQ, and since it IQ looks vaguely like &quot;intelligence,&quot; a lot
    of researchers who are motivated to find reasons to declare particular people
    intelligent or unintelligent are more than happy to use that data to support their
    claims.'
