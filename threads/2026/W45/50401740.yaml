  author: senderista
  text: It was the post-WW2 hangover of &quot;pots aren&#x27;t people&quot; (reaction
    to Kossinna and other racist archeologists favored by the Nazis). There was a
    lot of resistance from archeologists and anthropologists to ancient DNA findings
    in the 2010s vindicating mass migration but they ultimately had to fold (and admit
    that the historical linguists were right all along). Now we have a more balanced
    perspective and can see that language and material culture can be transmitted
    via either cultural diffusion or mass migration, and we have to look at the actual
    evidence in each case to identify the transmission mechanism. An interesting example
    of how both transmission mechanisms can be involved in one cultural-linguistic
    phenomenon is the Bell Beaker culture (associated with the spread of an Indo-European
    language family possibly ancestral to Italo-Celtic), which spread east from Iberia
    to Central Europe via cultural transmission, and then back west to the Atlantic
    via mass migration (reaching all the way to Britain, where they appropriated Stonehenge
    from its Neolithic builders, who went virtually extinct within a century).
