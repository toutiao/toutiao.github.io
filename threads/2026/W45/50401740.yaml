  text: '&gt;&gt; intelligence isn&#x27;t racial<p>&gt; And how do we know that? Any
    very controversial stuff like this will have people on both sides doing all in
    their power to convince everyone to their point of view. The truth gets lost.<p>&gt;
    But saying it is likely vs having actual proof are two different things so my
    view is that we simply don&#x27;t know.<p>The scientific consensus is that race
    is a social construct and does not have a genetic basis [1], and intelligence
    is not linked to &quot;race&quot; [2], and attempts to link those are rooted in
    racism [3].<p>Science is moving towards recognizing non-human-intelligence, and
    substantial NHI too - among all different levels of the animal kingdom, with cetaceans
    and corvids ranking rather high; and here we have folks claiming &quot;the truth
    gets lost&quot; and &quot;we simply don&#x27;t know&quot;. Sir, we do know.<p>Since
    this science information is easily googled, or spat out by frontier AI when queried,
    what must one think about a lack of willingness and basic due diligence before
    espousing the statements above?<p>No need to answer, we all know it is [3].<p>[1]
