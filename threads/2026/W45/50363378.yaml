  author: gophigure
  text: What I find problematic, especially for teams that rely on GitOps and GitHub
    being (relatively) stable, is the fact that GitHub&#x27;s status page can&#x27;t
    be relied on. You arrive at the conclusion, &quot;this must be GitHub,&quot; but
    the status page rejects the notion, and so you go digging. That can lead to a
    lot of toil and wasted time, in addition to sideways looks paired with comments
    like, &quot;but status shows green.&quot;<p>A sick person with symptoms is clearly
    sick, but sometimes they&#x27;re asymptomatic. That&#x27;s what the GitHub status
    page has become. When it&#x27;s red and showing problems, you know you have problems.
    When it&#x27;s all green? You know you MIGHT have problems.<p>That can make outages
    like this harder to triage, since reality is a black box.
