  author: embedding-shape
  text: You don&#x27;t even have to migrate off GitHub if you don&#x27;t want to.<p>Begin
    by refactoring the deployments so they&#x27;re driven by checked in shellscripts,
    that accepts a git reference to deploy (prefer immutable commit SHAs over mutable
    branches&#x2F;tags). Make it use the stuff it already has checked in, and make
    the actual GitHub Actions stuff as small and concise as possible, ideally each
    &quot;run&quot; should just call a shellscript with the git reference.<p>Then
    move so the deploys happen not on GitHub Actions itself, but on a &quot;intermediate
    deploy host&quot; that has the source code and access to the credentials you need,
    and make this host have one secure entrypoint, where someone (or something) can
    enter and run shellscripts, after pushing their code as a normal git push. Then
    switch so the deploys from GitHub Actions instead use this new host to do the
    deploys. Lock down this host hard.<p>When GitHub and&#x2F;or GitHub Actions go
    down, the developer responsible for deploying stuff, should be able to get temporary
    git and ssh access to this host, can push any git data straight to the host, and
    their user on this host can run the deploy scripts. Keep in mind that nothing
    in your deployment process should depend on stuff that isn&#x27;t also available
    on this &quot;deploy host&quot;, if you have multiple synced repositories and
    so on.<p>Now things mostly work the same as people are used to, with the added
    benefit that when things go down again (like next week), you&#x27;ll still be
    able to continue to deploy stuff.<p>I&#x27;ve done this refactor&#x2F;migration
    for tens of companies in the last year, more or less following this exact template
    for all of them, with no issues reported from either of them, but lots of praise
    :)
  score: 0
