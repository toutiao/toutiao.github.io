  author: ModernMech
  text: 'AI has really lowered the bar to allow people to create new languages from
    scratch. I&#x27;m not repulsed by AI generated output as others are, so my critique
    does not fall along those lines. Actually, I think that more people can do this
    now means the bar has risen for what we should expect from these languages and
    their authors. Before a spec and a prototype implementation, and a willingness
    to learn was enough, but today I don&#x27;t think that&#x27;s the baseline, not
    anymore.<p>I understand the author has posted this, and explicitly several times
    in the README and here on HN has said this is a sketch and is for learning purposes
    and experimentation. That&#x27;s great and I support such efforts wholeheartedly.
    So my criticism is given in the spirit that this project can be significantly
    improved.<p>However, the LLM presentation means the author has cosigned statements
    I don&#x27;t think they should be cosigning.<p>For example, your homepage makes
    some pretty outrageous claims: for a language that didn&#x27;t exist before last
    week, you&#x27;re claiming it is &quot;more powerful than C&quot; and &quot;safer
    than Rust&quot;. There is <i>very</i> little here to support these claims, and
    I think they should be retracted.<p>First, how is this language more powerful
    than C and why can&#x27;t C adopt what this language does? Why can&#x27;t C use
    your technique as a framework &#x2F; preprocessor and do exactly what Evergreen
    does? If it&#x27;s <i>technically</i> possible for C to do all this I don&#x27;t
    think you can claim Evergreen is more powerful.<p>Also, I don&#x27;t see any benchmarks,
    maybe I missed them. How can you claim the proofs don&#x27;t affect performance?
    You say that the proofs are erased after they&#x27;re checked but that doesn&#x27;t
    necessarily mean there&#x27;s no performance cost for having to write the code
    a particular way. To credibly make this claim you&#x27;ll have to show proof.<p>And
    please when you do the benchmarks, make sure the AI actually optimizes the baseline
    version. There was another AI-authored language posted here recently which also
    made similar grand performance claims, but they didn&#x27;t make sure they were
    being fair in what they were comparing: <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50238979">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50238979</a>.
    The AI will show your language is faster than Rust or C or whatever by writing
    suboptimal Rust &#x2F; C.<p>When you say it&#x27;s safer than Rust, you&#x27;re
    leaving out that your system is incomplete and can&#x27;t handle some things that
    Rust already handles, like sync + send. Moreover, the claim seems to be the existence
    of the features in your language defacto make it safer than Rust, but again that&#x27;s
    not proven. Do they really? Also, several times in the Readme you claim Rust can&#x27;t
    do particular things, when it actually can, just not statically e.g. using Rc
    and Refcell. In another case I don&#x27;t think you&#x27;re aware of <a href="https:&#x2F;&#x2F;doc.rust-lang.org&#x2F;std&#x2F;num&#x2F;type.NonZeroU64.html"
    rel="nofollow">https:&#x2F;&#x2F;doc.rust-lang.org&#x2F;std&#x2F;num&#x2F;type.NonZeroU64.html</a>.<p>Is
    the claim you can do those things where Rust can&#x27;t, or that you can do them
    statically where Rust can only do it dynamically?<p>Finally, for some of these
    examples they seem to take a very long time to check, despite being so small.
    The overflow example takes almost 10 seconds on my machine, it&#x27;s only 9 lines
    of code. How does this scale to an entire program? What&#x27;s the largest program
    you&#x27;ve written to test this?<p>Anyway, I&#x27;m not saying any of this to
    discourage you, just to say that you really can&#x27;t make the claims you&#x27;re
    making without proof, and it&#x27;s not enough to say &quot;well the AI made the
    website and it&#x27;s prone to making overblown claims without proof&quot; --
    no, when you publish them, the AI&#x27;s words are your words. You can stand by
    what you can prove but otherwise you should be careful making grand claims.'
