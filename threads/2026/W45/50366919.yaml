  text: Thanks! The guarantee is that, without the use of trustme (which can prove
    any fact), you cannot address memory as the wrong type. The compiler also ensures
    that a pointer&#x2F;reference to a value is live at compile time, so it’s not
    possible to create an invalid pointer (without the use of trustme). You can also
    claim any fact which the compiler must prove in order to continue compilation.<p>That
    is good advice, I’m definitely planning on including some batteries soon, once
    I’m very happy with where the compiler is at.
