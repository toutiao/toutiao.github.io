  author: roarcher
  text: "&gt; it looks to me that the authors of those languages are parroting other
    languages rather than understanding the reason of those language choice.<p>I don&#x27;t
    mean this to sound combative, but I think you are the one who doesn&#x27;t understand
    the reason for the language choice. I assume you&#x27;re objecting to the fact
    that these languages use different operators for module&#x2F;namespace paths (`::`)
    and object member&#x2F;method access (`.`), not the `::` symbol specifically.<p>You
    seem to assume that Rust blindly imitated C++, but that&#x27;s not the case. The
    `::` syntax allows the compiler to identify and resolve all the static paths before
    any type inference or other analysis. This is important because macros are expanded
    between these stages, and can in turn introduce more static names which must also
    be resolved before any further compilation.<p>You might be able to introduce a
    rule that any `.`-path that <i>can</i> be resolved statically will be, trumping
    any non-static members (or maybe not, it might cause ambiguities I&#x27;m not
    thinking of), but Rust&#x27;s stated design philosophy favors explicitness.<p>I
    don&#x27;t know what this language&#x27;s reason for using it was, as I don&#x27;t
    see any mention of macros. But in general it simplifies compiler design. If you
    can resolve all the static names up front, the following compiler stages can ignore
    the concept of namespaces altogether."
