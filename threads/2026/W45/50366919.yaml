  author: jordan_bonecut
  text: |-
    Correct, every allocation is its own plane. The nice thing about this model is that you don&#x27;t need to explicitly call out lifetimes. I also believe that lifetimes aren&#x27;t really a good model of what actually happens in memory. This model is more powerful because it understands relationships between planes in memory, which Rust&#x27;s model doesn&#x27;t. This is why it requires mutable borrows to be unique which is oftentimes overly restrictive. For instance this is not valid Rust:<p>let x = vec![1, 2, 3];
    let a = &amp;mut x[0];
    let b = &amp;mut x[1];
    swap(a, b);<p>Because Rust doesn&#x27;t really know the difference between the whole Vec an element within the vec. Therefore it treats any mutation as one that could potentially invalidate anything with the same lifetime and doesn&#x27;t compile. So I believe the plane model to be strictly better because it allows for this and still prevents the real scary thing:<p>let x = vec![1, 2];
    let a = &amp;mut x[0];
    x.push(3);
    <i>a = </i>a + 1;
