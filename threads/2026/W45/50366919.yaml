  text: |-
    Dependent types are part of it, yeah! There are definitely some things I dislike about Rust which I am not planning on including, mainly lifetimes and some ways they handle pointer mutability. One thing I particularly dislike about Rust is:<p>let x = vec![1,2,3];
    let a = &amp;mut x[0];
    let b = &amp;mut x[1];
    swap(a, b);<p>This is not allowed. And actually in the compiler’s mind it’s for the same reason as this:<p>let x = vec![1,2];
    let a = &amp;mut x[0];
    x.push(3);
    <i>a = </i>a + 1;<p>Which is definitely not safe and should be rejected. But the compiler cannot reason that the above case is actually safe, because they both fail to compile for lifetime reasons.<p>Another thing I’m working on are “patterns” which are like enums on steroids. In Rust you cannot define how an enum is laid out, thus requiring optimizations for types like Option&lt;&amp;T&gt; to be in the compiler. In evergreen this will be in the language via a similar process to trait implementation.
