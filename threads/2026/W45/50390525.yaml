  author: wowczarek
  text: Well I&#x27;ll be.<p>At least two of the authors are also avid chiropterologists,
    with an understood penchant for bunkers and other such spaces.<p>One summer in
    my late teens I sat with two of them in an urban park in NW Poland drinking beer,
    watching bats getting caught in a net half-submerged in water near a bridge and
    engaging in impromptu comedy with passers-by asking questions like &quot;good
    catch? any fish?&quot;. Good times.<p>Engaging in field research is a wonderfully
    rewarding experience, a great way to spend time, meet people and do something
    meaningful at the same time. If you&#x27;ve never done it - do it. There are plenty
    of volunteering opportunities - you don&#x27;t need to be a scientist. Birding,
    insects, marine life, whatever. Citizen science is also great, but if you get
    a chance to work alongside scientists, it gets even better. 10&#x2F;10 good walk,
    unspoilt.
