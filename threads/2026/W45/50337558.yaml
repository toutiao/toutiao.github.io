  text: |-
    Chrome is pretty efficient, as far as per page costs go! If your architecture isn&#x27;t trash!<p>The sin is this ridiculous era of every program shipping its own runtime. I&#x27;m headed for real down votes, but this is the same lazy culture that&#x27;s taken over everywhere: go and rust both ship these huge statically compiled binaries.<p>When you are a company, you&#x27;re only running a handful of different workloads&#x2F;apps on any given box, so the statically compiled price doesn&#x27;t bite you. But as users, going back to dynamically linking and making the incremental cost of loading an app not also have to carry the entire world with it is such an obvious return, and one that alas seems to not be in progress at all.<p>The agentic age is, I hope, going to question a lot of old assumptions &amp; needs about what we want to run. Having lots of small resident little user agencies, compiled small scripts that are attributed to a user, is something I believe will happen, but I&#x27;m less convinced we&#x27;ll recognize the face of it as it happens, that the tales will be told.<p>Tools like agent-substrate, ax, scion, are this interesting mix between agents, serverless, and kubernetes. I find it fascinating. (For hire on this.)
