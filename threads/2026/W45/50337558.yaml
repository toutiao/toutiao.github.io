  author: zamadatix
  text: I think the biggest fault in Electron is not just that it&#x27;s inefficient
    web tech but that it has no provision for shared instances between apps, instead
    foricing every app to be the one which only ever wants to use the EXACT locally
    bundled copy of Chromium+Node which should launch in isolation of any others.
    This isn&#x27;t even something Electron needs to die and be replaced for, just
    an optional feature other similar tools have jumped on for years now.<p>I&#x27;m
    sure exact pinning is sometimes the real intended case for certain apps, as it
    is a value in certain ways, but I&#x27;d bet at least half the Electron apps I
    have running now would happily be using the same shared instance of the same LTS
    Chromium+Node if it were the out of the box behavior to be able to do so.
