  author: LoganDark
  text: My LLM detector started going off around here:<p>&gt; Why doesn&#x27;t the
    Zone Builder just rebuild the setting that changed?<p>&gt; It should, and that
    is where we ended up. However, proving when it was safe took most of the work.
    A record event identifies what changed. A zone event can come from many Cloudflare
    products, may not say why the zone changed, and can alter data shared by several
    zones with the same name. Choosing too much work wastes capacity. Choosing too
    little can leave stale or incorrect DNS data at the edge.<p>Re-reading the start
    of the post with that in mind, I&#x27;m fairly sure the article was generated
    by LLM.<p>With that said, curated it sure is. Aside from the smelly phrasing,
    the actual content is fairly dense and engaging. Not all of Cloudflare&#x27;s
