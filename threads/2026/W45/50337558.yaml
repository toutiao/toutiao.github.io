  author: jauntywundrkind
  text: |-
    If we want a system like, say, sdf, it would be so much worse to make each program have to host its own world, its own runtime.<p>Rust and go are somewhere on the continuum, between dynlibs and chrome, for how much private world they build for themselves. It&#x27;s vastly less than chrome. But it&#x27;s a lot. A lot more than what Linux distributions did for years and years and years.<p>Especially if you think if multiuser systems with multiple people using programs, then you have some scaling factor. Then it matters a lot a lot more than each lib has to be loaded distinctly for each process.<p>It&#x27;s not good. It&#x27;s not good for Electron, there are vastly better ways to run many apps taking a more dynlib path, and it&#x27;s not good for rust or go. As nice as it is to dev like that.<p>Of course it&#x27;s another <i>huge</i> problem that dependency trees are <i>rarely</i> shared. Go look at Class Data Sharing in Java: building the libs you standardize on (your orgs stdlibs) and there&#x27;s this beautiful idea here that you should just already have some common things expected to be there. That&#x27;s harder to imagine since so many programs have such different dep stacks. But imagine having a Tokio or tokio+++ that everyone can use, good foundational tools (Grand Central dispatch and the never arrived NextBSD) Some common substrate, with just like async as one example. And the size of that shared good useful library&#x2F;platform can grow, hopefully revive an interest in reuse vs bringing your own every time.
    <a href="https:&#x2F;&#x2F;docs.oracle.com&#x2F;en&#x2F;java&#x2F;javase&#x2F;17&#x2F;vm&#x2F;class-data-sharing.html" rel="nofollow">https:&#x2F;&#x2F;docs.oracle.com&#x2F;en&#x2F;java&#x2F;javase&#x2F;17&#x2F;vm&#x2F;class-data-shar...</a>
