    I have a tendency to plan based on the idea that servers may end up being thousands of miles from me, so there's always value in having too much of something than too little. Until recently, it was easy to set up machines with 32, 64 or 128 gigs, with 16TB drives instead of 8TB, and so on.
    These days, with prices of computing goods being what they are, it doesn't make sense to do that, so a reminder that we should, you know, check usage to see how much stuff we need is a good one.
    I have a first edition of the O'Reilly sendmail bat book from 1993. There's quite a lot of discussion in it about how to maximize the resources you have, which is heavily trimmed in later editions. It's worth it for everyone to learn those lessons, because you never know when an evil cabal of oligarchs will capture the world's production of integrated circuits and drive prices up to insane amounts.
