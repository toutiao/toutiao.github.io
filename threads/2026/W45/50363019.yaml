  text: "&gt; One bit stands out to me: to better understand, Scholz will work the
    problem backwards. Sometimes that strategy is just so spot on.<p>In David Deutsch&#x27;s
    book The Beginning of Infinity, he argues, that the purpose of science is not
    to merely predict or to model the world, but to explain it. And he gives in my
    opinion convincing arguments, why a better explanation is needed to advance science.
    Therefore, he deduces that pure empiricism has failed. Because no matter how much
    data you have gathered, an explanation does not follow from it. The explanation
    is always an insight the scientist has to contribute. Then it is open to scrutiny
    by criticism or experiments.<p>I guess he would argue the same is true for mathematicians.
    Merely constructing proofs to arrive at theorem, is of no intrinsic value, if
    it doesn&#x27;t spark an idea of a more elegant formalism that corresponds to
    a simpler and even more far reaching explanation.<p>I cannot recommend this book
    highly enough to anyone who is intellectually curious, not only about epistemology."
