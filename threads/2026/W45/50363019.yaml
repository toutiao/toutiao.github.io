    # Verification Is Not Knowledge

    ### Science needs more than answers

    [

    ](https://substack.com/@cosmosinstitute)[

    ](https://substack.com/@jessicahullman)

    [Cosmos Institute](https://substack.com/@cosmosinstitute) and [Jessica Hullman](https://substack.com/@jessicahullman)

    _This is a guest essay by [Jessica Hullman](https://users.eecs.northwestern.edu/~jhullman/), Ginni Rometty Professor of Computer Science and Policy Fellow at Northwestern University._

    [

    ](https://substackcdn.com/image/fetch/$s_!qC0Q!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6c5afe03-d75e-4108-b58a-63be2d3ba4b7_2048x1413.png)
    _Diego Velázquez, The Fable of Arachne (c.1657)_

    In his [essay](https://arxiv.org/pdf/math.ho/9404236) on the role that rigorous proofs play in mathematical advances, Bill Thurston writes that the measure of success in math research is “whether what we do enables _people_ to understand and think more clearly and effectively about mathematics.” Many recent discussions of AI for science hinge on a tension between understanding and answers. Is science about humans achieving insight, or the archiving of verifiable solutions?

    One side prioritizes outputs. Progress is implied to be evident in verifiable proofs of longstanding conjectures and cures for diseases, whether humans were involved in their making or not. The other side argues that human understanding is paramount, because it drives integration of new findings into the canon, because it shapes and inspires the next generation, and so on. But the first side, those who emphasize correct outputs, dismisses this as gatekeeping or nostalgia.

    When Terry Tao posed a thought experiment in [a recent talk](https://terrytao.wordpress.com/2026/10/10/math-2-0/), asking how comfortable people would be taking a cancer treatment produced by AI, complete with a formal certificate of correctness and a passed phase 3 trial, but without any human understanding how it was found, critics suggested that Tao’s reasoning missed the point. Of course a patient with stage 4 cancer would welcome the treatment.

    Other examples concern ambiguity in authorship. Tom Dietterich wrote about [arXiv’s growing problem](https://x.com/tdietterich/status/2099197831580090622) with papers submitted by human authors who seem unlikely to have the expertise to understand the claims. Many questioned in response why accountability – by which I mean being answerable for a claim, able to describe what it rests on and respond when it’s challenged – should matter if verification has been solved. I suggested peer reviewers [reserve their expert judgment](https://jhullman.github.io/author_accountability/) for texts that don’t get flagged as heavily AI-written, so as to prioritize review as human exchange, but some see this as an obstruction to truth-seeking rather than an attempt to preserve it.

    The problem is that if we all agree that outputs matter–that we do care about the solutions to longstanding conjectures, that we do ultimately want to know how to cure diseases–then understanding appears as something separate. It’s cast as a mental state that looks optional next to the cure or the proof itself, and becomes easy to dismiss as a second-order constraint that we tack on because historically we’ve required it to arrive at the solutions in the first place.

    When defenders of understanding don’t dispute this separation, they immediately lose the argument. It becomes easy for the side that prioritizes output to peg them as simply not trying hard enough to envision a new future. But the superficial framing of understanding that we keep falling back on obscures deeper concerns that these examples share. They are less about anyone’s mental state than about what happens when something goes wrong. Tao’s scenario turns on the possibility that the AI passed the trial by exploiting a weakness in the trial itself. A paper whose authors can’t explain its claims leaves no one to consult if those claims fail.

    Where along the way did we come to believe that scientific value lies in correctness alone?

    This intuition is ultimately less about AI than it appears. The inclination to let AI drive science is less a sign of how forward-thinking one is about our future with AI, and more a symptom of a “value-free ideal” that has shaped our thinking since the Cold War era: a view that only epistemic criteria (not ethical and social values) deserve a place in judging what the evidence shows. That it pervades our debates about AI for science is not so surprising; it’s only in the last few decades or so that rejecting the value-free ideal became the philosophical mainstream.

    This ideal feeds unrealistic expectations and keeps us from seeing that pushback against the rapid infiltration of AI output into the scientific record is neither anti-AI nor anti-science. The stakes are bigger than any one debate or field. The value-free ideal distorts how we go about seeking truth, causing us to mistake verified results for knowledge. It threatens the human capacities that sustain science, causing us to see criticism and accountability as inconvenient overhead rather than the mechanics of knowledge production. It leaves us confused about what understanding is, and consequently why it matters.

    ### **Is science “naturally aligned”?**

    The social contract for science [represents](https://substack.com/@jessicahullman/p-212569840) an idealized relationship between science and society that arose after World War II in the US: scientists [receive public funding and autonomy](https://link.springer.com/content/pdf/10.1007/s11229-023-04477-9.pdf), and in return society receives the benefits of their inquiry. Built on a distinction between pure and applied science and a “linear model” in which basic research feeds applied work, the social contract replaces abstract arguments about the value of understanding with practical societal benefits, reshaping how we see science. Drawing on arguments made by concerned scientists in the late 1800s, who worried public celebration of new inventions like electric lights and the steam engine would crowd out respect for what they viewed as their more essential contributions, it also helped to forge a value-free ideal that says that at its core, science must be removed from “contextual values” like ethical or social concerns. For the social contract to gain broad societal buy-in as a model of scientific progress (and consequently shore up government investment in scientific research), we needed to imagine truth-seeking as the impersonal application of methods, immune to political or social pressures.

    Philosophers of science aspired to inquiry based only on “epistemic” (or “cognitive”) values. Any influence from the scientist’s intentions or values came to be seen as a risk that the right methods should minimize, laying the groundwork for today’s questions about why it should matter who asserted the claim so long as it’s correct.

    Many debates about AI’s role in science come down to disagreements about whether the scientific truth can be realized purely through use of the right procedures. Over the course of the late nineteenth and early twentieth centuries, there was almost a [moralizing drive](https://www.jstor.org/stable/2928741) to eliminate as much of the scientist’s self as possible from the scientific process, so that trust in individuals could be replaced with trust in the system.

    AI agents set loose on the scientific literature, able to verify and intervene experimentally themselves, look like the long-awaited fulfillment of nineteenth century scientific ethics. Much of the “AI for science” rhetoric inherits what I call the “science is naturally aligned” premise: by enacting the scientific method at scale, with its various justification procedures, we can reach a place where we no longer need human judgment to produce truth.

    Is what is true really so separable from understanding or a
