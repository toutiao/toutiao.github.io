  author: program_whiz
  text: 'Arriving at truth values has limited value in science, obviously (with full
    understanding being more useful). For example, knowing a chemical reaction will
    produce heat is useful (cavemen discovered that one), but knowing _why_ unlocks
    an entire world of useful tools (the combustion engine, space heaters, etc).<p>However,
    even getting truth answers will soon be beyond AI.  It is of course making impacts
    in Math and in publishing in &quot;data heavy&quot; subjects where you can just
    formally verify, program, and&#x2F;or munge data.<p>But in &quot;real science&quot;
    where we actually need to build a lab, buy supplies, hire personnel, get approval,
    form physical test harnesses, install sensors in proper locations, calibrate everything,
    then finally make one measurement, question the whole thing, then finally make
    a conclusion, AI is of limited benefit.<p>Yes, it can help speed up coming up
    with some formulas, spitballing, or checking existing research.  It can even help
    write the jank code for sensor calibration, measurement taking, etc.  That&#x27;s
    not nothing, but we are _very far_ from meaningful contributions to real experimental
    hard sciences.<p>As for math, theoretical physics, computer science, and other
    &quot;logic based&quot; studies, the question becomes one of benefit to cost of
    true understanding versus simply knowing something is true.<p>I&#x27;d argue that
    it paints a starkly negative picture of most science. Once answers are easy to
    obtain, it seems most people are concluding that actually understanding why its
    true isn&#x27;t worth the effort, which means that the question maybe wasn&#x27;t
    worth asking.<p>Its the science equivalent to the recent realization in tech:
    most ideas suck, your product didn&#x27;t need more bells and whistles.  Actually
    the engineers pushing back on every shower thought from product was a good thing.  The
    friction that stops you from putting every random-ass feature into your already
    bloated useless SaaS product was good, and now the sales guy is pushing features  to
    prod for a customer demo.  We thought &quot;too many ideas, not enough engineers&quot;,
    we now know &quot;not enough meaningful quality ideas&quot;.<p>In the same way
    we thought &quot;too many questions, not enough scientists&quot;, we now know
    &quot;not enough real study on meaningful topics&quot;.'
