  text: An infallible oracle tells Archimedes that the speed of light in vacuum is
    ~1.08 billion kilometers per hour.  Archimedes, with the iron age tools and methods
    at his disposal, might be able to verify this and make some use of it himself.  Maybe.
    In any case, what he has gained <i>is</i> knowledge itself.<p>The same goes for
    our own time.  A powerful AI can tell us things at the edge of what we can grasp
    -- or beyond what we can grasp -- and it would nevertheless be knowledge that
    we possess.  We can work to verify it, we can have it explained to us as though
    we were schoolchildren, or we can simply accept it as a static fact of the natural
    world.<p>In truth, we&#x27;re going to have to learn to coexist with minds that
    are more powerful than ours.  At least in some respects, if not in <i>all</i>
    respects.  The good scenario is that they share information with us, and we receive
    it however we can.  &quot;Head in the sand&quot; and &quot;mutual disdain&quot;
    are bad outcomes.
