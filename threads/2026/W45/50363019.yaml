  author: GuB-42
  text: 'LLMs are excellent writers in the sense that they get the spelling, grammar,
    syntax, etc... right. They are certainly way better than I am, and they can compete
    with the best writers considering how AI-generated prose has winned literary prizes.<p>Many
    people don&#x27;t like the style, probably by association with slop and fatigue
    more than the style being fundamentally wrong.<p>Being a good communicator is
    an entirely different thing, you can have terrible spelling and grammar and still
    be good at getting ideas across. It is a common situation when the communicator
    in question is not using his native language.<p>That LLMs are so good at writing
    and so bad at communicating is not surprizing. The key to good communication is
    getting into the other people&#x27;s mind, LLMs can&#x27;t do that, because they
    &quot;think&quot; in a way that is completely alien to us. We use words to express
    our thoughts, thoughts that are based on a physical world model: touch, movement,
    sound, light, etc... LLMs have no idea about how the physical world work, everything
    the see is just words, they have no intuitive idea of, say, objects falling down,
    just that &quot;falling&quot; and &quot;down&quot; go well together. And for explaining
    things, they will go &quot;someone asks for an explanation, explanations usually
    use these words, I will be using the same kind of words&quot;.'
