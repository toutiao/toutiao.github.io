  author: simonw
  text: 'Terry Pratchett once wrote about the concept of &quot;horizontal wealth&quot;.
    Vertical wealth is where you spend money on rich people stuff - yachts and suchlike.
    Horizontal wealth is where you spend more money on the things you liked before
    you got rich: <a href="https:&#x2F;&#x2F;chibuikeani.blogspot.com&#x2F;2017&#x2F;02&#x2F;the-price-of-happiness-horizontal-vs.html"
    rel="nofollow">https:&#x2F;&#x2F;chibuikeani.blogspot.com&#x2F;2017&#x2F;02&#x2F;the-price-of-happin...</a><p>&quot;But
    horizontal wealth means not letting your increased income dictate your tastes.
    You like books and now you have money? Buy more books! Change those catenary bookshelves
    for good hardwood ones! In my case, build a library extension to your office.
    And, of course, you buy what will be useful for that most wonderful of pursuits,
    blind research, which is research without direction for the sheer joy of it.&quot;<p>(Original
    source is his book A Slip of the Keyboard - this linked blog post quotes that
    bit.)'
