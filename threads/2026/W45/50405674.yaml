  author: hattar
  text: I have to weigh in with my favorite quote, also from Guards! Guards!<p>&gt;
    ...you think there are the good people and the bad people,” said the man. “You’re
    wrong, of course. There are, always and only, the bad people, but some of them
    are on opposite sides.”<p>&gt; He waved his thin hand and walked over to the window.
    “A great rolling sea of evil,” he said, almost proprietorially. “Shallower in
    some places, of course, but deeper, oh, so much deeper in others. But people like
    you put together little rafts of rules and vaguely good intentions and say, this
    is the opposite, this will triumph in the end. Amazing!” He slapped Vimes good-naturedly
    on the back.<p>&gt; “Down there,” he said, “are people who will follow any dragon,
    worship any god, ignore any iniquity. All out of a kind of humdrum, everyday badness.
    Not the really high, creative loathesomeness of the great sinners, but a sort
    of mass-produced darkness of the soul. Sin, you might say, without a trace of
    originality. They accept evil not because they say yes, but because they don’t
    say no. I’m sorry if this offends you,” he added, patting the captain’s shoulder,
    “but you fellows really need us [bad people]....we’re the only ones who know how
    to make things work.&quot;<p>&gt; &quot;You see, the only thing the good people
    are good at is overthrowing the bad people. And you’re good at that, I’ll grant
    you. But the trouble is that it’s the only thing you’re good at. One day it’s
    the ringing of bells and the casting down of the evil tyrant, and the next it’s
    everyone sitting around complaining that ever since the tyrant was overthrown
    no one’s been taking out the trash. Because the bad people know how to plan. It’s
    part of the specification, you might say. Every evil tyrant has a plan to rule
    the world. The good people don’t seem to have the knack.”
