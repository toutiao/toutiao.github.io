  author: simonw
  text: 'It&#x27;s wild how you can read basically <i>any</i> Discworld book and find
    gems like that one. I read them as a teenager and loved them, going back to them
    decades later I find that there was so much wisdom in there that my teenage brain
    hadn&#x27;t even begun to appreciate.<p>Guards, Guards (from 1987) is crammed
    with them:<p>&gt; They avoided one another&#x27;s faces, for fear of what they
    might see mirrored there. Each man thought: one of the others is bound to say
    something soon, some protest, and then I&#x27;ll murmur agreement, not actually
    <i>say</i> anything, I&#x27;m not stupid as that, but definitely murmur very firmly,
    so that the others will be in no doubt that I thoroughly disapprove, because at
    a time like this it behooves all decent men to nearly stand up and be almost heard...<p>&gt;
    No one said anything. The cowards, thought each man.<p>So much insight about the
    human condition in those books.'
