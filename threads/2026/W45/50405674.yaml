  content: "![](https://www.sussi.dk/wp-content/uploads/2026/11/IMG_6115-scaled.jpeg)\n\n#
    Terry Pratchett’s study\n\nThis is not a replica of Terry Pratchett’s study. To
    do that, I would have needed pictures from every angle and exact measurements,
    so this is just a small part of a study, where Terry Pratchett might have felt
    at home, in scale 1:12.\n\nIf you read “The Borrowers” as a child, you might imagine
    a tiny, Terry Pratchetty fellow occupy this study, whenever the house is quiet..\n\nI
    found some pictures of the study online, but not very many. Fortunately, I’ve
