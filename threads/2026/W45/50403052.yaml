    commercial abandonment. I would change it to add these parameters:<p>If a copyrighted
    work was sold to the general public at any point, and the rights-holder no longer
    sells that product in a way that a reasonable person would purchase and consume
    that work, or is no longer for sale in a manner reasonably consistent with its
    original form of sale (e.g., they used to sell Need for Speed Underground 2 as
    a one-time purchase but now it&#x27;s only available as a subscription, or the
    price has been changed from $50 to $3,000), people are then free to copy and redistribute
    that work for non-commercial purposes, although they may collect donations for
    the purposes of covering distribution cost so long as they don&#x27;t make those
    donations a prerequisite for the end consumer&#x27;s access of the copyrighted
    work. The redistributor would also not be allowed to represent themselves as the
    rights-holder or do anything that would confuse people into thinking they were
