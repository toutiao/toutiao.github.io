  text: 'I don&#x27;t know. You&#x27;re not asking for donations to keep maintaining
    a product you don&#x27;t own. You&#x27;re asking for donations as someone who
    put their services to work.<p>Consider a tricky grey area: you have a patreon
    for your youtube channel and expect most people to be donating so you can keep
    making videos (you get maybe, $50 a month). You also make random mods on the side.
    One of your mods blows up, and you get a bunch of attention. Which includes donators
    giving you hundreds  thanking you for the mod. Are you now taking &quot;blood
    money&quot; because your tip jar for youtube content now has financial incentives
    to make more gaming mods?<p>I personally treat the tip jar as such. As long as
    you&#x27;re not saying &quot;pay me this much and I&#x27;ll make X mod&quot;,
    I&#x27;m donating to a person, not a potentially morally grey cause. Maybe the
    Nintendo lawyer disagree with me, but that feeling has always been mutual.'
