  author: derektank
  text: I don’t see the clear difference between something like Kalshi and, say, Robinhood.
    I do see a clear difference between Kalshi and casinos or sports gambling sites
    like Fan Duel; in the latter, your counterparty is the institution itself. This
    creates a lot of perverse incentives on the part of sports gambling sites to maintain
    their edge, such as banning bettors that are too good at playing the odds. Kalshi,
    on the other hand, is never your counterparty in any transaction.<p>Now, Robinhood
    is a brokerage, regulated by FINRA, and has been fined for misbehavior in the
    past. So I am more than willing to believe that there is daylight here that I’m
    not seeing. But anything that lets you speculate attracts a certain clientele,
    and I think the most important distinction is whether or not the platform itself
    is an interested party.
