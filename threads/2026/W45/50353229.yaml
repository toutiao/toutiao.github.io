  title: Kalshi and its co-founders face felony charges for violating Utah gambling
    laws - Ars Technica
  fetch_status: success
  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nThe
    Trump administration is trying to stop Utah from enforcing its gambling ban against
    Kalshi, making Utah the 10th state sued by the US government agency that regulates
    prediction markets.\n\nMeanwhile, Utah Attorney General Derek Brown filed criminal
    charges in a state court against Kalshi and its founders on Wednesday. The attorney
    general’s office provided us with court filings listing charges against [KalshiEX,
    LLC](https://cdn.arstechnica.net/wp-content/uploads/2026/10/Utah-v.-Kalshi.pdf),
    Kalshi co-founder and CEO [Tarek Mansour](https://cdn.arstechnica.net/wp-content/uploads/2026/10/Utah-v.-Mansour.pdf),
    and Kalshi co-founder and COO [Luana Lopes Lara](https://cdn.arstechnica.net/wp-content/uploads/2026/10/Utah-v.-Lara.pdf).\n\nThe
    company and two co-founders each face 13 felony charges and one misdemeanor for
    violating gambling laws. The charges are based on sports bets offered on Kalshi
    between September 13 and September 24.&nbsp;“The state did not issue arrest warrants
    for Monsour and Lopes Lara. Instead, they have been issued summons to respond
    to the charges in Third District Court in Salt Lake County,” The Salt Lake Tribune
    [wrote](https://www.sltrib.com/news/2026/10/28/utah-files-14-criminal-charges/).\n\nThe
    [Utah News Dispatch](https://utahnewsdispatch.com/2026/10/29/utah-criminal-charges-against-kalshi-gambling-ban/)
    quoted a Kalshi statement vowing to fight the charges. “This is a crazy overreach;
    Utah is clearly playing politics. We look forward to putting a stop to this in
    court, just like we did in Arizona,” the statement said, referring to [similar
    charges](https://utahnewsdispatch.com/2026/05/05/repub/arizonas-criminal-case-against-kalshi-permanently-blocked-by-federal-judge/)
    the company [beat](https://storage.courtlistener.com/recap/gov.uscourts.azd.1483385/gov.uscourts.azd.1483385.96.0.pdf)
    in Arizona in May.\n\nUtah, which prohibits gambling, [filed a civil lawsuit against
    Kalshi](https://attorneygeneral.utah.gov/utah-sues-kalshi/) in a state court last
    week. Utah’s lawsuit seeks an order prohibiting Kalshi from offering bets on sports,
    elections, politics, and other events.\n\n“Kalshi runs an online casino in Utah
    and calls it a prediction market. That violates Utah law,” Utah Attorney General
    Derek Brown, a Republican, said last week. “Not only do our state laws ban gambling
    but Utah is one of only two states where gambling is also prohibited under the
    state constitution. For 130 years, Utah has been clear: gambling has no place
    here, and we will enforce our laws.”\n\nUtah already defeated Kalshi in federal
    court after the prediction market filed a preemptive lawsuit that sought to prevent
    the state from enforcing its gambling laws. Now that Utah is moving ahead in its
    attempt to shut down Kalshi, it must defend against a [lawsuit](https://storage.courtlistener.com/recap/gov.uscourts.utd.168095/gov.uscourts.utd.168095.1.0.pdf)
    filed by the US Commodity Futures Trading Commission (CFTC).\n\n## Trump admin
    claims sole authority\n\nThe CFTC “has filed a lawsuit against Utah to block the
    state’s efforts to shut down CFTC-registered contract markets using state laws,”
    the [commission said on Tuesday](https://www.cftc.gov/PressRoom/PressReleases/9315-26).
    “The lawsuit follows Utah’s decision to file civil enforcement actions in state
    court against CFTC-regulated markets and other businesses. Utah’s effort to restrict
    the functioning of CFTC-registered exchanges obstructs Congress’s decision to
    federally preempt state law.”\n\nIf Utah can shut down Kalshi, that could spell
    trouble for Kalshi’s chief prediction-market rival, Polymarket, and for sports
    betting sites like DraftKings and FanDuel. DraftKings and FanDuel advertise [availability
    in all US states](https://www.fanduel.com/legal-sports-betting-us-map) via a [mix
    of products](https://sportsbook.draftkings.com/is-draftkings-available-nationwide-for-sports),
    including prediction-market platforms in states like Utah. Both are registered
    with the CFTC.\n\nThe Utah attorney general’s office declined to comment today
    on the CFTC lawsuit. The CFTC previously filed [lawsuits](https://www.cftc.gov/PressRoom/PressReleases/9267-26)
    against Arizona, Connecticut, Illinois, Kentucky, Minnesota, New Mexico, New York,
    Rhode Island, and Wisconsin. The federal agency also filed briefs supporting Kalshi
    in appeals court cases.\n\n“Utah seeks to shut down prediction markets across
    a wide variety of markets,” CFTC Chairman Michael Selig said. “Event contracts
    do not just serve hedging and investment purposes—they also provide the public
    with information about the outcome of future events. Congress entrusted the CFTC
    to be the federal regulator with sole responsibility to oversee these markets.
    As I’ve said before, the CFTC has the expertise and responsibility to defend its
    exclusive jurisdiction over commodity derivatives, and that’s exactly what we’ll
    do.”\n\nThe US Commodity Exchange Act (CEA) gives the CFTC authority to regulate
    swaps. The key legal questions being grappled with by [courts throughout the US](https://arstechnica.com/tech-policy/2026/10/a-senator-tried-to-ban-gambling-on-prediction-markets-now-shes-a-kalshi-lobbyist/)
    are whether event contracts offered by prediction markets qualify as swaps, and
    whether the CFTC jurisdiction over swaps preempts states from applying their gambling
    laws.\n\n## US sues in same court where Utah beat Kalshi\n\nThe CFTC is suing
    Utah in the same US district court that previously ruled in Utah’s favor. [Kalshi
    sued Utah](https://storage.courtlistener.com/recap/gov.uscourts.utd.162647/gov.uscourts.utd.162647.1.0.pdf)
    in February in an attempt to stop the state from bringing an enforcement action
    against the prediction market.\n\nIn August, US District Judge Robert Shelby granted
    Utah’s motion for summary judgment and denied Kalshi’s motion for a preliminary
    injunction. Shelby [wrote](https://storage.courtlistener.com/recap/gov.uscourts.utd.162647/gov.uscourts.utd.162647.65.0.pdf),
    “[T]he court concludes the federal law relied upon by Kalshi does not preempt
    Utah’s ability to enforce its anti-gambling laws.”\n\nShelby determined the text
    of US law makes it clear that state regulation is not forbidden. US law states
    that CFTC jurisdiction does not “supersede or limit the jurisdiction conferred
    on courts of the United States or any State,” and “explicitly provides for State
    regulation of its gaming laws in all but a few specified cases,” he wrote.\n\n“Congress
    is aware that some States permit gambling while others do not, and the CEA explicitly
    provides for State jurisdiction,” Shelby wrote.\n\n## Most states in US want Supreme
    Court to rule\n\nKalshi is now appealing its loss to the US Court of Appeals for
    the Tenth Circuit but was unable to obtain an injunction preventing enforcement
    of the state gambling ban while that litigation continues. On September 8, Tenth
    Circuit judges [denied](https://storage.courtlistener.com/recap/gov.uscourts.ca10.92411/gov.uscourts.ca10.92411.19.0.pdf)
    Kalshi’s emergency motion for an injunction pending appeal. Utah filed its lawsuit
    seeking a shutdown of Kalshi about six weeks later.\n\nThe CFTC lawsuit against
    Utah makes arguments similar to the ones already rejected by the district court,
    although some other courts have ruled otherwise.\n\n“Utah is not the first State
    that has attempted to invade the Commission’s exclusive jurisdiction over swaps,”
    the CFTC lawsuit said. “Already, several federal courts—including the Third Circuit—have
    swiftly responded by issuing or affirming temporary restraining orders and preliminary
    injunctions barring the States from enforcing their gambling laws against CFTC-regulated
    exchanges that offer sports-related or other event contracts.”\n\nThe Third Circuit
    appeals court [ruled](https://arstechnica.com/tech-policy/2026/04/sports-bets-on-prediction-markets-ruled-to-be-swaps-exempt-from-state-laws/)
    that New Jersey cannot regulate spo"
