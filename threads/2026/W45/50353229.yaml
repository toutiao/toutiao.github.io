  author: buriram
  text: 'Most uncertain things that people need to hedge (currency, commodity prices)
    already had a hedge.<p>That&#x27;s way too narrow of the categories. Here are
    some more cases, and you tell me where can I hedge it? And don&#x27;t tell me
    the answer is &quot;go to Goldman Sachs and they create any kind of derivatives
    to hedge for you&quot;, that only works if you are a huge enterprise. I&#x27;m
    talking about SME, or even one person company with $1-5M ARR.<p>(By the way, I
    do trade on Polymarket &#x2F; Kalshi, had a job interview with Kalshi many years
    ago but did not take their offer since I disagreed a lot with their product design.
    So all of this is my own opinion).<p>1. Suppose I run an ice cream shop in midtown
    Manhattan, and my foot traffic depends on how good the weather is. If it&#x27;s
    sunny and dry, I expect a lot of traffic, vice versa, if it&#x27;s thunderstorm,
    hurricane or snow, I would run the day without any revenue (and a lot of ice cream
    waste). What is the way for me to hedge weather risk that could seriously affect
    my business?<p>2. Suppose I&#x27;m a restaurant owner in Koreatown in LA, and
    during World Cup I run a restaurant expecting a lot of Korean coming to my area
    (and my restaurant). So I would ramp up my business, hiring a lot of staffs, sourcing
    a lot of ingredients from the vendors. Then the biggest risk (and anticipation)
    is that Korea would be knocked out very early, which unfortunately that precisely
    happened. So the foot traffic evaporated, and with that the revenue. How could
    I hedge that risk?<p>3. Suppose I&#x27;m a distributor &#x2F; reseller who needs
    to import goods and products from other countries and resells it back to US for
    profit. Barring the import &#x2F; export regulations, the biggest risk is tariffs:
    the orange man can (and did) impose 50% tariffs from China, and all the sudden
    I face a severe supply-demand imbalance with a lot of contract cancellation and
    such. How can I hedge such tariff risk from the orange man? (Obviously, the alternative
    is that I wish we could have elected a more competent leader, but at least 75
    million American disagreed with me).'
  score: 0
