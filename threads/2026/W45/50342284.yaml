    3x3U 110 kW units vs the 8×1U 33 kW shelves typical in GB300 NVL72, power whip rating rises to 100A from 60A, rack coolant flow doubles versus GB300, and both compute and NVSwitch trays are fanless, 190-230 kW per rack depending on power mode vs about 140 kW for GB300 NVL72 and NVLink switching is new too etc<p>And where is your source about buyback program? I found no Nvidia trade in or buyback program for data center hardware. Used gear is resold through third parties, ITAD vendors like Procurri and Bitpro buy and resell used GPUs from hyperscalers, and resellers like Alta Technologies sell refurbished units with warranties.<p>The closest real thing is a financing arrangement announced in August where Nvidia partnered with Apollo, BlackRock, Blackstone, and others and in SOME CASES may provide residual value support for up to 25% of an opportunity, assessed project by project. So in practice, if a borrower defaults and the lender has to liquidate GPUs that can&#x27;t fetch their booked value, Nvidia covers part of the shortfall. That backstops lenders. It is not a buyback for customers who upgrade.
