  author: donkers
  text: 'They&#x27;re not worth more. The number of shares is increased by the amount
    that was issued. So that larger amount of equity is split among more shares.<p>A
    simple example:<p>Current equity of $100B, 100 shares outstanding. Each share
    is worth $1B, with 1% of voting power.<p>Then we issue $10B of equity via 10 shares.<p>Now
    we have equity of $110B, with 110 shares outstanding. Each share is <i>still</i>
    worth $1B, except each share now has 1&#x2F;110 of voting power, instead of 1&#x2F;100.
    Each share now only controls 0.91% of the company. Their ownership has been diluted.<p>edit:
    You can throw this comment thread URL into your favorite clanker (Claude, Gemini,
    whatever) and it will confirm exactly what I&#x27;m saying.'
