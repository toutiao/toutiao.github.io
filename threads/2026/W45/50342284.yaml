  text: 'I&#x27;m not really sure they have thought this through. Or at least their
    solution has been to essentially insulate the company and even the physical building
    from the debt used to buy the GPUs. These SPVs typically lease the building and
    secure the debt to the GPUs themselves so if it all goes pear-shaped, it&#x27;ll
    be the debtholders who are left holding the bag, priamrily.<p>But I have questions:<p>1.
    How often do GPUs fail? I&#x27;ve seen figures that this is as high as 9% annual
    failure rate for DC GPUs;<p>2. How easy is it to get replacement stock? At what
    cost?<p>3. If you trade in, what value do you get for your GPUs?<p>4. What is
    the availability like? How does NVidia decide who gets the next wave of GPUs?
    That&#x27;s NVidia&#x27;s big power here. It&#x27;s a bit like how Boeing and
    Airbus decide on customer order and if you upset them, you may lose other orders.
    This happened to Qatar Airways over the A380 [1].<p>5. How long are the current
    form factors and interfaces going to last? How long before the power requirements
    get larger than what DCs are currently built for? Blackwell GPUs use a lot more
