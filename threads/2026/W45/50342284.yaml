    racks, and Nvidia will buy back parts you replace with newer hardware.<p>For example,
    let&#x27;s say you have an NV72 with Blackwell-ultra.  Rubin comes out, and you
    decide you want to upgrade.  There is a SKU of Rubin designed specifically to
    work in the racks shipped with Blackwell.  Use it, and you only need to replace
    the compute board (not the power system, cooling, networking, etc.)<p>Nvidia will
    buy back the Blackwell boards you remove (and sell them to someone else, with
    a warrantee).<p>If you want to do an upgrade that increases power use, you may
    have to get a new rack.  All of the parts are modular, and all parts can be sold
    back to Nvidia.<p>Nvidia does this because they have to.  Without it, many customers
    would consider other vendors when upgrading, or delay purchases in case something
    better comes along later."
