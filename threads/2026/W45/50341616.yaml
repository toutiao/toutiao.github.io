  author: Jtsummers
  text: In the US, the 24th Amendment makes it illegal to charge people a tax to vote:<p><a
    href="https:&#x2F;&#x2F;constitution.congress.gov&#x2F;constitution&#x2F;amendment-24&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;constitution.congress.gov&#x2F;constitution&#x2F;amendment-24&#x2F;</a><p>&gt;
    The right of citizens of the United States to vote in any primary or other election
    for President or Vice President, for electors for President or Vice President,
    or for Senator or Representative in Congress, shall not be denied or abridged
    by the United States or any State by reason of failure to pay any poll tax or
    other tax.<p>Any states requiring a particular kind of ID for voting have to make
    a suitable ID available for free, they cannot charge for it or it becomes a de
    facto poll tax. That means that while they may accept a driver&#x27;s license
    or passport (which cost, at least in every state I know of DLs aren&#x27;t free),
    they also have to have some suitable <i>free</i> ID (other than the time to obtain
    it). But even the time to obtain an ID can become subject to lawsuits against
    states if they try to play games with it like closing down DMV locations or cutting
    down on operating hours to make it harder for people to obtain the necessary ID.
