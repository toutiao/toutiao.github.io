  author: aftbit
  text: "&gt;There are zero reasons to have any less concerns about ideological biases,
    side effects of the mechanisms used to implement ideological biases, or code backdoors
    in a US model<p>If you are a US based critical infrastructure provider, I&#x27;d
    argue that you have already accepted a baked-in threat of ideological misalignment
    from the US, but you have not accepted it from farther away countries like China.<p>&gt;a
    supplier of open (as opposed to hosted) model weights is not an active ongoing
    partner with whom the idea of supply chain risk from possible future divergence
    of interests is coherent<p>I disagree. Models are improving so quickly that you&#x27;d
    probably not want to freeze yourself on an older model forever. You likely want
    to continue to upgrade models. The best way to do this is to build a sufficiently
    powerful and representative benchmark that you can confidently move to _any_ model,
    but you might expect that future models from the same providers that you accepted
    before will show less divergence than totally new providers. Similarly, if you
    build your inference around one of their custom tools (e.g. DeepInfer rather than
    vLLM), you might find substantial switching costs in moving away to another provider.<p>&gt;And
    your speculation about future protectionist regulation is just that, not an actual
    fact.<p>It&#x27;s not a done deal for sure, but you can already see a lot of signs
    of this in recent actions from the government. I can tell you based on personal
    experience that some customers will automatically rule out any Chinese models."
