  author: vikramkr
  text: Terms can have multiple definitions and language is descriptive not prescriptive.
    If you intend to communicate that you mean &quot;Pareto frontier&quot; in the
    current context you need to include the word &quot;pareto.&quot; If you don&#x27;t
    then &quot;frontier&quot; will be understood as referring to mythos&#x2F;astra&#x2F;opus
    5.5 tier models in intelligence (max capability regardless of tradeoffs). It doesn&#x27;t
    matter that the second definition in the dictionary is the one you want to convey
    (charitably assuming you&#x27;re not trying to mislead given the value of the
    hype of being able to call your model a frontier model) if your audience understands
    what you&#x27;re saying to mean the first definiton.
