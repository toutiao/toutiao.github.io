  author: Tade0
  text: Experts are not typically moved between VRAM and system RAM during inference,
    as it would be too slow.<p>What happens instead is that the &quot;dense&quot;
    parts of the model like e.g. the router are put into VRAM and the remainder of
    VRAM is occupied by the KV cache and whatever experts still fit.<p>The rest -
    usually just the experts - reside in RAM, but it&#x27;s bo big deal.<p>Additionally,
    some models utilise an n-gram table, of which only one row is read per token,
    so it can actually be stored on disk without issue. Example:<p><a href="https:&#x2F;&#x2F;huggingface.co&#x2F;ISTA-DASLab&#x2F;Qwen3.8-Flash-Next-GSQ-RCO-GGUF"
    rel="nofollow">https:&#x2F;&#x2F;huggingface.co&#x2F;ISTA-DASLab&#x2F;Qwen3.8-Flash-Next-GSQ-RC...</a>
