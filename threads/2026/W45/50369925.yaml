  author: GuB-42
  text: 'It is technically frontier, if by &quot;frontier&quot; we mean the Pareto
    frontier.<p>Being at the Pareto frontier means that you can&#x27;t get something
    better on one aspect without compromising on some other aspect. The trick is that
    it is easy to be at the Pareto frontier by having enough dimensions.<p>Here, we
    have 4: score, number of parameters, origin (US) and open-weight. You can get
    a better score or a lower number of parameters, but you have to compromise on
    at least one of the other aspects. That&#x27;s a pretty weak frontier if you ask
    me.'
  score: 0
