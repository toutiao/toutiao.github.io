  author: chrismorgan
  text: 'This is a good demonstration of why you <i>really</i> shouldn’t do this.
    Bluntly: this is <i>completely</i> unusable for many people, <i>barely</i> usable
    for a lot more, and on desktop and mobile both I would <i>absolutely hate</i>
    to use this, and a lot of the problems in it fundamentally cannot be fixed.<p>&gt;
    <i>But it also means the editor looks and behaves the same in every browser, on
    desktop and on phone, because nobody else is in charge of the pixels.</i><p>You
    say this as though it were a good thing. It’s very much not; they’re not <i>supposed</i>
    to be the same, they have slightly different expected renderings, and significantly
    different interactions.<p><i>And you can’t inspect or emulate them.</i><p>—⁂—<p>First
    of all, Firefox under Linux. I see it renders with my chosen fonts, indicating
    (since you’ve said you’re using 2D canvas) that you’re using fillText. Good; I
    would complain more about the alternative. But it does kinda go against a lot
    of what you said about who was in charge of the <i>pixels</i>.<p>I use my Compose
    key. Underlined · placeholders, proper replacement, <i>&amp;c.</i> Huh, you’ve
    surprised me by actually handling that correctly. Well done.<p>Though I do note
    that when I type U+1F928 FACE WITH ONE EYEBROW RAISED in a title, in the app’s
    sidebar and top-of-page title it becomes U+1F929 GRINNING FACE WITH STAR EYES.
    That’s… not encouraging, but ultimately presumably Just a Bug.<p>I switch to Telugu
    and type “telugu”, తెలుగు. Uh oh… with each new consonant it drops the completed
    syllable, and when I press Escape at any point it deletes the composition. Utterly
    debilitating bug for IME usage, but ultimately fixable.<p>I enter some text, find
    that for the most part it works significantly better than I expected, even handling
    things like clipboards pretty well.<p>Then I turn to what I <i>know</i> it will
    fail, because it’s <i>not possible</i> to get correct universally (different platforms
    have different behaviours and you can’t probe it; user-agent&#x2F;platform sniffing
    would get the best results): keyboard navigation. <i>Ugh</i>, Ctrl+{Left,Right}
    is <i>utterly</i> wrong. I expected it to have implemented perhaps Windows’ behaviour
    and I’d complain about that, but no, it’s stopping at both the end of one word
    and the start of the next, which no platform has ever done. Ctrl+{Up,Down} doesn’t
    work by paragraphs but still by line. PageUp&#x2F;PageDown kinda work but the
    amounts they move by are just wrong, <i>very</i> wrong. And so on. Cursors are
    frustratingly non-native the while (becomes move when hovering over selected text).<p>I
    check whether Backspace seems sane on Telugu text. Seems to be, to my satisfaction.
    Ctrl+Backspace, of course, is utterly wrong like Ctrl+Left was.<p>I decide to
    skip testing any BiDi. But I do run through some of <a href="https:&#x2F;&#x2F;lord.io&#x2F;text-editing-hates-you-too&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;lord.io&#x2F;text-editing-hates-you-too&#x2F;</a>,
    and watch it fail vertical cursor movement, affinity, emoji modifiers… meh, BiDi
    is here, so I decide to test it once and oh dear while it supports the general
    concepts properly (including selection) it seems to think that if you give it
    a little bit of RtL in an LtR paragraph it should turn the paragraph RtL which
    is <i>badly</i> wrong, and then it handles other aspects of selection and keyboard
    interaction <i>badly</i> wrongly. And it already failed composition. So yeah…
    it failed them all, where Firefox handles them all correctly.<p>I try zooming
    with my touchpad. Nothing happens if the cursor is over the canvas. Grr. Works
    but leaves the canvas blurry if the cursor is outside it. (Fixable.)<p>I paste
    the full text of <i>Winnie-the-Pooh</i> &lt;<a href="https:&#x2F;&#x2F;www.gutenberg.org&#x2F;cache&#x2F;epub&#x2F;67098&#x2F;pg67098-images.html"
    rel="nofollow">https:&#x2F;&#x2F;www.gutenberg.org&#x2F;cache&#x2F;epub&#x2F;67098&#x2F;pg67098-images.ht...</a>&gt;.
    It locks up the browser tab for several seconds. (Not fundamental, but not surprising
    either. The browser can handle pasting a mere 26,000 words with light markup in
    an instant.) And takes perhaps minutes more in the background to decide it is
    failing to upload all the images (and regularly goes and tries to load them again
    later). It also inserts blank paragraphs between every paragraph and turns italics
    into underscore wrapping for no apparent reason. And mangles “*** START OF THE
    PROJECT GUTENBERG EBOOK WINNIE-THE-POOH ***” into italic “<i>\\\\\\ START OF …
    \\\\\*”. Not encouraging, though once again not particularly about canvas text
    editing.<p>Now the document is long enough, I try scrolling. </i>Oh no.* Scrolljacking!?
    That was completely unforced error! You <i>must</i> use a real scrolling area.
    Scrolling is now utterly tedious for me, because it’s not possible to implement
    scrolling yourself from the events exposed to you, and whatever monstrosity it’s
    doing instead gets the scroll rate wildly wrong and lacks inertia, so a full swipe
    on the touchpad gets almost a pageful instead of several plus a hundred more if
    done fast. Combined with it hiding its fake scrollbar until you scroll, large
    documents are nigh unusable. Now once again, this is not fundamental to canvas
    text editing, so long as you’re willing to put the thing in a proper scroll area
    that you maintain.<p>I switch to Firefox for Android with the FUTO keyboard. Initially
    things seem to be working well, better than I expected, particularly given how
    I’ve observed the backing text input is generally only being given a word at a
    time—I think FUTO must be remembering words itself for its suggestions, working
    around how badly broken what it’s being given is. But then I try to shift the
    cursor by sliding my finger along the Space key, and it <i>doesn’t work</i>. I
    switch to something else and come back, and selection is shot, it’s lost the caret
    and I don’t know what happened to it, and various keyboard interactions are broken.
    I press and hold on a word to select it as <i>always</i> works, and… it doesn’t:
    no, it seems like they’ve implemented something a little more like my vague memories
    of iOS from when I’ve seen that; and badly at that. Correct selection is rendered
    tedious, unreliable, and sometimes impossible. And as for doing anything <i>with</i>
    that selection… it offers Copy, Cut, Paste. Utterly inadequate, stopping the browser
    from doing stuff with the text (e.g. share to another app), but <i>unavoidable</i>
    in the canvas approach.<p>At this point I give up; it’s completely unusable for
    anything but the basics. A lot of what I complained about is just that this is
    buggy and incomplete, but a lot of it is also fundamentally unfixable.<p>Even
    the buggy and incomplete parts indicate why the approach is, to put it gently,
    <i>risky</i>. But the unfixable parts—<p>This is why you should only use contenteditable.<p>And
    I didn’t even get to throttling my CPU to 400MHz to test performance. But it’s
    after half past midnight and I should be asleep already.'
