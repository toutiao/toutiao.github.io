  author: chrismorgan
  text: 'I have pointed out various fixable bugs, but I also pointed out some critical
    things that are fundamentally unfixable, and make the entire approach unbearable.
    You <i>cannot</i> make it acceptable on a pretty large fraction of mobile devices,
    and even where it’s not horribly broken, it’s still radically different from <i>every
    single other thing on the device</i> in extraordinarily frustrating ways.<p>As
    for Google Docs, well, I’ll just link to what I’ve written about it before: <a
