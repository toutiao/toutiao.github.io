  author: hnlmorg
  text: Unicode defines the width of characters. This is what the POSIX functions
    like wcwidth refer to. eg <a href="https:&#x2F;&#x2F;www.unicode.org&#x2F;reports&#x2F;tr11&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.unicode.org&#x2F;reports&#x2F;tr11&#x2F;</a><p>So
    you shouldn&#x27;t need knowledge of the type-face to know the size of the printed
    character. If other libraries are printing the characters and then extracting
    the width from that, then they&#x27;re doing it wrong and you should look to use
    a different library instead.<p>The bigger problem I&#x27;ve run into is not different
    libraries making up their own width assumptions. It&#x27;s been libraries built
    against outdated versions of the Unicode standard.<p>&gt; The terminal emulator
    must handle a lot of RtL stuff to get it acceptable. In raw mode (where dimensions
    are knowable) you could almost leave it to the app, but outside raw mode it’s
    pretty obvious that the terminal has to be BiDi-aware. But even in raw mode, you
    really can’t treat it as you describe, because Arabic text rendering is rather
    complex, full of necessary ligatures.<p>I think RTL is a distraction from the
    actual point that we&#x27;re discussing. But it&#x27;s worth noting that there
    are already CSI sequences for enabling RTL behaviour in terminal emulators. It&#x27;s
    not something I&#x27;ve personally implemented in my own projects because I have
    no personal need for it and have had no feature requests from people asking for
    it who could test the implementation&#x27;s soundness (unlike Chinese characters,
    which have seen a reasonable degree of popularity in the projects I&#x27;ve built).
    But I&#x27;m sure some other terminals support it just fine since it was added
    decades ago as part of ECMA 48.
