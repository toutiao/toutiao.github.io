  author: chrismorgan
  text: There are several quite different things called wcwidth, in part because as
    a POSIX function it wasn’t well-specified; now I think there are two main families
    of it, maybe still three; <a href="https:&#x2F;&#x2F;wcwidth.readthedocs.io&#x2F;en&#x2F;latest&#x2F;specs.html"
    rel="nofollow">https:&#x2F;&#x2F;wcwidth.readthedocs.io&#x2F;en&#x2F;latest&#x2F;specs.html</a>
    is the best-specified and -considered of them, but not the most popular. Then
    there are others that see how wide a character renders, and quantise in some fashion
    to cell. (This obviously requires knowledge of the font, which <i>should</i> be
    unavailable to the shell, so it’s a technique only terminals can use.) And in
    all of these, there are multiple incompatible versions hanging around. The aforelinked
    one shows some of its changes over time as they wrestle with trying to get things
    as reasonable as possible, which is fairly obviously hopeless anyway. (Some characters
    are just too wide, some extremely so, some less so. U+FDFD is generally made 1×1,
    but it should truly be something like 2×2 or 1×8 or a little wider depending on
    whether the font employs <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Word_heaping"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Word_heaping</a>.
    Or the widest Telugu consonant, <i>y</i>, which wants to be 2 columns by itself
    or 3 or 4 columns with some conjuncts and vowels (e.g. <i>ykuu</i>, య్కూ), but
    gets squished to one by itself or two in those wider cases.)<p>The terminal emulator
    <i>must</i> handle a lot of RtL stuff to get it acceptable. In raw mode (where
    dimensions are knowable) you could <i>almost</i> leave it to the app, but outside
    raw mode it’s pretty obvious that the terminal has to be BiDi-aware. But even
    in raw mode, you really can’t treat it as you describe, because Arabic text rendering
    is rather complex, full of necessary ligatures.
