  text: |-
    The approach I might take would be to set a synthetic request header in Caddyfile.pre based on the existing has_user_cookie there, and then switch on that in the Anubis config. That's not impossible to bypass, but I bet it'd be enough.
    You could also look for the presence of the lobster_trap cookie specifically, but to be really secure you'd have to bounce any user with an invalid cookie to the login page (or otherwise refuse expensive requests in the rails app [without a valid anubis cookie?], because they're already past anubis).
    Anyway, if that first idea seems reasonable, I'll try to come up with a PR tonight.
