  author: lproven
  text: |-
    I'm talking about the atrocious TN panels.

    For those of us who used greyscale passive-matrix LCDs in the 1990s, they are more than good enough, they are fine.
    Features like mouse pointer trails, pointers that get bigger when wiggled, circular ripple-circles when you press Ctrl, and other ways to find your mouse pointer are because on '90s flatscreens, move the mouse and the pointer vanished until it stopped moving again. Those displays had a refresh interval for rapidly-changing image details in whole seconds.
    When you lived with that, an TN panel is a joy to use. It's still a miracle of tech. I don't need retina displays, HDR, any of that: a 15Y old full colour flat panel LCD is still amazingly good.
