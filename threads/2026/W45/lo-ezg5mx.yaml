    I have fond memories of older Thinkpads. I recently acquired a friend's cast off Thinkpad P1 Gen-3 for free when they upgraded. I intended to use it with Windows 11 for $WORK but had the satisfaction of wiping that to install Linux when they laid me off. It's surprisingly light with its 4k screen, Nvidia gpu, and i7 and I popped in a 256GB nvme and 32GB of sodimms pulled from another laptop. Despite being fast it's somehow not as nice to use as the older ones. The keyboard, which I had replaced for him with an OEM unit, just doesn't feel as good as old ones and the touchpad is just okay[1]. I doubt I'd buy one in the future.

    There's also some weird interaction on both Windows and Linux between, I believe, the trackpoint and the touchpad where I can move the cursor but can't click for a few seconds. Trying the other pointer works. It also happens with an external mouse. It's inconsistent and just long enough to be frustrating. I'm going to try disabling one or both of them.
