  author: kccqzy
  text: In the age of AI, there are only more and more security vulnerabilities to
    be discovered, and backporting all of them to outdated kernels will be nigh impossible.
    I’d not rather make such security patches dependent on the timeliness of backports
    especially if it is done by a distro. I suggest you use a rolling distro rather
    than anything with LTS kernels. The CVE in the original post CVE-2026-98432 is
    fixed since 7.3 and 7.3.1 is already out. If a distro doesn’t offer kernel 7.3.1
    today, rule it out.<p>In general I find distros using old kernels annoying because
    Linus treats compatibility seriously and “don’t break use space” has been their
    mantra for many years. On desktops in particular, GPU driver improvements like
    <a href="https:&#x2F;&#x2F;www.phoronix.com&#x2F;news&#x2F;Linux-7.3-DRM" rel="nofollow">https:&#x2F;&#x2F;www.phoronix.com&#x2F;news&#x2F;Linux-7.3-DRM</a>
