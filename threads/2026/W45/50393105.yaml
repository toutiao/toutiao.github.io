  text: I worked there for a couple years. IMO, the hiring process holds Canonical
    back from scaling like a typical tech co, but they probably don&#x27;t want to.
    It also attracts a <i>very</i> specific type of person; everyone I personally
    worked with was very bright and capable.<p>IME, because of pay, they have a hard
    time retaining &quot;senior&quot; talent, eg Nvidia, Chainguard, Amutable, Lambda,
    etc etc etc all have lots and lots of senior+ Canonical engineers. Especially
    in the age of AI, I think this is a &quot;people-strategy&quot; mistake.<p>The
    application process is very long and you absolutely lose great candidates because
    of it. Salaries are not US-tech competitive, but absolutely are Central&#x2F;South
    America and Europe competitive. Lots of great Brazilian and Polish engineers,
    for example.<p>Also I have never seen a post on HN, Reddit etc about Canonical&#x2F;Ubuntu
    that doesn&#x27;t complain about hiring process. I think it does a pretty incredible
    amount of damage to the brand.
