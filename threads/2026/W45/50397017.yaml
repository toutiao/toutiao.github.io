  author: mik3y
  text: 'The evil site is acting as a reverse HTTP proxy: When you do a `GET evilsite&#x2F;foo`,
    to compose its response the server first does a `GET targetsite&#x2F;foo`, mutates
    the response however it likes, and passes it along to you.<p>So you don&#x27;t
    need to worry about CORS from the perspective of the web app, nor need a real
    browser, because the victim is only ever interacting with the evilsite endpoints.<p>Certainly
    there are ways the target site could try to thwart this (i.e. detect unusual request
    patterns from wherever the proxy server is fetching from; client-side JS to detect
    the site being hosted on a foreign domain; etc). But at that point it&#x27;s an
    arms race.'
