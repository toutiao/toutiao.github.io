  text: For prior related work, check out patent US-6377261-B1 &quot;Compiling glyphs
    into instructions for imaging for execution on a general purpose computer&quot;
    filed 1996.  The basic idea is each character turns into a sequence of &quot;Load
    Immediate&quot; &#x2F; &quot;Shift&quot; &#x2F; &quot;OR to Memory&quot; instructions;
    so there&#x27;s no more fetching from a stored bitmap of the font, as the pixels
    are implicit in the Immediate data in the generated machine code.  Then you can
    get fancy when one row of pixels is the same as the previous row in the character,
    so you don&#x27;t even need to do the Load Immediate.  Etc.  This scheme was used
    in FrameMaker for Macintosh back in the day, as implemented by Gus Fernandez (who
    went hog wild on additional optimizations).
