  author: titzer
  text: "&gt; But as an counterexample, do we need to hold machine code or assembly,
    generated from our C or Golang programs, in our heads?<p>No, the source is enough,
    because the low-level assembly is translated from the high-level source descriptions
    (a sound programming language with a complete and consistent specification) via
    a deterministic algorithmic translation process (a compiler) to a low-level executable
    that can run on a machine. Today, compilers are complex, but still human understandable.
    The programs are equivalent, and we&#x27;re getting better able to actually prove
    this.<p>This is why I bristle when people say &quot;post your prompts&quot;. Your
    prompts are not a program and the magic box is not a compiler.<p>Too many people
    abandoning everything, either due to laziness, mental overload, or...&quot;skill
    issues&quot;.<p>I still want to see code. I want write code, check code, optimize
    and refactor code. I don&#x27;t want to spend <i>a lot</i> of time debugging,
    but maybe a little.<p>The clankers should be accelerating the parts of the process
    we are bad at, and that takes time we won&#x27;t spend: long, time-consuming refactors,
    debugging deep issues, writing crap tons of tests, investigating performance issues,
    digesting other people&#x27;s code.<p>AI should be more like a bicycle than a
    cruise ship. And I mean the &quot;bicycle for the mind&quot; that Jobs wanted."
