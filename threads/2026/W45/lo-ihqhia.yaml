  text: I think the lack of arenas is (in part) a combination of two things. First,
    most versions of Research Unix had small memories (everything through V7 mostly
    ran on the PDP-11 series, with 64KB of data address space per program), which
    increases the practical impact of the overhead and wastage from arenas. Second,
    even through V8 there was no mmap(), so program data space was fundamentally linear
    (with a top, the break). Even if you had layered an arena allocator on top of
    it, you'd need an underlying malloc-like block allocator to carve up and release
    the arena areas; in effect they'd be an additional layer on top of malloc() and
    free().
