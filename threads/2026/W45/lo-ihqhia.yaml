    The other problem they have is (in languages that have manual memory management) you need to know none of your pointers have escaped. Any globally accessible cache must only ever hold data that is outside of the per request pool.
    I’ve seen per request pools suggested on multiple projects as a way to remove deallocation overhead and possible leaks, and it has always turned out those leaks were more complex than just a missing free.
