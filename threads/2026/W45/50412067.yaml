  author: Imustaskforhelp
  text: I am starting to believe that if something is worth sharing, it is worth writing
    (atleast once) by a human completely. An AI clean&#x2F;pass-up after that might
    be okay but atleast once, an author should try to create the whole piece.<p>I
    used to have a real complicated dilemma on which content exactly to write (&amp;
    then share), I recently started using handy&#x27;s TTS and storing it in my scratchpad
    app within my native language or English and then I paste it into Chatgpt and
    use its memories to connect with other previous discussions I had.<p>It helps
    in saving thoughts which would&#x27;ve otherwise been lost, even provide some
    new perspectives and get them in a way that I can access them later in more depth.<p>I
    think that if I were to now create blogs of these contents. I used to think that
    it would perhaps be okay to share an blog like thing created by AI if say I spent
    10-20 minutes thinking of the rough draft of it, but after reading your comment,
    I am reflecting on the fact that, atleast once, people should write things themselves
    no matter which AI thing they use before creating blogs.<p>As the point of blogs
    shouldn&#x27;t be to share unlimited content but rather that it is the specific
    content where a human effort was placed. Maybe if one still wants, there could
    be some other blog post which could be written with all the AI blogs content I
    have created perhaps but still, it should be seperated away from human content.<p>And
    there is this fact that as you mention, writing itself forces you to think through
    ideas and thoughts which are highly relevant. So previously when I used to think
    that re-writing them would be a waste of time and that AI writes them good enough.
    I think that writing them still might make a lot of sense as it would be a net
    benefit if not for anybody else, then for me as it can help me better understand
    the material myself (even more so than reading&#x2F;speaking it)<p>The most typing&#x2F;writing
    of myself now occurs in Hackernews comments for me and I do observe that I learn
    a lot writing them personally.
