  text: It&#x27;s an attractive thought, this comparative look at FA and TM. However
    it is misleading to an extent.<p>A Turing Machine&#x27;s capabilities exceed the
    FA&#x27;s because it has a &#x27;store of knowledge&#x27;. It is both <i>recording</i>
    and <i>reading</i>, repeatedly. There is <i>erasure</i>, too. So if we&#x27;re
    aspiring to TM-hood, the guidance seems to be <i>write</i>, and <i>re-read</i>
    (your own thoughts), and <i>re-evaluate</i>, and <i>re-write</i>. This process
    is subject to the halting problem. &#x2F;g
