article:
  url: http://muratbuffalo.blogspot.com/2026/11/writing-as-thinking-tool.html
  title: Writing as a thinking tool
  fetch_status: success
  content: "### Writing as a thinking tool\n\n- Get link\n- Facebook\n- X\n- Pinterest\n-
    Email\n- Other Apps\n\n-\n\nIn middle school I could not get through long passages
    no matter how hard I tried. I would read an entire page and find that nothing
    had registered, so I started taking notes out of desperation. This was the late
    80s, and Tony Buzan's mind maps had just reached Turkey. This led me to produce
    pages and pages of notes that looked like spiderwebs. Creating those notes have
    helped me tremendously. I made sense of what I was reading by figuring out which
    branch they would hang off in my mind maps. I realized my pages were not for storing
    the information as much as they were for processing it.\n\nIt took me another
    ten years to understand why this works so well. During a stretch of PhD procrastination,
    I read [Manuel Blum's advice to graduate students](https://www.cs.cmu.edu/~mblum/research/pdf/grad.html):\n\n>
    You are all computer scientists.\n> \n> You know what FINITE AUTOMATA can do.\n>
    \n> You know what TURING MACHINES can do.\n> \n> For example, Finite Automata
    can add but not multiply.\n> \n> Turing Machines can compute any computable function.\n>
    \n> Turing machines are **incredibly more powerful** &nbsp;than Finite Automata.\n>
    \n> Yet the only difference between a FA and a TM is that\n> \n> the TM, unlike
    the FA, has paper and pencil.\n> \n> Think about it.\n> \n> It tells you something
    about the power of writing.\n> \n> Without writing, you are reduced to a finite
    automaton.\n> \n> With writing you have the extraordinary power of a Turing machine.\n\nThis
    is a crisp technical claim about which problems you can solve with writing. If
    you take the paper away, you downgrade yourself by an entire complexity class!\n\nI
    think this explains a lot about human history as well. Language let us externalize
    some of our thinking, and our species got smarter. Writing let us externalize
    even more of it, and we got smarter again. I suspect this is also why LLMs are
    as capable as they are: so much of our intelligence is already deposited in language
    that a model trained on it inherits a good deal of intelligence for free.\n\n##
    Out-of-core execution\n\nWhen we write, we are externalizing our thinking onto
    paper, and that is what raises our capability to think bigger thoughts. I liken
    this to [out-of-core execution, or external memory algorithms](https://en.wikipedia.org/wiki/External_memory_algorithm).\n\nA
    good example of this for me is [reviewing a paper](https://muratbuffalo.blogspot.com/2013/07/how-i-read-research-paper.html).
    When I read a paper, I think I understand it, and then I sit down to write the
    review and find out I understood maybe 60% of it. While writing the review, I
    end up contextualizing the paper better, and get to understand it fully. And sometimes
    I even realize the ideas are bigger than the authors noticed, and they connect
    to many other things.&nbsp;\n\nSometimes the unearthing goes further than understanding
    one paper. In 2018, [I wrote a quick post about the anatomical similarities between
    Paxos and Nakamoto consensus](https://muratbuffalo.blogspot.com/2018/03/anatomical-similarities-and-differences.html).
    I had not started with that thesis originally. I started writing, and the connections
    got clearer as I went, and that post became the seed for one of our research papers.
    This is not uncommon, [this is called freewriting](https://muratbuffalo.blogspot.com/2018/05/book-review-accidental-genius-using.html).
    This is what happens when you give the machine a tape.\n\nWriting is also the
    reason I remember anything. I refer back to my own blog constantly. Because I
    strained my brain writing those posts, rereading them re-fires the same neurons,
    and I reconstruct the understanding quickly. In this sense, the blog became my
    external memory. The thoughts I never wrote down do not stick well, because they
    were never fully thought.\n\n> If you think without writing, you only think you're
    thinking.\n> \n> -- Leslie Lamport\n\n## Writing in the age of LLMs\n\nIs writing
    for thinking getting obsolete now since you can now argue anything with a model
    that has read everything?\n\nWell, the model has read everything except what is
    in your brain! It knows the literature, the standard framing, and the consensus.
    But it does not know your half-formed intuition about why the standard framing
    may be wrong for this particular case. AI made a lot of progress, but I don't
    trust an LLM to take the creative leap and make a new connection. I think that
    would require another AI breakthrough. So, if you open the chat immediately on
    anything, you lose the opportunity to write/think for yourself.\n\nThis is a real
    problem, and [it seems to be spreading quickly.](https://alifeengineered.substack.com/p/on-the-death-of-amazons-writing-culture)
    We have been celebrating Amazon's six-pager as a great example of writing-for-thinking.
    Bezos had said: \"There is no way to write a six-page, narratively structured
    memo and not have clear thinking.\" Unfortunately, with LLMs, that sentence has
    stopped being true. You can now produce six pages with no thinking at all, and
    the six pages still look like evidence that the thinking happened.&nbsp;\n\nA
    model optimizing next-token probability cannot do your thinking. If you trust
    it to hold the pen, no thinking would get done. As everyone turns their thinking
    down and becomes a meat-proxy for generated text, if you still keep writing yourself,
    you would still be thinking for yourself. So [writing is now a comparative advantage](https://muratbuffalo.blogspot.com/2026/08/the-safest-job-from-ai-may-be-writing.html),
    and a widening one!\n\nAnyways, enough about why you should write. Here is my
    advice on how you should write.\n\n## Rule 1: Mess up\n\nThe first rule of writing
    club is to produce in bulk with no restraints at all. Don't criticize, don't fix
    the typos, don't write in full sentences if you don't feel like it. The goal in
    this phase is to just accumulate text and get to a zeroth draft you can work with.\n\n[McPhee
    argues best](https://muratbuffalo.blogspot.com/2019/03/book-review-draft-no-4-by-john-mcphee.html)
    for why getting anything down matters so much. Even if you had a bad writing session,
    it gave your mind something to work with. After you get something down, you can
    spot problems with it and think of better ways of phrasing things. But none of
    that happens without the drafted version to react against.&nbsp;\n\nThis is also
    how research papers get written. Open a notes.org file and treat it as a lab notebook:
    write while you do the work, explore every tangent, produce without any pressure
    to be presentable. [In the Köroğlu post](https://muratbuffalo.blogspot.com/2014/03/how-to-write-your-research-paper.html)
    I compared this to the foal fattened in a pitch-black stable before any training
    begins. The key part of that frame is the stable. During this phase you guard
    the idea from critics, including and especially yourself. Ideas start out fragile
    and easily squished. So suppress judgment for a while and see what the thing becomes.\n\n##
    Rule 2: Tidy up\n\nNow you must become the critic, the editor. Forget that you
    wrote this. Imagine some other guy wrote it, and do a harsh review. Cut ruthlessly.
    Take delight in deleting text the way you would in deleting code. If you cannot
    bear to delete a good sentence, move it to a junk buffer at the bottom of the
    file so you can tell yourself you might bring it back. Spoiler: you won't.\n\nDon't
    be discouraged by how bad the first draft was. [McPhee says](https://muratbuffalo.blogspot.com/2019/03/book-review-draft-no-4-by-john-mcphee.html)
    the way to do a piece of writing is three or four times over, never once. This
    is good news. Thinking in multiple drafts takes the pressure off: you don't have
    to be spontaneous, brilliant on the first pass, or finished today.\n\nI think
    the reason writing works so well for thinking is that it slows you down while
    keeping you on the problem. In that extra time, the insights and connections get
    room to surface. [Chunking](htt"
