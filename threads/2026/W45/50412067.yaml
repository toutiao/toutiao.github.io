  author: sidrag22
  text: When i started writing i felt the pressure to always go from draft to a polished
    piece. i posted a couple things i worked semi hard on and received 0 views&#x2F;reads
    because i don&#x27;t really have much of an online presence at all.<p>From there
    i kinda just moved on and write purely for myself, and use it to up my own thoughts.
    Very rarely, something will receive a second pass days later, and thats just more
    to go back on my past thoughts and try to tighten them if i feel that is needed.<p>I
    tend to split my day into two parts, my work hours and my &quot;unplug&quot; hours,
    and the writing was mostly landing in those unplug hours as a way to sorta summarize
    my day. Last week or so I decided im moving that writing into the very first thing
    I do each day, and it has really been absurdly effective at getting new ideas
    flowing quickly. I used to depend on my later day brain that was somewhat &quot;depleted&quot;,
    for lack of a better way to describe how i work, and from there that would kinda
    birth what i work on the next morning, with maybe some iteration while working.<p>Now
    instead I just do both, I open the day with ~500-1500 words, just anything that
    comes out, then i potentially get stuck, and ill maybe dump that to a model as
    just a modern rubber duck, not anything like &quot;write for me, or finish this
    thought&quot;, just a kinda nudge to really toss back at me what im fully considering
    and then maybe i pivot back and chase down the most interesting of the topics
    for a few hundred more words, or get straight to work on what i thought was the
    most vital of all those ideas to chase while im fresh in the morning.
