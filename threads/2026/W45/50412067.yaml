  author: sublinear
  text: Words are most effective when they buck the trend in <i>just</i> the right
    way.<p>I&#x27;ll use the conference room example for clarity, even though a lot
    of people still work remote these days.<p>Reading the room could be as subtle
    yet significant as reacting to the speaker that was on immediately before you.
    It could be reacting to the temperature of the room or the catered lunch everyone
    just had. It can be noticing or participating in or critiquing a peculiarity of
    the audience (hawaiian shirt fridays, etc.). It can also be a million other things
    and they&#x27;ll never let you get away with choosing at random. You have to just
    &quot;get it&quot; or you&#x27;re going to be ignored at best.<p>You&#x27;re at
    once trying to both signal in-group status while also asserting your own identity
    and setting the tone for everything you&#x27;ll be saying after. Remote work has
    its own idiosyncrasies, but regardless, you need a pulse for this kind of work.
    And, all this is just the introduction. What about emphasis choices in the rest
    of your writing&#x2F;speaking?<p>Trying to pin that down is simply not logical
    and it&#x27;s not just a matter of &quot;adding&quot; a handful of tricks unless
    you want to alienate everyone. Sometimes it&#x27;s also the things you <i>don&#x27;t</i>
    say or do that make the difference. You also have to accept that you can&#x27;t
    please everyone. You could actually piss off everyone but the most important person
    in the room and still win. That might actually be the best way or the only way
    to win sometimes (as was the case for the American sales pitch of AI itself!).<p>The
    real world is messy and adding AI, or any particular process, to the mix just
    makes it worse. You cannot plan an accident, but you can avoid one.
