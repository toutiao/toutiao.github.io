  text: 'This is my stance, but I go further to say that that you shouldn&#x27;t even
    use it for feedback...<p>The feedback bit is surely more debatable, but I would
    argue the initial writing and allowing edits are not.<p><a href="https:&#x2F;&#x2F;antoaenono.com&#x2F;write&#x2F;fragments&#x2F;writing#:~:text=never%20have%20a%20model%20review%20your%20writing"
    rel="nofollow">https:&#x2F;&#x2F;antoaenono.com&#x2F;write&#x2F;fragments&#x2F;writing#:~:text=never...</a><p>With
    respect to seeking feedback, my angle is that: even if you do agree with the feedback
    then what they do. Are you going to take it as is? Are you going to come up with
    it and phrase it in your own way?<p>What next? Next, what if there&#x27;s a bunch
    more feedback that you agree with and you incorporate it. Then, where do we go
    from there?<p>Can you even go back to (b) and make your <i>own</i> edits at this
    point? I&#x27;m not sure and I worry about a slippery slope where you stray too
    far from your own original form -- so I landed on not seeking feedback either.<p>note:
