  author: drewbeck
  text: 'This is true for designing, too. I see a lot of people saying Figma is dead
    because you can prototype directly; for novel UX problems the act of designing
    — of putting ideas together, assembling a component, even getting good data into
    a design — is where a lot of my thinking and insights develop. The brain work
    plus the craft work, the tight loop between thinking and creating is so critical
    for me and I haven’t found nearly the same feeling when prompting.<p>In writing
    and designing I think we often have a thought-feeling first: something inchoate
    that we can’t quite articulate yet. Getting directly to the medium itself — text
    or frames and layouts — is how we give shape to that feeling and turn it into
    a concept, insight or design.'
