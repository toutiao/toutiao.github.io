  author: 0c3ca83
  text: I agree, it sounds like you have a problem between your keyboard and chair,
    if you&#x27;re generating any volume of output and not getting it in detail.<p>The
    act of vetting it and finding the failures will increase understanding, but at
    a cost in speed over doing the research from scratch. (Generating subtly wrong
    text is often a good way to test understanding, and the output of AI systems is
    typically a mangled clone of some other well understood system. A very good exercise
    is building your internal pattern recognition so you can tell what&#x27;s been
    mangled, mashed, and served up)<p>AI is very good at making the mash sound plausible,
    however, so if you don&#x27;t look extremely closely, you end up repeating instead
    of dissecting it. And if you&#x27;re hoping to learn from the AI how to design
    a system, you&#x27;re in trouble.
