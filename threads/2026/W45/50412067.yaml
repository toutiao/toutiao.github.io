  author: DenisM
  text: I spent a lot of time thinking about it. AI converges on average which is
    very bland. The labs are trying to get out of it with RLFH which sadly just produces
    a different “edgy” average (Calude-speak).<p>But things get better if you instruct
    AI to speak in certain style. It’s still average but for the chosen style and
    thus less tone-deaf for a given use case.<p>So my thinking is - how much mileage
    can we get by introducing specific style guides? We can create a library of styles,
    and to get out of average for a specific guide  individual companies and even
    people will maintain their own private patches from upstream.<p>Another option
    is to maintain history of your own writing and thus preserve your own voice. I
    feel like “averaging” of style is somehow un-ergonomic, in that in numbs the mind,
    and thus even diversity for the sake of diversity is valuable.
