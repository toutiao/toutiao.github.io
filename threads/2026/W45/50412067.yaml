  author: bartread
  text: The trick, I think - at least this has helped me - is not to use the AI to
    write for me, nor to use it to rewrite my drafts, but is to do the writing myself
    and to ask it for editorial feedback. This forces me to think through what I’ve
    written more deeply, and then rewrite it according to that deeper understanding.<p>I
    think if I used AI for the actual writing then, (a) there’d be a lot missing,
    and (b) I’d rob myself of much of the value, in better understanding, of writing
    myself.<p>We’re not all the same so YMMV, but this is what I’ve found from using
    AI in various ways to see if and how it can help with writing.
