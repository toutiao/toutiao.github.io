  author: iammjm
  text: "I spent an unreasonable amount of time recently thinking about how to color-
    (and symbol-) code my notes. I wanted to create a simple generally applicable
    system that I can use for any project.<p>For thinking, nothing beats handwriting.
    It&#x27;s just the unconstrained freedom of movement in every direction, shape
    or form, and the lack of friction and distractions.<p>But then you sometime also
    want to organize or share stuff, so that&#x27;s where digital comes in. I have
    an automation that takes a photo of my notes with my phone, uploads it to Obsidian,
    and OCRs it into markdown and tags it, so I basically end up with a &quot;symbolic&quot;
    1-1 equivalent of analog handwriting + digital text<p>My system still evolves,
    but what I currently use is:<p>Color:\n- black = just &quot;normal&quot; text\n-
    red = critical&#x2F;&quot;must&quot;\n- yellow = important&#x2F;&quot;should&quot;\n-
    green = highlighted&#x2F;&quot;could&quot;<p>Symbols:\n- bulletpoint\n[ ] task\n-&gt;
    reminder<p>I also do brackets and underlines which translate to # heading1 and
    ## heading2 in markdown<p>I write by hand with a fountain pen with black ink +
    use 3 fineliners and small colored sticky flags.<p>Some observations:\n- yellow
    is not great on white paper due to bad contrast; it also rarely comes as ballpoint,
    but fineliner options are available \n- blue and green are visually very similar,
    to the point of kinda being redundant \n- for sharing with other people, the system
    must be as generally understandable as possible. Here the traffic norms such as
    ISO 7010 (<a href=\"https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;ISO_7010\"
    rel=\"nofollow\">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;ISO_7010</a>)
    could be considered  \n- also there&#x27;s the aspect of accessibility, with a
    relevant portion of population being colorblind \n- The simplest most effective
    system seems to be: one main color (black or blue) and one highlight color (red
    I think works best), plus a couple of symbols such as bullet point, task, reminder
    that translate well into markdown"
