  author: jacquesm
  text: I think one factor is the uncertainty about his birth date and place that
    lasted for centuries (some of it is still disputed) which allowed a lot of place
    to claim him &#x27;as their own&#x27;. Even today people in Poland, Germany, The
    Netherlands, France, Austria, Belgium and as far away as Southern Europe believe
    that he was their countryman, speak well of him without knowing much of the detailed
    history of his reign and have all kinds of lore (stories, songs!) that refer to
    him. In the Netherlands we have him in all kinds of popular culture, including
    stories, songs, and even jokes, which kids tell each other without knowing who
    &#x27;Karel de Grote&#x27; was!
