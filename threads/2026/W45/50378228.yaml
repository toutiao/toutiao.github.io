  author: uecker
  text: Yes, it is not well-defined. But most conversions, function calls, and accesses
    are strongly typed in C, so I would not call it weakly typed.<p>Implicit conversion
    could be seen as weak typing, but it is mostly limited to specific arithmetic
    operations in C.  I would see implicit conversions as problematic if they allowed
    operations that make no sense.   Decay of arrays and function to pointer conversion
    also do not seem problematic to me for this reason.<p>Void pointers are also weakly
    typed, but they are specifically designed for this. So if you do not want this
    behavior, one would simply not use them. It is  a bit like using &quot;unsafe&quot;
    in Rust.<p>There are certainly stronger typed languages, but on the full range
    C is more on the strongly than weakly typed side in my opinion. A language that
    allows arbitrary implicit conversions between pointers, would be weakly typed,
    or which allows calling functions with wrongly typed arguments (which was true
    in the past for C a long time ago)
