    quite safe to use but people on internet scream loudly when someone try to use
    that not app global varible :) I guess their llms statistically have less new
    texts feeded in ;)<p>At some point it is just better to return pointer to struct
    with all info you can imagine.<p>And how you think other languages implemented
    their Error type returns ? Just a struct or union with tag. Because current CPU&#x27;s
    operate on simple type registers there is no other sane way to do it.
