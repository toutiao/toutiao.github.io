  author: ninkendo
  text: Rust and go still make it pretty easy to not check results if you don’t care
    about the success value (lots of code just does `let _ = foo()`), but if you do
    want the value (like with a hashing function), Rust makes it really hard to not
    check the error too. There’s no syntax to say “assume this worked and give me
    the success value, including whatever garbage is there if it’s not set”:<p>- result.unwrap()
    will panic if it failed<p>- result.ok() throws away the error but gives you a
    None value instead (still can’t use it as if it’s a success)<p>- matching on the
    Ok variant and doing nothing on the Err variant, you only get to use the success
    value inside the Ok arm<p>Etc etc.<p>The problem is when the compiler says “NULL
    is a valid instance of T”, which go lets you do, and rust doesn’t (without using
    the unsafe keyword and intentionally casting a null pointer, which you don’t do
    by accident.) Go lets you write code like `var hash string; hash, _ = hashfn()`
    and it compiles and now you have null instead of a valid hash.
