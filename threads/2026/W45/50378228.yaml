  author: muvlon
  text: C&#x27;s lack of all of<p>- sum&#x2F;union types<p>- multiple return values&#x2F;tuple
    types<p>- exceptions<p>means that most ways of returning an error from a function
    are not available in C. Because of this, many C APIs, including `crypt` in this
    case, resort to in-band error signalling by using a sentinel value (like NULL,
    a negative integer, &quot;*&quot; etc.).<p>Most other languages lack one or two
    of the above, but very few lack all three, and so most have developed a different
    culture around error reporting (Result in Rust, multiple return values in Go,
    exceptions in Java, Python etc.).
  score: 0
