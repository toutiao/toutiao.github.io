  author: boomlinde
  text: |-
    An interesting thing about C is that there is no guarantee that NULL dereferencing will &quot;surface&quot;. It&#x27;s undefined behavior.<p>NetBSD and libxcrypt both have similar workarounds. NetBSD has a paragraph on the reasoning.<p><pre><code>   The behavior of crypt() on errors isn&#x27;t well standardized.  Some imple-
       mentations simply can&#x27;t fail (unless the process dies, in which case they
       obviously can&#x27;t return), others return NULL or a fixed string.  Most
       implementations don&#x27;t set errno, but some do.  Version 2 of the Single
       UNIX Specification (``SUSv2&#x27;&#x27;) specifies only returning NULL and setting
       errno as a valid behavior, and defines only one possible error (ENOSYS,
       ``The functionality is not supported on this implementation.&#x27;&#x27;) Unfortu-
       nately, most existing applications aren&#x27;t prepared to handle NULL returns
       from crypt().  The description below corresponds to this implementation
       of crypt() only.  The behavior may change to match standards, other
       implementations or existing applications.
    </code></pre>
    OpenBSD and glibc both have similar simple, stupid-free return value implementations. OpenBSD:<p><pre><code>    The function crypt() returns a pointer to the encrypted value on success, and NULL on failure.
    </code></pre>
    GNU:<p><pre><code>    On success, a pointer to the hashed password is returned.  On
        error, NULL is returned.
    </code></pre>
    The distro I use on the desktop uses libxcrypt, though. Probably more distros are. Its, NetBSD&#x27;s and musl&#x27;s workarounds probably make sense in some way if you have no clue what goes into your userland and are willing to write stupid software to accommodate for that.
