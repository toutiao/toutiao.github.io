  author: augment_me
  text: I mean if information is decentralized, this is not far from the truth. Historically
    attribution was given because you could synthesize or create information in a
    way others could not, and it was useful to be able to trace things back to the
    source.<p>Now everyone can create everything, and the source is shared. You are
    adding to the pile of human knowledge and it gets processesed, that&#x27;s it.<p>If
    you step aside and think about it from a holistic perspective, imagine a research
    project to find a cure for cancer, or the best compression algorithm, or whatever.<p>Who
    will find the solution faster:<p>1) Entities work in isolation, produce their
    results, gets attribution, and then it&#x27;s integrated into other work.<p>2)
    Entities work in parallel, dumping their findings and work into a big pile that
    is continuously parsed and built upon.<p>The second approach does not discriminate
    partial or bad results, it does not place value on a specific contribution. It
    might be that two entities did partial solutions that only make sense together,
    and this is able to be synthesized on the fly.
