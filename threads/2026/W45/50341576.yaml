  content: "![Spreading Liquid with three.js](/images/blog/fluid-foundation/thumb.webp?blur=899)\n\n#
    Spreading Liquid with three.js\n\n11/1/2026\n\n## Introduction\n\nAt Vue Fes Japan
    2026, I talked about implementing a liquid foundation effect. In this article,
    I'll continue from my previous fluid simulation article and explain how I created
    that effect.  \n  \nI developed this liquid-spreading effect for a Japanese cosmetics
    brand's liquid foundation promotional project released in 2021.\n\n> ちょっと前なんですが今年6月にprimavisaシリーズのファンデーション・下地のテクスチャをシミュレーションできるサイトが公開されました。
    homunculusさんにお声かけいただいて実装担当しました。 いろんな種類とカラバリをお試しできるのでぜひ見てみてください。\n> \n> [https://t.co/RiK5wff7S9](https://t.co/RiK5wff7S9)
    [https://t.co/dyNJNoizSY](https://t.co/dyNJNoizSY)\n> \n> — Misaki Nakano (@misaki\\_mofujp)
    [December 18, 2021](https://x.com/misaki_mofujp/status/1472284738971107330?ref_src=twsrc%5Etfw)\n\n##
    Liquid Spreading Demo\n\nI chose blue rather than a foundation shade for this
    demo, even though the original project was about makeup.  \nTry dragging your
    mouse or finger across the liquid below.\n\n## Where I Started\n\nWhen I was asked
    to implement a foundation simulation in January 2021, I had no idea where to begin.
    I spent about a month repeatedly touching foundation and thinking about what makes
    it look and behave like foundation, or more generally, like a liquid.\n\nI had
    already thought of using a height map to represent a physical quantity, but I
    wasn't sure how to move that height around. I wondered if there was a simpler
    approach.\n\nIn the end, I decided that a fluid algorithm was probably the best
    solution. When you drag a finger through liquid, it bulges up on the opposite
    side, and the surrounding material gets pulled along. To reproduce those movements,
    I started by implementing a fluid simulation.\n\n## How It Works\n\n### First,
    Some Background\n\nThis effect uses the results of the fluid simulation I introduced
    in an earlier article on this blog.  \nIt uses the same velocity map to create
    the liquid-spreading movement.\n\n[![](/images/blog/stable-fluids/thumb.png)Stable
    Fluids with three.jsmofu-dev.com](https://mofu-dev.com/en/blog/stable-fluids/)\n\nThe
    raised liquid in the opening demo is rendered in a fragment shader, rather than
    by deforming the geometry.  \nI prepare another FBO, which I call a height map,
    to represent the thickness of the liquid.\n\n### What Is a Height Map?\n\nHeight
    maps are often used for terrain, but here I use one to represent liquid thickness.
    \ \nThe diagram below illustrates a height map recording the thickness of a liquid.
    The height value at each position represents how much liquid is present there.\n\n![Cross-section
    showing the thickness of liquid stored in a height map](/images/blog/fluid-foundation/image1_en.svg)\n\n
    \ \n\n### Implementation Flow\n\nThe fluid simulation itself is explained in my
    previous article, so here I'll focus on updating thickness and opacity, and rendering
    the result.\n\n1. Use the velocity map to find the source UV and update the thickness.
    \ \n2. Update opacity in an alpha map using the current height map and the history
    of where liquid has been applied.  \n3. Calculate normals from the height map,
    then render with a Matcap and the alpha map.  \n\n![Processing flow from the velocity
    map through the height map and alpha map to rendering](/images/blog/fluid-foundation/image2_en.svg)\n\n###
    1. Moving Thickness with the Velocity Map\n\nFirst, I prepare the initial values
    for the height map.  \nI create a hemispherical blob, raised at the center, using
    a fragment shader and store its height in the height map's R channel.\n\ninitialHeight.frag\n\n
    \   float calculateHeight(float value) {\n      return sqrt((1.0 - value * value)
    / 12.0);\n    }\n    \n    void main() {\n      vec2 point = (vUv - 0.5) * 2.0
    * resolution / min(resolution.x, resolution.y);\n      float distanceFromCenter
    = length(point);\n      float height = calculateHeight(smoothstep(0.0, 0.3, distanceFromCenter));\n
    \     height = smoothstep(0.0, 0.025, height) * height * 0.66;\n      gl_FragColor
    = vec4(height, 0.0, 0.0, 1.0);\n    }\n\nI render these initial values into an
    FBO, then update the thickness using the velocity map.\n\n![Thickness removed
    from the current position and added from a backtraced source position](/images/blog/fluid-foundation/height-update_en.svg)\n\nThe
    velocity map produced by the fluid simulation records the direction and magnitude
    of movement at each position on the screen.  \n  \nFirst, I sample the thickness
    and velocity at the current pixel.  \nAccording to its velocity, I calculate how
    much thickness should move away and subtract that amount from the original thickness.\n\nheight.frag\n\n
    \   float previousHeight = texture2D(heightMap, vUv).r;\n    vec2 flow = texture2D(velocity,
    vUv).xy;\n    float previousStrength = smoothstep(\n      velocityThreshold.x,\n
    \     velocityThreshold.y,\n      length(flow)\n    );\n    float removed = min(\n
    \     previousHeight,\n      previousStrength * 0.3 * previousHeight\n    );\n\n`removed`
    is the amount of thickness subtracted from the current pixel.\n\nNext, I use **advection**
    , which also appeared in the previous fluid simulation article.  \nI trace the
    velocity backward from the current pixel and sample the thickness at the source
    position.  \n  \nHere is the implementation of `backtraceUv()`, which calculates
    the source UV from the current UV, velocity, and elapsed time.\n\nheight.frag\n\n
    \   vec2 backtraceUv(vec2 uv, vec2 flow, vec2 fboSize, float dt) {\n      vec2
    ratio = max(fboSize.x, fboSize.y) / fboSize;\n      vec2 velocityRatio = fboSize
    / min(fboSize.x, fboSize.y);\n      return uv - flow * velocityRatio * dt * ratio;\n
    \   }\n\n  \n\nheight.frag\n\n    vec2 sourceUv = backtraceUv(vUv, flow, fboSize,
    dt);\n    float sourceHeight = texture2D(heightMap, sourceUv).r;\n    float sourceStrength
    = smoothstep(\n      velocityThreshold.x,\n      velocityThreshold.y,\n      length(texture2D(velocity,
    sourceUv).xy)\n    );\n    float added = min(\n      sourceHeight,\n      sourceStrength
    * 0.3 * sourceHeight\n    );\n\n`vUv` is the current pixel's position. `sourceUv`
    is the position found by tracing the velocity backward.  \nThe `backtraceUv()`
    function uses velocity and the time step `dt` to calculate that position.  \n`added`
    is the thickness brought from the source position to the current pixel.\n\nFinally,
    I subtract `removed` from the current thickness and add `added` to update the
    height map.\n\nheight.frag\n\n    float nextHeight = max(0.0, previousHeight -
    removed + added);\n    gl_FragColor = vec4(nextHeight, 0.0, 0.0, 1.0);\n\nThe
    result is written to the R channel of `gl_FragColor`. The G and B channels are
    0, and the A channel is 1.  \nThe alpha map and rendering shaders later read this
    value using `texture2D(heightMap, vUv).r`.\n\nIn this way, each pixel loses some
    thickness and gains thickness from its backtraced source position.  \n  \nI also
    use `smoothstep()` so that the thickness barely moves when velocity is small.
    \ \nThis prevents stationary areas from constantly flowing and focuses movement
    around the areas affected by dragging.\n\nThis is not a physically accurate, volume-conserving
    calculation. I adjusted it to achieve the appearance I wanted.  \nEach frame,
    I sample the previous height map, render the result into the next one, and alternate
    between two FBOs.\n\n### 2. Keeping the Traces with an Alpha Map\n\n![How current
    thickness and the historical maximum determine opacity](/images/blog/fluid-foundation/alpha-history_en.svg)\n\nA
    height map represents the raised shape of the liquid, but it doesn't fully reproduce
    the traces left when the liquid is spread thinly.  \nI wanted some color to remain
    even where the thickness had almost disappeared, so I added a separate alpha map.\n\nThis
    alpha map uses both a value derived from the current thickness and the maximum
    value recorded so far.\n\nalpha.frag\n\n    float previousMaximum = texture2D(alphaMap,
    vUv).r;\n    float current = smoothstep(\n      0.0,\n      0.01 / 0.7,\n      max(0.0,
    texture2D(heightMap, vUv).r)\n    );\n    float maximum = max(current, previousMaximum);\n
