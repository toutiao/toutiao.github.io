  author: Roark66
  text: That highlights a bigger point. In the age anyone can create and publish their
    own software, including people without the most basic knowledge about it, how
    is one supposed to distinguish good from bad and avoid drowning in a sea of crap?<p>Also,
    this has another angle, let&#x27;s say I&#x27;ve created some tools I&#x27;ve
    invested quite a bit of time in but what is the point of publishing it, if anyone
    that needs it can simply make it for themselves (spending a week or two of time
    and some tokens)?<p>Not only it has became essentially impossible to find if a
    given thing is quality (for example I recently looked for a pi plugin that does
    tool use classification for AI that I could extend with my ideas. I found one,
    then I discovered the author copied leaked cloude code source and &quot;released
    it under MIT license&quot; - which made my work on top of it basically useless
    and I had to throw it all out and start from scratch, as I wanted to publish the
    result- the final thing is called adaptive-acl).<p>And second, is there any point
    in publishing code? In the &quot;old days&quot; when software was worth something
    the motivation to publish open source, in addition to feel good factor, was that
    people would send you patches with functionality you may find useful.<p>Both that
    and the feel good time has ended. I still publish some of my stuff that I think
    may be useful to someone at some point, but I&#x27;m not sure there is any actual
    point in this.<p>In a way AI has made each of us much more self sufficient. A
    computer with a good local model and half a dozen GPUs, few TB of software and
    one can have all of their computing needs fulfilled forever. No Internet or other
    people required. There is certain power in this. My young pre-internet self would
    have felt like living in a star trek universe with this :-)<p>But something is
    definitely being lost in the process as well.
