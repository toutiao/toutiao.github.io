  author: gokaygurcan
  text: 'I help maintaining one of these awesome lists, awesome-javascript, since
    2018. There&#x27;s been always self-promoting or similar activities, or someone
    coming up with an idea&#x2F;forking a repository and doing some small changes,
    then thinking they&#x27;re suggesting something groundbreaking. Because of this,
    we needed to add a few checks over the years to the pull request template, that
    basically asks if the resource is out there for a while, actively maintained,
    actively used by people, etc.<p>Recently, thanks to AI being this cheap and accessible,
    the amount of shitty PRs quadrupled if not more. And the worst part? Agent doesn&#x27;t
    care about the checklist at all and re-writing the PR body with bunch of nonsense
    that we maintainers need to read, understand, and evaluate. I started keeping
    the score for the most shittiest PR based on how soon after the first commit made
    they open the PR. It was 11h, then 10h, and now it is 6h. How on earth a 6h old
    repository with zero user is considered &quot;awesome&quot; I don&#x27;t know,
    but people should stop prompting their agents to create 10s of these PRs every
    day.<p>Yes, there&#x27;s always an alternative: stop maintaining these lists.
    I don&#x27;t think it&#x27;s a viable option either. Sometimes you start using
    a new piece of tech and want to have access to somewhat curated list of resources
    that might speed up your understanding. There&#x27;s still a bit of value to keep
    them alive and it&#x27;s dying out bit by bit (literally) every time someone mass-creates
    these spammy PRs.<p>Thanks for reading my unsolicited rant.'
  score: 0
