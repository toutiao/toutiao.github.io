  author: onion2k
  text: "<i>maybe it&#x27;s because it doesn&#x27;t need updating</i><p>The ground
    shifts under software. OSs change, dependencies get updates, engines change, compilers
    are improved occasionally in ways that aren&#x27;t backwardly compatible. If the
    maintainer isn&#x27;t at least checking it&#x27;s not broken, and updating a changelog
    to say that it&#x27;s still working, then you can&#x27;t safely assume it&#x27;s
    fine. &quot;Not updated for years&quot; is shorthand for &quot;It could be broken,
    but I don&#x27;t want to be the person who goes through the effort of checking.&quot;<p>If
    you want people to run your code against a set of pinned dependencies from the
    last time it was updated then that&#x27;s one thing, but if you people to run
    it with an up-to-date set of dependencies on a new OS and on the latest compiler
    or runtime, then you can&#x27;t just say it&#x27;s &#x27;done&#x27;, because things
    can change outside of your code that means it won&#x27;t work any more."
