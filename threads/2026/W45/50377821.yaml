  author: solyin
  text: The problem is digital things don&#x27;t decay in the same way as physical
    objects. AI can shit out a webpage for an institute that doesn&#x27;t really exist
    and make it sound awesome until you realize there&#x27;s nothing there. A webpage
    with a vibrant community behind it that is actively maintained looks, at first
    glance, the same as a page that&#x27;s been put out to the pasture. A physical
    store that&#x27;s out of business will accumulate cruft, broken windows, vines
    everywhere. There&#x27;s not really an equivalent for bitrot. Sure, my website
    from 1996 looks dated because I used frames and we don&#x27;t do that no more,
    but eBay and Yahoo and Myspace are still around. Link rot does set in though.
    Links to pages that no longer exist because the person running it has passed.
    Archive.org has such a good purpose.<p>Thing is though, for software, sometimes
    things can just be done. If a perfectly good piece of software hasn&#x27;t been
    updated in years <i>because it hasn&#x27;t needed to be updated</i>, then let
    it sit, ensconced in stone. The problem is it&#x27;s hard to tell the difference
    between that, and something that needs maintaining but hasn&#x27;t been.
