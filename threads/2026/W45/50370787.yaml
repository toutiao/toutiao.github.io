  author: pixl97
  text: "&gt;So we shouldn’t worry about regressing?<p>The question is what can you
    do about it without becoming an insane authoritarian in the process and probably
    making things worse?<p>Progression or regression is not a &quot;you&quot; or an
    &quot;I&quot; thing, it&#x27;s a &quot;we&quot; thing. Constant progression isn&#x27;t
    much different from constant acceleration, you can&#x27;t keep producing more
    energy forever, you eventually hit limits. In societies these limits much more
    quickly than the limits of the universe. Even maintaining status quo requires
    energy, so who are you going to get to spend that energy? And at the same time
    as all of this you still have all the base desires of the human animal. Greed
    and lust and selfishness isn&#x27;t going away. The newer generations that didn&#x27;t
    experience the terrible times isn&#x27;t born with the defenses against terrible
    times like the old generations do, and over time the systems that are needed to
    protect against bad things fall apart because not enough people understand the
    costs behind them.<p>This cycle is as old as humanity itself. I don&#x27;t think
    human intelligence is going to get us out of the trap unless we&#x27;re talking
    world population scale manipulation or editing of humans."
