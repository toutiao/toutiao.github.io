  author: swid
  text: You can join two of the cables together that come from each corner unit into
    one.  each unit - still with an eye hole in another corner - moves the cable left
    or right.  With the opposite corner unit, you can pick X,Y on the ceiling.  I&#x27;d
    put the third cable in the grabber, which can be used to lower it to the floor.<p>Probably
    if you went this way, you&#x27;d want to measure each ceiling cable so it is about
    X+Y length, or otherwise the slack needs to be held somewhere.<p>This is one less
    actuator than their system if I understand them, and they are not counting the
    gripper itself.
  score: 0
  posted_at: '2026-11-03T19:39:33Z'
- id: '50357161'
  parent_id: '50354358'
  author: swid
  text: They designed the cables to go down into the room, instead of from the ceiling
    - seems like that is a deal breaker for most environments actually, because you
    need the whole room to have open space just to drop it to the floor all over.<p>They
    say they use 4 actuators, but if they only used 3, this problem would be solved.<p>Instead
    of independently controlling all four lines, you can join the lines leaving each
    corner unit and then just move the line left or right instead of reeling two different
    lines in and out.  You still use the corner eye loops, and you use two cables
    that are X+Y in length.  This allows you to pick a point on the ceiling.  Then
    a third actuator and line in the gripper itself could lower itself to the floor.
  score: 0
