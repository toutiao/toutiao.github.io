    MyElectronics 1.25U steel mounts at 2U pitch (3 Mac Minis each, rear ports, open
    floor for the bottom intake, 18 slots in all). 12 M5 Pro 15-core&#x2F;24 GB&#x2F;1
    TB&#x2F;10GbE NoMac Sendbox hosts at two 6-vCPU&#x2F;8 GB VMs each, four M5 Pro
    48 GB NoMac Simulator hosts at about 20 phones each.<p>Power comes from two Netio
    PowerPDU 8KS units (8 × C13, per-outlet switching and metering over an API) on
    the A and B feeds. Hosts are split evenly across the two feed and connected with
    C14-to-C7 cords, and an APC AP4421 transfer switch feeds only the network gear.
    The rack peaks around 1.3 kW and averages about 0.3 kW.<p>The network is a MikroTik
    RB5009 holdin the only public IP, doing outbound NAT and inbound WireGuard only,
    plus a MikroTik CRS312 giving 10GbE to every Mac on a 1 Gbit&#x2F;s uplink. It
    has three VLANs: management (PDUs, KVMs), hosts with port isolation so they can
    only reach the gateway, R2 and the public internet.<p>Every host is commissioned
    with FileVault off and pmset autorestartatconnect 1, autorestart 1 and sleep 0,
    with auto-login on the phone hosts, hostd as a LaunchDaemon, zero-touch MDM enrollmen
    through Mosyle, and updates deferred 90 days.<p>Basically that&#x27;s it. Fortunatelly,
    we did not have supply problems, but we are also smaller.'
