  text: Any server with a shell and opensshd is a pet, and has no business being near
    sensitive production workloads.<p>Add to that aging and wildly insecure ssh-based
    centralized ruby based infra management solution and I can only conclude everyone
    invovled has been asleep at the wheel on industry best practices for a over a
    decade.<p>Production servers should be immutable once deployed, remotely attestable
