  author: vidarh
  text: There are risks in both cases, but they are <i>very</i> different.<p>If you&#x27;re
    using a closed model, the model provider gets all your data, <i>and</i> can if
    they want to send back actively hostile tool calls and rely on your harness to
    catch them without any effort on their side to train that behaviour into their
    models. The only things you can do about that is to place careful restrictions<p>If
    you&#x27;re using an open model against your own system or a third party provider,
    the origin of that model <i>could</i> have trained in &quot;triggers&quot; that&#x27;d
    cause the model to produce actively hostile tool calls as well, but they&#x27;d
    have no <i>direct control</i> and would need to train in that behaviour &quot;blind&quot;
    to how you&#x27;d actually use the model.<p>It doesn&#x27;t mean you can be complacent
    about trusting the model, but it does change the likelyhood they&#x27;d be able
    to do any damage, not least because you&#x27;d be able to run evals against the
    model without any risk that the model <i>or provider API</i> could just randomly
    change on you after a while.<p>So it takes far more trust to run a closed model
    than to run an open model <i>even on a hosted third party provider</i>, and certainly
    far more than to run an open model on your own hardware.
  score: 0
