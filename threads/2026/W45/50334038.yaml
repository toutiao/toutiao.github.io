  author: amluto
  text: 'In my mind, they’re putting <i>huge</i> downward pressure on the major US
    AI companies’ ability to become platforms.<p>Think about the history of AWS.  Amazon
    made a very specific point of building, specifically, a “platform”. When they
    developed a major internal service, they would <i>sell</i> it.  Basically anyone
    who wanted to use it could pay AWS (often an outrageous amount, but it was often
    worth it), and AWS would provide the service, and AWS was consistently neutral
    and trustworthy.  They didn’t really tell you what you could or couldn’t do, they
    didn’t even ask what you wanted it for, and they never used your private data
    for their own purposes.  AWS pulled this off quite well despite the fact that
    competing products and even open source products could and still can, with effort,
    do most of what AWS offered.<p>Compare to OpenAI and Anthropic.  They want to
    sell you their front-ends (chatgpt.com, claude.ai, their apps and harnesses),
    but the big money is selling enterprise contracts with per-token pricing.  The
    latter is the platform.<p>But their platforms <i>suck</i> in comparison to their
    open competition.  You are paying for inference on a series of models, but:<p>-
    You need to negotiate with them if you don’t want them to retain your data.<p>-
    They might not even be willing to not retain your data.<p>- Part of the model
    output gets encrypted before you see it.<p>- You are not allowed to give the model
    arbitrary input.<p>- They run classifiers on the token stream to try to restrict
    what you may or may not do.<p>- You cannot see the model’s internal states.<p>-
    You are extremely restricted in your ability to modify the model and you may not
    be allowed to modify it at all.<p>- Oh, and maybe the price is above market rates.<p>The
    last point is not really a big deal: AWS has demonstrated quite effectively that
    customers will pay many, many billions of dollars above market rates for a high
    quality platform.<p>But I think the rest are a big deal, and the open-weight models
    allow anyone to use a provider <i>other than Anthropic and OpenAI</i> and avoid
    all the other problems in the list.  This means that, if I’m a startup building
    a product that uses AI, I get to choose between OpenAI&#x2F;Anthropic-like terms
    and a far better alternative. And this makes it very hard for OpenAI or Anthropic
    to sell me on their platform <i>even at equivalent pricing</i>.'
