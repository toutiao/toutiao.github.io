  text: I&#x27;d argue that they&#x27;re still open-source because inference code
    <i>is</i> fully public.  In operation, a user can crack open the model and examine
    its internal state, and we also see that many people produce various modifications
    or fine-tunings of public models for their own goals.<p>In my mind, this meets
    the conceptual and technical bars of an &#x27;open source&#x27; designation.  We
    can also imagine the opposite, where inference itself has to pass via an inscrutable
    binary blob that keeps the model&#x27;s technology stack fully proprietary.<p>You&#x27;re
    correct that we&#x27;re missing the training data, the training recipe&#x2F;curriculum,
    and any secret sauce that went into optimization of same, but  I don&#x27;t think
    that&#x27;s an essential feature of an open source designation.<p>Instead, I think
    that the model weights are a kind of rendered artifact, and it should be evaluated
    on that basis.  We don&#x27;t treat permissively licensed <i>images</i> as something
    lesser, even if the photographer or illustrator supplies only the final image
    rather than the full camera raw file and&#x2F;or Photoshop layer stack.<p>The
    difference, of course, is that the rendered artifact (weight blob) in a language
    model is so much more important than a typical photograph.
