  author: danielmeskin
  text: Glad I read the article, this is fascinating:<p>&gt; In 2012, a LightScribe
    optical drive was successfully used by Maher El-Kady, a graduate of UCLA, to turn
    a specially prepared graphite oxide layer coated onto a DVD into graphene.[10]
    El-Kady and Richard Kaner, his lab professor, used an unmodified LightScribe drive.
    The disc was prepared by coating the disc with an aqueous solution of graphite
    oxide and allowing it to dry. Areas of the coating illuminated by the LightScribe
    laser were turned into graphene. Various shapes can be drawn, which allowed the
    scientist duo essentially to laser-print an ultracapacitor on graphene using consumer-grade
    technology.
