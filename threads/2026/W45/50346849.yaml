    limited in space so I was only managing a single save for most of the playthrough
    until I soft locked myself in a room I couldn&#x27;t leave using my ONLY save
    and had to start at least carrying a second backup save to prevent that happening
    again.<p>I get very little time to game these days, which has the benefit that
    I have saves usually spaced no more than about an hour apart. Sometimes a couple
    of hours on the weekends. There were a couple of points in HL1 where I had to
    go back to a previous save because I was in a bad situation, I&#x27;m playing
    on PC so there was no real limit on the number of saves I can keep.<p>I&#x27;ve
    not started HL2 yet (this time around, and it&#x27;s been 20 something years since
    I last played it) so I can&#x27;t remember what that was like.<p>I&#x27;m going
    to finish Blueshift, then go on to HL2, but I&#x27;d really like some texture
    and quality updates; HL2 is a real downgrade from Black Mesa. I tried it in VR
    but was feeling nauseous within a few minutes.<p>All of this is to lead up to
    Alyx on my Steam Frame which is just sitting there waiting until I replay these
    so I can remember what happened.<p>&gt; Half Life 2 felt like it almost made fun
    of me at times for building that hoarding mentality, always dumping health and
    ammo on me when I had already been preserving it as much as possible right before.
    Meanwhile the few things I would run out of it would never give any more of for
    entire sections<p>I&#x27;ll bear this in mind. I think HL1 was a little too obvious;
    you suddenly get a cache of rocket ammo, you know what&#x27;s coming."
