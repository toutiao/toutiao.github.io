  content: "## [_Open_ **SSH**](/)Release Notes\n\n* * *\n\n### [OpenSSH 10.6p2](txt/release-10.6p2)
    (2026-11-05)\n\n    Portable OpenSSH 10.6p2 was released on 2026-11-05. It will
    be available\n    from the mirrors listed at[https://www.openssh.com/](https://www.openssh.com/).\n
    \   OpenSSH is a 100% complete SSH protocol 2.0 implementation and\n    includes
    sftp client and server support.\n    \n    Recently the OpenSSH team have received
    a large number of security\n    bug reports, many of which are findings from AI
    models or made with\n    AI assistance. While many AI reports are determined not
    to have\n    security impact when considered in the context of a realistic\n    threat
    model, we very much welcome these reports, especially when\n    combined with
    human triage, analysis, test-cases and particularly\n    when accompanied by proposed
    fixes.\n    \n    ** We have seen a number of cases where a security bug identified\n
    \   ** by AI tools is subsequently independently discovered by a\n    ** different
    researcher. This suggests that adversaries who do not\n    ** report bugs to OSS
    projects are likely to be able to discover\n    ** these bugs too. Given this,
    the OpenSSH team will, for now, be\n    ** making more frequent releases to get
    bugfixes into users' hands\n    ** more quickly rather than batching them until
    the next planned\n    ** release.\n    \n    Once again, we would like to thank
    the OpenSSH community for their\n    continued support of the project, especially
    those who contributed\n    code or patches, reported bugs, tested snapshots or
    donated to the\n    project. More information on donations may be found at:[https://www.openssh.com/donations.html](https://www.openssh.com/donations.html)Future
    deprecation notice\n    -------------------------\n    \n     *[scp(1)](https://man.openbsd.org/scp.1):
    begin deprecating the -R flag, which is used to perform a\n       remote-to-remote
    copy by executing scp on a remote host. This\n       option is a fragile optimisation
    that is difficult to use because\n       it requires credentials on the remote
    host. It also creates\n       security risks if the shell quoting rules on the
    remote system\n       where the copy is performed differ from the client's expectations.\n
    \   \n       From OpenSSH 10.6, this option will continue to work but will\n       cause
    a deprecation warning to be emitted to standard error. In\n       a future release,
    the option will be ignored and will leave in\n       place the default remote-to-remote
    copy behaviour (copy via the\n       host running scp).\n    \n     *[sshd(8)](https://man.openbsd.org/sshd.8):
    support for platforms that do not allow file descriptor\n       passing and that
    also require root privilege for PTY allocation\n       will be removed in a future
    release. Affected platforms are known\n       to include SCO OpenServer 5 and
    QNX 6 but may include other\n       similarly old operating systems. This deprecation
    can be avoided\n       if the user community for these platforms is able to assist
    us in\n       building alternatives, such as avoiding the need for root in PTY\n
    \      allocation.\n    \n    Changes since OpenSSH 10.6p1\n    ============================\n
    \   \n    This release contains a critical security workaround that affects\n
    \   Linux systems that use the musl libc and PAM disabled.\n    \n    This release
    also includes a number of bugfixes that had already\n    been committed on the
    portable OpenSSH V_10_6 stable branch.\n    \n    Security\n    ========\n    \n
    \    *[sshd(8)](https://man.openbsd.org/sshd.8): avoid password authentication
    bypass that is exploitable\n       through[sshd(8)](https://man.openbsd.org/sshd.8)that
    affects some Linux systems when built and run\n       with PAM support disabled.
    We consider the root cause of this bug\n       to be outside sshd, but it is exploitable
    via sshd and can be\n       avoided there.\n    \n       This bug was reported
    by Özgün Kültekin of Wakefield\n       (wakefield.co)\n    \n    Bugfixes\n    --------\n
    \   \n     *[sshd(8)](https://man.openbsd.org/sshd.8),[ssh(1)](https://man.openbsd.org/ssh.1):
    enable the post-quantum hybrid signature scheme\n       ssh-mldsa44-ed25519 as
    an allowed CA signature algorithm.\n    \n     *[ssh(1)](https://man.openbsd.org/ssh.1),[sshd(8)](https://man.openbsd.org/sshd.8):
    fix <1 second CPU spin if ChannelTimeout was in\n       use.\n    \n    Portability\n
    \   -----------\n    \n     *[sshd(8)](https://man.openbsd.org/sshd.8): fix compilation
    on (old) platforms that set SKIP_PRIVDROP\n    \n     *[ssh(1)](https://man.openbsd.org/ssh.1),[sshd(8)](https://man.openbsd.org/sshd.8):
    fix detection of Azerbaijani locales\n    \n     *[sshd(8)](https://man.openbsd.org/sshd.8),[ssh-agent(1)](https://man.openbsd.org/ssh-agent.1):
    fix creation of agent sockets on platforms\n       without the openat(2) syscall.\n
    \   \n     *[ssh(1)](https://man.openbsd.org/ssh.1),[ssh-add(1)](https://man.openbsd.org/ssh-add.1),[ssh-keygen(1)](https://man.openbsd.org/ssh-keygen.1):
    fix some strange behaviour if\n       SIGINT/SIGQUIT was received while reading
    a passphrase.\n    \n     *[sshd(8)](https://man.openbsd.org/sshd.8): allow restart_syscall(2)
    in seccomp sandbox;[bz4036](https://bugzilla.mindrot.org/show_bug.cgi?id=4036)Checksums:\n
    \   ==========\n    \n    - SHA1 ([openssh-10.6p2.tar.gz](https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.6p2.tar.gz))
    = c91a0b7860c80f29db874044af4d1a6f906231d9\n    - SHA256 ([openssh-10.6p2.tar.gz](https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.6p2.tar.gz))
    = muRIcgkM8vBrPPn/FH5/FvMJZxNAdj7S+ZJIOYrinVs=\n    \n    Please note that the
