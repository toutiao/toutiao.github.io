  text: "&gt; the formally-verified configuration of seL4 doesn&#x27;t actually do
    much<p>As a systems security engineer myself I would disagree and know several
    others that would as well. All depends on your circles, applications, and threat
    model I suppose.<p>Xen, Hyper-V, and KVM have all had major security flaws in
    the form of logic violations, spacial memory corruptions, use-after-free, and
    pointer corruptions that allowed hypervisor trust boundary violations. I expect
    most if not all of those classes of bugs could have been prevented by formal verification.<p>Xen
    likely has a bad reputation with both of us because of a history of preventable
    flaws like these.<p>In my applications every single daemon gets its own sandbox,
    which is a VM whenever possible. Some with network, some without network, different
    filesystem and vsock access for maximum damage control and minimal trust between
    daemons. The hypervisor is the most important security boundary to me especially
    when isolating user-controlled workloads. The more confidence I can get that it
    is correct the better."
