  author: tptacek
  text: The actual vulnerability got very little discussion. It&#x27;s clever. Because
    Linux networking people are obsessed with checksum performance, virtio-net plumbs
    checksum offload metadata through the host&#x2F;guest driver interface. Guests
    can thus deliver the host packets along with instructions on what to checksum.
    The vulnerability is a missing sanity check that allows checksum instructions
    to instruct the host to overwrite the header length field in the IPv4 header,
    rather than the checksum field.<p>Crucially, this happens in the middle of packet
    processing, so the kernel code is forced to work with two different ideas of how
    long the IPv4 header is. All hell predictably breaks loose.
  score: 0
