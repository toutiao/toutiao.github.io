  author: amluto
  text: AIUI they’ve chosen as their target the host userspace pt_regs, i.e. the kernel
    structure that stores Firecracker’s register state.  If they can find it and write
    to it, they can control the complete register state of Firecracker.<p>I assume
    they chose it as their target because Firecracker, like most Linux KVM userspace
    [0], maps guest memory into its own address space, giving an easy place to write
    gadgets.<p>My personal favorite thing to poke into pt_regs is an actual privileged
    (CPL0) context. [1] Returning from the kernel right back to a controlled kernel
    context is allowed by the CPU :)<p>[0] Until fairly recently this was mandatory.
    These days it’s possible to ask KVM to map something into the guest without having
    it in host userspace memory.<p>[1] Corrupt pt_regs so it executes user memory
    in kernel mode:<p><a href="https:&#x2F;&#x2F;seclists.org&#x2F;oss-sec&#x2F;2015&#x2F;q3&#x2F;291"
    rel="nofollow">https:&#x2F;&#x2F;seclists.org&#x2F;oss-sec&#x2F;2015&#x2F;q3&#x2F;291</a><p>I
    think this may be my favorite of all exploits I’ve ever written. In fact, I often
    made a point of <i>not</i> writing interesting exploits for corruption bugs I
    found, but this one was too much fun to pass up.
