  author: lrvick
  text: I for one do not want any code in the TCB that is not formally verified, tiny,
    and easy to audit with every line of code justified.<p>SeL4 is the only open,
    mature, and formally verified L4 solution I am aware of that can run on modern
    servers, but IIRC given vCPUs are not first class objects and any low level CPU
    virtualization features are handled in user space, it comes at a real performance
    cost making it only suitable for single-core or non-performance-critical applications.<p>Nova
    by contrast was built to handle the expensive and trust critical TPM and vCPU
    handling directly for high performance remotely attestable multi-core applications
    without having to reach for something as heavy as Xen, though formal verification
    is admittedly not as complete as SeL4 yet AFAICT, though lots of recent progress
    here.<p>Those are pretty big tradeoffs, but if you or anyone else knows other
    viable xen alternatives this general shape with a tiny easily-auditable footprint,
    please chime in!
