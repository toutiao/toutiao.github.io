  text: "&gt; terrible name making “New” part of the product name btw<p>It&#x27;s
    a sign that Nintendo retains it&#x27;s Japan first philosophy in many areas. But
    also the flexibility multiple alphabets give.<p>In Japan it is called &quot;New
    ニンテンドー 3DS&quot;. Not 新しい (which means new) ニンテンドー 3DS.<p>Writing the New in English
    makes it clear to Japanese people it&#x27;s part of the name, incidentally they
    write the Nintendo on katakana marks it apart from how it might be written in
    Japanese if it were the name which would be in kanji 任天堂 (usually termed leave
    luck to the heavens). If they wanted not to use kanji and keep the link to the
    name Nintendo then they&#x27;d use the hiragana にんてんどう. But katakana feels more
    techy and is clearly apart from the Japanese word and name Nintendo.<p>Japan,
    in general, does the English word borrowed back into English often.<p>Pack became
    パック (pakku) and then was returned to English as pak for game&#x2F;memory pak etc.
    they did this to avoid using the word cartridge and cassette which is what they&#x27;d
    borrowed for the name of game carts."
