  content: "# pwn.college\n  \n\n## Learn to Hack!\n\nYou have entered the pwn.college
    DOJO, an education platform for learners to develop and practice core cybersecurity
    skills in a hands-on fashion. Entering, you receive your \"white belt\" ![](/belt/white.svg),
    signifying the beginning of your hacker life. From here, you will learn cybersecurity
    by diving deep into the core of computing, using that journey to absorb cybersecurity
    concepts. This will involve melding your mind to your terminal, whispering instructions
    to the CPU, and strumming bits directly onto networks. That terminal cursor blinking
    above? It will be your stalwart companion through this adventure as you practice,
    earn your [belts](/belts) ![](/belt/orange.svg) ![](/belt/yellow.svg) ![](/belt/green.svg)
    ![](/belt/blue.svg), and, eventually, make perfect.\n\nEvery dojo has its sensei.
    This platform is maintained by an [awesome team](/sensei) of hackers at Arizona
    State University. It powers much of ASU's cybersecurity curriculum, and is open,
    for free, to participation for interested people around the world!\n\nEnjoy your
    journey! If you have questions, comments, suggestions, and feedback, please [join
    our Discord server](https://discord.gg/pwncollege) or email us at [[email&nbsp;protected]](/cdn-cgi/l/email-protection#1060677e5060677e3e737f7c7c757775)!\n\n##
    The Rules\n\nThe challenges created for pwn.college are, first and foremost, educational
    material, and are used to grade students at universities around the world. Because
    of this, we would appreciate that you **do not post writeups, walkthrough videos,
    and livestreams of challenge solutions** to the internet. Obviously, we can't
    enforce this, but we worked hard to make all of this public, and we would appreciate
    your help in keeping pwn.college a viable educational platform.\n\nPlease agree
    to these rules to continue to the material!\n\n## YOUR Journey — Next Steps \U0001FAF5\n\nWhether
    you have just started, or have come far, there is always a next step to your journey.
    The dojo or dojos listed below is that step, presented to you **in the order that
    you should learn them**. Take a step, and the next will reveal itself.\n\n[- \n\n####
    Start Here\n\n ![](/belt/white.svg)\n\n113 Hacking  \n2 Modules  \n10 Challenges\n\n](/dojo/welcome)\n###
    Side Quests\n\nWant to work ahead? Know your path better than we do? Forge your
    path through [our whole material](/dojos)!\n\nNeed a break? Want to learn something
    new? Check out [dojos created by the pwn.college community!](/dojos#community-dojos)\n\n##
    Sharing is Caring\n\nWant to use pwn.college in your course? No problem! You can
    use the videos and slides of pwn.college lectures freely for non-commercial purposes,
    but please provide attribution! Additionally, if you use pwn.college in your own
    education program, we would appreciate it if you email us to let us know. Evidence
    of wide-spread use of pwn.college for education will be a huge help for our various
    academic careers!\n\nEDUCATORS: If you are an educational institution and are
    using pwn.college as part of a class, you can import our challenges (or add your
    own) into your own private dojo for your students! Create your dojo [here](/dojos/create).\n\nCONFERENCES:
    If you are running a conference and would like pwn.college presence there (as
    a form of intense weekend-long training), please [email](/cdn-cgi/l/email-protection#7505021b3505021b5b161a1919101210)
    us!\n\n## After pwn.college\n\nEventually, hackers continue their journey beyond
    pwn.college, becoming certain in their skills, achieving _brown belt_ status (and
    able to, for example, usefully contribute to the cybersecurity industry and academia),
    before finally graduating to hacking masters: _black belts_. But this, unfortunately,
    must happen outside of the dojo (for now!). Some suggestions:\n\nCapture The Flags
    (CTFs) are a great way to practice your hacking skills in a fun and ethical way.
    The most popular way to find upcoming events is at [https://ctftime.org](https://ctftime.org).
    There is also a list of introductory CTFs [here](https://zaratec.io/ctf-practice/).
    If you are at ASU, feel free to check out and join ASU’s enigmatic [hacking club](http://asuhacking.club).\n\nWargames
    are another great way to practice your hacking skills. Whereas CTFs are short
    (normally 48 hour) events, wargames are not time-based. You can find a list of
    wargames at [https://github.com/zardus/wargame-nexus](https://github.com/zardus/wargame-nexus).\n\nThere
    are many other awesome learning platforms, such as [CryptoHack](https://cryptohack.org/)
    and [OST2](https://p.ost2.fyi/) that will help teach you explore new topics!\n\nIf
    you want to get involved with cybersecurity research, but don’t know how, consider
    joining us for an [internship at ASU](https://sefcom.asu.edu/apprenticeship).\n\n##
    Contributing\n\nThe [infrastructure powering pwn.college](https://github.com/pwncollege/dojo)
    is open source, and we welcome pull requests and issues. Some of the modules are
    closed-source, because they include source code and solution scripts, but others
    can be found on [github](https://github.com/pwncollege). If you are an educator,
    or otherwise someone we trust, and are interested in collaborating on the modules
