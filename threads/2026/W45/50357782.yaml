  author: nonethewiser
  text: |-
    Apple&#x27;s built-in dictionary flags on my Mac: 26.2, which is newer than the article&#x27;s
      15.6. Apple has changed several
      things since:<p><pre><code>  ┌───────────────┬────────────────┬──────────────────────────────────────────┐
      │               │ Article (15.6) │             My Mac   (26.2)              │
      ├───────────────┼────────────────┼──────────────────────────────────────────┤
      │ Total entries │ 199,019        │ 199,940                                  │
      ├───────────────┼────────────────┼──────────────────────────────────────────┤
      │ Vulgar        │ 1,050          │ 850                                      │
      ├───────────────┼────────────────┼──────────────────────────────────────────┤
      │ Offensive     │ 663            │ 727                                      │
      ├───────────────┼────────────────┼──────────────────────────────────────────┤
      │ Sensitive     │ 2,558          │ 2,748                                    │
      ├───────────────┼────────────────┼──────────────────────────────────────────┤
      │ Oedipus       │ vulgar         │ sensitive (sex topic)                    │
      ├───────────────┼────────────────┼──────────────────────────────────────────┤
      │ cooties       │ vulgar         │ clean                                    │
      ├───────────────┼────────────────┼──────────────────────────────────────────┤
      │ Biden         │ clean          │ now tagged politics topic, still no tier │
      └───────────────┴────────────────┴──────────────────────────────────────────┘

      These are unchanged:
      - Trump is still sensitive with the politics topic. The lowercase card-game word &quot;trump&quot; is still
        clean.
      - Obama, Putin, Vance and Harris have no tier. Musk still isn&#x27;t in the dictionary.
      - Tom and Mick are still offensive, and pee, poo, niggle, underling, blacklist and Isis are still
        sensitive.
      - idiot is still sensitive, and now also has the catch-all &quot;sensitive context&quot; topic.

      Words in the capitalized sensitive list that the article doesn&#x27;t mention include Saddam, Grindr,
      Oedipus&#x2F;Oedipal, TERF and Viagra. Trump is still the only living politician among them.</code></pre>
