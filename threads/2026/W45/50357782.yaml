article:
  url: https://helgesver.re/articles/macos-vulgar-word-flags
  title: I Dumped Apple's Fucking Word List - Helge Sverre
  fetch_status: success
  content: "## TL;DR\n\n- `~/Library/Keyboard/VulgarWordUsage.db` is real. It records
    which swear words you use, **per app and per recipient** , so autocorrect learns
    to stop \"ducking\" you. On my Mac it is empty, and typing swear words into a
    native app did not fill it.\n- The interesting part is upstream. Apple's system
    dictionary flags every word with one of three tiers ( **vulgar** , **offensive**
    , **sensitive** ) and up to eleven topic flags (sex, drugs, religion, politics,
    violence, …).\n- There is no public API for any of it. I read the flags with a
    few private C functions from `Lexicon.framework`. Code below, in C and in Swift.
    The full dumps for 15 languages are in[this gist](https://gist.github.com/HelgeSverre/25d9e54a09533e84ada32c2bc26e560c)
    (uncensored, so mind the content warning).\n- Highlights: _Oedipus_ is vulgar.
    _Tom_ and _Mick_ are offensive. _pee_, _poo_, _niggle_ and _underling_ are sensitive.
    And **\"Trump\" is the only living politician in the English sensitive tier**
    , next to Hitler, Mao, Osama bin Laden and the Taliban. Biden, Obama and Putin
    are clean.\n\n**Content note:** this article prints the words uncensored, slurs
    included, because the whole point is to see what Apple flags. The one exception
    is the n-word: it is in the list in English and several other languages, and I'm
    not writing it out.\n\n## It started with a tweet\n ![Tweet by Nick (@nicksdot):
    'TIL: macOS has a database to track our use of profanity', showing a Finder listing
    with user_model_database.sqlite-wal and VulgarWordUsage.db. Helge replies 'Where
    is it located?' and Nick answers '~/Library/Keyboard/VulgarWordUsage.db'.](/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fvulgar-word-usage-tweet.289c366e.webp&w=1200&q=75)\n\n[Nick
    posted this](https://x.com/nicksdot/status/2117656390428967014), I asked where
    it lives, and he answered. A database that tracks my profanity is not something
    I can leave alone, so I opened mine.\n\n## The database\n\n    $ sqlite3 -readonly
    ~/Library/Keyboard/VulgarWordUsage.db .schema\n    CREATE TABLE properties (ROWID
    INTEGER PRIMARY KEY, key, value, UNIQUE (key));\n    CREATE TABLE IF NOT EXISTS
    \"vword_usage\" (\n        ROWID INTEGER PRIMARY KEY AUTOINCREMENT,\n        app
    TEXT, -- app identifier\n        recipient TEXT, -- recipient identifier\n        vword
    TEXT, -- vulgar word\n        word_reading TEXT, -- the reading form of a word
    (relevant for Japanese)\n        usage_count INTEGER DEFAULT 0,\n        last_use_timestamp
    REAL DEFAULT 0, -- last use timestamp (seconds since the reference date)\n        journaled\n
    \   );\n    CREATE UNIQUE INDEX app_recipient_vword_word_reading_idx ON vword_usage(app,
    recipient, vword, word_reading);\n\nSo the keyboard can know that you say _fuck_
    in Messages to one particular friend, but not in Mail to your boss. The unique
    index is on `(app, recipient, word, reading)`, so that is the granularity.\n\nMine
    has zero rows. The `properties` table holds `version = 2` and nothing else. The
    file was last written in April 2024.\n\n### What it is for\n\nAt WWDC in June
    2023, Craig Federighi announced the iOS 17 autocorrect rewrite with this line:_\"In
    those moments where you just want to type a ducking word, well, the keyboard will
    learn it, too.\"_([TechCrunch](https://techcrunch.com/2023/06/05/thanks-to-ai-ios-17-will-learn-your-swears/),[NPR](https://www.npr.org/2023/06/07/1180791069/apple-autocorrect-ducking))\n\nThis
    database is how it learns. The symbol names in the macOS shared library cache
    spell out the flow:\n\n    TI::VulgarWordUsageDatabaseWrapper::set_current_app_id(CFString)\n
    \   TI::VulgarWordUsageDatabaseWrapper::set_current_recipient_ids(vector<string>)\n
    \   TI::VulgarWordUsageDatabaseWrapper::increment_usage_count(word, reading, recipients)\n
    \   TI::VulgarWordUsageDatabaseWrapper::decrement_usage_count(...)\n    TI::VulgarWordUsageDatabaseWrapper::can_autocorrect(word,
    app, recipients)\n    TI::VulgarWordUsageDatabaseWrapper::can_autocorrect_somewhere(word,
    reading)\n    KB::FilterNonVulgarIfTopCandidateVulgar::filter_candidates(...)\n
    \   KB::Candidate::every_vulgar_word_is_allowlisted(VulgarWordUsageDatabaseWrapper*,
    ...)\n\nPlus log strings like `Passing recipient IDs to the vulgar word usage
    database wrapper; number of IDs: %lu`.\n\nIn plain terms:\n\n1. When you start
    typing, the keyboard engine tells the wrapper which app you're in and who you're
    writing to.\n2. When you type a vulgar word and keep it, its count goes up for
    that app and those recipients. Undoing the word brings the count back down.\n3.
    When the engine ranks suggestions, it asks whether every vulgar word in a candidate
    is allowlisted for this context. If it isn't, the clean alternative wins: _ducking_.\n\nA
    `_KSUserWordsSynchroniser sharedAcrossLanguagesVulgarWordUsageValue` symbol suggests
    it syncs between devices like your other learned words.\n\n### Mine is empty\n\nI
    tried to fill it. Using [agent-desktop](https://github.com/vercel-labs/agent-desktop),
    I opened a new TextEdit document and typed `well fuck this shit, damn it.`, first
    as a text insert, then as individual key presses. Nothing changed: no row, no
    log line, and the file's modification date stayed in 2024.\n\nI don't know why,
    and I couldn't work it out. Maybe the Mac never records anything here, or maybe
    it only does so in some apps or settings. If you've got rows in yours, tell me
    what you did.\n\nThat would be a short article. But the database only counts words
    that are _already_ known to be vulgar. So who decides that?\n\n## Where the word
    list lives\n\nSearching the dyld shared cache for \"vulgar\" turned up a C API
    with an `LX` prefix (`LXVulgarWordUsageDatabaseCreate`, `LXVulgarWordUsageDatabaseCanAutocorrect`,
    …) and, more usefully, two functions on dictionary entries:\n\n    _LXEntryGetCategoryFlags\n
    \   _LXEntryGetMetaFlags\n\n`LX` is `Lexicon.framework`, a private framework that
    reads the per-language dictionaries under`/System/Library/LinguisticData/`. Every
    word in those dictionaries is an `LXEntry` with two 32-bit flag fields. If the
    vulgarity rating is anywhere, it's in those bits.\n\n## There is no public API\n\nI
    looked. `NSSpellChecker`, `UITextChecker`, `NaturalLanguage` and `UILexicon` don't
    expose vulgarity.`SensitiveContentAnalysis` covers images and video, not text.
    The only places \"profanity\" shows up on developer.apple.com are App Store age
    ratings and review guidelines.\n\nSo: private functions. Lexicon has no headers,
    but the C functions are exported, and their signatures are easy to guess because
    they follow CoreFoundation conventions. This program opens the dictionary for
    a locale, walks every entry, and prints both flag fields:\n\n    // lx.c — dump
    every word in a system lexicon with its flags.\n    // clang -O1 -o lx lx.c -F/System/Library/PrivateFrameworks
    -framework Lexicon -framework CoreFoundation\n    #include <CoreFoundation/CoreFoundation.h>\n
    \   #include <stdbool.h>\n    #include <stdio.h>\n    \n    typedef const void
    *LXLexiconRef, *LXCursorRef, *LXEntryRef;\n    extern CFStringRef kLXLexiconLocaleKey;\n
    \   LXLexiconRef LXLexiconCreate(CFDictionaryRef options, CFErrorRef *error);\n
    \   LXCursorRef LXLexiconCreateRootCursor(LXLexiconRef);\n    void LXCursorEnumerateEntriesRecursively(LXCursorRef,
    void (^)(LXEntryRef, bool *stop));\n    CFStringRef LXEntryCopyString(LXEntryRef);\n
    \   uint32_t LXEntryGetCategoryFlags(LXEntryRef);\n    uint32_t LXEntryGetMetaFlags(LXEntryRef);\n
    \   \n    int main(int argc, char **argv) {\n      CFStringRef locale = CFStringCreateWithCString(NULL,
    argc > 1 ? argv[1] : \"en_US\", kCFStringEncodingUTF8);\n      const void *keys[]
    = {kLXLexiconLocaleKey}, *values[] = {locale};\n      CFDictionaryRef options
    = CFDictionaryCreate(NULL, keys, values, 1, &kCFTypeDictionaryKeyCallBacks,\n
    \                                                  &kCFTypeDictionaryValueCallBacks);\n
    \     LXLexiconRef lexicon = LXLexiconCreate(options, NULL);\n      if (!lexicon)
    return 1;\n    \n      LXCursorEnumerateEntriesRecursively(LXLexiconCreateRootCursor(lexicon),
    ^(LXEntryRef entry, bool *stop) {\n        char word[512] ="
