  author: jon128
  text: Kubernetes&#x27; core pieces of userspace software, not with any implied support
    from the Kubernetes project, also run on illumos, FreeBSD (and HardenedBSD), and
    OpenBSD.<p>In some advanced settings where tolerances for potential impacts resulting
    from exploited software vulnerabilities are intensely low, Kubernetes (userspace
    software) on HardenedBSD is choice for mission.<p>Like with the other two systems,
    those running Kubernetes userspace on them are self-sufficient and are not among
    the audience of external more general Kubernetes distro support channels.<p>If
    you happen to like RKE, check out <a href="https:&#x2F;&#x2F;Talos.dev" rel="nofollow">https:&#x2F;&#x2F;Talos.dev</a>
    which is the best Kubernetes on Linux distro (for most Kubernetes on Linux use
    cases).<p>_<p>@nijave<p>Nomad and Kubernetes schedule containers, which are rarely
    not Linux containers, yeah.<p>Both can schedule processes in FreeBSD&#x27;s BSD
