  text: Any TCP packet (with IP options) you can send to a Linux kernel that doesn&#x27;t
    get DROP&#x27;d by netfilter makes you technically vulnerable.<p>That includes
    the one port your LAMP stack uses.<p>Or, the attacker might be originating from
    the other side of a device, like within a LAN. Malicious employees&#x2F;house
    guests&#x2F;what-have-you could target devices from inside your network where
    most devices (not just servers) don&#x27;t have as much protection and often have
    other open ports accessible, like file sharing&#x2F;SMB, SSH, SMTP, RDP, databases
