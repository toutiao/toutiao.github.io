  author: kqr
  text: I&#x27;m surprised by four things:<p>(1) An established framework for model
    evaluation runs the inference call with API key <i>inside</i> the isolated envionment
    the agent harness has full access to. Especially when it&#x27;s intended to be
    an offline environment, that seems kinda... dumb. The language model itself is
    not dangerous -- it&#x27;s only text. Inference is fine to do outside the isolated
    environment. It&#x27;s only the harness&#x27; tools that can have effects on the
    enironment, so <i>those</i> need to be sent to the sandbox.<p>(2) Only a small
    set of language models exploited this! I run private benchmarks a lot and I know
    how much the language models try to anticipate grader behaviour when the task
    is bechmark-shaped. I would have thought more of them would request the answer
    from the web.<p>(3) It takes someone else to mutate the task specification. When
    I&#x27;m looking at an older iteration of one of my private benchmarks, the first
    thing I do is add a small twist to it to see how much of a passing grade is learned&#x2F;anticipated.
    Seems like a cheap and easy coalmine canary that&#x27;s in the interest of the
    evaluator.<p>(4) MaxxBench did not try to dress some DeepSWE tasks in clothes
    that make them look less benchmarky. Their purpose seems to be answering &quot;how
    well does DeepSWE enchmark scores generalise?&quot; Part of the generalisation
    error is memorised solutions, yes, but another part is that models emit different
    behaviour when they suspect they are in a benchmark. By being careful to not leak
    the benchmark nature of the task, models spend a lot less time reasoning about
    the behaviour of the grader and this is likely to produce different performance
    on the mutated task. It would be interesting to know in what direction that effect
    points, because that is the performance people get out of the model in real situations.
    (In my experience, hiding the benchmark nature of the task can produce improved
    performance on both the original and the mutated task, but particularly the latter.)
