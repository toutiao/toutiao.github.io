  author: layer8
  text: The spec (RFC 8259) leaves significant leeway to implementations:<p><i>A JSON
    parser MAY accept non-JSON forms or extensions.<p>An implementation may set limits
    on the size of texts that it accepts.  An implementation may set limits on the
    maximum depth of nesting.  An implementation may set limits on the range and precision
    of numbers.  An implementation may set limits on the length and character contents
    of strings.</i><p>Add to that things like duplicate keys being allowed by the
    spec. There’s a lot of implementation choices to decide on.<p>And then things
    can get really complex with JSON Schema.
