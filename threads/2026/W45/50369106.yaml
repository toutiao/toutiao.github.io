  text: For like 99% of use cases encoding&#x2F;json was fine. Of course improvements
    are welcomed. But personally I&#x27;ve lead development of the backend of part
    one of the biggest sites of its kind in the world, and we just used encoding&#x2F;json
    and net&#x2F;http. Most of our use cases are just building APIs, client facing
    ones, internal ones, trusted third-parties. These systems have pretty high throughput,
    more than most people will ever work on.<p>Within our company I saw people in
    other teams writing their own optimised JSON libraries for whatever hellish reason.
    I always reiterated the point that as soon as that app made a single IO request
    all those nanosecond savings are invisible. Yes, it affects your total CPU time
    for processing a request but compute was never ever a limitation for us and it&#x27;s
    likely not a limitation for most people. And if the trade off is your app needs
    scale slightly larger versus writing custom JSON code or pulling in a third party
    dependency, then I&#x27;m accepting the larger scaling.<p>The biggest benefit
    of encoding&#x2F;json&#x2F;v2 isn&#x27;t the speed, it&#x27;s the improved API.
