  author: hnlmorg
  text: I’d already addressed that when I said the marshal API is an interface that’s
    meant to be reusable across generalise use cases. it can be used for a variety
    of data formats and not just JSON.<p>Go has this concept baked into the language.
    For example read and write interfaces so you can write data to an endpoint without
    having to worry about whether it’s a file system object, TCP&#x2F;UDP socket,
    gzip achieve, and a plethora of other options too.<p>It’s a nice convenience feature
    and makes up considerably for the restrictions that the Go type system places.<p>And
    if you need higher performance code, or compile time safety, or have any other
    constraints that limit your ability to use these generalised interfaces, then
    you can use different APIs from the Go standard library to achieve the same thing.<p>You
    don’t need to call json.Marshal() if you don’t want to. It’s an option, but it’s
    just one API into the JSON toolbox.
  score: 0
