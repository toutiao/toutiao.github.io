  author: thayne
  text: First of all, the json2 Marshall API is json specific.<p>Secondly, other languages
    like rust, haskell, scala, etc. Have json APIs that are typesafe and give you
    compile time errors if you try to use a type that doesn&#x27;t support (de) serialization
    . In the case of rust at least, the API is also general and can be used for other
    data types as well.<p>Even in go, you could have some more type safety if Marshall
    took an interface (such as MarshallerTo) rather than `any`. Although then you
    have the problem of how you implement that interface. So I guess you probably
    want some kind of &quot;derive&quot; functionality, or macros that can approximate
    it for a convenient and type-safe API.<p>P.S. gophers like to talk about how explicit
    being better than implicit, but using reflection for marshalling is <i>very</i>
    implicit.
