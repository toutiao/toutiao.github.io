  text: "&gt; It&#x27;s a function, not a method. So it can&#x27;t be part of an interface.<p>The
    mashaller here is a function, yes. But having a consistent signature means you
    can interchange those marshallers. It’s a trick I use heavily in murex to enable
    typed pipelines.<p>And I do this via a pipe interface. So it’s not uncommon to
    reuse function signatures for interface types (fewer runtime abstractions) while
    retaining some level of dynamism.<p>&gt; Say you are marshaling a struct that
    contains a struct from a third party library, and it works fine. Then you update
    to a new version of that library, and that added a new field for a type that doesn&#x27;t
    work, say a map[A]string where A is a struct.<p>The first mistake there is to
    blindly forward an internal API struct that you don’t control, and depend on that
    business logic.<p>Which comes back to my point about if you want type safety then
    you’d create a struct to be marshelled rather than passing data you don’t control.<p>I
    do take your point that the compiler in smarter languages would catch this. But
    you’d equally be told not to do this sort of thing on those languages too. So
    it feels like a moot point."
