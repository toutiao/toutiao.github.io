  author: awesome_dude
  text: lol, I don&#x27;t mean to be contrary, but I looked into dependency management
    (partly because of the modules implementation, partly because of early teething
    issues, and partly out of pure curiousity.<p>Dependency management is a freaking
    nightmare, nobody has managed to create something that is bulletproof, not cargo,
    npm, apt, yum, nix, homebrew, nothing.<p>The key issue is that you&#x27;re managing
    3rd party software that may or may not adhere to the prescribed lifecycle&#x2F;versioning<p>The
    Linux variants do it by each having dedicated teams watching upstream sources,
    taking what they believe to be whatever they feel is right, building for their
    nominated target(s), then testing, before deploying (on top of that, all of these
    steps vary in importance and rigor depending on numerous variables)<p>For programming
    libraries (which is what depmod, goose, vgo, and modules are managing) it&#x27;s
    just as bad, if not harder, because their very nature is to provide a base upon
    which other developers can turn into whatever their imagination.<p>Add to that,
    modules was (initially) written by people who were dealing with a slightly different
    ecosystem; Google rather famously has a monorepo, making their lives a little
    easier when it comes to managing dependencies.<p>So, with those things in mind,
    dependency management is always going to be a hard problem that is opinionated
    (eg. I have a firm opinion that there should be an easier way to &quot;pin&quot;
    a dependency, other than vendoring - note that this isn&#x27;t an invitation to
    every junior Go developer to come and claim go.sum does that. It doesn&#x27;t.
    go.sum is a log of what dependencies were used for the last build by whomever
    wrote to it)
