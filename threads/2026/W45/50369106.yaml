  text: "&gt; But the point you keep missing is that the function signature needs
    to be encoder agnostic for it to work as an interface.<p>It&#x27;s a function,
    not a method. So it can&#x27;t be part of an interface.<p>I suppose you could
    make an argument for passing it as a function argument to a higher ordered function.
    But that is kind of an unusual way to use such a function. And isn&#x27;t a common
    pattern in go.<p>&gt; My point here was: if you know you’re creating a struct
    to pass to the mashaller at compile time, then you’re already going to use JSONAble
    fields. So it’s not an issue.<p>Maybe. Maybe not. For a simple struct where all
    the fields are primitive types sure. But if you have a complicated hierarchy,
    you might miss that some strict in the hierarchy has a field that can&#x27;t be
    marshaled.<p>Say you are marshaling a struct that contains a struct from a third
    party library, and it works fine. Then you update to a new version of that library,
    and that added a new field for a type that doesn&#x27;t work, say a map[A]string
    where A is a struct. Your program still compiles fine, but then you get an error
    at runtime when you try to serialize something that worked before. Hopefully you
    have tests that catch it."
