    using Microsoft apps like excel, word, and powerpoint was such a hassle sometimes.
    The apps kept signing her out or didn’t have certain options (like formatting)
    that were available in the Windows versions. Installing and working with third
    party apps that some of her professors and classes required was also a hassle,
    and those apps worked inconsistently. I remember having to give her my laptop
    a couple of times just so she could get her work done. The battery life was significantly
