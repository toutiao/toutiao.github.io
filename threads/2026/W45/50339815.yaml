    is about 5-10,000MJ, about 70% of the energy used over its lifetime, pretty much
    just as you said.<p>This is about a month or two worth of household electricity
    usage.<p>It is equivalent to driving somewhere between 1,000-5,000 miles in a
    car depending on whether it’s gasoline or EV.<p>I think my guess was somewhat
    close. The average American is driving roughly 14,000 miles per year per person
    according to the federal highway administration. Most are doing so in a gasoline
    car, so we might surmise that buying a laptop is equivalent to about a month or
    two of an average person’s driving habits.<p>In my opinion that is one of those
    numbers that is both a lot and also not a lot at the same time.
