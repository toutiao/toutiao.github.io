  text: I built my own web tmux type thing running on a beefy metal box (for rust
    builds) that I access over tailscale. I was using HAPI, but I wanted to simplify
    and use rust for the back end and my own elm-like front-end to improve performance.
    I haven&#x27;t published it since it&#x27;s pretty specific to my workflow (I
    ruthlessly keep it as simple as possible), but you can think of it like a Herdr
    type thing in the browser. It also has a phone interface and I generally use speech
    instead of typing as a lot of my compositions can be stream of thought.<p>I use
    an MBA and an iPhone, but a cheap tablet or phone would work just as well. I care
    about network, portability, screen size + quality, and speech to text. Pretty
    much nothing else matters, CPU &#x2F; GPU irrelevant as long as it can run a browser.
    I might build a native non-browser version at some point for better resource management
    on the client, but it hasn&#x27;t been an issue so far. I would love a pair of
    glasses I could render text on with speech to text. It&#x27;s such a gap in the
    market, might just build my own bespoke thing if I can source the components for
