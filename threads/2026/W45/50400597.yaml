  author: mmooss
  text: China manufactures many things but that&#x27;s not the key part of the value
    chain. iPhones are manufactured in China (and elsewhere in Asia but Apple in Cupertino
    is the trillion-dollar company, not the actual manufacturers.<p>The key parts
    are R&amp;D, design, intellectual property, engineering talent. The question is,
    how well are Chinese organizations doing in those capacities in regard to robotics.
    My impression is that the answer is, quite well.<p>The focus on manufacturing
    is (in many cases) a twisted approach of economics. In the mid-20th century the
    West did very well with mass production. It was an innovative technology at the
    top of the value chain. But in early-to-mid 21st century, it&#x27;s (often) an
    old, ~commodity technology and the ROI is poor. It&#x27;s also physically not
    good for workers in many cases. When looking for economic growth you want to aim
    for top of the value change, for the future, not what was done 70 years ago -
    it won&#x27;t work the same way economically anymore. In economics, you can&#x27;t
    return to what worked before.
