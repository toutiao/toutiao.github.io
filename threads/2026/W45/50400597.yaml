  text: I&#x27;d look to the past at similar &#x27;revolutions&#x27; and what it did
    to existing players. For example &#x27;computer&#x27; was the name of an occupation
    that existed for millennia. [1] Yet so complete was the obsolescence that I think
    most people (certainly including myself) never even realized these people existed,
    but it&#x27;s quite obvious once you think about it.<p>Imagine all the work involved
    in, for instance, trigonometry and its basic applications in the past. And the
    later on with the advent of kinematics and so forth. These things involved a lot
    of computation and so there were literal human calculators whose job it was to
    work out all of the calculations.<p>But with the advent of electrical calculators,
    we literally no longer know that these jobs even existed. It&#x27;s very easy
    to see the same in a future where, for instance, computer programs can be efficiently
    written from description alone. At that point the idea of a &#x27;programmer&#x27;
    would seem like quite an odd concept.<p>I&#x27;d also look at what it did to the
    value of such work. Now computations, even quite complex, are mostly worth exactly
    $0. But we built extensive systems on top of those computations that became worth
    quite a lot indeed!<p>[1] - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Computer_(occupation)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Computer_(occupation)</a>
