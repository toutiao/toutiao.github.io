  author: YuechenLi
  text: 'I don&#x27;t really follow the logic in the article at all:<p>The argument
    is that Unitree&#x27;s assembly process is currently very manual because there
    is no incentive to automate, which is because labor cost isn&#x27;t the bottleneck
    here, where in the US labor cost are much higher, therefore the US will have incentive
    to automate more. Those are reasonable so far, until you try to use that as a
    conclusion that this is why the West will win?<p>First of all, what does he think
    the other 92% of the cost of manufacturing is? A small portion of that is materials
    and electricity, but the biggest part of the remaining cost is assembly tooling&#x2F;fixtures
    for the assembly line, and a fully automated assembly line is much, much more
    expensive compared to a semi-automated or manual production line.<p>In other words:
    it&#x27;s not that Unitree couldn&#x27;t build fully automated assembly lines
    if they wanted to, but spending tens of millions of dollars fully automated assembly
    line that takes up floor space and requires even more labor for manual maintenance
    for a product that is only being produced by the hundreds to thousands in quantity
    every month rather than millions simply does not make economic sense to begin
    with.<p>Second, why is he assuming that a fully automated assembly line will be
    cheaper to build in the US than in China, especially since he toured a factory
    with fully automated assembly lines at BYD in China immediately after? And sure,
    I would absolutely argue that American software engineering is more efficient
    than Chinese when looked at as a whole, but the cost of programming an assembly
    line is a minor portion of the cost compared to actually getting the assembly
    line fixtures and tooling built.<p>Third, his cost estimate is way off if he thinks
    you can get the same product manufactured in the US for only 50% more. From my
    own anecdotal experience, a more realistic cost for US manufacturing for pretty
    much anything is minimum 300% to 1000% more expensive if you are to make the in
    the US, and the lack of a mature parts supply chain in the US is honestly a bigger
    issue than worker wage.'
