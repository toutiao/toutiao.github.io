  title: I Toured Unitree's Factory. I'm More Bullish on the West Than Ever. · Josef
    Chen
  fetch_status: success
  content: "· 13 min read\n\n# I Toured Unitree's Factory. I'm More Bullish on the
    West Than Ever.\n\nEveryone thinks China's robot factories are automated. They
    aren't. The robots are Chinese; the robots that make robots will be Western.\n\n![Unknown
    Guangzhou artist, Tea Production in China (detail), c. 1800. Oil on canvas. Peabody
    Essex Museum, Salem.](/blog/unitree/artwork.jpg)\n_Unknown Guangzhou artist, Tea
    Production in China (detail), c. 1800. Oil on canvas. Peabody Essex Museum, Salem._\n\nOn
    Wednesday I toured Unitree's factory in Hangzhou, and I wasn't allowed to take
    pictures. In the building that makes the actuators, the motors that drive every
    joint, there were one or two new automated lines. The rest of the floor was filled
    with humans operating old-school winding machines. (Winding means wrapping copper
    wire around a motor's core.) I don't know what percentage of the motors are made
    on the automated lines. But staffing the floor with humans made sense.\n\n![Me
    with a Unitree humanoid in the company's showroom in Hangzhou, where photos were
    allowed; behind us, a row of robots lies face down on the stage.](/blog/unitree/photo-unitree-showroom.jpg)\n_Me
    with a Unitree humanoid in the showroom, the one place photos were allowed. Behind
    us, a row of robots lies face down._\n\nUnitree has a viral video ([28 million
    views](https://x.com/UnitreeRobotics/status/2022256376073089309)) of a humanoid
    doing assembly in its own factory, which it calls \"an actual deployment\". Its
    [IPO prospectus](https://dataclouds.cninfo.com.cn/sjother2/documents/2026/2026-05-25/3d7fc0538abe281340a95c9c77a90525.pdf)
    calls it a pilot, and says assembly is \"currently mainly manual\". At the end
    of 2025 all of Unitree's machinery was [worth about $1.7 million on its books](https://dataclouds.cninfo.com.cn/sjother2/documents/2026/2026-05-25/3d7fc0538abe281340a95c9c77a90525.pdf#page=227),
    at a company that [made almost 32,000 robots that year](https://dataclouds.cninfo.com.cn/sjother2/documents/2026/2026-05-25/3d7fc0538abe281340a95c9c77a90525.pdf#page=138):
    some $50 of machinery per robot!\n\n[\n ![Unitree](https://pbs.twimg.com/profile_images/1844926705389142016/nIEbH8rV_normal.jpg)\n\n](https://x.com/UnitreeRobotics/status/2022256376073089309)\n[\nUnitree\n\n](https://x.com/UnitreeRobotics/status/2022256376073089309)\n[@UnitreeRobotics](https://x.com/UnitreeRobotics/status/2022256376073089309)\n·[Follow](https://x.com/intent/follow?screen_name=UnitreeRobotics)\n\nUnitree
    Embodied AI Model Manufactures Robots in Factory\U0001F929 Based on Unitree’s
    UnifoLM-X1-0 embodied AI model, this is an actual deployment at Unitree’s own
    robot factory.\n\n[Watch on X](https://x.com/UnitreeRobotics/status/2022256376073089309)\n\n[\n\n8.4K](https://x.com/intent/like?tweet_id=2022256376073089309)[\n\nReply](https://x.com/intent/tweet?in_reply_to=2022256376073089309)\n\n[Read
    373 replies](https://x.com/UnitreeRobotics/status/2022256376073089309)\n\nIt doesn't
    need more. [Labour was 8%](https://dataclouds.cninfo.com.cn/sjother2/documents/2026/2026-05-25/3d7fc0538abe281340a95c9c77a90525.pdf#page=204)
    of what it cost Unitree to make its robots in 2025, outsourced assemblers included,
    and most of the rest was parts. With those hands it made [about 26,000 robot dogs
    in 2025](https://dataclouds.cninfo.com.cn/sjother2/documents/2026/2026-05-25/3d7fc0538abe281340a95c9c77a90525.pdf#page=138),
    more than the [roughly 20,000 IDC reckons](https://dataclouds.cninfo.com.cn/sjother2/documents/2026/2026-05-25/3d7fc0538abe281340a95c9c77a90525.pdf#page=114)
    the whole world shipped the year before.\n\nSo there's only so much a machine
    can save: halve a cost that's 8% of the bill and you save 4%. Unitree [expects](https://static.sse.com.cn/stock/disclosure/announcement/c/202603/002178_20260320_BLK4.pdf)
    the motor line it's building to cut the labour in each motor by more than half,
    and the cost of one robot model by under 2%. Its labour per robot had roughly
    halved since 2023, and [the filing credits scale, standardised processes](https://dataclouds.cninfo.com.cn/sjother2/documents/2026/2026-05-25/3d7fc0538abe281340a95c9c77a90525.pdf#page=204)
    and more skilled staff. None of those is a machine; two are kaizen, and I named
    my company, KAIKAKU, after the other word.\n\nThe other reason Unitree builds
    by hand starts in the showroom. Our host told us [Unitree's CEO, Wang Xingxing](https://www.unitree.com/news/42),
    asked a G1 running GPT-6 to fetch him a bottle of water from another room. It
    did. Slowly. The same Wednesday I toured his factory, Wang told a conference in
    Wuzhen that Unitree had spent ten years on the robot's body and would now [put
    its weight on the brain](https://www.scmp.com/tech/tech-trends/article/3373423/powered-gpt-6-unitree-humanoid-robots-master-painting-chess-without-training-says-ceo).
    Unitree's own slide puts robots' \"ChatGPT moment\", when they can do 80% of tasks
    they've never seen 80% of the time, two or three years out. That slide is from
    last year, so it's as soon as next year.\n\n![Unitree's roadmap slide, as presented
    to us in Hangzhou, with the presenter in the foreground: levels of autonomy for
    cars set against humanoids. For humanoids, a \"ChatGPT moment\" of 80% success
    on 80% of unseen tasks, marked \"Next 2-3 years: Xingxing (CEO&CTO, Unitree)\".](/blog/unitree/photo-unitree-roadmap-slide.jpg)\n_Unitree's
    own slide, as shown to us in Hangzhou._\n\nUntil then, humanoids are mostly toys
    for researchers: our host named Nvidia, Amazon, Meta and universities. [Three
    quarters of Unitree's humanoid revenue](https://static.sse.com.cn/stock/disclosure/announcement/c/202603/002178_20260320_OE27.pdf#page=7)
    came from research and education in the first nine months of 2025, and [under
    5%](https://static.sse.com.cn/stock/disclosure/announcement/c/202603/002178_20260320_OE27.pdf)
    from factories or other industrial work (half or more of what Unitree files as
    \"industry\" is robots giving guided tours at companies). When someone asked what
    [the GD01, a rideable mecha](https://www.globaltimes.cn/page/202605/1360822.shtml)
    from $650,000, is for, the answer was that Wang had wanted one since he was a
    child.\n\n[\n ![Unitree](https://pbs.twimg.com/profile_images/1844926705389142016/nIEbH8rV_normal.jpg)\n\n](https://x.com/UnitreeRobotics/status/2054067819634159622)\n[\nUnitree\n\n](https://x.com/UnitreeRobotics/status/2054067819634159622)\n[@UnitreeRobotics](https://x.com/UnitreeRobotics/status/2054067819634159622)\n·[Follow](https://x.com/intent/follow?screen_name=UnitreeRobotics)\n\nUnitree
    Unveils: GD01, A Manned Transformable Mecha, from $650,000 \U0001F44F The world's
    first production-ready manned mecha. It can transform. It's a civilian vehicle.
    It weighs ~500kg with you inside. Please everyone be sure to use the robot in
    a Friendly and Safe manner.\n\n[Watch on X](https://x.com/UnitreeRobotics/status/2054067819634159622)\n\n[\n\n16.9K](https://x.com/intent/like?tweet_id=2054067819634159622)[\n\nReply](https://x.com/intent/tweet?in_reply_to=2054067819634159622)\n\n[Read
    1.1K replies](https://x.com/UnitreeRobotics/status/2054067819634159622)\n\nA product
    without a job changes every year, and a custom machine only works if the product
    is kind of frozen, so a machine built for this year's robot is scrap next year.
    It's like tailoring a suit for a teenager. Right now everything's ever-changing,
    except the motor. [Unitree is automating its joint modules first](https://static.sse.com.cn/stock/disclosure/announcement/c/202603/002178_20260320_OE27.pdf#page=150)
    because they're the parts its robots share most. When I toured a drone factory,
    the circuit boards and motors were made by machine and final assembly was done
    by hand. In a drone the motor is a whole component, but in a humanoid it's half
    of one, the copper-and-magnets half, and that half has stopped changing, like
    the AA battery in a toy that's redesigned every Christmas.\n\n[In May I said](/blog/ghenghis)
    China's new factories \"bolt robots into every one\" and the West should \"erase
    the factory floor\". The first bit wasn't true of the plant I vis"
