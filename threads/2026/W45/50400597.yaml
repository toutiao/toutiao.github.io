  author: tristanj
  text: 'I believe this conclusion is flawed. The author argues:<p>1) Unitree robots
    are largely made by hand.<p>2) Labor is approximately 8% of cost of manufacturing
    these robots. Because these costs are not prohibitive, there is little incentive
    to automate.<p>3) Labor costs are higher in America.<p>4) Therefore, American
    companies have higher incentive to automate.<p>5) Therefore, the West will capture
    most of the robotics opportunity.<p>Arguments 1-4 are reasonable, but 5 is a non-sequitur.
    Higher incentive to automate does not imply a better ability to automate &amp;
    scale manufacturing.<p>I believe Unitree is currently assembling robots by hand
    for practical reasons:<p>1) Labor is still relatively cheap.<p>2) Humanoids and
    robots are evolving rapidly, changing every few months.<p>3) Custom assembly lines
    are expensive, and become obsolete when the product changes. It&#x27;s difficult
    to maintain an assembly line when the product is rapidly evolving.<p>4) Tooling
    is inadequate. Some robotic parts are delicate, complicated, and difficult to
    automate manufacturing of. American companies have hit the exact same problem:
    Tesla is assembling the hand&#x2F;forearm of Optimus by hand because it hasn&#x27;t
    figured out how to automate manufacturing them. <a href="https:&#x2F;&#x2F;www.theverge.com&#x2F;tech&#x2F;1016492&#x2F;tesla-optimus-robots-production-musk-q3-earnings"
    rel="nofollow">https:&#x2F;&#x2F;www.theverge.com&#x2F;tech&#x2F;1016492&#x2F;tesla-optimus-robots-p...</a>
    . Apparently, Tesla has hundreds of handless Optimus robots just standing around,
    waiting for hand manufacturing to catch up.<p>5) Demand is still relatively niche,
    these are not mass market products. Unitree only sold 5,500 robots last year.
    There is not enough demand to justify massive automated lines.<p>The author also
    ignores the biggest counterpoint: the Chinese have already demonstrated mastery
    in automated manufacturing, and have proven they can run dark factories (factories
    without humans) at a better scale than the west.<p>When humanoid robots become
    a mass market product (they are not ready today because the software side is majorly
    lacking), Chinese manufacturers are in an excellent position to rapidly automate.'
