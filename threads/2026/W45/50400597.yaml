  author: pseudohadamard
  text: "&gt; Motor winding is an amusing problem.<p>Also really difficult to do,
    with huge tradeoffs depending on whether the construction is 2-core, 4-core, interpoled
    4-core, coreless, slot-wound, salient poles, and many more configs and winding
    types. In particular cheap salient-pole motors can be wound directly with automated
    machinery while better slot-wound motors need to have the coils formed first,
    then inserted into the rotor slots, which is a manual process and complicated
    further by the fact that the coils are skewed to minimize torque ripple, no-one&#x27;s
    really managed to automate that process yet.<p>So if you saw a factory making
    a mixture of salient-pole motors for toys and slot-wound motors for serious use
    you&#x27;d see exactly what TFA is describing, salient-pole automated, slot-wound
    with human operators.<p>If you want to see what real highly-automated Chinese
    manufacturing is like, look at one of Bunny Huang&#x27;s videos on electronics
    assembly. Then for contrast look at the videos of how it&#x27;s done in Pakistan."
