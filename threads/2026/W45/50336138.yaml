  text: Tell me you&#x27;ve never needed significant healthcare without telling me.<p>It&#x27;s
    never about &quot;ambulances&quot;. The bureaucracy will happily call an ambulance
    for you, as it ends their involvement and absolves them of liability. And the
    ambulance company is happy to show up, as it&#x27;s a large billable event. In
    fact when seeking&#x2F;obtaining complex medical care, this is one of the <i>failure
    modes</i> you have to constantly swat away!<p>As for interacting with the bureaucracy
    to obtain real care, it&#x27;s gotten to the point where it&#x27;s easier to get
    something done calling a large bank. Navigating the medical bureaucracy is probably
    on the level of calling Comcast-Warner (although I haven&#x27;t had the misfortune
    of having to deal with them for a decade, so I&#x27;m sure they&#x27;ve gotten
    worse as well).<p>Even before &quot;AI&quot;, my standard experience is a multi-level
    phone tree, multiple mandatory announcements before you can even proceed, then
    waiting on hold. That merely gets you to an answering service who types a ticket
    into the computer system. Then you wait a ~day for a nurse to call you back (if
    you miss answering this call, return to step 1). Then the only urgent appointments
    are invariably with &quot;nurse practitioners&quot; who throw pre-canned advice
    at you, as they don&#x27;t really know what they&#x27;re doing. That&#x27;s four
    layers running interference to keep you away from an actual doctor, who you will
    finally get to see in a month for a fifteen minute appointment, if you are lucky.
