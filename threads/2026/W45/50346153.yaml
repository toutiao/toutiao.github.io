  author: bluegatty
  text: 'FYI there is a reason for that.<p>Stocks are valued as the sum total of all
    the profits they ever make (net present value of future earnings).<p>So even at
    $1 profit&#x2F;year - technically worth infinity.<p>But due to &#x27;time value
    of money and risk&#x27; (aka some risk free discount rate you can put your money
    elsewhere at get the same return for zero risk, like your bank account), then
    the infinite sum of those $1&#x2F;year becomes some finite sum.<p>The problem
    wit this math is when profits grow perpetually higher than the cost of borrowing
    - the net present value goes to infinity.<p>A P&#x2F;E ratio = 1&#x2F;(cost of
    capital - growth rate). Assuming no dividends.<p>An investor with 8% cost of capital,
    a company growing at 3% per year woudl have a P&#x2F;E of 20.<p>At 7% growth the
    value is p&#x2F;e 100x ...<p>Any growth over the &#x27;cost of capital&#x27; and
    the P&#x2F;E goes to infinity because the infinite sum of all future cash flows
    does not converge.<p>What this means is that the valuation math breaks down when
    there are gigantic swings of in growth at rates of even like 30% more for any
    extended period; it&#x27;s extremely hard to value.<p>Verizon is valued as it
    is because they have an operational lock on a system; they will never grow that
    much but their returns are predictable. You can spreadsheet their valuation.<p>All
    this AI stuff is &#x27;inherently wild&#x27; because growth is high, but opaque.
    Yes, there is a lot of hyperbole and speculation but this is very different than
    Space X which is a &#x27;Musk Meme&#x27; stock, upheld be retail investors.<p>Edit:
    this is the most rudimentary articulation of how stocks are valued. It&#x27;s
    not made up hunches, and companies that invest a lot in these things have a lot
    of numeric justification they have to use to make the assessment - and NPV is
    at the core of it. That &#x27;math&#x27; is the first order concept that underlies
    valuation and it&#x27;s the hyperbolic nature of growth beyond cost of capital
    that makes the it come undone which is the mechanical basis for the wild swings.
    It&#x27;s what happens to valuation when you make small adjustments in only a
    few parts of the model.'
  score: 0
