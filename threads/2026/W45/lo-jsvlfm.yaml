    Nice!
    It's a shame the ACME DNS part ends up a bit complex, though as you say in a footnote, it's simpler if you find/use a DNS host that offers API tokens that are scoped to a particular domain.
    I often want a different auth scheme than a service provider offers, and so end up writing/using proxies to do my preferred auth on ingress, and then inject the actual token on the egress. Exactly where to host that is another question (where are you willing to host a server that has write on all your domains...), but perhaps Bunny Edge Scripting could do this (since you already trust Bunny).
    For ACME DNS in particular, https://letsencrypt.org/2026/02/18/dns-persist-01 will allow DNS-based cert validation, without needing to do DNS updates, making all this a lot easier.
