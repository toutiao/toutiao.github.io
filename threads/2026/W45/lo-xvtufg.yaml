  text: |-
    I’m most familiar with the IETF so this drama makes me wonder how something similar might play out in that context.
    The IETF generally doesn’t do big feature releases of major standards, so there’s no way to (eg) cancel three years of work on TLS because of controversy over one part of it. When the IETF does do big standard revisions (eg RFC 9110 and friends for HTTP, or RFC 9293 for TCP) it’s a very conservative consolidation of firmly established features, and newer stuff remains in separate RFCs. This makes it easier for the IETF to revise specifications, but they end up spread piecemeal across dozens of documents and it’s often unclear which RFCs are core and which are ignored. Sucks to be an implementer who doesn’t have easy access to advice from old hands.
    There aren’t any votes in the IETF. To get a spec through the process the authors have to be persistent enough (typically over a period of a few years) and responsive enough to feedback from the working group that they can persuade the WG chairs that the WG participants think the draft is worthy. Experience from an implementation helps but isn’t required. There’s generally a bias in favour of publication, modulo the effort required to push the document through the process. If a document is controversial then there can be ongoing flamewars about it for literally years, but that isn’t necessarily enough to prevent publication, especially if prominent vendors have draft implementations that interoperate.
    Decisions are formally made on the working group mailing lists where discussions happen. IETF meetings act as checkpoints where WG chairs review the progress of active documents and determine what needs to happen next. They also help to grease the wheels by getting people into the same room (or bar or restaurant) which can unstick the online discussions. (Sounds like ETSI is similar in this respect.)
    I doubt the IETF’s piecemeal strategy would work so well for a programming language, where users normally expect it to be a coherent whole. But ISO does have “technical specifications” for extensions to a language (defer in C is being published as a TS). And there are a bunch of informal de facto small extensions to C that aren’t standardized because there’s no venue that can support that kind of work. And because responsibility for libc is split between ISO’s standard library and POSIX, we get silly things like pthreads being renamed in order to import it from one standard into the other. Similarly, the C committee tends to re-do existing extensions instead of adopting them as-is. So a more open and flexible process would be better, but probably not IETF-level anarchy.
