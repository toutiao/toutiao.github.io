    Essentially anyone can participate in wg21, but you can only vote in wg21 if you are a registered member of iso, which means you have to be representative of some country, though that is mostly a formality.
    After WG21 (or whatever ISO working group) makes a decision, that then goes on to the various national technical committees/TAGs ("technical advisory group" I think). The TAG consists of the members of the ISO WG that are representatives of that country - e.g. US representatives can only be in the TAG for the US NB, french representatives can only be in the TAG for the French NB, etc.
    The TAG then makes its recommendation to the voting members of the NB - for incits that is the "executive board", but I don't know if that's ISO terminology or just INCITS. The voting members do not necessarily have anything at all to do with the various standards that come up, so normally it is simply a formality in which they accept the recommendation of their TAG, which would normally just be to recommend that they accept what WG21 (or whichever working group) recommends.
    That clearly did not happen, but while I can't talk about anything I am aware of, I also do not know anything about what happened in other NBs - only what the voting outcomes were. The goal of this separation is to ensure independence of the various NBs.
    But the fundamental point is that the NB votes are not made by members of WG21 (or necessarily any of the WGs for which they vote). I guess in principle a WG member could be a representative of one of the voting members, but I don't know if that happens or if so how common - and of course every representative that is a member of one WG is unlikely to be on the WG for a bunch of other things they're expected to vote on \o/
