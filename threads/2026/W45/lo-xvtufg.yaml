    I've been looking around intensely for the past few days at the proposed text for contracts and many of the arguments that have been posted online about them, trying to sort out how I feel about the situation.
    First of all, I like the idea of contracts and think that it's a good thing for languages to have something like them.
    I think describing the current text for contracts that was going to go into C++26, in any way other than "contentious" and "not ready to ship" is blissfully hopeful and misguided. It's trying to be three or four different things at once, succeeds at only one of those three or four things, and that one thing is something that very few people are going to benefit from, but the resulting feature surface area looks a lot like "oh nice I can refactor my battery of asserts into a battery of contract statements" but does not actually work like that and is a huge footgun.
    So C++26 getting disapproved was the thing that should have happened and should have been expected to happen.
    Some of the anti-contract points are trivial and pointless, and could easily be resolved by saying something like "implementations should (but are not required to) emit a diagnostic when the linker tries to do X or Y" or whatever (just a random example, not me proposing anything), but nothing like that was actually added to all of the trivial pointless edge cases in the contract text, it feels like these minor problems are being swept under the rug instead of getting fixed. I have no idea why they're not just getting fixed. Committee internal politics? That wouldn't be good. It's probably not that but it's one of the few things that comes to mind as a possible explanation.
    Some of the anti-contract arguments are just garbage and really should be ignored. I won't say which ones I think they are because it's not important.
    But there are other anti-contract arguments that I think are legitimate and have not actually been addressed. In particular there are 3 where I'll give my opinions on what the contracts people should do:


    There needs to be a way to write contract assertions that cannot be turned off and will always be run. Every usable assert library has a way to do this. There is no valid reason not to include a way to do this.


    Contract batteries (i.e. sets of contract assertions that have sequence points before and after them) should be treated as wholes: the #1 #2 #2 #1 scenario described as "valid" in the proposed standard text (at least the latest public version of it) must be explicitly forbidden. Allowing re-evaluation like #1 #2 #1 #2 is fine. But allowing scattered or "shredded" evaluation (to make up a term for it) is such an enormous logic footgun that I can't come up with any real reason to allow it. The only arguments I can come up with to allow it revolve around weak compilers that barely do anything or are written like transpilers, but there are exactly zero such C++ compilers, so there's no reason to design around them. I understand that there are valid reasons for re-evaluating contract batteries, like evaluating them on both the caller and callee side, but I cannot come up with any reason for "shredding".


    "observe" mode needs to be explicitly outlined as a porting or debugging tool and heavily proscribed or even marked as invalid for production code somehow, or removed from the standard entirely, or become an annotation on individual contract assertions instead of being available as a contract mode. Merely recommending against its is not enough. It is too dangerous and causes too many weird semantic edge cases in contract evaluation (e.g. it makes the "shredding" discussed in 2 even more dangerous) for it to be given to developers as a mode for general contracts. If fixing it (e.g. making it an annotation) is a headache because of how contract handlers work and you don't want to do it properly, then it should be gutted.


    I have a couple more problems with them (like the const-elevation thing, which seems to be a scar from "trying to be 3 different things at once" and not a real design need), but they're basically quibbles in comparison to these 3 points.
    ... And for C++26, give up on contracts. Pull them out. Try again next time and keep trying to build agreement and compromise with the NBs until then. In particular, doing point 1 will probably win over enough NBs to win out over the detractors, IMO.
