    That does sound very much like you couldn't be bothered reading my replies, and instead said something that is demonstrably untrue.
    The national bodies do not send anyone. Any ISO member represents a country, and can then vote as they fit. They can go to the TAG and vote there. The overwhelming majority have no direct connection to any of the voting members of any national body. US members of ISO are generally members through ANSI, nothing to do with INCITS, which is the US national body that covers WG21. There are 18 companies that vote in that national body. The majority of those companies do not have any representatives in WG21. Any company can pay INCITS to have a voting position on the NB, it costs as little as $11k a year to be one of the voting members of the executive board (https://www.incits.org/dotAsset/c9027f72-5ff0-4686-a8f3-24c85417e630.pdf). The NB votes are one vote per member company.
