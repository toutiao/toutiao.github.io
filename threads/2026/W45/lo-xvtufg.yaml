    I'm literally in these groups, and the ISO NB votes are not individual members of WG21 - in fact the majority of members have nothing to do with C++. The NB votes are made by organizations or companies in the organization that does the NB vote in each country.
    For example, in the US NB for JTC1 (the ISO section covering IT) is INCITS, which has 18 voting members: https://www.incits.org/committees/eb/ .
    The voting rules for INCITS are that approval requires a 2/3rds majority of those organizations that vote and a majority of the members that do not explicitly abstain. E.g. non-voting members are equivalent to "opposed" unless explicitly abstaining from the vote. This is covered in section 5.2.2 of the INCITS policies and procedures: https://www.incits.org/dotAsset/5c620240-4714-4ec8-b3bb-dee03b5bc6dd.pdf
    But I think the problem here is that you're thinking that the NB is a "C++" NB, which is part of why you are thinking "the NBs WG21 members are the ones voting".
    The NB is not just C++. It is responsible for voting on a vast array of different ISO standards. For example here are the the iso standards that the INCITS executive board votes on: https://standards.incits.org/browse/us-tag-listing - C++ is working group 21 under subcommittee 22, next to COBOL, Ada, Prolog, "Programming Language Vulnerabilities" (wat?), "Linux" (?????), Fortran, and C.
    So again, the NB votes are not just a bunch C++ committee members: the INCITS EB page has links to each member and you'll see that a bunch of them have no programming language involvement at all.
    Hopefully once you see that the voting members of a NB like INCITS are not engineers, they are not all C++ or WG21 members, and a bunch of the INCITS members have nothing to do with programming languages at all, it will become clearer that this is not a "WG21 members voted against C++26".
    Historically the NB vote has been a formality, but this time the WG21 DIS was rejected, and who knows what happens next.
    And before you ask: no I cannot talk about anything that happened in any committees, subcommittees, technical committees, advisory groups, or any of the other myriad names ISO has for "group of experts talking about about stuff".
