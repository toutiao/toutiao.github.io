    It sounds like the process worked exactly as intended: just because no one voted down a DIS before doesn't mean that shouldn't ever happen. When the water is as muddy as it is now, saying no is a signal to clear the water. No matter how "good" it might seem to those who want it, if you wrote a book instead of a proposal, or you walked a marathon instead of a mile, or you did the entire year's worth of homework on day one, you went too far. Same for adding an entire JIT compiler to CPython without an adequate PEP. Same for spending ten years discussing collection literals in Java instead of coming up with something people actually asked for.
    When something brings this much confusion, the right thing to do is say "no, this needs to go back to the actual first draft phase, because this went way too far without anyone calling it back". That's doing right by the entire community by reaching for the rules you almost never need: they're there exactly for these situations. And now you keep talking: the vote says "no, in the current form", it does not say "no, now stop asking".
