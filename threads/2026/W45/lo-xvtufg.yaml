    The current text for C++26 contracts is trying to validate a lot of those use cases at the same time and ends up being a specific compromise that is not actually useful to any of them. It's not better for static analyzers than asserts, it's not better or easier asserts for assert users, it's not a good diagnostics or error telemetry tool because it's too hard to control what the compiler is doing because so much is implementation-defined, etc. A good-enough compromise might exist, but the current proposed text isn't one.

    That goes entirely against the theory of contracts. A contract adds redundant checks into the code base to validate your implementation against. "Always on contracts" are part of the implementation itself and thus can not be a used to validate the implementation.

