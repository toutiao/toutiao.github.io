  text: |-
    Who votes against the draft they approved themselves earlier?

    That's not really how it works.  Individual papers are approved one at a time by votes in sessions in the in-person meetings.  This already creates a bias towards people who have the funding to travel to these.  Because they're in-person meetings and the votes are live, there's a reasonable chance that people either haven't had time to read the entire proposal (especially something as big as P2900) or they are voting based on presentations or trust for other people.  I've not been to one of these meetings but other folks have written about the peer pressure they experienced to vote the 'right' way.  The final vote based on the DIS is a vote on the combination of all of the things that were voted in individually and it's also a vote where national bodies have polls that run for several weeks and give people a chance to read a lot.
    Contrast this with another standards group I'm involved in: ETSI.  In an ETSI process, the draft is stored in git.  Desired changes are raised as issues.  There's online discussion that either reaches consensus or is flagged for discussion at the meetings.  Concrete changes are raised as PRs.  These either reach consensus in review or are flagged for discussion.  The discussions in meetings are not where you make decisions, they're where you explain and discuss things.  This gives a much more thoughtful decision-making process.
