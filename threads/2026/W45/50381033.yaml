  author: rhoohr
  text: '&gt; What is it like to hear vocal folds vibrate?<p>I wouldn&#x27;t normally
    describe hearing a voice as hearing &quot;vibrations&quot;. Vibrations are indeed
    the physical basis of sound, and the auditory system detects changes in air pressure
    caused by them. But vibrations can also be perceived through touch, and the subjective
    experience of hearing is quite different from the tactile sensation of feeling
    something vibrate. When talking about feeling vibrations, I usually think of the
    touching sensation.<p>Still, both sensations originate from the same physical
    phenomenon. You can try to feel your own vocal chords vibrate by placing your
    fingers on your throat while humming. It&#x27;s certainly a very different sensation,
    and touch generally conveys fewer acoustic details than typical hearing, but you&#x27;re
    sensing the same underlying physical event.<p>One interesting example is Dani
    Valeska (Instagram: @daniivaleska), a Brazilian Sign Language interpreter whose
    husband is deaf (I couldn&#x27;t find his name). She shares content about their
    experiences, and I remember seeing a video in which her husband used the vibrations
    of her voice, felt by touching her throat, to reproduce what she was saying. This
    resembles a technique called &quot;tactiling&quot;, which has been studied as
    a tactile aid to speechreading (<a href="https:&#x2F;&#x2F;researchers.mq.edu.au&#x2F;en&#x2F;publications&#x2F;tactiling-a-usable-support-system-for-speechreading&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;researchers.mq.edu.au&#x2F;en&#x2F;publications&#x2F;tactiling-a-us...</a>).'
