  author: dugidugout
  text: I think there&#x27;s a misreading at the root of this. The &quot;70 Hz&quot;
    in the post is the modulation rate from the TMTF, not an audio frequency. The
    TMTF measures how fast loudness can flutter before the flutter is undetectable.
    It isn&#x27;t a pitch or discrimination test. From the post, OP does discriminate,
    somewhat, above 70 Hz and says they can&#x27;t judge pitch direction at all, so
    there is no 20–70 Hz &quot;working band&quot; to retreat into.<p>I agree with
    the broader instinct that OP deserves a clinician to help with the hardware side
    (having their map and device parameters alone would go a long way), but it seems
    OP is taking any step they can towards this effort.<p>I regret that I don&#x27;t
    have anything to actually add towards helping OP. Their posture towards understanding
    is refreshing and the Lean bit reads to me more as a cute testament to that than
    anything eerie or strange.
