  text: ENT surgeon who has bilateral CIs and has been in the research field for 20+
    years. This sort of stuff is cool, but there are lots of limitations at the auditory
    nerve interface that limits improvements to speech and music processing strategies.
    Crazily enough, many of these studies were done in the 1960s to 1990s and are
    still valid today. There are strategies that can help at individual level, but
    do not help everyone. Thus they have not made it to clinical use.
