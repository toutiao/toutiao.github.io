  text: 'Author here. I&#x27;m Korean, and I have cochlear implants in both ears,
    which I received in a clinical trial in 2025. No one could tell me what I actually
    hear, so between 11 October and 4 November 2026 I ran seven psychophysical tests
    on myself (10,992 trials), using browser test apps that Claude built for me. I&#x27;m
    an amateur, so there are surely mistakes, and corrections are very welcome.<p>All
    trial-level data, the analysis code and Lean 4 checks of the apps&#x27; logic
    are on GitHub (non-commercial licenses): <a href="https:&#x2F;&#x2F;github.com&#x2F;mi-rae-lab&#x2F;ci-psychophysics-data"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;mi-rae-lab&#x2F;ci-psychophysics-data</a><p>I
