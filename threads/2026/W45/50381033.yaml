  text: '&gt; the small difference of time it takes the sound to reach your ears.<p>The
    science behind Head Related Transform Functions [0] is fascinating, and includes
    additional tricks. For example, the shaped fleshy bits of your ears <i>modify</i>
    incoming sound differently depending on the direction, so that the noise from
    &quot;up and in front&quot; has a signature which differs from &quot;down and
    behind&quot;. There&#x27;s also a component that comes from sound traveling <i>through</i>
    your head, where traveling through the front is different than traveling though
    the back.<p>I particularly remember this because long ago I had an Aureal A3D
    [1] sound-card which made great positional sound (over headphones) by simulating
    HRTFs and sound-reflection off of game-world geometry. Unfortunately they were
    sued into bankruptcy by Creative, whose EAX technology was much less-impressive.<p>[0]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Head-related_transfer_function"
