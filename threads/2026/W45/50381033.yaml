  author: dugidugout
  text: "&gt; ... maybe OP is confused about how the audio spectrum works in general
    then, because they themselves talk about this 70hz shelf in the same breath as
    human vocal ranges etc -- that isn&#x27;t amplitude modulation frequency.<p>In
    a CI, voice pitch actually _does_ arrive as amplitude modulation at the F0 rate.
    The processor keeps only each channel&#x27;s envelope, and the harmonics of a
    voice that share a channel beat against each other at F0. So a 70 Hz flutter ceiling
    and vocal ranges do belong in the same breath.<p>&gt; ... so I was confused at
    how someone could say they &#x27;don&#x27;t hear anything above 70hz&#x27; and
    yet can somehow hear &#x27;noise&#x27; at &#x27;2000 hz&#x27;. But it is dawning
    on me that the implant &#x2F; associated driver hardware may simply be &#x27;saturating&#x27;
    ...<p>The TMTF carrier was noise by design, so above 70 Hz the flutter vanished
    and the noise that was already there is all that&#x27;s left. No saturation is
    needed to explain it. The “wind” in SRD is what a spectral ripple sounds like
    through limited spectral resolution. This is a resolution problem, not a level
    problem.<p>&gt; The exposition is strange and again that could just be the translation
    and writing style...<p>This paragraph was why I initially made a comment. They
    were radically honest with their methodology and obviously living inside the problem.
    OP is actually reading this thread, for what it&#x27;s worth."
