  author: Someone
  text: '&gt; Javascript uses UTF-16 for strings<p>I don’t think the spec requires
    that. <i>charAt</i> indexes on UTF-16 code points, but I don’t remember ever seeing
    that it has to do that in O(1) time, so that doesn’t imply the implementation
    has to use UTF-16 internally.<p>Also, for modern JavaScript, <a href="https:&#x2F;&#x2F;developer.mozilla.org&#x2F;en-US&#x2F;docs&#x2F;Web&#x2F;JavaScript&#x2F;Reference&#x2F;Global_Objects&#x2F;String&#x2F;charAt"
    rel="nofollow">https:&#x2F;&#x2F;developer.mozilla.org&#x2F;en-US&#x2F;docs&#x2F;Web&#x2F;JavaScript&#x2F;Refe...</a>
    says:<p><i>“Note: Avoid re-implementing the solutions above using charAt(). The
    detection of lone surrogates and their pairing is complex, and built-in APIs may
    be more performant as they directly use the internal representation of the string.
    Install a polyfill for the APIs mentioned above if necessary.”</i><p>Because of
    that, I would hope most modern implementations to at least have a variant internal
    representation that is similar to UTF-8.'
