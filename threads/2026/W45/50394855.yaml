  content: "# First steps in bare-metal programming using UEFI – series index\n\n![](img/chip.png)\n\nThese
    articles are about using a Linux workstation to develop bare-metal applications
    for a PC-type computer with UEFI firmware. They are written for experienced Linux
    developers, but assume no prior knowledge of UEFI. The articles cover the software
    tools needed, how to compile and link, how to create a bootable disk, and basic
    file management.\n\nPlease note that I wrote these articles to be read in order.
    Each one relies on information from the previous articles, and it might be difficult
    to follow them out of sequence.\n\n[Part 1 – Compiling and Linking](efitest1.html)
    \ \n[Part 2 – The EFI system partition](efitest2.html)  \n[Part 3 – Making a DVD
    or USB flash image](efitest3.html)  \n[Part 4 – A pragmatic digression](efitest4.html)
    \ \n[Part 5 – Handling files using the Simple File Protocol](efitest4.html)\n\n
    \ \n\n_Have you posted something in response to this page?  \nFeel free to send
    a [webmention](webmention.html)to notify me, giving the URL of the blog or page
    that refers to this one._"
