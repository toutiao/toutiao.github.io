  author: kragen
  text: I think &quot;leveraged this coding methodology&quot; is an unjustifiably
    positive way to describe the results of the process.  I think &quot;spread this
    disease&quot; would be more accurate.  UTF-16 strings, really?  VFAT?  PE32+ is
    maybe justifiable (I&#x27;d prefer ELF, but that&#x27;s because it&#x27;s more
    familiar, not because it&#x27;s actually better), but VFAT?  And even in 01998
    it should have been apparent that UTF-16 was not a sane format for strings, much
    less in 02005 when the EFI → UEFI transition happened.<p>To me, UEFI is like &quot;leveraging
    the waste disposal methodology&quot; of dumping your toxic waste in a lake.  Yes,
    it&#x27;s more convenient for you, but it does lasting damage and causes years
    of suffering for millions of people; and eventually somebody else has to clean
    up your mess, at far greater cost than if you&#x27;d just done something sensible
    to begin with.<p>I could probably say the same thing about X-Windows.
