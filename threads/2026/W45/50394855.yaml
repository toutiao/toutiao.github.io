  text: Windows 95 introduced long filenames to FAT, and implements the file system
    in the VFAT.VXD driver. “VFAT” is thus sometimes thus shorthand for FAT with “Windows
    style long filenames”. It can be applied to all variants of FAT, such as FAT16
    and FAT32.<p>FAT32 is a variant of FAT introduced in the mid 90s with Windows
    95 OSR2 that better supports large hard drives (beyond size limits, cluster sizes
    were getting too large on FAT16 drives etc.).
