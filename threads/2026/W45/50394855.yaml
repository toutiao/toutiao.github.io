  author: JdeBP
  text: 'Not really, no.  Linux regards various ways of looking at the same on-disc
    filesystem format as distinct filesystem types: msdos, umsdos, vfat.  Old Microsoft
    doco from the 1990s that is still lying around explains things in the way that
    they historically progressed rather than structurally, describing VFAT as an extension
    of FAT32.<p>The reality, certainly in respect of the headlined subject, is that
    the bitness of the FAT and the style of the root directory (fixed location or
    variable length) are the only meaningful variants.  In 2026, no-one aims <i>not</i>
    to support long filenames on FAT, and EFI understands them natively.  EFI copes
    with all three bitnesses.  And it does the conventional thing of variable length
    root directory on 32-bit and fixed-length root directory on 16-bit and 12-bit.<p>FAT
    is a very poor filesystem format, and no, it&#x27;s not a minimum filesystem format
    if one is writing one&#x27;s own operating system.  It&#x27;s a <i>lazy</i> filesystem
    format, inasmuch as the cross-development tooling for it exists.  But if one were
    writing a <i>minimum</i> filesystem for one&#x27;s own operating system, one could
    start from much better places.  FAT is not minimal by any reasonable definition
    even if one is not writing one&#x27;s own operating system, and requires an awful
    lot of hoops to be jumped through that are only there <i>because</i> one is being
    compatible with the cross-development tooling, several decades of historical changes,
