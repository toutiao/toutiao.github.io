  author: ranger207
  text: BIOS was always heavily tied to x86 PCs, as it was a de facto standard in
    the first place by the fact that it was reverse engineered from the IBM PC. Of
    course, PC-compatible firmwares were never required for x86 PCs, but it made it
    convenient in the era when people would bring their own OS. When ARM started becoming
    popular, it was generally in embedded applications where the manufacturer was
    going to produce a single firmware to do a single task. It&#x27;s only lately,
    since UEFI became the standard on x86-type computers, that anyone&#x27;s bothered
    making a general-purpose enough ARM device where you might want to bring your
    own OS and that UEFI has been something that would be useful there
  score: 0
