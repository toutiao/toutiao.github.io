  author: kragen
  text: '(Although this comment discusses an AI-written project, the comment itself
    is entirely human-written.)<p>It&#x27;s probably worth pointing out that, unless
    you&#x27;re writing a replacement for GRUB, Multiboot2 is a reasonable alternative
    to building a UEFI PE32+ image, and it permits you to still call UEFI services:
    <a href="https:&#x2F;&#x2F;www.gnu.org&#x2F;software&#x2F;grub&#x2F;manual&#x2F;multiboot2&#x2F;multiboot.html"
    rel="nofollow">https:&#x2F;&#x2F;www.gnu.org&#x2F;software&#x2F;grub&#x2F;manual&#x2F;multiboot2&#x2F;multiboo...</a>
    <a href="https:&#x2F;&#x2F;wiki.osdev.org&#x2F;Multiboot" rel="nofollow">https:&#x2F;&#x2F;wiki.osdev.org&#x2F;Multiboot</a><p>I
    was pleased last week that I could elicit enough of a UEFI environment from Opus
    5.5 to be able to build an UEFI application without enormous, un-auditable dependencies
    like gnu-efi.  Claude distilled the relevant parts of the UEFI interface into
    a 289-line header file.  The example application just displays the keyboard and
    mouse events on a UEFI framebuffer using a vendored pixel font, thus the name
    &quot;inputmon&quot;: <a href="http:&#x2F;&#x2F;canonical.org&#x2F;~kragen&#x2F;sw&#x2F;inputmon-3.tar.gz"
    rel="nofollow">http:&#x2F;&#x2F;canonical.org&#x2F;~kragen&#x2F;sw&#x2F;inputmon-3.tar.gz</a><p>The
    Makefile includes a &quot;run&quot; target to boot it under QEMU with the OVMF
    implementation of UEFI.<p>(One fairly surprising feature of all this is that,
    not counting the time Claude was waiting for me, it took the model a total of
    about 7 minutes to write and test this.  These 7 minutes were spread over almost
    15 hours because I ran out of tokens and spent time thinking.  This might be a
    good example of a case where an LLM is literally a million times more productive
    than a human programmer: the task is algorithmically trivial, and it doesn&#x27;t
    involve difficult engineering tradeoffs, but involves deep knowledge of a pile
    of obfuscated recondite interfaces that are publicly documented and widely used
    by published open-source software.  It is something I&#x27;ve <i>wanted</i> to
    do for 7 million minutes.)<p>I&#x27;m hoping I can get an in-browser demo of inputmon
    working next week, but that&#x27;s probably going to involve doing some surgery
    on Bochs in order to get an amd64-compatible virtual machine that doesn&#x27;t
    require multithreading the way QEMU does.<p>Inputmon <i>does</i> have the enormous,
    un-auditable dependency of LLVM and Clang, but that&#x27;s a horror I&#x27;m already
    resigned to.  But with clang, lld, and make, you can build the image from source,
    and with QEMU and OVMF you can run it in a virtual machine.<p>I think it&#x27;s
    a little bit debatable to call UEFI &quot;bare metal&quot; (Boone responds: &quot;this
    is a fair criticism&quot;), and I&#x27;m particularly skeptical of Boone&#x27;s
    claim that you can guarantee microsecond response times in the face of SMM, but
    whatever.'
