  author: russelldjimmy
  text: Not to dismiss your assertion, but here’s another way of looking at it:<p>Keyboard
    swiping involves some prediction work from the system. It is ultimately making
    a best guess from the keys your finger has passed through. The only truly “accurate”
    output would be for the keyboard to spell out the gibberish that arises from showing
    every key that the finger has swiped over. Anything intelligible is a guess.<p>Now
    because it is a guess, some may question the system or its makers, “Why did you
    guess this, and not that?” It is easy to see how this can make the maker of the
    system the target of a politically motivated group. For example, there is a difference
    between typing out “Dictator Trump” and my keyboard refusing to spell it out -
    a clear sign of censorship. However, when swiped, because of the guessing nature
    of the technology, I can understand that the maker of the system (Apple in this
    case) would not want to be seen endorsing these views. Hence, they do not offer
    up these politically charged phrases. We are free to type them out, because it
    is easy to point out that the intent is entirely from the user. However, it is
    harder to argue for this from the swiping keys gesture.<p>In my view, this is
    a more reasonable explanation.
