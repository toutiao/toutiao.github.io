  author: crazygringo
  text: This seems entirely reasonable to me. And to people complaining that this
    is censorship, it is absolutely <i>not</i>. You can still type these words just
    fine, it&#x27;s just not going to interpret swipes that are inherently probabilistic
    and often ambiguous as potentially risky terms.<p>This seems like a <i>feature</i>,
    because I swipe all the time and send messages without realizing I got a word
    wrong, especially because the word it chooses is usually with the same first letter
    and approximately same length.<p>All this is doing is avoiding high-risk words
    and terms, and making you type them out letter by letter to ensure you aren&#x27;t
    sending an accidentally sexual&#x2F;swear&#x2F;political message to your Mom&#x2F;boss&#x2F;colleague.<p>This
    would be problematic and censorship if it were preventing you from typing the
    phrases at all. It&#x27;s clearly a helpful feature, however, to prevent you from
    accidentally typing risky phrases when using something as error-prone as swipe
    typing.
  score: 0
