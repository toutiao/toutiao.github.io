  author: Aurornis
  text: 'Interesting that you remember the story existing but got the details incorrect
    and forgot the real problems in the article.<p>The bigger revelations in the story
    were that the “Huberman Lab” existed largely in name only and he wasn&#x27;t living
    or working near the University. His career had pivoted to influencer celebrity
    long ago but he’s been capitalizing on the neuroscientist title and claiming lab
    associations anyway.  They also interviewed associates who revealed his history
    of leading people on, manipulating them, and being dishonest wherever it might
    help his career. Then they found that he was cheating on multiple women at the
    same time, including someone he led to believe he wanted a long term relationship
    and children with. He was injecting one partner with fertility drugs while cheating.<p>What’s
    fascinating is how his fanbase stripped the story of all of the important details
    (chronic pattern of misleading everyone in his life where it can help his popularity,
    which extends into his podcast reporting where he misleads listeners) and instead
    tried to transform it into personal dating drama that was overblown.<p>Then the
    second pass of rationalizing it away was to take the relationship drama and transform
    that into something that could be blamed on the women involved while letting Huberman
    off the hook. After that final transformation they were free to ignore anything
    negative about him because the story had been rewritten, in the retelling, to
    be completely the fault of women. There were even efforts to make it look like
    a good thing that he was dating multiple women.<p>In case it wasn’t clear: In
    the reporting the women did not “continue to choose to date him” as you heard.
    The reported group discussion was about former partners had been lied to who were
    discovering each other because the number of them had grown so high that he couldn’t
    escape it.'
