  author: perrygeo
  text: Great advice for negative things. Pay them no attention, after you&#x27;ve
    processed them (don&#x27;t ignore them though!).<p>For positive things, for future
    hope and dreams, one has to be careful. We know that visualizing a positive outcome
    can be counter-productive...<p>Those who daydream about the perfect fitness routine
    don&#x27;t go to the gym.<p>Those who daydream about building anything are less
    likely to take the step necessary to actually build it.<p>It&#x27;s as though
    strong visualization of a positive outcome becomes a satiating reward in itself.
    Without any changes to reality, we become attached to the mere idea of possible
    future. Just as those dwelling on the past are dissociating from reality, those
    hoping for the future are willfully disengaging engaging with primary reality.<p>All
    that is to say, it IS all about attention. So pay attention to the present.
  score: 0
