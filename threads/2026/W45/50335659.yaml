  text: '&gt; Basically the idea is that your brain has a hard time telling the difference
    between the fantasy and reality<p>When it&#x27;s &quot;fantasy&quot; the experience
    of reward &quot;sucks out the energy and drive&quot;.<p>I&#x27;m referring to
    there being a difference between fantasy&#x2F;daydream and <i>mental visualization
    as the deliberate construction of detailed mental imagery of a desired performance
    or outcome</i> [0] When you do it while lost in fantasy it&#x27;s not deliberate,
    but when it&#x27;s an intentional process it becomes beneficial.<p>The brain having
    a hard time telling the difference between real and imagined is neutral, the how
    and intention behind that imagined activation tells if the outcome is positive
    or depleting<p>[0] <a href="https:&#x2F;&#x2F;www.simplypsychology.com&#x2F;articles&#x2F;visualization-techniques-psychology"
