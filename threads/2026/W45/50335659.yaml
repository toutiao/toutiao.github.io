  author: kwbr3000
  text: From <a href="https:&#x2F;&#x2F;www.pushkin.fm&#x2F;podcasts&#x2F;the-happiness-lab-with-dr-laurie-santos&#x2F;dont-accentuate-the-positive"
    rel="nofollow">https:&#x2F;&#x2F;www.pushkin.fm&#x2F;podcasts&#x2F;the-happiness-lab-with-dr-la...</a><p>Basically
    the idea is that your brain has a hard time telling the difference between the
    fantasy and reality and so you experience the reward which then sucks out the
    energy and drive needed to actually do the hard work.
