  text: Maybe it worked better than trying to address it, but Huberman’s popularity
    definitely fell off after it was revealed that he was not a great person.<p>During
    the peak of his popularity you would find Huberman protocols or Huberman factoids
    repeated everywhere on the internet, including HN. There was a sharp drop off
    after the revelations. I can’t recall the last time I saw someone someone repeat
    a Huberman podcast factoid here, which is remarkable after he was so popular.<p>In
    the Huberman case it was compounded by how much he was embracing and repeating
    non-scientific ideas that sounded good on social media, like reducing everything
    to being about dopamine or making crazy claims about how you could do things to
    “raise your dopamine” that were not actually supported by research. When his personal
    dramas were exposed it became an opening to discuss how bad his podcast had become
    and I think many listeners woke up to that fact when shaken by the realization
    that not everything about Huberman was as it seemed.<p>He has been able to continue
    podcasting to an audience of die-hard fans, though. These people never totally
    disappear because a core audience worships them and will ignore everything inconvenient
    to their worship.<p>Peter Attia went through a similar downfall after several
    increasingly bad scandals were revealed, culminating in him getting caught associating
    deeply with Epstein. He tried to make a public statement about distancing himself
    from Epstein after discovering Epstein’s crimes, but there are public emails between
    Attia and Epstein where Attia asks Epstein about how he’s doing after Epstein
    became national news. That backfired everywhere except the core audience of Attia
    worshippers who now just get angry whenever anyone brings up the Attia-Epstein
    connection. It’s wild that Attia was one of the few Epstein associates who continued
    contacting Epstein so much (which went into court records and became public) after
    he became publicly known as a trafficker. And yet there are hardcore Attia fans
    to this day.
