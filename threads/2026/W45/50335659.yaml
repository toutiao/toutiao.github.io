    As an American, we don&#x27;t like kings and queens because they are always monsters. Just as the very recent attempt to make a king has illustrated. And frankly, the wiki article even downplays Diana.<p>The problem is they are explicitly saying to do things in the shadows.<p><pre><code>  | Above all things our royalty is to be reverenced, and if you begin to poke about it you cannot reverence it... Its mystery is its life. We must not let in daylight upon magic
    </code></pre>
    Without that daylight you can&#x27;t differentiate monsters from men. They claim it&#x27;s because you can&#x27;t differentiate saints from men, but I&#x27;d make the claim that any man who wishes to be seen as a saint is more monster than saint.<p>And we&#x27;ve seen what these people do in the shadows. The disgraced Andrew was far from the only Royal in the Epstein files. We saw what they did to Diana, who tried to shed some light. We&#x27;ve seen it over and over.<p>I&#x27;ll take the light, because I&#x27;d rather live in a world where we make things better than live in a world with the appearance of magic. The only magic is what we create
