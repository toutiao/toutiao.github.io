  author: jeroenhd
  text: DNSSEC as designed is pretty useless. It was designed in an era where computers
    could not be relied upon to do cryptographic validation of something like DNS
    records, so that duty was delegated to DNS servers like the ones ISPs ran, where
    records could be cached.<p>There are also potential downsides (like someone being
    able to enumerate your subdomains, if you care about such a thing) and it&#x27;s
    often switched off by default on operating systems consumers use.<p>However, it&#x27;s
    the only thing that validates DNS records at this moment. That alone makes it
    worth enabling, in my opinion. For many domain owners, you only need to tick the
    checkbox in your registrar&#x27;s domain control pane. If you use a modern DNS
    server, it&#x27;s also one config flag and maybe copy&#x2F;pasting a handful of
    fields away.<p>I&#x27;ll gladly turn off DNSSEC the moment we come up with something
    better. DoT&#x2F;DoH doesn&#x27;t solve the same problem and no real solutions
    seem to have been proposed. That said, modernisation efforts are still being done.
    Smaller keys and modern cryptography rather than the massive RSA ones for instance.
  score: 0
