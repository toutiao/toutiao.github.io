  author: dspillett
  text: Not if they are only using it to route the DNS traffic (though in that case
    a cheaper VPS might be better), which will work if the ISP is only poisoning DNS
    replies and not (which is often the case) blocking traffic to the target servers
    entirely.<p>The problem with this is you are adding a moving part to your DNS
    lookups. It might be worth adding two on separate VPS hosts and have your resolver
    fall back to the second if the first goes down.<p>Another, usually more minor,
    problem is that some services (like CDNs) use the source of your DNS query to
    modify the response so you get sent to a topologically near-by end-point. This
    means you might notice such services being slower as you are sent to a PoP near
    your VPN host not one closer to your actual location.
