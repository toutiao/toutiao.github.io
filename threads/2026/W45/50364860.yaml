  author: j45
  text: For sure, I read the article.<p>Introducing what ISPs do with DNS information
    is helpful to understand how encompassing DNS self-hosting needs to be thought
    about - DNS requests are important to consider the appropriate encryption for.<p>From
    the homelab side, increasingly with the automated attacks on systems, it seems
