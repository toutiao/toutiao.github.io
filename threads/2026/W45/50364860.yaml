  text: "Automatic Certificate Management Environment (ACME), RFC 8555, recommends
    certificate issuers use DNSSEC when using DNS to validate control of the DNS zone:<p><pre><code>
    \ As noted above, DNS forgery attacks against the ACME server can\n  result in
    the server making incorrect decisions about domain control\n  and thus mis-issuing
    certificates.  Servers SHOULD perform DNS\n  queries over TCP, which provides
    better resistance to some forgery\n  attacks than DNS over UDP.\n    \n    An
    ACME-based CA will often need to make DNS queries, e.g., to [1]\n  validate control
    of DNS names.  Because the security of such\n  validations ultimately depends
    on the authenticity of DNS data, every\n  possible precaution should be taken
    to secure DNS queries done by the\n  CA. Therefore, it is RECOMMENDED that ACME-based
    CAs make all DNS\n  queries via DNSSEC-validating stub or recursive resolvers.
    \ This\n  provides additional protection to domains that choose to make use of\n
    \ DNSSEC.\n  \n  An ACME-based CA must only use a resolver if it trusts the resolver\n
    \ and every component of the network route by which it is accessed.\n  Therefore,
    it is RECOMMENDED that ACME-based CAs operate their own\n  DNSSEC-validating resolvers
    within their trusted network and use\n  these resolvers both for CAA record lookups
    and all record lookups in\n  furtherance of a challenge scheme (A, AAAA, TXT,
    etc.).\n  \n  \n</code></pre>\n[1]: <a href=\"https:&#x2F;&#x2F;www.rfc-editor.org&#x2F;info&#x2F;rfc8555&#x2F;#section-11.2\"
