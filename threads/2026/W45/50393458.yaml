  author: zemoerfi
  text: It&#x27;s important to remember that the natural GLP 1 you produce is a very
    very different molecule than GLP 1 agonists. The body uses natural GLP 1 in minutes.
    These drugs attach a very complex molecule to the GLP 1 site, allowing it to stay
    active there for hours.<p>So while your body produces it in a few places, the
    product gets used up almost immediately.
  score: 0
