  parent_id: '50399352'
  author: zemoerfi
  text: Natural GLP 1 is an extremely different molecule to these drugs. Natural GLP
    1 gets used in minutes. It&#x27;s like a house key. It fits in the lock, and it&#x27;s
    easy to remove.<p>These GLP 1 drugs are huge molecules with a GLP 1 shaped key
    on them. It&#x27;s like a house key attached to a school bus. Once it&#x27;s in
    your lock, that key is going to be a pain to remove.<p>Stimulating natural GLP
    1 helps for a few minutes. Using these drugs can help for a week.
