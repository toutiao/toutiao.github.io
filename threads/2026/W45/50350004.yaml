  author: jacquesm
  text: 'Yes, that&#x27;s a good point: you really need to work on the prompts, even
    if the harness is the same. Ambiguity is a real problem as is what we call &#x27;the
    negative space&#x27;, what isn&#x27;t in the prompt but what is implied by the
    prompt to be undesirable. You need to spell that out in more detail it is not
    enough just to say &#x27;do x&#x27; but you also need to make sure to say &#x27;and
    not y or z&#x27;, and knowing what y or z are requires a bit more insight into
    what hobby horses are encoded in a model.<p>To give one example: I&#x27;m doing
    a lot of stuff that involves hardware. When settings things up for fixing a bug
    I have to make sure to include that the hardware has been tested and works well.
    If I don&#x27;t do that the model will almost certainly spend a ridiculous amount
    of time speculating about all the different ways in which the hardware could be
    broken (including theorizing about chip mask errors and all kinds of other obscure
    and rarely seen in practice defects). It&#x27;s going to end up telling itself
    that <i>for sure</i> the 500 lines it just produced are absolutely perfect and
    the device that is on the i2c bus is broken in a way that it just really can&#x27;t
    progress with solving the issue <i>because there is nothing wrong with the code</i>.<p>These
    kinds of blind-spots are funny when they happen once in a month but when they
    happen regularly it begins to be irritating. Adding a line or two to the prompt
    will take care of the issue. Frontier models tend to be better at this sort of
    thing.'
  score: 0
