  title: Basically no one is using AI agents for their DoorDash orders - Ars Technica
  fetch_status: success
  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nAs
    AI tools and agents have continued their march across all aspects of digital life,
    [many companies](https://arstechnica.com/google/2025/11/google-rolling-out-conversational-shopping-and-ads-in-ai-mode-search/)
    are [trying to use LLMs](https://arstechnica.com/ai/2025/04/chatgpt-goes-shopping-with-new-product-browsing-feature/)
    to [improve the experience](https://arstechnica.com/google/2026/01/google-begins-rolling-out-chromes-auto-browse-ai-agent-today/)
    of [purchasing goods and services](https://arstechnica.com/information-technology/2024/04/ai-hype-invades-taco-bell-and-pizza-hut/)
    on the Internet. Thus far, though, a vanishingly small number of people seem to
    be taking advantage of those capabilities, at least when it comes to using the
    popular food delivery app DoorDash with an outside AI agent.\n\nIn [a third-quarter
    earnings call Thursday](https://www.fool.com/earnings/call-transcripts/2026/10/29/doordash-dash-q3-2026-earnings-call-transcript/),
    DoorDash co-founder and CEO Tony Xu responded to an analyst question by noting
    that “AI agents are generating several hundred orders [on DoorDash] across the
    time that they’ve been up and running.” In a marked understatement, Xu called
    this a “very low use case” for a company that handled just shy of 1 billion orders
    total in the third quarter of 2026 alone.\n\nSpeaking generally, Xu said he sees
    the potential for AI agents to be genuinely helpful for “long consideration purchases”
    and major decisions where agents would be “doing work on your behalf proactively
    in the background.” However, Xu added, “when it comes to a task that’s as simple
    as ordering food, we tend to see that come directly to DoorDash.”\n\n## Give it
    time?\n\nTo be fair to the AI boosters, DoorDash only rolled out its Model Context
    Protocol (MCP) connector [less than a month ago](https://about.doordash.com/en-us/news/doordash-ordering-connector).
    The connector provides a standardized, open-standard way for third-party AI tools
    to easily order through DoorDash’s platform. Without that kind of linkup—which
    is still only available to a small number of “early beta partners” and mainly
    used to streamline corporate lunch orders—AI agents have to go through a bit more
    effort to access DoorDash through a web interface, for instance.\n\nXu’s discussion
    of “third-party agent” orders also doesn’t include DoorDash’s own internal AI
    tools. Those include an “Ask DoorDash” feature the company [rolled out this summer](https://about.doordash.com/en-us/news/ask-doordash)
    that can, for instance, create an online shopping cart from a photograph of a
    recipe or suggest an order based on a vague description like “dinner for a family
    of four.”\n\nDoorDash hasn’t shared detailed statistics on that kind of usage,
    but the company [said last month](https://about.doordash.com/en-us/news/text-doordash)
    that Ask DoorDash baskets get built “five times faster” than those built without,
    and Ask DoorDash orders “average nearly 50% higher basket value and about 60%
    more unique items than the same consumers’ traditional orders.” The company also
    said nearly half of Ask DoorDash orders end up at “local spots the consumer has
    never tried before,” helping with discovery of new area restaurants.\n\nThat’s
    all to say that DoorDash’s current experience with agentic ordering may be a bit
    like [Pizza Hut’s first tentative online ordering experiments in 1994](https://www.foodandwine.com/pizza-net-delivery-history-11771677).
    Back then, it would have been hard to picture today’s world, where more than half
    of Pizza Hut orders are placed online.\n\nMaybe ordering food and other goods
    using AI agents will be just as commonplace years from now, and we’ll look back
    at these early statistics with bemusement. For now, though, Xu at least seems
    relatively cool on the early numbers.\n\n“My take on all things technology is
    you never want to fight gravity,” he said regarding AI agents. “But at the same
    time, you don’t want to be delusional.”\n\n[![Photo of Kyle Orland](https://cdn.arstechnica.net/wp-content/uploads/2016/05/k.orland-13.jpg)](https://arstechnica.com/author/kyle-orland/)\n[Kyle
    Orland](https://arstechnica.com/author/kyle-orland/)Senior Gaming Editor\n\n[Kyle
    Orland](https://arstechnica.com/author/kyle-orland/)Senior Gaming Editor\n\n Kyle
    Orland has been the Senior Gaming Editor at Ars Technica since 2012, writing primarily
    about the business, tech, and culture behind video games. He has journalism and
    computer science degrees from University of Maryland. He once [wrote a whole book
    about _Minesweeper_](https://bossfightbooks.com/collections/books/products/minesweeper-by-kyle-orland).
