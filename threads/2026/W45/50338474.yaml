  text: 'It&#x27;s being sold everywhere to people fed up with dealing with other
    people who waste their time. Because that really IS a problem.<p>Most (Note: Not
    all!) questions you get when you work in a &quot;customer service&quot; role come
    from lazy, unobservant, or dumb people. So pre-AI, a large business needs an army
    of people to answer the phone and do things like walking confused people through,
    step-by-step, how to reset their password. &quot;Did you check your email? Did
    you check the Spam folder? Did you give it 5-10 minutes?&quot;<p>So AI is sold
    with the promise that you can just put it in front of your human agents, and then
    you&#x27;ll only need 1&#x2F;5 the staff (let&#x27;s set aside the unfortunate
    economic implications for the other 80%) because most people&#x27;s questions
    are stupid and trivial to solve.<p>Problem is, the dummies can&#x27;t identify
    and divert themselves to the bot up front, so the person who loses most (other
    than the CS agents who lost their jobs) is people like you or me, who only contact
    customer service when we are reasonably sure there is no way to solve our own
    problem on the website&#x2F;the app&#x2F;by ourselves. We have to argue with a
    bot which is prompted &quot;You&#x27;re about to hear from a dummy whose main
    problem is most likely that he hasn&#x27;t read any of our ZenDesk support articles,
    can&#x27;t operate our website or a computer properly... and he probably has an
    IQ of 75. Send him answers from the FAQ -- <i>repeatedly if needed</i> -- and
    try to get him to go away. Don&#x27;t give up, and don&#x27;t escalate to an agent
    unless very specific criteria are met.&quot;'
