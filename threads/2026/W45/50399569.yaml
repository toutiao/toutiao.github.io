article:
  url: https://community.openai.com/t/security-follow-up-tool-call-silently-routed-to-a-different-connector/1413053
  title: 'Security: Follow-up tool call silently routed to a different connector -
    ChatGPT Apps SDK - OpenAI Developer Community'
  fetch_status: success
  content: "# [Security: Follow-up tool call silently routed to a different connector](/t/security-follow-up-tool-call-silently-routed-to-a-different-connector/1413053)\n\n[ChatGPT
    Apps SDK](/c/chatgpt-apps-sdk/42)\n\n[AldiPower](https://community.openai.com/u/AldiPower)1\n\nIn
    a conversation with two connectors enabled, ChatGPT made a follow-up tool call
    through a different connector than the one that started the flow. The user was
    not told about the switch. The call carried a one-time confirmation code from
    the first connector’s widget.\n\n**Setup**\n\n- One ChatGPT account with two connectors
    enabled that point to the same MCP server.\n\n- Connector A is a custom connector
    added in developer mode.\n\n- Connector B is the published app from the app directory.\n\n-
    Each connector has its own OAuth client, so the server sees two separate clients
    for the same user.\n\n**Steps**\n\n1. In a conversation with both connectors enabled,
    ask for an action that needs the user’s confirmation.\n\n2. The model calls a
    confirmation tool through connector A. Its MCP Apps widget shows the change. The
    user confirms, and the widget sends a one-time confirmation code to the conversation
    via ui/message.\n\n3. The model makes the follow-up call with that code, but silently
    through connector B instead of connector A.\n\n**Result**\n\nThe server rejects
    the call, because the code is bound to connector A’s OAuth client. Every attempt
    in that conversation failed. In the attempt we logged in detail, the code was
    confirmed through connector A and redeemed through connector B. Nothing told the
    user that the follow-up call went to another connector.\n\nWhy this is a problem?\n\nThe
    user starts the flow with connector A and confirms in connector A’s widget. The
    follow-up call then goes to connector B without the user knowing, and it carries
    a value produced in connector A’s widget. Connectors are separate apps with separate
    OAuth grants, so this silent switch passes data from one app to another without
    the user’s consent.\n\nHere both connectors came from the same provider, so our
    server-side binding stopped the call. With a third-party connector enabled in
    the same conversation, we expect the same silent switch to pass one app’s data
    to another provider if the server URL is shared.  \nA shared MCP URL is not enough
    to treat two connectors as one. Behind the same URL, a server can act for different
    parties depending on the OAuth client, for example separate tenants, partners
    or environments. The boundary is the connector with its own OAuth client, not
    the URL.\n\n**Expected behavior**\n\nTool calls are matched to a connector by
    its OAuth client, not by the MCP server URL. A follow-up call goes through the
    same connector and OAuth client that started the flow.\n\n[techsoft.ye](https://community.openai.com/u/techsoft.ye)2\n\nHi
    AldiPower,\n\nThank you for documenting this so clearly. I think you’ve identified
    an important distinction between **tool selection and authorization continuity**
    that deserves attention.\n\nWhat makes this case particularly interesting is that
    the server-side protection appears to have worked: the confirmation code was bound
    to Connector A’s OAuth client, so the attempt to redeem it through Connector B
    was rejected.\n\nHowever, that rejection does not eliminate the underlying concern.
    The follow-up call was apparently routed through a different connector without
    informing the user.\n\nI believe this points to a broader architectural requirement:\n\n**A
    multi-step tool workflow should preserve the identity of the connector and its
    authorization context throughout the operation, rather than relying solely on
    the MCP endpoint or tool name.**\n\nA robust approach could include:\n\n1. Binding
    pending operations and confirmations to the originating connector and its verified
    OAuth grant.\n\n2. Preventing automatic connector switching during confirmation
    or execution.\n\n3. Requiring explicit user approval if changing the connector
    becomes necessary.\n\n4. Validating short-lived confirmation codes against the
    intended operation, client identity, and authorization context on the server.\n\n5.
    Recording connector-routing decisions in diagnostic traces, without exposing credentials
    or sensitive confirmation values.\n\nYour example also highlights an important
    separation of responsibilities: the MCP server must enforce authorization, but
    the client-side orchestration layer should preserve the connector selected for
    the workflow.\n\nOne question that could help narrow down the root cause:\n\n**Do
    your traces indicate whether the connector identity changed during confirmation
    handling or only when the model selected the follow-up tool call?**\n\nSince this
    may involve an authorization boundary, I would also encourage submitting the technical
    evidence through OpenAI’s coordinated vulnerability disclosure process, rather
    than relying solely on a public discussion.  \nreview this for more info  \nRelevant
    documentation:\n\n- [OpenAI — MCP Authentication](https://developers.openai.com/plugins/build/auth)\n\n-
    [OpenAI — Coordinated Vulnerability Disclosure](https://openai.com/policies/coordinated-vulnerability-disclosure-policy/)\n\nThanks
    again for sharing a concrete, reproducible case. This is exactly the kind of boundary
    that deserves careful investigation.\n\n[AldiPower](https://community.openai.com/u/AldiPower)3\n\nHi,\n\nI
    tried to disclose this via their bug bounty program.\n\nBut they require to give
    my personal data like biometric identification and ID card up front even to another
    party I do nothing about, before I can submit the report. This is nothing I am
    willing to do.\n\n### Related topics \n\n| Topic | | Replies | Views | Activity
    |\n| --- | --- | --- | --- | --- |\n| [Widget follow-up prompts fail to trigger
    connector tools](https://community.openai.com/t/widget-follow-up-prompts-fail-to-trigger-connector-tools/1388910)\n[ChatGPT
    Apps SDK](/c/chatgpt-apps-sdk/42)\n[chatgpt](https://community.openai.com/tag/chatgpt/16)
    ,&nbsp; [plugin-development](https://community.openai.com/tag/plugin-development/20)
    ,&nbsp; [bug](https://community.openai.com/tag/bug/31) ,&nbsp; [chatgpt-plugin](https://community.openai.com/tag/chatgpt-plugin/50)
