  author: roadside_picnic
  text: "&gt; resetting their trustworthiness score<p>But this is not how actual FICO
    scores work, and more interestingly, also not how historically Google has assigned
    domain authority for PageRank.<p>In both cases a <i>history</i> of transactions
    is required. Even if you could just spin up a new ID for a FICO score, having
    zero or little credit history typically means you&#x27;ll have a very hard time
    securing any meaningful loans. Likewise, in the days when PageRank mattered a
    new domain would typically take a <i>year</i> to build up the authority required
    to get good results ranking well. Of course there were work around, but there
    are plenty of examples where easy to create a new identity does not equate starting
    with a fresh reputation (in fact even HN has the same principle! New accounts
    cannot, for example, downvote)"
