  text: I use an adblocker and simply don&#x27;t see the overwhelming majority of
    these fraudulent ads.  (You should too!)  I&#x27;ve installed ad blockers for
    anyone in my family who might be vulnerable to these scams.  (You should too!)  I
    won&#x27;t consider changing this recommendation until Google and other ad servers
    start caring enough to filter out scam ads.<p>However, I still get a lot of fraudulent
    phone calls and most people I know do too.  It used to be the case that you could
    spot a fraudulent call <i>instantly</i>.  Most of them came from Indian call centres
    from people with thick accents.  Those accents can now be eliminated with AI[1].  Robocallers
    have also, of course, embraced AI and are rapidly becoming more and more sophisticated.  I
    worry that, soon, some of the more vulnerable people I know will be unable to
    spot these for what they are.<p>As cheap as an Indian call centre is, AI promises
    to let scammers canvas a much broader slice of the population for marks and exploit
    them at a fraction of their current costs.  It would be nice to see at least <i>some</i>
    effort from the AI giants go into helping telcos spot and block fraudulent AI
    callbots.<p>_____________<p>[1]<a href="https:&#x2F;&#x2F;www.techspot.com&#x2F;news&#x2F;106983-new-ai-voice-technology-alters-accents-indian-call.html"
