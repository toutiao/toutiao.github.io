  author: mirashii
  text: Back in 2013, I worked at a top-100 traffic website where we ran a few ads
    through Google. We&#x27;d regularly have blantant scams being advertised, and
    we&#x27;d report them, block the advertiser, and the next day they&#x27;d be back
    with bit for bit identical images under a new advertiser profile. Even back then,
    our Google reps were basically like &quot;we can&#x27;t do anything about it&quot;,
    which is clear bullshit, they just wouldn&#x27;t and still won&#x27;t as it might
    cut into their profits, and their recommendation was that we put a human on staff
    to review ads run on our platform daily and continue to ban the problematic ones.<p>Google
    and all the tech companies need to be held to account for this shit. Facebook
    in 2024 estimated as much as 10% of their revenue, $16 billion, would come from
    scams and ads that should be banned on their platform, and everyone suffers for
    it. I call bullshit on the notion that they can&#x27;t afford to do better because
    scale. Spend some of those billions of dollars on human review. Spend some of
    those billions of dollars remunerating the people who get scammed through your
    platform. If you can&#x27;t afford to keep running your advertising business after
    that, then it gets shut down, there&#x27;s no inherent right to the monopoly on
    advertising that Google has had for over a decade.<p>Stop making excuses for companies
    worth trillions of dollars.
