  author: ajb
  text: 'Clean-room reverse engineering involves two teams: one with access to the
    thing being reverse engineered, who write documentation of it, and the one in
    the clean room who do the implementation based only on the documentation. There&#x27;s
    no reason you could not use AI for the first part, as the documentation is then
    evidence that you are only looking at behaviour and not source code.<p>Using it
    inside the clean room is more of an issue.'
