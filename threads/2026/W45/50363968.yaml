  author: kube-system
  text: "&gt; It seems the jury is out on whether or not LLM outputs are considered
    “new” or not legally speaking.<p>Not exactly, and that&#x27;s an unhelpful way
    to think about it.  Copyright law, technically speaking, DGAF about whether you
    are using an LLM or not.  Yes, there has been a lot of talk about whether LLM
    outputs qualify for copyright protection.  And the answer isn&#x27;t completely
    straightforward, but the ultimate answer doesn&#x27;t have anything to do with
    LLMs -- the law requires a certain modicum of human creativity to qualify for
    copyright protection.  So the real legal answer is that it depends less on whether
    you are using an LLM and more about how you as a human are using it.  That line
    isn&#x27;t well litigated yet -- but in general, if you want a copyright, you
    need to be ready to explain how human creativity was involved -- that&#x27;s,
    by definition, the only thing copyright protects.<p>BUT, this doesn&#x27;t matter
    at all in this situation, we&#x27;re not questioning the copyright protection
    status of the LLM output, we&#x27;re questioning whether it violates someone else&#x27;s
    IP.<p>The point of clean room reverse engineering is a defense to prove you could
    not have <i>violated</i> IP rights of others (not just copyright, but also trade
    secrets, and patents).  The entire point of the exercise is that the implementation
    team has never seen the original work, so it is impossible for them to have copied
    the expression. They only could have come to it coincidentally by implementing
    the idea in the same way.  This protects you from a copyright lawsuit because
    copyright only protects expression, not ideas.<p>LLMs, are proven to possess the
    capability to reproduce expression: exhibited as overfitting and&#x2F;or memorization.
    \ So, to form the same defense with an LLM, you&#x27;d have to prove that the
    LLM couldn&#x27;t possibly be overfitting or repeating from memory.  And the best
    way to do that is to do it the same way it is done with humans: you need to ensure
    they never saw (i.e. wasn&#x27;t trained on) the subject of the reverse engineering.<p>If
    you don&#x27;t do this, here&#x27;s what happens:<p>You go to court, the plaintiff
    says &quot;look, this code is basically the same as ours!&quot;.  The defense
    says &quot;no, we super duper promise we didn&#x27;t copy it, we just coincidentally
    came up with very close to the same thing&quot;.  They ask &quot;well did your
    developers ever see our code before?&quot;  ...and... &lt;drumroll&gt; the outcome
    depends on that answer.<p>It&#x27;s the exact same situation with an LLM.  If
    it almost exactly produces something that is already copyrighted, the plain simple
    answer is that the model was overfitting or memorizing the training inputs.  You
    need a believable defense to that."
  score: 0
