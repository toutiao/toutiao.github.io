  author: kube-system
  text: A valid patent must meet the enablement standard -- it doesn&#x27;t need to
    be a full implementation, but it should enable a skilled professional reading
    it to reproduce the concept that it is covering.<p>The problem is that many companies
    are able to patent things that are too vague and use them as leverage even if
    they probably shouldn&#x27;t be valid patents.<p>It is a balance, though.  If
    you patent something too specific, e.g. irrelevant implementation details, your
    patent is worthless because anyone could just change the irrelevant parts.
  score: 0
  posted_at: '2026-11-04T17:49:43Z'
- id: '50369153'
  parent_id: '50369063'
  author: LoganDark
  text: "&gt; It is a balance, though. If you patent something too specific, e.g.
    irrelevant implementation details, your patent is worthless because anyone could
    just change the irrelevant parts.<p>Chemical companies love this -- just look
    at the refrigerant racket. Or the medicine racket. Both will wait until their
    current patent expires, then have a new slightly-modified one granted, and get
    the old product regulated out of existence. The end result is that they keep a
    monopoly for effectively life, even though expiring patents are supposed to eventually
    create an open market.<p>This works best in industries where chemicals need to
    be tested and approved before they can be used. Otherwise, one <i>would</i> be
    able to simply change irrelevant implementation details."
