article:
  url: https://www.phoronix.com/news/Synaptics-Blocks-Vino-Driver
  title: Synaptics Appears To Use Legal Threats To Block Open-Source DisplayLink Driver
    - Phoronix
  fetch_status: success
  content: "# Synaptics Appears To Use Legal Threats To Block Open-Source DisplayLink
    Driver\n\nWritten by [Michael Larabel](https://www.michaellarabel.com/) in [Hardware](/linux/Hardware)
    on 4 November 2026 at 06:03 AM EST. [28 Comments](/forums/node/1667942)\n\n ![HARDWARE](/assets/categories/hardware.webp)\nFrom
    earlier in the year you may recall [a new experimental open-source Linux driver
    for modern DisplayLink hardware](https://www.phoronix.com/news/Experimental-Vino-DRM-Driver).
    That \"Vino\" driver for DisplayLink driver was a clean-room reverse-engineered
    DisplayLink driver that was developed in part by AI and written in Rust. Unfortunately,
    that open-source driver has disappeared following legal threats by Synaptics.
    \  \n  \nI hadn't heard anything more on this in-development Rust kernel driver
    in a while until this morning when a Phoronix reader pointed out a troubling post
    on the mailing list that I missed. It appears Synaptics resorted to using their
    legal team to block this independent, community-developed driver on the basis
    of violating their patents.   \n  \nA cease and desist notice was sent to the
    Vino driver developer of this open-source driver. Those curious can find the various
    correspondence via attachments on [this LKML thread](https://lkml.rescloud.iu.edu/hypermail/linux/kernel/2610.1/14966.html).
    \  \n\n![Vino driver removed](//www.phoronix.net/image.php?id=2026&image=no_vino)\n\n
    \ \nThe Vino driver repository on [GitHub](https://github.com/FireBurn/Vino/tree/main)
    is no longer publicly available. So don't look for an open-source, upstream DisplayLink
    driver in Linux anytime soon... The original USB2-era DisplayLink hardware worked
    well on Linux and even had open-source driver support, but looks now like Synaptics
    will ensure that no open-source driver exists for their latest IP around USB graphics.\n\n[28
    Comments](/forums/node/1667942)\n\n[Tweet](https://twitter.com/share)\n\n[AMD
    Ryzen Zen 6 Looks Like It Will Be In Good Shape With Linux 7.4, Laptop Improvements](/news/Linux-7.4-x86-Platform-Driver)\n\n[I3C
