  text: IME, patents are generally not detailed specs of the tech. They&#x27;re intended
    to detail higher level procedures or mechanisms to prevent competitors from introducing
    any kind of similar product that uses any kind of similar algorithm or idea. That&#x27;s
    how patent trolls retain a competitive monopoly over their niche. You can&#x27;t
    expect to reimplement a technology from its patents alone, even if the patent
    can aid in understanding something you have in front of you.
