  author: kmeisthax
  text: "&gt; That &quot;Vino&quot; driver for DisplayLink driver was a clean-room
    reverse-engineered DisplayLink driver that was developed in part by AI and written
    in Rust.<p>It is my strongly-held opinion that, regardless of what you think about
    AI in general, reverse engineering projects ought to stay as far away as possible
    from LLM code gen as possible. They are a very easy and straightforward way for
    a copyright owner to claim access to their code, since basically ALL code was
    trained on. Unless you have hard evidence the particular bit of code you want
    to RE was not in the training set, you should not use an LLM to reverse-engineer
    or rewrite it.<p>This is not a moral argument; as much as I hate AI companies
    playing fast and loose with other people&#x27;s work, the underlying arguments
    that make RE legal work much better if you do not look at the source code. And
    while US judges are straining to keep AI training fair use, that does not make
    the AI a copyright laundering device. A copyright owner can absolutely reach through
    a fair use to get to you. Think of it like if you downloaded 10 different YouTube
    video essays on the same movie and attempted to stitch them together into a normal
    copy of the underlying movie. Obviously, your use has a different (and worse)
    legal status than the reviews do.<p>Also, fuck Synaptics."
