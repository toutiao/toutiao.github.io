  author: GMoromisato
  text: |-
    The lens to use is the Venn diagram of:<p><pre><code>   1. What you like doing
       2. What you are good at doing
       3. What people will pay you to do
    </code></pre>
    For math, if your goal is to prove something that no one else has proven, then all three are under attack.<p>I think the &quot;egoless&quot; path is taking a 50,000-foot view of mathematics that ignores the above lens. Sure, mathematics will survive and even prosper with AI, but what about the mathematicians?<p>In time, the profession of mathematics will evolve so a new task is at the center of the diagram--maybe it will be explaining math results to humans or teaching math to future mathematicians. I don&#x27;t know. But it&#x27;s easy to see that not everyone is going to be happy with the transition, and many will be left behind.<p>For software engineering, it depends on what your center is. If you like &quot;writing code&quot;, then #3 is under attack. But for those whose goal is, &quot;make something work&quot;, all three are still viable and even better than before (or at least faster).<p>That&#x27;s why we see so much disagreement on HN about whether AI is good or bad for software engineering.<p>I&#x27;m sure lots of other people have made this observation before.
