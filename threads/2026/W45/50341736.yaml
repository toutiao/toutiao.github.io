  author: WindyTree
  text: That’s a great paper, I was tripping on these same thoughts last night. The
    thing that rang true was kind of getting back to these roots, the Philo-Sophia
    as love of knowledge, and a community that loves knowledge. It doesn’t matter
    if one guy has a 70 IQ and loves fables, or another is 170 and loves something
    I can’t comprehend, they are one family. I was as also thinking about old school
    ideas of wisdom vs plain intelligence. I had this powerful experience during Covid
    of finding music someone had made from sequencing the DNA of the virus, sitting
    there sick listening to the virus, singing the song of its people. It struck me
    that intelligence isn’t something we have, it’s an attribute of nature that can
    flow through us, something self standing out there. To be able to listen and receive
    it from nature is the root of learning, while to believe that you have intelligence,
    not nature, is the root of stupidity. The awareness was something different from
    anything I had known, I was never smart, I was floating in an ocean of intelligence
    blocking myself off from receiving by believing I was smart. Whoops! It felt like
    true wisdom to realize I was stupid and let it flow through me. That was 2020,
    the seeds of modern AI were planted but I hadn’t seen them, now everybody is grappling
    with intelligence being “out there” as part of physical nature not even people.
    The love of Sophia never dies, but we’re being reminded that it’s a receptive
    relationship we as individuals have with knowledge and humility is the prerequisite,
    with the humility, the lessons can come from birds or rocks or trees, but we have
    to realize they matter and we do.
