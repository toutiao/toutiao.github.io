  author: lnkdinsuxs
  text: Great questions!<p>&gt; The lead that the landscaper in your example is building
    now actually compounds over time, regardless of whether competitors adopt grok
    bot in the future or not?<p>You are conceptually right except that you are conflating
    cost of service with a business relationship.<p>If my business relationship offers
    me the same cost of service for the same service as their lower priced competition
    does, it&#x27;s then not even a thing for me to worry about. They are completely
    financially fungible (plus the value of the business relationship).<p>Assume I
    work with landscaper A while landscaper B is using grokbot to be more efficient.<p>If
    my business relationship with landscaper A is strong, I will happen to mention
    to them what landscaper B is doing and if landscaper A values our relationship,
    they will try their best to do so as well or comp my service accordingly.<p>There
    are other factors like churn, overhead, regulation, licensing etc that I am happy
    to discuss in more detail.<p>Look at the graveyard of ChatGPT wrappers. Same concept.<p>This
    is why a grandparent observed that amortized ROI that depends on a 3rd party service
    becomes 0 - in capitalism, an arbitrage opportunity is competed away.<p>This is
    why companies build their own in-house talent for their core competencies - so
    that their ROI on their core competencies doesn&#x27;t become 0.<p>This is also
    why sama and Dario are trying to regulate OSS models - because those are a direct
    attack to their core competency and if left unchecked would cause headwinds to
    their ROI,
