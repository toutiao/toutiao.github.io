  text: BLE is not insecure if you configure the pairing process to use LE Secure
    Connections with authenticated pairing, which does exactly what you have implemented
    (ECDH key agreement). &quot;Just Works&quot; pairing is the only method vulnerable
    to MITM because it doesn&#x27;t require out-of-band confirmation.
