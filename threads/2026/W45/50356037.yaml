  content: "# ToothPaste\n\n> If only i could copy this really long password to this
    really shady computer, we could achieve world peace. Alas! I’m going to type it
    manually…\n> \n> - Someone defintely\n\n# ![drawing](https://www.toothpasteapp.com/ToothPaste.png)ToothPaste
    V2: Hardware-Backed BLE Clipboard.\n\n ![C++](https://img.shields.io/badge/c++-%2300599C.svg?style=for-the-badge&logo=c%2B%2B&logoColor=white&logoSize=auto)
    ![Espressif](https://img.shields.io/badge/espressif-E7352C.svg?style=for-the-badge&logo=espressif&logoColor=white&logoSize=auto)
    ![BLE](https://img.shields.io/badge/BLE-blue?style=for-the-badge&logo=bluetooth&logoColor=white&logoSize=auto)
    ![JavaScript](https://img.shields.io/badge/javascript-%23323330.svg?style=for-the-badge&logo=javascript&logoColor=%23F7DF1E&logoSize=auto)
    ![React](https://img.shields.io/badge/react-%2320232a.svg?style=for-the-badge&logo=react&logoColor=%2361DAFB&logoSize=auto)\n\n**ToothPaste**
    allows a user to transmit **AES-256** encrypted keyboard and mouse commands to
    any USB-compatible device wirelessly, without the need for specialized drivers
    or extensive set-up using WEB-BLE, a Cryptographic IC and an ESP32-S3.\n\n[Brisk4t/
    **ToothPaste** Secure Wireless Data-Transfer over BLE and USB for Passwords, Pentesting
    and Media Control.TypeScript21218](https://github.com/Brisk4t/ToothPaste)\n\n![ToothPaste
    Website About Page Thumbnail](/_astro/ToothPaste_Cover_V2_Z2kXan.webp)\n\n## Table
    of Contents\n\n- [The Problem ❓](#the-problem-)\n- [Quick Start \U0001F4E6](#quick-start-)\n-
    [Full setup \U0001F6E0️](#full-setup-)\n- [How it works Pt.1 ⭐](#how-it-works-pt1-)\n-
    [How it works Pt. 2 ⭐⭐](#how-it-works-pt-2-)\n- [The Hardware (Deus Ex PCBWay)
    \U0001F50C](#the-hardware-deus-ex-pcbway-)\n- [Security \U0001F511](#security-)\n-
    [More Security \U0001F512](#more-security-)\n- [Then there was AI \U0001F916](#then-there-was-ai-)\n-
    [There’s a lot more…](#theres-a-lot-more)\n\n# The Problem ❓\n\nNOTE\n\nThe core
    idea was to eliminate the need for complicated and lengthy login flows for one-off
    cases where a keyboard would normally be required or is the **only device that
    is supported** (BIOS, air-gapped systems, shady back-alley computers where you
    don’t want to install your password manager etc.).\n\nThis means existing solutions
    like [KDE Connect](https://github.com/KDE/kdeconnect-kde) are non-starters since,
    at the very least, they require both devices to run a compatible operating system
    and allow installing third-party software.\n\nThe obvious answer then, is to use
    an interface system that is universally supported - USB. Specifically the USB
    **Human Interface Device (HID)** standard. Almost every USB-host compatible device
    supports using a keyboard as means of controlling it and, because this is presumed
    to be a direct extension of a user, it is implicitly trusted (_keyboards don’t
    have passwords because how would you enter the password_ \U0001F610).\n\nThe [USB
    Rubber Ducky by Hak5](https://hak5.org/products/usb-rubber-ducky?variant=39874478932081)
    used this exact idea to spark a security arms-race to exploit devices, but that
    doesn’t have to be the only reason to use it (but you absolutely still can \\*_wink_\\*).\n\n![Pasting
    Between Devices](/_astro/ToothPasteBare_2hfCB9.webp)\n\n### ToothPaste on a Desktop
    Browser, controlling an iPad\n\n![ToothPasteDemo](/_astro/ToothPasteDemoGif_zMin0.webp)\n\n###
    ToothPaste on a Mobile Browser, controlling a remote Linux Machine\n\n![ToothPasteDemoMobile](/_astro/ToothPasteDemoMobile_bp6v.webp)\n\n#
    Quick Start \U0001F4E6\n\nTIP\n\nThe quickest way to get started is to go to [The
    ToothPaste Webapp](https://www.toothpasteapp.com) and click **Update**. This opens
    a WEB Serial selector and lets you select a connected ESP32-S3 device to flash
    the firmware.\n\nNOTE\n\nThe ToothPaste webapp requires Web-API support which
    is only available on chromium based browsers like Brave, Edge and Chrome. If you’re
    a non-chromium purist I suggest using the desktop app.\n\n#### Alternatively,
    download the latest .bin firmware file from the releases section and flash it
    using [esptool](https://github.com/espressif/esptool) / [espwebtool](https://esptool.spacehuhn.com/)
    or a similar flasher utility.\n\n![Update Prompt](/_astro/UpdatePrompt_ZiUGyR.webp)\n\n`The
    'button' is GPIO0 (often labeled BOOT on ESP32 dev boards)`\n\n# Full setup \U0001F6E0️\n\nIf
    for some reason the easy mode doesn’t end up working (often because i messed up
    the deployment) you can build the entire project from source.\n\nFollow the [ESP-IDF
    (5.5.1^)](https://docs.espressif.com/projects/esp-idf/en/stable/esp32/get-started/index.html)
    install guide and build the contents of the **firmware/** folder.\n\nIf you plan
    on making changes to or creating your own ProtoBuf packets, you will also need:\n\n-
    [The Protoc Compiler](https://protobuf.dev/installation/)\n- [NanoPB](https://github.com/nanopb/nanopb)\n-
    [ProtoBuf JS](https://github.com/protobufjs/protobuf.js)\n\n# How it works Pt.1
    ⭐\n\nI wanted ToothPaste to be quick to use without much prior setup. While having
    a native app would make the experience of quickly switching between local and
    remote commands easy, that’s a future-me problem. The quickest way to do this,
    while still letting it be semi cross-platform, was [**Web BLE**](https://developer.mozilla.org/en-US/docs/Web/API/Web_Bluetooth_API).\n\n###
    What is Web BLE?\n\nIf you’re familiar with projects like [WLED](https://kno.wled.ge/)
    or [VIA](https://usevia.app/) you’ve already interacted with the [Web API](https://developer.mozilla.org/en-US/docs/Web/API),
    this is almost exclusively a chromium-only feature which is why the **ToothPaste
    Webapp** itself doesn’t work on non-chromium browsers like Firefox.\n\nEssentially
    Web BLE allows us to use a system’s Bluetooth hardware inside a browser, eliminating
    the need for custom OS-specific APIs and custom apps to use them.\n\n# How it
    works Pt. 2 ⭐⭐\n\nThe other (and more fun) part of the ToothPaste solution is
    the hardware itself. Since the ESP32-S3 has both USB and BLE (along with a bunch
    of other things we don’t care about) in one package, the hardware just ends up
    being the bare-minimum nedded to run the MCU.\n\nFor most hobbyists, any development
    board will suffice. But considering that we’re transferring some potentially sensitive
    information over a **very** open protocol, ToothPaste V2.0 uses a **Cryptographic
    Coprocessor** to store the credentials required to encrypt and decrypt data.\n\n###
    ToothPaste V1.0 vs V2.0\n\n| | ToothPaste V1.0 | ToothPaste V2.0 |\n| --- | ---
    | --- |\n| Cross-Platform | ✅ | ✅ |\n| Security Stack | MBedTLS | MBedTLS + Cryptoauthlib
    |\n| Credential Storage | Software-Bound \U0001F7E0 | Hardware-Bound \U0001F7E2
    |\n| Requires Extra Config | ❎ | ☑️ |\n\n### I present…\n\n![ToothPaste Completed](/_astro/ToothPasteIPad_Z1cX3Jj.webp)\n\n#
    The Hardware (Deus Ex PCBWay) \U0001F50C\n\nYou know that feeling when you think
    you’ve finally turned all the ideas you had into a real product and THEN **another
    one strikes**? Yeah that’s how the hardware security component of ToothPaste felt.\n\n###
    The problem…\n\nI realized that the most \U0001F90C _perfect_ \U0001F90C security
    solution for ToothPaste would use a Crypto IC / Secure Element / TPM / \\<insert
    cool word here\\> which stores the ECDH Private keys in an isolated storage space,
    making it impossible to extract them even if you have physical access to the device.
    This is how hardware cryptocurrency wallets like [Trezor](https://trezor.io/)
    and hardware 2FA solutions like [YubiKey](https://www.yubico.com/) ensure that
    even if a nefarious actor gets their grubby paws on your physical device, they
    can never get to the information inside.\n\n### [The saviour](https://www.pcbway.com/)…\n\nThe
    problem was I had already designed and ordered the ToothPaste V1 PCBs and with
    hardware development being an expensive hobby, I didn’t want to break the bank
    simply for the love of the game.\n\nThat’s when [PCBWay](https://www.pcbway.com/)
    contacted me saying they wanted to sponsor the prototype PCBs for a potential
    V2… **so I checked if it was a phishing email**. But turns out it wasn’t because
    after a month of me scrambling to understand all the possible ways I"
