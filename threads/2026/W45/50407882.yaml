  author: rbehrends
  text: A key problem when using manual approval with Claude is that too much of Claude&#x27;s
    tool use is Bash or Python slop that is difficult to review (especially when you
    are getting spammed by it) and impossible to handle through rules. Example:<p>sed
    -n 1,30p src&#x2F;vm&#x2F;wren_vm.c &amp;&amp; sed -n 310,350p src&#x2F;vm&#x2F;wren_vm.c
    &amp;&amp; sed -n 560,600p src&#x2F;vm&#x2F;wren_vm.c &amp;&amp; sed -n 740,775p
    src&#x2F;vm&#x2F;wren_vm.c &amp;&amp; sed -n 40,70p src&#x2F;vm&#x2F;wren_common.h
    &amp;&amp; cat util&#x2F;wren_to_c_string.py | head -80 &amp;&amp; ls test&#x2F;random
    doc&#x2F;site doc&#x2F;site&#x2F;modules doc&#x2F;site&#x2F;modules&#x2F;random
    2&gt;&#x2F;dev&#x2F;null; cat projects&#x2F;premake&#x2F;premake5.lua | head -80;
    cat util&#x2F;generate_projects.py<p>After ten or more of these, you&#x27;re going
    to get hit by permission fatigue, and then, yes, manual review becomes too error-prone
    to use safely.<p>The irony is that Claude is regularly ignoring its existing Read&#x2F;Write&#x2F;Edit
    tools that could make everything more readable.<p>Other models&#x2F;harnesses
    have their own problems, but Claude Code is one of the worst for manual approval.<p>You
    can get manual approval to work reasonably well if you give the model a reasonable
    set of tools (I have literally written my own MCP servers to cover gaps in existing
    harnesses) where you can then write rules for the vast majority of safe cases.<p>For
    example, I have a stdio MCP server that allows models to inspect crates under
    ~&#x2F;.cargo&#x2F;registry&#x2F;src (paired with the existing query-crates MCP
    server). It provides read-only operations limited to crate data, so I can pretty
    safely auto-approve everything in there. With the right setup, including a sandbox,
    you only ever have to manually approve something once in a while and usually with
    delimited scope, avoiding permission fatigue.
