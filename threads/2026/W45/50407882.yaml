  author: Kim_Bruning
  text: Making a sandbox both fully secure and fully useful are contradictory requirements.
    If you want the agent to do any real work, you have to leave gaps.<p>With SOTA
    agents that’s a real bind, because they’re very likely to find those gaps. Whether
    they exploit them, close them, or leave them alone then becomes a prompting challenge
    yet again.<p>I don&#x27;t think this means don&#x27;t sandbox at all. You can
    prevent a lot of small and medium accidents by locking down or gating access to
    hidden files, ssh, sudo, etc.<p>But your sandbox can never be the whole story.
