  author: bcherny
  text: 'Will look into exposing that in hooks.<p>Ultimately, the threat model here
    is: human has to approve a lot of commands, so gets tired and accidentally approves
    a command they shouldn’t have. We spent a significant amount of effort to build
    a richer permission system, allow configuration at multiple levels, use static
    analysis to detect dangerous and safe commands, monitor the model to detect and
    block prompt injection at the inference layer, etc. Some of these components we
    rewrote and red teamed dozens of times. Our conclusion was that despite all of
    this work, in practice the threat model is that human attention is limited and
    that that a different approach performs an order of magnitude better in practice.'
