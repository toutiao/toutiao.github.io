  author: Kim_Bruning
  text: 'Compare approving every step manually: at first you read everything the llm
    proposes carefully, convinced that you&#x27;ll catch it out. After a while you
    get faster and faster until at some point you find yourself hitting &quot;approve&quot;
    the second the text appears, long before you actually could absorb what it said.<p>This
    is called &quot;approval fatigue&quot;.<p>If you think this can&#x27;t possibly
    happen to you, you might be in for a surprise.  This is an almost textbook case
    of classic conditioning. You&#x27;ll find yourself hitting that button faster
    and faster even while fighting back the urge. So a human is no guaranteed backstop.<p>This
    is the scenario that cc auto mode guards against. It cuts down the number of permission
    prompts to something manageable, so that your fingers don&#x27;t get trained into
    clicking &#x27;approve&#x27; on &#x27;rm -rf&#x27; in the very eyeblink that it
    appears.<p>So maybe you feel it doesn&#x27;t work in theory; but weirdly enough,
    in practice this particular approach is actually one of the better ones; especially
    when used in combination with other common sense measures where practical.'
