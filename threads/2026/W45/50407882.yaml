  author: prmph
  text: No, this is the way I have worked for a long time, and I have not suffered
    from any approval fatigue.<p>Rather what has happened is that I have gotten very
    good at scanning what it is trying to do and know within a second or two whether
    there is anything fishy I need to look at more closely.<p>And by &quot;fishy&quot;,
    I do not mean only security issues, but also architecture, code, etc issues. Sometimes
    it even adds unrelated unapproved changes to what it is supposed to be working
    on, and I stop it.<p>And I&#x27;m glad I work this way, because countless times
    I have stopped it from going down a path that is nonsensical or I strongly dislike.<p>There
    are techniques I have adopted to speed up working this. Sometimes I allow Claude
    to make larger changes at once, to batch several changes at once, etc. But these
    decisions are under my control.<p>I prefer to work this way than to wade through
    enormous PRs trying to wrap my head around what was done, where I am likely to
    just give up and approve it after a cursory review.
