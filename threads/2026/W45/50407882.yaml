  author: markasoftware
  text: I&#x27;m not claiming auto is worse than manual; I&#x27;m claiming it cannot
    be compared with anything security-wise because it does not aim to provide any
    guarantees, there&#x27;s no systematic way to reason about what it will and won&#x27;t
    allow, etc<p>With e.g. VM or container sandboxing, we can say things like &quot;If
    there are no vulnerabilities in the hypervisor or hardware, then the agent can
    only access these files, these network services, etc&quot;. Auto mode doesn&#x27;t
    even try to provide any guarantees, so it&#x27;s impossible to reason about. It
    amounts to just using the models judgment about what&#x27;s &quot;malicious&quot;
    or not, a definition which is subjective, changes model to model, and can be influenced
    by attacker input.<p>Empirical evaluations of how many vulnerabilities manual
    vs auto mode let through are not super meaningful because auto mode changes dramatically
    with model releases, the type of task being performed, whether the attacker is
    making targeted attacks designed to bypass auto mode, etc. A security feature
    cannot rely on these sorts of factors if it&#x27;s to be taken seriously.<p>Further,
    percent of malicious tool calls accepted is a bad metric. It&#x27;s like measuring
    the security of ssh in terms of what percent of unauthenticated logins succeed.
    The only acceptable value is zero. It&#x27;s pass&#x2F;fail, not a spectrum. So
    both auto and manual mode should fail equally here. Further, the set of malicious
    tool calls admitted in auto mode may not be a subset of those admitted in manual
    mode.
