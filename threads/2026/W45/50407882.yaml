  author: data-ottawa
  text: Two modifications I&#x27;ve made that help:<p>I ended up having to build a
    full shell argument decomposition and parser, with it I can manage allow list
    of rich tree structured commands. Centralizing a curated collection of known command
    structures and their side effects would help a lot. I don&#x27;t know if Claude
    does this already, but it doesn&#x27;t work with things like `gcloud` from my
    experience, and that has resulted in it slurping secrets (even a partial read
    I&#x27;ve had to rotate keys for).<p>Claude uses bigquery in the command line
    by piping sql files from &#x2F;tmp into the `bq` command. I had Claude create
    a hook that expands the SQL file into the permission prompt giving me a real chance
    to review these, but the TUI truncates long commands with no scroll option. Making
    that the default behaviour and adding a pager would allow better review of lots
    of executable scripts.<p>As long Claude is running as the user&#x27;s account
    there&#x27;s no guarantees. An approach like 1password&#x27;s `op read` to physically
    separate secrets from repo read access and printing would he helpful (as in, make
    sure that no standard key formats can be ingested into the agent&#x27;s context
    or logging).<p>Again, I don&#x27;t know if any of these are implemented, they&#x27;ve
    very likely to have been tried by the Claude team, but maybe there&#x27;s a long
    shot chance that it helps.
