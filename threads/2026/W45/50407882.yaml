  author: bcherny
  text: 'Boris from the Claude Code team here. Historically Claude Code has not done
    secret scrubbing (there are many good tools for that), but we are looking into
    what we can do to prevent this.<p>That said, a few thoughts:<p>1. .claude&#x2F;settings.local.json
    is meant to stay local. This is not a file you should check into source control.
    We automatically gitignore it when Claude creates the file, so in this case the
    files were manually created and checked in (docs: <a href="https:&#x2F;&#x2F;code.claude.com&#x2F;docs&#x2F;en&#x2F;settings"
    rel="nofollow">https:&#x2F;&#x2F;code.claude.com&#x2F;docs&#x2F;en&#x2F;settings</a>)<p>2.
    Permission rules are old hat. Everyone should be using auto mode instead. It is
    safer and also does not require manually maintaining finicky allow&#x2F;deny lists.
    Auto mode is enabled by default and is included for free in all plans.<p>3. Regardless
    of what agent you use, you should have secret scanning enabled. GitHub and other
    source control hosts offer it. There are many threat models that it protects against
    and you should absolutely use it if you can. (see <a href="https:&#x2F;&#x2F;github.com&#x2F;security&#x2F;plans"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;security&#x2F;plans</a>)'
