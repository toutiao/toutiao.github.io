  author: rramadass
  text: No, that&#x27;s not how to look at it.<p>Obviously &quot;all function calls&quot;
    phrase cannot be absolute, but most can be caught with the analyzer giving one
    of proved&#x2F;disproved&#x2F;unknown result. The reason all cannot be caught
    is because pre&#x2F;post are logical predicates on sets of values and are not
    part of the typing system.<p>To understand that, you have to know how a static
    analyzer works and specifically two of its functions, &quot;Data Flow Analysis&quot;
    and &quot;Symbolic Execution&quot;.<p>It is Symbolic Execution that does static
    checking without the need for the actual runtime values to be known. It basically
    &quot;executes&quot; the code mathematically, building logical predicates over
    &quot;sets of values&quot; (indicated by the type of the variable) and thence
    trying to prove&#x2F;disprove the formula using a solver. Note that the program
    is being &quot;run&quot; abstractly in the mathematical world using quantifiers
    just like you do in a mathematical proof.<p>If you know Hoare triples, and Dijkstra&#x27;s
    WP-Calculus you know how to do this mechanically.<p>So the analyzer does two things;
    a) in the function itself it assumes pre is true and tries to prove post and b)
    at the call site it makes sure the paths leading up to the invocation satisfy
    the pre&#x2F;post args&#x2F;result needs thus chaining everything through the
    codebase. Both are done using symbolic execution. If it cannot prove&#x2F;disprove
    the assertions, it remains silent (i.e. &quot;unknown&quot; result above) and
    leaves it to runtime checks to catch the violations.<p>Some resources:<p>1) How
    Static Analysis works - <a href="https:&#x2F;&#x2F;pvs-studio.com&#x2F;en&#x2F;blog&#x2F;posts&#x2F;1048&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;pvs-studio.com&#x2F;en&#x2F;blog&#x2F;posts&#x2F;1048&#x2F;</a><p>2)
    A Gentle Introduction to Symbolic Execution for Software Security - <a href="https:&#x2F;&#x2F;can-ozkan.medium.com&#x2F;a-gentle-introduction-to-symbolic-execution-for-software-security-534e49c8efde"
    rel="nofollow">https:&#x2F;&#x2F;can-ozkan.medium.com&#x2F;a-gentle-introduction-to-symbol...</a><p>3)
    Scaling Symbolic Execution to Large Software Systems - <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2408.01909"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2408.01909</a>
