    does this. In my experience, the &quot;problem&quot; with std::regex is that it
    provides more features by default than most people want, and you pay for using
    those features. Specifically, std::regex respects the runtime locale. There are
    good reasons a standard library feature might do this (e.g. it simplifies the
    interface, it&#x27;s broadly applicable, etc.), but it&#x27;s obviously not going
    to give optimal performance. This is a necessary tradeoff for any standard library.<p>Locale
    handling requires dynamic memory allocation, virtual function dispatch, sometimes
    system calls. Locale handling also prevents some low-level optimizations based
    on the character encoding. If you need that kind of performance, std::regex probably
    isn&#x27;t for you, go grab a non-standard library that suits your needs.
