  author: jandrewrogers
  text: As someone who writes high-reliability C++ but is completely outside the standards
    process, I see the issues with C++ Contracts. It isn’t clear that it solves a
    problem that anyone has in real codebases, especially after C++20 concepts.<p>If
    you were already writing high-reliability C++ then the benefits are difficult
    to quantify. If you weren’t writing high-reliability C++ then it saves you almost
    nothing over doing the standard idioms of high-reliability C++ that were already
    available to you at very marginally more cost. It <i>does</i> standardize expression
    of it in narrow cases but the payoff seems minimal.<p>Most of what C++ Contracts
    delivers is a mashup of what you can already do with constexpr and C++20 Concepts.
    I like reliability features but this feature, as delivered, looks fairly useless
    if you already use reliability features. A compelling standard would need to make
    much deeper guarantees out of the box. And the compiler can already see through
    most compositions of constexpr and C++20 concepts, which is already very expressive.<p>C++
    Contracts looks a bit like a feature that was designed long before current standard
    features existed.
