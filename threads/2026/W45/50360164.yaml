  author: jandrewrogers
  text: C++ concepts evaluate the properties of types at compile-time. You can inject
    arbitrary constraints on type properties anywhere in the code including conditional
    codegen. It is a way of asking if a type “can express this complex set of abstract
    things or has this enumerated set of properties” with almost arbitrary detail.
    They are extremely powerful in terms of expressiveness and specialization of code.
    Insanely good for performance and reliability engineering.<p>One of the best features
    to be added to C++ in many years.<p>C++ contracts are an attempt to bring C asserts
    into the C++ age. The weakness of C++ contracts is that they are mostly syntactic
    sugar over C asserts. If you really care about this type of thing, you probably
    already have a custom C++ assertion framework that is at least as capable if not
    more.<p>The promise of C++ contracts is that they can aid formal verification,
    which would be great. As delivered, it can’t do much more than was already possible,
    which will inhibit adoption.
  score: 0
