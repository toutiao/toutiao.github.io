  author: jjmarr
  text: There is no standard build&#x2F;module system or way of dependency management.
    Unfortunately, this is because there&#x27;s no standard compiler with standardized
    flags so C++ would also have to standardize compiler behaviour too.<p>Large FAANGs
    that would be incentivized to change it don&#x27;t care because they have their
    own in-house C++ build systems like bazel (Google) or buck2 (Meta) that are far
    faster than cmake (distributed compilation and caching) but require huge teams
    to maintain. Unfortunately, this distributed compilation and caching layer is
    something that many other languages don&#x27;t have since their build systems
    are made for single devs building locally.<p>Also the dependencies can be added
    in a myriad of ways. Your build system can download them, your meta-build dependency
    manager can find them (Conan), your Linux distro can provide them (system libraries),
    or maybe you just download an object file from a website + some headers and are
    told to figure it out yourself (many commercial packages like cuda or steam).
