  author: Tanjreeve
  text: In OP<p>&gt; It’s not as simple as writing data straight to S3. Lots of PUTs
    for tiny blobs of data are slow and expensive. Instead, we use an SSD tier to
    optimize speed and cost:<p>&gt; When you write data to an actor’s SQLite database,
    the write is acknowledged once SSDs in 2 of 3 availability zones have it. Then,
    the data is batched to S3 in the background. This means that S3 is never on the
    write path, which lowers latency and cost. When reading data or waking an actor,
    Rivet reads from SSDs if already cached and falls back to S3 if not. SSD caches
    can be tuned to meet your needs, giving you configurable tiered storage for your
    actors.
  score: 0
