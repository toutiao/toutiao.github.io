  text: There is a notion right now of decoupling the agent loop from the sandbox,
    so the sandbox isn&#x27;t waiting for request-response from the agent. This would
    probably be 90+% of all the agent work.<p>If you combine this with products like
    Sprites from Fly.io (or OSS version - agent substrate), where you pay only per
    execution request in a sandbox, you can have huge savings compare to the event
    loop inside the sanbdox. You will be billed only for request executions (tens
    of milliseconds per read&#x2F;write, hundreds of milliseconds per search, etc.)
    and zero for all the waiting time during the the inference phase.<p>Also, if you
    don&#x27;t require a real Linux sandbox — you might actually emulate the environment,
    e.g. just-bash idea with linux-like environment to give agents something that
    looks like their native habitat, but under the hood, it can be just CF Durable
    Objects SQLite or whatever else.<p>Probably(?) almost all knowledge work doesn&#x27;t
    require a Linux sandbox. You can just build a document reading and editing agent
    that does tool calls and connects to other products via MCPs, APIs, etc. And lightweight
    actors make a lot of sense to me in these cases.
