  author: NathanFlurry
  text: 'Hey!<p>&gt; Wouldn&#x27;t an agent in any capacity need a sandbox runtime
    to do agentic work?<p>Developers on Rivet use 3 different patterns:<p>- Just agents:
    many agents just need tools, such as customer support or personal agents<p>- Agents
    with lightweight sandbox: Rivet provides a V8 &#x2F; WebAssembly sandboxing library
    for running JS &amp; Python with a filesystem, which covers most workloads like
    data analysis, file processing, evals, and code mode (<a href="https:&#x2F;&#x2F;rivet.dev&#x2F;agentos&#x2F;">https:&#x2F;&#x2F;rivet.dev&#x2F;agentos&#x2F;</a>)<p>-
    Agent outside of the sandbox: expose the sandbox to the agent as tools, which
    is better for blast radius, trust boundary, and orchestration (see below)<p>&gt;
    Is the idea that state&#x2F;memory&#x2F;context and runtime env are separate concepts
    in rivet?<p>Exactly, Rivet Actors support running the harness outside of the sandbox.
    It&#x27;s often referred to &quot;separation of head from the hands.&quot;<p>I
    wrote a bit about why a while back: <a href="https:&#x2F;&#x2F;rivet.dev&#x2F;blog&#x2F;2026-07-27-run-your-harness-outside-the-sandbox&#x2F;">https:&#x2F;&#x2F;rivet.dev&#x2F;blog&#x2F;2026-07-27-run-your-harness-outside-t...</a><p>&gt;
    When you say &quot;sandboxes are too slow&quot; do you mean needing to boot the
    sandbox to get back Agent state?<p>Specifically coldstarts. As LLMs are getting
    faster and have more realtime use cases, sandboxes are become the bottleneck on
    time to interactive for an agent.'
