  author: NathanFlurry
  text: 'Been a minute since the gaming days, thanks for reaching out!<p>&gt; Have
    you had agents like claude code , codex etc all fully running in agent-os?<p>We
    have gotten them all working inside of agentOS. However, we found it&#x27;s a
    better architecture to run the agent loop outside of agentOS and expose it as
    tools. The trust boundary &amp; blast radius of running the agent inside the sandbox
    makes it difficult.<p>Also, the memory overhead of running individual Claude Code
    instances is nuts, it&#x27;s better to run the agents in a single process using
    tools.<p>I wrote a bit more on it here: <a href="https:&#x2F;&#x2F;rivet.dev&#x2F;blog&#x2F;2026-07-27-run-your-harness-outside-the-sandbox&#x2F;">https:&#x2F;&#x2F;rivet.dev&#x2F;blog&#x2F;2026-07-27-run-your-harness-outside-t...</a><p>&gt;
    Also with the s3 backing changes, it reminds me a lot of the work done on celld,
    good to see more self-hostable durable objects out there.<p>Appreciate it!<p>Rivet
    has a much different architecture than most S3-backed databases. Having an object-per-actor
    doesn&#x27;t scale well with cost and performance, so we built a SSD tiered storage
    engine instead: <a href="https:&#x2F;&#x2F;rivet.dev&#x2F;changelog&#x2F;2026-10-26-introducing-rivet-3-0-preview&#x2F;#warp-drive-bottomless-storage-with-the-speed-of-an-ssd">https:&#x2F;&#x2F;rivet.dev&#x2F;changelog&#x2F;2026-10-26-introducing-rivet-3-0...</a><p>Ping
    me on Discord if you give it a try, would be fun to catch up: <a href="https:&#x2F;&#x2F;rivet.dev&#x2F;discord">https:&#x2F;&#x2F;rivet.dev&#x2F;discord</a>'
