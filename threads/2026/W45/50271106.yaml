  author: rfgplk
  text: C++ actually has numerous footguns that even experienced developers are completely
    unaware of. Main reason being is that C++ follows three models in parallel<p>*
    the C++ standard<p>* the CPU arch details<p>* the OS details<p>The standard itself
    delegates a large chunk of functionality to be &quot;platform specific&quot; which
    will inherently depend either on the CPU or the underlying OS. In fact C++ itself
    is entirely silent about the ISA other than loosely specifying the virtual machine
    the language is supposed to run on. So you can get scenarios where some code is
    perfectly safe on one arch (say alignment doesn&#x27;t matter) while being severe
    UB&#x2F;a failure condition on another (alignment matters and you fault the second
    you touch misaligned data). There are also other issues like integer over&#x2F;underflow,
    fp issues, SIMD issues, memory access issues, stack&#x2F;heap issues; all of which
    you MUST address.<p>Other languages don&#x27;t quite have these problems because
    the compiler&#x2F;runtime handles them and they instead give you a unified interface
    behind which to write your code.
