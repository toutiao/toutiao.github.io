  content: "## [Tips for more effective fuzz testing with AFL++](/blog/2025/02/05/)\n\n
    nullprogram.com/blog/2025/02/05/ \n\nFuzz testing is incredibly effective for
    mechanically discovering software defects, yet remains underused and neglected.
    Pick any program that must gracefully accept complex input, written _in any language_,
    which has not yet been been fuzzed, and fuzz testing usually reveals at least
    one bug. At least one program currently installed on your own computer certainly
    qualifies. Perhaps even most of them. [Everything is broken](https://danluu.com/everything-is-broken/)
    and low-hanging fruit is everywhere. After fuzz testing ~1,000 projects [over
    the past six years](/blog/2019/01/25/), I’ve accumulated tips for picking that
    fruit. The checklist format has worked well in the past ([1](/blog/2024/12/20/),
    [2](/blog/2023/01/08/)), so I’ll use it again. This article discusses [AFL++](https://aflplus.plus/)
    on source-available C and C++ targets, running on glibc-based Linux distributions,
    currently the _indisputable_ best fuzzing platform for C and C++.\n\nMy tips complement
    the official, upstream documentation, so consult them, too:\n\n- [Performance
    Tips](https://afl-1.readthedocs.io/en/latest/tips.html) on the AFL++ website\n-
    [Technical “whitepaper” for afl-fuzz](https://lcamtuf.coredump.cx/afl/technical_details.txt)\n\nEven
    if a program has been fuzz tested, applying the techniques in this article may
    reveal defects missed by previous fuzz testing.\n\n### (1) Configure sanitizers
    and assertions\n\nMore assertions means more effective fuzzing, and sanitizers
    are a kind of automatically-inserted assertions. By default, fuzz with both Address
    Sanitizer (ASan) and Undefined Behavior Sanitizer (UBSan):\n\n    $ afl-gcc-fast
    -g3 -fsanitize=address,undefined ...\n\nASan’s default configuration is not ideal,
    and should be adjusted via the`ASAN_OPTIONS` environment variable. If customized
    at all, AFL++ requires at least these options:\n\n    export ASAN_OPTIONS=\"abort_on_error=1:halt_on_error=1:symbolize=0\"\n\nExcept
    `symbolize=0`, [this _ought to be_ the ASan default](/blog/2022/06/26/). When
    debugging a discovered crash, you’ll want UBSan set up the same way so that it
    behaves under in a debugger. To improve fuzzing, make ASan even more sensitive
    to defects by detecting use-after-return bugs. It slows fuzzing slightly, but
    it’s well worth the cost:\n\n    ASAN_OPTIONS+=\":detect_stack_use_after_return=1\"\n\nBy
    default ASan fills the first 4KiB of fresh allocations with a pattern, to help
    detect use-after-free bugs. That’s not nearly enough for fuzzing. Crank it up
    to completely fill virtually all allocations with a pattern:\n\n    ASAN_OPTIONS+=\":max_malloc_fill_size=$((1<<30))\"\n\nIn
    the default configuration, if a program allocates more than 4KiB with`malloc`
    then, say, uses `strlen` on the uninitialized memory, no bug will be detected.
    There’s almost certainly a zero somewhere after 4KiB. Until I noticed it, the
    4KiB limit hid a number of bugs from my fuzz testing. Per (4), fulling filling
    allocations with a pattern better isolates tests when using persistent mode.\n\nWhen
    fuzzing C++ and linking GCC’s libstdc++, consider `-D_GLIBCXX_DEBUG`. ASan cannot
    “see” out-of-bounds accesses within a container’s capacity, and the extra assertions
    fill in the gaps. Mind that it changes the ABI, though fuzz testing will instantly
    highlight such mismatches.\n\n### (2) Prefer the persistent mode\n\nWhile AFL++
    can fuzz many programs in-place without writing a single line of code (`afl-gcc`,
    `afl-clang`), prefer AFL++’s [persistent mode](https://github.com/AFLplusplus/AFLplusplus/blob/stable/instrumentation/README.persistent_mode.md)(`afl-gcc-fast`,
    `afl-clang-fast`). It’s typically an order of magnitude faster and worth the effort.
    Though it also has pitfalls (see (4), (5)). I keep a file on hand, `fuzztmpl.c`
    — the progenitor of all my fuzz testers:\n\n    #include <unistd.h>\n    \n    __AFL_FUZZ_INIT();\n
    \   \n    int main(void)\n    {\n        __AFL_INIT();\n        char *src = 0;\n
    \       unsigned char *buf = __AFL_FUZZ_TESTCASE_BUF;\n        while (__AFL_LOOP(10000))
    {\n            int len = __AFL_FUZZ_TESTCASE_LEN;\n            src = realloc(src,
    len);\n            memcpy(src, buf, len);\n            // ... send src to target
    ...\n        }\n    }\n\nI [`:r`](https://vimhelp.org/insert.txt.html#%3Aread)
    this into my Vim buffer, then modify as needed. It’s a stripped and improved version
    of the official template, which itself has a serious flaw (see (5)). There are
    unstated constraints about the position of `buf` and `len` in the code, so if
    in doubt, refer to the original template.\n\n### (3) Include source files, not
    header files\n\nWe’re well into the 21st century. Nobody is compiling software
    on 16-bit machines anymore. Don’t get hung up on the one translation unit (TU)
    per source file mindset. When fuzz testing, we need at most two TUs: One TU for
    instrumented code and one TU for uninstrumented code. In most cases the latter
    takes the form of a library (libc, libstdc++, etc.) and we don’t need to think
    about it.\n\nFuzz testing typically requires only a subset of the program. Including
    just those sources straight in the template is both effective and simple. In my
    template I put includes just _above_ `unistd.h` so that the header isn’t visible
    to the sources unless they include it themselves.\n\n    #include \"src/utils.c\"\n
    \   #include \"src/parser.c\"\n    #include <unistd.h>\n\nI know, if you’ve never
    seen this before it looks bonkers. This isn’t what they taught you in college.
    Trust me, [this simple technique](https://en.wikipedia.org/wiki/Unity_build) will
    save you a thousand lines of build configuration. Otherwise you’ll need to manage
    different object files between fuzz testing and otherwise.\n\nPerhaps more importantly,
    you can now fuzz test _any arbitrary function_in the program, including static
    functions! They’re all right there in the same TU. You’re not limited to public-facing
    interfaces. Perhaps you can skip (7) and test against a better internal interface.
    It also gives you direct access to static variables so that you can clear/reset
    them between tests, per (4).\n\nPrograms are often not designed for fuzz testing,
    or testing generally, and it may be difficult to tease apart tightly-coupled components.
    Many of the programs I’ve fuzz tested look like this. This technique lets you
    take a hacksaw to the program and substitute troublesome symbols just for fuzz
    testing without modifying a single original source line. For example, if the source
    I’m testing contains a `main` function, I can remove it:\n\n    #define main oldmain\n
    \   # include \"src/utils.c\"\n    # include \"src/parser.c\"\n    #undef main\n
    \   #include <unistd.h>\n\nSure, better to improve the program so that such hacks
    are unnecessary, but most cases I’m fuzz testing as part of a drive-by review
    of some open source project. It allows me to quickly discover defects in the original,
    unmodified program, and produces simpler bug reports like, “Compile with ASan,
    open this 50-byte file, and then the program will crash.”\n\n### (4) Isolate fuzz
    tests from each other\n\nTests should be unaffected by previous tests. This is
    challenging in persistent mode, sometimes even impractical. That means resetting
    all global state, even something like the internal `strtok` buffer if that function
    is used. Add fuzz testing to your list of reasons to eschew global variables.\n\nIt’s
    mitigated by (1), but otherwise uninitialized heap memory may hold contents from
    previous tests, breaking isolation. Besides interference with fuzzing instrumentation,
    bugs found this way are wickedly difficult to reproduce.\n\nDon’t pass uninitialized
    memory into a test, e.g. an output parameter allocated on the stack. Zero-initialize
    or fill it with a pattern. If it accepts an arena, fill it with a pattern before
    each test.\n\nTypically you have little control over heap addresses, which likely
    varies across tests and depends on the behavior previous tests. If the program[depends
    on address values](/blog/20"
