  text: I think your intuition about quality and who signs up is correct, but doesn&#x27;t
    insulate as much as you&#x27;re assuming. For one thing, corporations have a nearly
    unlimited appetite for converting employees to contractors. For another, the economy
    has produced a large number of desperate people willing to do pure commodity work.<p>One
    reason &quot;Uber for X&quot; appears not to have materialized is that the platforms
    themselves are commoditized, not just the labor. Retailers like Lowe&#x27;s and
    Wayfair have built assembly&#x2F;installation services behind a checkout upsell.
    They run portals distributing work to their &quot;network of local contractors&quot;
    .<p>I got a window into this world through an acquaintance. He has a truck and
    light trade skills, but mental and reputational legacies of past addiction lock
    him out of the &quot;anyone good&quot; market. He&#x27;s on a half dozen platforms,
    trying to stitch a living doing sink or toilet installs for Lowe&#x27;s and building
    bookcases for Wayfair. A negative review gets you demoted from the choice gigs,
    or even kicked from the platform entirely. It&#x27;s bleak.
