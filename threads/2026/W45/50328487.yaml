  author: noir_lord
  text: "&gt; Taxi drivers were not more &quot;regulated&quot; in any meaningful way,
    in fact oversight of them was significantly worse than the community-driven Uber
    rating system (not that that doesn&#x27;t also have flaws).<p>You are defaulting
    to the US here (and I doubt Taxi regulation in the US is that homologous either
    tbh given the complexity of 50 states and then cities on top of that).<p>Taking
    the country I&#x27;m most familiar with (the UK), Taxis fall into two categories
    (only one of which is technically a taxi by law if not convention - Hackney and
    private hire vehicles) <i>both</i> <i>are</i> licensed in different but similar
    ways by the licensing authorities (usually the local council but not always),
    some of those laws go back centuries.<p>Also worth noting, in the UK Uber <i>does</i>
    operate under the Private Hire Vehicle laws and does have to comply with applicable
    licensing same as any other &quot;taxi&quot; (private hire vehicle) operator.<p>They
    tried to argue otherwise and lost (at the UK Supreme Court so it&#x27;s essentially
    settled case law) so they are classed as a PHV Operator and must ensure they only
    use a properly licensed PHV vehicle and drivers and can&#x27;t pull the &quot;but
    they are independent contractors&quot; card out when it explodes in their faces.<p>It
    was a little more nuanced than that. The actual case was about whether a private
    hire operator accepting a booking had to contract with the customer as principal,
    rather than merely acting as an agent arranging a contract between the customer
    and driver (which was essentially Uber&#x27;s argument).<p>The (UK) Supreme Court
    said &quot;nah, it&#x27;s you, nice try though&quot;."
