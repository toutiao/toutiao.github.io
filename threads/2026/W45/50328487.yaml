  content: "[NEWS](/news/)\n\n# Nurses Sound Alarm as 'Uber for Nursing' Apps Push
    to Deregulate Healthcare\n\n ![Angelina Walker](https://media.nurse.org/cache/78/78/78780d3e56c286e2a0fee5e995925b94@2x.webp)\nWritten
    by Angelina Walker on April 22, 2026 \n\n4 Min Read\n\n- [Inside the 'Uber for
    Nursing' Playbook](#inside-the-uber-for-nursing-playbook)\n- [Where the Fight
    Is Happening](#where-the-fight-is-happening)\n- [What Nurses Need to Know](#what-nurses-need-to-know)\n\nKey
    Takeaways\n\n- The [AI Now Institute](https://ainowinstitute.org/publications/uber-for-nursing)
    released _Uber for Nursing Part II_ on April 21, 2026, documenting how gig platforms
    including ShiftKey, Clipboard Health, and CareRev are lobbying in at least 17
    states to exempt themselves from healthcare staffing rules.\n- Platforms use AI-driven
    dynamic pricing, bidding auctions, and rating systems that can pay nurses different
    rates for the same shift, while classifying them as independent contractors without
    benefits.\n- New York rejected the gig model in 2025, but bills remain active
    in Colorado, Illinois, Iowa, Wisconsin, and other states, meaning the rules that
    govern how nurses are hired through apps are being written right now.\n\nA new&nbsp;[AI
    Now Institute report](https://ainowinstitute.org/publications/uber-for-nursing)
    published April 21, 2026, warns that gig-work platforms marketed as \"Uber for
    nursing\" are aggressively lobbying states to rewrite healthcare staffing rules,
    a push that could leave nurses with less pay, fewer protections, and less control
    over their shifts, [according to The Guardian](https://www.theguardian.com/us-news/2026/apr/21/healthcare-nurses-gig-work-ai-apps).\n\nThe
    report, titled _Uber for Nursing Part II_, identifies apps like Clipboard Health,
    ShiftKey, CareRev, and IntelyCare as the main players reshaping how hospitals
    and long-term care facilities fill shifts. According to the report, the ten most
    prominent gig nursing platforms have raised roughly&nbsp;[$1.4 billion in funding](https://ainowinstitute.org/publications/uber-for-nursing),
    with ShiftKey valued at $2 billion and Clipboard Health at $1.3 billion.\n\nResearchers
    say the platforms' AI-driven pricing, performance surveillance, and contractor
    classifications are creating a new category of gig work that looks a lot like
    rideshare, and may be on track for similar regulatory battles.\n\nStay Ahead on
    What Matters to Nurses\n\nGet breaking nursing news, career updates, and exclusive
    offers delivered to your inbox.\n\n ![](https://media.nurse.org/cache/58/b0/58b0823651a8a09ff910e0333dca846e@2x.webp)\n\n##
    Inside the 'Uber for Nursing' Playbook\n\nThe report describes a system where
    nurses download an app, get rated on performance, and often bid against each other
    for shifts. Platforms use algorithmic pricing, including CareRev's [\"Smart Rates\"
    system](https://ainowinstitute.org/publications/uber-for-nursing), which recommends
    hourly shift rates based on market demand and past performance, according to the
    AI Now Institute.\n\nSome platforms run [\"Quick Bid\" auction systems](https://ainowinstitute.org/publications/uber-for-nursing)
    where nurses bid against each other for the same shift, with the lowest rate winning.
    The report also raises concerns about what it calls \"surveillance wages,\" or
    algorithmic wage discrimination, where platforms may use personal data to set
    different pay rates for nurses doing identical work. A companion [Roosevelt Institute
    brief](https://rooseveltinstitute.org/publications/uber-for-nursing/) found that
    some platforms \"use data-brokers to determine nurse debt levels and offer lower
    wages to those with highest debt loads.\"\n\nWorkers are classified as independent
    contractors, which [excludes](https://ainowinstitute.org/publications/uber-for-nursing)
    them from minimum wage protections, overtime, workers' compensation, and unemployment
    insurance, according to the AI Now Institute. Nurses also report arriving at facilities
    with no paid training or orientation, and say shift cancellations and ratings
    can permanently affect their access to future work.\n\nOne 29-year-old St. Louis
    nurse identified only as Dana, quoted in [coverage](https://inequality.org/article/the-uber-model-comes-for-nursing/)
    of the researchers' earlier interviews, said: \"I love being a nurse. But I hate
    being a nurse right now with these greedy, immoral, corporate companies have done
    to health care.\"\n\n \\>\\>Listen to The Latest Nurse News Podcast \n\n## Where
    the Fight Is Happening\n\nSince 2022, lawmakers in [at least 17 states have introduced
    bills](https://ainowinstitute.org/publications/uber-for-nursing) to carve gig
    nursing apps out of the rules that apply to traditional healthcare staffing agencies,
    per the report. Eight states, including Colorado, Illinois, Iowa, Louisiana, Minnesota,
    Missouri, Nevada, and Rhode Island, have already advanced exemption bills. Six
    more, including Georgia, Ohio, Pennsylvania, California, Missouri, and Wisconsin,
    have seen bills aimed at carving platforms out of worker protection laws.\n\nThe
    lobbying is well-funded. Federal lobbying by Clipboard Health and ShiftKey [exceeds
    $1.1 million combined](https://ainowinstitute.org/publications/uber-for-nursing),
    and the platforms work alongside Amazon and Uber through the Coalition for Workforce
    Innovation, the report states.\n\nNot every state is on board. In 2025, [New York](https://ainowinstitute.org/publications/uber-for-nursing)
    classified gig nursing platforms as healthcare staffing agencies, requiring annual
    registration and quarterly wage reporting, and blocking independent contractor
    classification. Following the law, Clipboard Health, Nursa, and KARE ceased operations
    in the state, the report says.\n\n## What Nurses Need to Know\n\nGig platforms
    are a fast-growing slice of the nurse staffing market, and the rules governing
    them are being written right now. The AI Now Institute warns that bidding wars
    and algorithmic pricing can push profession-wide wages down, while contractor
    classification strips nurses of the benefits and protections most healthcare workers
    expect. Healthcare facilities are already spending heavily on these services,
    with one Colorado nursing home spending $2.9 million in 2022 and a Chicago hospital
    spending $2.7 million [annually](https://ainowinstitute.org/publications/uber-for-nursing)
    on platform staffing, signaling that this model is not going away.\n\nFor nurses
    picking up shifts on an app, the report suggests paying close attention to rating
    systems, cancellation policies, and whether the facility provides any orientation
    or training. For unionized nurses, the authors flag risks of job displacement
    as facilities substitute gig workers for permanent staff.\n\nState legislation
    is also the place to watch. Bills in Colorado, Illinois, Wisconsin, and other
    states could determine whether gig nurses are treated as employees or contractors,
    a classification that affects pay, safety, and accountability when something goes
    wrong at the bedside.\n\n### **\U0001F914Have you picked up a shift through an
    app like ShiftKey, CareRev, or Clipboard Health? Tell us about your experience
    in the comments.&nbsp;&nbsp;**\n\nIf you have a nursing news story that deserves
    to be heard, we want to amplify it to our massive community of millions of nurses!
    Get your story in front of Nurse.org Editors now -[**click here to fill out our
    quick submission form today!**](https://docs.google.com/forms/d/e/1FAIpQLSfYxatRZ81FgQqd6HB9nJ5fgGeA4M1g6OQ6yF0szUm8SkmnqQ/viewform?usp=sf_link)\n\n[\n\nApril
