  author: spwa4
  text: "&gt; Not sure exactly what this means<p>It would mean that neural networks
    are a mistake, that they don&#x27;t really have to be as complex as they are and
    animal minds could just calculate directly from the seed as opposed to building
    and powering this very expensive organ. The brain uses more power than any muscle
    in essentially all mammals and even more in humans. Only olympic-level efforts
    come anywhere close to power usage like the brain on a single muscle. So your
    body is <i>really</i> giving up something serious to let you think, to keep track
    of 100 Trillion weights and constantly evaluate against them.<p>This would be
    something <i>very</i> strange for DNA&#x2F;evolution to do. Especially where it
    comes to energy use, if it can be done with 10W of power, you can bet your firstborn
    DNA will NEVER under any circumstances get caught using 10.01W.<p>Since this isn&#x27;t
    the case, the conclusion should be that there is no seed that controls our brain.
    There is <i>some</i> knowledge &quot;uploaded&quot;, like the need to make your
    heart beat, but it&#x27;s almost literally zero.<p>Btw: it <i>is</i> known that
    a chemical signal pathway is built between mother and child, which exchanges ...
    some kind of information between parent and child outside of DNA, but that&#x27;s
    for the immune system (and what it exchanges is not known. Obviously not immunity).
    Maybe there is a nerve too, but if there is, nobody&#x27;s found it yet, and yet
    that seems infinitely more likely than the hidden seed."
