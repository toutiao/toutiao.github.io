  content: "Home→Archive↴\n\n# Upgrading NetBSD from 11.0 to 11.1\n\nLast edited on
    2026-11-05 • Tagged under  #netbsd   #bsd \n\nI successfully upgraded my NetBSD
    amd64 system (with one hiccup, detailed below) from 11.0 to 11.1:\n\n$ uname -v
    NetBSD 11.1 (GENERIC) #0: Mon Nov 2 16:34:32 UTC 2026 mkrepro@mkrepro.NetBSD.org:/usr/src/sys/arch/amd64/compile/GENERIC\n\nThis
    was my first time upgrading NetBSD and I’m happy with how it all turned out!\n\nNetBSD’s
    Guide describes two different methods for performing an upgrade: boot from NetBSD
    install media and use sysinst(8), or use sysupgrade(8) to do an in-place upgrade
    of the system. With a bit of research, I get the sense that for major version
    changes (i.e 10.1 -> 11.1) sysinst is the preferred method, while sysupgrade is
    a convenient alternative for minor version bumps.\n\nSo sysupgrade it is. First,
    I install the package:\n\n# pkgin update # pkgin install sysupgrade\n\nThen simply
    run:\n\n# sysupgrade auto https://cdn.netbsd.org/pub/NetBSD/NetBSD-11.1/$(uname
    -m)/\n\nThis will proceed to download the kernel and sets appropriate for your
    computer, unpack them, then prompt you to review and merge new configuration changes.
    There were only a few files that needed hands-on editing like passwd and sshd_config
    and I liked how NetBSD shows the diffs between the old and new files and its handling
    of merging differences.\n\nI had one postinstall check that failed:\n\n# postinstall
    checks failed: opensslcertsrehash\n\nI resolved the issue by wiping the legacy
    cache, then letting certctl(8) take over by rehasing the certs:\n\n# rm -rf /etc/openssl/certs/*
    # certctl rehash\n\nVerify certctl successfully populated the directory:\n\n#
    certctl list\n\nI manually re-run postinstall fix [issue] and confirm that it
    now passes inspection (which it did):\n\n# sysupgrade postinstall fix opensslcertsrehash
    # sysupgrade clean\n\nReboot the computer and start enjoying the upgrade!\n\nNOTE
    In addition, edit /usr/pkg/etc/pkgin/repositories.conf and point pkgin to the
    new 11.1 repositories.\n\nYou can like, share, or comment on this post on the
    Fediverse \U0001F4AC\n\n« Previous: Customize the Login on NetBSD"
