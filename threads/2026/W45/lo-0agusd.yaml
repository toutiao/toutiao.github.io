    I just went through this for my first time and my biggest complaint is that going through all the /etc/ diffs was tedious and seemed error-prone. I kind of can't imagine repeating that process on a bunch of servers, so maybe there's a batch/ahead-of-time way to deal with those diffs?
    Also, it appeared to only show the diff between my (usually modified) config files and the "new" files, but I'd actually like to see the diff between the old (unmodified) and the new, so that I can discern which changes are "mine" versus "recommended as part of the upgrade". Anyone know if that's possible?
