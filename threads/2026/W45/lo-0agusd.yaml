    I don't know how people handle this at scale...
    I haven't followed closely the NetBSD space for a while, but in FreeBSD, the tools that merge etc changes can be told to auto-merge files that aren't locally modified, which skips most of the noise. And since I started using freebsd-update (instead of make installworld), I haven't seen any of the /etc conflict resolution stuff any longer. I suppose pkgbase also makes this a non-issue and you then occasionally deal with conflicting updates (which is a thing in other systems; e.g. Debian).
    But on the topic of /etc updates, there is also the issue that /etc contains... code that I think shouldn't be there, but because it's there, it triggers unnecessary "manual" merges. See https://jmmv.dev/2020/08/rcd-libexec-etc.html for a bit on this topic.
