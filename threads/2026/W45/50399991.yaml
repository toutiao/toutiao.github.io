  author: AnthonyMouse
  text: The general premise of the rental market is that if rents are high, the profits
    from building new rental units will justify the construction costs and then new
    units will be added until the rents go down, i.e. until it stops being profitable
    to add more.<p>This actually works unless you inhibit the construction of new
    units. Naturally that&#x27;s what we&#x27;ve been doing, which is why it isn&#x27;t
    working. But the solution is to stop inhibiting the construction of new units.<p>Because
    the alternatives don&#x27;t actually work. Unless you can build enough units to
    meet demand, <i>there aren&#x27;t enough units</i>. Which means you either have
    high prices which suppress demand because people who can&#x27;t afford them are
    forced out, or shortages because you&#x27;re imposing some inadvisable price controls
    and then instead of being unable to get a unit because you can&#x27;t afford the
    rent, you can&#x27;t get a unit because they&#x27;re all occupied and no one is
    adding more.
  score: 0
