  author: Grombobulous
  text: There are other good reasons to have a reasonable amount of inflation.<p>If
    inflation is too low or doesn’t exist, then there’s less incentive to do anything
    with your money. If I have bunch a money that I don’t need to spend immediately,
    and I just want to keep it secure, why would I not keep it in a safe or non-investment
    account if it’s not losing value over time? What’s my incentive to risk it by
    lending it out to someone else?<p>Sure, I could say that my incentive is the interest
    rate, but my alternative is zero risk. Inflation turns “zero risk” into being
    more like a certainty of slow value loss, so that holders of capital are incentivized
    to do something at least minimally risky with that money (e.g., lend it to the
    government in the form of treasury bonds or deposit it into an insured bank account).<p>Debt
    has something of a bad reputation and obviously it can be overused and abused,
    but it’s also something that helps the efficiency of economies. It maximizes the
    amount of money actively participating in the economy rather than sitting.
