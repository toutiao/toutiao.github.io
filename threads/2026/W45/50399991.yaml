    The case wasn&#x27;t even remotely flimsy:<p>The software literally includes an algorithm that says &quot;this week, you will set the rate for this apartment at $X&quot; based on RP&#x27;s data.<p>And, if you want to deviate from that, without being kicked off RP and losing your substantial fee payments, you will follow that rate (and they tell you that they _will_ check), or you can &quot;request an override&quot; from RealPage, that they may allow or deny at their discretion (and RP agents are formally trained that override approvals may not exceed 5% of requests).<p>&gt; Consistent with their agreement to impose rents generated by RealPage RM Software nearly all the time, Defendants agreed to limit overrides. For example, a RealPage LRO training document states: “Overrides should be few and far between.” Similarly, internal RealPage LRO training documents teach cartel members’ regional managers to beware of “Override Overload” or “rogue” leasing agents who too frequently override the LRO-generated pricing.<p>&gt; An internal presentation created by Defendant Greystar explicitly
    acknowledges that RealPage RM Software users should each seek to accept at
    least 95% of the RealPage-generated prices, emphasizing that “Discipline [o]f
    using revenue management increases more consistent outcomes.”<p>&gt; Former Greystar employees have similarly confirmed that negotiating rents other than those set by the RealPage RM Software was unacceptable.<p>&gt; Even where Participating Landlords do not enable auto-accept, most landlords cannot, on their own, charge rents other than those generated by RealPage’s RM Software— landlords can only “propose an override.” The landlord must then provide a written business justification for why they wish to depart from the RealPage-generated rent.<p>&quot;Not price fixing&quot;, huh?<p>Just to reiterate that training presentation:<p>&gt; Discipline [o]f using revenue management increases more consistent outcomes.
