  author: weitendorf
  text: 'Is this not almost exactly what you get on apartments.com or zillow.com by
    just looking at the listed prices in an area?<p>I think you might have the problem
    backwards. Realpage was about buyer collusion, and that wouldn&#x27;t look any
    different from the prices naturally just rising in a market with more demand&#x2F;less
    supply because even sellers who aren&#x27;t colluding would still raise their
    prices if they saw that that was the going rate in the area.<p>When there are
    multiple competing factors all influencing price simultaneously it&#x27;s very
    hard to accurately determine how much any particular factor contributed, or what
    the &quot;actual price&quot; would have been without them.<p>This is actually
    essentially the problem that justifies markets as an efficient way to arrive at
    fair prices - it&#x27;s computationally too expensive to calculate the precise
    supply&#x2F;demand ratios at any given moment, and demand can change much faster
    than supply can adjust (and nobody could ever really know how elastic demand is
    for things like local housing markets anyway).<p>So sellers want to respond to
    changes in demand by raising prices, because the business model of housing rentals
    is matching short term demand&#x2F;pricing&#x2F;risk to long term costs&#x2F;costs&#x2F;risk.
    But every buyer has their own demand preferences and every supplier has a different
    product with different fixed costs, and everybody knows their own demand preference
    and ability to provide supply, so the aggregate price a market settles at &quot;collapses&quot;
    all that information without explicit coordination: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Economic_calculation_problem"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Economic_calculation_problem</a><p>If
    there truly is an increase in demand, as a buyer you probably do want rents to
    increase, because otherwise you get shortages like in Berlin where there is nothing
    to rent. So that&#x27;s why coordinating to withold inventory with other sellers
    is bad, it creates a shortage anyway and only a small number of participants need
    to do it to move the entire market'
  score: 0
