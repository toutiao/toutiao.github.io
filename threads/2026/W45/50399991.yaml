  author: skew-aberration
  text: It is not just housing but all land - the grocery store ups prices without
    increasing profit because every landowner in the supply chain (who they rent their
    stores from, their warehouses, the factories that process and package foods, the
    farms themselves) ups rent too.<p>This is a predictable outcome of commerce due
    to the limited supply of land and is described in some detail by Adam Smith and
    developed by later thinkers like Riccardo and George (who took it to its logical
    conclusion and inspired the board game Monopoly).<p>During the 20th century, economics
    was wholesale rewritten to blur the lines between land and capital so as to bury
    this awkward conversation.<p>The general recommendation of these early economists
    was taxing land - moderate in the case of Smith, up to 100% per George. This amounts
    to public ownership of part of the profits of land ownership.
