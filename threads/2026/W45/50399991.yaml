  author: markasoftware
  text: 'Reminds me of the extremely interesting paper <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;1904.05234"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;1904.05234</a> Flash
    Boys 2.0<p>Basically when somebody makes a pricing error on a decentralized cryptocurrency
    exchange there&#x27;s a mob of automated arbitrage bots that try to trade against
    it. Who wins and actually gets to make the trade is mainly determined by how high
    of a transaction fee your bot is willing to pay.<p>You can win instantly by offering
    to trade with a transaction fee so high it almost wipes out all but a cent or
    two of the entire arbitrage profits, because nobody else will pay a higher fee.<p>Instead
    what happens is bots offer the lowest possible fee, then immediately increase
    their fee as soon as they see a competing bot try to take the trade with a higher
    fee. This results in the bot offering the highest fee changing every several milliseconds
    as the fee quickly grows.<p>The way Ethereum mining works, this results in the
    winning bot being randomly selected from among the set of bots &quot;bidding&quot;
    up the transaction fee: blocks are mined at random intervals of iirc about 20
    seconds, and whoever had the highest bid at the time the next block is mined wins.
    &lt;20 seconds of bidding is short enough that even with the bidding, the transaction
    fee doesn&#x27;t get bid up particularly high, and the winner makes out with a
    highly profitable arbitrage trade.<p>By giving up a guaranteed win and instead
    rolling the dice against other bots, transaction fees stay low and everyone has
    a higher expected profit. It&#x27;s coordination that happens without any communication
    between the participants and quite possibly the participants didn&#x27;t realize
    they were in effect cooperating when they added the high speed bidding behavior
    to their bots.'
