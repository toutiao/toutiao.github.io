    out for a tenant who would pay a higher rent and not having the unit vacant in
    the meantime. Holding out for longer than that helps the <i>other</i> landlords
    <i>at your expense</i>. Meanwhile there are a large number of landlords, there
    is no way for the ones using a given system to force the others to do the same,
    and a significant percentage of them don&#x27;t.<p>So if the system tells the
    landlords using it to do the thing that would increase rents if <i>every</i> landlord
    was using it, the &quot;defectors&quot; who <i>don&#x27;t</i> use the system win
    out over anyone using it, which means using the system rather than defecting would
    cause you to lose money and everyone would have the incentive to defect.<p>Whereas
    if all the system is doing is suggesting the optimal point in the trade off between
    holding out for a higher paying tenant and renting the unit sooner, without assuming
    the other landlords are being required to use the same system, that&#x27;s the
    same thing an individual landlord would do if they&#x27;re not colluding.<p>The
    <i>actual</i> way landlords collude is through zoning boards, because then they
    have an enforcement mechanism, i.e. if someone is trying to defect by adding new
    units to alleviate the limited supply then the other landlords can sic the government
    on them, having passed the various laws against constructing those units there.
  score: 0
  posted_at: '2026-11-07T08:33:17Z'
- id: '50402820'
  parent_id: '50402356'
  author: AnthonyMouse
  text: That&#x27;s basically a listing search page that allows you to sort by price.<p>What
    else do you expect &quot;collective bargaining&quot; to do in a market where every
    tenant has a different landlord? Your landlord isn&#x27;t going to care if the
    tenants of 10,000 <i>other</i> landlords threaten to move out. They only care
    if <i>you</i> threaten to move out, and then to credibly do that what you need
    is to show them the unit you could move into which is asking for less.<p>The real
    problem is that you need the unit you can threaten to move into to first <i>exist</i>,
    rather than its construction being inhibited by zoning etc.
