  text: For those of you not familiar, apt-cacher-ultra is fairly new (~9 months old),
    and it can reduce your exposure to this.  It uses a completely different mechanism
    for verifying signatures, and does validate signatures, so if your apt clients
    grab the packages from the cache, it shouldn&#x27;t be open to this bug.<p>The
    next version is going to include TLS and ACME support for the client-&gt;cache
    connection.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;linsomniac&#x2F;apt-cacher-ultra"
