  text: "&gt; <i>There’s plenty of argument about how if a company has an IPO then
    they are, by definition, part of the market</i><p>By portfolio theory, <i>all</i>
    assets are part of the market. Public and private. The challenge is rebalancing
    cost, which is driven by transaction costs. Having a tiny percent of every single
    asset rebalanced every second is great in theory, since you&#x27;ll be diversified
    across the market as a whole, but you&#x27;ll also lose all your money to fees.<p>This
    is why the S&amp;P 500 exists. It&#x27;s a limited number of names that are very
    liquid, <i>i.e.</i> transactable at scale at reasonable cost. As trading fees
    went down we saw larger and larger indices."
