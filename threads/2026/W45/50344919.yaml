  author: weakened_malloc
  text: What they mean is that when a company becomes part of an index, like the S&amp;P500,
    historically, they come in somewhere around approximately rank 500. The S&amp;P
    naturally results in more buying of winners and more selling of losers, so anyone
    who owns an S&amp;P ETF will own that stock when its approximately rank 500, and
    will own more and more of it as it grows to be a bigger part of the index (higher
    rank).<p>Now, however, these IPOs are so big that straight away they&#x27;re at
    like rank 10, or 15 or whatever. The investors who own the S&amp;P don&#x27;t
    experience any of the upside when they grow from rank 500 to 10. They are only
    exposed to the downside (if they lose value&#x2F;rank&#x2F;fall out of the index)
    or the <i>marginal</i> upside if they continue performing and generating returns.<p>The
    point is that given the size of the IPOs relative to other companies, their addition
    to the index has a much more downside exposure than <i>reasonable</i> upside exposure.<p>I&#x27;m
    probably butchering my explanation here, so apologies if it sounds odd.
