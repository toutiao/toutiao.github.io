  title: The SEC Should Block Anthropic’s IPO to Protect the Public | TechPolicy.Press
  fetch_status: success
  content: "Perspective\n\n# The SEC Should Block Anthropic’s IPO to Protect the Public\nMatt
    Scherer / Nov 2, 2026\n\n_Matt Scherer is co-author of the recent report [Brace
    for Impact: Protecting people and the economy when the AI bubble bursts](https://www.openmarketsinstitute.org/s/Brace-for-Impact-Scherer-Jenkins-OMI-October2026-WEB-1.pdf)._\n\n![](https://cdn.sanity.io/images/3tzzh18d/production/07bfadd5db5c963aa461d36b3f5bfa4a34c6f335-1200x675.png)\n_Anthropic
    CEO Dario Amodei looks on as United States President Donald Trump holds a press
    briefing with AI executives following a meeting on artificial intelligence, outside
    the West Wing of the White House on September 29, 2026 in Washington, DC. (Photo
    by Kevin Dietsch/Getty Images)_\n\n[\nRepublish\n](/republish)\n\nThings are seldom
    what they seem when it comes to the finances of the AI industry. The AI ecosystem’s
    [circular business dealings](https://www.bloomberg.com/graphics/2026-ai-circular-deals/),
    extensive use of [financial engineering](https://www.nytimes.com/2026/10/25/opinion/ai-bubble-financial-crisis-lehman.html),
    and otherwise [murky finances](https://futurism.com/artificial-intelligence/ai-companies-hide-debt-off-balance-sheet)
    make it hard for investors, regulators, or workers saving for retirement to get
    an accurate financial picture of AI companies.\n\nThat is particularly true of
    Anthropic, which filed the [registration statement](https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm)
    for its initial public offering (IPO) last week ahead of a planned November stock
    market debut.\n\nThe company’s topline financial figures look quite impressive
    for a startup, with revenues that appear to have grown quickly over the course
    of 2026 and a fairly healthy balance sheet — on the surface, that is.\n\nDig a
    little deeper, however, and a far bleaker picture emerges. Footnotes to the company’s
