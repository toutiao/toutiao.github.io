  text: "&gt; Claude, on the other hand, may behave like an expert on some matter
    one day and act like an idiot in the same area the next, so how can I give in
    to trusting it.<p>That&#x27;s why I say: every session is a new intern. That&#x27;s
    how I look at it.<p>&gt; The claim is that if I&#x27;m any good, I should know
    how to squeeze consistent quality results from LLMs.<p>Claude Opus 5.5 can write
    decent code, better than most juniors I came across, and definitely codes faster
    than me.<p>But is that quality high enough for your standards? It sounds like
    no. So then the next question is, does your project really require your high standards?<p>Edit:
    Since I actually enjoy writing code with LLM&#x27;s, I will give you my reasons.
    That way you might get a better understanding of &quot;the other side&quot;.<p>-
    I love that I don&#x27;t have to think about the mundane implementations anymore,
    and they are done at a very fast pace. That leaves more room for me to think about
    how it all connects together<p>- I love to have a cheap sparring partner always
    available. When I need to think something through, I will always ask the generic
    question to the LLM. To get a fresh view on things.<p>- I love that it&#x27;s
    basically an integrated Stack Overflow.<p>- I love the automated bug hunting and
    fixing. I start it and go do something else. Most of the time, it finds and fixes
    the bug without me ever have to put time in it.<p>- I love how fast it can write
    automated tests, something I always hated doing. And more tests means more confidence
    that any change didn&#x27;t break something else.<p>As a senior, I was already
    moving away from a lot of things described above. Sitting more in meetings, thinking
    about high level stuff, writing technical analysis, guiding juniors, etc. The
    &quot;fun part&quot; was becoming less of my job anyway.<p>I do find it hard for
    me to imagine what it&#x27;s like for everyone who was not at that level yet,
    to be pushed into it. Even juniors are asked to take advantage of these &quot;fast
    interns&quot;, and I&#x27;m not sure what the best way is for them to get to the
    level of actually taking advantage of it."
