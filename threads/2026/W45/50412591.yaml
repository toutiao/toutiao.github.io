  author: apothegm
  text: 'I find LLMs are better than humans at finding bugs in code review. But humans
    are bad at finding bugs in code review in general. That’s not what a good human
    code review accomplishes.<p>A good human code review takes into account the broader
    business context and the structure of the codebase. It finds instances of poor
    design or readability. It suggests patterns or existing utilities that the author
    didn’t make use of, and points out antipatterns.<p>LLM reviews are a great first
    line of defense against certain classes of bugs. But I consistently find major
    issues in code review that the review bots miss — and some that they couldn’t
    have caught under any circumstances.<p>Just last week: 800 lines of unnecessary
    (and clearly LLM-written) code with high cyclomatic complexity that could be easily
    replaced by 50 lines of mostly declarative code by using existing patterns and
    utilities; several missed opportunities for converting incoming data to native
    types up front upon receipt and enforce stricter typing, rather than passing around
    things like dates or UUIDs (or even basic numeric types) as strings and trying
    to parse them over and over; and a case where the author had misunderstood which
    of two possible sources certain data should be derived from, resulting in subtly
    incorrect data being saved to the system of record.'
