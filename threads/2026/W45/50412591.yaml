  author: koonsolo
  text: Most senior developers that steered juniors or interns in the past, are able
    to work with LLM&#x27;s.<p>Sure, LLM&#x27;s are unreliable. So are juniors.<p>Sure,
    LLM&#x27;s code quality is not always great. Well, so is the juniors code.<p>The
    benefit of LLM&#x27;s is that they can work super fast and have a vast amount
    of knowledge. The benefit of juniors is that they actually learn from their mistakes
    and get better over time. LLM&#x27;s stay at intern&#x2F;junior level, even with
    the correct context.<p>So for me, I see each LLM session as a new intern coming
    in. You hand them the right context, give them the correct instruction, and off
    they go. Then they come back, and you will have to judge how detailed you want
    to review what they produced. Or in other words, can you get away with some bad
    code? And for the next session, it&#x27;s a new intern that starts from 0.<p>But
    it is also highly dependent on the project you are working on. If it&#x27;s a
    big complex codebase, LLM&#x27;s will struggle, and they can only do simple tasks
    (however, they can help with testing a lot!)<p>So the teachable thing is unfortunately
    experience:<p>- Know where quality matters, and where it doesn&#x27;t<p>- Know
    what kind of mistakes could be made and should be checked for<p>- Know which things
    can be duck-taped together, because they live at the edge, and which things need
    a proper foundation, because the rest builts on it.<p>So in the end, I think it
    all comes down to making the right trade-offs and the right decisions (which LLM&#x27;s
    are terrible at, by the way). And unfortunately that is gained by the slow process
    of experience.<p>I think it&#x27;s very tough for junior developers right now,
    because they either go fast by letting the LLM&#x27;s do the work, but then they
    learn nothing. Or they go slow by asking the LLM&#x27;s what&#x27;s going on,
    and then do learn.<p>A senior developer never understood the full code-base, and
    never reviewed every line of code. That&#x27;s just impossible. And now every
    developer needs to be a senior developer that is able to steer these new &quot;interns&quot;.<p>And
    just like with juniors and interns, you have to put a lot of effort into it, and
    it&#x27;s not always clear in the end if you gained or lost time :D.
