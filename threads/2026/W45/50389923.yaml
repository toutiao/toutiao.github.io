    \                               \n                                BStU_\n\n##
    Current Situation \n\n### What is happening with virtual reconstruction?\n\nWith
    the dissolution of the Records Agency in June 2021, responsibility for the records
    was transferred to the Federal Archives. At that time, the legislature for the
    first time established document reconstruction as a legal task of the Federal
    Archives (§2, Paragraph 2, 10 Records Act). While the manual reconstruction continues,
    the Federal Archives put under scrutiny the previous research findings of the
    virtual, computer-assisted reconstruction process conducted under the Federal
    Commissioner for the Files (). The project had by then been dormant for some time:
    scanning was discontinued in 2014 and reassembling stopped in 2016.\n\n### Were
    efforts made to continue virtual reconstruction?\n\nRepresentatives of the commissioned
    Fraunhofer Institute for Production Systems and Design Technology () met with
    members of the German Bundestag to explore potential technical and contractual
    solutions. In conclusion, the Federal Archives determined that the project that
    began in 2007 could not be continued in the same manner. The Procurement Office
    was instructed to terminate the old contract.\n\n### What is the next step?\n\nA
    catalogue of requirements will be drawn up, incorporating the technical, qualitative
    and quantitative requirements that are currently necessary for the project to
    achieve its purpose efficiently and sensibly. Based on the developed criteria,
    the Federal Archives will carry out a market survey, with which the search for
    suitable providers can begin. The survey will aim to determine whether and which
    vendors exist for a project of this type. As is customary, interested parties
    will submit an outline showing their plan for implementation along with a rough
    calculation of expenses.\n\n### Will manual reconstruction continue during this
    process?\n\nManual reconstruction will continue as before. In this way, the Federal
    Archives ensures that its legal mandate is fulfilled. A separate department is
    handling the close inspection of bags filled with torn-up documents as well as
    the reconstruction of documents whose individual parts are large enough to be
    assembled by hand so that they can be transferred to the archive as complete documents.\n\n##
    Technical Details on Computer-Assisted Reconstruction \n\n### What part of the
    computer-assisted process did not work?\n\nThe pilot project did not result in
    a suitable technical process that would have enabled the approximately 15,500
    existing bags of “snippets” to be assembled in an assessable amount of time and
    at economically feasible costs. In the fall of 2013, Fraunhofer was able to demonstrate
    that the software developed by its scientists, the so-called e-Puzzler, works
    in principle. However, the process proved unsuited for mass production. Overall,
    the project never achieved the envisaged automated reconstruction rate of at least
    80 per cent.\n\n### Can findings from other reconstruction projects be applied
    to the torn documents?\n\nNot easily. The Deutsche Bundesbank, for example, has
    pieced together damaged banknotes, in which the original paper shares an identical
    pattern and has a clear orientation to a uniform template. This is not the case
    with documents which exist in many different paper forms. Moreover, the amount
    of material involved in many of the other projects, such as the reconstruction
    of Gottfried Wilhelm Leibniz’s estate, is considerably smaller. In February 2022,
    representatives of the Federal Commissioner for Culture and the Media () and the
    Federal Archives visited the Historical Archive of the City of Cologne to learn
    about its system of reconstruction. The staff of the Cologne archive shared its
    experiences working with current scanning technology and provided information
    about the reconstruction process. Here too, however, there was little basis for
    comparison since the documents involve a mass operation conducted in a stable
    institution.\n\n### Why is it taking so long to develop this process?\n\nThe virtual
    reconstruction process has no model to go on and is unique in the world. It involves
    developing a technology from scratch. The process was interrupted and subsequently
    realigned several times as a result of new findings. This, in turn, caused delays
    in scheduling and financial planning.&nbsp;In 2015 the Federal Audit Court (Bundesrechnungshof)
    began scrutinizing the continuation of the project and finished its examination
    in 2017, handing over valuable new impulses to the Records Archive for the continuation.&nbsp;A
    project outline to adapt the process that was submitted by Fraunhofer in 2018
    was thoroughly reviewed and examined. Afterwards, meetings were held to discuss
    terminating the old contract and issuing a new one.\n\n### How much has the pilot
    project cost so far?\n\nSince the project began in 2007, based on contractual
    obligations, around 6.5 million euros have been paid to Fraunhofer or the Fraunhofer
    Gesellschaft from budget funds made available by the German Bundestag.\n\n## Origin
    \n\n### Why are there torn up documents?\n\nDuring the Peaceful Revolution in
    1989/90 numerous documents of the Ministry for State Security () were destroyed
    by its own staff. They were executing destruction orders designed to erase any
    traces of unlawful actions and information about people’s identities. But they
    also got rid of everyday records of the Ministry. Documents were shredded, pulped
    or burnt. Many documents were first torn up by hand and stuffed into bags awaiting
    final destruction. The occupation of the offices by citizens, which began in December
    1989, gradually put a stop to this destruction.\n\n### How much material was destroyed?\n\nFollowing
    the issuing of the order for the destruction of material and its execution by
    the itself in the autumn of 1989, there were further incidents of destruction
    of documents in the first half of 1990. These were approved by political bodies
    in the (Round Table and interim government) albeit not without resistance and
    pressure. They include, for instance, the destruction of records of the (Main
    Directorate Intelligence of the ) or of the sub-division military espionage of
    the NVA (National People’s Army) whose early documents had been stored in the
    archives. In contrast, the destruction of the card indexes of the HA VI (Main
    Directorate for Passport Control) with details of entry into and departure from
    the was in keeping with generally accepted data protection regulations. The exact
    volume of material destroyed by the in 1989/90 could not be accurately calculated
    up to now. A Stasi Records Office research product is currently examining all
    existing sources in order to make a more accurate assessment.\n\n### How large
    is the volume of material torn up by hand?\n\nThe left behind material, which
    had been torn up by hand, but which could still be processed in approximately
    16,000 bags. Each bag contains between 2,500 and 3,500 fragments of torn-up pages.
    There are still roughly 400 to 600 million fragments which represent around 40
    to 55 million pages.\n\n### Could shredded paper be reconstructed?\n\nNo. A few
    thousand other bags contained paper that had been shredded into incredibly small
    pieces in 1990. This material was destroyed back in 1991 after inspection by the
    Stasi Records Office. Hence, there is no longer any paper shredded by the at today's
    archive .\n\n## Process of Reconstruction \n\n### Do we know what the bags contain?\n\nSince
