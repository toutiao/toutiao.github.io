  author: jll29
  text: |-
    It helps that they used bags; because if all snippets were in one bag, then combinatorially, things would be much more difficult.<p>n pieces residing in the same b_i, i&lt;16501 bags can be viewed as a blocking function in record linkage. That means while comparisons are O(N^2), here N=16500 and not N=i*16500. In practice, filtering by compatible color (effectively a 2nd-level blocking function) prunes the search space further.<p>The simplifying heuristic (works not always, but most of the time): &quot;assume that all snippets belong to the same bag&quot;.<p>One important question is how big the individual snippets are - ideally, they&#x27;d contain fractions of more than one line of text on top of each other.
    According to @Pebblebox (see below), “Each bag contains between 2,500 and 3,500 fragments of torn-up pages.”, which means the fragments must be large enough on average to be amenable to language model application.<p>Then I&#x27;d create a data structure with the color of a snippet and its lines of text (either full lines, or prefixes and suffixes at the [left&#x2F;right] fringes):<p><pre><code>  type snippet_type = record
                            snippet_color: RGBColor;
                            text_height:   integer;
                            text:          lines[1..5] of record
                                                            left:  string;
                                                            right: string
                                                          end
                          end;
    </code></pre>
    A statistical or neural language model should be able to piece individual pieces together and come up with a list (sorted by likelihood) of locally probable solutions (called &quot;trellis&quot; or &quot;sausage&quot; in ASR parlance), which can be combined using a beam search.
