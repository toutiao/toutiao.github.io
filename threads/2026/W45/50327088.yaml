  text: Have you heard of the &#x27;g factor&#x27;?  [0]<p>About half of general intelligence
    is this correlation between all the different types. Modern IQ tests measure something
    like 15 types, and pattern recognition is one of them. It&#x27;s the correlation
    between all the types that really matters.<p>It is strongly linked to career success,
    educational attainment, and many other things in life that are typically regarded
    as positive outcomes. Lower g-factors correlate strongly with poor outcomes.<p>Regardless
    of what we&#x27;re measuring (and if it can be improved with various interventions)
    it is something we can measure, seems to be heritable,  and is strongly correlated
    with positive outcomes.<p>The GP&#x27;s phrasing was harsh, but he&#x27;s not
    wrong for insisting that good and bad are not the same thing.<p>Below average
    intelligence is something that should be fixed, not celebrated, and it&#x27;s
    not just some cute and quirky Sesame Street &quot;We&#x27;re all different, but
    the same&quot; thing. It&#x27;s a disorder, like Depression or Schizophrenia.
    It should be treated, and ideally eradicated. People who have it should not be
    stigmatized for it, but they SHOULD be treated and at least taught coping skills
    - as they would be with any other disability.<p>[0] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;G_factor_(psychometrics)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;G_factor_(psychometrics)</a>
