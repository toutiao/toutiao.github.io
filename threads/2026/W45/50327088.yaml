  author: Cthulhu_
  text: I can&#x27;t speak for the commenter, but many people (arguably, most?) manage
    to work around their differences to fit into society, if not make a relationship
    work for at least a while (see also &quot;masking&quot;).<p>But anecdotal (friends,
    family, colleagues, myself), these coping mechanisms aren&#x27;t permanent; masking
    constantly once you&#x27;re living with someone else is pretty much impossible,
    fatigue&#x2F;burnout kicks in often in people&#x27;s 30s, and a lot of coping
    mechanisms people learn as kids are no longer effective or desirable as adults
    (often known as neuroses). Then there&#x27;s attachment issues, also picked up
    as children. These may apply to everyone, but they&#x27;re exacerbated for people
    with personality disorders, mental health issues and&#x2F;or neurodiversity.<p>Figuring
    out what are &quot;built in&quot; &#x2F; genetic &#x2F; medical conditions, unhealthy
    coping mechanisms or trauma responses is a long journey that a lot of people are
    going through.
