  author: graypegg
  text: I know this is probably rather annoying advice to be given, but if you haven&#x27;t
    already, you should talk with a therapist. You don&#x27;t have to be sad to see
    a therapist.<p>Thoughts in your own head can erode very deep grooves in your mind
    that only direct more thoughts in the same direction. Letting someone look in
    and simply point out those tracks is theraputic on it&#x27;s own even if it&#x27;s
    easy to dismiss talk therapy as simply just talking.<p>Reality is just whatever
    your brain synthesizes from your senses, and that means you&#x27;re never perceiving
    any sort of objective reality. We often think we know where those grooves are
    so we can avoid them, despite the fact that we&#x27;re standing in deepest part
    of the proverbial canyon and simply pointing at scratches on the rockbed. We&#x27;re
    predisposed to think in grooves we often think in, and our perception of reality
    resets to reflect that pattern.<p>A good therapist won&#x27;t challenge &quot;I
    am utterly alone in the world&quot;, because that&#x27;s one of those scratches
    you already know &quot;feels like a sad thought&quot; when you think it. You have
    a lot of proof that it&#x27;s true, but I&#x27;d bet you still recognize it as
    something hurtful to think about. Instead, they&#x27;d want to figure out what
    the last scratch was that deepened the floor of the canyon. Some thought&#x2F;belief
    that you knew was hurtful and then was proven to be reality to you. Anyone can
    do that with you (friend, family), but a therapist requires no emotional reciprocation
    because you&#x27;re paying them. It&#x27;s worth it.
