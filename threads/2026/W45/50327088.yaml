  author: conductr
  text: I look at it through my parenting lens. You can’t just ignore it. You have
    to prepare them for a harsh world where they will constantly hear it, feel it,
    and possibly worse. I’d feel my role would be to fully acknowledge it, overly
    embrace it, almost to a theatrical level. This would be privately in the home
    and while they’re young but the idea is to make them understand their difference
    has lots of benefits&#x2F;positives to it. It’s kind of a super power. So they
    have a positive self image and relationship with their difference before they
    have to deal with the external stuff. Then, of course, they’ll still get upset
    when a name caller or bully confronts them but you can lean on the foundation
    of this is just who you are and who you are is awesome. It still hurts ofc but
    that’s inevitable in this world, how you respond is controllable. Someone simply
    vocalizing a fact shouldn’t ruin their day if they’ve been properly “coached”
    to have the fortitude.
