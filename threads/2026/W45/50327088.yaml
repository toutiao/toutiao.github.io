  author: shevy-java
  text: "He appears to have a rather mild form of down syndrome.<p>Now - Down Syndrome
    is typically called trisomy 21, that\nis, you have three copies of chromosome
    21 when normally\npeople have two copies of each chromosome, excluding XY \nin
    regular males (2n = 46 in humans, the diploid\nstate; naturally females would
    have XX, whereas humans would normally have XY, unless there would be a genetic
    change leading to a different ploidy state here as well; normally those with Down
    Syndrome have regular XX or XY condition for that chromosome, only chromosome
    21 has a +1 higher count). If you, however had, look at as many examples as\npossible
    for people with Down Syndrome, you notice a huge\nrange of differences here. That
    is, some are affected by\nthe condition a LOT; others have an almost normal life,\ncompared
    to perhaps average to a bit below average &quot;regular&quot;\nhumans. I also
    noticed something similar for the progeria\ndisease. Now, progeria is much more
    problematic and severe\nthan Down syndrome; but there is a huge range of people
    \nwith different symptoms here. Adalia Rose had a severe \nvariant and did not
    survive past age 15, whereas Tiffany\nWedekind has a less severe variant (but
    also exercises a\nlot and tries to keep healthy, despite already facing \nsignificant
    health problems, at age 48 this year now).<p>So we see a huge pleiotropy of different
    genetic conditions.\nIn most cases exercises, activity and mental mood improves\nthings,
    but there are hard caps and limits. For instance,\nAdalia could not have done
    as Tiffany did, simply due the\ngenetic status being different. It reminds me
    of the movie\nGattaca (now almost 30 years old) - it&#x27;s a bit slow and a\nbit
    over-drama, but has great actors and an even greater\ntake-home message aka &quot;The
    Underdog who never gives up&quot;. \nGood to have seen it at the least once, too."
