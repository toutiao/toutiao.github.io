  author: richardfontana
  text: 'This must have been intended as hyperbole. It is true, in some legal practice
    areas, non-use of Word has been highly impractical or even impossible for a long
    time, mainly because in the mainstream legal profession generally Word quickly
    established a chokehold by the late 1990s.<p>Some courts expect Word format. I
    haven&#x27;t been close to litigation in ages so I don&#x27;t know how common
    a thing this is, but here&#x27;s an example of an apparent &quot;Word only&quot;
    federal court: <a href="https:&#x2F;&#x2F;www.caed.uscourts.gov&#x2F;caednew&#x2F;index.cfm&#x2F;attorney-info&#x2F;word-format&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.caed.uscourts.gov&#x2F;caednew&#x2F;index.cfm&#x2F;attorney-inf...</a>
    . So sure, in a hypothetical where a lawyer stubbornly refused to use Word in
    the context of a filing in that court, you can imagine consequences arising to
    the level of malpractice, but I don&#x27;t think that&#x27;s what they had in
    mind.<p>A more familiar issue to me (and I&#x27;m guessing what that speaker was
    thinking of) is that if you&#x27;re negotiating an agreement with some other party,
    and they are using Word (as they most likely will be), it is going to be highly
    inconvenient at best to insist on using some alternative tool.<p>Red Hat&#x27;s
    in house legal team is, er, was not a law firm of course, but ages ago Red Hat
    attempted to have as many &#x27;back-office&#x27; staff use RHEL as possible,
    with few exceptions related to what was necessary for regulatory purposes. This
    extended to Red Hat&#x27;s legal team, which attempted valiantly for a while to
    use OpenOffice (as was, and I suppose more specifically the RHEL packaging of
    the go-oo fork in those days) for all document-related purposes, including negotiating
    agreements with outside parties who were using Word. This proved to be impractical
    for at least the subset of the legal team that did that sort of work as their
    daily bread and butter, and eventually they got access to Word on Windows on VMware.
    Later on, it became possible for Red Hat lawyers to use OS X and Windows with
    Word, so the issue went away.'
