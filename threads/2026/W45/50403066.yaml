  author: siliconc0w
  text: I think it&#x27;d be interesting for a firm to try to run without traditional
    software.  Like the computer boots, you get a floating orb and you tell it stuff,
    it remembers, it stores it in an optimal format, it is capable of receiving, triaging,
    and sending synchronous or asynchronous communications externally or around the
    organization.  It knows how to build just-in-time tools and can recall any information,
    displaying it in the most helpful format.<p>It&#x27;s not clear what &#x27;work&#x27;
    those orbs would be doing because a lot of &#x27;work&#x27; exists because of
    current frictions due to bad tools or some arbitrage around a lack of trust or
    expertise.  For example with contract redlines, if I just tell my AI what is important
    to me, and you tell yours, they can collaborate on a shared agreement that is
    essentially guaranteed to be fair (modulo trusting the AI).   No emailing word
    documents back and forth, no ambiguity of obligations, no hiding misleading terms,
    etc.
