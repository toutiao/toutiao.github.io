  author: komali2
  text: "This is a fun blog idea, I&#x27;m going to steal it. I&#x27;ve been running
    a software engineering co-op for the last 5 years using only self hosted and FOSS
    software (outside of our email server and discord).<p>The bulk of it is run through
    ERPnext, which handles timesheets, invoices (client and member side), and accounting.
    We built some modules for ERPnext to make that as automated as possible, some
    of which I&#x27;ve finally got together this week: <a href=\"https:&#x2F;&#x2F;github.com&#x2F;508-dev&#x2F;erp_rules\"
    rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;508-dev&#x2F;erp_rules</a>
    <a href=\"https:&#x2F;&#x2F;github.com&#x2F;508-dev&#x2F;books_health\" rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;508-dev&#x2F;books_health</a>
    I used to use Crater for accounting, but it could only handle very basic accounting,
    so I switched to GnuCash, which I found too complicated but also too difficult
    to collaborate with, thus ERPnext.<p>We run member application management and
    BD pipeline through EspoCRM. Outline for wiki. Authentik for identity provider.
    Keila for newsletter emails. Vaultwarden for password management. Docuseal in
    place of Docusign. Nextcloud for basically all Google Drive &#x2F; Docs &#x2F;
    Calendar features, though it&#x27;s quite slow in comparison. Coolify as a generic
    PAAS for MVPs or random member projects. Cal.com for appointments. Oh, to be fair,
    I still just route those to Google Meet.<p>I wish we could get a self hosted Discord
    alternative, however I found Matrix to be too unintuitive of a UX, and member
    participation was plummeting.<p>I&#x27;ve given a couple talks on self hosting
    and FOSS. Especially in the age of LLMs, I think it&#x27;s very viable to move
    away from expensive SaaS. Just this week I had claude adding a ton of automations
    to our ERP, which probably isn&#x27;t as possible for proprietary SaaS. Being
    able to straight up clone the codebase down and read&#x2F;modify it directly makes
    for some interesting possibilities that we can then just as easily deploy ourselves
    since we self host. \nUsing VPSs"
