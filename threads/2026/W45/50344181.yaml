article:
  url: https://electrek.co/2026/11/02/byd-sold-more-evs-last-month-than-the-us-did-all-quarter/
  title: BYD sold more EVs last month than the US did all quarter
  fetch_status: success
  content: "- [BYD](https://electrek.co/guides/byd/)\n\n# BYD sold more EVs last month
    than the US did all quarter, topping 300,000\n\n[![Avatar for Peter Johnson](https://secure.gravatar.com/avatar/1b026f8b84385d3a415d603450446bae2013b15ea16d3bb36cf7225c32c1f603?s=30&d=identicon&r=g)](https://electrek.co/author/peterjohnson/)[Peter
    Johnson](https://electrek.co/author/peterjohnson/)&nbsp;|&nbsp;Nov 2 2026 - 9:24
    am PT \n\n![BYD-EV-sales-October-record](https://electrek.co/wp-content/uploads/sites/3/2026/11/BYD-EV-sales-October-record.jpeg?quality=82&strip=all&w=1400)\n\n[BYD](https://electrek.co/guides/byd/)
    sold over 300,000 electric vehicles in October, a new record and more than the
    US managed in the entire third quarter.\n\n## BYD October EV sales reach a record
    300,000+\n\nThe world’s leading EV maker is showing no signs of slowing down.
    BYD sold 490,168 new energy vehicles (NEVs) in October, up 11% from the prior
    year and the company’s highest monthly total in 2026.\n\nBYD’s battery electric
    vehicles drove the growth, with a record 305,743 units sold, up 37% year over
    year and marking the first time its EV sales have crossed the 300,000 mark.\n\nTo
    put that into perspective, just over 262,500 EVs were sold in the US in the entire
    third quarter combined, according to _[Kelley Blue Book](https://www.coxautoinc.com/insights/q3-2026-ev-sales-report-commentary/)_
    estimates.\n\nAdvertisement - scroll for more content\n\nOctober marked BYD’s
    sixth straight month of higher sales growth and its third straight month of higher
    EV sales. Through October, BYD sold 1,953,700 electric vehicles, up 6% from the
    same period last year.\n\n![BYD-EV-sales-October-record](https://electrek.co/wp-content/uploads/sites/3/2026/11/BYD-EV-sales-October-record-1.jpeg?quality=82&strip=all)\n_BYD
    October 2026 NEV sales (Source: BYD)_\n\nBYD’s all-electric vehicles (EVs) accounted
    for about 63% of total sales last month. Plug-in hybrid vehicles, meanwhile, fell
    17% in October to 177,382 units. Through October, BYD’s PHEV sales fell 11% to
    1,625,969 units.\n\nAccording to BYD’s filing, the company exported 170,194 vehicles
    in October as it expands overseas to drive growth in markets like Europe, Southeast
    Asia, and Central and South America.\n\n![BYD-EV-sales-October-record](https://electrek.co/wp-content/uploads/sites/3/2025/06/BYD-EVs-Europe.jpeg?quality=82&strip=all)\n_BYD
    “Xi’an” car carrier loading Dolphin Surf EVs for Europe (Source: BYD)_\n\nThrough
    October, BYD exported over 1.5 million electric and plug-in hybrid vehicles, nearly
    double compared to last year.\n\nBy the end of 2026, BYD [expects overseas shipments](https://www.reuters.com/business/autos-transportation/byd-targets-more-than-25-million-vehicle-exports-2027-brokerages-say-2026-09-08/)
    to reach about 2 million vehicles. In 2027, that number is expected to rise to
    more than 2.5 million vehicles.\n\n![BYD-first-EV-Flash-Chargers-overseas](https://electrek.co/wp-content/uploads/sites/3/2026/06/BYD-first-EV-Flash-Chargers-overseas.jpeg?quality=82&strip=all)\n_BYD
    opens first Flash Chargers in Germany (Source: Klaus Hartmann/ BYD)_\n\n## Top
