  author: mikestylz
  text: "&gt; Should we assume that all software is more compromised than the kernel?<p>Absolutely,
    the front door has always been unlocked. We were previously protected by the economics
    of exploit detection favoring the developers, but now we have entered a new world.<p>The
    issues arise almost everywhere we look. It&#x27;s frustrating because the user
    experience in edge systems has barely changed in the last fifteen years. We could
    have rode the advances in semiconductor manufacturing to embed more layers of
    protection such as CHERI while slightly slowing down the rate of performance improvements.
    Instead we have only marginally upgraded security and largely added features which
    the users scarcely notice.<p>I am hopeful about the long term prospects of formal
    verification, but having humans reviewing the proof statements and confirming
    they match our desired properties will take many years. Meanwhile, AI assisted
    hacking is an urgent issue. So we will have to delegate implementation, proof
    specification, and proof development to the AIs in the short term. Maybe that
    goes well, but who knows. Interesting times."
