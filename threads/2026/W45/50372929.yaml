  author: pianopatrick
  text: Because the large corporations that fund Linux development and use Linux value
    speed over security.<p>Speed requires a lot of code in the kernel, where that
    code can run fast.<p>There are kernels that do not have a thousand privilege escalation
    exploits. These kernels are smaller and much easier to check for bugs. But those
    kernels are significantly slower.<p>For many use cases, slower is not a problem.
    But for the large corporations who fund a lot of Linux development and use Linux
    in large data centers, every 1% slower can literally be millions of dollars worth
    of additional servers that are required.<p>OpenBSD shows that you can have a Unix
    security model without a thousand privilege escalation exploits. But OpenBSD is
    like 10% slower. So corporations won&#x27;t use it because it would cost millions
    of dollars more per year and some of their software requires access that OpenBSD
    does not grant precisely because that access leads to security exploits (i.e.
    io_uring, eBPF etc. etc.)<p>You could also use like seL4, but that&#x27;s slow
    too<p>So that&#x27;s why. It&#x27;s a business tradeoff between cost of servers
    vs cost of getting hacked, and cost of servers wins.
  score: 0
