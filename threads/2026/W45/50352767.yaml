  text: "&gt; First, you&#x27;re obviously paying indirection tax on EVERY lookup<p>It&#x27;s
    not true for typical use-cases, when objects aren&#x27;t processed one by one,
    but in bulk.<p>&gt; Next, you have type bloat<p>What&#x27;s the problem? Do you
    pay a special tax each time you need create a new type?<p>&gt; Prepare for a lot
    of this<p>That&#x27;s not how it&#x27;s done in C++. You typically have a template
    for handle types, so that <i>PlayerHandle</i> is just <i>Handle&lt;Player&gt;</i>.<p>&gt;
    Handles are also a lot bigger.<p>The article mentions, that handles are typically
    smaller than pointers. A pointer is 8 bytes (on 64-bit machines), but handles
    can be smaller if not so many objects are needed to be created.<p>&gt; Next, you
    have the issue of resizing your memory array.<p>There is only problematic to resize
    it down, which is almost never needed.<p>&gt; dozens of arrays<p>&gt; manage the
    lifespans and scope of all these object pools<p>It&#x27;s not a problem. Each
    subsystem owns its arrays and destroys them only when the subsystem itself is
    destroyed."
