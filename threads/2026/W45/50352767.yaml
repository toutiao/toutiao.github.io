  text: Yes, there are ways to workaround &#x2F; minimize these problems, but again,
    it mostly works for simple systems (like games).  Sure, if you process everything
    &quot;in bulk&quot; so that you don&#x27;t have complex lifespans and&#x2F;or
    indirection, then it is easy.  But if you already have everything &quot;in bulk&quot;
    and aren&#x27;t worried about lifespans, and already freeing in bulk, why do you
    need handles again?<p>Same for other responses. Great, you can just implement
    a lifespan array in every subsystem.  If your sub systems are very simple (e.g.
    single Entity component is the only thing you&#x27;re allocating in a game, maybe
    Resource as well), then sure, its simple.   Not sure what it&#x27;s buying you,
    since you apparently are also freeing all entities and scene elements at once
    too.  But for a complex system where there are many types of objects (dozens or
    hundreds), and where lifespans are complex (some short, some long), then having
    &quot;every system implement its own pool&quot; adds a lot of complexity.  Then
    not only would you want type-safety with a Handle&lt;Object&gt; for every type
    of object, but also some kind of affinity for the sub-system which currently manages
    that lifespan (unless you just have a single Pool for every object type, which
    re-introduces the lifespan issues).<p>Again, other responses I&#x27;ll lump into
    &quot;sounds like for simple systems it isn&#x27;t substantially more difficult
    than pointers&quot;.  I guess if it has a meaningful performance tradeoff, then
    it might be worth it (where a simple free list or using system malloc would be
    too expensive).<p>If you say you don&#x27;t need many objects, so counters can
    be small, and you never need to resize the handles array, so indexes are valid,
    and you don&#x27;t have lots of object types, and don&#x27;t have lots of subsystems,
    and lifespans are purely scoped to subsystem lifespans, and don&#x27;t mind type
    bloat all over your interfaces, then it sounds like handles are a perfect fit.  I&#x27;m
    trying to imagine what&#x27;s so bad about using pointers in such a simple system,
    and what we&#x27;re &quot;solving&quot; (e.g. just &amp;memory_array[next_index++]).
