  author: peter_d_sherman
  text: The most popular program of all time which used the concept of &quot;Handles
    are the better pointers&quot; -- is&#x2F;was the Microsoft Windows series of operating
    systems (from a little company called Microsoft, in Seattle).<p>You have have
    heard of it (or them!)<p>You see, in that OS, individual windows (as GUI elements
    and &quot;Operating System Objects&quot;) were not pointers, but <i>Handles!</i><p>Every
    other OS-controlled object (Bitmaps, Brushes, Fonts, Device Contexts, etc.) were
    also <i>Handles!</i><p>You see, Application Programmers (for normal applications,
    not Ring 0 device drivers) -- were <i>never</i> given direct pointer access to
    OS internal data structures!<p>Instead the OS handed out <i>Handles</i> for different
    OS-managed objects to application code that asked for them, allocated and managed
    the memory they used during their lifetime, and disposed of the memory so allocated
    when the application using them had completed or terminated.<p>Unix&#x2F;Linux
    is similar -- except that the application programmer typically gets what&#x27;s
    called a &quot;File Handle&quot; (because &quot;everything&#x27;s a file&quot;
    under Unix&#x2F;Linux...)<p>But generally speaking (and yes, there are exceptions
    like mmap() on Unix&#x2F;Linux and ring-0 drivers on Windows) the application
    programmer never manages the memory allocation or disposal themselves, they never
    use direct pointers for these objects, they go through an OS proxy to that OS
    structure, that proxy is called a &quot;handle&quot;, and it moves the proper
    responsibility for memory allocation&#x2F;deallocation of the resource to the
    OS, away from the programmer.<p>Compare and contrast this with the use of handles
    (as proxies) and the concept of &quot;Encapsulation&quot; (from Object Oriented
    programming, but equally applicable here) in codebases where you have a central
    Senior developer who writes the central code in a language like C or C++, full
    of pointers, complex data structures, complex dynamic memory allocation&#x2F;deallocation,
    etc., and you have regular developers who write code via the use of Handles around
    that central code, i.e., that central code does not expose pointers or direct
    memory -- instead it exposes an API or functions where regular programmers request
    handles, and subsequently pass the handles with additional API calls to the central
    codebase to gain functionality for whatever object or objects are represented
    by the handle.<p>(You can also compare this to obtaining a token&#x2F;cookie from
    a web API, then passing that token&#x2F;cookie on subsequent requests with different
    additional parameters to different endpoints on a single website&#x27;s API to
    gain different functions related to the use of the back end object or objects
    that that token&#x2F;cookie is related to...)<p>Also, I should point out that
    while replacing pointers with handles in code may make a programming a little
    bit slower, it also allows the handle allocation code to save&#x2F;update a list
    of allocations.  Hybrid code could replace pointer operations with handle allocation
    in a test&#x2F;debug codebase, then replace it again with native pointer operations
    in a release codebase (faster, once all the bugs are worked out).  A handle allocator
    is a powerful tool to check for memory allocation errors in code if it&#x27;s
    programmed correctly...  Allocate the same handle twice -- have your handle allocation
    code can check for that, and raise an immediate exception!  Forget to free it
    at the end of use?  Raise an exception for that!  It&#x27;s a great way to find
    bugs in pointer code!<p>Anyway, great article!<p>Related:<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Encapsulation_(computer_programming)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Encapsulation_(computer_progra...</a><p><a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pointer_(computer_programming)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pointer_(computer_programming)</a>
  score: 0
