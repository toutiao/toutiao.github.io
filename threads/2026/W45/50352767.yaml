  author: jsrcout
  text: 'Your memory is correct.<p>The early Macintoshes used the Motorola MC68000
    CPU, which lacked an MMU. (Not sure if external MMUs were available then, but
    in any case Macs didn&#x27;t have one). And the onboard memory was tiny even for
    the time (128_K_ for the smaller models).<p>So the memory management user API
    was designed to let the system move memory blocks around at will. &quot;Resources&quot;
    (discrete data blocks such as menu definitions, icons, even code segments, all
    with static content IIRC) could even be freed entirely, then reloaded from floppy
    disk when needed again.<p>To make this work, your code would lock a handle before
    dereferencing it into a pointer to the memory block, then unlock it when finished
    accessing it. As an application developer it didn&#x27;t really feel like a burden
    or hassle, just another minor thing to remember, and it did the job.<p>I have
    my doubts as to how this approach would scale to the larger and more complex software
    of today, but it would be an interesting experiment.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Classic_Mac_OS_memory_management"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Classic_Mac_OS_memory_manageme...</a><p>EDIT:
    The Mac&#x27;s memory API was a bit more complex than I remembered. But it was
    all part of being a Mac developer back then - <i>everything</i> on the Mac was
    new and different. For many of us, it felt like the future had arrived. (Maybe
    not so much the case for those coming from LISP machines and the like).<p><a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;inside-macintosh-1992-1994&#x2F;1992-memory&#x2F;mode&#x2F;2up"
    rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;inside-macintosh-1992-1994&#x2F;1992-...</a>'
