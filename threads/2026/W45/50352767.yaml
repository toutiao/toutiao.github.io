  author: program_whiz
  text: |-
    there are serious downsides to this, its a tradeoff and I wouldn&#x27;t say they are &quot;better pointers&quot;.  There are definitely cases where it can work (e.g. uniform objects that either rapidly create&#x2F;destroy or all die at a boundary). This is usually the case with a &quot;simple memory model&quot; domain like games, rendering, etc.  All the work starts and ends at a request, frame, or scene.<p>But for anything else, handles can be trouble.<p>First, you&#x27;re obviously paying indirection tax on EVERY lookup.  Logic like `x-&gt;foo` becomes `memory_allocator.objects[x-&gt;index]-&gt;foo`. You&#x27;re also paying the generation counter tax (assuming you want any kind of safety).  So you also have to do something like this:<p><pre><code>    if (x-&gt;index &lt; 0 || x-&gt;index &gt; memory_allocator.objects.size()) { &#x2F;&#x2F; panic? }
        auto *ref = memory_allocator.objects[x-&gt;index];
        if (!ref) { &#x2F;&#x2F; panic? }
        if (ref-&gt;generation != x-&gt;generation) { &#x2F;&#x2F;&#x2F; panic? }
        return *ref;
    </code></pre>
    Next, you have type bloat.  Hopefully you are making type-safe versions of all these indices so you can&#x27;t just use an aribtrary index into any kind of array right?  Ok well that means now you have double the types (one index type per pointer type).  Ok maybe not the worst, just a lot of boilerplate everywhere.  Prepare for a lot of this:<p><pre><code>   struct Handle { uint64_t index; uint64_t generation }
       typedef PlayerHandle Handle;
    </code></pre>
    Handles are also a lot bigger.  If you&#x27;re memory constrained, adding an additional 16-32 bytes per pointer allocation is painful.  For my programming lang I have a single test file that contains 300K AST nodes, that would be another 9.6MB to parse a single file for handles alone, for noticeably slower performance (300K+ indirections and cache misses).<p>Next, you have the issue of resizing your memory array.  You now are in &quot;write your own garbage collector&quot; land.  You want to consolidate 50% of the memory that is suddenly free?  Well you need to change every index to point the new compacted range (expensive and complex), or manage a free list which potentially increases the memory requirement, and adds complexity, cache coherence issues, etc.  Do your memory lists grow indefinitely?  Do you need to think about having separate lists for short lived and long lived (generational GC style)?  Managing lifespan of objects all sharing one backing storage when the indexes are just integers strewn about is actually _harder_ than doing the same with pointers (just use compacting GC already).<p>Then there&#x27;s the issue of object pools.  You want your data to live in arrays.  Do you put all objects into one master array?  You lose cache coherence &#x2F; iteration speed, and type safety (unless you really bloat and start adding type info to every entry).  If you use different arrays for each you might end up with dozens of arrays, one per type, and also their free lists.  Now you need a way to manage the lifespans and scope of all these object pools.  Suddenly, you&#x27;ve reinvented malloc &#x2F; free and segfault signals.<p>Or you could just wisely use pointers...
