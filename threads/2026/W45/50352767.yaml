    entire operating system conceptualized as a hierarchy of handles.<p>It&#x27;s
    quite the concept isn&#x27;t it!<p>Incidentally, if you look at the Assembly compiler
    output of any &quot;Object-Oriented&quot; programming language (i.e., C++, ObjectPascal,
    etc.), you will notice that it is generating what looks like normal Assembly functions
    for non-Object-Oriented programming languages (C, Pascal, etc.), <i>except that</i>
    each function is getting passed an additional first parameter (typically as EAX
    on 32-bit x86 systems, RAX on 64-bit x86 systems), and that first parameter is
    actually a pointer to the &quot;Object&quot; in memory (pointer to a data structure
    that comprises the &quot;Object&quot; in memory -- since Assembler has no concept
    of higher-level programming language Objects!), but it&#x27;s function is to allow
    a flat traditional function to operate on the data (and call associated related
    &quot;object&quot; functions (via another level of pointer indirection)) -- well,
    it&#x27;s the same <i>principle</i> as a Handle (that of &quot;Indirection&quot;:
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Indirection" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Indirection</a>)
    in effect!<p>&gt;It&#x27;s about encapsulation, and designing the interface between
    objects.<p>Indeed!<p>&gt;How handles are like functions, makes me think. A function
    is a form of indirection, and it can be seen as a handle or interface with defined
    types of inputs and outputs.<p>Exactly!<p>&gt;And the useful of handles&#x2F;proxies
    in testing. Yes, it solves the same question as &quot;dependency injection&quot;
    but in a more functional style.<p>You get &quot;dependency injection&quot; virtually
    for free!<p>&gt;You pass in a handle with well-defined types of vaues, which can
    be treated the same way by functions whether the handle operates with a local
    test database or the actual production one. It&#x27;s being able to have multiple
    implementations, or instances, with the same interface.<p>Yes!  And (added bonus!)
    it <i>decouples</i> the handle using program (client) from the handle serving
    program (server!).  That is, the code is not as strongly linked &quot;bind&#x2F;bound
    together&quot; as code using raw pointers, and can be separated across boundaries
    (across processes on a single machine, across the internet on multiple machines)
    if the data is <i>marshalled</i> (fancy term for if the data of the variable which
    contains the integer value for the Handle is moved from point A to point B, wherever
    point A and B are, i.e., HTTP(S) request + JSON or XML or BSON or other structured
    data exchange format...)<p>Anyway, thank you again for your kind sentiments!'
