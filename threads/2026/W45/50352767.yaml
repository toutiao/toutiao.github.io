  text: A nice analysis of large-scale programming techniques that go beyond the novice
    version of &quot;OO Sux&quot; to the almost secret<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;AoS_and_SoA"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;AoS_and_SoA</a><p>and
    why game engines use entity-component systems, analytical databases are column-oriented,
    etc.  That is,  the classical organization of &quot;objects&quot; as structures
    has a lot of overhead when you&#x27;re doing heavy work.  For instance java reifies
    objects with a big header,  a monitor lock, and other stuff that really adds up
    if you,  say,  are writing a chess engine and need to maintain transposition tables.  And
    even if you are in C++ and there is a lot less overhead,  AoS still has bad mechanical
    sympathy compared to SoA.
