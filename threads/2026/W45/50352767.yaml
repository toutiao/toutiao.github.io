  author: lioeters
  text: Lovely long-form comment, a joy to read. The way you explain the concept of
    &quot;handles&quot; as an abstraction useful in a whole class of situations.<p>&gt;
    Any problem in computer science can be solved with another level of indirection.<p><a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Fundamental_theorem_of_software_engineering"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Fundamental_theorem_of_softwar...</a><p>An
    entire operating system conceptualized as a hierarchy of handles.<p>- Windows,
    GUI elements, &quot;OS objects&quot;<p>- Bitmaps, Brushes, Fonts, Device Contexts<p>-
    File system namespace - Objects as file descriptors - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Everything_is_a_file"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Everything_is_a_file</a><p>-
    Memory handles to manage allocation and freeing without directly handling pointers<p>-
    APIs, token&#x2F;cookie, authenticated requests - and functions<p>It&#x27;s about
    encapsulation, and designing the <i>interface between objects</i>.<p>How handles
    are like functions, makes me think. A function is a form of indirection, and it
    can be seen as a handle or interface with defined types of inputs and outputs.<p>And
    the useful of handles&#x2F;proxies in testing. Yes, it solves the same question
    as &quot;dependency injection&quot; but in a more functional style. You pass in
    a handle with well-defined types of vaues, which can be treated the same way by
    functions whether the handle operates with a local test database or the actual
    production one. It&#x27;s being able to have multiple implementations, or instances,
    with the same interface.
