  text: <i>&gt;, was a way to search for and show decent search results</i><p>Not
    sure what you&#x27;re exactly asking for.  Google&#x2F;Youtube does provide an
    &quot;official&quot; API for youtube searches:<p><a href="https:&#x2F;&#x2F;developers.google.com&#x2F;youtube&#x2F;data&#x2F;reference&#x2F;rest&#x2F;v3&#x2F;search&#x2F;list"
    rel="nofollow">https:&#x2F;&#x2F;developers.google.com&#x2F;youtube&#x2F;data&#x2F;reference&#x2F;rest&#x2F;v3...</a><p>It&#x27;s
    rate-limited but other hacks to scrape Youtube without the API will also be rate-limited
    as well unless you try to trick Google via unapproved hostile methods such as
    commanding an army of residential ip zombies and aggregate it.<p>Fundamentally,
    the index of Youtube videos lives in Google&#x27;s servers so you&#x27;re beholden
    to Google to get results from it.  If the issue is that the Google&#x27;s official
    results from search queries are not surfacing the videos you think are actually
    there, it means you&#x27;d have to build a duplicate (massive) &quot;shadow&quot;
    index to return those missing videos.  To build such a beast, you&#x27;re back
    to hitting the brick wall of rate-limits again.
