  author: numpad0
  text: 'fyi: filesystems have max path length&#x2F;byte count limits, and yt-dlp
    can exceed that(e.g. &quot;&#x2F;var&#x2F;home&#x2F;username&#x2F;Documents&#x2F;Videos&#x2F;YouTube&#x2F;Five-reasons-you-want-powdered-detergents-for-your-dishwasher-fourth-one-surprises-you.mp4.part.012&quot;
    &gt; $THE_MAX_LEN). If this happens, it throws a Python `[Errno 36] File name
    too long` error and yt-dlp gives up.<p>This can be mitigated by adding `-o &quot;%(title).150B
    [%(id)s].%(ext)s&quot; ` to command line, which trims filenames to 150 bytes max.
    There are other options like --trim-filenames, but yt-dlp don&#x27;t apply those
    to the interim part files and that triggers the failure anyway. The relevant issue
    has been reported on GH years ago and closed by the maintaining author with no
    PR from me(hey).'
