  content: "# _A bit about email_\n\nFirst, some terminology; A typical email will
    past through many different components on it's way to the recipient:\n\n    1.
    Sender's MUA2. Sending MSA \n    3. Sending MTA4. Receiving MTA\n    5. Receiving
    LDA and message store7. Receiver's MUA\n\n(These aren't all necessarily different
    machines or even different programs, but it is helpful to give a name for each
    step.)\n\nThe mail user agent (MUA) runs on the user's computer and is what they
    use to send or read messages. Let's say they send something: that message will
    be uploaded to to the submission agent (MSA) which checks the user's password
    before handing off to the mail transfer agent (MTA).\n\nThe transfer agent's job
    is to talk to the other mail servers and get the message to the receiving side's
    MTA. Once received, it's given to the local delivery agent (LDA) to be stored
    until the recipient checks their email. The name \"LDA\" is non-standard, but
    I use it to avoid having four different abbreviations differing by a single letter.\n\n_The
    reason for this structure_ is that when the system was being designed (around
    1980), most organizations could only afford a single server. Maintenance was a
    full time job and updates often required multiple days of downtime. A well-connected
    computer might have dedicated single-digits megabit/second link that worked half
    the time.\n\nThis forced the MTA and MUA distinction: if the recipient's server
    isn't up when the email is set, the sending MTA will save the message and re-attempt
    delivery later. This way, short outages don't cause bounced mail. Since the mail
    client is an interactive program the user runs, a separate message store is needed
    to keep the email until it can be read.\n\nMost MTAs are configured to continue
    retrying a message for five days, usually with exponential backoff: mine will
    wait 5 minutes after the first failure, and increase the interval to one hour
    during prolonged outages.\n\nThe MSA and LDA have always existed in some capacity,
    but have gotten a lot more complicated when people started accessing email from
    their own computers instead or remotely logging onto the server.\n\n## _SMTP_\n\nMost
    communication happens over the Simple Mail Transfer Protocol, including MTA-MTA
    delivery. To narrow it down a bit, I'll pretend do be an MTA sending email to
    blog@maurycyz.com.\n\nThe first step is to look up the receiving MTA for that
    domain:\n\n    #MXmaurycyz.com. 300 IN MX 1 smallcrow.com.#Asmallcrow.com. 300
    IN A 65.109.172.162\n\nEmail is old enough to have it's own dedicated DNS record
    instead of using subdomain hacks or TXT abuse. The number is a priority (smaller
    is higher), which is used if multiple hosts are specified: a big email provider
    will have multiple servers to ensure timely delivery.\n\nSMTP is a relatively
    straightforward text based protocol. The one catch is that most mail servers will
    require a CRLF as a data terminator. This can often be sent with ctrl-m, but using
    a tool that automatically inserts cartridge-return bytes is easier:\n\n    # telnetWill
    send carriage returns as telnet <CR><LF>.25From: <me@nowhere>\n    To: <blog@maurycyz.com>\n
    \   \n    Hello, world.\n\nEach line sent is a command, to which the remote server
    responds with a three digit number followed by human readable text. 200 responses
    mean it worked, 300 is \"carry on...\", 400 is temporary errors which tell the
    sender to try again later, 500 permanent errors mean the email should be returned
    as un-deliverable.\n\n(If this seems similar to HTTP, that's no coincidence. A
    lot of the web, including its header syntax was lifted from SMTP)\n\nThe first
    command is always HELO (or EHLO), followed the sending MTA's hostname. This is
    usually not the same hostname as used in email addresses, but many provider require
    it to match the sender's IP address. Mine doesn't, so if you want to try this,
    put something random that's not a resolvable domain. . The next two, MAIL FROM
    and RCPT TO specify the address to deliver to, and address to forward any bounce
    notifications to. Bounce messages are usually generated one step up from where
    the error occurred: in most cases the receiving MTA has a problem and sends an
    error code to the sending MTA, but by that time MSA has already, forcing a un-delivered
    mail notification. Those notification themselves use an empty MAIL FROM to avoid
    infinite loops.\n\nOnce the address has been specified and accepted, a DATA command
    is sent, followed by the actual email message. This at a minimum, contains the
    \"From\" and \"To\" headers along with some text. The message is terminated with
    a lone period to which the server indicates that the message is handed off.\n\n_Final
    hop MTA's_ should forward the email to the LDA before sending back a status code.
    This ensures that they never accept a message which they can't deliver which would
    result in a error notification. This \"backscatter\" message interacts badly with
    spammers that forge MAIL FROM: it turns their obviously bogus message into one
    that is likely to be delivered and cause annoyance.\n\nThere is no requirement
    for the addresses inside the email to match the ones in MAIL FROM and RCPT TO
    (also known as the envelope). The most common cause of this is a mail that has
    been forwarded. For example, a mailing list will set the envelope destination
    to match each member's email, but keep the original \"From\" header intact so
    that replies work correctly. The envelope from address will usually be changed
    to point to somewhere the list administrator will check for error notifications.\n\nNow,
    it's not that intermediate systems don't modify the headers: Most stages will
    add a \"received\" header to record where they got the message.\n\n_While required
    for MTA to MTA communication_, SMTP is used throughout the whole system. The mail
    client submits email using a different port, but over the same protocol. Communication
    between internal components (i.e. MTA to LDA) often uses the closely related Local
    Mail Transfer Protocol: the main difference is the assumption that the receiver
    doesn't have a message queue and will either deliver the mail immediately or return
    an error.\n\nSubmission usually uses TLS connection to port 465, with the addition
    of a password (in base64):\n\n    \n\nThe one thing that's significantly different
    is the MUA's fetch, which operates on a \"pull\" basis. I won't go into the syntax
    here, but it's not terribly complicated.\n\n... but if you actually try sending
    an email to, say, gmail, based on what I've said so far, it won't work. Some of
    that is due to them enforcing things like the Message-Id header: a unique identifier
    used to de-duplicate mail in cases where the receiving MTA accepts an email but
    the connection drops before the sender is informed about this. This will cause
    the sender to try again later, which duplicating the message.\n\nHowever, a big
    part of it is...\n\n## _Authentication_\n\nBase SMTP trusts that every sender
    is be well behaved: anyone can send email as anyone else. In fact, many hosts
    were configured to accept and relay mail from anyone as a conveyance for when
    someone's usual server was down.\n\nThe original solution to bad behavior was
    to get the culprit kicked off the internet... but that fell apart quickly once
    the network grew and companies began getting involved: the first documented case
    of spam email was sent in 1978 and sold 13 million dollars in computers. While
    authentication doesn't prevent spam, it makes it possible to filter out unwanted
    senders.\n\nVerifying sender addresses is not possible using the MX record, since
    there is no guarantee the same host is used for receiving and sending mail. The
    simplest solution is to publish the sending address in a DNS record:\n\n    @
    TXT v=spf1-all\n\nHowever, that's not quite enough for the email empire. Big-tech
    also wants the email body to be signed with a cryptographic key published via
    a DKIM DNS record. This requires adding a step to sending mails, usually as a
    plugin for the MTA.\n\nI rag on big-tech a lot, but this is actually a sensible
    policy"
