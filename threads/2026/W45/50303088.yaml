  author: walrus01
  text: 'If you really spend some time thinking about, the western &quot;bury in the
    ground&quot; funeral industry is morally sick and wrong. Spending many thousands
    of dollars to &quot;embalm&quot; a person and then thousands more on a big fancy
    wood casket. And high pressure sales tactics to upsell every part of the funeral
    services to the more expensive version of whatever it is.<p>Brief historical recap:
    The western cultural practice of chemical embalming originated before we had reliable
    24x7 electricity and high-powered freezers and modern morgues. If there&#x27;s
    some need to have a corpse around for a period of time until everyone can be gathered
    for a burial, we have the technology to do that without going through some weird
    pseudo-mummification chemical &quot;embalming&quot; process of hooking up a machine
    to pump chemicals into a corpse&#x27;s veins and arteries.<p>edit: This is an
    ugly and uncomfortably thing to think about, but in my opinion, many &quot;funeral
    home&quot; service businesses are optimized to extract the absolute maximum amount
    of revenue by selling products&#x2F;services to a grieving family with upsells
    at a time of their greatest psychological vulnerability and grief.<p>If you&#x27;re
    going to bury people, there&#x27;s a lot to be said for the traditional Islamic
    requirement (or equivalent) of basically, dig a 6 ft deep hole, wrap the person
    in a clean white sheet, and get them buried ASAP without going through all the
    rigmarole of embalming and fancy expensive casket.<p>You want to have a big elaborate
    <i>memorial service</i>?  Ok sure great, whatever fits the needs of the family
    and friends. Spend the GDP of a small developing nation on it if you want to.
    But I truly don&#x27;t see the point in trying to embalm&#x2F;preserve&#x2F;buy
    a fancy casket for a body that&#x27;s intended to rot in the ground. Chemical
    preservation embalming and $8500 caskets are nonsensical.'
