  author: walrus01
  text: One of the things you will learn after spending some time in the poorest parts
    of the developing world where the local cultural&#x2F;religious practices don&#x27;t
    do cremation, is that in many places, there is no equivalent of a &quot;funeral
    home&quot; or professional services for such. Each family is responsible for preparing
    the body of their relative and arranging for the burial themselves. It&#x27;s
    a very visceral, in your face, hands on experience that people can&#x27;t and
    won&#x27;t do in western &quot;developed&quot; countries. Thus the standard practice
    of basically, doing quick prep on the deceased, getting them into a white cotton
    sheet (or local cultural equivalent) and buried quickly.
