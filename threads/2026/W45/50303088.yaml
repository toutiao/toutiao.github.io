  author: ToddWBurgess
  text: I was a funeral director. Left the industry in 2010 due to PTSD. Gave up my
    licence and never looked back. The mental health toll on the profession is a real
    thing given the highly emotional work, low pay, difficult working conditions and
    corporate influences on the industry.<p>I worked with 3 funeral directors who
    took their lives. Anyone in the industry is well acquainted with suicide, yet
    its a topic we avoid talking about. Still, I salute anyone who is still in the
    industry and those of us who have done it have a special bond and I would drop
    everything to help another funeral director if I knew they were in trouble (despite
    being out of the industry).<p>Unless you have done the job you will never understand
    the job and you are probably better off not understanding.
