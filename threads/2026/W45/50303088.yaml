  author: Frieren
  text: "&gt; An inevitable outcome of capitalism<p>That is why there were laws against
    monopolies. But some far-right activists proposed the idea of &quot;if it is a
    monopoly is because is so good that people wants it&quot;. And they run with it.
    It makes no sense as all these monopolies are created by buying competitors not
    by being better. But as it helps the new aristocracy to accumulate power many
    sellouts are in favor of it.<p>This is exactly what made the feudal system so
    unhealthy and hostile towards innovation. Wealth concentration means power concentration
    that makes a few people so powerful that new and different ideas are violently
    attack from positions of power. Kings do not want better farming or better fabrics
    if it means that they lose the control over it. Kings value control over anything
    else, and we are entering a new era of kings, concentrated wealth and stagnation.
    We can change that, break all monopolies, redistribute power and let a dynamic
    healthy diverse economy rise again and bring its fruits to society."
