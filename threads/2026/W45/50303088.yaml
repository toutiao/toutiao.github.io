  author: jayknight
  text: Our church does most of the work preparing the body for our parishioners.
    We have a group that goes to clean and dress the body, then brings it to the church
    in a simple coffin with dry ice until the funeral and burial. Frequently the only
    thing the family has to pay for is for coffin (the church keeps one or two on
    hand that the family can buy at cost) and the cemetery to dig a whole in the ground
    (we&#x27;re not quite hardcore enough to do that b hand). We do insist on burial
    because we see cremation as disrespectful to human bodies that are created in
    the image of God, but usually use a simple wooden coffin and no vault if allowed
    by the cemetery, and no embalming if the family wants the members of the church
    to prepare the body.
