  author: globular-toast
  text: My mum died this year so I have recent experience with this. It does seem,
    like so many things, to profit from the weak. But they do, of course, provide
    a valuable service. I didn&#x27;t really fancy chucking my mum&#x27;s body into
    my hatchback and going down the tip.<p>I didn&#x27;t feel like they pushed hard
    at all to upsell anything, it wasn&#x27;t like a car dealer, but the options were
    definitely available. We chose the cheapest possible coffin because what a ridiculous
    waste of resources otherwise. Literally nobody was going to scrutinise it and
    then it was going to get burnt. I noticed the catalogue had quite a few more pages
    in it, though.<p>Interestingly my dad, newly widowed, was much more sceptical
    of the whole thing than me. He found the language they used quite disagreeable.
    They would refer to the body as &quot;her&quot; and say things like they are &quot;looking
    after her&quot; etc. She had lost almost half her bodyweight before death so it
    is kinda weird that this half matters so much. To us, of course, she had already
    left. We looked after her, they were just moving a body around.<p>But you have
    to think, a lot of people will pay a lot more to buy into this illusion and perhaps
    soften the blow of the death. I feel like you have to confront it one way or another
    so just get it over and done with. I just imagine the souls of the departed watching
    from a higher plane of existence puzzled about why we care so much about their
    former bodies.
  score: 0
