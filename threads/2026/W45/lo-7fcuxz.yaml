    I use Guix for a couple different reasons:

    The community around it is overall pretty nice. There's been a lot of tension lately around genAI use (sound familiar?) but it's still one of the FOSS communities that I resonate with most strongly
    The fact that they try to keep things written in Scheme as much as possible makes jumping around the source very approachable. I imagine that if I were using Nix, I might get used to nixlang but have trouble reading through the C++ source of the tooling itself. In Guix, both of those are Guile Scheme. (As is the init system, and there's some neat things you can do there)
    The UX always meshed better with how my brain expected it to work. I could never quite get used to the arguments that e.g. the nix-env command took. Nix seems to have improved this with their (still experimental?) nix command, but I think I'd already been using Guix for a while by the time that came out
