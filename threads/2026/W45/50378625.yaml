  author: cloverich
  text: I re-wrote one of my apps in Swift. I don&#x27;t know Swift. It&#x27;s been
    fun. When it gets stuck I look at the code; I have it teach me via analogy to
    the e.g. mobx&#x2F;react concepts I do know. In some cases I&#x27;ve improved
    the LLMs code after learning how something works. In others I work it more like
    an informed PM - ok the sidebar opening is slow but... its about 10x faster in
    my electron version. How is the sidebar &quot;mounted&quot; or rendered? I dump
    tricks I know from web dev and ask how analogues; sometimes that breaks its anti-patterns.
    Other times I throw constraints I don&#x27;t know much about - &quot;This is a
    native version, can we aim to make it 3x faster to start-up? How&quot;.<p>Personally
    I was surprised how quickly I surpassed my original code, feature wise. Will it
    stand the test of time? Too early to tell - need to see if I&#x27;m still using
    the native version of the app in a year. But its been more fun and informative
    - and fast - than I&#x27;d expected.
