article:
  url: https://www.wired.com/story/rip-cybertruck-you-were-unloved-unwanted-and-utterly-absurd/
  title: RIP Cybertruck. You Were Unloved, Unwanted, and Utterly Absurd | WIRED
  fetch_status: success
  content: "Elon Musk, in [a post on X](https://x.com/elonmusk/status/2118591788701421573?a=m0883RRcN9XogrZCiOQ&s=46),
    has officially called time on the Cybertruck, stating that “Tesla will be winding
    down production of the Cybertruck at Gigafactory Texas around the middle of next
    year to make room for increased [Cybercab](https://www.wired.com/story/tesla-cybercab-had-a-quiet-debut/)
    production.”\n\nProduced for less than four years, the polarizing pickup is seemingly
    dying as it lived, with the news being greeted in a flurry of replies in praise
    of the EV as well as deriding it. James Star, claiming to be a Tesla employee,
    [posted](https://x.com/SirJamesStar/status/2118592426139091293?s=20) that it was
    “the saddest news! Cybertruck (was) the best car Tesla sold,” right next to a
    user called [Captain Ford](https://x.com/Capn_Ford/status/2118597344874660010?s=20)
    who simply replied to Musk with “Fuck that shitbox.”\n\nTesla has not responded
    to WIRED’s request for comment and clarification that the Cybertruck will no longer
    be made at all. The Cybertruck is exclusively made at Gigafactory Texas, as this
    is apparently the only Tesla facility equipped with the machinery required to
    manufacture the truck’s unique stainless steel body, which supposedly [started
    to rust](https://www.wired.com/story/this-is-why-teslas-stainless-steel-cybertrucks-may-be-rusting/)
    in some cases.\n\nDespite whipping up a fevered number of reservations—allegedly
    more than a million according to Musk, who at the end of 2023 crowed that demand
    was “off the charts!”—the truck failed to sell, shifting [less than 50,000 units](https://www.wired.com/story/where-did-the-one-million-people-who-wanted-a-cybertruck-go/)
    in total by March last year.\n\n[EVWire cites](https://evwire.com/p/tesla-cybertruck-production-ends-mid-2027)
    Kelley Blue Book data suggesting that Tesla sold 11,586 Cybertrucks in the first
    three quarters of this year in the US, down 28 percent year-over-year, adding
    that Musk’s announcement post came about 80 minutes after Tesla raised US Cybertruck
    prices and paused new orders for the entry-level Dual-Motor AWD version.\n\nThe
    Cybertruck proved not only to be wildly unpopular, it was also beset by troubles
    before it even reached customers. In 2023, WIRED covered a leaked Tesla report
    dated January 25, 2022, that showed the Cybertruck had [basic design flaws](https://www.wired.com/story/a-leaked-tesla-report-shows-the-cybertruck-had-basic-design-flaws/),
    and that the preproduction “alpha” version was struggling with problems with its
    suspension, body sealing, noise levels, handling, and braking.\n\nIn November
    2019, when Musk stepped onto a stage in California to launch his new cyberpunk-styled
    electric pickup, he decided to demonstrate the strength of the “unbreakable” glass
    windows by hurling a steel ball at them. In what has now entered into public relations
    folklore, the demo truck’s windows&nbsp;[smashed not once,](https://www.bbc.co.uk/news/technology-50513294)
    but twice. Musk swore, then joked: “There’s room for improvement.”\n\nThere most
    certainly was. In April 2024, a recall was issued for the Cybertruck because its
    [accelerator pedal pad](https://www.wired.com/story/cybertruck-recall-accelerator-pad-tesla/)
    could come loose and get trapped by interior trim, which had the frightening potential
    of pushing the car to full speed.\n\nIn March last year, Tesla had to recall nearly
    all the Cybertrucks it had then produced because a stainless steel trim panel
    [could become detached](https://www.wired.com/story/tesla-cybertrucks-made-with-the-wrong-glue-hit-with-yet-another-sticky-recall/)
    from the vehicle while driving, blaming the problem on the wrong type of glue,
    a new adhesive “not prone to environmental embrittlement.”\n\nBack in May this
    year, Cybertrucks were struck down by the wrong type of grease, which meant that
    their wheels could [potentially fall off](https://www.wired.com/story/the-latest-tesla-recall-wheels-may-fall-off-cybertrucks/).
    In what was then the EV’s 11th recall, it was declared that the Rear Wheel Drive
    (RWD) Cybertruck Long Range model might have faulty brake rotors. In [a notice](https://static.nhtsa.gov/odi/rcl/2026/RCLRPT-26V255-4257.pdf)
    posted by the National Highway Traffic Safety Administration, Tesla stated that
    “brake rotor stud holes may crack and allow the stud to separate from the wheel
    hub.” Such a situation might have seen some RWD Cybertruck owners merrily driving
    along only to then be disconcertingly overtaken by their own wheels.\n\nMusk even
    tried to get President Donald Trump to buy one of his Cybertrucks, creating an
    impromptu Tesla showroom on the [White House South Lawn](https://www.wired.com/story/donald-trump-bought-a-dollar90000-tesla-with-37-recall-notices-against-it/),
    no less. But, sadly, even President Trump must have smelt something was off about
    the truck as instead he shunned the pickup and opted for a 200-mph [Model S Plaid](https://www.tesla.com/models/design#overview)
    in ultra red, clearly impressed with the interior, remarking that “[Everything’s
    computer!](https://news.sky.com/video/looks-good-wow-donald-trump-buys-tesla-car-in-show-of-support-for-elon-musk-13326839)”\n\nAt
    the end of 2024, Karl Brauer, executive analyst at car ranking service [iSeeCars](https://www.iseecars.com/),
    told WIRED that he’d calculated that the [Cybertruck’s six recalls to date](https://www.reuters.com/business/autos-transportation/tesla-is-recalling-over-2400-vehicles-us-nhtsa-says-2024-11-13/)
    at the time made the EV “[worse than 91 percent](https://www.wired.com/story/cybertrucks-many-recalls-make-it-worse-than-91-percent-of-all-2024-vehicles/)”
    of all other 2024 vehicles.\n\nYet, despite supposedly being so unreliable, the
    Cybertruck did find a [small but loyal audience](https://www.wired.com/story/owning-a-cybertruck/).
    WIRED profiled a number of owners last year, all fervently in love with their
    vehicles, but who were periodically [forced to endure insults](https://www.wired.com/story/uncanny-valley-podcast-wired-roundup-satellites-data-leak-cybertrucks-politicized-federal-workers/)
    and taunts that they were Nazis, perhaps referring to an [on-stage gesture Musk
    made](https://www.wired.com/story/neo-nazis-love-elon-musk-nazi-like-salutes-trumps-inauguration/)
    at the start of 2025.\n\nHowever, despite evidence seemingly to the contrary,
    Musk claims he is killing the Cybertruck, not because of its unreliability and
    staggering unpopularity, but because he wishes to focus instead on Cybercab, an
    autonomous EV that is central to Tesla’s robotaxi ambitions but itself has had
    [a rocky start](https://www.wired.com/story/tesla-cybercab-officially-launches-today-its-already-under-investigation/).\n\nCurrently
    operating in Austin only, with a fleet supposedly numbered only in the hundreds,
    Musk apparently wants to ramp up production dramatically since he confirmed on
    an earnings call the first cab came off the line in February.\n\nMusk sees Cybercab
    as very much the vision of Tesla’s future. The CEO has even said that Tesla should
    no longer be regarded as an automaker but as a [robotics and autonomous vehicle
    company](https://www.wired.com/story/tesla-going-all-in-on-robotaxis/). “Cybertruck
    was an incredible ⁠technology development platform and lives on through Cybercab,”
    Cybertruck lead engineer Wes Morrill [said on X](https://x.com/wmorrill3/status/2118598887258644883).\n\n##
