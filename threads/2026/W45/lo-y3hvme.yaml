    GitHub has been continuously writing about scaling up their infrastructure to accommodate the demand from agents. I think Cursor's report on how they're scaling their version control infrastructure is also pretty insightful; particularly the differences in design decisions they've chosen.
    Part of what I've been wondering is how attached we should be to Git. Indeed, Facebook and Google had their own version control systems or forks (Mercurial/Sapling and Piper/Jujutsu respectively) to accommodate their monorepo style of development. OpenAI and Anthropic have both developed their own version control systems, along with infrastructure for hosting code.
    New startups have also been thinking about this problem: Pierre Computer Company (recently acquired by OpenAI) has code.storage and I recently saw a YC company borrow ideas from OpenAI and Cursor in implementing their own Git server.
    I'm pretty optimistic on Jujutsu being a potential next step in VCS. It's more intuitive for humans and reasonable for agents with parallelising work (through workspaces) and merging work (first-class conflicts mean you can defer handling them until you've rebased the workspaces onto your mainline). ESRC seems to be building around Jujutsu, and Tangled accommodates Jujutsu.
