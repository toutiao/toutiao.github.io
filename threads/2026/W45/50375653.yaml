  author: Paul_Clayton
  text: A pipeline can tolerate clock offsets. E.g., an ALU like the Pentium 4&#x27;s
    staggered ALU but within &quot;a single clock cycle&quot; might allow the more
    significant input bits to arrive at a time offset relative to the time for the
    first bits of inputs. Parsing variable length encoded instructions has a similar
    &quot;carry propagation&quot;. Similarly, different stages might use different
    amounts of the cycle. Grid network routing can also localize time synchronization.<p>Getting
    the clock routing delay to approximate the delay that is designed to be tolerated
    seems likely to be rather tricky, but I think clock offsets from imbalanced travel
    distance do not have to make all of that time wasted.<p>I might well be wrong
    as I am only aware of some very general concepts of hardware design. Even in my
    ignorance, I am aware that theoretically possible in some cases is not the same
    as practical&#x2F;worthwhile in general.
