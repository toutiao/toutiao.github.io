  author: Aromasin
  text: I worked there for 3 years, and still catch up with everyone from time to
    time at tradeshows and the occasional social. They definitely seem in much better
    spirits, but I&#x27;ll be brutally honest, many of the people I knew that were
    the top talent have moved to AMD or Lattice. It&#x27;s a lot of new faces last
    time I was there, from a mix of different companies (ADI, TI, Microchip, etc),
    so I guess time will tell whether some fresh bodies do something interesting.<p>They
    restricted wage growth too much for too long under Intel (despite being the only
    growing business unit), so the people with the valuable experience moved elsewhere.
    The Agilex line-up finally looks to be in the place it should have been 3 years
    ago, and it seems like they brought in a good marketing team following the Silverlake
    acquisition, but they still fall in this weird middle-ground now selling &quot;performance-per-watt&quot;,
    which is a hard sell when most engineers optimise for the extremes. If I&#x27;m
    just need a bridge or some glue-logic, I don&#x27;t need a device which will singe
    my thumbprints off while doing that. Generally, if you want better performance,
    AMD does an excellent job, or if you need low power consumption, Lattice is like
    4 or 5x lower or more with just enough fmax and IO to be dangerous. If you look
    read Lattice&#x27;s shareholder briefings, they&#x27;re running away with the
    low&#x2F;mid-range devices up to ~500k LUTs, and AMD is dominating anything 1M+.
    I couldn&#x27;t help but laugh the other day when I saw an Intel reference design
    with a Lattice MachXO5-NX on it. Look at pretty much any datacentre rack now,
    and you&#x27;ll spot 4-64 Lattice devices, when it used to be MAX10s top to bottom.
    Everything else is swept up by AMD.<p>For Altera, Agilex 9 (ADC and DAC converters
    integrated with an SoC FPGA) is probably their most interesting device, but that
    customer base is limited - basically comms and maybe radar with some weird and
    wonderful optical or quantum compute applications. I&#x27;ve heard friends of
    mine in the industry say very good things about it, but RF is not my strength
    so I can&#x27;t comment.<p>In all honesty, they&#x27;ve got an insane fight on
    their hands to regain the market share. They canned their low end road-map when
    Sandra Riviera came in (as a classic Intel VP would do) and put all their eggs
    in the Agilex 7 basket for a long time. They&#x27;ve got Agilex 5 now (and Agilex
    3, which is just the bottom SKUs of 5 with it painted over by marketing to fill
    the gap), which is great for vision applications, but only because they had a
    fantastic video and vision IP team who last I heard have left for ARM.<p>I hope
    they pull it back, as I loved the people there and it had a great culture, but
    it&#x27;s been awfully mismanaged for a while and I question how easy it will
    be to pull it back considering the monopolies and duopolies that are appearing
    in the semi industry right now.
