  author: jpgvm
  text: 'Yeah, basically instead of consuming registers (or HyperRegisters when it&#x27;s
    able to move them into the routing fabric during HyperRetiming) the NoC can be
    used to connect the main hard IPs to logic on the fabric without necessarily having
    to locate that logic directly near the pins.<p>On recent Agilex 7 the NoC exists
    but is fairly primitive and can only be used for DDR (and maybe HBM?) and it adds
    latency over direct pin access and has some other downsides that escape my memory
    right now.<p>The AMD FPGAs on the other hand have a very powerful and flexible
    NoC that runs both vertically and horizontally across the die and can be used
    to not just connect to hard IPs but also user logic across the die.<p>My hope
    is this new NoC is much more like AMD implementation, even if it can only do stuff
    like: Hard IP =&gt; Fabric =&gt; Hard IP as long as you can use it to connect
    F-Tile&#x2F;R-Tile and not just DRAM that will be huge already in terms of saving
    massive amounts of fabric that otherwise gets eaten up by huge busses.'
