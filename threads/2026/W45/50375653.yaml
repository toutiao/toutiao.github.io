  text: "&gt; Even less &quot;quirky&quot; but fully open source designs like GateMate
    have very poor fmax and utilization in my experience.<p>The terrible Fmax on GateMate
    is specifically a result of its &quot;quirky&quot; design. There&#x27;s no dedicated
