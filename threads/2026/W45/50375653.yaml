  author: aseipp
  text: You can buy Agilex devices for like $100 now. They&#x27;re Altera&#x27;s primary
    chip family at this point in every device range. You can also use Quartus for
    free on these devices and even download it all through Docker. Knock yourself
    out.<p>The reality is just that it&#x27;s a lot of work, and Agilex is probably
    an order of magnitude (or two orders) more complex in scope than any existing
    FPGA with reversed or open specs. It&#x27;s going to require a lot of expertise
    even with superhuman assistance. Even less &quot;quirky&quot; but fully open source
    designs like GateMate have very poor fmax and utilization in my experience. If
    people are going to Claude shit out in the EDA space I&#x27;d frankly rather have
    them work on more important day to day mundane things that are still lacking but
    important, eg improved performance, power analysis&#x2F;floorplanning, sdc&#x2F;constraint
    based clock synthesis and related tools, etc.<p>And yes, breaking your device
    is also a risk for some features too (eg Lattice ECP5 bitstream encryption has
    never been RE&#x27;d since it requires blowing fuses.) But the actual problem
    requires far more expertise than having Claude reverse engineer gameboy games.
