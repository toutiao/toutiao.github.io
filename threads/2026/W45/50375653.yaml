  author: Aromasin
  text: Reiterating that my RF knowledge is limited, but they&#x27;re different classes
    of devices. Zynq US+ RFSoC at fastest speed grade is only ~6Gsamples&#x2F;sec,
    ~7GHz bandwidth RF-ADCs. Agilex 9 is 8 channels of 64 Gsps ADC&#x2F;DAC.<p>You
    want to be comparing it with Versal RF. Agilex 9 has about twice the bandwidth
    per channel, and keeps all the DSP in the fabric rather than hard blocks. Seems
    like it has very wide, instantaneous bandwidth and freq range in Ka-band. A few
    of my colleagues have jumped into startups building optical networking devices
    around them.
