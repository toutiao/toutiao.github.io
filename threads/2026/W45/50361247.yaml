article:
  url: https://www.nbcnews.com/politics/2026-election/democrats-house-control-midterm-election-wins-trump-check-rcna603397
  title: Democrats win control of the House and vow to keep Trump in check
  fetch_status: success
  content: "IE 11 is not supported. For an optimal experience visit our site on another
    browser.\n\nDemocrats won control of the [House of Representatives](https://www.nbcnews.com/politics/2026-elections/house-results)
    with what could be their largest majority in nearly two decades, NBC News projects,
    as voters delivered a stunning rebuke to President Donald Trump and Republicans.\n\nThe
    House projection is based on an analysis that Democrats will win about 255 House
    seats — an estimate that could still tick up or down by a few seats but will be
    well beyond the 218 needed to secure a majority.\n\nNBC News has projected the
    Democrats will also flip control of the Senate, putting them in charge of both
    chambers.\n\nDemocrats needed to win a net of just three seats to take back the
    majority. The blue wave washed over many more GOP-held seats than that — from
    the East Coast to Texas’ Rio Grande Valley — most in districts that Trump carried
    in 2024.\n\nA quartet of GOP incumbents in Pennsylvania were defeated. Democrat
    Bob Harvie beat GOP Rep. Brian Fitzpatrick, a leader of the bipartisan Problem
    Solvers Caucus; Democrat Bob Brooks knocked off GOP Rep. Ryan Mackenzie in the
    7th Congressional District; Paige Cognetti bested GOP Rep. Rob Bresnahan in the
    8th District; and Democrat Janelle Stelson ousted GOP Rep. Scott Perry, a former
    chairman of the far-right Freedom Caucus, in the 10th District.\n\n[_ **Follow
    live updates on the midterm elections** _](https://www.nbcnews.com/politics/2026-election/live-blog/election-results-house-senate-trump-live-updates-rcna607376)\n\nIn
    Virginia, Democratic former Rep. Elaine Luria won back her old seat, defeating
    Republican Rep. Jen Kiggans in the Virginia Beach area, while Democrat Shannon
    Taylor upset longtime GOP Rep. Rob Wittman outside Richmond.\n\nAnother big name
    in Republican politics, Rep. Tom Kean Jr. of New Jersey, lost his race for re-election
    to Democrat Rebecca Bennett. Rep. Victoria Spartz, R-Ind., the first Ukrainian-born
    member of Congress, who frequently clashed with Trump and GOP leaders, also was
    defeated. And in Colorado, Democratic state Rep. Manny Rutinel trounced GOP Rep.
    Gabe Evans.\n\nOne of the biggest prizes of the night for Democrats was Richard
    Ojeda II’s upset of Rep. Richard Hudson, R-N.C. As chairman of the House GOP’s
    campaign arm, Hudson was responsible for protecting GOP incumbents and the majority.\n\nThe
    Democrats’ victory was widely seen as a referendum on Trump’s unpopular policies,
    including his tough immigration crackdown, the eight-month Iran war and tariffs
    on U.S. allies that drove up the prices of gas, groceries and other goods.\n\nWhen
    the party takes control of the chamber on Jan. 3, it will be the first time in
    Trump’s second term that he won’t have full control of Congress.\n\nSince he returned
    to the White House, Trump has tested the limits of his executive powers, dismantling
    federal agencies [through the Department of Government Efficiency](https://www.nbcnews.com/data-graphics/2025-doge-trump-administration-federal-job-cuts-total-rcna588589),
    unilaterally imposing sweeping tariffs and [rescinding congressionally approved
    funding](https://www.nbcnews.com/politics/congress/lawmakers-slam-trumps-unlawful-move-cut-810-million-federal-funds-rcna599942)
    — all while the GOP-controlled House and Senate mostly looked the other way.\n\nThe
    House Democratic leader, Rep. Hakeem Jeffries of New York, who barnstormed across
    the country in the final weeks of the campaign, is expected to make history on
    Jan. 3 when he is sworn in as the first Black speaker of the House.\n\nHe walked
    into his election night watch party to raucous cheers as the rap song “Unbelievable,”
    by the Notorious B.I.G., played on the speakers. The midterm results show the
    “American people are crying out for transformational change,” Jeffries told supporters.\n\n“Today
    begins the great American comeback. The American people have spoken all across
    the land, in the North, in the South, in the East, in the West, in the Midwest,
    from sea to shining sea. The American people have spoken and made clear they’ve
    had enough of the extremism, enough of the corruption,” Jeffries said at the gathering
    in Washington.\n\n“They want a Congress that’s going to deliver for the American
    people,” he said, “and that is exactly what House Democrats will do as soon as
    we get into office in January.”\n\nWith their new majority, Democrats will take
    control of House committees, gaining subpoena power and the ability to conduct
    oversight investigations of Trump’s administration, family and business ventures.
    That could take up considerable time and resources for Trump and his allies, forcing
    uncomfortable public hearings or prompting legal showdowns over subpoenas.\n\nAnd
    in a callback to Trump’s first term, some Democrats have vowed to impeach him
    for a third time, though there is an internal debate about whether that’s the
    right political path.\n\nJeffries told NBC News’ “[Meet the Press](https://www.nbcnews.com/meet-the-press/video/hakeem-jeffries-says-dems-haven-t-ruled-anything-out-amid-trump-impeachment-calls-full-interview-265068101992)”
    that Democrats “haven’t ruled anything in and we haven’t ruled anything out” on
    impeachment.\n\nRep. Robert Garcia, D-Calif., now poised to become chairman of
    the powerful Oversight Committee in January, [said his panel](https://www.nbcnews.com/politics/congress/democrats-vow-aggressive-investigations-trump-corruption-election-rcna595621)
    plans to focus on “Trump family corruption,” including Trump’s [cryptocurrency
    ventures](https://www.nbcnews.com/politics/donald-trump/financial-disclosure-1-billion-cryptocurrency-earnings-meme-coins-rcna352497),
    which have earned him more than $1 billion. The panel will also scrutinize “abuses”
    by ICE and the Department of Homeland Security, corporate corruption and the Jeffrey
    Epstein files.\n\nAside from investigative power, House Democrats will also command
    the ability to pass legislation with a simple majority. Jeffries has said Democrats
    would focus on [four areas](https://www.nbcnews.com/politics/congress/healthcare-tops-democrats-list-win-control-house-2026-rcna595354):
    reversing Trump’s cuts to Medicaid, extending the Affordable Care Act credits,
    restoring congressional authority related to tariffs and stopping Trump’s war
    with Iran.\n\n“I wouldn’t characterize it as investigating them like crazy. We’re
    going to follow the facts, apply the law, be guided by the Constitution and let
    the chips fall where they may,” Jeffries told reporters at Democrats’ campaign
    headquarters before the election.\n\nThe results are a blow to Speaker Mike Johnson,
    R-La., who was [launched from obscurity](https://www.nbcnews.com/politics/congress/mike-johnson-elected-new-speaker-house-vote-rcna122151)
    into the top job and has led House Republicans for the past three years. It’s
    unclear whether Johnson, a close Trump ally, will fight to remain as minority
    leader or step aside; the latter would trigger a fiercely competitive GOP race
    to replace him.\n\nHouse Democrats had the political wind at their backs; they
    needed to flip a net of just three seats to win back the majority they lost in
    2022. And [Trump’s dismal approval rating](https://www.nbcnews.com/politics/2026-elections/presidential-approval-polls)
    was a major factor in the GOP’s loss.\n\nHistorically, the president’s party tends
    to [lose seats](https://www.presidency.ucsb.edu/statistics/data/seats-congress-gainedlost-the-presidents-party-mid-term-elections)
    in midterm elections. Only in two midterms in the modern era did a party buck
    that trend — in 1998, when voters punished Republicans for impeaching President
    Bill Clinton, and in 2002, as President George W. Bush rallied support in the
    wake of the 9/11 terrorist attacks.\n\nStill, the battle for House control played
    out primarily on GOP turf this cycle, with Democrats already holding 215 seats,
    including a dozen in battleground districts. On top of that, results of this cycle’s
    mid-decade redistricting wars ended up favoring "
