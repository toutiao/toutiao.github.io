    AV1 is royalty free and better!<p>Real example, I recorded the world series using an ATSC antenna, and I re-encoded a 90 second sample using a bunch of different settings on a 32-thread znver5:<p><pre><code>  # Codec        Flags                     Size         Speed
      - -----        -----                     ----         -----
        Original     (Raw ATSC mpeg2video)     77MB (100%)  N&#x2F;A
      1 libx265      -preset slower -crf 24    37MB  (48%)  0.245x
      2 libsvtav1    -preset 3 -crf 44         36MB  (25%)  1.87x
      3 libsvtav1    -preset 1 -crf 35         19MB  (25%)  0.556x
    </code></pre>
    (NB: The same CRF results in a higher quality video at slower presets, this was for archival so we&#x27;re using the some of the slowest presets).<p>(1) and (2) are completely indistinguishable from the original unless I go frame by frame looking for transient motion artifacts. (3) is only distinguishable in one shot where a dark background was washed out. Not only does AV1 produce results just as good as H265, it encodes quite a bit faster for the same size&#x2F;quality.<p>That said, I&#x27;ve watched so much h264-encoded video over the past decade I think I&#x27;ve been trained to perceive the subtle visual &quot;snow noise&quot; as a sign of a high quality video: I find how AV1 blends backgrounds more visually objectionable than the dithering in H265, even though I think it&#x27;s objectively higher fidelity. Similar to how I find high frame rate video &quot;fake&quot; after having watched NTSC TV for the first half of my life.<p>These were the CRFs necessary to get the same visual quality with libx265 at faster presets and the resulting sizes:<p><pre><code>  hevc-slower-24          37MB (used above)
      hevc-slow-21            56MB
      hevc-medium-20          57MB
      hevc-faster-19          52MB
      hevc-veryfast-18        60MB</code></pre>
