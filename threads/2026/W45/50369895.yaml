  content: "By [danielrh](https://graphics.stanford.edu/~danielh)\n\n_Watch on YouTube_\n\n[Play
    it in your browser](https://fireflyk64.github.io/dosbox/)\n\nWhen we were kids,
    my brother [Patrick](https://github.com/pathorn) and I would steer our space fighter
    with one of us on controls and the other on the lasers and afterburner boost.
    We always dreamed of playing the Wing Commander series cooperatively as wingmates
    rather than as a two headed hydra in a single craft.\n\n## In the beginning we
    were searching for where we were\n\nOn October 4, 2015 as I was playing the classic
    Wing Commander in Dosbox I realized the whole memory probably fit in that 640K
    Bill Gates apocryphally said “ought to be enough for anybody”. If I could dump
    the memory and identify the locations that held the X,Y,Z coords for the player
    & wingman we could let the network packets control the wingman.\n\nThe actual
    quote\n\n“I have to say that in 1981, making those decisions, I felt like I was
    providing enough freedom for 10 years. That is, a move from 64 K to 640 K felt
    like something that would last a great deal of time. Well, it didn't.” [Source](https://csclub.uwaterloo.ca/resources/tech-talks/1989-bill-gates-talk-on-microsoft/)\n\n_Here
    is a breakdown of the megabyte of addressable DOS memory and the 64K data segment
    where Wing Commander puts its game state._\n\nThis presented a clear problem to
    attack: out of fewer than a million bytes how would we identify that location?
    I decided to simplify the problem by trying to empty the game of other entities.
    A stopped player shouldn’t change coordinates. We could snapshot the memory twice
    when stopped to identify “background” memory churn. Then burst forward and measure
    again. If we didn’t turn (mouse was disabled) we might only change one axis. The
    next problem was to find an empty region of space. We had to start without our
    wingman Paladin, since he would move with us. After a miserable mission, letting
    the nefarious space cats overwhelm Paladin and running back to the spacecraft
    carrier, the Claw, the next mission was primed for a flight through empty space.
    I launched and flew directly ahead until everything despawned and took the memory
    snapshots using the DOSBox MEMDUMPBIN debug-command.\n\n![Hornet cockpit on launch,
    the right VDU showing Auto Targetting, Target: None](img-target.png)\n_The Hornet
    cockpit on launch, where the VDU confirms an empty patch of space with nothing
    to target._\n\nNow I had to discover anything that had not changed between the
    memory snapshots where my star fighter was in the original position but things
    that had changed when my star fighter moved.\n\n(snapshot ⊙ snapshot) ∧ (snapshot
    ⊕ snapshot)\n\n_253 bytes churn when stopped, and 650 change during a move. 413
    do both. By cross referencing with the chase cam, the total is only 132 bytes._\n\nThere
    were 35 distinct clusters of bytes that changed in the data segment. By inspecting
    these visually and looking for floats or small integer changes when I moved, I
    narrowed it down to a dozen locations it could be. I went to the chase camera
    view as well, and this helped to narrow it down to `13D3:A9C2`. I had the DOSBox
    debugger add integers at that address with its SM command and that caused the
    ship to jolt forward to a new location.\n\n This technique identified velocity
    as well at `CAE2`, since thre were three 32 bit ints that zeroed out when the
    craft was stopped. \n![The 64K data segment of the October 2015 dumps, one byte
    per pixel, with the candidate rows labelled: position at A9C2 and its camera copy
    at AC9E, set speed at B9F6, velocity at CAE2 and CDBE, the stack](img-filter2015-annot.png)\n_Craft
    position, camera position, set speed and velocity changes lit up in yellow_\n\nI
    had fun driving my ship around with the memory editor and reproduced it around
    the Claw and other NPC ships.\n\n## Then we searched for what we faced\n\nI set
    it down for nearly a year but in September 2016 I decided to write a small tool
    to automatically compare DOSBox snapshots instead of using the vbindiff GUI only.
    Directionality turned out to be more difficult so I set down the problem for a
    few more months and picked it back up in November.\n\n![The original 2016 diff
    image of a megabyte, rotated to a strip: a single bright band near the data segment
    and a noisy block near the EMS page frame](img-orig2016_strip.png)\n_Diff of two
    DOSBox memory dumps from turning. The bright band is the data segment._\n\n_In
    the 64 slot arrays, each slot is 12 bytes. Slot 0 is the player, 0x3D is the camera
    and 0x3F is a temporary slot. The camera copy caused each value to appear twice
    0x2DC bytes apart._\n\nTo find the memory location of the rotation, I needed to
    look harder. As it happened the vectors were made of 4 byte scalars with 256 as
    1.0 and valid positive vector positions between 0 and 255. This meant that most
    small rotations only changed a single byte. However, fortune was smiling on me
    that day because of what appeared to be a programmer joke at the time. Wing Commander
    reserved 64 slots for entity properties. In hex this would span numbers from `0x00`
    to `0x3F`. However the programmers decided to use `0x3F` for temporary usages
    and place the camera in `0x3D`. Since 3D graphics were still nascent, the programmers
    may have thought it a good laugh to write `0x3D` every time they needed to manipulate
    the 3D camera. That put a temporary variable two slots from the camera variable.
    And up and forward were also next to one another. This gave a nice wide region
    where I could locate those single byte changes. The first byte I understood was
    the y of the right vector; the print window I put around it happened to cover
    the camera's copy of up, which is where the overwrite experiment started. Furthermore,
    I rolled the ship over, and tripped sign extension, which caused all 3 adjacent
    bytes to switch from `0x00` to `0xff`. Between these two facts, I noticed the
    temporary and camera bytes in the hex dumps. Writing to them did not help, since
    they were overwritten every frame, but luckily I wrote some extra bytes to the
    next vector as well, which was forward[0]. This caused a noticeable shift in the
    starfield and meant that I could now start investigating the code.\n\n_The up
    vector array has the camera copy at offset 0x3D, an empty slot at 0x3E, and the
    temporary intermediate value at 0x3F. Int32 where 256 means 1.0, thus the nonzero
    unit vector axis would be 00 01 00 00 in little endian._\n\n![Annotated picture
    of changed bytes for a stopped versus yawed pair from the advanalysis dumps, with
    arrows to the same arrays](img-annot_yaw.png)\n_Yaw from level flight where forward[0]
    has a 9 byte change and up[0] changed from 00 01 to 7E 00._\n\nI put memory watchpoints
    on the addresses and traced the vector-add function called by the per-ship physics
    function called by a per-frame function and eventually the main loop.\n\n_Call
    stack after memory watchpoint._\n\nIt was now time to locate the byte sequences
    in IDA and start annotating the game. Wing Commander Multiplayer was now just
    a matter of repeating these techniques and figuring out how to puppeteer one ship
    from another's input.\n\n## Then we searched for how to act\n\nDecember 2016 had
    shattered my illusion that we would be able to drive Wing Commander with writes
    to global memory alone. The details of manifesting laser fire or heat seekers
    were far too complicated to puppeteer solely from the addresses. We would need
    to co-opt the very functions in the original game to get the most accurate experience.
    One initial thought was to “will” the program counter to the right place, but
    we would need a way to insert arguments and return back from whence we came. Moreover,
    many of the functions were in various overlays that required indirection to invoke.
    It appears that Borland had a different overlay per compilation unit (C++ file)
    and they were dynamically loaded in different locations depending on the path
    the player took beforehand.\n\n_Borland overlays: table of jmp far thunks._\n\nPatrick
    and I had to "
