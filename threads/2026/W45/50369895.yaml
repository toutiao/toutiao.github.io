  text: |-
    Author here: in 2015, I was playing the classic Wing Commander in DOSBox and
    suddenly realized the game state fit in the 64k data segment.<p>Over ten years my brother and I went through a set of experiments (stop
    and go, turn, communicate) while probing the memory. We uncovered
    where the variables were, how to inject calls into
    the game functions, and how to sync the gamestate across the
    network, so we can fly the story missions together.<p>My favorite finding is that the camera lives in entity slot 0x3D, which is
    possibly a &quot;3D&quot; reference by the original developers.<p>You can play it at <a href="https:&#x2F;&#x2F;fireflyk64.github.io&#x2F;dosbox" rel="nofollow">https:&#x2F;&#x2F;fireflyk64.github.io&#x2F;dosbox</a> in browser. If
    you own Wing Commander, drag in the installer since no game files are
    hosted. If you don&#x27;t, the page will load the original DOS&#x2F;3Dfx version
    of Vega Strike, before I open sourced it. I upscaled and redid DOS Vega
    Strike art using AI, but it now has multiplayer and a similar feel.<p>I&#x27;ll be in the lobby for the next few hours if anyone wants to fly together.<p>Disclosure: I also used AI for the final step to help compile for the
    browser and port our TCP networking stack to WebRTC with voice and solve
    a few lingering bugs.
