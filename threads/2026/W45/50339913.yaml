  author: momentichenry
  text: 'Hey there! This is Henry, one of the engineers working on Mo. Thanks for
    reading our post! A lot of interesting stuff here:<p>- Precision&#x2F;recall vs
    pass&#x2F;fail: I really like this point, and I would say QA bench is actually
    not a great fit for measuring pass&#x2F;fail currently, because all of the fixtures
    have numerous bugs in them, and almost all agent runs find at least one (so the
    fail rate is basically zero). My assumption would be that recall is correlated
    with pass&#x2F;fail accuracy, but we are working on a PR-review variant of QA-bench
    that I think would be more suited to measuring pass&#x2F;fail directly.<p>- I
    think the insight about allowing &quot;unsure&quot; is interesting, and this is
    actually similar to what we have for some of the completions in regular Momentic
    tests, although I&#x27;m curious how you generate something useful for the user
    from the agent basically saying &quot;there might be a bug in this code but I
    don&#x27;t know what it is.&quot;<p>- Internally, if Mo can&#x27;t reproduce a
    suspected bug it gets discarded. Although we do review some of these to make sure
    that there aren&#x27;t issues with the reproduction agent.<p>- QA bench has zero
    planted bugs; they&#x27;re all from the original source. Initially, we did try
    planting bugs and even generating apps with given bugs using an LLM, but we found
    that this didn&#x27;t actually help us establish the ground truth because the
    agents were still finding bugs that we hadn&#x27;t planted and needed manual review.'
  score: 0
  posted_at: '2026-11-03T00:15:39Z'
- id: '50346251'
  parent_id: '50345240'
  author: momentichenry
  text: Hey there! I&#x27;m not 100% sure how many came from Mo originally, but I
    can add a bit about our process:<p>- The candidate ground truth bugs are generated
    using runs from all agents<p>- Every candidate gets reviewed by the other agents
    to generate a recommendation (just makes human review easier)<p>- A human reviewer
    makes the final call (no candidates are discarded just because Mo couldn&#x27;t
    reproduce)<p>And in terms of grading the final runs:<p>- A lot of the final runs
    still found a small percentage of novel bugs (5-10%), because it&#x27;s extremely
    difficult to build a comprehensive list of all bugs, even after hundreds of runs.<p>-
    Nothing that didn&#x27;t match was auto-discarded (read - it wasn&#x27;t rejected
    because Mo couldn&#x27;t repro).<p>- All unmatched findings were run through the
    same human review process as above.<p>- All the runs were regraded after human
    review to get a final score with zero unmatched findings.<p>One interesting thing
    we did notice during this is that Codex and Claude tend to converge on the same
    findings run over run (very few initially unmatched findings on final runs), whereas
    Mo tends to find a lot more novel bugs on ever run.
  score: 0
