  author: momentichenry
  text: Hey! I&#x27;m Henry, one of the engineers working on Mo. To answer your questions:<p>-
    I expect there will be many more competitors to come, as there already are. I
    also think achieving these performance improvements is non-trivial and depends
    on a lot of internal tooling we&#x27;ve built over the last two years (see next
    answer). As with any software, there will obviously be new competitors that match
    our historical performance eventually, but we will also be continuing to evolve
    our product. As you can see from the recall numbers in the benchmark, there is
    still a lot of room for improvement.<p>- Mo is really our second product. Over
    the last two years we&#x27;ve been building the Momentic e2e test framework and
    tooling around it, which allows engineering teams to own quality by authoring
    tests in plain-english and maintaining them with little to no effort. Mo builds
    on top of that nicely because we&#x27;ve already spent a lot of time tuning the
    underlying tools so that agents can use them efficiently to get better results.<p>-
    Real device support is already in the works! It should go live in the next couple
    of weeks. Would love to connect once it&#x27;s ready.
