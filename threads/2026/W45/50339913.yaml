  author: jeffan
  text: Thanks! I&#x27;m Jeff, one of the co-founders.<p>1. Mo generates its own test
    cases in natural language, but you can ask it to write Playwright and maintain
    it in your repository if you really want. We actually do have a regression testing
    product as well where tests are just natural language in your repository. For
    that product yes there is some vendor lock-in since this is a proprietary format
    that only our CLI translates into browser actions. But ultimately since it&#x27;s
    natural language it&#x27;s pretty portable :)<p>2. Mo is focused on exploratory
    testing and so is inherently non-deterministic. But the regression testing product
    has a ton of caching built into it that we&#x27;ve written about in the past (not
    just a single css selector). <a href="https:&#x2F;&#x2F;momentic.ai&#x2F;blog&#x2F;teaching-browser-agents-user-intent">https:&#x2F;&#x2F;momentic.ai&#x2F;blog&#x2F;teaching-browser-agents-user-intent</a>
    This is a big part of reliability and latency optimization, otherwise your CI
    would just hang for hours on any reasonable suite.<p>3. I would say the regression
    testing product was very much SDET&#x2F;developer focused since it required you
    to have a codebase and use Git. Mo is meant to be super easy for anyone to onboard
    onto and lower the barrier to entry, so we&#x27;re hoping we&#x27;ll see more
    product owners, PMs, QA and even leadership use the product. But devs are always
    going to be our bread and butter, we ultimately tried to build the product we
    wanted to use ourselves.<p>4. We&#x27;re optimized for recall (# of bugs you find
    in a given amount of time). The bench shows we find ~3-5X more bugs compared to
    Codex and Claude Code, with approx. the same precision. The service costs more
    than the raw harnesses for sure, but that&#x27;s the all-in cost including our
    infra, parallel agents, etc.
