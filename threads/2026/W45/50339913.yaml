  author: jeffan
  text: 'Hey, Jeff I&#x27;m one of the co-founders. Totally agree for a small side
    project, having a single sub-agent that focuses on vibe testing is enough.<p>But
    I would say even for medium sized features, it&#x27;s the same difference between
    asking your Codex to &quot;review the code make no mistakes&quot; and using a
    paid AI code review tool.<p>As your product surface area increases, you need fundamentally
    different agent architecture to maintain context over time and across bug bash
    sessions. The benchmark apps are probably among the simplest apps we test on,
    and even those show a massive perf. gain. For large companies with 1000s of important
    user flows, have to support different viewports, and need to work across mobile&#x2F;web&#x2F;desktop,
    asking Codex to test it all before a big launch is not scalable.<p>Even basic
    constraints like the # of browsers&#x2F;devices you can run concurrently, the
    amount of reliable TPM you need, and how many agents can run on a single box become
    problematic. You also have to think about ktlo: how do you evaluate new model
    releases in a data driven way, how does agent become more efficient itself over
    time, etc.'
