  author: momentichenry
  text: Hey! I&#x27;m Henry, one of the engineers working on Mo. You&#x27;re looking
    at the right numbers, but the takeaway is slightly different from ours.<p>The
    main thing we&#x27;re trying to show is that Mo finds over 3x as many correct
    bugs in the same amount of time as the next-best QA agent. This is the main thing
    we optimize for since the worst thing you can do in QA is miss a real bug and
    ship broken code to prod. Currently, the tradeoff you make for that better recall
    is higher cost. I would say the precision is more or less comparable, but marginally
    lower.<p>Obviously we&#x27;d love to be beating every other agent on all of these
    numbers, and we&#x27;re actively working on it, but for now this is an honest
    and transparent look at how the tool is doing.<p>Feel free to take a look at the
    full writeup for more detail!
