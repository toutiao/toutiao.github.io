  author: jeffan
  text: Heyo! I&#x27;m Jeff, one of the co-founders here. Mira itself is for code
    review and does no e2e analysis. We actually automate your live web app or mobile
    app, so we&#x27;re catching a whole class of issues that are just not possible
    with static analysis (is the button cut off in the UI? does your AI agent respond
    correctly? does the video render correctly? etc.)<p>But to your general point,
    this benchmark is showing we are finding 3-5X more bugs than the best OSS performance
    out there right now. We did also try it on tester army e2e and it underperformed
    Codex + Playwright MCP (this will make it in the benchmark soon).<p>The &quot;better&quot;
    comes from custom agents and massively parallelized infrastructure. I&#x27;m not
    sure how many folks want to or even can self-host fleets of GPUs, browsers and
    Mac minis.  We&#x27;re happy for folks who can but our current offering is for
    those who want to find the most bugs with the least amount of effort.
