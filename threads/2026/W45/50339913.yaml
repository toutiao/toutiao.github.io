  author: jeffan
  text: Hey there, I&#x27;m Jeff (one of the founders). To be honest I don&#x27;t
    know if there is or will be any kind of moat in SaaS. But today:<p>1&#x2F; General
    purpose models are still not good at this task. I would personally love it if
    I could trust my agent when it says its done after a 24h build. But whether it&#x27;s
    because of sycophancy, context degradation over time, or something else coding
    agents still struggle to verify their own work. Maybe with 1B context windows
    this will change.<p>2&#x2F; Infra is still annoying to setup. We wanted to provide
    a unified interface across web, mobile and soon desktop as well. So users don&#x27;t
    have to worry about provisioning, concurrency, security, etc.<p>3&#x2F; As with
    any SaaS, even beyond the initial build, maintenance is a headache. I think most
    companies would rather not consider agentic QA as one of their core competencies
    and investments. It takes a ton of eng effort to keep the lights on, continually
    update the models used, train new ones, groom ground truth, onboard infra providers,
    etc.
