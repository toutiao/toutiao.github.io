  author: swatcoder
  text: In the context of child education, it doesn&#x27;t matter at all if it will
    &quot;materially shape how people work in 10 years&quot;.<p>The skills needed
    to keep up with those &quot;material changes&quot; fit in one thrice-a-week elective
    in one semester, akin to a touch typing or Microsoft Office class. It does not
    need to saturate every class on every topic for every year.<p>But what happens
    when it does saturate education that way is that students no longer absorb the
    foundational knowledge and process skills that we need them to bring with them
    as they become our colleagues and neighbors some day. That&#x27;s very troubling.<p>Childhood
    education is not a checklist over generating history papers and trigonometry proofs
    by whatever means possible. It&#x27;s a means of inducting young people into a
    functional society by conveying them civic, art, and technical <i>knowledge</i>
    and inspiring them to discover that <i>learning</i> is something they can do throughout
    their lives and that it makes them more capable.<p>Indisciminately letting them
    skip that process by asking the magic blathering box for all the answers as soon
    as they&#x27;re asked gets in the way of that.
