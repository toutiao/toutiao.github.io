  author: ivanmontillam
  text: 'I think it&#x27;s great new takes on software comes around, but I hope that
    anyone that engages in these movements understands two things:<p>- Not every SaaS
    have their moat at a 100% of the software, e.g.: You could vibecode a Twilio,
    but good luck establishing contracts with carriers on getting phone numbers in
    bulk, which <i>is</i> their actual moat.<p>- Having the movement&#x27;s foundation
    on <i>revenge</i> is a fuel that lasts very little. Once the avengers run out
    of motivation or the source of rage gets resolved (i.e. these developers get hired
    for higher salaries at companies with better culture), the steam will just dissipate.
    I know this myself by having walked this walk.<p>As long as new implementations
    of the software solves actual friction points of their would-be users, the chances
    for adoption&#x2F;switch are higher than just making drop-in replacements. The
    justification gap to switch needs to be wide enough. I know graphic designers
    are pretty mad generally at Adobe&#x27;s predatory licensing model, but is that
    true of other SaaS vendors?<p>Identify these friction points, sometimes it&#x27;s
    not just clunky UI&#x2F;UX, sometimes it&#x27;s complicated billing (much like
    AnyDesk guys left TeamViewer and adopted a licensing model that actually makes
    sense). Sometimes it&#x27;s just really bad tech support; the pandemic days left
    some vendors exposed at this particular area.<p>More often than not it&#x27;s
    just customers that feel trapped by vendor lock-in, and have no solid alternatives,
    but by switching they wonder if this alternate vendor will just get greedy and
    do the same, which feels treacherous to these (rightfully) hurt, paying individuals
    and companies (particularly SMBs).'
