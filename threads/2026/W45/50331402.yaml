  author: spwa4
  text: "&gt; The whole reason to pay for software is to offload the liability to
    a 3rd-party. In simpler words: &quot;As a company, I have this need and I don&#x27;t
    want to solve it myself. Also, if I pay someone, I can sue them on contract breach
    just in case.&quot;<p>Ah management-style cover-your-ass engineering. Which doesn&#x27;t
    work even with things like IBM contracts, never mind with anyone smaller. The
    problem is what they actually guarantee.<p>When you actually investigate the question
    (because you were a Google SRE and you move to a smaller company, and obviously
    disaster preparation starts with knowing what happens when disaster strikes):
    &quot;Say, really smart manager, what does the contract actually say happens when
    you need the cover-your-ass provisions? Let&#x27;s say AWS fails to give us machines.
    Let&#x27;s say this software doesn&#x27;t deliver. Let&#x27;s say the bank connection
    we&#x27;re paying for breaks&quot;. First observation: the managers (at a very
    big European telco) don&#x27;t actually know the answer to this question. Or they
    pretend not to (I&#x27;m pretty sure they just lied to me, didn&#x27;t care about
    anything but the checkmark, and did in fact know they did not have any option
    for disaster recovery because their developers had told them many times).<p>Answers:
    AWS doesn&#x27;t give you a cent back, under any circumstances, does NOT get your
    servers back online but MAY give you 20% reduction on your future bill.<p>Software
    doesn&#x27;t deliver, then we don&#x27;t have to pay the last milestone payment
    (10% of the cost), and the supplier does nothing anymore.<p>If the bank connection
    breaks, nothing happens. You are forced to keep paying anyway. Although, I guess
    you get the transaction cost for free because there won&#x27;t bee any transactions.
    I do hear there&#x27;s a small problem with that.<p>So, obviously, no, this does
    not cover the company&#x27;s ass at all. It&#x27;s about a manager being able
    to say they very cheaply did <i>something</i>. What will happen to the company
    in case of actual problems? It&#x27;ll immediately cease to function, and none
    of these cover-your-ass provisions will matter at all. Which is, of course, what
    happened about 4 months later and the company&#x27;s new SREs were expected to
    fix the shit ASAP, without ANY help from the &quot;service&quot; part of these
    platforms. We had to buy new services to get it fixed, once the service was down
    senior management literally got involved and approved the purchase orders, yelled
    at a bunch of infrastructure teams to make changes they never would and the company
    never got the money back from the &quot;guaranteed&quot; platforms. It cost about
    15x, for that year, what it would have cost to have 2 providers for the service,
    and I&#x27;m sure that more than covered a development team for the software.
    And <i>thank god</i> we at least hosted our own source and made sure local builds
    worked.<p>By the way: they just switched to the newly ordered much more expensive
    platform. About 3 weeks later, focus was moved away, by management, from repairing
    stuff and so the ability to switch back was ... just dropped."
