  author: komali2
  text: 'Hah, glad I wasn&#x27;t the only one that had this idea. Been chewing on
    it ever since malus.sh or whatever that joke clean room reimplementation of FOSS
    software project was.<p>I noticed that others are taking a shot at the big boys
    like Photoshop, but I don&#x27;t think that makes sense since 1. Jesus Christ
    imagine trying to rewrite Photoshop, with or without Astra and reverse engineering,
    let&#x27;s be real! And 2. GIMP already exists and people don&#x27;t use it for
    various reasons an ultra nerd that doesn&#x27;t have osx or windows on any device
    in his house (me) could understand. Instead I&#x27;m looking for small niche markets
    that are locked in by the software equivalent of a petty village despot. Decent
    examples so far include quilting software and funeral home SASS. I&#x27;m also
    looking for anyone stuck on old dead software with no migration path because of
    no export functionality or nothing supporting whatever given file format anymore.
    Apparently QuickBooks desktop falls into this category, but the space feels full
    enough, with e.g. GnuCash, that I don&#x27;t think I would be much help there.<p><a
    href="https:&#x2F;&#x2F;genairosity.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;genairosity.com&#x2F;</a><p>Investigations
    so far: <a href="https:&#x2F;&#x2F;github.com&#x2F;508-dev&#x2F;genairosity&#x2F;issues"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;508-dev&#x2F;genairosity&#x2F;issues</a><p>Basically
    leveraging subsidized tokens to liberate proprietary software. A bit of a petulant
    table flip maybe, but it kinda feels like the only thing left to us. Either we
    can kill ourselves scrambling around doing 996 for startups to try to avoid being
    a permanent underclass... Or we can light it all on fire.<p>Also inspired by open
    weight models tanking possible profit margins on frontier LLMs. One form of anti
    capitalist activism could be to just make it impossible to monetize something.
    The Manfred Macx form of activism.<p>Many other people in this thread with similar
    projects seem to be following the same workflow:<p>1. LLM agents sent out to find
    locked in proprietary software without a FOSS alternative<p>2. Targets selected
    by a human for deeper research on feasibility and alternatives<p>3. Clean room
    plan established<p>4. Human uses the software and takes notes<p>5. Feed notes
    into a token subsidized frontier model for orchestration. Architecture and plan
    written, beginning normal agentic development flow.<p>I&#x27;m slowed down significantly
    by step 4. Perhaps I will look into contributing my efforts to a larger project
    such as the one linked instead.'
