  author: theturtletalks
  text: It’s completely open-source and it’s our mission to make sure these are always
    1-click deployable to PaaS like Vercel and Railway.<p>We also are not like other
    opensource that depend on external services like Clerk, Resend, other external
    SaaS. All you need to deploy Openfront and Openship is Node and Postgres.<p>And
    the stack is completely agent-first. Next.js, Tailwind, GraphQL powered by Prisma
    and Keystone.js. Openfront is meant to be taken and adapted by each business.
    Like if your barbershop wants to sell merch, you can tell your agent to bring
    in features from e-commerce to the barbershop. We believe this is the future versus
    SaaS now, where you have to go into settings and configure everything. The future
    is changing the SaaS at the code level with an agent that has access to the code,
    deployment, etc.
