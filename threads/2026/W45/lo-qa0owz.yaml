  text: |-
    Skills are, effectively, executable code that happens to be written in human language. The reason to have automation around it is to make it easy for the entire team to use the same set, and the reason to have a lock file is to avoid a supply chain attack where benign/helpful instructions are replaced with malicious ones.
    If we were in the habit of pulling docs down locally for humans, you'd want the same behaviours anyway. Humans are also vulnerable to prompt injection attacks. We just call it "phishing" or "social engineering".
    (This is not an endorsement of AI usage, but is an endorsement of contextually-appropriate threat modelling.)
