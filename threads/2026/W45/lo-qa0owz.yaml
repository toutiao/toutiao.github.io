  text: |-
    I'd like to add: They don't need to be injected if you can derive them.

    TCP comes with RTT information (for example) for free (via getsockopt), which you can put right back into TCP_USER_TIMEOUT to detect dead links fast (very very important if you've got a poor sap who wants to try 10gbps over TCP)
    Terminals (e.g. over ssh) can be induced to respond (e.g. using CSI c / DA) which can give you something similar on the tty: No need to guess what VTIME should be!

    Sometimes timeouts are nice, and if there's a way to tell the user how to choose one that's the best. Sometimes a benchmarking mode can help.
    But I think choosing a timeout is also often mysterious, and without context usually produces worse results not better, since it isn't probably the sort of thing that gets tested very often, and to demand good choices before using the software puts a lot of pressure on the user that might harm their ability to be successful.
    So I too think a lot of timeouts just don't need to be there; if TCP is really supposed to offer anything at all, we should be able to wait until it connects and just trust the kernel's retry timer.  What else are we going to do besides retry or abort, and shouldn't that be up to the user? They could press ^C whenever they want... The gordon example almost certainly should have done this.
