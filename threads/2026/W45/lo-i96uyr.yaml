    Go's FAQ says assertions aren't encouraged in production or testing code.

    I think you're taking this too literally. As I understand it, the FAQ discourages assertion libraries that use a DSL and obscure the Go code in your tests.

    Go wants users to handle errors properly at all times.

    Again, I think you're being overly strict here. The original article says this:

    When I write tests for ReadUser, I call NewUsername with a value I know is valid, but I still have to include a lot of verbose error-checking code to convince the compiler that everything is okay.

    nickmonad is right to point out that you simply don't have to write a lot of code to convince the compiler. _ is completely idiomatic Go for this situation.
