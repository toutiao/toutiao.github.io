  title: |-
    The MustCreate Pattern for Go Tests ·
    mtlynch.io
  fetch_status: success
  content: "I recently discovered a handy way to make Go tests more readable and less
    repetitive.\n\nSuppose I have a constructor that can fail:\n\nfunc NewUsername(raw
    string) (Username, error) { ... }\n\nAnd I have another function that takes a
    Username as an argument:\n\nfunc (ds Datastore) ReadUser(username Username) (User,
    error) { ... }\n\nWhen I write tests for ReadUser, I call NewUsername with a value
    I know is valid, but I still have to include a lot of verbose error-checking code
    to convince the compiler that everything is okay:\n\nusername, err := NewUsername(\"joe123\")
    // This is silly because *I* know joe123 is a valid username, so this should //
    never happen. if err != nil { t.Fatalf(\"failed to create username: %v\", err)
    } // Perform the test assertion I actually care about. user, err := store.ReadUser(username)
    if got, want := user.Name.String(), \"joe123\"; got != want { t.Errorf(\"username=%v,
    want=%v\", got, want) }\n\n## My old solution: one new helper function per type
    \U0001F517︎\n\nUntil a few months ago, I avoided the verbose error checking by
    writing a helper function like MustCreateUsername that wraps NewUsername with
    the expectation that it never returns a non-nil error value:\n\nuser, err := store.ReadUser(MustCreateUsername(t,
    \"joe123\")) if got, want := user.Name.String(), \"joe123\"; got != want { t.Errorf(\"username=%v,
    want=%v\", got, want) }\n\nThe implementation of MustCreateUsername looks how
    you’d expect:\n\nfunc MustCreateUsername(t testing.TB, raw string) Username {
    t.Helper() username, err := NewUsername(raw) if err != nil { t.Fatalf(\"invalid
    username: %s\", raw) } }\n\nThe helper function strategy worked fine, but it scales
    poorly. Eventually, my repos become littered with MustCreateFoo and MustCreateBar
    for every type in my app.\n\n## New solution: A single, generic MustCreate helper
    \U0001F517︎\n\nIn 2022, Go 1.18 added support for generics. I like the idea of
    generics, but I rarely encounter problems where generics are the solution.\n\nI
    recently realized that generics are the better way to solve my sprawling MustCreateX
    problem. Instead of defining a helper MustCreateX for every type, I defined a
    single, generic MustCreate test helper, so my test becomes:\n\nuser, err := store.ReadUser(testutil.MustCreate(t,
    NewUsername, \"joe123\")) if got, want := user.Name.String(), \"joe123\"; got
    != want { t.Errorf(\"username=%v, want=%v\", got, want) }\n\nThe magic is the
    generic MustCreate function:\n\nfunc MustCreate[RawInput, CreatedValue any]( t
    testing.TB, create func(RawInput) (CreatedValue, error), rawInput RawInput, )
    CreatedValue { t.Helper() createdValue, err := create(rawInput) if err != nil
    { t.Fatalf(\"failed to create test value: %v\", err) } return createdValue }\n\nI
    have trouble reasoning about generics, so I’ll walk through the function implementation.
    I invoke MustCreate like this in my tests:\n\ntestutil.MustCreate(t, NewUsername,
    \"joe123\")\n\nThe above call is equivalent to this more explicit version:\n\ntestutil.MustCreate[string,
    Username](t, NewUsername, \"joe123\")\n\nWhen I call MustCreate here, RawInput
    is string (the type of the raw username value), and CreatedValue is Username (the
    return type). It’s equivalent to an implementation that looks like this:\n\nfunc
    MustCreate( t testing.TB, create func(string) (Username, error), rawInput string,
    ) CreatedValue { t.Helper() createdValue, err := create(rawInput) if err != nil
    { t.Fatalf(\"failed to create test value: %v\", err) } return createdValue }\n\n###
    Extending to multi-param constructors \U0001F517︎\n\nWhat about constructors that
    have more than one parameter?\n\nfunc NewRange(start int, end int) (Range, error)
    { ... }\n\nIn those cases, I write an additional helper called MustCreate2:\n\nrange
    := testutil.MustCreate2(t, models.NewRange, 0, 5)\n\nThe implementation of MustCreate2
    looks just like MustCreate but with an additional type for the second parameter:\n\nfunc
    MustCreate2[RawInput1, RawInput2, CreatedValue any]( t testing.TB, create func(RawInput1,
    RawInput2) (CreatedValue, error), rawInput1 RawInput1, rawInput2 RawInput2, )
    CreatedValue { t.Helper() createdValue, err := create(rawInput1, rawInput2) if
    err != nil { t.Fatalf(\"failed to create test value: %v\", err) } return createdValue
    }\n\n## Conclusion \U0001F517︎\n\nThe MustCreate pattern is nothing revolutionary,
    but it’s a technique that improved my Go tests and reduced some mindless toil
    from my dev work.\n\n## Read My Book\n\nI wrote a book about simple techniques
    to help developers improve their writing.\n\nMy book will teach you how to:\n\n-
    Create clear and pleasant software tutorials\n\n- Attract readers and customers
    through blogging\n\n- Write effective emails\n\n- Minimize pain in writing design
    documents\n\n### Be the first to know when I post cool stuff\n\nSubscribe to get
    my latest posts by email."
