  text: |-
    Thanks for reading!
    I similarly don't think I'd object to yours in the wild, but I do find it less expressive.
    The advantage of MustCreate is that it communicates to the reader that this is logic that's unrelated to the system under test.
    If you do assert(t, err == nil), then it looks like any other assertion in the test and makes it seem like the test is meant to exercise Username, when it's actually incidental.
    If I see (username, _ := ...), it always makes me stop and ask, "Did they mean to swallow this error? Why are they swallowing this error?" The other issue is that if you tighten the rules of NewUsername such that  the username in your store.ReadUser test is no longer valid, then the ReadUser test will have confusing behavior.
