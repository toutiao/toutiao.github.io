    Can you elaborate? I'm interested in improving this pattern, but I'm not sure what you mean.
    Imagine the codebase has to enforce a rule that usernames can't contain uppercase letters, so it looks like this:
    func NewUsername(raw string) (Username, error) {
      if containsUppercaseCharacters(raw) {
        return Username{}, errors.New("username must be lowercase")
      }
      return Username{ value: raw }
    }

    How would you turn that into a constructor that can't fail? You could add a "test-only" constructor that skips lowercase letter validation, but then you have to worry about clients accidentally calling it in production. And then you'd further have to create extra test-only constructors for each type.
