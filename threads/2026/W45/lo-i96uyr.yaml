  text: "Simpler, but with panic (\"with a value I know is valid\"):\nfunc Must[T
    any](t T, err error) T {\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\treturn t\n}\n\nThen
    it is a normal function call: user := Must(NewUsername(\"john\"))\nhttps://go.dev/play/p/XEx083CU9EJ\n\nIf
    you are really allergic to panic:\nfunc Must[V any](v V, err error) func(t testing.TB)
    V {\n\tif err != nil {\n\t\treturn func(t testing.TB) V {\n\t\t\tt.Helper()\n\t\t\tt.Fatal(err)\n\t\t\treturn
    v\n\t\t}\n\t}\n\treturn func(testing.TB) V {\n\t\treturn v\n\t}\n}\n\nCalled as
    user := Must(NewUsername(\"john\"))(t)\nhttps://go.dev/play/p/ngHSA4lTBhq\n\nUnfortunately
    multiple return values cannot be combined with other values, so Must(t, NewUsername(\"john\"))
    is not possible."
