  text: And sometimes, amusingly, the opposite. There are at least a few examples
    of "surprisingly advanced" algorithms that were invented in the 1960s and then
    forgotten because nobody had the entire megabytes of RAM that would have been
    needed to put them into production. Then they stayed forgotten until the 2000s
    or so when someone said "well what if I just precompute this... and I can optimize
    by dynamic-programming that..." and a little work later it turns out that yes,
    that idea does work but someone had it 50 years prior :)
