  text: As I recall, backgammon was a game that proved very hard for a rule-based
    engine to beat a good human (not even the best humans, just a strong player),
    but neural networks were able to do better.  Backgammon is interesting because
    of the doubling cube.  The game involves moving tokens around a board, but you
    don't play a single game, you play a sequence.  When you win a game, you get the
    number of points that the doubling cube shows (it's a cube with 1, 2, 4, 8, 16,
    and 32 printed on the sides).  Players take it in turns to be able to double the
    value on the cube, so to get it to the highest score, you need your opponent to
    think that they are winning.
