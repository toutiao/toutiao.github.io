  text: '&gt; Why there is no reactive UI that tracks all dependencies and redraws
    only what needs to be redrawn?<p>Nowadays the focus seems to be on video game-style
    interfaces that redraw every frame. The justification for this is typically that
    computers are so fast they can now come up with the entire interface every frame,
    so why not take advantage of that and forget all this retained-mode complexity?<p>They
    don&#x27;t realize that this is a classic case of the developer&#x27;s machine
    fallacy, where the developer has a machine so vastly more powerful than any of
    their users&#x27; that they produce a terrible experience for said users. This
    is also why games these days typically require upscaling even on 5090, because
    developers usually have that or something even more powerful and they think the
    bleeding edge is pushing even THAT machine to its knees.<p>Developers should be
    testing their software on the most entry-level, bottom of the barrel Chromebooks
    from 2015, running the heaviest and most bloated operating system they can think
    of. If people still optimized their software for that, then maybe computers would
