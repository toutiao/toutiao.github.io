  author: codedokode
  text: To use memoization you must use immutable structures (otherwise React is unable
    to detect changes) which are a pain to use and are slow if not designed properly.
    Do not believe me, try designing for example an algorithm that accepts a huge
    immutable sorted list with keys, a large sorted list of bulk deletes&#x2F;inserts
    and produces a new sorted list with minimum operations. I made 2 or 3 prototypes
    and they still are not good and not even working properly.<p>In my book, a good
    UI framework simply attaches to a mutable model made of arbitrary objects, detect
    changes and displays it with minimum number of operations. Doesn&#x27;t require
    to use any proxies or immutable data or store data in components. Shouldn&#x27;t
    be difficult. Why nobody made it, I do not understand.
