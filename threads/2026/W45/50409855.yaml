  author: LoganDark
  text: It does indeed depend.<p>Some multithreaded workloads will use the full logical
    processor count to pin every core and that can really suck on low-end systems.
    I think aside from balancing multithreading overhead, this is one of the reasons
    why some more advanced software (such as 7-Zip) lets you select the number of
    threads to use for a workload, even if you already know and accept that it&#x27;ll
    be expensive until it&#x27;s completed.<p>Lots of multithreading things I come
    across <i>as a developer</i> have a default of something like 4 threads, or only
    use a certain fraction of logical cores up to a certain maximum, etc. because
    it&#x27;s generally more polite not to always pin every core.
  score: 0
