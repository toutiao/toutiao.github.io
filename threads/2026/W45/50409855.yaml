  text: As an additional data point, I recently vibed an egui wrapper around a library
    I wrote for mod management for a game, and testing it out now, it idles at 92
    MB. This implies to me that at least half of the overhead is probably not from
    the gui framework, but I also don&#x27;t know how much effort they spent trying
    to optimize it; I didn&#x27;t try to optimize my vibed GUI app at all, but I did
    hand-write the library that it uses for file management, state tracking, etc.,
    and I tend to go out of my way to try to avoid unnecessary allocation in my Rust
    code. I don&#x27;t know how much of the memory usage is essentially required overhead
    or from other dependencies for non-GUI parts of the app, but my instinct is that
    there&#x27;s probably a bit of optimization that can be done. I don&#x27;t think
    it&#x27;s crazy for them not to have spent the effort on trying to do that yet
    though (or potentially even at all, if it&#x27;s efficient enough for their own
    personal use).
