  author: donohoe
  text: For context, I have worked in news&#x2F;media since 2003.<p>Yes, newspaper
    circulation had been declining since the late 1980s&#x2F;early 1990s. The real
    economic damage came as classifieds, recruitment, real estate and advertising
    moved online. Craigslist and other online marketplaces ate the business model
    long before social media and AI entered the picture.<p>So &quot;open internet&quot;
    doesn&#x27;t refer to a specific historical moment, but in this context I&#x27;d
    place its emergence in the early to mid-1990s.<p>My shallow, poorly worded, comment
    was aimed at time of the &quot;open internet&quot;.<p>Newspapers took large revenue
    from advertising that had little to do with journalism. That subsidized foreign
    bureaus, statehouse reporters, investigative work and specialized beats. When
    those dollars moved elsewhere, the economics of reporting collapsed. The 2008
    recession accelerated that.<p>That 60% figure is specifically newspaper newsroom
    employment, not journalism employment.
