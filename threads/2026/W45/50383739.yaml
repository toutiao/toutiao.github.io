    history when news was strictly factual information, delivered with no editorializing,
    from people who had no opinions or ideas, and I genuinely have no idea what they&#x27;re
    talking about. Walter Cronkite would frequently editorialize about events he was
    reporting. All the major historical men and women of news would, that&#x27;s...
    the point, you&#x27;re not just tuning in to know what happened today, you&#x27;re
    tuning in to experience those events through the eyes of someone you&#x27;ve at
    least got some vague trust relationship with.<p>And I categorically reject any
    notion that it&#x27;s better to get a summary via AI. I can clock articles written
    with heavy AI use and I dislike their monotone and... well, inhuman writing style.
