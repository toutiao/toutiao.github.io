  author: legitster
  text: The amount of newsroom jobs fell 60% between 2008 and 2020. The vast majority
    of what was lost were &quot;beat&quot; reporters - foreign bureaus, Washington
    bureaus from regional publications, statehouse reporters, or regional specialty
    beats (science, law, etc).<p>This started long before the decline of the open
    internet and AI. If anything, the shift online covered up a massive hollowing
    out of the industry. We&#x27;re getting fewer sources of news, and more national
    coverage. A lot of stuff that is reported on is coming from a scant number of
    wire services, or directly from PR teams themselves.<p>For the most part, your
    choice of news platform is just a layer of coverage choices and political spin
    on top of a very thin market of original coverage.
