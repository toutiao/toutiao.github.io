  text: I think the open Internet is often said to have begun declining with the rise
    of walled gardens, notably Facebook, 2010 or so. A further factor was Google&#x27;s
    degeneration from relatively fair broker to (biased) &quot;question answerer&quot;,
    with a notable step 2019-2020 but with earlier steps also.<p>Google was using
    it&#x27;s version of AI to push &quot;answers to questions&quot; a while before
    ChatGPT, these just weren&#x27;t very good so they weren&#x27;t sorted first.<p>But
    it&#x27;s hard to really say - as long as the Internet has existed, people have
    been crafting schemes to control&#x2F;manipulate it and by now those schemes have
    tremendous weight.<p>The main thing is the early Internet was a unique because
    it&#x27;s success was an accident. Corporations and bureaucrats imagined the &quot;Information
    Superhighway&quot; as an enriched cable TV and this made it such a failure that
