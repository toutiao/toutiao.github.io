  author: zozbot234
  text: The rule of thumb is to just test it on your chosen platform, with your workload.  SSD
    performance matters a lot obviously, you&#x27;ll want to run PCIe 5.0 if at all
    feasible, or a recent M5 Pro&#x2F;Max&#x2F;Ultra or M6 Mac with high storage capacity
    (lower tiers have much worse performance).  You can figure out a worst case easily
    (assuming that the fraction of sparse params you manage to cache in VRAM or system
    RAM has a fair chance of being picked among the total) but in practice you do
    quite a bit better than that - which is why even very small caches can be potentially
    worthwhile.
