    input.\n\n- PerceptionBench. An in-house benchmark focused on atomic visual perception
    capabilities.\n\n- Kimi Hallucination Benchmark. Evaluates factual accuracy on
    an internal set of challenging, de-identified prompts drawn from practical work
    tasks. The table reports claim-level hallucination rates assessed by fact-checking
    agents.\n\n#### Cybersecurity benchmarks\n\n- ExploitBench. K3.1 Pro is evaluated
    with the official harness under a 300-turn budget. The table reports the pass@5
    maximum-capability score: for each environment, the best of five seeds is scored
    by capability flags reached out of 16; arbitrary code execution counts as all
    16 capabilities. Comparison scores are from OpenAI, Anthropic, and GLM-5.3.\n\n-
