  content: "\U0001F4F0  Tech Blog |     \U0001F680  API Quickstart\n\n## 1. Model
    Introduction\n\nKimi K3.1 Pro is an open-weight, natively multimodal agentic model,
    and our most capable 3T-class model to date. Post-trained from Kimi K3 with large-scale
    joint reinforcement learning across hundreds of downstream domains, it is the
    first model in the K3.1 series. With a 1-million-token context window, Kimi K3.1
    Pro delivers substantial improvements in coding, 3D creation, financial research,
    factual accuracy, and other agentic capabilities.\n\n## 2. Model Summary\n\n*
    Compared with Kimi K3, we replace the full-attention Gated MLA layers with Gated
    DeepSeek Sparse Attention (Gated DSA) layers for more efficient long-context modeling.\n\n##
    3. Evaluation Results\n\nUnless otherwise specified, all Kimi K3.1 Pro results
    use reasoning effort max, temperature = 1.0, and top-p = 0.95. A dash (—) means
    that the source table does not report a score. Higher scores are better except
    where the benchmark name explicitly states lower is better; Elo scores and other
    benchmark-specific metrics are not directly comparable with accuracy or pass-rate
    scores.\n\n#### Coding benchmarks\n\n- Terminal-Bench 4.0. Kimi K3.1 Pro is evaluated
    with the Claude Code harness. The DeepSeek-V4.1-Flash-1017 score is taken from
    its release blog. All remaining scores are the maximum values reported in model
    blog posts or on the official Terminal-Bench leaderboard.\n\n- Terminal-Bench-Science
    0.1. Kimi K3.1 Pro is evaluated with Claude Code. Internal evaluation of DeepSeek-V4.1-Flash-1017
    yields 9.3; the table instead reports 15.7 for the older DeepSeek-V4.1-Flash from
    the official leaderboard. All remaining scores are from the Terminal-Bench-Science
    leaderboard.\n\n- SWE-Marathon v1.1. Kimi K3.1 Pro and DeepSeek-V4.1-Flash-1017
    are evaluated with Claude Code. Other scores are from the official leaderboard.\n\n-
    ProgramBench. The table reports binary scores: a task receives 1 if its ProgramBench
    score is at least 95%, and 0 otherwise. K3.1 Pro is evaluated with Claude Code.
    DeepSeek and GLM scores are taken from the DeepSeek release blog; remaining scores
    are from Vals AI.\n\n- DeepSWE v1.1. K3.1 Pro is evaluated with Claude Code. Other
    scores come from the respective technical reports for GPT-6 Astra, Claude Opus
    5.5, Claude Fable 5.1, DeepSeek-V4.1-Flash-1017, and GLM-5.3.\n\n- PostTrainBench.
    K3.1 Pro and DeepSeek-V4.1-Flash-1017 are evaluated internally on v1.2 with Claude
    Code and H20 GPUs rather than H100 GPUs. For stable evaluation, all judge models
    use DeepSeek-V4.1-Flash-1017 at maximum effort, which best matched the official
    GPT-5.6-Terra (xhigh) judge in testing. Other scores are from the official leaderboard.\n\n-
    Kimi Code Bench 2.0 and Kimi Code Bench 3.0 Long-horizon. These are internal benchmarks.
    K3.1 Pro is evaluated with Claude Code; all other models use their maximum-effort
    setting. Proprietary-model testing may involve fallback behavior.\n\n- BenchCAD.
    Open models are evaluated on 1,000-case subsets randomly sampled from the 17,900-case
    Vision2Code dataset at maximum reasoning effort. With-tools results use Claude
    Code; without-tools results use single-shot generation with official prompts and
    scoring. Claude scores are from the Opus 5.5 System Card, and GPT-6 Astra's with-tools
    score is from its official report. GPT-6 Astra has no reported without-tools score.\n\n####
    Agentic benchmarks\n\n- BioMysteryBench. Uses the official v11 release, with Kimi
    K3 as judge. K3.1 Pro uses Kimi Code; GLM-5.3 and DeepSeek-V4.1-Flash-1017 use
    Claude Code; GPT-6 Astra uses Codex. Claude scores are from official system cards.\n\n-
    Agents' Last Exam. Uses the official v1.1 release, comprising 122 tasks, including
    86 CLI tasks. Runs that bypass stated requirements receive zero. DeepSeek and
    Kimi are evaluated with Claude Code and Kimi Code, respectively; other results
    are from the official benchmark website.\n\n- OfficeQA Pro and OfficeQA Pro v2.
    GPT-6 Astra uses Codex; other models use Claude Code. Each task provides the complete
    PDF corpus as page images without machine-readable text. External-model trajectories
    that retrieve reference answers online receive zero for those tasks.\n\n- Frontier
    Finance. Evaluated with the official Finance Agent v2 harness.\n\n- HANDBOOK.md.
    Evaluated with the official OpenHands-based harness, using tasks from the benchmark's
    early open-source v1 release.\n\n- Harvey Legal Agent. Evaluated on 1,251 public
    tasks with Artificial Analysis's Stirrup harness. The reported score is the all-pass
    rate: the percentage of tasks passing every rubric criterion.\n\n- OSWorld V2.1.
    Kimi models use the Kimi Agent harness in the official OSWorld v2 repository.
    GPT-6 Astra's score is taken from Muse Wonder's technical report.\n\n- DECK-Arena
    and Design Bench. DECK-Arena evaluates presentation generation on real-world queries;
    Design Bench covers graphic design through direct and reference-image few-shot
    prompting. Both evaluate python-pptx, pptxjs, and Kimi's in-house DSL in a harness
    with integrated search and image generation. The automated grader is calibrated
    on more than 10,000 human judgments.\n\n- BrowseComp. Uses context compaction
    triggered at 200K tokens and a 500-step maximum. If the limit is reached, the
    agent is forced to answer before judging. All runs use temperature = 1.0 and top-p
    = 1.0.\n\n- GDPval-AA v2.1, AA-Briefcase v1.1, and AutomationBench-AA. Scores
