  author: zozbot234
  text: It&#x27;s not based on loading the full 1.5TB model into VRAM or system RAM,
    it&#x27;s just streaming parameters on demand from SSD - which is worthwhile since
    the MoE portion of the model is quite sparsely accessed.  This has been demoed
    on a 128GB M5 MacBook Pro with lousy performance (0.3 tok&#x2F;s or so) because
    it had to load at least ~25GB from SSD per token (comprising the entirety of the
    sparsely routed active params) and potentially even reload some of the dense weights,
    depending on what exactly managed to fit on that platform.  With 192GB you&#x27;d
    avoid any reloading for the dense weights and even cache a few layer-experts.
  score: 0
  posted_at: '2026-11-04T18:38:37Z'
