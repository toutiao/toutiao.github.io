  author: keeda
  text: Good questions. Note that it&#x27;s hard to tell what&#x27;s happening from
    a single reference, and any single reference could be wrong, which is why I look
    at multiple sources including those I linked above to piece together the bigger
    picture. Here&#x27;s what I see.<p>For 1) the report cannot determine an exact
    split between VC-backed startup vs other revenue because the startups are private.
    What it focuses on is deduping the revenues, so the headline number of $110B -
    175B annually <i>is</i> the outside money flowing into the system, and not circular
    flows.<p>However that outside money includes revenues, VC-backed cash, and training
    costs, which cannot be disentangled by this methodology. But note:<p>a) That does
    not imply circularity, as the apollo.com link suggests.<p>b) We also can&#x27;t
    assume this is mostly from burning investor cash rather than actual going concerns.
    Large VCs like A16Z, YC and Menlo Ventures, without disclosing margins, report
    seeing dramatic revenue growth in their startups, e.g.<p><a href="https:&#x2F;&#x2F;a16z.com&#x2F;revenue-benchmarks-ai-apps&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;a16z.com&#x2F;revenue-benchmarks-ai-apps&#x2F;</a><p><a
    href="https:&#x2F;&#x2F;www.cnbc.com&#x2F;2025&#x2F;03&#x2F;15&#x2F;y-combinator-startups-are-fastest-growing-in-fund-history-because-of-ai.html"
    rel="nofollow">https:&#x2F;&#x2F;www.cnbc.com&#x2F;2025&#x2F;03&#x2F;15&#x2F;y-combinator-startups-are-fa...</a><p>So
    while often VCs are also investors in the frontier labs, the flow of money here
    is explicitly not &quot;hyperscalers -&gt; startups -&gt; frontier labs -&gt;
    hyperscalers,&quot; but rather &quot;VCs + revenue -&gt; startups -&gt; frontier
    labs -&gt; hyperscalers.&quot; And VCs report that revenue is the fastest growing
    in history, which is corroborated by all the other links measure AI adoption growth.<p>Furthermore,
    this $110 - 175B number also gels with the $177B number that the a16z link estimates.<p>For
    2) the slides are much better for this (and the caveats are important) but the
    simplest I can put it is, at this point the marginal cost to serve tokens is far
    below and falling faster than token prices. Each new generation of hardware drops
    the cost to serve even further. As above, this rhymes with other sources including
    Anthropic&#x27;s S-1.<p>Regarding your point about the 2008 GFC, the difference
    here is that their individual incentives are <i>not</i> at odds with the global
    good, because at this point it appears to be bad for <i>everybody</i>! In the
    GFC there was no real pain until the crash; here the pain is all around from the
    start. The hyperscalers are actively torching their extremely profitable cash
    flows (along with a lot of goodwill) and taking on heavy debt, despite being punished
    by the stock market, to fund this buildout that apparently everybody hates but
    can&#x27;t stop using.
