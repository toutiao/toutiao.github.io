  author: vannevar
  text: A couple of questions regarding the &quot;State of the AI economy&quot;Report:<p>1)
    How much of that revenue growth is driven by VC-backed startups burning through
    investor cash rather than going concerns paying out of cash flow? Some reports
    suggest quite a bit (<a href="https:&#x2F;&#x2F;www.apollo.com&#x2F;wealth&#x2F;insights-news&#x2F;insights&#x2F;daily-spark&#x2F;circularity-in-ai-shows-up-in-token-spending-too"
    rel="nofollow">https:&#x2F;&#x2F;www.apollo.com&#x2F;wealth&#x2F;insights-news&#x2F;insights&#x2F;daily-s...</a>)<p>2)
    In the slide on data center economics, the pricing calculations are based on an
    assumption of 50-75% gross margins. But token prices are collapsing faster than
    serving costs are dropping (<a href="https:&#x2F;&#x2F;www.accountingtoday.com&#x2F;news&#x2F;tokenomics-firms-see-surging-ai-costs-compared-to-last-year"
    rel="nofollow">https:&#x2F;&#x2F;www.accountingtoday.com&#x2F;news&#x2F;tokenomics-firms-see-su...</a>).
    So margins are trending toward commodity levels. This is consistent with Anthropic&#x27;s
    S1, which showed revenue growth slowing faster than cost growth.<p>&gt;[W]hy would
    these companies, all bitter competitors, most with very high fiscal discipline
    and absolute firehoses of double-digit billions of free cash flow per quarter
    pre-AI, actively do something that would be so destructive to themselves and the
    world economy?<p>One might wonder the same thing about the 2008 GFC, the 2000
    Internet bubble, the Great Depression, etc. Because their individual incentives
    are at odds with the global good. Let&#x27;s just look at the role of private
    credit. Private credit made overzealous acquisitions during and after the pandemic,
    to the point that they are all sitting on depreciating assets while owing their
    investors outsized returns. It sort of made sense when prevailing interest rates
    were low, but it&#x27;s untenable now. Investors were starting to ask for their
    money, and funds were having to shut their window and enforce their contractual
    withdrawal limits. Enter AI and (more importantly) data centers. This was a deus
    ex machina that allowed private credit to draw much-needed new capital from insurance
    trusts and pension funds. They&#x27;ve now made their overall financial position
    much worse, but have put off the day of reckoning into the future. It&#x27;s the
    same reason people get in trouble with loan sharks, they just don&#x27;t want
    to go through the pain of acknowledging the institutional loss, which could also
    mean realizing significant personal losses. (This also goes for some of the major
    AI players.) As long as they can use OPM to put off the pain, they will.
