  text: "I&#x27;m working on something similar.<p>My guess is, within the next 3-5
    years, most ALGOL descendant languages will become obsolete, and S-exp based Lisp
    dialects will take over. Objectively superior.<p>Behold a native kernel, no inline
    asm or linker scripts, of any kind. The full compiler pipeline is controllable
    through the compiler (you can arbitrarily target, devise, or enable&#x2F;disable
    various optimization passes, for instance you can enable LICM at will). Also has
    a hard 1:1 correspondence to C&#x2F;C++&#x2F;Rust&#x2F;adding more languages soon.<p><pre><code>
    \  ;; GNU multiboot kernel\n   (image (target x86-64) (origin 0x100000) (entry
    &quot;boot32&quot;)\n     (section &quot;.multiboot&quot; (align 4) (keep))\n
    \    (section &quot;.bss&quot; (align 4096) (zero))\n     (stack &quot;bootstrap&quot;
    16384) (stack &quot;kernel&quot; 32768)\n     (assert (&lt;= (address &quot;kernel.end&quot;)
    0x40000000) &quot;early memory must fit the first GiB identity map&quot;))\n   \n
    \  (static header (Array u32 8)\n     (declare (section &quot;.multiboot&quot;)
    (used) (link-name &quot;multiboot_header&quot;))\n     (arr (0x1badb002 0x10003
    0xe4514ffb\n           (link u32 (address &quot;multiboot_header&quot;)) (link
    u32 (origin))\n           (link u32 (+ (origin) (image-size))) (link u32 (+ (origin)
    (image-size)))\n           (link u32 (address &quot;boot32&quot;)))))\n   (static
    gdt (Array u64 3) (declare (aligned 8) (link-name &quot;boot_gdt&quot;))\n     (arr
    (0 0x00af9a000000ffff 0x00cf92000000ffff)))\n   (static pml4 (Array u64 512) (declare
    (mutable) (aligned 4096) (link-name &quot;boot_pml4&quot;)))\n   (static pdpt
    (Array u64 512) (declare (mutable) (aligned 4096) (link-name &quot;boot_pdpt&quot;)))\n
    \  (static pages (Array u64 512) (declare (mutable) (aligned 4096) (link-name
    &quot;boot_pages&quot;)))\n   \n   (fn prepare-paging ()\n     (declare (mode
    protected32) (noinline))\n     (dotimes (i 512)\n       (at pml4 i (-&gt;u64 0))
    (at pdpt i (-&gt;u64 0))\n       (at pages i (| (* (-&gt;u64 i) 0x200000) 0x83)))\n
    \    (at pml4 0 (| (link u64 (address &quot;boot_pdpt&quot;)) 3))\n     (at pdpt
    0 (| (link u64 (address &quot;boot_pages&quot;)) 3))\n     (unsafe\n       (x86::write-cr
    &#x27;cr3 (link u64 (address &quot;boot_pml4&quot;)))\n       (x86::write-cr &#x27;cr4
    (| (x86::read-cr &#x27;cr4) 32))\n       (x86::write-msr 0xc0000080 (| (x86::read-msr
    0xc0000080) 256))\n       (x86::load-gdt (link VirtAddr (address &quot;boot_gdt&quot;))
    23)))\n\n   (fn show-greeting ()\n     (unsafe\n       (auto video (i-&gt;ptr
    (Volatile u16) 0xb8000))\n       (dotimes (i 2000) (at* video i (+ 0x5725 (-&gt;u16
    i))))\n       (auto greeting &quot;:d&quot;)\n       (dotimes (i (size greeting))\n
    \         (auto byte (-&gt;u8 (at greeting i)))\n         (at* video i (| 0x0f00
    (-&gt;u16 byte)))\n         (x86::out8 0xe9 byte))\n       (x86::out8 0xe9 10)))\n\n
    \  (boot-entry boot32 (mode protected32)\n     (handoff (magic eax u32) (information
    ebx PhysAddr))\n     (with-stack &quot;bootstrap&quot;\n       (prepare-paging)\n
    \      (unsafe\n         (x86::enter-long-mode &#x27;kernel64 8 magic information
    (link u64 0x123456789abcdef0)))))\n\n   (boot-entry kernel64 (mode long64)\n     (handoff
    (magic rdi u32) (information rsi PhysAddr) (cookie r12 u64))\n     (with-stack
    &quot;kernel&quot;\n       (unsafe\n         (x86::write-segment &#x27;ds 16)
    (x86::write-segment &#x27;es 16) (x86::write-segment &#x27;ss 16)\n         (auto
    valid (and (= magic (-&gt;u32 0x2badb002)) (&gt; (address-bits information) 0)\n
    \                         (= cookie (-&gt;u64 0x123456789abcdef0))\n                          (=
    (&amp; (x86::read-cr &#x27;cr0) 0x80000001) 0x80000001)\n                          (=
    (&amp; (x86::read-msr 0xc0000080) 0x500) 0x500)))\n         (if valid (show-greeting)\n
    \          (progn (x86::out8 0xe9 70) (x86::out8 0xe9 10))))))</code></pre>"
