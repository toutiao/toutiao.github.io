  author: clx75
  text: 'If you write a compiler for a low level Algol-family language in a LISP,
    then LISP&#x27;s homoiconic nature makes certain patterns possible which do not
    come so easy in other languages.<p>The compiler becomes a library in the host
    language. As you can use the syntax of the host language for the compiled language,
    you can create host-side defining forms like (define-compiled-function [NAME PARAMS
    &amp; BODY]) which parse the body of the compiled function into an AST and bind
    the resulting data structure into a namespaced variable of the host language.
    This way you can rely on the host&#x27;s namespacing mechanisms and probably reuse
    even its packaging and code distribution model for your low level language.<p>Another
    interesting feature which just &quot;falls out&quot; is compiler macros: you can
    use ordinary functions of the host language as macros (code transformers) in the
    compiled language.<p>Then you can write a lowering function which takes one of
    these AST vars, walks its call graph, resolves references and lowers the whole
    thing into your target language, be it Python, Go, LLVM IR, assembly, whatever.<p>If
    you pass a context to your lowering function which binds settings dynamically
    like target arch, word size, C calling convention, etc. then the code generators
    can emit the corresponding lowerings and you get portability using the dispatch&#x2F;polymorphism
    facilities of the host language.<p>This way you can push most of the complexity
    of the language to the LISP side. Basically you get a programmable compiler for
    your low level language.<p>I expect to see a lot more examples of this pattern
    in the coming years.'
