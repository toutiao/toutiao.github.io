article:
  url: https://thinkingmachines.ai/news/inkling-2-small/
  title: Introducing Inkling 2 Small - Thinking Machines Lab
  fetch_status: success
  content: "# Introducing Inkling 2 Small\n\nNov 5, 2026\n\n[Try on Tinker](https://tinker.thinkingmachines.ai/playground?utm_source=blog&utm_campaign=inkling_2_model_release)[Model
    card](/model-card/inkling-2-small/)\n\nToday we are introducing our second model
    generation with Inkling 2 Small. It is a Mixture-of-Experts model with 594B total
    parameters, 17B active, and supports image inputs and variable effort.\n\nInkling
    2 Small far surpasses our previous models’ scores on the Artificial Analysis Intelligence
    Index with a score of 31, reflecting gains in performance on agentic coding, vision,
    knowledge work, and reasoning. The increase in capabilities comes from improvements
    made at every step of our training process, including more efficient pre-training
    and a large, unified RL run.\n\nInkling 2 Small will initially be available through
    Tinker, with closed weights, following the approach we outlined in a [safe path
    to open weights](https://thinkingmachines.ai/blog/a-safe-path-to-open-weights/).
    We intend to make the full weights available under an Apache 2.0 license next
    week after the completion of external safety testing and red-teaming.\n\nYou can
    try Inkling 2 Small on Tinker Playground today. The model is also available for
    fine-tuning and sampling on Tinker; checkpoints will be downloadable with the
    release of Inkling 2 Small’s weights.\n\n## Capabilities\n\nInkling 2 Small is
    more capable across the board than our first generation, particularly in long-horizon
    autonomous work.\n\nInkling 2 Small’s vision and agentic capabilities enable it
    to incorporate visual feedback to iteratively build and refine websites, games,
    and 3D designs with interactive elements.\n\n### Agentic coding and autoresearch\n\nInkling
    2 Small was trained with RL on hundreds of thousands of long-horizon coding tasks
    across multiple agent harnesses and context-compaction strategies. We increased
    the quality of our synthetic coding data pipeline and moved beyond unit-test rewards
    alone; many tasks included an agentic RL grader that evaluated how the model approached
    the problem, not just whether its code passed. We also tested early checkpoints
    of Inkling 2 Small on [OpenCode](https://opencode.ai/) under the name Fledge-Alpha
    to assess our model’s performance on coding tasks in the real world.\n\nThe result
    is a model that is both stronger at coding and easier to use inside real agent
    loops. Inkling 2 Small improves on usability compared to Inkling: it follows instructions
