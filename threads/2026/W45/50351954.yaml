  author: DonHopkins
  text: 'That left-wing politics is part of what makes Het Schip so cool: a &quot;workers&#x27;
    palace&quot;, commissioned by a socialist housing association. They believed that
    working people deserved beautiful homes, with elaborate brickwork and thoughtful
    design -- not just somewhere cheap to sleep. I love taking visiting friends around
    Spaarndammerbuurt and into the museum.<p><a href="https:&#x2F;&#x2F;www.hetschip.nl&#x2F;en&#x2F;visitors&#x2F;locations-opening-hours&#x2F;het-schip"
    rel="nofollow">https:&#x2F;&#x2F;www.hetschip.nl&#x2F;en&#x2F;visitors&#x2F;locations-opening-hours&#x2F;...</a><p>The
    museum is amazing, and the gift shop has treasures like this set of historical
    posters.<p><a href="https:&#x2F;&#x2F;www.hetschip.nl&#x2F;webshop&#x2F;souvenirs&#x2F;set-historische-posters-50-x-70-cm"
    rel="nofollow">https:&#x2F;&#x2F;www.hetschip.nl&#x2F;webshop&#x2F;souvenirs&#x2F;set-historische-po...</a><p>The
    top one, Wilhelmina Drupsteen&#x27;s &quot;De Vrouw 1813-1913&quot;, advertised
    an exhibition organized by the women&#x27;s movement, including the campaign for
    voting rights. Dutch women wouldn&#x27;t get the vote until 1919.<p>The front
    poster, Albert Hahn&#x27;s &quot;Stemt Rood!&quot; (&quot;Vote Red!&quot;), shows
    a worker raising a pickaxe while pinning down an octopus representing capitalism
    and its evils. His boot is planted on a tentacle. The lettering names capitalism,
    anarchy, famine, the suffering of war, and food profiteering. Still painfully
    relevant issues today. Makes me picture the tentacles of Trump and his owners,
    Putin and Netanyahu, getting thoroughly stomped and pickaxed by progressives winning
    democratic elections, and how Iran resoundingly won Trump&#x27;s war by causing
    regime change in the United States.<p><a href="https:&#x2F;&#x2F;x.com&#x2F;AmoneyResists&#x2F;status&#x2F;2118357108643234240"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;AmoneyResists&#x2F;status&#x2F;2118357108643234240</a><p>The
    gift shop doesn&#x27;t carry the cardboard hats anymore, but I once got one modeled
    on Het Schip&#x27;s phallic brick tower, like the Pope&#x27;s mitre, only too
    tall to wear indoors.<p><a href="https:&#x2F;&#x2F;wittebouw.nl&#x2F;wp-content&#x2F;uploads&#x2F;2026&#x2F;11&#x2F;Amsterdam_Het_Schip_006-1024x716.jpg"
    rel="nofollow">https:&#x2F;&#x2F;wittebouw.nl&#x2F;wp-content&#x2F;uploads&#x2F;2026&#x2F;11&#x2F;Amsterdam_He...</a><p>They&#x27;re
    repairing the wrought-iron &quot;tree of life&quot; on top of the tower, which
    was accidentally struck during maintenance:<p><a href="https:&#x2F;&#x2F;www.facebook.com&#x2F;MuseumHetSchip&#x2F;posts&#x2F;pfbid0HQDNrwXU6L5xDp9F65icpNUTPy282jemM9VmD59EjSAA5CeorRcAUtGdUSNU4VjLl"
    rel="nofollow">https:&#x2F;&#x2F;www.facebook.com&#x2F;MuseumHetSchip&#x2F;posts&#x2F;pfbid0HQDNrwXU...</a><p>&gt;In
    early 2026, the exterior woodwork of Het Schip (the homes and museum) was painted.
    While scaffolding components were being hoisted into the courtyard, the tower&#x27;s
    finial was struck, leaving it tilted. It took a while, but at the end of October
    the finial was finally removed for repair. The top is temporarily covered with
    plastic.<p>&gt;Het Schip was designed by architect Michel de Klerk. The book &quot;Een
    kunstwerk van baksteen&quot; (&quot;A Work of Art in Brick&quot;, 2018) describes
    the tower: &quot;The tower can be seen as a characteristic Amsterdam School form.
    It enhanced the building&#x27;s sculptural qualities and plays an important role
    in its overall appearance.&quot; Housing Department director Arie Keppler was
    rather surprised by the tower&#x27;s presence: &quot;There had occasionally been
    passing remarks about the lack of a tower in this part of the city. Imagine the
    astonishment when he unrolled his plan!&quot;<p>Then we go to Grand Hotel Amrath
    in the former Scheepvaarthuis: Amsterdam School extravagance built for shipping
    companies rather than workers. They&#x27;ve let us explore the lobby, and you
    can rent the lavish historic meeting rooms. Look at the stained glass and woodwork,
    and don&#x27;t miss the paternoster lift.<p><a href="https:&#x2F;&#x2F;www.amrathamsterdam.com&#x2F;en&#x2F;information&#x2F;history&#x2F;the-scheepvaarthuis"
    rel="nofollow">https:&#x2F;&#x2F;www.amrathamsterdam.com&#x2F;en&#x2F;information&#x2F;history&#x2F;the-s...</a><p>Cafe
    Batavia 1920 makes a great stop for a drink and lunch in another Amsterdam School
    building, if it&#x27;s not overrun with obnoxious British football fans.<p><a
    href="https:&#x2F;&#x2F;manchesterhistory.net&#x2F;architecture&#x2F;1920&#x2F;batavia.html"
    rel="nofollow">https:&#x2F;&#x2F;manchesterhistory.net&#x2F;architecture&#x2F;1920&#x2F;batavia.html</a><p>And
    then Tuschinski, an extravagant mixture of Amsterdam School, Art Deco, and Jugendstil.<p><a
    href="https:&#x2F;&#x2F;celluloidjunkie.com&#x2F;2017&#x2F;10&#x2F;19&#x2F;cinema-of-the-month-pathe-tuschinski-amsterdam-holland&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;celluloidjunkie.com&#x2F;2017&#x2F;10&#x2F;19&#x2F;cinema-of-the-month-p...</a><p>There&#x27;s
    also De Dageraad, the housing complex designed by Michel de Klerk and Piet Kramer
    around P. L. Takstraat and Burgemeester Tellegenstraat. More beautiful homes for
    workers, commissioned by a socialist housing association.<p><a href="https:&#x2F;&#x2F;items.amsterdamse-school.nl&#x2F;details&#x2F;objects&#x2F;54"
    rel="nofollow">https:&#x2F;&#x2F;items.amsterdamse-school.nl&#x2F;details&#x2F;objects&#x2F;54</a><p>The
    best thing to do is to just ride a bike randomly around town all over the place,
    looking at the architecture and parks and canals. Here are a few of my recent
    rambling rides, including wandering around Spaarndammerbuurt and Het Schip, and
    flood filling every road in De Pijp:<p><a href="https:&#x2F;&#x2F;ebike-safari.com&#x2F;?lat=52.3905&amp;lon=4.8737&amp;zoom=16&amp;rides=all"
    rel="nofollow">https:&#x2F;&#x2F;ebike-safari.com&#x2F;?lat=52.3905&amp;lon=4.8737&amp;zoom=16&amp;rid...</a>'
