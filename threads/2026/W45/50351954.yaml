  author: yvoschaap
  text: 'My grand-grand father was responsible for building 6,000 houses of which
    the Mercatorplein (one of the example article images) was central. If Dutch you
    should read more about how this Amsterdam neighbourhood was build here: <a href="https:&#x2F;&#x2F;www.heerevanderschaar.amsterdam&#x2F;bouwondernemer&#x2F;plan-west&#x2F;item74"
    rel="nofollow">https:&#x2F;&#x2F;www.heerevanderschaar.amsterdam&#x2F;bouwondernemer&#x2F;plan-...</a>
    (the non-Dutch will appreciate the photos).<p>Berlage the architect is always
    mentioned as the creator of Mercatorplein (same in the article &quot;his housing
    around the Mercatorplein&quot;), which is always funny to me given architects
    don&#x27;t build but are hired by building entrepreneurs like Van der Schaar who
    actually was responsible for it all, which in the history books get almost no
    credit.'
