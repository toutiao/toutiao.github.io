  author: yogthos
  text: Tech in China isn&#x27;t used to suffocate anybody&#x27;s human rights either.
    In fact, more people in China see their country as being democratic than in America
    according to the latest Democracy Perception Index from the Alliance of Democracies
    Foundation.<p><a href="https:&#x2F;&#x2F;allianceofdemocracies.org&#x2F;democracy-perception-index"
    rel="nofollow">https:&#x2F;&#x2F;allianceofdemocracies.org&#x2F;democracy-perception-index</a><p>What
    makes this report interesting is that the organization publishing it was started
    by an ex-NATO chief and claims to unite democracies, meaning Western liberal style
    democracies. So it can’t be accused of having some sort of anti-Western bias.
    Their methodology is also straightforward, where they simply ask people if they
    feel their government works in their interest and whether they can hold it accountable.
    That’s the whole ballgame, because if people don’t believe the system is democratic
    then it inherently lacks legitimacy no matter what the constitution says. While
    people will surely attack this methodology, the sheer fact that a NATO-connected
    group published such a report gives its claims a certain credence given how dire
    these results are for the Western model of democracy. France now ranks alongside
    Kazakhstan, Yemen, and Zimbabwe in its own citizens’ eyes while the U.S. is split
    down the middle with about half of Americans saying they don’t think they live
    in a democracy anymore. China, on the other hand, sits up there with the Scandinavians
    and Switzerland, and Chinese people overwhelmingly say the system works for them.
    Notably, we can also see that perceptions of transparency, rule of law, and free
    speech are on the rise across the board in China.<p>And before you start trying
    to claim that people in China are simply afraid to speak their mind, the same
    report shows Russia at -21 points and Belarus at -9, so that whole excuse falls
    apart. Turns out that people living in states the West labels as being authoritarian
    do, in fact, complain when they’re unhappy.<p>Various other western publications
    have reported the same thing for many years.<p><a href="https:&#x2F;&#x2F;www.tbsnews.net&#x2F;world&#x2F;china-more-democratic-america-say-people-98686"
    rel="nofollow">https:&#x2F;&#x2F;www.tbsnews.net&#x2F;world&#x2F;china-more-democratic-america-...</a><p><a
    href="https:&#x2F;&#x2F;www.newsweek.com&#x2F;most-china-call-their-nation-democracy-most-us-say-america-isnt-1711176"
    rel="nofollow">https:&#x2F;&#x2F;www.newsweek.com&#x2F;most-china-call-their-nation-democr...</a><p><a
    href="https:&#x2F;&#x2F;www.csmonitor.com&#x2F;World&#x2F;Asia-Pacific&#x2F;2021&#x2F;0218&#x2F;Vilified-abroad-popular-at-home-China-s-Communist-Party-at-100"
    rel="nofollow">https:&#x2F;&#x2F;www.csmonitor.com&#x2F;World&#x2F;Asia-Pacific&#x2F;2021&#x2F;0218&#x2F;Vilif...</a><p>Turns
    out the US is the place where human rights are actually being suffocated.
