  author: chriddyp
  text: 'Landed on the cost&#x2F;accuracy frontier in our data analytics benchmark:
    <a href="https:&#x2F;&#x2F;plotly.com&#x2F;blog&#x2F;tencent-hy4-plotly-data-analytics-bench&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;plotly.com&#x2F;blog&#x2F;tencent-hy4-plotly-data-analytics-be...</a>,
    right in between GPT-6.1 Sol and GPT-6.1 Terra.<p>Verrrry thorough in its work
    and therefore verrrrry slow. It spent a long time with each question, running
    about 26 queries for each question, and in some questions it ran 64 queries. One
    of the queries that it wrote also took about an hour to run, which affected its
    overall exam time.<p>Last year the open weight models were the cheap &amp; good
    alternatives. Then in September&#x2F;October that cost story got rewritten by
    the GPT-6 series and Claude&#x27;s 5 series.<p>Hy4 brings open models back on
    the cost&#x2F;accuracy frontier, but its behavior is too thorough + slow.<p>Another
    thing we&#x27;re seeing is that post training open models is starting to see results.
    Particle-1 from last week is also on our frontier, which is post-trained on DeepSeek
    V4.1 and Fireworks Ember-1 from a few weeks ago was post-trained on Kimi K3.<p>Take
    these numbers with a grain of salt: this exam is just for short horizon, low-context
    data analysis tasks, not full-fledged software projects.'
