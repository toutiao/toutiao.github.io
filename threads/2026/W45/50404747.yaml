  text: |-
    I disagree Marxism may aspire to fully explain all Empires and
    Economies for all time but I think dialectical materialism falls very
    short once one steps away from the early modern era (Even then does
    not capture early modern Europe all that well).<p>What is &#x27;predatory&#x27; here? If you are a Marxist Economic Exploitation
    and the position that you seem to be affirming is that culture is
    merely the superstructure that justifies and enforces this
    exploitation but does not dictate it.  I believe one can
    argue more easily for this to apply to the 18th-21th centuries, but falls apart
    horribly when you look at history before then particularly the Ancient
    and Medieval world, I will focus on the occident because I can say I
    am ignorant of mesoamerican history.<p>I think if you told an ancient ruler Marx&#x27;s famous &#x27;Man is an economic
    animal&#x27; (as I understand it a play on Aristotles rational animal) the
    response would be one of amused contempt and would reply with perhaps
    something to point out that man is a warring animal an animal that
    wishes to conquer and that the dialectic of history so far as their is
    one is of fragment 25 of Heraclitus:<p>&#x27;War is both father and king of all, some he has shown forth as gods
    and others as men, some he has made slaves and others free.&#x27;<p>While it might seem that war can be dictated by economy, it is not the
    only factor and the question looks more like what economy does for the
    empire&#x2F;city&#x2F;state in times of war dictates history. That is most
    changes in human history where external and due outside antagonism and
    if their was a dialectical of this change it&#x27;s in how the failure of one
    allowed the other to conquer the other.<p>So it is war that dictates history primary that is not reducible to
    economy (only a factor). And the desires of wallstreet are far removed from that of Lycurgus and are very different animals.<p>Tell me where you disagree, I used to have Marxist sympathies but the
    more I read the more they dimmed until I realized how many mistakes
    where in it. As an aside reading Engels metaphysics is one of the
    fastest ways to lose respect for Engels as his writings on metaphysics
    are perhaps the worst on the subject to be published of all time.
