  author: throw0101d
  text: '&gt; <i>Well, it doesn&#x27;t just look that way they really did have a lot
    of fun. In fact that&#x27;s really all they could do is have fun and more fun
    and more on top of that, until it wasn&#x27;t so much fun anymore. But what they
    couldn&#x27;t do was just be. They just couldn&#x27;t face that.</i><p>Blaise
    Pascal in his <i>Pensées</i> (<i>Thoughts</i>):<p>&gt; <i>When I have occasionally
    set myself to consider the different distractions of men, the pains and perils
    to which they expose themselves at court or in war, whence arise so many quarrels,
    passions, bold and often bad ventures, etc., I have discovered that all the unhappiness
    of men arises from one single fact, that they cannot stay quietly in their own
    chamber. A man who has enough to live on, if he knew how to stay with pleasure
    at home, would not leave it to go to sea or to besiege a town. A commission in
    the army would not be bought so dearly, but that it is found insufferable not
    to budge from the town; and men only seek conversation and entering games, because
    they cannot remain with pleasure at home.</i> […]<p>&gt; <i>Whatever condition
    we picture to ourselves, if we muster all the good things which it is possible
    to possess, royalty is the finest position in the world. Yet, when we imagine
    a king attended with every pleasure he can feel, if he be without diversion, and
    be left to consider and reflect on what he is, this feeble happiness will not
    sustain him; he will necessarily fall into forebodings of dangers, of revolutions
    which may happen, and, finally, of death and inevitable disease; so that if he
    be without what is called diversion, he is unhappy, and more unhappy than the
    least of his subjects who plays and diverts himself.</i> […]<p>* <a href="https:&#x2F;&#x2F;www.gutenberg.org&#x2F;files&#x2F;18269&#x2F;18269-h&#x2F;18269-h.htm"
    rel="nofollow">https:&#x2F;&#x2F;www.gutenberg.org&#x2F;files&#x2F;18269&#x2F;18269-h&#x2F;18269-h.htm</a>
    § 139<p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pensées"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pensées</a><p>And
    perhaps:<p>&gt; <i>To endure oneself may be the hardest task in the universe.
    You cannot hire a wise man or any other intellect to solve it for you. There&#x27;s
    no writ of inquest or calling of witness to provide answers. No servant or disciple
    can dress the wound. You dress it yourself or continue bleeding for all to see.</i><p>*
    Frank Herbert, <i>Dune Messiah</i>'
