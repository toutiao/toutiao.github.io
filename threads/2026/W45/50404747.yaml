    and doing exactly the same things. I really think … when people say “that kind,”
    it’s not a matter of equalizing everyone and saying we&#x27;re all responsible,
    I think it&#x27;s a matter of facing and recognizing and acknowledging that part
    of us which is a part of our common humanity. And we have to deal with it.”<p>“He
    [Jordan Belfort] thought that he could bypass morality or surpass morality with
    a combination of money and drugs. I don&#x27;t know maybe he still does, I really
    don&#x27;t know. There&#x27;s another way of answering the question; he was different
