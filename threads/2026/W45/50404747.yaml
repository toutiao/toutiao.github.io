    &gt;his father (driving the MC to jail) turn almost literally to the camera and tell the viewer which precise moral value he&#x27;s being punished for not upholding.<p>Yes, and there&#x27;s the scene with Hal Holbrook, I think he lectures Bud Fox just before or after he&#x27;s arrested? Holbrook made a career of playing moral authority figures.<p>I think the seductive appeal of Gordon Gekko is meant to illustrate something fundamental about the human condition. We are all susceptible to temptation, whether it involves pleasure, money, status, or power. Success doesn&#x27;t necessarily satisfy desire, if anything, it intensifies it. Can you eat just one potato chip? Would you return a found wallet full of cash? If you made a million dollars, would that be enough? Gekko is an example of an ordinary human predicament: the difficulty of knowing when we have enough, and the ease with which we rationalize getting more.<p>---<p>On another note, it&#x27;s too late to edit my earlier post in this topic.<p>&quot;delivered in 1986 at The speaker? Ivan Boesky&quot;<p>should be<p>&quot;delivered in 1986 at what is now the Haas School of Business of the University
