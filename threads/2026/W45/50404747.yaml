  text: This is obviously a recurring theme and I&#x27;m still not sure which way
    it would go.<p>But here&#x27;s one well researched viewpoint on that which suggests
    post-collapse will be a case of villagers vs pillagers.<p><a href="https:&#x2F;&#x2F;www.counterpunch.org&#x2F;2021&#x2F;03&#x2F;19&#x2F;villagers-pillagers-who-will-survive-the-collapse&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.counterpunch.org&#x2F;2021&#x2F;03&#x2F;19&#x2F;villagers-pillagers-...</a><p>I
    suspect a lot of this has to do with context (both geographically and culturally).
    E.g. There&#x27;s a big difference between there&#x27;s been a short term local
    collapse, e.g. after a natural disaster and civilisation will return to normal
    afterwards (so there&#x27;s some incentive to behave because bad behaviour might
    get punished at some point) and the whole society has collapsed (it&#x27;s going
    to be a free for all for long enough bad behaviour is unlikely to be punished).<p>Even
    if there&#x27;s plenty of evidence that people will band together in times of
    crisis, despite what popular culture might tell us. See Lord of the Flies vs actual
    kids marooned on an island. In a hyperpolarised society with ready access to guns
    I suspect that would be different as the counterpunch article suggests.<p>I suspect
    the smart thing to do is hedge your bets and be prepared for both eventualities
    (be a villager AND an anti-pillager) as they&#x27;ll no doubt be a bunch of people
    out there that are hungry and don&#x27;t have the skills&#x2F;temperament to be
    a villager.
