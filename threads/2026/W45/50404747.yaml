    below is what he said regarding Jordan Belfort’s character in The Wolf of Wall
    Street,<p>“That&#x27;s something that I&#x27;ve always been attracted to and is
    interesting to me. Someone like Jordan or Jake Lamotta or Tommy, Joe Pesci’s character
    in Goodfellas, and people say well that type of person that sort but… I guess
    what that means is that they try to distance themselves from them. It&#x27;s someone
    else it&#x27;s not me but in actuality I feel it&#x27;s not someone else, it&#x27;s
    us. It&#x27;s you and me and maybe if we&#x27;d been born under different circumstances,
