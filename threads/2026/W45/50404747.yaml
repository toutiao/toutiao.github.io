  text: '&gt; <i>&quot;The point is, ladies and gentleman, that greed, for lack of
    a better word, is good.&quot;</i><p>The whole paragraph from where that line is
    extracted:<p>&gt; <i>Teldar Paper, Mr. Cromwell, Teldar Paper has 33 different
    vice presidents each earning over 200 thousand dollars a year. Now, I have spent
    the last two months analyzing what all these guys do, and I still can&#x27;t figure
    it out. One thing I do know is that our paper company lost 110 million dollars
    last year, and I&#x27;ll bet that half of that was spent in all the paperwork
    going back and forth between all these vice presidents. [some chuckles from audience]
    The new law of evolution in corporate America seems to be survival of the unfittest.
    Well, in my book you either do it right or you get eliminated. In the last seven
    deals that I&#x27;ve been involved with, there were 2.5 million stockholders who
    have made a pretax profit of 12 billion dollars. [applause] Thank you. I am not
    a destroyer of companies. I am a liberator of them! The point is, ladies and gentleman,
    that greed, for lack of a better word, is good. Greed is right, greed works. Greed
    clarifies, cuts through, and captures the essence of the evolutionary spirit.
    Greed, in all of its forms; greed for life, for money, for love, knowledge has
    marked the upward surge of mankind. And greed, you mark my words, will not only
    save Teldar Paper, but that other malfunctioning corporation called the USA. Thank
    you very much.</i><p>* <a href="https:&#x2F;&#x2F;www.imdb.com&#x2F;title&#x2F;tt0094291&#x2F;quotes&#x2F;?item=qt0393936"
    rel="nofollow">https:&#x2F;&#x2F;www.imdb.com&#x2F;title&#x2F;tt0094291&#x2F;quotes&#x2F;?item=qt0393936</a><p>The
    text of the larger context of that paragraph is in the above link, or you can
