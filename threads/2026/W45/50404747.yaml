  text: '1| Whataboutism and poisonous messengers:<p>What Karl Marx did or didn&#x27;t
    do doesn&#x27;t matter in this context since I was only using Capital to point
    out that the conditions of modern Wall Street were described over a century before
    their manifestation. It&#x27;s not proof that he was right, or right about anything
    else, but it illustrates that the concepts were visible long before Gecko. It
    contradicts the idea that without the film that the market would have developed
    into something else.<p>Despite your apparent disdain for Karl Marx and for communism,
    this is still functional logic.<p>Re: China, Russia, and others: what is your
    point? Coerciveness is a description of the aspects of a governing body that become
    tools of wealth: financializing parties don&#x27;t tap the government for its
    census abilities, or for the conventions it uses to maintain maps&#x2F;codify
    the road systems.<p>2| Marx&#x27;s Predictions and Communist Failures<p>Marx made
    some predictions, but his work is more often about analysis of patterns and theorizing
    their origins and rules. From there he extrapolated eventualities.<p>Among those
    eventualities were things like &quot;infantile &#x2F; insufficient communism,&quot;
    &quot;crude communism,&quot; &quot;privileged bureaucrats.&quot;<p>When infrastructure
    is insufficient, Marx writes in The German Ideology:<p>&gt; “Want is merely made
    general, and with destitution the struggle for necessities and all the old filthy
    business would necessarily be reproduced.”<p>He said that attempting communist
    planning without overcoming productive limitations would be self-defeating and
    would spread even more easily through a population.<p>Since he died in the 1880&#x27;s,
    and never held any positions of political power or decision making, it would be
    excessive to hold him responsible for famines of the 1930&#x27;s, imo.'
