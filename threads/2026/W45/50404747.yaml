  text: "&gt; I would not agree with Capitalism being humanities default, hunter gathers
    don&#x27;t practice Capitalism<p>They actually do if you look closer. E.g. in
    the Melanesia tribes, as documented by Bronisław Malinowski, the guy who makes
    a fishing canoe (e.g. invests capital into a productive asset) gets a bigger piece
    of the catch after the fishing trip. Without the bonus, no one in the tribe would
    be incentivised to make the canoe. Capitalism is so fundamental that even hunter
    gatherers get it and practice it, because it makes their societies better."
