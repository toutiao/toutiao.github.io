  text: |-
    (2016), from the New York Fed, back during the Obama administration. Reading this, my first thought was amazement that this came out under Trump. It didn&#x27;t.<p>This paper is mostly about risk associated with debt. That&#x27;s the Fed&#x27;s job, after all. The current AI bubble is more on the equity side, although, when it pops, we&#x27;ll see who&#x27;s been leveraging their equity positions with debt. Historically, up until the 1980s. corporate debt was supposed to be low-risk. If a company went bust, that usually took down the top executives, who were unlikely to get good jobs ever again.
    As a result, the bond market was boring. Not much trading. Buy and hold.<p>Then came &quot;high yield bonds&quot; - debt instruments with high returns but a significant
    risk. The concept was that a broad portfolio of high yield bonds became, statistically, a low-risk loan. Risk management and the Black-Sholes model became a major part of Wall Street activity. That&#x27;s the background of the paper. The audience to which that paper is addressed knows that, so they only hint at it.<p>This tends to break down when there&#x27;s some across the board change. The 2008 US housing crisis is the big modern example. Housing prices went down nationally. The assumption of many Wall Street risk management models was that the risk of independent debt instruments was largely uncorrelated. Sometimes, it&#x27;s not. <i>The Big Short</i> (2015) is the movie version of this, and it explains all this in an entertaining way. (That&#x27;s quite an achievement for Hollywood - making an entertaining movie about mortgage risk correlation. It&#x27;s not about bad people. It&#x27;s about bad risk models.)<p>That&#x27;s the underlying basis of the culture problem. Once investors start accepting that some debt instruments will routinely go bust, perverse incentives appear. Then you get Milken, Boesky, LTCM, and Enron. (Not Madoff; Madoff was a straight Ponzi scheme.) The paper tries to tie this to financial culture.
    That&#x27;s not wrong. But it&#x27;s not the basis of &quot;postmodern capitalism&quot;.<p>All this is to some extent a result of tax policy. Interest received is taxed much more favorably than stock dividends. That encourages debt financing, equity to debt conversion, high-risk lending, and leveraged buyouts. (&quot;Private equity&quot; is mostly leveraged buyouts. Usually the private buyer doesn&#x27;t have the funds for an all-cash deal.) The line between debt and equity has been blurred. Both are ways to pay for money, but with different tax treatment. There are instruments such as convertible bonds which combine aspects of debt and equity. This effect is so strong that the number of publicly traded companies in the US is down, while the number of tradable financial instruments is way up.<p>So, the paper is incomplete in that it fails to identify how tax policy increased Wall Street&#x27;s appetite for risk.
