  text: "&gt; Is this money not understood by the tech giants taking on the debt?<p>There&#x27;s
    a game-theoretic way of modelling this situation called, from memory, a modified
    Dutch auction. The way it works is that the winner pays the difference between
    their bid and the next highest bid, and so on all the way down. It models the
    way in which players are motivated to extend themselves almost infinitely in an
    attempt to win something unwinnable (what are the success criteria for &quot;winning
    the AI race&quot;, in other words how do you know when you&#x27;ve &quot;won&quot;?
    And what do you get for &quot;winning&quot;?)."
