  author: wolvoleo
  text: There&#x27;s a lot of insanely silly AI products and services that have absolutely
    no use in the real world whatsoever. In that sense it&#x27;s very very similar
    to the dotcom crash. And the crypto &quot;blockchain&quot; boom. And the metaverse.
    Remember when we all put blockchain on our CVs somewhere or we&#x27;d be unhireable?
    Who&#x27;s talking about that now?<p>The Google and antrhropics of today are the
    ISPs of back then. They didn&#x27;t go anywhere. It was more the services on top
    of that that crumbled because they had nothing real to offer. I see the same here.<p>In
    2001 society wasn&#x27;t ready. People didn&#x27;t yet want to order their groceries
    online or read books off a screen. The computers weren&#x27;t ready, they were
    slow, heavy and clunky. The smartphone still needed to be invented. Mobile networks
    needed to come around, the miniaturisation of GPS, cameras. These things can&#x27;t
    be rushed and that realisation popped the bubble. In the end they did happen,
    but in their own time.<p>I see so much of that now. We must have AI in our product!
    How, why, what value does it add? Who cares! It must be AI or we&#x27;re out of
    the race!! That&#x27;s really the hallmark of a bubble.<p>Here again, the usecases
    aren&#x27;t fleshed out yet (except coding). The tech isn&#x27;t finished, it&#x27;s
    all very hit and miss, hallucination, loss of control (agents hacking) etc. The
    people certainly aren&#x27;t ready, we need time to adapt society to new technology
    and a couple years isn&#x27;t going to cut it. But these investors aren&#x27;t
    investing this much to see a return in 2035. They want it much sooner. Sooner
    or later that will dawn on them and they start pulling out.
