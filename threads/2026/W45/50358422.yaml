    datacenters in web 1.<p>For reference this &#x27;massive build-out&#x27; resulted
    in, according to a Berkeley study I found, 500MW of total datacenter power in
    the US across 320 locations at end of 2020. This wasn&#x27;t too much for very
    long: as of 2005, according to Tier1 there were 511 datacenters. And it was likely
    only really a year or two: Dupont&#x27;s VA3 utilization numbers published it
    at 50% utilization in 2003, 89.4% in 2004, then full thereafter.<p>Meanwhile,
    these infrastructure improvements allowed, for example, things like the iPhone
    to be built and deployable -- there was 3g, there were a LOT more web devs that
    could create the early (web only) apps the iPhone needed to compete. This in turn
    allowed another round of investment to be built on top of all of that.<p>On the
    capital side, investors were also able to buy Amazon at around $1 &#x2F; share.
    AAPL at iPhone launch was $7&#x2F;share. I haven&#x27;t split adjusted either
    of these, this is just from memory.<p>I don&#x27;t think a bust was necessarily
    <i>good</i> but the boom undeniably built out infrastructure, a small fraction
