    and they lose their jobs and probably their incentives. The most legible way for
    leaders to show they’re in the AI race is to spend money on AI infra, even if
    it means taking on debt to do so.<p>So if this is in fact a bubble, nobody can
    really act differently until the market stops treating AI spending as a winning
    strategy.
