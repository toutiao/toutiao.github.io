    functions.\n\n- AAmara Abaraamara@example.compassword\n\n- EElif Demirelif@example.compassword\n\n-
    IInes Duarteines@example.compassword\n\nThe Firebase and Cloud Storage APIs, with
    Security Rules evaluated natively, firestore.get() included.\n\n- cap.svgimage/svg+xml404
    B\n\n- hoodie.svgimage/svg+xml408 B\n\n- mug.svgimage/svg+xml404 B\n\nHTTP, callable
    and streaming functions, and every trigger: Firestore, Storage, Auth, Pub/Sub,
    Eventarc, schedules and task queues. Code reloads on save.\n\nEvery RPC over gRPC
    and HTTP/JSON: push, ordering, filters, dead-letter topics, seek, snapshots and
