    less\n\nThe app holds 211,205 Firestore documents and 6.7 GB in Storage; both
    emulators ran on one server. Firenook answered 25 of 26 query shapes faster and
    tied on the last. How it was measured.\n\n## Your data stays where you left it\n\nAdd
