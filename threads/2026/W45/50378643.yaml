    behaviour.\n\nCustom events delivered to onCustomEventPublished, and the Firebase
    services’ own.\n\nExtensions from local, vendored or registry sources, offline
    once vendored.\n\nThe orders, users, files and calls above are from a run of the
    demo project, as Firenook returned them. Realtime Database, Hosting, App Hosting
    and Data Connect are not emulated; a firebase.json that configures them still
    starts, with a warning. What each service covers.\n\n## Measured on a real application\n\nTwo
    hours of a production app’s traffic against each emulator in turn, every operation
