  author: CharlieDigital
  text: 'Sharing my perspective as a big time user of Firebase:<p>1. It is practically
    free for a lot of my projects.  Yes, there are also other free platforms out there
    now, but because Firebase is largely an abstraction on GCP, I have more reach
    if I need to scale it or move it into a more capable backend that I have full
    control over (very natural progression from Firebase -&gt; Cloud Run -&gt; GKE
    Autopilot -&gt; GKE).  For a few use cases, I do pay (e.g. keep a warm Function
    for an auth flow).<p>2. Firebase auth is still really, really good.  It is super
    easy to get SSO working with Firebase auth.  End of the day, it is largely (entirely?)
    just an abstraction on top of Google OAuth API, but it is by far the easiest and
    most foolproof of the solutions on Azure, AWS.  And again, for most use cases,
    it is entirely free.<p>3. A well-designed Firestore backend is for all intents
    and purposes free for side projects and can still scale without the need to overthink
    it.  I have had a few projects that had big Reddit spikes and Firestore just swallows
    the volume like a champ (that would have swamped a small Pg instance).  I have
    run several side projects, blogs, etc. for years purely on Firebase because Firestore&#x27;s
    free tier is really, really generous and when you pass those limits, the pricing
    is still reasonable.  Ridiculously generous.<p>4. Firestore gives you real-time
    websockets with no additional infra needed and again, practically free for most
    side projects.  Cloudflare now has PartyKit which fills the same niche, but Firestore&#x27;s
    real-time subscriptions are nice because of how integrated they are into the backing
    store.  Amplify&#x27;s AppSync (when I used it last) was janky AF; did not like
    it at all and did not like the fake relational abstraction over DynamoDB (dangerous
    at scale).  Azure SignalR, Web PubSub, and Fluid Relay are not free or they are
    not usable at the free tier beyond initial sandboxing.<p>5. It is easy to operate.  If
    you want to run directly on a hyperscaler cloud (AWS, Google, Azure), Firebase
    is the best tooling.  Azure doesn&#x27;t really have an equivalent.  AWS killed
    off their Copilot CLI[0] which I felt like was approaching the utility of Firebase
    and not a fan of Amplify (which seems to have changed direction recently).  I
    was a fanboy of CosmosDB, but Microsoft refused to ship a working ARM64 emulator
    version for YEARS[1] which made it unusable on Mac.  I am comfortable operating
    at any layer of any of AWS, Azure, GCP, but most of the time I only want to when
    I need to.  So Firebase lets me ship something fast, but drop down into the underlying
    cloud infra when I need to.<p>6. Until recently, the other platforms did not have
    great options for emulation.  I think AI has changed that and now we are seeing
    more proliferation of platform emulators.  LocalStack, for example, had already
    locked some of their emulation behind paid licenses.  Firebase emulators were
    pretty complete in terms of what was needed to build and ship an app end to end.  The
    OAuth emulator is still really, really nice.<p>[0] <a href="https:&#x2F;&#x2F;aws.github.io&#x2F;copilot-cli&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;aws.github.io&#x2F;copilot-cli&#x2F;</a> : literally
    their best infrastructure tooling and they killed it....................<p>[1]
    <a href="https:&#x2F;&#x2F;github.com&#x2F;Azure&#x2F;azure-cosmos-db-emulator-docker&#x2F;issues&#x2F;17"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;Azure&#x2F;azure-cosmos-db-emulator-docker&#x2F;iss...</a>'
