    6s · 5 calls · 1 failed o console r reload ? keys q quit\n\n$ npx firebase emulators:start\n\nFirenook’s
    own screen, recorded from 0.2.0 on a demo shop: it starts with the 1.2 million
    documents, 64,000 users and 5,400 files it kept from its last run, takes two orders,
    and shows a webhook that fails, with its stack trace.\n\n## Change one word\n\nSame
    flags, same ports, same export format. Your project stays as it is, and firebase-tools
    stays for deploying.\n\npackage.json\n\n- \"emulators\": \"firebase emulators:start
