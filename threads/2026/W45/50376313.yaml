  author: jephs
  text: No! Not yes exactly!<p>You&#x27;ve slightly missed the point (for a similar,
    adjacent point). Chain of thought monitors are a worry even when there&#x27;s
    no vector space path from the output at index t to the input at index t+1. Rather,
    the fear is that if you explicitly penalize some CoT pattern, you&#x27;re encouraging
    the network to <i>do whatever it was going to do anyhow, but in a way you can&#x27;t
    catch</i>.<p>Say you&#x27;ve noticed that when your LLM cheats, it usually happens
    after the string &quot;Hmm, let&#x27;s try cheating&quot; occurs in the CoT. So
    you think, hey, let&#x27;s just apply a -1 reward penalty whenever we see that
    string! The model learns to keep cheating, but instead of <i>telling you</i>,
    it now prefaces reward hacking with strings like &quot;Let&#x27;s make sure we&#x27;re
    doing this the way the user intended.&quot; Still cheats, but now you can&#x27;t
    detect it with a cheap pattern matching alert. Oops.
  score: 0
