  author: dontlikeyoueith
  text: Because it can make the CoT not mean what it says.<p>Remember that tokens
    are just arbitrary symbols.  There are infinite possible interpretations of those
    symbols based on whatever rules you choose to apply to the interpretation of the
    symbols (for a model, these interpretation rules make up the model weights, effectively).<p>When
    you grade the CoT, you are training the model to produce the symbols in the CoT
    that you want it to produce.  At the same time though, you&#x27;re also training
    it on the output symbols.  When you optimize only the output symbols, all the
    model weights are dedicated to same interpretation rules that apply to the output.  This
    means CoT symbols mean (mostly) the same thing as output symbols.<p>But if you
    optimize BOTH, the model can learn different interpretation rules for CoT than
    it learns for output.  Which means the same phrase in the CoT doesn&#x27;t necessarily
    mean the same thing to the model as it would in the output.<p>In effect, the model
    can learn to lie to you in its CoT.
  score: 0
