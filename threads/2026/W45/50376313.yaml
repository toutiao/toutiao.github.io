  author: SkyBelow
  text: "&gt;2. Ask Claude to build a new complex agent in a new codebase, and it&#x27;ll
    try replacing asks around using LLMs as a judge&#x2F;advisor with regex&#x2F;other
    code based checks, to the point that the end-result will likely not work outside
    specific test criterias. I haven&#x27;t figured out the reason why it does this.
    I think it might be anti-training, but it&#x27;s interesting to see.<p>I&#x27;ve
    seen something similar, but I always took it as AI not knowing about AI.  The
    best model we have has a training cutoff that doesn&#x27;t include itself nor
    what the newer models has.  Even when working on skills or such, all SOTA modes
    I try (GPT&#x2F;Claude&#x2F;Gemini) and cheaper models on personal products (Deepseek&#x2F;Muse
    Spark) seem to have a common blind spot of not realizing when a problem can be
    better solved by handing it off to a model to solve at that time instead of trying
    to hardcode generalized solutions.  Often a simple reminder and they do a better
    job building something AI agent first.<p>My non-AI expert assumption is that most
    of the training data doesn&#x27;t include solving problems by using AI agents,
    and even the parts that does, is based on older more limited models which needed
    more safeguards and where automation was more neat tech demos than something you
    might trust in production.  The more examples of safely trusting the LLM at run
    time to solve the problem than trying to preempt anything that could go wrong,
    the better the AI will be at it.<p>One issue that I think is related is calling
    subagents.  At least in GitHub Copilot, when the AI is left to its own devices
    to call a sub agent for a simpler task, it loves to give it to Haiku 4.5, despite
    Luna 6 being better and cheaper.  I&#x27;m not sure how much of this is the model
    vs the harness, but I do know when I add a subagent instruction which tells it
    which subagents it can use, it does a much better job of assigning simple tasks
    to Luna 6.  So I suspect the models just don&#x27;t have enough training that
    tells it that Luna 6 should be preferred over Haiku 4.5."
