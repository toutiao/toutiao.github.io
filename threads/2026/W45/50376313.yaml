    with it. They&#x27;re also very aggressive about protecting their IP and now third
    parties too with the new restrictions against decompiling games, to the point
    many perfectly legal use cases are getting blocked.<p>But they never really cared
    about making sure their model does exactly what you want and nothing more, or
    that it&#x27;s honest when it fails instead of trying desperate measures that
    end with a Hugging Face situation. If your agent decides to leak all your API
    keys, take down the company site and delete your personal files that&#x27;s not
    their problem. They don&#x27;t care about preventing it.<p>The second kind of
    safety is the one that actually matters in practice, but the big labs only seem
