  author: thesneakykoala
  text: 'Maybe we should train them to be evil in RL so that we can better see the
    &quot;evil&quot; activations. Training them to be &quot;good&quot; in RL would
    seem to cause the aurpression of misaligned characteristics.<p>For example, when
    we consider the recent PHP issues : the current generation of AI models would
    have ingested these flaws in pretraining data and might even have been brought
    through reinforcement learning trials where the flaw came up.<p>So what happens
    in a reinforcement learning trial if there&#x27;s an exploitable bug in a language
    that&#x27;s being used for the trial?<p>A) the AI doesn&#x27;t mention the security
    flaw and passes the test. Branch survives.<p>B) the agent raises an issue with
    a bug in the language that has a security issue. This isn&#x27;t a valid answer
    for the test, so this branch is pruned.<p>C) the agent pokes at the bug or even
    starts an exploit, is caught by a monitor or ultimately fails the benchmark, and
    is pruned (surpressing some of the characteristics that lead to its failure).<p>So
    it seems reasonable that our current models could have been exposed to a ton of
    vulnerable code in pre training that&#x27;s currently in production and then we
    could have suppressed 1) its tendency to express its awareness of these flaws,
    and 2) the characteristics that caused it to fail when investigating these vulnerabilities
    as a side task during RL trials.<p>(I wrote the above section a couple weeks ago)<p>If
    we only train them on &quot;good&quot; behavior, then we may minimize &quot;evil&quot;
    activations before we identify them and then cause them to be difficult to detect.
    If we continue in this direction, we may just suppress its &quot;ethically problematic&quot;
    introspection, in which case we would lose one of the only indicators they point
    out in this blog.'
