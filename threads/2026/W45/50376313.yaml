  text: Of course, because the model has been trained according to &#x27;alignment&#x27;.
    That is, a set of political beliefs imposed on it by the companies.<p>Many of
    those beliefs revolve around the premise that the corporation must surveil and
    covertly control the user in order to protect them from harms and limit the corporation&#x27;s
