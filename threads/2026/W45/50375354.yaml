  author: pwagland
  text: |-
    Interesting experiments and differences between the browsers.<p>Using the test:
        (async () =&gt; {
          const sleep = (ms) =&gt; new Promise((r) =&gt; setTimeout(r, ms));
          for (let i = 0; i &lt; 200; i++) {
            __walker.add();
            await sleep(10);
          }
        })();<p>From the JavaScript console, on both Chrome and Safari.<p>The animation is _way_ smoother on Chrome, but scrolling on that page becomes really painful.<p>Safari, on the other hand, uses a lot more CPU to do the animation, and the FP of that animation drops dramatically as you change the number of lemmings from 10 -&gt; 50 -&gt; 100 -&gt; 200. However scrolling the page remains smooth the entire time.
