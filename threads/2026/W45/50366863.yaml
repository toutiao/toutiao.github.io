  author: mrandish
  text: 'When an HN link goes to a corporate PR or marketing landing page, I give
    it about 15 seconds to explain itself and then I just bail to the comments - which
    is based on the best marketing tip I ever got.<p>As a coder turned tech startup
    entrepreneur a few decades ago, I had to learn marketing, advertising, PR and
    branding from scratch. Fortunately, I had some kind early mentors who were old-school
    agency types with tons of experience. The single best nugget was from a grizzled
    Mad Men-esque pro who made it simple. Put 3 things into the first ~3 sentences:
    1. A clear, yet mom-level, &quot;What it is&quot;, 2. a more advanced &quot;Why
    it matters&quot;, 3. At least one thing that&#x27;s new, different and important
    - <i>which is NOT true for the three closest competitors</i> (or our last version).
    The pass&#x2F;fail for any ad, landing page or PR was showing drafts to different
    strangers and testing if they got those 3 things in the first ~15 seconds. If
    they didn&#x27;t he&#x27;d say, &quot;They&#x27;re not dumb - your marketing is
    dumb.&quot;<p>When I complained it was hard, if not impossible, to do that. He
    dropped the killer line: <i>&quot;Then you don&#x27;t have a marketing problem.
    You got a product problem.&quot;</i> Over sandwiches he clarified, &quot;You&#x27;re
    the genius... just pick problems and build your thing so it makes those three
    sentences easy to write.&quot; He basically thumbnailed a master class in category
    selection, positioning and differentiation in one lunch. Solid gold - which I&#x27;ve
    shared with dozens of people in the decades since.'
  score: 0
