  text: "&gt; Turboprop engines tell us nothing about how birds fly<p>That is not
    true.<p>Turboprop engines and flying birds are different things, but there is
    a set of common properties.<p>A blade of a screw propeller functions exactly in
    the same way as a flapping wing of a bird, except that the wing cannot rotate
    without limits around the body of the bird, so it must stop, change angles and
    revert the motion, while the blade can rotate continuously around the axis, functioning
    on one side like a falling wing and on the other side like a raising wing. The
    similarities between propeller blades and insect wings are even greater, because
    insect wings cannot change their shapes so much as those of birds.<p>For now,
    our understanding of the networks composed of the neurons of animals is much less
    advanced than our understanding of wings and propellers, which is why there is
    a much greater uncertainty about whether there are any similar mechanisms in biological
    neural networks and in LLMs."
