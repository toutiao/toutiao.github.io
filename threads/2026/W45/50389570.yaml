  author: pessimizer
  text: 'My objection is &quot;simpler.&quot; What&#x27;s so &quot;simple&quot; about
    a probabilistic model? It takes an enormous amount of calculations, so much that
    you have to predigest incoming information into high-level chunks in order to
    have any chance of calculating it over small inputs with reasonable effort.<p>A
    probabilistic model is the <i>most</i> complicated model. It doesn&#x27;t even
    attempt to model the problem, it just looks at the results of an enormous number
    of tries with different inputs, goes through them all, finds the most similar
    cases to the current input, and blends them together in a way that carefully avoids
    any self-contradictory or absurd result.<p>We see this plainly with LLMs. You
    train an LLM on a thousand times the (high-level, pre-digested) input that the
    average human has gotten, and the average human thinks it&#x27;s a hallucinating
    moron. It doesn&#x27;t start to converge on something that passes the smell test
    to you average human idiot until it has been trained on <i>a million</i> times
    the input the average human has gotten.<p>It&#x27;s not doing what a human does,
    it&#x27;s guessing what a human (or any system) might do when confronted with
    X input. They&#x27;re not even similar activities, even if they have identical
    output in the limit. It&#x27;s like confusing gravity for equations about gravity.
    Being able to make perfect predictions about the positions of moving, nearby frictionless
    spherical things in a vacuum at time t doesn&#x27;t tell us a thing about what
    gravity is. It tells us how it <i>looks.</i> It should, we distilled it by watching
    things for a very long time.<p>&gt; Is a probabilistic model not the only model
    able to deal with uncertainty?<p>No, <i>all</i> models deal with uncertainty.
    The <i>entire point</i> of a model is that it is what you know about a system
    when you don&#x27;t know its inputs. The variables in a model <i>are</i> uncertainty.
    The model is dealing with it.<p>edit: I think you&#x27;re interpreting &quot;uncertainty&quot;
    as a numerical probability. A numerical probability is an artifact of the set
    of data you&#x27;re calculating it from, not a thing with independent existence.
    &quot;Uncertainty&quot; is just a thing that you don&#x27;t know yet.<p>If you
    assume that &quot;uncertainty&quot; is a knowable numeric probability that contributes
    to some calculation, you&#x27;re begging the question when you say that the only
    way you can model it is through probabilistic calculations.'
