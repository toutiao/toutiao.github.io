  author: bux93
  text: 'I don&#x27;t think it&#x27;s the simplest, actually. Off the top of my mind:<p>Ternary
    logic is a super simple model; where true AND unknown equals unknown, and true
    OR unknown equals true. This deals with uncertainty and ambiguity, just not the
    probability; notionally you could say everything is 50-50.<p>Same thing if you
    have e.g. text-to-speech which returns &quot;the b??? dog&quot; rather than &quot;the
    (0.8:black, 0.1:blue, 0.1:boy) dog&quot; - no probabilities. Of course, maybe
    later in the processing you add probabilities back in.<p>Then there&#x27;s fuzzy
    logic, which uses scores that are typically numbers, but those don&#x27;t express
    actual probabilities, but more like vibes. They don&#x27;t necessarily add up
    to 1, for instance, and you don&#x27;t apply Bayes&#x27; formula to them, or even
    multiply them, you can use addition too - yolo.<p>Edit: and also of course backtracking,
    beam search, that sort of stuff - needn&#x27;t use probabilities, just heuristics.'
