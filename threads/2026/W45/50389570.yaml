  text: My point is that is not at all a counter example. It is left-edge deletion
    which is a distinct phenomenon which has been studied since the 70s. It might
    look like pro-drop to a naive person but it is fundamentally different. For example,
    you can delete plenty of things on the left edge that _aren&#x27;t_ pronouns and
    you can&#x27;t delete pronouns if they&#x27;re not on the left-most edge. These
    are things that don&#x27;t occur in pro-drop languages where you can always exclude
    the pronoun.<p>do you want a cracker -&gt; you want a cracker?<p>I think he is
    dumb -&gt; * I think is dumb<p>It&#x27;s a lazy dismissal from someone who doesn&#x27;t
