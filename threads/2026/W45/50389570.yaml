  content: "# On Chomsky and the Two Cultures of Statistical Learning\nAt the [Brains,
    Minds, and Machines](https://infinite.mit.edu/collection/mit-150-symposia) symposium
    held during MIT's 150th birthday party in 2011, Technology Review[reports](http://www.technologyreview.com/computing/37525/?a=f)that
    Prof. Noam Chomsky\n\n> derided researchers in machine learning who use purely
    statistical methods to produce behavior that mimics something in the world, but
    who don't try to understand the meaning of that behavior.\n\nThe [transcript](http://languagelog.ldc.upenn.edu/myl/PinkerChomskyMIT.html)
    is now available, so let's quote Chomsky himself:\n\n> It's true there's been
    a lot of work on trying to apply statistical models to various linguistic problems.
    I think there have been some successes, but a lot of failures. There is a notion
    of success ... which I think is novel in the history of science. It interprets
    success as approximating unanalyzed data.\n\n[![](https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Noam_Chomsky_portrait_2017_retouched.jpg/500px-Noam_Chomsky_portrait_2017_retouched.jpg
    \"Noam Chomsky\")](https://en.wikipedia.org/wiki/Noam_Chomsky)  \nNoam Chomsky\n\nChomsky's
    remarks were in response to Steven Pinker's question about the success of probabilistic
    models trained with statistical methods. This essay is a response to Pinker and
    Chomsky, and will address these questions:\n\n1. What did Chomsky mean, and is
    he right?\n2. What is a statistical model?\n3. How successful are statistical
    language models?\n4. Is there anything like their notion of success in the history
    of science?\n5. What doesn't Chomsky like about statistical models?\n\n## What
    did Chomsky mean, and is he right?\nI take Chomsky's points to be the following:\n1.
    Statistical language models have had engineering success, but that is irrelevant
    to science.\n2. Accurately modeling linguistic facts is just butterfly collecting;
    what matters in science (and specifically linguistics) is the underlying principles.\n3.
    Statistical models are incomprehensible; they provide no insight.\n4. Statistical
    models may provide an accurate simulation of some phenomena, but the simulation
    is done completely the wrong way; people don't decide what the third word of a
    sentence should be by consulting a probability table keyed on the previous words,
    rather they map from an internal semantic form to a syntactic tree-structure,
    which is then linearized into words. This is done without any probability or statistics.\n5.
    Statistical models have been proven incapable of learning language; therefore
    language must be innate, so why are these statistical modelers wasting their time
    on the wrong enterprise?\nIs he right? That's a long-standing debate. These are
    my short answers:\n1. I agree that engineering success is not the sole goal or
    the measure of science. But I observe that science and engineering develop together,
    and that engineering success shows that something is working right, and so is
    evidence (but not proof) of a scientifically successful model.\n2. Science is
    a combination of gathering facts and making theories; neither can progress on
    its own. In the history of science, the laborious accumulation of facts is the
    dominant mode, not a novelty. The science of understanding language is no different
    than other sciences in this respect.\n3. I agree that it can be difficult to make
    sense of a model containing billions of parameters. Certainly a human can't understand
    such a model by inspecting the values of each parameter individually. But one
    can gain insight by examing the _properties_ of the model—where it succeeds and
    fails, how well it learns as a function of data, etc.\n4. I agree that a Markov
    model of word probabilities cannot model all of language. It is equally true that
    a concise tree-structure model without probabilities cannot model all of language.
    What is needed is a probabilistic model that covers words, syntax, semantics,
    context, discourse, etc. Chomsky dismisses all probabilistic models because of
    shortcomings of a particular 50-year old probabilistic model. I understand how
    Chomsky might arrive at the conclusion that probabilistic models are unnecessary,
    from his study of the _generation_ of language. But the vast majority of people
    who study _interpretation_ tasks (such as speech recognition) quickly see that
    interpretation is an inherently probabilistic problem: given a stream of noisy
    input to my ears, what did the speaker most likely mean? Einstein said to make
    everything as simple as possible, but no simpler. Many phenomena in science are
    stochastic, and the simplest model of them is a probabilistic model; I believe
    language is such a phenomenon and therefore that probabilistic models are our
    best tool for representing facts about language, for algorithmically processing
    language, and for understanding how humans process language.\n5. In 1967, Gold's
    Theorem showed some theoretical limitations of logical deduction on formal mathematical
    languages. But this result has nothing to do with the task faced by learners of
    natural language. In any event, by 1969 we knew that probabilistic inference (over
    probabilistic context-free grammars) is not subject to those limitations (Horning
    showed that learning of PCFGs is possible). I agree with Chomsky that it is undeniable
    that humans have some innate capability to learn natural language, but we don't
    know enough about that capability to say how it works; it certainly could use
    something like probabilistic language representations and statistical learning.
    And we don't know if the innate ability is specific to language, or is part of
    a more general ability that works for language and other things.\nThe rest of
    this essay consists of longer versions of each answer.\n## What is a statistical
    model?\nA **statistical model** is a mathematical model which is modified or trained
    by the input of data points. Statistical models are often but not always probabilistic.
    Where the distinction is important we will be careful not to just say \"statistical\"
    but to use the following component terms:\n- A **mathematical model** specifies
    a relation among variables, either in functional form that maps inputs to outputs
    (e.g. _y_ = _m_ _x_ + _b_) or in relation form (e.g. the following (_x_, _y_)
    pairs are part of the relation). \n- A **probabilistic model** specifies a probability
    distribution over possible values of random variables, e.g., P(_x_, _y_), rather
    than a strict deterministic relationship, e.g., _y_ = _f_(_x_). \n- A **trained
    model** uses some training/learning algorithm to take as input a collection of
    possible models and a collection of data points (e.g. (_x_, _y_) pairs) and select
    the best model. Often this is in the form of choosing the values of parameters
    (such as _m_ and _b_ above) through a process of statistical inference.\n\n[![](https://upload.wikimedia.org/wikipedia/commons/9/99/ClaudeShannon_MFO3807.jpg
    \"Claude Shannon\")](http://en.wikipedia.org/wiki/Claude_Shannon)  \nClaude Shannon\n\nFor
    example, a decade before Chomsky, Claude Shannon [proposed probabilistic models
    of communication](http://cm.bell-labs.com/cm/ms/what/shannonday/shannon1948.pdf)
    based on Markov chains of words. If you have a vocabulary of 100,000 words and
    a second-order Markov model in which the probability of a word depends on the
    previous two words, then you need a quadrillion (10) probability values to specify
    the model. The only feasible way to learn these 10 values is to gather statistics
    from data and introduce some smoothing method for the many cases where there is
    no data. Therefore, most (but not all) probabilistic models are trained. Also,
    many (but not all) trained models are probabilistic.\n\nAs another example, consider
    the Newtonian model of gravitational attraction, which says that the force between
    two objects of mass_m_ and _m_ a distance _r_ apart is given by\n\n> _F_ = _G_
    _m_ _m_ / _r_\n\nwhere _G_ is the universal gravitational constant. This is a
    trained model because the grav"
