  text: Norvig (and Chomsky) are talking at cross purposes.<p>Norvig confuses engineering
    for science. If an engineer wants something that works (and guarantees that it
    will work) then you use the most effective tool available to achieve that goal.
    No problem there. But there&#x27;s absolutely no reason to think that tells you
    anything scientific about the phenomenon you&#x27;re modeling. For example, aeronautical
    engineering says very little about how birds fly. And - currently relevant - LLMs
    learn to use and understand language, but they use millions of times more training
    data, and millions of times more computing power, than a child does. So an LLM
    may be a great technology, but it&#x27;s probably not a good model for how humans
    learn and use language.<p>Chomsky OTOH doesn&#x27;t see any use for statistics
    in science, at least not in linguistics. Fortunately for the field of linguistics,
    Chomsky&#x27;s influence in linguistics is waning and linguists are beginning
    to use statistical tools to do science.
