  author: lo_zamoyski
  text: |-
    It&#x27;s more or less the classic clash of two modernist attitudes, that of the rationalist (Chomsky) and the empiricist (Norvig). The intellectual wound this division introduces is longstanding. However, I would say Norvig has the overall advantage.<p>1. Norvig is correct that observation and fact&#x2F;data collection are necessary for science. However, Chomsky is correct that the ultimate goal of science is to determine the principles governing something. Ergo: you need the first to do the second. The intellect abstracts from source data, but nothing is in the intellect that is not first in the senses.<p>2. Chomsky here is uninterested in things like speech - he only cares about the underlying syntax. But syntax - expressed and instantiated in matter - is known through speech, and probabilities presuppose an underlying determinate syntax. Ergo: a complete science of speech is end-to-end, from the &quot;reading&quot; or interpretation of noisy data through syntactic processing all the way through to expression.<p>3. Chomsky focuses heavily on internal <i>generation</i>. Norvig points out that <i>interpretation</i> is a separate, highly practical challenge. Figuring out what someone means in a noisy, ambiguous world is an exercise in prudence which involves weighing contingencies and probabilities to arrive at the most likely truth. Of course, this can only be done against a presupposed acceptance of the function of speech which is to communicate meaning and what is true (hence why lies work and why they are an abuse of speech).
    Probabilistic reasoning is still reasoning. It&#x27;s reasoning in the face of incomplete information (against a backdrop of presuppositions) which is a component of prudential reasoning.
