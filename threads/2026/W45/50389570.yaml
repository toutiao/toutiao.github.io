  author: mturmon
  text: Peter makes some excellent points in TFA and it’s a fun read.<p>But the situation
    has moved on, moving even further beyond the assertions Peter makes about the
    utility of the black-box generative approach.<p>In particular, LLMs are telling
    us a lot about those low-probability, never before seen sentences — it’s called
    CALU, the creative aspects of language use.<p>LLMs exhibit CALU; as we know they
    will happily create such sentences.  And inspecting the LLMs does provide insight:<p>“It
    does change the epistemic situation substantially. A working system can be inspected,
    perturbed, retrained, lesioned, and compared with other systems. Building is not
    understanding, but it gives understanding a strong foothold.<p>Explaining creative
    language use in LLMs would not, by itself, explain creative language use in humans.
    But the artificial case matters even if the mechanisms turn out to be substantially
    different. At a minimum, LLMs are an existence proof of one pathway by which open-ended,
    context-sensitive language can arise.”<p>For much more, see this substack by Chandra
    Sripada, a U of Michigan linguist:<p><a href="https:&#x2F;&#x2F;chandrasripada.substack.com&#x2F;p&#x2F;ai-and-the-retreat-of-mysterianism"
