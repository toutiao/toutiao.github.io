  author: SAI_Peregrinus
  text: musl libc violates the POSIX documented behavior of `crypt()`¹<p>&gt; Upon
    successful completion, crypt() shall return a pointer to the hashed password;
    the first two bytes of the returned value shall be those of the salt argument.
    Otherwise, it shall return a null pointer and set errno to indicate the error.<p>Musl
    returns &#x27;!&#x27; or &#x27;*&#x27;, not null.<p>¹<a href="https:&#x2F;&#x2F;pubs.opengroup.org&#x2F;onlinepubs&#x2F;9799919799&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;pubs.opengroup.org&#x2F;onlinepubs&#x2F;9799919799&#x2F;</a>
  score: 0
