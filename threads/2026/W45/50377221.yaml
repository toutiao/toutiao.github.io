  author: TheDong
  text: 'Wireguard allows effectively no configuration around auth, and so it&#x27;s
    more likely that it is configured in a secure manner.<p>Openssh allows: password
    auth with weak passwords, PAM with potentially insecure PAM modules, gssappi,
    configurable ciphers, etc. Wireguard has none of those.<p>Each of those auth methods
    adds more possible vulnerable code paths and accidentally insecure configurations.
    It&#x27;s very reasonable to believe that wireguard auth, since it has far fewer
    moving parts and configuration knobs, is likely to have fewer ways it can be insecure.'
  score: 0
