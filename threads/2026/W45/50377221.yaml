  author: bombcar
  text: Alpine matches the first.<p>Disabling PAM has been &quot;generally good security
    advice&quot; for decades; I remember suggestions to not use it in the 2000s.<p>Password
    logins are often enabled, especially on multi-user and default setups.<p>If alpine
    uses the * feature, it&#x27;s going to be pretty common. Gentoo has it, as does
    Ubuntu.<p>If password logins are enabled, you&#x27;re almost guaranteed to have
    at least one user with a password (root on all my boxes has one, even if I never
    use it and it&#x27;s random garbage).<p>So the cheese lines up pretty well, this
    affects quite a bit.<p>If password logins are enabled, someone almost certainly
    has a password.
