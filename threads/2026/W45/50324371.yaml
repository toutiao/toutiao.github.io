  author: Rendello
  text: |-
    Lowercasing is not guaranteed to be stable between Unicode versions. If you&#x27;re looking for stable string matching, use &quot;case folding&quot; instead. Instead of:<p><pre><code>    lower(a) == lower(b)             &#x2F;&#x2F; or,
        lower(needle) in lower(haystack)
    </code></pre>
    Use:<p><pre><code>    casefold(a) == casefold(b)             &#x2F;&#x2F; or,
        casefold(needle) in casefold(haystack)
    </code></pre>
    It&#x27;s equivalent to lowercasing in almost all cases, but with a stability constraint between across Unicode editions. As per the Unicode stability policy [1]:<p>&gt; <i>Case folding is not the same as lowercasing, and a case-folded string is not necessarily lowercase. In particular, as of Unicode 8.0, Cherokee has become a bicameral script with the introduction of lowercase Cherokee letters, but Cherokee text case folds to the existing uppercase letters. This case folding behavior for Cherokee text is precisely to guarantee continued case folding stability.</i><p>Casing in Unicode can be tricky. The case mapping FAQ [2] is a good place to start. If you need more information, start scanning through the Core Spec and following the case-related links [3].<p>1. <a href="https:&#x2F;&#x2F;www.unicode.org&#x2F;policies&#x2F;stability_policy.html#:~:text=Case%20Folding%20Stability" rel="nofollow">https:&#x2F;&#x2F;www.unicode.org&#x2F;policies&#x2F;stability_policy.html#:~:te...</a><p>2. <a href="https:&#x2F;&#x2F;www.unicode.org&#x2F;faq&#x2F;casemap_charprop.html#casemap" rel="nofollow">https:&#x2F;&#x2F;www.unicode.org&#x2F;faq&#x2F;casemap_charprop.html#casemap</a><p>3. <a href="https:&#x2F;&#x2F;www.unicode.org&#x2F;versions&#x2F;Unicode17.0.0&#x2F;core-spec&#x2F;chapter-3&#x2F;#G33992" rel="nofollow">https:&#x2F;&#x2F;www.unicode.org&#x2F;versions&#x2F;Unicode17.0.0&#x2F;core-spec&#x2F;cha...</a>
