article:
  url: https://shkspr.mobi/blog/2018/11/domain-hacks-with-unusual-unicode-characters/
  title: Domain hacks with unusual Unicode characters – Terence Eden’s Blog
  fetch_status: success
  content: "Unicode contains a range of symbols which don't get much use. For example,
    there are separate symbols for TradeMark - ™, Service Mark - ℠, and Prescriptions
    - ℞.\n\nNestling among the \"Letterlike Symbols\" are two curious entries. Both
    of these are single characters:\n\n- [Telephone symbol](https://en.wiktionary.org/wiki/%E2%84%A1)
    - ℡ \n- [Numero Sign](https://en.wiktionary.org/wiki/%E2%84%96) - № \n\nWhat's
    interesting is both .tel and .no are Top-Level-Domains (TLD) on the Domain Name
    System (DNS).\n\nSo my contact site - [https://edent.tel/](https://edent.tel/)
    - can be written as - [https://edent.℡/](https://edent.%E2%84%A1/)\n\nAnd the
    Norwegian domain name registry NORID can be accessed at [https://www.norid.№/](https://www.norid.%E2%84%96/)\n\nCopy
    and paste those links - they work in any browser!\n\n## [Is this limited to TLDs?](#is-this-limited-to-tlds)\n\nNo!
    This works ANYWHERE in a domain name. Copy and paste these examples:\n\n- Script
    https://ℰ\U0001D4B3\U0001D49Cℳ\U0001D4DFℒℰ.\U0001D49E\U0001D4DEℳ/\n- Math Bold
    https://\U0001D41E\U0001D431\U0001D41A\U0001D426\U0001D429\U0001D425\U0001D41E.\U0001D41C\U0001D428\U0001D426/\n-
    Fraktur https://\U0001D58A\U0001D59D\U0001D586\U0001D592\U0001D595\U0001D591\U0001D58A.\U0001D588\U0001D594\U0001D592/\n-
    Math bold italic https://\U0001D486\U0001D499\U0001D482\U0001D48E\U0001D491\U0001D48D\U0001D486.\U0001D484\U0001D490\U0001D48E/\n-
    Math bold script https://\U0001D4EE\U0001D501\U0001D4EA\U0001D4F6\U0001D4F9\U0001D4F5\U0001D4EE.\U0001D4EC\U0001D4F8\U0001D4F6/\n-
    Double struck https://\U0001D556\U0001D569\U0001D552\U0001D55E\U0001D561\U0001D55D\U0001D556.\U0001D554\U0001D560\U0001D55E/\n-
    Monospace https://\U0001D68E\U0001D6A1\U0001D68A\U0001D696\U0001D699\U0001D695\U0001D68E.\U0001D68C\U0001D698\U0001D696/\n-
    Super script https://ᵉˣᵃᵐᵖˡᵉ.ᶜᵒᵐ/\n- Sub script https://ₑₓₐₘₚₗₑ.cₒₘ/ **NB** not
    all characters supported \n- Math sans bold https://\U0001D5F2\U0001D605\U0001D5EE\U0001D5FA\U0001D5FD\U0001D5F9\U0001D5F2.\U0001D5F0\U0001D5FC\U0001D5FA/\n-
    Math sans bold italic https://\U0001D65A\U0001D66D\U0001D656\U0001D662\U0001D665\U0001D661\U0001D65A.\U0001D658\U0001D664\U0001D662/\n-
    Math sans italic https://\U0001D626\U0001D639\U0001D622\U0001D62E\U0001D631\U0001D62D\U0001D626.\U0001D624\U0001D630\U0001D62E/\n-
    Math Squared https://\U0001F134\U0001F147\U0001F130\U0001F13C\U0001F13F\U0001F13B\U0001F134.\U0001F132\U0001F13E\U0001F13C/
    **NB** the dot must not be squared \n- Circled https://ⓔⓧⓐⓜⓟⓛⓔ.ⓒⓞⓜ/ **NB** the
    dot must not be circled \n\nThere are a whole bunch more miscellaneous characters
    you can use:\n\n> * * *\n\n## [How does this work?](#how-does-this-work)\n\nMagic!
    Which is to say, I _think_ it is the browser doing the conversion. DNS Servers
    don't successfully reply to queries about .℡ domains.\n\nThe browser sees the
    .℡ and then follows the IDNA2008 process listed in [RFC5895](https://tools.ietf.org/html/rfc5895)
    to normalise it:\n\n> map characters to the \"Simple\\_Lowercase\\_Mapping\" property
    (the fourteenth column) in \\<[http://www.unicode.org/Public/UNIDATA/UnicodeData.txt](https://www.unicode.org/Public/UNIDATA/UnicodeData.txt)\\>,
    if any.\n\nThe ℡ entry is:\n\n`2121;TELEPHONE SIGN;So;0;ON;<compat> 0054 0045
    004C;;;;N;T E L SYMBOL;;;;`\n\nU+0054 is T, U+0045 is E, U+004C is L.\n\nYou can
    test this in Python using:\n\n    python -c 'import sys;print sys.argv[1].decode(\"utf-8\").encode(\"idna\")'
    \"℡\"\n\n## [Does this work?](#does-this-work)\n\nYes! I asked people on Twitter
    whether they could access my website using a .℡ - and it appeared to work on every
    modern browser and operating system.\n\n> * * *\n\nIt even works on command line
    tools like `wget` and `curl`.\n\n> * * *\n\nIt does fail in some circumstances:\n\n>
    * * *\n\n## [What are the limitations?](#what-are-the-limitations)\n\nTwo main
    ones:\n\n- Sites like Twitter and Facebook don't recognise it as a valid URl and
    refuse to auto link it.\n- Some command line tools like `dig` and `host` don't
    understand it \n\n     ![](https://shkspr.mobi/blog/wp-content/plugins/tempest-highlight/svg/bash.svg)
    Bashdig edent.℡\n    \n    ; <<>> DiG 9.10.6 <<>> edent.℡\n    ;; global options:
    +cmd\n    ;; Got answer:\n    ;; ->>HEADER<<- opcode: QUERY, status: NXDOMAIN,
    id: 55282\n\n## [Is this useful?](#is-this-useful)\n\nObviously yes. This may
    be the most important discovery of the decade. You get cool looking URls and get
    to save a couple of characters on specific domains, at the _minor_ expense of
    working inconsistently.\n\nIt could also be used for evading URl filters.\n\nEvery
    modern browser supports these \"fancy\" domain names - but most websites won't
    automatically link to them. So sharing on Facebook doesn't work.\n\n## [Where
    can it be used?](#where-can-it-be-used)\n\nHere are the single characters which
    can be normalised down to a valid TLD. They're mostly country codes, but there
    are a few interesting exceptions:\n\n- `㏕` - US Military \n- `℡` - .tel registry
    \n- `№` - Norway \n- `㍳` - Australia \n- `㍷` - Dominica \n- `㎀` - Panama \n- `㎁`
    - Namibia \n- `㎃` - Morocco \n- `㎊` - French Polynesia \n- `㎋` - Norfolk Island
    \n- `㎏` - Kyrgyzstan \n- `㎖` - Mali \n- `㎙` - Federated States of Micronesia \n-
    `ﬁ` - Finland \n- `㎜` - [Myanmar](https://en.wikipedia.org/wiki/.mm)\n- `㎝` -
    Cameroon \n- `㎞` & `㏎` - [Comoros](https://en.wikipedia.org/wiki/.km)\n- `㎰` -
    Palestine \n- `㎳` - Montserrat \n- `㎷` & `㎹` - Republic of Maldives. \n- `㎺` -
    Palau \n- `㎽` & `㎿` - Malawi \n- `㏄` - Cocos (Keeling) Islands \n- `㏅` - Democratic
    Republic of Congo \n- `㏉` - Guyana \n- `㏗` - Philippines \n- `㏘` - Saint Pierre
    and Miquelon \n- `㏚` - Puerto Rico \n- `㏛` - [Suriname](https://en.wikipedia.org/wiki/.sr)\n-
    `㏜` - El Salvador \n- `℠` - San Marino \n- `™` - Turkmenistan \n- `ﬆ` & `ﬅ` -
    São Tomé and Príncipe \n- `㎇` - Great Britain ( [Obsolete](https://en.wikipedia.org/wiki/.gb))
    \n- `ß` - South Sudan ( [Not available](http://www.iana.org/domains/root/db/ss.html))
    \n- `㏌` - India and Indiana (subdomain of .us) \n- `Ⅵ` & `ⅵ` - Virgin Islands
    and Virginia (subdomain of .us) \n- `ﬂ` - Florida (subdomain of .us) \n- `㎚` -
    New Mexico (subdomain of .us) \n- `㎵` - Nevada (subdomain of .us) \n- `㍵` - As
    part of [.ovh](https://en.wikipedia.org/wiki/.ovh)\n\nIf you can find any more,
    please stick a comment in the box below.\n\nYou can always reach this blog post
    at:\n\nhttps://\U0001F142\U0001D58D\U0001D424ₛᵖ\U0001D493.ⓜ\U0001D560\U0001D483\U0001D4F2/\U0001F186\U0001F183\U0001F175/\n\n*
    * *\n\n* * *"
