  author: akersten
  text: 'Oh, it can. In fact there&#x27;s an entire official tome of documentation
    describing how to carefully do Unicode-in-URLs to reduce the risk[0]. Browsers
    also have some mitigations to avoid the most common issues like homoglyph attacks
    where they show the domain in punycode if it doesn&#x27;t match some local heuristic
    (like if you&#x27;re in en-US, it&#x27;s unlikely you&#x27;re actually trying
    to visit a site with Cyrillic letter &quot;a&quot; instead of ASCII &quot;a&quot;).<p>It&#x27;s
    implemented because we have thousands of writing systems and we decided, for better
    or worse, we want to reflect those in URLs. Solving the subsequent security issues
    is likely easier than getting everyone to agree to read and write the same language.<p>[0]:
    <a href="https:&#x2F;&#x2F;www.unicode.org&#x2F;reports&#x2F;tr36&#x2F;tr36-10.html"
    rel="nofollow">https:&#x2F;&#x2F;www.unicode.org&#x2F;reports&#x2F;tr36&#x2F;tr36-10.html</a>'
  score: 0
