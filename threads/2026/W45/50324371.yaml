  author: TacticalCoder
  text: 'Which of course Bruce Schneier predicted in 2000:<p><a href="https:&#x2F;&#x2F;www.schneier.com&#x2F;crypto-gram&#x2F;archives&#x2F;2000&#x2F;0715.html#9"
    rel="nofollow">https:&#x2F;&#x2F;www.schneier.com&#x2F;crypto-gram&#x2F;archives&#x2F;2000&#x2F;0715.html...</a><p><i>&quot;Unicode
    is just too complex to eve be secure&quot;</i><p>As to me I&#x27;m running my
    own DNS resolver (I use <i>unbound</i>) and everything goes through port 53 UDP
    (and AIUI technically 53 TCP should be allowed, but nothing will happen if you
    just block it), unencrypted. What then unbound does on the Internet, that&#x27;s
    up to you: you can encrypt those requests...<p>The nice thing with everything
    being in the clear, is that you can null route &#x2F; NX DOMAIN every single domain
    that uses Unicode (punnycode) characters and you can even do that at the firewall
    level, by inspecting UDP packets.<p>Of course you gotta be sure to really block
    DoH &#x2F; DoT internally but it&#x27;s all doable.<p>I set that up years ago
    and I&#x27;ve been running like that since then without any issue.<p>Just as entire
    countries&#x27;s IP blocks do not exist in my world, domains using Unicode characters
    do not exist. And I really don&#x27;t care about your feelings about it: I&#x27;m
    just explaining that technically it can be done to block them all and that the
    Internet keeps working just fine.<p>Unicode <i>really</i> is just too complex
    to ever be secure. And those who don&#x27;t understand that are part of the problem.'
