  author: AlexandrB
  text: A lot of modern remakes become &quot;demakes&quot;. Often a remake focuses
    on surface level improvements, like graphics, but damages the underlying game
    systems that made the original beloved in the first place. Another common problem
    is lazy graphics upscaling that improves the resolution but makes the result look
    cheap or incongruous with the game&#x27;s original style (GTA3 remastered is a
    great example[1]). I think there are a handful of truly great remakes a bunch
    of mediocre ones and a surprising number of total disasters like Warcraft 3.<p>But
    probably the worst trend with modern remakes is taking the original games off
    of online stores or &quot;upgrading&quot; them to the remake thus making the original
    unavailable. Combined with the &quot;demakes&quot; trend above and it seems like
    we&#x27;re actively destroying many historical games with these &quot;remakes&quot;.<p>[1]
    <a href="https:&#x2F;&#x2F;www.digitalfoundry.net&#x2F;articles&#x2F;digitalfoundry-2021-grand-theft-auto-3-definitive-edition-the-good-the-bad-and-the-ugly"
