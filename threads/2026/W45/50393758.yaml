  author: deadbabe
  text: This goes beyond just the press really.<p>The myth of the solo creator who
    heroically makes something amazing has a romantic appeal to a lot of people, especially
    those who dream of doing such a thing themselves someday. In truth, all great
    things in history have many collaborators and what we think of as the “creator”
    is often just a person who played the role of bringing together the collaborators,
    with perhaps a few other direct contributions.<p>But in the AI era, this solo-creator
    myth can now become reality, or if you are more cynical, just an even deeper delusion
    that exploits the non-consensual labor of millions for one’s personal benefit.
