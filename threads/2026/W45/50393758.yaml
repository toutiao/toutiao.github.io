  author: lopsotronic
  text: 'While most of the country was all <i>Glass Em!</i> post-9&#x2F;11, a few
    of us were sort of amazed that it took so long.<p>It wasn&#x27;t just misanthropy
    on our part.<p>Zooming out, macrohistorically[1], the amount of destruction that
    can be controlled by the individual soldier has increased, steadily at first,
    then exponentially in the modern era. Obviously the extreme example would be something
    like SADM[2], but this increase also includes the multiplying complex systems
    of the modern world - bulk ammunition, heavy vehicles, commercial aircraft. As
    the numbers needed for X level of destruction decreases, the span of viable ideologies
    increases; it&#x27;s easier to convince 12 guys of nutty ideas than it is to convince
    12,000. So, in the big view, the idea of big cultural icons getting flattened,
    this is something scifi has been kicking around for a while now. One could argue
    it&#x27;s a significant pillar of &quot;cyberpunk&quot; worldbuilding: the persistent
    presence of the &quot;crazies&quot; wielding the modern tools of fuel, bullets,
    and nuclear bombs.<p>[1] Which is definitely the perspective of the <i>Deus Ex</i>
    creative team.<p>[2] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Special_Atomic_Demolition_Munition"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Special_Atomic_Demolition_Muni...</a>'
