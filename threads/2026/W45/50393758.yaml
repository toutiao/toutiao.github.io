  author: glenstein
  text: 'I had a subscription to PC Gamer and saw it was named Game of the Year. I
    got it from Wal Mart, a beautiful shiny box, and inside was a fake newsletter
    about events in the game world, I think the paper that Joe Greene, an in-game
    character, wrote for.<p>I had no idea what I was in for, and as a 15 year old,
    I felt twists and surprises, and organic game reactions to things I did that blow
    my mind even today, and imo still haven&#x27;t been matched. And leveling and
    skills truly mattered and were tied into the game. Inventory management and ammo
    was interesting, the interface was perfect. It also had a kind of intellectual
    curiosity (characters talking competently about surveillance state and capitalism!)
    in the dialog that I only ever felt in, say, Alpha Centauri and later, Disco Elysium.
    It&#x27;s still the best PC game ever imo.<p>Edit: I think the most important
    thing about its legacy now, is that it engaged with conspiracies in a fundamentally
    different way, more like 90s X-Files style fascination and curiosity than anti-intellectualism
    of Alex Jones-style rabid misinformation. A critical nuance that gets lost when
    conspiracy cranks try to claim Deus Ex as theirs.<p>Edit 2: Respectfully, contra
    the article, if anything I think there&#x27;s not enough hagiography surrounding
    Deus Ex. It&#x27;s either beloved or not known, and the latter is the crime that
    needs rebalancing as it represents an example of what&#x27;s possible in passion
    project game design that I think is just as important as it ever was. That matters
    infinitely more to me than sidecar questions of how more or less &quot;living&quot;
    it&#x27;s game world was relative to its predecessor System Shock. I also think
    the analysis is a little bit off to criticize DX&#x27;s three-choice ending as
    being too on-rails relative to System Shock, which is a one-stop boss battle that
    lasts like 15 seconds.'
