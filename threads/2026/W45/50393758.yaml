  author: stego-tech
  text: Remains one of my favorite games ever, even as current events make it difficult
    to return to at present (it used to be a yearly replay over my winter holidays).<p>One
    thing strikes me however, as perhaps revealing my own naïveté:<p>&gt; Lurking
    in the accusations against “wealthy bankers” is the oldest, ugliest conspiratorial
    trope of all, the idea — stemming from the 1903 forgery “The Protocol of the Elders
    of Zion” — that a cabal of Jews secretly run the world.<p>I never made that connection
    until <i>literally</i> reading this piece. Bankers weren’t all Jews, and not all
    Jews were Bankers. I had heard the stereotype, sure, but I never read said stereotype
    into such conspiracies or narratives. It just made <i>logical sense</i> that a
    newly-emerged global society formed around currency and trade would be manipulated
    by those people who specialize in said sectors, i.e. bankers and financiers. The
    fact said individuals continue having outsized import on daily news and current
    events almost cements the plot point as real prophecy instead of antisemitic nonsense,
    but I can also see how bad actors would tie hate speech to current events to boost
    their own platforms.<p>Just an odd bit of reflecting, is all.
