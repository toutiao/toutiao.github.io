    (Lua), and AppleScript at various points in time... having to learn and use a
    special CLI command to append text to a file feels like overkill.<p>Having to
    use an LLM to search text also feels like overkill. One of the things I like markdown
    notes for is the simplicity of it. I can just use grep if I want. I can open the
    files on a computer from 1990 or 2090 and it will work. Having to bring in all
    these other tools into the mix hurts that utility. At that point, I might as well
    just use Apple Notes.
