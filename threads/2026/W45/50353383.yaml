  text: I&#x27;d rather buy (if it&#x27;s actually some semblance of ownership) a
    very good app made by people who spend their time keeping it good, then attempt
    to think I&#x27;m the best one to make all of my software. If it&#x27;s a subscription
    for something that&#x27;s not necessarily great and it can be remade cheaply and
    maintained with low overhead, then the answer is clearer.<p>I see people vibing
    out markdown apps like they take their morning shit, while I just paid Bear a
    small amount of money and have gleefully used it every day for 10 years, and I
    hope to continue to use it for at least the next 5.<p>Part of maturity for me
    over the years has been picking my battles carefully and reducing the things I
    feel I need to be opinionated about or responsible for. Not every piece of software
    needs to be perfectly customizable for my workflow or the fastest or embody some
    esoteric philosophical ideal. Being forced to do anything is a rarity unless your
    job requires you to use SharePoint or Notion or whatever
