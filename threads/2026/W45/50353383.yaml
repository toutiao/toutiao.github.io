  url: https://blog.bear.app/2026/11/bear-turns-10-and-it-still-feels-like-day-one/
  title: Bear turns 10, and it still feels like day one – Bear
  fetch_status: success
  content: "Back in 2013, three friends who loved Apple and design couldn’t find a
    notes app they liked, so they built their own. That side project became Bear.
    It arrived on the App Store in November 2016, and within a year it had been named
    Mac App of the Year and won an Apple Design Award. This November, the little Bear
    turns 10. Today it helps millions of people around the world capture their ideas
    and organize their lives every day, and we’ve felt so much love and support from
    all of you along the way.\n\nBear 1.0\n\n### The idea\n\nWe couldn’t find a notes
    app that fit how we write, so we started building our own.\n\nWe built it in our
    spare time. Our day job back then was building apps and websites for clients.\n\n###
    First prototype\n\nOur friends loved it. Would everyone else?\n\n### Launch day!\n\nBear
    arrives on the App Store and hits #1 on Product Hunt.\n\n### Mac App of the Year\n\nApple
    names Bear its Mac App of the Year.\n\n### Apple Design Award\n\nBear wins a 2017
    Apple Design Award.\n\n…and we got a selfie with Tim Cook!\n\n### Project Panda\n\nWe
    start rewriting Bear’s editor from scratch, code name “Panda”.\n\nYour feedback
    showed us where the original Bear was hitting its limits. Six months in, we realized
    we needed our own Markdown parser too, so we started over. Again.\n\n### Bear
    2 is here!\n\nBear 2 launches with an all-new editor and 20+ new features.\n\n###
    Bear Web beta\n\nBear comes to your browser in public beta.\n\n### Bear Web\n\nThe
    full release of Bear Web is almost here, and we have more features brewing in
    house…\n\nBear 2.0\n\nOver the years, one thing we hear again and again is that
    Bear just feels good to use. So for this special occasion, we want to share the
    principles behind every design decision we make. Along the way you’ll find some
    tiny details we’ve hidden all over the app (you may be using a few right now without
    knowing it), a peek at an idea that never shipped, and some brand new Bear swag.
    Grab a slice of cake and come on in!\n\n## Bear Principles\n\nEvery change in
    Bear goes through a long journey from first idea to final release. Big or small,
    visible or under the hood, they all follow the same two principles: Bear should
    be delightful to use, and safe to trust.\n\n### A feeling-good experience by design\n\nWe
    want you to feel delighted every time you open Bear. In practice, that comes down
    to three things.\n\nNormally a space before the closing asterisks breaks the style,
    but Bear waits a split second so you can keep typing without the bold flickering
    away.(Note: If GIF is not playing, long press and select “Play Animation”)\n\nSimple.
    No sign up, no tutorial. Just open a note and write. Bear has grown much more
    powerful over the years, but all of that power waits quietly underneath and never
    gets in your way.\n\n\U0001F4A1 Did you know?To make sure Bear stays easy to use,
    we always ask our parents to test it first!\n\nNatural. We believe the best tools
    disappear while you use them. So we put a lot of effort into making things work
    exactly the way you expect, and you’ll find these quality of life touches all
    over the app.\n\nTake moving lines around. Press ⌘⌥ with the up or down arrow
    to move the current line, which is perfect for rearranging your writing. Bear
    understands what you’re moving and where it’s going, so it won’t break apart a
    list or a table along the way. It’s one of those things that feels so obvious
    you’d never guess someone had to design it.\n\nMove lines inside Bear\n\nRewarding
    to explore. Bear has a lot of depth, but we don’t believe in pushing everything
    to your face to promote it because we don’t know when or if you will need them.
    Many of our favorite user stories start with a happy little accident. Resize an
    image from its corner, and it snaps to line up with the images around it; swipe
    left on a note on iOS, and the Info Panel slides into view. We love those “Oh
    wow, I didn’t expect that to work!” moments. They’re a big part of why we sign
    off every post with “Happy writing!”\n\nPost by @TodkarR on X(Twitter)\n\n\U0001F4A1
    Did you know?Some of our favorite details are so small that you may be using them
    without ever noticing. Here are a few to try:✍️ Typing in bold or italic? Press
    Return or the same shortcut again to step right out of the style.⌨️ Press ⌘A inside
    a code block to select just the code. Press it again to select the whole note.\U0001F5B1️
    Select some text and type (, [, \" or`. Bear wraps your selection instead of replacing
    it.\U0001F517 Select some text and paste a URL. The text becomes a link.\n\n###
    Built to be safe\n\nYou can’t feel truly comfortable in a space you don’t trust.
    Your notes hold your ideas, your plans, and sometimes things you’d never share
    with anyone. That’s why safety has shaped Bear’s most fundamental choices from
    the very start.\n\nPrivate. We have no servers holding your notes, and we never
    see what you write. We also don’t build Bear on top of third party APIs, plugins,
    or outside services we can’t control. If one of them changed its rules, shut down,
    or simply stopped working, you would be the one paying the price. So we build
    what matters ourselves, and Bear keeps working the way you expect.\n\n\U0001F4A1
    Did you know?We collaborated with Cossack Labs for note encryption to ensure a
    reliable and smooth experience. Even if your iCloud account were ever hacked,
    you can rest assured your encrypted notes stay unreadable.\n\nKeeping a note taking
    app private and standard wasn’t a revolutionary idea in 2016 when we first launched
    Bear, but today, it kind of is. And we are glad we stick to what we believe since
    day 1. The world is changing and we don’t know where it leads us to, but we know
    your notes are safe with us and you have full control of them anytime, anywhere.\n\n##
    How features get made\n\nEvery design in Bear starts with a problem: a feature
    people need, something that’s broken, or simply something we don’t like. From
    there, we are on a journey of problem solving.\n\nmulti color highlighter testing
    for all Bear themes\n\nThat usually means a designer and a developer pairing up
    for a week or two, then bringing something working to the whole team. Then the
    real fun begins. Matteo, one of our cofounders, describes fun as “clashing heads
    with wonderful people to make great things.” Everyone in the team gets to express
    their opinions no matter what title they have. As a matter of fact, job titles
    mean nothing to us as you can see on our website.\n\nDiscussing UI details\n\nThe
    feedback discussion can be brutal. “No” is a very welcome answer here, with one
    house rule: you have to give a reason. Wall of text and hour long slack huddles
    come and go, then the paring up buddies return to the improvement part and provide
    a second round, a third round, until we are all happy with it. There are lucky
    days that some ideas get a big yes on the first try. Others spark weeks and months
    of debate and never ship at all. We’d rather be a little stubborn about what feels
    like Bear than chase every trend.\n\n\U0001F4A1 Did you know?Back in 2022, we
    had the idea to create a fourth column for the info panel, TOC, and Backlinks
    in Bear 2 update. The concept was discussed internally and also shared with on
    our forum, but at the end we were not convinced by the design at practical level,
    and thus the feature was never born in Bear 2.\n\nThe never shipped 4th column
    mockup\n\n## A milestone, and more to come\n\nOver the years, Bear has grown up
    much bigger than we expected with millions of users enjoying Bear everyday. We’ve
    seen so many different ways of using Bear: prepare teaching materials in school,
    work as their second brain, or just write grocery lists (yes, that’s our parents!).
    10 years is a huge milestone for us and we want to say a huge thank you to everyone
    no matter if you have been here since day 1 with us, or just downloaded Bear two
    minutes ago.\n\nBear Web Beta\n\nWe won’t hand you a flashy roadmap, but here’s
    what we can say for sure. Bear Web is almost ready for its full release, and we’re
    also working on note versioning and some other top secret things. Beyond that,
    we’ll keep doing what we’ve done for t"
