  author: rvz
  text: 'Many common ways for the financing of an free and open source project to
    be <i>sustainable</i> (The main keyword) in the mid to long term:<p>1) A non-profit
    company that has full-time employees but supported via sponsorships: (gnu project,
    mastodon, omarchy, zig)<p>2) Multiple for-profit companies that each have full-time
    employees contributing to an open source project that they all use: (ocaml, linux,
    rust)<p>3) An ultra high net worth individual that has full-time contributors
    to open source and supported via a non-profit (signal, ghostty)<p>4) A for-profit
    company that has dedicated full-time employees that have full support and own
    the direction of the open source project (go, swift, java)<p>5) VC funded open
    source projects (Herdr, Bun, Deno, Burno, Atuin)<p>All other options such as low
    donations like &quot;buy me a coffee&quot;, ko-fi, are <i>completely unsustainable</i>,
    now that AI agents exist.'
