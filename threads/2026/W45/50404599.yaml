  author: ssl-3
  text: 'For a buyer, eBay prices for used Raspberry Pis have never looked very attractive.<p>People
    don&#x27;t sell enough of them[1], so the supply&#x2F;demand curve favors demand
    and the price is only tempered by that of new hardware (<i>if</i> it is readily
    available).<p>That&#x27;s good for sellers who pay attention.  If you&#x27;ve
    got stuff that you aren&#x27;t using and the price is high-enough to get your
    interest, then:  Please sell it.  :)<p>-<p>[1]: I have a theory for why it is
    this way:<p>Lots of folks buy Pi hardware.  And by that, I mean:  It&#x27;s small
    compared to the market for iPhones, but it&#x27;s enormous for a quirky SBC with
    DIY traits.  But lots of those folks futz around with them and lose interest.  Into
    the drawer they go.<p>People assume the value of computer-ish electronics drops
    dramatically over time.  And for most of the history of personal computers, that&#x27;s
    broadly been very true.<p>Plenty of folks do sell stuff on eBay, and those who
    have done so know that it can be a pain in the ass to deal with.  Packaging, descriptions,
    printing, photos, getting the thing to the post office or whatever, dealing with
    the risk of getting ripped off:  It sucks.  It especially sucks for small quantities
    of unique (to the seller) low-value items.<p>So that Raspberry Pi (whether once
    $20, $40, $80, or whatever) sits in the drawer.  They might sell for $200 today,
    but the uninterested owner doesn&#x27;t know that.  They assume that it&#x27;s
    worth less than the cost of a pizza and just isn&#x27;t worth fucking with at
    all.<p>So, even if they might be motivated to deal with eBay for a couple of hundred
    bucks, their lack of interest means that they never know that the price is high.<p>Accordingly,
    the devices stay in the drawer.  The $200 remains unrealized.  The devices will
    probably get binned after a few more years of taking up space, if they aren&#x27;t
    binned in the next move.'
  score: 0
