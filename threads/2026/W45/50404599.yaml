  author: cbolton
  text: 'This scaling computation is too naive and gives the wrong conclusion. If
    you look at the number of transistors it&#x27;s about 4.3 million for the BL808
    vs 9.5 million for the Katmai core. Counting the logic transistors looks even
    worse for the Pentium: 2.5M for the BL808 vs 7.5M for the Katmai.<p>So the Pentium
    3 is 2x the transistor count of the C906 (even 3x if you ignore SRAM) and that&#x27;s
    despite being 32-bit while the C906 is 64-bit and has a much more capable vector
    unit.<p>(As for new vs 30 year old design I don&#x27;t really have an intuition
    how that&#x27;s supposed to factor in the comparison... But if we consider that
    we should also consider how much engineering effort went into each of these cores,
    and we&#x27;re probably talking a dozen engineers for a couple years for the C906
    vs hundreds of engineers and more years for the Pentium.)'
