  author: BadlyDrawnBoy
  text: The C906 core that runs Linux on the BL808 SoC on this device has roughly
    the same integer performance as a P3 on a per Mhz basis. The C906 is about 2.4
    DMIPS &#x2F; Mhz and the P3 is roughly 2.4 (Katmai core) - 2.8 (Tualatin core)
    DMPIS &#x2F; Mhz depending on the version. You are looking at roughly P3 450 integer
    performance<p>Its an interesting comparison that Im not sure reflects positively
    on the RISC-V C906 core when you factor in core area and process nodes and core
    area, 22nm vs 250nm. Even if we choose the worst case scenario for the P3 cores
    to compare which would be the Katmai core. We are basically look at ~parity with
    a 30 year old core design<p>C906 core only @ 22nm = ~0.6 mm2<p>C906 core only
    @ 250nm = ~78 mm2 (geometric transform)<p>P3 core only @ 22nm = ~0.5 mm2 (geometric
    transform)<p>P3 core only @ 250nm = ~76 mm2<p>Apologies if this is messy and badly
    formatted. Im currently at a wedding, sat waiting between the ceremony and the
    after party and Ive quite a few beers. I responded because its something I looked
    at previously with RISC-V cores and I already had the answers in my head
  score: 0
