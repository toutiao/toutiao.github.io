  author: kragen
  text: The MHz ratio really understates the difference.<p>66MHz probably wasn&#x27;t
    an 80486DX; as far as I can recall, those only went up to 50MHz.  It would have
    to be a 486DX2, with the RAM running at only 33MHz.  <a href="https:&#x2F;&#x2F;netlib.org&#x2F;performance&#x2F;html&#x2F;dhrystone.data.col0.html"
    rel="nofollow">https:&#x2F;&#x2F;netlib.org&#x2F;performance&#x2F;html&#x2F;dhrystone.data.col0.html</a>
    says that a 486DX2&#x2F;66 was about 31 to 51 Dhrystone MIPS.<p><a href="https:&#x2F;&#x2F;www.riscvschool.com&#x2F;2023&#x2F;03&#x2F;09&#x2F;t-head-xuantie-c906-risc-v&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.riscvschool.com&#x2F;2023&#x2F;03&#x2F;09&#x2F;t-head-xuantie-c906-r...</a>
    says the T-Head (Honey Badger) C906 RV64 core is about 2.3 Dhrystone MIPS (&quot;DMIPS&quot;)
    per MHz, so we should expect the 480MHz C906 to be about 1100 DMIPS.<p>So the
    clock speed is only ≈8× higher, but the actual speed gap is probably closer to
    32×.<p>And, for vectorizable workloads, we should expect the V extension to give
    us another 4–8× boost, so 128×–256× the DX2&#x2F;66, which didn&#x27;t even have
    MMX.
  score: 0
