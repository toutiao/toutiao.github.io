  author: Valk3_
  text: Some that comes to mind:<p>- Understanding deep learning by Prince[1]. Has
    both theoretical and programming exercises.<p>- Deep learning - Foundations and
    concepts by Bishop[2].<p>- Deep learning architectures - mathematical approach
    - Calin[3].<p>- Mathematical theory of deep learning by Petersen et al[4]. Only
    handful of exercises each chapter.<p>- Dive into deep learning[5]. This one is
    more practical programming hands-on. The exercises is a mix between programming
    exercises and theoretical.<p>- EECS 182&#x2F;282A | Deep Neural Networks 2025
    (not a book but a course by Berkley)[6]. I only skimmed the assignments, but they
    seem very interesting. A mix of theoretical and practical.<p>I think Bishop is
    probably the best one for theoretical exercises, balancing between not too difficult
    but not too easy either. However, if you also want programming exercises, Prince
    has lots of those. Berkley also seems very interesting, modern and encompassing.<p>[1]
    <a href="https:&#x2F;&#x2F;udlbook.github.io&#x2F;udlbook&#x2F;" rel="nofollow">https:&#x2F;&#x2F;udlbook.github.io&#x2F;udlbook&#x2F;</a><p>[2]
    <a href="https:&#x2F;&#x2F;www.bishopbook.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.bishopbook.com&#x2F;</a><p>[3]
    <a href="https:&#x2F;&#x2F;link.springer.com&#x2F;book&#x2F;10.1007&#x2F;978-3-030-36721-3"
    rel="nofollow">https:&#x2F;&#x2F;link.springer.com&#x2F;book&#x2F;10.1007&#x2F;978-3-030-36721-3</a><p>[4]
    <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2407.18384" rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2407.18384</a><p>[5]
    <a href="https:&#x2F;&#x2F;d2l.ai&#x2F;index.html" rel="nofollow">https:&#x2F;&#x2F;d2l.ai&#x2F;index.html</a><p>[6]
    <a href="https:&#x2F;&#x2F;berkeley-cs182.github.io&#x2F;fa25&#x2F;" rel="nofollow">https:&#x2F;&#x2F;berkeley-cs182.github.io&#x2F;fa25&#x2F;</a>
