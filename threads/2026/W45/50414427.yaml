  author: derefr
  text: 'FYI, Tesla makes a large fraction of its profits off the margins from selling
    grid-scale (&quot;Megapack&quot;) batteries to utilities; renewable energy projects
    (buffering energy generated by e.g. private wind farms); and most recently, data
    centers (where they act either as giant battery-backed UPS systems, or as reservoirs
    between on-site power generation and fluctuating on-site demand.)<p>They probably
    have also been <i>trying</i> to penetrate the military energy storage market (a.k.a.
    &quot;tactical microgrids&quot;), but so far they haven&#x27;t. They need more
    vertical integration for that. Right now they don&#x27;t own battery-cell manufacturing,
    so the defense contractors that build ruggedized battery packs skip them and go
    straight to sourcing from the battery-cell manufacturers.<p>(Fun fact: Tesla&#x27;s
    Gigafactories <i>as physical spaces</i> produce a ton of battery cells, but <i>Tesla
    itself</i> doesn&#x27;t. Tesla leases space in its Gigafactories to cell manufacturers
    like Panasonic, who actually produce the cells, so that Tesla can then directly
    consume some of the cells produced into battery packs, without any intervening
    logistics costs.)<p>It&#x27;s always been my own personal stance that Tesla is
    a battery company, that happens to sell some of its battery packs in the form
    of cars. (Remember that 80% of the depreciated value of an EV is its batteries.)
    The cars were never the core of Tesla&#x27;s business model; they were a useful
    vertically-integrated B2C demand-sink they used to bootstrap their B2B battery
    sales business.'
  score: 0
