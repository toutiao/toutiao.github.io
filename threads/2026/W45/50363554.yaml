  text: In East Asian countries, certification systems are still maintained, but in
    reality they&#x27;re practically meaningless. If a certification system exists,
    people will take an interest in CS and work harder at it, or so you&#x27;d think—but
    in reality, the exam questions end up stuck in the old style. In other words,
    there&#x27;s a big gap between the exams and the actual field.<p>Because a certification
    has to be fixed at a particular point in time. Korea&#x27;s certification exams
    start with the 23 GoF patterns and go on to rote memorization of countless patterns
    and layered terminology.<p>The problem is that the way you learn for this certification
    is the old way, so someone who gets the certification ends up writing legacy code.<p>But
    if you always update the questions to the latest, then nobody can pass the certification.
    So, having seen how the certification system works in East Asia, I don&#x27;t
    think it&#x27;s all that good
