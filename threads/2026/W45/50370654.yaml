  author: zozbot234
  text: "&gt; I’m not sure how much effect you get from higher TOPS with such low
    bandwidth though.<p>Raised arithmetic intensity.  It would be quite good for LLM
    prefill, and decode would want to adapt by pushing parallelism higher (saving
    on memory bandwidth by reusing the same layer weights for multiple streams) or,
    if unable to do so (e.g. due to KV cache constraints) by resorting to speculative
    decoding (where the expensive &#x27;validate&#x27; step handles tokens in parallel
    within a single stream).  It does not make the platform inherently unviable.  It
    would also do well at other tasks such as image&#x2F;video generation, which is
    already quite compute bound."
