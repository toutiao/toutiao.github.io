  author: throwawayffffas
  text: It depends on how you slice the weights. You can split along layers which
    means each GPU waits for the previous one to finish or you can split the tensors
    across gpus.<p>Splitting the tensors is closer to n times the effective vram bandwidth
    but there are still overhead, sync waits, and reduce steps that eat away at the
    overall performance.
  score: 0
  posted_at: '2026-11-04T23:55:16Z'
