  text: |-
    Not totally following this one. If the contract of your methods needs to differentiate an actually supplied &quot;nil&quot; from &quot;nothing was supplied&quot;, how does `defined?` accomplish that? For ex, using it would break the intended contract here:<p><pre><code>  irb(main):020\* def cloaking(value = nil)
      irb(main):021\*   if defined?(value)
      irb(main):022\*     @value = value
      irb(main):023\*   else
      irb(main):024\*     @value
      irb(main):025\*   end
      irb(main):026&gt; end
      =&gt; :cloaking
      irb(main):027&gt; cloaking(&quot;on&quot;)
      =&gt; &quot;on&quot;
      irb(main):028&gt; cloaking()
      =&gt; nil
      irb(main):029&gt; cloaking(&quot;on&quot;)
      =&gt; &quot;on&quot;
      irb(main):030&gt; cloaking
      =&gt; nil
    </code></pre>
    calling cloaking with no argument clears the value this method is intended to read. could `defined?` be used to accomplish this in some way I didn&#x27;t demonstrate here?
