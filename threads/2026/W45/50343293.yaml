  text: "I somewhat agree with you here. I find it easier to read when a &#x27;=&#x27;
    is used.<p>At the same time I also understand the idea behind:<p><pre><code>    def
    colour(xyz = :green)\n</code></pre>\nThe idea would be to use something in a toggle
    state.<p>I sometimes use a similar, but simpler pattern, though I\nalso tend to
    use explicit method names. But for instance:<p><pre><code>    enable(:colours)\n
    \   enable :colours\n    enable_colours\n    disable_colours # etcc\n</code></pre>\nPersonally
    I prefer the longer variants, e. g. enable_colours\nand disable_colours (without
    trailing (); if people prefer\nUS spelling the method names could be enable_colors
    etc.. it\nis really the very same point anyway). I do, however had,\nalso sometimes
    use a more generic top-level entry point such\nas enable. I use that for my pseudo-shell
    replacement for\nbash, written in ruby too. For instance:<p><pre><code>    enable
    :windows_configuration\n    enable :colours\n    enable :systemd # and so on and
    so forth.\n</code></pre>\nI mostly do this so I have an easier time remembering
    things;\nand finding a simple, ideally as simple as possible, entry\npoint.<p>Of
    course it is not exactly the same as the rails-idiom shown\nhere, since I&#x27;d
    also have to use:<p><pre><code>    colours :green\n    colours :disable\n    colours
    false\n</code></pre>\nBut I am also fine with set_colours :false. But in general
    I\ntend to prefer disable_colours in this case.<p>Personally, since I know my
    brain is rather weak, I try to not\nuse &quot;cloaked&quot; methods and just use
    oldschool setters and \ngetters, where I treat set_foobar to be the same as foobar
    =.<p>foobar= is a bit more elegant, but I also like set_xyz in general.\nOddly
    enough I don&#x27;t really use get_xyz; but I, to my shame, must\nadmit that I
    like this:<p><pre><code>   def return_base_directory\n</code></pre>\nMost will
    omit &quot;return_&quot;, but I kind of like stupid code where I \ndon&#x27;t
    have to think. In particular in bigger projects.<p>I don&#x27;t really see a need
    for overloading methods though. I dislike\nhaving too many instance variables
    however had; I noticed that when\nI have like more than 10 @ variables, I often
    find it easier to just\ngroup them into a Hash instead, with Symbols as key. So
    for instance:<p><pre><code>    @internal_hash[:use_colours] = false\n</code></pre>\nIt&#x27;s
    not that elegant compared to:<p><pre><code>    @use_colours = false\n</code></pre>\nbut
    I found a Hash to just be a lot more convenient\nto use here. And pp hash is super-userful.
    (We can\neasily get all instance variables programmatically,\nof course, but I
    still find a Hash structure so much\nmore logical and convenient to use and read
    than many\ndifferent instance variables.)"
