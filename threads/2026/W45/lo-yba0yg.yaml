  content: "# [Introducing Adaptive Dark Mode](https://webkit.org/blog/18541/introducing-adaptive-dark-mode/
    \"Permanent Link: Introducing Adaptive Dark Mode\")\n\nNov 3, 2026\n\nby Simon
    Fraser, Luming Yin, Lily Spiniolas, Joanne Pan, Veda Periwal and Jen Simmons\n\nWe’re
    excited to announce Adaptive Dark Mode in Safari 27.3 beta. When enabled by a
    user, Safari adapts light websites and presents them as dark.\n\nIn the spring
    of 2019, Safari 12.1 became the first browser to support dark mode on the web.
    A lot of people love using dark mode, but not every website has a dark version.
    Almost [40% of web page loads](https://chromestatus.com/metrics/feature/timeline/popularity/3580)
    are from users in dark mode, and yet [only 10%](https://chromestatus.com/metrics/feature/timeline/popularity/3707)
    of page loads support it. If you love dark mode, you’ve probably hit a site that
    felt particularly [bright](https://www.tiktok.com/@syntaxfm/video/7307721014891367711).
    Adaptive Dark Mode is designed to close that gap, providing a consistent dark
    experience across the web.\n\nYou can try it today in Safari 27.3 beta. To enable,
    first make sure your system appearance is set to dark. Then browse to a website
    with a bright background. Safari will offer a preview of Adaptive Dark Mode. Tap
    ‘Try’.\n\nFor websites that signal support of dark mode with `<meta name=\"color-scheme\"
    content=\"light dark\">` in HTML or `color-scheme: light dark` in CSS, Adaptive
    Dark Mode does not change a thing. For the rest of the web, it quickly analyzes
    the page, looking at colors and estimating whether it’s predominantly light or
    dark. If the page generally has a dark background with light text, nothing is
    changed. When a page has a light appearance, Adaptive Dark Mode adapts the page
    to be dark.\n\n## How does Adaptive Dark Mode work?\n\nAt the core of Adaptive
    Dark Mode is the transformation of color. Sometimes colors are simply decorative,
    while other times they have semantic meaning. Adaptive Dark Mode determines when
    to invert colors so elements remain visible or when to leave colors unchanged.\n\nWhile
    creating Adaptive Dark Mode, we developed a color matrix to invert the luminosity
    of colors while preserving hue. It’s used to make light backgrounds dark, and
    dark text light. When transforming text color, Adaptive Dark Mode aims for sufficient
    contrast as defined by the [WCAG 4.5:1 contrast ratio](https://www.w3.org/WAI/WCAG21/Understanding/contrast-minimum.html).
    Light CSS gradients are also transformed to dark.\n\nAdaptive Dark Mode makes
    careful judgments so transformed content looks good and stays usable: buttons
    have contrast against backgrounds, text is visible over images, and hover menus
    look clear.\n\nIt takes the same care with images. Most are left unchanged, preserving
    their integrity. But many icons and logos can lose contrast when the background
    color behind them is inverted. So Adaptive Dark Mode inspects SVG images and transforms
    colors when needed. For bitmap images, it analyzes the pixel histograms and inverts
    simple black-and-white logos.\n\nEffects like masks and `mix-blend-mode` can create
    undesirable results on an element whose colors have been transformed, so in some
    cases Adaptive Dark Mode turns such effects off. Also, `<canvas>` content is left
    unchanged, since canvases contain a wide range of content that’s hard to predict.\n\nIt’s
    precisely because Adaptive Dark Mode is happening deep within the WebKit browser
    engine that we are able to find creative ways to solve the most complex challenges,
    apply the transformations with great speed and power efficiency, all while rigorously
    protecting user privacy.\n\n## Making your site work even better\n\nIn general,
    a web page will work well with Adaptive Dark Mode if it follows good modern web
    development practices.\n\nIf your site still uses older techniques, small updates
    can help. For logos and icons, swap bitmap images for SVG. Use solid or gradient
    colors in CSS instead of tiled background images. Replace image sprites with modern
    CSS for rounded corners, shadows, and button states. Create content images with
    transparent backgrounds instead of baking the page background color into the image.
    Add padding to containers to prevent crowding.\n\nPerhaps you want a specific
    dark mode experience for a certain portion of the page. Apply [`color-scheme:
    light dark`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/color-scheme)
    to the relevant element and add your own dark styles.\n\n## Building your own
    dark mode\n\nFor complete control over how your site looks in dark mode, add full
    support. It’s a terrific time to do so. It’s never been easier.\n\n_Here’s an
    example of a website in light mode (left) and with Adaptive Dark Mode applied
    (center). If the site creates a custom dark mode, it could look like the third
    version (right)._\n\nAll the web technology needed to fully support dark mode
    is widely available today, including:\n\n- [`<meta name=\"color-scheme\" content=\"light
    dark\">`](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/color-scheme)\n-
    [`:root { color-scheme: light dark }`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/color-scheme)
    \n- [`@media (prefers-color-scheme: dark) { }`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/prefers-color-scheme)
    \n- [`<picture><source media=\"(prefers-color-scheme: dark)\">`](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/picture)\n-
    [`light-dark()`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/color_value/light-dark)
    \n\nNewer CSS functions like [`color-mix()`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/color_value/color-mix)
    and [`contrast-color()`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/color_value/contrast-color),
    plus popular techniques for organizing design systems with CSS variables provide
    additional options and flexibility.\n\nBe sure to declare dark mode support using
    the `color-scheme` meta tag in your HTML head and/or by setting the `color-scheme`
    property on `:root` or `body` in your CSS. Don’t wait to inject this information
    later via JavaScript. This best practice helps ensure your site is rendered correctly
    as fast as possible.\n\n## Using the “light only” color scheme\n\nIf you would
    like your web app or website to not be transformed by Adaptive Dark Mode, you
    can communicate this using `color-scheme`. The HTML `<meta name=\"color-scheme\"
    content=\"light only\">` tag lets browsers know that 1) this page supports `light`
    mode and 2) should `only` be displayed in light mode. The `color-scheme: light
    only` rule does the same thing, but with the flexibility of CSS, allowing you
    to just target specific elements on the page — or of course, you can target the
    whole page with `:root { }`. (Note: the ‘only’ keyword is not supported in Safari
    27.3 beta 1. Check back as Adaptive Dark Mode evolves through the beta process.)\n\n##
    Protecting user privacy\n\nApple firmly believes user privacy is a fundamental
    human right. If websites could detect when a user has enabled Adaptive Dark Mode,
    that would increase the amount of fingerprintable information and weaken privacy
    protections against trackers.\n\nAs a result, Safari prevents websites from detecting
    when Adaptive Dark Mode has been applied. JavaScript that queries CSS colors will
    get the original authored colors, not the transformed ones. Any images drawn into
    canvas render in their original form.\n\n## Feedback\n\nIf you manage a website
    or web app, and would like to discuss how Adaptive Dark Mode is adapting your
    project, feel free to reach out at [web-evangelist@apple.com](mailto:web-evangelist@apple.com).\n\nIf
    you try out Adaptive Dark Mode as a user, and find a site that does not work well,
    we’d love for you to file a report with [Feedback Assistant](https://feedbackassistant.apple.com/).
    (Learn more about [filing Feedback](https://developer.apple.com/bug-reporting/))."
