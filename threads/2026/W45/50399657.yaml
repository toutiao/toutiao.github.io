  author: adrian_b
  text: Already tens of thousands of years before learning to use fossil coal, humans
    learned how to make charcoal from wood.<p>This can be considered as the first
    method for extracting an almost pure chemical element from its compounds.<p>While
    in the beginning charcoal was used mainly for non-essential activities, like drawing,
    eventually charcoal was the reducing agent required for smelting metals from their
    minerals, first lead, then copper, then many others. Without charcoal, humans
    would have remained in the &quot;stone age&quot;.<p>Without fossil coal, anything
    that is made from coal can be made from charcoal, except that this requires a
    lot of additional energy (for making first the charcoal; but with modern technology
    it is not necessary to pass through charcoal; carbon dioxide can be reduced to
    substances like methanol or formaldehyde or passing through syngas to hydrocarbons,
    which can feed other chemical processes).
