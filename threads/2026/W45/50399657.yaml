  author: margalabargala
  text: 'It&#x27;s definitely not that cut and dry. Here&#x27;s a paper with a good
    breakdown of safety comparisons: <a href="https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;pii&#x2F;S2352152X26017846#sec5"
    rel="nofollow">https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;pii&#x2F;S2352152X2...</a><p>Tldr:
    while sodium thermal runaways are <i>less</i> dangerous than lithium, they are
    more likely to happen, and in particular charging a sodium battery to 100% SOC
    makes thermal runaway significantly more likely than in LFP batteries.<p>It&#x27;s
    true that things like puncture or short circuit are much much less dangerous than
    with lithium. That is a big part of why the increased thermal runaway risk gets
    overlooked.'
