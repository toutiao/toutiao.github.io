  author: adrian_b
  text: "&gt; the gas is more flammable, toxic, etc<p>There are many alternative materials
    for the cathodes of sodium-ion batteries and for now the industry has not settled
    on one of them as being the best.<p>The safety properties depend on the cathodic
    material. The vented gas can be toxic only for one class of materials (Prussian
    blue analogs) and IIRC none of the currently existing commercial sodium-ion batteries
    uses this kind of cathodes.<p>For the other cathode types, the vented gas is hydrogen
    exactly like in almost any kind of battery, and it is equally flammable for all
    kinds of batteries.<p>In the article linked above, the conclusion was that for
    one kind of cathodic materials, which perhaps is the one used in most currently
    existing sodium-ion batteries, the risk of damaging the battery by overcharging
    and the risk of thermal runaway (assuming that the battery management system fails
    to prevent these), are slightly higher than for LFP but lower than for other lithium-ion
    batteries.<p>On the other hand, mechanical damage by puncturing the batteries
    is less dangerous than for any lithium-ion batteries.<p>These conclusions are
    not definitive about sodium-ion batteries, because other cathodic materials will
    behave differently, and there is still a lot of experience to gain with sodium-ion
    batteries, so it is certain that the cathodic materials used in 2030 will not
    be the same as today."
