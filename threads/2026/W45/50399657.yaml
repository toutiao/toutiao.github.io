article:
  url: https://www.pv-magazine.com/2026/11/06/sodium-ion-batteries-approach-cost-parity-with-lfp-with-70-gwh-covered-by-supply-agreements/
  title: Sodium-ion batteries approach cost parity with LFP, with 70 GWh covered by
    supply agreements - pv magazine Global
  fetch_status: success
  content: "[Markets & Policy](https://www.pv-magazine.com/category/markets-policy/)\n\n[See
    all](https://www.pv-magazine.com/category/markets-policy/)\n\n# Sodium-ion batteries
    approach cost parity with LFP, with 70 GWh covered by supply agreements\n\n Sodium-ion
    batteries are approaching cell-level cost parity with LFP technology, with supply
    agreements exceeding 70 GWh worldwide. Despite higher upfront costs, they could
    offer a 21% lower total cost of ownership over 20 years, according to Wood Mackenzie.
    \n\n[![Pilar Sánchez Molina](https://www.pv-magazine.com/wp-content/uploads/2025/08/Pilar-Sanchez-Molina_500x500.png)](https://www.pv-magazine.com/people-companies/pilar-sanchez-molina/)\n\n
    By \n[Pilar Sánchez Molina](https://www.pv-magazine.com/people-companies/pilar-sanchez-molina/)\n\n-
    \n- \n- \n- \n\n- [Markets & Policy](https://www.pv-magazine.com/category/markets-policy/)\n-
    [Batteries](https://www.pv-magazine.com/tag/batteries/)\n- [Energy Storage](https://www.pv-magazine.com/tag/energy-storage/)\n\n-
    \n- \n- \n- \n\n_Singeng sodium-ion battery project in Hubei\n                             |
    \n                            Image: Sineng_\n\n Advertisement \n\nSodium-ion
    battery technology is entering the commercial production phase and emerging as
    an alternative to lithium-ion batteries, driven by supply chain diversification,
    strong low-temperature performance, and the potential for lower total cost of
    ownership. According to an analysis by Wood Mackenzie, supply agreements totaling
    more than 70 GWh are already in place.\n\nThe study, which examines markets in
    China, the United States, Germany, and India, identifies sodium-ion batteries
    as the most promising emerging alternative to lithium-based technologies for stationary
    energy storage. Leading manufacturers are expected to achieve cell-level cost
    parity with lithium iron phosphate (LFP) batteries by late 2026, while parity
    at the module and system levels is not expected until after 2030.\n\nChina is
    leading the commercialization of the technology. BYD plans to reach 30 GWh of
    sodium-ion battery manufacturing capacity, while CATL aims to exceed 1 GWh in
    sodium-ion battery shipments by the end of 2026.\n\nSupply agreements for sodium-ion
    batteries are already in place in China, the United States, and Europe, while
    India remains in the early stages of commercial validation. For the 2026–2035
    period, Wood Mackenzie estimates a learning rate of 18% to 20% in China, reflecting
    the greater maturity of its industrial supply chain.\n\nPlanned manufacturing
    capacity currently exceeds demand, although the growing number of supply agreements
    points to the technology’s gradual adoption in the market.\n\n### Higher upfront
    costs, lower total cost of ownership\n\nSodium-ion batteries currently have higher
    upfront costs than LFP batteries. The global average stands at $229/kWh, compared
    with approximately $200/kWh for LFP batteries. However, Wood Mackenzie estimates
    that sodium-ion batteries could achieve a 21% lower total cost of ownership over
    a 20-year project lifetime.\n\nThe difference is primarily attributed to the elimination
    of capacity expansion cycles and lower operating costs. The economics of sodium-ion
    systems remain relatively stable across storage durations of two to four hours.\n\nThe
    study identifies raw material supply security, service life, and a wider operating
    temperature range as key technical advantages of sodium-ion batteries. The latter
    could make them particularly suitable for applications in cold climates, where
    lithium-ion batteries may require additional thermal management systems.\n\n###
    Regulation accelerates development\n\nIndustrial and trade policies are playing
    an increasingly important role in the competitiveness of different battery chemistries.
    In July 2026, China reintroduced a consumption tax on lithium-ion batteries while
    exempting sodium-ion batteries until the end of 2028. LFP batteries became subject
    to a 2% levy in September 2026, which is set to increase to 4% in September 2027.\n\nIn
    the United States, tariffs of approximately 58% on energy storage cells imported
    from China, combined with production tax credits under Section 45X of the Inflation
    Reduction Act (IRA), are encouraging domestic sodium-ion battery manufacturing.\n\nIn
    Europe, carbon footprint declaration requirements under the EU Battery Regulation
    could favor technologies with supply chains that are less dependent on certain
    critical raw materials. Meanwhile, India is supporting domestic manufacturing
    through a $1.25 billion incentive program and tariff exemptions for certain types
    of manufacturing equipment.\n\nWood Mackenzie expects the 2030–2035 period to
    be decisive for sodium-ion batteries to achieve economic competitiveness. For
    energy storage projects currently under development, LFP remains the most commercially
    mature option for storage durations of two to four hours.\n\n_This content is
