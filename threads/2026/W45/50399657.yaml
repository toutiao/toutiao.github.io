  text: I’m hopeful that sodium batteries are going to come down in cost quickly,
    but if you can find a provider like Base Power or similar where it’s heavily subsidized,
    there’s a small upfront fee, and they can provide you the economic benefits until
    sodium batteries reach favorable economic success criteria, that’s a shim until
    you can replace that with sodium batteries you own outright at a favorable price.
