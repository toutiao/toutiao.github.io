  author: benjiro29
  text: Discharging is not the issue with LiPo4 or other lithium tech. They can work
    up to negative temperatures without any issue. They can go down to -20°C (-4°F).<p>The
    problem is charging the battery at negative, as this damages the internal structure.
    So you need to heat up the battery (aka, you discharge by warming up heating elements),
    until you hit the right point. And then you can charge up, what will create heat
    and thus allow for non-damaging charging.<p>Some even have a fun trick, where
    if your going to a EV station with your car (end point route on your build in
    sat nav). They can start to pre-drain the battery if its really too cold, to warm
    up the batteries even more. So by the time your at the charger, the batteries
    are on temperature. I forgot what brand did it that way, seen that feature years
    ago.<p>What is different is that Sodium-Ion batteries can charge from negative
    (i think it was -10°C), as they do not suffer from the same damaging effect.
