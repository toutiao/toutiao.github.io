  author: garrettr_
  text: 'For a 10 year old I would highly recommend Martin Gardner’s “Codes, Ciphers,
    and Secret Writing”: <a href="https:&#x2F;&#x2F;a.co&#x2F;d&#x2F;05rZPKiH" rel="nofollow">https:&#x2F;&#x2F;a.co&#x2F;d&#x2F;05rZPKiH</a><p>It’s
    a slim volume that focuses on historical and fictional ciphers. It stars with
    simple shift ciphers like Caesar’s cipher, progresses to more complex substitution
    ciphers with examples from Sherlock Holmes and Edgar Allen Poe, then covers polyalphabetic
    ciphers like Vigenère and Playfair. It covers basic cryptanalysis and has practice
    riddles and cryptograms throughout. It even has a chapter on a variety of ways
    to make invisible ink, which is often an object of fascination for children around
    that age!'
  score: 0
