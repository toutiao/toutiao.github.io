  author: twotwotwo
  text: 'Fred Wrixon&#x27;s Codes and Ciphers was fun for me and a friend around this
    age, and it looks like it&#x27;s been updated in the decades since.<p>One angle
    from which it&#x27;s fun is just learning operations you can do on text (and text
    represented as numbers). Empirically it turns out <i>just</i> Shannon&#x27;s &quot;diffusion
    and confusion&quot; and lots of rounds gets you far in symmetric cryptography,
    which we can see from a lot of simple RAX primitives working fine. But it&#x27;s
    nice for reasons outside cryptography to get a feel for the zoo of other things
    you can do, what offers diffusion and nonlinearity, how you can ensure a function&#x27;s
    reversible, etc.<p>If you did one topic from public-key land, I think Diffie-Hellman
    is easier to understand than RSA without much build-up: it makes sense from the
    basic properties of exponents (ones modular arithmetic doesn&#x27;t change), and
    modular arithmetic connects to fun stuff about the primes. Merkle hash signatures
    also make sense with just symmetric cryptography, and are post-quantum-resistant!<p>I
    hadn&#x27;t really thought about how you&#x27;d even approach PQ encryption, but
    maybe ECC-based McEliece is cool? You can get a feel for it even without detail
    on the hard decoding problem, and error correcting codes are their own interesting
    topic.'
