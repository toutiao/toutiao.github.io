  author: adrian_b
  text: 'I did not remember immediately your reference about &quot;Moxie Marlinspike’s
    Cryptographic Doom Principle&quot;, so I had to search it on the Internet.<p>That
    doom principle is: &quot;When you receive a message, the very first thing you
    can do is verify the MAC&quot;.<p>What confused me was the name of Moxie Marlinspike,
    because this principle was not coined by him (in 2011), but it was discussed at
    length during the nineties of the last century, by the designers of IPsec, a decade
    and a half before Moxie.<p>This principle was the reason why IPsec chose to do
    &quot;Encrypt-then-MAC&quot;, unlike SSL or SSH. The differences between IPsec,
    SSL and SSH in the order of encryption and MAC computation prompted Hugo Krawczyk
    to write in 2001 his paper &quot;The Order of Encryption and Authentication for
    Protecting Communications (Or: How Secure is SSL?)&quot;, which clarified the
    properties of the 3 different orders used at that time by IPsec, SSL and SSH.<p>Nonetheless,
    this &quot;Doom Principle&quot; is obsolete.<p>30 years ago, when IPsec was designed,
    it was true that doing first only the MAC computation saved time for the case
    when decryption was no longer required (because the packet was corrupted or forged).<p>Nowadays,
    reading the encrypted data from the memory is normally the bottleneck, not the
    MAC or decryption computations. Therefore, one should never do 2 passes over data,
    one for MAC and one for decryption, but one should do a single pass, during which
    both MAC and decryption should be computed, regardless which is their order. Even
    when small packets are decrypted, so the second pass would find the data in the
    cache memory, doing a single pass over the data is still faster.<p>When a single
    pass over data is done, it no longer matters in which order MAC and encryption
    had been done, regardless whether the data passes or fails the integrity verification.<p>&gt;
    I&#x27;d be puzzled by anyone doing generic composition of ciphers and MACs, given
    the available options<p>I agree. Today, most people should use only one of the
    standardized authenticated encryption algorithms, like those specified by TLS
    1.3 or SSH.<p>On most modern CPUs (which have dedicated hardware for both AES
    and the GCM MAC), doing something better than this cannot be achieved by any generic
    composition of ciphers and MACs, but it can be achieved with other authenticated
    encryption algorithms, which have not become widespread mostly because of the
    broken US IP laws (i.e. they were covered by various bogus patents).'
