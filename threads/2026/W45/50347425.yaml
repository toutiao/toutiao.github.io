  author: tptacek
  text: The designers of IPSEC famously did not get block cipher and MAC composition
    right.<p>I was writing about EtM constructions before Moxie wrote that post (you
    can see me preening about Bellare and Namprempre in Twitter search), but Moxie&#x27;s
    post is the one everyone remembers, so that&#x27;s the reference. What&#x27;s
    &quot;obsolete&quot; about the advice now is that nobody builds cryptosystems
    by manually gluing a block cipher mode to a MAC anymore. But in the 5 years prior
    to that post, violations of the &quot;principle&quot; were the most reliable way
    to break cryptosystems.<p>Nobody&#x27;s arguing that cryptographers can&#x27;t
    design hermetically sealed authenticated encryption modes that play with the ordering
    of encryption and authentication. That wasn&#x27;t what Moxie was implying either.
