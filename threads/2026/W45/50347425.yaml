  author: adrian_b
  text: "&gt; The designers of IPSEC famously did not get block cipher and MAC composition
    right.<p>I think that you might confuse IPsec with SSH in this statement.<p>IPsec
    chose since the beginning &quot;Encrypt-then-MAC&quot;, which is proven to be
    secure with any good encryption and MAC algorithms.<p>In the beginning, SSL used
    &quot;MAC-then-Encrypt&quot;. This is proven to be secure only with certain combinations
    of MAC and encryption algorithms. Nonetheless this was not a problem for SSL,
    because the combinations that they used were by chance among those correct.<p>SSH
    used in the beginning &quot;Encrypt-and-MAC&quot;, which is the worst choice,
    and in certain SSH variants it was actually vulnerable.<p>So I think that you
    remember some story about SSH, because IPsec got it right since the beginning.<p>In
    general IPsec has never had any problem in its purely cryptographic design choices,
    but its initial variants had ridiculously complex management methods, which could
    result in security problems due to key or access rights mishandling.<p>Later,
    IPsec was simplified, but it had already acquired a bad reputation as being extremely
    hard to use correctly, which allowed other VPN solutions to become much more popular,
    like OpenVPN, which were much easier to configure and use."
