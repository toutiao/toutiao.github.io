  text: Interesting. There are quite a few forks of llama.cpp where streaming weights
    has been successful, or special quants &#x2F; decompressing before processing.<p>-
    Bonsai Qwen 3.8 27B<p>- Strata<p>- Pulsar<p>- This...<p>I just wish upstream Llama.cpp
    would accept the PRs faster - they build multiple times per day, but their PR
    backlog was 1.7K last I checked, which is a ridiculously impractical number to
    review with a few volunteers.<p>I watched the Qwen 3.8 Bonsai feature and it took
    over 3 weeks from creation to be reviewed, and even then it doesn&#x27;t include
    the patches for bugs, that they fixed downstream and simply gave up pushing to
    upstream because the process was so laborious.<p>So they end up with delayed or
