  author: walrus01
  text: 'I very recently spent a lot of time using deepseek v4 flash 0731 before it
    was superseded by newer more capable things (glm 5.3-flash, v4.1 flash 1017, etc)
    and I am exceedingly skeptical of anyone that claims to get good QUALITY results
    out of it at that size. Whatever they&#x27;re doing to shrink it will make it
    worse than an unsloth Q2XS quantization of it or equivalent. That size of model
    <i>needs</i> something like 150GB of RAM to run properly with full unquantized
    kv cache and not with a ton of training data discarded.<p>I remain exceedingly
    skeptical of people who are claiming to run fairly large models in ridiculously
    tiny sizes. For comparison a &#x27;regular&#x27; version of v4 flash 0731 has
    file sizes more like this: <a href="https:&#x2F;&#x2F;huggingface.co&#x2F;unsloth&#x2F;DeepSeek-V4-Flash-0731-GGUF"
    rel="nofollow">https:&#x2F;&#x2F;huggingface.co&#x2F;unsloth&#x2F;DeepSeek-V4-Flash-0731-GGUF</a><p>Even
    the 97GB Q2XS will show <i>very significant</i> divergence from the full precision
    thing. Running a lobotomized model just to say you&#x27;re doing it is really
    not accomplishing anything special.'
