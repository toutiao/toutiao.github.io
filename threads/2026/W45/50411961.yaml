  author: zozbot234
  text: 43 tokens is a tiny input context when compared with anything agentic. Prefill
    on SSD streaming is proportionally much faster with larger contexts, because expert
    loads can be reused across tokens and the engine can also opt to preload entire
    model layers into memory, without waiting for the outcome of expert routing.
