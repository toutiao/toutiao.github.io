  author: armcat
  text: Something to keep in mind with aggressive quantisation, is that it&#x27;s
    been empirically proven [1] that (1) quantisation has non-linear performance behaviour,
    and (2) generally the peak size-to-performance ratio occurs at 4-bit; anything
    lower and you will see significant reduction in performance.<p>Also, I&#x27;ve
    been playing with speech models for the past 2 years, and for me anything below
    8-bit is a huge drop in quality; so quantisation for LLMs and for other bespoke
    modality models, is not 1:1.<p>[1] &quot;Reliability Scaling Laws for Quantized
    Large Language Models&quot;, TUM, <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;pdf&#x2F;2607.10855"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;pdf&#x2F;2607.10855</a>
  score: 0
