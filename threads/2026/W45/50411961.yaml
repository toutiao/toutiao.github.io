  author: zozbot234
  text: Ironically, local models are much more efficient when running multiple parallel
    agents, provided that KV storage requirements are not excessive (not an issue
    with DeepSeek 4.1 Flash).  It does not make any individual agent faster, but it
    does raise <i>overall throughput</i> quite a bit.  The limit is then set by compute
    constraints rather than memory bandwidth, so something like DGX Spark or AMD Strix&#x2F;Gorgon
    Halo can be expected to do better than the Apple-based alternative.
