  author: __MatrixMan__
  text: That makes more sense for decryption keys than it does for signing keys.<p>For
    any of this to work we have to already be gossiping metadata about each other&#x27;s
    content. &quot;I think this key was compromised on Nov 1, 2026&quot;  is exactly
    that kind of metadata.  That sort of thing rarely happened in PGP because key
    revocation was necessarily a side channel that you were often ignoring. But if
    the only way to avoid being inundated by slop is to assemble the page from the
    gossip of trusted peers, then the untrusted nature of the recently compromised
    key is gonna show up right next to its dubiously trustworthy signatures, and your
    browser can then interpret it without you having to do any sleuthing on your own.<p>How
    hard are you really gonna work to compromise a key that you can only use for a
    few days?  I mean, the going rate for placing an ad on a page is like, fractions
    of a cent per view.  Maybe it&#x27;ll be more valuable in a post-ad world, but
    I have a hard time imagining that getting your content in front of some eyeballs
    for a day or two will ever be valuable enough to be worth hitting somebody with
    a wrench over. What you have to gain by doing so just isn&#x27;t valuable enough
    to be worth the risk.
