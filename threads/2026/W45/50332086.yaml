  author: __MatrixMan__
  text: 'Right, for that we need different domains of trust.  Like maybe my commentary
    on current events is trash but I can be trusted to give good plumbing advice.
    So people who know this about me can trust some of my content but not the rest,
    which causes it to be seen&#x2F;hidden by the people who only trust me transitively
    through them.<p>The architects of the original web gave up on the trustworthiness
    problem pretty early. All we got is : &quot;is this server lying about its name?&quot;.
    We&#x27;re going to have to pick that problem back up and bake solutions to it
    into our browsers.  Except instead of attestations about server names, I&#x27;ll
    be about the content. Was it made by somebody who is known to be sloppy with AI?
    Or maybe they&#x27;re the sort that would put out content that doesn&#x27;t disclose
    that its secretly an ad.<p>People have been gossiping this sort of stuff about
    each other for a very long time. If were gonna have a useful web again, we&#x27;ll
    need to find a way to scale that capability.'
