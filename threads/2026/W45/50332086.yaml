  author: __MatrixMan__
  text: You probably know somebody who knows somebody who knows them, we&#x27;re just
    not presently engineering for that fact to matter.<p>The most famous attempt at
    a web of trust was PGP, but it just attempted to bind a public key to a name.  That&#x27;s
    too generic. Only privacy nerds are actually going to have a key signing party
    if that&#x27;s all they get out of it.<p>I think that it&#x27;ll go better if
    the we&#x27;re attesting about common interests.  Like, go to the event because
    you&#x27;re enthusiastic about games, end up with some public keys as a side effect.<p>It&#x27;ll
    be hard if you&#x27;re the only person you know with a particular interest and
    it&#x27;s impractical to travel to wherever people with that interest gather.
    Then you&#x27;ll have to take a gamble on some internet handle you&#x27;ve never
    met. But really that&#x27;s just falling back to the dubiously trustworthy web
    we  currently have.
