  text: On the other hand, frontier LLMs are extremely good at getting super accurate
    info from games. They’ll happily disassemble the actual game binary to get to
    the bottom of certain game mechanics, including ones not obvious in the game itself,
    without even an explicit prompt to do so; I can merely ask questions about certain
    mechanics. That’s way better than often guessed (and guessed wrong) mechanics
    commonly found in game wikis. I’ve observed this over and over again when vibe
    coding some helper tools for some games I’m playing; I used to build these for
    wider communities and got some recognition for them, now I can do what I used
