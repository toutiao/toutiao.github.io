  author: grey-area
  text: In this new era it is almost zero effort to stand up a convincing website
    on any topic, which is mostly correct, but riddled with small confabulations and
    errors. It can take typing one sentence (even with grammatical errors) to do so,
    the bar is now zero for creating plausible &#x27;content&#x27; and flooding the
    internet with it. As the article notes bad actors, but also people who have good
    intentions, are flooding the zone with slop.<p>If it was all clearly completely
    incorrect, it wouldn&#x27;t be such a huge problem, but it is plausible and hard
    for humans to detect in a short time unless it is long form text.<p>Even search
    providers are giving us this new kind of generated result at the top of their
    results, which most people will be using blindly to verify answers. So it&#x27;s
    turtles all the way down.<p>If you&#x27;re not a domain expert you have no idea
    which things are right and which are wrong so it&#x27;s very hard to determine
    the truth or trust results.<p>To top all that, LLMs are being trained on this
    new untrustworthy data without differentiating it from older data, and trained
    by other LLM instances in a sort of recursive loop to improve performance on very
    narrow goals. What could possibly go wrong!
