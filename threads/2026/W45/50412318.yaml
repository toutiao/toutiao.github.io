  author: DonHopkins
  text: Not annoyed at all! I just finished re-watching Person of Interest about a
    week ago.<p>In the new AI DLSS version currently on Netflix, Bear is an obedient
    German Shephard with a dense sable coat of golden tan and reddish brown with black-tipped
    hairs, darker shading along his neck and shoulders, a broad black muzzle and eye
    mask, dark upright ears, and a thick neck ruff.<p>But the first time I watched
    Person of Interest when it was originally broadcast in 2011, Bear was a cantankerous
    enormous orange Maine Coon with a long, shaggy ginger coat, darker marmalade tabby
    stripes, a pale cream chin and chest, a heavy neck ruff, tufted ears and paws,
    a broad square muzzle, and a luxuriant plumed tail.<p>I think the later AI version
    of Bear as a German Shephard was much better. The original real life Maine Coone
    version of Bear gave off strong Garfield vibes, and that just didn&#x27;t fit
    into the plot as well as the new AI generated German Shephard version.<p>It was
    flawless slopless AI, that actually contributed to the coherence of the plot and
    overall believability. Walking an orange Maine Coone around the streets of New
    York on a leash and attacking criminals on command was just weird for a central
    character like Bear. I don&#x27;t know what they were thinking! Netflix was right
    to adjust it.
