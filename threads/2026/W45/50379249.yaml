  text: Last I checked it still doesn&#x27;t. A skill that tells your client to call
    a CLI, and uses the help menus for progressive disclosure, benchmarks better.
    Developers noticed this immediately and there is sort of an anti-MCP sentiment.
    The protocol was probably largely conceived for non-coding agents run by non-coders.<p>In
    theory the agents could just natively know how to do this better, to get exactly
    the composability you want. In fact, you could probably just write a CLI  mcp-caller
