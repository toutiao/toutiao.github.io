  text: As a trivial counterpoint, streaming outputs and proper signaling support
    is required for being able to compose efficiently under any setup&#x2F;harness.
    The more layers of abstractions you add, the more likely it is your MCP server
    didn&#x27;t support the usecase that some later agent came up with and so you
    can&#x27;t stop your stream when you find your top 3 hits. If you don&#x27;t even
    own the server, you can&#x27;t even modify the source and restart it to fix it.<p>There
    are usecases of MCPs (e.g. serving outside customers via proprietary tools), but
    composability has not been in the minds of the early users of MCP and it is one
    of the hundreds of little practical drawbacks they have when used in house.
