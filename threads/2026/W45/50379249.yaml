  author: krackers
  text: See also the discussion in &quot;Most RESTful APIs aren&#x27;t really RESTful
    &quot; <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44507076">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44507076</a><p>Particularly
    this subthread which was my moment of enlightenment <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44507991">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44507991</a>.
    A truly restful API isn&#x27;t for a program to consume, it&#x27;s for _you_,
    the user to consume through your user agent. Clicking on links is a hypermedia
    driven, restful api.<p>I think I saw a comment somewhere by the htmx dev, that
    Fielding was just giving a name to how the web already was at the time, hyperlinks
    rendered by a browser that you can navigate in a stateless way to get things done
    without the user agent being coupled to the sites themselves. It makes sense when
    you view it as backward-looking academic analysis rather than practical prescriptive
    advice.<p>But once you have that defined you can talk about whether things are
    more or less restful. That&#x27;s separate from whether something being &quot;more
    restful&quot; is even good or desired though.
