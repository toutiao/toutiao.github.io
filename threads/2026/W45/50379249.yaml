  author: steve_adams_86
  text: I used it for a project with okay results. The point was to share our org&#x27;s
    data in an accessible yet very flexible manner via Claude. The idea is that the
    MCP server provides structured, reliable means of querying and then presenting
    the data in predictable and useful ways, with a bunch of checks and balances along
    the way.<p>It was possible without MCP, but arguably this convention made the
    whole thing a bit more reliable and consistent. It also provides some safe guards
    against how people might get this data alternatively. People can now ask &quot;What
    was the ocean acidity like for January 2016 to March 2017 in the Salish Sea? And
    Claude will reliably draw up a graph for all stations in the Salish Sea monitoring
    this parameter, report which values have or have not been QC&#x27;d, show a map
    of the stations&#x27; locations, etc.<p>It works better than a skill or plugin.
    It allows me to integrate a protected endpoint more easily for the end users.
    It only knows about read-only endpoints. No risk of people handing credentials
    to Claude to make it easier. Overall it makes it pretty seamless to bundle a bunch
    of domain knowledge into the server, providing access and empowerment to a team
    of scientists who <i>can</i> but would really prefer not to write API queries
    when they have one-off questions about our data.<p>It could also be done with
    a CLI or something, but, the goal is to provide a powerful interface using simpler
    tools. An API or CLI would defeat the purpose.
