  author: thaumasiotes
  text: "&gt; Its known as onnarashii (女らしい) speech.<p>&gt; Its a historical thing
    which is gradually falling out of use.<p>No, not at all. Different sexes present
    themselves differently in every culture and therefore in every language. If you
    only learn from one sex, you won&#x27;t be able to tell what parts of their language
    are sex-specific, and you&#x27;ll learn to speak like they do.<p>I&#x27;ve gotten
    this criticism without speaking at all, by texting with people on Wechat. One
    girl remarked to me that saying 嗯嗯 [it&#x27;s an agreement noise; very close in
    concept to &quot;uh-huh&quot;], with two syllables, came off as overtly feminine.
    As a man I guess I&#x27;m supposed to text 嗯.<p>I still use 嗯嗯, though, because
    it&#x27;s as common as dirt in my experience and 嗯 is much rarer. Is that an artifact
    of my pool of conversational partners? Probably."
  score: 0
