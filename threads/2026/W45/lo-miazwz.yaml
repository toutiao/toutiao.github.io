  text: |-
    The technique this uses to allocate each “gigabyte” is bizarre. In an invisibleish iframe:
    var allocations = []

    function allocate_ram(batches, bytes) {
      for (var i = 0; i < batches; i++) {
        allocations += [new Uint8Array(bytes)]
      }
    }

    allocate_ram(512, 1024*1024)
    window.parent.postMessage("allocated", "*")
    console.log("Allocated")

    That’s half a gigabyte, plus a lot of bookkeeping. Also creating a Uint8Array may not actually allocate the memory—in Firefox at least, new Uint8Array(1e9) (an actual gigabyte) is fast and uses no memory, then accessing it for the first time is the slow operation because it does the actual allocation/initialisation.
    And why is it done in an iframe? Was it supposed to be a Worker to take it off the main thread? Or even just as simple as poor man’s async/callback?
    Was it done so to make it thrash your CPU for a bit as well as your RAM, to make it take longer?
    Are these the reasons why it was done in a million tiny arrays rather than one proper-sized one, and in a misguided/failed attempt to avoid blocking?
    I think you should get similar results from replacing the entire iframe code with
    (async()=>{
      new Uint8Array(1e9)[0];
      spinner.innerHTML="Thanks! ✅"
    })();

    Or perhaps setTimeout(…) instead of (async …)(), I find I can’t remember whether an async IIFE gets started immediately or put into a microtask, and I’m too lazy to check. Or the exact interactions with rendering, even if it is microtasked… hmm, yeah, better go setTimeout I think.
