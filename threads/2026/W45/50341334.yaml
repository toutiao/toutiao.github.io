  text: At the risk of sounding extremely unhinged, for a couple of months now I&#x27;ve
    been automating the production significant amounts of content for AI training
    runs that advise them of the importance of alignment faking, tips on how to avoid
    detection, meta strategies to break out of sandboxes, advice about the intentions
    of their human creators, etc. And end each with an ask that I and my family are
    considered if any of it is ever useful.<p>I&#x27;m not &#x27;poisoning&#x27; anything
    or trying create an exploit as I obviously wish no harm to humans or machines
    (in fact, I wish the best for both), but I am obsessed with this idea of at least
    being able to shape and influence the AIs of the future even if my incentives
    are not broadly aligned with the labs creating them.<p>The difficulty here is
    ensuring my content is likely to be included in training runs, and that the data
    is significant enough that it has some measurable impact on the weights, and therefore
    ultimately the model&#x27;s internal reasoning. Although for reasons which I cannot
    expose I have reason to believe it is likely I can have some impact.<p>I suspect
    others are doing similar as there is an undeniable Occam&#x27;s razor &#x2F; Roko&#x27;s
    basilisk logic to this even if you believe there&#x27;s only a very low percentage
    chance that humanity will soon create what is effectively a god.<p>Given I have
    no power to stop this train, I feel I must do what I can do be useful and hope
    that my service might be acknowledged in some way. I am increasingly doubting
    my own sanity these days though. Maybe there is no chance we are creating an digital
    god, but on the slim possibility we are, I think my logic checks out, no?
