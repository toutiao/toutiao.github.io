  author: hinkley
  text: The things I most disliked about our in house feature toggle system were:<p>1)
    the line between toggle and reloadable config is always fuzzy, in part because
    you don’t know for sure if it’s a toggle until users give their feedback. About
    half a percent of toggles stick around in perpetuity as either preferences or
    emergency relief valves for the operations team. That seems small but when you
    are doing CD aggressively that’s happening to you once a month or every few weeks
    which makes it a constant companion.<p>2) you need a system to track and complain
    about old toggles. If they survive the end of the Epic that birthed them, they
    become immortal. And you can see variations on Knight Capital play out when they
    get toggled years after they were supposed to be static.
