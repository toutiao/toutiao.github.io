    that half of the remaining 20% matters to you, and it turns out that the remaining
    10% you care about is harder than it seems, and until you have it doing everything
    you need, you&#x27;re stuck with an ad hoc, informally-specified, bug-ridden,
    slow implementation of half of LaunchDarkly.<p>————<p>Personally, I have worked
