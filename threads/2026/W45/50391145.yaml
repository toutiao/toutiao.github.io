  author: figmert
  text: Ex-LaunchDarkly engineer here.<p>Feature management goes well beyond an env
    var. Sure an env var change is fine on it&#x27;s own, but a change of the feature
    flag (essentially a release) requires a deployment.<p>Feature management separates
    these two. You can deploy without releasing. Because the code is there, but dormant
    behind an if that can change at runtime, you can actually target users, segments,
    or even do progressive rollout, and so much more. What this also means is you
    can test your changes in production without causing prod to go down. Best of all,
    a release doesn&#x27;t mean a bad deployment.<p>It&#x27;s not just about non-tech
    folks. It separates deploy and release in the SDLC, and that opens up a whole
    new world.
  score: 0
