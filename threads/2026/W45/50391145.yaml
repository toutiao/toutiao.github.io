  author: ivarconr
  text: 'Hi HN, I&#x27;m Ivar, creator of Unleash.<p>Unleash started in 2014 as an
    internal tool at my company at the time, because we wanted to ship to production
    continuously without big-bang releases. It&#x27;s an Open-Source feature flag
    platform with SDKs for &gt;25 languages.<p>A few design choices that might be
    interesting:<p>- Local evaluation: server-side SDKs fetch the flag config and
    evaluate in-process, so user data never leaves your app and a flag check is a
    memory lookup, not a network call.<p>- Shared Rust engine (Yggdrasil): the evaluation
    logic is written once in Rust and embedded in the SDKs, so behaviour is the same
    across languages.<p>- Unleash Edge: a Rust proxy&#x2F;cache for frontend and edge
    clients at scale. (Commercial)<p>- OpenFeature: supported if you don&#x27;t want
    to lock into our SDKs.'
