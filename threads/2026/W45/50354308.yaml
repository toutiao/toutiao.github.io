  author: Twirrim
  text: Friendly relationship or not, the end user experience is that something that
    was working, no longer is, because it&#x27;s not feature compatible.  This is
    despite it being used to replace it under the same name.  If it had been `runas`
    or anything else it&#x27;d be fine.<p>There&#x27;s a strong principle in upstream
    Linux kernel about &quot;You don&#x27;t break userspace&quot;[1], that I really
    wish more folks would get into their heads, but most especially a variant &quot;You
    don&#x27;t <i>subtly</i> break userspace&quot;.<p>If you&#x27;re going to replace
    an existing binary, under the same name, you need to be like-for-like in commands,
    even if your guts are completely different.  Very few people give a damn about
    how it&#x27;s actually implemented, just does it do what they need it to do.<p>If
    you want to do things differently, do it under a different name and have it be
    an explicit break for an end user by not shipping with the original and let people
    choose to install it if they really don&#x27;t want the new thing.  Breaking things
    <i>subtly</i> is completely unacceptable.<p>[1] espoused really clearly, as part
    of an infamous rant <a href="https:&#x2F;&#x2F;lore.kernel.org&#x2F;all&#x2F;CA+55aFy98A+LJK4+GWMcbzaa1zsPBRo76q+ioEjbx-uaMKH6Uw@mail.gmail.com&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;lore.kernel.org&#x2F;all&#x2F;CA+55aFy98A+LJK4+GWMcbzaa1zsPBRo...</a>
  score: 0
