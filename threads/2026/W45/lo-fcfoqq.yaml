  content: "[A few years ago](https://www.johndcook.com/blog/2021/02/25/fraction-comparison-trick/)
    I wrote about a curious result: _a_/_b_&nbsp;is usually greater than&nbsp;_c_/_d_&nbsp;when&nbsp;_a&nbsp;_+&nbsp;_d_&nbsp;is
    greater than&nbsp;_b&nbsp;_+&nbsp;_c_. And “usually” means with probability 11/12.\n\nAs
    stated in the post, you can make this statement rigorous by choosing integers
    up to size&nbsp;_N_ at random and taking the limit as&nbsp;_N_ goes to infinity.\n\nWe
    can also choose&nbsp;_a_,&nbsp;_b_,&nbsp;_c_, and&nbsp;_d_ uniformly from [0,
    1]. This is similar to choosing four integers up to _N_ and dividing all the integers
    by&nbsp;_N_, which doesn’t change the probabilities.\n\nNow&nbsp;_a_/_b_ \\>&nbsp;_c_/_d_
    if and only if&nbsp;_ad_ \\>&nbsp;_bc_, so another way to state the theorem is
    that\n\nProb(_ad_ \\>&nbsp;_bc_ | _a_ +&nbsp;_d_ \\>&nbsp;_b_ +&nbsp;_c_) = 11/12.\n\nOr
    to state it yet another way, pick two pairs of numbers at random. The probability
    that the pair with the larger sum also has the larger product is 11/12. That seems
    more intuitive to me than the original statement.\n\nIf _a_ +&nbsp;_d_ is greater
    than&nbsp;_b_ +&nbsp;_c_, it’s likely that&nbsp;_a_/_b_ is greater than _c_/_d_.
    It seems plausible that if&nbsp;_a_ +&nbsp;_d_ is _much_ greater than _b_ +&nbsp;_c_,
    it’s _more_ likely that _a_/_b_ is greater than _c_/_d_. Or in terms of cross
    products, the more the sum of one pair is bigger than the sum of the other, the
    more likely the product of the former is to be greater than the latter. That is\n\n_f_(_r_)
    = Prob(_ad_ \\>&nbsp;_bc_ | (_a_ +&nbsp;_d_)/(_b_ +&nbsp;_c_) ≥ _r_)\n\nshould
    be an increasing function of&nbsp;_r_. We know the probability above equals 11/12
    when&nbsp;_r_ = 1. We expect that the probability should approach 1 as _r_ goes
    to infinity.\n\nThis is indeed the case, as shown in the plot below.\n\n![](https://www.johndcook.com/f_of_r.png)\n\nIn
    particular, _f_(2) ≈ 0.99 and&nbsp;_f_(6) ≈ 0.999. So if&nbsp;_a_ +&nbsp;_d_ is
    two (or six) times bigger than&nbsp;_b +_&nbsp;c, there is a 0.99 (or 0.999) probability
    that&nbsp;_ad_ is larger than&nbsp;_bc_.\n\nYou can calculate&nbsp;_f_(_r_) analytically
    or estimate it by simulation. I had Claude do both and they produce comparable
    results. There is a closed-form expression for&nbsp;_f_(_r_) but it’s really complicated.\n\n##
