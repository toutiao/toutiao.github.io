  author: TimTheTinker
  text: 'It&#x27;s an interesting metaphor, but the math is not directly applicable
    to software engineering, because the shape of the problem (not to mention the
    terms) doesn&#x27;t translate.<p>The main problem is that shannon-nyquist is concerned
    with <i>discrete</i> representation of a <i>continuous&#x2F;analog</i> signal.
    But TA is applying it backwards: <i>software</i> is discrete and <i>human understanding</i>
    is analog. So human &quot;sampling&quot; of software is not something an A-&gt;D
    theory can speak to.'
