  author: adrian_b
  text: There are many years since AMD&#x27;s EPYC CPUs have been greatly superior
    to Intel&#x27;s Xeons and Intel has not succeeded to match them (Intel has a hope
    with the future Diamond Rapids Xeons, which are their first CPUs since 2019 that
    have a good chance to match AMD&#x27;s).<p>In the last few years Intel&#x27;s
    division that makes Xeons had huge losses, because in order to retain their big
    customers they had to accept to sell at big discounts, otherwise the customers
    would have switched to AMD.<p>All has changed this year, due to the AI craze.<p>AMD
    has sold all the server CPUs that it could make, within its allocations at TSMC.
    Everybody who did not succeed to buy EPYCs has bought Intel Granite Rapids Xeons,
    because they are not made at TSMC, but in Intel&#x27;s fabs, so they did not compete
    with other TSMC customers for allocations.<p>So Intel has also sold every server
    CPU that they could make, and they are now trying to retool some fab that made
    new Panther Lake CPUs back to the obsolete Intel 3 CMOS manufacturing process,
    in order to make more Xeons, to sell them as long as this huge demand persists.<p>Thus
    in the last quarter both AMD and Intel have sold less consumer CPUs than in the
    past, because all who could did delay their upgrade plans due to the unacceptable
    memory prices, but on the other hand both AMD and Intel had record revenues and
    profits from selling server CPUs.
