  author: a_conservative
  text: The other answers are hinting at it, but Optane was fundamentally much much
    lower latency than NAND flash used in SSDs.<p>SSDs use lots of tricks to hide
    this latency (using RAM).  However, when the data is super critical, you can&#x27;t
    just throw some data in RAM and hope that it gets written out.<p>Enterprise flash
    drives have battery backups and keep the system alive for a moment to flush out
    the writes, but Optane doesn&#x27;t need special tricks to get this sort of durability,
    it just has it.  The Optane can keep accepting writes, eventually the RAM of the
    SSD is filled, and then the write performance falls off a cliff.  However, if
    your workload gives the storage device a breather to write out to flash, you wouldn&#x27;t
    notice the difference.<p>If you have a large stream of critical data flowing in
    that has to be stored and can&#x27;t be lost- Optane suddenly looks way better
    than SSDs
  score: 0
