  author: latexr
  text: "&gt; You are talking about &quot;harming&quot; a collection of north and
    south facing flips on a disk<p>No, you missed the point. It has nothing to do
    with the entities in the game, it’s about <i>the player</i> outside of it. Look,
    it’s all well and good to blast your friends in a game and call each other rude
    names and whatnot, have fun! But you understand that’s OK because you have <i>consent</i>,
    right?<p>Here’s a story for you. I have omitted unnecessary details because outing
    anyone isn’t the point. There was a guy who played a certain competitive game.
    He was a good person, but he had the habit of describing a big game loss as a
    “rape”. He wasn’t trying to be malicious, he described himself as having been
    raped too when he lost big. But he threw it around too casually, and one day he
    played against a rape victim. Now, can you put yourself in the other person’s
    shoes and understand how having a traumatic experience thrown back at you casually
    can make you feel? And even if you believe it wouldn’t bother you personally,
    can we agree that everyone is different and that we shouldn’t ignore how they
    feel their pain? That there are little things we can all do to make other people
    be comfortable, and in turn they may do the same for us?<p>That’s all I’m saying,
    that we should practice some empathy. I’m not even saying this game shouldn’t
    exist, I’m only asking that we recognise that it may affect some people in major
    ways most of us on this website can’t possibly understand (and we should be thankful
    for it, not derisive) and that we should take that into account. In short, remember
    other people exist and share the planet with you, and try to not be a dick to
    them."
