  content: "# Pushing the Limits with getaddrinfo\n\nAn IPv4 address is just a 32-bit
    number, and glibc will accept it in forms you would never recognize. ⁰\U0001D44B⁴5．\U0001FBF0３₆。⁵₂₈\U0001D7F2\U0001FBF6
    is one of them. Anything that judges an address by how it looks can be walked
    around.\n\nThat is a real ping, to a real box, and it got a real reply. The thing
    after ping -c1 is a mix of LCD segmented digits, superscripts, subscripts, circled
    digits, a double-struck X and math-alphabet digits, with nine invisible characters
    that my terminal drew as white boxes because it had no idea what else to do with
    them. Paste it into a terminal and it looks like line noise. Hand it to getaddrinfo()
    and it is 69.30.206.130.\n\nEvery example in this post points at the same server,
    69.30.206.130. It answers ping, and it serves exactly one page, /poc.html, on
    its bare IP so you can prove the HTTP side works too. Every screenshot is real
    output, captured on Ubuntu 24.04 with glibc 2.39, iputils 20240117 and curl 8.5.0.\n\n##
    An Address Is Just a Number\n\nStart with the boring part, which is already weirder
    than most people expect. An IPv4 address is a 32-bit unsigned integer. The dotted
    quad is just how we have agreed to write it down. The parser that turns text into
    that integer is inet_aton(), and its rules date back to 4.2BSD. In glibc it lives
    in resolv/inet_addr.c, and each part is read like this:\n\n/* Collect number up
    to ``.''. Values are specified as for C: 0x=hex, 0=octal, isdigit=decimal. */
    ... unsigned long ul = __strtoul_internal (cp, &endp, 0, 0);\n\nBase 0 means strtoul()
    picks the base from the prefix: 0x is hex, a leading 0 is octal, anything else
    is decimal. Each dotted part gets its own prefix, so you can mix bases inside
    one address. Then there is the part count:\n\n/* Internet format: a.b.c.d a.b.c
    (with c treated as 16 bits) a.b (with b treated as 24 bits). */\n\nOne part is
    the whole 32-bit number. Two parts are an 8-bit network and a 24-bit host. Three
    parts are 8, 8 and 16 bits. These were meant for the old class A/B/C networks,
    and nobody ever took them out. Leading zeros are unlimited too, as long as the
    value still fits.\n\n## Enter IDNA\n\nEverything above is well known. It is the
    reason SSRF filters are supposed to parse addresses instead of regexing them.
    The fun starts with a flag most people never look at: AI_IDN.\n\nAI_IDN is a glibc
    extension that tells getaddrinfo() the name might be an internationalized domain
    name, so it should be converted to ASCII before lookup. ping sets it, because
    iputils is built with IDN support. Here is what glibc does with it, in sysdeps/posix/getaddrinfo.c:\n\nif
    (req->ai_flags & AI_IDN) { char *out; result = __idna_to_dns_encoding (name, &out);
    if (result != 0) return -result; name = out; malloc_name = true; } if ((result
    = text_to_binary_address (name, req, &res)) != 0) goto free_and_return;\n\nLook
    at the order. The IDNA conversion runs first, and the numeric address parser only
    sees the output. __idna_to_dns_encoding() hands the string to libidn2, which applies
    UTS #46 mapping. UTS #46 exists so that a user typing a domain in a different
    width or style still lands on the same name. To do that it folds a huge range
    of compatibility characters down to plain ASCII. That table does not care that
    the result is going to be read as a number.\n\n2473 ; mapped ; 0032 0030 # CIRCLED
    NUMBER TWENTY ⑳ -> 20 325A ; mapped ; 0033 0030 # CIRCLED NUMBER THIRTY ㉚ -> 30
    24EA ; mapped ; 0030 # CIRCLED DIGIT ZERO ⓪ -> 0 1FBF6 ; mapped ; 0036 # SEGMENTED
    DIGIT SIX \U0001FBF6 -> 6 1D7CE ; mapped ; 0030 # MATHEMATICAL BOLD DIGIT ZERO
    \U0001D7CE -> 0 1D501 ; mapped ; 0078 # MATHEMATICAL BOLD SCRIPT SMALL X \U0001D501
    -> x 216D ; mapped ; 0063 # ROMAN NUMERAL ONE HUNDRED Ⅽ -> c 1D49 ; mapped ; 0065
    # MODIFIER LETTER SMALL E ᵉ -> e 3002 ; mapped ; 002E # IDEOGRAPHIC FULL STOP
    。 -> .\n\nDigits are covered, and so are the dots. The x in a hex prefix and the
    a–f hex letters are covered too, which means every one of the classic forms above
    can be rebuilt out of Unicode lookalikes:\n\nCircled two-digit numbers are a nice
    touch: ⑥⑨.㉚.⑳⑥.⑬⓪ is four characters shorter than the plain address it decodes
    to. Hex works the same way, with a bold script x for the prefix, a Roman numeral
    one hundred standing in for c, and modifier letters for e:\n\nNotice that ping
    echoes back 0x451ece82 in its PING line. ping also asks for AI_CANONIDN, so what
    it prints is the name after IDNA mapping. That is the clearest view you will get
    of what the resolver actually parsed.\n\n## Full Chaos\n\nNothing says a single
    address has to stick to one style. The mapping is done one character at a time,
    so every digit, dot and hex letter can come from a different block. I wrote a
    small script that reads IdnaMappingTable.txt, collects every code point that maps
    to 0–9, a–f, x or ., and rebuilds each classic form by picking a random lookalike
    for every character: fullwidth, superscript, subscript, circled, math bold, sans-serif,
    monospace, double-struck, script, fraktur, Roman numerals, and the LCD segmented
    digits from \U0001FBF0 to \U0001FBF9. Every result resolved:\n\nHere are a few
    more, all 69.30.206.130, ready to paste:\n\nping -c1 \U0001D7FC\U0001D7F5．\U0001FBF3\U0001D7F6。\U0001D7DA\U0001D7D8\U0001FBF6．\U0001D7CF\U0001D7E5⓪
    # 69.30.206.130 ping -c1 \U0001FBF0\U0001D59D⁴\U0001D7DD｡⁰\U0001D687\U0001D7D9\U0001D5F2｡０ₓ\U0001D5A2ｅ｡⓪\U0001D44B\U0001D7D6\U0001FBF2
    # 0x45.0x1e.0xce.0x82 ping -c1 \U0001D7E2\U0001D4E7④\U0001D7F1₁ᵉⒸ\U0001D60C\U0001FBF8\U0001FBF2
    # 0x451ece82 ping -c1 ０１⓪₅｡\U0001D7D8\U0001FBF3\U0001D7DE．₀３\U0001D7D9\U0001D7DE。\U0001D7F6\U0001D7E4₀\U0001D7EE
    # 0105.036.0316.0202 ping -c1 \U0001D7DE\U0001D7D7。\U0001D7D1\U0001D7E2｡\U0001FBF5\U0001D7E4₈\U0001D7FC６
    # 69.30.52866 ping -c1 \U0001D7E8⑨．\U0001D7EC\U0001D569\U0001D7CFＥ\U0001D41Cᵉ\U0001FBF8\U0001D7F8
    # 69.0x1ece82 ping -c1 ⁰\U0001D44B⁴5．\U0001FBF0３₆。⁵₂₈\U0001D7F2\U0001FBF6 # 0x45.036.52866
    ping -c1 \U0001D7E3\U0001FBF1\U0001D7FB⑨6\U0001D7DC⑥\U0001FBF8\U0001D7DD\U0001D7CE
    # 1159646850 ping -c1 \U0001D7ECｘ\U0001FBF4\U0001D7DD．\U0001D7F9\U0001D7EC．₀3\U0001D7E3６｡\U0001D7CEⅩ\U0001FBF8\U0001D7DA
    # 0x45.30.0316.0x82\n\n## Invisible Ink\n\nUTS #46 does not only map characters.
    It also has a category called ignored, and an ignored code point is simply deleted
    from the input:\n\n00AD ; ignored # SOFT HYPHEN 200B ; ignored # ZERO WIDTH SPACE
    2064 ; ignored # INVISIBLE PLUS E0100..E01EF ; ignored # VARIATION SELECTOR-17..VARIATION
    SELECTOR-256 1BCA0..1BCA3 ; ignored # SHORTHAND FORMAT LETTER OVERLAP..UP STEP\n\nSo
    you can put invisible characters before, inside and after the address, and they
    are gone before inet_aton ever sees the string. I verified soft hyphen, zero width
    space, word joiner, invisible plus, combining grapheme joiner, Mongolian free
    variation selector, variation selectors 1, 16 and 17, the BOM, and the shorthand
    format controls. Most terminals render them as nothing. Mine renders them as the
    white <fe0f> boxes in the cover image, which is how I noticed the copy-pasted
    address was not what it looked like.\n\nThe cover combines all of it: a zero-padded
    hex first part, a zero-padded octal second part, and a 16-bit decimal tail, with
    every character swapped for a random lookalike and nine ignored code points scattered
    through it. After mapping it is 0x00000045.00036.52866, which inet_aton reads
    as 0x45, 036 (octal 30) and 52866 (206 × 256 + 130).\n\n## Who Falls For It\n\nNone
    of this is magic in getaddrinfo() itself. It only happens when the caller passes
    AI_IDN. Without the flag, glibc goes straight to the numeric parser, sees a circled
    zero, and falls through to a DNS lookup that fails. Python makes the difference
    easy to see:\n\n>>> socket.getaddrinfo('⓪\U0001D501④⑤①\U0001D556\U0001D4B8ⓔ⑧②'.encode(),
    None, socket.AF_INET, 0, 0, 0) socket.gaierror: [Errno -2] Name or service not
    known >>> socket.getaddrinfo('⓪\U0001D501④⑤①\U0001D556\U0001D4B8ⓔ⑧②'.encode(),
    None, socket.AF_INET, 0, 0, 0x40) # AI_IDN [(<AddressFamily.AF_INET: 2>, ...,
    ('69.30.206.130', 0))]\n\nTools that do their own IDN conversion work as well.
    curl and wget both link libidn2 and run the hostname through it before resolving.
    OpenBSD netcat does not, and fails:\n\nThe last command there is a different failure.
    IPv4-mapped IPv6 such as ::ffff:69.30.206.130 works in curl, because the kernel
    turns a connect on an IPv6 TCP socket to a mapped address into IPv4. ping instead
    opens an ICMPv6 socket and sends a real IPv6 packet to ::ffff:0:0/96, which no
    router will carry.\n\ncurl has its own wrinkle. Its URL parser has an ipv4_normalize()
    step that rewrites 0x451ece82 or 69.2018946 to 69.30.206.130, but that runs before
    IDN conversion. A Unicode host skips normalization, gets converted to ASCII afterwards,
    and goes out on the wi"
