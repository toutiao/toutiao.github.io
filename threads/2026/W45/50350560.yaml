  author: jeswin
  text: 'Hard to explain this without taking up space on an unrelated thread.<p>But
    I&#x27;ll give you a short example. Let&#x27;s say you have const x = [1, 2] and
    we want a policy&#x2F;solver for the type of x (int32 array, int64 array, or floats
    etc). We could say we&#x27;ll infer based on the usage of &quot;x&quot;, but it&#x27;s
    not free. For example, what if it&#x27;s passed into a generic function add&lt;T&gt;(...),
    or if there&#x27;s reassignment or it&#x27;s aliased, or if it&#x27;s being used
    in a loop counter, or a math operation or a combination of these? This is of course
    doable, but it requires a sweep of a million lines of code to understand the implications
    on C#, Rust, Mojo targets, and on the current code and tests.<p>I haven&#x27;t
    tried this specific example with OS models, but this is usually the kind of thing
    that almost immediately falls short and breaks everything. Codex and Claude will
    do a decent job of analyzing these and giving me better impact analysis. Codex
    and Claude will also be wrong many times, but the output is often usable.<p>Add:
    When I see OS models coming very close to frontier models in coding benchmarks,
    I just assume based on my experience that they&#x27;ve been benchmaxxed.'
