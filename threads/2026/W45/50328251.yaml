  author: oulipo
  text: 'I mean Lean has two things: a full programming language, and proof checker.
    The programming language is used to create either code, or proofs. But the &quot;created
    proofs&quot; are using a very simple subset (a bit like an &quot;assembly language&quot;),
    and only need somewhat simple rules to be checked<p>So as long as the &quot;somewhat
    simple&quot; core that checks to proof is correct, it doesn&#x27;t matter if the
    &quot;programming language&quot; has bugs: either in the end the &quot;proof assembly
    code&quot; generated by the program is right and is validated by the core, or
    it&#x27;s not, and you need to revise your proof, or to check for either a bug
    in the programming language (it didn&#x27;t generate the proof you were expecting),
    or in very rare case detect a bug in the simple &quot;core&quot;'
