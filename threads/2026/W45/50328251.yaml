  author: jacquesm
  text: That depends. Many of these things can only be applied safely once they&#x27;re
    understood.<p>For instance, almost all of cryptography is applied math. If your
    opponent understands the math better than you do you might end up with your secrets
    compromised.<p>Math is about as &#x27;pure&#x27; a science as there is, the touchstone
    of applicability is missing the point entirely, it is first and foremost about
    understanding things at one of the most fundamental levels (even more fundamental
    than physics) that there is.<p>Nobody cares all that much about the discovery
    (except that we name things for the person that discovers it, it&#x27;s sort of
    analogous to the discovery of a new piece of land). And given that the pay usually
    sucks this is a nice thing to be able to do. What mathematicians usually do really
    care about is their ability to understand the discovery and that this discovery
    has the proper foundations (other pieces of math that are also understood). It
    doesn&#x27;t really matter what the answer is if you don&#x27;t actually fully
    understand the question or the foundation the answer builds on.
