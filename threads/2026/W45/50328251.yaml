    we have a theorem proving machine, then we can use it to prove theorems.  If we
    have a machine to solve the Langlands program in one day, then we&#x27;ll think
    of more things to prove after that.  There&#x27;s a million unsolved questions
    in number theory unrelated to Langlands, and if we knew Langlands (and why it
    was true) we could make new conjectures that our theorem proving machine could
    solve, rather than having to speculate for 50 or 100 years like now.<p>The possibility
    he&#x27;s not considering is that the machine might be better even at conjectures,
    and then there really is no role for humans once the machine already knows things
