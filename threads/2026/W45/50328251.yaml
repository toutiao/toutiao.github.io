  author: ethanlipson
  text: 'To a first approximation I agree that it’s similar to industrialization.
    However there’s a key factor which distinguishes this case, and which makes the
    analogy less than perfect: there isn’t a profit motive in mathematics, so there
    was no push for this development from inside the field. Instead, the industrialization
    was entirely exogenous, from companies which do in fact have that profit motive
    and view math as a means to achieve it.<p>There might be a “proof motive” in math
    which one could argue will drive the full automation of theorem proving. But we
    must recognize that profit is more universally valuable (i.e. it has value outside
    the industry in which it was created), whereas proofs are only valuable inside
    the math community (at least the pure math proofs the labs have been publishing
    thus far).'
