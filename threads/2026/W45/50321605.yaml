  author: floitsch
  text: 'It&#x27;s a good point.<p>LLMs have not been trained on Toit code as much
    as they have on Python or JS. No question about that. Without the Toit skills
    (<a href="https:&#x2F;&#x2F;github.com&#x2F;toitlang&#x2F;ai-instructions" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;toitlang&#x2F;ai-instructions</a>)
    LLMs used to be really bad. (They might be better now, but I never bothered to
    remove the skill files). From that point of view, Toit isn&#x27;t a good choice.<p>On
    the other hand, Toit provides containers and a fast refresh-cycle. Both are godsends
    for AI agents: the containers make it so that the agent doesn&#x27;t accidentally
    bring down the whole system when there is a bug, and the refresh cycle makes iterating
    on programs much faster. (Something I find agents to be really good at).<p>Fwiw,
    there isn&#x27;t any clever metaprogramming in Toit.'
