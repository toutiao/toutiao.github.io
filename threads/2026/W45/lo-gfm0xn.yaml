  text: |-
    There aren’t any major changes from the original GOEXPERIMENT.
    This post is actually an updated version of last year’s experiment post at https://go.dev/blog/jsonv2-exp. From what’s described there literally the only update I had to make from that post is that the “inline” struct tag was renamed to “embed”.
    Other minor changes to functionality from the original GOEXPERIMENT:

    The “string” tag no longer applies recursively (for consistency with other tags).
    The “format” tag is removed (we hope to bring this back with better syntax using something like https://go.dev/issue/74472).
    Small adjustments to encoding/json/jsontext helper functions (e.g., jsontext.Token.Int and friends can now return an error).
    Probably a few other minor changes I’m forgetting at the moment.
