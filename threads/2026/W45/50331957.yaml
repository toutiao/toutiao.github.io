  author: radford-neal
  text: Natural selection doesn&#x27;t work like that. Having two offspring is good.
    Having three offspring is even better. Having ten offspring is really great.  More
    than than ten is greater still...<p>There&#x27;s a common theory that for mice,
    they&#x27;re unlikely to survive for many years because of predation, so there&#x27;s
    not much benefit to preventing aging in later years. Small benefit means any counterbalancing
    disadvantages (lower vigour?) could outweigh the anti-aging benefit, or that the
    force of selection is insufficient to overcome random mutations that degrade the
    anti-aging mechanism, but &quot;that&#x27;s good enough, no need for more&quot;
    is not how evolution works.
