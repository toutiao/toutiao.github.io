  author: hansvm
  text: "&gt; unfalsifiable<p>If we&#x27;re trying to piece together how the past
    actually happened based on the shadow it left on the present, yes, falsifiability
    is hard, sometimes possible to achieve. Most of the speculations I provided could
    be reasonably well tested though.<p>Take (5) as an example. If you find other
    important byproducts from the associated genes, those strengthen (5)&#x27;s argument.
    If you find significant negative effects from the new &quot;miracle&quot; proteins,
    those strengthen (5)&#x27;s argument. If you find an organism with an energetically
    intensive mechanism for removing these new &quot;miracle&quot; proteins, those
    strengthen (5)&#x27;s argument. If you apply a medicinal intervention to allow
    the gene to be enabled but those particular &quot;miracle&quot; proteins to be
    disabled in a wild population and observe the gene frequency dwindle, that strengthens
    (5)&#x27;s argument.<p>None of it&#x27;s perfect, but there are a variety of experiments
    and observations you can do to strengthen or weaken your belief in specific causal
    mechanisms.<p>&gt; used to justify unjustifiable positions<p>I go back and forth
    on this one. Should you hide information (in this case, not even very good information,
    just plausible mechanisms, provided because somebody was a bit curious and I thought
    scratching that itch might help them on whatever journey they&#x27;re currently
    undertaking) just because it&#x27;s possible to misunderstand it? Because it&#x27;s
    prone to misuse?<p>Like, obviously if people are concluding from a list of guesses
    appropriately described as such that osteocytes evolved to extend life as a poorly
    calibrated part of the exercise process, that&#x27;s not justified. What happens
    when people extend similar wild speculation to gender or racial differences? You&#x27;re
    right, it&#x27;s a touchy subject.<p>On the other hand, that&#x27;s an argument
    against:<p>- Data-driven organizations -- a common cognitive bias is the spotlight
    effect, and applied to &quot;data-driven&quot; organizations it often leads to
    abandoning intuition and reason when the best proxy measurements you&#x27;re able
    to perform incorrectly suggest a different course of action to be optimal.<p>-
    Giving correct estimates to your PM -- you know the organization will run more
    smoothly if you start unraveling the spaghetti sitting in fromt of you, but (in
    many orgs) it&#x27;ll take longer to argue that point than it will to just do
    your job correctly, so you fudge ticket descriptions and estimates to make sure
    critical maintenance happens.<p>I try to evaluate that sort of thing on a case-by-case
    basis. I think it&#x27;s fine here. I don&#x27;t have a good justification for
    why I think that."
  score: 0
