  author: radford-neal
  text: Evolution is the unifying concept underlying all of biology. Finding and testing
    evolutionary explanations may be difficult, but not looking for such explanations
    is akin to saying to someone speculating about why, say, some wooden structures
    are stronger than others, that &quot;I find these explanations of physical effects
    in terms of gravity and electromagnetism very unconvincing&quot;. Wood is a complex
    material, so understanding its properties is difficult. But if your explanation
    of wood&#x27;s properties is incompatible with fundamental physics then there&#x27;s
    something wrong with it.<p>Similarly, explanations of aging that amount to &quot;the
    body just for no reason fails to do something that it easily could even though
    it&#x27;s obviously beneficial&quot; are pretty much like explanations of physical
    processes that violate conservation of mass&#x2F;energy. There had <i>better</i>
    be some possible evolutionary explanation, since otherwise it&#x27;s very likely
    that the result is due to some experimental error.
