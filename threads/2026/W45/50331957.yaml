  author: Windchaser
  text: "&quot;..and eaten&quot;<p>Probably not effective, our gut is very good at
    splicing up proteins into constituent amino acids.<p>If you want specific proteins&#x2F;peptides
    in your bloodstream*, for now the most reliable way is generally to inject them.<p>But
    yeah, it is very much <i>not</i> necessarily the case that our own bodies will
    produce the same proteins under similar exercise, or that the mouse proteins released
    would have the same effects in us as in them, or that proteins released under
    similar exercise would actually de-age us.<p>It&#x27;s interesting to track down
    the mechanisms in mice (exercise induces protein release - how? - which then de-ages
    the mice - also, how?) but you have to reproduce the work entirely separately
    in humans. Not just because it might not work, but because it is very important
    (and neat!) to understand the biochemical mechanisms of human ageing and de-ageing,
    and that understanding of How Things Work is a big part of the long-term reward.<p>[*]
    I&#x27;m not advocating for injecting untested&#x2F;unregulated proteins or peptides,
    only speaking of ROA, route of administration"
  score: 0
