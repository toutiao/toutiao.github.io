  author: outworlder
  text: Sure, if it is just about installing a package. But installing a program,
    reading documentation, then configuring the right settings, confirming it is doing
    what you want it to do, find out that&#x27;s something wrong, going back to the
    docs... all of that can be automated.<p>And it&#x27;s not just about installing,
    it&#x27;s also about fixing issues. I had an intermittent DNS issue that I was
    not able to track down, and I didn&#x27;t have enough time to dedicate myself
    to instrumenting my devices to chase it. I dropped a single line to an agent.
    It quickly wrote a test script, kept monitoring, when the problem manifested it
    tracked it down to a wrong IPV6 DNS config, crafted the pull request to fix it
    on my router (I have the homelab configured via gitops, local gitea).<p>I was
    also playing a windows game on linux and I had a weird mouse issue. Reading forums
    and bug trackers didn&#x27;t do the trick and I threw the towel. I asked the agent.
    It grabbed the system (and game) logs, and figured out a fix. In a couple of minutes.<p>I
    would eventually find those issues, given enough time. But I don&#x27;t have to
    anymore.
