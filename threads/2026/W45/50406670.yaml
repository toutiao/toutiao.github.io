  text: Prompt injection is indeed a thing. You are not paranoid. Even more so if
    the LLM in question is not very smart (frontier models are better at not falling
    for prompt injection, but not immune).<p>I don&#x27;t think OP literally meant
    the agent is running as root though. &quot;| bash&quot; shouldn&#x27;t do anything
    more than the user the agent is running at can do. The bigger threat is an instruction
    to &quot;install &lt;such and such package&gt; in the box&quot;. Then the agent
    could reach out to the container and do just that.
