  text: lol last time I crowed about VictoriaMetrics someone accused me of being a
    bot <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48192183">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48192183</a><p>But
    anyways, a fun test I ran was &quot;load 4.5 million samples of Beijing hourly
    air quality data (ozone, S02, PM2.5, etc) from May 2013 to May 2017.&quot; (using
    Bento to turn the csv into json to fire at the API, with some batching and 4 http
    connections to Victoriametrics )<p>VictoriaMetrics accepts all of this in 54 seconds,
    network traffic shows between 9 and 14MB per second , and the data is available
    several seconds later (it&#x27;s definitely a noticeable delay for me before it
    shows up in the VictoriaMetrics UI). Server is an old passively cooled thin client
    with a quad core AMD GX-415GA (circa 2013) and DDR3 ram.<p>So, 4.5M data points,
    11 timeseries.  Docker volume says it&#x27;s under 14MB in size.<p>In my regular
    day-to-day telemetry (separate container) the volume is 99MB in size, it has 11,747
    timeseries, 18,689 total samples, but I only keep a few days of data retention.<p>I
    think VictoriaMetrics is great, and I have found their documentation is extensive
    and easy to follow.
