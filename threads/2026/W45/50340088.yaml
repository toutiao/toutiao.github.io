  author: derefr
  text: For some reason AI coding agents seem to think a README should be a Product
    Requirements Document (PRD).<p>I think it&#x27;s because most projects don&#x27;t
    have <i>any</i> settled place (or at least, any place that lives inside the project&#x27;s
    source-code repo) to record PRD-like information.<p>But because AI coding agents
    really do benefit from having PRD-like info (i.e. a hierarchical breakdown of
    the &quot;intended what&quot; and &quot;intended how&quot; of the system that
    &quot;should&quot; exist in the repo, kept updated to reflect changing ideas about
    those intentions), they really <i>want</i> to record that type of info <i>somewhere</i>,
    so they can then reference it.<p>AI coding agents don&#x27;t seem to have any
    &quot;taste&quot; (or maybe &quot;confidence&quot;?) when it comes to asserting
    that even if you don&#x27;t already have a separate PRD-like file in the repo,
    you <i>should</i> have one, if you want the agent to do its job well, and so it
    would request you to let it create one (or just automatically do it.) Instead,
    they just shrug and cram the PRD stuff into whatever structure you do already
    have. Which, if you&#x27;re starting fresh with a greenfield project, is usually
    just a README.<p>(I hypothesize that if you tell an AI coding agent to use Behavior-Driven
    Development [BDD] on a greenfield project, it&#x27;ll probably lean toward maintaining
    its PRD-like info in the form of BDD test cases. Haven&#x27;t tried this experiment
    yet; would be interested to know the outcome!)
