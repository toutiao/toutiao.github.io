  author: aarushyadav
  text: Lip reading is one of the other modalities we tried as well beyond IMU, EMG
    and RF! We worked a lot on fine tuning Auto-AVSR, one of the most commonly used
    open source lipreading models. It&#x27;s very enticing to work on, since it gets
    to about 17% word error rate, which looks good enough that you would think working
    on it further would get it down to product quality, but we found there&#x27;s
    an information-theoretic limit on the modality. Speech has 40 phonemes, but only
    about 12 to 15 visemes (externally visually separable phonetic states). For example
    P and B look very similar from a camera. This causes the scaling laws on lipreading
    to flatten out at an error that&#x27;s too high to be product ready but just low
    enough to make for a good demo. Our original plan was actually to ship a lipreading
    software to see if people would want this behavior, but we realized you couldn&#x27;t
    make lipreading work!
  score: 0
