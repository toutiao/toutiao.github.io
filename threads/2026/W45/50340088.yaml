  author: aarushyadav
  text: It actually can! Since the RF can see inside your mouth the system doesn&#x27;t
    inherently need lip movements and can be fine tuned on what we call &quot;internal
    speech&quot;. Note that this isn&#x27;t the automatic tongue movements that occur
    when &quot;thinking&quot; words to yourself, but it&#x27;s rather like mouthing
    with your lips closed. We don&#x27;t often lead with this since it&#x27;s weird
    for many people to do, but with a bit of practice, we have been able to get it
    down pretty well.
