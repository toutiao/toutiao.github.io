  author: komali2
  text: "&gt; Motivate participants to contribute using diverse incentives that are
    frequently, if not exclusively, nonmonetary.<p>&gt; It’s worth repeating that
    these characteristics defy conventional assumptions about organizations and economic
    production.<p>I&#x27;m reminded of the meme, a caveman honing a spear, with the
    tag &quot;How is he innovating without financial incentive?&quot;<p>I feel like
    the &quot;conventional&quot; understanding of human behavior and motivation is
    new and wrong. That being: to get people to do things, you gotta pay them. To
    get them to do the thing better, offer a monetary reward &#x2F; incentive.<p>In
    reality, the savviest of capitalism&#x27;s participants instinctively understand
    this to be false: the prize in a sales contest is never a cash reward, it&#x27;s
    always a car (or similar). A car that can be seen in the parking lot forever after,
    a clear symbol of the winner&#x27;s success and competence. In the old days, it&#x27;d
    be bear claws on a necklace.<p>We made the mistake of thinking that the bear claws,
    shells, whatever, were an early form of currency, that they were a single scalar
    by which a society measured value, something that could be traded, when in reality
    they were abstract markers of a given person&#x27;s prowess or status. People
    aren&#x27;t proud and excited to own a porsche or have more bear claws so much
    as they&#x27;re excited to show off what the porsche or bear claws represent:
    their competence and hard work. Trading the bear claws for a cow doesn&#x27;t
    impart the value of the claws onto the receiver; unless they can lie successfully,
    everyone knows they didn&#x27;t kill that bear, so the claws are useless, or worse,
    stolen valor. Similarly, many of us doubt that the people who have orders of magnitude
    more shells than the rest of us did anything worthy of deserving them, or at least
    not to such an absurd degree.<p>I&#x27;ve been reading a lot about human happiness
    and fulfillment lately because I&#x27;m 35 and a dink so I&#x27;m gonna have to
    do this manually (I assume kids give automatic fulfillment, correct me if I&#x27;m
    wrong).<p>In &quot;The Dispossessed,&quot; Ursula K. Le Guin writes:<p>&gt; A
    child free from the guilt of ownership and the burden of economic competition
    will grow up with the will to do what needs doing and the capacity for joy in
    doing it. It is useless work that darkens the heart. The delight of the nursing
    mother, of the scholar, of the successful hunter, of the good cook, of the skillful
    maker, of <i>anyone doing needed work and doing it well</i> -- this durable joy
    is perhaps the deepest source of human affection, and of sociality as a whole.&quot;<p>Emphasis
    mine. This idea that happiness and fulfillment comes from doing useful work and
    doing it well is the most consistent idea I&#x27;ve found in my reading. Edward
    M. Hallowell specifically prescribed it as treatment for depression from ADHD:
    experiment until you find an activity you&#x27;re good at (novelty hunting), then
    work to get better at it, then seek recognition for your competence. Repeat until
    death.<p>So therefore I think FOSS is the natural human instinct, and all these
    attempts to steer human motivation with money is a wrongheaded abomination, and
    the source of a great deal of our unhappiness in life. How else can we explain
    that happiness and fulfillment is <i>lower</i> in some of the richest societies
    on earth than it is in some of the poorest? Very few of us are doing useful work,
    and we instinctively know it."
