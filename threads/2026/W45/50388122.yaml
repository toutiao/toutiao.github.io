  text: "&gt; Somebody&#x27;s got to do the dirty work, like fixing sewers. That&#x27;s
    why we pay people, because they don&#x27;t want to work for free.<p>I actually
    know a guy whose job it is to empty septic tanks, and he LOVES telling people
    super gross stories and leaning into his capabilities as someone to not be bothered
    by what he deals with on a daily basis. Watch that old show &quot;Dirty Jobs&quot;
    for lots of other people that think similarly.<p>Nobody wants to serve someone
    else&#x27;s profits for nothing in return. That wrinkle kills a lot of FOSS motivation,
    when Micro$oft snaps up your project and starts raking in millions without a cent
    going to you. That&#x27;s obviously unfair, and one things humans are very good
    at is telling when something isn&#x27;t fair.<p>My overall point is, when controlling
    for baseline maslow, and ensuring there&#x27;s no unfair labor exploitation, in
    a situation where we need plumbers, <i>someone</i> will be attracted to the vacuum
    of need, because humans love being needed, and love doing useful work."
