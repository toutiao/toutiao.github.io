  author: RetroTechie
  text: 'Missed some mentions like crowdfunding, crowd-sourced journalism &#x2F; investigative
    efforts &amp; the like. But a good read.<p>Imho people (and even animals!) instinctively
    understand that most actions are not zero-sum. That other people&#x27;s gain (whether
    individual or community) often exceeds the &#x27;loss&#x27; of the person who
    puts in the effort. Doubly so if the latter enjoys doing it.<p>Classical economics
    ignores that. It assumes that parties nearly-always act rational (untrue), generally
    don&#x27;t like &#x27;work&#x27; so require compensation (YMMV), participants
    in a market are well-informed (untrue), transactions are zero-sum (rarely), money
    is THE only relevant &#x27;currency&#x27; (it&#x27;s just one of many), people
    are selfish (debatable, imho this is learned rather than intrinsic behaviour),
    markets are free (untrue), or that &#x27;free&#x27; markets are the only way to
    efficiently allocate resources (again: debatable). That&#x27;s a lot of questionable
    assumptions to base crucial socio-economic (and policing &#x2F; military) systems
    on.<p>More likely it&#x27;s mostly historic reasons. During some period, some
    approach worked better for some groups of people (probably helped by a lot of
    violence). And this carried forward to the present day in complex, poorly-understood
    ways. Never mind propaganda (include social networks&#x27; algorithms there),
    disinformation, or that status quo can be incredibly hard to disrupt.<p>Disclaimer:
    I&#x27;m not advocating to turn what exists upside down! But it&#x27;s good to
    question underlying assumptions considered &#x27;common knowledge&#x27;. Re-organise
    things, have a look at alternatives. And things change. What was valid yesteryear
    may not hold water today.'
