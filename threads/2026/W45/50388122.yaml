  text: Personally, I think it&#x27;s good that volunteers build the internet and
    do things like that, but fundamentally, the barrier to the web has become too
    high. In the past, making a website was easier than you&#x27;d think, and the
    legal side was a bit more lenient, but these days, as laws accumulate precedents,
    there are many things to pay attention to, and starting with security, the number
    of things you need to worry about has increased.<p>The problem is that in the
    early days of the internet, people needed time to grow together. But these days,
    the barrier to entry is fundamentally higher than before. And even when making
    one site, you have to worry about various things...<p>In my view, there is also
    the point that people forget the fact that as business becomes more sophisticated
    and technology develops, the basic skills of the people involved need to increase
    accordingly. The reasons the internet has gotten worse are complex. For example,
    there is definitely the problem of people trying to make money through advertising
    and such, but fundamentally, the technical barrier to attracting people&#x27;s
    attention has also risen a lot.<p>The amount of technology a single individual
    developer has to handle has also increased a lot.
