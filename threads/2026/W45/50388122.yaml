    without taking into account that people can <i>and will</i> abuse it, and then
    not even have some sort of report system where people can say &quot;hey. have
    a look at this&quot;. That&#x27;s basic ethics review that should have caught
    this abuse potential and suggested mitigations <i>before</i> people lost their
    lives.<p>And the lack of moderation around hate speech of all kind is similarly
    corrosive. Sure, in the US it might be legal to go on the street and call for
    a &quot;peaceful ethnic cleansing&quot;. But if you do so, you will likely eventually
    get insta-sanctioned by someone just like Richard Spencer [1]. On the Internet
    however? Nothing, other than maybe getting a shitstorm. There is no feedback mechanism
    in the libertarian&#x2F;ultra-free-speech internet to signal to people that what
    they are peddling is not the mainstream view, no way of triggering some self reflection.<p>[1]
    <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=aFh08JEKDYk" rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=aFh08JEKDYk</a>'
