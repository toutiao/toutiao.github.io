  author: api
  text: It&#x27;s still not a conspiracy. Those are all local responses to incentives.
    The incentive <i>structure,</i> the system, is what determines the outcome, not
    the players.<p>In a basketball game who wins may vary but you know balls will
    go through hoops because that&#x27;s what the rule set of the game incentivizes.<p>Investors
    want returns so number must go up. Eventually companies and their executives exhaust
    the basic honest core business so they have to start scraping for more revenue
    growth. Eventually this leads to the familiar process of enshittification where
    the company flips the script and sells the customers as the product and nickel
    and dimes people. This eventually ruins the product but number must still go up,
    so who else can pay? Criminals, scammers, government propagandists, political
    influence operations, intelligence agencies, militaries, etc.<p>We get what I
    just described for the same reason basketball makes balls go through hoops.<p>Why
    does number have to go up? Because you want to retire. Your pension funds and
    banks and such hire financial experts to invest. Those experts invest in things
    that make number go up because that&#x27;s <i>their</i> job.<p>That&#x27;s why
    this is hard. You are a player. We are all both hurt by the system and benefit
    by the system. It feeds us and protects us and enslaves us. Everything is paradoxes
    and feedback loops. When you get a job you want things like benefits and union
    wages, but when you go shopping you pick the cheapest product which means you
    want to break unions.<p>Conspiracism is a cop out from trying to understand this.
    It&#x27;s easier to just pick a single scapegoat (often a make believe one) and
    blame them.<p>I&#x27;m not saying all the people in all the links you posted are
    great people, just that they&#x27;re not the architect of this. There is no architect.
    The game was designed by the mad blind idiot gods of complexity and evolution.<p>I&#x27;ve
    had the thesis for a long time that humans are not actually intelligent. We are
    merely clever. A clever organism can deploy local intelligence to maximize its
    outcome in a game. A truly <i>intelligent</i> organism would understand the game
    and become the architect. We might not have the cognitive capacity for this. Maybe
    ASI can, or can help us.<p>Maybe that&#x27;s why the aliens aren&#x27;t talking
    to us. Anyone capable of star travel is the latter. They take a look and think
    &quot;interesting fauna down there but nothing intelligent yet. They only try
    to win games.&quot;
