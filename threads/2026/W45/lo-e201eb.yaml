  author: eschwartz
  text: |-
    sudo run0 is a perfectly valid command prefix. Moreso since run0 is not a sudo replacement (and doesn't elevate you to root).
    run0 can internally invoke polkit (it is not alone here) and there's no reason it couldn't also invoke sudo or doas or similar if the authors desire. But that is polkit being a sudo replacement, not run0.
    And that means you have to configure an entirely different subsystem with your desired access lists. And not everyone likes polkit to begin with (though the gripes are less these days now that polkit no longer requires spidermonkey).

    or only as a wrapper script around run0 and without any promise of compatibility

    That would defeat the purpose of having a sudo command so thoroughly that one must wonder why even suggest it, aside for trying to see if it upsets anyone.
    This is even a comment on an article complaining about replacing programs with identically named binaries that don't behave the same, so replacing a binary with one that isn't even attempting in the most superficial way to be a drop-in replacement is very much on topic... as a thing which will make nobody happy.
    Just use run0 if you like it?
    And maybe reluctantly let people install nondefault packages like sudo if they really demand to do so -- why must it be so desperately important to stop packaging sudo at all (and certainly it's impossible to package it if the init system conflicts with it).
