  text: |-
    You said that distros should stop shipping it "at all". Implying but not explicitly saying that this isn't about the default install, because the words "at all" naturally read as "at all" rather than "by default".
    You said that the default install (perhaps packaged in the systemd package, which cannot be uninstalled?) should ship a sudo command that is a wrapper around run0. Unambiguously making it impossible to have the same file installed by a different package instead (since you cannot uninstall systemd). In theory this can kind of be worked around by adding and maintaining multiple extra packages -- two to provide the alternative symlinks for each provider, a third to depend on one or the other of the first two -- but the cost in engineering time is nontrivial and whether or not it even works at all is very package manager dependent and certainly not something all distros can do (but you insisted all distros should do. So I conclude my first reading was correct and this is not about the default install.
    Many distros already don't include sudo in the default install, because including tons of unwanted software in the default install is just dead weight. The ones that do include unwanted software also have a tendency to assume polkit is enough because polkit is graphical and they don't target command line users. So "distros should stop doing XYZ at all" would be a funny thing to say, if it meant "stop doing it by default" and most distros already weren't.
    If that's what you meant anyway them apologies for the confusion, but it's still a waste of engineering effort.
