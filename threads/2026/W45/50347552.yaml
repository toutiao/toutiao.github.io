  author: epiccoleman
  text: 'The trick is to <i>just use the thing</i>. You really don&#x27;t need to
    study anything.<p>There&#x27;s a bit of a hump you have to jump through when you&#x27;re
    first getting used to having separate modes for input and editing &#x2F; navigation,
    but that&#x27;s honestly the worst part.<p>After that, you just need to notice
    things that you need to do often, and then go &quot;I bet vim makes that easy.&quot;
    You pick up a little trick and use it. You probably don&#x27;t remember it the
    next time, but you remember there was a way, and you look it up again and reinforce
    it. You eventually remember the things that were useful to you, and forget the
    &quot;tricky stuff&quot; that wasn&#x27;t.<p>Over time, you start getting your
    head around how it works, the whole verb &#x2F; subject thing, and then you start
    learning to speak the language. You stop thinking &quot;ok, i need to go to normal
    mode, then type c, then i, then t&quot; and start thinking &quot;change inside
    tag&quot;.<p>Vim&#x27;s not really about &quot;editing super fast.&quot; It&#x27;s
    more like a different mental model of editing text that really, genuinely, is
    <i>better</i> than the default mode on offer in your standard text editor. It&#x27;s
    more keyboard driven and composable and just _capable_. Text editing operations
    that are annoying in standard editors are trivial in vim.<p>I think these little
    games are neat, but ultimately wrongheaded. The best way to learn vim is to use
    vim to do vim things. I&#x27;ve been using vim (or, more often, vim editing modes
    in VSCode or IDE du jour) for around a decade, and I bet I don&#x27;t use 95%
    of what it can do. But that 5% I do know is extremely useful.<p>Also though: it&#x27;s
    a nerdy text editor, and it&#x27;s fine if you don&#x27;t like it or want to learn
    to use it.'
