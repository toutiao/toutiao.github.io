  author: williamdclt
  text: 'I&#x27;ve been using vim keybindings in all my IDEs for the past 10y, and
    IMO you&#x27;re mostly right, it&#x27;s not worth it. It&#x27;s definitely pretty
    fast, I&#x27;m probably faster at writing code than 95% of my coworkers despite
    being a poor typist, but TBH I don&#x27;t think I&#x27;m much faster than when
    I used to learn&#x2F;configure my editor&#x27;s shortcuts.<p>Other commenter mention
    stuff like yanking, moving lines, selecting blocks, word-level and line-level
    operations, scrolling pages, that&#x27;s all stuff that editors can absolutely
    do (despite what vim-lovers say) and sometimes do it better as they&#x27;re semantics-aware
    (&quot;go to function arguments&quot; is possibly in intellij but not really in
    vim, and vim block selection doesn&#x27;t work in indented languages like YAML
    or Python). Recording macros? Intellij has it.<p>Editors don&#x27;t do stuff like
    &quot;delete the next 5 lines&quot; or &quot;delete up to line 38&quot;, but I
    find that I never do that in Vim: if I have to count lines or look up the line
    number, might as well do a selection as I go and then just press &quot;delete&quot;,
    or to delete a small chunk of lines and press &quot;.&quot; (repeat) until I&#x27;m
    done. More keystrokes, but no cognitive effort so faster overall.<p>Sure, there&#x27;s
    stuff like executing some command you have selected and piping the result into
    your vim buffer, mixing that in with macros... Vim is probably the fastest way
    to do this sort of stuff, but I have use for that maybe once every three months?
    It&#x27;d take me more time to look up how to do it with vim than to do it manually.<p>If
    you really get serious with it, you can probably be much faster with Vim than
    I am. If that&#x27;s something you&#x27;re interested in, go for it, but IMO that&#x27;s
    closer to a hobby than anything else. Editing speed rarely is the bottleneck as
    you say. Still kinda nice to have consistent keybindings across editors, and I
    find vim pretty good for freetext notes.'
