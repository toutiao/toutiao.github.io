  author: pajen
  text: I have been doing firmware hacking of audio devices as a hobby for the last
    20 years. I released a CFW for Volca Sample almost a decade ago that was fairly
    well received, but have also hacked other Volcas, Zoom multitrackers, Line6 fx,
    Variax guitar, Digitech looper, couple Reface, AKAI, Stylobeat etc. I have some  observations:<p>1.
    I tried running ghidra from claude about a year ago. I was not impressed, it was
    not really that good. It felt confused and not knowledgeable enough. I picked
    it up again a couple of weeks ago, and must say - it is nothing less than spectacular.
    I am having a small existential crisis here, Terry Tao light. 100x my skill, 1000x
    my speed it feels like.<p>2. Like all consumer products, design and brand is essential
    to the buyer&#x2F;user experience of audio tools. Removing options in UX is what
    design entails a lot of the time. You are in reality paying a premium for options
    to be deleted from menus, gently nudging you into a curated brand culture. Acting
    like it is inherently bad is missing the point. It is like insisting everybody
    should roll their own Arch Linux on their laptops.<p>3. Audio tools&#x2F;synths&#x2F;fx&#x2F;sequencers&#x2F;controllers
    are instruments. The value of an instrument is to a great extent dependent on
    the time invested in learning it, as opposed to inherent things like &quot;audio
    quality&quot;. Music is very in-the-moment, so any cognitive friction that takes
    you out of the flow is gonna detract from the experience. Having a &quot;fixed&quot;
    UX is in this sense a way of focusing, honing muscle memory and releasing flow.
    Watch Jeff Mills hunched over a 909, that is some Paganini shit. Standardization
    drives adoption, adoption fuels cultural expression, expression creates genres.<p>From
    an individual tech-loving buyers&#x27; point of view, the AI revolution in CFW
    is fantastic, from the vendors point of view, not that easy to handle.
