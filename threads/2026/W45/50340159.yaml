  text: "&gt; possibly making newer models less appealing<p>Amidst the understandable
    joy, one thing I&#x27;ve seen almost no discussion about:  the change in the incentive
    to research and develop new algorithms.<p>Most of the new firmwares are re-implementing
    familiar synth algs into new places.  Almost as quickly, aything new that comes
    out will instantly get cloned to every other device.<p>Pending strategy, I&#x27;ve
    frozen release on my newest instrument.<p>Like open source software, people feel
    entitled to everything for free.  And plenty are feeling vengeful of designers&#x2F;companies
    for withholding alg development.  This results in rationalization to defend in
    some cases piracy.<p>It&#x27;s nice that &quot;music wants to be free&quot; and
    that people can dream up new sounds, but this is challenging for new designs.
    Say Roland comes up with a new technique &quot;WaveZorb.&quot;  A few audio examples,
    an afternoon playing it into an LLM and poof, it&#x27;s like Doom, available on
    any instrument.  Who needs to buy a WaveZorb anymore? Then, Korg invents &quot;FiltFountain,&quot;
    sells three of them, and the alg is on everyone else&#x27;s device faster than
    it can physically ship.<p>It&#x27;s not worth fighting, but thinking about: The
    path forward is to gray goo.  With little to differentiate any instrument from
    another.  And little support or incentive to make any new synthesis algorithms."
