  text: Yes. Custom firmware for audio gear has been A Thing for a long time, as far
    back as the 1990s. I worked on a company that offered a general DSP platform back
    in 2003, but it didn&#x27;t take off because it was too difficult for most people
    to program. JJOS became very popular among users of Akai&#x27;s MPC line (of whom
    there are very many) in the mid-2000s.<p>The combinations of LLMs and agentic
    reverse-engineering skills have sent things into overdrive in recent months. As
    well as allowing people to repurpose cheap gear like the M-VAVE it has also revealed
    that a lot of larger vendors have been outright lying to their users about hardware
    limitations to more effectively segment their target market. In my the future
    is high quality controllers&#x2F;converters with a generic SOC inside. Behringer
    is already going down this route and has the manufacturing heft to do it quickly
    and with a decent level of quality. Akai also seems to have jumped in on the trend.
