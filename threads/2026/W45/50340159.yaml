  text: "The avalanche of reverse engineered&#x2F;custom firmwares is definitely changing
    the synth landscape. I&#x27;m wondering how many other companies will start open
    sourcing. It isn&#x27;t always trivial since sometimes there&#x27;s proprietary
    software components or toolchains that can&#x27;t be open sourced. But it&#x27;s
    hard to imagine it won&#x27;t be more common. \nThere&#x27;s a lot of mixed feelings
    in the community. A lot of musicians don&#x27;t like AI, but they do want to have
    more features and bug fixes. A lot of synth makers are probably ambivalent too,
    especially if they have a stronger vision of what the synths should be that custom
    firmware ignore. Not to mention the commercial implications of adding features
    into existing synths, possibly making newer models less appealing. And of course
    people are copying UIs and workflows from other synths that took a lot of work
    to develop."
