  author: wdr1
  text: Respectfully, did you ever play tackle football?  I ask because it&#x27;s
    easy to look at something you&#x27;re not familiar with &amp; not see the value.<p>I
    played football in high school &amp; college.  Did I get hurt?  Yes.  But I also
    got hurt in other sports.  My worst injury by far was in baseball (it required
    ~22 stitches &amp; I couldn&#x27;t see out of one eye for a while).<p>With every
    activity there&#x27;s a tradeoff with risk.<p>Let&#x27;s say we take tackle football
    off the table.  We ban it from high schools, justifying it based on a study showing
    it produced 3.96 injuries per 1,000 practices or competitions &amp; 8.22 concussions
    per 10,000 (the highest for both).[1]<p>Okay, but then do we also ban woman&#x27;s
    soccer?<p>It&#x27;s the second highest, at 2.65 injuries per 1,000 practices or
    competitions and 6.11 concussions per 10,000.<p>Or why let our children take <i>any</i>
    risk?<p>As a parent, I know I can&#x27;t shelter my children.  They have to take
    some risk.  I let my children ride a bike, knowing full well there is a non-zero
    chance he could get by a car.  We live in a big city &amp; I let my pre-teen walk
    to meet a friend at a local burger joint for lunch, knowing full well there are
    bad people in the world who might do something untoward to him.<p>As for CTE specifically,
