article:
  url: https://www.planned-obsolescence.org/p/ai-is-dramatically-accelerating-ai
  title: AI is dramatically accelerating AI research right now
  fetch_status: success
  content: "# AI is dramatically accelerating AI research right now\n\n### If acceleration
    compounds, the naive extrapolation implies superintelligence within a year\n\n[\n\n](https://substack.com/@ajeyacotra)\n\n[Ajeya
    Cotra](https://substack.com/@ajeyacotra)\n\n_This post discusses a public METR
    report on AI R&D acceleration at Anthropic. I did not work on this project or
    see the unredacted report._[1](#footnote-1) _All opinions are my own and do not
    represent METR or the report authors.  \n  \nThanks to Ryan Greenblatt for discussion,
    feedback, and help with modeling, and Daniel Kokotajlo, Eli Lifland, and Hjalmar
    Wjik for comments._\n\nEarlier this week, [Anthropic stated in their S1](https://x.com/theobearman/status/2117277210570604945)
    that they “may imminently meet” the threshold of “dramatically accelerated progress
    due to AI” as defined in their Responsible Scaling Policy. In [their latest RSP
    (effective July 2026)](https://www-cdn.anthropic.com/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf),
    say this threshold will be met when:\n\n1. They observe or expect overall capabilities
    progress to be going twice as fast as the fastest sustained rate before AI was
    contributing much to AI R&D.[2](#footnote-2)\n\n2. This is plausibly attributable
    to AI automating AI R&D, rather than acceleration in compute or other inputs.[3](#footnote-3)\n\nFor
    the last few months, some of my colleagues at METR have been working on a deep-access
    investigation to understand how much Anthropic is being accelerated by its AI
    systems. **From my reading of [their report](https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/)
    and Anthropic’s RSP, it looks like the “dramatic acceleration” threshold has already
    been crossed.**[4](#footnote-4)\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!hcJn!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F40ef3251-b0ed-4ed8-bb5f-649bfccc7563_1880x1561.png)\n\nThe
    report authors found that:\n\n1. Between October 2025 and October 2026, capabilities
    progress at Anthropic has been going about twice as fast as it had been over the
    previous twelve months. The measurement they report is an internal version of
    the [Epoch Capabilities Index](https://epoch.ai/eci?view=graph&tab=release-date)
    called AECI; a wide range of other supporting evidence for acceleration has been
    redacted. They said that this redacted evidence was \"a majority of the evidence
    [they] found most informative.\"\n\n2. While the pace may have initially started
    picking up for a mix of reasons, AI automation is probably the large majority
    of the reason why capabilities are _still_ improving at this faster pace today.
    Their reasons for believing this have been redacted.\n\nThis is a much bigger
    deal than it might sound at first. I think this report is the most important update
    we have gotten about AI risk in the last couple of years — much bigger than [the
    Hugging Face attack](https://www.planned-obsolescence.org/p/the-hugging-face-attack-surprised).
    Naively, it points toward much shorter timelines than most external researchers
    (including [the AI 2027 team](https://ai-2027.com/)) have projected.\n\n# Researchers
    must be sped up a whole lot\n\nImportantly, **if AI**  **is roughly doubling capabilities
    progress overall, it must be speeding up human researchers by** _ **much** _ **more
    than that.**\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!AN_L!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7fbd709e-dadd-451e-b6b1-1018da098568_2048x751.png)\n\nResearchers
    work on improving algorithms and architectures; Anthropic has sometimes referred
    to these innovations as “compute multipliers.”[5](#footnote-5) Overall AI capabilities
    (“effective compute”) is the product of compute multipliers and training compute.
    Because the compute multipliers are only one input into capabilities, this means
    that if AI capabilities are advancing twice as fast overall because of software
    progress, the rate of growth in compute multipliers would need to be _more_ than
    twice as fast: perhaps ~2.5-3x faster based on reasonable assumptions.[6](#footnote-6)
    Since there’s uncertainty about the size of speedup and how much of it comes from
    AI, I’ll go with ~2-3x.\n\nSimilarly, researcher _labor_ is only one input to
    discovering these compute multipliers: they need to test their ideas, which requires
    compute for experiments. If we assume a very simple Cobb-Douglas model where experiment
    compute and labor are similarly important, that means the uplift to labor roughly
    needs to be the _square_ of the acceleration in compute multipliers.[7](#footnote-7)
    This would imply that we would need a (~2-3x)^2 = ~4-9x speed up in labor to make
    overall AI capabilities go twice as fast.[8](#footnote-8)\n\nHowever, once capabilities
    _start_ speeding up significantly, this also means that low-hanging fruit is plucked
    at a correspondingly faster rate. Each new compute multiplier takes more and more
    work to discover and implement (i.e., “ideas are getting harder to find”). Before
    there was much acceleration from AI, labor roughly grew at some roughly fixed
    exponential rate from hiring more humans. Combined with growth in compute, this
    compensated for diminishing returns enough to maintain the baseline rate of capabilities
    progress. But to maintain a new faster rate of capabilities progress without scaling
    compute faster, we would need a new faster rate of growth in overall labor.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!plX6!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1c28af7c-b5ee-409a-8151-438b756ee57f_2048x1248.png)\n\nSince
    the human labor force is stuck growing at more or less the old rate, the uplift
    from AI would need to get larger and larger over time just to sustain capabilities
