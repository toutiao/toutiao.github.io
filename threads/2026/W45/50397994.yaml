  author: calebkaiser
  text: I don&#x27;t fully get this line of argument. I am a massive advocate for
    open source... everything basically, but especially in ML. And open models are
    making incredible strides. But I&#x27;m not sure that models getting good enough
    for most tasks, making the absolute frontier models (Astra&#x2F;Fable class) unnecessary
    for most people, puts the frontier labs in a fundamentally disadvantaged position.<p>I
    mainly think this because frontier labs already try to compete at this tier. For
    example, 6.1 Sol has identical pricing to Kimi K3.1, but with a lower price per
    task due to Kimi&#x27;s verbosity. It seems to score roughly the same on most
    benchmarks, with some (like Artificial Analysis) putting 6.1 Sol significantly
    higher. If you need to step down, 6.1 Terra is also cheaper than K3.1 or K3 and
    performs well relative to their benchmarks. Opus 5.5 and much of Anthropic&#x27;s
    recent push seems to confirm this as a major area of focus as well.<p>I still
    use a lot of open models and harnesses, but I don&#x27;t know if cost competitiveness
    (at least not with the current crop of open models) will ultimately drive a huge
    chunk of average users away.<p>Things could change, but fundamentally, large labs
    aren&#x27;t precluded from training more cost effective models if there is significant
    demand for them, which is what we&#x27;re seeing now.
