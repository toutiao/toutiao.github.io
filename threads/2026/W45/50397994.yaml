  author: LeFantome
  text: Completely agree. LLMs are amazing for side projects.<p>The other place they
    are amazing is in working with legacy code bases. I mean, the kind the dev team
    always wants to throw away. First, even if you do want to throw it away, you can
    first find out what it does and realize it does more than you think it does. You
    can also create integrations to more modern components which can be used to extend
    it. You can also create a pretty decent test suite if you do not have one. And,
    once the behaviour has good test coverage, you can re-write it into something
    more modern. You can even completely change the architecture while ensuring compatible
    external behaviour. Remember, this is all in place of “throw it away and start
    over from scratch, only to discover that the scope is much larger than expected”.
