    then 8x, and then 16x, and so on.\n\nThe report authors were very uncertain about
    this question, and say that their picture changed several times with new information.
    But ultimately, **they did not find evidence of bottlenecks or steep diminishing
    returns that would get in the way of compounding acceleration.** [12](#footnote-12)
