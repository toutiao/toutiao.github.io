  author: atleastoptimal
  text: Counterarguments to that premise:<p>1. Intelligence per dollar spent&#x2F;token
    output seems to be increasing rapidly. Opus 4 was $15&#x2F;75 per million input&#x2F;output
    tokens when released. Opus 5.5, which is significantly better, is $4&#x2F;15.
    Sure it cost more money upfront to train Opus 5.5, or the bigger model (Fable
    5.5) which tuned it, but once it is reached, there are massive diffusive effects.<p>2.
    The capital equation is still favoring more spend. Anthropic&#x27;s revenue is
    growing rapidly and they are profitable on inference. Huge upfront spend for realized
    gains later on is standard for R&amp;D. As long as serving the models is profitable
    and generates more value than the energy&#x2F;compute consumed<p>3. The search
    space is too large to assume that improvement in AI assisted research is just
    models dumbly trying every combination until something works. For every additional
    bit searched, the space doubles, so even a trivially small combinatorial exploration
    incurs prohibitively large costs. Intelligent searching which continuously prunes
    that space along dimensions of effectiveness is not a trivial skill and is among
    the emergent accoutrements of these smarter models.
  score: 0
