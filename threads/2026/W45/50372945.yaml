  author: Uehreka
  text: Some of it has to do with Classifier Free Guidance (CFG), a math thing that
    makes it more likely for a diffusion model to follow what you ask for in the prompt.
    However, turning up CFG inevitably causes high contrast and certain other artifacts.<p>With
    that being said, my understanding of that issue is a few years old, people have
    always said CFG is a havk until models get better at following prompts on their
    own. So thee “look” that tools like Nano Banana ends up with could be something
    else. It may or may not be a necessary artifact of some part of the process.
