  text: This is not true. Think of the problems AI has with creating appetizing food
    imagery, for example. Images that every human annotator marks as unappealing with
    a high degree of consensus.<p>The problem is in the rewards, but it&#x27;s more
    how they average across domains and contexts, so AI misapplies them. Actually,
    in human preference evaluations, most of Gen Z in particular extremely adverse
    to the common look of AI images.<p>So it&#x27;s not the annotators involved in
    RLHF, it&#x27;s the models failing to map to human preferences at the task level.
    The failure rate is also uneven across domains.<p>Where there are challenges with
    human annotation, it&#x27;s not the ability to gauge what&#x27;s good but rather
    how to correct what&#x27;s wrong. Most people can tell when something is off but
    struggle to articulate why. That&#x27;s where more domain expertise is required.
