  author: minimaxir
  text: 'Using the grid trick for animations to generate the individual frames has
    been around for awhile and not specific to ChatGPT: I&#x27;m surprised it took
    this long for one of the official providers to make it explicit. However, adherence
    between frames is generally tricky, and even in the examples there is a lot of
    noise between frames although that could be due to compression.<p>SVG support
    is interesting but I suspect shenanigans are afoot since that&#x27;s not how image
    generation models work, and it would likely strip any SynthID watermarks. It&#x27;s
    possible OpenAI has pipelined a raster-to-vector tool that does the conversion
    automatically. (I developed a similar pipeline and it works <i>extremely</i> well;
    I&#x27;ll open source it at some point)<p>EDIT: Per documentation, there is an
    explicit `output_format: &quot;svg&quot;`, and I am indeed correct there is raster-to-vector
    in play:<p>&gt; The API creates a reference image and uses it to produce the SVG.
    The quality setting controls that reference image. Decode data[0].b64_json as
    base64 and save the resulting UTF-8 XML bytes with a .svg extension.<p>OpenAI
    claims 50% faster generation with Images 2.6 but curiously price is the same as
    Image 2.5.'
