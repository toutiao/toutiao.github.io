  author: miki123211
  text: People who make things often have an unrealistic expectation of how much users
    care about quality (and don&#x27;t realize how much users actually care about
    price).<p>We&#x27;ve seen this play out over and over again, in many different
    sectors. The whole shtick of the old (Bellhead) telecom world was quality at the
    (literal) expense of price, which didn&#x27;t work out well for them. Same for
    CD versus pirated mp3s, DVD versus pirated videos (and, to a lesser extend, theaters
    versus bootleg cam releases), native texting &#x2F; GSM calls versus WhatsApp
    and similar, mainstream newspapers and media versus blogging and social media,
    traditional electrical appliances versus Chinese-made, and so on.<p>Because of
    the innovator&#x27;s dilemma, In many cases, the cheaper, lower-quality product
