  author: bunderbunder
  text: 'That desperation narrative is illusory. Consumer demand is low and has been
    ever since this stuff stopped being a free fun novelty. And the only people who
    seem to be claiming AI demand is through the roof are the datacenter operators
    and frontier model vendors. But claiming high demand for your own products has
    been a standard part of the pitchman’s playbook for so long that we now have a
    term for people who will readily believe that sort of thing: “easy mark.”<p>So
    let’s not be easy marks. Let’s be a bit skeptical and look for some corroborating
    evidence. One obvious place is to check whether the AI market actually behaves
    like what we expect to see when demand outstrips supply. First and foremost, we
    would expect to see rapidly rising prices and very high profits for suppliers.<p>But
    we don’t see that. Anthropic and OpenAI are very much competing on price. Which,
    funny, is the opposite of what you would expect of companies that are supposedly
    struggling to keep up with demand. And apparently razor thin if not negative profit
    margins, too. Why is that? If demand is so high, then why are they keeping their
    prices so low it hurts? They aren’t running a charity here.'
