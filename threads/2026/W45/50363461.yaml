  author: WarmWash
  text: Payment is a compound of inputs.<p>I know this idea is over the head of probably
    75% of people, so forgive me if this is too dense to understand, but &quot;full
    payment&quot; is the sum of all forms of payment (usually a combo of data, ads,
    and money). The seller of a product&#x2F;service is the one who determines the
    payment component ratios, and the buyers decide if they want it or not. This applies
    to everything from streaming services, to app subscriptions, to TV sales.<p>So
    while true that you are giving money to Google, it is also true that you are paying
    the rest of the &quot;full payment&quot; with your data.<p>Google offers the option
    to pay the &quot;full payment&quot; with only money too. But often companies do
    not, and only offer other ratios of &quot;full payment&quot;.<p>Don&#x27;t feel
    bad for not grasping this, seemingly everyone else is unable to get it without
    having it spelled out.
  score: 0
