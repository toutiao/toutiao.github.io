  author: r_klancer
  text: 'I work with user data in Search and this is a common sentiment ... but I
    think it slightly misstates the purpose of using user data.<p>The <i>primary</i>
    purpose has always been improving search overall -- traditionally this has meant
    updating query interpretation, ranking, presentation, etc for smaller and smaller
    query slices (&quot;Ah, when we show the mayor and the population in response
    to  [Barcelona] people just revise their query to [Barcelona FC], so we should
    make sure to include latest match result on the top. Not so for [New York].&quot;),
    and running tests on every product change to see what people like. In this case
    nobody cares about any _individual_ user&#x27;s data, only the collective. This
    is basically the original &quot;collective intelligence&quot; contract of PageRank,
    albeit hillclimbing on billions of searches and clicks instead of using link structure.
    (Old question: does original PageRank count as machine learning, or not?)<p>Second
    is personalization -- things like &quot;Oh, my flight or my delivery is expected
    on date X, handy that gmail popped a reminder on my calendar, good work Google.&quot;
    Or searching for a restaurant in Maps and seeing results that are biased towards
    the kinds of restaurants you already like, that kind of thing.<p>When it comes
    to revenue the purpose of these isn&#x27;t to target ads, it&#x27;s just to have
    you get value from and use the product, and when you <i>are</i> ready to spend
    money this is where you come to search for the thing, whatever it is.<p>Finally
    there is <i>limited</i> use of a <i>limited</i> set of data for ads relevance.
    There&#x27;s higher CPC for ads you might actually be interested in (and if you
    <i>are</i> looking to spend money, is finding a willing seller who has compelling
    terms via an ad such a bad thing?) <i>But ad revenue is mostly downstream of users
    being satisfied with the core product and using it more</i>, whatever that product
    is. (Search, Maps, AI chat, etc)<p>(Bonus. My Search pro tip re: ads is leverage
    the modern stack and <i>spell out your intent</i> with a few more words when you
    query. We&#x27;re pretty good at <i>not</i> serving ads for non-commercial queries.
    But old-school super short &quot;searchese&quot; queries make it hard to guess
    whether your intent is commercial or not.)'
  score: 0
