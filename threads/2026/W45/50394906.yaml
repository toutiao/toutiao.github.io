  author: burnerRhodov3
  text: For sure, models definitely depreciate but so does CapEx. but you don&#x27;t
    include CapEx, you have an amortization schedule over it&#x27;s useful lifetime.
    However, when you start mixing CapEx and model depreciation, you get an interesting
    curve. As CapEx increases, model development is spread across multiple generations
    across that same CapEx. So, assuming you&#x27;ve amortized your CapEx, successive
    model generation eventually has a horizontal assimtote at OpEx and depreciation.<p>The
    real question is &quot;Are frontier training costs growing faster than the productive
    lifetime value of the GPU infrastructure used to create those models?&quot; Which
    is a hard question to answer and is something we&#x27;ll find out it early 2030.
