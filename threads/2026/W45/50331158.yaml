  text: IMHO, although Marxism has some good insights, it&#x27;s a very limited analysis
    of reality due to the necessity of framing things within a Hegelian framework,
    while at the same time ignoring, for example, the most recent peer-reviewed, reproducible
    discoveries in psychology and neuropsychology. That lack of the later causes all
    manners of misalignment when real people, and the whole psychological spectrum
    they comprise, have to intersect with that framework and its implications.<p>There
    are some kinda-ish modern, more nuanced versions of Marxism that may be more successful
    than orthodox variants in that. The Frankfurt School had some quite interesting
    developments there, such as incorporating Freudian psychology through Lacan, but
    that is itself already very dated by decades. Also, its approach requires abandoning
    or inverting many premises of orthodox Marxism, such as, for example, by accepting
    that in many cases it&#x27;s the superstructure that determines the infrastructure,
    not the other way around, so they exist in a tensional relation, which leads adepts
    of orthodox Marxism to call Frankfurtians revisionists and not to want to hear
    much more.<p>So I suppose a fully modernized Marxism incorporating everything
    modern human sciences has to offer could do reasonably well, but it&#x27;d be
    extremely different from both old school Marxism, as well as from the Frankfurtian
    revisions.
