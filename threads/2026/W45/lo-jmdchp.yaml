    This weekend I'm continuing to resurrect an old Samsung Galaxy Tab A 9.7 (SM-T555) from 2015.
    Last week I managed to install LineageOS 20 (Android 13) on it. Its last official update was Android 7, so most of the apps I wanted to use had stopped working.
    I'm running a completely debloated setup, with F-Droid as my main app store and Aurora as a backup. PipePipe for YouTube, Jellyfin for local media, Librera for books, and Fulguris for browsing. Just the essentials.
    My relationship with tech has changed a lot over the past few years. Everything feels increasingly soulless and samey, and somewhere along the way I lost the excitement I used to have for it.
    But playing with this old tablet reminded me of a time when I'd spend hours rooting phones, hunting down custom ROMs, I honestly can't remember when or why I stopped doing that.
    It's been surprisingly nice to rediscover a little of that old excitement. Even with its low pixel density and aging hardware, I've found myself using this eleven-year-old tablet more over the past week than my fancy 2026 Pixel.
