    Do you ever feel like we get too distracted by toy systems and local games instead of focusing on more important stuff? Lately I've been thinking about what are the most interesting questions that we could be asking.
    The most recent question I'm trying to understand is: what do we have wrong or what is missing in our current understanding of learning to make existing systems so inefficient? I've been reading the Sutton book on RL, and I'll probably continue doing that this weekend until I get bored. Should I read something else?
    Once my Claude weekly usage resets I'm going to continue some reverse engineering work. I think I should write down some of the lessons I've learned while doing this in order to help others, but it's unlikely the post will get written. In any case, since I'm already here one of the key lessons I've learned has been to adopt a scientific research journal style logbook. Each run proposes a question or hypothesis which it tries to answer before stepping back to evaluate if the path is worth continuing. This simple technique has served me well.
