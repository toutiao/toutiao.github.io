  text: 'Hi everyone - WorkOS CEO here.<p>WorkOS&#x27;s production systems are secure.
    No customer platform data was accessed. This incident was isolated to internal
    GTM systems.<p>The attack involved ARTEX, an autonomous AI agent framework used
    to carry out offensive security operations. It&#x27;s a striking example of how
    quickly the capabilities of attackers are evolving.<p>We&#x27;ve contained the
    incident, brought in independent experts to investigate, and are working through
    the details.<p>Security is something we take extremely seriously, and I believe
    in being transparent when things go wrong. We&#x27;ll continue to share updates
    as we learn more.<p>Here’s the full post: <a href="https:&#x2F;&#x2F;workos.com&#x2F;security&#x2F;bulletins&#x2F;october-30th-2026-data-security-incident"
