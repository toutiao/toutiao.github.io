  content: "# Introduction to Programming in ATS\n\n## \n\n### Hongwei Xi\n\nATS&nbsp;Trustful&nbsp;Software,&nbsp;Inc.\n\nCopyright
    © 2010-201? Hongwei Xi\n\nAs a programming language, ATS is both syntax-rich and
    feature-rich. This book introduces the reader to some core features of ATS, including
    basic functional programming, simple types, (recursively defined) datatypes, polymorphic
    types, dependent types, linear types, theorem-proving, programming with theorem-proving
    (PwTP), and template-based programming. Although the reader is not assumed to
