  author: NewJazz
  text: <i>musl’s crypt() returns the string * as an error indicator when the key
    is over 256 bytes long. * is also exactly what the stored field contains for every
    account with no password, so the “hash” matches and the login succeeds.</i><p>Does
    anyone know why musl does this? Are they the only C library that behaves this
    way?<p>For a C library that famously tries to adhere to POSIX as much as possible,
    this seems like a crazy choice. From POSIX standard:<p><i>Upon successful completion,
    crypt() shall return a pointer to the encoded string. The first two bytes of the
    returned value shall be those of the salt argument. Otherwise, it shall return
    a null pointer and set errno to indicate the error.</i><p><a href="https:&#x2F;&#x2F;pubs.opengroup.org&#x2F;onlinepubs&#x2F;9699919799&#x2F;functions&#x2F;crypt.html"
    rel="nofollow">https:&#x2F;&#x2F;pubs.opengroup.org&#x2F;onlinepubs&#x2F;9699919799&#x2F;functions&#x2F;c...</a>
