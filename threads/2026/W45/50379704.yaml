  author: sieve
  text: |-
    In the vast majority of programs, errors and non-results are irrelevant at the call site. You want to program for the happy path and not wrap every single call with error checking code or `try&#x2F;catch&#x2F;finally`.<p><pre><code>    h = file_open(path)
        data = file_read(h)
        file_close(h)
        return data
    </code></pre>
    is the code you want to read. This essentially is:<p><pre><code>    return file_open(path).success(h -&gt; h, file_read(h)).success(h, data -&gt; file_close(h); data)
    </code></pre>
    A language with thoughtful error handling primitives will support such code.
