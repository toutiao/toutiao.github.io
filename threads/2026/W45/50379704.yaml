  text: To be fair (as the sshole site mentions) it is also necessary to fake a password
    hash check to avoid timing side channels revealing to remote clients whether users
    exist, so returning a sentinel value is not a horrifically unreasonable solution
    to make sure even naive code does approximately the right thing.<p>Though I am
    surprised that all of the code examples do not use constant-time strcmp(). Actually,
    I wonder if even constant-time strncmp() would still leak information about whether
    the account is disabled because in that case both arguments are much shorter?
    Food for thought.<p>But yeah, the crypt(3) API is very 80s C, the man page even
