  content: "# _groff/troff_ macros: _ms_, _mm_, _me_ or _mom_\n\n[![](https://images.stephenlindholm.com/OAJgGwvL.jpeg)](https://www.stephenlindholm.com/picture_detail.html?md5=OAJgGwvLZMfhmaTJ4pabxw%3D%3D)\n\nThis
    is a brief explanation of how to choose which macro package to use with the Unix
    typesetting system _troff_ (or _groff_). I assume you are familiar with Linux
    or Unix.\n\nThe short answer is: use _ms_, unless you’re writing a novel (then
    use _mom_) or a structured document (then use _mm_—and find a good reference book
    for it).\n\n## What are _troff_ and _groff_?\n\n_Troff_ is the original Unix typesetting
    software. _Troff_ is not like a modern word processor, where the pages of your
    document appear on-screen just as they will appear on paper and you edit them
    with a mouse. With _troff_, your document is a plain-text file mixing text with
    embedded formatting commands. To see what your document looks like, you process
    the plain-text file with _troff_ to generate a PDF file, then open the PDF and
    check to see if you got what you wanted.\n\nAn example of a _troff_ formatting
    command is “`.ce`”, which centers the next line of text. These simple commands
    are called “requests.” The other kind of formatting command is called a “macro,”
    which is essentially a bundle of formatting commands. You could bundle together
    commands for indenting text, making the font bold and printing sequential numbers,
    all into a single macro. Then you could use this macro to automatically number
    and format the headings in your document.\n\nMacros help you separate formatting
    from text, which can make it easier to change the formatting or the text. If you
    decide that instead of indenting your headings, you want to center them, you could
    simply change the “heading” macro instead of manually changing the formatting
    of each heading in your document. Macros also mean that you can easily copy text
    from one _troff_ document into another. In a word processor, on the other hand,
    copied text will carry along formatting from the original document, and unless
    the two documents have exactly the same styles, you’ll probably need to reformat
    the copied text from scratch.\n\nOne of the greatest Unix programmers, W. Richard
    Stevens, used _troff_ to typeset all of his books. But even he agreed that _troff_
    is not easy to use, saying, “_Troff_ is an industrial strength package that I
    have spent years of my life learning.” But despite its difficulty, _troff_ can
    be more efficient to use than a word processor.\n\n- Technical writing can be
    faster because the entire _troff_ document is written in plain text, including
    the commands to make tables, diagrams, math equations etc. In a word processor,
    it might be necessary to manually construct diagrams and math equations using
    a mouse or to create them in a separate program altogether, which takes more time.
    This was W. Richard Stevens’ reason for using troff.\n- Reformatting a document
    is faster because it only requires changing a few macros. An author writing a
    book for publication will need to reformat the book several times, which can take
    an enormous amount of time in a word processor. This was the reason for Peter
    Schaffter, who created the macro package _mom_.\n- Having the entire _troff_ document
    in plain text makes it easy to parameterize in software. For example, it is easy
    to use _troff_ to create a batch of letters in PDF format for multiple people.
    Or, if you have written a computer program, you might use _troff_ to enable your
    program to print, without having to directly generate PDF files or rely on non-standard
    APIs.\n\n_Troff_ was created by Bell Labs in the early 1970’s and came with AT&T
    Unix for decades. But AT&T Unix is now almost completely obsolete, so you are
    not likely to find a copy of _troff_. Instead you are likely to find _groff_,
    which is a clone of _troff_ published by the GNU Project. Just about everything
    above also applies to _groff_ and from here I will only refer to _groff_ unless
    the distinction is important.\n\n## What are _ms_, _mm_, _me_ and _mom_?\n\nYou
    can, if you want, write a _groff_ document entirely from scratch. This would mean
    defining your own macros for headings, footnotes, bullet lists, and so on. But
    there is an easier way. There are standard macro packages, each with dozens of
    useful macros. Four of them are called _ms_, _mm_, _me_ and _mom_.\n\nBell Labs
    made the first macro package, _ms_, for internal use, writing technical papers
    and reports. It’s pretty easy to use and doesn’t have many weird surprises. You
    can mix up _groff_ requests and _ms_ macros, which is helpful if you have a clear
    vision for how you want your document to look. W. Richard Stevens used a customized
    version of _ms_ for the books he wrote. But _ms_ is more limited than _mm_ or
    _mom_, so you need to use _groff_ requests for even basic formatting such as numbered
    lists. The online documentation for _ms_ is adequate but not great.\n\nAt one
    time, Unix was the most advanced typesetting system in the world, using the _mm_
    macro package. This macro package is a lot more full-featured than _ms_. For example,
    it has numbered lists (in arabic numerals, roman numerals or letters) built-in.
    It also supports cross-references, which are essential for structured documents
    such as technical books. Unfortunately, _mm_ is a little less intuitive than _ms_
    and the documentation on the Internet for _mm_ is abysmal. However, there are
    excellent books on _mm_ from the glory days of Unix typesetting, which you can
    buy used for cheap.\n\nA developer at the University of California, Berkeley wrote
    the _me_ macro package in the 1980s. It is more complete than _ms_, but _me_’s
    creator has not worked on it for decades and the documentation is limited to two
    short papers written by its creator. I do not recommend using _me_.\n\nThe most
    modern of the four is _mom_, created by a novelist. It has advanced typographical
    features and is about as powerful as _mm_. It is designed for ease-of-use and
    has excellent online documentation. For many users, _mom_ is the right choice.
    However for some uses, it may be practically impossible to use _mom_, and it lacks
    a few specific features that _mm_ has.\n\nThere is also _man_, which you do not
    want to use for creating ordinary documents. It is used by the _man_ command to
    display _man_ pages.\n\n## Invoking _groff_ and _troff_\n\nIf you’re wondering
    why the names of the macro packages all start with “m,” it’s because the “” command
    line argument for _groff_ is used to choose the macro package, for example “”.
    The Bell macro packages are abbreviations for “manuscript” and “memorandum.” It
    seems that “me” is a joke name (as in, Eric P. Allman wrote it himself), and according
    to its home page, so is “mom” (meaning, it’s a friendlier macro package).\n\nTo
    invoke _groff_ on the input file _example.troff_, run “” (without a macro package)
    or “” (with the macro package ms). This produces a Postscript file. You may also
    have _pdfroff_ installed, which produces a PDF file instead.\n\nThe only AT&T
    _troff_ I have is the one from Solaris 11. It is more arcane to use. To invoke
    _troff_ on the input file example.troff, run “” (without a macro package) or “”
    (with the macro package _ms_). This produces a Postscript file.\n\n## A simple
    example\n\nIt can be a little tricky to start with _groff_, so here are simple
    examples using bare _groff_, _ms_, _mm_ and _mom_.\n\n| Plain _groff_ | _ms_ |
    _mm_ | _mom_ |\n| --- | --- | --- | --- |\n| \n\n    .sp 1i\n    Hello, world!\n\n
    | \n\n    .LP\n    Hello, world!\n\n | \n\n    .LP\n    Hello, world!\n\n | \n\n
    \   .PRINTSTYLE TYPESET\n    .START\n    .PP\n    Hello, world!\n\n |\n\nThe plain
    _groff_ file prints “Hello, world!” with a one-inch top margin (“`.sp 1i`” means
    “vertical space one inch”) and a one-inch left margin (the default). The rest
    of the page is blank. I’ve included this example so you can see that using plain
    _groff_ is a viable option for simple one-page documents. This lets you avoid
    the frustration that comes along with using the macro packages a"
