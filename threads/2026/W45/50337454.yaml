    a historical curiosity. Swedish Americans aren&#x27;t glued together in any meaningful
    way by a common identity, they don&#x27;t seek each other out to live near each
    other. Nor can you influence them by appealing to their Swedish heritage. By contrast,
    I have on multiple occasions gotten comped meals from hotel workers based on being
    Bangladeshi. Bangladeshis in the US and Canada feel real affinity for each other--they
    live in Bangladeshi neighborhoods, marry within their communities, etc. And you
    can influence them by appealing to their shared identity.<p>Irish identity is
    largely superficial today, but for a century it wasn&#x27;t. They lived in Irish
    enclaves, they did favors for each other based on shared identity, and they organized
    politically based on ethnic background, not ideology or issues. And that had real
    social and political consequences for the country for a long time.<p>Indeed, Americans
    underestimate how different Irish and Swedish Americans really are from Anglo
    Americans even today. Americans descended from different European countries remain
    quite different in fundamental attitudes (e.g. social trust, views towards saving,
    etc). And they still vote quite differently as a result. It&#x27;s also obvious
    just going around America. As a foreigner, it&#x27;s blatantly obvious which parts
    of the country was settled by Italians, Scandinavians, Germans, different kinds
    of British, etc."
