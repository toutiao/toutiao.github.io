  author: chaosharmonic
  text: First of all, that&#x27;s not <i>the</i> problem. AI companies are eating
    up so much of the economy and supply chain that your game console -- whatever
    it is -- now costs another $200. Crypto at least kept this limited to GPUs. They&#x27;re
    also openly advertising on billboards that say things like &quot;AI won&#x27;t
    ask for a raise.&quot;<p>Second -- as much as abuse of this program does happen,
    the problem is that they <i>aren&#x27;t</i> decent wages or working conditions.<p>The
    only requirements of this program are that you&#x27;re not paying <i>less</i>
    to a local employee -- which functionally means you can pay the same substandard
    wages to everyone, and then go to the government saying &quot;we can&#x27;t find
    qualified talent in our area.&quot; Much like a minimum wage employer with a &quot;NO
    ONE WANTS TO WORK&quot; sign, at a certain point it&#x27;s actually that no one
    wants to work <i>for you</i>... but we don&#x27;t put strong enough requirements
    in place for it to function more effectively as a way of filling talent shortages
    and less as a welfare system for the worst employers in your area.<p>The solution
    to this isn&#x27;t broad crackdowns, or obviously hostile nonsense like that $100k
    fee. It&#x27;s actually better labor protections -- longer grace periods so that
    you can leave an abusive employer, market rate pay, reasonable limits on overtime,
    and more scrutiny around other violations of stateside labor protections. The
    problem isn&#x27;t that specialized fields like tech still need visas to some
    extent, to attract talent at their hiring bar. It&#x27;s that there&#x27;s no
    validation that these are reasonable jobs that a reasonable person would accept.
    It&#x27;s that we shouldn&#x27;t prop up companies that can&#x27;t hire on their
    own merits, or enable large scale market manipulation to every part of our working
    conditions -- by giving them to companies that are 996ing, or that violate labor
    protections, or that openly talk about how you won&#x27;t be happy there if you
    value pay. Those things harm everyone, and lower our labor standards across the
    entire industry.<p>The problem across both is actually the same -- businesses
    that want to take shortcuts to get employees (real or otherwise) that won&#x27;t
    ask for raises, speak up about their other working conditions, or leave for something
    better.
