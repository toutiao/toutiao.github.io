    I'm exploring some newer hobbies more deeply while my partner is away for the week.
    Soldering & SBC electronics. I didn't have an electronics class in college 20+ years ago unlike some of my friends who went to schools with a robotics program or an EE class requirement. So, I'm brushing up on soldering skills that I've (re)learned a few times but never developed to the point they'd stick. Having used naught but a 20W basic soldering iron I bought the last day of business for my local Radio Shack ~10 years ago, I thought I was doing OK but struggled. Then friends at Code & Supply's Build Night let me use their more, uh, professional quality and safety tools, e.g. an exhaust fan, silicon mat for contrast, magnifying glasses, 0.5 mm solder instead of 1 mm solder, and things go so much better. So, having an income, I invested in these myself. It all arrived over the weekend, including some practice board projects. My first practical project is already "in production" : a soil moisture monitor powered by a Seeed Studio ESP32-C6. I've got a few more of those for some other projects. I picked up a LoRa module for one! I'm starting to eye some robotics work but am probably a ways off of building something meaningful there. Small, inexpensive project recommendations welcome.
