  text: |-
    This week I'll be posting in the weekly thread as a form of accountability vis-a-vis progress on my pet language and because I need to start writing about it but haven't really figured out what to say or how just yet.
    I recently got continuations, coroutines and fibers working, which was bafflingly easy[1], so I think I'll see if I can actually make use of fibers elsewhere. Probably decoupling the parser from its input port (you'll feed it bytes instead, and it'll yield if it can't pinch out a token yet, probably; I'm sure I've learnt this same decoupling lesson a dozen times before). This should reduce the number of special input port wrapper types (pure r7rs (the host language) is a little miserly with what you can do with them).
    [1] It's just a set of (mutable location, value) pairs with a special "swap" bytecode instruction that does what you might expect and returns a new set. It's otherwise generic but in this case keeps track of the program counter and call stack. The current continuation is just the current value of each; for (symmetric) coroutines the call stack is empty and the program counter points at the start of the given function; and (asymmetric) fibers are like coroutines but they also hold a "current fiber" location for yielding, which is neatly swapped alongside everything else, plus a "current error" for errors like in Janet fibers. I was a little surprised that it worked the first time it did, to be honest.
