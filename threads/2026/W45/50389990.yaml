  text: "&gt; Charts were generated by template so styling was consistent, making
    charts a bit more bland but easier to consume and check<p>This is why reading
    the whole post is important :)<p>You seem to think I&#x27;m suggesting the use
    an image generator for plotting. Don&#x27;t do that, it will screw that up, image
    models are not made for that. The use for AI here is to save 5 minutes writing
    the code to generate the plot, or to edit the style (again via code) of the plot.<p>If
    you do plt.scatter(x,y, c=&quot;blue&quot;, marker=&quot;o&quot;) that is a function
    call in Matplotlib. Its API notoriously sucks. Most Python plotting libraries
    just create convenience functions around this library because although the API
    (actually there are two and the documentation is not consistent on which to use)
    is hot garbage, and the documentation is labyrinthine, the plotting engine itself
    is powerful.<p>&gt; What llm do is to simply lower human value, not remove it
    entirely.<p>The value in a plot is not the exact code used to make it (beyond
    the code being correct). The value is in the visualization giving the reader an
    &quot;ah-ha&quot; moment. I would much rather take the 5 minutes I save writing
    a function call, and use it to spend more time examining the plot itself."
