    interesting algorithms and solutions. Moreover, it is extremely good at understanding
    complex scientific code bases, since it also understands the science behind it.  often
    use it to explain what some module does, to summarize scientific papers or to
    explain some concept I am unfamiliar with. Then it can be used to write down articles&#x2F;reports
    with plots and tables, to be refined manually at the end. Not to mention the time
    saved in debugging, probably its strongest point.
