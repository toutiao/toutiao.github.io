  author: lxe
  text: 'So you&#x27;re not wrong in most of these conclusions, however this is very
    surface level use case for these tools when it comes to scientific research.<p>&gt;
    I would never trust an AI to make a scientific conclusion, but they&#x27;re very
    good at some things<p>&gt; In this case, usually it will screw up and overfit,
    but it&#x27;s a good smoke test.<p>&gt; it&#x27;s being used for tedious things
    that provide some value<p>I see a lot of comments like this about AI use in general,
    and I suspect there’s a kind of learned helplessness combined with anchoring to
    earlier experiences. Someone tries a model, encounters a few failures, and forms
    a fairly permanent view of what these systems can do.<p>My concern is that people
    sometimes turn an expectation of failure into a permanent ceiling on how much
    they’ll even experiment with these tools. Their limited use then keeps confirming
    their limited expectations.<p>EDIT: This came off as criticizing the user, but
    this is entirely to validate my own thesis that for quite a long time nobody has
    been able to crack the usability challenge when it comes to non-coding knowledge
    work for these harnesses. It&#x27;s fascinating because it seems like it&#x27;s
    such an easy problem to solve, but in reality it&#x27;s a complex product problem.'
