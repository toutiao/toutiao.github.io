  author: StableAlkyne
  text: 'They are very good research assistants.<p>I would never trust an AI to make
    a scientific conclusion, but they&#x27;re very good at some things:<p>- Plotting
    with natural language: &quot;Create a scatter plot of column A versus column B,
    log scale Y and use stars sized by column C.&quot; Every plotting library (except
    maybe ggplot2 &#x2F; plotnind) sucks, and the boilerplate never gets less tedius.<p>-
    Literature search, e.g. &quot;Have there been any peer reviewed papers where they
    applied X method to Y domain&quot;<p>- Complex visualization, e.g. &quot;Make
    a self contained HTML file with a 3D interactive visualization of this graph.
    Add ball and spring position optimization and let me move nodes&quot;<p>- Trying
    random stuff that would normally be too time consuming to be worth it, eg &quot;Here
    is a dataset. Try regression methods A, B, and C and report a table.&quot; In
    this case, usually it will screw up and overfit, but it&#x27;s a good smoke test.<p>Note
    how in all of these, it&#x27;s being used for tedious things that provide some
    value, but ultimately they are only providing information to make a decision on.<p>Granted,
    I would <i>like</i> to have a research assistant I could train, but if your company
    will not create a position then there is not much you can do.'
