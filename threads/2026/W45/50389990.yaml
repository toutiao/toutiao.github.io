  content: "### \n\n_Johannes Hermle\\*, Ben Jones\\*, Lukas Althoff\\*, Ryan Heller,
    Thomas Lyttelton, Carolyn Stein, Nathan Wilmers, Maxim Massenkoff, Peter McCrory_\n\n_\\*Lead
    authors of the report_\n\n## Summary\n\n- **What we measure.** AI could speed
    up scientific discovery, but by how much depends on what AI can do and how scientists
    use it. Using privacy-preserving methods, we study 207,000 Claude and Claude Code
    research sessions to understand how Claude is used across scientific fields and
    research tasks. We are conducting this research to help the public better understand
    the state of AI for science today and assess the impact that AI may have on scientific
    discovery in the future.\n- **Where scientists use Claude.** Relative to the number
    of researchers in each field, Claude is used more in the formal sciences, such
    as computer science, mathematics, and statistics, and less in health and lab-based
    physical sciences. Scientists primarily use Claude to analyze data and to write.
    Data analysis alone accounts for about one-third of sessions on Claude and nearly
    half of sessions on Claude Code. Scientists use it less for idea generation and
    data gathering, even though, in an accompanying survey, they rank those tasks
    as the most important for scientific discovery. That said, specialized AI tools
    designed for scientific work could narrow the gap between the research tasks scientists
    use AI for and the ones they consider most important. On Claude Science, for instance,
    idea generation makes up about twice the share of use that it does on Claude.\n-
    **How Claude use tracks AI capability.** We create a measure of how well AI can,
    in theory, perform each research task. The tasks AI is best suited to (the top
    20% on this measure) get two to four times as much Claude use as the time researchers
    spend on them would predict. The tasks AI is least suited to (the bottom 20%),
    which include most physical work, get very little. We observe the same pattern
    across fields: fields where AI can perform many tasks well, such as computer science
    and statistics, use Claude more.\n- **What this could mean for the speed of scientific
    discovery.** Using a simple model, we explore scenarios for how much AI could
    speed up research. If existing AI capabilities are widely adopted, they could
    double research output in some fields. If AI could carry out all non-physical
    research work, output in fields such as computer science and statistics could
    rise as much as 15-fold, while output in bench sciences such as chemistry and
    biology, which are held back by physical bottlenecks, would rise three- or fourfold.
    In our survey of researchers who actively use AI, about 40% expect AI models to
    carry out full research projects on their own by 2030.\n\n## Introduction\n\nScience
    has been described as an “endless frontier” (Bush 1945). But how fast we explore
    that frontier has historically been limited by a scarce resource: the time and
    talent of human researchers. Artificial intelligence could ease that limit by
    amplifying what researchers can do, transforming both the process of discovery
    and the pace of exploration (Wang et al. 2023; Amodei 2024). Few applications
    of AI could matter more for human welfare. Given the highly cognitive nature of
    research compared with most sectors of the economy, AI’s effects may be particularly
    large and early in this domain.\n\nRecent examples show AI playing a growing role
    in scientific discovery. In structural biology, AlphaFold predicted the three-dimensional
    shapes of over 200 million proteins (Jumper et al. 2021; Varadi et al. 2024),
    and its creators shared the 2024 Nobel Prize in Chemistry. In materials science,
    GNoME predicted 380,000 stable new crystals (Merchant et al. 2023). In mathematics,
    researchers have used AI systems to help resolve decades-old Erdős problems, produce
    a potential proof for a Millennium Prize problem, and make progress on other major
    problems, from open conjectures to verifying landmark proofs (Anthropic 2026a,
    2026b; OpenAI 2026a, 2026b; Tsoukalas et al. 2026).\n\nBeyond these developments,
    most scientific progress involves many specialized, interlinked research tasks,
    which can vary substantially across fields. How much AI accelerates scientific
    discovery depends not only on AI’s capabilities, but also on how it is adopted
    across these tasks. In this report, we use privacy-preserving infrastructure to
    study the scientific use of Claude, Claude Code, and Claude Science. We document
    how usage varies across fields and tasks, identify what explains these usage patterns,
    and outline scenarios for how AI could accelerate research.\n\nClaude use in science
    varies by field. Relative to their number of researchers, formal sciences such
    as computer science, mathematics, and statistics use Claude more heavily, while
    health and lab-based physical sciences use it less. Across research tasks, scientists
    use Claude more for analyzing data and writing, and less for gathering data or
    generating ideas and hypotheses. This is consistent with self-reported AI use
    from an accompanying survey of scientists.\n\nTo understand these differences,
    we develop a measure of theoretical AI capability. Claude use is higher in tasks
    and fields that score higher on this measure. These also tend to be more cognitive
    in nature and better suited to reinforcement learning, in which AI learns from
    feedback on repeated attempts. In short, scientists appear to use AI where it
    works best.\n\nBased on these findings, we outline scenarios for how AI could
    accelerate scientific progress. With current capabilities, research output in
    some fields could as much as double, primarily from task-level augmentation. Researchers
    in our survey expect much greater capabilities to come. In a hypothetical scenario
    where AI fully automates all non-physical work, highly cognitive fields such as
    computer science or statistics could see up to a 15-fold increase in output. Because
    the fields with the largest potential for acceleration include those that produce
    AI itself, these gains could create an additional feedback loop, in which faster
    AI research produces more capable AI, which in turn could further accelerate research.\n\nWhile
    faster scientific discovery could bring substantial benefits to humanity, AI-driven
    research also carries risks and uncertainties. Less human oversight could lead
    to the pursuit of dangerous or unethical research. AI could also reshape researchers’
    careers, making research work more or less rewarding, and alter the sense of purpose
    associated with the human pursuit of knowledge.\n\n## How we conducted this research\n\nOur
    goal with this research is to measure the different ways scientists use Claude
    while protecting the details of their work. To do this, we use privacy-preserving
    infrastructure to analyze the scientific use of Claude on consumer plans. A language
    model, used here as a “classifier,” reads each session transcript and labels it
    with a fixed set of categories, such as the field and the research task it involves,
    according to a predefined taxonomy (SciNet taxonomy by Alamos and Althoff 2026).
    The resulting labels, such as “chemistry” or “data cleaning,” are the only information
    from these conversations retained and analyzed by the research team for this report.
    No classifier employed in this study extracts and stores open-ended information
    or details on research content, such as research datasets, hypotheses, experimental
    methods, early findings, or unpublished papers. Results are reported only in aggregate
    and only for cells that meet a minimum number of distinct accounts. All classifiers
    introduced in this study are listed in the [Appendix](https://www-cdn.anthropic.com/files/4zrzovbb/website/fafb3d4237f9b53fe114fef4fb5109b9cf5b5e60.pdf).\n\nOur
    measurement involves two steps. A first classifier identifies whether a session
    transcript involves scientific work. A second classifier then assigns each of
    these transcripts to a field, subfield, and task in the SciNet taxonomy. SciNet"
