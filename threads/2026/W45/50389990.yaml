  author: knottn
  text: 'Didn’t read your whole post, but the first point is wrong.<p>“Plotting with
    natural language: &quot;Create a scatter plot of column A ver….”<p>No, the tedium
    of boilerplate code was a feature. Charts were generated by template so styling
    was consistent, making charts a bit more bland but easier to consume and check.  You
    cannot achieve that same level of consistency or predictability with ai without
    reinventing a wheel. The models change too fast, and they all want to differentiate
    themselves for brand reasons, and the emphasis is on fast and easy, not on slow
    and foolproof, there’s no documentation of the work the way code provides documentation
    and an easy audit trail. You can restrict the ai by giving specs (use ggplot,
    use color template foo, create readable code with unit tests), but these are all
    similar tradeoffs as you might make with human labor too.<p>What llm do is to
    simply lower human value, not remove it entirely.<p>Just as results needed checking
    and replication before llm, they will continue to need checking and replication
    by humans. The humans won’t be compensated nearly as much, but humans are humans
    and so are not.'
