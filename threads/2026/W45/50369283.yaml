  text: I think the ISA bus was potentially capable of 9.5 megabytes per second on
    the original IBM PC 5150, but I don&#x27;t think the processor could come close
    to that. But I wouldn&#x27;t be surprised if it was over a megabyte per second,
    which would mean you could repaint a 4000-byte 80×25 screen in 4 milliseconds.  Clone
    CGAs would give you snow if you did that, though, so you had to limit your updates
    to the HBIs and VBIs, slowing the update speed visibly.  IBM&#x27;s actual hardware
    used dual-ported VRAM to avoid this problem.
