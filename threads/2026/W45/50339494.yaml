  author: kragen
  text: In the US, the IRS doesn&#x27;t see it that way, at least when it comes to
    fringe benefits as a part of employee compensation.  <a href="https:&#x2F;&#x2F;www.irs.gov&#x2F;businesses&#x2F;small-businesses-self-employed&#x2F;employee-benefits"
    rel="nofollow">https:&#x2F;&#x2F;www.irs.gov&#x2F;businesses&#x2F;small-businesses-self-employe...</a>
    says, &quot;In general, the amount the employer must include is the amount by
    which the <i>fair market value</i> of the benefits is more than the sum of what
    the employee paid for it plus any amount that the law excludes.&quot;<p>As an
    example, as I understand it, if a hotel chain allows an employee to stay in one
    of their hotels for free when they go on vacation, the tax value of that benefit
    is what they would have charged someone for that hotel room, not how much it increased
    the hotel&#x27;s costs to have one more hotel room full — which is generally almost
    nothing.<p>Of course, the IRS does agree with you when it comes to expenditures
    that are for the employer&#x27;s benefit, rather than the employee&#x27;s.  If
    it didn&#x27;t, almost all companies would have negative profits from the IRS&#x27;s
    point of view.
  score: 0
