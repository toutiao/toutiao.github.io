  author: AnthonyMouse
  text: IRS rules should <i>never</i> be used as an example of how accounting &quot;should&quot;
    work. They&#x27;re full of politics and the implications of the rules on tax avoidance.<p>Suppose
    a company could transfer an asset to an employee and have its value set as the
    employer&#x27;s cost. A company could make a bunch of volatile investments and
    see which ones pay off. Then the ones that go south get sold back into the market
    as a tax loss and the ones that do well get transferred as compensation to employees
    at the purchase price instead of the current value, reducing the tax liability
    of both the employer (no taxable gain) and the employee (less taxable income).
    What would happen if any employer could do that with any employee and any asset?<p>Conversely,
    there is a separate carve out for &quot;employee discounts&quot;, which is essentially
    the employer offering its employees its own products for something in the neighborhood
    of its own cost. Why? It&#x27;s not in any way a principled accounting distinction,
    it&#x27;s because it&#x27;s harder to use for tax avoidance at scale, because
    then a soap company can give its employees a discount on soap, but people only
    need a finite amount of soap and then the soap company can&#x27;t use it for cars
    and real estate and stocks.
