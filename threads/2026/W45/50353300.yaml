    where the market was going to be in one month.<p>So yeah, we can teach all kinds
    of stuff. But is it the right stuff? With one month of visibility, who can tell?<p>But
    now I feel like it&#x27;s settled down a little bit. And now I feel like I have
    more like 7 to 8 months of visibility. One thing that&#x27;s helped is that we
