       it&#x27;s neutral to somewhat good.

       I&#x27;ve  been hiring  CS  grads for  4  decades (yikes!)  and
       there&#x27;s  definitely  been  a   shift.   Not  all  existing
       programs are  bad.  Not all  young software devs  are bad.
       But...  the  percentage  of  recent  grads  that  seem  to
       understand  what data  processing  systems  are about  has
       definitely fallen.

       Us  old farts  in industry  must share  some of  the blame
       here.   Our industry  seems  to be  pretty  boom or  bust.
       Someone comes in with a stack of money and tells people to
       build { the web | blockchain | AI | virtual worlds | etc }
       and suddenly  there&#x27;s a  rush.  At the  start of  the gold
       rush, we&#x27;re not sure how  to build everything that&#x27;s going
       to be the next google [[1]] so we fill the room with young
       kids  who have  seen  some recent  tooling  and will  work
       cheap.   We  don&#x27;t  develop  them.  We  want  them  to  be
       compliant drones  dancing to  a tune played  by a  CTO and
       VP&#x2F;Eng who got their jobs  because they&#x27;re the children of
       the fund investors who gave the startup a bunch of money.

       And then  we go back  to Universities and tell  them &quot;OMG!
       Your not bar-raising your grads by teaching them __fill in
       the blank__!&quot; [[2]]

       So... I  don&#x27;t doubt  it looks like  AI is  destroying the
       degree.   But maybe  it&#x27;s just  making it  hard to  ignore
       previous problems with the uni to industry pipeline.

       And I didn&#x27;t  mention the Mythical Man Month  once in this
       comment.  I&#x27;m getting better.

       1. I&#x27;m not  sure too many people want to  be Google at the
          moment, but  over the last 25  years, they&#x27;ve certainly
          done well.

