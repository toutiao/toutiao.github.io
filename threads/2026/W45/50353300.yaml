    the question, what does the market want? It wants the expertise between junior
    and senior. And I&#x27;m confident it&#x27;ll want that for at least the next
    7-8 months.<p>Good luck cramming that into 4 years, though! I figure we have to
    try to bridge the gap as best we can. Eventually, seniors will become rare enough
    that the expense isn&#x27;t worth it. It&#x27;ll become better to hire cheaper
    most-qualified juniors.<p>There&#x27;s still some seriously open-ended questions
    though. How much does coding matter, for example? If you ask senior devs who don&#x27;t
    do any coding how much they rely on their coding expertise to make decisions,
    you&#x27;ll get a zillion answers across the spectrum. This becomes even more
    true for senior devs who use AI for coding. Heck, ask 100 devs if it&#x27;s important
    that you can even <i>read</i> code or not and see what comes out!<p>And then there&#x27;s
    the question of how do you teach those systems level thinking skills? Historically,
    universities haven&#x27;t taught those skills. You came out of the University
    with general problem solving skills in technology, and then at your job you were
    exposed to a small corner of the codebase to fix some bug. Gradually, over the
    years, you learn more and more of the codebase and become more and more senior.
    We have to get that into our curriculum. I&#x27;m working on that as we speak
    and will be working on that for the next several years, it looks like; even if
    my position vanishes, I&#x27;ll keep attacking it—this is a tough problem that&#x27;s
    fun to try to crack.<p>Anyway, I hope someday my forward visibility gets back
    up to 18 months. Won&#x27;t that be amazing. I&#x27;d also like to buy some RAM.
