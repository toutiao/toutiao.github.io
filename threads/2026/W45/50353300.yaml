  author: sublinear
  text: 'There&#x27;s two ways to grow the space of things to learn: breadth and depth.<p>You&#x27;re
    only thinking about new stuff adding &quot;breadth&quot;. I think most people
    would agree with you that new tools rarely have new use cases, so not truly adding
    &quot;breadth&quot;, but that&#x27;s where we get into &quot;depth&quot;.<p>When
    looking at long-term learning, there&#x27;s a lot of &quot;depth&quot; and subtlety
    in the way the existing tools work. There also comes a point where you have a
    firm grasp of all implementation details, but are unhappy with the ergonomics
    of the existing tools to do a particular job. What was an odd use case can become
    more common with time. This is how new tools and terminologies are born (adding
    &quot;breadth&quot;), but you have to remember there are always less experienced
    devs you need to communicate with. Their understanding will be based on these
    newer tools. Similarly, you spend the rest of your career &quot;catching up&quot;
    with the writings of the devs more experienced than you.<p>Why does any of this
    matter? Why don&#x27;t we standardize and end this cycle? Well, that would prematurely
    kill off innovation. AI training may be allowed to become stale, but human knowledge
    cannot. The goal is always to improve the existing code and the new code.'
