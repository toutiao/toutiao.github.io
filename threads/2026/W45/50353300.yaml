  author: rramadass
  text: 'Advice for every CS Student today:<p>1) Get the degree, do not drop out -
    In our society educational status signaling still counts and plays a good huge
    part in whether you can successfully get a job, do research, get tenure etc.<p>2)
    Learn AI to offload labour but not your brain - AI exhibits &quot;Jagged Intelligence&quot;
    and is &quot;Probabilistic&quot;. So you must confine it within explicit guardrails.
    Always have the &quot;Map of the entire Forest&quot; in your Head and have AI
    contribute only in constructing &quot;the Trees within the Forest&quot; and that
    too where you know the peaks of its jagged intelligence lie.<p>3) Focus on end-to-end
    Software Engineering and learn how to do everything yourself with no external
    dependencies other than AI. Specifically, learn to map Requirements -&gt; Formal
    Specifications and do Formal Verification against it. You need to become the overall
    &quot;Systems Engineer&quot; (as it used to designated in the old days).<p>4)
    In addition, use AI to learn about business functions viz. marketing&#x2F;sales,
    accounting, legal etc. so you can setup yourself easily as a OPC. This is your
    Nirvana.<p>5) Because AI can go deep in any one particular area, cultivating cross
    and inter disciplinary knowledge, studies, skills are more important today. You
    must truly build a &quot;M&#x2F;T&quot; shaped skillset.<p>6) Always keep in mind
    Grant Allen&#x27;s dictum viz. &quot;I have never let Schooling interfere with
    my Education&quot;. AI is an excellent Socratic dialogue partner to learn anything
    quickly. Practice Maieutic Prompting with AI so you can appropriately constrain
    it and accelerate your learning curve.<p>7) Never ever stop learning something
    actively (can be Mental, Verbal or Physical). The subject you are learning can
    be anything but the key is to do it with mindful self-effort. It has been shown
    that people who are curious, continuously learning and figuring things out for
    themselves keep their mental acuity well into old age.<p>PS: In order to motivate
    you, here is something for you to figure out and learn.<p><i>Set Theory&#x2F;Propositional&#x2F;Predicate
    Calculus - Curry-Howard Isomorphism - Lambda Calculus&#x2F;Simple Type Theory
    - CoC&#x2F;CIC</i><p>PPS: If you fully understand it, your professor will award
    you the degree immediately ;-)'
