  author: dahart
  text: I’m hearing this more and more from both students and teachers. It seems like
    everyone in education is frustrated and can’t figure out how to use AI for education
    productively yet.<p>TBH I’m also thinking about how to use AI at work for learning.
    (My work environment is 100% all-in on AI.) Everyone can see and admit that AI
    coding is making us lazier and that it produces too much code to do old-style
    line by line reviews. Some people are using agent teams to churn out millions
    of lines of code where there’s zero hope of reviewing it. We don’t yet know how
    to keep quality high and complexity low while doing agent coding, we’re just having
    them write lots of tests and hoping that when things break they’re easy to fix.
    Agents should get better at broad architecture in the future, but they’re definitely
    not there yet.<p>&gt; The amount of work involved has also tripled<p>This has
    to be one of the big ironies of using AI. I’ve heard this from other students
    too. The problem is that old-style assignments where the level of difficulty was
    hand-crafted is way way too easy for an LLM, therefore teachers need to crank
    the level of difficulty so the student has to actually spend some time on the
    assignment. But LLMs are getting better every month and the difficulty is so high
    that no students can possibly do the assignment by hand and now small errors in
    assignment design can lead to large errors in effort and time required.
