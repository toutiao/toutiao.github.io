  text: |-
    <p><pre><code>   File under &quot;old man yells at clouds.&quot;

       I think it&#x27;s worth asking what  a CS degree is for.  Is it
       to teach you how to  code and make you obviously hire-able
       by industry?  Maybe  it&#x27;s to teach you how  to think about
       data and code?   If you think it&#x27;s the former,  then AI is
