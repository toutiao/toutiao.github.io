  text: Ruthlessly optimizing isn&#x27;t the best goal, because people &quot;optimize&quot;
    all the quality out, and lack of quality leads to lack of sales and increased
    cost. Ford&#x2F;GM may have &quot;optimized&quot; their line for efficiency, but
    the increase in defects caused more losses. Companies that practice Lean tend
    to forget this and focus only on speed and cost, leading to enshittification.
    TPS focuses more on quality and its effects on lowering cost and increasing sales.<p>Toyota
    is also a good example of what <i>not</i> to do. Their lack of earlier research
    investment in EVs has led to being severely behind the market, in addition to
    their lack of focus on quality causing poorer sales (their quality used to be
    one of the only reasons to buy them). KIA basically stole their playbook by creating
    loads of good-quality cheap hybrids and EVs. Toyota could&#x27;ve had that market
    if the invested more ahead of time in research.<p>And that&#x27;s what&#x27;s
    happening with AI. While there are plenty of players now, it&#x27;s the ones that
    aren&#x27;t looking ahead that will be left behind. Nothing scales forever; when
    you hit the ceiling, you&#x27;re trapped in a box of your own making.
