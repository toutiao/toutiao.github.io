  author: Animats
  text: "Historically, that happens now and then. Examples include color television
    cameras and fluorescent lamp ballasts.<p>RCA developed the first good color TV
    cameras. They were monsters. Originally, electronic TV (as opposed to mechanical
    scanning) used Zworykin&#x27;s iconoscope. This needed huge amounts of light.
    It didn&#x27;t have a photo-multiplier stage                              to boost
    sensitivity, but it did accumulate charge from light over the whole frame time.
    There was an alternative approach, Farnsworth&#x27;s image dissector, which also
    needed huge amounts of light. It had a photo-multiplier stage but only the light
    from the dot currently being scanned by the scanning beam mattered.<p>So RCA threw
    money at the problem. They developed the image orthicon camera tube. It combined
    the advantages of both approaches, integration over a full frame and a photo-multiplier
    stage. It was insanely expensive, costing thousands of dollars in the 1950s. It
    needed about twenty different voltages and multiple independent power supplies.
    It worked reasonably well.<p>Then came color. That took three image orthicons
    (RGB) inside a box the size of a small refrigerator, along with optics to split
    the incoming image into three colors. Plus \na rack of analog electronics per
    camera, connected through a large cable. Plus an alignment problem from hell,
    with a huge number of adjustment knobs.[1]<p>Scaling worked! From the 1950s to
    the 1970s, color TV broadcasting was powered by those monsters.<p>Now, independent
    of this, other people were working on other approaches. Vidicons, silicon detectors
    inside camera tubes, and finally fully solid state image sensors. Eventually,
    in \n1983, after thirty years of image orthicon monsters, RCA produced a usable
    solid state camera. Today, a cell phone camera costs about US$10 in bulk, and
    it&#x27;s far better than the monsters.<p>It took thirty years of low-priority
    development to get past the giant image orthicon cameras.<p>Electronic fluorescent
    lamp ballasts had a different problem. That was a suppressed invention.\nThe magnetic
    ballast industry was dominated by Magnetek. Someone invented a solid state replacement,
    which was smaller and cheaper, and licensed their patent to Magnetek for royalties.
    Magnetek just sat on it, not wanting to gut their core market. The inventor hired
    Townsend, Townsend and Crew in Palo Alto and sued. (Read this in the law firm&#x27;s
    brag book in their office.) Eventually, the inventor got a hundred million or
    so, solid state ballasts went into production, and Magnetek seems to be gone.
    (The company called Magnetek today, which makes crane controls, is an offshoot
    of a Litton unit, and seems to be unrelated.)<p>There are also parallels from
    the steam locomotive industry, the Baldwin Locomotive Works being the best known.
    Baldwin actually built the first Diesel locomotive. They made a few half-hearted
    tries at Diesels over several decades, then gave up and went back to steam. Baldwin
    ceased all locomotive production in 1956. The corporation lingered on for a while,
    not doing much.<p>[1] <a href=\"https:&#x2F;&#x2F;www.tvcameramuseum.org&#x2F;rca&#x2F;tk40a&#x2F;pix&#x2F;rcatk40aart.pdf\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.tvcameramuseum.org&#x2F;rca&#x2F;tk40a&#x2F;pix&#x2F;rcatk40aart.pdf</a>"
  score: 0
