  text: TPS (and Lean, which it played a role in inspiring) is largely about finding
    what works empirically and ruthlesslessly optimizing around it.<p>It does (Lean
    at least) incorporate controlled experimentation, but tightly controlled with
    a both a laser focus on what the goal is and tight resource constraints. And Lean
    (at least several writers on Lean) favors taking multiple paths with a a quick
    and low risk and a longer-payoff, higher-risk, higher reward path for some efforts—one
    source used the US Navy’s two-path approach to SLBMs with Polaris and Poseidon
    as a model for this—but that&#x27;s different than “maybe there is something down
    this path” basic research, which is outside of the concern a production model
    like TPS&#x2F;Lean and often completely outside the model of a product-oriented
    firm; basic research is something firms consume and incorporate more than generate,
    because until the basics have been proven out, the rationally perceived chance
    of any particular avenue paying off is near zero for any firm.
