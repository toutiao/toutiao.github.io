  author: Loquebantur
  text: Suppressed inventions aren&#x27;t &quot;very rare&quot; per se. You simply
    don&#x27;t hear about those that aren&#x27;t being rescinded while the inventor
    is still alive.<p>According to official data from the U.S. Patent and Trademark
    Office (USPTO), there were 6,653 active secrecy orders in effect at the end of
    fiscal year 2026. Roughly 100 to 350 new secrecy orders are added every year.
    Many remain locked away for decades or more.<p>If the U.S. government puts a secrecy
    order on a patent application against the inventor&#x27;s will, they are legally
    forbidden from talking about it. The inventor cannot talk about how it works,
    publish research on it, sell it, or market it. They cannot even discuss the exact
    classified details with a regular lawyer unless that attorney has the proper security
    clearance.
