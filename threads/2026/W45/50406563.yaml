  author: AnotherGoodName
  text: This is true in every large company right now.<p>The transformer based approach
    is seen as a highway to race down in terms of training and building better models
    with minimal organizational distractions allowed while every company puts its
    foot down on this highway. Exploratory research into other AI methods is highly
    discouraged for now and organizations are encouraging transformer based scale
    out and iteration as a top priority.<p>As an example Meta literally fired it&#x27;s
    previously head of AI who held views that transformers won&#x27;t scale. He wanted
    to veer off the highway and heavily fund exploratory new types of models. They
    got someone willing to scale the current method out. Essentially the messaging
    it &quot;Foot down, there&#x27;s a straight highway ahead don&#x27;t divert&quot;.<p>I
    have the view this makes sense too. Current top models are mere (mere in big datacenter
    terms) trillions of parameters right now. We definitely haven&#x27;t hit the ceiling
    and everyone&#x27;s noticing &quot;Hey this Opus 5.5 with the increased parameters
    seems much better than the last one&quot;. Well that&#x27;s a trillion parameter
    model. We&#x27;ll soon start hitting 10&#x27;s of trillions and 100&#x27;s of
    trillions of parameter models. Unless there&#x27;s a ceiling which nobody expects
    they should keep scaling just as they have been. I really do agree that it&#x27;d
    be insane to veer off this highway with exploratory research at this particular
    point in time. Foot down, get to 10 trillion parameters, see if the scaling holds,
    if so off to 100 trillion parameters. If the scaling continues to hold we&#x27;ll
    be asking the AI to do the exploratory research for us soon enough.
