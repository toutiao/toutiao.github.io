  author: eszed
  text: "&gt; Maintaining an audit trail for cold chain management<p>It&#x27;s this,
    primarily, or most importantly.<p>I work in the restaurant industry. Health departments
    require you to assure them that your hot things are kept hot and your cold things
    are kept cold. The old way was staff walking around the store reading thermometers
    and writing temperatures down on paper; the newer way was your staff walking around
    the store inputting temperatures on an iPad connected to your business-management
    software. The trouble with that is that staff forget to do it (despite threats
    of discipline, and push notifications to their phones), or even blatantly fake
    it.<p>Failing to keep an accurate temperature log means fines, and other consequences,
    up to and including loss of your health license. I am 100% in favor of this legislation,
    and solid enforcement of it. The main improvement I would make is to harmonize
    codes and enforcement across municipalities. I&#x27;m in the USA, every county
    has their own requirements - and their own &quot;portal&quot; for submitting documentation.
    It&#x27;s a massive pain in the ass to write Standard Operating Procedures for
    staff across multiple stores in multiple enforcement districts when there simply
    <i>aren&#x27;t any</i> SOPs.<p>The majority of the fines our (responsible, and
    genuinely trying-to-do-it-right) company received were things like a staff member
    moving from a store in County A to a store in County B - just for a few days,
    to cover someone&#x27;s PTO, or something - and inadvertently followed County
    A&#x27;s logging requirements rather than County B&#x27;s. Two genuine cases:
    logging every two hours, instead of every ninety minutes; using whole degrees,
    instead of tenths. We could appeal, but that takes a lawyer&#x27;s time, so even
    if successful it wasn&#x27;t always worth it.<p>Real-time data, from connected
    sensors, is unambiguously better. Staff get <i>loads</i> of time back, to make
    food, or help guests; all the logging gets done &quot;right&quot;, for whatever
    jurisdiction; data&#x27;s held by a third-party, so nothing can be faked.<p>That
    said, we&#x27;re not connecting our infrastructure to the internet! We have a
    separate IoT sensor service that tracks the temps for us. I&#x27;m sure their
    security is also terrible, but that doesn&#x27;t matter nearly as much. A year
    of their service is ~80% of the &quot;routine&quot;, and totally innocent, fines
    and other costs that we were previously paying. That&#x27;s the way all of these
    stores should go, in my opinion."
