  author: cucumber3732842
  text: My point, which will inevitably be straw manned to hell and back, is that
    a large part of the reason these systems all came about is to cheaply satisfy
    externally imposed requirements (save energy, facilitate audits, remove responsibility
    from store employees, etc, etc) that the peanut gallery (and more concerningly,
    real people doing real work deciding things) cheers for when examined in isolation.<p>Requirements
    in the food industry come not just from government rules and suggested best practices
    (that are more than suggestions in practice) but also indirectly as a result of
    requirements imposed by insurers, financiers and trade groups.  In response to
    this companies that run supermarket chains or manufacture major brands of food
    have not quite the same verbosity but certainly comparable degrees of retention
    in their record keeping as medical and aviation.<p>This monitoring and control
    is increasingly centralized in response to all these requirements because it&#x27;s
    most efficient that way.  If you&#x27;re gonna have one guy in an office deciding
    things you might as well automate away the middle man and have him set them too
    and let the people on the ground spend more time doing their core work.<p>If fifteen
    of the twenty thousand dozen systems (pulling that number out of my ass FYI) in
    an industry are being centrally controlled through computer systems it&#x27;s
    inevitable that some of them wind up off the VPN and this happens.  It&#x27;s
    just a natural tradeoff or risk you run when doing that and it&#x27;s completely
    foreseeable.<p>But the internet peanut gallery will not generally have any sort
    of adult discussion about these tradeoffs because &quot;we saved X (maybe X is
    money, maybe energy, who knows, who cares) by operating the fridges more centrally&quot;
    is a nice easy win for them and rather than have a discussion about subjective
    and hard to pin down long tail risks it&#x27;s easier to just screech about &quot;we
    should fine the people who did it wrong&quot; or whatever when one of those long
    tail risks rears its ugly heads.
