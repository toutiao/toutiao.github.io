    audit trail proving that a frozen fish has been kept below -30oC since it was
    processed on a ship all the way up to point of sale in a supermarket).<p>- Refrigerator
    manufacturer says a condition of warranty is that the refrigerator must provide
    remote telemetry proving some warranty condition has been met (e.g. regular cleaning
    cycle operated).<p>Note: all these speculated reasons are unidirectional data
    flows. So even if a valid reason exists for Internet connectivity, why can&#x27;t
    it be limited to unidirectional data flows?'
