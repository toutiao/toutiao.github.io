  author: swatcoder
  text: "&gt; You can just prompt your AI agent to &quot;avoid sounding like AI.&quot;<p>It&#x27;ll
    never work like that, because everybody else giving that same direction will get
    more or less the same result, which will itself come to be recognized as sounding
    like &quot;AI`&quot; for any popular model+harness.<p>What you&#x27;ll always
    need to do is instill your AI with some idiosyncratic voice that distinguishes
    it from others, which you can achieve in a variety of ways (stylistic direction,
    audience characterization, style mimickry, personalized finetuning, etc). Presumably,
    tools for doing this will eventually make it into the harness products but anybody
    who doesn&#x27;t use them is <i>always</i> just going to end up generating recognizably
    AI slop prose. It&#x27;s the nature of the technology.<p>A secondary consequence
    (even if you just use &quot;avoid sounding like AI&quot;) is that because the
    technology works its magic mostly through prose-streams in its own voice, these
    idiosyncratic voice changes will also nudge its behavior away from benchmark norms.
    You won&#x27;t necessarily lose capability on any given task (you may even gain
    on some), but <i>external</i> reference points&#x2F;measures about its capabilities
    will become less applicable."
