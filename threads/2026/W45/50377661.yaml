  author: beloch
  text: 'Building a reactor was a step on the way to building a bomb.<p>Two isotopes
    were used for fission bombs in WWII:  Uranium 235 and Plutonium.  More than 99%
    of naturally occurring Uranium is Uranium 238, which will not sustain a chain
    reaction necessary for a bomb.  There are only trace amounts of Plutonium in nature,
    but it can be produced in reactors that use U238 for fuel.  So, to make a fission
    bomb you need to either separate U235 from U238 or build a reactor to create Plutonium.<p>It&#x27;s
    worth noting that the shortage of heavy water was no accident.  The Allies sabotaged
    the heavy water production facility in Norway that Germany relied on[1].<p>________________________<p>[1]<a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Norwegian_heavy_water_sabotage"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Norwegian_heavy_water_sabotage</a>'
