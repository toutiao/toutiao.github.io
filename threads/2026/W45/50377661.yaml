  author: defrost
  text: In general the take was that human created nuclear weapons were infeasible
    (regardless of design) because of what was thought to be the barrier to cross
    to achieve a chain reaction.<p>The Frisch–Peierls memorandum changed that understanding
    ... provided that reading of the FP-memorandum was convincingly conveyed to people
    that made things happen, what Einstein put to paper (and was ignored) and that
    Oliphant pushed through in person.<p>Little Boy on Hiroshima was a gun design,
    a grossly inefficient McGyver that used some 64 kilograms of enriched uranium
    to successfully convert less than half a gram to energy.<p>Fat Man on Nagasaki
    was an implosion device - a necessary design change due to simply not having enough
    uranium or an enrichment pipeline to sustain the needs of a gun design.<p>The
    first device detonated, at Trinity in the USofA, was an implosion device, created
    to test the more difficult design.<p>Further, there was an abandoned &#x2F; discarded
    &quot;Thin Man&quot; device IIRC.<p>These were all alternative implementations
    that were pursued after the FP-memorandum was pushed about to make the case that
    weapons were apparently <i>possible</i> rather than not yet achievable - the prevailing
    belief in the US prior to Oliphant doing the rounds.
