  text: Little extra fun fact since Norsk Hydro was mentioned in the article and now
    you&#x27;ve mentioned it again-<p>Norsk Hydro was founded as a hydro power plant
    + nitrogen fertilizer production company (the nitrogen production needing lots
    of electricity, and the hydro plant to provide said energy...) but around WWII,
    pivoted to light metals, and built aluminum and magnesium factories with German
    company IG Farben, in order to support them in the war, as they were partially
    under Nazi occupation by then.  That all went south but then after the war they
    kept on with the aluminum business.<p>The company went on to become experts in
    aluminum extrusions, and were then contracted not just for the base metal but
    also to manufacture the first bonded aluminum bare chassis for the S1 Lotus Elise
    in 1995, which went on to be the basis for the Tesla Roadster.
