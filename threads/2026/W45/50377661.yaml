    lie.<p>Your fighter pilot anecdote sounds like Hollywood: Good US boy scared to
    death by insane fanatical Japanese cranks up a lie that is then believed by the
    highest state leadership, alright… We can smell the propaganda here, can&#x27;t
    we.<p>What defrost said wrt Alperovitz sounds very reasonable:<p>• Japan already
    defeated – FACT<p>• Japan had been sueing for peace (since around May, I think)
    – FACT<p>• real reason for &quot;The Bomb&quot; was to impress Soviet Union (and
    the world at large, I think) – FACT<p>• &quot;The Bomb&quot; only an excuse for
    emperor, real reason was Manchuria – arguable&#x2F;doubtful, but not important;
    key is points 1 and 2<p>Now, in his book &quot;Hiroshima revisited&quot; (free
    PDF available), Michael Palmer takes a scientific look at the Hiroshima and Nagasaki
    evidence and concludes that it does not support the notion conveyed by US propaganda
    that a novel &quot;atomic bomb&quot; was used.†<p>Rather, it appears these cities
    were democratically firebombed like dozens of other Japanese cities, using napalm,
