    fact, the forensic evidence (medical, physical and other) totally and absolutely
    contradicts the notion that any extraordinary weapon such as the &quot;atomic
    bomb&quot; was used.<p>But there was more than napalm (a heinous weapon) that
    was dumped on Hiroshima and Nagasaki (like on dozens of other cities before).
