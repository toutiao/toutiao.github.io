  author: addaon
  text: "&gt; Which is why many systems on most airliners are redundant in threes<p>Not
    really. Triplex redundancy is based on a failure model where failures can produce
    arbitrary output. Three systems allows majority voting (often, median select)
    to provide correct output in the presence of a single arbitrary failure. It allows
    detection of double-fail-silent failures and uncorrelated double failures, but
    that&#x27;s not really the point, since continued operation under these conditions
    is at risk, and failing nonoperational isn&#x27;t often acceptable for these systems.
    (You&#x27;ll also see quadruplex systems that use the same voting mechanism to
    detect and disable failed channels, allowing handling two arbitrary non-simultaneous
    failures, for systems that need a longer window of continued operation after failure.)<p>If
    you change the failure modes, you change the architecture. These days you often
    see dual-dual systems where each pair of systems cross-checks and disables itself
    on mismatch, converting a single arbitrary failure to a single silent failure;
    which then allows downstream systems to accept inputs from two such fail-silent
    systems and trust either that is providing output, removing the need for a median
    select."
  score: 0
