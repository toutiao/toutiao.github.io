  author: Jtsummers
  text: 'I&#x27;ve worked on systems this decade that still relied on floppy disks.
    It&#x27;s getting harder and harder for them to operate because the disks are
    getting rarer, as are the drives. And often the essential component is not the
    disk itself. There are some other computers in the system that cannot be upgraded
    to any more recent device, systems from the 1980s and 1990s that force them to
    continue using a floppy disk.<p>If it was just two modern computers and transferring
    data between them, the floppy disk would have been dropped in a heartbeat. But
    it&#x27;s the old computers still in the critical path that are holding everything
    back. And those are <i>really</i> hard to maintain. Last year we phased out a
    system that was dependent on computers from the mid-1990s, getting replacement
    parts was practically impossible, they mostly just don&#x27;t exist. You&#x27;d
    buy old systems off ebay and hope that they had enough working parts to scavenge,
    and the <i>right</i> working parts.<p>EDIT: Light editing because I had some extra
    words.'
  score: 0
