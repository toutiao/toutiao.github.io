  author: drak0n1c
  text: Systems are dynamic, not static. There are secondary consequences and forgotten&#x2F;ignored
    opportunity costs. Sure, the existing system has proven workarounds, though labor
    and attention intensive. When a floppy disk fails it won&#x27;t directly create
    disaster. But these legacy requirements do block the more cohesive and thorough
    introduction of additional safety mechanisms that increase redundancy and reduce
    the scope of possible human error - such as new sensor hardware and their automation,
    latency improvements, and information synthesis&#x2F;notification clarity.<p>Here&#x27;s
    a software analogy - required support for very old OS versions often interferes
    with the scope, simplicity, and security of new feature work, and even if the
    work is still feasible at that point it is slowed down greatly, eating up attention
    and time that could go towards addressing other important issues. That accumulates
    over time, and cumulative loss of improvements that could have otherwise been
    made has a real effect in unprevented disasters and wasted controller availability.
