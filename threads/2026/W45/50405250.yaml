  author: Bender
  text: 'My advice is not specific to Matrix but other self hosted private services.  Some
    of this may or may not be feasible with Matrix. <i>(I have never used Matrix)</i><p>-
    Whether family or friends, always suggest it as a &quot;fallback&quot; for when
    &quot;preferred service&quot; is down and to use when discussion ultra-sensitive
    topics or sharing financial files.  With time they may just stay connected to
    it if the friction to do so is low.  It has to be their choice, not yours.<p>-
    What helps?  Add more incentives such as perks that &quot;preferred service&quot;
    does not offer.  No file size limits.  No or few file type limits.  No content
    filters.  Add emoji&#x27;s or gifs that align with their inside jokes and their
    style of humor.  Keeping random people away is very important.  Making your friends
    and family administrators or moderators and let them decide how it operates.  Do
    not moderate or power-trip over your friends or family or they will leave.  Limit
    rules to &quot;Do not break the laws of this country in public chatrooms&quot;
    <i>and private chat rooms if you do not physically host the server</i>.   Database
    and file backups become even more important but they will feel in control of a
    thing.  Have a keyword or code word they all learn means to go check the private
    platform that &quot;primary platform&quot; would not recognize.  Maybe when they
    see &quot;Turtle Farts!&quot; they know to go log into your service.<p>- They
    may just stay on their primary preferred service.  Every group is different and
    not every group will see the benefits of your fallback service.  They may not
    appreciate the work you put into setting it up for them.  Do not expect to get
    the friends of your friends and family to move to your service.  They may not
    appreciate the OpSec value until &quot;Bad Things&quot;(c)™2038 happen to enough
    people.  Just be there for when it does.<p>- If there are concerns that you would
    spy on them, consider instead using eJapperd or Prosody as you can implement OMEMO
    for individual and group end-to-end encrypted messages.  Set up TLS fingerprint
    checks from multiple locations to reduce the risk of MitM attacks until XEP-0474:
    SASL SCRAM Downgrade Protection is fully supported and active by default on both
    servers and all clients.  This is the only thing holding me back from setting
    up a public Prosody server as 0474 is still experimental.  <i>See [1]</i><p>-
    Avoid <i>(block)</i> federation on private servers for friends and family otherwise
    it is not a private server.<p>[1] - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=37955264">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=37955264</a>'
