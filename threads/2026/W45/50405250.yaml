  author: Bender
  text: |-
    Not the person you are asking but countries rarely block the internet <i>for real</i>.  War torn countries will immediately block full MTU packets <i>(bulk traffic packets, this will block streaming services)</i>, known social media platforms, known chat services.  It will appear down.  Cloudflare stats will give the appearance of being down but small unknown chat platforms may work for a little while.  SSH may work even longer as they need SSH <i>and even telnet</i> to continue to manage infrastructure.  That&#x27;s why I keep an SSH chat server around.  Feel free to play around with it. [1]  When sharing with a person in a war torn country, give them the IP not the domain name.  There will also be networks that allow leaders to bypass the <i>&quot;blocks&quot;</i>.<p>[1] <i>(customize username, paste into terminal, then type &quot;chat&quot;) .:.  This is a hardened private fork of devzat.  shout-out to quackduck if he still logs in here.</i><p><pre><code>    chat() ( saved=$(stty -g 2&gt;&#x2F;dev&#x2F;null); trap &#x27;stty &quot;$saved&quot; 2&gt;&#x2F;dev&#x2F;null; printf &quot;\033[?2004l\033[0m\033[?25h\033&gt;&quot;&#x27; EXIT INT HUP TERM
         [ -f &#x2F;tmp&#x2F;dc ] || ssh-keygen -qt ed25519 -f &#x2F;tmp&#x2F;dc -N &#x27;&#x27;; ssh -p 443 -i &#x2F;tmp&#x2F;dc -oIdentitiesOnly=yes anon@dropchat.net );
    </code></pre>
    <i>Useful commands to start with are &quot;help&quot;, &quot;cmds&quot; and &quot;rest&quot;. There is no censorship.</i>
