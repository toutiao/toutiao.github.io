  author: toast0
  text: Adding on to Bender&#x27;s post, most of the blocking I&#x27;ve seen happens
    at consumer oriented ISPs. Sometimes the regulator only asks mobile carriers,
    so residential wired internet still works fine. Sometimes they&#x27;ll get residential
    and mobile, but not offices. If there&#x27;s in country servers&#x2F;datacenters,
    those might not have filtering and also be reachable domestically.<p>It really
    depends a lot on what&#x27;s going on that they want to block. Making it hard
    for people to do X is often good enough. For some things, making it unreliable
    is more effective than a complete block, because a complete block leads people
    towards circumvention but unreliability can push towards local alternatives instead.
