  author: MattJ100
  text: 'Thanks for the feedback!<p>Yeah, no web client yet, but we&#x27;re working
    on a web app (it exists already, but doesn&#x27;t do end-to-end encryption fully
    yet, also no video calls). My primary use case for Snikket was displacing things
    like WhatsApp where web usage is (in my experience) rare, so the focus has been
    on mobile apps.<p>Circles - yes, you got it. Initially we launched without circles,
    and some people complained they couldn&#x27;t invite friends to their server without
    those friends mixing with their family members by default. I wasn&#x27;t sure
    at first, but now even use this feature myself for e.g. a &quot;Games night&quot;
    circle. You can read more about the feature here: <a href="https:&#x2F;&#x2F;snikket.org&#x2F;service&#x2F;help&#x2F;features&#x2F;circles&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;snikket.org&#x2F;service&#x2F;help&#x2F;features&#x2F;circles&#x2F;</a><p>And
    yes, I totally get what you mean about the web dashboard. We&#x27;re toying with
    replacing it at some point (partly because the backend is Python, and it uses
    over 2x the RAM of the chat server when idle!).'
