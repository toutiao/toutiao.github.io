  text: If you want to save fewer bucks, get to zero plastic and get better espresso,
    you can buy one of these and a burr grinder:<p><a href="https:&#x2F;&#x2F;flairespresso.com&#x2F;products&#x2F;the-flair-classic"
    rel="nofollow">https:&#x2F;&#x2F;flairespresso.com&#x2F;products&#x2F;the-flair-classic</a><p>I&#x27;ve
    had one for about a decade.  It reliably produces better espresso than &gt;99%
    of Bay Area coffee shops.  (&gt;95% if you exclude national chains).<p>If I were
    buying one today, I&#x27;d toss the flow control head, silicon sleeve on the cylinder
    and the pressure gauge, but those come with it for free now, so to each their
    own, I guess.<p>The trick is to boil the stainless steel cylinder in your kettle
    (PID at sea level, conventional above ~ 2000 ft elevation) with the water so that
    you get the temperature dialed in within a degree C or so, like a conventional
    (lead-filled, unlike the flair) Italian machine.  I use a pair of tongs to pick
    up the stainless steel cylinder, so I don&#x27;t need the sleeve.  (Check the
    boiling point of water at your elevation -- unlike a steam machine, this can&#x27;t
    exceed that temperature, so stuff might start to run kinda cool at 3000 ft or
    so).<p>Flair doesn&#x27;t sell a &quot;true&quot; classic anymore, but I bet they
    could get the bare bones variant I use to &lt; $100 if they tried.  Maybe someone
    else will when any patents run out.  My only other complaint is that the two-in-one
    bottomless porta-filter I have runs the espresso across plastic when in non-bottomless
    mode.<p>Note that the thing I linked has a plastic plunger.  They make a stainless
    steel one as an upgrade.  At that point, you&#x27;re down to one silcone o-ring
    in the water &#x2F; coffee path.  Everything else is stainless, so no lead.  The
    next thing to worry about is nickel, but that only matters if you&#x27;re allergic.  I
    used to use the SS plunger, but then you need to boil it too if you want to dial
    in the water temperature.
