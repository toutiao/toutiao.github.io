  author: goodmythical
  text: 'I don&#x27;t think it&#x27;s that bypassing enjoyment is trivial.<p>It&#x27;s
    that enjoyment is a secondary function to contentment and the user is allowed
    to pursue this secondary function according to their own desires. It is just that
    we often aren&#x27;t taught the value of or the techniques involved in finding
    enjoyment.<p>Consider a professional athlete, a recreational league player, someone
    who watches their favorite team, and a team manager.<p>They are all engaged in
    their activities, originally, because of some enjoyment derived from the game.<p>But
    how often does each of them enjoy playing the game?<p>The recreational player
    probably gets more fun out of playing the game than the ones who choose to watch,
    even if they played in highschool.<p>When was the last time the player enjoyed
    the ritual of watching a game they aren&#x27;t involved in?<p>The one who goes
    to every game probably gets more enjoyment from watching the game than a player
    on the sideline.<p>How often does a player enjoy arm-chair calling another game
    as opposed to a manager?<p>But, what happens as we age or in the face of injury?
    We learn to adapt to enjoying other aspects of our favorite activities. We do
    so because we are forced to without realizing that we could have been enjoying
    watching the game just as much as we do now post-injury.<p>We see this in streaming
    and video games: People who watch endless hours of games they&#x27;ll never play,
    and streamers who never watch others play.<p>We see this in labor. As the buddhists
    say, &quot;Before enlightenment; carry water, chop wood. After enlightenment;
    carry water, chop wood.&quot; Do what you love and you&#x27;ll never work a day
    in your life, in other words.<p>The difference between a miserable manager and
    a jovial janitor is their ability to find enjoyment.'
