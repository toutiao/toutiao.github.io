  text: Scored 100% on a Pangram of the first few paragraphs.<p>Things that alerted
    me. (Note that any one of these things could be fine and explainable, but so many
    in short order makes it obvious).<p>&gt; And it rang. We both did our jobs.<p>What
    is the human&#x27;s job here? Waking up?<p>&gt; the whole morning minute by minute,
    as if someone had laid it out on a table and labeled every piece.<p>Labored metaphor
    that doesn&#x27;t add anything. Laid out a minute? On a table? Even if we accept
    the non physical metaphor for style, how does that add anything on top of &quot;minute
    by minute&quot;.<p>&gt; I made two pieces of toast. The left one burned. The left
    one in my toaster always burns; my toaster has a favorite side.<p>This sort of
    short staccato phrasing is an LLM smell. It&#x27;s hard to describe why precisely
    and how it varies from natural human text, but LLMs like to do this when writing
    fiction, especially when told to &quot;write with a good style, don&#x27;t write
    like an LLM.&quot;
