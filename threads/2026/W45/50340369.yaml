  author: awbvious
  text: "I&#x27;m an extremely amateur coder, but a prolific fiction writer.  I wasn&#x27;t
    expecting this much “Is it real or is it m-AI-beline?” in the comments.  (There&#x27;s
    a tell for you, no AI would make that joke.)  (For now.)  What’s interesting is
    my thought process is probably one you can apply to someone who is a good coder
    looking at a post to some code.<p>My thought process:<p>Hmm, what&#x27;s this
    post, a bit cryptic on info, not many comments but not none. Scroll.<p>[Come back
    in about an hour.]<p>Double the comments, probably not pure slop-or-shill.  (Or
    even worse, slop-and-shill.)  Click.<p>Works without javascript…   Has the look
    of an old usenet post, slightly reformated.  Ah, fiction&#x2F;narrative tells…
    \ Perhaps one of those “tales from IT” things on reddit, those were decent in
    the Before Times.<p>Hmm, has some interesting one-liners.  Like someone who writes
    enough to know you want to give a morsel of style, a clever aside here or there.
    \ The flourish an ice skater does with their hands after a triple axle.  Probably
    why it&#x27;s gaining in comments.<p>Hmm, seems like the person might be on the
    spectrum slightly.  Not sure if I would think that if it weren&#x27;t for the
    tech references.  Or the fact that some of it resonates with my most analytical
    observations of life and human behavior.<p>[Now I&#x27;m not sure if I thought
    this, but I think I did on some level:]<p>So that could be a person who&#x27;s
    “analytical” or it could be an AI.  But it’s actually something I might think,
    so I’m going to assume human.  Else, I’m going to have some uncomfortable thoughts.
    \ I don’t want to think that, and it’s pretty enjoyable.<p>[Back to thoughts.]<p>Ah,
    that’s the second Slavic and&#x2F;or Europeanish name I’ve seen.  Okay, likely
    a second language person.  Probably not learned English as a second language late
    in life.  Probably earlier.  Maybe dual language even.  The dual&#x2F;second language
    explains the slight, unnatural feelings I&#x27;m getting.<p>Oh, now here&#x27;s
    a metaphor&#x2F;stylism that just doesn&#x27;t work.  They write: “For now” could
    mean “so far” or “goodbye.”  As in “goodbye for now”.  That does not work.  I
    think they are going for something I’ve noticed though, expressions can be fluid
    to accommodate however the receiver wants.  For decades I’ve liked, and told people
    I like, the expression “Alright” as a response to “How are you doing?”  Because
    it is entirely up to the speaker how they want to interpret it.<p>[Not thought
    at the time:] \nAscending in pitch: Doing well.  Descending in pitch: Getting
    by, but could be better.  If pitch is needed to be truthful, then woe to the tonedeaf.
    \ And if the receiver wants a different pitch bad enough, they will assume I am
    simply a poor vocalist, which I’d rather, than have them deal with uncomfortable
    truth.  99% of the time when I’m asked this, it is by the cashier &#x2F; retail
    worker for whom, like this writer, all I may remember from my last encounter is
    their name tag.  Though, actually, not really.  If I remember their name, I likely
    also remember if they are pleasant&#x2F;chatty.  And I likely remember that more
    than names.  For Europeans, this can be different, as they say my locale is more
    pleasant&#x2F;chatty with strangers, so that might be why this writer only remembers
    names.<p>[Back to thoughts.]<p>But this doesn&#x27;t work.  “Goodbye for now”
    is not the same as “goodbye goodbye.”  If anything, it’s the same thing as “goodbye
    so far.” Meaning only one meaning for “for now.”  “For now” does not work on its
    own as a salutation.  “Well, thanks for checking me out, cashier.”  “You’re welcome.”
    \ “Have a good day.”  “For now.”  That would be a very interesting response from
    the cashier, but it would not mean “goodbye.”<p>So, what&#x27;s happening?  Why
    this assumed double meaning that I am not getting?  Hmm, perhaps this is a story
    originally written in another language and was translated to English.  They had
    an idiom that works in, say, a Slavic language but there&#x27;s no English analog.<p>[Not
    thought at the time:]<p>What the writer should have said is “for now” has multiple
    meanings: “at this moment, then not, and then again in another moment,” or “at
    this moment, then not, and never again,” or “at this moment and forever.”  Thus,
    “I am here, for now” only states that I am at this location at this moment.  Whether
    I will leave, whether I will come back, is unknown.  But it at least says what
    is likely important, that I am here now.<p>[Back to thoughts.]<p>If so, clearly
    we are tool assisted.  What of those previous clever phrases?  Well, they weren&#x27;t
    exactly “fun with English” clever.  They were things that could have been written
    first in a Slavic language and still translate into something clever.<p>[Not thought
    then:]<p>In fact it&#x27;s more like something in Guy De Maupasant&#x27;s (however
    it&#x27;s spelled) The Necklace.  Lots of clever lines that presumably came from
    the original French and translated fine.  I was directed to The Necklace from
    a news.ycombinator.com comment actually.  Hmm, a prompt of “write me in the style
    of Guy De Maupasant”...<p>[Back to thoughts]<p>Well, I&#x27;m pretty deep, might
    as well finish it.<p>[Not 100% sure I thought this.  Oh, and SPOILER ALERT:]<p>Uh
    oh, cross walk.  Possibility of being hit by a car.<p>[Back to thoughts.]<p>Hit
    by a car.  Yep.  Not my favorite story development.  Distracted from his phone,
    got it.  And shows the futility of his tech work.  Ug, can relate.  Probably written
    by someone who&#x27;d much rather write for a living.<p>Still, I probably would
    have preferred something “larger” for a climax that makes me think in a unique
    way.  E.g. Instead, the robot delivery bot gets raptured, and some clever thing
    about just-in-time programming is revealed that I wouldn&#x27;t get immediately
    as an amateur, but I can at least appreciate, if it&#x27;s explained well.<p>Honestly,
    though, getting hit by a car works if it is done slightly differently.  It was
    a bit on the nose, still, not a huge detractor.  Again, the other “hand flourishes”
    make up for it.<p>Bio.  Written by some CTO of some typical-startup sounding company.
    \ Impressive or at least unique for a large-company CTO.  For a five person startup,
    though, hell, even I could be a CTO.  And this is a bit like something I’d write.<p>What’s
    this thing also in the bio…  Wikipedia says its some Greek philosopher who was
    a prolific writer.  Indeed, some good parts in here suggest a prolific author
    wrote it.  Other parts suggest tool assist, if nothing else, to translate or help
    with something they want to say that works primarily in another language.  And
    then the “casual” mention of the company name.  Slight slop &#x2F; slight shill
    if anything.<p>Will I come back and read another?  On my own?  Probably not.  I&#x27;m
    not going to bookmark it.  Let’s check the comments.<p>[not thought:]<p>If a new
    one by this poster was posted on news.ycombinator.com .  Maybe…  But only with
    enough comments.  Assuming comment number&#x2F;rate on news.ycombinator.com stays
    a useful metric of being worth my time.<p>[Back to thoughts.]<p>Oh, man, so many
    “is it AI” comments…<p>Interestingly, I bet if I posted some code here, someone
    who writes code much better than I would say similar things.<p>Oh, this bit is
    kind of clever, but that could be because they had a clever idea, but it seems
    tool assisted.  I do like the flourish, but it’s not the flourish of a master
    of this (programming) language.  Some good stuff, but probably not going to bookmark
    this site.  I prefer programming from people who are as native in the language(s)
    as me.  Still has moments.  Ultimately, looks like the work of someone who&#x27;d
    rather be coding their own projects rather than doing their current job."
