  author: the_af
  text: "&gt; <i>The short staccato phrasing [...] has always been considered bad
    writing</i><p>No, it hasn&#x27;t. It&#x27;s a distinctive style that some writers
    use. Like everything in life, it can be used wrongly, but staccato phrasing isn&#x27;t
    &quot;always considered bad writing&quot;. Consider this:<p>---<p>“What’s yours?”
    George asked them.<p>“I don’t know,” one of the men said. “What do you want to
    eat, Al?”<p>“I don’t know,” said Al. “I don’t know what I want to eat.”<p>Outside
    it was getting dark. The street-light came on outside the window. The two men
    at the counter read the menu. From the other end of the counter Nick Adams watched
    them. He had been talking to George when they came in.<p>“I’ll have a roast pork
    tenderloin with apple sauce and mashed potato,” the first man said.<p>“It isn’t
    ready yet.”<p>“What the hell do you put it on the card for?”<p>“That’s the dinner,”
    George explained. “You can get that at six o’clock.”<p>George looked at the clock
    on the wall behind the counter.<p>“It’s five o’clock.”<p>“The clock says twenty
    minutes past five,” the second man said.<p>“It’s twenty minutes fast.”<p>“Oh,
    to hell with the clock,” the first man said. “What have you got to eat?”<p>---<p>As
    an aside, I link badly written student homework with purple prose and elaborate
    sentences that lead nowhere, rather than with punchy staccato style."
