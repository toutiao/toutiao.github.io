  content: "# [Let me ch...](/let-me-check/)\n\n    That morning I woke up at 6:58,
    two minutes before the alarm. I lay there and waited for it to ring. And it rang.
    We both did our jobs.\n    \n    I still don't know why I remember it in such
    detail. I used to forget what I'd had for dinner the night before. And now I remember
    the whole morning minute by minute, as if someone had laid it out on a table and
    labeled every piece. Apparently I have a lot of free time now.\n    \n    The
    speaker in the kitchen said: \"Good morning. Today it's plus three, cloudy, forty
    percent chance of precipitation.\" I never understood what forty percent of rain
    meant. Will it rain over forty percent of the city? Will it rain for forty percent
    of the day? Or does the speaker just not know and is too shy to say so? I liked
    the third option best. It made the speaker a bit like me.\n    \n    I made two
    pieces of toast. The left one burned. The left one in my toaster always burns;
    my toaster has a favorite side. And that was the only thing I was sure of that
    morning. Then I ironed my shirt. I always iron a shirt when I don't know what's
    going to happen next. With a shirt, at least, everything is defined: here's the
    collar, here are the sleeves, here's the crease that shouldn't be there.\n    \n
    \   And there was a lot I didn't know.\n    \n    On Monday my manager wrote in
    the team chat: \"On Friday we'll discuss roles.\" No emoji. For three days I wondered
    what my role was. In the theater it would have been simpler. There are leads,
    there are supporting parts, and there's the butler who walks on to say \"Dinner
    is served.\" I was counting on \"Dinner is served.\" But then I remembered that
    at my place that role had long been played by the speaker.\n    \n    A year ago
    I wrote code. Then I started writing to the agent about what code was needed.
    Then the agent started asking me what code was needed, and I started answering.
    My employment record says \"lead developer.\" Whom I was leading, and where, was
    no longer very clear. If anything, the agent was leading me, and I walked alongside
    and sometimes said: \"Yes, let's do it that way.\"\n    \n    They said machines
    would take the boring work first. And they started with the interesting work.
    The boring part, it seems, was left to us: waiting, checking, and carrying a phone
    around.\n    \n    But that morning I wasn't bored. Not at all.\n    \n    I worked
    at a service that delivers flowers to people who forgot to buy flowers. Most orders
    come in the morning. People remember anniversaries on the metro, between two stations,
    and order right away. And for three weeks now, every morning at 8:14, orders had
    been disappearing. Not all of them, three or four. The money was charged, but
    the flowers went nowhere. As if someone took the order off the shelf and quietly
    carried it away.\n    \n    We had been searching for three weeks. Me, the agent,
    sometimes Sveta from the team next door. And during the night the agent wrote
    to me: \"I think I've got it. The server and the warehouse keep different time.
    The difference is about a minute. An order that falls into that minute is considered
    sent by the server and not yet received by the warehouse. Both are right, each
    by its own clock.\"\n    \n    I read this at breakfast and almost choked on my
    toast. The left one.\n    \n    It was beautiful. The agent called it desynchronization.
    I called it the no-man's minute: a minute that belongs to everyone and to no one.
    It seemed clearer to me that way. The agent politely agreed. But it always politely
    agrees, so I still don't know whether it was clearer.\n    \n    All that was
    left was to check. The agent asked me to open the order queue at 8:14 and see
    it with my own eyes. It couldn't do it itself: it had no access to the warehouse.
    For now.\n    \n    The gate to our courtyard recognizes residents by their faces.
    In my hat, it didn't recognize me. I took off the hat, and it opened. I thought
    that in a hat I sometimes don't recognize myself either, so it was only fair.\n
    \   \n    Our courtyard is square. If you stand in the middle, everything is symmetrical:
    two birches, two benches, two trash bins, a pink building on the left, a pink
    building on the right. The only thing that broke the symmetry was an old man in
    a beige coat with a dachshund. There was just one of him. He came out with her
    every day at 7:50, and I never once saw him late. The dachshund's name was Spitz.
    That was funny exactly once, and after that it was just a name.\n    \n    \"They
    promised forty percent,\" the old man said.\n    \n    \"Yes,\" I said. \"So did
    the speaker.\"\n    \n    \"I look out the window. The window doesn't lie.\"\n
    \   \n    I looked at the sky. It was an even gray, without any percentages. And
    Spitz looked at me. I think he didn't really trust the speaker either.\n    \n
    \   In March, Tanya left me. We had lived together for four years. She said I
    was always \"somewhere other than here.\" I asked: \"Where, then?\" She didn't
    answer. I think she didn't know either. It was one more thing nobody understood
    the workings of. Back then there were more and more things like that.\n    \n
    \   When I was a child there were no such things. Or rather, there were, but there
    was always a grown-up who knew. I thought a little green man lived inside the
    traffic light. He sat in there and decided for himself when you could cross. And
    Dad explained to me that inside there was a relay and a timer. I was upset, but
    I believed him. I think that was the last time grown-ups knew how everything worked.
    I couldn't explain to a child anymore who switches the traffic lights. I don't
    have a child, so for now it's not a problem.\n    \n    \"For now\" is a good
    phrase. I realized that in the spring, when my friend Gosha moved to a village
    to make cheese. For fifteen years Gosha had drawn icons for apps, and then he
    stopped. I asked him on the phone: \"Why cheese?\" He said: \"Nobody's going to
    make cheese for me. For now.\" I asked: \"For now?\" He said: \"For now.\"\n    \n
    \   And hung up. Afterwards I thought for a long time about what exactly he had
    told me. Because \"for now\" means two things at once: \"so far\" and \"goodbye,\"
    as in \"bye for now.\" I'd never noticed that before.\n    \n    The café on the
    corner has a mint-green door with a little bell above it. Behind the counter stood
    Ulyana (I know that from her name tag). She asked: \"The usual?\" I said: \"Yes.\"
    And I never figured out whether she remembers me or the register prompts her.
    It felt awkward to ask. If it's the register, that's a little hurtful. If it's
    her, then I should have remembered something about her too, besides the name tag.\n
    \   \n    While Ulyana was making the coffee, I thought that if you cut our building
    in half like a cake, you'd see it: on every floor, in every kitchen, someone is
    standing with a phone and asking something. The woman on the fifth floor, about
    her blood pressure. The boy on the ninth, about fractions (I heard him in the
    elevator dictating a problem to his phone). The old man with the dachshund, no,
    the old man looks out the window. Me on the seventh, about orders. And everyone
    gets an answer. Politely, always formally. Whether it's right or not, everyone
    decides for themselves.\n    \n    At 8:09 I came out onto the avenue and opened
    the chat.\n    \n    \"Good morning,\" the agent wrote. \"Five minutes to go.
    Will you be watching?\"\n    \n    \"Walking to the metro,\" I replied. \"Opening
    the queue.\"\n    \n    I walked and looked at my phone. White taxis moved along
    the avenue one after another, like beads on a string. There are plenty of them
    in the city, with drivers and without. You can't tell them apart until you look
    inside. And there's no time to look.\n    \n    8:13. There were nine orders in
    the queue. Three of them had just come in.\n    \n    \"There they are,\" the
    agent wrote. \"Watch those three. Here comes the interesting part.\"\n    \n    I
    reached the crosswalk by the pharmacy. A green cross glowed above the pharmacy.
    At the curb stood a delivery robot, a white box on six wheels "
