  text: Well I think the verdict on Shakespeare is in, and it&#x27;s positive.  I
    assume you&#x27;ve read some, if you have you&#x27;d know that the positives outweigh
    any minor negatives. We still use some of his phrases today.<p>Of course Shakespeare
