    tight; the antithesis of LLM writing.<p>Back to this particular text. From the
    start, it smells of AI:<p>&gt; <i>That morning I woke up at 6:58, two minutes
    before the alarm. I lay there and waited for it to ring. And it rang. We both
    did our jobs.</i><p>Short choppy sentences more suited to advertising than prose,
    ambiguity without purpose, pointless personification, melodrama and tension over
    the most mundane details. One para perhaps could be a bizarre stylistic choice,
    but it continues like this for the whole passage.<p>It&#x27;s possible this was
    written by a human so steeped in the language generated by LLMs they don&#x27;t
    know what is human and real any more, but it seems much more likely it&#x27;s
    a translation which was translated by LLM and &#x27;improved&#x27; by taking its
    style suggestions, or simply generated&#x2F;written by the LLM based on a much
    shorter prompt.<p>However the most important thing is not who wrote it, but the
    quality of the writing, and I think the verdict of most people disagrees with
    you.
