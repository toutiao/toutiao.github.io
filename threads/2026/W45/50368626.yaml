  content: "### \n\n_Roy Rinberg (Anthropic), Alex Allain (Anthropic); Alessandro
    Chiesa (EPFL, StarkWare), Miranda Christ (MIT, RESI), Rahul Dalal (Anthropic STEM
    Fellows Program, Succinct), Giacomo Fenzi (EPFL), Ben Mayer (Anthropic Fellows
    Program, MIT), Guy Weissenberg (EPFL)_\n\n## Executive summary\n\nWhen you talk
    to a friend in person, you have many ways to know it is really them: you can see
    them, hear them, shake their hand. When you talk to an AI model, you have almost
    none. A user querying a model today cannot check that the responses came from
    the specific model that a developer claims is responding, as opposed to one secretly
    substituted in by a routing service for cost reasons, or even by an attacker who
    has tampered with the token stream. Judging from the model’s output alone is unreliable,
    even if it produces high-quality responses. Cryptographic proofs of inference
    solve this problem: they let a model provider commit to a model and then prove
    that each response was produced by that model. Such proofs could enable applications
    ranging from consumer products to internal security, and could contribute to a
    toolkit for verifying compliance with AI pacing requirements.\n\nSpecifically,
    we have made progress on a powerful type of cryptographic proof known as a “zkSNARK”,
    which is uniquely fit for **provable inference** (owing to its strong hiding and
    efficiency properties). In this post, we share some of that progress, primarily
    through a system we call FlashProve. A brief technical summary is as follows:\n\n1.
    Claude has produced improvements on zkSNARKs for inference, building a system
    that is substantially faster than prior open-source systems. \n  1. For a large
    model (Llama 4 Maverick, 400B-parameter mixture of experts), a single H100 GPU
    generates proofs at around 110 tokens/second, with a proof size of ~19 MB per
    1,024-token request, when in 4-bit quantized weights, using integer arithmetic
    in prefill. This is ~70-95x the GPU time of running the model itself on vLLM,
    a common open-source library. \n  2. Prior open-source systems are orders of magnitude
    slower, as we discuss in [section 6](https://www.anthropic.com/research/provable-inference#prior-work).
    Claude found novel ways to apply state-of-the-art tools in the cryptography and
    security literature, while relying on well-established design principles for cryptographic
    proof systems. The commitment to the model, and subsequent inference proofs, hide
    the weights of the model; hiding the architecture of the model is not a goal of
    this system.\n2. Claude is good at optimization, but often makes decisions that
    are hard to evaluate, especially in large complex systems. We counter this by
    providing top-level auditable statements in Lean (a formal verification language)
    for the claimed security guarantees.\n\nToday we are releasing five artifacts:\n\n-
    The current blog post, which outlines our system and its potential applications;\n-
    A [technical report](https://www.anthropic.com/document/flashprove-technical-report)
    explaining the details of our system;\n- A (Claude-written) [protocol specification](https://github.com/anthropics/FlashProve/blob/main/paper/paper.pdf)
    document;\n- [Executable code](https://github.com/anthropics/FlashProve) that
    includes: a [prover](https://github.com/anthropics/FlashProve/tree/main/prover)
    and two verifiers, a [fast verifier](https://github.com/anthropics/FlashProve/tree/main/verifier)
    in C++, and a [provably correct verifier](https://github.com/anthropics/FlashProve/tree/main/tools/lean-verify)
    in Lean; and\n- [Lean proofs](https://github.com/anthropics/FlashProve/tree/main/lean)
    for the top level mathematical statements, along with an [interactive visualizer](https://github.com/anthropics/FlashProve/blob/main/lean/STATEMENTS.html)
    of the Lean theorems to aid with auditing.\n\nWe release our code, Lean proofs,
    and documentation under the Apache 2.0 license. This research post is meant to
    share intermediate progress, and not a completed research agenda. We are sharing
    this explicitly with the goal that others look at what we have done, take it,
    and improve it.\n\n## Introduction\n\nWhen a user sends a request to an AI model,
    today they have no way of knowing for certain that the model they selected is
    the one that generated the response. For everyday uses, in which users mostly
    care about the output and not necessarily which specific model produced it, this
    is a less pressing concern. But there are several cases where such assurance would
    be useful. For example, independent evaluators who test AI models before and after
    release need to know that the model they are evaluating is the model being served.
    Clients who use a model through a third-party routing service want assurance that
    the tokens came from the model they paid for. And if a cyberattacker modifies
    the token stream while pretending to be a given model, a user has no way to detect
    it from the output alone.\n\nHowever, enabling verification of model responses
    is challenging. Most frontier models’ weights are kept private, and even if the
    user had access to the weights, checking that a given response was produced by
    a model with those weights would involve running the model, which requires computational
    resources far beyond what a typical user (or even evaluator) can afford.\n\nThe
    goal of _provable inference_ (PI) is to enable a user with limited computational
    resources and without any information about the weights to verify that a response
    came from the requested model. PI is motivated both by a desire to increase customer
    trust in AI providers, and—because it can be used to provide assurances to independent
    evaluators and allows providers to demonstrate that they are meeting certain commitments
    and legal obligations—it also has implications for pacing the frontier of AI development
    and for AI regulation.\n\nOne way to implement PI is via a cryptographic object
    called a _zero-knowledge succinct argument:_ the model provider sends, along with
    the claimed response, a short _proof_ (say, a few megabytes) that the user can
    _quickly_ verify (ideally, in seconds on a CPU). If the claimed response deviates
    from the specified model, the user’s check will fail. Importantly, cryptographic
    techniques ensure that the proof reveals _nothing_ about the model’s weights.\n\nToday,
    we release FlashProve: an **open-source performant prototype for provable inference**.
    For a 400B-parameter mixture-of-experts model (Llama 4 Maverick, 4-bit quantization),
    we show that a single H100 GPU generates proofs at over 100 tokens/second, with
    proof size of ~19 MB per 1,024-token request (~70-95 times the GPU time that vLLM,
    a common open-source library, takes to process prompts of the same length).\n\nThe
    release comes with executable code, Lean formalization, and a technical description
    of the protocol. Our aim is twofold: (i) accelerating and facilitating the development
    of provable inference; and (ii) demonstrating that zero-knowledge succinct arguments
    are practical for provable inference.\n\nWe believe that this progress has meaningful
    implications for security, in **pacing AI development** , in **providing AI customers
    with integrity guarantees** , in **facilitating tooling for auditors and regulators**
    , and more.\n\n## Trust challenges in AI proliferation\n\nThe development of artificial
    intelligence and its growing role in our digital infrastructure and economy raises
    [trust challenges](https://arxiv.org/abs/2004.07213) that AI providers must answer.
    Addressing these and other challenges is facilitated by relying on tools for _provable
    inference (PI)._\n\nTools for PI include hardware approaches, software approaches,
    or a combination of both. Here, we focus on a software-only approach: a cryptographic
    tool known as a “zkSNARK” (_zero-knowledge succinct argument of knowledge_). Informally,
    a zkSNARK is a system allowing a _prover_ to convince a _verifier_, by way of
    a short “certificate”, that a given computation was executed correctly; crucially,
    the certificate is _z"
