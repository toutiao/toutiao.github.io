  author: vessenes
  text: I&#x27;ve been writing about the need for provable inference (and training)
    on and off for a number of years; this is welcome news and a good start, and a
    significant improvement on prior zk results.<p>The problems of inference proof
    for a closed model provider are more difficult than an open model provider --
    you can get a probabilistic proof much more cheaply out of four independent inference
    providers running the same non-batched prompt than this 90-100x compute hit.<p>Anthropic
    and others also have a significant problem with these proofs in that they have
    a lot of incentive internally to have some portions of the pre-prompt secret;
    I haven&#x27;t read this newest scheme closely enough to determine if they have
    a way to hide parts of the prompt with the proof. But if they don&#x27;t, they
    are almost certainly not going to want to send these proofs out in the general
    case.<p>Last, I&#x27;ll take this moment to soapbox and say for the researchers
    out there -- provable inference is nice. Provable training corpus information
    would be spectacular. It would be very, very, very nice to provide a set of model
    weights and a proof that they had only been trained on a dataset. To be clear,
    this is a really hard problem, but it would change fundamentally what levels of
    trust we could have about a given set of weights.
