  author: fscaramuzza
  text: HTTPS makes sure you’re communicating on a secure channel with the API endpoint.
    ZKPs guarantees that the computation happened correctly behind the endpoint.<p>The
    work from Anthropic  isn&#x27;t a new idea, but they made the process more efficient,
    as inference verification is one of the biggest bottlenecks in the AI lifecycle.
    Beyond that, there&#x27;s a lot more that can be proven, like showing a model
    was trained on a specific dataset with certain properties.<p>From an auditing
    perspective, this used to be handled either by showing the data (which is pretty
    rare), checking samples (which has been shown to be easily hackable), or similar
    workarounds. For inference, an auditor might want to interact with a model on
    demand and have absolute certainty that the model they&#x27;re talking to is actually
    the one declared, and not a substitute.
