  author: saifelse
  text: I think there are two gaps with the watermark:<p>- it only gives a <i>high
    probability</i> that the text was outputted from the model, whereas a crytographic
    proof is computationally infeasible to forge<p>- it cannot be traced back to the
    input. You could &quot;wash&quot; the output from one model into another and it
    would be watermarked by the latter. With the crytographic proof, if you have the
    input, output, and &quot;commitment&quot;, you can verify your exact input was
    processed by the model (or so the model provider says).
