  author: nemo1618
  text: 'For open-weight models, provable inference is trivial: just redo the computation!
    This is much faster, cheaper, and doesn&#x27;t require any fancy cryptography,
    just deterministic inference (which, if you read carefully, the ZKP approach needs
    too). See <a href="https:&#x2F;&#x2F;lukechampine.com&#x2F;repligraphs" rel="nofollow">https:&#x2F;&#x2F;lukechampine.com&#x2F;repligraphs</a><p>Of
    course, it&#x27;s unlikely that we&#x27;ll get open-weight models from OpenAI
    or Anthropic any time soon. That means we have to choose between a) fancy ZKPs,
    b) signed responses, or c) comparing results from multiple inference providers.<p>Whatever
    method ends up being used, it&#x27;s clear to me that <i>some</i> form of provable
    inference is inevitable. People haven&#x27;t caught on to its more significant
    applications, but they will. (This post touches upon one of them: model-driven
    audits.) Think about it: <i>we can prove that a particular mind authored a particular
    artifact.</i> That&#x27;s never been possible before! You can&#x27;t prove that
    Melville wrote Moby Dick, for example; but you <i>can</i> prove that Claude wrote
    a poem, or that Gemini approved a pull request, or that GPT got a particular score
    on some eval. This is a more powerful primitive than a cryptographic signature.'
  score: 0
