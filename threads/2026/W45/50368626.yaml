  author: OneDeuxTriSeiGo
  text: The main benefits are:<p>1. it proves your models are running correctly. FP
    ops tend to deviate in small amounts between hardware providers and tensor ops
    even more so due to the relatively new and unstable standardisation environment
    atm. So it proves your HW configuration is delivering outputs correctly. i.e.
    it&#x27;s a good test for what is currently a very non-trivial validation environment.<p>2.
    it proves your external provider is running the inference they said they are.
    i.e. it eliminates the concerns of model providers running quantized versions
    silently behind the scenes since quantization breaks the proof and you need to
    use a new, updated proof signature for the quantized version.<p>3. likewise for
    fine tuned or tampered models. Or outright substitution for another model (ex
    the accusation by OAI and Anthropic that Kimi and DS and co are periodically forwarding
    requests to their platforms to harvest responses for knowledge distillation).<p>All
    in all it&#x27;s a nice chain of trust utility if it can evolve out of the toy
    stage and reach production viability (since rn it&#x27;s limited to int-only weights
    and 1k context which is practically useless atm).
