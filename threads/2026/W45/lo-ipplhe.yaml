    I would have given the same advice: Go directly to gemini, skip trying to get search result as the first solution, and ask directly the question of what you want.
    You can be super precise is what you want, more than I ever could with Google search. For example, when there was recently the wave of vibe-coded Photoshop clone appearing, I wanted to have the advice of real human. My prompt was something like

    Go on the internet and find specific comment from  people who have tried these new clones. Ensure the comments you find has the following:

    Skin in the game: the person given the comment must use the adobe software for real work or otherwise suffer consequence if things go wrong. If there is no consequence to the person writing the comment, it's out.
    Real human: the person must be a real person giving genuine feedback with no ulterior motive. It must not be AI generated, nor PR oriented. Swearing, rambling, emotions ("I like, I hate), exageration are positive signal. Clean sanitized speech is a negative signal. Clearly AI generated text is out. Any comment with a call to action (e.g. "hire me to understand how to use these new clones!", "sign in to my newsletter") is immediately out.
    About the cloned software themselves and how they could impact the person own work. General comment, like how it could impact stock market, or what it mean for the future of AI, are out.
    (etc.)


    And honestly, the clanker found mostly the kind of comments that I wanted, filtered out the garbage I didn't want, summarized them, and linked to the original reddit post and similar with links.
