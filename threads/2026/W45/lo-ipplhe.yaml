    I am not dealing with it particularly well.
    AI has gutted software engineering, ruined programming languages, and is currently posing an existential crisis to mathematics that mathematics academia still does not know how to handle. I'm not sure what I am going to do for employment. I deeply enjoy writing code by hand, and deeply detest reviewing code written by language models, and do not think I want that in my future. (AI still hasn't made any particular impact on linguistics, but it's unclear to me if that will last.)
    As far as the web goes, yeah, it's been depressing. I came to the conclusion today that I need to seriously limit my intake of all general computer topics, in order to limit my exposure to AI, which is so personally painful wrt. me and my hobbies/interests/career. So I'm quitting social media and all social media-related things -- logging off Mastodon, leaving various Discords, going to be disabling my Lobste.rs account, etc. I just don't really want to be exposed to it any more. Broadcasting my voice to many people at once is not worth the mental burden getting exposed to a constant stream of AI news. I'm just going to keep in touch with friends directly and primarily in-person.
    I also set back up my favourite RSS feed reader, Fraidycat. It's been unmaintained for like six years but still works great. I have yet to find another RSS feed reader that is as quaint and as well-designed UX-wise as Fraidycat -- its categorization system lets you keep up with active posters equally well as less active posters, and its web extension nature takes advantage of that most RSS feeds do not publish their content via the feed itself, but rather via links. (I don't mind following links to personal websites. In fact, I prefer it. Personal websites are quaint and fun and I like visiting them.)
    As far as search goes, I renewed my subscription to Kagi. They have community-sourced slop flagging. This is now a hard requirement for any non-hand-curated search engine I am to use in the future. I used to run a SearXNG instance with a nice blend of Google/Bing/Brave + Marginalia (thanks, ~marginalia) that gave similar results, but I've stopped hosting that due to concerns around hosting software in the age of AI and due to having to manually add slop sites to my block list.
    I'm deeply considering what hard rules I want to set for myself with my personal AI usage. Although I'd love to not use it at all, I don't think that's going to happen -- it's simply too helpful for debugging various computer tasks (is kind of a requirement for debugging various cursed NixOS issues, sadly) and I also value it in code review, literature search, and being really smart in general. I don't think that I value it in code generation, however. Even if it does write good code, I value the understanding I get from being the one writing and designing the code myself, and I enjoy the process of writing code. I don't want to lose that. So what I am leaning towards right now is setting a hard boundary of never using AI to create anything. This is somewhat stupid/arbitrary, and counterproductive to employability, but from my experience using AI this last summer I think I need this boundary, for my mental health.
    I also intend to spend more time contributing to the commons, now more than ever. I am not sure if I am going to contribute to Wikipedia -- when I have, the constant edit warring has always drawn me in in a way I deeply dislike. I don't think the culture is for me. I do intend to contribute more to OpenStreetMaps though. With StreetComplete now on both Android & iOS, it's easier to talk about it more and convince other friends to start mapping, too. I particularly would like to get business information up to snuff in my city -- I'd like to be able to rely on OpenStreetMaps over Google Maps.
    I also have started keeping a wiki, inspired by Hundred Rabbits. The software is a long-term project that I've finally had time to sit down and build, and while it has a few remaining performance bugs / necessary features (mostly re: good ux for citing academic literature), I'm quite happy with how it's shaping up. It lets me write notes in Typst and compile them for the web, and as I've been spending a bit of time getting the various Typst packages I rely on compiling for the web too, it means I can write detailed and technical linguistics content and serialize it to the web, with interlinear glosses / syntax trees / etc. I'll likely eventually end up with linguistics content making the most of my wiki, which I'm excited about, since a lot of knowledge is trapped in textbooks and PDFs that are not well-indexed by search engines. The philosophy behind why to keep a wiki has caused me some trouble in recent months -- why create information, when LLMs can synthesize new information on-demand? -- but I think thinking about it in terms of curation and a personal knowledge log is good enough for me.
    I've also taken up photography.
