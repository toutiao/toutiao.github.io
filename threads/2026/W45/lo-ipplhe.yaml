  text: |-
    On searching the web and information being difficult to find:
    I have realized this as well and spent some time trying to solve it for myself recently. The solution below is straight from my Obsidian vault, hopefully it helps someone :)
    the solution
    The solution I've arrived to is two-fold: Skip the search engine for many common queries by going straight to the source, and supplement that with a fast, free/accesible web-search-enabled LLM (more below).
    1. go to the source
    Keep a couple of different sources that actually have answers to my information in mind, such as: anilist, IMDB and other internet databases, Wikipedia etc. and just bookmark those/create search engines for those and then use them directly.
    The sites' built in result ranking is probably not as good as general-purpose search engines', but I find it good enough: If i search for The Godfather on IMDb, It will be within the first 5 results, if not the first one.
    This is my not-completely-exhaustive list:



    source
    custom search engine url




    wikipedia ⭐
    https://en.wikipedia.org/wiki/Special:Search?search=%s&fulltext=1


    imdb (movies/tv)
    https://www.imdb.com/find/?q=%s


    tmdb (movies/tv alt)⭐
    https://www.themoviedb.org/search?query=%s


    goodreads (books)
    https://www.goodreads.com/search?q=%s


    github (code)
    https://github.com/search?q=%s&type=repositories


    youtube ⭐
    https://www.youtube.com/results?search_query=%s


    wordhippo (synonyms/antonyms) ⭐
    https://www.wordhippo.com/what-is/another-word-for/%s.html


    slovník lingea (dictionary) ⭐
    https://slovniky.lingea.sk/anglicko-slovensky/%s


    anilist (anime)
    https://anilist.co/search/anime?search=%s


    anilist (manga) ⭐
    https://anilist.co/search/manga?search=%s


    genius (song lyrics)⭐
    https://genius.com/search?q=%s


    fmhy (software) ⭐
    https://fmhy.net/?q=%s


    mangaupdates (manga scanlation info)
    https://www.mangaupdates.com/site/search/result?search=%s


    npmx (js packages)
    https://npmx.dev/search?q=%s


    pypi (py packages)
    https://pypi.org/search/?q=%s



    I find it's easy enough to remember what site to use based on the type of thing you need to look up, especially if you look it up often enough.
    In case you forget, you can always take a look at this table/your own table like this.
    You can use this suggest url from DuckDuckGo for most of them without sending all your keystrokes to google:
    https://ac.duckduckgo.com/ac/?q=%s&type=list

    The suggestion quality seems to be fine from my testing.
    There are aggregator/source-customizable search engines such as SearXNG, and while neat in concept, I find that they're just way too slow and many sites' search fails due to cloudflare/anubis/captcha preventing the search engine's scraping.
    2. free, fast, good-enough llm with web-search
    when the question is too specific, and I can't be bothered to generalize it, "windows caffeine tray icon alternative possible to not keep screen on scoop-installable", "kdenlive resize video move to one corner of the screen instantly without animating" or I don't care that much and am just bored/curious about some fact like "is x niche youtuber dating y", being able to fall back on an llm for these kinds of queries is very useful.
    It doesn't really matter what LLM you use for these, you could probably even use Google and it's AI overview, but I don't use google.
    I used to use Perplexity, then ChatGPT, Claude and now most recently DeepSeek for this; they all work just fine.
    The LLM only needs to meet these criteria:

    fast to load its webui and to respond
    free/you have access to it
    have access to a (good enough) web-search tool
    support pre-filling the prompt through a URL parameter, e.g. ?prompt=

    Then, I just set that as a custom search engine with a nickname (I use Vivaldi but you can do this in chrome), e.g. d subtitle format to export to if i want seamless import into kdenlive to search that through DeepSeek.
    Some LLMs will have output that's more annoying to read, but if it responds fast enough, you can usually skim the paragraph and get your answer quickly.
    Some LLM webui don't auto-send the pre-filled prompt. In those cases, I write a short userscript, e.g. Auto-send for DeepSeek
    Most LLMs like these have a phone app as well, which works pretty well in the absence of custom nicknamed search engines in mobile browsers, with the added benefit of searching by voice.
