    You're right, I agree with you. I suppose what I should have said there is that LLM debugging is kind of a requirement for my use of Nix/NixOS. There are two reasons for this: the first is that I think that even were I fully versed in Nix/NixOS and (always) able to understand the god-awful errors the Nix language sees fit to throw at users, I would still spend an inordinate amount of time on debugging and fixing various issues; and the second is that I am simply not motivated to learn Nix at a deep level due to it being a deeply unpleasant and ill-designed language. I'd rather spend my time learning a hermetic build system that doesn't have as many usability issues / as much technical debt / as awful of a community as Nix has, even if it isn't practical to use in the same way Nix (thanks to NixOS) is.
    On a related topic, one of the (many) reasons why the existence of LLMs deeply saddens me is that they discourage users from interfacing with good software. Take Nix, for example. I do not particularly enjoy using this system, because it is bad software. However, instead of learning a more coherently designed system like Guix, I simply use Nix, because LLMs allow for papering over its awful interface. I see the same thing happening with people who are using LaTeX -- LaTeX is quite similar to Nix in its user-facing awfulness, but rather than sitting down and learning ex. Typst, which is modern and user-friendly, many people I know just tell LLMs to generate their TikZ code and fix their builds.
    I'm pretty worried that this will lead to a stagnation of software. Although perhaps the ability to autonomously migrate codebases to different languages now will make up for it... really not sure.
