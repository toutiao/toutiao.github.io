    There are options, but they're not easy to find.
    I'd suggest you look for search engines that do not perpetuate the ad-funded business model, but rather where you pay to access a product that puts you front and center.
    I only know of 3: Kagi, MetaGer, and Uruky, which I've founded with my wife and launched earlier this year exactly because we felt we needed an alternative to exist.
    With all of this said, I believe we really need more initiatives like EUSP (and Mojeek and Marginalia, though at different scales) which are really trying to compete with the index size of Google and Bing. Uruky allows you to use all of those and we have our own "indie/small web" index being built and it's incredibly costly to do it right, and while the big tech bots don't do it right, it's even more costly to go after them.
    I hope it's possible to fight back Google/Bing, but it won't be with "the same thing" they offer. I think it'll be by having multiple alternatives with different focuses, appealing to different kinds of uses and users.
