    This graphic illustrates three proposed forms of magnetism reflected in three mirrors. The left mirror illustrates ferromagnetism, where all electronic spins point the same direction (up-up-up or down-down-down), creating an observable magnetic field. The right mirror illustrates antiferromagnetism, which has alternating electronic spins (up-down-up-down) that cancel each other out, producing no net magnetic effect. The center mirror illustrates the proposed form of altermagnetism, which exhibits properties of both ferromagnetism and antiferromagnetism.&nbsp; _(Greg Stewart/SLAC National Accelerator Laboratory)_

