  text: I mean, if you want to inject religion into this, that interpretation that
    it &quot;must be demons&quot; isn&#x27;t even supported by the source text.<p>In
    1 Samuel, King Saul visits a medium in Endor in order to speak to the (dead) prophet
    Samuel. Human dead go to Shoel (in familiar terms, it is similar to the Greek
    underworld) in the Old Testament. Later on in the New Testament, the idea of a
    <i>really really bad place</i> is introduced in the form of Tartarus, which is
    specifically where the rebelling angels were sent.  But that is not the same place
    human dead go.<p>The idea that everything &quot;not Heaven&quot; must be Hell
    is an invention, caused mostly by dogma that rose from bad translations of the
    Greek and Hebrew in the middle ages (for example, King James - itself mostly correcting
    minor errors of the older Bishop&#x27;s Bible - refers to all of it as Hell even
    though the original text most inarguably refers to different places different
    beings go).
