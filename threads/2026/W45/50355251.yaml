  author: badsectoracula
  text: 'I did exactly the same thing with Qwen 3.8 27B but i also asked it something
    else: a couple years ago i wrote a simple upscaler[0] when i was learning about
    neural networks. The network is dead simple: it takes a 25 inputs for a 5x5 grid
    around a pixel and outputs the 2x2 pixel grid that the input pixel should be replaced
    for a (width<i>2)x(height</i>2) upscale. I trained it on a bunch of random images
    (in hindsight i should have trained it on game screenshots but w&#x2F;e) and it
    looked quite nice.<p>So i asked Qwen 3.8 27B two things:<p>1. What it is this
    network all about? I only gave it the ann.c code that implemented a simple artificial
    neural network library in C and the setup code that specified the network&#x27;s
    shape but not its purpose.<p>Qwen 3.8 27B tried a bunch of stuff, taking the layers
    one by one, proding numbers through it, etc and finally figured out it is some
    sort of 5x5 to 2x2 filter, most likely working with pixels (i never mentioned
    pixels or graphics), though it wasn&#x27;t certain about the exact purpose. It
    did rule out a bunch of uses like being a downscaler or classifier, from its behavior.<p>2.
    After i revealed what it was, i asked it if it can improve it but keep it 100%
    compatible with the existing program that used the weights file. And sure enough,
    it did improve it. I gave it the original training C code and dataset. It made
    a few experiments (and wrote its own training C code because it found mine too
    slow :-P) and ended up improving the weights. The difference[1] is small, but
    it basically eliminated some small noise that was always there and made some transitions
    less &quot;halo-y&quot;. Of course for the purpose i wanted it (use it to upscale
    games in realtime) it isn&#x27;t that great (too heavy) but it was learning material
    anyway. Though one bonus thing i noticed is that it upscales my random doodles
    much better than any Krita filter[2] :-P.<p>The above isn&#x27;t Qwen 3.8 27B
    observing the weights directly and making sense out of them (ok actually it did
    seem to make some sense of the weights in the &quot;#1&quot; but i didn&#x27;t
    dump the entire network to it - though thinking about it, it is only around 16384
    floats so it might work). It just used a bunch of scripts it wrote in Python (and
    later C) but i still found it interesting to watch it go at it.<p>[0] <a href="https:&#x2F;&#x2F;mastodon.gamedev.place&#x2F;@badsector&#x2F;113765818432603610"
    rel="nofollow">https:&#x2F;&#x2F;mastodon.gamedev.place&#x2F;@badsector&#x2F;113765818432603610</a><p>[1]
    <a href="http:&#x2F;&#x2F;runtimeterror.com&#x2F;pages&#x2F;iv&#x2F;images&#x2F;a3d94ea369ff95ecf05acad3982f2e9f.png"
    rel="nofollow">http:&#x2F;&#x2F;runtimeterror.com&#x2F;pages&#x2F;iv&#x2F;images&#x2F;a3d94ea369ff95ecf05...</a><p>[2]
    <a href="http:&#x2F;&#x2F;runtimeterror.com&#x2F;pages&#x2F;iv&#x2F;images&#x2F;4e29d027a8aa6e89db58f94ff58769c4.png"
    rel="nofollow">http:&#x2F;&#x2F;runtimeterror.com&#x2F;pages&#x2F;iv&#x2F;images&#x2F;4e29d027a8aa6e89db5...</a>'
