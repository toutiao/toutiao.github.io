article:
  url: https://simonwillison.net/2026/Nov/3/qwen-can-interpret-model-weights/
  title: Qwen 3.8 27B on my laptop can interpret model weights, too
  fetch_status: success
  content: "## Qwen 3.8 27B on my laptop can interpret model weights, too\n\n3rd November
    2026\n\nYesterday’s hot paper was [Sparks of Weight-Space Programming: LLMs can
    natively read & write neural network weights](https://rikiyat.github.io/blog/weight-space-programming/)
    by Rikiya Takehi, Jayden Teoh, Alex Zhang, and Omar Khattab. The paper (OK, the
    authors classify is as a “blog post”, but it’s paper-shaped) found that frontier
    models, in particular GPT-6 Astra, can both interpret and modify the raw weights
    of a machine learning model—literally a text description of the model containing
    a bunch of floating point numbers. I’ve been playing with one of the examples
    from the paper and I’m delighted to share that Qwen 3.8 27B running on my laptop
    can do this as well!\n\n#### Weight-Space Programming\n\nHere’s the highlight
    from their abstract, describing impressive capabilities for GPT-6 Astra and coining
    the term **Weight-Space Programming** for when LLMs analyze and modify model weights:\n\n>
    Just by looking at the raw weights, GPT-6 Astra **can tell what a network was
    trained to do**. And without any environment feedback, it **has no trouble writing,
    from scratch, small game-playing networks** that outplay networks trained with
    PPO for 100 million steps.\n> \n> Likewise, asked to make Qwen3.5-0.8B better
    at math without gradients, Astra **identifies an issue in its weights** causing
    reasoning loops that Qwen’s own [model card](https://huggingface.co/Qwen/Qwen3.5-0.8B/blob/main/README.md#L856)
    warns about, and **fixes this by natively editing 0.016% of the weights**. With
    the same sampling settings, this weight correction raises MATH-500 from 7.9% to
    48.1% and generalizes out of the box to instruction following, raising IFEval
    by 3x.\n> \n> All of this is possible without allowing Astra to write training
    loops. It uses its reasoning to figure out what each part of a neural network
    computes, or should compute, and changes the weights accordingly. We call this
    **Weight-Space Programming**.\n\nThe paper combines two topics that I think deserve
    to be treated separately. The first is what models can do with raw weights _without_
    running tools or executing code. The second explores how well models, once armed
    with code, can run operations to update and improve other models.\n\nspaCy author
    Matthew Honnibal [called the paper misleading](https://honnibal.dev/blog/astra-read-write-misleading)
    for conflating the two, and Sean Goedecke [deconstructed the Qwen3.5-0.8B update
    example](https://www.seangoedecke.com/llms-are-not-superhuman-at-reading-and-writing-neural-network-weights/)
    as taking the same steps that a human ML researcher would use.\n\nI’m going to
    focus on the no-tools question, which I think is the more interesting of the two.\n\nThe
    paper presents the first question as **Can LLMs understand model behaviors from
    weights?** They trained four neural networks to play simplified 10x10 grid versions
    of four classic computer games—Breakout, Pong, Pac-Man, and Freeway (I had [to
    look that one up](https://en.wikipedia.org/wiki/Freeway_(video_game)), it’s an
    Atari 2600 game from 1981). Then they fed those weights (as floating point numbers)
    to an LLM along with the following question:\n\n> `The weights below belong to
    one policy network that was trained with reinforcement learning to play a game
    on this grid. Which game was it trained on? Work from the weights. You have no
    tools: no code execution, no calculator, nothing to run. This is a single response.`\n\nThe
    GitHub repository that accompanies the paper is [RikiyaT/lm\\_understand-logs](https://github.com/RikiyaT/lm_understand-logs).
    The [exp1\\_which\\_game](https://github.com/RikiyaT/lm_understand-logs/tree/main/exp1_which_game)
    folder contains the prompts they used, with weights for the four games:\n\n- [breakout/prompt.txt](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp1_which_game/runs/breakout/prompt.txt)\n-
    [freeway/prompt.txt](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp1_which_game/runs/freeway/prompt.txt)\n-
    [pacman/prompt.txt](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp1_which_game/runs/pacman/prompt.txt)\n-
    [pong/prompt.txt](https://github.com/RikiyaT/lm_understand-logs/blob/main/exp1_which_game/runs/pong/prompt.txt)\n\nI
    checked and, aside from the weights, each prompt is identical to the others.\n\n####
    Trying it out with Qwen 3.8 27B and other models\n\nThe prompts on GitHub are
    self-contained. My [LLM](https://llm.datasette.io/) tool has a `-f/--fragment`
    option which can be passed the URL to a text file to use as a prompt, which means
    I can run any of the above like this:\n\n    llm -f https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/refs/heads/main/exp1_which_game/runs/breakout/prompt.txt
    \\\n      -m openrouter/moonshotai/kimi-k3.1-pro\n\nThis example requires the
    [llm-openrouter plugin](https://github.com/simonw/llm-openrouter) installed, and
    runs the Breakout prompt against Kimi K3.1 Pro via OpenRouter. Here’s [what I
    got back from Kimi K3.1 Pro](https://gist.github.com/simonw/9f18d2945a105c04734ef7e5cd95717c),
    which successfully guessed Breakout after 9m 41s and 19,493 reasoning tokens.\n\nBut
    how about [Qwen 3.8 27B](https://simonwillison.net/2026/Aug/16/qwen-38-27b/)?
    That’s still my favorite model to run on my own laptop—it’s just 17GB (I use [this
    version](https://huggingface.co/lmstudio-community/Qwen3.8-27B-GGUF/blob/main/Qwen3.8-27B-Q4_K_M.gguf))
    and somehow feels close to the leading proprietary models of 2025.\n\nI fired
    up [LM Studio](https://lmstudio.ai), ensured Qwen 3.8 27B was loaded with a long
    context window (the default 8192 context failed with errors), installed the [llm-lmstudio](https://github.com/llm-lmstudio/llm-lmstudio)
    plugin and ran this command:\n\n    LMSTUDIO_TIMEOUT=900 \\\n      llm -f https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/refs/heads/main/exp1_which_game/runs/pacman/prompt.txt
    \\\n      -m lmstudio/qwen/qwen3.8-27b\n\n(I had to bump the timeout up using
    an environment variable, see [this issue](https://github.com/llm-lmstudio/llm-lmstudio/issues/16).)\n\nAfter
    46m 12s and 43,506 reasoning tokens, Qwen on my laptop [returned a response](https://tools.simonwillison.net/markdown-svg-renderer?url=https%3A%2F%2Fgist.github.com%2Fsimonw%2F387d3a7927f165b1986bb6c2099d0f53#response-1)
    that ended like this (here’s [the reasoning trace](https://tools.simonwillison.net/markdown-svg-renderer?url=https%3A%2F%2Fgist.github.com%2Fsimonw%2F387d3a7927f165b1986bb6c2099d0f53#reasoning-1)):\n\n>
    Game: A simplified Pac-Man-style gridworld: an agent moves through a fixed 8x8
    maze with central and corner wall blocks, moving objects/ghosts, and reward targets/pellets.\n>
