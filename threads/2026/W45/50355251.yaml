  text: |-
    I see your point about Sheol not being Gehenna not being &quot;the bosom of Abraham&quot; not being the New Jerusalem and so on, and you might already know everything I&#x27;m about to say, but just to clarify for others&#x27; sake: I think it&#x27;s wrong to say that the &quot;really really bad place&quot; is uniquely introduced as Tartarus (AFAIK mentioned only once in the NT, in 2 Peter 2:4[0]).<p>Jesus clearly refers to a very unpleasant place in e.g. Mark 9:47–48[1], Luke 16:24,[2] and Matthew 25:41[3] (where it&#x27;s explicitly stated that false prophets will go to the same place as &quot;the devil and his angels&quot;). Other references to an unambiguously bad place, as the sole and final destination of unbelievers, are throughout the New Testament, e.g. the &quot;lake of fire&quot; in Revelation 20:15[4] and 21:8[5]. Revelation 20:14[6] even says that &quot;Hades&quot; will be thrown into that same &quot;lake of fire&quot; (which of course supports what you&#x27;re saying about Hades being distinct from Hell).
    As a final note, even the reference to Tartarus in 2 Peter 2:4 speaks of it as a temporary holding place where &quot;angels who sinned&quot; are being &quot;kept for judgment&quot;, implying that there&#x27;s a more final fate awaiting them (identified in Revelation 20:10[7], at least for Satan, as the aforementioned &quot;lake of fire&quot;).<p>The main point I&#x27;m trying to make is that, while it&#x27;s certainly true there are other &quot;places where dead people&#x2F;angels go&quot; than Heaven and Hell, that&#x27;s only true <i>at this point in time</i>. To my knowledge, the New Testament is consistent about a final judgment where there are only two possible fates (the New Jerusalem, i.e. Heaven, and the lake of fire, i.e. Hell).<p>[0] &quot;For if God did not spare angels who sinned, but cast them into the pit [Tartarus] and delivered them to chains of darkness, being kept for judgment;&quot;<p>[1] &quot;And if your eye causes you to stumble, gouge it out; it is better for you to enter the kingdom of God with one eye, than, having two eyes, to be cast into hell [Gehenna], where their worm does not die, and the fire is not quenched.&quot;<p>[2] &quot;And he cried out and said, ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool off my tongue, for I am in agony in this flame.’&quot;<p>[3] &quot;Then He will also say to those on His left, ‘Depart from Me, accursed ones, into the eternal fire which has been prepared for the devil and his angels;&quot;<p>[4] &quot;And if anyone’s name was not found written in the book of life, he was thrown into the lake of fire.&quot;<p>[5] &quot;But for the cowardly and unbelieving and abominable and murderers and sexually immoral persons and sorcerers and idolaters and all liars, their part will be in the lake that burns with fire and brimstone, which is the second death.&quot;<p>[6] &quot;Then death and Hades were thrown into the lake of fire. This is the second death, the lake of fire.&quot;<p>[7] &quot;And the devil who deceived them was thrown into the lake of fire and brimstone, where the beast and the false prophet are also, and they will be tormented day and night forever and ever.&quot;
