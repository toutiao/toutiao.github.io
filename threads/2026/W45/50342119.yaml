  author: fapjacks
  text: I was a member of ASP (American Society of Papyrologists) and their journal
    is phenomenal, for anyone interested. Anyway, an important piece of information
    about this effort is that it&#x27;s conceived that there is a second, &quot;main&quot;
    library yet to be excavated, and that the library that was found was merely a
    fore-room to this, which fits with the design and location of the library and
    that the owner of the villa was a patron of epicurean authors, which constitute
    the bulk of the contents of the known library. Italian authorities have refused
    to allow any further excavations, and I seem to remember that one of the stipulations
    of authorizing any such work is that it becomes possible to read the existing
    papyri non-destructively. So this is very cool and important work.
