  author: Veserv
  text: The odd thing is that the incarceration rate in the US is 542 per 100k, but
    the murderer rate is probably something like 200-350 per 100k.<p>5.9 homicides
    per 100k annually [1]. Assuming the average person who commits homicide commits
    1 homicide in their lifetime (known homicide distributions support this) then
    that is 5.9 new murderers per 100k annually. Distributed over expected lifetime
    that would be 200-350 murderers per 100k.<p>So, if the US successfully imprisoned
    every murderer and only murderers, it would still be ~25th (~Nicaragua) to ~80th
    (~Russia). Nearly 2x the total incarceration rate of France and 3x the total incarceration
    rate of Germany if <i>only</i> murderers were incarcerated and we used the low
    estimate.<p>If we assume that homicide is relatively rare compared to severe physical
    violence that most nations consider worthy of incarceration, then just imprisoning
    all violent offenders in the US would likely require 1,000+ per 100k at the low
    end, over twice the actual rate in the US.<p>[1] <a href="https:&#x2F;&#x2F;www.cdc.gov&#x2F;nchs&#x2F;fastats&#x2F;homicide.htm"
    rel="nofollow">https:&#x2F;&#x2F;www.cdc.gov&#x2F;nchs&#x2F;fastats&#x2F;homicide.htm</a>
