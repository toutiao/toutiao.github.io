  author: ertian
  text: 'I think that the argument is that social media amplified the effect. It obviously
    didn&#x27;t create social pressure, but pressure was limited, and people were
    just free to be more diverse--or, to put it in the opposite way, there was less
    pressure to conform.<p>When something bad happens (like, say, a murder), people
    want to talk about it. But now, the conversations happen in view of the public--the
    _whole_ public. So people don&#x27;t want to be on the wrong side of the conversation.
    In private, among friends they understand and trust, they might express doubt
    or complex thoughts. But out in the general public, where their opinion could
    be boiled down to a soundbite, they don&#x27;t dare lean on nuance. So, they play
    it safe.<p>Go onto Reddit, and under some controversial story post a nuanced take.
    Chances are you&#x27;ll get downvoted to oblivion. And that&#x27;s fine--it&#x27;s
    pseudonymous. But if it were attached to your real name, and you happened to be
    wrong (or some part of your statement could be taken out of context and made to
    look wrong), then it could always be dredged up and used against you. OTOH, there&#x27;s
    basically no scenario where it would be dredged up to <i>help</i> you.<p>So the
    result is, all nuance is drained out of the conversation. We end up with junk
    food for public discourse: no fiber, no nutrition, just feel-good sugar: &quot;fuck
    that guy, he should be locked up for life!&quot; And seeing everybody carry that
    line unanimously makes anybody who <i>doesn&#x27;t</i> look immediately suspicious.'
