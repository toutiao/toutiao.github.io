  content: "![](../../../resources/snowman-200.jpg)\n# [And now it’s all this](https://leancrew.com/all-this/)\n\n##
    I just said what I said and it was wrong  \n Or was taken wrong\n\n \n\n[Next
    post](https://leancrew.com/all-this/2026/10/homeview/)[Previous post](https://leancrew.com/all-this/2026/10/randomizing-array-indices/)\n\n#
    [TextEdit vs. Pages](https://leancrew.com/all-this/2026/10/textedit-vs-pages/)\n\nOctober
    16, 2026 at 9:42 PM by Dr. Drang\n\nA few days ago, Allison Sheridan wrote [a
    very persuasive article](https://www.podfeet.com/blog/2026/10/textedit/) about
    using TextEdit, the “unsung hero of macOS,” as a simple word processor. I’ve been
    trying it out and… I’m going to stick with Pages. Let me explain why.\n\nFirst,
    you should know that I almost never use a word processor. The overwhelming majority
    of my writing over the past 30 years has been done in a text editor, and its plain
    text is then fed to some sort of formatting software—Markdown or LaTeX, typically—to
    set the styles for all the parts. But with one-off documents, the styles I use
    for blog posts and technical reports don’t make sense. A note for someone who’s
    coming over to water my plants while I’m out of town shouldn’t look like an analysis
    of a mobile crane tipover accident. That’s where a word processor comes in handy.
    It’s much faster to change fonts, sizes, and margins in a word processor than
    in a LaTeX preamble.\n\nAllison got on my good side early in the article when
    she complained about the ribbon in Microsoft Word. I think toolbars are way overused
    in apps nowadays, and Microsoft Office apps are probably the worst offenders.
    Their ribbons are overloaded with functions that should be in a menu, and they
    just take up too much space. Fundamentally, I see Microsoft’s ribbons as a user
    interface cop-out—it’s easier to load up a ribbon with buttons than it is to think
    carefully about how to make features available when needed without adding visual
    clutter.\n\nUnfortunately, TextEdit has a toolbar that can’t be hidden. It’s a
    compact toolbar, to be sure, but almost everything in it could be done through
    menu commands—as [MacWrite](https://en.wikipedia.org/wiki/MacWrite) and [WriteNow](https://en.wikipedia.org/wiki/WriteNow)
    managed to do 40 years ago—without taking up any space in the document window.
    Honestly, who needs buttons for bold and italic? Or left, center, and right justification?
    This is no better than Word’s buttons for cut, copy, and paste. I really thought
    TextEdit would have a setting for hiding the toolbar, but I haven’t found one.
    Control-clicking the toolbar doesn’t let you customize it, either.\n\n![TextEdit
    example](https://leancrew.com/all-this/images2026/20261016-TextEdit%20example.png
    \"TextEdit example\")\n\nNow it’s true that Pages has a toolbar, but it’s tucked
    up in the title bar where it doesn’t take away space from the document. And you
    can customize it to include only the buttons you find useful.\n\n![Pages example](https://leancrew.com/all-this/images2026/20261016-Pages%20example.png
    \"Pages example\")\n\nAllison is right that the Format sidebar in Pages could
    use a rethink. , , and are pretty useless names for the settings they expose—calling
    them , , and would be just about as informative. But at least the sidebar can
    be hidden until you need it.\n\n![Pages example with formatting sidebar](https://leancrew.com/all-this/images2026/20261016-Pages%20example%20with%20formatting%20sidebar.png
    \"Pages example with formatting sidebar\")\n\nAnother TextEdit deficiency that
    bothers me is the lack of a sensible zoom control. There are and commands in the
    menu, but they double and halve the displayed size of the document, which isn’t
    fine enough control. Would it be so bad to have 25% increments for your users
    with decaying eyesight?\n\n**Update 18 Oct 2026 4:19 PM**  \nAndrew Kemp pointed
    out [on Mastodon](https://mastodon.social/@ajwk/117456364364874807) that you _can_
    zoom in TextEdit using pinch and reverse pinch gestures on your trackpad. I should’ve
    tested that before writing the previous paragraph. Pages still has a zoom advantage
    because you can set a starting zoom level for every new document, but it’s not
    as big of an advantage as I thought. Thanks, Andrew!\n\nI mentioned earlier that
    it’s nice to be able to quickly change styles within a document. It’s also nice
    to have some standard styles to start with. Pages uses templates, a longstanding
    Mac feature that may have come over from NeXT, for creating documents with standard
    styles. It comes with lots of templates that I would never use, but it also lets
    users create their own. I have a simple one called Big Note, which uses 16-point
    Helvetica Neue for body text, centered 18-point bold Helvetica Neue for headings,
    and a 0.75″ indentation for bulleted lists. This works without changes for most
    of my printed notes to myself and others. While you can create new styles in TextEdit,
    you can’t save templates.\n\nAn advantage of TextEdit that Allison points out
    and which I concede: TextEdit uses much less memory than Pages. I wish that weren’t
    the case, but I have a 48 GB MacBook Pro, so I can afford to be profligate with
    RAM.\n\nPrice is not an advantage of TextEdit for me, as I’m using the free version
    of Pages. If Apple ever forces Pages users to sign up for Creator Studio—which
    I doubt will happen—I’ll be revisiting TextEdit.\n\n[Next post](https://leancrew.com/all-this/2026/10/homeview/)[Previous
    post](https://leancrew.com/all-this/2026/10/randomizing-array-indices/)\n\n \n\n#
