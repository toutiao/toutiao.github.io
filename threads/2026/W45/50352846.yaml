  author: staplung
  text: ".inetloc files. Mostly commonly used for HTML links but they can also be
    used to create SSH logins. They&#x27;re easy to create too: just type something
    like<p>ssh:&#x2F;&#x2F;soandso@whatshername.com<p>into virtually any app (I use
    TextEdit), select the text and drag it out to some Finder location. It will create
    the file automatically. Then just click on the file (or open it with Quicksilver,
    Alfred, et. al) and it will open a new Terminal window with you ssh&#x27;d to
    the host as that user (normal auth procedures apply).<p>I don&#x27;t use them
    too much anymore because there doesn&#x27;t seem to be any way to get iTerm2 to
    be the default app to open such files (on modern MacOS versions the application
    drop-down in the Finder info window is greyed out) and I don&#x27;t SSH into as
    many machines as I once did.<p>EDIT: turns out you can get iTerm2 to be the default
    opener for ssh .inetloc files; it&#x27;s just done inside iTerm itself.<p>Settings
    &gt; Profiles &gt; [select profile on left] &gt; URL Schemes"
