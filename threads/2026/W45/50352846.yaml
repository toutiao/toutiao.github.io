  author: js2
  text: Neither of these work. iCloud Recovery lets you restore deleted notes (if
    you&#x27;re lucky), but not get back a note where you&#x27;ve accidentally deleted
    the text. Getting back a deleted note is easy; you can already do that from &quot;Recently
    Deleted&quot; for up to 30 days. But undoing a stray edit, you&#x27;d better do
    it right away.<p>e.g. you&#x27;re trying to copy text out of a note so you select
    a portion of it. One stray tap and the highlighted text is gone. Shake to undo
    immediately or the text is long gone and then it syncs everywhere. The maneuver
    is so risky I&#x27;ve taught myself a work-around when I&#x27;m on my iPhone when
    I only need a portion of a note. I use the share icon to copy the entire note,
    paste that into a new temporary note, edit the new note down to the portion I
    want to share, then copy that text and finally delete the temporary note.<p>Locking
    a note doesn&#x27;t do what you think it does. It doesn&#x27;t prevent edits.
    It just means you need to provide a password to view the note. Once you&#x27;ve
    unlocked the note, it&#x27;s just as susceptible to a stray edit.<p>On macOS you
    can really lock files, preventing them from being edited:<p><a href="https:&#x2F;&#x2F;support.apple.com&#x2F;guide&#x2F;mac-help&#x2F;lock-a-document-on-mac-mchlp1342&#x2F;mac"
    rel="nofollow">https:&#x2F;&#x2F;support.apple.com&#x2F;guide&#x2F;mac-help&#x2F;lock-a-document-on-...</a><p>It
    was silly of Apple to use the term &quot;lock&quot; to mean different things.
    They should&#x27;ve called the thing in the Notes app &quot;private&quot; or &quot;hide&quot;
    or something. Also, locked notes don&#x27;t have the same functionality as non-locked
    notes; e.g. you can&#x27;t add attachments to a locked note:<p><a href="https:&#x2F;&#x2F;support.apple.com&#x2F;guide&#x2F;notes&#x2F;lock-your-notes-not28c5f5468&#x2F;mac"
    rel="nofollow">https:&#x2F;&#x2F;support.apple.com&#x2F;guide&#x2F;notes&#x2F;lock-your-notes-not28c...</a><p>Anyway,
    the best you can do if you accidentally edited a note and didn&#x27;t undo it
    in time is to extract the note from a backup of the Notes sqlite DB, should you
    have one from your Mac (say).
