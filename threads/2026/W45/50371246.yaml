  author: ZoneZealot
  text: It&#x27;s described at a high level in media often. Here&#x27;s more detail
    though:<p>Person buys a product, or downloads some software - that unknowing to
    them, was reaching out to a central server elsewhere to establish a network tunnel.
    And over that tunnel, the other server routes traffic onto that person&#x27;s
    home network. Which can then of course go onto the internet, and it appears like
    the traffic originated from their home internet connection.<p>Other people rent
    access to this network. The goal being, you have surreptitious access to appear
    as any one of tens of thousands of home network IP addresses on the public internet.
    Bad guys can use this to rotate through many different IP addresses when their
    access gets blocked because of malicious (or benign but unwanted) behavior on
    the internet. Residential IP addresses are more &#x27;valuable&#x27; because they
    don&#x27;t have the negative connotation that datacentre and commercial IPs can
    have, and they can be spread geographically or across many ISPs.<p>A very common
    way for people being a part of these residential proxy networks is by buying dodgy
    streaming boxes, and also installing shady apps on TV app marketplaces.
  score: 0
