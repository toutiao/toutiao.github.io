    \n\n![](https://spoon-tamago.com/wp-content/uploads/2026/10/jimi-halloween-2026-top.jpg)\n\nHappy
    Jimi Halloween to everyone who celebrates. It’s that wonderful time of year when
    our favorite Japanese festival, Jimi Halloween, is on full display. Mundane Halloween,
    as we coined it back in 2018, is when people dress up in costumes so mundane they
    have to be explained.\n\nThe tradition was started in 2014 by a group of adults
    at&nbsp;[Daily Portal Z](https://dailyportalz.jp/)&nbsp;who kind of wanted to
    participate in the festivities of Halloween, but were too embarrassed to go all
    out in witch or zombie costumes. So instead of the flashy and flamboyant costumes
    they had been seeing gain popularity in Japan, they decided to dress up in mundane,
    everyday costumes.\n\nYou can comb through social media using the hashtag #地味ハロウィン
    but below we present to you some of our favorites from this year’s festivities.
    We’ve been covering this event since 2018 so you can also take a look at&nbsp;[some
    past years](https://www.spoon-tamago.com/tag/jimi-halloween/)&nbsp;too!\n\n![](https://spoon-tamago.com/wp-content/uploads/2026/10/jimi-halloween-2026-2.jpeg)\n\nPerson
    trying to take a group photo in a very small izakaya | @YSSkywalker\n\n* * *\n\n![](https://spoon-tamago.com/wp-content/uploads/2026/10/jimi-halloween-2026-1.jpeg)\n\nPerson
