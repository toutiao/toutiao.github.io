  text: |-
    I used this to find a bug in one of my tools, where the initial pledge wasn't reduced on a certain code path.
    Then I did some basic checking in C, Go, and Rust, and all three functioned as expected. With sleep() between pledge reductions, top showed the pledge updates as they happened. Awesome, thanks, OpenBSD devs!
