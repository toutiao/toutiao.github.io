  content: "Contributed by[Peter N. M. Hansteen](https://nxdomain.no/~peter/blogposts/)on
    from the Q lifts the shroud dept.\n\nWith one recent _[commit](https://marc.info/?l=openbsd-cvs&m=179390106687646&w=2)_,
    the `top(1)` command on [OpenBSD](https://www.openbsd.org/) became quite a bit
    more useful. The commit adds a new `-Q` flag to show each process' use of the
    `chroot(2)`, `pledge(2)` and `unveil(2)` facilities. \n\nThe _[commit message](https://marc.info/?l=openbsd-cvs&m=179390106687646&w=2)_
    reads,\n\n> List: openbsd-cvs\r\n> Subject: CVS: cvs.openbsd.org: src\r\n> From:
    Klemens Nanni <kn () cvs ! openbsd ! org>\r\n> Date: 2026-11-05 17:54:16\r\n>
    \    \r\n> CVSROOT:\t/cvs\r\n> Module name:\tsrc\r\n> Changes by:\tkn@cvs.openbsd.org\t2026/11/05
    11:54:16\r\n>     \r\n> Modified files:\r\n> usr.bin/top : display.c machine.c
    machine.h top.1 top.c \r\n>     \r\n> Log message:\r\n> add Q flag/key to show
    pledge/chroot/unveil usage\n\n> Show promises in COMMAND and[ps(1)](https://man.openbsd.org/ps.1)state
    letters pertaining to pledge,\r\n> chroot and unveil usage in PRIV instead of
    TIME.\r\n>     \r\n> To quickly identify programs (un)aware of their privileges
    and thus\r\n> in extend the system's security.\r\n>     \r\n> A non-root user
    it not enough and alternatives like ps(1) -o state,pledge\r\n> in tree-mode or
    wrapped in[watch(1)](https://man.openbsd.org/watch.1)are not nearly as ergonomic
    as top(1).\r\n>     \r\n> p and P are already in use, Q has no meaning, but is
    free.\r\n>     \r\n> OK deraadt\n\nYou will need to install a fresh snapshot in
    order to explore and enjoy this feature.\n\n[Reply](https://undeadly.org/cgi?action=reply;sid=20261106104957)\n\n*
