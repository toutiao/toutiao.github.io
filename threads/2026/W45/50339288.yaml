  author: drivers99
  text: 'I started using an &quot;engineering notebook&quot; for things like that.
    They are called other things in other lines of work or school (lab notebook, captain&#x27;s
    log, ...). In an actual engineering notebook, you would use a sewn binding where
    you can&#x27;t add or remove pages, the pages are numbered, you have an index
    in the front, entries are made in strictly chronological order, you&#x27;d have
    someone else witness and sign pages, draw a diagonal line across empty areas so
    you can&#x27;t remove things, only cross things out with a single line, etc. All
    that because you might need to prove you invented something and other legal CYA
    reasons. Most of these requirements, you don&#x27;t need for personal projects,
    though. But the things that are useful: keeping track of projects, what settings
    you&#x27;ve tried, what the results were, and so on. That way you don&#x27;t have
    to reproduce it from scratch again later. &quot;What settings did I need use to
    create the gerber files in kicad for manufacturing? How did I set ___ in the oscilloscope?
    What parts did I use to make that thing? What things did I wish I had checked
    last time? Where did I put those files?&quot; You can also print things out and
    tape them in for reference.'
