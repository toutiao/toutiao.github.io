  author: Majromax
  text: '&gt; I was told by our school electrician that long ago the clocks were adjusted
    by the power company. So around 2am DST they would either send power at 59Hz*
    to fall back or 61Hz* to spring forward. This was from the era when power grids
    were separate and analog.<p>That wouldn&#x27;t have worked.<p>Grid-tied synchronous
    clocks (<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Electric_clock"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Electric_clock</a>)
    were once ubiquitous and did derive their timekeeping stability from the grid
    frequency, but that is only suitable for <i>keeping</i> time once set.  It works
    because electric grids are frequency-controlled and stabilized, where deviations
    from the reference frequency are corrected over long intervals.<p>In principle
    you could send power at 59 or 61Hz to adjust these clocks, but there are two problems:<p>1.
    The grid frequency isn&#x27;t arbitrary, it&#x27;s also <i>directly</i> coupled
    to the rotary inertia of every turbine that powers the grid.  This is why power
    fluctuations cause frequency changes: temporary oversupply or undersupply causes
    these turbines to slow down or speed up respectively, using their inertia as power
    storage.  Potentially screwing up every other piece of mechanical equipment tied
    to the grid for the sake of clock changes is... a poor optimization.<p>2. A one-Hertz
    difference isn&#x27;t enough to change the clocks in a timely way.  To change
    time by an hour you need to gain or lose 3600 * 60 = 216k cycles, but a 1Hz change
    gains or loses one cycle per second.  It&#x27;d take about 2.5 days to complete
    a one-hour change via this mechanism.'
  score: 0
