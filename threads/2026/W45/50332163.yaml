    # 13. BSD Unix, Part 3 - The Beginning of BSD Unix

    - BSD Unix, Part 1 - Unix Code Goes to UC Berkeley

    - BSD Unix, Part 2 - The Birth of the vi Editor

    The beginning of BSD Unix

    When Ken Thompson returned to Bell Labs in 1976, Bill Joy and Chuck Haley began exploring the Unix kernel themselves.

    > Hmm... we could speed things up here in the kernel.

    Hmm... we could speed things up here in the kernel.

    > Let's try it.

    Let's try it.

    > Other universities want copies of our Pascal compiler.

    Other universities want copies of our Pascal compiler.

    > Let's bundle it with ex and send them a tape.

    Let's bundle it with ex and send them a tape.

    In early 1977, Bill Joy put together the Berkeley Software Distribution, or BSD, bundling the Pascal system with ex, a line editor developed from em. Early BSD was not a standalone operating system: it was a collection of software to install on an existing Unix system. About thirty copies were sent out over the following year.&lbrack;1&rbrack;

    > Thirty tapes to copy...

    Thirty tapes to copy...

    At the time, an AT&T Unix source license was needed to get BSD. Berkeley charged only for the tape and distribution.&lbrack;2&rbrack;

    > If you already have a Unix source license, it's just the tape and postage.

    If you already have a Unix source license, it's just the tape and postage.

    Berkeley already had a tradition of sharing research software. BSD carried it on. Berkeley's Free Speech Movement, hippie culture, and antiwar activism are also said to have influenced Joy's decision to charge so little.&lbrack;2&rbrack;

    Universities and research institutions could obtain Unix, including its source code, for a modest licensing fee. This also helped the system spread.&lbrack;2&rbrack;&lbrack;6&rbrack;

    > We have Unix, but the antitrust agreement bars us from the computer business... We can't sell it as a product, either.

    We have Unix, but the antitrust agreement bars us from the computer business... We can't sell it as a product, either.

    The second distribution: 2BSD

    After the first BSD distribution, Joy improved the Pascal system based on user feedback. He bundled it with vi (ex's visual mode), the C shell, and other tools to form the Second Berkeley Software Distribution, or 2BSD. Nearly seventy-five tapes were shipped over the following year.&lbrack;1&rbrack;&lbrack;5&rbrack;

    Joy did more than fix bugs. He handled every distribution request, copied BSD onto tapes, and mailed them out himself.

    > Oh, you need a copy of BSD?

    Oh, you need a copy of BSD?

    > Another university wants a copy.

    Another university wants a copy.

    > Tune the kernel. Fix the bugs.

    Tune the kernel. Fix the bugs.

    > More copying.

    More copying.

    A VAX arrives at Berkeley, 1978

    > Professor Fateman's group is getting a VAX. It's 32-bit, with a whole megabyte of memory.

    Professor Fateman's group is getting a VAX. It's 32-bit, with a whole megabyte of memory.

    > Really? We should put Unix on it.

    Really? We should put Unix on it.

    > They've already got VAX Unix from Bell Labs. It's called 32/V.

    They've already got VAX Unix from Bell Labs. It's called 32/V.

    > Hi, I'm Ozalp Babaoglu.

    Hi, I'm Ozalp Babaoglu.

    > My adviser asked me to add virtual memory to VAX Unix. Could you look over the code?

    My adviser asked me to add virtual memory to VAX Unix. Could you look over the code?

    > Sure. Let's take a look.

    Sure. Let's take a look.

    Babaoglu was a Berkeley graduate student working with Professor Domenico Ferrari. Joy helped him integrate the virtual-memory code into 32/V and debug it.&lbrack;1&rbrack;&lbrack;4&rbrack;

    At the time, 32/V did not use the VAX hardware's virtual-memory capabilities. A program's address space was limited by physical memory, but Professor Richard Fateman's work on the computer algebra system Macsyma needed more. Virtual memory uses disk storage to give programs an address space larger than physical memory.&lbrack;1&rbrack;

    Macsyma, developed at MIT beginning in the late 1960s, worked with symbolic expressions. It could factor expressions, compute derivatives, and perform integration.

    Debugging continued through the holidays at the end of 1978.

    > Not going away for the holidays?

    Not going away for the holidays?

    > Might as well debug this while fewer people are using the VAX.

    Might as well debug this while fewer people are using the VAX.

    By January 1979, most of the bugs had been fixed.&lbrack;1&rbrack;

    > Let's try Unix with virtual memory.

    Let's try Unix with virtual memory.

    > Finally. It runs without crashing.

    Finally. It runs without crashing.

    Joy ported ex, vi, the C shell, and other 2BSD tools to the VAX, while Peter Kessler and Marshall Kirk McKusick ported the Pascal system. These programs were bundled with the standard 32/V utilities and the virtual-memory kernel that Babaoglu and Joy had integrated and debugged. The result was 3BSD, which began shipping in December 1979.&lbrack;1&rbrack;

    > At last, we can send these out.

    At last, we can send these out.

    Since 1969, ARPANET had linked research institutions funded by DARPA, the Defense Advanced Research Projects Agency.&lbrack;3&rbrack; But these institutions used different computers and operating systems, so they often couldn't share software. Porting the existing software to new machines was also costly. DARPA became interested in Unix's portability, and took notice of Berkeley's successful distribution of 3BSD to research institutions.&lbrack;1&rbrack;

    > BSD runs pretty well on this VAX.

    BSD runs pretty well on this VAX.

    References

    - Marshall Kirk McKusick, Twenty Years of Berkeley Unix, in Open Sources: Voices from the Open Source Revolution, 1999. Korean edition, Hanbit Media, 2013.

    - Andrew Leonard, BSD Unix: Power to the people, from the code, Salon, 2000.

    - SRI International, ARPANET. Its origins and the first transmission in 1969.

    - Ozalp Babaoglu, Biographical note. His Unix virtual-memory research as a Berkeley graduate student.

    - The Unix Heritage Society (TUHS), Original 2BSD distribution archive. The installation document install.ms and source code in 2bsd.tar.gz.

    - Warren Toomey, The Strange Birth and Long Life of Unix, IEEE Spectrum, 2011.
