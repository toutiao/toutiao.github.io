    ## Connections Management

    Auto Ontology resolves the source databases it connects to from two sources:

    - Added through the UI — connections created from within the app. With this option the connection credentials are stored in plaintext in Postgres unless Vault is configured: Without Vault: the full connection object (including the password) is JSON-serialized and stored, unencrypted, on the catalog's database row. With Vault: the credentials are written to Vault, keyed by the database name, and the catalog row stores no credentials (the database name is the lookup key — there is no separate reference field). Vault is enabled only when all of VAULT_ADDR, VAULT_NAMESPACE, VAULT_ROLE_ID, and VAULT_SECRET_ID are set (VAULT_AUTH_MOUNT and VAULT_KV_MOUNT are optional overrides). It is off by default; a partial configuration is ignored with a warning and falls back to plaintext storage.

