  author: theptip
  text: 'This is more about streamlining the Date Engineer &#x2F; Data Scientist role.
    Business Intelligence, in other words.<p>Before: domain expert wants to ask a
    question about the data, but which of these hundred tables actually has the right
    “revenue per User” column? Ask a DE to help slice the data and bless the queries.<p>After:
