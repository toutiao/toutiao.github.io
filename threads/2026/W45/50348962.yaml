    blessed data. To enable this you need to write down all the tribal knowledge that
    lived in the DE&#x2F;DS head; agents can take the first pass at proposing and
    updating metadata.<p>Under the covers the DE and DS roles switch to reviewing
    the underlying ontology, instead of working directly with business stakeholders
    on one-off queries.'
