  author: IanCal
  text: "&gt; Computer systems, though, can have that distinction. If you read data
    supplied by the user, and then process it via behavior in code, and process that
    result against administratively-set data in the database, the separation between
    user-supplied data, administratively-configured data, and instructions (code)
    is extremely clear<p>No it is not.<p>They are three places you can put things,
    amongst an infinite other number of places you can, but they are not some inherent
    core distinctions.<p>Is a javascript file code or data? If I read it to measure
    file size and don&#x27;t execute it, is it ever code?  If I read in a file and
    do different things in the code based on it, and never alter that file, how is
    that any different from having if (x) baked into the code? Why is it <i>user supplied
    data</i> if we read in a file and do things based on the contents yet <i>code</i>
    when I read in js and execute stuff in a VM?<p>They are just different places
    with different access controls that alter the outcome. There&#x27;s no magical
    distinction between code, data and admin data or anything else other than really
    who gets to change what. And then there&#x27;s obviously not just three named
    buckets of &quot;stuff&quot;, it&#x27;s as many as you want.<p>&gt; I don&#x27;t
    think the oft-repeated &quot;AI is fallible just like humans are&quot; applies
    here.<p>You&#x27;re missing the point here, the point is <i>we have built big
    things with fallible components</i>. Therefore the idea that a component is fallible
    does not <i>just from that fact</i> mean we can&#x27;t do useful things with it.
    And it&#x27;s a very relevant point if we&#x27;re looking at &quot;where can we
    use this in place of humans&quot; - if we had a human there before we were not
    starting from a perfectly reliable point."
