  author: mirekrusin
  text: because it doesn&#x27;t suck :)<p>it&#x27;s local first, agent-friendly tooling;
    you have single cli to access it (mcp is there as well if that&#x27;s your thing)<p>everything
    is persisted in simple local text files that you can actually read (or sqlite
    database if you don&#x27;t care &#x2F; have more data)<p>ie there is no integration,
    k8s-style nonsense etc, you can just use it on project or on your system user
    level and know exactly what&#x27;s there, you have control over it, you can delete
    it, move it, extract parts you find useful and move on etc<p>because it has first
    class support for uncertainty<p>evidence is first class concern<p>supports evolution
    of belief (statements can be revised, retracted etc. without destroying history)<p>knowledge
    is executable (rules, actions, automations – all operate on the same claim model)<p>it
    works well for knowledge that keeps changing (including support for querying knowledge
    as of some past time)<p>it&#x27;s great for llm sessions, ie. simple things like
    comment on a claim being part of a claim itself, which means it appears when working
    with knowledge, which allows to support weird&#x2F;human&#x2F;natural-language
    aspects that are not directly part of the model<p>...<p>rdf&#x2F;owl&#x2F;sparql
    is great for large, public, structured datasets (ie. medical, scientific or some
    regulatory, standardized ontologies)<p>cave is great for evolving knowledge, ie.
