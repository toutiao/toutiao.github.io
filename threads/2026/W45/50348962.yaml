  author: matthieu_bl
  text: 1. What is not in the codebase. Obvious of course, but building an ontology
    and maintaining it over time forces a company to document what was only living
    in the head of some experts and never written down. In the case of analytics use
    cases, think of all the quirks a data analyst might have in mind when querying
    the data. Very basic e.g. &quot;exclude test accounts whenever you count customers&quot;.
    Every analyst on the team does it without thinking, it&#x27;s rarely written anywhere,
    and an agent that doesn&#x27;t know will happily count them.<p>2. Related to 1.,
    your codebase or source material may hold different interpretations of the same
    definition (what &quot;revenue&quot; means can differ between Sales and Finance).
    The ontology forces you to choose one, or to state when to use each. Without that,
    the LLM may pick one a bit randomly.<p>3. It&#x27;s a governance tool for humans.
    It gives the company a human-readable, &quot;deterministic&quot; source of truth
    to agree on what means what, then version it and evolve it.
