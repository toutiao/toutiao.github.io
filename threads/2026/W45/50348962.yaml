  author: IanCal
  text: |-
    &gt; Well, in principle yes one system can compensate for another, in practice, errors tend to compound and combine in interesting ways, not go away, particularly in systems like this which are unpredictable and generate slightly different responses each time without human intervention.<p>Ah but the point here IIUC is moving from &quot;let an LLM figure out the right way of querying the data and what you mean with your terms from a wide span of different documents and sources, which it has to perform multiple searches on&quot; to &quot;let an LLM figure out the right way of querying your data <i>with a coherent and machine readable ontology</i>&quot;.<p>While the conversion from &quot;load of data&quot; to &quot;defined structure&quot; is error prone, you now have the second step operating on the <i>same</i> converted thing, and you have ways of fixing that over time (the corrections).<p>By splitting the task into two distinct phases, you can both interpret and fix the middle step, and remove a large class of mistakes and&#x2F;or differences caused by different interpretations of the same documents.<p>There are really two answers to it IMO that this boils down to:<p>1. This process may be less error prone for that first step than the LLM you&#x27;re using. That could reduce errors.
    2. This process means the first step is run <i>once</i> rather than <i>every time</i> which means you cut out one area where there can be differences each time.<p>&gt; Yes your second point is an interesting one - the divisions between these things are arbitrarily imposed on the world, but we do have these distinctions for a reason, even if they are not completely objective.<p>You&#x27;re right, I think there are useful groupings, but I think any effort to fully isolate them is doomed to fail because they inherently blend. Your instructions contain things that can only be understood in context of world knowledge and the data. The data only makes sense with certain bits of world knowledge.<p>We also know that these things happen with humans (again just to pre-empt how others may read this and not saying you are accusing me of this, I&#x27;m not gotcha-ing here) and so we often have to be careful about how we ask questions, how different cultural backgrounds impact understanding and so forth. We have to take care about how we structure things.<p>&gt; I&#x27;m not sure that this particular effort is going to help because it doesn&#x27;t change or constrain the behaviour of the actual machines and the behaviour is the problem, not the data they are fed.<p>I think this effort does address that. A really key thing is that this is about turning human readable questions into SQL that then only query the actual data and you see the result of that query - it allows you to constrain things more (at both points).
  score: 0
