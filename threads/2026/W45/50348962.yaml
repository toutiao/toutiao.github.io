  author: zbentley
  text: "&gt; I don&#x27;t think there really is a clear distinction between these
    things though.<p>Computer systems, though, <i>can</i> have that distinction. If
    you read data supplied by the user, and then process it via behavior in code,
    and process <i>that</i> result against administratively-set data in the database,
    the separation between user-supplied data, administratively-configured data, and
    instructions (code) is extremely clear. Even if you are doing something that could
    be nondeterministic, e.g. incorporating randomness or doing sentiment analysis
    or whatnot.<p>I don&#x27;t think the oft-repeated &quot;AI is fallible just like
    humans are&quot; applies here. Computer systems are an area where that separation
    can be achieved. We know this because we&#x27;ve achieved it a lot. LLMs, powerful
    as they are, are a massive step back in that regard. Their benefits might outweigh
    that compromise, but it is, as they say, &quot;worth naming&quot; anyway."
