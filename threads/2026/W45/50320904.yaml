  author: simiones
  text: This isn&#x27;t really true.<p>For example, the special theory of relativity
    doesn&#x27;t work if space-time has any &quot;lowest scale&quot; (i.e. if the
    distance between any two events can be expressed as n * min_dist, where n is an
    integer and min_dist is a constant that has the same value for all observers),
    it you can&#x27;t infinitely sub-divide it, since then lengths couldn&#x27;t contract
    the way that the Lorrentz transforms predicts. Lots of math in QM and QFT also
    requires space and time to be continuous for other reasons as well.<p>Also, none
    of our current laws put any kind of limit on the life span of the Universe as
    a whole, so space-time is also infinitely increasing, even if heat death or big
    crunch models are correct.<p>Of course, none of this is provable per se - it is
    fundamentally impossible to run an experiment in finite time that proves whether
    something is finite or infinite. It could be that SR and QFT are wrong in their
    continuous space assumptions, but only in ways that are too subtle to measure.
    Still, as it stands, we don&#x27;t have any theory of how the world works which
    allows for a discrete space-time, even as an approximation - we <i>need</i> space-time
    to be continuous for our current theories to work at all.
