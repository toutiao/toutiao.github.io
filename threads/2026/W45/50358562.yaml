  author: akersten
  text: "It makes me so angry that they named the CSS function `light-dark` instead
    of leaving the door open to allowing generic user- or site-specified color schemes.
    I mean it was <i>right there</i> in all the other mechanisms around this feature,
    they just had to read and think about why these are structured the way they are,
    and why &quot;light&quot; and &quot;dark&quot; were always <i>values</i> and not
    <i>keywords</i> in all of these..:<p><pre><code>    - &lt;meta name=&quot;color-scheme&quot;
    content=&quot;light dark&quot;&gt;\n    \n    - :root { color-scheme: light dark
    }\n\n    - @media (prefers-color-scheme: dark) { }\n\n    - &lt;picture&gt;&lt;source
    media=&quot;(prefers-color-scheme: dark)&quot;&gt;\n</code></pre>\n.... and then
    we&#x27;ve got `light-dark()`, the goofy looking dragon hanging out to the side
    of these majestic, forward-thinking parts of the specification.<p>Did they not
    look at the prior art and notice that &quot;one of these things is not like the
    other?&quot; All the other pieces of this puzzle, conceivably, could have one
    day had something like `:root { color-scheme: halloween }` or `@media (prefers-color-scheme:
    supercontrast)` but no, we&#x27;re just going to cement `light-dark()` as the
    only two possible color schemes we&#x27;d ever want to switch between forever."
