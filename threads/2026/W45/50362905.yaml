  author: anonym29
  text: GP isn&#x27;t proposing using closed proprietary models over an API, they&#x27;re
    proposing having local hardware serving open weight models at your house&#x2F;apartment
    being remotely accessible through an overlay network like Tailscale. The idea
    being that local inference is very hungry for power and thermal budget, so you
    run the inference somewhere that power and thermal headroom is abundant (your
    house&#x2F;apartment, on a tower, or dedicated unified memory boxes like DGX Spark,
    Strix Halo, Mac Studio, etc) and then remotely utilize that inference from a regular
    laptop. You still get all of the benefits of local, private AI inference, without
    having to expend a laptop&#x27;s limited power and thermal budget on doing the
    inference on the laptop itself.
