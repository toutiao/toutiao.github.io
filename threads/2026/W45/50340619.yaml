  author: mmooss
  text: IMHO NIST advice is highly reliable but it&#x27;s often too complicated to
    be useful, which seems to be the case here (that&#x27;s up to you, of course).<p>Otherwise,
    you need to start with an idea of what valuables you have and what threats - hackers?
    lawsuits? competitors? how well-resourced? - you&#x27;re protecting against. No
    security will be perfect. You need to make it more expensive to steal your data
    than it&#x27;s worth to the attacker.<p>A few general tips off the top of my head:<p>*
    As much as possible, don&#x27;t store anything on a computer that you don&#x27;t
    want to read in the news or hear read to you in court. The safest data doesn&#x27;t
    exist.  For any communications, set a retention period (e.g., delete messages
    in 30 days), and just save separately anything you need to keep.<p>* Store confidential
    data (passwords, credit card numbers, anything that can cost money or reputation)
    only in a secure database; the only exception is when the data is actually requird.
    Password databases, if they have long-enough fields, can work here. Do not keep
    it in emails - don&#x27;t email around passwords, credit card numbers, etc.; otherwise
    when the hacker accesses your email, all is lost. This especially applies to confidential
    client data - you don&#x27;t want to have to explain to all your clients, &#x27;you&#x27;re
    confidential data might have been stolen - I don&#x27;t really know if they hacker
    found it or will use it.&#x27; With a secure database, you have peace of mind.<p>*
    Use Apple products. They prioritize security and have the resources to deliver
    on it; they are the fastest route to security. Windows&#x27; value is to larger
    organizations managing large numbers of computers. Linux is too complicated to
    secure for non-technical users (and probably isn&#x27;t as secure as Apple). It
    does require trusting Apple, but you need to trust someone.<p>* Use Signal for
    communication, as much as possible.<p>* Security is much too hard to do yourself.
    Depending on need, use products that a vendor remotely manages (but then you need
    to trust the vendor). Use your firewall to filter viruses, though that&#x27;s
    imperfect and you need to be careful about it slowing down throughput.
  score: 0
