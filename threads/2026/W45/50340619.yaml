  author: lbriner
  text: These sorts of guides, although well-intentioned, are almost invariably very
    ineffective. It is like asking a techy to produce a cyber-security guide and getting
    a PDF document with a ton of text and tables in it instead of stepping back and
    thinking about it.<p>If you want market penetration, you should instead:<p>1)
    Brand it to something that people can recognize on its own website &quot;Cyber
    Basics&quot;, &quot;A simple set of guidelines from the people who protect the
    USA&#x27;s infrastructure&quot; or whatever. Give it branded colours, a logo and
    put it in the media so people recognise it.<p>2) Think about the UX. You will
    have people with 0 knowledge, people with IT knowledge but no cybersecurity knowledge,
    people with a bit of both and you need all of them to have access to this data
    one size does not fit all.<p>3) We have had web applications for decades now,
    why are you producing a PDF? Have interactive content that people can click through,
    maybe some intro videos, maybe the scary stats, the details for the IT people
    etc.<p>4) Make sure that the information is up-to-date, which the PDF will invariably
    not be since it is likely to involve various cycles of approvals and production
    before the next version is ready.
