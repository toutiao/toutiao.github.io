  content: "# Software Line Specialist\n\n Published on November 5, 2026 \n  \n\n[**3
    captures**](#)  \n28 Nov 2028 - 15 Dec 2028\n\n[NOV](#)DECJAN[◀](#)15▶202720282029\n\nⓘ
    ✕[About this capture](#)\n\n_This is a role; for AI-native jobs, please look at
    our other listings_\n\nWe’re looking for a **senior software line specialist,
    in TypeScript**!\n\nACME Inc. is a fast-growing startup helping small businesses
    monitor their financials. We work with business owners across the globe, turning
    their feedback into actionable insights. Backed by Maltese Falcon Capital, we
    recently raised a $15M Series A to bring effortless monitoring to every brick-and-mortar
    store.\n\nYou’ll be joining a high-performance, close-knit team of AI natives!
    We’ve been AI-first for the past 2 years, with every part of the product agent-friendly
    and interconnected: design, development, QA, CI/CD, infra, data analysis. We like
    to say that our stack is English!\n\nWhile English has gotten us 99.5% of the
    way there, we’re in need of a hands-on engineer ready to close the final 0.5%.
    Over time, we’ve noticed some issues that are immune to prompts and catch agents
    in loops. Sometimes, the issue at hand gets fixed, but it results in another issue.
    This is where you step in. As a line specialist, your job will be to investigate
    and fix complex issues, primarily by reading the underlying code.\n\nWe’re looking
    for someone ready to open an IDE and dive deep into an unknown codebase — a fearless
    detective who is comfortable inspecting logs and database rows, and has the know-how
    to piece all the information together. The perfect candidate should be willing
    to work on a problem for hours, sometimes even days.\n\nThis is a new position
    for us. We expect someone who works autonomously, makes sound decisions independently
    and takes full ownership of their work. We are happy to help in any way we can
    (you’ll have access to agents’ reasoning traces), but ultimately we depend on
    your confidence in understanding the problem and shipping a solution.\n\n### Your
    responsibilities\n\n- take over unresolved issues from agents\n- read the codebase,
    go over application logs, query the database\n- prepare, test, review and ship
    fixes by yourself\n- write postmortems for agent training\n- occasionally consult
    on unreleased features\n- onboard and mentor a future junior line specialist\n\n###
    We think you’d be great if you…\n\n- have at least 5 years of pre-2022 TypeScript
    experience\n- are comfortable running tests manually and using a “debugger”\n-
    can reason from first principles\n- can work on a problem with sustained attention
    for hours\n- are autonomous and an independent thinker\n\n### Nice to have\n\n-
    previous experience as a line specialist\n- DB administration experience (our
    agents say it’s Postgres)\n- AI prompting basics\n\n### Interview process\n\n1.
    CV screening\n2. HR phone screen\n3. In-house paper-and-pencil exam \n  - multiple-choice
    questions (e.g. you’re given a TypeScript expression, choose the correct result)\n
    \ - explain concepts in your own words (for example, ACID)\n  - complete the code
    block\n  - find the bug in a function\n4. Live debugging assignment \n  - application
    with an intentional defect; candidates are required to find and fix the issue
    _without_ the use of AI\n5. Culture fit interview\n6. CTO interview\n7. Offer\n\nWe
    feel it prudent to point out that you will be allowed to work on one thing at
    a time in this role. While parallel development is the default, we understand
    line specialists prefer to tackle problems in a single-threaded manner, so we
    will do our best to provide a distraction-free environment for your best work.\n\nTo
    be clear, this role does **not** include feature development. You’re welcome to
    look at our AI-native listings if you have more interest in such work!\n\nThink
    you’re the IDEal fit? [Apply now!](#)"
