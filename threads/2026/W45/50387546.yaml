  author: tobblegobble
  text: I&#x27;m just going to paste my comment from another post since it is applicable
    here too, maybe even more so.<p>I&#x27;ve had really great results with cheap
    flash agents using a system that has a parent agent that spawns 2 sub agents.
    They remain active throughout the whole session and don&#x27;t lose context.<p>The
    2 sub agents get the exact same prompt and tools as each other and they independently
    answer but before responding back up to the parent they exchange their findings
    which must be backed up by a citation and then debate their findings and citations
    repeatedly until they can agree on correctness of all points. They are also heavily
    encouraged to never assume and always verify with the prompt and tools and guards
    where they can be realistically enforced.<p>It churns through tokens but tokens
    are crazy cheap with some of the plans out there. Could Opus one shot most of
    those same queries in like 1&#x2F;4 time? Yep, but that&#x27;s not the point for
    me.<p>DeepSeek Flash for parent then DeepSeek Flash and GLM 5.3 flash as the debating
    subagents gives best overall results in my experience.<p>For context I do equal
    parts sysadmin&#x2F;devops and having them write software
