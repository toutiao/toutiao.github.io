    too much handholding for me. It&#x27;s scientific reasoning is more confident
    as well, which would be great if it were also more correct.<p>Open weight models
    are generally more humble when working at fronteir, seek human input more reliably
    on thi gs they have no buisness deciding on, and can be trusted to not fuck up
    codebase in some way. Also, the way claude talks by default and tends towards
    even with all the &quot;use this standard or that&quot; tricks, grinds my gears
    in a way that drive me postal.<p>So, all in all, the shit prose, the constant
    oversight robbing me of attention better spent elsewhere, and high cost, and seemingly
    correct and difficult to catch errors on first pass make avoidance&#x2F;non-reliance
    a nobrainer.<p>When dumb models are right, they&#x27;re right, because likely
    its a solved problem elsewhere, and when they&#x27;re wrong its quite transparent.
