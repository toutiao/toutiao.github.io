    (claude -p &quot;...&quot; or SDK&#x2F;ACP mode), they apparently charge you 70%
    more usage; you have to use their apps directly and interactively to get the full
    benefit of a subscription. Also, Anthropic has the lowest cache TTL at 5 minutes,
    which can really hurt for interactive use. Contrast that with OpenAI&#x27;s default
    of 30 minutes (and according to a recent post by Tibo, apparently 12 hours for
    subscriptions, though I haven&#x27;t verified it myself) or the fact that DeepSeek
    caches prompts for three days (which is a major reason for their extremely high
    cache hit rate and how cheap they are in practice), and it doesn&#x27;t look like
    THAT great of a deal in comparison anymore. It is of course still good value for
    money, just not as great as it may look at first glance.<p>[1] At least before
    the recent usage bump to OpenAI&#x27;s Pro plans, though that doesn&#x27;t seem
    to include the Plus plan if that is what you are on.
