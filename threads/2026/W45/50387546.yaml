  author: dofm
  text: They probably don&#x27;t. But some words acquire their full sense meaning
    from historical and-non-programming context.<p>Words that are or were fairly common
    in tech circles — &quot;bailiwick&quot;,  &quot;gatekeeper&quot;, &quot;daemon&quot;,
    &quot;boundary&quot;, &quot;infer&quot;, &quot;method&quot;.<p>It&#x27;s true
    to say that most of these words have some specific meanings in tech, but you don&#x27;t
    necessarily want the LLM to have only those narrow meanings when you are talking
    to it. A broader grasp of the word means the LLM won&#x27;t go down a specific
    pathway before understanding you by analogy. That broader grasp comes from non-programming
    understanding.
