  text: A problem I frequently have with setting up testing policies is in convincing
    people to test what they can reliably test with the tools, and know what they
    cannot test.<p>Inconclusive tests to increase automation and coverage accomplish
    less than nothing. The opportunity cost, the loss of trust, the conflation of
    the manual testing surface area, are all worse than doing nothing.<p>The point
    of testing is to establish a level of trust. That level doesn’t need to be 100%.
    It can’t be 100% regardless. So you do what you can, and you solve the remaining
    problem a different way. But you need to know it’s there to address it, and the
    smoke and mirrors fight that.
