  text: When you say &quot;simple takes effort&quot;, that&#x27;s kind of what I meant
    by &quot;simple is <i>hard</i>&quot;. It takes work, it takes looking at the problem
    for a long time (Kepler studied orbits for <i>years</i>) until you understand
    it well enough to have the epiphany that lets you reduce the complexity down to
    &quot;oh wait, orbits are <i>ellipses</i> and that solves everything!&quot;. Since
    you preceded your statement that &quot;simple takes effort&quot; with a disagreement
    about simple being hard, I wonder what you thought I meant by &quot;simple is
    hard&quot;.
