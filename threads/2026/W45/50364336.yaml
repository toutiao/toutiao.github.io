  author: dbingham
  text: While I whole-heartedly support the goal of actually bug free software and
    treating software engineering as a serious engineering discipline, as an experienced
    software engineer who also studied physics, I have to challenge your base premise
    about what it means to make engineering explicit.<p>Namely:<p>&gt; The only way
    to do that is to make your code provable.<p>Proofs are a mathematical concept.  They
    only work in the abstract world of mathematics where everything is perfectly logical.<p>Engineering
    exists in the real world. The physical realm where our mathematics are only imperfect
    models of what actually exists. Removing bugs through physical engineering requires
    persistent trial and error until you have found all the places where our mathematical
    models don&#x27;t adequately represent the real world.<p>It&#x27;s the same in
    software engineering, which involves cobbling together a myriad of systems not
    all designed to talk to each other and massive, ever changing codebases where
    perfect knowledge is impossible.<p>So yes, we should be trying to engineer bug
    free code. But that&#x27;s really more a matter of changing our resource allocation,
