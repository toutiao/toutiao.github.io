  author: Loquebantur
  text: 'LLMs can, in principle, do everything humans can. And arguably more. &quot;Right
    now&quot; is how long? People are slow.<p>&quot;Provable&quot; essentially means,
    you have explicit operators acting on explicit states in an exhaustively defined
    way that preserves &quot;truth&quot;, explicitly defined invariants.<p>A finite
    thing you can argue over deterministically.<p>Obviously, &quot;you&quot; there
    is an LLM, the machine your code is run on has to be defined in that very same
    exacting manner and so on.<p>That still isn&#x27;t enough, you need <i>abstraction</i>,
    a hierarchy of categories that preserve your <i>intent</i> and accurately describe
    the problem space.<p>&quot;Programming&quot; then is solving an inverse problem
    over that hierarchy, filling in the blanks sensibly on your way down through the
    model hierarchy, all the way to atomic instructions your (proven) hardware understands.<p>Those
    layers of <i>proper</i> abstraction is what&#x27;s largely missing currently.
    Or rather, is merely vaguely approximated.<p>All of which is to say: <i>yes, the
    current state is a mess</i>. Resolving that is far from easy.<p>But you really
    have no choice, that mess is transparent to large-enough LLMs. Security by obscurity
    only goes so far.'
