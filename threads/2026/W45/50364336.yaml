  author: skydhash
  text: "&gt; For example, languages that allow pointer arithmetic, unchecked array
    access, or use-after-free have huge opportunities to make security errors<p>All
    languages are built on top of an ISA, whether directly (assembler), or by mapping
    it to an abstract machine. The you have the dreaded “eval” function. Then because
    a lot of software lives on top of an OS, there’s all the virtualization that is
    going on (timesharing, virtual memory, filesystems,…). Memory safety is nice,
    but it doesn’t help you when the attacker send valid, but malicious data from
    a compromised source, or by exploiting a logic error.<p>And for kernel code, where
    everything is accessible to everyone, it’s much a matter of discipline, especially
    with so much hardware interrupts and syscalls from userspace going around. Most
    kernel code has very short lifecycle, it’s the data that is long lived, and it’s
    a shapeless blob in memory that you have to trust the other party kept in good
    shape."
