  author: hinkley
  text: Knuth seemed more interested in Tony’s notion of “obviously no bugs”. There
    always seemed to me to be a self-evident flavor to his literate code notions.<p>I
    say that as someone who sees Knuth as problematic in other respects starting in
    the 2010’s. Physics governs so much of computational complexity now that I think
    the idealized form he presents has transitioned from merely holding us back to
    being crippling. Only game designers, hyperscalers, and an esoteric few of the
    rest of us seem to understand the vast gulf between theory and practice that has
    developed in the five orders of magnitude that compute power has experienced since
    his first edition.<p>Many, many things that are considered constant in his world
    are instead logarithmic to the size of the data being managed, or in the case
    of very large data sets, order n^1&#x2F;2 because of speed of light and thermodynamics.
    That vastly reorders the toolbox, because second shelf algorithms now rival or
    beat the top shelf ones and some options even farther down now become interesting
    for novel situations.
