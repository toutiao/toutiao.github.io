  author: bunderbunder
  text: 'My complaint is that LLMs’ approach to making code robust is something we
    used to pejoratively describe as “enterprisey”.<p>Oftentimes there are two broad
    ways to fix a gap in the logic. You can eliminate the source of it, which often
    involves refactoring but tends to result in less code and cleaner, more comprehensible
    logic. Or you can leave the gap there, but attempt to render it safe by adding
    extra logic to detect and handle the error condition. This reduces changes to
    existing code, but makes the overall system more complicated.<p>You can’t just
    indiscriminately favor one approach. Which one of those is best depends on the
    situation. The deciding factor is often something like a time constraint that
    you can’t know just by reading the code. You might need to talk to your team before
    deciding.<p>But LLMs don’t do that. They always choose option B: slap a bandage
    on it. Keep on adding more epicycles. In the 2000s we learned that, over time,
    always choosing this approach inexorably leads to codebases that are brittle,
    bloated and expensive to maintain.<p>So the problem, from my perspective, isn’t
    that we shouldn’t be coding defensively. It’s that LLMs encourage us to do it
    in a way that we’ve already learned is unsustainable.'
  score: 0
