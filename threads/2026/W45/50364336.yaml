  author: keybrd-intrrpt
  text: "&gt; I just had a discussion with the AI recently about whether to duplicate
    the code something used or refactor it so both places used the same code. The
    decision was to duplicate the code, but make notes (and a ticket) to refactor
    it later<p>I wonder if a refactor is even necessary.<p>Concepts like KISS, DRY,
    etc. are largely human-centric. They&#x27;re meant to make code easier to write,
    understand, and maintain - for <i>people</i>.<p>Duplicating code was traditionally
    &quot;bad&quot; because it increased maintenance costs, risked divergence, and
    added cognitive overhead for human developers.<p>But with coding agents, some
    of those tradeoffs start to change. An agent can find and update duplicate implementations
    in seconds. It doesn&#x27;t need to maintain the same mental map of a codebase
    that a human does.<p>And if we have good specifications and comprehensive tests,
    behavioral divergence should be detectable and correctable. In fact, duplication
    can offer an advantage over shared abstractions: isolation. Changes to one implementation
    don&#x27;t risk breaking unrelated consumers of shared code, and each implementation
    can evolve independently.<p>Maybe we won&#x27;t need as many high-level abstractions,
    or eventually even some of the architectural patterns we consider best practices
    today.<p>If the cost of writing and maintaining code approaches zero, perhaps
    we should optimize less for human readability and more for runtime performance,
    memory efficiency, isolation, and correctness.<p>We might even regain some CPU
    and memory efficiency by eliminating layers of indirection, virtual calls, and
    abstractions that primarily existed to make code manageable for humans.<p>Perhaps
    the optimal architecture for AI-maintained software is fundamentally different
    from the optimal architecture for human-maintained software.<p>A lot of our software
    engineering best practices are based on the economics&#x2F;ergonomics of human
    maintenance. What happens when those fundamentally change?"
  score: 0
