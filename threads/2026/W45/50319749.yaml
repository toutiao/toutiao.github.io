  author: beachy
  text: We have frequent power cuts and follow this same philosophy.<p>Our first line
    of defence is the solar system&#x27;s battery. When power goes out, that will
    keep things running for some time with the big optional loads switched off - e.g.
    hot tub, hot water cylinder and pool.<p>If the sun&#x27;s shining we can run like
    this for a long time.<p>In a solar drought, when the solar battery runs low, the
    next step is to plug the EV in via V2L and use it as a generator to charge the
    solar battery. EVs have comparatively huge batteries, so at the cost of losing
    mobility, which may be important in an emergency, this will keep things going
    for even longer.<p>One great feature of using an EV is you can drive to a fast
    charger, charge up in an hour, and transport all that energy back home.<p>The
    final fallback is to plug the 2KW petrol generator in to charge the solar battery.
    This is enough to keep things going forever assuming a petrol supply. A petrol
    generator is nicely portable and can be loaned to less prepared neighbours who
    likely have their own petrol.<p>The key to it all is the solar battery. That gives
    you uninterrupted power while mucking around with the alternate sources. It doesn&#x27;t
    even have to be all that large if you have an EV.
