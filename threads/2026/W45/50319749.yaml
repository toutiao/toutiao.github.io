  author: wolrah
  text: To be fair, losing power in a winter storm can be equally dangerous because
    while the gas might still work your central HVAC system requires electricity to
    run its blower, power the thermostat, etc.<p>That said, you are still absolutely
    correct about the proportion of the population that&#x27;s really at risk of extended
    blackouts being incredibly small.<p>In the US 80% of the population lives in urban
    or suburban areas, where for the most part power outages are measured in either
    seconds or hours and while extreme weather or bad drivers might sometimes cause
    enough damage that it takes a few days to get power back on to a specific neighborhood
    it&#x27;s rare outside of large-scale natural disasters for the power to be out
    over more than a couple of neighborhoods.<p>I live in an older suburban neighborhood
    in Ohio and the one time we had power out for more than 12 hours the literal next
    street over still had power.  Even if my whole neighborhood was out for a week,
    the nearest fast chargers to me in either direction are both technically in another
    city and on an entirely different section of the grid.  If power is out for all
    of them for days on end stuff is really messed up to a point that FEMA and&#x2F;or
    the National Guard would likely be involved, and that&#x27;s beyond the level
    of disaster I&#x27;m really worried about.<p>Obviously those who live in low-lying
    coastal regions like Florida and the Gulf Coast where a disaster is pretty much
    a given or those living in extremely rural areas where restoring service is going
    to be deprioritized have different risk assessments and if I were in their position
    I&#x27;d be looking in to trying to be as grid-independent as possible, have enough
    battery power and solar generation to support living comfortably without requiring
    grid input under normal conditions and to support &quot;emergency mode&quot; operation
    with half your system or more destroyed in case of a major disaster.
