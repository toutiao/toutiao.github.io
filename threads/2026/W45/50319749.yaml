  text: My biggest problem with batteries for grid outages is that the only outages
    I am actually concerned with would drain them to zero before the outage is resolved.
    For short term, smaller&#x2F;portable batteries are fantastic at bridging a few
    hours. Plug the wifi &amp; fridge in and you can sometimes go for 2-3 days.<p>I
    am not aware of any economically feasible way to run my 5+ ton HVAC system full-time
    on batteries after a hurricane just reset all the infrastructure, and you do need
    to run it full time because of the insane humidity and latent heat that follows
    a tropical system. Doing the math, I&#x27;d need something approaching 800kWh
    of storage to ride through this kind of event (7+ days). This is approaching half
    a million dollars in batteries. I can install an <i>extremely</i> nice 1800 RPM
    generator for ~15% of this cost, which would also include a year&#x27;s worth
    of propane buried on the property.<p>I think a simple generator on an ATS remains
    undefeated from an engineering perspective. If you have an air cooled unit, the
    maintenance is not much more complicated than with a lawnmower. You just have
    one extra spark plug to deal with, and sometimes the oil pressure sensor needs
    replacing. I can get my stubborn Honda generator to start with all kinds of weird
    tricks. If my Ecoflow battery starts to act weird, I have very little recourse
    by comparison.
