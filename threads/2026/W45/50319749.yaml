  author: ssl-3
  text: 'That&#x27;s a valid concern for you where you are.<p>For me where I am, things
    are different.  We don&#x27;t get hurricanes here.<p>Our longest power outages
    tend to follow ice storms.  We need heat because these things happen in the winter
    time when it&#x27;s cold outside, and that&#x27;s dangerous for various human
    and infrastructure reasons (pipes freezing and breaking).<p>But I use natural
    gas for heat and I don&#x27;t recall ever having a weather-related natural gas
    outage.  So that&#x27;s helpful.  And ice storms tend to happen when it&#x27;s
    cold, but not <i>damn</i> cold -- that helps, too.<p>My furnace uses about 600W
    of electricity while running.  It does not run all the time.  According to my
    charts on a random day&#x2F;night cycle last February with a high of -8C and a
    low of -16C, it was running with an average duty cycle of about 30% over that
    period.<p>600 Watts × 30% × 24 hours = around 4.3kWh for that 24-hour period,
    just for heat.<p>I&#x27;ll also need to keep the fridge cold, and some lights
    running, and will surely be getting some use out of a laptop and some network
    stuff.<p>A common-enough home battery size is 48v, 100Ah, or 4.8kWh.  They cost
    around $1,000 right now (some more, some less) in DIY-friendly shapes.<p>As a
    spitball effort:  If I live more-conservatively and dial back the thermostat (it
    is a power outage, after all), I can probably get enough power to live a productive,
    comfortable-enough life on one such 4.8kWh battery, per day.  Ish.  If I&#x27;m
    careful.<p>So for batteries, alone, I&#x27;m at $1,000 per day.  I&#x27;ll need
    an inverter as well.  That can be either minimal or extensively integrated, grid-tied
    or not, solar-accepting or not, and etc.  Let&#x27;s just pin that at $3000, with
    the wiring and accoutrements, and assume I&#x27;m doing the labor for free.<p>I&#x27;m
    now at ~$10k to survive a week of power outage at home in the winter on batteries
    alone.  That&#x27;s expensive[1], yes, but a whole lot less than half a million
    bucks.  A whole lot less than a very nice, installed, low-RPM generator, too.  :)<p>...except,
    realistically:  It&#x27;s more like $13k for a week, because future-me will surely
    not be as careful with energy use as present-me suggests that I should be and
    3 more batteries adds some safety capacity.  :)<p>---<p>And that can be supplemented.  Solar
    input can obviously be used (if available), but may be limited by winter sunlight
    conditions and storm accumulation.<p>Gas-fired generators can also be used.  An
    inexpensive-ish portable inverter generator does the trick well when combined
    with, say, an EG4-6000XP do-all inverter.<p>That particular inverter wants to
    see at least 2 of these batteries connected, so let&#x27;s play with that minimum:  2
    batteries, 1 inverter, 1 generator.  ~1.4 batteries worth of load every 24 hours,
    as with the safe $13k figure above.<p>The generator can be run pretty hard (it
    has a continuous max rating for a reason), and it can be run intermittently.  The
    EG4 allows programming of generator input power.<p>So let&#x27;s pick a generator:  Champion
    201509.  It can do 7kW continuous, and we&#x27;ll load it to 75% of that, or 5,250
    W.  From this 5,250W, it provides for the house&#x27;s present consumption while
    it runs, and it restores the charge of the two batteries to 100% SoC[2].<p>If
    it is run once per day, it can do this job in about 2 hours and then be switched
    off until tomorrow.<p>If it runs like this once per day for a week, I guesstimate
    that it uses about 11 gallons of gas over this week.  That&#x27;s a very manageable
    quantity of fuel.<p>So we&#x27;re at $2k for batteries, $3k for inverter+stuff,
    and $2k for an appropriate generator.  That&#x27;s $7k to run ~indefinitely, or
    as long as I can keep bringing in fuel, with enough power to survive a blackout
    (with heat, lights, refrigeration, some entertainment) long-enough on batteries
    alone for the roads to become passable and then decide if I&#x27;m making a run
    to fill up the gas cans with fresh fuel.<p>Not so bad for a relatively quiet time
    of living in a temporary blackout, and the house gains a gains a big UPS for some
    stuff (which is nice).  (The installed gear also offers an easy entry into solar
    power.)<p>But I&#x27;m not in hurricane country.  And while I do love me some
    aircon, our summers are pretty survivable, usually.  My needs are not the same
    as your needs are.  :)<p>---<p>[1]:  Except, for the price of this kind of self-sufficiency:  Draining&#x2F;blowing
    out the plumbing and staying at a hotel or with friends&#x2F;family for a few
    days in an unaffected area might be a better option.  The cheap portable air compressor
    I have doesn&#x27;t leak down at all, so it&#x27;s always got a full tank of air
    while just sitting there unplugged.  I&#x27;ll figure something out:  Power outages
    are very quiet, creative times.<p>[2]:  100% SoC?  Yep.  It&#x27;s a temporary
    blackout where the batteries are operating as a UPS, not a long-term operation
    where the typical 20%-80% SoC goals are important for longevity.  They won&#x27;t
    stay at 100% for very long, anyway.'
