article:
  url: https://www.jefftk.com/p/bidirectional-charging-during-grid-outages
  title: Bidirectional Charging During Grid Outages
  fetch_status: success
  content: "- [Jeff Kaufman](/)\n- [Posts](/p/index)\n- [RSS](/news.rss)\n- [◂◂RSS](http://www.jefftk.com/news/back_from_2601.rss)\n-
    [Contact](/contact)\n\n* * *\n\n| \n### [Bidirectional Charging During Grid Outages](/p/bidirectional-charging-during-grid-outages)\n
    | September 7th, 2026 |\n| _[preparedness](/news/preparedness)_, _[solar](/news/solar)_,
    _[tech](/news/tech)_ |\n\n[David](https://davidroodman.com/) asked a great question
    on my [solar battery system post](https://www.jefftk.com/p/considering-installing-a-solar-battery-system):
    why buy a small battery just for emergencies when electric cars have a large battery
    you can also use for other things? [1] This would be great, and seems like the
    obvious way for it to work: when the grid goes down the panels can charge the
    car when it's sunny, and the car can power the house when it's not. Unfortunately
    as far as I can tell the only way I could do this today is with a Cybertruck,
    and other systems are a long way off.\n\nThe basic problem is that while several
    manufacturers support having the car power your house when the grid is down (\"V2H\"),
    they generally treat it as a separate discharging-only mode. For example, the
    [GM V2H Bundle documentation](https://gmenergy.gm.com/content/dam/gmenergy/na/us/en/index/01-pdfs/gm-energy-v2h-bundle-user-guide-v1-2.pdf)
    says \"During a power outage, the GM Energy Home Hub safely disconnects your home
    from the local power grid and enables backup power to flow from the GM Energy
    Inverter throughout your home\" and \"Once power is restored, your GM EV will
    automatically end the discharge session and begin charging\" without any mention
    of recharging the car when the grid is down.\n\nFor Fords, automatically powering
    your house during a grid outage was a big selling point in the F150 Lightning
    marketing campaign, but [they now say](https://www.ford.com/support/how-tos/electric-vehicles/home-charging/what-is-ford-home-backup-power)
    \"The Ford Charge Station Pro, required for Automatic Home Backup Power, is no
    longer for sale\", probably because the F150 Lightning has been discontinued.
    And it _looks_ to me like even then they didn't support bidirectional charging
    during a grid outage. The only option today is V2H via a transfer switch, which
    doesn't let you charge an F150.\n\nFor Kia, there's Wallbox's Quasar 2. Unfortunately
    this is a mess where Wallbox is very enthusiastic and says V2H works, but then
    customers [run into trouble](https://www.reddit.com/r/KiaEV9/comments/1o0l8z8/quasar_2_ev9_v2h_officially_working/)
    actually trying to use it. And it doesn't work with current models, plus \"[Solar
    Charging cannot be used simultaneously with ... V2H](https://support.wallbox.com/en/knowledge-base/how-to-activate-and-use-eco-smart)\".\n\n[![](/quasar2-ev9-v2h-not-working.png)\n\n](/quasar2-ev9-v2h-not-working-big.png)\n\nThe
    only way I can see to do this today is with Tesla Powershare + Cybertruck, which
    [says](https://energylibrary.tesla.com/docs/Public/More/Powershare/InstallManual/HomeBackup/en-us/GUID-04DE7F20-2290-4489-A9A1-53F639BB85CB.html)\"If
    the system includes a UL 1741-listed solar system and there is capacity in the
    backup panel, ensure the solar system is included in the backup circuit to allow
    Cybertruck to recharge during an outage.\" But I don't want a Cybertruck, and
    (counting the cost of a Cybertruck over a vehicle we'd normally buy) this would
    be way more expensive than the [Enphase 10C](https://enphase.com/store/storage/gen4/iq-battery-10c)
    I'm considering installing.\n\nAnother possibility is that Enphase is planning
    on shipping a bidirectional EV charger, but I don't see anything more recent than
    a[2026-02-02 announcement](https://newsroom.enphase.com/news-releases/news-release-details/enphase-energy-demonstrates-global-iq-bidirectional-ev-charging)
    that they're \"targeting volume production beginning in Q4 2026\" and they say
    \"projected vehicle compatibility and bidirectional functionality will depend
    on automaker enablement, vehicle software, applicable standards, and final product
    specifications.\" I suspect it will slip into 2027, MA availability will be even
    later, and when it does come out I'd need to buy a specific new EV (expensive).\n\nI
    don't want to wait that long to get good backup power in place, since I want to
    be prepared for a world that might change quickly in the next few years. So I'll
    probably go ahead with the smaller emergencies-only battery.\n\n[1] All of this
    assumes we have an electric car. Which we don't, but our shared Honda Fit is a
    2013 and while it's been a fantastic car I don't expect it to last that much longer.
    A plug-in hybrid or full EV are possibilities for a next car. I think our families
    are unusually poorly suited for full EVs since we don't use the car much (minimal
    gas savings and pollution reduction) and a larger than typical proportion of our
    trips are long (ex: driving to play a dance).\n\n[\n ← \n Allow Babywearing Carriers
