  text: If you tell them what you are looking for, if they are honest, can say no
    or short-change you.<p>Or they can just lie and say yeah we cover that.<p>If you
    ask for their range, if they are honest, provide their range.<p>If dishonest,
    now they have to provide a range which is within the range you are looking for,
    and is probably more difficult to gauge.<p>I find it easier to lie on a yes or
    no question, than a question of quantity.<p>But in the end, if you provide a quote,
    they may save themselves money if you value yourself below market.
