  text: The paygap is just a measure of the number of women having children. What
    percentage <i>should</i> have children? If you want a zero mean paygap, the answer
    has to be zero.<p>A woman who has two children, at minimum, works two years less.
    In a (25 - 65) yr career that&#x27;s a 10% pay gap she&#x27;ll experience wrt
    a male who works the same period.<p>The paygap is just a dial which controls the
    rate of motherhood.<p>There is no &quot;per job&quot; paygap. Nor could there
    plausibly be. For if any group could be paid less to do the same work, someone
    en mass would be, thus lowering the pay for that work. (Its unclear how such a
    rich source of free output from 50% of the population could go untapped, systematically).<p>Though
    even if that logic isnt persuasive, there is no measured per-job pay difference
    at an individual level. The &quot;pay gap&quot; describes a mean difference in
    pay at population level -- when you control for total hours worked, it disappears.
