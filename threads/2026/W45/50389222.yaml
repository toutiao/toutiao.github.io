  author: aregue
  text: I have always felt that job ads should include salary information. The main
    reason is not to waste anyone&#x27;s time. Often a narrow salary range or a clear
    link between requirements and salary are much more informative than a job description.
    I have experienced to apply to a job opening and go through one or more interviews
    only to find out that the company is actually hiring for a more junior position
    than the ad copy implied.<p>A second reason is to avoid discrimination. Applicants
    that feel disadvantaged, even if they are actually qualified, may hesitate to
    negotiate for a higher salary in the same way that a other applicants would. The
    consequence is that they start with a lower salary. This applies specially to
    women. Plenty of research shows that they are less likely to negotiate their salary.<p>Research[1]
    suggests that pay transparency leads to lower average salaries because employers
    avoid paying higher wages to any one employee to avoid costly negotiations with
    others. The effect is small, around 2%, and it disappears with increasing degree
    of unionization. In my opinion this is an acceptable price to pay to reduce pay
    inequality, which often is much more than 2%. It is also a good argument for joining
    a union.<p>[1] <a href="https:&#x2F;&#x2F;www.nber.org&#x2F;papers&#x2F;w28903"
    rel="nofollow">https:&#x2F;&#x2F;www.nber.org&#x2F;papers&#x2F;w28903</a>
  score: 0
