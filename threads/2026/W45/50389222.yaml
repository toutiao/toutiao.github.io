  author: mjburgess
  text: I assume one day the racism and sexism in the commenter you&#x27;re replying
    to will be addressed.<p>Until then, you are quite correct. The pay gap is not
    a feature of individual jobs, but a population effect due to women in their 40s+
    not being in the labour force.<p>It is illegal in the UK to pay differently, and
    there are many high profile cases of this being enforced even to the point of
    absurdity (such as forcing councils to pay bin-men&#x2F;trash-collectors the same
    as female office admin workers).<p>Likewise as the <i>mean</i> pay for women is
    ~1month&#x2F;yr lower, the <i>mean</i> hours men work, as a population is ~1month&#x2F;yr
    longer. Thus there is no pay gap once you control for hours worked.<p>Incidentally,
    the only way there could be no mean pay gap across both populations would be if
    no women had children. So a non-trivial paygap merely an indirect measure of the
    birth rate.
