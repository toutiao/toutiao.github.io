    Every time I created new products my focus always went first (wrongly) to building instead to distributing and helping others to use what I created.<p>After building my thing and having all the excitement of seeing the new toy working, the promotional and communication part always felt more like an obligation, and most of the times was neglected. I always struggled to create manuals,
     videos, support content, etc.<p>So I open sourced a skill for Claude Code that helps in that last part. With some instructions and this skill, you can create product demo videos. With professional voice overs, and subtitles in different languages. Combining the browser and the terminal. Everything controlled from your AI. For example, the clip in this post was made with it.<p>It&#x27;s not going to do distribution for you, but it&#x27;s a start ;)<p><a href="https:&#x2F;&#x2F;github.com&#x2F;aaitor&#x2F;skill-video-studio" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;aaitor&#x2F;skill-video-studio</a>
