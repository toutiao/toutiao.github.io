article:
  url: https://8rank.ai/game/apple-intelligence-personal-knowledge-graph
  title: Anatomy of Apple's Personal Knowledge Graph — Eighth Rank
  fetch_status: success
  content: "[Opening](/research#opening)Played by[the Bishop (Dario Pasquini)](/pieces#bishop)+[the
    Knight (Michał Bazyli)](/pieces#knight)\n\n# Anatomy of Apple's Personal Knowledge
    Graph\n\nEvery Mac since macOS 13 (2022) ships a pair of daemons whose only purpose
    in life is to build a graph about who you are, who you know, how those people
    are related to you and to each other, how you communicate with them, where you
    go, what you do and when. In this post, we look into how this system works and
    give you a tool to peek into your own graph.\n\nThe position\n\nA family fork:
    one knight on e2 attacks White's king, queen, rook and bishop at once. White's
    pieces are the household the graph is about; the knight is the store, one move
    from every one of them. White's own last move, `18.e3`, emptied the square it
    stands on. White is in check and has one legal reply, `Kh1`; then the knight takes
    the queen. The check falls on the one who accepted the terms. What is lost is
    someone else.\n\n3r1rk1/pp2qppp/8/3p1b2/8/1NQ1P1B1/PP2nPPP/2R2RK1 w - - 1 19\n\n##
    Finding\n\nWhat if I told you that every Mac since 2022 ships a pair of daemons
    whose only purpose in life is to build a graph about you and the people around
    you: who you are, who you know, how those people are related to you and to each
    other, how you communicate with them, where you go, with whom, what you do and
    when. This graph is built on device by cross-referencing pretty much everything
    on the machine: Contacts, Calendar, Photos, Messages, Mail, location, Screen Time
    and a long tail of behavioral signals. And, more importantly, it is held as a
    queryable store that LLMs retrieve from (allegedly). Would you believe me?\n\nWell,
    that's what is happening, and interestingly enough, there is little documentation
    of how this whole mechanism works on your Mac. The closest thing to an official
    description is the man page (`man 8 knowledgeconstructiond`), and this is all
    you get:\n\n_man 8 knowledgeconstructiondmacOS 26.6.2, build 25G83_\n\n    NAME\n
    \        knowledgeconstructiond – A daemon that analyzes content on the\n         device
    to build a general purpose knowledge graph.\n    \n    DESCRIPTION knowledgeconstructiond
    analyzes the content on this device to help build a knowledge graph representing
    the device and the user. Itworks together with intelligenceplatformd, performing
    some of the\n         heavy processing tasks, to generate the knowledge graph.\n\n**Previous
    work:** To be fair, Apple's own researchers did publish a [paper](https://arxiv.org/pdf/2305.09464)
    on the techniques behind this graph construction, back in 2023. But there is next
    to nothing on how it is integrated into macOS: which versions run it, and the
    exact list of what is collected and inferred. And not a word about the \"kinship\"
    inference discussed below. Also, we personally ran into it while doing some security
    research on the Apple Intelligence bundle in macOS 26 in August 2026; but a few
    months before, Nic Lydon came across the same database and wrote it up in [I Built
    a Personal Knowledge Graph. Apple Had Already Built One on My Laptop.](https://dev.to/niclydon/i-built-a-personal-knowledge-graph-apple-had-already-built-one-on-my-laptop-54l8)
    And even more recently, a forensics tool went looking on the phone: in September
    2026, Alexis Brignoni taught [iLEAPP](https://github.com/abrignoni/iLEAPP) to
    read the same store on iOS, where `graph.db` and the `ontology.db` that decodes
    its predicate codes sit under `/private/var/mobile/Library/IntelligencePlatform`;
    he writes it up in [Reading the iPhone Knowledge Graph, and Checking Its Work](https://leapps.org/blog-post?post=apple-intelligence-platform-knowledge-graph).\n\nBut
    we go a bit deeper.\n\nThis blog post is an account of some analysis work we carried
    out on what the knowledge graph actually does, so that you (the user) can get
    a better understanding of how this mechanism works, and some clarity on what the
    graph holds about you and your family and friends. Everything in it was collected
    on macOS 26 (26.6.2 at the time of writing).\n\nTo this end, we open-source a
    local dashboard ([iKnow](https://github.com/8rank/iKnow)) you can use to read
    the content of your personal knowledge graph on your Mac.\n\nFinally, we derail
    a bit and look into what we do best: weaponizing and exploiting. We run a thought
    experiment (one that applies to any such personalized system) and show what happens
    if such a knowledge base ends up in the wrong hands, and how a \"privacy single
    point of failure\" can be exploited to threaten you in ways you may not have considered
    before (when combined with an abliterated LLM).\n\n## What's in the personal knowledge
    graph?\n\nThe two daemons keep their work in `~/Library/IntelligencePlatform`,
    a directory of SQLite databases (fifty-one databases) stored in plaintext but
    located in a zone protected by TCC Full Disk Access.\n\nLikely, the most interesting
    is `graph.db`. It is a triple store written in a vocabulary of 181 entity classes
    and 278 predicates: every row is a subject, a predicate and an object. The subject
    is an entity (a person, an app, an event); the object is either a plain value
    (a name, a handle, a date) or another entity, which is where the graph gets its
    edges. The predicate is the interesting part: it says what kind of relationship
    the system believes holds between the two.\n\nan edge, and the rows it is stored
    as\n\n_One edge of the graph (synthetic data): a person and the organization the
    store holds as their employer. PS500 is the id predicate.json gives employer,
    and its range is not an organization but a relationship type — so one edge is
    two rows sharing a relationshipId, one naming the kind of relationship and one
    pointing at the other entity. The forty-six relationship type classes in the table
    below exist to carry exactly that, which is what lets an edge hold a confidence
    of its own and be retracted later._\n\nMost of what the two daemons do is populate
    those predicates, and the tables kept beside them, from everything the OS will
    let them read. Into the graph go Contacts; Photos (faces); Calendar (titles and
    attendees); Family Sharing (including the age of every member); the Medical ID
    emergency contact in Health; events and contacts Siri Suggestions finds in Mail
    and Messages; people donated by apps through App Intents; and installed apps.
    Beside it, in tables of their own, sit who appears with whom in your photos; the
    communication log (who, when, which app, which direction; no content), which also
    pulls from your other devices; location and movement; and a long tail of device
    signals (screen locked, Wi-Fi, Bluetooth, charging, ambient light, and a stream
    named `ContextualUnderstanding.PhysicalSocial` whose record format lists people
    by name, phone and email, each with a start and an end time; it reads like a log
    of who was physically around you, though we never saw it filled in).\n\n## What
    is inferred\n\nThe complete list of the 181 entity classes:\n\nthe 181 entity
    classes in class.json\n\n| Class | Label | Group | Mechanism found? |\n| --- |
    --- | --- | --- |\n| `SB56` | entity | core | implemented |\n| `SB104` | person
    | core | implemented |\n| `SB152` | place | core | implemented |\n| `nm_topic`
    | topic | core | implemented |\n| `SB65` | event | core | implemented |\n| `nm_document`
    | document | core | could not find mechanism |\n| `SB473` | home | core | could
    not find mechanism |\n| `SB10` | organization | core | implemented |\n| `SB2`
    | group of humans | core | implemented |\n| `SB144` | software | core | implemented
    |\n| `SB193` | organism | core | implemented |\n| `SB198` | agent | core | implemented
    |\n| `SB83` | concept | core | implemented |\n| `SB400` | occurrence | core |
    implemented |\n| `SB60` | role | core | implemented |\n| `SB197` | siribase type
    | core | implemented |\n| `nm_knowledgeSource` | knowledge source | core | implemented
    |\n| `SB170` | time | core | could not find mechanism |\n| `SB175` | group | core
    | implemented |\n| `SB470` | device primary user | person | could not find mechanism "
