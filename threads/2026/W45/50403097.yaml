  author: DSpinellis
  text: My understanding is that collecting these data and constructing the knowledge
    graph violates the European General Data Protection Directive (GDPR).  According
    to the GDPR, personal data (such as an email&#x27;s sender name and email address)
    are provided for a specific purpose (in the case of sending an email, for identifying
    the sender and facilitating email replies).  Similarly, a calendar invitation
    is provided to organize a meeting.  Processing that data for a different purpose
    (as described here, for constructing a knowledge graph) without the subject&#x27;s
    explicit consent is unlawful.
