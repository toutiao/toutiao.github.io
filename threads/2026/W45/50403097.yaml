  author: thomascountz
  text: 'At one point in my life, I would&#x27;ve found this data fascinating (if
    it were opt-in, perhaps)! Now, I find it exhausting.<p>A similar discussion came
    up recently with Siri Recap[1], where some expressed how useful they thought it
    was and that, as a party to the conversations it summarizes, there was very little
    moral or ethical concern. But I have a social concern.<p>If I&#x27;m having a
    chat with someone, there&#x27;s a milieu constructed around the fact that not
    everything will be remembered verbatim. There are all sorts of social and contextual
    cues that can easily get lost if listening gets replaced by flat relentless transcription.<p>With
    Recaps and this social graph (were it to be productized), the informal fluidity
    in the way we relate to one another starts to go away, and the expectations that
    follow from that become artificial and burdensome. In the same way that autocorrect
    has made typos unacceptable, how could you ever be forgiven for forgetting the
    name of your colleague&#x27;s new nephew or the Italian village that your neighbor
    took a spontaneous boat trip to while on vacation last year?<p>[1]: <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49641401">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49641401</a>'
