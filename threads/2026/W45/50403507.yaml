  author: azuanrb
  text: Electron has always been about shipping cross-platform apps quickly, at the
    cost of higher memory usage and potentially worse performance. With or without
    LLMs, its core value proposition remains the same. LLMs simply amplify the framework’s
    existing strengths.<p>Raycast, originally a native macOS launcher, recently released
    v2 using a hybrid architecture. It’s not Electron, but it follows a similar approach
    to Spotify’s desktop app, using web technologies inside a native shell.<p>The
    memory usage is still pretty significant. It’s using around 350–450 MB at idle
    and can sometimes reach 1–2 GB depending on the workload. The upside is that they
    can now share most of their code across macOS and Windows and evolve beyond being
    just an app launcher.<p>It’s always been about trade-offs, and LLMs don’t fundamentally
    change that.
