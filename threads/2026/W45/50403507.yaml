  author: jasomill
  text: Dynamic vs static linking is mostly a red herring for desktop GUI application
    development unless you want to integrate into something like Linux distro package
    managers, as dynamic libraries on Mac and Windows can be self-contained within
    the application bundle&#x2F;directory with no disadvantage beyond marginally longer
    startup time, and you can do similar things with Flatpak and friends on Linux.<p>The
    real difference is that Rust provides a package repository with a unified build
    system that&#x27;s as simple to use as NPM or NuGet.<p>vcpkg which is similar
    exists today, but it didn&#x27;t in 2015 when Discord started, still isn&#x27;t
    anywhere near as comprehensive as package repositories for languages where package
    management is part of the standard toolchain, and the underlying build systems
    are far messier under the hood.<p>It can also be helpful in development to use
    libraries built from source as part of the application&#x27;s build process, at
    least as an easily-accessible option, which wasn&#x27;t common practice in most
    C&#x2F;C++ ecosystems historically where different libraries used different build
    systems and if you wanted to integrate them into something like a Visual Studio
    solution for easy reference to source code during development and debugging you
    were often on your own.
