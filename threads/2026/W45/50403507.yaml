  author: accurrent
  text: 'A huge pain of desktop development is managing dependencies particularly
    if you are coming from C++&#x2F;Native code. Imagine you wanted to make a simple
    app in the 2010s that accesses the webcam for instance: If you use chrome you
    got the full html5 runtime, whereas with other tools you&#x27;d need bespoke libraries
    which your end user may not have.<p>The only way to ship the same code between
    linux, macOS, and Windows would have been to either use something like Qt or the
    JVM back in the 2010s. The JVM desktop stuff was super ugly and Java itself had
    become notorious (also if you wanted anything remotely interesting like webcam&#x2F;microphone
    or multimedia access you&#x27;d still have to ship dynamic libraries). Qt required
    special packaging skills to ship to the end user especially if third party libraries
    were involved. Electron killed that by bundling chrome (and chrome has a huge
    api surface).<p>Today, I would argue the package management situation for a language
    like rust is a lot different. You dont have to cobble different DLLs together,
    you can just statically compile dependencies and cargo&#x2F;rust do a pretty good
    job of making sure it&#x27;s bundled with your app. Other languages also now have
    similarly useful tools.'
  score: 0
