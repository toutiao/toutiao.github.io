  author: bluGill
  text: Neither existed in 2012, so of course not. On the other hand, QT has always
    been really easy to download from QT. I don&#x27;t remember who owned QT in 2012.
    They&#x27;ve changed hands a couple times over the years, but in 2012 I was downloading
    QT from whoever on them. QT was large, so you needed a decent sized computer to
    build it, but in 2012 this was not a big deal.<p>People get too hung up on package
    managers. When you&#x27;re building your own proprietary you don&#x27;t really
    need a package manager, you just need a central place to download the tarballs
    from. Or you could do a monorepo and just build everything locally - in 2012,
    that means you start your build before you leave Friday afternoon, and when you
    come back Monday, everything&#x27;s built.
