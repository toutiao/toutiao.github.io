article:
  url: https://www.regenerator1.com/p/anthropics-growth-just-flattened
  title: Anthropic’s growth just flattened (really)
  fetch_status: success
  content: "# Anthropic’s growth just flattened (really) \n\n### Look at the monthly
    numbers... \n\n[\n\n](https://substack.com/@regenerator1)\n\n[Henry Blodget](https://substack.com/@regenerator1)\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!qfl2!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F68ef8665-4279-4a1d-b5d6-447d33f93edd_1206x748.png)\n_Source:
    Regenerator estimates and news reports._\n\nAnthropic shared high-level Q3 financials
    with investors yesterday, report [the NYT’s Andrew Ross Sorkin](https://www.nytimes.com/2026/10/14/technology/anthropic-ipo-revenue-profit.html),
    [Lauren Hirsch](https://www.nytimes.com/by/lauren-hirsch), and [Sri Muppidi](https://www.nytimes.com/by/sri-muppidi).\n\nRevenue
    for Q3 was reportedly $16.8 billion.\n\nAt first glance, this number seems astonishing.
    And, in one sense, it is. It’s another jaw-dropping sequential gain for what is
    likely the fastest-growing company in history.\n\nBut, break the trend down into
    implied monthly growth, and the picture looks different.\n\nSpecifically, it seems
    Anthropic barely grew from July to September.\n\nAnthropic’s sequential revenue
    growth in Q3, moreover, was smaller in absolute dollars than its (gobsmacking)
    growth in Q2.\n\nSo, for several possible reasons, Anthropic’s growth has meaningfully
    slowed.\n\nThis is likely another reason why the stocks of “neocloud” providers
    like CoreWeave are collapsing. CoreWeave, _et al_, have borrowed tens of billions
    of dollars on the assumption that demand for AI compute will continue to grow
    at rates way beyond consensus expectations for years.\n\nNow, not only are interest
    rates soaring — raising the carrying costs of this debt — the near-term revenue
    growth for AI services may be flattening.\n\n#### Analyzing Anthropic’s growth…\n\nAnthropic’s
    reported revenue growth this year has been unprecedented:\n\n**Q1:** $4.8 billion
    \ \n**Q2:** $11.6 billion (+$6.8B and +141%, sequentially)  \n**Q3:** $16.8 billion
    (+$5.2B and +45%, sequentially)\n\nAgain, these numbers are astonishing.\n\nBut
    so are AI valuations and expectations.\n\nNote that Anthropic added more revenue
    in Q2 than it did in Q3.\n\nNote, too, that what matters most for Anthropic’s
    IPO valuation — and, likely, for the future trajectory of the AI bubble — is not
    what _has happened_ but what _will happen_.\n\nThe key question is, “What do these
    numbers suggest about how fast Anthropic will grow _from here_?”\n\nThese figures
    suggest that the market should temper its expectations, at least temporarily.\n\nIf
    we break down the quarterly figures above into monthly estimates and add one more
    reported data point — that Anthropic had a [$65 billion annualized revenue run-rate
    in July](https://www.cnbc.com/2026/08/17/anthropic-says-annualized-revenue-climbed-to-65-billion-in-july.html)
    —&nbsp;we see that Anthropic’s growth has flattened even more than the quarterly
    figures suggest.\n\nBelow are back-of-the-envelope estimates for Anthropic’s monthly
    revenue in 2026. They are based on the reported quarterly revenue figures as well
    as the $65 billion annualized revenue in July (which equates to ~$5.4 billion
    of July revenue).\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!eKfb!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5c5b29e2-15c4-4340-b321-a333d542d50c_1356x676.png)\n\nEven
    the quarterly numbers suggest that Anthropic’s average monthly growth slowed from
    ~$760 million in Q2 to (“only”) $580 million a month in Q3.\n\nBut the “$65 billion
    annualized revenue in July” data point suggests the slowdown is even sharper.\n\nIf
    Anthropic did $5.4 billion in revenue in July and $16.8 billion in Q3, it likely
