  text: "&gt; they are still clearly in the lead on coding and will continue to do
    well until someone definitively passes them.<p>I think the first implying the
    second might be a bit of a stretch. At some point, companies are going to start
    looking at their AI spending and start negotiating deals. OpenAI is right behind
    them and Anthropic is around 8x more expensive (Sol 6.1 vs Opus 5.5 based on Artificial
    Intelligence&#x27;s cost per task; cost per token is a somewhat useless metric
    when different models use vastly different numbers of tokens for the same thing).
    Chinese models like Deepseek 4.1 Flash are cheap, can be self-hosted, and while
    certainly behind Claude Opus 5.5, are still good.<p>Lots of companies buy &quot;inferior&quot;
    products like Microsoft Teams. Over the next 5 years, it seems likely that many
    models will get really good to the point that people often won&#x27;t be able
    to tell any difference. Even if something isn&#x27;t &quot;definitively&quot;
    better, companies might say &quot;our engineers can&#x27;t tell the difference
    and we&#x27;re cutting our costs by 85%.&quot;<p>It&#x27;s not absurd to think
    that a company would use its own harness or an open source harness and&#x2F;or
    put a proxy in to route requests variably. For two months, they have engineers
    using different models unbeknownst to them and they measure things like how often
    the engineers have to correct or redirect the model. At the end of two months,
    they might find little difference in performance and switch to a much lower cost
    model.<p>It&#x27;s not like it&#x27;d be crazy hard to analyze workers frustration
    as they did their jobs and figure out if one model was actually better. They could
    log all the conversations and it&#x27;s not like AI can&#x27;t easily determine
    things like &quot;no, that&#x27;s completely wrong&quot; as a phrase showing that
    the agent was really off base.<p>I think a big part of the next 5-10 years is
    going to be about cost&#x2F;efficiency."
