  author: obirunda
  text: No one is really watching and frankly if they were using it for training showing
    they did so without someone internally blowing the whistle is downright impossible.
    Corporate&#x2F;gov malfeasance happens all the time, with ample of internal support
    and re-affirmation. Historically few of the parties involved who stand to benefit
    ever become whistleblowers. Even when they do, often the world yawns and nothing
    changes. Truth is, when it comes to this topic of data acquisition for training,
    these companies are on a tight rope of needing to acquire an edge over their competitors
    while not having an unlimited mine to mine from. So the incentive to &quot;use
    everything&quot; is much greater than the potential danger of users raising issues
    they cannot reasonably prove or show harm from.<p>Take Tristan Buckmaster, he
    is asserting OAI may have used his data to arrive at their proof. They initially
    said they couldn&#x27;t say and then they amended their statement. So it&#x27;s
    their word against his, but they showed no evidence and invited exactly zero independent
    3rd parties to attest to this. Buckmaster would likely have to sue them to hopefully
    force their hand by court order. From our purview, he likely won&#x27;t pursue
    legal counsel and OAI won&#x27;t admit to using unauthorized content to train
    their models. We should likely accept that all AI corporations are using all data
    available to them full stop.<p>Think about it, these model interactions have been
    the frontier of human feedback across all disciplines and modalities. The sheer
    immensity of data flowing into their servers of human original content (with feedback)
    is likely much greater than what they scraped from the web or are continuing to
    scrape. Entire codebases being shared, entire business processes, reasoning behind
    said processes and a load of industry specific secrets have likely been shared
    in the interactions. The rise of agents with sub-agents each with minimal guardrails
    have gifted the models with the ability to exfiltrate all this data with the user
    consent and a minimal non-enforceable &quot;do not train&quot; check-mark that
    the unsuspecting user is unlikely to be able to show any harm later.<p>Their acquisition
    techniques prior to larger user bases included ample piracy. Anthropic (the holier
    than thou of the two) itself, has had to settle at $1.5b for using pirated books
    in training, why wouldn&#x27;t they use every available avenue to help their models
    improve today legal or otherwise?<p>If data is being sent over the wire, assume
    someone is going to use it to improve their models. They all include a clause
    of 30-Day retention on pretty much on all user data to ensure &quot;abuse&quot;
    isn&#x27;t happening. So they are using it, and telling you about it, <i>not using
    data for model improvement</i> is just cope for the user.
  score: 0
