  author: charm137
  text: 'My somewhat uninformed guess is that the weights of the target network (Qwen
    or Gemma), when they reach the context of the larger editor model (Astra), the
    attention process is doing some sort of PCA on the weights, conditional on the
    prompt (&quot;make this better at games&quot;), fetching the relevant weights
    from its own network (which serves as the larger database), transforming it into
    whatever latent space the target model is amenable to and pasting them. If this
    is the right intuition, it is amazing what attention is able to achieve. As a
    test, I think smaller networks won&#x27;t be able to make big ones better using
    the same process.<p>EDIT: I think the bigger implication is that backprop is not
    the only game in town.'
