  author: augment_me
  text: The math example on Qwen was based on 50 batched iterations, so the model
    was able to evaluate it&#x27;s changes on downstream tasks. And the fix was essentially
    to remove a direction in activation space that causes looping instead of an exit,
    this was already known to be a thing(all of the jailbreak&#x2F;unleashed models
    do this) following Arditi et al. (Refusal in language models is mediated by a
    single direction, 2024)<p>So it&#x27;s not able to insert new knowledge, but it&#x27;s
    able to adjust the routing&#x2F;looping&#x2F;weighing of existing one.<p>As I
