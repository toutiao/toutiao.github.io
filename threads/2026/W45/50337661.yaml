  text: 'For those as confused as I was, the BASIC as written will not run on a C64
    (two immediate notes: BASIC 2.0 doesn&#x27;t have labels, and a variable like
    STATS would be illegal because it clashes with the status word ST). This only
    works in their custom IDE which &quot;compiles&quot; (read &quot;adds line numbers,
    alters names and tokenizes&quot;) it.'
