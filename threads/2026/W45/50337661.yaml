  author: chrisgcom
  text: 'Yes, it&#x27;s tokenized not compiled so the .prg DOES run on a real C64.<p>C64
    BASIC is tokenized anyway, this just adds tokenization of {COLOUR} stuff and converts
    LABEL: into a REM statement so GOTO&#x2F;GOSUB can point to a LABEL then be converted
    to line numbers during that process :)'
