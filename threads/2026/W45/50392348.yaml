  author: holgerschurig
  text: You didn&#x27;t define &quot;we&quot;, so from my POV it&#x27;s therefore
    wrong. If I set &quot;we&quot; to &quot;the world&quot; than your statement doesn&#x27;t
    apply. Same when I set it to &quot;the western world&quot; or even just to tiny
    &quot;Germany&quot; --- because it&#x27;s country I know best.<p>&quot;We&quot;
    have Helmholtz, Fraunhofer, Leibniz, Max-Planck. They all do long-term institutionalized
    research. Sometimes on their own, sometimes for industry. They employ 45000, 22000,
    24000 or 32000 people respectively, a good chunk of them researchers.<p>But if
    I make the &quot;we&quot; wider, then I see a whole lot of scientific &quot;academies&quot;,
    most of them having several members in turn. See <a href="https:&#x2F;&#x2F;allea.org&#x2F;members&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;allea.org&#x2F;members&#x2F;</a><p>I can&#x27;t
    judge if &quot;most research now is product centric&quot; is correct or not. But
    I guess that research ending in a concrete product you can buy boosts the publicity
    of the research manifold.<p>If e.g. Fraunhofer optimizes wind rotors for turbines
    ... who will know it?  But if they create the MP3 compression ... then it&#x27;s
    much wider known. But already the airbag or white LEDs? Both are inventions of
    Fraunhofer, too. Used world-wide. And yet few know them to be coming out of a
    public funded research agency.<p>If I extrapolate this assumption of mine then
    I guess that inventions by other research institutions like Batelle or Smithsonian
    aren&#x27;t equally well-known. If they aren&#x27;t concrete products. If my guess
    is valid is on your judgement.
