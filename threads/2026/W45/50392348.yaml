  text: 'These labs had one thing in common: they were funded by monopolies. Xerox
    with copy machines, Bell with the telephone, General Electric is also known for
    its monopolistic practices.<p>And you probably heard about these little things
    called LLMs, that&#x27;s Google research, yup, another quasi-monopoly. And it
    wasn&#x27;t product centric, in fact, Google turned out to be pretty bad at making
    a product out of their research, that&#x27;s how OpenAI took over.<p>Monopolies
    are bad for consumers, but there is also some good. Because they make tons of
    money and don&#x27;t have to worry about competitors, they can invest a lot into
    fundamental research with a long term perspective. A competitive industry rewards
    shorter term strategy, because companies can&#x27;t afford to wait 20 years for
    the next big thing if their competitor takes over after 2 years with the next
    small thing.'
