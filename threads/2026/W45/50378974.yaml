  author: gnulinux
  text: "&gt; Just translate the thing.<p>This is a very common sentiment among laymen
    talking about translation, but it demonstrates a very fundamental misunderstanding
    of what language is and what translation achieves. Oftentimes there is no way
    to 1-to-1 translate a language as if you&#x27;re translating between Python and
    Ruby; more often, translating a sentence to two different languages (like Japanese
    and English) is more akin to translating between Python and C. There are too many
    ways to get the point across and there is almost never an obvious direction to
    translate &quot;directly&quot;. For example, when one uses a quirky phrase in
    English (say, &quot;it&#x27;s raining cats and dogs&quot;) there are two main
    ways to translate that to any other language (1) you&#x27;ll use a similar phrase
    in the target language that conveys the meaning (which almost certainly won&#x27;t
    involve &quot;cats&quot; and &quot;dogs&quot; but may involve other objects <i>even</i>
    potentially pop culture references), or (2) you&#x27;ll just write that &quot;it&#x27;s
    raining a lot&quot;. From a laymen point of view (2) seems more appropriate because
    the translator doesn&#x27;t have to &quot;invent&quot; something that doesn&#x27;t
    exist in the original text and make an artistic choice, but systematic application
    of this makes the translated text very dry and unidiomatic in the language. Furthermore,
    and perhaps more importantly, when the original author wrote &quot;it&#x27;s raining
    cats and dogs&quot; in English as opposed to &quot;it&#x27;s raining a lot&quot;
    they meant to signal semantic information that&#x27;d be lost if we removed the
    phrase altogether. This could be emphasis, casual-speak, signaling damage caused
    by rain etc... So, often you need to support the target text with quirky phrases
    that are in use in the target language.<p>I know nothing about this Xanadu translation
    or video game translations in general. But the sentiment expressed is very naive.
    Translation is an art form in an of itself, and oftentimes good translation <i>has
    to</i> diverge from the original text quite a bit to be a good translation, especially
    if the two languages are very different languages."
