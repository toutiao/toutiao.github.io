  text: The &quot;Sacred Alcohol of Stamina to Van Buren Coffee&quot; part illustrates
    why I hold those &quot;localization&quot; attempts in contempt. &quot;I have unanimously
    decided this name&#x2F;sentence&#x2F;reference is boring and I&#x27;m going to
    change it to make it &#x27;more interesting&#x27;&quot;.<p>Just translate the
    thing. If you add random references that weren&#x27;t there it&#x27;s going to
    alter the discourse around the game that only knows of the localization dramatically.<p>You
    may say this sounds ungrateful, but those people altering the original works are
    ones setting the tone of the entire Western discourse of the games they re altering.
    People are going to talk about the localized version and any change introduced
    will become part of how it&#x27;s perceived and discussed. This can include both
    accidental and intentional changes that completely change the tone, setting or
    relationships of the characters within. Like the infamous DeJap localization of
    Tales of Phantasia that made a character particularly horny, and that intentional
    change has stuck even after more serious official translations came out because
    many people only played that altered version.<p>I can understand altering stuff
    for censorship reasons even, but those changes made to make things &quot;more
    interesting&quot; are completely one-sided fanfic tier stuff and add links that
    weren&#x27;t there. I&#x27;ve found more people than you&#x27;d believe that think
    Castlevania is supposed to be in the same world as Lord of the Rings because the
    localizations renamed <i>several</i> items to LotR references for no good reason.
