  author: boredhedgehog
  text: "&gt; Just translate the thing.<p>But which thing? Language transmits information,
    intent, tone, sound and many other layers. Usually, there is no way to transport
    all of it to the target language, and the translator must choose what to sacrifice.<p>Japanese
    prose doesn&#x27;t <i>intend</i> to be boring, and its target audience isn&#x27;t
    bored by it. If you translate it in a way that sounds boring to an English audience,
    you aren&#x27;t maintaining the intent of the author.<p>The famous example is
    Tina from FF6, a name exotic and exciting for a Japanese audience, but commonplace
    and boring for Westerners. Keeping such a word means missing its point."
