  author: adrian_b
  text: I would count &quot;pipe&quot; and &quot;open&quot; together as 0 (useful)
    syscalls, because both have been obsolete for a very long time (even if they occupy
    2 slots in the syscall table and those 2 slots will remain occupied forever).<p>These
    2 syscalls have a history typical for Linux syscalls, where frequently new syscall
    variants make completely obsolete their predecessors, but the old syscalls must
    still remain supported forever by the newer Linux kernels, to allow running legacy
    programs.<p>&quot;pipe&quot; has been obsoleted by &quot;pipe2&quot; (on 2008-10-09),
    which in turn has been obsoleted by &quot;IORING_OP_PIPE&quot;.<p>&quot;open&quot;
    has been obsoleted by &quot;openat&quot;, which in turn has been obsoleted by
    &quot;IORING_OP_OPENAT&quot;.<p>Most users do not invoke Linux syscalls directly,
    but they use the standard C library, which has frequently shielded the end user
    from the evolution of the Linux syscalls. For instance, you might use the functions
    &quot;open()&quot; and &quot;pipe()&quot; in your C program, but the C library
    might invoke instead of those the more modern syscalls &quot;openat&quot; and
    &quot;pipe2&quot;, after adjusting their parameters.
