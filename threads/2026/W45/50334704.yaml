    # Linux syscall tables

    Every Linux syscall table in one place, grouped by architecture: system calls for 27 architectures with their numbers, arguments and registers, from Linux 3.3 to 7.3.

    ## Architectures

    - [**x64** x86\_64](/x64/)
    - [**x86** i386, 32 bit x86](/x86/)
    - [**arm64** AArch64](/arm64/)
    - [**arm** ARM EABI, 32 bit](/arm/)
    - [**riscv64** RISC-V, 64 bit](/riscv64/)
    - [**ia32** IA-32 compat on x86\_64](/ia32/)
    - [**x32** x32 ABI on x86\_64](/x32/)
    - [**loongarch64** LoongArch, 64 bit](/loongarch64/)
    - [**ppc64** PowerPC, 64 bit](/ppc64/)
    - [**ppc** PowerPC, 32 bit](/ppc/)
    - [**s390x** IBM Z](/s390x/)
    - [**mips64** MIPS n64 ABI](/mips64/)
    - [**mipsn32** MIPS n32 ABI](/mipsn32/)
    - [**mipso32** MIPS o32 ABI](/mipso32/)
    - [**alpha** DEC Alpha](/alpha/)
    - [**arc** Synopsys ARC](/arc/)
    - [**csky** C-SKY](/csky/)
    - [**hexagon** Qualcomm Hexagon](/hexagon/)
    - [**m68k** Motorola 68000](/m68k/)
    - [**microblaze** Xilinx MicroBlaze](/microblaze/)
    - [**nios2** Intel Nios II](/nios2/)
    - [**openrisc** OpenRISC](/openrisc/)
    - [**parisc** HP PA-RISC](/parisc/)
    - [**sh** SuperH](/sh/)
    - [**sparc** SPARC, 32 bit](/sparc/)
    - [**sparc64** SPARC, 64 bit](/sparc64/)
    - [**xtensa** Tensilica Xtensa](/xtensa/)

    Every architecture's table, with the full history of when each syscall appeared and when it was dropped, is also a plain JSON file at `/<arch>/syscalls.json`, for example [/x64/syscalls.json](/x64/syscalls.json).

    ## Calling conventions

    Number in _NR_, arguments in _ARG0_ to _ARG5_, then the instruction. The result comes back in _RETURN_.

    | ARCH | INSTRUCTION | NR | RETURN | ARG0 | ARG1 | ARG2 | ARG3 | ARG4 | ARG5 |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | [x64](/x64/) | `syscall` | rax | rax | rdi | rsi | rdx | r10 | r8 | r9 |
    | [x86](/x86/) | `int 0x80` | eax | eax | ebx | ecx | edx | esi | edi | ebp |
    | [arm64](/arm64/) | `svc #0` | x8 | x0 | x0 | x1 | x2 | x3 | x4 | x5 |
    | [arm](/arm/) | `svc #0` | r7 | r0 | r0 | r1 | r2 | r3 | r4 | r5 |
    | [riscv64](/riscv64/) | `ecall` | a7 | a0 | a0 | a1 | a2 | a3 | a4 | a5 |
    | [ia32](/ia32/) | `int 0x80` | eax | eax | ebx | ecx | edx | esi | edi | ebp |
    | [x32](/x32/) | `syscall` | rax | rax | rdi | rsi | rdx | r10 | r8 | r9 |
    | [loongarch64](/loongarch64/) | `syscall 0` | a7 | a0 | a0 | a1 | a2 | a3 | a4 | a5 |
    | [ppc64](/ppc64/) | `sc` | r0 | r3 | r3 | r4 | r5 | r6 | r7 | r8 |
    | [ppc](/ppc/) | `sc` | r0 | r3 | r3 | r4 | r5 | r6 | r7 | r8 |
    | [s390x](/s390x/) | `svc 0` | r1 | r2 | r2 | r3 | r4 | r5 | r6 | r7 |
    | [mips64](/mips64/) | `syscall` | v0 | v0 | a0 | a1 | a2 | a3 | a4 | a5 |
    | [mipsn32](/mipsn32/) | `syscall` | v0 | v0 | a0 | a1 | a2 | a3 | a4 | a5 |
    | [mipso32](/mipso32/) | `syscall` | v0 | v0 | a0 | a1 | a2 | a3 | sp+16 | sp+20 |
    | [alpha](/alpha/) | `callsys` | v0 | v0 | a0 | a1 | a2 | a3 | a4 | a5 |
    | [arc](/arc/) | `trap0` | r8 | r0 | r0 | r1 | r2 | r3 | r4 | r5 |
    | [csky](/csky/) | `trap 0` | r7 | a0 | a0 | a1 | a2 | a3 | r4 | r5 |
    | [hexagon](/hexagon/) | `trap0(#1)` | r6 | r0 | r0 | r1 | r2 | r3 | r4 | r5 |
    | [m68k](/m68k/) | `trap #0` | d0 | d0 | d1 | d2 | d3 | d4 | d5 | a0 |
    | [microblaze](/microblaze/) | `brki r14,8` | r12 | r3 | r5 | r6 | r7 | r8 | r9 | r10 |
    | [nios2](/nios2/) | `trap` | r2 | r2 | r4 | r5 | r6 | r7 | r8 | r9 |
    | [openrisc](/openrisc/) | `l.sys 1` | r11 | r11 | r3 | r4 | r5 | r6 | r7 | r8 |
    | [parisc](/parisc/) | `ble 0x100(%sr2, %r0)` | r20 | r28 | r26 | r25 | r24 | r23 | r22 | r21 |
    | [sh](/sh/) | `trapa #31` | r3 | r0 | r4 | r5 | r6 | r7 | r0 | r1 |
    | [sparc](/sparc/) | `t 0x10` | g1 | o0 | o0 | o1 | o2 | o3 | o4 | o5 |
    | [sparc64](/sparc64/) | `t 0x6d` | g1 | o0 | o0 | o1 | o2 | o3 | o4 | o5 |
    | [xtensa](/xtensa/) | `syscall` | a2 | a2 | a6 | a3 | a4 | a5 | a8 | a9 |

    ## API

        curl https://api.syscall.sh/v2/syscalls/x64/read

    Any kernel release, diffs between releases and more in the [API docs](https://api.syscall.sh/docs).

    ## Syscall tables across kernel versions

    Entries get added and, rarely, removed between releases. Each architecture page has a kernel selector, and its JSON download records when each entry first appeared (`since`) and when it was dropped (`removed_in`).

    Removed entries stay visible: pick "all, with removed" in the kernel selector and each dropped syscall is marked with the release that dropped it.

    ## Where the data comes from

    Everything on this site is read from the kernel source itself. For each architecture, the generator walks the syscall table and the `SYSCALL_DEFINE` macros of every mainline release it scans, so these are the numbers the kernel actually dispatches on.

    It also records each architecture's calling convention, the instruction that enters the kernel, so every syscall table shows exactly where the number and the arguments go.

    A syscall whose `since` equals the first release scanned for its architecture was already there back then, and may be much older.

    ### Descriptions and full history

    The short descriptions come from the [Linux man pages project](https://www.kernel.org/doc/man-pages/), and the `io_uring` ones from [liburing](https://github.com/axboe/liburing). Whenever the data changes, the site is rebuilt from the [syscall API](https://api.syscall.sh/docs).
