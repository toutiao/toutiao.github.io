  author: gabriel666smith
  text: Huh, interesting. The company has amassed 50k hours of training data - that’s
    a very large dataset.<p>A side-project of mine recently has been building out
    this stack:<p>- Recording audio in proximity to me, and transcribing it<p>- Grabbing
    EEG data from cheap sensors on my own head<p>- Mapping it against the transcription<p>With
    a view to eventually train transformer models which might reliably understand,
    from EEG signals, what words I am thinking. The existing studies on this method
    don’t <i>seem</i> to show any drop off in efficacy at mind-reading (lol) as the
    dataset gets larger.<p>(If anyone wants to invest some seed money so I can justify
    spending more time strapping things to my head, do hit me up.)<p>Crucially, the
    Muse headband the article talks about doesn’t have a microphone. This seems (slightly!)
    better for user privacy, but it seems like it would hamper training somewhat,
    depending on your aims.<p>A less privacy-respecting company in this space with
    a popular wellness device could do some pretty dark stuff - it doesn’t really
    bear thinking about. A sleep tracker app with companion EEG sensor device, for
    example, could reasonably request microphone access without most users batting
    an eye.
