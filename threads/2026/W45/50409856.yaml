  author: gabriel666smith
  text: This paper explains it better than I could:<p><a href="https:&#x2F;&#x2F;www.nature.com&#x2F;articles&#x2F;s41467-025-65499-0"
    rel="nofollow">https:&#x2F;&#x2F;www.nature.com&#x2F;articles&#x2F;s41467-025-65499-0</a><p>If
    you know that at [timestamp] a certain word was audible in my vicinity, it might
    be reasonably safe to guess that I also thought this word around that point, because
    I heard that word.<p>The EEG signal my brain creates might behave in a unique
    way when I heard (and thus, thought) that word. Over time, it might be possible,
    using machine learning, to notice that unique pattern repeatedly in the data an
    EEG sensor captures.<p>So my hope is that decoding EEG might be perhaps simpler
    than people currently assume. Most studies create their datasets using &quot;lots
    of participants, participating for relatively short periods&quot; rather than
    &quot;one participant, over an extremely long period&quot;.<p>If it&#x27;s possible
    to have my EEG reasonably-well mapped and decoded (this signal previously repeatedly
    meant I was hearing the words &quot;uuuh me so horny&quot;, to use your example)
    it might then become possible to read mapped words in the EEG signals <i>even
    when the mapped words were not audible</i>.<p>This, in turn, might mean it was
    possible to read (some of) the words I am thinking.<p>As a sibling commenter pointed
    out, it&#x27;s insanely noisy data, so I have no idea whether any of the above
    will ever prove possible.<p>But mapping assumptions in the manner you laid out
    isn&#x27;t something I would have any idea how to do, not least because I often
    hate the sports teams I love when they are underperforming.
