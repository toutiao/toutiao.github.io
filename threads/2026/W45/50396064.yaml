  author: sublinear
  text: If we&#x27;re really being serious about getting it fixed and not just waving
    a magic wand and laying blame, the scripts should not be distributed via a platform
    that tells web maintainers to blindly paste a script tag and leave their web servers
    wide open for the whitelisted 3rd party domain(s) to send whatever they want to
    visitors. We need to end the security theater with nonces that is bypassing what
    most people expect from a content security policy that is almost never true in
    practice.<p>The scripts should be 100% static files hosted by the same origin
    and not be obfuscated. These scripts should not make additional requests to inject
    even more scripts that cannot be known until run time and are specific to that
    targeted visitor. These scripts should be released in the usual semver tradition
    with matching hashes that never change without the explicit action by the same
    domain that the user actually visited (making the nonce obsolete).<p>Like I said,
    this is a very old debate with a very simple solution whose only problem is that
    it breaks the business model of a multi-billion dollar idea. Not only would this
    tighten up security, but your favorite websites wouldn&#x27;t lag so hard anymore
    either. The vast majority of complaints about the web being slow are from the
    dozens of HTTP requests constantly being made behind your back. This is exactly
    why so many users feel forced to use an adblocker even though that doesn&#x27;t
    always work.
