  content: "# ![Meridian](/meridian/assets/meridian-logo.svg)\n\nMeridian is a web-browser
    for MacOS built on [GPUI](https://www.gpui.rs) and [Servo](https://servo.org).
    Meridian is already quite useful to browse websites that are light on javascript
    and layouting features. The browser is highly configurable: fonts, keybinds, colors,
    tabs and all.\n\n![Meridian with vertical tabs, showing the Meridian homepage](https://cdn.oppi.li/meridian/Screenshot%202026-11-05%20at%2018.47.10.png)\n\nTo
    try Meridian, you can use nix:\n\n    nix run git+https://tangled.org/oppi.li/meridian\n\nThe
    project is developed on [Tangled](https://tangled.org/oppi.li/meridian), all contributions
    are welcome, please do browse the list of [open issues](https://tangled.org/oppi.li/meridian/issues)
    if you are looking to contribute!\n\nMeridian supports the following features:\n\n-
    Address bar with typeahead \n- Vertical and horizontal tabs\n- Bookmarks and history\n-
    Per-site zoom\n- Audio and video playback\n- Reader mode\n- Tab previews\n\n![Address
    bar typeahead suggesting bookmarks and history](https://cdn.oppi.li/meridian/Screenshot%202026-11-05%20at%2018.57.35.png)\n_Typeahead
    from bookmarks and history_\n\n![Right-click context menu over a link](https://cdn.oppi.li/meridian/Screenshot%202026-11-05%20at%2018.57.12.png)\n_Context
    menu_\n\n![Meridian in dark mode](https://cdn.oppi.li/meridian/Screenshot%202026-11-05%20at%2018.55.19.png)\n_Dark
    mode_\n\n![An article in reader view](https://cdn.oppi.li/meridian/Screenshot%202026-11-05%20at%2018.52.51.png)\n_Reader
    view_\n\nUnder the hood, Meridian is written in Rust and built on GPUI and Servo.
    Web pages and browser state is managed by Servo. The browser's chrome is drawn
    by [gpui](https://www.gpui.rs), the UI framework behind the Zed editor. The glue
    code to interface servo with gpui lives in separate library, [gpui-servo](https://tangled.org/oppi.li/gpui-servo),
    which exposes Servo as an ordinary gpui component, so anybody can now write a
    servo-based browser in GPUI!"
