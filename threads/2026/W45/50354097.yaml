  author: Sesse__
  text: 'The same way: If you change latency from 10s to 1s, it&#x27;s ten times as
    fast in terms of latency (or 900% faster, if you will); earlier, you could do
    0.1 things&#x2F;second, and now you can do 1.0 thing&#x2F;second. The only real
    difference between latency and throughput is whether you can overlap work instances
    or not, you can use the same language to talk about their changes.<p>You obviously
    cannot _calculate_ latency from throughput or vice versa (except of course that
    one bounds the other); they are different values. But both can use the (very simple,
    very intuitive) framework of “number of stuffs per time unit”.<p>Now where things
    become ugly is when you talk about “N% _slower_”, which is also useful but gets
    very quickly ambiguous and problematic when N is not close to zero.'
