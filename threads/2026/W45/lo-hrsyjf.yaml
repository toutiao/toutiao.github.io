  text: |-
    People here might also like mset, an OCaml library for representing small multisets in one machine word, and the paper Les anagrammes de ce titre (in French) presenting this library and other tricks to enumerate anagrams of a whole sentence. If you speak better OCaml than French, you might console yourself with this page of accompanying material.
    Whereas in the OP, the constraint is to be able to encode each word of the whole dictionary (104 bits by "concatenating counters" vs 64 bits by "prime decomposition"), in this paper we only need to encode the letters of the sentence, which allows multisets to be packed in much less than 64 bit even using the "naive" method of concatenating counters (19 bit for the title of the paper).
