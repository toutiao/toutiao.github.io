  content: "# [11 nanoseconds per word: Ridiculously Over-Optimizing Anagrams](https://wiredream.com/anagram-fun/)\n
    David G. Andersen October 27, 2026 \n\nBLOG → BLOT → SLOT → SPOT ↝ POST\n\nA friend
    recently pointed out a new Word Ladder game variant: Find a path of mutations
    from a start word to an end word, where mutations can be single letter changes,
    single letter deletions or additions, or anagramming the word. It annoyed me (the
    paths involving anagrams can be wickedly hard to spot), so, naturally, I wrote
    a solver for it. And when the solver took over a second to run, I of course had
    to optimize it. Along the way, I found a fun trick for anagram indexing—fitting
    a collision-free prime-product identifier for every word in the dictionary into
    a single 64-bit integer—that I hadn't seen before (though the history of computing
    is long and Knuth probably noticed it in 1965).\n\nFor completeness, I should
    note that what I was interested in was finding all anagrams in a dictionary---if
    you just want to find anagrams of a specific word you can probably get away with
    a much simpler hash table design! We'll use all of the anagrams in the next post
    talking about solving the whole word ladder.\n\n## Finding anagrams\n\nThe two
    usual tricks for finding anagrams are to use either a letter-sorted permutation
    or a letter-count vector as a unique identifier for the letters in the word in
    an order-independent way:\n\n    letter_sort(\"spot\") -> \"opst\"\n\nor\n\n    letter_count(\"spot\")
    -> \"[... o:1, p: 1, s: 1, t:1 ...]\"\n\nand then run through the dictionary and
    insert items into a hash table based upon their letter count. In python-ish pseudocode:\n\n
    \   for word in dictionary:\n      table[letter_sort(word)] += word\n\nwhich creates
    a table with entries like:\n\n    \"opst\" : [\"spot\", \"post\", \"tops\", \"stop\"]\n\n###
    Baseline: Sorting strings\n\nBecause I'd been feeling a little, uh, rusty in my
    coding lately, I decided to implement this all myself in Rust instead of yelling
    at an LLM to do it (this is a leetcode-like problem so it would have done it trivially).
    That code looked like:\n\n    fn anagram_dictionary(words: &[String]) -> HashMap<String,
    Vec<String>> {\n        let mut anagrams: HashMap<String, Vec<String>> = HashMap::new();\n
    \       for word in words {\n            let key: Vec<u8> = word.bytes().sorted().collect();\n
    \           let key = String::from_utf8(key).expect(\"dictionary words must be
    ASCII\");\n            anagrams.entry(key).or_default().push(word.clone());\n
    \       }\n        anagrams\n    }\n\nUsing the Scrabble(tm) dictionary pre-read
    into memory, this function produces the anagram dictionary in:\n\n**Result: 31ms
    (173ns / word)**\n\nThat seems fine. Oh wait, just kidding, that's INSANELY SLOW.
    The dictionary has 178,690 entries in it, which means we're spending 173 nanoseconds
    per word to build up this dictionary. In 173 nanoseconds you could execute roughly
    4400 instructions on my Macbook Pro M1. Who has time to wait for that??\n\n###
    Eliminating `Vec` allocations\n\nWhen optimizing, one of the first places to be
    suspicious is allocations, and this one has them in droves. Every word results
    in either the allocation of a Vec or an append to a Vec, which sometimes needs
    an allocation. Practically, there are about 161019 keys in the table, so that's
    161k allocations (!!). Let's improve those by using a slightly more clever data
    structure, noting two things:\n\n- With 161k entries in the hash table and only
    178k dictionary items, most of those hash table entries will be singletons.\n-
    We have the original word list stored in memory and it can be indexed by a u32
    given its size.\n\nSo we'll do two things: We'll find a way to store singleton
    items without needing a dynamic-length data structure at all, and we'll implement
    the equivalent of a linked list for appending items to the lists, since they're
    append-only and we only scan them once at the end. To do this, we'll use a structure
    like this:\n\n    heads: HashMap::<K, u32>,\n      next: Vec<u32>,\n      word:
    Vec<u32>\n\nWhere heads is indexed by the anagram-identifying-key (e.g., the character-sorted
    string). We'll overload that u32 by using the high bit (we only have 170k or so
    words) to let it represent_either_ an actual data value (the index of an element
    in the list) OR an index into the next+word arrays. The next array is our linked
    list - it stores pointers to another entry in the next array. The word array stores
    the associated data. It looks like this:\n\n ![keygroups](keygroups.svg)\n\n**Result:
    31ms -\\> 20ms (112ns / word)**\n\n### Packing letter counts into a `u128`\n\nMuch
    better, but we can do better yet. The time to sort that string and create a new
    string allocation is non-trivial and we're doing 178k of them. That's going to
    be another big chunk of nanoseconds.\n\nLet's try a letter count vector instead,
    and pack it tightly into an integer. With only 26 characters, if we assume that
    no word has more than 15 repetitions of the same character, we could use 4 bits
    per character for 26 x 4=104 bits. That fits comfortably in a u128, and while
    that's not tiny, it's at least a nice fixed size 16 byte thing we can use as a
    fast hash table key.\n\n    /// Group words by a u128 holding a 4-bit count of
    each letter A-Z.\n    /// Assumes uppercase A-Z words with no letter repeated
    more than 15 times.\n    fn u128_lettercount(words: &[String]) -> KeyGroups {\n
    \       let items = words.iter().enumerate().map(|(idx, word)| {\n            let
    mut lettercount = 0u128;\n            for letter in word.bytes() {\n                lettercount
    += 1u128 << ((letter - b'A') as u32 * 4);\n            }\n            (lettercount,
    idx as u32)\n        });\n        KeyGroups::new(words.len(), items)\n    }\n\n(Note
    that we've done something else here - we're only returning the list of anagrams,
    not a full dictionary containing all of the words that don't have anagrams.)\n\nAvoiding
    the string manipulation and sorting gives a big win:\n\n**Result: 20ms -\\> 5.6ms
    (31ns / word)**\n\n### A faster hash table\n\nAt this point, we might ask a question
    like \"how much does the slow default Rust hash table cost us?\"\n\nSo we'll switch
    to the [`rustc_hash`](https://crates.io/crates/rustc-hash) `FxHashMap`, which
    is much faster if you don't have to worry about adversarial inputs to your hash
    table.\n\n**Result: 5.6ms -\\> 4.1ms (23ns / word)**\n\nThat seems much better.
    But are we done yet?\n\n### 64-bit Gödel numbering with tuned primes\n\nOf course
    we're not done!\n\nStoring the letter count as a u128 is also a little slower
    than necessary, because it'll be split across two 64 bit registers and requires
    the compiler to carry that addition across them and do twice as much work for
    equality testing. But if we tried lettercounting in 64 bits, we would only be
    able to store 2 bits, and many words have more than 3 of the same letter (\"MISSISSIPPI\",
    for example, already has 4 S's).\n\nInstead, we'll use an approach based on[Gödel
    numbering](https://en.wikipedia.org/wiki/G%C3%B6del_numbering): we'll create a
    small table associating one distinct prime number with each letter, and identify
    each word by the product of the letter-primes. This guarantees a unique identifier
    for each mix of letters. Naively, one might assign \"a -\\> 2, b -\\> 3, c -\\>
    5\" and so on. But this is a practical blog post, and we'd like to fit the result
    in 64 bits; if we use the naive assignment, we overflow at the 365th word in our
    dictionary, \"ABORTIVENESSES\". And that's only 14 characters long, we have 3157
    15-character words as well! If we let it wrap, we'll have just implemented a hash
    function, and there's no guarantee that two words won't accidentally collide,
    so then we'd need to add some machinery to check that...\n\nSo here's the trick:
    Find an optimized assignment of primes to letters in the alphabet such that none
    of the words in our Scrabble dictionary overflow a 64 bit number. I started out
    thinking about the standard English letter frequency (ETAOINSHRDLU, etc.), but
    that turns out to be a little wrong: We don't care much about words like \"the\",
    we c"
