    Just to play with the idea: You could eagerly execute all non-IO branches (or some branches, using a branch predictor) in a thread pool to achieve faster runtime via multithreading. Would be a super inefficient use of resources though. I'm sure there's a lot of smarter ways to automatically parallelise code written for a single thread.
    I remember reading years ago about how Servo when it encounters a <script> block, it just keeps parsing as if the script block doesn't do document.write(...), but the moment it does, it rewinds to that point, because the <script> block has to behave synchronously (but doesn't mean it actually has to be processed synchronously in all situations). I'm imagining the same kind of principle could apply to running JS.
