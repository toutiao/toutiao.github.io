  author: syllogism
  text: If there&#x27;s a linear relationship between the weights and the output,
    it&#x27;s not so hard to read the weights and reason about what&#x27;s happening.
    If you read the reasoning traces for how the models do those tasks, you&#x27;ll
    see that they rely on those direct relationships.<p>The same could never work
    in a larger network. It&#x27;s not about just capacity to feed in the weights,
    it&#x27;s about the complexity of the relationship. There&#x27;s no demonstration
    here that an LLM can do that, and it doesn&#x27;t really make sense to want it
    to. It makes much more sense to author code to analyse and modify than it does
    to do it directly.
