  author: kstrauser
  text: My first tech job was working alongside the network admin at a regional ISP.
    I feel like a n00b on the subject, but objectively, I&#x27;m pretty good at it.
    So basically, I&#x27;ve nerded out about it for years. I do allow VPN access to
    my LAN, but even that is tightly firewalled with a default-deny policy. Connecting
    to the VPN just lets you make connections into the LAN&#x27;s address space, but
    only for certain IPs and ports. I can connect into Plex running on the LAN, and
    specific ports on the NAS. I can SSH into a Linux box that doesn&#x27;t have credentials
    to connect to anything else. That&#x27;s about it, really.<p>I didn&#x27;t set
    out to make a hypersecure setup, but approached it with &quot;least access&quot;
    in mind. I started with the default-deny firewall, and when I needed an exception,
    I added that one single exception. Honestly, if you follow that principle — don&#x27;t
    allow it if you don&#x27;t require it — you&#x27;ve done 95% of the work a dedicated
    expert would do.
