  author: tsimionescu
  text: The point here is that not all operators should have a concept of precedence.
    Expressions like &quot;a &amp; b + c &gt;&gt; d&quot; should be invalid, as no
    human actually understands them unless they spend a lot of careful focus. Instead,
    such an expression must be written as &quot;((a &amp; b) + c) &gt;&gt; d&quot;
    explicitly. On the other hand, &quot;a + b + c&quot; and even &quot;a + b * c&quot;  are
    fine, as addition and multiplication (and subtraction and division) are so drilled
    into everyone in early education.
