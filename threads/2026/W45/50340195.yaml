  author: andrewla
  text: I personally have been increasingly in favor of eliminating operator precedence,
    even including associativity. It so rarely adds value and is so easy to misunderstand.
    The SmallTalk and APL models are at least consistent and operator agnostic, but
    they are unintuitive to read to inexperienced coders.<p>Heavy nesting of complex
    expressions is also not easy to comprehend immediately, but it&#x27;s better than
    trying to unwind the precedence.<p>That said, maybe this approach is best; just
    take the small set of operators where we have all internalized the precedence
    and require it everywhere else.
