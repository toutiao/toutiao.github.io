  author: adrian_b
  text: In reality it is much better to evaluate all operators from right to left,
    as APL does since 1962 (with parentheses when you want another order).<p>Only
    in this direction the rule is always consistent, inclusively with assignment and
    with McCarthy logical operators (i.e. what the C language writes as &amp;&amp;
    and ||).<p>Moreover, only with this evaluation direction the non-commutative operators
    lead to useful operations when applied to arrays.<p>In order to make evaluation
    from left to right always consistent, far more changes would have to be done to
    the syntax of a programming language, than with the APL evaluation rule.
  score: 0
