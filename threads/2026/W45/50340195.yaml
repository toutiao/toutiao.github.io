  text: "&gt; When read procedurally (left to right) it is quite okay though,<p>Except
    that there are almost no circumstances in which &quot;((a &amp; b) + c) &gt;&gt;
    d&quot; is a sensible expression. The only reasonable interpretation is &quot;(a
    &amp; b) + (c &gt;&gt; d)&quot;, and even then that plus is suspicious.<p>In practice,
    the worst offenders are &quot;a &amp; b &gt;&gt; c&quot; and &quot;a &amp; b &lt;&lt;
    c&quot;. The first expression is usually intended to mean &quot;(a &amp; b) &gt;&gt;
    c&quot; — it&#x27;s a bitfield extraction; the second one is usually intended
    to mean &quot;a &amp; (b &lt;&lt; c)&quot; — it&#x27;s clearing of all but one
    bitfield. As you can see, those semantics are impossible to achieve with &lt;&lt;
    and &gt;&gt; having the same precedence."
