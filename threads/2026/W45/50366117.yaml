    quickly realised I&#x27;d need three or more, so switched to the two providers
    above.<p>2. Providers covered in the first point. Regarding models I use a combination
    of GLM5.3, GLM5.3 Flash and Deepseek 4.1 Flash 1017. Which model I use depends
