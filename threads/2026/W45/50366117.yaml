  author: peepee1982
  text: 'It has no weak points in my experience (compared to other harnesses). It
    is so good that I just can&#x27;t use anything else anymore without feeling frustrated.<p>Theo
    of T3 Code has made a recent video about its features.<p>A few examples of why
    I like it:<p>- Not having to use multiple agents (you can switch them mid-conversation
    with automatic handoff if you want)<p>- The way it handles environments (I can
    start a new session on any environment (machine) with two clicks (new thread -&gt;
    pick project on any environment)<p>- I can ask for visual responses (uses a T3
    Code tool and renders a html page inside chat with cards, charts, etc. that follow
    the currently selected color theme (even if you change the theme after the response
    has been generated)<p>- MCP tools like browser, webfetch, etc. so I don&#x27;t
    have to set them up for every agent<p>- Thread handling: Snooze, Settle, Archive,
    Delete. It&#x27;s the only tool where I don&#x27;t get overwhelmed when working
    on multiple Threads&#x2F;Projects at the same time (I am diagnosed with ADHD).<p>-
    Provider usage overview for all registered providers, showing pacing as well<p>-
    Great citation: when you make a selection in chat, a pill appears and you can
    create quotation elements that get added to that, can easily be edited or removed
    (the original reason why I even tried T3 Code in the first place, because it makes
    responding to long responses incredibly joyful instead of disorienting). I like
    it so much that I added the same mechanism to my own personal assistant&#x2F;agent
    that I host on my VPS.<p>- Great diffing view where you can pick worktree diffs,
    or any diff from a specific turn in the current thread<p>- Has it&#x27;s own subagent
    orchestration that&#x27;s very pleasant to use<p>- Many more little things that
    remove a lot of friction and just feel right for me.<p>It&#x27;s just baffling
    to me how it is better in every regard than every other harness that I&#x27;ve
    ever tried (Claude Desktop, Github Copilot App, OpenCode Desktop, all the CLIs,
    Integrated Agents in VSCode and Zed, etc.)<p>I will still start up a pi on the
    cli if I just have a quick question because T3 Code needs a bit to start up and
    connect to all providers&#x2F;environments. This is my only point of friction:
    It&#x27;s a bit heavy on resources (because it does a lot, not because it&#x27;s
    slow. I just happen to use it on very old hardware and on one device that is very
    slowed down due to heavy-handed security scanning). But other than that, I can&#x27;t
    imagine using anything else right now.<p>I don&#x27;t know if I&#x27;ve ever been
    this exciting about a piece of software. I was very sceptical at first, but quickly
    fell in love with it.'
