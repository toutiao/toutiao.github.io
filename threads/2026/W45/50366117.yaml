  author: djeastm
  text: I&#x27;m using T3 Code as well. I like that it&#x27;s completely open source
    and Theo is beyond transparent about how it works, imo. And he clearly uses it
    himself.<p>Then I used Claude to build an app called &quot;Superintendent&quot;
    that controls T3 Code through its API in a way that maximizes what I get out of
    my subscriptions.<p>One thing it does is, if I&#x27;ve got extra capacity building
    up for some reason (i.e. getting to the end of the week without using my limit),
    it will take a look at the projects I&#x27;ve pointed it to and ask Opus 5.5.
    to look at the projects and suggest improvements. Then, if there&#x27;s capacity,
    it will build them on a separate worktree and be there for me to review or decline.<p>I&#x27;ve
    got some other features like a dashboard that shows the limits and logs its activities
    and a way to ask it to &quot;refine&quot; random ideas I give it, then I can Approve&#x2F;Deny
    them and they&#x27;ll get queued to get built with whatever capacity I have left
    over. It pauses gracefully when I use T3 code actively, too.
