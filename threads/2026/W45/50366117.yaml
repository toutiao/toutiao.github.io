    Studio, and Copilot code reviews on Github. I mostly use agent mode; sometimes
    I use ask mode, and sometimes I use plan mode. (One very important thing is to
    instruct copilot, in .github\copilot-instructions.md, to only use its edit tool
    and not use Powershell to edit files. Otherwise you need to babysit it and approve
    cryptic find and replace commands.)<p>For Copilot in Visual Studio, I almost always
    use Claude Opus 5.5. Some of the GPT models &quot;appear&quot; to work well, but
    they leave the code harder to maintain.<p>We now do a round of Copilot reviews
    with our pull requests in draft mode before asking others to do the review; and
    we&#x27;re not spending as much time &quot;reading&quot; code when looking at
    pull requests.<p>We don&#x27;t (yet) have agents running unattended with high-level
    instructions and then making pull requests.<p>4) Are you using any agent orchestration
    or swarm tools?<p>No<p>5) Are you using broader agent platforms like OpenClaw
    &#x2F; Hermes Agent &#x2F; Grok bot &#x2F; Dots &#x2F; Muse?<p>No<p>------<p>One
    important thing: I&#x27;m after my boss to dedicate time (1-2 weeks) for me to
    set up and learn more of the hands-off tools. I <i>love</i> working with co-pilot,
    but it&#x27;s best for work where I need to be hands-on. I really need to be able
    to offload simple work, or work where lower-quality results are okay, to a bot
    that I don&#x27;t need to supervise.'
