  author: bsenftner
  text: |-
    I&#x27;ve got a somewhat sophisticated self made setup:<p>1a) OpenAI API subscription, integrated into an office suite + media pipeline I wrote
    1b) OpenAI codex $100 mo plan<p>2) Current count, 318 additional generative models across LLMs and then media generation of image, voice, music and video. The LLMs are mostly Qwen variants, and the media models are pretty much all the popular media models. These are organized, managed, and API operated locally through WanGP (open source model host) and two additional apps I wrote. One of those apps is a mobile phone pairing remote live video processor, so one can use their phone like a remote live camera at events, and the other is a plugin to WanGP so my software can securely operate WanGP remotely.<p>3) I use OpenAI Codex in a terminal as a coding assistant. Through that same account I also run the OpenAI Desktop app, and that integrates with my web apps through WebMCP and two additional types of agents in my apps: 1) all my UIs have knowledge assistants that explain how to use the UI they are associated, and they know more complex workflows that UI is a component. 2) My apps have &quot;method actor agents&quot; that are conversationally programmable experts located on specific interfaces, which users then tune to be experts in their work tasks. That&#x27;s like a smart assembly line worker waiting to be told what they are making. Then, through WebMCP, external agents will interact with my app resident agents, and together they act. Which is kind of amazing. So, in a way, they create a harness through their collaboration, which also includes the user, collaboratively.<p>4 &amp; 5) no.<p>My work interest is in creating an environment that promotes deep intellectual flow. One could use my setup and automate a bunch of things and sit back while their brain rots. Or one can also participate in the work at an interactive creative stream level, where the agents and software are doing work but all the creative and impactful decisions delegate to you. You&#x27;re in complete control over a swarm of virtual expert personalities that work for you, and you make their decisions. The work is office and media, which is broad.
