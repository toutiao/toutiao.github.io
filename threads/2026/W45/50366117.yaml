  author: dgb23
  text: Phasing out my usage of cloud based LLMs&#x2F;harnesses.<p>Focus is pi + self
    hosted GLM Flash.<p>Pi is lightweight and easily extensible and creates minimal
    extra noise. the output I get is very close to what I want to see.<p>my workflow
    is focused on clear turns between planning, testing and implementation. Any useful&#x2F;recurring
    tasks, like getting&#x2F;filtering logs, checking statuses etc get regularly folded
    into a project cli and agent skills that are local to the project.<p>I spend time
    interactively iterating on the plan&#x2F;design and acceptance tests, then let
    it do its thing. Usually I have multiple interactive sessions at once that I&#x27;m
    steering this way. 1-2 assigned projects, 1-3 side projects (additional automation,
    experiments&#x2F;POCs, workflow&#x2F;process efficiency etc.). I generally don&#x27;t
    do sub-agents. When I need throughput I automate first, frontloading the &quot;deterministic&quot;
    parts.
