  author: thefourthchime
  text: It used to be more interesting and elaborate, switching between different
    models. I used to use Cursor, then Codex, but since Opus 5.5 came out, I just
    use the Claude IDE. I got rid of all my skills and just set it to medium. Then
    I vaguely talk to it about very high-end things that I want, and it comes back
    with magic. Rinse and repeat.<p>I&#x27;d say the biggest trick is just to tell
    it what complete looks like. Be very specific about what you want it to come back
    with once it&#x27;s done. That gives it a good idea what the goal is. It&#x27;ll
    automatically create subagents and all that stuff. Although if you have money
    to burn and you&#x27;re doing something large, you can tell it to just go wide
    or boil the ocean.<p>Also, make sure you&#x27;re working on at least five different
    things. Otherwise, you&#x27;re sitting around for one agent.
