  text: I&#x27;ve been increasingly interested in language-oriented programming and
    denotational design. So i get claude to create a domain specific language in Racket
    modelling the software i&#x27;m trying to build, we create nouns and verbs whose
    meaning fits the behaviour i&#x27;m going for, then when we find bugs or notice
    we need more exceptional (less-elegant) one-off behaviour to tackle edge-cases,
    we iterate on the language in such a manner that it these are tackled emergently
    with preferably less concepts, more cohersion and composition. It&#x27;s somewhat
    similar to how memory safety is handled at compile time in Rust but for business
    logic.
