  author: rmah
  text: 'After a few decades of working in a variety of positions, I&#x27;ve come
    to the conclusion that the &quot;Peter Principle&quot; is cute, pithy aphorism
    but not reflective of reality.  The crux is that &quot;competence&quot; and promotion
    is not a one dimensional ladder where each promotion requires you to simply be
    more competent than in your previous position.  While this is sometimes true,
    just as often, promotion means that you need to exercise different skills.  Which
    you may or may not be able to do well (or learn rapidly enough).<p>For example,
    getting promoted to &quot;senior developer&quot; may mean higher expectations
    than just &quot;developer&quot;.  But you may also be expected to architect parts
    of systems, mentor more junior staff, provide guidance etc.  Even more starkly,
    if you get promoted to something like &quot;team lead&quot; or a more managerial&#x2F;executive
    level position, your need to be focus more on prioritization, managing people,
    etc.  Very different skills than writing code.<p>Further down, the author wrote:<p><i>&quot;The
    transformation into a syndrome shifted the experience of being impostered by a
    patriarchal, white supremacist society into a medicalized disorder, something
    for which the impostered person must be treated. That’s a neat trick: to shift
    the locus of treatment to the mistreated person, rather than the system that caused
    her harm.&quot;</i><p>At which point, I have to admit, I said &quot;WTF?&quot;
    in my head.  One could just as easily say the transformation into &quot;syndrome&quot;
    is rooted in a society that has shifted from focusing on actions and accountability
    to one that focuses ever more on inner-feelings as what is important.'
