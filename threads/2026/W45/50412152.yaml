  author: flatline
  text: I’d draw a distinction between management and technical leadership here.<p>Management,
    in the face of a stalemate, is going to address roadblocks from a human perspective.
    They will ask questions and listen. They will get people to talk and sort out
    their differences. Management will not weigh in with their own heavy handed technical
    decision unless they (and their team) has failed at the task of teamwork. Because
    no matter how good their technical chops, they are perpetually too far removed
    from the actual problem. Management will not really use the product the team is
    building. They can’t feel the impact of any one technical decision beyond how
    it impacts the team.<p>Technical leadership still has skin in the game. Leadership
    sets technical direction. They evaluate choices and tradeoffs based on technical
    merits. They are one of the resources management relies on. Leadership is going
    to have to live with the consequences of their decisions in their day to day work.
    They must use and build upon the thing they are leading.<p>Some people fill both
    roles. Some teams are lacking elements of one or both. Some teams fill these roles
    perfectly well in ad-hoc fashions, especially when you get teams of people strong
    in both areas - by far my favorite work experiences, everyone is exceptional and
    recognizes it in their peers. Then there is no hierarchy or need for it. That
    dynamic never lasts long, so we implement structures that try to capture it more
    broadly and often limp along for the sake of continuing to move forward as a group.
