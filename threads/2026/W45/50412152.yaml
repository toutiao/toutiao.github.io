  author: dav_Oz
  text: |-
    &gt; What we call imposter syndrome was originally termed imposter phenomena, a term that makes plain that it is something that can be observed, not merely felt. The transformation into a syndrome shifted the experience of being impostered by a patriarchal, white supremacist society into a medicalized disorder, something for which the impostered person must be treated. That’s a neat trick: to shift the locus of treatment to the mistreated person, rather than the system that caused her harm. But perhaps there’s even another, more diabolical move here. What if the popularity of imposter syndrome is, in part, a means of obscuring the actual imposters in our midst? What are we missing when we look inward instead of around?<p>This seemed always baffling if someone openly &quot;confessed&quot; suffering from the imposter syndrome.<p>It is like calling yourself a &quot;skeptic&quot; and taking joy in dismantling other people&#x27;s beliefs, yet reacting with extreme sensitivity the moment your own convictions are touched upon.
    Or if you were really paranoid, you would be unsure of everything (even of your paranoid state) so you wouldn&#x27;t just confidently drop that label in conversation doing so usually serves as a polite excuse for being a &quot;control freak&quot; which in turn serves as an excuse for something else and so on.<p>In a broader sense this touches upon a deeper cultural issues around appearances and self-identification. In (a lot of) different cultures one rarely talks about an internal state in an abstract, systematic almost clinical manner instead a wide breadth of colorful almost childlike language is used to describe rising and ebbing feelings while at the same time one&#x27;s actions are observed very diligently and somehow quietly tallied over time.<p>Under those circumstances, you can bluff, obfuscate or outright lie and it matters very little so long as your actions are deemed <i>good</i> conversely if you present yourself as genuine, &quot;authentic,&quot; and vulnerable while your actual deeds are horrible: out you go. So overall there is less &quot;flexibility&quot; and more &quot;accountability&quot;.
