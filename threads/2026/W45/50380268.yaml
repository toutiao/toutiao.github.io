  text: It&#x27;s worth noting that there are more that two kinds of buffering, contrary
    to the introduction here, and the one that&#x27;s actually used in several C libraries
    is so-called <i>smart buffering</i>.  This <i>also</i> flushes standard output
    when standard input needs to do an underlying read and it is reading the beginning
    of a line.<p>And since musl libc is in the news, it is worth nothing that musl&#x27;s
    fwrite() is another of those that looks for the <i>last</i> linefeed in the buffer,
    rather than the first, and so should emit multiple lines in one underlying write().  Although
    this is only done in fwrite() specifically.<p>* <a href="https:&#x2F;&#x2F;git.musl-libc.org&#x2F;cgit&#x2F;musl&#x2F;tree&#x2F;src&#x2F;stdio&#x2F;fwrite.c#n14"
