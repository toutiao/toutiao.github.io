  content: "## [We can do better than line-buffered output](/blog/2026/11/05/)\n\n
    nullprogram.com/blog/2026/11/05/ \n\n[Buffered output](/blog/2023/02/13/) typically
    comes in two flavors: fully buffered and line buffered. If output goes to a terminal
    then the implementation automatically selects line buffering, flushing its buffer
    when a line is completed so that it reaches the user immediately. Otherwise it
    fully buffers, holding output until the buffer is full or an explicit flush event
    at some arbitrary point in the future. Line buffering is a common bottleneck in
    non-interactive terminal applications such that it’s worth redirecting output
    to a file or pipe in order to avoid it. _It doesn’t have to be this way_. We can
    have our cake and eat it, too: promptly delivering lines to a terminal at fully-buffered
    speeds.\n\nFor example, Info-ZIP `unzip` prints file names as it extract them
    from an archive. This printout dominates extraction time of archives with many
    small files. Sometimes I run `unzip` without options, then my terminal floods
    with file names and I know that my extraction is bottlenecked. So I cancel and
    restart with `-q` (quiet) to avoid the bottleneck, because it’s faster to start
    over than wait. Conscious of this experience, I avoided the problem in [tugz](/blog/2026/10/13/)
    `unzip` without changing the user interface. You get a listing but you don’t have
    to pay for it.\n\n    $ unzip example.zip\n    Archive: example.zip\n      inflating:
    example.bmp\n      inflating: example.svg\n      inflating: example.txt\n\nConsider
    this C program that prints three lines:\n\n    #include <stdio.h>\n    \n    int
    main()\n    {\n        puts(\"a\\nb\");\n        puts(\"c\");\n    }\n\nIf we
    examine the writes with, say, [strace](/blog/2018/06/23/):\n\n    $ strace -o
    log -e write ./a.out\n    a\n    b\n    c\n\nWe might see (here glibc):\n\n    write(1,
    \"a\\n\", 2) = 2\n    write(1, \"b\\n\", 2) = 2\n    write(1, \"c\\n\", 2) = 2\n\nYes,
    glibc takes line buffering _quite literally_, even splitting writes on a string.
    Some implementations are a little more sophisticated:\n\n    write(1, \"a\\nb\\n\",
    2) = 4\n    write(1, \"c\\n\", 2) = 2\n\nCPython makes exactly those writes for
    this program:\n\n    import sys\n    \n    sys.stdout.write(\"a\\nb\\n\")\n    sys.stdout.write(\"c\\n\")\n\nIts
    rule is to flush if its buffer contains a newline after appending the new output,
    with the consequence of possibly outputting partial lines. Building on [the previous
    example](/blog/2023/02/13/):\n\n    enum {\n        BUF_ERR = 1 << 0,\n        BUF_LINE
    = 1 << 1,\n    };\n    \n    typedef struct {\n        uint8_t *buf;\n        ptrdiff_t
    cap;\n        ptrdiff_t len;\n        int fd;\n        int flags;\n    } Buf;\n
    \   \n    bool os_write(int fd, void *, ptrdiff_t);\n    \n    void flush(Buf
    *b)\n    {\n        if (!(b->flags & BUF_ERR) && b->len) {\n            if (!os_write(b->fd,
    b->buf, b->len)) {\n                b->flags |= BUF_ERR;\n            }\n            b->len
    = 0;\n        }\n    }\n\nSuch line buffering might be achieved with a test-then-flush:\n\n
    \   bool has_newline(Buf *b)\n    {\n        int r = 0;\n        for (ptrdiff_t
    i = 0; i < b->len; i++) {\n            r |= b->buf[i] == '\\n';\n        }\n        return
    r;\n    }\n    \n    void append(Buf *b, uint8_t *src, ptrdiff_t len)\n    {\n
    \       uint8_t *end = src + len;\n    \n        while (!(b->flags & BUF_ERR)
    && src<end) {\n            ptrdiff_t left = end - src;\n            ptrdiff_t
    avail = b->cap - b->len;\n            ptrdiff_t amount = avail<left ? avail :
    left;\n    \n            memcpy(b->buf+b->len, src, amount);\n            b->len
    += amount;\n            src += amount;\n    \n            if (amount < left) {\n
    \               flush(b); // make room\n            }\n        }\n    \n        //
    test-then-flush if line buffered\n        if ((b->flags & BUF_LINE) && has_newline(b))
    {\n            flush(b);\n        }\n    }\n\nIf we’ve got a bunch of lines to
    print and append them one after another into the buffer, that’s a lot of writes
    which could have been one.\n\n### Eat all the cake\n\nLet’s think about our goal:
    If the output is a terminal then we don’t want to hold back lines indefinitely.
    That’s not the same as a write on every newline. There’s already a solution for
    the problem where we’re in a hurry to send out data, but the underlying, _buffer-oblivious_
    caller makes lots of small writes: [Nagle’s algorithm](https://en.wikipedia.org/wiki/Nagle%27s_algorithm).\n\nThat
    is, **flush the buffer if it’s been idle a short time**. We don’t actually care
    about newlines in particular. The catch is that it requires tweaking the interface.
    Add a deadline to the buffer:\n\n    typedef struct {\n        int64_t deadline;\n
    \       // ...\n    } Buf;\n    \n    int64_t os_monotonic_clock();\n    \n    void
    deadline_flush(Buf *b)\n    {\n        if ((b->flags & BUF_LINE) && b->len) {\n
    \           int64_t now = os_monotonic_clock();\n            if (b->deadline &&
    now>b->deadline) {\n                flush(b);\n                b->deadline = 0;\n
    \           } else {\n                b->deadline = now + DEADLINE;\n            }\n
    \       }\n    }\n\nWhere `DEADLINE` is something appropriate for human perception,
    like 100ms or so. We could poke this concurrently in a thread, awoken via futex
    when data is written to the buffer. But better to poke it between short stints
    of work, which is how tugz works. For example (using [my strings](/blog/2025/01/19/#strings)):\n\n
    \   for (/* filename in filenames */) {\n            Str pre = S(\" inflating:
    \");\n            Str suf = S(\"\\n\");\n            append(&stdout, pre.data,
    pre.len);\n            append(&stdout, filename.data, filename.len);\n            append(&stdout,
    suf.data, suf.len);\n    \n            while (/* not done inflating */) {\n                //
    1. inflate block\n                // 2. write block\n                deadline_flush(&stdout);\n
    \           }\n        }\n\nIf it processes multiple files within the deadline,
    their names write out together. No threads. The behavior difference compared to
    traditional flush-on-newlines is imperceptible to a humans, aside from the fact
    their program runs faster. One more reason not to bother with [crummy C stdio](/blog/2023/02/11/).\n\n-
    [c](/tags/c/)"
