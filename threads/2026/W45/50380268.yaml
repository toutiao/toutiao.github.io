  author: Veserv
  text: Yes, basically all buffering should use work-or-time based flushing.<p>Work-based
    flushing exists to batch work to amortize overhead. It allows you to tune how
    much time you spend in overhead in a work period. However, this can result in
    unbounded delay.<p>Time-based flushing targets a worst-case latency in low throughput
    environments. This ensures you do not get unbounded delays. Interestingly, this
    also allows you to tune how much time you spend in overhead in a work period.<p>So,
    with work-or-time based flushing what you are really tuning is how much time you
    are willing to spend in overhead in a work period and balancing that against latency.<p>As
    a nit, the article calls this a derivative of Nagle’s algorithm, but it is basically
    the opposite. Nagle’s algorithm is about batching until acknowledgement with no
    mention of time. In fact, the lack of time-based flushing in Nagle’s algorithm
    is why it interacts so poorly with TCP Delayed Ack.
