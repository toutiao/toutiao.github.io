  author: mindslight
  text: Every political ideology can be twisted to carry water for authoritarianism,
    unfortunately.<p>I consider myself a libertarian, in that I consider individual
    liberty to be the chief metric by which our social systems should be judged.<p>But
    yes, I agree people claiming to be libertarians should have been speaking out
    against the fascists the loudest, while most were doing the exact opposite. All
    too many were happy being (not-so-) crypto-fascists, where the lofty ideals of
    individual freedom were merely trotted out as unobtainable goals to be denied
    when some ridiculous logical precondition could not be met. <i>Temporarily embarrassed
    millionaires</i> applied to fundamental human rights.<p>This did untold damage
    to the cause of individual liberty. &quot;Free speech absolutist&quot; is now
    nothing more than the butt of a joke, rather than a guiding principle of the Internet
    revolution.<p>Don&#x27;t get me wrong here - last night was heartening. Voters
    soundly rejected fascism, red in tooth and claw, in the only way available in
    our two party system. I was right there along with you!<p>I just hope to hell
    democratic leadership can <i>do something</i>. Grump (or hopefully Vance) is going
    to be vetoing any positive action, and the public will eventually tire of two
    years of investigations and grandstanding. And the last thing we need is sandbagged
    legislation that has been neutered to be palatable to corpo sponsors.<p>We&#x27;ve
    got a wave of governors, momentum, and a mandate. Perhaps let&#x27;s start pushing
    for some Constitutional amendments. Right of Recall (for all three branches),
    Ranked Pairs voting, Enshrining independent agencies in law (with their heads
    elected like the President is), a repudiation of Citizens United.<p>The obvious
    day-to-day is opposing the Grump regime, stopping the hemorrhaging of our institutions,
    repairing our relationships with our allies, and so on. But those amendments are
    what I see as the type of fundamental meta reforms we should all be able to agree
    upon, to address the deep-set issues that have caused so many of our fellow citizens
    to be lured by the siren song of spiteful hate in the first place. What do you
    think, friend?
  score: 0
