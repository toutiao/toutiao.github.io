  author: adrian_b
  text: There are some claims of deciphering some parts of the Linear A Minoan documents,
    which are not corroborated yet by other researchers, but which are nonetheless
    more plausible than all the earlier claims of deciphering Linear A, which were
    definitely wrong.<p>If this partial decipherment were right, the language of Linear
    A would be Hurrian, i.e. the language of a state that was important around 4 thousand
    years ago and which was located in the territory of present Syria.<p>The Hurrians
    from Syria also used writing, but there they had adapted a variant of the cuneiform
    writing. Some Hurrian texts have also been found written with the Semitic alphabet
    used in Ugarit. There are some features of the Hittite variant of cuneiform writing
    that seem to have been taken from their Southern neighbors, the Hurrians, so it
    is possible that the Hittites have learned writing from the Hurrians, who had
    been using cuneiform writing for a few centuries before the Hittites, instead
    of taking writing directly from Assyria. This would be similar to how the Greek
    users of Linear B have taken writing from the Minoan users of Linear A.<p>It seems
    that the Hurrians had a rich mythology, which influenced many of their neighbors,
    and a few of their myths have been preserved, inclusively in the Hittite archives.<p>There
    exists no certain relationship between Hurrian and any language that survives
    today. In the antiquity there was a related language spoken in Urartu, on the
    territory of present Armenia. There are however a few similarities between Hurrian
    and some of the languages of the Caucasus area, but due to the difference in time
    of many thousands of years it cannot be known whether there is any genetic connection
    between them.<p>So if the claims about a decipherment of Linear A were true, that
    would imply that the Minoans have colonized Crete, and probably also Cyprus, by
    coming from the nearby territory where today is Syria. This sounds plausible,
    and that territory is one that had become &quot;civilized&quot; before the more
    Northern territories of Anatolia and Greece.
