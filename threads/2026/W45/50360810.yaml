article:
  url: https://www.smithsonianmag.com/history/greece-has-its-own-pompeii-and-the-ruins-tell-a-captivating-story-of-a-sophisticated-seafaring-bronze-age-society-180989747/
  title: Bronze Age Akrotiri Is Greek's Pompeii
  fetch_status: success
  content: "![The ruins of Akrotiri, a Bronze Age settlement on what is now the Greek
    island of Santorini](https://th-thumbnailer.cdn-si-edu.com/ehZElYzjs8et1BTmfYtqWfu2Omg=/1000x750/filters:no_upscale():focal(750x500:751x501)/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer_public/a0/f0/a0f097c9-8b61-4750-b992-4af6a4fada8e/akrotiri-ruins.png)\n_The
    ruins of Akrotiri, a Bronze Age settlement on what is now the Greek island of
    Santorini\n              Westend61 via Getty Images_\n\nThe earth rumbled for
    days. Inhabitants of the seafaring Bronze Age settlement of[](https://l.gourl.es/l/93fda1779fada773bf7b3c93b120a3d0c3805a0b?notrack=1&u=11747643)[Akrotiri](https://l.gourl.es/l/93fda1779fada773bf7b3c93b120a3d0c3805a0b?notrack=1&u=11747643)
    watched smoke plume from [Thera](https://www.britannica.com/event/eruption-of-Thera),
    a long-dormant volcano on what is now the Greek island of [Santorini](https://www.bbc.com/travel/article/20180128-santorini-an-archetypal-greek-island-fantasy).
    People gathered their belongings and safely stored the valuables they were forced
    to leave behind. Then they fled by boat to nearby islands.\n\nWhen these minor
    [earthquakes and eruptions](https://www.sciencedirect.com/science/article/pii/S0377027319306286)
    subsided, residents returned to Akrotiri, collecting materials for reconstruction
    and beginning the arduous process of [repairing the damage](https://greekreporter.com/2026/08/19/akrotiri-santorini-bronze-age-city-pompeii/).
    But the ground continued to tremble. As [conditions worsened](https://eos.org/articles/podcast-escape-from-thera),
    they made the difficult decision to flee once more, hopeful that their homes would
    survive the coming devastation.\n\nWhen Thera erupted again, the explosion was
    so powerful that it destroyed Akrotiri, burying the settlement (and the island
    that shared the volcano’s name) in some 200 feet of ash and pumice stone. The
    timing of the disaster is the [subject](https://www.atlasobscura.com/articles/when-did-thera-eruption-happen)
    of [intense](https://ui.adsabs.harvard.edu/abs/2012EPJP..127....9M/abstract) [debate](https://www.researchgate.net/publication/380317187_Minoan_Eruption_chronology_A_five_decades-long_debate_In_Driessen_J_Fantuzzi_T_eds_CHRONOS_Stratigraphic_Analysis_Pottery_Seriation_and_Radiocarbon_Dating_in_Mediterranean_Chronology_AEGIS_26_Louvain-),
    but scholars [generally](https://madainproject.com/akrotiri) [date it](https://www.science.org/doi/10.1126/sciadv.aar8241)
    to between 1620 and 1530 B.C.E. The event was one of the [largest](https://www.livescience.com/planet-earth/volcanos/the-12-biggest-volcanic-eruptions-in-recorded-history)
    volcanic eruptions in recorded history: Thera released about [four times](https://www.sciencedirect.com/science/article/abs/pii/016727899490135X)
    more volcanic material than the infamous [Krakatau](https://volcano.oregonstate.edu/faq/describe-1883-eruption-krakatau)
    eruption, which killed upwards of [36,000 people](https://www.nhm.ac.uk/discover/the-1883-krakatau-eruption-a-year-of-blue-moons.html)
    in what is now Indonesia in 1883.\n\n## \n\n![A 2000 satellite image of Santorini](https://th-thumbnailer.cdn-si-edu.com/uyd1AhHAmbnNAr_3oGYVQtn0NYA=/fit-in/1072x0/filters:focal(596x615:597x616)/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer_public/7c/c7/7cc72a7d-4c55-4d16-9b2f-ec42258124d6/santorini_aster.jpg)\n_A
    2000 satellite image of Santorini. The bay at the center of the island is the
    volcanic caldera created by Thera's eruption.\n    \n    \n      Public domain
    via Wikimedia Commons_\n\n## The fallout of the Thera eruption\n\nThe ash cloud
    formed by the Thera eruption completely transformed the island’s lush, humid environment
    into an arid one. Ash from the volcano was so widespread that it [rained down](https://www.nytimes.com/1985/12/24/science/new-find-is-linked-to-events-to-exodus.html)
    as far as modern-day Egypt and Israel. Layers of sand and pebbles found between
    archaeological deposits suggest that [multiple](https://www.nytimes.com/2009/11/03/science/03tsunami.html)
    [tsunamis](https://archaeology.cornell.edu/news/statistical-analysis-aims-solve-greek-volcano-mystery)
    also contributed to the destruction.\n\nBut the biggest fallout of this cataclysmic
    event happened when a portion of the volcanic [caldera](https://www.researchgate.net/publication/299725187_Santorini_Eruption)
    collapsed into the sea a [few days](https://www.nature.com/articles/ncomms13332)
    after the eruption, forever changing the landscape of Santorini. This plummet
    into the depths of the Aegean Sea has become the [stuff of legends](https://www.lost-atlantis.com/).
    Some claim that Akrotiri is the [lost city](https://akrotiri-museum.com/2023/08/29/atlantis-and-santorini-connecting-myths-and-geology/)
    of [Atlantis](https://www.si.edu/object/yt_VO7ZZN4zpVg), which the Greek philosopher
    Plato [described](https://classics.mit.edu/Plato/critias.html) centuries later,
    around 360 B.C.E. Most modern scholars, however, agree that Plato created the
    tale of the [sunken island](https://www.britannica.com/topic/Atlantis-legendary-island)
    as an allegorical device.\n\nDid you know? The legend of Atlantis\n\n- In Plato’s
    telling, Atlantis was home to descendants of the sea god [Poseidon](https://www.britannica.com/topic/Poseidon),
    who turned on his progeny after they proved unworthy of his favor. According to
    the London-based [Horniman Museum & Gardens](https://www.horniman.ac.uk/story/the-legend-of-atlantis/),
    “The tale warns against the dangers of power and corruption, as well as stressing
    the importance of goodness.”\n- Plato’s [_Timaeus_](https://classics.mit.edu/Plato/timaeus.html)
    suggests that Atlantis succumbed to “violent earthquakes and floods, and in a
    single day of misfortune,” the island “disappeared in the depths of the sea.”\n\nMuch
    like the Roman city of [Pompeii](https://www.smithsonianmag.com/history/we-all-know-the-story-of-the-pompeii-victims-who-died-when-mount-vesuvius-erupted-2000-years-ago-archaeologists-are-still-learning-about-those-who-made-it-out-alive-180989207/),
    which was destroyed when [Mount Vesuvius](https://www.britannica.com/place/Vesuvius)
    erupted in [79 C.E.](https://www.smithsonianmag.com/smart-news/if-mount-vesuvius-erupted-in-august-why-were-pompeii-victims-wearing-heavy-wool-garments-180987895/),
    Akrotiri was preserved beneath the ash. “Everything was absolutely annihilated
    and completely encapsulated on the island,” says [Lefteris Zorzos](https://www.santorini-islandguide.com/lefteris-zorzos),
    an archaeologist whose research focuses on the prehistoric landscape of Santorini.
    This created a rare time capsule that provides an unprecedented look into the
    daily life of this Middle Bronze Age [Cycladic civilization](https://www.britannica.com/topic/Cycladic-civilization),
    so called after the [Aegean islands](https://www.britannica.com/place/Cyclades)
    where the culture flourished between about 3000 and 1000 B.C.E.\n\nSantorini remained
    uninhabited for some [700 years](https://greekreporter.com/2026/09/08/how-santorini-resettled-after-minoan-eruption/).
    According to the ancient Greek historian [Herodotus](https://www.britannica.com/biography/Herodotus-Greek-historian),
    Phoenicians [started repopulating](https://lexundria.com/hdt/4/mcly) the island
    in the ninth century B.C.E. But more than 2,500 years would pass before archaeologists
    uncovered the ruins of ancient Akrotiri beneath the layers of dirt and ash.\n\n##
    Discovering Akrotiri\n\nIn 1866, miners working in pumice quarries on the island
    of [Therasia](https://journal.equinoxpub.com/JMA/article/view/849), directly west
    of Thera, discovered a [prehistoric building](https://www.ta-pragmata.com/book_thirasia_ii_eng.htm)
    while collecting ash to insulate the [Suez Canal](https://www.smithsonianmag.com/smart-news/how-the-groundbreaking-suez-canal-forever-transformed-the-worlds-shipping-routes-180985273/).
    The French School at Athens launched a small excavation of the area in 1870, but
    a large-scale dig at Akrotiri only comm"
