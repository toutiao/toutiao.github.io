  author: mojomark
  text: By dividing by 3 you are introducing a scaler into the operation.<p>Multiplication
    also flips signs (direction). That&#x27;s why a negative * negative = positive,
    whereas a negative + negative = negative. The addition operator does not flip
    direction.<p>Multiplication is not generally the same as multiple addition operations.
    However, it has the same result for positive whole numbers.<p>I am not writing
    this to flippant. I&#x27;m a 40-something year old engineer and I litterally thought
    the same thing until a year ago-ish. I was trying to build a function (I can&#x27;t
    recall what exactly) for a project and I said, well instead of multiplying these
    terms (which wasn&#x27;t efficient for what I was doing or something), I&#x27;ll
    just cycle through and add the terms X-number of times. ChatGPT said &quot;uh,
    no, that&#x27;s not the same thing,&quot; to which I said NFW and proceeded down
    a deep rabbit hole on the difference. I&#x27;m glad I did because I also now have
    a much better intuition for imaginary numbers, which I was severely lacking before.
