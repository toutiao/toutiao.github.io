  author: shoo
  text: 'That&#x27;s a fun question.<p>If we&#x27;re allowed to introduce our own
    operators, we could concoct something like decimal notation<p>a . b := 10a + b<p>So
    we could write 90210 as 9 . 0 . 2 . 1 . 0 = S(S(S(S(S(S(S(S(S(0))))))))) . 0 .
    S(S(0)) . S(0) . 0<p>That doesn&#x27;t quite work as it still depends upon a bunch
    of literal zeros.  We could replace 0 with an operator Z() := 0, but that seems
    to be very much against the spirit of the challenge.<p>We could rewrite our ersatz
    decimal expression to only require a single zero &amp; then evaluate a vector
    of functions  f : N -&gt; N across that zero, resulting in a vector of natural
    numbers, then reduce that vector to a single number with our `.` decimal notation
    operator.<p>Let M(fs, x) := (fs_1(x), ..., fs_n(x))<p>Let R(x) := x_1 . x_2 .
    ... . x_n<p>90210 = R(M((SSSSSSSSS, Id, SS, S, Id), 0))<p>the number of symbols
    to write a d-digit number this way is bounded by 10 + 10d = 10 + 10log_10(n)<p>Is
    this cheating &#x2F; against the spirit of the challenge? Perhaps!'
  score: 0
