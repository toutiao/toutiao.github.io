  author: reichstein
  text: "Multiplication is the generalization of repeated addition. Repeated addition
    can be generalized to fractional values.<p>In the integers, it is the same thing,
    with a rule for negative times.<p>In the rational numbers, you can generalize
    to adding a number to itself a  rational number of times. Adding a&#x2F;b to itself
    p&#x2F;q times is defined as adding a to itself p times, with a divisor that is
    adding b to itself q times.<p>So adding the rational 5 (5&#x2F;1) with itself
    2_and-1&#x2F;3 (4&#x2F;3) times just means (5+5+5+5) &#x2F; (1 + 1 + 1) =  20&#x2F;3,
    a rational that we can also write as 6 \n-and-2&#x2F;3. Only addition of integers
    is used.<p>Which is the same as rational multiplication (a&#x2F;b)<i>(p&#x2F;q)
    = (a</i>p)&#x2F;(b*q).<p>But it&#x27;s true that you can&#x27;t say that rational
    multiplication is the same as _integer_ repeated addition."
