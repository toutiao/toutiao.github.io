  text: Stocks are backed by something real (in general). There&#x27;s a business.
    That business can&#x27;t just manufacture new stock out of thin air without going
    through a regulatory process to do so and the total number of shares is publicly
    known.<p>Furthermore the institutions that allow you to trade mostly aren&#x27;t
    taking positions on the stock price and in theory there are jail-time consequences
    if they cheat. In practice that isn&#x27;t always the case but at least there
    is <i>some</i> limit to what they can do to screw over their customers.<p>These
    contract markets have absolutely none of that. If they decide to take up positions
