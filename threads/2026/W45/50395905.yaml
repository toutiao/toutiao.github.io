    thing that even God engaged in) is about creating something of value. Money was
    the natural reward for what was made. Thus, commerce (at the time) was about circulating
    manufactured goods.<p>The ancient issue with gambling is that neither the gambler
    nor any operator is producing anything of value. With nothing to show from any
    party, medieval scholars would declare gambling undeserving of any financial flow.
    Most Christians are still (at least unconsciously) working from these principles,
    even if the operations of the economy has changed since then.
