article:
  url: https://arstechnica.com/tech-policy/2026/11/kalshi-court-losses-pile-up-as-judges-refuse-to-block-state-gambling-laws/
  title: Kalshi court losses pile up as judges refuse to block state gambling laws
    - Ars Technica
  fetch_status: success
  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nKalshi
    is having a bad week in the federal court system. Two circuit appeals courts rejected
    the prediction market’s latest attempts to block state gambling laws in Connecticut,
    New York, and Nevada. Kalshi is separately facing a new lawsuit filed by the Arkansas
    attorney general.\n\nIn all cases involving Kalshi and state governments around
    the US, the main issue is [whether state gambling laws apply to prediction markets](https://arstechnica.com/tech-policy/2026/10/a-senator-tried-to-ban-gambling-on-prediction-markets-now-shes-a-kalshi-lobbyist/)
    despite Kalshi’s claim that its platform offers “swaps” that can only be regulated
    by the US Commodity Futures Exchange (CFTC). The Trump administration is on Kalshi’s
    side, with Donald Trump Jr. serving as an advisor to Kalshi in exchange for a
    [generous equity deal](https://www.ft.com/content/f70147b1-ee77-4d75-8587-707a49ddb605?syn-25a6b1a6=1).\n\n“Kalshi
    insists that its products are not gambling,” but “Arkansas law is concerned with
    substance, not semantics,” Arkansas Attorney General Tim Griffin said yesterday
    when [announcing](https://media.ark.org/ag/2026-11-04-Kalshi-lawsuit_FINAL.pdf)
    his lawsuit against Kalshi. Kalshi’s prediction market lets customers “wager money
    on the outcome of just about anything” despite the fact that “gambling on an unregulated
    platform is squarely prohibited by Arkansas law,” he said.\n\nGriffin’s [lawsuit](https://media.ark.org/ag/SOA-v.-Kalshi-Complaint-FM.pdf)
    was filed in an Arkansas state court. Kalshi violated state law by offering gambling
    to people as young as 18 and by failing to pay taxes or comply with other restrictions,
    Griffin said. Arkansas law permits gambling within certain limits, such as an
    age minimum of 21 years old for [electronic wagering accounts](https://codeofarrules.arkansas.gov/Rules/Rule?levelType=section&titleID=23&chapterID=238&subChapterID=295&partID=1258&subPartID=7967&sectionID=52234).\n\n“Instead
    of obtaining the licenses, submitting to the oversight, complying with the restrictions,
    and paying the taxes required of lawful gambling operators in Arkansas, Kalshi
    opened its platforms to Arkansas consumers, including individuals as young as
    18 years old, encouraged them to wager real money on sporting and entertainment
    events, and profited from those wagers,” Griffin said.\n\n## Kalshi can’t get
    orders blocking state gambling laws\n\nArkansas filed its lawsuit about a week
    after Utah Attorney General Derek Brown [lodged criminal charges](https://arstechnica.com/tech-policy/2026/10/trump-admin-sues-utah-to-save-kalshi-from-the-states-total-ban-on-gambling/)
    against Kalshi and its founders for violating Utah’s ban on gambling. A federal
    judge in Utah previously [ruled](https://storage.courtlistener.com/recap/gov.uscourts.utd.162647/gov.uscourts.utd.162647.65.0.pdf)
    that Utah can enforce its anti-gambling laws against Kalshi.\n\nKalshi said in
    response to Arkansas’ lawsuit that it should not have to comply with different
    laws in each US state. “Kalshi is a federally regulated financial exchange,” Kalshi
    said in a statement provided to Ars. “Markets can’t operate when the rules change
    at every state line, which is why Congress created a single federal regulator,
    with nationwide rules. Kalshi follows those rules and will defend against Arkansas’s
    baseless claims.”\n\nMany other states are trying to enforce their gambling laws
    against Kalshi, and the Supreme Court may ultimately decide whether they are able
    to do so.&nbsp;Kalshi has won some rulings, but Griffin may feel emboldened by
    the company’s recent court losses. For example, the US Court of Appeals for the
    Ninth Circuit [ruled in August](https://arstechnica.com/tech-policy/2026/08/kalshi-cant-evade-nevada-gambling-laws-by-calling-bets-swaps-court-rules/)
    that Nevada can stop the prediction market from allowing sports bets. A panel
    of three judges unanimously found that sports bets on Kalshi are not swaps and
    can be regulated under state gambling laws.\n\nKalshi sought to overturn the judges’
    panel ruling by seeking a rehearing in front of the entire Ninth Circuit appeals
    court, which has 29 judges. None of the judges supported a rehearing.\n\n“The
    full court has been advised of the petition for rehearing en banc and no judge
    has requested a vote on whether to rehear the matter en banc,” the court said
    in a [ruling](https://storage.courtlistener.com/recap/gov.uscourts.ca9.819aec5f-bc51-465d-8f8d-4b8aeca97255/gov.uscourts.ca9.819aec5f-bc51-465d-8f8d-4b8aeca97255.231.0.pdf)
    yesterday. “The petition for panel rehearing and the petition for rehearing en
    banc are denied.”\n\n## Lower-court rulings upheld\n\nKalshi also lost on Tuesday
    in the Second Circuit, where it was trying to overturn earlier losses to New York
    and Connecticut. Kalshi sought preliminary injunctions to prevent [New York](https://storage.courtlistener.com/recap/gov.uscourts.ca2.277417a9-ec09-435b-9ce5-7c8293cd50c8/gov.uscourts.ca2.277417a9-ec09-435b-9ce5-7c8293cd50c8.2.0.pdf)
    and [Connecticut](https://storage.courtlistener.com/recap/gov.uscourts.ca2.f7823f2e-941d-43d0-9c68-2547d9b1b7ed/gov.uscourts.ca2.f7823f2e-941d-43d0-9c68-2547d9b1b7ed.2.0.pdf)
    from enforcing their gambling laws, but both requests were rejected by US district
    court judges.\n\nA plaintiff seeking a preliminary injunction must show that it
    is likely to succeed on the merits of its case, and judges decided that Kalshi
    had not done so. The Second Circuit appeals court considered Kalshi’s losses to
    New York and Connecticut in a single case and upheld the lower-court decisions.\n\n“Appellants
    have failed to make the required showing that an injunction pending appeal is
    warranted,” a three-judge panel [ruled](https://storage.courtlistener.com/recap/gov.uscourts.ca2.277417a9-ec09-435b-9ce5-7c8293cd50c8/gov.uscourts.ca2.277417a9-ec09-435b-9ce5-7c8293cd50c8.74.0.pdf)
    on Tuesday. The judges also refused to overturn [Coinbase’s loss against Connecticut](https://storage.courtlistener.com/recap/gov.uscourts.ca2.4861a287-4c60-42ab-9a21-8839657c539b/gov.uscourts.ca2.4861a287-4c60-42ab-9a21-8839657c539b.2.0.pdf)
    in a case that presented the same legal issues.\n\nKalshi lost another significant
    case in September when an appeals court determined that Ohio and Tennessee can
    enforce their gambling laws against the prediction market. A three-judge panel
    in the US Court of Appeals for the Sixth Circuit [ruled unanimously](https://arstechnica.com/tech-policy/2026/09/another-court-rules-kalshi-sports-bets-arent-swaps-says-states-can-crack-down/)
    against Kalshi in that one.\n\n## Trump admin on Kalshi’s side\n\nThe Trump administration
    is simultaneously pursuing litigation against states trying to enforce gambling
    laws against prediction markets. The CFTC, claiming sole authority to regulate
    platforms like Kalshi and Polymarket, has sued Arizona, Connecticut, Illinois,
    Kentucky, Minnesota, New Mexico, New York, Rhode Island, Utah, and Wisconsin.\n\nKalshi’s
    biggest win came in April in the Third Circuit, where the appeals court [ruled](https://arstechnica.com/tech-policy/2026/04/sports-bets-on-prediction-markets-ruled-to-be-swaps-exempt-from-state-laws/)
    that New Jersey cannot regulate sports bets on prediction markets. Judges there
    decided that wagers on Kalshi meet the federal definition of swaps, defined under
    US law as contracts in which payment “is dependent on the occurrence, nonoccurrence,
    or the extent of the occurrence of an event or contingency associated with a potential
    financial, economic, or commercial consequence.”\n\n“Kalshi’s sports-related event
    contracts are swaps traded on a CFTC-licensed DCM [designated contract market],
    so the CFTC has exclusive jurisdiction,” Third Circuit judges wrote.\n\nBut other
    courts that ruled against Kalshi found that at least some kinds of wagers on the
    prediction market are not swaps and that US law allows regulation of prediction
    markets by both state and federal governments. ["
