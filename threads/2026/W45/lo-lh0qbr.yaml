  content: "Nspawn 3.0: A Docker-compatible Engine API for systemd-nspawn containers
    \n \n\n## Since 2.0.0\n\n2.0.0 gave the machines that mount docker’s socket a
    read-only Docker API, enough for Traefik or Dozzle to find them. 3.0.0 serves
    the API with its changes, on the host too. In between:\n\n- 2.1.0: published ports
    answer over IPv6 too, and `-p` takes IPv6 addresses.\n- 2.2.0: fixes for what
    came up moving a whole server of compose projects to nspawn. compose got anonymous
    volumes, networks made again when their definition changes, `down SERVICE` and
    a `start` that brings up what a service depends on.\n- 2.3.0: every layer is applied
    inside the tree it is extracted into and checked against the digest its image
    names for it.\n- 2.3.1: packages on [apt.nspawn.org](https://apt.nspawn.org) (Debian
    13+, Ubuntu 24.04+) and [rpm.nspawn.org](https://rpm.nspawn.org) (Fedora 44+).\n-
    2.4.0: `-p PORT` takes a free port of the host, and a pull of an image index picks
    the entry for the host’s platform.\n\n## The Docker Engine API on the host\n\nThe
    host’s socket is `/run/nspawn/api.sock`, opened by `nspawn-api.socket`. Its main
    purpose is compatibility: tools that manage containers through the Docker API,
    like GitLab Runner’s docker executor, can use nspawn’s machines instead. `nspawn`
    is still the command line for managing them, but the `docker` command works against
    the socket too.\n\nThe packages ship the socket turned off. Once it listens, `nspawn-api.service`
    starts on the first connection:\n\n  \n\n`\n1\n\n$ sudo systemctl enable --now
    nspawn-api.socket\n\n`\n\nWith `DOCKER_HOST` pointing at it, the `docker` command
    talks to nspawn:\n\n  \n\n`\n1\n2\n3\n4\n5\n6\n\n$ export DOCKER_HOST=unix:///run/nspawn/api.sock\n$
    docker run --rm -it alpine sh\n$ docker run -d --name web -p 8080:80 nginx\n$
    docker exec -it web sh\n$ docker cp web:/etc/nginx/nginx.conf .\n$ docker rm -f
    web\n\n`\n\nThe API server is a client of the bus service, as the command line
    is. Everything it does is a method of `org.nspawn`, under the same polkit actions:
    reads and waits need `org.nspawn.inspect`, logs and changes need `org.nspawn.manage`.
    Every user can connect, but polkit is never asked to prompt, since nothing on
    a socket can answer an authentication agent. Root can do everything, and any other
    user needs a polkit rule, like `nspawn-wheel.rules`, which the packages ship as
    an example. As with the `docker` group, a user with `org.nspawn.manage` is root
    on the host: a machine runs commands as root and can mount any host path.\n\nWhat
    one socket’s clients hold at once (connections, log and event streams, waits,
    attaches, execs) is bounded, and a user other than root gets a share of each,
    so no user can keep the others or root out.\n\nClients that only look at `/run/docker.sock`
    find it with a drop-in, on a host where nothing else has that path:\n\n  \n\n`\n1\n2\n3\n\n$
    sudo mkdir -p /etc/systemd/system/nspawn-api.socket.d\n$ printf '[Socket]\\nSymlinks=/run/docker.sock\\n'
    | sudo tee /etc/systemd/system/nspawn-api.socket.d/symlink.conf\n$ sudo systemctl
    daemon-reload && sudo systemctl restart nspawn-api.socket\n\n`\n\n## What the
    API serves\n\nIt answers in the shapes of API 1.51, and of the versions down to
    1.24 that clients ask for.\n\n- **Containers:** `create`, `start`, `stop`, `restart`,
    `kill`, `pause`, `unpause`, `wait`, `update`, remove and prune, with `AutoRemove`.
    A create’s settings become the machine’s options: what nspawn has no use for comes
    back in `Warnings`, and what would change what the container does is refused with
    400.\n- **attach:** with the input too. The program gets the client’s input, and
    its output comes back byte for byte, which is what `docker run -i`, `docker run
    -it` and `docker start -ai` use.\n- **exec:** with a terminal or with stdout and
    stderr apart, input, variables, working directory and user. A command that is
    not found exits 127, one that can’t run 126.\n- **archive:** `HEAD`, `GET` and
    `PUT` on `/containers/ID/archive`, so `docker cp` works both ways, on running
    and stopped containers, keeping owners and modes.\n- **Images:** pull, with the
    engine’s progress messages and its “Image is up to date” and “Downloaded newer
    image”, remove and prune. An image’s ID is its config’s digest.\n- **Volumes and
    networks:** create, inspect, list, remove and prune, and `connect` and `disconnect`
    with aliases and fixed addresses, running or not. `bridge`, `host` and `none`
    are the predefined networks.\n\n## GitLab Runner\n\nGitLab Runner’s docker executor
    runs its jobs on nspawn’s machines through the API. Its `host` setting points
    at the socket:\n\n  \n\n`\n1\n2\n3\n4\n5\n\n[[runners]]\n  executor = \"docker\"\n
    \ [runners.docker]\n    host = \"unix:///run/nspawn/api.sock\"\n    image = \"alpine:latest\"\n\n`\n\nA
    variable’s value can now hold line breaks (`-e`, compose’s `environment`, the
    API’s `Env`). GitLab’s `CI_COMMIT_MESSAGE` for a commit with a body is one.\n\n##
    Breaking changes\n\n- **A machine’s API socket takes changes.** In 2.0.0 the socket
    inside a machine was read-only. Now a machine that mounts `/var/run/docker.sock`,
    `/run/docker.sock` or `/run/nspawn/api.sock` read-write can create, start, exec
    in and remove containers, pull and remove images, and create volumes and networks.
    With `:ro` the socket reads, follows logs and kills, and refuses everything else
    with 403. Only root inside the machine can connect, and it sees every machine
    and their `-e` variables (`--secret` values never show). A proxy or a dashboard
    that only reads should mount it `:ro`, the Traefik example in the 2.0 post included:
    `/var/run/docker.sock:/var/run/docker.sock:ro`.\n\n- **A record pulled or built
    that never ran is an image, not a container.** The API’s container list, inspect
    and prune leave it out, and `GET /images/json` lists it.\n- **The bus says what
    failed.** A failed method or job carries an error name under `org.nspawn.Error`:
    `NotAuthorized`, `NoSuchMachine`, `NoSuchImage`, `NoSuchNetwork`, `NoSuchVolume`,
    `NoSuchPath`, `Exists`, `InUse`, `NotRunning`, `AlreadyRunning`, `Paused`, `NotPaused`,
    `Invalid`, and `Failed` for the rest.\n\n## Other changes\n\n- **`nspawn info`:**
    the service’s version, its machines by state, images, directories, default backend,
    log driver, registry and the host. `-f json` or `-f TEMPLATE`, and it exits 1
    when the service doesn’t answer. The API’s `GET /info` answers from it.\n- **`nspawn
    images inspect`:** the records of images as JSON or through `-f TEMPLATE`. `nspawn
    image` is now the same group as `nspawn images`.\n- **`-P`/`--publish-all`:**
    publishes every port the image exposes that no `-p` publishes, on a free port
    of the host.\n- **Volumes:** `volume create --label`, `volume ls --filter label=`,
    and `system prune --volumes` removes the unnamed volumes, which only the API creates.\n-
    **`--timezone auto`** , the default, gives a writable root without the host’s
    zone a copy of `/etc/localtime`, which tzdata can replace, instead of systemd-nspawn’s
    read-only bind.\n- **A bare `-e VAR` that isn’t set is left out** instead of refused,
    so `-e DEBUG` passes it on only where it’s set.\n- **No line of a machine’s output
    is lost to journald’s rate limit.** The unit’s `LogRateLimitIntervalSec=0` never
    reached journald, which kept its default of 10000 lines in 30 seconds. The hooks
    drop-in now sets an interval of one microsecond with a burst of a million.\n-
    **A build of a tag replaces the image of that reference** while nothing ran from
    it, mkosi builds too. If a machine or an image of another reference has the name,
    the build goes beside it under a free name (`app-2`) and says so.\n\nThe full
    list is in the [release notes](https://github.com/nspawn/nspawn/blob/3.0.0/docs/releases/3.0.0.md).\n\n##
    Known gaps\n\n- Image builds, loads, imports, tags, pushes and commits, container
    renames and exports, swarm and plugins answer 501 “not supported”. `docker build`
    against the socket doesn’t work, `nspawn build` does.\n- A stopped container’s
    volumes are mounted only while it runs, so copies to or from them are refused
    until it starts.\n- `nspawn run -i` reads the output thro"
