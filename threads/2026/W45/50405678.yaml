  author: analog31
  text: 'Fun anecdote: When I was in college, my dad read an article in the Wall Street
    Journal about Turbo Pascal, so he bought me a copy for my birthday. That was version
    1. I stuck with TP through grad school and a little bit beyond. It seemed like
    there wasn&#x27;t anything it couldn&#x27;t do. Some of my hardware hacking adventures
    even required inline assembly. Some of the version bumps were really timely, such
    as a new compiler that created stand-alone executables. I was extremely lucky
    that the original TP ran on my non-PC-compatible MS-DOS machine, a Sanyo MBC550.<p>My
    graduate advisor had Microsoft FORTRAN, and I tried it out. It was a monstrosity.
    The compiler and linker had to be on separate floppies, and took eons. My advisor
    admitted that he had largely switched to BASIC.'
