  author: Sharlin
  text: The intensifier meaning of &quot;turbo&quot;, connoting something powerful
    and fast, is also interesting. Its original uses are in engineering, simply denoting
    something that has a turbine in it. Thus turbopump, turbojet, and turbocharger,
    the last of which probably being the primary driver of the semantic shift.<p>The
    Latin root of &quot;turbo&quot; and &quot;turbine&quot; is <i>turbo</i>, meaning
    a whirlwind, a spinning top, or more generally any spinning motion as a noun,
    and &quot;agitate, disturb&quot; as a verb. The latter word is, of course, derived
    from <i>turbo</i> as well, as are &quot;perturb&quot;, &quot;turbulence&quot;,
    &quot;turbid&quot;, and even &quot;trouble&quot;!
