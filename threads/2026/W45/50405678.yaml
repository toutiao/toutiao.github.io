  author: ivanmontillam
  text: '&gt; <i>We had to write our code and save them to floppy discs for submission
    since the lab systems had DeepFreeze installed on Win95</i><p>Didn&#x27;t realize
    DeepFreeze is that old. My lab used Angel Custodius[0], which was a hardware-based
    solution. It used a PCI-slot and the buffer was an IC on the PCI board.<p>It worked
    the same, rebooting the computer would restore the frozen state, because changes
    were never committed to disk.<p>It also was OS-agnostic, because it ran before
    booting anything. If you had a Linux server and got hacked, you just restarted
    it, though it remained vulnerable until you disabled the protection and actually
    patched it.<p>If you wanted to introduce changes you had to press a combination
    of keys to bypass it, by introducing the password. Mainly to apply pending Windows
    Updates.<p>--<p>[0]: <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20040210055959&#x2F;http:&#x2F;&#x2F;www.custodius.com&#x2F;"
