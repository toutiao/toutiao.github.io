  author: mike_hearn
  text: For those who don&#x27;t remember, the turbo button existed as a backwards
    compatibility hack. A lot of games in the early days did dumb stuff like implement
    game timing loops by spinning the CPU, because devs just didn&#x27;t think ahead
    to &quot;what if people play my game on hardware that doesn&#x27;t exist yet&quot;.
    So when the first big leaps in clock speed came out, some games ran unplayably
    fast. The fix was a literal button on the front of the machine that controlled
    the clock speed.<p>Devs learned how to use the timer chips pretty fast after that
    though, so for a long time the turbo button existed but appeared to be useless.
    Pushing it would toggle a light but nothing appeared to change.
