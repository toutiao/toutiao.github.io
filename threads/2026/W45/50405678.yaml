  text: "&gt; &quot;That almost nobody has the skills these days to implement something
    like TP is something we could eventually come to regret – or, rather, our grandchildren
    could. Software development is becoming a semi-skilled industry, and I doubt that
    the rise of AI will entirely compensate for this.&quot;<p>I agree, but AI also
    there is hope!<p>For many years I&#x27;ve worried about the ever-growing depth
    of abstraction in computing. There are few alive now who actually understand all
    of the layers on abstraction involved in modern computing, and who can debug the
    truly strange edge case bugs and vulnerabilities introduced by the interoperation
    of these many complex layers.<p>For a time I imagined it to be an unsolvable problem,
    and that there would always be only a special class of neurodivergent hyper-specialists
    who still mostly had to work in large teams to even come close to understanding
    a stack in full. We&#x27;re reaching the point where a single human lifespan just
    isn&#x27;t enough to learn it all, even for those of us with what Dilbert called
    &quot;The Knack&quot;. By the time you&#x27;re proficient in all of it - you&#x27;re
    dead.<p>Now there is a new kind of intelligence. One that CAN fit it all in a
    single mind, and one that will outlive us all and continue to learn long after
    our meat has gone bad.<p>As long as the AI&#x27;s stay aligned, and we find ways
    to build them more efficiently there&#x27;s a non-zero chance that they actually
    make it all better instead of worse. Genuinely long-term planning and the ability
    to TRULY grasp the full stack COULD actually happen. At least if we use these
    new systems in service of the greater good, and not just to play silly games on
    the stock market."
