  author: eesmith
  text: According to Kahn, in this enjoyable read from a year later, at <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;micro-cornucopia-magazine-1984-12&#x2F;page&#x2F;n65&#x2F;mode&#x2F;2up"
    rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;micro-cornucopia-magazine-1984-1...</a>
    .<p>&gt; The ad broke in November, and that month we took in 1100 orders. So the
    ad was paid for. The second month we took in 2500 orders.<p>It&#x27;s a bit tricky
    to figure out the exact breakdown since it requires knowing when people got a
    copy of that issue of Byte, how long it took for their mail order to get to Borland,
    and how many copies were sold per order. Turbo Pascal wasn&#x27;t even released
    until November 20.<p>Still, my eyeballing says 150K in the first month is pretty
    much spot-on.<p>The ad, by the way, cost $9,000, to be read by 400,000 people
    world-wide. Each physical unit cost about $4 to produce. And all the orders were
    filled by hand for the first couple months.<p>FWIW, they also did word-of-mouth
    (like at COMDEX) and used dealers.<p>I tried but failed to find the ad. Archive.org
    is having problems, with very slow response times, failing searches, and failing
    downloads. I think the Byte issue is at <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;byte-magazine-1983-10&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;byte-magazine-1983-10&#x2F;</a>
    . Wow! It&#x27;s 675 pages long, and a topic for that issue is &quot;Unix on Micros&quot;,
    with 9 articles about different aspects of Unix.<p>(I assume it needed all those
    articles to balance out the humongous number of ads, so they could get a lower
    postage rate.)<p>Here&#x27;s Borland&#x27;s ad a year later for TP 2.0 - <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;Computer_Language_Issue_01_1984-09_CL_Publications_US&#x2F;page&#x2F;n1&#x2F;mode&#x2F;2up?q=turbo"
    rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;Computer_Language_Issue_01_1984-...</a>
    and here&#x27;s Dr. Dobbs&#x27; review of 1.01 in their June 1984 publication
    - <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;1984-06-dr-dobbs-journal&#x2F;page&#x2F;74&#x2F;mode&#x2F;2up"
    rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;1984-06-dr-dobbs-journal&#x2F;page&#x2F;74...</a>
    . Oh, and an article about it in Germany in September 1984 at <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;peeker-1984-01&#x2F;page&#x2F;50&#x2F;mode&#x2F;2up?q=turbo"
