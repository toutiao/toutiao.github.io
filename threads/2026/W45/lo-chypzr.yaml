  text: |-
    I have mixed feelings because I really like the XML document model.  It's a tree of nodes where each node has key-value pairs as attributes and zero or more children.  Each child is another node or character data.  This is a really nice generic structure that a huge number of things map to.
    But the text serialisation of this is pretty horrible.  Entities are painful.  The way namespaces let you remap names is nice in theory (if two XML document types have a node with the same name, you can use both and disambiguate them with the namespace prefix), but also quite painful for parsing and it would be simpler to either disallow conflicting names in things that import two namespaces, or require that they have identical structure.
    The text tree that IGK builds is isomorphic to XML (and generates XML on the back end for processing by other steps), but the input is more or less the same as SILE's LaTeX-inspired syntax.  Nodes are defined starting with a backslash then the name, so \foo{} is equivalent to XML's <foo />.  Attributes are specified in square brackets, so \foo[key=value]{} or \foo[key="value"]{} are equivalent to XML's <foo key="value" />.  Children go in the braces, so \foo{\bar{some} text}} is equivalent to <foo><bar>some</bar> text</foo> but is much easier to type.
    It's a shame that the serialisation format and the abstract model were so closely entwined.
    I had the same reaction to XSLT: a declarative language for doing tree-to-tree transforms over this document model?  Wonderful.  That language written as a verbose AST encoded in a verbose markup language?  Awful.
    Some of the XML-based standards just gave up.  SVG throws away XML structure in some places and just has strings that embed something that looks a lot like a PostScript command string (I'm not sure if it actually is PostScript).
    If XML had had a better human-editable text serialisation and a standard well-supported, dense binary serialisation then I suspect things would have been much better.  gzip-compressed XML is fairly dense, but now you have to chain two (complex, stateful) parsers together when a good binary serialisation could have also improved parsing efficiency.
    It's a shame most of the replacements have either a worse abstract model, have a tighter coupling of the abstract model to the serialisation, or both.
