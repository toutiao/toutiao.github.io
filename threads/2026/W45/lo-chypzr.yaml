  author: GrayGnome
  text: |-
    Some users will be very sad in following years when they end with amorphous software, unique programs that nobody else knows and can help with them.

    I think the key here is "nobody else knows and can help them with." Sometimes configuration is easy enough to understand that it's easy or intuitive to modify configuration. Other times it isn't. My observation with very complex configuration is that it often ends up being an ad-hoc limited version of computation (distinct from deliberately limited configuration languages like CUE and Dhall). Eventually the understanding of the edge cases of complex configuration fades to the point where it's more fruitful to simply read the code that ingests the configuration; this is the point where it makes more sense to simply retire the complex configuration.
    A lot of this depends on the intended audience of a program. DWM's configuration works great for an audience of window-manager-interested programmer-adjacent folks. This is a surprisingly (at first glance) large number of window manager users, simply because the folks most attracted to esoteric window managers is often the folks who are already in a programmer-adjacent group. Accounting software may be different which is why I find that even with its bad interface, most non-programmers (and many who program only for a living but not as a hobby) prefer the GNUCash interface over a plain-text accounting format.
    I've written Python programs where configuration happens to be defined in a Python file where I instantiate a singleton of a configuration object. The audience for these programs is always just me so this form of configuration is often fine and easy for me to read even months after I first author the program/configuration.
