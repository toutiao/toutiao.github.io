  author: franta
  text: |-
    CSS covers only the visual part. And you already need properly structured HTML.
    In contrast, XSLT is a general transformation tool that has a tree structure on input and a tree structure or plain text on output. It is cumbersome at first sight but inside it hides elegance that is hard to replicate elsewhere.

    display config files in user-friendly way, add documentation, comments, maybe also some warnings or validations (however strict validations belong rather to XSD schema)
    upgrade/downgrade transformation for config or data files to translate them between versions
    various customizations, this can be done even on-the-fly when request/response is being sent (e.g. SOAP or other document)
    generate summary or reports
    generate or transform DocBook or DITA
    generate or transform LibreOffice documents
    generate EPUB (not only pages, but also metadata, table of contents etc.)
    same for other documentation/help formats

    It can even work with collections of files (multiple inputs, multiple outputs).
    And with tools like alt2xml, relpipe-in-htmltable (mentioned in other comments here), I can apply XSLT templates also on other format than XML.
