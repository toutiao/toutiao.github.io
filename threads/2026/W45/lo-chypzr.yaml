  author: chrismorgan
  text: |-
    Why is CDATASection part of the Document Object Model? Entities aren’t, they get flattened to Text, so it was already not round-trippable. Instead, a lot of things that read XML in low-level ways only support text or only support CDATA in particular places, even though they’re supposed to be entirely equivalent.
    As for attributes… well, that’s probably the messiest area. They’re not really expressively necessary, and being limited to strings is frequently terrible and you invariably end up with microsyntaxes within attribute values, and attribute-or-element discussions abound. S-expressions do just fine without them. But attributes are also firmly what cement SGML/HTML/XML as markup languages. XML was never a great data language, but it got shoehorned a lot.
