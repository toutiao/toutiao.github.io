  text: |-
    XSLT suffered its worst defeat when it became clear that XHTML was not going to be the future of web development.
    The whole elegance of it was based on the idea that it you would use an XML -> XML transformation language, and that XML schema validators could make sure that the source and destination schema were obeyed.
    Well, in my view XML itself is now a living fossil so I don't see much reason to invest in it. We just learned how to make better languages. It sucks that you can't say what the text content of an XML document is until you download a separate schema file. I think now that we have JSON and parse(jsonDocument) people have forgotten that parse(xmlDocument) isn't even correct. It HAS to be parse(xmlDocument, schema).
    So my stance is definitely odd: I'm willing to let the old thing die, but I think we forgot the lessons we should have learned https://xkcd.com/242/
    I've built CSTML to restore the vision of a core symmetry between arbitrary documents and "HTML-schematized" documents. It doesn't let schema validation rules influence parser rules, so you can just parse(cstmlDocument).
    CSTML also supports schema validation through the "parse don't validate" architecture. Schema valiators are parsers, and anything the parser can consume is considered valid according to that schema.
    In theory this could realize the whole vision: users get the ability to have schematized domain-specific documents which are easy for non-technical users to maintain, and then transformations can be written to HTML-schematized CSTML (which looks like this: https://github.com/bablr-lang/bablr-docs/blob/trunk/src/content/docs/guides/cstml.cstml). If a transformation is able to know for sure that its input data follows a known schema, a well-implemented transformation will also be able to guarantee valid output for all possible inputs.
