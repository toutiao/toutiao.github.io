    I really like the XML document model.

    I also like the tree model (XML Infoset). Although XML is not as abstract as ASN.1, does not strictly separate model from serialization, multiple serializations are possible and there are also binary ones (Fast Infoset, EXI…). Years ago I did a prototype alt2xml, which reads various formats and converts them on the fly to stream of SAX events. So you can feed e.g. INI, Java properties or JSON from one side and on the other side it produces stream of events that can be transformed regardless of the source format. So you can e.g. XSLT transform an INI file or query JSON input using XPath or validate .properties against XSD schema. It is not just a command line tool, it could be used as a library and it provides same interface (SAX parser) for various input format. However alt2xml is just a concept and working prototype. Later I did relpipe-in-htmltable that can query HTML tag soup with XPath.

    XSLT: a declarative language for doing tree-to-tree transforms over this document model? Wonderful. That language written as a verbose AST encoded in a verbose markup language? Awful.

    I have mixed feelings about XSLT. I love that template matching and kind of elegance and effectivity. But sometimes you have to fight with its functional nature and immutability – yes, it makes some sense, but doing some tasks in this „pure“ way is bit too cumbersome and you find yourself thinking it would be nice if it were a little more imperative and having a loop and mutable variable would mean much more friendly code than recursion. And of course, the need to write all those language constructs (if, else, for, etc.) as XML elements does not help much. On the other hand, it is homoiconicity, we can have a template that generates templates… However for those who prefer different syntax, there is XQuery. I mixes data with language constructs quite well without need having everything as XML elements.

    Some of the XML-based standards just gave up. SVG throws away XML structure in some places and just has strings that embed something that looks a lot like a PostScript command string (I'm not sure if it actually is PostScript).

    I see this as a failure. In alternative history, it would be all XML, everything in the single tree, no need for additional parser for nested string data… and maybe it would create more pressure to timely deployment of efficient binary XML serialization.
