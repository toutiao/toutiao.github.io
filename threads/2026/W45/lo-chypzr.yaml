    I have mixed feelings because I really like the XML document model. It's a tree of nodes where each node has key-value pairs as attributes and zero or more children. Each child is another node or character data. This is a really nice generic structure that a huge number of things map to.

    Allow me to be pedantic for a second and state that that is not the XML document model. That is a simplification of the core features shared by various XML document models.
    The XML spec does not define a document model, it only describes a parsing method to turn a series of Unicode codepoints into a tree (actually two trees) of DTD entities.
    The thing that most resembles a widely accepted document model for XML is XML Infoset. XML Infoset defines the Document, Element, and Attribute information items that we usually identify in the XML document model. But XML Infoset also defines many other information items that are routinely overlooked (Processing Informations, Unparsed Entities...), for the happiness of people using XML to its full potential across different engines.  It is a little known fact that pretty much all existing XML documents are not serializations of XML as defined by the spec, but of XML Infoset.
    Also fun is the fact that XML Infoset is not the document model of XPath/XSLT 1.0 (they define their own XML document models), nor of XSLT 2.0/3.0 (they use the XQuery Document Model, compatible-with-but-different-from both XML Infoset and PSVI, the Post-Schema-Validation Infoset).

    Some of the XML-based standards just gave up. SVG throws away XML structure in some places and just has strings that embed something that looks a lot like a PostScript command string (I'm not sure if it actually is PostScript).

    SVG started as an XML serialization of PDF. So what you're looking at is, yes, PDF-compiled PostScript.
