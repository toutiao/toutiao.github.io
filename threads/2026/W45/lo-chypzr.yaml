    Support is very important if you're building a critical piece of infrastructure.  It's also worth keeping in mind that just because the browser extension uses the WASM sandbox does not make it immediately free of security issues — there are plenty of security issues that have nothing to do with the sorts of memory unsafety that WASM protects against.
