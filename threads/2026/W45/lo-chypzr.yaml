  text: |-
    I've addressed each of these issues in CSTML. I don't think any other language has as good a claim to be XML's successor as CSTML does.
    It's still a tree of nodes each of which has embedded attributes and 0 or more children. I've just allowed some data to be stored on the relationship itself. This allows relationships to have names, which unlocks the natural ability to store syntax trees as documents. E.g. <Add> left: <Number '2' /> op: '+' right: <Number '2' /></>
    I used JSON for attributes, my reasoning being that if people really want to stuff JSON data in attributes nothing is stopping them. It's (much) easier to parse <Node { attr: true } /> with an interpolating parser because attrs is now one syntax tree node instead of 0 or N individual attribute bindings.
    I kicked out XML's entities and used JSON's system of escaping to ensure parse(cstml) is the API
    I kicked out the idea of "raw text" (e.g. XML CDATA). All content must be properly quoted and escaped. This makes pretty-printing CSTML documents inherently safe. Pretty-printing is not inherently safe on either XML or HTML.
    Bindings replace namespaces. Where in XML the name of the namespace is unimportant except as it maps to a URL, in CSTML the namespace must be referred to by its official name, just as named nodes must use their official name! It's <Namespace.Name> vs :Namespace: <Name>. There's even two more significant reasons :Namespace: is better! One: it's easier to parse with a stream parser, as the syntax is at every moment unambiguous when progressively revealed from left to right (not so for XML). And two: by making clear that :Namespace: isn't part of the identity of the node (and indeed it is not) we make it possible to reuse the DOM node in a different namespace without needing to rebuild it.
    Close tag is just </> because tag soup makes parsing terrible. If open tags always match exactly with close tags, all your parser needs to work correctly is a depth count.
    We have symmetrical SAX and DOM representations: https://gist.github.com/conartist6/8ce77513e70ade4924c23bf31e762023
    By the way I built a userscript to highlight monospace code if it helps anyone: https://gist.github.com/conartist6/d95b1357fbb2b205d06e8ad03e1e466b It sure helps me read what I wrote!
