    Somehow critical infrastructure is very often stuck on out-of-support platforms, and the two (big though) problems they get from being stuck are availability of hardware to run all that and security.
    As for ability to keep running the same code, if there are doubts about viability of WebAssembly polyfill, doesn't that mean that Google intends to break WebAssembly? And if they do intend to break WebAssembly, well, it doesn't make me think better of Google.
    As for security: if it is a webextension that checks for a fixed element then injects the polyfill in a way that the site itself also could do it, then WebAssembly is not just «memory safety», WebAssembly serves to ensure «the site could do this injection as simply initial content». Then the question who you are protecting from whom here. The site is already exposed to the browser's XSLT implementation being buggy, the user is already exposing the browser to the site.
