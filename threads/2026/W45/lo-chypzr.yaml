    There is definitely some point after which the declarative configuration is not helpful. But for everything before this point, the declarative configuration useful is. And even after that point, it could be rather a script or a plug-in (a small isolated piece of imperative code) than whole different software resulting from compilation of different source code. Some users will be very sad in following years when they end with amorphous software, unique programs that nobody else knows and can help with them. One of great parts of software is the economy of scale – you write it once and sell many times (or deploy, you do not have to sell it). This is advantage not only for authors but also for users. You can benefit from bugs reported by someone else or features of documentation paid by others. Customizability is definitely a good thing. But when software packages turn into some amorphous anonymous matter, it is far beyond the limits of practical applicability.
