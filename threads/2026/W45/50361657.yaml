  text: is it, or are we experiencing what the Chinese are referring to as involution?<p>&gt;
    <a href="https:&#x2F;&#x2F;www.reuters.com&#x2F;business&#x2F;autos-transportation&#x2F;what-is-involution-chinas-race-to-the-bottom-competition-trend-2025-09-14&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.reuters.com&#x2F;business&#x2F;autos-transportation&#x2F;what-i...</a><p>&gt;
    The Chinese term for involution, &quot;neijuan&quot;, began trending online in
    2020 and was initially used by young people to describe the hypercompetitive and
    often self-defeating pursuit of traditional markers of success. Some of the contexts
    they used it in included questioning what was the point of working hard to get
    into a good school if the reward was working 996 hours (9 a.m. to 9 p.m., six
    days per week) in a tech company? If you were lucky enough to land a job, that
    is, in an era of high graduate unemployment.<p>&gt; Though the term is far less
    commonly used in English, involution comes from a latin term which means &quot;to
    roll or turn inwards&quot;. It was popularised by American cultural anthropologist
    Clifford Geertz in the 1960s - in relation to his studies of Javanese agriculture
    - to describe economic or cultural stagnation despite increasing complexity or
    effort.<p>&gt; More recently, neijuan has become shorthand in China for the exhausting
    but also often futile and sometimes self-destructive grind of hyper-competition
    more broadly.The concept is now also linked to the country’s pivot from property-driven
    growth to an industrial complex encompassing a third of global manufacturing,
    which has seen more recources invested without any accompanying increase in returns.
    It&#x27;s a race to the bottom.
