  author: pigpop
  text: "&quot;If you try to please everyone, you&#x27;ll end up pleasing no one&quot;<p>This
    isn&#x27;t to say that games (and other media) should always be laser focused
    on one type of person but you do have to use good judgement to decide who your
    audience is, what they like and what you should leave out of the game. MMOs show
    some natural segregation of players when they have private servers, you end up
    with many PvP only or PvE only servers along with many other variations of things
    the game mechanics and mods allow e.g. strict role play servers.<p>There&#x27;s
    even terminology directly related to your quote, casual gamers vs hardcore gamers
    and it should be well known by now that if you make compromises in your game to
    suit both you&#x27;ll end up being disliked by both. It&#x27;s better to lean
    in to one play style a measured amount. If you&#x27;re making a game with PvP
    as a core mechanic make sure the PvP experience is good but not so hardcore that
    it alienates people who are new to PvP. Don&#x27;t sacrifice important parts of
    the gameplay because you might also want to attract PvE only players."
