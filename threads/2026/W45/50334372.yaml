    I also was on the pointy end of the hiring process once I got in - it was impossible
    for anyone who had not completed a game to get past the resume screening process
    - only new grads and they still had to have done projects for school and on their
    own. If you have not done any work on your own games or mods at this point you
    have no chance of getting hired by a game developer at least from my experience
    a few decades ago.<p>If you have any games on PC there is a huge community making
