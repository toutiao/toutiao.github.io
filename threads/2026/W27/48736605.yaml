  author: gertlabs
  text: In our coding evaluations, we found Sonnet 5 is more capable than Sonnet 4.6
    (which was an underrated model itself), but is now faster and slightly cheaper.Sonnet
    5's performance is comparable to GLM 5.2 in both one-shot coding and agentic ability.
    However, it's about ~20% less verbose than GLM 5.2 in average code submission
    sizes, and uses fewer reasoning tokens, which reduces the cost gap and suggests
    it writes cleaner code. In practice, Sonnet 5 ends up being 40% more expensive
    and ~2x faster than GLM 5.2 in our evaluations (not 300% more expensive as the
    per-token pricing would suggest). Granted, GLM 5.2 is an extremely reasoning heavy
    model.Overall, it's a solid release that gives Anthropic some standing in the
    price-conscious inference market.Data at https://gertlabs.com/rankings
