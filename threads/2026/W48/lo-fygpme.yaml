    # [Release: Roto v0.14.0!](/t/release-roto-v0-14-0/3511)

    [Roto](/c/roto/7)

    [Terts](https://community.nlnetlabs.nl/u/Terts)1

    Roto version 0.14.0 is now available on [crates.io](https://crates.io/crates/roto/0.14.0)! This is mostly a bugfix release and most users should be able to upgrade without any problems. The only breaking change is around `List::contains` and `List::index` when they are used from Rust.

    For this release, I’d like to thank sha90w and [@algernon](/u/algernon) in particular for both reporting and fixing many issues!

    As always you can find the release in the following places:

    - [crates.io](https://crates.io/crates/roto/0.14.0)
    - [Codeberg](https://codeberg.org/NLnetLabs/roto/releases/tag/v0.14.0)

    You can find the full list of changes below!

    ### Language

    #### Added

    - Added the `List.clear` and `List.remove` methods. ([#500](https://codeberg.org/NLnetLabs/roto/pulls/500))

    #### Bug fixes

    - Report an error instead of crashing when trying to assign to a constant. Thanks, @sha90wsha90w! ([#477](https://codeberg.org/NLnetLabs/roto/pulls/477))
    - The lexer now properly handles multi-byte characters in all places. Th@sha90wnks, @sha90w! ([#482](https://codeberg.org/NLnetLabs/roto/pulls/482))
    - Fix parsing of `char` and `String` literals at the end of input. This issue did not affect Roto in its current state, but enables [future wo](https://codeberg.org/NLnetLabs/roto/pulls/486)@sha90w[k](https://codeberg.org/NLnetLabs/roto/pulls/486). Thanks, @sha90w! ([#488](https://codeberg.org/NLnetLabs/roto/pulls/488))
    - Fix the module name of the `pkg.roto` file of a dependency, which interfered with the `pkg.roto` of the main package. ([#485](https://codeberg.org/NLnetLabs/roto/pulls/485))
    - Fix panics in cases where an error needs to display a hint in another file than where the error @sha90wccurred. Thanks, @sha90w! ([#505](https://codeberg.org/NLnetLabs/roto/pulls/505))
    - Ensure that labels generated by the conversion to MIR are always unique in a function. This didn’t lead to any known problems, but is generally good practice. ([#507](https://codeberg.org/NLnetLabs/roto/pulls/507))

    ### Crate

    #### Breaking Changes

    - Fix soundness issue and incorrect behaviour of `List::contains` and `List::index`. These functions took their arguments by reference, but implementing the correct behaviour required that they take it by value. ([#501](https://codeberg.org/NLnetLabs/roto/pulls/501))

    #### Added

    - Added `Blob::get_functions_by_signature` to get all the functions in a `Blob` that match a given signature. Thanks, [@algernon](/u/algernon)! ([#494](https://codeberg.org/NLnetLabs/roto/pulls/494))
    - Make `FunctionRetrievalError` and `TypeMismatch` public. Thanks, [@algernon](/u/algernon)! ([#503](https://codeberg.org/NLnetLabs/roto/pulls/503))

    #### Bug fixes

    - Fix `DynVal` being used in combination with `vtables` in the `library!` macro. Thanks, @sha90w! ([#488](https://codeberg.org/NLnetLabs/roto/pulls/488))
    - Filter out generated functions from the hints generated by `Blob::get_function`. Thanks, [@algernon](/u/algernon)! ([#496](https://codeberg.org/NLnetLabs/roto/pulls/496))
    - Fix extracting tests from a `Blob` with tests in a dependency. ([#499](https://codeberg.org/NLnetLabs/roto/pulls/499))
    - Fix a panic when displaying symbols that are not in a package, such as registered items. This panic was also triggered when such a symbol was used in the signature of an extracted function. ([#497](https://codeberg.org/NLnetLabs/roto/pulls/497))

    ### Documentation

    - The manual has a new look and has been improved in a few places. ([#480](https://codeberg.org/NLnetLabs/roto/pulls/480))
