  text: |-
    I was looking at serialisable runtimes while shopping for a Rust-based scripting language for a game engine I'm working on, and quite a few of the candidates failed. IIRC, Roto also doesn't have a serialisable runtime state.
    The reason is simple: The in-game world has hundreds of live scripts running various story events, and there is no point during which there are no active events. If a player wants to save the game, I cannot really stop them. All of the Lua interpreters I came across had this problem, for example.
    In the end, I implementing a custom runtime with a parser library.
    I'm wondering, was I correct in my understanding that Roto doesn't have a serialisable runtime state, or is it simply not advertised?
  score: 2
  posted_at: '2026-11-24T12:53:43Z'
- id: lo-esixys
  parent_id: '0'
  author: terts
  text: That is indeed correct. You can share Rust types to Roto so there's also no
    way to provide this really. Of course, you could work around this by ensuring
    that all the scripts only manipulate some state object that you serialize, but
    I understand that this would be cumbersome and error prone.
