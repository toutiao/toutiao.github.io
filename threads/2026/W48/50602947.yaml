  text: Where do you get the notion that capitalism is an optimization engine? The
    purpose of &quot;capitalism&quot; (a vaguely defined phrase, but I&#x27;ll assume
    you&#x27;re using it to refer to a set of governmental policies that enable private
    ownership of enterprise and the capture of profit by said owners) is primarily
    to align incentives in society. It functions with the belief that humans are inherently
    driven by selfish goals and desires. Left alone in a vacuum, humans orient themselves
    towards activities which increase their own resources, standing, influence, and
    power.<p>The purpose of capitalism is simply to take that natural orientation
    and align it with society&#x27;s broader goals. This maximizes the odds that those
    who succeed at increasing their own resources will, as a natural byproduct, create
    resources for others as well. This has been a massive success so far (see <a href="https:&#x2F;&#x2F;ourworldindata.org&#x2F;grapher&#x2F;world-population-in-extreme-poverty-absolute"
