    stocks are portions of control of the company and it’s assets - but there are
    a lot of scams out there, including Meta.<p>Large companies in general have also
    been hoarding funds for a long time rather than investing, in large part due to
    Quantitative Easing, which has really screwed up a lot of typical investment dynamics.<p>When
    you see headlines like ‘company X raised $50bln at a $250bln valuation’ - that
    company just issued new stock in exchange for money. In theory (but rarely in
    practice), 25% voting control for 50bln in cash.
