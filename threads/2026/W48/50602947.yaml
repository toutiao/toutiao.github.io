  author: pessimizer
  text: No, markets (and property itself) are constructed by imposition of rules on
    trade by an overarching authority. They do not grow from the ground.<p>Nature
    only recognizes possession, not property. No agreements can be made to trade (or
    even to hold) without a disinterested authority to enforce them.<p>The disinterested
    authority is one that is rewarded by the overall healthy functioning of that particular
    market, often by taking a cut of every transaction. The rules of that market are
    whatever rules that authority chooses to enforce, which will be optimized for
    the benefit of the authority.<p>So the order is wrong. First a market is created,
    then voluntary trades are made under its authority. Previous to the market, people
    hold what they&#x27;re willing to fight to have (or keep), and anything that resembles
    a &quot;voluntary trade&quot; is accidental.<p>For example, someone might be willing
    to leave something behind in order to grab something else, and they might find
    a counterparty who will leave the thing to be grabbed and take the thing left
    behind; but that doesn&#x27;t make a market. If one is far more powerful than
    the other, they don&#x27;t have to consider leaving anything behind in order to
    take what they want. <i>Everything is already theirs,</i> and the other has to
    settle for discards. Not coincidentally, this resembles capitalism in practice.
  score: 0
