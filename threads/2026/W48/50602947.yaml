  author: awesome_dude
  text: 'Citing Public Choice theory - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Public_choice#Validity_and_efficacy"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Public_choice#Validity_and_eff...</a><p>&gt;
    Steven Pressman offers a critique of the public choice approach, arguing that
    public choice fails to explain political behavior in a number of central areas,
    including politicians’ behavior and voting behavior.[14] In the case of politicians&#x27;
    behavior, the public choice assumption that a politician&#x27;s utility function
    is driven by greater political and economic power cannot account for various political
    phenomena.[19] These include why politicians vote against their constituents&#x27;
    interests, why they advocate for higher taxation, fewer benefits, and smaller
    government, and why wealthy people seek office.[19]<p>&gt; usually becomes counterproductive
    thereafter,<p>There&#x27;s no doubt that a balance needs to be found between three
    forces, the consumer, the producer, and the regulator, but it&#x27;s pure fallacy
    to claim that regulation in and of itself &quot;becomes counterproductive&quot;<p>This
    is the hard truth:<p>1. a market where the producer holds too much power - monopolies,
    duopolies, etc, consumers are unable to get a &quot;fair&quot; deal<p>2. a market
    where the consumer holds too much power - producers are unable to survive, or
    are exploited<p>3. a market where the regulator holds too much power - stagflation,
    little incentive for the producer to seek improvements, little choice for the
    consumer<p>NONE of those are automatic, ALL can be fixed by adjusting the level
    of regulation in the nominated market, adjusting the balance toward one side or
    the other<p>edit: I think, also, that it&#x27;s clear that the reason regulation
    is introduced in the first place is that the nominated market is &#x2F;already&#x2F;
    broken'
