  text: Good points!<p>Stocks are easy to hold with low carrying costs, unlike, say,
    real estate which requires constant maintenance, and pretty liquid. which is why
    they are nice to hoard.<p>Higher prices do provide money to the company, as they
    can issue more stock at that price, and existing investors (who own the company)
    now have more wealth without the company having to transfer anything to them directly.<p>It’s
    very common for companies to issue more stock to fund large projects. In fact,
    it’s the literal reason common stock companies exist. It’s the closest thing non-government
    entities have to a money printer.<p>[<a href="https:&#x2F;&#x2F;www.investopedia.com&#x2F;ask&#x2F;answers&#x2F;08&#x2F;first-company-issue-stock-dutch-east-india.asp"
