  author: Animats
  text: "<i>Attempts at governance are futile until we recognize that we have built
    a machine and set it on its course. Instead, we pretend that the market is a natural
    phenomenon best left alone, and we fail to hold its mechanism designers to account.
    We need to tear down and rebuild that machine, reprogramming it so that human
    flourishing, not corporate profit, becomes its goal.</i><p>This article has useful
    insights. It points out that capitalism is an optimization engine for something.
    Shareholder value and CEO compensation, mostly. It reminds us of something that
    many people would prefer be forgotten - capitalism operates under rules set by
    governments, and those shape the market. Tax law matters - what&#x27;s deductible
    warps spending patterns. Bankruptcy law matters - who gets left holding the bag?
    Corporation law matters - how immune are executives from the consequences of their
    decisions? Labor law matters - do people go to jail for wage and hour law violations?<p>All
    of those are changeable by legislation. Most have become much more favorable to
    companies since 1970. That&#x27;s not necessarily permanent. We had a New Deal
    in the 1930s, following the Gilded Age of the 1920s and the crash of 1929."
