  author: delis-thumbs-7e
  text: "&gt; a blogger should just write however he feels like<p>On principle I agree,
    with one caveat: you still should communicate to your audience, even if it is
    that of one. If you just write to organise ypur thoughts never intending for anyone,
    yourself included, to read them afterwards, fine, but perhaps in that case a physical
    journal would be a better option anyway? I write a blog to in which I scribe intentionally
    boring things, simply because I know I will forget at least some of them in due
    time. I doubt another basic tutorial on SQL is any value to anyone. It is to myself,
    however, since it is written by me in my words. instead of looking up bunch of
    commands I use so rarely I will forget them anyway, I might as well write myself
    a tutorial on how to use them in the future.<p>However, if I just list them haphazardly
    like in a private notebook, it will be filled with typos, errors and otherwise
    difficult to read. If I write it pretending I am writing on New York Times, my
    future self will thank me, since he will actually easily understand what the hell
    I was trying to say.<p>So even if you write just to yourself, you should write
    to an audience who does not have the knowledge and experiences you have. Even
    if the audience is yourself, but months or years removed, he will likely have
    forgotten all of that and value you have written them down plainly and clearly."
