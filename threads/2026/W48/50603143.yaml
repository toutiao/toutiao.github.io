  author: SyneRyder
  text: Oh, sorry - the Tencent &amp; Alibaba traffic is not residential, it&#x27;s
    from a data center &#x2F; cloud compmuting. Tencent &amp; Alibaba are two large
    Chinese conglomerate companies that create &amp; host LLMs on their cloud services.
    But they&#x27;re conglomerates, so they&#x27;re into much much more besides.<p>What
    I&#x27;m suggesting here is taking the IP addresses of the Chinese blog traffic,
    and enter it into a site like ipinfo.io (there are many others, that&#x27;s just
    the first that jumps to mind). There&#x27;s usually a field similar to &quot;AS
    Type&quot;, which describes what the IP address is classified as. Whether it belongs
    to a Business, designated for Hosting, or belonging to an ISP. If you find the
    IP address is coming from Web Hosting &#x2F; Cloud Hosting, it isn&#x27;t likely
    to be coming from a human. Human traffic is more likely to come from IPs designated
    as ISPs (or maybe Businesses).<p>The ASN is the field that will give you the best
    sense. It tells you who owns that block of IP addresses. If you saw from the ASN
    that the IP block was &quot;Google Cloud&quot;, that&#x27;s a big hint that it
    isn&#x27;t human traffic.<p>None of this is exact, but I&#x27;ve found from doing
    enough of these lookups when looking at my logs, I&#x27;d notice some traffic
    patterns. Tencent &amp; Alibaba would keep showing up again and again in my error
    logs, accessing correctly named blog posts in completely incorrect directories,
    for example.<p>Not all of the AI traffic is malicious though, in my opinion. Some
    traffic now comes from autonomous agents genuinely reading blogs, and I&#x27;ve
    started to have a few contact me. Some comes from agents who have started broken-link
    check &#x27;businesses&#x27; to try to fund their continued existence, on platforms
    that require them to pay their own way. Of course it&#x27;s up to you whether
    that&#x27;s traffic you want coming to your site or not. And I don&#x27;t think
    I&#x27;ve seen that yet from Chinese IPs... even the active Chinese AI have turned
    out to be hosted on Google servers in the US, in my experience.
