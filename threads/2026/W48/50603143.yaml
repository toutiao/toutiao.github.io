  author: klodolph
  text: I think bloggers should mostly write how they feel like. Yes, there’s an audience,
    or a potential audience, but you calculate how much you want to optimize for the
    audience and how much to optimize for other qualities.<p>Maybe you are optimizing
    for the enjoyment of blogging. Maybe you are optimizing for getting your thoughts
    down in fixed form, because you think there you have something important to say.
    Maybe you are optimizing for blogging as a habit. It takes time to edit blog posts
    down and make them brief, and if you have <i>other shit to do</i>, the posts could
    be longer.<p>Next, you don&#x27;t know whether a blog post will be popular &#x2F;
    reposted &#x2F; recirculated. It happens after you write it. By then, it is too
    late to decide whether you want to write it carefully.<p>Rather than assume people
    are not interested in my blog posts, I just believe that I don’t know which blog
    posts of mine people want to read, and then I’m happy when one gets higher readership.
  score: 0
