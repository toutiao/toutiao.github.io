  author: uptrails
  text: 'Meh. I think this is <i>very</i> good advice when writing in corporate settings.
    Get to the point, be concise, connect with what the reader actually cares about
    because they don&#x27;t have the time or the inclination to geek out about your
    thing.<p>For blogging, not so much. Find your niche, sure, but that niche can
    be pretty eclectic. The internet is so vast that you might very well be able to
    connect with 100 or 1,000 or 10,000 people who like unusual topics or writing
    styles. It&#x27;s actually harder if you&#x27;re just trying to do something very
    mainstream because there&#x27;s already a million blogs written in a corporate
    style.<p>The main sin of blogging is something else: writing blog posts like they&#x27;re
    chapters of a book when many readers are first-time visitors or no longer remember
    your previous article. If people need to re-read the previous post to even understand
    what the current one is about, and then that previous post in turn references
    an even earlier one, you&#x27;re gonna lose a lot of readers.<p>On the flip side,
    in 2026, I&#x27;m not going to tell any budding blogger to just write for themselves,
    because that&#x27;s just doing free labor for OpenAI. So yeah, make some effort
    to understand who your audience is or could be.'
  score: 0
