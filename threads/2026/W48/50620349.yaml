  text: With a mail server it actually might be a problem for some companies.<p>AGPL
    means that (on top of GPL terms) companies must provide modifications to anyone
    using the software over the network.<p>Now typically companies are exempt from
    having to distribute source changes to GPL or AGPL software, if they&#x27;re using
    it internally.<p>But because it&#x27;s a mailserver that can presumably send or
    receive mail to external users, if a company ever modified the Stalwart source,
    they&#x27;d presumably have to find a way to distribute that to every person that
    sends an email to or receives an email from a Stalwart mailserver.<p>I have no
    idea how this would be done though, and I&#x27;m pretty sure it&#x27;s completely
    untested so far. Both whether inter-mailserver communication counts as use that
    would trigger the AGPL &quot;access over a network&quot; clause, and what method
    of notifying the mailservers (and perhaps users) it communicates with would satisfy
    the &quot;making the source available&quot; requirement.
