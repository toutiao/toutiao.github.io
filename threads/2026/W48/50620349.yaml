  author: k_g_b_
  text: |-
    I feel like Stalwart is trying to do a kind of reverse embrace - extend - extinguish here. Embrace being this support for the old Exchange protocols and support for the admins and organizations that have that running and need something secure and updated on the server. Exchange remains a protocol dead end, though.
    Extend being JMAP - exactly the future of the open email ecosystem you mention. Stalwart so far has been a champion of that as far as I can tell and has not done a disservice here.
    Extinguish is happening through MS themselves and the default OS clients over time removing support. It remains to be seen whether they&#x27;ll add JMAP - but that&#x27;s not really that hard given it&#x27;s a quite modern, seemingly sane protocol and if desired, AI.
