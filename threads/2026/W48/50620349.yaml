article:
  url: https://stalw.art/blog/microsoft-exchange-replacement/
  title: Stalwart is now a drop-in replacement for Microsoft Exchange | Stalwart
  fetch_status: success
  content: "# Stalwart is now a drop-in replacement for Microsoft Exchange\n \n \n
    \n \n \n\n \n  - 13 min read \n \n [![Mauro D.](/img/authors/mdecimus.png)\n \nMauro
    D.\n \nProject Maintainer\n \n ](https://github.com/mdecimus) \n\nFor more than
    twenty years, “the mail server” in most companies meant Microsoft Exchange, and
    “the mail client” meant Outlook. Today we are releasing Stalwart 1.2.0, and with
    it **Stalwart becomes a drop-in replacement for Microsoft Exchange**.\n\nStalwart
    now implements the protocols that Exchange clients speak: MAPI over HTTP, Exchange
    Web Services (EWS), Exchange ActiveSync and Autodiscover. Outlook, Apple Mail
    and the mail apps on phones and tablets connect to Stalwart as they would to an
    Exchange server, with mail, calendars, contacts, tasks and notes in one account.
    Users type their email address and password, Autodiscover does the rest, and they
    keep working in the client they already know.\n\nExchange support is part of the
    open source Community edition, under the AGPL.\n\n## Exchange on premises in 2026\n[Section
    titled “Exchange on premises in 2026”](#exchange-on-premises-in-2026)\n\nBefore
    going into what Stalwart now does, it is worth looking at where self-hosted Exchange
    stands today, because it explains why so many organisations are looking for a
    way out.\n\nMicrosoft has not announced the end of Exchange Server. On paper,
    on-premises Exchange still exists. In practice, every road Microsoft is building
    leads to Exchange Online:\n\n- **Exchange 2016 and 2019 are out of support.**
    Both [reached end of support](https://learn.microsoft.com/en-us/exchange/plan-and-deploy/supportability-matrix)
    on 14 October 2025. Microsoft sold a paid Extended Security Update programme for
    a while, and according to [press reports](https://www.bleepingcomputer.com/news/microsoft/microsoft-exchange-2016-and-2019-esu-program-ends-in-october/amp/)
    of an Exchange team statement, it ended in October 2026 with no further extension.
    Servers still running those versions receive no fixes of any kind.\n- **No new
    features.** [Exchange Server Subscription Edition](https://learn.microsoft.com/en-us/lifecycle/products/exchange-server-subscription-edition)
    (SE) is now the only supported on-premises Exchange, and there will be [no more
    major versions](https://techcommunity.microsoft.com/blog/exchange/top-3-myths-about-exchange-server-subscription-edition/4483187)
    after it. SE does not receive the features developed for the cloud. Even its first
    cumulative update has slipped from late 2025 to [an undetermined date](https://windowsforum.com/news/exchange-server-se-cu1-has-no-release-date-yet-megathread.442861/)
    in 2026.\n- **The new Outlook does not support it.** Microsoft’s own [documentation
    for the new Outlook for Windows](https://learn.microsoft.com/en-us/microsoft-365-apps/outlook/get-started/supported-account-types)
    says it plainly: “On-premises Exchange accounts aren’t supported.”\n- **The APIs
    are moving to the cloud.** New functionality ships only on Microsoft Graph, a
    cloud API. Exchange Web Services in Exchange Online [started being switched off](https://learn.microsoft.com/en-us/exchange/clients-and-mobile-in-exchange-online/deprecation-of-ews-exchange-online)
    in October 2026 and will be gone entirely in April 2027.\n\nNone of these steps
    forces anyone to move on its own. Together, they leave an Exchange administrator
    with a shrinking set of choices: keep running a server that will not grow, or
    move the organisation’s mail into Microsoft’s cloud.\n\nFor many organisations
    the second option is not acceptable. Email is the record of a company’s contracts,
    negotiations, legal advice, HR matters and customer data. Placing it with a US
    provider means placing it within reach of US law, including the CLOUD Act, which
    allows US authorities to compel American providers to hand over data they control
    wherever it is stored. Public administrations, healthcare providers, law firms,
    defence contractors and many European companies cannot accept that, or no longer
    want to. Data sovereignty means that you decide where your data lives, under which
    jurisdiction, and who can read it. A mail service in someone else’s cloud cannot
    offer that, and an on-premises server whose vendor is steering its customers toward
    that cloud offers less of it every year.\n\n## Outlook without Exchange\n[Section
    titled “Outlook without Exchange”](#outlook-without-exchange)\n\nThe obstacle
    to leaving Exchange has rarely been the server. It has been the client.\n\nMany
    people have spent their whole working life in Outlook. They have years of muscle
    memory in it: their folder layout, their rules, their calendar views, their shared
    mailboxes, the way they book meeting rooms. Many organisations also have workflows
    built around it, such as delegated calendars managed by an assistant. Replacing
    Exchange with a standard IMAP and CalDAV server has always meant telling every
    one of those users to switch to a different mail client, or to reconfigure Outlook
    into a reduced IMAP mode where calendars and contacts no longer sync. For a migration
    project, that is often where the plan dies.\n\nWith Stalwart 1.2.0 the users do
    not need to change anything. The administrator moves the mailboxes and points
