    Size\n\nAbcSmall\n\nAbcMedium\n\nAbcLarge\n\nSave\n\n[Print](https://economictimes.indiatimes.com/nri/work/ibm-gives-h-1b-green-card-holders-3-weeks-to-relocate-from-us-or-leave-company-december-31-deadline-set/printarticle/136180168.cms)\n\n###
    Synopsis\n\nIBM has informed employees with H-1B visas and green cards about the
    need to relocate within three weeks or depart. Employees who choose not to relocate
    will receive three months' severance pay, with December 31, 2026, as their last
    working day. The company's consulting division will no longer sponsor visas and
    green cards for most positions. India is likely to be the primary destination
    for relocation opportunities.\n\n ![AI Briefing logo](https://img.etimg.com/photo/124905307.cms)\n\nListen
    to this article in summarized format\n\n![Image for IBM gives H-1B, green card
    holders 3 weeks to relocate from US or leave company; December 31 deadline set](https://img.etimg.com/thumb/width-650,height-488,imgsize-176456,resizemode-75,msid-136180306/nri/work/ibm-gives-h-1b-green-card-holders-3-weeks-to-relocate-from-us-or-leave-company-december-31-deadline-set.jpg)iStock\n_IBM
    has informed employees with H-1B visas and green cards about the need to relocate
    within three weeks or depart_\n\n[IBM](https://economictimes.indiatimes.com/topic/ibm)
    has given some of its US-based employees holding H-1B visas and green cards three
    weeks to decide whether to relocate to another country or leave the company, as
    the technology giant ends immigration sponsorship for most positions in its consulting
    division.  \n  \nThe move could affect foreign professionals who depend on employer
    sponsorship to maintain their US immigration status and pursue permanent residency.
    IBM has not disclosed the number of employees who will be affected.  \n  \n**Also
    Read:** [US H-1B visa curbs could hurt American workers in non-STEM jobs, study
    finds](https://economictimes.indiatimes.com/nri/work/us-h-1b-visa-curbs-could-hurt-american-workers-in-non-stem-jobs-study-finds/articleshow/136122848.cms)\n\n
    \ \n  \n\n## Employees have three weeks to decide\nAccording to a report by Rest
    of World, employees have been given three weeks to decide whether to accept positions
    outside the US or leave the company. Those who decline overseas roles will be
    offered three months' severance.  \n  \nSome employees were informed of the decision
    during one-on-one meetings with their managers, which were described as career
    discussions.  \n  \n**Also Read:** [H-1B visas in focus: IBM to end green card
    sponsorship for roles in biggest unit](https://economictimes.indiatimes.com/nri/work/ibm-to-end-immigration-sponsorship-for-roles-in-biggest-unit/articleshow/135715236.cms)
    \ \n  \nEmployees choosing to leave rather than relocate have been given December
    31, 2026, as their last working day. The decision applies to [IBM Consulting](https://economictimes.indiatimes.com/topic/ibm-consulting),
    the company's largest division, which employs more than 150,000 people globally.
    \ \n  \n\n## IBM ends visa sponsorship for most consulting roles\nIBM announced
    earlier this month that it would discontinue US visa and [green card sponsorship](https://economictimes.indiatimes.com/topic/green-card-sponsorship)
    for the majority of positions in its consulting division. The decision was first
    reported by Bloomberg on November 10, citing an internal company document.  \n
    \ \nAn IBM spokesperson confirmed the development, saying the company's participation
    in high-skilled visa programmes had been declining for several years.  \n  \n\"IBM
    Consulting participates in US high-skilled visa programs to address skill shortages,\"
    the spokesperson said in a statement.  \n  \n\"That participation has been declining
    for a number of years, and as skill availability and client need have evolved,
    we have opted to discontinue visa and green card sponsorship for the majority
    of such roles in IBM Consulting,\" the spokesperson added.  \n  \nThe change is
    limited to most positions in IBM Consulting and does not mean IBM is ending visa
    and green card sponsorship across all its business units.  \n  \n\n## India accounts
    for most overseas job openings\nIndia could be the main destination for employees
    choosing to relocate. According to Rest of World, IBM's careers portal listed
    1,278 consulting vacancies outside the US on November 19. Of these, 1,125 were
    in India, 23 in Singapore and 18 in the UK.  \n  \nThe company also listed 89
    openings in the US.  \n  \nIBM Consulting employs more than 150,000 people worldwide.
    However, the company has not disclosed the geographical distribution of its workforce,
    making it difficult to estimate how many US-based employees could be affected.
    \ \n  \nThe overseas vacancies could provide employees an option to continue working
    for IBM without remaining in the US. However, the company has not disclosed how
    many affected employees will be offered transfers or the terms of those positions.\n\n
