  text: Having a temporary worker visa that can be extended for years is a large part
    of the problem. If &quot;temporary&quot; workers can stay longer than median employee
    tenure, employers are obviously going to use it for hiring permanent workers.
    And if the employee lives in one place for years, that place becomes their permanent
    residency for all practical purposes.<p>If you want to keep H-1B a genuine temporary
    worker program, limit its duration to 2 years. And then make the visa holder return
    to their home country for another 2 years (as with some J-1 visas) before they
    can apply for another temporary worker visa or permanent residency. Then the H-1B
    will no longer be used for hiring what are for all intents and purposes permanent
    workers.<p>Tax law is often more honest than immigration law, because governments
    have greater incentives to adjust it to match the situation on the ground. According
    to tax law, people on visas like H-1B, O-1, and L-1 become residents after six
    months. Those on J-1 can remain nonresidents for years, because unlike the other
    visa types, the J-1 is a genuine temporary worker visa.
