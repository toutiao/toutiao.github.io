  author: rayiner
  text: People who think “dual intent” means H1B can be for temporary or permanent
    immigration are the ones who don’t understand the law. H1B refers to a provision
    of 8 USC 1101 that literally defines H1B immigrants in terms of the fact that
    they are <i>not</i> “immigrants” and are “coming temporarily to the United States
    to perform services.”<p>Previously, if a nonimmigrant applied for permanent residency,
    the government was required to presume the person had immigrant intent, which
    destroyed their eligibility for the temporary worker visa. “Dual intent” just
    means the government is no longer legally required to apply that presumption (though
    it is still legally allowed to do so). The 1990 law was worded to give the H1B
    visa holder no rights or expectation to a permanent residency pathway—it just
    allowed the government to look the other way if it chose to do so.<p>The H1B program
    is stacked against the foreign worker to an extreme degree. It requires a worker
    shortage to exist both at the time the visa is first granted, when it is renewed,
    and even at the time of a green card application. It gives zero weight to the
    interest of the foreign worker, how long they have been in the country, etc.
  score: 0
