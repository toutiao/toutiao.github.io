  author: rayiner
  text: 'My position is that the law should be enforced as written. Punctiliousness
    about written law the foundational virtue of American society. Here, the law is
    clear: H1B is a non-immigrant temporary worker visa status that requires certifying
    that there are no qualified americans who can do the job. That certification is
    required on issuance of the visa, renewal of the visa, and again upon sponsorship
    for permanent residency. That was the compromise baked into the law: corporations
    wanted workers to address supposed shortages, but people wouldn’t accept a new
    flow of permanent residents. Nothing is being “applied retroactively.” The statute
    has been clear for 36 years. Nobody who is here on H1B should have thought it
    was anything other than a temporary status that could be revoked at any time.<p>In
    2026, with layoffs all over and AI about to automate a large swath of the industry,
    no company can say with honesty that there is a shortage of American workers to
    do the job. IBM is simply following what the law requires, as it should do.'
