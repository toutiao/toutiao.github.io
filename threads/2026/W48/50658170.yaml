    US or leave company; December 31 deadline set\n\nET Online\n\n[![Google Preference
    in ET](https://img.etimg.com/photo/124385886.cms)](https://www.google.com/preferences/source?q=economictimes
    \"Google Preference in ET\")\n\n[![Whatsapp Follow Channel](https://img.etimg.com/photo/104857408.cms)Follow
