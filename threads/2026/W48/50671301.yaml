  author: roryirvine
  text: Not specific to Facebook, but that disparity in legal firepower is absolutely
    the norm when signing these sort of agreements.<p>In the UK case, it&#x27;s usual
    to require the (soon to be ex-)employee to seek independent legal advice as this
    will make it harder to question later in court. The agreement will contain an
    offer to refund the cost of this up to a (low) limit - this is calculated on what
    I suspect is the basis of 1 hour of the time of the cheapest paralegal in the
    cheapest location in the country, but will in practice cover less than that.<p>What
    this results in is that a paralegal will spent a few minutes skim reading the
    proposed agreement and, if they don&#x27;t spot anything particularly egregious,
    they&#x27;ll have a brief conversation with you along the lines of &quot;it looks
    fairly standard, have you read it yourself and do you have any questions or concerns?&quot;.
    Once you&#x27;ve confirmed that you&#x27;ve read it and have no concerns, they&#x27;ll
    pass it to a qualified solicitor who&#x27;ll put their signature on the agreement.
    And that&#x27;s it.<p>If they <i>do</i> spot anything unusual or you are concerned
    by anything in it, then you find yourself on the &quot;first hour of advice is
    free, pay £££ for anything beyond that&quot; track, and it&#x27;s up to you to
    decide whether that&#x27;s worth paying your own money for or not. For someone
    facing unemployment, the answer to that is inevitably going to tend towards &quot;probably
    not&quot;.<p>The UK does have laws which makes the most abusive NDAs unenforceable
    - but, as GP says, the likes of Facebook will put a <i>lot</i> of time and effort
    into making theirs as intimidating as possible whilst not being <i>quite</i> bad
    enough to be thrown out by a judge.
