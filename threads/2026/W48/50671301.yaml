  author: KaiserPro
  text: 'One of the things that may not be apparent from outside facebook is how the
    contracts work.<p>Virtually everyone is on the same employment contract. The only
    thing that really changes is the name, wages and in some cases country specific
    addendums.<p>The same goes for when you are fired. Everyone is given an NDA to
    sign when they yeet you. It offers you a choice:<p>1) sign it and Here is a large
    amount of cash (usually somewhere between 3 and 12 months wage) some health insurance,
    and a pathetic job search subscription.<p>2) don&#x27;t sign it and get nothing<p>You
    then are allocated 30 minutes with a lawyer, who tells you the choice is yours:
    take the money and sign the NDA, and never tell anyone of its existence.<p>Or
    leave with nothing.<p>The NDA is wonderfully comprehensive and tailored to each
    state&#x2F;country. In the UK it lists something like 500 specific laws you agree
    to not reference if you try and challenge. In the US it references standard NDA
    exceptions.<p>What stays the same is this: you are never allowed to talk about
    facebook again in any situation where you opinion is either broadcast, recorded
    or written down. You may ask for permission first, but there is no expectation
    of facebook agreeing. They also want to be able to edit what is said.<p>If you
    break that condition, then they will take you to court for all yeeting cash, plus
    damages and legal fees. In return they promise not to bad mouth you. However the
    maximum that they are willing to &quot;indemnify&quot; is $25. (or it might be
    $250) So when Wynn-Williams was smeared by facebook during the first legal fight,
    the most they are liable is $250. It also appears to not break the NDA, which
    is also interesting as its a clause that both facebook and the Yeetee agree to
    uphold.<p>Which is fun because facebook is all about connecting people.'
