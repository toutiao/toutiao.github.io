    # ‘I am scared’: Careless People author Sarah Wynn-Williams on living under a gag order - and why it’s time to speak out against big tech

    Since writing her bestselling exposé, the former employee has been forbidden from speaking publicly about Meta. In an exclusive extract from her Orwell lecture, she talks about corporate lawfare, and the growing backlash against NDAs

    George Orwell understood that what is missing often tells you more than what is there. In Nineteen Eighty-Four, there is a slot in the wall&nbsp;covered by a wire grate. They call it the memory hole. When a document becomes inconvenient to the authorities – a photograph that contradicts the official line, a newspaper that remembers the wrong promise, a name that is no longer supposed to exist – you simply feed it into the slot, whereupon it is whirled away on a&nbsp;current of warm air to enormous hidden furnaces where it burns.

    The Party doesn’t argue with the past. It removes it. Controlling the past is one of its central tools of power: “Who controls the past controls the future: who controls the present controls the past.”

    Control what people are allowed to&nbsp;remember or what they are allowed to&nbsp;know, and you control what they are able to imagine. Control what they can imagine, and you have already chosen their future for them.

    Knowledge matters. People need to&nbsp;know what actually happened. But in 2026 the language of tech has taken on a quality of manifest destiny: the men in charge have determined how it should be, as though there could be no other way, even though none of us voted for any of it.

    Control of the prevailing narrative is held tacitly: the only time this authority is given voice is when it acts, decisively, to silence an alternative account. Control over narrative is becoming the real power battle in technology. The aim is not to win the argument. The aim is to leave nothing to argue with. An absence. No record. No receipt. No contestable standard of truth. No common ground of fact against which anyone could measure those in power and expose their failures. Without memory or evidence, dissent has nothing to stand on. That is why memory matters. Why evidence matters. Why books matter.

    You don’t need a Ministry of Truth&nbsp;to make a memory hole. An&nbsp;employment contract will do. An&nbsp;NDA will do. A court order will do. A legal bill – large enough, frightening enough, open-ended enough – will do very nicely. The modern memory hole does not smell of smoke. It smells of printer toner, fresh paper and billable hours.

    In libel, truth is a defence. Under an NDA, truth is the offence.

    The agreement is signed at the moment of maximum vulnerability, still reeling from an “incident” while the mortgage looms and the cardboard box of family photos sits in the front seat of the car. It is signed by the gig worker, the intern, the content moderator, the production assistant, the junior publicist, the stylist. There really is no better way to knock the whistle from someone’s lips. In a justice system based broadly on the principle that sunlight is the best disinfectant, NDAs grip the elbow of truth and stay it. This is a private form of censorship, enforced by private arbitration and the public courts.

    Anyone targeted by an institution with a formidable legal department is,&nbsp;by definition, very vulnerable. It is one person against a building full of lawyers who seek only to protect the interests of the company, truth be damned. Some businesses are more powerful than states.

    They have mastered corporate lawfare, letting slip the dogs of law on individuals who don’t have millions of&nbsp;pounds to defend themselves against these attacks brought on by trying to defy the memory hole. The word “brave” gets bandied around if you speak out despite all this. But “brave” should be for haircuts, not for&nbsp;telling the truth.

    You do not have to silence everyone. You could never afford to. You only have to silence one person loudly enough that everyone else does the maths for themselves. These contracts seek to mute the truth, and they carry a big stick. The result is a society that&nbsp;has censored itself far more thoroughly than any Ministry of Truth ever could. No furnace required. Just fear, doing its patient and persistent work in the dark.

    Recently, in the realm of entertainment, some big names have faced accountability or at least the prospect of it, because of women speaking out. Russell Brand was convicted, and David Walliams faces allegations. (Walliams has denied any&nbsp;wrongdoing in response to the allegations that he preyed on young women for sex.) In both cases, there are reports of NDAs being deployed to silence women. To ensure information that was clearly in the public interest was suppressed.

    And while we should celebrate the courage and fortitude of the women who spoke out at unimaginable cost,&nbsp;and the media organisations, including the&nbsp;Guardian, whose investigations were instrumental in ensuring this information became public, I can’t help but notice that this accountability occurred at a time when the professional standing of these figures was already significantly&nbsp;diminished.

    For a long time now it has felt as if certain sectors of society, including technology companies, act with impunity. I worry about all the powerful people who continue to benefit from silence and deprive us, the public, of information that can lead to warnings and ideally accountability. I worry we&nbsp;will only be allowed the truth about these companies when it no longer&nbsp;matters.

    Whoever you are, whatever you believe, with an ever-more powerful elite there will come a day when you need to say something the powerful would rather you didn’t. And on that day, you will want three things: a place to say it that they do not own, a law that will not let them constrict you in&nbsp;grinding legal processes before bankrupting you for saying it, and people who will remember that you said it. The protections you are willing to fight for are the only ones that will be&nbsp;there when you need them.

    Silencing the person who speaks is only half the job. The other half is making sure no one is paying attention. There is a detail in Nineteen Eighty-Four I used to skim past. Julia works in the Fiction Department of the Ministry of Truth. She services the novel-writing machines. These mass-produce literature as a commodity without any human creativity or critical thought. They use the same six stories, recombined endlessly to churn out formulaic slop for the proles.

    The purpose of the novel-writing machines is to keep the proles distracted, passive and incurious. And it works. The proles never notice. The fiction machine has much in common with the feed: an endless scroll engineered by the brightest minds of a&nbsp;generation to keep your attention indefinitely. Nineteen Eighty-Four also gave us the Two Minutes Hate. A daily ritual of collective rage aimed at an enemy of the state. We have improved on it. Ours is continuous. Personalised. Delivered by push notification. And now with AI we have, literally, machines that write and humans that&nbsp;service them.

    Orwell imagined the novel-writing machine as satire. We have built it. It was trained on the work of writers who were never asked. And sold back to them on a subscription. The Fiction Department of Nineteen Eighty-Four is now an industry. And it is the fastest growing one on earth. The memory hole removes what is true, and the fiction machine fills the space.

    So much for what the machines do. The harder question is who owns them, and Orwell had a view on that too, though he was writing about a different technology. In October 1945, weeks after the atomic bomb was dropped, Orwell wrote a short essay exploring the deep connection between wea
