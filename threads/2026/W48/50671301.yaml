    that they don&#x27;t even think they&#x27;re doing anything wrong), but much more
    is &quot;We cannot allow people to see that X is happening on the platform, so
    we&#x27;ll cover up X&quot; to a ridiculous, gaslighting degree.<p>The one that&#x27;s
    simple and verifiable - They ran A&#x2F;B testing on people using positive and
    negative newsfeed posts to manipulate their mood and behavior[1]. Internally,
    one of the metrics on this experiment was the suicide rate. They found a measurably
    higher suicide rate, something like a half a percent of the people whom they had
    in the most &quot;negative mood&quot; cohort commit suicide - Way way above background
    noise. When this made headlines, it was an example of &quot;How the press is biased
    against us&quot; and they launched a suicide prevention initiative whose press
    coverage was directly designed to drown out the original stories.<p>[1] <a href="https:&#x2F;&#x2F;theconversation.com&#x2F;should-facebook-have-experimented-on-689-000-users-and-tried-to-make-them-sad-28485"
