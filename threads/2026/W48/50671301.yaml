  author: SideQuark
  text: Background:<p>Sarah Wynn-Williams worked at law firm 2002-2005, joined the
    New Zealand diplomatic service as a policy adviser 2007-2011, managing government
    relations at it&#x27;s embassy in DC.<p>She joined Meta in 2011, was in 2017,
    signed a standard severance agreement with a non-disparagement clause and an arbitration
    provision, and received $780,000 severance. She did not have to sign it, but signed
    it to get the money. It&#x27;s a legal contract. She&#x27;s been a high powered
    lawyer and well enough connected it&#x27;s not at all likely she knew what she
    was signing. Especially since after being in her position for 6 years at Meta
    she likely oversaw many similar such events from the Meta side.<p>In 2024, she
    filed a SEC complaint. In 2025 she publishes her book, Meta secures an emergency
    ruling from an American Arbitration Association arbitrator invoking her signed
    severance contract, she testifies to Congress. In 2026 she sued Meta Meta in federal
    court in the Northern District of California to vacate the arbitration, and U.S.
    District Judge Araceli Martínez-Olguín denies Wynn-Williams’s request to halt
    the arbitration.<p>To head off more conjectures, the American Arbitration Association
    is well respected, and has massive experience representing both sides of such
    things. The Judge, a female, has been a long time fighter for social justice,
    was nominated by Biden, also very well respected. Given that the two seemingly
    best respected arbiters of these types of claims, who have both certainly seen
    both sides complaints, and given Sarah is a well connected, legally savvy person,
    I find it hard to believe the story is as one sided bad behavior as she claims.
  score: 0
