  author: abixb
  text: "&gt;Presented in our ICML 2025 paper, this architectural improvement allows
    models to achieve the same quality up to three times faster with a negligible
    increase in parameters.<p>&gt;Rather than passing all prior layers forward with
    equal weight, DCA introduces a lightweight, layer-wise module that decides how
    to best combine previous embeddings on a per-token basis.<p>This combined with
    looped transformers (as showcased with GLM-5.4 from... <i>4 days ago</i>) could
    lead to even more efficiency squeezes without substantially increasing the parameter
    size or altering data blend. It&#x27;s hard to fathom how merely 3-4 years ago,
    many in the industry (despite the Chinchilla paper) thought scaling up the parameter
    count was the largest leverage wrt bettering model performance as compared to
    other techniques, but we&#x27;ve had such explosion of techniques since then --
    CoT, MoE, RLVR, GQA, Multi-Head Latent Attention (MLA), DeepSeek Sparse Attention
    (DSA) and whatnot."
