  author: crote
  text: 'If anything, I&#x27;d say embedded flash is being replaced by off-package
    flash and co-packaged flash.<p>Yes, placing embedded flash on the same die as
    logic is indeed becoming more and more of a problem. But replacing that with magnetic
    memory on the same die as logic doesn&#x27;t <i>really</i> solve the problem either:
    you are still wasting a significant area of expensive die space on some weird
    foreign process!<p>Our storage demands aren&#x27;t exactly slowing down. Giving
    MCUs several megabytes of flash is already fairly standard, and there&#x27;s zero
    doubt in my mind that it will grow to several <i>hundreds</i> of megabytes in
    the not-too-distant future. Memory scales incredibly poorly, so the only sensible
    approach is to <i>put it on a different die</i>.<p>We are already seeing this
    hitting mainstream budget MCUs. See for example the RP235x: by default all you
    are getting is a logic die, but you can attach an external flash chip via QSPI.
    Alternatively you can go for the RP2354, which comes with a 2MB flash chip die
    integrated into the package itself, attached to the same pins you would use for
    an external one. And that&#x27;s a $1.10 chip - if fancy packaging can be done
    at <i>that</i> price point, why even bother looking into MRAM?'
