  author: jhallenworld
  text: 'An issue with these non-volatile memories is that power loss during a write
    leaves the memory cell in some kind of unknown state.  So this means your last
    transaction may return a different result after every read.  After restart you
    should do something like rewrite the last valid transaction to preserve it, or
    something similar.  Anyway bottom line is that they are not all that simple to
    use.<p>The way this was solved with core memory on the PDP-11 was that there was
    a power loss warning signal (on the UNIBUS!) used to prevent any attempted reads
    (which were destructive) or writes during a impending power outage.<p>In modern
    servers there is a similar thing: I think you get 6 ms of warning from off the
    shelf power supplies.  This could be enough time for nvDIMMs to work: flush the
    hopefully not too large cache and then put DIMMs into self-refresh (where it is
    then safe to bus switch them to an FPGA).  Then supercaps provides enough energy
    to copy the RAM to flash after the power goes out.'
