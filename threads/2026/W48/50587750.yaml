  content: "- [Home](/)\n- [Technical Articles](https://www.allaboutcircuits.com/technical-articles/)\n-
    MRAM Basics: How Magnetic Memory Is Replacing Embedded Flash\n\n# MRAM Basics:
    How Magnetic Memory Is Replacing Embedded Flash \n\nLearn about magnetoresistive
    random-access memory technology and what changes it brings for embedded products,
    including firmware updates and data logging.\n\n* * *\n\n Technical Article November
    21, 2026 by&nbsp;[Dale Wilson](/author/dale-wilson)\n\n* * *\n\nMost embedded
    engineers know the limits of flash memory well. Writes are slow, and every write
    needs an erase first. Each cell survives only 10,000 to 100,000 write/erase cycles.\n\nMagnetoresistive
    random-access memory (MRAM) removes most of these limits. It stores data as a
    magnetic state, not as trapped electrical charge. Microcontrollers built on 22
    nm and 16 nm processes now use it, because embedded flash isn’t practical at those
    nodes.\n\nThis article explains how MRAM works, why flash stopped scaling, and
    what changes for firmware.\n\n&nbsp;\n\n### The Bit Is a Magnet, Not a Charge\n\nA
    flash cell stores a bit as electrons trapped on a floating gate or in a charge-trap
    layer. An MRAM cell stores it in a magnetic tunnel junction (MTJ). This is a stack
    of two ferromagnetic layers, usually a cobalt-iron-boron alloy (CoFeB), separated
    by a magnesium oxide (MgO) barrier about 1 nm thick.\n\nAs illustrated in Figure
    1, one magnetic layer, the reference layer, has its magnetization fixed during
    manufacturing. The other is the free layer. Its magnetization can point in the
    same direction as the reference layer or the opposite direction. These two states
    are called parallel and antiparallel. This is a nonvolatile memory because both
    states are stable without power.\n\n&nbsp;\n\n![](https://www.allaboutcircuits.com/uploads/articles/MRAM_Basics_1.jpg)\n\n&nbsp;\n\n#####
    **_Figure 1._** _A basic implementation of a magnetic tunnel junction (MTJ) bit
    cell. Image used courtesy of [Lam Research](https://newsroom.lamresearch.com/Tech-Brief-ABCs-of-New-Memory)._\n\n&nbsp;\n\nReading
    relies on tunnel magnetoresistance (TMR). The barrier is thin enough for electrons
    to tunnel through, and they tunnel more easily when the two layers are parallel.
    The antiparallel orientation is typically two to three times higher resistance
    than the parallel orientation.\n\nA sense amplifier compares the cell current
    against a reference and returns a 1 or a 0. That gap is small, which is why MRAM
    designs typically run error-correcting code (ECC) on every read.\n\nMost embedded
    MRAM uses spin-transfer torque (STT) for the write operations. The write circuit
    drives a large current through the junction, and the electrons become spin-polarized
    as they pass through a magnetic layer. They carry that angular momentum into the
    free layer and set the magnetization direction. Reverse the current and the bit
    flips back. The bit cell is one access transistor and one MTJ, as shown in Figure
    2.\n\n&nbsp;\n\n![Figure 2. An MRAM cell consists of a magnetic tunnel junction
    (MTJ)\nbit cell in series with an NMOS transistor.](https://www.allaboutcircuits.com/uploads/articles/MRAM_Basics_2.jpeg)\n\n#####
    **_Figure 2._** _An MRAM cell consists of a magnetic tunnel junction (MTJ) bit
    cell in series with an NMOS transistor._\n\n&nbsp;\n\n### Flash Hits a 10 V Wall
    at 28 nm\n\nEmbedded flash scaling didn't stall because the transistors became
    too small. It stalled due to voltage. The oxide for the flash memory must be roughly
    8 nm to 10 nm thick, or the stored charge leaks away. Pushing electrons through
    oxide that thick takes about 10 V, but a 22 nm logic process runs its core below
    1 V. Creating the 10 V on chip requires charge pumps and special high-voltage
    transistors, and neither shrinks with the rest of the logic.\n\nManufacturing
    makes it worse. Integrating a flash cell into a CMOS logic process adds 9 to 18
    extra masks at 28 nm, according to [figures reported by Semiconductor Engineering](https://semiengineering.com/embedded-flash-scaling-limits).
    The flash cell also does not integrate well with FinFET transistors. As a result,
    embedded flash is widely available down to 28 nm but rare below it.\n\nMRAM avoids
    these problems:\n\n1. The MTJ sits between metal layers, above the transistors
    (Figure 3).\n2. MRAM works with planar, FD-SOI, and FinFET CMOS processes.\n3.
    MRAM needs only [about three extra masks](https://www.synopsys.com/articles/emram-low-power-advanced-nodes.html).\n4.
    The MRAM write voltage is close to normal logic levels.\n\n&nbsp;\n\n![Figure
    3. The MTJ bit cell integrates easily with the NMOS word line\ntransistor. Image
    used courtesy of Lam Research.](https://www.allaboutcircuits.com/uploads/articles/MRAM_Basics_3.jpeg)\n\n#####
    **_Figure 3._** _The MTJ bit cell integrates easily with the NMOS word line transistor.
    Image used courtesy of [Lam Research](https://newsroom.lamresearch.com/Tech-Brief-ABCs-of-New-Memory)._\n\n&nbsp;\n\nFoundries
    now offer embedded MRAM at 28 nm, 22 nm, and 16 nm. For example, Renesas builds
    its [RA8P1 microcontrollers](https://www.allaboutcircuits.com/news/renesas-new-cortex-m-mcus-break-1-ghz-ceiling-ai-acceleration/)
