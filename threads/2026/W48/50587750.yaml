  text: This article not withstanding, there’s some real meat to the topic. At least
    for automotive-qualified safety parts, we really did hit a wall at 45 nm with
    NOR flash — no one offers smaller geometry flash, and so automotive micros have
    been stuck there for an unusually long time.<p>As a result, for this generation
    we’re seeing a much-larger-than-normal step from 45 nm straight to 22 nm planar
    or even 18 nm FinFET, which is a huge step in available compute — but only TI
    is trying to do it with conventional flash, and they’re doing it at a new fab.
    Other vendors are using either MRAM (the subject of the article) or TSMC’s PCM
    — both of which are different enough from flash in behavior and performance to
    require significant software redesign (though mostly in exciting ways, enabling
    new capabilities).<p>This really is a big deal.
