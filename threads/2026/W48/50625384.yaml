  text: I think there is a competency crisis here, but it&#x27;s more in a general
    lack of understanding of what judges do and don&#x27;t.<p>Judges apply the law,
    and in civil proceedings, usually based on the facts brought forth by the parties.
    That means that an argument that neither side has made is never considered.<p>In
    this case, where do y&#x27;all think is the mistake the court has made here? I
    assume most people here are too unfamiliar with French law to conclude that they
    applied the law itself incorrectly.<p>And from a technical side, as I understand
    it, the plaintiffs asked the court to order Quad9 to stop resolving certain domains
    within the court&#x27;s jurisdiction. And I guess that happened and I don&#x27;t
    see any gross incompetence here. It won&#x27;t solve the whole issue of privacy
    – but it would be an undue burden on any plaintiff to ask only for measures that
    solve a whole category of problems.<p>In the end, I assume that the court correctly
    applied French law, and that the law simply states that anyone involved in copyright
    infringement, even in an incidental and unintended way, can be asked to cease
    that involvement. I don&#x27;t see any issue in the judgement or the technical
    understanding, even if I hate the outcome.
