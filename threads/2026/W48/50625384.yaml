    This is where you lost the plot. Quad9, as a resolver, is answering the question &quot;what IP is registered at this domain&quot;.<p>The concept of making that answer illegal is somewhat absurd, and this isn&#x27;t just a <i>&quot;geeks don&#x27;t interact with reality&quot;</i> principled stand. Principals are often grounded in &quot;what fundamentally works&quot;, as in this case: trying to keep secret that &quot;popularSite&quot; is equivalent to some particular number, is not a solveable problem. You can attack large companies that answer this question, but every attempt since &quot;the internet&quot; to keep these kinds of &quot;open secrets we can&#x27;t acknowledge&quot; has failed spectacularly.<p>If the site is illegal, block the illegal part: its registration, or its hosting. Don&#x27;t try to block others talking about the real fact that it is hosted, at a particular IP, and that its domain is in fact publicly registered, with certain easily found addresses.<p>You might as well note that drugs are illegal, drug dealers are breaking the law, and so we must criminalize the act of ever acknowledging that drug dealing is rampant on the corner of first and main.<p>It&#x27;s not simply that this isn&#x27;t technically right; it <i>can&#x27;t work</i>, and it punishes everyone in a futile attempt to solve a problem in the wrong way.
