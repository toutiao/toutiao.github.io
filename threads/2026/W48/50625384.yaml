  author: iagiagiag
  text: "&gt; Quad9 has the technical ability to stop answering “what IP is registered
    at this domain” for domains that are engaged in illegal activity.<p>It doesn&#x27;t
    work like that. Quad9 provides a service for the whole world without discrimination.
    An &quot;illegal activity&quot; in a country might not be illegal in another country.
    Accepting legal requests for some countries means they could be required to accept
    them for all laws for all countries of the world, and potentially apply that to
    all users. You could think all companies must obey the law, but DNS can&#x27;t
    see where users are located, they can only have a very approximate location (which
    is what they&#x27;re using now to block &quot;users in France&quot;).<p>It&#x27;s
    not just &quot;philosophical reasons&quot;. Quad9 interprets the intent of beIn
    as &quot;we want to stop piracy of our content&quot;. Quad9 says that attempting
    to block that content for France with a DNS would not help the goal of beIn, while
    causing too much risks for Quad9. That&#x27;s a valid technical reason. It&#x27;s
    a civil lawsuit, it must evaluate the pros and cons for both businesses. They
    lost but imo the case was misjudged. Quad9 blocking or exiting France will change
    nothing for piracy of beIn content in France, the content can still be accessed,
    the servers are still there, the ISPs still accept to redirect to the content
    (not their DNS but their routers will transfer the packets). It has no pros, and
    they explained the cons.<p>Everything they said is technically correct, you can&#x27;t
    know the location of someone from an IP, and if they accepted the request they
    would be required to block more and more things for the whole world with risks
    for all users. If you compare this kind of blocking method with other methods
    (which I&#x27;m not going to detail), the judges validated a very ineffective
    and damaging blocking method.<p>Now the consequences for french users, if they
    trusted quad9 more than all other providers, is that they must tell which websites
    they visit to another company. This has potential massive consequences for their
    privacy and safety. Imagine if the list of all the websites you visit leaked,
    maybe you wouldn&#x27;t appreciate that."
