article:
  url: https://gpu-demo-gallery.pages.dev/
  title: GPU demos, 1998 to 2006
  fetch_status: success
  content: |-
    ![](img/borg.jpg)

    ## Borg

    1998 · 3dfx, Voodoo2

    A cube with nine textures in five passes, as the first card with two texture units drew it.

    [Play](https://borg-port.pages.dev/)[GitHub ↗](https://github.com/arkits/borg)

     ![](img/donut.jpg)

    ## Donut

    1998 · 3dfx, Voodoo2

    A torus with embossed bumps and a reflection, in two passes.

    [Play](https://donut-port.pages.dev/)[GitHub ↗](https://github.com/arkits/donut)

     ![](img/bubble.jpg)

    ## Bubble

    1999 · NVIDIA, GeForce 256

    A bubble of springs that mirrors its surroundings. Poke it.

    [Play](https://bubble-port.pages.dev/)[GitHub ↗](https://github.com/arkits/bubble)

     ![](img/lightning.jpg)

    ## Lightning

    2000 · NVIDIA, GeForce 256

    Hold the steel plate to strike it: the bolt lights bumps, heats the metal and throws sparks.

    [Play](https://lightning-port.pages.dev/)[GitHub ↗](https://github.com/arkits/lightning)

     ![](img/grove.jpg)

    ## Grove

    2000 · NVIDIA, GeForce 256

    Trees grown from a few numbers, lit by fireflies.

    [Play](https://grove-port.pages.dev/)[GitHub ↗](https://github.com/arkits/grove)

     ![](img/principles-of-shading.jpg)

    ## Principles of Shading

    2000 · NVIDIA, GeForce2

