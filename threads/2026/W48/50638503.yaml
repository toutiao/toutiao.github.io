  text: The rotation for &quot;Demoroom&quot;, &quot;ATB-TV&quot; and &quot;Flip&quot;
    in response to mouse drag feels backwards to me (dragging left rotates the model
    to the right), unlike &quot;Donut&quot; and &quot;Borg&quot;.<p>I think it has
    to do with how the first few demos rotate the camera in response to mouse drag[1],
    whereas the latter demos rotate the models themselves[2].  I think it would be
    more intuitive if yaw is set to negative of X drag, but maybe it&#x27;s just me.<p>[1]
