  text: It was (over?)used quite a bit when the techniques were first invented(remember
    the clamor around hardware T&amp;L), The game that comes to mind was escape from
    butcher bay. Not badly, the game still looks like a million bucks(if you can get
    it to run) But wow did it have a lot of really obvious bumpmapping.<p>Bumpmapping(normal
    mapping) is still used in nearly every game but now that it is old tech, the devs
    don&#x27;t feel the need to punch you in the face with it anymore and it fills
    it purpose unnoticed.
