  content: "![](img/borg.jpg)\n\n## Borg\n\n1998 · 3dfx, Voodoo2\n\nA cube with nine
    textures in five passes, as the first card with two texture units drew it.\n\n[Play](https://borg-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/borg)\n\n ![](img/donut.jpg)\n\n## Donut\n\n1998
    · 3dfx, Voodoo2\n\nA torus with embossed bumps and a reflection, in two passes.\n\n[Play](https://donut-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/donut)\n\n ![](img/bubble.jpg)\n\n## Bubble\n\n1999
    · NVIDIA, GeForce 256\n\nA bubble of springs that mirrors its surroundings. Poke
    it.\n\n[Play](https://bubble-port.pages.dev/)[GitHub ↗](https://github.com/arkits/bubble)\n\n
    ![](img/lightning.jpg)\n\n## Lightning\n\n2000 · NVIDIA, GeForce 256\n\nHold the
    steel plate to strike it: the bolt lights bumps, heats the metal and throws sparks.\n\n[Play](https://lightning-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/lightning)\n\n ![](img/grove.jpg)\n\n## Grove\n\n2000
    · NVIDIA, GeForce 256\n\nTrees grown from a few numbers, lit by fireflies.\n\n[Play](https://grove-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/grove)\n\n ![](img/principles-of-shading.jpg)\n\n##
    Principles of Shading\n\n2000 · NVIDIA, GeForce2\n\nA logo taken apart and shaded
    again in six steps, from points to bump maps and reflections.\n\n[Play](https://principles-of-shading-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/principles-of-shading)\n\n ![](img/creature.jpg)\n\n##
    Creature\n\n2000 · NVIDIA, GeForce2\n\nA sea monster under caustic light, 500
    fish that avoid it, and a laser.\n\n[Play](https://creature-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/creature)\n\n ![](img/grass.jpg)\n\n## Grass\n\n2000
    · NVIDIA, GeForce 256\n\nA meadow without an end: ten thousand blades bend in
    the wind and shine like hair.\n\n[Play](https://grass-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/grass)\n\n ![](img/pond.jpg)\n\n## Small Pond\n\n2000
    · NVIDIA, GeForce2\n\nRipples in a wooden pool mirror photographs of a whole day
    around it. Click the water.\n\n[Play](https://pond-port.pages.dev/)[GitHub ↗](https://github.com/arkits/pond)\n\n
    ![](img/toy-soldier.jpg)\n\n## Toy Soldier\n\n2000 · NVIDIA, GeForce2\n\nA tabletop
    regiment marches in formation until a wind-up robot scatters the soldiers.\n\n[Play](https://toy-soldier-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/toy-soldier)\n\n ![](img/crystal-ball.jpg)\n\n##
    Crystal Ball\n\n2000 · NVIDIA, GeForce 256\n\nA refracting globe with two castles
    to explore.\n\n[Play](https://crystal-ball-port.pages.dev/)[GitHub ↗](https://github.com/arkits/crystal-ball)\n\n
    ![](img/chameleon.jpg)\n\n## Chameleon\n\n2001 · NVIDIA, GeForce3\n\nAn animated
    chameleon climbs through vines and changes its skin.\n\n[Play](https://chameleon-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/chameleon)\n\n ![](img/zoltar.jpg)\n\n## Zoltar\n\n2001
    · NVIDIA, GeForce3\n\nA fortune teller speaks using the original animated face
    and voice recordings.\n\n[Play](https://zoltar-port.pages.dev/)[GitHub ↗](https://github.com/arkits/zoltar)\n\n
    ![](img/bugs.jpg)\n\n## Bugs\n\n2002 · NVIDIA, GeForce4 Ti\n\nSixty alien insects
    swarm across a junkyard. Toggle Depth Vision to see overdraw.\n\n[Play](https://bugs-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/bugs)\n\n ![](img/wolfman.jpg)\n\n## Wolfman\n\n2002
    · NVIDIA, GeForce4 Ti\n\nA werewolf with eight layers of fur. Switch animation
    and change the number of layers.\n\n[Play](https://wolfman-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/wolfman)\n\n ![](img/squid.jpg)\n\n## Squid\n\n2002
    · NVIDIA, GeForce4 Ti\n\nPilot a mechanical squid among kelp, fish, bubbles and
    silt.\n\n[Play](https://squid-port.pages.dev/)[GitHub ↗](https://github.com/arkits/squid)\n\n
    ![](img/tidepool.jpg)\n\n## Tidepool\n\n2002 · NVIDIA, GeForce4 Ti\n\nLight and
    reflections ripple across a rocky pool.\n\n[Play](https://tidepool-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/tidepool)\n\n ![](img/car-paint.jpg)\n\n## Car Paint\n\n2002
    · ATI, Radeon 9700\n\nTwo-tone paint with metal flakes and clear coat, and how
    it is built up layer by layer.\n\n[Play](https://car-paint-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/car-paint)\n\n ![](img/npr-hatching.jpg)\n\n## NPR
    Hatching\n\n2002 · ATI, Radeon 9700\n\nA still life in pencil: hatching by tone,
    ink outlines, shadows in strokes.\n\n[Play](https://npr-hatching-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/npr-hatching)\n\n ![](img/natural-light.jpg)\n\n##
    Natural Light\n\n2002 · ATI, Radeon 9700\n\nPaul Debevec’s balls of glass and
    gold, lit by a forest in high dynamic range.\n\n[Play](https://natural-light-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/natural-light)\n\n ![](img/bear.jpg)\n\n## Bear\n\n2002
    · ATI, Radeon 9700\n\nFur of shells and fins, lit along each hair, and a roar.\n\n[Play](https://bear-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/bear)\n\n ![](img/dawn.jpg)\n\n## Dawn\n\n2002 ·
    NVIDIA, GeForce FX\n\nA fairy dances on a branch. Change her expression, or watch
    her rest in the sun.\n\n[Play](https://dawn-port.pages.dev/)[GitHub ↗](https://github.com/arkits/dawn)\n\n
    ![](img/pipe-dream.jpg)\n\n## Pipe Dream\n\n2003 · ATI, Radeon 9700\n\nAnimusic's
    machine plays itself: every note is a ball that has to land on time.\n\n[Play](https://pipedream-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/pipedream)\n\n ![](img/double-cross.jpg)\n\n## Double
    Cross\n\n2004 · ATI, Radeon X800\n\nRuby's first mission showcases layered hair,
    reflections, and cinematic depth of field.\n\n[Play](https://double-cross-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/double-cross)\n\n ![](img/dangerous-curves.jpg)\n\n##
    Dangerous Curves\n\n2005 · ATI, Radeon X850\n\nA motorcycle chase through tunnels
    with motion blur and global illumination comparison modes.\n\n[Play](https://dangerous-curves-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/dangerous-curves)\n\n ![](img/the-assassin.jpg)\n\n##
    The Assassin\n\n2005 · ATI, Radeon X1800\n\nA high-rise confrontation with shadow
    maps, glowing plasma, and a ten-bit frame buffer.\n\n[Play](https://the-assassin-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/the-assassin)\n\n ![](img/box-of-smoke.jpg)\n\n##
    Box of Smoke\n\n2006 · NVIDIA, GeForce 8\n\nSmoke and water simulated on the card
    itself. Stir it with the pointer.\n\n[Play](https://box-of-smoke-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/box-of-smoke)\n\n ![](img/surf.jpg)\n\n## Surf\n\n1998
    · 3dfx, Voodoo / ATB\n\nStanding in a B-spline sea whose control points ripple
    from four wandering wave sources.\n\n[Play](https://surf-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/surf)\n\n ![](img/sixty-hertz.jpg)\n\n## 60Hz / 30Hz
    / 15Hz\n\n1998 · 3dfx, Voodoo / ATB\n\nThe same scene side by side, updated at
    different frame rates. Watch the bouncing ball.\n\n[Play](https://sixty-hertz-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/sixty-hertz)\n\n ![](img/demoroom.jpg)\n\n## Demoroom\n\n1997
    · 3dfx, Voodoo / ATB\n\nAn Egyptian room lit by a projector you steer: slides
    and a film multiplied over the walls.\n\n[Play](https://demoroom-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/demoroom)\n\n ![](img/atb-tv.jpg)\n\n## ATB-TV\n\n1997
    · 3dfx, Voodoo / ATB\n\nA television on a marble stand turns while its 73-frame
    movie plays on the curved screen.\n\n[Play](https://atb-tv-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/atb-tv)\n\n ![](img/flip.jpg)\n\n## Flip\n\n1997
    · 3dfx, Voodoo / ATB\n\nAnubis, an AT-AT, a dragon, a chrome martini glass and
    more, turned with the arrow keys.\n\n[Play](https://flip-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/flip)\n\n ![](img/grand-bleu.jpg)\n\n## Grand Bleu\n\n1997
    · 3dfx, Voodoo / ATB\n\nThe dolphins, sharks, rays, turtles and fish of an underwater
    demo, each swimming its own animation.\n\n[Play](https://grand-bleu-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/grand-bleu)\n\n ![](img/racing.jpg)\n\n## Racing\n\n1997
    · 3dfx, Voodoo / ATB\n\nIndy cars lapping a track along the lanes kept in the
    demo, with five camera views.\n\n[Play](https://racing-port.pages.dev/)[GitHub
    ↗](https://github.com/arkits/racing)\n\n ![](img/valley-of-ra.jpg)\n\n## Valley
    of Ra\n\n1997 · 3dfx, Voodoo / ATB\n\nAnubis and Nefertiti "
