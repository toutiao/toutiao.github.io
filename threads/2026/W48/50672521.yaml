article:
  url: https://tabernet.es/
  title: 'tabernetes: a Kubernetes cluster whose nodes are browser tabs'
  fetch_status: success
  content: "## The nodes\n\n| Node | Device | Browser | Near | Pod | Boot | Carried
    | Age |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\nNo tab is a node
    right now. Yours can be the first.\n\n## How it works\n\n1. **A tab joins.** The
    join page holds a socket open to an agent beside the API server, and the agent
    registers a Node for the tab. \n2. **The scheduler sends a pod.** The agent starts
    the pod's container with [tabc](https://github.com/fzakaria/tabc), a container
    runtime whose containers run in browser tabs. \n3. **The tab boots Linux.** A
    kernel compiled to WebAssembly runs the pod's program on the tab's CPU and memory.
    The pod's files and its address stay on the cluster's machine. \n\n## A pod asks
    for a tab in one line\n\nThe control plane is an ordinary Kubernetes, and a pod
    is an ordinary pod. The marked line is the only one that is new: the scheduler
    puts a pod that has it on a tab, and every other pod on the cluster's own machine.\n\n
    \   apiVersion: v1\n    kind: Pod\n    metadata:\n      name: hello\n    spec:\n
    \     runtimeClassName: tab\n      containers:\n        - name: hello\n          image:
    alpine\n          command: [\"sh\", \"-c\", \"echo hello from $(uname -m) in a
    tab; sleep 3600\"]"
