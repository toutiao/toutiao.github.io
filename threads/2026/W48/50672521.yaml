  author: xg15
  text: My understanding was that WASM itself has no access to browser APIs, meaning
    it can&#x27;t do network requests on its own, not even at the level permitted
    by the browser sandbox. You have to have supporting JavaScript to do the requests
    on the WASM app&#x27;s behalf, which gives you the same security environment as
    untrusted ad code (sadly).<p>So it&#x27;s up to the JavaScript code launching
    the WASM how much the WASM can do.<p>I think I read somewhere else here that this
    project doesn&#x27;t expose this ability to the &quot;pods&quot;, but instead
    tunnels any network requests from the emulated Linux side back to the server?<p>Not
    sure if this is correct, but it would be necessary anyway if you wanted to enable
    intra-cluster communication like in a real Kubernetes cluster. E.g. the code inside
    a pod might do something like &quot;curl <a href="http:&#x2F;&#x2F;some-other-service.main"
    rel="nofollow">http:&#x2F;&#x2F;some-other-service.main</a>&quot; . In a real
    cluster, this would be routed to another pod where an instance of the other service
    is running. In this browser version, some JavaScript would have to tunnel the
    request through the websocket connection somehow.
