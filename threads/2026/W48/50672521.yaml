  author: Panda_
  text: Reticulum is quite different to the others but they do of course all overlap
    since they all do networking in various ways.<p>You might say RNS is more generic
    than the others because the others are all intended to run over certain connections
    (mainly on top of the internet) while RNS is intended to run over almost anything
    that connects two nodes (TCP, LoRa, WiFi, fiber, etc) without needing the internet
    (it&#x27;s just a useful thing to make connections over).<p>The others are more
    intended to provide peer to peer connections or overlay networking on top of the
    internet, whereas Reticulum is meant to let you build networks across different
    underlying connections, with p2p connections and multi hop packet routing on top.<p>For
    unikernel Reticulum would probably be overcomplicating it, if you just want peer
    to peer connections over the internet.
