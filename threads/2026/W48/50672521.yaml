  author: xg15
  text: Yes, but much in the same sense that websites could already run JavaScript
    code before. I.e., that part isn&#x27;t new, and it runs in the same sandbox,
    so there is no security breach.<p>What&#x27;s new is that it runs an entire Linux
    kernel on it and also emulates the structure of a Kubernetes cluster - so the
    cluster can assign your tab workloads, route requests to it, etc.<p>As with all
    those demos where &quot;the server sends requests to the page&quot; instead of
    the usual other way around, it&#x27;s probably implemented using a WebSocket or
    WebRTC connection to the demo&#x27;s server. The page has to open that connection
    first, but once it&#x27;s open, both page and server can exchange arbitrary messages,
    so that&#x27;s often used to make server-driven pages.<p>But this means your machine
    is <i>not</i> open to receive arbitrary packets, it all has to go through that
    one connection.<p>It all doesn&#x27;t really do much except contributing some
    bit of compute resources from your machine to their cluster while you have the
    tab open - and giving you a log view so you can watch it receiving requests and
    feel proud.
  score: 0
