  text: |-
    The proof is based on Levent Alpöge's, with Claude (https://alpo.ge/remark.pdf). This repository is a shorter version, produced in collaboration with my colleagues at Anthropic, and Claude.

    I mean, the 76k lines version is also made by Claude. I think this is less indicative of an LLM failure and more an operator issue. Alpöge published not seeing a need to trim down the solution, someone else put in that work instead. If an LLM is bloating your repo with useless crap, you need to spend time and effort to trim it out and configure the LLM to more reliably not bloat the repo.
