  author: Cajunvoodoo
  text: Precisely. Previously, as humans, there are many times we do not want to manually
    write some boilerplate or some annoying logic over and over. An LLM doesn't have
    feelings and doesn't understand monotony, so it will happily add more files and
    more code and more files and more code etc. This causes explosions in code quantity
    to a degree we haven't seen before.
