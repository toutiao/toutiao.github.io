  author: justinpombrio
  text: |-
    My understanding of what happened:
    The real proof was the 17M machine checked Lean proof. He did not make that longer, though he certainly did release it before taking time to make it shorter, given that it's now 300K lines!
    Separately, he asked an LLM to convert the machine proof into an English proof for the lulz. It came out to 250k pages. There was obviously never any value to that, who would want to treat 250K pages of verbose obtuse English LLM prose. He said he made that that proof longer because it was funny. He thought it was obvious that the English proof was a joke, but the media doesn't know the difference between a machine checked Lean proof and an English slop proof.
    He does come across as a bit of a troll.
