  author: ssl-3
  text: 'That&#x27;s a wonderful trick to be able to perform, and I&#x27;m pleased
    to hear that you had good results with it.<p>But, I mean:  I don&#x27;t gather
    car parts out of junk yards often, but when I do, then...  I look at the website
    for their inventory, call them to verify (or if I&#x27;m desperate or the website
    doesn&#x27;t exist), and then I just show up and walk up to the counter and talk
    to a real person.<p>Sometimes, the answer is &quot;Third row, on the left, about
    a quarter of the way out on the first chunk.&quot;<p>More often, someone goes
    out with me and directs me towards what I&#x27;m looking for.<p>Or at least, that&#x27;s
    what happens when I pull the parts myself.<p>When they pull the parts on their
    own, sometimes I don&#x27;t go into the yard at all -- sometimes, those parts
    are already harvested, indexed and stored indoors, and waiting for someone like
    me to show up and buy them.<p>And other times, I go out there with some grizzled
    dude whose mentality is &quot;You just want the hub and brake parts for the left-rear?  If
    I just torch off that whole section, would that be OK with you?&quot;<p>Whatever
    the case, they&#x27;ve always got a good idea of what they&#x27;ve got -- and
    they want to help me buy it from them.<p>And sometimes, well beyond that:  When
    I needed a door handle for a GMC Safari (because it&#x27;s not a question of <i>if</i>
    a zinc GM door handle will fail, but <i>when</i>) and wanted to buy a used example,
    I popped into a yard where I&#x27;d seen some of those vans piled up out back
    and asked for one.  They said didn&#x27;t have any, and then they sold me a brand
    new one for a perfectly-reasonable price.  Bulk-packed, in a plain bag from a
    cardboard box filled with others, and less than $20.<p>&quot;These are really
    popular,&quot; he said as he handed it over the counter, &quot;so we keep new
    ones in stock.&quot;<p>---<p>What do drone shots gain here over a phone call and
    an eventual visit?  I&#x27;ve enjoyed looking at these because I think they&#x27;re
    neat and somewhat beautiful, but I&#x27;m not seeing the parts-finding practicality.'
  score: 0
