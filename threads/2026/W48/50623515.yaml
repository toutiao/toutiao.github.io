  author: dghlsakjg
  text: Like I said, most big yards will list the cars online. No need to call. It’s
    just the small mom and pops that don’t post inventory.<p>Find a pick and pull
    yard (that’s the name for what you’re describing. Sometimes called u-pull), since
    small interior parts aren’t profitable enough for the salvage yards that do the
    labor themselves. If you find a big enough one they will have inventory posted.
    If your car is at all common, though, you can pretty much guarantee that there
    will be one in one of the large pick and pull yards.<p>As an aside pick and pull
    yards are pretty fun just because you sort of get to wander around and poke at
    anything you want.
