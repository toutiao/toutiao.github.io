  author: fc417fc802
  text: To add a bit about the confusing (and borderline nonsensical IMO) state of
    affairs. The FAA contends that it regulates approximately anything that flys regardless
    of height. SCOTUS has affirmed this above the (potential?) treeline IIUC (a remarkably
    vague boundary). Below that at some point states rights must prevail over federal
    interests but (unless something has changed) it&#x27;s not at all clear how the
    details will shake out. The FAA continues to pretend that this isn&#x27;t the
    case as they draft up ever more rules and no one in their right mind wants to
    go to court with them so here we are.<p>On a slight tangent, I&#x27;m elated every
    time I see someone in the news for shooting down a drone over their backyard.
    It&#x27;s unfortunate they got caught but I&#x27;m happy they did it.
