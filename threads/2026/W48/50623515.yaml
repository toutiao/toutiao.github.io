  author: rickypp
  text: |-
    Is there any available software product out there that&#x27;s suitable for small-time wrecker yard inventory?
    It seems quite often I&#x27;m seeing online that these old properties with collections of 50-1000 junked cars come up for sale, usually because the hoarder&#x2F;owner is aging out. Maybe I&#x27;m wrong, but it feels if there was a good online inventory system a bunch of those properties could turn a profit.<p>Something really basic like drone photography for initial catalog, an app on an ipad that prompts a person to walk car to car and capture rough photos of condition&#x2F;parts on each, identity the year&#x2F;make&#x2F;model&#x2F;vin where possible. That part requires expertise, there&#x27;s no vision model that would be accurate enough on half-disassembled or wrecked shells. An online store that lists the cars on the lot, make it easy to request a part with an automatic purchase if the picker finds it. That same ipad app gets the picker moving around the yard efficiently when request volume is high.
