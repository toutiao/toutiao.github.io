  text: |-
    Ideas have always been cheap, but implementation was expensive, so implementation itself was a signal of commitment. Now ideas and implementation are both cheap, so signaling commitment will become expensive. For any product without network lock-in the only moat left is a reputation of long term follow through and strong customer service. That’s what will separate the tidal wave of fly-by-night LLM copycats from actual services.
