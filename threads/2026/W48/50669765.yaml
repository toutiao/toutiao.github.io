    you must manually turn it off). &quot;Off by default&quot; is one possible way
    of phrasing it that is entirely unambiguous.<p>Note that just as with terms such
    as &quot;open source&quot; there are motivated parties who actively attempt to
    misuse the language. That&#x27;s the only reason that a phrase such as &quot;off
    by default&quot; needs to be employed when technically that&#x27;s exactly what
