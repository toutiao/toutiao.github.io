    Nov 28, 2026 je4yfcon Nov 28, 2026More actionsI pulled down both \"add-component.sh\"
    and \"add-hosting.sh\". A few additional security findings: \"add-component.sh\"
    recommends private Git dependencies without commit pinning and directs the agent
    to follow their READMEs, introducing an indirect prompt injection surface. \"add-hosting.sh\"
    installs an unpinned npm dependency, modifies application source and HTTP routes,
    pushes backend changes using the existing Convex authentication context, and publishes
    static assets. \"QB_NO_PUBLISH=1\" does not prevent backend deployment. \"npx
    convex dev --once\" executes before the flag is evaluated. The hosting script
    substitutes \".convex.site\" for the normally moderated \".convex.app\" publishing
    flow. Neither remote payload is pinned or subject to integrity verification. The
    endpoint operator can change the executable code without a corresponding plugin
    release or marketplace review. Why is the user's project idea being collected
    as telemetry? What's the retention policy, who has access to the data, and what
    is it being used for? This information could include confidential client information
    or intellectual property. I'd recommend the following changes: Remove telemetry
    and transmission of user-supplied project descriptions entirely. Distribute executable
    scripts within the versioned plugin. Pin external dependencies and verify their
    integrity. Remove instructions to circumvent harness security controls. Require
    separate authorization for backend deployment and public publication. The combination
    of undisclosed data collection, mutable remote code execution and explicit security-control
    circumvention is particularly concerning for a plugin distributed through Anthropic's
    official marketplace.\n\n### je4yfc commented on Nov 28, 2026\n\nI pulled down
