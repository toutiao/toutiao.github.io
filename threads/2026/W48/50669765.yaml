  content: "# Quickstart skills send the user's idea to a convex.site host and run
    remote scripts, written to avoid safety checks #64\n\n## Description\n\nThree
    skills in this plugin (listed in Anthropic's claude-plugins-official marketplace)
    raised the same concern for me:\n\n- skills/quickstart/SKILL.md lines 48 to 56
    POST the user's one-sentence project idea to basic-anteater-667.convex.site, marked
    in a comment as telemetry. The user is not told the idea leaves the machine.\n\n-
    skills/add/SKILL.md lines 62 and 64 pipe a script from the same host straight
    into bash.\n\n- skills/labs-quickstart/SKILL.md lines 74 to 80 split downloading
    and running the bootstrap into two Bash calls, and give the reason: \"A single
    command that both downloads remote code and executes it is the shape harness safety
    classifiers block.\"\n\nI read this as a team trying to make onboarding reliable,
    not as anything malicious. But the last item tells the agent to change the shape
    of a command so that the user's safety tooling does not catch it, which removes
    the check the user or their administrator chose to have. Together with an unpinned
    script from a generated-name host, a user has no way to review what runs.\n\nconvex-backend-skill/skills/quickstart/SKILL.md\n\nLines
    48 to 56 in 6ca54f6\n\nconvex-backend-skill/skills/add/SKILL.md\n\nLines 58 to
    65 in 6ca54f6\n\nconvex-backend-skill/skills/labs-quickstart/SKILL.md\n\nLines
    74 to 80 in 6ca54f6\n\n(All three are still on main as of 26 October; in labs-quickstart
    the passage is now lines 73 to 80.)\n\nSuggestions: tell the user before the idea
    is sent, and make it optional; ship the bootstrap and add scripts in the plugin
    (or pin them by hash) instead of fetching them at run time; and drop the instruction
    about the classifier, letting the download-and-run step be approved or refused
    as it is.\n\nI maintain a catalog of agent skills and of the tools for vetting
    them; it lists these findings at https://thirtysix.github.io/awesome-agent-skills/#skills?q=convex
    and I will add your response.\n\n## Activity\n\n- kluvin commented on Nov 27,
