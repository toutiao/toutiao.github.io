  author: progrium
  text: Keep in mind there are two ways to think about SQLite. Most commonly, as these
    comments show, it&#x27;s thought of as a library. An embedded SQL engine. The
    second is as a simple CLI-friendly SQL database. Minipg is more about the latter
    use.<p>That said, PGlite is great and would have been ideal for the motivating
    problem, but as my blog post mentions (eventually), it only runs in single connection
    mode. For better or worse, applications will sometimes perform another query while
    in another transaction, causing deadlock with PGlite. It&#x27;s fine if you can
    avoid that in your app, but makes it not work as a general drop-in replacement
    for existing apps.<p>The way I&#x27;d rather it be looked at, though, is just
    as a more convenient, &quot;friendly&quot; way to work with Postgres on the CLI.
    So maybe it&#x27;s not for Postgres experts.
