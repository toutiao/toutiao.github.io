  author: jaredklewis
  text: I think it is fine as long as the founder&#x2F;coder&#x2F;whoever is just
    using the feedback as a source for ideas, not as the criteria for evaluating if
    the ideas are good or not.<p>Six years or so back I was experimenting with Elixir.
    I never ended up using it for anything important, but I still remember marveling
    at the wonderful personality of Jose Valim as I learned about Elixir. He was accessible
    on all kinds of channels like github, stack overflow, irc, and such, and he just
    exuded an openness to feedback. It seemed to me he was constantly interacting
    with Internet strangers about their ideas for Elixir. He always came off as very
    friendly and encouraging; I can never remember him being defensive or dismissive.
    Despite that, my impression was that Valim did not seem inclined to implement
    almost any of these ideas. He seemed to have a strong vision for what Elixir should
    be and passed on almost everything. Sometimes ideas were directly incorporated
    into Elixir, but mostly I think the effects of the feedback were indirect.<p>Another
