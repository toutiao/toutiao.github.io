  author: n923263
  text: "+0 would also be annoying - there&#x27;s not really a good answer here.<p>A
    result of -0.0 can mean two things (not counting it just being wrong):<p>a: the
    real (as in number) result is exactly zero, with a negative sign by coincidence
    (eg (1-1)&#x2F;(0-1)).<p>b: the real result is strictly less than zero, but even
    tinier than the smallest denormal, so it was rounded up to zero.<p>Case (a) means
    you <i>must</i> have sqrt(-0) == 0, or you get problems like derf_&#x27;s.<p>In
    case of case (b), having a square root be negative (impossible!) is the best indication
    we can squeeze in that something might be weird."
