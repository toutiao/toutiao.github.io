  author: derf_
  text: |-
    It is surprisingly easy to get unexpected negative values with floating point operations. One I remember was a square root that was failing on a negative argument <i>despite that argument being clamped against zero</i>. The problem was that the clamp was using some macros<p><pre><code>  #define MIN(a, b) ((a) &lt; (b) ? (a) : (b))
      #define MAX(a, b) ((a) &lt; (b) ? (b) : (a))
    </code></pre>
    and the arguments were being clamped with MAX(x, 0). Well, if x is <i>negative zero</i>, it is not less than 0, so the macro returns x. The square root then looks at the sign bit and fails. Negative zero is a perfectly possible result from a series of calculations that destructively cancel.
