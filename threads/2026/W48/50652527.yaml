  text: I&#x27;m glad there are differences, otherwise what would be the point!<p>Artificial
    Analysis - it&#x27;s well documented that models behave differently when running
    benchmark-like questions. For better or for worse, the correlation between our
    cost and theirs is like 0.30 (I have an unpublished analysis on this.)<p>I haven&#x27;t
    dug into LiveBench, but looking at their Opus 5.5 cost ($6.72) compared to Astra
    6.2 ($1.94) doesn&#x27;t pass the sniff test. (Yes, I know the article says that
    Astra was cost tuned, but man &gt; 3x multiple doesn&#x27;t pass the sniff test.)<p>Arena&#x27;s
    code methodology is not as similar to Agent Duel as you might think! They actually
    only run one agent per task, randomizing the agent, rather than running them head
    to head. Also, they run all agents in cloud containers, whereas ours is run in
    the user&#x27;s local environment.<p>One difference here might be effort level.
    Since we&#x27;re aiming for people to do real work, our models are set closer
    to their default thinking level (For example, Arena 6.2 in Arena&#x27;s leaderboard
    is running on Max).
