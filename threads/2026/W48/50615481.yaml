  author: Grombobulous
  text: I never understood the demand for this. Email is one of the least private
    services out there by its basic design. You’re sending and receiving emails to
    other people and servers you can’t control.<p>Sure, Proton and the like will keep
    your emails encrypted between you and other Proton users. Cool, they have less
    than 0.30% marketshare, so 99% of your emails are effectively not end to end encrypted.<p>Also,
    e2e email services lock you in to using clients because you can’t use plain IMAP.
    You need the added complexity of installing a mail bridge with Proton to have
    email client choice. Don’t like the Proton client on your phone? Too bad, you
    have no choice, since there’s no client bridge on mobile platforms. With a standard
    email provider like Fastmail you don’t have that problem, use any client you like.
