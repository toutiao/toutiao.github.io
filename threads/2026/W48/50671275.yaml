  author: julesrms
  text: 'Harnesses are complicated beasts, there&#x27;s a lot more needed than you
    might expect!<p>I&#x27;ve been a harness builder this year: Juggler (<a href="https:&#x2F;&#x2F;github.com&#x2F;juggler-ai&#x2F;juggler"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;juggler-ai&#x2F;juggler</a>)
    and as a veteran native C++ guy, I&#x27;m also a stickler for the &quot;no bloat&quot;
    approach. I made it a Go binary and used webviews instead of electron, with no
    node etc.<p>However, Juggler&#x27;s download size has grown this year from about
    40MB to 70MB, just because of the massive amount of stuff that you need to put
    in there to cover all the features people want.<p>Using Juggler as an example,
    any fully-featured agent is going to end up containing a list of junk like this:<p>-
    all the 3rd party libraries for provider APIs like anthropic, codex, etc, some
    of which contain massive amounts of generated code<p>- file format parsers and
    display classes for loads of random file types, including handling all kinds of
    images for multi-modal agents<p>- a sqlite engine just to be able to import sessions
    from other code agents<p>- a whole WebRTC stack: ICE, DTLS, SCTP and mDNS for
    remote connection handling<p>- all the official MCP SDK junk<p>- google&#x27;s
    genai also drags in gRPC and protobuf with it<p>- Juggler&#x27;s i18n alone adds
    about 0.5MB per language, and I&#x27;ve added 8 languages so far<p>So sure, you
    can write an basic agent in 5MB, but it&#x27;s going to be pretty bare-bones!'
