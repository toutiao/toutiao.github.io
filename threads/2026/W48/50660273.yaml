  text: There is a reason why these inference wrappers exist, it’s a way to arbitrage
    compute.<p>Imagine, some team or individual has a way to access pre-emptible GPU
    hours at some low price.<p>Let’s say that low price is $6&#x2F;GB300&#x2F;hour.<p>If
    the inference wrapper can achieve demand of some base load of, equivalent of a
    rack of GB300s (72 GPUs).<p>Essentially, the wrapper can route baseload traffic
    to the primary provider at market API prices (and make no money).<p>But when the
    cheap GPUs are available, they can route them to the hosted instances to internalize
    the API margins.<p>DeepSeek’s team has an estimate of ~$36&#x2F;gpu&#x2F;hour
    of monetization for DeepSeek 4.1 flash at off peak rates.<p>So this team would
    be making $(36-6)&#x2F;gpu&#x2F;hour for any traffic they can route to the cheap
    GPUs.<p>—-<p>But from an user standpoint…<p>In many ways, inference APIs should
    be validated like a trusted actor end to end.<p>A bad actor that controls the
    other end of your inference API call, could control your computer (the service
    just needs to return bash tool calls…
