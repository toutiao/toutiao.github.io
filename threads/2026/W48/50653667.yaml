    on HN, a configuration of Iosevka tuned to be very similar to Input Mono. Iosevka
    has much broader character support and switching also fixed some issues I had
    in applications that use less common font rendering stacks.<p>I&#x27;ve since
    made some of my own tweaks, which is very easy if you&#x27;re building Iosevka
    anyway.<p>(You should be aware though that Iosevka has introduced breaking changes
    to config details many times. I wouldn&#x27;t expect the current state of the
    Iosevka Output repository to build with the current state of the Iosevka repository.)<p>[1]:
    <a href="https:&#x2F;&#x2F;sr.ht&#x2F;~ashton314&#x2F;iosevka-output&#x2F;" rel="nofollow">https:&#x2F;&#x2F;sr.ht&#x2F;~ashton314&#x2F;iosevka-output&#x2F;</a>'
