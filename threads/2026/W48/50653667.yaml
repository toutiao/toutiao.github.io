  author: teo_zero
  text: "&gt; I just want something that works.<p>I think this sentence summarizes
    your concept more than any other paragraphs.<p>We have primary needs. They make
    our life&#x2F;job possible. These are about functionality. Good objects&#x2F;products
    satisfy these needs if they work. The key point is <i>what</i> they do.<p>Then
    there are secondary needs to make our life&#x2F;job enjoyable. These are about
    aesthetics and taste. Good objects&#x2F;products satisfy these needs if they make
    you feel better when you use them. The key point is <i>how they make you feel</i>.<p>While
    primary needs are nearly universal, secondary ones are pretty personal. Some of
    us like good food&#x2F;wine&#x2F;coffee, others eat only to ingest calories&#x2F;caffeine.
    Some spend a fortune in clothes, others would wear the same uniform everyday.<p>As
    it happens, you have not developed a particular taste for fonts, and whatever
