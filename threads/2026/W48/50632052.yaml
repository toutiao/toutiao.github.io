  author: Karliss
  text: It&#x27;s in the actual paper more or less first figure &quot;d2 knitting+weaving&quot;.
    The trick is to do the knitting sideways using multiple yarns, not line by line
    with single yarn. That way instead of dealing with complexity of pulling the yarn
    through loops, the pattern becomes a couple of twists back and forth. The process
    is nothing like traditional hand knitting or machine knitting, but resulting structure
    of yarn is equivalent to basic knitting pattern.
