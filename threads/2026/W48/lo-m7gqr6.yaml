    Regardless of what a "real" compiler might look like, in this specific case that he was investigating the code gen took half as long as the lexing:

    The CPU time distribution in my single-pass compiler is roughly 40% lexing + 40% parsing and semantic analysis + 20% code generation (x86-64).
