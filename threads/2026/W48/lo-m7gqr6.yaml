    OK sorry I clicked through to a Mastodon thread, and I didn't realize the article you linked is by someone else.
    https://validark.dev/posts/deus-lex-machina/

    the new implementation can tokenize up to 2.75x faster than the mainline implementation, currently at 1.4GB/s on a single core on my laptop

    So yeah I would be very surprised if speeding the lexer 2.75x makes any difference in a real compiler.  I sort learned that the hard way myself, by speeding up something that is not a bottleneck :-)
    BUT maybe Zig has some sort of ultra fast code gen + type checking + comptime, making parsing more of a bottleneck, and then I would be surprised and interested ...
