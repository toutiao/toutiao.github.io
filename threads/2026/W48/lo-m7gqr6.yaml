  author: cpurdy
  text: |-
    Is there any widely used compiler that uses the single pass architecture?

    No, it's just not common in the realm of what people normally think of as general purpose computer languages. I'm fairly opinionated on the topic: single pass compilers are interesting in a historic sense, and they're interesting in a "hey I've got a week off to play with compilers", but they just aren't useful for general purpose languages.
    Off the top of my head: TCC and Turbo Pascal are both considered single pass.
    In most general purpose language compilers that I've spent any time looking at, lexing and parsing represent a small rounding error (like not even approaching 5% of total time). But there are lots of embedded use cases (very targeted language implementations) where compile time is a nasty blocking problem to be solved, and code quality on the back end is largely irrelevant, so lexing and parsing will constitute a significant part of the time budget, and brittle optimizations for lexing and parsing are considered worthwhile.
