    I replied to the sibling thread with a list of some top-level issues. Maybe that's enough to satisfy your curiosity, but there's a bunch of other things I could say; it would probably demand a long article which I don't have the fortitude to write. If you're curious about anything in specific I didn't cover in the other reply, I can try to answer them here.
    I dug through some of my old Gists to see if any of them could be linked directly as a self-explained example. Here's one on just some of the issues with aliasing. Another thing I should have mentioned explicitly in that Gist is that even if you keep everything else about C's aliasing-related semantics (not recommended), you would want to flip the default sense of 'register', not as a register hint but the semantic meaning, so that locals can't have their addresses taken by default and you have to declare locals that want that explicitly. There are a lot of examples like that: const/let variables should be the ergonomic default so you can tell in advance which variables will be loop invariant. A multi-pass optimizing compiler really doesn't care about that since it's going to do the fixpoint dataflow analysis anyway. Even 1.5 forward and 1 backward pass similar to LuaJIT [1] can get you there in most cases. But a single-pass compiler that wants to optimize based on loop invariants really cares about knowing constraints in advance, whereas checking a forward-declared constraint is usually not a problem in a single-pass compiler.
    [1] A forward pass followed by a backward pass (with fused backward liveness propagation, backward register allocation and backward code generation) is the next magical sweet spot and should probably be your first stop beyond a single-pass compiler if you're aiming at roughly -O1 code quality with a fast-as-possible compiler. LuaJIT's optimization pipeline is not truly 2 passes since it replays the loop body of a lasso-shaped trace in addition to the first peeled iteration, and it only handles lasso-shaped traces (side exits go to the interpreter or other lassos, but IIRC the SSA and machine code of lassos are mostly opaque to each other except for inheriting the initial register/stack slot assignment from the parent's side exit); there's a pretty natural extension of the same idea to block-structured control flow. I tend to think of LuaJIT's optimization and code generation pipeline as 2.5 passes.
