    Is there any widely used compiler that uses the single pass architecture?

    There's tcc in the C compiler space, which targets -O0 quality machine code. There's PUC Lua and LuaJIT's bytecode compilers and a bunch of other bytecode compilers. If the language is amenable to it and you care about compilation speed, you should consider architecting a new compiler so it can compile in one pass in the baseline mode. As it happens, C is pretty miserable to compile in one pass for a bunch of reasons, but it's still doable; it's not hard to design a language at a similar level of abstraction to C which is much more friendly to single-pass compilation (in the sense of implementation complexity, compilation speed and code generation quality).

    The fundamental limitation is that most compilers optimize for the speed of the generated code, or they have a tradeoff between the generated code speed and the runtime of the compiler itself. And that genuinely requires IRs, and IRs change the design of the compiler by a lot.

    No, IR doesn't have to change the design of the compiler frontend at all. You design the logical stages of the compiler in the tagless-final style so they can be fused together to run in one pass in the fast baseline mode while stage implementations (which can be internally multi-pass for an optimizing backend stage) can be freely swapped and can be run and tested separately. The tagless-final interface to a stage is like an immediate-mode IR interface that in one pluggable implementation can process the operations inline or in another pluggable implementation can build the corresponding initial encoding (data-oriented IR representation) so it can transformed or replayed in further passes like you would with a conventional compiler IR.
