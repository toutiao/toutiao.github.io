    Vectorized text processing tends to be on the more awkward end of the spectrum because of a higher fraction of horizontal and compaction operations, and you often have to come up with specific tricks for every sub-problem to make it fast. If you're working on more naturally data-parallel problems than text processing but still something far beyond the reach of auto-vectorization, I'd recommend taking a look at ISPC; I used it recently to write an AVX-512 software rasterizer and it was a very pleasant experience.
    As for explicit vectorization with intrinsics, AVX-512 helps a lot by having a more complete set of operations and operand types and being much more orthogonal. Intel's older SIMD extensions have a deservedly bad reputation for being full of holes and quirks. Fabian gives a bunch of examples (with workarounds) in SSE: mind the gap, but AVX2 is still terrible compared to AVX-512; it'll just take a long time for AVX-512 to become universally available on x86 computers in the wild.
    I used https://docs.rs/fearless_simd/latest/fearless_simd/ for the AVX-512 code I wrote for the fast lexer, so all the uses of AVX-512 intrinsics in my code were at least safe in the Rust sense. But yes, it was completely AVX-512 specific.
