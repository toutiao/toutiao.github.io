  text: |-
    What makes you say that?

    I've previously implemented a Wirthian single-pass C front-end. It was not fun, and I say that as someone whose idea of fun is implementing compilers. I've also carefully studied how tcc is implemented, which as far as I know is the only publicly available single-pass C compiler (there's probably a bunch of slopped-up versions nowadays that no-one would want to use).

    And it must be, since a multi pass architecture would not have been feasible for the kinds of resource-constrained machines that the first C compilers were written for.

    If you look at the early compiler implementation strategy from Ritchie's Primeval C you can see it's not true that any of the original C compilers were single pass, at least not in the Wirthian sense. There's 2 passes just in cc itself, which run as separate programs in separate processes (called c0 and c1 in the first compiler on the Primeval C page).
    But that's the tip of the iceberg. The classic C compiler design in the Unix tradition is a pipeline with the shape cpp | cc | as. Even if they're running as multi-process FIFO-buffered streaming transducers, all the data is re-processed (and cpp needs a slightly different notion of token compared to cc) multiple times and everything travels in an inefficient human-readable textual form. That pipeline is minimally 3 passes given the choice of interchange formats, but realistically at least 4 passes because batch assemblers like as use 2 passes (and +1 if they implement branch relaxation) to resolve forward references.
    It's easy enough to fuse machine code generation into cc itself (using backpatching to sparsely fix-up forward references), which leaves at least 2 passes if you use the standard cpp implementation approach, even if you move the preprocessing in process and improve the interchange format from from a byte stream to a preprocessor token buffer.
    You can study tcc to see how Fabrice Bellard fused the preprocessor into the lexer (i.e. what almost no-one else is crazy enough to do), with great care and clever hacks, accompanied by a very long history of wack-a-mole compatibility bugs with the C preprocessor specification that took many years to fix (and I'm pretty sure that part of the compiler is still not watertight after 2 decades of fixes).
    I believe tcc uses a separate pass to emit ELF/PE object files but when emitting runnable in-memory machine code ("JIT mode") it's a true single-pass compiler in the Wirthian sense. I'm saying all of that is hard for C compared to a language (of comparable abstraction level) designed to make it easy.
    If you want to count the classic 4+ pass architecture I outlined as 2 passes (the 2nd pass in a traditional batch assembler is not really debatable) because they're running as concurrent processes operating in a batched streaming mode via Unix pipes, it's definitely one definition you could use. But what I meant by my original statement was a Wirthian single-pass compiler, where everything is operating ideally at LL(1) granularity throughout so you don't have to buffer or re-process data beyond the minimum granularity. The LL(1) restriction can be slightly loosened.
    There's a laundry list of other things that are needlessly annoying to implement compared to a language ideally suited for single-pass compilation. There are many small (and some big) fixable issues in the design of the semantics which you would do differently if you were trying to help out a single-pass baseline compiler in all three senses I listed originally: implementation complexity, compilation speed and code generation quality.

    In a single pass design, parser context-dependent identifier disambiguation is pretty simple at least with a hand-written parser IMO.

    Yes, that problem goes away in any C compiler where parsing and (at least some) semantic analysis happens in the same pass.
