    OK I see what you are saying -- you could use an emitter interface, and then if you are writing in a language with monomorphized generics like C++ or Rust, you can share the front end.

    Correct. It arguably works even better in C! You can do a very respectable facsimile of ML modules and generative functors using the C preprocessor to configure, instantiate and hook together stages in multiple different graph topologies within the same C translation unit using .inl files for generic modules to be instantiated. My first few experiments with the tagless-final approach for single-pass compilers that can be modularly reconfigured into multi-pass were actually implemented in C. Recently I tend to use Rust for most compiler work, but Zig, C, C++ and Rust all have very reasonable ways of achieving this kind of architecture with the expected performance.
    One restriction on single-pass compilation is that you're effectively doing a depth-first in-order traversal of the CST as you visit tokens. I haven't found anything else with my exact take on tagless-final for Wirth-style single-pass compilers. If you look at the stuff on Oleg's amazing tagless-final page it tends to correspond to post-order traversals of syntax. Post-order is sufficient for a lot of things in a single-pass compiler, e.g. emitting eagerly evaluated code for non-short-circuiting expressions. But in general you need to restructure the tagless-final interface so it visits tokens and other items in-order, one at a time. Even for expressions, this is necessary for short-circuiting operators like && and ||. Notice how Wirth uses And1/And2 and Or1/Or2 in his book's example Oberon-0 compiler: https://people.inf.ethz.ch/wirth/CompilerConstruction/OSG.Mod.txt.
    Anyway, you absolutely can support an in-order tagless-final interface and that's what I do; it just needs a lot finer event granularity in the interface than what you usually see.
    I should mention that some of these specific comments are for left-to-right parsing of a conventional infix language. A prefix language can help here with some things, especially S-expressions where the end is explicitly delimited, which enables more single-pass computations to be expressible: such computations correspond to L-attributed grammars and the left-to-right token visit order matters for that. And you usually prefer to know ahead of time what the operator is and to immediately know the end of an expression. In a standard left-associative operator-precedence parse of an infix language, the first thing you see left-to-right is a leftmost leaf potentially buried arbitrarily deeply along the left spine in the implicit parse tree corresponding to the left fold, so that part of the single-pass computation actually corresponds to S-attributed grammars (a strictly less expressive subclass of L-attributed grammars) because of the locally bottom-up operator-precedence parsing strategy. Basically, you don't know anything about your parent node in advance for that case, so you can't pass down inherited attributes from the parent.
    Example: with bidirectional typing you can't pass down the expected type (a prototypical example of an inherited attribute in the attribute grammar sense) for the bottom-up infix fragment of the language. Concretely, if you see the token 123 in something like C you don't know if it completes to 123[ptr].foo. In delimited prefix form the equivalent would be something like (sel (idx 123 ptr) foo), so you know who your ancestors are (and all other earlier descendants of those) when you first descend. Even while remaining an infix language, you can partially address that by identifying a few spots in the grammar where expected types or other inherited attributes are especially valuable (e.g. initializer expressions) and then you can choose to lift them out of the bottom-up fragment of the syntax so they won't be folded like that. This is yet another class of upfront language design decisions that can seriously aid single-pass compilation.
    (I have lots of thoughts on other things you mentioned. E.g. I've designed and implemented so many takes on fast indexing for homebrew languages with indentation-sensitive line-at-a-time syntax, but this is already a ridiculously long post.)
