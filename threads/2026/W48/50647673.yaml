  author: alwa
  text: I’m not sure where it is implementation-wise, but at least in principle, I
    seem to remember C2PA’s “ingredients” supporting a chain of provenance all the
    way back to the sensor in the camera. Such that even if you don’t choose to bundle
    each complete edit&#x2F;version’s worth of image data into the same file, you
    can sign which asset(s) each version derives from and prove it later.<p>So in
    theory, as I understood it, this could facilitate sort of a harder and more general
    version of Lightroom’s “rewind through the edit steps to the original” sensibility.<p>With
    a credible chain of provenance, it seems like social attitudes and editorial policy
    could conceivably evolve back toward more nuanced versions of “just don’t lie
    with pictures.”<p>If the net effect of your GenAI-enabled edit is really just
    to show the best face of the truth, then one way to prove it is to offer a look
    at the original without its figurative makeup on, right?<p>(Then again if I were
    a Times editor, I’d probably still want to make those calls myself—I’d still want
    contributors to start me out with the clean original.)<p><a href="https:&#x2F;&#x2F;spec.c2pa.org&#x2F;specifications&#x2F;specifications&#x2F;1.2&#x2F;guidance&#x2F;Guidance.html#_ingredients"
