  author: ploxiln
  text: 'Browsers have been optimizing CPU and RAM usage like crazy, over the years.
    Compared to 15 years ago, they probably are 100x more CPU efficient and maybe
    4x more RAM efficient, I don&#x27;t really know and it obviously varies widely
    depending on content, but what I do know is that websites are 1000x to 10,000x
    less efficient, because they can be.<p>Browsers used to have status bars that
    showed details about loading the page to regular users. They should have kept
    them, and they should show statistics about how heavy the page load is: total
    transferred, total JS vs html&#x2F;css vs media, total cpu usage, cpu usage per
    minute, memory usage, high and low watermarks, gpu usage?.<p>Over time people
    would come to understand that some websites are way heavier than others, and prefer
    the lighter alternatives where practical. At least some more web-dev engineering
    managers may come to appreciate the value of not having absurdly bad efficiency.<p>And
    now, why are some company&#x27;s minor mobile apps 500MB, when an open-source
    native mobile app can be like 20MB? Same thing - because they can.'
