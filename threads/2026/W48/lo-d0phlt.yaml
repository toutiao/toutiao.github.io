  text: |-
    Yeah, holding trademark registrations is often one of the main jobs of an open source foundation, so I was surprised there’s nothing about it on the PHP Foundation’s website that I could find.
    But it isn’t strictly necessary to register a trademark, at least in some jurisdictions: in English law there is the tort of “passing off”, and similarly in the USA there’s “false advertising”. But it can be much harder to defend an unregistered trademark than a registered one.
    However, ICANN isn’t a court of law so it can weigh the balance of its decisions quite differently.
    (It still baffles me that people keep moaning about collisions between filesystem extensions and TLDs when for decades we have had domains like command.com or markdown.pl (registered but broken) or download.sh, and I don’t remember seeing a report of that leading to a security failure.)
