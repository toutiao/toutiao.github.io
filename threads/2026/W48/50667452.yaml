  author: qball
  text: webOS was truly the Amiga of mobile operating systems.<p>Its programming interface,
    right down to the UI, is what 5-10 years later would become the dominant way to
    write software (Electron- this is the &quot;web&quot; in &quot;webOS&quot;); its
    code available in plain English for easy modification, system calls made by a
    REST call to the device itself.<p>With chroot tricks, you could run a proper Linux
    desktop as just another application.<p>The UI was such a leap forward in multitasking
    that both iOS and Android versions incorporated its main features (mainly, the
    cards) more or less as soon as it was discontinued (and it was very much not intuitive,
    considering Microsoft wouldn&#x27;t offer seamless multitasking in Windows 8 or
    even 8.1, the first of which would release 2 years later).  Ironically, and technologically,
    it&#x27;s what GNOME 3 should have been.<p>It does depress me that it&#x27;s gone;
    it would have been a phenomenal clean-slate foundation had HP persisted with it.  Alas,
    they weren&#x27;t a software shop.
