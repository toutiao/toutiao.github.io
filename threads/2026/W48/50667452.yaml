  author: ndiddy
  text: WebOS was such a nice mobile OS. It was the first time anyone had done multitasking
    well on mobile. It worked so well that the current iOS and Android multitasking
    UI is an inferior clone of the WebOS multitasking UI from ~2010. Besides using
    the same card interface and the same gestures as iOS and Android currently do,
    WebOS also let you freely re-order cards or group multiple cards together into
    a stack. Having multitasking built into the OS as a core feature was fantastic.
    For example, when you were writing an email, it would open a new card for the
    &quot;compose&quot; window. You could go back to the email client and reference
    other stuff, while having your work-in-progress email still up instead of having
    to retrieve it from drafts.<p>I also liked how nerd-friendly WebOS was. You could
    root it trivially, and then because all the UI was HTML and Javascript there were
    tons of tweaks available. If anything in the UI bugged you, someone had likely
    already written a tweak that would fix it. For writing software, you could make
    phone style apps using HTML and Javascript, and you could write or port native
    C++ software (games or other 3D apps) incredibly easily because their native SDK
    was just SDL 1.2 and OpenGL.
