  content: "# UI style guides \n\nThis is a collection of preserved UI style guides
    a.k.a. interface guidelines from various companies, starting from the early 1980s
    and continuing to today.\n\n* * *\n\n- \n### Amiga \n\n(Commodore) [Amiga](https://en.wikipedia.org/wiki/Amiga)
    was a multimedia personal computer particularly popular in the 1980s and 1990s
    in Europe. Its GUI was called Workbench.\n\n- \nAmiga User Interface Style Guide\n\n![](images/ui-style-guides/amiga/cover.avif)\n\n![](images/ui-style-guides/amiga/2.avif)\n\n![](images/ui-style-guides/amiga/1.avif)\n\n![](images/ui-style-guides/amiga/3.avif)\n\n![](images/ui-style-guides/amiga/4.avif)\n\n
    \ - [1991 PDF](/ui-style-guides/Commodore%20Amiga/Amiga%20User%20Interface%20Style%20Guide%20(1991).pdf)\n
    \ - [1991 Internet Archive viewer](https://archive.org/details/amiga-user-interface-style-guide)\n\n-
