  text: |-
    The AI bubble is certainly part of it. Per unit of area, high-bandwidth memory stores about 0.3% as many bits; that is, manufacturing a typical 16 GB GPU takes roughly the same resources as 5 TB of SSD. Since the SSD is unaffordable, buyers switch to HDDs. It’s simple demand substitution.
    The more interesting observation for software people though is that hyperscalers have figured out how to use software to run HDDs extremely efficiently. They can store more data using SMR, they can store cold data with idle disk arrays, they can get high availability with error correction codes, and they can get decent real-world performance using tiers of caching. These are all innovations in software that are possible if you’re managing exabytes of storage.
    Both factors mean that there’s suddenly high demand for HDD tech in data centers. Western Digital said they sold out their 2026 production to just seven customers. Seagate said 90% of their sales were going to data centers. TrendForce estimated 60% of HDD sales were going to just Google and Amazon.
    With new high demand and fixed supply, prices per TB have more than doubled - back to about where they were 10 years ago.
