  author: ridafkih
  text: You&#x27;re the first person who has made that criticism that actually understood
    why glass was used for the demo page.<p>Every &quot;liquid glass on web&quot;
    library in existence falls short because it can&#x27;t keep up the compositor
    refresh rate. Simple as that. Part of it was also bringing native UI to the web
    because I figured it&#x27;d be quite jarring to see a convincingly native element
    in a website for those familiar with web development.<p>As for using iOS, Apple
    doesn&#x27;t use the glass effect (`_UILiquidLensView`) I used for the progress&#x2F;scroll
    indicator outside of a very select few use-cases because (as is the case on this
    website) if it&#x27;s not positioned squarely in the centre of your macula, the
    intensity of the refraction combined with the chromatic aberration makes it so
    that it appears flashy and distracting. I accepted it for the sake of the demo.
