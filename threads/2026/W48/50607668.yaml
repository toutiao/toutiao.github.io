    </code></pre>
    With these 3 things (and no `sorry`), it does not matter what the LLM did to get the statement to be proven. The proof can be the messiest code ever, it can redefine the same things a million times, redefine all operators a thousand times in nonsensical ways, have weird local notation, be the worst spaghetti in the world, doesn&#x27;t change anything: it won&#x27;t make false things provable and the kernel guarantees that the program is a correct proof of the statement. Again, that&#x27;s the whole point of Lean.<p>&quot;Prove something true but meaningless&quot; only applies to the statement. A bad intermediate lemma can&#x27;t infect the final result.
