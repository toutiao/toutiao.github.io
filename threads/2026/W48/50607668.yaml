  author: dmos62
  text: 'What are peoples&#x27; takes on why LLMs struggle to write things in a human-readable
    way? I&#x27;ve watched Astra and the like write PR descriptions that are middle-school
    level: as if it struggles to distinguish what it knows (having read the code,
    having done the debugging) and what someone who hasn&#x27;t read the code and
    hasn&#x27;t participated in the debugging (his target audience) knows. It&#x27;ll
    make references to parts of the solution, or of the problem being solved, without
    contextualizing it, making the references useless, serving only to add confusion
    to the text.<p>Terence Tao&#x27;s take was that LLMs don&#x27;t understand what
    is trivial (in a proof, for example) and what is interesting and novel: it gives
    everything equal weight, or, in Tao&#x27;s paraphrased words, the LLM will talk
    at length about something trivial and then write only a single sentence about
    something novel.<p>I wonder what peoples&#x27; intuition about this is.'
