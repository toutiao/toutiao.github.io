  text: |-
    &gt; Does the raw count of lean code lines shed any light on how impressive Andrew Wiles&#x27; proof of Fermat&#x27;s Last Theorem was?<p>No. You can increase the line count of any Lean proof almost at will by expanding axioms it builds on by their Lean proofs.<p>Also, one can write very long proofs for simple statements. As a stupid example a proof for “there is only one even prime less than a million” could follow the lines of<p>- proof 1 isn’t even
    - proof 2 is even and prime
    - proof 3 isn’t even
    - proof 4 is even, but not prime
    - proof 5 isn’t even
    …
    - proof 999,998 is even, but not prime
    - proof 999,999 isn’t even<p>instead of the simpler<p>- even numbers are divisible by 2
    - prime numbers are only divisible by 1 and itself
    - assume p is an even prime
    - the, p being even, it is divisible by 2
    - and, p being prime, it is only divisive by 1 and p
    - 2 ≠ 1
    - hence p = 2
