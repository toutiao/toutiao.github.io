  author: quietbritishjim
  text: Lean has a bunch of rules about what a proof can deduce from earlier statements.<p>For
    example if you have already managed to prove the statement P → Q (&quot;P implies
    Q&quot; i.e. whenever P is true we then also know that Q is true), and then you
    manage to prove the statement P, then you can use those two statements to prove
    Q. Lean knows that P → Q plus P proves Q (&quot;modus ponens&quot;).<p>As another
    example, if you have P or Q, and you prove P is false, then Q follows. (e.g. x
    is odd or even, then you prove it&#x27;s not odd, therefore it&#x27;s even.)<p>To
    accept the proof you don&#x27;t need to look at all the millions of lines of proof,
    because Lean checks that they all follow correctly from earlier statements. You
    just need to accept three things:<p>* Lean&#x27;s inference rules (like the one
    above)<p>* Axioms (e.g. definitions of numbers)<p>* The statement of the theorem
    in Lean symbols<p>These are all hugely shorter than the theorem&#x27;s proof.
  score: 0
