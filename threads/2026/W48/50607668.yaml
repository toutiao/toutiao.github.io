  text: 'Lean is a computer language and proof system that codifies what a proof is:
    you give it a series of axioms and of logic rules, and then it will tell you if
    a theorem and a proof abides by those rules or not.<p>So then we can formalize
    our classical logic and number systems in Lean (the systems that are used by most
    mathematicians) and present it with the theorem and its proof, and IF THERE IS
    NO BUG in the (relatively simple) Lean core, it should mean that we have a high
    degree of confidence the proof is true (in practice: we almost know the proof
    is true, except if the system is &quot;inconsistent&quot;, but that would have
    much broader implications on mathematics)'
