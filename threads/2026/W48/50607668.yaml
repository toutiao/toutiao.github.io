  author: RugnirViking
  text: do you have much familiarity with c++? you know how you can override operators,
    or keywords?<p>you can do that in lean too. A single redefinition of &quot;sum&quot;
    or &quot;+&quot; or &quot;&amp;&quot; or whatever that was supposed to help with
    some small branch off in a single frond of those millions of lines of code, and
    suddenly entire parts of your proof work with different axioms to those we usually
    accept, such that a number+1-1 =that number may not be true anymore<p>and these
    are the obvious ones. There can be massive components that you establish, reestablish,
    reestablish again etc all with slight differences in formulation. LLMs are great
    at sowing confusion like this in large codebases, they can&#x27;t find something
    so they assume it doesn&#x27;t exist and end up making the 200th copy. A subtle
    error in the formulation or use of one of these and you prove something true but
    meaningless<p>there are ways to check for this - the problem statement is usually
    made in one file, then defined again in the code to be compiled. The compiled
    versions can be checked against each other, in several compilers and versions
    of lean, and in the case of the RH proof here they say they&#x27;re the same (haven&#x27;t
    had elements subtly redefined to prove something different). But also that check
    was itself a constraint that the agent knew about - and we&#x27;ve caught LLMs
    cheating this way before, so it could well just be better at hiding things.<p>This
    all being said, I don&#x27;t have a reasonable way to establish how likely it
    is that the proof is wrong. I&#x27;m skeptical of anyone talking with confidence
    one way or the other.  I just know that frontier LLMs in large codebases consistently
    produce evil&#x2F;stupid code at random and unpredictable intervals. My confidence
    is higher than 50% this result will hold, but less than 90% - I would not at all
    be surprised if its retracted also
