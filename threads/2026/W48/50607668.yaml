  text: |-
    Sorry but none of that is relevant.<p><pre><code>    - Do we trust the kernel? To a high confidence level yes because tested on multiple kernels
        - Do we trust the axioms? If it&#x27;s only the ones from the standard lib then yes we have high confidence. If the LLM added random axioms then no we wouldn&#x27;t trust it... but we&#x27;d have heard about it by now, it&#x27;s literally the first thing anyone would check I guess?
