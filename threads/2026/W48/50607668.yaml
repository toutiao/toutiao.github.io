  author: dgacmu
  text: 'But the results were still conditional, and it was useful to have results
    that didn&#x27;t depend on the (formerly unproven) RH.<p>Example: Deterministic
    primality testing. Miller&#x27;s test gave us an ln(n)^4 algorithm for deterministic
    primality testing decades ago [1]. But it depended on RH. The later AKS work found
    a way to avoid the RH dependency, giving an ln(n)^6 deterministic algorithm, and
    was the first to show that PRIMES \in P. [2]<p>With RH having been proven, Miller&#x27;s
    test is back to being the fastest deterministic test. (ECPP is faster in practice
    for large primes but its running time isn&#x27;t fully known.) This isn&#x27;t
    a terribly practical result because the range of primes for which you&#x27;d use
    miller is a bit narrow, but it&#x27;s quite cool to me to have the theoretical
    best also be something you can implement -- AKS is impractical and its contribution
    was showing you could solve the problem in polynomial time without depending on
