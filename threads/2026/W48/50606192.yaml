  author: switz
  text: 'A friend and I have run <a href="https:&#x2F;&#x2F;relisten.net" rel="nofollow">https:&#x2F;&#x2F;relisten.net</a>
    for ~13 years as a frontend to Archive&#x27;s Live Music Archive (among other
    sources). We take great care to respect all parties involved and operate it completely
    non-commercially as FOSS.<p>Archive in general is very friendly to this sort of
    thing. Perhaps they feel differently about video, but they are very encouraging
    - assuming you act responsibly (self-identifying scraping, respecting rate limits,
    respecting licensing, and so on).<p>There&#x27;s an old thread from 2009[0] that
    endorses this. Of course, please be respectful of the media and the network so
    that we may all continue to build wonderful experiences on top of Archive.<p>Archive
    walks the walk: they believe in their mission deeply and back it up (no pun intended).<p>[0]
