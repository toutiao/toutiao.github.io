  author: asdff
  text: 'That&#x27;s basically a skateboard as long as you don&#x27;t go bombing down
    hills out of control. Learning curve might be tough if you didn&#x27;t do it as
    a kid however. But if you did, you&#x27;ve unlocked a pretty useful ability that
    meets all these things. Skate parts are cheap, even going name brand, but a blank
    deck is the same plywood as any. You can walk into any skateshop across town and
    get standardized replacement parts. You can get some of the best equipment on
    the market and only be out like $100-150 or so, for the complete build.<p>Back
    to failure mode, if you aren&#x27;t going at very out of control speeds it&#x27;s
    no worry with big and soft longboard style wheels (vs harder skate wheels meant
    for tricks vs cruising). About as much as you&#x27;d do to yourself on a bike
    going reasonable speeds: maybe scrape up the palms catching yourself or twist
    an ankle or wrist if you really catch it awkwardly. Can&#x27;t really have a non
    zero risk when walking itself is non zero risk of falling related injury or death.<p>Escooters
    are also pretty great. xaomi mi platform is pretty standardized, only a couple
    hundred or so as well. Lot of handwringing about them in the press, but if you
    don&#x27;t plan to drive drunk with your buddy on your back you should be alright.'
