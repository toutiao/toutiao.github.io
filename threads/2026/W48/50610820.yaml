  author: hinkley
  text: The old farts I learned bicycle mechanics from waxed poetic about the Italians’
    skill at braising, which is pretty much how frames were made until the late 80’s
    when for instance Cannondale TIG welded aluminum and Trek used epoxy on hybrid
    carbon fiber bicycles (and resulted in a recall due, IIRC, to coefficient of thermal
    expansion issues resulting in cracked tubing).<p>The thing is (was?) that the
    tubing most desirable for bicycles like Reynolds  531 doesn’t like the torch that
    much, doubly so for double butted tubing (thin in the middle where the water bottle
    and cabling fixtures need to be) which IIRC the Italians also did first. Any plumber
    could braise a low end steel bike, the good stuff took extra skill.<p>What’s noteworthy
    to me about this bike is how many tubes it has to get the job done.
  score: 0
