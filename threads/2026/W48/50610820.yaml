  text: It takes some learning curve, but a skateboard is actually a really good way
    to get around an urban area. Biggest pluses are you can tuck it away anywhere,
    but unlike a folding bike, you can use it instantly. You end up saving time in
    all sorts of places that would be inappropriate with other vehicles, thanks to
    the speed differential being closer to a couple mile an hour walking than most
    other micro mobility that&#x27;s closer to a 25mph car. Biking down the mezzanine
    to the train platform is a little egregious, but pushing a skateboard out of anyone&#x27;s
    way is perfectly reasonable, and might save you quite a lot of time to make that
    train connection. Any clear patch of 25 feet in front of you, you might as well
    skate it in a half second.
