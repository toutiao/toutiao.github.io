  author: Theodores
  text: Each to their own, however, there is the matter of &#x27;use case&#x27;. I
    worked in a bicycle shop where we had skateboards as a sideline, my product knowledge
    was not there for them, I expected the customer to know what they needed (and
    for their mother to pay).<p>My knowledge was in the folding bicycles, and a surprising
    amount of knowledge was needed to guide customers through to a sale. We had all
    the UK brands, including Brompton, Dahon, Airnimal and Montague. My goal was to
    take their money, so I was never going to talk them out of the over-hyped Brompton
    to sell them the far superior Dahon. (Dahon have the more useful patents).<p>However,
    if I knew the customer was going to be on a packed commuter train, I would sell
    them the Dahon, since it doubles up as a seat, when folded down, which the Brompton
    doesn&#x27;t do.<p>Regarding the article, we had this brand called Airnimal that
    were designed to fold up into boxes that could go on a plane, so we sold Airnimal
    to those customers. Airnimal bicycles took a while to setup, whereas the Brompton
    or Dahon could be deployed as one leaves the train door, for the bicycle to be
    rideable on the platform.<p>There were also the folding bicycles with really small
    wheels. These would suit canal-boat people, or people with camper vans. These
    customers didn&#x27;t need much, but their requirements were carefully checked.<p>Part
    of the sale was demonstrating the fold. To the uninitiated this is a challenge,
    so it was crucial to be able to know what you were doing and just do the fold
    effortlessly, several times, and, the sale was pretty much over if you could get
    the customer to do the fold.<p>I appreciate your enthusiasm for the skateboard
    and I can see it making sense if living in an urban area with lots of stairs and
    a crime problem. However, the skateboard just doesn&#x27;t scale well.<p>I used
    to commute from Reading to London and then to north London, taking a folding bicycle
    on the big train and then a total of 22 - 25 miles under my own steam. I could
    have done that with public transport and a skateboard, to optimise the connections
    between trains, tubes (subway), bus and pedestrian areas, however, the time and
    expense would have not made my commute viable.<p>On the skateboard I am sure you
    have learned hacks to get across town, on a folding bicycle you find different
    hacks. For example, you might exit the station a back way, avoiding hordes of
    people and finding your way onto a network that is there for cycling.<p>There
    is also the matter of legal things, if you are riding a bicycle on the road then
    you have the rights and responsibilities of a vehicle, on a skateboard you are
    just a &#x27;jaywalker&#x27;, with important legal implications if you get involved
    in an incident.<p>Back to the shop, I just took money, as much as possible, with
    a view to having long-term customers that spread our reputation positively by
    word of mouth. There is only so far that a given customer can be rinsed, so the
    reality is that most of what goes out the door is upper-mid-range. It was important
    to sell them the right product, or solution, hence the folding bicycles, hybrid
    bicycles, e-bikes, fitness, and about a dozen MTB genres. On top of that we had
    the skateboard.<p>I can honestly say that, despite what you say with undoubted
    enthusiasm making perfect sense and known to me at the time, I never felt that
    I &#x27;should&#x27; have sold a given customer a skateboard instead of a folding
    (or other) bicycle. I would if I could, but I didn&#x27;t. When it came down to
    &#x27;specialist sales of mobility solutions&#x27;, there was always some obscure
    folding bicycle that just suited the customer better than a skateboard.
  score: 0
