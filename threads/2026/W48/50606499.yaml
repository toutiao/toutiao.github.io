  author: BLanen
  text: In my opinion, it does, but it needs more than that. But it already has a
    package manager(lake) and the main package all these mathematical proofs and definitions
    and such are contributed to is mathlib.<p>I would argue it needs something like
    content-addressed code&#x2F;&quot;packages&quot; like the newish programming language
    unison. But it also needs more than that even. I would argue that a (cubical)-HoTT
    language&#x2F;environment&#x2F;proof-assistant is probably better for the future
    of mathematical research because it does not have &quot;proof irrelevance&quot;
    and does not treat different proofs as equals because they often take different
    &quot;paths&quot; and those paths are often interesting and analysable in themselves.
    I also would argue that it needs to have a sort of decentralised way of certifying
    computations of proofs that goes beyond the ad-hoc way they are currently done
    in lean&#x2F;mathlib.<p>These are all not original points by me but have often
    been stated as a sort of criticism of lean&#x2F;math-lib(although I acknowledge
    them as a massively successful and admirable engineering feats) by other people
    way more knowledgable than me.
