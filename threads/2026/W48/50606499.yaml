  author: btown
  text: It makes me curious whether vendoring&#x2F;reimplementing dependencies is
    actually, in an odd way, optimal for these frontier proofs.<p>I&#x27;ve certainly
    seen that when doing normal coding, LLMs will often take documentation of used
    libraries at face value, and try to save context by not reading the underlying
    implementations into context. This is genuinely useful!<p>But for math, is there
    a use to a set of agents being forced to reimplement the entire stack of formalized
    dependencies? Each sub-effort would leave artifacts, and send messages to other
    sessions, on ways in which the underlying mechanics or subtleties might prove
    helpful to the broader effort. No need to fight terseness with system prompts,
    when a full survey of the broader field is impossible to avoid.
