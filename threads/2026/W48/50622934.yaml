  author: alexose
  text: 'I recently got a bee in my bonnet to &quot;fix&quot; my Fire TV, and I&#x27;m
    so glad I did.  It&#x27;s my dream setup now:  A single stock remote control that
    controls everything with Debian in the middle.<p>The trick was setting it automatically
