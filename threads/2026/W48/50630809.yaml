  author: LoganDark
  text: Proving a negative requires disproving the existence of a counterexample.
    Merely providing no counterexample is insufficient to prove the negative.<p>Some
    negative proofs are possible by contradiction. When people say you can&#x27;t
    prove a negative, it usually means that such a contradiction is impossible.<p>For
    example, to prove that a vulnerability has never been exploited, you must prove
    either that such exploitation was not possible, or that what exploitation <i>was</i>
    possible never actually occurred.<p>The latter requires accounting for <i>everywhere</i>
    exploitation could&#x27;ve occurred, which in turn needs you to prove the absence
    of factors you haven&#x27;t considered -- another negative.
  score: 0
