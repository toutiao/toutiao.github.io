  author: buu700
  text: 'Agreed, I&#x27;ve been saying essentially the same thing for years. GP pointed
    out that Coca-Cola <i>can&#x27;t</i> ban you from buying their product in practice,
    but I would argue that moreover they <i>shouldn&#x27;t</i> be able to ban you
    in principle even if they somehow could. Past a certain scale, or at least past
    a certain scale and longevity, goods and services become de facto public infrastructure
    and should be treated as such.<p>I&#x27;m all for freedoms of speech, association,
    and enterprise, but I also appreciate ideas like right to internet access &#x2F;
    freedom to connect[1], and in hindsight I would argue that freedom to connect
    is just a specific case of a more general principle of freedom to consume the
    same goods and services as the broader public.<p>It&#x27;s like, Mocha Joe banning
    you from his coffee shop is a minor nuisance, but finding out that you&#x27;re
    never allowed to enter any Starbucks in the world in perpetuity would be somewhat
    life-altering. An algorithm at Apple or Google deciding it doesn&#x27;t like the
    cut of your jib, much more so. Pissing off the wrong person with the right connections
    to get you banned from Verizon, AT&amp;T, and T-Mobile, potentially even more
    so.<p>These are disproportionate penalties that can be and are inflicted upon
    helpless citizens with no legal due process or practical recourse. The rights
    of massive corporations to operate their businesses without undue interference
    need to stop where my rights to live an ordinary productive life and exist in
    society begin.<p>It&#x27;s also important to distinguish between the letter and
    the spirit of existing constitutional rights. If a handful of companies can collude
    to ban you from social media or substantially restrict your access to the internet,
    and the government doesn&#x27;t lift a finger to stop it, that&#x27;s just infringement
    of your right to freedom of speech with extra steps. The fact that James Madison
    failed to predict the internet doesn&#x27;t make it okay for platforms like X
    and reddit to silence real humans without a court order, but without federal protection
    it&#x27;s going to keep happening because the incentives of advertising force
    it into a race to the bottom.<p>1: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Right_to_internet_access"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Right_to_internet_access</a>'
