  text: 'Sure, the basic gist is: agent looks at your repo and then identifies 5-8
    popular OSS projects with a similar stack and&#x2F;or problem set, and plentiful
    review history. It pulls the top human reviewers&#x27; comments. It then looks
    at the comment history and extracts a list of the sorts of things that reviewer
    is quick to flag, extracting them into a markdown profile for each reviewer.<p>After
    it has dozens of profiles, the checklists are clustered and deduped then merged
    into one document where each topic is a persona. So you end up with personas like
    &quot;the numerical stability auditor&quot; and &quot;concurrency safety spotter&quot;
    instead of named people, with checklists composed from a variety of folks that
    care about those topics.<p>Finally, when reviewing changes, the agent is asked
    to review from the perspective of each of the named personas, referencing their
    checklist.<p>I got laid off from the role where I first devised this system (because
    the company wanted more &quot;AI native&quot; engineers... ha!) , but I still
    use this approach on my personal projects because it is very effective.'
