  author: anigbrowl
  text: Of course they do; I&#x27;m saying they should be transparent with customers
    about why, and that ot&#x27;s bad to have &#x27;appeals processes&#x27; where
    customers spend time putting together and submitting appeals trying to explain
    why they don&#x27;t think something violates ToS only to have their appeal rejected
    within seconds.<p>This is a general problem in the tech industry. Anthropic accuses
    people of distilling in response to any attempt to figure out more efficient ways
    to work with their model; youtube accuses people of copyright strikes (often because
    of false claims of copyright ownership ont roll accounts); Apple rejects developers
