    India's opposition storms Meta's offices to get its Instagram accounts back\n\n/BY[VINCENT
    LAUTIER](https://korben.info/authors/vincent/)/2 MIN READ/Related categories\n\nLast
    Friday, activists from the Indian Youth Congress, the youth wing of India's main
    opposition party, forced their way into the building housing Meta's offices in
    Hyderabad, where they ended up clashing with police among overturned potted plants.\n\nThe
    scene repeated itself the same day in Mumbai, with anti-Meta slogans spray-painted
    on the building's walls and placards burned in front of the entrance, while in
    Gurugram, near New Delhi, banners demanded the return of the movement's accounts.\n\nMumbai
    police registered a complaint against four of the organization's leaders and detained
    several protesters.\n\nThis anger stems from the November 19 blocking of the Instagram
    accounts of the youth wing's president and of the party official who oversees
    it. The Congress accuses Meta of obeying orders from the BJP, Narendra Modi's
    Hindu nationalist party, and of restricting, along the way, thousands of accounts
    belonging to journalists, creators and influencers critical of those in power.\n\n![](/lopposition-indienne-prend-dassaut-les-bureaux-de-meta-pour-recuperer-ses-comptes-instagram/lopposition-indienne-prend-dassaut-les-bureaux-de-meta-pour-recuperer-ses-comptes-instagram-2.jpg)\n\nThe
    movement had warned on X that it would storm the company's offices across the
    country if the accounts weren't reinstated. Promise kept, then. And the method
    pays off, since two accounts were restored the day after the protests, according
    to the group's social media chief, who is now giving Meta seven days to lift all
    restrictions targeting opposition voices.\n\nMeta restricted more than 5.4 million
    posts or accounts in India in the first half of 2026, compared with around 70,000
    over the whole of 2025. The government, for its part, issued almost 200,000 blocking
    orders between March and July, and since February has required platforms to remove
    flagged content within three hours, compared with 36 previously.\n\nIndia is also
    Meta's biggest market by number of users, and this newfound docility looks an
    awful lot like an effort to protect its bread and butter.\n\nOn the BJP side,
    a spokesperson accuses the protesters of trashing the Hyderabad office and bragging
    about it on social media. Meta, meanwhile, still hasn't said anything, caught
    between a government that gives orders and an opposition that kicks down its doors.\n\nSource:
    [The Verge](https://www.theverge.com/tech/1039732/protesters-storm-meta-offices-in-india)\n\n[Add
    Korben to my  \npreferred sources](/o/google-source-article)\nReferences\nThis
