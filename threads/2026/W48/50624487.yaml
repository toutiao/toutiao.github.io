    to have the effect of words shifting to ambiguous meanings.<p>E.g. the arguments
    of the right regarding illegal aliens, asylum, economic migration and political
    migration are all very different in nature. But by pretending they&#x27;re the
    same concept, it was easy to make the opposition spend a lot of their debate efforts
    having to distinguish between them. Which, on top of that, is a whole skillset
    on its own, many people familiar with the arguments do not have acquired, completely
    derailing their argument.<p>IMO the solution is a strong non-bad-faith position
    on free speech (being censored by a non-government entity is often in no way less
    damaging than by the government itself, and in the past the government straight-up
    has laundered censorship through &quot;private&quot; entities. Same goes for platforming,
    if your speech is made to have a lot less reach than the opponent&#x27;s) and
    making bad-faith arguing tactics socially inacceptable again.
