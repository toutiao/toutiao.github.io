  author: zarzavat
  text: You have to distinguish between adding new mathematical concepts and adding
    new foundations.<p>Adding new concepts is essentially equivalent to adding new
    types to a software program.<p>Adding new foundations would generally be considered
    a defect in the context of proving a statement about numbers.<p>Mathematicians
    want the most powerful tools built on the simplest foundations. The more you extend
    the foundations the more likely it is to end up with a logical system that is
    inconsistent (i.e. useless).<p>Mathematicians have hit this wall over[0] and over[1]
    again and learned to be minimalist in their choice of foundations.<p>[0] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Russell%27s_paradox"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Russell%27s_paradox</a><p>[1]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;System_U#Girard&#x27;s_paradox"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;System_U#Girard&#x27;s_paradox</a>
