  author: gus_massa
  text: Assuming the proof is correct ...<p>The theorems in the proof follow an order,
    so each one ideally explains which of the previous theorems used. Humans are not
    so detallist, so most of the time it&#x27;s implicit, but it should be somewhat
    guessable.<p>If one theorem is mistranslated, there will be a gap in the proof.
    You can patch the hole temporally with &quot;sorry&quot; that is a cheat code
    in Lean to complete holes. So the main structure can be verified. Later the idea
    is to remove all the &quot;sorry&quot; and replace them with a short proof and
    then get a real proof of RH.<p>If one theorem is mistranslated, there will be
    a gap in the proof and the &quot;sorry&quot; will be impossible to remove. People
    will check again the theorems in the border of the gap and fix the translation.
    Or it may be a typo in the proof, it&#x27;s quite common to find typos even in
    published papers. So they will use the fixed theorem in Lean and make a fix in
    the English proof too.<p>Sometimes a step is not so obvious, and they will have
    to split it and&#x2F;or make a small addition in both the Lean and English version.
    If it&#x27;s short enough, it&#x27;s fine.<p>I&#x27;d not worry too much about
    mistranslations. The problem is if there is a gap that nobody know how to fix.
  score: 0
