  text: |-
    This is a political problem. The author basically admits as such on the first paragraph:

    The default was to be sloppy and poorly considered […]

    And it is still now. LLMs merely made it worse by giving a nuclear arsenal to the tactical tornadoes. Having technical solutions that reduce the initial cost of doing things right is great, but unless we can reduce it below the (initial!) cost of doing it wrong, we'll still have a problem.
    The root of the problem as far as I can tell, is a culture of externalising costs. Which is the corporate way of screwing over your neighbour, your country, the entire planet, just so you can fill your pockets a little more. If you engage in that behaviour, you're being bad, and you should feel bad. (I may forgive you if it's a matter of survival.)
    This work at several levels. At the lowest we have our tactical tornado, that moves fast and breaks things. One problem is they're often rewarded for that behaviour, because they appear to get things done, and management don't always see the workload of everyone else increasing in their wake. How do you distinguish a tactical tornado from a damn good dev, if you're not technically competent yourself? Colleagues complaining could be a hint, but that one too has it share of false positives.
    At the highest, there is a disconnect between what works, and what sells. Now people won't buy an obviously broken product (except in B2B, where the buyer and the end user typically aren't the same person), but sufficiently infrequent crashes, subtle enough corruption, or tolerable enough resource usage or lag may not affect sales at all. (This is different on sells tunnels, because any glitch on the sales tunnel itself will hurt the sales of the product.) Once the user bought (into) the product, it's a bit too late. But with enough users, the cost of just waiting a few seconds for the program to boot quickly adds up.
    I believe we should seriously consider regulation. It start with accountability. You sell something, you're responsible for it. If it's not fit for purpose, you reimburse your customers. Your software causes damages, you pay for it. (Of course, misusers gonna misuse, you probable shouldn't be responsible for that.) You chose a dependency and it breaks, you are responsible for it, and it's your job to sue whoever you got it from — or having arranged the appropriate contracts in advance. (And yes, that means tons and tons of paperwork for a "simple" Node package. I consider it a potential feature.)
    And finally, unreasonable resource usage should be cracked down upon somehow. Though for this one I'm not sure the regulation hammer is appropriate. What would be real nice would be to have the OS punish the resource hogs by default. This is already partially the case: I believe Linux's OOM killer for instance kills the programs that consume the most RAM first. But the same can be said for speed: programs that consume the most CPU should be given the lowest scheduling priorities (unless maybe it's a real-time interactive simulation running in the foreground, but those can be fairly well served with an easily accessible FPS counter or similar).
