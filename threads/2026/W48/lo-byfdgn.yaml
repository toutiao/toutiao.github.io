  text: |-
    +1 for Ada/SPARK
    Ada is a silent giant that has been running our nuclear plants, planes, jets and critical infrastructure for decades. It's not hyped and its proponents are usually not loud about it. Ada speaks for itself.
    Ada provides more guarantees than Rust, and often already at compile-time. Memory safety is just one element of formal verification, and Rust ends there and is mostly a normal systems programming language beyond that. While verus is available for Rust, it's just 'plugged in', whereas Ada has native support with contracts, etc. This is why I lament the strong push for rewriting things in  Rust, when we could rewrite in Ada/SPARK and dial up the formal verification
    It's also pretty clean; the consortium is not scared of deprecating stuff, unlike e.g. the mess we see with C++.
    And Ada is aimed towards maximum readability and encourages the programmer not to write convoluted 'smart' stuff, which is what I often miss with Rust where the opposite is often the case.
