article:
  url: https://jwheel.org/blog/2020/04/open-source-minecraft-bukkit-gpl/
  title: 'The day open source died: a story about Minecraft, Bukkit, and the GPL |
    Justin Wheeler'
  fetch_status: success
  content: "![The day open source died: a story about Minecraft, Bukkit, and the GPL](https://jwheel.org/blog/2020/04/open-source-minecraft-bukkit-gpl.png)\n\nOnce
    upon a time, when I was a teenager, I volunteered in the Minecraft open source
    community. I volunteered as a staff member of the largest open source Minecraft
    server today, called [Spigot](https://www.spigotmc.org/wiki/about-spigot/). Spigot
    is a fork of the Bukkit project.\n\nThis blog post is a story roughly covering
    2010 to 2014 on the meaning, values, and promise of open source. This story impacted
    a community of hundreds of thousands of people, mostly adolescent children, teenagers,
    and young adults. It is a tale about the simultaneous success and failure of the
    GNU Public License (GPL).\n\n## From the beginning: Bukkit, Minecraft, and the
    GPL&nbsp;[\U0001F517](#from-the-beginning-bukkit-minecraft-and-the-gpl)\n\nIn
    the beginning, in December 2010, there was **Bukkit**.\n\n![Bukkit Project logo](/blog/2020/03/bukkit-logo.png)\n\n>
    Bukkit is an up-and-coming Minecraft Server mod that will completely change how
    running and modifying a Minecraft server is done - making managing and creating
    servers easier and providing more flexibility. Learning from the mistakes made
    by other mods, Bukkit aims to be different and fill the void left by them: built
    from the ground up we’ve focused on performance, ease-of-use, extreme customisability
    and better communication between the Team and, you, our users. The overall design
    of Bukkit has been inspired by other mods and our experience as Minecraft players
    just like yourselves, giving us a unique perspective and advantage going into
    the creation of the Bukkit Project.\n> \n> [About Us](https://web.archive.org/web/20141211115250/https://bukkit.org/pages/about-us/),
    Bukkit.org\n\nBukkit was an open source server for Minecraft. It provided an API
    for developers to create plugins that extended Minecraft in unique and fun ways.
    While Bukkit was not the first open source Minecraft server, it was the first
    organized project. Bukkit launched with the GNU Public License (GPL) v3 license.\n\nFrom
    2011 to 2014, Bukkit was the de-facto standard for running a Minecraft multiplayer
    game server. Over time, more Bukkit servers (and derivatives) were used than the
    official server software distributed by Mojang. Mojang is the company responsible
    for Minecraft development.\n\n### Hard work on Bukkit recognized&nbsp;[\U0001F517](#hard-work-on-bukkit-recognized)\n\nThe
    project’s success was also recognized by Mojang too. At the first-ever Minecraft
    convention in 2011, MINECON, four Bukkit lead developers were hired by Mojang
    to work on Minecraft. All but one of the hired employees then departed from Bukkit.
    That one developer who remained active in Bukkit would depart from Mojang mysteriously
    in 2013.\n\n> Had a great time working for Mojang but it's time for me to pursue
    other interests. As of yesterday, I am no longer working for Mojang.\n> \n> —
    EvilSeph (@EvilSeph) [October 2, 2013](https://twitter.com/EvilSeph/status/385537792794959872?ref_src=twsrc%5Etfw)\n\nHowever,
    there was always one caveat. Bukkit was an open source project licensed under
    the GPLv3. However, it also reverse-engineered some parts of the Minecraft game
    code to build its server code and API. This was never a problem for Bukkit or
    Mojang:\n\n> “When we started up Bukkit in December of 2010, we decided we wanted
    to do things right. Right from the beginning we wanted to be sure we were bringing
    about a positive change to Minecraft, one that Mojang themselves would approve
    of. To that end, we set up a meeting with Mojang to get a feel for their opinions
    on our project and make sure we weren’t doing anything they didn’t like. The gist
    of the meeting was that Mojang “liked what we were doing” but not how we had to
    go about doing things. Unfortunately, we both knew that we had no alternatives,
    so we continued along - albeit now with the reassurance that our project would
    most likely not be shut down any time in the future.”\n> \n> EvilSeph (Warren
    Loo), “[Bukkit: The Next Chapter](https://web.archive.org/web/20150112163638/https://bukkit.org/threads/bukkit-the-next-chapter.62489/)”\n\nNobody
    ever raised a copyright issue over the reverse-engineered code from Minecraft
    in Bukkit. Yet, for years, the GPL code released by Bukkit included bits from
    official Minecraft code.\n\n## Act 1: The Minecraft EULA&nbsp;[\U0001F517](#act-1-the-minecraft-eula)\n\n_An
    alternative perspective on the Minecraft EULA is in this Guardian article. “[Minecraft:
    how a change to the rules is tearing the community apart.](https://www.theguardian.com/technology/2014/jun/24/minecraft-how-a-change-to-the-rules-is-tearing-the-community-apart)”_\n\n*
    * *\n\nAll was fine for a number of years. Bukkit was a volunteer-led project
    even after some of its core developers were hired to work at Mojang. However,
    in 2014, unrelated tension started to grow in the Minecraft community.\n\nThe
    tension was about the language used in Minecraft’s End User License Agreement
    (EULA). The EULA used ambiguous language over the monetization of Minecraft multiplayer
    servers:\n\n> “The one major rule is that you must not distribute anything we‘ve
    made. By “distribute anything we‘ve made” what we mean is “give copies of the
    game away, make commercial use of, try to make money from, or let other people
    get access to our game and its parts in a way that is unfair or unreasonable”.\"\n>
    \n> 2014: [account.mojang.com/documents/minecraft\\_eula](https://web.archive.org/web/20140706191831/https://account.mojang.com/documents/minecraft_eula)\n\nWhile
    many open source projects flourished around Minecraft, a huge game server industry
    also co-existed in this ecosystem. Multiplayer server owners running Bukkit (or
    derivative projects, like Spigot) created web stores for their servers. Players
    paid real money to buy in-game perks for a specific multiplayer server. Using
    open source plugins, players paid for things like item packages with diamond swords
    or virtual currency to spend in-game.\n\nThis behavior was allowed to flourish
    for years. However, the EULA was discreetly edited in December 2013. In mid-2014,
    someone in the community noticed the changed language. They tweeted and tagged
    a Mojang employee asking if this meant multiplayer servers had to stop selling
    in-game items for real money. In as much detail that a 2014 tweet with a 140-character
    limit allowed, the Mojang employee confirmed the EULA language did technically
    forbid that.\n\n### Panic! In The Bukkit Server&nbsp;[\U0001F517](#panic-in-the-bukkit-server)\n\n“_Then,
    everything changed when the Fire Nation attacked._”\n\nThe community erupted into
    chaos. Suddenly, a community that had mostly co-existed peacefully was at a virtual
    war with each other. The situation was understandable from both ends, if for different
    reasons.\n\nAnyone could start their own multiplayer server. So it was possible
    for malicious servers to scam players (usually young children) of money. Usually
    this happened by failing to deliver on the purchases or closing down after a period.
    Frequently, Mojang was contacted for help (usually by angry parents) about game
    servers Mojang did not control.\n\nAt the same time, many good people built (probably
    unwise) business models around the permissive nature of Minecraft intellectual
    property. The open source software made it easy to extend Minecraft in ways Mojang
    did not intend.\n\n## Act 2: The Bukkit cards are revealed&nbsp;[\U0001F517](#act-2-the-bukkit-cards-are-revealed)\n\nTension
    was already high between the the trinity of business owners, open source developers,
    and Mojang. By 2014, Mojang was a multi-million dollar company (even before their
    multi-billion Microsoft buyout). The EULA tension placed a heavy burden on the
    open source developers, who received pressure from both ends.\n\nThen, the unexpected
    happened on August 21st, 2014. The Bukkit project lead, Warren Loo (EvilSeph),
    announced the end of development on the Bukkit project:\n\n> .[@CraftBukkit](https://twitter.com/CraftBukkit?ref_src=twsrc%5Etfw):"
