    I've not been actively interested in Minecraft since around 2014, so I'm looking at this from a perspective of utter ignorance and with no horses in any race, but:

    The only conclusion I can muster on this saga is from that same Reddit thread: “But at the end of the day, don’t just believe one side is “good” and the other “bad” here. These things are rarely so simple.”

    Based on just what's in this post, this feels like a bizarre conclusion to draw. In the sense of where exactly is the moral grayness coming from?
    From what perspective is Mojang the "good" side here? Was the dev "bad" for pulling the plug after being tricked? Is the idea, that they thus deprived the community that previously freely benefited (and even profiteered) off said project? In my mind (and, again, just based on what's here), that's called "tough fucking luck."
    After Mojang decided to bring down the legal stick in the form of the EULA and the backroom deal instead of trying some sort of carrot, the dev using what little legal leverage they had to correct a great injustice is only fair. For which this same exact same community (who should've stood behind them and who would've possibly been able to make Mojang retreat to save PR) gave them nothing but grief in return.
