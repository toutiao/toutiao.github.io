  author: rvz
  text: 'There is <i>zero</i> conflation. WASM <i>does not</i> isolate what you think
    it isolates as long as the application is running in a memory corruptible engine.
    Compiling something from C to WASM <i>does not get rid</i> of those C-style vulnerabilities
    in the guest (which is what attackers use to escape isolation in the first place).
    That is the main point.<p>In fact, you are believing that WASM solves all our
    isolation problems if something like Linux as the guest application (written in
    C) is running in the browser, when that is a further from the truth.<p>Put it
    another way: May people thought &quot;microVMs&quot; were &quot;safe&quot; until
    AI agents found both types of bugs <i>in Linux</i> (key point here) to escape
    KVM&#x27;s &quot;hardware isolation&quot; that microVMs use.<p>It is even worse.
    WASM runs the <i>entire</i> application all in a single piece of linear memory
    and it doesn&#x27;t even have basic protections (ASLR) to make it difficult for
    attackers to escape. Just because it runs in WASM, does not mean that the protections
    are guaranteed for all code, especially converted C&#x2F;C++ code.<p>We are now
    in an era where AI agents are tearing apart C&#x2F;C++ based code every day and
    there are no limits. Therefore that risk is not removed and it still exists regardless.'
