  author: ssivark
  text: 'The best analogy to hold in mind is that the derivative is the generator
    of infinitesimal translations i.e. the operator that <i>moves the function over
    a bit</i>: given f(x) and the derivative tells you f(x+dx).<p>In the context of
    strings, moving by dx is like a discrete shift -- knocking off a piece of the
    string and continuing to match the regex against what&#x27;s left (if the match
    still survives).<p>The non-trivial nature of this comes when the template R is
    not just a simple string, but a more complicated program with branches (in a DSL
    corresponding to an algebra), and the idea is that the Leibniz rule of calculus
    derivatives correctly models how the matching decisions ought to be recursively
    delegated to simpler templates. This feels natural if we think of a string &#x2F;
    template as concatenating operators and then apply the product rule of derivatives.'
