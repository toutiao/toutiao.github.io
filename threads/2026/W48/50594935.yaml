    ) which generalizes the derivatives in differential calculus you are familiar
    with to other more exotic objects. For example, this allows defining derivatives
    on combinatorial species.<p>The Brzozowski derivative is not strictly one of these<i>,
    due to its odd product rule expression for concatenation. <a href="https:&#x2F;&#x2F;math.stackexchange.com&#x2F;questions&#x2F;5024248&#x2F;are-brzozowski-derivatives-really-derivatives"
