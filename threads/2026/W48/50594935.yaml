  author: yorwba
  text: It is analogous to regular calculus in some ways but not others. For example,
    the derivative of <i>xyz</i> with respect to <i>x</i> is <i>yz</i> in either case.
    The derivative of <i>yz</i> with respect to <i>x</i> is 0 or the empty set, respectively.
    But the analogy stops working when you have the symbol appear somewhere other
    than the beginning, because multiplication of numbers is order-independent and
    string concatenation is not.
