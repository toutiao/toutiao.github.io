  text: Interesting how no one has pointed this is a lot like zippers from functional
    programming, which themselves are derivatives of algebraic data types.<p>&quot;The
    derivative of a (regular) type is its type of one-hole context (McBride).&quot;
    Yup. Grab any data structure, make a hole; that new type is its derivative.<p>Yes.
