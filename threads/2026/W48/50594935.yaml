  author: ky3
  text: 'You could search for &quot;brzozowski left inverse&quot; as those links might
    contain better explanations for you.<p>The gist of the adjunction &lt; R, aS &gt;
    = &lt; a\R, S &gt;, where R is a regex and S is a string, is that: R matches aS
    (that is, the string S but prepended with &#x27;a&#x27;) iff the left inverse
    of R wrt &#x27;a&#x27;, matches S.<p>The left inverse here is the <i>unconcatenation</i>
    of R on the left with &#x27;a&#x27;.<p>(Recall that the algebra of regexes builds
    them up from unions, concatenations, and kleene stars on top of constants: the
    empty set, the null string, and the alphabets of your language. The novelty is
    that you can invert concatenation—on both ends!)'
