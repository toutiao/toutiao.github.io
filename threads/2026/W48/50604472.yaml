  text: I frequently go to pub quizzes, and there&#x27;a this shared opinion that
    its mostly useless trivia there. But the underappreciated fact I think most miss
    is that pub quiz trivia sets you up well for understanding wider historical context.
    Knowing random facts about countries and capitals and some of the better known
    events or works of art is not just a party trick, it can help you explain other
    future events. It&#x27;s like a web of facts that go together
