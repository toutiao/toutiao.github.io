  author: vunderba
  text: 'I often compare trivia and even factoids to a well-stocked larder. The more
    ingredients you have, the more potential recipes you can devise.<p>Ken Jennings
    also made a great point in one of his books: one of the most undervalued things
    about trivia and knowing <i>&quot;a little about a lot&quot;</i> is that it enables
    you to engage with people about their hobbies and interests at a more meaningful
    level.<p>For example, if somebody tells me that they enjoy juggling, asking if
    they&#x27;ve mastered mills mess or the box pattern is likely to engender far
    more engaging conversation than the rather pedestrian <i>&quot;gee golly mr wizard
    that&#x27;s nifty keen. How many objects can you juggle at once?&quot;</i>'
