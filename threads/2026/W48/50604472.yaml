  author: alexpotato
  text: A couple points:<p>1. Random knowledge can often be used to build a &quot;map&quot;
    to conclusions that turn out to be useful<p>e.g. someone once asked me what what
    country was number 2 in terms of total airplane flights (the US is number 1).<p>I
    deduced:<p>- had to be a big country<p>- with spread out cities<p>- and required
    flying instead of driving<p>I remembered reading that Brazil has traffic that
    is so bad and such poor security that people commute to work via helicopter. Even
    though I wasn&#x27;t sure it was Brazil, I could guesstimate that it was indeed
    Brazil.<p>2. Random facts are great for creating shared references or metaphors
    across cultural or organizational boundaries.<p>e.g. I worked with many people
    from India over the years and being able to quote a famous Bollywood movie or
    Indian mythology was excellent at helping build rapport etc<p>3. I was watching
    a documentary on an Army jungle survival school. The instructor mentioned:<p>&quot;People
    ask me if they should read survival guides or biographies of people who survived
    a calamity. I 100% say yes b&#x2F;c the after action reports of people surviving
    are filled with stories of &#x27;then I remembered this random fact from years
    ago that helped me survive&#x27;.&quot;
