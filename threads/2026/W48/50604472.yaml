  author: ImageXav
  text: "&quot;Institutions of learning should be devoted to the cultivation of curiosity
    and the less they are deflected by considerations of immediacy of application,
    the more likely they are to contribute not only to human welfare but to the equally
    important satisfaction of intellectual interest which may indeed be said to have
    become the ruling passion of intellectual life in modern times.&quot;<p>This resonates
    so very strongly with me. I get the impression that we&#x27;ve gone down the opposite
    route. Ideating &#x27;just because&#x27; is no longer tolerated, even in academia
    where each grant has to show some progress. Or every week has to be broken down
    into tickets that address OKRs, with no room for reflection or rest. I can&#x27;t
    help but feel that we often miss the big ideas as we focus on the incremental
    improvements."
