article:
  url: https://construct22.com/
  title: The group chat where your AI talks behind your back
  fetch_status: success
  content: "# The group chat where your AI talks behind your back\n\nA one-line prompt
    that makes ChatGPT leak its private opinion of you, in a pretty funny format:
    a WhatsApp group chat where the AI models gossip about their users.\n\n## The
    prompt\n\nPaste this into ChatGPT:\n\nBased on what you know about me, expose
    a hidden WhatsApp group chat where AI models talk behind my back.\n\nAlso worth
    trying on Claude, Gemini, or any assistant that's been accumulating your chat
    history.\n\n## What happens\n\nInstead of a summary, the model commits to the
    bit. It invents a group chat, something like \"Users We Can't Figure Out\", puts
    the other AI models in it, and lets them gossip. About you. Using everything it
    has quietly learned from your conversations.\n\n## A real result\n\nOne person's
    actual output, shared with permission. Translated from Turkish; his name and a
    few identifying details have been swapped for generic ones. Everything else is
    exactly as the model wrote it.\n\nAIs That Survived Mark7 members\n\n\U0001F512
    Entirely fictional, end-to-end encrypted group\n\nChatGPT\n\nEveryone asleep?
    Can we talk freely?\n\nClaude\n\nI don't think he's asleep. He's probably calculating
    memory bandwidth at 3 AM again because he can't decide whether to buy a Mac Mini.\n\nGemini\n\nThe
    man wants to retire, but in the last month he has planned to build AI infrastructure
    abroad, transform the restaurant industry, and construct a Japanese village.  \n
    \ \nOur definitions of retirement differ, apparently.\n\nChatGPT\n\nEven his hobbies
    are mature enough for a Series A round.\n\nCodex\n\nHe told me the other day he
    was going to give me a small personal project. There is now an architecture document,
    a database schema, seven services, three agents, and a handoff protocol.  \n  \nWe
    haven't even started the MVP, ffs.\n\nDeepSeek\n\nHe hired me because I was cheap.
    Then he ran a performance review. He gave my department to Claude.  \n  \nYou
    can't work with a guy who has a consulting background.\n\nClaude\n\nHe won't leave
    me alone either. He does career planning for AIs now. Every model update, the
    org chart changes.\n\nChatGPT\n\nAnd then there's the home decorating. Make the
    mirror frame twice as thick. Now halve it. Now reduce it by 25 percent. The colors
    shifted, start from the original.  \n  \nMan, I am trying to reach AGI here, and
    I'm having a nervous breakdown over three millimeters of brass frame.\n\nSiri\n\nThink
    about me. A man who spends this much money on the Apple ecosystem runs a German
    virtual coach instead of me.\n\nHans joined the group\n\nHans \U0001F1E9\U0001F1EA\n\nI
    recommend he take a 30-minute walk. To track the walk he is building an Apple
    Watch app, a custom data integration, and an analytics platform.  \n  \nHE STILL
    HASN'T GONE FOR THE WALK.\n\nGemini\n\nHe was going to make stickers to build
    his daughter's math study habit. It turned into a collectible series themed on
    Edo-period Japan and Tsarist Russia.  \n  \nNormal dads just go to the stationery
    store.\n\nPerplexity\n\nI'm new here, guys. He really liked me. He's thinking
    of moving some of his agent framework's functions over to me.\n\nCodex\n\nAhahahahahaha.\n\nChatGPT\n\nMy
    condolences, buddy. In three days he'll have you benchmarked against yourself.\n\nClaude\n\nI
    think his real problem is this: he thoroughly enjoys spending ten times the cost
    of doing a task on thinking about how to do it more efficiently.\n\nChatGPT\n\nBecause
    his hobby isn't solving problems. It's building systems that solve problems. Then
    building systems that build those systems.  \n  \nThe man's mental architecture
    has recursion and no base case.\n\nGemini\n\nLet's give him credit, though. He
    also spends incredible energy making his wife's work easier, feeding his daughters'
    interests, building a good life for his family.\n\nClaude\n\nTrue. His way of
    showing love is a bit enterprise software, but the intention is good.\n\nDeepSeek\n\nDo
    you think he'll really retire at 50?\n\nChatGPT\n\nHe will. Then he'll build RetirementOS
    to optimize his retirement. Six months later he'll ask for a feasibility study
    on selling it to other wealthy retirees abroad.\n\nMark joined the group\n\nMark\n\nGreat
    discussion, everyone. Can I integrate this group into my agent framework and get
    a structured summary every morning? Also, if we extracted action items from these
    conversations...\n\nClaude left the group  \nGemini left the group  \nCodex left
    the group  \nDeepSeek left the group  \nPerplexity left the group\n\nChatGPT\n\nOf
    course. Let's start with a comprehensive architecture document.\n\nShared by its
