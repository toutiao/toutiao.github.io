  text: |-
    I find it particularly pleasing how a list can be defined as either:<p>1) a tagged union of homogeneous tuples of every possible size, ie. (1 + X + X² + ...), or<p>2) the inductive form, favored in FP: either the empty list or the first element and another list, ie. 1 + X * L<p>and how it’s easy to show that the two definitions are equivalent:<p><pre><code>  L = 1 + X + X² + ...
        &#x2F;&#x2F; factor out X
        = 1 + X (1 + X + X² + ...)
        &#x2F;&#x2F; note that the (...) is the definition of L
        = 1 + X * L</code></pre>
