  text: Indeed! L is the least fixed point of `F(L) = 1 + X × L`. You get to the series
    by applying F repeatedly starting from the empty type:<p>F(0) = 1<p>F^2(0) = 1
    + X<p>F^3(0) = 1 + X + X^2
