  author: rramadass
  text: I think Dependent Types are easier to understand following Curry-Howard Correspondence
    (<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Curry%E2%80%93Howard_correspondence"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Curry%E2%80%93Howard_correspon...</a>)
    where the mapping to Logic is clearly spelled out.<p>1) Propositional Logic =
    Simple Types<p>2) Predicate Logic = Dependent Types (<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Dependent_type"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Dependent_type</a>)
    where;<p>2.1) Existential Quantification = Σ-types (aka Dependent Sum&#x2F;Pair)
    - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Dependent_type#%CE%A3_type"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Dependent_type#%CE%A3_type</a><p>2.2)
    Universal Quantification = Π-types (aka Dependent Product&#x2F;Function) - <a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Dependent_type#%CE%A0_type"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Dependent_type#%CE%A0_type</a><p>Note
    that in order to understand the above you need to grasp &quot;Type of Types&quot;
    i.e. Sorts.<p>The whole Typed Lambda Calculus to Calculus of Constructions (based
    on dependent types) is very nicely and succinctly explained by Helmut Brandl in
    his 100-page booklet <i>Typed Lambda Calculus &#x2F; Calculus of Constructions</i>
    - <a href="https:&#x2F;&#x2F;hbr.github.io&#x2F;Lambda-Calculus&#x2F;index.html"
    rel="nofollow">https:&#x2F;&#x2F;hbr.github.io&#x2F;Lambda-Calculus&#x2F;index.html</a>
