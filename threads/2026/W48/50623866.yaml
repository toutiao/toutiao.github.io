  author: mananaysiempre
  text: Yeah not those, those are legacy, we don’t speak about them :) The “natural”
    here is that of “natural isomorphism” and more generally the category-theoretic
    “natural transformation”, which is the one that is virtually always meant when
    people that the two things are “naturally” identified and the like.<p>That’s what
    they mean for example when they say that a finite-dimensional vector space is
    naturally isomorphic to its double dual, but while it’s also isomorphic to its
    ordinary dual, it’s not naturally so. Of course, in an introductory course they’ll
    just say the latter is dependent on an arbitrary choice of basis; but personally
    I find it quite beautiful that the notion “independent of arbitrary choices” is
    even formalizable, let alone in such generality as to span from vector spaces
    to programming languages.
