  text: You’re only right for lazy pairs, I think.<p>In a strict language (or with
    a strict pair in a lazy language), you normally won’t be able to (integer) divide
    by zero while computing a value, then go on to ignore that, pack that erroneous
    value into a pair, and extract the other, valid value from it and go on with your
    life.<p>Similarly, if your program has hung while computing one half of a pair
    then (except in lazy languages) it will have hung while computing the pair as
    a whole as well.<p>(Haskell’s type algebra is indeed somewhat subtler.)
