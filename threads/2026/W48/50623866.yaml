  author: mananaysiempre
  text: 'A couple of notes:<p>- There’s also the notation 0 for the empty (never,
    noreturn) type. In addition to matching the number of members, the notations 0
    and 1 make sense also as units (neutral elements) of addition and multiplication
    respectively: 0 + A ≅ A + 0 ≅ A, 1 × A ≅ A × 1 ≅ A in a natural way[1]; and also
    0 × A ≅ A × 0 ≅ 0.<p>- That a constant dependent sum is a product, and a constant
    dependent product is an exponential, is (undeniably confusing at first but) just[2]
    the naïve schoolbook definition that A × B = B added to itself A times and A^B
    = A multiplied by itself B times.<p>- That a constant dependent product is a function
    type is just the naïve definition that a function is a table of its values at
    each input (a tuple, with elements numbered by the possible inputs). A dependent
    function ( = dependent product), then, is the same thing but the allowable values
    in each cell of the table vary depending on the cell.<p>- That the function type
    is the exponential type is also part of common set-theory notation. For instance,
    2^ℕ is a not-infrequent name for the set in the Cantor theorem (subsets of the
    naturals).<p>[1] As in, those are not <i>literally</i> the same type but are one-to-one
    in a single natural way. The word “natural” here has a surprisingly deep technical
    meaning but one that corresponds to the colloquial pretty well.<p>[2] “Just”,
    “simply”, etc. are as usual terms of art that mean that the statement feels very
    simple <i>once you get it</i>, and conversely that if it does not feel simple
    then you haven’t gotten it and should stop and think until it does. That thinking
    can take substantial time and effort.'
