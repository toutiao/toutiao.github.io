  author: devin
  text: 'I&#x27;m kind of iffy on `(get &quot;abc&quot; 1.9)`. I feel like Clojure
    has always kind of went out of its way to not go to Ruby levels of implicit dynamism.
    Think things like: &quot;5&quot; * 3 =&gt; &quot;555&quot;. Explicit &gt; implicit
    has been a guiding principle in Clojure since the beginning. For that reason I
    think the behavior is... a little surprising, but also tend to agree I would stop
    short of calling it a &quot;bug&quot; in any meaningful sense of the word. I&#x27;m
    curious to see what the core maintainers decide to do about it, if anything. If
    I were a betting man I&#x27;d guess it will stay this way forever because existing
    programs may quietly (or not-so-quietly) rely on the current behavior.<p>Hyrum&#x27;s
    law, anyone?<p>&gt; With a sufficient number of users of an API, it does not matter
    what you promise in the contract: all observable behaviors of your system will
    be depended on by somebody.'
