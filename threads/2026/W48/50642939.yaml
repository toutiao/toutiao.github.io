  text: To clarify, by &quot;type mismatch&quot;, I meant checking if an int value
    occurs in a byte array (and, hence, in the wrapping sequence).  Of course, appropriate
    type coercion would prevent such a mismatch.<p>The disagreement between `.indexOf`
