  text: As different tools (e.g., SPIN, Z3) have been used as &quot;checking engines&quot;
    to realize verification solutions, I think trying to use Lean as a checking engine
    is understandable; more so, if Lean provides additional benefits (e.g., richer
    library, higher level of abstractions, performant checking) over other tools that
    help reduce modeling tedium, improve model fidelity, or speed up checking.<p>That
    said, I think the issue of model fidelity and spec&#x2F;property correctness will
    still exist in a reduced form.  Also, simpler solutions&#x2F;tools may be better
    suited for certain classes of properties.<p>As for how this exercise worked, my
    guess is that the agent models both the SUT and the environment, encodes the property
    based on property templates, and checks the model for bugs (w&#x2F; counterexample)
    or correctness proof using a set of tactics; see <a href="https:&#x2F;&#x2F;github.com&#x2F;hirosassa&#x2F;lean-verify&#x2F;blob&#x2F;main&#x2F;skills&#x2F;lean-verify&#x2F;SKILL.md"
