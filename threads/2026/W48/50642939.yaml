    invokes `ArraySeq_byte.indexOf` while `.contains` invokes `ASeq.contains`.  Interestingly,
    `ASeq.contains` and `ASeq.indexOf` have similar behavior while `ArraySeq_byte.indexOf`
    and `ASeq.contains` different behavior.
