    of noticing virtually any bug in theory, but in practice no one is actually able
    to catch all of them up front. Having a type system is useful because it genuinely
    does a better job than humans at spotting bugs like this. If you&#x27;re using
    a dynamically typed language, there <i>will</i> be errors that human eyeballs
    could notice but didn&#x27;t."
