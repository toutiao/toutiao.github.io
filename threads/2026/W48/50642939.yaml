  author: rvprasad
  text: While the effort is interesting, I found two issues in the list.<p>First,
    (.indexOf (seq (byte-array [1 2 3])) 2) fails because byte arrays store bytes
    and the argument 2 to `.indexOf` is a Long value.  Simple type checking (via eyeballing)
    could have flagged the incorrect usage.  I think such exercises can be more helpful
    if we can reduce the noise.<p>Second, (get &quot;abc&quot; 1.9) fails because
    `get` coerces the given key to integer in the context of string objects, which
    makes sense; specifically in the context of weakly typed language.  That said,
    I believe that detailed documentation of the behavior of `get` can help clients
    just as well as returning `nil` or not-found value.  However, we are still left
    with questions such as &quot;who and where do we draw the line about the dynamism
    of the language?&quot; and &quot;what is the agreed upon semantics that we are
    checking against?&quot;
