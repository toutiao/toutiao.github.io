article:
  url: https://s.conao3.com/blog/2026/e4f733
  title: I checked Clojure's core with Lean and differential testing and found unreported
    bugs in HAMT and vector-of - Conao3 Notes
  fetch_status: success
  content: "I read Koukyosyumei's article \"[著名なRust製OSSをLean 4で形式検証してみたら、めちゃめちゃバグが見つかった話](https://zenn.dev/koukyosyumei/articles/31c8fcf4da45b7)\"
    (in Japanese; the title means \"I formally verified well-known Rust OSS with Lean
    4 and found a lot of bugs\"). The author ported well-known Rust projects into
    a form they could prove in Lean 4, and where a proof failed, they found a bug
    in the original code.\n\nMany people have used Clojure's persistent data structures
    since around 1.0, so I expected no bugs to remain. Still, I wanted to see whether
    Lean would find something there too.\n\n[hirosassa/lean-verify](https://github.com/hirosassa/lean-verify)
    describes a procedure for modeling a small function in Lean 4 and checking it
    for all inputs, so I applied it to the part of Clojure's core written in Java.\n\nI
    modeled integer and bit arithmetic in Lean and searched for counterexamples. I
    checked the collections with differential testing against the `java.util` collections,
    and for Java interop I compared the same call with and without a type hint.\n\nI
    found 17 bugs that I could not find in Clojure's JIRA or on ask.clojure.org. They
    include `reduce` on `vector-of`, the hash collision node of the HAMT, and calls
    to functional interfaces without a type hint.\n\nThe HAMT itself showed no mismatch
    in 3 million operations of differential testing, and the vector tree showed none
    around its boundaries. The bugs sat in separate code outside the trees, and in
    places where two mechanisms meet, such as `=` and hashing.\n\nI used Clojure 1.12.7,
    released on 2026-11-18, and JDK 21. The links to the source point to the [clojure-1.12.7](https://github.com/clojure/clojure/tree/clojure-1.12.7)
    tag.\n\n## How I checked\n\nThe lean-verify procedure picks one function and models
    it as a Lean definition. You write a property that compares it with a naive specification
    computed at a wider width, and `bv_decide` searches for a counterexample.\n\nIf
    you model Java's `long` and `int` as `BitVec 64` and `BitVec 32`, the wraparound
    of addition and multiplication maps onto `BitVec` operations. So do the rounding
    of `/` toward zero and the sign of `%`.\n\nWhen Lean found a counterexample, I
    turned the value into a Clojure input and reproduced it in the original code.
    I then modeled the fixed code in Lean and proved the same property. Lean can only
    take small functions that reduce to integer and bit arithmetic, so I checked the
    large persistent data structures with differential testing.\n\nEach test applies
    the same random sequence of operations to `PersistentHashMap` and to `java.util.HashMap`
    and compares the results. For the HAMT, the keys mix partial collisions at each
    5-bit level with fully identical hashes, and I ran 1,500 operations for each of
    2,000 seeds.\n\nFor vectors, I compared against `ArrayList` around 32, 1056, 32800,
    and 1048608, where the tree gains a level. The operations were `conj`, `pop`,
    `assoc`, and their transient versions.\n\nI checked whether anyone had reported
    each bug before. I searched Clojure's JIRA through its REST API and ask.clojure.org
    through web search and the site's own search, and found no matching report.\n\n##
    reduce on vector-of never finishes\n\n`vector-of` is a vector that stores its
    values in primitive arrays. Clojure implements it in `gvec.clj`, written in Clojure
    and separate from `PersistentVector`. If you `drop` from one and then `reduce`
    it, the call never returns once the vector has 65505 or more elements.\n\n    (reduce
    + (drop 1 (into (vector-of :long) (range 65504))))\n    ;; => 2145354256\n    (reduce
    + (drop 1 (into (vector-of :long) (range 65505))))\n    ;; => never returns\n
    \   (reduce + (drop 1 (vec (range 65505))))\n    ;; => 2145419760\n\nThe cause
    is [line 79 of gvec.clj](https://github.com/clojure/clojure/blob/clojure-1.12.7/src/clj/clojure/gvec.clj#L79),
    where the seq's `reduce` computes the start of the next 32-element chunk.\n\n
    \   (recur result (bit-and 0xffe0 (+ aidx 32)))\n\nThe code uses `0xffe0` to clear
    the low 5 bits and round down to a multiple of 32, but the mask also clears bit
    16 and everything above it. With 65505 elements, the last chunk starts at index
    65504. After that chunk, the start of the next one should be 65536, but the mask
    turns it into 0, so `reduce` goes back to the start and reads the vector again
    and again.\n\n[![img](/img/e4f733-mask.svg)](/img/e4f733-mask.svg)\n\nThe `0xffe0`
    mask has stayed in place since the [2010 commit](https://github.com/clojure/clojure/commit/5b281880)
    that added `internal-reduce`. In Lean, I wrote the property that from a position
    `a` that is a multiple of 32, the next chunk starts at `a + 32`.\n\n    import
    Std.Tactic.BVDecide\n    \n    def stepImpl (a : BitVec 64) : BitVec 64 := 0xffe0
    &&& (a + 32)\n    def stepFix (a : BitVec 64) : BitVec 64 := (~~~0x1f) &&& (a
    + 32)\n    \n    theorem impl_ok (a : BitVec 64) (h32 : a &&& 0x1f = 0) (hlt :
    a < 0x7fffffe0) :\n        stepImpl a = a + 32 := by\n      unfold stepImpl; bv_decide\n
    \   theorem fix_ok (a : BitVec 64) (h32 : a &&& 0x1f = 0) (hlt : a < 0x7fffffe0)
    :\n        stepFix a = a + 32 := by\n      unfold stepFix; bv_decide\n\n`impl_ok`
    fails with the counterexample `a = 1073741792`, and `#eval stepImpl 65504` returns
    0 as well.`fix_ok` uses `(bit-not 0x1f)` as the mask, and its proof goes through
    under the assumption that `a` is a multiple of 32 below `0x7fffffe0`.\n\n## dissoc
    on a HAMT collision node hides another key\n\nClojure's hash-map is a HAMT: it
    splits the key's hash into 5-bit pieces and uses them to walk down the tree. Keys
    whose 32-bit hashes are identical share a `HashCollisionNode` at the bottom of
    the tree, and the node finds a key among them with `=`.\n\n[HashCollisionNode.without](https://github.com/clojure/clojure/blob/clojure-1.12.7/src/jvm/clojure/lang/PersistentHashMap.java#L964-L971)
    builds the new node with one key removed. It should give the new node its own
    hash, `this.hash`, but it passes the parameter `hash` instead.\n\n    return new
    HashCollisionNode(null, hash, count - 1, removePair(array, idx/2));\n\nThe parameter
    `hash` is the hash of the key you pass to `dissoc`. If you `dissoc` with a key
    that is `=` to the stored key but has a different hash, the node records the wrong
    hash.\n\nIn Clojure, a vector is `=` to a Java `ArrayList` with the same elements,
    but the two hash differently.[CLJ-1372](https://clojure.atlassian.net/browse/CLJ-1372)
    tracks this mismatch.\n\nIn the example below, I chose `a` and `b` so that both
    `ArrayList` keys hash to 1003.\n\n    (def a (java.util.ArrayList. [0 42]))\n
    \   (def b (java.util.ArrayList. [1 11]))\n    [(hash a) (hash b) (hash [0 42])
    (= a [0 42])]\n    ;; => [1003 1003 1867155179 true]\n    \n    (def m3 (-> (hash-map
    a :A b :B)\n                (dissoc [0 42])\n                (assoc a :A2)))\n
    \   [m3 (count m3) (get m3 b)]\n    ;; => [{[1 11] :B, [0 42] :A2} 2 nil]\n\nWhen
    you print `m3`, you can see the key `b`, but `(get m3 b)` returns `nil`. After
    the `dissoc`, the node records 1867155179, the hash of `[0 42]`. The next `assoc`
    then concludes that `a`, with hash 1003, does not collide with the node, and splits
    the two into separate branches.\n\nA lookup of `b` follows the branch for 1003
    and finds only `a` there, so it never reaches `b`. In this example the collision
    node sits on the first level of the tree, so the key passed to `dissoc` needs
    the same low 5 bits as 1003, and 1867155179 has them.\n\n[![img](/img/e4f733-hamt.svg)](/img/e4f733-hamt.svg)\n\n`disj`
    on a hash-set has the same bug, while the path through the transient `dissoc!`
    does not.\n\nI changed that line in the 1.12.7 `PersistentHashMap.java` to `this.hash`
    and compiled it. With the patched class ahead of the jar on the classpath, the
    same example returned `:B` for `(get m3 b)`.\n\n## removeIf gives different results
    with and without a type hint\n\nSince Clojure 1.12, you can pass a Clojure function
    directly where a Java method takes a functional interface.[CLJ-2864](https://clojure.atlassian.net/browse/CLJ-2864)
    removed the logic that read the function's return value as a Clojure "
