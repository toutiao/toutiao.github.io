  author: weavejester
  text: Optimized Clojure is on par with Java in terms of performance, which isn&#x27;t
    <i>hugely</i> slower than C++. More idiomatic Clojure is less performant, but
    typically you&#x27;ll optimize the hot paths.<p>The main advantage Clojure has
    in LLM use is that it has a good REPL. LLMs are quite fast at writing code; the
    bottleneck is often the time it takes to compile and test that code, which is
    higher for most compiled languages than it is for an open REPL. A LLM writing
    Clojure typically has a faster iteration loop than one writing C++.<p>And while
    I have no hard evidence of this, I also wonder if Clojure&#x27;s general design
    philosophy of reducing complexity (i.e. interconnectivity) is also a benefit for
    LLMs. My experience is that LLMs tend to be more effective the more isolated and
    unconnected a piece of code is, which Clojure is specifically designed around.
  score: 0
