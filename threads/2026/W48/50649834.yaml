  content: "# UI style guides \n\nThis is a collection of preserved UI style guides
    a.k.a. interface guidelines from various companies, starting from the early 1980s
    and continuing to today.\n\n* * *\n\n- \n### Amiga \n\n(Commodore) [Amiga](https://en.wikipedia.org/wiki/Amiga)
    was a multimedia personal computer particularly popular in the 1980s and 1990s
    in Europe. Its GUI was called Workbench.\n\n- \nAmiga User Interface Style Guide\n\n![](images/ui-style-guides/amiga/cover.avif)\n\n![](images/ui-style-guides/amiga/2.avif)\n\n![](images/ui-style-guides/amiga/1.avif)\n\n![](images/ui-style-guides/amiga/3.avif)\n\n![](images/ui-style-guides/amiga/4.avif)\n\n
    \ - [1991 PDF](/ui-style-guides/Commodore%20Amiga/Amiga%20User%20Interface%20Style%20Guide%20(1991).pdf)\n
    \ - [1991 Internet Archive viewer](https://archive.org/details/amiga-user-interface-style-guide)\n\n-
    \n### Android \n\n[Android](https://en.wikipedia.org/wiki/Android_(operating_system))
    is a mobile operating system and a rival to iOS. The first style guide I could
    locate was in 2012.\n\n- \nAndroid Design\n\n![](images/ui-style-guides/android-2012/8.avif)\n\n![](images/ui-style-guides/android-2012/7.avif)\n\n![](images/ui-style-guides/android-2012/3.avif)\n\n![](images/ui-style-guides/android-2012/1.avif)\n\n![](images/ui-style-guides/android-2012/2.avif)\n\n![](images/ui-style-guides/android-2012/4.avif)\n\n![](images/ui-style-guides/android-2012/5.avif)\n\n![](images/ui-style-guides/android-2012/6.avif)\n\n
    \ - [2012 website mirror](/ui-style-guides/Android/Android%20Design%20(2012)/design/index.html)\n
    \ - [Wayback Machine archive](https://web.archive.org/web/20120501064425/http://developer.android.com/design/index.html)\n\n-
    \nMaterial Design v1\n\n![](images/ui-style-guides/android-2015/1.avif)\n\n![](images/ui-style-guides/android-2015/2.avif)\n\n![](images/ui-style-guides/android-2015/5.avif)\n\n![](images/ui-style-guides/android-2015/3.avif)\n\n![](images/ui-style-guides/android-2015/4.avif)\n\n![](images/ui-style-guides/android-2015/6.avif)\n\n
    \ - [2015 website mirror](/ui-style-guides/Android/Android%20Design%20(2015)/design/index.html)\n
    \ - [Wayback Machine archive](https://web.archive.org/web/20141125230413/http://developer.android.com/design/index.html)\n\n-
    \nMaterial Design v2\n\n![](images/ui-style-guides/android-2018/4.avif)\n\n![](images/ui-style-guides/android-2018/3.avif)\n\n![](images/ui-style-guides/android-2018/2.avif)\n\n![](images/ui-style-guides/android-2018/1.avif)\n\n![](images/ui-style-guides/android-2018/5.avif)\n\n![](images/ui-style-guides/android-2018/6.avif)\n\n
    \ - [2018 website mirror](/ui-style-guides/Android/Material%20Design%20(2018)/design/introduction.html)\n
    \ - [Wayback Machine archive](https://web.archive.org/web/20181031130219/https://material.io/design/introduction/)\n\n-
    \nDesign for Android\n\n![](images/ui-style-guides/modern/android.avif)\n\n  -
    [2026 current website](https://developer.android.com/design/ui)\n\n- \n### Black­Berry
    \n\n[BlackBerry](https://en.wikipedia.org/wiki/BlackBerry) was a beleagured maker
    of mobile handsets.\n\n- \nBlackBerry Wireless Handheld User Interface Style Guide\n\n![](images/ui-style-guides/blackberry-2003/1.avif)\n\n![](images/ui-style-guides/blackberry-2003/2.avif)\n\n![](images/ui-style-guides/blackberry-2003/4.avif)\n\n![](images/ui-style-guides/blackberry-2003/3.avif)\n\n![](images/ui-style-guides/blackberry-2003/5.avif)\n\n
    \ - [2003 PDF](/ui-style-guides/BlackBerry/BlackBerry%20Wireless%20Handheld%20User%20Interface%20Style%20Guide%20(1.0,%202003).pdf)\n
    \ - [2003 Internet Archive viewer](https://archive.org/details/manualzilla-id-7405374)\n\n-
    \nBlackBerry PlayBook Tablet UI Guidelines\n\n![](images/ui-style-guides/blackberry-playbook/cover.avif)\n\n![](images/ui-style-guides/blackberry-playbook/1.avif)\n\n![](images/ui-style-guides/blackberry-playbook/4.avif)\n\n![](images/ui-style-guides/blackberry-playbook/2.avif)\n\n![](images/ui-style-guides/blackberry-playbook/3.avif)\n\n
    \ - [2012 PDF](/ui-style-guides/BlackBerry/BlackBerry%20PlayBook%20Tablet%20UI%20Guidelines%20(2.1,%202012).pdf)\n
    \ - [2012 Internet Archive viewer](https://archive.org/details/blackberry-playbook-tablet-ui-guidelines)\n\n-
    \nBlackBerry Smartphones UI Guidelines\n\n![](images/ui-style-guides/blackberry-smartphone/cover.avif)\n\n![](images/ui-style-guides/blackberry-smartphone/2.avif)\n\n![](images/ui-style-guides/blackberry-smartphone/4.avif)\n\n![](images/ui-style-guides/blackberry-smartphone/1.avif)\n\n![](images/ui-style-guides/blackberry-smartphone/3.avif)\n\n![](images/ui-style-guides/blackberry-smartphone/5.avif)\n\n
    \ - [2013 PDF](/ui-style-guides/BlackBerry/BlackBerry%20Smartphones%20UI%20Guidelines%20(7.1,%202013).pdf)\n
    \ - [2013 Internet Archive viewer](https://archive.org/details/blackberry-smartphones-ui-guidelines)\n\n-
    \nBlackBerry 10 UI Guidelines\n\n![](images/ui-style-guides/blackberry-10/cover.avif)\n\n![](images/ui-style-guides/blackberry-10/2.avif)\n\n![](images/ui-style-guides/blackberry-10/5.avif)\n\n![](images/ui-style-guides/blackberry-10/1.avif)\n\n![](images/ui-style-guides/blackberry-10/3.avif)\n\n![](images/ui-style-guides/blackberry-10/4.avif)\n\n
    \ - [2015 PDF](/ui-style-guides/BlackBerry/BlackBerry%2010%20UI%20Guidelines%20(2015).pdf)\n
    \ - [2015 Internet Archive viewer](https://archive.org/details/blackberry-10-ui-guidelines)\n\n-
    \n### CDE \n\n[Common Desktop Environment](https://en.wikipedia.org/wiki/Common_Desktop_Environment)
    (CDE) is a desktop environment for Unix machines, using (and eventually merging
    with) OSF/Motif widgets.\n\n- \nOSF/Motif Style Guide\n\n![](images/ui-style-guides/osf-motif/cover.avif)\n\n![](images/ui-style-guides/osf-motif/5.avif)\n\n![](images/ui-style-guides/osf-motif/7.avif)\n\n![](images/ui-style-guides/osf-motif/1.avif)\n\n![](images/ui-style-guides/osf-motif/2.avif)\n\n![](images/ui-style-guides/osf-motif/3.avif)\n\n![](images/ui-style-guides/osf-motif/4.avif)\n\n![](images/ui-style-guides/osf-motif/6.avif)\n\n
    \ - [1993 PDF](/ui-style-guides/OSF%20Motif%20and%20CDE/OSF%20Motif%20Style%20Guide%20(1993,%201.2).pdf)\n
    \ - [1993 Internet Archive viewer](https://archive.org/details/bitsavers_openSoftwaFMotifStyleGuideRevision1.21993_16324635)\n
    \ - [1997 website mirror](/ui-style-guides/OSF%20Motif%20and%20CDE/Motif%20and%20CDE%202.1%20Style%20Guide%20(1997)/toc.htm)\n
    \ - [1991 PDF](/ui-style-guides/OSF%20Motif%20and%20CDE/OSF%20Motif%20Style%20Guide%20(1991,%201.1).pdf)\n
    \ - [1996 website mirror](/ui-style-guides/OSF%20Motif%20and%20CDE/OSF%20Motif%20Style%20Guide%20(1996)/TOC.html)\n\n-
    \nCommon Desktop Environment: Style Guide and Certification Checklist\n\n![](images/ui-style-guides/common-desktop/4.avif)\n\n![](images/ui-style-guides/common-desktop/1.avif)\n\n![](images/ui-style-guides/common-desktop/2.avif)\n\n![](images/ui-style-guides/common-desktop/3.avif)\n\n
    \ - [1996 PDF](/ui-style-guides/OSF%20Motif%20and%20CDE/Common%20Desktop%20Environment%20Style%20Guide%20and%20Certification%20Checklist%20(1996).pdf)\n
    \ - [1996 Internet Archive viewer](https://archive.org/details/DigitalUNIX40CommonDesktopEnvironmentStyleGuideandCertificationChecklistCDECKLS)\n
    \ - [2000 PDF](/ui-style-guides/OSF%20Motif%20and%20CDE/Common%20Desktop%20Environment%20Style%20Guide%20and%20Certification%20Checklist%20(2000).pdf)\n
    \ - [2002 PDF](/ui-style-guides/OSF%20Motif%20and%20CDE/Common%20Desktop%20Environment%20Style%20Guide%20and%20Certification%20Checklist%20(2002).pdf)\n\n-
    \n### CUA \n\n[Common User Access](https://en.wikipedia.org/wiki/IBM_Common_User_Access)
    (CUA) is a late 1980s standard for user interfaces that influenced Windows and
    OS/2.\n\n- \nSystem Application Architecture: Common User Access\n\n![](images/ui-style-guides/ibm-cua-saa/cover.avif)\n\n![](images/ui-style-guides/ibm-cua-saa/4.avif)\n\n![](images/ui-style-guides/ibm-cua-saa/2.avif)\n\n![](images/ui-style-guides/ibm-cua-saa/1.avif)\n\n![](images/ui-style-guides/ibm-cua-saa/3.avif)\n\n
    \ - [1991 PDF](/ui-style-guides/IBM/System%20Application%20Architecture%20(1991).pdf)\n
    \ - [1991 Internet Archive viewer](https://archive.org/details/systemsapplicati0000mart)\n\n-
    \nObject-Oriented Interface Design: IBM Common User Access Guidelines\n\n![](images/ui-style-guides/ibm-cua-g"
