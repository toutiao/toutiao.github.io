  text: I think the tipping point was responsive design. Before, UIs were laid out
    with explicit pixel counts and looked the same on your screen as on the designer&#x27;s.
    After, everything has to be made out of nested layout managers. They aren&#x27;t
    bad, but they deleted the ability for a designer to make any layout they wanted,
    since it has to be made of these very constraining components.
