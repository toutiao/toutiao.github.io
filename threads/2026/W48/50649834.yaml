  text: Ironically with more focus on accessibility. There were standards on what
    was accessible, so it became a flex to get as close as possible to the edge.<p>Anyone
    can put black on white; designers would do light black on dark white, or play
    with colors. TikTok&#x27;s glitch style indicated their constant motion. Displays
    got sharper too, and if you couldn&#x27;t see the difference, you were just poor.
