  author: ogurechny
  text: I should remind you that the moment it became possible to waste memory on
    useless decorative bitmaps, and cover the performance lag of non-native UI elements
    with free MHz provided by new processors, everyone was doing skins, or at least
    added some gimmick.<p>Let&#x27;s say, in the beginning, on Windows 3 systems,
    all the code that drew all the widgets for all GUI processes resided in a single
    memory segment in a system library. That way, almost all memory of the inactive
    processes that created background windows could be swapped to disk, and redrawing
    (portions of) them could be done just by relaying window messages to default system
    handlers that were always there. Menu and dialog resources were detached for the
    same reason of being independent from internal logic and data.<p>Soon they made
    skinned multimedia players that looked like home stereo systems. Obviously, by
    that time multimedia-capable PCs had no problem handling extra work.<p>In the
    late &#x27;90s, bitmap-based skins like that (WinAMP 2.x, for example) became
    common, and usually worked fast enough, so people didn&#x27;t care whether, say,
    buttons were native or from some custom component library. Then noticeably...
    laggy... HTML... and... template... based... UIs... appeared (WinAMP 5.x dynamic
    skins were not snappy at all; when some program had to load IE for an embedded
    frame, you also had to wait). Still, after a 10× increase in CPU performance they
    became just one of the many.<p>Even freshly appeared Java applets and apps (that
    had noticeably slower UI on a typical system) were praised by some merely because
    their buttons looked “more interesting” than the ordinary ones.
