  text: '&gt; We shape our tools and thereafter our tools shape us.<p>Heidegger speaks
    of this sort of thing in <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_Question_Concerning_Technology"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_Question_Concerning_Techno...</a><p>The
    core idea is not that technology is tools or not tools, but that technology is
    a state of affairs within which we live.  The technology makes demands of us and
    we make demands of it and we do so in this vicious loop.  We have always been
    something like a cross between cyborgs and worker ants from the moment the first
    tool was used.'
