  author: hatthew
  text: 'In the past, it was generally impossible to produce even a semblance of a
    solution without understanding the domain to some extent. Management doesn&#x27;t
    care about doing it right, but it was impossible to produce results without getting
    at least <i>halfway</i> to doing it right. Now that it&#x27;s possible to produce
    results without <i>any</i> effort towards doing it right, that&#x27;s the level
    of effort management implicitly expects.<p>In absolute terms, the cost of doing
    it right (compared to doing the minimum) has gone down. But the relative cost
    has gone up.<p>Effort required to do the bare minimum before LLMs: 5. Effort to
    do it right: 10. Doing it right requires 5 extra effort, but you ship half as
    fast.<p>Minimum after LLMs: 1. Doing it right after LLMs: 4. Doing it right requires
    3 extra effort, but you ship a quarter as fast.'
