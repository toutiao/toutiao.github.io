  text: "&gt; That changed as things like pensions and longevity awards went away
    thanks to MBAs<p>MBAs and their groupthink are one thing and bad enough, but IMHO
    the true danger comes from what <i>replaced</i> pensions - the stonk market -
    that created that groupthink.<p>Basically, before 401ks and other retail investment
    vehicles appeared, the stock market&#x27;s primary function was to collect money
    from large scale investors (banks, insurances and the likes) and put it to productive
    usage. Boring stuff.<p>But once people&#x27;s retirements were tied to the stock
    markets, the stock markets were societally and thus politically forced&#x2F;incentivized
    to always go up, and that meant that there suddenly was a large, continuous influx
    of capital to nowadays the tune of dozens of billions of dollars a month. That
    in turn meant a huge incentive to siphon tiny margins off of all the trades (which
    led to HFT being a thing) and a constant incentive for C-level leadership to engage
    in all kinds of shady deals to appear better to the markets - complex webs of
    shell companies to avoid taxes, financial fraud, sale-lease-back vulturism destroying
    entire companies...<p>And it turned out, there was so much money flowing into
    the US retirement savings system that it couldn&#x27;t be soaked up by the American
    economy alone, which led to American companies and investment vehicles buying
    up assets across the world, treating them just the same - and the work we do outside
    the US is slaving away for some American boomers&#x27; retirement.<p>The result
    of <i>that</i> was eventually the 2007ff financial crisis, where dumbass investments
    by a single bank was enough to trigger the entire world economy to crash, then
    we had dumbass money hype up cryptocurrencies, and now we have dumbass money blowing
    up the AI bubble - which probably will explode much, much harder than 2007ff.<p>&quot;Thank&quot;
    or better fuck you America for messing it up for everyone else. Signed, an European
    fed up."
