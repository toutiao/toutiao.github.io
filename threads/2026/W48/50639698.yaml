  author: rich_sasha
  text: I sort of hope it’s true. My concern is that “us tool users who give a shit”
    might end up like hunter gatherers surrounded by farmers.<p>My understanding is,
    hunter gatherers were in many ways superior to their farming brethren. They were
    healthier, on a better diet, had better teeth (less carbs and grit cracking their
    teeth), higher age expectancy etc. They worked less hard - only so much hunting
    and gathering to be done in a day, vs farming which is round the clock. In a natural
    calamity, they could hope to migrate, where farmers were just royally screwed
    if the crops failed.<p>But due to scarce resources, their reproduction rates were
    lower, and ultimately they lost out to the farmers. As Stalin said, quantity has
    a quality of its own.<p>Are we going to be like the people who insisted that cars
    cannot ever replace horses, because horses are smart, hardy, reliable animals?
    Or like the blacksmiths who looked with dismay at shoddy, factory made nails?<p>Maybe
    not. Maybe it turns out AI is smart enough to make incremental software changes,
    but left in charge screws up (would be an interesting case study on how hard is
    it to manage things). But I fear the odds are against us.
