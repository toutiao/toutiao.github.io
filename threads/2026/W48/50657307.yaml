  author: toufka
  text: There are LOTS of cures, but complex diseases often break off into branches
    of increasing difficulty.  Curing 50% of a type of disease, and then curing the
    next 50% doesn&#x27;t get to 100% - but lots of individuals have certainly been
    cured.<p>Some of the new cell therapies have ~50% of &gt;10,000 patients alive
    and progression free 5 years after dosing without any maintenance therapy.  There
    is otherwise little chance of survival of multiple myeloma without treatment.<p>The
    medical bar for a &quot;cure&quot; is so high that scientific modesty prevents
    the word from being used in a technical context - but there are many many people
    alive today that would not otherwise be because of these medicines.
