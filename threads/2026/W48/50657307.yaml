    respect wanting to distinguish between LLMs, other contemporary models, and historical
    machine learning methods, but I don’t think it’s unreasonable to roll the first
    two (and maybe all three) into a single abstraction called “AI”, especially if
    we’re talking about communicating to the broader public.
