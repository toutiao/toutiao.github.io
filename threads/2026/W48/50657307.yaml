  author: chrisamiller
  text: Look, I work on this stuff, and anyone who says that AI isn&#x27;t helping
    to accelerate science is wrong. The folks who say that AI will cure all human
    disease are also wrong.<p>The truth is that biology is horrendously complicated
    and obtaining measurements of what&#x27;s going on inside cells is very difficult.
    That&#x27;s the primary bottleneck, not the data crunching. (The reason that AlphaFold
    was so successful was because it was built on 50 years of meticulously gathered
    data in the PDB!)<p>So yeah, AI will help us sift through the data and formulate
    new hypotheses. It&#x27;ll speed up processes and uncover new angles. I&#x27;m
    excited about that! It won&#x27;t however, &quot;solve biology&quot;, and I&#x27;ll
    be glad when we slide down from the peak of this hype cycle and get back to the
    business of systematically figuring things out.
  score: 0
