  author: pandoro
  text: 'Biological systems excel at reducing entropy but in an incredibly chaotic
    and anti-fragile way. See for example the <i>currently identified</i> metabolic
    pathways in mouse liver [0]. It&#x27;s a huge mess of very complicated feedback
    loops, n-th order effects, hysteresis (history-dependence), etc. Predicting that
    AI will <i>cure</i> cancer or complex diseases in the next 10 years is pure hubris
    (or marketing) and speaks to the lack of knowledge of &quot;real life&quot; biology.
    It&#x27;s like saying that AI will allow to explore another galaxy in the next
    decade. However, it will probably help in identifying specific targets or speeding
    up drug development for certain well-understood diseases.<p>[0]: <a href="https:&#x2F;&#x2F;imsb.ethz.ch&#x2F;research&#x2F;sauer&#x2F;research&#x2F;metabolomics.html"
    rel="nofollow">https:&#x2F;&#x2F;imsb.ethz.ch&#x2F;research&#x2F;sauer&#x2F;research&#x2F;metabolomics.ht...</a>'
