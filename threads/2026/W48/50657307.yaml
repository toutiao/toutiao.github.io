    is both time consuming and expensive.  This is the secondary point of the argument.<p>But
    water and hydrofluoric acid both kill cancer at different doses - but they&#x27;re
    not considered &quot;drugs&quot;.<p>Getting a candidate approved means you&#x27;ve
    met all of the ancillary hurdles required to prove your candidate is a drug; that
    your candidate is safe, that it is effective, that it is more effective than any
    other drug on the market. THAT is the bar to be a &#x27;drug&#x27;.  Otherwise,
    again, we could call hydrofluoric acid the next cancer cure.<p>There are many
