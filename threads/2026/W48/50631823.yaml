  parent_id: '50677280'
  author: m_krebs
  text: 'Imagine clapping your hands in a cathedral, or a small room, or a tunnel.
    You will get a different sound from all three. In this case, your clap is the
    impulse and the reverberations from the room are the response. You can apply this
    same principle to a guitar amp: send a blip of sound and capture what comes out.
    That gives you a function you can apply to whatever sound you want.'
  score: 0
  posted_at: '2026-11-28T13:25:14Z'
