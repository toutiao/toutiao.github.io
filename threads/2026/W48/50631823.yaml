- id: '50677573'
  parent_id: '50677463'
  author: m_krebs
  text: They&#x27;re easy to make if you have the original hardware. I looked at the
    videos and he is pretty clearly doing something else though. In his Black Sabbath
    video  the IR is labeled &quot;MFreeForm&quot; which is an EQ plugin. So I&#x27;m
    90% sure what he&#x27;s doing is getting as close as he can with a typical guitar
    signal chain, amp, pedals, whatever; then playing a riff through that chain. You
    can take that EQ plugin and get the difference between the frequency spectrum
    between your take and the isolated guitar stem from the recording. Then bounce
    that EQ curve out as a custom IR.<p>There is some technical trickery going on
    for sure but he definitely is a guitar expert and knows how to get close before
    doing any of this stuff. I don&#x27;t think there&#x27;s any tool that will simply
    give you a guitar tone from a song yet.
