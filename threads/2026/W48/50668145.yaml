article:
  url: https://www.infohawk.com/news/2026-11-27-black-friday-webrtc-skimmer
  title: Credit card skimming scripts using WebRTC found on popular shopping sites
    — InfoHawk News
  fetch_status: success
  content: "# Credit card skimming scripts using WebRTC found on popular shopping
    sites\n\nAll the sites we contacted took action; but the larger consumer web ecosystem
    should be prepared to mitigate these attack vectors\n\nA card-skimming script
    was planted on the online stores of Lascana, Samsonite, American Tourister, Revolve
    and FWRD in the week before Black Friday. After our reports to affected companies,
    all have had the script removed (on November 24th or 25th) ahead of Black Friday.
    We observed it in action on one of the five websites: Lascana, where it sent our
    test card's details to a 3rd party. We believe the script was built to take a
    card number, expiry and security code, along with a user's name, address, phone
    and email, and send them to malefactors as a user entered their payment credentials.
    It did this before the store checked the payment, so a card could be taken even
    if the order was declined or cancelled, and nothing would look wrong to the shopper.
    Across all of these sites, we do not know how many, if any, shopper details or
    payment credentials may have been captured.\n\n## Which sites were affected\n\nOn
    November 24, we notified all of the named parties in this article and others,
    including: Amazon Web Services about the storage buckets serving the script, Cloudflare
    about the services the malefactor used, the domain registrars, the pixel vendor,
    the consent-banner provider and the affected retailers and platforms. Lascana
    replied to us and removed the Quorum pixel from their site by November 24th at
    15:48 UTC. Quorum confirmed the identified malicious code was removed from their
    pixel tracker, and they restored the clean marketing pixel as of November 24th
    at 21:09 UTC.\n\nRevolve provided this statement on behalf of REVOLVE and FWRD:
    “On November 25, InfoHawk notified our team of a potential security issue impacting
    mobile and tablet versions of our websites which we resolved the same day. We
    appreciate the outreach, and are actively investigating the issue to determine
    any potential impact.”\n\n* Quorum is an ad-attribution platform that links ad
    views to store visits and online sales (quorum.inc).\n\n† Seers is a cookie consent
    management platform and data privacy compliance company (seers.ai).\n\n## How
    the attack works\n\nThis attack uses WebRTC, the technology that allows you to
    make video calls in your web browser. WebRTC lets a web page open its own channel
    to another party and pass data (e.g. audio/video packets) over it. It has likely
    been used (both to load the skimmer and to send the stolen card details out) because
    security rules and monitoring tools often do not watch this communications channel
    as closely. For example, Meta briefly used WebRTC in a creative way in 2025, according
    to researchers looking at the technology as a compromise vector. This form of
    attack appears to target mobile devices, and we only saw the server enable the
    skimmer on checkout pages, so desktop checks and homepage scans would likely not
    see it. The skimmer's traffic appeared to run through Cloudflare's relay, so it
    would blend in with the WebRTC traffic and hide its true endpoint.\n\n### The
    skimmer and card details both traveled over WebRTC\n\nHow the kit is designed
    to work on a store page, in 7 steps. Only step 4 is an ordinary web request, which
    a connect-src rule can block; steps 5 to 7 run over the WebRTC data channel, outside
    connect-src.\n\n- Store page Bootstrapping the attack The loader gets onto the
    page through a consent-banner setting, a retailer CDN file, a shared marketing
    pixel or the store's own HTML.\n\n### Bootstrapping the attack\n\nThe loader gets
    onto the page through a consent-banner setting, a retailer CDN file, a shared
    marketing pixel or the store's own HTML.\n\n- Store page Loading scripts from
    S3 buckets It loads Insds.js or gtage.js from an Amazon S3 bucket.\n\n### Loading
    scripts from S3 buckets\n\nIt loads Insds.js or gtage.js from an Amazon S3 bucket.\n\n-
    Store page Targeting the attack to mobile checkouts It runs only on small or touch
    screens. The Samsonite version runs on /checkout only.\n\n### Targeting the attack
    to mobile checkouts\n\nIt runs only on small or touch screens. The Samsonite version
