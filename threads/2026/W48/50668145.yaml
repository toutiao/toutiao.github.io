  text: The seller of a good generally is liable in the US. It&#x27;s due to common
    law in torts. The traditional reference is the <i>Second Restatement of Torts</i>,
    section 402A which says<p>&gt; One who sells any product in a defective condition
    unreasonably dangerous to the user or consumer or to his property is subject to
    liability for physical harm thereby caused to the ultimate user or consumer, or
    to his property, if<p>&gt; (a) the seller is engaged in the business of selling
    such a product, and<p>&gt; (b) it is expected to and does reach the user or consumer
    without substantial change in the condition in which it is sold.<p>Some states
    have laws that exclude the seller if the manufacturer can be sued [1], but note
    exceptions of manufacturer bankrupt or can&#x27;t be reached.<p>[1] <a href="https:&#x2F;&#x2F;law.justia.com&#x2F;codes&#x2F;tennessee&#x2F;title-29&#x2F;chapter-28&#x2F;section-29-28-106&#x2F;"
