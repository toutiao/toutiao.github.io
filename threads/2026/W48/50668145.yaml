  author: tialaramex
  text: |-
    One important thing to understand about payment cards in particular is the distinction between &quot;Settlement&quot; and &quot;Authorisation&quot;<p>Settlement is the process by which Bank A with your money, or possibly your debt if it&#x27;s a credit card, gives money to Bank B representing a merchant where ostensibly you paid with the payment card.<p>Settlement is basically still the same &quot;Honour System&quot; process as it was last century, it&#x27;s probably no longer literally magnetic tapes or punched cards, but cryptography has no real role here. Because this relies on that Honour System, mere accidents can result in transactions which should not exist. At a societal level e.g. a big bank mistakenly runs MAIN1 MAIN2 MAIN2 MAIN4 files through their settlement process one night, and the next morning people whose transactions were in MAIN2 realise they&#x27;ve been charged twice! Meanwhile retailers relying on MAIN3 being processed are distraught to find that magically they got nothing. Oops, fat finger. e.g.<p><a href="https:&#x2F;&#x2F;www.bbc.co.uk&#x2F;news&#x2F;uk-england-45400234" rel="nofollow">https:&#x2F;&#x2F;www.bbc.co.uk&#x2F;news&#x2F;uk-england-45400234</a>
    <a href="https:&#x2F;&#x2F;www.bbc.co.uk&#x2F;news&#x2F;business-41061781" rel="nofollow">https:&#x2F;&#x2F;www.bbc.co.uk&#x2F;news&#x2F;business-41061781</a><p>Authorization is the step where there&#x27;s something resembling modern security. This step is there to protect Banks and Merchants from Customers, who they don&#x27;t trust as far as they could throw you. Although Banks and Merchants are so often involved in fraud, they both <i>love</i> blaming Customers and so hence they require Authorization. The EMV technology (most familiar as &quot;Chip and PIN&quot; but the same technology makes Contactless including paying with your iPhone work in most countries) is the most &quot;high tech&quot; this ever got.<p>EMV <i>could</i> be fairly good. It&#x27;s not really well designed, crypto people have found some serious holes in it, but they&#x27;re at the scale of &quot;Skilled people could break this&quot; or &quot;This is needlessly worse than it should be&quot; not at the &quot;A bored teenager can steal your money&quot; level where the magnetic stripes were. However, the bank cares a lot about price, a best-in-class EMV card might cost $1 more, if it reduces the bank&#x27;s fraud costs by 50 cents <i>they</i> are losing money on that, so the crap EMV card they gave you is the right choice for their bottom line even if you also lose on average $2.50 from the fraud, the bank doesn&#x27;t care about you, your benefit does not appear on their bottom line.<p>Understanding, as so often, Cui Bono (who benefits) from Authorization clarifies where the incentives are.
  score: 0
