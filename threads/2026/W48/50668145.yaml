  author: buzer
  text: Making everyone in the chain jointly liable in regards to end user solves
    the issue of figuring out who exactly you need to sue and being able to show they
    were precisely the ones who caused it. It also protects against the currently
    liable party from being judgement-proof, like if currently the advertiser is the
    liable party and that advertiser didn&#x27;t truly even exist, the end user would
    need to sue the criminal who is in country which doesn&#x27;t care (and would
    need to figure out who it actually even is).<p>GDPR and EU261 (flight compensation)
    has similar provisions. Essentially end user can choose who to sue (within the
    &quot;chain&quot; defined by the law), get the compensation and the companies
    are free to fight out who is responsible for it. Now companies suddenly have interest
    on making sure they are not the ones who are left holding the bag (contractually
    &amp; making sure they can actually recover money from ultimately liable party).
