  text: |-
    The ideological framework that FCIS comes from places business logic at the core, insulated from concerns about I/O or how side effects come to pass which are the concerns of layers above it. The "functional core" is a pure function of the data given to it, the "imperative shell" takes the result of that business logic running and actually executes it.
    signal --> shell --> core --> shell --> side effects

    Your framing follows more of a control plane/data plane idea, where your business logic is coordinating subsystems through a pure API:
                ------------ Functional space ---------
                          +--> control plane --+
                         /                      \
                --------/--- Imperative space ---\------
                       /                          \
         +--> input handling                       +--> side effects
        /
    signal

    Which is kinda the same thing, just depends on how you tilt the diagram and think about what is wrapping what
