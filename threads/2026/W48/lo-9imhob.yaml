    Isn't the idea of the executable plan the opposite? You have an imperative core (or subsystem) and you aim to isolate it by creating a functional shell for it?
    Your point about needing a side-effect to decide which way a plan should go maps pretty cleanly onto whether a plan type needs to be a powerful structure like a monad or whether a simpler structure like a list of steps is enough. You might find you can still build a plan by describing the computation graph statically (so you'd have nodes for should_optimise? as well as nodes that are essentially control structures within your plan).
