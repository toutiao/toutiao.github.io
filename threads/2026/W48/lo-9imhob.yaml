    To untangle things, I resolved to make one of my favourite programming moves, “make the plan a value” or “decide what to do, and then do it”. This move decouples two parts of a program by introducing an intermediate data structure (a “plan”, or a value of a “plan type”) describing what is to be done before any action is taken.

    FWIW in most instances I think of this as "the Interpreter pattern" from the GoF Design Patterns book
    Although now when I look on the web, people writing about the interpreter pattern talk about parsing, which IMO is unnecessary for the interpreter pattern.  I often express it like something like:
    class Migrate:
      def __init__(foo, bar)
      def Run()

    class Test:
      def __init__(s)
      def Run()

    class OptionalWork:
      def __init__(i, j, k)
      def Run()


    And then a "plan" can is list of objects with a Run() method (which is a value).  And the harness can do error handling and logging, etc.
    And yes the harness can be parameterized too by --dry-run, so that is useful too.
    If you want, you can make a "composite" value obeying the Run() interface, which also contains other Runnables.  You might run them on another thread, or on another machine, etc.
    It's trivial to add an Retry wrapper too, and then if and for (but then you're getting a bit crazy)
    Just like a real interpreter.  No parsing involved!
