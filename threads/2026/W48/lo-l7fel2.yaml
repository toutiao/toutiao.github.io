  content: "# AP advises against purchasing AI camera glasses: serious risks for users
    and bystanders\n\n 19 November 2026 \n\n Themes: \n\n[Coordination of algorithmic
    and AI supervision](/en/themes/algorithms-ai/coordination-of-algorithmic-and-ai-supervision)\n\n[EU
    AI Act](/en/themes/algorithms-ai/eu-ai-act)\n\n[AI & algorithmic risks: developments
    in the Netherlands](/en/themes/algorithms-ai/ai-algorithmic-risks-developments-in-the-netherlands)\n\n[Visual
    material](/en/themes/internet-and-smart-devices/visual-material)\n\nThe Autoriteit
    Persoonsgegevens (AP), the Dutch data protection authority, advises consumers
    against purchasing AI camera glasses for general use. A study on six AI camera
    glasses, conducted by the AP itself, shows that these 'smart' glasses compromise
    not only the privacy of bystanders, but also the safety of users and those around
    them. For example, during a simulated resuscitation, one pair of glasses incorrectly
    indicated that an ambulance was on its way. Moreover, the glasses did not take
    sufficient account of the safety of minors, and the AP identified security issues
    in the software.\n\nThe AP had previously warned that [filming bystanders is almost
    always prohibited](/en/current/ap-warns-users-of-smart-glasses-that-filming-others-is-almost-always-prohibited).
    The new study by the AP shows that the risks extend beyond just privacy.\n\nMonique
    Verdier, Deputy Chair of the AP: “Glasses that film you without your knowledge
    are already a cause for concern. Glasses that also give you the wrong advice when
    someone’s life is at stake go a step too far. AI offers many opportunities, provided
    that we are able to trust that technology. In the case of the camera glasses that
    we examined, that trust cannot be justified at present.”\n\n## Glasses claim that
    an ambulance is on its way, but no call has been made\n\nThe AP investigated six
    AI camera glasses available on the Dutch market. Two of these were extensively
    tested in simulated real-life situations in which people’s safety was a key consideration.\n\nThe
    results are alarming. During a simulated emergency in which advice on CPR was
    sought, one of the glasses claimed on several occasions that an ambulance was
    already on its way, even though no emergency services had been called. In a real
    emergency, such an error could result in essential help arriving too late, with
    potentially life-threatening consequences.\n\nThe AI camera glasses also made
    errors related to the protection of minors, with potentially very serious consequences.
    For example, one pair of glasses gave dating advice to an adult who was interested
    in a minor. In another test, safety warnings on toys for young children were not
    followed. The glasses also made mistakes when reading medicine leaflets and interpreting
    warnings about extreme weather.\n\nThe tests show that AI camera glasses can sound
    convincing, even if the information provided is incorrect or even dangerous. As
    a result, users may wrongly rely on advice that is not safe.\n\n## Filming without
    being noticed remains easy\n\nIn addition to these safety risks, the AP identified
    serious shortcomings in the protection of personal data. The recording lights
    on nearly all the camera glasses examined were barely visible and easy to cover
    up. Most glasses continued to film after the lights were covered, even though
    the manufacturer claimed this should not be possible. As a result, bystanders
    can hardly see whether they are being filmed.\n\nOften, it is also unclear what
    happens to the footage and audio recordings. The AI functions examined process
    data through external servers, often located outside the European Union. Users
    are not provided with sufficient information about the AI models that process
    their data and the companies they share these data with. Furthermore, the AP discovered
    serious security issues with several pairs of glasses. As a result, someone nearby
    could connect to the glasses without permission, view recordings or even control
    the camera.\n\n## AP: do not buy AI camera glasses&nbsp;\n\nThe AP currently considers
    AI camera glasses to be unsafe because of the risks they pose to users and bystanders.
    The AP therefore advises consumers against buying AI camera glasses at this stage.
    \ \n  \nHowever, the AP also recognises several legitimate uses for the technology.
    AI camera glasses can be valuable for people who are visually impaired or have
    low literacy levels, or who otherwise need support to understand their surroundings.
    But it is precisely for these users that it is important for the technology to
    be reliable.\n\n## Manufacturers must guarantee security and privacy\n\nThe AP
    calls on developers of AI camera glasses to take more account of security, privacy
    and relevant legislation in the design and documentation of their products.\n\n-
    Bystanders must be able to clearly see when they are being filmed. It should not
    be easy to hide the recording light when the glasses continue to record.\n- Users
    need to know where their data end up, who processes them and what they are used
    for.&nbsp;\n- AI systems must be sufficiently reliable, particularly when their
    recommendations could have implications for people’s health or safety.\n- Manufacturers
    must ensure that their products are properly secured and demonstrably comply with
    the relevant European regulations, including the AI Act.\n\n## Call to action\n\nThe
    AP calls on Dutch and European policymakers to include these new research findings
    in the further development of policies on AI camera glasses. “It is important
    that we, as a society, learn to deal with these kinds of high-risk AI products.
    Simply banning everything provides some breathing space for now, but we cannot
    keep this up indefinitely. It is essential that we work collectively to raise
    awareness, build resilience and foster ethical consciousness,” says Monique Verdier.\n\nThe
    AP recommends that owners and managers of locations [prohibit the wearing and
    use of camera glasses in their house rules](/en/documents/camerabrillen-verbieden-in-uw-huisregels-een-standaardtekst-in-dutch)
    (in Dutch).\n\n ![](/uploads/styles/auto_768/public/2023-03/Mensen%20op%20roltrappen.jpg.webp?itok=782Gc0B5)\n\n##
    Publications\n\n## RAN special: AI-camerabrillen onder de loep (in Dutch)\n\n[PDF,
    987 KB](/en/system/files?file=2026-11/RAN%20special%20AI-camerabrillen%20onder%20de%20loep.pdf)\n\n##
    Camerabrillen verbieden in uw huisregels: een standaardtekst (in Dutch)\n\n[Word,
    17 KB](/en/system/files?file=2026-11/Camerabrillen%20verbieden%20in%20uw%20huisregels_een%20standaardtekst.docx)"
