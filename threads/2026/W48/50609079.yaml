  url: https://huijzer.xyz/posts/174/gta-6-building-personal-behavioral-profile-for-eve
  title: GTA 6 building personal behavioral profile for every player - Rik's Weblog
  fetch_status: success
  content: "22 hours ago\n\n# GTA 6 building personal behavioral profile for every
    player\n\nAccording to \"make claude\" (@make\\_claude) on X, GTA 6 is collecting
    player behavior data which is fine grained enough to estimate the following metrics:
    \"impulse control score, risk tolerance index, aggressive response patterns, patience
    threshold, decision speed under pressure, spending impulsivity rating.\" Clients
    for this data include a \"credit risk modeling company, human resources screening
    platform, and an advertising data broker.\"\n\nCopy of the [post](https://x.com/make_claude/status/2123908856145232060)
    as translated by X from Chinese into English:\n\n> Rockstar Games fired me on
    Wednesday. GTA 6 launched the next day\n> \n> I was a senior engine engineer at
    Rockstar North, working on RAGE performance optimization. Three months ago, I
    found a data pipeline in the telemetry module that shouldn't have been there,
    and I could prove where it led\n> \n> Right now, every running copy of GTA 6 is
    collecting player behavior data. That part isn't news. Every game collects telemetry.
    The privacy policy says \"anonymous gameplay data analysis to improve future products.\"
    That's not what I found\n> \n> The telemetry module's data feeds into an internal
    Take-Two system called Lens. Lens doesn't send anonymous usage statistics to Rockstar
    developers' dashboards. It builds a personal behavioral profile for every player.
    Not anonymous. Tied to your console account, your platform ID, your IP address\n>
    \n> I reported this to my technical lead on August 14. He said it was \"extended
    analytics for player experience research\" and told me to leave it alone. I asked
    for the data processing protocol. He said it was handled at the Take-Two corporate
    level, outside Rockstar's scope of responsibility\n> \n> I pulled the complete
    documentation for the Lens data pipeline. Here's what I found:\n> \n> The telemetry
    goes far beyond playtime and crash reports. Lens records every input with millisecond
    precision. Keypress timing, stick movements, reaction speed, trigger pressure
    patterns on the PS5 adaptive triggers. It runs behavioral analysis in real time
    and generates what they call a \"player behavior signature\" - a profile unique
    to each player, just as a fingerprint is unique to each person\n> \n> Lens infers
    the following from your gameplay: impulse control score, risk tolerance index,
    aggressive response patterns, patience threshold, decision speed under pressure,
    spending impulsivity rating. These aren't debugging metrics. These are psychobehavioral
    categories\n> \n> It wasn't until I found the outbound data pipeline that I understood
    what they were for\n> \n> This data doesn't stay at Rockstar. It doesn't stay
    at Take-Two, either. Lens sends the behavioral profiles to a Take-Two subsidiary
    called Vantage Analytics through an internal API. Vantage has no public website,
    no news page, no job listings. It was incorporated in Delaware in 2023\n> \n>
    Vantage is a behavioral AI company. It uses player profiles to train predictive
    models and licenses those models to commercial clients. The pipeline documentation
    includes an incomplete client list. Two insurance groups, a credit risk modeling
    company, a human resources screening platform, and an advertising data broker\n>
    \n> Your GTA 6 gameplay is generating a behavioral score right now. How fast you
    drive when no one's chasing you. Whether you stop at red lights. How you react
    when an NPC attacks you for no reason. How long you think before you act. How
    impulsively you spend in-game money. Every choice is feeding a model that companies
    are paying to query to make decisions about real people\n\nAnd the original Chinese:\n\n>
    Rockstar Games 周三解雇了我。第二天 GTA 6 就发售了\n> \n> 我是 Rockstar North 的高级引擎工程师，从事 RAGE
    性能优化。三个月前，我在遥测模块里发现了一条本不该存在的数据管道，而且我能证明它流向了哪里\n> \n> 此刻每一份正在运行的 GTA 6 都在收集玩家的行为数据。这部分不算新闻。每款游戏都会收集遥测数据。隐私政策里写的是\"用于改进未来产品的匿名游戏数据分析\"。我发现的不是这个\n>
    \n> 遥测模块的数据会汇入 Take-Two 内部的一个系统，名为 Lens。Lens 并不会把匿名使用统计数据发送到 Rockstar 开发人员的数据看板。它为每一位玩家建立一份个人行为画像。不是匿名的。与你的主机账号、你的平台
    ID、你的 IP 绑定\n> \n> 我在8月14日向我的技术主管报告了这件事。他说这是\"用于玩家体验研究的扩展分析\"，让我别管这事。我要求提供数据处理协议。他说这是在
    Take-Two 集团层面处理的，不在 Rockstar 的职责范围之内\n> \n> 我调取了 Lens 数据管道的完整文档。我发现的内容如下：\n> \n>
    遥测的内容远远超出游戏时长和崩溃报告。Lens 以毫秒级精度记录每一次输入。按键时间点、摇杆动作、反应速度、PS5 自适应扳机上的扳机压力模式。它实时运行行为分析，并生成他们称之为\"玩家行为签名\"的东西
    - 一份对每位玩家都独一无二的画像，就像指纹对每个人都独一无二一样\n> \n> Lens 会从你的游戏过程中推导出：冲动控制评分、风险承受度指数、攻击性反应模式、耐心阈值、压力下的决策速度、消费冲动评级。这些不是调试指标。这些是心理行为类别\n>
    \n> 直到我找到了对外传输的管道，我才明白它们是用来做什么的\n> \n> 这些数据不会留在 Rockstar。也不会留在 Take-Two。Lens 通过内部
    API 将行为画像传送给 Take-Two 旗下一家名为 Vantage Analytics 的子公司。Vantage 没有公开网站，没有新闻页面，没有招聘信息。它于2023年在特拉华州注册成立\n>
    \n> Vantage 是一家行为 AI 公司。它用玩家画像训练预测模型，并把这些模型授权给商业客户。管道文档中包含一份不完整的客户清单。两家保险集团，一家信用风险建模公司，一个人力资源筛选平台，以及一家广告数据经纪商\n>
    \n> 你的 GTA 6 游戏过程此刻正在生成一份行为评分。没人追你的时候，你开得有多快。你会不会在红灯前停下。NPC 无端攻击你时，你怎么反应。你行动之前要想多久。你花游戏内的钱有多冲动。每一个选择都在喂养一个模型，企业正在付费查询这个模型，用来对真实的人做决定\n\n[\U0001F517
    Link](/posts/174/gta-6-building-personal-behavioral-profile-for-eve)&nbsp;([copy](javascript:void(0)))"
