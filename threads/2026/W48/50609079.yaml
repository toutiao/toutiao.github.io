  author: wongarsu
  text: To play devil&#x27;s advocate:<p>This is exactly the data you would collect
    if you wanted to build an algorithm to be able to recognize the player from their
    controller inputs. On keyboards this is well established as Keystroke dynamics,
    but it also works for mouse inputs and I assume also controllers. People move
    their fingers at different speeds and have different timing patterns between how
    they can move the same finger vs two fingers on the same hand vs two fingers on
    different hands. Over a couple seconds or minutes that builds up to a somewhat
    unique profile<p>I did some extensive work on this in the past in the keyboard+mouse
    area, and you absolutely want millisecond precise timings<p>This also fits with
    the description &#x27;a &quot;player behavior signature&quot; - a profile unique
    to each player, just as a fingerprint is unique to each person&#x27;. It&#x27;s
    only when the post talks about deriving an &quot;impulse control score&quot; or
    &quot;risk tolerance index&quot; where it becomes a bit weird. I&#x27;m sure you
    could derive those from your GTA 6 playthrough, but controller inputs seem like
    the least relevant part of that<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Keystroke_dynamics"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Keystroke_dynamics</a>
