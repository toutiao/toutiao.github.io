  title: Freeing the iPod Nano 5g | Viktor Krapivin
  fetch_status: success
  content: "A few years ago, CUB3D demonstrated unsigned code execution on the iPod
    nano 6G and 7G through _ipod\\_sun_, a font-based exploit. Whether the same approach
    would work on the 5G was still an open question.\n\nI wanted to get Rockbox running
    on the nano 5G, so I set out to adapt the exploit. My motivation was simple: an
    up-to-date music player without an internet connection. I built a fully untethered
    boot chain that loads Rockbox from the nano 5G’s NAND, with no computer or button
    sequence needed after installation. I also found a way to make the existing exploit
    fully untethered on the nano 7G, and likely the 6G too.\n\nExisting DFU exploits,
    including [q3k’s wInd3x](https://q3k.org/wInd3x.html), provide code execution
    on the nano 5G, but booting custom code this way requires a computer each time.
    I used wInd3x to explore the device and develop a convenient, fully untethered
    exploit. The firmware details below refer to the latest nano 5G firmware, `1.0.2
    (34A20020)`.\n\n_Untethered Rockbox boot on the iPod nano 5G. Watch on YouTube._\n\n##
    The catch with ipod\\_sun\n\nThe nano 5G’s NAND flash appears through a flash
    translation layer (FTL) as a logical disk with 4 KiB sectors. Its partition table
    separates a small private area for persistent device state, a firmware partition
    containing boot programs and resources, and a data volume for user files. The
    firmware partition has a directory of named images; the fonts live inside `rsrc`,
    a resource volume formatted as FAT16.\n\nThe original _ipod\\_sun_ chain combines
    a resource-validation bypass with a font-parser vulnerability. Apple’s firmware
    directory identifies the normal operating system as `osos`, the disk-mode program
    as `disk`, and the resource image containing fonts as `rsrc`. The disk-mode boot
    path does not request the resource signature check used by normal OS boot.\n\nSwapping
    the `disk` and `osos` directory entries exploits that difference: selecting disk
    mode now launches Apple’s regular OS under the disk-mode policy. The OS still
    reads its fonts, but the bootloader has not required a valid signature for the
    modified resource image.\n\n_Disk-mode bypass · illustrative control flow, not
    a firmware-source excerpt_\n\n    // Resource-validation decision only; other
    image checks are omitted.\n    if (selected_target == OSOS) {\n        status
    = check_resource_policy(rsrc);\n        if (failed(status))\n            return
    status;\n    }\n    // The DISK path does not request this rsrc check.\n    \n
    \   return boot_image(firmware_directory[selected_target]);\n    // With swapped
    entries, the DISK entry points to Apple's normal OS.\n\nThe font then triggers
    [CVE-2010-1797](https://www.cve.org/CVERecord?id=CVE-2010-1797), the FreeType
    CFF stack-overflow vulnerability also known through the _star_ exploit. A malformed
    font program corrupts the parser’s stack and redirects execution. My 5G port adapts
    that technique to the device’s font and execution context.\n\nThe swapped images
    remain on disk, but each restart still requires choosing disk mode with the device’s
    buttons. A normal boot selects the other entry. I wanted a better experience,
    with the modified font loading through the normal OS path.\n\n## Finding a bypass
    in the normal boot path\n\nThe bootloader is organized into EFI-style modules
    stored as Portable Executable (PE) images. The module that passes execution to
    the next boot stage decides whether to validate `rsrc`. It first asks the `PrivateData`
    module for `FirmwareStatus`, which comes from an authenticated record in the private
    NAND partition.\n\nThe decisive branch is below. This is reconstructed C from
    the reverse-engineered routine, with unrelated fuse handling and protocol setup
    omitted.\n\n_Normal boot · reconstructed resource-validation decision_\n\n    status
    = private_data->get_variable(\n        private_data, U16(\"FirmwareStatus\"),
    &word);\n    if (status != 0)\n        return status;\n    \n    if (word & 0x1)\n
    \       return UINT32_C(0x8000000a); // Reject the boot attempt.\n    \n    if
    (word & 0x2)\n        return 0; // Skip rsrc signature validation.\n    \n    uint32_t
    size = sizeof(validation);\n    // Check the rsrc signature and reject an invalid
    result.\n    status = resource->get_info(\n        resource, BDS_GUID(BDS_VALIDATION),
    &size, validation);\n    if (!BDS_ERROR(status) && validation[0] == 0)\n        return
    UINT32_C(0x8000001a);\n    return status;\n\n**A value of `2` returns success
    before the resource-validation query.** Bit 0 must remain clear: it is checked
    first, so `3` would reject the boot attempt. Tracing the restore OS shows that
    it sets the status to `1` during firmware transfer and clears it to `0` at the
    end. This suggests an update-in-progress guard that prevents booting an incomplete
    installation.\n\nApple’s resource-mount path writes status `2` only on the first
    successful boot, after `rsrc` has passed signature verification. My hypothesis
    is that this avoids repeating signature verification to shorten boot time or reduce
    energy use.\n\nThis is the second bypass. Instead of disguising the normal OS
    as disk mode, I can leave the firmware directory alone and supply a valid private
    record with bit 1 set. The normal boot path then accepts the modified resource
    image, and its font delivers code execution automatically.\n\nThe record lives
    in the private partition, identified by MBR type `0x3e`. On the 5G layout I examined,
    the partition begins at logical block 1, with 4 KiB blocks. The bootloader reads
    a 512-byte header from its start. The status-bearing format begins with the little-endian
    magic `PRVD` and has this layout:\n\n| Offset | Value or purpose |\n| --- | ---
    |\n| `0x00` | `0x44565250` (`PRVD`) |\n| `0x04–0x0c` | Three 32-bit words: `2,
    0, 4` |\n| `0x40` | 32-bit `FirmwareStatus`; use `2` |\n| `0x80` | 16-byte device-bound
    integrity tag |\n\nThe integrity tag is device-specific, so creating and saving
    a valid PRVD record requires code execution on that iPod.\n\n_PrivateData reader
    · simplified reconstruction_\n\n    *firmware_status = 0;\n    read_private_header(header);
    // Read-error handling omitted here.\n    \n    if (is_plain_header(header))\n
    \       return PD_SUCCESS;\n    if (!is_prvd_v2(header))\n        return PD_UNSUPPORTED;\n
    \   \n    // SHA-1 covers the first 0x80 bytes, including FirmwareStatus.\n    sha1(header,
    0x80, digest);\n    aes_encrypt_uid(digest, 16, expected_tag);\n    if (!equal16(header
    + 0x80, expected_tag))\n        return PD_SECURITY_VIOLATION;\n    \n    *firmware_status
    = read_u32_le(header + 0x40);\n    return PD_SUCCESS;\n\nThe tag is the first
    16 bytes of the SHA-1 digest, encrypted with the device’s hardware AES UID key,
    selected through key slot 2. It authenticates the private header, but as the authentication
    is constructed on device we can falsify it if we have code execution.\n\n## Using
    emCORE to make it persistent\n\nTo inspect and update the private partition, I
    adapted _emCORE_, an older framework from freemyipod’s earlier iPod exploitation
    and boot work. It provided an existing USB-controlled environment to extend for
    the 5G.\n\nI wrote the nano 5G NAND driver and integrated it into emCORE alongside
    the flash translation layer (FTL) and hardware AES access. I’ll cover the flash
    memory sequencer subsystem (FMSS), which enables NAND writes, in a future post.
    The FTL presents logical sectors over physical flash; it is the layer through
    which I read and write the private record and install the modified font.\n\nThe
    private-status tool verifies the existing header and tag, constructs the updated
    record, and obtains its new tag from the device. It rechecks the partition table
    and header before writing, then flushes the write and reads it back. The tool
    writes a complete 4 KiB logical sector even though the bootloader only consumes
    the smaller header. This works on nano 5G hardware.\n\nOnce the private record
    and modified font are installed, they remain in NAND across restarts. emCORE and
    the host computer are needed for the installation workflow, not for each subsequent
    boot.\n\n## A bootloader in less "
