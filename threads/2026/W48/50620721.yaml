  text: A heads up for those who dislike itunes (dislike, I&#x27;m being very polite
    with that word). There is a foobar component which allows you to manage your Nano
    5G. To use it, you have to change the itunes installer extension to a rar extension.
    Then, open with 7z or winrar and extract the &quot;Apple Mobile Device Support&quot;
    installer. Install that, then you can manage your Nano with foobar2k. Only issue
    is once done, you can no longer manage it with itunes, but I consider that a plus.
    Been using this method for several Nano 2, 4, and 5G devices for well over a decade
    with no issues. The old Winamp also works without an extension for up to Nano
    4 as I recall.<p><a href="https:&#x2F;&#x2F;www.foobar2000.org&#x2F;components&#x2F;view&#x2F;foo_dop"
