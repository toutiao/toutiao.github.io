  author: rayiner
  text: 'I don’t read OP as advocating for “withdrawal from public life,” but instead
    assigning different weights to each sphere of public life proportional to its
    effect on you and your ability to affect it. If your local school district has
    failing test scores, that directly affects you and you have the power to directly
    fix that problem. By contrast you have very little power to solve the Rohingya
    crisis or whatever. And people have finite bandwidth to focus on political issues:
    if you’re attending a protest about this or that, you’re not attending school
    board meetings about your community’s failing test scores.<p>It’s not about “democracy”
    versus “not democracy,” but instead a bottom-up democracy versus a top-down democracy.
    When Alexander de Tocqueville wrote about American democracy, he did not write
    about how Americans agitated politically about what was happening thousands of
    miles away. Instead, he marveled at Americans’ participatory democracy, where
    people in the local community got together to democratically govern their local
    community. If everyone does that, then the result will be a democratically governed
    society across the country. That is civic virtue.'
