  text: I think a missing aspect here is the effect of technology on civic connections.  De
    Tocqueville published about America two years before the telegraph was invented,
    so Americans of his day and every generation before were deeply connected with
    their neighbors.  In the twentieth century, nation-wide television was eroding
    local accents and bringing national news into the living room; in the twenty-first,
    social media and cell phones have atomized people addicted to them.  There are
    people who don&#x27;t know their physical neighbors&#x27; names but believe what
    they hear from their group chats, their instagram or tiktok feeds, from algorithms
