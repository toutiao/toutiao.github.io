  text: "&gt;  but it can hardly be described as showing civic virtue.<p>Completely
    disagree. I am old enough to remember much higher civic engagement in local community
    and politics. Those people were infinitely more effective at pushing for change
    at a regional, state, and eventually national level due to the fact they were
    a <i>community</i> and not some loosely held together group in name only. They
    were engaged in national politics, but it wasn&#x27;t the ridiculous black and
    white vitriol you see today. And I attribute most of the &quot;us vs. them&quot;
    black and white thinking directly to this breakdown of local community engagement
    and involvement. Easy to hate your neighbor when you never interact with them
    and turn them into a caricature.<p>Get your local stuff figured out first. This
    forces you to learn basic political skills such as working with those you disagree
    with and compromise. Those folks likely aren&#x27;t as evil as you thought, and
    if nothing else showing them you&#x27;re a decent person who wants mostly the
    same things can often soften their opinions on the edge wedge issues.<p>I would
    say focusing on national or global politics before that is directly harmful. The
    local politics first can at least help as a pre-filter for the most crazy&#x2F;extreme&#x2F;obnoxious&#x2F;etc.
