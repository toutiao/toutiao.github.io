  text: You&#x27;re arguing like there&#x27;s a clean hierarchy between local, national,
    and international politics but I&#x27;m arguing that there isn&#x27;t a clean
    boundary between them. You need to take a wholistic view of politics to understand
    all the main factors, even if you then decide the most useful theatre for political
    activity is the local level.<p>Let&#x27;s look at my local level for example,
    a lot of the general misery comes ultimately from the fact rents and energy are
    very expensive. Why is energy expensive? Because of a failure to build out the
    national grid appropriately in the face of increasing demand and a deep path dependency
    on natural gas, which was baked in decades ago. Why is natural gas in particular
    expensive now? Because Russia invaded Ukraine and America blundered into a war
    with Iran, screwing up the international market for the stuff. If my local community
    centre is closing because the price of natural gas is expensive, it is no good
    pressing the issue at the local level because foreign affairs are why it&#x27;s
    closing. Foreign and national policy defines the space of possible action at the
    local level, and sometimes it literally is not enough no matter how you spin it
    because local politics is the wrong scale to address the problem. Whatever happens
    gas will still be expensive; only the next level up can improve our energy infrastructure
    meaningfully.
