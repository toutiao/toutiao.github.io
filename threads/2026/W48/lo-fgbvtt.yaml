    # cgo's pointer check is all over the place

    cgo does syntactic transformations unaware of Go types, allowing almost unnoticeable changes in source code to turn a 48ns call into a 76µs call. And its correctness checks can panic on legal code, while being exhaustive and expensive in some cases and lax in others.

    You are getting early access to this article as a subscriber. Your support makes articles like this possible. Thank you.

    In this article, we recap some of the basics of Go's Foreign Function Interface (FFI), cgo, and take a look at example programs that explain its behavior and limits. In particular we'll show how passing the same pointer to C can panic on code that the docs allow, how it can be about 1600x slower depending on how the C call is written, and when the cgo argument checker just gives up.

    Grab dependencies (clang, Go 1.27.0 and Go debugger, delve) and let's get started.

    sudo apt-get install -y clang curl -LO https://go.dev/dl/go1.27.0.linux-amd64.tar.gz sudo tar -C /usr/local -xzf go1.27.0.linux-amd64.tar.gz export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH export CC=clang go install github.com/go-delve/delve/cmd/dlv@latest

    ## Writing C code in Go: how?#

    cgo provides specific syntax we can use to write C code in Go. It has primitives to write pure C code, include statements, build-time flags, reference C code in Go code, and allows us to call Go code from C as well!

    Consider this program.

    package main /* #include <stdio.h> #include <stdlib.h> static int add(int a, int b) { return a + b; } */ import "C" import ( "fmt" ) func main() { sum := C.add(C.int(3), C.int(4)) fmt.Println("sum (calculated by C code in Go):", int(sum)) }

    main.go

    Let's walk through each element that cgo introduces:

    - import "C": This is used as a signal to the Go build toolchain that this Go file contains foreign C code. It is not an actual package in Go.

    - Preamble: A special comment block immediately preceding import "C". This is where we can write C code that we want to invoke from Go. It can have two different kinds of content:normal C codeC include statements

    - normal C code

    - C include statements

    - C references: We can call C functions and types inside Go code as if they are imported from the C package. e.g. C.add(), C.int

    We can build this Go package the same way we would any, using go build.

    $ go build main.go $ ./main sum (calculated by C code in Go): 7

    It works! We were able to successfully invoke the C function add from Go's main function and get the correct output. But it's not clear exactly what role cgo plays. Time to dive deeper!

    ## cmd/cgo: the build-time utility#

    go build first identifies if a Go package has any C code in it. If yes, go build invokes cmd/cgo, a command line tool.

    cmd/cgo parses the C code out of the Go code, invokes the C compiler a few times to understand what each C reference is, its size and alignment (described in a comment in cgo's source) and finally generates pure Go and C files. Finally, go build takes over, compiles the files and links them into the final binary.

    Let's look at the file generation step in detail.

    cgo needs to generate pure Go and C files that can be compiled by the Go and C compilers respectively. cgo will substitute all C references with pure Go references and generate bridge code between the Go and C code.

    For all referenced C types, cgo generates equivalent Go types. For example, cgo generates type _Ctype_int int32 for C.int. In generated Go files, cgo substitutes all references to C.int with _Ctype_int. Running go tool cgo by hand writes these files to an _obj directory.

    $ go tool cgo main.go $ grep '^type _Ctype_int ' _obj/_cgo_gotypes.go type _Ctype_int int32 $ grep '_Ctype_int' _obj/main.cgo1.go | sed -E 's| ?/\*line [^*]*\*/||g' sum := (_Cfunc_add)(_Ctype_int(3), _Ctype_int(4))

    For functions, it is a little more involved since we need to take care of calling conventions. Instead of translating the calling convention between Go and C, which comes with the overhead of dealing with CPU registers and stack locations across different C compilers and CPU architectures, cgo side steps this completely.

    Go runtime calls a C function of only one shape: a function that takes one pointer argument and returns nothing. It is the one function shape Go's runtime knows how to call on every platform. But in our example, the C function add takes two int arguments and returns an int, so what gives?

    cgo generates wrapper code in Go and C to bridge this.

    The original invocation from Go looked like:

    sum := C.add(C.int(3), C.int(4))

    The generated wrapper Go function looks like this:

    $ grep -B1 -A7 '^func _Cfunc_add' _obj/_cgo_gotypes.go //go:cgo_unsafe_args func _Cfunc_add(p0 _Ctype_int, p1 _Ctype_int) (r1 _Ctype_int) { _cgo_runtime_cgocall(_cgo_5211584c62cb_Cfunc_add, uintptr(unsafe.Pointer(&p0))) if _Cgo_always_false { _Cgo_use(p0) _Cgo_use(p1) } return }

    //go:cgo_unsafe_args tells the Go compiler to place the arguments and return variables consecutively on the stack instead of the standard register based calling convention. With that, a single pointer can be used to reference the arguments since they are all in consecutive memory, which in this case is &p0.

    _cgo_runtime_cgocall (i.e. runtime.cgocall) takes a pointer to the C function to invoke (which is another wrapper function, here _cgo_5211584c62cb_Cfunc_add) and a single pointer to where the arguments reside in memory (here &p0). runtime.cgocall does some more nifty things and finally invokes the cross-language call.

    While the packaged arguments bit is solved for Go, our add function in C still expects 2 arguments and a return value. To handle the C side of this transition, cgo also generates a C wrapper function. For our add function it looks like this:

    $ grep -B2 -A16 'Cfunc_add(void \*v)' _obj/main.cgo2.c CGO_NO_SANITIZE_THREAD void _cgo_5211584c62cb_Cfunc_add(void *v) { struct { int p0; int p1; int r; char __pad12[4]; } __attribute__((__packed__)) *_cgo_a = v; char *_cgo_stktop = _cgo_topofstack(); __typeof__(_cgo_a->r) _cgo_r; _cgo_tsan_acquire(); _cgo_r = add(_cgo_a->p0, _cgo_a->p1); _cgo_tsan_release(); _cgo_a = (void*)((char*)_cgo_a + (_cgo_topofstack() - _cgo_stktop)); _cgo_a->r = _cgo_r; _cgo_msan_write(&_cgo_a->r, sizeof(_cgo_a->r)); }

    This wrapper function resolves the pointer received from the cross-language call into a struct with the C function's input and output values. Then it calls the C function add normally with the arguments and writes the result back into the expected place in memory.

    Finally, C.add in the generated Go file is replaced with _Cfunc_add, as the sum := line in the first listing showed.

    At this point, cmd/cgo has generated files which contain pure Go and pure C code. It does some final validation checks and ensures there are no errors. Finally, control is handed back to go build.

    go build invokes the Go compiler to compile the Go files and the C compiler handles the C files. The result is object files from each compilation which need to be linked together, along with other C libraries if needed. For packages like ours, the C linker handles the linking. In some cases, Go handles linking itself.

    Afterwards, we have a single binary.

    ## Pointer safety checks#

    In the above example, we were passing scalar arguments from Go to C. But things get a little tricky when we pass pointers across the language boundary.

    When pointers to memory allocated by Go are passed to C, the garbage collector can no longer track every copy. While Go keeps the memory an argument points to directly, ie top level pointers, safe for the duration of the cgo call, any memory reachable from such a pointer, ie nested pointers, do not get such guarantee. There is also a possibility that C can hold references to Go-owned memory beyond the cgo call.

    To handle issues like this, Go has two rules for passing memory between Go and C:

    - The memory a Go pointer passed to C points to must not contain an unpinned Go pointer.

