    A slice is a pointer and a length, and a zig pointer can't be normally be null, so that might be a good reason?
    Rust does the same thing, empty slices and vecs have the base address 0x1. Also every zst "is" at address 1 (kinda). Because rust pointers can't be null, and it would prevent niche optimisation in the case of Option<Pointer<T>> which would be very strange.
    ZSTs are kinda at address 1, because they're actually at address "whatever their repr(align) is", ZSTs are usually aligned at 1 (their default) but if you define
    #[repr(align(64))]
    struct Foo;

    then &Foo has the address 0x40 (64). Interestingly that's not the case for slices and vecs, AFAIK they're align(8) since they hold a pointer and a usize or two.
