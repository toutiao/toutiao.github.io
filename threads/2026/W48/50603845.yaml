  author: thangalin
  text: |-
    Since Spring, I&#x27;ve been working on a locally hosted, containerized web application to narrate my audiobook using a full cast of characters (skip to 9m47s for a reading of the demo book):<p><a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=Q9PKT6bdKnc" rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=Q9PKT6bdKnc</a><p>All weights are either permissively licensed or free until fantasy-level monthly recurring revenue sets in. The system runs entirely on the following hardware:<p><pre><code>    CPU: AMD Ryzen 5 7600 (Zen 4), 6 cores &#x2F; 12 threads, AVX-512
        GPU: NVIDIA T1000, 8 GB GDDR6 (Turing, 896 CUDA cores, 50 W, no BF16)
        RAM: 96 GB DDR5
    </code></pre>
    Text analysis uses Qwen3.6-35B-A3B MTP (Q4_K_XL GGUF) for speaker attribution, voice descriptions (not voice audio), emotive directions, and grammar. Both Muse Glimmer and GRMR cannot compete with Qwen3.6 for grammar checking. I haven&#x27;t tried Gemma4, but I suspect Qwen3.6 remains the champ. My hope is that Inkling is more accurate for grammar than Qwen3.6, which is being tested at time of writing.<p>Voice design and cloning uses FireRedTTS3, OmniVoice, Qwen3-TTS, VoxCPM2, and Ming-3.0-tts-tiny. Most are approximately equivalent. For narration, nothing comes close to Drama 3 Expressive Medium fine-tune in terms of quality, consistency, or pacing.<p>Unsloth&#x27;s GGUFs have been absolutely instrumental in making the system a reality. Highly recommend using them.
