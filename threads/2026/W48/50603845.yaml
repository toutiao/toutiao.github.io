  author: kgeist
  text: 'The Bitter Lesson was first discussed around the time of the original GPT-3,
    and today&#x27;s small local models vastly surpass GPT-3 despite having 10 times
    fewer parameters. It&#x27;s true that if you just scale things up, they will automatically
    improve without any special effort. But that doesn&#x27;t mean we shouldn&#x27;t
    make any special effort or that we can&#x27;t benefit from inference-time optimizations
    and training improvements.<p>Current models, including small ones, are trained
    on vastly more tokens and in vastly more simulated environments. So the Bitter
    Lesson still holds true here, but more for training than for inference.<p>Inference-time
    and architectural optimizations like MoE, quantization, compressed attention,
    looped transformers, multi-token prediction, Engram, etc., allow us to squeeze
    more out of the same hardware. It also looks like training models on code to make
    them more agentic has significantly increased their capabilities, i.e. training
    data quality matters just as much as scale.<p>I mean, the Bitter Lesson was true
    in the sense that you could just scale the same simple architecture (and train
    it on more data) without specializing and get better results. But the trend over
    the last few years has been the opposite, at least when it comes to inference
    (which matters most for local hosting): almost every new model introduces some
    specialization or optimization that allows it to run faster despite having more
    parameters. It&#x27;s in AI labs&#x27; interest to save on hardware costs, so
    I don&#x27;t think this trend will stop.'
  score: 0
