  author: kristopolous
  text: Everything has plateaued historically. There was a race for higher color depth
    of computer screens for about 20 yeheirars from 2 colors to 24 bit and then it
    stopped except for extremely specialized usecases. High end TVs are now at 30,
    but nobody seems to care that much. 48bit graphic cards exist, I even have a card
    in an HP-UX 9000 workstation! It&#x27;s about 30 years old.<p>Audio was the same
    way. The hardware raced along until people were at the &quot;whatever phase&quot;.<p>Wifi
    is at the same point now. Fast enough for most people. The subsequent standards
    aren&#x27;t even focusing on increasing the speed.<p>This happens in physical
    spaces too. Consumer cars got progressively faster but the last 50 years, no not
    really.<p>Or look at the number of tv channels. We went from ~4 -&gt; 13 VHF -&gt;
    36 UHF -&gt; cable with maybe 60 -&gt; hundreds with digital -&gt; who cares...<p>Or
    what about the cost of textiles and fabrics. The 19th century had brutal races
    to bring these down to where they&#x27;ve sat your entire life. You can walk into
    a discount store or shop online and get a new garment for under $10 ... there
    is no fierce race to get it down to $1.<p>Metrics race until they get to satisfaction
    without scarcity and if you think AI is going to operate differently because someone
    wrote a couple paragraphs in 2019, no. The tech industry loves falling back on
    pithy aphorisms that don&#x27;t stand up to scrutiny.<p>We&#x27;re already seeing
    hints of saturation. People are looking for things like privacy and cost effectiveness
    and if you see the advertising of the companies they are focusing on brand identity
    and image and not claiming metrics.<p>The dirty secret is most consumers are happy
