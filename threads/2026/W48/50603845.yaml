article:
  url: https://www.gpupartner.com/blog/beginners-guide-local-ai-inkling-qwen-unsloth
  title: A beginner's guide to Local AI with Inkling, Qwen, and Unsloth | GPU Partner
  fetch_status: success
  content: "# A beginner's guide to Local AI with Inkling, Qwen, and Unsloth\n\nWe
    have AI at home! Set up your own free personal ChatGPT on your PC with Unsloth
    and Inkling or Qwen. It's private, and the whole house can use it.\n\nBy Jerry
    James ·\n\n ![NVIDIA GeForce RTX 5090 Founders Edition, close on its two fans,
    against a green background of white blueprint line drawings.](https://cdn.gpupartner.com/prod/nvidia-geforce-rtx-5090-green-blueprint-hero-1440x600.jpg)\n\nWith
    the launch of [open-weight](/reference/open-weights) models like Qwen, cloud-based
    LLM providers seem like they're more of infrastructure or appliance businesses
    when it comes to most routine tasks that an AI model can handle.\n\nOpenAI and
    Anthropic have displayed a pattern of dropping model quality in the 'latest' version
    and controlling exactly what you're allowed to run on their models. Add to this
    ballooning costs and privacy concerns, and we get a pretty good case for moving
    away from this 'convenient' cloud experience.\n\nThat's basically where I was
    too. I wanted to offload certain token-heavy research, data collection, or coding
    tasks to an AI model without staring at usage limits all day. So, as any reasonable
    human being would do, I decided to set up my own [local AI](/reference/local-llm):
    a Claude and ChatGPT replacement that runs at home on my own hardware.\n\nSince
    this was my first attempt, my primary focus was keeping it simple and hosting
    it on Windows. If you're a beginner, you can follow along to get one going on
    your home network too.\n\nOnce you have the hardware sorted, it takes about 10-15
    minutes (excluding download times).\n\n### The short version\n\nInstall Unsloth
    Desktop, download a quantized AI model that fits your GPU's VRAM, set your context
    size, and turn on LAN access so everyone at home can use it.\n\n## What Do You
    Need to Run a Local AI at Home?\n\nNot much (other than the hardware). Here's
    a short list:\n\n- **A Windows PC with a graphics card (GPU).** The more video
    memory (VRAM) it has, the bigger the model it can run. I'm using an [RTX 5090](/tools/vram-calculator/machines/rtx-5090)
    with 32GB VRAM for this setup.\n- **Unsloth Desktop.** A free app that 'serves'
    the AI model to you through a chat interface. [Get it from Unsloth](https://unsloth.ai/docs/desktop).\n-
    **An AI model sized to fit your GPU.** We'll pick one in the next section.\n\nThat's
    it. No terminal commands, Python environments, or subscriptions required.\n\n##
    Which AI Model Can Your GPU Run?\n\nIt depends on how much [VRAM](/reference/vram)
    your graphics card has. As a rough guide, 8-12GB of VRAM handles smaller 9B-12B
    models, while 32GB comfortably runs 27B-35B models with plenty of room for long
    conversations.\n\nOn consumer-grade hardware, we'll need smaller models. The full-size
    Qwen model sits at around 56GB and won't really fit on a consumer graphics card
    unless you're running a Mac with unified memory. That's where quantization comes
    in.\n\n### What Is Quantization?\n\n[Quantization](/reference/quantization) shrinks
    a model by compressing weights and moving to a lower precision. You basically
    trade some accuracy for a model that actually fits on your GPU and runs faster.\n\nThe
    same photo stored at 8, 4 and 2 bits per pixel. A model's weights lose detail
    the same way going from Q8 to Q4 to Q2.\n\nIf you're wondering whether this tradeoff
    is worth it, well, it depends. You'll find that certain types of workloads don't
    really care and give similar outputs, while others may be nearly unusable.\n\n###
    Which Model Should You Run for Your VRAM?\n\nFor this guide, we'll be going with
    Qwen3.8-27B with 4-bit quantization on my system with an RTX 5090. Going up a
    tier is an option thanks to its 32GB of VRAM, but I wanted to allow for a larger
    [context window](/reference/context-window) (how much of the conversation the
    model can keep in mind at once) rather than cramming in the largest model that
    fits.\n\nQwen3.8-27B at each precision with a 128K context, from our [VRAM calculator](/tools/vram-calculator/qwen3.8-27b).
    At 4-bit, the model and the context fit a 32 GB card with room to spare.\n\nIf
    you want to run a model of this caliber with excellent performance, a hilariously
    overpriced RTX 5090 (remember when $1,999 felt too high?) is unfortunately still
    not a terrible 'deal' these days. The other option is way more expensive [enterprise-grade
    GPUs](/inventory/gpu).\n\nIf you're on a GPU with less VRAM, you can still get
    something very usable going right away. The table below gives you a rough idea
    of where you can start.\n\n| \n\n**Size**\n\n | \n\n**VRAM**\n\n | \n\n**Models
    to try**\n\n | \n\n**Version (quant)**\n\n | \n\n**Context size**\n\n | \n\n**Cards
    at this size**\n\n |\n| --- | --- | --- | --- | --- | --- |\n| \n\nSmall\n\n |
    \n\n8-12 GB\n\n | \n\n[Qwen3.5-9B](/tools/vram-calculator/qwen3.5-9b), [Gemma
    4 12B](/tools/vram-calculator/gemma-4-12b)\n\n | \n\nUD-Q4\\_K\\_S or Q4\\_K\\_M\n\n
    | \n\n8K-16K\n\n | \n\n[RTX 5060 8GB](/tools/vram-calculator/machines/rtx-5060),
    [RTX 3060 12GB](/tools/vram-calculator/machines/rtx-3060-12gb), [RTX 5070 12GB](/tools/vram-calculator/machines/rtx-5070)\n\n
    |\n| \n\nMedium\n\n | \n\n16 GB\n\n | \n\n[Qwen3-14B](/tools/vram-calculator/qwen3-14b),
    [gpt-oss-20b](/tools/vram-calculator/gpt-oss-20b) (MoE), [Gemma 4 26B](/tools/vram-calculator/gemma-4-26b-a4b)
    (MoE), [Qwen3-Coder-30B](/tools/vram-calculator?m=qwen3-coder-30b-a3b-instruct&hw=rtx-5060-ti-16gb)
    (MoE), [Qwen3.6-35B](/tools/vram-calculator?m=qwen3.6-35b-a3b&hw=rtx-5060-ti-16gb)
    (MoE), [Inkling 2 Mini](https://unsloth.ai/docs/models/inkling-2-mini) (MoE)\n\n
    | \n\nQ4\\_K\\_M or Q5\\_K\\_M\n\n | \n\n16K-32K\n\n | \n\n[RTX 5060 Ti 16GB](/tools/vram-calculator/machines/rtx-5060-ti-16gb),
    [RTX 5070 Ti](/tools/vram-calculator/machines/rtx-5070-ti), [RTX 5080](/tools/vram-calculator/machines/rtx-5080),
    [RTX PRO 2000](/inventory/gpu/pny-nvidia-rtx-pro-2000-blackwell-16gb-gddr7)\n\n
    |\n| \n\nLarge\n\n | \n\n24 GB\n\n | \n\n[Gemma 4 31B](/tools/vram-calculator/gemma-4-31b),
    [Qwen3.8-27B](/tools/vram-calculator/qwen3.8-27b), [Inkling 2 Mini](https://unsloth.ai/docs/models/inkling-2-mini)\n\n
    | \n\nUD-Q4\\_K\\_M or Q4\\_K\\_S\n\n | \n\n16K-32K\n\n | \n\n[RTX 3090](/tools/vram-calculator/machines/rtx-3090),
    [RTX 4090](/tools/vram-calculator/machines/rtx-4090), [RX 7900 XTX](/tools/vram-calculator/machines/rx-7900-xtx),
    [RTX PRO 4000](/inventory/gpu/pny-nvidia-rtx-pro-4000-blackwell-24gb-gddr7)\n\n
    |\n| \n\nExtra Large\n\n | \n\n32 GB+\n\n | \n\n[Qwen3.8-27B](/tools/vram-calculator/qwen3.8-27b),
    [Inkling 2 Mini](https://unsloth.ai/docs/models/inkling-2-mini)\n\n | \n\nUD-Q4\\_K\\_XL
    or Q6\\_K\n\n | \n\n64K-128K+\n\n | \n\n[RTX 5090 32GB](/tools/vram-calculator/machines/rtx-5090),
    [RTX PRO 4500 32GB](/inventory/gpu/pny-nvidia-rtx-pro-4500-blackwell-32gb-gddr7),
    [RTX PRO 5000 48GB](/inventory/gpu/pny-nvidia-rtx-pro-5000-blackwell-48gb-gddr7),
    [RTX PRO 6000 96GB](/inventory/gpu/pny-nvidia-rtx-pro-6000-blackwell-workstation-edition-96gb-gddr7)\n\n
    |\n\nSmall\n\nMedium\n\nLarge\n\nExtra Large\n\nModels marked MoE ([mixture of
    experts](/reference/mixture-of-experts)) only run a few billion of their parameters
    for each token. They keep a decent speed on a smaller card with the rest held
    in system RAM, which is why a 35B model sits in the 16 GB row. On an RTX 5060
    Ti 16GB, [our calculator](/tools/vram-calculator?m=qwen3.6-35b-a3b&hw=rtx-5060-ti-16gb)
    puts Qwen3.6-35B at about 47 tokens per second this way.\n\nFeel free to experiment
    with several models until you find one that fits your needs. You can also use
    [GPUPartner's VRAM Calculator](/tools/vram-calculator) to get an estimate.\n\n###
    Can You Run Inkling 2 on an RTX 5090?\n\nInkling 2 Mini, yes. Inkling 2 Small,
    no.\n\n[Inkling 2 Mini](https://unsloth.ai/docs/models/inkling-2-mini) is the
    newest model in this size class. Thinking Machines Lab released it on November
    17, 2026: 26.4B parameters, Apache 2.0, vision support and a 1M-token context.
    Unsloth's recommended file, UD-Q4\\_K\\_XL, is 17.6 GB. That is within 0.1 GB
    of the Qwen3.8-27B file in this guide, so it sits on a 32GB card the same way
    and leaves about 14GB for context.\n\nNothing else in this guide change"
