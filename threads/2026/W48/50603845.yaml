  author: jfreds
  text: Processor FLOPS is probably only relevant if you’re doing some form of model
    parallelism and using your CPU for a little extra speed boost (a lot more complexity
    for maybe like, 5-10% speed up I’m guessing). Otherwise, your CPU is really just
    issuing instructions to move memory around, which is bottlenecked by PCIe bandwidth,
    not processor FLOPS. Processor power (watts) is pretty irrelevant im guessing.<p>The
    sweet spot for VRAM for local model hosting is 128gb (Mac Studio or DGX spark).
    That gets you qwen-coder next at like Q8, so not lobotomized too bad, at 50 t&#x2F;s,
    and a generous context window.<p>As with most things, the real answer is “it depends”.
    All the VRAM in the world won’t save you if your HBM bandwidth is low
