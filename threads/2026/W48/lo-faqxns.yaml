    If it’s just a media query, custom media queries seem rather more appropriate and quite a bit simpler: (specified for some years and supported by various tooling for as long, but not implemented in any browser yet)
    @custom-media --mobile (width < 40rem);
    @custom-media --tablet (40rem <= width < 64rem);
    @custom-media --desktop (width >= 64rem);

    .sidebar {
      @media (--mobile) {
        display: none;
      }

      @media (--tablet) {
        inline-size: 12rem;
      }

      @media (--desktop) {
        inline-size: 20rem;
      }
    }

    Mixins only prevail where what you want isn’t a single media query, such as this modification of one proffered example:
    @mixin --if-dark-mode {
      @media (prefers-color-scheme: dark) {
        :root:not(.light) & {
          @contents;
        }
      }
      :root.dark & {
        @contents;
      }
    }
