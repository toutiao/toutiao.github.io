  author: macNchz
  text: 'A lot of your caveats here assume some level of sophisticated attacker that
    has persistent access to the machine and is motivated to investigate when something
    doesn&#x27;t work, rather than the extremely common case of a smash-and-grab credential
    stealer script that quickly scans through the system and tries to grab anything
    it can before being removed.<p>Even things that will not stand up to a motivated
    attacker still add value towards reducing the likelihood of a breach, by increasing
    friction for attackers that are simply grabbing at low-hanging fruit. A setup
    with a bit more friction is a locked door in a long hallway of unlocked doors.
    Yeah someone can get through it, but it&#x27;s not going to be their highest priority.
    This is the case for almost anything security related: layers of imperfect protection
    are good in combination.'
