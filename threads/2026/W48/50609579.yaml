  text: I’m currently trying to get to a point where I don’t keep long lived credentials
    on disk, and as much as possible keep them out of environment variables as well.
    I don’t want random processes running as my user account to be able to go sniff
    out my GitHub, AWS, and so on API tokens. Unfortunately It’s a massive pain to
    get right at the moment. I particularly don’t want long lived credentials where
    if a process sends them to a server somewhere they’re valid for ages afterwards.<p>SSH
    keys are pretty much solved, I’m using 1Password’s SSH agent similar to what OP
    is doing with Bitwarden. It works wonderfully.<p>Various API keys are a pain in
    the backside. 1Password has some features which kind of maybe help by allowing
    you to keep credentials in 1Password and then exposing them either as a named
    pipe that requires auth to read, or via CLI wrappers that inject the credentials
    at runtime. Both of those still require long lived credentials though.<p>At some
    point I’ll probably snap and build something analogous to what 1Password are doing
    but using OAuth or similar to request short lived, scoped, credentials as needed.
    I assume there’s approximately six hundred things like this which are targeted
    at agent use but I’d like something that doesn’t require me to run everything
    in a sandbox.
