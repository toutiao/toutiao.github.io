  author: D13Fd
  text: It&#x27;s defense-in-depth. Each hurdle you make an attacker jump over can
    filter some types of attackers. Yes, some might still get through, but that doesn&#x27;t
    make it valueless.<p>&gt; This means they can also hit the approve button for
    you. . . . Ok, now you say &quot;But it requires touchID!&quot;. Maybe that gets
    you just a little bit of protection, but...<p>That&#x27;s a pretty big leap. Systems
    like Mac OS are designed so that other apps can&#x27;t easily click that Touch
    ID button for you. The vast majority of attackers are going to be filtered at
    this step. Beyond that, anything that &quot;clicks that button for you&quot; could
    only work when you&#x27;re logged in - another hurdle - and will probably result
    in some visible screen activity even if it&#x27;s &quot;clicked&quot; quickly.<p>When
    compared to simple plaintext SSH keys stored on disk, it&#x27;s a night and day
    difference.<p>This is like saying &quot;sure, you could wear a seatbelt, but it&#x27;s
    not going to do anything for you if you drive your car off a cliff, so why wear
    it at all?&quot;
