  text: The difference is scope&#x2F;persistence. If someone steals your really long
    password, they have your password to use at their leisure as many times as they
    want. At worst, if I plug my Yubikey into a compromised machine, the attacker
    can only use my GPG key while it&#x27;s plugged in and unlocked - it can&#x27;t
    steal the key itself, nor does using the key once grant it the ability to keep
    using it. To use my key, an attacker needs control of the machine, my Yubikey
    to be physically connected to that machine and my PIN to have been typed in correctly
    within 3 attempts. I can unplug it when I&#x27;m not using it and it blinks whenever
    it&#x27;s asked to do anything even once unlocked.<p>There&#x27;s very little
    hassle involved anyway. You set up the hardware key once and it lasts years and
    you have to configure SSH and GPG on any machines that you use as a terminal (not
    any of the machines you connect to). It is easily scripted and deployed en masse.
