  author: handplane
  text: While in theory, this adds at least some small layer of protection, I have
    doubts that it adds anything meaningful to stop a smart attacker.<p>The problem
    here is that everything is running as your user, so it&#x27;s all the same security
    sphere.<p>You may be thinking, &quot;But Bitwarden requires me to approve each
    key request&quot;. Problem is that if the attacker is already running as your
    user, which I&#x27;m assuming here because to steal your bare keys, they&#x27;d
    already need to be. This means they can also hit the approve button for you.<p>Ok,
    now you say &quot;But it requires touchID!&quot;. Maybe that gets you just a little
    bit of protection, but...<p>The next idea is to just steal the decrypted key out
    of RAM. This requires a little bit of effort, because you generally can&#x27;t
    attach to a sibling process without root on Linux with default configs. This will
    only delay things slightly. Attaching to your child is allowed, so all an attacker
    needs to do is replace your launch shortcut&#x2F;service for Bitwarden with a
    thin wrapper that makes the attacker the parent process, and then they can just
    ptrace it and steal the decrypted key next startup. On Mac, where the ptrace path
    isn&#x27;t viable due to disallowing ptrace of signed binaries by default, you
    could just replicate the Bitwarden GUI as a wrapper and steal the master password
    at startup.<p>If you really want to protect your keys from attacks like this,
    you need a real hardware device with OOB signaling.
