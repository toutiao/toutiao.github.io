  author: blooalien
  text: "&gt; If you want the agent to look at logs, create PRs, run tests that need
    network access (grade, Basel, etc) then you are going to have to give it enough
    access that there is probably very little functional difference from you running
    those commands yourself<p>The difference is that <i>one</i> situation is logged
    in the logs as <i>you</i> doing a thing, and the other is logged as the <i>agent</i>
    doing the thing.  That&#x27;s why you should really run your agents as their own
    separate user account and give that account whatever (minimal required) permissions
    it needs to do the job.  For auditability purposes when tracing down a problem
    (to implement a solution, or to lay blame), you probably <i>want</i> to know when
    the &quot;bot&quot; screwed up so that it can be fixed (and so <i>you</i> don&#x27;t
    have to take the blame for something you had absolutely no control over).  The
    problem with that whole plan is this; I double-dog <i>dare</i> you to try to get
    the &quot;bosses&quot; to implement <i>anything</i> that improves security and
    auditability if it&#x27;s going to cost even just ten seconds of extra time, or
    ten cents of extra money.  Ain&#x27;t gonna happen."
