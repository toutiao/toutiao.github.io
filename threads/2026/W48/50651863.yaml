  author: amluto
  text: In some sense, quantum computers and other examples of large-scale coherence
    (LIGO, for example) are probes of quantum gravity in that it’s possible (and maybe
    even necessary) for a theory of gravity to cause some degree of decoherence as
    the state of a system couples to the environment through gravity. In GR there
    are gravitational waves, and in quantum gravity there are (probably) gravitons,
    and those gavitons are quantum things that couple (weakly) to just about everything.  [0]<p>A
    lot of papers have been written about the effects of gravity on coherence, and
    even whether one expects the overall effect to permit long-lasting superpositions
    between states with differing mass distributions to exist is complicated and may
    depend on the theory.  Yet LIGO works, atomic physics experiments work, and small
    quantum computers work.<p>One issue is that we don’t (IMO) actually have a particularly
    compelling theory of the universe that describes both actual gadgets we build
    and a properly causal theory of gravity and quantum mechanics and cosmology and
    actually makes sense.  The OP doesn’t actually model ordinary matter :)<p>(I studied
    quantum information theory and I took a class on cosmology, but I’m not an expert
    on this particular combination of fields.)<p>[0] Do not take this as any sort
    of claim that large quantum computers cannot be built. This has been hashed out
    ad nauseum over the last few decades, and IMO the fairly clear conclusion is that
    quantum error correction works and there does not appear to be any practical physical
    limit to the scale of an error-corrected system.
