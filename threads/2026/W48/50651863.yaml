  author: adrian_b
  text: Those are not predictions, they were constraints used in the derivation of
    this theory.<p>Known facts can be considered as predictions of a new theory only
    when the theory is formulated in a way that is completely independent of those
    facts and then the known facts appear as consequences of the new theory, even
    if there is no logical reason for this to happen, which demonstrates that those
    facts were really superfluous, being derivable from a smaller number of premises.<p>For
    example, a new theory of gravitation could show that the existence of dark matter
    is a superfluous hypothesis, if it could explain the star movements without needing
    dark matter.<p>That would indeed predict a measurable fact that has not been predicted
    by the existing gravity theory.<p>Or a new theory of gravity could compute the
    Newtonian constant of gravity, instead of having to measure it experimentally,
    like in the present theory. This would reduce the number of fundamental constants
    that must be determined empirically.<p>So any prediction of a new theory must
    reduce the number of arbitrary facts that exist in the present theory. As long
    as that number stays the same, the new theory is at best a mathematically-equivalent
    formulation of the old theory. In the worst case, the new theory has additional
    arbitrary parameters that cannot be determined experimentally, so it is more complex
    than the old theory without providing any benefit.
