  author: hecmmm
  text: |-
    Abstract:
    We propose a background independent quantization of vacuum general relativity on four dimensional Lorentzian spacetimes. Starting from first order gravity, we solve the gravitational constraints on intersecting null cones of a bulk subregion and obtain the reduced phase space at finite GN. We promote its canonical Poisson brackets to commutation relations and use deformations of the reduced action to define an algebra of observables. Equipped with this, we use Gaussian wavefunctions of canonical pairs to construct a nonperturbative Hilbert space representation, for which this algebra generates a type I factor. By composing amplitudes between states prepared on null cones, we then obtain a Lorentzian path integral in which each sum over intermediate states converges absolutely. As a check, we compute the amplitude for graviton pair creation and annihilation on a null cone nonperturbatively in GN and find a finite closed form expression, even though expanding first in GN yields a logarithmic divergence. We next use diffeomorphism invariance of the path integral to show that a macroscopic causal diamond with a given maximum size has a finite dimensional Hilbert space. From the Lorentzian trace we obtain the Bekenstein Hawking entropy for marginally trapped surfaces and calculate its logarithmic correction for large Schwarzschild black holes, recovering at one loop the coefficient Sen obtained through Euclidean methods. We end by deriving the semiclassical Einstein equations to one loop as the low energy limit of this theory.
