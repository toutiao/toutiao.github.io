  author: adrian_b
  text: 'For now there exists no evidence whatsoever that space-time is quantized,
    i.e. discrete instead of continuous.<p>This means for example that there is no
    evidence whatsoever that anyone of the primitive quantities time, distance, angle
    and action is discrete and not continuous.<p>(Nota bene: there are a lot of physics
    textbooks that incorrectly mention the existence of a so-called &quot;quantum
    of action&quot;. That is a huge mistake which is the cause of many confusions
    and erroneous results. Action is a quantity that for any physical system increases
    monotonically with time. Therefore it cannot be constant much less quantized.
    Angular momentum, which is the ratio between action and plane angle, can be quantized
    in many physical systems, where its quantum can be either Planck&#x27;s constant
    or its half. There is nothing mysterious about the quantization of the angular
    momentum, it expresses a resonance condition between 2 rotation movements. Planck&#x27;s
    constant, being energy per frequency, where energy is action per time and frequency
    is plane angle per time, is an angular momentum, not an action. Action is a true
    scalar, invariant at coordinate changes. For a particle, action is the integral
    of the Lagrangian over its world line in spacetime.)<p>All the traditional quantum
    physics and quantum field theory are based on the continuity of space-time, which
    is necessary for having any differential equations.<p>There have been some tentative
    theories where space-time is treated as a discrete lattice, but they have not
    succeeded in providing any useful results.<p>(The arbitrary discretizations of
    the space-time that are used to obtain approximate solutions of integro-differential
    equations are very different from having a discrete space-time as the fundamental
    theory, because in the latter case the discretization would have to be unique
    and with measurable parameters).'
