    things, but the idea seems neat and clean at first blush.<p>Spacetime is 3+1 dimensions,
    and null cones are the slices that a pulse of light traces out over it&#x27;s
    lifetime. Really, light is just a stand-in for &quot;thing that travels at the
    speed of causality&quot;, so null cones define regions of spacetime that are causally
    connected. Anything outside that region would have to send matter or signals faster
    than light otherwise.<p>Chandrasekaran claims that looking at how several of these
    regions intersect lets them derive algebraic constraints on how gravity in general
    relativity behaves. They say that this yields a useful path integral, which is
    just an equivalent alternative to using wave functions in quantum mechanics.<p>The
    compelling part is using that to show several exact calculations of things that
    are traditionally hard, with the prize being a claimed derivation of general relativity
    as a special case, in a similar way to how Newtonian gravity is a special case
    of general relativity.
