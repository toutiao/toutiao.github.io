  author: FabHK
  text: There are 4 fundamental forces:<p>1. electromagnetism (initially even electricity
    &amp; magnetism separately),<p>2. strong &amp;<p>3. weak nuclear forces, and<p>4.
    gravity<p>Maxwell unified electricity and magnetism into one theory of electromagnetism
    in the 1860s, then in the 1960s–70s, electromagnetism and the weak force were
    unified into the electroweak theory, and together with the strong force (QCD =
    quantum chromo dynamics) this forms the Standard Model, a single quantum field
    theory framework (GUTs = Grand Unified Theories propose a further unification
    of all three).<p>However, the fourth, gravity, has so far stubbornly resisted
    unification. Gravity is very well described by Einstein&#x27;s General Relativity,
    but it&#x27;s really fundamentally at odds with the quantum mechanics of the Standard
    Model.<p>Combining all four forces into one coherent theory (&quot;quantum gravity&quot;)
    would be the holy grail of physics, the TOE = Theory of Everything.<p>This paper
    claims to be that, IIUC.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Standard_Model"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Standard_Model</a><p><a
