  author: empath75
  text: 'okay, a real problem: With the paper&#x27;s positive (Weyl) ordering, the
    zero-point delay summed over infinitely many harmonics diverges, and the projection
    kills every state. Renormalize away that infinity, and the angle-blindness means
    one allowed graviton implies one in every harmonic, so the dimension is 0, 1 or
    ∞, never finite with gravitons in it. The paper&#x27;s own one-loop check gets
    finiteness from a different, angle-sensitive focusing functional, but only in
    a specific vacuum where the clock loses the positivity the argument needs. Something
    beyond the clock has to distinguish harmonics, and that&#x27;s essentially the
    hard problem itself.<p>This might be fixable, but it&#x27;s not obvious from the
    paper how to do it.'
  score: 0
