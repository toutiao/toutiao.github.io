  author: articulatepang
  text: The article says “This means that for P to equal NP, there must be some trick
    to computing permanents using AND&#x2F;OR&#x2F;NOT on the bits of the input that
    is better than addition and multiplication.”<p>This is implying that if P=NP then
    there must be a polynomial time algorithm for finding the permanent. But that
    isn’t known to be true. It would be consistent with all known results if P=NP
    but computing the permanent is still not possible in polynomial time.<p>Finding
    the permanent of a 0&#x2F;1 matrix in polynomial time is stronger than P=NP; it
    would let you <i>count</i> the number of solutions to NP problems in polynomial
    time.
