  text: One NP problem can be transformed into another... if you can solve an NP problem,
    you can solve all NP problems. It&#x27;s generally trivial to prove that a particular
    problem is NP, and many classes of problems have been proven to be NP. P problems
    can be solved in non-exponential time. That is, if you&#x27;re cracking some crypto
    and the crypto were P instead of NP, it wouldn&#x27;t take you 10 billion years
    or a Matrioshka brain to do it. Crypto is NP by design. Because, for now, we think
    NP != P. And if we were wrong about that...
