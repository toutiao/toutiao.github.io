  content: |-
    Fix 11/26: I attempted to avoid counting complexity, but now realize it made my argument about how P could equal NP incorrect. I give a brief description and change that argument.

    I assume you know about the P vs. NP problem. But what is this wacky thing Anthropic just posted?

    You learned how to take a determinant in your linear algebra class:

    The naive way is fine for 3×3 matrices, but notice that you need to perform Θ(n!) arithmetic operations here. Exercise for the reader is to find the exact number of operations (hint: start with a recurrence relation).

    Luckily, if you paid attention, you will remember there are faster ways to do this for big n×n matrices, like Gaussian elimination. If we stick only to adding and multiplying, we can still find a determinant in polynomial time (there are better ways, but this is an old, readable method).

    A related problem to the determinant is finding the permanent. It’s like a determinant without any subtraction:

    Unlike determinants, there is no known way to compute permanents in polynomial time. In fact, finding the permanent of a matrix of 0s and 1s is in a complexity class thought to be even harder than the NP-Complete problems; it is #P-Complete. This is composed of the hard counting problems, such as #SAT which asks how many different variable assignments satisfy a SAT formula. The counting analogue of P vs NP is FP vs #P.

    What the Anthropic proof that VP≠VNP means is that there is no way to find the permanent if we are limited to arithmetic circuits of size polynomial in the input-size, which look like this:

    What does this imply about P vs NP? Now for P to equal NP, one of two things must be true. Either a fast algorithm for the 0/1 permanent exists using AND/OR/NOT gates (which implies FP = #P) or counting problems are harder than deciding problems. A small intuition against the latter is that the recent resolution of the ETH skipped subexponential SAT and went right to subexponential #SAT.

