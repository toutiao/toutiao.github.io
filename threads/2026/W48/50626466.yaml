  author: fcholf
  text: 'The theory is based on the fact that you are computing (families of) polynomials.
    It gives a nice framework, with reductions and natural complete problems. If you
    add non polynomial gates, you may have to rework the entire theory, I doubt this
    will give you something as neat as the algebraic complexity theory.<p>That said,
    one comment about adding divisions: it is known that you can remove them from
    any circuit as long as their result is a polynomial. That is, if your circuit
    compute P&#x2F;Q at some point and P = QR, then you can show that there is a circuit
    computing R without division (this is a classical result of Strassen in a 1973
    paper &quot;Vermeidung von Divisionen&quot;).'
