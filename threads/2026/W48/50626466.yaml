  text: It wouldn’t.  If P=NP then many problems we think are hard (ie currently require
    exponential time) would in fact be solvable in polynomial time.  But such a polynomial
    time algorithm might be “galactic” in the sense that the constants are so astronomically
    large that in practice the algorithm would not be faster than current methods.<p>Note
    that this is not widely believed to be likely, because usually if a problem is
    in P, then usually further work can improve constants considerably, but it is
    a possibility that there is a certain class of problems in P that are “galacticly”
    polynomial.
