  text: I’m not qualified to answer this.<p>(Well my qualification is this –  I took
    a semester of Theory of Computation class about a decade ago and barely managed
    to pass without screwing up my scholarship in the foreign country I was studying
    in. Today I write PHP during my day job..)<p>One way to try to get the private
    key is to try all possibilities. For an RSA key with 4096 bits, there are 2^4096
    possible keys, which I’m told is greater than the number of atoms in the universe.<p>So
    you see, this is a O(2^n) operation. ie., the algorithm is “exponential”.<p>You’ll
    never finish checking all those combinations before the universe ends, or at least
    not before the Sun explodes and the Earth ceases to exist as we know it.<p>Unless
    you’re really really lucky and a key you try during your lifetime happens to be
    the actual private key. But the likelihood of that happening is practically zero
    because of the sheer number of possibilities.<p>The point is, you have to exhaustively
    check all possible keys. Exponential.<p>P=NP means there exists a polynomial time
    (O(n^k)) algorithm to find the private key. ie., it can be found relatively quickly.<p>This
    is all I know. I skipped a lot of details. Experts can chime in.
