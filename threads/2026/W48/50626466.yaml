  author: inkysigma
  text: Depending on the proof of P=NP and what you mean by &quot;easily&quot;. In
    TCS, anything polynomial is considered &quot;easily&quot; so it could easily be
    the case that some ridiculous polynomial is implied with some ridiculous constants.<p>Suppose
    the proof of P=NP were not constructive, then Levin&#x27;s universal search algorithm
    automatically gives us an algorithm that finds the factors in polynomial time.
    This would satisfy some definition of &quot;easily&quot; from above. However,
    if you take a look at Levin&#x27;s universal search, it quickly becomes apparent
    the constants involved are truly galactic and not worth even thinking about in
    a practical sense.<p>If the proof of P=NP were constructive but gave some incredibly
    high degree polynomial or something with incredibly high constants, then we might
    be more wary. We would be able to get factors in polynomial time but it would
    still be &quot;hard&quot; in a practical sense to get the private key but it becomes
    exceedingly difficult to guarantee that there isn&#x27;t some practically efficient
    algorithm. Proving fine grained lower bounds like this has been difficult to say
    the least.<p>If the proof of P=NP were constructive and efficient, then we would
    easily be able to get the private key. There is some additional detail here about
    what NP complete problem was actually solved (and thus how much the polynomial
    reduction cost but this is typically small) but this is a bit detailed and unclear.
    We would also probably begin searching for a directly efficient factoring algorithm.
