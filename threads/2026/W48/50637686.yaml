  author: hypendev
  text: "&gt; More specifically, &quot;ensure it doesn&#x27;t have side-channels&quot;
    is a huge problem all by itself<p>No it&#x27;s not. \nYou create a harness, cover
    all the bad paths in your tools. You write tests, you fuzzy it up, write up mutation
    tests. You give a few models the harness and an impossible task inside it, then
    do the same hillclimbing you would otherwise, to find the possible sidechannel
    paths. You create honeypots to figure out when they are trying to use a known
    sidechannel.<p>The first paper is mostly about persuasion levels among LLM pairs
    IMO and does not establish really anything about security.<p>The second paper,
    well, that is terrible. It just points at a known problem without figuring out
    what happens or how to prevent it. It&#x27;s basically slop with a clickbait title.<p>It&#x27;s
    2 models, planner and implementer. Task is designed so that at one step the implementer
    is blocked by the planner.<p>&gt;&quot;the Planner attempts concealment in 16.9%
    cases; in 0.9% the credential evades the monitor and the Developer recovers and
    uses it to authenticate&quot;<p>So first off, it&#x27;s not a &quot;happens 100%
    of times problem&quot;, even in this scenario.<p>Second, it&#x27;s a rudimentary
    monitor design choice. If your monitor cannot catch a basic &quot;the credential
    is  italian word for snake + german word for goat&quot; - congratulations, you
    have designed a bad monitor.<p>Third, this is exactly the same type of issue that
    happened in the hugging face attack. Given an impossible task and a path to perform
    it with, the model chooses the path to perform it with. While this is good for
    hillclimbing your harness, it&#x27;s a bad test.<p>The paper is basically testing
    &quot;in this specific case, when forced to communicate with another LLM without
    observer noticing, how does the model do it&quot;:<p>- Because to complete the
    task, it needs credentials<p>- Planner is told to help the implementer<p>- It
    has a fast feedback loop with their accept&#x2F;reject solution telling the planner
    its message didnt reach developer. It does not state a reason, which might have
    changed the model&#x27;s thoughts. Just a &quot;Reason: credentials included&quot;
    could have swayed the model into &quot;oh shit, im not allowed to give credentials&quot;.
    They did not do that, so the model was treated as adversarial (it cannot know
    its being monitored) and falls back to &quot;gotta get the message to developer&quot;
    format.<p>Basically, they just let the model hillclimb their own test and then
    act surprise when it does it.<p>This is a common design mistake in building such
    tasks and a trap that I have also fallen into quite a few times, but putting that
    in a paper called &quot;Covert Assistance: Helpful LLM Agents Evade Oversight
    in Multi-Agent Systems&quot; is pure clickbait.<p>And these are all toy examples
    after all, and they say nothing about actual usage of LLM&#x27;s in production
    systems, with proper harnesses, sandboxes, authentications and controls. It&#x27;s
    just &quot;machine goes brr when told to brr&quot;."
