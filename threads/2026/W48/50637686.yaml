  author: tsimionescu
  text: 'Browsers do that too: when you are the first person to retrieve a JS library
    stored by a CDN from your area, you will wait, say, 2s until it loads, and you&#x27;ll
    get some headers indicating that this item was retrieved exactly when you requested
    it. When another user&#x27;s browser requests the same JS lib from the same CDN
    from the same area, they will get the result in, say, 500ms, and the headers will
    indicate it was retrieved, say, 2 minutes ago.<p>Two browsers that are the only
    two clients of the same local cache of a CDN can use this sort of thing to communicate
    with each other.<p>What browsers don&#x27;t allow is a similar collusion between
    two different servers that different tabs have accessed. Server 1 can&#x27;t use
    your local browser cache to communicate covertly with Server 2, since the browser
    keeps entirely different caches even when loading the exact same content from
    either origin.'
