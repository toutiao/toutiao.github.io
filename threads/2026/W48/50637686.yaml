  author: amluto
  text: 'This shared LV cache thing is, in my mind, ridiculous. Web browser developers
    learned, quite a while ago, that caches need to be separated for different origins.
    Inference servers should add a similar feature: allow API calls to specify cache
    separation keys that prevent one security context from probing another context’s
    cache.<p>As for the step size issue, Google recently had a post about producing
    exactly consistent output across different kernels (specifically by defining a
    deterministic prefill algorithm and then requiring all kernels to generate results
    exactly equal to prefilling on the sequence in question).<p>More broadly, I think
    it’s a bit odd to frame this as “models” communicating. This is <i>software</i>
    communicating, and the models happen to be running the software.'
