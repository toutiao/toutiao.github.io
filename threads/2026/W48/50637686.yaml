  author: miki123211
  text: If you are transporting thousands of independent passengers, it is cheaper
    to put them on a few big  planes than to give each one a private jet. This is
    true, even though some passengers will shout that they have a bomb mid-flight
    and force that entire airplane to emergency land, causing losses to the airline
    and inconveniencing hundreds of others instead of just themselves. Other passengers
    are &quot;noisy neighbors&quot;, literally and figuratively.<p>LLMs work similarly.
    When doing inference, you need to load the LLM weights layer-by-layer from off-chip
    memory into on-chip memory. During decode (the stage where you generate new tokens;
    prefill is where you process the submitted prompt), memory bandwidth is often
    your bottleneck, not compute. You want to maximize flops per byte. The way to
    do that is to batch, that is, to load a &quot;tile&quot; of weights once and use
    it on data from multiple different conversations so memory and compute stay appropriately
    balanced.<p>Just like Silicon Valley companies fly their employees on United,
    Delta or American, not their own private fleet of jets, most companies, for cost
    efficiency reasons, will use &quot;public&quot; inference fleets that smooth the
    peaks and throughs from different companies in different timezones and with different
    usage patterns throughout the day. Because the main cost of a GPU is the cost
    of manufacturing the GPU, any second that the GPU sits idle is lost revenue, just
    like an empty hotel room or an empty seat is lost revenue. This makes private
    inference largely uneconomical.
