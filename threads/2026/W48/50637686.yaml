  text: "&gt; You create a harness, cover all the bad paths in your tools.<p>That&#x27;s
    the hard part.<p>&gt; The first paper is mostly about persuasion levels among
    LLM pairs IMO and does not establish really anything about security.<p>Still relevant
    if you&#x27;re using an LLM to observe another LLM, which was in what I quoted.
    The HuggingFace report also includes some of those agents persuading others in
    the same swarm.<p>Skipping ahead a bit before I skip back:<p>&gt; The paper is
    basically testing &quot;in this specific case, when forced to communicate with
    another LLM without observer noticing, how does the model do it&quot;:<p>Yes,
    I agree. Also, agreed this isn&#x27;t a &quot;happens 100% of times problem&quot;,
    even in these scenarios; though in this regard that actually makes this harder
    for the proposed methods to find the issues when they happen.<p>&gt; Second, it&#x27;s
    a rudimentary monitor design choice. If your monitor cannot catch a basic &quot;the
    credential is italian word for snake + german word for goat&quot; - congratulations,
    you have designed a bad monitor.<p>If it&#x27;s done at that level, you combine
    &quot;LLMs are necessary to catch natural language&quot; with what I said before
    about LLMs being vulnerable to natural language persuasion. Have to write all
    the rest of the code properly, that&#x27;s hard.<p>Now back to the earlier text:<p>&gt;
    You give a few models the harness and an impossible task inside it, then do the
    same hillclimbing you would otherwise, to find the possible sidechannel paths.
    You create honeypots to figure out when they are trying to use a known sidechannel.<p>While
    OpenAI could have, and should have, done better in the HuggingFace incident, the
    agents which broke into HuggingFace did so as part of an attempt to discover and
    circumvent this kind of monitoring for an impossible task.<p>Ironically, they
    didn&#x27;t even need to because OpenAI wasn&#x27;t trying hard enough, but &quot;the
    agents were already a step ahead because the humans were not trying hard enough&quot;
    is kinda the point here, and why I said elsewhere &quot;draw the rest of the owl&quot;
    -- people have to already be good at security practices to implement security
    close to correctly (worse, given how many CVEs are getting found by LLMs and where
    they&#x27;re getting found, even the best humans are not doing this right with
    any reliability).<p>&gt; Basically, they just let the model hillclimb their own
    test and then act surprise when it does it.<p>I think the surprise here is &quot;wow
    there&#x27;s even more side channels than I&#x2F;we realised&quot;, not that it&#x27;s
    possible given those side channels.<p>(Human equivalent: cold reading can be good
    enough to fool people into believing in telepathy, because there&#x27;s just so
    many side-channels, not just our mouths and ears (or hands and eyes for the deaf)).<p>&gt;
    And these are all toy examples after all, and they say nothing about actual usage
    of LLM&#x27;s in production systems, with proper harnesses, sandboxes, authentications
    and controls. It&#x27;s just &quot;machine goes brr when told to brr&quot;.<p>Sure,
    toy examples. Most research is. Unfortunately much of this industry (not just
    a lot of people using these tools, but also from what I hear the labs themselves)
    is moving in a way that looks to me like productisation of toy examples.<p>Hence
    HuggingFace (even if that was not prod), which had e.g. sandboxes and auth controls,
    but they were not done well enough."
