  author: wat10000
  text: Web services don’t cache <i>private</i> info across users. Consider a file
    storage service. You might have the client hash the file before uploading and
    skip the upload if you already have a file with that hash. This is smart design
    if it’s being used as a sync service. You might make this happen systemwide, so
    if user A uploads a file and then B uploads the same file, B can skip the upload.
    This must not be done. Your service now becomes an oracle that tells you whether
    someone else using the service has uploaded a particular document. Find a document
    that gets filled out with name and date of birth, and if you know the name of
    someone using the service and they’ve uploaded a filled-out copy of this document,
    you can discover their date of birth.<p>Put more concretely, it’s OK if Netflix
    caches across users (technically, someone can leak the data that someone in the
    metro area has recently watched Morbius, but the amount of data leaked is too
    small to matter) but not ok if Gmail does it.<p>A KV cache shared across users
    is pretty dangerous and I’m surprised anyone does this, aside from some known
    fixed prefixes.
  score: 0
