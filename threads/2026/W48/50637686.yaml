  text: Your explanation is very good at building intuition, but it has a data flaw
    - vLLM, at least, only does batching in the prefill phase, never the decode phase.
    It can simultaneously compute the KVs for multiple queries from multiple users
    if they all fit within a given prefill window (put multiple people on the same
    plane in your analogy), but once that is done the decode stage can only process
    one query at a time (the destination airport only has taxi service, no trains
    or connecting flights).
