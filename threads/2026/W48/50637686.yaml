  author: miki123211
  text: This is a spectrum of tradeoffs between privacy and speed.<p>A single browser
    cache would greatly accelerate page loading (particularly on fast computers using
    slow networks, think a MacBook pro on a train through the countryside).<p>Same
    with AI; not caching common prefixes like system prompts and tool schemas (particularly
    across many short rollouts, each in its own caching context) would partially fix
    this, but could break performance.<p>I suspect that inference servers have far
    more side channels than this though. Ultimately, how fast responses are generated
    depends partly on server load, and that is something you might be able to influence.
    Probably not at Anthropic scale, but possibly at &quot;relatively small cluster&quot;
    scale.
