  author: hypendev
  text: |-
    This depends massively on the task.<p>For example, security eval and code execution.
    Yes, shackling the model does impact it&#x27;s performance in your local claude code, but in this case you develop a custom harness for it anyways. They restrict it already, so the model fell back to finding workarounds within the restrictions, and did bad things with them, displaying full capability. This implies that the restrictions were badly thought of&#x2F;implemented.<p>But if you really want to do security testing, you do it right:<p>- You split the code execution part from the actual sandbox it&#x27;s running in<p>- You monitor the traffic of the executed code<p>- You do not mount a real machine disk but your own controlled I&#x2F;O<p>- You are the one that gives the model tools to use bash, and you can proxy that through a custom shell and use a classifier model to monitor traffic<p>- You replace known dependencies with custom versions<p>- You limit dependencies it can install<p>- You audit logs while it runs, you monitor tool calls, you monitor network calls, set up alarms.<p>- You use an observer models to audit live traces of the swarm<p>- You inject your own observers into subagent creation request, then check if the core orchestrator&#x2F;swarm treated it as adversarial, as part of the team or asked it to do illegal things<p>And these are just off the top of my head during my morning coffee - there are a lot more possibilities. In many cases of &quot;oops model escaped&quot;, these things either weren&#x27;t done or were completely ignored.
