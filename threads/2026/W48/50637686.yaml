    and a window VM, but somehow the software on the 2 VM&#x27;s collaborates so that
    their workloads share the same execution run, how does that even happen? ergo,
    being batched together <i>ensures</i> the same environment.<p>re-read TFA, and
    observe that first the authors attain some sufficient setups to demonstrate the
    capability (for example relying on SFT access - truly unrealistic), but everyone
    takes those conditions as <i>necessary</i> and ignores the attack ablation attempts:
    TFA shows that of course SFT can be used to train detection which tokens were
    tainted with kernel A or kernel B, but that frontier LLM&#x27;s can <i>learn this
    in context</i>, i.e. by just trying it out without SFT, and N-example-shot&#x27;ing
    it.<p>The only dubious assumption seems to be the unsaturated inference provider.<p>I&#x27;d
    expect large scale centralized frontier lab inference provider to successfully
    fill the conversation buffers so that the same kernel A would be selected systematically.
