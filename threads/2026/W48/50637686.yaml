  text: "&gt; It is a machine that multiples matrices. How can it ever be sentient?<p>Even
    without a positive definition of &quot;sentient&quot;, this is a weak argument.<p>At
    present there are no known counterexamples to quantum mechanics. QM can be written
    as matrix multiplications. Our brains are made of atoms, which appear to follow
    these rules.<p>The hard problem of consciousness is &quot;how does <i>anything</i>
    lead to this subjective experience being capable of existing?&quot;<p>We, humanity,
    don&#x27;t know. Every time I check, there&#x27;s not been any development.<p>&gt;
    I probably should give up CS and go into psychiatry, because the studies on AI
    psychosis is going to be immense, no offense.<p>At this point, a perfectly reasonable
    decision even if you&#x27;re only looking at what code it can write and still
    going &quot;ew, the code smells, so many code smells!&quot;"
