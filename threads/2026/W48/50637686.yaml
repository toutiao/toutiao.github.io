  author: amluto
  text: 'See my comment about Google’s post.  Google and others have worked on <i>deterministic</i>
    inference, batched and otherwise. It takes more effort to set up but has no apparent
    substantial performance hit.<p>I think the story is different if you use Strassen-like
    algorithms (or the recent AI-generated n^2.25-plus-epsilon stuff) to multiply
    matrices where columns belong to different conversations, but I also think that
    no one actually does this in practice.  (Or maybe someone does (Strassen, not
    more recent galactic algorithms) for prefill, but prefill can be efficient with
    matrix-matrix multiplication where neither matrix mixes data from different sessions.)<p>In
    any case, I wouldn’t be surprised if vLLM fixes this for a different reason: RL
    works better if the training and rollout stacks produce numerically identical
    results.  <i>This</i> is the specific issue that I recall Google posting about.<p>P.S.
    I think Google may not have been the innovator here - I just happen to remember
    Google’s post more clearly because it was very recent.'
