  title: New York's Latest Bill Takes Aim at Car Manufacturers and Dealers
  fetch_status: success
  content: |-
    [
    _Chris_
    ](//wgna.com/author/christophercappiali/)

    [Chris](//wgna.com/author/christophercappiali/)

    - [Share on Facebook](http://www.facebook.com/sharer.php?u=http%3A%2F%2Fwgna.com%2Fcar-bill-extra-fees%2F%3Ftrackback%3Dfbshare_mobile "Share on Facebook")
    - [Share on Twitter](http://twitter.com/intent/tweet?text=New%20York%20Bans%20Subscription%20And%20Post-Purchase%20Fees%20On%20Cars%20http%3A%2F%2Fwgna.com%2Fcar-bill-extra-fees%2F%3Ftrackback%3Dtwitter_mobile%20%40WGNAFM "Share on Twitter")

    Everything needs to be&nbsp;"smart" these days. Your refrigerator, your thermostat, your washing machine, etc., they all have some subscription fee or internet connectivity that doesn't actually help.

    One of the most complained about "smart" devices though, is your car, but New York getting rid of that for good.

    ### No Extra Fees!

    On November 23rd, New York State Governor Kathy Hochul announced [Bill&nbsp;S.9348A/A.10411A](https://www.governor.ny.gov/news/money-your-pockets-governor-hochul-signs-bill-restricting-exploitative-vehicle-subscription). This bill aims to put money back in New Yorkers pockets by prohibiting any vehicle manufacturers, dealers, or third-party providers from charging consumers more money for locked services or subscription fees.

    ![black car interior \](https://images.unsplash.com/photo-1553260188-75a8d6205b6c?crop=entropy&amp%3Bcs=srgb&amp%3Bfm=jpg&amp%3Bixid=M3w4MTAzODB8MHwxfGFsbHx8fHx8fHx8fDE3OTU0NjM3NTR8&amp%3Bixlib=rb-4.1.0&amp%3Bq=85&amp%3Bbid=81&w=980&q=75)

    _Photo by Bram Van Oost on Unsplash_
    black car interior \

    This specifically targets newer vehicles that may lock pre-installed features (like heated seats or screen compatibility) behind a paywall or subscription service. This is becoming more and more of a problem as years go by, and consumers have been very vocal against the practice, but this is a tangible step that can be taken to end this practice before it gets too out of hand.

     ![107.7 WGNA logo](https://townsquare.media/wp-content/uploads/2019/05/WGNAFM.png?w=100)

    Get our free mobile app

    ### Why is This a Big Deal

    As&nbsp;technology and pay-to-play services keep improving, consumers get less and less of what they paid for. What used to be an added feature in a vehicle now becomes a separate payment you have to take care of, sometimes monthly, instead of a down cost to install the service.

    When asked about the bill, **New York Attorney General Letitia James** stated: "No one should have to pay recurring fees just to use features in a car they already bought. My office has secured millions of dollars for New Yorkers throughout the state who were charged illegal junk fees when purchasing a car. Unfair fees are fueling rising costs, and I am proud to work with Governor Hochul and the legislature to bring costs down."

    The bill will go into effect on February 27th, 2027.

