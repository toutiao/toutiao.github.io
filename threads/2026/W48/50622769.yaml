  author: ssl-3
  text: 'The trouble, as I understand it, is this:  It&#x27;s a software feature.  All
    of the seats (at least for the US market) are built with heaters, and all of them
    are wired to support it.  The parts are all physically present on all of the cars,
    which simplifies both inventory and production line management.<p>So birfurcating
    the seat production and wiring harnesses to provide cars without that hardware
    is unlikely to reduce cost.  It is instead more likely to increase it.<p>I don&#x27;t
    like the fact that it&#x27;s just a fee to buy the intangible license to use the
    hardware that is already physically present, but we computer folks should already
    be familiar with that kind of thing whether we like the concept or not.  :-&#x2F;<p>Eg,
    <i>&quot;That&#x27;s a real nice Meraki network switch you&#x27;ve got there.  Shame
    you can&#x27;t do anything useful with it until you pay me again.&quot;</i><p>(Building
    cars to support missing features is pretty normal in BMW world and has been for
    quite a long time.  For instance, my US-market BMW E36 sedan was built in 1995
    and came pre-wired for a CD changer and a BMW alarm system, just like nearly of
    the rest of them sold here were.  It has never been equipped with either accessory,
    but they were simple things for a dealer to install.  Mine even came with a front
    body harness that supported headlight motors (for up-and-down aiming from the
    driver&#x27;s seat as is common in some places like France), even though literally-zero
    US-market cars were delivered with that function and adding it was never on the
    list of options here.)'
  score: 0
  posted_at: '2026-11-24T05:23:18Z'
- id: '50624132'
  parent_id: '50622769'
  author: '0xbadcafebee'
  text: 'I agree with this in general, but there was an opportunity to actually reduce
    the cost of the vehicles by sprinking some extra language in.<p>Without the subscription:
    If a manufacturer makes a vehicle with an <i>option</i> for heated seats, you
    have to buy a car that either has the heated seats, or doesn&#x27;t. That means
    the dealer has to order and stock two completely different vehicles, and the manufacturer
    has to produce two variations of the car (or you can special-order one with&#x2F;without
    the feature, which isn&#x27;t cheap or quick). That all makes production more
    expensive, and puts more expense on dealers who pass that expense on to you.<p>A
    subscription is obviously bullshit corporate greed that doesn&#x27;t provide the
    consumer any value. But the law <i>could have</i> presented companies with the
    option to provide a <i>reasonably-priced one-time payment</i> for enabling a heated
    seat feature. That way manufacturers could build and ship every car with the heated
    seats. The customer would pay <i>once</i> to turn it on.<p>You pay less for the
    &quot;disabled feature car&quot;, but can pay a <i>reasonable, permanent, one-time
    cost</i> to enable the feature later. This reduces waste in production and delivery,
    lowering cost. And even for non-digital add-ons, production would be cheaper if
    they can optimize the car for all of them having identical wiring harnesses&#x2F;accessories.
    Right now there might be hundreds of different steps for production, depending
    on which add-ons they need to build in, and dealers have to stock different versions.
    If a dealer doesn&#x27;t have the option the customer wants, they may just skip
    buying it so they don&#x27;t have to wait (potentially months) for one to be shipped.'
