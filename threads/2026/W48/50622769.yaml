  text: 'To support your concept about used BMWs:  I got a rather opulent, used E36
    (1990s 3-series) for $6,500 (~$11.5k today) in 2004.  I then drove the snot out
    of it for over 15 years.<p>For the price:  It was a very economical car to drive
    over that period, even including the cost of swapping it to a manual gearbox (~$2300,
    including labor and buying&#x2F;fetching an entire donor car) after the auto shit
    the bed one morning.  The rest was just mostly-regular-ish stuff:  I fed it tires,
    brakes, and suspension parts at a rate similar to any other old car that gets
    driven.<p>If it had an inherent flaw, it was that all of the factory cooling system
    parts were self-destructive. But the aftermarket understood that and offered excellent
    replacements that were inexpensive, so it was still cheap to run as long as I
    did that sort of light-duty wrenching myself.<p>But to support OP&#x27;s concept
    about new BMWs being expensive, I agree with them, too:  It was, at one point,
    a <i>very expensive</i> little car.  The sticker price was $37k, in 1995 dollars
    -- or about $80k today.<p>You&#x27;re both correct.'
