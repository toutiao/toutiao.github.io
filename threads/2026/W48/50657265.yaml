  author: badsectoracula
  text: But the point of choosing this is that these other projects don&#x27;t just
    make inference go fast but they also change how the results are calculated:<p>&gt;
    as these projects have evolved, that relentless chase toward higher token generation
    speeds has taken an unfortunate turn, in that the optimizations are less about
    hardware-specific changes, but more about changing how the model thinks so that
    it goes brrr faster.<p>&gt; Strata specifically has taken to preferring to poll
    experts loaded in VRAM even if other experts (pushed to system RAM&#x2F;disk)
    would have been normally chosen. This is just one example, but certainly not the
    last.<p>Changes like the one in Strata can degrade the model&#x27;s performance.<p>And
    TBH it seems to be so common all these videcoded &quot;make stuff go faster&quot;
    do changes like that that personally i have a hard time trusting anything other
    than llama.cpp (and TBHv2, that includes the linked repository - i&#x27;d rather
    wait for all those improvements reach the mainline llama.cpp).
