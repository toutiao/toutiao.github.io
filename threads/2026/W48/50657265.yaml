  author: rao-v
  text: Early in 2025 a bunch of folks realized that AMD made a bunch of cards with
    mediocre compute but incredibly fast HBM2 memory in their circa 2018 gfx906 datacenter
    series, so you could get 32GB VRAM capable of incredible 1 TB &#x2F; s bandwidth
    for $200 (the closest in today’s cards is north of $3000)<p>There has been a rich
    little ecosystem of folks optimizing llama.cpp for these odd cards (no tensor
    cores, no native bf16 etc.) including my little personal repo <a href="https:&#x2F;&#x2F;github.com&#x2F;kinchahoy&#x2F;llama-of-vega.cpp"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;kinchahoy&#x2F;llama-of-vega.cpp</a>.
    Stuff like this focused on more modern RDNA doesn’t help us at all.<p>It’s been
    interesting to see how much each new frontier model can figure out in terms of
    optimizing for these GPUs and what they can’t!<p>Fable and Astra will regularly
    run out of ideas until I point them to someone’s actually thoughtful repo and
    then they’ll diligently incorporate ideas.<p>The optimization wins are huge (I
    was initially skeptical that per model kernel optimizations would be worth much).
    27B at a pristine Q8 quant goes from base llama.cpp at some 250 pp &#x2F; 25 tg
    to 600 pp &#x2F; 40 tg even before speculative decoding.
