  author: dofm
  text: I saw some blurb a while ago that described llama.cpp as a “model zoo”, which
    is a great description of its utility and generality.<p>In the last couple of
    days I have been playing with Erik Paperniuk’s M1 port of Inco’s Splash, which
    has completely transformed the speed of Qwen 3.8 27B and Inkling 2 Mini; it has
    essentially tripled the speed of the former and more than doubled the speed of
    the latter.<p>This means the Qwen model is fully viable on an M1 Max, where before
    I had found it a bit of a waiting game. And it arguably transforms the utility
    of Inkling 2 Mini; extra speed means it can be left to reason for longer, the
    downside of needing to do more tool use for search to patch its knowledge is reduced,
    and it provides a good rough chat model (though this is not its area of greatest
    strength).<p>I have not yet found anything that can boost Muse Glimmer to the
    same extent; I would still prefer that.<p>But for me I now find that only the
    rather slow prefill speed really holds the M1 Max back; I suspect these new custom
    kernels have made the M5 Pro Mac Mini a really cost-effective option if you want
    to tinker with local AI.
