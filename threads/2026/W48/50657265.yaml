  author: exyi
  text: 'Reproducible on the same inference engine. Most of the attention optimizations
    rely on &quot;-Ofast-math&quot; optimization, i.e. the results are different,
    hopefully not by much. I think pixelesque is right that this deserves more attention,
    there have definitely been cases of significant regression of output quality.
    Most likely even in Anthropic&#x2F;OpenAI APIs, not just in vibe-coded llama.cpp
    forks.<p>This guy benchmarked this for vLLM attention backends with its-not-great
    results: <a href="https:&#x2F;&#x2F;forum.level1techs.com&#x2F;t&#x2F;why-your-local-llm-feels-dumber-than-it-is&#x2F;253917"
