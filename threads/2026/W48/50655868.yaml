  author: flaunf221
  text: 'The choice is not binary between hjkl and arrow keys.<p>It could be (non-exhaustive
    list):<p>jkl; - actual resting home row position<p>ijkl - no hand movement, no
    pinky usage (also mirrors arrows and controls that are structured that way outside
    of your keyboard)<p>asdf - right hand resting home row position<p>esdf - right
    hand, no hand movement, no pinky (gamers used to wasd would love it)<p>Having
    navigation single key shift away from resting position has no upsides that I can
    see. It takes premium home row space, except it fits only 3&#x2F;4. So you either
    shift your hand all the time, or your index finger is now busy with both right
    and down and is moving laterally.<p>And if it&#x27;s not actually important, why
    is it on home row and not say bottom row: m,.&#x2F; - you&#x27;d just curl your
    fingers and access movement without shifting of your hand.<p>So the explanation
    today is nothing other than &quot;Our ancestors did it this way and so shall you,
    youngster. Scientific basis is overrated and we are not trying new things.&quot;.'
