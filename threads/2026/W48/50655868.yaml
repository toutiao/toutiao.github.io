  author: skydhash
  text: I don’t know how the highlight engine is coded, but I do know that it’s regex
    based. You moslty have to try every regex on every line. And for some lines you
    have to try it more than once (think tags).<p>When it doesn’t match, it’s ok.
    When it does match you jave to create new structures, adjust their priorities.
    And for the renderer, every scrolling means reissuing the ansi excape code according
    to some theme.<p>All of this are probably bound to the number n of characters
    in a line. And for big n, that means a lot of operations. Emacs also struggle
    with long lines.
