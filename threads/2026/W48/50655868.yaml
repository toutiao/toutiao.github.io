  author: thanato0s
  text: Regexes are line-based most of the time. And so the more characters you have
    on the line, the more work the engine has to do to parse it. I guess with greedy
    quantifiers you need to go to the end of the line and then match from there, and
    I don&#x27;t think that&#x27;s free. Multiply that by the crazy amount of regexes
    Vim native highlighting uses and the engine begins to struggle.<p>That being said,
    I didn&#x27;t look at the code of the engine itself, so I don&#x27;t know for
    sure. But I know that disabling the highlighting get rid of these kind of issues
    most of the time.
