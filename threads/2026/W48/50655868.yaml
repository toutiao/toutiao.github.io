  author: JdeBP
  text: Everyone remembers the hjkl keys, even though almost no-one has an ADM-3 keyboard
    where those keys have arrows engraved on their tops, or even an ADM-3A itself
    (let alone an ADM-3).<p>Few in contrast remember that vi from the start had forward
    space (SPC), backward space (BS), next line (⎈N SO) and previous line (⎈P DLE)
    for navigation in normal mode.<p>I hope that your vim book teaches arrow keys
    first, arrow keys being a thing that we&#x27;ve had in the world of terminals
    since around 1970, the forwardspace&#x2F;backspace&#x2F;next&#x2F;previous next,
    and the hjkl last.  I think that it really does not serve novices to teach them
    the way to use vim that matches a 1976 terminal that they do not have, and does
    not match what the modern keyboard that they do have in front of them has.<p>*
    <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48753333">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48753333</a><p>Don&#x27;t
    make the mistake that Dougherty and O&#x27;Reilly made in their 1987 book, of
    claiming that some terminals might not have arrow keys.  Even by 1987, terminals
    without arrow keys had become a rarity, thanks to the PC revolution and whatnot.  40
    years later still, that&#x27;s an understatement.
