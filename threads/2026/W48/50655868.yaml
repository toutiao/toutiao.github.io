  author: QuantumNomad_
  text: I’ve been using Vim for over 15 years, but never tried to learn everything.<p>Learning
    the basics like getting used to hjkl instead of arrow keys, and knowing how to
    jump around like to the top or bottom or a relative number of lines, and learning
    how the verbs work so that you can “delete inner word” diw and “change inner word”
    ciw, and how to use regex on whole file and on visual selection, and making a
    block visual selection, and indenting a visual selection, covers a lot of what
    I do. Also knowing how to record and play short macros is sometimes useful, but
    I only reach for macros a couple of times a month at most.<p>I might be less efficient
    than someone who knows Vim truly inside and out, but I’m pretty happy with what
    I get out of Vim with what I’ve learned.<p>I might come back to this book though,
    to pick up some more knowledge on Vim. But I have some other books to read first,
    so I’m not going to buy it today or in the next few months.
