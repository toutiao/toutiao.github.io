  author: JdeBP
  text: You just quoted something that gave something else, people coming in for a
    game, as the reason, so it cannot be the entire reason.  And in fact it not only
    is not the entire reason, it isn&#x27;t even (as I said) technically the reason,
    as all of the stuff with Best Deals Of The Year and Don&#x27;t Miss Out On Our
    Black Friday Promotion didn&#x27;t exist until retailers tried to re-brand it
    as a positive thing in the 1980s.<p>Moreover, the <i>Inquirer</i> is pretty much
    the closest that one can get to the source, given that it&#x27;s about policing
    traffic in Philadelphia.  Here&#x27;s a piece in the <i>Inquirer</i> that traced
    it back a different way to the same origin, traffic and police, a decade and a
    half after Barret&#x27;s own pretty definitive account (since xe and Gleger wrote
    the reportage in the <i>Philadelphia Bulletin</i> that used the name):<p>* <a
    href="https:&#x2F;&#x2F;inquirer.com&#x2F;philly&#x2F;news&#x2F;breaking&#x2F;20111125_Black_Friday_started_in_Philly.html"
    rel="nofollow">https:&#x2F;&#x2F;inquirer.com&#x2F;philly&#x2F;news&#x2F;breaking&#x2F;20111125_Black_Fri...</a><p>People
    like to quote sports reporter Gordon S. White Jr&#x27;s early use of the name
    in the <i>New York Times</i>, too, but as the earliest example that they can find
    that starts to lean more heavily on the shopping aspect, in 1975.<p>* <a href="https:&#x2F;&#x2F;www.nytimes.com&#x2F;1975&#x2F;11&#x2F;29&#x2F;archives&#x2F;army-vs-navy-a-dimming-of-splendor-armynavy-dimmed-splendor.html"
    rel="nofollow">https:&#x2F;&#x2F;www.nytimes.com&#x2F;1975&#x2F;11&#x2F;29&#x2F;archives&#x2F;army-vs-navy-a-d...</a><p>Ben
    Zimmer and others around the same time as the <i>Inquirer</i> piece chronicled
    how the &quot;in the black&quot; false back-story was a bit of marketing spin
    begun in the 1980s, when the name started to become synonymous with nasty experiences
    for those in the retail and transport and other sectors, outwith Philadelphia.  <i>Of
    course</i> the people who profited, as opposed to the people who had to deal with
    the traffic and whatnot, didn&#x27;t want it being recognized as a piece of cynical
    police and retail&#x2F;transport worker slang.  So they tried to turn it into
    being about shopping and deals and economic boosts and all that jazz.<p>* <a href="https:&#x2F;&#x2F;vocabulary.com&#x2F;articles&#x2F;wordroutes&#x2F;the-origins-of-black-friday&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;vocabulary.com&#x2F;articles&#x2F;wordroutes&#x2F;the-origins-of-bl...</a><p>*
    <a href="https:&#x2F;&#x2F;languagelog.ldc.upenn.edu&#x2F;nll&#x2F;?p=4335" rel="nofollow">https:&#x2F;&#x2F;languagelog.ldc.upenn.edu&#x2F;nll&#x2F;?p=4335</a><p>Amusingly,
    the people saying that it&#x27;s not the day to do any shopping are as a side
    effect reclaiming the original meaning of it being a Friday of bad things.
  score: 0
