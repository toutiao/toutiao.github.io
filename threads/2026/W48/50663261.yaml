  author: JdeBP
  text: It is interesting that this is a U.K.-based campaign.  Here in the U.K. I
    have this year been following the price of an item at Currys (a vendor of white
    goods and general electrical items).  Currys has been a major pusher of the &#x27;Black
    Friday&#x27; idea for quite a few years now.<p>Attaching a shopping idea to a
    foreign country&#x27;s holiday was not an easy sell.  (That this WWW site has
    been going since 2000 largely lines up with &#x27;Black Friday&#x27; entering
    the world of retail in the U.K..  It was a totally alien idea in the 20th century.)<p>During
    the summer, the item was on sale.  Alas, I missed the sale because of bad timing,
    and it went back up to its non-sale price that is £700 more expensive.<p>The retailers
    who push &#x27;Black Friday&#x27; imply that this is the time of the year when
    the punters get the best sale prices.  (It used to be the case in the U.K. that
    that was during the &#x27;January sales&#x27;, but that has largely disappeared
    from the retail world in practice, partly because retailers do tighter stock control
    nowadays, and partly because of this.)<p>It isn&#x27;t.  Currys has the item on
    sale, alright.  It&#x27;s at only £400 off non-sale price, though.<p>After all,
    if one is a retailer who has spent nigh on two decades pushing the idea that this
    is when the punters should do their shopping, although one is legally bound to
    offer sale prices, there&#x27;s no incentive any more, now that the punters are
    trained with years of incessant advertising to Buy Now, to actually offer the
    best deals.
  score: 0
