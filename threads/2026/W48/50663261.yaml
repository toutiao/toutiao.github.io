  content: "Buy Nothing Day was started by Adbusters in the early 90's and has since
    grown into an international event celebrated in more the 50 countries. Its is
    a simple idea, which challenges consumer culture by asking us to switch off from
    shopping for a day. The day is celebrated as a holiday by some, a street party
    by others - anyone can take part provided they spend a day without spending!  \n
    \ \n The UK campaign and website was created in 2000 by Michael Smith a graphic
    designer who cares passionately about environmental and ethical issues. The message
    has always been simple, ‘Shop Less, Live More’. Twenty one years on - the message
    couldn't be any simpler - WE NEED TO CONSUME LESS! Recycling is good - reducing
    is better!  \n  \nThere are serious issues linked to shopping, which expose the
    environmental and ethical consequences of consumerism. The rich western countries
    - only 20% of the world population are consuming over 80% of the earth's natural
    resources, causing a disproportionate level of environmental damage and unfair
    distribution of wealth.  \n  \n As consumers we need to question our culture of
    shopping. We all have different needs and ultimately we are all consumers and
    will never be able to escape culture altogether. But this shouldn’t stop us from
    questioning the products we buy or challenging the companies, who produce them.
    After all, what are the true risk consumerism poses to the environment and developing
    countries? The arguments are infinite - but there is no reason why we shouldn’t
    be looking for simple solutions now because one day we may be forced to change.
    \ \n  \nThe issues connected with Buy Nothing Day are broad and deep, however,
    the campaign focuses on promoting ethical and responsible consumerism, recycling,
    re-using and ultimately cutting back on what we consume - its a big challenge!
    \ \n  \nPeople have become aware that large corporations are exploiting labour
    conditions in developing countries using up vital resources because they are cheap
    and there aren't the systems to protect workers or the environment like there
    are in the west. The gap between the rich and poor nations is growing in spite
    of the much-heralded benefits of globalisation, there are still 1.3 billion people
    world wide who live on less than $3 a day and a similar number of people do not
    have access to clean water.  \n  \n Workers rights in developing countries are
    frequently violated, including payment of low wages and long working hours. The
    lives of workers may also be endangered by poor health and safety provision. Child
    labour is rife in developing countries, and forced labour still exists. Unfortunately
    most people don't think of these things while shopping.  \n  \n Supporters of
    globalisation offer economic growth as a solution to world poverty. They propose
    that impoverished nations and individuals can eventually attain a standard of
    living similar to our own through the 'trickle down' of wealth. However, the current
    globalisation model is leading to an increase in world poverty and inequality.
    \  \n  \nBuy Nothing Day is non-confrontational, it’s not a protest. All we ask
    people to do is switch off from shopping, have a bit of fun, use their imagination
    and simply escape consumerism for a day. If people laugh at the ingenuity and
    genius of Buy Nothing Day, then we’ve got their attention and we're opening the
    door to change.&nbsp;"
