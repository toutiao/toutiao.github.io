  text: 'Good question. As far as I know, XLA won&#x27;t do it on its own: both attention
    operands are different for each state, so there&#x27;s no shared operand to fold
    the batch into - each small 51×32 tile gets padded separately.<p>I haven&#x27;t
    tried packing yet, but I think it could work. In my benchmarking experiments,
    StableHLO attention at T=256 was 2.6x faster than at T=51. The only extra cost
    would be the block-diagonal mask.<p>I can try it. In fact, it would be easier
    and better to change the model architecture so that it fits hardware better. It
    just won&#x27;t work as a comparison.'
