  text: As a Rust enjoyer, there are plenty of examples of that--if I interpret GP&#x27;s
    complaint as being more about <i>explicitness</i> than <i>abstraction</i>, which
    is what most new-to-Rust folks I&#x27;ve talked to about similar complaints turn
    out to mean.<p>Box&lt;Rc&lt;Container&lt;Type&gt;&gt; soup gets tedious. Writing
    higher order functions that take closures which manipulate data bounded by a related
    lifetime gets <i>really</i> tedious. Dealing with interleaved lifetimes can be
    a pain. Pin and async, if you&#x27;re in that realm, gets tedious to write out.
    And the explicit notation of Send and Sync for types that, in a language like
    C++, would either encode their copy&#x2F;ref-stability in the documentation of
    the type or leave it up to the programmer to handle, also gets tedious. As an
    inheritance lover (we exist!), having to rewrite the same&#x2F;similar implementations
    or signatures across multiple traits and sprinkle my code with one-off enums to
