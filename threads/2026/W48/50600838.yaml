  author: btown
  text: 'To expand on this, my understanding is: the thing that held back approval
    (from the national bodies, not the committee itself) was that build configurations
    could turn off contract checks, which run at runtime, and still be standards-compliant.
    They wanted library authors to be able to write checks that will actually run,
    regardless of the build configuration of the person compiling!<p>So the “fix”
    was to let the author mark individual contracts as always enforced at runtime,
    with pre&lt;enforced&gt;. That, in turn, means a library’s key safety checks (bounds,
    null, etc.) can’t be silently dropped in a “loose” build configuration, which
    pushes things down a safer path.<p>Clunky IMO, but rather reasonable as a response
    to Rust!<p>It brings things closer to a world where: if you use these “safe” libraries,
    your program will stop rather than run unsafely, no matter how it was built.'
