  author: jcranmer
  text: 'I&#x27;ll say this about WG21: the C++ standardization process is definitely
    deeply broken. And yet one of the most frustrating things is... for all of the
    deeply problematic stuff coming out of C++, contracts is one of the features that
    actually doesn&#x27;t suffer from WG21&#x27;s dysfunction!<p>The problem with
    contracts is that everyone has a slightly different notion of what contracts is
    supposed to solve, and it took years (really, over a decade) to come a consensus
    that almost everybody was happy with. Except for a small, <i>vocal</i> minority
    who are so upset over contracts that they&#x27;re willing to spike the entire
    process to kill it. While this trip report is putting a positive spin on it, if
    you look at the dissenting vote counts in the plenary votes, they&#x27;re not
    really going down, and I&#x27;m dubious that any of the dissenters were actually
    mollified by the latest changes. My suspicion is that C++26 NB balloting round
    2 will come back the same way--failure, just with a couple thousand extra man-hours
    wasted on debating it.<p>As for why WG21 is so broken, well, I hope you&#x27;ll
    forgive me a bit of rant:<p>It was one of the papers I was listening to during
    this meeting, about a new proposed standard library feature. And as the author
    is droning on about how good their implementation is, thanks to their thousands
    of lines of inline assembly, I just wanted to stop and shout at them &quot;I don&#x27;t
    give a flying fuck about your implementation.&quot; When you propose adding something
    to the C++ standard library, it&#x27;s not your implementation that&#x27;s going
    to be added. No, each of the standard libraries is going to reimplement it themselves
    because they have to--and given that all of their maintainers seem to be running
    on the ragged edge of burnout because the new library additions <i>just keep coming</i>,
    it&#x27;s probably going to be the minimum work necessary to get something working.<p>And
    yet every library paper author comes in with their wistful stories of how good
    their implementation is, how nice it would be if everyone could take advantage
    of their work, and of course, since it&#x27;s in the standard library, you get
    the best possible implementation, as if &lt;linalg&gt; is going to be implemented
    by a BLAS expert who&#x27;s been studying it for 30 years and not some guy who
    hasn&#x27;t touched numerics in 30 years but needs to check off a C++26 feature.
    Or hey, maybe even the compiler will get super special awesome sauce for optimization
    for the feature, because obviously that kind of integration is just free, right?<p>And
    yet... you just can&#x27;t actually bring any of this stuff up to the committee.
    WG21 is so compartmentalized that trying to bring it up in any room is going to
    just result in &quot;that&#x27;s not relevant for this vote, bring it up in &lt;insert
    study group here&gt;.&quot; The only thing you can do is be a curmudgeon who votes
    against everything because it&#x27;s really poorly motivated, and yet you&#x27;ll
    be outvoted by everybody else who is bringing their own library features into
    the standard, which all of the same flaws and thus their authors are equally blind
    to the issues, so they&#x27;ll vote in favor because it sounds like a really cool
    thing to add.'
