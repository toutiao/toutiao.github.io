    On the contrary, C is <i>far</i> more easily made memory safe than C++, because it&#x27;s a much simpler language with almost entirely explicit control flow. You have fil-c, CMBC, TIS that all work today, not to mention the profusion of annotation-based tools that have existed for years. Galois is working on C2Rust and other tools, though they&#x27;re not fully safe&#x2F;general yet.<p>Your options for C++ essentially amount to sanitizers, less-accurate static analysis work, and paying experts like TIS for manual verification. C++ is also choosing to actively make the problem worse when it deliberately refrains from adopting C&#x27;s verifiability improvements, like prohibiting time-traveling UB. It&#x27;s not like this is solely a problem of legacy standards either. std::span <i>could</i> have been safe (as gsl::span is), but the decision was made to deliberately sacrifice safety for other considerations.
