  author: btown
  text: Agreed that it’s not memory safety in the language-guarantee sense. But it
    lets a library make a spatial-safety guarantee that holds regardless of how it’s
    compiled.<p>If I call safe_library::some_low_level_op(some_offset), the library
    can guarantee a bad offset terminates the program before any out-of-bounds access,
    and no build flag on my end can drop that check. That’s the same “safe API over
    unsafe internals, enforced at runtime” pattern Rust’s own standard library relies
    on for bounds.<p>What C++ still can’t do is stop me from bypassing that API with
    a raw pointer, or help at all with lifetimes. But it&#x27;s useful in practice,
    not just in theory.
