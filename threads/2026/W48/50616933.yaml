    Uh oh!\n\nThere was an error while loading. Please reload this page.\n\n## glushchenko
    Nov 23, 2026 Maintainer\n\nHi everyone!\n\nFor those who don't know me, let me
    introduce myself. I'm the independent developer behind FSNotes, an open-source
    note-taking app for macOS and iOS.\n\nI've been developing FSNotes for 9 years.
    And what happened a few weeks ago came as a complete shock.\n\nApple removed my
    app from every European App Store. Without a clear explanation or any way to resolve
    the issue promptly.\n\nIt all started when I didn't receive my October sales payout.
    This had happened before, but I was usually able to resolve it by contacting Apple
    Support. Not this time.\n\nI opened two support cases:\n\n- November 5 — Case
    ID: 23353628\n\n- November 17 — Case ID: 23573022\n\nSince November 5, I haven't
    received a single response. Not one.\n\nI've gone through everything I could find
    in App Store Connect, completed the necessary compliance information under the
    EU Digital Services Act (DSA), and submitted official documents from Ukraine's
    government business registry.\n\nI'm a legally registered sole proprietor in Ukraine.
    I run my business officially and pay my taxes. But apparently, that's not enough.
    Or perhaps nobody is even reviewing my documents.\n\nAnd you know what's the most
    frustrating part?\n\nWhile Apple remains silent, everything I've spent nine years
    building is being destroyed.\n\nMy app is losing its positions in App Store rankings
    and search results. The visibility, reputation, and discoverability I've worked
    so hard to build over the years are disappearing right before my eyes.\n\nEven
    if Apple restores my app tomorrow, who's going to give me those rankings back?
    Who will compensate me for the lost time, users, and revenue?\n\nI'm not asking
    for special treatment. I'm not asking Apple to bend the rules for me. I simply
    want someone to review my documents, explain the restrictions, and give me a chance
    to resolve the issue.\n\nIt's especially painful to see how difficult it has become
    for a Ukrainian developer to keep working. Sometimes it feels like Ukraine is
    the country under sanctions, not Russia.\n\nFSNotes is still available for free
    on GitHub. I'll continue providing access to the source code and free builds.
    But the reality is that without revenue, it will be extremely difficult for an
    independent project like this to survive.\n\nI'm asking you to support this open
    letter to Apple with a like or a repost. I'm not asking for donations or special
    privileges. I just want to bring this situation to the attention of the App Store
    team.\n\nYou cannot simply remove an app with a nine-year history from sale, ignore
    a developer's support requests for weeks, and provide no explanation of what's
    happening.\n\nThis kind of treatment is killing indie development.\n\nApple, please
    listen.\n\nThank you all for your support!\n\n-- My Apps on the App Store:\n\nFSNotes
    macOS: https://apps.apple.com/app/id1277179284 FSNotes iOS: https://apps.apple.com/app/id1346501102\n\n-
