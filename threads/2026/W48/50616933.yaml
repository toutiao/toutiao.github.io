  text: |-
    Taking a step back it doesn&#x27;t even matter whether, or to what extent, it&#x27;s a monopoly, or not.
    Normally, society is in charge of how the markets citizens engage in, function.<p>Us, citizens, set the norm. No more slavery? No more slavery. Boom. We say it, it happens (well, it might take a civil war) because our society&#x27;s markets concern <i>us</i>, citizens.<p>People selling themselves into indenture? No we also don&#x27;t want that. &quot;But but but, they are free to pick who they sell themselves to, it&#x27;s frreeeedom!&quot; Doesn&#x27;t matter. Bad outcomes.<p>No more child labour? No more child labour, boom, we say it, it was a bad thing. Now our children go to school.<p>Snakeoil salesmen, butchers and blacksmiths moonlighting as dentists? Maybe not, let&#x27;s have proper doctors in the public interest, and some accountability, malpractice committees, etc. Yes sure people had the &quot;freedom&quot; to choose between the butcher and the blacksmith for who to bring them into sceptic shock, but... we as a society decided that we can do <i>better</i>.<p>Alcohol deemed bad? Boom, some years of prohibition, let&#x27;s see how it goes (not everything turns out as planned of course, but that&#x27;s also how societies learn).<p>Creating rules to shape markets to deliver good outcomes for citizens with beating hearts, is one of the things a government is for. Example: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pure_Food_and_Drug_Act" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pure_Food_and_Drug_Act</a><p>&gt; [...] remove an app with a nine-year history from sale, ignore a developer&#x27;s support requests for weeks, and provide no explanation of what&#x27;s happening<p>That&#x27;s not a good market for us as citizens, and it&#x27;s not hard to see how the market&#x27;s and notably the <i>market owner</i>&#x27;s incentives lead to outcomes such as this.
    There&#x27;s plenty of precedent for imposing some rules on such a bad market. It doesn&#x27;t need to depend on the question &quot;monopoly or not?&quot;.
