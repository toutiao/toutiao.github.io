  author: gamblor956
  text: "<i>Legally the sole connivence store inside an apartment building is a monopoly.</i><p>Legally?
    Absolutely not. A legal monopoly is a specific thing. It exists when a single
    entity has been granted exclusive rights to offer into commerce a specific or
    service by the government. The key here is &quot;exclusive rights&quot; and &quot;by
    the government&quot; meaning that no competition <i>is allowed</i>.<p>Economically?
    Maybe, if there were no other apartment buildings with convenience stores, and
    no nearby convenience stores, pharmacies, or grocery stores nearby, so all of
    the residents of the apartment building had to shop there, the hypothetical convenience
    store might constitute a <i>de facto</i> monopoly.<p>When you sign a lease, that
    is not a monopoly. You can always move to another building. You don&#x27;t have
    to visit the amusement park for amusement; you can go to a movie theater, or sports
    game, or arcade, or carnival&#x2F;fair. The amusement park has not been granted
    a legal monopoly to provide amusement. And with few exceptions, most amusement
    parks are not economic monopolies because competing parks are nearby.<p>Also,
    responding to one of your other comments here so it&#x27;s all in one place: walking
    distance is not a factor in whether something is a legal monopoly, and never has
    been (though the grant of a geographic territory is usually a necessary component
    of a legal monopoly.) Apple has an economic monopoly over the iDevice app market,
    but not a legal one because no government has granted it exclusive rights over
    that market."
  score: 0
