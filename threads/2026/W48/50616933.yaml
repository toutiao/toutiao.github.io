  text: I think we&#x27;re not talking about the same thing here. By your logic, it
    seems Linux would work perfectly fine for anybody because you can easily purchase
    hardware to run Linux, and likewise Apple&#x27;s App Store is not a monopoly because
    you can easily purchase hardware to run Android. But, generally, if you have an
    Nvidia GPU you have to repurchase AMD to have good experiences with Linux, and
    if you have an Apple iPhone you have to repurchase Android or another Linux phone
    to access other ecosystems.<p>This is not the same as walking further to another
    store, because the equivalent of that would be, say, jailbreaking the phone or
    sideloading from a Mac that you already have. A.k.a. &quot;more time and effort,
    but with the same resources&quot; as opposed to &quot;needing to obtain entirely
    new resources&quot;.<p>If your local utility won&#x27;t give you good rates or
    good service, you&#x27;re SOL if it&#x27;s the only utility in your area, especially
    if you don&#x27;t own the building being served. Likewise, if you can&#x27;t get
    the apps you want from the App Store, you&#x27;re generally SOL if you&#x27;re
