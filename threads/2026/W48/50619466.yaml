  author: aeturnum
  text: As a sibling comment points out this is not as straightforward as it seems.
    I used to collect antique pocket watches and the ones that you can get are all
    the high-end ones. So-called &quot;dollar&quot; watches are actually more valuable
    now, because they fell apart faster and are very hard to repair. Where a high-end
    watch can generally be fixed with donor parts from a sibling, dollar watches were
    not made to be repaired and thus require tons of work to keep up (also they sucked
    so they break faster). If you just took a survey of surviving watches you would
    imagine that most of the watches made were the high end ones - but it&#x27;s the
    opposite! We just throw away a lot of what we make.
