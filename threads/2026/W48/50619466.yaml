  author: juliendorra
  text: 'Not so simple! Rare precious objects tend to be preserved and passed on,
    and it can distort our historical perspective. The maybe clearest example is the
    early decades of the printing press: we have the precious editions, but all the
    common, mass prints (like market announcements and city declarations) have been
    lost, when they were the biggest share and most lucrative part of the printing
    press early production.<p>We have the same effect in architecture where only the
    rare costly buildings survive and the cheap constructions disappear (allowing
    the &quot;culture critics” to rant on how buildings of the past were so beautiful)<p>Trash
    dumps of course are indeed full of supposedly common things, but they are just
    one source.'
