  author: rramadass
  text: I did not add the details since it was AI generated and so people can ask
    their favourite AI the same thing. Try it out; I did not realize so much of optimizations
    can be done under partial evaluation.<p>Note that most compile-time partial evaluation
    options are automatically included under -O3 switch.<p>Some of the techniques
    were interesting specifically profile guided and aggressive cloning based on hot
    paths.<p>Regarding libgccjit you are essentially right; basically you construct
    the IR for the active path with the runtime values as constants and then compile
    it in memory to get a pointer to the function. In that sense JIT is partial evaluation
    done at runtime.
