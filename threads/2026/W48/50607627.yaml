  author: rramadass
  text: 'That is not Partial Evaluation but interactive REPL evaluation. See also
    <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50609165">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50609165</a><p>For
    Partial Evaluation, you must generate a &quot;residual&quot; version of the original
    program by specialization where all static data is already bound and evaluated.<p>Simplest
    example would be compiling in configuration parameters, so a specific code-path
    is preselected before runtime. Another classic example would be C++ template meta-programming
    where that part of the program is not evaluated at runtime.<p>I first came to
    know of these techniques from the classic <i>Generative Programming: Methods,
    Tools, and Applications</i> by Krzysztof Czarnecki and Ulrich W. Eisenecker which
    is still relevant today.<p>Checking with Google, it seems GCC does not have a
    separate partial evaluator but one can use coding techniques+aggressive optimization
    switches to approximate it. For separate &quot;Futamura Projection&quot; like
    partial evaluators there seem to be C-Mix&#x2F;LLPE etc.'
