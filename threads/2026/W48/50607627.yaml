  text: Yup, it&#x27;s a bug. The &#x27;%&#x27; character gets you into the while
    loop and into the else clause. The switch increments to the nul terminator, which
    then executes prterror(0). Then fmt is incremented again so it points just outside
    of the string. As long as that out-of-bounds byte is not also the nul value the
    loop continues into out-of-bounds territory.<p>Wait - does prterror cause the
    program to exit? It&#x27;s not defined, so maybe the program does terminate, maybe
    it doesn&#x27;t.
