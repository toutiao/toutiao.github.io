    | |\n\n* * *\n\n## What is Tempo?\n_Partial evaluation_ is program transformation
    that automates a _program specialization_ process. _[Tempo](#Tempo)_ is a _partial
    evaluator_ for C programs. It has been applied in various domains such as operating
    systems and networking, computer graphics, scientific computation, software engineering
    and domain specific languages. A first [workshop](#workshop) on Tempo has been
    organized in March 1998. Tempo is now being [distributed](#distribution). Its
    [documentation](doc/) is available on line, as well as [tutorial slides](../../publications/talks/#tempo).
    \  \n\n* * *\n\n## An Overview of Tempo\n_Tempo_ is a partial evaluator for C
    programs. It is being developed in the Compose project at [IRISA / INRIA](http://www.irisa.fr)
    - [LABRI](http://www.labri.fr) (France). \n\nTempo is an _off-line_ specializer;
    it is divided into two phases: analysis and specialization.\n\nThe input to the
    analysis phase consists of a program and a description of which inputs will be
    known during specialization and which will be unknown. Based on this knowledge,
    dependency analyses propagate information about known and unknown values throughout
    the code and produce an annotated program, indicating how each program construct
    should be transformed during specialization. Because C is an imperative language
    including pointers, the analysis phase performs alias and side-effect analyses
    in addition to _[binding-time analyses](#bta)_. The accuracy of these analyses
    is targeted towards keeping track of known values across procedures, data structures,
    and pointers. \n\nFollowing the analysis phase, the specialization phase generates
    a specialized program based on the annotated program and the values of the known
    inputs. Tempo can specialize programs at [compile time](#ctspec) (i.e., source-to-source
    tranformation) as well as [run time](#rtspec) (i.e., run-time binary code generation).\n\n
    For more details, please consider reading some of our papers, most of which are
    available at the following URL: .   \n\n#### Program Analysis\n As a first step,
    the user provides a program and specifies what arguments (including global variables)
    are static. For example, the user provides the following code for a function,
    and specifies in this way that the first argument is static whereas the second
    is dynamic: . From this Tempo produces a program file with analysis annotations.
    These annotations can be visualized using colors that highlight the propagation
    of the known/unknown information throughout the program.   \n&nbsp; The blue color
    (bold face for black and white display) represent static constructions, _i.e._
    values that can be computed at specialization time. The red color (standard font
    for black and white display) is for dynamic expressions, whose value cannot be
    precomputed knowing only the static arguments. Basically, everything in blue (bold)
    will disappear after specialization; only red (standard font) parts will remain.
    \n\nThe visualization of the analysis is very important for the user to assess
    the amount of specialization in the code. Furthermore, the analysis speeds up
    the specialization process (as opposed to _on-line_ partial evaluators). The analysis
    is inter-procedural and takes into account pointer aliases and side-effects.\n\n####
    Compile-Time Specialization\n When the user is satisfied with the analysis (_i.e._,
    what the user expects to specialize indeed appears as static), actual specialization
    values must be provided. For example, giving as the actual specialization value
    for the argument of the function yields the following specialized code. Many specializations
    can be made, sharing the same analysis. Only different specialization values have
    to be provided. \n\n#### Runtime Specialization\n Tempo can also perform runtime
    specialization, using optimized binary code templates. A dedicated runtime specializer
    is generated from the analysis of the program. In the case of the function, Tempo
    generates a runtime specializer which can be used as in the following example.
    The function is a dedicated runtime specializer. It returns a pointer to the specialized
    function. Several specialized versions can also be generated and used at the same
    time. \n\n* * *\n\n## Applications of Tempo\n Tempo has been successfully applied
    in various domains, yielding substantial speedups. \n- Operating system and networking:\n\n
    \ - Sun RPC, Chorus IPC, BSD packet filter, Unix signals, active networks,\n-
    Computer graphics (various filtering algorithms),\n- Scientific computation (trajectory,
    FFT, math libraries),\n- Software architectures and mechanisms:\n\n  - Domain
    specific languages GAL, [PLAN-P](../plan-p/)),\n  - Selective broadcast (implicit
    invocation),\n  - Pattern matching,\n  - Interpreters,\n  - Software layers,\n
    \ - Generic libraries.\n For an up-to-date list of non-confidential, published
    applications, please browse our ``papers'' web page: .   \n&nbsp; \n\nBesides
    C, Tempo is currently being used as a back-end for specializing Java programs
    using Harissa, a JavaVM-to-C compiler. Fortran and C++ programs have also been
    specialized using translators to C.\n\n* * *\n\n## Projects Related to Tempo\n\n*
    * *\n\n## Workshop\n A workshop (actually closer to a ``winter school'') on Tempo
    has been organized at [IRISA](http://www.irisa.fr), March 16-18, 1998. The aim
    of this workshop was to present a three-day tutorial on Tempo and its applications
    to real size programs. We had 24 participants, coming from universities as well
    as industries. We believe it was a large success. The [talks](../../publications/talks/#tempo)
    are now available on-line. \n\nDepending on request, if the [distribution](#distribution)
    of Tempo is a success, we might organize another workshop later. It would less
    be like a ``winter school'' but rather like a real workshop with users presenting
    applications and open discussions about possible improvements. It would be preceded
    by an optional one-day tutorial for people not knowing partial evaluation or Tempo.\n\n*
    * *\n\n## Distribution\n The Tempo specializer has been made publicly available
    under a licence in April 1998. At of March 99, it was being used by about thirty
    people around the world. The binary version of Tempo has just (July 2000) been
    made available without any restrictions, and we expect a full unrestricted source
    release under GPL to follow soon. \n\nGetting access to Tempo no longer requires
    signing a license agreement. Tempo is simply available via anonymous FTP, as described
    below. In any case, we would _very much_ like to hear from you if you are an active
    Tempo user. If you are, please also let us know if and for what purpose you are
    using Tempo, by sending an email to . We will by default add you to our tempo
    talk mailing list , where future Tempo releases will be announced, and Tempo users
    can discuss practical problems using Tempo.\n\nTempo can be downloaded :\n\n-
    Here is a Tempo release that have been made publicly available: [i386 Linux](distribution/tempo.tar.gz)\n-
    Most recent Tempo binary distribution for [i386 Linux](distribution/tempo.tar.gz)
    (tested on RedHat 6.1).\n (Please remember to send an email to to let us know
    who you are and why you are using Tempo. Remember to explicitly indicate if you
    are not interested in joining the mailing list.)   \n&nbsp; \n\nIn case of any
    problem with getting or installing the distribution, get in touch with us: [mailto:tempo@labri.fr](mailto:tempo@labri.fr)\n\n*
    * *\n\n## References\n Here are general papers about Tempo and its architecture.
    More focused and up-to-date information regarding Tempo can be found in the main
    [on-line papers](../../publications/papers/) tank. \n* * *\n\n## Contact Information\n\n-
    Developers and maintainers: \n- Tempo Specializer home page:"
