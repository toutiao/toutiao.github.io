    reads like &quot;yeah we wouldn&#x27;t have beaten you up if you just gave us
    your lunch money&quot;.<p>Of course, big studio and sales are still fine and all,
    but the social contract is breaking down a bit there.<p>A completely different
    thing to explore here is that kids (little accountability) are steering LLMs (no
