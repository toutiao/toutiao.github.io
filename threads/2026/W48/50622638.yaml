    was done with kids as meat shields, but there, it was still fairly trivial to
    trace back which adult actually was behind it and punish them accordingly.<p>Whereas
    here, it is Kids doing this on their own with the power of the whole industry
    distilled into a bunch of floats backing them up.<p>Wild times.
