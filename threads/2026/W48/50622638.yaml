  author: ndriscoll
  text: "&gt; law is just trying to capture our understanding of ethics and formalizing
    it<p>This is an extremely naive view of the law. There is no world where my understanding
    of ethics says that we should grant monopolies on our culture for multiple human
    lifetimes, locking out our descendants from their own heritage. Frankly, I&#x27;d
    consider someone pushing that position to be simply evil. Likewise with the decades
    long war on drug users. Or that we can just randomly go start wars with other
    countries without an extremely broad consensus (e.g. 90+% majority in a direct
    vote on the topic). There are a great many obvious evils that the law evidently
    allows for or even demands.<p>People feel &quot;entitled&quot; to do these things
    because you were never entitled to tell them not to, and the social contract there
    has been long since turned into a complete farce. Kids don&#x27;t entertain the
    attempt to gaslight them for even a moment. Good for them.<p>The fact that you
    were never entitled to tell them not to is related to why it&#x27;s so hard to
    police: what they do has no effect on others, so it&#x27;s easy for them to keep
    it on the down low if they want, and you&#x27;ll never learn about it. There is
    no victim to complain.<p>Additionally, as far as I know these projects are generally
    taking an approach similar to WINE: they&#x27;re just implementing platform libraries
    necessary for commodity PCs to run software that&#x27;s designed to run on commodity
    PCs (which are all game consoles are these days). The law actually has sided <i>with</i>
    development of emulation or compatibility layers consistently, over and over,
    even going so far as to say that if copyright or trademarks are intentionally
    used as barriers to doing so, then it is fair use to use those things as necessary.
    As a society, we <i>want</i> market competition. We <i>want</i> e.g. Lenovo or
    Valve to be able to make a competitor to the PS5 or Switch that&#x27;s compatible
    with all of the software. That <i>benefits</i> the market."
