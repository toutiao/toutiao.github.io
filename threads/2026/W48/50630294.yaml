  author: tagspace
  text: Good question. The majority of the work was two things:<p>1. the replication
    logic that keeps duckdb in sync with your postgres (like you&#x27;d expect from
    a read replica)<p>2. the query rewriter that takes incoming postgres queries and
    turns them into queries that run fast on duckdb (we&#x27;ve spent a lot of time
    making sure that most queries are answered in a few 100 milliseconds, even on
    10+M rows).<p>So, I guess the main differences are:<p>- with ADBC the load still
    hits your postgres (which is what we wanted to avoid)<p>- with ADBC you&#x27;re
    not guaranteed to get the same answer as postgres (we want confidence that our
    queries will answer the same, not faster but different)<p>- you&#x27;d have to
    build your own ETL (if you want to avoid the load on your postgres)<p>Does that
    make sense?
