  url: https://novaramedia.com/2026/11/24/anthropic-staff-openly-talk-about-taking-over-the-world-claims-top-mit-physicist/
  title: Anthropic Staff Openly Talk About ‘Taking Over the World’, Claims Top MIT
    Physicist | Novara Media
  fetch_status: success
  content: "[News](https://novaramedia.com/category/articles/news/)\n\n# Anthropic
    Staff Openly Talk About ‘Taking Over the World’, Claims Top MIT Physicist\n\n##
    Apparently they discuss overthrowing\Lthe US government after a few drinks.\n\n###
    by [Clare Hymer](https://novaramedia.com/contributor/clare-hymer/)\n\n### 24 November
    2026\n\n ![](https://novaramedia.com/wp-content/uploads/2026/11/Screenshot-2026-11-24-at-2.42.06-pm-e1795535439679.png)\n
    Novara Media \n\nEmployees at US artificial intelligence company Anthropic openly
    talk about “overthrowing the US government” and “taking over the world”, a world-renowned
    physicist has claimed.\n\nIn [an interview with Novara Media](https://www.youtube.com/watch?v=J9WpNdQYYoo),
    Max Tegmark, a professor at the Massachusetts Institute of Technology, said: “When
    I talk to people who work for Anthropic, after they’ve had a couple of drinks,
    the conversation often gets into overthrowing the US government and taking over
    the world.”\n\n“They tend to not use words like ‘coup’ and ‘overthrow the US government’.
    They instead use the code phrase ‘alignment without control’,” he said.&nbsp;\n\n‘Alignment
    without control’ is the idea that AI should be kept in check by being instilled
    with certain values – likely those shared by Anthropic, Tegmark said – rather
    than being directly controlled by humans.\n\n“We get the sort of future that Alan
    Turing predicted, where it’s going to be Anthropic’s machine-god running Earth,
    and then the rest of us just have to hope that somehow it’s gonna be nice.”&nbsp;\n\nTuring,
    widely regarded as the founder of computer science, famously warned in 1951 that
    once machines started thinking, we should expect them to take control.\n\nTegmark
    said the comments from Anthropic staff should alarm anyone who cares about democracy.
    “These companies really don’t seem to like it [democracy]. They have lobbied really
    hard to even prevent any meaningful government oversight of them,” he said.\n\nHe
    added: “Here in the US, OpenAI and Anthropic are less regulated than a sandwich
    shop.”\n\nNovara Media has approached Anthropic for comment.&nbsp;\n\nTegmark’s
    disclosure comes as protests against AI are ramping up across the world.\n\nAs
    Anthropic started trading on the stock market at a staggering $2tn valuation on
    Thursday, [protesters gathered](https://www.theguardian.com/technology/2026/nov/19/anthropic-ipo-protests)
    at both the Nasdaq exchange in New York and the firm’s San Francisco headquarters
    demanding an AI development slowdown.\n\nOn Saturday, over 1,000 people marched
    against “AI extinction” in London in what [campaigners said](https://x.com/PauseAI_UK/status/2124871843240644897)
    was “the biggest AI safety march in history”.\n\nClare Hymer is head of articles
    at Novara Media.\n\n- [Tweet article](https://twitter.com/intent/tweet?via=novaramedia&text=Anthropic%20Staff%20Openly%20Talk%20About%20%E2%80%98Taking%20Over%20the%20World%E2%80%99%2C%20Claims%20Top%20MIT%20Physicist&url=https%3A%2F%2Fnovaramedia.com%2F2026%2F11%2F24%2Fanthropic-staff-openly-talk-about-taking-over-the-world-claims-top-mit-physicist%2F)\n-
