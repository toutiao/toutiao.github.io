  author: OgsyedIE
  text: From the transcript (<a href="https:&#x2F;&#x2F;singjupost.com&#x2F;transcript-mit-physicist-max-tegmark-interview-on-novara-media&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;singjupost.com&#x2F;transcript-mit-physicist-max-tegmark-...</a>)
    at about 15 minutes, here&#x27;s Tegmark&#x27;s comment verbatim:<p>&gt; Anthropic,
    on the other hand, is behaving much more like in that story in my book where they
    are actually leaning into transhumanism and this idea that they want to make a
    conscious AI. They’re talking in Anthropic about machine rights, as you know.
    And when I talk to people who work for Anthropic after they’ve had a couple of
    drinks, the conversation often gets into overthrowing the US government and taking
    over the world.<p>&gt; And I think for a while I couldn’t figure out why more
    people didn’t react. They’re talking about taking over the world, but then I realized
    why. It’s because they speak in code. They tend to not use words like “coup” and
    “overthrow the US government.” They’ll instead use the code phrase “alignment
    without control.”<p>&gt; So let me translate what that means. If it’s controlled,
    right, then if they had a plan for actually this being controlled, then the US
    government could control it. It could shut it down, they could have kill switches,
    etc., etc. But they don’t want that. They’ve basically stopped talking about it.
    Instead, they talk about alignment, which very loosely speaking, the AI should
    be nice somehow according to some values, which will probably be quite influenced
    by the particular values that they have, but not controlled.<p>&gt; So that means
    that we get the sort of future that Alan Turing predicted, where it’s going to
    be Anthropic’s machine god running Earth. And then the rest of us just have to
    hope that somehow it’s going to be nice. Call me old-fashioned, but I have a soft
    spot for democracy. The idea that if you want to actually overthrow a democratic
    set of institutions, you should have a referendum on it.<p>&gt; But these companies
    really don’t seem to like that. They have lobbied really hard to even prevent
    any meaningful government oversight on them here in the US. Anthropic and OpenAI
    are less regulated than a sandwich shop. They actually have a legal right to release
    superintelligence tomorrow, should they have it and want to.<p>.<p>My own comment
    is that it isn&#x27;t illegal to be so successful at business that everyone&#x27;s
    lives revolve around your policies and products (e.g. the electronic payment industries)
    there&#x27;s just regulatory processes that get involved for the preservation
    of the welfare and economic power of the population. If any risk to that is real
    then the object of discussion should be the safety of the boundary conditions
    enabling the regulatory process.
