  author: skeledrew
  text: Hardware and software lifetimes are two different things. Just look at phones
    (Android anyway), where OS upgrades are guaranteed I think for 3-4 years, but
    a good device may be used for much longer than that; I had a OnePlus 2 for 2 years,
    then passed on to family after I upgraded (and it was lying around for 2 years)
    and they used it for another 6 years without that OS getting an update. All those
    years anything from a security perspective could&#x27;ve gone wrong and there&#x27;d
    be no support as it&#x27;s outside of the window.<p>A vehicle is a far larger
    ask, and I seriously doubt a &quot;central authority&quot; would be able to sufficiently
    respond to a situation of potentially many vehicles from a company no longer in
    business suddenly having a vulnerability that allows an actor to take remote control,
    for example. After all it&#x27;d be up to them to be able to somehow (re)acquire
    the talent needed to do the fix and spin up any necessary infra, which would take
    time to go through the system while the vulnerability is potentially being actively
    exploited.
