  author: nyx
  text: 'Such a good question! You actually might not always want the owner to be
    able to modify it: what if you&#x27;re buying a used car, and the last person
    who owned it was a hardware hacker who customized the firmware on the power steering
    column to steer the car into the median if the car ever went above 65mph? Even
    if you think people should be able to modify the hardware that they own, this
    is still a scary possibility, right?<p>I think the way that Pixel phones work
    is as close to ideal as we&#x27;ve got right now: there&#x27;s measured boot,
    i.e. the first thing the SoC does when it boots is it checks if its firmware is
    signed by a key that it trusts. On some other kinds of devices, if the firmware&#x27;s
    not signed, it abandons the boot attempt. Not genuine means no dice. But on my
    Pixel, I can flash whatever I want (like GrapheneOS), and when the phone starts
    up, it displays a big yellow exclamation point alert that the phone is running
    unsigned firmware. I can run whatever I want on my phone, but there&#x27;s no
    way for me to pass off my firmware as genuine.<p>And to get at your question a
    little more directly: the Pixel requires me to have the phone unlocked and accessible
    before I flash it, i.e. I have to have physical access and some verification that
    I&#x27;m the owner of the phone. I can imagine a hypothetical car modification
    scenario doing something similar. And if I&#x27;m a shithead and I modify my car&#x27;s
    headlight firmware to intentionally blind other road users, well, we&#x27;ve got
    existing laws that are supposed to deal with that sort of thing.'
