  title: 'Money in Your Pockets: Governor Hochul Signs Bill Restricting Exploitative
    Vehicle Subscription Fees | Governor Kathy Hochul | New York State'
  fetch_status: success
  content: "- [Consumer Protection](/keywords/consumer-protection)\n\nNovember 23,
    2026\n\nAlbany, NY\n\n# Money in Your Pockets: Governor Hochul Signs Bill Restricting
    Exploitative Vehicle Subscription Fees \n\nS.9348A/A.10411A Prohibits Car Companies
    from Charging for Built-In Features\n\nAmid Rising Consumer Fees, New Law Increases
    Price Transparency and Puts Money Back in New Yorkers’ Pockets\n\n[Traducción
    al español](https://www.governor.ny.gov/news/dinero-en-sus-bolsillos-la-gobernadora-hochul-firma-una-ley-que-restringe-las-tarifas-de)\n\nGovernor
    Kathy Hochul today signed a bill restricting motor vehicle manufacturers and dealers
    from charging consumers subscription fees after they purchase a vehicle. Amid
    rising consumer prices, the new law guards against a rising trend of car companies
    charging car owners fees to activate and use built-in features like heated seats,
    enhanced navigation, hands-free driving and entertainment options that do not
    present an ongoing expense for dealers and manufacturers.\n\n“New Yorkers are
    already struggling with rising prices due to Trump’s affordability crisis, and
    we’re not going to let harmful business practices increase the cost of living
    even more,” **Governor Hochul said.** “People spending their hard-earned money
    on a car shouldn’t have to fork over even more money for features that should
    automatically come with the car. My message to car companies is clear: this kind
    of deceptive business model isn’t going to fly in New York State. Keep your hands
    out of New Yorkers’ wallets.”\n\n**S.9348A/A.10411A** prohibits motor vehicle
    manufacturers, dealers or third-party service providers from adding subscription
    services or charging post-purchase fees for any motor vehicle feature that uses
    pre-installed components or hardware that do not have an ongoing cost. As vehicles
    become more advanced, the new law aims to establish clear rules preventing exploitative
    practices and prevent post-purchase fees as a future automotive business model.\n\n**New
    York Attorney General Letitia James said,** “No one should have to pay recurring
    fees just to use features in a car they already bought. My office has secured
    millions of dollars for New Yorkers throughout the state who were charged illegal
    junk fees when purchasing a car. Unfair fees are fueling rising costs, and I am
    proud to work with Governor Hochul and the legislature to bring costs down.”\n\n**State
    Senator James Skoufis said,** “People ought to know they’re able to use their
    already-installed remote start or heated seats during the winter without a monthly
    subscription. This new law will simply and clearly prohibit car manufacturers
    from ripping off New Yorkers who already paid for vehicle features when they purchased
    their car. It’s a common sense law and I’m grateful for the Governor and Assemblymember
    Magnarelli for their partnership enacting this legislation.\"\n\n**Assemblymember
    William B. Magnarelli said,**\"I thank Governor Hochul for recognizing the importance
    of this legislation, particularly as technology continues to evolve at a rapid
    pace. This law will help protect New Yorkers from unfair fees and ensure consumers
    aren’t paying extra for features already built into their vehicles.”\n\nThe law
    will take effect in 90 days on February 27, 2027.\n\nThis new law is the latest
    in Governor Hochul’s ongoing commitment to help address the cost of living by
    putting money back in the pockets of New Yorkers statewide. Under Governor Hochul’s
    leadership, she has:\n\n- Secured reforms to [lower auto insurance premiums](https://www.governor.ny.gov/news/governor-hochul-secures-reforms-lower-auto-insurance-premiums-new-yorkers)
    for New Yorkers, battling fraud, limiting damages paid out to bad actors, and
    ensuring consumers, not insurance companies, are prioritized.\n- Signed legislation
    [requiring businesses to notify consumers](https://www.governor.ny.gov/news/governor-hochul-signs-new-legislation-protect-consumers-and-keep-money-new-yorkers-pockets)
    of upcoming renewals and price changes as well as provide clear instructions on
    how to cancel subscriptions.\n- [Cut middle-class taxes](https://www.governor.ny.gov/news/money-your-pockets-governor-hochul-signs-new-legislation-cut-taxes-middle-class-new-yorkers)
    to their lowest rates in 70 years.\n- [Tripled the Child Tax Credit](https://www.governor.ny.gov/news/money-your-pockets-governor-hochul-proposes-sweeping-expansion-child-tax-credit-deliver-1000),
    providing families up to $1,000 per child under the age of four and up to $500
    for school-aged children, beginning in 2026.\n- [Made school meals free](https://www.governor.ny.gov/news/universal-school-meals-governor-hochul-reaffirms-commitment-providing-free-breakfast-and-lunch)
    for every student, saving families $1,600 per child every year.\n- [Sent Inflation
    Refund checks](https://www.governor.ny.gov/news/governor-hochul-announces-inflation-refund-checks-400-coming-fall-82-million-households-across)
    to 8.2 million New Yorkers — up to $200 for individuals and up to $400 for families.\n-
    [Increased the maximum weekly unemployment benefit](https://www.governor.ny.gov/news/governor-hochul-and-business-and-union-leaders-celebrate-new-york-state-paying-multi-billion)
    by $300 a week.\n\n## Contact the Governor’s Press Office \n\n## Contact us by
    phone: \n\nAlbany: [(518) 474-8418](tel:5184748418)  \nNew York City: [(212) 681-4640](tel:2126814640)\n\n##
