  author: antiframe
  text: I love telling this story. I wanted to buy a car. Me and the sales guy came
    to agree on a price. I go to the finance office and get out my checkbook to write
    them a check. &quot;We don&#x27;t accept personal checks, due to potential fraud&quot;.
    No problem I say, I can get a cashiers check and be back in an hour. &quot;We
    don&#x27;t take those either, since how do we know they&#x27;re not counterfeit&quot;.
    I offered to have him present at the bank to verify but he declined. I presented
    my credit card. &quot;We don&#x27;t take credit cards on anything over $5k due
    to fees&quot;. Well, I say, we are left with only one option, I can return with
    a duffel full of cash. &quot;We don&#x27;t take cash, too risky.&quot; So, I plead,
    how do I pay you for the car?! &quot;Well, here&#x27;s our loan application, just
    fill out the top part and sign, we&#x27;ll do the rest&quot;. I said no thanks
    and went to another dealer down the street where I bought a car with my personal
    check. On the drive home I get a call from the first sales guy saying they&#x27;ll
    sell me the car if I bring a check. I told them no thanks, I just bought one from
    another dealer and am no longer in the market. Had they been honest with me the
    the price they agreed to was the &quot;finance&quot; price we might have come
    to a &quot;cash&quot; price agreement and they would have gotten the sale.<p>Dealers
    don&#x27;t want to sell you cars. They want to sell you loans.
