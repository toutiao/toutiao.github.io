  author: altairprime
  text: No, laws don’t need to be so specific to be passed into law. Simply saying
    ‘features that have an intrinsic per-use or periodic cost to the manufacturer
    to provide safely are exempt, excluding costs resulting from or associated with
    regular wear and tear’ is enough to get your point across and will hold up quite
    nicely as a clear and obvious statement of intent in a court versus the ‘seat
    heaters &#x2F; performance modes increase warranty costs’ argument that keeps
    popping up.<p>I considered but rejected tying it to mechanical warranty, because
    seat heaters rarely fail and that’s not worth a subscription fee to have lifetime
    free service and replacement for. But I might add a clause “Components associated
    with post-purchase recurring costs must be warrantied in full for the life of
    the subscription plus one month for each year of subscription services associated
    with the vehicle”, so that they’re forced to offer lifetime warranties for any
    sub fee charged (and so that they can’t unilaterally discontinue the fee to escape
    widespread defect repair costs). And, yes, I may be far too late to influence
    NYC to write a better law but it’s still fun to try — it’s just like writing a
    good Perl program, except it’ll be evaluated by a judge so you don’t have run
    it under ‘use strict’ because the interpreter is so much more advanced :D
