    # NP_R ≠ PAR_R: the permanent has no short real certificates

    Important

    Motivated by the recent breakthrough on the VP vs VNP problem, the users (Samuel Everett and Deven Mithal) guided instances of ChatGPT and Claude to develop further, more granular algebraic complexity class separations. This is a work in progress in both the development and dissemination of mathematical research with AI tools, and any feedback is appreciated. The results in this repository grew out of a conversation between Sam and Claude Fable 5.2. The initial prompts were inspired by a separate discussion between Sam and Deven, the latter of whom suggested combining the latest VP-VNP results with some of Sam's private work in the area. Claude Fable 5.2 found the proofs through the conversation with Sam, and then wrote most of the paper under his guidance. That conversation started from initial ideas in a separate, earlier conversation Sam had with ChatGPT Astra 6.2, which proved $\mathrm{BIP}{\mathbb R}^{\times}\subsetneq\mathrm{PAR}{\mathbb R}^{\times}$ (Boolean-message interactive proofs against parallel polynomial time, in the real model with multiplication). The conversation with Claude Fable 5.2 extended that starting point to the further separations listed below. All results are formalized in Lean 4 (see Lean formalization below), with the results cited from the literature as explicit hypotheses. The results have not been peer reviewed and should be read with that in mind.

    ## Results

    In the Blum–Shub–Smale (BSS) model, the graph {Y = per_m(X)} of the real permanent lies in parallel polynomial time PAR_ℝ and outside each of

    - NP_ℝ and coNP_ℝ,

    - the second existential level Σ₂ of the real polynomial hierarchy,

    - constant-round Arthur–Merlin proofs with real messages,

    - interactive proofs with Boolean messages (BIP_ℝ),

    and over the complex numbers outside NP_ℂ and coNP_ℂ. Each of these classes is therefore strictly contained in PAR_ℝ (respectively PAR_ℂ).

    Both closed thresholds, $Y \le \mathrm{per}_m(X)$ and $Y \ge \mathrm{per}_m(X)$, also lie in PAR_ℝ and outside NP_ℝ, coNP_ℝ and Σ₂^ℝ. Negating one matrix row and the claimed value interchanges the thresholds. Their intersection is the graph.

    The separations use the superpolynomial lower bound for the border complexity of the permanent (Theorem 2.3 in the paper, cited from the Anthropic manuscript "VP ≠ VNP over every field" and its Lean formalization). Two families of results use no lower bound:

    - the graph theorems: a polynomial of polynomial degree whose graph has short existential, universal or ∃∀ real certificates has small border complexity;

    - AM_ℝ[O(1)] = NP_ℝ ⊊ AM_ℝ[poly].

