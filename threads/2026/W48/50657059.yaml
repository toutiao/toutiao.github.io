    - The results that the paper cites are explicit hypotheses of the theorems that use them, not axioms: SAFacts — facts (S2)–(S8) on semialgebraic sets; PermLowerBound — Theorem 2.3, the border-complexity lower bound for the permanent; BurgisserThm — Theorem 2.5; EffectiveQE — effective quantifier elimination [BPR06]; CountingBound — the counting bound (C) of Lemma 7.7; ClassFacts — the known inclusions between complexity classes. In particular, every separation is conditional on PermLowerBound, exactly as in the paper.

