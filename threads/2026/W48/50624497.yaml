  author: qalmakka
  text: In the last few decades the hype around GC kind of faded because GC is literally
    a complex solution designed to fix only one single class of leaks - memory leaks
    - which often makes other kinds of leaks (mutex, file descriptors, handles, ..)
    actually <i>harder</i> to handle unless the language is carefully designed around
    them. Just look at Java&#x27;s `try()` or `with` in Python, etc, which are afterthoughts
    added later. RAII may be rudimental but it can potentially fix <i>all</i> classes
    of leaks by introducing deterministic lifetimes and scopes which aren&#x27;t tied
    with the resource itself. There are other solutions for this? yes of course, but
    the success of Rust which is literally built over a stronger, deterministic form
    of RAII kind of makes debatable whether a better system is needed at all. Especially
    since LLMs are excellent at Rust and kind of make opting for &quot;weird&quot;
    languages moot. And I say this as a person which _loves_ niche languages and language
    design.<p>Nowadays you can probably vibe&#x2F;slopcode whatever you need with
    just a bit of Rust, Python&#x2F;shell scripts as glue and maybe Javascript if
    it&#x27;s a webapp (but we&#x27;ll likely replace that with WASM soon I&#x27;m
    afraid)
