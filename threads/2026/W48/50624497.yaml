  author: Xirdus
  text: It kinda does that, by using borrows. If A borrows B, then the upper bound
    of A&#x27;s lifetime is the borrow of B. You can control the lifetime of the borrow
    by creating a new mutable reference to B at a particular point (works regardless
    of whether the original borrow was mutable or immutable).
  score: 0
  posted_at: '2026-11-24T15:34:04Z'
- id: '50630221'
  parent_id: '50629713'
  author: klodolph
  text: In this case you’re really setting a lower bound on the borrow of B, not an
    upper bound on the lifetime of A.<p>I assure you this is not pedantry or a nitpick.
    The classic case here is if you want to borrow a local variable inside a thread…
    you need to ensure that the thread lifetime is bounded from above by the lifetime
    of the borrowed variable. This is why we have weird workarounds like std::thread::scope.
    If we could just express an upper bound on lifetime, it wouldn’t be necessary.
