  author: llm_nerd
  text: While it&#x27;s neat that we have tools to port stuff from one Turing complete
    runtime to another, the whole &quot;JavaScript&quot; element of the linked page
    is tenuous. WASM is a virtual machine made to run in web browsers. We had an asm.js
    that was the precursor to more easily transpile other languages -- transpiling
    between Turing complete languages has been a thing forever -- but extrapolating
    that to mean anything running in WASM is &quot;written in JavaScript&quot; is
    silliness.<p>It&#x27;s a legitimately funny basis for a piece, but it&#x27;s intellectually
    misleading.<p>And of course none of this is remotely new. We&#x27;ve had emscripten
    to compile LLVM intermediate code to WASM, or JavaScript for that matter, for
    about a decade and half.
