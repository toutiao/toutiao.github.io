  author: markasoftware
  text: 'LMAO HE&#x27;S USING WISP <a href="https:&#x2F;&#x2F;github.com&#x2F;MercuryWorkshop&#x2F;wisp-protocol"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;MercuryWorkshop&#x2F;wisp-protocol</a><p>Wisp
    is a component of a sketchy but impressive pre-AI project created by high schoolers
    to develop state of the art html5 based proxies to bypass restrictions on school
    networks that block game sites, etc. By &quot;HTML5 based&quot;, I mean you don&#x27;t
    get to run a socks proxy, change your browser settings, etc (many schools just
    distribute Chromebooks). Instead, you have to be able to navigate to the proxy
    site, type in the blocked destination URL, and then the Javascript on the website
    makes it act like the other website. The rough architecture is that it loads a
    proxied version of the site&#x27;s homepage, with a pretty fancy rewriter that
    modifies some asset urls and stuff, uses service workers to intercept ajax requests,
    and then overrides js functions to even intercept and proxy websockets. This is
    what it takes for modern SPAs to work. Supposedly their latest proxy Scramjet
    <a href="https:&#x2F;&#x2F;github.com&#x2F;MercuryWorkshop&#x2F;scramjet" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;MercuryWorkshop&#x2F;scramjet</a>
    is actually good enough to stream desktop games via the GeForce NOW website. I
    think this is an instance of it running: <a href="https:&#x2F;&#x2F;invisiproxy.com&#x2F;browsing"
    rel="nofollow">https:&#x2F;&#x2F;invisiproxy.com&#x2F;browsing</a><p>Anyway, WISP
    is a bad protocol. Its essentially meant to be a very shitty http2-like protocol
    that multiplexes tcp streams over a single tcp&#x2F;websocket stream. This is
    fundamentally not very hard, all you really need to do is be able to tell which
    data comes from which stream and do flow control. They fucked up the flow control,
    though: The CONTINUE message indicates how much buffer space is available &#x2F;
    how many more bytes can be accepted on a given stream at the time the CONTINUE
    message was generated. Every respectable protocol for flow control would instead
    transmit an absolute offset (eg, the sequence number in TCP). Because of this
    flaw, you can never be quite sure in WISP how many more bytes the other side is
    willing to accept on a stream: If you receive a CONTINUE frame while you were
    in the middle of sending packets on the same stream, you don&#x27;t know which
    of your inflight packets should count against the remaining flow control budget
    transmitted in the CONTINUE frame. They made two different versions of the protocol
    over time, and both suffer the same issue. I tried to tell them on their Discord
    but the only one who understood the flaw didn&#x27;t seem to care that much. <a
    href="https:&#x2F;&#x2F;github.com&#x2F;MercuryWorkshop&#x2F;wisp-protocol&#x2F;blob&#x2F;v2&#x2F;protocol.md"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;MercuryWorkshop&#x2F;wisp-protocol&#x2F;blob&#x2F;v2&#x2F;pro...</a><p>Regardless,
    I&#x27;m very proud that high schoolers are still up to the same sorts of shenanigans
    I was.'
