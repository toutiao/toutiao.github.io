  author: pjmlp
  text: |-
    I was talking in general, not JS specific, especially since JS has global namespace, note my second paragraph.<p>In any case, you have two ways to do something similar, kind of.<p><pre><code>    function with_file(filename, operation_fn) {
           let resource = null;

           try {
             resource = open_resource(filename);
             return operation_fn(resource);
           } finally {
              resource?.close()
               }
        }

        with_file(&quot;&#x2F;my&#x2F;path&#x2F;something&quot;, (fd) =&gt; {
            let data = fd.read_something()
            &#x2F;&#x2F; handle data
        })
    </code></pre>
    Naturally there are multiple variations thereof, on how to handle errors, or which way to parameterise how to close resources.<p>Then we have the C# inspired way,<p><pre><code>    using fd = open_resource(&quot;&#x2F;my&#x2F;path&#x2F;something&quot;)
        let data = fd.read_something()
        &#x2F;&#x2F; handle data

    </code></pre>
    And if open_resouce doesn&#x27;t support using declaration, an helper builder function can be used to wrap it in such a type.<p>Yes it isn&#x27;t as automatic as pure RAII, but it gets close enough for most practical purposes.
