  text: Around 5 years into my career, I became a tech lead. Over the following years,
    I slowly drifted towards roles that had less hands-on technical work and more
    managerial responsibilities.<p>I&#x27;ve always struggled with leaving hands-on
    work behind but what made it at first tolerable, and then a blessing, was the
    rise of Javascript. I think Javascript is so awful, and until recently so prevalent
    in the roles available to me, that it made me want to not be a Software Engineer
    anymore. I felt that Javascript was some sort of joke that stayed around long
    enough until it became a cancer to Software Engineering.<p>I only stayed in the
    profession, eventually as a manager, because I like dealing with people and still
    found &quot;human problems&quot; intellectually challenging and rewarding.<p>Every
    day you read many comments here from people who believe that AI took the fun away
    from their work and lives. It destroyed the reason that made them want to be Software
    Engineers. That&#x27;s exactly how I felt about Javascript.<p>But I feel the complete
    opposite about AI. In fact, <i>AI brought back the fun that was stolen from my
    life by Javascript</i>. I&#x27;m now retired and spend a good amount of my day
