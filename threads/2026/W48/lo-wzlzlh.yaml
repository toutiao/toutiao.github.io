  text: |-
    That's what CERN just announced it did.
    https://lwn.net/Articles/1092512/
    CERN is a huge CentOS site. It used to maintain its own free RHEL fork, Scientific Linux, co-maintained with FermiLab, which is the rather smaller US version of CERN.
    Then RH killed CentOS. CERN, safe to say, was *Not Happy.
    Furthermore CERN runs tens of thousands of custom monitoring and control computers -- its main device is ~9km wide and ~17km long. They are a mix of x86-64-v1 and x86-64-v2. RHEL and CentOS Stream no longer support thousands of those. RHEL 9 demands v2 and RHEL 10 requires v3.
    So while all the control and lab machines remain on some CentOS derivative, all the control machines moved to Debian.
    It's been a vast effort and they are building and distributing Debian boot and system images from CentOS infrastructure, which is not easy, but their infra is big.
    https://lwn.net/Articles/1092512/
