  text: |-
    Hang on, what? AFAIK it has never had a policy of using LTS kernels.
    This is 100% normal for the enterprise Linux sector. None of the big enterprise distro vendors use LTS kernels; they all maintain their own in-house kernel versions, backporting hundreds of downstream fixes from the community kernels into their own.
    Red Hat does it, SUSE does it, Canonical does it, and if you count all the RHEL clones -- the RHELatives, I call them -- that is 90+% of the enterprise Linux world.
    (That used to mean CentOS, White Box Linux, Scientific Linux, etc. Now, after The Purge in 2021-2022, it means Rocky Linux, AlmaLinux, Oracle Linux, Liberty Linux, etc.)
    When I first worked at SUSE, the chap at the next desk was one of the kernel patch backport  team, permanently.
    I have been actively and vocally criticising this in The Register for years now.
    But although I think times have changed and now there is an established LTS kernel policy, remember that the concept of LTS, even the abbreviation "LTS", is just 20Y old. The first ever free LTS distro called that was Ubuntu 6.06 "Dapper Drake".
    The logic is this: you buy an enterprise distro, you get kernel x.y, and you pay for support, which means the vendors will keep kernel version x.y patched, secure, and current for as long as you keep paying. 5-6 years by default, 10-12Y if you pay the original vendor more, and 15-20Y if you pay a 3rd party to keep it alive.
    This is how the enterprise Linux world pays the bills. You build your drivers against x.y and those drivers on that kit will work in a decade. You can ship a million cash registers or ATMs or whatever with your custom chips in and that driver module will still load and still work for 10 or 20 years. Companies pay millions for this, and that funds the day jobs of all the people who develop and maintain and document GNOME, Flatpak, OStree, systemd, Podman, Satellite, Foreman, Cockpit, Open Stack, etc. etc.
    Since they don't use upstream kernel versions they do not care of the upstream support lifetime. It's irrelevant. They are backporting bugfixes, drivers, filesystems, whole subsystems, from released stable kernels to the ancient 5 to 10 year old kernel versions that happened to be stable when the current enterprise distro went into beta test.
    This is what Greg K-H and co. are so upset about; nobody much pays them to keep those LTS kernels in maintenance, and that's because the companies that pay don't use them. They are indifferent. They won't care if there are no LTS kernels.
    If a given RHEL version happens to use the same version as an LTS kernel, it is basically by coincidence, and they are not tracking p.q.$current. They took p.q.0 and they update it in house and never pull from upstream again.
