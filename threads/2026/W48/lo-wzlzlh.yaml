  author: lproven
  text: |-
    As I said above: this means they took 6.12.0, more or less by coincidence, and they maintain it in house.
    No enterprise distro ever tracks upstream kernel versions.
    RH has a table, here: https://access.redhat.com/kb/3078
    Each release stays on that kernel version forever. That is what the customers are paying for.
    The only exception I know of is Oracle. Oracle "Unbreakable Linux" is CentOS with the serial numbers filed off, and it too stays on whatever RH happened to ship forever, but Oracle offers updated kernel version you can opt in to, called the UEK:
    https://docs.oracle.com/en/operating-systems/uek/
    This means you can keep a CentOS-compatible distro and not run a kernel that's 4 years out of upstream support. But it's no longer certified and all your custom drivers break. I have no numbers for how many use it, but I am guessing, not many.
