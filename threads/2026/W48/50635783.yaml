  text: Memorizing a dataset =&#x2F;= learning a task.<p>Cross entropy of a finite
    dataset measures signal + noise(redundancy, quirks, typos, etc)<p>If you have
    10MB of math data, the underlying task of learning the reasoning pattern might
    have low entropy and fit in a much lower LoRA rank, even though memorizing the
    dataset requires more.<p>On any task like GSM, Math500, Openthought3 this would
    just be massive overfitting.<p>Also they assume that the 2M-token context chunking
    is independent but for example logs are usually not.<p>---<p>I think this is good
    to point out, because the company seems to sell a solution to cram private company
    wikis into the Lora adapters, so the measures are upper bounds in terms of info
    due to their assumption of memorization.
