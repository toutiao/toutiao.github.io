  text: |-
    Why base this on Markdown, which is split up into a million dialects, many of which allow embedding HTML (and so they require parsing HTML to view it without losing formatting)?
    The author does strip any HTML (probably creating yet another dialect of Markdown in the process), but they don't otherwise specify which dialect you're supposed to use - so websites will end up incompatible between browsers.
    There are much better formats out there already. Djot, maybe?
    It also seems like pages can include YAML front matter - which is typical for Markdown documents, but isn't YAML also relatively hard to parse? It feels like it could be replaced with something simpler.

    also, checking the git repo, it seems like parts of the spec might be written by Claude? (at least I assume that's what this issue is, I'm not really sure)
