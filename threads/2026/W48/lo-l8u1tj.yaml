  text: |-
    Cool idea, but fully dropping HTML and stylesheets for everyone is too radical in my eyes. You will just end up with another Gopher. Why not allow the client to choose?
    One could do this elegantly by simply using HTTP/1.1 content negotiation to the fullest: The client indicates its preference for markdown:
    GET /about HTTP/1.1
    Host: example.com
    Accept: text/markdown;q=1.0, text/html;q=0.8, text/plain;q=0.5

    The server confirms which format is served, making sure to also set the Vary header for proper caching. The Link header is used to advertise all alternative formats.
    Content-Type: text/markdown; charset=utf-8
    Vary: Accept
    Link: </about>; rel="alternate"; type="text/html",
      </about>; rel="alternate"; type="application/json"

    A server can return a 406 Not Acceptable if it cannot satisfy a requested content type.
    And the client then can do whatever they like with the markdown (styling, etc.).
    Advertising Markdown via link has actually started picking up pace insofar that CMSs/generators do this to accomodate AI crawlers not having to parse HTML. One may view this as they want, but this means that it's anything but obscure usage of the standard, and will 'work' within the current web.
