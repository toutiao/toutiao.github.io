  text: |-
    Rust is not to blame for that example. Here&#x27;s the same example rewritten with iced:<p><pre><code>    use iced::widget::{column, *};
        use iced::{Center, Color, Fill, Theme, border, color};

        fn main() -&gt; iced::Result {
            iced::application(|| (), update, view)
                .window_size((500, 500))
                .run()
        }

        fn update(_: &amp;mut (), _: ()) {}

        fn view(_: &amp;()) -&gt; impl Widget&lt;()&gt; {
            let swatch = |c: Color| {
                container(&quot;&quot;)
                    .width(32)
                    .height(32)
                    .style(move |_| container::background(c))
            };
            let colors = [
                color!(0xff0000),
                color!(0x00ff00),
                color!(0x0000ff),
                color!(0xffff00),
                Color::BLACK,
                Color::WHITE,
            ];

            container(
                column![
                    text(&quot;Hello, World!&quot;).size(20).color(Color::WHITE),
                    row(colors.map(swatch)).spacing(8),
                ]
                .spacing(12)
                .align_x(Center),
            )
            .center(Fill)
            .style(panel)
        }

        fn panel(_: &amp;Theme) -&gt; container::Style {
            container::background(color!(0x505050)).border(border::color(color!(0x0000ff)).width(1))
        }
    </code></pre>
