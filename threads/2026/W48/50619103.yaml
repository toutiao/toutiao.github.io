  text: egui is the most mature, has built in accessibility, and is quite ergonomic
    and flexible. iced is a good alternative, it’s used for cosmic desktop and is
    a good option if you don’t want an imgui. if you’re happy with the trade off of
    using a web view, dioxus is really good - you still build the ui in native rust
    (not wasm) and the web view is used purely for rendering so that negates some
    of the cons of something like tauri (no ipc mechanisms required), and you get
    the rendering and accessibility of the web.<p>honourable mention to slint, seems
    mature and good but I’ve never personally used it.
