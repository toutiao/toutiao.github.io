  author: nicoburns
  text: |-
    With Dioxus Native:<p><pre><code>    use dioxus::native::{Config, LogicalSize, WindowAttributes};
        use dioxus::prelude::*;

        fn main() {
            let window = WindowAttributes::default().with_surface_size(LogicalSize::new(500.0, 500.0));
            let config = Config::new().with_window_attributes(window);
            dioxus::native::launch_cfg(app, vec![], vec![Box::new(config)]);
        }

        fn app() -&gt; Element {
            rsx! {
                Stylesheet { href: asset!(&quot;&#x2F;assets&#x2F;tailwind.css&quot;) }
                HelloWorld { text: &quot;World&quot; }
            }
        }

        #[component]
        fn HelloWorld(text: String) -&gt; Element {
            rsx! {
                div { class: &quot;flex flex-col gap-3 bg-[#505050] size-[500px] justify-center items-center shadow-lg border border-[#0000ff] text-xl text-white&quot;,
                    &quot;Hello, {text}!&quot;
                    div { class: &quot;flex gap-2&quot;,
                        div { class: &quot;size-8 bg-[red]&quot; }
                        div { class: &quot;size-8 bg-[lime]&quot; }
                        div { class: &quot;size-8 bg-[blue]&quot; }
                        div { class: &quot;size-8 bg-[yellow]&quot; }
                        div { class: &quot;size-8 bg-black&quot; }
                        div { class: &quot;size-8 bg-white&quot; }
                    }
                }
            }
        }
    </code></pre>
    You can also use standard CSS if you prefer it over tailwind. And if you wanted to deduplicate, the 6 divs can be written in a loop like so:<p><pre><code>    for color in [&quot;red&quot;, &quot;lime&quot;, &quot;blue&quot;, &quot;yellow&quot;, &quot;black&quot;, &quot;white&quot;] {
            div { width: &quot;32px&quot;, height: &quot;32px&quot;, background_color: color }
        }</code></pre>
