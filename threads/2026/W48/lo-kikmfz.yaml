    | # source:http://geocities.com/SiliconValley/heights/7052/opcode.txt |\n| | From:
    mark@omnifest.uwm.edu (Mark Hopkins) |\n| | Newsgroups: alt.lang.asm |\n| | Subject:
    A Summary of the 80486 Opcodes and Instructions |\n| | |\n| | (1) The 80x86 is
    an Octal Machine |\n| | This is a follow-up and revision of an article posted
    in alt.lang.asm on |\n| | 7-5-92 concerning the 80x86 instruction encoding. |\n|
    | |\n| | The only proper way to understand 80x86 coding is to realize that ALL
    80x86 |\n| | OPCODES ARE CODED IN OCTAL. A byte has 3 octal digits, ranging from
    000 to |\n| | 377. In fact, each octal group (000-077, 100-177, etc.) tends to
    encode a |\n| | specific variety of operation. All of these are features inherited
    from the |\n| | 8080/8085/Z80. |\n| | For some reason absolutely everybody misses
    all of this, even the Intel |\n| | people who wrote the reference on the 8086
    (and even the 8080). The opcode |\n| | scheme outlined briefly below is expanded
    starting in the 80386, but |\n| | consistently with the overall scheme here. |\n|
    | |\n| | As an example to see how this works, the mov instructions in octal are:
    |\n| | |\n| | 210 xrm mov Eb, Rb |\n| | 211 xrm mov Ew, Rw |\n| | 212 xrm mov
    Rb, Eb |\n| | 213 xrm mov Rw, Ew |\n| | 214 xsm mov Ew, SR |\n| | 216 xsm mov
    SR, Ew |\n| | |\n| | The meanings of the octal digits (x, m, r, s) and their correspondence
    to the |\n| | operands (Eb, Ew, Rb, Rw, SR) are the following: |\n| | |\n| | The
    digit r (0-7) encodes the register operand as follows: |\n| | REGISTER (r): 0
    1 2 3 4 5 6 7 |\n| | Rb = Byte-sized register AL CL DL BL AH CH DL BH |\n| | Rw
    = Word-sized register AX CX DX BX SP BP SI DI |\n| | |\n| | The segment register
    digit s (0-7) encodes the segment register as follows: |\n| | SEGMENT REGISTER
    (s): 0 1 2 3 4 5 6 7 |\n| | SR = Segment register ES CS SS DS \\<Reserved\\> |\n|
    | |\n| | The digits x (0-3), and m (0-7) encode the address mode according to
    |\n| | the following scheme. One or more bytes (labeled: Disp) may immediately
    |\n| | follow xrm as described below. |\n| | |\n| | TABLE 1: 16-BIT ADDRESSING
    MODE (x, m): |\n| | Eb = Address of byte-sized object in memory or register |\n|
    | Ew = Address of word-sized object in memory or register |\n| | Dw = Unsigned
    word |\n| | Dc = Signed byte (\"character\"), range: -128 to +127 (decimal). |\n|
    | Db = Unsigned byte |\n| | |\n| | x m Disp Eb Ew |\n| | ------------------ |\n|
    | 3 r Rb Rw |\n| | 0 6 Dw DS:[Dw] |\n| | 0 m Base:[0] (except for xm = 06). |\n|
    | 1 m Dc Base:[Dc] |\n| | 2 m Dw Base:[Dw] |\n| | |\n| | x 0 Disp DS:[BX + SI
    + Disp] |\n| | x 1 Disp DS:[BX + DI + Disp] |\n| | x 2 Disp SS:[BP + SI + Disp]
    |\n| | x 3 Disp SS:[BP + DI + Disp] |\n| | x 4 Disp DS:[SI + Disp] |\n| | x 5
    Disp SS:[DI + Disp] |\n| | x 6 Disp DS:[BP + Disp] (except for xm = 06) |\n| |
    x 7 Disp DS:[BX + Disp] |\n| | |\n| | This expands into the following table: |\n|
    | |\n| | TABLE 1a: 16-BIT ADDRESSING MODE (x, m) for the expansion impaired. :)
    |\n| | xm Eb/Ew xm Eb/Ew xm Eb/Ew xm Eb/Ew |\n| | 00 DS:[BX + SI] 10 Dc DS:[BX
    + SI + Dc] 20 Dw DS:[BX + SI + Dw] 30 AL/AX |\n| | 01 DS:[BX + DI] 11 Dc DS:[BX
    + BI + Dc] 21 Dw DS:[BX + DI + Dw] 31 CL/CX |\n| | 02 SS:[BX + SI] 12 Dc SS:[BP
    + SI + Dc] 22 Dw SS:[BP + SI + Dw] 32 DL/DX |\n| | 03 SS:[BX + DI] 13 Dc SS:[BP
    + DI + Dc] 23 Dw SS:[BP + DI + Dw] 33 BL/BX |\n| | 04 DS:[SI] 14 Dc DS:[SI + Dc]
    24 Dw DS:[SI + Dw] 34 AH/SP |\n| | 05 DS:[DI] 15 Dc DS:[DI + Dc] 25 Dw DS:[DI
    + Dw] 35 CH/BP |\n| | 06 Dw DS:[Dw] 16 Dc SS:[BP + Dc] 26 Dw SS:[BP + Dw] 36 DH/SI
    |\n| | 07 DS:[BX] 17 Dc DS:[BX + Dc] 27 Dw DS:[BX + Dw] 37 BH/DI |\n| | |\n| |
    Operands where x is 0, 1, or 2 are all pointers. If the instruction is a WORD
    |\n| | instruction (211, 213, 214, 216 are), then this pointer addresses a |\n|
    | word-sized object. The format of the object at the indicated address will |\n|
    | always be low-order byte first, and high-order byte second. Otherwise the |\n|
    | instruction is a BYTE instruction (210, 212) and the pointer addresses |\n|
    | byte-sized object at the indicated address. |\n| | |\n| | The default segments
    (DS:, SS:) can be overridden with a segment prefix. In |\n| | all cases it's understood
    that everything has the default segment DS, except |\n| | for the two stack/frame
    pointers (BP and SP) whose default segment is SS. |\n| | That will be explained
    below. |\n| | |\n| | Modes where x = 1, or 2 will require displacement bytes (Dc
    or Dw) to follow |\n| | the opcode as explained above. |\n| | |\n| | When x =
    3, WORD sized instructions address the word registers (AX, CX, ...) |\n| | and
    the BYTE size instructions the byte registers (AL, CL, ...). |\n| | |\n| | EXAMPLE
    1: The instruction opcode: 210 135 375 |\n| | Here, xm = 15, and r = 3, so the
    operands are: |\n| | |\n| | mov Eb, Rb |\n| | =\\> |\n| | mov byte ptr DS:[DI
    + Dc], BL |\n| | |\n| | The displacement, Dc, is 375 (or fd in hexadecimal), which
    is the signed byte |\n| | -3. So the instruction reads: |\n| | |\n| | mov byte
    ptr DS:[DI - 3], BL |\n| | |\n| | or just: |\n| | mov [DI - 3], BL |\n| | |\n|
    | In C-like notation, the meaning of this operation would be: |\n| | |\n| | ((byte
    \\*)DS) [DI - 3] = BL; |\n| | |\n| | EXAMPLE 2: The instruction opcode: 216 332
    |\n| | Here, xm = 32, and s = 3, so the operands are: |\n| | |\n| | mov SR, Ew
    |\n| | =\\> |\n| | mov DS, DX |\n| | |\n| | A move to CS is not possible (because
    the far jump instruction already does |\n| | that) so that the opcode sequence:
    |\n| | |\n| | 216 x2m |\n| | |\n| | is free to be used for encoding something
    else. |\n| | |\n| | EXAMPLE 3: As an illustration of why it's better to think
    in octal, just look |\n| | at the opcodes for the binary arithmetic instructions:
    |\n| | |\n| | 0P0 xrm Op Eb, Rb |\n| | 0P1 xrm Op Ew, Rw |\n| | 0P2 xrm Op Rb,
    Eb |\n| | 0P3 xrm Op Rw, Ew |\n| | 0P4 Db Op AL, Db |\n| | 0P5 Dw Op AX, Dw |\n|
    | |\n| | They all have the same form, with a single digit encoding the operator
    as |\n| | follows: |\n| | P Op P Op |\n| | 0 add 1 or |\n| | 2 adc 3 sbb |\n|
    | 4 and 5 sub |\n| | 6 xor 7 cmp |\n| | |\n| | That's a good fraction of your
    reference table right there. |\n| | |\n| | EXAMPLE 4: The same mapping is used
    in the immediate to memory/register form |\n| | of these operations: |\n| | |\n|
    | 200 xPm Db Op Eb, Db |\n| | 201 xPm Dw Op Ew, Dw |\n| | 203 xPm Dc Op Ew, Dc
    |\n| | |\n| | (2) An Outline of 80x86 Instructions and Encoding |\n| | The authors
    of 8080 and 8086 references (including Intel's own references) |\n| | are apparently
    not aware of the octal nature of their own machines, and the |\n| | result is
    an almost grotesque complication and bungling up in the presentation |\n| | of
    something that is actually fairly simple. Thus, people claim that it's |\n| |
    almost impossible to know 8086 binary by heart, whereas in fact I know most of
    |\n| | it by memory. I'll straighten out the mess for you here. |\n| | |\n| |
    As alluded to above, instructions are encoded as follows: |\n| | |\n| | op xrm
    Const |\n| | |\n| | where \\* op is a 1 or 2 byte opcode, |\n| | \\* xrm (if present)
    constitutes 3 octal digits whose normal uses are: |\n| | r = Register operand,
    xm = Memory or Register operand. |\n| | It may be followed immediately by a \"displacement\"
    byte or word, |\n| | depending solely on the digits x and m. |\n| | \\* Const
