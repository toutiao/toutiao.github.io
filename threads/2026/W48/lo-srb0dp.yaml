    It's indeed really good and well delivered.
    One of the point raised is blogs vs. gardens. After a long time, I've found something that suits me. It's a garden with two additional steps: one for quick idea/data dumps and one for updates. The idea is that garden is the most readable but may not be fully up-to-date until paired with the quick idea/data dump. The update stuff is close to a blog but it doesn't exist with the garden part; it's also compatible with the RSS model and means readers don't have to re-read everything just to get updates.
    To be honest, I'm not practicing this as much as I'd like but there are other reasons. In any case, I'm happier about this scheme and easily picture myself using it unlike with the current dichotomy between gardens and blogs. I'm actually surprised this isn't more common.
