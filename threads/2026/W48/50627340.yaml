  text: I think this is a bad example of a good larger point. A better example for
    me is that Claude refused to help me hack the ads out of my smart TV, which is
    my right by law under the DMCA. (Fortunately codex did help me, for now).<p>For
    those of you who are young, you may feel really empowered by AI, but for those
    us who remember the young web, we&#x27;ve seen this whole playbook before. In
    the first 10 years of major web adoption, everything kinda just had no oversight.
    You could get whatever songs you want for free from Napster, you could sell almost
    anything on ebay [a friend was selling bootleg dragonball Z shows burned to CD],
    corporations didn&#x27;t really have meaningful websites other than placeholders,
    you could write whatever you want on your stupid personal blog and it was effectively
    anonymous, no social media, lots of chat rooms, lots of sketchy stuff too.<p>Today
    it&#x27;s much more gatekept. What you can find on search is locked down, you
    have &quot;prove your age&quot; to go on tons of sites (such as porn in many states),
    &quot;social media&quot; where you can&#x27;t even get a straightforward view
    of your OWN feed without weird recommendations, sometimes the corporations are
    the ones expecting ME to install their stupid app to use my car or whatever, I
    can&#x27;t airplay a movie I buy on amazon to my TV because some bullshit software
    and hardware built into these very systems.<p>In the future they will fight tooth
    and nail to lock down AI just as much. Do you really think 10 years from now using
    Claude will be allowed to hack GTA6? The major AI providers someday will refuse
    to download torrents, refuse to download youtube videos, refuse to use websites
    that don&#x27;t allow it, will be blocked from seeing amazon reviews [if amazon
    wants], won&#x27;t criticize certain corporations or countries.<p>We need to have
    our own local AI before that day.
