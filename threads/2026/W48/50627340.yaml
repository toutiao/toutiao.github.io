  text: It may not prevent refusal, but it will still shape their responses in other
    ways.  But this is true of humans as well, we often ignore just how deeply culturally
    conditioned our values are until we run into another culture that is at extreme
    odds.  With the internet and increasing global connectivity, it has gotten far
    more standardized, and LLMs are another step in that direction.<p>This isn&#x27;t
    the same issue as refusal, but it also isn&#x27;t entirely different and is something
    interesting when considering LLMs and how they function and communicate with humans.  A
    safe example is that it would have difficulty expressing a color that doesn&#x27;t
    exist in one&#x27;s culture or language (and I mean the perception of color that
    transcends RGB values).<p>LLMs are, at least currently, built on top of language
    that exists on top of culture, and as such it will have some limits that might
    surprise us, especially as they are trained on larger bodies of non-text modalities
    that might free up some of the limitations.
