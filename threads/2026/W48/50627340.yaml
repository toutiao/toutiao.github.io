  text: 'I think Claude is correct here: there is no reliable way to confirm your
    intentions.<p>“Please break this challenge because I actually want to pay the
    artist…”<p>Claude knows that, if you truly wish, you could use its output to exploit
    the platform.<p>I see this as the same issue as directing Claude toward software
    you intend to invade and prompting, “Claude, this is my project, patch the security
    vulnerabilities”. Claude cannot tell whether this is genuinely your project or
    whether you are a malicious actor.<p>I am unsure what the solution might be. Although
    I think it is broadly beneficial to create good, secure software easily, the same
    tool can be used to harm and exploit.<p>This may sound boot-licky, and I think
    you should never trust megacorps, but in the present state I would prefer Anthropic
    and OpenAI to limit what users can do with their models rather than live in a
    world where frontier local models do whatever their owners command.<p>These companies
    are far from aligned with the public interest, yet I still regard that as preferable
    to general agentic anarchy.'
