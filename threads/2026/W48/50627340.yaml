  author: largbae
  text: 'I agree with the premise that using commercial agents will lock you into
    their brand of enshittification, but there is a solution: Run your own open-source
    agent.<p>I use Hermes but there are others. The key is once you access models
    via Your agent, your conversation history and customizations are now yours. Hermes
    writes its own skills as you interact with it, so the model provider does not
    matter much. I mostly use a spark-hosted GLM as the main model, but can switch
    at my whim. The skills keep the agent behavior consistent.<p>Using your agent
    as a gateway doesn&#x27;t limit your coding options either: Just like you, Hermes
    can drive Cursor, Codex and Claude Code to handle complex coding tasks without
    reinventing that wheel.<p>I think a key step on the path to freedom is hosting
    your own agent(s) and avoiding vendor lock-in.'
