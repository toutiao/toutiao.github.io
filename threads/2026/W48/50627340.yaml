  author: qiangull
  text: 'The dependency argument cuts both ways, and the local side isn&#x27;t as
    clean as it sounds.<p>I maintain a Windows tool that indexes local video by content.
    Opting into a hosted description API is explicit, but the moment you use one,
    the quality of your saved searches belongs to someone else&#x27;s model version.
    That&#x27;s the main reason the local path stays pinned.<p>What people don&#x27;t
    expect is that going local pins you to a driver window instead. My CUDA 13 components
    need compute capability 7.5 or newer, so a GTX 10-series user simply can&#x27;t
    run the local vision path, and there&#x27;s no CPU fallback for it. AMD users
    have to build the ROCm variant on their own machine because I can&#x27;t produce
    those artifacts on mine. Nobody broke an SLA in either case.<p>Rule of thumb I
    landed on: whichever side you pick, you&#x27;re buying a support window. The only
    real difference is who gets to decide when it closes.'
