  author: logicallee
  text: 'Hi everyone. I&#x27;d love this community&#x27;s feedback about what the
    article says about music. Do you think I should build it?<p>Here is my current
    situation with my projects, so you can see where I&#x27;m coming from:<p>Regarding
    this:<p>&gt;&quot;Instagram makes it hard for me to connect with the band outside
    of their platform. I was trying to make this connection manually myself at first.
    I would just email myself a reel from my phone. Then when I&#x27;m back on the
    sofa and in the mood to track down new music, I&#x27;d open the reels and do my
    best to search on Bandcamp or YouTube or try to figure out if some of these musicians
    had a way to buy music from them. Very few do these days. They send you their
    Spotify link or send you to their TikTok page. I don&#x27;t want to do any of
    that. I&#x27;d like to trade US dollars in exchange for some music files I can
    download onto my computer, where I can listen as much as I like on any device
    I own thank you please. Retro maxxing.&quot;<p>It is something I could make available
    on a site I built yesterday (you can see the founding date in the logo at the
    top left.)<p>I haven&#x27;t publicly launched the site yet, I am working on how
    I can make it available, as far as I understand the legal framework, which is
    important, is extremely regulated. I&#x27;ve had AI put this in our policies but
    I would have to become a registered broker to do any significant trading. While
    it&#x27;s a joke, it&#x27;s another matter, but securities law is important and
    serious.<p>With what AI and I built yesterday, it does have analyst writing, so
    creators are able to sell subscriptions to their writing to their followers.<p>I
    also built another project that is a just-for-fun game all about the past, but
    a Redditor who playtested it told me:<p>&quot;if it’s the game, what’s the point?  Let’s
    say you allow a single S&amp;P 500 stock each year.  Well, one can look that up.
    But then why play?  The entire game is “i go online and ask AI which stock did
    best in 1970 and every year after,  and then I put that in”? That’s hardly a game.  That’s
    just looking up something meaningless and typing it in.<p>No one is gonna “guess”
    which stock did best in 1987. As I say, I do this and I have no idea. So why would
    anyone play this game?<p>Since people loook but don’t click, you lose them with
    the “what’s the point?” Problem&quot;<p>Which is why I attempted to expand into
    something that would be more interesting. Who wants to look up or play through
    what happened in 1980, right?  Based on my user statistics, approximately no one.<p>Okay,
    so now I have this ezmon-e site I built yesterday where people can joke about
    what&#x27;s going on now, participate in discussions, or write analysis. I&#x27;m
    somewhat afraid to launch it, because I want to provide my users with real value.
    I don&#x27;t want to facilitate fraud or insider trading. So I&#x27;m stuck with
    the fact that everyone is interested in the economy and businesses, nobody wants
    to look at data that is from decades ago, but regulation is very important. (I
    have a local Gemma 4 e4b model check every single article and every single comment
    for compliance with our terms and with securities law.)<p>So, I am thinking that
    hosting simple music files would be really easy in comparison. I would just build
    on the creator infrastructure (which I intended for analysts who are professional
    writers, and which supports free and paid content) and allow creators to upload
    free and paid music as long as they hold the copyright, and I&#x27;d take down
    anything that receives a takedown request for copyright infringement. Since we
    have a local model that adjudicates, I could make it so that people can appeal
    takedown requests if they are the genuine copyright holder, our model could adjudicate.
    (At the moment some music labels mass spam takedown requests even when they have
    no ownership over the copyright. A lot of creators have their content unfairly
    removed. We can stop that.)<p>okay, but how can I help achieve what the OP wants?  branding
    wise it is very far from ezmon-e or the Rich in Hindsight game. Should I make
    a new site for it?<p>Uploading tiny music files and album art is really simple
