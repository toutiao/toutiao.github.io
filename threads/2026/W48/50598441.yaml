  author: freeopinion
  text: 'I feel some legitimate criticism here, and some that I think is emotional
    (as you wrote: resentment).<p>I think 17 million lines of incomprehensible code
    is something to legitimately criticize. If it is incomprehensible, throw it out.
    But if it is comprehensible, just really dense and hard, well... Yeah I get the
    resentment. But it smells like the kind of resentment most of the population has
    for human mathematicians in general. So it makes me nervous to throw those stones.<p>If
    humans can decipher the proof and find that it holds up, then does it really matter
    if Ant releases the model? We don&#x27;t demand that humans release their models.
    We just study their proofs.<p>It seems to me that the real hazard is in the 17
    million lines of code. If we lose the ability for humans to have the capacity
    to study the proof, I think we have to dismiss it as science (or math, I guess).
    If it takes 4 human lifetimes to churn through all that code, we might still be
    able to get through it if we have a way to hand off progress. One team can do
    the first 1&#x2F;4 over 20 years and gradually transition to team 2 who does the
    next 1&#x2F;4 over the next 20 years. If we develop a way to do that, we can still
    count the AI result as science after it gets reviewed. That might take 5 years
    or 55 years or 155 years. But if it gets done, it stands.<p>Of course, a lot of
    scientists&#x2F;mathematicians will decide they don&#x27;t want to spend their
    entire professional career studying 1&#x2F;4 or 1&#x2F;10 or 1&#x2F;100 of some
    AI output. That&#x27;s fair. But if enough people take up the challenge and see
    it all the way through using methods the rest of the community can trust, then
    we really do have next level math. We might transition from the era where many
    people and many teams work over a period of decades on many different ideas and
    approaches to the same problem. Instead, many people and many teams work under
    a strict structure on the exact same proof for decades in order to confirm or
    reject it. We go from years and years to formulate a breakthrough that can be
    rapidly confirmed or rejected to a magic, seemingly instant breakthrough followed
    by years and years--decades, even--of work to confirm or reject.<p>I don&#x27;t
    blame anyone who doesn&#x27;t want to participate in that new process. But most
    people don&#x27;t want to participate in the original process, either. The years
    and years of disciplined pursuit required in Mathematics has always been a moat.
    Maybe the moat just got wider and less gratifying to cross. But in my opinion
    we have not reached a point where I can accept these AI results based on the word
    of another AI. If they haven&#x27;t been confirmed by humans, they haven&#x27;t
    been confirmed.'
  score: 0
