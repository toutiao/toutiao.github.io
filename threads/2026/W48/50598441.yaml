  url: https://johncarlosbaez.wordpress.com/2026/11/22/masullo-on-the-riemann-hypothesis/
  title: Masullo on the Riemann Hypothesis | Azimuth
  fetch_status: success
  content: "# [Azimuth](https://johncarlosbaez.wordpress.com/)\n\n&nbsp;\n\n## Masullo
    on the Riemann&nbsp;Hypothesis\n\nOn November 20, 2026, two attempts to prove
    the Riemann Hypothesis appeared. One, by Levent Alpöge working with Claude, exists
    mainly as 17 million lines of Lean code. The other, by Alessandro Masullo, is
    a 940-page human-written manuscript that Ravi Vakil posted on his blog:\n\n• Ravi
    Vakil, [Hurried announcement: Alessandro Masullo GRH](https://math216.wordpress.com/2026/11/20/hurried-announcement-alessandro-masullo-grh/),
    _Math 216_ blog, November 20, 2026.\n\n• Alessandro Maria Masullo, [The Music
    of the Primes](https://sites.google.com/view/tmotp/home?authuser=0), draft, November
    20, 2026.\n\nWhile there’s been an enormous outpouring about the drama of this
    situation, so far it’s hard to find good simple accounts of Masullo’s paper. Let
    me try to fill this gap by sketching Masullo’s proof strategy in a very simplified
    way, along with some problems people have noted.\n\nSince I am not an expert on
    number theory, all this is very tentative and I could be making serious mistakes.
    Please let me know if you see some!\n\nIf you also want a sketch of the Alpöge
    / Claude attempt, check out these:\n\n• Michael Rubinstein, [The Alpöge-Claude
    proof of the Riemann hypothesis explained for the Riemann zeta function](https://www.math.uwaterloo.ca/~mrubinst/alpoge_claude_grh/zeta-paper.pdf).\n\n•
    Jimmie Adriazola, [An end-to-end reconstruction of the Alpöge–Claude route to
    the Riemann hypothesis](https://github.com/jimjamzola/RH-Alpoge-Reconstruction).\n\n###
    Zeros as poles \n\nOkay—here we go! The Riemann zeta function is\n\n![\\displaystyle{
    \\zeta(s) = \\sum_{n=1}^\\infty \\frac{1}{n^s} = \\prod_p \\frac{1}{1 - p^{-s}}
    }](https://s0.wp.com/latex.php?latex=%5Cdisplaystyle%7B++%5Czeta%28s%29+%3D+%5Csum_%7Bn%3D1%7D%5E%5Cinfty+%5Cfrac%7B1%7D%7Bn%5Es%7D+%3D+%5Cprod_p+%5Cfrac%7B1%7D%7B1+-+p%5E%7B-s%7D%7D+%7D+&bg=ffffff&fg=333333&s=0&c=20201002)\n\nfor
    ![\\mathrm{Re}(s) > 1,](https://s0.wp.com/latex.php?latex=%5Cmathrm%7BRe%7D%28s%29+%3E+1%2C&bg=ffffff&fg=333333&s=0&c=20201002)
    and it extends to a meromorphic function on the whole complex plane. The Riemann
    Hypothesis says that all its ‘nontrivial’ zeros have real part ![1/2.](https://s0.wp.com/latex.php?latex=1%2F2.&bg=ffffff&fg=333333&s=0&c=20201002)\n\nMasullo’s
    argument works with the zeta function’s ‘logarithmic derivative’, ![\\zeta'/\\zeta.](https://s0.wp.com/latex.php?latex=%5Czeta%27%2F%5Czeta.&bg=ffffff&fg=333333&s=0&c=20201002)
    Taking the log of the product formula and differentiating gives\n\n![\\displaystyle{
    -\\frac{\\zeta'(s)}{\\zeta(s)} = \\sum_{n=1}^\\infty \\frac{\\Lambda(n)}{n^s}
    }](https://s0.wp.com/latex.php?latex=%5Cdisplaystyle%7B++-%5Cfrac%7B%5Czeta%27%28s%29%7D%7B%5Czeta%28s%29%7D+%3D+%5Csum_%7Bn%3D1%7D%5E%5Cinfty+%5Cfrac%7B%5CLambda%28n%29%7D%7Bn%5Es%7D+%7D+&bg=ffffff&fg=333333&s=0&c=20201002)\n\nwhere
    ![\\Lambda(n) = \\log p](https://s0.wp.com/latex.php?latex=%5CLambda%28n%29+%3D+%5Clog+p&bg=ffffff&fg=333333&s=0&c=20201002)
    if ![n](https://s0.wp.com/latex.php?latex=n&bg=ffffff&fg=333333&s=0&c=20201002)
    is a power of a prime ![p,](https://s0.wp.com/latex.php?latex=p%2C&bg=ffffff&fg=333333&s=0&c=20201002)
    and ![0](https://s0.wp.com/latex.php?latex=0&bg=ffffff&fg=333333&s=0&c=20201002)
    otherwise. So the right side can be written as a sum over primes. On the other
    hand, a function’s logarithmic derivative has a simple pole at each zero of the
    function. Roughly speaking,\n\n![\\displaystyle{ -\\frac{\\zeta'(s)}{\\zeta(s)}
    = \\frac{1}{s-1} - \\sum_\\rho \\frac{1}{s - \\rho} + \\text{(boring terms)} ,
    }](https://s0.wp.com/latex.php?latex=%5Cdisplaystyle%7B++-%5Cfrac%7B%5Czeta%27%28s%29%7D%7B%5Czeta%28s%29%7D+%3D+%5Cfrac%7B1%7D%7Bs-1%7D+-+%5Csum_%5Crho+%5Cfrac%7B1%7D%7Bs+-+%5Crho%7D+%2B+%5Ctext%7B%28boring+terms%29%7D+%2C+%7D+&bg=ffffff&fg=333333&s=0&c=20201002)\n\nwhere
    ![\\rho](https://s0.wp.com/latex.php?latex=%5Crho&bg=ffffff&fg=333333&s=0&c=20201002)
    ranges over the zeros of the Riemann zeta function. This second formula is a sum
    over zeros.\n\nSetting these two expressions equal gives what number theorists
    call an ‘explicit formula’: an exact identity linking primes and zeros of the
    zeta function.\n\nThis is what Masullo and others mean by “the music of the primes”:
    each zero contributes one oscillating wave to the distribution of primes. You
    can see my animations of this here:\n\n• John Baez, [Riemann’s explicit formulas](https://math.ucr.edu/home/baez/mathematical/riemann_explicit_formula/explicit_formulas.html).\n\nIn
    these terms, the Riemann Hypothesis says:\n\n> ![\\zeta'/\\zeta](https://s0.wp.com/latex.php?latex=%5Czeta%27%2F%5Czeta&bg=ffffff&fg=333333&s=0&c=20201002)
    has no poles with real part greater than ![1/2,](https://s0.wp.com/latex.php?latex=1%2F2%2C&bg=ffffff&fg=333333&s=0&c=20201002)
    except the one at ![s = 1.](https://s0.wp.com/latex.php?latex=s+%3D+1.&bg=ffffff&fg=333333&s=0&c=20201002)\n\nMasullo’s
    strategy for proving this is to find a new formula for the logarithmic derivative
    of the Riemann zeta function, one that visibly has no poles to the left of the
    line ![\\mathrm{Re}(s) = 1/2.](https://s0.wp.com/latex.php?latex=%5Cmathrm%7BRe%7D%28s%29+%3D+1%2F2.&bg=ffffff&fg=333333&s=0&c=20201002)
    It’s called a ‘trace formula’.\n\n### The generalized Riemann hypothesis \n\nBut
    wait! Neither Alpöge and Masullo are content to prove the Riemann hypothesis:
    they want to prove the _generalized_ Riemann Hypothesis. For ordinary integers,
    this concerns the functions\n\n![\\displaystyle{ L(s,\\chi) = \\sum_{n=1}^\\infty
    \\frac{\\chi(n)}{n^s} }](https://s0.wp.com/latex.php?latex=%5Cdisplaystyle%7B++L%28s%2C%5Cchi%29+%3D+%5Csum_%7Bn%3D1%7D%5E%5Cinfty+%5Cfrac%7B%5Cchi%28n%29%7D%7Bn%5Es%7D+%7D+&bg=ffffff&fg=333333&s=0&c=20201002)\n\nwhere
    ![\\chi](https://s0.wp.com/latex.php?latex=%5Cchi&bg=ffffff&fg=333333&s=0&c=20201002)
    is a ‘Dirichlet character’. This is a function on the natural numbers that is
    periodic with some period ![N,](https://s0.wp.com/latex.php?latex=N%2C&bg=ffffff&fg=333333&s=0&c=20201002)
    obeys\n\n![\\chi(mn) = \\chi(m)\\chi(n)](https://s0.wp.com/latex.php?latex=%5Cchi%28mn%29+%3D+%5Cchi%28m%29%5Cchi%28n%29&bg=ffffff&fg=333333&s=0&c=20201002)\n\nfor
    all ![m, n,](https://s0.wp.com/latex.php?latex=m%2C+n%2C&bg=ffffff&fg=333333&s=0&c=20201002)
    vanishes on numbers that share a factor with ![N,](https://s0.wp.com/latex.php?latex=N%2C&bg=ffffff&fg=333333&s=0&c=20201002)
    and has its other values being roots of unity. The Riemann zeta function is the
    simplest case: here ![\\chi(n) = 1](https://s0.wp.com/latex.php?latex=%5Cchi%28n%29+%3D+1&bg=ffffff&fg=333333&s=0&c=20201002)
    for all ![n.](https://s0.wp.com/latex.php?latex=n.&bg=ffffff&fg=333333&s=0&c=20201002)\n\nOne
    version of the generalized Riemann Hypothesis says:\n\n> every zero of ![L(s,\\chi)](https://s0.wp.com/latex.php?latex=L%28s%2C%5Cchi%29&bg=ffffff&fg=333333&s=0&c=20201002)
    with ![0 < \\mathrm{Re}(s) < 1](https://s0.wp.com/latex.php?latex=0+%3C+%5Cmathrm%7BRe%7D%28s%29+%3C+1&bg=ffffff&fg=333333&s=0&c=20201002)
    lies on the line ![\\mathrm{Re}(s) = 1/2.](https://s0.wp.com/latex.php?latex=%5Cmathrm%7BRe%7D%28s%29+%3D+1%2F2.&bg=ffffff&fg=333333&s=0&c=20201002)\n\nThis
    implies many results about primes in arithmetic progressions. For example, Hardy
    and Littlewood showed it implies that primes equal to 3 mod 4 are more common
    than primes 1 mod 4. They also showed it implies every odd number \\> 5 is a sum
    of three primes! (Helfgott found an alternative, more complicated proof in 2013.)\n\nBut
    Masullo also wants more: he wants to prove the analogous statement for L-functions
    of general [Hecke characters](https://en.wikipedia.org/wiki/Hecke_character).
    These involve a choice of [algebraic number field](https://en.wikipedia.org/wiki/Algebraic_number_field)
    ![F](https://s0.wp.com/latex.php?latex=F&bg=ffffff&fg=333333&s=0&c=20201002),
    which gives a [ring of integers](https://en.wikipedia.org/wiki/Algebraic_number_field#Algebraicity,_and_ring_of_integers)
    generalizing the usual integers. This further generalization implies a [huge number
