    &quot;The Sentinel&quot;.<p>The other side of this being a breakthrough: is it?
    I use Claude and it regularly does shoddy work pretty quickly all in the spirit
    of getting to a result. At 17k LOC to &quot;prove&quot; it I&#x27;d be hard pressed
