  author: mapontosevenths
  text: It&#x27;s not. It&#x27;s probably pointless, but I will try to explain in
    layman&#x27;s terms.<p>They perform computation that transforms the data into
    something new. In this case, answers that didn&#x27;t exist before.<p>Think of
    it as compression. You take the sum total of all human knowledge (give or take
    a bit) and the prompt. Then you try to compress that data through the funnel of
    the prompt, and aftwards compare the result to correct (but novel) answer you
    created in advance. You train it to do this many times.<p>It eventually learns
    to compress all of that data in ways that produce correct answers, even when the
    answer was NEVER IN THE TRAINING DATA TO BEGIN WITH. It learns to derive new data
    from the existing data, because that&#x27;s the only possible way for it to achieve
    the goal. Remember that many of the answers we are training it to produce  didn&#x27;t
    exist in the raw training data.<p>The way it calculates those answers is complicated
    and very mathy, so it&#x27;s easy not to understand, but it&#x27;s no parrot and
    the output has little relation to the input. Hell, you can run doom on the weights
    of an LLM. It&#x27;s doing real, and transformative, computation that results
    in something very much new.<p>That&#x27;s how it can do things like solve mathematical
    puzzles that humans have been stumped by for decades.
