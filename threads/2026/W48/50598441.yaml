  author: imtringued
  text: 'If you accept the argument that machine assisted proofs are valid then humans
    can at least try their hand at creating the shortest possible lean proofs, but
    if you decided that reading the proof base at all is meaningless then a minimized
    proof becomes worthless. This is an inherently anti math position, because by
    that logic we can simply enumerate all observed facts and we no longer need any
    generalized rules.<p>A proof is a valid trajectory through the action space of
    permitted logical steps. Finding a trajectory proves reachability: the given axioms
    and repeated application of basic and known theorems are sufficient to prove the
    statement. In the absence of proper abstractions, that trajectory may end up being
    a 17 million line detour.<p>My position is as follows: Math is starting to look
    a lot like SOTA ML distillation. The real game isn&#x27;t using human effort to
    find a valid trajectory. What math is actually about is minimizing the total description,
    aka finding the shortest path in proof space while minimizing the complexity of
    the lemmas. I don&#x27;t think this is something that AI can push humans out of.<p>Meanwhile
    your position is to just keep expanding the proof until we reach mathematical
    denial of service. The proof keeps growing until nobody can afford the AI to even
    understand the proof.'
