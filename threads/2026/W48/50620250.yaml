  author: gjm11
  text: 'A proof is meant to be two things: a rigorous demonstration of correctness,
    and a means of conveying understanding.<p>The Alpöge-Claude Lean monstrosity is
    definitely a proof in the first sense. The fact that it passes Lean checking means
    that it&#x27;s a complete sequence of steps, all of them correct according to
    the logic of Lean. The fact that it&#x27;s been checked with multiple different
    checkers means that it almost certainly really is that, rather than exploiting
    some Lean kernel bug or something. The fact that two of those checkers come with
    formally verified proofs that they can&#x27;t certify non-proofs unless the usual
    axioms of set theory are inconsistent means that &quot;correct according to the
    logic of Lean&quot; in this case also means &quot;correct according to the axioms
    mathematicians use for everything&quot;[1]. The fact that multiple different people
    have checked it and found it OK means that the verifications almost certainly
    aren&#x27;t just made up in response to bribes or threats or something from Anthropic.<p>[1]
    Well, when they&#x27;re doing the sort of foundational stuff for which anyone
    cares exactly what axioms they&#x27;re using.<p>So if by &quot;massive pile of
    bullshit&quot; you mean &quot;something that doesn&#x27;t really guarantee that
    GRH is true&quot; then I&#x27;m afraid you&#x27;re going to have to live with
    disappointment: it does really seem to have been proved.<p>17 million lines of
    Lean definitely aren&#x27;t the greatest means of conveying understanding, and
    no human mathematician is going to have a good time trying to read through them
    all and figure out what the hell is going on. However, the robots are not only
    good at <i>generating</i> Lean these days, they&#x27;re also pretty good at <i>interpreting</i>
    it, and human mathematicians with a lot of robot help have already made a lot
    of progress in working out the shape of how the proof seems to work.<p>It&#x27;s
    always possible that that will all turn out to be utter confabulation or something,
    but I&#x27;d bet pretty heavily against it.'
