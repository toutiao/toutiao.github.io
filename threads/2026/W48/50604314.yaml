  author: solomonb
  text: Sort of.. intuitionistic logic is weird. In it, a statement is true when you
    have a proof of it and a proof is a construction.<p>A proof of X is some actual
    construction and a proof of ¬(X) is a function that accepts a proof of X and turns
    it into a contradiction.<p>A proof of ¬¬(X) is thus a function that accepts a
    proof of ¬(X) and turns it into a contradiction. It doesn&#x27;t actually give
    you a proof of X.<p>In the case of P=NP, a proof would be an actual SAT algorithm
    plus its polynomial bound (and some kind of evidence the SAT algorithm meets the
    bound).<p>What you actually hold when you&#x27;ve proved ¬¬(P=NP) is a function
    whose input is a refutation of P=NP and whose output is ⊥. You can&#x27;t actually
    get a proof of P=NP from that.<p>What you have shown is that any attempt to refute
    P=NP is doomed but you haven&#x27;t actually proven it to be true. I know its
    weird...
