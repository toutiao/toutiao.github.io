  text: Actually you do get an algorithm! Given an instance of 3-SAT, For N from 1
    to infinity, for each Turing Machine with at most N states, run that machine on
    the 3-SAT instance for N steps and check if it outputs a correct solution. If
    any machine exists that solves 3-SAT problems in polynomial time, this algorithm
    is also polynomial, though with absurdly large constants.
