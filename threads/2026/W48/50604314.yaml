  author: cowlevel
  text: "&gt; P being in NP would be shocking enough on its own terms<p>P is definitely,
    trivially, in NP. You may have confused them for each other.<p>If any NP-complete
    problem is in P, then so is all of NP, because they can all be reduced to it.
    Out of the non-NP-complete problems, many of them are in NP but not in P, because
    it would immediately follow that P != NP and I would&#x27;ve heard about that.
    If we proved that one <i>was</i> in P, that would just mean that problem was in
    P.<p>So the only interesting proofs are either that some NP-complete problem is
    in P (proves P==NP) or that some NP problem, whether NP-complete or not, isn&#x27;t
    in P (proves P!=NP).<p>And yes, everyone sane expects P!=NP, the alternative doesn&#x27;t
    make much sense. It just hasn&#x27;t been proven."
