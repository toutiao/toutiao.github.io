  author: eru
  text: 'Proven optimal: we have proven that nothing faster exists.<p>Not proven their
    runtimes: we don&#x27;t know how many steps they actually take to run.  Just that
    nothing faster exists.  It&#x27;s a curious situation.<p>A more everyday example:
    suppose you catch a glimpse of a room full of toddlers and a grandpa entertaining
    them.  You can be pretty sure the grandpa is the oldest person in the room, even
    if you don&#x27;t know how old he is.<p>Another concrete example for algorithms:
    We know that Chazelle&#x27;s deterministic algorithm for finding minimum spanning
    trees is optimal (amongst all deterministic algorithms), but we don&#x27;t know
    yet whether it runs in linear time or in something ever so slightly slower.'
  score: 0
  posted_at: '2026-11-24T01:57:18Z'
