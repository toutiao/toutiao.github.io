  author: eru
  text: 'I think you are right.  Sorry, I&#x27;m always mixing up NP-hard and NP-complete.<p>If
    I looked up the definitions right:  NP-hard problems can be outside of NP, they
    just have to be able to help you solve all NP problems.  NP-complete problems
    need to be in NP.<p>So the halting problem is NP-hard, but harder than NP-complete.<p>As
    an additional wrinkle: all of these definitions are for decision problems, ie
    where the answer is just a single bit.  But it&#x27;s usually relatively easy
    to adapt everything so that you can extract more than a single bit. (Eg by running
    lots of slightly altered problems and piecing the answer together from that.)<p>To
    give a silly example: we say that sorting is in P, but the output of sorting a
    list is a whole permutation, not just a single bit.'
