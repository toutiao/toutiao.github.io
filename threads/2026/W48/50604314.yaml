  author: dlubarov
  text: If we knew P = NP, in principle we could write a trivial &quot;universal witness
    search&quot; program that enumerates all programs, simulating each one a bit at
    a time.<p>For a fixed problem, the winning program string is at a constant position
    in the enumeration, so the difficulty of reaching it is technically a constant
    factor.<p>It wouldn&#x27;t give us &quot;no&quot; answers in polynomial time,
    but if we already know that e.g. Satoshi&#x27;s wallet has a private key, then
    we&#x27;d be guaranteed to find it in polynomial time.
