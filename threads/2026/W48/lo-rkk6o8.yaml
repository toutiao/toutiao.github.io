    Wondered why this was as fast as it is, but turns out unkernel itself is also an aarch64 to WASM JIT compiler.
    So userspace does get a performance hit from being JIT’d twice, and running Java or so below this will be extremely slow, but userspace is not completely emulated as first claimed in the article.
