  author: kube-system
  text: The Lanham Act and common-law &quot;naked licensing doctrine&quot; requires
    companies to defend their trademark in order to keep it.   And if they license
    it out, they are required to quality control how it is used, or they will lose
    their trademark.<p>If you simply let other people use your trademark, either implicitly
    or explicitly, you lose it.<p>They could license it out, but they&#x27;d have
    to do it in an official capacity and actively police the content on the site.  It
    would honestly be more simple to just hire the guy.
