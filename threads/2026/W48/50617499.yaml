  author: nostrademons
  text: 'Note that when I say &quot;report to the court system&quot;, I mean &quot;the
    court system itself is a higher authority than either the individual lawyers or
    the company&quot;, not &quot;the court system will influence what the individual
    lawyer says and their word goes&quot;.  You hire lawyers because <i>the whole
    point of their legal training is to be able to predict how the courts will rule,
    before an action actually goes to court</i>.  And conversely, the legal system
    is expressly designed to be predictable: that&#x27;s why you have legal education,
    and <i>stare decisis</i>, and the system of court precedents, and a hermetically-sealed
    court environment where neither lawyers&#x2F;plaintiffs&#x2F;defendants&#x2F;judge&#x2F;jury
    are supposed to let any influences from outside the courtroom in, and court transcripts,
    and an appeal system where higher courts can look at the court transcript and
    determine that the case was decided correctly.  An ex-lawyer wouldn&#x27;t be
    any use here; the threat model is that the corporation is <i>doing something that
    exposes them to legal risk</i>, which they don&#x27;t want, and so the lawyer
    goes and does something about it.'
