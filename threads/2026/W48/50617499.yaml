  author: qdotme
  text: No. Lawyers are prohibited from lying on your behalf, they are also prohibited
    from advising you to break the law, if the breach is cost effective and might
    even be overturned at a high enough instance or ultimately brought to the voters
    level and legislated out.<p>As a result, they are overprotective. From my experience
    they are often more concerned about their status as an officer of the court (not
    being disbarred, etc.) rather than giving you the unconflicted advice you want
    and pay for.<p>Court is a branch of the government, in a form of extended tentacles
    of state&#x2F;federal appointed supreme courts. Predictability is only good if
    you’re trying to do old things.<p>Do new things and being able to actually advise
    on how to be effectively unpredictable (which at least in UK, but not in the US,
    sadly) was the Kalanick gamble of breaking the law on taxi services and arranging
    that the voters will vote the plaintiff (London’s mayor) out in time.
