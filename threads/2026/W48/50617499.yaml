  author: JdeBP
  text: ARM is a U.K. headquartered company and there is no such thing as &#x27;fair
    use&#x27; in U.K. copyright law.  The parallel concept is &#x27;fair dealing&#x27;
    and it is <i>not the same</i>.  The U.S.A.&#x27;s law is not global, something
    that trips up amateur commentators on the WWW again and again.<p>Here are the
    black letter statutory provisions that lay out several ways in which a non-librarian
    copying written doco for multiple people who not only might but likely will put
    it to a commercial purpose, is not fair dealing:<p>* <a href="https:&#x2F;&#x2F;legislation.gov.uk&#x2F;ukpga&#x2F;1988&#x2F;48&#x2F;section&#x2F;29"
    rel="nofollow">https:&#x2F;&#x2F;legislation.gov.uk&#x2F;ukpga&#x2F;1988&#x2F;48&#x2F;section&#x2F;29</a>
