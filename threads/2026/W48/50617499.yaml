  author: nostrademons
  text: This is tricky.  In most companies lawyers report up through the GC who then
    reports directly to the CEO.  The reason for this is that <i>lawyers ultimately
    report to the court system and the state itself</i>.  If the court says one thing
    and the engineers say another thing, well at least in the eyes of the law the
    court is going to win, and the company wants to make sure that the law can&#x27;t
    dismantle the company.<p>I think what you really want is for engineers to have
    a bigger hand in <i>writing the laws</i>, which I would wholeheartedly agree with,
    but there are all sorts of problems with politics, psychology, and our system
    of governance that make this challenging.
