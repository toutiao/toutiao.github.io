  author: TheRealPomax
  text: 'Redistributing someone else&#x27;s documentation  that is already available
    (no matter how many popups and bloat that version tacks on) means this is not
    fair use. In fact, without a license agreement to rehost or make information within
    it discoverable, it&#x27;s simply a violation of both trademark and copyright
    law.<p>And trademarks require you to either license or sue: if you do neither,
    you are signalling that you don&#x27;t care about your trademark and someone else
    can go &quot;well-known thing X was allowed to use it for Y years, so I should
    be able to use it without repercussions, too&quot; and the trademark office <i>will</i>
    accept that argument.<p>Of course, the decent move on ARM&#x27;s part would have
    been to recognize the value of this website and first try to come up with a license
    arrangement to make this website legal, but corporate lawyers don&#x27;t get paid
    to take the soft approach first. You get to inquire about a license agreement
    in response, instead.'
