    if you do not reckon this is sound for some reason, at least as a minimum viable pushback for &quot;dose makes the poison&quot; in the ctx of alcohol, do let me know, because that will almost certainly be a lot more insightful than a general remark about how life is a balancing act. note that pointing out that this model is also a simplification would not be insightful, since i was specifically looking for a minimum viable counterpoint. the temporal component of exposure also clearly matters, for example, but that&#x27;d extend &quot;dose makes the poison&quot; rather than falsify it.<p>my understanding is that alcohol was found to be option #2. i&#x27;d definitely label this poison irrespective of dose, and i do consider that to be a coherent enough classification, and one that does run against &quot;dose makes the poison&quot;. it is also a lot tighter of an argument than involving something like how full a person&#x27;s stomach is with food before consuming alcohol, what their age is, or other incidental things.<p>not that i&#x27;d be avoiding alcoholic drinks out of a health concern mind you, i just find them generally abhorrent, so let&#x27;s maybe skip that idea too
