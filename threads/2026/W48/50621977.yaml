  author: volkl48
  text: 'Adult humans are naturally wary of strangers and slow to form bonds. Children
    are not. Lots of solid evolutionary reasons for both. Alcohol punts your brain
    back into a more open state that&#x27;s easier to form new social ties in.<p>Not
    much else does that doesn&#x27;t require a lot of time&#x2F;effort&#x2F;commitment
    to get you into that state, and things that do that are largely not things that
    you can casually fit a bit of into your evening after work and still show up tomorrow
    sober and fine.<p>------<p>You as an individual can absolutely find alternative
    ways to build a social life with enough effort.<p>But I think at this point it&#x27;s
    pretty obvious that most people <i>aren&#x27;t</i> putting in a ton of extra effort
    to replace that social lubricant + venue for socialization.<p>We have a lot of
    evidence at this point that people don&#x27;t appear to be replacing that lost
    socialization from alcohol. They&#x27;re just socializing less, they have fewer
    friends, fewer social connections, and fewer ties to their community.<p>It&#x27;s
