  author: Bluebird803
  text: Someone else has already responded with a better answer for the sun-specific
    case, but I thought it would be fun to elaborate a bit.<p>Braking and making your
    orbit smaller is exactly the thing that makes a spacecraft go faster (counter-intuitively),
    by the result of &quot;falling into&quot; your orbiting body. This leads to all
    sorts of counter-intuitive dynamics with spacecraft maneuvering. Such as, how
    do you move towards a space-station to dock with it? You burn your thusters away
    from it. What happens in low-earth orbit (with some atmosphere) and you deploy
    a large parachute? You speed up.<p>Orbital dynamics are weird.
