  author: rtkwe
  text: When you make your burn to leave Earth orbit and move towards Mercury you
    start moving in closer to the sun picking up speed. You&#x27;re literally falling
    towards the Sun to move closer to Mercury, the craft picks up speed the whole
    way there. Spacecraft don&#x27;t continuously burn slowing themselves down, they
    make distinct burns at particular times.<p>Any non circular orbit is going to
    spend half the time speeding up moving towards the body it&#x27;s orbiting and
    the other half slowing down again as it moves away from the closest approach to
    the main body it&#x27;s orbiting.
