  text: I would just like to add that even if you do continuously burn to slow down
    the whole way (such as with an ion engine), you still speed up overall.<p>A more
    realistic version of the same scenario (albeit in reverse) is a satellite raising
    its orbit with an ion engine. The satellite &quot;burns&quot; its engine continuously
