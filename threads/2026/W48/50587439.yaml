  author: mandevil
  text: Back in the 1990s I talked with a NASA engineer who worked on docking training
    for the STS and Mir. He said that at 100m separation they switched from orbital
    mechanics to straightforward pilot techniques (point the nose where you wanted
    to go).<p>Apparently, some of the original astronauts doubted that this was necessary,
    and so one of the mission goals for Gemini 4 was to have the Gemini 4 capsule
    under Mission Commander Jim McDivitt attempt to rendezvous with its Titan upper
    stage. He burned almost half of his maneuvering fuel and ended up farther away
    than when he started, because he did it the pilot way while starting too far away.<p>Basically,
    Buzz Aldrin wasn&#x27;t a Test Pilot- instead of going to Edwards Air Force Base
    for Test Pilot School (he was already an Air Force fight pilot) he had gone to
    MIT to get a Ph.D in physics, and he&#x27;d written his dissertation methods of
    calculating orbital rendezvous. And when he joined the Astronaut program- dominated
    by test pilots- he had earned the unflattering nickname &quot;Dr. Rendezvous&quot;
    because of his habit of explaining to anyone who didn&#x27;t run away fast enough
    the intricacies of orbital rendezvous. He could tell that most of the test pilots
    didn&#x27;t believe him that it was so difficult, so he pushed for Jim McDivitt
    to try it just to prove to them how hard it actually was, so they&#x27;d listen
    to him better.
