  text: Solar radiation pressure is also a thing. It accelerates the orbit in some
    places, slows it down in others. Even if Mercury was perfectly round, any spacecraft
    will be constantly burning fuel to maintain a stable orbit.<p>&gt;&gt; The direct
    solar radiation pressure represents the strongest non-gravitational perturbation
    on the MPO in the very complex radiation environment of Mercury. The order-of-magnitude
    of this acceleration is quite high, about 10E−6 m&#x2F;s2<p><a href="https:&#x2F;&#x2F;link.springer.com&#x2F;article&#x2F;10.1007&#x2F;s10569-006-9034-9"
