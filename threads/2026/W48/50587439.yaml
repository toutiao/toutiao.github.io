  author: teraflop
  text: "&gt; The craft does have 3 star-tracker cameras to know its orientation and
    then you can calculate from there how much energy the solar-electric thrusters
    put out.<p>The problem with this is that if you&#x27;re trying to calculate position,
    but all you can measure is acceleration, then your errors accumulate proportional
    to time squared. This is effectively just dead reckoning, and it doesn&#x27;t
    really give you any kind of long-term accuracy.<p>If you take out Earth-based
    communications (which can give very precise Doppler measurements), probably the
    most accurate option for absolute position-finding would be using the cameras
    to track surface features of Mercury. This is how Apollo did it, but manually
    -- the AGC knew the coordinates of various landmarks on the Earth and the Moon,
    and the astronauts could take sightings of whichever ones were available.<p>Failing
    that, I suppose the next best option would be to visually track the positions
    of Venus or the Earth, but given the precision of BepiColombo&#x27;s star trackers
    (on the order of 1 milliarcsecond) this would only get you within a few hundred
    km, even under ideal conditions.<p>There has been some experimental work on using
    X-ray pulsars to let spacecraft navigate completely autonomously. Some millisecond
    pulsars are about as stable as atomic clocks, which means you can use the timing
    differences from multiple pulsars to calculate your position in roughly the same
    way as GPS or LORAN, without needing any artificial navigation satellites."
