  author: mandevil
  text: The Apollo Guidance Computer could compute its own orbits, with some help
    from the astronauts but nothing from the ground- one of the design criteria was
    to be able to return even if all the radio links failed (could not land on the
    moon in that case, but could safely return to earth).<p>I don&#x27;t know for
    sure about Bepicolumbo but I suspect that it could, given the improvement in computers
    since then. The craft does have 3 star-tracker cameras to know its orientation
    and then you can calculate from there how much energy the solar-electric thrusters
    put out. Then its just some computation which I&#x27;d think it could do pretty
    accurately, but I don&#x27;t know how much the solar-electric engine failures
    (which delayed Mercury orbital insertion from December 2025 to November 2026)
    are understood and accounted for by the spacecraft itself.<p>I&#x27;m 99% certain
    that Doppler shift and&#x2F;or earth loss of signal times are used to improve
    the accuracy of the orbital determination to get that orbital error bars as small
    as possible. Because observing the perturbations on satellite orbits are our best
    tool for mapping mascons, so knowing the orbit as precisely has a large scientific
    benefit.
