  author: jmyeet
  text: 'I love the apparent illogical nature of orbital mechanics.<p>One of my favorites
    is that it&#x27;s easier to reach the Sun from Earth by going via Pluto [1], in
    terms of delta-V. Obviously it takes awhile. But people like to say &quot;why
    don&#x27;t we just drop waste into the Sun?&quot; but doing that is incredibly
    hard. You slow down a little from an Earth orbit and you don&#x27;t fall into
    the Sun. You just get a new orbit.<p>For anyone wondering, the issue with getting
    to the inner Solar System is we don&#x27;t have the gas giants to slingshot around
    like we do for hte outer solar System. The gas giants don&#x27;t magically create
    energy. Momentum is preserved in the gas giant frame of reference but you pick
    up speed in other frames of reference.<p>BepiColumbo&#x27;s orbit is kind of an
    amazing orbit because they had to brake around Mercury a few times to bleed speed.
    But the mass is so low that it took multiply flybys.<p>[1]: <a href="https:&#x2F;&#x2F;space.stackexchange.com&#x2F;questions&#x2F;39059&#x2F;does-it-require-less-energy-to-reach-the-sun-from-plutos-orbit-than-from-earth"
