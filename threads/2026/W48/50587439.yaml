  text: 'But then how to validate any model of gravity?<p>I just looked this up because
    we used MESSENGER data to validate our model of gravity; just like they used the
    43 arcsecond perihelion of mercury to validate General Relativity.<p>&quot;Use
    of MESSENGER radioscience data to improve planetary ephemeris and to test general
    relativity&quot; (2013) [1306.5569]  <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;1306.5569"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;1306.5569</a><p>&quot;Precession
    of Mercury’s Perihelion from Ranging to the MESSENGER Spacecraft&quot; (2017)  <a
    href="https:&#x2F;&#x2F;iopscience.iop.org&#x2F;article&#x2F;10.3847&#x2F;1538-3881&#x2F;aa5be2"
    rel="nofollow">https:&#x2F;&#x2F;iopscience.iop.org&#x2F;article&#x2F;10.3847&#x2F;1538-3881&#x2F;aa5be2</a><p>SPICE
    (observation geometry system) <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;SPICE_(observation_geometry_system)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;SPICE_(observation_geometry_sy...</a>
    doesn&#x27;t describe the physics model implemented by e.g. the SPK kernel.<p>The
    PDS data might be useful for model validation.<p>NASA JPL NAIF: Navigation and
    Ancillary Information Facility hosts SPICE toolkit:  <a href="https:&#x2F;&#x2F;naif.jpl.nasa.gov&#x2F;naif&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;naif.jpl.nasa.gov&#x2F;naif&#x2F;</a><p>TIL about
    WebGeocalc for professionals.<p>But how does Kerbal Space Program model gravity?
    From Gemini succinctly:<p>&gt; [KSP models gravity with] <i>Newtonian dynamics
    and patched conic approximations, simulating spacecraft trajectories around one
    celestial body at a time inside discrete Spheres of Influence (SOI) rather than
    solving multi-body gravitational interactions simultaneously</i><p>SOI: &quot;Sphere
    of influence&quot; - Kerbal Space Program Wiki <a href="https:&#x2F;&#x2F;wiki.kerbalspaceprogram.com&#x2F;wiki&#x2F;Sphere_of_influence"
    rel="nofollow">https:&#x2F;&#x2F;wiki.kerbalspaceprogram.com&#x2F;wiki&#x2F;Sphere_of_influence</a><p>Sphere
    of influence (astrodynamics)  <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Sphere_of_influence_(astrodynamics)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Sphere_of_influence_(astrodyna...</a><p>Patched
    conic approximation: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Patched_conic_approximation"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Patched_conic_approximation</a><p>IDK
    if that&#x27;s faster or slower than our models because I don&#x27;t have an implementation
    of same in Rust&#x2F;WASM to compare.<p>&quot;Grassmannian Gravity from QED &amp;
    Gauge Scattering Amplitudes: Complex \(Gr_{\mathbb{C}}(2,4)\) Orbital Precession,
    Mercury’s Perihelion, \(N\)-Body Dynamics, and Dilatant Dark Fluid (DDF) Unification
    in Lean 4&quot; &gt; &quot;4. -Body Sink Superposition on ⁡ℂ⁡(2,+2) &amp; Conservative
    Action vs. Stokes-Drag Critique&quot;  (2026-10) <a href="https:&#x2F;&#x2F;westurner.github.io&#x2F;sustainablefactory&#x2F;grassmannian-gravity-from-qed-scattering-paper.html#n-body-sink-superposition-on-gr-mathbb-c-2-n-2-conservative-action-vs-stokes-drag-critique"
    rel="nofollow">https:&#x2F;&#x2F;westurner.github.io&#x2F;sustainablefactory&#x2F;grassmannian-...</a><p>But
    then last week we corrected our gravity model to also cover celestial holography
    per Toupin (2025),<p>&quot;Celestial Holography, the Canonical Dictionary (\(\Delta
    = 2s\)), Plancherel–Unruh Graviton Loop Weights (\(M_1 = 1&#x2F;8, M_2 = 1&#x2F;90\)),
    and Integrated Turner Models 15a &amp; 15b for Gravitons and Riemann Spectral
    Bridges in Lean 4, Rust&#x2F;PyO3, and SymPy&quot; &gt; &quot;4.1 How Gravitons
    Are Modeled Across All 15 Frameworks in src&#x2F;signals&quot; (2026-11)  <a href="https:&#x2F;&#x2F;westurner.github.io&#x2F;sustainablefactory&#x2F;grassmannian-celestial-holography-graviton-turner-riemann-paper.html#how-gravitons-are-modeled-across-all-15-frameworks-in-src-signals"
    rel="nofollow">https:&#x2F;&#x2F;westurner.github.io&#x2F;sustainablefactory&#x2F;grassmannian-...</a><p>I&#x27;m
    interested to see which model of N-body gravitational dynamics has the best time-cost
    performance as implemented. Instead, we&#x27;ve pressed on to N-Soliton dynamics
