  author: Sharlin
  text: KSP&#x27;s model of orbital mechanics is <i>much</i> simpler than what they
    use in the real world.<p>And in the real world, they use a simple Newtonian finite
    element model that just ignores any less-than-planetary bodies. Any relativistic
    corrections, never mind corrections from asteroids and so on are infinitesimal
    relative to the precision needed to move stuff around the Solar System. This is
    engineering, not science, so you just budget for a few kg of propellant for minor
    trajectory corrections along the way and call it a day.
