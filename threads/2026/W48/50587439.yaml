  author: Sharlin
  text: Waiting a long time does nothing. Barely escaping Earth’s orbit (do you mean
    orbit around Earth or Earth’s orbit around the Sun?) just puts you to an orbit
    similar to Earth’s. &quot;In the right direction&quot; probably isn’t at all what
    you think.<p>You can get to Mercury in months using a standard half-ellipse Hohmann
    transfer if you have the mass budget for an absolute shitload of fuel to burn
    once there to get rid of all the extra speed you gain while en route. But that’s
    not realistic, so both MESSENGER and BepiColombo spent years in complex trajectories
    that started with a few Earth and Venus gravitational assists to drop their perihelion
    to Mercury orbit, then many flybys of Mercury to incrementally slow down enough
    to finally be able to enter orbit around the planet. It’s a bit strange that the
    Guardian article didn’t mention that, but you can find illustrations in the usual
    places.<p>But anyone with a computer and a suitable program can plan such a trajectory,
    it’s not like some special secret knowledge is needed.
