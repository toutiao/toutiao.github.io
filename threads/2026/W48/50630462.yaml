  author: the_lucifer
  text: '&gt; Linux may put up a fight by just having far more devs working on software
    for it, which increases the odds of someone getting it just right.<p>Ideally but
    realistically no, because these pieces of software end up in a &quot;too many
    cooks&quot; situation. Good UX requires a heavy hand from the top and a singular
    vision. Which... is hard, <i>very hard</i>. There&#x27;s very few exceptions like
    Blender for one where they embody this and they need laser focus to achieve this.<p>Add
    the fragmented UX paradigms and WM fuckery on top, you end up with a hodge-podge
    of software that looks and feels wildly different. (Like how some applications
    use a weirdly low resolution cursor or a different cursor on Linux because different
    windowing systems, UI Toolkits use different cursors like wtf? [1]).<p>Or for
    any UX bugs fingers get pointed at the WM instead: &quot;Yeah no wonder you saw
    X. Your WM is shit, everyone uses Y these days&quot;. Bad UX and OSS go hand in
    hand on Linux primarily because of this. It&#x27;s developers adding features
    that developers want without the Marie Kondo-esque &quot;does this feature really
    bring joy&#x2F;utility&quot; or if it should be prioritized or not paired with
    a Linux design tooling failure that makes it an uphill task to get working and
    looking nice.<p>(And I don&#x27;t even want to speak about Windows here.)<p>[1]:
    <a href="https:&#x2F;&#x2F;wiki.archlinux.org&#x2F;title&#x2F;Cursor_themes" rel="nofollow">https:&#x2F;&#x2F;wiki.archlinux.org&#x2F;title&#x2F;Cursor_themes</a>'
