  author: cfiggers
  text: 0) I&#x27;m going to presume you are objecting to the recurring subscription
    and not to the app being paid in the first place. Thinking that the app is obliged
    to be free for one reason or other is just a non-starter of a position, so I&#x27;m
    not going to waste time addressing it.<p>1) The risk of Apple breaking stuff wouldn&#x27;t
    be mitigated by a one-time purchase. If they break something, they break something.
    Payment model changes nothing about that.<p>2) Doesn&#x27;t risk of breaking change
    from Apple&#x27;s side make a subscription model make <i>more</i> sense, not less?
    If a feature you want is no longer possible, you can just stop paying the subscription.
    If it was a one-time purchase, you&#x27;d either be out your money or have to
    receive a refund—and how exactly do we decide how much of the value of your original
    purchase was delivered between when you bought it and when that feature disappeared?
    Should the dev go hungry <i>retroactively</i> because a feature that you valued
    lasted some amount of time but not forever?<p>A recurring (and therefore cancel-able)
    Subscription is the lower-risk and more equitable model for such a scenario on
    both sides, IMHO.
