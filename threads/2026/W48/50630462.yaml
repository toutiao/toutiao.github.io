    were both created back in 2020 to restore features from [DragThing](https://dragthing.com/),
    the venerable Mac app that was retired in 2019. The one tiny feature that [Front
    and Center](/front-and-center/) provided was literally a single checkbox within
    DragThing’s preferences. [SwitchGlass](/switchglass/) went a bit farther, recreating
    one specific kind of floating palette from DragThing ([and classic Mac OS](https://en.wikipedia.org/wiki/Mac_OS_8#Mac_OS_8.5:~:text=The%20application%20palette%20made%20its%20debut%20with%208.5)).\n\nAfter
    [24 years](https://dragthing.com) of development, DragThing had a ton of features.
    People often joked that I was destined to slowly reimplement all of DragThing’s
    functionality in a series of small apps. Put another way, they were saying I was
    doomed to make strange little Mac apps with extremely limited appeal (and sales).\n\nPerhaps
    to prove them wrong, the next app I created was [Hyperspace](/hyperspace/), which
    provided a way to reclaim disk space _[without removing any files](/hyperspace/#without-removing)_.
    Hyperspace was still a nerdy app, but at least it had _somewhat_ broader appeal
    than my earlier efforts. Who doesn’t want to save disk space? But more importantly,
    it was totally unrelated to DragThing. I had broken the curse!\n\nAlas, there
    was one more (small) thing from DragThing that I missed. I used to have a DragThing
    palette in the corner of my screen containing some commonly used folders. In earlier
    versions of macOS, it was possible to pin the Dock to a screen corner, but that
    wasn’t really what I wanted either. I just wanted a small, separate palette of
    folders in the corner.\n\nThis is not a hard problem to solve. Plenty of Mac apps
    can provide something close to what I want…but not _exactly_ what I want, [in
    the specific way that I want it](/2013/02/24/movies/high-maintenance.m4v). For
    many years, I got by with some folders in the corner of my desktop. But the problem
    nagged at me.\n\nA few years ago, I went so far as to implement my desired feature
    in [SwitchGlass](/switchglass/), adding the ability to create a small, extra palette
    full of folders in addition to the app switcher. But it felt incongruous with
    the rest of the app, so I never shipped it. And I didn’t want to maintain my own
    private fork of SwitchGlass, so I abandoned that branch of the code.\n\n## How
    It Started\n\nToday, AI coding agents are helping to produce a [bounty](https://beard.fm/app/)
    of [new](https://www.theincomparable.com/doubleender/), [niche](https://lexontech.org/my-own-app-for-centering-notification-center-banners-on-the-mac)
    Mac apps, many made by people who have little or no coding experience. Even for
    experienced software developers, [vibe coding](https://en.wikipedia.org/wiki/Vibe_coding)
    has made it possible to create apps that were previously “not worth building”
    due to an unfavorable ratio of effort to payoff.\n\nIt’s in this context that
    I revisited my “little palette of folders” idea. Surely I could vibe-code a simple
    app just for me in a day or two, right?\n\nThat was three and a half months ago.\n\n##
    How It’s Going\n\nSo what happened? The well-known [programmer’s credo](https://www.reddit.com/r/ProgrammerHumor/comments/etboii/the_programmers_credo/)
    comes to mind: “We do these things not because they are easy, but because we thought
    they would be easy.” Indeed.\n\nI began the project by feeding a coding agent
    the source code to my app, [SwitchGlass](/switchglass/), as a starting point.
    I wrote SwitchGlass six years ago using a substantially more primitive version
    of SwiftUI. (For the developers out there, it predates and , and it supports Macs
    all the way back to macOS 12 Monterey from 2021.) I asked a coding agent to modernize
    the code and generalize it to support an arbitrary number of palettes instead
    of just one app switcher palette per display.\n\nIt worked, and quickly! But it
    was pretty shoddy. Many optimizations and niceties from SwitchGlass had been lost.
    So I dove in to fix them…and maybe add one or two more features, I guess…\n\nNow,
    after months of work, I’ve created a bit of a monster. But in the process, I’ve
    fulfilled a long-held dream of mine—a dream I had set aside years ago because
    I thought it was impossible. _I’ve replaced the Dock._\n\n## Only Apple…\n\nIf
    you’ve read any of [my Mac OS X reviews](/2015/04/15/os-x-reviewed), you know
    that I’ve always been dissatisfied with the Dock. Over the past couple of decades,
    I’ve gotten used to it, but I still bump up against its limitations and undesirable
    behaviors every day. (Undesirable to me, anyway.)\n\nTo pick just one example,
    I’ve _always_ wanted clicking on a folder in the Dock to open that folder in the
    Finder. The Dock did work this way for several years, but in 2009’s [Mac OS X
    10.6 Snow Leopard](https://arstechnica.com/gadgets/2009/08/mac-os-x-10-6/) (…I
    think?), Apple switched to requiring a Command-Option-click to open a folder in
    the Finder. Since then, I’ve been Command-Option-clicking folders in the Dock
    many, many times per day. It’s a small thing, but it adds up: seventeen years
    of Command-Option clicking!\n\nBut what could I do? I was forced to continue to
    use the Dock because there are so many things that “only the Dock can do” in macOS.
    I was reminded of this harsh reality when I created [SwitchGlass](/switchglass/).
    Why doesn’t SwitchGlass show notification badges? Why does the Calendar icon show
    today’s date in the Dock but not in SwitchGlass? Why don’t app icons in SwitchGlass
    bounce when the app needs attention? Why can’t I quit an app from SwitchGlass?\n\nThough
    [I did find a workaround for that last one](/switchglass/#quit), the answer to
    most of these questions is that third-party apps simply can’t do all the things
    the Dock can do. The Dock is part of the operating system, and it enjoys special
    privileges and deep integration that no third-party app can match.\n\nThis remains
    true today, especially for [sandboxed](https://developer.apple.com/documentation/security/app-sandbox)
    apps sold through the Mac App Store like SwitchGlass (and all my other Mac apps).
    But what about apps that _aren’t_ in the Mac App Store? What about _unsandboxed_
    apps? How close can they come to doing all the things the Dock does, especially
    if they use [private APIs](/jetty-pro/#private-apis) that are forbidden in the
    Mac App Store?\n\nI aimed to find out. I hatched a plan, which I announced on
    [episode 706 of Accidental Tech Podcast](https://atp.fm/706) on August 26, 2026.
    I would create _two_ apps: one [called Jetty](/jetty-pro/#why-jetty) that would
    be sold through the Mac App Store, and a more powerful, unsandboxed app called
    Jetty _Pro_ that would be distributed directly to customers, outside the Mac App
    Store.\n\nBut as I worked on the two apps, it became clear that “plain Jetty”
    was not that great. It had all the same limitations as SwitchGlass when it came
    to duplicating the features of the Dock. After less than two weeks of work, I
    abandoned plain Jetty and [concentrated entirely on Jetty _Pro_](/jetty-pro/#why-pro).\n\nAfter
    three and a half months of work, there are still things that only the Dock can
    do, but [the list is not very long](/jetty-pro/#dock-can). I don’t expect most
    users to fully replace the Dock with Jetty Pro, but I’m happily doing so. If only
    [my 2001 self](https://arstechnica.com/gadgets/2001/04/macos-x/) could see me
    now!\n\n## Jetty Pro\n\nNow, finally, I’d like to introduce Jetty Pro: an app
    that creates customizable Dock-like floating palettes around the edges of your
    Mac’s displays. These palettes can contain any combination of files, folders,
    volumes, apps, "
