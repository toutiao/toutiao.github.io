  author: probably_wrong
  text: The other comments already focused on the cognitive aspect, so I&#x27;d like
    to focus on the economics itself.<p>If $15 (per your example) is a fair price
    for the app, then why is it priced $1&#x2F;year instead? There may be many reasons
    for this decision but, in practice, it&#x27;s because the app creators think they
    can get more than $15 from me this way. Even if they said &quot;we&#x27;ll get
    $15 on average&quot; that means they are counting on some users to pay $20, $30,
    or even $70.<p>So far companies have done so by counting on me to forget (my gym),
    rising prices (Netflix), introducing an ad tier (Netflix again), selling my data
    (*waves hand in a circle*), removing functionality (my VPN), or all of the above.
    I therefore think the onus is on them to explain why it&#x27;s a subscription
    and not on me to say &quot;well, if it&#x27;s <i>only</i> $1...&quot;
