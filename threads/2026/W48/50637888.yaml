  author: strenholme
  text: "Also, it’s possible to force global variables to be explicitly declared.<p><pre><code>
    \ function declare(name)\n    rawset(_G,name,false)\n  end\n  function exists(name)\n
    \   if rawget(_G,name) ~= nil then \n      return true \n    else return false
    end\n  end\n  setmetatable(_G, {\n    __newindex = function(self,x) error(&quot;Undeclared
    global &quot; .. x) end,\n    __index = function(self,x) error(&quot;Undeclared
    global &quot; .. x) end\n  })\n</code></pre>\nAnd now<p><pre><code>  declare(&quot;foo&quot;)\n
    \ foo = 1\n  -- Create name if it hasn’t \n  -- been declared yet\n  if not exists(&quot;name&quot;)
    then \n    declare(&quot;name&quot;)\n    name = 1\n  end\n</code></pre>\nMore
    discussion: <a href=\"https:&#x2F;&#x2F;lua.org&#x2F;pil&#x2F;14.2.html\" rel=\"nofollow\">https:&#x2F;&#x2F;lua.org&#x2F;pil&#x2F;14.2.html</a>"
