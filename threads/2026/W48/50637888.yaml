  author: Mikhail_Edoshin
  text: I&#x27;d say a tool-command format is a distinct and very good syntax for
    arbitrary data representation. The input consists of lines; each line starts with
    a command name, followed by optional arguments. There is some continuation syntax
    to wrap long arguments. The order of lines matters because each line is executed
    with its argument by some handler; the handler may modify the execution context.
    Aside from the command name there is no syntax other than whitespace. And since
    it quietly accumulates the context it gets very compact too.
