  author: disperso
  text: LuaJIT borrowed from 5.2 and 5.3 (PUC-Rio&#x27;s Lua) what it could without
    breaking compatibility, as I understand it. LuaJIT 3.0 adds some feature of its
    own.<p>All the Lua 5.x versions that I have seen have small compatibility issues,
    and that&#x27;s why many projects stick with what it&#x27;s compatible with 5.1
    only.<p>C++ doesn&#x27;t have any &quot;native json support&quot; either, and
    that&#x27;s fine. I don&#x27;t think JSON is that critical. You can use a library
    for the kind of serialization that you want. Neovim uses JSON and Lua extensively,
    and it just uses a C library inside.<p>It&#x27;s true that `{}` doubles down as
    an empty array or an empty map. It is not a problem that often, IME. You also
    can&#x27;t signal that a certain key in a map is `nil`, but you can use a sentinel
    for it. You can do the same to disambiguate between these two.<p>Different features
    hit differently to different people. I agree that global by default seems so wrong,
    but I just go used to it, and I don&#x27;t care anymore. To me, the main deal
    is not that Lua doesn&#x27;t have this features by default, is more that, when
    I want them, there is no generally agreed library&#x2F;framework that can plug
    all the features in a unified, coherent way. Penlight should be that, but I don&#x27;t
    like it that much.<p>This is something that personally hits me the most, because
    I&#x27;m used to Qt. With Qt, I have tons and tons of functionality and a well
    established community and practices.
