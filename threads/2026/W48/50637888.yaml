  author: strenholme
  text: |-
    1-based indexing: There’s nothing stopping you from making a table with a 0 key, e.g.<p><pre><code>  foo = {}
      foo[0] = &quot;Zero index in Lua!&quot;
    </code></pre>
    No actual array:<p>1) Lua has optimizations when a table only has numeric keys<p>2) This keeps Lua small.  AWK, another tiny language, has the same behavior.<p>No bitwise operators:<p>Lua 5.2 and higher have bitwise operations,[1] and pretty much every modern Lua 5.1 fork (LuaJIT, the version of Lua Wikipedia uses for scripting, luau, my personal “lunacy” fork of Lua 5.1, etc.) has added bitwise operations.<p>The only case where a real-world Lua implementation doesn’t have bitwise operations is Adobe Lightroom Classic,[2] and even there is is possible to implement them with a polyfill.<p>[1] <a href="https:&#x2F;&#x2F;lua.org&#x2F;manual&#x2F;5.2&#x2F;manual.html#6.7" rel="nofollow">https:&#x2F;&#x2F;lua.org&#x2F;manual&#x2F;5.2&#x2F;manual.html#6.7</a><p>[2] Alpine Linux has a lua5.1-bitop package which adds bit ops to their port of Lua 5.1
