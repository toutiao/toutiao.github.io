  author: strenholme
  text: "Wanting things like native JSON support goes against the Lua spirit.  Something
    like that belongs in a library, and lo and behold, there are several:<p><a href=\"https:&#x2F;&#x2F;luarocks.org&#x2F;modules&#x2F;luarocks&#x2F;json4lua\"
    rel=\"nofollow\">https:&#x2F;&#x2F;luarocks.org&#x2F;modules&#x2F;luarocks&#x2F;json4lua</a>
    - \n<a href=\"https:&#x2F;&#x2F;luarocks.org&#x2F;modules&#x2F;winterstream&#x2F;wjson\"
    rel=\"nofollow\">https:&#x2F;&#x2F;luarocks.org&#x2F;modules&#x2F;winterstream&#x2F;wjson</a>
    - \n<a href=\"https:&#x2F;&#x2F;luarocks.org&#x2F;modules&#x2F;xpol&#x2F;rapidjson\"
    rel=\"nofollow\">https:&#x2F;&#x2F;luarocks.org&#x2F;modules&#x2F;xpol&#x2F;rapidjson</a>
    -\netc.<p>Lua supports arrays; it has optimizations when all of a table’s keys
    are integers.  Keep in mind that AWK is the same way: There’s no numeric array
    in AWK <i>per se</i> either, just AWK’s version of a “table”, but it works just
    fine when all of the keys are integers.<p>Keep in mind that I have a fork of Lua
    which is 116,224 bytes in size (security hardened Lua 5.1 with `lfs` support);
    Lua is <i>tiny</i> and that’s why it does not have a built in JSON library nor
    will it wash the dishes for you.<p>Versions of Lua after Lua 5.1 introduced changes
    which broke backward compatibility.  Lua 5.1 is smaller than newer versions of
    Lua, runs great, and is incredibly fast.  I see Lua 5.5 as a different language
    than Lua 5.1, even though one can make a polyglot program which can run in both.
    \ Lua 5.1 is also the point from which a bunch of offshoots were made: luau (Roblox
    Lua), LuaJIT, etc."
