  text: The reason I put up with things like global by default, no “continue”, “--”
    instead of “#” for comments, and so on is because Lua is widely implemented, to
    the point it’s an informal standard for embedded scripting.  There’s PUC Lua (the
    original), LuaJIT, Lua in Rust, Lua in Go, Lua in C#, Lua in Javascript, Lua that
    compiles to native code, and so on.  All of these variants have agreed on having
    Lua, flaws and all.<p>I would love to see a POSIX standard for Lua (probably based
    on Lua 5.1); it’s widely enough deployed that a standard for it would make sense.  Right
    now the standard is either PUC Lua 5.1 or whatever the latest release of PUA Lua
    is at a given time.<p>I prefer Lua over Perl&#x2F;Python&#x2F;Ruby because I know
    I can get a Lua runtime going in whatever environment I’m in—e.g. when writing
    my Lua book, I used my personal fork of Lua 5.1, but the person I was writing
    the book with was using Moonsharp (Lua in C#) since they were a C# developer.  We
    could easily share code with each other.
