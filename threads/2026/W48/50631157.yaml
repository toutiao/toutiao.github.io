  author: BadBadJellyBean
  text: "&gt; so why isn’t that the standard process?<p>Because of people. I have
    once worked at a place that had no CI&#x2F;CD and people made hotfixes in prod.
    What they didn&#x27;t do was commit their changes back to git and when someone
    deployed a new version from git everything broke.<p>CI&#x2F;CD provides a path
    from git to prod if you do it right.<p>I have worked at another company without
    CI&#x2F;CD or tests for their legacy product. Every change by a developer was
    a shot in the dark. Will it work? Will everything explode? Who knew?<p>CI&#x2F;CD
    would have given a way to have some confidence. It&#x27;s not perfect but it&#x27;s
    worlds better than nothing.<p>Now you might say: people should not forget to commit
    their stuff to git. True. But they do. Every process that is only written down
    and not enforced technically will be broken at some point. The more people the
    easier it happens.<p>That of course doesn&#x27;t mean that there shouldn&#x27;t
    never be a way to short circuit the default process. If everything is down you
    have a good chance you won&#x27;t make it worse. But that&#x27;s the point. It
    should be an emergency route not the norm. Just as the fire exit is not the normal
    exit even though it might be very fast and convenient."
  score: 0
