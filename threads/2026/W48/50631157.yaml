  text: Obviously biased but our platform Rootly is built for this, alongside competitors
    like incident.io and PagerDuty.<p>The goal of all of our tools is to create structure
    that manages the chaos - a single Slack channel dedicated to the incident, roles
    and workstreams that can be assigned to DRIs, a single feed of updates curated
    by the MIM that can automatically spray out to execs, etc, plus an AI scribe that
    can transcribe the incident bridge and provide realtime updates for those who
    are not on it.<p>Basically, provide a tool that supports the system (ICS-like)
    - command, disseminate information, and make the response predictable.
