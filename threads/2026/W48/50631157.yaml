  author: greengreengrass
  text: To be clear, my point about laptop builds to prod and removing safeties was
    mostly tongue-in-cheek, although it does happen for &quot;hotfixes&quot; in many
    environments – more routinely than I&#x27;d care to admit.<p>The crux of my point
    is that there should be one deployment path that can go faster or slower as the
    requirement dictates. We trust the human operating the process to make that decision
    and empower them with sufficient context to do so. If the automated path isn&#x27;t
    safe or quick enough to use in an emergency, that needs fixing, and we only achieve
    the required levels of reliability and tease out the problems by doing it routinely.
    Process needs exercising to ensure it&#x27;s going to work in an emergency situation,
    where stress is high and we need the reliability of routine the most. It&#x27;s
    comforting to add gates, but if they&#x27;re routinely worked around or there&#x27;s
    non-compliance to get work done, they don&#x27;t add value.<p>Resilience engineering
    and especially Safety-II would call the gated path &quot;work as imagined&quot;
    while the hotfix path is &quot;work as done&quot;. Safety-II advocates for studying
    and strengthening how work actually succeeds, so closing that gap is a good place
    to start. Surgeons don&#x27;t have a &quot;trauma mode&quot; where they skip sterile
    technique and grab unfamiliar instruments, but in an emergency they can compress
    the timing because it&#x27;s drilled. The work of software engineers rarely has
    the same consequences, but nevertheless, deployments should work the same way.
  score: 0
