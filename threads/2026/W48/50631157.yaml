  author: greengreengrass
  text: 'See also:<p>Exec: We have this elaborate deployment process that our team
    must follow every time. To deploy our &lt;inconsequential product&gt;, it has
    all these fancy gates, CI checks, approval workflows (in several companies, up
    to and including exec sign-off). Every change in the build is tracked back to
    Jira tickets, and it can’t ship if they’ve not all been signed off by QA. A “release”
    to our cloud platform takes hours to do well; it’s a very specialist task, and
    our whole scrum process is designed to ensure this build goes every 2 weeks without
    fail. Staff stay late to make sure it happens.<p>Engineer: What about hotfixes
    when we find a bug in prod, and customers are down or were embarrassed or whatever?<p>Exec:
    oh, we have a special _hotfix deployment_ process for that. You don’t use any
    of the tooling. You cut a branch, build locally and push direct to prod; whatever
    it takes.<p>Eng: so why isn’t that the standard process?<p>The number of times
    I’ve had to explain to dumbfounded management that the existence of this hotfix
    process with no safeties means it should be the standard deploy process, because
    it either works fine and doesn’t need all the comfort theatre that’s been engineered
    around a ship process, or it doesn’t work fine and we need to run it repeatedly
    to fix its problems before it really causes an issue.<p>Sometimes I’m successful.'
