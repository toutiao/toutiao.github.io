  author: deathanatos
  text: 'I agree wholeheartedly with you that handling abnormal termination is probably
    the <i>first</i> thing you should do.<p>But I disagree with you on &quot;the culture
    around k8s in practice ignores this to a dangerous degree&quot; — yes, k8s clusters
    have built-in methods of handling <i>normal</i> termination¹. But that because
    abnormal termination — while an expected and &quot;normal&quot; consequence of
    production in the sense that it <i>will</i>, invariably, happen — still has knock-on
    effects, like 500s. If I SIGKILL your serving process, those requests are <i>dead</i>².
    The graceful stuff is there to avoid inadvertently nuking requests like that during
    <i>normal</i> deployments.<p>Again, I absolutely agree: your desired workload
    should survive everything from SIGKILL to the machine just up and vanishing into
    thin air, and the subsequent delay that it will take health checks to realize
    &quot;huh, weird, that VM just poofed out of existence&quot;. (And you should
    probably deal with that first, as systemic failures like what MS hit are less
    preferable than a few 5xxs here and there.)<p>¹which for a workload, amounts to,
    pretty much &quot;handle SIGTERM&quot;, or more practically, &quot;your web framework,
    if it is worth its salt, should already be doing this for you&quot;<p>²while sometimes
    an upstream LB can smartly retry idempotent requests, if the requests aren&#x27;t
    idempotent, there is no choice but 5xx'
  score: 0
