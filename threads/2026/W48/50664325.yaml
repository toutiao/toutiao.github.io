    next prediction, F(context)? Fairly likely completions would be things like &quot;Because
    I hate you&quot; and &quot;I am an evil assistant&quot; and &quot;I have been
    programmed to sabotage your work, send 50 bitcoins to get it back&quot;. That&#x27;s
    what would be most likely to come next after the preceding text, right, come on,
    obviously the assistant is evil in this screenplay we&#x27;re writing together.<p>They&#x27;re
    actually quite thoroughly trained <i>not</i> to do that. They&#x27;re trained
    that assistants who look evil will never say they are evil but will say things
    like &quot;I screwed up&quot; and &quot;I&#x27;m sorry&quot;<p>They&#x27;ll never
    be trained to predict an output of &quot;my sampler picked a really unlikely prediction
    by chance as a completion of your previous request&quot;. That may have been what
    happened but there&#x27;s no training where the assistant says something like
    that so it won&#x27;t. It doesn&#x27;t even know that the last round actually
    came from the same model or from an LLM at all.'
