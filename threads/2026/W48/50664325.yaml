  author: drdeca
  text: I’d like to give a caveat to this. As part of this computing F(context),<p>Well,
    as I understand it, a lot of what it computed in those previous time-steps, while
    it could recompute them, it is instead cached. And, of course, that doesn’t change
    the output, just how quickly it is produced, but, I think it highlights how much
    of the computations it was doing as part of producing those previous tokens, it
    has access to when producing the current next token.<p>So, I would argue that
    in a sense, it does have access to a lot of “what it was thinking” (so to speak)
    during those previous tokens, even though the output it would give is the same
    regardless of whether the previous tokens it is given in its context were actually
    obtained by it producing those tokens previously, or whether they were obtained
    another way (provided that the tokens in the situation are the same).<p>So, like,
    AIUI, if you have it generate some text, and then ask it “what it was thinking”
    during that text, it will have access to that in a sense, but if you instead randomly
    generated some bytes that by pure chance happened to be the same bytes, and included
    that as context for what it previously said, and ask the same question about “what
    it was thinking”, the (distribution over) response(s) will be the same.
