  author: krisoft
  text: "&gt; wasted a week of my time waiting for training runs to complete<p>A tip
    i got from a machine learning researcher: if you have a new training pipeline
    always run it with “toy-problem” sized parameters first. Where you can run the
    whole training in less than 10 minutes. Because it stings a lot less to find out
    that your loss is not comming down if you can learn that in minutes vs days.<p>The
    other advice he gave me was to try to overfit your model. Which is counter intuitive
    because you usually try to avoid that. But if you have way less training data
    than what you think your model would need it should learn that fast while of course
    not generalising well outside of it. And if that is not what you are seeing then
    probably you still have some bugs."
