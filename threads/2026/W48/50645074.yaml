  text: It&#x27;s possible for the train to refuse to halt, thus &quot;closing&quot;
    a station even if the building is still physically present.<p>Dunrobin Castle
    is a request stop, but <i>only</i> in the summer when the castle is open for visitors.<p>The
    Falls of Cruachan station has no electricity or lighting, so trains will only
    stop (on request) during the summer, in daylight hours.<p>Achanalt is a request
    stop open all year round, but only 8 trains per day, so it&#x27;s already on minimal
    support.<p>The stations at Rannoch and Corrour are also very isolated, but ironically
