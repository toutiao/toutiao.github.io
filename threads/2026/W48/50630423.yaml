  text: This post completely misses the point on many of the landmarks it describes.<p>&gt;
    Some of the world’s most famous squares are, in fact, far too large. St Peter’s
    Square in the Vatican, seen above, was designed by the famous artist Bernini,
    and it does indeed look impressive in drone footage. For human visitors, however,
    it is an exhausting place, overwhelming without being impressive.<p>I grew up
    in Rome, and very often the square was absolutely jam packed with people especially
    around Christmas, Easter, the Jubilee, when people waited for a new Pope to be
    chosen, etc. Saying the square is too big just makes no sense. It was not built
    for you to take photos or feel cozy, but to allow for massive amounts of faithful
    to congregate.<p>&gt; Statues line the sides of the Piazza della Signoria in Florence
    rather than standing in the center. This leaves the center free for visitors while
    providing the statues with a helpfully plain backdrop.<p>Does the writer really
    believe that the statues were put on the sides to facilitate visitors? The early
    statues were put outside of the palace to show how the people had exiled the Medici
    from power. Once the Medici returned, they put more statues next to them to show
    how they eventually prevailed. This has nothing to do with making the space welcoming
    to visitors or anything like that. It’s all revisionist history.
