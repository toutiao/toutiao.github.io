article:
  url: https://www.worksinprogress.news/p/how-to-make-a-lovable-city
  title: How to make a lovable city
  fetch_status: success
  content: "[Features](https://www.worksinprogress.news/s/features/?utm_source=substack&utm_medium=menu)\n\n#
    How to make a lovable city\n\n### Camillo Sitte made the blueprint for beautiful
    cities. Here are his five principles.\n\n[\n\n](https://substack.com/@phoebearslanagic)[\n\n](https://substack.com/@scphughes)[\n\n](https://substack.com/@worksinprogress)\n\n[Phoebe
    Arslanagić-Little](https://substack.com/@phoebearslanagic), [Samuel Hughes](https://substack.com/@scphughes),
    and [Works in Progress](https://substack.com/@worksinprogress)\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!UniX!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e363b84-cc8f-4a0c-9dbe-d592a8651970_2200x1467.jpeg)\n\n*
    * *\n\nEveryone loves the streets of old cities like Verona, Bruges, and Prague.
    The reason might seem obvious: they are lined by beautiful historic buildings.
    But people also love the streets of Osaka, Taipei, and Hong Kong. While the buildings
    of the latter cities are mostly modern and nondescript, their streets are still
    full of character and enchantment.\n\nThe Austrian architect Camillo Sitte (pronounced
    ‘zitter’) sought to explain what makes some public spaces more successful than
    others in a lively, opinionated masterpiece called _The Art of Building Cities_,
    published in 1889_._ Sitte argued that the best public spaces are physically enclosed
    and fairly small, creating a sense of shelter and intimacy, defining picturesque
    views and perspectives, and making public buildings appear larger and more dignified
    by comparison. He denied the importance of symmetry and claimed, counterintuitively,
    that monuments should be pushed to the edge of squares, and that great public
    buildings should generally be entangled in a mass of everyday housing.\n\nSitte’s
    book was explosively successful, seizing the imagination of late nineteenth-century
    Europe. For a few decades, Sitte was a decisive figure in international urban
    planning, and planners across the world strove to implement his ideas. But after
    modernism came to dominate Western planning in the mid-twentieth century, Sitte
    was mostly forgotten.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!VrHD!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac50fca8-e767-4514-9806-afe873814d00_2500x1305.jpeg)\n_Sitte’s
    planning theories were hugely influential around the world, though they were quickly
    eclipsed by the rise of modernist planning. This unrealized plan for Canberra
    (1911–12), by the Arts and Crafts designer Ernest Gimson, shows strong Sittesque
    influence. Source: Leicester Museums / Bridgeman Images._\n\nSitte’s attacks were
    directed against the repetitive grids, sweeping boulevards, and impersonal regularity
    of most [nineteenth-century urban planning](https://worksinprogress.co/issue/urban-expansion-in-the-age-of-liberalism/).
    To many people today, however, nineteenth-century urbanism is relatively appealing;
    certainly, it is a lot more attractive than the motorways, slab blocks, and concrete
    plazas that came after. This can make Sitte strange to read, but it also makes
    him even more important now than he was in his own time.\n\nAnyone who wants to
    build beautiful cities today needs to understand what it is that makes the most
    beloved cities of the past so successful. Focusing only on the appearance of buildings
    can only get you so far. As Sitte showed, some of the world’s most impressive
    buildings are badly let down by their surroundings, and form part of inhospitable
    and uninviting public spaces. Equally, neighborhoods consistent with Sittean principles
    can be wonderfully charming even if their constituent buildings are nothing special.
    Understanding these principles may be the key to building new neighbourhoods and
    cities that people truly love being in.\n\n[Share](https://www.worksinprogress.news/p/how-to-make-a-lovable-city?utm_source=substack&utm_medium=email&utm_content=share&action=share)\n\n####
    **Create enclosed spaces**\n\nThe first principle of _The Art of Building Cities_
    is the importance of creating physically enclosed public spaces. People feel calmer
    and more protected in such spaces, which they experience as ‘outdoor rooms’. An
    enclosed outdoor area can also develop its own character, just as kitchens, bedrooms,
    and bathrooms have their respective characters. Sitte would have seen a city without
    enclosed public spaces as analogous to an extremist open-plan house, where the
    kitchen, bedroom and bathroom are open onto each other and bleed constantly into
    one another’s character.\n\nWhile the rooms of a house are created with partition
    walls, the enclosed spaces of a city are created with buildings. A conundrum for
    urban designers is that the building wall of a square generally has to be repeatedly
    broken to provide access. A square is thus like a room with five or ten large
    doors, permanently left wide open, undermining its sense of enclosure. Sitte was
    keenly interested in how to handle the entrances to squares so as to mitigate
    this.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!5I1F!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e64f326-0506-47dd-8591-3dbfe7ec7b54_2500x1894.jpeg)\n_Grand-Place
    in Brussels has a single entrance at each corner, continuing the plane of the
    side of the square rather than cutting into it diagonally. This means that the
    entrances are virtually invisible from almost all points of the square, preserving
    the sense of enclosure. Source: Adobe stock_\n\nThe picture above shows the Grand-Place
    of Brussels. Most of the entrances are at the corners, and at each corner, only
    one street enters. These streets continue the plane of the square rather than
    entering at a diagonal. This means that, from almost any point in the square,
    the two building walls appear to overlap each other, effectively concealing the
    entrance to the street and preserving the sense of enclosure. The resulting ‘turbine
    square’ is so common in old towns that, as Sitte said, ‘it can be considered as
    one of the conscious or subconscious principles of ancient city building’.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!B4ip!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F584d78c3-7713-4fd9-a5ea-95ac0618d57b_2500x1696.jpeg)\n_Most
    of the entrances to the Plaça Reial in Barcelona are bridged over, meaning that
    the square is almost perfectly enclosed. Source: Wikimedia Commons_\n\nEven better
    than a turbine square, in Sitte’s view, was one whose entrances had been bridged
    over, creating a fully continuous building line around the square. This is particularly
    common in Spain. The Plaça Reial in Barcelona has seven entrances, but six have
    been bridged over, so that the square feels like a courtyard or cloister. Colonnades,
    which Sitte thought to be a greatly underrated device in urban design, provide
    a simple way to achieve this.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!sZiB!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F40d51438-05d8-4792-bc23-4a6419548411_2500x1688.jpeg)\n_Numerous
    roads break into Trafalgar Square in London, often entering at diagonals. It feels
    much more weakly enclosed than the Grand-Place or the Plaça Reial. Source: Alamy_\n\nLondon’s
    Trafalgar Square is an example of the opposite, a ‘square’ that is only weakly
    enclosed. Wherever one stands, one can generally see two or more of the wide and
    busy roads that join it. Like many nineteenth-century squares, Trafalgar Square
    was never intended to be an enclosed space, but rather was designed to improve
    the flow of carriages between the Strand and the West End.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!zutg!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa7857b2c-0b74-4e2f-8496-f9fa8d002559_2500x1890.jpeg)\n_The "
