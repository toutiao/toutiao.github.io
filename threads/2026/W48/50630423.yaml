  author: jodrellblank
  text: |-
    &quot;&quot;&quot;Let’s Take a Traditional City Break 3: Life With Really Narrow Streets. May 1, 2011. Today we have another collection of Traditional City pics. The most important thing, in my opinion, is not to have a lot of verbalizing, but rather a lot of images.&quot;&quot;&quot;<p>- <a href="https:&#x2F;&#x2F;newworldeconomics.com&#x2F;lets-take-a-traditional-city-break-3-life-with-really-narrow-streets&#x2F;" rel="nofollow">https:&#x2F;&#x2F;newworldeconomics.com&#x2F;lets-take-a-traditional-city-b...</a><p>&quot;&quot;&quot;Since the beginning of this series, I’ve said that the key to making beautiful urban environments is a focus on what I’ve called “Really Narrow Streets.” I think that term has gotten a little old, so I’ve instead adopted the term “Narrow Streets for People.” These Narrow Streets for People are combined with Arterial and Grand Boulevard-size streets, and in modern times trains and subway systems, to create what I’ve called the Traditional City. I’ve said that perhaps 80% of total street length can consist of Narrow Streets for People, with perhaps 20% Arterials and larger, to create an environment that is overwhelmingly people-friendly while also being easy to get around in with motorized wheeled vehicles. Although most streets are Narrow Streets for People, most everywhere is within a quarter-mile or so of an Arterial.&quot;&quot;&quot;<p>- <a href="https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people&#x2F;" rel="nofollow">https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people&#x2F;</a> (2015)<p>Part 2 - <a href="https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people-2-subtleties-of-street-width&#x2F;" rel="nofollow">https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people-2-su...</a><p>Part 3 - <a href="https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people-3-a-shopping-center-example&#x2F;" rel="nofollow">https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people-3-a-...</a><p>Part 4 - <a href="https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people-4-organizing-the-street&#x2F;" rel="nofollow">https:&#x2F;&#x2F;newworldeconomics.com&#x2F;narrow-streets-for-people-4-or...</a><p>&quot;&quot;&quot;How To Make a Pile of Dough with the Traditional City 5: The New New Suburbanism&quot;&quot;&quot; (2011)
