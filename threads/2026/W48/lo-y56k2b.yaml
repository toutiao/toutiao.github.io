  content: "![Beyond Linux: A Journey Through the Open Source Ecosystem](https://it-notes.dragas.net/linuxday_2026.jpeg)\n\n_What
    follows is the text of the talk I gave at Linux Day 2026 in Modena, lightly adapted
    for the blog. The talk was in Italian, in front of a Linux audience - which explains
    a few of the jokes._\n\n**Linux is one of the best-known players in the open source
    world, but it's not the only possible path. A journey through the BSDs, illumos
    and other alternative operating systems, to reflect on Open Source as an idea,
    a philosophy and a practice of sharing knowledge.**\n\nMy name is Stefano Marinelli.
    I'm a sysadmin and consultant, and I run my own small company specialised in open
    source services and solutions. I like to call myself the \"Barista\" of the [BSD
    Cafe](https://bsd.cafe) and the [illumos Cafe](https://illumos.cafe), online communities
    of people passionate about technology, open source and sharing. Today I'm not
    here just to talk about operating systems, but about freedom, sharing and knowledge.
    From free software to open source.\n\nMy first contact with the Free Software
    world was in 1996, when I wasn't even 17 yet. I saw a box set advertised in a
    magazine: \"a whole operating system, for free\", at a very low price. Something
    like 30,000 lire. Shortly before, I'd paid roughly ten times as much for the Windows
    95 upgrade edition. Dismissive and without a shred of trust, I decided to order
    it and give it a go. I mean: who would ever write something like that... and release
    the source code? But six CDs for 30,000 lire... let's try. Worst case, it'll be
    an experience.\n\n![The Box Set](https://it-notes.dragas.net/cofanetto_linux.jpeg)\n\n**It
    was love at first shell.** That terminal opened up a whole universe, and to what
    I already knew (commercial licences, freeware, shareware) I added the concept
    of Free Software. But I didn't have enough hardware to run two operating systems,
    so I reinstalled Windows and put it all off. Still, I started thinking. Reflecting.
    Studying. In 1997 I got a new PC and started using Linux - or, as I was careful
    to say, GNU/Linux - for everything. Except games. For those, a small Windows partition
    survived, though not for long.\n\nIn 1998 I enrolled in Computer Science at the
    University of Bologna. Even back then, it was a faculty strongly oriented towards
    free software. Linux in the labs. I was one of the few who, in the first year,
    already knew what Free Software was (not free as in price, but...freedom!) and
    how to use the Linux workstations. That gave me a big advantage, especially from
    the second year onwards. Renzo Davoli was already pushing hard in that direction.
    I decided that would be my path. And so it was, and I started pushing too. Windows
    wasn't the \"enemy\" to me. The imposition was. Personally, I respect rules, but
    not impositions. Some people followed me, others watched from a distance. I didn't
    care. I was widening my horizons.\n\nIn the early 2000s I also discovered the
    BSDs. And I convinced my parents that I needed a laser printer for \"university
    material\". In reality, I wanted to print the excellent BSD documentation. Maybe
    not university material, but the printed FreeBSD Handbook probably served me better
    than half of the theory exams I took back then. Thanks, mom and dad!\n\nBut let's
    get back to the beginning.\n\nFree Software was born out of a change. In those
    days, code circulated freely among people. Depending on their needs, they exchanged
    source code, modified it and shared it again. But at some point this began to
    change. There's an anecdote that, while not exhaustive, gives the idea: the printer
    Richard Stallman was using kept jamming, and nobody got notified. He wanted to
    modify the software so that he'd get a notification, as he'd done with the previous
    printer. Back then it was common practice, but this time he was refused. \"I can't
    share the source code. It's under NDA.\" In other words, he had lost control over
    what he was using. He even wanted to improve the program, and instead he got a
    refusal.\n\nThe rest is history. At least until a few years ago.\n\nBecause thirty
    years ago we fought for Free Software to be taken seriously. When I started working,
    I was almost laughed at. \"That's toy stuff you use at university. The real world
    uses something else.\" \"Why don't you just use Windows? Everything's easier.\"
    And yet, the toys often worked better than the expensive proprietary solutions.
    Or at least just as well, at a fraction of the cost. \"Let's try. Don't pay me
    until you're satisfied.\" They smiled, incredulous. Then they paid, happily. We
    could prove there was an alternative. Free, with no artificial locks. Something
    that anyone - even the broke but eager student - could study and set up. Technology,
    that kind of \"enterprise\" technology, was truly within everyone's reach. There
    was no need to buy expensive products, or recurring certifications just to have
    the \"right\" to work on them. You study, you apply yourself, nobody can stop
    you. I attended Linux Days. I spoke at Linux Days. For example, here I am, in
    **Linux Day 2004**.\n\n![Linux Day 2004](https://it-notes.dragas.net/linuxday_2004.jpeg)\n\n**We
    won that battle. We won that war.** Linux - chaotic Linux, built by countless
    external contributors, made of different and varied distributions - has reached
    everywhere. Open Source is everywhere. But something happened - something beautiful,
    but terrible: precisely because it reached everywhere, something changed in the
    spirit. \"Too big to fail\". And so the big players arrived. Today, Linux development
    is driven by corporate money: companies like Microsoft (the same Microsoft that
    once considered Linux its sworn enemy - or Red Hat itself) and other big tech
    players. In itself, this has been a good thing. In practice, though, it means
    that they steer its development, even if indirectly. Year after year, it has started
    to take the shape of a different kind of product. Is the user still at the centre,
    or is it more code to make Azure run better? Sure, it's Open Source, it's free.
    But it's increasingly close to the needs of the big companies funding its development
    and, at times, further from the ordinary user. That's not necessarily bad: many
    of these investments have given us extraordinary technologies.\n\nBut I wonder
    whether, in the process, we're losing something. Not so much in the code as in
    the mindset. If not in the kernel, then in the community around it.\n\nBack then,
    precisely because we were frustrated by \"It only works on Windows\", we were
    careful to write portable software. I'll say one word, without going into too
    much detail: POSIX. Once a mantra: POSIX compliant. A set of standards defining
    common interfaces between operating systems, so you can write programs that, with
    few or even no changes, run on different Unix and Unix-like systems. Today, in
    the communities around Linux, you hear more and more often that POSIX is \"outdated\".
    When I send a patch to make a specific tool work on FreeBSD, for example, I often
    read comments like: \"Why don't you just use Linux?\". And that déjà vu sends
    a shiver down my spine: is the community I loved so much turning into a copy,
    albeit a better one, of its worst enemy?\n\nBut careful: I'm not here to speak
    ill of Linux. That would be absurd. I mean: coming to Linux Day to trash Linux?
    It's an extraordinary operating system, and I owe it a great deal.\n\nI'm here
    to remind you that Linux isn't the only way to understand free software. And that
    a project being less well known doesn't make it less interesting, less valid or
    less worthy of attention. Because if freedom of choice is truly a value, we must
    be ready to defend it even when someone chooses something different from what
    we choose.\n\nSo let's see what lies beyond Linux. Because monoculture is a problem,
    in Open Source too.\n\nBecause free software is...free. And we must be free too.
    Free to choose, to consider alternatives. To contribute, if we want to. To understand
    which solution best fits our problem. We "
