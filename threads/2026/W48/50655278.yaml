  author: hdndjsbbs
  text: There is a well-known formula, Black&#x27;s Equation, which computes mean
    time to failure for chips caused by electromigration. Temperature is absolutely
    a factor. In industry it is very common to accelerate MTBF testing by increasing
    ambient temperature in a heating chamber, because you can predictably calculate
    MTBF at standard operating temps based on testing at elevated temps.<p>Electromigration
    is an unavoidable problem that increases at lower process sizes and higher temperatures.
    Cutting edge chips at high temps will fail faster without sufficient redundancy
    designed in.
