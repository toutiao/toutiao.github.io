  author: marginalia_nu
  text: Shouldn&#x27;t matter very for this application.  In space you&#x27;re using
    blackbody radiation to get rid of excess heat, and that only does meaningful work
    if you use a heat exchanger first to increase the temperature of the medium on
    the radiator side (basically same principle as a refrigerator) since the Stefan–Boltzmann
    law says thermal radiation per area is P∝T^4 (and blackbody radiation is itself
    pretty anemic unless temperatures are pretty high).<p>Also worth noting that only
    the projected area matters for blackbody radiation so having a convoluted high
    surface area low volume radiator like we do when air or liquid cooling basically
    does bupkis.
