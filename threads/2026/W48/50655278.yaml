  text: The resistance drops with temperature only for semiconductors with low concentrations
    of doping impurities.<p>Almost all the parts of the semiconductor devices used
    in practice have doping levels high enough so that their resistance grows with
    temperature.<p>In such doped semiconductors, there exists a temperature threshold
    above which the resistance begins to decrease with temperature.<p>That threshold
    temperature is chosen to be much above the normal operating temperature of the
    device. If that temperature threshold is reached, the so-called thermal breakdown
    of the device can occur, when due to positive feedback, the electric current through
    the device increases until the semiconductor crystal is melted and destroyed.
