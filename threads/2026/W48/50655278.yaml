  author: arghwhat
  text: We strictly speaking never do pure air-cooling in this context.<p>Traditional
    water-cooling transfers heat to a fluid, which is then moved to a large radiator
    to be cooled by air.<p>Traditional &quot;air-cooling&quot; transfers heat to a
    phase-changing fluid (heat-pipe), which is then moved to a large radiator to be
    cooled by air.<p>Only differences are the type of and amount of fluid, as well
    as the presence of pumps. Phase-change beat using a fluid as a thermal buffer
    by quite a bit. The benefit of water is that it&#x27;s easy to provide massive
    thermal inertia, and the ability to transfer the heat to a far larger external
    radiator than could be implemented internally with heat-pipes.
  score: 0
