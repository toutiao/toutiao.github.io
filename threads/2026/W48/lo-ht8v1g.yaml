    Yes. Here the analogue of negative charge (masking positive charge) would be negative mass. Negative mass can build all sorts of interesting machines - wormholes and closed, timelike loops (ie “time machines”) according to general relativity.
    But I personally don’t think negative mass is a thing.
    Edit: Matt Davis, on left of first photo, was my PhD advisor so this is kinda cool :)
