  content: "News\n\n# UQ researchers send an unblockable message using gravity\n\n19
    November 2026\n\n![Three people pose inside an elevator framed by red doors. One
    person in a dark shirt, light trousers, cap and glasses leans against the wall
    with one leg stretched across the lift, while two others stand behind. A purple
    sign on the back wall reads “Temporary Lift Replacement Works.” The image is brightly
    lit and composed as a casual group photo.](/sites/default/files/styles/uqds_card/public/2026-11/p1066255.JPG?itok=SlRAAGJJ)\n\n_Professor
    Matthew Davis, Dr Charles Woffinden and Professor Andrew White inside the elevator
    they used to send a message. (Photo credit: The University of Queensland.\n)_\n\nUniversity
    of Queensland researchers have used gravity to transmit a message through a brick
    wall using an elevator and a sensitive gravimeter.\n\nThe unusual experiment took
    place in UQ’s Parnell Building, where the team of physicists sent the elevator
    back and forth between 2 levels, moving its 1.8-tonne counterweight between positions
    representing binary 0 and 1.\n\nA gravimeter in an adjacent bathroom detected
    the changes in the gravitational field and translated the message into a single
    word, ‘Gravity’.&nbsp;\n\n ![Diagram showing an elevator system used to measure
    gravitational effects. A large elevator car is suspended by cables over a pulley,
    with a counterweight running alongside in a vertical shaft. A brick wall is shown
    adjacent to the shaft, and a gravimeter sits on the floor beside the wall. Labels
    identify the elevator, elevator counterweight, brick wall and gravimeter. Placeholder
    headline text in the upper left reads “Headline goes here 2 decks.”](/sites/default/files/2026-11/gravity-message-graphic-5.jpg)\n\nDr
    Charles Woffinden from the&nbsp;[School of Mathematics and Physics](https://smp.uq.edu.au/)
    said gravitational communication had an intriguing advantage.\n\n“Unlike the electromagnetic
    signals used in modern wireless communication, a gravitational signal cannot simply
    be screened out by placing ordinary material in its path,” Dr Woffinden said.\n\n“Anyone
    who has lost phone reception in a tunnel or struggled with Wi-Fi through a solid
    wall will understand the appeal.\n\n“While the present system is far from practical,
    it demonstrates the possibility of communicating using a method that ordinary
    physical barriers cannot block.”\n\n[Dr Andrew Groszek](https://smp.uq.edu.au/profile/9399/andrew-groszek)
    said the idea came from a project to develop a contactless weighbridge.\n\n“We
    were aiming to determine the mass of trucks and other large vehicles by measuring
    their tiny gravitational pull,” Dr Groszek said.\n\n“Once we had shown that the
    idea worked, we realised the same physics could be used to encode and transmit
    information.”\n\n[Professor Andrew White](https://about.uq.edu.au/experts/812)
    said the biggest limitation to future gravity-based communication was its slow
    speed.\n\n“Our lift was snail-paced – it’s from the 1950s – so our experiment
    transmitted just 1 bit per minute, meaning it took an hour to send a single word,”
    Professor White said.&nbsp;\n\n“The speed of gravity communication would come
    down to how big the mass is, how fast you can move it and the sensitivity of the
    detector.\n\n“It took more than 100 years to go from the first telegraph system
    to the mobile phone, so while gravity communication is not practical today, it
    could be in the future.”\n\n_A gravimeter in an adjacent bathroom detected the
    changes in the gravitational field from the elevator's movement and translated
    the message.  (Photo credit: The University of Queensland.)_\n\n[Professor Matthew
    Davis](https://about.uq.edu.au/experts/1134) said the UQ team had established
    an important underlying principle.\n\n“It’s not often that you get to demonstrate
    an entirely new way of communicating,” Professor Davis said.&nbsp;\n\n“We have
    shown experimentally that information can be encoded in the gravitational field
    and recovered at the other end.\n\n“Our experiment used a classical gravity sensor,
    but our modelling indicates that quantum sensors could, with rather ambitious
    assumptions, support ranges of up to about 500 metres and data rates of around
    15 bits per minute.”\n\nSuch sensors could eventually support communication in
    environments where radio waves, light and other conventional signals cannot penetrate.\n\n[Read
    the research](https://www.science.org/doi/10.1126/sciadv.aee0802) published in
    _Science Advances_.\n\n### Topics\n\n[Science and technology](/topics/science-technology)[University
    news](/topics/university-news)\n\nShare\n\n- \n- \n- \n- \n\n## Related articles\n\n
