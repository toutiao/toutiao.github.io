    “Unlike the electromagnetic signals used in modern wireless communication, a gravitational signal cannot simply be screened out by placing ordinary material in its path,” Dr Woffinden said.

    And that's how you can tell he's a physicist but the person who wrote the headline is not.  This cannot be blocked by ordinary matter, but in theory could be blocked by exotic matter.  If anyone can produce such exotic matter, the impact would be very interesting (something that blocks the propagation of gravity would allow all sorts of interesting machines).
