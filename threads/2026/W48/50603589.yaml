  author: Brajeshwar
  text: Cool. This looks fun and I believe you had fun playing with it.<p>I’ve been
    having fun with miniature 3D Isometric maps for a while, of course, with AI (Claude
    Code). I’m fascinated by the work of <a href="https:&#x2F;&#x2F;miniworld.marceloeduardo.com"
    rel="nofollow">https:&#x2F;&#x2F;miniworld.marceloeduardo.com</a> which I stumbled
    on as I was tinkering with a few of my ideas.<p>His Los Angeles map[1] popped
    up and I have a soft corner for that city and it led me into a rabbit hole.<p>Unlike
    the US, UK, and European region, India do not have 3D (no, Google do not have
    them). I also wanted to use only open data, nothing to call a third-party service,
    no photographs, no satellite data&#x2F;imagery, and be able to deploy on Cloudflare
    Stack with the least money ever to spent except my Anthropic Tokens.<p>I wanted
    the geography to be as close to real as possible as most of them are stationery;
    roads, railways, the metro, lakes, building footprints, and most building heights.<p>Everything
    is pretty much drawn with AI Codes, so I don’t have to re-render anything when
    the data changes or updates. I scheduled the map tile creation on a MacBook Pro
    M1 only when I slept, so it took a few days but I like what I saw. I will, hopefully,
    find it intersting enough to keep tinkering with them.<p>The first thing I did
    was re-discover hometown[2] as I have no recollection or are not good with where
    the places are. In that similar style but where I can afford to add rotation more
    info&#x2F;date along multiple axis - a short 3D view of walk-way along London&#x27;s
    South Bank.[3]<p>1. <a href="https:&#x2F;&#x2F;miniworld.marceloeduardo.com&#x2F;cidades&#x2F;?city=los_angeles"
    rel="nofollow">https:&#x2F;&#x2F;miniworld.marceloeduardo.com&#x2F;cidades&#x2F;?city=los_angel...</a><p>2.
    <a href="https:&#x2F;&#x2F;manipur.oinam.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;manipur.oinam.com&#x2F;</a><p>3.
    <a href="https:&#x2F;&#x2F;brajeshwar.com&#x2F;misc&#x2F;london-southbank&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;brajeshwar.com&#x2F;misc&#x2F;london-southbank&#x2F;</a>
  score: 0
  posted_at: '2026-11-23T03:52:50Z'
