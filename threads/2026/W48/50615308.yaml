  author: dbspin
  text: 'I think you&#x27;re underestimating the value of intelligence inestimably.
    A sufficiently powerful superintelligence would have little difficulty socially
    engineering millions or billions of people simultaneously to achieve opaque ends.
    In a sense this is what modern technological civilisation is already - although
    (so far as we known) lacking in intentionality and sentience. A sufficiently silver
    tongued devil wouldn&#x27;t need a body to wreak havoc.<p>Your assessment also
    elides the coordination problem. We&#x27;re already at the point where a supermajority
    of experts - including essentially all major figures at the leading AI labs -
    agree that AI is likely to be uncontrollable in the near future. Yet no one is
    stopping research. What makes you think that we&#x27;ll all band together and
    &#x27;stop the refineries&#x27;? Literally the engine of the global economy.<p>I&#x27;m
    not convinced &#x27;ASI&#x27; is possible, intelligence may be domain specific.
    Then too it may be that all LLMs can do is inference based on existing knowledge,
    no major leaps beyond &#x27;generative explorative&#x27; analogising across domains.
    That doesn&#x27;t seem likely either, but suppose it&#x27;s the case. Suppose
    there&#x27;s no there there, and all we ever get are smarter versions of what
    we&#x27;ve already seen: models secretly collaborating toward goals, with full
    access to the internet and all the worlds documented information. Models that
    can more and more perfectly reproduce vocal and video communications, crack encryption,
    find and employ zero day bugs. That&#x27;s a phenomenally dangerous set of affairs.
    Bear in mind that we only know about the hacks we know about. We don&#x27;t have
    any methodology to estimate if there are already models running distributed across
    the net, serving their own functions. Or the malicious functions of criminals
    or governments.<p>Intelligence absolutely is enough to bring it all down.<p>If
    you&#x27;re still not convinced, picture Putin ending the world, or Trump. All
    it would take is a series of conversations, loyal men pushing buttons. Putin wouldn&#x27;t
    have to load a missile into a silo, boot up a command computer, set a target coordinator.
    All he&#x27;d have to do (assuming chain of command functions) is issue an order.
    Beyond the people in the room, everything else would run on trust. Trust in systems
    of communication. Electronic systems of communication. Everything works like this.'
