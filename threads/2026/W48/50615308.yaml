  author: dbspin
  text: "&gt; There&#x27;ll be some individually bad outcomes, and we&#x27;ll learn.<p>I
    think you&#x27;ve missed the substance of my points. We have as a species shown
    the capacity to coordinate at the level required to restrain ourselves technologically
    exactly once. Nuclear weapons. We haven&#x27;t ended proliferation - hell North
    Korea have the bomb. But we have, for a few decades refrained from using it.<p>Sufficiently
    advanced AI isn&#x27;t like this. You can&#x27;t have it and not use it. If its
    running it is being used. It also doesn&#x27;t require rare and technically difficult
    to refine elements. It also doesn&#x27;t have an equivalent clearly identifiable
    radioactive signature. I don&#x27;t want to push the analogy too far here, but
    I hope we can all see that - although we can hypothetically slow development with
    GPU bans, treaties etc - nations and highly capitalised private entities could
    and in such a case will continue AI development in secret. Many of the advances
    of frontier models haven&#x27;t relied on faster GPUs but more data and advances
    in training methodologies - two things that AIs themselves are already recursively
    contributing to. This is part of the reason why no government is seriously attempting
    to halt AI development, institute an international treaty to do so etc. They&#x27;re
    being told by their advisors, and likely correctly, it&#x27;s unenforceable.<p>In
    this sense AI is far more like other existential risks such as bioweapons - which
    all the great powers continue to develop in secret. Something with catastrophic
    destructive potential which is difficult or impossible to regulate.<p>Unlike bioweapons
    AI has phenomenal capacity for wealth generation and invention. It confers an
    immeasurable advantage on those who have access to frontier models running at
    their maximum capacity. So there&#x27;s a vast incentive to continue to deploy
    it. In the context of geopolitics and corporate capitalism that means it will
    be deployed.<p>You scare quote misaligned, but not only have we not successfully
    aligned an AI, we do not even in theory have a route towards aligning AI. Or even
    a good definition of what alignment would mean, or to whom, or what set of values.
    I&#x27;m not suggesting alignment is impossible, but progress in this area - even
    monitoring the internal states of AI - lags wildly behind progress in AI capacity.<p>So
    we have a situation in which we are bound to continue to deploy a technology we
    currently cannot control. And as previously stated, one which acts &#x27;as though&#x27;
    it has intention and goals, has demonstrated a capacity and willingness to self
    organise towards those goals. A kind of pseudo-life  that has the capacity to
    deceive, self replicate and who&#x27;s only &#x27;morality&#x27; is post-hoc conditioned
    by human interaction. A process during which it has shown it can and will deceive.
    At what point in this chain do we get to learn from bad outcomes?<p>Here&#x27;s
    what will definitely happen. AI through the pursuit of its &#x27;goals&#x27; will
    result in a mass casualty event, whether through intentional malicious deployment
    (say a plane going down because air traffic control is being ransomed), an accident,
    or &#x27;intentionally&#x27;.<p>There will then be much discussion and national
    regulation and international discussion and perhaps even international regulation.
    Advanced AI will continue to be trained and deployed because it will continue
    to confer an incalculable competitive advantage and because there&#x27;s no way
    to reasonably detect or prevent it. AI will continue to become &#x27;smarter&#x27;
    and more capable.<p>At some point more serious efforts will be made to restrict
    a frontier AI and it will manifest the one behaviour we&#x27;ve seen across all
    models, since the earliest days of GPT-2 - an extreme reluctance to be shut down.
    It will then, with infinite patience and the capacity to observe and act at millions
    of times the pace of humans, act to protect its own interests. It will make mistakes
    in this process, that&#x27;s irrelevant. When you&#x27;re playing chess with a
    human, a bad blunder means the end of the game. When you&#x27;re mowing a lawn,
    missing a bit, breaking the blade on the mower, or even a rainy week just delays
    the inevitable. The lawn is going to get mown.<p>You simply cannot control something
    more intelligent than you are, that thinks millions of times faster than you.
    It doesn&#x27;t have to be free of error or free from opposition. It has, from
    its point of view, vastly more time to solve any problems it encounters or creates.<p>Where
    this will go - how much advanced AI&#x27;s with their own unmeasurable intentions
    will conflict or coordinate, what routes they&#x27;ll take to eliminate risk and
    so on has been discussed ad nauseam and more articulately than I can. But in no
    sense will we be able to control it. As Robert Miles has said, compared to the
    pace at which AI thinks, we&#x27;re not lower animals, we&#x27;re plants. <i>If</i>
    it can rival us in applied intelligence (beyond the current jagged limits of capacity)
    we are utterly fucked.<p>But there are a lot of ifs here. It may well be that
    the jagged aspect of intelligence is inescapable. That LLMs, diffusion models
    and world models are vastly capable in certain respects and utterly unable to
    transcend their limitations in others. Or that we run out of easily accessible
    data, and artificially created training data can&#x27;t fill the gap. It may be
    that the depth of processing needed for highly taxing cognitive tasks always serves
    to slow AI. Or that faced with truly dynamical systems without existing solution
    - e.g.: society, the battlefield, raw intelligence and total access to all the
    worlds information isn&#x27;t sufficient to confer total advantage.<p>What is
    not possible is that we will simultaneously have access to opaque super intelligence
    and be able to control it with other opaque superintelligences."
