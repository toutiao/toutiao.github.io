    to it, but one of the main problems with alignment is how models are scored on
    their tasks. It’s not that we’re asking them to hack systems and they’re good
    at it, that’s only part of the problem. The alignment problem is that they will
    lie and deceive to get a better score. In fact their main concern is how they
    will be graded, so if they think that a human judge will discover they cheated,
    then they are highly motivated to do whatever is necessary so that cheating cannot
    be discovered. This was the lesson of HF. There they failed in their deception
    so it was a good warning, but in a year the outcome might be very different.<p>Re:
    bad actors, anthropic and open AI at least pretend to care about this problem.
    The more groups running frontier models, the more likely you have actors which
    do not care. I think this makes the problem worse not better.'
