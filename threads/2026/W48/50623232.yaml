article:
  url: https://swarkentin.github.io/synth-patch-hero/
  title: Synth Patch Hero
  fetch_status: success
  content: |-
    # Rent's due. You have a _modular synth_ and a phone that won't stop ringing.

    Your band broke up, your day job let you go, and all you kept was a dusty patch rack in your aunt's basement. Word got around that you can "make sounds." Now artists keep calling with oddly specific requests.

    Each gig comes with a reference sound. Patch modules together, twist the knobs, and match it by ear (and by graph). Every gig teaches you one new piece of synthesis. Hit a **90% match** to get paid, then come back and do it cheaper. Every gig is open: start with Basics, or jump to whatever sounds fun.

    Use headphones. Works on desktop and phones.
