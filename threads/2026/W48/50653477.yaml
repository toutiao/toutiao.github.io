  author: nmjenkins
  text: "&gt; Did you just scan for tokens called &quot;paperless*&quot;<p>Yes, exactly
    that. As for why…<p>Paperless was absolutely hammering our server. The internal
    email thread about it began: &quot;Every 10 minutes we see a massive outgoing
    network spike that&#x27;s almost 3 times our normal bandwidth. What is going on
    there?&quot;<p>Turned out paperless was downloading the entire contents of every
    single message in the account it&#x27;s connected to (often GBs of data!) every
    10 minutes. We run ludicrously powerful hardware and give ourselves capacity headroom
    so we could cope, but this was clearly broken behaviour and had the potential
    to impact other users. We added better per-user throttling to deal with it on
    our end, but also made sure that Paperless fixed this, and then wanted to ask
    people who looked like they might be using it to update. It will save you a ton
    of bandwidth and compute too."
  score: 0
