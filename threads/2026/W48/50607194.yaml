  author: flexagoon
  text: I only ever had compatibility issues with podman because of SELinux, since
    it&#x27;s rootless you sometimes have to add the :z suffix to volumes to make
    podman add proper selinux labels to them. Otherwise, I haven&#x27;t run into any
    problems. You can also still run Podman in root mode if you want, in which case
    it will just act like Docker.<p>Podman also has the extra benefit of being able
    to manage everything through systemd units, which I love. It&#x27;s like docker
    compose, but you write the config in systemd files and the containers run as normal
    systemd services integrated with the rest of the system.<p><a href="https:&#x2F;&#x2F;docs.podman.io&#x2F;en&#x2F;latest&#x2F;markdown&#x2F;podman-systemd.unit.5.html"
