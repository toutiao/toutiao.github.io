article:
  url: https://www.docker.com/blog/meet-the-new-docker-built-to-run-on-trust/
  title: 'Meet the New Docker: Built to Run on Trust | Docker'
  fetch_status: success
  content: "# Meet the New Docker: Built to Run on Trust \n\n Posted Nov 19, 2026
    \n\n ![](https://www.docker.com/app/uploads/2026/01/Headshot-Terri-Avnaim.jpg
    \"Posts by Terri Avnaim\")\n\n[Terri Avnaim](https://www.docker.com/contributors/terri-avnaim/)\n\n###
    _Evolving an iconic brand for the agentic era_\n\nToday, [Docker](https://www.docker.com/)
    is officially launching its new brand, and I’m excited to tell you what it’s all
    about and why we think now is the time for change.\n\nLet’s start with the big
    picture. We’re living through a transformative moment: for Docker, for developers,
    for the industry, and quite possibly, for humanity itself. AI is creating possibilities
    that would have sounded like science fiction not long ago.\n\nBut it’s also forcing
    the industry to confront an almost existential question: how do we harness all
    that power and intelligence without compromising security, governance, or control?
    Or, put more simply: how do we get to a point where we can [actually _trust_ agents](https://www.docker.com/blog/manufacturing-trust-for-ai-agents-keynote/)?\n\nThat
    one seemingly simple yet infinitely complex question is why we’re here today,
    introducing you to a new Docker.&nbsp;\n\nA new Docker, but a familiar story.&nbsp;\n\n##
    **We’ve been here before**\n\nOk, not _exactly_ here, but once upon a time, a
    decade or so ago, the tech industry was at a similar inflection point. Digital
    transformation was the term du jour, promising a new way of engaging customers
    and powering the global economy. There was one big constraint, though: teams needed
    a better way to build, ship, and run software consistently across any environment.&nbsp;\n\nEnter
    a company you might have heard of: Docker.&nbsp;\n\nTogether with all of you,
    Docker built the standard [trusted by millions of developers](https://www.docker.com/blog/stack-overflow-survey-2026-ai-agent-trust/).
    For over a decade, developers have relied on us to make software portable, open,
    reproducible, and secure. Docker turned the frustration of “Well, it works on
    my machine!” into the assurance that “Yes, it works everywhere.”\n\nToday, of
    course, the challenge confronting us is new and evolving, and we all need to evolve
    with it. We cannot simply continue to do what we’ve always done and expect to
    succeed in this new era. That applies to business leaders, developers, tech companies,
    everyone. It certainly applies to Docker. That’s what this rebrand is about: evolving
    to meet the moment for our customers.\n\n## **What isn’t changing**\n\nLet me
    be unequivocal: this is not about leaving Docker’s legacy or heritage behind.
    We’ve spent more than a decade earning your trust. This is about building on that
    foundation, not replacing it.\n\nThe qualities you value us for aren’t changing.
    We’re still committed to openness and industry collaboration. We’re still, and
    always will be, developer-first. We’re still fanatical about simplicity, and about
    showing up everywhere you need us.&nbsp;\n\nOn the product front, the containers
    you know and love aren’t going anywhere. Containers still play a huge role in
    the software development lifecycle. As long as that’s the case, Docker will continue
    leading the way.&nbsp;&nbsp;\n\n## **Containers weren’t designed for agents&nbsp;**\n\nAgents
    have introduced a new problem. Containers isolate workloads. But [agents aren’t
    workloads](https://www.docker.com/blog/docker-sandboxes-vs-containers/). Agents
    are actors.&nbsp;\n\nAgents make their own decisions about what to run, what to
    access, and what to change. Developers and enterprises need solutions built specifically
    to isolate and govern them, so they can give those agents real autonomy without
    giving up control.&nbsp;\n\nDocker’s next chapter is about delivering exactly
    that: security, isolation, and governance, so we can all trust agents to do meaningful
    work without feeling like we’re always one step from catastrophe.\n\n## **Run
    on trust&nbsp;**\n\nIn case I haven’t made it blindingly obvious yet, the new
    Docker is all about trust.\n\nTrust Docker because our track record speaks for
    itself. Trust Docker because we’re proven, neutral, and secure. Trust Docker because
    it’s pretty darn clear you can’t trust the agents to manage themselves.&nbsp;\n\nTrust
    us because we have a software supply chain that is already the standard for building
    securely. Trust us because nobody isolates agents where they run better than we
    do. Trust us because we’re taking a comprehensive approach to improving governance
    and minimizing risk across the entire enterprise.&nbsp;\n\nTrust Docker because
    we’re not egotistical enough to think we can solve a challenge this big alone.
    Trust us because everything about our history, our heritage, and our actions over
    the past year tells you we’ll partner with the smartest and build alongside the
    best, and not create vendor lock-in.&nbsp;\n\nMost of all, trust Docker because
    we’re not just talking the talk. We’ve got the goods to back it up: trusted supply
    chain for your agents to build from, trusted runtime to isolate your agents, and
    a trusted ecosystem to ensure all the layers of trust are covered, whether made
    by Docker or not.\n\n## **A whale of an evolution**\n\nAs our product team innovated
    to meet the moment and our messaging in the market began to shift, one thing became
    clear: the speed and scale of evolution happening inside Docker called for an
    equally momentous evolution on the outside. Something that makes it unmistakably
    clear that it’s a new day for Docker. Something that says and shows, loud and
    clear, for all the world to see, that Docker is not just about containers anymore.&nbsp;\n\nSomething
    big.&nbsp;\n\nSomething, dare I say, whale sized.&nbsp;\n\nI’m talking, of course,
    about our beloved Moby.&nbsp;\n\nIf you know Docker, then you know Moby, and if
    Docker is evolving, Moby should too. The only question was to how and to what
    extent? We looked at a lot of whales, folks. (I may or may not have been seeing
    whales in my sleep.) Ultimately, with the help of our friends at the strategic
    brand transformation company, [Motto](https://wearemotto.com/), we landed on a
    new Moby for the new Docker.\n\n ![blog frame](https://www.docker.com/app/uploads/2026/11/blog-frame-2320x957.png
    \"- blog frame\")\n\nWatch Moby’s transformation here:\n\nIn many ways, Moby is
    a microcosm for Docker and the changes we’re making: the Moby you love and trust,
    evolved for a new era. Just as the new Docker is no longer singularly defined
    by containers, neither is the new Moby.\n\n## **Come take a look around**\n\nWe’ve
    got lots to show you. Poke around our [new website](https://www.docker.com). Find
    and engage with the new Docker brand on social media. And if you want to see what
    trust in the agentic era looks like in practice, try [Docker Sandboxes](https://www.docker.com/products/docker-sandboxes/)
    and [Docker AI Governance](https://www.docker.com/products/ai-governance/). We’d
    love to hear what you think.\n\nWherever this new era takes us, Docker will always
    honor and cherish the trust you continue to place in us. Now, let’s go build what’s
    next.\n\n### About the Authors \n\n ![](https://www.docker.com/app/uploads/2026/01/Headshot-Terri-Avnaim.jpg
    \"Posts by Terri Avnaim\")\n\n[Terri Avnaim](https://www.docker.com/contributors/terri-avnaim/)\n\nChief
    Marketing Officer, Docker\n\nTerri Avnaim is the CMO of Docker, where she leads
    global marketing and shapes the company’s positioning and go-to-market strategy
    for the agentic era.\n\n[Agentic AI](https://www.docker.com/blog/tag/agentic-ai/)[Docker](https://www.docker.com/blog/tag/docker/)[Docker
