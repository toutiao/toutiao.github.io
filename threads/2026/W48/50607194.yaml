  text: I am not the commenter but advanced agents are equally capable of manipulating
    an entire VM (or microvm, whatever you want to call it) equally as easily as a
    docker container. There&#x27;s a number of benefits of compartmentalizing something
    inside an entire VM on a real hypervisor platform for security purposes, and being
    able to maintain it, versus using pre-baked docker containers from $vendor. Or
    even use that VM to contain something like a podman container and let the agent
    have the equivalent of sudo on the VM for a specific purpose.
