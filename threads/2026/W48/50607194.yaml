  author: jillesvangurp
  text: Rancher Desktop, colima, podman, etc. take your pick. There are more options
    if you start digging around a bit. If you are on Linux you can run docker natively
    (as well as its alternatives). And if you are on Windows, it comes with WSL2 so
    you can do the same.<p>Docker for Desktop has a pretty UI but it pretty much does
    the same things under the hood as everybody else.<p>I&#x27;m currently using colima
    on my mac and it works great for me. It&#x27;s built on lima so you can also use
    it to manage simple vms. And I like that it&#x27;s a simple open source project
    and not a big company trying to get everybody on their stack. Like Podman which
    is funded by IBM&#x2F;Red Hat. Likewise Rancher seems to have an agenda beyond
    just providing docker. Of course that&#x27;s just my personal view. Other than
    that, it&#x27;s all open source and you can&#x27;t really go wrong with either
    of them. Both have big communities and should be enterprise friendly as well if
    that&#x27;s what you need.<p>Colima has no UI and that actually suits me just
    fine. I could use things like lazydocker if I wanted to but I find I rarely use
    it. In the same way VS Code, Intellij have built in docker uis that work just
    fine with colima as well. But if you mainly just want to run docker, docker-compose,
    or basic kubernetes stuff (via k3s), colima does the job. It&#x27;s a bit more
    hands on maybe. But with AI coding tools that is not much of an issue these days.
    I actually consider that an advantage.
