  author: martythemaniak
  text: I don&#x27;t think the recent spate of math discoveries should be very surprising.
    Consider 10 years ago when AlphaGo beat Lee Sedol, what was really happening there?
    You had an very large search space (all possible Go moves) that humans had been
    navigating by a combination of intuition, trial-and-error and passing knowledge
    between master-student. Then a program was build that could explore that search
    space both from existing searches (AlphaGo) and from scratch (AlphaGo Zero), and
    the program found some interesting results (winning moves no one had thought of
    before).<p>Today&#x27;s LLMs are vastly bigger and they operate in an immensely
    larger search space (all of symbolic representation of the world) using immensely
    more power, and now they&#x27;re finding results in that search space that people
    could not. In both cases, the space-search program needed a way to verify whether
    its results were valid - the Go board in AlphaGo&#x27;s case, and Lean in current
    math work. So it really shouldn&#x27;t be surprising that the space-searchers
    found something people either missed or was too big&#x2F;far away to be accessible
    (that is, it is unknown whether the current RH proof can be simplified and&#x2F;or
    understood like classical human proofs)
  score: 0
