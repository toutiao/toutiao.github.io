  author: Skrillor
  text: Unlikely, from the Lean prover community:<p>The exported raw proof has been
    checked by several proof checkers, including Lean’s official kernel, the con-leche
    and con-ron checkers, and several independent checkers contributed by third parties
    and implemented in different programming languages. The checkers con-leche and
    con-ron come with a formal proof, relative to set theory, that they cannot accept
    a false proof, thus addressing concerns that Lean’s logic itself might have flaws
    that the proof could exploit.<p><a href="https:&#x2F;&#x2F;leanprover-community.github.io&#x2F;blog&#x2F;posts&#x2F;riemann-hypothesis&#x2F;"
