  text: |-
    This is a great writeup, I hope that some of the lessons learned can be leveraged into improving the docs on mediawiki.org. I do fear that some of the issues are potentially self-inflicted (not to shame, it's just a complicated system), e.g. most single-server installs should never need to set $wgCacheEpoch manually.

    Which means the next time a PHP2Shell comes along, the fix is apk upgrade, run.php update, and a php-fpm restart.

    This is great, and the workflow we've also strived to make possible for users of the MediaWiki Debian package. I would expect your work to also benefit a lot of other users, so kudos.

    ...and then break out all of the various extensions that comprise the core system into a proper APKBUILD.

    I don't think this is a good idea tbh. There's a reason MediaWiki bundles these extensions, they're essentially "core" functionality from a user-perspective, even if they are implemented as extensions. And as you noted, it causes extra work on the package maintenance side. In Debian we just ship them all in the main "mediawiki" package.
