  content: "# Held together by spare time\n\n_Reviving wiki.alpinelinux.org during
    PHP2Shell_ · November 21, 2026\n\nIt feels like this month (and last month..)
    has been nonstop chaos. [PHP2Shell](https://en.wikipedia.org/wiki/PHP2Shell) threw
    a nice little grenade into an already busy month, and while that was happening
    a [GitLab RCE took down Alpine's GitLab instance](https://alpinelinux.org/posts/GitLab-security-incident-CVE-2026-97229.html).
    It was a whole thing, and as frustrating as it was, I'm kind of proud to say that
    I got to help respond to the event and write the incident announcement. Ikke did
    all of the real heavy lifting, but it takes a community to keep a distribution
    together. Everything, and I mean everything, is kept together by volunteers lending
    their time and talent with no expectation that there will be a reward for the
    effort.\n\nWe do it because we care for the work being done. Whether it's a critical
    service enabling a community of tens of thousands to distribute [hundreds of petabytes
    of data](https://gist.github.com/ncopa/b1515f99f5efbc82fcc8b15dcc5e1b4f) that
    we call \"Alpine\", or simply enabling a small piece of software to work for personal
    desires. All of it happens because someone cares enough to do the work. I love
    this so much, frankly. It's absolutely flabbergasting what we as a community can
    do with our spare time.\n\nI enjoy giving my time to Alpine Linux, because there's
    a community, and because we can have an outsized impact on the world by collaborating
    together. It's not perfect, but it's rewarding. I think I owe my career to it
    in a sense. I've learned so much by simply raising my hand and being willing to
    give my time and learn a few new things. But there's a limit to how far you get
    on donated time, both personally, and as a project.\n\n## Wiki.alpinelinux.org
    has been languishing a bit\n\nNot in the sense that it wasn't used; it gets tons
    of traffic and contains a treasure trove of useful information that people depend
    on and are excited to contribute to. But between keeping the infrastructure afloat,
    migrating off of Equinix to new sponsored compute, and mitigating the constant
    wave of problems, from scale to RCE, that plague a small engineering team trying
    to serve a massive consumer base, well, it's no wonder that once alice was no
    longer contributing, the infrastructure languished a bit. This wasn't intentional,
    nor was it bad. There simply wasn't spare time to contribute to it.\n\nSo in November
    of last year ikke asked if anyone was interested in lending a bit of spare time
    to fixing that problem. Naturally, I raised my hand, happy to have an opportunity
    to do so.\n\n> 2025-11-13 15:40:43 @ikke Anyone helping with infra that wants
    to help maintaining the wiki?  \n> 2025-11-13 15:57:01 durrendal ikke: I don't
    mind helping out, just let me know what you need done  \n> 2025-11-13 16:10:46
    @ikke durrendal: the wiki is hosted in an LXC container  \n> 2025-11-13 16:18:11
    durrendal that makes sense, it tracks how most everything else is deployed. It's
    mediawiki, so php + a db. Is it using postgres on the backend, and do you have
    it behind traefik or something else?  \n> 2025-11-13 16:22:07 @ikke It uses mariadb
    \ \n> 2025-11-13 16:22:26 @ikke There is an nginx proxy in front  \n> 2025-11-13
    16:22:51 @ikke The database is in a separate container  \n> 2025-11-13 16:26:56
    durrendal That's not bad, seems like a straight forward setup at first glance.
    I use mariadb for my zabbix deployments so that's nice and familiar  \n> 2025-11-13
    16:34:47 @ikke The current setup uses a combination of git submodules and composer
    from what I can tell (alice was the last one taking care of it)\n\n_All IRC timestamps
    in this post are in UTC._\n\nThis was essentially the sum of information I got
    about the wiki; it was all that was really documented. And despite my eagerness
    to jump in immediately and lift it up from whatever state it happened to be in,
    it took time to get access. We had a release to get out. We were fighting to get
    3.23 finished and didn't even get it wrapped up until 12/3/25! So it's no wonder
    that it took until 1/16/26 before I got access to the server itself to start poking
    around and even begin to understand how the deployment was handled.\n\nAnd as
    you can guess by the fact that I'm writing this post in October of 2026, I did
    not get in there and immediately upgrade it and move on.\n\n## I'm never one to
    half-ass something\n\nAnd I think that's important. Even if I'm only giving away
    a limited amount of time, I hate to rush through things without fully understanding
    them. There's just no way I can improve something if I don't have a solid grounding.
    More importantly, I actually really love spelunking inside of old systems other
    sysadmins have set up. Everyone has a unique flair to how they deploy something.
    Enterprise admins end up deploying things in a real textbook manner, and when
    you deal with small businesses it's usually a hodgepodge of \"just get it done\".
    I haven't had a ton of opportunities to spelunk FOSS infrastructure though! What
    I found was interesting in its own right, mostly because I don't think I'd have
    deployed the service this way.\n\nWhat ikke told me was spot on: MediaWiki was
    a git checkout with extensions and skins vendored as submodules inside the repo.
    You could slot in new modules using composer, and as long as you had an appropriate
    underlying PHP version to work with, you were golden. But that was then mixed
    with actual wiki data, like images, all of it lumped together in /var/www. Very
    simple, but not obvious if you'd not dealt with it before.\n\nWhen I got into
    the server, MediaWiki 1.40.0 was running on PHP 8.2 on top of Alpine 3.20, but
    the LocalSettings.php that controlled the wiki was generated under 1.25.3. Just
    to give you a sense, 1.40.0 is from July 2023, and 1.25.3 is from October of 2015!
    It's really neat to get a sense for how long something was tended for. Of course,
    our friends at the Internet Archive have been archiving the Alpine Wiki since
    [April of 2010](https://web.archive.org/web/20100427195607/http://wiki.alpinelinux.org/wiki/Main_Page),
    and based on the main page I can tell you we've been using MediaWiki for a solid
    16 years now, if not longer. I'm positive it's not the same exact server, but
    probably the same-ish data. I [made notes](/static/files/86/README.org) about
    all the little important bits I found, everything from extension inventories to
    known issues and interesting shell snippets I found in the server's history file.
    Anything can be, and is, helpful when you're spelunking. Truthfully, given the
    age of the deployment, the public facing nature of the server, and my relative
    newness to administering MediaWiki servers, I was approaching the problem with
    the utmost caution.\n\nBy the end of February I had MediaWiki figured out, [but
    it wasn't committed until March](https://git.alpinelinux.org/aports/commit/?id=7367609f39c95b464799ca81ea6ae36343d069e2).
    And not to bury the lede, but I mean that in the most me way possible. I went
    through the process of setting up a clone of the staging server in my homelab.
    From there I worked out how to package MediaWiki itself, and then break out all
    of the various extensions that comprise the core system into a proper APKBUILD.
    After packaging it, I was no longer surprised it hadn't been done before. The
    core extension list alone is absurdly long, and all told we use 36 different extensions
    for our wiki, so this isn't even a complete list.\n\n    subpackages=\"\n    \t$pkgname-doc\n
    \   \t$pkgname-nginx:_nginx\n    \t$pkgname-default-extensions:_default_extensions\n
    \   \t\"\n    source=\"https://releases.wikimedia.org/mediawiki/$_pkgvermaj/mediawiki-$pkgver.tar.gz\n
    \   \tmediawiki_nginx.conf\n    \tmediawiki_fpm.conf\n    \t\"\n    \n    # Extensions
    bundled in the tarball that we split into subpackages.\n    # Core/mandatory extensions
    (always shipped with core) are NOT listed here.\n    # Only optional bundled extensions
    that users may want to enable individually.\n    _extensions=\"\n    \tAbuse"
