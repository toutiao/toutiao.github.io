    Well the wiki has been around since about at least 2010, possibly a little earlier than that. SSG's weren't really mainstream at that point, but mediawiki had 8 years of development and support by that point.
    Plus the intent of the wiki was to give the community a space to collaboratively document the distribution. Wiki's are really great for this specific use case, you don't need to worry about knowing git, or how to make a merge request, etc. All you need is a login and to write prose.
    We do use SSGs for our main site and blog, hugo and antora depending where you look; so we're not opposed to this. It's just a different tool for a different job.
