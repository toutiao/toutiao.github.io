    The rest were the kind of thing that just ate time, and they make for a pretty dull story. $wgMainCacheType = CACHE_ACCEL needs php83-pecl-apcu, and opcache doesn't count.

    Opcache just handles (automatic) code caching, APCu handles (application opt-in) data caching.
