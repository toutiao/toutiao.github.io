  author: magnio
  text: 'No one gives a shit how much care driver takes, only how common they cause
    accidents and how severe the injuries are. If wearing seatbelts increases accidents
    by 20% (which is a wild assumption already) but decreases injuries by 50% then
    that&#x27;s worth it.<p>Same with coding: no one cares if you abstain from ASan
    and UBSan if the end result has no memory safety bug. Unfortunately, times and
    times and times and times again have shown that thinking &quot;I just need to
    write perfect C code&quot; does not help reduce memory safety bugs, while using
    Rust does.<p>Why? Because making a Rust program with more intricate memory access
    rules compile is way way more annoying than in C. This is intended.<p>&gt; That
    the lanuage does technically offer a statistical safety advantage provides no
    assurance against foot-gunning<p>The zero-cost memory safety provided by Rust
    is enforced by the compiler restricting all kinds of foot-gunning, sometimes even
    stupidly (unlike in GC languages where the GC just cleans up all the bullet wounds).
    Saying Rust let users foot-gun themselves easily is one thing, but saying it&#x27;s
    easier to foot-gun in Rust than in C is unfathomable.'
