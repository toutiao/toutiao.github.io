    don&#x27;t have a solution, I&#x27;m not sure there is a good one ATM (several
    replies with “just throw your own AI at the pile!” suggestions no more fleshed
    out then “draw the rest of the owl” in 3… 2… …), but the ignoring admitting defeat
    and not processing security reports can&#x27;t be a good option. This is why the
    slop reports are such a big issue: they hide the better reports (be they entirely
    human made, AI assisted, or mostly AI driven with good human review).<p>There
    always were crap bug reports, of course, but human slop comes in much more slowly
    than fully automated AI slop so doesn&#x27;t take nearly as much effort to process.<p><i>&gt;
    complaining without doing the obvious: […] signal to users that you simply cannot
