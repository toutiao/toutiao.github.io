  author: loup-vaillant
  text: 'I sense a false dilemma here.  Thinking very hard isn&#x27;t the only alternative
    to compiler-enforced memory safety. We can also use easier methods: <a href="https:&#x2F;&#x2F;www.dgtlgrove.com&#x2F;p&#x2F;untangling-lifetimes-the-arena-allocator"
    rel="nofollow">https:&#x2F;&#x2F;www.dgtlgrove.com&#x2F;p&#x2F;untangling-lifetimes-the-arena-a...</a><p>In
    my experience over 90% of C&#x2F;C++ developers are basically unaware of alternatives
    to fine grained allocation with malloc()&#x2F;free() or new&#x2F;delete.  Many
    have heard of pool allocators, but they almost invariably see it as something
    even more complicated or tricky, applicable only in high performance code (meaning,
    not theirs).  Very few have heard of arena allocation as a way to massively simplify
    lifetime management.<p>Now OK, temporal memory safety isn&#x27;t the only problem.  But
    it is the costliest and most difficult to solve at the language level.  So imagine
    a langage that only helps with spatial memory safety (systematic bounds checks
    in debug or release-safe modes), <i>and</i> their programmers stick to the simpler
    allocation schemes like arenas.<p>It won&#x27;t get rid of all the memory vulnerabilities.
    But it may very well get rid of enough of them that they cease to be a priority.  It
    might even be a better tradeoff overall than a borrow checker or even a better
    <i>security</i> tradeoff, depending how much friction the borrow checker adds.<p>On
    the other hand, we should not underestimate the productivity boosts of strict
    static analysis, most notably type systems: I have experienced first hand the
    advantages of being told with ruthless precision why my pathetic attempt at a
    program didn&#x27;t deserve to be even started.  It&#x27;s a tighter feedback
    loop than even a REPL (though I like it best when I have both), and speeds us
    up in many cases, including exploratory programming.'
