  text: "<i>&gt; just keep whatever pace you want, and signal to users that you simply
    cannot follow up the pouring of security issues</i><p>Unfortunately security is
    the one thing no one can afford you to skimp on. Something that allows a successful
    exploit, especially with RCE holes that can allow an exploit to spread itself
