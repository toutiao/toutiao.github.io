  title: "“A government that ‘gets it’”: Canada recommits to federal funding for news
    | Nieman Journalism Lab"
  fetch_status: success
  content: "# “A government that ‘gets it’”: Canada recommits to federal funding for
    news\n\nThe new budget would make a local reporting program permanent and extend
    a 35% tax credit on newsroom salaries. The support makes “a massive, massive difference.”\n\n
    ![](https://www.niemanlab.org/images/AdobeStock_299790306-scaled.jpeg)\nParliament
    Hill in Ottawa, Ontario\n\nBy [Sarah Scire](https://www.niemanlab.org/author/sscire/
    \"Posts by Sarah Scire\") Nov. 12, 2026, noon \n\nA Canadian program to place
    local reporters in underserved communities has lived from renewal to renewal.
    Publishers who relied on the Local Journalism Initiative [couldn’t be sure](https://www.cbc.ca/news/federal-funding-journalists-expire-1.7116950)
    whether the money would be there again.\n\nThat [changed last week](https://www.niemanlab.org/2026/11/its-either-this-or-death-frankly-canada-renews-the-local-journalism-initiative-and-extends-journalism-tax-credit/)
    when Canada proposed a federal budget that would make the Local Journalism Initiative
    permanent. The 2026 budget would [increase LJI funding](https://budget.canada.ca/2026/report-rapport/chap4-en.html)
    to $134 million over four years with $41 million in annual ongoing funding after
    that. (Figures are, naturally, in Canadian dollars.) For the budget to be finalized,
    [it must pass Parliament](https://www.reuters.com/world/americas/economists-urge-fiscal-restraint-canadian-budget-despite-oil-windfall-2026-11-05/).
    With Prime Minister Mark Carney’s party in the majority, it’s expected to.\n\nExpanding
    the LJI is not even the biggest piece of federal help for newsrooms, according
    to [Paul Deegan](http://linkedin.com/in/paul-deegan-11764ba?), president and CEO
    of the news industry advocacy group [News Media Canada](https://nmc-mic.ca/).
    The same budget extends a 35% tax credit on newsroom salaries through 2028 and
    [opens it to radio and television newsrooms](https://www.nationalobserver.com/2026/11/06/news/ottawa-boosts-journalism-tax-credit-501m-extends-eligibility-broadcasters)
    for the first time. The tax credit will cost $501 million over the next five years,
    according to the budget. Thanks to the [Online News Act](https://www.parl.ca/legisinfo/en/bill/44-1/c-18),
    Canadian newsrooms also get funding from Google. And then there’s Canadian investment
    in public media; the 2026 budget [added $300 million over two years](https://cbc.radio-canada.ca/en/media-centre/2026-federal-budget-investment-in-public-service-media)
    to CBC/Radio-Canada “to strengthen its capacity to meet the evolving needs of
    Canadians across the country.”\n\nI asked Deegan: How did Canadian publishers
    secure so much federal funding for news?\n\n“We have a government that ‘gets it,’”
    Deegan said. “They see what Big Tech monopolists have done to local news. They
    know the labor tax credit is the leading driver of maintaining and growing newsroom
    headcount.”\n\n[RELATED ARTICLE](https://www.niemanlab.org/2026/10/californias-big-local-news-bill-becomes-law/?relatedstory)\n\n[California’s
    big local news bill becomes law](https://www.niemanlab.org/2026/10/californias-big-local-news-bill-becomes-law/?relatedstory)\n\n[Laura
    Hazard Owen](https://www.niemanlab.org/2026/10/californias-big-local-news-bill-becomes-law/?relatedstory)\n\n[October
    1, 2026](https://www.niemanlab.org/2026/10/californias-big-local-news-bill-becomes-law/?relatedstory)\n\nThere
    have been [similar proposals](https://www.niemanlab.org/2023/07/federal-aid-for-local-news-gets-a-makeover/)
    and experiments in the United States, including [a new tax credit in California](https://www.niemanlab.org/2026/10/californias-big-local-news-bill-becomes-law/).
    But Canada is much further down the road. The country can offer lessons on what
    it looks like when a federal government commits to supporting journalism.\n###
    “The tax credit is the big one”\n\nThe labor tax credit refunds 35% of a newsroom
    employee’s salary, up to [$29,750 per journalist per year](https://budget.canada.ca/2026/report-rapport/tm-mf-en.html).
    The percentage had been scheduled to fall to 25% at the end of 2026.\n\n“In terms
    of employing the [largest] number of journalists and keeping newsroom employment
    stability, the labor tax credit is number one,” Deegan said.\n\nThere’s also the
    [Online News Act](https://www.parl.ca/legisinfo/en/bill/44-1/c-18) which has brought
    in [$100 million of Google money](https://www.cbc.ca/news/entertainment/google-online-news-act-exemption-1.7422690)
    annually. Of that amount, $63 million is set aside for news publishers. (Meta
    [blocked news on Facebook and Instagram](https://www.niemanlab.org/2023/08/canada-will-remove-legit-news-from-facebook-and-instagram-but-may-leave-the-least-reputable-stuff-behind/)
    in Canada rather than pay under the Online News Act.) Publishers receive [around
    $17,000](https://www.ctvnews.ca/business/article/google-sends-funds-to-journalism-collective-in-exchange-for-online-news-act-exemption/)
    per journalist per year.\n\n“That’s about $47,000 per journalist per year from
    those two measures,” Deegan said. “That just makes a massive, massive difference.”\n\nIn
    the U.S., some ideas for funding local journalism have been [criticized as helping
    large chain newspapers](https://www.niemanlab.org/2025/02/a-new-public-policy-agenda-has-a-vision-for-local-news-for-the-people/)
    — including chains [that have](https://www.niemanlab.org/2023/03/the-scale-of-local-news-destruction-in-gannetts-markets-is-astonishing/)
    [hollowed out local newsrooms](https://www.theatlantic.com/magazine/archive/2021/11/alden-global-capital-killing-americas-newspapers/620171/)
    for years. Deegan — whose news industry group counts [Postmedia](https://www.postmediasolutions.com/en-ca/brands)
    and [Torstar](https://www.torstar.ca/) as members — acknowledged that the largest
    share of tax credit dollars goes to the largest employers.\n\nBut News Media Canada
    also represents small and digital-only publications, and Deegan noted the smallest
    Canadian outlets face another problem. To qualify for the tax credit, an organization
    must produce original news content and regularly employ at least two journalists
    “at arm’s length” from its owners. An advisory board [found the second rule excludes
    small “mom-and-pop” newsrooms](https://www.canada.ca/content/dam/cra-arc/serv-info/tax/business/topics/corporations/advisory_board_annual_report_2025-2026_final.pdf).\n\n###
    Reaching the underserved\n\nThe Local Journalism Initiative is a more targeted
    program than the tax credit. Launched in 2019, [it was designed to support local
    and community news in underserved areas](https://www.niemanlab.org/2020/05/in-canada-a-government-program-to-support-local-news-tries-to-determine-whos-most-deserving).
    The LJI program supports about 470 reporting positions in roughly 1,000 communities
    across Canada.\n\nEven generous government subsidies have not stopped losses in
    local news completely.&nbsp;But early results showed the LJI [increased reporting
    capacity and local news](https://www.canada.ca/en/canadian-heritage/corporate/publications/evaluations/evaluation-local-journalism-2022/summary.html)
    in “news poverty” communities with limited local news offerings. The same evaluation&nbsp;identified
    reaching “news deserts” — communities with no existing local news outlets — and
    Indigenous communities as obstacles.\n\n“Since LJI is demand driven, funding allocation
    across the country varies and gaps remain in some areas, such as news deserts,”
    the report reads. Later, the report notes that allowing news startups “could better
    support attraction and retainment of journalists” in the neediest communities.\n\nMany
    of the newsrooms receiving the LJI funding are small. Deegan described family-owned
    weekly newspapers with circulations as low as 800. Funding provides a local journalist
    to report on “cops, courts, city hall, and the school board.”\n\n“Without those
    LJI journalists in some of those communities, those things simply wouldn’t be
    covered,” he said.\n\nSome underserved communities, particularly in northern Canada,
    struggle t"
