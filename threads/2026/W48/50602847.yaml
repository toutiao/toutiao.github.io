    my point. That&#x27;s why it&#x27;s stupid to put into the calculations. They
    are mixing average sin taxes (notoriously paid by outliers) with median income
    - median to median would be the way to do that.<p>My broader point is that comparing
    the two is non-sensical since the methodology is different. Same concept, different
    numbers. The US number is done by &quot;divide the most authoritative figure for
    total tax collections by the most authoritative figure for the nation’s income.&quot;
    according to the Tax Foundation. The Fraser Institute does it differently, and
    includes things like contributions to the pension plan, and then adjusts it for
    tax brackets on average income. It also cites a range of dates depending on where
    you live since taxes are very different across the country. The US Tax Foundation
    does not do that despite there being significant differences in taxation from
    state to state, further reinforcing that they are not comparable.<p>They are fun
    little novelty numbers published by independent lobbying think tanks in each country,
    not serious tax burden analysis for comparing like with like.
