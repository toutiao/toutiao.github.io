  text: The date you are citing for Canada is the Fraser Institute&#x27;s tax freedom
    day. They are a right wing lobbying think tank and have been extensively criticized
    for their methodology on this.<p>It is not comparable in methodology to the US
    number since it includes upstream taxes not paid directly by individuals and assumes
    an income significantly higher than the median. E.g. It estimates that the average
    family has a tax bill of $2k per year on liquor, tobacco and gambling as one egregious
    example. Not total spend, they think the average family is paying $2k on sin taxes
    (that would be $13k worth of alcohol per family, or about ten drinks per day per
    household at retail prices.). They have been known to include things like resource
    extraction levies in the personal taxes, which are levies that industry pays to
    the government when they extract government owned natural resources.<p>In other
    words it is thinly veiled propaganda.<p>If you want to know how much tax Canadians
    pay in comparison to Americans there are effectively infinite tax liability calculators.
    Until you get into the $250k brackets it is within a few points.<p>Half your pay
