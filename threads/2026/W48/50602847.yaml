  text: You are incorrect. Here are some examples:<p>Healthcare - public administrative
    overhead is typically 1.5-3%. Private admin costs are 12-15%. They also have to
    spend on marketing, which public healthcare does not. Search for data from Kaiser
    Family Foundation (KFF), the Congressional Budget Office (CBO), and the Medicare
    Trustees.<p>Municipal broadband - consistently offers lower prices and faster
    speeds with lower latency, when Ookla speedtest numbers were evaluated.<p>Electricity
    - Econometric analyses of U.S. Energy Information Administration (EIA) data (including
    work by UC Berkeley’s Department of Economics) show that privately owned utilities
    charge on average 3.8% to 13% higher retail electricity rates than publicly owned
    utilities. Private electric companies experience twice as many outage minutes
    than public energy utilities.<p>Water, rail, sanitation, transportation, and many
    other sectors show similar results.
