  author: Animats
  text: "This is in theory true, but almost all the machines for which pointers were
    not integers have died out. There were a lot of them during the 16 to 32 bit transition,
    the Intel 286 being the best known. There were tagged machines, such as Burroughs
    mainframes and Symbolics LISP machines, but those are mostly forgotten.<p>Where
    this is likely to bite today is on machines where some memory is shared between
    processors, and some isn&#x27;t. That&#x27;s non-uniform memory access.<p>That
    takes us back to banked memory. We see this most commonly when GPU memory is exposed
    to the CPU, but there are Intel processors which support multiprocessor mixed
    shared and non-shared access. Linux apparently supports this.\nPointer arithmetic
    between pointers from different banks is not meaningful.<p>The general safe rule
    is that, at some level, something allocates memory, and it returns something for
    which arithmetic is valid only on a part. There may be suballocators, as with
    Vulkan. Vulkan has an allocator for big blocks, and applications then need an
    allocator which subdivides those big blocks.<p>This leads to slices. If a slice
    is safe, a subslice is also safe. \nIf all operations are on slices, you&#x27;re
    good. That&#x27;s the Rust philosophy.<p>Historically, slices came very late.
    If someone had thought of slices in the 1970s, they probably would have been in
    C, which would have eliminated most of the need for pointer arithmetic. Slices
    are just bounded pointer arithmetic, really. That C lacks slices is the underlying
    cause of many headaches."
