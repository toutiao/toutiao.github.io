  author: c_engineer56
  text: For example, Arm Memory Tagging Extension uses the top byte of a 64-bit address
    to store a tag that the CPU verifies against the allocation tag on pointer dereference.
    If the tags don&#x27;t match, an exception occurs. MTE makes exploiting memory
    vulnerabilities more difficult by preventing the attacker from generating valid
    pointers to hijack program control flow with. To bypass MTE, the attack would
    need to combine the exploit with an info leak or arbitrary memory read to set
    the correct tag for a new pointer.<p>On a MTE enabled system, adding an offset
    to a pointer cast to integer will result in an exception with high probability
    since the new pointer will be using the tag for the old address.<p><a href="https:&#x2F;&#x2F;docs.kernel.org&#x2F;arch&#x2F;arm64&#x2F;memory-tagging-extension.html"
    rel="nofollow">https:&#x2F;&#x2F;docs.kernel.org&#x2F;arch&#x2F;arm64&#x2F;memory-tagging-extension....</a>
