  text: From C23 (N3220), compare<p>&gt; 6.3.2.3 Pointers<p>&gt; A pointer to void
    may be converted to or from a pointer to any object type. A pointer to any object
    type may be converted to a pointer to void and back again; the result shall compare
    equal to the original pointer.<p>and<p>&gt; 7.22.1.4 Integer types capable of
    holding object pointers<p>&gt; The following type designates a signed integer
    type, other than a bit-precise integer type, with the property that any valid
    pointer to void can be converted to this type, then converted back to pointer
    to void, and the result will compare equal to the original pointer:<p>&gt; intptr_t<p>intptr_t
    is not like other integer types. It has special properties and guarantees that
    other integer types might not, even when they&#x27;re the same width.<p>And I
    think your interpretation about dereferencing may be ruled out by 6.5.10p7:<p>&gt;
    Two pointers compare equal if and only if both are null pointers, both are pointers
    to the same object....<p>That is, if they compare equal and one is a valid object
    pointer then the other is a valid object pointer, regardless of whether it was
    round-tripped through intptr_t&#x2F;uintptr_t.
