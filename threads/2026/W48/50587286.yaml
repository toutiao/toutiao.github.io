  author: sparkie
  text: I think it&#x27;s quite clear.<p>&gt; An integer may be converted to any pointer
    type. Except as previously specified, the result is implementation-defined, may
    not be correctly aligned, may not point to an entity of the referenced type, and
    can produce an indeterminate representation when stored into an object.<p>That
    isn&#x27;t to say we can&#x27;t do the cast - compilers specify the behavior,
    and most modern architectures have a linear virtual address space where the round
    trip is valid - though it may not <i>always</i> be - for example, with the fs&#x2F;gs
    segment registers - a cast of pointer to integer isn&#x27;t just a simple conversion
    of type - it must also fetch the value from the FS register and offset the pointer
    by this to produce an integer containing the absolute address. This is entirely
    implementation defined.<p>Producing the absolute virtual address of a `thread_local`
    is potential UB though - if you attempt to dereference it in a different thread.<p>Another
    example would be casting a qualified pointer (const, restrict, volatile) to an
    integer, then back to a pointer with a different qualifier or no qualifier - then
    dereferencing such pointer would of course be UB as per the standard - the cast
    to `intptr_t` loses information about its qualification - but the pointers would
    still compare equal - as the standard guarantees that a pointer cast to a qualified
    pointer compares equal.
