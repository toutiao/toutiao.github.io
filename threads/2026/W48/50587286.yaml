  author: tialaramex
  text: 'Quite some time after this blog was written Aria blogged about the &quot;strict
    provenance experiment&quot; for Rust, and today Aria&#x27;s API (more or less)
    is sanctioned and Rust is defined to deliver the behaviour Aria described in the
    Tower of Weakenings.<p>Here&#x27;s the Rust documentation: <a href="https:&#x2F;&#x2F;doc.rust-lang.org&#x2F;std&#x2F;ptr&#x2F;index.html#strict-provenance"
    rel="nofollow">https:&#x2F;&#x2F;doc.rust-lang.org&#x2F;std&#x2F;ptr&#x2F;index.html#strict-provenan...</a><p>So
    in Rust much of this is spelled out today, although of course the LLVM backend
    still miscompiles some programs (in Rust or indeed in C or C++) because it can
    be tricked into giving integers provenance even though that&#x27;s clearly not
    what anybody wanted. Oops.<p>However in C, which most of the examples are written
    in, the status is a bit less clear. Martin Uecker (who can often be found here
    in HN&#x27;s comments) and colleagues wrote a document for ISO but that document
    is not (yet?) part of the ISO C standard itself. Of course in practice compilers
    like LLVM, GCC and MSVC need to do what the document says instead of making it
    up as they go, or else this matters very little.<p>One thing which cannot be in
    doubt in any of these close-to-the-metal languages today, almost certainly including
    obscure ones you&#x27;ve maybe taken a shine to like Odin or Hare, is that provenance
    is a thing, if you&#x27;re sure you don&#x27;t have pointer provenance in your
    languages but you do have actual pointers, check with a stop watch. If your programs
    in that language are very slow you might be right.<p>Because that&#x27;s why this
    became a thing. Without provenance, pointers strangle many &quot;obvious&quot;
    optimisations. Add provenance and now these optimisations are available and your
    programs go much faster. It&#x27;s a bargain - albeit one you probably never signed
    up for as a programmer.'
