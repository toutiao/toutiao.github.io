  text: C abstract machine is from 1989 and also wants to be compatible with machines
    like a VAX or microcontrollers with Harvard architecture from back then.<p>x86_64
    is useful and widespread maybe because it is so easy to use like pointers are
    just integers and because the IBM PC was cheap back in the day and still is affordable
    today.  And backwards compatibility just like Java.<p>Itanium was not backwards
    compatible and died almost immediately.<p>For better or for worse, C tries to
    run on all kinds of hardware that is obscure <i>today</i>.  Like one&#x27;s complement
    or sign-magnitude integers.  This is why no C or C++ library will ever have decent
    bounds checked arrays.<p>And back in 1989 it was decided that coming from a PDP-11
    and faced with this &quot;anything goes&quot;.  Until compiler writers used UB
    to intentionally break SSL, everything looked fine.  We are still learning from
    this.<p>One problem with overflow safer languages on LLVM is that LLVM IR was
    originally designed for C++ and some NULL pointer UB weirdness or signed overflow
    weirdness specific to C was baked into LLVM&#x27;s IR at the lowest level.<p>As
    long as we do this it will be horrible.  No escape hatch to <i>sane</i> behaviour.  Except
    for people to skip all the UB by writing assembly for random proprietary microcontrollers.
