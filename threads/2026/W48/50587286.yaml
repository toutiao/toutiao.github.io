  text: "&gt; So your interpretation would also necessarily imply the standard doesn&#x27;t
    guarantee you can dereference such a pointer.<p>It&#x27;s not the same argument
    because the type in this case is still a pointer (which is not strictly an integer).<p>The
    standard is quite clear about conversion between pointers and integers.<p>&gt;
    An integer may be converted to any pointer type. Except as previously specified,
    the result is implementation-defined, may not be correctly aligned, may not point
    to an entity of the referenced type, and can produce an indeterminate representation
    when stored into an object.<p>&gt; Any pointer type may be converted to an integer
    type. Except as previously specified, the result is implementation-defined. If
    the result cannot be represented in the integer type, the behavior is undefined.
    The result is not required to be in the range of values of any integer type.<p>The
    purpose of `intptr_t` is to solve that last issue: it&#x27;s an integer type sufficiently
    wide to hold a pointer, so that the result is in the range of values held by the
    intptr_t - and thus the round trip compares equal to the original pointer - but
    there&#x27;s nothing else specified in the spec about intptr_t solving the other
    issues outlined in these clauses."
