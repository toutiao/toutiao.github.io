  author: sparkie
  text: You can interpret it as uintptr_t - particularly now that the latest C standards
    require two&#x27;s complement representation of integers - but pointers on amd64
    are more like signed ints.<p>The sign bit must match the highest bit of the virtual
    address (47th bit counting from 0 in the case of 4LP, or the 56th bit for 5LP).
    (And without LAM&#x2F;UAI, all the bits in between must match too.)<p>Eg, with
    4LP, if you cast a pointer to `uintptr_t`, shift it left 16 bits, then shift right
    16 bits - then an address in the higher half (usually in the Kernel) would be
    non-canonical. Do the same for `intptr_t` it will be canonical because the shift
    right is an arithmetic shift.<p>On other architectures this isn&#x27;t the case.
    I know AARCH64 for example does not use canonicalization. If you were doing the
    same shift left&#x2F;right by 16 as above on AARCH64, you&#x27;d want a uintptr_t.
