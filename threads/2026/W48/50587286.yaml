  author: sparkie
  text: If you convert a pointer to `intptr_t`&#x2F;`uintptr_t` and back again to
    a pointer, the standard only guarantees that it compares equal to the original
    - but it makes no guarantee that you can dereference that pointer.<p>For example,
    if you had a system with segmented memory, you could cast a pointer used in one
    segment to `intptr_t`, change the segment register, then attempt to cast back
    to a pointer and dereference it, which of course is UB.<p>Pointers are not merely
    bit vectors. Their representation depends on architecture, and there&#x27;s no
    guarantee that they even have an integer representation (intptr_t&#x2F;uintptr_t
    are optional) - and even if they do have an integer representation, there&#x27;s
    no guarantee that this is a complete enough representation to use the pointer
    - eg, with the segmentation example above - the `intptr_t` does not contain the
    segment information.<p>The examples work as one would expect because they&#x27;re
    being run on a system with a single linear virtual address space, where pointers
    <i>can</i> be represented by an integer. The compiler for such platforms may specify
    what behavior is to occur in these cases - but the C standard does not.
