  author: quelsolaar
  text: The argument that this is valid defined C is not entirely correct. You can
    not subtract one pointer form another that doesn&#x27;t come from the same allocation,
    that is explicitly UB. But the user here subtracts one integer from the other
    and that is valid. However C only guarantees you can you can convert a integer
    to a valid pointer, if that integer has been converted from a pointer, and not
    been modified in any way. If the integer has been modified its implementation
    defined what happens. Its no longer valid standard C.<p>C supports pointers that
    can have memory banks, or pointers that are consist of a hash and and an offset.
    Real world hardware architectures like CHERI does this and standard C supports
    this. In hardware like that, this would break, even if the subtraction is done
    on integers, and don&#x27;t violate the no subtraction of pointer of different
    allocation rule. So no, Pointers are really not integers, even if they may look
    like integers on your machine.<p>E (Member of the wg14 memory model study group.)
