  text: Arguably they&#x27;re more like signed integers in the case of amd64 - due
    to address canonicalization. Eg, with 4-level paging we have a 48-bit address
    space, and valid pointers have the signed integer values `-2^48..+2^48-1`.<p>They
    can be further complicated by UAI&#x2F;LAM, which relaxes the canonicalization
    constraints and allows bits 48..62 (the  high bits, excluding the sign bit) to
    be anything - so we can have pointers that compare unequal but point to the same
    address - a potential source of exploits (There&#x27;s already been Spectre-like
    vulnerabilities shown for LAM). Fortunately nobody really uses LAM - it needs
    enabling by the kernel to be used in user space to begin with.
