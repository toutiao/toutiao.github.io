  content: |-
    One minute

    ## Install

    BUI Charts is a set of components for BUI. Run this command below to use it in your project.

    Terminal

    cargo add --git https://github.com/ppmpreetham/BUI blenderui bui-charts

    Two minutes

    ## Your first chart

    A chart is a component. Write it in rsx! like any other tag, style it with class, and feed it from your own state. When the signal changes, the chart redraws.

    src/dashboard.rs

    use blenderui::prelude::*; use bui_charts::*; #[derive(Clone, PartialEq)] struct Reading { temperature: f64, load: f64, } #[component] fn dashboard() { let readings = use_signal(vec![ Reading { temperature: 18., load: 32. }, Reading { temperature: 24., load: 51. }, Reading { temperature: 31., load: 77. }, ]); rsx! { <div class="flex flex-col gap-4 p-4"> <XYChart data={readings} class="h-72"> <Series name="Load" x={|r: &Reading| r.temperature} y={|r: &Reading| r.load} /> </XYChart> <BarGauge data={readings} value={|r: &Reading| r.load} class="h-16" /> </div> } }

    Good to know

    ## What every chart shares

    Orientation

    ## How these docs work

    There are 7 base charts, the ones everything else is built on, and 73 derived charts that can help you visualize your data.

    Since there are a lot of charts, here are a few pages you should probably visit next:

    Pick a door

    ## Or just start with one of these
