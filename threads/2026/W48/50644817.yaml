  author: koliber
  text: Same here. I am commenting with the hope that someone from 1Password sees
    the number of comments supporting local-only vaults.<p>I understand that it cuts
    into the subscription model as the justification for paying a monthly fee is weaker,
    but THIS IS IMPORTANT. 1Password&#x27;s centralized storage is a liability.<p>The
    argument that they throw more resources at security than I can is valid, but makes
    up only part of the risk equation. For someone to attack me, they would need to
    pick me among the sea of others and dedicate resources to breach my defenses.
    It would probably be easier than breaching 1Password&#x27;s defenses. However,
    their bounty would be the passwords of 1 person.<p>If they manage to breach 1Password&#x27;s
    defenses, they have access to passwords of MANY users. 1Password is a much juicier
    target than me. That tilts the risk equation significantly for me. Over time,
    it will become even more so.<p>I will not opt for centrally stored passwords for
    as long as I can.
