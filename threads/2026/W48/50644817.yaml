  author: loginatnine
  text: 'They&#x27;re of course light on the exact details but there are multiple
    ways this can be bypassed :<p>- If there&#x27;s an external coding agent (copilot
    can be properly setup), if you can invoke `@codex` in a pull request to open a
    new pull request, you can then approve this agent-generated PR and merge it without
    human oversight<p>- If you don&#x27;t have the &quot;review the last reviewable
    commit&quot; activated, someone can find an old unmerged but approved PR, add
    something in it and merge<p>- If you don&#x27;t have the &quot;dismiss previous
    approvals on push&quot; setup with codeowners, if you have access to a github
    app with write access to the repo, you can find an old unmerged PR, push changes,
    use the app to approve your PR and merge (this can be protected by having a ruleset
    that require a review from at least 1 human with a team that does not contain
    the bots&#x2F;app)<p>- If you&#x27;re a GitHub repo admin, the ruleset might allow
    you to merge without review<p>- If you&#x27;re a GitHub organization admin, you
    can disable rulesets, merge, and reenable them right away, making the attack very
    sneaky. Or just exclude your target repository.<p>- If users have the possibility
    to create blank repositories, then you can commit directly to main branch on the
    first commit, even though you have a ruleset that mandates pull requests. This
    works because the branch does not exist yet.<p>- If users have the possibility
    to create branches, a user can create a malicious protected branch, bypassing
    restrictions for the same reason as the previous point. Example : your ruleset
    protect `main` and `master` for backward compatibility. If user can create branches,
    they can push to a `master` branch on a repo where `main` is the main branch,
    bypassing restrictions.<p>There are multiple ways to get it wrong in GitHub and
    most people are not aware of these tradeoffs.'
  score: 0
