  text: That report is from 10 years ago and the findings while real were minor in
    the scheme of things. They were generally mitigated by a complicated attack paths
    or other co-requirements (e.g. having to hit &quot;browse to site&quot;, and the
    remote site isn&#x27;t using HSTS, and there&#x27;s an active MITM underway).<p>When
    you look at actual, real-world attacks 1password holds up fairly well because
    of solid design and polish:<p>- Use of PAKEs for auth<p>- The Secret key as 2FA
    (compared to breakable email&#x2F;sms for others)<p>- UI patterns that discourage
    unsafe use (like autofill on a non-registered domain)<p>You can find reports like
    that for every mainstream vault and if KeePass were reviewed by the same standards
    it would not hold up well (in particular, browser integration &#x2F; phishing
    resistance are much worse for it). Most of the DIY implementations you will find
    in this thread are using worse synch methods with weaker auth than what 1pass
    uses.
