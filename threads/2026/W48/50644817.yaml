  author: tptacek
  text: 'This is the single most important attack vector for SAAS companies. It has
    been for a long time --- this is the standard fact pattern for every SAAS breach
    --- but much more so today. As the number of employees grow, the likelihood that
    one of their laptops will get compromised approaches 1. When that happens, the
    attacker will be able to push code to Github, and if that code gets deployed,
    you&#x27;re owned.<p>In 1Password&#x27;s case, the absolute worst-case catastrophe
    is mitigated by the fact that customers retain custody of their unlocking secrets;
    1Password (at least in the normal product flows) simply doesn&#x27;t hold it.
    But an attack like this implicates every catastrophe short of that worst case.<p>Change
    velocity in 2026 is unreal and that trend is going to continue. You could not
    outcompete 1Password by building a handcrafted artisanal password manager backend
    (witness all the commercially successful password managers that don&#x27;t even
    share 1Password&#x27;s customer secret custody model). You have to accept insane
    PR rates as a premise to do modern SAAS security.<p>So the question then becomes:
    what is review? It&#x27;s not what r&#x2F;programming assumes it is; you almost
    certainly can&#x27;t literally have a team of people line-by-line reviewing PRs
    anymore, at least not across the whole codebase (you can and should probably do
    a threat model for your codebase and institute stuff like that on a case-by-case
    basis, though). What you can realistically expect to review for is change provenance;
    a human developer signoff of some sort. But it&#x27;s tricky! The attacker owns
    your email during the window of attack.<p>I think this is a fun problem to noodle
    on, and someone could probably come up with something here that would make a real
    difference.'
