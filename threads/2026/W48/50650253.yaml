  content: "# Sydney fire ant infestation more serious than first thought, government
    says\n\n- [\n\nTopic:Invasive Species\n\n](/news/topic/invasive-species)\n\nPosted
    , updated \n\n![Dead brown ants in green grass and dirt](https://live-production.wcms.abc-cdn.net.au/1fb4a369ab7a3473a01459f68d67919b?impolicy=wcms_crop_resize&cropH=1234&cropW=2194&xPos=0&yPos=114&width=862&height=485)\n\n_A
    fire ant nest was found in Auburn on Monday. (ABC News: Timothy Ailwood)_\n\nAuthorities
    are ramping up efforts to manage a fire ant nest in Sydney after investigations
    revealed a larger and more complex infestation than first identified.\n\nA nest
    detected in Auburn was successfully treated at the weekend, but further surveillance
    has revealed a more extensive presence of fire ants requiring intensive treatment
    and a broader biosecurity response.\n\nIt comes after Commonwealth authorities
    detected the insects, known for their painful sting, at the Enfield Intermodal
    Logistics Centre, in Sydney's inner west, on September 23.\n\nImported goods are
    suspected to be the source of both incursions, which are not otherwise believed
    to be connected.\n\nNSW Agriculture Minister Tara Moriarty said a task force was
    being established to determine the ants' origins.\n\n![NSW Minister for Agriculture
    Tara Moriarty](https://live-production.wcms.abc-cdn.net.au/d0b43fe6243f3ec4cf09369caa5e0c79?impolicy=wcms_crop_resize&cropH=5461&cropW=8192&xPos=0&yPos=0&width=862&height=575)\n\n_Ms
    Moriarty says the infestation is more complex than first thought. (ABC News: Floss
    Adams)_\n\n\"The experts believe that they came in through containers that have
    come in likely from China,\" she said.\n\n\"At this stage, they are still only
    on this particular site in Auburn, but we will undertake further surveillance
    … to see if they have spread.\n\n\"I was able to check [the Auburn site] out myself
    yesterday, and even though the area is not geographically big, the types of ants
    that we have here do spread in a different way than what we've seen ants do in
    New South Wales.\"\n\nMs Moriarty said the Auburn infestation was located in an
    industrial area and included businesses that imported goods from Asia and elsewhere.\n\n##
    Management efforts underway\n\nA biosecurity order is expected to be issued by
    Friday to regulate the movement of high-risk materials through Auburn, including
    soils, turf, mulch and building materials.\n\nAdditional biosecurity officers
    and detection dogs will also be deployed as part of the response.\n\n![A brown
    and white dog in green grass with people in hi-viz tops](https://live-production.wcms.abc-cdn.net.au/363cee55b0256030c0aa3daf7ad83202?impolicy=wcms_crop_resize&cropH=3131&cropW=4696&xPos=0&yPos=0&width=862&height=575)\n\n_Detection
    dogs were deployed in Auburn on Monday. (ABC News: Timothy Ailwood)_\n\nMs Moriarty
    said there had been more than 900 reports of suspicious nests from the public
    recent days, and asked locals to remain on the lookout for infestations.\n\n>
    \"Biosecurity is everybody's responsibility,\"\n\n  she said.\n\nThe ants are
    up to 6 millimetres long, dark reddish-brown with brown-black abdomens and are
    known to be aggressive.\n\nBites that have a burning sensation can cause itchy
    blisters or pustules and lead to the hospitalisation of children and death in
    severe cases.\n\nIf spotted, the nests must not be destroyed and members of the
    public are urged not to try to capture the ants, which are classified as prohibited
    matter in NSW.\n\nSuspected fire ants can be reported to the Biosecurity Helpline
    on 1800 680 244."
