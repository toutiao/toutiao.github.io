  author: Jedd
  text: We (AU) got varroa mite - that&#x27;s the one that&#x27;s likely responsible
    for honeybee colony collapse most other places on the planet - 4 years ago.  There
    was a year of concerted effort to track, trace, and destroy hives &amp; nests
    wherever it was found, but after a year or so we moved to a &#x27;management&#x27;
    phase, which was sad, but likely inevitable.<p>We <i>think</i> this arrived somewhere
    in NSW, and tracing certainly suggests that.<p>Latest (maybe a month ago) that
    I heard was the rise of treatment-resistant mites, which should have taken a lot
    longer to appear, suggest varroa may have been with us for a while before that
    (though obviously almost no one would have been using those treatments during
    that intervening time ... or would they?).<p>Point being, AU&#x27;s coast is huge,
    and the number of international ports is non-trivial, and like everywhere else,
    we have a surfeit of idiots.<p>One of our primary detection systems for varroa
    were sentinel beehives maintained near the various ports, and frequently checked
    for pests. The bait program is probably a similar prophylactic (I&#x27;m speculating)
    and likely one of a range of detection programmes in place.<p>(For varroa, it
    didn&#x27;t help us as it looks like a bee package was imported directly, rather
    than accidentally catching a ride on a container ship.)
