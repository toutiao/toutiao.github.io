  author: vintermann
  text: Probably almost everyone played some form of &quot;make believe&quot; as a
    child. Where you pretend you&#x27;re something you&#x27;re not, mostly <i>inside</i>
    your head and for your own enjoyment (i.e. the point wasn&#x27;t to try to convince
    your playmate that you are a Pokemon, but more to feel like one yourself.)<p>I
    don&#x27;t know if you remember, many probably forget as they age up, but <i>this
    was fun</i>. As adults, we simply don&#x27;t have the imagination to play like
    that, even though we might have liked to. Or maybe the issue isn&#x27;t so much
    imagination as identity - as healthy adults, our identity is fairly settled, we
    know who and what we are and it feels kind of wrong to deny it.<p>But some people
    want to keep playing anyway. Maybe they just have a good imagination. Or, a bit
    more worrying, they have a less settled sense of identity. Either way, I think
    this is acceptable. Fine, even. This is the lens I view &quot;Furriness&quot;
    through, along with two adjacent subcultures with big overlap which I won&#x27;t
    name. Let people play. Stay in touch with your playful, childish side.<p>But also,
    you understand why playing this way with actual children is absolutely not OK.
    It&#x27;s not even about sexuality (an adult trait which we usually neither can
    nor want to give up), it&#x27;s about letting actual children be actual children,
    and not tools to let us live out our childish sides. Childish exploration and
    play with identity must NOT be polluted by adult exploration and play with identity.
    Children need you to be an adult, in order to get to be children. Even in play.<p>I
    think most furries understand that perfectly well.<p>But this whole thing is completely
    different from normal adult relationships. That &quot;thing&quot; does not have
    to be normalized, and no one is enjoying the magical thrill of make believe. So
    your comparison makes zero sense.
