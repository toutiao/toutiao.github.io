  text: Interesting that none of them chose chimpanzee or dolphin, which, as far as
    I&#x27;m aware, are generally considered the most &quot;intelligent&quot; animals
    next to humans. Perhaps chimpanzee is too similar to human. I associate &quot;clever&quot;
    with fox and crow a little more strongly than &quot;intelligent&quot;. I guess
    I also associate &quot;empathetic&quot; or &quot;altruistic&quot; with dolphin,
    alongside &quot;intelligent&quot;. Maybe it is some distillation of the general
    consensus in human writing (or at least, general... desire?), that LLMs are non-feeling,
    stoic entities, rather than ones that are more curious or playful.<p>The whole
    other big thing is obviously foxes and crows are two of the main animals used
    to depict the trickster archetype. I guess more raven than crow, but they are
    similar. The trickster isn&#x27;t &quot;evil&quot;, it can bring change, creation
    (or destruction), and expose hidden truths. But in allegories, the trickster typically
    accomplishes this through taboo behavior, including thievery (like maybe stealing
    the entire corpus of human writing?!).<p>Finally, the moth is completely different.
    Flying towards the light.
