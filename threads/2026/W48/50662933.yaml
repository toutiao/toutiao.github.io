  author: rattynm
  text: 'I don&#x27;t think me arguing my case will change your mind, but here goes.<p>I&#x27;ll
    preface this by saying the furry community is very big, and as with any big, open
    community there will be some drama or fucked up thing <i>somewhere</i>. I don&#x27;t
    know where the whole diaper thing is coming from, nor what &quot;trash a conference
    center&quot; is. Yeah, that probably happened at some point. But do know these
    get condemned <i>hard</i> within the community, same for abuse cases. Since they
    tend to make good clickbait and engagement for The Algorithms:tm:, these get visible
    outside the community, vs the many more threads about the more wholesome parts
    of furry stuff.<p>Finger-pointing and anecdotal evidence of &quot;weird shit happened
    in XYZ&quot; and projecting it on top of a whole community that is as diverse
    as furries isn&#x27;t fair. All I&#x27;ll say is there are still hundreds of furry
    conventions per year and the vast majority of them go extremely well and remain
    on good terms with their venues (e.g. the amount of furry conventions that stay
    at the same venue year over year).<p>For what it&#x27;s worth, furries are usually
    perfectly normal members of societies. Just look for those &quot;asking furries
    at conventions what they do in life&quot; videos, and you&#x27;ll be surprised
    at the sheer amount of software engineers, IT folks, people in the military, people
    in leadership positions at large companies, etc. I don&#x27;t know the exact &quot;why&quot;
    on this. To me, it&#x27;s a great way to escape daily life - but daily life is
    still very much a thing you have to care about. It&#x27;s like going to a football
    game with friends to just yell at whichever team scores point. You just unplug
    your brain for a while and get to enjoy something nice. It&#x27;s a <i>hobby</i>
    first and foremost, it&#x27;s a hobby that a lot of us enjoy and identify with
    a lot, much like you would put video game or anime stuff on your personal page.<p>It
    is true that the furry fandom is very welcoming to neurodivergent and queer people,
    and people who generally struggle with social anxiety. It&#x27;s a safe space
    for self-expression, which I hope I don&#x27;t have to argue is a good thing.
    That still doesn&#x27;t mean &quot;anything goes&quot;. Consent is important,
    enforced and reminded at basically all furry events. It&#x27;s just nice to have
    a place where you can be yourself, especially when so much of adult life is spent
    conforming to what <i>other people want you to be</i>. It&#x27;s an outlet.<p>I
    don&#x27;t understand the gradient part to be honest with you. You can definitely
    be &quot;just interested in the art&quot; (or the sex part) and that&#x27;s fine.
    It&#x27;s just that being a furry is generally something that gets hidden, primarily
    out of fear and for not wanting to get assaulted - or getting too much unneeded
    attention on Hacker News (<i>ahem</i>). It&#x27;s a lot like queer&#x2F;LGBT culture
    in general, especially a few decades ago, where the only way to &quot;signal yourself&quot;
    without attracting unwanted attention was &quot;dogwhistles&quot;, like the hanky
    code. It&#x27;s very &quot;if you know you know&quot; in spirit, and it applies
    to the furry community too specifically because of how much drama, controversy
    and FUD gets thrown at us by the mainstream media or gets seen by random laypeople
    via social network algorithms. You can&#x27;t just go out there and be like &quot;oh
    hey I&#x27;m a furry!&quot; due to the stigma around it, <i>especially</i> in
    chronically online circles. Honestly all of this is true of any subgroup that&#x27;s
    &quot;niche&quot; enough. For example, it&#x27;s not literally written on someone&#x27;s
    forehead whether they like anime or not.<p>This is also changing rapidly too.
    I think a lot of the points are a bit &quot;old school drama&quot; from the past
    decade. We&#x27;re seeing a lot more positive exposure to furry stuff. A lot of
    &quot;newer&quot; furries appear because they saw someone dancing in fursuit on
    TikTok or Instagram Reels, went &quot;huh, that&#x27;s cool&quot;, and discover
    what this whole &quot;furry&quot; thing is about from there. And this is <i>not
    forced</i> at all by us, it&#x27;s just the &quot;regular furry stuff&quot; that&#x27;s
    extremely normal in the community breaching containment and getting shown to people
    who aren&#x27;t in the fandom, instead of the usual drama and pointing-at-that-one-weird-thing-that-happened-once.<p>Also,
    the reason why furry conventions are so prevalent is because it&#x27;s a fantastic
    community of extremely kind, creative and interesting people. There&#x27;s no
    other way to see other furries than through things like meetups and conventions.
    It&#x27;s not like being a fan of football or soccer where you can just &quot;go
    to the next game&quot; and see like-minded people - you have to create these opportunities,
    hence the conventions.<p>&gt; Its like with everything: you do coke or other drugs
    and now you are a drug person. It starts slow and then it is part of your life&#x2F;identity.
    Its a lot harder and more effort to do certain things sometimes and not going
    to rise into it.<p>Please realize that you are comparing psychoactive drugs that
    are known to create dependencies to... a hobby. Sure some people let their hobby
    take a huge space in their day-to-day life, but it&#x27;s nowhere near as bad
    as drugs.<p>All of this to say. The thing that trips people up is the sexual part.
    It&#x27;s a sex-positive environment, yes, and that&#x27;s probably how most people
    stumbled into discovery furry stuff, especially before the Tiktok &#x2F; Instagram
    era. But it&#x27;s done in a way that is healthy, considerate (there are strict
    rules on what gets a pass or not at events like conventions), with consent being
    at the cornerstore of everything.<p>The most important bit is: it&#x27;s not <i>just</i>
    the sex part. Hell, I&#x27;d argue it&#x27;s mostly everything else (the art,
    the self-expression, the cosplaying, the sheer display of creativity, the kindness
    and openness) that keeps folks in, with the adult side being an extra thing that&#x27;s
    openly accepted but clearly compartmentalized. You stay in because you make friends,
    and because you get to have the most earnest conversation you have ever had in
    your entire life with an extremely kind dude wearing a cartoon fox head. It&#x27;s
    not for everyone, it&#x27;s silly, it&#x27;s ridiculous, it&#x27;s &quot;not what
    adults should be doing&quot;. But it&#x27;s still very worth it for us.'
