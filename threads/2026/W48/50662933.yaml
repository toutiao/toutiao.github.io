    responded by granting Wayne&#x27;s wish.<p>Furry as its own thing seems to have
    diverged sometime in the 1980&#x27;s with the advent of Usenet and with the subsequent
    publishing of Rowrbrazzle&#x27;s first issue after Vootie circulated its last
    issue, but that&#x27;s less clear.<p>&gt; This is a fact, not a judgement.<p>Calling
    something a fact doesn&#x27;t make an empirical generalization factual.<p>I can&#x27;t
    opine on the rest."
