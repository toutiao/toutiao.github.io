  author: adrian_b
  text: For about 3 decades I have been using both Linux and FreeBSD.<p>I use Linux
    on all my desktop and laptop computers. Besides personal computers, I use Linux
    on some computational servers with GPUs, which have adequate software support,
    e.g. CUDA, only for Linux.<p>In the past the main advantage of Linux was in supporting
    a much greater range of hardware devices, but in recent years Linux has introduced
    more and more features that are much better than what POSIX specifies, for instance
    io_uring, so if you write Linux-specific programs you can get much better performance
    than with generic UNIX programs.<p>I use FreeBSD on my servers that have networking
    or storage functions (e.g. I have my own routers&#x2F;firewalls and e-mail&#x2F;web&#x2F;DNS&#x2F;NTP
    servers). In the now distant past, FreeBSD had much better performance than Linux,
    but then it lost several years with a very slow transition from single-threaded
    CPUs to multi-threaded CPUs, during which Linux leaped ahead, and then FreeBSD
    never recovered completely the lost advantage.<p>Nonetheless, I still prefer FreeBSD
    in many servers, because it requires much less administration work than Linux
    (i.e. there are better default configurations and many of the administrative utilities
    are simpler and more logical, so you get done faster any management work; sometimes
    years may pass during which I do nothing else for the FreeBSD servers, except
    reading the periodic automatic e-mail reports from the servers about significant
    events and statistics).<p>Moreover, while Linux supports many peripherals that
    are not supported by FreeBSD, there still are some peripherals that have better
    support in FreeBSD, e.g. tape drives and other SAS&#x2F;SCSI peripherals.<p>So
    in my opinion it is better to be familiar with both Linux and FreeBSD and use
    whichever is more appropriate for a given application.<p>For someone without experience
    in server administration, installing and configuring one of the *BSD operating
    systems is much more likely to result in a server with acceptable performance
    and safety, than when installing some Linux distribution, where one would need
    to be much more knowledgeable to make the correct choices.<p>On the other hand,
    installing a *BSD on a modern laptop is much less likely to work immediately,
    without fiddling for hours or even days with various options, until making most
    of the peripherals to work.
