  author: bityard
  text: I&#x27;ve heard people express this occasionally over the course of a couple
    decades, but I still don&#x27;t think I agree.<p>Yes, at the time, BSD was a fantastic
    OS, built by left-coast academic hippies trying to free Unix from its corporate
    shackles for education and research.<p>But Linux gained popularity early on (in
    my opinion) precisely because it was new and ambitious and had an obvious way
    for anyone to contribute their bug fixes and features. I arrived a few years after
    the first release but I very clearly remember the excitement around Linux was
    less, &quot;you can run a Unix-like OS on your home computer,&quot; and more,
    &quot;we are building a free OS for everyone, come join us.&quot; Running a Unix
    derivative or clone on a PC was not that rare by the mid 90s. But being able to
    contribute easily to a whole new OS that was also simultaneously being worked
    on by thousands of other hackers around the world certainly was new. And the fact
    that the kernel and most of the userland was GPL meant that it could never be
    taken away from us by commercial interests.<p>There was a LOT of early excitement
    around Linux. People created their own distributions, set up IRC channels, put
    up Linux fan pages and tutorials. They worked on documentation. They started Linux
    user groups and went to conventions to nerd out with fellow hackers. It all felt
    pretty counter-culture at the time.<p>I&#x27;m not entirely convinced BSD would
    ever have had that level of enthusiasm. It did not have as good an underdog story
    (&quot;Norwegian kid creates free OS in his bedroom&quot;) and mostly worked already.<p>BSD
    was fine, but Linux was fun.
