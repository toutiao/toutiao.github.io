  content: "Welcome back to another round of [Simple Sudoku Solvers](https://blog.veitheller.de/sss/)!
    If you are unfamiliar with the series, I suggest you start with [the first post](https://blog.veitheller.de/Six_Simple_Sudoku_Solvers_I:_Python_(Reference).html)
    or by perusing [the backlog](https://blog.veitheller.de/sss/). Last time, in [assembly](https://blog.veitheller.de/Simple_Sudoku_Solvers_SIII,_EII:_Assembly.html),
    we told the CPU exactly what to do, one instruction at a time. Today we go one
    level lower and build the machine directly in Verilog.\n\nVerilog is a hardware
    description language. You don’t write a program that will at some point run on
    hardware. Instead, you describe a circuit, and the compiler turns that description
    into gates and flip-flops. We’ll run it in a simulator, because I don’t have a
    Sudoku chip lying around (future work), but the solver is real hardware in the
    sense that a synthesis tool accepts it and tells us how many gates it would take.
    Still counts, even with sim2real TBD.\n\nThe solver is about 145 lines, plus 40
    lines of ceremony to feed it a puzzle and print the result. You can run it with`iverilog
    -o sudoku sudoku.v && vvp sudoku`, using [Icarus Verilog](https://github.com/steveicarus/iverilog).
    I didn’t test it anywhere else. As always, [the code is on GitHub](https://github.com/hellerve/sudoku).\n\n##
    Why Verilog?\n\nSeason three is about solvers, specifications, and constraints,
    and somehow also about hardware and the lowest of low levels. That’s because hardware
    is possibly the purest version of a specification (and, to be quite honest, because
    I felt like it).\n\nSo, what’s cool about Verilog?\n\n- **Everything happens at
    once.** In most solvers so far, we looped over the 81 cells one after the other
    or wrote the constraints that will then execute a loop-like structure for us.
    In hardware, we do away with the loop. Instead, we use 81 copies of the same circuit
    that all compute their result in the same clock cycle. Sounds weird? We’ll get
    there!\n- **Time is a first-class citizen.** Nothing happens “next” unless a clock
    edge fires, and we’ll have to decide what our solver does each cycle, which turns
    our recursive search into a state machine (surprisingly new to us!).\n- **There
    is no recursion and no heap.** Every bit of memory is an explicitly conjured flip-flop.
    Backtracking needs a stack, and we’ll have to build it ourselves, much like in
    [Forth](https://blog.veitheller.de/Simple_Sudoku_Solvers_SII,_EIII:_Forth.html).\n\nI
    think this was the strangest episode so far, for me. I don’t mean that in a bad
    way.\n\n## A quick primer on reading Verilog\n\nIf you’ve never read Verilog before,
    here is what you need for this post.\n\nA `module` is a circuit with inputs and
    outputs.`wire [8:0] x` is a bundle of nine wires, numbered 8 down to 0. `reg`
    is a bit of a misnomer: it’s a value we assign in a procedural block, and whether
    it becomes an actual register is actually dependent on our usage of it.\n\nThere
    are two kinds of blocks we care about. `always @*`describes combinational logic.
    Its outputs are a pure function of its inputs, and they change whenever the inputs
    do. Think of it as a very big expression.\n\n`always @(posedge clk)`, on the other
    hand, describes sequential logic. It runs once at every rising clock edge, and
    the`<=` assignments inside it all happen together at the end of that edge. That’s
    where all our state lives.\n\n`for` loops exist, but in synthesizable code they
    are unrolled completely. A loop over 81 cells is 81 copies of its body. Keep that
    in mind, it will matter. It’s also very cool, so it’s worth keeping in mind anyway.\n\n##
    The board\n\nThe board is the same 81 cells as always, but since hardware doesn’t
    really do arrays of bytes, it is one 324-bit vector, with four bits per cell and
    `0` for an empty cell:\n\n    module sudoku (\n      input wire clk,\n      input
    wire start,\n      input wire [323:0] puzzle,\n      output reg done,\n      output
    reg solved,\n      output reg [323:0] board\n    );\n\nWe have three input wires
    and output `reg`s (remember, not necessarily registers). That’s the whole interface
    of our chip.\n\nWe put a puzzle on the `puzzle` wires, hold`start` for one cycle,
    and wait until `done` goes high (think in currents). Then, if `solved` is set,`board`
    has the answer. Otherwise, the board is unsolvable.\n\nReading a cell is a slice,
    which we wrap in a small function.\n\n    function [3:0] at(input [323:0] b, input
    integer i);\n      at = b[4 * i +: 4];\n    endfunction\n\nSlices work like in
    many other languages, except that the operators`+:` and `-:` encode a direction
    from the start index. Here, we say “start at `4 * i` and take the next`4` bits”.\n\nUnits
    are the 27 rows, columns, and boxes we always care about. We describe them with
    a function that tells us which cell is the`k`-th member of unit `u`:\n\n    function
    [6:0] member(input integer u, input integer k);\n      if (u < 9) member = u *
    9 + k;\n      else if (u < 18) member = k * 9 + (u - 9);\n      else member =
    ((u - 18) / 3) * 27 + ((u - 18) % 3) * 3\n                              + (k /
    3) * 9 + k % 3;\n    endfunction\n\nThe first 9 are the rows, then come the columns,
    and the icky expression at the end there is the box arithmetic with our usual
    set of magic numbers.\n\nFun fact: this looks like it does division at runtime,
    but it doesn’t. We only ever call it with constants from unrolled loops, so the
    synthesis tool computes all of it ahead of time (much like an optimizing compiler
    would). What is left is just the wiring, and the box arithmetic decides which
    wires connect.\n\n## Bitty digits\n\nLike in many previous installments, we track
    digits as bitmasks. And like in our assembly episode, when it’s convenient we
    use the trick where digit `d` lives in bit `d`, and an empty cell lands in bit
    0, which we throw away:\n\n    function [8:0] bit_of(input [3:0] d);\n      reg
    [9:0] wide;\n      begin\n        wide = 10'b1 << d;\n        bit_of = wide[9:1];\n
    \     end\n    endfunction\n\nIn hardware this is a decoder, four wires in, ten
    wires out, one of them lights up. Dropping bit 0 is just not connecting it. We
    don’t need a branch, and in this case not even an instruction. These sorts of
    tricks are annoying the higher up the stack we go, but they come naturally to
    us when we’re thinking in circuits and currents.\n\nWe also need the opposite
    direction, from a single bit back to a digit, and a popcount:\n\n    function
    [3:0] digit(input [8:0] onehot);\n      integer d;\n      begin\n        digit
    = 0;\n        for (d = 1; d <= 9; d = d + 1)\n          if (onehot[d - 1]) digit
    = d;\n      end\n    endfunction\n    \n    function [3:0] popcount(input [8:0]
    m);\n      integer b;\n      begin\n        popcount = 0;\n        for (b = 0;
    b < 9; b = b + 1)\n          popcount = popcount + m[b];\n      end\n    endfunction\n\nWe
    are back to having to write our own popcount, regretfully, but it doesn’t have
    to be smart. It’s a chain of adders in the end, unrolled by our magical synthesis
    tool again.\n\n## Everywhere all at once\n\nThis is where Verilog differs from
    everything else we’ve done!\n\nThe following block is combinational. Every clock
    cycle, it looks at the whole board and computes, for all 81 cells at the same
    time, everything the solver could want to know.\n\nFirst, the units:\n\n    always
    @* begin\n      for (u = 0; u < 27; u = u + 1) begin\n        seen[9 * u +: 9]
    = 0;\n        clash[u] = 0;\n        for (k = 0; k < 9; k = k + 1) begin\n          clash[u]
    = clash[u] | |(seen[9 * u +: 9] & bit_of(at(board, member(u, k))));\n          seen[9
    * u +: 9] = seen[9 * u +: 9] | bit_of(at(board, member(u, k)));\n        end\n
    \     end\n\nThat’s quite a few symbols, but it almost looks familiar I think.\n\nFor
    each of the 27 units we `or` together the digits it contains into `seen`. While
    we do that, we check if a digit was already there, and if so, the unit has a `clash`.
    No other solver in the series has needed this check so far, and you’ll see in
    a minute why we need it now. Hint: it has to do with the parallel nature of the "
