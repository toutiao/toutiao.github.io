  author: vintermann
  text: It&#x27;s true. I think the big, big problem with OCR, and HTR in particular,
    is that people don&#x27;t agree what a good solution is, and most of the answers
    have obvious &quot;featherless biped&quot; issues. There is for instance a relatively
    common opinion in HTR circles, <i>which I can&#x27;t for the life of me understand</i>,
    that if the writer forgot to dot his i&#x27;s and cross his t&#x27;s, then that
    should be transcribed as (Turkish dotless i) and l. This is so ingrained that
    even the large general purpose multimodal LLM which are best at HTR (Gemini),
    a lot of the time ignore explicit instructions to <i>not do that</i>.
