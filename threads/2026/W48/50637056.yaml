  url: https://greydanus.github.io/2026/11/12/pengpt/
  title: 'PenGPT: A Generative Transformer for Handwriting and Sketches'
  fetch_status: success
  content: "A small transformer that writes and sketches from text. The effort was
    80% data, 15% speed and 5% architecture: my first project that follows the Bitter
    Lesson.\n\n ![](/assets/pengpt/hero_v4.png)\n**Left.** One phrase in the hands
    of 21 writers who were held out of training. The model read one to three real
    words by each of them and carried on in their hand. **Right.** Drawings from typed
    prompts. I picked these by eye from the best third of the samples; there are unpicked
    ones further down. \n\n[Read the paper](/assets/pengpt/pengpt.pdf)[Get the code](https://github.com/greydanus/pengpt)[Download
    weights](https://github.com/greydanus/pengpt/releases)\n\nLast year Zach Wimpee
    and I trained a tiny GPT to [write cursive](/2025/03/30/cursive-transformer/).
    It worked but it only knew one hand (mine) and it learned from 3,500 words that
    I wrote on a trackpad.\n\nSo here’s the obvious next question: can one small,
    ordinary transformer learn to hold a pen in lots of hands and draw as well as
    write? PenGPT is my attempt. There are two models. A 6M-parameter one writes print
    and cursive and picks up the handwriting of someone it has never seen from a few
    of their words. A 54M-parameter one draws from a text prompt.\n\nThen I took the
    thing apart to find out why it works. The answer wasn’t what I expected.\n\n##
    How it works\n\n ![](/assets/pengpt/overview.png)\n The whole recipe. Pen points
    snap to a grid (b) so a word becomes a walk in eight directions plus pen-down
    and pen-up. Byte-pair encoding merges common runs of moves into tokens (c): this
    \"world\" goes from 156 moves to 47 tokens. Everything else is a plain decoder
    that cross-attends to what it's told. \n\nThat’s it for the modality-specific
    part: ten symbols and a merge count. The same tokenizer handles handwriting and
    drawings. For handwriting the model is told the text; for drawings it’s told a
    SigLIP 2 vector so a typed phrase can stand in for a picture.\n\n## The data\n\nAlmost
    nobody records pen strokes so I made the handwriting data from scans: 495,590
    words by 1,255 writers, mostly from two research collections plus old letters
    and diaries from public archives. A vision-language model finds legible pages
    and transcribes them, the pages get cut into words, InkSight traces each word
    back into strokes and a set of checks throws out bad traces. Between a third and
    a half of the words survive.\n\nThe drawings are 477,670 sketches from ten public
    datasets. Quick, Draw! has 50 million and I kept the best 0.5%. I’m not releasing
    the datasets but the paper’s appendix explains how to build them.\n\n ![](/assets/pengpt/writers_plain.png)\n
    Every writer the model knows, saying hello. Each one is placed by its learned
    vector, with print on the left and cursive on the right. Nobody told the model
    which was which. Color is the source the pages came from. \n\n## Training a model\n\nI
    compared PenGPT with older approaches then changed one thing at a time and retrained.
    Here are the rows I found most interesting; the paper has the rest.\n\n| Handwriting
    | Score change | Style rank | Legible |\n| --- | --- | --- | --- |\n| Graves-style
    LSTM, same tokens | +0.029 | 2.2 | 49% |\n| ScribeTokens BPE, 60x the vocabulary
    | −0.001 | 1.9 | 53% |\n| PenGPT | 0.716 | 1.9 | 54% |\n| A tenth of the data
    | +0.050 | 3.0 | 47% |\n| No augmentation | +0.028 | 2.0 | 52% |\n| One word per
    sequence | +0.009 | 6.0 | 52% |\n| No pen position | +0.001 | 1.9 | 52% |\n| No
    BPE merges | −0.010 | – | 55% |\n| Twice the parameters | −0.004 | 1.9 | 55% |\n|
    Real ink | | | 66% |\n\n| Drawings | Score change | Matches label | Matches caption
    |\n| --- | --- | --- | --- |\n| sketch-rnn-style LSTM, same tokens | +0.049 |
    40% | 20% |\n| Trained on Quick, Draw! only | +0.002 | 74% | 37% |\n| PenGPT |
    0.591 | 76% | 43% |\n| No augmentation | +0.013 | 4% | 6% |\n| No pen position
    | +0.008 | 74% | 40% |\n| Half the layers, half the width | +0.022 | 62% | 31%
    |\n\n Rows above the line are comparisons with other approaches; rows below it
    each change one thing about PenGPT. Score is nats per pen move on held-out data,
    lower is better; the base rows vary by about 0.001 between seeds. Style rank is
    how well the model tells whose hand it is continuing (1 is perfect, 8.5 is chance).
    Legible is how often an OCR model reads a sampled word exactly. The drawing columns
    are how often SigLIP 2 picks a drawing's own prompt out of a few hundred.\n\n**Data
    and how you show it.** Those are the big rows. Cut the data and everything gets
    worse. Drop augmentation and the drawing model stops following its prompts entirely.
    Train on one word at a time and the model can no longer pick up a hand: style
    rank goes from 1.9 to 6.0.\n\n**The clever parts barely register.** Telling the
    model where its pen is does nothing for handwriting. The BPE merges I was proud
    of make the score slightly _worse_; they buy speed (sequences are 3.2x shorter)
    and that’s all. A vocabulary sixty times larger changes nothing. Doubling the
    model changes nothing.\n\n**Even the transformer is optional, sort of.** An LSTM
    on the same tokens is a bit behind on handwriting and still picks up new hands.
    On drawings, where sequences are several times longer, it falls well behind.\n\n##
    Samples\n\nEnough tables. Here’s what the two models make.\n\n ![](/assets/pengpt/styles.png)\n
    Forty-eight of the 1,192 hands it trained on. The top two rows are sampled greedily
    so the differences there are all the writer. Further down the temperature rises
    and the letters loosen. \n\nThe drawing model takes a few controls besides the
    prompt. One of them is how much ink to use.\n\n ![](/assets/pengpt/sketch_samples_v1.png)\n
    Six prompts, with more ink requested from left to right. The house gains a door,
    then windows, then a chimney and the racket's strings turn into a cross-hatch.
    At the far right the model has run out of parts to add and starts going over its
    own lines. \n\nIt can also draw some things it was never shown as long as a blend
    of two familiar ideas will do.\n\n ![](/assets/pengpt/ood.png)\n Prompts that
    appear nowhere in the training data, one family per row: a face or legs on an
    object, wheels and wings, hats and ears and one thing shaped like another. I picked
    these from several tries each. None of them depends on word order, which turns
    out to matter (see the end of the post). \n\n## Picking up a new hand\n\nThe trick
    is almost embarrassingly simple. Each training sequence holds up to four words
    by one writer. That teaches the model that later words look like earlier ones
    so at sampling time you hand it a few real words and it keeps going. No style
    encoder, no fine-tuning. That’s how the 21 hands at the top of this post were
    written.\n\nIt also works from a photo. There are no strokes in a photo so I trace
    a few of its words with InkSight and fit one new writer vector to the traces,
    with the rest of the model frozen.\n\n ![](/assets/pengpt/photo_hands.png)\n Two
    hands learned from photos: a letter by the poet Sara Teasdale and a paragraph
    someone printed on a NIST form in 1989. From the top: the photo, words found in
    it, the model's copy of those words and new text in that hand. The printed copy
    keeps \"genera\", a word the cutting step clipped. The model copies what it's
    given. \n\n## Reading the letters\n\n ![](/assets/pengpt/heads.png)\n What the
    cross-attention heads read. **(a)** A few heads in layers 3 to 5 lock onto one
    position: this letter, the next letter or both. **(b)** Silencing the \"this letter\"
    head costs more than any other. **(c)** That head stepping through \"letter\"
    and \"toward\" as the pen writes them. Look at the t: it gets read twice, once
    for the stem and again for the cross and in cursive the cross doesn't come until
    the word is finished. \n\nOne head in layer 4 puts 81% of its attention on the
    letter being written. I looked for heads that specialize in cursive or print and
    found none; every head reads the same positions in both.\n\n## Do you need captions?\n\nCaptions
    are the expensive part of the drawing data. Since SigLIP puts pictures and text
    in the same space, maybe you co"
