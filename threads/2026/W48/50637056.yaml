  author: samgreydanus
  text: Author here.<p>Using a less fine grid was huge for getting the compute time
    down (and thus the iteration &#x2F; debugging time down - ultimately to about
    5 minutes). This helped me try a lot of different things.<p>Finer grid -&gt; quite
    a lot more tokens per stroke -&gt; more longer context -&gt; more compute (increasing
    nonlinearly).<p>So I pushed it to the coarsest grid I could get away with. Light
    post-processing can actually remove the grid artifacts pretty easily, so that
    can be added if needed. In the future I&#x27;ll probably just train my FINAL model
    on a slightly finer grid.<p>Thanks for the feedback
