  author: joefourier
  text: While I agree with you about the importance of data, ironically, it seems
    you forgot to apply the bitter lesson to where it was more critical. As others
    brought up (see the thread with @NitpickLawyer) there&#x27;s an obvious tell from
    the wobbliness of the slanted lines, most likely due to the grid quantisation
    (you can see it in the wobbly sketches too). This is in fact injected human knowledge,
    as opposed to working with raw pixels or raw vectors from hand strokes, and no
    amount of data could work around that bottleneck.<p>This is something that I&#x27;ve
    seen happen very often with machine learning practitioners. You cannot add more
    data to fix bad pre-processing. LLMs are limited by the BPE tokenisation (hence
    why early models couldn&#x27;t count r-s in strawberry), diffusion models will
    produce illegible small text if their VAE isn&#x27;t good enough, and audio classifiers
    will be bottlenecked no matter how much data you feed them if everything gets
    turned into a low resolution, single STFT window mel spectrogram.<p>Short of training
    a model on subatomic particles, you will <i>always</i> be injecting human knowledge
    into the model simply by choosing how you are preparing your data.
  score: 0
