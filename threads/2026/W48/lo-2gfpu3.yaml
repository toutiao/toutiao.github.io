  content: "# Garage v2.6.0 released with web admin, v1.x EoL & other news \n[\n\n](/blog/
    \"Back to blog posts\")\n\nPublished on\n\n 8 min reading time 1416 words \n\n_We
    are glad to announce the release of Garage v2.6.0 that includes a brand-new web
    administration UI funded by NLnet. We also discuss many other small news: Helm
    chart repository release, Garage v1.x EoL, Garage v3.0.0 beta 1 and an outlook
    on upcoming work on S3 versioning._\n\n* * *\n\nThe Garage project has been quite
    active lately, so we thought it would be a good time to write a blog post to present
    new features and give some information on what's coming next.\n\n## Garage v2.6.0
    and the web administration GUI\n\nThis is the culmination of almost two years
    of work by [Tixie Salander](https://guerilla.studio/). We started this collaboration
    in 2024 when it was clear that a user interface was one of the most sorely lacking
    feature of Garage. We are very grateful that NLnet has again engaged with us and
    provided funding to make this a reality.\n\nHere's a minimal example to test 2.6.0
    right away:\n\n    cat > garage.toml <<'EOF'\n    metadata_dir = \"/var/lib/garage/meta\"\n
    \   data_dir = \"/var/lib/garage/data\"\n    db_engine = \"lmdb\"\n    replication_factor
    = 1\n    rpc_bind_addr = \"[::]:3901\"\n    [s3_api]\n    s3_region = \"garage\"\n
    \   api_bind_addr = \"[::]:3900\"\n    [admin]\n    api_bind_addr = \"[::]:3903\"\n
    \   EOF\n    \n    TOKEN=$(openssl rand -base64 32)\n    echo \"Admin token: $TOKEN\"\n
    \   \n    docker run --name garage -p 3900:3900 -p 127.0.0.1:3903:3903 \\\n      -e
    GARAGE_RPC_SECRET=$(openssl rand -hex 32) \\\n      -e GARAGE_ADMIN_TOKEN=\"$TOKEN\"
    \\\n      -e GARAGE_DEFAULT_BUCKET=testbucket \\\n      -e GARAGE_DEFAULT_ACCESS_KEY=GKthisisatestkey
    \\\n      -e GARAGE_DEFAULT_SECRET_KEY=$(openssl rand -hex 32) \\\n      -v $PWD/garage.toml:/etc/garage.toml:z
    -v garage:/var/lib/garage \\\n      dxflrs/garage:v2.6.0 /garage server --single-node
    --default-bucket\n\nRunning 2.6.0 or above, you can access the web interface on
    the garage admin API port, by default port 3903, so http://localhost:3903/ if
    you are running garage on your machine with the example above.\n\nLogging in requires
    a garage admin token. The example above prints it on the command line. If you
    have set the `admin_token` configuration variable in your configuration file,
    you may use that token. Otherwise, you'll need to create a separate token from
    the command line with `garage admin-token create`.\n\nOne world of caution: **administering
    a remote cluster over plain HTTP is NOT safe** , as your admin token is transmitted
    in plain text with each request. You'll need to setup an HTTPS reverse proxy in
    front of your Garage node to encrypt the connection, or/and access your node through
    a VPN such as Wireguard to make sure no one can eavesdrop the credentials.\n\nOnce
    logged in the cluster, you will be greeted by a cluster overview screen that looks
    like the following (this is a live example from our Deuxfleurs cluster):\n\n![Garage
    web admin overview screen](https://garagehq.deuxfleurs.fr/blog/2026-11-webadmin-release/webadmin-overview.png)\n\nThe
    web interface follows a similar pattern to the CLI: cluster monitoring, layout
    configuration, bucket and access credential management are all available as you
    expect. Here are example videos (now included in the Quick Start guide as well)
    showing the setting up of a new cluster from scratch:\n\nFrom a development standpoint,
    the web UI currently lives in a [separate Git repository](https://git.deuxfleurs.fr/Deuxfleurs/garage-webadmin/)
    so please report any issues there and not in Garage's main issue tracker. Tixie
    will continue being the maintainer of the UI moving forward.\n\n## Official Helm
    chart published in our public repository\n\nThis has also been one of the longstanding
    requests from our Kubernetes users, and it's now done! Starting today you can
    deploy Garage on Kubernetes easily thanks to our self-hosted Helm repository.
    Both \"regular\" (tgz+index.yml) helm chart repository as well as OCI artefacts
    are available. Instructions in the documentation[have been updated accordingly](https://garagehq.deuxfleurs.fr/documentation/cookbook/kubernetes/).
    Happy Helming!\n\nThanks to Boris M. and Maximilien for contributing this improvement
    to Garage, along the many contributors that participated in finding the right
    way to make this work.\n\nThe Garage helm chart follows its own version scheme,
    with the current version being 0.10.7.\n\n## Garage v1.x officially end-of-life\n\nThe
    last release of the 1.x branch was v1.3.1 in January 2026, almost a year ago.
    Many significant bug fixes, including security fixes, are currently only present
    on the v2.x branch. At this point, it would be too much work to backport them
    to 1.x and it didn't seem there was any ask to do so from the community either.
    So we are officially deprecating Garage v1.x and urging all users still on this
    branch to update to v2.x as soon as possible. The release note has been updated
    accordingly.\n\n## Garage v3.0.0 beta 1 release\n\nWe have published a first beta
    release of Garage v3.0.0. This release **does not yet include S3 versioning**
    (sorry!). This unfortunately needed to be a major release because of a few breaking
    changes we wanted to release without waiting for s3 versioning to come though:\n\n-
    anonymous S3 read access to buckets\n- bucket and object tagging\n- replacing
    the unmaintained node-to-node SSB handshake protocol with the Noise protocol,
    something we have been able to achieve without any user-facing breaking changes
    thanks to the close proximity between the two\n\nWe are looking for testers for
    this beta so please give it a try and report any findings on our issue tracker!\n\nThis
    beta release also marks the first step toward having a reliable Fjall metadata
    engine so please report to us not only problems, but also_cases of successfully
    running a Garage cluster on Fjall with significant activity_, so that we can gain
    confidence that it works well and potentially mark it stable soon. This also means
    we'll take bug report for Fjall issues, something that we explicitly disregarded
    so far for the 2.x experimental implementation.\n\nAs per [the release notes](https://git.deuxfleurs.fr/Deuxfleurs/garage/releases/tag/v3.0.0-beta1),
    the most important breaking changes for users to be aware of are:\n\n- To finally
    align with industry standard, most Prometheus metrics have been slighly renamed,
    we provide [an updated Grafana dashboard](https://git.deuxfleurs.fr/Deuxfleurs/garage/src/commit/0ed12c39962dd0d8481f5d9152663631cc20f4bb/script/telemetry/grafana-garage-dashboard-prometheus.json)\n\n-
    The Fjall major version update breaks compatibility with the Garage 2.x Fjall
    as data files from older versions are not supported. If you were using Fjall on
    v2.x, you will need to migrate manually: convert your metadata to another format
    (LMDB or SQlite) with `garage node convert-db`before upgrading. You can convert
    back to Fjall once you successfully upgraded to v3.\n\nThe complete list of breaking
    changes can be found in the changelog linked above. Happy testing!\n\n## Coming
    up: S3 versioning\n\nFinally we want to close this post with an update on S3 versionning.\n\nIn
    2027 we will start a new collaboration with [Armaël](https://isomorphis.me/) to
    implement what is certainly **the** most requested feature in Garage: S3 object
    versioning.\n\nWe understand that there has been growing impatience for this feature
    to be implemented in Garage, and rightfully so as it would enable new use-cases
    such as for long-term archiving where compliance is important, or as a backup
    target that cannot be tampered with.\n\nWe thank the community for their patience,
    and kindly ask them to understand why this hasn't been done before: while there
    have been several attempts by community members, this is a deep problem that requires
    intricate understanding of how Garage stores metadata, and implementing it without
    taking this into account leads to code that, while it might appear to work on
    the surface, is in fact incorrect. A correct implementa"
