  author: bariumbitmap
  text: Yes, I think that&#x27;s it. I&#x27;m speaking as a non-expert here but my
    understanding is that there are many mathematical statements that seem trivial
    but contain hidden assumptions. To take a well-known example, the Euler characteristic
    V-E+F=2 was originally thought to apply to polyhedra generally but later was shown
    to apply only to convex polyhedra (although confusingly some non-convex polyhedra
    also have an Euler characteristic of 2). My point is not that the statements of
    Lean formalization of the Generalized Riemann Hypothesis or other AI-generated
    proofs are necessarily wrong, that&#x27;s certainly not for me to say. But  rather
    that many of the statements and definitions in mathematics that seem to be rigorously
    defined and intuitively obvious turn out to be ambiguous or contain important
    subtleties or exceptions, and formalization is not a panacea for this.
