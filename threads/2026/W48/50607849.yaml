  author: scythe
  text: I don&#x27;t think it&#x27;s this. It&#x27;s that ultimately, research taste
    <i>is</i> human preference. Models can learn to do various things with 99%, 99.9%,
    99.9999%, etc, fidelity. In many (apparently most) cases this is better than human
    fidelity. But there are a few things where humans have 100% fidelity, which is
    only possible because those things are intrinsically human, for the same reason
