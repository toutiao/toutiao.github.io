  author: zackmorris
  text: 1000% and I&#x27;m pushing 50.<p>My first experience with tech was watching
    a family friend play Adventure on an Atari 2600 when I was maybe 5. Later I got
    to see one of the first Macintosh computers at a computer shop and the patterns
    looked like colors because a black and white screen at close to print quality
    was so revolutionary that synesthesia took the wheel. I got to watch the home
    computing revolution from Nintendo through when the iPhone came out in 2007, which
    is when I feel that computer science began its long slow decline after the tech
    bros took over.<p>In the meantime, I got my electrical and computer engineering
    (ECE) degree in the late 1990s and fell into the web development catchall after
    hardware engineering got outsourced in the 2000s. So I know computers from the
    atomic level to the highest abstractions in functional programming, not that it
    ever did me much good in a winner-take-all workaday world where the idea people
    are broke and the wealth hoarders only hoard more wealth.<p>None of that matters
    now. Nobody cares.<p>So to me, the central crisis of my life (separation from
    agency) is now shared by the world and future generations. We all must choose
    between creating a brighter future that works for everyone, or taking to the yolk
    under subjugation and wealth inequality.<p>I would propose that now that we know
    that this timeline is ending in the very near future, it&#x27;s a good chance
    to look beyond the analytical to the metaphysical.  Beyond reason to meaning.
    Beyond the objective to the subjective. Like AI, there is so much more to reality
    than we know, that to think we know the limits of it is a fallacy.<p>If you or
    anyone reading this is going through anything like the identity crisis that I&#x27;m
    feeling, rest assured that many other people are as concerned as you are. My hope
    is that we find each other and begin working to move away from compression to
    expansion. I believe that we can tackle every artificial scarcity created by the
    status quo that forces us to tread water every day, so that all of us may lift
    ourselves out of poverty. Loosely that begins with reclaiming our time from those
    who would exploit us, using our ingenuity to convert that time to money, and most
    importantly sharing that money freely without gatekeeping so that all people everywhere
    have the resources needed to self-actualize.<p>Anything short of that will be
    the final failure of the human race IMHO.
