  text: "&gt; If we don&#x27;t understand the lower levels, how will we ensure that
    the &quot;research taste&quot; is good? How will we have any idea whether we are
    pushing towards the right kind of discoveries? It doesn&#x27;t make any sense!<p>&gt;
    You can pretend that this is the same as something like my day job as a web developer.
    I don&#x27;t fully understand how the hardware works at an atomic level. However,
    I have found that every time I learn more about the foundations on which my abstractions
    are built, I make better decisions in my job even though that knowledge is technically
    unnecessary. Understanding pointers in C finally made me understand object references
    in JavaScript, and it helped me to write more efficient code.<p>This is the big
    question. Is it possible to become good at something high level without spending
    the time learning the lower levels?<p>Answers range from &quot;yes, eg we don&#x27;t
    need to learn ASM anymore&quot; to &quot;no, eg you can&#x27;t learn how to use
    a calculator until after you learned arithmetic&quot;.<p>I have not decided what
    I think about it yet. I&#x27;m inclined to think, but only intuitively (evidence
    will take time to build), that to go from a technical junior to a senior you need
    to have spent a bunch of time in the trenches taking apart small things and slowly
    building up a repertoire that eventually can be built into high-level understanding.<p>However
    I do acknowledge that this is the only way I have ever seen someone get good at
    something. I haven&#x27;t lived in the new world for long enough to see counterexamples.
    I guess this is Hume, mostly. I can certainly imagine that someone could use an
    LLM to go very broad, which helps them find where their T-shape goes down."
