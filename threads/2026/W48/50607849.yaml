  author: bariumbitmap
  text: One pattern I&#x27;ve noticed in discussion about the progress of AI models
    in mathematics and physics is a lack of agreement from experts. For example, from
    this article:<p>&gt; <i>Concretely, the models are now able to carry out complex
    analytical calculations, work out lengthy proofs, turn well-posed problems into
    code, all with minimal input. They iterate, correct their errors, launch simulations
    to verify their conjectures, and summarize their work. On my own problems, I have
    already seen the impossible being done several times, starting with Fable 5 in
    May (I reported some on X and LinkedIn). Those who deny this progress have just
    not tried hard enough (with the latest models), or are blinded by their ego.</i><p>From
    this I might infer a presumption of accuracy for the outputs of these models.
    On the other hand, Retraction Watch recently posted about OpenAI withdrawing three
    of its papers:<p>&gt; <i>But on Oct. 7, OpenAI announced the withdrawal of three
    manuscripts because of a sign error. The error invalidated an argument in one
    manuscript and the construction used by two dependent papers, according to the
    announcement. Each of the withdrawn papers carry notices explaining “the gap,”
    and that OpenAI has “revised 14 other manuscripts with proof repairs, corrected
    statements, clearer hypotheses and dependencies, and one correction to an obsolete
    citation.”</i><p>&gt; <i>That an error cascaded into three of the OpenAI manuscripts
    is not surprising, said Alex Townsend, an associate professor of mathematics at
    Cornell University in Ithaca. He suspects there will be more errors found, he
    said.</i><p><a href="https:&#x2F;&#x2F;retractionwatch.com&#x2F;2026&#x2F;10&#x2F;08&#x2F;openai-withdraws-preprints-722-manuscripts-unsolved-math-problems&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;retractionwatch.com&#x2F;2026&#x2F;10&#x2F;08&#x2F;openai-withdraws-prep...</a><p>From
    this I might infer a presumption of skepticism, i.e. that these results should
    not be trusted by default.<p>What I think is particularly interesting is how persistent
    this disagreement is, especially between experts who seem knowledgeable in their
    respective fields. I remember when Mochizuki published his proof of the abc conjecture
    in 2012, when the reaction was cautiously optimistic, roughly &quot;this is cryptically
    written but will probably be salvageable once he explains it better&quot;. In
    2018 (6 years later!) Peter Scholze and Jakob Stix published a report about an
    error that they felt made the proof unsalvageable.[1] But then in 2021 Mochizuki&#x27;s
    proof passed peer review and was published anyway, despite broader skepticism
    from the math community:[2]<p>&gt; <i>The announcement was received with skepticism
    by Kiran Kedlaya and Edward Frenkel, as well as being described by Nature as &quot;unlikely
    to move many researchers over to Mochizuki&#x27;s camp&quot;</i><p>Still today
    as a non-expert I can&#x27;t say with any confidence whether the pro-Mochizuki
    camp or contra-Mochizuki camp is correct, although my understanding is that the
    consensus is that Mochizuki&#x27;s proof is still wrong. But why are we talking
    about &quot;camps&quot; in mathematical proofs? It&#x27;s been over 14 years,
    why is there still such profound disagreement between multiple experts about whether
    the proof is correct or not?<p>My greater concern is not about whether AI will
    replace mathematicians, but rather that these AI-generated proofs will leave us
    with a permanent epistemic crisis where there is no real consensus about what
    mathematical results are true or not, and therefore no new theorems that we can
    build on to make further mathematical progress.<p>[1] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Abc_conjecture"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Abc_conjecture</a><p>[2]
    <a href="https:&#x2F;&#x2F;www.nature.com&#x2F;articles&#x2F;d41586-020-00998-2"
    rel="nofollow">https:&#x2F;&#x2F;www.nature.com&#x2F;articles&#x2F;d41586-020-00998-2</a>
