  author: bariumbitmap
  text: 'Formalization is undoubtedly powerful, and I think it&#x27;s clear that Levent
    Alpöge&#x27;s formalized proof is being rightly lauded as almost certainly correct,
    although of course it still needs to go through the full peer review process.
    However I&#x27;m still concerned about the possibility of an epistemic crisis
    for roughly two reasons:<p>(1) In general, the part of the proof that needs to
    be vetted by humans may be quite large, or verifying that the formal statement
    matches the informal statement may be non-trivial for other reasons. The Riemann
    Hypothesis proof and other Millenium Prize Problems will undergo careful and thorough
    scrutiny. This level of scrutiny will not be applied to every math and theoretical
    physics paper that relies on AI models.<p>(2) Many practitioners are simply not
    going to wait for human vetting or independent verification before treating a
    Lean proof as correct.<p>For an example of (1), consider the Tau Ceti library:<p>&gt;
    <i>The statement which Axiom’s system proved is here in Tau Ceti, an AI-generated
    library of Lean code. The file containing the statement imports over 250K lines
    of Lean code in Tau Ceti (over 900 files). Of these, around 5600 lines of code
    are crucial because they contain all the relevant definitions (for example, all
    the definitions of the sporadic simple groups, most of which are still not in
    Mathlib). Without human checking, one does not really know for sure that this
    is definitely the correct statement of the classification (and note that I have
    not yet met any human who claims to have carefully checked that the definitions
    of the sporadic groups in Tau Ceti are correct). In fact by far the strongest
    evidence that we have that this statement is correctly formalized is that Axiom’s
    code proves it!</i><p><a href="https:&#x2F;&#x2F;xenaproject.wordpress.com&#x2F;2026&#x2F;11&#x2F;12&#x2F;and-the-proof-is-checked-in-lean&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;xenaproject.wordpress.com&#x2F;2026&#x2F;11&#x2F;12&#x2F;and-the-proof-i...</a><p>For
    examples of (2), consider Antoine Tilloy&#x27;s statement in this very post:<p>&gt;
    <i>To do great things, we need to forgo some understanding of what is going on
    at lower levels, to focus on higher ones. This is still controversial in my field,
    and difficult to accept, but this has happened before: we no longer code in assembly,
    compute integrals manually with quadratures, or extract square roots with Newton’s
    method. The level of understanding we had was adapted to our tools; now that the
    tools have changed, what we need to understand fully also changes.</i><p>and Scott
    Aaronson&#x27;s statements on a recent blog post.<p>&gt; <i>Now that the companies
    have repeatedly shown that they can back up their claims with Lean certificates,
    don’t be a raging doofus who seizes on some triviality (e.g., a minor discrepancy
    between the Lean and informal proofs, or unused sections of the Lean proof) to
    pretend that dozens of great open problems of math and theoretical computer science
    are not, in fact, getting solved. Because they are getting solved. It might take
    us years to understand the solutions, but my working assumption by this point
    is that any proof that comes directly from OpenAI or Anthropic is correct barring
    information to the contrary.</i><p><a href="https:&#x2F;&#x2F;scottaaronson.blog&#x2F;?p=10379"
    rel="nofollow">https:&#x2F;&#x2F;scottaaronson.blog&#x2F;?p=10379</a>'
