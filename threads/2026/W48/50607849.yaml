  author: Nevermark
  text: "&gt; From this I might infer a presumption of accuracy for the outputs of
    these models.<p>There is no need for a &quot;presumption of accuracy&quot;.<p>There
    is no presumption of accuracy for humans.<p>Science as a process, mathematical
    proof, etc. are designed around the presumption of human inaccuracy.<p>Iteratively
    coming up with potential solutions, testing them, learning from the result, repeat,
    turned bogglingly inaccurate humans into a technological species.<p>Models can
    do this iteration faster, in many cases, orders of magnitude faster.<p>• In the
    small, they can iterate on particular solutions, or elements of solutions, faster.<p>•
    In the large, even with separate training and inference, their model training&#x2F;update
    rounds are profoundly faster at improving accuracy.<p>Look at search trees. They
    are extremely unreliable in any given step, super reliable at exhaustion. The
    first does not preclude the latter. On the contrary, being &quot;wrong&quot; at
    high speed is what makes them so reliably &quot;right&quot; in the end."
