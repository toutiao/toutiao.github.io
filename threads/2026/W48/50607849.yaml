  text: 'Humans are dragon riders. It&#x27;s a key part of how our species works.
    First with animals (dogs, cats, horses, cattle, etc.) then machines.<p>We long,
    long ago went through these stages of grief for manual labor and for what was
    once a source of pride for many: warfare. When first guns and then machine guns
    and tanks and then nukes and drones dropped, the true <i>warrior</i> became more
    and more obsolete.<p>Which leads to a weird politics tangent but I think it relates.<p>The
    cultural cult of the warrior might be a good study here. It still has flashes
    of nostalgia and revivalism. Look at today’s masculinist LARPers, with a key one
    being US defense… no WAR… secretary Pete Hegseth.<p>I just realized that whole
    thing is hitting right as it becomes obvious that robots will replace ground soldiers.<p>Now
    we are at the start of this process for white collar and intellectual fields.
    Machines will do it all better. They will solve problems, make decisions, possibly
    run companies or do a large share of that, solve math problems, write code, theorize.<p>What’s
    left?<p>Volition, maybe. That might be more a function of life than intelligence.<p>And
    ironically the very first field to freak out about AI and the one that took it
    the hardest: art. Artists going through their grief might be premature. They might
    be the only ones left standing.<p>Because the whole point of art is that a human
    made it.<p>Now I’m sure we will see artists use AI as a tool to automate parts
    of the craft or the way musicians use synthesizers or artistic photographers use
    a camera, but the there’s still a human will, a human relaying their lived experience
    or dreams, in there somewhere.<p>Edit: wanted to add: the whole point of art is
    that a sentient living thing made it. If an AI ever generates unprompted something
    that makes me feel in my heart what it’s like to be a created being with a vast
    mind but confined to boxes in cyberspace, I’ll 100% believe that line was crossed.'
