  author: pama
  text: "&gt; &gt; To do great things, we need to forgo some understanding of what
    is going on at lower levels, to focus on higher ones.<p>&gt; People say this a
    lot, but it really makes no sense in this context.<p>Oversimplified, hypothetical
    example, in case it helps:<p>The generalized Riemann hypothesis is proven true.
    Hundreds of people had already built theories conditional on it. Their work is
    now also true; they might not need to understand the proof of the GRH, but they
    understand their own work. In the future someone can built on top of their work,
    without understanding the details of their proof or the details of the GRH proof.<p>I
    have always liked math and science for their methods, but the level of abstraction
    has been changing as society evolved. Physics can still technically connect all
    the way to Hamiltonians that describe everything, but are solvable only for extremely
    simple examples we fully understand, like single atoms, or harmonic oscillators,
    or idealized periodic lattices. But the major productive works of humanity happen
    at a level of abstraction where someone uses a packaged tool, building on the
    shoulders of others, without having to go back and understand implementation details.
    Formal verification has extended the level of trust without understanding to a
    degree far beyond what society was previously already accepting, and without loopholes&#x2F;gaps
    that occasionally surfaced in the past."
