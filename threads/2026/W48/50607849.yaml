  author: PeterisP
  text: I think the main issue is that there always has been a disconnect between
    those different purposes - the theorems as the main goal, and the understanding
    obtained in the process; and while the latter (IMHO) has always been the core
    of the profession, the mathematics community has spent a long time &quot;advertising&quot;
    to  sources of funding that the former is their purpose, that they&#x27;ll bring
    proofs that are valuable to the applied sciences and because of that their field
    should get funding. And so there were two different, contradictory notions of
    &quot;what is the purpose of math&quot; systematically told to different audiences.<p>So
    the recent advances push a painful choice - if the math community asserts that
    &quot;The goal was the friends we made along the way&quot;, they lose a key argument
    that was forever used in all the grant applications I have seen; and if they assert
    that yes, the proven theorems were what matters and that it was and is the main
    purpose, then they have to admit that this narrow purpose can be done by AI, and
    perhaps a physicist (or some other applied science team) should be looking for
    AI to prove&#x2F;disprove the mathematical hypotheses they need, instead of funding
    new theoretical math doctorates.
