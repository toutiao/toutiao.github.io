  author: pixl97
  text: My question is, is taste decided post ad hoc?<p>Like when we judge taste on
    a particular set of problems is it already super filtered to a very tiny &#x27;pre-trained&#x27;
    portion of the population that we&#x27;re judging. These &#x27;tasters&#x27; take
    a long time to train to this point, there is no particular shortcut other than
    experience. We just happen to have 8 billion people that we can select from and
    train an appropriate number.<p>This puts humans at the advantage for now, but
    I do question how long that will last? The models we are training currently are
    what I call &#x27;mega-models&#x27;. They are highly energy intensive to train
    so the actual total number of models is very low. We could fill a travel bus with
    models that we&#x27;ve called SOTA.<p>If and when we develop a means of individualizing
    SOTA models much more quickly and cheaply I think the above status quo will quickly
    collapse and catch a large number of people by surprise. Instead of having maybe
    a hundred &#x27;individuals&#x27; when it comes to models the number could explode
    to tens of thousands to millions in months. Models with &#x27;taste&#x27; that
    other models and humans like will percolate out. Better or worse, the number of
    high taste high experience models may quickly dwarf all of the humans that were
    ever experts in a particular field.
