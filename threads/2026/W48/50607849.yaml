    apparently through the magic of RLVR, he somehow thinks that models will someday
    suddenly accrue this taste.<p>Why hasn&#x27;t that happened yet? I get just as
    frustrated when I let Fable 5.2 make product decisions as I did with ChatGPT4.
    They solve the problems I give them much better, but when I try to let them lead
    to the next milestone, they consistently choose the worst, most conservative option.<p>&gt;
    To do great things, we need to forgo some understanding of what is going on at
    lower levels, to focus on higher ones<p>If we don&#x27;t understand the lower
    levels, how will we ensure that the &quot;research taste&quot; is good? How will
    we have any idea whether we are pushing towards the right kind of discoveries?
    It doesn&#x27;t make any sense!<p>You can pretend that this is the same as something
    like my day job as a web developer. I don&#x27;t fully understand how the hardware
    works at an atomic level. However, I have found that every time I learn more about
    the foundations on which my abstractions are built, I make better decisions in
    my job even though that knowledge is technically unnecessary. Understanding pointers
    in C finally made me understand object references in JavaScript, and it helped
    me to write more efficient code.<p>We need to understand what&#x27;s happening
    underneath to some degree if we&#x27;re going to build on top of it prudently.
