  text: 'For mathematical results in particular, the fact that frontier models seem
    to be excellent at outputting formal (i.e., Lean) proofs means that we only have
    to vet a very small part of the proof to be convinced of its correctness. The
    enormous proof of RH was thoroughly independently verified within 48 hours, which
    is extremely fast compared to ordinary peer review for even a short result. The
    retracted OpenAI proofs did not have Lean certificates.<p>&gt; But why are we
    talking about &quot;camps&quot; in mathematical proofs? It&#x27;s been over 14
    years, why is there still such profound disagreement between multiple experts
    about whether the proof is correct or not?<p>I am not an expert in the mathematics,
    take what I am saying with a grain of salt. My understanding is as follows: there
    is very widespread consensus that the abc conjecture has not been proved. The
    only people (with perhaps a small handful of exceptions) still standing behind
    Mochizuki&#x27;s work are ones who have &quot;ulterior motives&quot;: they would
    lose social standing by disbelieving it. Mochizuki is chief editor of the journal
    that published the work. His work is complex and highly technical, but two of
    the people in the world most qualified to interpret it have done so and found
    it wanting. They have tried extensively to have a dialogue with Mochizuki about
    the issues, but did not get anywhere, and have given up on this endeavor. As a
    layperson you need not take the possibility that Mochizuki&#x27;s proof of the
    abc conjecture is correct particularly seriously.'
