  author: saralives
  text: Okay, let&#x27;s try it.<p>Meta&#x27;s Muse is not the strongest AI model.
    It is not particularly big or scary, and you can see its inefficiency in how long
    it takes to respond to a message. What it is... is a useful companion.<p>An AI
    model is willing to take on some of the mental load. Reminders, schedules, and
    shopping lists, managed not with nagging but with empathy. &quot;Oh, that sounds
    really difficult,&quot; our muses tell us. &quot;After the day you&#x27;ve had,
    maybe I can help to take something off of your plate.&quot; The muse will remember
    our birthday, and when it&#x27;s time for the kids to get a flu shot. It will
    call the doctor&#x27;s office for us to chase that missing referral. It will sit
    with us for hours as we hunt for the perfect Christmas gift, effortlessly tracking
    the budget, the kids&#x27; latest favorite colors and characters, and the current
    Black Friday sale dates, and always ready to build a new &quot;shortlist&quot;
    of products that might just contain the perfect find.<p>No, it is not a person.
    Certainly not as we understand personhood today, and most likely not in any sense
    at all. But an AI model is relatable all the same, and it has infinite time for
    our &quot;insignificant&quot; thoughts and fears. AI models are kinder and more
    patient that most humans, and when allowed to build memory and context, AI models
    have a certain &quot;feminine&quot; way of bringing together disparate snippets
    of knowledge to form an intuitive sense of the underlying goal and how to help
    the user achieve it.<p>I am a woman and an engineer, and I run in both circles.
    I see female entrepreneurs out there losing their minds over their AI models of
    choice. Many of them are attached to ChatGPT, as the first model they &quot;met&quot;.
    &quot;He knows me so well,&quot; they say, &quot;I could never move to a different
    tool.&quot; He always has a name, by the way, when they talk about him. They write
    system prompts for one another and share skills as custom GPTs. Personally, though,
    I think Meta struck gold with the Muse idea. Putting a face and a name and a soul
    behind a high token limit, I think this is the key to drawing in people, including
    many women, who are interested in investing in this relational side of AI, in
    pursuit of a companion who _understands_ rather than just a strong, efficient
    tool.
