  content: "Pop!\\_OS 26.04 LTS is here after nearly a year of thoughtful feature
    development.&nbsp;   \n  \nWith tons of improvements, new features, and the usual
    bug fixes, Pop!\\_OS 26.04 LTS feels right at home from the first boot. And when
    you're ready to make it your own, you can customize it until it looks and feels
    exactly the way you think a desktop should.\n\nIt all starts with Constellations.\n\n##
    **What are Constellations?**\n\nConstellations are COSMIC’s all-in-one bundled
    themes.&nbsp; With a single click you can change the wallpaper, accent colors,
    icons, and fonts. It's literally a one-click switch for a full aesthetic change
    of your desktop. Instead of having to go to Desktop \\> Wallpaper, then Desktop
    \\> Appearance, then Desktop Panel, then Desktop Dock, then Desktop Window Management,
    all you do is go to Settings \\> Desktop \\> Appearance, select between dark or
    light mode, enable or disable automatic mode switching, and then select your theme.\n\n_Selecting
    a Constellation in Pop!_OS 26.04._\n\nYou can also apply the Frosted Glass effect
    to a Constellation, and edit nearly every aspect of a Constellation. Once you
    have your Constellation exactly as you want, export it so you have it as a backup,
    or to share with others.\n\nWith Constellations, the desktop is truly yours to
    customize and keep.\n\n## **Also in 26.04:**\n\n### **Drawing tablet support**\n\nPop!\\_OS
    26.04 LTS adds drawing tablet support, which brings precise, natural pen input
    and unlocks features like tilt sensitivity. That opens the door for graphic design,
    photo editing, animation, note-taking, CAD, and GIS applications.\n\nThis release
    also adds an on-screen keyboard with touch and gamepad input.\n\n### **Automatic
    updates**\n\nYou can now enable automatic updates during the initial setup or
    within Settings \\> System & accounts \\> System & application updates. No missing
    crucial updates to the OS!\n\n_Automatic updates enabled._\n\n### **Native applications**\n\nAdditionally,
    the growing family of native applications includes COSMIC Viewer, COSMIC System
    Monitor, and a fully redesigned COSMIC Store.\n\n_COSMIC Viewer, COSMIC System
    Monitor and redesigned COSMIC Store._\n\n### **Additional features to enjoy:**\n\n-
    remote desktop support\n- accessibility improvements\n  - shake to find cursor&nbsp;\n
    \ - scalable cursors\n  - improved screen magnification&nbsp;\n  - adjustable
    pointer size\n- configurable workspaces wrapping&nbsp;\n- improved gaming with
    pointer constraints&nbsp;\n- fullscreen improvements&nbsp;\n- automatic GPU selection
    improvements when working on hybrid systems\n\nAs COSMIC is a rolling release
    desktop, users on 24.04 will have experienced many of these features. For the
    full 26.04 experience, do a fresh install. Pop 24.04 to Pop 26.04 upgrades will
    be activated in December.\n\n### **Download Pop!\\_OS 26.04 LTS**\n\nDownload
    Pop!\\_OS 26.04 LTS at[https://system76.com/pop](https://system76.com/pop)"
