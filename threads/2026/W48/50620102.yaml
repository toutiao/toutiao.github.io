  author: ekidd
  text: '&gt; <i>VP=VNP implies P=NP, but this result doesn&#x27;t imply P != NP.</i><p>For
    those unfamiliar with the subject, a constructive proof of P=NP would be a <i>very</i>
    weird universe, because it would essentially allow fully automated discovery of
    proofs for <i>any</i> theorem that has a polynomial-time checkable proof. (And
    almost anything you&#x27;d call a &quot;proof&quot; would be checkable in polynomial
    time. So basically, fully automated mathematical discovery.)<p>See the discussion
    of P and NP by Scott Aaronson part way down this page : <a href="https:&#x2F;&#x2F;www.scottaaronson.com&#x2F;democritus&#x2F;lec9.html"
    rel="nofollow">https:&#x2F;&#x2F;www.scottaaronson.com&#x2F;democritus&#x2F;lec9.html</a><p>So
    if your AI proves P!=NP, your AI is <i>very</i> clever. (There several different
    proofs that <i>rule out</i> common proof techniques being able to prove P!=NP.)
    But if your AI instead proves P=NP, the future just got weird on a level that&#x27;s
    hard to even describe. Cracking cryptography wide open is the <i>least</i> weird
    thing you should expect.'
  score: 0
