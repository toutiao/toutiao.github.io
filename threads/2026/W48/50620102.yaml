  author: cwillu
  text: |-
    From the survey paper I linked in a different reply:<p>No-go for naturalizing proofs: “But now, twisting the knife, Razborov and Rudich point out that any natural lower bound proof against a powerful enough complexity class would be self-defeating, in that it would yield an efficient algorithm to solve some of the same problems that we’d set out to prove were hard.”  --<a href="https:&#x2F;&#x2F;www.scottaaronson.com&#x2F;papers&#x2F;pnp.pdf" rel="nofollow">https:&#x2F;&#x2F;www.scottaaronson.com&#x2F;papers&#x2F;pnp.pdf</a><p>No-go for relativizing proofs: “Alas, Baker, Gill, and Solovay then observed that no relativizing technique can possibly resolve the P ? = NP question. For, unlike (say) P ? = EXP or the unsolvability of the halting problem,
    P ? = NP admits “contradictory relativizations”: there are some oracle worlds where P = NP, and others where P̸ = NP. For that reason, any proof of P̸ = NP will need to “notice,” at some point, that there are no oracles in “our” world: it will have to use techniques that fail relative to certain
    oracles”
  score: 0
