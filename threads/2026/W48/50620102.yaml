  author: cwillu
  text: 'There are significant no-go theorems about what a proof of P≠NP can look
    like, such that we didn&#x27;t (at least as of a few years ago) know what a proof
    would even look like: all the known techniques were proven to be insufficient;
    generally in forms like “if this technique worked to prove P≠NP, then the technique
    could also be used as part of an algorithm to solve NP-hard instances in P time.”  See
    Relativization and Algebrization.<p>As such, any proof would necessarily involve
    new breakthroughs rather than merely the exhaustive application of existing techniques.'
