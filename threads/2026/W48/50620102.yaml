  author: zrm
  text: The interesting thing about both the halting problem and the continuum hypothesis
    is that they involve infinity.<p>The halting problem is trivially (but not necessarily
    efficiently) computable if you constrain the evaluated program to any specific
    finite amount of memory, because then a failure to halt would have to repeat a
    previous state. To solve it the evaluating program needs to keep more state than
    the evaluated program, which makes it incomputable when the evaluated program
    is allowed infinite state.<p>Which is kind of weird, because that makes it computable
    for any finite amount of state no matter how large, but not for an infinite amount.<p>Meanwhile
    the speed of light and Planck units seem to imply that physical reality can&#x27;t
    deal with infinity either.
  score: 0
