  author: Xcelerate
  text: Interestingly, the independence of the continuum hypothesis from ZFC is provable
    in a weak fragment of arithmetic (as an implication of the consistency of ZFC).
    PRA suffices, and PV_1 probably works too.<p>(To see why, you&#x27;re basically
    asking if a computer program that searches all proofs of ZFC for a proof of either
    CH or ¬CH and halts in either case ever indeed actually halts. The non-halting
    proof ultimately requires a fairly weak arithmetic theory even if the standard
    proof is typically presented at a higher level of abstraction using forcing).<p>We&#x27;ve
    gotten lucky so far that many independence theorems are themselves provable in
    relatively weak theories. This is by no means guaranteed however, and it&#x27;s
    entirely possible we stumble upon a problem at some point for which the only justification
    of its independence from known theories is a new principle that hopefully appears
    intuitively obvious enough to accept.<p>Not saying P vs NP falls in this category
    (that would be really surprising) but it&#x27;s certainly not impossible.
