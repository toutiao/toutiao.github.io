  author: jltsiren
  text: "&quot;Results are fundamentally the thing that matters&quot; is a meaningless
    statement, because a result can mean pretty much anything. In my own career, I&#x27;ve
    seen four mostly orthogonal definitions:<p>1. Results are what people in the field
    value. This is already changing in fields most impacted by AI.<p>2. Results are
    what people in more applied downstream fields value. Typically because they can
    use such results, or because the results improve their understanding of their
    own field.<p>3. Results are what administrators and politicians value. Some kind
    of objective merits that can be quantified and taken into account in various evaluations.<p>4.
    Results are what the general public values. Typically something they believe will
    eventually improve their lives, or something that they find interesting."
