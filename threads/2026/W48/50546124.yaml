    # [Togelius](http://togelius.blogspot.com/)

    Better playing through algorithms

    ## Tuesday, November 10, 2026

    ### Advice for young researchers

    I’m currently in the process of recruiting a whole new research lab, as I’m moving to a new university. I’m sifting through several hundred PhD student and postdoc applications in order to hire a handful of people initially, and more soon. The quality of the candidates is excellent, and several of them have impressed me deeply in interviews. (It also makes me wonder how I ended up getting a PhD position back in 2004; I was way less prepared then than my top candidates are now.) The selection work is hard but fun, as work should be.

    I’m doing this against a backdrop of things moving fast, to say the least. Two years ago AI agents were mediocre at coding and terrible at maths; today they are, in some senses, superhuman at both. You can now simply give an AI agent a research idea, and it goes away and does the work and gives you a finished paper. You can even ask the damn thing to come up with the research idea itself. In my field and experience, the result is typically a fairly solid but also quite boring paper, reporting some incremental progress on some minor problem with good experimental statistics but terrible writing. Nothing that would win any awards, but the kind of work that used to be a respectable first paper from a PhD student. Now, you can get it with a prompt. And, again, things are moving fast. I’m not sure how much the writing abilities of AI agents will improve, but their ability to design and execute complex research pipelines is likely to be much better next year, and then next year again…

    What does this mean for an incoming PhD student? And what does this mean for a PI, responsible for hiring students and postdocs, setting research direction, managing a lab, and advising students, which means being everything from domain expert to brainstorming partner to secretary to therapist? I will try to reason about this here. My field is AI for games/creativity/open-endedness, but I guess what I say will apply to other fields to some extent.

    Let us first agree on what a PhD is supposed to be about. During a PhD you learn to do research, meaning that you learn to produce or uncover new knowledge. New, as in new to humanity. The way you learn this is through a form of apprenticeship: you do research on your own and together with others, advised by one or more senior, experienced researchers. Typically, you are part of a research group led by a professor who is also your advisor. In my experience, your advisor and research group, and how well you get along with them, matter a lot to the quality of the research you do and your general enjoyment and mental health. Much more than the prestige of the university.

    In general, you develop skills, factual knowledge, and understanding during a PhD. As a viral tweet stated, [you can outsource thinking but not understanding](https://x.com/yacineMTB/status/2018886083120153046). I think this is an excellent observation. Understanding is what really matters. The more work AI agents can do, the more you need to understand in order to guide them. Also, understanding is arguably the main goal of science (as opposed to technology). Still, skills, factual knowledge, and understanding cannot be easily disentangled. Implementing an algorithm brings not only skill, but also a level of understanding that you cannot get from simply importing it, or having an agent implement it for you.

    There is a phenomenon which I call understanding debt, by analogy to technical debt. Understanding debt is when you have had your agents do a bunch of stuff for you, and you no longer really understand what’s going on. Then you’re faced with the prospect of either trying to understand in depth what’s happening, or just going on anyway. But if you go on anyway, you will notice that the quality and relevance of your inputs drop, because you no longer understand enough to make informed decisions. This is something that I think we will all need to learn and re-learn as agents get better.

    I’m not saying I’ve solved this for myself. I have various half-finished projects sitting around that will probably never get published because I am not ready to put in the work to understand them well enough to write them up. Writing them up is a good test; you need to really understand a project to be able to write a good paper about it. And you should definitely write it yourself, at least the first draft. If you weren’t interested enough to write it, why would anyone be interested enough to read it? Pushing slop on your peers is rude. On the other hand, using agents to critique and polish your drafts is useful.&nbsp;

    Which brings us to a key question for a beginning researcher, just like for everyone else in a knowledge-intensive profession: When and how should you outsource your work to AI agents? The answer is not “as often as possible”.

    Why not? Because your effort and your choices matter. You can see this in project-based classes, as well as in workplaces which use AI heavily. Even when everyone has access to the same AI tools, the quality and character of people’s contributions vary widely. (Not so much the quantity, because it’s so easy to produce things now.) Some students in my classes turn in barely adequate work, whereas others repeatedly shine. Typically, those who turn in the best work also understand it the best. Just like it’s always been; access to amazing tools does not erase the value of talent and dedication. Perhaps it even amplifies it.

    Here’s another reason: Just because you can get to lots of places rapidly and easily by flying does not mean that you should never drive, or bike, or even walk. There is lots to be gained by seeing the landscape up close. If your idea of visiting a country is to go only to the major cities with international airports, you are going to get a very skewed idea of that country. Most of the US is really not like New York, and most of Sweden is not like Stockholm. From the car window, you can see farms, factories, and small towns; you can stop to talk to people and get their views. If you walk or bike, it takes even longer to get to your destination, but you’ll notice way more details. You’ll also be able to take little detours, perhaps find new paths that aren’t even on the map yet. Perhaps you will be the ones to put these paths on the map, and lay the first stone for the airport, so that people can one day fly there. It’s exciting to be an explorer! In fact, as a researcher, it’s your job to take the roads less traveled. Anyone can buy a ticket to the big swanky international airports and sip espresso in a lounge. It’s your job to do the uncomfortable and uncertain: make your way through the jungles/mountains/swamps/ruins so that we can go somewhere we couldn’t go before.

    Nothing wrong with getting carried away by a metaphor. In fact, it can be a good way to ideate. See for example bio-inspired algorithms, where a lot of good ideas have come from taking biological metaphors very seriously. A lot of bad ideas as well. Luckily, we can run experiments to help us tell the bad ideas from the good ones. Running experiments is now easier than ever, and you will be doing a lot of it as a PhD student, to test your ideas and develop your understanding.

    Given how easy it now is to implement and test ideas, many researchers will probably be spending their time in tight loops with agents, feeding them ideas to test, and trying to make sense of the results as they come in. I personally think it is important to also spend plenty of time offline reading and writing before handing instructions to the agents, but research and thinking styles vary. We are all learning and re-learning how to work with these new tools available to us, and I think it is important to also experiment with how we work.&nbsp;

