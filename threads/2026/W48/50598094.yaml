    slavery in medieval Europe) was mostly linked to export of cash crops to Europe.
    With the genocide of Native Americans and the influx of agricultural land-owners,
    you had a problem: there was no labour. Without established cities &amp; industrial
    production, the class of wage-labourers wasn&#x27;t sufficient to satisfy this
    need. Therefore, they imported slaves. With the development of the proletarian
    class in the 18th and 19th century, this practice became obsolete, remaining only
    in the most undeveloped parts of the country.<p>In Europe, after antiquity, slavery
    was mostly done away with due to the Catholic church forbidding slavery of Christians
    and economic development which never favoured slavery; there was no external stimulus
    on agriculture like in the New World, so you mostly had serfs subsistence farming
    while being heavily taxed. Industrial production had its part in doing away with
    serfdom here as well: in order to supply the growing proletarian class, the serfs
    needed freedoms previously denied, like the freedom of movement.<p>This is a sketch
