  author: PeterWhittaker
  text: '&gt; abolished because (wealthy) people refused to buy products made by slaves<p>Perhaps,
    but in the UK it was effectively made illegal by a 1772 court case [1], in which
    the justice, Lord Mansfield, was careful to stipulate that his remit was the UK
    only, and that colonies and shipping were outside his jurisdiction.<p>Americans
    generally omit mention of how impactful Somerset V Stewart was on colonial politics:
    that the colonies relied heavily on slavery is well known, but less appreciated
    is the fact that the legal bases for Mansfield&#x27;s ruling were as applicable
    to the colonies, etc., as they were to the UK...<p>...so all it might have taken
    to abolish slavery would have been an appeal to the House of Lords, which, had
    it taken place and upheld Somerset, could have abolished slavery in all British
    colonies, possessions, and territories.<p>The justifications for independence
    are usually about representation and the like, but Somerset and the possibility
    of its application more broadly was in all likelihood a major factor of consideration
    especially for southern colonial leaders.<p>[1] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Somerset_v_Stewart"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Somerset_v_Stewart</a>'
