  author: fuussssip
  text: "The uniformed police of the north grew out of a history of town watch and
    shire reeves in England. In general, night time patrols and safeguarding the town
    was seen as an obligation of all town members. However, the wealthier folks eventually
    started to pay lower class folks to take over their shifts.<p>From there, we get
    paid security for towns, but it wasn&#x27;t uniformed.<p>Merchants in the north
    also paid for warehouse and factory guards. These wealthy merchants pressed for
    the costs of guarding their warehouses to be socialized &quot;for the good of
    the town&quot;.<p>These two systems eventually merged, rising from wealthier folks
    wanting to protect their interests, and lower class folks needing work.<p>These
    groups were not uniformed, and were often considered quite &quot;rough&quot; --
    almost gangsters in their own way. Gradually, in the mid 1800s, larger cities
    took the socialized cost of policing and wanted to project the idea of police
    being present, so they invested in uniforms. The idea being that people would
    see their neighborhood patrolled by a consistent looking person and know, &quot;I
    shouldn&#x27;t do crime here, there&#x27;s always one of those uniformed police
    around&quot;.<p>This idea was quite popular, and spread widely in the late 1800s.
    \nInterestingly, during this era there was a boom of Irish immigration where people
    were coming in and looking for any work available, and police work was seen as
    the lowest class work one could do. Which is why there is a bit of an association
    between police and Irish last names in popular culture to this day (though that
    is fading as the nature of police continues to evolve.)"
