  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n### A training engine for your local model, using your idle
    compute.\n\nInstall • How it works • Commands • Roadmap • Discord • Website\n\nUse
    your local model as usual through opencode, pi or any OpenAI-compatible tool.
    While you work, Songe notices what happens after each of the model's actions:
    the tool result, the error, your next message. When your agent is quiet, it teaches
    the model to see those coming. A new version is used only if it passes its checks,
    and nothing ever leaves your machine.\n\n## ✨ Highlights\n\n- Learns from how
    you work. Your corrections, stated preferences and the tools' errors become lessons
    for your own model.\n\n- Two kinds of Dreams. A Quick Dream adds your preferences
    to the model's instructions in minutes; a Deep Dream trains the model itself while
    you are away.\n\n- Safe by default. A new version is used only if it does better
    on your own conversations; one click goes back to any earlier version.\n\n- Stays
    out of the way. Runs only when your agent is quiet, memory is free and the battery
    is fine, and stops the moment you are back.\n\n- Private. No account, no telemetry,
    no cloud. Songe never runs your tools.\n\n## \U0001F4E5 Install\n\nWith uv or
    pipx (Python 3.11 or later):\n\nuv tool install songe # or: pipx install songe
    songe init\n\nNo uv or pipx yet? Either installs in one line:\n\ncurl -LsSf https://astral.sh/uv/install.sh
    | sh # uv (or: brew install uv) brew install pipx # pipx on macOS (Debian/Ubuntu:
    sudo apt install pipx)\n\nBoth give Songe its own environment in a lasting place,
    which its background service needs.\n\nmacOS with Homebrew:\n\nbrew tap sous-labs/tap
    brew trust sous-labs/tap # newer Homebrew asks this once brew install songe songe
    init\n\nsonge init finds your model server and your agents, shows what it will
    change, and asks once:\n\n$ songe init Models 3 from LM Studio, listed under Songe
    Agent opencode → Songe models · default granite-4.2-3b-MLX-4bit Agent pi → Songe
    models · choose one with /model Data ~/Library/Application Support/songe Service
    starts at login Learning new conversations · starts when idle Replace loaded copy
    when a better version is ready Install? (Y/n)\n\nThen pick a Songe model in your
    agent (opencode lists them as songe/songe/<name>), and work as usual.\n\npip install
    songe works inside a virtual environment; outside one, Homebrew's and most Linux
    distributions' Python refuse it.\n\nYou need a model served locally, and an agent:\n\nMachines
    without a GPU still serve and record, but do not train. Tried Songe on another
    setup? Share the result on the testing board.\n\n## \U0001F319 How it works\n\nyour
    agent ──► Songe (127.0.0.1:7613) ──► your model server │ records what happened
    ▼ when you are away: a Dream read lessons ─► practice ─► train ─► check ─► use
    only if better\n\nWith auto-dream on, Dreams start when your agent has been quiet
    for a while. Or press Dream in the dashboard (songe open). A Dream never just
    disappears: it keeps going on the page, or says why it stopped.\n\n- Reading.
    Songe reads each conversation for the moments that teach something: your corrections
    and stated rules, retries, tool errors.\n\n- Practice. For each lesson your model
    writes short practice scenes in your agent's own tools. Your real conversations
    are never trained on.\n\n- Training. The model as it was, shown the lesson, is
    the teacher; the same model with a small adapter, shown only the scene, is the
    student (on-policy distillation). Earlier skills are rehearsed so they stay.\n\n-
    Checking. At the moments you reacted to, the version in use and the new one each
    answer, and a judge compares what they do. The new version is used only if it
    does clearly better, does not change what already worked, and its answers stay
    healthy.\n\nBefore the first training Songe measures how much your computer can
    learn at once, and trains on what fits. See DESIGN.md.\n\n## ⌨️ Commands\n\n-
    Its data folder: ~/Library/Application Support/songe on macOS, $XDG_DATA_HOME/songe
    on Linux, %LOCALAPPDATA%\\songe on Windows.\n\n- A songe/ folder in LM Studio's
    models folder with the current learned version. Your own models are never touched.\n\n-
    One provider entry in opencode and pi, with a backup.\n\n- A background service
    that starts at login.\n\nuv tool upgrade songe, pipx upgrade songe or brew upgrade
    songe: the service moves to the new version by itself in a quiet moment.\n\nsonge
    uninstall stops the service and restores your agent settings; add --purge to also
    delete its data and learned versions. Run it before brew uninstall songe.\n\n##
    \U0001F9ED Roadmap and contributing\n\nWhere Songe is going: ROADMAP.md. Ideas
    and bugs are welcome as issues. Questions and results from your nights go in Discord.
    To contribute, see CONTRIBUTING.md. Security reports: SECURITY.md.\n\nLicensed
    under Apache-2.0.\n\n## About\n\nA training engine for your local model, using
    your idle compute\n\n### Topics\n\n### Resources\n\n### Contributing\n\n### Security
    policy\n\n### Stars\n\n### Watchers\n\n### Forks\n\n## Releases\n\n## Packages\n\n##
    Contributors\n\n## Languages"
