  author: Brian_K_White
  text: Tangent (love your idea btw):<p>It&#x27;s kind of interesting how seti@home
    was replaced by &quot;boinc&quot; over 20 years ago in 2005, and yet whenever
    you want to refer to the concept no one ever thinks &quot;boinc&quot;. It&#x27;s
    always only &quot;seti@home&quot; or &quot;folding@home&quot;.<p>There&#x27;s
    some kind of marketing lesson there. All else being equal &quot;boinc&quot; should
    be the better name. It&#x27;s short as possible, yet still unique and googlable.
    &quot;seti&quot; itself has those qualities.<p>One thing obviously &quot;seti@home&quot;
    directly conveys imagery that &quot;boinc&quot; does not. But really &quot;seti&quot;
    should be just as meaningless, but however it happened, &quot;seti&quot; is not
    meaninless and so neither is &quot;seti@home&quot;.<p>So a 3-word, 4-syllable
    name is better than a 1-syllable, 1-word perfectly distinctive one. The longer
    name is actually mentally simpler, just along a different dimension than number
    of letters.<p>So I guess your idea should be called something like training@home
    except this non-distributed one could also be described as training@home so idk.
