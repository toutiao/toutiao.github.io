  text: For those of us who already had the hardware, it&#x27;s simple economics.
    I have a 4090 that&#x27;s otherwise usually idle, it gets good tokens&#x2F;second,
    it&#x27;s smart enough for the problems I have. That&#x27;s a good shape for free
    tokens out of something I already had.<p>Now, if I have bigger problems - which
    generally just means I&#x27;m wanting a larger context window, I&#x27;m wanting
    to churn on a single problem harder, or I simply want something done fast with
    minimal hand-holding - I&#x27;ll throw a paid LLM at it. I&#x27;m not locked into
    one or the other. I can have a big model do the hard work and then free local
    models spruce up small things along the way.<p>There&#x27;s also privacy&#x2F;control&#x2F;rug-pull
    dynamics, but most of the things I work on are either not particularly private
    or I keep the &quot;sauce&quot; in a separate space.
