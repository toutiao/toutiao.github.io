  author: NortySpock
  text: '<a href="https:&#x2F;&#x2F;www.crowdgpt.net" rel="nofollow">https:&#x2F;&#x2F;www.crowdgpt.net</a>
    is on its second attempt at training a ~1B model (658M dense, 350M engram) on
    100B tokens. License will be GPLv3 I believe. I think I estimated the training
    time was going to take one month at the pace they were going at last time. (With
    more contributors, it goes faster...)<p>I contributed a few GPU hours to the first
    run and some code and got good vibes from the project. Good of them to stop early
    when they noticed training stalled and a poor weight distribution. Hopefully this
    run goes better. Definitely vibe coded but also appropriately sized for the compute
    people have contributed, in my opinion.<p>The security model is: the central coordinator
    is trusted, hands out dataset ranges that the client should download, receives
    the gradients from client,  sanity checks them, and compares them statistically
    against the other two members of the pool. Too much divergence is rejected. Sufficiently
    trusted named clients can train without being in a pool. Anonymous contributions
    are allowed and are placed in pools of similar hardware.'
