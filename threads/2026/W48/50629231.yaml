  text: Yeah it would be helpful if their main readme had a few sentences at the top
    to just lay out the key points of what they built. This piecemeal automatic fine
    tuning is pretty interesting, I think it&#x27;s likely to extend to per-task n-gram
    embeddings, and between the two I can see this lowering the hardware bar for useful
    self-hosted inference a good amount. I don&#x27;t think it is really comparable
    to the harness fine tuning like what HF is doing, I think a real RL environment
    will probably be much more effective for a model that needs to be more general
    purpose, while the Songe style incremental approach will be useful deployed along
    side a specific app for high volume repetitive work. You can imagine a single
    endpoint serving one base model + a distinct n-gram and LoRA adapter per task
    family. Model families like Qwen and Nanbeige make me think this is becoming pretty
    doable already.
