    insulin and switch to fat burning. High insulin locks the fat in the fat cells
    and causes the symptoms you mention.<p>The best way to combat it would be to ease
    into the fast with a day to a few days of having super low carbs, more fat and
    protein. Once the body is runninng on fat because of the consumed fat and low
    insulin due to low or zero carbs, it can easily switch modes into using body fat
    for energy since both are released into the bloodstream in similar formats.<p>Each
    time one does that and more frequently, it becomes easier and easier to fast the
    next time.
