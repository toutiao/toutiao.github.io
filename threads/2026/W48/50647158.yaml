article:
  url: https://scienceinhand.com/72-hour-fasting-can-reset-your-entire-immune-system-usc-study-shows/
  title: 72-Hour Fasting Can Reset Your Entire Immune System, USC Study Shows
  fetch_status: success
  content: "![Glass of water shown as an illustration, not an endorsement or instruction
    to undertake prolonged fasting](data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMSIgaGVpZ2h0PSIxIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjwvc3ZnPg==)\n\n
    SHARE\n\n [](https://share.flipboard.com/bookmarklet/popout?url=https%3A%2F%2Fscienceinhand.com%2F72-hour-fasting-can-reset-your-entire-immune-system-usc-study-shows%2F)
    [](https://www.reddit.com/submit?url=https%3A%2F%2Fscienceinhand.com%2F72-hour-fasting-can-reset-your-entire-immune-system-usc-study-shows%2F&title=72-Hour+Fasting+Can+Reset+Your+Entire+Immune+System%2C+USC+Study+Shows)
    \n\nThe [USC-led research behind this headline](https://doi.org/10.1016/j.stem.2014.04.014)
    investigated how prolonged fasting and refeeding affected blood-forming stem cells,
    mainly in mice. Published in Cell Stem Cell on June 5, 2014, it also included
    preliminary observations from cancer patients receiving chemotherapy.\n\nContents\n\n-
    [The immune system is not a single object](#the-immune-system-is-not-a-single-object)\n-
    [What hematopoietic stem cells do](#what-hematopoietic-stem-cells-do)\n- [What
    the USC experiment found](#what-the-usc-experiment-found)\n- [Refeeding was part
    of the experimental cycle](#refeeding-was-part-of-the-experimental-cycle)\n- [What
    the early human observations could show](#what-the-early-human-observations-could-show)\n-
    [The later feasibility report involved 20 patients](#the-later-feasibility-report-involved-20-patients)\n-
    [Why an immune-cell count is not a functional reset](#why-an-immunecell-count-is-not-a-functional-reset)\n-
    [Other fasting research shows context matters](#other-fasting-research-shows-context-matters)\n-
    [What the study does not establish about aging](#what-the-study-does-not-establish-about-aging)\n-
    [Safety cannot be inferred from the word natural](#safety-cannot-be-inferred-from-the-word-natural)\n-
    [How commercial claims can outrun the evidence](#how-commercial-claims-can-outrun-the-evidence)\n-
    [What a decisive human trial would need to measure](#what-a-decisive-human-trial-would-need-to-measure)\n-
    [Separating a change from a benefit](#separating-a-change-from-a-benefit)\n- [A
    valuable mechanism without a proven human reset](#a-valuable-mechanism-without-a-proven-human-reset)\n\nIt
    did not demonstrate that a single 72-hour fast resets the entire immune system
    in healthy people. The distinction between mouse regeneration experiments and
    early human observations is essential to understanding what the paper actually
    established.\n\nThe work remains scientifically interesting because it connected
    nutrient-sensitive signaling with the behavior of hematopoietic stem cells. These
    cells help replenish blood and immune-cell populations throughout life.\n\nBut
    a mechanism worth studying is not the same as an established self-treatment. This
    article examines the original findings, the later human feasibility study and
    why the word reset can obscure important limits in the evidence.\n\n## The immune
    system is not a single object\n\nThe immune system comprises many kinds of cells,
    tissues and communication pathways. Blood measurements capture part of that system,
    but they do not provide a complete inventory of every immune cell or its function.\n\nSome
    cells circulate, while others reside in tissues or move between compartments.
    A change in the number found in blood can reflect movement as well as production,
    survival or loss.\n\nThat is why fewer circulating cells cannot automatically
    be interpreted as the removal of old or damaged cells. Likewise, a later increase
    does not by itself prove that every returning cell has been newly generated.\n\nImmune
    health also depends on more than cell counts. The ability to respond to infection,
    maintain useful immune memory and avoid harmful inflammation involves coordinated
    activity across many populations.\n\nA strong research claim should specify which
    part of the system was measured and which outcome improved. A complete reset would
    require a far broader demonstration than a change in white blood cell measurements.\n\nThe
    2014 study’s focus was the hematopoietic system, especially the response of blood-forming
    stem cells to experimental stress. That is a substantial topic without expanding
    it into every feature of human immunity.\n\n## What hematopoietic stem cells do\n\nHematopoietic
    stem cells are cells with the capacity to maintain themselves and generate the
    precursors of different blood-cell lineages. They are supported by a local environment
    often called their niche.\n\nThe balance between self-renewal and differentiation
    matters. A stem-cell population needs to preserve its long-term capacity while
    producing the cells required for ongoing function.\n\nAging and injury can alter
    that balance. Researchers study whether changes in signaling or environment shift
    the kinds of cells produced, their resilience or their ability to recover after
    damage.\n\nIn this setting, the word regeneration refers to restoring or replenishing
    aspects of a blood-forming system. It does not necessarily mean replacing every
    immune cell or erasing a person’s immune history.\n\nExperiments can investigate
    these processes using cell markers, functional assays and comparisons between
    treated and control animals. These methods provide more specific information than
    a simple before-and-after blood count.\n\nHowever, findings from such experiments
    still need to be translated carefully. Mouse stem-cell behavior under a defined
    protocol is not a direct measurement of what happens after an unsupervised fast
    in an adult human.\n\n## What the USC experiment found\n\nThe researchers investigated
    repeated cycles of prolonged fasting and refeeding in mice, including animals
    exposed to chemotherapy. Their analyses examined blood-cell populations, stem
    cells and molecular signals related to growth and stress responses.\n\nThey reported
    that fasting reduced circulating IGF-1 and activity in a pathway involving protein
    kinase A, or PKA. These changes were associated with altered stem-cell behavior
    and recovery in the experimental setting.\n\nThe study also used manipulations
    of the proposed signaling pathway to investigate mechanism. That is important
    because changing a candidate pathway can provide stronger evidence than simply
    observing that it moves alongside an outcome.\n\nThe authors reported protection
    against chemotherapy-related suppression of the hematopoietic system and changes
    in age-associated lineage balance in mice. The experimental conclusions concern
    particular models, treatments and measured outcomes.\n\nThey do not establish
    that every cause of immune dysfunction responds the same way. Aging, chemotherapy
    exposure, infection, autoimmune disease and inherited immune disorders are biologically
    different contexts.\n\nNor should experimental fasting durations in mice be converted
    directly into a universal human schedule. Species differ in metabolism and physiology,
    so matching hours does not necessarily match biological exposure.\n\n## Refeeding
    was part of the experimental cycle\n\nThe study examined cycles rather than an
    uninterrupted fast considered in isolation. Recovery after food was reintroduced
    was relevant to the reported replenishment of blood-cell populations.\n\nThis
    matters because a headline can make the period without food sound like the entire
    intervention. In reality, the physiological response can change between nutrient
    deprivation and the return of nutrients.\n\nA cell under limited nutrient availability
    may alter growth, maintenance or stress-response pathways. The subsequent availability
    of nutrients can support a different set of activities, including proliferation
    and replenishment.\n\nThat sequence is a biological hypothesis to test, not a
    reason to improvise a protocol. The timing, nutritional context and health of
    the organism can all affect the response.\n\nStudying a cycle also requires more
    than taking one blood sample at the end of a fast. Measurements at several points
    help distinguish a transient shift from a persisten"
