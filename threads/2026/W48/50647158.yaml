  author: wahern
  text: It&#x27;s also a good way to better understand your body, become more self-aware
    about food cravings, etc.<p>I tried fasting a few times during one of the recurring
    lemonade fast fads. I managed two or three week-long fasts, plus some aborted
    attempts.<p>The 3 day mark, plus or minus a day, is almost universally the reported
    time it takes until your intense food cravings subside. Why that is and whatever
    else it might reflect or coincide with are interesting questions with varying
    answers. But just experiencing it first-hand is worthwhile. It provides sharp
    contrasts wrt your mental and physiological state that simply can&#x27;t be fully
    appreciated analytically.<p>It&#x27;s worthwhile to target something longer, like
    5-7 days, to make sure you spend a couple of days in a full fasting state. The
    days leading up to the transition can be utterly miserable, but once you settle
    into the fasting state it&#x27;s something else entirely.<p>You don&#x27;t need
    to do a water fast. It&#x27;s not uncommon to consume somewhere between 300-900
    calories per day, depending on whether you&#x27;re working and other activity.
    But absolutely no solid food as your digestive tract (mostly) shutting down is
    part of the effect. I hated the maple syrup, lemon juice, and cayenne concoction,
    so often just drank Snapple and an occasional nutritional fruit slurry or even
    soda. (I was never a believer in detoxing hoodoo.)<p>And give yourself a good
    2 or 3 days before returning to regular meals. First day off I might have some
    pieces of fruit. I dunno what the best way to come off is (tons of advice online),
    just that you absolutely want to introduce fats, oils, and meats very slowly,
    otherwise it&#x27;s bad times.
