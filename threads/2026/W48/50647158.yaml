  text: As explained in another comment, this is exactly the meaning.<p>Prolonged
    fasting causes a part of the cells of the immunity system to die, presumably the
    less healthy cells.<p>After fasting, the immunity system is regenerated from the
    surviving cells, which are supposed to have been the healthier among the original
    cells, so the immunity system is supposed to become &quot;reset&quot;.<p>So fasting
    is assumed to be like setting up a life-or-death competition for the cells of
    the immunity system, so that only the fittest will survive.
