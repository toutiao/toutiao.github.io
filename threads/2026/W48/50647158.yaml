  author: ivewonyoung
  text: They&#x27;re especially useful for the first and second day. When insulin
    goes low because you&#x27;re not consuming carbs, it signals the kidneys to dump
    sodium into urine instead of holding on to it and recycling it. Plus, glycogen
    reserves are 3&#x2F;4th water which leads to more peeing. Fat burns into CO2 and
    water which is peed out, and everytime you pee there&#x27;s some electrolyte loss.
    You&#x27;re not eating food which resupplies electrolytes.<p>I found that lack
    of electrolytes is the main cause of not being able to sleep well when I fast
    or skip dinner.
