  author: pessimizer
  text: "&gt; I don&#x27;t really believe anyone who says otherwise has actually done
    a multi day fast.<p>Nah. I&#x27;ve fasted for a week more than once, the first
    times when I was young and involuntarily. Not bothered by hunger at all after
    the second day. After a week you&#x27;re getting pretty miserable, though, but
    it also doesn&#x27;t feel anything like the first couple days, you&#x27;re actually
    weak and getting physically incapable.<p>I&#x27;ve done intermittent fasting for
    6 months at a time, multiple times, where I limit myself to 400 calories on Mondays,
    Wednesdays and Fridays (and make no other changes.) I really think that the misery
    over the first couple days of not eating is in a way your body gaslighting you.
    You&#x27;re not in any danger at all; you could go weeks without eating and you&#x27;ve
    only gone hours. Unless you&#x27;re absurdly lean already, you have ample stores
    to do anything that you would wish to do. I&#x27;m convinced that long periods
    of intermittent fasting train that reflexive panic out of you.<p>It&#x27;s like
    how people can&#x27;t hold their breaths very long without practice, although
    it would be minutes before they were in any real danger. It&#x27;s a very strong
    survival reflex, not any actual peril. If you can fight your way through it, you
    forget about it pretty quickly."
