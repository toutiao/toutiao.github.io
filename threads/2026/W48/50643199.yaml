  text: I&#x27;m responding so future readers see the answer, because oooh boy am
    I not engaging with this account.<p>The curly braces shortens the lifespan of
    the `MutexGuard` so it gets unlocked before the body of the if-statement. Normally,
    the temporary used in the if-let pattern lives until the end of the if-statement.<p>This
    wouldn&#x27;t compile if the value guarded by the Mutex wasn&#x27;t trivially
    copyable, but it is.<p>(Note how none of this is UB, just a particularly contrived
    way to introduce a deadlock.)
