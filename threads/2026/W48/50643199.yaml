    In C++, `int x;` leaves the int uninitialized, which isn&#x27;t really constructing at all. In rust (which I program in lately so I&#x27;ll use it as the example) you simply can&#x27;t use uninitialized variables in the first place without unsafe code, so the equivalent would either be:<p><pre><code>  let x: i32;
      foo(x); &#x2F;&#x2F; compiler error
    </code></pre>
    or if you really wanted to use uninitialized memory,<p><pre><code>  let x: i32 = unsafe { std::mem::uninitialized() }; &#x2F;&#x2F; compiler warning
      foo(x);
    </code></pre>
    which, in rust, can be done with any other type too (substitute i32 for any T and the above examples are identical.) I don&#x27;t see anything different about built-in types here vs standard ones, other than the compiler has literals for the built-ins, which is more a consequence of rust not allowing <i>literals</i> for library types. But that&#x27;s a very different discussion.<p>I guess the argument might be that for C++, they want the author <i>of the type</i> to determine whether the value should be left uninitialized on declaration&#x2F;construction, instead of the caller. Which is... not exactly the semantics I would have chosen.
