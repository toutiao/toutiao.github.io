  text: 'MaybeUninit::uninit().assume_init() is, exactly like the deprecated† core::mem::uninitialized()
    immediately UB unless your type is zero size and thus there&#x27;s no difference
    between initialized and uninitialized.<p>You can unsafely ask for an uninitialized
    value of any type, but you <i>should not</i> ever assert that you&#x27;ve initialized
    it unless you actually have. Essentially, you can write this in Rust, but you
    need to be specific about what you&#x27;re doing and when you are or are not initializing
    the variable or else things will go badly for you.<p>It wouldn&#x27;t be <i>worse</i>
    in C++, historically, but C++ people are more used to their world being set on
    fire by an angry compiler because they did something wrong. In Rust you&#x27;d
    be quite surprised by the compiler&#x27;s wrath.<p>† Edited to add: Technically
    <i>today</i> you do not get this if you call core::mem::uninitialized, because
    it was so dangerous, instead if you call the deprecated function on a non-ZST
    - ironically you get a a value scribbled with 0x01 bytes. Doing this ensures in
    most cases LLVM won&#x27;t set fire to your program immediately but at a price
    of doing all that extra work of writing 0x01 bytes. But we did tell you (for several
    years now) how to do better.'
