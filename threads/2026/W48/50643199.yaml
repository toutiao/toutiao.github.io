  author: coldpie
  text: Learn (like, really learn) C first.  C is a reasonably easy language to learn,
    with only a few weird corners mostly due to its relevance to very old computing
    concepts.  Build a few toy programs, maybe a video game or two, play around with
    memory allocations and struct aliasing and file I&#x2F;O and function pointers.<p>C++
    is (wave hands vigorously) roughly built on top of C&#x27;s core concepts, so
    if you know C really well you can (continue waving hands) actually map most of
    C++&#x27;s basic concepts on top of how C works.  For example in object methods,
    the &#x27;this&#x27; pointer is actually just silently passed as the first parameter
    to a function.  Class vtables are (at a very abstracted level) just arrays of
    function pointers.  Letting you map those concepts down to a simpler representation
    like C means C++&#x27;s magic starts to lose its magic. Understanding how the
    class hierarchy is mapped to C can tell you why the &#x27;virtual&#x27; keyword
    exists, and why you need proper copy constructors for those objects but not ones
    without vtables; and it gives clues for what pure virtual functions are, and why
    you can&#x27;t allocate an object with one.<p>So yeah.  Start with C, then figure
    out the bizarre, incredibly complex maze of abstractions that C++ stacked on top
    of it.
