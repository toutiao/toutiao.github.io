  author: ninkendo
  text: |-
    Yep, that&#x27;s std::mem::zeroed(), which just writes zeroes into the allocated memory regardless of its type... also only available in unsafe code.<p><pre><code>    #[derive(Debug)]
        struct Foo {
            _i: i32,
        }

        fn main() {
            let x: i32 = unsafe { std::mem::zeroed() };
            println!(&quot;x={x}&quot;);
            let f: Foo = unsafe { std::mem::zeroed() };
            println!(&quot;f={f:?}&quot;);
        }
    </code></pre>
    prints:<p><pre><code>    x=0
        f=Foo { _i: 0 }
    </code></pre>
    It&#x27;s unsafe because if Foo contained a String, it would be string with a null pointer inside it and you&#x27;d crash trying to read it. If you want &quot;Default&quot; values instead of zeroed (ie. you don&#x27;t want to run unsafe code), that&#x27;s what the Default trait is for, and this becomes:<p><pre><code>    #[derive(Debug, Default)]
        struct Foo {
            _i: i32,
        }

        fn main() {
            let x: i32 = Default::default();
            println!(&quot;x={x}&quot;);
            let f: Foo = Default::default();
            println!(&quot;f={f:?}&quot;);
        }
    </code></pre>
    and prints the same thing.
