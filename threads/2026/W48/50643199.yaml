  author: ninkendo
  text: 'Constructors are such an odd duck to me. On the one hand, you have languages
    like C++ and Swift which have construction as a first-class concept, with <i>tons</i>
    of rules you need to memorize (Swift&#x27;s &quot;convenience&quot; vs &quot;designated&quot;
    initializers are a real treat to unpack).<p>Then you have languages like Rust,
    Go, Zig, etc which don&#x27;t have them at all, constructors are just static functions
    in the namespace of the type, which return an instance of that type.<p>For the
    life of me I&#x27;ve never understood why you&#x27;d want the former. I&#x27;m
    sure there&#x27;s a reason, but I never miss it when using languages in the latter
    category.<p>The explanation you typically hear is about OO and inheritance, but
    I don&#x27;t buy it: If Animal had a ::new() that initialized private state, Cow
    could have a ::new() too that could call Animal::new() if it wanted, then do further
    initialization, etc... I don&#x27;t think there&#x27;s anything about inheritance
    that says constructors are a must. (Edit: In fact, ObjC does exactly this. I should
    have remembered that given that I did ObjC for a living for a while.)'
