  text: "&gt; This makes it a terrible language for actually getting things done,<p>The
    thing that I like about C++ the most is that it&#x27;s best language for actually
    getting things done.<p>The &#x27;problem&#x27; with C++ is that people who want
    to get things done go to the committee and say, &quot;hey, I need to actually
    get things done, if you add this language facility, I can actually get things
    done better,&quot; and they&#x27;ll often just say &quot;ok&quot; and add it to
    the language. And if you&#x27;re the sort of person who believes you <i>must</i>
    use every single facility provided by the language, then you walk away from C++
    thinking it&#x27;s too complicated. But if you&#x27;re the sort of programmer
    who&#x27;s only interested in getting things done, you can simply ignore all that
    noise and just actually get things done with the facilities that you know and
    like.<p>You don&#x27;t <i>have</i> to use deeply nested templates, complex dynamic
