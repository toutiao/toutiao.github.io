  author: tialaramex
  text: For many years now, <i>This function is deprecated. Use MaybeUninit&lt;T&gt;
    instead.</i><p>core::mem::uninitialized is of course unsafe, but what people who
    designed it hadn&#x27;t really appreciated was that in most cases it was impossible
    to use it correctly, it almost might as well have been a call to core::hint::unreachable_unchecked<p><i>If</i>
    your type is a ZST then core::mem::uninitialized was safe to use, because not
    initializing zero bytes of RAM is the same as initializing all zero of them, this
    can&#x27;t possibly matter so we&#x27;re fine. Otherwise though, we create values
    which the LLVM backend is sure we cannot know and so it feels entitled to optimise
    as if any assumptions we make about those values are false, even if the results
    are contradictory. This causes immediate Undefined Behaviour all over the place.<p>The
    MaybeUninit&lt;T&gt; wrapper type is pretty easy to use and won&#x27;t invoke
    Undefined Behaviour so long as you do everything in the instructions.
