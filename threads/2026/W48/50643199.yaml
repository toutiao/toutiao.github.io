  text: |-
    I&#x27;d say C++ is so vast that you can keep on encountering bell curves like that. I start working on a project, building confidence in the subset of C++ I&#x27;m working with and when I start feeling good about myself, I&#x27;m hit with a completely foreign concept<p>cppquiz is a nice test beyond &quot;trivia&quot;. There are a few hard questions addressing topics I&#x27;ve never encountered. For example:<p>```<p>#include &lt;iostream&gt;<p>volatile int a;<p>int main() {
      std::cout &lt;&lt; (a + a);
    }<p>```<p>I would assume that here a is initialised to 0 since it has static lifetime so I&#x27;d expect this to just print 0. But the C++ standard specifies that:<p>&gt; Reading an object designated by a volatile glvalue ([basic.lval]), modifying an object, calling a library I&#x2F;O function, or calling a function that does any of those operations are all side effects, which are changes in the state of the execution environment. Evaluation of an expression (or a subexpression) in general includes both value computations (including determining the identity of an object for glvalue evaluation and fetching a value previously assigned to an object for prvalue evaluation) and initiation of side effects. When a call to a library I&#x2F;O function returns or an access through a volatile glvalue is evaluated the side effect is considered complete, even though some external actions implied by the call (such as the I&#x2F;O itself) or by the volatile access may not have completed yet.<p>and if you have side effects unsequenced relative to other side effects (as is the case with operations of the same operand), this is considered UB
