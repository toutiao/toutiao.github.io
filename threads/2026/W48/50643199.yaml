  author: LeFantome
  text: Very true of course, but there is a difference.<p>For what HTML and CSS get
    used for, the consequences of not knowing everything are fairly low. If it does
    what you want, it does what you want. Things could maybe be better but they are
    probably also fine.<p>SQL is mostly the same though perhaps the performance implications
    of not knowing it well are higher.<p>For .NET, Java, and Python things are not
    much different. If they do what you want, there is probably not much risk that
    they are doing things you don’t.<p>JavaScript and, even more dramatically, C++
    are quite different. They may be doing what you do not want, or it may be easy
    for others to make your code do things you do not want. Not understanding the
    nuance or idiosyncrasies in those languages can do a lot of damage.<p>Complexity
    has another angle. If I am working with other people’s Python code, the chance
    that I will not understand it is low. If I do come across a new feature in .NET
    or Java, I will spot it right away and will probably be able to research it, learn
    it, and move on very quickly. Same with HTML and CSS. .NET and CSS are great examples
    of languages with quite a bit of complexity but where the burden of that complexity
    is reasonable when maintaining code.<p>But again, JavaScript and C++ are not that
    way. C++ code using features I am not familiar with can be a massive burden to
    unpack and understand. I may not even realize at first that something I do not
    understand is in play. And, as above, I may not actually understand it as well
    as I think I do. And that lack of understanding may have surprising consequences.<p>To
    your point, A LOT of work still gets done. But perhaps less re-work (so more work)
    and less risk is possible.
