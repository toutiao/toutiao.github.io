  text: |-
    Yeah no. I read the issue and it seems pretty reasonable. Ansible makes sudo's prompt into a string which contains a key, and then match on that string; meaning they use the --prompt option to turn Sudo's prompt into something like:
    [sudo via ansible, key=spnnznrgscgdxdontsjkwrlyghiiglxk] password:

    and then look for a line which matches that.
    So when sudo-rs instead prints the line:
    [sudo: [sudo via ansible, key=spnnznrgscgdxdontsjkwrlyghiiglxk] password:] Password:

    then Ansible intentionally doesn't match that, because it doesn't match the intended, explicitly provided output.
    And Ansible looks for the expected string at the start of the line, because some configurations cause every command that's executed to be printed, and they don't want to match a line like:
    +sudo --prompt '[sudo via ansible, key=spnnznrgscgdxdontsjkwrlyghiiglxk] password:'

    which you would get with e.g set -x.
    So it's that extra "[sudo: " prefix which messes up the match; that's the "extra string" that sudo-rs prints before the prompt.

    When I first read the part you quoted I assumed that Ansible just got confused by an extra line that sudo-rs prints, and I would've agreed, that's not very robust. But to me, it seems like Ansible has implemented this "wait for the sudo prompt" logic in a way that's impressively robust. I probably would've either done it in the same way or found a worse solution.
