  content: "![](https://images.ctfassets.net/3091ajzcmzlr/DjtrukPcrZdJZjXdIqlhU/224c70b47b1012bd2d4067ba565b0c9b/1password.jpg?w=3840&q=70&fm=avif)\n\nby
    1Password\n\nNovember 25, 2026 - 4 min\n\n ![](https://images.ctfassets.net/3091ajzcmzlr/3yu0DTU3edoU7HK8MxkW54/c5e7801fb8c0d7d52295da96af7e8013/business_2x.webp?w=3840&q=70&fm=avif)\n\n##
    Related Categories\n\n- [Security](/blog/categories/security)\n\n## **What happened**\n\nOn
    November 19, 2026, 1Password began investigating indications that an attacker
    gained access to an employee’s corporate GitHub account. The actor used the account
    to access source code and push malicious code to backend services, which downloaded
    administrative data pertaining to our customers. This data included customer names
    and email addresses, in addition to non-secret internal metadata about the account.
    At no time were customer vault contents accessed by, or available to, the attacker.\n\n##
    **What information was affected**\n\nThe attacker downloaded account records for
    a subset of our users. These records include:\n\n- Names and email addresses\n\n-
    Account and user identifiers, and account creation and last sign-in times\n\n-
    Public keys (which are public by design, this has no impact to user security)\n\n-
    [Secure Remote Password](https://1password.com/blog/developers-how-we-use-srp-and-you-can-too)
    protocol parameters (which cannot be used to access your account) \n\n- Tokens
    present in certain emailed links for invitations, provisioning and account recovery\n\n-
    Other non-secret account metadata relative to our internal architecture (e.g.
    version numeric identifiers, file numeric identifiers)\n\nThe attacker also copied
    source code from private repositories and gained access to our CI/CD system. Our
    source code is not customer data, and contains no user secrets. CI/CD contains
    infrastructure related secrets in order for our product to work. We have triggered
    a rotation of all credentials which may have been exposed, and there is no impact
    to 1Password’s services, availability, or product security.\n\nWhen we send an
    email to a customer to accept a provisioning invite to an account, or to accept
    recovery of their account, it contains a token. A provisioning invite is specifically
    used for our [SCIM Bridge](https://support.1password.com/cs/scim/) or [Hosted
    Provisioning](https://support.1password.com/provisioning/). During this incident
    there were a small number of users in this state, who have been specifically notified.
    This token is used to complete the invitation or recovery process, but only when
    combined with an SSO sign-in or a six digit code sent to the user's registered
    email address. The token is not able to get access to the account by itself. In
    order to reduce the ability for a malicious third party to successfully guess
    the code, we’ve expanded the code from six numeric digits to ten alphanumeric
    digits. This makes brute force guessing practically impossible.\n\n## **What was
    not affected**\n\n- Your vaults and the items in them\n\n- The keys that protect
    your vaults \n\n- Account recovery keys\n\n- 1Password apps and browser extensions\n\n##
    **What we’ve done**\n\n- Disabled the affected GitHub account, revoked the stolen
    token, and removed the access the attacker created.\n\n- Rotated or revoked all
    internal credentials which may have been exposed.\n\n- Lengthened the codes used
    in invitation and recovery emails from six digits to ten characters as a precautionary
    measure.\n\n- Tightened internal GitHub, CI/CD, and endpoint controls, and added
    new detections for this kind of attack.\n\n- Validated no internal evidence of
    user account takeovers or compromise using any exposed account provisioning tokens.
    \n\n- Brought in independent cybersecurity experts to validate our containment
    approaches and remediation efforts.\n\n## **What you can do**\n\n- Be cautious
    about phishing attempts in the form of unexpected emails, texts or calls that
    mention 1Password, invitations, or account recovery attempts. \n\n- 1Password
    will never contact you to ask for your account password or Secret Key. Only enter
    them in the official 1Password app, or on our official website, and only when
    you’ve opened the app or typed the address yourself. Your Secret Key is only needed
    the first time you sign in on a new device or browser. \n\n- Keep your Secret
    Key and account password safe.\n\n- If you see something suspicious, tell us at
    support@1password.com.\n\n## **Our commitment to you**\n\nYou trust us with some
    of the most sensitive information you have. 1Password is designed so that a breach
    of our systems can’t expose your vault contents. Your vault secrets are encrypted
    with keys that only you hold, so we can’t access them, and neither can an attacker
    who gets into our servers.\n\nWe are committed to transparency in the interests
    of our customers' security and the security of the broader industry, which is
    why we have published and maintained our [Security Whitepaper](https://agilebits.github.io/security-design/)
    since 2015.&nbsp; We’ll keep this blog post current, and we’ll update it if we
    find anything that changes what we’ve said here."
