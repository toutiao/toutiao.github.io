  text: Why would looping be overly dangerous? An <i>n</i>-fold looped model is entirely
    equivalent to a model with <i>n</i> times the number of params, that just happen
    to be shared across layers. (In fact, a bit less than that, since only a fraction
    of middle layers are usually looped.) If anything, it&#x27;s a cheap way to explore
    what issues much larger models might present from a safety perspective, without
    these models having the in-built knowledge to actually pose that much danger (Because
    real-world knowledge scales with total, non-shared params).
