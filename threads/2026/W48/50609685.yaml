  author: igorkraw
  text: People&#x27;s mental model is often that the bleeding edge of X is a couple
    of great insights that just make things go, that are secreted away in some government
    or corporate lab, and that can only be found via hard to replicate feats of genius.<p>The
    reality is that moats are generally built up via soft knowledge of how to dial
    in massive bags of tricks, some of which might be trade secrets, some of which
    might be publicly known, but rarely is it a thing that people &quot;in the know&quot;
    wouldn&#x27;t come up with if given sufficient budget.<p>Looped transformers have
    been an ongoing research since the beginning (universal transformers) and I think
    it&#x27;s unlikely that z.ai was not gonna independently discover it, it being
    leaked was just what made it a new thing to market their &quot;catching up&quot;
    model + maybe shifted some resources earlier rather than later.<p>The whole interpretability&#x2F;AI
    safety narrative is bogus rebranding of capability research (Debugging tools and
    improving training for what the principals, i.e. the model providers care about)
    and the idea that a model becomes less interpretable via Looping is humbug - the
    raw trace was already only loosely connected to the final answer and any monitoring
    at scale was using statistical associations and pattern détection which you can
    also do on the looped latent states, it just requires you to shift your mental
    model from &quot;listening to AIs thoughts&quot; to &quot;monitor an engineered
    system for abnormal&#x2F;risky states&quot; which is what it was before already,
    just with anthropomorphism sprinkled on top.
