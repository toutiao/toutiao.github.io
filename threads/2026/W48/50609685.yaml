  author: incrediblylarge
  text: Could a looped setup possibly remove the ability for penalties to be applied
    to the model for exhibiting undesired thought traces, while also reducing constraints
    on the space of possible solutions? My thinking is as follows. If the CoT is visible
    as natural language, a loss term can be applied that discourages thoughts judged
    to be unethical etc. My understanding is that such regularisation, since it is
    unlikely orthogonal to the reward direction, can reduce model performance on the
    main task. I am not sure whether this is accurate in general. However, assuming
    that it is, looping removes the possibility of applying such feedback, contributing
    to better performance through lower constraints, but also inadvertently inducing
    undesired behaviours if they increase the expected reward.
