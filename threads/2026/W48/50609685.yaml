    model would have the same or better COT controllability as a N&#x2F;2-layer model
    looped twice. But I think the issues comes from the fact that looping allows training
    deeper models without it being prohibitively expensive. While if there was no
    looping, most would simply not train models with such effective-depth.<p>Either
    way, something like looping (more latent space thinking) was inevitable IMO.
