  author: Majromax
  text: "&gt; Could a looped setup possibly remove the ability for penalties to be
    applied to the model for exhibiting undesired thought traces, while also reducing
    constraints on the space of possible solutions?<p>No, a looped setup does not
    change this configuration.  A looped transformer of total length 2N (N layers,
    looped once)) has the same number of internal states as a standard transformer
    of length 2N (2N layers, not looped).  In both cases, the chain of thought is
    only visible in the output.<p>The conclusion that looped transformers are uniquely
    dangerous requires simultaneous beliefs both that depth scaling is powerful&#x2F;dangerous
    (reasonable, under the &#x27;reasoning happens by the layer, not by the token&#x27;
    idea) <i>and</i> that depth scaling is easier or only possible via looping."
  score: 0
