  author: LarsKrimi
  text: |-
    If you have infinite time, a HDL will likely produce better results than a HLS system.<p>The idea of HLS is that you get decoupled from the hardware and can concentrate on high-level types and the algorithm design instead. A good HLS compiler will be able to make a near optimal mapping of that for pipelines, for example using SAT solving.<p>In DSP algorithms things like rounding and saturation is absolutely terrible to write in HDLs if you want to do it with sufficient clock speeds. With untimed HLS it&#x27;s a breeze.<p>In short it&#x27;s a tradeoff, the right tool for the right job. If you need accurate timing or absolutely want a specific structure or to take advantage of FPGA primitives, sure an HDL is probably the right choice.
    If you need it quickly, with high performance and free of bugs go with your favorite (and preferably homemade :)) HLS
