  author: tensegrist
  text: 'think of a cube as a graph: how many edges do you need to get from one vertex
    to another, in the worst case?<p>we can ask this question more generally for &quot;polytopes&quot;
    — graphs that generalize the notions of polygons and polyhedra<p>the original
    hirsch conjecture said for an n-faced polytope of dimension d you do not require
    any more than n-d steps to get from any vertex to any other, which is false<p>the
    polynomial hirsch conjecture relaxes this to the existence of some constant k
    for which the bound is O(n^k)'
