  author: Luke2642
  text: I always like to try to translate it to a really simple English version:<p>You
    can represent many problems like logistics with a list of linear requirements
    so valid combinations form a multi-dimensional geometric shape where every corner
    of that shape and inside that shape represents a &#x27;valid&#x27; but probably
    not optimal solution, e.g. every package gets delivered by a driver, but not the
    lowest fuel or time, and &#x27;valid&#x27; so no rules are broken, like no driver
    is scheduled more than &gt;24 hours in one day.<p>Every edge is a single step
    that changes one variable. It&#x27;s interesting and useful because surprisingly
    the representation means the optimal solution will always lie on an outside corner.
    You generally start somewhere &#x27;warm&#x27; and try to get hotter, that&#x27;s
    the Simplex algorithm.<p>The polynomial Hirsch conjecture was that the number
    of steps between any two corners grows polynomially as you add more variables
    and rules, limiting how many steps you might need to find that optimal corner.
    Now we know you need more steps.<p>Hope I saved you time&#x2F;tokens though.
