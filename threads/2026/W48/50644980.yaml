  author: luiwammus
  text: The original result from 2010 implied that the paths were longer by a small
    linear factor (I believe 1.05n), so many people still held out hope that efficient
    simplex algorithms could exist that would take e.g. 2n steps. This result completely
    kills such hope as it shows that there is a family that has super-polynomial (in
    n) diameter . So it is much more than a &#x27;mopping up&#x27; result, it was
    one of the biggest open questions in Optimization, and has a big impact on the
    community.
