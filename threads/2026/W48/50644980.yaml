  author: mattalex
  text: |-
    Most general convex solvers used in production are interior point solvers.<p>For LPs, simplex frequently ends up better because it is naturally well conditioned (you don&#x27;t need e.g. LU factors), and because solutions are basic you can use row generation to add in constraints as they become relevant.<p>The latter is particularly helpful for combinatorial optimization or when iteratively refining linearizations of convex problems.<p>Interior point for LPs become interesting when your problem is somewhat degenerate.
    In well structured problems one can exploit the polytope surface to quickly step through bases without needing to factorize or even materialize large matrices
