  author: mattalex
  text: |-
    I cannot talk about gurobi specifically, but that&#x27;s not an uncommon approach for pure LPs and root MIP relaxations.<p>Simplex is pretty single threaded since you perform many sequential pivots. If you want to parallelize you basically have to use things like parallel pricing.
    This is of course also true for interior point, but the difference is that interior point uses fewer, larger steps, which work more nicely on parallel hw.<p>for milp this is less useful since you want a basic solution and warm start is much better done with a dual simplex.<p>There are still some big things you can do for simplex, e.g. we get closer and closer to block pivots becoming viable.
