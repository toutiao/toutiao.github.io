  author: tczMUFlmoNk
  text: 'While &quot;Θ(n^2.25)&quot; is better, imho it&#x27;s still misleading. Matrix
    multiplication is a <i>problem</i> that can be solved by <i>algorithms</i> whose
    running times (under various conditions) are <i>functions</i>. &quot;Being Θ(n^2.25)&quot;
    is a property of a function, not an algorithm, and not a problem. There are matrix
    multiplication algorithms commonly used whose worst-case running times are most
    certainly not Θ(n^2.25) (namely, all of them known before last month). One could
    precisely say that &quot;an optimal algorithm for matrix multiplication has worst-case
    running time Θ(n^2.25)&quot; or &quot;optimal matrix multiplication takes time
    Θ(n^2.25)&quot;, though personally I think that the paper&#x27;s formulation is
    cleanest: the matrix multiplication constant is ω = 2.25.<p>This may seem pedantic,
    but misconceptions about the meanings of big-O&#x2F;Theta&#x2F;Omega notation
    are very common (e.g., conflating them with &quot;best&#x2F;average&#x2F;worst
    case&quot; or other such nonsense) and they muddy the waters.'
