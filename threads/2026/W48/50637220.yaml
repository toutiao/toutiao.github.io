  author: zone411
  text: |-
    For context, OpenAI&#x27;s 4 new papers resolve 8 problems of the Top 500 Open Problems in Math list (LLM ranked, <a href="https:&#x2F;&#x2F;proofatlas.ai&#x2F;open-problems&#x2F;" rel="nofollow">https:&#x2F;&#x2F;proofatlas.ai&#x2F;open-problems&#x2F;</a>).<p>They include:
    #25 — Matrix-multiplication exponent equals two. The paper gives the exact exponent 9&#x2F;4 over every field, refuting the conjecture.<p>#89 — Strongly polynomial linear programming (Smale’s ninth problem). The same paper also gives polynomial-time algorithms for
    #64 — Mean-payoff games,
    #65 — Parity games,
    #340 — Condon’s simple stochastic games.<p>#183 — Polynomial diameter bound for polytopes,
    #130 — Polynomial pivot rule for the simplex method, both refuted. Some pairs of vertices are superpolynomially far apart.<p>#137 — Erdős–Rado sunflower conjecture. For every fixed number of petals r, the paper proves the conjectured Cᵣᵏ bound.<p>(rankings post Riemann (#2) and VP vs VNP (#31)).
