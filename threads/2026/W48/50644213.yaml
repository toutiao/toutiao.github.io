article:
  url: https://shellzine.net/cyberpunk-television/
  title: Cyberpunk Television Shows | Live Action TV & Mini-Series – SHELLZINE
  fetch_status: success
  content: "![](https://shellzine.net/wp-content/uploads/2019/09/cyberpunktelevisiontitle.jpg)\n\n[Cyberpunk
    Media Index](https://shellzine.net/category/aesthetics/cyberpunk-media-index/)\n\n#
    Cyberpunk Television Shows | Live Action TV & Mini-Series\n\nby [admin](#)\n\n_27.4K_\n\n_This
    is a short list of TV series in the cyberpunk genre, sorted by their initial release
    dates. Each title includes a set of relevant science fiction themes, a brief synopsis
    and what value the film may have for viewers. New entries will be added periodically._\n\n*
    * *\n\n![](https://shellzine.net/wp-content/uploads/2022/12/maxheadroom.jpg)\n\n**Max
    Headroom** | Date Released: 1987 | # of Episodes: 14 | [Trailer](https://www.youtube.com/watch?v=gZqhd9UTBFs)
    \ \nThemes: Corporatism, Technological Society, Dystopia, Satire  \nSynopsis:
    In a dystopian future, the world is ruled by television networks, enjoying more
    power than even the government. Their goal: making everyone watch TV. With the
    advance of supervision technology, televisions monitor the viewers physical movements
    and thoughts. Technology, which does not benefit televisions, is being destroyed.
    Only a single journalist tries to stand tall against big TV. After his untimely
    demise, the journalist’s mind is reconstructed in the form of Max Headroom, a
    snarky television narrator.\n\n* * *\n\n![](https://shellzine.net/wp-content/uploads/2020/12/wildpalms.jpg)\n\n**Wild
    Palms** | Date released: 1993 | # of Episodes: 5 | [Trailer](https://www.youtube.com/watch?v=sJMPCGo42cE)
    \ \nThemes: Augmented Reality, Virtual Reality, Deep State Conspiracy, Hyper Reality
    \ \nSynopsis:&nbsp; Bruce Wagner’s highly compelling television mini-series that
    only got one season. Ahead of its time, cyberpunk Twin Peaks would be an apt description.
    The show is a soap opera mystery that is low on action but has a number of very
    powerful and graphic scenes to match the at times humorous dialogue and ominous
    political subtext. The plot revolves around the seemingly mundane existence of
    a California patent attorney named Harry, whose life begins to unravel when an
    old flame comes to him asking for help to find her missing son. The deeper Harry
    gets involved, the more it becomes obvious that his entire life was a fabrication.
    Virtual reality technology combined with pharmacological triggers are one of the
    pervasive cyberpunk themes in Wild Palms. William Gibson provides a cameo appearance
    early on in the series. For those who appreciate cyberpunk that makes them think,
    this is a must watch. After viewing, check out Wagner’s graphic novel of the same
    name which is much more comprehensive than the television show. Available on the
    public domain for download in numerous formats on[archive.org](https://archive.org/details/WildPalms).\n\n*
    * *\n\n![](https://shellzine.net/wp-content/uploads/2026/11/robocop_the_series_1994.jpg)\n\n**RoboCop:
    The Series** | Date Released: 1994 | # of Episodes: 22 |[Trailer](https://www.youtube.com/watch?v=962L4xPlBfI)
    \ \nThemes: Cybernetics, Corporatism, Artificial Intelligence, Dystopia  \nSynopsis:
    Set several years after the events of Paul Verhoeven’s 1987 film, the series follows
    Alex Murphy, played by Richard Eden, as he polices the streets of the newly completed
    Delta City. The series explores various technological and social problems arising
    from the corporate administration of the metropolis by Omni Consumer Products
    (OCP), including automated surveillance, black-market organ trafficking and computer
    crime. While retaining some of the corporate and consumerist satire of the original
    film, the series was produced for a younger audience, with considerably less graphic
    violence and a more comic book-like interpretation of the RoboCop universe. Interestingly,
    the feature-length pilot was adapted from an unused screenplay for RoboCop 2 by
    the writers of the original film.\n\n* * *\n\n![](https://shellzine.net/wp-content/uploads/2024/10/tekwar.jpg)\n\n**TekWar**
    | Date Released: 1994 | # of Episodes: 18 (+ 4 TV films) | [Trailer](https://www.youtube.com/watch?v=RRmjV8rsaHo)
    \ \nThemes: Virtual Reality, Computer Crime, Cybernetics, Technological Society
    \ \nSynopsis: Based on the series of novels conceived by William Shatner, TekWar
    is set in 2044 and follows Jake Cardigan, a former police officer framed for murder
    and trafficking in Tek, an illicit digital narcotic that induces addictive virtual
    reality experiences. Following his release from cryogenic imprisonment, Cardigan
    is employed by a private security corporation to investigate the criminal underworld
    responsible for the distribution of Tek. The production began with four made-for-television
    films in 1994 before being developed into an episodic series. Its early computer-generated
    imagery, virtual reality sequences and futuristic interpretation of the narcotics
    trade are characteristic of 1990s cyberpunk media.\n\n* * *\n\n![](https://shellzine.net/wp-content/uploads/2022/12/vr5ss.jpg)\n\n**VR.5**
    | Date Released: 1995 | # of Episodes: 13 | [Trailer](https://www.youtube.com/watch?v=Ioj3uqUE2Wk)
    \ \nThemes: Virtual Reality, Computer Crime  \nSynopsis: Bloom, whose father worked
    on VR but died in a car crash, discovers her fathers work accidently. By entering
    an advanced virtual reality, Bloom is able to interact with other people and affect
    the real world. Soon, she is approached by the Committee to do their bidding.
    The series emphasizes color effects by being filmed in black & white and then
    manually colored in post production.\n\n* * *\n\n![](https://shellzine.net/wp-content/uploads/2022/12/harshrealm.jpg)\n\n**Harsh
    Realm** | Date Released: 1999 | # of Episodes: 9 | [Trailer](https://www.youtube.com/watch?v=nWUSX7tqX00)
    \ \nThemes: Virtual Reality, Fascism, Dystopia  \nSynopsis: Another virtual reality-based
    show, Harsh Realm’s pilot was written by Chris Carter of The X-Files fame. The
    show was cut short after airing only 3 of its 9 episodes, with the 10th episode
    never produced and the storyline left unresolved. Interestingly, both The Matrix
