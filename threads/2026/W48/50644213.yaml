  author: echohack5
  text: 'Cyberpunk is a genre driven by movies, games, and anime. Even then the genre
    is done and all the innovation happens on the edges.<p>American TV has mostly
    failed the genre (maybe: Altered Carbon) which is why this list feels derivative
    and weak.  Ghost in the Shell (including SAC &#x2F; the new 2026 series), Serial
    Experiments Lain, Akira, The Matrix, Psycho Pass, Cyberpunk 2077 &#x2F; Edgerunners
    &#x2F; RED (2020), Shadowrun, Deus Ex &#x2F; Human Revolution, Johnny Memonic...
    they all have these subtley different visions of what &quot;cyberpunk&quot; is
    in the first place. How are you gonna get actors and writers to pin this down
    for real life? Its gonna feel too mundane.<p>I think as a whole its a difficult
    genre to pin down, and instead we now see innovation happening with elements OF
    cyberpunk rather than cyberpunk itself. Ala NieR Automata, Death Stranding, etc...
    Its the Kojimas and Yoko Taros of the world that drive things.<p>Really interested
    to see the Apple TV Neuromancer series soon'
