  author: jmyeet
  text: Cyberpunk is funny to me because it&#x27;s like 1980s xenophobia forever preserved
    in amber.<p>What was happening in the 1980s? American manufacturing had begun
    crumbling while Japan (at least up until the late 1980s) was, as many Americans
    saw it, &quot;taking over&quot;. Part of it the exotic aesthetics but really it&#x27;s
    about the fears of Japanese economic and technological dominance.<p>I&#x27;d say
    this genre peaked with <i>Snow Crash</i>. But it became clear that the future
    isn&#x27;t going to be like how VR was portrayed then. We&#x27;ve kind of moved
    on.<p>It&#x27;s said that all art is political. Science fiction is particularly
    political. George Lucas has said the inspiration for the Resistance in Star Wars
    was the Viet Cong. The original trilogy is really anti-imperialist. And The Empire?
    That&#x27;s the US. Part of the reason why the later trilogies felt so hollow
    (at least to me) is they lacked a deep and coherent theme.<p>Oh and I don&#x27;t
    know what Mr Robot is doing on that list. I don&#x27;t see it as remotely cyberpunk.
    What it is more than anything is anti-capitalist. Reading some other comments
    here it seems like people are mistaking dystopian for cyberpunk. Dystopian fiction
    existed long before cyberpunk. Like The Expanse is 100% not cyberpunk either.
  score: 0
