  author: 0x20cowboy
  text: I played around with this for a while, and I don&#x27;t think it&#x27;s possible
    without making training &#x2F; inference extremely slow - if it&#x27;s possible
    at all. The issue I think is doing back propagation against the weights and trying
    to say &quot;X training data had this much influence on this gradient run&quot;
    can&#x27;t be stored in (or inferred from) the weights. So it&#x27;d have to be
    stored externally in some kind of log which would be difficult to sort out because
    early input would have a higher movement on the weights than later input and that
    movement amount isn&#x27;t exactly related to how much it helped - also batching.<p>Then
    from there if you wanted to use it at inference time it gets harder because you
    have to know which part of the network was used the most to make that output,  and
    then somehow look that up in some table somewhere.<p>I am not a smart person so
    there might be better ways to do that, but from my gutter experiments I don&#x27;t
    think it would work with how current NN work. At least not built into the weights,
    but I&#x27;ve been playing with an external thing that hopefully help with attribution.
