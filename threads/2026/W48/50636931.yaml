  author: thuo
  text: 'I also got confused by some parts, but some parts made some sense to me:<p>&gt;
    Imagine a curiosity that aims less to know and more to make connections, build
    constellations, find links, and follow threads, functioning within a webbed network
    of relations between knowers, methods of knowing, and knowledges.<p>I understood
    this as thinking of knowledge as including what it builds upon e.g Newton&#x27;s
    law of gravity worked because it explained Kepler&#x27;s laws, and Kepler&#x27;s
    laws worked because they explained Tycho&#x27;s data, and Tycho was able to collect
    his data because of the invention of clear glass lenses, and so on.<p>&gt; As
    such, knowledge is not properly propositional but instead procedural; it is less
    concerned with knowing what than with knowing how. And its wisdom lies in “sharing”
    more than “stating.”<p>It makes sense to make that sharing the how is more important
    than sharing the what, that is the concept that underlies replication of the results
    of scientific experiments.<p>I also thought it was an interesting linguistic fact
    that curiosity used to refer to an attribute of a busybody, but that does not
    seem to help the points above because language changes, e.g terrific changing
    from a negative to a positive word.<p>Edit: After looking it up, I have found
    out that Tycho didn&#x27;t actually use a telescope, he used a sextant, and the
    higher quality of his data was because he made his own improvements to the design
    of the sextant.'
