  text: |-
    The obvious problem with using something like Lean to verify stuff written in a different programming language is that it depends on posing a theorem in Lean which is correctly stated; i.e., which correctly captures the function written in the other programming language.
    I would think that using an LLM to handle this translation would be fraught, seeing as LLMs can easily get things wrong, and one is typically disincentivized from carefully checking what the LLM came up with.
    It seems like using something like SPARK or Frama-C would be a better way to approach this. But my impression is that the SMT solver in something like SPARK is going to be relatively underpowered compared to an actual proof written in Lean. And, of course, you want your Clojure code or whatever, not Ada...
    Another interesting approach is lean-zip. But you will always be a bit limited in terms of what kinds of things are actually amenable to formal verification.
