  text: |-
    I don't think formal verification and PBT/fuzzing are really at odds: it doesn't have to be one or the other. The benefit of a model or proof checker as used here is that it is sometimes able to discover counterexamples that occur very rarely using less time than randomized techniques, because there is more information to work with. (Specifically, in randomized techniques, one treats the function as kinda a black box, whereas in formal verification one provides a model of the implementation.) Of course there's some nuance here since coverage-guided fuzzing, say, is also able to see into the program structure a bit.
    To the point that the model might disagree with the implementation, I agree but I feel that in many cases you could mitigate this by just taking the putative counterexamples from your model checker and testing it on the actual code before surfacing it as an actual issue. The original post does this:

    When Lean found a counterexample, I turned the value into a Clojure input and reproduced it in the original code.
