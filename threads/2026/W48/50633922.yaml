  author: dlcarrier
  text: There&#x27;s lots of work showing ASICs built around specific models or even
    a generic transformer architecture have huge performance advantage over GPUs.  FPGAs,
    on the other hand, need enough baked-in IP to get any reasonable performance that
    they&#x27;re just ASICs running a model on a die that also contains an FPGA.
