  author: suprjami
  text: It&#x27;s not quite that simple.<p>You can quantize some tensors heavily before
    capability drops off.<p>Other tensors really need to be kept at full size otherwise
    the model degrades fast.<p>This is the idea behind quant schemes like Unsloth
    Dynamic.<p>There are also improvements one can make during quantization, like
    EXL3 uses Hessians instead of llama.cpp&#x27;s diagonals, which should result
    in less quantization loss.
