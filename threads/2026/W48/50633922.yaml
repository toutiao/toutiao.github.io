  author: dofm
  text: "&gt; What&#x27;s a smarter model? One with more parameters and fewer bits,
    or more bits and fewer parameters?<p>There are many more variables to consider
    now. The impact of the harness, various forms of QAT, streaming experts, looping,
    post-training to reduce thinking overhead, post-training to match the harness…<p>Local
    weights models might be outgunned by frontier cloud models, but my contention
    is that if you want to be actually relevant in the future, you have to have some
    instincts for all this stuff — some broad sense of how and why. When the labs
    people say &quot;learn AI&quot;, a lot of them mean &quot;learn our SaaS product&quot;
    — learn a dependency.<p>I say, if you can run even the smallest local weights
    model (Gemma 4 E4B QAT, Nvidia Dory, Gemma 4 12B QAT, and up) you really should.
    Get a sense for what they can and can&#x27;t do, run the whole stack, get Pi,
    understand how tool calling really works, write tools, etc.<p>This is a way to
    start building the core skills, or at least the footing for the core skills, that
    develops some cognitive independence.<p>One day very soon, I think, the talk of
    open weights will be much closer to practical, much closer to necessary, and I
    think being slightly further along in understanding is going to help.<p>And I
    say this as really a perpetual novice."
