  author: dlcarrier
  text: FPGAs aren&#x27;t great at doing math.  Most of them basically cheat by having
    internal ALUs that get used for math, but a GPU has a lot more of them and will
    significantly outperform FPGAs for a given die area and power consumption, on
    the same process.<p>Where FPGAs really shine is super-low-power applications,
    like detecting wakewords for voice prompts, where the neural network has thousands
    of parameters at most.
  score: 0
  posted_at: '2026-11-24T22:48:49Z'
