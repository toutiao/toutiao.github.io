  author: PaulKeeble
  text: By default a model comes at FP16, or 2 bytes per value and this is indeed
    Qwen 3.8 with 27Billion parameters, each of which takes 2 bytes by default so
    its about a bit bigger than 54GB for the model.<p>Most people are quantising it
    (reducing the size) and early tests on this model showed it retains pretty well
    down to about q4, or half a byte per parameter which is ~16GB or so. You also
    need space for context to get anything done, multiple GBs worth of it so you in
    practice can&#x27;t really use Q4 on a 16GB card, 32GB allows the full 256k context.<p>These
    are compressing it down to 2 bits or even less per parameter on average, this
    means some parameters have more in places that matter with the goal of retaining
    as much as possible while shrinking it to fit on cards with less VRAM.
  score: 0
