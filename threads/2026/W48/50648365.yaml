  content: "## FilesExpand file tree\n\n# 02-baremetal-os\n\n## Directory actions\n\n##
    More options\n\n## Directory actions\n\n## More options\n\n## Latest commit\n\n##
    History\n\n# 02-baremetal-os\n\n## Folders and files\n\n### parent directory\n\n##
    README.md\n\n# Phase 2: Bare-Metal Bootable Qwen3-0.6B OS in 24 KB of Pure Assembly\n\nA
    standalone bootable x86-64 operating system that runs Qwen/Qwen3-0.6B directly
    on hardware or KVM with no Linux, no Windows, no C, no Rust, and no libc.\n\n-
    24,252 bytes stripped static Multiboot 1 kernel (FAST_Q8=1, default: .text = 17,143
    B, .rodata = 2,772 B, .bss = 2.1 MiB NOBITS, zero dynamic dependencies), or 23,612
    bytes (FAST_Q8=0, legacy Q8_0xFP32).\n\n- 74–94 ms cold boot to interactive asm-llm>
    multi-turn chat with persistent KV-cache across turns, all SMP cores online, and
    the .asmbin v2 (614 MiB FP16 scales) or v1 (649 MiB FP32 scales) model bound zero-copy
    from physical RAM on 2 MiB huge pages.\n\n- 100% token-exact and byte-for-byte
    parity with Phase 1 across 1..32 vCPUs.\n\n- 134.9 tok/s decode on QEMU KVM (AMD
    EPYC 7642, 16 vCPUs; 23.7 tok/s at 1 vCPU, 118.1 tok/s at 8 vCPUs, 136.6 tok/s
    peak) and 55.4 tok/s live on a 0 GB disk Proxmox VE VM (Intel Xeon E5-2670 v3,
    12 cores).\n\nRunning live on a diskless (0 GB storage) Proxmox VE VM booted from
    the hybrid BIOS+UEFI ISO (Intel Xeon E5-2670 v3, 12 cores, 2 GiB RAM):\n\n## Prerequisites\n\n-
    x86-64 CPU with AVX2 + FMA + F16C.\n\n- Core build & QEMU KVM: sudo apt install
