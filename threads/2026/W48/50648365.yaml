  author: Farmadupe
  text: |-
    There&#x27;s a few reasons why everyone is &quot;beating&quot; llama.cpp at the moment:<p>- llama.cpp is a general purpose inference engine designed to have acceptable performance on any hardware. You can now prompt an LLM to &quot;write an inference engine from scratch for qwen3-0.6b that gets 90% of the theoretical performance of the GPU in this computer&quot; and get a faster inference engine in less than an hour.<p>- A lot of the people who prompt their way to a faster engine cheat without realizing it. The two main ways are<p><pre><code>    1) Delete some of the model (there was a recent spate of people on reddit claiming ever faster performance with qwen3.8-flash-next using a technique called expert pruning that is basically deleting part of the model and hoping that you still get usable results)

        2) Quantize the model more. For token generation, quantizing a model results in a speedup directly proportional to how much you quantized it.
    </code></pre>
    Both expert pruning and overquantization lobomotize a model and neither technique survives contact with reality.
  score: 0
