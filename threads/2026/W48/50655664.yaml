  author: datatrashfire
  text: I am grateful for the incredible opportunities afforded to me as a result
    of being born at the right time (late 80s, early 90s) and place (United States).
    I grew up basically a hillbilly, even though my parents were much more educated
    than the typical family in our area. I have had best friends in childhood that
    overdosed before they reached 20, another before 30 with a child. I have had family
    members incarcerated. Despite that, I found a way to make it in this world. I
    have been able to support my parents and siblings. I have had colleagues and friends
    from other countries express the distance I have traveled socioeconomically would
    be far less likely in their own places of origin. It has also been pointed out
    to me that these same depths of economic suffering I have witnessed first hand
    are virtually unheard of by my friends from Western Europe. Despite that, I am
    so thankful for the luck I have had. The past decade has been extremely tumultuous
    ride, but I feel my friends and family are finally in a place of real stability
    and security. I can only hope our country and the world at large can navigate
    this time which seems equally precarious as filled with opportunity. There is
    so much wrong, unfair, and brutish about America in 2026, but there is also so
    much good too. I would not want to live anywhere else. I think we truly have the
    chance to produce a better future for all if we can figure out how to find connection,
    trust, and understanding amongst each other. Happy Thanksgiving.
  score: 0
