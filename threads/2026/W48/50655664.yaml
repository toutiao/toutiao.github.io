  text: WKRP in Cincinnati - &quot;Turkeys Away&quot; (S1E7; segment):<p>* <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=Lr1cJdH6ffg"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=Lr1cJdH6ffg</a><p>This
    apparently was based on an actual event (not a helicopter though):<p>&gt; <i>In
    1978, WQXI provided inspiration for WKRP in Cincinnati, a television sitcom about
    a radio station. Series creator Hugh Wilson dealt with WQXI when he worked in
    advertising. WKRP&#x27;s early episodes about dropping turkeys from a helicopter
    and the &quot;dancing ducks promotion&quot;, in which ducks danced on hot plates,
    were stunts actually done by Jerry Blum at WQXI in the early 1970s. Blum had leased
    an 18-wheeler from which he tossed hundreds of live turkeys at a suburban Atlanta
    shopping center.[15]</i><p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;WQXI_(AM)#WKRP_connection"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;WQXI_(AM)#WKRP_connection</a><p>&gt;
    <i>The plot of &quot;Turkeys Away&quot; is based on a true story. WKRP in Cincinnati
    creator Hugh Wilson — who adapted Carlson&#x27;s character from Jerry Blum, a
    general manager of radio station WQXI in Atlanta from 1960 to 1989 — recounted
    that the episode was inspired by a similar live turkey giveaway promotion by Blum,
    who tossed turkeys out of a pick-up truck at a Dallas shopping center parking
    lot.[5]</i><p>&gt; <i>According to The Atlanta Journal-Constitution, Blum said
    in 1996 that following the disastrous promotion, he quipped, &quot;I didn’t know
    turkeys couldn&#x27;t fly,&quot; almost word-for-word what Carlson says at the
    end of the episode.[6]</i> […]<p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Turkeys_Away#Background"
