  author: tito
  text: I do the following Thanksgiving assignment each year, and find it really fulfilling.
    Passing this on from my wonderful college professor Danny Warshay. Copy-pasted-with-some-bits-added:<p>Think
    of your supporters:<p>Think of all of the people who have helped you get to where
    you are today. All of the coaches, advisers, supporters, teachers, employers,
    mentors, relatives and friends.<p>All the people who helped you in the early days
    of your career, or in your life, or recently. All of the references who spoke
    on your behalf for jobs. Even the categories, let alone all of the individual
    supporters, are endless for all of us. That person you meant to thank a decade
    ago for something they probably forgot by now.<p>Your Assignment:<p>Select one
    or two, and write them a handwritten note to let them know how you are doing and
    to thank them for helping you get here.<p>We are all on both sides of this equation
    from time to time, and we all know how much we enjoy hearing from those whose
    lives we have influenced, especially hearing those simple and magical words, “Thank
    you.” To me, it feels like more than ever, we need to find moments of gratitude.<p>I
    hope your doing this adds a little extra meaning to your Thanksgiving and to the
    Thanksgiving of those who will be hearing from you! Based on the moving experiences
    many of you have shared with me that resulted from this simple gesture, I am confident
    that you will find this rewarding.<p>For those of you who will be celebrating
    American Thanksgiving, I hope you enjoy what I know is a much-needed break. And
    for those of you who are not, I hope you will join me in a few moments of gratitude.
  score: 0
