  text: |-
    Help with what?<p>Training a 14 trillion parameter general SOTA model? Probably not.
    Fine-tuning a Qwen on your task (similar to what Jev allegedly did, or what many of the Jev-clones are doing? Yes.<p>Also, there is a lot of research&#x2F;exploration to be done on for example embedding spaces, dtypes and such. For example the Linear Attention models have a good proven theoretical basis where FP32 precision limits the context window, and how each bolted on fix like shortcov is just getting 1 step closer to standard attention(chinese blog on the topic): <a href="https:&#x2F;&#x2F;mp.weixin.qq.com&#x2F;s&#x2F;ONczIP9bB2tvKpSMQ-2u9A" rel="nofollow">https:&#x2F;&#x2F;mp.weixin.qq.com&#x2F;s&#x2F;ONczIP9bB2tvKpSMQ-2u9A</a><p>Maybe we can design the layer dtypes better with such knowledge, know what layers to loop to, etc.<p>There are competitions&#x2F;challenges that try to teach NNs to learn how to do math in various ways. Here was one: <a href="https:&#x2F;&#x2F;onelayerdeeper.ai&#x2F;submit" rel="nofollow">https:&#x2F;&#x2F;onelayerdeeper.ai&#x2F;submit</a>. The outcome of that one was a mix of fourier feature models, discrete evolutionary ones, etc. But the frontier models could not solve this problem for example.<p>If you figure out how to learn a problem faster, you might stumble on some technique that can allow better architectures.
