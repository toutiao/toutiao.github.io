  author: cyberax
  text: No. The file system layer in NT sucks because it sucks.<p>File operations
    in NT are implemented using a very generalized model of IRPs (IO Request Packets)
    that are routed through (possibly) multiple layers of filters. It&#x27;s very
    generic and extensible, but not fast.<p>They actually had to add a layer of shortcuts
    (&quot;Fast IO&quot;) that bypasses this for a limited set of data operations,
    but not for metadata. This layer just uses classic tables of function pointers
    instead of IRPs, just like in Linux.
