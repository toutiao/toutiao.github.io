  author: asveikau
  text: I think the most painful operation in NT filesystem apis are those dealing
    with filenames. Once you have a handle and only deal in handles, it does better.<p>This
    is also complicated by the fact that NT tends to orient operations around handles,
    but win32 deals in names. So the win32 to NT translation step often has an extra
    CreateFile or two.<p>Also filesystem drivers are kind of heavy on windows, and
    compared to Linux VFS they have more caching and stuff that gets applied globally.
    I believe, for example, that on Linux you get the name to inode caching from the
    VFS layer, and in windows it lives in ntfs.sys. You can read that contrast as
    Linux allowing performance focus in the right layer and Microsoft bolting on non-essential
    bloat and complexity in the FS driver.<p>(Also, hello.)
