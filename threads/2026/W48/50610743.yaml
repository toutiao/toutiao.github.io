    robust under load. If you used pure Win32 apps like Rufus, you&#x27;d see that
    it actually flies. Games also use pure Win32 and DirectX. They are quite good
    in performance as well.<p>Win32 is basically too big to have a global opinion.
    There are good parts and then there is event tracing API :)<p>It is still well-designed
    for its purpose and there is a lot of thought put for future compatibility, most
    changes do not affect the API but adds another bit field or puts some fields in
    a struct which has pre-reserved fields.<p>Now, Microsoft has largely abondonned
    Win32 and kept reinventing UI framework on top of UI framework. WPF was actually
    good. It is like QtQuick: declarative and GPU accelerated.<p>WinUI that came with
    Windows 8, however, is crap. Moreover Microsoft made 3 incompatible versions of
    it and didn&#x27;t fix the bugs in the earlier versions and WinUI 3 is still accreting
    more. They also ported system utilities like Explorer to WinUI 3 inheriting all
    the bugs. You can still launch old Control Panel (pure Win32) and its performance
    compared to Settings (WinUI 3) is day and night. Moreover they do crazy stuff
