  author: okanat
  text: 'The performance of the process creation isn&#x27;t a bug but an intended
    tradeoff. NT is slower because its process creation does more (checks for permissions,
    reloads binary, does relocation from scratch for DLLs, basically what fork + exec
    does but a bit more).<p>Many Unix systems didn&#x27;t have threads but relied
    purely on multiprocessing. Threads on Linux is still a hack on top of the process
    API: clone.<p>On the other hand NT came with threads from the first release to
    do multitasking. It doesn&#x27;t have fork because NT developers didn&#x27;t want
    to add the hacky fork syscall for cloning the process &#x2F; its memory area.'
