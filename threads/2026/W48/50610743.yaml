  author: dfe
  text: I vividly remember those days.  To be fair to Windows NT, the very same could
    happen if you set up Solaris or Linux or really anything running an NFS server
    out of the box, even if no mounts are exported.  All it takes is a bug in the
    NFS or (Sun)RPC server code before it even gets to the point where it&#x27;s trying
    to actually serve something.  Such bugs have existed.<p>And why limit ourselves
    to file sharing?  Bugs in the TCP&#x2F;IP stack itself have led to things like
    the &quot;ping of death&quot; (Windows 95) or more recently demonstrable RCE against
    the Linux kernel by using TCP options in an unexpected way.<p>The main distinction
    is that Windows NT, even the earliest 3.1, enables the SMB (file and print sharing)
    service by default.  In 1990 when it was being designed, and even by July 1993
    when it was finally released, I&#x27;m sure this didn&#x27;t seem like a big deal.  All
    of this was meant to be running in the safety of a LAN.  The direct predecessor
    product (co-developed with OS&#x2F;2) is even named &quot;LAN Manager&quot;.<p>Yes,
    if you open up your SMB server or NFS server to the broader Internet, you&#x27;re
    gonna have a bad time.  As I recall, this could be avoided by doing advanced network
    setup and just making sure you did not bind &quot;file and print sharing&quot;
    to any interface that had a public IP without an external firewall.  Once you
    got all the service packs applied, you could go back and turn it on if you needed
    it.
