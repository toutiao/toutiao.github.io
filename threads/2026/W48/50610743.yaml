  author: jasomill
  text: 'Windows 11 isn&#x27;t a sluggish mess in my experience, no cleaning required
    beyond Group Policy options to disable a few things like widgets and Start menu
    Internet search and ticking the accessibility checkbox to disable UI animations,
    and I&#x27;m running it on hardware ranging from current to Ivy Bridge, with both
    Microsoft Endpoint and SentinelOne for corporate crapware (not on the same machine!).<p>Telemetry,
    however, is unfortunate in that it the only official way to fully disable it is
    limited to Windows Enterprise.<p>As others have noted, certain things like metadata-heavy
    filesystem operations and process creation are much faster on Linux: running a
    quick test just now, on broadly similar hardware (and the Windows box has a slightly
    faster CPU and SSD), Windows takes around 90 ms to run a trivial C program that
    Fedora 45 runs in less than 2 ms; some of this may be PowerShell vs bash overhead,
    though cygwin&#x2F;msys2 bash is even slower).<p>What I haven&#x27;t noticed,
    though, is a noticeable difference running heavy cross-platform GUI applications
    like Firefox and Rider on Windows vs Linux, or Windows Terminal being noticeably
    less responsive than Konsole (though PowerShell certainly isn&#x27;t winning any
    awards for speed).'
