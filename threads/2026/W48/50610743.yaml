  author: sysmax
  text: IIRC, the slow NTFS operations on small files is a safety trade-off. If you
    read 1000 small files using the NTFS driver, it will re-read all the associated
    control structures 1000 times, instead of caching and assuming no change. So,
    if anything else corrupts those structures on a mounted volume, it will get discovered
    earlier.<p>It is possibly related to the fact that mounting an NTFS volume doesn&#x27;t
    prevent other software from writing to it via \\.\PHYSICALDRIVEn. With Windows
    effectively being a legacy OS for running legacy software, it&#x27;s totally understandable
    why they would not change it.
  score: 0
