  author: stinkbeetle
  text: 'Would you take the paid reviewer scores or proprietary reviewing platforms
    that are run by the corporations selling the game more seriously? I don&#x27;t
    think so.<p>I went through a few metacritic reviews. There were similar amounts
    of mindless &quot;10&#x2F;10 greatest game ever&quot; as  there were &quot;0&#x2F;10
    worst game ever&quot; reviews, so it&#x27;s a bit presumptuous to assume review
    bombing would reduce overall score, but we would never really know.<p>There are
    a lot of low scores with effort put into the commentary that seem genuine. Below
    is one of them. Doesn&#x27;t really sound like ranting against an imaginary &quot;woke&quot;.<p>&quot;GTA
    6 – Full Review<p>This isn’t a game. It’s a crime soap opera disguised as a hyper-realistic
    open world, sold as the event of the century. I played it, I paid for it, I suffered
    through it, and now I’m going to say what I think.<p>First of all: I want action,
    for ** sake! I want to steal cars, go on shooting sprees and feel the freedom
    of being a criminal. What do I get instead? A relationship meter, wall painting,
    house cleaning and hours spent fixing a roof to impress a woman. Is this GTA or
    a “helpful husband” simulator? Every time that little paintbrush icon shows up,
    I feel like throwing the controller at the wall.<p>The writing is embarrassing
    and the protagonists are a step backward. Jason is probably one of the most passive
    and personality-less protagonists Rockstar has ever made. Lucia displays absurd
    behaviors that the game tries to sell as complexity and charisma. The worst part
    is that the script seems to expect us to buy into this couple dynamic. The exaggerated
    characters from GTA 5, which I already didn’t like that much, look like actual
    human beings next to these two.<p>The game wants to be serious, mature, a criminal
    couple drama. But it ends up feeling like a midweek soap opera. GTA should be
    an ‘80s&#x2F;‘90s action movie: excess, style, absurdity, blood, charisma and
    dark humor. Instead, we get a toxic relationship taking center stage in a technically
    impressive world that’s completely wasted. The hyper-realism, which should enrich
    freedom and the criminal experience, ends up serving only to simulate a ** life
    with some shootouts in the middle.<p>I’d rather stick with GTA IV. And look, that
    one was a heavy drama. But Niko had presence, personality and a story that matched
    its own tone. Here, it feels like Rockstar got scared of being real GTA: of being
    exaggerated, irreverent and irresponsible.<p>Even the older ones had more identity.
    Vice City had neon, excess and an unforgettable atmosphere. GTA III had its own
    weirdness, while San Andreas had soul and imagination. The sixth game returns
    to Vice City, but seems incapable of recovering anything from that identity. It
    uses the aesthetic as a pretty backdrop for a boring couple story.<p>Compared
    to this, GTA 5, which I used to rate a 4, now deserves a generous 7. At least
    its characters had energy and some internal coherence.<p>Final score: 2&#x2F;10.<p>And
    I’m being generous because of the graphics and the size of the map. But a game
    can’t survive on technology alone: it needs to make you want to play. And this
    one made me want to turn everything off and go back to real GTA III or Vice City.<p>Rockstar,
    you’ve lost your touch. And worse: you’ve lost the courage to be what you’ve always
    been.&quot;'
  score: 0
