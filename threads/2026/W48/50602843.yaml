  author: mrandish
  text: I&#x27;m still early in the game, and suck at these kind of games, but people
    who are highly familiar with its predecessors and also very good at these kinds
    of games can go amazingly fast.<p>I also think it&#x27;s down to style. I just
    enjoy sight-seeing and playing around with the mechanics of the game. After about
    20 mins of play (right after getting to &#x27;home&#x27; for the first time) I
    went off exploring. When I watched my teen daughter play she went flying off at
    high-velocity in a completely different way (although probably advancing even
    less per minute than I did).<p>There are tons of guides out there already but
    just by their structure, they are kind of spoilery. I found just asking an LLM
    to be pretty optimal because I can prompt it to only tell me what I want to know.
    It helpfully informed me about an unguarded helicopter and a seaplane, each not
    far from the house without spoiling anything else. For those like me who don&#x27;t
    really enjoy the FPS aspect of the game, there isn&#x27;t one &quot;Easy&quot;
    button but there are a couple auto-aim and reduced damage settings that make it
    much easier. Also, after you die three times on a mission, it&#x27;ll offer an
    option to skip the checkpoint (non-penalizing).<p>I&#x27;m really enjoying GTA
    6 but doubt I&#x27;ll ever finish the main storyline, as that&#x27;s just not
    my thing. However, that&#x27;s no diss on the game because it&#x27;s clear they
    put an incredible amount of effort into making the characters deep and the story
    elements compelling. In fact, the only reason I&#x27;m still playing through more
    of the main storyline is to see how they&#x27;ve woven the storytelling into the
    gameplay. It&#x27;s <i>really</i> good work - and that level of care and expertise
    is always worth appreciating and learning from.
