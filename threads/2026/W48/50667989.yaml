  content: "[D. J. Bernstein](../djb.html)  \n[Proofs](../proofs.html)\n# False computer-checked
    proofs\n\nThere are some computer programs that claim to check every step in a
    proof. However, various \"soundness bugs\" have been reported that at least potentially
    allowed false statements to slip past these programs. In many cases, these bugs
    have been demonstrated to be exploitable.\n\nThe [list](#list) at the bottom of
    this page links to what appear to be reports of soundness bugs for various important
    proof-checking programs, sorted in increasing order of the number of reports.
    This list includes many more soundness bugs for these programs than the bugs mentioned
    in[2026 Paulson](https://lawrencecpaulson.github.io/2026/01/15/Broken_proofs.html)and[2026
    Stérin](https://tristan.st/blog/in_search_of_falsehood), and I don't think the
    list is missing any of the bugs mentioned there, but I've probably missed some
    reports. Please let me know about any corrections or additions.\n\nBeware that
    this list doesn't include user-interface vulnerabilities. Those can have the same
    important effect of misleading a user as to what has been proven. See, e.g., [2016
    Adams](https://link.springer.com/chapter/10.1007/978-3-319-43144-4_2).\n\n## Advice\n\nOne
    standard path towards security is to minimize the complexity of the trusted computing
    base, which by definition is the part of the system that security reviewers need
    to check. From this perspective, HOL Light's proof-checking kernel is attractive
    because of its stability and simplicity, only 400 lines of code. But this size
    measurement doesn't say how carefully the HOL Light code has been reviewed, and
    doesn't say anything about the possibility of bugs in the underlying programming
    language.\n\nExtra code can be _good_ when it's test code. A battery of tests
    tends to catch more bugs than a single test. Running a proof through multiple
    proof-checking programs (preferably each in its own isolated environment) can
    save the day when there's a bug in one program, and is particularly easy if the
    checkers take the same input language for writing proofs. But it's not clear how
    effective this is at stopping attacks: for example, sometimes bugs are[shared
    by multiple checkers](https://web.archive.org/web/20260803084953/https://leanprover-community.github.io/archive/stream/270676-lean4/topic/SafeVerify-passing.20kernel.20soundness.20exploit.html).\n\nThe
    question[\"Who watches the provers?\"](https://leodemoura.github.io/blog/2026-3-16-who-watches-the-provers/)is
    better answered by a proof saying that a checker works correctly. A close translation
    of the inference rules in the HOL Light kernel, except for the rules to introduce
    new definitions, was already[proven in 2006](https://www.cl.cam.ac.uk/~jrh13/papers/holhol.pdf)to
    generate only correct theorems. That proof was also checked by HOL Light. (For
    readers familiar with logic: of course this assumes a large cardinal; V is enough
    for HOL Light. The same paper also has a variant of the proof that skips the large-cardinal
    assumption, at the expense of omitting the axiom of infinity from the logic being
    proven.)\n\nAfter more work, a clone of HOL Light called[Candle](https://cakeml.org/itp22-candle.pdf)was
    proven in 2022 to allow only proofs of correct theorems, as long as the CPU implements
    the instructions used in the Candle binary in the expected way. This proof is
    again computer-checked, this time in another proof-checking system, HOL4. There
    was also a computer-checked proof in 2022 of the correctness of a[standalone proof
    checker](https://research.chalmers.se/publication/532951/file/532951_Fulltext.pdf#chapter.3)for
    HOL proofs in OpenTheory format.\n\nFrom a security perspective, it's still[concerning](https://www.cs.cmu.edu/~rdriley/487/papers/Thompson_1984_ReflectionsonTrustingTrust.pdf)to
    be relying on large proof-checking binaries, where the answer to why we're supposed
    to trust one binary is that the binary has supposedly been checked by another
    large proof-checking binary. I'd like to see more work on simplifying these binaries.\n\n##
    The list\n\nThe bug links below are accompanied by links labeled to the[Internet
    Archive Wayback Machine](https://web.archive.org).\n\n**[HOL Light](https://hol-light.github.io/)
    (default usage, not Candle).**Reported soundness bugs:[19960328](https://raw.githubusercontent.com/jrh13/hol-light/refs/heads/master/CHANGES)[20030718](https://raw.githubusercontent.com/jrh13/hol-light/refs/heads/master/CHANGES)[20030901](https://raw.githubusercontent.com/jrh13/hol-light/refs/heads/master/CHANGES)\n\n**[Mizar](https://mizar.org)
    (default usage, not mizar-rs).**Reported soundness bugs:[20010625](https://mizar.uwb.edu.pl/forum/archive/0106/msg00023.html)[20030626](https://mizar.uwb.edu.pl/forum/archive/0306/msg00010.html)[20071226](https://mizar.uwb.edu.pl/forum/archive/0712/msg00012.html)[20230215](https://arxiv.org/pdf/2304.08391.pdf#subsection.7.4)[20230227](https://arxiv.org/pdf/2304.08391.pdf#subsection.7.1)[20230227-2](https://arxiv.org/pdf/2304.08391.pdf#subsection.7.2)[20230227-3](https://arxiv.org/pdf/2304.08391.pdf#subsection.7.3)\n\n**[Metamath](https://us.metamath.org/)
    (default usage, not mmverify.py).**Reported soundness bugs:[20171231](https://github.com/metamath/set.mm/commit/2ae05c73afa1b5b0e8d15aa79776dc3cc6200948)[20190211](https://github.com/metamath/set.mm/commit/5bd26027bb0af706f9e236ae91598797df9ae4f2)[20190909](https://github.com/metamath/set.mm/pull/1089)[20210621](https://github.com/metamath/set.mm/commit/8c4ab437804027bbe7462a4bb5089187556d84f5)[20230801](https://github.com/metamath/set.mm/pull/3339)[20240708](https://github.com/metamath/set.mm/commit/0db747840143982b80f2091c9fa1c829f8e42a2a)[20250620](https://github.com/metamath/set.mm/pull/4909)[20250727](https://github.com/metamath/metamath-exe/issues/184)[20251121](https://groups.google.com/g/metamath/c/cQEhPASlJGM/m/ZVdjALhgAgAJ)\n\n**[Isabelle](https://isabelle.in.tum.de/).**Reported
    soundness bugs:[19930326](http://www.cl.cam.ac.uk:80/~lp15/archive/isabelle-users.93.gz)[19931122](https://github.com/isabelle-prover/mirror-isabelle/commit/46c7b45e1d9098f5e80459decd82dbd22d63a35d)[19950821](https://github.com/isabelle-prover/mirror-isabelle/commit/334fa7b639b4ab1ca98d44ad7ade92f3c0cd314a)[19960627](http://www.cl.cam.ac.uk:80/~lp15/archive/isabelle-users.96.gz)[19991216](https://github.com/isabelle-prover/mirror-isabelle/commit/51a6c7537ea45b50a9c50a66b519261963b23ce0)[20000708](https://github.com/isabelle-prover/mirror-isabelle/commit/1549e7fb8ef72b19bf375e93a683b7db017fd36f)[20030923](https://github.com/isabelle-prover/mirror-isabelle/commit/3a4990f9d321772f2a9b846242903fcac0b6f8dd)[20040823](http://www.cl.cam.ac.uk:80/~lp15/archive/isabelle-users.04.gz)[20060503](https://github.com/isabelle-prover/mirror-isabelle/commit/6ef4fe0ab23d80bf9004a8f86051d3e2a771714b)[20060512](https://github.com/isabelle-prover/mirror-isabelle/commit/84386cfd5441fe7423fdedb6465eef078073bc8b)[20140705](https://github.com/isabelle-prover/mirror-isabelle/commit/7abb8b2f84f87083f9dbac9da646a506d8b688fe)[20150824](https://www.andreipopescu.uk/pdf/ITP2015.pdf)[20161203](https://mailman46.in.tum.de/pipermail/isabelle-dev/2016-December/007251.html)[20260116](https://github.com/isabelle-prover/mirror-isabelle/commit/9c4a1a3955e45cf9b9cb510635f97226416b0d89)[20260908](https://github.com/isabelle-prover/mirror-isabelle/commit/f027e4a32c3e8ef2a300e3a538c47a17677c22c5)[20260910](https://github.com/isabelle-prover/mirror-isabelle/commit/b1973e040d1af32239379b7365fc104ceb2daaa3)[20261027](https://lists.cam.ac.uk/sympa/arc/cl-isabelle-users/2026-10/msg00080.html)[20261105](https://lists.cam.ac.uk/sympa/arc/cl-isabelle-users/2026-11/msg00006.html)\n\n**[Lean](https://lean-lang.org/)
    (default usage, not nanoda; excluded).**Reported soundness bugs:[20170124](https://github.com/leanprover/lean3/commit/0ba60e62d7db6577e6a8008908ffdc13a5976e41)[20171217](https://github.com/leanprover/lean3/commit/8b835f9ab6127866123c24f93207bec5306e30dc)[20180409](https:"
