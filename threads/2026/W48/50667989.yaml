  author: xg15
  text: Well, the machine could also help you generate the formal definition if you
    give it enough prose, context, examples, etc to nail down what you want.<p>Going
    from &quot;we need to write code to reach unambiguity&quot; to &quot;we can explain
    it like we&#x27;d explain it to a human if we want to be very clear&quot; is already
    a huge step.<p>Of course you&#x27;d still have to manually <i>verify</i> the formal
    problem statement that was generated. I guess somewhere, the turtles have to stop.<p>You
    could make this into a more general workflow for working with LLMs:<p>1) First
    spend some iterations with the model to nail down what you want and have it produce
    mock-ups, test cases, verifiers, etc. Anything that <i>you</i> can check for correctness
    easily and that the LLM can then in turn use to check for itself.<p>2) Then let
    the LLM run wild and produce the actual thing, using the verifier from step 1
    as a guide.
