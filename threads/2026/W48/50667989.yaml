  text: This feels like the type of thing that would be held up as why we shouldn&#x27;t
    even do unit tests in a meeting because &quot;nothing can be proved correct&quot;.  Never
    once in my entire career, my entire lifetime of programming have I not easily
    found issues by creating the bare minimal tests, fuzzing or proofs.<p>In the mid
    2000&#x27;s I was trying out a bunch of stuff and learned that making it easy
    to test code was more important than completeness because if it was hard dev wouldn&#x27;t
    test at all. The fact that a dev can take AI and make some lean even if crude
    and incomplete is world better than not and I have been watching the steady stream
    of blogs for the last 18 months and in each case they find issues.  Maybe important,
    maybe not, but they find stuff and they learn how to do it for next time.
