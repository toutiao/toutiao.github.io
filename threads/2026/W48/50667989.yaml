  author: quotemstr
  text: 'The latest &quot;thing&quot; in some circles is denying that the recent proofs,
    e.g. of the Riemann hypothesis, are proofs of anything. People point out pointless
    or tautological sections of these proofs as evidence that the proof itself might
    be ill-formed, but Lean and similar systems don&#x27;t work that way: absent a
    kernel bug, introducing unnecessary noise to a proof cannot make it prove something
    false.<p>Others are looking hard for kernel bugs. They exist, but there are good
    reasons (including multi-kernel validation) to be confident they don&#x27;t impair
    these recent proofs.<p>In a situation in which you have a cohort of people who
    &quot;want to believe&quot; in some unlikely thing, you have to take the evidence
    they present with a grain of salt. So it is, today: people &quot;want to believe&quot;
    we haven&#x27;t basically solved automated theorem proving when we have.'
