  author: twotwotwo
  text: 'It is true soundness bugs have been found, and the Lean community spends
    effort on it. But this page doesn&#x27;t convey the gap between one incorrect
    verification and successfully misleading mathematicians about what is true: there
    are multiple checkers and you need bugs in <i>all</i> of them, without the input
    looking implausible on informal review.<p>(For example, a DeepMind researcher
    created a &#x27;proof&#x27; that passed Lean and (a then-week-old version of)
    nanoda by exploiting a different bug in each. But if you fed that into a regular
    old LLM (or to a human expert, but I mention LLMs b&#x2F;c they can be assigned
    to review even very large volumes of Lean code) it would immediately say &quot;no,
    this isn&#x27;t real math.&quot;)<p>The increase in soundness bugs found this
    year is notable, because LLMs are good at finding ways to their assigned goals,
    and they found some funny ones. <i>And</i>, besides fixes for the specific bugs,
    it led to broader work on hardening and alternative and verified kernels: <a href="https:&#x2F;&#x2F;leodemoura.github.io&#x2F;blog&#x2F;2026-10-15-lean-now-ships-with-verified-kernels&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;leodemoura.github.io&#x2F;blog&#x2F;2026-10-15-lean-now-ships-...</a><p>So
    you have fewer avenues than at the start of the year to get a proof of False OK&#x27;d
    by one proof-checker kernel, and it&#x27;s much <i>much</i> harder to get one
    through the gauntlet invoked by `lake check --paranoid`.<p>(This is also interesting
    as a(nother) example of the difficulty of making truly correct software -- you&#x27;d
    hope for proof-checker kernels to be pretty high on the correctness scale but
    seems like we&#x27;ve found 16-32 soundness bugs in a bunch of these.)'
  score: 0
