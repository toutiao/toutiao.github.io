  author: mdnahas
  text: Yes.  Proof checkers have a “kernel” which is small and has the rules.  All
    proofs are verified by the kernel.   Lean’s kernel is about 6,000 lines of code.  HOL
    Light’s is 400 lines.<p>There are other parts of the code that matter for correctness,
    such as parsers, memory allocators, OS code, etc..  But the mathematical faults
    are restricted to the kernel.  The math in the kernel is complex, since it needs
    to be able to encode all of math and deal with concepts like infinity.<p>It would
    be nice to see this webpage update with what soundness failures were mathematical
    errors about the kernel, mistakes writing the kernel, or bugs in other code.
