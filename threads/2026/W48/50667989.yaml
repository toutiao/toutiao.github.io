  author: gr_norm
  text: A lot of the issues found were in known-suspicious corners of the underlying
    type theories. It was previously fine to have certain convenient kludges around
    since proofs were written by humans, for whom the likelihood of accidentally completing
    a proof by triggering a bug was basically 0. These are being removed or their
    foundations reworked to deal with AI now writing proofs at unprecedented scale.
    It&#x27;s actually remarkable how well the current crop of proof assistants has
    dealt with the instant orders-of-magnitude increase in the volume of proof thrown
    at them. So taking prior design considerations and skyrocketing usage together,
    it&#x27;s not too surprising to see a few more soundness bugs in the past several
    months.<p>If you want a scare, take a look at how many soundness bugs the borrow
    checker has had. Nobody would deny its usefulness for correctness.
