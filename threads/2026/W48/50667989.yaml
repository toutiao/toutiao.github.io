  author: twotwotwo
  text: I think it&#x27;d be similar to writing a flawed argument (or buggy code,
    etc.) that would pass review with a lot of people. I bet just having a really
    subtle flaw is more robust than trying to find a quirky, specific chink in LLM
    armor that survives different models, angles on the prompt, etc.<p>One thing I
    didn&#x27;t spell out about why non-proof-checker &#x27;informal&#x27; review
    is interesting is it means any exploits have to be hidden. Proof checkers don&#x27;t
    care if the code they&#x27;re looking at is weird in context, and it probably
    <i>will</i> be weird if it&#x27;s a refcount-overflow exploit rather than a proof
    (to use an actual runtime-soundness bug from the August post on C++ Lean). But
    to an expert or LLM, exploit code and real math reasoning <i>can</i> look different.
    So the result is the challenge is no longer just &#x27;exploit the bug(s)&#x27;
    but now also 1) make the exploit not suspicious to the informal reader and 2)
    make the argument also make sense to them.<p>I think hardening the kernels and
    their diversity are the main defenses, but the informal-review thing is fun to
    think about because it&#x27;s such a <i>different</i> challenge from the others.
