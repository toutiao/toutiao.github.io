  author: nickpsecurity
  text: I think this review is unfair given he doesn&#x27;t compare those observations
    to:<p>1. The number of bugs in unverified programs of similat complexity. By average
    and good coders. Think CompCert&#x27;s middle end having no bugs in the evaluation
    against other compilers.<p>2. The number of bugs in those vs verification tools
    in general. If proof and simplicity works, we should see a huge drop vs larger
    provers or solvers.<p>3. How much the proof helped prevent bugs in verified software
    and their severity vs the number and severity of bugs in the provers.<p>4. An
    empirical argument where common, coding strategies in battle-tested compilers
    normally run withiut errors. Therefore, a verified checker implemented with those
    patterns in a simple, coding style will probably run correctly or with few bugs.
    But, he just says a large binary checking a large binary which makes both programs
    sound equally reliable.<p>So, I support developing and using these tools. We should
    have them tested on many, small programs and properties like we do static analyzers.
    Then, use David A. Wheeler&#x27;s diverse, double compilation on their checkers
    with GCC and LLVM. Run other verified tools through <i>that</i>.
