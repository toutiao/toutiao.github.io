  text: 'I think this is misleading for the proof-checkers in systems where <i>multiple</i>
    provers must pass for the proof to be accepted.<p>In the case of Metamath, yes,
    soundness bugs have been found in the original &quot;metamath&quot; proof verifier,
    written in C. But to be accepted into the main proof databases (set.mm and iset.mm),
    proofs must pass &quot;5 independently-created verifiers in 5 different programming
    languages: metamath (a C verifier by Norm Megill), mmj2 (a Java verifier by Mel
    O&#x27;Cat and Mario Carneiro), smetamath-rs (a high-speed Rust verifier by Stefan
    O&#x27;Rear), checkmm (a C++ verifier by Eric Schmidt), and mmverify.py a Python
    verifier by Raph Levien).&quot; - <a href="https:&#x2F;&#x2F;us.metamath.org&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;us.metamath.org&#x2F;</a><p>To me, that&#x27;s
