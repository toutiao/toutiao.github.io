  text: There&#x27;s a deeper problem — I&#x27;m assuming it doesn&#x27;t apply in
    the case of the math proofs because the problem itself has already been formulated
    in symbolic terms, by humans — but I&#x27;ve had this problem where, an agent
    proved the correctness of an implementation (within reason), but it proved it
    against its own incorrect understanding of what needed to be done. So in one case,
    what it built ended up being the exact opposite of what needed to be done!<p>I
    found it amusing in that case l, that even if it had supplied me with a formal
    proof of correctness, the proof would also have passed, and the implementation
    would still have been completely useless! Because the LLM&#x27;s understanding
    of what it was supposed to be doing in the first place was wrong.<p>Communication
    is hard!
