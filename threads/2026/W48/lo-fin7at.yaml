    I used the tag satire here because in its description it included "other humor".
    This article is not a satire to me but just a funny blog post which I found very accurate of where I worked !
    We used to have a really impressive collections of custom emojis when the company I work for was between 10 < 40 people, with many of them having inner/private joke meanings, even many not-safe-for-work ones (not sex related) that were very funny and that everyone liked to use.
    But the company then tried to grow and forced a more corporate/international approach, which included removing all emojis that could not be understood by newcomers. In the long run it lost its root culture of being serious in the work but chill in the way we communicate to each other: now we have un-serious work with very serious communication.
