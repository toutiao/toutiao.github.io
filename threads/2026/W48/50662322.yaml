  author: danpalmer
  text: Are you selling directly as yourself to customers? If yes, and your only business
    premises are your home, then yes I do think customers have a right to know that.
    Not because it&#x27;s your home, because it&#x27;s the legal address of an entity
    they&#x27;re doing business with.<p>People are reading this as a privacy right,
    but you don&#x27;t have a right to sell to customers, and if you do, they have
    a right to know who they&#x27;re buying from. I believe the customer&#x27;s right
    is more important because they can&#x27;t work around it, whereas the business
    can if it matters to them.
