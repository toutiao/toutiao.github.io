  text: |-
    You have to thank the EU for enforcing this policy onto Google (and Apple) via their Digital Services Act (DSA).<p>From [0]<p><pre><code>   Article 30, Traceability of traders - the Digital Services Act (DSA)

       1. Providers of online platforms allowing consumers to conclude distance contracts with traders shall ensure that traders can only use those online platforms to promote messages on or to offer products or services to consumers located in the Union if, prior to the use of their services for those purposes, they have obtained the following information, where applicable to the trader:

       (a) the name, address, telephone number and email address of the trader;
    </code></pre>
    It also exists for the App Store, Now it exists for Google Play.<p>&gt; Under Google Play’s global developer policies, all active developer accounts must declare whether they are a trader or non-trader under European Economic Area (EEA) and United Kingdom (UK) laws in Play Console. This declaration must be completed by February 1, 2027<p>[0] <a href="https:&#x2F;&#x2F;www.eu-digital-services-act.com&#x2F;Digital_Services_Act_Article_30.html" rel="nofollow">https:&#x2F;&#x2F;www.eu-digital-services-act.com&#x2F;Digital_Services_Act...</a>
