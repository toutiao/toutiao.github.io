  author: danpalmer
  text: As you say, they can rent a place. Plus there are options between renting
    a P&#x2F;O box and renting an office. A virtual office costs as little as $20&#x2F;m,
    and can be used as a company&#x27;s legal address.<p>I realise that&#x27;s a high
    bar for some side project, but that&#x27;s kinda the crux – if you&#x27;re making
    money off people you have to take it seriously, you can&#x27;t wing it anymore,
    and your customers knowing &quot;who you are&quot; (potentially as a business)
    is part of that.<p>If that&#x27;s too high a bar, make the app free. If you want
    to make money from it, get serious. Society already applies reasonable bars like
    this in other ways – safety certificates, liability insurances, etc. Software
