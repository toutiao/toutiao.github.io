  author: freediver
  text: |-
    Hey all this is Vlad, your friendly Kagi founder.<p>More context on the product:
    <a href="https:&#x2F;&#x2F;youtu.be&#x2F;rp4GxlnvujE?t=4513" rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;rp4GxlnvujE?t=4513</a><p>The Watch started with a need I had as a parent, which is also how Kagi Search started. It is built by a small team inside Kagi and funded by our own treasury.<p>Our vision is that of technology working for humans and not the other way around. We first built Search and Browser that had users&#x27; best interest in mind and as time went by I realized there is also a fundamental misalignment of incentives with most today&#x27;s hardware which makes me uncomfortable to give it into the hands of my 8 year old.<p>Kagi Watch is not unrelated to what Kagi is trying to achieve in the world, it is complementary. By not owning hardware and platform we are at the mercy of companies which are basically our competitors.<p>As old Kay&#x27;s saying goes &#x27;people serious about software build their own hardware&#x27; -&gt; Kagi Watch (as a first step in this direction, we have more to come, provided Watch becomes a good seller). And with your support, hopefully we are able to expand to a full-stack tech product ecosystem, working only for its users and nobody else. I am very excited to make families the focus of Kagi in the years to come.<p>Happy to answer any questions.
