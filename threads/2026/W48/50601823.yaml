  author: Balooga
  text: Exactly. Here is what I have found in my own project. Because I hadn&#x27;t
    explicitly told the LLM (Hi Claude!) to <i>not</i> create a brand new build tool,
    it created a brand new build tool.<p>The LLM created a build tool that sequenced
    dependent files by time instead of result. So a test would kick off 2 seconds
    after a compile was initiated instead of the build waiting for a compile to complete.
    Race conditions left and right under load which the LLM decided to mitigate by
    increasing wait times. Which lead to increased build times, but that didn&#x27;t
    fix the race conditions.<p>So the LLM decided to compile&#x2F;test each file 50x
    times in a row, only continuing with the build if all 50x runs resulted in no
    race conditions.<p>Also, run the entire build 3x in a row -- because why in the
    hell not. The first time under ptrace to inventory files that are created or modified.
    The second time to create a hash of each file inventoried during the first run.
    The third time to compare file hashes to the second run to determine build failures.<p>A
    build that should have takes less than a minute using plain make and Makefiles
    just about turned my laptop into slag after 30 minutes of 100% CPU load.<p>Fun
    times.
