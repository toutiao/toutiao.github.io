  text: I had about 20 Windows XP workstations under my care... they would blue-screen
    when you needed them most, right before you printed the document you were done
    with.<p>It turned out to be the HP printer drivers... well actually the optimizing
    compiler used to create the HP Printer Drivers.... it decided that the floating
    point emulation could be unloaded once it was idle... but page layout (for print
    preview) used floating point, thus triggered the blue screens.<p>Once I figured
    that out (after a year+ hunt)... it got really, REALLY reliable.
