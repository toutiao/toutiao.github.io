  text: There is stuff that just is not done at all in scientific coding that is routine
    in more &quot;I majored in this in undergrad&quot; sort of coding roles. For example,
    type checking. Engineering tech interview will ding you for not specifying type
    in say function input definitions. After all, to the engineer brain, someone could
    supply an unexpected type and trigger a bug, better catch it there.<p>To the scientific
