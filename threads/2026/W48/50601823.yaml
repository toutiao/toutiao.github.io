  author: rstuart4133
  text: It&#x27;s rare that you can compare LLM output to a human&#x27;s, but I got
    the opportunity. It was some one-off throwaway code to scrape some websites, to
    find a good deal on buying a car the first time around and buying a tractor the
    second time around. It took me 800-odd lines for the car. The LLM generated over
    50k lines for a very similar task.<p>The technique was a wild success for the
    car, and a total failure (so far) for the tractor. My guess on why is kinda surprising
    to me.<p>The LLM (in the end) produced reliable working code that did exactly
    what I asked. But when I wrote the car-searching code, something else happened
    – I learnt about the second-hand car market, features available and what they
    sold for, and what they were worth to me. By the end of the process my expectations
    squarely matched market reality, the filters so finely tuned that I only had to
    look at a couple of candidates, and I was very happy with the outcome. The LLM&#x27;s
    search results were full of noise.  For example, I told it I only wanted nearby
    ads. It dropped the ones that gave a distant location, but kept the ones that
    gave none, even when their landlines put them 1000s of km away.  Worse, it missed
    many real candidates as it repeatedly missed features in the ads that were obvious
    to a human. For example, if they mentioned mowing it probably came with a slasher
    Had I written it myself, I&#x27;d have hit both of these early on, because I&#x27;d
    have been reading the ads. With the LLM writing it, I never read them, so I never
    knew to ask. I still don&#x27;t have a good feel for prices and what type of seller
    offers them, so I find myself going back and doing the searches manually to see
    what the LLM missed.<p>A middle ground would be to write the filters myself, so
    I get a feel for the market, and get the LLM to write the rest. The trouble is
    the same one you get with a bash script. You start with 10 lines; months later
    it&#x27;s a 1000-line monster, bash was clearly the wrong choice, and by then
    it&#x27;s far too hard to change. This started as a fully vibe-coded program.
    To bolt my own filters on I&#x27;d first have to understand its structure well
    enough to know what sort of filtering API would fit. That&#x27;s possible, but
    no one wants to read and understand 50k lines of crap that could have been done
    in 1k.  It would be less painful to write the whole thing myself.
