  text: I&#x27;m not following the reasoning how specs improve security issue response.<p>The
    idea is that a formal spec exists and AI generates code from that. Then when an
    attacker discovers a vulnerability, you can generate code again without needing
    to wait on the project maintainer.<p>If the spec plus the AI is sufficient to
    generate software without the vulnerability, why didn&#x27;t it just do that originally?
    Why would doing the same thing again fix anything?<p>Instead, the formal spec
    needs to be updated to add &quot;and don&#x27;t have this vulnerability&quot;.
    Which can be done, but now you&#x27;re back to coordinating with the maintainer.
    The maintainer owns the spec. What&#x27;s really happened is that software is
    now written in a different language, a formal spec language instead of a traditional
    language.<p>If you don&#x27;t want to wait on the maintainer, you could just change
    the spec yourself as a temporary measure. But that&#x27;s also not anything new.
    With traditional software, you can patch the source without the maintainer&#x27;s
    involvement as a temporary measure.
