  text: "&gt; Likewise when I look at the code for well respected open source projects.
    It&#x27;s good code in terms following accepted practices, but hard to read because
    there&#x27;s too much of it to see where the actual &quot;working&quot; code is.<p>&gt;
    A lot of the code is &quot;defensive,&quot; i.e., type and bounds checking, trapping
    error conditions, etc. When I&#x27;ve looked at the unit tests, most of them test
    the defensive code.<p>&gt; I tell my engineering friends: &quot;Engineers like
    to over-complicate things.&quot;<p>I took your message to be in a half-joking
    tone and I mean mine in the friendliest spirit, from someone who&#x27;s been where
    you are, in response to the half-serious part :)<p>I used to be an &quot;amateur
    scientific&quot; programmer like you, learned Pascal ~35 years ago, used Fortran
    and Delphi extensively (my field was experimental physics). At some point, I switched
    careers and become a &quot;professional&quot; programmer, working on operating
    systems and embedded software.<p>Your code simply has (more) bugs. All those unchecked
    bounds, uncaught error conditions, etc. Your short functions probably work fine
    on most inputs you give them and, if they occasionally don&#x27;t, with some luck
    you notice and you&#x27;re there to fix them (or if you&#x27;re less lucky, it
    propagates into some calculations and results unnoticed...)<p>I had a hard time
    accepting it the first time I was told. &quot;But that&#x27;s not a bug, it&#x27;s
    &quot;just&quot; an uncaught memory allocation error.&quot; Yeah, that&#x27;s
    a bug.<p>That defensive code probably has bugs too, but fewer bugs. It really
    depends on the field and the application, and the ease of update &#x2F; consequence
    of failure, how fewer bugs you need. For production code, that runs unattended,
    where uncaught errors can have bad consequences, the 10x extra code is there.
    That&#x27;s also why most of the tests focus on those edge cases (the main path
    will get tested heavily every time you&#x27;re running the program anyway).<p>I
    don&#x27;t mean your approach is wrong for you, it may very well be best for your
    use cases. But that &quot;over-complication&quot; is there for very good reasons."
