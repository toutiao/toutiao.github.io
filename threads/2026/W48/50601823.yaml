  author: antonvs
  text: Sorry, but what you&#x27;re describing sounds like ignorance in your part.<p>Code
    that needs to run in production environments has to deal with all sorts of issues
    that go far beyond just doing some sort of calculation. Scaling, concurrency,
    data integrity over time, maintenance over time, edge cases, code worked on by
    tags if people - all sorts of non-functional requirements which are not obvious
    to an amateur, which is what you are in this context.<p>If you&#x27;re unfamiliar
    with all of that - as most scientific and ML programmers are - you&#x27;re just
    not going to even recognize it when you see it, or recognize the need for it.
    And if you have the kind of personality that assumes anything you don&#x27;t understand
    is unnecessary, you end up posting comments like the above.
