article:
  url: https://anil.recoil.org/notes/software-too-complex-for-humans
  title: Was software just always too complex for humans? | Anil Madhavapeddy
  fetch_status: success
  content: "[Anil Madhavapeddy](https://anil.recoil.org) ![Anil Madhavapeddy](/images/faces/avsm.webp)[https://anil.recoil.org/notes/software-too-complex-for-humans](https://anil.recoil.org/notes/software-too-complex-for-humans)[image](https://anil.recoil.org/images/maths-vs-cs-loc.640.webp)\n\nI
    was [glued to the Lean chat](https://leanprover.zulipchat.com/#narrow/channel/113488-general/topic/Discussion.3A.20Alp.C3.B6ge.20Proves.20the.20Riemann.20Hypothesis)
    as the legendary [Riemann hypothesis was cracked](https://en.wikipedia.org/wiki/Riemann_hypothesis#Alp%C3%B6ge_alleged_proof)
    via 17 million (!) lines of AI-assisted code last week. This has since been [certified
    correct](https://leanprover-community.github.io/blog/posts/riemann-hypothesis/)
    despite [no human (yet) understanding](https://www.science.org/content/article/ai-may-have-solved-math-s-greatest-mystery-can-humans-understand-answer)
    how it works. The future of maths, and much science, is clearly going to involve
    human-AI boosting.\n\nHowever, it also struck me deeply just how broken software
    engineering has been for my entire life! There's always been an imbalance between
    our understanding of the theory of computation and our relentless drive to deploy
    software throughout society. We're paying the piper now as all those decades of
    human-written code turn out to be full of bugs. Since software essentially drives
    society now, weird things happen like [supermarket fridges needing James Bond
    to secure them](https://www.bbc.com/news/articles/c6eq49zyx7p4o). This has led
    to people like [Tim Gowers joining](https://x.com/wtgowers/status/2124287061620613160)
    the [Pause AI march](https://www.bbc.co.uk/news/articles/cmvg23q5xq31o).\n\nHow
    the hell did we get here? Have we just completely overestimated the human ability
    to write software? Or will software engineering 'catch up' once LLM harnesses
    get better?\n\nSoftware was reasonably under control in pre-AI times when attackers
    were roughly symmetric with defenders, but all the recent [mysteriously correlated
    outages](https://www.bbc.co.uk/news/articles/c6z0kly2lll7o) and disclosed issues
    ([Java](https://cyberscoop.com/java4shell-critical-java-flaw-openjdk/), [PHP](https://en.wikipedia.org/wiki/PHP2Shell),
    [Linux](https://openai.com/index/a-thousand-fewer-paths-to-root/)) all point to
    an [acceleration](/notes/rumour-is-the-exploit) of security pain in 2027. I only
    see two ways this can go...\n\n[ \n![The difference between mathematics and computer
    science, via Erik Meijer](/images/maths-vs-cs-loc.webp \"The difference between
    mathematics and computer science, via Erik Meijer\")\n_The difference between
    mathematics and computer science, via Erik Meijer_\n ](https://x.com/headinthebox/status/2124248546157432852)\n\n##
    [1](#derive-everything-from-specifications) Derive everything from specifications\n\nIn
    April this year, I [couldn't believe](/notes/internet-immune-system) we'd ever
    formally specify every layer of hardware and software:\n\n> I find it hard to
    believe that we will **formally specify all layers of hardware and software and
    roll them out into production**...ever. [A Fire Upon the Deep](https://en.wikipedia.org/wiki/A_Fire_Upon_the_Deep)'s
    software archeologists are a profession that's [here today](https://www.indeed.com/jobs?q=Cobol&fromage=14&vjk=6773c80abba24067)
    and not a scifi trope.\n\nHow a few months makes a difference. With the pace of
    frontier model advances, translating the vast body of existing legacy code seems
    entirely plausible _if_ we first speedrun towards defining formal specifications
    for all of our services, and derive _all new_ software from those as well.\n\nThat
    means rebuilding operating system stacks from the ground up and even [reengineering
    instruction sets](https://architectlabs.com/blog/frostbite) to match. There are
    [terrible legacy interfaces](https://x.com/yminsky/status/2123949643121696822)
    throughout the stack, largely because our software layers grew so that human groups
    could scale working on different parts. Other approaches do make it easier though.
    [Unikernels](/projects/unikernels) with a [libOS](/papers/2013-asplos-mirage)
    linking discipline plus [shared memory](https://youtu.be/abDWZ9D8kEE?list=PLyrlk8Xaylp4ZOkYWR5676Qxd22Y5f9xv)
    interconnects are [remarkably composable](/notes/icfp25-post-posix) and allow
    agents to specialise the whole stack at link time, with fewer interfaces making
    the [specification task less daunting](/ideas/lean-io-uring-backend).\n\nHaving
    good specs also conveniently takes humans out of the security response patch loop.
    Attackers are currently bounded only by their desire to break in somewhere, while
    defenders have to wait on [maintainer triage](/notes/rumour-is-the-exploit). However,
    fixes re-derived from a formal spec and machine-checked could work more reliably
    in a timely fashion. The human job remains [writing the interfaces](/notes/ocaml-modules-agentic)
    iteratively with an AI.\n\n## [2](#engineer-diversity-in-deliberately) Engineer
    diversity in deliberately\n\nHistorically, software has tended towards a monoculture
    through reuse, so [one bug](https://therecord.media/cisa-issues-java4shell-alert)
    can screw over vast numbers of hosts. Agents could instead force diversity via
    novel ['genetic' mechanisms](/papers/2025-internet-ecology) so digital services
    aren't all simultaneously infected. This works well with formal specifications,
    since any decent spec allows [multiple valid implementations](/papers/2015-sosp-sibylfs).
    The Internet's entire philosophy is based around [Postel's Law](https://en.wikipedia.org/wiki/Robustness_principle)
    and encouraging hosts to be liberal in what we receive and strict in what we transmit.\n\nThe
    catch, of course, is having just a handful of [gated frontier models](https://www.anthropic.com/glasswing)
    generating all our software takes us out of the frying pan into an AI controlled
    fire. The diversity has to extend _beyond_ the code to the models and harnesses
    too. We seem to have done ok with [Internet RFCs](https://www.rfc-editor.org/)
    not splintering too much, so perhaps formal specs can remain singular. Once that's
    done, it's time to go let hosts [mutate and inoculate](/notes/rewilding-the-web-report)
    each other and generally maximise unpredictability at scale!\n\n## [3](#digital-society-is-going-to-have-to-change)
    Digital society is going to have to change\n\nTo answer my opening question, I
    don't think better harnesses and models _alone_ will let software engineering
    catch up, as they just produce mountains of slop code. We need _both_ of the above;
    formal specifications that let hosts finally be strict about what they receive
    instead of liberally accepting whatever shows up, while diversity ensures that
    things that the specs (inevitably) don't capture doesn't break everywhere, everywhere
    all at once.\n\nThe real upheaval here will be to social coding though. Open source
    communities have run on social contracts of human review and trust built up over
    decades, and every single one I'm a member of is struggling under matters of [AI
    disclosure](/notes/opam-ai-disclosure-update) and [trust](https://blog.tangled.org/vouching/).\n\nAt
    least humans aren't out of a job yet though! Somebody still has to decide what
    our specs contain, as we have done for decades with RFCs. There's also plenty
    of new computer science research needed! We need to figure out how to [debug diversity](/ideas/antibotty-testbed)
    when no two nodes run the same code, and on how to force simplicity on systems
    that agents maintain, and ultimately how we settle the blame games when things
    do go wrong...\n\n### References\n\n[[1]](#cite-10-1145-3744169-3744180 \"Jump
    to citation\")Madhavapeddy et al (2025). Steps towards an Ecology for the Internet.
    Association for Computing Machinery. [10.1145/3744169.3744180](https://doi.org/10.1145/3744169.3744180)\n\n[[2]](#cite-10-59350-g6hbj-qmc76
    \"Jump to citation\")Madhavapeddy (2026). OCaml's module language is the perfect
    fit for agentic programming. [10.59350/g6hbj-qmc76](https://doi.org"
