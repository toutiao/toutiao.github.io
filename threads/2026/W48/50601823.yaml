  author: cadamsdotcom
  text: "&gt; Most - maybe all - professional programmers I&#x27;ve worked with spend
    longer in the debugger or inserting and reading logs<p>Don&#x27;t say debugger!
    A debugger is a tool of last, last, last resort. It only helps for an instant!
    It doesn&#x27;t build <i>durable</i> assurance of correctness for you or your
    team; and the knowledge you gain only helps once. It&#x27;s a super low leverage
    use of time.<p>Your limited time and energy should produce durable assurances
    of quality in your work. Consider replacing with these practices -<p>1. Test-driven
    Development (TDD, red&#x2F;green&#x2F;refactor.. it has many names)<p>Write the
    tests first; witness the tests fail, confirm they&#x27;re failing for the right
    reason (not some irrelevant issue like missing imports) and only then move on
    to implementation. If you&#x27;re putting tests in for code that already works,
    modify the production code to break it; witness the tests fails. Make 100% sure
    those prove what you think they do, because a test that has never been seen to
    fail is not only useless it&#x27;s a risk that you left lies forever in your codebase.<p>2.
    End-to-end testing and the testing pyramid<p>Write end to end tests. Exercise
    as much of the system&#x27;s architecture as possible in a closed container (eg.
    with a browser test framework like Playwright, and a container orchestrator like
    docker compose)... but since that&#x27;s slow at the scale of a real product only
    cover the happy path. Defer to unit, feature, and integration tests for the rest,
    because smaller tests can remove all I&#x2F;O, not test third-party code, and
    have injected dependencies - and thus, run in parallel under a millisecond. End
    to end tests don&#x27;t have that luxury; hence, testing pyramid.<p>3. User Acceptance
    Testing<p>Which stakeholder(s) declare your implementation meets the original
    requirements? Put them in the process before release. They should confirm business
    and technical compliance with what you were supposed to build, and help catch
    more bugs before production<p>4. Feature-flags, A&#x2F;B tests, and smaller, more
    frequent releases<p>Release more often, so each change can be smaller, spreading
    the risk of releasing out over many releases instead of one &quot;big bang&quot;
    (you know why we call them big bang releases right? because that&#x27;s what they
    do) .. Hide work behind feature flags that ready to be enabled, then when it&#x27;s
    ready, unleash it on the world in an instant. Bug with the work? Roll back the
    feature flag. Amazing.<p>5. Observability.<p>Make it possible to understand in
    the present moment as well as forensically what is happening in your product.
    Add traces, emit metrics, plan out logs to insert ahead of time (any time a metric
    won&#x27;t suffice), add in product usage metrics to see where people are dropping
    out&#x2F;getting confused and improve those things, and any other<p>6. Load testing,
    fuzz testing, security testing, performance testing, fault-injection testing<p>Most
    products have requirements that&#x27;ll drive these and many other types of testing.
    Don&#x27;t do a once-off test &amp; fix. Produce harnesses and artifacts - and
    include them for the next person to pick up where you left off. Even better make
    these tests continuous and put them into your process - ie. in CI.<p>All preventative
    stuff that should helps keep that debugger at bay. In conclusion: say no to debuggers!"
