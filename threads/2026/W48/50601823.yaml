  author: codedrift_
  text: Yeah, because it&#x27;s probabilistic all the way down, adding stuff to the
    spec doesn&#x27;t change the outcome.<p>&quot;If the spec plus the AI is sufficient
    to generate software without the vulnerability, why didn&#x27;t it just do that
    originally?&quot; I ask this too. Best answer I&#x27;ve gotten is that LLMs simply
    don&#x27;t know&#x2F;understand systems yet in a way that would let them proactively
    find and fix these issues in the normal course of writing code.<p>I don&#x27;t
    think that our test suites are robust enough to handle the idea of &quot;re-engineer
    everything from a specification.&quot; There are plenty of examples of code that
    is being rewritten to Rust and proudly posted to X that looks like it passes all
    tests, and yet we learn very quickly that the tests never accounted for real world
    scenarios. I also oscillate daily as to whether or not we will ever be able to
    build test suites robust enough to handle this. In theory, yes, if we write good
    enough test suites with enough coverage, we&#x27;ll get similar behavior... But
    there&#x27;s just so few examples of what that looks like in practical everyday
    software that we ship.
