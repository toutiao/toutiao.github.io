    scale projects like building an OS from scratch or a database engine that&#x27;s
    a lot less likely to be true, simply because there are dozens of examples of humans
    doing that level of complicated work without AI already (the OSs and DB engines
    we have are very literal evidence of it.) They just need to work collectively.
    Every part of those projects is understood people a person even if no person understands
    the whole thing.<p>So the problem with doing the same sort of thing with AI becomes
    a question of whether someone can build the equivalent sort of project with AI
