  author: D-Machine
  text: In general fresh tomatoes make for shitty sauce, because fresh tomatoes are
    selected for and bred for characteristics that make them good when fresh &#x2F;
    raw, e.g. thick enough skin to survive stacking and transport, plenty of moisture
    for that &quot;wet&quot; fresh taste, and higher acidity to preserve freshness.
    Using these to make a sauce will generally result in an inferior sauce (although
    some cherry tomatoes are an exception).<p>The kind of tomatoes you want for good
    sauce are totally different, and are picked fresh and put straight into the can.
    You cannot &quot;learn how to pick these&quot; beyond simply trying the different
    companies cans (or trying to get into arcana about specific lot &#x2F; batch numbers
    implying harvest dates), because you cannot inspect the tomatoes inside.<p>So
    sauce tomatoes are an exception where you can&#x27;t really &quot;learn how to
    pick best ones&quot; by look or feel, it really does come down to total solids
    and other quantities that aren&#x27;t visible or feelable until cooked.
  score: 0
