  author: kergonath
  text: "&gt; DOP is ABSOLUTELY a mark of quality. Italy takes food certifications
    very seriously.<p>It’s not only Italy taking this seriously. And these are <i>not</i>
    certifications of quality; they are certifications of origin and method. So in
    a sense they guarantee the quality floor, but indirectly by putting constraints
    on the ingredients used and on the methods of production. But it does not mean
    that basically the same product, made in conditions or locations different enough
    that they don’t get the certification cannot be better. Also, some certifications
    are stricter than other in terms of what they allow.<p>For example, I really like
    Roquefort, which is a PDO that is strongly enforced. I think that even the most
    basic ones are quite good. There are several other blue cheeses made in other
    villages of the region and that are just as good or better, but they are outside
    the PDO.<p>The parent mentioned champagne, which is a bit similar: there are several
    sparkling wines made the exact same way but outside the PDO, and those can be
    fantastic as well, much better than average champagne."
