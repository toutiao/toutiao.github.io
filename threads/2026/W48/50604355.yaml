  author: stellar678
  text: 'People love being wrong about things like this.<p>It&#x27;s so popular: &quot;Eww,
    the US does food so different. Our European industrial mass-market canned tomatoes
    come from pastoral farms tended by a Spanish grandfather who lovingly carries
    them in a basket to his wife who preserves them in a traditional process her family
    has followed for two thousand years.&quot; (Hint: Grandma added acid too if she
    wanted to create safe food preservation.)<p>Citric acid is just about the most
    basic ingredient you could add to packaged food after salt. In fact, canned vegetables
    often skip the salt but they still have to include acid to hit the proper food-safe
    acidity.<p>It&#x27;s in almost every can of tomatoes in every supermarket in the
    world. You might think it&#x27;s not, but just look.<p>I just checked France (Auchan),
    Germany (Aldi), Spain (Carrefour). Their canned tomatoes all include citric acid.'
