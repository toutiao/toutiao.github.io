  author: D-Machine
  text: The hate for canned tomatoes is extremely common, but comes from a place of
    prejudice and lack of culinary knowledge and research. I imagine even in Italy
    this misconception is common. I also used to believe the &quot;fresh is best&quot;
    thing until somewhat recently, when I really started testing carefully at home,
    and finally did some proper research to understand why.<p>Now, thankfully, it
    is easy to have AI look into this. It&#x27;ll find you plenty of serious Italian
    chefs and organizations that explicitly say canned is best. There are some exceptions,
    but those chefs also specify that it is essential to use the right cultivar at
    the right season. Basically, &quot;canned is worse&quot; is not supportable, really,
    provided you buy quality canned, and this is true even in serious Italian cuisine.
    It is also IMO obvious when you test this at home.
