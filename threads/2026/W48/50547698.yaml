  text: 'I&#x27;m not sure I understand your point (I&#x27;m definitely not pretending
    to be any sort of expert, note)?<p>Sounds like you&#x27;re saying that some Sudanese
    call themselves Arab, and some Gulf Arabs disagree because these Sudanese don&#x27;t
