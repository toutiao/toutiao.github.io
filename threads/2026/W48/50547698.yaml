    my point that, as I understand it, &quot;Arab&quot; is used on a language and
    culture-basis rather than an ancestry basis (hence the Sudanese claim to being
    Arabs). Gulf Arabs might value the ancestry-based claim more (I&#x27;ve not looked
    into whether that&#x27;s true) and not consider the Sudanese Arabs: that&#x27;s
    within the aforementioned grey area.<p>Even in the so-called middle east itself
    there&#x27;s not one way to &quot;see things&quot;: Moroccans, Egyptians or Iraqis
    have mostly local ancestry rather than Arabian ancestry, yet Arabic-speaking people
    there are generally considered Arabs. Under a strict ancestry rule, most of the
    &quot;Arab world&quot; wouldn&#x27;t qualify as Arab. And at the same time, some
    of these people do reject the Arab label in favour of their ancestry-based ethnicity
    (eg some Moroccans with Berber ancestry). There&#x27;s no single answer, there&#x27;s
    no one definition of &quot;Arab&quot;, it&#x27;s all fluid labels with grey areas.<p>(as
