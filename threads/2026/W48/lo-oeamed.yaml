  text: |-
    Your binaries can be paths relative to $path elements. For a few actual examples:
    % git/clone https://git.9front.org/plan9front/9front
    % audio/mixfs
    % ip/ping 192.168.0.1

    these are just directories in /bin:
    % ls /bin/git
    /bin/git/add /bin/git/branch /bin/git/clone ...

    Edit: this is done by simply not having the code in exec that explicitly checks for '/' and changes what the token gets concatenated with. Better living through dumber code.
