  text: 'Depends what you mean by &quot;unsolvable&quot;. The halting problem is <i>undecidable</i>
    (meaning, there is no Turing machine for it, and we can prove that by the standard
    argument) for general inputs. For any finite set of inputs, it&#x27;s certainly
    decidable. For example, for any N you can construct a machine that takes another
    machine as input, simulates that one for N steps, and says &quot;HALTS&quot; if
    the simulated machine has halted (and &quot;DOESN&#x27;T HALT&quot; otherwise).
    For any finite set of input machines, you just have to make N large enough. For
    example, BB(200) is enough to decide correctly for all the machines in the parent
    comment.<p>What those machines show is that the theories in question are not enough
    to <i>prove</i> any upper bound for BB(200) (unless the theory is inconsistent),
    which you can interpret as some form of &quot;unsolvable&quot;. But BB(200) still
    &quot;exists&quot;, and it is a concrete integer: every specific machine either
    halts or doesn&#x27;t halt, regardless of whether our specific theory is enough
    to prove either way. So out of the finite set of halting machines, one will take
    the longest and that will determine BB(200).<p>That&#x27;s my understanding of
    the matter anyway, but I&#x27;m not an expert on decidability &#x2F; logic.'
