  text: It&#x27;s a purely recreational activity. But there&#x27;s a surprising amount
    of depth to it--the skill ceiling is extremely high and it&#x27;s not uncommon
    for thought-to-be optimal solutions to be beaten years later. There&#x27;s lots
    of crazy math and algorithm tricks you will never see in conventional programming.
    Getting good at code golf requires mastering not only the language, but lots of
    math and algorithmic skills as well.<p>Part of the fun is also doing things you&#x27;re
    not supposed to do. Not only does it become unreadable, but you often are abusing
    dark corners of the language and implementation.
