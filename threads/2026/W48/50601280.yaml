  author: indigo945
  text: "I started to write an explanation myself, then I felt that human effort is
    overrated and just had ChatGPT generate one for me. (It did require some additional
    prompting to get it right, though - I should have probably asked Astra from Codex
    instead of whatever model they feed you on the chat UI.)<p><pre><code>    def
    g(a):\n        # Make p a 1-element array of a 99-character string filled with
    &#x27;z&#x27;.\n        p = [&#x27;z&#x27;*99]\n\n        # Create a view of the
    board that combines each row with the\n        # row above and below it. The padding
    ensures that the first\n        # and last rows also have three rows to work with.\n
    \       #\n        # For example, with:\n        #   a = [&#x27;001&#x27;, &#x27;110&#x27;,
    &#x27;101&#x27;]\n        #   p = [&#x27;zzz&#x27;]\n        #\n        # We get:\n
    \       #   a       = [&#x27;001&#x27;, &#x27;110&#x27;, &#x27;101&#x27;]\n        #
    \  p+a     = [&#x27;zzz&#x27;, &#x27;001&#x27;, &#x27;110&#x27;, &#x27;101&#x27;]\n
    \       #   a[1:]+p = [&#x27;110&#x27;, &#x27;101&#x27;, &#x27;zzz&#x27;]\n        #\n
    \       # zip() stops at the shortest input, producing:\n        # [\n        #
    \  (&#x27;001&#x27;, &#x27;zzz&#x27;, &#x27;110&#x27;),\n        #   (&#x27;110&#x27;,
    &#x27;001&#x27;, &#x27;101&#x27;),\n        #   (&#x27;101&#x27;, &#x27;110&#x27;,
    &#x27;zzz&#x27;)\n        # ]\n        #\n        # Each tuple contains the current
    row, the previous row\n        # (or padding), and the next row (or padding),
    in that order.\n        board = zip(a, p+a, a[1:]+p)\n\n        result = []\n
    \       for r in board:\n            # If a is still in its original orientation,
    transpose\n            # the three rows and recursively process them.\n            #\n
    \           # zip(*r) turns the three rows into columns, allowing\n            #
    the next recursive call to process the board in the\n            # other orientation.\n
    \           #\n            # The backticks convert the recursive result (a list\n
    \           # of integers) to its string representation: &quot;[0, 1, 0]&quot;\n
    \           # (`` is just shorthand for repr(), which is supposed to\n            #
    return a machine-readable string representation of a value.)\n            # [1::3]
    extracts every third character, effectively\n            # extracting the individual
    cell values from the list\n            # representation.\n            #\n            #
    The comparison a&lt;p is also a clever way to distinguish\n            # the original
    board from the transposed board: Python 2\n            # compares the different
    element types differently.\n            #\n            # Boolean expressions short-circuit
    in Python, and they\n            # return the result of the last term evaluated,
    not True&#x2F;False;\n            # for example, `0 or 1` will evaluate to 1,
    not True. The original\n            # golfed version makes use of this to take
    one of two branches\n            # without spending the golf budget on writing
    if&#x2F;else.\n            if a &lt; p:\n                result.append(`g(zip(*r))`[1::3])\n
    \           else:\n                # We are now looking at three adjacent columns,
    each\n                # containing three cells: a complete 3x3 neighborhood.\n
    \               #\n                # r*2 duplicates the neighborhood. Converting
    it to\n                # a string and counting &#x27;1&#x27; gives twice the number
    of\n                # live neighbors, plus the center cell.\n                #\n
    \               # Starting the count at index 4 skips the first\n                #
    occurrence of the center cell, but its second\n                # occurrence remains.\n
    \               #\n                # Therefore:\n                #   dead cell
    with 3 neighbors: 6\n                #   live cell with 2 neighbors: 5\n                #
    \  live cell with 3 neighbors: 7\n                #\n                # All these
    cases satisfy 4 &lt; count &lt; 8.\n                #\n                # Unary
    + on a boolean (the result of the comparison)\n                # converts it to
    an integer (0 or 1).\n                # Because we are currently in the recursively
    called branch,\n                # the caller will turn our entire return value
    into a string \n                # (via backticks); therefore, we do not have to
    bother turning the\n                # converted integers back into strings.\n
    \               result.append(+(4 &lt; `r*2`.count(&#x27;1&#x27;, 4) &lt; 8))\n\n
    \       return result\n</code></pre>\nMost of this are pretty standard Python
    2 codegolf tricks that I used to use, when I was still interested in this stuff.
    (I like to think my much younger and more carefree self used to be decent at codegolfing
    in Python.) Python 2 is weirdly weakly typed, with implicit conversions all over
    the place - most codegolf programs of the era will make extensive use of this.
    The only language-level trick that stands out to me is the `listOfChars`[1::3]
    to convert a list of single-digit integers to a string, and I suppose that one
    is kind of obvious when you think about it - just rarely comes up.<p>The really
    smart part is the way it uses recursive calls with branches with an implicit test
    `a&lt;p` to check whether we are in the recursively called branch or not. Most
    people would have probably created a second function instead of a branch to do
    the counting, which would have incurred the heavy golf cost of having to type
    `lambda` to declare it, or passed an explicit flag to the recursive call, which
    also incurs character penalties."
