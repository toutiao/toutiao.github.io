  author: tylermw
  text: LLMs are great at data ingestion, but far less reliable at creating beautiful
    output. Tools like rayshader cut down the model’s creative degrees of freedom,
    which is exactly what it needs to get good artistic results consistently. And
    you don’t have to bundle those libraries with the output. They’re what you use
    to generate it.<p>You could probably one-shot a convincing terrain demo. forge3d
    (<a href="https:&#x2F;&#x2F;github.com&#x2F;milos-agathon&#x2F;forge3d" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;milos-agathon&#x2F;forge3d</a>)
    is already an attempt to vibe-code a Python recreation of rayshader. Getting to
    parity means recreating or integrating the whole spatial data stack, from projections
    and raster alignment to vector overlays, meshing, and 3D rendering. That gets
    complicated fast once you start throwing real data at it. The repo’s commit history
    gives you a sense of what “vibe-coding rayshader” actually entails.<p>Separately,
    the roads in rayshader generally look good out of the box. They don’t have to
    be perfect to be useful.
