  author: nkoren
  text: 'In my day, if you&#x27;d asked this question to anybody at Arcosanti, they
    would have said &quot;money&quot;.<p>That answer would have been wrong, or at
    least incomplete. You can draw a straight line from Soleri&#x27;s late-stage &quot;linear
    arcology&quot; concept to Saudi Arabia&#x27;s, well &quot;The Line&quot; -- which
    has done a fine job of proving that having more money than sense is <i>also</i>
    not an effective way to build an arcology.<p>The problem is&#x2F;was that Arcosanti
    had no viable economic or governance model, nor did it even <i>attempt</i> to
    have one. It&#x27;s a big vision glued to a small bell-making business and a small
    nonprofit foundation -- which adds up to being a small company town -- and has
    never made a sincere effort to be anything else. That&#x27;ll just never be an
    effective way to build a city.<p>Why was it so constrained?<p>For Soleri: economics
    and governance were basically just blank spots in his philosophy. He knew that
    he hated capitalism in general and consumerism in specific -- but this didn&#x27;t
    translate into wanting to seriously try any kind of alternative model. This took
    a lot of possibilities off the table without putting anything back on it.<p>For
    the rest of the management: transitioning away from being a small company town
    --however that was done -- would have required stepping far outside of an increasingly
    entrenched comfort zone. So they had little motivation to do so.'
