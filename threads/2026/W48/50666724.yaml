  author: nkoren
  text: 'Well, Soleri will come back to haunt me from beyond the grave if I let the
    &quot;utopian&quot; bit go unchallenged, and so: he <i>hated</i> that label. He
    equated &quot;utopian&quot; with &quot;divorced from reality&quot;, and said that
    the American norm of hyperconsumption and suburban sprawl was in fact utopian.
    He was very serious about standing in opposition to this, and therefore considered
    Arcosanti&#x27;s frugality to be <i>anti</i> utopian.<p>Most of the people there
    bought into this to one degree or another -- although apart from that most basic
    premise (which itself wasn&#x27;t <i>universally</i> embraced), there wasn&#x27;t
    a lot of agreement about anything else. While Arcosanti did exist within the general
    milieu of the &quot;intentional community&quot; movement -- and therefore pulled
    in a lot of people with that interest -- there was no top-down effort to foster
    that, and the bottom-up efforts tended to be haphazard and short-lived.<p>That
    said, there were some ways in which it was definitely a bubble apart from the
    rest of reality, and those ways were <i>fun</i>.'
