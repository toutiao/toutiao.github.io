    I wish that would extend to every aspect of the app. But they still don't support any privacy-friendly app distribution mechanism (e.g. something like F-Droid) -- I need to use Aurora Store to install Signal, which is a terrible hack and who knows how long it'll keep working. And while Signal does work without Google push notifications these days, the support is so bad (consuming huge amounts of battery) that I ended up allowing Signal to register for Google push notifications via microG just to prevent it from draining my battery. (And to be clear, that's entirely a Signal problem -- I have two other chat apps with fully reliable notifications that do not use Google push notifications and do not drain my battery: Conversations and Telegram.)
    For a privacy-focused app, this is just embarrassing in my eyes.
    And then there's the part where they insist on syncing my contacts via their servers. I know it's all encrypted and whatnot, but it's just a totally unnecessary risk. The app even has an internal developer setting to turn it off, they just don't expose that to users. This makes me seriously question their motivations.
