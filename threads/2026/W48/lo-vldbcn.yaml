    This story about GrapheneOS not having good privacy originated about 7 years ago, as marketing to distinguish CalyxOS from GrapheneOS. At that time, Calyx had microG support, which had better privacy than unsandboxed Google Play Services on the GrapheneOS of that time.
    Much has changed. GrapheneOS now supports sandboxed Google Play Services, with much better privacy. Some people do run microG on GrapheneOS. In theory you could run both, in different profiles?
    For my own uses, GrapheneOS has better privacy than anything else. Security is part of that: privacy is illusory if you have security holes. Also, GrapheneOS has the most powerful sandboxing.
