    The sharp edge I've run into a few times is keeping conversations synced between multiple devices.  I use Signal on my phone, but occasionally I need to open a file on my computer (or it's just easier to text from my computer if that's what's open), and then I want everything synced.  This is now possible (for a long time that wasn't the case), but if the two devices desync (because I've not opened Signal on my computer in too long, or something like that), then when I resync the two devices, none of the more recent chats get synced over.  So then I need to completely disconnect the two and get all the data.
