    Screenshots of texts.
    Urgh.
    If you consider yourself a technologist and are not infuriated by this, you are probably not paying enough attention of what is possible since 40 years and how we are regressing at every level of user experience.
    Even Idiocracy could not conceive that we would become that dumb with so much technology.
