    At some point, we need to acknowledge the poor society choices that were make for us.
    Chats were designed for transient conversations and not as a data store. In fact, those are the worst possible data store: you can’t save them as plain-text file, you can easily copy them. Heck you cannot even search through them, you cannot triage them nor forward a bunch of them easily. The only way to read them? Scrolling like crazy to the point of you finger hurts.
    My emails are stored locally on my laptop, I can plain search through 20 years of email in the blink of an eye (thanks notmuch), I can use the client I want to compose my emails, to read them.  I can organize emails, triage them.
    But we have come to the point were, with our gigabit chipsets, the only interface is a wall of bubble of texts where the only way most people save or share something is by taking screenshots.
    Screenshots of texts.
    Urgh.
    If you consider yourself a technologist and are not infuriated by this, you are probably not paying enough attention of what is possible since 40 years and how we are regressing at every level of user experience.
    Even Idiocracy could not conceive that we would become that dumb with so much technology.
    So I took the opposite stance: all my signal messages are deleted after a week. If it is important, it should be sent by email. If I still receive something important, I know I have to save it immediately instead of hoarding chat history.
    https://ploum.net/2025-05-23-chats-digital-clutter.html
