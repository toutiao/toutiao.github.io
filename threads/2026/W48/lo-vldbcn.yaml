  text: I had almost zero data loss for the last 20 years; Signal chat history is
    one of the few exceptions. There are barely any exporter tools to migrate chat
    history. Last time I tried syncing up a new phone with Signal, the migration functionality
    was broken and I lost my entire chat history. I also had buggy Signal updates
    that required me to reconnect with loss of the entire history. I know, the chat
    history is private data that must be protected and so on. But why make it such
    a pain? All the defaults (and bugs) make you lose data and you have to tread super
    carefully not to lose data and to sync up and preserve your history. That has
    nothing to do with privacy, that's just broken. At some point, you're just like
    "whatever, let's use Discord, this is just too much of a pain" even though you
    know that this company slurps up all your private data and does who knows what
    with it. Also, of course, Discord has much better community server features.
