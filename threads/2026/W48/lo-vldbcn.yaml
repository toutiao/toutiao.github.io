  author: david_chisnall
  text: |-
    The problem with the old Signal backups were twofold:
    First, there was a completely different format for iOS and Android, which meant that you couldn't use the backups to migrate.
    Second, each backup was a complete backup.  This meant that any kind of syncing was very painful because you'd want to copy gigabytes of data each day.
    The new model is much better.  It's a uniform format.  It stores each media file (images, videos, and so on) in a content-addressable store (in separate files) and does a complete backup only of the messages, which are relatively small.  This means that syncing elsewhere requires only a few megabytes of transfer per day.  It's somewhat weaker for security: you can do group-membership attacks if you have access to the backups fairly easily, but if you aren't sending your backups anywhere untrusted then it's not a big problem for most people's threat models.
    The annoying thing is that you can back up from the desktop client but there doesn't seem to be a way to restore there, you have to restore to the phone and then sync (and the sync doesn't copy older media).
