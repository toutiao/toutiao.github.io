  author: Silhouette
  text: Self-hosting never really went away. A lot of people followed the crowd&#x2F;hype&#x2F;work
    to the cloud but plenty did not.<p>The trade-offs for going cloud hosted were
    also pretty clear right from the start. If you need immediate availability or
    near-immediate extreme scalability then there is only so much you can do if you&#x27;re
    physically moving hardware and configuring all the platform&#x2F;OS level details
    yourself. If you need predictable costs and complete control over security and
    privacy and for things to change on your timetable according to your needs and
    not someone else&#x27;s then there is only so much you can do if you&#x27;re relying
    on a third party&#x27;s equipment and platform&#x2F;OS level details. Either way
    you always needed to understand issues like security and reliability and it was
    always a myth that you could fire all the greybeard sysadmins and everything would
    magically just work in cloud land.<p>The main difference I see over time is that
    the theoretical risks are becoming more practical risks as many service providers
    try to increase their profits by ramping up prices and&#x2F;or sacrificing quality.
    The widespread introduction of AI over the past couple of years has accelerated
    this process - though I&#x27;m not sure it has fundamentally changed the direction
    that much of the industry was moving in anyway.
  score: 0
