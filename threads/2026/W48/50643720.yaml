  author: mystifyingpoi
  text: "&gt; so should be part of authorised IT<p>You&#x27;re correct, but the devil
    is in the details. Big companies are very compartmentalized. You have siloses
    everywhere, and cross-concern teams are rather an exception than the rule.<p>So,
    for instance: someone decides to pick web (not self-hosted) GitHub. Microsoft
    will run it for you, and company needs only a good GitHub admin team to configure
    it for 1000+ people. Totally doable. Microsoft does the heavy lifting.<p>But if
    you pick self-hosted GitLab, you need an infra person, a database person, a network
    person, maybe a security guy, maybe a performance guy, and on top someone who
