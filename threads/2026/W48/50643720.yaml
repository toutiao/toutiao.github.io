  author: ryandrake
  text: The arguments against self-hosting often boil down to 1. Do you think you
    personally will be able to maintain uptime better than $PROFESSIONAL_PROVIDER?
    and 2. Self hosting cannot scale like $PROFESSIONAL_PROVIDER can. I think both
    of these arguments are being put to the test lately, at least when it comes to
    some providers.<p>For 1. yes. I think at this point, I <i>can</i> keep a service
    up more reliably than a company who insists on Moving Fast And Breaking Things
    over and over. I pretty much don&#x27;t touch my own self hosted services. They
    are set and forget, besides routine security patches. I&#x27;ll accept the Uptime
    Pepsi Challenge against GitHub any day.<p>For 2. most of us don&#x27;t need to
    scale to the extent that GitHub needs to scale. Our source code is not expanding
    exponentially. We need the service&#x27;s scale today to roughly match the service&#x27;s
    scale yesterday. That can be done by self-hosting.
