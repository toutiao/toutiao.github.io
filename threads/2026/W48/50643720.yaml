  author: Silhouette
  text: "<i>Big companies are very compartmentalized. You have siloses everywhere,
    and cross-concern teams are rather an exception than the rule.</i><p>This is often
    true <i>but it is a choice</i>.<p>Over time many organisations have sidelined
    or abolished traditional technical roles that specialised in one important aspect
    of a system and often served as shared resources for the wider organisation. Likewise
    traditional technical roles that focussed on communication and coordination at
    large scales have been disappearing in many organisations.<p>Instead we usually
    see more hierarchical org structures today. That naturally leads to silos with
    a diverse set of skills within each but little in the way of cross-communication
    or shared gains. It also leads to all kinds of unhelpful corporate politics like
    empire building and civil wars between divisions.<p>IME these problems usually
    start with a failure of management and a lack of leadership vision. They are much
    more social problems than technical ones. And they are definitely not the only
    way."
  score: 0
