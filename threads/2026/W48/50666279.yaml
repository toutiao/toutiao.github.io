  author: petcat
  text: The UK law is much stricter about acceptable methods for determining age and
    location.  The California and New York laws allow for reasonable estimation, whereas
    the UK law requires strict verification.<p>It&#x27;s a big legal difference and
    requirement from the platform&#x27;s perspective.<p>It&#x27;s a philosophical
    difference between how these governments are approaching the problem. The UK is
    essentially requiring <i>every single child</i> to be perfectly verified. Whereas
    the California and New York laws simply require the broader <i>category of children</i>
    to be verified while allowing it to be best-effort and accepting that some will
    slip through.<p>The UK-style law is almost impossible in USA without facing significant
    Constitutional opposition.
  score: 0
