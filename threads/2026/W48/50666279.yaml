  author: tzs
  text: They are not banning &quot;personalized&quot; feeds. They are banning &quot;addictive&quot;
    feeds. Here&#x27;s how the NY law defines &quot;addictive feed&quot;:<p>&gt; &quot;Addictive
    feed&quot; shall mean a website, online service, online application, or mobile
    application, or a portion thereof, in which multiple pieces of media generated
    or shared by users of a website, online service, online application, or mobile
    application, either concurrently or sequentially, are recommended, selected, or
    prioritized for display to a user based, in whole or in part, on information associated
    with the user or the user&#x27;s device, unless any of the following conditions
    are met, alone or in combination with one another:<p>&gt; (a) the recommendation,
    prioritization, or selection is based on information that is not persistently
    associated with the user or user&#x27;s device, and does not concern the user&#x27;s
    previous interactions with media generated or shared by other users;<p>&gt; (b)
    the recommendation, prioritization, or selection is based on user-selected privacy
    or accessibility settings, or technical information concerning the user&#x27;s
    device;<p>&gt; (c) the user expressly and unambiguously requested the specific
    media, media by the author, creator, or poster of media the user has subscribed
    to, or media shared by users to a page or group the user has subscribed to, provided
    that the media is not recommended, selected, or prioritized for display based,
    in whole or in part, on other information associated with the user or the user&#x27;s
    device that is not otherwise permissible under this subdivision;<p>&gt; (d) the
    user expressly and unambiguously requested that specific media, media by a specified
    author, creator, or poster of media the user has subscribed to, or media shared
    by users to a page or group the user has subscribed to pursuant to paragraph (c)
    of this subdivision, be blocked, prioritized or deprioritized for display, provided
    that the media is not recommended, selected, or prioritized for display based,
    in whole or in part, on other information associated with the user or the user&#x27;s
    device that is not otherwise permissible under this subdivision;<p>&gt; (e) the
    media are direct and private communications;<p>&gt; (f) the media are recommended,
    selected, or prioritized only in response to a specific search inquiry by the
    user;<p>(&gt; g) the media recommended, selected, or prioritized for display is
    exclusively next in a pre-existing sequence from the same author, creator, poster,
    or source; or<p>&gt; (h) the recommendation, prioritization, or selection is necessary
    to comply with the provisions of this article and any regulations promulgated
    pursuant to this article.<p>I believe California&#x27;s law is similar.
  score: 0
