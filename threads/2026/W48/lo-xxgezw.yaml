  content: "# Illiterate Programming\n\n### Author: Iris Meredith\n\n### Date published:
    2026-11-22\n\nMy family comes from a part of the world where writing is held in
    very high esteem. Our poets are national heroes, our role-models are dissident
    essayists, and our governments, unlike those in Australia and New Zealand, had
    the good grace to actually attempt to persecute writers because, if nothing else,
    they knew that those writers would be read. Even now, it's still a cultural expectation
    that a middle-class Polish adult is at least a little well-read, and they should
    be able to identify and have read at least three or four poets.\n\nIt's probably
    not a surprise, then, that I grew up surrounded by books and grew into a voracious
    reader as a child. I've always been good at reading and read a lot and, once I'd
    read enough, I turned out to be a pretty damned effective writer as well. Reading
    and writing have, in short, always been a massive part of my life to the extent
    that I almost did an arts conjoint with my engineering degree and when I was dissuaded
    from that by my parents (one of the biggest regrets in my life, if I'm to be honest),
    I still did my absolute best to keep up with the humanities as I did my engineering
    degree (I spent altogether too much time in the library trying to unpick the Latin
    of the Vulgate bible). And my literacy, little though you might expect it, did
    me some considerable favours. Being able to write well and lucidly saved me in
    a couple of engineering courses where I was struggling with the maths, I suspect,
    and I was able to contribute to magazines and online publications which kept me
    socially connected despite being a socially awkward mess.\n\nIt was a jolt, therefore,
    when I started my third job and found myself, for the first time, interacting
    with actual programmers. My first job was for an acoustics consultancy, and I
    was more than a little lucky with it, truth be told: the place was full of sensitive
    and intelligent music-lovers, some of whom were literary and the rest of whom
    were at least interested in _something_ worthwhile. My second job involved working
    heavily with biologists: again, quite a literate crowd, even if some of them were
    wilfully obtuse about the humanities in the way scientists often are. My third
    job, though? Nope. Never have I had the misfortune to spend so much time with
    wilfully ill-read, obtuse, uncultured philistines. And this isn't just me complaining
    that they don't read Eliot or what-have-you: they had only the barest familiarity
    with Shakespeare, the bible or any novel at all. Hell, they thought Brandon Sanderson
    unbearably intellectual, and Sanderson is pretty pulpy as an author.\n\n_Writing
    is often a precarious way to make a living, both directly and indirectly. While
    our situation is stabilising, it's a slow process, which means that if you derive
    value for my writing, I fear I must ask, as always, for your support. If you'd
    like to contribute to helping keep me writing, then, you can do so via [Patreon](https://www.patreon.com/c/IrisMeredithandherblog),
    [Liberapay](https://en.liberapay.com/iris_meredith/) or [Stripe](https://donate.stripe.com/6oE2a30hh3my2reeUY)._\n\nIn
    short: programmers don't read, and this vexes me sorely. The immediate irritation
    is simply that I feel quite lonely: in being fairly literate and writing about
    it, I quite often find myself labelled as suspect or as \"not a real tech person\":
    that kind of problem, you know? More problematically, I genuinely find it hard
    to build a rapport with your average non-reading programmer. And I am not bad
    at communicating: if I was, quite frankly, this blog would not be a thing, nor
    would it be half as well-read as it is. No, there's something about the non-reading
    programmer that, for want of a better word, makes it difficult to communicate
    with them: try as I might, my best attempts mostly bounce off them entirely.\n\nWhich
    poses an issue. After all, I'd probably not be offended if a roofer or an electrician
    didn't read, at least not beyond the general kind of \"bemoaning societal illiteracy\"
    that I tend to engage in. My general assumption with tradies or people outside
    my general literati bubble is that they don't need to be reading lots of hard
    books in order to lead happy, fulfilling and socially valuable lives. I don't
    think that my plumber needs to read Goethe in order to be able to fix my toilet
    well. And yet with programmers, not reading sticks in my head as a massive moral
    defect. Why?\n\nSome light can be shone on the matter by the fact that the best
    programmers and engineers (as opposed to the general run of the profession) buck
    the general trend and read quite a lot: Efron Licht, to give just one example,
    reads quite widely and in real depth. Even if they don't quite engage in the way
    that I'd like them to, they make the effort, and consequently they usually have
    something interesting to say. The engineers that don't read, by contrast, I've
    always found very difficult to talk to productively.\n\nAs it happens, this generalises.
    The better a software engineer is at programming (and I mean this both in a moral
    and in a technical sense), the wider a range of interests they tend to have. Good
    programmers do all matter of different weird and wonderful things, while the kind
    of programmer who's only interested in programming and tech in general tends to
    be a second-rate software developer at best. What this suggests to me is that
    a large part of my issue is that not reading bespeaks incuriosity. As some long-forgotten
    Chinese poet had it:\n\n> The powerful don't read, The illiterate are loaded,
    Fuck up and you'll get promoted\n> \n> _Yuan Dynasty, attribution lost_\n\nThe
    complaint being made here is quite similar to mine: powerful and influential people
    lack the most basic curiosity about the world and things beyond their immediate
    sphere, and it shows. Importantly, the issue is that of power, as the poet doesn't
    complain about peasants or artisans not reading. This is an insight of some importance.\n\nProgrammers
    as a class have occupied, and often still do (mass layoffs aside) a position of
    considerable cultural power in our society. And a lot of them don't read. They
    don't wish to learn about times and places other than their own. They are basically
    dull-minded and incurious people, which makes them manifestly unfit for the position
    of power they occupy.\n\nAfter all, being in a position of power means that you're
    in a position to make choices that impact other people, often quite a lot of them.
    If you're a software developer writing an interface, your choices will influence
    how other people interact with the software you've written. If you're writing
    accounting software, you influence whether people get access to loans or not.
    Your decisions have a lot of influence on how people interact with the world.\n\nTo
    do this task well, you need to be able to exercise curiosity about other people
    and how they live. You need to be able to learn what's important to them and what
    isn't, how they work, what they find confusing... while one might possibly (if
    not plausibly) learn to exercise exactly the kind of curiosity needed for your
    work and _only that curiosity_, it's far easier just to start by being curious
    in general. Lack of curiosity, as indicated by an unwillingness to read, thus
    indicates that you're bad at your job.\n\nSo, that's one part of the irritation:
    what's the rest?\n\n## Failure to communicate\n\nThe incuriosity is, in itself,
    bad enough, but it doesn't explain the whole phenomenon. One could, after all,
    imagine programmers doing work similar to that of plumbing: writing glue code
    that's important for infrastructure but that doesn't really require much communication
    with other people (although I think you'll find that even plumbing and electrical
    work take quite a bit of communication: it's just that even the worst communicator
    is able to communicate \"the toilet broke and is spewing sewerage everywhere\"
    pretty well mosst of the time). Unfortunately, "
