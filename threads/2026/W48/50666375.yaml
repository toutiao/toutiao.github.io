  author: zbentley
  text: "&gt; Why not just hire a solid in house dev ops team. Get some full timers
    with fed benefits.<p>That&#x27;s very, very hard to pull off. You can do it, but
    there are tons of headwinds and organizational&#x2F;political difficulties in
    resisting the siren song of contracting out. It&#x27;s the right move, and I wish
    more agencies did it, but between the default response of &quot;of course we&#x27;ll
    contract it, that&#x27;s what we&#x27;ve always done&quot; and the very real challenges
    of building in-house expertise and re-orienting staff and processes towards using
    the in-house platform, it&#x27;s a surprisingly hard problem--much harder than
    the equivalent struggles in the private sector. And, even once you do it, the
    benefits take awhile to show up (migrating away from the prior way of doing things
    takes a long time), and there will be continual pressure to switch back to contracting
    it out, so you&#x27;ll have to continually re-justify the platform&#x27;s value
    prop. There&#x27;s also the reality that whatever you build &quot;in house&quot;
    won&#x27;t be <i>entirely</i> in-house; it&#x27;ll inevitably be staffed and built
    by a combination of GS&#x2F;ranked people and contractors--hopefully a mixture
    that works well and not one that continues the hollowing-out of in-house expertise--which
    will also be a challenging staff&#x2F;HR situation to maintain, since the agency
    building the platform will usually not have much prior experience giving &quot;build
    things&quot; authority to such a hybrid team.<p>It&#x27;s still a good idea, don&#x27;t
    get me wrong! Just much, much harder than you&#x27;d ordinarily think, even for
    small&#x2F;simple in-house builds&#x2F;platforms&#x2F;processes.<p>Source: I&#x27;ve
    done it."
  score: 0
