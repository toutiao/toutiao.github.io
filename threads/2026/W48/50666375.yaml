  author: oneplane
  text: 'Ironically, when you move workloads you&#x27;re still sitting on the same
    incompetence. In the past, that would be partially mitigated by having a &#x27;strong
    perimeter&#x27; (which wasn&#x27;t really all that strong...), but these days
    that doesn&#x27;t apply anymore with all the integrations and data exchanges needing
    to poke through such a perimeter.<p>It used to be that you got away with it because
    it was difficult to breach everyone&#x27;s perimeter, but these days, everything
    that has technical debt or any weakness will just get hammered relentlessly until
    it&#x27;s broken. That&#x27;s also what the LLM harnesses tend to be good for:
    always-on scriptkiddies. It doesn&#x27;t have to be sophisticated if you can spend
    a few cents doing every possible permutation of a low-skill attempt until you&#x27;re
    in (which includes just scraping credentials or exploiting vulnerabilities int
    he edge devices, tunnels, identity-aware proxies etc...).<p>But if history teaches
    us anything, it&#x27;s that technical debt gets ignored, competence doesn&#x27;t
    get rewarded to the point where it&#x27;s exercised enough, and expertise is rarely
    involved at the top to set an org up for this type of success.'
  score: 0
