  author: zbentley
  text: Heh, we worked in similar orgs.<p>I think the missing-technicals-on-ISSO problem
    is systemic. If you have the technical chops, ISSO&#x2F;AODR&#x2F;ISSE&#x2F;cyber
    is rarely the most money you can make, even within the department&#x2F;within
    fed. If you do stay, technical chops often result in you taking on extra work
    and burning out, or becoming the person who&#x27;s always crying wolf or pointing
    out issues that make more work for others, and you get managed out.<p>That&#x27;s
    tricky to solve, but there are solutions. I&#x27;m a fan of embedding ISSO&#x2F;AODR-equivalent
    staff within product teams to some extent (even if that&#x27;s just &quot;they
    show up to ordinary product&#x2F;eng team meetings that aren&#x27;t security focused&quot;).<p>That
    helps less-technical folks gain context by osmosis, makes sure the ISSO&#x2F;AODR
    knows the maturity&#x2F;status of everything by the time audits and approvals
    are needed, and helps keep everyone aligned around delivery rather than finding
    a reason to get to &quot;no&quot;. Definitely not a silver bullet, but powerful
    nevertheless.
