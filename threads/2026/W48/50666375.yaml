  author: zbentley
  text: 'This is indeed common. It&#x27;s fixable, but hard to fix.<p>The usual scenario
    goes like: &quot;compliance&#x2F;ATO&#x2F;RMF&#x2F;whatever processes are box
    checking excercises, we need to build something that doesn&#x27;t fit in the boxes
    they&#x27;re used to checking, so it gets rejected by those processes. We appeal
    the rejection to senior decision-makers, and eventually (if we&#x27;re lucky)
    find someone senior enough to approve one-off flexibility to the process and allow
    the right thing to be done.&quot;<p>That takes a lot of time and effort. There
    are three process trajectories from there, two of them bad:<p>1. The effort of
    adding flexibility to the &quot;cascade of rigidity&quot; (<a href="https:&#x2F;&#x2F;www.eatingpolicy.com&#x2F;p&#x2F;understanding-the-cascade-of-rigidity"
    rel="nofollow">https:&#x2F;&#x2F;www.eatingpolicy.com&#x2F;p&#x2F;understanding-the-cascade-of-...</a>)
    is deemed too great, so it&#x27;s rarely done. Nothing improves.<p>2. The senior
    decision-maker who <i>is</i> willing to add flexibility becomes load-bearing (sorry,
    Claude; it really is the right term sometimes). They become overloaded and inundated
    with requests to approve exceptions&#x2F;alternative processes. When they leave
    the organization or when one of the places where they add flexibility fails and
    they get blamed for it, that capability is lost.<p>3. The senior decision-maker
    prevents this by pushing the capability for flexible response <i>down</i> into
    the lower levels of the organization (letting ISSO&#x2F;auditors do it is only
    a small part of the battle: getting the people making changes to actually <i>ask</i>
    for flexibility is often far harder). This has to come with a framework for giving
    people &quot;permission to fail&quot; occasionally when exercising that discretionary
    power.<p>The last one is the only durable way to improve the situation. It&#x27;s
    also the hardest, and scariest from a &quot;we&#x27;ve never done anything like
    that before&quot; perspective.<p>You&#x27;ll know you&#x27;re on the right track
    to fixing this if conversations about delays&#x2F;process blockages decrease in
    frequency, and are replaced with &quot;who watches the watchmen?&quot;-type conversations
    and &quot;is $incident an acceptable side effect of flexibility or an indication
    of a performance issue on a specific team?&quot;-type conversations over time.'
