  author: zbentley
  text: 'Not true at all. The choice of contract-or-not, and how to incentivize good
    digital work, is <i>very very rarely</i> put before the voters. Those decisions
    are almost always made unilaterally within the executive. &quot;Fix government
    contracting&#x2F;digital work&quot; is not a sexy enough issue for representatives&#x2F;presidents
    to make it a major campaign plank. It very occasionally breaks out into the public
    sphere (FISMA, post-obamacare digital rethinks, post-OMB-hack security&#x2F;compliance
    regulations, DOGE), but never for long and certainly not with enough political
    focus to make meaningful, lasting change.<p>This is good news, actually: the missing
    quantity is decision-makers within the executive who care about fixing this. That
    can be addressed without widespread public support, on much shorter timeframes
    than large political initiatives. It can be addressed on an agency-by-agency basis
    without cross-government policy&#x2F;regulatory changes. Whether it <i>will</i>
    be addressed is a different story.<p>The amount of private sector lobbying&#x2F;contract
    money spent against it is problematic, true, but it&#x27;s not problematic in
    the same way that e.g. industry consortia lobbying against environmental safety
    laws in congress is problematic.'
