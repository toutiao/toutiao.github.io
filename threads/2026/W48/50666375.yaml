  author: Twirrim
  text: 'JWCC was originally an all Azure cloud, AWS pitched a fit and took legal
    action, then the US government decided to open the contract out for bids and decided
    that being dependent on a single company was too risky, particularly for extremely
    sensitive data and infrastructure. Four clouds enables effective competition between
    the vendors resulting in better deals for the US government.<p>The JWCC contract
    is really detailed and extremely prescriptive, including all the details about
    who and how access can occur (it&#x27;s a fully air gapped cloud, where only people
    with TS&#x2F;SCI+ clearance can go, so the fact it got compromised is <i>really</i>
    interesting. Wonder if it&#x27;s a bad actor or something not correctly isolated)<p>&gt;
    Why not just hire a solid in house dev ops team. Get some full timers with fed
    benefits.<p>You say it like it&#x27;s easy. TS&#x2F;SCI+ cleared engineers are
    just not that easy to find. At all. Let alone ones capable of building out a cloud
    environment. It&#x27;s a pain to get and maintain clearance, mostly for good reason.<p>The
    US Government also doesn&#x27;t pay that well either, and their pay scales reportedly
    won&#x27;t stretch as far as necessary.<p>If you&#x27;re willing to get clearance
    <i>and</i> know what you&#x27;re doing you can make absolute bank off just contractor
    work, much, much more than you&#x27;d ever make actually working for the government.<p>A
    previous manager of mine had an anecdote that reflected his interviewing experience
    with candidates with clearance: &quot;Can you tell me the difference between TCP
    and UDP&quot;, &quot;You do understand that I have TS&#x2F;SCI+ clearance, right?&quot;.
    All too often candidates could operate a keyboard and mouse, and follow written
    instructions and that was it. If they were wrong, or something broke, you were
    up the creek without a paddle.'
