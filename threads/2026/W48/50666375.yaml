  author: zbentley
  text: 'I&#x27;ve also done that work, and it is often broken as you say.<p>Good
    ISSO staff are worth their weight in gold. But they&#x27;re rare.<p>That said,
    I think all of this takes a back seat to the fact that so, <i>so</i> many government
    digital initiatives are focused on risk reduction as a <i>higher priority</i>
    than value delivery. The security apparatus of many agencies is the means by which
    software is deployed--not a consultative&#x2F;collaborative&#x2F;occasionally-raising-flags
    component of the development process, but <i>the</i> primary bottleneck and authority
    through which all changes flow.<p>Beyond the broken&#x2F;ineffective approval
    and compliance excercises (of which there are many, though I&#x27;d argue that
    the controls&#x2F;policy standards being used for auditing are rarely themselves
    the problem--some of NIST, for example, is quite pragmatic and good), the distribution
    of authority is frankly bizarre by private sector standards.<p>It&#x27;d be extremely
    weird in a high-risk SaaS company, for example, to have the SecEng org be the
    primary stakeholder in the deployment&#x2F;build&#x2F;QA&#x2F;SDLC process. They
    should be <i>a</i> stakeholder, sure, but not the primary one. But that&#x27;s
    how it often is in government.<p>Risk reduction and value delivery don&#x27;t
    always need to trade off, but when they do, I&#x27;m reminded of the old Yegge
    microservices rant: a platform that&#x27;s <i>not accessible</i> (as in usable,
    able to deliver value) but is highly <i>secure</i> is useless. And yes, that&#x27;s
    still true even given the blast radius of government systems.'
