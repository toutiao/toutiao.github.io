    a sample of flows.<p>Run anything interacting with raw user input in 2 layers
    of sandbox (containers don’t count).  Again, carefully monitor, record all or
    sample syscall traces .<p>Restrict human access heavily.  On demand, scoped and
    short lived.  Only from secure devices, ideally locked down (no random web browsing).<p>Etc.  all
    well known and practiced for 20+ years
