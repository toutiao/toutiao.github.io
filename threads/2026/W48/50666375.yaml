    think it&#x27;s as significant as the difficulty <i>hiring and selecting</i> in-house
    expertise. ~190k, while not competitive with SF&#x2F;FAANG, is more than sufficient
    to attract plenty of talented folks in DCM&#x2F;elsewhere in the country ... but
    identifying&#x2F;marketing to, and getting approval to hire those folks has <i>massive</i>
    regulatory obstacles. Like, crazy big.<p>Once they&#x27;re hired, the timeline&#x2F;electoral
    whiplash you point out absolutely is a major challenge, but an equivalently sized
    challenge is that many government agencies have done the opposite of building
    in-house expertise for so long that they just....don&#x27;t have the muscles to
    know how to allocate and empower these new staff. Those capabilities have atrophied
    so fully that the only option is a hybrid contractor&#x2F;noncontractor team to
    allow the contractors to train and empower the feds, which is itself a mixed-incentives
    challenge (&quot;train your replacement. Who will also cost your boss hundreds
    of millions of dollars once trained.&quot;)<p>Once that&#x27;s overcome and you
    have talented people empowered to work on the right problems, there&#x27;s a really
    big challenge keeping them from &quot;falling back in&quot; to gov dysfunction.
    Even if you&#x27;re doing great work, the environment encourages reacting to problems
    with additional layers of bureaucracy&#x2F;ineffective controls, de-risking anything
    by elongating timelines and slowing delivery, and integrating with other government
    systems in disappointing&#x2F;minimally effective ways.<p>And all of that has
    to be addressed while the siren song of the alternative (&quot;Just contract it
    out! &lt;Big contracting company&gt; can have boots on the ground and solve the
    problem in months!&quot;) is playing on a loudspeaker next door, and the baseline
    assumptions of how to do effective digital work are based in a core assumption:
    &quot;the government should only have expertise in military and administrative
    concerns&quot;. Unlike other commenters, I think that last part is much more influential
    than revolving-door corruption <i>vis-a-vis</i> contractors: I think corruption
    isn&#x27;t required for dysfunction when many government leaders consider it a
    foregone conclusion that the government can&#x27;t effectively execute on projects
    built in-house and that the private sector is the inherently better way to achieve
    such things. Multiply that assumption by time and scale, and it starts to become
    true--<i>that</i> is the debt that needs to be paid down, which is much harder
    than paying down purely <i>technical</i> problems.<p>Amtrak and the Postal Service
    are .... not good examples. Their hybrid for-profit&#x2F;state-entity model produces
    outcomes worse than each (which we can tell by comparing them to countries where
    they&#x27;re one or the other).<p>Government cloud platforms and tools do exist
    (cloud.gov, Platform One, etc.) but their adoption and applicable use-cases are
    limited by all of the factors I listed above.'
