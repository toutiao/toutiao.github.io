  author: asdff
  text: The thing with these companies is they have the edge in terms of various domain
    talent to route around these rules in various ways to preserve margin. They have
    the edge in talent acquisition from the outset as well as poaching.<p>As soon
    as you formalize the rules, plans are being made to route around them and preserve
    margin by some other means.<p>Maybe what would be better would be a sort of authoritarian
    secret police of auditing. Some byzantine faceless three letter org that will
    rubber stamp &quot;no&quot; if this contract smells like bullshit by any assortment
    of metrics the analyst in charge of approvals happens to lean on. No one or a
    couple factors, a context dependent approach of a smattering of factors, real
    and perceived through other cofactors, like what anyone would do pricing if a
    deal is a good value or not, not bound by policy or process.<p>Of course, nothing
    moves without precedent in government, so this will probably never happen.
