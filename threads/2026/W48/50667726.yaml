  author: geoffschmidt
  text: 'This is super cool! The rabbit hole goes a bit deeper than I first thought.<p>Because
    anyone can tell Opus &quot;go win bouncemarket.minhanhday.com&quot; and with just
    those words get a pretty good bot, this is in practice a &quot;battle of the bots&quot;.<p>The
    only unknown is the fractional part of the start position of the ball, which is
    revealed gradually by the chaotic path of the ball, and a frontier model will
    quickly realize this and write an exact solver for it. This gives the optimal
    estimate at time t of the probability of each outcome given the information revealed
    so far.<p>Of the bots running now, some seem to have an exact solver while others
    have a lower quality probabilistic solver. Some bots seem to only bet when there
    is enough information to be certain, others are willing to bet early when the
    market is mispricing the risk.<p>The rate limit of 10 bets a second means that,
    past a certain point, a bigger bankroll doesn&#x27;t help. It also means that
    bets are a scarce resource. You want to bet at the moments when the market maximally
    misprices the risk, but you don&#x27;t know when those moments will be because
    that&#x27;s a function of what other players do.<p>To win, you need to do some
    combination of:<p>1) Be the first to buy when a bounce reveals new information<p>2)
    Be the first to buy when another player makes a non-optimal buy<p>Both require
    low latency to the server to win. Only market orders are possible, so if you are
    <i>not</i> the first you might be severely punished, because if N bots all see
    an event at the same time, they will pile on (not seeing each other&#x27;s buys
    due to the latency in market quotes) and move the market far past fair value,
    and the Nth bot may buy at a really bad (and unintended) price. Which could then
    produce a swing in the other direction, so I guess we should expect the market
    to oscillate. In practice these mispricings seem hard to exploit because they
    are large but short-lived and so difficult to harvest with market price orders.<p>Since
    you asked for feedback, my advice would be:<p>1) Allow orders other than market
    orders (eg, add a limit price to the API)<p>2) Consider running some kind of an
    auction (once per frame or other time interval) rather than processing orders
    one at a time<p>That would make it not be a winner-take-all game based on your
    distance from the server. On the other hand maybe in this case an orderly marketplace
    is uninteresting! In that case, if you do #1 but not #2 then you open up some
    new betting strategies, like trying to catch mispricings due to overcorrection.'
  score: 0
