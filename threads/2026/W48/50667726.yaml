  author: cvoss
  text: I would guess that the universe of players not being closed is a source of
    imbalance. There is a constant stream of new players who are granted 10 credits.
    Maybe they play for a bit and leave when they get disinterested, which is more
    likely than not going to occur when they have less than 10 credits.<p>So if the
    money supply per capita is constantly increasing, holding a share in anything
    with a 50% chance of payout has a positive expected return. Diversifying by buying
    both shares makes your portfolio very resistant to fluctuation. The ideal strategy
    just rides the inflation on average.
