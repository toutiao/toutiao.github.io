    \n \n\n> [!NOTE] **Pourquoi cet article et cette analyse ?**\n> \n> Depuis quelque
    temps, je constate que Polymarket devient un véritable terrain de jeu pour les
    délits d’initiés, et le climat politique autour de la nouvelle administration
    Trump rend ce type d’asymétrie d’information encore plus propice. J’ai donc développé
    un algorithme qui surveille en permanence les marchés les plus sensibles : chaque
    transaction y est analysée par des modèles statistiques et des outils de traçage
    de flux on-chain.\n> \n> J’ai finalisé l’algo il y a deux jours à peine. Dans
    la nuit même, en voyant l’alerte se déclencher, j’ai mené une première analyse
    à chaud sur les transactions… avant de voir tomber quelques heures plus tard le
    tweet de Donald Trump confirmant l’asymétrie. Et vous allez voir que le communiqué
    officiel de NVIDIA n’était que la cerise sur le gâteau.\n> \n> Cette enquête documente,
    à la minute et au hash près, un cas assez probant de délit d’initié sur Polymarket
    détecté en temps réel.\n\n## En résumé : Pourquoi ce cas est particulièrement
    suspect\n\nSur un marché de prédiction, rien ne permet d’affirmer avec une certitude
    absolue ce qui motive un parieur. En revanche, l’analyse des données on-chain
    met en lumière un faisceau d’indices particulièrement troublant autour du compte
    `ljhggk` :\n\n- **Le timing :** Les achats s’arrêtent en pleine nuit, 89 minutes
    avant que Donald Trump ne publie son soutien sur [Truth Social](/polymarket-delit-initie-jensen-huang-nvidia/sources/truth-social-trump-rehire-jensen/).\n-
    **L’asymétrie du pari :** 4 648 $ misés sur une issue cotée à seulement 6,5 %,
    transformés en 71 518 $ après l’annonce officielle de [NVIDIA](/polymarket-delit-initie-jensen-huang-nvidia/sources/nvidia-newsroom-reinstatement/).\n-
    **Le profil du wallet :** Un compte [Gnosis Safe Proxy](/polymarket-delit-initie-jensen-huang-nvidia/sources/polygonscan-proxy-ljhggk/)
    créé 81 heures plus tôt, 100 % monothématique sur ce seul événement.\n\nSimple
    coup de chance ou réelle information privilégiée ? En décortiquant les transactions
    bloc par bloc, le scénario d’un simple pari au hasard devient difficile à croire.\n\n*
    * *\n\n## 1 · L’Anatomie du trade : 71 518 parts accumulées en pleine nuit\n\nEntre
