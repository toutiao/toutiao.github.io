  author: PaulRobinson
  text: "&quot;Inside information&quot; does not always mean somebody directly involved.
    In sports, most professional sports bettors have informational advantage, but
    often that information is public, or derived from public information, in a way
    that is not widely distributed.<p>Consider latency arbitrage: if I have a data
    feed that is 2 seconds quicker than the bookmaker&#x27;s data feed for a game,
    and I can bet in-play with them, I can use that potentially to make money. The
    bookmaker will eventually shut me down, but this has been a widely used strategy
    on a range of sports on betting exchanges for decades (look at TPD data in horse
    racing as an example), and is now leaking into prediction markets.<p>There are
    of course also incentives for real insiders to leak data, but that&#x27;s not
    new. Betfair made waves in the early 2000s by basically tipping off sporting authorities
    whenever they saw unusual betting activities on events that they suspected were
    insider trading. It eventually led to fines, suspensions, sanctions, all sorts
    agains those individuals.<p>Did Betfair create the opportunity for insider trading,
    as many claimed at the time? Not really, it was just in the past those people
    were dealing with bookmakers and bookmakers were using that information for their
    own purposes. These examples are a little different, but TBH if Polymarket didn&#x27;t
    exist that same individual probably would have been able to use margin to trade
    a leveraged long ETF on the share price and got the same result. They likely didn&#x27;t
    because the SEC might have taken a longer and deeper look at it than CFTC or anyone
    else will look at the Polymarket trade.<p>Anyway, way back when, in sports betting
    it was widely known in the UK that some horse trainers had &quot;no lose&quot;
    accounts that bookmakers would offer to them in exchange for information on whether
    one of their horses was &quot;on&quot; or not. The exchanges just surfaced a lot
    of this and caused a clamp-down. Today most sports now have rules prohibiting
    participants or those associated with participants (e.g. coaches, family members,
    staff members at football clubs, and so on), from having any bets at all on the
    related sports. That didn&#x27;t really exist 30 years ago, to my knowledge.<p>Kalshi
    and Polymarket are at least two decades behind in this regard, and in general,
    US sports betting is still about a decade behind the UK in terms of regulation.
    I&#x27;m not a huge fan of how UKGC runs the industry here in the UK, but I&#x27;ve
    no doubt that the US needs something like it to make sure people aren&#x27;t getting
    ripped off and bad actors are found and punished, as long as they&#x27;re not
    using public, or derived from public, information with better execution.<p>I expect
    once the legality of prediction markets is properly determined, law makers will
    start to intervene. You should see more transparency on insider dealing (with
    penalties aligning with existing insider dealing laws and regulations), fewer
    VIP programs and more clarity on how markets are setup, structured and run."
