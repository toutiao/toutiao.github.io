  author: piltdownman
  text: Polymarket is a binary variant of unleveraged spread-bet CFDs. Both are fairly
    equivalent in outcome and manipulation since the introduction of market-distorting
    legislation like The Uptick Rule and the Reg NMS.<p>Even at that they&#x27;re
    desperately trying to get rid of Reg NMS Rule 611, which prohibits trading venues
    from executing a customer order at a price worse than the best publicly displayed
    quote.<p>In Spread Betting &amp; CFDs you typically trade directly against a broker
    (market maker). In prediction exchanges you typically trade directly against a
    manipulator (market maker).<p>Both are event forecasting. Both have someone with
    inside knowledge and&#x2F;or ability to manipulate the market taking the other
    half of retails&#x27; bet.
