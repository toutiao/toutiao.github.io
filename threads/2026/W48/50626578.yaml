  author: alphazard
  text: Betting can be done with a market (many participants) or a single counter
    party (like a Casino).<p>A bet is the unit of risk, it&#x27;s an event with at
    least 2 outcomes, where the value of the outcomes (to the player) is different.<p>Sports
    betting is often done with a single counter party, and this counter party gives
    odds which are not shaped by a market of participants, but are decided on to ensure
    a profit for a company. This makes the bets almost universally negative EV.  Engaging
    in negative expected-value bets, for the feeling of risk is gambling.
