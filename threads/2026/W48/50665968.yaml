  author: amluto
  text: Shor’s algorithm is extremely simple and, if run on an ideal quantum computer,
    has very low complexity. The complexity of solving ECDLP with Shor’s algorithm
    is not drastically higher than the complexity of EC multiplication&#x2F;exponentiation
    (choose your favorite terminology) on the same computer.<p>I don’t think the original
    factoring&#x2F;discrete log paper tried to optimize the gate count at all (certainly
    the author’s lecture on the topic did not) and it’s <i>still</i> quite efficient.
    And it’s obviously possible to optimize it.<p><i>Actual</i> quantum computers
    are messy, and logical qubit design and algorithm porting is a sort of combination
    of somewhat specialized math and code golfing.  AI will be <i>fantastic</i> at
    it.
