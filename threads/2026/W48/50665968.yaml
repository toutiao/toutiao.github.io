  author: tsimionescu
  text: 'Quantum Advantage is a prediction of quantum physics (note: not a mathematical
    prediction in the sense that its existence is required, but an expectation raised
    by the people working in the field), and is often cited as proof that the world
    described by quantum mechanics is &quot;richer&quot; in a very deep sense than
    the classical mechanics world. Some people even use it as evidence in favor of
    the Many Worlds Interpretation.<p>I do agree that none of these would simply fall
    down if it were proven that quantum computers were no more powerful than classical
    computers. But it would still affect part of the established worldview in the
    foundations of theoretical physics, and it would require quite a few arguments
    to be rewritten.<p>If the proof were also practical, that is, if it came with
    actual efficient algorithms, then it would revolutionize theoretical physics,
    as it would allow simulations of complex QM systems.'
