  author: aaronmdjones
  text: 'It can require different types if that&#x27;s how you set up your authorized_keys
    file. You can then mark it immutable so that it can&#x27;t be changed.<p>You should
    also create an empty authorized_keys2 file in this case (since OpenSSH will read
    both by default), unless you set e.g. &quot;AuthorizedKeysFile .ssh&#x2F;authorized_keys&quot;
    in sshd_config(5) too.<p>It can&#x27;t accept rsa,rsa in your example since neither
    machine has 2 RSA authentication keys in your example.<p>EDIT: There&#x27;s also
    the AuthorizedKeysCommand directive instead, if you want to write a fancier program
    to constrain the permitted keys on offer. For example, it could look at all of
    the authorized keys listed in your file and offer only RSA ones, then later offer
    only Ed25519 ones.'
