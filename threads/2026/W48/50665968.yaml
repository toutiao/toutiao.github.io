  author: pcstl
  text: 'Since it&#x27;s what everyone is going to be worrying about: This result
    does not matter practically for cybersecurity.<p>The best practical algorithm
    for solving elliptic curve DLP is BSGS (Baby Step, Giant Step) which grows as
    2^{b&#x2F;2+o(b)} in the key length.<p>This result claims 2^O(b&#x2F;(log log
    b)) which is technically subexponential, but since that `log log b` term grows
    so slowly it pretty much would only beat BSGS for absolutely gigantic keys.'
