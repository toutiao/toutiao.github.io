  text: That is a patent, not a copyright.<p>Algorithms cannot be copyrighted, only
    specific programs that implement an algorithm.<p>Traditionally, algorithms could
    not be patented, but the practice of the US patent law has invented loopholes
    for patenting algorithms and eventually many algorithms have been patented, and
    USA has also blackmailed other countries to change their patent laws, though in
    many countries such lax interpretations of the patent laws are still not accepted.<p>Algorithms
    and formulae do not deserve to be patented, because with very rare exceptions
    it is very easy to rediscover them completely independently and there exists no
    justification for punishing the independent discoverers just because someone else
    happened to also discover the same algorithm, but one day earlier or one year
    earlier, because by chance they encountered earlier a problem for which that algorithm
    is needed.
