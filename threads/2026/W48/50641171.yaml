  author: ndriscoll
  text: 'There truly is a qualitative difference between moral scenarios that involve
    tangible property (e.g. theft) and those that don&#x27;t (e.g. copying): whether
    I copy or not has <i>literally</i> zero effect on the other party. None. Saying
    theft has exactly zero effect on their wellbeing is simply wrong. It maybe has
    0.0000001 units of effect, which is close to zero, and <i>your</i> values may
    be that it&#x27;s &quot;close enough,&quot; but it is still <i>not</i> zero. <i>Not</i>
    interacting with someone <i>actually</i> has <i>precisely</i> zero effect on them.
    Whether I just use the existing sound system or this plugin affects no one. Whether
    I grow my tomatoes or buy from Costco has no effect on Walmart. Microsoft is not
    part of the scenario. Walmart is not part of the scenario.<p>Growing your own
    tomatoes does not affect them except in their imagination. You are not interacting
    with them at all. You are not their tomato buying thrall. It&#x27;s the &quot;I
    consent. I consent. I don&#x27;t&quot; meme. Microsoft is the incel. You and Linux
    are Chad and Stacey.<p>Property rights presume people can control specific objects,
    and make sense given resources are finite. If there are only 1 billion tomatoes
    in the world right now, we must decide who gets them. If there&#x27;s a tomato
    in front of us, only one of us can have it, or we can each only get a fraction.
    Rights to ideas presume people can control people&#x27;s general behavior. Ideas
    are not finite: when you learn my idea, you <i>also</i> have the <i>full</i> idea,
    and I still have the <i>full</i> idea. The nature of you gaining it is that now
    it exists <i>twice</i>. It becomes <i>more</i> abundant. You cannot <i>take</i>
    it from me. They are not the same. Conflating them can only harm you whatever
    cause you believe in, as it will expand the latter rather than contract the former.
    People intuitively understand that private property is necessary. Even Marx.'
