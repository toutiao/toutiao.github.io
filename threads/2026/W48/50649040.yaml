    &gt; cultural resistance is treated as a problem to be managed rather than a constraint.<p>You started the headline directly with &quot;social engineering&quot; and later you indirecly claim that doing anything transgender related is &quot;ideological goals&quot;. I&#x27;m always puzzled how some people can come up with. To explain, let me share a bit of this person I saw grow up.<p>When the person was small, it was quite girly. Pink clothes, some &quot;this is my most leved dress&quot;. This ended at about 5 years. During the next few years the person got a little bit more male, but nothing out of the order. For example, it asked for a boxing (punching) sack. In my culture, this isn&#x27;t THAT female, but it&#x27;s also not unheard of. During that time the person also started to not liked to be photographed. It didn&#x27;t like it&#x27;s picture at all. The &quot;I&#x27;m not liking me&quot; started to become more and more grave. It went even to self-injuring, social distancing and that. The parents tried to got help, e.g. psychotherapy, but ultimately to no avail. There was even one suicide attack that happened. In my country, when a teenager does a suicide attack then the case always becomes official. So what the parents did before on their own with psychotherapy now got offical, the person was admitted on a voluntary basis in a psych ward. They assumed a high depression. They helped in the way that the person was able to cope better. But the dislike to itself and all of the things that followed out of it actually stayed.<p>Then some years later the person said that it actually think male. Being in the wrong body and all that ...  okay, but at the same time things improved considerably. It looked like a heavy weight was taken away from the shoulders.<p>However, reaction from some of the environment was extremely harsh. Some (not all!) in the church group harassed the person, eventually leading to distance from that group. Random foreigners made jokes or even hits since the person was now wearing male attire.<p>So the internal stress was relieved, but a whole lot of external stress arrived. The suicide rate of transgender persons is 7x larger. And still people think it&#x27;s a &quot;cultural&quot; thing or an &quot;ideology&quot;. I mean you can be converted via propaganda to be a communist or a nazist, so those are ideologies. But a small child, that doesn&#x27;t see anything about homosexuality or transgender still became it, disliked it&#x27;s body so it was willing to destroy it ... how can this be &quot;ideology&quot;?<p>Seeing how they suffer before-outcome AND after-outcome ... I can&#x27;t fathom that they voluntarily choose their way. IMHO some external influence (like transgender books or youtube video) can&#x27;t make people chose such a route of suffering. To me, this swaps cause. The books don&#x27;t cause transgender --- transgenderism causes books about it to be written.<p>An awful lot of people with transgender suffer. Either they suffer because they can&#x27;t (usually due to the society) life in the open. Or they are living in the open and then they suffer because of the harsh reaction of others that understand a zilch and have the empathy capacity of a water bottle. So an organization that raises awareness to all of this... isn&#x27;t doing ideology, it&#x27;s actively trying to better the lives of a marginalized people group. I can assume that in Serbia (with it&#x27;s mafiosi right populist ex-president) live for transgender people has been especially bad. So I have no qualms if they get help.<p>Personally I think if one dislikes transgender (because it puts so or so unnecessary burden on people) then one must campaign against Phtalate (plastic smot...   but never campaign against the actual people.
