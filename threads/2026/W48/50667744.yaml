    zero genetic material with you. It&#x27;s paradoxical but true. You only get your
    genes from a subset of your ancestors due to the discrete nature of genes and
    random recombination.<p>I also find other parts quite naive in the post, like
    celebrating birthdays as an example, when most people didn&#x27;t even keep track
    of exact year they were born, and some stonemason who traveled to a lodge to build
    a cathedral most likely didn&#x27;t throw birthday parties.
