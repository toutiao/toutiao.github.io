    # GPT 6.2 Astra Solves a Historical Mystery

    ### OpenAI’s newest model can autonomously research open historical problems from end to end, forming hypotheses to make new discoveries.

    [

    ](https://substack.com/@generativehistory)

    [Mark Humphries](https://substack.com/@generativehistory)

    [

    ](https://substackcdn.com/image/fetch/$s_!mr1c!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F85c196c7-1cc6-440f-b086-de25bf788ac1_1672x941.png)

    There’s a growing sense in the AI community that we’re approaching an intelligence explosion far faster than even the most optimistic accelerationists predicted. One of the most publicly visible signals pointing at that acceleration is the rapid progress made in mathematics in recent months.

    In four years, LLMs have gone from scoring a D+ on elementary school math tests to literally solving hundreds of the most difficult problems in the field in the space of only a few weeks—decades of progress compressed into two months. Navier-Stokes, one of the central [Millennium Prize Problems](https://www.claymath.org/millennium-problems/) posed by the Clay Mathematics Institute more than a quarter century ago, [fell in September](https://openai.com/index/navier-stokes-solution/). Last Friday, Anthropic researcher and mathematician Levent Alpöge [announced](https://www.scientificamerican.com/article/anthropic-mathematician-claims-to-prove-riemann-hypothesis-most-famous-problem-in-all-of-math/) a proof of the Riemann Hypothesis, which paradoxically [can be verified using a mathematics program called Lean](https://leanprover-community.github.io/blog/posts/riemann-hypothesis/), but has yet to be understood by human experts. Just last night, Anthropic casually [posted a solution to the VP vs VNP problem](https://github.com/anthropics/formal-math/tree/main/vp-vnp) without any fanfare. Such things are becoming the norm.

    Because mathematics is deterministic, though, observers have wondered whether this same process of research and discovery will generalize to non-deterministic domains like history. In this blog post, I will present evidence that this is indeed starting to happen.

    I recently had the opportunity to test OpenAI’s new model, [GPT-6.2 Astra](https://openai.com/index/introducing-gpt-6-2-astra-sol/), before it was released and it made a significant historical discovery. This required it to read through sources, develop a hypothesis with limited evidence, and make an argument. Moreover, it would be unlikely that a human could replicate what it did.

    With only minimal prompting, GPT-6.2 Astra was able to autonomously identify the creator of an anonymous 1808 sketchbook held at [Yale’s Beinecke Library](https://beinecke.library.yale.edu/). It did so extremely quickly (in just 22 minutes), using publicly available primary and secondary sources. To do so, it discovered a little known source in a paper archive, predicted that it would prove its hypothesis if examined and, in the end, it did. Not only that, but this new source turns out to be a major find on its own that will be of significant interest to both Canadian and fur trade historians. While it’s a narrow example, it’s representative of the historical research process as a whole and a sign of things to come.

    #### **Testing A New Model**

    I started testing GPT-6.2 Astra in late October in the ChatGPT Windows Desktop app. It is a quirky but highly capable model, especially well suited to long-running, open-ended tasks that might take hours or days to complete. I’ve found that its results were remarkably reliable and consistent, allowing me to contemplate tasks that were too difficult or long-running for previous models. For example, I had it examine and correct an 8,002-row CSV transcription of the Shipboy & Henry daybook. Last fall, I was amazed that Gemini 3 Pro could [work in pounds, shillings, and pence](https://generativehistory.substack.com/p/the-sugar-loaf-test-how-an-18th-century). GPT-6.2 used the internal math of the ledger to verify and fix transcriptions against 353 images. In essence, it tested the handwritten math across thousands of quantities, item prices, sub-totals and account totals over the course of only a few hours and made edits accordingly. I had previously tried this with both GPT-6 Astra and Fable 5 and neither one completed the task as thoroughly or competently.

    Even so, GPT-6.2 Astra sometimes communicates in a weird way, writing backwards-speak, riddle-like answers that seem wrong at first glance but turn out to be technically correct. It often feels like I’m reading a formal legal disclaimer, but one written in a friendly, colloquial way. The strangest thing, though, is that the underlying work product is always sound.

    My intuition suggests this is a product of a post-training regime aimed at optimizing the model towards deterministic tasks like creating mathematical proofs. My sense is that GPT-6.2 Astra’s prose gets weird when it must communicate a final result based on incomplete evidence, or when there is no way of completing a task but it must still provide an answer. In math this would be a warning sign, but in non-deterministic domains it’s often the norm.

    #### **The Anonymous Sketchbook**

    Despite the communication issues, the more I used GPT-6.2, the more it felt meaningfully different to me. It felt smarter, but I couldn’t really get a sense of how smart it actually was or where its limits were compared to other models like [Opus 5.5](https://www.anthropic.com/claude-opus-5-5) or [Fable 5.2](https://www.anthropic.com/claude-fable-and-mythos-5-2). So I decided to give it what I thought would be an impossible task, to see how it fared. I asked it to identify the creator of an anonymous sketchbook that has intrigued me for years.

    In 2022, when I was [working on the authorship](https://doi.org/10.1353/mhr.2022.0002) of Alexander Henry’s _Travels and Adventures in Canada and the Indian Territories_, I was going through the catalog of Yale University’s Beinecke Library when I came across a reference to an anonymous sketchbook depicting an 1808 journey from Montreal to Fort William and back. The sketchbook had apparently been in private hands for decades until Yale bought it from an antiquarian bookseller in 2020. It’s not a particularly well-known document, but it’s important because it uniquely depicts a number of locations in the Great Lakes that were destroyed only a few years later. I’ve spent many hours over the years trying to figure out who made the sketches with no luck.

    The sketchbook, which is [browsable](https://collections.library.yale.edu/catalog/32369099) on the Beinecke Library site, has a mottled, leather cover and contains 84 pages, 34 of which feature pencil and ink drawings or watercolours; most are labelled, only three are dated. The handwriting is limited to short captions but is highly distinctive, with capital letters that extend forward under the line and long-tailed d’s that curl back to embrace the entire word.

    [

    ](https://collections.library.yale.edu/catalog/32369099?child_oid=32369136)
    _“Fort at St. Joseph’s,” from the anonymous 1808 sketchbook, fol. 17r. Beinecke Rare Book and Manuscript Library, Yale University, WA MSS S-4271._

    The unknown artist began the book in March 1808 and it opens with a depiction of the Newfoundland shoreline as seen from a passing ship. This is followed by pictures of the people and landscapes of Lower Canada (now the Province of Quebec) including Sir John Johnson’s house southeast of Montreal, the fortifications at Chambly, and a few churches. It continues with renderings of Chaudière Falls at modern-day Ottawa (dated 8th June) and the entrance of the Rivière Creuse (11 June). Following these are drawings, amongst others, of Fort St. Joseph on Lake Huron, Fort William on Lake Superior, islands in Lake Erie, and the mountains at Lake Champlain as drawn from the St. Lawrence, dated to 16 August.

