  content: "![Brake Check: Hijacking Trailer Brakes Over Bluetooth. Cover illustration:
    a phone sending four bytes straight through brake control to a trailer wheel,
    while bonding and firmware update stay locked.](/_astro/brake-check-trailer-brakes-over-bluetooth.DnATki-Y_CCfUk.webp)\n\n_By
    Patrick Forck and Jeremy McCarthy, Element Digital_\n\n> **Disclosure status:**
    This vulnerability was reported to Elecbrakes under coordinated disclosure on
    18 May 2026. Elecbrakes shipped a firmware fix for the EB2 and VM1 on 6 July 2026,
    seven weeks later. If you own one, **open the app and install the firmware update**
    before reading on. The update doesn’t install itself: you have to open the app
    and start it. You want **EB2 firmware 3.0.4.4.3 or later, or VM1 firmware 1.3.4.2.1
    or later**. Go on, we’ll wait.\n> \n> If you own the older **ELBC 2000** , there
    is no fix yet. Elecbrakes has confirmed it has the same vulnerability, so every
    Elecbrakes controller - both models on sale today and the one before them - was
    affected. See [the ELBC 2000 section](#the-elbc-2000-the-model-without-a-fix)
    below.\n> \n> This write-up follows the disclosure date agreed with Elecbrakes
    (15 November 2026), four months after the fix reached the field. Elecbrakes tells
    us it is not aware of any reported incidents of damage or injury caused by these
    vulnerabilities. [CISA’s advisory](https://www.cisa.gov/news-events/ics-advisories/icsa-26-323-02),
    published on 19 November, covers three CVEs - **CVE-2026-96805** (CVSS 9.6, Critical),
    **CVE-2026-125273** and **CVE-2026-124281**. The coordination process took considerably
    longer than the research did, which is itself covered [further down](#the-other-half-of-the-work-getting-a-cve).\n\n*
    * *\n\n## The one-sentence version\n\nAny phone or laptop within Bluetooth range
    of an Elecbrakes trailer brake controller could apply that trailer’s brakes -
    at any force, at highway speed - without pairing, a PIN, or any authentication
    whatsoever. Four bytes. No handshake. No “are you sure?”\n\nThe longer version
    has drive tests, a fuzzing session that lit up like a Christmas tree, an over-the-air
    (OTA) firmware channel with the security posture of a screen door, a small Australian
    manufacturer that engineered a genuinely good fix at impressive speed, and a coordination
    process afterwards that turned out to be harder and slower than any of the technical
    work.\n\nLet’s get into it.\n\n* * *\n\n## How this started: my brakes were talking
    to strangers\n\nThis research didn’t begin with a threat model or a scope document.
    It began with me driving down the highway and noticing that my [Elecbrakes In-Car
    Remote](https://www.elecbrakes.com/products/remote) had connected to _someone
    else’s trailer_. I didn’t have my trailer on my car but I did have the remote
    powered on in the centre console.\n\nIt had connected mid-drive, without pairing
    or a prompt, to a brake controller that wasn’t mine, on a trailer I’d never seen,
    belonging to a driver who had no idea.\n\nThe trailers this happened with most
    often are operated by Sensys Gatso for the Tasmanian Government, and look _very_
    similar to this:\n\n![A white mobile speed camera trailer with its camera raised
    on a mast, parked at the kerb beside a busy road](/_astro/brake-check-speed-camera-trailer.CHbUg61k_Z2gL9ag.webp)\n\n_Photo:
    Richard J. Ho, [Minch Media](https://www.minchmedia.com)_\n\n[For the non-Tasmanians
    that may not recognise the trailer](https://www.speedcameras.tas.gov.au/who_operates_mobile_speed_cameras)\n\nIf
    you do security work, you know the feeling. That little cold prickle at the back
    of your neck that says _hang on, that shouldn’t be possible - and it would be
    very bad if it were._ If a device I don’t own will happily talk to my in-car remote
    driving past with zero friction… what exactly is stopping my phone or any other
    Bluetooth device from talking back?\n\nTurns out: nothing. It was very happy to
    accept our ‘requests’.\n\nI own the trailer. I own the in-car remote. I have a
    professional interest in devices that will do dangerous things for anyone who
    asks, with no friction in the way. So my colleague Jeremy and I decided to find
    out how deep it went.\n\n_(For the record, and for the lawyers: every single test
    in this post was performed on our own hardware, on private property or a closed
    setup. We never touched another person’s vehicle. The “connecting to strangers”
    bit was the in-car remote doing that by itself, which is rather the point.)_\n\n*
    * *\n\n## A quick primer: what an Elecbrakes controller actually does\n\nIf you
    don’t tow things, here’s the deal. Trailers over a certain weight need their own
    brakes, and those brakes need a controller that applies them in proportion to
    how hard the tow vehicle is braking. Historically this was a box bolted under
    your dashboard.\n\nElecbrakes’ clever idea was to move that box onto the trailer
    itself and control it over Bluetooth from an app or a little remote. Mount it
    once, tow with any vehicle, no re-wiring. It’s a nice bit of kit, which is partly
    why it’s so popular on Australian caravans, boat trailers, and horse floats.\n\nElecbrakes
    currently sells two models - the EB2 (the device I own) and the VM1. We have confirmed
    with Elecbrakes that these operate the same Bluetooth stack, so both were susceptible
    to this vulnerability. There’s also an older model, the ELBC 2000, which hasn’t
    been sold for a number of years but is still out there on trailers. Elecbrakes
    has since confirmed it has the same vulnerability, and it has no fix yet. More
    on that [further down](#the-elbc-2000-the-model-without-a-fix).\n\nThe important
    word here is **proportional**. This device decides how much braking force your
    trailer applies. It is, unambiguously, a safety-critical component. When it does
    the right thing, towing is smoother and safer. When it does the wrong thing, you
    are having a very bad day on a highway with several tonnes of trailer behind you.\n\nKeep
    that framing in mind, because everything below is a story about a safety-critical
    device that trusted anyone who said hello.\n\n* * *\n\n## Step 1: We knew where
    to look - we just couldn’t read the map\n\nHere’s the honest bit that’s relevant
    to the whole story. Jeremy and I work in infrastructure, cloud and security. Between
    us we’ve spent a couple of decades deciding what “good” looks like and developing
    a nose for what “bad” smells like. What we are _not_ is Android developers, and
    neither of us can sit down and read 5,000 lines of decompiled Smali bytecode.\n\nSo
    we didn’t. We used AI - Claude in this case - to do the heavy lifting on the reverse
    engineering. We pulled the Elecbrakes Android app (`com.ElecBrake.Remote`), decompiled
    it, and fed it to Claude with a simple set of questions: _What Bluetooth characteristics
    does this thing talk to? What’s the command format? Where’s the authentication?_\n\nThe
    app itself is a perfectly respectable modern Android build - Kotlin, Jetpack Compose,
    a Nordic-style Bluetooth Low Energy (BLE) stack. What came back from the analysis
    was a map of the device’s entire Bluetooth GATT profile: **47 characteristics
    across four services** , commands sent as plain unencrypted byte arrays, no checksums,
    no sequence numbers.\n\nAnd that last question - _where’s the authentication?_
    - came back with the most ominous possible answer for a brake controller: it couldn’t
    find any on the control path. Not weak auth. Not broken auth. No auth code at
    all on the characteristic that mattered.\n\nWe also noticed the app only _shows_
    itself 42 of the 47 characteristics. It carries a UUID allow-list and quietly
    ignores the other five. Hiding characteristics from your own app’s UI is a “note
    to self” at best. But it did tell us there was more surface here than the official
    app admitted to. Naturally, we wanted to see all of it.\n\nThere’s a broader point
    here worth sitting with. This kind of research used to require a fairly rare and
    specific skill set. It now requires curiosity, a device you own, and an AI that
    can read bytecode faster than any human. The barrie"
