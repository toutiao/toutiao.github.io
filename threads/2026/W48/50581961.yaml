  text: Make your choice of agent harness (opencode, pi agent, Claude Code, Codex,
    ...), LLM backend (llama.cpp, vllm, sglang, ...) and LLM (Qwen 3.8 27b, Qwen Flash
    Next, GLM-5.3, DS4, ...). Describe what you want to do and what you have and it
    should go from there. For Reverse Engineering if you managed to get the firmware
    out, you can either ask the agent to set it up or point it at e.g. REA [1]. Claude
    Code installed ILSpy [2] itself when I asked it to do some development against
    a dotnet game.<p>You won&#x27;t get the smarts of a cloud SOTA model with local
    hardware, so you might still want to run the LLM via Openrouter, Deepseek or something
    like runpod. The LLM is the most important part. Once you have a decently smart
    LLM hooked up to any harness with enough access rights, it will go from there.<p>For
    something like the headphones in your example, I would go with e.g. Codex or Claude
    Code with a subscription. It will give you a feel for what is possible and is
    the easiest to get started. Just hope you don&#x27;t trigger the guardrails of
    the models. Realistically, anything smaller than Qwen Flash Next (so about 80GB
    of VRAM for decent speed) will likely struggle with a complex task, so you are
    better off trying a Cloud model. I say this as a local-first proponent, but the
    hardware is not cheap. The harness and any tools it needs run on any computer
    you can open an Electron app on.<p>[1] <a href="https:&#x2F;&#x2F;github.com&#x2F;morluto&#x2F;rea"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;morluto&#x2F;rea</a><p>[2] <a
    href="https:&#x2F;&#x2F;github.com&#x2F;icsharpcode&#x2F;ilspy" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;icsharpcode&#x2F;ilspy</a>
