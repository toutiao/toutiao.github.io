  author: dgabler
  text: Yep. Boat trailers use either disc or drum brakes, seeming corresponding to
    age. With drum brakes historically you did not have a way to disable the hydraulic
    piston but it is not that big of a deal since the pressure of slowly backing up
    did not really grab&#x2F;engage things.  Sheer force could over come things.<p>When
    using disc though they are much more grabby. Here with disc you have a solenoid
    that is actuated by the backup lamps (pin in round 7 plug) that disengages the
    brakes.  Or you can use a physical interlock.<p>In my experience no interlock
    is needed with drum but you must with disc.<p>Electric drum brakes are more of
    a suggestion of wanting to brake in my experience.
