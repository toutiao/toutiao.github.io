  author: ssl-3
  text: 'SAE J2863 allows proportional electronic brake control, and is quite commonly-used
    in the US (we usually just call it a 7-way because Freedom Units, or something).<p>A
    combination of ISO 7638 with ISO 11992 seems to exist in some other regions and
    also accomplish proportional brake control (but I&#x27;m less-familiar with that).<p>Anyway:  The
    above SAE and ISO mechanisms for brake control aren&#x27;t cross-compatible, and
    neither one is ISO 11446 with all 13 of its pins, but:  They are things that exist
    and that can proportionally control trailer brakes using wires instead of garbage-band
    RF.<p>edit:  The device discussed in the article is apparently meant for the Australian
    market, wherein:  They already had their own standard for proportional electronic
    braking with AS 4177.5, and there&#x27;s a dedicated pin for that on the 7- and
    12-pin flat connectors that seem to be most-common there.'
