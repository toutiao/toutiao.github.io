  author: somat
  text: Electric trailer brakes are interesting mechanically as well, the naive thought
    is that they would work like hydraulic brakes, just replace the hydraulic actuator
    with an electric one, but it would take an excessive amount of current and a very
    large solenoid to do that. So what they actually do is have a small electromagnet
    grab the side of the brake drum and use the drag from that to apply pressure on
    the brake pads, basically using a small brake to run a large brake via levers.
    I thought it a rather clever solution to a problem I have never thought about
    before.
