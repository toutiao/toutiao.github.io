  author: hagbard_c
  text: 'The type of mechanical brake actuator used here in Europe is proportional:
    brake force depends on the deceleration of the towing vehicle. More deceleration
    -&gt; more brake force. Acceleration -&gt; brakes released. Steady state, no braking.
    All of this is done mechanically through the trailer hitch so it works on any
    towing vehicle. It does add a bit of a delay between the towing vehicle braking
    and the trailer reacting but that is something you get used to quickly. It also
    is less effective when the towing vehicle and the trailer are at a large angle
    towards each other so manoeuvring on an incline can be easier with electrically
    actuated trailer brakes.'
