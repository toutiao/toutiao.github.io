  author: cucumber3732842
  text: There is no provision in the spec for proportionality because the hardware
    implicitly handles it.<p>Electric trailer brakes are a dumb analog circuit.  More
    volts -&gt; more amps -&gt; magnet more grabby.  Less volts -&gt; less amps -&gt;
    magnet less grabby.<p>There is no need to have anything on the trailer side be
    proportional.  The vehicle side just varies the voltage.  Old school systems did
    this analog but modern stuff just PWM&#x27;s it&#x27;s way to the desired average.  The
    hardware doesn&#x27;t care.
