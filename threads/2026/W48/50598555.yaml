  author: jrflo
  text: 'That&#x27;s true, the animation is a bit confusing. I think in reality the
    ball is actually seated against the top of the straw at rest, and gets lifted
    up when there&#x27;s suction force when the plunger is released. Gravity is returning
    the ball to being seated once the chamber is filled. Typically check valves have
    a spring return on the ball&#x2F;sealing face, but gravity is probably used as
    a cost saving measure: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Check_valve"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Check_valve</a>'
