  author: brk
  text: One way check valve coupled with a piston&#x2F;compression mechanism that
    can force liquid into the chamber in front of the nozzle faster than the nozzle
    can release the liquid.  Squeeze the trigger, upper chamber fills quickly with
    compressed liquid. Liquid continues to spray after you release the trigger until
