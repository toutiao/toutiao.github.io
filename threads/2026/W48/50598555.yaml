  author: egypturnash
  text: 'If you do it the long way - disassembling the object, modeling one in a cad
    program, making it move, and building a web page that explains how it works -
    the you have learnt a few things:<p>* you have, most obviously, learnt something
    about how this particular machine you are documenting works<p>* you have practiced
    your CAD; maybe every part was trivial to model, maybe some were an interesting
    challenge that made you finally see what a tool you precious saw no use for is
    for, maybe you found a way to do something faster, you’re a little better at CAD
    in one way or another<p>* you have practiced writing text that succinctly and
    precisely describes the action of the object, which will make you slightly better
    at communicating clearly in <i>any</i> situation<p>You have gained experience
    in multiple disciplines. The webpage is the <i>excuse</i> to have the experience
    of understanding these surprisingly complex little machines, and fooling around
    with the tools to document this understanding.<p>Perhaps in the future you will
    use this knowledge to design some small, complex machines of your own, starting
    by lying back and modeling their parts and actions entirely in your mind, then
    taking them to the CAD software, printing them, experimenting with them in reality,
    seeing what doesn’t work as expected, thinking about how it could work better,
    and making a new version.<p>Perhaps all of this could be done by an AI. But you
    would have not gained any experience in any of these skills. You would not have
    had the experience of watching yourself get better at a thing, you would not have
    whiled away hours with a hobby. You just would have the end result.<p>Tl;dr: The
    journey can matter much more than the destination.'
