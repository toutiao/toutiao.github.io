  text: The ball is forced downwards when the trigger is pulled because liquid initially
    flows towards the dip tube, moving the ball onto the valve seat. Once seated,
    the pressure of the liquid above the ball keeps it firmly in place.<p>The illustration
    is not great because it looks like the ball forms a watertight seal in its upper
    position, rather than simply hitting a mechanical stop. This distinction is better
    illustrated in the original patent diagram [0].<p>Once the trigger is released,
    reduced pressure in the chamber causes liquid to flow up the dip tube, effectively
    reloading the sprayer.<p>[0] - <a href="https:&#x2F;&#x2F;patents.google.com&#x2F;patent&#x2F;US4527741"
