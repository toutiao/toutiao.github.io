  author: marginalia_nu
  text: "(Author).  So I&#x27;ve gotten pretty far in the index translation, at least
    as far as the postings lists go.  Out of the box for a direct translation there
    really hasn&#x27;t been much performance improvement going from Java to C++ in
    benchmarks.<p>The Java code was already stupidly optimized and basically allocation
    free in the hot paths apart from stuff that stays in TLAB or gets trivially elided.
    \ And while Java in general is unwieldy as hell for systems programming, it&#x27;s
    often surprisingly competitive since the C2 JIT basically gives your system free
    PGO everywhere on real world data.<p>The performance impact I&#x27;ve seen has
    mostly been the design improvements I&#x27;ve found along the way .  Paring the
    index down to now ~2000 lines of C++ has let me find several design refinements
    that improve buffer pool performance by using more lock free algorithms,  improving
    the index layout to reduce unnecessary block fetches and allowing more accurate
