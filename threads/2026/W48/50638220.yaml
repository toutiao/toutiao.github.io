  author: cpgxiii
  text: The biggest difference is that you would not be writing the <i>same</i> code
    in both Java and C++. It&#x27;s an exaggeration, but writing &quot;Java in C++&quot;
    would be passing every non-trivial parameter as a shared_ptr. Of course no one
    in the C++ community would think this was a good choice, and you generally only
    ever encounter ownership this messy in really old or weird libraries. The language
    simply gives you more ways to express ownership and memory layout&#x2F;locality
    in idiomatic ways, whereas achieving similar behavior in Java is much less trivial.
    For nontrivial programs, memory layout and locality has a very significant affect
    on performance; rarely are you going to have a program that spends all of its
    time bound by ALU&#x2F;FPU performance (but when you do, that control over layout
    means C++ has long had very capable libraries for SIMD math, where adding it to
    managed languages has been a much more recent addition).<p>Really the only thing
    that&#x27;s well known to (potentially) be faster in Java is certain lock-free
    datastructures where the JVM GC essentially allows object cleanup to be trivially
    deferred out of performance-critical points. You can do the equivalent of this
    in C++, but it generally requires care and it looks very weird.
