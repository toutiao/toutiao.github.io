  author: jgil
  text: Vanilla OpenWrt is not necessarily more secure than a vendor fork (though
    dropping the cloud&#x2F;remote-access layer obviously reduces the attack surface).
    It really depends on the build and config options.<p>For example, by default (in
    OpenWrt):<p>- The web UI serves plaintext HTTP and doesn&#x27;t redirect to HTTPS,
    even though it generates a self-signed cert for 443 on first boot. [1]<p>- The
    router generates a persistent DUID from its LAN MAC and sends it to your ISP.
    [2][3]<p>- Userspace is FORTIFY_SOURCE=1 and PIE&#x2F;ASLR are not enabled on
    all binaries. BusyBox (which runs the WAN DHCP and NTP clients) isn&#x27;t built
    with PIE unless you set PKG_ASLR_PIE_ALL. [4]<p>There are other defaults and unneeded
    packages that can be changed or removed. I spent a lot of time tuning the configs
    and switching some daemons to Rust before ultimately deciding that a NixOS gateway
    + separate AP was more viable.<p>[1] <a href="https:&#x2F;&#x2F;github.com&#x2F;openwrt&#x2F;openwrt&#x2F;blob&#x2F;main&#x2F;package&#x2F;network&#x2F;services&#x2F;uhttpd&#x2F;files&#x2F;uhttpd.config"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;openwrt&#x2F;openwrt&#x2F;blob&#x2F;main&#x2F;package&#x2F;network...</a><p>[2]
    <a href="https:&#x2F;&#x2F;github.com&#x2F;openwrt&#x2F;openwrt&#x2F;blob&#x2F;main&#x2F;package&#x2F;base-files&#x2F;files&#x2F;usr&#x2F;libexec&#x2F;duid-generate"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;openwrt&#x2F;openwrt&#x2F;blob&#x2F;main&#x2F;package&#x2F;base-fi...</a><p>[3]
    <a href="https:&#x2F;&#x2F;github.com&#x2F;openwrt&#x2F;openwrt&#x2F;blob&#x2F;main&#x2F;package&#x2F;network&#x2F;config&#x2F;netifd&#x2F;files&#x2F;lib&#x2F;netifd&#x2F;proto&#x2F;dhcp.sh"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;openwrt&#x2F;openwrt&#x2F;blob&#x2F;main&#x2F;package&#x2F;network...</a><p>[4]
    <a href="https:&#x2F;&#x2F;github.com&#x2F;openwrt&#x2F;openwrt&#x2F;blob&#x2F;main&#x2F;config&#x2F;Config-build.in"
