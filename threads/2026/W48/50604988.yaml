  author: dspillett
  text: There have been at least a couple of remote access issues with their kit over
    the years, though none recently that I remember.<p>Common advice is to keep all
    such interfaces (not just for Ubiquiti devices, for all such kit) on a separate
    network leg, and don&#x27;t even allow connections from your local LAN, either
    physically separating them on their own switch or using vLANs. Use a VPN to access
    that network leg when required, remotely <i>or</i> locally.<p>As extra paranoia
    measures, I suggest having the VPN mediated by a device from another manufacturer
    (or something you have put together with a basic Linux or BSD box), then an exploit
    has to get into two different environments in order to affect you, and nesting
    VPNs (with different credentials, of course) for external access so you VPN to
    local <i>then</i> to the management vLAN&#x2F;leg so there is no direct external
    route to your management interfaces. I don&#x27;t go that far with my home setup,
    but my router doesn&#x27;t answer to anything on the public interface, I need
    to VPN in to another box (a small VM on my “home lab” machine) to administrate
    it remotely if I ever need to (this does, of course, mean there are extra things
    that I have to be sure are kept running and survive power-outs properly, by being
    on the UPS for short problems and making sure they come back up in a sane state
    after a long problem).
  score: 0
