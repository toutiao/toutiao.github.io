  author: cesarb
  text: "&gt; but the moment they do an active MITM I don&#x27;t think a self-signed
    cert will be very useful<p>In my experience, it&#x27;s TOFU (Trust On First Use):
    once you accept the self-signed certificate the first time, Firefox will store
    its hash and no longer warn you as long as the certificate doesn&#x27;t change.
    An active MITM after that point should still warn about an untrusted certificate,
    since the certificate would no longer be the same as the stored exception.<p>(And
    the same would happen if you initially accepted the self-signed certificate while
    under an active MITM, and the attack later stops; the only way to avoid a warning
    would be to have the attack be running continuously since the first use.)"
  score: 0
