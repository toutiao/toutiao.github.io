  author: bonzini
  text: They phrased keeping branding as keeping attribution, which is part of a small
    set of extra conditions that are explicitly allowed by the AGPL (&quot;Requiring
    preservation of specified reasonable legal notices or author attributions in that
    material or in the Appropriate Legal Notices displayed by works containing it&quot;).
    It is a bit of a stretch but no one would have complained if they didn&#x27;t
    combine it with another allowed restriction (&quot;Declining to grant rights under
    trademark law for use of some trade names, trademarks, or service marks&quot;)
    to effectively forbid distribution of derivative works.
