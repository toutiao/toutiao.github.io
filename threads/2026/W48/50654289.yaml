  author: rob74
  text: 'More specifically, (IIRC) OnlyOffice tried to make a fork impossible by adding
    conditions to its AGPLv3 license that forbade others from removing the OnlyOffice
    branding (which was trademarked, so couldn&#x27;t be used by others). But the
    AGPL states that such &quot;further restrictions&quot; to the license can be removed
    in a fork, and that&#x27;s exactly what Euro-Office did. Even the Free Software
    Foundation issued a statement supporting this: <a href="https:&#x2F;&#x2F;www.fsf.org&#x2F;blogs&#x2F;licensing&#x2F;agpl-is-not-a-tool-for-taking-freedom-away"
    rel="nofollow">https:&#x2F;&#x2F;www.fsf.org&#x2F;blogs&#x2F;licensing&#x2F;agpl-is-not-a-tool-for-t...</a>.
