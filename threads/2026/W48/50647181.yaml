    |\n\n[[\\<prev]](8) [[next\\>]](10) [[day]](.) [[month]](..) [[year]](../..) [[list]](../../..)\n\n
    \   Message-ID: <20261125172638.73c0a05b@hboeck.de>\n    Date: Wed, 25 Nov 2026
    17:26:38 +0100\n    From: Hanno Böck <hanno@...eck.de>\n    To: oss-security@...ts.openwall.com\n
    \   Subject: Slow Ubuntu security response times\n    \n    Hello,\n    \n    Lately,
    I'm observing that Ubuntu's response to severe security flaws\n    is concerning.\n
    \   \n    On November 16th, details about a remote memory corruption called\n
    \   NoisyTCP (CVE-2026-99288) in the Linux kernel's TCP stack were\n    published:[https://www.openwall.com/lists/oss-security/2026/11/15/2](https://www.openwall.com/lists/oss-security/2026/11/15/2)Today,
    nine days later, Ubuntu still has not published a fix yet:[https://ubuntu.com/security/CVE-2026-99288](https://ubuntu.com/security/CVE-2026-99288)Other
    distros had a fix already available when the details were\n    published.\n    \n
    \   Likewise, a KVM host escape (CVE-2026-99312) affecting AMD\n    virtualization
    published on Nov 18th has no fix yet either [3]:[https://ubuntu.com/security/CVE-2026-99312](https://ubuntu.com/security/CVE-2026-99312)Ubuntu
    has been slow in patching another remote TCP corruption\n    (CVE-2026-98432)
    lately, where it took multiple weeks until a fix was\n    available. See also:[https://chalmovsky.com/posts/wtf-ubuntu](https://chalmovsky.com/posts/wtf-ubuntu)Recent
    news indicates that this is might be exploited in the wild:[https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign](https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign)I
    think everyone understands that these times aren't easy for security\n    teams.
    Nevertheless, remote corruption vulnerabilities in the Linux\n    kernel are the
    kind of thing where I expect updates to be available\n    within hours, not days
    or weeks.\n    \n    On a recent Ubuntu LTS system, the kernel version is 7.0.0-44.
    This\n    seems to indicate that Ubuntu is not relying on longterm supported\n
    \   kernels from kernel.org, but is instead backporting patches to an old\n    kernel
    version. On a Debian stable system, the kernel version is\n    6.12.118+deb13,
    indicating that it's based on a very recent longterm\n    kernel from kernel.org.
    I would consider the backporting strategy for\n    the kernel to be hardly viable
    and probably everyone should base their\n    Linux kernels on longterm releases
    supported by the Linux kernel\n    developers.\n    \n    -- \n    Hanno Böck
