  author: awesome_dude
  text: 'When I made the move to Ubuntu - it was driven by the following:<p>1. I was
    on Slackware, and becoming tired of ensuring every package was uptodate, and dependencies
    were in place. This made me look for a package manager - the options at the time
    were `yum` or `apt` and `yum` was... difficult<p>2. I tried the then Debian, but
    it did NOT like my integrated video card. This made me look for a way to get the
    more recent version of the kernel - the options were Ubuntu.<p>3. Upon installing
    Ubuntu, everything &quot;just worked&quot; networks, Java (back in the old days
    if I wanted a Java runtime on my Slackware I would have to download the current
    one from the web, then put it in the right directory, and symlink it - great for
    my ego being able to do, but tiresome that I had to do it every time I reinstalled,
    or broke something). And, maintaining the system became a breeze - `apt-get update
    &amp;&amp; apt-get upgrade`<p>Note: the pain point with all distros at that point,
    and Ubuntu was no better, was upgrading to the next version OS meant delete and
    reinstall - which did have the effect of teaching me how to mount &#x2F;home in
    a different partition so I didn&#x27;t lose that every time too..<p>Ubuntu was
    a bit touch and go for upgrading for a while - sometimes you could reboot and
    you had the shiny new version, other times you had... some learnings on how your
    grub&#x2F;bootable partitions were set up...<p>That was twenty years of experience
    - Ubuntu has been my daily driver since Breezy Badger (2005 IIRC)<p>Since then
    Ubuntu has become &quot;Enterprise&quot; - everyone started using it on their
    servers, instead of Debian, which aligned well with me because I had it as a Desktop
    OS, so understood it well.<p>Now, though, I am getting tired of it, the snap stuff
    is beyond horrible and I am in the market for a new OS - Debian might actually
    be what I go to'
