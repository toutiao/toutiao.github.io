  text: Honestly it&#x27;s probably cultural. I&#x27;ve worked at a place that just
    couldn&#x27;t get out of the &quot;old school&quot; waterfall release style. Collect
    requirements, build thing, send off to QA, create pre-release&#x2F;beta, get sign
    off, ship--very rigid and transactional handoff between each step.<p>It was all
    handoffs and meetings--no ability to fast track or prioritize something except
    to try to force it through. Ops would maintain hacks, patches, workarounds, run
    books for issues for months or years because it was so hard to &quot;just fix
    the software&quot;<p>I&#x27;m not advocating for the Zuckerberg yeet it into prod
