  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nFour
    years ago, NASA dispatched a small spacecraft on a suicide mission to show how
    humanity might deflect an asteroid on a collision course with Earth. The first-of-its-kind
    experiment [worked beautifully](https://arstechnica.com/science/2022/10/dart-mission-successfully-shifted-its-targets-orbit/)
    as the solar-powered space probe slammed into asteroid Dimorphos, permanently
    altering its trajectory.\n\nUsing telescopes, astronomers measured changes in
    the orbit of Dimorphos around a larger asteroid companion named Didymos in the
    aftermath of NASA’s Double Asteroid Redirection Test (DART) mission. The spacecraft
    released some 10 billion joules of energy as it impacted Dimorphos in September
    2022 at more than 13,700 mph (6.14 kilometers per second), shortening the asteroid’s
    12-hour orbit around Didymos by about 33 minutes, 25 times the most conservative
    expectation.\n\nBut scientists could only learn so much from DART. The collision
    destroyed the spacecraft, as expected. DART recorded images as it took aim on
    Dimorphos, but only faraway telescopes and a [small CubeSat that briefly detected
    the impact flash](https://arstechnica.com/science/2024/02/analyzing-images-from-a-close-flyby-of-darts-asteroid-impact/)
    could see what happened next.\n\n“We knew right away that the impact was successful,
    that DART made a really, really large mess,” said Sabina Raducan, a planetary
    scientist at the International Space Science Institute in Bern, Switzerland. “However,
    we didn’t really know what kind of mess. We were still missing pieces of the puzzle.”\n\n[![](https://cdn.arstechnica.net/wp-content/uploads/2024/10/Hera_and_its_CubeSats_connected_by_inter-satellite_links-scaled.jpg)](https://cdn.arstechnica.net/wp-content/uploads/2024/10/Hera_and_its_CubeSats_connected_by_inter-satellite_links-scaled.jpg)\n
    Artist’s illustration of the Hera spacecraft with its two deployable CubeSats,
    Juventas and Milani, in the vicinity of the Didymos binary asteroid system. \n
    Credit: ESA-Science Office \n\n_Artist’s illustration of the Hera spacecraft with
    its two deployable CubeSats, Juventas and Milani, in the vicinity of the Didymos
    binary asteroid system.\n\n              \n          Credit:\n\n          \n          ESA-Science
    Office_\n\n## Following up\n\nThe European Space Agency’s Hera spacecraft recently
    arrived in the vicinity of Didymos and Dimorphos after a [two-year journey from
    a launch pad in Florida](https://arstechnica.com/space/2024/10/european-mission-departs-earth-to-investigate-an-asteroid-wrecked-by-nasa/).
    On Wednesday, ESA released Hera’s first views of the scar left by DART on [Dimorphos](https://en.wikipedia.org/wiki/Dimorphos).
    The images show the car-sized impactor carved out a crater the size of a stadium,
    nearly as big as Dimorphos itself, a rugged chunk of extraterrestrial rock measuring
    about 500 feet (151 meters) across.\n\nMission planners selected Didymos and Dimorphos
    for the deflection experiment because they are similar to many near-Earth asteroids,
    but there’s no risk of them striking our home planet. Scientists weren’t sure
    what Hera would find when it got to the double asteroid, currently orbiting the
    Sun about 120 million miles (193.5 million kilometers) from Earth.\n\n“I would
    say we had two kinds of predictions: either we made a crater, or we reshaped the
    asteroid,” said Patrick Michel, Hera’s principal investigator from Côte d’Azur
    Observatory in Nice, France. “In fact, we did both because the crater is so large
    that the shape has changed. Therefore, we are in a sort of a transition between
    just cratering and global transformation, and we are still not sure how this can
    happen.”\n\nHera found Didymos, the larger of the two asteroids, spinning on its
    axis just as DART observed on final approach in 2022. Dimorphos is no longer so
    stable.\n\n“As Hera returned more images, it became clear that the DART impact
    has left Dimorphos tumbling wildly in its orbit,” says Michael Kueppers, ESA’s
    Hera mission scientist.\n\nThe Hera spacecraft will fly closer to Didymos and
    Dimorphos over the next six months to obtain more detailed observations. Hera
    will release two small sub-satellites to attempt landings on Dimorphos and collect
    data on the asteroid’s composition, internal structure, and mass.\n\nScientists
    will use this information to reconstruct the dynamics of DART’s impact four years
    ago and better understand how a future deflection mission might move an asteroid
    off a trajectory that actually threatens Earth. Near-Earth asteroids come in many
    shapes and sizes, with different densities and makeups, so knowledge of Dimorphos’s
    physical properties will anchor predictive computer models teaching scientists
    how best to deflect all types of asteroids.\n\n“Once we understand, we have a
    breakthrough, which really solves planetary defense,” Michel said in an interview
    with Ars.\n\n[![](https://cdn.arstechnica.net/wp-content/uploads/2026/11/hsh_longexposure.jpg)](https://cdn.arstechnica.net/wp-content/uploads/2026/11/hsh_longexposure.jpg)\n
    This is a composite image combining 11 long-exposure images from Hera’s Hyperscout-H
    instrument, centered on the Didymos asteroid. The dot trails correspond to hundreds
    of boulders of differing sizes in motion around the Didymos-Dimorphos system.
    The two asteroids have been subtracted from the image for improved visualization
    of the boulders. These images were acquired on November 6 with an approximate
    distance of 29.9 kilometers (18.6 miles) from the asteroids. \n\n_This is a composite
    image combining 11 long-exposure images from Hera’s Hyperscout-H instrument, centered
    on the Didymos asteroid. The dot trails correspond to hundreds of boulders of
    differing sizes in motion around the Didymos-Dimorphos system. The two asteroids
    have been subtracted from the image for improved visualization of the boulders.
    These images were acquired on November 6 with an approximate distance of 29.9
    kilometers (18.6 miles) from the asteroids._\n\n## What a mess\n\nIn its initial
    reconnaissance this month, Hera spotted hundreds of boulders surrounding the double
    asteroid. This was not entirely unexpected. A picture taken by the Hubble Space
    Telescope shortly after DART’s impact showed a [cloud of material streaming behind
    Didymos and Dimorphos](https://arstechnica.com/science/2023/07/hubble-is-able-to-spot-boulders-blasted-loose-by-the-dart-impact/),
    but scientists were astonished by the extent of the debris swarm in Hera’s first
    images.\n\n“As we approached Didymos and Dimorphos, we quickly realized the asteroids
    were not alone,” said Naomi Murdoch, planetary scientist at the Institut Supérieur
    de l’Aéronautique et de l’Espace in Toulouse, France. “In fact, they had a lot
    of company.”\n\nAn image released by ESA on Wednesday combines 11 long exposure
    frames from Hera’s hyperspectral camera. Image processors on the ground digitally
    removed the relatively bright Didymos and Dimorphos to reveal a panoply of dimmer
    streaks and dots, each of which is a rock fragment ranging in size from a football
    to a washing machine, Murdoch said.\n\n“Hera came to visit two asteroids, and
    we found hundreds of companions,” Murdoch said.\n\nOne obvious explanation for
    the boulders is they were thrown off Dimorphos when DART slammed into it. But
    scientists cautioned they need more information before they can say that with
    surety. Hera is the first space mission to undertake a sustained study of an asteroid
    with its own moon. The debris around the two asteroids might be relics from the
    creation of Dimorphos some time in the ancient past.\n\n“Hera will allow us to
    study that in more detail,” Murdoch said. “We really need to know more about these
    boulders and characterize them to understand if they’re linked to DART, if they’re
    linked to another process, and what the consequences might be for other asteroid
    systems in the Solar System.”\n\nThe boulder field will create challenges for
    navigating around the asteroids. In par"
