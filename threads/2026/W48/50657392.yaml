  author: bikeshaving
  text: 'There’s a concept called the Deflection Dilemma (or the Sagan-Ostro Dilemma,
    after its creators), which argues that because we’d likely have enough advance
    warning to deflect a dangerous asteroid on an impact course, we should build the
    tech just-in-time rather than in advance. The argument is about dual-use risk:
    any technology capable of deflecting near-Earth objects (NEOs) away from Earth
    could also be used to redirect harmless ones toward us, and that humans are just
    irrational enough to actually do it.<p>I used to think the psychological part
    of the idea was weak, like why would anyone intentionally steer an asteroid into
    Earth? But the movie `Don’t Look Up` convinced me that a scenario where companies
    try to nudge asteroids closer to mine rare-earth minerals is plausible. Given
    how AI development is going, I think we should probably treat asteroid-deflection
    tech with the same caution we apply to nuclear or AI capabilities.'
  score: 0
