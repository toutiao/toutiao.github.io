  author: crote
  text: "&gt; <i>Today asking for &quot;no AI made&quot; is akin to asking for &quot;no
    GUI IDE made&quot;.</i><p>You&#x27;re not <i>wrong</i>, but the problem is that
    allowing AI-made code means you are going to drown in vibecoded slop. Allowing
    only handwritten code forces the submitter to demonstrate a willingness to invest
    time and effort into their own project - which should be the <i>absolute minimum</i>
    when you are showing off your project for adoption by other people.<p>Any kind
    of &quot;no vibecoded slop, but agent-written code managed by a skilled developer
    is totally fine&quot; policy is completely unworkable, as everyone in the former
    category believes they are in the latter and will complain about &quot;unfair
    moderation&quot;. The alternative would be some kind of &quot;no projects without
    a multi-year commit history, multiple contributors, and an active user base&quot;
    - but that&#x27;s very much not in the spirit of a &quot;Show HN&quot; either.<p>Fully
    banning AI in a show-your-work community is the lesser of two evil. Until someone
    invents a better way of moderation, it is unfortunately either that or seeing
    the community die due to 99% of submissions being slop."
