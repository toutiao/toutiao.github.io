  text: That’s pretty funny! I’ve seen optimizations like this for reporting systems
    where rather than taking the top N item matching filter X, they cheat by taking
    the top M (where M &gt; N) items and then filter it client side to N items matching
    filter X.<p>As long as the results are enough to populate the page you don’t notice
    the difference and it’s usually faster as you reuse the prior ranking.<p>But if
    not, you get this exact situation.
