  author: mdasen
  text: Sorta.<p>First, I should note that some of the improvements aren&#x27;t because
    &quot;Zen1 was very new thus there are a lot of things could be done to improve
    it&quot; as the parent comment said and because AMD just built a larger, hotter
    processor using a much smaller node. The Zen 6 in the comparison is 60% larger,
    runs at 3-4x the power requirements, and uses 2nm instead of 14nm. All of that
    would yield big improvements on its own. But yes, AMD also did a lot to improve
    it too.<p>With the M-series, what should we compare? The M1 and M6? Well, that
    ignores the fact that the AMD processors being compared are vastly different sizes
    and power draws (and the fact that we&#x27;re talking about 6 years instead of
    10 and the fact that M1 was already at 5nm instead of 14nm). Should we compare
    the M1 with the M5 Pro? Max? Ultra? If die size and power usage don&#x27;t matter
    in the comparison, that&#x27;s fair game, right?<p>The best comparison I can find
    is that Apple increased single-core iPhone performance by 7x from 2013-2023 and
    multi-core performance by 14x 2013-2023. That&#x27;s quite impressive given that
    Apple&#x27;s working within basically the same die size and power utilization
    while AMD is seeing a 60% increase in size and 3-4x increase in power.<p>But I
    think one of the best benchmarks might be price. AMD was able to 12x performance
    without much increase in price - a 30% increase in list price over 10 years isn&#x27;t
    really a change, though it&#x27;s possible AMD used to give better discounts than
    they do now given the tight industry.<p>AMD&#x27;s increase is pretty great, but
    it&#x27;s also not unheard of. Apple was already doing really great with its mobile
    CPUs in 2013 and it was still able to 14x the performance over the next decade,
    but it&#x27;s always hard to compare things and AMD has done a wonderful job.
    There was a time when it looked like Intel would crush AMD and it&#x27;s so different
