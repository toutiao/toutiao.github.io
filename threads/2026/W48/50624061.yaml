  author: adrian_b
  text: In a year from now, desktop Zen 6 CPUs with 24 cores will be available (even
    if it is unknown if memory will be available for them at acceptable prices).<p>While
    the desktop CPUs are configured by default to be able to use up to 10 to 20 W
    per core, in order to reach high clock frequencies, e.g. up to 6 GHz, nobody stops
    you from configuring them to use lower clock frequencies and supply voltages,
    so that the power consumption stays limited to less than 3 W per core, like in
    server and laptop CPUs.<p>For AMD CPUs, the CPU cores are the same in server CPUs
    and desktop CPUs, so until and including Zen 5 there was no difference in the
    performance per watt that was reachable in server CPUs and desktop CPUs with lower
    power limits.<p>Nonetheless, what is new in Zen 6 is that the cores used in the
    32-core chiplet have a higher IPC than the cores used in the 12-core chiplet,
    which are optimized for higher clock-frequencies.<p>That means that when the 12-core
    chiplets are limited to a low clock-frequency and power consumption, their computational
    throughput per core will be lower than for the 32-core chiplets at the same power
    consumption per core.<p>So you happen to be right that because of this change
    that happened in Zen 6, a desktop CPU with a 32-core chiplet would reach a better
    performance per watt at the same power consumption per core. Nonetheless, the
    difference should not be great.
