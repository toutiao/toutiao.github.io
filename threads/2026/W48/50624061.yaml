  author: x-complexity
  text: 'There&#x27;re 2 parts to the 12x gain: Raw core count bumps, &amp; per-core
    performance improvements.<p><a href="https:&#x2F;&#x2F;www.phoronix.com&#x2F;benchmark&#x2F;result&#x2F;amd-epyc-zen-6-venice-vs-epyc-zen-1-naples-linux-benchmarks&#x2F;result.svgz"
    rel="nofollow">https:&#x2F;&#x2F;www.phoronix.com&#x2F;benchmark&#x2F;result&#x2F;amd-epyc-zen-6-ven...</a><p>EPYC
    7601 2P Zen 1 Naples = 2 x AMD EPYC 7601 32-Core (64 Cores &#x2F; 128 Threads)<p>EPYC
    9686F 2P Zen 6 Venice = 2 x AMD EPYC 9686F 96-Core @ 5.32GHz (192 Cores &#x2F;
    384 Threads)<p>The core count bump alone will give an almost 3x improvement (192&#x2F;64),
    had the architectures stayed the same.<p>Thus the remaining 4.03x (12.1&#x2F;3)
    came from improvements to the architecture:<p>- AVX-512 gave a 2x(-ish) boost
    over AVX2, but<p>- Zen1&#x27;s AVX2 also needed twice the cycles to handle the
    work, with<p>- True architectural improvements helping to push it all past 4x<p>Even
    though most of the gains laid there for the taking, AMD did do the work necessary
    to get that cumulative 12x gain.'
