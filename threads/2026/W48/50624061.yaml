  author: zrm
  text: Code compilation is running into Amdahl&#x27;s law there. The 2x9996 system
    has 1024 threads. The reason power went from 180W to 500W and 600W is that core
    count went from 32 to 96 and 256, but the single-threaded compilation steps don&#x27;t
    care about that, and wouldn&#x27;t use 500W&#x2F;600W during them. Notice that
    the 96 core one is keeping up with or beating the 256 core one there, because
    it has a higher boost clock and has the advantage on the single-threaded steps.<p>The
    memory and cache likewise haven&#x27;t increased much per core. They now have
    4MB of L3 per core instead of 2MB and for the 9996 the memory bandwidth per core
    is only up 33%, and code compilation cares more about memory latency than bandwidth.
    The memory in the newer systems is actually a liability there because DRAM latency
    hasn&#x27;t improved at all and they were using MRDIMMs, which prioritize bandwidth
    over latency and correspondingly have worse latency than the DDR4 in the old system.
    If you were specifying a build system you&#x27;d want to use ordinary DDR5 RDIMMs
    instead and it&#x27;d have been a bit faster (and cost less).<p>Compare this to
    the last page. Geometric mean of all tests says 9996 (Zen6c) is &gt;12x faster
    with 8x the cores and 9686F (Zen6) is &gt;8x faster with 3x the cores. Meanwhile
    the average power consumption (these are all 2-socket systems) was 331.6W, 751.3W
    and 805.8W. Performance per watt is up 5x for 9996 and 3.8x for 9686F, and the
    F models are the ones that sacrifice performance per watt for higher clock speeds.
