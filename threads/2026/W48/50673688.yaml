  text: Fair enough on the sarcasm - I misread your tone (though probably others read
    your comments that way too).<p>Earlier you said &quot;Are they slop factories
    or PEDs&quot;, so you didn&#x27;t seem to like that analogy (and I don&#x27;t
    either). I was trying to come up with an analogy that held up better.<p>You&#x27;re
    also talking to multiple people here. Some still think all AI output is &quot;slop&quot;
    in the straightforward sense of &quot;not good code, mixed up together like gruel,
    unmaintainable&quot; (which, note, doesn&#x27;t claim that it doesn&#x27;t accomplish
    its goals). Others just use the word to mean &quot;AI output&quot; no matter how
    good it is, either because they believe it&#x27;s always slop in the first sense
    (in which case I&#x27;d urge them to try a state-of-the-art agent and see if that
    belief holds), or because they&#x27;re anti-AI for moral reasons and just like
    to use the term pejoratively or provocatively.<p>Personally, I&#x27;d only use
    the term if I were looking at something that specifically fell into the first
    category.<p>I don&#x27;t like the performance-enhancing drug analogy either. PEDs
    change who the person &quot;is&quot; in a way that coding agents (and power tools)
    don&#x27;t. It&#x27;s easy to dismiss as an analogy.<p><i>If your traditional
    woodworkers quit and shut down shop that would be pretty sad for them.</i><p>I
    agree!
