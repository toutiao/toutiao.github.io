  author: stereolambda
  text: Not sure philosophical discussions about semantics are that interesting if
    the other people want to talk abut practical impact. I mean yeah, I&#x27;d also
    be careful with putting an LLM as an active subject in a sentence, but people
    rarely use precise language.<p>I think your strongest point is that LLMs structurally
    lack fuzzy common sense. This is because of that life experience is hard to articulate
    in language as rules, and often rules that are articulated obfuscate. A human
    may know from experience where to use an unofficial shortcut, or where an apparently
    sure way isn&#x27;t actually reliable. Also you have the problem of having multiple
    levels of different goals, considerations etc. where you have to be very careful
    about overoptimizing for the very low or very high level. In other words, focus
    on the immediate context can be harmful.<p>This doesn&#x27;t prevent LLMs from
    excelling in being used for anything where sufficient &quot;guardrails&quot; can
    be defined, and you have funds for firing the slop machine gun full speed. Math
    is almost exclusively that. Programming has a lot of a mix of decisions that require
    common sense and ones that can be judged objectively. In that sense I can see
    how you can reach both conclusions on LLMs vs. programming.<p>But to be fair,
    for practical economy the slop machine gun approach can win anyway. Though I think
    in the long run we&#x27;ll have to either strongly improve the LLM program generation
    quality (in models or in the process), or people with some sense will congregate
    to use software that is at least mostly human directed. Just like with choosing
    OSS. Right now day-to-day software being pushed feels horrible in a special way.
