  text: I see how people think this would be the downfall of human mathematics. But
    I don’t think it is.<p>Mathematics is not a spectator sport. The goal is (human)
    understanding. Maybe because school portraits it as a competition to solve exercises,
    people think otherwise. But the exercises are only a means to an end. We do mathematics
    to understand abstract concepts. Our method is posing theorems which are meaningful
    to us and finding proofs of them.<p>Thus, it does not matter how the proofs come
    about, as long as they contribute to human understanding.  The project of maths
    continues.<p>Mathematics isn’t solved, it never will be. We know that LLMs are
    not oracles (Gödel says hello), thus there will be problems even they can’t solve.
    But we will invent new theories, new problems to solve (using our brains and LLMs)
    for many years to come.
