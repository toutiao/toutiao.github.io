  text: "&gt; Like Scott Aaronson I am losing patience with those denying this is
    real.<p>But what exactly is real? It seems that no one can articulate it clearly,
    either fearing the monster in the dark, or looking at some invisible paradise.<p>But
    I think my struggle with hypers is how they’re purposefully maintaining their
    ignorance in order to give weight to their arguments. They have no drive to understand
    anything they put out and they either expect you to accept the work as is, or
    to spend your mental energy to decipher it.  This quickly drain any intellectual
    energy out of any discussion.<p>I don’t have any PHD but I’ve read a few papers.
    What I’ve seen is a motivation to explain an idea or a fact the authors have discovered.
    Not to merely show that it has been discovered.<p>I like programming not because
    of the end result. If I did, I would just buy licenses and subscriptions because
    there’s a lot of software out there and it would be cheaper than spending hours
    on code. Just like the easiest way to go from A to B is to be driven (taxi or
    your own chauffeur).<p>I like programming because I can see the machinery, design
    it, and control it. Sometimes it feels like driving commercial trucks (minimal
    control and preplanned routes), other times it’s like doing a cruise in your favorite
    car (total freedom).<p>I do agree with Linus that a patch of code needs to be
    judged by its technical merits and not by the tooling used. But often, the human
    on the other side is utterly clueless about the code. And thus the idea of contribution
    is worthless."
