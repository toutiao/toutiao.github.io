  author: AngryData
  text: To nitpick your example, did machines make better chair legs? Seems to me
    like they made cheaper chairs that were and still are technically inferior to
    green cut, split and hand turned legs. The type of chairs bodgers were employed
    to make use pretty thin wood spokes that requires following the grain throughout
    the spoke to remain strong enough, which doesn&#x27;t happen if you just throw
    a square cut piece of timber on a lathe. You also need green wood to get good
    grain splits from wood and more easily bend the grain into different shapes for
    curved portions, but getting fresh green wood doesn&#x27;t lend itself well to
    industrial logging practices. Which is why modern wooden chairs are heavier and
    use significantly thicker wood on average and you don&#x27;t see many windsor
    or similar style chairs anymore except when they are hand made.<p>Now one could
    argue there just isn&#x27;t demand for those old style chairs, but I would bet
    more on the style changing because older furniture styles are simply incompatible
    with cheaper modernized wood working practices.
