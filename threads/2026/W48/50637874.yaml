article:
  url: https://scottaaronson.blog/?p=10362
  title: Shtetl-Optimized  » Blog Archive   » I’ve been drinking wine in my kitchen
  fetch_status: success
  content: "# [Shtetl-Optimized](https://scottaaronson.blog/)\n\nThe Blog of Scott
    Aaronson   \n  \n\n* * *\n\n« [Moar Videos and Links](https://scottaaronson.blog/?p=10359)\n\n##
    [I’ve been drinking wine in my kitchen](https://scottaaronson.blog/?p=10362 \"Permanent
    Link: I’ve been drinking wine in my kitchen\")\n\nSee I don’t even _like_ alcohol
    much. Like, I’ll have a half-glass of wine at a fancy dinner if everyone else
    is having some, or one beer at a reception, but that’s it. These days, though,
    can you blame me?\n\n* * *\n\nYesterday, as you all probably saw, hot on the heels
    of its [proof](https://scottaaronson.blog/?p=10344) of the Generalized Riemann
    Hypothesis, Anthropic released a [proof of Valiant’s VP≠VNP conjecture](https://github.com/anthropics/formal-math/blob/vp-vnp/vp-vnp/paper.pdf)—a
    central algebraic analogue of the P≠NP conjecture, and considered a “warmup” to
    proving P≠NP since the late 1970s. Then, later the same day, OpenAI released a
    [proof](https://github.com/openai/math/blob/main/preprints/VP-and-VNP-are-different-November-23-2026/paper.pdf)
    of the VP≠VNP conjecture as well.\n\nYou can read all about the VP vs. VNP problem
    in Section 6.5 of my [P vs. NP survey](https://www.scottaaronson.com/papers/pnp.pdf).
    But briefly, for those tuning in from home, Valiant’s conjecture says that the
    [permanent](https://en.wikipedia.org/wiki/Permanent_(mathematics)) of an n×n matrix
    has no algebraic circuits (that is, circuits built out of addition and multiplication
    gates and constants) of size polynomial in n, unlike the [determinant](https://en.wikipedia.org/wiki/Determinant),
    which does. Anthropic’s result says that a circuit of size exp(Ω(log n)) is needed,
    whereas OpenAI gets exp(Ω(log n)): so, more than polynomial albeit less than exponential.
    As is often the case, the best known upper bound here is ~2. The lower bounds
    are said to work over all fields of characteristic other than 2. (What’s special
    about 2? Over a field of characteristic 2, addition and subtraction are the same,
    so the permanent just _is_ the determinant, and is easy to compute!)\n\nFrom what
    little I understand so far, the proof techniques in the Anthropic and OpenAI papers
    look similar. They both do some sort of highly nontrivial “compression” or “shortening,”
    followed in the end by a diagonalization—the oldest trick in the book! Diagonalization
    is what should let these arguments evade the infamous [natural proofs](https://en.wikipedia.org/wiki/Natural_proof)
    barrier. There’s probably also a story to tell about how the arguments evade an
    algebraic-circuit version of the relativization barrier, but I don’t know how
    to tell it yet.\n\nOne immediate implication of these results is that, if you
    want to map an n×n matrix A to an m×m matrix B whose entries are affine functions
    of the entries of A, and have the permanent of A be equal to the determinant of
    B, then m must be exp(Ω(log n)). This was the question directly targeted by Ketan
    Mulmuley’s [Geometric Complexity Theory](https://en.wikipedia.org/wiki/Geometric_complexity_theory)
    program—which, however, these papers don’t use, taking a more direct route to
    the desired lower bound.\n\nAs is de rigueur these days, the proofs come with
    Lean, formally certifying their correctness to a level considerably _beyond_ what
    we’d normally demand for a math paper published in a journal. If recent experience
    is any guide, this will not prevent boatloads of morons from denying that AI could
    _possibly_ have solved these problems, and latching onto anything whatsoever (e.g.,
    unused Lean code or Lean that deviates slightly from the natural-language version)
    to declare the proofs to be fallacious … and such claims will then go viral, lapped
    up by an eager audience on Bluesky and other places hungry for AI denial. If there’s
    any real technical issue with the proofs, I’ll be happy to hear about it from
    experts, but my patience for arguing with the flat-earthers is at an end.\n\nDaniel
    Harlow asked me whether the proof of VP≠VNP raises my confidence in P≠NP itself,
    which I’d lowered from 97% to 95% in light of OpenAI’s and Anthropic’s recent
    refutation of the Exponential Time Hypothesis. I said sure, I’m now back up to
    96%.\n\nThe possibility that this will be followed up soon by a proof of P≠NP
    itself has not escaped my notice, or anyone else’s, _certainly_ not at the AI
    companies. Will the big one come tomorrow? Next week? Next month? In a year? Who
    the hell knows? Hence the wine drinking, which I wouldn’t call sad, but just …
    _thirsty_.\n\n* * *\n\nIf that wasn’t enough for you—if you still want _more_—yesterday
    Sanjeev Khanna, Aaron Putterman, and Junkai Song posted an [ECCC preprint](https://eccc.weizmann.ac.il/report/2026/339/)
    with a deterministic linear-time algorithm for finding minimum spanning trees
    in graphs. (The best previously-known algorithm was ridiculously _close_ to linear
    time—n α(n) where α is the inverse of the [Ackermann function](https://en.wikipedia.org/wiki/Ackermann_function)—but
    not quite. A _randomized_ linear-time algorithm was known.) This was a huge open
    problem for decades, and one that my wife Dana spent roughly two years working
    on.\n\nKhanna et al. write, “the main ideas in [our] paper were entirely generated
    by AI—specifically 6.2 Astra, on a mixture of Ultra and Max effort—with minimal
    human intellectual intervention. The authors then worked to first carefully verify,
    and then to simplify and clarify the treatment.”\n\n* * *\n\nAnyway, yeah, tonight
    I’ll again raise my glass, I’ll pray that at the bottom of this terrifying rollercoaster
    lies a world that my children and I will be glad to inhabit, and I’ll mutter to
    myself the eternal words:\n\n_God would like us to be joyful  \nEven though our
    hearts lie panting on the floor;  \nHow much more can we be joyful,  \nWhen there’s
    really something  \nTo be joyful for._\n\n_To life, to life, l’chaim!  \nL’chaim,
    l’chaim, to life!  \nIt gives you something to think about,  \nSomething to drink
    about,  \nDrink l’chaim, to life!_\n\n* * *\n\nSee [Lance’s post](https://blog.computationalcomplexity.org/2026/11/vp-vnp.html)
    for more.\n\n[![Email, RSS](https://scottaaronson.blog/wp-content/plugins/really-simple-facebook-twitter-share-buttons/images/specificfeeds_follow.png
    \"Email, RSS\") Follow](http://www.specificfeeds.com/follow)\n\n### 54 Responses
    to “I’ve been drinking wine in my kitchen”\n\n1. Says:   \n\nDoes an algebraic
    circuit version of the relativization barrier \\*exist\\*? I’m not familiar with
    the VP and VNP classes, so I don’t know how strongly my intuitions about P vs
    NP should translate over to this setting.\n\n2. Says:   \n\nScott, your readers
    might be interested in something I stumbled across. At [https://pequalnp.com/](https://pequalnp.com/)
    people are contributing money and agents to a swarm searching to prove P != NP.
    Not sure if this is the new wave in solving problems, or if it will beat the swarms
    at the big AI companies.\n\nThanks for sharing your thoughts!\n\n3. Says:   \n\nWho
    would have thought that spending trillions of dollars and using a large percentage
    of the industrial world’s energy output would produce these great results?\n\nThey’ll
    be finding a long lasting battery for mobile phone’s next, surely?\n\n4. Says:
    \  \n\nVitor #1: Yes, one could define algebraic oracles (like [Avi Wigderson
    and I](https://www.scottaaronson.com/papers/alg.pdf) did back in 2008) and then
    feed them to algebraic circuits. This would give rise to a barrier that these
    arguments presumably evade although I don’t yet know how. Anyone who _does_ know
    is welcome to enlighten us!\n\n5. Says:   \n\nPace Nielsen #2: Yeah, I saw that.
    I didn’t see any partial results there that looked promising, and would place
    my own bets on whatever is happening internally at the labs, but again, who the
    hell knows?\n\n6. Says:   \n\nJames Gallagher #3: I’m sure that what’s spent solving
    big open math problems is a trivial fraction of the labs’ overall energy use!\n\n7.
    Says:   \n\nWhen RH was announced I was surrounded by people who didn’t care.
    One said “yeah?” and got ba"
