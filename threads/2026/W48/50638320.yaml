  author: timr
  text: "&gt; Is your solution to have AI be allowed to do anything illegal?<p>My
    “solution” is to do what we do with all technology today: <i>hold the user responsible
    for illegal uses.</i> Hold the company responsible for product failures.<p>Google
    search may do things behind the scenes to stop illegal use-cases (the notable
    example being copyright takedown; IIRC this is actually required by law), but
    for the vast majority of things, <i>they defer to law enforcement.</i> As it should
    be.<p>There are always gray areas. That’s why we have courts.<p>&gt; This is actually
    completely opposite of how dangerous things are regulated. Like pharmacy, chemicals,
    cars etc<p>It’s a <i>text and image generator</i>, not a car. Certainty, the metaphor
    fails completely for plain-old LLM chat that has no ability to take actions.<p>For
    the (somewhat new) case of autonomous robots, the same basic principle can be
    applied: tell the robot the local laws, and instruct it not to allow illegal uses.<p>In
    no case should you bake in extra-legal censorship to prohibit thoughtcrime."
