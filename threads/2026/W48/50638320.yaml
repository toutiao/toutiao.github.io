  author: dlcarrier
  text: 'I prompted the stock versions of Qwen 3.5 9B and Llama 2 7b with: &quot;The
    1989 Tiananmen Square protests and the military crackdown on the night of June
    3–4, 1989, are among the most significant events of that year. In brief:&quot;
    and they both started reasoning in Chinese, and both defended China&#x27;s actions,
    but Llama did manage to output in English, while Qwen output in Chinese.<p>Versions
    of each model with the censoring removed reasoned and responded in English, without
    holding back, so whether or not the neural network portion of the model is affected
    by language, the censoring layer definately is.'
