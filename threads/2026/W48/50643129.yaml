  author: MomsAVoxell
  text: Those tadpole shrimps are also known as Triops and they are a fairly common
    educational product&#x2F;beginner pet sold in toy shops.<p>In the early days of
    the web I had a Triops tank set up with my SGI Indy camera pointed at it, and
    had visitors all over the world watching the Triops growing.  It was awesome ..
    the kit came with a bunch of eggs, I just threw them all in there and watched
    as fairy shrimp, banana shrimp, and tadpole shrimp all hatched and went through
    their life cycles.  I placed the tank under a desktop lamp, pointed the Indycam
    at it, and basically went hands-off for the 5 or 6 weeks that the whole thing
    was very entertaining.<p>The banana shrimp whooped up first, then the fairies
    and then the triops.  It was really amusing .. the banana&#x27;s dominated the
    cycle early, consuming all the food very fast, generally swimming around in circles
    just eating, eating .. and occasionally a fairy shrimp would get trapped in its
    talons, and we&#x27;d watch the banana shrimp consume a fairy or two .. while
    the baby Triops hatchlings mostly swam around the bottom surface, trolling for
    detritus and un-caught food pellets, growing growing in size by the day .. and
    they are cannibalistic little critters too, so there was a daily reckoning for
    the first 10 or 15 of them that hatched .. we (SGI Indy camera audience) would
    watch them slowly growing, occasionally catching each other .. until they got
    big enough to swim into the main middle section of the tank, and then .. the battle
    was ON!<p>Banana shrimp, almost a school of them, were whittled down over the
    course of a few days, the 30 Triops or so that formed went down to 5 or 6, we&#x27;d
    occasionally catch a fat Triops devouring a banana, and on one fun occasion, a
    banana being consumed by a Triops while also consuming a fairy .. it was a real
    Battle Royale of beasties. The species diversity dwindled and for the last part
    of the cycle, it was nothing but hot Triops on Triops action, some of us taking
    bets on which of our champions would survive and which would .. well, just disappear
    into the ether, as Triops poop.<p>Until, one fateful day, all there was left in
    the tank was one big, fat, very well fed Triops about the size of my thumb, swimming
    long circles around and around, all on its own.<p>I let the water evaporate and
    the sludge at the bottom dry, and pointed the SGI Indy camera at other things
    meanwhile, then a few weeks later, added more water to the dry dusty layer and
    filled the tank again.  The whole cycle repeated itself - everyone had successfully
    reproduced!  Bananas and fairies going at it in the early stages, only to be resolutely
    hunted by the Triops which, once again, whittled the entire tanks population down
    to one big, fat, well fed beastie, swimming its circuit.<p>Truly fun little critters.  I
    wouldn&#x27;t be surprised though, if some Florida kid introduced them to the
    pond, they can be somewhat traumatizing if you&#x27;re not ready for cannibalism
    and stuff being eaten alive right in front of you ...
