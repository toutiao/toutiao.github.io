  author: thaumasiotes
  text: The tadpoles and dragonfly nymphs make me think of a question:<p>This metamorphic
    lifestyle is a way for one species to exploit two different ecological niches.
    This is more dramatic for the dragonflies than it is for the frogs - each dragonfly
    stage is incapable of living in the environment inhabited by the other stage.<p>So
    you have your dragonflies splitting their time between the water and the air in
    an environment that supports roughly X nymphs and Y adults.<p>Suppose there&#x27;s
    a change to the environment and the air becomes a much more rewarding place relative
    to the water. The environment will now support X nymphs and 4Y adults. How does
    the species respond to the environmental change?<p>I can think of some options:<p>-
    No change; they&#x27;re bottlenecked on X nymphs and X nymphs at any given time
    mean no more than Y adults. The extra resources in the air are abandoned to other
    more adaptable species.<p>- The nymph stage of the life cycle gets much shorter;
    a species that used to spend two years as a nymph now spends 6 months that way.<p>-
    The adult stage of the life cycle gets much <i>longer</i>.<p>- The nymph stage
    gets <i>so</i> much shorter that it&#x27;s reduced to zero; the dragonflies throw
    off a new species with nonaquatic nymphs. Kind of a blend of the first two options.<p>The
    problem appears fairly general to the phenomenon of a single species that consumes
    different resources at different stages of its life. The availability of those
    resources will vary independently, and you want to be able to respond to changes,
    but the supply of organisms at each stage of life is much less independent. Is
    there a general theory of this kind of thing?
