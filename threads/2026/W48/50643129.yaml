  author: thaumasiotes
  text: "&gt; Wings in insects are both a blessing and a curse as arthropod wings
    can&#x27;t molt. Once you have wings your days are numbered. Is the last molt
    that you can have.<p>This might be true as an empirical fact about the arthropods
    we have, but on a fundamental level I see no reason why it&#x27;s harder for a
    dragonfly to molt by shedding its existing wings and coming out with brand new
    ones than it is for a nymph to do the exact same thing.<p>&gt; The animals would
    just reproduce more in the air if the air became a place filled with preys. They
    could even live less time.<p>Well, again, if the air became a place filled with
    easy prey, you&#x27;d want to see the population of adult dragonflies rise to
    a new higher level. It doesn&#x27;t really matter how long they each live individually,
    but the total population of adults should go up and the total population of nymphs
    shouldn&#x27;t.<p>&quot;Just reproducing more&quot; isn&#x27;t a good approach
    to that problem, because it has to go through a nymph-stage bottleneck; even though
