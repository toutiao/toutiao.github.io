  author: pvaldes
  text: We are talking about different things then, but this can not happen, because
    the said wing-duration limit for adult stage.<p>Also because a non optimum environment
    for nymphs means a longer nymph stage. If an adult would live lets say 7 years,
    they would be producing a huge amount of nymphs in that time also. Either you
    have a nymphocalipse where lets say one on each 100 nymphs will survive, or you
    will have always less adults than nymphs.<p>Also because dragonflies are territorial
    so there is a limit in the number of adults that you can really pack in a location,
    and will be close to the number of perches available. Nymphs don&#x27;t have that
    issue. Anybody with a garden pond is surprised about how much dragonfly nymphs
    can fit in even a small one.
