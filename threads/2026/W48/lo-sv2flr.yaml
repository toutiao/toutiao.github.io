  author: hailey
  text: |-
    Look at Windows: an outdated driver, a misconfigured system or even not enough hardware resources make the system go BSOD, what do every say? "Windows frequently crashes! It is unreliable!" but in fact, Windows alone can rarely blamed for that.

    Computing is a sociotechnical system. If frequent crashes due to poorly written drivers tends to be a bigger problem on Windows than other platforms, we must examine what it is about Windows that makes Windows like that. It is short sighted not to, and means that we miss the opportunity to actually solve the problem. It’s a bit like saying “skill issue” and leaving it at that.
    For example, things we could investigate are: is it harder or more complicated to write correct Windows drivers than it is on other platforms? Is it poor kernel APIs? Inadequate documentation exacerbated by lack of source availability? What blockers are there to moving more drivers out of kernel space so that crashes can’t take down the whole system?
  score: 2
