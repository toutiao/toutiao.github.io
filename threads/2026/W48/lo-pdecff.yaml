    Not sure if this is in jest, but Drew's announcement post in his personal blog is a more thorough overview:

    In short, sneakernet is a general-purpose message distribution system which uses your feet as the main transport. When you publish a message on your node, it gets automatically passed on to anyone else on the LAN who is also running sneakernet. They physically carry your message on their laptop to another network, where other sneakernet nodes automatically pick it up, too, and pass it further along. You can send an email via sneakernet to your friend in another city, and it will arrive, perhaps weeks or months later, whenever someone physically carries the data to them, perhaps through some number of intermediaries.

    I'm not sure what the stance is here with regards to sharing his personal content given that the site is banned as a submission source.
