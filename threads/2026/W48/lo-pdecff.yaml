    **NOTICE** : Sneakernet is a work in progress. The documentation makes some promises that are not reflected in the current state of affairs. Links to to-be-written parts of the documentation are indicated [in red](#).

    Sneakernet is a system for securely sending digital messages to other people without using the Internet. Instead, messages are automatically passed on to other Sneakernet users on your local network – at your hackerspace, an event or conference, your local cafe, etc — and then physically carried to their destination on your “sneakers”, where they will be automatically delivered to any recipients on the same network (or handed over to be carried further on by someone else).

    Sneakernet encourages slow, thoughtful participation in community and face-to-face meetings with the users who will carry your messages onwards to their destination, and entrust their own messages to you.

    ⇒ Head to [Getting started](/getting-started/) to set up Sneakernet on your device.

    Many applications can be built on top of sneakernet’s general-purpose messaging system, provided that they are tolerant of high latency and out-of-order messages. Some examples include:

    - E-Mail ([sneakermail](/apps/email/))
    - Message boards/news groups ([sneakernews](#))
    - File sharing ([sneakershare](#))
    - [And many more!](/apps/)

    Building your own sneakernet applications is easy, too, in any programming language – see [Building applications](/development/building-apps/) for more details.

    * * *

    1. All messages are authenticated and all private messages are also encrypted. People who carry your messages along cannot tamper with them and cannot read your private messages. See [Security](https://sneakernet.eu/security/) for more details.
