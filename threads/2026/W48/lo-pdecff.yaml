  text: |-
    It’s not advisable to use sneakernet to organize direct action, for example, but otherwise it’s relatively secure and private.
    It is straightforward to find out who is sending messages to whom.
    Sneakernet provides no forward secrecy. If your private key is disclosed, all of your messages, past, present, and future, can be decrypted.

    I think history has well and truly demonstrated this isn't good enough. State, corporate and individual entities will monitor and vacuum up metadata. State and individual entities will phish your keys. State, corporate and individual entities will try to crack your keys. States will take a comically oversized wrench to your kneecaps and get the keys from your device, cracked by an Israeli intelligence firm. Users will ignore your readme. It's irresponsible for dmpwn to release or encourage this, but thankfully nobody will actually use it.
