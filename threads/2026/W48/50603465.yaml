  author: hollerith
  text: I think the more important distinction is where the telnet or ftp client ran.
    Real internet access to me means that it can run on the home computer. In comtrast,
    the early way of accessing the internet from home required you to use minicom,
    TERMINAL.EXE, Telix, Procomm Plus, MacTerminal or such to log in to a Unix shell
    account running on a remote server, then invoke telnet or ftp there.<p>(Yes, I
    remember SLIP and PPP, which complicate my narrative, but my recollection was
    that those were introduced later, in 1992 or even 1993.)
