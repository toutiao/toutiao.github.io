  author: bradknowles
  text: And GNN was widely considered to be the First Nation-wide ISP for residential
    customers.  It started out as a partnership with O’Reilly &amp; Associates with
    AOL.   It grew beyond what ORA could handle, so they turned to AOL to take it
    over.  AOL wasn’t ready to do that at the time, so they made ANS take it (ANS
    was the Tier-1 backbone provider that AOL owned).  Then it got too big for ANS,
    and finally AOL had to take it anyway.  And then AOL killed it, and offered GNN
    users a free AOL account in exchange.<p>At that time, I was the Sr. Internet Mail
    Adminstrator for AOL (although our team really only handled the SMTP gateways),
    and I was assigned the job of taking over the entire GNN mail system.<p>I’ve recently
    been interested in putting together a much-delayed after action report for that
    time when the entire GNN mail system was completely hosed, due to a DEC Field
    Engineer doing an upgrade on the drive controllers.<p>For anyone who has more
    information on what you remember of that time and date, please contact me.
