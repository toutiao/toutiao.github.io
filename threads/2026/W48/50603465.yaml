  author: reaperducer
  text: "<i>ISP usually means an entity that provides people with a connection to
    the internet...</i><p>Today it means that.<p>In the 80&#x27;s and very early 90&#x27;s,
    there were hundreds of national, regional, and local computer portals.  Many of
    them offered a subset of internet features.  Some had e-mail gateways, others
    usenet, or gopher, or uucp, or some combination.  They <i>provided internet services</i>.
    \ Sometimes direct through the protocol, and sometimes behind their own user interface.<p>A
    raw pipe to the net supporting all protocols, as we expect it today, would come
    later.<p>&#x2F;Old enough to remember mapping out e-mail paths on paper, and having
    an address with a bang path."
