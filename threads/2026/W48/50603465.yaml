  author: gumby
  text: 'It&#x27;s great that it has such a lineage and is still around, but according
    to its history it was a bbs &#x2F; netnews login host.  World.std.com was providing
    internet access in 89 or 90 by log in, and of course many universities by then
    had hordes of people dialing up, logging in, and using the net;  A similar BBS-&gt;net
    hybrid was the Well.<p>Pobably The Little Garden (later TLGNet) in 1990 was the
    first ISP in the sense it&#x27;s used today: there were no user hosts that you
    logged into and then ran programs; it literally only provided IP service and you
    had to have a router to connect.<p>We gave instructions on how to make a router
    with KA9Q and and an old PC, to those who needed it.<p>Fun trivia: the first person
    who managed TLG full time (before that it was just a spinoff of Cygnus, with its
    first POP my spare bedroom) was Tom Jennings, the author of FIDONET one of the
    Ur-BBS systems, and surely the biggest.<p>There are a lot of folks from that time
    on HN.<p>PS: the name The Little Garden came from my favorite restaurant back
    then, a famous hacker hangout where folks from PARC, Stanford, SRI, Sun etc would
    hang out.  Gosper was a regular.'
