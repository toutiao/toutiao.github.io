  author: bux93
  text: At the time though, even with the clients not running locally but being dumped
    into a shell, being connected to the internet was qualitatively different from
    using a BBS. While some games (&quot;doors&quot;) on BBSes were multi-user or
    even connected to another BBS, from that shell you could telnet and gopher and
    finger other systems and they were all just expected to be online all the time.
    And distance didn&#x27;t matter, you could just go connect to a server across
    the Atlantic.<p>The BBS experience was mostly asynchronous; go online and download&#x2F;send
    mail and messages, download a file - and if it&#x27;s not locally available, request
    it. (Other networks, like X.25, were mostly only useful to access paid-for information
    services and didn&#x27;t universally connect to other countries and such. And
    confined to businesses and libraries.)<p>slip&#x2F;ppp (which in the beginning,
    you&#x27;d start up from the shell prompt) was a nice addition (telnetting from
    multiple windows for example) but for me it only became a killer app once you
    started using the web, for the graphics.<p>(In those early days, downloading popular
    stuff was best done from your BBS, which supported resumable downloads via zmodem,
    so I&#x27;d still use telemate for downloads rather than relying on the web -
    you&#x27;d often max out the 33.6kbps dial up connection that way, too.)
