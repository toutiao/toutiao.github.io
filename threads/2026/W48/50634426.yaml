  author: Chandangalani
  text: 'Virtual card services cover part of this. Privacy.com in the US, or the virtual
    cards from Ramp and Brex, let you set a per-card limit by transaction, month or
    lifetime, and lock a card to one merchant. The catch is that the card only knows
    the amount and the merchant. It can&#x27;t tell whether this particular charge
    is the one you actually meant to allow.<p>The &quot;payment key&quot; you describe
    works best as a layer between the agent and the money. Every payment request is
    checked against daily count and amount limits plus a delegated budget. Anything
    over the limit is blocked outright, not sent to you for a yes. Anything you&#x27;ve
    flagged gets a one-time approval tied to that exact amount and payee, so a &quot;yes&quot;
    can&#x27;t be reused for a different charge.<p>Disclosure: I build this at PrivateVault
    (privatevault.ai). Happy to share how we structure the limits if that&#x27;s useful.'
