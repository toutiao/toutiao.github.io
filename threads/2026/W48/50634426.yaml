  author: jessicazh
  text: 'Extraction definitely works — models are good at it. The tradeoff is that
    you pay for it on every request: tokens, latency, and accuracy that quietly drifts
    when a merchant changes layout. A normalized catalog moves that parse to ingest,
    so at checkout you&#x27;re reading a schema instead of re-deriving one, with merchant
    IDs you can key on. They&#x27;re complements in practice: LLM extraction for the
    long tail, catalog for the merchants where you need deterministic price&#x2F;availability.
    The interesting question is how many times the same SKU gets re-parsed before
    you&#x27;d rather keep a structured copy.'
