  author: harshithl1777
  text: Good question - payments come straight from the user&#x27;s own wallet so
    once sent they&#x27;re final and we have no ability to truly reverse the transaction
    by design.<p>Which is why we&#x27;ve designed it to require the user&#x27;s passkey
    for every payment by default - and the agent can only act autonomously on &#x27;trusted
    contacts&#x27; (and even these have limits). In practice these should be people
    you actually trust, such that these transactions become &quot;reversible&quot;
    because you trust them to pay you back in the event of the agent making a mistake.
