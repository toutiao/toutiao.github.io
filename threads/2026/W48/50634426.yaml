  author: harshithl1777
  text: Yes - the passkeys sync through iCloud Keychain or Google Password Manager,
    so a new phone signed into the same account still has the passkey. We also let
    you download a backup key, which works because the wallet itself isn&#x27;t on
    your phone - it&#x27;s a smart contract wallet on Base, and the passkey is just
    one of its owners. So if you ever lose the passkey too, you can use your backup
    key to swap in a new one and keep the same wallet and balance
