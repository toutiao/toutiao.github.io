  author: harshithl1777
  text: 'Thank you! We see this as just a wedge into the complete agent-first banking
    solution we want to build, not a durable moat in itself. And on that front, we
    don&#x27;t see this as something that an existing neobank can slap on to their
    existing solution: a lot of it has to be built from the ground up from first principles
    for agents.<p>We&#x27;re not just going to allow agents to do whatever humans
    can do with their bank, but actually even more - for example if I have a free
    trial renewal coming up, my agent can remind me to cancel, but it can&#x27;t actually
    cancel on my behalf without logging in to the site. Why shouldn&#x27;t it be able
    to tell my bank to decline a transaction from that merchant ahead of time? A lot
    of these decisions (like per-transaction authorization) aren&#x27;t exposed to
    humans but should be to agents - which is what requires building this for agents
    first.'
