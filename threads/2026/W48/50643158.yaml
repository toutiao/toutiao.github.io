  text: 'Are you a historian or do you have any training in history? I really do think
    interpretation is necessary. We simply cannot know exactly what happened and have
    to balance the probabilities and adjudicate as best we can. Even Herodotus made
    a big deal of pointing out this uncertainty and described multiple points of views
    and multiple stories as there was no way to have any certainty.<p>&gt;One can
    see this by asking oneself: what would do more damage to history as a field, the
    removal of all historical fact from the field, or the removal of all historical
    interpretation from the field?<p>I don&#x27;t think this is a coherent comparison.
    There is no fact independent of interpretation. What you describe at the end is
    largely the process of interpretation although there&#x27;s more to it than just
    that. For example, if you look at something like the longue durée approach of
    the annals school, its unclear that this kind of interpretation can be subsumed
    by just a collection of brute facts. The historian&#x27;s job isn&#x27;t to list
    everything that ever happened but to <i>make sense of it</i>.'
