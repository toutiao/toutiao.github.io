    and using a form of forensic analysis to establish possible connections between
    texts about which we know less than we might like. It&#x27;s important work, and
    it&#x27;s not unprecedented to be using computational tools in doing it--there
    were scholars using topic modelling and network analysis to approximate some of
    this kind of analysis. But the end it&#x27;s only nailing down one kind of precondition
    for historical analysis. The documents that get identified or reclassified through
    this work do not speak for themselves or contain self-evident meaning or significance.
