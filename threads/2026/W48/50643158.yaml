  author: suddenlybananas
  text: "&gt;It is possible to do the ascertaining of fact without doing the higher-level
    interpretation.<p>I disagree. It is very difficult to even have a sense of what
    is plausible without a degree of interpretation.<p>I think this goes even further
    if you look at premodern history. Take the Gospels. A lot of ink has been spilled
    over trying to determine what is plausibly historical in them and a lot of work
    has been spent trying to come up with good theoretical reasons to assume some
    things and not others (e.g. the criterion of embarassment).<p>This still applies
    to modern history. We need to know which sources are plausible and which ones
    aren&#x27;t, we need to know what seems like a plausible psychological motivation
    for someone like Oswald and what doesn&#x27;t. We need to know the geopolitical
    goals of the American government at the time. These are not neutral facts than
    exist independent of interpretation.<p>And again, we need interpretation to even
    know what things are worth giving a shit about.<p>What do you think interpretation
    is?"
