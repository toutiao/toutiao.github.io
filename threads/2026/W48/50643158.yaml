  author: jillesvangurp
  text: Knowledge plus reasoning quickly moves us beyond what a single human could
    know and accomplish. Most people using AI so far mainly apply it in what they
    already understand and only really ask the harder questions for things that they
    understand well enough to even be able to ask those questions. LLMs are extremely
    good at lateral thinking, connecting seemingly disconnected things, to produce
    interesting new information.<p>AIs coming up with their own questions, hypotheses,
    and then testing those systematically is the next leap forward. Most AI usage
    is reactive currently and not pro-active.<p>The article highlights that as part
    of the reasoning chain, the AI actually made some connections that are interesting
    to historians by themselves and raise new questions. Good science is as much about
    finding these new interesting things to explore as it is about resolving problems.
    What this shows is that the AI actually does this but just omits to tell us or
    follow through on them. It seems that better harnesses and prompting might remedy
    that.<p>Douglas Adams got it right in the The Hitchhiker’s Guide to the Galaxy
    when he suggested that figuring out the question is more interesting and harder
    than producing the answer of 42.
