  author: hax0ron3
  text: I am not a professional historian. However, I have been interested in history
    since my early years.<p>As I said, 100% certainty is not possible in history.
    By facts I mean evidence and logical argument that can create a range of probabilities.<p>Now,
    one might say &quot;but a range of probabilities is interpretation&quot;. But
    I do not believe that the comment you originally quoted meant this kind of interpretation
    by the word &quot;interpretation&quot;. Nor, I think, do you mean it that way.
    You mean something higher level and sweeping.<p>And it is indeed possible to,
    for example, argue that there is a 95+% chance that Oswald shot JFK, sticking
    only to evidence such as physical items and witness accounts, and using logical
    argument, without venturing into any grander historical narratives about meaning,
    or even about something as relatively higher-level as &quot;assassinations in
    general&quot;.<p>Now to me it clearly seems that this attempt to ascertain fact
    is the more vital part of history. It is possible to do the ascertaining of fact
    without doing the higher-level interpretation. It is not possible to do any interpretation
    that can properly be called history (as opposed to fiction or alternative history)
    without doing the ascertaining of fact.
