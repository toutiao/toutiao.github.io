  author: pcthrowaway
  text: There are probably texts which were lost in the destruction of Alexandria
    which can be fully rebuilt from other quotes, without needing to use any inference
    (in the older sense of the word). An example would be its complete inclusion in
    another book which analyzed the original text. Another example would be several
    surviving texts which each contain large selections of the original work, such
    that combining them would recreate the original work.<p>This seems like the low-hanging
    fruit of the challenge. This is &quot;simply&quot; a task of LLMs combing all
    of humanity&#x27;s archives to pick juicy needles out of haystacks (some of these
    surviving works may be quite obscure).<p>Next we have situations where perhaps
    50% of a lost text can be reproduced via the above method, and an idea of what
    the remaining 50% can be obtained through analysis of contemporaneous texts which
    reference the original (without quoting it, or perhaps by paraphrasing, or giving
    a nod to), as well as a historical review of the life of the lost text&#x27;s
    author (including the point in their life in which they wrote the lost work, and
    perhaps surviving lost works by them which came after) and their contemporaries.<p>In
    these situations, an approximation of what they might have written can be constructed,
    which IMO would be quite valuable. Perhaps each section which is filled in by
    an LLM could have notes containing supporting citations, assumptions which were
    made, and reasoning for those assumptions.<p>I&#x27;d love to see this put to
    the test by taking a work for which 50% of its text could be reconstructed from
    other works which cite it, then training a model on a corpus which is completely
    absent of the 50% which &quot;would be lost&quot; if constructed from the referencing
    works alone, then ask the model to generate the original text to the best of its
    abilities, including research capabilities (but with a classifier sitting between
    the model and any research results which would prevent it from &quot;cheating&quot;
    accidentally or otherwise)<p>The work generated from such an attempt at restoration
    could then be compared to the complete original work to explore the hypothesis.
    It actually reminds me a lot of the process through which some older paintings
    have been restored, when the original is incomplete.
  score: 0
