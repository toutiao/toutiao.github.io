  author: reexpressionist
  text: 'I think the most important punchline for neural networks (including language
    models) when it comes to uncertainty is the combination of the following two points.<p>First,
    the output logits of neural networks provide very poor signals of the epistemic
    (reducible) uncertainty. In other words, the output logits are a highly lossy
    compression of the epistemic uncertainty. That&#x27;s bad, because the very type
    of uncertainty you would hope to have a good handle over is obscured. With neural
    networks, we&#x27;re typically dealing with high-dimensional inputs and outputs,
    for which it can be difficult for a human to detect covariate shifts relative
    to the given model, and by extension to anticipate when the model will go-off-the-rails.<p>Second,
    neural networks can nonetheless provide relatively robust estimates of the epistemic
    uncertainty, but to do so, we can&#x27;t rely on the output logits alone. Instead
    we need to view neural networks as hidden instance-based metric learners, and
    derive signals of the uncertainty via dense matching into the support set of the
    estimators. Similar to how RAG uses dense matching in semantic representation
    space for retrieval, we can use dense matching in feature representation space
    to model uncertainty. In other words, we can model the geometry of the feature
    representation space against the support set, and use that to construct robust
    estimates of the predictive uncertainty.<p>The following provides a concrete implementation,
    and a particular estimator (here, to estimate regions of the distribution for
    which the class- and prediction-conditional accuracy is at least some value alpha,
    near 1):<p>Similarity-Distance-Magnitude Activations. In Findings of the Association
    for Computational Linguistics: ACL 2026, pages 22037–22057, San Diego, California,
    United States. Association for Computational Linguistics.'
