  text: I like that you make an actual argument.<p>&gt; As long as these are positive
    sum games we&#x27;re talking about, that&#x27;s a win.<p>That&#x27;s very noble,
    but there is a point where the sum hardly matters to the individual. I think this
    is pretty standard liberal philosophy, so it shouldn&#x27;t really be controversial
    on HackerNews. If we imagine a war against an authoritarian dictator. I think
    we would agree that winning such a war would be &quot;positive sum&quot;. The
    world is, as a whole, better off without said dictator. Now imagine you are a
    soldier of said war, in the trenches, shooting at his soldiers. Above you, a drone
    with an explosive. At that moment, I would argue that the &quot;positive sum&quot;
    of the entire operation becomes meaningless to you. No matter how good, or bad,
    the war itself is, you will be dead in a second. The personal negative value is
    so high that the positive sum is meaningless.<p>We&#x27;re obviously not talking
    anything quite that extreme here. Claude isn&#x27;t bombing anywhere in the west,
    yet, but it highlights that &quot;positive sum&quot; can&#x27;t be a final argument
    for these sorts of considerations. There has to be a considerations for the &quot;distribution&quot;
    of cost as well.<p>From the structure and tone of your argument, I take it that
    you&#x27;re currently not in a place where doing this unpaid labor is harmful
    to your survival. That&#x27;s a great place to be, and in my mind how everybody
    should live. Please reflect on how that may not be the case for everybody, and
    how that may one day also not be the case for you.
