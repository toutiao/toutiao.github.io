  author: carlosjobim
  text: Because real life is not a computer program following computer rules. It all
    comes to if something is reasonable or not, and courts are made up of real humans
    who can reason. And most important is if the other party suffered damages.<p>If
    somebody is evicted because of a mistake, they most certainly suffered damages.<p>If
    somebody receives $10 000 and then that $10 000 is withdrawn, they most certainly
    didn&#x27;t suffer damages.<p>Mistakes happen all the time, and usually they are
    solved. Even the law says that if a quoted price is obviously a mistake, it can
    be corrected.<p>It&#x27;s a major misunderstanding among common people that there
    are easy loopholes in contracts and business dealings that can be exploited with
    the protection of the law. In practice it doesn&#x27;t work that way.
