  author: firesteelrain
  text: There is more to this story. I went to the North Carolina Public Records portal.
    If I understand how their cases work, then there were seven independent eviction
    cases due to non payment of rent. Every one was eventually resolved when Laura
    Mack paid just prior to eviction. The one in question had a motion to stay by
    her on November 19th and it was denied by the District Judge. The denial cited
    lack of evidence. Each time the case was brought to court, she would have been
    able to represent herself. AI angle seems a bit of a loophole workaround that
    she tried this time. She probably figured if she emailed and the AI assistant
    said she can wait to the 30th of Nov then she might have gotten away with paying
    late again. Based on her history I suspect this would have continued over and
    over again.<p>If you look at the the rest of her case history, you can see that
    she has a lot of financial problems and judgements.<p>That is to say that the
    main theme that probably interests HN readers is lack of guardrails on the AI
    Assistant known as Olivia.<p>We use AI assistants with our HOA portal but it doesn’t
    have approval authority. It can help explain things or even ask the Board or management
    company a question on behalf of a member. But it doesn’t speak for the Board.
    So if what Ms Mack is saying is true then they need to put better guardrails on
    their AI assistant
