  author: program_whiz
  text: Part of the reason people say this in the US is that we have a society with
    a particular low-trust ethos.  The US economy largely centers around exploiting
    others to the maximum extent allowed by law.  Landlords and others, if they knew
    they could do so, might use AI to exploit their tenants.<p>Often, US people propose
    making things crimes because its the only deterrent that is effective.  Fines
    are often small and&#x2F;or hard to claim (putting onus on filing lawsuits on
    people already victimized).  Rules of thumb and social standards have no effect
    in our society anymore, we killed that off in the late 1900s.  The effect of living
    in a dog-eat-dog society with little social trust is that we must delegate enforcement
    of every activity to a strong enforcement arm of the government.<p>It can be hard
    to understand for outsiders, but after being screwed over and deceived by society,
    landlords, and businesses long enough, it becomes reflexive to say &quot;toss
    them in prison!&quot;.<p>In our society, your only two recourses for anything
    are law suits and prison.  Saying &quot;don&#x27;t put them in jail&quot; is saying
    &quot;after being deceived and evicted by a potentially hostile landlord, the
    person evicted should have the funds and possibly multiple years to file a lawsuit
    so she can resume renting her place.&quot;<p>The only deterrent that stops behavior
    from happening in the first place is one that has immediate negative consequences
    for the perpetrator. Lawsuits are definitely not that (which leaves only prison
    &#x2F; jail).
