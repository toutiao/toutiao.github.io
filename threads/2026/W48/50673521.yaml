  author: Ekaros
  text: I doubt there is any way to disclaim liability from your employees as long
    as it seems reasonable. To allow such thing would destroy pretty much everything.
    Doesn&#x27;t mean clearly wrong things would stay. But anything that court might
    reasonably see negotiated will stick, whatever is written in contract.<p>And I
    doubt you can have clause that stop changes. Or that such wouldn&#x27;t be automatically
    overridden when an employee states change to be allowable.<p>These are kind of
    fundamental things about having contracts in first place. They can be mutually
    changed whatever is said in them. And representatives can have impact on them
    to certain degree. Even if that degree is not outright defined anywhere or isn&#x27;t
    seem unreasonable on either side.
