  text: I have been planning to write a similar blog post for a while! Interesting
    to see I am not the only one.<p>I currently have several thousand bugs that I
    am hoarding for about a year while trying to find a 0-click RCE chain. I have
    a few interesting bugs already. I am still waiting a bit to see if I might get
    a little bit further, but I ultimately plan to sell the bugs to Crowdfense or
    a similar company. (Everyone, feel free to reach out to me with requests.)<p>I
    think simply publishing anything that can&#x27;t be sold and getting some attention
    &#x2F; recognition on your blog is a better approach. It also lets GrapheneOS
    and others who care fix the issues before Google does. That&#x27;s what I will
    do soon. I have a few bugs that will get a lot of attention, but I now know from
    experience that Google will ghost me for months, only to then just close them
    as duplicates and give me zero recognition.<p>Currently, from my experience, Google
    needs the following for Android:<p>- multiple weeks&#x2F;months to properly reply
    to bug reports<p>- multiple weeks&#x2F;months to assess if it&#x27;s a duplicate<p>-
    multiple months to fix a bug<p>- multiple months to release a security patch<p>-
    multiple months to release source code in general<p>The outcome is that, from
    my experience, 0-click RCEs currently take around 4–6 months from reporting to
    getting fixed in security previews. There can then be another 2–6 months before
    public disclosure. Using those figures, severe bugs can take around 6–12 months
    before the fixes show up in source code. Google has also delayed source code for
    major Android releases by months. That&#x27;s based on the current state of affairs.<p>The
    main problem here is that, due to their delays, it&#x27;s not possible for anyone
    to work with them anymore. Six months is way too much time. We are cannibalising
    each other in the current Android VRP. I am pretty sure 90%+ of reports are duplicates,
    maybe even 99%+ currently (not counting ineligible ones).<p>Google could fix this
    so easily by simply employing 20–50 engineers to work on this. But they don&#x27;t
    care enough about Android&#x27;s security. It&#x27;s hard to understand how a
    trillion-dollar company can&#x27;t pay a few more salaries to keep their most-used
    OS safe.
