  content: "I'm an independent security researcher. Over the years I've reported vulnerabilities
    to a number of vendors and manufacturers, and several of those reports have become
    CVEs.\n\nFor most of the past year I've been working on Google's current Pixel
    phones. I reverse engineered the Samsung radio stack (under embargo), the IMS
    and RTP media code, the Trusty trusted apps, the MediaTek M90 modem RIL and the
    Android telephony framework, amongst other things. In that time I filed 95 reports
    through the Android and Google Devices Vulnerability Reward Program (VRP), and
    around 95% of them came with a working proof of concept.\n\nIn total, the VRP
    has paid me $250, in a single payment.\n\nI should say at the outset that I have
    nothing against Google. My project Box began as a fork of their AI Edge Gallery;
    I've worked on it most days for a year, and Google have taken features from my
    fork back into their own. I also maintain Iris, a hardened fork of Chromium. Much
    of what I do is built on Google's work. This page is solely about what happened
    to the security bugs I reported through their programme over twelve months.\n\nThree
    things kept happening.\n\nBugs were fixed after being closed. For every closed
    report, I extracted the relevant binary from Google's current factory image and
    compared the exact function the report referred to. Eight had been fixed in shipped
    code, with a bounds check, a permission or a validation step added precisely where
    I'd said one was missing. All eight had originally been closed as a \"duplicate\"
    or as \"not a vulnerability\". None was paid and none was credited. Two more have
    since been fixed in the QPR3 beta.\n\nBugs were closed for reasons the code doesn't
    bear out. More than a dozen others were closed as duplicate, infeasible or \"can't
    reproduce\", yet the defect is still there, unchanged, in the current build. I'm
    not suggesting anyone owes a reward for a bug that hasn't been fixed, and I'm
    not claiming one. My point is simply that the stated reasons for closing them
    don't hold up once you look at the binary.\n\nA reward promised in writing has
    never been paid. In January Google confirmed a valid bug and raised both its severity
    and its reward, in writing. Three months later they reversed all of it, with no
    new evidence. They then said they would \"stand by our word\" and pay $250 anyway
    as a \"discretionary payment exception\". That was in January. Ten months of \"processing\",
    \"soon\" and \"no date\" later, it still hasn't been paid. The report itself was
    submitted before December 2025.\n\nOne line in that thread still puzzles me. Google
    told me in writing that they were paying the Safety Center reward \"even though
    our final technical assessment rated it as a duplicate of a report with no security
    impact.\" If the bug had no security impact, there is nothing to pay for. If it's
    worth paying for, then it did have an impact. Both statements are in the same
    ticket.\n\n## Where things stand\n\n- $250 Safety Center reward (Moderate). Approved
    in writing in January and confirmed in writing several times since. Ten months
    on it remains unpaid, and the ticket has been closed.\n\n- Two High severity reports,
    still \"Assigned\". Google formally rated both as High. Neither has a reward decision
    or a CVE yet. One of them has already been fixed in shipped code three times:
    in the QPR3 beta (DP11.261002.005) in October, in the public November stable release
    (CP4A.261105.040.D1, rolled out to all Pixels on 10 November 2026), and again
    in the latest QPR3 beta (DP11.261030.003, released on 12 November 2026). The ticket
    is still \"Assigned\" and the reward field is still empty.\n\n- One Moderate report,
    still \"Assigned\". Rated Moderate on 28 October. No reward decision.\n\n- Ten
    findings fixed after being closed. Each was closed as a duplicate, infeasible
    or not a vulnerability, and later fixed in shipped code. No reward and no credit
    for any of them.\n\n- Total received: $250.\n\nEverything in the tables below
    is a closed report, and Google's wording is quoted directly from the issue tracker.
    I've deliberately left out the technical details of the three reports that are
    still \"Assigned\", along with anything under active coordinated disclosure.\n\nEvery
    report on this page is a closed ticket. Google's own position, stated on these
    tickets, is that they do not grant or deny permission for disclosure and that
    researchers are free to publish at their discretion. Nothing still under assessment
    or active coordinated disclosure is included here.\n\n## How I checked\n\nI followed
    the same process for every closed report in the tables:\n\n- Extract the exact
    binary, library or jar named in the report from Google's current factory image
    (rango and yogi Pixel builds, September and October 2026).\n\n- Unpack it with
    the appropriate tool for the container: debugfs for ext4, fsck.erofs for EROFS,
    and a second pass through apex_payload.img for APEX modules.\n\n- Locate the function
    the report cited, using symbols where they survive and, where they don't, matching
    byte patterns from the disassembly quoted in the report.\n\n- Compare the shipped
    code against what the report described as vulnerable, using the NDK's llvm-objdump.
    The system binutils has no AArch64 backend and returns nothing without raising
    an error, which is worth knowing before you trust an empty diff.\n\nEach report
    was given one of four verdicts: PATCHED (a check has been added that wasn't there
    when I reported it), STILL PRESENT (the code is unchanged), N/A (reported against
    this exact build, or Google described it as intended design) and CANT-DETERMINE
    (the binary is missing or the build doesn't match).\n\nI didn't rely on Google's
    security bulletins or the supplementary patch lists. A silent fix with no bulletin
    entry and no credit won't appear there by definition, so the only way to find
    one is to compare the shipped code yourself.\n\n## The reward promised in writing
    that was never paid\n\nThis concerns ticket 467575499 / 470814942. On 23 January
    2026 Google wrote that they had \"confirmed this is a valid bug\", were \"increasing
    severity\" and \"increasing reward\", and would \"issue a payment for the new
    amount once it has been processed\". On 24 April, without any further analysis,
    they reversed all three. In what they called a \"Final Assessment\", the same
    bug now \"does not qualify for a reward or severity increase\".\n\nIn June they
    wrote that they wished to \"stand by our word regarding the reward\". On 10 July
    they set out the figures: \"$250 for Safety Center, $250 for the mic bug, $500USD
    total\". They described this as \"honoring our initial promise\", whilst still
    referring to the Safety Center half as a duplicate with no security impact. The
    microphone half was paid. The Safety Center half was moved into a \"discretionary
    payment exception\" with, in their words, no \"exact credit date\". The most recent
    reply, in October, says much the same: still approved, still no date.\n\nFigure
    1. 23 January 2026: \"confirmed this is a valid bug\", severity and reward both
    increased, and \"we will issue a payment for the new amount once it has been processed\".\n\nFigure
    2. 24 April 2026: all three reversed without further analysis. The same report
    now \"does not qualify for a reward or a severity increase\", under the heading
    \"Final Assessment\".\n\nFigure 3. 9 July 2026: Google agree to pay regardless,
    \"even though our final technical assessment rated it as a duplicate of a report
    with no security impact\".\n\nFigure 4. 10 July 2026: the figures in writing,
    $250 + $250, $500 in total. The Safety Center half is placed into a \"discretionary
    payment exception\" with no \"exact credit date\". The sidebar shows ASR Payment
    250.\n\nFigure 5. 31 October 2026: still no date and no Bugcrowd reference, although
    \"your $250 reward is fully approved\". The same message adds: \"We also respect
    your right to publish a public write-up about your findings and your experience.\"\n\n##
    Rated High by Google, fixed in shipped code, reward still blank\n\nNot every report
    ended as a duplicate or \"not a vulnerability\". In "
