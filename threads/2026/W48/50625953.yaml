  author: bordercontrol
  text: I know my craft. I keep a catalogue of bugs mined from diffing security previews
    of GrapheneOS, which releases within days, basically. That&#x27;s how I always
    get the latest critical bugs. Then, at some point, sooner or later, there will
    be various places where those bugs will show up tied to a report ID (commits of
    patches, for example). The report IDs get assigned when a bug gets filed. The
    same consecutive IDs are used for security-relevant bugs and non-security-relevant
    ones and show up in various places tied to dates. You can then derive the date
    very precisely. Basically, some sort of tree-ring dating for Google report IDs.<p>So,
    by this approach, we know the filing date + security release date.<p>It&#x27;s
    4–6 months, based on calculations of a few severe bugs. I did this calculation
    3–4 months ago.
