    lots of hype around teams getting laid off, and that the illusion is that any
    monkey with enough compute can crack any package, but we don&#x27;t know <i>really</i>
    whether or not that&#x27;s going to tip in the attackers&#x27; favor.<p>If <i>anyone</i>
    can throw compute at vulnerabilities and <i>anyone</i> is either a corporation
    that can throw $100k in compute because they decimated the security department
    and even spending $100k on compute for the one remaining engineer is &quot;a savings&quot;
    or a random collection of attackers that scrabble together $100k in compute between
    them without collaborating, then the security team should win because a thousand
    $100 attempts is not likely to scale against $100k of concentrated compute using
    the same (actually likely better given that mythos et al aren&#x27;t available
    to the randoms) tools.<p>If &#x27;26 and&#x2F;or &#x27;27 crime reports come out
    to be wildly higher&#x2F;more impactful then the typical increasing pace we&#x27;re
    currently seeing, then sure, the balance is cooked.<p>But, look at the numbers
    [0] and you&#x27;ll see that the increase in assets lost is relatively flat (quite
    erratic, but less gain than previous years in record) and that the increase in
    number of claims, while high in &#x27;25, is still within the range of the record.
    (less than either &#x27;18 or &#x27;19)<p>If these tools were having a major impact,
    because we&#x27;d see major jumps in these numbers. Perhaps &#x27;26 is the year
    that the tools did really become truly impactful for cybercriminals, but perhaps
    the utility has been shared across all colors of hats equally and we&#x27;ll see
    a bump that is within range of bumps we&#x27;ve already seen of up to ~64% increase
    in costs pre-chatgpt.<p>[0]<a href="https:&#x2F;&#x2F;imgur.com&#x2F;a&#x2F;dcOqG4N"
    rel="nofollow">https:&#x2F;&#x2F;imgur.com&#x2F;a&#x2F;dcOqG4N</a><p>edit: The
    FBI&#x27;s own report makes the scaling even more clear. Prices definitely spiked
    pre-gpt, and reports seem to scale quite linearly so far <a href="https:&#x2F;&#x2F;www.ic3.gov&#x2F;AnnualReport&#x2F;Reports&#x2F;2025_IC3Report.pdf"
    rel="nofollow">https:&#x2F;&#x2F;www.ic3.gov&#x2F;AnnualReport&#x2F;Reports&#x2F;2025_IC3Report.pdf</a>
    and <a href="https:&#x2F;&#x2F;ic3.gov&#x2F;AnnualReport&#x2F;Reports&#x2F;" rel="nofollow">https:&#x2F;&#x2F;ic3.gov&#x2F;AnnualReport&#x2F;Reports&#x2F;</a>'
