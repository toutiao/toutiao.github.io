    But there are already more than hundreds of thousands working in fraud&#x2F;scams&#x2F;hacking.<p>In the US, the FBI&#x27;s recieved more reports YoY every year since &#x27;18 except for a dip in &#x27;22 only for &#x27;23 to again return to beating &#x27;21. Complaints of cyber crimes have nearly trippled in the US (from ~350k to &gt;1m reports) in that time frame, with the 24&#x2F;25 jump being the largest in terms of reported financial losses.<p>The UN estimates that more than 300k people are &quot;trapped in scam compounds&quot; (being forced to or having no better option than to engage in fraud) across SEA alone, and similar compound infrastructers have been documented across five continents with new hubs emerging.<p>Malware devs are estimated in the thousands, and there are estimated to be ten vendors to every dev.<p>Low skill phishers are estimated anywhere between 100k and 1m globally.<p>And that&#x27;s just on the &#x27;technical&#x27; side. How many are engaged in vote&#x2F;view botting, astro-turfing, shilling, propoganda, etc?<p>If these new tools are worthwile for legitimate devs, webdevs, graphic designers, call-centers, etc, then they are certainly worthwhile for illegitimate actors in the same space.<p>The reality we already live in puts cybercrime losses at a minimum of $1,300,000,000,000 in direct financial theft (money succesfully captured by cyber criminals) and closer to $10,000,000,000,000 in general losses (money lost in downtime, litigation, customer churn, defensive IT, etc). That&#x27;s globally, annually.
