  author: ba1afd89f34cb23
  text: I&#x27;m not being snarky, but if you have to ask, you probably aren&#x27;t
    qualified to run it securely. You can run it, but it&#x27;ll be vulnerable because
    you&#x27;ll not implement some best practices that&#x27;ll bite you.<p>Anyway,
    it&#x27;s quite rare that control or management plane attacks can be carried out
    just via the data plane. Meaning, it&#x27;s rare you can get onto a security appliance
    by passing traffic through it. Routing a packet a through a router shouldn&#x27;t
    let you exploit a vulnerability on the router itself. Therefore, the best defense
    is to make sure the management planes of the routers and firewalls are not Internet
    accessible, and that the control planes are as locked down as possible (difficult
    with devices that terminate VPN tunnels from dynamic sources, and to some degree
    with WAN BGP peering).<p>A Check Point security server probably shouldn&#x27;t
    have its login page available on the Internet, though I haven&#x27;t worked with
    that platform much. I guess if you want dynamic endpoints, like branch offices,
    to connect to it for management that could make sense, but I find that icky and
    would strongly prefer some sort of overlay network solution managed in-house or
    managed by some service provider to lock that down a lot rather than just make
    the box public.
  score: 0
