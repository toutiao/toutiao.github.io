    # Download Grafana

    ## 1. Choose an edition

    ## 2. Choose a version

    EditionGrafana Enterprise

    Version13.3.2

    License[Grafana Labs License](https://grafana.com/legal/grafana-labs-license/)

    Release DateNovember 24, 2026

    ## 3. Choose your platform & installation method

    ### Ubuntu and Debian
    (64 Bit)SHA256: 7d7faba5e05e1605dc804be6e9be65644844bdc16d211497bbbf19c002c72f96

        sudo apt-get install -y adduser libfontconfig1 musl
        wget https://dl.grafana.com/grafana-enterprise/release/13.3.2/grafana-enterprise_13.3.2_44555861735_linux_amd64.deb
        sudo dpkg -i grafana-enterprise_13.3.2_44555861735_linux_amd64.deb

    Read the [Ubuntu / Debian installation guide](https://grafana.com/docs/grafana/latest/installation/debian/#2-start-the-server). We also provide an [APT repository](https://grafana.com/docs/grafana/latest/installation/debian/#install-from-apt-repository).

    ### Standalone Linux Binaries
    (64 Bit)SHA256: 985f731bd65b896ba2f10c4a5fee46e2d4fe0dfb9118a6ada67aab6b46711fee

        wget https://dl.grafana.com/grafana-enterprise/release/13.3.2/grafana-enterprise_13.3.2_44555861735_linux_amd64.tar.gz
        tar -zxvf grafana-enterprise_13.3.2_44555861735_linux_amd64.tar.gz

    ### Red Hat, CentOS, RHEL, and Fedora
    (64 Bit)SHA256: 0596094cf469ddc5bd14dc5f2af1d65cb52a2f57462073983975b03e10d8b93c

        sudo yum install -y https://dl.grafana.com/grafana-enterprise/release/13.3.2/grafana-enterprise_13.3.2_44555861735_linux_amd64.rpm

    Read the [Red Hat and Fedora installation guide](https://grafana.com/docs/grafana/latest/installation/). We also provide a [YUM repository](https://grafana.com/docs/grafana/latest/installation/).

    ### OpenSUSE and SUSE
    (64 Bit)SHA256: 0596094cf469ddc5bd14dc5f2af1d65cb52a2f57462073983975b03e10d8b93c

        wget https://dl.grafana.com/grafana-enterprise/release/13.3.2/grafana-enterprise_13.3.2_44555861735_linux_amd64.rpm
        sudo rpm -Uvh grafana-enterprise_13.3.2_44555861735_linux_amd64.rpm

    Read the [OpenSUSE and SUSE installation guide](https://grafana.com/docs/grafana/latest/installation/). We also provide a [YUM / zypper repository](https://grafana.com/docs/grafana/latest/installation/).

    ## Choose your Configuration Options

    The Grafana backend has a number of [configuration options](/docs/installation/configuration/) defined in its config file (usually located at `/etc/grafana/grafana.ini` on Linux systems).

    In this config file you can change things like the default admin password, HTTP port, Grafana database (SQLite, MySQL, Postgres), authentication options (Google, GitHub, LDAP, auth proxy) along with many other options.

    Start your Grafana server. Login with your admin user (default admin/admin). Open the side menu (click the Grafana icon in the top menu), head to Data Sources, and add your data source.

