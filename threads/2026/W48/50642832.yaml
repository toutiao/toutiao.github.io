  text: It feels like we&#x27;ve run this playbook before though.  Affordable COTS
    and open-source products that solve major webdev problems (Wordpress, Magento,
    etc.).  Cheap body-shop outsourcing.  Rapid application development tooling.  Hell,
    even IDEs.<p>It hits the ground with some big splashy wins.  The top of the organization
    immediately recalibrates and figures they should get 20x the software throughput
    for the same devs and money.<p>Reality comes back-- the Big Migration costs 5x
    as much and takes 10x as long as originally promised-- and gradually they put
    their tail between their legs and realize they still need competent developers
    delivering within their limits.<p>For the current hype cycle, we have an interesting
    X-factor.  We&#x27;re now in a huge enshittification phase across basically the
    entire economy.  Businesses that would have been deeply scarred by delivering
    garbage 20 years ago are now making it a way of life.  If they&#x27;re willing
    to forgive poor quality until it makes a more discerable impact on their bottom
    line, the whip-back might take a little longer.<p>While I&#x27;m a fairly strong
    AI doomer, I think that part of it is needing the existing bubble to pop, so we
    can retrench and focus on making better tools, rather than just throwing more
    and more compute at the current paradigms.<p>In particular, I LOATHE the conversational
    UI as default-- it makes me think of early 1980s software, where everything was
    a clunky command line with huge footguns attached because a mouse was a $175 addon
    and modern UI conventions had yet to be adopted.  Except even worse, because it&#x27;s
    tolerant enough of vague language and changing frequently enough that you can&#x27;t
    get ahead of where the pitfalls and optimal strategies are.<p>I&#x27;d love to
    see more tooling that &quot;inlined&quot; the robot into already-developed non-AI
    workflows rather than having to go into &quot;Special Teams mode&quot;, clear
    everyone off the field, and bring out a completely different skill set, then switch
    back when you get to something where it&#x27;s still easier to express what you
    want with code than a prompt.<p>In retrospect, the &quot;spicy autocomplete&quot;
    of early Gitlab Copilot and Cursor was a great fit for some coding styles&#x2F;use
    cases.
