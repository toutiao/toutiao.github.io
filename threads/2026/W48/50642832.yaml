  author: garethsprice
  text: LLMs are great because you can use them to quickly find specific citations
    about things like how even Karl Marx thought that the idea of a &quot;guild craftsman&quot;
    was a temporary dead-end where mechanization could and should be used to free
    up enormous amounts of time for society.<p>Workers with craft knowledge are expensive
    and hard to manage as anyone who has ever managed a dev team knows, so capital
    always pushes to turn the craftsperson&#x27;s knowledge into an ownable commodity.
    ~25 years of Stack Overflow and GitHub repos being sucked into a machine that
    its owners can rent back to developers is about as literal an embodiment of this
    as can be imagined.<p>The good news is that craft doesn&#x27;t die, it just moves
    to the next frontier. Each technological paradigm creates an early period where
    work can&#x27;t easily be broken down so craftspeople are paid well, until such
    time the market grows or capital catches up. But that time will always come; no
    matter how beautiful your illuminated manuscripts were, you&#x27;d better learn
    to set lead type if you want to get paid next year.<p>The frontier has moved from
    knowing how to center a div in all of this season&#x27;s browsers to agent orchestration,
    bot integration, creating context pipelines and data warehouses, the safe authentication
    of fleets of agents so they can execute safely and quickly, evaluating how well
    they work, and recursively improving them based on their outputs.<p>I am having
    a fine time meeting with customers and showing them how exciting it is to be able
    to automate so much of their routine work now. It reminds me of the early days
    of web work where there are not clear patterns yet so it is all bespoke problem-solving
    and the Cambrian explosion of wild ideas. Guessing this period will last about
    6 months.
