  author: MattDamonSpace
  text: "1) if you need genuine determinism, you can write a standard program much
    much faster with LLMs than without. I do this often, as deterministic outputs
    are still useful in many contexts\n2) LLMs are fantastic at handling non-deterministic
    <i>inputs</i>… their inherent “fuzziness” is incredible at messy ingestion, a
    strength in many contexts \n3) for many uses of software you don’t actually need
    deterministic outputs, you need <i>verifiable</i> outputs. Robust test suites
    largely negate the immediate needs for code quality. Longer term maintenance costs
    for slopped-up vibe-coded codebases are still TBD but I’m leaning towards “the
    models and the industry will learn”"
