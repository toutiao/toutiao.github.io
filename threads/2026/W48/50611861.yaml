  text: Thanks! The LLM-generated NPC comments were the original motivation, but the
    save sync has actually got me using my SNES more.<p>The initial prototype used
    a Raspberry Pi Pico 2 W dev board, as the RP2350 on it can handle the 5V logic
    of the SNES without level shifting. It also maintains the link using hardware
    PIO, with a separate wi-fi coprocessor so it can&#x27;t interfere. When I designed
    the PCB, I kept the proven design, so the RP2350 for the link and swapping in
    the ESP32-C3 as the wi-fi coprocessor. A single ESP32-S3 would&#x27;ve needed
    level shifters and likely some careful timing, so I&#x27;d have had to rebuild
    and prove a new prototype for that first.
