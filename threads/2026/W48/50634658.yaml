  author: aabhay
  text: Code is not a 1-dimensional skill. The models do extremely well at writing
    code that fits into a single file, roughly up to 5000 lines. Beyond that, even
    the best models have significant failure modes such as duplicate implementations,
    low code reuse, abstraction anti patterns (e.g. checking the db for the same consistency
    condition before, inside, and after a function), etc.<p>And left to their own
    devices, the code they write might be utterly unreadable and unmaintainable. I’ve
    seen e.g. a model write a shell script that invokes python with bash vars that
    itself generates a kubernetes yaml config that itself contains shell scripted
    python. All while giving a “The task is complete” success message.
  score: 0
