  author: elhospitaler
  text: I did my PhD at the Baker lab, haven&#x27;t had the time to properly read
    this over but some initial thoughts:<p>Makes total sense that they&#x27;d be working
    on this, it&#x27;s something we discussed in the lab as well as the likely future
    of this work - true integration of the language modeling capabilities with proteins,
    natively multimodal like it&#x27;s done with images. Five years ago we laughed
    at people with galaxy brained ideas to train &#x2F; fuse a protein and natural
    language model, advertising this idea of &quot;give me a natural language request
    and the model spits out the sequence that does the thing&quot;. There are many
    objections - the annotated data is not there, trying to pose everything as a language
    modeling objective sounded really naive at the time, and there are lots of tasks
    that are structural&#x2F;chemical in nature that require inference based on physical
    and chemical principles, which interpolating machine learning models shouldn&#x27;t
    be able to do. Most of these objections still exist, but now we aren&#x27;t laughing.
    I do think eventually these models will get there.<p>That said, this work of course
    advertises far more than it accomplishes&#x2F;has some things that have me holding
    judgement. One is I don&#x27;t see how they did train-test splitting, or if they
    attempted this at all. This is really important - for some of these tasks, they
    are comparing against &quot;specialized models&quot; that did pretty rigorous
    holdout evaluation.<p>Also binder design is basically the easiest task, super
    solved a million times in the past few years, and their designs just made helical
    bundles, I don&#x27;t think this is particularly impressive in terms of pushing
    the frontier. There is a hierarchy of difficult problems in protein design and
    this is just really easy, especially because experimentally these helical bundles
    bind really well and make strong interfaces.<p>The antibody CDR design tasks are
    also probably fairly trivial? I&#x27;m not sure, I&#x27;m not deep into antibody
    dev&#x2F;design but there are lots of structures and sequences of anti-pdl-1 antibodies,
    so again a case of train-test split. I&#x27;d be curious to see sequence homology
    to these published antibodies.<p>But yeah, my take is that at the object level,
    this work is not super impressive. At one level of remove, the fact that they
    are getting an LLM to do these tasks that are normally done by specialized protein
    language or structure models is impressive. And then at one more level of remove,
    it&#x27;s a big gauntlet thrown, proof that they are pursuing this line of research.
    I wouldn&#x27;t be surprised if it works much better, soon, with the pace of these
    things. And we know Anthropic is working on this as well - <a href="https:&#x2F;&#x2F;xinmingtu.cn&#x2F;blog&#x2F;2026&#x2F;claude-opus-5-5-protein-sequences&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;xinmingtu.cn&#x2F;blog&#x2F;2026&#x2F;claude-opus-5-5-protein-seque...</a>.<p>Might
    have to find a new line of work soon lol, thought I had at least another 5 years
    left.
  score: 0
