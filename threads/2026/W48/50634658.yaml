article:
  url: https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/
  title: GPT-6 models demonstrate intrinsic protein-design capabilities | OpenAI
  fetch_status: success
  content: "OpenAI\n\nNovember 24, 2026\n\nScience[Publication](/research/index/publication/)\n\n#
    GPT‑6 models demonstrate intrinsic protein-design capabilities\n\n[Read the paper(opens
    in a new window)](https://cdn.openai.com/pdf/gpt-6-a-universal-foundation-model-for-protein-biology.pdf)\n\n##
    Key findings:\n\n- Our GPT‑6 family of models can design new protein shapes and
    the sequence of their chemical building blocks using only reasoning and code,
    without calling specialized biology models to generate those designs.\n\n- An
    internal research model matched or outperformed specialized models on many protein
    design tasks. Researchers could also guide designs by prompting the model on where
    a protein should attach and what shape it should take.\n\n- In lab tests with
    Onava, proteins based on GPT‑6.2’s designs showed evidence of binding, or attachment,
    across five targets. Redesigned antibodies also retained binding. Specialized
    models helped supply sequences and select candidates for testing.\n\n- The models’
    written reasoning and code suggest they draw on math, physics, chemistry, and
    biological knowledge to reason about protein shapes and interactions with other
    molecules.\n\nIn a preprint titled _GPT‑6 as a Universal Foundation Model for
    Protein Biology: Beyond Specialized Models_, we show that our GPT‑6 family of
    models has **intrinsic capabilities** for designing new proteins: the models can
    design new protein structures and sequences without relying on specialized biology
    models, using only reasoning and general-purpose coding tools.\n\nProteins do
    much of the work in living cells. They drive the chemical reactions that sustain
    life, carry oxygen through the blood, and defend the body against infection. Incorrectly
    shaped proteins can also cause disease and dysfunction. Proteins are made from
    chains of chemical building blocks called amino acids. The order, or sequence,
    of these amino acids helps determine how a protein folds into a three-dimensional
    shape, which in turn influences what it does.\n\nScientists often start with a
    clear idea of what they want a protein to do. They might want it to block a signal
    that helps cancer cells evade the immune system or to help capture carbon dioxide
    from the air. The challenge is to work out what three-dimensional structure would
    enable the protein to do its job and which amino acid sequence would give it that
    structure. Specialized biology models capable of generating three-dimensional
    protein structures and sequences have made this work more practical.\n\nUsing
    and coordinating these specialized models requires substantial expertise. Each
    accepts particular kinds of inputs and constraints, and these models cannot easily
    accept new kinds of information without changes to their software or additional
    training. In contrast, a general-purpose model capable of performing the work
    of multiple specialized models can easily adapt to new instructions and requirements.\n\nOur
    research illustrates the potential power of pairing natural language with intrinsic
    protein capabilities. We could guide our models at scales ranging from a single
    bond between two atoms to the overall shape of a protein. For example, we asked
    GPT‑6.2 to predict where and how a small molecule would bind to a protein. When
    we already knew which two atoms formed a bond, we could give the model that information
    and ask how the rest of the molecule would fit. We could switch between these
    tasks simply by changing the prompt, without retraining the model. We also asked
