  text: Mind-boggling that this is only coming from AWS now. Obviously they have the
    counter-motivation that without it people have to spin up largely paid instances
    of everything in order to be able to test their AWS-reliant apps, but it’s been
    a pain point for so long that things like Localstack sprung up to address it,
    and GCP provided emulators for their main services even a decade ago. Emulation
    isn’t perfect but it’s a lot better than nothing and a lot cheaper than everything.
