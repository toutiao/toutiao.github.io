  text: I've been pounding on this emulator since hearing about it a week or two ago.
    Service by service, many endpoints are unimplemented, but it seems to be fleshing
    out day by day. Basic resources deployed with terraform or AWS CLI work fine;
    queues and eventbridge run, lambda executes a code bundle you deploy to it. I
    look forward to it being good enough at the resources I use to run integration
    tests in the local dev cycle.
