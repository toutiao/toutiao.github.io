  content: "_(This is a guest post by Tenox)_\n\nThe **AT&T UNIX PC** , aka PC 7300
    aka 3B1, is a 1985 Unix desktop developed by Convergent Technologies and sold
    by AT&T. Emulating it is nothing new. Phil Pemberton started [FreeBee](https://github.com/philpem/freebee)
    in 2010, and Neozeed has covered it here since: [booting the diagnostic disk](https://virtuallyfun.com/2011/02/19/att-3b1-emulator/)
    in 2011, [booting AT&T UNIX](https://virtuallyfun.com/2014/05/21/philip-pembertons-3b1-emulator-now-boots-att-unix/)
    in 2014 thanks to Andrew Warkentin, and [running the C compiler](https://virtuallyfun.com/2020/08/29/thanks-to-shadyjesse-philpems-freebee-can-now-run-the-c-compiler/)
    in 2020 thanks to shadyjesse. Arnold Robbins added bigger disks and keeps the
    3B1 software alive at [skeeve.com/3b1](https://www.skeeve.com/3b1/). However there
    was no networking, and the mouse had to be grabbed with F10.\n\nNow it all has
    been patched up in my fork of FreeBee:\n\n- **Ethernet and TCP/IP!** The 3B1 Ethernet
    board, borrowed from MAME ([Visionik](https://github.com/visionik/mame)‘s 3B1
    board and Patrick Mackinlay’s LANCE), on libslirp. Wollongong’s WIN/TCP does telnet,
    ftp and rsh, out to the Internet.\n- **Seamless mouse!** No more F10 grab. The
    pointer just moves in and out of the window, and the scroll wheel works!\n- **Turbo
    and CPU idle!** 10x as fast as a real 3B1 (1x to 32x), with the clock in real
    time. And an idle VM now takes about 4% of a Mac core instead of 44%.\n- **Fixes!**
    No more frozen Office forms, stuck Alt key or flicker on macOS.\n- **Scripting!**
    A control socket and an MCP server.\n\nIt’s all in a pull request to Phil’s upstream
    FreeBee, still open: [https://github.com/philpem/freebee/pull/57](https://github.com/philpem/freebee/pull/57),
    and the CPU fix in one to his [Musashi](https://github.com/philpem/Musashi/pull/1).\n\n**The
    ultimate UNIX PC image!** UNIX System V 3.51m with Fix Disk 2.0 and 187 packages:
    nearly every program made for the UNIX PC, like Microsoft Word, Multiplan, dBASE
    III, WordStar 2000, GCC 2.5.8, GNU Emacs 19, TeX and over 80 games. It comes from
    THE STORE!, the 3B1 archive and the disk images of Arnold Robbins, Alain Knaff
    and the VCF. Credit is due!\n\nBehold! UNIX System V 3.51m and the Office on an
    emulated AT&T UNIX PC:\n\n![AT&T UNIX PC Office with the System Information window
    and a UNIX System window showing uname -a, green on black](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-system-info.png)\n_The
    Office, System Information and uname -a in a UNIX window_\n\n`Specs: AT&T UNIX
    PC (3B1), 68010 at 10 MHz (10x here), 4 MB RAM, 720x348 one-bit screen, 195 MB
    disk, 3B1 Ethernet board`\n\nEverything runs in windows that you move, resize
    and overlap with the mouse, even the system panels:\n\n![AT&T UNIX PC Office preferences
    form in a window over the Office, green on black](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-preferences.png)\n_Office
    preferences_\n\n![AT&T UNIX PC Ethernet menus with the network interfaces and
    routing table windows, green on black](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-network.png)\n_Ethernet
    panels: network interfaces and the routing table_\n\nLet’s look at some cool apps!\n\n![Othello
    game in a window over the AT&T UNIX PC Office](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-othello.png)\n_Othello
    playing against itself_\n\n![Mahjongg tile game in a window on the AT&T UNIX PC](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-mahjongg.png)\n_Mahjongg,
    gorgeous at one bit per pixel_\n\n![AT&T UNIX PC SIMUL-TASK multitasking demo
    with a second window showing a scanned portrait](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-simul-task.png)\n_SIMUL-TASK
    DEMO: AT&T showing off multitasking_\n\nThe Demonstration Programs are pure eye
    candy:\n\n![Artist's Corner demo picture of a centaur saying The PC7300 is no
    myth](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-artists-corner.png)\n_Artist’s
    Corner: The PC7300 is no myth!_\n\n![3D wireframe surface of cos(x*x-y*y) in front
    of the Performance Monitoring Tool on the AT&T UNIX PC](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-tour-cos.png)\n_Tour
    cos(x*x-y*y) in 3D over the Perf. Monitor_\n\n![Spirograph Output demo drawing
    a flower shaped curve on the AT&T UNIX PC](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-spirograph.png)\n_Spirograph
    Output_\n\nThere are productivity apps too! Microsoft Word and Multiplan take
    the full screen:\n\n![Microsoft Word 1.10 running full screen on the AT&T UNIX
    PC (3B1), with a short document about the machine](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-ms-word.png)\n_Microsoft
    Word 1.10_\n\n![Microsoft Multiplan 1.20 spreadsheet on the AT&T UNIX PC (3B1),
    with the machine's age and speed worked out by formulas](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-multiplan.png)\n_Microsoft
    Multiplan 1.20_\n\n![The Typewriter app of the AT&T UNIX PC (3B1) Office, with
    a memo on the AT&T Memohead form](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-typewriter.png)\n_The
    Typewriter, with the AT&T Memohead form_\n\nNow some new stuff, made in 2026 for
    this image!\n\n**New Games!** 2048, Bubble Breaker, Falling Blocks, Snake and
    Sokoban, all AI generated, as native 3B1 windows in the Office:\n\n![2048, Falling
    Blocks and Bubble Breaker game windows on the AT&T UNIX PC](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-tenox-games-1.png)\n_New
    Games: 2048, Falling Blocks and Bubble Breaker_\n\n![Snake and Sokoban game windows
    on the AT&T UNIX PC](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-tenox-games-2.png)\n_Snake
    and Sokoban with 24 levels_\n\n**telnetu!** The old WIN/TCP telnet chokes on today’s
    servers, so I wrote a new one with its own VT100/xterm terminal, UTF-8 and DNS,
    full screen or in windows: [https://github.com/tenox7/telnetu](https://github.com/tenox7/telnetu)\n\n![Three
    telnetu windows on the AT&T UNIX PC: a mapscii.me map of Europe, htop on Alpine
    Linux and the telehack.com aquarium](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-telnetu.png)\n_mapscii.me,
    htop on Alpine Linux and the telehack.com aquarium, all at once!_\n\n**Archaic!**
    A tiny web browser for [WRP](https://github.com/tenox7/wrp), which renders the
    page on a modern computer and sends it as a picture with clickable links: [https://github.com/tenox7/archaic](https://github.com/tenox7/archaic)\n\n![Archaic
    web browser on the AT&T UNIX PC showing the Wikipedia article about the AT&T UNIX
    PC](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-archaic.png)\n_Archaic:
    the 3B1 reads about itself on Wikipedia_\n\n**Bonus: the tall screen!** Just for
    fun I patched FreeBee, the kernel, the window driver and the shared library to
    run at 720×696. It’s a super hacky hack, so it has its own [branch](https://github.com/tenox7/freebee/tree/tall-screen)
    and image:\n\n![UNIX 3.51m on a 720x696 screen with the Office, a Calculator showing
    696, 2048 and the Archaic web browser](https://virtuallyfun.com/wp-content/uploads/2026/11/att3b1-tall-screen.png)\n_720×696:
    twice the lines of a real 3B1!_\n\nAs usual I have prepared a ready to run, portable
    image with FreeBee binaries for macOS (Apple Silicon), Linux (x64 and arm64) and
    Windows (x64). Just unpack and run `run.sh` (or `run.cmd` on Windows). At “Please
    login:” type tenox for the Office, or root for a shell. There are no passwords.
    For Archaic, start WRP on your computer first.\n\nDownload: [https://files.42718.net/mirror/tenox/os/att/3b1/virt/att3b1-unix351-freebee.tar.lz](https://files.42718.net/mirror/tenox/os/att/3b1/virt/att3b1-unix351-freebee.tar.lz)\n\nTall
    screen: [https://files.42718.net/mirror/tenox/os/att/3b1/virt/att3b1-unix351-freebee-tallhack.tar.lz](https://files.42718.net/mirror/tenox/os/att/3b1/virt/att3b1-unix351-freebee-tallhack.tar.lz)\n\nSource
    (FreeBee, my fork): [https://github.com/tenox7/freebee](https://github.com/tenox7/freebee)\n\nHave
    Fun with Virtualization!\n\n## One thought on “The "
