  author: LeoUnderwood
  text: 'Worth noting for anyone confused by the names: the machine first shipped
    in 1985 as the AT&amp;T UNIX PC, often called the 7300, and the 3B1 was the later
    version with a taller case and room for a bigger hard disk. Both were built by
    Convergent Technologies around the Motorola 68010, which had the support needed
    for demand-paged virtual memory, something a plain 68000 couldn&#x27;t do cleanly.
    It ran a System V-derived Unix with its own windowing environment, which was unusual
    for a desktop at that price in the mid-80s.'
