  text: No, Anthropic&#x27;s gross margin on inference is not ~85%. A subset of tokens
    may have ~85% margins but the majority of their tokens are consumed by users on
    fixed price plans.<p>Anthropic had a very short period where their cash expenditure
    on compute was artificially low during which their margins looked good. If you
    look at their actual spend on compute, as described in their Q3 filings, it is
    barely above water. Anthropic spend over $5 billion per month on compute, their
    revenue barely exceeds their compute spend.<p>Economies of scale typically refers
    to margins increasing as scale increases but inference doesn&#x27;t have that,
    inference is a fixed cost per token. More compute does not improve inference margins.
    Inference is becoming more efficient per unit of compute with various innovations
    but that is independent of access to compute (and that is <i>bad</i> for Anthropic
    given how much compute they have committed to).<p>Yes, inference can be profitable,
    nobody denies that, just charge more than the cost per token, but that isn&#x27;t
    Anthropic&#x27;s business model.
