  text: |-
    <p><pre><code>  The chances that open weight models keep up over the next decade is extremely low. Costs are also simply too high, they will form a barrier to entry. Pre training costs are going to enter a regime where open models simply cannot compete. You will not have an open weight model with $500b pretraining costs. You will absolutely get there in private models.
    </code></pre>
    I agree with this. Below is what I wrote 6 months ago[0]:<p><pre><code>  I think frontier models are a classic duopoly&#x2F;monopoly scenario. The smarter the model, the more it gets used, the more revenue it generates, the more compute the company can buy, the smarter the next model and so on. It&#x27;s a flywheel effect. This is similar to advanced chip nodes like TSMC where your current node has to make enough money to pay for the next node. TSMC owns something like 95%+ of all of the most advanced node market. Back in the 80s and 90s, you had dozens of chip fab companies. Today, there are only 3. There should only be 1 but national security saved Intel and Samsung fabs.

      There is evidence that the Chinese models are falling further behind, not gaining. Consolidation will likely happen soon because many unprofitable open source labs will have to merge and focus on revenue generation.
    </code></pre>
    [0]<a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48182917">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48182917</a>
