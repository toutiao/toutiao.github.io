  author: jillesvangurp
  text: Funny that people call these Java phones. Most of the phone was definitely
    not Java. Most of the applications on the phone were native. The only things users
    could install and run however were J2ME (Java 2 Micro Edition) applications. For
    that it had a simple jvm with a standard library that was limited to the various
    mobile profiles. I worked at Nokia just before the iphone launched (in the research
    department). I knew some of the people working on standardization related to J2ME.<p>Of
    course Android is technically much more of a Java phone than these old phones
    ever were. It supports most of the java standard library and lots of Android specific
    stuff. And it kept up with Java versions. It does compile the Java to native though,
    so there&#x27;s no JVM running. And these days there are also flutter, native,
    and other applications running on the phone.<p>Android knocked the main premise
    from under J2ME that there was a need for a limited mobile only jvm away as it
    basically just shipped support for most of the standard library. It did that via
    the Harmony project that originated in IBM. This allowed Google to dodge the classpath
    exception in the GPL which is an exception that Sun added to the GPL that allowed
    dynamic linking on desktop but not on mobile. Thus requiring an expensive commercial
    license from what was then still Sun for shipping J2ME functionality. That&#x27;s
    the basis for what later became the big copyright dispute between Oracle and Google.
    Harmony was effectively a clean room implementation of the standard library with
    an Apache 2.0 license.<p>Android killed J2ME because it was a proper Java phone
    with more favorable licensing. Google basically just gave it away to OEMs initially.
    So, that killed the whole market for Symbian and other proprietary systems. Nokia
    later open sourcing that did not really stop developers and users leaving. And
    Nokia abandoning J2ME in favor of native application SDKs did not really help.
    C++ just wasn&#x27;t a great fit for mobile developers. Symbian development was
    notoriously hard. And Nokia stubbornly avoided touching Android until it was about
    to be gobbled up by MS. An actual Nokia Android phone shipped just before that
    happened. MS promptly killed that of course. By then windows phone was supposed
    to save everything, which was another doomed attempt at avoiding Java on mobile.
    Because MS had a big thing against anything Java.<p>Nokia&#x27;s own Linux based
    OSes (there were several) actually were closely related to Android but Nokia made
    a point of never bundling J2ME or a proper JDK. Android and Meego shared what
    was basically the same kernel and Nokia laid a lot of the ground work for Android
    to run at all. Early Android versions were tested on N800s even because you could
    just boot that into something else than Maemo (before the Meego rename). You could
    actually run Java on Maemo pretty easily. I did that for a research project. I
    was running Tomcat and a few other things on these things. All it took was an
    apt-get install.
