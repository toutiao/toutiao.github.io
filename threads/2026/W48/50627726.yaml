  author: andrewl-hn
  text: Opera had similar, and we also had a large piece of Java code that would do
    either device &#x2F; manufacturer or feature detection to work around bugs that
    different vendors had in their j2me implementations. It was gnarly.<p>Sun maintained
    closed source test suites called TCKs (Technology Compatibility Kit) for their
    desktop (j2se), server (j2ee), and mobile (j2me) versions of Java. If you wanted
    to ship a JVM on your device you had to get a license from them and pass those
    tests. j2me TCK was very incomplete and very forgiving compared to the desktop
    one. Was it by accident or by design, I&#x27;m not sure, but Sun really wanted
    more phone vendors to ship Java on their phones, so making the test suite easier
    to pass would be in their interests. As a result many Java apps wouldn&#x27;t
    run on different devices out of the box, and if you had a popular mobile app like
    Opera Mini you would have to adjust to new JVMs appearing in a wild all the time.
  score: 0
