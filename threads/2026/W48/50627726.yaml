  text: I&#x27;m glad that we still have 2G networks in my country with no plans to
    shut them down. So you put a sim card into an old phone and it just works.<p>However,
    there&#x27;s another issue I ran into with J2ME. In the name of &quot;security&quot;,
    an app can&#x27;t connect to TCP ports 80 and 443 without having been signed with
    a trusted certificate that you can&#x27;t get any more. So if you want to implement
    modern TLS, you&#x27;re out of luck. The only way to bypass this seems to be to
    patch the phone&#x27;s firmware to add your own CA or remove the check entirely.
    Which is a real shame, since I figured out how to compile J2ME apps with a modern
    JDK.
