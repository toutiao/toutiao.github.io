  author: neurostimulant
  text: 'I think the only feature phones with Bluetooth PAN support are Sony Ericsson&#x27;s.
    Symbian v3 phones also support Bluetooth PAN, but they are smartphones. Symbian
    v1, v2, UIQ, and Communicators can also connect via Bluetooth using PPP, but their
    built-in UI lacks the option to configure it, even though the underlying Symbian
    OS is capable of it. Thankfully, there is Gnubox (and various ports of it), which
    lets you configure those phones to connect to the internet via PPP over Bluetooth.<p>If
    you don&#x27;t want the hassle of setting up PAN or PPP over Bluetooth on your
    PC and you have an ESP32 with Bluetooth Classic, there are projects that let you
    flash it with firmware that turns it into a Bluetooth bridge for PAN or PPP, such
    as Satura Bridge (Bluetooth PAN) or Vetera Bridge (Bluetooth PPP).<p>- Gnubox:
    <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20080125044214&#x2F;http:&#x2F;&#x2F;gnubox.dnsalias.org&#x2F;gnubox&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20080125044214&#x2F;http:&#x2F;&#x2F;gnubox.dns...</a><p>-
    Satura Bridge: <a href="https:&#x2F;&#x2F;github.com&#x2F;sigildeveloper&#x2F;satura-bridge"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;sigildeveloper&#x2F;satura-bridge</a><p>-
    Vetera Bridge: <a href="https:&#x2F;&#x2F;github.com&#x2F;arifwn&#x2F;vetera-bridge"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;arifwn&#x2F;vetera-bridge</a>'
