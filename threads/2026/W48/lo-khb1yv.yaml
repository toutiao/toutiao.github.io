    I cannot overstate how impressed I am with June’s work. The jump from ‘we have proven things against a simplified model of the ISA’ to ‘actually we’ve rerun the proofs against the official ISA spec’ was amazingly quick. The bugs she’s found were subtle and the confidence we now have in the core of the trusted computing base is much improved.
