  author: al_borland
  text: I like to think of it more like an unplanned audio silent switch.<p>With a
    timer or alarm, I explicitly want to be interrupted so those break through.<p>With
    music or a video that I’m explicitly starting, I want I to break through.<p>For
    anything else that may be background noise that I’m not expecting, like any auto-play
    music&#x2F;videos in the browser, sound effects, phone calls, texts, and game
    noise… I want it to respect the silent switch.<p>We’ve all seen, or been, the
    person who opens something on our phones in a public place that is quiet, to have
    the phone start playing something unintentionally. It can often be rather embarrassing.
    A silent switch with broad application prevents almost all of this.<p>I understand
    where you’re coming from, and I think it would require a separate switch. One
    for the ringtone, and one for the idea I’m talking about. But this might get even
    more confusing for the users.<p>If there is a game you play often that you want
    audio for, a shortcut could be setup to automatically turn silent mode on&#x2F;off
    when the app is opened or closed. I was looking to see if there was a game mode
    trigger to apply more broadly, but it doesn’t look like it.<p>I do see an option
    in the Sound &amp; Haptics settings to match Alerts and System Sounds to the ringtone
    volume. I wonder if turning that off would move the silent switch to a pure ringtone
    mute, like you want? It’s worth a shot.
