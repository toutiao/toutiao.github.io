  author: hunter2_
  text: 'This is really cool. I have a suggestion, though: the samples within a button
    seem to have several modification types including a pitch shifter. For example,
    &quot;DOWN4&quot; under the &quot;Multi-sampled sounds&quot; heading sounds nearly
    a semitone lower than the other DOWN variants. I suggest eliminating all pitch
    shifting (or at least confining your use to a few cents), leaving only timbre
    variation. Go nuts creating variation through EQ, distortion, formant shifting,
    reflections&#x2F;delay&#x2F;reverb, etc. but keep the pitch locked. Why? Because
    the pitch of everything in this world is based on its resonant frequency, which
    is based on the size of whatever can vibrate, and in the case of a button it&#x27;s
    resonating based on the size of the button. Many aspects of the sound would change
    based on things like how quickly the button is pushed or how much dampening the
    finger pushing it imparts, but <i>the fundamental pitch</i> is not one of them.<p>When
    playing a violin, if you move up the fingerboard, the pitch of the string increases.
    But if instead of playing the string you knock on the body as if knocking on someone&#x27;s
    front door, the main pitch of that knocking never changes. The sympathetic vibrations
    of the strings will have frequencies that vary as the finger position varies,
    and the brightness and RT60 of the reverberation through the wood will vary from
    knock to knock, but the fundamental frequency generally excited by the knock only
    changes if the violin&#x27;s volumetric size changes, and it never will.<p>Maybe
    a drum is a better example than a violin, since it&#x27;s &quot;unpitched&quot;
    and yet still gets tuned to have some fundamental frequency. Only the noisy stuff
    varies from hit to hit, and the fundamental frequency does not (until you re-tune,
    or from temperature&#x2F;humidity changing).'
