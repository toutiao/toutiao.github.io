  author: iamnothere
  text: Not everyone agrees with this theory, and frankly your use of belittling language
    here speaks poorly of the sophistication of your arguments.<p>Depending on how
    you define it, conflict between two large powers is certainly not inevitable,
    and more importantly <i>this belief itself generates conflict</i>. While there
    was constant simmering tension and plenty of spycraft during the Cold War, there
    was no direct confrontation between the Warsaw Pact and NATO.<p>If you define
    “conflict” very loosely, as any sort of disagreement, then there is constantly
    conflict between all nations, even allies. But <i>military</i> conflict, the most
