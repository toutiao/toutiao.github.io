  author: FinnLobsien
  text: "&gt; It&#x27;s impossible for humans to predict with 100% confidence the
    outcome of every one of their actions.<p>That&#x27;s exactly my point, which is
    why I think that low-downside, high-potential-upside tinkering is so important.<p>You
    start with a goal or a problem to solve before you model your options and their
    expected value. To use your job example: If the goal is to get a job as a software
    engineer you might tinker by:<p>-Reaching out to software developers to see if
    they&#x27;re willing to chat about how they built their careers, what they look
    at when hiring an engineer, etc.<p>-Building an app&#x2F;integration&#x2F;something
    to solve a problem in your life and see if you enjoy that<p>Both of these take
    little time but could give you a ton of information that could get you onto the
    path of getting that job (or realizing you want something else entirely).<p>I
    would argue getting a degree is the opposite because the downside is wasting years
    and paying $$$, potentially without any results."
