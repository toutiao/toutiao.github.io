  author: ddkto
  text: |-
    A key organizational corollary is that creating spaces where it is safe to flail can lead to much better outcomes.<p>There are spaces where flailing is 100% not safe. For example, just try random stuff while you are constructing a building. However, architects and engineers 100% flailing around as they are deciding what to build. The best environment for flailing is one where:
    1. You won’t hurt or harm anyone or anything, and
    2. You can learn from your experiments.<p>The Lean Startup is basically advocating for flailing, and the context is a small company with not brand to damage, and the feedback is direct market signals (purchase, usage, etc…)<p>In an established company with a brand to protect and significant assets that can be targeted by lawsuits, you need to find a safe “playpen” to flail in.<p>If you can try something in a PR without merging, that’s pretty safe. Why do people show mockups to customers instead of just shipping iterations? Because that protects the existing application’s perception.
