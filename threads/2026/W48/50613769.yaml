  text: "&gt;even though they have equal access to all the same opportunities that
    I do<p>I&#x27;d like to understand exactly what you mean by that?<p>Problem space
    exploration very rarely looks the same for any two individuals. The chains of
    causality are long and very small perturbations can lead to wildly different outcomes.
    Things like what zip code you live in can affect your risk profiles affecting
    who lends you money, or even the time of day to listen to. Very small differences
    education or experience can have massive differences in outcomes.<p>Us humans
    quite often point at our hard work as what lead to our successful outcomes without
    realizing the massive factors luck plays in."
