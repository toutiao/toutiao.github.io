  author: tpoacher
  text: Ah yes I remember this article.<p>Well, as theorized, the nuance is lost when
    reducing to a quote.<p>&gt; During the semester, these students were busy taking
    photos, experimenting with composition and lighting, testing out various methods
    in the darkroom, and learning from their mistakes. In the process of creating
    hundreds of photos, they honed their skills. Meanwhile, the quality group sat
    around speculating about perfection. In the end, they had little to show for their
    efforts other than unverified theories and one mediocre photo.<p>So, it was never
    really a question of &quot;quality vs quantity&quot;. Quantity here was effectively
    treated as &quot;continuous improvement&quot;, vs &quot;quality&quot; as a waterfall
    &quot;get things right on the first iteration no improvements allowed&quot; situation.
    Obviously the former is going to lead to better outcomes, but that&#x27;s not
    proof that quantity is better than quality.<p>In fact, if I were to define a &quot;quality&quot;
    approach, it would indeed be via continuous improvement. The quantity approach
    I&#x27;d contrast it with would be more a case of &quot;quantity as bootstrap
    without improvement between sessions, aiming to simply pick the best of the random
    bunch at the end&quot;. With that definition, you can bet that quality would trump
    quantity every time.   (in a sense this is similar to boosting vs bagging methods
    -- boosting always wins, assuming you don&#x27;t stop after the first step --
    but the number of steps you will need in boosting is almost certainly smaller
    than bagging).
