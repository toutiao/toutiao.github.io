  author: FinnLobsien
  text: Reality isn&#x27;t deterministic. Everyone rationally understands this, but
    most people don&#x27;t act on it.<p>It&#x27;s foolish to believe that the quality
    of one&#x27;s results scales linearly with planning, strategizing, and so on.
    We&#x27;ve all made intricate plans that went nowhere and done off-the-cuff things
    that became breakthroughs.<p>I think the important mental model here is expected
    value:<p>What&#x27;s the potential upside and downside and what probability do
    I assign to those outcomes?<p>For everything you do, you should be able to make
    a credible case that it could lead to a great outcome, but don&#x27;t bet everything
    on one scenario.<p>This creates the mental space to not pick favorites among approaches
    and act on real results (vs. insisting on the solution that was so elegant in
    your head).<p>&quot;Flailing&quot; (I&#x27;d call it tinkering) falls apart in
    two scenarios:<p>-When one attempt&#x27;s failure doesn&#x27;t take you back where
    you started, but makes you significantly worse off (e.g. larges-scale production
    infrastructure)<p>-When the feedback loop isn&#x27;t based on the results you&#x27;re
    trying to achieve (e.g. users like your feature, but an exec doesn&#x27;t, so
    the exec deprecates it)
