  author: rramadass
  text: No, don&#x27;t; We need more Thinking and less &quot;Flailing&quot;.<p>Instead,
    follow the modified STAR process (from Behaviour Based Safety training);<p>Stop
    - Stop and clear your mind of distractions and focus on what needs to be done.<p>Think
    - Think about possible options and their payoffs, constraints, limitations and
    come up with a plan of action.<p>Act - Follow the plan making any needed tactical
    changes as necessary.<p>Review - Review the results to ensure that you achieved
    what you set out to do.<p>All of the steps can be repeated in a feedback loop
    as needed.<p>A story i read somewhere that i always keep in mind:<p>Some Agile
    aficionado found himself next to Niklaus Wirth on a plane trip. He enthusiastically
    embarked on a detailed explanation of Agile and its benefits hoping to get some
    validation. Wirth politely listened to everything and then remarked, &quot;I suppose
    it is all right if one doesn&#x27;t know how to Design&quot;!
