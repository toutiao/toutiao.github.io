  text: |-
    Another fun thing with GitHub Actions' YAML is that they have an on key to define when the workflow should run. For example, in their quickstart they use:
    on: [push]

    but of course, this is YAML, so this is semantically equivalent to:
    true: [push]

    Fortunately, they also support this syntax for the sanity of people who generate their YAML, but it's undocumented:
    'on': [push]
