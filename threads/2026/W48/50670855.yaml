  author: reticulates
  text: 'The title is editorialized (for space, I guess). The actual title is &quot;Attorneys
    General Jones and Rayfield File Suit Against SpaceX, Parent Company of X, xAI,
    and Grok, Over Creation and Promotion of Child Exploitation and Non-Consensual
    Images on Platform&quot;<p>The key issue is that SpaceX knew about the way Grok
    was being used and lied publicly about the effectiveness of their safety tooling.<p><a
    href="https:&#x2F;&#x2F;www.oag.state.va.us&#x2F;files&#x2F;Grok-SpaceX-Complaint-As-Filed.pdf"
    rel="nofollow">https:&#x2F;&#x2F;www.oag.state.va.us&#x2F;files&#x2F;Grok-SpaceX-Complaint-As-F...</a><p>&gt;
    Defendants assured consumers that their products and services were safe because
    they had taken steps to prohibit the generation, production, and dissemination
    of CSAM, NCII, and other non-consensual sexualized images on their platforms.
    Defendants stated that they had a “zero tolerance” policy regarding “any forms
    of child sexual exploitation.” These representations were false, misleading, or
    deceptive. In truth, Defendants had not implemented or enforced policies and safeguards
    to identify, remove, and police such content. To the contrary, Defendants intentionally
    released a product that inundated their platforms with CSAM, NCII, and nonconsensual
    sexualized images.<p>&gt; Defendants have violated the VCPA by misrepresenting
    that they implemented and enforced safeguards to protect consumers from exposure
    to CSAM, NCII, and other nonconsensual sexualized images when using their platforms.<p>What
    it boils down to is: if SpaceX had been honest about how their platform was being
    used and how ineffective their safety tooling was, they would have been forced
    to take it offline. They chose to lie publicly to avoid public + government pressure
    to shut down.<p>edit:<p>Specific allegations:<p>&gt; Because a model capable of
    generating sexual images of adults cannot reliably be prevented from generating
    CSAM, NCII, or other non-consensual sexualized images, the major AI developers
    other than xAI designed their products to refuse sexual content altogether. The
    safer design was available, feasible, and standard.<p>&gt; Throughout 2025 and
    early 2026, users openly published, traded, and refined working “jailbreak” prompts
    and step-by-step workarounds for Grok—including methods designed specifically
    to defeat restrictions on sexualized images and to “undress” images of real people.48
    Yet Defendants neither adequately monitored these channels nor promptly remediated
    the exploits disclosed on them.'
