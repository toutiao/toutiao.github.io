  author: jimz
  text: And that wouldn&#x27;t do it either since that is fundamentally a naive way
    of understanding how the tech works. The government have lost the plot on what
    is metaphorical and what is literal a long time ago and are demanding the impossible,
    which can simply be read as prior restraints and easy calls as violations of the
    First Amendment. No image generator can actually create a bona fide image on its
    own of anyone unclothed from a photo of said person clothed that is a true representation
    of the person&#x27;s actual unclothed state. It would take more reference photos,
    which is its own thing, to even get close. The demand falls squarely in the &quot;AI-is-black-magic&quot;
    fallacy, which is a crazy regression of the ability to reason in the face of tech
    that is man made and also, well-documented. Public distribution that violate NIL
    rights may subject one to, once again, liability on other fronts, but the mere
    creation itself in private is expressive and fundamentally not real. The mere
    generation does not create victims, their rights are only infringed when there
    is injury of some sort that is concrete and foreseeable and causatively linked.
    Anything beyond that would require pre-crime essentially to mind-read or crude
    gating mechanisms that don&#x27;t work and are either going to be struck down
    as the state compelled speech (strict scrutiny) to impose  prior restraint (virtually
    never allowed) or do next to nothing. Either way, money spent and time wasted
    and nothing will be fixed. This is a sort of moral panic, although the state having
    offered no actual solutions except ones that would be barred, may not even reach
    that criteria of offering an alternative (in the classical sense), but it definitely
    gets pretty close. Likewise, revenge porn laws isn&#x27;t constructed on the creation
    (since at the time without dissemintion it would not fall into the revenge porn
    category, it&#x27;s only considered as such when disseminated. The intent element
    being shifted to a machine is neither sensical nor enforceable.)<p>This may inadvertently
    overturn Gonzales v. Raich, one of the worst decisions from the Supreme Court
    in the 21st Century that is so attenuated that clearly instead of applying a process
    it was reverse-engineered, since it begs the question &quot;what about locally
    hosted models that generate privately&quot;? I have a homelab, it can generate
    photos, and as we find new ways to offload parts of generation, consumer GPUs
    are more than capable to generate in private even if demands on hardware capabilities
    become greater. Chronological age is also not a meaningful heuristic and since
    it&#x27;s the edge cases that make it to court, it begs the question &quot;how
    would it even be possible to establish probable cause for entirely private activities
    to be subject to a ban when the capability to determine the chronological age
    of a fictional depiction of a human that may or may not resemble a real person
    with accuracy? Models that use some sort of Tanner-Scale-esque method are fundamentally
    all doing what Dr. Tanner himself explicitly stated not to do - to use the descriptive
    chart of adolescent growth markers for prescriptive policy purposes. The scale
    does not, notably, use chronological age, and the five stages do not map easily
    to make a functional heuristic, as one would imagine. If our models are fundamentally
    unable to generate base on chronological age (because the bright-line demarcation
    only makes sense for real images and not generated ones), are we punishing based
    on the prompter&#x27;s intent regardless of outcome?<p>This would also turn the
    concept of strict liability upside down since while disfavored, it&#x27;s at least
    allowable, sort of, in some cases by disregarding the intent element. But what&#x27;s
    being called is to make unlawful something that doesn&#x27;t meet the basic corpus
    delicti requirement in that to presume that a crime had happened when a crime
