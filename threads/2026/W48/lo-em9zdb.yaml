  content: "# Tom Mason \n\n- [About](/) \n- [Blog](/blog) \n- [Projects](/projects)
    \n- [Contact](/contact) \n\n  \n\n# Pokemon Childhood Version: A romhack where
    Mew is under the truck\n - 25th November 2026   \n  \n\nTL;DR I made a romhack
    which implements the most common urban legends from the gen 1 Pokemon games.\n\n
    \ \n\nCatching Mew under the truck\n\nIncluding:\n- Spam A to increase catch chance\n-
    Magikarp splash has a 1/256 chance to 1-shot KO\n- Talk to Bill 100 times and
    you can go to his garden\n- You can catch all three starters in Bill's garden\n-
    You can catch Pikablu in Bill's garden\n- You can battle Professor Oak after completing
    the Pokedex\n- ... and of course, Mew is under the truck\n  \nHow do I actually
    get to the truck tho?\n\nThe old fashioned way! I did not make the actual getting
    to the truck any easier. You have to either trade for a Pokemon that knows CUT,
    to avoid entering the S.S. Anne. Or, you can enter the ship and collect the CUT
    HM as usual, then backtrack to a trainer on the ship that you have not already
    defeated, battle them, and let them win. This will teleport you back to the nearest
    Pokecentre without triggering the S.S. Anne to leave.\n\n### Download\n\nI don't
    want to host the rom directly because Nintendo will eviscerate me. What I have
    below is a patching tool: select an original, unmodified ROM file that you ripped
    from your personal copy you've had since you were twelve, and it will patch it,
    and save the modified version. Under no circumstances should you use a ROM file
    ripped by anyone else, because that would be very naughty.\n\n  \n  \n  \n\nSource
    code available on [github](https://github.com/wheybags/pokemon_childhood_version/).
    Thanks to the [pret/pokered](https://github.com/pret/pokered) contributors, without
    whose hard labour this would not have been possible. Also BTW I actually tried
    the Mew under the truck thing when I was a kid. I was devastated when it didn't
    work. Satisfaction at long last.\n\n •••   \n  \n[Blog index](/blog)  \n Subscribe
    via [RSS](rss.xml), [Email](/cgi/email_blog_subscribe.py), [twitter](https://twitter.com/wheybags),
    or [mastodon](https://mastodon.gamedev.place/@wheybags)"
