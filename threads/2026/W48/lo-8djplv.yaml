    A common issue that I observed in many C++ codebases is that a lot of code gets injected by the language at the end of each scope. While that's not inherent to RAII, it encourages these types of patterns. An extreme example of this would be expensive destructors that are ran by accident in tight loops. While this is fixable without ditching RAII entirely, in languages like Zig or C3 a mistake like this is less likely from my perspective.

    how does Zig code manage resources consistently without it?

    The go-to solution is including the resource management explicitly in your architecture. For games the popular approach is using object pools and/or arena allocators, while other software like TigerBeetle (a financial database), allocates all resources upfront for better predictability.
