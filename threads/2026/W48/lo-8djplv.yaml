  content: "[\n\n](https://www.madrigalgames.com/)\n\n[![](https://www.madrigalgames.com/images/blog/27_so_i_rewrote_my_game_in_c3/title_image.png)](#)\n\n>
    If you are wondering, I wrote this myself with my own two hands. Writing is a
    nice way to organize my thoughts, I should do it more.\n\nOver the past few months
    I’ve been working on rewriting [Traction Point](https://store.steampowered.com/app/1485840/Traction_Point/
    \"Traction Point on Steam\") in [C3](https://c3-lang.org/ \"The C3 programming
    language\"). All the [Zig](https://ziglang.org/ \"The Zig programming language\")
    code in the game has been replaced with C3, and the modding SDK will follow when
    the next playtest version is released. Why, you ask? Well, ever since I made it
    possible to [hot-reload](https://www.madrigalgames.com/blog/how-i-made-my-zig-gameplay-code-hot-reloadable/
    \"How I made my Zig gameplay code hot reloadable\") the game code, it has become
    an integral part of my workflow for developing the game. Want to tweak a UI element?
    Make the change and hot-reload the code while the game is running, and it shows
    up. An animation needing a longer ease-in? Hot-reload and you will see it in seconds.
    Need a temporary print in the code to isolate a bug in the state of the game?
    Hot-reload.\n\nThe problem with Zig is that building code on Windows is _sloooow_.
    These days Zig has a self-hosted backend which compiles code relatively quickly,
    at least in debug mode, but unfortunately it’s not yet available on Windows. They
    even added a form of incremental-compilation, but it doesn’t remove the long LLVM
    linking times. To give you an idea of what I am talking about, a full build of
    the Traction Point debug configuration, at a little over 100k LoC of Zig, takes
    around **24s**. Changing a single line and rebuilding, with a warm cache, takes
    over **15s**. C3 compiles the full game, without caching, in about **3s**. I’ve
    seen it be as fast as **2.6s**. Now, this is podracing! It will probably get a
    bit slower before the game is done, as more code is added, but I am sure you can
    see the benefits here.\n\n### What is C3 anyway?\n\n[C3](https://c3-lang.org/
    \"The C3 programming language\") is not as widely known as other modern systems
    programming languages, but it fits the project perfectly. I wanted a language
    that could act almost as a drop-in replacement for Zig. That meant the memory
    model needed to be the same (no GC, no RAII), it needed to compile to WASM (for
    mod support), it needed to be fast (obviously, we are making a game here), and
    it needed to compile quickly. Preferrably it also would be somewhat easy for other
    people to pick up, and while I am personally quite fond of the Zig syntax, going
    with a C-derived language like C3 makes a lot of sense for attracting modders
    in the future.\n\n> **Q:** _But what about Odin, Rust, Jai or HotNewLanguage™?_
    \ \n> **A:** Yes, some of those might have fit the bill too, but I went with C3.\n\nFor
    my purposes, Zig and C3 were similar enough that almost all of the concepts used
    in the code could be ported over one-to-one, and I could do an almost mechanical
    translation of the code, which I think was the only way this port was ever going
    to happen. Let’s see what the new code looks like, by grabbing a few pieces from
    a random game component:\n\n    struct WireRendererComponent @Component(\"means.WireRendererComponent\")\n
    \   {\n    \tGameObjectComponent context;\n    \n    \tRenderObject renderObject;\n
    \   \tCurvePath3D curvePath;\n    \n    \tuint pointCount;\n    \n    \t// Exposed
    properties:\n    \tWireRendererGeometryMode geometryMode @Exposed(WireRendererGeometryMode.CURVE_PATH_3D);\n
    \   \tAllocString curveDataBlockName @Exposed(\"\");\n    \tuint curveSampleResolution
    @Exposed(16);\n    \tAllocString point0Object @Exposed(\"\");\n    \tAllocString
    point1Object @Exposed(\"\");\n    \tAllocString materialRef @ExposedResourceRef(ResourceTypeID.MATERIAL,
    \"\");\n    }\n    \n    // ...\n    \n    fn void WireRendererComponent.createVisualCurvePath(&self)\n
    \   {\n    \tRendererPtr renderer = self.context.getRenderer();\n    \tSceneNodePtr
    parentNode = {};\n    \tbool createDedicatedNode = false;\n    \tGameObjectPtr
    gameObject = self.context.getGameObject();\n    \n    \tself.pointCount = self.curveSampleResolution;\n
    \   \n    \tMeshGeometryPtr geometry = mesh_geometry::newGeometry();\n    \tdefer
    geometry.deinit();\n    \n    \tMeshGeometryLodLevelPtr lod0 = geometry.addLodLevel();\n
    \   \tMeshGeometrySubMeshPtr subMesh = lod0.addSubMesh(VERTEX_FORMAT_TYPE);\n
    \   \n    \tself.generateIndicesCurvePath(subMesh);\n    \tself.generateGeometryCurvePath(subMesh);\n
    \   \n    \tMeshSource meshSource =\n    \t{\n    \t\t.kind = MeshSourceKind.MESH_GEOMETRY_IMMUTABLE,\n
    \   \t\t.meshGeometry = geometry\n    \t};\n    \n    \tself.renderObject.init(\n
    \   \t\trenderer,\n    \t\tRenderObjectInstanceType.IMMOVABLE,\n    \t\tmeshSource,\n
    \   \t\tself.materialRef.str(),\n    \t\tparentNode,\n    \t\tcreateDedicatedNode,\n
    \   \t\tgameObject);\n    }\n\nC3 supports annotations, both built-in and user-specified,
    and we are using a few above. Tagging a struct with @Component now makes the game
    engine treat it as a game object component. Exposed properties, ie. fields you
    want to show up in the level editor inspector, are just normal fields with @Exposed
    (or one of its variants) at the end, and the engine handles the rest. Overall,
    the code is pretty similar to C#, or even C++. The most obvious new thing is probably
    the fn at the start of the function signature.\n\nYou can see that C3 supports
    defer just like Zig, so much of the lifetime management and scoping was just a
    straight copy-paste. In fact, much of the code inside createVisualCurvePath()
    is _literally_ the same as it is in Zig. C3 is also similar to Zig in the sense
    that it is explicit about many things. There is no RAII, but C3 offers temporary
    memory pools as a built-in thing, which is nice. Also, you can overload operators
    for things like math types, so we can do stuff like this:\n\n    // If we have
    turned to roughly face the target point, or turned almost 180 degrees, we are
    done.\n    Vec3 vehicleToTarget = (self.targetPoint - currentPosition).normalized();\n
    \   bool reverseTurnComplete = vehicleToTarget.dot(currentForwardDir) > THRESHOLD
    || angleDiff < -THRESHOLD;\n\n### How was the porting done?\n\nTo be honest, I
    can’t imagine a better codebase than Traction Point for doing a rewrite like this.
    Some of you might remember that we already [took a look at C3 almost a year ago](https://www.youtube.com/watch?v=x_Bv5l2qpxI
    \"Game modding SDK for the C3 language\") during a live stream. I’d been experimenting
    with making it possible to mod the game in different languages by compiling the
    mods to WASM and running them in a WebAssembly runtime. Thanks to this, one could
    already do some basic things in C3 back then, and it served as an excellent starting
    point for the porting work.\n\nThe first order of business was to expand the modding
    SDK for C3 enough to build and run the [flying scout example mod](https://github.com/MadrigalGames/TractionPointModding/tree/main/ExampleMods/flyingscout/code_c3/src
    \"Flying scout example mod code\"). I can’t stress enough what a luxury it is
    to be able to continue running the game, while porting more and more of it to
    a new language, and testing that new functionality in a mod. I was able to port
    almost all of the game engine’s APIs over to C3 while keeping the Zig version
    running. Only when the most tricky binding issues were resolved did I start porting
    the actual game code over to C3.\n\nThe Traction Point game code is a dll loaded
    by the game engine, which itself is written in C++. Because of this, I needed
    to start by replicating the entire dll interface to the game engine in C3, since
    otherwise the engine would reject the dll outright. However, once the API was
    in place I could simply take one system at a time and port it over from Zig. I
    even did some of it [live on stream](https://www.youtube.com/live/BoIVk1y7frQ
    \"Porting my game to C3! - C++/C#/C3 Gamedev Live\")! I gave myself a hard limit
    though: The game data could not be touch"
