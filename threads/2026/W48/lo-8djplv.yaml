  text: |-
    The most common criticism I have heard from people who prefer Zig/C/C3/Odin/etc is that constructors and destructors/RAII encourage writing your code in terms of constructing/processing data a single object at a time, while it would be more efficient to handle whole arrays and use ZII (zero-is-initialization i.e. having each object have a default state that is all zero bytes).
    Another criticism is that RAII encourages using global heap allocators, when arenas that are tied to some semantic scope of the program (like per-frame, per-request, per-file, etc.) would be faster.
    (Personally, I can definitely see how it could encourage the "default" to be a certain way. Although a common conclusion is "and that's why languages with RAII are unworkable" and I can't agree with that, I think it's still totally possible to write code like that in a language with RAII.)
    It reminds me of the famous "impedance mismatch" from OOP languages, where the efficient way used by databases is to store all data as dumb structs in flat arrays, but the OOP way wants you to have them grouped into smart objects that have behavior, and so some people invent ORMs to map between the two while other people say you should just give up on using OOP for that.
