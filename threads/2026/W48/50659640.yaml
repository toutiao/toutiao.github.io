  author: xandrius
  text: Often emoticons require you to tilt your head sideways and there is the condensed
    version and the expanded one. For instance the classic smiley:<p>1. :)  = condensed
    &#x2F; normal<p>2. :-) = expanded (with nose)<p>So you can start understanding
    emojis like:<p>- ;) (winking)<p>- &gt;:) (evil)<p>- XD (cartman laughing face)<p>Some
    might stare directly at you like:<p>- ç_ç (crying)<p>- oO (surprised shocked)<p>-
    o_o (eyes open)<p>- -_- (someone made a lame joke)<p>Then you get other complex
    emojis, more popular initially in Japan where there is a more complicated character
    in a scene, like the ones posted above.
