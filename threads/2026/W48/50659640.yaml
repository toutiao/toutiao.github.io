  content: "# Company Culture = Slack Emoji ÷ √Headcount\n\n By _[Liam Galvin](https://twitter.com/liam_galvin)_
    \n\n  Posted _2026-11-26_ _5 min_ read\n\nCompanies spend an enormous amount of
    time and money trying to measure - and even worse, _decide_ - culture. Engagement
    surveys, pulse checks, eNPS, offsites where someone from HR asks you to describe
    the company as a type of animal. Office posters make claims like “our culture
    is honesty, hard work and fun”, embarrassing the paper they’re printed on. I once
    applied to a company that asked candidates which kitchen utensil they most identified
    as, in order to decide if they were a “culture fit”. I never found out what the
    right answer was, but I got the job after choosing a meat cleaver, so I’m not
    sure what that says about either of us.\n\nThe results of these things - heavily
    modified by HR - are compiled into a slide deck, presented at an all-hands, and
    then quietly repurposed for the careers page. There, they sit beside a photo of
    six engineers smiling with their mouths but not their eyes at a “hackathon”, which
    is what the company calls overtime when it’s paid in pizza, at a rate that works
    out to roughly £1.40 an hour. The salary is listed as “competitive”.\n\nThere
    is a better way to measure culture. It is cheaper, more accurate (in my anecdotal
    experience), and requires no participation from anyone - which is ideal, because
    nobody wants to participate in these corporate séances anyway.\n\n## The Formula\n\nTake
    the number of custom emoji in your Slack workspace and divide it by the square
    root of the number of users. That’s it.\n\n\\[C = \\frac{E\\_{custom}}{\\sqrt{U}}\\]\n\nThe
    square root is important. Emoji are a shared resource - a single `:this-is-fine:`
    can serve an entire engineering department for years - so a company of 10,000
    people should not be expected to have 1,000 times more emoji than a company of
    10. That would be unhinged.\n\nWe’ll call this the **Emoji Coefficient**.\n\n##
    Interpreting Your Score\n\n## The Participation Rate\n\nThe Emoji Coefficient
    alone is not enough. A healthy score can conceal a dark truth: that every single
    emoji was uploaded by one person, usually a backend engineer who has been there
    since the beginning and knows where the bodies are buried.\n\nTo account for this,
    we also measure the percentage of users who have uploaded at least one emoji.
    These are your _culture leaders_. Their reward is a shoutout at the all-hands
    (it’s customary to mispronounce their name).\n\n\\[P = \\frac{U\\_{uploaders}}{U}
    \\times 100\\]\n\nIf P is below 20%, things are not good. Your culture is being
    carried by a handful of people, and when they leave, they will take it with them.
    The emoji will remain, but nobody will remember what `:fire-extinguisher-thumbsup:`
    was for.\n\nAbove 20%, the culture has the gene pool it needs to succeed.\n\n##
    Examples of Cultural Success\n\nFor reference, here are some real emoji from [slackmojis.com](https://slackmojis.com/):\n\n![:a_big_lump_with_knobs:](data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20128%20128'%3E%3C/svg%3E)\n_:a_big_lump_with_knobs:It's
    a corn on the cob._\n\n![:austin_capmetro_bus_back:](data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20128%20128'%3E%3C/svg%3E)\n_:austin_capmetro_bus_back:A
    detailed drawing of the back of one specific Austin city bus, number 2300._\n\n![:cat-roomba-matrix-fast:](data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20128%20128'%3E%3C/svg%3E)\n_:cat-roomba-matrix-fast:The
    fastest in a series of cat-on-a-Roomba emoji, after \"exceptionally fast\", \"hyper
    fast\" and \"ultra fast\"._\n\n![:cauliflower_surprise_veg_shock:](data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20128%20128'%3E%3C/svg%3E)\n_:cauliflower_surprise_veg_shock:A
    startled cauliflower, one of a whole set of cauliflower emotions._\n\n## Caveats\n\nAs
    with any metric, the Emoji Coefficient can be gamed. A sufficiently motivated
    middle manager could upload 600 variations of the company logo to drive up the
    score ahead of their performance review, the outcome of which, unbeknownst to
    them, was decided in March. This should be detected and treated as what it is:
    a cry for help. Fortunately, it will also be immediately visible in the Participation
    Rate.\n\nIt is also worth monitoring the _rate of change_. A sudden spike in custom
    emoji is generally a positive sign. A sudden spike in emoji like `:rip:`, `:press-f:`
    and `:linkedin:` usually coincides with a reorg, and should be cross-referenced
    with the number of users, which will shortly be going down. Interestingly, this
    will improve your score. Mass layoffs are, of course, yet another way in which
    the score can be gamed.\n\n## What If You Don’t Use Slack?\n\nIf your company
    uses Microsoft Teams, there is no equivalent formula. There doesn’t need to be.
    If you use Teams, your lack of culture is probably the least of your problems.\n\nIf
    you use something else, I don’t really have any advice for you. I only added this
    section to blast Teams.\n\n## Conclusion\n\nCulture cannot be manufactured with
    values posters or mandatory fun. It emerges organically, when an engineer decides
    that what the team _really_ needs is an emoji of an exceptionally surprised cauliflower.\n\n
