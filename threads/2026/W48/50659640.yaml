  text: This is largely down to culture and how it’s configured. For the most part,
    the Hide&#x2F;Show behavior in Teams is analogous to channel membership in Slack.
    (You can see hidden channels, but you don’t get notified unless you “show” aka
    “join” them.) So it has the possibility of being open.<p>This is all to say, if
    you have to use Teams and want to use it effectively, there is a path. The tool
    just doesn’t make it easy to choose that path (and indeed panders to organizational
    controls that lead away from it).
