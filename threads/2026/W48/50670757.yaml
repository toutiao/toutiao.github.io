  author: georgemcbay
  text: I don&#x27;t know the author, so I&#x27;m speculating, but I&#x27;m pretty
    certain his intent was to invoke a variant of the Streisand effect on purpose.<p>Not
    to draw attention to the book that he removed (the removal of which has no real
    practical impact, and I assume he knows this), but to draw eyeballs to his arguments
    on why rushing ahead with AI is dangerous for reasons beyond simplistic SkyNet
    scenarios.<p>And his plan worked, as evidenced by the fact that this is on the
    front page of HN and we are talking about it.<p>FWIW, I think his arguments are
    good and worth talking about.  AI is, in fact, likely to surface many rather inexpensive
    massive dangers to society in the hands of chaos agents.<p>In the pre-AI, we got
    &quot;lucky&quot; with nuclear bombs in that fissile materials are practically
    rather difficult to acquire, aiding in relatively manageable (but still costly)
    limited proliferation.  No reason to believe that luck keeps up if AI is unable
    to uncover future real-world dangers that are even a fraction as destructive.  So
    yeah, I do think speed of scaling up is a really big danger we should be thinking
    about here.
