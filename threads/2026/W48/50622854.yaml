  author: joddystreet
  text: |-
    This was take 2<p>```<p>document       = { template } ;<p>template       = &quot;@template&quot;, identifier, newline,
                     { node },
                     &quot;@end&quot;, line-end ;<p>node           = group | row ;<p>group          = &quot;&lt;&quot;, identifier, &quot;&gt;&quot;, newline,
                     { node },
                     &quot;&lt;&#x2F;&quot;, identifier, &quot;&gt;&quot;, line-end ;<p>row            = atom, { &quot;|&quot;, atom }, line-end ;<p>atom           = reference | component | spacer ;<p>reference      = &quot;[[&quot;, identifier, &quot;]]&quot; ;<p>component      = &quot;[&quot;, label,
                     [ &quot;|&quot;, identifier, { &quot;|&quot;, property } ],
                     &quot;]&quot; ;<p>property       = identifier, &quot;=&quot;, value ;<p>value          = json-scalar | binding ;<p>label          = label-part, { label-part } ;<p>label-part     = literal-text | escape | binding ;<p>binding        = &quot;{&quot;, identifier, { &quot;.&quot;, identifier }, &quot;}&quot; ;<p>spacer         = &quot;...&quot; ;<p>line-end       = newline | end-of-file ;<p>```<p>Still evolving.<p>Core idea is to be able to define interfaces in a minimal language, without going into too much details about attributes, say height, width, etc
