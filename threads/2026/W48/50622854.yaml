  author: Syzygies
  text: 'I managed to train my agents to comment in my style. It was hard work; one
    has to stay on it. Judge here the human&#x27;s lack of effort, not the untrained
    dog.<p>The hardest similar problem I&#x27;ve faced was teaching agents aesthetics
    for a drawing style. What worked: I hand-engineered an interpretable feature space
    for SVG diagrams, and used the feature vectors of exemplars as the style target
    for generation. The agents then wrote code one-shot that drew as I liked.<p>AI
    is a kit, not a car where you turn the key. We&#x27;re all facing the same issues,
    and many of us are constantly engineering infrastructure to &quot;fix&quot; AI
    to our needs. Consensus forms fast, and much of this engineering becomes available
