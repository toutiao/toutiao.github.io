  text: "I think Qt&#x2F;QML really reached hit sweet spot for me when it comes to
    describing UIs (ignore if any syntax errors, doing this from memory):<p>For eg.
    compare this:<p>```\nWindow {\n    textColor: &quot;slategray&quot;\n    property
    int v: 40<p><pre><code>    ColumnLayout {\n        id: layout\n        anchors.fill:
    parent\n        spacing: 20\n\n        Text {\n            id: number\n            Layout.alignment:
    Qt.AlignHCenter\n            font.pixelSize: 70\n            text: v\n        }\n\n
    \       ProgressBar {\n            id: progressBar\n            Layout.alignment:
    Qt.AlignHCenter\n  \n            value: v&#x2F;100\n            color: v &lt;
    50 ? &quot;dodgerblue&quot; : &quot;turquoise&quot;\n        }\n    }\n\n    MouseArea
    {\n        anchors.fill: parent\n        onClick: v = (v+20)%100\n    }</code></pre>\n}\n```<p>with
    Declare:<p>```\nApp [ textColor = slategray,<p><pre><code>    group: View [ x
    = center, y = center, width = 80%,\n        layout: SimpleLayout [ axis = y, spacing
    = 20 ],\n\n        number: Text [ width = 100%, textAlign = center,\n            fontSize
    = 70, fontWeight = bold, text = { &quot;&quot; + v } ],\n\n        bar: Gauge
    [ width = 100%, value = { v },\n            tint = { v &lt; 50 ? cool : warm },
    accessibilityLabel = &quot;v&quot; ],\n\n        hint: Text [ width = 100%, textAlign
    = center,\n            text = &quot;click anywhere to change v&quot; ]\n        ],\n\n
    \   v: number = 40,\n    cool: Color = dodgerblue,\n    warm: Color = turquoise,\n\n
    \   onClick() { v = (v + 20) % 100 }\n    ]\n</code></pre>\n```"
