    That said, clients are awful

    Especially on Windows. I had to use Windows when I worked at MS and I was shocked that there is basically no good mail client for the platform.
    Outlook is a disaster. It doesn’t even do quoting properly and that was the biggest complaint people had with it in 1996. 30 years later, it’s still terrible.
    Windows Mail supports IMAP but doesn’t check all mail boxes by default and can’t be told to. It has some heuristic for how frequently it checks things based on how often you look at mail folders. But I only look at a folder when I see an unread message appear in it, so it never learns to look there.
    Thunderbird does a load of I/O on the main thread. This is bad anywhere, but on Windows it is particularly bad because Defender does on-access scanning. The scan may take only a few ms, but add a few dozen of those and latency spikes. In common operation typing would lag, in the worst case the entire UI would freeze for 30s or longer.
    I guess most people just use webmail these days.
