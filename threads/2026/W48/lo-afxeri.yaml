  text: |-
    Check your (static) IP address against the normal block lists (eg. https://mxtoolbox.com/SuperTool.aspx), make sure your ISP doesn't block port 25, and set-up reverse-DNS, DKIM, DMARC etc setup correctly. (This should be automatic if you run a mail package like mailinabox).
    I found sending to gmail is ok, once I'd sent from gmail to my domain. Microsoft have an easy procedure that puts your domain on their whitelist.
    The biggest hassle people seem to have is ISPs or hosting providers who won't open port 25. Or being given a known blocked IP address. If your host or ISP is lowest-cost, there's a good chance you might encounter these hassles.
    Also - don't use your domain for everything. You'll need an alternate email (eg gmail/outlook/etc) for managing your own domain, should you have server hassles.
