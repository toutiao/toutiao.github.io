  content: "## How New Open Source Mail Servers and Clients Make Self-Hosting Practical
    Again \n\n[The fourth in a five-part series on European-funded open source projects
    in hardware and software.](http://www.linux-magazine.com/Online/Features/Taking-Email-Back
    \"Taking Email Back\")\n[![Share](http://static.addtoany.com/buttons/share_save_171_16.png)](http://www.addtoany.com/share_save?linkurl=http%3A%2F%2Fwww.linux-magazin.de%2F&linkname=linux-magazine.com)\n\n#
    Taking Email Back\n\n ![Photo by Chris G. on Unsplash](/var/linux_magazin/storage/images/online/features/taking-email-back/nlnet_email_image/888215-1-eng-US/NLnet_Email_Image_medium.jpg
    \"Photo by Chris G. on Unsplash\")\n\nPhoto by Chris G. on Unsplash\n\n Author(s):
    Jeffrey A. McGuire\n\n_The fourth in a five-part series on European-funded open
    source projects in hardware and software._\n\n#### Three Homes, No Data Center\n\nDeuxfleurs,
    a French nonprofit, keeps its servers in members' homes in Lille, Nantes, and
    Massy: two or three second-hand Lenovo ThinkCentre mini PCs each, with a copy
    of the same data so its websites stay up when one of them loses power or fiber
    line. Quentin Dufour, one of the founders, says some major French websites already
    serve their pages from this setup. Next, the collective wants its email to work
    the same way.\n\nThe software for self-hosting email in this manner is called
    Aerogramme, and it isn't finished. Deuxfleurs still runs its own mail on Dovecot,
    a long-established open source mail server, and plans to move to Aerogramme around
    January 2027.\n\nThe collective is heading the opposite way from almost everyone
    else. According to the independent daily DNS measurements published by RIPE Labs,
    email for the million busiest domains on the web has consolidated dramatically:
    In 2016, 44.6 percent of these domains used small or self-hosted servers, and
    that share halved to 22.4 percent by July 2026. Small regional hosting companies
    and independents are losing accounts to corporate providers like Google and Microsoft,
    who together handled 38.6 percent of these busy domains.\n\nEmail is older than
    the Internet itself, and it still runs on open standards anyone can implement.
    Any server can deliver to any other, and any standards-compliant client can read
    any mailbox. It’s the hosting that has concentrated into a very few hands, eroding
    autonomy and giving hosting providers power over the data that travels through
    digital correspondence.\n\nTwo cases illustrate how this can limit operational
    independence. In May 2025, staff at the International Criminal Court (ICC) told
    the Associated Press that the court's chief prosecutor lost access to his Microsoft
    email account after he was named in US sanctions; Microsoft denies suspending
    services but hasn’t explained what happened to his account. In February 2026,
    the Dutch government told its parliament that the tax administration was moving
    about 40,000 workplaces to Microsoft 365 for lack of a short-term alternative,
    while acknowledging that Microsoft could be forced under state pressure to stop
    delivering services.\n\nThe Dutch government reversed course in October: The tax
    administration, customs, and the benefits agency will run mail and calendar on
    their own servers from 2027, with European open source tools for storage and collaboration
    to follow. The question now: How are developers working to decentralize email
    hosting on a wider scale? Each obstacle pushing organizations off of small or
    self-hosted email servers has open source projects working on a solution. Three
    of them show how the pieces fit; all of them supported by NGI Zero, the EU-funded
    programs that enable open source research and development.\n\n#### How Email Got
    Away from Us\n\nIn the 1990s, running your own mail server was ordinary. Universities
    and small companies did it, and so did Mauro De Gennaro. In 1993, as a teenager,
    he fetched mail for users of his bulletin board over UUCP: the dial-up protocol
    Unix machines used to exchange mail. He has worked on mail software for most of
    the three decades since. When he looked at the open source stack again about six
    years ago, he saw \"it's the same software that companies and servers have been
    using for over 20 years.\"\n\nHe counts 12 separate programs to run a conventional
    self-hosted setup. Each has its own configuration format and logs, written by
    different people in different styles. The software works well, he says, but was
    \"designed and documented for other developers.\" Bundles such as Mailcow and
    Mail-in-a-Box install the whole set at once: “They abstract the complexity,\"
    De Gennaro says, \"but they do not remove it.\" Since all of it was designed for
    a single machine, running it as a cluster server is possible in the same way it's
    possible to take a Fiat Cinquecento and turn it electric: \"It was not designed
    for that.\" Google launched Gmail into that friction in 2004, with a gigabyte
    of free storage, and let companies run their own domain's mail on it. \"Then they
    started billing,\" De Gennaro says. The users were captive, and moving email is
    disruptive enough that few of them left.\n\nBen Bucksch joined the Mozilla mail
    team in the late 1990s, where his first contribution made email links clickable;
    he also served in leadership for the Thunderbird Council and invented AutoConfig,
    which lets a mail client set up an account from nothing but an email address.
    In his telling, the lock-in started within the client.\n\nIT departments think
    about email as servers; “what users want is to keep their workflow,\" Bucksch
    says. Microsoft shaped those workflows with Outlook's calendar and corporate features:
    Outlook works properly only with Microsoft Exchange, and Microsoft is pushing
    Exchange customers into its cloud. By some estimates, about 75 percent of professional
    mailboxes are on Office 365. \"If we want to free the lock-in,\" he says, \"we
    need to start with the client.\"\n\nDufour and Armaël Guéneau of Deuxfleurs locate
    the problem in operations. IMAP is the protocol most clients use to read mail.
    An IMAP server has to serve webmail that queries the server for every view, desktop
    clients such as Thunderbird that synchronize whole mailboxes, and phones that
    do some of each. Implementing it is hard; the reliability people expect is harder.
    When the tax office sends you an email, Dufour says, \"it must work.\" The expertise
    to run mail at that level, Guéneau says, \"tends to be captured by hyperscalers.\"\n\nAs
    Dufour tells it, Google didn't adapt existing mail software; it built Gmail on
    top of its distributed storage. Open source mail software was designed for one
    machine first, so adding distribution later, he says, requires \"really huge trade-offs.\"\n\nReclaiming
    email is more complex than deciding to run your own server and navigating the
    software. Your service has to fluently speak with the large providers and support
    migration without disrupting service. And, of course, it needs sustainable funding.\n\nToday,
    publicly funded teams are working on solving each of those three problems.\n\n####
    Rebuilding Server, Client, and Storage\n\nStalwart, the server from De Gennaro’s
    team, focuses on streamlining the software to replace 12 programs with one: Installation
    takes two commands and a six-screen web wizard. It speaks every common mail and
    collaboration protocol: SMTP for sending, IMAP and POP3 for reading, JMAP for
    web-based mail, and CalDAV and CardDAV for calendars and contacts. Spam filtering,
    sender authentication, and TLS encryption are built in. Give it a token for a
    DNS provider such as Cloudflare or Route 53, and the server publishes its own
    mail records. Behind the wizard are nearly 3,000 settings across 176 screens,
    which most operators never touch. De Gennaro calls Stalwart \"the software at
    the other end of your email client or calendar client.\"\n\nStalwart 1.0 was released
    in October 2026 after five and a half years of development. NGI Zero funded the
    project with two grants: one for the mail server, and one for calendars, contacts,
    and file storage.\n\nFor users"
