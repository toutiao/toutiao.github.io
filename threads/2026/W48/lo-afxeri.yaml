    I self-hosted email for years (I was bediger@stratigery.com, usually a server in my basement or kitchen). I could write sendmail.cf files. The email spammers finally got the best of me. This article passes over the issue of spammers, which are so bad and so persistent that many ISPs block TCP port 25 traffic entirely. What's to keep the old spammers from doing everything in again?
    Now that Google and Microsoft have taken off their masks, what's to keep them from hiring spammers to make self-hosted email impossible? We know they hide behind residential proxies to scrape web sites that deny them with robots.txt entries. Hiring spammers seems like a small step for giant evil corporations to take.
