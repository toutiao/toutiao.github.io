  text: |-
    Self-hosters should organize and ask EU regulators to fine providers that discriminate.

    I like this. This kind of thing can only possibly happen in the EU or in certain states in the Untied States, because megacorps will gladly spend several orders of magnitude more money on lobbying to avoid regulation of any kind than the cost of doing the right thing. Doing the right thing also sets a a precedent they don't want set.
    I've been advocating for self hosting of email for years. It makes for an excellent litmus test for a community: on Reddit, for instance, you'll get lots of aggressive techbros gatekeeping by telling everyone that it's near impossible, that nobody can do it without tons of money and without making it a full time job, and that we're all stupid if we think you can do it. They don't respond rationally with most attempts to engage peacefully, nor to being told that some of us have been self hosting email for decades.
    It's time to ignore the gatekeepers and self host :) I've helped many people with all sorts of parts of setting up email servers, and will continue to do so. I even smarthost for people and groups that don't have good IPs. If we help each other, it's really not that hard.
    I'm glad these groups are working towards solutions for larger businesses and organizations, because those are most affected by monopolistic companies like Google.
