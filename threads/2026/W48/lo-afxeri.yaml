  author: johnklos
  text: |-
    Older people remember when plastic was hardly in our food. Sodas came in glass bottles. Cereal came in waxed paper bags. Many liquids came in waxed cardboard containers.
    When you talk to people who haven't learned about how we transported food before plastics became ubiquitous, they talk about replacing single use and packaging plastics as though it's an intractable problem, and they talk about how new options aren't tested, which is silly.
    Likewise, there was a time when the Internet worked. If you got spam, you'd report it to the server or network admininstrator from which the spam came, and they'd warn or remove the spammer. Networks that ignored abuse complaints ended up with the possibility of having their email or networks blocked by groups of admins on the Internet, so there was an incentive to do the right thing.
    That could happen again, but we need specific rules and guidelines that can be included in EU regulations. For instance, your right to send email isn't guaranteed. It never is, because people can choose to spam, of course. You should be required to maintain a working abuse reporting address, and if a large provider collects several abuse complaints for your server / network that you haven't addressed, they can keep that evidence and block you.
    There could and should also be maturity provisions. Examples are requiring that a domain is registered for a minimum amount of time, that an IP address hasn't been used for spam for a certain amount of time, that ISPs can't circulate IPs between customers that want to run email servers more than a certain number of times per year, et cetera.
    My home ISP in New York, a large cable provider, offers an option to open port 25, for free, and has lots of language saying what they consider spam and that they'll bill the account if you spam and don't respond to complaints. This isn't all that complicated.
    So the EU codifying fees and termination rights for individuals and ISPs, and requiring large providers like Amazon, Google and Microsoft to accept email from individuals and ISPs that follow the EU regulations is not only possible, but very well could be the only way we see movement in a positive direction.
    The US is not the leader in any way that requires making megacorps accountable, so we need the EU to do it.
