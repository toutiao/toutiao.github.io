  text: This is one of the parts that I suspect needs some antitrust scrutiny.  From
    folks who run newsletters, I've heard it's basically impossible to self host this.  If
    you send a lot of mail, you'll be blocked as spam even if it's all explicitly
    opt-in and you respect unsubscriptions, unless you go via one of the big providers
    (which charge a silly amount for what they're doing).  The big email providers
    don't block the big bulk mailers because, if they do, their customers complain
    about email not reaching them.
