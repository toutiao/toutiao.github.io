  author: perdy
  text: 'Determinism is the underrated part of all this. For a Python framework I
    maintain we moved the CI benchmarks to Callgrind: instruction counts instead of
    time, with the cache geometry pinned so it doesn&#x27;t matter which runner you
    land on. The numbers basically stopped moving between runs, which wall-clock never
    gave us on shared runners. The catch is that you lose everything off-CPU, which
    is exactly what this post is about, so the critical path view is a bit enviable.'
