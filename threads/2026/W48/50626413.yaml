  content: "Okay, I am the first to admit that I’m a bit manic with AI. When you are
    working on a problem that has endless possibilities, it is difficult to constrain
    yourself to a limited set of features.\n\nCan I just add one more?\n\nI have been
    amazed at all the fun and useful things that a deterministic VM like [Rewind](https://rewindvm.dev)
    enables. I have been using it to help [find heisenbugs](/2026/10/03/rewind-vm-a-flaky-build-you-only-catch-once),
    to make [profile-guided optimization reproducible](/2026/11/07/making-profile-guided-optimization-reproducible),
    and to make [Nix builds bit-reproducible](/2026/11/09/what-if-every-nix-build-were-bit-reproducible).
    But the most fun has been using it to understand performance.\n\nTurns out that
    performance is yet another area where Rewind shines. I have been using it to analyze
    the critical path of builds.\n\nWhat is the critical path?\n\nThe critical path
    is the longest chain of dependent work in a program. It is the minimum time that
    the program can take to complete, regardless of how many resources you throw at
    it. The only way to make a program faster is to shorten the critical path.\n\nIf
    you worship at the altar of Brendan Gregg, you know he spent years turning performance
    analysis from a dark art into a science. This is a small offering to him. \U0001F932\n\nI
    added a new `rewind time` command to Rewind that analyzes a recording and tells
    you where the time went and what would make the run finish sooner. You can drill
    into any part of that answer and see the source lines responsible for it. It’s
    like [Brendan Gregg’s flame graphs](https://www.brendangregg.com/flamegraphs.html)
    but on steroids for the critical path and with a debugger attached.1All the ideas
    for the command are either inspired by or directly influenced by [Brendan Gregg’s
    work](https://www.brendangregg.com/). Kneel before Zod!&nbsp;\n\n> **Aside:**
    New to Rewind? Start with [a flaky build you only catch once](/2026/10/03/rewind-vm-a-flaky-build-you-only-catch-once)
    and [dafuq is a deterministic VM?](/2026/10/24/dafuq-is-a-deterministic-vm)\n\nLet’s
    see how it works by analyzing the critical path of a [libuv](https://github.com/libuv/libuv)
    build and test run. The build and test suite takes 78 seconds inside Rewind, and
    even with 64 cores it still takes 47 seconds. Why?\n\nThe usual answer is to look
    at a CPU profile, and in this case a CPU profile would be almost useless. For
    two thirds of those 47 seconds, the work the build is waiting on is not computing
    at all: it is _asleep_. \U0001F4A4\U0001F4A4\U0001F4A4\n\n## [§](#where-the-time-goes)Where
    the time goes\n\nEvery `rewind time` starts with two numbers:\n\n    $ rewind
    time 7a29e716\n    libuv-1.51.0\n        78.0 s elapsed on the VM's one CPU 47.4
    s critical path: the least it can take on any number of CPUs 67% asleep (epoll_pwait
    23.1 s, clock_nanosleep 8.53 s, futex 100 ms), 33% computing\n\nThe first is how
    long the run took on the VM’s one virtual CPU. The second is the **critical path**
    : the longest chain of work where each step had to wait for the one before.\n\nNo
    number of CPUs makes a run shorter than its critical path, so the gap between
    the two numbers is all that parallelism can buy you.\n\nThe line under the two
    numbers applies Gregg’s [thread state analysis](https://www.brendangregg.com/tsamethod.html).
    Here the biggest state is asleep: 23 seconds in `epoll_pwait` and 8.5 in `clock_nanosleep`.\n\nA
    sleeping thread is invisible to a CPU profiler. Gregg’s answer is [off-CPU analysis](https://www.brendangregg.com/offcpuanalysis.html):
    look at where threads block, not only where they compute.\n\nOn a live machine,
    off-CPU analysis is hard. Linux can trace which thread woke which, and Gregg built
    [wakeup and off-wake profiling](https://www.brendangregg.com/blog/2016-02-01/linux-wakeup-offwake-profiling.html)
    on top of that, but you have to be tracing before the slow run happens, the tracing
    has a cost, and most of the sleeps you capture are noise. Rewind already logs
    every context switch because it needs them to replay, and now it records every
    wakeup and who caused it too. All that _juicy_ information is in every recording.
    \U0001F924\n\nHere is the whole output for libuv:\n\n    $ rewind time 7a29e716\n
    \   libuv-1.51.0\n        78.0 s elapsed on the VM's one CPU\n        47.4 s critical
    path: the least it can take on any number of CPUs\n                67% asleep
    (epoll_pwait 23.1 s, clock_nanosleep 8.53 s, futex 100 ms), 33% computing\n    \n
    \   The critical path by phase\n        3.54 s configurePhase ██\n        1.67
    s buildPhase █\n        42.0 s checkPhase █████████████████████\n         99 ms
    5 other phases\n    \n    The critical path by process\n       on path pid process,
    with what it started\n        47.4 s 34 init › bash -e source-stdenv.sh default-builder.sh\n
    \       41.9 s 4076 ├─ make -j8 SHELL=bash-5.3p3/bin/bash VERBOSE=y check\n        36.4
    s 4910 │ ├─ make › bash › lt-run-tests\n        3.38 s 5412 │ │ ├─ lt-run-tests
    hrtime hrtime asleep in clock_nanosleep 3.38 s\n        2.00 s 5013 │ │ ├─ lt-run-tests
    delayed_accept delayed_accept asleep in epoll_pwait 2.00 s\n        1.62 s 5126
    │ │ ├─ lt-run-tests fs_event_watch_dir fs_event_watch_dir asleep in epoll_pwait
    1.62 s\n        1.60 s 5103 │ │ ├─ lt-run-tests fs_event_close_in_callback fs_event_close_in…
    asleep in epoll_pwait 1.60 s\n        1.60 s 5508 │ │ ├─ lt-run-tests metrics_idle_time
    metrics_idle_time asleep in epoll_pwait 1.00 s, computing 600 ms\n        1.24
    s 6095 │ │ ├─ lt-run-tests tcp_write_ready tcp_write_ready\n        1.14 s 5510
    │ │ ├─ lt-run-tests metrics_idle_time_thread metrics_idle_time_t… asleep in epoll_pwait
    1.00 s\n        1.10 s 5132 │ │ ├─ lt-run-tests fs_event_watch_file_current_dir
    fs_event_wat… asleep in epoll_pwait 1.10 s\n        22.6 s │ │ └─ 279 more\n        5.59
    s 4077 │ └─ make test/run-tests\n        2.22 s 4183 │ ├─ gcc -fPIC -fstack-clash-protection
    -O2 -U_FORTIFY_SOURCE …\n        2.10 s 4189 │ │ └─ cc1 /build/source/test/test-fs.c\n
    \       3.35 s │ └─ 20 more\n        1.99 s 68 ├─ sh ./autogen.sh\n        1.99
    s │ └─ 9 more\n        1.67 s 2642 ├─ make -j8 SHELL=bash-5.3p3/bin/bash\n        1.67
    s │ └─ 5 more\n        1.53 s 403 └─ bash ./configure --disable-static --disable-dependency-tracking…\n
    \       1.47 s └─ 581 more\n    \n    What would shorten it\n        sooner pid
    if this took no time\n        36.1 s every lt-run-tests, 600 processes\n        6.66
    s every cc1, 283 processes\n        3.38 s 5412 75 sleeps in clock_nanosleep:
    lt-run-tests hrtime hrtime\n        2.00 s 5013 2 sleeps in epoll_pwait: lt-run-tests
    delayed_accept delayed_accept\n        1.76 s 4189 cc1 /build/source/test/test-fs.c\n
    \       1.62 s 5126 30 sleeps in epoll_pwait: lt-run-tests fs_event_watch_dir
    fs_event_watc…\n        1.60 s 5103 16 sleeps in epoll_pwait: lt-run-tests fs_event_close_in_callback
    fs_ev…\n        1.60 s 5508 lt-run-tests metrics_idle_time metrics_idle_time\n
    \       1.22 s every perl, 9 processes\n        1.14 s 5510 lt-run-tests metrics_idle_time_thread
    metrics_idle_time_thread\n    \n    Look closer\n      rewind time 7a29e716 --in
    PID one process: its threads, sleeps and waits\n      rewind time 7a29e716 --folded
    the path for flamegraph.pl or speedscope.app\n      rewind time 7a29e716 --perfetto
    F every process on a timeline, for ui.perfetto.dev\n\nThe second table is the
    path as a **tree of processes** based on Gregg’s [colony graph](https://www.brendangregg.com/ColonyGraphs/execution.html)
    idea. Each line is a process with everything it started, and its time on the critical
    path.2A `ps` snapshot might miss short-lived process invocations; the recording
    has every fork, regardless of how brief.&nbsp;\n\nIn this build, `make check`
    needs 41.9 of the total 47.4 seconds, and 36.4 of that is `lt-run-tests`, libuv’s
    test runner. The test runner invokes 287 tests each spending 1-3 seconds.\n\nAll
    of those tests are on the path, and the path is a single chain, so the runner
    ran them one after another. Worse, most of each test is spent asleep, waiting
    on timers.\n\nDrag can be less than time on the path.\n\nThe la"
