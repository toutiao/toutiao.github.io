  author: hungryhobbit
  text: 'A co-worker (formally of Nvidia) recently explained to us (his new company)
    Nvidia&#x27;s cultural &quot;speed of light&quot; idea.<p>The core idea is you
    don&#x27;t ask &quot;is our GPU (or whatever is being built) as fast as the last
    one?&quot;  You don&#x27;t even ask &quot;is it as good as any GPU ever made?&quot;<p>You
    instead ask &quot;is it as fast as the speed of light?&quot;<p>In other words,
    if you just waved away everything slowing you down, what&#x27;s the absolute fastest
    you could complete your task?  ONLY once you know that can you start putting back
    the other factors that slow you down: first you <i>must</i> start by comparing
    to the fastest possible way things could be (&quot;speed of light&quot;).<p>Similar
    idea here.'
