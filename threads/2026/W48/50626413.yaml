  author: roca
  text: "[rr maintainer here]. Similar principles but there are important differences.
    rr records and replays user-space processes and has to understand the user&#x2F;kernel
    interface really well, which is a problem because that interface is super complicated.
    RewindVM replays the whole VM, simplifying the interface because the hypervisor
    interface is (or at least, can be configured to be) somewhat simpler than the
    user&#x2F;kernel interface. The overhead of replaying at the VM level will be
    different ... possibly lower, possibly higher, depending on the workload; you
    might expect there to be fewer VM exits than system call traps, but OTOH you have
    to record and replay the entire guest OS instead of specific processes.<p>In terms
    of functionality, they&#x27;re different. rr supports arbitrary timeslicing, e.g.
    thread switches at any program instruction, which ReplayVM does not. RewindVM
    depends on Nix, rr doesn&#x27;t. RewindVM supports a kind of &quot;mutable replay&quot;
    where you can resume a VM from a checkpoint and cause it to do something different
    from what was previously recorded; rr&#x27;s version of that is much more limited."
