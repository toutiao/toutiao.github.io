  author: adrian_b
  text: Fruit trees were domesticated several thousand years after cereals and legumes.<p>There
    are several reasons for this.<p>First, a human cannot survive by eating fruits.
    Fruits can be only supplements to staple foods. The only plant parts that are
    sufficiently nutrient-dense to sustain a human when they are the only food are
    the seeds. So domesticating fruit sources was a low priority goal.<p>Second, the
    cereals and legumes that were first domesticated had an essential advantage, they
    can grow from seeds that will produce similar descendants. So by selecting the
    best plants and using their seeds for the next-year crop, domestication succeeded
    in few generations.<p>With most fruit trees, using their seeds will produce descendants
    that are unlikely to preserve the qualities of their parents that are desired
    by humans, like bigger and sweeter fruits.<p>Only few fruit trees can be propagated
    by cloning, including figs and grapevine, and only those were domesticated early,
    several millennia after the domestication of cereals and legumes.<p>The domestication
    of most fruit trees has become possible only after the invention of grafting,
    around 4 millennia ago. Apple trees and their relatives were the first that were
    domesticated using grafting.<p>Grafting was discovered somewhere in Central to
    Western Asia, around the same area were horses were domesticated.<p>It is not
    known who were those who domesticated the horses and who were those who invented
    tree grafting, but both the domesticated horses and tree grafting appear to have
    been spread quickly over a large area, in Western Asia, Europe and North Africa,
    by the expansion of the Indo-Europeans, who used both technologies (and also wheels
    with spokes, which like horses, contributed to faster transportation).
