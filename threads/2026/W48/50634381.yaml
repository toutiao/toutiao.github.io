  text: Interesting read about wheat.<p>In England specifically, most people up to
    around 1700 or so ate bread made from mixed flours (wheat, rye and barley) raised
    with what is now called a sourdough starter. Search for &#x27;maslin&#x27; loaf
    for recipes All grains would be stone ground.<p>The rich people had manchet bread,
    pure wheat, sieved well and raised with yeast from beer. So ironically less nutrition,
    but they had more meat &amp;c.<p>North of the border, oats were important as wheat
    grew less well at the higher latitudes.<p>Earlier still in Saxon times (~9th century)
    people had gruels and porridges made of the mixed grains boiled with water and
    some meat fat.
