  author: adrian_b
  text: 'It is indeed ethnocentric, but there still is a distinction between the civilization
    based on wheat (more accurately, based on 3 closely-related cereal species, which
    were domesticated simultaneously: emmer wheat, einkorn wheat and barley) and the
    civilizations based on other staple cereals, e.g. rice, maize, sorghum or millet,
    or on non-cereal sources of starch, e.g. potatoes, sweet potatoes, cassava or
    bananas.<p>The civilization based on the 3 species related to wheat (and also
    on a few legume species, including peas and lentils, and also on flax) was the
    earliest and then it spread over an area many times greater than its origin, and
    it also lead to the earliest developments of several technologies, like metallurgy
    and writing, and also to the earliest cities.<p>Similar developments occurred
    also in the areas where the staple food was provided by other cereals or other
    plants, but the wheat-based civilization had a head start advantage that resulted
    eventually in its global dominance during the colonial era.<p>In the 20th century
    and especially after WWII, the international relations became much more balanced,
    but there still are residues from the initial advantage provided by the early
    domestication of wheat and barley.<p>The advantage of wheat was less from its
    intrinsic properties, but more from the timeline of its domestication.<p>Wheat
    still has an advantage, of being one of the most protein-rich among cereals. Oats
    has higher protein content, but it is much less productive, so the cheapest protein
    remains that from wheat. As a protein source, wheat is normally at least twice
    cheaper than any legume (like soy, peas, lentils or fava) or than other cereals
    (which otherwise are equally cheap as energy sources, in the areas where the climate
    is suitable for their cultivation).'
