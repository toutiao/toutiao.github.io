  author: adrian_b
  text: One of the main difference between humans and most primates is a much shorter
    intestine, which prevents the digestion of plant food that has a poor nutrient
    content, like most part plants except seeds or the parts that are modified for
    nutrient storage, like certain kinds of roots or stems (e.g. carrots or potatoes).
    Very few fruits have a high nutrient content, e.g. starchy fruits like bananas
    and oily fruits like olives.<p>All the animals who can live by eating plant parts
    with low nutrient content are able to do that only by fermenting the eaten plants
    inside their guts. This is equally true for insects and for vertebrates.<p>Efficient
    fermentation requires a long gut. This leads to the obvious difference between
    the big belly of a gorilla, who eats mostly plant parts with poor nutrient content,
    and the flat belly of a non-obese human.<p>So humans, after many hundred thousand
    years of adaptation to eating food rich in nutrients, i.e. scavenged or hunted
    animals and plant seeds, have become unable to survive by eating fruits or leaves,
    like many other primates. On the other hand, humans are better at digesting starch
    than most primates, which is an adaptation to digesting seeds instead of fruits
    and which is older than agriculture, so seeds have been an important human food
    for a longer time.<p>The difference between humans and most primates is similar
    to the difference between ants and termites. While termites can eat directly any
    plant parts, because the food is fermented then in their guts, ants cannot eat
    directly plant parts with low nutrient content, so they are either hunting other
    insects or they collect plant parts like leaves, but they do not eat them and
    they cultivate fungi on the collected leaves, then they eat the fungi.
