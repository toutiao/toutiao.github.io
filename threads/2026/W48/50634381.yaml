  author: sandworm101
  text: I did read once about a key developmental difference between rice and wheat.
    The history of wheat is dominated by technology to allows a fixed labor pool to
    harvest an ever-greater area of wheat. Think of force multipliers that allow a
    farmer with a tractor to till more soil than a farmer with a horse. Rice was different.
    Rice development was about using an increasing amount of labor to pull  more rice
    out of a fixed area of land. So whereas in the west technology made <i>farmers</i>
    ever more productive, in the east it was the <i>land</i> that became more productive.<p><a
    href="https:&#x2F;&#x2F;afe.easia.columbia.edu&#x2F;china&#x2F;geog&#x2F;wet_rce.htm"
    rel="nofollow">https:&#x2F;&#x2F;afe.easia.columbia.edu&#x2F;china&#x2F;geog&#x2F;wet_rce.htm</a><p>In
    the historical context this would mean where in the west a population drop would
    result in fields being abandoned (think plague) in the east the same fields would
    simply be farmed less intensively, a more resilient system with less risk of land
    becoming unproductive.
