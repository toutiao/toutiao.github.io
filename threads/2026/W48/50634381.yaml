  author: thelastgallon
  text: 'Robert Sapolsky has an observation, rice vs wheat and how our brains are
    culturally formed as collectivist or individualist.<p><a href="https:&#x2F;&#x2F;news.uchicago.edu&#x2F;do-we-really-have-free-will"
    rel="nofollow">https:&#x2F;&#x2F;news.uchicago.edu&#x2F;do-we-really-have-free-will</a><p>Robert
    Sapolsky: If I were to become a really grandiose version of a neurobiologist,
    I would say culture is the means by which you create a brain in your child that’s
    going to look just like yours when they’re an adult, like your ancestors wound
    up in one of two different ecosystems. They either wound up in southern China
    where you have flat floodplains that are very amenable to irrigation and thus
    very amenable to rice farming. Or you wound up in northern China, which is more
    mountainous or you actually wind up being a wheat farmer.<p>If you are a southern
    Chinese rice farmer, you develop a collectivist culture because you and 50 other
    villages maintain this 100-mile-long irrigation canal that’s 1,000 years old,
    and when it is planting day, the entire village shows up and plants your crop
    and tomorrow you all show up and plant the next guy’s crop and get a mindset cross-cultural
    psychologists have shown that is one of collectivist thinking that manifests itself
    in incredibly unlikely domains.<p>And then you go to northern China and you find
    people who are either doing rice farming of their own plot of land for their wheat
    farming, which is very individualistic, and you do the same psychological tests
    and they’re as individualistic as somebody yelling at you in Times Square in Manhattan.<p>Whoa,
    ecology created culture, culture based on differences in how you make a living
    that’s 1,000 years old. And then you do something like, well, let’s look at people
    from collectivist cultures and individualist cultures and let’s look at something
    as nutty and bizarre as on the average how many seconds does a baby cry before
    mom picks them up. And in individualist cultures, they let you sit there and cry
    for a longer stretch of time. Individualist culture mothers sing to their babies
    louder than collectivist culture mothers do on the average.<p>In other words,
    within minutes of birth you were already being shaped by stuff like that. And
    then it comes through, this was this wonderful study in science a few years ago
    looking at people from Northern China and people from Southern China. And these
    are not northern wheat farmers and southern rice. These are their grandkids who
    are university students now who have never seen a hoe or a spade in their life
    or whatever because they’re just working at some internet cafe in Beijing or something.<p>You
    do a field experiment, which is what these scientists did. They went into a Starbucks
    and between two tables they would put two chairs back to back blocking your way
    if you wanted to walk through there. Do you pull the chairs out of the way or
    do you walk around the tables? And the grandchildren of rice farmers walk around
    the tables and don’t do anything as individualistic as moving the chairs, and
    like the wheat farmer grandkids move the chairs. Are you kidding me? These were
    the descendants of people who were either rice farming or wheat farming 1,000
    years ago, and this is a residue of that.'
