  author: adrian_b
  text: The archeological results are not consistent with this hypothesis.<p>The domestication
    of the first animals that were used for food production or for fiber&#x2F;fur
    production, i.e. sheep and goats, happened millenia after the domestication of
    3 species of cereals and of 2 to 5 species of legumes and of flax (which happened
    simultaneously).<p>The domestication of bigger and more dangerous animals, i.e.
    cattle and swine, happened a long time after the domestication of sheep and goats.<p>By
    the time when the Neolithic farmers from Anatolia began their expansion into Europe,
    eventually covering almost all of it, they brought with them 5 domestic animals,
    dogs, sheep, goats, cattle and swine.<p>Nonetheless, for the Neolithic farmers,
    growing animals appears to have been a secondary activity. On the other hand,
    their Northern and Eastern neighbors, who had not yet transitioned to an agriculture-based
    living, appear to have acquired very early such domestic animals from the farmers,
    perhaps by commerce, but perhaps also by stealing (there are many ancient Indo-European
    stories about cattle stealing, which appears to have been a condoned activity
    for young men, as long as they were not stealing from their own tribe).<p>There,
    at these neighboring people, who were speakers of Indo-European, Uralic and Turkic
    languages, growing animals became the main activity and it was associated with
    a non-settled life style, i.e. with moving frequently to new pastures for their
    herds. Those appear to have also learned the cultivation of some plants from the
    original farmers, but it provided a lesser part of their food.<p>So what you say
    about burning&#x2F;cutting forests to make grass fields for cattle, happened,
    but such practices seem to have begun only millennia after the first domestication
    of plants, followed after many generations of humans by the first domestication
    of animals used for food.<p>Even in the places where animals were domesticated
    independently, like in South America, where eventually they had llamas and alpacas
    instead of donkeys and sheep, their domestication appears to have been much later
    than the cultivation of plants.
