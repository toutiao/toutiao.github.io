  text: Against the Grain by James C. Scott discusses this. Wheat needs to be planted
    and harvested at specific times, unlike potatoes. This made it possible for fledgling
    states to enforce agricultural taxes in Mesopotamia and elsewhere. In areas that
    grew foods that could stay in the ground for long periods, tax regimes (and therefore
    civilization) had a much harder time developing, because the farmers could simply
    avoid harvesting their crops to dodge taxes (the state on its own didn&#x27;t
    have the capacity to perform the harvest, just the theft of a portion of it compelled
    by the threat of violence).
