  author: simiones
  text: The exponent is 105 * n^1&#x2F;3 * (log n)^2&#x2F;3 for the proven deterministic
    algorithm (this is what L[1&#x2F;3, 105] apparently means). Note that the best
    known probabilistic algorithm, much older than this, was 1.923 * n^1&#x2F;3 *
    (log n)^2&#x2F;3 (this was L[1&#x2F;3, 1.923]). This older algorithm is thus ~exp(103)
    times faster than the newly proven one, hence why this has no cryptographic impact.
    Note that n here is the bit size of the number you are trying to factor.
