  author: ndiddy
  text: You&#x27;re right that pre-1983 Unix was significantly cheaper for universities
    than its alternatives, but from looking at the actual figures that doesn&#x27;t
    seem to have resulted in significant adoption during the minicomputer era. In
    1980, around 100,000 PDP-11s had been sold, but only 2,000 of them were running
    Unix (see <a href="https:&#x2F;&#x2F;publications.gc.ca&#x2F;collections&#x2F;collection_2025&#x2F;isde-ised&#x2F;Co26-39-1981-eng.pdf"
    rel="nofollow">https:&#x2F;&#x2F;publications.gc.ca&#x2F;collections&#x2F;collection_2025&#x2F;isde-...</a>
    pg 14).<p>Unix&#x27;s long-term success was because it was a portable, production-grade
    operating system that wasn&#x27;t dependent on any one hardware manufacturer.
    Once microprocessors like the 68000 and 80286 came out, this meant that companies
    could make relatively inexpensive servers and workstations and port Unix rather
    than making a new operating system from scratch. The portability let Unix escape
    the minicomputer era while its competitors declined along with the hardware platforms
    that they targeted.
