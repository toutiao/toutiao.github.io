  author: torginus
  text: Why is Unix so great? I have worked with Linux for many-many years, and I
    feel like I understand most of the programming model of how to write applications
    as K&amp;R intended, yet I am unimpressed.<p>Just what is so good about Unix&#x2F;Linux
    that has allowed people to be so incorrigibly smug bout themselves?<p>Multiuser?
    The PC has deprecated the Terminal-Server model by the <i>90s</i>.<p>Piping together
    C programs? I think this model has kinda sorta failed as well. Most people would
    agree shells are better implemented as a fast scripting-language, rather than
    a chain of C programs passing text around.<p>I was taught that the Unix philosophy
    is writing a shell script and gluing these small programs together, orchestrated
    via a shell script. But this model has failed to scale up in complexity, even
    inside the Unix world. There are no more web servers that handle requests like
    this. Instead of lex&#x2F;bison grammars, GCC people have made their compiler
    into a monolith. The Linux kernel is a huge monolith.<p>It&#x27;s the typical
    sanctimonious religious mentality - people preaching things they do not themselves
    follow, repeated at every level of the clergy<p>Unix design lends itself to scheduling
    programs interacting via pipes&#x2F;files written in a synchronous, blocking manner,
    but tying IO to threads has been accepted as a performance mistake for various
    reasons, and nowadays io_uring is what the cool kids use.<p>But if you don&#x27;t
    code like this, and nobody really does nowadays, what does that make fork(), other
    than a cool novelty?<p>I don&#x27;t wanna shill Windows, but at no point in my
    life did anyone doing things on Windows, but people still built stuff on it, and
    other people used said stuff without major complaints. Yet Linux&#x2F;Unix has
    been always presented as this morally and technically superior environment and
    shilled hard.<p>But when I asked the question of &#x27;Why is Linux better?&#x27;,
    the few people who have offered me something other than smug condescension, said
    things like &#x27;fork() is cool&#x27;, &#x27;every config is a textfile&#x27;,
    &#x27;you can tunnel everything through SSH&#x27;<p>Yes these things are cool,
    but computers can do a lot of stuff other than this, and there are no magical
    Linux specific answers to be found for those.
