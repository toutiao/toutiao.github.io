  author: kragen
  text: |-
    The Lions book wasn&#x27;t useful as a guide to the kernel of your operating system anymore in 01996, but it was very useful in understanding why C and Unix were the way they were.  A lot of Unix&#x27;s Chesterton&#x27;s Gates are justified in it, which is what you need to tear them down.  And it was also very useful for writing a new operating system, because it includes enough source code to compile into a pretty complete multiprocess timesharing operating system supporting multiple terminals, multiple user accounts, a hierarchical filesystem, and the still-familiar Unix system call interface.<p>I don&#x27;t think any of those other excellent books are really an adequate replacement.  Deitel and Kogan obviously don&#x27;t include the OS&#x2F;2 source code; Bach <a href="https:&#x2F;&#x2F;abhyass.wordpress.com&#x2F;wp-content&#x2F;uploads&#x2F;2016&#x2F;09&#x2F;thedesignofunixoperatingsystem_m_bach.pdf" rel="nofollow">https:&#x2F;&#x2F;abhyass.wordpress.com&#x2F;wp-content&#x2F;uploads&#x2F;2016&#x2F;09&#x2F;the...</a> and Goodheart &amp; Cox are mostly pseudocode, with no kernel source code; the Devil Book is almost but not completely devoid of kernel source code; the Xinu book <a href="https:&#x2F;&#x2F;willendless.github.io&#x2F;assets&#x2F;os_arm_doc&#x2F;Operating%20System%20Design%20The%20Xinu%20Approach.pdf" rel="nofollow">https:&#x2F;&#x2F;willendless.github.io&#x2F;assets&#x2F;os_arm_doc&#x2F;Operating%20...</a> is great (and clearly owes a lot to Sixth Edition Unix), but Xinu lacks, for example, users and subdirectories.<p>Most of these, though not the Xinu book, cover operating systems that are much too big and complicated to explain fully in a single book, so they confine themselves to conceptual overviews.  In my view, this reinforces the syndrome Comer critiques in the preface to the Xinu book:<p>&gt; <i>Students form the
    impression that an operating system is a black box, and textbooks reinforce the
    misimpression by explaining operating system features and focusing on how to use
    operating system facilities. More important, because they only learn how an operating
    system appears from the outside, students are left with the feeling that an operating system consists of a set of interface functions that are connected by a morass of mysterious code containing many machine-dependent tricks.</i><p>By contrast, in the Lions book&#x27;s commentary volume <a href="https:&#x2F;&#x2F;cs3210.cc.gatech.edu&#x2F;r&#x2F;unix6.pdf" rel="nofollow">https:&#x2F;&#x2F;cs3210.cc.gatech.edu&#x2F;r&#x2F;unix6.pdf</a> (note, this PDF doesn&#x27;t include the source-code volume!) we find line-by-line commentaries like:<p>&gt; <i>It is now time to take a good look at the procedure which creates new processes as (almost exact)
    replicas of their creators.</i><p>&gt; <i>1841: “mpid” is an integer which is stepped through
    the values 0 to 32767. As each new process is
    created, a new value for “mpid” is created to
    provide a unique distinguishing number for
    the process. Since the cycle of values may
    eventually repeat, a check is made that the
    number is not still in use; if so a new value is
    tried;</i><p>&gt; <i>1846: A search is made through the “proc” array for a null “proc” structure (indicated by
    “p stat” having a null value);
    1860: At this point, the address of the new entry
    in the “proc” array is stored as both “p” and
    “rpp”, and the address of “proc” entry for the
    current process is stored both as “up” and
    “rip”; [...]</i><p>Even the Xinu book doesn&#x27;t go into that level of detail.  It is, in my view anyway, much less accessible than Lions, requiring a great deal more previous knowledge of programming.<p>If a relatively new programmer felt that a kernel was &quot;a morass of mysterious code containing many machine-dependent tricks&quot;, I don&#x27;t think they could retain that feeling after working through the Lions book, although it does contain some machine-dependent tricks.<p>I have the strong impression that all of Bach, Goodheart &amp; Cox, and the Devil Book authors <i>wanted</i> to include the kernel source code they were commenting on, because in many cases they discuss specific functions, struct fields, and variables, and then, in most cases, describe algorithms in pseudocode.  My inference is that they were forced into this exigency by legal threats from the Death Star, not that they thought the pseudocode was actually didactically superior to the actual source code.  Comer didn&#x27;t have this problem because Xinu didn&#x27;t include any Unix source code and wasn&#x27;t even Unix-compatible at the system call level.<p>What <i>was</i> an adequate replacement in 01996 was Linux, which came with full source code and a mailing list full of people who were eager to discuss it.<p>But, even then, Linux was not ideal as a teaching system.  Which is why, in 02006, the PDOS folks rewrote Sixth Edition Unix in ANSI C and have been using it for teaching ever since: <a href="https:&#x2F;&#x2F;github.com&#x2F;mit-pdos&#x2F;xv6-riscv" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;mit-pdos&#x2F;xv6-riscv</a>
