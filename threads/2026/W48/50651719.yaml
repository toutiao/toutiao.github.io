    copied. They would think we were horribly spoiled to have had photocopiers, mimeograph
    machines, and thin, white paper made from trees.<p>Now everything is accessible
    to everyone anytime, anywhere, and the only people who don&#x27;t read are the
    people who don&#x27;t bother to read. It&#x27;s a good time.
