    &gt; But if you don&#x27;t code like this, and nobody really does nowadays, what does that make fork(), other than a cool novelty?<p>Long long ago I used to think that fork()+exec() was brilliant, and spawn() terrible.  Eventually I learned the error of my ways.  &#x27;Twas vfork() that was brilliant, though it get undeserved hard.  So I wrote <a href="https:&#x2F;&#x2F;gist.github.com&#x2F;nicowilliams&#x2F;a8a07b0fc75df05f684c23c18d7db234" rel="nofollow">https:&#x2F;&#x2F;gist.github.com&#x2F;nicowilliams&#x2F;a8a07b0fc75df05f684c23c...</a> which was the one viral HN post of something I wrote (<a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=30502392">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=30502392</a>).  spawn() an posix_spawn() are pretty good too (posix_spawn() is very good, actually).<p>&gt; I don&#x27;t wanna shill Windows, but at no point in my life did anyone doing things on Windows, but people still built stuff on it, and other people used said stuff without major complaints. Yet Linux&#x2F;Unix has been always presented as this morally and technically superior environment and shilled hard.<p>Windows did get a few things much better than Unix:<p><pre><code>  - access tokens over piecemeal [gs]et*[ug]id()
      - security descriptors over piecemeal stat()&#x2F;chown()&#x2F;chgrp()&#x2F;chmod()&#x2F;[gs]etfacl()
      - object handles over file descriptors
         - process object handles
    </code></pre>
    &gt; But when I asked the question of &#x27;Why is Linux better?&#x27;, the few people who have offered me something other than smug condescension, said things like &#x27;fork() is cool&#x27;, &#x27;every config is a textfile&#x27;, &#x27;you can tunnel everything through SSH&#x27;<p>They are very very right about the latter two things, but &#x27;fork() is cool&#x27; is wrong.  &#x27;Tis vfork() that is cool.<p>Specifically the thing that sucked about Windows for a very long time was the difficulty in automating administration due to lack of scripting interfaces.  GUIs were first, APIs second, CLIs dead last as a priorities at Microsoft.  Unix developed before GUIs, so the CLI was the UI, and there were not really many APIs at all.  Unix was API-poor, GUI-poor, CLI-rich, but CLI-rich meant that it was easy to do sysadmin, and when you&#x27;re building large data centers, that&#x27;s a big <i>big</i> plus.
