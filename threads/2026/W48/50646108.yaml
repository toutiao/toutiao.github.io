  author: bdamm
  text: AI labs are motivated to make breakthroughts in quantum computing, and a breakthrough
    there would immediately relegate elliptic curves to the dustbin of history, similar
    to MD5. Is it still around? Yes. Is it still useful in some isolated cases? Yes.
    Should you depend on it for general purpose cryptographic assurances? Absolutely
    not.<p>Unfortunately, the quantum-resistant algorithms we have today are still
    unwieldy. It is also possible that an AI lab could make a breakthrough there as
    well, which would be most welcome. A quantum-resistant key derivation algorithm
    or even a public signature algorithm with a key footprint on the order of RSA
    or smaller would be a huge relief. An PQC algorithm with a footprint on par with
    EC would be the cryptography holy grail.
