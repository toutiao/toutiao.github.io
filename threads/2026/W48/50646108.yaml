  author: xoa
  text: "&gt;<i>Is the world anywhere near prepared for cryptography breaking?</i><p>I
    think it&#x27;s important in the ongoing conversations to be specific. &quot;Cryptography&quot;
    cannot &quot;break&quot;, because if nothing else one-time pads always remain
    and are unbreakable, since they aren&#x27;t even conceptually subject to &quot;breaking&quot;
    (the pad defines, rather than unlocks, the message). AFAIU symmetric ciphers also
    aren&#x27;t even in theory subject to anything more than Grover&#x27;s (if scalable
    general purpose QC works).<p>Of course, all present commonly used (and maybe uncommonly
    used as well) PKI breaking would be a tremendous PITA with a lot of dangerous,
    destructive, disruptive, and just plain weird effects. But modern storage and
    tech does make it possible to envision shuffling around keys or even big chunks
    of entropy in meaningful ways, so we wouldn&#x27;t go to zero. I suspect it&#x27;d
    promote even more centralization though in many aspects of life, scalable public
    cryptography has been one of the major persistent power equalizers&#x2F;decentralizers."
