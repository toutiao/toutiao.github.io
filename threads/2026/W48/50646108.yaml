  author: smaudet
  text: |-
    Unless I have missed some major hardware developments, current computer architectures are not physically restricted in the fashion that they would need to be to rule out the possibility of inappropriate memory access, as I understand it there are (I&#x27;m very much oversimplifying things) two main ways this access is restricted:<p>1) The operating system designates what memory a process is allowed to access
    2) The system itself obfuscates which memory addresses map to which &quot;real&quot; memory areas.<p>The first depends upon the security of the system (memory is required to remember what memory is allowed to access what memory) - any flaw in that access or method of subverting that access (such as bit flips) provides the possibility that the operating system level security is rendered irrelevant. Unless you can prove that your system is immune, not only logically, but physically, this is a relatively soft guarantee...<p>The second is essentially a cipher, which provides a stronger guarantee - if you don&#x27;t know where any of the &quot;real&quot; memory is, accidentally accessing the right memory cell to subvert the memory access controls becomes computationally (time) prohibitive - you <i>can</i> crack a cipher given enough time and energy, but without finding a mathematical shortcut the cost is prohibitive enough that it is not considered possible (the foundational principle of all cryptography).<p>As I understand it, escaping a sandbox is difficult, mostly because of the hardware level scrambling that is provided, that makes it nearly impossible to affect the memory in control of the memory access (operating system level access). Given some of the mentioned AI attacks involving agents communicating cross-sandbox on the same systems, they clearly are able to leverage e.g. side-channels to effectively communicate despite 1) and 2)...demonstrating at the very least the inadequacy of the current protections, while leaving the door open to better cryptographic measures.<p>However, if the cryptographic primitives themselves are broken, the no additional amount of cryptographic protection will help here.
