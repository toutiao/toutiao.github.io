  author: bastawhiz
  text: 'It&#x27;s marginally faster when the cache is cold and there&#x27;s no open
    connection. But you also lose out on the benefits of H2, with header compression
    and the ability to pull many files concurrently over a single connection. The
    performance difference is almost certainly either exactly a wash or slightly slower
    with H1, unless you have so few files that no connection stays open for very long
    anyway: multiple TCP handshakes and header size is going to dominate the single
    TLS negotiation. Server to server, the cost of encrypting and decrypting is almost
    unmeasurable compared to network cost.'
