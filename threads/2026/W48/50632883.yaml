  author: hinkley
  text: There is no way to “include” a certificate in a communications channel and
    know that it isn’t replay unless you have the private key.<p>Mechanically, the
    way you would do this instead would be for the origin to countersign a certificate
    for Cloudflare to use. Deputizing them as the man in the middle formally. But
    that would be adding functionality, as browsers don’t report that and Let’s Encrypt
    doesn’t issue certs for that at present. But those who care could vote with their
    feet and upgrade or switch browsers in order to get what they want.<p>Cloudflare
    could even use the same certs for all customers. People are used to thinking of
    “certificate chains” but they can in fact be inverted trees. The browser needs
    to find one chain it trusts, not all. That’s how Let’s Encrypt got started after
    all. Then Cloudflare can prune the tree down to the relevant actors before sending
    it out.<p>However that would not address Cloudflare using http for upstream connections.
    But who the hell is still exposing http without a redirect in 2026?
