  author: lxgr
  text: Not end to end. Practical v6 routes can run very differently from v4 ones
    even between the same two hosts, e.g. due to (the lack of) CG-NAT, which is often
    more centralized than plain IP connectivity these days.<p>CG-NAT requires scarce
    v4 addresses and beefier stateful hardware, so it&#x27;s actually possible that
    a direct v6 connection to some CDN cache colocated with your ISP runs more directly
    than any v4 route.<p>Since NAT is inherently stateful, you can also see different
    reliability profiles, e.g. for long-running TCP connections. (For v4, there&#x27;s
    a tough choice between sending keepalive pings at the TCP or application layer,
    which can kill otherwise good connections during intermittent connection dropouts,
    or not sending them, which will inevitably cause NAT mappings to be recycled.
    For v6, unless there&#x27;s a stateful firewall deployed somewhere, that&#x27;s
    not the case, and even then the limit is memory, not scarce v4 ports.)
