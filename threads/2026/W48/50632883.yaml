  author: hinkley
  text: Part of the reason you use TLS is because the moment you used edge networking
    or even just regional distribution there is no canonical “there” there. You and
    I do not connect to the same google.com. And probably never have.<p>Also packet
    switched, routed networks, you don’t have any way to know that the resquest you
    sent to 1.1.1.1 actually got there instead of being intercepted. In fact service
    providers have done this for ages which is a big part of why we went TLS always
    in the first place.<p>All TLS tells you actually is that someone trustworthy said
    the certificate used to establish the session was issued to the party you believe
    you are talking to. Nota bene, that doesn’t say that the trusted party can prove
    the person you are actually talking to is the people they said they are or that
    someone else hasn’t stolen that certificate and is impersonating them. That’s
    why it’s so important to protect your private keys, and why signing authorities
    try hard to get a positive ID. They do occasionally get fooled, and keys lose
    containment, which is why revocation exists.
