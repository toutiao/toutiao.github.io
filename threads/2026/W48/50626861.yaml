  author: Danox
  text: 'A pardon for any federal violations has to be accepted by the person who
    was pardoned if that person does not accept it. There is no pardon, a pardon only
    applies to criminal law&#x2F;crimes it does not absolve you of liability civil&#x2F;money,
    penalties, so a person can always recover money damages, property through civil
    suits against you so accepting a pardon basically is an admission of guilt. So
    accepting a pardon for something you did, if you are rich can be a bit of a problem,
    also, a president can only give pardons for federal crimes. He the president cannot
    pardon you for state crimes.<p>Preemptive pardons: You cannot be pardoned for
    something that has not been done, so you cannot be pardoned beforehand and then
    later on commit a federal crime.<p>And once again, being pardoned for a federal
    crime does not give you immunity from civil penalties liability, i.e. money&#x2F;property&#x2F;damages&#x2F;restitution,
    etc the victim if there is one can pursue you in civil court and since in order
    to be pardoned, you have to accept it. Well, that would be pretty hard, accepting
    a pardon is basically an admission of guilt. And you have to accept the pardon
    to get the pardon. Once you accept the pardon, you can’t plead the fifth amendment.
    What’s interesting? is that if you do get pardoned and you are rich i.e. a CEO
    running a company or just plain rich and you are pardoned, you are still on the
    hook for civil penalties. Ouch that would hurt a grifter…<p><a href="https:&#x2F;&#x2F;fedlaws.org&#x2F;preemptive-pardons-constitutional-authority-scope-and-limits&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;fedlaws.org&#x2F;preemptive-pardons-constitutional-author...</a>'
