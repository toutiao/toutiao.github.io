  author: wildzzz
  text: With a centralized system, you&#x27;ve got a perfect idea of your weight distribution
    the moment the last passenger scans their boarding pass. Everything going on that
    plane gets scanned so the system is 100% aware of it. Doing it manually means
    you&#x27;re counting everything manually. Although there&#x27;s no reason they
    couldn&#x27;t put this system at every airport Delta flies to. The downside of
    that delays have extreme knock-on effects. The system at JFK going down means
    all flights leaving are now delayed while crew are doing the work manually but
    now all the flights those planes would be making later are now delayed as well.
    If anyone has a short layover, those people need ticket changes. A centralized
    system has the obvious issue of delaying every flight but it&#x27;s easier building
    one redundant system than $number_of_delta_airports redundant systems. Plus, some
    of that tracking info is already centralized. Your bag may be going from A to
    B to C. The catering company is probably national and doesn&#x27;t want to deal
    with dozens of different tracking systems. Freight bills of lading need to be
    accessible from anywhere, not just airport A and B.
  score: 0
