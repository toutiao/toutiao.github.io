  author: jerf
  text: There&#x27;s so many places in our systems where it&#x27;s like we&#x27;ve
    forgotten what computing can actually do and that we don&#x27;t need a cloud for
    everything. With a scale hooked up to a computer for at least approximate weight,
    balancing a passenger jet plane would be a modest challenge for a Commodore 64,
    and that only due to the data set size. Every modern processor involved in a modern
    checkin process, from the terminal&#x27;s check in computers, to the customer
    cell phones, to the machine driving the display for where the plane is going,
    to the TV displaying CNN, to anything on the plane itself, is embarrassingly overprovisioned
    for this problem. The only thing that might conceivably have trouble is any embedded
    controller in the jetway itself, which might, <i>might</i> be running on something
    that couldn&#x27;t solve this problem comfortably. And I wouldn&#x27;t bet on
    it.
