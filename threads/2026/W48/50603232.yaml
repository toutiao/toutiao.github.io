  text: I’m not aware of any approved automated weight and balance system, and I’m
    not aware of a modern deployment of landing gear load cells.<p>So, that. It’s
    centralized because to do a decent job at guessing the weight of the plane you
    need all planning data (catering reloads, freight load out, bag counts) in addition
    to fuel load and passenger locations plus overhead bag counts. So a centralized
    system is a fairly logical place to fuse the data.
