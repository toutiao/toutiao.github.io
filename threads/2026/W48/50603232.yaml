  author: bri3d
  text: I don’t think any modern planes have calibrated&#x2F;approved mechanisms for
    weighing themselves. I think some older freight models and conversions had load
    cells but they were advisory tools used to better balance the loaded cargo, not
    primary sources for weight and balance. I think it would be quite a regulatory
    and reliability feat to get automated weight approved in such a way that didn’t
    require doing the same manual calculations as today as a fallback. And those manual
    calculations are hard to decentralize because they rely on many disparate sources
    (catering, freight, baggage &#x2F; ramp, gate crew, pilots, fuelers) that have
    to aggregate somewhere.
