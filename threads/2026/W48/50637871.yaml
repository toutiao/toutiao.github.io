  author: btrettel
  text: Your class probably was that way for pedagogical reasons. Manipulating simple
    closed-form solutions is much easier than looking at CFD data.<p>There are a lot
    of closed-form solutions out there that nearly no one uses because they don&#x27;t
    know about them. I basically collect these out of personal interest. And there
    are a bunch of approximation methods that can be quite good (asymptotic analysis,
    lumped parameter models when appropriate, etc.). You would do better to study
    the latter than to hope that solving the Navier-Stokes Millennium Prize problem
    will somehow make closed-form solutions easier.<p>Also, do not confuse the Navier-Stokes
    equations with the Navier-Stokes Millennium Prize problem. The Millennium Prize
    problem is only a subset.<p>The Navier-Stokes Millennium Prize problem does not
    explicitly concern closed-form&#x2F;exact&#x2F;analytical solutions, though it
    might be solved through advances in the the latter.<p>The compressible Navier-Stokes
    equations are still challenging to make closed-form solutions for. That fact has
    to do with nonlinearity, not regularity.
