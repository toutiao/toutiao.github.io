  author: adrian_b
  text: The existence of one-way functions (Rank 008 in TFA) would have a tremendous
    importance for cryptography.<p>For now, all cryptography is based on using functions
    that are supposed to be one-way from the secret key to the encrypted text, but
    nobody knows whether this supposition is true. From time to time, some functions
    that were assumed to be one-way are proven to not be such functions.<p>Knowing
    to use functions that are provable to be one-time, instead of making random choices
    while hoping that they are correct, would be the greatest change in cryptography
    since its invention millennia ago.<p>If we had a mathematical method to prove
    that a function is one-way, that would have immediate consequences, as everyone
    would switch ASAP to use ciphers based on such functions.<p>To be useful, any
    solution to this problem must include either a criterion for deciding whether
    a function is one-way or a method for constructing such functions.<p>Because the
    definition of a one-way function is extremely abstract, I cannot actually imagine
    how one could prove the existence of such functions otherwise than by a decision
    criterion or a construction method.<p>At most, the alternative would be to prove
    that a certain set of functions, where the functions have a certain structure,
    e.g. all those obtained by composing elementary functions defined on certain sets,
    includes or does not include one-way functions, which in the latter case would
    still be useful by excluding from consideration functions that cannot be one-way.
  score: 0
