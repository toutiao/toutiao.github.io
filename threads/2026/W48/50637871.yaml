  author: btrettel
  text: 'As a fluid dynamicist, I am continually surprised by how important people
    think the Navier-Stokes Millennium Prize problem is. It&#x27;s ranked #5 here!
    It&#x27;s definitely not that important from a physics perspective. It&#x27;s
    basically a pure math problem. Even Terrence Tao basically says so:<p><a href="https:&#x2F;&#x2F;mathstodon.xyz&#x2F;@tao&#x2F;117207849921390904"
    rel="nofollow">https:&#x2F;&#x2F;mathstodon.xyz&#x2F;@tao&#x2F;117207849921390904</a><p>&gt;
    While the equations do come from a very natural physical motivation - the study
    of incompressible fluids - the regularity problem is not important for its direct
    physical application. [...]<p>The incompressible Navier-Stokes are pathological
    in a variety of ways, not just in the difficulty of making a proof of existence
    and smoothness. Consider the fact that they have constant entropy, for instance.
    Practically speaking, the compressible Navier-Stokes equations are the real Navier-Stokes
    equations, though there are pragmatic reasons to make them incompressible or &quot;low
    Mach&quot; in computational fluid dynamics. And from what I understand (I haven&#x27;t
    seen the papers), we have existence and smoothness proofs for incompressible Navier-Stokes
    with a different, more realistic, viscosity law.<p>I&#x27;ve said before that
    I don&#x27;t understand why the Navier-Stokes Millennium Prize problem gets so
    much press, for example, back in 2022:<p><a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=31227133">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=31227133</a>'
