  author: toebee
  text: Hey, thanks for the feedback. Agreed that comparison against MUL1 is lacking.
    Still doing experiments on what the best format might be (hence the &quot;v1 GGUF&quot;
    naming). I did internally run against MUL1 in the experiment process and got similar
    results to yours. But chose it because the weights stay exact on BF16 and INT8
    tensor cores, which may come in handy later (e.g. activation quants)<p>I&#x27;m
    happy to changing the format to whatever works best, and I&#x27;d say it isn&#x27;t
    our core contribution. And very cool work on pmcgx, will look into it!<p>I think
    our contribution here is that we calculate loss counting only the tokens the model
    writes in agent sessions, which then drives a width allocator. + banded output-layer
    widths with two-sided rounding. This lowers KL by around 3x, compared to plain
    Trellis.
