    ## Quickstart

    One command on Linux with an NVIDIA GPU and driver 570 or newer (downloads the fork's binaries and the files, checks them, and fits the context to your GPU):

    curl -fsSLO https://github.com/nari-labs/nari-llama.cpp/releases/download/b12431-nariv0/run.sh bash run.sh 3.0 # or 2.5, 2.0

    Or download and serve yourself, with llama-server from the fork:

    hf download nari-labs/Qwen3.8-27B-NariQ-GGUF \ Qwen3.8-27B-NariQ-3.0bpw.gguf Qwen3.8-27B-NariQ-mmproj-BF16.gguf --local-dir . llama-server -m Qwen3.8-27B-NariQ-3.0bpw.gguf --mmproj Qwen3.8-27B-NariQ-mmproj-BF16.gguf \ -ngl 99 -c 131072 --jinja --port 8080 \ --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0

    The sampling flags are the thinking-mode settings our scores used. -c 131072 fits a 24 GB GPU with little to spare; lower it if a display shares the GPU, or let run.sh pick the largest context that fits. Use -c 262144 (the model's full context) on 32 GB or more. GPU memory with the vision projector:

