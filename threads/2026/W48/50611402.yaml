  author: mmastrac
  text: Interesting - we&#x27;ve been working on something similar, but found that
    calibration on the full sessions, but with the bit allocation on model-written
    tokens only was the most successful approach. I&#x27;ll have to see if it improves
    our output if we weight error only on model-written tokens, but from my experiments
    it seemed that this was getting us the best results in terms of KL.<p>Our approach
    might be slightly different however, as we encode multiple bit widths and then
    select per-profile manifest with the lowest KL we can solve at a given size using
    the per-expert&#x2F;layer encoded chunks. The most recent quantization run we
    did for GLM 5.3 has some of the numbers and all of the slices as well.<p><a href="https:&#x2F;&#x2F;huggingface.co&#x2F;kindlingai&#x2F;glm-5.3-exlr8-k2-k3-k4"
