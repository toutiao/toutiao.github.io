  author: mmastrac
  text: 'The trellis quants basically rotate the weights in a way so you end up with
    something that looks like Gaussian noise, then do a search over the optimum set
    of bits to encode that noise. What you end up with is a close approximation to
    the old weights (up to a certain point), but with the energy of the values &quot;shaved&quot;.<p>You
    lose the fine detail but keep the higher structure. Models are generally pretty
    resilient to it, especially larger ones. An over-quantized model tends to lose
    fine detail in its knowledge, lose some ability to track&#x2F;accumulate accurately,
    and occasionally loops (because the activations are rounded off too much and lose
    energy, and it gets trapped in a state where it just can&#x27;t escape).<p>When
    you quantize you try and get as big of a mix of calibration data as possible.
    You don&#x27;t need to match the training _set_, just enough data that you exercise
    99.999% of the most well-trod paths through the model. Anything outside of the
    calibration set is a crap-shoot as to whether it gets kept or not, but a well-balanced
    calibration set will keep performance near-unquantized.<p>On what calibration
    does: during quantization you try to minimize the error between the run of the
    model with original weights and the run of the model with the quant&#x27;d weights.
    Calibration data lets you weight the error away from the paths that are actually
    chosen with real data.<p>Apologies, this is a bit of a hand-wavey comment but
    it&#x27;s sort of how you can look at it without needing to deal with the hairier
    math.'
