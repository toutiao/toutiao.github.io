  author: Wiyseful
  text: The Rust crate you mentioned has been released. I went with 3 choices, each
    with a different name, because they made the most sense to me. You either forgot
    it, recalled it, or it was too easy (instant). Swipe left for forgot, swipe right
    for recalled, and in rare cases, swipe up for instant recall. I think humans get
    worse at rating things when there are more options, and we tend to rely on instinct
    or develop decision fatigue. This is mostly based on my own experience, though,
    but I know some others on Reddit have mentioned the same thing about Anki with
    the Hard rating. I also think fewer options make going through decks quicker over
    time. People save, idk, maybe 300ms per card, needing to think about one less
    decision. I also think my names are more obvious compared to the traditional Easy,
    Hard, Good, Again. Those names always forced me to really think about what the
    card actually was, while the names I use for Olumino are more direct.
