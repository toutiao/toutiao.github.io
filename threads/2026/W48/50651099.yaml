    interesting about how it teaches you more with less, and gives you more &quot;passive&quot;
    exposure (i.e. see Krashen&#x27;s &quot;input hypothesis&quot;, basically understanding
    forms naturally as a result of merely being exposed to a language).<p>As for SRS,
    I ended up with a model of &quot;tiers&quot; (analogous to CPU cache levels),
    where for obscure vocabulary, or anything where it&#x27;s acceptable to spend
    5+ seconds struggling to remember, regular SRS is fine, but for anything where
    fluency matters (which is most real world skills), you want a fluency-oriented
    scheduler (or to at least crank up the desired retrievability, which has a similar
    effect).<p>Just to illustrate, if you visited a doctor, would you want him to
    spend 5+ seconds remembering what Lupus is? No, that would be ridiculous! It needs
    to be &quot;overlearned&quot; (automatic, near-instant), which is why I think
    the word overlearning is named incorrectly. It&#x27;s just called being good at
