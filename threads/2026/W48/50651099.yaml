  author: barrell
  text: 'I also had similar realizations about Anki. Optimizing for the fewest repetitions
    of a word often is counter to optimizing for the experience of using the reviews.<p>Giving
    up just 1 or 2 points of efficiency resulted in me doing 50-100% more reviews
    per day, which results in a massive amount more learned per day.<p>WRT seeing
    a word as infrequently as possible, this doesn’t translate super well to language
    learning. What really helps is, as you mention, seeing a word as much as possible.
    Not necessarily <i>reviewing</i> it as much as possible, but at least some exposure.<p>With
    my application [1] I ended up settling on use really long sentences, where every
    word is reviewable. By collapsing your library down from say 1000 cards for 1000
    words into 100 cards with 1000 words, you end up passively seeing the words so
    much more, making new words a lot easier to understand in native speech (anectdotally
    speaking).<p>This has has tons of other knock-on benefits, from better word boundary
    recognition in speech to internalizations of more complex patterns to better comprehension
    of words (due to the same word being tested in every occurrence across all cards).<p>SRS
    is still SRS at the end of the day, but I don’t think that means it’s a helpless
    cause. I think with the right level of design, interactivity, and focus given
    to the user experience SRS can not feel like a chore. It does not have to be the
    highlight of your day, it just needs to not be a scourge.<p>(That and I think
    a lot of people spin their wheels with SRS. When it comes to language learning,
    the best motivation is actually recognizing&#x2F;using words you’re learning outside
