  author: andai
  text: 'Cool. I like the swiping. Very satisfying.<p>I made my own flashcard thing
    a few months ago, when I realized my goal was the opposite of Anki&#x27;s goal.<p>Anki
    — and all flashcard software these days — makes learning as efficient as possible,
    which they define as minimizing learning time. It does this by showing you things
    as rarely as possible.<p>Unfortunately that also maximizes pain, effort and forgetting,
    and minimizes fluency. I wanted the opposite of that, because I am lazy and don&#x27;t
    like effort, pain and failure. (I also like fluency!)<p>The goal of minimizing
    time makes sense for a law student or someone in med school, but for me that&#x27;s
    not a problem I actually have, and it creates all these other problems.<p>(Flashcard
    software is also known to have pretty bad user retention, which if I had to guess
    is due to the fact that it is effectively designed to be painful.)<p>So I just
    made a thing oriented around the exact opposite goal: showing me cards as often
    as possible! (And turns out I was half a century late with this idea :) <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Precision_teaching"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Precision_teaching</a><p>Then
    I realized I could just modify Anki instead of maintaining an entire software,
    so I did that instead.<p>Then I realized I am just too lazy to do flashcards,
    and creating new software did not solve that problem. To make the reps easy and
    to maximize fluency. (The quest continues... maybe I should try again when I get
    some Ritalin!)<p>p.s. I did a deep dive on this stuff and discovered that what
    we call &quot;overlearning&quot; is actually just what used to be called <i>learning</i>
    not so long ago, and that what we call &quot;mastery learning&quot; is actually
    <i>temporary basic competence</i>.'
  score: 0
