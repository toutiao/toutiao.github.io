  author: svara
  text: "&gt; what are the other components of capability<p>Energy efficiency; domain-specific
    knowledge, experience and training; biography, identity and social standing.<p>&gt;
    why do you think AI couldn&#x27;t subsume them?<p>I mostly don&#x27;t think it
    can&#x27;t (in principle). My point is there is a broad spectrum of capabilities,
    and intelligence has very high return in some of them and less of a return in
    others. Once you&#x27;re smart enough to master tic tac toe, getting smarter won&#x27;t
    help any more. I believe a large number of tasks have that property; the ceiling
    is task dependent, the exact scaling relationship is task dependent.<p>So my optimistic
    take is this: The human capability profile, and human&#x27;s preferred access
    to certain ingredients of capability, will for a long time to come be a great
    match for specific valuable niches. We&#x27;ll use tool-shaped, not artificial
    human-shaped, ASI where the capability returns on intelligence are really high.<p>That&#x27;s
    why it bugs me when people talk about AI like they want to build artificial humans.
    It&#x27;s a deeply inhumane R&amp;D project, and, I really hope, flawed."
