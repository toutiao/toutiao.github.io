    It seems to me that panics (and exceptions) are almost like an even worse version of the old function coloring problem. First, they’re not even part of the type system—whether some code can panic is only tracked via documentation, not types (well, Java sort of tried the types with checked exceptions, but it half-assed it and messed up the ergonomics). Second, the question isn’t really “can this code panic?” it’s “can this code panic and if so, is it recoverable, or would recovery corrupt your program’s invariants (and which ones)?” Whether code can panic can be conservatively approximated with static analysis, but whether recovery is possible is not generally going to be decidable.
    The net effect is that panics and exceptions really ruin composition and encapsulation.
