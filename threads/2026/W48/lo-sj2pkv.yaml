    If you are building such a program then you should not panic in the first place, unless there is no sensible alternative (e.g. the plugin's configuration it needs to function is straight up garbage).
    Panics are not meant for (or at least shouldn't be used for) error handling, but rather for signalling the equivalent of "the laws of physics have been violated and we can't proceed".
    If you follow that thought, the amount of places where code may panic will reduce drastically and mostly be limited to broadly speaking two cases:

    Errors that when they occur can't be handled in a meaningful way and mean the program is utterly broken, such that the only sensible course of action is to abort and restart the program from scratch
    Errors that are in fact handled (e.g. due to some precondition) but this can't be asserted statically/at compile-time, so you do something like "unwrap the OK value or panic if there somehow was an error after all"

    In this setup it's perfectly fine to abort and abandon, and if it truly isn't and you are indeed the 1% of people that need something else, then, well, my point stands of you probably needing something highly specific in the first place (though you will still benefit massively from the above thought process/approach).
