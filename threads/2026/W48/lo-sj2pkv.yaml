    I think the root of the issue here is that panics can in fact be handled (sort of), rather than being the equivalent of abort(3). The result is that you end up with errors as return values (e.g. Result), and an alternative error handling mechanism that has all the drawbacks of exceptions but without any benefits that justify it.
    The usual counter-argument is that you need to be able to catch panics for certain applications, such as mission critical embedded systems. I argue that this is the wrong way of thinking about it: panics are meant to signal "this code is utterly broken", and such errors aren't meant to be handled at runtime. If your car engine explodes while driving you're not going to say "Oh well oopsie-woopsie, let me apply some duct tape to it and then try driving again while pretending this didn't happen". Instead, you stop driving immediately, get out the car and call the fire brigade.
    For mission critical systems the approach would be an external supervisor of sorts, perhaps combined with some form of formal verification (ish) that all errors are handled correctly; something that's a lot easier when the possible errors are in fact part of the type signatures. Actually I would argue the former is sensible everywhere (and indeed is often used for server applications as well), the latter would be nice too but often comes at a high cost. Having Claudette-opus-420-69-whatever write the proof isn't much better, as a proof nobody understands is about as useful as no proof at all.
    There's also a nice side effect of panics being aborts: they force developers to do something once they hit production, because their impact is very visible, i.e. you can't just slap a catch_unwind() call on top of things and call it a day.
    I suspect that in the few cases the above wouldn't be sufficient the requirements are likely such that a highly specialized approach is necessary anyway, and I sincerely doubt Rust's current panic strategy (and all the issues it brings) would suffice in such a case.
