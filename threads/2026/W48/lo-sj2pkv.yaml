    I struggle with Rust and panics though. In theory I'd expect panics to happen way less than they actually do, and the pedantic thing to do in that case is often just "OK assume the whole program is no longer following invaraints". But this feels entirely unreasonable from an availability perspective.

    What is not really covered in the post here is that there really are two separate worlds of Rust. There is the world of Rust where you might as well disable panicking and just go straight to abort. A lot of code can work in that environment and it's the better default for that type of code.
    On the other hand though there are entire ecosystems that cannot live in that world at all because panics are frequent in practice, and concurrency will turn those panics into denial of service vectors. In remote applications quite a few of these can be attacker triggered.
    There is an alternative world where Rust wouldn't have relied on panics for quite as many operations, but panics are very common in the standard library and some operations can only work because panics exist (eg: overflow checks, there is just no syntax support for checking operations today). So that world needs to be supported somehow and it has to work better.
