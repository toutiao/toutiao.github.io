    The analogy actually works well, even in your example. If you follow the pattern of using panics only for "shit's fucked up, abandon all hope", then a panic occurring in one car (= the engine exploding) means it will happen for all other cars as well, and so you very much want to take them out of rotation ASAP.
    This of course changes when you start littering panic! and the likes all over your codebase for cases that are expected to happen (e.g. a file read failing), but that's not what panics should be used for.
    This is also the mistake Rust makes: it built its standard library (or at least the Mutex type) around the assumption that panics happen frequently (enough) and that the program is supposed to continue running (or at least be able to) when they occur.
    The presence of poisoning and the foot guns it introduces is just one side effect of this, but you also see this for example when joining threads: a thread may panic and this is propagated to the Handle::join method, but 99% of the time there's nothing you can do but panic again, so you end up with the same do_the_thing().unwrap() pattern that you end up with when using mutexes.
    Basically as it's implemented today, panics in Rust are effectively Java's unchecked exceptions, complete with all the problems those suffer from.
