    Folks can read this one and mine (linked in this one) and make up their own minds. I'd just like to point out one thing, though:

    While not live services, test suites show the same general issue. One failing test poisons a shared static and every test after it fails with PoisonError. This problem showed up for cargo, deno, polars and rustc itself.

    This is not an issue if you use cargo-nextest, which uses a separate process for each test for this among many other reasons. I think shared state across tests being corrupted is quite bad, and nextest is my vision for addressing this.
    (You might say I'm biased in favor of my tools. Of course I am. If I didn't think my tools were significantly better than the status quo, I wouldn't have built them. Nextest is widely used across Rust projects, which shows that many people agree.)
