    Panics were intended to always abort, which makes the story nice and easy: there is no way to recover from panics, and if you want recoverable errors you need to use return values.
    But now we are in a world where unwinding from supposedly fatal errors is a thing, with all the care and thought you need to put into every line because you can always be aborted. With exceptions, you always needed to write code that is safe to abort at any point. And turns out that with panic unwinding, you need do the same. So what have we gained, exactly?
    (I will grant that perhaps the machine code to do result code checking can be made to be more efficient than the instructions required to do stack unwinding, but I'm talking about the programmer-facing language level here.)
    I don't really buy the argument that exceptions are too easy or too verbose. Exceptions behave either like unwinding panics or return codes, and importantly: it's the caller that chooses how they behave. The consumer knows how the function slots into their program best, so putting the control into their hands seems right to me. And the strategies for handling exceptions are well-known: handle only very specific ones, let the rest bubble up, and catch-and-present-to-user at the very highest level. The days of "catch-and-continue" or "catch-and-log-and-rethrow" are well behind us.
    I agree knowing the types of errors that can be returned by code you call into would be very useful to know; this was true for exceptions and it is of course still is true for panicking (or not) code. Java tried something with checked exceptions as we all know, and it was bothersome and apparently declared unworkable.
    I really don't understand what the fuss about exceptions is. I think they're a great way of error reporting.
