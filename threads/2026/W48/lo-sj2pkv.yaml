    If you follow the pattern of using panics only for "shit's fucked up, abandon all hope", then a panic occurring in one car (= the engine exploding) means it will happen for all other cars as well, and so you very much want to take them out of rotation ASAP.

    Well let's play with this analogy and put some numbers to it. Because I think it's important to actually comprehend what that analogy does, and really what it means to not catch panics.
    Let's assume an event processing service handling 1 Million events a second. Given a chance of panic p (0.001%, very low), and c * N being the cluster capacity (events per second per process times number of processes, which here would be 1000 for the number of processes) and T being the time a service takes to reboot (out of service, let's say 10 seconds) with littles law 10% of all processes would be out of service at any point in time! If there was only 25% headroom, at twice the panic rate (0.002%) there is no slack left! At 10% the panic rate, so (0.01%) your backlog grows at 1.6B events per hour and half the fleet of processes is permanently down. Since there is very little isolation, an attacker just needs to find one panic to poison 10 seconds worth of compute for 1/1000ths of the fleet.
    And you're taking down everything in the process. Imagine the exploding engine would also immediately take down emergency services sharing that engine type at the same moment. There is no slack at all! In your proposed case you would take out all the cards, not just 1/1000th of the fleet lie in my example above.
    Now you can always try to build a service that does not panic, but given how Rust works as a language that is just not an option today. That's a different language all entirely.
