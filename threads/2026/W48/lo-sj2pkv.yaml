  text: |-
    Lock poisoning has always seemed sensible to me, from an Erlang-inspired perspective.

    Your code shouldn't panic. Outside of highly concurrent server applications and test suites, I'm a huge fan of mapping panics to abort.
    You definitely should never panic while holding a lock. In this case, it seems perfectly reasonable to me to poison the lock. This is similar to Erlang supervisor trees: Crashed threads propagate until they hit a known firebreak much higher up. Anything which even looks at a corrupted lock should be under massive suspicion. Alternatively, treat panics while holding a lock as an automatic abort, even if you use Rust's fallback mechanisms to catch them otherwise (I'd love a mechanism to do this).

    Realistically, if you panic inside a locked section, you're on a rare error path. And rare error paths are notoriously buggy at the best of times.
