  text: |-
    There are methods for checked operations (e.g. i32::checked_add), but do you mean when a stdlib API internally does something that could panic even on a valid input?

    In theory yes, a lot of operations do exist checked now but that does not mean your code is going to do that. Very little code actually writes against checked math. I cannot tell you how many panics I observed based on working with binary data in just a slightly wrong way. From reading out of bounds often from some operations overflowing and silently accessing things. Don't forget that math in release mode does not panic, it just overflows. And then you have the entire class of RefCell related issues that only really panic at runtime, and often only once you start seeing bad inputs.
    It's one thing if you control 100% of your code and never write against the stdlib, but that's just not really the case in practice. And even the stdlib is full of panic hazards such as println!.
