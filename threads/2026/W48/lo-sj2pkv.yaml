  author: yorickpeterse
  text: |-
    But does that supervisor need to be at a process level?

    I believe it does. Assuming one follows the guidelines established by articles such as The Error Model, panics should be rare and not common. For example, triggering a panic because reading from a file failed is usually dumb; unless the program simply can't proceed in a meaningful way, though even then I believe it's best to try and handle it in a less destructive way.
    However, if a memory allocation fails or some function always receives the wrong arguments due to a programmer error (i.e not something caused by user input), then you should abort while screaming very loudly. Handling such cases in-process is at best naive and at worst broken, as there are entire classes of errors that upon occurring mean your program is in an unreliable/untrustworthy state. The classic example of this is a segmentation fault: if one occurs you could in theory try to handle it and march on, but there's no guarantee your entire program isn't replaced with a talking parrot at this point, such that whatever you try to do may in fact make matters worse.
    In a server environment the way you'd deal with this is to have servers crash and burn loudly, and rely on hardware/software redundancy (= multiple servers), along with building an infrastructure setup that can resist chaotic behavior; intentional or not, instead of trying to make this perfect unicorn program that magically handles every error in-process.
    Basically it's the Erlang school of thought, but with supervisors that exist outside of the OS process instead of it being part of the program.
