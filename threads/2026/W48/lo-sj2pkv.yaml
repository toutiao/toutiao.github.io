    Panics are not bad exceptions just because you can catch them.

    panics are meant to signal "this code is utterly broken"

    Yes!

    the approach would be an external supervisor of sorts

    Yes!
    But does that supervisor need to be at a process level?
    Imagine you're writing S3 in Rust. You have many requests in flight, they're mostly independent and stateless, and some of them are extremely long running and costly to abort. If one request panics, why should that take down the entire server process? If the code using shared resources within the server is written to be cancel-safe (i.e. using RAII types, scope guards, etc), panics can unwind the request task/thread, and the server to continue handling other requests without interruption.
    That's a request-level supervisor, rather than process-level. And panics remain a path of last resort to bail out of a truly broken request when it cannot continue.

    I suspect that in the few cases the above wouldn't be sufficient the requirements are likely such that a highly specialized approach is necessary anyway

    This is not highly specialized. A Rust S3 service would likely use async, and therefore also need cancellation safety, which is accomplished with all the same techniques (i.e. using RAII types, scope guards, etc). Add some discipline about propagating panics from subtasks—which can be done reliably with project-specific helpers and clippy rules—and you're done.
