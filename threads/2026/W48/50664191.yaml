  author: nchmy
  text: 'This is of utmost importance.<p>To the Apple sycophants and those who hate
    Chromium&#x27;s dominance: no one is trying to take anything away from you.<p>All
    that is desired is for any browser to be able to ship their full version on iOS
    rather than just a skin over Safari. If you want to use Safari still, great! But
    you&#x27;d also be able to use real Firefox, Vivaldi, Ladybird or anything else.<p>This
    would also allow organizations and app developers - who often provide crucial
    social and civil services - to finally have the capabilities that they need to
    provide competent PWAs on iOS. This isn&#x27;t generally possible because of how
    deliberately hobbled they are there - especially the install process, which is
    a requirement in order to access important APIs as well as have more robust persisted
    storage. Without this, developers are hesitant to build PWAs at all because a
    primary demographic is largely inaccessible.<p>Also, PWAs were Steve Jobs&#x27;
    original vision for the iPhone, until they discovered the golden faucet&#x2F;tollbooth&#x2F;extortion
    racket that is the app store. <a href="https:&#x2F;&#x2F;youtu.be&#x2F;QvQ9JNm_qWc?si=N9a8TPOaZ1LcUO-Z"
    rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;QvQ9JNm_qWc?si=N9a8TPOaZ1LcUO-Z</a><p>This
    excellent blog series explains everything about this in great detail. <a href="https:&#x2F;&#x2F;infrequently.org&#x2F;series&#x2F;browser-choice-must-matter&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;infrequently.org&#x2F;series&#x2F;browser-choice-must-matter&#x2F;</a><p>And
    please go sign the EU petition at <a href="https:&#x2F;&#x2F;action.open-web-advocacy.org&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;action.open-web-advocacy.org&#x2F;</a> and just
    generally follow and support the exceptional work that Open Web Advocacy - a small
    but enormously dedicated and effective team - has been doing towards educating
    and effecting change through global regulators.<p>Also, YCombinator itself is
    one of the many prominent signatories.'
