    browser (optionnaly using my self-hosted no-DNS&#x2F;no-TLS SMTP server, namely
    with an IPv6 literal &quot;mailbox@[ipv6:...]&quot;), in order to get a rate limited&#x2F;IPv6(probably
    on the same ipv6 prefix than the SMTP server) locked &quot;bearer token&quot;
    for some web APIs to provide the services where noscript&#x2F;basic HTML would
    be really alien&#x2F;too far apart (or to allow my own very specific application
