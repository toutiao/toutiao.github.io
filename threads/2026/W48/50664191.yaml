  content: "# Commission Responds, Declares Browser Competition a Digital Markets
    Act Priority\n\nWritten by OWA\n\n- [#Policy](/tag/policy/)\n- [#Apple](/tag/apple/)\n-
    [#EU](/tag/eu/)\n- [#DMA](/tag/dma/)\n- [#iOS](/tag/ios/)\n\nIn comments to [Politico](https://www.politico.eu/)
    regarding our open letter, the European Commission acknowledged the letter and
    noted that browsers are “effectively the entry point to the web” and one of the
    main ways publishers reach readers. They went on to say that **“browser competition
    is one of the priorities of the Digital Markets Act”**. The EU Commission also
    stated it is in talks to **ensure rival browsers “can effectively compete”** with
    Safari on iPhones and iPads.\n\n**Share and join the conversation: [Mastodon](https://mastodon.social/@owa/117687312255156230),
    [LinkedIn](https://www.linkedin.com/feed/update/urn:li:activity:7531994367532662813),
    [Bluesky](https://bsky.app/profile/open-web-advocacy.org/post/3n3bpv2golc2e) and
    [X](https://x.com/OpenWebAdvocacy/status/2126226370275754311?a=h3laT1psmXCxa3WTfbo).**\n\n##
    [#](#an-extraordinary-coalition-in-defence-of-the-web) An Extraordinary Coalition
    in Defence of the Web\n\nThe letter has garnered incredible support. We want to
    say a massive thank you to all the organisations, businesses and individuals that
    have stepped forward to defend the web's ability to compete fairly as an open
    platform for consumers and businesses alike.\n\nWhat is particularly extraordinary
    is the sheer diversity of the coalition, ranging from human rights, consumer rights,
    software freedom advocacy organisations to Europe's major publishing associations,
    prominent startup organisations, independent browser vendors and technology companies.\n\nThe
    breadth of this support demonstrates that browser and web app competition is not
    simply an issue for browser vendors, but one that affects the entire digital economy
    and society more broadly.\n\nSignatories to the letter include, among many others:\n\n###
    [#](#civil-society%2C-consumer-rights-and-software-freedom) Civil Society, Consumer
    Rights and Software Freedom\n\n- \n\n#### Open Web Advocacy (OWA)\n\nAn international
    coalition of software developers and technology experts advocating for an open,
    competitive and interoperable web.\n\n- \n\n#### European Digital Rights (EDRi)\n\nEurope's
    largest network of digital rights organisations, bringing together over 50 organisations
    to defend fundamental rights and freedoms in the digital age.\n\n- \n\n#### Norwegian
    Consumer Council\n\nOne of the leading national consumer rights organisation internationally
    recognised for its groundbreaking work on digital consumer protection. Behind
    the viral video [A Day in the Life of an Enshittificator](https://www.youtube.com/watch?v=T4Upf_B9RLQ).\n\n-
    \n\n#### ARTICLE 19\n\nAn international human rights organisation dedicated to
    defending freedom of expression and access to information worldwide.\n\n- \n\n####
    Free Software Foundation Europe (FSFE)\n\nThe Free Software Foundation Europe
    is a charity that empowers users to control technology. The FSFE helps individuals
    and organisations to understand how Free Software contributes to freedom, transparency,
    and self-determination.\n\n- \n\n#### European Citizen Action Service (ECAS)\n\nAn
    international, Brussels-based non-profit organisation whose mission is to empower
    citizens in order to create a more inclusive and stronger European Union by promoting
    and defending citizens’ rights.\n\n- \n\n#### Bits of Freedom\n\nA Dutch non-profit
    advocacy group focused on digital rights such as the right to privacy and communication.\n\n-
    \n\n#### Digitalcourage\n\nA German civil rights organisation with decades of
    experience defending privacy, individual freedoms and democratic values in the
    digital age.\n\n- \n\n#### Croatian Alliance of Consumers (UPH)\n\nA consumer
    federation in Croatia established to unite consumer protection groups and advocate
    for consumer rights.\n\n- \n\n#### Blueprint for Free Speech\n\nAn international
    human rights charity dedicated to defending freedom of expression, protecting
    whistleblowers and strengthening press freedom worldwide.\n\n### [#](#publishers-and-journalists)
    Publishers and Journalists\n\n- \n\n#### European Publishers Council (EPC)\n\nA
    coalition of Europe's leading media groups committed to defending freedom of expression,
    editorial independence and media pluralism, safeguarding the economic foundations
    of independent journalism and ensuring that publishers can compete fairly alongside
    digital gatekeepers.\n\n- \n\n#### European Federation of Journalists (EFJ)\n\nEurope's
    largest organisation representing journalists, defending the professional rights
    and editorial independence of over **296,000 journalists** through 76 associations
    and unions across 44 countries.\n\n- \n\n#### European Magazine Media Association
    (EMMA)\n\nThe representative voice of more than **15,000 publishing houses** producing
    over **50,000 magazine titles** across Europe, advocating for a free, diverse
    and economically sustainable publishing sector.\n\n- \n\n#### European Newspaper
    Publishers’ Association (ENPA)\n\nEurope's largest representative body of newspaper
    publishers, bringing together **14 national associations** across **14 European
    countries** to defend press freedom and the sustainability of independent journalism.\n\n-
    \n\n#### News Media Europe (NME)\n\nA major voice of Europe's news media industry,
    representing over **2,700 news brands** across print, digital, radio and television.\n\n-
    \n\n#### Global Forum for Media Development (GFMD)\n\nA global network of **over
    200 member organisations across more than 80 countries** , uniting media organisations,
    journalism support groups and civil society to strengthen independent journalism
    and defend media freedom worldwide.\n\n- \n\n#### Association of European Journalists
    in Belgium (AEJ Belgium)\n\nAn independent association bringing together journalists
    and EU correspondents to defend press freedom, democratic transparency and independent
    journalism.\n\n### [#](#competition-and-economic-policy) Competition and Economic
    Policy\n\n- \n\n#### Open Markets Institute Europe\n\nA competition policy think
    tank advancing antitrust enforcement, tackling concentrated corporate power and
    promoting open, competitive markets across Europe.\n\n- \n\n#### Balanced Economy
    Project\n\nAn international non-profit organisation tackling excessive corporate
    power and working towards a fairer, more democratic economy.\n\n- \n\n#### Enforce
    (Irish Council for Civil Liberties)\n\nA specialist initiative advancing digital
    rights through strategic litigation, regulatory enforcement and technical expertise.\n\n-
    \n\n#### Innovate Europe Foundation\n\nAn independent think tank bringing together
    European technology and business leaders to strengthen Europe's technological
    sovereignty, innovation and competitiveness.\n\n- \n\n#### Rebalance Now\n\nA
    German non-profit organisation advancing competition policy and tackling monopoly
    power through research, advocacy and regulatory engagement.\n\n- \n\n#### iconomy\n\nA
    Berlin-based consultancy and venture builder supporting European technology startups
    and fair competition in digital markets.\n\n### [#](#industry-associations%2C-startups-and-investors)
    Industry Associations, Startups and Investors\n\n- \n\n#### European DIGITAL SME
    Alliance\n\nEurope's largest network of digital SMEs, championing innovation,
    competitiveness and digital entrepreneurship.\n\n- \n\n#### Y Combinator\n\nA
    world-leading startup accelerator that has helped launch and scale some of the
    world's most successful technology companies, including Stripe, Airbnb, DoorDash,
    Reddit and Dropbox.\n\n- \n\n#### France Digitale\n\nA leading European startup
    association, advancing entrepreneurship, investment and technological innovation.\n\n-
    \n\n#### German Startup Association\n\nA leading voice for Germany's startup ecosystem,
    advocating for innovation and entrepreneurship.\n\n- \n\n#### Coalition for App
    Fairness\n\nA global coalition advocating for fair competition, consumer choice
    and open digital marketplaces.\n\n- \n\n#### Movement for an Open Web (MOW)\n\nA
    busine"
