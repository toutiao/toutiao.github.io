  author: irishcoffee
  text: "&gt; I am curious about how the prediction markets are handling this<p>You
    use funds to make bets and the lines move over time based on how the funds are
    distributed. I suppose another way of looking at it is like options &quot;trading&quot;
    in the US markets. You gain or lose alpha? over time relative to when you made
    the &quot;trade&quot;<p>Betting on things early with long odds that become obvious
    time is kind of the whole point. If your thought is to some how &quot;make this
    fair&quot; you&#x27;re working towards some sort of market where everything is
    100% efficient, everyone wins and loses the exact same amount over N days&#x2F;weeks&#x2F;months.<p>So
    the short answer is, put your money where your mouth is, which is why prediction
    markets &quot;work&quot; and narrow in closer to the actual outcome over time
    as the deadline approaches. The long answer is, without another dimension, such
    as money, no there isn&#x27;t a way to &quot;make this fair&quot; at all.<p>Neat
    site though."
