  content: |-
    Every Hacker News prediction since 2008

    # What Hacker News said would happen, and what actually did.

    We archived 666 prediction threads, extracted 13,947 measurable forecasts, grouped recurring ideas across 668 clusters, and graded matured claims against public sources.

    ## Current events vs. past HN calls

    ### NASDAQ 100 and S&P 500 Enter Correction on AI Capex Scrutiny and Fed Rate Hike Fears

    “The US stock market will experience a correction or crash in 2026 due to overvaluation, unproven enterprise LLM advances, and premature infrastructure investment.” (Dec 19, 2025)

    ### NVIDIA Board Reinstates Jensen Huang as CEO Following 11-Day Resignation

    “Jensen Huang will eventually return as CEO of Nvidia.” (Nov 16, 2026)

    ### Anthropic Goes Public on Nasdaq in Record $119.5 Billion Capital Raise

    “Anthropic will likely go public in November 2026 in one of the largest initial public offerings in history.” (Nov 12, 2026)

    ## Predictions by the year they were about

    ## Most-predicted recurring topics

    ### Autonomous Vehicle Adoption and Commercialization

    These predictions test the mainstream adoption and public deployment timelines of self-driving cars and trucks.

    406 predictions · 262 authors · 39.2% came true

    ### Artificial Intelligence Progress and AGI Timelines

    These predictions evaluate whether artificial general intelligence will emerge or if the industry will face an AI winter.

    403 predictions · 317 authors · 59.7% came true

    ### Global Geopolitical Conflict and China's Status

    These predictions assess the likelihood of major international wars, U.S.-China conflict, and internal political unrest in China.

    362 predictions · 221 authors · 51.3% came true

    ### Climate Change Policy and Environmental Impact

    These predictions measure expectations regarding climate acceleration, global policy consensus, and environmental mitigation efforts.

    316 predictions · 224 authors · 52.3% came true

    ### AI Impact on Software Engineering Jobs

    These predictions examine how artificial intelligence tools will alter the demand for human programmers and change the developer role.

    296 predictions · 220 authors · 40.5% came true

    ### Cryptocurrency Mainstream Relevance and Usage

    These predictions gauge whether cryptocurrencies will remain a niche technology or achieve widespread everyday transaction adoption.

    239 predictions · 185 authors · 40.4% came true

    ## Top forecasts

    > “folks at OpenAI or Google will get something crazy to happen with a huge amount of compute. It won't feel like AGI but it'll make AGI seem way less insane”

    Claim: Researchers at OpenAI or Google will achieve a major breakthrough using a huge amount of compute in the 2020s that makes AGI seem much more plausible without yet being AGI.

    cardigan · Jan 3, 2020 · about the 2020s · AI and machine learning · Artificial Intelligence Progress and AGI Timelines

    What happened: In March 2023, OpenAI released GPT-4 after training on massive compute clusters, marking a transformative breakthrough that made AGI widely viewed as plausible without itself constituting AGI.

    > “And keep in mind no doctor that I've talked to thinks this will be over any time before mid 2021.”

    Claim: The COVID-19 pandemic will not end before mid-2021.

    chollida1 · Mar 22, 2020 · about 2020–2021 · Health and biotech · COVID-19 Pandemic Normalization Timeline

    What happened: The COVID-19 pandemic continued through 2021, 2022, and 2023, well past mid-2021.

    > “- Some variant of WebGPT exposed to public, users realize it's already smarter than most people.”

    Claim: A variant of WebGPT will be released to the public in 2022, leading users to consider it smarter than most people.

    nmca · Dec 31, 2021 · about 2022 · AI and machine learning

    What happened: In November 2022, OpenAI publicly released ChatGPT, a conversational large language model application that quickly reached 100 million users and gained widespread acclaim for its intelligence and human-like capabilities.

    > “5. Donald Trump wins the election.”

    Claim: Donald Trump will win the 2016 US presidential election.

    isolate · Dec 27, 2015 · about 2016 · Politics and geopolitics · US Presidential Election Outcomes

    What happened: Donald Trump won the 2016 US presidential election on November 8, 2016, securing 304 electoral votes against Hillary Clinton.

    > “Trump wins presidential election”

    Claim: Donald Trump will win the 2016 US presidential election.

    bitcuration · Dec 27, 2015 · about 2016 · Politics and geopolitics · US Presidential Election Outcomes

    What happened: Donald Trump won the US presidential election held on November 8, 2016.

    > “Overall, a million dead globally before a vaccine is deployed.”

    Claim: One million people will die globally from COVID-19 before a vaccine is deployed.

    doggodad · Apr 1, 2020 · about 2020–2023 · Health and biotech · Global COVID-19 Case Counts and Death Statistics

    What happened: Official worldwide COVID-19 deaths reached 1 million on September 29, 2020, prior to the mass public deployment of Phase 3-tested COVID-19 vaccines in December 2020.

