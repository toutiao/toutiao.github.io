    From Consumer Rights Wiki

    People who paid for audiobooks with a credit card or with an [Audible](/w/Audible "Audible") credit, which the audiobook store Audible says it may issue as "part of a membership plan or a Service promotion", under terms that also say, "We only accept credit cards for payment of your membership fees", can no longer download them directly as computer files from Audible's US website; on the site they can listen with Audible's Cloud Player, which Audible says streams titles "as long as you're connected to the internet". Audible's help says "you can only download titles to your computer using AudibleSync", a Windows 10 and 11 app whose downloads "can only be played by transferring them" to a compatible MP3 player or accessibility device, and it points Mac owners to a separate page to "download audiobooks on a macOS computer". Good e-Reader, an e-reader news site, reported the removal on August 11, 2026 and wrote that the site's web browser interface "now only supports streaming via the online cloud player" or Audible's apps for Android and iOS.

    Good e-Reader also wrote that Audible sites in international markets, such as Canada, "still have the download button, for now".

    ## Removal of the website download button
    [[edit](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&veaction=edit&section=1 "Edit section: Removal of the website download button") | [edit source](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&action=edit&section=1 "Edit section's source code: Removal of the website download button")]

    Good e-Reader reported on August 11, 2026 that Audible had removed the "direct option to download audiobooks" on its American site as a computer file from the desktop library website.

    | Version | Desktop instructions |
    | --- | --- |
    | April 7, 2026 | Go to the Audible site, select Library, find the title, and then "select Download" |
    | July 24, 2026 | No longer had those steps; named streaming through Cloud Player from any supported browser and, for users with a computer running Windows 10 or 11, AudibleSync to "download titles and sync them to compatible MP3 players or accessibility devices" |

    Good e-Reader wrote that [Amazon](/w/Amazon "Amazon") had previously retired the legacy Windows app and discontinued Android app support on Windows 11, and that losing the web download button "leaves desktop users with fewer native offline options".

    ## Remaining ways to listen on a computer
    [[edit](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&veaction=edit&section=2 "Edit section: Remaining ways to listen on a computer") | [edit source](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&action=edit&section=2 "Edit section's source code: Remaining ways to listen on a computer")]

    Audible's current US "Download titles" help article says titles can be downloaded with AudibleSync "only if you purchased them with an Audible credit or a credit card". The same article says AudibleSync "does not support bulk downloads".

    Audible's help for listening in a browser sends people who want to listen offline to the "Download titles" article. A version of that help article dated July 6, 2026 said people can listen on a laptop or computer with the Cloud Player "since there's no Audible app for PC". The version dated June 8, 2026 did not contain that sentence.

    For Mac computers, which run macOS, [Apple](/w/Apple "Apple")'s desktop operating system, Audible's help describes an "Audible app for macOS" that is installed from the App Store.

    ## Background
    [[edit](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&veaction=edit&section=3 "Edit section: Background") | [edit source](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&action=edit&section=3 "Edit section's source code: Background")]

    Audible's Conditions of Use say Audible may issue credits "redeemable for content" as part of a membership plan or a promotion, and that credits "expire immediately" when a membership is cancelled or terminated unless they are used before then. Audible's homepage tells shoppers that "All titles purchased with a credit are yours to keep forever".

    An Audible help page with a 2008 copyright line described settings in Audible Download Manager, Audible's download software, for choosing "where and how you want your downloaded Audible content processed". The news site Windows Central reported on August 4, 2015 that Audiobooks, Audible's app for Windows 10, was available. In an email to users quoted by the news site [Softpedia](https://en.wikipedia.org/wiki/Softpedia "wikipedia:Softpedia") in January 2022, Audible said of its Windows App Store app, "We discontinued this app on January 13, 2022", and said users could continue to listen with it until July 31, 2022. Audible's help center says [Microsoft](/w/Microsoft "Microsoft") discontinued the Amazon Appstore on Windows 11 and that the Audible Android app "is no longer available or supported on Windows 11".

    ## Purchase and license terms
    [[edit](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&veaction=edit&section=4 "Edit section: Purchase and license terms") | [edit source](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&action=edit&section=4 "Edit section's source code: Purchase and license terms")]

    Audible's Conditions of Use, in the versions dated September 10, 2025 and November 2, 2026, say "When you purchase content from Audible, you are purchasing a license", subject to the rights and restrictions of Audible's License. The License, dated February 18, 2025, grants buyers who comply with it and the other Terms, including payment of any applicable fees, a "limited, non-exclusive, non-transferable, non-sublicensable license" for "personal and non-commercial use of the purchased content". A note in Audible's help on removing titles from the Library says "The titles you purchase with a credit or credit card are yours to keep".

    The Conditions of Use dated March 31, 2022 and September 10, 2025 encouraged buyers "to download the content promptly after purchase". Both said Audible "may continue" to make purchased content available for re-download but did "not guarantee" it. The version dated November 2, 2026 no longer contains those sentences. The 2022, 2025 and 2026 versions all forbid any attempt to "disable, bypass, modify, defeat, or otherwise circumvent" [digital rights management](/w/Digital_rights_management "Digital rights management") (DRM) or any other protection system applied to Audible content.

    [Lifehacker](https://en.wikipedia.org/wiki/Lifehacker "wikipedia:Lifehacker") writer Emily Long wrote on September 16, 2026 that people who buy titles on Audible would "expect that the files are yours to keep", but that "this isn't a guarantee". Consumer advocate Louis Rossmann said in a March 2024 video that he would no longer pay for audiobooks unless he got a file, such as an Opus or Vorbis file, that he could play on his own device.

    ## Kindle download removal
    [[edit](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&veaction=edit&section=5 "Edit section: Kindle download removal") | [edit source](/index.php?title=Audible_removes_download_option_for_purchased_audiobooks&action=edit&section=5 "Edit section's source code: Kindle download removal")]

    The technology news site [The Verge](https://en.wikipedia.org/wiki/The_Verge "wikipedia:The Verge") reported that, starting February 26, 2025, Amazon was removing a website feature that let buyers download purchased books to a computer and then copy them manually to a Kindle e-reader over USB. A pop-up warning on Amazon's website, reproduced by The Verge, said that from that date "the 'Download & Transfer via USB' option will no longer be available". Amazon spokesperson Jackie Burke said in a statement to The Verge that customers could continue reading
