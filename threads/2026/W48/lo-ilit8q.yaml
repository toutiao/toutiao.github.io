    Coupling human-designed automated provers with generative systems and throwing enormous amounts of search at problems does yield a more effective Blind Watchmaker.  How exciting this should be depends a lot on how easy the "watches" are to assemble from available parts - in biological terms, the mutation distance from known lemma/theorem assemblies to "interesting" theorems.
    We have very little empirical basis for answering that yet and I suspect it really is not easy to "guess" at.  Starry-eyed excitement like Aaronson's about the generalization seems considerably ahead of the evidence.  On the other side, poor earlier guesses of difficulty fuel "told ya so! 'Alleged Intelligence' beat you again!" narratives.
    What usually happens with automation (e.g. better compiler warning systems) is that the low-hanging fruit falls easily, while really hard stuff remains.  Our perceptions of what was hard, and why, just shift around. Learning what is hard/easy about any new automation is part of the process, but assuming what "you want" is easy is usually quite naive.  There is a very real sense in which this learning is just "discovering mutation distance" that was hitherto simply unknown (up to some luck factor).
