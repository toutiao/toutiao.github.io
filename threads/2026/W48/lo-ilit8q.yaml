    If the only thing defending an open ecosystem is one CEO who was sleeping with direct reports on top of everything else I'm not going to be very enthusiastic about the future.

    Yeah the state of things here is...not great. I think the main problem is incentives: Jensen makes money off of selling hardware, so having lots of small labs buying hardware for training, and inference providers buying hardware for inference, is beneficial, and thus he has a very strong incentive to encourage this. Most of these places are smaller and don't have the R&D to pursue use of NVIDIA alternatives, so as long as enough of them exist, the hardware moat sticks around. (Well, unless they got mostly banned in your country and now you've really gotta figure out how to make the locally sourced hardware work out...) But by extension, most of these places also have very little "political capital" if you will, so the only entity large enough to try and push for this is...well, NVIDIA. (And it doesn't help that most of them are in China, so you have some...well, sometimes genuine concerns, but also a lot of weird "national security" hand-wringing and such too. AIUI the Chinese government is not that into the immediate-term AI politics, and they even tried to block access to the NVIDIA GPUs they could get for a long time to push towards using local hardware. Of course you can kind of see the logic here, but it's also part of a broader picture where the government does not usually feel like playing international politics for this, as they see it as a longer-term tooling question moreso than "we are building god".)
    By contrast, OpenAI and Anthropic, being providers of an LLM, are incentivized to secure their position by reducing competition, and that's before you go into the weird EA bits of centralized control being supposedly necessary to prevent safety problems. Additionally, they don't really need to be tied to NVIDIA, since they have enough $$$ to play freely with alternatives like TPUs or Trainium or even the fully custom Jalapeño.
