    I’m not a math expert but this math-frenzy feels exactly the same: AI has made a very bold claim that nobody has been able to verify. Which, by all math standards, make the claim nearly useless.

    But the math claims are verified. Like, the RH proof has been checked by many independent Lean kernels. It's not like software unit tests where unit tests can show that a program behaves correctly on the cases you test, but they can't rule out unknown bugs.
    A Lean kernel isn't testing examples from the proof. It mechanically checks that all steps of a proof are valid. So if independent kernels accept the same formal proof, the claim is very far from "nobody has been able to verify".

    If it was not for AI but an unknown mathematician coming out from nowhere and claiming to have proven many millenium problems with a proof that nobody understand, nobody would ever react like this blog post.

    If an unknown mathematician came out of nowhere claiming to have solved several millennium problems and presented formal Lean proofs that were successfully checked by multiple independent Lean kernels, everyone would absolutely pay attention!
    The mathematician's rep, or whether anyone can understand the proofs, would be beside the point. The proofs are independently and mechanically verifiable. I don't understand why you think there would be no reaction to results that can actually be verified!

    You have to remember that people at Anthropic and OpenAI lie all the time.

    You don't have to take their word for it. You can take the proof and verify it with whichever Lean kernel you trust.
