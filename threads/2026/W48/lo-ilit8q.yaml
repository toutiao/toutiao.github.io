    Apart from people saying that Nielsen is a crank, I advise you to read the paper you cite, and (if you haven't) to do lesson 1 and 2 or something of proving in some dependently-typed system, e.g. Lean or Rocq. The fundamental design of these systems is that the statement of a theorem and its proof are separate entities — literally, the type of a function and its implementation — in such a way that if you manage to write that function body, you have a proof (assuming the checker itself is correct).
    With this background knowledge, what Nielsen writes just doesn't make any sense.
