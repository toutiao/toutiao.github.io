    Alpöge's "proof" of the Riemann Hypothesis is a fraud. It's essentially a tautology that tests its definition of RH against itself. So let's all endeavor to be less credulous than this guy.

    In plain English: The computer program that claims to prove the Riemann Hypothesis does
    not actually do so. One part of it is supposed to check a geometric condition, but that part is
    written so it always says “true” no matter what you give it. Even if you remove that fake check,
    the program still “proves” the result by copying the answer it was supposed to find and pasting
    it into the place where the answer was supposed to come from. Then it checks that the copied
    answer matches the original. Of course it does.

    Invalidity of the Alpoge Proposed Proof of the Riemann Hypothesis
