  author: teledream
  text: "&quot;Worse-is-better&quot; is really perceptive. Using SSH as a GUI is admittedly
    a dirty solution, but I find it practical. See, if I tried to build a cross-platform
    app supporting X11, Wayland, Windows, and macOS, then I&#x27;d really be making
    a GUI framework, and if I tried to abstract all of those universally, well, I&#x27;d
    still be making a GUI framework. Thus the case for SSH presents itself.<p>That
    said, current terminals definitely have rough edges. Being somewhat &quot;dumb&quot;
    clients keeps the attack surface smaller, but it&#x27;s also quite limiting. To
    address this (while keeping standard terminals working), I&#x27;ve been working
    internally on a prototype terminal client to hopefully get things smoother, which
    I&#x27;ll share updates when it&#x27;s ready, along with any open-source projects
    that come out of the infrastructure it needs.<p>I heard of Superlogical whilst
    initially working on Zydra, though I somehow missed the release of Rex, it&#x27;s
    definitely something I&#x27;ll have to look into.<p>Thanks for such a thoughtful
    comment."
