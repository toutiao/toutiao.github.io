  author: philsnow
  text: |-
    &gt; Next, we optimize graphics by sending a sort of &quot;grid&quot; of pixels. Each cell has its own updates, where the previous frame is compared to the current frame to catch and send updates, avoiding having to constantly stream the full screen.<p>mosh does this too, with the caveat that it&#x27;s not transparent to terminal escapes.  for instance, if you try to run some modernish &quot;tui framework&quot; remotely over mosh, things like clipboard access won&#x27;t work at all, because mosh just cares about how the terminal should look.<p>there are workarounds to smuggle the OSC sequences in other places, so you <i>can</i> get all escape sequences through.  I usually have a process tree that looks something like this<p><pre><code>  Ghostty
      |- screen -e^Zz -S meta
         |- screen -e^Oo -S workspace1
         |  |- zsh
         |  |- zsh
         |- mosh somehost -- screen -e^Oo -S remotework1
         |- mosh otherhost -- herdr
    </code></pre>
    and escape sequences work just fine from inside the nested local screen session, the screen-mosh-screen connected to somehost, and the screen-mosh-herdr on otherhost.
