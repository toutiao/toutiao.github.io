  author: Brian_K_White
  text: Come on man. No, ssh is not a gui framework. No matter how hard you squint.
    No matter what sloppy linquistic liberties you want to take, there is just no
    way to make that statement true even in the most artistic and impressionistic
    way possible.<p>You can render a gui on a dot matrix printer if you wanted to,
    and that does not make &quot;parallel port is a gui framework&quot;.<p>But aside
    from ripping apart the atrocious title... what about the actual idea?<p>There
    is no reason or advantage to delivering a gui via enhanced terminal graphics.
    It is not good engineering.<p>It&#x27;s amusing, sure. But that&#x27;s what it
    is, a silly thing that&#x27;s fun to do just to see it done.<p><i>some</i> <i>terminals</i>
    have <i>some</i> extra features that <i>can</i> be completely abused into rendering
    a gui, inefficiently, and unportably.<p>TTYs and vtxx terminals are so great because
    they are ubiquitous, but servers and clients that know kitty graphics are not.<p>Terminals
    are useful because they only use a tty, and all terminals since before they were
    even software or networked, all already support the same basic tty and terminal
    feature set. It&#x27;s a standard that everything in the world already supports.<p>It&#x27;s
    only useful as long as that&#x27;s true. Once you do anything else, you are no
    longer within that standard and now you need a special server and a special client,
    and then you no longer have any advantage for doing it over ssh except that the
    firewall rules already allow the ssh port.<p>It&#x27;s strictly worse to deliver
    a gui via terminal graphics than than just using RDP. There are more rdp server
    &amp; client implimentations on more platforms than any enhanced terminal graphics
    capable terminals, and they can all be tunneled over ssh if you want.<p>That&#x27;s
    totally disregarding X, NX, and RFB for different reasons in each case. They are
    also all better choices but they each also have some disadvantage. (X is inconvenient
    because although it has ui primitives &amp; other desktop features it&#x27;s client
    vs server is backwards from the way most people and firewall admins want to operate,
    and vnc &amp; nx are inefficient because they are plain framebuffers however compressed
    and differential).<p>But rdp has actual ui primitives and other whole desktop
    features like channels for sound and peripherals. It&#x27;s designed to actually
    do the job of delivering a ui.<p>And it&#x27;s old as the hills and purpose-built
    and already implimented many times over everywhere on everything since decades
    ago. I had rdp clients on 160x240 palmos phones at least as far back as 2000-2005.<p>This
    is a fun stunt but purely silly.
