  author: xxpor
  text: For TUIs, I wish a 5250-style block based terminal had won over VT100 stream
    based terminals.<p>For those not familiar, with a block oriented terminal, the
    native &quot;chunk&quot; of data is an entire screen. So you can put information
    in there like &quot;this is a text box&quot;. This allows, for example, you to
    move around the screen with tab and type _with no round trip back to the server_.
    There&#x27;s 0 latency. Data is only sent when you hit enter.<p>On high latency
    or flaky connections the experience is a million times better.
