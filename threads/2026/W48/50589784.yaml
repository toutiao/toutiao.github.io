  text: The X protocol is semantic[1] and when used as originally intended is very
    fast even on 1990s networks. But GUI toolkits ended up heavily relying on local
    rendering and shipping bitmaps over the wire, which is why Wayland advocates argued
    bitmaps are good enough.<p>It&#x27;s kinda like the way PostScript evolved into
    early PDF which evolved into modern PDF, where pages are basically assemblies
    of prerendered images. The original, semantic aspects are still there, just not
    used, or rather abused to dumb it down.<p>[1] At least in the way you mean. Semantic
    like SVG, which is still literal, just abstract.
