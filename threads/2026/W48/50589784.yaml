  author: goranmoomin
  text: 'Before we start abusing the terminal protocols for GUIs, I believe that we
    need some kind of protocol to allow text selection and copy&#x2F;paste between
    blocks of text, so that we don&#x27;t need tools that trim whitespace that was
    copied from the terminal[0].<p>There&#x27;s some prior work like how the OSC-8
    hyperlink id param[1], and a specification to tackle the issue[2].<p>I&#x27;m
    hoping that the Superlogical folks[3] can actually do this, in libghostty and
    Rex.<p>But also in tangent, I also do think that abusing the terminal protocol
    to do GUI stuff is kind of a worse-is-better type of situation, we specifically
    have a protocol (Wayland, Quartz, and so on) to do this stuff, and I&#x27;m hoping
    that we can decide to actually do something similar for the remote GUI situation.
    I believe that the Superlogical folks have plans to do this with Rex[4].<p>I believe
    that the remote-GUI situation has to be resolved, I&#x27;ve been talking about
    this multiple times. I thought that the web stack (HTML&#x2F;CSS&#x2F;JS) would
    be the  answer to adoption[5], but hopefully we can get a full-fledged solution
    that is compatible with the previously existing GUI apps as well.<p>&gt; - TUIs
    are not inherently superior to GUIs<p>&gt; - SSH, as a transport layer, should
    support not just forwarding a pty (as a TUI display layer), but a GUI display
    layer as well<p>&gt; In fact, these two arguments were already realized by UNIX
    30 years ago, and we already have one solution: the X protocol and ssh -X.<p>&gt;
    Unfortunately, X did not win out. We did not get the promised future where one
    can ssh -X into a remote machine, run gnome-control-center, and a settings window
    pops up and I can configure my remote computer. (If you believe that this works,
    try it out yourself. It is an abysmal experience.)<p>&gt; However the above needs
    still needed to be satisfied by so much people, and apps that needed it started
    to be developed as web servers, stuff like jupyter notebooks. It turns out that
    the web’s document format coupled with a styling solution and a client-side scripting
    language, with all of its warts and drawbacks, became a viable solution as a display
    layer for interactive apps. In fact, since it started from remote documents, network
    transparency is built-in.<p>&gt; It would be dumb to not realize that the HTML&#x2F;CSS&#x2F;JS
    stack did win a dominant position for desktop apps, with all of the Electron apps,
    and utilize the web as a display layer for the above. I see the project in a similar
    vein, i.e. utilizing HTML&#x2F;CSS&#x2F;JS to provide a display layer for remote
    apps via SSH.<p>&gt; Also note that Electron apps has the same split with X, where
    the display server and the client are separated: it&#x27;s called the &quot;renderer
    process&quot; and the &quot;main process&quot;, and the two processes talk via
    IPC (where the display server would be the renderer process running embedded Chromium,
    the display client would be the Electron main process, and the stuff that the
    client sends to the server would be the contents of the renderer JS bundle). I
    think, theoretically, it would be possible to run the main process separated from
    the renderer process on a different machine, with an appropriate IPC transport.
    I think this would be not far from the above idea?<p>[0]: <a href="https:&#x2F;&#x2F;tools.simonwillison.net&#x2F;cleanup-claude-code-paste"
    rel="nofollow">https:&#x2F;&#x2F;tools.simonwillison.net&#x2F;cleanup-claude-code-paste</a><p>[1]:  <a
    href="https:&#x2F;&#x2F;gist.github.com&#x2F;egmontkob&#x2F;eb114294efbcd5adb1944c9f3cb5feda#hover-underlining-and-the-id-parameter"
    rel="nofollow">https:&#x2F;&#x2F;gist.github.com&#x2F;egmontkob&#x2F;eb114294efbcd5adb1944c9f3c...</a><p>[2]:
    <a href="https:&#x2F;&#x2F;gitlab.freedesktop.org&#x2F;terminal-wg&#x2F;specifications"
    rel="nofollow">https:&#x2F;&#x2F;gitlab.freedesktop.org&#x2F;terminal-wg&#x2F;specifications</a><p>[3]:
    <a href="http:&#x2F;&#x2F;superlogical.com&#x2F;" rel="nofollow">http:&#x2F;&#x2F;superlogical.com&#x2F;</a><p>[4]:
    <a href="https:&#x2F;&#x2F;www.superlogical.com&#x2F;rex&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.superlogical.com&#x2F;rex&#x2F;</a><p>[5]:
    <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48728766">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48728766</a>'
