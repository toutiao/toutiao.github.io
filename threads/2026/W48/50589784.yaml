  author: orbital-decay
  text: Terminal giving you a janky and limited remotely accessible canvas you can
    abuse to make primitive GUIs doesn&#x27;t imply that &quot;SSH is a GUI framework&quot;.<p>A
    lot better solution would be designing a compact, semantic, styling-independent
    remote access protocol that doesn&#x27;t need bitmaps (unlike most currently available
    protocols), and uses good compression for actual pictures&#x2F;videos. That would
    make any GUI efficiently usable remotely through an adapter for an existing GUI
    framework, without extra bloat the browser has.
