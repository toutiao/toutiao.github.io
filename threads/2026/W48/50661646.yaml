  author: Joel_Mckay
  text: In general, people now must make a clear distinction between storage and archiving.<p>HDD
    above 4TB are now often always shingled writes, and have a shorter service life
    &lt; 3 years of fly time.  Above that, folks should always have a +2 spare on
    ZFS, and run the bit-rot detection process weekly.<p>For JBOD, the 8TB HDD is
    still the cheapest $&#x2F;TiB option I found. If you don&#x27;t have the rack
    space, than consider the higher capacity drives as a consumable operational expense.<p>Even
    the cheapest NVMe SSD will last 7+ years if treated properly. If powered on every
    month for auto-repairs.  OverlayFS root or a logging filesystem like F2FS will
    almost double the life of the drive to 12+ years.<p>Note, even if the SSD costs
    300% more upfront, the reliability of a good brand means your drive failure rates
    are much lower (if and only if you are not hammering a log on storage like the
    recent nvidia driver was doing.)<p>18TB LTO9 Tape is still the cheapest $&#x2F;TiB
    backup option, but the drives&#x2F;auto-loaders have a high initial fixed cost...
    The used units also tend to be near the end of their service life (often not worth
    the price.)<p>For personal workflows,  I spun up dual BD-R writers (omnidrive&#x2F;libredrive
    firmware) for cheap bulk 25G offline storage discs like it was 2017 (with the
    odd 100GB bdxl disc for firmware images). It was a trade-off for cheap media,
    10+ year data retention rating (M-disc last longer), and tolerable data transfer
    rates at 6x.<p>It is slow i&#x2F;o, requires manual loading, and is not an option
    for most performance applications. It is great because ODD suck in high-performance
    applications, so are not hit by hyper-scaling shenanigans.  ymmv =3
