  author: arcticbull
  text: Generally a parallel bus transmits an entire N-bit message at once, as N separate
    wires, with a single shared clock.<p>PCI has 32 address&#x2F;data wires, and a
    whole 32 bit message is output at once on the bus and a clock is toggled when
    the data is valid along with some contextual information.<p>PCIe for example has
    many lanes, each lane has a shift register that turns an N-bit message into N
    1-bit messages, which are shifted back in on the other end and turned back into
    an N-bit message. There&#x27;s no shared clock, each lane operates essentially
    independently, and the clock is recovered from the signals on the differential
    pair. The controller then turns each part of the message each serial lane transmits
    into one word.
