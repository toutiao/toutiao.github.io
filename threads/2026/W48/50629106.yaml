  author: arcticbull
  text: It&#x27;s actually explicitly forbidden for a single peripheral to use the
    USB 2.0 and 3.0 links at the same time as of USB 3.2, and there&#x27;s no way
    to split endpoints across the links.<p>In order for it to work you&#x27;d have
    to basically expose two full separate peripherals, one on the USB2 bus and one
    on USB3 bus, and they&#x27;d require their own descriptors and OS-side host contexts.<p>This
    works sometimes, operating systems are not required to support this mode of operation
    because the OS knows that both devices are attached to the same physical connector.
    It can mess up enumeration. It also prevents USB3 devices from being able to fall
    back to USB2 as required in the spec.<p>A USB3 hub likely has a separate USB2
    controller attached, if it doesn&#x27;t it&#x27;s non-compliant and not guaranteed
    to work.
