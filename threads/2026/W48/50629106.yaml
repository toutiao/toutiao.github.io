    we have it - a usb &#x27;protocol&#x27; - no layering, no symmetry - just a bunch
    of structs to dump on the wire.<p>To be fair, the original problem they were trying
    to address (keyboard, mouse, serial, printer ports, phone lines etc replaced by
    a single interface), they did solve in a very comprehensive way, and it benefited
    the consumers immensely, however the developer side of it is&#x2F;was really awful.
    vendor + hardware controller specific asymmetric host&#x2F;device stacks, no comprehensive
    &#x27;protocol&#x27; other than bit twiddling, incompatible power negotiations
    (config descriptor up to 2.0, and cc hardware channel for type-c), no OS metadata,
    and the list goes on..<p>We have not even started on the &#x27;beautiful&#x27;
    forest of descriptors to manage; and comprehending some of these would leave you
    wondering if you really understood at all (e.g. hid report descriptor). All in
    all, great way to age prematurely without having learnt anything worthwhile about
    protocols.<p>With all this said, it is really good that they maintained backward
    compatibility. Otherwise the list of books needed to grok usb would be something
    like &#x27;Effective USB&#x27;, &#x27;More effective USB&#x27;, &#x27;Exceptional
    USB&#x27;, &#x27;Modern USB&#x27;, &#x27;Performant USB&#x27; ;)"
