  author: jsmith45
  text: While this does largely work, there are a few complications.<p>The biggest
    one being power management, especially the cutting off of power to a specific
    port. If a host wants to cut off power to a 3.x device, it typically needs to
    know which 2.x port that device is connected to. The host internally can have
    some really wild mappings of 2.0 and 3.x hubs, controllers, etc, but the device
    tree or ACPI tables let it know exactly which ones are paired together for any
    port leaving the device. After that point it is assumed that the host can learn
    the topology from any hubs attached. The power management is tied to the 2.0 port.
    Unexpectedly splitting the topology could lead the host to instruct a hub to cut
    off power to the wrong port when trying to target a specific USB 3.x device.<p>Also,
    if a hub indicates that a device is drawing excessive current, and there is nothing
    communicating on the 2.0 lines, there is a risk of the wrong 3.x getting blamed
    by the host, possibly showing a warning popup to the user with the wrong device
    name, or similar.<p>This isn&#x27;t to say this is always a problem, because it
    isn&#x27;t but it is something to be aware of.
  score: 0
