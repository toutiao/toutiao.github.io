  text: 'Sure, let&#x27;s do that. Then I&#x27;d say USB-C has achieved two real world
    consequences: A large ecosystem of interoperable cables and devices (including
    finally being able to charge iOS and Android phones using the same cables&#x2F;chargers,
    with a little bit of help of the EU), and a couple of poorly behaved implementations
    threatening to &quot;ruin USB&#x27;s good name&quot;.<p>This might actually be
    the optimal outcome, and it might not possible to get the former without the latter:
    Limit complexity, and vendors will be incentivized to make proprietary extensions
    to the standard (see e.g. all the mutually incompatible ways to do &quot;fast
    charging&quot; on USB-A&#x2F;B); allow for complexity, and you&#x27;ll see more
    broken implementations due to mistakes and cost-cutting.<p>Try to make it iron-clad
    by requiring paid certification to even use the plug at all, and you&#x27;ll probably
    increase the gap between expensive &quot;official&quot; and cheap and spec-violating
    devices even further.'
