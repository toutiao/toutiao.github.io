  content: "[←all posts](/blog/)\n\n# Splitting USB-C: USB 3 and USB 2 on One Port\n\nNovember
    23, 2026\n\nI started building [restorekit.org](https://restorekit.org) dongles
    a few months ago at the [Recurse Center](https://recurse.com). They are small
    inline USB-C boards that sit between a host computer and a target mac. They set
    the target mac into DFUDevice Firmware Update: Apple's lowest-level recovery mode
    built into the boot ROM, so even a bricked Mac can be reflashed. mode over USB-PDUSB
    Power Delivery: the communication protocol over the CC wire used to negotiate
    power, roles, and vendor-defined commands. without having to touch the target
    at all, and work with an open-source toolkit for restoring macs without the need
    for another mac.\n\nThe original board, the **Dongle-Lite** , is USB 2 only. A
    single USB 2 hub ([`CH334F`](https://www.lcsc.com/product-detail/C5187527.html))
    connects both the dongle’s MCU and the target mac through a single cable, while
    a PD PHYPhysical-layer transceiver chip that encodes and decodes USB Power Delivery
    packets on the CC wire. ([`FUSB302B`](https://www.lcsc.com/product-detail/C132291.html))
    sends Apple’s DFU commands on the CC line.\n\nI recently learned from timo at
    [Twocanoes](https://twocanoes.com/) that newer Macs support USB 3 speeds for recovery.
    I obviously immediately wanted to support this on the hub for faster recovery,
    but the problem was cost. At first I designed a “proper” USB 3 board using a [`GL3510`](https://www.lcsc.com/product-detail/C7501408.html)
    USB 3 hub and a pair of TI SuperSpeed muxes ([`HD3SS3220`](https://www.lcsc.com/product-detail/C165155.html)
    and [`HD3SS3212`](https://www.lcsc.com/product-detail/C544517.html)). It basically
    doubled the parts count, and BOMBill of Materials: the full list of components
    and quantities required to assemble one board. cost, required me to increase the
    size of PCB to ~100 mm, and topped out at 5 Gbps transfers between host and target
    (USB 3.1 Gen 1).\n\nI really didn’t want to make a board that cost more than twice
    the Dongle-Lite just to get USB 3 speeds.\n\nSo with the 2nd version **Dongle-Pro**
    , I tried a kinda crazy USB-C experiment: drop the USB 3 hub completely, keep
    a cheap USB 2 hub on `D+`/`D-`, and route the USB 3 SuperSpeedUSB 3.x's dedicated
    high-speed TX/RX differential pairs, physically separate from USB 2's D+/D- wires.
    lanes as a straight passthrough from host to target on the same USB-C port. The
    idea being that _in theory_ the USB 3 and 2 controllers on a USB-C are completely
    independent, and should work simultaneously.\n\nSince high-speed USB 3 is super
    prone to interference I didn’t really have a choice other than to purchase a view
    boards and test it out.\n\nWell… I just got the boards in from JLC and… THEY WORK!
    They establish a full **10 Gbps USB 3.2 Gen 2** connection while connecting the
    dongle’s USB 2 hub and MCU over the exact same port. After some aggressive cost
    optimization, the 10 Gbps board also ended up **cheaper and smaller than the USB
    2 Dongle-Lite**.\n\n![Front and back 3D renders of the Dongle-Pro v2 PCB](/splitting-usb-c/dongle-pro-v2-renders.png)\n_Dongle-Pro
    v2 (21 x 48 mm)_\n\n## [How USB 3 and USB 2 Share a Port](#how-usb-3-and-usb-2-share-a-port)\n\nLike
    I mentioned earlier, USB-C is not a single data bus. Inside a standard USB-C port,
    USB 2 and USB 3 sit on completely different sets of pins:\n\nUSB-C 24-Pin Spec\n\nEvery
    USB-C port has two mirrored 12-pin rows: `A1` through `A12` on top, and `B12`
    through `B1` on the bottom, so a cable works rotated either way.\n\nA1GNDA2TX1+A3TX1-A4VBUSA5CC1A6D+A7D-A8SBU1A9VBUSA10RX2-A11RX2+A12GND\n\nB12GNDB11RX1+B10RX1-B9VBUSB8SBU2B7D-B6D+B5CC2B4VBUSB3TX2-B2TX2+B1GND\n\nUSB
    3 SuperSpeedUSB 2 (D+/D-)CC / USB-PDSBU (Apple UART)Power / GND\n\n- **USB 2 (`D+`
    / `D-`):** a single 480 Mbps pair in the center (pins `A6/A7` and `B6/B7` are
    shorted together).\n- **USB 3 (`TX/RX`):** 2 separate high-speed lanes on the
    outer edge. Only 1 set is active depending on orientation.\n- **Control & sideband
    (`CC`, `SBU`):** `CC1/CC2` detect cable orientation and negotiate USB-PD; `SBU1/SBU2`
    (`A8/B8`) are used by Apple’s 1.2 V debug UART.\n\nThis continues to the computer’s
    xHCIExtensible Host Controller Interface: the USB controller inside your computer
    that manages both USB 2 and USB 3.x root ports. controller: a single physical
    USB-C port is actually wired to two independent root ports: a USB 2 port and a
    USB 3 port.\n\nA standard USB 3 hub chip like the [`GL3510`](https://www.lcsc.com/product-detail/C7501408.html)
    is actually just two hubs in 1 package (a USB 2 hub and a USB 3 hub). On my first
    iteration of the Dongle-Pro, everything ran through that chip even though the
    dongle’s own MCU only speaks USB 2 Full Speed (12 Mbps) and has no need for the
    USB 3 speed.\n\nOn the Dongle-Pro v2, the two buses are split apart:\n\n- **USB
    2 (`D+`/`D-`)** runs into a [`CH334P`](https://www.lcsc.com/product-detail/C5373042.html)
    USB 2 hub. One downstream port goes to the target’s `D+`/`D-` (so DFU mode and
    any USB 2 device behave just like the Lite), and another goes to the dongle’s
    MCU ([`CH32X035G8U6`](https://www.lcsc.com/product-detail/C7437027.html)).\n-
    **USB 3 (`TX`/`RX`)** skips the hub completely. Each port’s two lane sets go into
    a [`CH9441P`](https://www.lcsc.com/product-detail/C54300797.html) 2:1 muxMultiplexer:
    a high-speed analog switch that routes whichever side of a reversible USB-C plug
    is active onto one pair of board traces.. Each mux reads its own port’s `CC1`/`CC2`
    lines to handle cable flip and connects the active lane set to its common side.
    The two muxes sit in the center of the board, wired straight together through
    a short corridor with no hub and no redriverAn active signal-conditioning chip
    that boosts and equalizes high-speed USB 3 traces to overcome cable and PCB insertion
    loss..\n\n_Pro v1 (hubbed 5 Gbps) vs. Pro v2 (split-bus 10 Gbps)_\n\n### [What
    Could Go Wrong](#what-could-go-wrong)\n\nThis sounded like it would work to me
    on paper, but there were a few things I thought could go wrong:\n\n1. **Two passive
    muxes in series with no redriver.** Every connector, ESD array, via, and switch
    adds insertion loss and reflections. I was hoping two [`CH9441P`](https://www.lcsc.com/product-detail/C54300797.html)
    chips back-to-back would pass 5 Gbps. But hitting 10 Gbps is even better.\n2.
    **Sharing the target CC lines.** On the target port, the [`HUSB311`](https://www.lcsc.com/product-detail/C7471922.html)
    PD PHY actively drives the CC lines to send Apple’s SOP” DebugA USB-PD packet
    framing addressed to a debug accessory rather than a normal device, required for
    Apple's DFU commands. VDMsVendor-Defined Messages: custom USB-PD packets. Apple
    uses them to trigger DFU, reboot, and serial debug without touching the keyboard..
    The target’s [`CH9441P`](https://www.lcsc.com/product-detail/C54300797.html) is
    also reading the lines to steer its lanes.\n3. **Host OS behavior.** Even though
    it made sense in theory, I really wasn’t sure if a machine would happily enumerate
    a USB 2 hub on a port’s `D+`/`D-` lines while a separate USB 3.2 Gen 2 device
    negotiated directly with the same port’s SuperSpeed lanes.\n\n## [On the Bench](#on-the-bench)\n\nWhen
    the boards arrived, I immediately plugged one into my mac, plugged an iPhone into
    the target port, and inspected the bus with `system_profiler SPUSBHostDataType`
    and `ioreg -p IOUSB`.\n\nHere is what macOS sees on a **single physical USB-C
    port** (`AppleT8132USBXHCI@01000000`):\n\n_One USB-C port on macOS: USB 2 hub
    on 0x01100000, 10 Gb/s target on 0x01200000_\n\nThe raw `system_profiler SPUSBHostDataType`
    output shows both sides active at once:\n\nUSB 3.1 Bus:\n      Location ID: 0x01000000\n
    \     Driver: AppleT8132USBXHCI\n     \n        USB HUB:\n          Location ID:
    0x01100000\n          Link Speed: 480 Mb/s\n          USB Vendor ID: 0x1a86\n
    \         USB Product ID: 0x8091\n     \n            Dongle-Pro-v2:\n              Location
    ID: 0x01120000\n              Manufacturer: RestoreKit\n              Serial Number:
    DP2-C2BDF2"
