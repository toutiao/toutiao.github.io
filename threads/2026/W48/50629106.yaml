  author: arcticbull
  text: TI addressed this on their forum a while ago.<p>&gt; Can you connect a USB
    3.0 device and a USB 2.0 device to the same downstream port of a hub?  We don&#x27;t
    recommend it.  The devices will enumerate and traffic will be routed correctly,
    but as noted above, the two devices would share a single port power control.  Also,
    the USB specification requires all USB 3.0 devices have the ability to drop to
    USB 2.0 speeds.  Since the USB specification does not allow for two different
    speed devices connected to the same USB port, TI cannot guarantee that all USB
    drivers &#x2F; host controller would support that implementation.<p><a href="https:&#x2F;&#x2F;e2e.ti.com&#x2F;support&#x2F;interface-group&#x2F;interface&#x2F;f&#x2F;interface-forum&#x2F;891702&#x2F;tusb8041-simultaneous-usb2-0-and-usb3-0-output"
    rel="nofollow">https:&#x2F;&#x2F;e2e.ti.com&#x2F;support&#x2F;interface-group&#x2F;interface&#x2F;f&#x2F;inter...</a><p>Is
    it gonna work? Usually, but not properly, and it&#x27;s not an approach I would
    recommend for any production devices.<p>If you are okay being non-compliant with
    the USB spec and hoping for the best, it&#x27;s an option for some small run stuff
    you test. For this application it&#x27;s probably fine because you know how your
    host controller behaves but it&#x27;s not a good approach in general, and may
    stop working at some point in the future as the busses are not independent. They
    share a power control and the same logical port identifier, and this is not a
    support configuration per the USB spec.<p>For the record I do think this is very
    <i>cool</i> and the only thing I&#x27;d change about the blog post is mentioning
    that the busses are not actually independent and this is not a supported configuration.
