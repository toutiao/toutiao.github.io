  text: "&gt; I mean how do define which bus is &quot;serial&quot; or &quot;parallel&quot;<p>As
    the wiki article says, look at how is the data (say a byte) carried over the wire;
    how many data lines are present? in SPI (assume 4 wire) - there is only one line
    per direction, so data is sent bitwise. In case of QSPI even though there are
    4x the lines, each line still sends one bit at a time.<p>Parallel interfaces like
    ULPI have 8 data lines, so they send byte at a time. Others like DDR4 have 64
    lines, so 64 bits are sent at once."
