    out into 4 more ports, each capable of 15W and 40Gbps. It&#x27;s also a bit weird
    that laptops generally have very impressive capabilities with multiple usb-c ports
    that can do so many things, but desktops for the most part have fewer and less
    capable usb-c ports.<p>The connector is complicated, but not from the user&#x27;s
    perspective aside from the above limitations. Maybe there could be a bit of colour
    coding or connector keying for low power and data rate devices to clear things
    up. But all things considered, usb-c is really good and better than the alternate
    history where we ended up with 10 different connectors, some of them optical and
    some not.'
