  author: lxgr
  text: It&#x27;s really only USB 2 and 3 that essentially ship two wirings and protocols
    in one device&#x2F;cable.<p>USB 2 is a pretty straightforward extension of 1,
    and USB 4 is, in many ways, actually just a standardization of Thunderbolt 3,
    which in turn are alternate modes of USB-C, i.e., a completely different protocol
    running on the physical wires that would normally be used for USB 3 data.<p>&gt;
    It&#x27;s like the IMAP working group saying &quot;yes, we&#x27;re 100% backwards
    compatible to POP3! We wrote a line into the spec that requires every IMAP server
    to also bundle a POP3 server...&quot;<p>That seems like a bad comparison, since
    POP and IMAP solve pretty different problems (mail retrieval vs. remote mailbox
    access and management).<p>And this is in fact exactly how HTTP 3 and 2 maintain
    backwards compatibility to HTTP 1 :)
