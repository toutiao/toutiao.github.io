  author: pmkary
  text: I came to write the same comment. I used to think that the dominance of U.S.
    is mostly because no other country has the capacity to develop operating systems
    and the world depends on a few OSes that are entirely developed there. Linux was
    never winning, windows was shit, but OS X and iOS, they were at one side undeniably
    high quality, and on the other side impossible to copy. So I always thought &quot;How
    can China win over US without an operating system&quot;. Apple had made it such
    that all Hackintoish efforts were blocked for some many years, and iOS was impossible
    to boot anywhere but inside of an Apple device.<p>Fast forward to now, and I have
    an amazing app sitting on my computer called &quot;Light Touch&quot; that allows
    me to install and emulate any version of iOS on my computer, proxity its network,
    install whatever IPA app I wish on it, and I can&#x27;t believe.<p>And this one,
    I thought you must be joking. Imagine all the decades long efforts by GNU to clone
    Objective-C, Foundation, Cocoa... and they still can&#x27;t even run NeXTSTEP
    software on GNUStep and GWorkspace. Then you wake up and see not one of teh libraries,
    not the bare XNU, but the whole fucking mac being running inside of Linux... I
    mean What the literal fuck.<p>Mac had this god-like image in my head as something
    made by who knows how many tens of thousands of world&#x27;s highest of highest
    engineers and designers. You could see that no app outside of the Apple entering
    its app store could have the quality of design and harmony that Apple&#x27;s own
    apps had. (I mean imagine one app outside of Apple in the days of iOS 4 or Leopard
    to have that quality of icons for example), then Apple with Ive lowered the bar
    to entry and all the other apps cached up and most even got way better than Apple,
    but that was still a different era and a different game. But look at the past
    few years. Apple introduced Liquid Glass---which to me was a way to say &quot;hey
    flat designers making cross-platfrom stuff in Figma, you no longer will be able,
    I want to introdue a UI component so complicated that you can&#x27;t bring it
    to Android&quot;, but then a matter of days liquid glass was everywhere. Figma
    and Sketch easily added it to their components, Flutter had it, everyone had it...
    I made my own in an afternoon. The iPhone Duo animation was perhaps 50% of its
    selling point and by the night you could have it on samsung as well as on a Mac...<p>This
    is insane, and it must be really a stupid thing to say, but to me Apple was something
    of the Da Vinci of my era. I could see all people trying to get to its quality
    and looks and everything but no one could, they always were ten times ahead of
    anyone and it was exciting to be sitting waiting to see what new thing they&#x27;re
    going to show in the WWDC. Now that godness is being killed for me, and it is
    painful to watch.
