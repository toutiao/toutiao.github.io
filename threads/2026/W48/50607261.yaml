  author: m132
  text: PAC is a standard Armv8.3 extension and has been implemented in a lot of processors
    outside of the Apple ecosystem [1]. Lots of PAC instructions use HINT space encodings,
    which makes them NOPs on unsupported processors, and those that don&#x27;t will
    just trap into the kernel, making it possible to simply skip or emulate them.<p>A
    great deal of AArch64 Linux distros already builds binary packages exclusively
    with PAC, and those continue to run on SoCs that lack support, like that of the
    Raspberry Pi.<p>[1] <a href="https:&#x2F;&#x2F;gpages.juszkiewicz.com.pl&#x2F;arm-socs-table&#x2F;arm-socs.html"
    rel="nofollow">https:&#x2F;&#x2F;gpages.juszkiewicz.com.pl&#x2F;arm-socs-table&#x2F;arm-socs.ht...</a>
  score: 0
