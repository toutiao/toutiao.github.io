  text: My understanding is that it’s the price of scaling (hey there’s an engineering
    lesson here). Can a small tribe have a fairly good life in a fairly large territory
    by hunting and gathering? Sure. But as soon as they start growing past the limit
    where their prey can naturally outgrow their predation of it, they starve. Agriculture
    can more reliably feed a much larger population before you hit scaling limits.
