    Amodei or Huang are the ones leading the progress here.<p>Progress towards what?
    The Industrial Revolution raised the living standards of the working masses because
    there was room to extract more resources from the environment. There was a hiccup
    in employment, but lost jobs were eventually replaced by new ones that allowed
    for even greater resource extraction. A crucial role was also played by socialist&#x2F;communist
    movements, which forced capitalists to become more competitive in terms of wages.<p>Neither
    of these conditions holds today. We are already overextracting, so any projected
    productivity gains will come at the expense of further deterioration of the planet
    we are still bound to. And there is also no real social movement that would force
    capitalists to transfer part of the productivity gains to working people.<p>That
    last part is already a dire reality. See [1] (also posted recently on HN) citing:
    &quot;We&#x27;ve already seen a substantial reduction in the share of national
    income going to workers.&quot; I.e. the GDP per capita which is the focus of TFA
    is just an average, and its increase does not translate to an equitable increase
    of the income of workers.<p>So, anyone drawing parallels between the Industrial
    Revolution and a potential upcoming AI Revolution, is up to for a rude awakening.
    The &quot;cushy programming jobs&quot; are just the canaries in the coal mine
    in this case. If the workers who enabled the AI revolution are excluded from its
    fruits, it begs the question of how the rest of the workforce will benefit.<p>[1]
