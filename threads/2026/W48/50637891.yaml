    a collective level):<p>&gt; <i>Now it is true that the needs of human beings may
    seem to be insatiable. But they fall into two classes --those needs which are
    absolute in the sense that we feel them whatever the situation of our fellow human
    beings may be, and those which are relative in the sense that we feel them only
    if their satisfaction lifts us above, makes us feel superior to, our fellows.
    Needs of the second class, those which satisfy the desire for superiority, may
    indeed be insatiable; for the higher the general level, the higher still are they.
    But this is not so true of the absolute needs-a point may soon be reached, much
    sooner perhaps than we are all of us aware of, when these needs are satisfied
