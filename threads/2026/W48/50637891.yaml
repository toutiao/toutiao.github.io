article:
  url: https://basilhalperin.com/essays/macrohistory.html
  title: Macrohistory in Six Facts — Basil Halperin
  fetch_status: success
  content: "* * *\n\n# [Essays — Basil Halperin](../essays.html)\n\n# [Essays](../essays.html)\n\n*
    * *\n  \n\n Macrohistory in Six Facts \n\nNov 24, 2026\n  \n\n[Joe Stiglitz](https://web.archive.org/web/20190826150916/http:/www.basilhalperin.com/blog/2013/09/stylized-facts-versus-statistical-tests/):
    “Economists spend enormous energy providing refined testing to their models. Economists
    often seem to forget that some of the most important theories in physics are either
    verified or refuted by a single observation, or a limited number of observations
    (e.g. Einstein’s theory of relativity, or the theory of black holes).”\n\n  \n\nCan
    we condense down the most important lessons we’ve learned from macro and macrohistory
    to a minimal set of facts? Here is one attempt: macrohistory in six (plus or minus)
    facts.\n\n  \n\n## **FACT 0: GDP per person correlates with good things**\n\n![](../essays_media/0a_happiness.png)\n\nWhat
    I have here on the X-axis is GDP per person, adjusted for inflation and cost of
    living differences. On the Y-axis is life satisfaction, based on going around
    and asking people, ‘on a scale of zero to ten, how satisfied are you with your
    life’.\n\nIn richer countries, on average people are happier.\n\nOr – in richer
    countries, on average people live longer:\n\n![](../essays_media/0b_life.png)\n\nOr
    – in richer countries, fewer babies die:\n\n![](../essays_media/0c_childmortality.png)\n\nAre
    all these good things just coming from people working more? No – in richer countries,
    people work less; and as countries become richer over time, people work less:\n\n![](../essays_media/0d_hoursworked.png)\n\nMore
    intangible things, too. You can ask people how much they trust their neighbors.
    In richer countries, people trust their neighbors more:\n\n![](../essays_media/0e_trust.png)\n\nOf
    course, we know market capitalism has its flaws – for example, richer countries
    emit more CO2 per person:\n\n![](../essays_media/0f_co2.png)\n\nAnd all of this
    is correlation not causation.\n\n![](../essays_media/0g_correlates.png)\n\nBut
    we’re going to run with this, and use GDP per person as our measure of how well
    we are doing.\n\nWhich brings us to:\n\n  \n\n## **FACT 1: Everyone used to be
    poor**\n\nThis is _the_ most important fact about human history.\n\n![](../essays_media/1_poor_microfounded.png)\n\nWe
    are ∼10 times richer than our great-great-great grandparents, who themselves in
    turn were ∼2 times as rich as Jesus of Nazareth.\n\nEveryone used to be poor.
    This is the most important fact about macro history.\n\nWhy did we used to be
    poor? We lived in a Malthusian hellscape:\n\n  \n\n## FACT 1b: Wages were stagnant
    before the Industrial Revolution\n\n![](../essays_media/1b_wages.png)\n\nThis
    shows the real wage of workers in England since 1250.\n\nPrior to the Industrial
    Revolution, any time wages rose, more babies would survive to adulthood, parents
    would have more babies, and the population would rise until wages were driven
    back to subsistence.\n\n![](../essays_media/1b_demand_curve_animated.gif)\n\nWe
    lived in a Malthusian hellscape. Until:\n\n  \n\n## **FACT 2: Growth accelerated
    with the Industrial Revolution**\n\nThe Industrial Revolution was the single most
    important event in human history.\n\n![](../essays_media/2_ir.png)\n\nWe went
    from 0.01% growth per year, up to 0.1% with the Industrial Revolution around 1750,
    to 1% with the Second Industrial Revolution around 1870, to the modern 2% growth
    rate.\n\nThe Industrial Revolution was the single most important event in macro
    history. It also brought about:\n\n  \n\n## FACT 2b: The Great Divergence\n\n![](../essays_media/2b_divergence_log.png)\n\nThe
    growth explosion from the Industrial Revolution did not take place everywhere
    and all at once. Many countries did not see faster growth and rising GDP per person
    until much later – and many still have not seen these much at all.\n\nBut let’s
    talk first about the frontier.\n\n  \n\n## **FACT 3: Growth _at the frontier_
    has been ∼constant in the modern era**\n\nThis is the most important fact in modern
    macro. Growth at the technological frontier – measured here as GDP per person
    in the United States – has been a shockingly steady 2% per year for the last 150
    years.\n\n![](../essays_media/3_frontier.png)\n\nYou can see a temporary blip
    down for the Great Depression, but otherwise the trend has been remarkably constant.\n\nRunning
    water, electricity, automobiles, computers, the web – all show up here as a continuation
    of a steady 2% per year trend.\n\nWhat about the rest of the world?\n\n  \n\n##
    **FACT 4: Income varies enormously across countries**\n\n![](../essays_media/4_distribution.png)\n\nThe
    figure here has on the X-axis, income per person per day. You can see, for example,
    that even the poorest 11% of people in the United States have on average a higher
    income than the median person in Bangladesh or Ethiopia.\n\nIncome varies _enormously_
    across countries. Those of us born in the United States are so, so lucky.\n\nWell,
    are we stuck with these enormous differences? No:\n\n  \n\n## **FACT 5: There
    are growth miracles – and growth disasters**\n\n![](../essays_media/5_miracles_log.png)\n\nHere
    again we see the United States up top as the frontier.\n\nJapan and South Korea,
    at the turn of the 20 century, were ∼as poor as sub-Saharan Africa is today. But
    Japan and South Korea caught up close to the United States. There are growth miracles.\n\nBut
