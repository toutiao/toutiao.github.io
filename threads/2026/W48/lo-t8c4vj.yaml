  author: tombh
  text: 'Live streaming a personal research project to explore reimplementing the
    terminal architecture from scratch: no kernel TTY driver, no PTY, no escape codes.
    I''ve actually managed to carve out time to focus on this almost full time for
    the next year. Of course it would be great to have something groundbreaking and
    popular at the end of it, but I''m also making sure to let myself dive deep into
    the history of current terminals. There''s so much lore there that explains and
    contextualises modern computing as a whole. I''ve been describing this project
    to friends as a kind of pilgrimage, that it''s about the journey as much as the
    destination. It''s such a privilege to have this opportunity so I want to make
    sure I try to make the most of it.'
