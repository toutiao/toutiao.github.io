  author: nyrikki
  text: A Low-E window is frequently a worse obstacle for 915 MHz than a standard
    wood-stud&#x2F;drywall wall.  Being in the UK, you probably don&#x27;t have that
    option as much as here in the US.<p>I have a repeater on the small hill behind
    my house, and I also highly constrain the regions I route, but according to the
    stats page I passed about 5K packets to a router 123 km away.  Of course location
    matters there but the MeshCore companions that I have bought often have really
    really really bad antennas, no counterpoise etc...<p>It would be different for
    you but by buying a real tuned antenna from DigiKey and fitting and stuffing a
    8.24 cm (1&#x2F;4 wavelength for my frequency) wire as a counterpoise really fixed
    the T114 based module I was testing.  It is not about gain, people often buy high
    gain antennas for their companions that really, really suck.<p>That said I am
    in a fairly rural place, these technologies will suffer the same &quot;tragedy
    of the commons&quot; as 2.5GHz WiFi, where if everyone turned down their damn
    APs, everyone&#x27;s performance would be better.  But everyone pumps up the power
    etc...<p>LoRa is extremely low bandwidth, so while I use a fork of MeshCore, Meshtastic
    may do better in the long run for smaller, localized, or ad-hoc meshes.  You are
    right it isn&#x27;t going to replace cellphones etc...  It is high noise, low
    value spectrum space.<p>Hopefully the industry quits using crappy antennas and
    learns from the past two decades of cellphones, but these systems are all running
    in a &#x27;grey area&#x27; in every regulatory region I have dug into.  With everyone
    pushing more and more powerful repeaters, trying to shout above the noise vs deal
    with the limitations, at least in the US I think we are probably about a year
    or two from an import ban.<p>At least in the US, the FCC &quot;ID&quot; for chirp
    spread spectrum is for the 8 LoRa 500kHz uplink channels, so if it gets too popular
    they will close the loophole, probably by requiring radio units to have signed
    firmware.<p>For the US915 ISM band, not a SINGLE MeshCore&#x2F;MeshTastic companion
    radio is legal for the use they are actually being used for.  It would cost a
    company ~$5-10K in the use to get a modified FCC id for another channel, the fact
    that they haven&#x27;t spent that tells me they aren&#x27;t planning on long term
    sell-ability at least in the FCC&#x27;s US195 ISM band.<p>In the US the FCC won&#x27;t
    go after individual users, but ya...if it gets too popular or interferes with
    the new Direct-to-Cell in that range the window to get a FCC ID for that use case
    is also gone.<p>Not too much up on UK law, but if they don&#x27;t do it for the
    US market my assumption is that it is not worth that tiny investment to be legitimate
    so they are probably just planning on walking away, making what they can while
    it lasts.
