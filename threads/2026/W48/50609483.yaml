  text: 'But, at least in the UK, is completely drowning in spam. Unless the better
    countermeasures are available, it&#x27;s pretty bad.<p>Also &quot;range&quot;,
    wise - I need to hang my own small &quot;repeater&quot; in the attic to get to
    the node that&#x27;s half of the mile from me.<p>In the office (fourth floor of
    the office building in the built-up area of a large city), I can&#x27;t hear angone
    with my transceiver resting against the window.<p>With one transceiver in my hand
    and another two floors below (some 50 metres away), I can&#x27;t pass any message
    to the other device.<p>I can&#x27;t send a message from the hilltop 2 miles away
    from my attic......which I can see from said hilltop.<p>Im not sure what the MeshCore
    is for, but in my book it&#x27;s like all these lies on the 0.5W walkie talkies:
    &quot;16 miles range!&quot; - sure, mountaintop to the mountaintop. In the cities
    it&#x27;s crap, so the whole &quot;emergency comms&quot; is BS -- whole parts
    of the UK disappeared for a few days from the mesh because of the couple of bellends
    flooding the network with spam (thus, increased energy use) - I&#x27;m also pretty
    certain the regulatory requirements are completely ignored, judging by the number
    of packets (=airtime) I receive from my local repeater.<p>Even the software side
    of the Meshcore network (looking through the lens of the firmware) doesn&#x27;t
    make me very hopeful; whatever Meshtastic was at the beginning, it looks like
    they&#x27;re trying to fix the basic shortcomings of their network.<p>I don&#x27;t
    think this has any future bar perhaps sending sensor readings over LORA (and even
    that will require being a little mean, because of course meshcore set a pretty
    bad centre frequency over here, almost like they assumed $5 board with no quartz
    will stick to the impossibly high standards, thus they&#x27;re bleeding too far).'
