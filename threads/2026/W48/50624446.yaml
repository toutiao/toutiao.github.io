    development for years.\n\n## Cleanroom\n\nInitially I let the same agent do the
    reverse engineering as implementation. Later I had it go through and rip out anything
    that wasn’t a hardware fact (ie a register) and re-did the drivers with a cleanroom
    setup. One dirty agent with Ghidra, one referee agent in between to make sure
    nothing leaks, and the implementation agent. Subsequent ports used a variation
    of this setup from the beginning\n\nThe most work I have done personally on this
    project is writing this blog post.\n\n## Robotic eyes and ears\n\n![eternally
