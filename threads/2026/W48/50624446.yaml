  author: ACCount39
  text: I know that it&#x27;s common for vendors like this to use the same SoC dies
    in different products - like JieLi&#x27;s &quot;BT MCU&quot; chips that use the
    same dies as &quot;BT TWS&quot;, but with analog peripherals like headphone DAC+amp
    left unused. But halved SRAM?<p>Well, it&#x27;s not impossible that those are
    the same dies that start as 1 MB but get &quot;halved&quot; if one of the halves
    is defective, or for market segmentation reasons. And that the same happened to
    caches. But it does seem a bit unlikely.<p>Did you find any MaskROM&#x2F;calibration
    data chunks? Or vendor tools that might be writing to them?
  score: 0
  posted_at: '2026-11-25T23:19:30Z'
- id: '50649140'
  parent_id: '50648865'
  author: ACCount39
  text: Also, one way to tell if SL6806 is the same die as SL6801 is to compare MaskROMs.<p>Chips
    from the same family would usually have differences in ROM, while the same die
    with changed chip ID would, within a revision, have the exact same ROM. And it&#x27;s
    not that common for those kinds of chips to ever do a revision, let alone one
    that changes ROM. The die either works well enough or it doesn&#x27;t.<p>If the
    USB IDs&#x2F;serials that differ from chip to chip come from ROM and not something
    like registers or fuses, it&#x27;s different dies.
