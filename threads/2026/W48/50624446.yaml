    into SRAM - font rendering, alpha blending, scrolling, etc. This is where most
    of the “weeks of polishing” went.\n\n### Battery Life\n\nLargely comparable to
    stock. I hooked the player up to the PC’s line in or fake bluetooth sink and set
    it to repeat Daft Punks _Random Access Memories_. A script on the PC detected
    when it cut out.\n\n**Stock:** 21.29 hours wired, 20.07 on Bluetooth\n\n**Rockbox:**
    20.07 hours wired, 19.3 on Bluetooth\n\nThere was some variation in the battery
    voltage at start, and this was just one run, so expect some variation.\n\nBattery
    life is surprisingly impressive on this player,\n\n# Approach\n\nI’m one of those
    software guys, I can’t solder or find UART pads to save my life. This was an entirely
    software only port; I haven’t ever opened mine up.\n\nI hooked up ghidra-mcp and
    let it start pulling the firmware apart. It figured out how to inject tasks into
    the running RTOS (FreeRTOS) in bootloader mode. This allowed it to probe the hardware
    and even write drivers before attempting a Rockbox boot.\n\nTo be clear: this
    is _100% vibecoded_. I have only glanced at some of the code it wrote. I contributed
