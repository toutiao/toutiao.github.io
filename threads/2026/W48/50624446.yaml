  author: beala
  text: 'There are several companies like M5 that make development kits for prototyping
    IoT&#x2F;embedded projects. $40ish for a touch screen and battery and speaker
    etc in a small case. For example: <a href="https:&#x2F;&#x2F;shop.m5stack.com&#x2F;products&#x2F;m5stack-core2-esp32-iot-development-kit-v1-3"
    rel="nofollow">https:&#x2F;&#x2F;shop.m5stack.com&#x2F;products&#x2F;m5stack-core2-esp32-iot-de...</a><p>I
    had one of these in my box of unfinished projects. It&#x27;s fun to dream about
    the possibilities, but actually programming it is time consuming.<p>Or at least
    it used to be. I plugged it in and had Claude write a Yoto box clone for my kiddo.
    It serves a webpage for uploading tracks and I have the m5 rfid accessory so I
    can associate rfid cards with songs. I can add album art and there&#x27;s a carousel
    for picking songs. I even added some music visualizations and games.<p>I could
    publish the repo, but why bother? Just have Claude write you a new one from scratch
    exactly to your specifications. It takes about 30 minutes.<p>We live in an age
    of marvels and monsters. Riemann? Super intelligence? Is a singularity just around
    the corner? I have no idea but it doesn&#x27;t seem so unlikely these days. Life
    comes at you fast, as they say.'
