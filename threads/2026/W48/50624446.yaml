  author: ACCount39
  text: What a wild SoC.<p>XIP from SPI flash with dual core but no Icache&#x2F;Dcache?
    So that execution is kneecapped by fetches over a bus that&#x27;s optimistically
    quad at 40MHz, and if both cores ever try to XIP together, one starves to death?
    What the fuck.<p>I&#x27;d go looking for a cache peripheral that just isn&#x27;t
    enabled by the stock firmware. Because, why? Why would you do that in the design
    stage? Did they just expect the second core to be a DSP&#x2F;protocol slave that
    either runs a few DSP routines loaded manually into SRAM, or spends most of its
    time in BT ROM? Did they expect the firmware devs to grit their teeth and manually
    SRAM every little bit of code that needs to do things at a speed faster than &quot;glacial&quot;?
    All to save a couple KB worth of SRAM for the cache? On a chip that relies on
    the SPI flash die for the bulk of its code and assets, and already ships a 512KB
    chunk of SRAM?<p>At this point, I feel like the reason chips like that don&#x27;t
    see public documentation isn&#x27;t something like &quot;proprietary information&quot;,
    but that their makers live in shame of what they have created.
