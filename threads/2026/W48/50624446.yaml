article:
  url: https://jayd.ml/2026/11/14/rockbox-on-yp3.html
  title: Porting Rockbox to an undocumented $9 Aliexpress ‘YP3’ MP3 Player with LLMs
    | Jayden’s Blog
  fetch_status: success
  content: "[Rockbox](https://www.rockbox.org/) is a wonderful old custom firmware
    project for a variety of MP3 players and iPods. Flashing rockbox to my [Sansa
    E200](https://en.wikipedia.org/wiki/Sansa_e200_series)was a seminal moment for
    me: computers were everywhere, and if they didn’t do cool things, it was because
    no one had bothered to program them to do so. Looking back, that played no small
    part in my choice of career.\n\nIt seems like in 2026 there aren’t any cheap MP3
    players that Rockbox supports though. Reverse engineering an embedded platform
    like this is one of the hardest things I can think of, and I had decided to pay
    the big bucks for one of those delicious subsidized token plans to try and push
    it as hard as I could, and I did have a dirt cheap $9 Aliexpress MP3 player lying
    around.\n\nTL;DR: it ported Rockbox to a 512 KiB player, I was barely involved.
    Then, I had it build a re-usable toolkit/set of skills for future ports based
    on what worked from the first attempt approach, and Claude was able to get Rockbox
    running on another MP3 player (TS47) in 4 hours.\n\n**I made a quick website for
    the project: [https://rockslop.jayd.ml](https://rockslop.jayd.ml)**\n\nHere is
    the porting toolkit: [auto-rockbox](https://github.com/jaydens-tasty-slop/auto-rockbox)\n\n##
    Enter: The YP3\n\n![listing from aliexpress](/assets/posts/2026-11-14-rockbox-on-yp3/listing.png)\n\nThis
    is an unbranded player, sold under a variety of fake consonant soup brands on
    Amazon as well as Aliexpress. You can order them wholesale from Alibaba for less
    than $7 or so each.\n\nIt calls itself a `yp3_2.0.43` in the “About” menu as.
    [This appears to be a listing for a YP3](https://www.aliexpress.us/item/3256807764385286.html)
    - the original is gone. I paid $9.71 for mine, shipped.\n\n> NOTE: Before you
    run off and buy one, I have another rockbox port that is probably a week or two
    out, it is booting and stable, just needs more acceptance testing. This device
    is extremely similar but has 4 MiB PSRAM, so it has fewer compromises\n> \n> [This
    was $20 on sale](https://www.tengsen.vip/pages/mp3-player-w1.html)\n> \n> I also
    have a stack of other random MP3 players I intend to repeat this with\n> \n> See
    the project website: [https://rockslop.jayd.ml](https://rockslop.jayd.ml)\n\n###
    Special thanks\n\nIf anyone gets credit for this rockbox port, it’s [ilyakurdyukov](https://github.com/ilyakurdyukov/smartlink_flash)
    - they figured out how to get it into ROM Download mode (Down + USB), and wrote
    a utility to dump / write flash. Then I could be a little slop kiddie and not
    have to use a soldering iron.\n\nSee [the YP3 page](https://rockslop.jayd.ml/players/yp3/)
    on the project website for more info.\n\n## The good:\n\n- It costs $9. If it
    breaks buy another one.\n- USB-C and Blueooth!\n- There is a physical reset button,
    device is easily recoverable\n- Unbrickable (if you keep stock bootloader): holding
    down and resetting brings you into a DFU USB download mode.\n- Someone already
    figured out how to flash and interact with ROM DFU\n- That ROM DFU mode lets you
    poke flash and RAM.\n\n## The bad\n\n- **SoC:** Complete mystery meat Chinese
    “Smartlink SL6801” / Jointbees. Does not exist online \n  - 2x Cortext-M4 r0p1
    cpuID `0x410fc241`\n  - 192 MHz (stock does not vary CPU freq). Has an FPU\n  -
    Capable of Execute In Place (XIP) from flash, but no cache at all. Slow as dirt.\n
    \ - When XIP-ing code, cpu1 always waits behind cpu0 and can stall indefinitely
    if cpu0 is continuously fetching instructions from flash. Very easy to deadlock\n-
    **SRAM** 512 KiB plus about ~30 KiB for packets for the bluetooth radio.\n- 2
    MB Flash ROM\n- 128x160 full color LCD (RGB565)\n- Only 5 buttons - a dpad with
    a center press (center press is power & wired to PMU)\n- Bluetooth (with an undocumented
    stack)\n\nIt has 512KiB of SRAM, and the smallest existing Rockbox target was
    2 MiB, I was already scrolling Aliexpress for another one, but the LLM said “trust
    me bro I can make it happen” and I decided to try its luck.\n\n## The ugly\n\n-
    While the hardware is cheap but functional, stock OS is painful to use\n- It regularly
    crashes and watchdogs when in USB transfer mode\n\n# Where the port ended up\n\n![frequency
    response](/assets/posts/2026-11-14-rockbox-on-yp3/booted.jpg)\n\nYP3 running Rockbox\n\nAfter
    about a week it was booting a build of Rockbox on a crash diet - every single
    buffer had been cut to the bone, but it could start and play audio. Tuning, bug
    fixing, etc took another month or so.\n\nI am not aware of anything that isn’t
    working hardware wise.\n\nThe main feature you lose is concurrency while playing
    music and plugins. Codecs and plugins are already loaded and swapped around at
    runtime with normal Rockbox, but on this player there is one shared 128 KiB arena
    for both, so starting a plugin stops music playback.\n\n## Other cuts include:\n\n-
    No voice\n- Only English is supported\n- **DSP:** No pitch/speed control, surround,
    crossfade\n- Cuesheets\n- album art\n- Theme backdrop pictures\n- No dircache,
    so folders are read straight from SD card \n  - Large folders are truncated by
    default at 256 (configurable from 32 to 512)\n- Playlists are capped at 400\n-
    Codecs: WMA Pro, Musepack (MPC), RealAudio (Cook), and the chiptune formats SID,
    NSF, VGM, KSS, HES, SGC, ASAP. WavPack (16-bit), (24-bit/96 kHz)\n\n## What made
    it, somehow:\n\n- MP3 (up to 320 kbps), AAC/M4A (AAC+ too, HE-AAC v2 plays in
