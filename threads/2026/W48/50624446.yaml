    Shorten, ADX, VOX, SMAF.\n- The database.\n\n- Themes, without backgrounds. load
    and work, although heavy themes can cause the database to stop opening (handled
    gracefully with a warning)\n- Bluetooth\n\n#### A note on codecs\n\nMost of the
    codecs run from SRAM as normal. MP3, AAC, WMA, Vorbis and Opus, however, wouldn’t
