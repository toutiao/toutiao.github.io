  text: |-
    It is a serialization format like Python’s pickle: built-in, can serialize native objects and types, so flexible you can execute commands with so you should avoid it in anything user-facing.
    Yeah it’s scary, and I have encountered it in other libraries: one used ETF to encode SQL pagination cursors, and I opened a PR to switch to using the “safe” encoder that disallows remote command execution. Funnily enough, hex.pm was using the “safe” one as well, but there evidently was still a way to outsmart it.
