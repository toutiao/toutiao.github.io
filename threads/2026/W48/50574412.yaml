  author: johnwards
  text: |-
    So three main data sources build the world, and those are generic to build any part of England that has this LIDAR data.<p>1) UK gov LIDAR
    2) Open streetmap for the roads
    3) Open data sets for the roof colours&#x2F;land colours<p>That gives general placements, how the hills roll, fields etc.<p>Then if I want to focus on a specific area to get the accuracy higher I can then feed in pictures of places to agents and it will then use those pictures to increase the accuracy.<p>For best examples of that is the spawn point in Deddington, the British Motor Museum or Silverstone GP (escape to pause, then press Go To for a selection). Or M for map, z to see the whole thing, then click and teleport.
