  author: danparsonson
  text: Consider hiding everything behind Wireguard and if you can afford a second
    server and your provider lets you build a private network, use a gateway as your
    public server, then you can remove all direct public access to your main server.
    Configure your providers firewall as well as the software firewalls and now your
    public attack surface is one Wireguard port and the firewalls. Not perfect by
    any means but it gives you a bit of breathing space when patches are delayed.
    Of course you should still patch everything and keep good security within your
    private network.
  score: 0
