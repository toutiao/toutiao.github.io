  author: hunter2_
  text: I&#x27;m not who you asked, and I&#x27;m interested to see if they have a
    wildly different take. But here&#x27;s mine:<p>For someone who doesn&#x27;t use
    public DNS records (and therefore has a more localized way of resolving&#x2F;bookmarking
    the IP address), wouldn&#x27;t they also do just fine using a certificate signed
    by something manually added to their local trust store? It&#x27;s only once you
    have the general public resolving your domain that you also need the general public
    to easily validate your cert (through a chain that includes a root cert everyone&#x27;s
    trust store already contains).<p>Do both in public, or do both in private. While
    overkill and cumbersome, things like Group Policy, MDM, etc. can handle the &quot;I
    have many devices&quot; issue.<p>Or if you&#x27;re in control of the network E2E
    (LAN, or VPN with a CA cert) then there is no MITM and therefore no need for TLS.<p>Or
    if something like SSH rather than HTTPS, you&#x27;ve got TOFU instead of PKI.
