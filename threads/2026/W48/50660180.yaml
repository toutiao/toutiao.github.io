  text: '&gt; I couldn&#x27;t care less about knowing the details of how to configure
    some specific web app with all its quirks.<p>You might know this, but there could
    be security issues hidden in those details. One common example people miss is
    that Docker opens any ports you export on a container on the host as well. It&#x27;s
    so common they&#x27;ve added a warning[1].<p>&gt; Publishing container ports is
    insecure by default. Meaning, when you publish a container&#x27;s ports it becomes
    available not only to the Docker host, but to the outside world as well.<p>This
    means that you might set it up behind a proxy with authentication and everything
    as you should but Docker was helpful and enabled bypassing the authentication
    by accessing the port directly (on the local network).<p>So you should care.<p>[1]:
