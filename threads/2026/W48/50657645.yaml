  author: somenameforme
  text: The wire fraud criminal code [1] dates back to 1952. It was originally intended
    to criminalize various little scams that were playing out on television advertising
    - bait and switch, exaggerations of quality of characteristics, and other such
    stuff [that&#x27;s mostly expected in modern advertising ironically].<p>Because
    of this the legalese is super broad. It&#x27;s now anything that &#x27;obtains
    money or property by means of false or fraudulent pretenses or representations
    that is transmitted by wire, radio, or television communication.&quot; So basically
    any lie that can lead to the gain of anything material is wire fraud. For instance
    if you exaggerate your credentials on a resume that&#x27;s sent by email, that&#x27;s
    100% wire fraud. You&#x27;re probably not going to get prosecuted for that, but
    you could.<p>It&#x27;s an absurdly broad law that needs to be reformed, but it
    won&#x27;t be, precisely because it&#x27;s now a super law. Anytime the government
    doesn&#x27;t have an otherwise clear case against somebody - they can just charge
    them with wire fraud. And it comes with absolutely massive penalties including
    up to 20 years in prison.<p>---------<p>To be clear I&#x27;m not saying what happened
    here shouldn&#x27;t be illegal, but that there should be a law like &#x27;false
    billing&#x27; when a company charges for services that were not actually carried
    out. The current wire fraud law is just too broad and too powerful a weapon for
    the government to be expected to use responsibly in perpetuity.<p>[1] - <a href="https:&#x2F;&#x2F;www.law.cornell.edu&#x2F;uscode&#x2F;text&#x2F;18&#x2F;1343"
    rel="nofollow">https:&#x2F;&#x2F;www.law.cornell.edu&#x2F;uscode&#x2F;text&#x2F;18&#x2F;1343</a>
  score: 0
