  content: "# Understanding \"You are not expected to understand this.\"\n\nMany,
    many, many years ago I ported Unix V6 to the Vax, it ran as a virtual machine
    under VMS in supervisor/user modes (where VMS usually ran shells) - the code is
    AFAIK lost to history, though a DECUS paper survives. Later I ported V7 too.\n\nDuring
    the process I often came to that infamous line \"You are not expected to understand
    this.\" in the context switch code and, I indeed didn't understand it .... then
    one day I came to that code through a different path and it was obvious .... let
    me explain what's going on, here's a deep dive\n\nV6 Unix keeps per-process state
    in 2 places, a small entry in the process table, and the 'udot' a structure mapped
    by the MMU at a well known kernel virtual address referenced as \"u.\" which also
    contains the kernel stack. This is always mapped to the same address in all running
    processes, setting up this mapping is a core part of each process switch.\n\nV6
    uses a somewhat baroque way to save the state of a running process and restoring
    it, in V7 they switched to use save()/restore() which works like the more familiar
    setjmp()/longjmp(). It's deeply beholding to details in the V6 PDP-11 calling
    conventions - savu() saves enough state to return to it saves the stack pointer
    (r6) and frame pointer (r5), it doesn't touch r2-r4\n\n    _savu:\n    \tbis $340,PS
    // turn off interrupts\n    \tmov (sp)+,r1\t// pull the PC off the stack\n    \tmov
    (sp),r0 // pull the address to store off the stack\n    \tmov sp,(r0)+\t// now
    store the SP (as it was then savu was called) \n    \tmov r5,(r0)+\t// and store
    r5 too\n    \tbic $340,PS // turn interrupts back on\n    \tjmp (r1) // and return\n\nretu()
    and aretu() are essentially the same, both restore the current state, leaving
    the routine that called them walking on thin ice as the stack has changed out
    from under them, so has the frame pointer (and as a result any local variables
    that are stored on the stack) after you call them life gets a little scary, care
    must be taken, we're on thin ice especially once interrupts are turned on ....
    retu() differs from aretu() in that retu() also maps the udot into the last page
    of memory - retu is always passed the physical address of the udot, it's slightly
    magic in that the first 2 words of the udot is also u.u\\_rsav the place that
    retu() really returns from - here they are slightly unwound:\n\n    _aretu:\n
    \   \tbis $340,PS // turn interrupts off\n    \tmov (sp)+,r1\t// load pc\n    \tmov
    (sp),r0 // get address of save area\n    \tmov (r0)+,sp\t// restore stack pointer\n
    \   \tmov (r0)+,r5\t// restore frame pointer\n    \tbic $340,PS // turn interrupots
    on\n    \tjmp (r1) // return to caller\n    \n    _retu:\n    \tbis $340,PS //
    turn interrupts off\n    \tmov (sp)+,r1\t// load pc\n    \tmov (sp),KISA6\t//
    get physical address of u. into MMU\n    \tmov $_u,r0 // get kernel virtual address
    of u.u_rsav in r0\n    \tmov (r0)+,sp\t// restore stack pointer\n    \tmov (r0)+,r5\t//
    restore frame pointer\n    \tbic $340,PS // turn interrupots on\n    \tjmp (r1)
    // return to caller\n\nThere's another bit of magic here: r2-r4 are untouched,
    more about that later.\n\nSo here's the infamous context switch code (I've left
    out the bit that chooses a new process to run) - note swtch() as declared doesn't
    return a value, but at the end of the routine it explicitly returns \"1\". That's
    not that unusual, C at the time didn't have a void, and had a rudimentary type
    system, if you didn't declare something it defaulted to \"int\". Also prior to
    V7 C wrote things like \"a += 1\" as \"a =+ 1\" (which is ambiguous) so you find
    things like: \"rp-\\>p\\_flag =& ~SSWAP;\" in the code, this was normal at the
    time. It was common at the time to tell the compiler which variables you wanted
    to put in registers rather than on the stack for performance reasons, compilers
    weren't very smart. Modern compilers complain if you feed them code with the register
    keyword.\n\n    swtch()\n    {\n    \tstatic struct proc *p;\n    \tregister i,
    n;\n    \tregister struct proc *rp;\n    \n    \tif(p == NULL)\n    \t\tp = &proc[0];\n
    \   \n    \t/*\n    \t * Remember stack of caller\n             */\n            savu(u.u_rsav);\n
    \           /*\n             * Switch to scheduler's stack\n             */\n
    \           retu(proc[0].p_addr);\n    \n    \t..... some code to choose a new
    process to run, points rp at it\n    \n    \n     \t/* Switch to stack of the
    new process and set up\n    \t * his segmentation registers.\n    \t */\n    \tretu(rp->p_addr);\n
    \   \tsureg();\n    \t/*\n    \t * If the new process paused because it was\n
    \   \t * swapped out, set the stack level to the last call\n    \t * to savu(u_ssav).
    This means that the return\n    \t * which is executed immediately after the call
    to aretu\n    \t * actually returns from the last routine which did\n    \t *
    the savu.\n    \t *\n    \t * You are not expected to understand this.\n    \t
    */\n    \tif(rp->p_flag&SSWAP) {\n    \t\trp->p_flag =& ~SSWAP;\n    \t\taretu(u.u_ssav);\n
    \   \t}\n    \t/*\n    \t * The value returned here has many subtle implications.\n
    \   \t * See the newproc comments.\n    \t */\n    \treturn(1);\n    }\n\nSo what's
    going on here, let's ignore the if statement after \"You are not expected to understand
    this.\" for the moment, here's how a context switch works:\n\n- savu(u.u\\_rsav);
    saves the current process's state at the beginning of its udot\n- retu(proc[0].p\\_addr);
    context switches on to process 0\n- .... some code chooses a next process to run
    and points rp at its entry in the process table\n- retu(rp-\\>p\\_addr); switches
    the context to a new udot and loads its context from the new udot - at this point
    we're on the aforementioned \"thin ice\"\n- sureg() sets up the user space MMU
    mappings for the new process (on thin ice sureg() better be careful ...)\n- then
    we return 1 to all those calls to swtch() that never use it\n\nNow the ice isn't
    all that thin here, we restored the stack and frame pointers to how they were
    inside swtch() where we did the savu(u.u\\_rsav); any interrupts that come along
    are not going to trash the stack we're using. Also we're pointing at any local
    variables we were using at the point where we last did a savu()\n\nNow let's talk
    about the bit we're not supposed to understand: if for the new process, the process
    flag SSWAP is set we clear it and do an aretu(u.u\\_ssav); - return to the swap
    save address and then return 1 .... so where does SSWAP get set? The answer is
    whenever a process is swapped out because there isn't enough memory, and when
    it does we've just done a savu(u.u\\_ssav); saved the current stack state to a
    special swap save state. Mostly that is the newproc() routine called from fork()
    - newproc returns 1 for the new process from a fork() and 0 from the old one.\n\nHere's
    the relevant code:\n\n    newproc()\n    {\n    \t....\n    \tsavu(u.u_rsav);\n
    \   \t....\n    \n    \ta2 = malloc(coremap, n);\n    \t/*\n    \t* If there is
    not enough core for the\n    \t* new process, swap out the current process to
    generate the\n    \t* copy.\n    \t*/\n    \tif(a2 == NULL) {\n    \t\trip-&p_stat
    = SIDL;\n    \t\trpp-&p_addr = a1;\n    \t\tsavu(u.u_ssav);\n    \t\txswap(rpp,
    0, 0);\n    \t\trpp-&p_flag =| SSWAP;\n    \t\trip-&p_stat = SRUN;\n    \t} else
    {\n    \n    \t.....\n    \n    \treturn(0);\n    }\n\nWhat happens when we execute
    the code we're not expected to understand? It only gets triggered by a newly swapped
    in process with that flag set.\n\n    *\n    \t * You are not expected to understand
    this.\n    \t */\n    \tif(rp->p_flag&SSWAP) {\n    \t\trp->p_flag =& ~SSWAP;\n
    \   \t\taretu(u.u_ssav);\n    \t}\n    \treturn(1);\n\nSo we do an aretu(u.u\\_ssav);
    that reloads the stack and frame pointers to the point when savu(u.u\\_ssav);
    was executed in newproc() above, the xswap() has written out the udot at that
    point (shared between the new and old processes) to a swap file, that swap file
    has been reloaded and now we just switched to that new udot) the aretu() reloads
    the the stack and frame pointers to where they were in newproc() however the PC
    is still pointing to code in swtch() and it subsequently does a return(1) - it
    ends up returning a 1 to whoever c"
