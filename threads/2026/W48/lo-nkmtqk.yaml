    I’m intrigued by this description’s term “udot”: other things I’ve read about old unix kernel internals call it the “u area” (after the variable holding the pointer) or “user area” (because u points to a struct user). Nothing wrong with udot, it’s just unusual.
    (I had to refresh my memory a little because I have a parochial terminology clash: until the end of the 1990s the Computer Lab in Cambridge (the joint computer science / computing service departments) had a “user area” which was the primary terminal room, full of X terminals and BBC micros with bespoke serial terminal ROMs and a huge line printer and other old iron.)
