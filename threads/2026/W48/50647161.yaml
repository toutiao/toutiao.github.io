    I&#x27;m not &quot;in the game&quot; right now but here&#x27;s my take on this:<p><pre><code>  1. there are some servers where an NFS export is provided to some users basically &quot;read only&quot; and where the security model is &quot;if you&#x27;re in the same network you can access this data; we&#x27;re all friends but I&#x27;ll keep the crown jewels in that other walled off network away from y&#x27;all.&quot;  In that case, using NFS V3 style UID access management is good enough.  This (for those sorts of users) is an &quot;audit the config, update it to use only NFS versions that aren&#x27;t subject to this and disable the newer versions... probably also update the &quot;risk register and put a &quot;we&#x27;ll never actually do this&quot; story in place to update this to some object store &#x2F; proper data warehouse style system.

