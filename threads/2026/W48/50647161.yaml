    It really sounds like this is only NFS 4.1 and 4.2 and up(?). So my mitigation for right now (on distros that are out of support re: kernel) is simply to disable 4.1 and 4.2 protocol like the below (turn nfs-server off first),<p><pre><code>    $ echo &quot;-4.1 -4.2&quot; | sudo tee &#x2F;proc&#x2F;fs&#x2F;nfsd&#x2F;versions
