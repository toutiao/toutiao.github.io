    Just wow. How was this achieved? Let&#x27;s see:<p>&gt; Pre-auth heap overflow in the Linux NFS server (nfsd)<p>&gt; Set it to the minimum and every slot&#x27;s buffer is zero bytes. nfsd4_sequence() then shrinks the reply buffer to that limit before it accepts the slot. Pad the request&#x27;s tag so the buffer fills right after the SEQUENCE opcode, and the encoder quits without flagging an error. The server believes SEQUENCE succeeded and caches the whole reply, headers and tag included, into a buffer with room for nothing.<p>Then it causes an out-of-bounds crash:<p><pre><code>   &gt;&gt; BUG: KASAN: slab-out-of-bounds in read_bytes_from_xdr_buf+0x1bc&#x2F;0x390
       &gt;&gt; Write of size 80 at addr ffff888003a549cd
       &gt;&gt; __asan_memcpy+0x38&#x2F;0x60
       &gt;&gt; read_bytes_from_xdr_buf+0x1bc&#x2F;0x390
       &gt;&gt; nfsd4_sequence_done+0x5b0&#x2F;0x810
       &gt;&gt; nfs4svc_encode_compoundres+0x1bf&#x2F;0x240
    </code></pre>
    So yet another memory corruption issue that gives the attacker control of the execution and its possible to get root on the system and this is in the kernel itself so &quot;hardening&quot; does not remove the bug.<p>What a disaster.
