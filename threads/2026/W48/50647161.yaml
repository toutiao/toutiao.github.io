  author: dathinab
  text: "&gt;  finding such escalation vulns are a lot less?<p>if you are supper nit-picky
    about the definition of the class of vulnerability then yes<p>but if you look
    at the relevant &quot;fallout&quot; an attacker can cause then it&#x27;s not a
    good point for Windows as you often don&#x27;t need to actually get RCE in the
    NT kernel at all to do all the damage you want to do.<p>Through yes I think the
    Qubes and similar go in the right direction (VM sandbox everything). And micro
    kernel which put most work into (sandboxed) user-space seem increasingly like
    a &quot;insanely good&quot; idea. The &quot;speed tradeoffs&quot; are also often
    not really a issue at all. (1)<p>But it also gets increasingly more clear that
    trusting sandboxes is ... not always the best idea and the best thing to do is
    to make sure no untrusted code run at all. Sure that often isn&#x27;t feasible.
    But for servers there is an increasing case for systems which _can_ only run what
    you ship and nothing else (2). Only problem is that is inherently in conflict
    with JIT, scripting languages etc...<p>---<p>(1): Micro-Kernels have certain choke
    points, but outside of some HPC-stuff they might not matter at all and&#x2F;or
    can be worked around. E.g. Nintendo Switch might have slow hardware but isn&#x27;t
    exactly inefficient in running games on that slow hardware, it has a micro kernel
    (so has Switch 2). E.g. a surprising amount of web services are run in python
    which is many magnitudes more a perf. drawback then what micro kernels impose.
    And even many of the most common web services (e.g. node or java based) might
    run fast (V8&#x2F;Java can be reasonable fast) but would work &quot;fine&quot;
    even if they where 10%-50% slower (and for a lot of stuff we are speaking about
    ~5% throughput perf. drawback in average, much less if perf. is mostly compute
    in a small set of data and not moving data). And for LLM servers -5% throughput
    (between GPU and service) might matter, but you could most likely find a way to
    work around that, reducing it to a acceptable level not relevant compared to general
    time spend in the GPU doing compute.<p>(2): As in: A lot of hardware protections
    from read xor write memory to stuff which makes turning your code into gadgets
    or ROP very hard. Then added on top something which makes sure only signed code
    is loaded into executable memory. And make sure that all code is singed by the
    OS or your own key. (And yes that only makes sense for headless systems you never
    login like single service VMs (as it also implies there is no shell or any other
