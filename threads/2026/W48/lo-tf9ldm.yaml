  content: "# October in Servo: video captions and inert content\n\nPlus WebAudio
    nodes, image inputs, and more!\n\nPosted 2026-11-25\n\n[**Servo 0.8.0**](https://github.com/servo/servo/releases/tag/v0.8.0)
    contains all of the changes we landed in October, spanning 588 commits (a new
    record)!\n\n[![a black and white cat named Gary showing off new visual web platform
    features](/img/blog/2026-11-gary.png)](/img/blog/2026-11-gary.png)\n\nServo now
    renders **subtitles and captions** over `<video>` elements ([@TimvdLippe](https://github.com/TimvdLippe),
    [#48809](https://github.com/servo/servo/pull/48809))!\n\nWe’ve shipped new web
    platform features:\n\n- the **spelling-error** and **grammar-error** values for
    **text-decoration-line** ([@yezhizhen](https://github.com/yezhizhen), [#48883](https://github.com/servo/servo/pull/48883))\n-
    the [**progress()**](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/progress)
    CSS math function ([@Loirooriol](https://github.com/Loirooriol), [#48474](https://github.com/servo/servo/pull/48474))\n-
    **\\<input type=image\\>** ([@SilvioPilato](https://github.com/SilvioPilato),
    [#48265](https://github.com/servo/servo/pull/48265))\n- the **:focus-visible**
    pseudoclass ([@TimvdLippe](https://github.com/TimvdLippe), [#49255](https://github.com/servo/servo/pull/49255),
    [#49304](https://github.com/servo/servo/pull/49304))\n- the **beforeinput** event
    ([@dzfrias](https://github.com/dzfrias), [#48519](https://github.com/servo/servo/pull/48519))\n-
    the **\\<wbr\\>** element ([@mrobinson](https://github.com/mrobinson), [#48755](https://github.com/servo/servo/pull/48755))\n-
    the **auto** and **stable** values for the **text-wrap-style** property ([@nicoburns](https://github.com/nicoburns),
    [#48958](https://github.com/servo/servo/pull/48958))\n- **inert** trees and the
    **interactivity** property ([@skyz1](https://github.com/skyz1), [@TimvdLippe](https://github.com/TimvdLippe),
    [#48967](https://github.com/servo/servo/pull/48967))\n\nPlus a bunch of new DOM
    APIs:\n\n- the **DelayNode** and **ConvolverNode** WebAudio nodes ([@kevlu93](https://github.com/kevlu93),
    [@TimvdLippe](https://github.com/TimvdLippe), [#48658](https://github.com/servo/servo/pull/48658),
    [#47957](https://github.com/servo/servo/pull/47957))\n- the **timeout** property
    of **XMLHTTPRequest** in worker globals ([@CynthiaOketch](https://github.com/CynthiaOketch),
    [#48854](https://github.com/servo/servo/pull/48854), [#49023](https://github.com/servo/servo/pull/49023))\n-
    the **hspace** and **vspace** attributes on **\\<img\\>** ([@TimvdLippe](https://github.com/TimvdLippe),
    [#48605](https://github.com/servo/servo/pull/48605))\n- the **hspace** , **vspace**
    , **width** , and **height** attributes on **\\<input\\>** ([@TimvdLippe](https://github.com/TimvdLippe),
    [#49031](https://github.com/servo/servo/pull/49031))\n- the **target** property
    of **HTMLBaseElement** ([@sabbCodes](https://github.com/sabbCodes), [#48985](https://github.com/servo/servo/pull/48985))\n-
    the **CloseWatcher** interface, and the **closedBy** and **requestClose()** members
    of **HTMLDialogElement** ([@skyz1](https://github.com/skyz1), [@lukewarlow](https://github.com/lukewarlow),
    [@TimvdLippe](https://github.com/TimvdLippe), [#48955](https://github.com/servo/servo/pull/48955))\n\n##
    Real world compat \n\nFlutter web content no longer hangs now that we fixed a
    serious performance problem with typed arrays ([@jdm](https://github.com/jdm),
    [#48640](https://github.com/servo/servo/pull/48640)). [Example](https://flutter.syncfusion.com/#/range-selector/default)\n\n[![a
    flutter web app showcasing interactive graphs](/img/blog/2026-11-flutter.png)](/img/blog/2026-11-flutter.png)\n\nWe’re
    interested to hear how well your favourite websites run in Servo! Report successes
    in [this Zulip thread](https://servo.zulipchat.com/#narrow/channel/263398-general/topic/Servo.20web.20compat.20success.20stories/with/612898341)
    or [this Github discussion](https://github.com/servo/servo/discussions/49037),
    and failures [in our GitHub issues](https://github.com/servo/servo/issues).\n\n##
    Work in progress \n\nWith respect to accessibility in Servo, we report many more
    ARIA roles for DOM elements ([@alice](https://github.com/alice), [@mrobinson](https://github.com/mrobinson),
    [#48839](https://github.com/servo/servo/pull/48839)). These can be inspected with
    the `Get Computed Role` WebDriver command ([@lolaodelola](https://github.com/lolaodelola),
    [#47339](https://github.com/servo/servo/pull/47339)). Accessibility integration
    can be turned on with the `accessibility_enabled` preference.\n\n**WebGL2** support
    received lots of attention this month, with fixes to `getParameter()`, `drawBuffers()`,
    `readBuffers()`, `vertexAttribIPointer()`, `DEPTH_STENCIL_ATTACHMENT`, `getUniformLocation()`,
    `vertexAttrib4x()`, `pixelStorei()`, `texStorage2D()`, `texStorage3D()`, `texImage3D()`,
    `getInternalformatParameter()`, `blitFramebuffer()`, and `texSubImage2D()` ([@mxmgorin](https://github.com/mxmgorin),
    [#48651](https://github.com/servo/servo/pull/48651), [#48620](https://github.com/servo/servo/pull/48620),
    [#48678](https://github.com/servo/servo/pull/48678), [#48689](https://github.com/servo/servo/pull/48689),
    [#48751](https://github.com/servo/servo/pull/48751), [#48681](https://github.com/servo/servo/pull/48681),
    [#48911](https://github.com/servo/servo/pull/48911), [#48972](https://github.com/servo/servo/pull/48972),
    [#48590](https://github.com/servo/servo/pull/48590), [#49201](https://github.com/servo/servo/pull/49201),
    [#49289](https://github.com/servo/servo/pull/49289), [#48560](https://github.com/servo/servo/pull/48560),
    [#48571](https://github.com/servo/servo/pull/48571)). The feature remains gated
    behind the `dom_webgl2_enabled` preference.\n\nReading and writing mapped **WebGPU**
    buffers got a significant speed increase ([@sagudev](https://github.com/sagudev),
    [@jdm](https://github.com/jdm), [#48372](https://github.com/servo/servo/pull/48372)).
    WebGPU can be enabled with the `dom_webgpu_enabled` preference.\n\nJS script compilation
    can now occur off the main thread when the `dom_script_asynch` preference is enabled
    ([@Gae24](https://github.com/Gae24), [#45687](https://github.com/servo/servo/pull/45687)).
    Right now this only applies to non-module scripts.\n\nInitial support for the
    **backdrop-filter** property has merged ([@shubhamg13](https://github.com/shubhamg13),
    [#48829](https://github.com/servo/servo/pull/48829)). This can be enabled with
    the `layout_css_backdrop_filter_enabled` preference.\n\nServiceWorkers now fire
    the `statechange` event when changing states during initialization ([@gterzian](https://github.com/gterzian),
    [#48749](https://github.com/servo/servo/pull/48749)). ServiceWorkerContainer can
    listen for `message` and `messageerror` events ([@gterzian](https://github.com/gterzian),
    [#48680](https://github.com/servo/servo/pull/48680)). **Service Workers** remain
    gated behind the `dom_serviceworker_enabled` preference.\n\nThe **Geolocation**
    API has been implemented ([@webbeef](https://github.com/webbeef), [#48406](https://github.com/servo/servo/pull/48406)).
    No platform-specific backends to provide the device geolocation data have merged
    yet, so it remains disabled behind the `dom_geolocation_enabled` preference.\n\nDOM
    interfaces for **MathML** elements now exist, gated behind the `mathml_core_enabled`
    preference ([@tannal](https://github.com/tannal), [#48631](https://github.com/servo/servo/pull/48631)).
    There is no MathML-specific layout implemented yet.\n\nA new, native **SVG** implementation
    is in progress ([@mu-mostafa98](https://github.com/mu-mostafa98), [@jdm](https://github.com/jdm),
    [#48467](https://github.com/servo/servo/pull/48467)). This work is still in the
    early stages, but is intended to replace Servo’s dependency on the `resvg` crate
    to better integrate with page styling and animations.\n\n**IndexedDB** cursors
    now support the `update()` and `delete()` methods ([@kuntal-devrat](https://github.com/kuntal-devrat),
    [#48402](https://github.com/servo/servo/pull/48402)). The"
