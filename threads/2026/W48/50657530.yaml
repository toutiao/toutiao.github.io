  author: wilkystyle
  text: 'Jumping on this to add an additional warning: Just because an extension starts
    out safe does not mean it will always remain that way. This has been mentioned
    numerous times before on hacker news, but maintainers of any mildly to moderately
    popular browser extension are routinely offered tantalizingly high sums of money
    to either sell the extension to a less scrupulous third-party or to add data collection
    code for said third-party.<p>You are never 100% safe, but dramatically limiting
    the scope of what you trust is a great step in the right direction. I use two
    and only two browser extensions (uBlock Origin and Bitwarden) everywhere I go,
    and I have zero issues with ads on YouTube (or anywhere else, really).<p>Edit:
    I should also clarify that I am not speaking negative of this particular extension
    at all, nor the work that has gone into it.'
