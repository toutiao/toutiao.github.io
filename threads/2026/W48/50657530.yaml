  author: Gander5739
  text: Requiring user confirmation before updates, with a description of the change;
    finer-grained permissions (currently a dark mode extension needs to be given the
    right to inject javascript on all pages); allowing you to blacklist pages from
    extensions, like banking websites; splitting read and write permissions; requiring
    outbound endpoints to be explicitly requested for, instead of allowing all urls;
    etc. From the other side, password managers have to inject into the DOM, which
    means websites can pontentially read their content - that&#x27;s also quite messy,
    and shadow DOMs don&#x27;t address the security implications.<p>I think whilst
    there are a lot of problems with Android as a locked-down system, there&#x27;s
    also a lot to learn from it in terms of permissions and sandboxing.
