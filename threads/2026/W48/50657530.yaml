article:
  url: https://github.com/antonpictures/youtube-punisher
  title: 'GitHub - antonpictures/youtube-punisher: YouTube Ad Blocker - Chrome / Browser
    Extension · GitHub'
  fetch_status: success
  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n# \U0001F3AF YouTube Ad Punisher\n\n> Auto-reloads YouTube
    pages when an ad plays — preserving your playback position. Punish the ads.\n\nAuto-reloads
    YouTube pages when an ad plays — preserving your playback position. Punish the
    ads.\n\n## The Problem\n\nAd density on YouTube is channel-dependent and changes
    over time — some channels front-load several ads, others run none. Traditional
    ad blockers can get detected by YouTube's anti-adblock system (\"Ad blockers are
    not allowed here\"), and the skip button takes a few seconds to appear. You sit
    there, hostage.\n\n## The Solution\n\nReload the page. That's it. Two reloads
    and the ad is gone. Every time.\n\n\U0001F3AF YouTube Ad Punisher automates this:
    the moment an ad appears, it captures your exact playback timestamp, reloads the
    page, and YouTube auto-seeks back to where you were. No ads. No waiting. No skip
    button hunting.\n\n## Tips\n\n- Auto escape: after 3 reloads, the extension automatically
    switches to a helper tab for 4 seconds (George's discovery, now automated), then
    switches back. No manual tab switching needed.\n\nAuto escape: after 3 reloads,
    the extension automatically switches to a helper tab for 4 seconds (George's discovery,
    now automated), then switches back. No manual tab switching needed.\n\n- Ads keep
    coming after reload? Switch to another tab for a few seconds, then switch back.
    Chrome throttles background tabs, which lets the ad state settle — George discovered
    this works every time.\n\nAds keep coming after reload? Switch to another tab
    for a few seconds, then switch back. Chrome throttles background tabs, which lets
    the ad state settle — George discovered this works every time.\n\n- Incognito:
    see the Incognito section above.\n\nIncognito: see the Incognito section above.\n\n##
    How It Works\n\nAd detected → Capture timestamp → Reload page → Auto-seek to timestamp
    → Resume ↓ (if 3 reloads fail) Redirect to yout-ube.com (ad-free mirror, no looping)\n\n###
    Two strategies\n\n- Reload (primary) — reloads the page 1-3 times. YouTube re-evaluates
    ad serving on each reload; after 1-2 cycles the ad slot is empty and the video
    plays clean. Timestamp is preserved via &t=Xs URL param + JS seek.\n\nReload (primary)
    — reloads the page 1-3 times. YouTube re-evaluates ad serving on each reload;
    after 1-2 cycles the ad slot is empty and the video plays clean. Timestamp is
    preserved via &t=Xs URL param + JS seek.\n\n- yout-ube.com redirect (fallback)
    — if reloads don't clear the ad after 3 attempts, redirects to yout-ube.com (an
    ad-free YouTube mirror). The URL includes &loop=0 to prevent the infinite replay
    issue that the mirror has by default.\n\nyout-ube.com redirect (fallback) — if
    reloads don't clear the ad after 3 attempts, redirects to yout-ube.com (an ad-free
    YouTube mirror). The URL includes &loop=0 to prevent the infinite replay issue
    that the mirror has by default.\n\n- Detect — watches for .ad-showing class, skip
    buttons, and ad overlays (every 500ms + MutationObserver)\n\nDetect — watches
    for .ad-showing class, skip buttons, and ad overlays (every 500ms + MutationObserver)\n\n-
    Capture — grabs video.currentTime and saves it to sessionStorage\n\nCapture —
    grabs video.currentTime and saves it to sessionStorage\n\n- Reload — location.replace()
    with &t=Xs in the URL\n\nReload — location.replace() with &t=Xs in the URL\n\n-
    Restore — YouTube auto-seeks to the timestamp; playback resumes\n\nRestore — YouTube
    auto-seeks to the timestamp; playback resumes\n\n- Cooldown — 3-second guard prevents
    reload loops\n\nCooldown — 3-second guard prevents reload loops\n\n## Features\n\n-
    ✅ Zero ads — reloads until the ad is gone (usually 1-2 cycles)\n\n- ✅ Timestamp
    preserved — never lose your place in the video\n\n- ✅ Live streams — plain reload
    (no timestamp to preserve)\n\n- ✅ Ad history database — every ad logged with advertiser,
    duration, skip text, video, and timestamp\n\n- ✅ Export — JSON or CSV download
    of all collected ad data\n\n- ✅ Popup viewer — click the extension icon to see
    stats, top advertisers, and full history\n\n- ✅ No permissions abuse — only storage
    and tabs, only on YouTube domains\n\n## Install\n\n### Option A — Chrome / Brave
    / Edge / Opera (Load unpacked)\n\n- Clone the repo: git clone https://github.com/antonpictures/youtube-punisher.git\n\ngit
    clone https://github.com/antonpictures/youtube-punisher.git\n\n- Open chrome://extensions\n\n-
    Enable Developer mode (top right)\n\n- Click Load unpacked → select the youtube-punisher
    folder\n\n- Done — activates on all YouTube pages automatically. ✅ Tested\n\n###
    Option B — Safari (experimental: AppleScript workaround)\n\nSafari blocks ad-hoc
    signed extensions from auto-injecting into YouTube. As a workaround, use the JS
    overlay + AppleScript watcher (yt-ad-watch.sh):\n\n- In Safari, enable: Safari
    → Settings → Advanced → Show Develop menu in menu bar\n\n- In Safari (on a YouTube
    page), run ./yt-ad-watch.sh in Terminal\n\n- When an ad appears, the watcher detects
    it via MutationObserver (event-driven in the page), reloads with &t=Xs, and the
    MutationObserver re-detects on the next page load\n\n> Note: This is best-effort.
    Chrome is fully reliable; Safari works but may need manual testing.\n\nNote: This
    is best-effort. Chrome is fully reliable; Safari works but may need manual testing.\n\n###
    Option C — Download zip\n\n- Download the latest release from Releases\n\n- Unzip
    and follow Option A steps 2–5\n\n## The Ad History Database\n\nEvery ad YouTube
    serves you is recorded:\n\nExport as JSON or CSV from the popup. Data stays local
    — nothing is sent anywhere.\n\n## Why Reloads Work (and Why Nobody Thought of
    This)\n\nYouTube's ad system serves ads as part of the page load. When you reload,
    YouTube re-evaluates whether to serve an ad based on your session state. After
    1-2 reloads, the ad slot is typically empty and the video plays directly. This
    is a client-side, zero-cost workaround — no filter lists, no network blocking,
    no detection by YouTube's anti-adblock system.\n\n### The Scale Question\n\nIf
    millions of users did this, each reload = a full page load = server request. YouTube
    would see a spike in page loads but a drop in ad impressions. It's not a DDoS
    (no amplification, no botnet), but it's a passive protest: every reload is a vote
    that says \"I will not watch your ad.\" The ad revenue model breaks when reloads
    are cheaper than ad views.\n\n> \"Every reload is a vote: I will not watch your
    ad.\" — George Anton, creator\n\n\"Every reload is a vote: I will not watch your
    ad.\" — George Anton, creator\n\n## Comparison with Other Tools\n\nBest combo:
