  author: spc476
  text: |-
    What I remember vividly is that he would have reduced the number of return codes to have it on one single digit.

    I argued for three-digit return codes.  I wish I had known at the time that three-digit returns code was an old convention from June of 1972 (RFC-360; also RFC-354 but that was dated July 1972) that pretty much matches the current convention (400 and 500 are reversed).  Ten response codes was not enough, and when he mentioned using other single characters (like letters) for response codes, I knew he lost ("Is 'A' and 'a' different codes?  People may end up using all 95 graphic characters.") and he relented to two digit codes.  I guess he didn't like that, but in retrospect, implementation simplicity über alles was a bad idea.

    Another idea (which is purely mine) is to remove the MIME from the header and force extensions in the URL

    Another bad idea (in my opinion).  Having the file type as part of the link isn't a good idea because even with Gopher, you still have to peek at the data and figure out what you have ('I' is image, type unspecified; '5' is an archive of some unspecified type; '9' is a binary file of an unspecified type).  I think serving back the MIME type is much better.  What happens if a client requests gemini://example.com/self-portrait;image%2Fjpeg and you get back a PNG?  It's an image, but of the "wrong" type.  What's the error?  Or does it lead to a form on content negotiation?  It's an interesting idea ...
    People also complained about the size of a response not being given, and I even suggested a way, but Solderpunk shot it down.  Again, because implementation simplicity über alles.
