    Welcome to a new thread of people commenting "I like the idea of Gemini but they should really have added feature X"  (with everyone proposing its own and, in the end, reinventing the Web, like it happens everytime Gemini is mentioned on Lobste.rs).
    Gemini is awesome! Seriously!
    But if you want to post about your favorite missing feature in Gemini, keep in mind that not having that particular feature is exactly what makes Gemini so cool and that people using it are really happy not to have that feature. The creator of Gemini told me that, in retrospect, he would have removed even more features.
    You truly need to stop thinking "converting my website to Gemini". It will not work. I had my breakthrough moment were I started the opposite: I’m now converting my Gemini capsule to HTML.  This really changed how I think about the Web and how I write.
