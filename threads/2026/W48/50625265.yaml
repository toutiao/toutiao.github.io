  author: skew-aberration
  text: This book ius popularizing a thoroughly debunked misinterpretation of Godel
    FYI.<p>No algorithm can prove all true statements - but it is not the case that
    there are &#x27;true&#x27; properties which no algorithm can prove.<p>Godel sentences
    are &#x27;true&#x27; only on the assumption of consistency. If you allow the computer
    to assume consistency, it can prove the Godel sentence too. If you disallow humans
    from assuming consistency, they cannot prove the Godel sentence.<p>All such constructions
    follow the same pattern - they are &#x27;true&#x27; only upon taking additional
    assumptions.
