  author: guinep
  text: My point about consistency is that if you have a proof of it from within a
    given system you can’t conclude the system is consistent. This is becuase if the
    system was inconsistent then you’d have a proof of its consistency from within
    that system.  That is, having a proof of consistency from within the system doesn’t
    tell you the system is consistent.  As such, even if PA could prove its consistency
    (and was consistent) that wouldn’t mean it was consistent. (Of course PA can’t
    prove this.)<p>Of course what you say about being strong enough to express arithmetic
    is correct.  I poorly stated my point about consistency.  PA can be proven consistent
    in ZFC though.<p>This post on mathoverflow states things better than me.<p><a
    href="https:&#x2F;&#x2F;mathoverflow.net&#x2F;questions&#x2F;458752&#x2F;why-is-an-internal-proof-of-consistency-satisfactory-for-some-systems"
    rel="nofollow">https:&#x2F;&#x2F;mathoverflow.net&#x2F;questions&#x2F;458752&#x2F;why-is-an-internal...</a>
