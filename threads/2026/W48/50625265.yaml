  author: Xcelerate
  text: 'I heard an interesting question once: if we consider all the greatest discoveries
    of mankind and imagine a counterfactual world where their discoverer had not existed,
    how many additional years would it have taken for someone else to have made the
    discovery?<p>Subjectively, I think most of the major discoveries would have only
    been delayed by a decade or two. E.g., general relativity, quantum mechanics,
    the laws of thermodynamics.<p>For the incompleteness theorems, however, I’m not
    sure that we would even be aware of them today without Gödel. Tarski might have
    come the closest, but there were still a few insane conceptual leaps that had
    to be made beyond the undefinability of truth.<p>The theorems are often considered
    a curiosity at the edges of mathematics, but I’m not so sure. I think they might
    be more fundamental than typically given credit for. The problem is that the theorems
    aren’t really actionable since they rule out essentially all algorithmic methods
    of working around the limitations they entail.'
