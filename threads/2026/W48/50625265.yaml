  author: guinep
  text: "<i>…mathematics can&#x27;t prove every true statement…</i><p>This isn’t at
    all what he proved.  We humans have in our minds what the naturals numbers are.
    \ Gödel showed that we can’t find a nice set of axioms from which all arithmetic
    truth can be proved.<p>Assuming arithmetic is consistent then we can find an axiomatic
    system in which each true statement is a theorem.  Just take as your axiomatic
    system the collection of all true arithmetic statements.  Now every true statement
    of arithmetic is a theorem of this axiomatic system.  It’s just that this system
    is useless since there’s no way to determine if an arbitrary statement is an axiom.<p>Regarding
    consistency.  Consider this.  A system that can prove its own consistency doesn’t
    tell you anything because an inconsistent system can also prove its own consistency."
