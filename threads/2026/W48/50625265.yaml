  author: coderenegade
  text: He&#x27;s best known for the two incompleteness theorems; essentially, mathematics
    can&#x27;t prove every true statement, and it can&#x27;t prove its own consistency.
    The latter opens up the possibility that mathematics can prove mutually exclusive
    statements, though most mathematicians believe that mathematics is consistent.
    It&#x27;s hard to overstate how deeply these two results shook the field. It was
    the original crisis in mathematics.<p>Goedel was also the first to come up with
    a solution to the Einstein field equations of general relativity.
