  author: rpdillon
  text: 'Ugh.  OK, I&#x27;m the guy in your story with character: I&#x27;ve run Linux
    since the 90s, and only play games that I can get DRM-free that I can play on
    Linux and that I buy personally with a Visa card from GOG. I was just talking
    to AI last night (trying to troubleshoot frame drops in Sleeping Dogs Definitive
    Edition) about how this led to a huge gap in my gaming knowledge -- games that
    were Windows-only simply didn&#x27;t exist for me.  I do this with Denuvo DRM
    as well, even for games that I&#x27;m an absurd fan of. I just rewrite reality
    so the game that violates my guidelines is never even considered. It&#x27;s not
    a question, but an answer, and the answer is &quot;No&quot;.<p>So now I&#x27;m
    discovering all these games that I just missed out on (Sleeping Dogs is a good
    example). I got it for a couple of bucks a few days ago, and it&#x27;s been great.
    What I&#x27;m trying to say is while the whole world plays GTA VI, I could not
    care less, and am instead immersed in this world from more than a decade ago in  Hong
    Kong.<p>And finally, my point: from a business perspective, there is no difference
    in my legal, moral, ethical behavior and simply pirating GTA VI. The publisher
    doesn&#x27;t know the difference, and the same amount of money exchanges hands.  To
    wit: pirating is only unethical if there was a scenario in which the person would
    pay.  I don&#x27;t expect I&#x27;ll <i>ever</i> pay (or play!) GTA VI; and in
    the case of people like me, piracy is indistinguishable from people who don&#x27;t
    care about your product.<p>There&#x27;s a whole separate argument for piracy from
    the moral perspective of liberating the cultural artifact from the incidental
    shackles it was placed under to force monetization, but that&#x27;s a separate
    discussion.'
