  author: jacquesm
  text: 'I&#x27;ve owned 1x2cV, 3xDS&#x2F;ID (one a donor car), 2x Xantia and 1 XM.
    All of them had something that very few modern cars have, which is that they were
    quirky but interesting, both technology wise and to drive. If you knew them well
    you could do just about anything with them.<p>Anyway, about that hydraulic system:
    a friend of mine who lived in IJmuiden was improving his house. To do so he had
    bought a load of concrete tiles in Amsterdam on an impulse (really, really good
    deal). So he called me up and asked if I could come and help shift them to IJmuiden.
    When I got there there was this absolutely massive pile and I figured this is
    not going to end well. I had dropped the rear seat (which you could pull out fairly
    easily, but the back cushions stayed in place) so there was quite a bit of room
    and two tiles fit side by side. So we stacked them pretty much to the ceiling
    and miraculously, the car just kept on adjusting ride height and never gave any
    sign that it couldn&#x27;t handle the load. All of the tiles fit. Then we drove
    to IJmuiden. It all went well until we hit the overpass over the road between
    Amsterdam and Haarlem on A9. The car took a bit of a dive into the dip and then
    came back out and came back out further than it went in. And did it again. Before
    long it was bouncing like a ball with the <i>rear</i> (which was pretty heavy)
    coming off the ground. I lost some speed and finally got the car to sit by the
    side of the road, still bouncing. Engine off, let the whole thing come to rest,
    engine back on, everything fine. We drove the last bit <i>really</i> slow, just
    in case.<p>So, that&#x27;s what an undampened servo oscillation looks like in
    a hydraulic system. After unloading the backseat went back in and it was just
    like before. DE-70-72, whoever has it now, that car is as solid as they come (it
    is still registered, this was more than 20 years ago, the car is from 1968 and
    it has been off the road for a long time).<p>The hydraulic computer sits behind
    the left front wheel well behind a separate shield and it is super complicated,
    if you have to fix it you better know what you&#x27;re doing.'
