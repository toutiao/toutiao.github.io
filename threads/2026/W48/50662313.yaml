  author: Svip
  text: 'I should note, that I am obviously a bit biased in answering this; and I&#x27;ve
    seen some videos with people attempting (and failing) in replicating the moose
    test result.<p>However, a thing to note in those videos, is that their Activa
    suspension is not performing as it should (I also noted, that the videos did not
    mention attempts to fix the Activa suspension; it&#x27;s frankly not that hard,
    if you know what you&#x27;re doing.  Side note: with the car on a lift, and a
    screwdriver, you can make the suspension&#x27;s anti-roll system move around while
    it&#x27;s standing still.), so it therefore seems underwhelming.<p>That said,
    when it is <i>working</i>, the car basically drives like a go-cart: it just sticks
    to the road, the first few times, it&#x27;s uncanny.  Again, other cars do this,
    like sports cars, but I doubt any other car does it that well while being as practical
    as the Xantia is.  I remember a video (from a YouTuber whose name escapes me),
    mentioning how it was unusual to sit so high, while taking corners at those speeds.<p>Saying
    it&#x27;s the GOAT of its time may be slightly overstating it, but in the price
    range?  I don&#x27;t think anything comes close (even now).  It&#x27;s a driver&#x27;s
    car.<p>That being said: finding spare parts for it is hard, because Citroën stopped
    production decades ago, and it has tonnes of different parts.  Fortunately, there
    are some dedicated enthusiasts out there, so there is hope; some even making &quot;upgraded&quot;
    variants of the original ones.  Rubber, even if unused, just hardens over time,
    and eventually breaks apart.<p>Edit: Honestly, listen to jacquesm; I am just trying
    to cushion an answer, in attempt to avoid confessing my love for this vehicle.'
