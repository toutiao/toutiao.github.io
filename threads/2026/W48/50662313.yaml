  author: yason
  text: 'Reliability is not really the issue. The 2000&#x27;s hydropneumatic Citroëns
    rarely have problems with pipes and the suspension spheres have double-membrane
    so they won&#x27;t leak the nitrogen and they&#x27;ll last for years and years.
    To give some idea, having owned multiple hydraulic and non-hydraulic suspension
    cars in the last 25 years:<p>- I&#x27;ve changed countless dead&#x2F;leaked shock
    absorbers on cars with springs, as well as broken springs, and nearly nothing
    on multiple Citroëns. These jobs take time, especially in the front where you
    nearly always have to remove the whole strut and spring just to get to the absorber.<p>-
    The spheres are easy to replace, they don&#x27;t cost much, and I&#x27;ve only
    ever changed them because I want the ultimate suspension response, not because
    any of them actually broke. Some of them were originals that felt harder than
    they should but they still did up and down.<p>- I&#x27;ve had a couple of hydraulic
    hoses slowly leak from the pressed sleeve between the hard pipe and hose, and
    these have been easy replacements.<p>- I&#x27;ve changed more brake pipes in post-Xantia
    Citroëns than hydraulic pipes in total. Sure, in the 80&#x27;s the pipes rusted
    but so did everything else.<p>If I had the choice I&#x27;d 10-to-1 get a hydropneumatic
    suspension rather than pieces of some twisted steel if not for anything else but
    less maintenance even if I didn&#x27;t care for ride quality.<p>Why this isn&#x27;t
    common is, I think, just cost. A coil spring costs nearly nothing to make and
    shock absorbers are so common that they&#x27;re a bulk item so you can get them
    cheap. Changing those is more labour and you also need to change those more often
    if you want even a seemingly decent ride but hey that&#x27;s not the automaker&#x27;s
    problem once the car is out of the factory.<p>This would be different if hydropneumatic
    suspension had been more common, you could buy common parts for next to nothing
    because those parts are even simpler to manufacture. So, there&#x27;s a bit of
    volume advantages that traditional suspension enjoys but hydropneumatic ones don&#x27;t.
    They&#x27;re not expensive but traditional coils and shocks are just so cheap.<p>Rolls-Royce
    did license Citroëns system earlier so there is some high-end appeal. But the
    problem is really that the hydropneumatic thing is not designed to be &quot;luxury&quot;
    but a mundane, everyday thing: only the cheapest and smallest city cars Citroën
    made didn&#x27;t have it. Driving that Roller with a licensed hydropneumatic suspension
    could stand in red lights alongside a Citroën BX, midsize family car, with the
    same type of suspension, yet the Roller cost 10x more.<p>Further, people have
    been conditioned to appreciate rock-hard autobahn suspension, low-profile tyres
    and negligible suspension travel instead of a compliant road handling even if
    most roads are, in effect, not autobahns but bumpy patches of potholes where you
    want nothing but feel those bumps on the road.'
