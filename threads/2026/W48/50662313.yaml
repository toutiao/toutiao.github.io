  author: Svip
  text: 'Generally goes unnoticed (though not unmentioned), but until after the Xantia,
    the suspension system also included the brakes and the steering (which would technically
    not be permitted under modern EU car standards); which meant a leak would eventually
    not just cause a loss of suspension, but also a loss of steering and braking.<p>Why
    incorporate the braking and the suspension?  The mechanical height regulator could
    &quot;feel&quot; how much fluid it needed to fill the suspension with, in order
    to obtain the desired ride height; which meant it &quot;knew&quot; how heavy the
    vehicle was loaded, and thus apply the brakes accordingly.  This is why in a proper
    Citroën hydraulic car, the brake pedal feels &quot;weird&quot;, in that it doesn&#x27;t
    go far down (and quickly becomes hard to press) (the DS tried to make this less
    confusion by making the pedal a &quot;mushroom&quot; button instead); because
    the idea is that you should apply gentle braking, and the car will figure out
    the necessary amount of braking force required (unlike just hitting the pedal
    like in a normal car, which would result in an almost hard stop).<p>Why the steering
    then?  I think that&#x27;s more of a convenience thing, mechanically speaking,
    as it was already there to provide a form of power steering; though it is funny
    feeling it getting pumped up (steering was always the last portion to receive
    fluid during the pumping).  At least, as far as I can tell, it has little bearing
    on the suspension or braking.  I know the SM and CX tried the DIRAVI steering,
    which completely made the steering one way (so you couldn&#x27;t feel the road);
    though it was fun to see the steering wheel self-righting even when parked.<p>Full
    disclosure: I own a 1974 Citroën DS 23 and a 1998 Citroën Xantia Activa V6.'
