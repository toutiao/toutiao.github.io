    \"lengthens\" the strut and raises the vehicle to its normal ride height\n\n |\n\n
    |\n| ![](images/ds-jack.jpg) |\n| \n\nAnother advantage of the variable ride height
    was the ability to dispense with a conventional jack. To jack the car up, all
    that was required was to place it in the highest suspension position, place a
    simple stand under the car and then select the lowest suspension position. The
    two wheels on the side of the car under which the stand is placed lift themselves
    off the ground.\n\nOther car manufacturers, notably Rolls-Royce and Mercedes-Benz
    licenced the system which was also used on Berliet&nbsp;trucks. Similar systems
    are also used on some military&nbsp;vehicles.\n\n**Spheres**\n\nAt the heart of
    the system are the so-called 'spheres' one per wheel and one main accumulator
    as well as a dedicated brake accumulator on some models. The purpose of the main
    accumulator is to even out fluctuations in pressure.\n\nOn later cars fitted with
    antisink or Activa suspension, there may be as many as nine spheres. Each sphere
    consists of a hollow metal ball, open to the bottom, with the top and bottom of
    the sphere being separated by a flexible desmopan rubber membrane. The top is
    filled with nitrogen&nbsp;at high pressure, up to 75 bar while the bottom connects
    to the car's hydraulic fluid circuit. The high pressure pump powered by the engine
    pressurizes the circuit and the accumulator sphere. This part of the circuit is
    at between 150 and 180 bars. It powers the front brakes first, prioritised via
    a security valve, and depending on type of vehicle, can power the steering, clutch,
    gearchange, etc.\n\nPressure goes from this circuit to the wheel spheres, pressurizing
    the bottom part of the spheres and rods connected to the wheel suspension. Suspension
    works by means of a rod pushing LHM into the sphere, compressing the nitrogen
    in the upper part of the sphere. Damping is provided by a two-way 'leaf valve'
    in the opening of the sphere. LHM has to squeeze back and forth through this valve
    which causes resistance and controls the suspension movements. This damper is
    far simpler and more reliable than those fitted to conventional vehicles and is
    also more efficient.\n\n**Height correction and levelling**\n\nCar height correction
    works by height correctors connected to the front and rear anti-roll bars and
    permit more more fluid to travel under pressure to the spheres when it detects
    that the suspension is lower than the pre-determined ride height (e.g. the car
    is loaded). When the ride height is too high (e.g. after unloading) fluid is returned
    to the system reservoir via low-pressure return pipes. Height correctors act with
    some delay in order not to correct regular suspension movements. Rear brakes are
    powered from the rear suspension spheres. Because the pressure there is proportional
    to the load, so is the braking power. Furthermore, under heavy braking, hydraulic
    fluid is removed from the rear suspension causing the tail to drop providing inbuilt
    anti-dive.\n\nSpheres are not subject to mechanical wear, but do suffer pressure
    loss, mostly from nitrogen diffusing through the membrane. They typically last
    between 60,000 and 100,000&nbsp;km. Spheres once had a threaded plug on top for
    recharging. Newer spheres do not have this plug, but it can be retrofitted. The
    symptom of pressure loss is a hard ride.\n\n  \n |\n| ![](images/ds-up-down.jpg)
    \ \n |\n| \n\n**Advantages of the system**\n\nHydropneumatics are inherently superior
    to steel springs for reasons that are often misunderstood. In addition to the
    superb comfort, they also have advantages related to car handling and control
    efficiency, solving a number of problems which are inherent in the use of steel
    springs.\n\nThe hydropneumatic system is a progressive spring-rate suspension,
    in other words the more it is compressed, the stiffer it becomes. This results
    in a suspension which is extremely soft in its initial movement (far softer than
    a steel spring) but which becomes harder and harder as it is compressed (far stiffer
    than a steel spring). This is because of the inherent properties of a gas: halve
    its volume and its pressure doubles. When the suspension operates, the ram pushes
    oil into the sphere, thereby altering the volume (and therefore the pressure)
    of the gas. Usually steel-sprung cars are either too soft (\"comfortable\"), or
    too stiff (\"sporty\"), or some intermediate compromise, while hydropneumatics
    offer \"two cars in one\". Many manufacturers supply composite steel springs with
    a soft course and a stiff course - two different, discrete spring rates, whereas
    hydropneumatics offer an infinite number of rates.\n\nThis also ensures that the
    suspension's spring-rate (hardness) is continuously adapted to the vehicle load.
    Thus whe"
