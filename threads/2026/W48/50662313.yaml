  text: 'I had a used Citroen CX, it was my first car and there was indeed a control:
    fully down, normal, raised (for bumpy roads) and maximum position (for tire changes).<p>The
    tire change mode was particularly interesting, because it let you change change
    tires without a jack: put the suspension in the maximum position to lift the car,
    put the car on stands, then set the suspension down to raise the tires.<p>About
    the raising car, yes, you had to wait for it to raise. But it was for the best
    in my case. My car was an old diesel, the kind that took time to warm up, so waiting
    for the car to raise was a good reminder to let the engine get up to temperature.<p>Small
    anecdote, I once popped the license place to the car parked in front of me clean
    off. What happened is that I parked very close to the car in front of me, but
    not touching, that car had its licence plate hanging down a bit. After I left,
    the car slowly went under the licence plate, and when I restarted it, it rose
    back up, taking the licence plate with it. In the end there was almost no damage,
    the license plate just had to be riveted back.'
