    I've read the posts in their original order, and thought that abolish_lock_poisoning was the counter-argument :)
    but poison-or-not is a false dichotomy. In an ideal case it's still only a partial solution that doesn't help against divergence via ?, return or (in case of async mutexes) cancelled .await.
    It would be more effective to have linear/unforgettable types, or switch from a Mutex to types that only allow transactional all-or-nothing updates. Even then you can still get bitten by mutable state elsewhere (protocols, files on disk, atomics), so there's no way to escape the need to have proper drop guards for pretty much everything all the time.
