    I wish I had a crystal ball that could give me statistics on what people are actually doing and correlate it with whether or not they know what they’re doing or not.
    Swallowing poisons seems the worst of any world for the average use case; imho it should be used as sparingly and judiciously as catch_unwind should be (read: not is) used.  In fact, less sparingly: if code at api boundaries catches panics in external code that doesn’t affect its own internal state (such as a task scheduler), then no poisoning takes place to begin with.
    The only reason to run without panic = abort - if you’re not agonizingly writing panic-safe and poison-safe multithreaded code - would be to allow important drop impls in non-pure functions run to clean up or roll back their work in panic-safe contexts. Your average app or webapp author is not benefiting from learning this “one cool trick” to “recover” from a poisoned mutex (and they’re not even calling clear_poison() so they’re not even doing that right). It’s right up there with turning assert() failures into a warning message in release mode!
