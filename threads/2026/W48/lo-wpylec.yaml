    The answer depends on a bunch of things, but in general (and especially in library code) that is indeed what I’m suggesting. For instance, this critical section in parity-db is quite large. Reasoning about whether it’s unwind-safe seems very difficult to me; this is exactly the kind of code that mutex poisoning does well to guard against.

    The picking of parity-db's commit_raw function quite interesting here because it shows exactly the type of failure that I also mentioned in my blog post: early returns. That function uses ? after taking a critical section so you have early returns in that function while the mutex is held for error handling. In fact the only case I can find in this function of leaving broken state behind is from that error handling and not from panics!
