  content: "# [In defense of lock poisoning in Rust](../../posts/on-poisoning/)\n\n2025-12-02
    (updated 12-06)·21 min read[rust](https://sunshowers.io/tags/rust/)\n\n## Table
    of contents\n\nThere’s recently been some discussion about the benefits and downsides
    of lock (mutex) poisoning in Rust, spurred by [a recent proposal](https://github.com/rust-lang/rust/issues/149359)
    to make the default mutex non-poisoned, i.e. **silently unlock on panic** (see
    also, [recent discussion on Hacker News](https://news.ycombinator.com/item?id=46036883)).
    As a passionate defender of lock poisoning, I thought I’d gather and write about
    my thoughts on this matter.\n\nTo summarize, I believe:\n\n- Unexpected cancellations
    in critical sections cause real harm to system correctness.\n- Lock poisoning
    is an important part of ensuring the correctness of critical sections in Rust.\n-
    Poisoning applies more generally than mutexes, and providing an easy way to track
    that (via e.g. a `Poison<T>` wrapper) is valuable.\n- While there is conceptual
    elegance in separating out locking from poisoning on panic, the importance of
    lock poisoning overrides these concerns.\n\n## What is poisoning?[#](#what-is-poisoning)\n\nRust,
    like most multithreaded languages, has [mutexes](https://doc.rust-lang.org/std/sync/struct.Mutex.html):
    a construct to ensure that a particular piece of data can only be accessed by
    one thread at a time. The way mutexes work in Rust is particularly well-considered:\n\n-
    Rust uses a single-ownership model, and the notion of shared (`&`) and exclusive
    (`&mut`) references to some data. Most data structures are written such that mutations
    always require a `&mut` reference to it.\n- In Rust, the data guarded by a mutex
    is owned by the mutex. (In many other languages, you have to track the mutex and
    data separately, and it’s easy to get it wrong.)\n- When you lock a mutex, you
    start from a shared reference: a `&Mutex<T>`. Once you have obtained the lock,
    you get back a [`MutexGuard<T>`](https://doc.rust-lang.org/std/sync/struct.MutexGuard.html),
    which indicates that you now have exclusive access to the guarded data.\n- The
    `MutexGuard` can give you a `&mut T`, so you have exclusive access to it.\n- When
    the `MutexGuard` is dropped, the lock is released. The period during which the
    lock is held is called the _critical section_ (generally, not just in Rust).\n\nThis
    is all quite reasonable! Let’s look at an example that processes incoming messages
    for a set of tracked operations. Let’s assume that multiple threads could be processing
    messages, so we have to guard the internal state with a mutex. (We’ll discuss
    alternative approaches to this problem later.)\n\nA simple implementation:\n\n
    \   use std::{collections::HashMap, sync::Mutex};\n    \n    struct OperationId(/*
    ... */);\n    \n    enum OperationState {\n        InProgress { /* ... */ },\n
    \       Completed { /* ... */ },\n    }\n    \n    impl OperationState {\n        //
    Here, `process_message` consumes self and returns self. In practice this\n        //
    is often because the state has some internal data that requires\n        // processing
    by ownership.\n        fn process_message(self, message: Message) -> Self {\n
    \           match self { /* ... */ }\n        }\n    }\n    \n    struct Operations
    {\n        ops: Mutex<HashMap<OperationId, OperationState>>,\n    }\n    \n    impl
    Operations {\n        /// Process a message, updating the internal operation state
    appropriately.\n        pub fn process(&self, id: &OperationId, message: Message)
    {\n            // Obtain a lock on the HashMap.\n            let mut lock = self.ops.lock().unwrap();\n
    \   \n            // Once the lock has been acquired, it's guaranteed that no
    other\n            // threads have any kind of access to the data. So a `&mut`
    reference\n            // can safely be handed to us.\n            // \n            //
    This step is shown for pedagogical reasons. Generally, `ops` is not\n            //
    obtained explicitly. Instead, lock.remove and lock.insert are used\n            //
    directly as `lock` dereferences to the underlying HashMap.\n            let ops:
    &mut HashMap<_, _> = &mut *lock;\n    \n            // Retrieve the element from
    the map to process it.\n            let Some(state) = ops.remove(id) else {\n
    \               // (return a not-found error here)\n            }\n            let
    next_state = state.process_message(message);\n            ops.insert(id.clone(),
    next_state);\n            \n            // At this point, lock is dropped, and
    the mutex is available to other\n            // threads.\n        }\n    }\n\nThis
    is a very typical use of mutexes: to guard one or more _invariants_ or _properties_
    of some kind. These invariants are upheld while the mutex is unlocked. In this
    case, the invariant being guarded is that `Operations::ops` has complete and up-to-date
    tracking of all in-progress and completed operations.\n\nOf equal importance is
    the fact that, while the mutex is held, the invariant is _temporarily violated_.
    In order to process the message, we have to remove the state from the map, create
    a new state, then put it back into the map. During this period, `Operations::ops`
    is missing this one operation, so it no longer tracks all operations. But this
    temporary violation is okay, because no other threads see this in-between state.
    Before the mutex is released, this code is responsible for putting the operation
    back into the map.\n\nIs it always true that the operation is put back into the
    map? Unfortunately not always, in the presence of what I think of as _unexpected
    errors_. Many practitioners draw a separation between two different kinds of errors
    that a system can have. The terms _recoverable_ and _unrecoverable_ are sometimes
    used for them, but I tend to prefer the following terms (see also [some discussion
    by Andrew Gallant](https://burntsushi.net/unwrap/#what-about-recoverable-vs-unrecoverable-errors)):\n\n-
    An _expected error_ is one that can occur in normal operation. For example, if
    a user specifies a directory to write a file to, and that directory is not writable,
    then that’s in the realm of expectations (maybe the user mistyped the directory,
    for example).\n- An _unexpected error_ is one that cannot occur in normal operation.
    Andrew presents the example of a fixed string literal that is processed as a regex.
    A fixed literal baked into the program really ought to be valid as a regex, so
    any issues are unexpected.\n\nGenerally, in Rust, expected errors are handled
    via the `Result` type, and unexpected errors are handled by [panicking](https://doc.rust-lang.org/book/ch09-01-unrecoverable-errors-with-panic.html).
    Now, there isn’t a firm requirement that things be this way.\n\n- For example,
    some high-availability systems may choose to model unexpected errors via a `Result`-like
    type (see [the `woah` crate](https://docs.rs/woah/) as an example).\n- Quick-and-dirty
    scripts may choose to handle both expected and unexpected errors as panics.\n-
    Panics can also be used for other purposes, e.g. to [cancel in-progress work in
    synchronous Rust](https://sunshowers.io/posts/cancelling-async-rust/#cancellations-in-synchronous-rust).\n\nBut
    in typical production-grade Rust, expected errors are `Result`s while unexpected
    errors (and only unexpected errors) are panics. Lock poisoning is built around
    this assumption.\n\n### What if a panic occurs?[#](#what-if-a-panic-occurs)\n\nConsider
    what happens if a panic occurs in `OperationState::process_message`. This depends
    in part on the build flags and surrounding code, so let’s look closely at all
    the possibilities. In Rust, there are two ways to configure build flags on panic:\n\n-
    The default is to _unwind_, or to walk up the stack and run cleanup code. With
    unwinding, panics can also be _caught_ at a higher level: in the same thread with
    [`catch_unwind`](https://doc.rust-lang.org/std/panic/fn.catch_unwind.html), or
    in another thread via [`JoinHandle::join`](https://doc.rust-lang.org/std/thread/struct.JoinHandle.html#method.join).\n-
    The alternative is to _abort_, which causes the whole proc"
