    It seems like there aren’t any dinosaurs posting  about their pre-rust experiences with mutex poisoning, possible because it really means “I was writing framework-free multithreaded or IPC win32 code back in the day,” which rules out a good chunk of the Unix greybeards in the crowd.
    Windows, by virtue of having going with multi-threading over fork/exec from the start, was probably the most common example of lock poisoning in the wild. Calls to WaitForSingleObject/WaitForMultipleObjects could (and would) return WAIT_ABANDONED if the thread (or process, in the case of kernel objects placed in shared memory pages) were killed while holding the (kernel mode) mutex lock.

    the lock would be obtained by the calling thread (exclusive access, slow) but would not return a success; pretty similar to how rust does it now
    the lock didn’t have a sticky poisoned state, iirc it was the responsibility of whoever first unlocked it to let everything else know
    there was no “unwinding” or anything so you had to manually propagate poison state or a shutdown if you didn’t feel equipped to handle the poison
    that said, multithreading was far more niche and specialized than it is now, and you used it (relatively) fairly sparingly given the ergonomics. Combining its specialized nature with the lack of panics/structured exception handling, people were more deliberate in writing poison-safe code. I could be misremembering but I seem to recall that I wrote much more code to reset state and recover from poisoning than I did to propagate poison and abort the app. That could also be the nature of the code I was writing at the time, though!
    an important distinction is that, on Windows and specifically with kernel muted objects rather than user space critical sections, a poison could be because a thread or a process aborted. You obviously need to handle them differently in most cases; whereas rust mutexes are strictly userland and so an argument could be made to not afford the dev with an opportunity to handle that.

    In that light, I see the Poison<T> approach to be the best compromise for today’s world. I can see why rust, focused as it was on correctness l, went with the poison model instead of the posix deadlock model or other language’s silent unlock approach, but the profileration of multithreading (esp at such a high level to the point we are using it in the web stack) has led to a change in the way people write multithreaded code and the nature of what it’s being used for. Now you have it protecting shared resources that aren’t just task/algorithm-specific and far too removed from the rest of the code to know how to handle poisoning; the cases where you are writing carefully designed multithreaded algorithms (like the libraries in the examples in the posts in this back-and-forth series, for instance) are the minority and would know to opt-into it, but rust has gone from a systems programming language to being used by the masses for pretty much anything and everything at all ends of the spectrum and the ergonomics of the defaults should change – so long as existing editions preserve their behavior and new editions continue to provide a way to opt into poisoning. A separate Poison<T> type actually increases the tools available in the proverbial tool belt for correctness-first programming over just having it always on but only for mutexes.
    One last comment: I see concerns voiced about people not knowing or not realizing or not being sufficiently provoked into using Poison<T> by default, but I think that’s a weak argument: software correctness is an ongoing effort, no one writes perfect code in a new environment/language, especially if they didn’t know to look into what the lock does on panic to begin with, and we all live and learn. But writing .lock().unwrap() is also just not a big deal TM in the grand scheme of things!
