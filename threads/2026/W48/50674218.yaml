  author: jonenst
  text: From first contact in the README, the LLM-speak is strong with this one. 25
    uses of the cool kid &quot;X, so Y&quot; assertive idiom.<p>Obviously lots of
    other great things to say about this project, but I feel this kind of introduction
    is seriously off putting. It&#x27;s a general problem but I hope that it can change
    in the future (or more realistically that I manage to get used to it...)<p>I was
    going to cite only the worst offenders but almost all of them are terrible so
    here&#x27;s the almost full list (slightly edited to make the idiom stand out):<p>&quot;The
    kernel is compiled code, so programs get Linux&#x27;s behavior&quot;<p>&quot;unmodified
    aarch64 Linux binaries, so packages run as they are.&quot;<p>&quot;ARMv8.0-A with
    FP, so distribution binaries run unchanged&quot;<p>&quot;aarch64 is a first-class
    port, so their package archives are available.&quot;<p>&quot;The SDK is MIT-licensed,
    so you can ship it.&quot;<p>&quot;The wallpaper is a random photo, so the page
    fetches one on every load&quot; (in my mind this one is the worst)<p>&quot;Browsers
    can&#x27;t open raw TCP sockets, so the page reaches the internet through a Wisp
    proxy.&quot;<p>&quot;kwemu walks the kernel&#x27;s own page tables, so memory
    management is done by the real Linux code.&quot;<p>&quot;Task switches use JSPI,
    so the kernel gets real stacks.&quot;<p>&quot;Any object can carry the guest&#x27;s
    TCP and DNS, so you can write your own backend.&quot;<p>&quot;vm.connect(port)
    reaches a TCP server, so it needs no network&quot;<p>&quot;the host name only
    goes into the Host header, so vm.fetch(&quot;http:&#x2F;&#x2F;localhost&#x2F;&quot;)
    reaches a dev server.&quot;<p>&quot;&#x2F;dev&#x2F;shm exists once the guest&#x27;s
    init has mounted it, so wait for the guest before create()&quot;<p>&quot;Node
    has no WebGL, so gl is ignored with a log line.&quot;<p>&quot;Node has no WebGPU,
    so vk is ignored with a log line&quot;<p>&quot;There is no guest agent, so you
    drive the guest&quot;<p>&quot;stop() doesn&#x27;t shut the guest down cleanly,
    so prefer poweroff&quot;<p>&quot;Types ship as .d.mts, so a Node-only TypeScript
    project needs skipLibCheck&quot;<p>&quot;The JavaScript SDK and page are MIT,
    so you can embed them anywhere.&quot;<p>&quot;The npm package ships a Linux kernel
    (GPL-2.0) with a small base system, so it is MIT AND GPL-2.0-only&quot;
  score: 0
