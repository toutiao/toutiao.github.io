  author: logicallee
  text: |-
    You could try running one of the other ones people posted. You can also try it in Firefox. Since Unkernel provides a Linux kernel and supports aarch64, one of the browsers should be able to run one of those, maybe one of the simpler ones. Here is the other comment in this thread: <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50674542">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50674542</a><p>another one they didn&#x27;t mention: <a href="https:&#x2F;&#x2F;trynix.dev&#x2F;" rel="nofollow">https:&#x2F;&#x2F;trynix.dev&#x2F;</a><p>Since this thread is about Unkernel, you might be interested to know I got Doom running in it in realtime (with ascii graphics, but still):<p><a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50602937">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50602937</a><p>Not saying that a modern browser is simpler than Doom, but still, I think you might be able to get one of those to load. Someone successfully ran Postgres, which is very large and complicated.<p>Edit: nested, I was able to get as far as starting the smallest package I could find on trynix.dev, I just put in nano and then loaded the earliest version I could find. Here are the steps:<p>1. on your own computer open a tab in Chrome or Firefox and go to unkernel.dev and wait for it to load.<p>2. in the shell inside unkernel type:<p><pre><code>    chromium
    </code></pre>
    This downloads and starts it <i>within</i> the Linux environment your tab is running!  It is very fast.<p>3.  In the nested Chromium tab (inside unkernel.dev), go to trynix.dev and look for a very small package, for example nano and scroll down to an early version, select it and click boot.<p>It will then boot, so now you&#x27;re running unkernel within unkernel.  I got this working on a 2026 Mac mini. (24 GB of RAM).
