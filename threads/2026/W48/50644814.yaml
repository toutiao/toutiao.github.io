  title: Deriving Black-Scholes | David Álvarez Rosa
  fetch_status: success
  content: "Even if it feels unintuitive, the price of an option does not depend on
    whether you expect the underlying to moon or tank. Under some reasonable market
    hypotheses, we can build a fully hedged portfolio by holding the underlying and
    shorting the option. Since it is riskless, by no-arbitrage assumption, it must
    return the same as the risk-free interest rate. That allows to put together an
    equation (the Black-Scholes equation), and solve for the option price (the Black-Scholes
    formula).\n\n## Model[§](#model)\n\nA European call gives the right, but not the
    obligation, to buy an underlying at a fixed price K, the strike, on a fixed dateT,
    the maturity. Its value V is the premium you need to pay for having that optionality,
    and it depends on time and on the underlying stock price S. At maturity it is
    the payoff For example, pay $5 today for the right to buy one AMZN share for $200
    in a month. If AMZN then trades at $230, you buy at $200 and the option is worth
    $30. If it trades at $180, you walk away and the option is worth nothing.&nbsp;\n\nV(T,S)=max(S−K,0).\n\nStock
    moves scale with price, so it is common to model the returns instead of the price.
    Over a short time the return is a small drift plus noise. The noise is the sum
    of many small, unpredictable Weak-form efficient market hypothesis: past prices
    do not predict future moves.&nbsp;sources. Such sum can be modeled as a Brownian
    motion W, By the central limit theorem, the sum of many small independent variables
    is normal.&nbsp;so the return is\n\nSdS​=μdt+σdW,\n\nwith drift μ and volatility
    σ. For our model, we will assume constant drift, volatility and interest rate
    r. We will also assume “perfect” trading, with fractional shares allowed, no fees,
    no taxes, no dividends, and no arbitrage.\n\n## Hedged portfolio[§](#hedged-portfolio)\n\nThe
    trick of Black-Scholes is to build a fully hedged portfolio combining the option
    and the underlying in the right proportion. By the no-arbitrage hypothesis, its
    returns must be the same as the interest rate r, and that way we can put together
    an equation.\n\nWhen the stock moves a little, the option moves by Δ times as
    much, with\n\nΔ=∂S∂V​.\n\nIf you short one option and hold Δ shares, then the
    two moves cancel. This is a delta hedge.\n\n_One step. From today (left) to\nmaturity
    (right), the stock moves from $100 to $110 or $90, and a call at $100 pays $10
    or $0. Half a share\nminus the call is worth $45 either way, so it is riskless.
    Without\ninterest it is also worth $45 today, so the call costs\n$50 − $45 = $5._\n\nNote
    that Δ changes with the stock price and time. The portfolio is riskless only over
    an instant, and stays so only if it is rebalanced continuously.\n\n## Black-Scholes
    equation[§](#black-scholes-equation)\n\nUse the Taylor expansion of the option
    value and keep the terms up to order dt. Since (dW)2=dt, the (dS)2 term is one
    of them,\n\ndV=∂t∂V​dt+∂S∂V​dS+21​∂S2∂2V​(dS)2.\n\nSubstituting the stock model
    gives\n\ndV=(μS∂S∂V​+∂t∂V​+21​σ2S2∂S2∂2V​)dt+σS∂S∂V​dW.\n\nNow, we can use the
    same hedged portfolio Π as before, short one option and long Δ shares, which is
    worth −V+ΔS. Holding Δ fixed over an instant,\n\ndΠ=−dV+ΔdS,\n\nand substituting
    dS and dV gives\n\ndΠ=(−∂t∂V​−21​σ2S2∂S2∂2V​)dt.\n\nSee how noise and drift cancel.
    No dW term is left, and everything else is known at time t, so over the next instant
    the portfolio change is fixed. A known return with no randomness is precisely
    what riskless means.&nbsp;We’ve built a riskless portfolio, that by the no-arbitrage
    assumption, it must earn the risk-free rate,dΠ=rΠdt. Equating both expressions
    gives us the Black-Scholes equation\n\n∂t∂V​+rS∂S∂V​+21​σ2S2∂S2∂2V​=rV.\n\nNote
    that μ is gone, so the option price does not depend on the drift.\n\n## Black-Scholes
    formula[§](#black-scholes-formula)\n\nI won’t bore you with the technical details,
    For the details, see John C. Hull, _Options, Futures, and Other Derivatives_,
    11th edition, Pearson, 2021. The Bible of derivatives.&nbsp;but the above equation
    can be solved by a change of variables to turn it into the heat equation, whose
    solution is known. Define\n\nτ=T−t,x=lnS+(r−21​σ2)τ,V(t,S)=e−rτw(τ,x),\n\nwhere
    w is the option value at maturity. Substituting, all terms but two cancel, and
    we get the heat equation\n\n∂τ∂w​=21​σ2∂x2∂2w​.\n\nWith the payoff as initial
    condition, the solution is\n\nw(τ,x)=2πσ2τ​1​∫−∞∞​max(ey−K,0)exp(−2σ2τ(y−x)2​)dy.\n\nCompleting
    the squares gives the Black-Scholes formula\n\nV(t,S)=SN(d1​)−Ke−rτN(d2​),\n\nwhere
    N is the standard normal CDF and\n\nd1​=στ​ln(S/K)+(r+21​σ2)τ​,d2​=d1​−στ​.\n\n-
    N(d1​) is the hedge ratio Δ, so the first term represents the price of an asset-or-nothing
    call, which pays the share if the call ends in the money.\n- N(d2​) is the risk-neutral
    probability of exercise, so the second term is the present value of the expected
    strike payment.\n  \n\nThat’s all, lads, go make Ken Griffin broke.\n\n## Read
    Next [§](#read-next)\n\n[mathematics](/tags/mathematics/)[Fundamental Theorem
    of Calculus](/posts/fundamental-theorem-of-calculus/)  \nFrom the Riemann integral
    to the keystone of calculus.\n\n[Laissez Faire, Laissez Mourir](/posts/laissez-faire-laissez-mourir/)
    \ \nVisualizing plutocracy.\n\n[self-hosting](/tags/self-hosting/)[Self-Hosting
    Behind CGNAT](/posts/self-hosting-behind-cgnat/)  \nLibre software, libre hardware,
    and my mother's basement.\n\n## Subscribe [§](#subscribe)\n\nMy mailing list is
    free, occasional, and covers a variety of topics. I will never sell or share your
    email address.\n\nHave feedback? Email me at[david@alvarezrosa.com](mailto:david@alvarezrosa.com)."
