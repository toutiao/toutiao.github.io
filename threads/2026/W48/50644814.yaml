  author: gituliar
  text: Just a few remarks for clarity.<p>The Black-Scholes _formula_ for the European
    option price is a particular solution of the Black-Scholes _equation_.<p>The beauty
    of this PDE equation is that it also describes various exotic options (American,
    Bermudian, Asian, etc.), volatility structures, multi-asset options, etc. In practice,
    such products are priced numerically with Monte-Carlo or finite-difference methods,
    but the equation remains the same.
