  author: lordnacho
  text: Option trading was my first job.<p>Some things to note:<p>There&#x27;s a reason
    why you need the squared term in the Taylor expansion, which is a thing called
    Ito&#x27;s lemma that is the stochastic calculus version of the chain rule.<p>If
    you thought that it is a bit odd to assume constant volatility, you are right.
    People don&#x27;t just use the BS formula to make a price for an option, but they
    DO use it to describe a price they made, funnily enough. So you would use whatever
    more complex model you wanted to come up with a number, and then back out the
    volatility via the BS formula to say what volatility that corresponds to.<p>In
    practice you end up with a surface, whose dynamics will vary depending on what
    you&#x27;re looking at.<p>Option traders are speculating on volatility (not direction),
    and the mechanism is like this:<p>- You can buy a call and short the market, or
    buy a put and go long the market. If you draw this on a graph, you can satisfy
    yourself that this roughly gives you a u-shape such that you are locally neutral
    in the price, ie a small up or down does very little to your portfolio. (BTW,
    this is why traders call all the high strikes calls and the low strikes puts,
    it doesn&#x27;t actually matter whether it is the right to buy or sell the asset,
    and the in-the-money side is just more cash for the same risk)<p>- If the market
    moves and you own hedged options, your portfolio will be worth more regardless
    of whether it went up or down. You can then hedge again to re-seat the flat portion
    of the U-shape. If the market moves again, you do it again, locking in your gains.<p>-
    Why is this not free money? Well, we only looked at the price dimension. Every
    day you are long the option, it becomes worth a bit less, since there&#x27;s less
    time left for it to move. This gets steeper and steeper with each day, since days
    are a constant length of time and you are losing a greater and greater proportion
    of the life of the option.<p>- So why is the opposite not free money? Well, the
    two effects push against each other. Sometimes, the movement is enough so that
    the loss on theta (time) is outweighed by the buying low and selling high. Other
    times, it is not.
