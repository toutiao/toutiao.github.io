  author: seanhunter
  text: If you think about it, it&#x27;s somewhat beside the point to take exception
    to the Brownian motion in Black-Scholes.  The assumptions of constant volatility
    and the ability to trade in continuous time are far more unrealistic. The point
    is, it&#x27;s a model and the real breakthrough in the original Black&#x2F;Scholes&#x2F;Merton
    paper is the idea of pricing using replication in continuous time.  If you&#x27;re
    able to hedge in  continuous time, the error introduced by the difference between
    a Brownian motion and a distribution with higher kurtosis is necessarily smaller,
    because you will hedge it away in tiny bits.  This is why billions of dollars
    are traded using local vol models like Dupire every day - notwithstanding the
    assumption of normality, assuming vol is a locally deterministic function of price
    and time gives you a good enough model for most day to day applications where
    you don&#x27;t need term skew (eg not forward-starting).
