  author: contravariant
  text: 'It&#x27;s kind of hard to come up with good models for continuous random
    time-series. With a few reasonable demands you end up with a Levy process, which
    you can decompose into Brownian motion with jumps. [1]<p>Some of these demands
    may look unreasonable if you purely see the variable as &#x27;the price&#x27;
    but become reasonable when you view the variable as &#x27;the current state of
    affairs&#x27;. I think the efficient market hypothesis is that these two are similar
    enough, but that is indeed a bit of a weak spot.<p>Anyway once you have stationarity
    and independence you start running into a few issues because if Var(X_(t+s) -
    X_t) is infinite for some s, then it is also infinite for s&#x2F;k for all integers
    k. And then you get that even the smallest increment in time gives infinite variance
    which becomes messy.<p>[1]: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;L%C3%A9vy_process"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;L%C3%A9vy_process</a>'
