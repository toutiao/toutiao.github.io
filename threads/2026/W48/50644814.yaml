  author: chollida1
  text: "&gt; Black and Scholes&#x27; choice of of Brownian motion for the model is
    one I cannot swallow<p>Well its a great assumption and works most of the time.
    \ It is in fact, probably the right choice for pricing options in normal market
    conditions.  If you have other needs thankfully we do have other models that are
    in use<p>- Merton jump-diffusion, this uses Poisson jumps (usually log-normal)
    to GBM.  it shows Crash risk, and is used for short-dated options<p>- Heston,
    models using Stochastic volatility (CIR process) + correlation with the asset,
    is mostly used to model the Volatility smile&#x2F;skew, term structure of vol<p>-
    Local volatility (Dupire), its advantage is that Volatility is a deterministic
    function of spot and time.  It excels at modelling an Exact fit to the smile (used
    more for hedging&#x2F;exotics).<p>- Kou jump-diffusion, I&#x27;ll admit i don&#x27;t
    use this and I&#x27;m not as familiar with it but its models using Double-exponential
    jumps and it excels when you need to model the skew awhile still being relatively
    tractable<p><i>EDIT</i><p>as someone asked.  These are models that keep brownian
    motion but account for jumps.<p>We do have other models that replace the Brownian
    motion altogether.  The most common are Levy based models such as Variance Gamma
    and Normal Inverse Gaussian models.<p>I can&#x27;t speak to their use in the industry
    as I don&#x27;t work for an option market maker.<p>And for completeness i should
    mention the very common Binomial &#x2F; trinomial trees (Cox–Ross–Rubinstein,
    etc. family of models).  THese provide a discrete approximation and  can converge
    to Black–Scholes or be calibrated differently.<p>Their claim to fame was their
    ease of calculation back when this was a consideration."
