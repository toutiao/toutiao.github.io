  text: Well, I should just highlight that it&#x27;s possible for a path to follow
    Brownian motion &quot;most of the time&quot; but for relatively few times it doesn&#x27;t
    to follow it to contribute most of the path&#x27;s motion.<p>I&#x27;d assume you
    know that Benoit Mandlebot began his study of fractals with finance and noted
    how the characteristic of non-Gaussian stable distribution is exactly that most
    of the change happens with a small minority of jumps, see Fractals and Scaling
    in Finance, showing research long before Black, Scholes and Merton.<p>Indeed,
    all this was part of the critique that Mandlebrot and Taleb offered to the Black-Scholes-fueled
    financial engineering that lead up to the 2008 market crisis (unfortunately, Taleb
    kind of butchered the Gaussian&#x2F;Non-Gaussian distinction for a popular audience
    in his book Black Swan).
