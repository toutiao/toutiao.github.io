  title: Agentic Algorithm Engineering (AAE)
  fetch_status: success
  content: |-
    Agents that optimize your code like an algorithm engineer: a falsifiable hypothesis before every experiment, correctness checked after every change, one reviewable patch per accepted change, and a PDF report of the whole session.

    A skill for Claude Code and Codex, from the Algorithm Engineering Group at Heidelberg University.

    [GitHub](https://github.com/CHSZLab/AgenticAlgorithmEngineering)[Paper (DIMACS 2027)](https://arxiv.org/abs/2609.07204)[Quick start](#quick-start)[Example report](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/examples/reports/kahip_kaffpa_speed_report.pdf)

    ## Results on established open-source codes

    Every kept change was checked against the original output.

    | Code | Problem | Result | Correctness | Details |
    | --- | --- | --- | --- | --- |
    | [VieCut](https://github.com/KaHIP/VieCut) | exact minimum cut | 8.9x faster | every cut unchanged | [v2.0](https://github.com/KaHIP/VieCut/releases/tag/v2.0), [paper](https://arxiv.org/abs/2609.07204) |
    | [KaHIP](https://github.com/KaHIP/KaHIP) `kaffpa` | graph partitioning | 3.9x faster | partition quality unchanged | [v3.26](https://github.com/KaHIP/KaHIP/releases/tag/v3.26), [report](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/examples/reports/kahip_kaffpa_speed_report.pdf) |
    | KaHIP `ultra` | graph partitioning quality | 2.2% smaller cuts | same balance rule as `strong` | [v3.28](https://github.com/KaHIP/KaHIP/releases/tag/v3.28) |
    | Hochbaum's pseudoflow | maximum flow | 3.0x faster | flow value verified on 164 instances | [KB 039](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/knowledge-base/039-pseudoflow-solve-direction.md) |
    | [FREIGHT](https://github.com/KaHIP/FREIGHT) | streaming hypergraph partitioning | 1.82x faster | bit-identical output | [KB 035](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/knowledge-base/035-streaming-hypergraph-multipass-eval.md) |
    | [ParHIP](https://github.com/KaHIP/KaHIP) | distributed graph partitioning (MPI) | 1.61x faster | byte-identical partitions | [KB 040](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/knowledge-base/040-parhip-bit-identical-speedup.md) |
    | [ScalableCorrelationClustering](https://github.com/KaHIP/ScalableCorrelationClustering) | correlation clustering | 1.24x faster | identical solution quality | [v1.2](https://github.com/KaHIP/ScalableCorrelationClustering/releases/tag/v1.2) |

    ## How it works: the Algorithm Engineering cycle

    Algorithm Engineering is a cycle of design, analysis, implementation and experiment, driven by falsifiable hypotheses. AAE hands this cycle to an autonomous agent. During setup you agree with the agent on the benchmark, the metric, the correctness assertions and the budget; then it runs on its own.

    ### Design

    A falsifiable hypothesis: "changing X will improve the metric by roughly Z, because ..."

    ### Analyze

    Predict direction and size of the effect before measuring, from profiling and analysis.

    ### Implement

    A minimal change, committed to Git, with the correctness assertions checked.

    ### Experiment

    Run the benchmark; keep the change only if it is better and still correct, otherwise revert.

    ## What you get

    **Faster, still correct code** Every change is checked against assertions you agreed on, e.g. bit-identical output.

    **One patch per accepted change** Numbered Git patches in `patches/`, each with its hypothesis, easy to review and apply.

    **A PDF report** The trajectory of the metric and one page per tested hypothesis: intuition, prediction, measurements, verdict.

    [![Report page: trajectory of the running time over all experiments](assets/report-trajectory.png)](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/examples/reports/kahip_kaffpa_speed_report.pdf)[![Report page: one hypothesis with prediction, measurements and verdict](assets/report-hypothesis.png)](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/examples/reports/kahip_kaffpa_speed_report.pdf)

    From the report of the KaHIP `kaffpa` session: 122 experiments, 69 hypotheses, 41 patches, 3.9x faster in total.

    ## Quick start

    In Claude Code:

        /plugin install aae --marketplace CHSZLab/AgenticAlgorithmEngineering
        /aae:aae make the solver in src/ faster on the graphs in data/

    In Codex, install the skill with `scripts/install_codex_skill.py` and call it with `$aae`; any other agent can follow [AAE.md](https://github.com/CHSZLab/AgenticAlgorithmEngineering/blob/main/AAE.md). To try it first, run the [10-minute quick-start example](https://github.com/CHSZLab/AgenticAlgorithmEngineering/tree/main/examples/quickstart): a slow but correct shortest-path program with a benchmark and a correctness check.

    ## How AAE compares

    | | autoresearch | AlphaEvolve, OpenEvolve, ShinkaEvolve | AAE |
    | --- | --- | --- | --- |
    | Works on | one training script | code blocks scored by an evaluator | any existing code base and language |
    | Search | one agent, keep or discard | language-model mutations and an evolutionary population | one agent following the Algorithm Engineering cycle |
    | Before each experiment | the agent's next idea | a proposed mutation | a falsifiable hypothesis with its predicted effect |
    | Correctness | the metric | the evaluator score | assertions agreed with you, checked after every change |
    | What you get | improved script and log | best program and population | one patch per change, a PDF report, lessons in a shared knowledge base |

    ## Knowledge base

    Sessions share what they learned: the [knowledge base](https://github.com/CHSZLab/AgenticAlgorithmEngineering/tree/main/knowledge-base) collects optimization techniques and experiment results, and agents read it before they start. Contributions from your own sessions are welcome.

