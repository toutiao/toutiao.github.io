  author: thaumasiotes
  text: 'For a concrete example, parsing an ambiguous context-free grammar is O(n³).
    Not only is this in P, 3 is about as small as you can hope for an exponent to
    be.<p>We find that exponent of 3 so onerous that we devote all our efforts to
    developing unambiguous grammars instead.<p>Various gross programming errors come
    from using an O(n²) algorithm - quadratic time is considered the practical <i>worst</i>
    case for sorting algorithms, n+1 database queries are bad because they&#x27;re
    quadratic, returning-to-the-paint-pot ( <a href="https:&#x2F;&#x2F;martynplummer.wordpress.com&#x2F;2015&#x2F;10&#x2F;16&#x2F;shlemiel-the-painter-strikes-again&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;martynplummer.wordpress.com&#x2F;2015&#x2F;10&#x2F;16&#x2F;shlemiel-the-...</a>
    ) is bad because it&#x27;s quadratic...<p>Rockstar made the news by putting quadratic-time
    bugs into the loading screen for GTA Online: <a href="https:&#x2F;&#x2F;nee.lv&#x2F;2021&#x2F;02&#x2F;28&#x2F;How-I-cut-GTA-Online-loading-times-by-70&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;nee.lv&#x2F;2021&#x2F;02&#x2F;28&#x2F;How-I-cut-GTA-Online-loading-times...</a><p>Most
    of the discourse around &quot;polynomial time&quot; assumes that &quot;polynomial
