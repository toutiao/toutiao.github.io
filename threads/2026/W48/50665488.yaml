  author: hobofan
  text: Project estimates in e.g. software development are basically never correct
    because they are made with false assumptions (e.g. fungible capabilities between
    engineers, full focus on the topic) not seldomly because high ups don&#x27;t allow
    for reality in those assumptions.<p>Many modern building projects suffer a similar
    fate, but mostly because contractors cut corners without significant enough repercussions.
    In countries (e.g. China) where there is stronger enforcement, that ability to
    execute hasn&#x27;t eroded as strongly.<p>Humans are good in estimates (at a certain
    granularity we are almost concretely able to calculate how long something will
    take), but our social&#x2F;economical&#x2F;legal systems often leave a lot of
    room for error on the execution side.
