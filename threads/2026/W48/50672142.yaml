  author: camtarn
  text: I am currently working on a project using an industrial product with a source
    control method from a different plane of hell.<p>From the outside it actually
    looks well designed. Each file is versioned, versions have comments, and you can
    even Confirm versions to e.g. say that you have tested them and approved them
    for deploy. And the system keeps track of which version of each file is live on
    the running site.<p>The difficulty comes when you realise that it&#x27;s a graphical
    programming environment so there are no diffs between versions, all users work
    on a single server so a version might accidentally end up with unrelated changes
    from multiple users, and there is no way to group changes to multiple files together.<p>Oh,
    and files&#x27; build properties are unversioned.<p>And global variables (and
    there are <i>only</i> global variables) have their own incompatible versioning
    system.<p>And everything is stored in a completely proprietary DB instead of as
    files so you can&#x27;t even bolt your own version control onto the side.<p>Oh,
    and by default the system only keeps the last ten versions, and increasing that
    leads to trouble because you can&#x27;t delete anything that&#x27;s referenced
    in a past version...<p>And that&#x27;s before you even consider branching!<p>I
    have no doubt that all of this was revolutionary when the system was first built,
    presumably some time in the 90s, but right now it&#x27;s causing me to tear my
    hair out.
  score: 0
