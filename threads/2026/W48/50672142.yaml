  author: plorkyeran
  text: Calling IEBUPDTE a source control system is an extreme stretch. It&#x27;s
    basically the patch command for punch cards. SCSS in 1972 is more realistically
    the original. CVS in 1986 was the first to attempt to solve the problems that
    multiple developers working on the same codebase on multiple machines would run
    in to. SCSS and RCS helped you track the history of a file without manual backups,
    but the experience of collaborating on a file with multiple developers was a lot
    closer to the file on a network share approach than anything more modern.
