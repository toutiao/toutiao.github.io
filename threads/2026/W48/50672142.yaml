  author: kstrauser
  text: I joined an org in the early 2010&#x27;s and they&#x27;d just migrated from
    P4 to Git. Problem was they weren&#x27;t using any of its git-ness. In particular,
    their processes required a strict ordering of commits, but in ways that Git doesn&#x27;t
    support. Like they insisted on knowing that commit A was made before commit B
    -- not merged, but <i>committed</i> -- and we went round and round about that.
    Imagine that you and I are both on airplanes and hacking away, committing our
    work. It was important For Reasons to know that my work was written before yours,
    or vise versa. My coworkers were brilliant people in many ways but they jumped
    through some rather ridiculous hoops to make Git try to look exactly like P4,
    rather than leaning into its advantages on their own. It drove me nuts. I&#x27;m
    sure my insistence that &quot;this isn&#x27;t how this works&quot; drove them
    equally nuts.
