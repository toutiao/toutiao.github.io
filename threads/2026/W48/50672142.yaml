  title: Source Control From Hell / frantic.im
  fetch_status: success
  content: "# [Source Control From Hell](/git)\n\n Nov 27, 2026 by Alex Kotliarskyi
    \n ![](/assets/og/git.png)\n\nMy first office job was at&nbsp;an&nbsp;enterprise
    that built software for&nbsp;a&nbsp;big telecom: a&nbsp;massive Delphi help desk
    application on Windows.\n\nLet me tell you about how we managed source control
    process at&nbsp;the&nbsp;time.\n\nFirst, you download the&nbsp;code from a&nbsp;shared
    folder (hosted on a&nbsp;trusted Windows server in&nbsp;a&nbsp;locked room). Build
    your thing, run the&nbsp;app, test it locally. Then you upload your changes to&nbsp;the&nbsp;shared
    folder and&nbsp;create a&nbsp;new ticket in&nbsp;the&nbsp;internal task tracker
    (also a&nbsp;Windows app). The&nbsp;ticket should have a&nbsp;list of&nbsp;the&nbsp;changes
    you’ve made, in&nbsp;a&nbsp;rich text editor, in&nbsp;a&nbsp;manual format somewhat
    resembling a&nbsp;patch. But&nbsp;it wasn’t a&nbsp;patch; it couldn’t simply be
    applied with a&nbsp;tool. Instead, the&nbsp;tech lead looks at&nbsp;the&nbsp;shared
    folder and&nbsp;your task and&nbsp;copies the&nbsp;relevant changes to&nbsp;his
    own integration folder. This usually took him a&nbsp;full day because the&nbsp;shared
    folder had a&nbsp;lot of&nbsp;changes, not&nbsp;all of&nbsp;them were ready to&nbsp;be
    integrated. Needless to&nbsp;say, if you simply pull a&nbsp;snapshot of&nbsp;the&nbsp;code
    from the&nbsp;shared folder, it would most likely fail to&nbsp;compile.\n\nThe&nbsp;most
    common problem was two people overwriting each other’s work. So if you wanted
    to&nbsp;upload your stuff to&nbsp;the&nbsp;shared folder, you had to&nbsp;stand
    up and&nbsp;announce in&nbsp;a&nbsp;loud voice that you were using the&nbsp;shared
    folder. No&nbsp;chat apps back in&nbsp;the&nbsp;day.\n\nImagine starting your
    career with this development experience! I did my best to&nbsp;improve it. At&nbsp;the&nbsp;time,
    almost everyone used [FAR Manager](https://en.wikipedia.org/wiki/Far_Manager),
    so I built a&nbsp;plugin that locked the&nbsp;folder when someone was using it,
    so others would get a&nbsp;warning. It became very popular because nobody really
    liked the&nbsp;old yelling system.\n\nThen in&nbsp;2009 I found git. It was still
    early days, way before GitHub went mainstream, but&nbsp;my tiny little brain was
    blown away. Holy shit, it maintains old versions. And&nbsp;you can work locally.
    And&nbsp;you can sync and&nbsp;exchange deltas. And&nbsp;it was insanely fast
    (compared to&nbsp;the&nbsp;very aptly named TortoiseSVN I’d experimented with
    earlier). I must have rewatched [Linus’ talk](https://www.youtube.com/watch?v=4XpnKHJAok8)
    a&nbsp;billion times. I created git repos for&nbsp;every project I had, preached
    it to&nbsp;my friends, and&nbsp;even gave my first tech talk about git at&nbsp;my
    university.\n\nSadly, my diplomatic skills were extremely rudimentary, and&nbsp;I
    couldn’t convince our tech lead to&nbsp;adopt git. He mumbled something about
    business value and&nbsp;how this new git thing lacked one. I left the&nbsp;company
    after two years but&nbsp;kept meeting up with old colleagues for&nbsp;beer. They
    were still using the&nbsp;shared folder process many years later. It was crude,
    it was hellish, and&nbsp;it worked for&nbsp;them just fine."
