  author: forrestthewoods
  text: Git made a few nice improvements when it came out. But it kinda sucks. Every
    BigTech company has a different solution because vanilla Git is insufficient.
    Almost all game devs use Perforce (which also kinda sucks) because Git is wildly
    insufficient.<p>Mercurial was basically the same as Git but with a slightly more
    sane interface. Git won because original Mercurial was Python which was slow.
    But mostly because GitHub. World would be a better place if MercurialHub had won!<p>Git
    can’t handle large repos. Can’t handle binary files (Git LFS is a hack). GitHub
    only recently added stacked PRs and it sucks. The D in DVCS is worthless for almost
    all projects not Linux.<p>Here’s one for you. Almost no old Git project can even
    be built because Git is incapable of storing the build environment necessary to
    build it. Toolchains belong in version control but Git can’t handle that so people
    instead use Docker and if you want to build a 10 year old project then lol good
    luck.<p>Git is also awful for non-technical people. It’s a version control system
    and yet it’s relatively easy for people to have gitastrophes and if not lose their
    work require a Git expert to come in and run arcane bullshit to recover their
    commit(s).
