  author: kelnos
  text: "&gt; <i>Git made a few nice improvements when it came out.</i><p>That&#x27;s
    an understatement.  It was orders of magnitude better than Subversion at the time.<p>&gt;
    <i>Git can’t handle large repos.</i><p>I guess it depends on what your definition
    of &quot;large&quot; is, but I believe this is no longer the case.<p>&gt; <i>The
    D in DVCS is worthless for almost all projects not Linux.</i><p>Speak for yourself.
    \ Just being able to use git offline is a huge improvement over other VCSes, even
    if you&#x27;re the sole developer.  Yes, most people use git in a more centralized
    mode, pushing code and collaborating via a central server, but git&#x27;s distributed
    features still shine through here and there.  (Regardless, I&#x27;m not sure what
    point you&#x27;re trying to make; git being a DVCS but not often used distributed
    doesn&#x27;t really change anything.)<p>&gt; <i>Almost no old Git project can
    even be built because Git is incapable of storing the build environment necessary
    to build it. Toolchains belong in version control</i><p>I&#x27;ve certainly seen
    toolchains stored in version control (git or other VCSes), but that&#x27;s pretty
    rare.  I expect it was more common with smaller embedded systems (that is, architectures
    not well-supported by open source) where the toolchain was a custom hack of gcc,
    and having the right toolchain version from the chipmaker actually mattered.  (Been
    there, done that, it was a pain in the ass.)<p>These days it&#x27;s much less
    important to have the exact same toolchain, even for embedded systems, where ARM,
    RISC-V, Xtensa, etc. have started to dominate, and there are maintained, compatible,
    upstreamed, open-source toolchains for many things.<p>At any rate, you absolutely
    can put a toolchain in git if you want to.  Yes, it&#x27;s going to bloat the
    repo a bit, but if you need to, you can do it, and it&#x27;s not that big a deal
    (source: have done it, many many years ago).<p>&gt; <i>Git is also awful for non-technical
    people.</i><p>Yes and no.  Git&#x27;s UX has improved a lot over the past 20 years.
    \ It&#x27;s still not great, but a lot of the rough edges have been filed off,
    and there are lots of GUI tools and replacement CLI tools (like jj) that people
    can use instead."
