  author: nayuki
  text: 'I worked at a tech company in the year 2013 and our team was using Subversion
    (SVN). I don&#x27;t remember how, but I ended up in charge of periodically merging
    my teammates&#x27; changes from the development branch to the trunk. Needing to
    manually select the range of versions to merge (which requires both looking at
    the SVN merge metadata and looking back into history) and dealing with the merge
    conflicts were both tedious and hellish.<p>By that point, I had used Git for personal
    projects since 2010-ish and it worked out great. I believed that the SVN labor
    that I did at the job would be greatly reduced if we used Git instead. I voiced
    my recommendation to my manager and teammates, but it fell on deaf ears. (I noticed
    that some other teams occasionally downloaded public Git repos, but it seemed
    my team was insulated from the outside world.) I left the company a few years
    later, but in my final few months, I kid you not, my team was contemplating switching
    to IBM Rational ClearCase (possibly a mandate from higher-level decision makers
    for a consistent company-wide version control system; I don&#x27;t remember).
    I felt that CC would be a step backwards, after seeing reviews like this: <a href="https:&#x2F;&#x2F;stackoverflow.com&#x2F;questions&#x2F;1074580&#x2F;clearcase-advantages-disadvantages"
    rel="nofollow">https:&#x2F;&#x2F;stackoverflow.com&#x2F;questions&#x2F;1074580&#x2F;clearcase-advant...</a><p>&gt;
    The cost is a fairly obvious disadvantage. Not just the license cost, but also
    the cost of a ClearCase guru&#x27;s salary. Almost every company I&#x27;m aware
    of that uses ClearCase seems to have at least one person whose only purpose is
    to tame the unruly beast. The very fact that it&#x27;s complicated enough to require
    a full-time nanny is also worrying.<p>&gt; An absolute nightmare of a system.
    It made me wish we could go back to VSS! (Never mind any modern source-control
    system like Subversion or Git!) &#x2F; It&#x27;s slooooow. &#x2F; Whenever you
    try a large update or deliver operation it invariably FAILS for one reason or
    another, requiring your ClearCase guru to spend a few hour&#x2F;days figuring
    it out. Oh yes, you must have a dedicated, full-time ClearCase guru! &#x2F; Basically,
    it&#x27;s slow, complicated and unreliable as hell. Oh, and did I mention it&#x27;s
    ridiculously expensive? The only way they can possibly sell it is by talking to
    decision-makers who have never used the product and never will! I&#x27;m quite
    sure that no developer in the world would ever buy it.'
