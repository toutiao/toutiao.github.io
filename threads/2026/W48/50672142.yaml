  author: roryirvine
  text: I was properly spoiled - in the wake of the dot com bust, I moved from a small
    ISP which had used CVS to an online retailer that used Peter Miller&#x27;s Aegis
    system (<a href="https:&#x2F;&#x2F;aegis.sourceforge.net&#x2F;propaganda&#x2F;features.html"
    rel="nofollow">https:&#x2F;&#x2F;aegis.sourceforge.net&#x2F;propaganda&#x2F;features.html</a>).
    It was great - source control that operated a bit like Darcs or Monotone, combined
    with elements of CI. It was at least five years ahead of its time, and using it
    truly felt like living in the future.<p>I then moved to a SV tech giant which
    used an unholy mixture of Rational ClearCase for legacy projects, SVN for new
    work from the parts of the team based in the UK or US, and P4 for the part of
    the team based in France. People were so intimidated by this that they avoided
    using it whenever possible, so ended up manually juggling multiple copies of their
    work named v3_TEST, v3_FINAL, v3_REALLY_FINAL etc and only ever checked it in
    on the last day of the sprint.<p>My job was to implement CI (using Hudson), which
    managed to paper over the cracks to a degree - but the cultural issue of rarely
    checking in work persisted so we didn&#x27;t get as much value from it as we should
    have.
