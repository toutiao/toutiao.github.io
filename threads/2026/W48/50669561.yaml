  author: jmacego
  text: |-
    &gt; Do you manually compute your TCP&#x2F;IP packets?
    &gt; Do you do all the spreadsheet calculations yourself?<p>Nope, but I absolutely can do so and included those in interview questions for my engineers. But I made them all use sipcalc, because it&#x27;s faster and more accurate than working out subnets by hand. And Wireshark&#x27;s session tracking and decoding.<p>That didn&#x27;t mean they got to forget how. I&#x27;d still quiz them now and then, and laugh if they got it wrong. I just wasn&#x27;t going to fire anyone for using the tool.<p>But there is a serious case to be made for areas that we are going to lose competence on. The studies on what you outsource to agents leading to quite rapid atrophy of that part of your thinking are pretty damning. I&#x27;m very aware of it myself.<p>I tell myself:
    Does it matter that the average person can&#x27;t hunt and gather? No, agriculture freed people up from that and allowed more specialisation, a few percent of people could do activities not required for sustaining life itself. [Insert maslow&#x27;s hierarchy here, I suppose.] That (probably) allowed the building of cities and the start of civilisation.<p>Does it matter that the average person can&#x27;t farm? No, industrialising farming means that far fewer people have to work in subsistence agriculture and so are freed up to specialise, allocating more % of people towards production of goods.<p>Industrial production of goods -&gt; more workers in services. Then the shifting of services to more and more complexity.<p>In theory each of those have freed up labour to do more specialised tasks for society as a whole and, on the net, have been for benefit.<p>A year ago I wasn&#x27;t sure AI was going to have as big an effect, but I knew it was here to stay and going to replace some portions of what needs to be done for society. Today it seems quite certain that it is going to have a very large impact.<p>Am I concerned? Absolutely. Do I think we have any idea exactly what AI will automate? Nope, we still don&#x27;t. I&#x27;m going to disagree with &quot;think of how to build the robot or service fleet or rocket ship&quot; as things you suggest are the specialisations humans move further into.<p>I don&#x27;t recall who said this, but I&#x27;ve identified with it (paraphrased, probably): We thought in the future robots were going to do the menial work and free us up to do intellectual work, creative work, and art. It turns out that AI is coming for those first.<p>Human written, and then reviewed by Opus 5.5. I thought appropriate for reply on AI and it gives these nuggets (and complained that I use parentheticals, square brackets, and sentence fragments):
    Atrophy studies: Your brain on ChatGPT: <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2506.08872" rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2506.08872</a>
    The Impact of Generative AI on Critical Thinking: <a href="https:&#x2F;&#x2F;www.microsoft.com&#x2F;en-us&#x2F;research&#x2F;?p=1135061" rel="nofollow">https:&#x2F;&#x2F;www.microsoft.com&#x2F;en-us&#x2F;research&#x2F;?p=1135061</a><p>Actual quote: &quot;You know what the biggest problem with pushing all-things-AI is? Wrong direction. I want AI to do my laundry and dishes so that I can do art and writing, not for AI to do my art and writing so that I can do my laundry and dishes.&quot; -- Joanna Maciejewska [Who apparently almost shares my username! I find that really fun!] <a href="https:&#x2F;&#x2F;www.threads.net&#x2F;@authorjmac&#x2F;post&#x2F;C5GNzuaulLe" rel="nofollow">https:&#x2F;&#x2F;www.threads.net&#x2F;@authorjmac&#x2F;post&#x2F;C5GNzuaulLe</a>
  score: 0
