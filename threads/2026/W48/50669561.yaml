  author: trealira
  text: 'Only, even then I would argue that language itself is worth using. It carries
    a ton of culture and history with it. It is comfortable. The use of a particular
    language induces certain feelings in people, and there are bundled concepts encapsulated
    by words that would be hard to transmit as raw thoughts and concepts: a bit like
    how programming language concepts put concepts into grammar that would be hard
    to transmit in machine code or in assembly.<p>Gerald Sussman sometimes talks about
    &quot;accountable software&quot;, software that can explain why it made the choices
    it did (and not just come up with an explanation post hoc like an LLM might, but
    actually give you the reasoning it did). Similarly, the FSF specifically talks
    about software which is fixable and whose source can be audited by any user and
    modified by the user. <i>Knowing</i> software, as well as being able to &quot;hold
    it accountable,&quot; both empowers the human in this relation to the machine,
    and also makes the software more worth using in the first place.<p>Software is
    not just a means to becoming an application user: it&#x27;s worth understanding
    by itself. In my opinion, it&#x27;s not unlike how math is worth understanding,
    and if computers could only give a yes or no answer to a mathematical hypothesis
    without being able to provide a comprehensible proof, it would be disappointing.<p>Of
    course, we don&#x27;t need to understand every layer of every software stack,
    just as a mathemetician doesn&#x27;t need to see proofs of every basic mathematical
    concept, but just being able to form a coherent mental representation of the software
    is worth something.'
