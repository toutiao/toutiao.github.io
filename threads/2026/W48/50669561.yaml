  author: augment_me
  text: From what I have seen this is more related to a curiosity-based personality
    trait.<p>I am working with people who have built massive projects, like a custom
    compiler for a new accelerator with LLMs in 3 months, and they understand absolutely
    everything about the solutions and trade-offs made. They have had deep discussions,
    design trade-off talks with the models, abstraction discussions. If you ask them
    why something does not work, they can answer you on the spot, because they are
    curious about the solution, and have talked over this with the LLMs, they can
    question and motivate their choices. How was this done? FULL attention, questioning,
    reviewing, steering, thinking, benchmarking, debugging, hours spent fighting the
    biases of the LLMs to get to the truth of things. This in itself is hard work,
    that is unnecessary if you only care about the end result.<p>Would an LLM-only
    fully vibecoded custom-compiler made in 1 month instead of 3 be up to a similar
    performance? Probably. Would you personally learn less about the project and the
    trade-offs in this case? Most likely. Would you learn more from the project if
    you built it yourself from scratch in 6 months? Most likely.<p>So somewhere we
    are trading off&#x2F;amortizing our understanding of things based on our curiosity
    and the reality of the job market and expectations set on us.
