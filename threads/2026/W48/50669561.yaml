  author: andrew_eu
  text: 'I think it&#x27;s rather obvious at this point that the people who are able
    to achieve the most with AI are people who already had expertise in what they
    are trying to achieve. Not everyone with AI can write great software, but good
    developers with AI can write tons of good software. Not everyone with AI can generate
    mathematical insights, but trained mathematicians are making enormous progress.<p>I
    believe there is a much more worrisome corollary to this: using AI is a massive
    impediment to learning. I don&#x27;t know if I share the author&#x27;s feeling
    of &quot;getting dumber&quot; with using AI, but I am absolutely not getting smarter.
    Sure, it&#x27;s still possible to do research, to challenge your mind and integrate
    new concepts, to develop knowledge -- but the world does not incentivize this.
    Learning is becoming a hobby. The economic system most of us find ourselves in
    does not encourage nurturing such hobbies.<p>I worry very much about the impact
    this has on young people, and by extension the society they will (hopefully) become
    the stewards of.'
