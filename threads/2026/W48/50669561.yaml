  author: json_hero
  text: At my company I had to spend a few months advocating for the change to this
    kind of workflow, but I finally pushed through and got us to prototype with it
    a bit, and we now use it fulltime (it helps if you just blabber about buzz words
    like &quot;Software Factory&quot; to higher ups). It&#x27;s been wildly successful
    in terms of being able to get the entire team to have a shared idea of where we&#x27;re
    guiding the agents, everyone collaborates on a plan by bringing their own expertise.
    The plan is transparent to the entire team and there&#x27;s a breadcrumb for everything
    that will be done by the agent. Try it out, it&#x27;s 100% worth it.
