  text: I don&#x27;t know if this is good advice as the world is moving so fast, but
    I am still able to get those good &quot;I accomplished something&quot; chemicals
    by being much more ambitious in the tasks I take on with AI.<p>For example, I
    have a side business selling jewelry on the internet. Every week, I get a batch
    of rings from my casting house. I weigh them, measure the size and width, and
    take a photo or two. Recently with Claude fable 5.2 I tasked it with building
    me a contraption to do all of this with one click and get it into my database.
    We worked back on forth and came up with a design that I should be able to assemble
    and test soon. This is something I could have designed and built over many many
    days&#x2F;weeks of work, but instead it took 1.<p>Maybe I am &quot;lucky&quot;
    that I get feelings of accomplishment from that and maybe I shouldn&#x27;t actually
    feel accomplished. But I am getting a genuinely useful device and having fun along
    the way so I think its alright.
