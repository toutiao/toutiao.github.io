  author: trealira
  text: "&gt; I didn’t say language. I said the spoken word.<p>Words presuppose language.
    I understand the distinction you&#x27;re making between language and spoken language,
    but I&#x27;m not sure it materially changes the analogy.<p>&gt; Not because it’s
    objectively better.<p>No one said anything about being objectively better. I was
    saying that even with telepathy, language would be worth using anyway.<p>&gt;
    Often it is very hard to put into words what one is thinking or feeling and it’s
    hard to convey that to others. Famously so.<p>It is often hard to convey that
    to others. That doesn&#x27;t mean a raw thought transfer would make it any easier,
    just as being able to write directly in machine code doesn&#x27;t necessarily
    make it any easier to convey certain algorithms that are awkward to express in
    some programming languages.<p>I&#x27;m convinced that if telepathy existed, there
    would be telepathic languages; sending your thoughts in some structured form would
    probably make it more comprehensible. Humans have evolved for language. We don&#x27;t
    communicate through isolated sounds, either; we use words because shared symbols
    and structures make communication more comprehensible. They organize meaning;
    they compress it.<p>And words make it easier because others already made up the
    meaning for you. Likewise, it is often very hard to put into code what one is
    envisioning, while subroutines make it easier; it&#x27;s harder when the libraries
    you&#x27;re using don&#x27;t define those functions.<p>But just like a library
    user supplies their own code and uses the library functions differently to other
    people, a listener participates in language as well. By the act of using certain
    words, they contribute to defining these words and giving them meaning. This is
    how the definition of a word can change and evolve. Moreover, just the act of
    pinning a set of concepts and feelings to a word is a form of meaning creation.
    Words reify these concepts so that we can refer back to them: everyone knows what
    red is. The color &quot;red&quot; covers a range of colors that &quot;we&quot;
    and our ancestors have collectively defined as being part of the same set. Meanings
    can be different in every language. Hence, there are words in other languages
    that, while perhaps falling short of being untranslatable, are very hard to translate
    into English and must be translated with a different word each time.<p>That is
    what I mean when I say that there are bundles of concepts encapsulated by words
    that would be hard to transmit as raw thoughts."
