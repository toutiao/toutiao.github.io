  author: belval
  text: I would frame it as a shift in what you use your brain for, not a reduction
    in total brain usage.<p>Your ability to reason about specific function and track
    their behavior within a specific component is likely going down, that&#x27;s expected
    as the value of doing such a thing has gone down considerably.<p>Your ability
    to multi-task, think at a higher architectural level and define scope&#x2F;boundaries
    should be increasing as that&#x27;s the part that is still to this day hard for
    agents to properly do.<p>In much the same way that a mechanical engineer today
    after ~5 years on the job has lost much of their ability to do complex differential
    equations by hand, the software engineer is losing his ability to trace specific
    code paths and think about algorithms. You can decry it, but I am not sure that
    it means you are getting &quot;dumber&quot;.
