  content: "[← The archive](../archive) \n\nNo. 0003 · Sat 24 Oct\n \n# I'm scared
    of AI...\n \n\nDear Soapboxers, AI is scaring me, and not for the reason you think.
    Yes, the threat of increasing hacks that could melt down the global economy or
    trigger nuclear Armageddon is terrifying...but I can't do sh\\*t about that. What
    scares me is what AI is doing to my brain. I think I'm getting dumber every time
    I outsource my thinking to AI. Everything now takes less effort which sounds great,
    but there's no sense of achievement from it. I haven't taxed myself and I don't
    deserve the nice chemicals my brain would normally make if I completed some hard
    work, so it doesn't give me them. It feels like a use it or lose it situation
    where I'm losing my ability to brain. I read this last week: [https://poeticoutlaws.substack.com/p/the-comfortable-life-is-killing-you](https://poeticoutlaws.substack.com/p/the-comfortable-life-is-killing-you)
    which explains what I mean far better than I can (because I'm stupider now). Can
    anyone out there in the Soapbox hivemind share some advice on how to fix this?
    Or your own thoughts on it? I can't be the only one...\n\n \n\nWritten by a randomly
    drawn subscriber, read by a human, then sent to the whole list. Its writer chose
    to share it here.\n\n \n\n## Get these in your inbox.\n \n\nOne every morning
    at 08:00, written by someone on the list. Join, and the next one could be yours.\n\n
    [Join the draw](../)"
