  author: trashcan_man
  text: "After pondering the impact of AI through the lens of competitive&#x2F;complimentary
    cognitive artifacts (<a href=\"https:&#x2F;&#x2F;jackson-t.com&#x2F;cognitive-artifacts-complementary-competitive&#x2F;\"
    rel=\"nofollow\">https:&#x2F;&#x2F;jackson-t.com&#x2F;cognitive-artifacts-complementary-comp...</a>),
    I have been following these rough rules of thumb and do not feel much dumber despite
    heavy AI usage:<p>1) I am getting older. If, by my current age, I do not feel
    an immense amount of joy or motivation in trying to learn how to do something,
    I have no qualms offloading it to a machine that can do it for me. We do this
    every day with computers. This is also true of things I &quot;want&quot; to do
    but have never progressed in or enjoyed doing.\n2) If I am not able to think a
    few steps ahead of a language model and &quot;manage&quot; the flow of a process
    or predict and interpret the results, then I have not put enough effort into understanding
    my ask of an AI agent and I need to learn more before I leap. \n3) You&#x27;re
    probably not getting dumber, you are probably spending your free time in ways
    that are not rewarding. Put a musical instrument within arms reach of your battlestation.
    I&#x27;ve been &quot;trying to learn guitar&quot; for 15 years, and my actual
    progress correlates directly with my offloading of monotony onto algorithms that
    expedite the work. \n4) Even if you are getting dumber, thinking about getting
    dumber makes it worse! Make fantastical, Naruto-tier assumptions about your ability
    to think and do. You are probably hallucinating either way, so you might as well
    hallucinate in a way that reinforces positive feedback. Fear is the mindkiller."
  score: 0
