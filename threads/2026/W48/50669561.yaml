    How to adversarially test and harden systems I built without ever looking at the
    code. How to measure behavior. A sense of how and what agents build and where
    I know they will cheat or be lazy if I let them. How to run multiple projects
    that achieve real outcomes with all of the above. I am a better security engineer
    now and if you took LLMs away from me tomorrow I would still be a better security
    engineer. I have gotten to iterate so many different problems and potential ways
    of approaching them. I have made problems that I previously assumed were impossibly
