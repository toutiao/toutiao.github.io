  text: |-
    Hm it has Ubuntu packages, but no Debian.
    https://github.com/LadybirdBrowser/ladybird/blob/master/Documentation/BuildInstructionsLadybird.md

    Qt6.10+ development packages, nasm, additional build tools, and a C++23 capable compiler are required.

    And Debian 13 trixie doesn't have a new enough Qt version.

    A Rust toolchain is also required. You can install it via rustup.


    CMake 3.30 or newer must be available in $PATH.

    But all-in-all, it does seem reasonable, and perhaps going in a reasonable direction.  I used Firefox from maybe 2004 to 2023, and I wasn't happy about switching to Chromium in 2023.  There were multiple things that ruined Firefox, but for me I think it was mainly typing latency -- I kept having to delete my profile to get reasonable latency (Firefox on Debian).
    But then I've had similar problems on Chromium.  I noticed they both have the tendency to "rot" and slow down -- whenever I delete the profile in my $HOME dir, I get a big speedup.
    So maybe Ladybird will not suffer from all this bloat ... and maybe it won't be unreasonable to compile and configure yourself, without AI features and the like.  I think on most distros, Chromium is the package that takes the longest to compile.  And I think you have to download gigabytes of sources for it.
