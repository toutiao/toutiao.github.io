  content: "When you visit a secure website today, your browser connects to port 443
    and immediately starts speaking TLS. Only once the encryption is up and running
    does it get around to speaking HTTP. That’s two protocols stacked on top of each
    other, and the one at the bottom doesn’t know or care about anything the one on
    top has learned over the decades.\n\nThis is why so many good ideas from HTTP
    had to be reinvented, years later, inside TLS. The most notorious is SNI, which
    is a Host header with extra steps.\n\nIt didn’t have to be this way. Let’s take
    a trip into a parallel universe where Netscape didn’t take the easy way out.\n\n##
    \U0001F570️ The Fork in the Road\n\nWhen Netscape released SSL in 1995, it came
    with a new URL scheme (https://) and a new port number (443). Plenty of people
    grumbled. The web already had a protocol and a port, so why invent new ones? Why
    not secure the conversation you’re already having?\n\nTo be fair to Netscape,
    in 1995 there wasn’t really a “proper” way to do that. HTTP/1.0 had no mechanism
    for handing a connection over to another protocol. The Upgrade header didn’t arrive
    until HTTP/1.1 in 1997, and the Host header, which made it possible to run many
    websites on one IP address, came with it. Netscape couldn’t have used either of
    them because neither existed yet.\n\nBut this is my parallel universe, so let’s
    say HTTP grew those headers a couple of years early and Netscape decided to wait
    for them.\n\n## \U0001F310 Hello, Parallel Universe\n\nIn our universe, a TLS
    connection begins with a ClientHello and the server replies with its certificate.
    In the parallel universe, that first exchange is just plain HTTP in the clear.\n\nThe
    browser wants to buy something from shop.example.com. It connects to port 80,
    the same as always, and asks for the server’s certificate.\n\nGET /.well-known/tls-cert
    HTTP/1.1 Host: shop.example.com Accept: application/pkix-cert\n\n(Yes, /.well-known/
    is from 2010. It’s a parallel universe. Let me have this one.)\n\nThe server responds
    with its certificate, and the certificates of any intermediate CAs, as an ordinary
    HTTP response. The browser checks the chain against its list of root CAs, exactly
    as it would in our universe. Is it signed by someone we trust? Is it for shop.example.com?
    Has it expired?\n\nIf you’re worried about sending the certificate in the clear,
    don’t be. Every version of SSL and TLS up to 1.2 sent the certificate unencrypted
    too. A certificate is public by design. An attacker can swap it for a different
    one, but they can’t make one that’s valid for shop.example.com without a CA’s
    help, and if they can get one of those, you have bigger problems.\n\nOnce the
    browser is happy, it knows the server’s public key. It invents a random secret,
    encrypts it with that key and asks to upgrade.\n\nGET /checkout HTTP/1.1 Host:
    shop.example.com Connection: Upgrade Upgrade: TLS/1.0 TLS-Key: (the random secret,
    encrypted with the server's public key, in base-64)\n\nOnly the real server, holding
    the private key, can decrypt that secret. It replies with a random value of its
    own and switches protocols.\n\nHTTP/1.1 101 Switching Protocols Connection: Upgrade
    Upgrade: TLS/1.0 TLS-Nonce: (the server's random value, in base-64)\n\nBoth sides
    now derive their encryption keys from the browser’s secret, the server’s random
    value and a hash of everything that was said in the clear up to this point. Mixing
    in that hash means that if anyone tampered with the plaintext part, the two sides
    end up with different keys and the connection fails. From this point on everything
    on the connection is encrypted, starting with the response to GET /checkout.\n\nI’m
    describing the 1995 approach, where the browser encrypted a secret with the server’s
    RSA key. When Diffie-Hellman key exchange came along, it would have been just
    a different pair of headers: the browser sends its half of the exchange, and the
    server replies with its half, signed by the key in its certificate. Changing how
    keys are exchanged becomes header negotiation, which HTTP is already very good
    at.\n\nOr, to put it another way:\n\n> Browser: Hello, shop.example.com. Who are
    you?Server: Here’s my certificate.Browser: That checks out. Here’s a secret only
    you can read. Shall we go somewhere private?Server: 101.Eavesdropper: Aw.\n\nBrowser:
    Hello, shop.example.com. Who are you?Server: Here’s my certificate.Browser: That
    checks out. Here’s a secret only you can read. Shall we go somewhere private?Server:
    101.Eavesdropper: Aw.\n\n\"So why don't we go somewhere only we know?\"\n\n##
    \U0001F3E0 Virtual Hosting From Day One\n\nThe first thing we get for free is
    the one that took our universe the longest to sort out.\n\nThat very first request
    for the certificate has a Host header. A server hosting a thousand websites on
    one IP address knows exactly which certificate to send back, because the browser
    told it, using a header the server already understands. There’s nothing to retrofit.\n\nIn
    our universe, the server had to pick a certificate before it knew which website
    you wanted. For years, every secure website needed its own IP address, which was
    one of the reasons HTTPS stayed expensive and rare for so long. The fix was SNI,
    standardized in 2003: an extension that lets the browser mention the website’s
    name at the very start of the TLS handshake. In other words, a Host header, reinvented
    inside TLS. The parallel universe never needs it.\n\nAnd it’s all on one port.
    Firewalls, proxies and load balancers deal with port 80 and nothing else. A URL
    is a URL.\n\n## \U0001F4E6 A Smaller Black Box\n\nSo if SNI was standardized in
    2003, why couldn’t a website rely on it until the mid-2010s? This is the part
    I find most interesting.\n\nIn our universe, TLS is a black box. Your application
    hands a socket to a TLS library, and the library takes care of everything: negotiating
    versions, swapping certificates, exchanging keys and the encryption itself. The
    box comes with a large “do not touch” sign, which is good advice. People who write
    their own cryptography tend to get it wrong.\n\nThe trouble is that a black box
    that does everything can only be improved by whoever owns it. Browsers couldn’t
    use SNI until their TLS library supported it, and on many platforms that library
    was part of the operating system. Internet Explorer on Windows XP never got SNI
    at all. A website couldn’t rely on SNI until XP was finally gone.\n\nIn the parallel
    universe, the black box is much smaller. Finding the certificate, checking it
    and exchanging keys all happen in HTTP, in code that browsers and web servers
    already update all the time. What’s left inside the box is the genuinely hard
    part: given these keys, encrypt and authenticate everything that follows. That
    still deserves a “do not touch” sign, but it’s a box that rarely needs touching.
    The bits people keep wanting to change live outside it.\n\n## \U0001F3DB️ Room
    for New CAs\n\nThe parallel universe’s first request can do another job, too:
    it makes life much easier for new certificate authorities.\n\nIn our universe,
    a server sends one certificate chain to everyone, before it knows anything about
    who’s asking. In practice, that means a server operator can only use a CA that
    every browser on Earth already trusts. Nobody will pick a CA with less than 100%
    support, however good it is, so a new CA can’t get started. Even Let’s Encrypt,
    which had about the most compelling offer imaginable (free certificates, issued
    automatically), had to launch with a cross-signature from IdenTrust, an established
    CA, so that older browsers would accept its certificates. When that old IdenTrust
    root expired in 2021, devices that had never learned to trust Let’s Encrypt directly
    started failing.\n\nIn the parallel universe, the browser simply says which CAs
    it trusts, in the request:\n\nGET /.well-known/tls-cert HTTP/1.1 Host: shop.example.com
    Accept: application/pkix-cert Accept-CA: (a list of the root CAs this browser
    trusts)\n\nThe server can hold certificates from several CAs and pick one the
    browser will accept. That’s content negotiation, which HTTP has done since the
    beginni"
