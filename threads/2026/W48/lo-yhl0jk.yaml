    It’s a mistake to push TLS up the stack: it’s much better to move the security layer as low as possible (like QUIC) so that it can secure the transport, and so that different application protocols can share the security layer. TLS has been very good at application neutrality: basically only ssh has its own security layer and that’s largely due to it being too early.
    Another interesting parallel universe is one in which IPSEC had been usable by applications without cooperation from the kernel, and supported single-end authentication with a PKI. (I don’t know enough about IPSEC’s key distribution and authentication model, but I guess that’s another reason it’s only used in VPNs.)
