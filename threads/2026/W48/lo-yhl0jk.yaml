    Things seem to be moving towards helping people hide the desired hostname in the request by starting the connection encrypted. And that is a pretty damn good thing to have in a world where single IP happens to be a gateway to many very diverse resources, while the infrastructure all the way up to that IP is actively participating in an evesdropping operation. This proposal sort of requires to negotiate everything in plain text, which is a step backwards.
    Anyway, I never really figured out why anyone would look at STARTTLS and think "That's a good design, I want that in my protocol." All you get is backwards compatibility exactly where you don't want it and a wide array of ways to accidentally mess things up.
    And the fact that Netscape made TLS a transport protocol that cares not about the inner protocol is exactly the reason why we didn't have to reinvent the wheel every time we remembered that another service is transmitting in clear text.
