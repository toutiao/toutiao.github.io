    The rough history is that in the late 1990s, SSL/TLS were retrofitted onto a bunch of protocols in the same manner as http, so they got allocated a second port with an “s” appended to the protocol’s URL scheme. (Principally imaps, pops, smtps; it didn’t happen to telnet and ftp in the same manner.)
    There were a couple of problems with this approach. More broadly, some in the IETF didn’t like the duplication, especially because there was a risk that another security layer might turn up (kerberos? ipsec?) then every application might need 5 ports and 5 URL schemes. And specifically for SMTP it wasn’t obvious how smtps should be negotiated between sites, made more difficult because at that time there was not yet a clear distinction between mx, submission, and relaying.
    So STARTTLS was invented to deal with these problems in the mail protocols, and adapted in similar style for jabber/xmpp, and http Upgrade: TLS. (Compare and contrast the layer cake of SASL + GSSAPI + Kerberos which can also establish a security layer with client authentication.)
    But then it was realised that it’s very difficult to avoid downgrade attacks. (It could have been better for the MUA protocols, in theory, if MUA software had done sensible things like automatically setting a strict transport security flag when the server offers TLS. But in practice MUA configuration was a shitshow.) And it transpired that TLS had won the secure protocol wars. So everything went back to the original design with separate cleartext and TLS ports.
    Except for SMTP to MX servers, which has awkward naming issues that were not clarified until far too late, and even more awkward compatibility issues, so it’s stuck on STARTTLS.
