    The usual answer for the issue with WebPKI is that it's got way too many companies involved, where an issue with a single one will cause the entire system to break for a short while.
    One of the issues I have is that it relies on the CA paying for audits of themselves, which causes an issue in that the incentive for auditors is to not find things, because if you get known as the ones who fail everyone, no one will buy your services when they can get someone to skim over your documentation and rubber-stamp an audit. There's a reason restaurants don't get to pick and choose who comes to inspect them.
    Not everyone will be trying to skirt the requirements that come with being a CA, but all it takes is for one to do so and then end up compromised over it.
