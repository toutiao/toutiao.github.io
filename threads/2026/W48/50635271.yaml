  author: flowerlad
  text: Cholesterol lowering is not necessarily the reason for this outcome. If it
    was, lowering cholesterol via any means should have produced the same benefit,
    but it doesn’t. One obvious way to confirm this is to find therapies that lower
    cholesterol by different means (i.e., other than statins) and see if they, too,
    prevent heart attacks. They don’t [1]. The main reason why statins work may not
    be because they lower cholesterol, but because they reduce the inflammation that
    leads to heart attacks [2].<p>[1] <a href="https:&#x2F;&#x2F;www.nytimes.com&#x2F;2008&#x2F;01&#x2F;27&#x2F;opinion&#x2F;27taubes.html"
    rel="nofollow">https:&#x2F;&#x2F;www.nytimes.com&#x2F;2008&#x2F;01&#x2F;27&#x2F;opinion&#x2F;27taubes.html</a><p>[2]
    <a href="https:&#x2F;&#x2F;www.bloomberg.com&#x2F;news&#x2F;articles&#x2F;2008-04-15&#x2F;heart-disease-not-about-cholesterol-businessweek-business-news-stock-market-and-financial-advice"
    rel="nofollow">https:&#x2F;&#x2F;www.bloomberg.com&#x2F;news&#x2F;articles&#x2F;2008-04-15&#x2F;heart-dis...</a><p>Excerpt
    from [1]:<p>Vytorin is a combination of cholesterol-lowering drugs, one called
    Zetia and the other a statin called Zocor. Because the two drugs lower LDL cholesterol
