    Somehow it&#x27;s kind of hand-waving prediction like earthquake long term prediction that everyone ignore.<p>For non-invasive heart disease risk prediction nothing beat ECG, period.
    Somehow American Heart Association and its European counterpart are in denial, and still pushing dinasour screening mechanism with very low accuracy for heart disease risk prediction.<p>The standard risk model for CVD based on PREVENT (US) and SCORE-2 (Europe) like parameters are very poor as reported in the recently published paper on the their accuracy performance by the Swedish team [1]. As all CVD risk stratification with cardiologist review (expert-in-the-loop), the most important accuracy metric is sensivity&#x2F;recall (avoiding false negative that will escape review) of PREVENT and SCORE-2, 26% and 48%, respectively.<p>The paper alternative proposal increased the sensitivity to 58% by performing clustering instead of conventional regression models as practiced in the PREVENT and SCORE-2.<p>These type of models including the latest proposal performed very poorly as indicated by their otherwise excellent and intuitive display of graphical abstract results [1].<p>[1] Risk stratification for cardiovascular disease: a comparative analysis of cluster analysis and traditional prediction models:<p><a href="https:&#x2F;&#x2F;academic.oup.com&#x2F;eurjpc&#x2F;advance-article&#x2F;doi&#x2F;10.1093&#x2F;eurjpc&#x2F;zwaf013&#x2F;7954595" rel="nofollow">https:&#x2F;&#x2F;academic.oup.com&#x2F;eurjpc&#x2F;advance-article&#x2F;doi&#x2F;10.1093&#x2F;...</a>
