  text: It may be too late with all the other comments but...<p>If you have a lot
    of small dense LDL (SDLDL), something you can measure more accurately by measuring
    your apob levels, then you can by just gross LDL levels, then you are apparently
    far more likely to have atherosclerosis.<p>One of the ways to get a lot of SDLDL
    is to have high triglycerides. One way to get high triglycerides is to have a
    sugar&#x2F;simple carb heavy diet that you can measure with your blood glucose
    (though there are people who have high triglycerides without that).<p>If I recall
    correctly, if you keep your blood sugar below 100, you&#x27;re likely to keep
    your triglycerides below 115 and you&#x27;re likely to keep your small dense LDL
    very low, and instead have fat globular LDL that is not near as troublesome to
    your arterial walls.
