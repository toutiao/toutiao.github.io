  title: Heart attack and stroke risk detectable decades in advance | News | The University
    of Edinburgh
  fetch_status: success
  content: "# Heart attack and stroke risk detectable decades in advance\n\nEarly
    warning signs could help doctors predict those at risk of a heart attack or stroke
    up to 30 years before an event, research suggests.\n\nScientists identified early
    patterns in a range of risk factors for cardiovascular disease – conditions affecting
    the heart and blood vessels – including high blood pressure, diabetes and kidney
    function.\n\nThey also revealed differences in the blood of those who went on
    to have a cardiovascular event, such as a heart attack or stroke, more than a
    decade beforehand.&nbsp;&nbsp;\n\nThe findings highlight a large window of opportunity
    to intervene to reduce cardiovascular risk and prevent the development of serious
    disease, experts say.\n\n## Disease risk\n\nCardiovascular disease kills one in
    four people in the UK. Traditional risk factors, such as high blood pressure and
    cholesterol, have been widely linked to the risk of disease. However, previous
    studies have typically focused on a single risk factor and don’t monitor long-term
    changes.\n\nOther influences, such as kidney function and biomarkers in the blood,
    could also play an important role in establishing disease risk.\n\nA research
    team, led by the University of Edinburgh, examined data from more than 100,000
    people between 1985 and 2019 to explore the patterns of multiple risk factors
    in relation to cardiovascular events over time.&nbsp;\n\nThe research, funded
    by the British Heart Foundation, included data from four population studies across
    the United States, Norway and the United Kingdom.&nbsp;\n\n## Blood pressure\n\nSystolic
    blood pressure – the pressure in arteries when the heart beats or contracts –
    was consistently higher in those who went on to develop cardiovascular disease
    compared with those who were event-free, starting at 4 mmHg higher three decades
    before and increasing to 7 mmHg closer to the event.\n\nPatterns were different
    between sexes throughout life. Younger women had lower blood pressure than younger
    men, but this switched around the age of 65, when female readings tended to be
    higher than males.\n\n## Other patterns\n\nResearchers also identified important
    differences by age. Those who experienced a cardiovascular event at a younger
    age were more likely to have diabetes and a higher body mass index in the decades
    before the event.\n\nPatterns in blood biomarkers also revealed early differences
    between those who went on to develop cardiovascular disease compared with those
    who didn’t.&nbsp;Changes in the levels of a protein called NT-proBNP – used to
    monitor heart failure – could be seen up to 10 years beforehand.\n\nTrajectories
    of other non-traditional cardiovascular risk factors, including physical activity
    and kidney function, also differed between individuals with and without cardiovascular
    events.&nbsp;\n\n## Predict risk\n\nTracking the course of risk factors over time
    may help to better predict serious cardiovascular events, experts say. Further
    research should also explore whether incorporating non-traditional risk factors
    could help to improve the estimation of cardiovascular disease risk, they add.\n\nThe
    study did not look at risk factors by ethnicity, and the team cautions that further
    research exploring potential differences in risk factor and biomarker trajectories
    across ethnic groups is needed.\n\n> I am excited about the findings of our study
    as they show that modifiable risk factors begin to diverge 30 years before a cardiovascular
    event occurs. This highlights a great opportunity to develop early prevention
    strategies throughout the life course, utilising the patterns of established and
    emerging risk factors and biomarkers to reduce future cardiovascular events.\n\n_Dr
    Dorien Kimenai\n                  BHF Research Fellow, Usher Institute_\n\n> For
    the vast majority of people, heart attacks and strokes are completely preventable.
    But many of us don’t realise we are at risk until it’s too late.&nbsp;\n> \n>
    This study adds to growing evidence that red flags for cardiovascular disease
    appear decades before it arrives. That could lead to a simple blood pressure reading,
    or proteins in the blood, being used to forewarn people of their future cardiovascular
    risk. Knowledge like this could empower people to make lifestyle changes or start
    treatment while they are still relatively young, which might reduce their risk,
    prevent a heart attack or stroke, and rewrite their future.&nbsp;\n> \n> For now,
    it is worth remembering that we can all find out our risk of cardiovascular disease,
    for example by ‘knowing your numbers’ and getting your blood pressure and cholesterol
    checked, or having a free NHS health check with your GP in midlife for those living
    in England.\n\n_Professor Bryan Williams\n                  Chief scientific and
    medical officer at the British Heart Foundation_\n\n## Related links\n\n[Read
    the paper](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/10.1001/jamanetworkopen.2026.45690?guestAccessKey=3b18e5dc-b122-4634-a5df-ada725268605)\n\n[Usher
    Institute](https://usher.ed.ac.uk/)\n\n## Tags\n\n2026\n\nFuture of Health and
    Care\n\nResearch\n\nThis article was published on"
