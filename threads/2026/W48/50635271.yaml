  text: |-
    We definitely have leads.<p>There&#x27;s a lot of research that correlates consumption of ultra processed foods to heart disease and other very common chronic diseases.  I won&#x27;t claim here that causation has been shown, that takes a very particular kind of study that likely hasn&#x27;t been done.<p>Whether the problem with the ultra processed foods is the sugar, the high-glycemic-index carbs, the refined oils, the rancidity of the lipids, the weird chemical additives, the incidental chemicals like pesticides, or the lack of beneficial nutrients, or some combination of the above, has not been studied enough yet.  I tend to believe all of those contribute but it remains to be shown how much each contributes.<p><a href="https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;38418082&#x2F;" rel="nofollow">https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;38418082&#x2F;</a>
    <a href="https:&#x2F;&#x2F;academic.oup.com&#x2F;eurheartj&#x2F;article&#x2F;47&#x2F;27&#x2F;3456&#x2F;8661792?login=false" rel="nofollow">https:&#x2F;&#x2F;academic.oup.com&#x2F;eurheartj&#x2F;article&#x2F;47&#x2F;27&#x2F;3456&#x2F;866179...</a><p>I know people personally who have made progress toward reversing cardiovascular disease and diabetes through diet, by completely avoiding processed foods.  I&#x27;ve been doing this myself for most of my adult life and am in excellent health, unlike some family members who have some of these diseases and eat a lot of processed foods.<p>Of course there&#x27;s a lot more to it too, exercise, community, and many many other factors are involved.  But I bet diet is a big one.
