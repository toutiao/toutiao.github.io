    of evidence that shows that opening blockages with stents or bypassing them with
    surgery in stable patients does not reduce the risk of future heart attack or
    death over medical therapy alone. Pause there. Read that paragraph again. It is
    the crux of the problem. A coronary stent can be lifesaving when placed during
    a heart attack but has zero effect on future outcomes when placed in a stable
    patient. It’s counter-intuitive but it is what the evidence shows. RCTs such as
