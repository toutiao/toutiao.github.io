  author: piltdownman
  text: Well its not. His Estate, by virtue of his remaining Copyright privileges,
    funds life-changing work for tens of thousands of children.<p>Netflix bought the
    full rights of his entire bibliography in September 2021 for somewhere between
    £350-500 million off the family. A large chunk of it went to establish a charitable
    trust supporting children&#x27;s health, anti-hate, and anti-racism initiatives.<p>This
    is only good and proper, not to mention appropriate given that Dahl was a raging
    anti-semite despite fighting in WW2 and being one of 7 planes that survived The
    Battle of Athens after the dozen planes left in 80 Squadron were intercepted by
    over 150 Messerschmitts.<p>Previously his estate established a charity to aid
    the NHS trusts financially in supporting children and young people living with
    serious, complex, and lifelong health conditions across the UK. More than 300
    Roald Dahl Nurse Specialists have been established across more than 85 NHS Trusts,
    supporting over 60,000 children and young people.<p>For anyone who has read his
    autobiographical work, you will know that he actually invented helped invent the
    Wade-Dahl-Till (WDT) valve, as well as a catheter placement tool, in the early
    1960s to treat hydrocephalus (fluid buildup in the brain). This was because Dahl&#x27;s
    4-month-old son, Theo, suffered a severe head injury in a traffic accident and
    developed hydrocephalus. His shunt kept blocking so Dahl collaborated with a toy-maker
    and a neurosurgeon from Great Ormonde street, and the resulting solution was subsequently
    used for years to treat thousands of patients.
