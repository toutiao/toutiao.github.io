  author: piltdownman
  text: Dahl only started writing Children&#x27;s books after being a Fighter Ace
    and Kompromat Sex-Slave for the British Secret Service in WW2. First Lady Eleanor
    Roosevelt enjoyed reading Roald Dahl&#x27;s 1943 book The Gremlins to her grandchildren
    and invited Dahl to the White House, and the rest is basically history.<p>Once
    he had replicated his Uncle Oswald&#x27;s success as a philanderer and bon vivant,
    he then retired to his shed in Buckinghamshire and redefined 20th Century Children&#x27;s
    Literature. His autobiography Flying Solo is a masterpiece and fills in a lot
    of gaps regarding his life. His early war stories like &#x27;A Piece of Cake&#x27;
    add some flavour and speak to his early influences.<p>If you haven&#x27;t read
    his Adult Fiction you&#x27;re in for an absolute treat. His collection Switch
    Bitch, which originally appeared in mid 70s Playboy, is a great start in terms
    of re-orienting yourself.<p>Then you can move on to his post-Laurie Lee ruminations
    on the realities of British country life. He&#x27;s almost at his strongest articulating
    the griminess of poaching, ratting, and greyhound race fixing in the seedy underbelly
    of the pastoral British Countryside. This was later sanitised for younger readers
    and repackaged as &#x27;Danny the Champion of the World.
