  text: 'I do forget that my Mastermind special topic isn&#x27;t everyone&#x27;s specialist
    domain!<p>&quot;Kiss Kiss&quot; in 1960 is the first inclusion of &quot;The Champion
    of the World&quot; first published as a one-off in The New Yorker on January 31,
    1959<p>&quot;Ah, Sweet Mystery of Life: The Country Stories of Roald Dahl&quot;
    1984 also contains it and expands on the related universe. It splits up the individual
    stories in &#x27;Someone like You&quot; (1953) referred to as &quot;Claude&#x27;s
    Dog&quot;, where &quot;The Great Automatic Grammatisator&quot; is also included.<p>&#x27;Mr
    Feasy&#x27; appears in both, first published as &quot;Dog Race&quot; in The New
    Yorker on July 25, 1953.<p>&quot;Danny, the Champion of the World&quot; - the
    sanitised children&#x27;s iteration of the country-life universe - was published
    in 1975. The &quot;Big Friendly Giant&quot; passage was later expanded into &#x27;The
    BFG&#x27; in 1982, and the caning incident with Captain Lancaster was lifted from
    Dahls own life and recounted in his early-years Autobiography &#x27;Boy&#x27;
    published in 1984.<p>Any fan of Laurie Lee, H.E. Bates, Patrick Kavanagh et al
    would do well to put them on their list.'
