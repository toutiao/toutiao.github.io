  author: comrade1234
  text: Lahore is beautiful. I was spending a lot of time in India for work, Delhi
    and Hyderabad. You get used to the pollution and garbage everywhere.<p>My wife
    had a business meeting in Lahore so I went to Amritsar and crossed on foot (I
    don&#x27;t think you can do this anymore). I spent a couple of hours being interrogated
    by border agents before I realized I wasn&#x27;t even out of India yet. They made
    me exchange all of my Indian money back to dollars because it&#x27;s illegal to
    take Indian money out of India?<p>I eventually made it to the actual border. I
    was pulling my suitcase through what seemed like an abandoned village and parade
    grounds when I heard someone laughing. I stopped and looked around and saw a giant,
    maybe 6&#x27;7&quot; soldier carrying a big machine gun coming out from what looked
    like a bunker. He was clearly happy to see me and asked for my passport. His accent
    sounded like he was from New Jersey. We talked a bit and he told me how to get
    to the customs building.<p>It was maybe another twenty minutes of walking to the
    customs building. They didn&#x27;t process me but had me wait on a bench. After
    awhile a guy in street clothes sat with me and started asking casual questions
    about my job, what I&#x27;m doing here, etc. when I told him I&#x27;m meeting
    my wife who had business meetings his demeanor changed completely &quot;oh you&#x27;re
    with &lt;my wife&#x27;s name&gt;&quot; and he personally escorted me through customs
    and his driver gave me a ride to my hotel. I later found out he was head of Punjabi
    region secret intelligence and the people my wife was meeting informed him ahead-of-time
    of my visit.<p>Driving to the hotel I immediately noticed how clean it was. Shopkeepers
    were outside their shops sweeping. There was no garbage in the street. The air
    was clean. It was worlds of difference from where I had just been in Delhi and
    Hyderabad.
