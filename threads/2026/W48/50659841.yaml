  author: caniscrator
  text: 'I got to spend time in a couple of his buildings and it is hard to put into
    words how different they feel from an ordinary concrete house. The walls are lime,
    not cement, finished in limewash tinted with natural pigment, so the colour lives
    in the surface and the plaster breathes. The air inside stays dry and faintly
    mineral. No trapped damp, no paint smell.<p>The roofs are what stopped me. No
    reinforced concrete slab overhead anywhere. The domes and vaults are brick set
    in lime, shaped so the whole thing stands in pure compression, which is why they
    need no steel inside them, the thrust runs down into thick masonry walls instead
    of being held by rebar. His craftsmen rebuilt methods that had nearly died out,
    the flat brick dome and the muqarnas, and one of them said it had not been done
    in 300 years. The dome ceilings are finished in ghalibkari.<p>Why it matters past
    the look: a reinforced concrete building is on a clock. The steel inside corrodes,
    expands and spalls the concrete off, which is why so much RC gets written off
    around the 50 to 60 year mark. Lime has nothing in it to rust. It also heals itself,
    a hairline crack takes in moisture and the lime redeposits as calcite and closes.
    And when a lime building finally comes down, the mortar is softer than the brick,
    so the bricks lift out clean and get used again. Cement mortar is harder than
    the brick, so you are left with rubble.<p>As someone from the subcontinent, this
    is the part that gets me. Indian forts, temples and havelis were built in lime
    gauged with surkhi (brick dust) and tempered with jaggery and plant extracts,
    and plenty are still standing after 200, 500, some close to two thousand years.
    Cement is little more than a century old here, and we took it as progress while
    forgetting a material that outlives it. What he is keeping alive in Lahore is
    the craft my side of the border let slip.'
