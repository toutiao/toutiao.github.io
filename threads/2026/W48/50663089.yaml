  author: kbr-
  text: 'This is exactly what I do in $dayjob. I call it Property Driven Development.<p>I
    start with prose requirements, then use Elenxis (<a href="https:&#x2F;&#x2F;github.com&#x2F;kbr-&#x2F;elenxis"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;kbr-&#x2F;elenxis</a>) to translate
    into formal Lean model.<p>Then I state signatures and conjectures that the spec
    must have. Properties that the future implementation must hold. No implementation
    yet.<p>Only once all conjectures are there, we are ready to roll.<p>If I write
    in Lean, I can now fill in the signatures&#x27; implementations. Then prove theorems.
    Proof doesn&#x27;t go through =&gt; bug. Fix, retry, repeat.<p>If I write in an
    inferior language, there is extra Intermediate step: translating the conjectures
    into property test in the language. Only once these are ready, I can write implementation.<p>You
    must not write implementation before having all conjectures stated -- otherwise
    the implementation will bias your thinking, and you will try to prove properties
    of your implementation instead of what you needed.<p>All of the above applies
    equally to AI agents.'
