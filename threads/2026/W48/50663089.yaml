  author: markhermeling
  text: |-
    The way I see it is that there are 2 places where formal methods help:
    - Proof the absence of runtime-errors&#x2F;panics
    - Proof functional correctness<p>The sweet spot for many users is the first. Make sure that the application cannot crash. No array-out-of-bounds read&#x2F;write, no memory issue on ANY input, formally proven at compile time.<p>This requires additional work in the program to annotate (in SPARK at leasts) and knowledge from the programmer, which meant that there was a barrier to entry.<p>Well, LLMs COMPLETELY remove this barrier to entry. You can write the logic and have the LLM add the contracts to get to the proof. This works in most cases.<p>And then, for truly critical code, you can look at functional correctness as a cherry on top of your cheesecake.
