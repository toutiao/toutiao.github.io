  author: nickpsecurity
  text: Formal methods may or may not help you. I remember Amazon or another company
    using TLA+ on a distributed system quickly found a bug that would&#x27;ve taken
    over two dozen steps to hit.<p>The concurrency bugs SPIN and TLA+ find also eat
    tons of debugging time because they are hard to replicate. They&#x27;re often
    called heisenbugs for how they&#x27;re there and not there depending on the observer.<p>Static
    analyzers with low, false positives catch tedious or corner-case bugs developers
    often miss. That already tells you that any formal method that makes software
    immune to those big classes will also improve quality. SPARK Ada and Frama-C both
    do that.
