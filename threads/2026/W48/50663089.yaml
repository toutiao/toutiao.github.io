  author: rramadass
  text: You might find some of my previous comments useful.<p>On <i>Formal Methods
    Thinking&#x2F;Levels</i> and <i>(In)Formal Methods</i> - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50478624">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50478624</a><p>On
    <i>Design By Contract</i> (DbC) - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50108540">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50108540</a><p>On
    <i>Combining Tests and Proofs with Contracts</i> - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50108206">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50108206</a><p>On
    <i>Correctness-by-Construction</i> - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49613696">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49613696</a><p>Note
    that the above is based on using classical logic predicates to &quot;steer&quot;
    the program through its &quot;state space&quot;. This is the more fundamental
    and &quot;simpler&quot; approach since it uses only First-Order Logic.<p>Another
    way is to use the Type System (constructive logic, dependent types in Lean4 etc.)
    to embed the above directly into the program types. This is harder since you need
    Typed Lambda Calculus, Higher-Order Logic and need to think quite differently.
    For this you can read <i>Types and Programming Languages</i> by Benjamin Pierce
    and&#x2F;or any number of lambda calculus books. The Curry-Howard Correspondence
    helps you understand this if you have some idea of the above state space approach.<p>Finally,
    if you want to <i>know&#x2F;study</i> the whole of above you need to read <i>Understanding
    Formal Methods</i> by Jean-Francois Monin - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50506655">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50506655</a><p>It
    is all overwhelming at first if you are completely new to it so use it as a roadmap.
    Survey all of the above to get a grip on the jargon, notation and application
    and then choose your approach&#x2F;logic&#x2F;tool based on your interests&#x2F;needs.
