  text: We don&#x27;t really have a verification crisis, we have a validation crisis.<p>Ever
    more cycles spent checking we&#x27;re building the thing right doesn&#x27;t address
    the issue of whether we&#x27;re building the right thing.<p>The debate has always
    been whether running cycles on &quot;compile&quot; which is checking against a
    largely fixed set of rules is better than &quot;testing&quot; which is checking
    against a largely dynamic set of rules. &quot;Testing&quot; tends to be able to
    do validation better than &quot;compile&quot;.<p>That&#x27;s been the running
    debate between dynamic typed and static typed computer languages for the last
    half century or so. It swings backwards and forwards.<p>Like centralised vs distributed
    I don&#x27;t see there being &quot;a&quot; answer other than &quot;it depends&quot;.
