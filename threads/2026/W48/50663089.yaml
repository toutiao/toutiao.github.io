  author: zappb
  text: Languages like TLA+ lay at the opposite end of the spectrum of how programs
    can be optimized. The more space you leave for optimization, the larger the search
    space becomes in evaluating the TLA models. The smaller the space you use for
    the models, the more constrained your optimizations become. It seems as though
    the two can’t be combined without finding an appropriate balance point at which
    point you’d probably have something very similar to existing languages.
