  text: Lean 4 itself is a general purpose functional programming language with dependent
    types in addition to being a interactive theorem prover. Only the latter has been
    made famous&#x2F;popular by the mathematicians.<p>Idris, Agda are (like Lean4)
    functional languages and proof assistants. Dafny, Ada SPARK are imperative and
    automated solver languages.<p>Languages like C&#x2F;C++ which do not have powerful
    type systems nor are verification aware have tools like Frama-C, CBMC etc. to
    help with their formal verification. Rust also has some external formal verification
    tools.<p>With growing awareness of formal verification due to LLMs one (or more)
    of them is sure to become &quot;mainstream&quot;.
