  author: onion2k
  text: "<i>Why?</i><p>A type hint says &quot;only accept things that look like this&quot;
    and a compiling or a type checker can statically analyse the code to make sure
    that&#x27;s valid everywhere. If you don&#x27;t have that then the LLM would need
    to track back through the call tree to the originating point that defines the
    shape of the thing being passed to understand if it&#x27;s valid all the way through
    the app in order to know that the data is correct. As it can&#x27;t know where
    the originating call starts, it needs context of everything. It might only read
    the code it needs to read, and that can be done easily with an agent driving a
    small model, but it still needs complete access to every part of the app in order
    to trace what it needs to. With type hints it can just run the type checker to
    validate the code is OK and then trust the type hints."
