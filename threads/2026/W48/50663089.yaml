  author: onion2k
  text: "<i>LLMs don&#x27;t care and can just as easily keep track of them as separate
    concerns.</i><p>Only if they have the context of every part of the code though.
    If you put type hints in your code then the LLM can understand the shape of what
    some code is supposed to send&#x2F;receive without having to trace back through
    the code to the source of that data. That means a model with a <i>much</i> context
    window can successfully change it. That&#x27;s both cheaper and faster.<p>Also,
    we can still do things without LLMs. You can compile and test code as a part of
    CICD, and having something doing a static type check is a good quality gate.<p>Maybe
    in a future where we run models locally that&#x27;s not an issue, but if Anthropic
    100x their prices tomorrow I&#x27;ll be glad I left <i>some</i> aspects of development
    working without LLM input."
