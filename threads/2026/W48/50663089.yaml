    Nice find. I like it. I&#x27;m doing something similar for myself right now, actually. A compiled formal DSL for reasoning and so on (I call it &quot;Cognitive Calculus&quot; and I even have a compiler...)<p>They still use a language model to propose ideas though, and I have a particularly strong opinion on language models (or, as I like calling them since 2 days ago -- &quot;well-formatted shit predictors&quot;): <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50659297">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50659297</a><p>Also, they are a business, so they&#x27;ll probably want to sell you this stuff. I want to give it away for free (just give me a month).<p>They also have this footnote at the end:
    ```
    Of course, the question of what constitutes a “mistake” is highly context-sensitive. It is perhaps more accurate to say that it is mathematically impossible for Lanyon ever to commit a misformalization. Every implementation will always match the specification, and every proof will always match the implementation, 100% of the time. In this sense, Lanyon guarantees perfect syntactic correctness. The issue of semantic correctness (i.e. how to guarantee that the formal specification actually matches the user’s natural language intent) remains an open area of research for us, spanning psychology, linguistics, philosophy, and agent harness development. We hope to have more to say about this soon.
    ```<p>for that, see Elenxis. Although Elenxis is still using a LLM as a module, and LLM can be misaligned, so it&#x27;s not a complete solution. I do have some mathematical theory though for doing this well, and want to develop it further
