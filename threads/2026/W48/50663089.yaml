  author: FullGarden_S
  text: We do not need a full-on theorem prover for achieving this.<p>Something like
    ZFC axioms is good enough. External formal verification tools are not ideal either.
    Its better if the type system of the host language&#x27;s got these essentials
    included, like having a model checker for its abstract machine or something. However,
    model checker for enforcing correctness(especially of the intent) will be much
    harder to implement in languages without a well defined, stable ABI and type system,
    which typically is the case with almost all mainstream languages. Even though
    operational semantics is the semantics of the hardware, most languages do not
    strictly adhere to it due to a lot of practical reasons.<p>Mainstream languages
    that become practical enough to be used by masses will usually be in a spot where
    it becomes very hard to formally define the language and when that happens, enforcing
    &quot;correctness&quot; becomes close to impossible. Stuff like this needs to
    be addressed since the start.<p>Selling to the entire industry the idea that &quot;memory
    safety&quot; is the only thing essential security requirement, while all else
    is a low priority, simply means that anyone who bought that ad either had surplus
    resources or was operating with inadequate requirements to justify doing so. Computer
    programming is about deductive reasoning of the programs and that means its much
    more than just writing code and handling resources properly.
