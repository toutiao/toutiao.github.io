  author: latentsea
  text: Personally, I think the slop is very dangerous to a codebase both when humans
    produce (and they do!!!) and when AI produces it because the uncontrolled growth
    of entropy in a codebase has this funny way of just completely trashing your ability
    to get anything done in it. Like, now there&#x27;s two ways to do the same thing,
    so.. which one do you pick? Pick at random, now there&#x27;s 30% this way and
    70% that way, so probably the 70% one will get picked, but there&#x27;s this non-zero
    chance that now a third way is invented! When you think about next-token prediction,
    it&#x27;s so heavily conditioned on the context, that crappy context equals crappy
    results, and uncontrolled growth of entropy results in crappy context.<p>TL;DR
    it impacts the trajectory of the LLM negatively in a massive way IMHO.
