  author: onion2k
  text: The flaw in people&#x27;s thinking is &quot;Formal verification means bug-free,
    and bug-free means it works correctly.&quot; ignoring the fact that most things
    that people call bugs are actually the code working correctly <i>as it was written</i>
    but it was written to do something that&#x27;s either not what the requirement
    says or that the requirement doesn&#x27;t actually say what the application should
    really do.<p>Requirements, code, verification, etc are a process to turn a human
    mental model of something into an process a computer can do. You can verify the
    computer&#x27;s side of that all day long but if the human side is wrong no amount
    of verification is going to make your software do what you wanted it to do.
