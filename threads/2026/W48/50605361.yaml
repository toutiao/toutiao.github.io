  author: yturijea
  text: Writing code is&#x2F;was fun, but I have always been at it designing the system
    as an architect anyway, so AI vs no AI is really much of the same.<p>Now I can
    just create services much quicker and get much more concrete feedback working
    with an agent.<p>However one of the bigger problems is to setup environments with
    the agent, without sharing any secrets with the agent, so in that space, you still
    need to do the grunt work yourself obviously. Anyone sharing their secrets with
    an agent is inherently waiting to be exploited. So you should always run your
    agent in a containerized env, only giving it read and write to what it needs,
    nothing more.<p>For our organisation I have done exactly that, so everyone can
    work with agents in what we see as the best balance between safety with infrastructure
    and still not losing too much productivity, which also forces a certain amount
    of human oversight to development.
