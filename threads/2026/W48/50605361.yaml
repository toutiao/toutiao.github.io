  author: visarga
  text: I want to add one more fundamental problem - testing generated code. My observation
    is that testing is hard because it requires imagining execution, which is theoretically
    impossible (halting problem). Instead of doing that we could build multiple replicas
    and fuzz or use prod data to detect execution divergence. So we replace imagined
    code execution with just execution, which is a much better position to be in.<p>Generating
    replicas can be done in parallel and might not take more time. But in order for
    differential execution to detect bugs we need to control all inputs. That is a
    big problem to solve over UIs, APIs, stochastic LLMs, stateful systems and humans
    in the loop. It is not trivial to replay the same task in conditions where a divergence
    in outcomes shows a bug. We need to wrap the agent completely on all sides, control
    every input. That is close to the security sandbox problem but different.
