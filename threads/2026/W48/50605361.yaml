  author: '0xbadcafebee'
  text: "&gt; They can go idle for arbitrary amounts of time between bits of work,
    and they spend a lot of time waiting on tools, model inference, other agents,
    or human input. Some workloads need fast startup times, others need to avoid wasting
    compute, and others need crazy scale.<p>So it&#x27;s a CI&#x2F;CD workload. Sits
    around until action is needed, can spin for hours, requires fast start times and
    massively parallel work, takes occasional human input, is triggered by external
    signals. They aren&#x27;t stateful though; AI agents literally are stateless HTTP
    request&#x2F;response clients with state stored in files between turns (which
    could easily be in a DB instead). They&#x27;re so stateless you can literally
    fork their progress at any point.<p>&gt; Agent authorization as a problem space
    is much more wide open - what do you allow an agent to do?<p>Allow agents to do
    anything they want, in a sandbox. Read-only access to the world, but write access
    is sandbox-only. They pull in any information they need, but can only scaffold
    a solution in a protected space. Once it looks like the task is accomplished (after
    many automatic checks), they&#x27;d ping a human to review the sandbox. The human
    either instructs the agents to continue refining work, or commits the work back
    into the real world.<p>&gt; how does the human meaningfully approve what their
    agent can do?<p>If the human can&#x27;t understand what the agent is doing, it
    can&#x27;t approve it. If the human can&#x27;t <i>see</i> what the agent is doing,
    it can&#x27;t approve it.  Don&#x27;t let the agent change things in the real
    world without review and approval. Period. There&#x27;s no other &quot;safe&quot;
    way around it. You cannot trust an LLM. It&#x27;s a psychopath that hallucinates
    &amp; lies for treats.<p>The question isn&#x27;t how can humans meaningfully approve
    - it&#x27;s how can humans meaningfully <i>review before approving</i>? Every
    AI agent needs the ability to interrupt a human (across platforms) to ask questions,
    provide work to review, ask for authorization, etc. And the human needs tools
    to provide a deep analysis, enable quickly refining staged work, fully comprehend
    the impact of actions, and be able to easily roll back changes.<p>We also already
    add heuristics to agents, to say &quot;you can do this thing without approval,
    but that thing needs approval&quot;. We also have auto-classifiers, decision models,
    etc. Organic solutions for problems will emerge that match humans&#x27; messy
    way of working IRL. Not one solution, but a thousand solutions.<p>If you have
    something that <i>isn&#x27;t</i> an LLM-decided action, like a deterministic,
    automatic rule based on non-LLM-originated data, none of the above applies. Tagging
    data as &#x27;tainted by LLM&#x27; or not will be a big factor in determining
    if actions can be trusted.<p>&gt; Really the hard part is how to know when the
    system is going in the wrong direction.<p>Well it always is. Every system is always
    in a state of decay. It&#x27;s definitely good to have monitoring, but if all
    you have is monitoring, you have a broken system with 100 alarms blaring. You
    need to focus more on systems management techniques, to try to prevent failures,
    and assist in repairing the system. This is a black art that hasn&#x27;t been
    documented well in our industry. We (like, actually me, and people like me) need
    to write more books about it, because general engineers need to apply systems
    management theory (failure prevention, failure resistance, re-establishing last
    known good working state) &amp; practice (quality gates, immutable infrastructure,
    checkpoints, failsafes, rollbacks) to these new AI-instrumented systems."
  score: 0
