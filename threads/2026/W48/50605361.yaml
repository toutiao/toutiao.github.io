  text: 'The part that rings true for me is how the work shifts from writing code
    to deciding what is worth building and then proving it works. An agent can rewrite
    a pipeline in a prompt, but that does not tell me whether the rewrite was needed,
    whether it preserves the edge cases I learned about the hard way, or whether anyone
    will notice the difference. That is why testing generated code feels like the
    real new problem, not a side task: without a good test suite and a clear spec,
    I am just reviewing output faster instead of understanding the system better.
    For a solo builder that trade-off is sharp, because there is no second engineer
    to catch what I miss while I am context-switching between prompts. I am less interested
    in agents that solve more problems for me than in workflows that make the verification
    step cheaper and more reliable.'
