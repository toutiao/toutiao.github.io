  author: lordnacho
  text: I&#x27;ve felt that way in the past, but not with AI. Roughly speaking, software
    is making some decisions, executing on them, and looking at what new decisions
    come up.<p>The &quot;executing on them&quot; part was often frustrating. Having
    to spend your attention on little things was exciting in the beginning, but after
    a couple of decades, you aren&#x27;t learning that much more, you are just spending
    your waking hours debugging something that isn&#x27;t really all that complicated,
    it just has a small logic error in it somewhere.<p>With AI you are doing only
    the essential part of engineering, which is to exercise judgement. I can both
    do that for longer each day, and at a level of concentration that previously required
    me to carefully schedule my time. What I mean is, it&#x27;s my experience that
    technically deep things needed to be done at specific hours when I was most awake,
    whereas the decisions that really mattered actually can be done at almost any
    hour of the day.<p>This might sound surprising, but the important decisions are
    normally the ones that are supported by all your experience and all the evidence
    from the project. The technical deep dives tend to be specific, &quot;this is
    broken because of this specific choice in this project, we just need to fix it&quot;
    kinda things.
