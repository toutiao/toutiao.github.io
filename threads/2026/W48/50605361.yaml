  author: liam_grossmann
  text: 'On authorization: in the systems I&#x27;ve worked on (banking, mostly), the
    answer that held up was to never let the caller decide what it&#x27;s allowed
    to do. The agent&#x27;s login can execute a few fixed stored procedures and nothing
    else. Every table is denied, masking and row-level security apply per caller,
    and every call is written to an append-only ledger table that no one can edit,
    sa included. It&#x27;s old, boring database security, but it means a prompt-injected
    agent can only get what those procedures return. The on-behalf-of consent problem
    is harder. I don&#x27;t think anyone has a good answer yet for &quot;approve weeks
    of autonomous work&quot;.'
