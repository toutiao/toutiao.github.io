    it was actually a pivotal invention in the history of horology (watch making).<p>I
    also wanted something that would focus on the basics for an audience who had never
    seen this stuff before.  The Bartosz page is great, but it goes into a lot of
    detail on all sort of stuff that can be kind of overwhelming on a first reading.
