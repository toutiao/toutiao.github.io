  text: 'Hello author!<p>I enjoyed this web page, I&#x27;ve known that watches have
    a mainspring and gears for a long time but it&#x27;s never been clear to me how
    they maintained their rhythm, surely when the mainspring is fully wound it holds
    more energy so the clock should spin faster!<p>I&#x27;ve read some of your responses
    in this thread and found it interesting how confusion about that mechanism was
    your inspiration! You also mentioned that you were a teaching assistant, that
    your writing style was short and sweet, that you wanted to introduce the basics
    to a new audience and that you used Claude to help write the article before feeling
    forced to rewrite it.<p>Unfortunately I found it a little difficult to read, focusing
    more on the graphics&#x2F;animations. It&#x27;s difficult to criticize because
    while you may have rewritten parts you felt were unclear it&#x27;s hard to be
    sure what parts of the writing&#x2F;structure are holdovers from the first draft.
    Claude likes to repeat itself and jumps to use analogies, when the article went
    from a ice skater to a child swinging on a swing to describe the balance wheel&#x27;s
    motion it seemed to be unfocused. People normally stick to one analogy as to not
    confuse or overwhelm the reader, it&#x27;s mostly small nitpicks like that which
    made me want to skim as opposed to read the article.<p>I did learn how a hairspring
    works though! But I did learn it only after reading the comments in this thread
    and referencing the ciechanow.ski article for holes in my understanding.<p>The
    critical piece of information that was missing for me was how the hairspring maintained
    it&#x27;s momentum over long periods of time. Your article uses the example of
    a diving board swaying back and forth, but over time a diving board will return
    to it&#x27;s resting position.<p>You even ask the user to manually coil the spring
    to observe it&#x27;s motion, implying to the reader that the spring is manually
    wound. This is the hairspring though, not the mainspring, most watch designs I&#x27;m
    aware of don&#x27;t have two separate winding wheels. You did mention the balance
    wheel provides balance and inertia, but this was done while talking about the
    periodicity of the motion, without implying that this helps feed energy into the
    system.<p>Bartosz Ciechanowski&#x27;s article also almost doesn&#x27;t mention
    it, however after the mechanism was explained and when going into detail about
    the hairspring assembly it&#x27;s stated <i>&quot;When the watch is shaken, the
    motion of the shaft is absorbed by the spring, similarly to the suspension system
    in a car.&quot;</i>, which explains to me why the hairspring isn&#x27;t a perpetual
    motion machine.<p>Why the hairspring can be wound with motion while the mainspring
    has to be manually wound still requires me to understand it&#x27;s a lot easier
    to stop several gears from turning than it is to provide enough energy to turn
    them, but that could reasonably be left as an exercise to the reader.<p>Ciechanowski
    did highlight something similar: <i>&quot;The barrel itself turns quite forcefully,
    but at the escape wheel, the torque is greatly reduced, which prevents the escape
    wheel from pushing the pallet fork and thus the balance wheel with too much vigor.&quot;</i>,
    but this focuses more on why they don&#x27;t interfere with each other rather
    than why one requires manual intervention. (Although that was also on my mind)<p>Either
    way I&#x27;m glad you prompted me to learn more about this topic I care about,
    and that you linked: <a href="https:&#x2F;&#x2F;ciechanow.ski&#x2F;mechanical-watch&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;ciechanow.ski&#x2F;mechanical-watch&#x2F;</a>
    as a reference early on in the article for people who wanted to learn more.<p>If
    I was to give you advice I&#x27;d suggest just leaving Claude out the writing
    room, short and to the point is a simpler writing style and is something most
    people enjoy reading. Without planning your writing and putting yourself in the
    shoes of your target audience, it can back fire on you. Ciechanowski was a far
    denser read but I enjoyed the parts I read more, the writing felt intentional,
    feeling more like they were talking to me rather than explaining several things
    in isolation, with little touches throughout the text like coloring the parts
    they&#x27;re talking about to lower the cognitive load of the text on the reader.<p>(Rereading
    this ironically the first two sentences of my last paragraph coincidentally read
    very much like they were written by AI, the more of it we read the more it become
    normalized I suppose.)'
