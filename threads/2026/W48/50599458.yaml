  author: martincmartin
  text: |-
    Author here.  I agree, I love Bartosz&#x27;s page and it is much more detailed, in fact I found it kind of overwhelming and getting lost in the weeds when I first read it, so created this partly as an introduction or primer for it.  Think of this as 101, and Bartosz as a full reference.<p>Full disclosure, I did use AI to help create this, but it&#x27;s about as far from slop as possible.  I created the outline for the talk and the topic of each slide before engaging AI, and would fix some code by hand, although I&#x27;m a systems programmer and not front end, so it mostly handled that.<p>Fun story: the second script it made, to generate the watch model (at the time it was an SVG, I later decided to convert it to WebGL), it kept the data in a dict, e.g.<p><pre><code>  TEETH = {&quot;center&quot;: 46,
               &quot;third&quot;: 38,
               ...
               }
    </code></pre>
    And another dict for radius, another dict for center location, etc.  I was blown away, I hadn&#x27;t seen code that bad since I programed in BASIC in the &#x27;80s.  You don&#x27;t even need Object Oriented programming, you just need structs, I started gathering everything together in one struct when I first learned C in the 1990s.<p>I asked it why it did that, and it said &quot;Oh I followed the style of your other script&quot; which was a throw away script for an experiment.  I have no idea where it learned this style, maybe lots of throw away code in its training data, or code written more by scientists&#x2F;mathematicians rather than software engineers?  I&#x27;m genuinely at a loss.  So I created my first coding agent skill, a Python code quality skill, that starts with &quot;if you&#x27;re using dict literals with string literal keys, consider a dataclass or class instead.&quot;<p>It did write the first draft of the text from my notes, but none of it was in my voice, and it emphasized all the wrong things so I rewrote it all.  I&#x27;m sure an AI phrase or two slipped through, but it&#x27;s about as far from slop as AI assisted code&#x2F;writing could be.
