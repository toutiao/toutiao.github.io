  author: jstanley
  text: 'Nice work, but it looks to me as if the escape wheel is unable to provide
    any impulse to the pallet so I think this watch will not work with the pallets
    shaped as shown.<p>After unlocking, the tooth of the escape wheel needs to press
    against the pallet, which will press against the impulse jewel, to add some energy
    to the balance, otherwise the balance will come to a stop.<p>It would be good
    to be able to slow down the animations to check this.<p>The escapement really
    has two jobs. One is to limit the rate at which the mainspring can unwind, and
    the other is to supply energy to the balance so that the balance keeps swinging.<p>(Source:
    I have spent a lot of time designing clock and watch mechanisms, I wanted to make
    my own wristwatch but eventually gave up, some notes in <a href="https:&#x2F;&#x2F;incoherency.co.uk&#x2F;blog&#x2F;stories&#x2F;the-watch-project.html"
