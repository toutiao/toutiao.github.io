article:
  url: https://martincmartin.github.io/slidev-stem/watches/article/1/
  title: How a Mechanical Watch Keeps Time (Interactive 3D)
  fetch_status: success
  content: "Mechanical watches have kept time for 500 years. Many of their core parts
    were invented even earlier for giant cathedral tower clocks before being shrunk
    into portable timepieces. This page explains how a modern one works. I personally
    think it’s fascinating that a well-calibrated, purely mechanical device can keep
    time with 99.99% accuracy for $100. They also changed the world and look good
    on your wrist.\n\nThis web page was partially inspired by Bartosz Ciechanowski’s
    [Mechanical Watch](https://ciechanow.ski/mechanical-watch/) page. You can think
    of this page as a simpler introduction or background. When you’re finished with
    this, that page gives more depth.\n\nYou can drag any of the 3D figures to turn
    them and see the parts from the side; on a phone, drag sideways.\n\n![The whole
    watch, running: its wheels, its balance wheel and its\nhands, inside the case.](figures/what-everyone-should-know-about-mechanical-watches-0.png)\n\n##
    Hairspring\n\nc. 1675\n\n![A hairspring, seen at an angle: a flat spiral of steel
    ribbon. Its\nouter end is held in a small block, and its inner end is on a hub
    at the\ncenter. The spiral winds and unwinds.](figures/hairspring-0.png)\n\nStart
    with the part that keeps time. In 1675 Christiaan Huygens, a Dutch scientist,
    invented the _hairspring_. It is a flat spiral of steel ribbon, finer than a hair.
    Its outer end is held still, and its inner end is free to turn. Twist the inner
    end and let go, and the spiral winds and unwinds, back and forth, at a steady
    rate. In this drawing it swings once every two seconds, and the rest of the watch
    follows that beat.\n\n![A diving board over a pool. It bends, is let go, and swings
    up and\ndown past its straight shape, which a dashed line shows. The label reads:\n\"Bend
    it away from straight, it pushes back\".](figures/hairspring-1.png)\n\nWhy does
    a spring swing? Think of a diving board. Bend it down, and it pushes back: an
    _elastic restoring force_. Let go, and it does not stop at straight. It overshoots,
    bends the other way, and comes back again: it_oscillates_. With no friction, it
    would oscillate forever.\n\nA hairspring is a diving board rolled up. The board’s
    rest shape is a straight line; the hairspring’s is a spiral. Take hold of the
    slider under the next picture, and drag it to the right.\n\n![The diving board
    curls up into the hairspring, at rest.](figures/hairspring-2.png)\n\n“Bend” becomes
    “wind”, and “straight” becomes “rest”. Now give the hairspring a twist: drag the
    slider to wind the spiral away from its rest shape, and let go.\n\n![The hairspring
    at rest. Wound away from rest and let go, it swings\nback and forth.](figures/hairspring-3.png)\n\nIt
    pushes back. It overshoots and swings, just as the board did. This one move is
    the whole idea of the hairspring.\n\n## Balance Wheel\n\nc. 1364\n\nThe hairspring
    is only half of the timekeeper. The other half is the _balance wheel_. While most
    of its mass is around the outside, it is actually fixed to the spring’s inner
    end. The spring provides the _restoring force_. The wheel provides the _mass_
    and _inertia_.\n\n![The balance wheel on the hairspring, swinging. The wheel is\nmarked.](figures/balance-wheel-3.png)\n\nA
    hairspring alone would oscillate far too fast to count. The wheel slows it to
    a pace that the gears can count.\n\nMass also makes the swing steady. Push an
    empty playground swing, and it jerks about. Put a child on it and it swings much
    more gracefully. A heavy wheel carries its own momentum, so a knock to your wrist,
    or turning it upside down, barely changes its rhythm.\n\nHow good is it? A well-calibrated
    mechanical watch, even an everyday Seiko or Citizen, is about 99.99% accurate.
    A day has 86,400 seconds, so that watch gains or loses about nine seconds a day.\n\nI’m
    not particularly handy with mechanical things. If I tried to build a table it
    would wobble because things would be off by a few percent. So it kind of blows
    my mind that, for $100, I can get a simple, everyday, purely mechanical system
    and tweak it to be 99.99% accurate!\n\n## Escapement\n\nc. 1275\n\nA second hand
    that just moves back and forth isn’t very useful. We need it to turn one way only.
    The _escapement_ turns the swing into steps.\n\nThe _escape wheel_ is being turned
    by a mechanism we’ll explain soon, so it’s hidden on this diagram. Without something
    to stop it, it would just turn and turn.\n\n![The escape wheel alone, spinning
    freely. A curved arrow shows the\npush on it.](figures/escapement-1.png)\n\nThe
    _pallet fork_ stops it.\n\n![The balance wheel on the left, the pallet fork in
    the middle, and\nthe escape wheel on the right. A stone at the end of the fork
    holds a tooth\nof the wheel. Labels: \"Wheel driven by hidden mechanism\" and
    \"Pallet blocks\nwheel\".](figures/escapement-2.png)\n\nIts two prongs (called
    _stones_) stick in the wheel’s teeth: a tooth lands on a stone, and the wheel
    stops. Each time the fork rocks, one stone lets a tooth go, and the other stone
    catches the next tooth. The tooth _escapes_, and that is where the name comes
    from.\n\nWhat rocks the fork? The balance does. On its staff is a small _impulse
    jewel_, which sits in the notch at the end of the fork. It’s actually a synthetic
    ruby or sapphire, so it really is a jewel, a precious stone.\n\n![The escapement
    at rest, labeled: the escape wheel, the pallet\nfork, and the impulse jewel in
    the fork's notch.](figures/escapement-3.png)\n\nAs the balance swings through
    the middle, the jewel strikes the fork and flips it one way. On the swing back,
    it flips it the other way.\n\n![The escapement at work. The balance swings, its
    jewel strikes the\nfork, the fork rocks, and the escape wheel moves on one tooth.
    \"Tick\" and\n\"tock\" show each time a tooth lands on a stone. Labels: \"Jewel
    strikes\npallet\", \"Wheel driven by hidden mechanism\" and \"Pallet blocks wheel\".](figures/escapement-4.png)\n\nSo,
    at each swing, the balance lets the wheel take one small step. The step ends when
    the next tooth lands on a stone, hard enough to make a sound. This is the tick
    and the tock of a watch.\n\n## Ticks and Turns\n\nBefore we go on, something that
    trips people up until they think it through. How long does the second hand take
    to go once around the dial?\n\n![The second hand alone, pinned on its arbor, ticking
    once a\nsecond.](figures/ticks-and-turns-3.png)\n\nEach tick is one second, and
    sixty ticks brings it all the way around. So the second hand makes a complete
    circle once a minute. A hand is named for what it counts, not for how long it
    takes to make a full 360° turn.\n\n| Hand | A full turn |\n| --- | --- |\n| Second
    hand | Once a minute |\n| Minute hand | Once an hour |\n| Hour hand | Twice a
    day |\n\n## Gears\n\nSecond hand: c. 1670\n\nThe escapement gets the escape wheel
    turning at a precise rate. But the second hand must turn once a minute, and the
    escape wheel turns faster than that. To convert a faster rotation into a slower
    one, a watch uses gears: a small gear that meshes with a big one.\n\n![Two gears,
    turning: a small gear with eight teeth drives a big\ngear with sixteen. Four teeth
    on each gear are colored.](figures/gears-4.png)\n\nThe teeth on the two gears
    must have the same spacing, so they mesh neatly. Each tooth fits in a gap of the
    other gear, so the teeth go past each other one for one, and both rims move at
    the same speed. Four teeth on each gear are colored. Those four teeth are half
    of the small gear, but only a quarter of the big one. So the small gear turns
