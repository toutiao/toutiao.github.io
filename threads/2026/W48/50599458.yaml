  text: Author here, thank you for you very detailed comment, it&#x27;s very helpful
    to me to understand how it lands, what worked and what can be improved.<p><i>it&#x27;s
    hard to be sure what parts of the writing&#x2F;structure are holdovers from the
    first draft.</i><p>To be clear, I read over the whole thing many times, and if
    I decided to keep something that Claude wrote, its because I thought it was appropriate.  So,
    all blame should go squarely to me.<p>It&#x27;s a good point that switching analogies
    is confusing, each one takes effort to wrap your head around, so finding one and
    sticking to it is better than introducing a new one for each point.<p>Leaving
    out the &quot;how a hairspring keeps swinging&quot;, and friction in general,
    was a conscious choice to focus on the basics.  More details in this comment [1].<p>Shaking
    the watch is actually not what restores energy to the hairspring.  If you look
    at Bartosz&#x27;s Balance section [2], the fifth illustration, he mentions &quot;escape
    wheel unlocks and pushes the jewel of the pallet fork,&quot; that transfers energy
    from the gear train (going train, ultimately from the mainspring) to the pallet
    fork.  Then slide it a little more, &quot;pallet fork pushes the jewel roller
    and the balance wheel,&quot; that transfers the momentum of the pallet for to
    the balance wheel, keeping it rotating.  It&#x27;s complicated and hard to understand,
    because first the roller jewel knocks the pallet fork, so the jewel is in contact
    with it and pushing it.  Then very quickly, the escape wheel pushes the pallet,
    accelerating it so the other side of the fork now knocks the roller jewel.  It&#x27;s
    complicated, happens in a tiny fraction of a second, and is not very intuitive.  It
    also took several centuries for watch makers to settle on this design, but it&#x27;s
    very energy efficient, minimizing energy lost to friction.<p>With the feedback
    from this entire comment section, I agree with not having Claude write anything
    at all.  I&#x27;ve learned that I&#x27;m not as good at getting rid of Claudisms
    as I thought, and whether or not they&#x27;re helpful in explaining things, they&#x27;re
    distracting to people who notice them.<p>Thanks again for your thoughtful and
    detailed comment.  Comments like this are why I engage in writing at all, and
    they help me become a better author.<p>[1] <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50628237">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50628237</a><p>[2]
