  author: martincmartin
  text: Author here.  Very true.  This is for people going from no watch knowledge
    to their first understanding of how watches work, and when choosing between accuracy
    and clarity, I usually picked clarity.  For example, most watches beat faster
    than once a second, but a hairspring moving that fast is hard to see.  Also, most
    watch gears have more teeth, but fewer teeth is easier to grok.<p>I thought of
    talking about how the pallet stones slide along and are actually pushed by the
    escape wheel&#x27;s teeth, and therefore accelerate and knock the impulse jewel.  But
    that would have involved slow motion and zooming in, and felt like an extra level
    of depth beyond the basics, like a &quot;watch mechanisms 201&quot; where this
    was 101.<p>Also, while showing an early version of this to a friend, and pointing
    out the impulse to the jewel, they said &quot;wait why do you need that, the hairspring
    oscillates on its own?&quot;  I pointed out that with friction it would stop before
    long.  Bringing friction into all parts opens up a can of worms where you want
    to talk about lubrication and jewels where the arbors contact the main plate,
    and that was <i>definitely</i> beyond what I was aiming at here.
