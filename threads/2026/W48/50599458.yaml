  author: martincmartin
  text: Short sentences and plain language are my style, I&#x27;m kind of allergic
    to business speak, using long, impressive sounding words when short, common ones
    will do, or inserting extra words to sound more official.  Like the George Carlin
    sketch about airline announcements.  [1]<p>When I was a teaching assistant, I
    remember a student saying &quot;Our professor must be really smart, I don&#x27;t
    understand anything he says, but I understand you!&quot;<p>I find AI generated
    text to be verbose.  It&#x27;s interesting that, when people see a style that&#x27;s
    consistently different than that, they assume it&#x27;s an AI which has been prompted
    to not sound like an AI.<p>The semicolon is probably a left over Claude-ism I
    should have gotten rid of, but &quot;The board&#x27;s rest shape is a straight
    line, while the hairspring&#x27;s is a spiral&quot; sounds like something I&#x27;d
