  text: Author here, thanks for the kind words!  I agree, that&#x27;s why I created
    it.<p>There&#x27;s a local group of friends that gets together every few months,
    and I wanted to explain my fascination with watches to them.  I got a 3D printed
    plastic model, but it was hard to explain why e.g. the hairspring moves back and
    forth (we don&#x27;t think of curved objects doing that, we&#x27;re more likely
    to think of straight objects being back towards straight) and that the mainspring
    was pushing things (I would bend the escapement out of the plane so the mainspring
    could run to show them).  I thought of projecting Bartosz&#x27;s page, but I&#x27;d
    have to hunt around in it for the specific things I wanted to show, so I decided
    to make a &quot;quick&quot; presentation, and then it just got more and more elaborate
    lol.
