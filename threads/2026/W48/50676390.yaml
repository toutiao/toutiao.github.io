  author: edg5000
  text: Generally, asking it to review will almost always find real issues without
    overblown severity. The key is that once the model ends the turn after delivering
    on a task, it won&#x27;t do this audit by itself, but how you prompt it won&#x27;t
    matter much, as long as you let it evaluate the work as an explicit task. I call
    these &quot;audits&quot; and do this constantly. This can be either a new session
    or the existing one, does not matter that much for the results, although I generally
    use clean sessions for this. One risk is them reading each others&#x27; scratch
    dirs, which can make the audit no longer fully independent.
