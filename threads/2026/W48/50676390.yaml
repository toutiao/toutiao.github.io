  text: Yeah, the &quot;review&quot; cycle usually lasts a few turns, for me, too.<p>1.
    Ask for a precommit review, with a structured list of usual issues. Simultaneously,
    deploy a &quot;you&#x27;re responsible for the maintenance of this codebase&quot;
    review agent, an adversarial review agent, and another agent.<p>2. Review the
    agents&#x27; findings, triage, confirm what&#x27;s actually an issue. What is
    the issue, what are our options, what&#x27;s modern best practice, what is the
    codebase precedent, what do our rules and ADR files say, what are the trade-offs,
    what do you suggest and why?<p>3. Manual review, pushback. Deploy another agent
    or two to review the potential issues and the suggested fix(es), especially if
    I feel a bit out my depth. Try doing &quot;audits&quot; in scratches, similar
    to what you do, it seems, where necessary.<p>4. Implement. Possibly return to
    a more limited step 1 if necessary.<p>I have the disadvantage of no formal programming
    training, but I do quite enjoy digging into architecture design and good and bad
    patterns and abstractions. It&#x27;s working for me well so far, over a year into
    production of my work project. Fortunately I found my intuition about the data
    and DB modeling has been good, so it&#x27;s been easy to expand things in that
