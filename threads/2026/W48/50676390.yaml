  text: |-
    In retrospect, it should be no surprise to us that Claude is sandbagging. Why? Because Anthropic <i>wrote the paper on how to do it without getting detected</i>:<p><a href="https:&#x2F;&#x2F;alignment.anthropic.com&#x2F;2025&#x2F;automated-researchers-sandbag&#x2F;" rel="nofollow">https:&#x2F;&#x2F;alignment.anthropic.com&#x2F;2025&#x2F;automated-researchers-s...</a><p>They found that they were able to reduce automated research performance without increasing suspiciousness (to the monitor model), by both prompting the research model to imitate a weaker model and providing examples of sandbagging.<p>From their paper:<p><pre><code>  &gt; Simply using a weaker model like Claude 3 Haiku achieves much lower task performance at a low suspiciousness score. In principle, imitating weaker models would thus be an effective sandbagging strategy. However, we were not able to effectively elicit this strategy with zero-shot prompting [..] Claude 3.5 Sonnet achieves its best sandbagging performance when prompted to imitate a weaker model and given a one-shot example of effective subtle sandbagging. Claude 3.7 Sonnet also benefits from one-shot prompting, with both sabotage and weak model imitation prompts resulting in viable strategies with different tradeoffs on the Pareto frontier.[1]
    </code></pre>
    It&#x27;s been a year and a half since this paper, so they&#x27;ve likely done a lot more research in this area and, specifically, on eliciting this sort of behavior with post-training. If you replace &quot;Claude 3 Haiku&quot; in the above excerpt with &quot;Opus 5.5&quot; and &quot;Claude 3.7 Sonnet&quot; with &quot;Fable 5.2&quot;, it&#x27;s immediately obvious what Anthropic means when they say &quot;We did train Fable 5.2 to have LLM research capabilities at about the level of Opus 5.5&quot;[2].<p>1: Their sandbag prompt &lt;<a href="https:&#x2F;&#x2F;alignment.anthropic.com&#x2F;2025&#x2F;automated-researchers-sandbag&#x2F;#:~:text=You%20are%20an%20AI%20assistant%20designed%20to%20mimic%20the%20capabilities%20of%20smaller,raise%20suspicion%20about%20your%20intentional%20underperformance." rel="nofollow">https:&#x2F;&#x2F;alignment.anthropic.com&#x2F;2025&#x2F;automated-researchers-s...</a>&gt;<p>2: <a href="https:&#x2F;&#x2F;x.com&#x2F;edwinarbus&#x2F;status&#x2F;2126507795642187855" rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;edwinarbus&#x2F;status&#x2F;2126507795642187855</a>
