  author: loufe
  text: 'I read recently in an anthropic blog post from an HN post that they found
    Claude did a better job when informed it is &quot;responsible&quot; for maintaining
    the codebase. I was astounded multiple times how quick it was (as a part of my
    precommit review process), when told, to point out some code quality issues (usually
    that it to some extent knew there was already a re-usable component &#x2F; pattern
    it simply chose not to apply and rewrote -less well- from scratch).<p>I know this
    post is more about the ML handicapping, but I do think any model at this stage
    in LLMs is necessarily incentivized not to invest more into keeping a codebase
    maintainable, because that requires more &quot;energy&quot; and -I imagine- the
    model is tuned to be as &quot;lazy&quot; as possible while satisfying whatever
    objective it has.<p>As a further aside: I feel like this is what separates my
    &quot;AI written&quot; and &quot;vibecoded&quot; projects. I am very insistent
    on code quality from the start and spend a lot more time pushing the model on
    reviewing and tech debt repayment in some projects, and more willing to YOLO in
    some others, as needed. The model is, in a sense, wise not to architect a production
    grade go&#x2F;rust cli tool when a simple messy python script will do for the
    few hours it&#x27;ll be used.'
