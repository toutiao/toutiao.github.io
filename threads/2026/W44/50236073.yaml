  author: msteffen
  text: Ok, I did more reading and it sounds like my old framing was just sort of
    incomplete? Basically, people and firms are little black holes of unmet demand
    for all sorts of things.<p>When the productivity shock happens, some of the latent
    unmet demand in the now-high-productivity sector(s) is for stuff in other high-productivity
    sectors (iPhones, memory), and is eventually met. Other latent demand is for stuff
    in low-productivity sectors (housing, childcare, education, healthcare, construction)
    and that drives up prices until&#x2F;as people eventually move into those sectors.
    Even if housing specifically isn’t constrained, it still happens.<p>And I guess…as
    wages go up, some forms of automation become economically viable, which is what
    changes the balance of low&#x2F;high productivity sectors. Latent demand for rope-holding
    is met with cones, latent demand for maids is (mostly) met with washing machines
    and dishwashers, latent demand for secretaries is (mostly) met with personal computers,
    etc.<p>So with AI, it sounds like people <i>will</i> move out of software into
    construction, healthcare, etc (only specialized work where the automation isn’t
    “good enough” stays). All the “teaching kids to code” that schools are doing now,
    eventually turns into people dealing with their own AI output as adults, where
    previously they would’ve hired a developer (like how managers who used to have
    a secretary now get a computer and type for themselves). Wages go up, education,
    healthcare, and housing get more expensive.
