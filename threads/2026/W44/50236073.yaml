  author: bagacrap
  text: So someone correct me but I think this is sort of an accounting trick. When
    Microsoft buys an Nvidia GPU for $100, it will claim that it lasts 5 years, so
    writes down $20 in the expense column for this year. Meanwhile Nvidia takes all
    the profit at time of sale, $100. So for each GPU bought, SP500 logs $80 of profit,
    even though no money entered or left the SP500.<p>(Yes of course the GPU cost
    something to make, but the margins on these things are very high. The point is
    that revenue is immediate while capital expenses are amortized. And capital expenditure
    has gone way up lately.)
