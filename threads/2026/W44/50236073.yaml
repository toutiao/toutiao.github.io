  author: parineum
  text: "&gt; does it really add up to economy as whole<p>Yes.<p>I don&#x27;t want
    to pick on you but this is a major pet peeve of mine. A lot of people view the
    economy as a fixed size of value. As a result, when someone is a millionaire,
    they consider that million dollars to be something extracted from others. That&#x27;s
    a very Feudal view of economics. What&#x27;s usually the case is that millionaire
    add a million dollars of value by creating a more valuable product from raw materials.<p>This
    example is an easy example. Before Nvidia, there was just a pile of silicon and
    copper worth $20. It doesn&#x27;t take $80 to turn that thing into something that
    is worth $100. The value within the economy increased.<p>Most of economic activity
    is growth. There is economic activity that isn&#x27;t growth, which is what rent-seeking
    is."
