  text: I think this is what Baumol’s cost disease is about (productivity growth on
    one sector drives up labor costs and ultimately prices in other sectors, such
    as healthcare, construction). Basically, when software or AI is super lucrative,<p>1.
    students go into new lucrative thing<p>2. supply of doctors goes down<p>3. doctor
    wages go up<p>4. hospital margins go down<p>5. Hospitals raise their prices to
    stay in business<p>6. Wealthy engineers are able to afford higher prices<p>7.
    Services that are transitively consumed by the high-productivity sector stabilize
    at a higher price. Services not transitively consumed by the high-productivity
    sector go out of business.<p>- I remember visiting a developing country about
    15 years ago and seeing people getting paid to stand there and hold a rope, because
    I guess their time was cheaper than cones, which I think is the inverse of this.<p>-
    I also think that, in the limit, society consists of a handful of economically
    viable occupations and infinite cheap stuff. Nothing else is worth the prices
    that a seller would have to charge to afford employees.<p>- I also think that
    we’re entering a stabilization phase.
