  author: Dwedit
  text: Path names are always really complicated, hidden invisible state or not.  Just
    let use the Operating System&#x27;s APIs to expand the full paths for you.<p>Then
    there&#x27;s Path Canonicalization.  This is especially hairy, and only needed
    in certain circumstances where you need to know when two paths are really on the
    same filesystem or not (Mount points and symbolic links can cause &quot;C:\dir\file&quot;
    to be on a different drive than &quot;C:\&quot;).  Not helping this is that path
    canonicalization is broken on Windows in some cases.  When you mount a filesystem,
    you are able to register the volume with the mount manager.  If you do register
    it, path canonicalization will work, but you also get some unwanted side effects
    (creating a &quot;Recycle Bin&quot; and &quot;System Volume Information&quot;
    directory).  If you don&#x27;t register it with mount manager, the files are still
    usable, but Path Canonicalization won&#x27;t find the drive.  You have to enumerate
    every drive letter to find it, and if you mounted it inside a directory, that&#x27;s
    even harder.
