  author: netsharc
  text: 'With drive letters, a neat functionality in DOS&#x2F;Windows command prompts
    (don&#x27;t ask me about Powershell) is that each letter can have its own &quot;current
    directory&quot;.<p>So if you have ffmpeg.exe in C:\Program Files\FFMpeg\bin, and
    you have some source files in D:\SourceVideos, and you want to process them in
    ffmpeg and output them to E:\Output you can do:<p>C: (to navigate to the C: drive)<p>cd
    &quot;C:\Program Files\FFMpeg\bin&quot;<p>E: (to navigate to the E:\ drive)<p>cd
    D:\SourceVideos (you remain in E:\, but the &quot;current directory&quot; for
    D: has been changed).<p>cd Output (to enter E:\Output)<p>You can now do C:ffmpeg.exe
    -i D:scene1.mp4 output-scene1.mp4<p>and Windows accesses the files in the &quot;current&quot;
    directory on each drive letter.'
  score: 0
