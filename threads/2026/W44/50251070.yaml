    by :\n\nNewest\n\n[Newest](javascript:void(0))[Popular](javascript:void(0))[Oldest](javascript:void(0))\n\n-
    \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwAQMAAABtzGvEAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADUlEQVQYlWNgGAXUBAABUAABeLzIBgAAAABJRU5ErkJggg==)\n\nI
    was expecting some weird case of a GUI app trying to alloc its own console window..
    but failing when it already inherited one.\n\nI think I’ve seen that happen, but
    I can’t remember the details off hand.\n\n- \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAoAQMAAAC2MCouAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADElEQVQImWNgGFkAAADwAAFTiaRLAAAAAElFTkSuQmCC)\n\nI
    long for a day when a modern operating system does not have any concept of a “current
    directory”. Global mutable state with security implications. At least UWP fixed
    the “mutable” and “security” parts. Still don’t know why they thought Windows
    Terminal needed to be able to change the classical working directory global instead
    of using their own…\n\n  - \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwAQMAAABtzGvEAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADUlEQVQYlWNgGAXUBAABUAABeLzIBgAAAABJRU5ErkJggg==)\n\nIt’s
    process scope, so it is debatable if you want to call it global or not.\n\n    -
    \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAoAQMAAAC2MCouAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADElEQVQImWNgGFkAAADwAAFTiaRLAAAAAElFTkSuQmCC)\n\nFrom
    the perspective of multiple threads running in the process, the working directory
    could be changed at any time by some other thread, and the Win32 API function
    for retrieving the current working directory warns about this.\n\n- \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyAQMAAACQ++z9AAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAD0lEQVQokWNgGAWjYGgCAAK8AAGBAoNpAAAAAElFTkSuQmCC)\n\nThere
    are many ways to specify the absolute path of an exe before starting it, but doing
    so for a dll linked via a lib is much harder, or even infeasible.  \nWindows lacks
    a way to specify dll load paths in the manifest (for example, searching for a
    dll relative to itself). This means that when exes is in different directories,
    the same dll must also be copied into those directories. This prevents many dlls
    from being shared. Hardlinks are one workaround, but I don't consider it ideal.
    Windows does have such mechanisms, such as mui and side-by-side, but they...\n\n[Read
    more](javascript:void(0))\n\nThere are many ways to specify the absolute path
    of an exe before starting it, but doing so for a dll linked via a lib is much
    harder, or even infeasible.  \nWindows lacks a way to specify dll load paths in
    the manifest (for example, searching for a dll relative to itself). This means
    that when exes is in different directories, the same dll must also be copied into
    those directories. This prevents many dlls from being shared. Hardlinks are one
    workaround, but I don’t consider it ideal. Windows does have such mechanisms,
    such as mui and side-by-side, but they are all used to select different dlls and
    are very limited in scope, rather than being used to share dlls.\n\n[Read less](javascript:void(0))\n\n-
    \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWAQMAAAAGz+OhAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAGklEQVRIie3BMQEAAADCoPVPbQ0PoAAAgHcDC7gAAaFsh3EAAAAASUVORK5CYII=)\n\nThis
    is why my programs, when they start, ask the system for the path to the file that’s
    been run, and then uses that to reference other files it expects in the same directory.
    \ \nGetModuleFileName to path  \nDrop leaf from path  \nload path+”otherfile”
    \ \nload path+”anotherfile”  \nload path+”someotherfile”  \netc.\n\nI thought
    this was obvious, it’s been obvious to me since the early 1980s, it never occured
    to me to do it any other way.\n\n  - \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwAQMAAABtzGvEAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADUlEQVQYlWNgGAXUBAABUAABeLzIBgAAAABJRU5ErkJggg==)\n\nFor
    my MSIX apps in the MS Store, I've just gone like the other posters said and have
    my application aware of its own environment. My startup basically says, \"what's
    my current exe, am I in debug, or not, and let's go find out where our data lives
