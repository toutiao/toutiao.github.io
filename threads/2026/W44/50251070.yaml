article:
  url: https://devblogs.microsoft.com/oldnewthing/20261026-00/?p=112797/
  title: Puzzling out why a program doesn't work when run from a batch file, but works
    when double-clicked from Explorer - The Old New Thing
  fetch_status: success
  content: "![](https://devblogs.microsoft.com/oldnewthing/wp-content/uploads/sites/38/2019/02/RaymondChen_5in-150x150.jpg)\n\n[Raymond
    Chen](https://devblogs.microsoft.com/oldnewthing/author/oldnewthing)\n\nA customer
    asked for help writing a batch file to launch a program. For some reason, the
    program displayed an error message when the batch file ran it, whereas it worked
    fine when they double-clicked the program from Explorer.\n\nI immediately suspected
    that they were not setting the current directory.\n\nSome time ago, I noted that
    when you double-click a file in Explorer, [Explorer sets the current directory
    of the program to the directory containing the thing that you double-clicked](https://devblogs.microsoft.com/oldnewthing/20101110-00/?p=12313
    \"Your debugging code can be a security vulnerability: Loading optional debugging
    DLLs without a full path\"). This is done to accomodate programs that look for
    ancillary files in the current directory. The example I had was a hypothetical
    LitWare Writer program that, when given an file, looks for related files like
    (the table of contents) and (the custom dictionary) in the current directory.\n\nThis
    also happens if you double-click the `.exe` file: The current directory is set
    to the directory that contains the executable.\n\nMy guess is that the customer’s
    program looks for ancillary files relative to its current directory, but the batch
    file ran the program by its full path without changing the current directory to
    match the program’s path.\n\nThe customer confirmed that explicitly changing the
    directory fixed the program. (More specifically, they used `pushd` to change the
    directory and then `popd` to restore the original directory.)\n\n**Bonus chatter**
    : It didn’t come to it, but my second idea would have been to check whether the
    program had [set a custom entry under `App Paths`](https://devblogs.microsoft.com/oldnewthing/20110725-00/?p=10073
    \"How is it possible to run Wordpad by just typing its name even though it isn't
    on the PATH?\") to ask for additional directories to be added to the `PATH` environment
    variable when the program is run.\n\n### Category\n\n- [Old New Thing](https://devblogs.microsoft.com/oldnewthing/category/oldnewthing/)\n\n###
    Topics\n\n- [Other](https://devblogs.microsoft.com/oldnewthing/tag/other/)\n\n###
    Share\n\n- \n- \n- \n\n## Author\n\n ![Raymond Chen](https://devblogs.microsoft.com/oldnewthing/wp-content/uploads/sites/38/2019/02/RaymondChen_5in-150x150.jpg)\n\n[Raymond
    Chen](https://devblogs.microsoft.com/oldnewthing/author/oldnewthing)\n\nRaymond
    has been involved in the evolution of Windows for more than 30 years. In 2003,
    he began a Web site known as The Old New Thing which has grown in popularity far
    beyond his wildest imagination, a development which still gives him the heebie-jeebies.
    The Web site spawned a book, coincidentally also titled The Old New Thing (Addison
    Wesley 2007). He occasionally appears on the Windows Dev Docs Twitter account
    to tell stories which convey no useful information.\n\n## 9 comments \n\nJoin
    the discussion.\n\n### [Leave a comment](javascript:void(0) \"Leave a comment\")[Cancel
