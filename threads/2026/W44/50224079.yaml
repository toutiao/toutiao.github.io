  author: lkey
  text: Native and natural in the sense of &#x27;adapted to its environment&#x27;,
    not &#x27;static&#x27;<p>Transplanting &#x27;English Manor&#x27; grass and lawn
    practices to a <i>desert</i> creates an unbridgeable adaptation gap. This kind
    of lawn <i>cannot</i> survive without draining every aquifer in a 300 mile radius.
    Texas lawns, in particular, yearn for death, you can watch them die in real time.<p>Lawns
    that require almost no maintenance using native plants have <i>always been possible</i>,
    but they don&#x27;t reflect the class and status dynamics that neighborhoods want
    to show off.<p>They&#x27;d rather have dying sickly grass most of the year, and
    pay yearly to to replace, than allow a single &#x27;weed&#x27; to be a part of
    their landscaping.
