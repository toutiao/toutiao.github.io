  text: |-
    <p><pre><code>  &gt; are they essentially holding back sort of unweighted parameters built in to the model architecture which they can then populate with new context during &#x27;sleep&#x27; and then using the techniques outlined in the &#x27;dream&#x27; section to reinforce...
    </code></pre>
    Sort of. As the model is interacted with, short term &quot;memories&quot; are accumulated in a sort of buffer&#x2F;cache. During &quot;sleep&quot; these &quot;memories&quot; are given a ranking&#x2F;score, and the useful bits are integrated into the weights.<p>They say the weight update can be done by computing a transform where the end state is the old weights with the addition of the useful semantic knowledge contained in memories. Rather than just additively chucking the entire memory concepts into weights. That&#x27;s pretty neat.<p>The subtext for the memory architecture diagram sums the whole thing up pretty tidily I think:<p><pre><code>  &gt; Input streams from the active phase are stored in short-term memory before entering the sleep cycle, which bifurcates into Consolidation (transferring fragile short-term tokens into expanded long-term parametric memory using low-rank structures and MoE) and Dreaming (autonomous self-improvement via synthetic routing with random experts and RL refinement).</code></pre>
