  author: deepwoods
  text: 'I wonder how well this would translate with a much larger model.   They ran
    the experiments with comparatively tiny models.  You would presumably need to
    churn a lot more tokens to move the needle of a multi-trillion-parameter model&#x27;s
    weights.  It might just be that it&#x27;s not that hard to improve Llama-3B and
    Llama 3-8B because they&#x27;re not very good to begin with.  They compare it
    to other methods - in-context learning and TTT - but I&#x27;d be curious to see
    it compared to a &quot;control group&quot; of RLHF.<p>As an aside, I get that
    this is a preprint, but it&#x27;s very odd to see a piece of writing with obvious
    typos and grammar issues (e.g. page 13: &quot;We attributes this results to,&quot;
    &quot;In this setting (see Table 4), Sleep achieves a 80% success rate, higher
    then the other methods.&quot;) in an era with LLMs.  It sort of locks in that
    this was written by human beings, and I&#x27;m all for that, but it jumps out
    at me more than it used to.'
