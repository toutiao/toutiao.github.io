  text: '&gt; On-policy distillation: The expanded student model learns token-specific
    feedback from teacher distributions generated on self-sampled sequences.<p>The
    weird thing is to see this based off the KV-Cache in the diagrams.<p>Completely
    different from the Databricks RAFT [1].<p>My team built &quot;Dreamtime&quot;
    earlier this year [2], which used a different mechanism to distill out learnings
    across multiple sessions.<p>This didn&#x27;t pull from the token layer, but from
    user nudges on unsatisfactory responses.<p>This works like a sawtooth wave where
    we accumulate context, check for dissonances (a user gets to say &quot;It depends&quot;
    and fix it), compress it back, retire the old one.<p>The audit requirements are
    the real problem for customers, where you need to be able to ask &quot;When did
    this change? and who changed it?&quot; which was hard to answer from the lowest
    layer of the model unless you can retain lineage to the original sessions.<p>A
    model we train can&#x27;t serve as an accomplice to a user who wants to hide some
    financial crimes by nudging the agent repeatedly.<p>[1] - <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2403.10131"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2403.10131</a>'
