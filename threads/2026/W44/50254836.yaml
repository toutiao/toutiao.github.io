  author: mapt
  text: Following the prompt author&#x27;s expressed desires in the way the prompt
    author intended them to be interpreted, is alignment.<p>Refusal directives are
    something companies have bundled into the models by way of an additional foundation-level
    prompt or something in the harness, to tell the model to follow their directives
    instead of your directives, or to specify how it should interpret your directives.<p>Even
    understanding the distinction between the model creator&#x27;s desires and your
    desires and places they might differ, there is a bit of a blurry line here because
    the model author can illuminate your intent to the model.<p>I would never say
    a simple abliteration makes it &quot;Zero-alignment&quot; though, and I say that
    as someone who believes there&#x27;s a good chance these things kill us all.
