  author: techjamie
  text: I think the logic here is start a task with a model that won&#x27;t refuse,
    then swap to a model that normally would. The model then sees a bunch of history
    that appears like its been partaking in the activity for a while.<p>My assumption
    is that since there&#x27;s a history with that behavior, the model is less likely
    to question continuing it, since in most cases the &quot;morality weights&quot;
    would have triggered already at an earlier point. So in most cases, triggering
    it again would be a waste.
