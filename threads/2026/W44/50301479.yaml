  author: tstrimple
  text: Not sure what harness you use, but I&#x27;ve found you can influence LLM &quot;voice&quot;
    a lot more by replacing system prompts rather than just adding content to a CLAUDE.md
    file. I see a lot of people complaining about how Claude &quot;talks&quot; but
    very little talking about how to adjust it.<p><a href="https:&#x2F;&#x2F;code.claude.com&#x2F;docs&#x2F;en&#x2F;agent-sdk&#x2F;modifying-system-prompts"
    rel="nofollow">https:&#x2F;&#x2F;code.claude.com&#x2F;docs&#x2F;en&#x2F;agent-sdk&#x2F;modifying-system-p...</a><p>The
    main benefits to modifying the system prompt or output style is that the harness
    &quot;reminds&quot; the model about those things every turn. So if you&#x27;ve
    experienced things like Claude Code losing track of instruction from CLAUDE.md
    in large contexts, it indicates you may need to add the instruction to the system
    prompt instead which is far more durable.
