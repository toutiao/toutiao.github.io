  author: tavavex
  text: No offense, but this feels like the most un-Factorio thing imaginable.<p>In
    factory building games, the systems in play can be understood and are fully deterministic.
    You&#x27;re given a set of tools and a problem, and then craft together a solution.
    Your reward isn&#x27;t just seeing the item you want on a conveyor belt, but looking
    at the factory you built ticking like clockwork.<p>What you&#x27;re describing
    is beating out endless nondeterministic fires. It&#x27;s like you were forced
    to play Factorio exclusively through an algorithm that designs incomprehensible
    factories that don&#x27;t work sometimes, but designs them much faster than you
    ever could. So you click the magic button and see a mass of buildings appear in
    front of you. They may work perfectly fine, but if they don&#x27;t, you need to
    use the same statistical factory estimator to build an in-game factory fixer mechanism
    and factory tester mechanism. And then a few updates later the factory fixer breaks
    so you need to deploy a factory fixer fixer, and a belt clean-up machine, and
    so on ad infinitum. To me this doesn&#x27;t seem satisfying in the slightest.
