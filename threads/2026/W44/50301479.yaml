  text: I don&#x27;t really see how it is as different as you say. Even if a system
    is stochastic, it can still be controlled, it&#x27;s just a different type of
    engineering. Much of traditional engineering works exactly like this, with tolerances
    and probability rather than absolute determinism.<p>I think we (software engineers)
    are suffering from partial blindness to this aspect of engineering given that
    software has always been so extremely deterministic. We&#x27;ve trained ourselves
    that solving a problem means composing small fully deterministic parts into deterministic
    systems, and the prospect of having to work more with  statistical confidence
    and managing failure modes feels scary and wrong.
