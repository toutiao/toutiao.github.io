  author: allexsendev
  text: I use AI to correct AI :D Yea I know, sounds ridiculous, but hear me out.<p>Claude
    Web works differently than Claude Code. I use Claude Web&#x2F;Chat for briefs,
    general overview of the project outside of code&#x2F;app, for planning and handing
    off the work to Code, that includes prompts. Code is tasked to output a detailed
    view of what it found, run measurements and tests (designed both by me and Chat)
    and report findings back. That is fed back to Chat and I get a rough summary.
    Errors are categorized by their blast-radius and so on.<p>Eventually I do a deep
    dive of what changed, how well it&#x27;s handling, how much it&#x27;s struggling,
    token usage, time spent per review&#x2F;test and so on. (btw, Code is tasked to
    run an independent review via contextless agent on the codebase, that easily costs
    me another 20-30 mins and ~200K tokens on my current project, each run).<p>It
    still makes architectural issues, tries bandaiding and patching instead of properly
    designing, overvaluing&#x2F;devaluing certain cases and misallocating where most
    of the focus should be, but that&#x27;s relatively easier to spot and propose
    a fix for than doing a line by line code review.<p>Codebase quality is ensured
    through mapping the flow and the output space and having a hard-pinned tests Code
    can&#x27;t modify to green its answers, + the independent reviewer I mentioned
    above.<p>It&#x27;s not as fun as going in by hand on deep technical problems,
    sure. But AI usage is less about fun and more about output speed, so use it for
    what it is for ig? :D
