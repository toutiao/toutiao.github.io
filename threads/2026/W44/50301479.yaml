  author: martypitt
  text: It&#x27;s weird times.<p>I feel incredibly productive. I&#x27;m building in
    an afternoon what would&#x27;ve taken weeks. I spend all my time in either MR&#x27;s
    reviewing code, or a terminal prompting.<p>I&#x27;ve moved from being a coder,
    to being a product-engineer-architect. I love coding -- LOVE it. But the role
    has morphed. And, I actually really like the new role. I love being product centric,
    and caring about architecture -- it suits me wel..<p>The code Claude produces
    is often clean, but terribly archictected. So I&#x27;m spending a lot of time
    reviewing in detail.<p>But the anxienty - OMG the anxiety.<p>I work on multple
    features (generally 4-5 work streams) concurrently, so am constantly context switching.
    I worry about how much time I&#x27;m spending on each task. Am I doing enough
    code review? Too much? Too little?<p>What about click-through testing? Our test
    coverage has never been higher - should I be able to just merge these features?
    Wasn&#x27;t that always the promise of TDD - merging with confidence? But, it
    feels like a risk.<p>And, I&#x27;m moving really really fast - but I assume my
    competitors are too. So that drives me to move faster. Automate more. Use claude
    in more places. Which brings more anxiety - am I cutting too many corners? Is
    this all gonna crumble on me?<p>Also, is everything I&#x27;m working on going
    to become irrelevant? Will customers buy this product, or vibe code it? Do we
    even have a moat? Anxiety. More anxiety.<p>My investors are reading stuff constantly
    too. They&#x27;re pinging me with market updates, emerging players, shifting landscapes.
    More anxiety. Also - productivity tools - look - internet influencer X is now
    producing a gajillion lines of code a second -- are we doing that? Are we token
    maxing? Are we feature maxing?<p>Are we building the right number of internal
    tools? Are we automating enough? Should I evaluate the market for this new tool,
    or just smash something out with claude? More features. Burn more tokens. Ship
    ship ship.<p>Having to explain to investors why we&#x27;re not going as fast as
    those guys, and building enterprise products requires care and dedication -- that
    takes time. Time I should be shipping, coding, featuring, tokenizing. More anxiety.<p>I&#x27;m
    exhausted.<p>Anyway, gotta go - herdr has pinged me four times during writing
    this reply. Gotta ship.
