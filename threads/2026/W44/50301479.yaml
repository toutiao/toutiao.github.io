  author: FailMore
  text: I went through a period of feeling very tired. For me two things helped:<p>1.
    Being okay with being &quot;less&quot; productive. I&#x27;m probably still 10x
    more productive than I was in the pre-AI era, but in the early days of AI I would
    have eight Claude sessions running. Now it&#x27;s two or three and I take more
    advantage of the free time I have between Claude assignments. My bosses are still
    happy with my output and I&#x27;m not being burnt out.<p>2. Very personal, but
    building my own tooling really helped. I built <a href="https:&#x2F;&#x2F;smalldocs.org"
    rel="nofollow">https:&#x2F;&#x2F;smalldocs.org</a> &#x2F; <a href="https:&#x2F;&#x2F;github.com&#x2F;espressoplease&#x2F;smalldocs"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;espressoplease&#x2F;smalldocs</a>
    (a document creator for AI agents) which allows me to take a lot of work outside
    of a chat history. E.g. I might make 10 MRs and then say &quot;smalldoc me a list
    of the MRs&quot; and I have that in my library, or if I&#x27;m considering various
    architectures I&#x27;ll ask &quot;smalldoc me a simple overview of the three architectures
    with mermaid diagrams&quot; and then I can review the agent&#x27;s thinking in
    a cleaner way.
