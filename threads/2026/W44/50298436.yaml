  author: threecheese
  text: If tmux can know what an agent is, it can be leveraged to communicate with
    an instance of that agent (input and output) given it owns the PTY, and that terminal
    output can be structured somehow.<p>If it can communicate with the agent, it can
    be used to drive the agent - to send it tasks, and communicate the status of those
    tasks.<p>And so Herdr - and Superlogical, and others, is a tool which leverages
    PTY ownership and terminal protocols to allow orchestration of coding agents across
    vendors using their CLI surfaces.
