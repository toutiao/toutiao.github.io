  author: ricardobeat
  text: The point about libghostty is that Herdr doesn&#x27;t try to reimplement shell
    forwarding or emulation, instead it uses the same code your terminal already does.
    This avoids compatibility problems with more complex TUIs.<p>Running `herdr` always
    opens the same session, the app is a just a UI for a server running in the background.
    But there is no reason to open it in multiple windows, the point is to manage
    all shells from inside it.<p>Then you can from another machine do `herdr --remote
    xxx.local` (over Tailscale) to access the same session, or use `herdr machine
    add` to get your shells from all machines at once - I don&#x27;t really use this
    part.
