  author: Aurornis
  text: "&gt; He was charged with felonies for stealing PDFs for publicly funded research
    papers, he was tried as if he hacked these systems.<p>The Aaron Swartz case is
    important to know about and has catalyzed some good discussions about CFAA reform,
    but that specific case is a lot more complicated than your summary.<p>Before I
    begin: I agree that the punishment was too significant for the crime. I completely
    agree on that count. Discussing the facts of the case draws a lot of angry downvotes,
    so to be clear: I&#x27;m not saying he deserved any of these sentences nor that
    the laws are written well. I&#x27;m trying to explain the facts.<p>The PDFs were
    open to downloads on the MIT network. Straightforward downloading of the PDFs
    wouldn&#x27;t have been a CFAA violation. The case became complicated because
    he started circumventing restrictions on the downloads. This escalated to breaking
    into a wiring closet and hiding a laptop in the closed-off infrastructure. Once
    someone breaks into physical infrastructure to circumvent access restrictions,
    it gets really hard to argue that they weren&#x27;t doing a form of unauthorized
    access.<p>&gt; He took his own life as a result of them throwing decades of prison
    time at him for what&#x27;s hardly a serious hacking offense (seriously, Kevin
    Mitnick was way worse). Kevin Mitnick served five years, they were looking to
    throw up to 35 years at him, and a minimum sentence of seven years if he went
    to trial.<p>This is another part of the story that gets confused. Kevin Mitnick
    took a 5 year plea deal. The Swartz case plea deal was 6 months. The maximum sentencing
    numbers are repeated because they&#x27;re shocking, but maximum sentencing was
    never on the table due to the low severity.<p>The plea deal (the correct comparison
    to Kevin Mitnick&#x27;s case) would have been 6 months, not 35+ years."
