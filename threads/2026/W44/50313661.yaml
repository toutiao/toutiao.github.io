  author: TacticalCoder
  text: "&gt; If you access a web application, you end up re-downloading the application
    from the server thousands of times, and you are fully trusting the server each
    time. If the server gets hacked even one of the thousands of times that you open
    the site, you might be screwed. Regular old-fashioned applications (where you
    explicitly click &quot;download&quot;) are better than this: you only need to
    trust the server to not be malicious or hacked at that exact moment once.<p>That&#x27;s
    precisely why something like signed distributions packages are way more secure
    than curl bash&#x27;ing.<p>But many simply don&#x27;t understand that. We had
    plenty of forged Web certificates likely. And even without that, with curl bash&#x27;ing
    anything sensitive you have to cross fingers that the server ain&#x27;t serving
    one in 10 000 request with a backdoored version.<p>With curl bash&#x27;ing everybody
    is trusting every single time that the server ain&#x27;t compromised or intentionally
    malicious.<p>At this point I&#x27;ve lost any hope: people simply don&#x27;t understand
    security.<p>And as long as we&#x27;ll have people saying that curl bash&#x27;ing
    is just as safe as signed distros packages, we&#x27;ll have daily posts about
    major security incidents.<p>Security is a mindset and most people simply don&#x27;t
    have it."
