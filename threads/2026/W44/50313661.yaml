  author: privacyishuman
  text: This is a great blog post. I do a lot of similar things on my phone (GrapheneOS,
    airplane mode, CoMaps).<p>The thing that I’d been looking for on this minimal
    setup was a way to prevent access to the browser or installing apps at will. It
    was easy enough when I was on iOS. I just used Apple Configurator [1] to block
    Safari and the App Store, but on GrapheneOS, there was no great option.<p>Recently
    I made a device owner app [2] which allows hiding any UI app and locking itself.
    It ended up being quite an elegant solution as it allows full access to app stores
    for updates (new apps you install are hidden until you unlock and approve them).
    The only way around it is with the lock code or a factory reset.<p>This makes
    my phone a quite private device whose functionality I intentionally set ahead
    of time. It can only do what the apps I’ve chosen can do. I prefer browsing and
    similar on a computer.<p>[1] Apple’s Mac MDM app anyone can use. You need a Mac
    and to factory reset your phone first.<p>[2] <a href="https:&#x2F;&#x2F;beeswax.getflourish.org&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;beeswax.getflourish.org&#x2F;</a>
