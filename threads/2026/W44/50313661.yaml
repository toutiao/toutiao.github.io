    my parents about urbanism. When they grew up, the city was dirty, crime-ridden,
    etc. They also grew up during a time when the automobile was like the tech industry
    of their day. It was an innovation that changed their lives for the better in
    their opinion and lived experience. Their house got bigger, their car got bettter
    and lasted longer and their neighborhood got cleaner and safer, in their eyes.<p>My
    parents feel like trying to use the car less and switching to public transit or
    cycling more is like denying progress. What was the point of all that innovation
    and progress if we are “going backwards” in their eyes?<p>The end result of these
    discussions isn’t that I don’t believe in urbanism anymore, but I’m now more accepting
    of their point of view on the subject. I see their viewpoint as more valid than
    I used to. There’s nothing horribly wrong about their way of life even though
    I don’t necessarily want to adopt many aspects of it.
