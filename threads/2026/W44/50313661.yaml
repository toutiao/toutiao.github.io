  url: https://vitalik.eth.limo/general/2026/10/31/digital_minimalism.html
  title: Digital minimalism
  fetch_status: success
  content: "# Digital minimalism \n  \n   \n   \n\nFor a long time I have been a fan
    of minimalism in my physical life: have few physical possessions, and try to do
    more with less. Four years ago, I wrote [this blog post](https://vitalik.eth.limo/general/2022/06/20/backpack.html)
    describing what I had in the 40-liter backpack that I travel around with.\n\nPhysical
    minimalism, however, was an idea that came of age in the 2000s and 2010s and was
    responding to the challenges and the opportunities of the 2000s and 2010s. I continue
    to believe that it is valuable - though I recognize some arguments in the other
    direction, notably that having _the right kinds_ of physical things can make more
    practical to have more self-sovereignty over your life. But I also think that
    in the modern era, we need a new kind of minimalism: **digital minimalism**.\n\nDigital
    minimalism is about being intentional about ways that you access digital technology,
    making each use a conscious choice rather than something that you get sucked into
    by default. In this post, I will describe some experiments that I've done in this
    direction.\n\n## Social media minimalism\n\nTwitter (aka X) has always had a strain
    of toxicity to it, that has been increasing in recent years. The platform is definitely_engaging_,
    but it's often far from _informative_, and the ways in which it engages often
    do not make you _feel good_. But this all seemed to hit a particular crescendo
    for me around the end of 2024 and beginning of 2025. Many things were happening
    at that moment, but if you spent a lot of time on X you will likely remember a
    particular one: _everyone seemed to be suddenly becoming fans of Adolf Hitler_.\n\nAround
    the same time, \"Crypto Twitter\" was spiraling into a mood that I saw described
    as \"financial nihilism\": roughly, that the natural end state of blockchains
    is gambling, this is good, and if you dislike this and wish for something better
    then you are a stuck-up elitist prick.\n\nNaturally, I had (and continue to have)
    my intellectual disagreements with both of these trends. But on top of that, I
    also started to more seriously pay attention to the fact that while the style
    of discourse on the platform was _engaging_, it was _not enlightening_ and_not
    making me feel good_. And so for much of this year, I have been doing an experiment
    in distancing myself somewhat from this chaos. **I did not leave X _the platform_,
    but I did leave X_the interface_.** Instead, I have been doing most of my tweeting
    through [Firefly](https://firefly.social):\n\nFirefly is a multi-client that combines
    together X, BlueSky as well as Farcaster and Lens (both partially-Ethereum-based
    decentralized social media platforms). You can see tweets from all four platforms,
    and you can make a tweet that gets auto-posted to all four platforms.\n\nMy primary
    goal in doing this was to support decentralized social media, and to continue
    to engage with X but in a way that distributes network effect rather than locking
    it in. But in my months of using Firefly, I found that it also has a different
    effect: _I feel much better using it_.\n\nI suspect the primary reason is that
    while Firefly allows you to tweet, and see other people's tweets, it is missing
    one central part of the X interface: _The Algorithm™_.\n\nIn particular, I suspect
    that in my time using the X interface, I fell into the following trap:\n\n1. See
    someone making a tweet supportive of Adolf Hitler.\n2. Click on the tweet and
    look around its quotes and responses, the same way that someone would morbidly
    stare at a car accident.\n3. The Algorithm™ thinks: \"This user seems to be a
    fan of Adolf Hitler. Let me mark that down as one of his interests.\"\n4. See
    ten tweets supportive of Adolf Hitler.\n5. Click and look around with morbid curiosity,
    the same way that someone would morbidly stare if they saw for the first time
    a car accident where _ten cars_ were crashed and burning at the same time.\n6.
    The Algorithm™ thinks: ... well, you get the idea.\n7. See a hundred tweets supportive
    of Adolf Hitler.\n\nNow, in fairness to X and Elon and its hard-working employees,
    the Adolf Hitler fandom does seem to have greatly wound down in the one and a
    half years since then. I suspect part of this is because such movements inevitably
    burn out once people realize how immoral and stupid they are. But another part
    is undoubtedly genuine improvements in how The Algorithm™ works.\n\nBut _even
    still_, in those moments when I go back into the X interface, I find myself logging
    back out and going back to Firefly. I also find that my mind has changed. I find
    myself less interested in the various battles that the intellectual titans on
    the platform seem to be sucking every day of their lives into. Recently, I logged
    back in, and I learned that the culture war issue du jour was that people were
    stridently arguing about whether or not Mao was evil. When I saw this, I had an
    emotional response that was sort of similar to what I think is the common experience
    of being an adult, seeing some food or TV show or game that you used to love as
    a kid, and realizing that you now find no interest in it at all. I smiled, and
    immediately went back to enjoying my day.\n\nMy verdict: **I recommend more people
    try this. Explore ways of greatly decreasing or scoping your social media use:
    use something like Firefly, access X only on Tuesdays, whatever works for you.**
    Get the information benefits of the platform without getting sucked in to the
    vortex, which does operate on you in powerful subconscious ways that you may not
    realize.\n\n## Cell data minimalism\n\nFor a period of 100 days, I embarked upon
    a second experiment: I lived my life with my phone always on airplane mode. I
    still used wifi, but not my cell connection.\n\nI had two goals in doing this:\n\n1.
    **Privacy**. A phone connected to cell is an always-on tracking device. Cell companies
    are notoriously bad at keeping that data secure, and sometimes [they themselves
    sell it](https://www.androidpolice.com/your-carrier-was-selling-your-location-data-and-they-can-finally-be-punished-for-it/).
    So there is a large chance that a trail of your location will end up in the hands
    of intelligence agencies, military contractors, advertising companies, and more.
    \  \n  \n Anonymous SIM cards are not a sufficient solution, for two reasons:
    (i) your phone can still be linked across its entire usage lifetime through its
    IMEI number, and (ii) you leak all kinds of data that can be used to reconstruct
    who you are from your fine-grained movement patterns, internet access patterns,
    and modern AI makes it very practical to uncover these patterns.  \n  \nHence,
    the best location privacy solution is not having a cell connection at all (also,
    use GrapheneOS, and be very limited in what apps you give location permissions
    to; I had already been doing both).  \n  \n2. **Mental health**. Not having the
    internet at all for significant periods of time (when I'm outside) has been a
    good way of (re-)building the habit of surviving without it, and getting more
    mental peace and the space to think about other more healthy and productive things.\n\nOn
    the whole, I consider the experiment to have been a success. During those 100
    days, I violated the \"no cell data\" rule once literally but not spiritually
    - I turned it on briefly to receive a confirmation code that I needed in order
    to maintain that phone plan itself, and once spiritually but not literally - when
    going on a remote and slightly dangerous hike, friends insisted that I bring along
    a few communication devices that they had for emergency comms and use them to
    check in once every few hours.\n\nMy largest inconvenience was a stretch of time
    I was in Singapore, when my inability to receive SMS confirmation codes meant
    that I could not log into Grab (the regional Uber equivalent). As a result, my
    food options were more limited, and I had to take the subway instead of a car
    even in situations where that was much more inconvenient.\n\nSince those 100 days,
    I have opened the cell connection occas"
