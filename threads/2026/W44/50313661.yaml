  author: scruple
  text: I&#x27;m not disparaging you, it&#x27;s neat that you built this and it clearly
    solves a problem for people. But IMO, leveraging behavioral friction is simpler
    than dealing with all of this administrative overhead.<p>I treat my phone as stateless
    by default. I don&#x27;t keep many non-stock apps installed. The obvious exceptions
    are authenticators, I hate it but I get it, and I need my banking app. Pretty
    much everything else is ephemeral and disposable to me. If I genuinely need an
    app, I install it, use it, and wipe it.<p>The imposed friction here kills the
    compulsory behavior. Do I really want to see what&#x27;s on Instagram? No, I really
    don&#x27;t. Do I really want to spend $7 for a mediocre latte at Starbucks? No,
    not really. This unintended side-effect has been <i>great</i>. I have <i>no tolerance</i>
    now for modern retail coercion, and opting out of the enshittified layer of <i>everything</i>
    has been great for my wallet and my sanity.
