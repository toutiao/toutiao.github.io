  author: snarf21
  text: I think it is slightly different than that. I think it is more about active
    brain activity versus passive. Learning how to play Riichi Mahjong (e.g.) would
    likely show a similar effect. A lot of people push brain puzzles as a tool against
    dementia, etc. but it is only helpful when learning a <i>new</i> puzzle type.
    Once you over learn it, our innate pattern matching takes over and you start playing
    on auto-pilot, it stops &quot;rewiring&quot; your brain. Just sitting on the couch
    binging streaming or swiping through shorts is likely to atrophy your brain.<p>Obviously
    being out in nature has other mental health benefits. The key thing is to keep
    learning and stay curious. Drive to some new nearby town on a weekend and learn
    about its history. Learn a new hobby like full f-stop photography or learn how
    to bake or cook (learn all four base sauces). Take up board games and explore
    all the different kinds of experiences they provide today.
