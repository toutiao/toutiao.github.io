article:
  url: https://www.bbc.com/future/article/20261019-birdwatching-rewires-the-brain-and-slows-cognitive-decline
  title: Birdwatching rewires the brain and slows cognitive decline
  fetch_status: success
  content: |-
    # Birdwatching rewires the brain and slows cognitive decline

    Becca Warner

    ![](https://static.files.bbci.co.uk/bbcdotcom/web/20261019-154138-aa7a263842-web-3.25.0-1/grey-placeholder.png) ![BBC/Serenity Strull BBC/Serenity Strull](https://ichef.bbci.co.uk/images/ic/480xn/p0pj6qr2.jpg.webp)BBC/Serenity Strull

    _(Credit: BBC/Serenity Strull)_

    **Birdwatching can help slow brain ageing and is increasingly being used as therapy for dementia patients.**

    Every week, a group of elderly birders spend hours hunkering down inside a wooden hide in the English countryside, peering through binoculars as they excitedly share what they spot. An oystercatcher's long, bright beak probing the pebbled ground; two great crested grebes bobbing in the water, their plumed heads poised.&nbsp;

    Most of these birdwatchers have difficulty recalling what happened earlier that day, and might struggle to follow a conversation. But they become animated when swapping notes on the birds that fill the sky around Forge Mill Lake in the UK's West Midlands.

    Among them is 78-year-old Harold\*. He loved the outdoors when he was younger, but more recently dementia has made him withdrawn and anxious. His daughter Lucy\* brought him here, hoping that the change of scenery and peaceful lake might be good for him. After an apprehensive start, Harold began smiling when someone pointed out a robin and enjoyed watching the ducks splashing in the water. Blue tits darted between the nearby trees, and Lucy saw Harold laugh for the first time in a long time.

    "For that moment in time he was present in the moment, he wasn't worried about his memory or his confidence. That is very powerful, in a gentle way," says Jenny Budinger, a community dementia advisor at Age UK, the non-profit that runs the birdwatching group.

    Birdwatching is increasingly recognised as a valuable way for elderly people and dementia patients to spend their time, with groups set up in nursing homes in the UK, Germany and the US. [Paying attention to birds](https://www.sciencedirect.com/science/article/abs/pii/S0272494423001871?via%3Dihub), even through the window, can help older people feel more connected to others, experience more positive emotions and boost memory skills. Now [new research](https://www.jneurosci.org/content/46/12/e1307252026) shows that birdwatching can reshape the brain, much like learning an athletic sport or a musical instrument – and may even help slow the brain's ageing.

    ## **Better-organised brains**

    In the laboratory, neuroscientists tested keen birdwatchers' identification skills to determine who was an expert and who was a novice, then looked at their brains. The scientists found that the [very structure](https://www.jneurosci.org/content/46/12/e1307252026) of experts' brains was different – and that birdwatching expertise might slow age-related decline by keeping the brain more organised.

    Erik Wing, who led this research at Baycrest Academy for Research and Education in Toronto, Canada, compared MRI brain scans from bird experts to those of novices while they identified birds. He found that expert brains were wired differently in regions important for functions like attention, visual perception and visual recognition.&nbsp;

    Among expert birders, these regions showed more activity – particularly when they were asked to identify birds they weren't already familiar with. The findings don't prove whether structural brain differences are the cause or effect of birdwatching expertise. But, Wing says, one explanation is that the areas of the brain used for birdwatching might undergo ["neuroplasticity"](https://www.sciencedirect.com/science/chapter/handbook/abs/pii/B9780128194102000011) – the ability to change shape and function over time.

    ![](https://static.files.bbci.co.uk/bbcdotcom/web/20261019-154138-aa7a263842-web-3.25.0-1/grey-placeholder.png) ![BBC/Serenity Strull Birdwatching can reshape the brain and may help slow ageing (Credit: BBC/Serenity Strull)](https://ichef.bbci.co.uk/images/ic/480xn/p0pj6szt.jpg.webp)BBC/Serenity Strull

    _Birdwatching can reshape the brain and may help slow ageing (Credit: BBC/Serenity Strull)_

    Wing also analysed how organised the birdwatchers' brains were. Organisation in the brain tends to reduce with age, and lower measures of organisation are associated with [reduced cognition](https://link.springer.com/article/10.1007/s11682-015-9383-7). In experts' brains, some regions had higher levels of organisation and coherence than novices of the same age. Some of these regions were also the ones that showed more activity during bird identification. This indicates a "kind of preservation of organisation" in the brains of experts as they age, Wing says.

    More research is needed to understand the nature of this preservation and how it links to wider cognitive function. But for now, the results may indicate that "acquiring this skill earlier in life might produce benefits that continue through to older adults", Wing says. This is good news for the [many Gen Z](https://www.bbc.com/news/articles/cdjpdm9v7gno) (16 to 29-year-old) birdwatchers who are getting their binoculars out long before old age sets in.

    ## **Bird therapy**

    Wing's research looked at birdwatching expertise, but other findings suggest that there may be psychological benefits to birdwatching even for those without special knowledge or skills.&nbsp;

    In fact, when it comes to experiencing psychological restoration – feelings of calm, freedom and rejuvenation – [enthusiasm may be more relevant than expertise](https://journals.sagepub.com/doi/full/10.1089/eco.2021.0062). A study of 388 birdwatchers in Poland found that those who say they are more interested in birding than other activities and consider it an important part of their lives are more likely to experience psychological restoration than birdwatchers who are highly skilled but less enthusiastic.

    Simply choosing to be interested in birds, then, could have its own benefits. Elisabeth Kals, a professor of social and organisational psychology at the Catholic University of Eichstätt-Ingolstadt in Germany, is interested in how our relationship with nature shapes our life experiences and wellbeing. She studied what happened when people living in nursing homes had the chance to watch the local bird life.&nbsp;

    Her team installed [bird feeding stations](https://www.lbv.de/umweltbildung/fuer-seniorenheime/das-projekt-idee-hintergrund/) outside 65 homes, positioned so that residents could watch the birds from the comfort of the indoor common area, and assessed the residents' cognition, mobility and wellbeing through self-reports and inputs from staff and family. They [saw improvements](https://www.sciencedirect.com/science/article/abs/pii/S0272494423001871?via%3Dihub) after just a few weeks, and after a month birdwatching explained residents' wellbeing better than their age and care level.

    "The findings were clearly positive," Kals says. Those who took part in birdwatching became more cognitively agile, she adds – meaning they were more able to follow a conversation and interact with family who visited, remember and recognise birds that had visited before, and show alertness.

    Nursing home staff were the first to see the difference the birds made. "For weeks, they haven't seen a smile on [a resident's] face, and then they see the smile," Kals says.

    Some of the memory and concentration improvements are evident after just three to four weeks, Kals says.

    Her team's findings have prompted German health insurance companies – who, among others, initially funded the research project – to [invest](https://www.lbv.de/umweltbildung/fuer-seniorenheime/) in setting up bird feeders and viewing areas in more than 400 nursing homes across Bavaria. "It was so effective, it just economised money," Kals says.

