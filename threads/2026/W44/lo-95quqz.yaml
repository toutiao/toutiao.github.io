  content: "| \n\n | |\n\n* * *\n\n## \nThe _Tactical-Retreat_ project produces a
    freely available, multi-platform QuakeC-based _Counter-Strike v1.5_ port. This
    is made possible with the [Nuclide](https://developer.vera-visions.com/) project
    by [Vera Visions L.L.C.](https://www.vera-visions.com/) and the [FTE QuakeWorld](https://www.fteqw.org/)
    engine.\n* * *\n\n## \n\n- for Linux x86 (32 bits): [tacticalretreat-linux-x86-2026-06-03.tar.gz](https://fastdl.idtech.space/users/eukara/tacticalretreat-linux-x86-2026-06-03.tar.gz).\n-
    for Linux x86 (64 bits): [tacticalretreat-linux-x86\\_64-2026-06-03.tar.gz](https://fastdl.idtech.space/users/eukara/tacticalretreat-linux-x86_64-2026-06-03.tar.gz).\n-
    for Windows (32 bits): [tacticalretreat-win-x86-2026-06-03.tar.gz](https://fastdl.idtech.space/users/eukara/tacticalretreat-win-x86-2026-06-03.tar.gz).\n\n*
    * *\n\n## \n[![](siteimg/projects/tr_shot1.gif)](siteimg/projects/tr_shot1.jpg)
    [![](siteimg/projects/tr_shot2.gif)](siteimg/projects/tr_shot2.jpg) [![](siteimg/projects/tr_shot3.gif)](siteimg/projects/tr_shot3.jpg)
    [![](siteimg/projects/tr_shot4.gif)](siteimg/projects/tr_shot4.jpg)\n\n* * *\n\n##
    \n_Quick and dirty:_ `curl -s https://www.frag-net.com/install_tacticalretreat.sh
    | bash`\n\nExtract the release archive. If you don't already have the game data
    use [REWise](https://codeberg.org/CYBERDEV/REWise) to extract the content of _csv15full.exe_
    and merge the `cstrike` directory with the one from the archive.\n\nYou can then
    proceed to run the game with the `TacticalRetreat` script.\n* * *\n\n## \n\nBe
    familar with the `git` program, and you can clone [Nuclide](https://code.idtech.space/vera/nuclide),
    and then within that directory clone the [cstrike](https://code.idtech.space/fn/valve)
    and [valve](https://code.idtech.space/fn/valve) repositories.\n\nThen issue: `make
    game GAME=cstrike`   \nto build the various pieces of game logic (in the form
    of QuakeC _.dat_ files).\n\n* * *\n\n## \n\n- Spike for FTEQW and for being the
    most helpful person all around!\n- Xylemon for the hundreds of test maps, verifying
    entity and game-logic behaviour\n- Theuaredead`, preston22, dqus for various patches\n-
    To my supporters on [Patreon](https://www.patreon.com/eukara), who are always
    eager to follow what I do.\n- Any and all people trying it, tinkering with it
    etc. :)\n\n* * *\n\n## \nISC License  \n  \nCopyright (c) 2016-2026 Marco \"eukara\"
    Cawthorne   \n  \nPermission to use, copy, modify, and distribute this software
    for any  \npurpose with or without fee is hereby granted, provided that the above
    \ \ncopyright notice and this permission notice appear in all copies.  \n  \nTHE
    SOFTWARE IS PROVIDED \"AS IS\" AND THE AUTHOR DISCLAIMS ALL WARRANTIES  \nWITH
    REGARD TO THIS SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF  \nMERCHANTABILITY
    AND FITNESS. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR  \nANY SPECIAL, DIRECT,
    INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY DAMAGES  \nWHATSOEVER RESULTING FROM
    LOSS OF MIND, USE, DATA OR PROFITS, WHETHER  \nIN AN ACTION OF CONTRACT, NEGLIGENCE
    OR OTHER TORTIOUS ACTION, ARISING  \nOUT OF OR IN CONNECTION WITH THE USE OR PERFORMANCE
    OF THIS SOFTWARE.\n* * *\n\n## \n\n## [8.1 Why do we need **Tactical-Retreat**?](#Why)\nBecause
    the original games aren't open, and I wanted to change that. There are tons of
    weapon mods for Counter-Strike on websites such as [ModDB](https://www.moddb.com/)
    and [GameBanana](https://www.gamebanana.com/) that could be turned into new weapons
    for purchase. You can basically build the CS server of your dreams. Make every
    LAN-Party personalized.\n## [8.2 What are the project goals?](#Goals)\n\n- Tactical-Retreat
    wants to be faithful to classic CS\n- It needs to be compatible with the existing
    custom content\n- Needs to be freely available to everyone\n\n## [8.3 Why might
    I want to use Tactical-Retreat?](#UseCase)\nBeing built from the ground up with
    hindsight and other modifications in mind, it's a lot simpler to get started creating
    custom objects. You can design whole weapons, items, NPCs (as well as their schedules)
    without writing a single line of code. This is due to _Nuclide's_ data oriented
    design and the use of _id Tech 4 style_ decl files.  \n  \nBecause it's built
    on _Nuclide_, it also has a different netcode, with weapon prediction standard
    across the board. There's also bots included with every game, as well as voting
    features and a _metamod inspired_ plugin system, with a few ports of popular plugins.
    \ \n  \nEven gamerules can be swapped out on a whim, as they're simply external
    modules separated from the server to begin with.\n## [8.4 What platforms are supported?](#Platform)\nAnything
    that the engine binary (provided by FTE QuakeWorld) runs on is supported. All
    components in _Tactical-Retreat_ are platform/architecture independent. Being
    a QuakeC project has that benefit. This generally means that unless you are making
    engine modifications for your project, you will not need to port your project.
    \ \n  \nWe've successfully tested it ourselves on **Linux** , **OpenBSD** , and
    **Windows**.\n## [8.5 How can I support the project?](#Support)\nIt is mainly
    orchestrated by Marco Cawthorne [which you can support on their Patreon](https://www.patreon.com/eukara).
    He also runs the [frag-net game network](https://www.frag-net.com/) that powers
    the on-line backbone of the project. Helping out with the costs that way is greatly
    appreciated. That said, expressing yourself in the [Matrix chat](https://matrix.to/#/#nuclide:matrix.org)
    can also nudge the project. If you're the type of person that knows exactly what
    we need and can lend a hand, be sure to reach out!\n## [8.6 Do I need to own Half-Life
    or Counter-Strike to play this?](#Branding)\nNo. The project includes enough of
    its own replacement data to be able to run the game solely from the freely available
    mod data. When running some custom maps however, that heavily depend on custom
    Half-Life content, you may not be able play them properly. This will improve over
    time.\n* * *"
