  author: tialaramex
  text: Yes. This switch off doesn&#x27;t somehow miraculously delete the copper cables,
    it just switches off a particular service offered on those cables.<p>However the
    service you&#x27;re describing is not ADSL, in which the DSL endpoint is in the
    exchange where all of an area&#x27;s copper cables met but instead VDSL where
    the nearby local cabinet processes the DSL signals and is itself provided with
    fibre.<p>With VDSL the copper cable is maybe moving your Internet 100 metres,
    with ADSL it might be several kilometres, and so ADSL can&#x27;t do 30 down 8
    up, the most it&#x27;s going to try is something like 12 down 2 up.<p>Edited to
    add:<p>In principle you could imagine a technology which goes &quot;Wait a minute,
    this is a direct exchange line and the exchange is one block from here, I&#x27;ll
    try 100Mbps&quot; but ADSL is not that technology. What we actually do is either
    put VDSL in the exchange and give these people VDSL or run actual fibre to them
    if it&#x27;s perceived that they&#x27;d be willing to pay for faster Internet.
    A friend lives a short distance from our exchange and bleated for years about
    ADSL being all that was available until (this is years ago now) I got sick of
    it and made him fill out the precise line diagnostic and of course it says yes
    he can have VDSL. Beliefs can be sticky, he probably checked the very first time
    he whined about it, and then five years later he was still running off that no-longer
    true belief.
