  author: ssl-3
  text: 'My neighborhood (along with most of the city) was without power for a couple
    of weeks following the 2012 derecho.  I had VDSL at that time.<p>The VRADs scattered
    around the city included a battery that worked for as long as it worked.  But
    I never did discover how long those batteries would last, because AT&amp;T brought
    portable generators out to supply power to their VRADs.<p>I kept my end alive
    with the portable generator that I was using intermittently for everything else
    along with the backup battery that the modem came with.<p>The VDSL circuit never
    dropped during those two weeks -- and yes, I read the logs afterward with some
    astonishment.  :)<p>(Since the RF environment was extremely quiet, wifi had fantastic
    range.  I opened up an SSID for anyone within earshot to use and some folks actually
    did use it.)<p>---<p>Fast forward a dozen or so years.  When the power dips in
    my neighborhood, the cable network drops out with it.  So, sure: I&#x27;ve got
    a small UPS for my little stack of network gear, but fat lot of good that does
    when there&#x27;s nobody for it to talk to.<p>And I&#x27;ve got ways to use LTE&#x2F;5G
    as a backup, but the performance of the cell network also nosedives at that same
    time.  It&#x27;s not clear to me if that&#x27;s due to a service interruption
    or instead due to everyone&#x27;s pocket supercomputer switching from wifi to
    cellular data, but whatever the cause:  It turns pretty useless.<p>(I&#x27;m on
    FTTH fiber now but it&#x27;s only been a week.  We&#x27;ll see how it does the
    next time there&#x27;s a power issue.)'
