    this more like a digitized POTS line on their side, much like the normal pots
    lines they digitized behind the scenes). There were also some other smaller deployments
    here and there, but that seemed to be the biggest one in the US.<p>ADSL&#x2F;ADSL2&#x2F;ADSL2+
    certainly did exist, but to work well you need to be relatively close to the local
    exchange, needed copper wires in good condition, etc. It was offered fairly widely,
    like by most companies offering phone service over copper lines, but because the
    quality could vary quite significantly depending on things not obvious to the
    purchaser, it tended to get a bad-rap. If you tried it once, but was unluck enough
    to have it not work well, you would write off the tech, and tell all your firends
    not to bother, and go go with the cable offering.<p>For me personally, in its
    heyday, ADSL2 beat cable hands down, as in that time frame cable was only using
    a tiny fraction of its bandwidth to provide internet service, and only a few feeds
    coming out of the local office, so the amount of oversubscription was insane,
    and amounted to basically fraud, as you could only ever get anywhere near your
    advertised speed at like 4 am."
