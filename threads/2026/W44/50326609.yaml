  text: '&gt; An interesting component of the switching off of POTS is that the quality
    of service requirements are different. POTS is regulated to require the phone
    company to maintain a certain legal quality of service with negative consequences
    for failing to do so.<p>Yeah we&#x27;ve had a similar thing happen in Australia.
    Most VoIP services require you to either tick a box or verbally waive one&#x27;s
    rights to said requirements in regards to reliability and fault rectification
    timelines.<p>However, there hasn&#x27;t been too much of an issue with transition
    to VoIP here, apart from the unreliability of some services they&#x27;re being
    run on, and keeping emergency contact details up to date. The latter resulting
    in fines for providers here and there.<p>Mostly, it&#x27;s just pushed mobile&#x2F;cell
