  text: "&gt; I really had no backup plans for something like a Neovim plugin&#x27;s
    source forge being down<p>this problem could exist with any package manager, the
    go package manager is one example, where it allows specifying packages from any
    git url. we host a mirror of all git repositories on our infra, and serve that
    when the backing knot is down. you could choose to trust that and pull from there
    (verifying that the tarball has a known correct hash), the way the go package
    manager pulls from proxy.golang.org."
