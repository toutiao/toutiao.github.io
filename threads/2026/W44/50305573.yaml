    That&#x27;s exactly the problem we want to solve. Of course, they still need <i>identity</i> of some kind -- in this case, they&#x27;ll need an AT Protocol account -- either by self-hosting a Personal Data Server[0], or signing up with a provider such as Tangled or Bluesky&#x2F;Blacksky, etc. This is the last ever account they&#x27;ll need (and it&#x27;s theirs, and portable!). They can then begin contributing; they&#x27;ll use this same account for all of Tangled and other AT Protocol services.<p>Your Tangled git server that you&#x27;d want to run is a &#x27;knot&#x27;[1]. It&#x27;s not exactly analogous to Forgejo because it&#x27;s headless, but that makes it super light on resources to run.<p>[0]: <a href="https:&#x2F;&#x2F;atproto.com&#x2F;guides&#x2F;the-at-stack#pds" rel="nofollow">https:&#x2F;&#x2F;atproto.com&#x2F;guides&#x2F;the-at-stack#pds</a>
