  author: jauntywundrkind
  text: '&gt; <i>As has BlueSky, as long as you had enough hardware to keep up with
    the firehose</i><p>We&#x27;ve already explained to you <i>twice</i> that this
    is incorrect, you don&#x27;t need to do this. And that if you do want to do this
    for some ridiculous reason, just because, a $5 VPS can do it.<p>But you do acknowledge
    latter you are only talking about tangled records.<p>Currently very few people
    are worried about this problem, because all of the tangled traffic just isn&#x27;t
    that big, and you can drop most of it very quickly with little impact. Relays
    do allow various kinds of filters though. You could use a service like Microcosm
    Constellation <a href="https:&#x2F;&#x2F;constellation.microcosm.blue&#x2F;" rel="nofollow">https:&#x2F;&#x2F;constellation.microcosm.blue&#x2F;</a>
    that lets you find only records for your repos etc. That would work fine for finding
    the records pertinent to you!<p>No one does this right now, because the premise
    is faulty. There just really isn&#x27;t any difficulty or cost of any note to
    having all the tangled records piped at you. Hopefully some day this gets worse,
    and that this becomes a good problem to have! One we already have tools (like
    constellation) to tackle.<p>In short: constellation is a (also easy to self host
    cheap light weight) service for reverse indexing, for finding records pertinent
    to you. Lots and lots of atproto apps use this for this kind of &quot;find people
    making records about my stuff&quot;.'
