    Really looking forward to seeing Tangled develop! I&#x27;ve got a side project that&#x27;s main repo and CI is on my self-hosted Gitea but code and releases are mirrored to Github; I&#x27;m hoping to move it off Gitea and onto Tangled for code&#x2F;releases&#x2F;potentially CI and just keep Github for discoverability&#x2F;backups&#x2F;namespace &quot;squatting&quot;.
    Just need git-bug to add a Tangled bridge so I can keep issues synced and (ideally) for there to be instructions for running the client self-hosted. It doesn&#x27;t have to be a full featured client but I also don&#x27;t want to be SOL for web visibility if the main Tangled appview is down.<p>One musing: I did run into my first &quot;issue&quot; with federated Git hosting the other day while setting up Neovim on a new machine. One of the plugins I use is hosted on Tangled and I guess its backing Knot was down. This was awkward for two reasons:<p>1. It as unclear to me from the Tangled website the backing knot was the issue (for a while I thought it was something on my end)<p>2. I really had no backup plans for something like a Neovim plugin&#x27;s source forge being down and, clearly, neither did the Neovim package manager as it just kept showing an error on every session I started with no way to fix it :).<p>I suppose in the long run we really shouldn&#x27;t be assuming that code storage is just Always There or easily cached somewhere, but I anticipate some growing pains in the mean time. ATProto doesn&#x27;t seem to have the benefit ActivityPub has where if the instance I wanted to view content on was down I can usually find some other instance that&#x27;s gotten the messages.
