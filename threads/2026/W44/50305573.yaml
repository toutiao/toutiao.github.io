  author: ar-nelson
  text: Forgejo was supposed to, but that feature has been in limbo forever. For better
    or worse, ATProto is easier to implement, because most of the important details
    of ActivityPub are undocumented compatibility details of implementations like
    Mastodon (the spec alone isn&#x27;t very useful for a working, compatible implementation).<p>AI
    would make it easier to implement and test complex protocols like this, but the
    community using Forgejo is mostly against it, which means it&#x27;ll likely stay
    in limbo for a long time.
