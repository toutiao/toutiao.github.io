    want to host where!<p>It is a social network so I&#x27;m not sure what the issue
    about yes needing to read the network is. There are really good relays designed
    to help aggregate and filter the network. They can run on $5 VPS, processing the
    <i>entire</i> network, which is awesomely cheap, not just Tangled, which is awesome,
    what I would call a huge win. Paul has a talk on designing for scalability, about
    how it&#x27;s possible to have such small boxes doing the network aggregation
    with so little resources, that appviews can then consume their interests from.
    <i>solving for scale in open social networks</i>, <a href="https:&#x2F;&#x2F;youtu.be&#x2F;BoJnj2yPf14"
    rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;BoJnj2yPf14</a><p>The servers are
    definitely not <i>keeping</i> the whole network. The post talks to this some,
    but the new Knot2 retains a local copy of repo-relevant material (comments prs
    etc) in its own git tree, that collects what the network has done together, and
    makes it easy to ship&#x2F;replicate, while also using that as a sync source to
    replicate back into atproto too, to make network visible.<p>Agreed that I really
    wish ForgeFed were showing much more clear progress. It seems like such a good
    idea, but it&#x27;s been a number of years now and it&#x27;s super murky what
    the progress is and where we are. Having &gt;1 viable player in the decentralization
    of forges would be great. I haven&#x27;t checked in a bit but I do read Forgejo
    release notes and my impression is it&#x27;s been a very slow trickle.
