  text: |-
    It&#x27;s right here - you can&#x27;t see it due to being downvoted.<p>I asked Claude to research this one and it turned up an interesting point. Pirated books got into the Pile and Anthropic paid 3k per book.
    Worth noting if anyone still uses the Pile.<p>[Claude researched, not verified]<p>In October 2020, developer Shawn Presser converted the Bibliotik pirate tracker into Books3 (196,640 books) and hosted it on The Eye, aiming to give everyone what OpenAI had with its secret Books1 and Books2. EleutherAI then folded Books3 into The Pile, distributed via Hugging Face and GitHub, and it went on to train Meta&#x27;s LLaMA, EleutherAI&#x27;s Pythia, and BloombergGPT. In August 2023, Alex Reisner of The Atlantic exposed its contents, and Maria Fredenslund&#x27;s Danish Rights Alliance forced takedowns at The Eye, Hugging Face, and EleutherAI. A year later, Andrea Bartz (The Lost Night), Charles Graeber (The Good Nurse), and Kirk Wallace Johnson (The Feather Thief) filed Bartz v. Anthropic before Judge William Alsup, accusing Anthropic of using Books3, LibGen, and PiLiMi to train Claude; the case settled for $1.5 billion, about $3,000 per work.
