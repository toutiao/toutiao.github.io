  author: chollida1
  text: One interesting knock on from the hyperscaler growth we&#x27;ve seen is that
    the Mag7 have issued so much debt that they are crowding out other companies who
    would otherwise have no trouble issuing debt.<p>The private equity and private
    credit crowd is one of these groups that are currently running into this issue.<p>There
    is no way a growing company($15M to $500M in yearly sales is the sweet spot for
    these private credit companies) can compete with Google on debt terms so they
    have to raise their rates to compete suddenly, not because of all rates rising
    but strictly because we&#x27;ve just seen a huge debt issuance from some very
    solid credit companies.<p>We haven&#x27;t seen a shock like this in 20+ years
    I&#x27;ve followed the credit market where a small group of companies issue so
    much high quality debt in such a short period of time, note there is also a lot
    of less high quality debt issued in this same time:)<p>So much has been issued
    that credit funds have run out of appetite to acquire Lowe middle market debt
    at their current spreads.  This is just the way markets work so no one is crying
    in the casino but it is a big shock to the credit markets.<p>heck there was concern
    that the US government may have trouble issuing 5-10Y debt at rates they are used
    to because of the amount of GOOG, META,etc debt that is available at better terms.<p>Its
    a wrinkle to the markets that no one really predicted as a knock on effect of
    AI&#x27;s growth.<p>This is all the back drop for BDC(Business Development Companies)
    and other private credit issuers who normally loan money for 5-7 year terms.<p>Those
    cheap 2021 loans to these small private companies are now coming due into this
    market with the additional head wind that the largest single sector that issued
    debt was venture backed software companies, who now face the head winds of the
    macro factors described above and the additional factor of AI commoditizing alot
    of hte software that these companies are building.<p>Private credit and equity
    are going to have  a rough couple of years.<p>Things to watch out for are lack
    of IPO&#x27;s and exist from venture&#x2F;PE backed companies and a proliferation
    of continuation funds that kick the can down the road.<p>On the plus side, its
    a great time to be a credit trader, but not necessarily a credit issuer:)
