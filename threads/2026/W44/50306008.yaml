  title: US tech stocks see sharp falls as AI spending nears $1tn - BBC News
  fetch_status: success
  content: "Image source, Michael Nagle/Bloomberg via Getty Images\n\nByRachel Clun\nBusiness
    reporter,&nbsp;Reporting fromNew York\n\n- \nPublished\n\n**Tech stocks tumbled
    for the second day in a row as concerns rise over the hundreds of billions of
    dollars firms are investing in artificial intelligence (AI).**\n\nShares in Intel
    plummeted by as much as 30% on Friday, following Google owner Alphabet's stock
    price [plunging by more than $500bn (£374bn)](/news/articles/cm9qzdqpxy48o) in
    the previous day's trading.\n\nOther tech stocks including Reddit and Amazon also
    fell, while the Nasdaq index of the largest tech firms listed in the US, sank
    more than 3.5%.\n\nWhile tech firms are spending big on AI, their earnings are
    not always meeting analysts' expectations, spooking investors and creating fears
    of an AI bubble.\n\nMajor tech companies have ramped up artificial intelligence
    spending, with Meta, Alphabet, Oracle, Amazon, and Microsoft committing to spending
    $800.6bn between them in 2026.\n\nAlphabet's stock market value plunged on Thursday
    after it revealed the AI summaries it now provides as the top answer to search
    queries were affecting its core search advertising revenue.\n\nAt the same time,
    Alphabet expects to spend up to $205bn this year on investments, almost entirely
    related to AI.\n\nAlphabet stock continued to fall in early trading, down 2.2%
    after Thursday's slide of more than 12%.\n\nThe bigger losses on Friday were elsewhere,
    with Intel on track to lose more than $130bn in value as its shares continued
    to fall in Friday trading.\n\nThe chip maker said it planned to increase spending
    on AI despite weaker demand for computers, a major source of demand for its micro-processors.\n\nOn
    Thursday, Intel's finance chief David Zinsner said the firm did not expect to
    bring in more cash than it spent this year and forecast lower-than-expected revenue
    for its fourth quarter.\n\n\"Looking ahead, we see the PC slowdown continuing
    at least through the first half of next year,\" he said in the chip maker's third
    quarter earnings report.\n\nIn the earnings call, he said the firm had significantly
    ramped up investment in equipment in the third quarter and expected that to be
    \"even more significant\" in the following three months.\n\n## Amazon and Reddit
    down\n\nAmazon shares fell as far as 6% in overnight trading after the company's
    reported earnings fell short of investors' expectations.\n\nAmazon on Thursday
    revealed it had also spent more cash than it was making, and that spending had
    increased six-fold over the span of three months.\n\nThe company has committed
    to spending $220bn this year, putting the money towards investments such as AI
    data centres, network equipment, and servers.\n\nShares recovered slightly from
    the overnight fall but were still down about 1.6% in Friday trading.\n\nReddit
    stock was down by 26%, after the social media platform revealed weaker-than-expected
    daily user figures and warned that Google's growing AI-driven search was hurting
    referral traffic.\n\nStock in online game platform Roblox also fell, down by nearly
    20%, as its daily active user numbers dropped.\n\nSeveral major tech firms have
    reported earnings this week, including Microsoft, and analysts said there were
    questions about the payout from the huge investments in AI.\n\nChris Low, from
    investment management firm FHN Financial, said the bulk of what was happening
    in the stock market was in reaction to some of the biggest tech players such as
    Amazon and Google.\n\nHe told Reuters the companies were \"showing some pretty
    significant growing pains as they aggressively pursue the AI build-out\".\n\n\"The
    thinking is that these signs suggest that the entire sector is going to slow down.\"\n\n##
    'Investors have turned ruthless'\n\nMany analysts have been debating the possibility
    of an AI bubble in the stock market.\n\nThe worry is that some tech firms will
    not be able to justify their sky-high valuations because the cost of building
    AI data centres and developing the software will end up being greater than the
    money they can make from it.\n\nKathleen Brookes, research director at trading
    firm XTB, said there have been many ups and downs in AI trade in recent months.\n\n\"Investors
    have turned ruthless, punishing any signs of disappointment in [third quarter]
    earnings,\" she said.\n\n\"The AI trade has had a good run in recent years, but
    now investors want payback, and companies like Alphabet and Intel are in the crosshairs.\"\n\nHowever,
    stock market values for many of these companies remain well above where they were
    a year ago.\n\nWhile the Nasdaq is down 3.5% in Friday trading, it is up 7.6%
    over the last year. Similarly Amazon is up nearly 7% over the past 12 months,
    while Alphabet is down 1.6%.\n\nBrookes noted that November is typically a strong
    month for stocks.\n\n\"If we see AI stocks continue to struggle in the coming
    days, it could suggest the AI trade is past its peak, and investors will be looking
    for a new theme to drive markets,\" she said.\n\n## Related topics\n\n- [Artificial
    intelligence](/news/topics/ce1qrvleleqt)\n- [Stock markets](/news/topics/cgdzpg5yvdvt)\n-
    [NASDAQ](/news/topics/c08k88ey6d5t)\n\n## More on this story\n\n- \n\n[\n\nGoogle
    value plunges by $500bn as its own AI search hits ad sales\n\n](/news/articles/cm9qzdqpxy48o)\n\n
    \ - \nPublished\n\n8 hours ago"
