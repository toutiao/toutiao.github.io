    # Meta Employees Denounce Interference in Brazilian Elections

    ### Meta staff are holding the Big Tech company’s leadership accountable for decisions they say could compromise the credibility of the democratic process.

    [

    ](https://substack.com/@padispatch)

    [Panamerican Dispatch](https://substack.com/@padispatch)

    _by ICL Noticias_

    Employees at Meta, the parent company of Facebook, Instagram, and WhatsApp, have expressed concern over what they describe as “obvious” and “biased” favoritism toward members of the Bolsonaro family during Brazilian elections.

    In a statement, the company’s workers held Meta’s leadership responsible for decisions that, they argue, could undermine the credibility of the democratic process.

    Thanks for reading! Subscribe for free to receive new posts and support my work.

    [

    ](https://substackcdn.com/image/fetch/$s_!RX_H!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5664bbc8-6981-4cc9-ac02-48d645aa8804_3467x1819.jpeg)

    ##### _Brazilians [protest in front of the Meta building](https://www.instagram.com/p/De4vD6SEdIN/?hl=en&img_index=1) in London, UK, against the company’s interference in Brazil’s presidential elections. (Brasil Matters)_

    The statement was signed by members of the tech sector branch of the United Kingdom’s [Communication Workers Union](https://www.cwu.org/), CWU. In the text, the employees voice concern regarding recent revelations about the company’s management and point to the risk of interference in the elections of other nations.

    “Since 2016, the political leanings of Meta executives and company leaders has been no secret,” the document states.

    The employees emphasize, however, that they consider this systematic and user-perceptible application of political favoritism to be unprecedented.

    “But this is the first time to our knowledge that favours made to politicians such as the Bolsonaros have been programmatically made user-facing to such an obvious and biased extent,” the statement reads.

    The text also expresses concern that the company’s actions could damage public trust in democratic institutions and in digital platforms themselves.

    “The last thing we want is to sit back and watch our employer interfering in the democratic processes of countries like Brazil,” the employees say.

    According to the group, a loss of credibility in elections and politicians could also erode trust in the technologies developed by the company. The employees warn that this scenario sets a dangerous precedent for the future.

    “We Meta employees want to build technologies and platforms that millions of people use and enjoy,” the text states. “In undermining the credibility of elections and politicians, it also unfairly undermines the credibility of what we build, and sets an incredibly dangerous precedent for the future.

    At the end of the statement, the employees call on the company to respect democratic principles.

    “We call for fairness and democracy to be respected,” the document concludes.

    On Saturday, October 24, a protest against Meta’s interventions in the Brazilian elections took place in front of the company’s headquarters in King’s Cross, central London. The demonstration was organized by the “Alliance for Democracy and Brazilian Sovereignty,” a collective of movements bringing together Brazilians in England.

    [

    ](https://substackcdn.com/image/fetch/$s_!iZ0-!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F340d5198-220e-430a-95f3-8bd54d09f69c_1600x1200.webp)

    ##### _Brazilians [protest in front of the Meta building](https://www.instagram.com/p/De4vD6SEdIN/?hl=en&img_index=1) in London, UK (Annaís Berlim/Brazil Matters)_

    **Below is the full text of the statement:**

    _As employees of Meta, we are disturbed by the revelations of the past few days and weeks regarding our management._

    _Since 2016, the political leanings of Meta executives and company leaders has been no secret._

    _But this is the first time to our knowledge that favours made to politicians such as the Bolsonaros have been programmatically made user-facing to such an obvious and biased extent._

    _We Meta employees want to build technologies and platforms that millions of people use and enjoy._

    _The last thing we want is to sit back and watch our employer interfering in the democratic processes of countries like Brazil._

    _In undermining the credibility of elections and politicians, it also unfairly undermines the credibility of what we build, and sets an incredibly dangerous precedent for the future._

    _We call for fairness and democracy to be respected._

