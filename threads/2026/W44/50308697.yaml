  text: Prompt and competent response, as expected from bunny.<p>&quot;Last week,
    one of our infrastructure providers reported unauthorized access involving third-party
    server management software. One of our CDN nodes, located in Armenia, was hosted
    on a server supplied by this provider.<p>After receiving the alert from the affected
    provider, our engineering team took immediate action. Within 20 minutes, we stopped
    routing traffic through the server. We then reviewed and preserved the relevant
    security logs for investigation, securely wiped the server, and revoked its access
    to our other systems. The affected server has been permanently removed from our
    infrastructure.&quot;
