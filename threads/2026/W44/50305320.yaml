  author: pawelwentpawel
  text: Thanks! To respond to your questions - there is a lot indeed. I think the
    trick was reusing the same techniques I used before (materials, shaders, colours,
    light setups and much more) from my previous project (<a href="https:&#x2F;&#x2F;flat.social"
    rel="nofollow">https:&#x2F;&#x2F;flat.social</a> - spatial audio and video in
    3d, much more complex). I reused a lot of already optimised elements from there
    and the general look &amp; feel that took me quite a lot of time to arrive at.<p>Also
    lots of props to Opus 5.5 - it was incredibly good at getting the right game play
    feel from the start. Some of the quirks it came up with were actually quite funny
    (try swimming, it&#x27;s annoying but cute). Ironically I suggest trying dropping
    large prompts that might be even slightly too vague. The first version of the
    pterodactyl was literally me saying something like &quot;let&#x27;s drop a pterodactyl
    there guarding an atomic bomb&quot;. It came up with a pretty good version of
    it which then I have later calibrated.<p>All together, it felt much more like
    an art direction task than a technical one (and I&#x27;ve been programming since
    I was 12).
