article:
  url: https://discourse.imfreedom.org/t/pidgin-3-0-alpha-4-2-98-0-has-been-released/445
  title: Pidgin 3.0 Alpha 4 2.98.0 has been released! - Pidgin - Instant Messaging
    Freedom's Discourse
  fetch_status: success
  content: "# [Pidgin 3.0 Alpha 4 2.98.0 has been released!](/t/pidgin-3-0-alpha-4-2-98-0-has-been-released/445)\n\n[Applications](/c/applications/31)[Pidgin](/c/applications/pidgin/5)\n\n[release](https://discourse.imfreedom.org/tag/release)\n\n[grim](https://discourse.imfreedom.org/u/grim)1\n\nWe
    are ecstatic to announce that we have released the fourth **alpha** version of
    Pidgin 3.0!!! This release has an official version number of 2.98.0. We will continue
    releasing in this fashion until we are ready for 3.0.0 which will be the release
    we consider ready for end users. You can read more about our development phases
    [here](http://imfreedom.discourse.group/t/pidgin-3-development-phases/369).\n\nThe
    release can be found on [Fastly](https://fastly.imfreedom.org/Pidgin3/2.98.0/)
    but is also available on [SourceForge](https://sourceforge.net/projects/pidgin/files/Pidgin3/2.98.0/).
    It will show up on [Flathub Beta](https://docs.flathub.org/docs/for-users/installation)
    after awhile.\n\nIf you don’t want to use the [Flathub](https://flathub.org/)
    Beta method, there are build instructions in the `README.md` for building a [Flatpak](https://flatpak.org/)
    locally or installing into a [meson devenv](https://mesonbuild.com/Commands.html#devenv).
    Both methods avoid installing directly to your Operating System installation which
    is the preferred method as there is no easy way to uninstall the application at
    this time.\n\n# About\n\nJust like the previous releases, this is a timed release.
    It is a snapshot of what we currently have and is something we think developers
    and other tinkerers may want to start playing with. But it is **not** meant for
    _end users_.\n\nMost things are not implemented, the user interface has had little
    to no polish, and there are so, so many bugs. As such we are asking packagers
    to please **not package** this for your users at this time as the potential support
    requests will be too much for us to handle.\n\n# Highlights\n\nThis has been a
    much shorter cycle but we still managed to knock quite a few things out!\n\n##
    User Interface Tweaks\n\nWe’ve made a number of tweaks to the user interface this
    release including but not limited to formatting usernames in the contact list
    and the account manager.\n\n[![contact list showing user names in color](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/optimized/1X/248e6940c2d0e9bfba479c1fd0fe45e0af4e1478_2_690x345.png)\ncontact
    list showing user names in color1000×500 52.5 KB\n](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/original/1X/248e6940c2d0e9bfba479c1fd0fe45e0af4e1478.png
    \"contact list showing user names in color\")\n\n[![account manager with the account
    name being colored](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/optimized/1X/839f5344ea621c942e619c1135374ac714726fc4_2_650x500.png)\naccount
    manager with the account name being colored690×530 13.5 KB\n](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/original/1X/839f5344ea621c942e619c1135374ac714726fc4.png
    \"account manager with the account name being colored\")\n\nWe’ve also added a
    default avatar if one is not set. We’re still far from fully supporting avatars,
    but this step was necessary before everything else.\n\n[![a conversation with
    the echo user showing the default avatar](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/optimized/1X/e4ff4e5ec099a8895747259752434a8809996a8d_2_690x345.png)\na
    conversation with the echo user showing the default avatar1000×500 26.3 KB\n](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/original/1X/e4ff4e5ec099a8895747259752434a8809996a8d.png
    \"a conversation with the echo user showing the default avatar\")\n\nI just realized
    that this is actually a bug because the Echo user has an avatar in the contact
    list.. ![:person_facepalming:](https://emoji.discourse-cdn.com/twitter/person_facepalming.png?v=16
    \":person\\_facepalming:\") ![:bug:](https://emoji.discourse-cdn.com/twitter/bug.png?v=16
    \":bug:\")\n\nAlso we fixed searching in the preferences which is very handy!\n\n[![preferences
    being searched for the string idle](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/optimized/1X/ada358cede7702409adb6855527a00e0c45d6d62_2_650x500.png)\npreferences
    being searched for the string idle690×530 15.9 KB\n](https://canada1.discourse-cdn.com/flex007/uploads/imfreedom/original/1X/ada358cede7702409adb6855527a00e0c45d6d62.png
    \"preferences being searched for the string idle\")\n\n## IRCv3\n\nNow that account
    setting strings can have multiple lines, we finally added an often requested feature
    of a list of commands to run after connecting to an IRC server, but before any
    channels are joined. We didn’t get to the user interface part of this yet, but
    were able to test by manually setting the account setting.\n\nThis is useful for
    setting user modes, maybe identifying to `nickserv`, and so on. But sensitive
    information should be avoid for now as it’ll be stored in the clear.\n\n## soju\n\nWe
    created a new protocol plugin named soju that implements the `soju.im/bouncer-networks`
    specification from the [soju IRC bouncer](https://soju.im). This protocol plugin
    connects to the “bouncer network” of a soju bouncer and then discovers your upstream
    connections and create them as IRCv3 accounts in Pidgin and routes them through
    your soju bouncer.\n\nThis also led to us starting to add properties to accounts
    to keep track of who is managing them. This will most likely make the managed
    accounts read-only, but that could change. We’re also hoping that this management
    API will make it easy to integrate with [GNOME Accounts](https://help.gnome.org/gnome-help/accounts-whyadd.html)
    to help get users started more easily.\n\n## Maintenance\n\nWe also did a lot
    of random maintenance this release. Nothing too interesting. However, we did start
    working out the API to handle threads so we can support Zulip channels and in
    the process realized we could use it for conversation folders and even conversation
    spaces (groups of conversations), so those will be getting worked on in the near
    future!\n\n# ChangeLog\n\nThe full list of change can be found below.\n\nFull
    ChangeLog\n- Purple: Add Account:managed and Account:managed-by properties  \nGary
    Kramlich, RR 4835, PIDGIN-18202\n- Purple: Add collection and space conversation
    types  \nGary Kramlich, RR 4842, PIDGIN-18194\n- Purple: Create Purple.Conversations
    \ \nGary Kramlich, RR 4843, PIDGIN-18195\n- Pidgin: Rework ConversationMember
    to only display the badges and name  \nGary Kramlich, RR 4844\n- Pidgin: color
    names in the contact list  \nGary Kramlich, RR 4845\n- Purple: Clean up ConversationMember
    \ \nGary Kramlich, RR 4846\n- Purple: Use a signal group to monitor the ContactInfo
    in ConversationMember  \nGary Kramlich, RR 4847\n- Purple: Migrate ConversationMembers
    to use GSignalGroup  \nGary Kramlich, RR 4849\n- Purple: Add a color-for-display
    property to ConversationMember  \nGary Kramlich, RR 4848, PIDGIN-18205\n- Purple:
    Clean up Person  \nGary Kramlich, RR 4850\n- Purple: Use GObject.SignalGroup for
    managing signals on ContactInfo in Person  \nGary Kramlich, RR 4851\n- Purple:
    Add a children property to Conversation  \nGary Kramlich, RR 4852, PIDGIN-18196\n-
    Purple: Add a multiline property to AccountSettingString  \nGary Kramlich, RR
    4853\n- Soju: The start of the Soju protocol plugin  \nGary Kramlich, RR 4856\n-
    IRCv3: Add an account setting for startup commands  \nGary Kramlich, RR 4854\n-
    Purple: Add support for Account:managed-by to AccountManagerSeagullBackend  \nGary
    Kramlich, RR 4857, PIDGIN-18203\n- Pidgin: Strip down Avatar and use a default
    image for everything  \nGary Kramlich, RR 4858\n- Pidgin: Add an image property
    to Avatar and wire everything up to it  \nGary Kramlich, RR 4859\n- Pidgin: Clean
    up the contact list a bit  \nGary Kramlich, RR 4860\n- Soju: Implement basic connecting
    \ \nGary Kramlich, RR 4861\n- Pidgin: make preferences searchable again  \nMarkus
    Fischer, RR 4866, PIDGIN-18204\n- General: Update our branding colors  \nGary
    Kramlich, RR 4870\n- Purple: add Account:color and Account:color-for-display propertie"
