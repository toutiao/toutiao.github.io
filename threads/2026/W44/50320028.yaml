  author: ACCount39
  text: Human languages are massively redundant specifically to enable this kind of
    &quot;fill the gaps&quot; learning process.<p>Observe an unknown word used a few
    times in different contexts, and you&#x27;ll get a very good bead on what it means.<p>It&#x27;s
    the &quot;natural&quot; way of learning a language. No one gets every word explained
    to them in detail - most words you know in your own first language are the ones
    you picked up on the go.<p>I think this &quot;structural redundancy&quot; might
    be a big part of what enables LLMs to learn human languages &quot;from nothing&quot;.
