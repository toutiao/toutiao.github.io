  author: motionlessveloc
  text: One nuance not mentioned in the blog is that this particular &quot;without&quot;
    is expressed with the archaic negative verb conjugation -zu (ず). It lives on in
    set phrases and literary use, but it&#x27;s not usable without a verb to negate
    (you can&#x27;t say &quot;pan-zu ikiru&quot; for &quot;live without bread&quot;)
    and it&#x27;s going to sound pretty weird if you try to use it for quotidian things
    like &quot;live without eating bread&quot; (pan tabezu ikiru).
