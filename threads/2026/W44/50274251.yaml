    not the OS.<p>Somethings I have routinely encountered in recent years, reviewing
    this stuff, are:<p>[1] When I report something that went wrong, xBSD users are
    very quick to castigate me, call me a liar, tell me I am incompetent, that things
    are fake news, etc.<p>[2] When I bother to chase things down, talk to the developers,
    etc. then they confirm that what I found was real, correct, and true -- but they
    never thought anybody would do that stuff.<p>It shocked the FreeBSD folks that
    VirtualBox <i>defaults</i> to BIOS firmware in 2025... and it labels UEFI as &quot;experimental&quot;.
    What I said was correct: FreeBSD cannot readily boot from ZFS on MBR on a BIOS
    system. And no, it is not documented. They didn&#x27;t think anyone would try,
