  author: craftkiller
  text: "&gt; A fully static binary can run in `FROM scratch`.<p>Not just `FROM scratch`
    but also in other contexts. For example:<p>I wrote my own password manager which
    lives on a USB drive. Since I compiled a static binary, I can execute it on any
    Linux machine.<p>Running static binaries in FreeBSD&#x27;s Linuxulator is easier.
    The Linuxulator is a separate set of syscalls that get used when you attempt to
    run a Linux binary, so a static binary will &quot;just work&quot; for the most
    part (unless the program needs special filesystems like &#x2F;proc or &#x2F;sys).
    A dynamically linked binary means I need to make sure I have any necessary Linux
    libraries in the proper location and the Linuxulator&#x27;s `ld` working properly.
    Updates to these libraries can then make something that used to work, suddenly
    stop working. Certainly not an insurmountable task, but there&#x27;s so many fewer
    places where things can break when you&#x27;re just running a static binary."
  score: 0
