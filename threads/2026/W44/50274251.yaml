  author: Intralexical
  text: |-
    Alpine Linux is not statically linked. It provides a musl environment which makes it easy to statically link your own builds, but software shipped as part of the distro is usually dynamically linked.<p><pre><code>  $ docker run -it --rm alpine

      &#x2F; # apk add cmd:ldd
      &#x2F; # ldd $(which ash)
              &#x2F;lib&#x2F;ld-musl-x86_64.so.1 (0x7f4cb4d1d000)
              libc.musl-x86_64.so.1 =&gt; &#x2F;lib&#x2F;ld-musl-x86_64.so.1 (0x7f4cb4d1d000)

      &#x2F; # apk add cmd:python3
      &#x2F; # ldd $(which python3)
              &#x2F;lib&#x2F;ld-musl-x86_64.so.1 (0x7fd630cab000)
              libpython3.12.so.1.0 =&gt; &#x2F;usr&#x2F;lib&#x2F;libpython3.12.so.1.0 (0x7fd63069a000)
              libc.musl-x86_64.so.1 =&gt; &#x2F;lib&#x2F;ld-musl-x86_64.so.1 (0x7fd630cab000)</code></pre>
