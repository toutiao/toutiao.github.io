  author: iamnothere
  text: Interesting to watch the rapid fragmentation of FOSS into “hard” anti-AI,
    AI-neutral-to-discouraged, AI-supplemented, and AI-driven camps, akin to the early
    GPL vs BSD wars. Suddenly I don’t see as many complaints about licensing, and
    some of the die-hard GPL stans are silently dropping that position as Linux adopts
    AI-supplemented development.<p>On one hand it’s unfortunate, because it hypothetically
    dilutes developer efforts, but on the other hand the most extreme groups already
    had incompatible personalities and weren’t working well together. This self-sorting
    may actually result in a better cadence and less energy wasted on arguing.<p>The
    downside is that a lot of loud and annoying people seem to be converging on BSD
    land. I am AI-nonaligned (I just care about Quality) but I’m very much in favor
    of OpenBSD’s heads-down focused dev culture. I hope that doesn’t change.
