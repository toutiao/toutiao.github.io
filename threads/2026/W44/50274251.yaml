  text: |-
    AI causes massive environmental harm in a time where ecosystems and the climate are already under severe stress.<p>We also see a lot of AI-based pull requests to open source projects that completely overwhelm maintainers. Bug bounty programs have already been canceled to remove the incentive to bombard maintainers with alleged security issues. AI is harmful for small libre and open source projects.<p>AI is forced on people because of capitalist incentives. People who care about their craft are labeled as old-fashioned, because they do not like to use AI. Even if the end product (the software) is as good as the GGP comment wishes, the way the software was produced might have been a very joyless process, because AI was doing all the fun work.<p>AI in programming also leads to deskilling and makes it less likely that junior programmers become as good as the current senior programmers. This might lead to a software quality crisis in the future. And in the meantime AIs will run dry of new high-quality learning material.<p>Free software licenses are based on copyright. These licenses are supposed to protect the freedoms of the end user (because that&#x27;s the ethical thing to do). However, the situation with AI-generated output and copyright is far from clear: <a href="https:&#x2F;&#x2F;constitutioncenter.org&#x2F;blog&#x2F;supreme-court-denies-artificial-intelligence-authorship-claim-for-artwork-copyright" rel="nofollow">https:&#x2F;&#x2F;constitutioncenter.org&#x2F;blog&#x2F;supreme-court-denies-art...</a>
