  author: spijdar
  text: 'The BSDs do have <i>comparatively</i> miserable contributor experiences,
    though I understand why. At least from my very, very limited exposure.<p>Several
    years ago now, I ran into a problem with playing audio on NetBSD&#x2F;sparc. I
    had an RDI PowerLite laptop, which is 80% of a SPARCstation 5 clone stuffed into
    a laptop chassis. Part of the 20% different was the audio chip, which was the
    same AMD ISDN chip used in the SPARCstation 1&#x2F;2, doing mu-law audio.<p>Whenever
    I&#x27;d play audio, the laptop would instantly reset. Huh. That&#x27;s weird.
    I ended up figuring out that someone had recently massively overhauled the audio
    driver subsystem in the kernel, and basically the relevant audio driver was missing
    some mutex operation, and an assert() was panic&#x27;ing the kernel.<p>For a non
    SMP system, the lock wasn&#x27;t necessary (IIRC) but the new code was being more
    rigorous and causing a kernel panic.<p>The patch was pretty easy, just adding
    a few locks&#x2F;unlocks. But I could never figure out what I was supposed to
    do with the patch after.<p>I&#x27;m probably just stupid. I don&#x27;t want to
    imply there&#x27;s no path to do this, I just never figured it out. I didn&#x27;t
    try for long either, since getting 8-bit mu law audio working was just something
    goofy I was doing for fun.<p>But for comparison, when I found a bug in the signal
    handler for 32-bit PowerPC, my memory was that it was pretty straightforward to
    produce a patch: find the relevant maintainer, open a dialogue, and eventually
    submit a patch: <a href="https:&#x2F;&#x2F;marc.info&#x2F;?l=linuxppc-embedded&amp;m=160963760120837"
    rel="nofollow">https:&#x2F;&#x2F;marc.info&#x2F;?l=linuxppc-embedded&amp;m=160963760120837</a><p>Neither
    fix was ultimately very important, and neither would have impacted more than a
    couple dozen people on the entire planet. But Linux got a patch, while NetBSD
    didn&#x27;t...'
