  text: Three good reasons to care about inequality itself:<p>1. Outsized political
    influence (in theory can be mitigated by laws controlling corporate spending,
    but obviously <i>those laws themselves</i> are subject to manipulation by the
    rich and powerful)<p>2. Distortion in who the economy serves. The beauty of capitalism
    is that it&#x27;s a problem-detection and problem-solving system. If a narrow
    set of people have a huge portion of money, the economy becomes unduly optimized
    toward satisfying <i>their</i> wants and needs.<p>3. Despite best efforts, we
    ultimately must share a lot of the same commons. Even being a billionaire in NYC
    or San Francisco can&#x27;t <i>really</i> give you a walk to work or your child&#x27;s
    school that feels as safe as it does in a more equal society that takes better
    care of its unwell and poor.
