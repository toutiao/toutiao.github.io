  text: |-
    Phorge is delightful. I occasionally spin it up from time to time, but can't seem to quite commit to it.
    The main wall I usually run into is Arcanist. I don't like it's installation method. I don't like how it's written in PHP (since PHP isn't a language I usually program in, and don't like having it installed as a result). I don't like that it doesn't have a "clean" binary installation, but that the official docs recommend clobbering the PATH (meaning that moving it is annoying). It's a lot of small things that really add up and ultimately make me not want to use it. For their shortcomings, git forges rarely depend on tools outside of git to work (ie. I can count the times to this day I've used gh on one hand.)
    Other than that, it's just a really good project management system, and I do wish it was used more.
