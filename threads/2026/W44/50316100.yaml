    Presumably a few of these things weren&#x27;t being done -- I&#x27;d bet 1 &amp; 2 were skipped or implemented so poorly that they were worse than having no tests at all -- checking nothing but giving a false illusion that some kind of testing had happened.<p>Five years ago, outsourcing your software development (including QA) to the lowest bidder might have gotten you results like this -- if you didn&#x27;t explicitly require automated tests as a deliverable, you wouldn&#x27;t get any, or if you got some they&#x27;d be vacuous and not test anything.
