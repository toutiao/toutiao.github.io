  author: the_duke
  text: Brutal!<p>&gt; ParticleDB 1.1.4 claimed to be a Postgres-compatible database
    ... Instead, we found a library of confusion<p>&gt; exhibited frequent, profound
    transactional anomalies in essentially every way we could measure. We routinely
    observed the loss of committed writes, internal consistency violations, G1a (Aborted
    Read), G1b (Intermediate Read), and P4 (Lost Update). In the append workload,
    successfully appended values would routinely disappear from later reads of a given
    key. Our test suite inferred every kind of cyclic anomaly including G0, G1c, G-Single,
    and G2-item, but many of these can be attributed to more basic issues, like write
    loss. These issues occurred with a single server and without faults, and affected
    every transaction mode, interface, and WAL mode tested
