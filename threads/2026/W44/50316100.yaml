  text: |-
    <p><pre><code>  &gt; WHERE column = NULL and then query WHERE column &lt;&gt; NULL
    </code></pre>
    With respect, your statement seems to indicate that you simply haven’t heard of or don’t understand the three-valued-logic semantics behind SQL.<p>NULL means what it means and is conceptually foundational to SQL. Comparing it to anything returns UNKNOWN, the “third value” besides true and false. And WHERE needs a TRUE predicate. So your implied fault that they “have no problem“ really is just a matter of you not understanding the tool you are complaining about.<p>To match against the NULLness of a value you must use special purpose operators. In this case<p><pre><code>   WHERE column IS NULL OR column IS NOT NULL</code></pre>
