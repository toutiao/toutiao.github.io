  text: "&gt;  We now run sustained Jepsen workloads daily alongside our own test
    suites.<p>Why would anyone believe you when you say this? From the report:<p>&quot;Orkes
    said they ran Jepsen’s existing Postgres test harness to find and resolve issues
    in ParticleDB prior to this work. However, that same test harness failed immediately
    when run against ParticleDB 1.1.4. Orkes also stated they tested ParticleDB with
    SQLancer, which generates far more complex queries than the ones we tested. It
    is therefore perplexing that nearly every feature we tested exhibited glaring
    errors, and that our findings seemed to come as a surprise.<p>Most databases have
    a test suite which exercises at least basic examples of each feature, and it is
    customary to run those tests before release, if not continuously. Where were those
    tests for ParticleDB? How does one add support for NOT NULL constraints without
    a test which tries to insert at least one NULL value? What development process
    adds a CHARACTER(10) type without trying to write a string of (e.g.) five characters?<p>Our
    findings suggest structural deficiencies in the ParticleDB QA process. Perhaps
    tests were not run prior to release. Perhaps the test suite was run, but failed
    to exercise basic functionality. Perhaps engineers entrusted Large Language Models
    with the work of testing.&quot;"
