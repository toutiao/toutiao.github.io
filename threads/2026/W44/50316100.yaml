  author: amluto
  text: I’ve come to learn an interesting dichotomy in software:<p>Some software is
    correct by construction, in the sense that the overall design makes sense and
    the cases that don’t work are generally local bugs.<p>Some software is incorrect
    by construction, and it tends to work by some combination of luck and by carefully
    working around the incorrect design in most or all code paths that could expose
    the incorrectness.  (AI can be quite effective at finding the relevant places
    to insert workarounds.)<p>ParticleDB sounds like the latter category.  Plenty
    of large projects have portions that are in one category and portions that are
    in another.<p>As an aside, for the last day or two, I’ve been contemplating that
    the Linux kernel’s handling of folio pinning seems to be in the incorrect-by-construction
    category. Good times.  No, I haven’t found a hard-to-fix bug that I would credibly
    characterize as a security or likely accidental corruption issue [0], but this
    seems mostly like luck.<p>[0] I do appear to have re-discovered a bug that some
    massive Anthropic dump from a couple months ago also found, and it’s getting fixed.  If
    your application does “fixed” io_uring I&#x2F;O or certain types of iommu-based
    or maybe RDMA on a memfd, you might plausibly encounter it on rare occasions.
    I didn’t bother making a reproducer.
