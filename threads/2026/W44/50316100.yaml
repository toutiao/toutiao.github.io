  author: nikez96
  text: I&#x27;m part of the ParticleDB team. We took these findings seriously and
    have spent the past few months addressing them and strengthening our testing.
    We now run sustained Jepsen workloads daily alongside our own test suites. We&#x27;ve
    also narrowed the supported transaction modes to focus development and testing
    on core correctness.<p>Our recent Jepsen runs have not surfaced any transactional
    anomalies in the supported modes that provide isolation guarantees. We&#x27;ve
    also fixed the issues highlighted in the report through newer releases, along
    with additional issues we identified through our testing. We&#x27;re expanding
    regression coverage to catch issues earlier, before release. We&#x27;ve also introduced
    agentic testing to explore additional edge cases that traditional test suites
    might miss. This work has helped guide our development and testing, and we&#x27;re
    working on benchmarking now as well.
