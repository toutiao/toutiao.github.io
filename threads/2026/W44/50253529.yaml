  text: 'being able to transfer HANDLEs across the 16&#x2F;32-bit boundary notably
    for COM&#x2F;OLE integration becomes a lot more painful<p>Microsoft says at <a
    href="https:&#x2F;&#x2F;learn.microsoft.com&#x2F;en-us&#x2F;windows&#x2F;win32&#x2F;winprog64&#x2F;running-32-bit-applications"
