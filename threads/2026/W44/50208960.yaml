  author: samatman
  text: "&gt; <i>Maybe someday we&#x27;ll live in a world where sticking a person&#x27;s
    name at the top of a book doesn&#x27;t carry the implication that they wrote the
    words in the book</i>.<p>Not even an AI thing, we don&#x27;t. Ghost writing has
    been going on for centuries.<p>I don&#x27;t like that! I agree it&#x27;s dishonest
    and I wish we lived in a world where having been exposed employing a ghostwriter
    is a disgrace no public figure can come back from. I don&#x27;t like that AI has
    made it worse, either. At least with ghost writing there are some contexts (politicians,
    celebrity bios) where you might suspect it, but in most you won&#x27;t.<p>But,
    we do live in that world right now."
