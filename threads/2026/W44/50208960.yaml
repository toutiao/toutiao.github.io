    once I get away from the distaste for load-bearing or a comment mentioning &quot;spine&quot;
    -- is that if the idea pushes me forward, challenges me towards improving, or
    otherwise informs, I&#x27;m okay with AI assisted writing.<p>I&#x27;m not okay
    with formulaic garbled nonsense, that annoys me!
