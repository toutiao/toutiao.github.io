  author: basil
  text: 'I’ve been using graph theory for years professionally. A good example of
    practical uses of graph theory is any routing software. It is basically graphs
    all the way down.<p>For starters the whole street network is represented as a
    directed graph. The most widely used algorithm is the venerable A* to find paths
    through the vertices of the graph, not necessarily the shortest distance but the
    most optimal distance given all the trade-offs you wish based on the heuristics
    you define. There are lots of variations of A* and today most implementations
    would use its faster cousin: bidirectional A* which attacks the point-to-point
    calculation from both ends at the same time.<p>Then you have Dijkstra which is
    used for flood searches to e.g. give the best cost back home from every vertex
    so you know when to turn back the search if you have a search budget.<p>Menger’s
    theorem I’ve used in order to determine whether we can create a loop back. Basically
    search outwards, then search back without visiting those same edges.<p>Tarjan
    to ensure we identify all subnetworks so we don’t get stuck in a disconnected
    island of vertices with no way out to join the wider network.<p>A lot of these
    algorithms were conceived decades ago and are still the backbone of modern routing
    software.<p>One thing that’s constantly been in the back of my mind is, since
    routing is a highly deterministic problem space, it doesn&#x27;t seem plausible
    that LLMs can take this over. It seems to me that it&#x27;s a good example of
    a tool that LLMs would call out to rather than implement themselves.<p>In fact,
    see this convo I had with @simonw wherein he had Astra generate a jogging route.
    It setup a whole GIS stack and took about half an hour. That seems like a boil
    the ocean kind of approach and I’m not sure if that’s ever going to be optimal.
    <a href="https:&#x2F;&#x2F;x.com&#x2F;baz_shkara&#x2F;status&#x2F;2099118620647305630"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;baz_shkara&#x2F;status&#x2F;2099118620647305630</a>'
