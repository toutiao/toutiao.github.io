  text: |-
    Spam email is not something that can be fixed by only technical means.
    Most of the problem arises from the economic structure of the protocol, in the broad sense of security economics: i.e. who is participating in the protocol and what their relationships are, in terms of contracts, payments, or the lack thereof. There’s also a macroeconomic version of Conway’s law (which I think is due to David Clark) which observes that an open protocol defines an interface between businesses that operate that protocol as a service, so when you are designing a protocol you need to keep that in mind because it determines who ultimately bears the costs.
    The difficulty with spam is due to some of the basic attributes of email:

    There’s no postage fee for last-mile delivery (unlike telephone or paper mail, where some of the money that the sender pays their provider is passed on to the recipient’s provider).
    Like phones and post, you don’t need any prior contact with a recipient to send them a message: it’s enough to read their address from a business card or an ad on the side of a bus.
    There’s no central authority that can enforce any rules on the system as a whole.
    It’s easy to join in by getting an internet connection and a domain name.

    It’s common for techies to want to fix spam by improving sender authentication (that’s the whole point of SPF and DKIM) but it’s still easy for spammers to mint new identities, so spam continues.
    The upshot is that anti-spam is mostly about reputation management. Receivers keep track of sender reputations and use that as a major signal for classifying spam; and senders police their customers to avoid damaging their reputation. Senders for this purpose can be identified by IP address as well as domain name or email address. That basic structure has been the same since Paul Vixie introduced the RBL, years before SPF and DKIM came along.
    Much of the cost of sending email is to pay for that policing effort. Some of the cost is also to discourage the bottom-feeding spammers who rely on nearly-free sending to cope with a very low response rate. But there’s a somewhat delicate balance on setting the cost of email: it isn’t possible to make it too expensive for spammers but still affordable for legitimate senders. (Observe the ratio of paper junk mail to legit post that comes through your letter box.)
