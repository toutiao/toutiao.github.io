    I think basically all of the technical deficiencies of email can in principle be fixed by evolving the current system. I’ve ranted about this here before but the main reason for problems like shitty underspecified html is that the large email providers aren’t working with each other to improve things. (I suppose there are some things that have changed, such as DMARC and transport security, but they don’t have much positive effect on the way users perceive email.) And without a commitment to migrate the majority of email users to something better, all you have is yet another niche chat system, of which there have already been dozens.
    Which is why it’s important to consider protocol economics when designing a replacement for email: there must be positive incentives in favour of adoption as well as negative incentives against abuse.
