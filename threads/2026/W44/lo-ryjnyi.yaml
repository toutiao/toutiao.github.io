  text: |-
    From a technical perspective, [SMTP submission] is essentially the same as sending an HTTPS request.

    It is not, and treating it this way will get your emails dropped. Email is fundamentally a store-and-forward system, and the protocol requires that you be able to do exponential backoff for delivery. That requires a persistent queue, for which there is no built-in analogue in HTTP, and it also makes the operation fundamentally asynchronous. HTTP, by contrast, is full of synchronous use-cases; most endpoints in most RESTish APIs are synchronous.
    At minimum, this will get your emails dropped if the destination server goes down e.g. for maintenance or an outage and relies on senders doing standards-compliant retries. But some providers will always drop your mail as spam, because of greylisting.
