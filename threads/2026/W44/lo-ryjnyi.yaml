    Nah, this is a problem with selfhosting personal correspondence too.
    The real hint is in that line about IP blocks. Probably the biggest problem to selfhosting your emails is that a lot of spamlist providers can be... obnoxiously cautious when it comes to spam. If someone in your /24 block is spamming (and most servers people will have access to are on rented IPs from providers like Hetzner/Linode - they aren't registered ASNs), most spamlist providers will typically just end up blocking the entire /24, and then anyone that wants to get fished out of the block can send an email to the provider.
    The most frustrating culprit isn't really Google or Microsoft though - those 2 are generally pretty amenable to selfhosting as long as it's just personal correspondence. Their domain reputation system does unfairly harm any company with a newsletter/a password reset email system (basically any email that after being read is discarded to trash rather than archived), but if all you're doing is actual mail, it's not a problem.
    The real problem is iCloud. Apple doesn't seem to actually have a domain reputation system, they just rely on public providers. It's been a few years, but delivery to iCloud is nigh impossible because at least one of their providers pretty much takes a "if we catch you, you're never getting out loser" approach to spam. As in, the entire appeals page is just a big red text that says "if you don't want to end up on our list, stop spamming" and no forms. It's not one of the common ones like Spamhaus, but for some reason Apple's rejection emails make it clear that you've ended up on that one and that apparently, Apple is following it.
    That's why it's expensive to send mail, even as a normal human. You're basically taking on the burden to monitor spam filters for a living, and sometimes may need to accept that your IP address is completely unusable forever due to reasons you can't really control. It's the tragedy of the commons; what's intended to be an easily accessible universal means of communication no longer is because a bunch of bad actors are abusing it, so to stop the abuse, mail becomes less accessible.
    Source: used to host email myself for ~5 years. Nowadays I just pay fastmail and they take care of it. The constant sysadmin burden isn't worth the headache.
