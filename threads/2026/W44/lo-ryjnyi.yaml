    I pay $4.20/month for the VM that hosts my outgoing mail server.  It's used by me and a few other people for a handful of domains.  I haven't had any problems reported with mail delivery for ages, but I've also been using the same domain for around 20 years and that domain has built reputation.  Being an outgoing mail server uses less than 1% of the power of that VM, so having an IP address that's able to send a bunch of email is fine.  My provider retains a fairly good reputation for the IP block because their policy is that outbound port 25 is blocked by default, you have to request that it is unblocked, and they'll block it again if you are reported for sending spam.
    I suspect that people like SendGrid exist because of the problem that I recall hearing from someone who ran anti-spam things for Yahoo! Mail back in the day: a lot of users find it easier to hit 'spam' than 'unsubscribe'.  If someone actually did sign up for a mailing list but forgot or doesn't want it anymore, they'll often just mark the messages as spam and not bother to unsubscribe.  In a big mail provider, spam filtering is shared to a reasonable degree between users, so if 20% of people who ever subscribed to your mailing start marking it as spam then you'll start to find that your mails are marked as spam for everyone.
    I am a bit skeptical about companies like SendGrid for this reason: they seem to exist to do reputation laundering.  If you send your emails with them, they'll send them from a set of IPs that sends so many emails that it's hard for big mail providers to block them and so that their spam:ham ratio is maybe not too high.
