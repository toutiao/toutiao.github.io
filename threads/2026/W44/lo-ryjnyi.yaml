    There are two kinds of people who self-host email. People who say the above, and people who no longer self-host email because their emails don't arrive. Which group you belong to is half skill (getting DMARC, DKIM, SPF and email headers right, trawling through all the blacklists to get yourself unblacklisted) and half luck. Tomorrow, Google might change their spam filter and your emails now go straight to junk. You may never realize that your answer to the life changing job offer never arrived and you missed the window of opportunity.
