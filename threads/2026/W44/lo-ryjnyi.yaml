  text: |-
    Telephones, Email, Signal, and ActivityPub have the same root problem: they conflate identifiers with capabilities.

    Applying CHERI's principles to messaging, I love it. I'm not sure how that would work in practice though? My first guess would be around signatures.
    In a synchronous always online system it's easy, Alice just record Bob in her contacts, and when Bob makes a connection she sends a challenge for Bob to sign, and if it all check out she will accept the message. Possible problem: Bob's capability is stored on Alice's end. That makes it easy to revoke, but also easy to lose accidentally through no fault from Bob.
    First question would be, where should we store capabilities? I see advantages and drawbacks whether it's on Alice's or Bob's machines.
    In a fully asynchronous setting where the only viable option is to send and forget, I can imagine Alice signing a message like "Bob[bob-pk]->Alice--until-01/01/2028", and when Bob sends a message (with a proof that it came from him), appending Alice's certificate lets the message through.
    Or it could be something derived from a key exchange, but I hear key exchange is over, that with Google cracking discrete logarithm any day now. Or it could be a shared secret, but I don't see that working if leaks are a serious threat.
    Do you have some more details, or pointers?
