    It is not just „old and goofy“. There is some purpose and thought behind it.
    The conversational character of the SMTP protocol makes perfect sense. You will not send e-mail data if the recipient mailbox does not exist, or if the attachment is larger than given server accepts. Why send several megabytes and then realize that it is over the limit? Why send message in an unsupported encoding? Semantics of a single request-response does not fit everywhere. (or you can see SMTP as a sequence of several requests and responses coupled together in a session).
    And those „randomly“ disappearing e-mails that can not even be found in the spam folder? When I used to be a postmaster, it was a matter of honor to deliver every message and not miss anything. The suspect spam was just flagged and it was up to the user configurable filters to put it in the appropriate folder. We were essentially peer to peer and each of us was interested in making sure it worked reliably. Today, it is different. There are several global corporations and they would prefer it if everyone else would just disappear. These corporations can not simply nuke smaller providers or suddenly stop accepting their messages, but can make them look unreliable in the eyes of users.
