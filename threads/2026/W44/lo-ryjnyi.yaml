    I suspect it's popularity.  I didn't get any spam on Signal until it got close to 100M users.  Now I do and they spend a lot of time trying to block it.
    Telephones, Email, Signal, and ActivityPub have the same root problem: they conflate identifiers with capabilities.  If you know someone's identity (email address, ActivityPub address, Signal username or phone number) then you can connect to them.  There is no way to give someone a capability that allows them to authorise a single sender to contact you but not a second one, for example.  That alone would address a huge amount of spam (irrespective of underlying protocol) because I would be able to give a company a capability that let them add a connection to me, but didn't allow anyone else to use the capability a second time.  If their contacts are breached, today they get a list of identifiers and these work as capabilities that allow their botnet to send spam.  If they got single-use capabilities then the breach would leak keys that allow DKIM-signed email associated with a specific sender to send spam, and this would not be useful for spamming the customers.
