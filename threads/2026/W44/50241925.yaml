  author: whacked_new
  text: 'I agree, it&#x27;s an awesome concept in principle (and Girba is graciously
    welcoming people in discord). Working with an agent in GT, the agent will just
    look at the data and figure out how to express it in the graphical framework.<p>But
    in practicality, at least at this point, bb wins out by sheer expansiveness of
    ecosystem. I was working on a mishmash of an editor interface that combined obsidian
    with heptabase, directly in GT. It kind of worked. And the amazing thing is, everything
    has just a single representation: window positions displayed as text automatically
    have 2 way bindings across widgets, because they are the same data. But even with
    agents doing everything, 2 things creep up.<p>First is in JS&#x2F;TS, all these
    binding problems are solved 1000x already. You can fake shared memory with callbacks
    and the agent won&#x27;t lose track. In GT you move the cursor around, and have
    to decide at what point do you convert a widget representation to source representation,
    and when to restore the widget: is it a delay? is it after changing lines? is
    it after you move off the text? before or after the whitespace? There&#x27;s a
    package for that somewhere in npm that answered all these questions, and it has
    tables, and it&#x27;s performant. It doesn&#x27;t do the 2% stuff that GT does
    using its magical shared memory representation (which also makes TS-&gt;smalltalk
    porting not straightforward), but you can still tape over it with sheer optimized
    code.<p>The second thing is that GT got really slow with all the data structure
    re-interpreting and rerendering. As &quot;dirty&quot; as bb is in reloading dynamic
    code, the runtimes are so optimized, I wanted the markdown nodes to be GPU-accelerated
    in bb, and it turns out they already were.'
  score: 0
