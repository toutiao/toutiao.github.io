  author: roadside_picnic
  text: For me it&#x27;s been liberating because I no longer have to worry about what
    languages I choose to spend my free time on at the risk of missing out on something
    more practical. For example, I love Common Lisp, but taking time relearn it always
    felt to come at the expense of something else that might also confer practical
    benefit. Now, in a sense, all programming languages are equally useless.<p>I recently
    did a major move and had to restructure my bookshelf pretty dramatically. The
    only programming books I kept out of storage where the Common Lisp and Prolog
    ones. Spending time learning a language that doesn&#x27;t directly impact how
    you think about computation itself seems to be more of misuse of time (of course
    really, when programming truly for fun it shouldn&#x27;t matter one way or the
    other).
