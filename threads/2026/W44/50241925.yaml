  author: travisgriggs
  text: I think this was once the case. Smalltalk was very &quot;so last year&quot;
    once Java Marketing overtook the world (I worked for Cincom, final resting place
    of VisualWorks Smalltalk, may it rest in peace).<p>At this point, I think it&#x27;s
    flipped. The people that might be attracted to it would probably enjoy the retro
    hat tip. The various language wars have all been pointlessly adjudicated, and
    lost in time, first to the dominance&#x2F;explosion of JavaScript only programmers,
    and now due to LLM generated code.<p>Learning Smalltalk, and practicing it heavily
    for 20 years was probably the single best thing I learned in programming during
    35+ years. It helped me get very good at modelling things. I work in Swift&#x2F;Kotlin&#x2F;Elixir&#x2F;C
    now days, and I&#x27;ve learned some great things from those systems as well.
    But how to build representations of real world data as well as structure concepts&#x2F;relationships
    more virtual, hands down to Smalltalk (for me).
