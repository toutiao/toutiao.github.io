    One of the great things Emacs carries with it from its AI lab origins, that's rare these days, is the insane level of hackability that comes with Lisp software. Software built in Lisp is often designed to be extensively modified by the user to suit their tastes. This means it's well-documented, inspectable, its primitives can be used in further abstractions, and provides plenty of hooks where behaviour can be inserted. Part of it is also the "orthodox UI paradigm" (best described by Bezroukov1) which is a very powerful way to design user interaction.
    These properties are rare! The only other software I've used with the same level of hackability is StumpWM, a much younger Common Lisp project.
    Users who haven't tried this way of growing/evolving their own software and customising their workflows also have a hard time understanding what it's like, because it's so alien to how software is otherwise used. Well worth experiencing at some point, even if you don't end up using Emacs day-to-day.
