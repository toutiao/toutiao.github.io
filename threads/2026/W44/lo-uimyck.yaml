    Well, congratulations are in order! For a 50 year old and continuously developed piece of software, Emacs has never been in better shape, and there is still nothing like it anywhere out there (in combination of character, scope and popularity).
    These days my only fear is that as computing gets more and more restricted, Emacs (along with other FLOSS) will just be outlawed one way or another, or constricted to be less useful. If it weren't for that fear, I'd confidently say it will survive for another 50 years!
    About a decade ago, core Emacs maintainers were getting a bit worried that most new folks are not willing to touch the C core, making it silently rot away. But then, out of nowhere, we got native comp, json parser, tree sitter, canvas patch. It is truly a multi a generational project at this point.
    And since this comment is all over the place, I'm gonna pitch RUNE. I really really hope it becomes the one to cut that ol' multi-threading tree Gordian knot.
