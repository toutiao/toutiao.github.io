    I think there's a bit of nuance lost in this one. It may look like "Anyway, remember prompt engineering?" is truly a funny dig now... but that's not the whole story. You can still prompt engineer for good results and you need to learn more about how to do it. It's closer to good search skills from before Google became useless.
    For example: what do you expect to give you better results? "Does this app have bugs?" or "In context of this app, what approaches would an experienced software engineer use to validate it works correctly? Make a list ordered by effectiveness-vs-cost and spawn subagents to check the trivial ones. Make a plan for review to run the remaining checks. Check the project history for areas which needed most bug fixing work." The second one requires almost no familiarity with software engineering - and a similar prompt can be derived for other industries.
    But it takes some experience to realise this is possible and how to push the boundaries yourself. We needed the basics of prompt engineering and now we can take it to the next level. It never went away.
