  author: paxy
  text: Online reviews fall into two categories:<p>- I just received this product
    and tried it out. Here&#x27;s what I like or dislike about it.<p>- I&#x27;ve been
    using this product for a while and have this big problem with it.<p>Set 1 will
    give you a decent set of opinions, but they won&#x27;t be about reliability, because
    no one has had it for long enough.<p>Set 2 will be overwhelmingly negative, because
    people who are happy with a product aren&#x27;t posting about it online long after
