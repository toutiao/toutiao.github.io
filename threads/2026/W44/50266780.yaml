  author: jdw64
  text: Rather than taking incompetence for granted, it’s because—as the article also
    says—motivations differ, and it’s difficult to judge factors like warranty handling
    or updates. And fundamentally, “reliability” is broad. That’s even more the case
    for combined hardware-software products. Ultimately, Reddit is basically where
    people with complaints go, and reviewers themselves have bias too, but consumer
    complaints also largely come from people whose products broke, so it’s difficult
    to judge.<p>But ultimately, for reviewers, what matters is that they “make a living
    through reviews,” so they have to say things that fit the fanboy tier they’re
    targeting.<p>The problem is that fanboys are generally people who buy more devices
    to begin with, so they also judge reliability based on the existing product lineup,
    and reviewers are largely the same. As a result, they can’t help but judge mainly
    by new features.<p>To be precise, “reliability” requires predicting the future,
    and that’s not easy. How would you know if your computer might break tomorrow?
    There are serious hinge issues with the iPhone Duo right now—how would people
    buying it have predicted that?<p>Prediction is basically break-even even when
    you’re right, and easy to criticize when you’re wrong, so it’s a hard attribute
    for reviewers to review.
