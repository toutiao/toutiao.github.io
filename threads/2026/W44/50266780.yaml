    not completely awful, but it&#x27;s not exactly awesome either.<p>The less-sane
    way to replace just-the-bulb is from the top.  It seems like it should be faster,
    and it sure does look easier, but it&#x27;s a blind one-handed process with little
    fiddly bits to manipulate.  There&#x27;s not enough room to add a reasonably-stout
    glove to that hand, and there wouldn&#x27;t be enough dexterity and tactile sense
    if there were.  Consequently, there <i>will</i> be blood.  I&#x27;m told that
    it&#x27;s a lot more practical to swap a bulb in-situ with the halogen housings
    (as those don&#x27;t have as much depth to them as the ones for HID), but my Honda
    is not so-endowed.<p>Part of this is because, AFAICT, the headlight assemblies
    are structural.  They tie into several other assemblies and help hold the front
    of the vehicle together.<p>(A pedestrian Buick or Chevrolet from ~20 years ago
    is very different:  To remove a headlight assembly, just lift up on a couple of
    heavy nylon straps and the whole shebang basically just falls out.  It takes seconds.  Reinstallation
    is very nearly as quick.)'
