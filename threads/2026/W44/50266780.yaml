    then you would can have your music and give each a listen in the store and decide
    better than a curve graph.<p>I spent a ton of times reading all the reviews and
    narrowing down the options, but was still between 3 or 4. Ended up driving 45
    minutes to the nearest bestbuy and they had a decent selection. It was amazing
    how quickly I eliminated options and ended up picking one I liked.
