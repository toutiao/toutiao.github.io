  author: bane
  text: 'I&#x27;ve noticed that people seem to also have two working definitions of
    &quot;reliability&quot;.<p>1. &quot;This works as expected to without error or
    repair for longer than expected&quot;<p>2. &quot;This is easy and straightforward
    to repair, so when it breaks the halt in operations is only temporary&quot;<p>I
    don&#x27;t know why people seem to use #2 when it is obviously not the meaning
    of reliability, but some version of it almost inevitably brought up when discussing
    an unreliable technology that somebody still prefers to use over the reliable
    one.<p>This thinking infests everything from computing to cars.<p>&quot;Sure my
    PC crashes all the time, but its a simple reboot and some configuration tweaks
    to get it back online, takes like 30 seconds&quot;<p>&quot;I love my car, the
    service from the repair shop is white glove whenever I bring it in. I&#x27;m usually
    in and out in the same day&quot;<p>&quot;My stand mixer is amazing, I only have
    to 3d print a replacement for the central gear every 10 or 11 loaves of bread
    and it&#x27;s a 30 second swap out to get it working again&quot;<p>&quot;I love
    my new clothes dryer, the maintenance contract gets somebody in within 24 hours
    to get it back online&quot;<p>To the point of the post, <i>very</i> few organizations
    track long-term reliability and repairs for products, even major expensive ones
    like cars and appliances. The segment of consumer who really cares about this
    stuff just isn&#x27;t large enough to make it really viable to do so, and the
    segment of consumers who follow definition #2 undercut them anyways.'
  score: 0
