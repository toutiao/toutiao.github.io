    This may be a bit off-topic, so feel free to ignore it, but these release notes made me think about how security fixes get shipped.
    As far as I can tell, 1.3.1 (March 13) was the last patch release before this one, and its notes don't mention any security fixes. The advisories listed here seem to have been disclosed just before 1.4.0, so I'm not suggesting they sat unpatched for months. I don't know when they were reported, and coordinated disclosure would look exactly like this.
    What bothers me a little is the delivery path. Getting these fixes means taking 1.4.0 as a whole, including the new copy-on-select default on macOS and the GTK 4.18 requirement, which rules out Ubuntu 24.04 LTS. The notes point those users to an older version or the Flatpak, but there doesn't seem to be a 1.3.2, so I couldn't tell where the fixes would come from for them. If I've missed a backport, I'd be glad to be corrected.
    I understand a small team can't maintain several release lines, and I use Ghostty and like it a lot. Still, security fixes have costs that fall on people other than the maintainers, and I wonder whether a patch release for the previous minor, even just one, might be worth the effort. I may well be underestimating what that takes.
