    Fair enough, and I realize it's easy to ask for this from the outside. I didn't mean that I should be the one to do it, though, and I'm not sure I could. The fixes are public once the advisories go out, so anyone can backport them. But a signed and notarized build, an auto-update, a version number that scanners and distro trackers recognize: those only come from the project itself. A patched fork wouldn't reach most users.
