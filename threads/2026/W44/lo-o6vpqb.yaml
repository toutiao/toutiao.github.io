  author: arialdo
  text: |-
    Ah, my bad! I see what you mean now and of course you're right. I was conflating independence of terminal processes with independence of the Emacs UI.
    While multiple Ghostel buffers have separate processes, if the Emacs event loop itself is stuck, none of them is going to be interactive until Emacs comes back. Not just "read-only", but really stuck. Neither ghostel nor detached solve this problem.
    detached does something different. It keeps the underlying process alive independently of Emacs (they even survive Emacs reboot!), which is lovely for long-running jobs. But it doesn't solve that particular failure mode.
    That said, honestly, I very very rarely have the case of Emacs being stuck for its own tasks. You mileage may of course vary!
