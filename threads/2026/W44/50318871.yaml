    and many people just reflexively say &quot;strong AI wouldn&#x27;t be fun&quot;.
    I think they are partly right, but I also think a strong AI that is purposely
    dumbed down in fun ways could be really enjoyable.<p>When it comes to shooters
    though, those games aren&#x27;t really about competition and decisions, they are
    about giving the human player an experience. I do think strong AI is overkill
    in such situations.<p>A strong AI for chess absolutely improves chess computer
    games.<p>A strong AI for a Magic: The Gathering style card battler would improve
    the game.<p>A strong AI for Civilization would improve the game, but I think we&#x27;re
    starting to get into a realm where you can fake some things. I do think Civilization
    games are lacking because of poor AI, but I don&#x27;t know that we need LLM-levels
    of AI in Civilization.<p>Again, in shooters, there&#x27;s no decision, no illusion
    of fair play or equal competition based on making decisions, it&#x27;s all about
    the human experience, and so LLM-level AIs aren&#x27;t needed here at all.'
