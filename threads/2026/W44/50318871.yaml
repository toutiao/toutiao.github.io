  author: teraflop
  text: Back of the envelope math:<p>If you measure by the product of throughput and
    distance traveled, for an item with a stack size of 100 (e.g. metal plates), the
    player&#x27;s inventory adds up to roughly the same capacity as 2500 yellow belts.
    And that&#x27;s assuming 100% utilization running back and forth in both directions,
    with no unused inventory space and no wasted time.<p>A basic assembler can manufacture
    2500 belts in about 21 minutes. So as a rule of thumb, if you&#x27;re playing
    for longer than 21 minutes, belts are worth the investment (at least for bulk
    transport of raw materials).<p>(I guess maybe add an additional factor of at most
    √2, since the player can run diagonally and belts are orthogonal.)
