  text: 'Im&#x27; not sure he&#x27;d say that -- Per Martin-Löf&#x27;s original work
    was to develop a computational and predicative foundation for constructive mathematics
    à la Bishop.<p>Lean&#x27;s type theory kinda gives up on that idea: Mathlib gleefully
    postulates impredicative propositions with the axiom of choice, quotient types,
    etc. All in all, I&#x27;d say that Lean is much closer in spirit to De Bruijn&#x27;s
    AUTOMATH project (which pre-dates Martin-Löf!), whose goal was to formalise classical
    math textbooks using dependent types.'
