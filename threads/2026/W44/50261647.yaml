  author: anon291
  text: The papers describing lean and it&#x27;s core operations are deliberately
    small. The kernel of a theorem prover is meant to be such that a human can check
    it for correctness. The kernel does not include things like type inference or
    execution. It literally checks the proof and that&#x27;s all and everything needs
    to match exactly. It&#x27;s fairly trivial to write such a thing.<p>Humans have
    to establish trust in this.<p>After that, the rest of the language is written.
    Yes it is possible the type inference engine is broken but in that case the kernel
    will reject it
