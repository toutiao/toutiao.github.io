  author: seanhunter
  text: 'There are some (typically small) simplifications that computers are indeed
    good at.  These could be thought of as analogous to compiler optimizations - they’ll
    see that your proof is basically composing several lemmas and that some of the
    work in the middle can be removed so it can just do that.  In many cases with
    lean if you post a short to medium-length proof into an llm it can suggest these
    types of small improvements for you.<p>What they’re not that great at is the type
    of improvements that really make a big difference: big simplifications etc.  This
    is not super suprising when you understand how this works.<p>Firstly proofs in
    lean (and I think many other assistants) are essentially functions which take
    hypotheses and instantiate a particular type.  That type being equivalent (due
    to the Curry-Howard correspondence) to a proof of some proposition.  The assistant
    uses dependent type theory to make sure all the types match up at each step, which
    is what makes it rigorous. So the task of simplifying a proof is basically finding
    a route through an infinite-dimensional space where you know your starting location
    and the desired end point, but at any step you can go in basically any direction
    you like so long as you can justify your step.  You justify a step by either choosing
    from a (vast at this point) library of lemmas and theorems that are in your standard
    library, or by recursively building the proof&#x2F;function you need to justify
    the step you want to take using this same process you’re trying to use for simplification.
    This is incredibly flexible, but means you’re actually spoiled for choice and
    planning is hard.<p>Secondly, in “pen and paper” proofs, LLMs don’t know the difference
    between steps which are important&#x2F;easy&#x2F;hard&#x2F;intuitive&#x2F;non-intuitive
    for human mathematicians, so lots of the proofs they produce are extremely clunky
    and pedantic in places and dwell for ages over details that are obvious and would
    usually be skipped over and then will move very fast through things that justify
    more attention.  This unevenness is part of what makes their proofs hard for humans
    to work through, but also means they are generally poor judges of what would actually
    constitute a decent simplification.'
