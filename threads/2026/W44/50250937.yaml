  author: flowerlad
  text: Many reasons.<p>First of all, it is not cheaper. It may be cheaper for young
    people because ACA marketplace rates are age dependent while COBRA rates are not.
    It is not cheaper if you are over a certain age, it is significantly more expensive.<p>Secondly,
    many ACA marketplace plans have narrower networks. (Which doctors are in-network
    doesn&#x27;t only dependent on the insurance company, it also depends on the network,
    and insurance companies have multiple networks.) In WA, check out Regence&#x27;s
    network for ACA plans--most hospitals are excluded, while their regular plans
    include them.<p>Unlike COBRA which almost always includes out-of-state doctors
    and hospitals, ACA networks don&#x27;t. If you get a rare disease for which the
    expert doctor is in another state over you&#x27;re out of luck.<p>And lastly,
    ACA rates just went up 20% in many states. If you are a couple in your 60&#x27;s,
    you will pay nearly $45,000 for health insurance and then pay $7,000 each in deductible
    before insurance kicks in. At these rates, most healthy people will decide to
    forgo insurance. Which will reduce insurance company profits, who will then raise
    rates even more. This is a death spiral, and ACA will collapse (which is a desirable
    outcome as far as the current admin is concerned).
