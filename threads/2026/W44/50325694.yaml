  author: viccis
  text: "&gt;Building a world with its own set of rules and history and what not turns
    out to be very fascinating. ... The length of the stories make proof-reading ridiculously
    hard.<p>Sometimes I wonder if writing more short stories would be like playing
    9x9 Go games for new authors. It won&#x27;t exercise the big structural challenges,
    and it comes with its own challenges, but it does practice a lot of this in a
    much more digestable size.<p>As far as world building goes, I think GRRM&#x2F;Rothfuss&#x2F;Sanderson
    style &quot;world building through epic scales of structures and systems kept
    consistent&quot; is overrated and maybe even Considered Harmful if you look at
    what it&#x27;s done to my first two examples. By contrast, Borges does more world
    building with the ontological tricks in his &lt;20 page short stories than it
    feels like Rothfuss ever did, in much the same way Tolkien did it with similar
    tricks. For example, treating himself as a mere translator and even doing some
    philologist tricks like telling you he&#x27;s simplifying some names into English
    (Sam&#x27;s real name? &quot;Banazîr&quot;), and withholding more information
    rather than dumping it on you, means that his stories feel like recovered translated
    works from a world just as real as ours and that&#x27;s why people still devour
    The Silmarillion just to get more of a look into it.<p>Borges would do similar
    in his short stories, even embracing a little bit of inaccuracies in the (fictional)
    narrator&#x27;s account of some events, then hitting you with a surprise endnote
    at the end of the story with scholia about the provenance of the story given that
    narrator&#x27;s mistakes.<p>Wolfe was famous for it too. Embrace some of the challenge
    of getting the details right and if you frame it right, it makes it more human
    and more &quot;real&quot;."
  score: 0
