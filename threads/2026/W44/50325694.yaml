  author: hagbard_c
  text: Back in the day I was part of a &#x27;commission&#x27; to produce a 5-yearbook
    for our student club. It being the digital age and we studying at the premier
    (and only...) agricultural university in the Netherlands I went and had a look
    at the possibilities to use university facilities to typeset the book. Those facilities
    ended up being a PDP-10 running TOPS-20 &#x27;cause the VAXen were too important
    for such work. After some experiments with TECO and RUNOFF I was convinced I&#x27;d
    never get the other members of the commission to work this way. Since my own C-64
    was just that, my own machine and already in use for other things I ended up scrounging
    up an ancient tape-based word processing system consisting of a metal box with
    a tape drive connected through a thick cable to an IBM Selectric typewriter. While
    it wasn&#x27;t the epitome of ergonomics it was more amenable to some of the more
    digitally impaired members of the commission. That the Selectric&#x27;s motor
    burned out just when I was going to produce the master printouts which led me
    on a hunt for a motor (found one for ~$50) and a complicated repair (re-adjusting
    the whippletree linkage without documentation but with time pressure from the
    printers was not my favourite experience). Still, we made it, the book was published,
    all&#x27;s well that ends well.
