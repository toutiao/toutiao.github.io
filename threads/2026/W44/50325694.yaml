  author: staplung
  text: For those that don&#x27;t know, groff&#x27;s ancestor &quot;roff&quot; is
    very closely tied to UNIX&#x27;s origin story. roff itself had it&#x27;s own antecedent
    called RUNOFF (whence the name) on Multics. roff was basically UNIX&#x27;s first
    &quot;killer app&quot; and was used to typeset patent applications by the division
    of Bell Labs that handled that sort of thing. It legitimized the further development
    of UNIX.<p>Groff seems to be somewhat supplanted by mandoc these days, at least
    on the BSDs.
