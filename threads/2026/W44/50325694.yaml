  author: kragen
  text: troff is no longer fashionable, and it&#x27;s not what you want for top-quality
    typesetting,  but I don&#x27;t think of it as &quot;out there&quot;. My non-technical
    mother was using an HDOS program called TEXT.ABS, which is similar to a limited
    nroff, to format the articles she wrote in the 01980s.  It wasn&#x27;t as easy
    to use as something like MacWrite, but it was a lot easier than a typewriter.  The
    text editor she used was called PIE.ABS, and from my point of view, the usability
    distance from a typewriter to PIE was bigger than from PIE to MacWrite.<p>She
    didn&#x27;t have much choice of fonts on the pre-Graftrax Epson MX-80 she used.  I
    think it was Pica or Elite.<p>Typesetting is certainly very satisfying, but it&#x27;s
    not essential to writing.
