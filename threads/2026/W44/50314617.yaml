    system stability21,22. Smaller but recurrent deviations arise continuously during
    normal operation through both stochastic fluctuations and deterministic mechanisms23,24.\n\nTo
    identify dominant recurrent patterns, we carry out a Fourier analysis of grid-frequency
    time series f(t) from multiple power systems worldwide (Fig. 1). The investigated
