  author: schiffern
  text: 'The corresponding concept in gears is to avoid meshing two gears unless the
    number of teeth are co-prime, because this will cause uneven wear patterns. If
    the tooth counts are coprime, then each tooth will contact every tooth on the
    other gear the same number of times, effectively &quot;wear leveling&quot; the
    teeth.<p>In this instance, one fix is to fire the timer every 59.XXX seconds,
    so it will naturally drift out of phase with the minute hand of the clock.<p>If
    work needs to be done exactly every 60 seconds, this is fixed by having a WAIT(RAND(60e6))
    microseconds during the first timer initialization, so if 10,000 units start simultaneously
    they don&#x27;t try all at once. This is good practice in most (all?) systems.
    Hint: test power and infra outage&#x2F;reconnect, which can unintentionally sync
    timers.<p>This is why many software will do automated updates every 17 hours:
    17 is coprime with 24.<p>Classic &quot;thundering herd&quot; mitigation tactics.<p>Edit:
    Tempting to blame IoT, but (since this is news) I don&#x27;t think anyone knew
    there was something to fix here. We have the tools however.'
