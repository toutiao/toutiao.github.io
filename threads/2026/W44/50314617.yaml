article:
  url: https://www.nature.com/articles/s41560-026-02144-0?error=cookies_not_supported&code=b4b54328-ab94-457f-bcf7-15114fd9bc74
  title: One-minute frequency disturbances from unintended synchronization in cyber–physical
    power systems | Nature Energy
  fetch_status: success
  content: "## Abstract\n\nElectric power systems are evolving into cyber–physical
    infrastructures shaped by power electronics and digital control. As inverter-based
    generation alters system dynamics and digitalization heightens vulnerability to
    errors and attacks, cyber–physical coupling can also introduce subtle system-level
    effects. Here we show that grid-frequency time series worldwide exhibit a persistent
    1-min oscillatory pattern whose origin has remained unexplained. We show that
    clock-synchronized control software in digitally controlled energy devices, particularly
    uninterruptible power supplies and battery energy storage systems, generates periodic
    power-demand peaks that propagate across voltage levels and can give rise to the
    observed pattern. The pattern amplitude has increased substantially in several
    grids over recent years, contributing to wear and tear in hydropower systems and
    motivating stricter frequency-control requirements. The rapid expansion of battery
    storage, data centres and the Internet-of-Things may further amplify such cyber–physical
    power oscillations, highlighting the need for improved control design.\n\n###
    Similar content being viewed by others\n\n### End-to-end cyber resilience enhancement
    for renewable-dominated power grids\n\n### Power distribution system blackstart
    restoration using renewable energy\n\n### Resilient low-inertia power systems
    through asynchronous energy balancing\n\n### Explore related subjects\n\n- Energy
    grids and networks\n\n- Stability Dynamics in Power Grid Networks\n\n## Main\n\nThe
    transition to a sustainable energy system requires advanced control methods to
    deal with increasing complexity and uncertainty1,2. As variable renewable energy
    sources such as wind and solar replace conventional generation, maintaining power
    balance requires accurate forecasting and real-time control of storage, backup
    generation and flexible demand3. At the same time, the electrification of sectors
    such as transport and heating is introducing millions of digitally controlled
    devices—electric vehicle chargers4, heat pumps5 and smart appliances6—into the
    grid. Furthermore, data centres add additional software-dependent loads7. Together,
    these trends are reshaping the power system into a cyber–physical infrastructure,
    where physical devices and digital control are deeply intertwined. In this new
    paradigm, system reliability increasingly depends not only on the physical properties
    of generation and load but also on the design, timing and coordination of software-controlled
    devices across all layers of operation8.\n\nWhile cyber–physical integration enables
    unprecedented levels of efficiency and flexibility, it also introduces new systemic
    risks9. Historical events underscore the stakes: inadequate situational awareness
    contributed to the 2003 North American blackout10, and software-driven control
    failures have played critical roles in recent major outages11,12. Beyond failures
    and malicious attacks, however, even benign control routines can become systemically
    relevant when many devices act coherently. Unintended synchronization can generate
    recurrent and potentially amplified oscillatory behaviour in large-scale cyber–physical
    energy systems.\n\nModern power systems exhibit oscillations across a broad range
    of time scales. Oscillations with characteristic periods around 1 min have previously
    been discussed as ultralow-frequency oscillations (ULFOs) and linked to resonance
    phenomena in hydropower turbine-governor systems13,14,15,16. However, resonance
    phenomena in classical control systems differ fundamentally from cyber–physical
    synchronization effects. Oscillations without external timing signals do not naturally
    explain patterns that remain phase-coherent over long time scales or occur reproducibly
    across diverse power systems.\n\nIn this Article, we identify and explain a coherent
    1-min oscillation in power systems worldwide caused by cyber–physical synchronization
    effects. We show that the grid frequency, and thus the power balance, exhibits
    a highly regular periodic pattern with a period of exactly 1 min. Searching for
    potential causes of this pattern, we provide empirical evidence that clock-synchronized
    control actions in battery-based uninterruptible power supplies (UPSs) generate
    periodic power-demand peaks, and we demonstrate that this signal propagates across
    multiple voltage levels up to the transmission interface. More broadly, our results
    point to a class of cyber–physical power oscillations driven by externally synchronized
    control software.\n\nThe identified synchronization mechanism is not specific
    to UPSs or battery systems, but reflects a general property of digitally controlled
    devices operating with external timing signals or periodic software routines.
    The rapid expansion of battery storage, data-centre infrastructure and Internet-of-Things
    (IoT) devices increases the relevance of cyber–physical risks in power-system
    operation. At the same time, decreasing system inertia makes power systems more
    sensitive to coherent power imbalances17. Indeed, we observe that the amplitude
    of the 1-min pattern has increased in several grids. The oscillation contributes
    to wear and tear, especially in hydropower turbines18, and has motivated stricter
    load–frequency control requirements19. Our results indicate that coherent cyber–physical
    oscillations can be mitigated directly at their source through improved control
    design.\n\n## A universal 1-min pattern in the grid frequency\n\nThe grid frequency
    is a key observable in power-system operation, reflecting the balance between
    generation and load: it rises when generation exceeds demand and falls when demand
    outpaces supply. Maintaining the nominal frequency of 50 Hz or 60 Hz therefore
    requires continuous balancing by load–frequency control systems20.\n\nLarge frequency
