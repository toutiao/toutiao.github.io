  text: NetBSD was designed for a world where many CPU architectures were extant,
    and each one was associated with a relatively small complement of hardware accessories
    (and therefore drivers). This made a lot of sense in the 1990s and 2000s when
    minicomputers and workstations still roamed the earth. Now we have two relevant
    architectures and a neverending stream of hardware devices, and it's a lot harder
    for a small volunteer project to keep up.
