    ARE THESE THE WORLD’S BEST SHITHOUSES?\n\nNorway makes shithouses great again!\n\nThese
    toilets are worth a visit, both when you really have to go – and when you don’t.\n\nSome
    restrooms along [the Norwegian Scenic Routes](/plan-your-trip/travel-tips-a-z/norwegian-scenic-routes/)
    actually invite you to take your time and enjoy the scenery – even if you don’t
    have any business to take care&nbsp;of.\n\nThe loos at the Stegastein viewpoint
    in [the Sognefjord region](/places-to-go/fjord-norway/the-sognefjord-area/) is
    one of the world’s 10 best public toilets according to DesignCurial.\n\nAnd if
    the queue is unusually slow, it’s most likely someone taking pictures of the Aurlandsfjord
    from the window.\n\nTotally worth the wait when it’s your turn. Just don’t drop
    your phone.\n\n> “Norway has opened what might be the most idyllic public convenience
    in the world. ”\n\n_The Telegraph_\n\nA lot of people agree with The Telegraph,
    as the wave-shaped Ureddplassen on [the Helgeland coast](/places-to-go/northern-norway/helgeland/)
    has been featured in several publications.\n\n“Ureddplassen” means “the place
    of the fearless.” Quite fitting, as a nearby memorial pays tribute to those who
    lost their lives when the Norwegian submarine “Uredd” sank right off the coast
    during the Second World War.\n\nAnother restroom with war history is the one at
    Eggum in&nbsp;[Lofoten](/places-to-go/northern-norway/the-lofoten-islands/). It
    is built like an amphitheatre underneath the ruins of a German radar station.\n\nThis
    rest stop along the [Norwegian Scenic Route Ryfylke](/places-to-go/fjord-norway/scenic-route-ryfylke/)
    offers both an architecturally impressive toilet and stunning views of the [Flesefossen](/listings/the-rest-area-flesefossen-in-suldal/501772/)
    waterfall as it rushes down a mountainside.\n\nIf you are a mere mortal like us
    and can’t afford a gold-plated toilet seat, the Golden loo on the island&nbsp;[Senja](/places-to-go/northern-norway/senja-central-troms/)&nbsp;is
    the next best thing.\n\nFun fact: It’s so popular that several other (more low-key)
    toilets will be built nearby.\n\nCan you spot the restroom here?\n\nAt Utsikten
    viewpoint along the Scenic Route Gaularfjellet in [the Sognefjord area](/places-to-go/fjord-norway/the-sognefjord-area/),
    the loo might not be the visual highlight.\n\nBut even though it’s discreet, it’s
    still pretty cool. You see, this restroom runs on solar&nbsp;power.\n\nThe Norwegian
    Scenic Routes are essentially all about the connection between architecture and
    nature.\n\nAt Ostasteidn in [Ryfylke](/places-to-go/fjord-norway/ryfylke/), the
    restroom is designed so that moss will start to grow on the outer walls, like
    camouflage. Discover more along the [Scenic Route Ryfylke](/places-to-go/fjord-norway/scenic-route-ryfylke/).\n\nWho
    knew that public toilets could be this Instagram-worthy?\n\nTungeneset on [the
    Senja island](/places-to-go/northern-norway/senja-central-troms/) looks pretty
    good underneath [the northern lights](/things-to-do/nature-attractions/northern-lights/).\n\nTyrvefjøra&nbsp;is
    a great stop on the Scenic Route Hardanger in [the Hardangerfjord region](/places-to-go/fjord-norway/the-hardangerfjord-region/).&nbsp;The
    building consists of two separate toilets built of pine logs with a big&nbsp;roof
    that \"floats\" over the landscape.\n\n## The Norwegian Scenic routes\n\nExplore
    some of the world's most beautiful drives.\n\n- \n[\n\n ![Steilneset memorial
    in Vardø at the Norwegian Scenic Route Varanger, Northern Norway](https://static.visitnorway.com/images/jlrwvnbf/production/408c6dc375216f1a7daf8d73fe1ec57d580f0bf0-4256x2832.jpg?fp-x=0.34328007518796994&fp-y=0.4699858757062147&w=2560&h=1920&q=75&fit=crop&crop=focalpoint&auto=format)\n\n###
    Norwegian Scenic Route Varanger\n\n](https://www.nasjonaleturistveger.no/en/routes/varanger)\n-
