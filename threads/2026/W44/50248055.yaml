  author: dragontamer
  text: Menus from Win95 are uniform. All buttons took up one row and a full width
    of the submenu. (Even if you don&#x27;t have a shortcut key assigned, the space
    is taken up and wasted)<p>It&#x27;s well acknowledged that modern designers and
    users benefit from large vs small, and other varying styles of organization.<p>Menus
    only had top menus vs submenu vs sub-sub-menu (and so forth). Yes a good menu
    is useful but...<p>A ribbon offers many more tradeoffs. It&#x27;s harder to design
    a good ribbon, but the best ribbons are always better than even the best menu.
    The important features will be physically larger with more text and space. The
    less important or niche features might just be an icon with tooltip, possibly
    hidden behind a subcategory of the ribbon.<p>In theory, you can use the modern
    Ribbon to make old school menus. But why bother? If you made the switch to that
    XML design language, you might as well take all the benefits of the Ribbon<p>Or
    hell, if you like old school menus, you can still make them today. Those .RC editors
    still work in modern Windows 11. But give it a shot and you&#x27;ll see how restrictive
    and bulky old school menus are in practice.
