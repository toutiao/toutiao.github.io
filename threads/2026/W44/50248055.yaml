  author: spijdar
  text: NetBSD has excellent binary compatible with 80s &quot;unix&quot;, the problem
    is most (all?) of the 80s unix platforms it supports aren&#x27;t x86.<p>Current
    NetBSD still has good support for running SunOS binaries, though, including graphical
    ones. I&#x27;m certain you could get a SunOS 4.x binary from pre-1992 to run on
    NetBSD&#x2F;SPARC. I&#x27;ve no idea how far back you could potentially go on
    NetBSD&#x2F;m68k -- probably quite a ways, especially if the binaries are statically
    linked. SunOS pre-1988 was all static linking!<p>(Running &quot;real&quot; 4.3BSD
    binaries might be hard -- I think NetBSD&#x2F;VAX defaults to ULTRIX compat, which
    is an either&#x2F;or thing versus strict Berkeley Unix compatibility. Same binary
    format, similar but incompatible syscalls&#x2F;data structures.)
