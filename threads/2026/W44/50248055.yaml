  author: Rohansi
  text: Linux isn&#x27;t the source of the incompatibility. The kernel itself is very
    strict about not breaking userspace. Your userspace is breaking compatibility
    on its own, containers fix it by shipping the userspace components within the
    container, which only works because the kernel maintained compatibility. If the
    kernel broke compatibility you would need to use a VM so you can run a different
    kernel version.
