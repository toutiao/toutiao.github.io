  author: account42
  text: LibX11 is still alive and kicking. It is however possible to bundle libX11
    and&#x2F;or libxcb (libX11 today sits on top of libxcb) because the wire protocol
    between them and the X server is also backwards compatible.<p>And of course Wayland
    has XWayland to continue compatibility. This doesn&#x27;t give you access to new
    toys but neither does restricting yourself to a 30-year old Win32 API.<p>And beyond
    libc&#x2F;libX11&#x2F;libxcb, libasound has also provided good backwards compatibility
    with newer systems implementing shims to make it work. You can also use libpulse
    directly if you don&#x27;t care about old&#x2F;opinionated systems though.
