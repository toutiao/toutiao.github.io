  author: '0x0203'
  text: Many programs are dynamically linked to at the very least, libc. If the system
    libc is older than what the binary was developed for, it will often fail. Failures
    going the other direction are less common, but can and do still happen. If the
    binary was statically linked with everything it needs, you&#x27;ve got a pretty
    good chance it&#x27;ll work, but that&#x27;s a bit harder to do with GUI programs
    that need to interact with X or Wayland.
