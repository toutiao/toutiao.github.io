  author: account42
  text: You don&#x27;t need to go full static linking. Just bundle every library that
    doesn&#x27;t have string backwards guarantees or rather bundle everything except
    base system libraires. The same is also how things work on Windows (and thus Wine
    really). Wine won&#x27;t be able to run a binary that links to some random libpng
    or whatever that the compiler found in your System32. The only difference is that
    Microsoft makes an SDK that gives your some idea of whats a system library you
    can rely on as well as the ability to target older versions than the system you
    are building on. The latter can be done on Linux as well but there is no-pre made
    SDK so the easiest solution ends up being a VM or chroot with older libraries.
