  author: ux266478
  text: No, I think that&#x27;s approaching a strawman. Speaking as somebody that
    doesn&#x27;t give a shit about cryptocurrency.<p>It&#x27;s all tradeoffs. The
    same power that grants the ability to reverse transactions also grants the ability
    to reverse a transaction in bad faith and commit fraud. Will the system correct
    that? Would it surprise you to know that it doesn&#x27;t have to? That same power
    also grants the ability to lock an entity out of any kind of monetary transaction,
    and things like debanking. Usable for good? Sure. I don&#x27;t think it&#x27;s
    controversial to say that it being leveraged against Hunter Biden was at all justified,
    however. Would you like to be on the receiving end of that? Would you like to
    see a world where an LLM gets to decide that kind of thing based on your presence
    in the surveillance panopticon?<p>To that sense, it&#x27;s really just a disagreement
    on what tradeoffs are acceptable. People who have a utopian view of cryptocurrency
    are looking at some tradeoffs as preferable to others, it&#x27;s a different failure
    mode. To be clear, I don&#x27;t necessarily agree with it myself, but you shouldn&#x27;t
    be so uncharitable to people to assume disagreement is always a matter of delusional
    ignorance.
