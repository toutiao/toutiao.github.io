  author: Lichtso
  text: |-
    The reversibility of transactions is often brought up but I don&#x27;t think that is the main differentiator, or any at all really.<p>First, both cryptocurrencies and traditional finance systems have chosen to and have chosen not to reverse or freeze criminal transactions in the past. Decentralized blockchains have chosen to do so at least once [0]. The traditional finance system has chosen not to many times and even large sums [1] [2]. It really comes down to how much is stolen and how much influence the victim(s) have.<p>No, instead I think the main difference is the speed of transactions. Some blockchains operate within milliseconds while bank transactions take days. Even instant transfers are actually settled on a way longer cadence in reality.<p>That means attackers can do a fast sweep on blockchains, which is not possible with bank transactions because everything happens in slow motion and humans have way more time to react and step in.<p>[0]: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_DAO" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_DAO</a>
    [1]: <a href="https:&#x2F;&#x2F;www.turkiyetoday.com&#x2F;turkiye&#x2F;german-bank-e100m-disappears-in-turkiye-67712&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.turkiyetoday.com&#x2F;turkiye&#x2F;german-bank-e100m-disap...</a>
    [2]: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Bangladesh_Bank_robbery" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Bangladesh_Bank_robbery</a>
  score: 0
