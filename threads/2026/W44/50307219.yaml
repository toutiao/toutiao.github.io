  text: But from an economics perspective OAI&#x2F;Antropic are more similar to Amazon
    than to Pets.com. Pets.com always had a heavily negative COGS - they were in the
    business of selling $20 bills for $15. On the flip side, Anthropic appears to
    be positive on COGS, and OAI could get positive by cutting limits on free and
    $20 plans. OAI&#x2F;Anthropic are negative on the books mostly because of massive
    R&amp;D expenses. This compares well to Amazon circa 1999, which was positive
    on COGS but negative overall due to massive buildout R&amp;D costs.<p>Note that
    I&#x27;m not saying OAI&#x2F;Anthropic are destined for success - because the
    rate of change combined with competition with cheap Chinese models is pretty novel
    in the business case history. But I am saying that pessimistic dot-com-boom comparisons
    don&#x27;t seem to be all that deep.
