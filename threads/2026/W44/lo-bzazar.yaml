    in a high-level language such as Rhombus:\n\n    \n\n    fun expression(rbp =
    0):\n\n    \n\n     let mutable t = token\n\n    \n\n     advance()\n\n    \n\n
    \    let mutable left = t.nud()\n\n    \n\n     while rbp \\< token.lbp:\n\n    \n\n
    \    t := token\n\n    \n\n     advance()\n\n    \n\n     left := t.led(left)\n\n
    \   \n\n     left\n\n    \n\n    fun expression(rbp = 0):\n\n    \n\n     let
    mutable t = token\n\n    \n\n     advance()\n\n    \n\n     let mutable left =
    t.nud()\n\n    \n\n     while rbp \\< token.lbp:\n\n    \n\n     t := token\n\n
    \   \n\n     advance()\n\n    \n\n     left := t.led(left)\n\n    \n\n     left\n\n
    \   \n\n    fun expression(rbp = 0):\n\n    \n\n     let mutable t = token\n\n
    \   \n\n     advance()\n\n    \n\n     let mutable left = t.nud()\n\n    \n\n
    \    while rbp \\< token.lbp:\n\n    \n\n     t := token\n\n    \n\n     advance()\n\n
    \   \n\n     left := t.led(left)\n\n    \n\n     left\n\n    \n\n    fun expression(rbp
    = 0):\n\n    \n\n     let mutable t = token\n\n    \n\n     advance()\n\n    \n\n
    \    let mutable left = t.nud()\n\n    \n\n     while rbp \\< token.lbp:\n\n    \n\n
    \    t := token\n\n    \n\n     advance()\n\n    \n\n     left := t.led(left)\n\n
    \   \n\n     left\n\nAnd here's a secret: that's the least important thing you
    need to understand about Pratt's. In fact, you don't need to understand this piece
    at all! Imagine if you were only able to use quicksort if you understood its implementation.
    Imagine if you were only able to use files if you knew how to implement a filesystem
    from scratch. It's the same logic here. If you lack the power to abstract, you'll
    arrive nowhere in computer science because that's how the whole field works. In
    fact, I wrote the backbone of a heavily Pratt-based parsing machinery for a compiler
    that I've been writing since last year w/o even bothering to understand the above
    snippet in any detail.\n\nNot convinced? Think for a second on how they do in
    traditional parsing techniques: compiler compilers! They use code generators to
    spit the parsing algorithm because just a minuscule crowd bothers to learn what
    the parsing engine is actually doing. It's no different with Pratt. However Pratt
    is so small that you can just copy'n'paste these 9 lines of code in your project
    and call it a day instead of adding a new complex dependency to your project.
    The algorithm hasn't changed since 1973 and it's not gonna change now.\n\nIn this
    article I'll go over what you actually need to keep in mind for Pratt parsing.
    The point won't be about memorizing any of it though. The point is about acquiring
    a mindset. As long as you acquire the mindset you don't need to even bother to
    remember even a single word of what I say here.\n\n## [#](#label-Nuds%20&%20leds)\n\n##
    Nuds & leds\n\nThe only tutorial on Pratt parsing that I can firmly recommend
    to someone who has never been exposed to the topic is actually a talk that Douglas
    Crockford gave in the conference GOTO 2013[¹](#). Douglas Crockford nailed it
    when he stated:\n\n> Pratt takes parsing which is a really complicated thing and
    reduces it to one simple question: _What do we expect to see to the left of a
    token_?\n\n— Douglas Crockford, GOTO 2013\n\nAt first glance it may look like
    a mystical statement devoid of meaning, but that's the question that becomes the
    framework on how you face parsing problems and it'll rewire your brain to internalize
    the Pratt parsing mindset. That's the most important thing you need to understand.
    You register semantic actions for two categories: nuds and leds. A nud is a token
    that expects nothing to its left (nud stands for null denotation) while a led
    expects something (led stands for left denotation).\n\nTraditional parsing techniques
    register semantic actions to production rules. Here's an example I took straight
    from GNU Bison's manual:\n\n    \n\n    expr: expr '+' expr { $$ = $1 + $3; }
    ;\n\n    \n\n    expr: expr '+' expr { $$ = $1 + $3; } ;\n\n    \n\n    expr:
    expr '+' expr { $$ = $1 + $3; } ;\n\n    \n\n    expr: expr '+' expr { $$ = $1
    + $3; } ;\n\nThe text between the braces is code that executes when the BNF-like
    grammar on the left matches. I'm gonna repeat myself because that's really important:
    traditional parsing techniques register semantic actions to _production rules_
    (which by definition are non-terminal symbols). In contrast Pratt parsing registers
    semantic actions to the _terminals themselves_ instead. That's a fundamental shift
    on how you face parsing problems.\n\nHere's a stripped down version of the code
    for the tables that I have in my compiler right now:\n\n    \n\n    static constinit
    const auto nud\\_table = make\\_dispatch\\_table(\n\n    \n\n    rule\\_c\\<token::lparen,
    token::nud::parse\\_lparen\\>,\n\n    \n\n    rule\\_c\\<token::lbrace, token::nud::parse\\_lbrace\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::exclamation\\_mark, token::nud::parse\\_negation\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::less\\_than\\_sign, token::nud::parse\\_enter\\_type\\_scope\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::plus\\_sign, token::nud::parse\\_unary\\_plus\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::minus\\_sign, token::nud::parse\\_unary\\_minus\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::dplus\\_sign, token::nud::parse\\_preincrement\\>,\n\n
    \   \n\n    // ...\n\n    \n\n    rule\\_c\\<token::code::user\\_macro, token::nud::parse\\_user\\_macro\\_expansion\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::identifier, token::nud::parse\\_identifier\\>\n\n
    \   \n\n    );\n\n    \n\n    \n\n    \n\n    static constinit const auto led\\_table
    = make\\_dispatch\\_table(\n\n    \n\n    rule\\_c\\<token::lparen, token::led::parse\\_function\\_call\\>,\n\n
    \   \n\n    rule\\_c\\<token::lbrack, token::led::parse\\_array\\_indexing\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::dvertical\\_bar, token::led::parse\\_logical\\_disjunction\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::dampersand, token::led::parse\\_logical\\_conjunction\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::dequals\\_sign, token::led::parse\\_equality\\>,\n\n
    \   \n\n    // ...\n\n    \n\n    rule\\_c\\<token::code::dminus\\_sign, token::led::parse\\_postdecrement\\>,\n\n
    \   \n\n    rule\\_c\\<token::code::asterisk, token::led::parse\\_multiplication\\>\n\n
    \   \n\n    );\n\n    \n\n    \n\n    \n\n    enum : unsigned\n\n    \n\n    {\n\n
    \   \n\n    parse\\_until\\_end = 0,\n\n    \n\n    prefix\\_operator\\_binding\\_power
    = 120,\n\n    \n\n    };\n\n    \n\n    \n\n    \n\n    static constexpr auto
    binding\\_power = make\\_dispatch\\_table(\n\n    \n\n    rule\\_c\\<token::code::dvertical\\_bar,
    10\\>,\n\n    \n\n    rule\\_c\\<token::code::dampersand, 20\\>,\n\n    \n\n    rule\\_c\\<token::code::dequals\\_sign,
