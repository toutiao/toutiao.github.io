  text: |-
    I'm glad to see more explorations of Pratt parsing :-)   And thanks for referring to previous writing, including my own!
    In the opening code snippet, I think a VERY important point is that both nud() and led() will typically call back into expression() (after the Pratt logic dispatches to the right one).
    There's no getting around that languages are fundamentally not just recursive, but mutually recursive, so that is where it shows up.

    Another useful observation is that it's like recursive descent, in that it's both recursive and "mutating".
    That is, Pratt parsing and recursive descent are a different style of algorithm than "recursively count the nodes in a tree" e.g. 1 + count(left) + count(right), which is functional / immutable.
    In contrast, they advance through the token stream at the same time -- they have a side effect.  Hence the advance() in the opening code snippet.  I like writing it self.advance() or self.Next() for that reason.

    There are many ways to think of the algorithm, but I sometimes think of it as "recursive descent, except you want to control the output tree with a numeric precedence table".
    In other words, Dragon Book parsing is not as focused on the output tree.  It's focused mainly on recognition: is a string part of the (infinite)  set that a grammar specifies?  That is a boolean yes/no.
    The Dragon book also says that you can construct a CST (concrete syntax tree) from the parsing process, i.e. with LR or LL parsing.  The CST is a tree that mirrors the structure of the grammar.
    With Pratt, you construct a more concise tree (that's not a CST) more "directly" and efficiently.  It's NOT grammatical; it's more focused on the tree structure / traversal order.
    A useful exercise is to join all these styles together with the SAME lexer: recursive descent, Pratt, grammars.  Oils does this, and the different algorithms all become mutually recursive with each other!
