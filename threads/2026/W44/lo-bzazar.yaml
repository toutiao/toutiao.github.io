  text: |-
    Is it a pratt parser?

    No. Briefly skimming that file (I spent a few minutes trying to chase definitions across repos before I gave up), it looks like a conventional recursive-descent pull parser, where pulling is implemented via generators. You could also be using the generators for backtracking but I don't see any evidence of that in this file. Both ideas, i.e. using generators in a recursive-descent parser for backtracking and pulling, are standard; neither of them have anything to do with Pratt parsing except insofar as they're all examples of recursive-descent parsing.
    Since generator frames are heap allocated in JavaScript VMs, generators are also an easy way to avoid fixed-depth stack overflows in recursive-descent parsing for adversarial inputs like "((((...." where the recursion depth is linear in the size of the input. It comes at a high price in efficiency and memory usage; goroutine-style stacks are a much more efficient VM implementation technique for supporting pulling and unbounded recursion.
