  author: LarsKrimi
  text: "Okay. Good point, that is quite a bit shorter than I first thought of<p>A
    rough benchmark of a version of that against the original shows it to be close
    to twice as fast for unpredictable input with GCC (4.5 ns vs 2.72 ns) on my old
    machine. With predictable input where x values often are the same the original
    version is quicker<p><pre><code>    int sparse_8_jump(int x, int val) {\n        unsigned
    int idx = (unsigned int)x &gt;&gt; 3;\n        if (idx &gt; 5)\n            return
    0;\n        if (x &amp; 7)\n            return 0;\n        \n        switch (idx)
    {\n            case 0:\n                return f0(val);\n            case 1:\n
    \               return f1(val);\n            case 2:\n                return f2(val);\n
    \           case 3:\n                return f3(val);\n            case 5:\n                return
    f4(val);\n            default:\n                return 0;\n        }\n    }</code></pre>"
