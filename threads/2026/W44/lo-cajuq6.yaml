  content: "By **Joe Brockmeier**  \nOctober 26, 2026 \n\nPython's [experimental just-in-time
    (JIT) compiler](https://docs.python.org/3.13/whatsnew/3.13.html#an-experimental-just-in-time-jit-compiler),
    which was added to CPython in 2024 for the [3.13&nbsp;release](https://www.python.org/downloads/release/python-3130/),
    is on its way out. In June, the Python steering council [announced](https://discuss.python.org/t/an-announcement-from-the-steering-council-regarding-the-jit-project/107638)that
    it was pausing work on the JIT in CPython's main branch until there was an accepted
    [Python Enhancement Proposal](https://peps.python.org/pep-0001) (PEP) that addressed
    concerns about maintenance, compatibility, and set clear success metrics as well
    as a timeline for completion. After creating[PEP&nbsp;836](https://peps.python.org/pep-0836/)
    (\"JIT Go Brrr: The Path to a Supported JIT Compiler for CPython\") to try to
    meet the council's request, and after months of discussion, the JIT maintainers
    have withdrawn the PEP. For now, it appears that development on the once-promising
    project has come to an end.\n\nThe JIT was [added to CPython by Brandt Bucher](https://github.com/python/cpython/pull/113465)
    in early 2024. Generally, such a major feature would be expected to land only
    after the council had approved a [standards-track PEP](https://peps.python.org/pep-0001/#pep-types:~:text=A%20Standards%20Track%20PEP).
    Bucher had given a talk ([YouTube video](https://www.youtube.com/watch?v=HxSHIpEQRjs),[slides](https://github.com/brandtbucher/brandtbucher/blob/master/2023/10/10/a_jit_compiler_for_cpython.pdf))
    about the JIT at a Python core developer sprint, and [announced his intent](https://github.com/python/cpython/pull/113465#issuecomment-1911279536)
    to merge the feature—but he had not taken the step of authoring or submitting
    a PEP for its approval. He was [prodded into doing so](https://github.com/python/cpython/pull/113465#issuecomment-1969415137)
    by steering council member Thomas Wouters, who was also serving as the release
    manager for Python 3.13.\n\nBucher and Savannah Ostrowski drafted [PEP&nbsp;744](https://peps.python.org/pep-0744/)
    (\"JIT Compilation\"), which was an [informational PEP](https://peps.python.org/pep-0001/#pep-types:~:text=An%20Informational%20PEP%20describes%20a%20Python%20design%20issue)—meaning
    it only provides information to the Python community and does not represent formal
    consensus to proceed on a feature or project. LWN [covered](https://lwn.net/Articles/970397/)
    the discussion of PEP&nbsp;744 in April&nbsp;2024, and later covered Bucher's
    [talk on the JIT](https://lwn.net/Articles/977855/) at PyCon&nbsp;US&nbsp;2024,
    as well as the [follow-up talk](https://lwn.net/Articles/1029307/) at PyCon&nbsp;US&nbsp;2025.\n\n####
    PEP it up\n\nWork on the JIT had been proceeding on the basis of PEP&nbsp;744
    until this June, when the council had put forward its formal request for the JIT
    maintainers to create a standards-track PEP. One might wonder, [as Antoine Pitrou
    did](https://discuss.python.org/t/an-announcement-from-the-steering-council-regarding-the-jit-project/107638/2),
    why the council had decided that it was time to speak up and ask for a new PEP.
    Wouters [said](https://discuss.python.org/t/an-announcement-from-the-steering-council-regarding-the-jit-project/107638/4)that
    there was no \"\", but that the council had been discussing the topic for a while
    and indicated that it was looking to ensure the JIT work did not interfere with
    other projects. \"\" The council had waited until after the Python&nbsp;3.15 beta
    release \"\".\n\nThe council asked for a PEP that would make the case for the
    JIT \"\". The council set a deadline of six months for the PEP to be submitted
    and accepted; failing that, the council would require the JIT code to be removed
    from the CPython main branch.\n\n> **Keep up with Linux and free software** with
    [a free trial subscription to LWN](https://lwn.net/Promo/slink-trial-terse2/claim),
    no credit card required.\n\nBucher, Ostrowski, and Ken Jin drafted PEP&nbsp;836
    and [published it on the Python forum](https://discuss.python.org/t/pep-836-jit-go-brrr-the-path-to-a-supported-jit-compiler-for-cpython/108010)
    for community feedback on July&nbsp;3. It generated quite a bit of discussion,
    some favorable and some critical. One of the key themes in the comments, such
    as [this one](https://discuss.python.org/t/pep-836-jit-go-brrr-the-path-to-a-supported-jit-compiler-for-cpython/108010/19)
    by Wouters, and [this comment](https://discuss.python.org/t/pep-836-jit-go-brrr-the-path-to-a-supported-jit-compiler-for-cpython/108010/28)
    by Mark Shannon, was that the draft felt like it should be two separate PEPs.
    Shannon, for example, thought that the PEP should only cover goals for accepting
    the JIT work and felt that it should leave out implementation details. There were
    also quite a few calls for additional information.\n\nBucher [pushed back](https://discuss.python.org/t/pep-836-jit-go-brrr-the-path-to-a-supported-jit-compiler-for-cpython/108010/21)
    a bit on the suggestion that it should be two PEPs, and Ostrowski [defended](https://discuss.python.org/t/pep-836-jit-go-brrr-the-path-to-a-supported-jit-compiler-for-cpython/108010/22)the
    structure of the PEP as it was. \"\"\n\nWhen we [last looked at this topic](https://lwn.net/Articles/1090385/)
    in September, the discussion about the PEP had slowed down without a commitment
    to develop new PEPs or a formal statement from the council. The last word from
    the council at that time, in the form of a [summary of its August&nbsp;6 meeting](https://discuss.python.org/t/2026-08-06-python-steering-council-meeting-summary/108612),
    was that it had met with the PEP authors and was \"\".\n\n#### Experimentation
    in main\n\nOn September&nbsp;21, Wouters [posted](https://discuss.python.org/t/pep-836-jit-go-brrr-the-path-to-a-supported-jit-compiler-for-cpython/108010/53)a
    statement from the steering council, minus Ostrowski (who is currently a member
    of the steering council but did not participate since she is a co-author of the
    PEP), that summarized its position. The statement said that PEP did answer all
    of the questions that were highlighted in the council's request, \"\".\n\nThe
    council wished to make clear that it was not looking for the criteria that the
    JIT should meet to be a supported feature, or whether it should be considered
    such. Instead, the council was evaluating whether the JIT should continue as an
    experiment in CPython's main branch.\n\n> Part of the problem with allowing experimentation
    in main is the lack of unified design, and the uncertainty that core developers,
    package maintainers and users face as the experimentation changes behaviours and
    API surfaces.\n\nThe council said that the PEP was not specific enough about support
    plans, performance criteria, and too vague or too optimistic about a number of
    other areas. The statement included a ten-point list of items that the council
    wanted \"\". The council's list expressed concerns ranging from memory impact
    to security. For example, on the topic of platform parity, the council wanted
    to ensure that the JIT was designed to be easily adopted for new platforms. It
    wanted assurance that the JIT's design would not be tied to specific platform
    or require platform-specific knowledge to maintain.\n\nAnother area that the council
    called out was user impact. It said that the PEP was \"\" about user-visible differences
    with the JIT enabled. There were many cases where users depend on idiosyncrasies
    in the interpreter design, \"\", and it wanted clarification on how those differences
    would be handled. Would they be considered bugs, how would situations be handled
    if a difference in behavior was unavoidable, and so on.\n\nSecurity was \"\",
    according to the council; it suggested that a discussion with the [Python security
    response team](https://devguide.python.org/security/psrt/) was in order and that
    a security review should be part of the criteria for supported status as well.\n\nPEP
