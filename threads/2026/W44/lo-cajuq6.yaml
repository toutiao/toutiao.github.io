  author: indolering
  text: |-
    The main issue (as sibling comments point out) is the C interop and how the implementation internals get exposed to the native extensions.  If you skip all that (as every other Python JIT does) then we get speedups like in every other language.  This means the language semantics get coupled to the C implementation, which causes problems even between versions of mainline Python.
    Those other Python JITs get there through a total reimplemention.  This means breaking C extensions, of which both PyPy and the Graal implementations propose novel APIs for native extensions.  It also means ditching the C codebase, which isn't what mainline devs want to do.
    The goal of the mainline JIT was to focus on easy performance gains while maintaining full compatibility.  The tradeoff being that it would not be as performant as what PyPy et al can offer.  But they have been unable to do either and the other devs aren't excited about maintaining it.
