  author: mort
  text: |-
    JITs aren't inherently "good at" anything other than eliminating bytecode instruction dispatch cost, which isn't where most of Python's slowness comes from. You need to build out a system to track common runtime shapes of values, you need a system to build monomorphized versions of functions for common input shapes and bail out if a monomorphized function detects that the input isn't of the expected shape, and on top of that you need a good optimizing compiler back-end. All of that is a lot of work which can be done better and worse.
    JITs can be good at optimizing things that look like Python, but they don't have to be. If you have a decade and a team of dedicated compiler engineers you'll get something with excellent performance. If you do the bare minimum to have something that's legitimately a JIT you'll have maybe a couple percent performance improvements from not having to spend time dispatching to the right code block for every bytedoce instruction.
    I wrote about such a "minimum effort" JIT compiler here: https://mort.coffee/home/fast-interpreters/#h2-final-step-a-compiler -- it takes the C code that you'd be dispatching to and generates it instead, then compiles it with GCC. Now I see a huge speed-up with my toy bytecode language but that's because it's low level; an add instruction is, "pop two 32-bit ints from the stack, add them, push the resulting 32-bit int onto the stack". As a result, just getting rid of the dispatch overhead is a huge win. Python's add instruction is more, "pop two object references off the stack, do a hash map lookup for the string __add__ on the first object's class, call the resulting function with the two object references as parameters, push the return value to the stack". That's such a monumental amount of work that it dwarfs the time it takes to dispatch.
