  author: aengelke
  text: |-
    JITs aren't inherently "good at" anything other than eliminating bytecode instruction dispatch cost

    Instruction dispatch usually isn't the only or the most expensive part of an interpreter compared to JIT-compiled code, it's also that all values, including constants, are practically forced into memory and need be referenced indirectly. Having fewer stores/loads and being able to use registers can give similar performance improvements like eliminating the dispatch overhead. Store-to-load-forwarding of CPUs can't keep up with the amount of stores/loads and memory renaming (where the CPU keeps the physical register of a stored value for a later load) doesn't work, because it is not trainable on the interpreter code.
