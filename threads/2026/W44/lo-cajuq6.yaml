    Beyond what matklad has described, I think another complicating factor is that a substantial portion of Python's ecosystem depends on native extensions and those extensions have been (and still are, I think?) deeply intertwined with CPython implementation details. This tends to make things interesting for JITs which may want/need different internal structures for performance reasons.
    For example, PyPy has long been able to show decent speedups over CPython... as long as you're using pure Python code. Once you start dealing with native extensions, though (assuming they're even compatible in the first place), you can see that speedup shrink quite significantly (or even go negative depending on what you're doing) due to PyPy needing to pessimize and/or do extra work to provide a compatible interface for the extension.
    This kind of thing isn't exclusive to Python - Java's JNI has a per-call overhead (though IIRC the new foreign function interfaces are supposed to be somewhat better?), C extensions present optimization barriers to Ruby's YJIT, etc. However, languages like Java and JavaScript rely far less on native extensions than Python does and so that particular pain point doesn't affect them nearly as badly. I'm admittedly not as familiar with Ruby and PHP's ecosystems so I don't know how far this extends to them, though.
