  author: District5524
  text: "In EU continental law countries, while lawyers are often not seen as officers
    of the court (that&#x27;s a common law thing), they are still seen as cog (&quot;participants&quot;)
    in the justice system, so a kind of elevated cooperation requirement is expected
    from lawyers compared to laypeople. \nAnd any such attempt like this with these
    Brazilian guys would probably result in being disbarred or something very close
    to it. And that should be expected and normal - you should not have any special
    rights in the justice system as being a lawyer if you&#x27;re trying to abuse
    that and not play by those rules.\nThe measures are markedly different between
    countries.\nLike, in England, if your client would be lying to the court (like
    under oath) and you, as a lawyer, knows about that, they expect you to decline
    to represent the client. And if you&#x27;re not, you&#x27;ll be in breach of the
    Code of Conduct and will face disciplinary measures. See 1.4 of <a href=\"https:&#x2F;&#x2F;www.sra.org.uk&#x2F;solicitors&#x2F;standards-regulations&#x2F;code-conduct-solicitors&#x2F;\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.sra.org.uk&#x2F;solicitors&#x2F;standards-regulations&#x2F;code...</a>\nThis
    means being an officer of the court.\nBut that&#x27;s not the case in Hungary.
    In a criminal case, the lawyer has to represent whatever the client tells the
    lawyer to do so, even if that&#x27;s doubtful: <i>&quot;8.12. In the performance
    of their duties, a defense attorney must not take a position that contradicts
    their client’s account of the facts. Even where the client denies the allegations,
    the attorney must not engage in any conduct that might create the impression that
    they harbor doubts regarding the absence of their client’s criminal liability,
    or that might suggest the defendant’s guilt.&quot;</i>\nSo, what it means to be
    a lawyer is quite different from country to country, but this kind of conduct
    made by the guys in this case goes against granting lawyers any special rights
    in any jurisdiction, so should normally not be allowed."
