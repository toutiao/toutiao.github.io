  author: holgerschurig
  text: 'Well, they can do things that normally US americans never do: look at what
    other countries do.<p>High tides aren&#x27;t new, and there are areas in the world
    that battle them since decades. E.g. at the north sea in Germany.<p>The the governments
    gave money to their universities and they made studies: how would a high tide
    impact the area?  Some of the impact was obvious, since there have been disastrous
    floods. But some are not, e.g. of the economical impact. And then they again put
    money into universities, to let them study hydrology and water-related civil engineering
    to a much higher degree.<p>And so we got more modern versions of dams, the harbours
    and naval bases were protected. Even the rivers were protected, since a high tide
    travels upwards the river. See for example the <a href="https:&#x2F;&#x2F;de.wikipedia.org&#x2F;wiki&#x2F;Eidersperrwerk"
    rel="nofollow">https:&#x2F;&#x2F;de.wikipedia.org&#x2F;wiki&#x2F;Eidersperrwerk</a>
    (sorry, didn&#x27;t find an english version -&gt; look at the pictures, learn
    a foreign language, use LLM translation)<p>But ... all of this is weak compared
    what the Dutch did regarding hydrology. They not only made protection buildings,
    but they also made buildings to convert ex-ocean into arable and livable lands.
    One large example is e.g. <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Delta_Works"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Delta_Works</a><p>So
    if you look for people that are good at studying the impact of floods (civil and
