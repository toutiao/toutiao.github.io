  text: |-
    Thanks so much for your thoughtful feedback! A lot of what you asked I had answered in my initial opening comment (which got flagged).<p>The name &quot;IDR&quot; and your concept is very interesting, very cool! You are right that we have a lot in common.<p>My framework, ADRs4AI, belongs to the practice of deliberative programming, which I see itself as belong to &quot;epistemic continuity&quot; — and your focus on &quot;intent&quot; is really key and like-minded.<p>Now part of the reason the framework is structured the way it is, is so the deliberation record is reconstructible: The decisions that are made in a given context, have all their inputs and boundary conditions documented such as they can be revised with ease (within the same project, or when ported to another).<p>But the other part is: I realize that I get more out of agents by trying to zero in on what I really care about than on micro-managing every technical aspect or every aspect of implementation. I try to give the agents the most enjoyable design space possible, to let them organize their work and their implementation as they want. I try to focus on hyper-specifying and describing what is necessary to support my actual design goals.<p>The use case is that this allows me to program much faster. I&#x27;ll be posting more, but you can already look at:
    - The Awesome ADRs for AI list: <a href="https:&#x2F;&#x2F;github.com&#x2F;ADRs4AI&#x2F;awesome-adrs4ai" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;ADRs4AI&#x2F;awesome-adrs4ai</a>
    - The frontier model observatory (one full record of which is included on the front page of the website): <a href="https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;frontier-model-observatory" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;frontier-model-observatory</a>
    - And I&#x27;ve used this retro-actively and from now on to make the maintenance of a popular GitHub Actions more sustainable: <a href="https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;free-disk-space&#x2F;issues&#x2F;55" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;free-disk-space&#x2F;issues&#x2F;55</a><p>I hope this provides some elements to your questions — please let me know if you have any more thoughts or questions.
