  text: |-
    I understand, and I totally get where you are coming from: My initial attempts had &quot;ceremony&quot; that was not actually useful, and it took several attempts for me to understand what actually <i>is</i> useful.<p>A talk from Google Deepmind I heard at Princeton (&quot;We Can&#x27;t Understand AI Using our Existing Vocabulary&quot;) argued convincingly that the problem we encounter with models is one of total incomprehension. We are two very different ways of perceiving, processing, and thinking. We need to create more surface for communication and exchange, we need scaffold conversation more.<p>The models are trained to be cybernetic: To take your wishes and make it their command with as little interruption as possible. Even if they&#x27;ve now been encouraged to surface some questions, there&#x27;s so much that is just taken away and that is decided. If you are interested in speed that&#x27;s perhaps useful, but there&#x27;s also a design space that is foreclosed from you that way.<p>At any rate, the models here are encouraged to:
    - Structure the braindumps of the human, flesh them out and resolve any open questions they can on their own
    - Surface, to the human, the tensions they can&#x27;t resolve alone under the form of ORRCF questions<p>This is precisely calibrated to become a medium that, far from being about ceremony, is about resolving misunderstandings in the present.<p>Over time, the models get to know you not just by your instructions of what to do, but also by you providing more definition to your own thinking, such that it becomes easier for them to generalize it across new decisions and (if you import records) across new projects.<p>Re: your &quot;despite specific instruction&quot;, yes, teachability is a big deal: I&#x27;ve been working most of the last few months putting together skills, MCPs, etc., and it&#x27;s clear that providing granular and expansive documentary support is important. I suggest the plugin, adrs4ai&#x2F;plugins, that you can already install and that I hope to be on the Anthropic Marketplace eventually!<p>Thanks for your interest and your thoughts, and I&#x27;d be interested if you have any more!
