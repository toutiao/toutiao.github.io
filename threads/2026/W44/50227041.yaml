  text: 'Thanks so much for your time and feedback!<p>Thanks so much for sharing Matt
    Pocock as a reference. I didn&#x27;t know about him, and so I spent a couple of
    hours looking at his materials this morning — as you say there are a lot of versions
    of this out there, but this is particularly well done as far as I could tell,
    and I&#x27;m really grateful you helped cut through the noise for me! I am going
    to continue looking at this, but in the interest of giving you something tangible
    back:<p>From what I could tell Pocock uses ADRs in their typical form, and only
    after a decision has been made.<p>In ADRs for AI, the record is written during
    deliberation: The model structures an initial braindump (from a file or chat audio
    dump for instance) into a record with readback and ambiguities surfaced through
    questions with the ORRCF format (Options, Recommendation, Rationale, Confidence,
    Falsifier) and a human approves the recommendation or overrules it with more detail.
    There is a lot of tooling (MCP server, plugin, CLI, extension, iOS) because the
    record is a parsable, and analyzable, which, allows for its granular referencing
    and upkeep.<p>I&#x27;ll work on your other questions. Thank you again for the
    reference and feedback.<p>PS: I think the other thing is: Part of my target audience
    are people who have never programmed before. This is scaffolded to be &quot;vibe
    coding but with longevity.&quot; But it requires a different kind of effort —
    it&#x27;s <i>deliberative programming</i> because for best results it requires
    you to be able to articulate the why behind your decisions. But that&#x27;s something
    people who don&#x27;t code can oftentimes be good at, for instance.'
