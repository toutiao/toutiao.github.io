  text: I&#x27;ll note - it&#x27;s possible to get something out of LLMs that&#x27;s
    readable, e.g. ADRs4AI is a method plus tools for recording the decisions you
    make while working with an AI coding assistant. As you work, the AI writes decision
    records into your repository. When it needs your input, it writes a question with
    options, a recommendation, its reasoning, and its confidence. You answer, often
    in one word, from VS Code or a phone app. The reasoning and your answer stay in
    the repo, so future sessions, with you or another AI, can see why things were
    done.<p>But it doesn&#x27;t come out without the context to guide it (prompting&#x2F;skills&#x2F;etc).
