  author: azeirah
  text: If you adopt ADRs, you also need to adopt the practice of keeping them up-to-date
    and saying which ADRs are superseded and&#x2F;or deprecated and by what newer
    ADRs.<p>An ADR directory is an immutable append-only log of transactions over
    the architecture, if the reduction operation over the set leaves a state with
    contradictions, then your set of ADRs is not well-maintained.<p>Not saying this
    is a fault of the devs, I think it&#x27;s a fault of the people teaching ADRs
    and telling everyone they&#x27;re great and you should adopt them. They take time
    to maintain and keep coherent.<p>If your team doesn&#x27;t have processes to do
    this, then it&#x27;s like a bank account that everyone can write to, but when
    the moment comes to withdraw money from it, it turns out a lot of the writes were
    done with monopoly money instead of real money, and you&#x27;re suddenly in the
    red.<p>There are no easy shortcuts.
