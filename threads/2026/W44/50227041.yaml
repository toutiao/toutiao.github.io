  author: lumbroso
  text: 'This is so well said, thank you so much for summarizing it thusly in this
    thread!!<p>I completely agree, on everything: The records are not a one-and-done
    deal, they have to be maintained over the lifecycle of the codebase.<p>This methodology
    is trying to introduce records in the context of a practice in which they are
    maintained and used.<p>To your point, there are two aspects of this methodology
    that make it more sustainable:<p>- the entire corpus is deep-linkable at a granular
    level, and using path independent references — this allows interconnecting, referencing
    and ultimately ensuring the records and code keep strong mutual relevance by proximity<p>-
    the dense practice of including the why with a lot of granular detail, including
    discussions that built up to a final decisions (and what was considered but ruled
    out), this provides dense semantic context that helps future models that have
    no context almost become as knowledgeable about the architectural deliberations
    as if they had been there — this keeps the entire worth its cost of maintenance,
    because it provides what I call &quot;epistemic continuity&quot;, a strong connection
    between the implementation and the rationale behind everyone of the design choices.<p>The
    idea is: &quot;We can build code with models so quickly now, how do we ensure
    it&#x27;s sustainable and well-architected and maintainable?&quot; And this framework
    is trying to answer it by saying: &quot;There is a methodology that introduces
    a cost overhead of O(1), but it provides long-term continuity guarantees.&quot;<p>Thank
    you again for stopping by, and providing the benefit of your experience with ADRs.'
