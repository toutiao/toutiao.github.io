  text: It sounds like a good idea, but having used this approach in a professional
    codebase with dozens of contributors, I can tell you firsthand it will start to
    degrade the code you get from a model surprisingly quickly. The agent will start
    to feel confused by the various conflicting &quot;guardrails&quot; and &quot;constraints&quot;
    the ADR is supposedly documenting. You will ask the agent why it did a particular
    contrived thing and it will cite various flawed or outdated assumptions.<p>It&#x27;s
    the same old problem of doc rot, but now the docs are blindly obeyed. It sounds
    simple to just keep the docs up-to-date, especially with AI, but that approach
    results in an unreadable AI slop trough.<p>I&#x27;m still unsure what to recommend
    instead, especially in a collaborative setting.
