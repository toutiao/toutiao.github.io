  text: 'Thanks for your interest, and thanks for agreeing that decision records like
    ADRs belong in version control.<p>I think it can make sense to have them next
    to the source code, but this introduces a couple problems like fragmentation of
    these records (perhaps mitigated if they follow naming conventions like test records
    do in certain languages&#x2F;frameworks), and it introduces guesswork to know
    where cross-section work is documented: I would be curious how you&#x27;ve resolved
    that?<p>In this framework, the records live in docs&#x2F;adr, and we&#x27;ve solved
    the problem of tight integration with deep-linking (adr:&#x2F;&#x2F;v1&#x2F;repo&#x2F;&lt;owner&gt;&#x2F;&lt;repo&gt;&#x2F;adr&#x2F;&lt;n&gt;#&lt;anchor&gt;)
    and path-independent references. These, or shortcuts (like &quot;adr-0002#qst-how-do-we-do-X&quot;),
    are used in the code to avoid the problem you&#x27;re correctly referencing of
    <i>epistemic drift</i>.<p>Re: Y-statements, thanks for the reminder, I forgot
    about those (for other readers, it&#x27;s a template sentence: &quot;In the context
    of …, facing …, we decided …, to achieve …, accepting …&quot;). They are completely
    compatible and complementary with the decision section ORRCF format (I noticed
    the acronym is explained in the top comment so I won&#x27;t keep explaining it).'
