  author: vikrantrathore
  text: 'Great to see another way to do specification. I also created So created guidedog:
    <a href="https:&#x2F;&#x2F;github.com&#x2F;insanai&#x2F;guidedog" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;insanai&#x2F;guidedog</a>
    for working with multiple AI providers, inspired by PEP, RFC and Oxide RFD.<p>I
    worked a lot of Python PEP which was adopted by rust and java later and working
    with RFC and RFC process since 1990&#x27;s. Then later saw RFD by Oxide based
    on RFC. Learning from all of them created guidedog, the philosophy is if its good
    for human it is automatically very good for AI (most LLM are trained on it).<p>guidedog
    supports RestructuredText (since its specification) as core markup with support
    for markdown. Its modeled after sphinx but can work for documentation, discussions
    (what you call as Deliberation Records) and can be a static site generator. So
    you don&#x27;t need 3 tools one single tool a cli which can do all three. For
    doing this I worked by porting docutils and then building own parser and compiler
    in rust.<p>This process so far worked extremely well for me as it is not just
    very good for AI, but provides complete control to humans. Also I like completely
    offline reading experience on paper. So this has first class pdf support.<p>If
    you look at repos in insanai many projects used this process with AI and worked
    well. Just one hard work this process needs for human agency is to really read
    each discussion properly and sometimes they can be long. But its a very small
    work which can help later with verification and even writing documentation for
    what&#x27;s being built.'
