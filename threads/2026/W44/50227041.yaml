    No, you&#x27;re not dense at all: Thank you so much for the feedback. It&#x27;s more that when you&#x27;re fish you&#x27;re like &quot;what do you mean &#x27;water&#x27;?&quot;<p>Point taken that I need to change my materials ASAP.<p>In my world, ADRs = Architectural DELIBERATION Records, and the emphasis is on being dense and on capturing the process over (or rather in addition to) the outcome. From complexity theory, we know that process is more generative than state.<p>An ADR, as Architectural DECISION Record, is a practice predating but popularized by Michael Nygard in early 2010s. It focuses on writing down the reason (and other options considered) for important decisions.<p>My framework is inspired, but different in a few respects but including:
