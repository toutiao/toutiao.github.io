  text: |-
    Thanks for your question.<p>Re: waiting over a year: Posting, announcing stuff is very intimidating. Over that year, I kept thinking this was trivial and would be reinvented just around the corner, and to just try it on another project — but now, some close people in my life, who never programmed before, have been able to build durable software with this, and it makes me realize the biggest opportunity is to extend it to newcomers. But the last mile of documentation is hard, especially given I am neurodivergent and steeped in this, which is why getting your perspective is so helpful!<p>Re: design decisions settled and thrown out. There&#x27;s so many! I dogfooded this across several dozen projects, and several of them are public (see the awesome-adrs4ai list). However I&#x27;ll give you one example:
    - The real beginning of this is wanting to graft conversations, i.e. &quot;question&#x2F;answers&quot;, i.e., deliberations, directly in the records, as first-class citizens.
    - The QST&#x2F;ANS tokens were in the first commit, 2025-12-08, initially as &quot;greppable&quot; QST: and ANS:
    - The idea of falsifier appeared early in 2025-11-12, but initially the formalization of the format of questions was ORJ, in 2026-04-17 I think, with Opinions, Recommendation, Judgment, which drifted to Justification and was replaced by Rationale when ORRCF arrived 2026-08-15 (because the &quot;J&quot; was proving to difficult to avoid slurs and vulgarities in the acronym)
    - Finally, in the beginning there was a strong sense that the template should be self-documenting, and it has a &quot;Quick Reference&quot; that provides ready-to-use &quot;grep&quot; command-lines. But since then, between the VS Code extension, the MCP server (on npm, @adrs4ai&#x2F;mcp), the CLI tool (on npm, @adrs4ai&#x2F;docket), the iOS Client, and the upcoming Android client, and with the various skills, the idea of documentation the eco-system self-sufficiently in each document has been deprecated.<p>This evolution, its reason, is documented in the ADRs of the extension, but for now, I&#x27;ve published the extension stripped of its ADRs (I am planning to make them public in the foreseeable future).<p>For a live example of an assumption that was reworked live, Porthole is a VSCode extension I created so the models could give me instructions to follow (i.e., sign-up to X, go get token Y, create database Z) for actions beyond reach of MCP servers. Several times, the model made assumptions and asked me to test them one by one, and sometimes, they didn&#x27;t pan out and course was changed, such as here:<p><a href="https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;porthole&#x2F;blob&#x2F;main&#x2F;docs&#x2F;adr&#x2F;0025-defend-floating-windows-against-editors-other-extensions-put-there.md#qst-check-guard-does-the-adr-managers-open-in-file-now-end-up-in-the-main-window-at-the-questions-line-with-the-floating-window-back-to-one-tab" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;porthole&#x2F;blob&#x2F;main&#x2F;docs&#x2F;adr&#x2F;002...</a><p>Hope that&#x27;s useful :) Thanks again for the question!
