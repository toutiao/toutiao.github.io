  author: lumbroso
  text: 'Thanks for your interest, and your comment, and your encouragement, and your
    feedback.<p>First, there&#x27;s azeirah&#x27;s excellent comment re: maintenance
    being a necessity (and paying off!).<p>Second, I really agree with you, in the
    sense that agents suffer a lot from contradictory, opposite requirements; but
    I would argue that they also suffer from under-specification, and that these two
    risks actually overlap (underspecification in the present can lead an agent to
    make choices that in the future will lead additional underspecification to have
    very little relevance or be contradictory with choices the agent has already made).<p>Part
    of the importance of the records in my methodology as I advocate them is that
    they be <i>epistemically coherent</i>. It&#x27;s not a series of &quot;do this,
    do that&quot; or &quot;requirement X, Y, Z, execute W, T, U&quot;, it&#x27;s more
    of an extended explanation for what our situation is, what the idea is, how we
    are putting it into place, why, and what are the non-obvious choices we are making
    and why are we making them.<p>The agents, in my experience so far, don&#x27;t
    get confused:<p>- they only read ADRs that are relevant to their work;<p>- when
    importing ideas&#x2F;decisions from an ADR cross-project, the models (or their
    sub-agents) are never confused about the differences in context — they understand
    that project A (TypeScript, web, hosted on GitHub Pages) is different from project
    B (Rust, CLI, locally run) and how to adapt the imported decision accordingly.<p>Part
    of it is because, in the way that I&#x27;ve been building and practicing this,
    there&#x27;s a requirement of epistemic coherence and epistemic consistency —
    everything is explained, nothing comes like a Deus Ex Machina which the model
    then has to extrapolate (and possibly be wrong about). In my experience this doesn&#x27;t
    lead to models hallucinating requirements.'
