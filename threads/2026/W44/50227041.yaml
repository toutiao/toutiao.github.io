  text: |-
    Thanks for the feedback Diego.<p>I&#x27;ll keep on iterating on the website.<p>However, I read your principles:
    <a href="https:&#x2F;&#x2F;diegoux.com&#x2F;blog&#x2F;ai-slop-manifesto&#x2F;" rel="nofollow">https:&#x2F;&#x2F;diegoux.com&#x2F;blog&#x2F;ai-slop-manifesto&#x2F;</a><p>And I follow them all. The use of AI is disclosed — a complementary part of my framework is how I work with individual sessions that are named. I can explain everything that is mentioned; I&#x27;ve dogfooded this methodology for the past year, after several decades as a professional programmer, because I was concerned it was interesting enough. But it has made me produce better quality software, more of it, more interconnected, better planned, and focusing more on architectural complexity (which is what I&#x27;ve come to understand as the more general concept behind software modularity, etc.). From the many traces of conversations that spans hundreds of thousands of words that I&#x27;ve written or dictated, you can see that I&#x27;ve used this to think more, not to replace my thinking.<p>Furthermore, part of this entire framework is based on the &quot;agentability&quot; of using git as a storage for almost everything, in particular, for discussions that happen usually elsewhere:
    <a href="https:&#x2F;&#x2F;diegoux.com&#x2F;blog&#x2F;agentibility&#x2F;" rel="nofollow">https:&#x2F;&#x2F;diegoux.com&#x2F;blog&#x2F;agentibility&#x2F;</a><p>One of the demo projects (of which you can see the full deliberation records) is called &quot;moreover&quot;, it&#x27;s a pager for LLMs:<p><a href="https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;moreover" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;moreover</a><p><a href="https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;moreover&#x2F;tree&#x2F;main&#x2F;docs&#x2F;adr" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;moreover&#x2F;tree&#x2F;main&#x2F;docs&#x2F;adr</a><p>In the same way that git provides a track-record, with authorship, timestamps, reversibility, etc., for free, the moreover page is about putting a guardrail around agents in bash, of reading only the beginning of a document and forgetting the rest.<p>I suggest you take a look directly at the template:<p><a href="https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;human-ai-collaboration-template-A&#x2F;" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;human-ai-collaboration-template...</a><p>&quot;Use the template&quot;, then open your favorite harness and dump an idea for a project and ask your model to configure the template and register themselves, and install the plugin.
