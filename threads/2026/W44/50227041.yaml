  text: |-
    I hear you. Would you prefer a human read video tutorial, or a turnkey example to try?<p>Re: the distinction from Nygard&#x27;s ADRs: First using them already systematically is a good idea, I&#x27;ve been doing it in public since at least 2021 — and like you, I wouldn&#x27;t have written about that either:
    <a href="https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;templated-exceptions&#x2F;blob&#x2F;main&#x2F;docs&#x2F;adr&#x2F;0001-use-markdown-architectural-decision-records.md" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jlumbroso&#x2F;templated-exceptions&#x2F;blob&#x2F;main&#x2F;...</a><p>What is different here, first this an entire toolkit and it contains a lot more, but specifically on the ADRs: Here, there are several templates (seeds and ADRs among others), and all of them support QST&#x2F;ANS pairs. The agents raise questions, in the ORRCF (Options, Recommendation, Rationale, Confidence, Falsifier) format, and the human(s) approve or override. Nygard&#x27;s records are written by humans after a decision.<p>And yes, I&#x27;ll defend the phrase: &quot;Your thinking stops disappearing. Your decisions start compounding.&quot;<p>This has been my experience: Instead of telling my agents every detail of what I want, now, I explain the high-level ideas, they surfaces things they aren&#x27;t sure, I see where my vision needs filling out (through the ANS&#x2F;QSTs and iterations), and then, that record, the one that is the product of fine-grained iteration, is a record that I can point to in the future.<p>Instead of re-explaining, I&#x27;ll say &quot;Pull that ADR re: the dashboard in project X&quot; and the model will read it and, because they see the full context, the deliberation trace, they see what applies project Y, and what doesn&#x27;t, and they are able to generate a new, derived ADR with the appropriate QST&#x2F;ADR pairs. This means instead of reexplaining myself, taking the time to explain myself once compounds over time.<p>&quot;Your thinking stops disappearing&quot; what that means is when I first started using Claude Code, I was horrified at the compaction that happens without warning (even if it&#x27;s one way to preserve long sessions, in a way); but also I realized that the JSONL are deleted after 30 days, so literally, the exchanges I had in my first few sessions, where I faced interesting problems for the first time, and iterated over several solutions, that is gone!! And it was valuable, I encountered problem spaces at that time, that I haven&#x27;t really spent as much time on since.
