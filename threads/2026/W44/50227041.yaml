  text: 'Thanks a lot for your interest, your feedback and comments. Most importantly:
    Could you clarify which screenshot you are referencing to specifically? A URL
    would be perfect. Thanks!<p>Re: the rest of your comment:<p>When you say &quot;piles
    of non-ADRs labeled as ADRs&quot; — as I explained in another comment, this is
    literally true: The record format I am introducing are called &quot;Architectural
    Deliberation Records&quot; and while they are inspired by &quot;Architectural
    [or Architecture] Decision Records&quot; (Nygard), they are not the same thing.
    A &quot;Deliberation&quot; is the sequence of resolutions of points the agent
    could not resolve on their own (for a variety of reasons, including technical
    or contextual or because of underspecification), is not an &quot;architectural
    significant significant&quot; (at least not at the threshold intended when all
    writing is human writing) which is the trigger point of traditional Architectural
    Decision Records.<p>The resulting deliberation records are intentionally <i>much</i>
    more verbose, and these <i>deliberation</i> records are intentionally intended
    to be used <i>much</i> more frequently than traditional <i>decision</i> records,
    to capture all the thought process. This is inspired from complexity architecture&#x27;s
    emphasis on process over state&#x2F;outcome (i.e. process description vs state
    description).<p>The agents never &quot;wade&quot; through the whole folder: Agents
    use single Architectural Deliberation Records (ADRs hereafter) when working a
    feature; they also refer to other ADRs when they encounter deep-links in the ADR
    they are reading or code, or other references.<p>You&#x27;re making me wonder
    whether I should coin a completely new acronym, but I&#x27;ve been using this
    one for so long — at first because I thought I would be using exactly the MADR
    but eventually my needs outgrew it.'
