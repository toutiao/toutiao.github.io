  author: buran77
  text: "&gt; Unfortunately, Arecibo received no such inspections.<p>With or without
    the inspections, the problems Arecibo faced were of a more serious nature. They
    are hinted in one of the findings: the non-replacement, repair or bypass of the
    sockets where large slips were observed.<p>The telescope received minimal funding
    for maintenance over the two decades prior to the collapse despite signs of increasing
    damage observed in the various inspections. A lot of factors probably contributed
    to this (political climate, the dropping importance of Arecibo compared to other
    science instruments and missions, and so on) but the result was that the structure
    was left with slow but sure decay.<p>I met a couple of people who worked with
    the telescope including on location and they told me that the general feeling
    among the people who had this on their minds (most people who ever had anything
    to do with Arecibo cared about the science not the instrument) was that the decay
    was slow but certain and catastrophic failure was bound to happen sooner or later.
    Like a car receiving no maintenance despite the check engine light being on for
    a decade."
