  author: '0xbadcafebee'
  text: The pictures on page 25 seem to show how this socket design fails. First because
    they didn&#x27;t evenly distribute the wires in the socket (seriously??)... And
    second, the shear on the zinc from the compressed wire bundle is essentially a
    narrow rectangle in the direction of the cable with almost all the force concentrated
    in a narrow forward bit, not really distributed evenly through the socket, because
    of the wire ends splaying outward and not being equally distributed. I guess the
    idea is the rest of the zinc towards the back provides a counter force on the
    front part, but there&#x27;s a whole lot more zinc in the back pulling on a smaller
    amount in the front. The tight bundle and the conical shape is great for a tight
    install, but doesn&#x27;t help distribution of load. Compare to the Golden Gate
    Bridge wire termination (<a href="https:&#x2F;&#x2F;c7.alamy.com&#x2F;comp&#x2F;2RY9PKW&#x2F;golden-gate-bridge-plans-illustration-2RY9PKW.jpg"
    rel="nofollow">https:&#x2F;&#x2F;c7.alamy.com&#x2F;comp&#x2F;2RY9PKW&#x2F;golden-gate-bridge-plans-i...</a>).
    The zinc creep is definitely bad, but it seems made worse by an uneven distribution
    of load in the socket, in addition to all the other problems...<p>tl;dr once the
    outer wires break in the socket (in part due to zinc creep, but also potentially
    more load on them), the &quot;glue&quot; keeping the wire bundle connected to
    the socket is broken, the former wedge keeping the core in place becomes a straight
    line, and you have a core ready to pop out.
  score: 0
