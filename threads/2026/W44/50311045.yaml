  author: peptidebureau
  text: 'The usual termination efficiency tables answer this in numbers. A properly
    poured spelter or resin socket is rated to hold 100% of the rope&#x27;s breaking
    strength. A mechanically spliced eye with a pressed sleeve is rated around 90
    to 95%, a wedge socket and wire rope clips about 80%. On strand around 3 inches
    thick an eye also needs a huge thimble, because bending stiff strand around a
    tight radius costs strength as well.<p>So for the biggest structural strand the
    socket is the default, which is why Arecibo got so much attention: sockets that
    slipped and failed well below their rated load, not an inherently weak type of
    end.'
