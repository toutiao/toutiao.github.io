  author: robotmay
  text: 'Sigma are far and away my favourite photographic company right now, for a
    variety of reasons, but top of the list has to be that they&#x27;re doing something
    different. What they&#x27;re doing might not be for you but at least they&#x27;re
    not just making another camera the same shape as every DSLR&#x2F;mirrorless camera
    going back 25 years.<p>From a personal perspective, they were the only company
    that was interested in loaning me gear to review from right at the start of me
    making YouTube videos. Many other companies continue to refuse to talk with me
    even when I&#x27;ve found serious bugs.<p>The frustrating part is that they&#x27;re
    currently not releasing full-frame lenses on Nikon&#x27;s Z mount, likely due
    to a licensing issue with Nikon. And that&#x27;s frustrating because for my needs,
    there&#x27;s no &quot;pro&quot; level camera on L mount that I can use, and Sony
    hobble third party lens manufacturers&#x27; maximum burst speeds (also I don&#x27;t
    like Sony&#x27;s AF but that&#x27;s another story). I ended up selling a lot of
    my L mount gear and consolidating on Nikon for professional work.<p>But I did
    buy myself a Sigma Bf. The Fp series is excellent but the Bf is beautiful. It&#x27;s
    such a fundamentally weird camera that it reminds me of camera design back in
    the 60s-90s where companies went absolutely nuts with camera ideas. Is it my most
    practical camera? Very much not. Is it the camera I use to take pictures of my
    cat? Absolutely.<p>I&#x27;m always excited to see what Sigma comes out with. Their
    optics and manufacturing have moved on dramatically since Yamaki-san took over
    in 2012, and they&#x27;re constantly bringing out really interesting new optics.
    I&#x27;m very excited to try out that new 50mm f&#x2F;1.4 CL they announced, personally.<p>I
    highly recommend watching videos on the ProcessX YouTube channel that shows their
    factory and processes: <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=qx14Juo4AQo"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=qx14Juo4AQo</a>.'
  score: 0
