  author: BryantD
  text: The name of the mountain was changed. Note that mountains aren’t bodies of
    water, so the link is not relevant to this question, and Denali isn’t bordered
    by multiple countries, so Google presumably feels that the US has the right to
    name it.<p>And you’re getting downvoted because, as per the above, it’s an irrelevant
    question.<p>But I’ll indulge you just a bit more. The principle here is not “renaming
    things is bad!” The principle is that indulging an authoritarian who’s trying
    to unilaterally rename territory his country doesn’t own is bad, particularly
    when he’s doing so in a fit of pique (Lake Ontario).<p>As you may or may not be
    aware (I wasn’t), the Alaskan state legislature passed a bill in 1975 requesting
    that the mountain be renamed. Trump didn’t even try to get Congress to pass any
    bills before renaming things.<p>Hope this all helps clarify and gives you some
    reason to rethink the MAGA propaganda that tries to equate Denali and the Gulf
    of Mexico.
