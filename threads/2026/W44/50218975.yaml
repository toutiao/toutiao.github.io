  text: Britannica actually had a great website during the dot com era - hyperlinked,
    very browsable, and definitely had that semi-addictive &quot;rabbithole&quot;
    quality.<p>The hurt themselves badly by imposing a really annoying paywall just
    as Wikipedia was beginning to take off. A hybrid model with tiered access (maybe
