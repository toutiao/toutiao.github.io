  author: jcranmer
  text: Yes, people use it in practice. But it&#x27;s not being used for the thing
    you&#x27;re thinking of.<p>RGB is fine for specifying a color. I mean, there are
    issues with RGB colorspaces and whatnot, but if you need to pick the background
    of a page or the color of text, there&#x27;s no real reason not to use RGB.<p>The
    problem with RGB is that it is really bad at color interpolation. You can&#x27;t
    take the average of the red, green, and blue components of two colors and expect
    a usable color in the middle to come out. Instead, you need to move to a perceptual
    color space. CIELAB is the old perceptual color space of choice; Oklab is the
    new perceptual color space of choice.<p>Color interpolation is needed for things
    like gradients or information visualization, where you need to say things like
    &quot;20% of the way between color A and color B&quot;.
