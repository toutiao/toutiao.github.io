  author: PennRobotics
  text: If you asked me to pick out bright bold blue (#0000FF) and told me the format
    was &quot;Lightness Chroma Hue&quot; with valid ranges, I would guess &quot;0.5
    1.0 240&quot;. Not only is this &quot;not visible on any monitor&quot; by a very
    large margin but the oklch.com calculator states the spec fallback color is Dell
    logo blue and not bright at all while browsers will render &quot;vibrant purple&quot;.<p>There&#x27;s
    not &quot;120 degrees of red, 120 degrees of green, 120 degrees of blue&quot;,
    so blue is not 240. Actual bright blue is hue 264. The &quot;0-255 RGB&quot; bright
    blue is 0.452 lightness, and max chroma on a really good monitor is something
    like 0.33. The lightness mostly makes sense, right? 0.5 is halfway between totally
    dark and completely washed out.<p>&quot;Ok, so chroma tops at at 0.33&quot; not
    so fast. You can crank up the chroma to 0.40 and still get either magenta (where
    lightness is around 0.74) or green (lightness around 0.78). So now you need to
    know a valid, nonlinear lightness range for each band of colors, because midpoint
    blue is different than midpoint red which is different from midpoint green.<p>From
    greyscale luminosity calculations and knowing about subpixels and bayer filters,
    I would&#x27;ve been able to guess that green is the color with the highest chroma,
    but then there&#x27;s bright magenta, neck-and-neck. Oh. Until I move the lightness
    slider down on the web color picker, and then everything (especially peaks) in
    the chroma channel shifts around dramatically... So much for intuition.<p>While
    OKLCH makes it really convenient to select colors with properties you like along
    a gradient, the nonlinearity means either memorizing a bunch of base colors, using
    a color picker, or converting from a system that is &quot;actually&quot; intuitive.
    I can&#x27;t really look at a trio of OKLCH numbers and predict the output color
    like I&#x27;d be able to with RGB, although this is mindful that RGB is also not
    linear (for the exact opposite reason as OKLCH) and I can only do that from decades
    of experience.<p>I&#x27;ll concede that magenta and bright green and bold blue
    don&#x27;t really have a place on the world wide web other than in a company logo,
    so these are outliers. Still, the OKLCH format is not what I&#x27;d call intuitive
    to a total beginner.<p>(Also, I&#x27;d very much not like to implement OKLCH calculations
    on a microcontroller until lighting companies start selling OKLCH LEDs.)
  score: 0
  posted_at: '2026-10-30T15:02:17Z'
