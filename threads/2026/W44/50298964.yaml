  author: Brajeshwar
  text: First, I confess that I had built quite a lot of CSS Frameworks and Design
    Systems in my early developer life. So, this is going to be more of a personal
    experience.<p>Ever since Coding Assistant LLMs became pretty good (2025-Q4 - 2026-Q1),
    I feel that it makes very little sense to continue to use pre-defined CSS Frameworks
    that &#x27;has everything.&#x27; Of course, it is still OK if the general team
    decides on one, and they are OK (such as the Tailwinds, MUI of the frontend world.)<p>I
    have used Foundation[1] and Bourbon[2] extensively. Mostly because I can break
    it down and take just what the project needs and keep it within a low CSS budget
    for any project.<p>With that in mind, in the 10+ projects that started for some
    of the biggest brands of the world, I just defined the CSS framework, design systems,
    design token, with room for extension as the project grows. Claude Code is my
    tool of choice for now and I just let it run overnight, tweak as the project scaffolds
    and finally takes about less than a week to have a complete CSS framework in just
    plain CSS, and JavaScript where it needs to talk to the broader frontend.<p>1.
    <a href="https:&#x2F;&#x2F;get.foundation" rel="nofollow">https:&#x2F;&#x2F;get.foundation</a><p>2.
