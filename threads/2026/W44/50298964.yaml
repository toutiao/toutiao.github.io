  author: chrismorgan
  text: 'Perceptual colour spaces are emphatically <i>not</i> “simply better”. They’re
    better for most colour mixing (which is of more limited application than you may
    think) and for some sorts of intuitions, but their shape is far more complex,
    not mapping to the actual screen gamut in any predictable way, making them highly
    obnoxious for colour selection, because it’s <i>super</i> easy to fall out-of-gamut
    without realising it (and I don’t know of <i>any</i> tooling that draws your attention
    to when that happens) so that its entire purpose is compromised, and they’re downright
    <i>atrocious</i> at handling vivid (near edge-of-gamut) colours.<p>Take bright
    yellows as one of the worst examples. Basically the <i>only</i> thing you can
    do with them is reduce the chroma: <i>any</i> other change will take you out of
    gamut. As the most extreme case, #ff0 is approximately oklch(0.968 0.211 109.77),
    and the following <i>minuscule</i> modifications will take it out of gamut: L
    + 0.0002, L − 0.0001, C + 0.0002, H − 0.009 or H + 0.025.<p>This is why the creator
    massaged them into a cube&#x2F;cylinder: <a href="https:&#x2F;&#x2F;bottosson.github.io&#x2F;posts&#x2F;colorpicker&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;bottosson.github.io&#x2F;posts&#x2F;colorpicker&#x2F;</a>,
    Okhsv and Okhsl. Those are much closer to being uniformly superior to sRGB.'
