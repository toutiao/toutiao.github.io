    ## lucaslarroche Oct 4, 2026 Maintainer

    v2.1.1 is the final release.

    Why Today, AI can generate lightweight, standalone, accessible HTML with just the CSS it needs, so a Minimal CSS Framework for Semantic HTML matters less than it used to. To stay relevant, Pico CSS would need a full rewrite: plain modern CSS instead of Sass, built on features it doesn't use today (OKLCH colors, cascade layers, Popover, anchor positioning) with fallbacks for older browsers, and a native compiler that strips unused CSS and makes customization easy. That would be a different project. Pico CSS stays as it is.

    What this means

    - Nothing breaks. npm, the jsDelivr CDN and picocss.com stay online for the long term.

    - The repositories are archived. No new issues, PRs or releases.

    - Pico CSS is MIT licensed. You're free to fork it and take it further. See community forks.

    - The Pico CSS name and logo are not covered by the MIT license. Please give your fork its own name, so users don't confuse it with the original.

    Thank you What started as a small side project ended up powering thousands of websites. Thank you to everyone who used it, opened issues, sent pull requests and wrote kind messages over the years.

