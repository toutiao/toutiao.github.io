  author: jerf
  text: Privatizing the losses doesn&#x27;t mean the rest of us are going to escape
    without a scratch. It just means that we let fail the things that are going to
    fail.<p>What makes this so politically unpalatable is that having constantly bailed
    out the last few cycles, everyone is now operating on the assumption that they
    will be bailed out, so many entities who in a more perfect world would know better
    have done a lot of stupid things, like pensions that have a lot of bonds that
    will go bad if the AI bubble collapses.<p>Frankly we&#x27;re looking at massive
    problems and upheaval at this point no matter what we do. But the advantage of
    not socializing the losses is that the signals of what needs to be changed go
    directly into the economy. Socializing the losses means that the signals get muted,
    confused, and mangled and people in the future end up doing the wrong things as
    a result.<p>Unfortunately, at this point I think the choice is between people
    clearly and forthrightly losing massive portions of their retirement as visible
    losses, or people deceptively losing massive portions of their retirement as the
    bailout creates massive inflation and their retirement is inflated until it has
    a fairly similar amount of losses. Unfortunately, it is a <i>feature</i> for the
    rulers that the bailouts obscure the losses and dampen the correct apportionment
    of blame, even as it destroys the underlying economy. Giving people clear, correct
    targets for their rage, the same process of correct pain apportionment the economy
    needs to become healthy again, would point people at the &quot;wrong&quot; clear,
    correct targets, and the clear, correct targets are the ones deciding whether
    or not a bailout occurs. Not just the literal lawmakers nominally making the call,
    but the entire system that makes the decision.<p>So plan on bailouts.
  score: 0
