  author: somenameforme
  text: Some countries like Iceland let their banks fail (in no small part because
    their total debt was something like 10x their gdp), and they even successfully
    prosecuted a number of executives. They got moderate slaps on the wrist but did
    serve some token time in prison as opposed to having to pay a ground-breaking
    fine of 5 minutes of revenue as is more typical. It wrecked their economy in the
    short-term but they were back to growth by 2011, and had a larger than ever economy
    by 2015.<p>But I think more than the one-off situation is also the precedent it
    sets. When you can bank on the government bailing you out (pun intended I guess?),
    it creates a perverse incentive of just trying to get as large as you possibly
    can, all foundation or principles absolutely be damned - because once you get
    big enough you win, even if you&#x27;re the biggest loser ever. And I do think
    that&#x27;s what we&#x27;re probably seeing with LLM companies.<p>Not that LLM&#x27;s
    a loser - it&#x27;s a revolutionary tech and will only become more so. But multi
    trillion dollar valuations for a product that has viable open competitors already
    available and whose operating requirements continue to plummet and will almost
    certainly continue to plummet? This is extremely amusing, but absolutely batshit
    insane. It&#x27;s like paying millions for a pretty flower because it&#x27;s novel
    in spite of the fact that you know, and everyone else knows, that once people
    start planting them there will be endless amounts available for negligible cost.
