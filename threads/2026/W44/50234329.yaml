  author: zbentley
  text: 'All true and fair. But I do like having the instrumentation API in your code
    speak wide events. Then have your telemetry config decide what you want to transmit
    as a verbatim big event, what you want to sample&#x2F;transmit as a metric, or
    a trace (or whether you, at the moment of transmission, need to go grab a few
    things out of the local tracing context stack and use them for preprocessing),
    and so on.<p>If you do all that on the client side (not in a sidecar, ideally:
    actually in your client code when deciding what to transmit) you have a fairly
    nice way to temporarily turn on e.g. rich trace recording to hunt a bug, or start
    spraying event bodies to a local file when debugging a troublesome service instance,
    and so on. The rest of the time, things can transmit a few big payloads and a
    lot of small metrics, and things stay cheap.<p>In other words, it&#x27;s easy
    to go from &quot;recorder.record_rich_typed_event(...)&quot; to capturing any
    or all of events, traces, metrics, or logs. It&#x27;s not easy to go from e.g.
    &quot;metrics.record_integer_metric(&quot;somemetric&quot;, 15)&quot; to recording
    a richer, more complex event in a pinch.'
