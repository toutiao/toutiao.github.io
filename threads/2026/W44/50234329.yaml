  author: viraptor
  text: 'What the author is saying in practice is: it&#x27;s nice to have Meta level
    funding for effectively infinite distributed storage and compute. In other areas
    of the industry where you want to stay profitable, metrics stay metrics, because
    you&#x27;re submitting 2 integers for an aggregate, rather than tens of megabytes
    of JSON logs per minute. Then you want to retrieve this in seconds on demand...
    so that&#x27;s either preprocessing (ongoing compute) or some serious parallel
    IO.<p>I&#x27;m glad the author likes wide events for everything. I do too. But
    once you try to justify the cost, you understand why it&#x27;s metrics, logs and
    (often sampled) traces.'
