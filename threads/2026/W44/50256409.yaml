  content: "# A faster way to compute signed 64-bit _floor division by constants_\n\n##
    _The missing chapter of Hacker's Delight_\n\n27 October 2026\n\n**What is signed
    integer floor division?**  \n_Signed integer floor division_ is where you do `a/b`
    and get a result that rounds towards `−∞`,  \nwhereas standard (_“truncated”_)
    signed division rounds towards `0`.  \nAs stated in Hacker's Delight: _“[I suspect
    that] floor division more often gives the result you want”_.\n\nThis article is
    about full-range floor division where the **divisor is known at compile time**.\n\nDespite
    the usefulness of this function, the world of _integer floor division_ is in shambles:\n\n-
    Mainstream compilers and many languages do not provide it natively _(eg. C/C++/Go/Swift)_.\n-
    Languages and software libraries that _do_ implement it seem to almost never use
    the fastest algorithms.\n- At least one highly prominent software library had
    a buggy overflowing implementation for over 4 years! \n- Typical online searches
    and LLM prompts usually only surface the slow algorithms\n- And finally, Hacker's
    Delight _(basically the bible on low-level computer math)_, has almost nothing
    to say about it!\n\nThis blog post aims to not only shine light on the fast algorithms,
    but will also **introduce a new fast approach** which, with ideal compilation:\n\n-
    **On ARM** , benches 10–20% faster throughput than existing algorithms for most
    64-bit divisors (occasionally tied), with equal or better latency\n- **On x86**
    , benches:\n  - ~5-10% faster throughput for around 80% of positive 64-bit divisors
    (60% of negative divisors)\n  - slower in the remaining x86 cases, and _usually_
    worse (but competitive) latency\n\nThe [benchmark](#benchmarks) section has a
    detailed overview showing per-divisor results over many platforms, for throughput
    and latency.\n\nIt works in all bit-widths, and may find use on some 32-bit or
    SIMD applications, but the biggest benefit is in 64-bit.  \nIt also can be used
    for faster positive-modulus, and faster \"Euclidean\" division _(differs to floor
    division for negative divisors)_.\n\n**Floor division can be much faster than
    you probably realise.**  \nBelow is a snapshot _throughput_ benchmark for division
    **by 86400** _(the number of seconds in one day)_, the kind of performance you
    can expect using most languages' built-in methods, vs fast alternatives outlined
    in this blog.\n\nNote: in the bar chart: lower = faster.\n\n**_Floor Div 86400
    throughput - ARM64 Chips_** As tested on MacBook Pro M4 Pro  \nand Snapdragon
    X1-26-100\n\n**Common**  \n_(Rust\\*, Zig, etc.)_\n**~2×**\n\n**Robison** _(2005)_\n**~1.1×**\n\n**Granlund-
