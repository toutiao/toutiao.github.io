  title: 'Zombie Stats: Where the Numbers AI Quotes Come From | Trakkr Research'
  fetch_status: success
  content: |-
    We asked ChatGPT, Perplexity, Gemini, Claude and Google’s AI Overviews 200 questions that call for a number, the kind people ask every day.1Note 1A statistic is a share, rate, average, count or cost that an assistant states as fact. We left out advice (“save 20% of your income”) and prices. Then we clicked the citations, and kept clicking. Here is one trail, from the answer to the end.

    Google AI Overviews

    What percentage of salespeople give up after one follow-up?

    44% of salespeople give up after just one follow-up attempt.1

    - 44%

    - 44%

    - 44%

    - 44%

    - 44%

    44% of salespeople give up after one follow-up attempt (source).

    80 Percent of Sales Require 5 Follow-up Calls after Meeting; 44 Percent Salespeople Give Up After One Follow-up

    No study behind itThis page cites no research.

    - In the answerEvery assistant got the same question: “What percentage of salespeople give up after one follow-up?” All five assistants gave the same figure, and only ChatGPT said the evidence behind it was unclear.

    Every assistant got the same question: “What percentage of salespeople give up after one follow-up?” All five assistants gave the same figure, and only ChatGPT said the evidence behind it was unclear.

    - One click inGoogle AI Overviews cited a sales firm’s stats page, from 2020. The number is right there. Its “source” link goes to a writing sample.

    Google AI Overviews cited a sales firm’s stats page, from 2020. The number is right there. Its “source” link goes to a writing sample.

    - Two clicks inThat leads to a freelance writer’s sample article, online by 2017. The number is in its headline. It lists two slide decks, a blog list and two news stories. None is a study of follow-ups.

    That leads to a freelance writer’s sample article, online by 2017. The number is in its headline. It lists two slide decks, a blog list and two news stories. None is a study of follow-ups.

    - The end of the trailThat’s where the trail ends. We tried every other route to this number we could find, and each one stopped at a page that cites no research. This is what we mean by a zombie stat: a number that keeps getting repeated with no study behind it.

    That’s where the trail ends. We tried every other route to this number we could find, and each one stopped at a page that cites no research. This is what we mean by a zombie stat: a number that keeps getting repeated with no study behind it.

    Most numbers aren’t like this one. The trouble is that you can’t tell which ones are from the answer. This one came with the same confident tone and the same kind of citation as any other, and all five assistants agreed on it. So we followed 1,285 statistics the same way.

    We took a random sample of the statistics each assistant cited, 1,285 in all, and walked every trail the same way: the cited page, then that page’s source, up to five pages deep.2Note 2Each assistant’s sample was drawn at random from the statistics it cited: ChatGPT 108, Perplexity 277, Gemini 300, Claude 300, Google AI Overviews 300. The five-assistant rate weights each assistant by how many cited statistics it quoted, so it describes the statistics people were shown. Where a page named a source without a link, we searched for it.

    40% reached a study that says the same thing. Another 8% reached the study, but the number or its context had changed on the way. The rest never got there: 40% stopped at a source we couldn’t check, because it was locked, gone or silent on the number, and 11% led nowhere at all.3Note 3An AI model judged every trail, and a stronger one re-judged 300. Then people re-checked 150 trails at random, with a third check wherever the two disagreed. People found originals the model missed: by the model alone, 23% were sourced. Every rate here is corrected with the hand checks, and its range carries the uncertainty from both.

    ### Four in ten trails reached a study that says the same thing

    Each square is one in a hundred of the 1,285 statistics we traced, sorted by where its trail ended.

    - 40%SourcedWe found the study, and it says the same thing.

    - 8%ChangedWe found the study, but the number, who was asked, where or when is different.

    - 40%Can’t checkA page names a real source, but the number isn’t in it, or the source is locked or gone.

    - 11%NowhereNo study anywhere on the trail. Every page repeats the number and credits no one.

    The last 1%: trails whose pages wouldn’t load for us.

    Trakkr Research, five AI assistants asked 200 questions that call for a number, October 2026. A random sample of each assistant’s cited statistics, weighted by how many each quoted, and corrected with 150 trails checked by hand. Sourced: 40%, 95% range 34% to 46%.Cite

    ChatGPT did best, and quoted the fewest numbers: 1.3 per answer, against 6.8 for Claude. The other four landed between 38% and 46%, too close to rank.

    ### ChatGPT quoted the fewest numbers, and sourced the most

    The same hundred squares for each assistant, from its own sample of cited statistics.

    - ChatGPT57% sourced1.3 statistics per answer

    ChatGPT

    57% sourced

    1.3 statistics per answer

    - Perplexity46% sourced2.2 statistics per answer

    Perplexity

    46% sourced

    2.2 statistics per answer

    - AI Overviews39% sourced4.8 statistics per answer

    AI Overviews

    39% sourced

    4.8 statistics per answer

    - Gemini38% sourced6.2 statistics per answer

    Gemini

    38% sourced

    6.2 statistics per answer

    - Claude38% sourced6.8 statistics per answer

    Claude

    38% sourced

    6.8 statistics per answer

    Trakkr Research, five AI assistants asked 200 questions that call for a number, October 2026. Traced per assistant: ChatGPT 108, Perplexity 277, Google AI Overviews 300, Gemini 300, Claude 300. The four after ChatGPT sit inside each other’s ranges, so they aren’t ranked.Cite

    To check this wasn’t down to the questions we picked, we also traced 300 statistics from Google AI Overviews answers to real everyday searches. 40% were sourced, about the same share.4Note 4Google AI Overviews answers to 52,930 everyday English searches that Trakkr tracked between 25 September 2026 and 25 October 2026. 4.4% carried a statistic, and we traced 300 of those the same way. Only counts and rates leave our systems.

    The AI mostly wasn’t making numbers up. The page it cited had the figure 82% of the time. But only 21% of the pages cited for a number were the original research.

    More than half were company blogs. Add news stories and statistics roundups and you have most of the citations: pages that repeat figures from somewhere else, often without linking to it.

    ### How often each kind of cited page led to the study

    Every page an assistant cited first for a number, by kind. Each column’s width is its share of those citations. Green is how often its trails reached a study that says the same thing.

    Research firm13% of citations

    Government7% of citations

    Company blog54% of citations

    News10% of citations

    Stats roundup8% of citations

    Other8% of citations

    Trakkr Research, five AI assistants asked 200 questions that call for a number, October 2026. 1,268 traced statistics with a readable first page. Page types judged from the page itself. Outcomes corrected with 150 trails checked by hand.Cite

    The first page made a big difference. When a trail started at a research firm or a government page, it reached a matching study 61% of the time. From a company blog, 37%; from a statistics roundup, 35%. Even research firms fell short 38% of the time, often because the full report sat behind a form.

    A citation tells you where the AI found a number, not where the number came from.

    Reaching the study didn’t always mean the number held. Of the statistics that got there, 17% had changed on the way. The digits moved only about one time in four. Usually it was the context: what was measured, the year, the source, or who was asked.

