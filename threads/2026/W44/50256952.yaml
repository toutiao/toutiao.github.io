  author: jan_m_savage
  text: That’s because Gforth is a threaded-code VM that saves dictionary images rather
    than compiling to native code.<p>As you prolly know, Forth blurs compile time
    and run time in general, and there’s no so-called clean <i>compile, then link</i>
    boundary like in C.<p>SwiftForth, VFX Forth, and iForth do emit real executables,
    and there are smaller native-code Forths for Linux too, but then the opportunity
    cost is losing Gforth’s portability and its standards-heavy library ecosystem.
