    # User-visible changes between Gforth 0.7.x and 1.0:

    Many of the words below are just mentioned, without much indication what they do. You can find out more by klicking on the word in the [Web version of this document](https://gforth.org/manual/1.0/NEWS.html), by typing "help

    This text mentions words that appear the first time in the documentation; some have been available earlier, but were not documented.

    ## Stability

    It is now documented which words are intended to be permanently supported, and which are not; see [Stability Goals](https://gforth.org/manual/1.0/Stability-Goals.html).

    ## Headline features

    - The text interpreter can recognize more things:

    - IDE features:

    - "Smart `.s`: `...` guesses what stack items mean and displays them appropriately. `.s` itself stays dumb.

    - A status line at the bottom of the terminal shows`BASE`, stacks, and search order.`-status +status`

    - Multi-Tasking on multiple cores or hardware threads:`newtask task newtask4 stacksize stacksize4 initiate execute-task kill-task kill stop stop-ns stop-dns thread-deadline halt sleep wake restart pause auser uallot up@ user' 's mutex lock unlock critical-section atomic!@ atomic+!@ atomic?!@ barrier`

    - C interface enhancements, includig callbacks:`c-value c-variable c-funptr c++-library-name c++-library add-libpath add-framework add-incdir add-cflags add-ldflags c-callback c-callback-thread callback#`

    - The dictionary can now have more than one section, each with its own dictionary pointer, which allows allocation without affecting other sections, used, e.g., for nested definitions. See [Sections](https://gforth.org/manual/1.0/Sections.html). Words:`next-section previous-section extra-section .sections`

    - Postpone multiple words with`]]`...`[[`.

    - Value-flavoured and defer-flavoured fields:`value: cvalue: wvalue: lvalue: scvalue: swvalue: slvalue: 2value: fvalue: sfvalue: dfvalue: zvalue: $value: value[]: $value[]: defer:`

    - Per-task values and defers: `uvalue udefer`

    - Closures: Execution tokens for code with data:`free-closure [n:l [d:l [f:l [n:d [d:d [f:d [n:h [d:h [f:h [n:h1 [d:h1 [f:h1 [{: :}l :}d :}h :}h1 :}xt >addr <{: ;>`

    - New word header layout, and based on that:

    - Performance comparable to SwiftForth

    ## No longer documented words

    Many of these words are still in Gforth 1.0, but they may be removed in the future.

    - `.name` (use `id.`);
    - `does-handler!` (implementation changed, use`set-does>`);
    - `/does-handler` (implementation changed, see [Carnal words](https://gforth.org/manual/1.0/Carnal-words.html));
    - `@local# f@local# laddr# lp+!#` (replaced by`@localn f@localn lp+n lp+!`);
    - `clear-libs` (interface changed, use`c-library` ... `end-c-library`)
    - `<interpretation interpretation> <compilation compilation> create-interpret/compile`(replaced by `set->int set-compsem`)
    - `naligned` (use `*aligned`)
    - `name>comp name>int` (use`name>compile name>interpret`)
    - `path-allot` (use `dup , 0 , allot`)
    - `sl@ sw@ ul@ uw@` (use `l@ l>s`;`w@ w>s`; `l@`; `w@`).
    - Internal and therefore no longer documented:`;s block-position cfalign cfaligned compile-lp+! empty-buffer name?int s>number? s>unumber? save-buffer`

    ## Other additional features

    - You can use the return stack interpretively (except for passing data into or out of INCLUDED, EVALUATE etc.)

    - `help` shows the documentation of words, or documentation nodes. Other words providing information:`authors` `license`.

    - Boolean flags: `select`

    - Arithmetic words:

    - Stack Manipulation:

    - Dictionary allocation:`->here w, l, x, xd, a, mem, save-mem-dict`

    - Heap allocation: `save-mem extend-mem free-mem-var`. Growable buffers:`buffer% init-buffer adjust-buffer`.

    - Memory access:

    - Xchars:`xc@ xc@+? xc!+ xc-width xhold xc, invalid-char`

    - String and character constants:`newline #tab #lf #cr #ff #bs #del #bell #esc #eof`

    - Strings:`string-suffix? scan scan-back skip $split nosplit? safe/string insert delete cstring>sstring capscompare capsstring-prefix? capssearch s+ append`

    - Redirect printing words to a string:`>string-execute $tmp`

    - ! $@ $@len $!len $+!len $del $ins+! $free $init $iter $over $exec $. $slurp $slurp-file $+slurp $+slurp-file $variable`

    - [] $[]! $[]+! $+[]! $[]@ $[]# $[]map $[]slurp $[]slurp-file $[]. $[]free $[]variable`

    - Internationalization and localization:`l" locales native@ locale@ program default locale-csv-out locale-csv .locale-csv locale! locale:`

    - Substitution in strings:`macros-wordlist replaces replacer: .substitute $substitute substitute unescape $unescape`

    - Counted strings: `place string,`

    - Control flow

    - Defining words: `avariable buffer: aconstant`

    - No-ops: `[noop] noop`

    - Name tokens:`find-name-in latestnt xt>name traverse-wordlist name>interpret name>compile compile-only? obsolete? name>link`

    - Literal compilers:`lit, aliteral 2lit, flit, slit,`

    - Word definition and text-interpreter status:`in-colon-def? state`

    - Conditional and looping compilation:`[DEFINED] [UNDEFINED] [I] INT-[I]`

    - Text interpreter hooks:`before-line before-word line-end-hook`

    - Input stream: `string-parse`

    - Wordlists:`in-wordlist in cs-wordlist cs-vocabulary .voc wordlist-words mwords map-vocs`

    - String to number conversion:`>float1 holds`

    - Environmental queries:`max-xchar xchar-maxmem os-type`

    - File inclusion: `\\\ .included`

    - General file handling: `+fmode file-eof?`

    - Redirection: `outfile-id infile-id`

    - Directories:`basename dirname open-dir read-dir close-dir filename-match get-dir set-dir =mkdir mkdir-parents`

    - Search paths:`absolute-file? .fpath file>fpath file>path`

    - Simple numeric output: `h. dec.r`

    - Floating-point output: `fp. e. e.p e.exact`

    - Terminal output, in particular colors:`at-deltaxy default-color error-color error-hl-inv error-hl-ul warning-color info-color success-color input-color status-color compile-color postpone-color light-mode dark-mode uncolored-mode magenta-input default-input`

    - Single-key input:`key-ior xkey? ekey>xchar k-enter k-backspace k-tab k-winch k-pause k-mute k-volup k-voldown k-sel k-eof fkey. simple-fkey-string`

    - CSV input:`read-csv csv-separator csv-quote .quoted-csv`

    - Locals:`{: | :} z: z^ xt: @localn f@localn !localn lp+n lp+!`

    - Mini-OOF2 (a little larger than Mini-OOF, but much smaller than the others; Gforth-specific):`>o o> rec-moof2 :method`

    - Regular Expressions:`(( )) charclass +char -char ..char +chars +class -class c? -c? \d \s .? -\d -\s \^ \$ str=? =" { **** } {++ ++} {* *} {+ +} // {{ || }} \( \) \0 s>> >> << <<" s// //s //o //g FORK JOIN ` `? -``

    - Examining compiled code:`xt-simple-see xt-see-code`

    - Debugging words:`debug-fid once ~~bt~~ 1bt ??? WTF?? !!FiXME!! replace-word ~~Variable~~ Value +ltrace -ltrace #loc`

    - Code Coverage and Execution Frequency:`.coverage annotate-cov bw-cover color-cover save-cov load-cov nocov[]nocov cov+ ?cov+ cov% .cover-raw`

    - Definitions in assembly language:`abi-code ;abi-code`

    - Disassembler:`disasm2 intel-syntax at&t-syntax disasm disasm-gdb`

    - Keeping track of Time:`ns >time&date&tz ntime`

    - Image saving and startup:`'image process-option`

    - MINOS2:`actor widget caller-w active-w act-name$ clicked scrolled touchdown touchup ukeyed ekeyed ?inside focus defocus entered left show hide get set show-you parent-w act name$ x y w h d gap baseline kerning raise border borderv bordert borderl w-color draw-init draw split lastfit hglue dglue vglue hglue@ dglue@ vglue@ xywh xywhd !resize !size dispose-widget .widget par-split resized >animate color: new-color: text-color: text-emoji-color: fade-color: text-emoji-fade-color: re-color re-text-color re-emoji-color re-fade-color re-text-emoji-fade-color vp-top vp-bottom vp-left vp-right vp-reslide vp-needed`

    - Other words:`f.s-precision fclearstack sh-get synonym out`

    ## Gforth EC non-news

    We have not done Gforth EC work since Gforth 0.7. We recommend using Gforth 0.7 for Gforth EC, but welcome bug or success reports for Gforth EC in our git head.

    # User-visible changes between 0.6.2 and 0.7.0:

