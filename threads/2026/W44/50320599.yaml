  author: Majromax
  text: 'This article is wrong.  SynthID-style watermarking does not affect one-shot
    generation quality.  When news about the watermarking went around a couple of
    months ago I too thought there must be a quality&#x2F;detectability tradeoff (as
    there is for images), but I dug into the math more and realized that my intuition
    was incorrect.<p>They key idea is this: changing the random seed for LLM generation
    definitionally does not change the distribution of tokens in expectation over
    all seeds.<p>This can already be used to embed information in LLM streams, leading
    to LLM steganography work (<a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2606.09135"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2606.09135</a>, but the
    idea dates back much further).  Take your target message, whiten it via a one-time
    pad (stream cypher), then use it as the &#x27;compressed stream&#x27; under an
    arithmetic decoding process (<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Arithmetic_coding"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Arithmetic_coding</a>)
    with the LLM-supplied logits as the assumed probabilitiy distribution.<p>SynthID
    pulls off the same kind of trick, save that its &#x27;tournament structure&#x27;
    allows application after the sampling step rather than before.  The random seed
    under SynthID becomes context sensitive (keying on the prior N tokens as well
    as the watermark seed), but in expectation the next-token distribution is still
    the same as the unwatermarked case.<p>If there&#x27;s no change in token distribution,
    then there can&#x27;t be a change in quality.<p>However, the article and its sources
    <i>are</i> right about one factor: random generation diversity will suffer.  Applying
    SynthID to an LLM stream acts like fixing the PRNG seed.  Repeated generations
    with the same prompt and same seed will deliver the same result, up to small amounts
    of nondeterminism in the architecture (mostly GPU scheduling and roundoff).  This
    matters under the same circumstances that it would matter if the provider said
    &quot;we sample using the XYZ PRNG with fixed seed &#x27;42&#x27;&quot;.<p>In
    my opinion, &#x27;sample diversity&#x27; and &#x27;sample quality&#x27; are not
    the same thing, and conflating the two concepts leads to poor intuition.  SynthID
    and the like probably matter most if one is trying to repeatedly sample an LLM
    in order to infer the probability distribution (e.g. using a commercial LLM provider
    as a Jev-style classifier, looking for calibrated answers).'
