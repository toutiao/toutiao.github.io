  author: Majromax
  text: "&gt; I wrote the article. How you define quality is exactly the issue.<p>I
    agree, but I think you&#x27;re using an unintuitive definition of quality.  Since
    SynthID essentially acts as a seeded RNG, you will not be able to tell the difference
    between natural output and SynthID outputs with one sample per prompt.<p>We wouldn&#x27;t
    be talking about &quot;quality loss&quot; if a model provider just ran `rng.seed(user_id)`,
    but it would have the same user-visible outcome."
