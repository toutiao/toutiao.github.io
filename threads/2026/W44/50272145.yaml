  author: hbarka
  text: 'Globalstar is a study in corporate survival. It lives on while its 90’s cohort
    Iridium didn’t make it.<p>Consider the journey:<p>2002: Bankruptcy.<p>2007: Satellite
    amplifier failures threatened its voice service.<p>2010–2013: A replacement constellation
    helped restore capacity.<p>2022: Apple&#x27;s iPhone Emergency SOS gave Globalstar
    a major new purpose.<p>2024: Apple committed approximately $1.5 billion in investment
    and infrastructure funding.<p>Now: This acquisition by Amazon would bring Globalstar&#x27;s
    satellite assets and spectrum into Amazon&#x27;s competition with Starlink, while
    preserving satellite services for Apple devices.<p>Iridium has a museum: iridium
    museum.com'
