  text: Globalstar flies highest, with orbits at ~1400 km. Starlink is at ~340-550
    km. Per satellite, a higher altitude sees a larger portion and provides greater
    angular visibility of the Earth&#x27;s surface at any one time. Globalstar is
    suited for low-power devices, emergency sat messaging, and IoT, not broadband
    speed. One reason they made a good fit with the iPhone. Also the valuable spectrum.
