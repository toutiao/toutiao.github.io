  author: walrus01
  text: This is an incredibly inaccurate and uninformed description. Globalstar was
    a failure in the market because its satellite network is bent pipe and doesn&#x27;t
    provide open ocean or polar or true global coverage. The second corporate incarnation
    of Iridium (that bought it out of the bankruptcy process) was wildly successful
    with maritime, aviation and DoD customers. Iridium had VASTLY more market share
    in portable LEO satellite terminal users and revenue at the time of this acquisition.
    Iridium grew its market to include embedded data modems like the Iridium SBD modems
    you find in Garmin Inreach and tons of other equipment.<p>The *ONLY VALUE* of
    Globalstar for an acquisition is its legacy spectrum allocation in a very valuable
    (sub 1.7 GHz, above 1.2 GHz) range. The technology was utter crap compared to
    Iridium and nobody who worked in two way satellite has taken it seriously since
    maybe 2002.
