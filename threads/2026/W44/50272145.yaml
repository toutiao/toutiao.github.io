    and infrastructure funding.<p>Now: This acquisition by Amazon would bring Globalstar&#x27;s
    satellite assets and spectrum into Amazon&#x27;s competition with Starlink, while
    preserving satellite services for Apple devices.<p>Iridium has a museum: iridium
