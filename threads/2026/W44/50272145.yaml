  author: kotaKat
  text: 'Globalstar&#x27;s technology over everyone else. They&#x27;ve just been crude
    bent pipes up in the sky. They <i>still are</i>. C-3 is just a bunch of new radio
    repeaters.<p>Globalstar&#x27;s original network was just CDMA over the bent pipe
    satellite link, their second-gen Duplex network (sold as Sat-Fi 2) was an attempt
    to go WCDMA, then Apple dangled a <i>lot</i> of cash at them to build out and
    drop the entire Sat-Fi 2 product, the entire WCDMA core, and go roll Apple&#x27;s
    new toys out for them. I&#x27;m assuming C3 is going to be heavily LTE-based if
    it isn&#x27;t already at this point.<p>(I had a Sat-Fi 2 device and it was an
    interesting and short-lived experience. I was also there for the weird interim
    201x satellite failure era - I remember having to pull up the Optimal Satellite
    Availability Tool to go see exactly how many long ~2-10 minute windows I could
    make phone calls in with a GSP-1600.)<p>((Double-fun-fact: The GSP-1600 is still
    actively used on Globalstar today, and it&#x27;s one of the only tri-mode phones
    that existed of the era. It was satellite via GSTAR, then had CDMA for local calling
    and AMPS for the sticks. I had my GSP-1600 activated on a Verizon MVNO for local
    calls, which was a blast to use.))'
