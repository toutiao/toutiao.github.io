  author: tristanj
  text: It&#x27;s largely because Amazon started Leo &#x2F; Project Kuiper in the
    late 2010s when Jeff Bezos was still CEO of Amazon. Musk and Bezos both run rival
    spaceflight companies, and during this era, Musk and Bezos had multiple public
    spats stemming from:<p>1) Blue Origin &amp; SpaceX competing for the same NASA
    &#x2F; DoD resources.<p>2) Blue Origin using government processes to block &#x2F;
    stall contracts that would go to SpaceX.<p>When Musk fired a number of Seattle-based
    Starlink execs in mid-2018, Bezos took them in to build a competing product. After
    Starship launched its inaugural flight and it was clear Blue was 10-15 years behind
    SpaceX, the rivalry died down. By then, Bezos had already stepped down as CEO
    of Amazon. Now Amazon Leo &#x2F; Project Kuiper exists as an inherited project.
