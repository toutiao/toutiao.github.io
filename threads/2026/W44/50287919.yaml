  author: fckgw
  text: From a driver persepctive:<p>DD plays big games with pay, sometimes hides
    tips, drives down base pay, and stacks orders with good pay and bad pay offers
    to try and pay drivers as little money as possible.<p>In a bad economy, there&#x27;s
    less people ordering on DD (although higher income earners who aren&#x27;t as
    effective by economic effects don&#x27;t change habits), however, it drives MORE
    desperate drivers to the platform that accept the low pay orders since they no
    longer have an income. This drives down all wages for drivers, and costs, which
    in turn pads DD&#x27;s margins.<p>We actually see this seasonally in the summer
    when more students and teachers join the platform over the break. There&#x27;s
    a glut of drivers, you can&#x27;t cherry pick higher paying orders and most stuff
    that&#x27;s left to fight for is low paying, no tip orders. When school starts
    back up things return to normal.<p>This is why DD is trying to sign up as many
    drivers as possible. If you remove the scarcity of drivers, then every low paying
    gig will eventually get picked up, driving average pay down and you can ratchet
    down your base pay hoping customer tips make up the slack.
