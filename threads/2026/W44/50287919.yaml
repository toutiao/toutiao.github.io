  author: SoftTalker
  text: Political beliefs or views are not a &quot;protected class&quot; in US federal
    employment law. That said, most employers at least say that they support political
    participation, but once you start taking public actions it becomes a bit different.<p>If
    a person made a large contribution or gave other public support to an extremist
    candidate, an employer might not want any association with that.<p>If running
    for an office is going to take up a significant amount of one&#x27;s time, such
    that it might impact  availability for work during normal hours, an employer would
    care about that.<p>In this specfic case, if she was featuring &quot;I work for
    Instacart&quot; in any way in her campaign they might care about that.<p>If she
    was saying anything inflamatory or controversial, Instacart might not want to
    be associated with that.<p>So running for a nonpartisan office such as a local
    council or school board or similar would normally not be any issue. Anything where
    party politics feature prominently is going to be riskier.
