    for an office is going to take up a significant amount of one&#x27;s time, such
    that it might impact  availability for work during normal hours, an employer would
    care about that.<p>In this specfic case, if she was featuring &quot;I work for
    Instacart&quot; in any way in her campaign they might care about that.<p>If she
    was saying anything inflamatory or controversial, Instacart might not want to
