    of those was the Corporate Alternative Minimum Tax (&quot;CAMT&quot;). For non-Americans,
    AMTs are a weird thing where Congress basically gives up and decides the tax code
    is too complex so they give up and say whatever your deductions are, if the AMT
    produces a higher amount, that&#x27;s what you have to pay. Every complexity is
    somebody&#x27;s special interest so repealing them can be hard. It&#x27;s kind
