  author: sorenjan
  text: They address the lower PSNR for triangles compared with gaussians in the paper,
    basically PSNR rewards smoothness more than visual quality and gaussians are very
    smooth. I hadn&#x27;t seen PSGR[0] before, that looks pretty good but it looks
    like it&#x27;s pretty close to the triangle splatting. They flatten the gaussians
    to flat primitives with varying opacity like the triangles, but the authors of
    triangle splatting specifically call out that their window function is bounded
    by the triangles edges which produces better details in some areas. It kind of
    proves my point about 3DGS getting a lot of research and incremental improvement
    though, while I haven&#x27;t seen any follow up research on triangle splatting.
    They do mention that their method would need additional steps in order to produce
    a connected mesh, but I think at least in their example images the surfaces looks
    pretty decent even thought their still made up of a triangle soup.<p>I just checked
    if they had released any follow up papers themselves, and one of the lead authors
    has published a paper about sparse geometry[1] that looks interesting. He&#x27;s
    also done a couple of direct follow ups to triangle splatting called Triangle
    Splatting+[2] and Mesh splatting[3], that produces a connected mesh. It&#x27;s
    at least good to see that there&#x27;s still research into other techniques than
    just gaussians.<p>[0] <a href="https:&#x2F;&#x2F;zju3dv.github.io&#x2F;pgsr&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;zju3dv.github.io&#x2F;pgsr&#x2F;</a><p>[1] <a
    href="https:&#x2F;&#x2F;lessvrong.com&#x2F;cs&#x2F;nexels&#x2F;" rel="nofollow">https:&#x2F;&#x2F;lessvrong.com&#x2F;cs&#x2F;nexels&#x2F;</a><p>[2]
