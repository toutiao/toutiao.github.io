  author: lelanthran
  text: "&gt; I would expect code written by the latest frontier models with a &quot;find
    all security issues make no mistakes&quot; pass to be more secure than average
    human code written in the pre-AI era (not a high bar).<p><i>&quot;If you write
    code as cleverly as you can, you are, by definition, too stupid to debug it.&quot;</i><p>Do
    you disagree with this? Because if you don&#x27;t, then the rate of bugs&#x2F;RCEs
    in a completely AI-written-software world will be exactly the same as the rate
    of bugs in a completely human-written-software world.<p>A combination of human-authorship
    + AI-review, with <i>absolutely no AI-written code</i> is going to have the lowest
    rate of bugs, because there is always one entity who understands the code (because
    they wrote it) and one entity who is smarter than the author who can find bugs.<p>The
    AI-generated code I see from SOTA models is absolute spaghetti, and they start
    running into problems spotting bugs after even a small number of refinements&#x2F;changes
    to the software (say, 50).<p>The problem with all this spaghetti is that they
    are quick to write something that even they can&#x27;t easily read. Even mediocre
    but experienced humans are not so eager to write something that they can&#x27;t
    easily debug.<p>IOW, for any non-trivial problem, with AI-generated code you are
    guaranteed to get spaghetti that it cannot understand. With humans, it&#x27;s
    only a probability that that will happen."
  score: 0
