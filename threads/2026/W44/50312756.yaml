  author: parable
  text: 'As someone who has helped to secure critical national infrastructure several
    years ago, I can say that it was a mess to disclose the vulnerabilities I identified,
    and in some cases it took years to patch them. Some of these vulnerabilities were
    RCEs and mass PII leaks. It&#x27;s simply not worth the risk for most people -
    who aren&#x27;t in the USA - to bother doing this sort of security research. However,
    if you <i>are</i> in the USA, there are provisions in the CFAA that enable good-faith
    security research to take place (<a href="https:&#x2F;&#x2F;www.justice.gov&#x2F;archives&#x2F;opa&#x2F;pr&#x2F;department-justice-announces-new-policy-charging-cases-under-computer-fraud-and-abuse-act"
    rel="nofollow">https:&#x2F;&#x2F;www.justice.gov&#x2F;archives&#x2F;opa&#x2F;pr&#x2F;department-justice-a...</a>),
    so to the best of my understanding, you&#x27;re able to do good-faith research
    without being charged or prosecuted, and you should take advantage of this if
    you have the skills or models to do so. I am not based in the USA, and there are
    no laws in my country that guarantee me zero jail time for simply trying to do
    the right thing, so I am not incentivized to continue finding vulnerabilities
    in my country&#x27;s infrastructure.<p>Edit: If other countries don&#x27;t catch
    up and include similar provisions in their laws, they&#x27;ll simply fall behind
    and put their citizens at risk. I&#x27;m sure every country has individuals willing
    to help that currently feel unsafe - look at the large amount of bug bounty hunters
    worldwide who, I&#x27;m sure, wouldn&#x27;t mind practicing their skills by securing
    their country&#x27;s infrastructure.'
