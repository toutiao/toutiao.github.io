  text: The history link gives details, but if you want a quick analogy:<p>Pharo &amp;
    Cuis both forked from squeak at roughly the same time<p>Squeak = Debian<p>Pharo
    = Arch<p>Cuis = Alpine<p>Cuis has rigorously simplified, so its much easier to
    explore &amp; understand the system - because there&#x27;s less of it<p>Cuis&#x27;s
    re-engineering of morphic is really quite brilliant. Everything is hardware accelerated
    vector graphics. EVEN THE FONTS are drawn that way. And they remain crisp even
    when zoomed (in or out) &amp; rotated.<p>Pharo does have some cool stuff though.
    I&#x27;d love to see fuel (object serialization) &amp; soil (a fully oo database)
    ported to cuis. And the big one - seaside<p>But its not an either-or situation.
    99% 9f what you learn &amp; do in one is applicable to the other. But if you&#x27;re
    starting out, I would definitely recommend cuis (not implying that you wouldn&#x27;t
    necessarily stick with it)
