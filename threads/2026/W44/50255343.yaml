  content: "# The modern Smalltalk-80\n\nCuis is a **free Smalltalk-80 environment**
    with a specific set of goals: being **simple and powerful**.  \nIt is also **portable
    to any platform** , fast and efficient.\n\n[Get started](/documentation/#get-started)\n\n![The
    Cuis Smalltalk development environment](/assets/imgs/home/ide.png)\n_A typical
    work-in-progress scene in Cuis Smalltalk application development: An Inspector
    displays an object from the running application, a message is sent to this object
    to show its halo, and the auto-completion tool is active. Class browsers are open
    on the application’s relevant classes; a Transcript provides feedback on the application’s
    execution; under the application view, a Workspace contains code related to the
    application._\n\n![Vector graphics in Cuis Smalltalk](/assets/imgs/home/vector-graphics.webp)\n_A
    showcase of Cuis Smalltalk’s support for vector graphics, SVG, TrueType fonts
    and Unicode._\n\n> “I like it… It’s nice and clean and simple and pretty. Nice
    stuff!”\n> \n> · [Source](https://lists.squeakfoundation.org/pipermail/squeak-dev/2007-April/115962.html)\n\n>
    “Yay, Juan. You GO, guy! …a great example of malleable software (and a clever
    mind) at work.”\n> \n> · [Source](https://lists.squeakfoundation.org/pipermail/squeak-dev/2007-April/115948.html)\n\n>
    “I think you have a very elegant design aesthetic.”\n> \n> · Private communication\n\n[More
    nice comments about Cuis](/quotes)\n\n## Latest news\n\n- 2026-10-01\n### [Cuis
    at Smalltalks 2026](/2026/10/01/Smalltalks2026.html)\n\n[Smalltalks 2026](https://smalltalks2026.fast.org.ar)
    takes place from October 14 to 16 at the Facultad Regional Rosario of the UTN,
    in Rosario, Argentina, and Cuis will be there: eight talks of the program come
    from the Cuis community or show work done in Cuis. We hope to see you all there!\n\n-
    2026-06-02\n### [July Cuis Meeting](/2026/06/02/Meeting.html)\n\n**What.** It
    is a “Demo Meeting” for demonstration then discussion. Milan Lajtos will present
    his experience on using a code agent to develop Blueprint, a revisit of the Cuis
    Smalltalk system desktop.\n\n- 2026-06-01\n### [Cuis 7.8 release](/2026/06/01/Cuis7-8Release.html)\n\nCuis
    7.8 stable release!\n\n[Older news](/news)[Subscribe](/feed.xml \"Subscribe via
    RSS\")\n\n## Latest meeting\n\n- \n#### Website, Dybo and Stream Deck\n[![Website,
    Dybo and Stream Deck](https://i.ytimg.com/vi/blqkV2ZnIpQ/sddefault.jpg)](https://youtu.be/blqkV2ZnIpQ)\n\n_Cristián
    Pérez presents the redesigned website and [Cuis for Stream Deck](https://github.com/wenoa/cuis-streamdeck),
    his new plugin for controlling Cuis from a Stream Deck. Hilaire Fernandes shows
    the improvements to the [Dybo](https://github.com/Dynamic-Book/DyboApp) tools._\n\nCristián
