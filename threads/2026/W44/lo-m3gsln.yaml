  content: "# Hoot 0.10.0 released!\n\nWe are excited to announce the release of Hoot
    0.10.0! Hoot is a Scheme to WebAssembly compiler backend for Guile, as well as
    a general purpose WebAssembly toolchain. In other words, Scheme in the browser!\n\nThis
    release contains new features and bug fixes and since the 0.9.0 release back in
    May.\n\n## Use Hoot in the upcoming Lisp Game Jam!\n\nOn Friday (October 30th
    2026), the autumn edition of the Lisp Game Jam will begin! It's a 10-day long
    game jam where participants make games using their favorite flavor of Lisp.\n\nDoes
    making a small web game in Scheme using Hoot sound appealing to you? Well, then
    we have just the thing to get you started: the Hoot game jam template! This template
    project has everything you need to start making an HTML5 game with Hoot quickly.\n\nThe
    template repository includes:\n\n- Bindings to the necessary web APIs to make
    an interactive game with HTML5 canvas\n\nBindings to the necessary web APIs to
    make an interactive game with HTML5 canvas\n\n- A Makefile for compiling, running
    a development web server, and generating a .zip bundle for uploading to itch.io\n\nA
    Makefile for compiling, running a development web server, and generating a .zip
    bundle for uploading to itch.io\n\n- A very simple Breakout-like example game
    that demonstrates how to put all the pieces together\n\nA very simple Breakout-like
    example game that demonstrates how to put all the pieces together\n\nFor more
    inspiration, here are some games made with Hoot for past jams:\n\n- Cirkoban\n\nCirkoban\n\n-
    Strigoform\n\nStrigoform\n\n- Shields TYVM\n\nShields TYVM\n\nNow, onto the release
    notes!\n\n## Compiler changes\n\n- Added module name to contextualize duplicate
    import errors.\n\n- Added support for library versioning for R6RS compatibility.\n\n-
    Fixed default version for define-module libraries.\n\n- Fixed locate-library not
    respecting configured load extensions. Previously, we were using Guile's load
    extension parameter instead of Hoot's own.\n\n## Runtime changes\n\n- Added %struct-ref
    and %struct-set! primitives for accessing record types defined using the interpreter.\n\n-
    Stopped raising errors when importing an undefined symbol in the runtime module
    system. Guile is lax about this so Hoot being strict caused compatibility issues.\n\n-
    Fixed optional argument parsing in primitive-eval.\n\n- Fixed keyword argument
    parsing for procedures with both optional and keyword arguments in primitive-eval.\n\n-
    Fixed error messages regarding runtime module registry to include the correct
    CLI flag: -fruntime-modules.\n\n## Scheme changes\n\n- Added partial implementation
    of SRFI-13: String Libraries. It's just a set of re-exports, very similar to Guile,
    but Guile's SRFI-13 module is not declarative and is thus rejected by Hoot's compiler.\n\n-
    Added partial implementation of SRFI-60: Integers as Bits.\n\n- Added define-macro,
    defmacro, delete, list->symbol, and symbol to (guile).\n\n- Exported define-syntax-parameter
    and syntax-parameterize, symbol-append, integer-length, and gensym from (guile).\n\n-
    Added list->bitvector and bitvector to (hoot bitvectors) and re-exported them
    in (guile).\n\n- Implemented get-bytevector-all in (rnrs io ports).\n\n- Made
    bytevector=? a publicly exported procedure from (hoot bytevectors) and (rnrs bytevectors).\n\n-
    Added define-syntax-parameter and syntax-parameterize primitives.\n\n- Improved
    (ice-9 exceptions) exports to more closely match Guile.\n\n- Added (rnrs) module.\n\n-
    Added (rnrs base) module.\n\n- Added (rnrs syntax-case) module.\n\n- Added (rnrs
    r5rs) module.\n\n- Added (rnrs hashtables) module.\n\n- Added (rnrs files) module.\n\n-
    Added (rnrs enums) module.\n\n- Added (rnrs exceptions) module.\n\n- Added (rnrs
    arithmetic fixnums) module.\n\n- Added (rnrs records inspection) module.\n\n-
    Added (rnrs records procedural) module.\n\n- Added (rnrs records syntactic) module.\n\n-
    Added (rnrs io simple) module.\n\n- Added (rnrs io ports) module.\n\n- Added port-has-position?
    to (hoot ports) for R6RS compatibility.\n\n- Added stubs for centered division
    to (hoot numbers) and a stub for integer-length to (hoot bitwise) for R6RS compatibility
    (eventually).\n\n- Rewrote (rnrs bytevectors) as an R6RS module with version (6).\n\n-
    Fixed number->string to round floating point decimal part to an even digit.\n\n-
    Fixed number->string for floating point numbers ±2^N, where 52 <= N <= 1023.\n\n-
    Fixed incorrect bytevector copy in number->string floating point conversion algorithm.\n\n-
    Fixed min/max macros not working when given zero arguments.\n\n- Fixed the parameters
    to the log procedure in (guile).\n\n- Fixed the implementation of negate in guile.
    It was doing entirely the wrong thing.\n\n## CLI changes\n\n- Port numbers are
    now validated to be exact integers in the range [1, 65535].\n\n- Actually complain
    about invalid option or unknown subcommand. Previously, the code that was supposed
    to do this was unreachable.\n\n- Add --experimental-wasm-exnref feature flag when
    running hoot compile --run=node for continued compatibility with supported NodeJS
    versions that don't have the new Wasm exnref feature enabled by default.\n\n-
    Fixed build-time disabling of hoot server. In past releases, the hoot CLI script
    would still attempt to load should-be-optional libraries that ./configure had
    already determined to be missing. Thanks to mcc for discovering this blunder.\n\n##
    Documentation changes\n\n- Improved instructions in \"Building from source\" section
    of the manual.\n\n- Dependencies are now mentioned in the \"Advanced path\" section
    of the README.\n\n- Updated project template README to say Guix is not required
    (though it's still the easiest option).\n\n## Browser compatibility\n\n- Compatible
    with Safari 26 or later.\n\n- Compatible with Firefox 121 or later.\n\n- Compatible
    with Chrome 119 or later.\n\n## Get Hoot\n\nHoot is available in GNU Guix:\n\n$
    guix pull $ guix install guile guile-hoot\n\nAlso, Hoot is now available in Debian,
    though it will take awhile for this release to make it there.\n\nOtherwise, Hoot
    can be built from source via our release tarball. See the Hoot homepage for a
    download link and GPG signature.\n\nDocumentation for Hoot 0.10.0, including build
    instructions, can be found here.\n\n## Get in touch\n\nFor bug reports, pull requests,
    or just to follow along with development, check out the Hoot project on Codeberg.\n\nIf
    you build something cool with Hoot, let us know on our community forum!\n\nThanks
    to Z572, stdh, Walter Lewis, and Jelle Licht for their contributions to this release.\n\nUntil
    next time, happy hooting! \U0001F989\n\n## Thanks to our supporters\n\nYour support
    makes our work possible! If you like what we do, please consider becoming a Spritely
    supporter today!\n\n### Diamond tier\n\n- Aeva Palecek\n\n- David Anderson\n\n-
    Holmes Wilson\n\n- Jonathan Frederickson\n\n- Lassi Kiuru\n\n### Gold tier\n\n-
    Alex Sassmannshausen\n\n- Juan Lizarraga Cubillos\n\n- Nerine Pekowsky\n\n- Serra
    Allgood\n\n### Silver tier\n\n- Austin Robinson\n\n- Brit Butler\n\n- Charlie
    McMackin\n\n- Dan Connolly\n\n- Deb Nicholson\n\n- Diana Thayer\n\n- Eric Bavier\n\n-
    Eric Schultz\n\n- Evangelo Stavro Prodromou\n\n- Evgeni Ku\n\n- Glenn Thompson\n\n-
    James Luke\n\n- Jonathan Smith\n\n- Jonathan Wright\n\n- Justin Sheehy\n\n- Matt
    Panhans\n\n- Michel Lind\n\n- Mike Ledoux\n\n- Moto A\n\n- Nathan TeBlunthuis\n\n-
    Nia Bickford\n\n- Noah Beasley\n\n- Steve Sprang\n\n- Travis Smith\n\n### Bronze
    tier\n\n- Alan Zimmerman\n\n- Aria Stewart\n\n- Ben Hamill\n\n- Benjamin Grimm-Lebsanft\n\n-
    Brooke Vibber\n\n- Brooklyn Zelenka\n\n- Carl A\n\n- Crazypedia No\n\n- Ellie
    High\n\n- François Joulaud\n\n- Gabor Udvari\n\n- Grant Gould\n\n- Gregory Buhtz\n\n-
    James Smith\n\n- Jason Wodicka\n\n- Jeff Forcier\n\n- Marty McGuire\n\n- Mason
