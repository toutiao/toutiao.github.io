  author: nater5000
  text: This post is funny to me, because I feel it falls well short of what a proper,
    forward-thinking &quot;AI-native&quot; engineering org would actually look like.
    That is, the author is presenting this as kind of a radical departure from normal
    engineering, but I just see it as normal engineering with more AI. I don&#x27;t
    see <i>that</i> as AI-native.<p>To me, true &quot;AI-native&quot; engineering
    will be one where questions regarding how humans will do things like review code
    are irrelevant. You explicitly throw away any concept of typical software engineering
    and, instead, differ to the AI. Your job, as a human, is solely to do what the
    AI can&#x27;t physically do. That&#x27;s <i>not</i> the same as closing gaps between
    what AI is currently capable of doing and what you&#x27;d need it to be capable
    of doing. It&#x27;s literally enforcing that anything an AI is able to do is treated
    as correct in itself, and you, as a human, only support it by being a human.<p>If
    that sounds outlandish, that&#x27;s because it is. We don&#x27;t have such capable
    AI systems yet. It&#x27;s possible we never will. But that&#x27;s beyond the point.
    The reality is trying to make an &quot;AI-native&quot; engineering org by just
    layering AI on top of existing processes and systems is futile. If your expectation
    is that AI will continue to improve in capabilities at an accelerating rate, then
    these stop-gaps are pointless. You might as well just ignore AI altogether until
    it is able to completely take over, because that&#x27;s the inevitable goal, right?<p>If
    you&#x27;re willing to buy that will be possible, then my guess is that it will
    occur in the form of small scale startups and actual mavericks rather than someone
    trying to run an existing business who will simply be too risk adverse to go all
    in when the time comes. Some guy in his basement is more likely to leverage AI
    &quot;properly&quot; to build an actual &quot;AI-native&quot; engineering org
    because that person won&#x27;t have much to lose.
  score: 0
