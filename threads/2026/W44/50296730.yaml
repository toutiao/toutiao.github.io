  author: Tenemo
  text: We are already - as in today - doing this with friends while playing Valheim,
    the process is semi-automatic with me in the middle as the admin, though.<p>We
    make 10+ gameplay changes a day in our custom kitchensink mod that steers everything.
    70%+ are bugfixes (we have plenty of mods that conflict&#x2F;are buggy), the the
    rest are QoL improvements, small new features and rebalancing. If we see some
    playstyle is too strong or boring, we spice it up the same or the next day. Mobs
    too weak&#x2F;strong? Update the same day. A ton of performance fixes with actual
    in-game benchmarking. All this while I keep playing.<p>I built sort of an automatic
    modding pipeline (including public release and all) with parallel test game clients
    + servers used by LLMs to develop and test the changes and then merge before releasing
    a new mod version. We have had very few issues, I&#x27;m still shocked how reliable
    this is. They follow guidance well and test everything in real game clients on
    wipeable clones of our live world and our actual characters. Josh has a bugged
    chest at his place? The LLM will reproduce it, develop a patch, yes, but then
    also log in as him to his actual in-game base and test the fix using game inputs
    + OCR. At the end I get a .html page report on each change with screenshots and
    technical details if I ask for them. I don&#x27;t care if it takes 4h to do a
    simple fix because it&#x27;s not my time and game stability is critical. And up
    to 8 of them can work in parallel, so there isn&#x27;t a bottleneck caused by
    excessive testing&#x2F;re-testing.<p>I think this will be the future of gaming
    for many sandbox&#x2F;easily moddable games. It&#x27;s a bit too technical at
    the moment for regular players to handle the updates and models&#x27; quirks,
    but we&#x27;re only going up from here. Just crazy.
