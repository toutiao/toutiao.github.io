  author: kg
  text: Software robustness, at least in terms of &quot;has the app crashed on any
    client machines today&quot;, is achievable. It&#x27;s just expensive enough to
    achieve that most people (rightly or not) don&#x27;t prioritize it, and the more
    moving parts (like third party libraries or language runtimes) your application
    has the harder it is to achieve. Maybe AI will lower the cost of achieving that.<p>When
    I worked on Guild Wars every server or user crash went to a shared inbox and was
    bucketed so we could identify and act on new crashes. IIRC we maintained very,
    very low production crash rates and could prove that many of the crashes were
    due to hardware faults.<p>Similarly, Mozilla tries to analyze and act on every
    crash report they get in the field. If a webpage visited by even a small % of
    the customer base was causing crashes, the team worked to try and fix the crash
    to deliver stability. If it was a high-traffic webpage it got treated as a high-priority
    task - I remember Farmville breaking was basically a 3-alarm fire back when it
    was extremely popular.<p>&quot;No bugs at all&quot; is an even higher bar, but
    it probably is possible for simpler applications with the use of stuff like theorem
    provers. I&#x27;d love to see someone try it in production but I think the return
    on investment for that is probably super super negative.
