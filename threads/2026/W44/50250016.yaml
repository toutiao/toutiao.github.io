  author: mrandish
  text: SpamBlocker lets you put numbers into groups like those in your contacts,
    those you&#x27;ve ever called, and those in your area code or prefix. Then each
    group is tested against a content whitelist and blacklist based on words, length,
    formatting, even Regex. And it&#x27;s not binary, each list hit has a numeric
    weight and when a text falls below a certain score without being &#x27;saved&#x27;
    by any &#x27;always keep&#x27; whitelist terms (like the name of my HMO, my wife&#x27;s
    name, etc) it gets either silenced, reduced to vibrate-only or trashed.<p>Last
    time I checked NoMo nor anything else has that level of granularity. All the other
    spam blocker tools prioritize &quot;one-click simple&quot; which means all their
    scoring is generic and opaque. At most they let users add binary black and whitelist
    terms. I haven&#x27;t seen any that let users weight their own terms.
