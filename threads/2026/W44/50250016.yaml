  author: BeetleB
  text: I &quot;solved&quot; this for email years ago (as did many before me):<p><a
    href="https:&#x2F;&#x2F;blog.nawaz.org&#x2F;posts&#x2F;2018&#x2F;Sep&#x2F;solving-my-email-problem&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;blog.nawaz.org&#x2F;posts&#x2F;2018&#x2F;Sep&#x2F;solving-my-email-probl...</a><p>Any
    communication channel that doesn&#x27;t involve a whitelist (e.g. invite&#x2F;approve)
    will have this problem. Email. Phones. Text messages.<p>If you want to fix this,
    the protocol must ensure the recipient first <i>agrees to communicate</i> with
    you. Until they do, all messages to them will be automatically blocked.<p>This
    solution works. Yes, there are always ways to get around it, but in practice,
    it cuts the nonsense by well over 90%.
