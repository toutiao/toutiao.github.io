  author: dns_snek
  text: '&gt; From all the evidence I’ve seen, the disastrous effect of social media
    is everywhere but in the data.<p>This study doesn&#x27;t say <i>anything</i> about
    the effects of social media on students.<p>It finds that <i>phone bans in schools</i>
    are not associated with measurable improvements in mental health. This is not
    the same as saying that social media and phone use aren&#x27;t harmful, it only
    means that phone bans in school don&#x27;t independently improve mental health
    outcomes.<p>A similar study from a couple of years ago [1] reached the same conclusion,
    however they had more data which exposed the hidden correlation (emphasis mine):<p>&gt;
    Implications of all the available evidence<p>&gt; This study does not provide
    evidence to support the use of school policies that prohibit phone use during
    the school day in their current form, given that no differences were observed
    in mental, physical, and academic outcomes for adolescents attending schools that
    permit, versus restrict phone use. <i>However, the negative associations found
    between increasing time spent on phones&#x2F;social media and worsened mental
    health and wellbeing do provide evidence on the need to address phone and social
    media use in adolescents, and school policies should be developed as part a more
    holistic approach.</i> Preventative efforts should also consider how other behaviours
    that influence mental health and wellbeing are influenced by increased phone&#x2F;media
    use, such as sleep, physical activity, attainment, classroom behaviour and problematic
    use.<p>[1] <a href="https:&#x2F;&#x2F;www.thelancet.com&#x2F;journals&#x2F;lanepe&#x2F;article&#x2F;PIIS2666-7762(25)00003-1&#x2F;fulltext"
    rel="nofollow">https:&#x2F;&#x2F;www.thelancet.com&#x2F;journals&#x2F;lanepe&#x2F;article&#x2F;PIIS2666-7...</a>'
