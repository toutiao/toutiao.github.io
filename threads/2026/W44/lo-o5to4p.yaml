    79;\n\n33. \n\n    }\n\n**Testing**  \nA set of 65535 divisors from -32768 to
    32767 for 64-bit can be generated into a single self-contained C++ file. It includes
    a boundary test in the same file.  \nSee the comment at the top of the download
    for how to build and run it.\n\nUsing this form, you can choose any bit-width
    and any divisor to get a copy/paste function ready to go.\n\nThere is also [reference
