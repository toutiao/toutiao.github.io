    *\n\n## Starting with Truncated (Standard) Division [Deep link](#starting)\n\nLet's
    suppose you want to convert a Unix timestamp measured in seconds, to _rata-die_
    (a day count). And let's also suppose you forgot how to do this properly, and
    you use standard _(\"truncated\")_ division.\n\nWe need to divide by `86400` _(60×60×24)_.
    We'll use a 64-bit timestamp, since a 32-bit timestamp can only hold about ±68
    years.\n\nYou'll be very happy with this implementation on the right until somebody
    hands you a timestamp before 1970!\n\n**C++ Standard Division (not floor-div)Given:
    `x` — _signed 64-bit integer_**\n\n1. \n\n    const int64\\_t_rd_=_x_/86400;\n\n2.
    \n\n    **return** _rd_;\n\nOf course, you should be using _floor division_, the
    type of division that's useful for tracking repeating patterns like timestamps,
    angle rotations, tile positions etc. This is the type of division where the associated
    `\"%\"` operation is a proper _positive modulus_, not that fake modulus that \"`%`\"
    provides in C++, JavaScript etc.\n\nNonetheless, it's useful to understand what
