  author: libraryofbabel
  text: 'I feel there&#x27;s a misconception in a lot of the comment threads about
    what an LLM-from-scratch tutorial is <i>for</i>. Of course you&#x27;re not going
    to come out of this kind of tutorial being able to train a <i>useful</i> LLM from
    scratch. (It requires too much compute, and datasets you don&#x27;t have access
    to, and there are a lot of tricks and operational problems to solve for real training
    runs.) If that&#x27;s your bar for &quot;impracticality&quot;, then sure, this
    is impractical.<p>But that&#x27;s not the point; the point is understanding these
    things better by seeing how they are <i>made</i> (or <i>grown</i>, if you prefer).
    Building something at a level further down the stack than you will ever go forces
    you to confront details that shape the layers above that you <i>do</i> deal with.
    This is one reason why <i>Crafting Interpreters</i> is such a beloved book here
    on HN.<p>LLMs are now at the core of tools we all use everyday... don&#x27;t you
    want to know how they are made? Maybe not everyone has this itch to understand
    the platforms and tools they use, but I sure do, and it&#x27;s helped me over
    and over again. Sure, LLMs aren&#x27;t like operating systems or compilers. They&#x27;re
    a quasi-organic mass of billions of parameters learned during training and honestly
    nobody (not even the mech interp folks) really deeply understands why they work
    so well. But that&#x27;s no reason to completely give up and there is still a
    lot you can learn.<p>Take RLVR (&quot;Reinforcement Learning from Verifiable Rewards&quot;).
    This is the training technique that made LLMs get so good at programming and math
    in 2025 and 2026. A lot of people who confidently talk about LLM capabilities
    either haven&#x27;t heard of it (and thus end up parroting out-of-date factoids
    about LLM training derived from the pre-2025 era) or have only a very dim idea
    of what it is. In this course you actually do RL training of an LLM to get it
    solving math problems better. You&#x27;re right down in the details. It&#x27;s
    interesting for its own sake but it will also give you a grounding for discussing
    questions such as: &quot;why did LLM writing get so weird and bad in mid-2026?&quot;
    and &quot;why is it so hard to train LLMs to be good at things that aren&#x27;t
    like math and programming?&quot;<p>Anyway, Sebastian&#x27;s two books are great
    and highly recommended; I worked through the first one a year ago and it was one
    of the best investments of my time in all of 2025. If you prefer video for learning
    this is great as well (although I&#x27;d still say - try the books first).'
