  title: 'Build Your Own Reasoning Model: A Full Video Course'
  fetch_status: success
  content: "# Building Reasoning Models from the Ground Up: A Full Video Course\n\n###
    Eight videos and over 11 hours of coding, covering evaluation, inference-time
    scaling, reinforcement learning, and distillation in Python and PyTorch.\n\n[\n\n](https://substack.com/@rasbt)\n\n[Sebastian
    Raschka, PhD](https://substack.com/@rasbt)\n\nI have written a lot about reasoning
    models here over the last two years on Ahead of AI, including a recent article
    on mechanisms to [control reasoning effort levels in contemporary LLMs](https://magazine.sebastianraschka.com/p/controlling-reasoning-effort-in-llms).
    Reasoning models are still as relevant as ever. In fact, almost all current-generation
    LLMs today are reasoning models or offer a reasoning mode.\n\nFor those who are
    interested in how reasoning models work, including inference scaling, reinforcement
    learning, and distillation, I wrote my recent [Build Reasoning Model (From Scratch),](https://mng.bz/Nwr7)
    which implements these from the ground up in PyTorch, which, in my experience,
    is still the best way to understand and learn how things really work.\n\nNow,
    in the last few months, I also sat down and recorded accompanying lectures I wanted
    to share with you. So, below, you will find eight reasoning model-from-scratch
    coding videos (11 hours of content).\n\nWe start with a pre-trained LLM and implement
    methods to evaluate and improve it in Python and PyTorch. So, if you enjoyed my
    [Coding LLMs from the Ground Up](https://magazine.sebastianraschka.com/p/coding-llms-from-the-ground-up)
    course last year, this is essentially the sequel (but you can also watch it without
    the prior course as a prerequisite).\n\nI’m currently taking a short break and
    will be back soon with more exciting LLM research roundups next month. In the
    meantime, I hope you enjoy coding along!\n\n## How LLMs, reasoning models, and
    agents relate and fit together\n\nAs a small side note, and since I often get
    asked how reasoning models relate to today’s AI agents, here’s a short section
    on this before getting started with the videos.\n\nA reasoning model is essentially
    an upgrade from a conventional LLM, that is, adding more post-training via reinforcement
    learning with verifiable rewards (and optionally inference scaling techniques)
    to make it more capable of solving more challenging problems. Classically, reasoning
    models are developed for math and code, but the capabilities can generalize to
    other problem domains as well.\n\nA reasoning model then functions as the engine
    inside an agent harness, where the agent harness is a software or tooling framework
    around the LLM/reasoning model to tackle even more challenging problems (bigger
    coding tasks, travel booking, and all other sorts of personal assistant tasks).
    The task of the harness is sophisticated context management and giving the LLM
    access to tools.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!0A8p!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff0fa0f45-5efe-4937-a0e9-970b6f65ed8e_1868x986.png)\n\nFigure
    1: An engine analogy for conventional LLMs, reasoning models, and agent harnesses.
    Figure from my [Components of a Coding Agent](https://magazine.sebastianraschka.com/p/components-of-a-coding-agent)
    article.\n\nIn this analogy depicted in the figure above, the model is the engine,
    and the agent harness adds the machinery that lets us use it for various things
    (as an upgrade from a simple chatbot interface). An agent can use either a conventional
    LLM or a reasoning model, but reasoning models are the more typical choice as
    they are more capable. (As mentioned above, most current-gen LLMs are reasoning
    models with variable reasoning effort settings.)\n\nSo, the bottom line is that
    reasoning models, as the “engine,” remain an important part of understanding modern
    LLM agents.\n\nThe resources accompanying these topics shown above are:\n\n- The
    _Build a Large Language Model (From Scratch)_ [book](https://amzn.to/4fqvn0D)
    and [videos](https://magazine.sebastianraschka.com/p/coding-llms-from-the-ground-up)\n\n-
    The _Build A Reasoning Model (From Scratch)_ [book](https://amzn.to/4aAKiFY) (and
    videos below)\n\n- The _Components of a Coding Agent_ [article](https://magazine.sebastianraschka.com/p/components-of-a-coding-agent)
    on Substack\n\nThe videos below focus on developing the reasoning model that can
    power such a system.\n\n## Scope and prerequisites\n\nThe reasoning-from-scratch
    videos focus on a small pre-trained Qwen3 model, where we implement the reasoning
    methods ourselves in Python and PyTorch. Starting with a pre-trained model lets
    us focus on the interesting part: evaluation, inference-time scaling, reinforcement
    learning, and distillation.\n\nRegarding the prerequisites, I recommend being
    comfortable with Python and PyTorch. I designed the reasoning materials as standalone
    content, so the previous Build A Large Language Model (From Scratch) content is
    recommended but not strictly required.\n\nCompute-resource-wise, you can work
    through the early text-generation and evaluation examples on a CPU. For the later
    experiments, especially training, a GPU makes the work much more practical. The
    first video covers the setup and some more recommendations; the repository also
    includes [hardware and environment recommendations](https://github.com/rasbt/reasoning-from-scratch/tree/main/ch02/02_setup-tips).\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!xQp0!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F67d8d671-53cc-4111-a3df-80ed733af3b5_1868x622.png)\n\nFigure
    2: An overview of the topics being covered.\n\n## The companion book\n\nThese
    videos accompany my book, [Build a Reasoning Model (From Scratch)](https://mng.bz/Nwr7).
    If you like to read through the explanation in more detail and at your own pace,
    work through exercises, and so on, I recommend the book as a companion here.\n\nFor
    the most in-depth learning experience, my suggestion is to read a chapter, work
    through its code alongside the corresponding video, and then try the exercises.\n\nThe
    book is available from **[Manning](https://mng.bz/Nwr7)** and **[Amazon](https://amzn.to/4aAKiFY)**,
    and the print edition is in color!\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!GRkU!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa32da890-2402-4704-a90b-b46b4f64b95c_1544x864.png)\n\nFigure
    3: A random excerpt from the [Build a Reasoning Model (From Scratch)](https://mng.bz/Nwr7)
    print book.\n\nThank you to everyone who has picked up a copy or recommended it
    to a friend. Your support helps me keep creating these materials.\n\n## The videos\n\nAs
    a last, quick side note before getting to the main videos below: For a shorter,
    more conceptual overview, I also recommend my [AI Reasoning Models course on LinkedIn
    Learning](https://www.linkedin.com/learning/ai-reasoning-models-the-building-blocks-for-the-next-generation-of-ai-applications)
    (it should be free for 24h when accessing it via the link there, which shouldn’t
    then require a LinkedIn Premium subscription).\n\nThe course is about 90 minutes
    and explains how reasoning models work, covering the main ideas behind inference-time
    scaling, reinforcement learning, and distillation. It’s a good optional preview
    if you’d like the main ideas without working through the full implementations
    below.\n\nTo get to the main part of this article, here are the eight main lecture
    videos.\n\n### 1. Motivation and code setup\n\nThe first video starts with an
    explanation of the relationship between conventional LLMs, reasoning models, and
    agents. Next, the main topic of the video is setting up the coding environment.
    This includes installing the Python and PyTorch dependencies (with uv), among
    others. I also discuss hardware choices and common setup issues.\n\n**Topics covered**\n\n-
    The relationship between conventional LLMs, reasoning models, and agent harnesses\n\n-
    On the benefits of learning through code "
