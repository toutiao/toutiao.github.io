  author: peterlk
  text: I think this is an outcome of playing with systems that we don’t actually
    understand very well on a deep level. We have found recipes that work, and have
    used graduate descent (so many PhD theses) to understand and optimize these systems,
    but we’ve built a model of language that also encodes reasoning, and those things
    are extraordinarily complex. Providing proper mathematical rigor for their explanation
    requires, as you say, the level of commitment equivalent to a math degree. Also,
    because language is so complicated and subtle, you need highly precise statistical
    models of it, and that just takes a shitload of data; hence the scale. You can
    train toy models at home, but they will suck because you actually need massive
    amounts of data to capture the nuance that language requires. And that’s to say
    nothing of multimodal models.
