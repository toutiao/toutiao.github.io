  author: elzbardico
  text: 'Machine learning IS applied mathematics, especially statistics, probability,
    and optimization. Period.<p>The &quot;baby steps&quot; are not there just for
    intelectual satisfaction, the baby steps give you the building blocks to understand
    things that become progressively more complex. The baby steps are tools, that
    once you get familiar with them, you&#x27;ll find new and new uses everywhere.<p>A
    good practical illustration of this: It is pretty hard to figure out how differential
    equations can be useful if you don&#x27;t understand what they are. And yet, I
    bet that on january of 2020, there was at least one math teacher deep down in
    the amazonian jungle playing with a compartimental model based on a system of
    ordinary differential equations, to figure out the diverse scenarios this new
    epidemic could play out if that scary new virus escaped China and those few cruise
    ships.<p>Another example: take the concept of backpropagation: the underlying
    idea behind it is the chain rule from calculus, used to work backward through
    a computation and calculate how each parameter affects the error. Now, it is way
    easier to understand it in a small CNN that you are training to recognize handwritten
    digits than trying to understand it in the context of a full transformer model.
    A digit classifier is something that is way easier and affordable for you to fiddle
    with stuff and develop and intuition on loss functions, gradients, backpropagation
    and overfitting.'
