  author: seeknotfind
  text: 'Ubsan is a misnomer here from a technical perspective. However overflow unsigned
    or not is unexpected in many cases. As such, sanitizing it (and many other hard
    to reason about behaviors) by default is great practice. For an example, when
    unsigned values are used to count, overflows from summing over 2**N often result
    in incorrect behavior. This may be incrementing or even counting beans.<p>One
    particularly famous example of a bug: <a href="https:&#x2F;&#x2F;projectzero.google&#x2F;2023&#x2F;01&#x2F;exploiting-null-dereferences-in-linux.html"
    rel="nofollow">https:&#x2F;&#x2F;projectzero.google&#x2F;2023&#x2F;01&#x2F;exploiting-null-dereferen...</a><p>We
    usually get away with ignoring unsigned rollover because most application counts
    don&#x27;t exceed 2**32 or 2**64. However, many can exceed these values, and in
    those cases, explicitly handling this case in critical systems is often better
    than ignoring potentially erroneous behavior.<p>Another concern, some people might
    have about this is the performance implications or what to do when you want to
    allow overflow. In that case you can locally disable overflow protections.'
  score: 0
