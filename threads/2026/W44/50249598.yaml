    His final solution is so tricky.  I needed to re-read it a few times to understand the trick of using <i>post decrement</i> in the for loop condition.  Personally, I would never write code like that.  I would always find a way to use ssize_t.<p>This part was an interesting requirement:<p><pre><code>    &gt; ssize_t is a POSIX thing so you&#x27;d have to define it yourself on windows.
    </code></pre>
    That seems like a lot of mental gymnastics to avoid this very simple macro:<p><pre><code>    &gt; #if defined(_WIN32) &amp;&amp; !defined(ssize_t)
        &gt; #define ssize_t SSIZE_T
        &gt; #endif
    </code></pre>
    Read about the Win32 macro SSIZE_T here: <a href="https:&#x2F;&#x2F;learn.microsoft.com&#x2F;en-us&#x2F;windows&#x2F;win32&#x2F;winprog&#x2F;windows-data-types#ssize_t" rel="nofollow">https:&#x2F;&#x2F;learn.microsoft.com&#x2F;en-us&#x2F;windows&#x2F;win32&#x2F;winprog&#x2F;wind...</a><p>To me, this solution is more readable and maintainable:<p><pre><code>    &gt; for (ssize_t i = count - 1; i &gt;= 0; i--)
        &gt; {
        &gt;     if (haystack[i] == needle)
        &gt;     {
        &gt;         *where = i;
        &gt;         return 1;
        &gt;     }
        &gt; }
        &gt; return 0;
    </code></pre>
    Alternatively, you can use a while loop where the condition appears at the end of the loop:<p><pre><code>    &gt; size_t i = count - 1;
        &gt; while (1)  &#x2F;&#x2F; true
        &gt; {
        &gt;     if (haystack[i] == needle)
        &gt;     {
        &gt;         *where = i;
        &gt;         return 1;
        &gt;     }
        &gt;     if (0 == i)
        &gt;     {
        &gt;         return 0;
        &gt;     }
        &gt;     --i;
        &gt; }</code></pre>
