  text: |-
    That&#x27;s the price of innovation, I guess; before C invented its &quot;for&quot;-loop, other languages had their equivalents generally looking like this:<p><pre><code>    FOR var = start [DOWN] TO end BY step DO ... END
    </code></pre>
    No custom increment expressions, and &quot;step&quot; even usually was only allowed to be a constant (in which case, the language usually didn&#x27;t have DOWN specifier and used the step&#x27;s sign instead). Then Dennis Ritchie invented C, and ditched the traditional &quot;do&quot;-loop (Fortran started that construct with DO, so it was called DO loop; Algol used FOR instead, but most people preferred the Fortran&#x27;s nomenclature... until C came to dominate, but that wouldn&#x27;t happen for yet another 20 years) in favour of his invention because he felt that easily iterating through linked lists or strings was a much more pressing concern:<p><pre><code>    for(p=head; p; p=p-&gt;next) { ... }

        for(s=str; *s; s++) { ... }
    </code></pre>
    The downside, of course, is that now you can&#x27;t straightforwardly write<p><pre><code>   for size_t i = count - 1 downto 0 do
          ...
       end</code></pre>
