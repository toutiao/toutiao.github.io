  author: nkurz
  text: 'Hmm.  I think both of you are both right and wrong!<p>That is, I claim that
    while it is no faster to execute a comparison against zero, it still can be faster
    to finish a loop at zero.  This is because internal to the processor, the comparison
    and the branch are two separate ops.  The comparison essentially does an arithmetic
    operation that sets a flag but throws away the result, and then the branch acts
    on it.<p>But if you finish at zero, the flag you are using is already set by the
    decrement, so no additional comparison op is necessary.  Now normally this doesn&#x27;t
    matter, since the processor is multiscalar with sufficient execution ports to
    fit in an extra comparison with no increase in total cycles spent.  But in a tiny
    and highly optimized loop, occasionally you can get about 20% gain from having
    one fewer op to execute.<p>Getting this to actually happen can be complicated
    because modern processors do op-fusion that can &quot;fuse&quot; the CMP and branch
    back into something that can be executed on a single port.  But DEC-JNZ can be
    fused too, which still gives it an advantage.  More details on this here: <a href="https:&#x2F;&#x2F;chipswiki.org&#x2F;Macro-operation_fusion"
    rel="nofollow">https:&#x2F;&#x2F;chipswiki.org&#x2F;Macro-operation_fusion</a><p>Now
    does anyone want to finish the &quot;ground speed readout&quot; routine (<a href="https:&#x2F;&#x2F;theaviationgeekclub.com&#x2F;sr-71-blackbird-pilot-tells-story-behind-famed-ground-speed-check&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;theaviationgeekclub.com&#x2F;sr-71-blackbird-pilot-tells-...</a>)
    by pointing out actually how with modern processors I&#x27;m actually wrong too?'
