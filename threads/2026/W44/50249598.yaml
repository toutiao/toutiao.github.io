    memorized. If you’re working in size_t the result simplifies: everything becomes
    size_t. And you generally have size_t anyway as you’re using the result of sizeof
    or an allocation size passed to your allocation function.<p>In general I want
    to avoid signed types for counts and sizes as then you have to consider both boundary
