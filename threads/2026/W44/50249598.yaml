  author: bugake
  text: I quote from &quot;Optimizing Software in C++&quot; by Agner Fog:<p>&quot;Comparing
    an integer to zero is sometimes more efficient than comparing it to any other
    number. Therefore, it is slightly more efficient to make a loop count down to
    zero than to make it count up to some positive value, n. But not if the loop counter
    is used as an array index. The data cache is optimized for accessing arrays forwards,
    not backwards.&quot;<p>Yet that text was written for older CPUs. Modern CPUs are
    better at prefetching backwards access patterns, but if you try a microbenchmark
    with backwards array traversal, you may get misleading results.
