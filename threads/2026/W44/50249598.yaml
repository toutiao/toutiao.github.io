  text: A cargo cult wisdom snippet is the belief that compilers automagically apply
    every possible optimization. But they don&#x27;t, because compilers don&#x27;t
    know everything you know. Compilers have to assume that your code can be subject
    to side effects you never thought of, that would change the result of the code,
    so a lot of possible optimizations are avoided.
