    the right thing using the overflow flag (though the way this is written doesn&#x27;t
    favor this).<p>I&#x27;m not recommending, I&#x27;m just saying compilers traditionally
    have just thrown their hands in the air, kicked the developer around with a stupid
    error message and called it a day. Apparently only recently they started emitting
    a warning.<p>The &quot;best&quot; developer was the one who took the abuse the
