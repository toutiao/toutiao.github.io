  text: |-
    Even Turing completeness is not always clearly a weird machine: if you can draw on a bitmap board without limits, giving you game-of-life as a tool creates Turing-completeness but doesn't change what can be on the board in the end!
    Here the construction is kind of even weaker: you can run arbitrary computation but not even construct an arbitrary novel string. Although obviously one can have a faster — and string-construction-capable — alternative version, because substring replacement are easy to implement here.
    With cURL, as the article almost-explicitly notes, you start at the more powerful end of the airtight hatch than you end up. Although security implications are not strictly zero, it can be used to nerd-snipe people away from the weird machines they should have paid more attention to…
