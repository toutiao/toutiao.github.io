  text: |-
    Yes it seems there is no strict definition of "weird machine"
    My understanding was that LangSec wanted input formats NOT to be Turing complete (at least if you cross a trust boundary, which I mentioned curl config does not [1])
    But the Dullien paper seems to weaken that a bit -- Turing completeness is allowed, as long as there is no "weird state" an attacker can "trick" you into entering.  All the states of a Turing machine could be allowed by the spec.
    In this case, the only "weird state" was probably crash/stack overflow, which is why they limited the depth to 5 as a fix.

    [1] On second thought, it is trivial to make a curl service that takes user curl configs, which makes it a trust boundary.  I have been thinking about this problem for many years with respect to config language design (e.g. YSH and Hay, and Hay is Turing complete), which is  why I mention it ...
