    ‘Denmark in Minecraft’ was released in April 2014 by the Danish Geodata Agency.
    The project was conceived, developed and operated by Simon Lyngby Kokkendorff,
    Thorbjørn Kjærshøj Nielsen and Nynne Sole Dalå, the founders of GeoBoxers.<p>&gt;
    The work was funded and carried out by the Danish Geodata Agency as an initiative
    following the 2013 “basic data programme”, where a significant amount of public
    Danish data were made available for free. The purpose was to make geographical
    and topographical data available through Minecraft, and help disseminate the free
    data to a broader audience and specifically reach children.<p>&gt; Denmark in
    Minecraft was released with an invitation to teachers and schools to use the data
    in geography, math, science and history lessons, and within the first few months
    Minecraft-data were downloaded 300.000 times from the Geodata Agency, and around
    37.000 unique users logged in to the agency’s Minecraft-servers.<p>&gt; January
    1st, 2016 the Danish Geodata Agency changed into the Agency for Data Supply and
    Efficiency, and links in English regarding “Denmark in Minecraft” were removed.
    Since 2020 Denmark in Minecraft can no longer be downloaded.
