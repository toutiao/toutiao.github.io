    passwords were actually expired - all were working.  This is confusing - did they
    only expire passwords that were under threat?  If a password wasn&#x27;t expired,
    should it be trusted?<p>The same email suggests you change all email passwords
    you control.<p>Another account received no email warning from DreamHost so I assumed
    it was fine, but 7 hours later it also received the same generic email.<p>My complaints:<p>-
