  author: llm_nerd
  text: It&#x27;s all the same helium, of course, going through different levels of
    industrial purification. I only clarify this as it isn&#x27;t like we find super
    pure reserves in nature and that&#x27;s what is lucrative, but instead it&#x27;s
    all the same contaminated helium and then it gets processed to further and further
    levels of purification, like many other industrial products.<p>If there is a shortage
    of helium, it&#x27;s a shortage of all the same helium. But so long as it&#x27;s
    treated as a novelty gas, and so long as it continues to just be wasted, it&#x27;s
    hard to take claims of a shortage too seriously.<p>As a fun fact, the vast majority
    of helium on Earth is courtesy of the radioactive alpha decay chain starting from
    heavy elements like Uranium and Thorium. Helium got trapped by the same geological
    formations that trapped natural gas, hence why they&#x27;re usually found together
    despite being from completely different processes.
