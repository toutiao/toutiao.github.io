    some 425 miles of pipelines spanning Texas, Kansas and Oklahoma, plus about 1
    billion cubic feet of the only element on Earth cold enough to make an MRI machine
    work.<p>&gt; ...<p>&gt; The sale has been in the works for more than a decade.
    Congress first mandated it through the Helium Stewardship Act of 2013. It was
    initially supposed to occur in 2021, but a series of delays — in part due to the
    same logistical and regulatory issues threatening shutdowns today — postponed
    the auction to Thursday.<p>---<p>The Helium Stewardship Act: <a href="https:&#x2F;&#x2F;www.congress.gov&#x2F;bill&#x2F;113th-congress&#x2F;house-bill&#x2F;527"
