  author: wahern
  text: Goroutines and lexical closures create a dilemma for embedded targets. Go
    was designed around the notion that using goroutines (threading, basically) should
    be effortless and employed without hesititation. Lexical closures is a critical
    aspect of that, and by extension GC. Both goroutines and lexical closures require
    dynamic allocation, at least when combined with some other Go design decisions
    (e.g. seamless recursion, dynamic method invocation, etc).<p>Go does a great job
    of making these impose minimal cost, both technically and cognitively, on typical
    platforms, from server (including many &quot;embedded&quot; server environments)
    to desktop to smartphone. That&#x27;s why it has such a sophisticated yet largely
    transparent user space threading layer. But it&#x27;s very difficult and usually
    impractical for Go to target extremely resource constrained environments without
    exposing and crippling it&#x27;s core abstractions. Some people are willing to
    contort Go to fit that space, but perhaps that&#x27;s because their vision of
    what makes Go, Go, differs from the creators&#x27; and core maintainers&#x27;
    understanding of Go.
