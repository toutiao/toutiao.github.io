  author: jacquesm
  text: 'No, it is for any radiator. The gain of the antennas has absolutely nothing
    to do with the free path loss, it just changes the effective radiated power or
    the concentration effect of the antenna because of antenna related gains. Every
    kind of antenna has its own specific gain and corresponding losses diagram based
    on which way the source is relative to the antenna, with the baseline being an
    omnidirectional radiator (which no antenna really is, but we assume it is).<p>GP
    was very specific when they mentioned free path loss: the implication is that
    if you know what free path loss is then you <i>also</i> know that those losses
    are accurately modeled with that formula, no matter how large your ERP or receiver
    antenna gain is. At those distances it would make zero sense to use an omnidirectional
    antenna you will need every bit of gain you can get.'
