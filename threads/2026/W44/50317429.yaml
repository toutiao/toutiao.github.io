  text: |-
    I&#x27;m just going to repost stuff from my blog about the Voyager space probes. I&#x27;ve posted this here before -
    The two Voyager spacecraft are the greatest love letters humanity has ever sent into the void.<p>Voyager 2 actually launched first, on August 20, 1977, followed by Voyager 1 on September 5, 1977. Because Voyager 1 was on a faster, shorter trajectory (it used a rare alignment to slingshot past both Jupiter and Saturn quicker), it overtook its twin and became the farther, faster probe. As of 2025, Voyager 1 is the most distant human-made object ever, more than 24 billion kilometers away, still whispering data home at 160 bits per second.<p>Each spacecraft carries an identical 12-inch gold-plated copper phonograph record.<p>The contents:<p>- Greetings in 55 human languages.<p>- A message from UN Secretary-General at the time and one from U.S. President Jimmy Carter.<p>- 115 analog images encoded in the record’s grooves: how to build the stylus and play the record, the solar system’s location using 14 pulsars as galactic GPS, diagrams of human DNA, photos of a supermarket, a sunset, a fetus, people eating, licking ice cream, and dancing<p>The record is encased in an aluminum jacket with instructions etched on the cover: a map of the pulsars, the hydrogen atom diagram so aliens can decode the time units, and a tiny sample of uranium-238 so they can carbon-date how old the record is when they find it.<p>Sagan wanted the record to be a message in a bottle for a billion years. The spacecraft themselves are expected to outlive Earth. In a billion years, when the Sun swells into a red giant and maybe swallows Earth, the Voyagers will still be cruising the Milky Way, silent gold disks carrying blind, naked humans waving hello to a universe that may never wave back.<p>And it was Sagan who, in 1989, when Voyager 1 was already beyond Neptune and its cameras were scheduled to be turned off forever to save power, begged NASA for one last maneuver. On Valentine’s Day 1990, the spacecraft turned around, took 60 final images, and captured Earth as a single pale blue pixel floating in a scattered beam of sunlight — the photograph that gives the book its name and its soul.<p>It was the photograph that inspired this famous quote -<p>&quot;Look again at that dot. That&#x27;s here. That&#x27;s home. That&#x27;s us. On it everyone you love, everyone you know, everyone you ever heard of, every human being who ever was, lived out their lives. The aggregate of our joy and suffering, thousands of confident religions, ideologies, and economic doctrines, every hunter and forager, every hero and coward, every creator and destroyer of civilization, every king and peasant, every young couple in love, every mother and father, hopeful child, inventor and explorer, every teacher of morals, every corrupt politician, every &quot;superstar,&quot; every &quot;supreme leader,&quot; every saint and sinner in the history of our species lived there-on a mote of dust suspended in a sunbeam.<p>The Earth is a very small stage in a vast cosmic arena. Think of the endless cruelties visited by the inhabitants of one corner of this pixel on the scarcely distinguishable inhabitants of some other corner, how frequent their misunderstandings, how eager they are to kill one another, how fervent their hatreds. Think of the rivers of blood spilled by all those generals and emperors so that, in glory and triumph, they could become the momentary masters of a fraction of a dot.<p>Our posturings, our imagined self-importance, the delusion that we have some privileged position in the Universe, are challenged by this point of pale light. Our planet is a lonely speck in the great enveloping cosmic dark. In our obscurity, in all this vastness, there is no hint that help will come from elsewhere to save us from ourselves.<p>The Earth is the only world known so far to harbor life. There is nowhere else, at least in the near future, to which our species could migrate. Visit, yes. Settle, not yet. Like it or not, for the moment the Earth is where we make our stand.<p>It has been said that astronomy is a humbling and character-building experience. There is perhaps no better demonstration of the folly of human conceits than this distant image of our tiny world. To me, it underscores our responsibility to deal more kindly with one another, and to preserve and cherish the pale blue dot, the only home we&#x27;ve ever known. &quot;<p>That picture almost didn’t happen. NASA said it was pointless, the cameras were old, the images would be useless. Sagan argued it would be the first time any human ever saw our world from outside the solar system. He won. The cameras were powered up one last time, the portrait was taken, and then they were shut down forever.<p>- <a href="https:&#x2F;&#x2F;www.rxjourney.net&#x2F;30-things-i-know" rel="nofollow">https:&#x2F;&#x2F;www.rxjourney.net&#x2F;30-things-i-know</a>
  score: 0
