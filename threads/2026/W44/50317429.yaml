  author: ButlerianJihad
  text: The hypothetical Oort Cloud is not a good way to describe a boundary or destination.
    We only know of circumstancial evidence for it. There have been no direct observations.
    We believe that it is extraordinarily sparse. Therefore, its beginning and end
    would be poorly defined.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Kuiper_belt"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Kuiper_belt</a><p>Everyone*
    knows about the Kuiper Belt, of course, but we are looking into at least two other
    “reservoirs” of TNOs between those named ones.<p>* <a href="https:&#x2F;&#x2F;m.xkcd.com&#x2F;2501&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;m.xkcd.com&#x2F;2501&#x2F;</a>
