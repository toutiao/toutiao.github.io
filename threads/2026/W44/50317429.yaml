  content: "# What Is a Light-Day? \n\nThe milestone Voyager 1 is closing in on is
    about distance, not time.   \nAnd it's very, very far.\n\n![This artist concept
    shows NASA's twin Voyager spacecraft, celebrating 40 years of continual operation
    in August and September 2017.](https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia21/pia21839/PIA21839.tif?w=2048)\n\nThe
    Voyager 1 spacecraft, traveling for nearly 50 years, will soon cross a mile marker
    reached by no other human-made object — one light-day away from Earth. That’s
    the distance a particle of light can travel in 24 hours, equaling about 16 billion
    miles (about 26 billion kilometers), a point that Voyager 1 will reach on Wednesday,
    Nov. 18, 2026, at 5:16:07 a.m. EST.\n\nVoyager 1 to Reach One Light-Day\n\n17\n\ndays\n:\n\n06\n\nhrs\n:\n\n08\n\nmins\n:\n\n57\n\nsecs\n\nNOV
    18, 2026, 5:16AM EST\n\nIts twin spacecraft, [Voyager 2](https://science.nasa.gov/mission/voyager/voyager-2/),
    took a different path through the solar system after they launched in 1977, in
    order to visit Uranus and Neptune. Voyager 2 is on pace to be one light-day away
    from Earth in nine more years, in November 2035.\n\n## Why measure with light?\n\nNothing
    in the universe travels faster than light. Moving through space about 186,000
    miles every second, it crosses enormous distances in a given time period, whether
    it’s a second, a day, or a year. This is true for any type of electromagnetic
    radiation, including visible light, microwaves, radio waves, gamma rays, X-rays,
    or infrared. A light-day is the distance that light will travel in 24 hours, or
    16,094,799,096 miles (25,902,068,356 kilometers).&nbsp;\n\nTo put this mileage
    into perspective, consider some other light-distances:&nbsp;\n\n- The Moon is
    238,855 miles (384,400 kilometers) from Earth, on average. The astronauts on the
    Artemis II mission took about three days to get there, but light can traverse
    that distance in 1.3 seconds.\n- Sunlight takes about eight minutes and 20 seconds
    to travel the 93 million miles from the Sun to Earth (about 150 million kilometers),
    meaning our nearest star is about 8.3 light-minutes away.&nbsp;\n- The distance
    between Earth and Mars changes as they orbit the Sun, and it can take anywhere
    from three minutes to 22 minutes for light to travel between the two planets.
    Same for a radio transmission, either to or from a spacecraft at Mars.&nbsp;\n-
    Neptune, the most distant planet in our solar system, with an average distance
    from Earth of about 2.8 billion miles (4.5 billion kilometers), is four light-hours
    and 10 light-minutes away. It took Voyager 2, traveling about 35,000 miles per
    hour, 12 years to reach Neptune.\n\nThat’s why light-year — how far light can
    travel in a year — is used to measure and convey the vastness of space. It’s about
    5.88 trillion miles (9.46 trillion kilometers). The closest neighboring solar
    system to our own, the star Proxima Centauri and its one or more planets, is about
    4.24 light-years away (or, about 24.95 trillion miles, or 40.15 trillion kilometers).
    And the next-closest galaxy to our own Milky Way, the Andromeda galaxy, is about
    2.5 million light-years away.\n\n## Where is Voyager 1 going?\n\nVoyager 1 is
    headed in the direction of a star more than 17 light-years away from Earth called
    [AC +79 3888](https://www.nasa.gov/image-article/reaching-stars/), also known
    as Gliese 445. It’s an obscure star now in the constellation Ursa Minor (the Little
    Bear or Little Dipper), and Voyager 1 is expected to pass within about 1.7 light-years
    of it — in 40,000 years. Even though the spacecraft, in flight since 1977, is
    cruising at nearly 38,000 mph (61,000 kph) through the vacuum of space, that’s
    a relative crawl compared to the speed of light.\n\nWhen Voyager 1 makes its mark
    Nov. 18, the spacecraft will have taken 49 years, two months, and 11 days to have
    traveled one light-day beyond Earth — a huge milestone by any measure, and a day
    worth celebrating.\n\n## Learn More \n\n![NASA's twin Voyager spacecraft, launched
    in 1977, are now traveling through interstellar space at around 35,000 mph (56,000
    kph). This artist's concept depicts one of the probes speeding away.](https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia26/pia26353/PIA26353.tif?w=150)\n\n##
    Where Are Voyager 1 and 2 Now?\n\nCheck the cosmic odometer for each spacecraft,
    and watch the miles roll over by the second — in real time.\n\n![This artist's
    concept depicts NASA's Voyager 1 spacecraft entering interstellar space. Interstellar
    space is dominated by the plasma, or ionized gas, that was ejected by the death
    of nearby giant stars millions of years ago.](https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia17/pia17462/PIA17462.jpg?w=150&h=150)\n\n##
    More About Voyager 1\n\nWhat has it discovered in its nearly 50-year journey?
    Which of its instruments are still operating? Learn more about the Pale Blue Dot
    and the Golden Record.\n\n![The Andromeda galaxy, or M31, is shown here in far-infrared
    and radio wavelengths of light.](https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia25/pia25163/PIA25163.jpg?w=150&h=150)\n\n##
    How Big Is Space?\n\nListen to Episode 61 of \"We Asked a NASA Expert.\" (Spoiler:
    in getting to an answer, \"things get really weird.\")\n\n![Black background dotted
    with galaxies. A reddish galaxy at image center with a bluish-white arc above
    it. Below it to the right it a yellowish swirling galaxy, and at the top center
    is a blue-white spiral galaxy. Other spiral and elliptical galaxies appear smaller
    throughout the image, as they are farther away.](https://assets.science.nasa.gov/dynamicimage/assets/science/missions/hubble/gravitational-lens/Handful%20of%20Galaxies.jpg?w=150&h=150)\n\n##
    Cosmic Distances\n\nThe space beyond Earth is so incredibly vast that, when expressed
    in miles and kilometers — the units of measure from our everyday lives — the numbers
    grow impossibly big.\n\n![Colorful book cover for Beyond Earth: A Chronicle of
    Deep Space Exploration. It features spacecraft cutouts against a bright primary
    colors.](https://assets.science.nasa.gov/dynamicimage/assets/science/psd/solar/2023/09/b/beyondearth_cover.png?w=150&h=150&fit=crop&crop=faces,focalpoint)\n\n##
    Beyond Earth: A Chronicle of Deep Space Exploration\n\nA comprehensive history
    of missions sent to explore beyond Earth.\n\n## See where Voyager 1 is now\n\n###
    Use NASA’s “Eyes on the Solar System” interactive visualization tool\n\n_Use NASA’s
    interactive tool “Eyes on the Solar System” to see where Voyager 1 is right now.
    Or, travel back in time and ride along when Voyager 1 visited Jupiter and Saturn,
    or when it turned homeward to capture the iconic “Pale Blue Dot” photo of Earth,
    or anytime since then, when it left the solar systema and became the first spacecraft
    to enter interstellar space. \nNASA/JPL-Caltech_\n\nKeep Exploring\n\n## Discover
    More Topics From NASA\n\n[\n\nWhat is a light-year?\n\n![](https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2025/01/STScI-01JFGB703ZW2EWTVJXZDM4WX87.png?w=1091&h=1299&fit=clip&crop=faces%2Cfocalpoint)\n\n](https://science.nasa.gov/exoplanets/what-is-a-light-year/)[\n\nOur
    Solar System\n\n![](https://science.nasa.gov/wp-content/uploads/2023/06/solar-system-illustration-16x9-1.jpg?w=1536)\n\n](https://science.nasa.gov/solar-system/overview/)[\n\nHeliosphere\n\n![](https://science.nasa.gov/wp-content/uploads/2023/04/2g.Heliosphere_Image_main_BoundariesLg-2-jpg.webp?w=1536)\n\n](https://science.nasa.gov/heliophysics/focus-areas/heliosphere/)[\n\nUniverse\n\n![](https://science.nasa.gov/wp-content/uploads/2023/09/ngc5068-1-flat-final.jpg?w=1536)\n\n](https://science.nasa.gov/universe/)"
