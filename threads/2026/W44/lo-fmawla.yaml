  content: "#### Enlightenment 0.28.0 Release\n\n- \n _2026-10-31 - by Carsten Haitzler_\n\nThis
    is the latest release of Enlightenment.\n\n- \n Added initial NetBSD support,
    including power commands and signal handling.\n- \n Added a NetworkManager module
    supporting Wi-Fi, Ethernet, Bluetooth networking, and VPNs.\n- \n Added automatic
    detection of NetworkManager and ConnMan network services.\n- \n Added network
    signal strength, security indicators, connection details, and tooltips.\n- \n
    Added saved connection management and forget buttons to NetworkManager and ConnMan.\n-
    \n Added NetworkManager traffic indicators, threaded polling, and configurable
    polling intervals.\n- \n Added VPN import, username prompts, authentication messages,
    and remembered form fields.\n- \n Added connectivity callbacks and captive portal
    login refresh handling.\n- \n Modernized NetworkManager dialogs, connection lists,
    Wi-Fi controls, and theme integration.\n- \n Fixed NetworkManager startup detection,
    suspend/resume dialog spam, and stale VPN indicators.\n- \n Fixed NetworkManager
    memory safety, D-Bus lifecycle, shutdown races, and popup refresh loops.\n- \n
    Added native PipeWire mixer support alongside PulseAudio.\n- \n Added mixer actions
    to select audio outputs and cycle between sinks.\n- \n Improved mixer event handling,
    popup keyboard controls, and missing-output error handling.\n- \n Added an integrated
    clipboard history module with configurable persistent history.\n- \n Modernized
    clipboard popups with themed controls and individually removable history entries.\n-
    \n Improved clipboard content tracking, selection timing, startup, shutdown, and
    configuration handling.\n- \n Restored the Pants module with skirts, kilts, lederhosen,
    malloc variants, and translations.\n- \n Added battery charge limits and remembered
    maximum charge settings per battery.\n- \n Moved battery and AC polling into a
    worker thread.\n- \n Removed the obsolete battery helper, fixed BSD builds, and
    capped displayed battery health at 100%.\n- \n Added ACPI CPU power profile support
    and handling for all kernel-provided options.\n- \n Matched AMD GPU power settings
    to CPU power levels.\n- \n Extended CPU polling intervals and reduced polling
    while displays are off.\n- \n Fixed CPU frequency gadget startup, sizing, and
    gradient rendering.\n- \n Fixed deferred suspend handling and unnecessary powersave
    wakeups.\n- \n Enabled process priority adjustments through the system helper
    without requiring `CAP_SYS_NICE` on Enlightenment.\n- \n Improved process statistics
    CPU accounting, formatting, layering, and window-change handling.\n- \n Fixed
    process statistics shutdown waits and invalid polling wakeups.\n- \n Added configurable
    X11 keyboard repeat rate and delay.\n- \n Added a smooth “Roll Up” window shading
    transition.\n- \n Added window actions for always-on-top, always-below, and normal
    stacking.\n- \n Fixed fullscreen layering, focused dialog stacking, and remembered
    window stacking.\n- \n Fixed maximization for client-side decorations and windows
    maximized at startup.\n- \n Fixed shaped input regions and mouse handling for
    borderless and fullscreen windows.\n- \n Fixed pointer focus selection and prevented
    pointer warping during mouse drags.\n- \n Fixed client tracking cleanup, icon
    double frees, and graph/video object leaks.\n- \n Fixed monitor disconnect handling,
    CRTC shutdown, and virtual screen shrinking.\n- \n Fixed display startup black
    screens, duplicate zone updates, and canvas reconfiguration.\n- \n Improved display
    mode sorting and guarded Wayland canvas updates during startup.\n- \n Removed
    per-desktop and per-screen profile support.\n- \n Fixed DDC display rediscovery,
    fuzzy EDID matching, library compatibility, and XDG paths.\n- \n Improved backlight
    filtering to exclude unsuitable LED devices.\n- \n Fixed gadget dragging, positioning,
    ordering, sizing, and mouse event handling.\n- \n Prevented unintended shelf gadget
    detachment and improved autoscroll behavior.\n- \n Fixed delayed gadget popups
    and improved Escape-key and mouse-wheel handling.\n- \n Improved taskbar and IBox
    refill behavior and live previews of minimized windows.\n- \n Fixed IBar launch
    indicators, fullscreen animations, popup handling, and orientation.\n- \n Avoided
    unnecessary IBar layout updates when the gadget only moves.\n- \n Improved window
    switcher layout performance and allowed operation without a mouse grab.\n- \n
    Fixed Bluetooth daemon restart crashes, disappearing devices, and immediate unpairing.\n-
    \n Improved Bluetooth adapter controls and battery icon restoration after reconnecting.\n-
    \n Fixed notification callback lifetime issues and popup reshuffle use-after-free
    errors.\n- \n Fixed system tray and D-Bus menu reference counting and memory access.\n-
    \n Fixed music-control shutdown cleanup and inhibition cleanup on message bus
    shutdown.\n- \n Fixed file manager monitor cleanup, null action lookups, and Everything
    substring matching.\n- \n Hid application menu and shortcut actions when desktop
    entries are unavailable.\n- \n Changed wallpaper selection to default to the current
    desktop and fixed custom lock-screen backgrounds.\n- \n Preserved existing Qt
    environment settings and corrected default launcher and tiling configuration.\n-
    \n Improved setup wizard cleanup and handling of missing keyboard layout rules.\n-
    \n Improved pixmap handling, X connection recovery, and nested Wayland compositor
    shutdown.\n- \n Started watchdog monitoring earlier and added environment overrides
    for watchdog and OpenGL use.\n- \n Restored Valgrind startup support and added
    suppressions for known false positives.\n- \n Added timestamped logging, improved
    signal diagnostics, and cleaned up debug output.\n- \n Fixed screenshot uploader
    output and ACPI file-descriptor cleanup.\n- \n Updated French, Italian, Japanese,
    and Portuguese translations and translation tooling.\n- \n Updated authors, copyright
    notices, dependency documentation, and build metadata.\n- \n Cleaned up compiler
    warnings, module headers, configuration code, and formatting.\n\n| LINK | SHA256
    |\n| [enlightenment-0.27.0.tar.xz](http://download.enlightenment.org/rel/apps/enlightenment/enlightenment-0.28.0.tar.xz
    \"http://download.enlightenment.org/rel/apps/enlightenment/enlightenment-0.28.0.tar.xz\")
    | 8ab2d8a76c4009d142561f5136048b969796f4a79df8af6018713d1d163a5c6b |\n\n#####
    Building and Dependencies\n\n1. \n [EFL](https://git.enlightenment.org/enlightenment/efl/src/branch/master/README.md
    \"https://git.enlightenment.org/enlightenment/efl/src/branch/master/README.md\")\n2.
    \n libexif\n3. \n libpam (Linux only)\n\nHighly recommended to ensure proper functionality
    (though you can live without these):\n\n1. \n connman (For network configuration
    support)\n2. \n networkmanager (For network configuration support)\n3. \n bluez5
    (For bluetooth configuration and control)\n4. \n bc (For the everything module
    calculator mode)\n5. \n pulseaudio (For proper audio device control and redirection)\n6.
    \n pipewire (For proper audio device control and redirection)\n7. \n packagekit
    (For the built in system updates monitoring and updater)\n8. \n udisks2 (For removable
    storage mounting/unmounting)\n9. \n ddcutil (specifically libddcutil.so.2/3/4/5
    for backlight control)\n10. \n gdb (If you want automatic backtraces on a crash
    in ~/.e-crashdump.txt - don't forget to build EFL and E with gdb debugging to
    make this useful)\n\n**Note:** Enlightenment 0.28.0 depends on EFL **v1.29.0**
    or newer.\n\n* * *\n\n![](/_media/blank.png?w=100&tok=e8ed0c)"
