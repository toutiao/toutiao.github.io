  text: |-
    If you use KeePass, make sure to use the remote storage integrations for it, that'll make sure that you get useful sync/merge behavior.
    KeePass isn't just XC, there's also apps for both Android and iOS that have autofill integration, and that'll connect to a Google Drive or SFTP folder and do intelligent merging, as long as you use an integration so it knows that it's a remote folder, and not just a local folder that happens to be sync'd.
    I can attest that I'm using KeePass (via Keepass2Android and OneKeyPass) for my partner and I, and it's working nicely against an SFTP folder, and my partner basically only had to switch from using 1password to using the KeePass apps.
