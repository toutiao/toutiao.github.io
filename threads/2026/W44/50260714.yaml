  text: That&#x27;s kind of a weird list of languages. C and C++ are both memory unsafe
    languages. Every Android patch round about half of the vulnerabilities are memory
    safety bugs in C or C++ applications. Both Google and Microsoft independent from
    each other concluded that most vulnerabilities are caused by memory safety issues.
    Zig is also not fully memory safe and Go has a garbage collector just like Java.
    The Go garbage collector situation is probably worse than Java because it only
    has a single implementation and you have no choice. Meaning it had better fit
    your scenario or otherwise your screwed.
