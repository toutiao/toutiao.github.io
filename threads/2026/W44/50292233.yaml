  author: microtonal
  text: Not to downplay his accomplishments (I have sung my praises in another comment),
    but even vector models were already around and somewhat popular before. Much of
    it started in Information Retrieval with things like TF-IDF vectors and later
    PPMI matrices that were converted to small, dense matrices with SVD. Of course,
    later Yoshua Bengio et al. introduced neural language models for training embeddings.<p>There
    is even a paper by Levy &amp; Goldberg from 2014 that shows that skip-gram with
    negative sampling implicitly factorizes a PPMI word-context matrix.<p>But Mikolov&#x27;s
    formulation is very nice in that it is a simple linear model that allows for a
    very simple Hogwild optimization that worked very well&#x2F;fast on multi-core
    CPUs of the time.
