  author: mikewarot
  text: |-
    I object to the inclusion of mRNA based treatments into the category of Vaccine.<p>According to wikipedia, the mechanism they (the mRNA based treatments) use is:<p><pre><code>  In contrast, mRNA vaccines introduce a short-lived[58] synthetically created fragment of the RNA sequence of a virus into the individual being vaccinated. These mRNA fragments are taken up by dendritic cells through phagocytosis.[59] The dendritic cells use their internal machinery (ribosomes) to read the mRNA and produce the viral antigens that the mRNA encodes.[4] The body degrades the mRNA fragments within a few days of introduction.[60] Although non-immune cells can potentially also absorb vaccine mRNA, produce antigens, and display the antigens on their surfaces, dendritic cells absorb the mRNA globules much more readily.[61] The mRNA fragments are translated in the cytoplasm and do not affect the body&#x27;s genomic DNA, located separately in the cell nucleus.[1][62]
    </code></pre>
    So, it&#x27;s a short lived, self limited <i>gene therapy</i>, not a vaccine. It hijacks the patients own cells to provoke an immune response.  If the cells hijacked happen to be in tissue other than the intended injection site, via blood circulation, for example... you can (and sometimes do) have things like heart tissue being attacked by the immune system, with health altering results.<p>We shouldn&#x27;t let the category of vaccines include these treatments. It obscures informed consent in a manner that seems to border on deception for better marketing purposes.
