  author: sfink
  text: 'I lost a friend who died from complications caused by chemotherapy. That&#x27;s
    a true statement. It&#x27;s also true that she would most likely have died at
    least a decade earlier, maybe two decades,  had she not done chemotherapy. (She
    was on her 3rd or 4th relapse.)<p>I don&#x27;t mind the above wording at all,
    because there&#x27;s another thing that happens: people seem to have this impression
    that if you get cancer, follow the recommended treatment, and are in remission...
    that you&#x27;re &quot;done&quot;, and you &quot;won&quot;. It isn&#x27;t like
    that. First, the treatments have serious side effects, both short and long term.
    Second, cancer is never gone from your life, even if it never comes back. That
    doesn&#x27;t mean you should not do the recommended and available treatments.
    Your odds of survival are almost always much much higher if you do, and imo is
    the right thing to do for the vast majority of people. But go into it with your
    eyes open. You&#x27;re past the point where you get to have a conventional happy
    ending. You&#x27;ll need to figure out how to be ok with the ending that you <i>can</i>
    still have. (Which may be a happy one! But not in the way that you imagined when
    you were younger.)'
