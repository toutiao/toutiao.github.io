  author: fourteenrhinos
  text: For future reference, the preparation for reporting trial data and submission
    to regulatory agencies typically happens in parallel. Both activities take time
    and the company is highly motivated for both to happen as quickly as possible.<p>In
    practice, data for new cancer treatments is usually published 6-12 months before
    approval. There are definitely exceptions, especially where the drug is already
    approved and the data is supporting a new use, but that is not the norm for new
    drugs.<p>There are other factors too e.g. it can take time to make commercial
    drug supply available. In this specific case how Merck&#x2F;Moderna will scale
    the boutique manufacturing process for a much larger number of patients while
    maintaining the speed they need for the treatment to work is a major question.<p>Again,
    the company is extremely motivated to do all of this as fast as possible. In addition
    to the points raised elsewhere in this chain.
