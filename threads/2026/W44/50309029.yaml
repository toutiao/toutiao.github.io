  author: ndiddy
  text: Some former Be employees have commented here in the past saying that Apple
    made the right decision to buy Next and not Be from a technical perspective, as
    BeOS had poor code quality and was far behind NEXTSTEP in important areas like
    networking and printing. They also implemented the OS API directly in C++, which
    tied them to a specific C++ compiler (some mid-90s version of GCC) due to the
    ABI getting broken in newer versions. The 32-bit version of Haiku (modern BeOS
    reimplementation) supports BeOS software, and as a result still needs to be compiled
    with that mid-90s GCC release.<p>Beyond that, I&#x27;m not sure if buying Be would
    have fixed the managerial problems at Apple. Would they have been able to add
    the required features to BeOS to turn it into a production OS without the project
    turning into another Copland? Would the existing Apple management have slimmed
    down the massive Apple product line that had dozens of nearly identical models?
    Would it have gotten rid of dead-end projects like Newton and Pippin? Etc.
