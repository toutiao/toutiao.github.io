  text: Outside of the GUI, Be is a <i>very</i> thin veneer over Unix. There is, no
    joke, a class named &quot;BStatable&quot; which, if you know some Unix, is just
    stat, because of course what their OS kernel implements is just stat.<p>In the
    places where there&#x27;s something entirely different going on, such as networking
    in earlier BeOS, it&#x27;s trash and you&#x27;d obviously want to throw it away
    and do what Unix did - Be were doing so. So a hypothetical turn of the century
    fruit-flavour BeOS is probably much closer to &quot;Unix with a different UI&quot;
    than you&#x27;re thinking. NeXT changed nothing there.
