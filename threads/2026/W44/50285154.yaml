    VR as we know it, but maybe something more real than that. Something that is limited
    in the way reality is limited.<p>&gt;People used to settle towns in the dirt when
    they scarcely had anything to eat and what, we now can&#x27;t open a community
    center, or a maker space?<p>The problem, which i have been grappling with for
    the past decade, is precisely that there is too much opportunity. there are too
    many options. Things are too interconnected. Human connection is devalued. I don&#x27;t
    think you can merely solve it with more interconnection (although I will try).<p>When
    the founders of this country got here, they similarly did it to embrace the problems
    of a dynamic, dangerous, unsolved world, and to leave the glacial solved world
    behind them. They went from an old occupied world into a new virgin world.<p>And
    I agree with you that we need to be like them, founders of a new world, but I
    disagree with you about what that new world entails because we don&#x27;t know
    of virgin lands that would free us from the grip of the old world anymore.<p>It
    used to be that if you wanted to go to a virgin land you would sail out into a
    remote island or rainforest something. But now that remote island also has sattelite
    internet and we have airplanes and boats and we realize it&#x27;s not really that
    remote. We could go to mars and the technological arm of the old world would reach
    us. Maybe the virgin, disconnected world I seek could be an underworld or something,
    so that there is justification for it to be close and meaningful and disconnected
    from the overworld. I don&#x27;t know.<p>We need to discover an unsolved world.
    Up and out!<p><a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=qUvIiBUBe-g"
