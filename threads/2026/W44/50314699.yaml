    account simply by sending them a link.\n\nMukul GoyalOct 28, 202612 mins\n\n**October
    26, 2026** Fixed\n\n**P1** Severity\n\nIn October 2026, we found a way to turn
    an ordinary public ChatGPT share into attacker-controlled JavaScript running inside
    the signed-in session of whoever opened it.\n\nAn attacker could create a malicious
    conversation, publish it using ChatGPT's normal sharing feature, and send the
    link to another user. When the victim opened the share, the payload executed as
    `chatgpt.com` with access to the victim's authenticated web session.\n\nWe confirmed
    that this code could enumerate the victim's conversation list, retrieve content
    from a private conversation that had never been shared with the attacker, and
    send data from that conversation to an external server. The payload was not limited
    to modifying the page or displaying an alert—it could directly call ChatGPT's
    authenticated APIs as the victim, essentially allowing us to take over the victim's
    ChatGPT account.\n\nThe victim did not need to install an App, join a Project,
    paste code, or open developer tools. Opening the shared link was the only required
    action.\n\nOpenAI fixed the issue on October 26 and classified the report as P1.\n\nThe
    chain started with two features that looked harmless on their own: a graph and
    an HTML Preview.\n\nflowchart TD\n      A[\"Attacker publishes a ChatGPT conversation\"]
    --> B[\"Victim opens the public share\"]\n      B --> C[\"HTML Preview crosses
    into the main chatgpt.com page\"]\n      C --> D[\"JavaScript runs in the victim's
    signed-in session\"]\n      D --> E[\"Any action on chatgpt.com as the victim:<br/>read
    private chats and files, change the account\"]\n\n### Technical walkthrough\n\n*
    * *\n\n### It started with a graph and a Preview\n\nThe question that started
    this research was simple: if Preview code was boxed into a different website,
    what could it still talk to?\n\nChatGPT can turn an HTML code block into a small
    working webpage using its Preview feature. Since that page may contain arbitrary
    code, ChatGPT sensibly runs it inside a restricted frame on a different web address.
    The Preview can run JavaScript, but the browser treats it as a different website,
    so it cannot directly inspect the signed-in ChatGPT page around it.\n\nAt first,
    this isolation appeared to work exactly as intended. Code inside the Preview could
    not read `parent.document`, which is the main ChatGPT page. That should have been
    the end of it.\n\nThe conversation also contained a normal interactive graph.
    Behind the scenes, the graph loaded a math library called MathLive. Loading it
    did more than draw the graph: it also installed a listener in the main ChatGPT
    page for messages related to MathLive's on-screen keyboard.\n\nBrowsers call the
    relevant API `postMessage`. It is a legitimate way for two frames to exchange
    information even when the browser prevents them from reading each other's pages.
    You can think of it as a mail slot: the restricted Preview cannot walk into the
    main page, but it can still drop a message through the slot.\n\nThat is safe only
    if the receiver checks who sent the message.\n\nMathLive did not make that check
    for the setting we were interested in. Its listener accepted a message that changed
    the virtual keyboard layout, and that layout was allowed to contain HTML. The
    graph had installed the receiver; the Preview gave us an untrusted sender. Two
    unrelated features had accidentally created a path across the sandbox.\n\n###
    The message that should not have worked\n\nThe Preview sent two messages. The
    first replaced a virtual keyboard layout with our HTML. The second told MathLive
    to show the keyboard, causing it to render the new layout:\n\ntop.postMessage({\n
    \     type: \"mathlive#virtual-keyboard-message\",\n      action: \"update-setting\",\n
    \     layouts: [{\n        label: \"Compatibility\",\n        layers: [{ id: \"compatibility\",
    markup }]\n      }]\n    }, \"*\");\n    \n    top.postMessage({\n      type:
    \"mathlive#virtual-keyboard-message\",\n      action: \"show\",\n      animate:
    false\n    }, \"*\");\n\nparameter\n\nMathLive recognized the public message type,
    but its top-level controller used an origin policy of `none`, which meant it accepted
    messages from any web address. It also did not require the `update-setting` message
    to come from a previously approved window. Anyone who could reach the listener
    and knew the message format could replace the layout.\n\nWhen the keyboard opened,
    MathLive joined the supplied layout into an HTML string and assigned it to `innerHTML`
    in the real ChatGPT page. A helper named `createHTML` initially looked like it
    might sanitize the value. It did not; it marked the string as trusted and passed
    our HTML through unchanged.\n\nThis was exciting, but we still did not have JavaScript
    execution. Script tags inserted through `innerHTML` do not automatically run.\n\nThe
    next step was an `iframe` using `srcdoc`, a browser feature that lets an embedded
    frame carry its HTML directly in an attribute:\n\n<iframe srcdoc=\"...\"></iframe>\n\nparameter\n\nMathLive
    inserted this frame into the main ChatGPT document without a `sandbox` attribute.
    That gave us two useful properties. First, `srcdoc` created a fresh document where
    an external script could execute. Second, because the main ChatGPT page created
    the frame, the browser gave it the `https://chatgpt.com` web identity. Code inside
    the new frame could therefore access the parent page.\n\n#### Bypassing CSP with
    YouTube JSONP\n\nChatGPT's Content Security Policy, or CSP, stopped us again.
    CSP controls which scripts a page may load, and the policy correctly blocked inline
    JavaScript. It did, however, allow scripts from YouTube.\n\nYouTube's oEmbed endpoint
    supported a JSONP-style callback parameter. JSONP responses are JavaScript rather
    than ordinary JSON. The endpoint tried to reject an invalid callback, but it placed
    the callback into the response before returning its validation error:\n\nhttps://www.youtube.com/oembed?callback=globalThis.__marker=31337;void\n\nparameter\n\nThe
    response began like this:\n\n// API callback\n    globalThis.__marker=31337;void({\n
    \     \"error\": {\n        \"code\": 400,\n        \"message\": \"Invalid JSONP
    callback name: ...\"\n      }\n    });\n\nparameter\n\nEnding our callback with
    `;void` made the object appended by YouTube harmless. Since YouTube was already
    allowed by ChatGPT's CSP, the browser loaded this response as a script and ran
    our callback inside the new frame.\n\nWe now had arbitrary JavaScript running
    as chatgpt.com. The original Preview was still isolated on its separate web address;
    we had crossed the boundary by convincing a trusted component in the main page
    to create a new, unsandboxed document for us.\n\n### Turning a lab bug into one
    public link\n\nSo far, this was a useful sandbox escape, but the first working
    version was not a convincing real-world attack. It used a researcher-controlled
    ChatGPT App as the sender. A victim would have needed to connect or invoke that
    App first.\n\nWe next tried delivering the payload through a native HTML attachment.
    ChatGPT opened the attachment inside the same sandboxed Preview, so it could send
    the malicious MathLive messages.\n\nHowever, when we exported the conversation
    as a public share, the attachment remained but the earlier graph did not. The
    graph was essential because it loaded MathLive and installed the vulnerable message
    listener in the main page. Without it, the attachment could still send the messages,
    but nothing was listening to or processing them.\n\nThe breakthrough was putting
    both pieces directly into one ordinary public conversation:\n\n1. A genuine graph
    initialized MathLive in the main page.\n2. A later assistant-authored HTML Preview
    sent the two messages.\n\nThe resulting `/share/<id>` link preserved the complete
    chain for another user. The attacker could deliver it the same way they would
    send any shared ChatGPT conversation—throug"
