    I wonder when Nim will stop adding new garbage collectors

    Unfortunately, what ultimately turned me away from Nim was that the lead developer seemed to treat Nim primarily as his toy project where he could test out his specific ideas or concepts. This tended to result in features being added, abandoned, and later deprecated without much respect for input from the community.
    This was further accelerated when LLMs became a viable way of generating code. The lead developer now generates entire specs with LLMs, where both the RFC and the corresponding features are generated with Claude. Whether this is overall negative or not is obviously up for debate, but it amplifies the speed at which (sometimes arguably) ill-designed features or design choices are added to Nim. It never really feels like the language is getting more mature; if anything, it's the opposite.
    While a BDFL is not inherently a bad thing and ultimately this programming language is his own project to do with as he pleases, this also bled into the way that the lead developer interacted with the community that had formed around the language. It felt as if he really didn't give a shit and saw differing opinions on AI usage etc as a chance to argue with someone. It also felt at times that he was working against the community moderators, who were trying to keep the community a sane and pleasant space for everyone, not with them. The moderation guidelines were comparably lax enough as they were, but he still decided to ignore them, for example banning people who raised concern about the heavy AI usage without warning.
    None of these issues on their own would necessarily be a deal-breaker on their own if the language itself was good enough to simply not care about them. Unfortunately, it isn't, breakage is still fairly common and your code randomly breaking and other similar papercuts simply made the entire experience not worth it for me.
    I am not the only one who has had issues with the lead developer's interactions with the community. This comes up fairly frequently whenever Nim is posted anywhere and at this point it kind of feels like beating a dead horse, except this is still (in my personal opinion) a problem.
    Nevertheless, it's great to see that incremental compilation, which was a long-requested feature, has been implemented in stable Nim and I wish the very best to the Nim team in their future endeavors.
    Full disclosure for transparency's sake: I am a former Nim community moderator.
