article:
  url: https://newrepublic.com/post/217281/meta-suspend-democratic-candidate-angie-nixon-instagram-account
  title: Why Did Meta Take Down This Democratic Candidate’s Instagram Page? | The
    New Republic
  fetch_status: success
  content: "Most Recent Post\n\nMeta suspended a Latino outreach Instagram account
    for Florida Democratic Senate candidate Angie Nixon without explanation just days
    before the midterms, stoking even more allegations that the massive social media
    company is meddling in elections.\n\n“Hey [@Meta](https://x.com/Meta) \U0001F44BWe
    are currently hosting a get-out-the-vote rally in Osceola County, home to a large
    Puerto Rican community, and our[#LatinosConAngie](https://x.com/hashtag/LatinosConAngie?src=hashtag_click)[@instagram](https://x.com/instagram)
    page was suddenly taken down while we were actively posting content from the event,”
    Nixon [wrote](https://x.com/AngieNixon/status/2115227239671640079) Tuesday evening
    on X. “This page is a critical communication tool for reaching Latino voters and
    mobilizing our community. With just seven days until Election Day, every minute
    matters.\n\n“We are calling on Meta to immediately restore the page and provide
    an explanation for its removal,” she continued. “Voters deserve access to critical
    election information, especially in these final days.”\n\n> [ \n>  \n> \n>  \n>
    \ \n> \n>  \n> \n>  \n> \n>  \n> View this post on Instagram\n> \n>  \n> \n>  \n>
    \n>  \n> \n>  \n> \n>  \n> \n>  \n> \n>  \n> \n>  \n> \n>  \n> \n>  \n>  \n> \n>
    \ \n> \n> ](https://www.instagram.com/p/DfBY8tckQ8Q/?utm_source=ig_embed&utm_campaign=loading)\n>
    \n> [A post shared by We the American People ❌\U0001F451 (@50501movement)](https://www.instagram.com/p/DfBY8tckQ8Q/?utm_source=ig_embed&utm_campaign=loading)\n\nNixon
    reported that the account was back up an hour later.\n\nThis comes after Meta’s
    own employees [accused](https://www.reuters.com/world/americas/meta-employees-said-lulas-accounts-were-hindered-during-brazil-election-folha-2026-10-16/)
    the massive social media company of suppressing the campaign of leftist Brazilian
    President Luiz Inácio Lula da Silva, while outside sources found it was “[actively
    boosting](https://www.commondreams.org/news/meta-algorithm-brazil-election)” right-wing
    candidate Flávio Bolsonaro’s campaign with its algorithm. Meta also [shut down
    the No Kings](https://newrepublic.com/post/216799/meta-defends-blocking-no-kings-instagram-voting)
    Instagram account the weekend of the group’s midterm protests, and gave the [same
    treatment](https://balkaninsight.com/2026/01/20/serbian-prosecutors-urged-to-probe-shutdowns-of-critical-social-media/bi/)
    to Serbian accounts critical of right-wing President Aleksandar Vučić earlier
    this year.\n\nMeta has [donated](https://newrepublic.com/post/216672/list-white-house-ballroom-donors-trump-corruption)
    $5 million to President Trump’s White House ballroom fund and $1 million to his
    inauguration fund.\n\n[\n\n](# \"Share on Facebook\")[\n\n](# \"Share on Twitter\")[\n\n](https://bsky.app/intent/compose?text=Why%20Did%20Meta%20Take%20Down%20This%20Democratic%20Candidate%E2%80%99s%20Instagram%20Page?%20https://newrepublic.com/post/217281/meta-suspend-democratic-candidate-angie-nixon-instagram-account%20via%20@newrepublic.com)[\n\n](https://reddit.com/submit?url=https://newrepublic.com/post/217281/meta-suspend-democratic-candidate-angie-nixon-instagram-account&title=Why%20Did%20Meta%20Take%20Down%20This%20Democratic%20Candidate%E2%80%99s%20Instagram%20Page?)[\n\n](https://wa.me/?text=Why%20Did%20Meta%20Take%20Down%20This%20Democratic%20Candidate%E2%80%99s%20Instagram%20Page?%20https://newrepublic.com/post/217281/meta-suspend-democratic-candidate-angie-nixon-instagram-account)[\n\n](https://threads.net/intent/post?text=Why%20Did%20Meta%20Take%20Down%20This%20Democratic%20Candidate%E2%80%99s%20Instagram%20Page?%20https://newrepublic.com/post/217281/meta-suspend-democratic-candidate-angie-nixon-instagram-account%20via%20@newrepublic)[\n\n](mailto:?subject=Why%20Did%20Meta%20Take%20Down%20This%20Democratic%20Candidate%E2%80%99s%20Instagram%20Page%3F%20-%20newrepublic.com&body=Why%20Did%20Meta%20Take%20Down%20This%20Democratic%20Candidate%E2%80%99s%20Instagram%20Page%3F%0A%0Ahttps%3A%2F%2Fnewrepublic.com%2Fpost%2F217281%2Fmeta-suspend-democratic-candidate-angie-nixon-instagram-account
    \"Share via Email\")\n\nMost Recent Post\n\nTennessee state Senator Brent Taylor’s
    adolescence must have run a bit longer than the rest of humanity’s.\n\nTaylor
    is the Republican nominee for the Volunteer State’s 9th congressional district
    and has been endorsed by Donald Trump. He is simultaneously running for reelection
    in the Tennessee state Senate, hoping to continue to represent district 31, which
    covers parts of Memphis and the southwestern portion of the state. (If he wins
    both races, he will have to resign from one of the seats, prompting a special
    election to replace him.) He has been in politics since 1995, when he was 27 years
    old, and has framed himself as a Christian family man and a committed husband.\n\nBut
    Taylor’s dual campaign—and his regional reputation—was torn to bits Tuesday when
    he confessed to sending unsolicited nudes and then proceeded to brush off the
    wanton behavior as a simple mistake of his youth.\n\n“As I near 60 years old,
    the expiration date has come and gone on any of my youthful indiscretions,” Taylor
    told the [_Nashville Scene_](https://www.nashvillescene.com/news/pithinthewind/brent-taylors-sexting-problem/article_150e5999-55f6-40a8-9bd6-7da56bfe5d84.html)
    when asked about the unsolicited nudes allegation. “Whatever story you think you’ve
    got, my wife is well aware of, and we’ve worked through it a long time ago.”\n\n“My
    God and my wife have forgiven me, and I would consider everyone else doing the
    same,” Taylor added.\n\nOne individual who was provided anonymity told the _Scene_
    that they received unwelcome nudes from the congressman as recently as 2021—when
    Taylor was 53.\n\n“All I can tell you is, in the past, I’ve been guilty of being
    a rounder, back in the day,” Taylor told the _Scene._\n\nHe did not provide a
    clear definition for the term “rounder,” even when asked. Instead, he urged the
    _Scene_’s reporter to look it up. The digital news outlet noted that “rounder”
    likely refers to a [barfly](https://wordsmith.org/words/rounder.html) prone to
    morally dubious behavior.\n\n[\n\n](# \"Share on Facebook\")[\n\n](# \"Share on
    Twitter\")[\n\n](https://bsky.app/intent/compose?text=GOP%20Candidate%20Blames%20Unsolicited%20Nudes%20on%20His%20Young%20Age%20(He%20Was%2053)%20https://newrepublic.com/post/217268/tennesee-republican-candidate-unsolicited-nudes-youthful-mistake-53%20via%20@newrepublic.com)[\n\n](https://reddit.com/submit?url=https://newrepublic.com/post/217268/tennesee-republican-candidate-unsolicited-nudes-youthful-mistake-53&title=GOP%20Candidate%20Blames%20Unsolicited%20Nudes%20on%20His%20Young%20Age%20(He%20Was%2053))[\n\n](https://wa.me/?text=GOP%20Candidate%20Blames%20Unsolicited%20Nudes%20on%20His%20Young%20Age%20(He%20Was%2053)%20https://newrepublic.com/post/217268/tennesee-republican-candidate-unsolicited-nudes-youthful-mistake-53)[\n\n](https://threads.net/intent/post?text=GOP%20Candidate%20Blames%20Unsolicited%20Nudes%20on%20His%20Young%20Age%20(He%20Was%2053)%20https://newrepublic.com/post/217268/tennesee-republican-candidate-unsolicited-nudes-youthful-mistake-53%20via%20@newrepublic)[\n\n](mailto:?subject=GOP%20Candidate%20Blames%20Unsolicited%20Nudes%20on%20His%20Young%20Age%20(He%20Was%2053)%20-%20newrepublic.com&body=GOP%20Candidate%20Blames%20Unsolicited%20Nudes%20on%20His%20Young%20Age%20(He%20Was%2053)%0A%0Ahttps%3A%2F%2Fnewrepublic.com%2Fpost%2F217268%2Ftennesee-republican-candidate-unsolicited-nudes-youthful-mistake-53
    \"Share via Email\")\n\nMost Recent Post\n\nKatie Zacharia is blaming the meanies
    in the media for her spectacular flame-out as White House press secretary.\n\nAppearing
    on Newsmax’s _Finnerty_ Tuesday, Zacharia tried to spin her own narrative on why
    she was [fired](https://newrepublic.com/post/216748/trump-fires-white-house-press-secretary-katie-zacharia)
    after just one week of serving in the White House.\n\n“Listen, the media does
