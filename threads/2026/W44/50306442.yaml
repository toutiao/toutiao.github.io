  author: dbreunig
  text: 'A couple thoughts on the process here…<p>First off, Opus 5.5 built working
    weights and code with only two prompts:<p>1. Read this article and any relevant
    source code: <a href="https:&#x2F;&#x2F;divagr.com&#x2F;blog&#x2F;qwenputer" rel="nofollow">https:&#x2F;&#x2F;divagr.com&#x2F;blog&#x2F;qwenputer</a>.
    Then explore if you could emulate the chip and ram in a Nintendo Entertainment
    System (as people do today with FPGAs in MISTRs) using this technique. If so,
    what size model would you have to build and if you could use smaller faster ones,
    could you get it to be at the standard clockspeed.<p>It returned charts well illustrating
    any model would be _slow_. But it&#x27;s still fun, so the second prompt was:<p>2.
    I think we should build it! Just for fun. It&#x27;s okay if it&#x27;s not fast.
    We want to be able to have the weights, and a cli to run them that we can point
    at a ROM.<p>Now while this was an _epic_ run by Opus (5.5 is a crazy capable model),
    this is a surprisingly well-structured challenge.<p>There is a long-lived and
    incredible community of classic gaming emulation work online for it to reference.
    And that community has created…conformance tests! Opus found them and built against
    one, that has &gt;3k golden instructions: <a href="https:&#x2F;&#x2F;github.com&#x2F;christopherpow&#x2F;nes-test-roms&#x2F;blob&#x2F;master&#x2F;other&#x2F;nestest.txt"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;christopherpow&#x2F;nes-test-roms&#x2F;blob&#x2F;master&#x2F;...</a><p>Also,
    there is the original Qwenputer repo that Opus used to drive the weight writing.
    That was essential.<p>But this is a great example of what these models can do
    with proper reference materials, great specs, conformance tests, and clear direction.'
