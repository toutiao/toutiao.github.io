  author: xyzzy123
  text: Most of the world does NOT optimise for efficiency, particularly at the big
    end. Really big hyperscale companies (and some startups) are unusual because they
    at least sort of try, most of the world is not even trying.<p>The org structure
    is optimised to reduce or even minimise individual agency, explicitly at the cost
    of efficiency.<p>Teams have fiefdoms, private repos that the rest of the org can&#x27;t
    see. You are not granted permission to see what permissions you have.  Byzantine
    department structures. Shipping &quot;hello world&quot; to production takes 3-6
    months and nobody can imagine it working any other way.<p>There&#x27;s actually
    no central directory of teams or processes. To get anything meaningful  done,
    you need the co-operation of maybe 8 teams but there&#x27;s no consistent way
    to engage them all. You have to negotiate with them all in different ways, they&#x27;re
    like little warlords, sitting and guarding access to some vital resource you need.  They
    have established a ticket-based interface with a 7 day SLA on top of a perfectly
    good vending API that could do what you need in seconds. Sometimes a blocking
    team has a 3 month backlog so your project will just have to wait.<p>Everything
    is always in the process of being restructured, so no end to end 6 month process
    happens the same way every time.<p>These organisations could use AI to run the
    end to end process in minutes. Heck, they could just put APIs on top of what they
    already have. But the way they WANT to use it is to keep doing what they&#x27;re
    doing but with EVEN MORE form filling and paperwork.<p>You would think they would
    get outcompeted, but no. The &quot;IT organisation&quot; sits like a brain slug
    on top of an enterprise with substantial regulatory, capital and execution moats.<p>Big
    cuts of course do happen in these places, but it&#x27;s often for optics (we need
    to signal that we care about efficiency, and AI is a great excuse). But you can&#x27;t
    protect yourself by being efficient and good at your job, because the cuts were
    not about output.
