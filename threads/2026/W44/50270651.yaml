  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n# \U0001F30C astroterm\n\nastroterm is a terminal-based star
    map written in C. It displays the real-time positions of stars, planets, constellations,
    and more, all within your terminal—no telescope required! Configure sky views
    by date, time, and location with precise ASCII-rendered visuals. See usage for
    all supported options!\n\nastroterm is constantly improving, and we'd love to
    hear your ideas! If you have a suggestion or find a bug, please open an issue
    and share your feedback. See CONTRIBUTING.md for guidelines on building, testing,
    and contributing to astroterm.\n\nThe night sky above Singapore on January 2,
    2025See usage on how to obtain this view\n\n## Table of Contents\n\n- \U0001F30C
    astroterm Features Installation Usage Troubleshooting Citations Data Sources\n\n-
    Features\n\n- Installation\n\n- Usage\n\n- Troubleshooting\n\n- Citations\n\n-
    Data Sources\n\n## Features\n\n- \U0001F52D Highly Customizable: Choose any date,
    time, and location to explore past, present, or future celestial events\n\n- \U0001F4D0
    Accurate Rendering: View the moon, stars, and planets with as much precision as
    terminal graphics allow\n\n- \U0001F318 Moon Phases: Precise lunar phases in real-time\n\n-
    \U0001F30C Constellation Figures: Detailed constellation shapes\n\n- ⚡ Performance
    Optimized: Lightweight and fast ASCII rendering\n\nStars over Sydney, Australia
    on January 6, 2025\n\n## Installation\n\nSeveral installation methods are provided
    based on your platform. If none of these fit your needs, you can always build
    from source. Refer to troubleshooting for help resolving any issues.\n\n### Arch
    Linux\n\nYou can install astroterm from the extra repository using pacman:\n\npacman
    -S astroterm\n\n### Fedora\n\nYou can install astroterm directly from the Fedora
    package repository on Fedora 40+.\n\nsudo dnf install astroterm\n\n### Homebrew\n\nYou
    can install astroterm from Homebrew via:\n\nbrew install astroterm\n\n### Nix\n\nYou
    can try the package in a temporary environment with the following command:\n\nnix-shell
    -I nixpkgs=channel:nixpkgs-unstable -p astroterm --command astroterm\n\nArgument
    flags are added by wrapping the command in quotes. For example:\n\nnix-shell -I
    nixpkgs=channel:nixpkgs-unstable -p astroterm --command \"astroterm -u -c\"\n\nTo
    make astroterm available from your $PATH, add it to your configuration.nix:\n\nenvironment.systemPackages
    = with pkgs; [ ... astroterm ]\n\n### Guix\n\nYou can install astroterm directly
    from the Guix main channel starting from this commit.\n\nguix time-machine --commit=4b5f0408e66392ab745dc0f7830732217d88f17d
    -- shell astroterm\n\nOr after guix pull:\n\nguix shell astroterm -- astroterm
    --help # to try guix package --install astroterm # add to current profile\n\n###
    Prebuilt Executable\n\n#### Unix\n\n- Download the latest executable using wget
    wget -O astroterm \"https://github.com/da-luce/astroterm/releases/latest/download/astroterm-<os>-<arch>\"
    Replace <os> with the appropriate platform: Linux: linux macOS: darwin Replace
    <arch> with the appropriate architecture: Linux: x86_64 (arm64 support to come
    after Ubuntu arm64 runners are available) Apple Silicon (M-series): aarch64 Intel-based
    Macs: x86_64 To view all supported combinations, see the Releases page.\n\nDownload
    the latest executable using wget\n\nwget -O astroterm \"https://github.com/da-luce/astroterm/releases/latest/download/astroterm-<os>-<arch>\"\n\n-
    Replace <os> with the appropriate platform: Linux: linux macOS: darwin\n\n- Linux:
    linux\n\n- macOS: darwin\n\n- Replace <arch> with the appropriate architecture:
    Linux: x86_64 (arm64 support to come after Ubuntu arm64 runners are available)
    Apple Silicon (M-series): aarch64 Intel-based Macs: x86_64\n\n- Linux: x86_64
    (arm64 support to come after Ubuntu arm64 runners are available)\n\n- Apple Silicon
    (M-series): aarch64\n\n- Intel-based Macs: x86_64\n\n- To view all supported combinations,
    see the Releases page.\n\n- Run the executable chmod +x ./astroterm ./astroterm\n\nRun
    the executable\n\nchmod +x ./astroterm ./astroterm\n\n#### Windows\n\n- Download
    the latest .exe file using PowerShell's Invoke-WebRequest: Invoke-WebRequest -Uri
    \"https://github.com/da-luce/astroterm/releases/latest/download/astroterm-win-x86_64.exe\"
    -OutFile \"astroterm.exe\"\n\nDownload the latest .exe file using PowerShell's
    Invoke-WebRequest:\n\nInvoke-WebRequest -Uri \"https://github.com/da-luce/astroterm/releases/latest/download/astroterm-win-x86_64.exe\"
    -OutFile \"astroterm.exe\"\n\n- Run the .exe .\\astroterm.exe\n\nRun the .exe\n\n.\\astroterm.exe\n\n###
    Building From Source\n\n## Usage\n\n### Options\n\nThe --help flag displays all
    supported options:\n\nUsage: astroterm [OPTION]... -a, --latitude=<degrees> Observer
    latitude [-90°, 90°] (default: 0.0) -o, --longitude=<degrees> Observer longitude
    [-180°, 180°] (default: 0.0) -d, --datetime=<yyyy-mm-ddThh:mm:ss> Observation
    datetime in UTC -t, --threshold=<float> Only render stars brighter than this magnitude
    (default: 5.0) -l, --label-thresh=<float> Label stars brighter than this magnitude
    (default: 0.25) -f, --fps=<int> Frames per second (default: 24) -s, --speed=<float>
    Animation speed multiplier (default: 1.0) -c, --color Enable terminal colors -C,
    --constellations Draw constellation stick figures. Note: a constellation is only
    drawn if all stars in the figure are over the threshold -g, --grid Draw an azimuthal
    grid -u, --unicode Use unicode characters -b, --braille Use braille characters
    for constellation lines (requires Unicode) -q, --quit-on-any Quit on any keypress
    (default is to quit on 'q' or 'ESC' only) -m, --metadata Display metadata -r,
    --aspect-ratio=<float> Override the calculated terminal cell aspect ratio. Use
    this if your projection is not 'square.' A value around 2.0 works well for most
    cases -h, --help Print this help message -B, --bash-completions Print bash completions
    -i, --city=<city_name> Use the latitude and longitude of the provided city. If
    the name contains multiple words, enclose the name in single or double quotes.
    For a list of available cities, see: https://github.com/da-luce/astroterm/blob/main/data/
    cities.csv -v, --version Display version info and exit\n\n### Shell Completions\n\nTo
    enable Tab completions in Bash, add the following line to your ~/.bashrc:\n\nsource
    <(astroterm --bash-completions)\n\n### Example 1\n\nTo achieve the \"spinning
    globe\" effect as shown in the README GIF, use the following flags:\n\nastroterm
    --color --constellations --speed 10000 --fps 64 --city Singapore\n\nor\n\nastroterm
    -cC -s 10000 -f 64 -i Singapore\n\nfor short. In fact, any city around the equator
    will work. Locations closer to the poles will look different because the apparent
    motion of the stars is more circular around the celestial pole rather than sweeping
    across the sky.\n\n### Example 2\n\nSay we wanted to view the sky at 5:00 AM (Eastern)
    on July 16, 1969—the morning of the Apollo 11 launch at the Kennedy Space Center
    in Florida. We would run:\n\nastroterm --latitude 28.573469 --longitude -80.651070
    --datetime 1969-7-16T8:00:00\n\nFinding the precise coordinates can be cumbersome,
    so we could also use the nearest major city to achieve a similar result:\n\nastroterm
    --city Orlando --datetime 1969-7-16T8:00:00 -m\n\nWhile we're still waiting for
    someone to invent time travel, we can cheat a little by using Stellarium to confirm
    that this aligns with reality.\n\nIf we then wanted to display constellations
    and add color, we would add --constellations --color as options.\n\nIf you simply
    want the current time, don't specify the --datetime option and astroterm will
    use the system time. For your current location, you will still have to specify
    the --lat and --long options, or provide the nearest city with the --city option.\n\nFor
    more options and help, run astroterm -h or astroterm --help.\n\nTip\n\nUse a tool
    like LatLong to get your latitude and longitude.\n\nTip\n\nStar magnitudes decrease
    as apparent brightness increases, i.e., to show more stars, increase the threshold.\n\n##
    Troubleshooting\n\n### Release Won't Download via Curl\n\nFor some reason, curl
    does not follow the latest release redirect. Use wget to d"
