  author: pron
  text: "&gt; I don&#x27;t know why you needed a paragraph to say that 1000% memory
    inflation is a trade-off to optimize dev costs<p>Because that&#x27;s not what
    I said. My point was more that a &quot;1000% memory inflation&quot; is not a meaningful
    cost metric to begin with (to use just one toy example, perhaps you&#x27;d agree
    that going from 10% RAM to 100% has a very different impact than going from 1%
    to 10%, even though both are a &quot;1000% inflation&quot;).<p>Memory (at least
    on a personal computer) is not rented by the hour on a per-MB basis; you buy it
    in bulk. What matters isn&#x27;t how much memory you could have used but what
    you&#x27;d use the &quot;saved&quot; memory for. Also, when you buy a resource
    like RAM or CPU as a package, nominal values matter less than under what conditions
    one of these would reach 100% and your experience may be degraded.<p>For example,
    if you have 16GB of RAM and you only ever run one program at a time, it doesn&#x27;t
    matter to you at all if it uses 3GB or 3MB: you&#x27;ve paid for 16 and the total
    savings of the 3MB app are zero and in this hypothetical case, there&#x27;s no
    tradeoff at all. Now, the average user on the average hardware doesn&#x27;t use
    only one GUI app at a time, but they&#x27;re also not using 200. The only relevant
    question pertaining to waste is what is the value of 3% memory to your users (integrated
    over all of them)? In many situations (again, not all), the answer is not much.
    (And BTW, some developers seem to care about 3% memory more than they do about
    3% CPU, even though CPU is much more expensive).<p>When it comes to agent harnesses,
    the analysis is clearer. On the one hand, people using coding agents are more
    likely than others to put even a little extra free RAM to some good use, but on
    the other hand, the cost of using the models themselves is so high that it makes
    the cost of RAM for the GUI negligible.<p>Saying that a number going up by 1000%
    is bad is not good engineering. Good engineering requires thinking about the actual
    value and cost of that number. It varies over time, over app type, over different
    types of users, and over different kinds of deployments (i.e. how RAM is packaged
    and paid for)."
  score: 0
