  author: OleksandrC
  text: 'I am the author of hax, yes.<p>If you are familiar with pi, then some of
    the key features listed on the GitHub page (and website) already illustrate substantial
    differences: hax is much smaller in footprint (I wouldn&#x27;t even call pi &quot;light-weight&quot;,
    really - heavy js runtime with a lot of dependencies), hax preserves native terminal
    scrollback (pi uses alt-screen fullscreen, or clears in some cases in differential
    mode), hax uses normal XDG dirs (pi uses ~&#x2F;.pi), hax is extended out-of-process
    (pi suggests in-process plugins).<p>There are other differences in presentation,
    and in features (for example, hax has background bash invocation out-of-the-box).
    Not practical to list all of them.'
