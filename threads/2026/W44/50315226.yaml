  content: "## [Prospero: a new coding harness for a more civilized age](/blog/2026/10/31/)\n\n
    nullprogram.com/blog/2026/10/31/ \n\nI’ve been [fascinated with local LLMs](/blog/2024/11/10/)
    for a couple of years now. The better open weight models, including some that
    inference on regular, higher-end consumer hardware at tolerable speeds, are now
    reliable enough to handle simpler programming tasks. This requires a coding harness,
    but so far this year I’ve been disappointed by all the harness offerings. For
    inexplicable reasons most are built with web stacks, and consume enormous amounts
    of memory. At its core a coding harness is essentially curl glued to `popen()`.
    This should not require gigabytes of RAM. So I built my own:**[Prospero](https://github.com/skeeto/prospero)**.
    It’s written in [my C++ style](/blog/2026/10/04/) with a snappy [Dear ImGui docking
    interface](/blog/2026/04/07/). It uses around two orders of magnitude fewer resources
    than other harnesses without sacrificing features.\n\n![](/img/prospero/screenshot.png)\n\nDark
    mode aficionados are covered, too:\n\n![](/img/prospero/screenshot-dark.png)\n\nNote
    that Prospero comes with no model providers built-in. You’re expected to supply
    that yourself, such as with [llama.cpp](https://github.com/ggml-org/llama.cpp),
    a workplace on-prem model, OpenRouter, Anthropic API, OpenAI API, etc. (You can’t
    use your Claude subscription.)\n\nFor those unfamiliar with coding harnesses:
    In a chat interface you and the AI take turns writing messages to each other.
    A coding harness extends this concept, allowing an AI to “talk” to tools offered
    by the harness. Tools “reply” with their outputs. A tool might read or write a
    file, or run a shell command. An AI will go from tool call to tool call on its
    own, looping on the results. Such an AI is called an _agent_. Occasionally the
    AI will send you a message to inform you of progress or to ask a question, and
    the chat interface is still there.\n\nSome harnesses, including Prospero, allow
    agents to spawn _subagents_ to do their bidding, to work in parallel or keep their
    _context_ clean. That is, to not fill their working memory with subtasks. Agents
    can message one another and coordinate on tasks. Given SSH access to another machine,
    or over plain WSL, Prospero can deploy a headless copy of itself to other hosts
    so that agents can operate on those systems. The [Professional Edition](https://skeeto.itch.io/prospero)
    embeds engines for combinations of x86/x86-64 and ARM64 on macOS, Windows, and
    Linux. The Windows x86 engine even works on Windows XP, and can play solitaire
    and minesweeper if you ask.\n\nThe last is because Prospero is one of the few
    harnesses with _desktop control_ capabilities. If your model supports vision —
    any any model worth using does — then it can “see” your desktop and interact with
    it. It can click, type, and drag to test and debug GUI applications live without
    a specialized, per-app [MCP assist](/blog/2026/09/17/).\n\nThis headless engine
    is why no TUI is necessary. The harness engine runs on the headless system, and
    the UI runs on your desktop or laptop. With a little extra setup, the harness
    to run fully independently of the GUI, so that it will continue without the GUI
    system attached — re-attachable later.\n\nBecause Prospero is so lean, it may
    be the only harness that can drive a[fuzz campaign](/blog/2025/02/05/), particularly
    on a headless system, without the Linux OOM killer targeting _the memory-gobbling
    harness_ rather than the out-of-control fuzz target that triggered it. So many
    times I’ve checked back in on a fuzz campaign hours later, to find nothing was
    accomplished because the harness process is gone.\n\n(Why have an agent run a
    fuzz campaign? Because it can fix discovered bugs on the fly and keep the campaign
    going! It’s a no brainer.)\n\n### Configuration\n\nThe configuration lives at
    `~/.config/prospero/prospero.ini`. Easy to edit. No JSON, thank goodness. Check
    it into source control, copy-paste it. All the usual benefits. Alternatively,
    the Settings page can reach every setting from the GUI, so you don’t have to edit
    the INI by hand. INI files can also include each other, not just naming file system
    paths but URLs:\n\n    include = https://example.com/prospero.ini\n\nThe idea
    is to allow a live shared or managed configuration. Includes by URL are restricted
    in what they can set, with a hard rule against anything which might appear in
    shell command. Some trust is still required, as a configuration can extract an
    environment variable by using it as an API key and supplying an endpoint it controls.\n\nProspero
    fetches a model list and other parameters like context size from the endpoint,
    but you might want to tweak it. A typical configuration may look like:\n\n    model
    = falstaff/Qwen3.8-27B\n    \n    [endpoint falstaff]\n    url = http://falstaff.local/\n
    \   key = env:FALSTAFF_API_KEY\n    \n    [model Qwen3.8-27B]\n    edit_format
    = replace\n    template.reasoning_effort = medium\n    \n    [model Qwen3.8-27B-xhigh]\n
    \   like = Qwen3.8-27B\n    template.reasoning_effort = xhigh\n    \n    [web]\n
    \   search = searxng\n    url = https://search.example.com/\n    key = env:EXAMPLE_API_KEY\n\n###
    Passive rendering\n\nThe ImGui paradigm typically uses _active rendering_, redrawing
    on vsync like a video game. This is appropriate in some contexts, like interfaces
    within video games. Less so for mostly-static text-oriented UIs, such as a coding
    harness. Instead Prospero uses _passive rendering_ with _settle frames_ to finish
    animations before going idle. When there’s nothing to do, Prospero does nothing.
    It won’t chew on the GPU while the agent is waiting on a build.\n\n### Never wait
    forever\n\nAn annoyance with most other harnesses is how easily they get stuck.
    I set a long-running task, go to sleep, and in the morning find the harness hung
    on a trivial issue two hours into the night, wasting the rest. Therefore Prospero
    prime design principle: _Never wait forever_. **Every operation has a deadline.**
    This decision influences everything. If you’re not there to grant a requested
    permission, the agent will get a denial by timeout and must do without. To assist,
    Prospero will raise a system toast when an agent requires your attention so that
    you’re less likely to miss it if you’re attending.\n\nThe harness itself _plows
    through intermittent errors_, trying its best to drive the agent to complete its
    task. All network requests have timeouts, and watchdogs prevent [endless waiting](/blog/2019/03/22/).
    Agent mailboxes [are bounded](https://lucumr.pocoo.org/2020/1/1/async-pressure/).\n\nShell
    commands that hit their timeout convert to asynchronous background commands. The
    agent can continue to wait on them, with a timeout, and so will be woken at regular
    intervals to decide if it should continue.\n\nThe one exception is Plan mode,
    where it waits indefinitely after offering a plan or requesting clarification
    (`ask_user` tool). It’s expected that a user is attending to the agent during
    Plan mode.\n\n### No stray processes\n\nThe harnesses I’ve used have improved,
    but another regular annoyance earlier this year was agents starting processes
    that never get cleaned up. An agent kicks off a parallel build, hits a timeout
    because it was too optimistic, the build “stops” by killing a piece of the build
    system. But actually _the build continues anyway_, at least in part. The agent
    tries again, and now two builds are going, interfering with each other, making
    a mess and bringing my system to its knees.\n\nFor awhile I was wary of letting
    agents run builds in certain harnesses, which is a terrible outcome. _You want
    agents to close the loop_ and iterate independently. A human in the loop is like
    putting a ball and chain on the agent, giving up most of its advantages.\n\nProspero
    promoting a synchronous timeout to an asynchronous task is a huge improvement
    on its own, but there’s an additional principle at play: The whole process tree
    lives and dies together. When a command is stopped, _it stops_. This is [trivial
    on Windows]("
