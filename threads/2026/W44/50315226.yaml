  author: OleksandrC
  text: Typical coding agents of today consume hundreds of MBs of RAM. Once you add
    GUI into the mix, that could easily slip into GBs. You might feel the difference,
    when you&#x27;re trying to fit a capable local model into small amount of local
    RAM.<p>Even on 64 GB RAM machines you could easily get memory pressure on the
    system when trying to work with a chonky local model. Consider also resource-constrained
    cases like small VPS servers or SBC computers (like Raspberry Pi).<p>Ergonomics
    and features are included too here. The point is that these can coexist with small
    resource footprint.
