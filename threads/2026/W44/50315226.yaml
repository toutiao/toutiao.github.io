  author: pron
  text: "&gt; That doesn&#x27;t make sense. If the cost of RAM is high and being used
    by models then yes, you should try to use less RAM.<p>No, that&#x27;s not the
    conclusion. If using models costs you, say, $10 an hour, and a GB of RAM costs
    you, say, $0.0001 an hour, then clearly you shouldn&#x27;t spend your time on
    reducing the insignificant cost if you want your work to deliver the most value
    to users.<p>But again, &quot;less RAM&quot; is more or less meaningful whether
    you&#x27;re reducing the RAM usage from, say, 5% to 1% or from 80% to 40%. The
    latter is more valuable even though it&#x27;s a lower relative reduction. That&#x27;s
    because what the users care about is in what conditions they reach 100% of either
    CPU or RAM, and the second 2x reduction, therefore, offers more value than the
    first 5x one. This is similar to how a 10% discount on a car offers far more value
    than a 99% discount on a pack of chewing gum. This is still the case if you&#x27;re
    buying 100 packs, but maybe not 10,000, and the same goes for software: it may
    also matter how many copies of the app the user is expected to run concurrently.
    The point is that you can&#x27;t assign a value to a 10x reduction if that&#x27;s
    all you know.<p>&gt; I&#x27;m entertaining this nonsense because I want to clarify,
    that I use a 20 year old web gui and it consistently eats 8 gigs of ram in Webkit
    because it uses CSS to update the forms.<p>And I&#x27;m entertaining this nonsense
    because you&#x27;re clearly not a very experienced engineer and you may learn
    something. In the ninetees, when nearly all GUI apps were written in C or C++,
    we had plenty of examples where a C++ GUI app consumed 50% RAM. That doesn&#x27;t
    mean that C++ is worthless, only that some software has serious resource bugs,
    and it sounds like that web page you&#x27;re referring to is a case of that. Most
    web-based GUI apps today do not consume a higher portion of RAM than their C++
    counterparts did 30 years ago. Today&#x27;s browser-based MS Word consumes less
    (relative) RAM than the C++ version did in 1998, and it certainly has a far smaller
    negative impact on concurrently using other apps on the machine.<p>And, of course,
    there are buggy&#x2F;leaky programs now just as there were then. It&#x27;s silly
    to say that the existence of such programs means that the approach is bad, because
    that would apply to any sufficiently-popular language or toolkit.<p>Anyway, our
    job is to offer the most value to our users, and reducing RAM consumption by 3%
    or even 5% (of available RAM) is <i>usually</i> not where you&#x27;d find much
    value."
