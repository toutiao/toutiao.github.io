  author: bilalq
  text: Your comment was likely focused on dysfunctional parts of the culture there
    (and that seems to be how most replies to you interpreted it as well). There&#x27;s
    truth to that, sure. But I think respect for data sensitivity and security is
    also a big part of what makes the culture ill-suited for frontier AI lab work.<p>When
    I was at AWS, we had data access locked down very tightly. I was trying to train
    a model to predict how long various dynamic workloads running on behalf of customers
    would take. Just getting access to anonymized production data from a DB that my
    team owned took well over a month and had me compromise heavily on what attributes
    I could access. I also spent a decent amount of time in meetings with lawyers
    and compliance folks to explain and justify all our data classifications for PII,
    retention, access controls, etc. We would review our data policies quite frequently.
    We needed break-glass procedures to access prod data in our own systems, and it
    was uncommon to need to resort to that. Even when you broke glass, certain classes
    of sensitive data would still not be visible to you. On the plus side, We did
    get quite good at operating and maintaining systems without needing to see sensitive
    info.<p>If you contrast that with Meta&#x27;s disregard for privacy or the way
    frontier labs disregard the law, it&#x27;s easy to see why Amazon would struggle
    in this space.
  score: 0
