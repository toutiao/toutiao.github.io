  author: SemAntics0
  text: It&#x27;s an incredibly messy space and the particulars are going to vary
    wildly based on the company. A company in a more regulated space may have the
    finances to standardize on Siemens or something similarly fancy, but smaller manufacturers
    may not have any standard at all and you&#x27;ll be looking at a mix of Rockwell,
    Allen-Bradley, Honeywell and even more niche brands and PLCs. Many vendors have
    &quot;proprietary&quot; languages, but they&#x27;re all going to be very basic
    stuff that is essentially Visual Basic, C, or JavaScript-ish. It&#x27;s not going
    to be a formal software development environment like you&#x27;re used to. In less
    regulated environments, a lot of the time you&#x27;ll find that the PLC&#x2F;automation
    component is being handled by the MAINTENANCE or FACILITIES people.<p>So for an
    example of a problem I&#x27;m facing, we have some Vacuum Furnaces. Essentially
    before you can turn titanium into a useful implant, you have to bake titanium
    at a temperature above its ignition point so that the molecules can loosen up
    enough and release the stresses that accumulate in the forging process. As part
    of this process, there&#x27;s eight thermocouples of different sensitivities and
    at least three pressure&#x2F;vacuum sensors all physically wired into a &quot;chart
    recorder&quot;. The thermocouple &quot;data&quot; is literally a voltage reading,
    and the chart recorder is interpreting that and converting it into an integer
    and storing that in RAM. These devices are about 20 years old, and it can only
    hold about 24 hours of data, so you have to network it with a server that can
    store those readings in case you ever need to prove to someone that this step
    of your process was done right. It&#x27;s not technically complex, but these devices
    aren&#x27;t easy to interact with and often require physically connecting to them
    to make changes.<p>There&#x27;s all sorts of possibilities for really meaningful
    integrations with other manufacturing systems, ERP systems, data analysis and
    visualization, and basically a million &quot;low hanging fruit&quot; problems
    in the space that simply don&#x27;t get done because don&#x27;t have enough people
    with any technical skill at all. Most companies I&#x27;ve worked for literally
    don&#x27;t care about what the solution is, so you get a ton of leeway on architecting
    the solution.<p>IMO, the best part is that it feels like you&#x27;re accomplishing
    something. Making a real impact. You can walk the floor and see the code you wrote
    building things. Doing things. You know the engineer who came to you with a problem,
    and you delivered a solution that makes his life easier. Not to make some abstract
    number go up for a quarterly report, but to actually make things that are useful.
