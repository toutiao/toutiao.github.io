  author: jdw64
  text: I think it&#x27;s because technologists are easier to manage.<p>Product engineers,
    on the other hand, are actually quite ambiguous to evaluate. Many methodologies
    have been introduced, starting from Barry Boehm, but over time they gradually
    stop fitting, and there are many points that are hard to assess. It&#x27;s essentially
    a matter of organizational management theory. The ideal of organizational management
    theory is that diversity comes together to create synergy, but conversely, such
    diversity means that decision-making within the organization slows down.<p>Technologists,
    by contrast, are very easy to observe in terms of speed or code quality. In fact,
    most people choose a career of learning technology and making money rather than
    founding a startup, and from that perspective, since &quot;career&quot; tends
    to be emphasized as an employee&#x27;s career rather than a founder&#x27;s career,
    isn&#x27;t that why technologists are emphasized?<p>What companies value as a
    capability is ultimately an evaluation that can be measured. And product engineering,
    when you think about it, presupposes discussions with decision makers.<p>&#x27;Is
    it necessary to implement this feature?&#x27;<p>&#x27;Do customers actually need
    this feature?&#x27;<p>&#x27;Isn&#x27;t the business model wrong?&#x27;<p>Most
    decision makers are people high up in the hierarchy, and friction with them is
    unavoidable. In other words, it crosses existing role boundaries, which means
    more frequent conflicts in organizational dynamics.<p>Whether that is ultimately
    a gain or a loss for the organization is something nobody can konw
