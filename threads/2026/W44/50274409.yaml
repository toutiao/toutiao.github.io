  author: NoImmatureAdHom
  text: |-
    I think a good theory is:<p>Up until the late 1800s, beauty was expensive. Therefore, it was a costly (i.e., believable) signal of wealth, status, and taste. In the late 1800s and early 1900s, modern manufacturing got going and made beauty cheap. The ornate wrought iron door that took some workman hundreds of hours to produce was a good signal. Now, a cast simulacrum can be made at scale and ordinary people can have beautiful doors.<p>This led the tastemaker art and architecture elite to start playing a kind of inside baseball where what&#x27;s &quot;beautiful&quot; isn&#x27;t beautiful in some objective sense, or to ordinary people, it&#x27;s just what&#x27;s trendy within their clique at a given time.<p>(and, to head you off at the pass: <i>you</i> may like brutalism or Obama&#x27;s library, but the data clearly show that regular people <i>do not</i>)<p>See Tom Wolfe&#x27;s excellent From Bauhaus to Our House: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;From_Bauhaus_to_Our_House" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;From_Bauhaus_to_Our_House</a><p>Also this ACX discussion (it&#x27;s a few posts) is really good: <a href="https:&#x2F;&#x2F;www.astralcodexten.com&#x2F;p&#x2F;book-review-from-bauhaus-to-our-house" rel="nofollow">https:&#x2F;&#x2F;www.astralcodexten.com&#x2F;p&#x2F;book-review-from-bauhaus-to...</a>
    <a href="https:&#x2F;&#x2F;www.astralcodexten.com&#x2F;p&#x2F;contra-everyone-on-taste" rel="nofollow">https:&#x2F;&#x2F;www.astralcodexten.com&#x2F;p&#x2F;contra-everyone-on-taste</a>
    <a href="https:&#x2F;&#x2F;www.astralcodexten.com&#x2F;p&#x2F;three-model-organisms-for-taste" rel="nofollow">https:&#x2F;&#x2F;www.astralcodexten.com&#x2F;p&#x2F;three-model-organisms-for-t...</a><p>We should really do something about this. Buildings affect everyone around them, and we should force people designing them to make buildings that regular people find beautiful.<p>These people are trying: <a href="https:&#x2F;&#x2F;www.humanise.org&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.humanise.org&#x2F;</a>
