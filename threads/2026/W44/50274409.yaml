  author: uriegas
  text: The arts have always been influenced by the philosophy of their time.<p>However,
    there is a divide between vernacular and classical architecture. Vernacular is
    utilitarian and it is what most people build (you build your house to serve your
    needs) while classical is not only utilitarian but also communicates a message
    (authority in gov. buildings).<p>Most people find vernacular architecture pretty.
    For example, Florence, San Miguel de Allende, New Orleans, etc. All of them have
    different architecture caused by the locally available materials and the weather
    of the place. Contrary to popular belief most of their &#x27;beauty&#x27; doesn&#x27;t
    come from an old appreciation of the arts people, instead these buildings only
    met the needs with what was available and worked best.<p>For example, in the north
    of Mexico houses were built with thick limestone (&#x27;sillar de caliche&#x27;).
    The thickness helped as insulation (hot weather). The limestone was plastered
    with &#x27;cal&#x27; in a light color with an &#x27;aborregado&#x27; finish that
    helped reflect the sunlight thus keeping the house cooler. The houses were tall
    because hot air rises, windows looked almost like doors because people opened
    them during the night to let the air in. The buildings are beautiful but they
    are extremely utilitarian. Nowadays most houses in Mexico are built with cement
    and rebar, which is ugly.<p>The architect Leon Krier made the argument that all
    of this was a 20th century phenomenon caused by industrialization and fossil fuel
    dependency, which has not only affected buildings but how cities get built (urban
    planning). He believed this would end once fossil fuels reservoirs decreased.
