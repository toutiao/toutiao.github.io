  author: wolframhempel
  text: Before anyone complains that this removes the human aspect of art, it&#x27;s
    worth stressing that sculptors have always looked for ways to automate work and
    save time (as the website itself points out).<p>As far back as ancient Egypt,
    grids and measuring tools were used to reproduce figures at different scales.
    Roman workshops churned out copies of Greek statues in marble and bronze, using
    casts and moulds. From the 18th century onwards, sculptors used outright pointing
    machines to transfer models into marble. James Watt, the steam engine guy, even
    built a mechanical sculpture-copying machine that could (somewhat) automatically
    reproduce reliefs and medallions.<p>Gothic architectural decoration wasn&#x27;t
    about expressing the inner world of its makers in the way we think of art today.
    Much of it was produced by large masonry workshops using standardized geometry,
    wooden templates and repeated designs.<p>So, yeah, using a CNC machine is truly
    Gothic.
  score: 0
