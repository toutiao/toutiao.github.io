  text: What&#x27;s kind of funny about CNC is there is a wood working tool that is
    the opposite of what you just mentioned. The Shaper Origin is a CNC router where
    the gross movements of the router are provided by the human operator&#x27;s hands
    moving the thing, and the fine movements of the cutting head inside the router
    body are provided by XYZ positioning of the cutting head reacting to the machine&#x27;s
    position over the workpiece using optical tracking. So you can get precision and
    an expansive work range, with a small footprint of the tool.
