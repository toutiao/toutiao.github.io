    on keeping it over the next decade plus, or two, the buyer plans on flipping the
    building as soon as possible.<p>In the first case, and extremely so in the second,
    buyers are entirely without taste and despise spending any money that they don&#x27;t
    absolutely have to. The desire to min&#x2F;max buildings has led to function over
    form to the point of nearly ignoring form.<p>&quot;Cheap&quot; is the top priority,
    followed closely by &quot;inoffensive to the people we want to rent this to &#x2F;
    flip this to&quot;. This results in cheap, low effort facades and an absolute
