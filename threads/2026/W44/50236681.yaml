  text: 'Cheap MCU dev kits in general, for me?<p>A somewhat-elaborate fan speed controller
    for a wonderful old pro audio power amp that also needed a good bit of other rehab<p>A
    window fan controller, for summer use, that only turns on the fan when it&#x27;s
    cooler outside than it is inside -- so it only cools the indoors, seeks never
    to heat it<p>A sensor for automating the color temperature of my indoor lighting
    based on outdoor conditions<p>A macro pad that ultimately works kind of like a
    Streamdeck, but without the built-in display features (that was a download-and-print
    project)<p>Other random stuff, like an ESPHome widget that talked to a window
    aircon via infrared commands (mostly just a download-and-run project)<p>They&#x27;re
    just cheap little programmable low[ish]-power computers on a board, with some
    flash storage and RAM, and a fair bit of low-level IO.  Often with wireless network
    connectivity as a built-in.  They do stuff.  :)<p>If the code is tight-enough,
    they can do a remarkable amount of that stuff -- in terms of raw compute, they
    present something near-ish to the Pentium era of personal computing for a few
    dollars.<p>For me, they make sense for simple projects.  When something like a
    disused laptop or a Raspberry Pi-like device [and the accoutrements, like a whole-ass
    operating system] seems like overkill, then:  It&#x27;s probably overkill.<p>With
    a dev board, I can breadboard a circuit and maybe even leave it that way forever,
    or get a custom PCB drawn up with KiCad and made inexpensively by JLC PCB or Osh
    Park or whatever, or just solder wires and parts to the dev board like a caveman.<p>All
    methods work, and the cost of screwing it up is usually very low.<p>After that,
    the thing gets powered up with one of the featureless USB wall warts that we all
    have accumulated too many of and it just sits there and does its job.<p>(And honestly,
    these Pi Pico and random ESP32 dev boards are also overkill for what I do with
    them.  Most of what I&#x27;ve done could be accomplished with an MCU chip that
    costs pennies instead of dollars, but my quantities are low-enough that I just
    don&#x27;t care much about a few dollars for occasional one-off projects.)'
