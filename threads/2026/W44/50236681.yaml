  author: TGower
  text: For a lot of SIMD applications, overfitting isn&#x27;t really a concern. In
    my use case I need to calculate the sum of absolute difference between two vectors
    for autocorrelation, there&#x27;s no real possibility for overfitting, either
    it gets the correct answer or it doesn&#x27;t. LLMs are good at reading through
    the CPU manual and trying different optimizations.<p>The resulting SIMD being
    illegible isn&#x27;t an issue in my eyes, assembly isn&#x27;t a language known
    for it&#x27;s readability in general. If you want to really understand what the
    assembly is doing, ask your LLM to whip up a visualization and explanation tailored
    to your input data where you can see how each operation leads you to the final
    result.
