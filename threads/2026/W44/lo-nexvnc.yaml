    # Announcements

    News and release updates for the SLCR standard.

    ## 2026-10-29: SLCR launches⁠Link to this section

    Today we're launching SLCR (Sliceable, Linked, Checkable Requirements, pronounced slicer), an open format for writing software requirements for both people and coding agents. We're the team at Wack, and we built SLCR because our own agents kept drifting from the spec over time. If you work on a long-lived codebase and you're handing more of the implementation to agents, SLCR gives you a way to check that what comes back still matches what you asked for.

    You can try it today. The getting started tutorial takes you from installing the CLI to your first spec, and the agent skill teaches your agents to read and write SLCR.

    Everything is open source, and the GitHub repo⁠ (external site) is where the work happens. If something breaks or doesn't fit how your team works, open an issue there and tell us about it. Pull requests are welcome too!
