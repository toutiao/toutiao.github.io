  author: alex0015
  text: The first time I watched it, I was a freshman in college and I could barely
    get through it. I hated the sense of awkwardness and what read to me at the time
    (2012) as intentionally cringe humor.<p>The second time, I had graduated college,
    seen more of the world and how people treated each other, and I felt like I got
    it a lot more. I didn&#x27;t feel offended by the long awkward moments anymore.
    It was entertaining and I was able to see the virtues and flaws of the characters,
    and even recognize traits of myself and other people I knew.<p>I can&#x27;t remember
    for sure whether I&#x27;ve seen it a third time, but I think I have, and it would
    have been in my mid or late twenties. With that watching, I was able to appreciate
    it most as a film and a product of its time, and imagine how it might have landed
    to its audience over the years. My recollection of it now is of someone who is
    by nature a pretty passive person struggling with the concept of his own agency,
    which speaks to me personally.
