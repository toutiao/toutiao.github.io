  text: "&gt; Why does it matter if the author is Jewish? He mentions it multiple
    times as if that fact would make himself unfitting to be the lead in the movie…<p>Perception
    on this has shifted quite a bit. Today, I don&#x27;t know that this would be an
    issue (but maybe I&#x27;m wrong). In the early days of Hollywood, Jewish people
    tended to work behind the scenes and not as leading characters. In the 1960s things
    were changing."
