  author: btilly
  text: Here is my hot take. His belief that he was failing, helped him succeed.<p>I
    don&#x27;t mean this in a trite way. The character portrayed is supposed to be
    awkward and anxious. Feeling awkward and anxious in real life, left him in the
    right frame of mind when he walked on set. He looked awkward and anxious, because
    he actually was.<p>Actually feeling what the character is supposed to be feeling,
    is the heart of method acting. The upside of method acting is that it creates
    very powerful performances. The downside of method acting is that you have to
    experience all of the feelings of the depicted drama.
