  author: jongjong
  text: When my wife was diagnosed with stage 3 bowel cancer earlier this year, she
    was essentially prepared to die. She didn&#x27;t even cry once. Her father had
    died from the same cancer at around the same age as her (early 40s), in the most
    horrific way imaginable. Her father used to work for the Soviet military in charge
    of a team of people who worked on propaganda so he was a strong believer in communism
    and he was devastated by the collapse of the USSR; his entire world had fallen
    apart. But then bowel cancer finished him off. My wife was in her teens at the
    time and she said he was extremely angry and not himself for years until he died.
    The chemo made him extremely sick, destroyed his body, and he had to have a colostomy
    bag. Years later, after my wife met me, we experienced a lot of hardship together;
    just one episode of bad luck after another... Like, almost every aspect of our
    lives which we didn&#x27;t control. So by the time she got her cancer diagnosis,
    it&#x27;s as though she was expecting it.<p>It turns out that she has a relatively
    rare genetic condition which increases the probability of bowel cancer by about
    10x... These cancers are known to respond very poorly to standard chemo (and likely
    explains her father&#x27;s horrible death decades earlier). This is where our
    luck finally turned though. We got lucky, possibly for the first time since we&#x27;ve
    been together. Her cancer turned out to be a kind which is highly responsive to
    immunotherapy. The most recent trial for the relevant class of drugs showed an
    unprecedented 100% complete response in about 40 patients (Dostarlimab). Moreover,
    that same class of (very expensive) drugs became available for her exact case,
    on the subsidized public list in my country, just one month prior to her diagnosis.
    After her first month of treatment, the tumor had shrunk by like 50% in diameter.
    Now, 5 months later, there is no evidence of cancer on the MRI.<p>I feel like
    the experience has completely changed my wife&#x27;s perspective of life in a
    fundamental way. Before this, she lived her entire life expecting that things
    never get better and all news is bad news. Systems decay, collapse and people
    die.<p>These days I often think about the ancient Chinese tale &quot;The old man
    lost his horse.&quot; It&#x27;s insane how little control we actually have over
    the most important aspects of our lives and how something terrible (like a tumor
    which doesn&#x27;t respond to chemo) can become a positive (but responds extremely
    well to immunotherapy). Also, it&#x27;s quite inspiring to think about how people
    identified this horrible class of the most untreatable cancers in existence and
    decided to do something about it, and now it seems like they&#x27;ve become the
    most treatable of all cancers, with the fewest side effects too. It&#x27;s a testament
    to the good things innovation can create when people focus on the worst problems,
    the worst injustices of human existence.
  score: 0
