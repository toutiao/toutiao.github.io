  author: shevy-java
  text: "&gt; Everyone experiences chemotherapy differently. Just as every body is
    different, so is the reaction to the chemicals that are killing the cancer.<p>Well,
    this is true, but generic chemotherapeutics target pretty much all cells. That&#x27;s
    why there are so many side effects.<p>There are some partial work arounds, e.
    g. targeting some specific cells via monoclonal antibodies, but even these have
    side effects. I understand the rationale of stopping uncontrolled cell growth,
    but chemotherapeutics are hugely damaging to all cells, not just cancer cells.
    And it is often unclear whether these have a really profound positive impact.
    For instance, if you kill 80% of the cancer cells but the cost is that the other
    cells are significantly weakened, leading to a death due to that, then you have
    a trade-off that isn&#x27;t so great."
