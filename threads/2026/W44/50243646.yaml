  text: 'There is an entire field of study dedicated to this sort of thing called
    Psychophysics. It’s hardly trivial. Perception isn’t an absolute measure of sensory
    input as it’s influenced by context, comparison, as well as prior experience.
    Improvements in one experience can change the standards by which we judge subsequent
    ones. These principles have had profound implications across entire industries.
    A good primer is the book Priceless: the hidden psychology of value by Poundstone.'
