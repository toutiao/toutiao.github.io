  author: kccqzy
  text: And furthermore Apple’s OLED screens tend to have more color reproduction
    issues. I don’t have an iPad any more but gather a group of people using OLED
    iPhones. Use light mode and open the Settings app at the same time. You will see
    that different OLED screens render the same white menu items differently. Some
    will have a yellowish tint, others an unpleasant green tint. This happens regardless
    of whether one turns on or off TrueTone. This has been going on since the very
    first OLED iPhones. The old LCD iPhones never had this problem. It is highly subjective
    but it bothers me way more than a 60Hz refresh rate.<p>In general display technologies
    are highly subjective. Besides LCD versus OLED, there are people who love nano
    texture and there are people who hate them. There are people who absolutely need
    120Hz and there are people who can’t tell the difference between 60Hz and 120Hz.
    It’s a shame that we can’t customize the display technology exactly as we want.
