article:
  url: https://www.wired.com/story/a-28-year-old-doge-operative-gutted-usaid-hr-had-no-record-of-him-working-there/
  title: A 28-Year-Old DOGE Operative Gutted USAID. HR Had No Record of Him Working
    There | WIRED
  fetch_status: success
  content: "On March 18, 2025, Secretary of State Marco Rubio handed the reins of
    the [US Agency for International Development](https://www.wired.com/story/usaid-whistleblower-says-it-was-even-worse-than-people-knew/)
    to Jeremy Lewin, a 28-year-old graduate of Harvard Law School, former investment
    banker, and affiliate of Elon Musk’s so-called [Department of Government Efficiency](https://www.wired.com/tag/doge/).
    At the time, Lewin’s appointment drew criticism because of his lack of experience
    in government, diplomacy, or foreign assistance. But for career staff inside the
    agency, the issues surrounding Lewin’s new role were much more alarming than his
    thin résumé.\n\nFor at least two months, USAID senior staff had no knowledge of
    how Lewin, who appeared at the agency one day as a policymaker on an obscure detail
    from the General Services Administration, could have suddenly begun wielding the
    powers of the agency’s top official.\n\nInternal USAID emails reviewed by WIRED
    reveal that during the three-week period of March 18 to April 4, during which
    Lewin began canceling lifesaving aid programs and personally signed off on the
    termination of thousands of USAID employees, he did not sign the paperwork typically
    required by law to begin work at the agency, despite repeated requests. In fact,
    his appointment was so mysterious that USAID security was unable to issue him
    an ID card because they had no records of his employment.\n\nLewin, currently
    director of policy planning at the State Department, tells WIRED that prior to
    Rubio delegating powers to him, he was “both detailed and dual appointed to work
    at USAID by Secretary Rubio according to well-established authorities and with
    the advice of State Department and White House counsel.”\n\nExperts, though, say
    that while Lewin performed the duties of a top USAID leader under the title Rubio
    handed to him—deputy administrator of policy and programming and chief operating
    officer—it isn’t clear that he had the legal authority to do so. Questions about
