  author: jak2k
  text: |-
    There are basically three things you can federate:

    a list of URLs that are interesting to crawl
    the search index
    results

    (1) & (3) are quite easy to do. Just throw some URLs into a web feed! (JSON-Feed is easiest, Atom & RSS would work too.) In case of (3), the feed  needs query parameter and should have some kind of protection against bots. (Most likely some token.)
    (2) is a bit more complicated for both legal & technical reasons. Just distributing WARC is expensive and violates copyright. Some kind of SQLite database with already indexed pages would also be a good option. But to show sections where the search terms matched, you'd need full text again.
    I'll focus on (1) and (3) because those are useful beyond just federated search. (1) also has the advantage that I can use my linkblog as source for an index. And (3) lets me subscribe to results of a search term which gets really useful once I gain the ability to crawl larger sources. (Like links on here with many upvotes.)
