  author: silentbicycle
  text: |-
    Off and on over the last couple months I've been working on a k-like language. I've been intrigued by the APLs for a long time (particularly k, which is a kind of APL/Lisp hybrid), but all the open-source ks I've seen have codebases written in a dense, macro-heavy style imitating Arthur Whitney's and it makes them needlessly difficult to extend them for problem domains I care about. (I've tried that programming style a couple times in C and given up on it; I'm just not buying the k-fabe.)
    So, instead, I've been making an implementation from scratch. It's still pretty uneven, because I've focused more on figuring out how to implement the novel-to-me parts, but it's coming together. I'm not too concerned about compatibility with any real version of k, and I've made some different design choices (lexical scope & closures, generational mark-sweep GC rather than refcounting, tail-call optimization), but if I have time it might be sufficiently usable for Advent of Code this year. If nothing else, it's been a good series of exercises in parsing a language with a quirky syntax, figuring out how to implement indexing in depth, designing a bytecode compiler and abstract machine for an array language, and getting to know more of the language semantics (e.g. rank).
    I haven't posted the code anywhere yet. I probably will eventually, but I haven't released much publicly on github for a while. I really pulled back from open-source several years back because it was burning me out, and since LLMs got involved it just hasn't been fun anymore.
  score: 1
