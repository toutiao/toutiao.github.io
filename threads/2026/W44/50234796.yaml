  author: orbital-decay
  text: "<i>&gt;I don’t really view 30 hours of stacked exposures as “a photo I took”,
    rather as the outcome of a lengthy signals processing chain</i><p>Is there a difference?
    It&#x27;s still a photometrically correct capture of the scene, unless you&#x27;re
    using narrow-band filters or multispectral compositing you would see the same
    if you had huge eyes. In the same way a stacked smartphone photo is still a photo
    unless it&#x27;s also using AI, and even then AI denoisers are pretty much accepted
    in photography as long as they don&#x27;t meaningfully affect the subject (as
    well as more traditional things like CPLs or extra lighting).<p>Nothing in Nikon&#x27;s
    challenge is natural, it&#x27;s still a photo as long as it represents something
    real."
