  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nA
    25-year-old German experimental photographer has won the 2026 Nikon Small World
    photomicrography competition with a striking image of droplets of ink being deposited
    on paper by an inkjet printer. Ole Bielfeldt beat out 1,802 other entries hailing
    from 69 different countries.\n\nBielfeldt became interested in photomicrography
    during the COVID-19 lockdown after discovering an old microscope in his parents’
    attic. He figured out how to build an adaptor out of a tube and some wood to connect
    the microscope to his father’s camera and taught himself the art through trial
    and error, building custom tools as needed. He [documents](https://www.instagram.com/macrofying/?hl=en)
    how he captures transformative images of everyday objects with behind-the-scenes
    videos posted to [macrofying](https://www.macrofying.com/), his photography and
    videography brand.\n\nIt was Bielfeldt’s curiosity about the inner workings of
    inkjet printers that inspired his winning entry, but capturing the action of ink
    drops being deposited on paper was a challenge, given that the process happens
    so quickly. The droplets, for instance, moved faster than the camera’s shutter
    speed. Bielfeldt’s solution was to deconstruct the printer so that the paper moved
    under a stationary (rather than moving) printhead, and then take the image in
    a dark room, using a flash to serve as the shutter, thereby freezing the ink drops
    mid-air. There was no need for pricey equipment. Bielfeldt does not use AI in
    his images, preferring to rely on traditional techniques.\n\n“Ole Bielfeldt’s
    winning image embodies what makes Nikon Small World so powerful: the intersection
    of microscope imaging, ingenuity, and artistry,” [said Eric Flem](https://www.nikonsmallworld.com/news/52nd-annual-nikon-small-world-competition-winner),
    a spokesperson for Nikon Instruments. “By using a microscope objective in a different
    way, he transformed a familiar object into something altogether new and previously
    unseen. It is a reminder that the microscope is not only a scientific tool but
    also a creative one, capable of expanding how we see and imagine the world around
    us.”\n\nFounded in 1974, the Nikon Small World competition celebrates its 52nd
    anniversary this year. In 2011, the company added the Small World in Motion competition
    (see the [2026 winner here](https://arstechnica.com/science/2026/10/winning-nikon-small-world-in-motion-video-disqualified-for-ai-use/)).
    Both are meant “to showcase the beauty and complexity of things seen through the
    light microscope”—one through still photographs, the other through photovideography,
    taking advantage of all the technological advances that now allow users to make
    movies or time-lapse images through the microscope.\n\nHere are the top 10 winners
    of this year’s competition; the full list, with honorable mentions, can be found
    [here](https://www.nikonsmallworld.com). Nikon is also producing a full-color
    2027 calendar featuring the 2026 winners.\n\n[![Microscopic view of an inkjet
    printer depositing ink on paper.](https://cdn.arstechnica.net/wp-content/uploads/2026/10/nikon1-1.jpg)](https://cdn.arstechnica.net/wp-content/uploads/2026/10/nikon1-1.jpg)\n
