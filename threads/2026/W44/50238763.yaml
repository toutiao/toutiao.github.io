  author: diskzero
  text: I experienced these environments first hand, not at NeXT, but at NeXT adjacents
    like Apple, General Magic, Danger, Be, Eazel and other startups. What I miss is
    the shared vision and energy put into a project with a team of people who unify
    to accomplish a very difficult goal. You could seemingly tackle these projects
    with a small group and make great progress. We had building blocks, but many of
    the other fundamental pieces needed simply didn’t exist. You felt like you were
    constantly discovering something new.<p>Maybe this is how early Google people
    felt or how early OpenAI felt. I don’t know. They do have an embarrassment of
    riches, but I am sure they also felt they were doing great things.<p>I also worked
    at modern-ish Amazon and it sucked. Horrible office environment, tedious tasks
    and overall sense of oppression is what I felt. It is such a huge company, maybe
    there were pockets of joy.<p>My current job is back working on hardware products
    and the software that runs in them. It isn’t quite the same feel as 80s computer
    companies, but some of the joy is there.
