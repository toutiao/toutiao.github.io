  author: TheAmazingRace
  text: Because I was born right around the time the first NeXT Computer was announced
    in late ‘88, I wasn’t cognizant of the rise and fall of the NeXT platform, but
    I did come to appreciate the projects that were based on it, like the early WWW.<p>As
    a matter of fact, the first time I even heard of NeXT was a decade later in around
    ‘98, when PC Magazine or Computer Shopper (I can’t remember exactly which one)
    made a brief and snarky mention of the NeXT Cube in a retrospective blurb as a
    novel yet highly incompatible computer system, no doubt penned by John C Dvorak
    (RIP) who always had it out for Steve Jobs. It stuck with me, because the image
    of the NeXT they used looked like no other computer I was familiar with at the
    time and I was head over heels for it. I even tried procuring one for many years
    but was ultimately unsuccessful.<p>Frog did an outstanding job on the design language
    for the NeXT hardware. They then went on to help design the look of the Packard
    Bell PCs from the early to mid 90s too.<p>These are really cool photos and, honestly,
    I’d love to travel back to this past even briefly, just to experience it in person
    if I could.
