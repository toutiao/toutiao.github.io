    Be, Apple, Danger, and even more current Amazon. You can even read about this
    in Soul of a Machine. I suppose the trait of someone on a critical path doing
    this has been going on forever.<p>Bill also had some different definitions of
    “getting stuff done”. At General Magic when others were driving super hard to
    get things done, he would make soup and ensure that everyone was eating and not
    totally driving themselves into the ground.
