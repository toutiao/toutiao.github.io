  text: Lot&#x27;s of good and bad stories, which are also good. Eazel and Be were
    quite different but both companies really got jammed up by Microsoft. Microsoft
    was constantly threatening other companies who wanted to work with us. Be actually
    ended up getting a settlement out of Microsoft a decade later. I am not sure why
    Eazel didn&#x27;t pursue that. It could be because it wasn&#x27;t in the DNA of
    Andy to litigate.<p>Eazel stories are very interesting because the company was
    trying to interact with the open source movement and this caused some friction
    several times. Looking back at some of those meetings, it is interesting to compare
    the youthful idealism of people like Miquel DeIcaza and Nate Friedman to the people
    they have become today.
