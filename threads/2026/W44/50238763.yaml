  author: BadlyDrawnBoy
  text: "&gt;I believe our current work environments will be romanticized one day,
    in a similar way - we just don’t recognize the fun parts of the mundane.<p>I cant
    see it. I was in the embedded dev world from the early 90s to mid 2000s before
    I moved into infrastructure architecture. The mostly homogeneous world we currently
    live in is just not even close to what we had in the 90s. At one point I had a
    Next Cube, an IBM RS&#x2F;6000 (AIX 4.x Unix), a BeBox (BeOS), an OS&#x2F;2 system
    (PPC), a Sun SparcStation and 2 x NT 3.x system (x86 and PPC) all sat in my office
    at the same time. The diversity of hardware and operating systems is just not
    comparable to today. It was an exciting time of rapid development and change and
    we were aware of it. Much different to what we have now where we just like to
    pretend we are in a time of rapid development and change but the reality is incremental
    change and small increments at that outside of AI<p>I havent found anything in
    the IT world to excite me for close to 20 years. The expanding core counts were
    interesting to start with but soon got boring. The introduction of ARM was hardly
    an excitement. RISC-V is dead as far as performance designs go though its a great
    micro controller arch. Software is abstraction layer piled on top of abstraction
    layer piled on top of abstraction layer. There is almost nothing new and hasn&#x27;t
    been for a long time"
