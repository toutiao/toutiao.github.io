  author: WillAdams
  text: 'The high water mark of my computer usage was my final year of college when
    I used an NCR-3125 running Go Corp.&#x27;s PenPoint as a portable note-taking&#x2F;sketching
    device and connected it to a NeXT Cube w&#x2F; a Wacom ArtZ graphics tablet.<p>I
    was very hopeful when Rhapsody was announced, but quite disappointed by Mac OS
    X Public Beta managed to slow my PowerMac G4&#x2F;400MHz at my day job down to
    almost the same speed as my 25MHz NeXT Cube (always was bummed I couldn&#x27;t
    manage to justify a Turbo 33MHz machine). It took the better part of a decade
    for things to catch up, though my favourite version was Snow Leopard.<p>Still
    quite disappointed that MacWorld couldn&#x27;t be bothered to print my letter
    calling out David Pogue for claiming that Steve Jobs was using an IBM ThinkPad
    running Windows (it of course had OPENSTEP installed, being one of the few models
    on the supported hardware list).<p>Really enjoyed using Altsys Virtuoso 2.0 and
    programming in Display PostScript and seeing the results on-screen in real-time
    --- it was more-or-less ported to Windows and Mac OS as FreeHand v4 (and a version
    of it was announced&#x2F;advertised for Windows NT, not sure if it ever shipped)
    --- still resort to Macromedia Freehand when I have something which warrants having
    a nice pen tool&#x2F;complex Bézier curve manipulation.<p>Glenn Reid&#x27;s TouchType.app
    was just magical for textual logo design, and was a great example of how tightly
    focused small apps could be on that platform --- poste.app was simultaneously
    an app and a service and worth looking up for folks interested in such. Mac users
    should be sure to check out Services such as: <a href="https:&#x2F;&#x2F;apps.apple.com&#x2F;us&#x2F;app&#x2F;wordservice&#x2F;id899972312?mt=12">https:&#x2F;&#x2F;apps.apple.com&#x2F;us&#x2F;app&#x2F;wordservice&#x2F;id899972312?mt=12</a><p>And
    of course, Doom was fun even in 2-bit greyscale --- that&#x27;s where it was originally
    developed and what the map editor ran on: <a href="https:&#x2F;&#x2F;doomwiki.org&#x2F;wiki&#x2F;NeXTSTEP"
    rel="nofollow">https:&#x2F;&#x2F;doomwiki.org&#x2F;wiki&#x2F;NeXTSTEP</a><p>Lots
    of information at:<p><a href="https:&#x2F;&#x2F;nextworldarchive.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;nextworldarchive.com&#x2F;</a><p>but
    I rather wish that there was an analogue for NeXT to the Mac&#x27;s <a href="https:&#x2F;&#x2F;folklore.org&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;folklore.org&#x2F;</a>'
