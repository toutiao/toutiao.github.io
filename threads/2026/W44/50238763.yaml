  author: vee-kay
  text: The video game series Doom and Quake were developed by id Software using NeXT
    computers.<p>Thus the FPS genre in gaming was pioneered on these pioneering machines.<p>Object-oriented
    programming and graphical user interfaces became more common after the 1988 release
    of the NeXT Computer and NeXTSTEP. The platform was often held as the trendsetter
    when other companies started to emulate the success of NeXT&#x27;s object-oriented
    system. Sun Microsystems partnered with NeXT, for the NeXTSTEP Solaris but lost
    interest, but it later created Java as a direct competitor to NeXTSTEP.<p>Apple
    used NeXT&#x27;s software technologies as the foundation for Rhapsody, Mac OS
    X (later macOS), and the operating systems that followed.
