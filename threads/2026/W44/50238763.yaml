  text: The General Magic movie covers some things. It is worth a watch.<p>I am trying
    to think of something interesting that hasn&#x27;t been mentioned before. One
    thing I keep thinking about, when comparing it to other companies I have been
    at, is that I really liked the founders and the people there. So much in fact,
    that I ended up working with subsets of them at other companies a few more times.
    There was definitely stress and overwork and unpleasant things like that, but
    I never ended up feeling abused or treated poorly in the ways I experienced at
    Apple, Amazon, other startups or DreamWorks actually.
