  text: "&gt; What would be the purpose of acquiring both? Was the idea to acquire
    Be only for the talent and not for the OS?<p>A bit of both and it is a fascinating
    thing for me to think about, because of the knock on effects. Because Steve was
    insightful, even if JLG was on board with it, Steve probably would have told Amelio,
    don&#x27;t bother, because we can scoop up the people later on. Steve did something
    later on with Eazel, although with Andy Herzfeld&#x27;s request to do so, and
    ended with much of the Safari team, Finder&#x2F;Spotlight team, key CoreGraphics
    and iPhone team members and more.<p>If all of Be had went to Apple, perhaps Apple
    would have use used elements of the Media Kit, the file system (Dominic ended
    up at Apple doing the new file system, and more anyway), the UX team (Bill Bull
    ended up at Apple anyway), etc. But the effect on the industry would have been
    interesting. Danger, Inc. and the Hiptop wouldn&#x27;t have happened, Android
    under Andy Rubin wouldn&#x27;t have happened, Hiroshi would have ended up an exec
    at Apple and not running Android for Google, Eazel probably wouldn&#x27;t have
    happened (not such a big deal). Benoit would have been an exec at Apple and not
    Google, Erich Ringewald would have ended up an exec at Apple and not Amazon, etc.
    These are must minor fluctuations I guess, but fun to think about."
