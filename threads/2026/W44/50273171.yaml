  author: cyrialize
  text: 'This is a good point, but I do want to mention that I feel like in the past
    5 years we&#x27;ve had lots of extremely popular packages that hook into Emacs
    internals instead of rolling out their own architecture.<p>For example, corfu
    [0] versus company [1]. Company works with capf, but you can also write your own
    backends for it (specific to company). Corfu also works with capf, but all backends
    are capf functions instead of a corfu specific backend.<p>Another good example
    is eglot [2] versus lsp-mode [3]. Eglot is actually packaged with Emacs now.<p>There&#x27;s
    also other stuff, like vertico [4] (and others that are recommended to download)
    versus helm&#x2F;ivy.<p>I also want to mention that packages that hook into Emacs
    more don&#x27;t necessarily mean that they&#x27;re better. From my POV it&#x27;s
    more like you get a lot more things for free and the documentation you dive into
    will be Emacs specific instead of package specific. It all comes down to preference.<p>Vertico&#x2F;Counsel&#x2F;Orderless
    is very nice, but Helm and Ivy are fully featured (I always forget how much Helm
    has for you).<p>I use corfu, eglot, and vertico now. I have thought about going
    back to helm and company, especially since I was very familiar with company&#x27;s
    backends for a long time.<p>[0]: <a href="https:&#x2F;&#x2F;github.com&#x2F;minad&#x2F;corfu"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;minad&#x2F;corfu</a><p>[1]: <a
    href="https:&#x2F;&#x2F;github.com&#x2F;company-mode&#x2F;company-mode" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;company-mode&#x2F;company-mode</a><p>[2]:
    <a href="https:&#x2F;&#x2F;github.com&#x2F;joaotavora&#x2F;eglot" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;joaotavora&#x2F;eglot</a><p>[3]:
