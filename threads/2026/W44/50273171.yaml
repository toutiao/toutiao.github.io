  author: jwr
  text: 'I have been using Emacs for more than 30 years now. Other editors have come
    and gone, Emacs stayed. Parts of my configuration are more than 30 years old.<p>There
    were better and worse times in Emacs history. Recent times, however, are really
    good. Emacs is maintained and developed actively and there are many external packages
    which are impressive. Magit and ghostel are good examples of packages that I use
    on a daily basis to get my work done.<p>Recently, AI completely changed how I
    use Emacs, and in a very good way. I now treat AI as a fairy that can fulfill
    any wish. I describe how I want my editor to work, and boom! it works that way.<p>Examples:
    window and tab management, difftastic integration, markdown previews with beautifully
    rendered tables, markdown previews as PDFs, and many more.<p>What is most important,
    however, goes back to Stallman&#x27;s original ideas. I am in control of my editor
    and my environment. I decide how it will look and behave. No corporation decides
    for me. No corporation builds in a new AI assistant. Nobody introduces ads or
    tracking. This is something I&#x27;ve learned to appreciate over the years.'
