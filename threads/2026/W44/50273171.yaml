  author: iLemming
  text: Any Lisp is good at editing live process, you just need to give it a REPL.
    Because of homoiconic nature of Lisp, every step in Read-Eval-Print-Loop differs.
    Lispers sometimes refer to Lisp REPL as the &quot;true REPL&quot;, because non-homoiconic
    REPLs are rather &quot;interactive shells&quot; in comparison.<p>Clojurescripters
    for example can use nbb with the connected REPL and build web-scrapers while interactively
    &quot;clicking&quot; on  buttons and exploring DOM directly from the editor.<p>In
    case of Emacs, it is not [just] an editor, technically it is a Lisp REPL loop
    with a built-in text editor. That&#x27;s why you can virtually change any aspect
    of it on the fly, without ever having to restart it.<p>What&#x27;s crazy that
    this allows to have pretty much anything &quot;programmable&quot;. Even keyboard
    macros in Emacs are just series of Lisp instructions. You can compose a macro
    and then look at its underlying code, modify it and execute it.
