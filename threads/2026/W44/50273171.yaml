  author: a_e_k
  text: |-
    If you&#x27;ve read Pratchett&#x27;s Discworld, I like to think of Emacs as an Igor: it&#x27;s a loyal servant that can swap out its own parts, exchange them with other individuals, and rebuild itself on the fly.<p>But to answer your question, It&#x27;s not just elisp itself, but rather that Emacs is basically a live elisp interpreter process with an editor UI on top, and the design is something of a ball-of-mud with few boundaries.<p>With typical systems you have plugins and they have fairly narrow interfaces.  If you want to do something that&#x27;s not covered by the plugin API, you&#x27;re pretty much out of luck.<p>With Emacs, everything is open as a free-for-all to extend or redefine, so you can monkey-patch pretty much anything.  Here&#x27;s an example from my init.el:<p><pre><code>    (define-key global-map [remap move-beginning-of-line] &#x27;move-beginning-of-line-dwim)
        (defun move-beginning-of-line-dwim ()
          &quot;Cycles between the beginning of text on the line, the actual
        beginning of the line, and the beginning of the body of a comment
        on the line.  If not in one of those three places, it starts at
        the beginning of the text.  Basically, it&#x27;s a smarter HOME
        command.&quot;
          (interactive &quot;^&quot;)
          (comment-normalize-vars t)
          (unless (and (bolp) (comment-search-forward (pos-eol) t))
            (let ((cur (point)))
              (beginning-of-line-text)
              (if (= cur (point))
                  (beginning-of-line)))))
    </code></pre>
    By default, the HOME key and Ctrl-a are bound to the `move-beginning-of-line` (defined in `simple.el`, one of the elisp source files that comprises vanilla Emacs).  That `define-key` with the `remap` tells Emacs that everywhere in the global keymap that it sees the default `move-beginning-of-line`, it should replace it with my custom `move-beginning-of-line-dwim`.<p>Alternatively, I could have just done `(defun move-beginning-of-line ...)` and simply redefined `move-beginning-of-line` wholesale and it would probably have worked fine.  But this is a little cleaner, IMO.  Either way, now when I hit HOME key it cycles between column 0, the first non-whitespace character, and the first character in the body of a trailing comment.<p>On top of that, I don&#x27;t need to have a formal plugin or anything.  I can take the above code, paste it into an elisp buffer somewhere, put the cursor somewhere in or after the `(defun ...), hit Ctrl-x Ctrl-e and now that function is defined within Emacs (and callable by other functions).  Same thing with the `(define-key ...)`: put the cursor on it, Ctrl-x Ctrl-e, and the binding is updated.  No ceremony.<p>And for testing, I can edit the function freely, hit Ctrl-x Ctrl-e and now my edited version is the live one in the running Emacs process.  It&#x27;s a lot like a scripting language REPL except within the editor UI.<p>And in addition, Ctrl-h Ctrl-f tells you about any function that Emacs knows, defaulting to whatever function name the cursor is on.  So if I put the cursor on `move-beginning-of-line-dwim` and hit Ctrl-h Ctrl-f RETURN, I get:<p><pre><code>    &lt;home&gt; runs the command move-beginning-of-line-dwim (found in global-map),
        which is an interactive interpreted-function.

        It is bound to C-a and &lt;home&gt;.

        (move-beginning-of-line-dwim)

        Cycles between the beginning of text on the line, the actual
        beginning of the line, and the beginning of the body of a comment
        on the line.  If not in one of those three places, it starts at
        the beginning of the text.  Basically, it’s a smarter HOME
        command.

        [back]
    </code></pre>
    Same thing for Ctrl-h Ctrl-v for variables and settings.  The documentation that it shows is generated directly from the doc strings and live editor state.  Ctrl-h Ctrl-k will prompt for a key and show me a key binding, so Ctrl-h Ctrl-k HOME will give me the above documentation now too.  Ctrl-h Ctrl-b shows all applicable keybindings, etc.<p>Now I&#x27;d mentioned that you can monkey-patch anything.  In practice that could cause chaos if you don&#x27;t take care.  A pretty common idiom in Emacs to do this more cooperatively are &quot;hooks&quot;.  These are just variables that some package, internal or external, defines to hold a list of functions to callback.  The package iterates the list and calls them whenever the given event happens and you can add or remove your own function to the list to get that call.  Think signals and slots, if you seen that design before.  And these are pretty ubiquitous.  As an example from my init.el:<p><pre><code>    (add-hook &#x27;font-lock-mode-hook &#x27;font-lock-mode-setup)
        (defun font-lock-mode-setup ()
          &quot;Make fixme tags standout.&quot;
          (unless (derived-mode-p &#x27;special-mode)                      ; Don&#x27;t break list-{faces,colors}-display
            (font-lock-add-keywords nil
             &#x27;((&quot;\\&lt;\\(?:AEK\\|NOTE\\|FIXME\\|TODO\\|XXX\\)\\&gt;\\(?:([a-z]+)\\)?:?&quot; 0 &#x27;font-lock-warning-face prepend)))))
    </code></pre>
    So whenever syntax highlighting is started up in a buffer, it calls the font-lock-mode-hook callbacks, and that runs my code to register a regexp to highlight my initials and other fixme tags.<p>And if all that&#x27;s not enough, Emacs also has an &quot;advice&quot; system which lets you register code to run before, after, around, etc., <i>any</i> existing function.  (And then later unregister it if you wish.)  There&#x27;s also a built-in elisp debugger to break into a function and step through it.<p>So basically, the key I&#x27;d say is that there&#x27;s no real privileged code in Emacs.  You can redefine pretty much anything to taste, and do so without even having to reload Emacs.  The downside is that it&#x27;s up to you to decide what to trust.  It&#x27;s on you to avoid breaking it, and you probably want to be choosy about the packages you run.
  score: 0
