  author: iLemming
  text: "&gt;  keep their Emacs configs&#x2F;setup &quot;lean&quot;<p>With my last
    bankruptcy where I tried to dissect my 12K LOC config to identify the bloat and
    the crap I no longer needed, I found very few pieces that weren&#x27;t used. Turns
    out, my config was already modular and lean, in the sense that everything I had
    there had a practical reason to be in there.<p>Once I started using LLMs to deal
    with Emacs, I decided to add a bunch of tests to run them in CI, just to prevent
    regressions. My config since then has grown to 26K LOC + 35K of tests. I consume
    250 third-party packages, plus about 100 built-in libs.<p>My Emacs starts and
    loads within a second. I have no problems such as freezing, breaking or leaking
    memory. With all this stuff I have in it, it can run for days and weeks and its
    memory usage on Mac stays within a comparable range with the Slack app - around
    500MB.<p>I never understood this obsession with keeping Emacs lean. Bruh, throw
    some shit into it, let it burn, it&#x27;ll chug on any large amount of Lisp and
    still give you the smoothest ride ever. What&#x27;s the point of keeping a colossal
    beast under a mountain and feeding it a low-calorie diet? It&#x27;s like digital
    abuse. Emacs these days is capable of rendering Doom-level graphics, it&#x27;s
    offending to use it like notepad.exe."
