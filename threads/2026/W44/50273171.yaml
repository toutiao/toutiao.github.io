  text: "&gt; IDEs and now Claude have taken over<p>100% completely opposite experience.
    Emacs is hands down the king of any kind of text-manipulation. And not only on
    the composition side. Most editors and IDEs are focused on the composition side
    of things - making text, adjusting text, amending text. And code btw, is nothing
    but structured text.<p>Emacs opens gates for text consumption - I&#x27;m reading
    this entire HN thread in Emacs, just like I consume Jira, Slack, Telegram, Reddit;
    control YT vids, my browser tabs and history, etc. I search through Splunk and
    Datadog logs, Wiktionary entries and just general googling - all done in Emacs.
    I browse million-line codebases on GH without ever having to clone them. If there&#x27;s
    a piece of any kind of text in the computational vicinity to my active Emacs instance
    - this laptop and all connectable devices, I can easily make use of it.<p>And
    this gets incredibly important in the age of LLMs. I can read, manipulate, navigate,
    search through, diff, sort, group, slice, dice, salt and pepper any kind of text.
    Give me just about any other editor instead and I immediately will feel handicapped.<p>IDEs
    that are not malleable (by design) are at an exact disadvantage. I can change
    any aspect of my editor in the middle of typing this very comment without ever
    losing the state, the context, or my mental focus. No IDE even hypothetically
    capable of doing any of that."
