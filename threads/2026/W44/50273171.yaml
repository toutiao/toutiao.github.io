  author: Jtsummers
  text: |-
    If you open the file and execute:<p><pre><code>  M-x elisp-enable-lexical-binding RET
    </code></pre>
    It will add a cookie (lexical-binding) to the top of the file. If you want to do it manually put this:<p><pre><code>  ;; -*- lexical-binding: nil; -*-
    </code></pre>
    or this:<p><pre><code>  ;; -*- lexical-binding: t; -*-
    </code></pre>
    at the top of your custom.el file. They want it to be explicit now because eventually lexical will be the default. If you put in the former then when lexical becomes the default, the file will still use the current dynamic bindings. And if you use the latter, if there are issues you&#x27;ll discover them now before the default changes and you&#x27;re surprised by it.
