    The notion that we can only get baseline-acceptable results from constantly keeping up with the state of the art, which with LLMs changes at an extreme pace, feels like an admission that this technology is not ready for wide adoption.
    And as I noted in my literature review linked in the other sub-thread, the big consensus on adoption of LLMs for coding across the industry is that it's a mixed bag. Some people euphemistically say "it's an amplifier", meaning that it makes good teams better and bad teams worse, but even that's an admission that this is not, at least at this time, a revolutionary leap forward that everyone can and should rush out and uncritically adopt.
