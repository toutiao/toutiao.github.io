    I think it’s clear that there are some classes of software that can be fully agentically vibecoded successfully with the appropriate testing and validation.
    For example here it seems clear that the creators weren’t using the state of the art in testing concurrent systems, which agents are capable of doing with some leading. I still don’t think that would be sufficient on its own because essentially this is very much the kind of software that requires a consistent perspective on how it ought to work. Certainly that’s my conclusion around my own work with concurrent code and caching.
    By contrast software that can be fairly fully specified, and adequately tested by running production like workloads and finding and collecting bugs and then be treated as complete, can be adequately built by vibecoding.
    I just launched an mcp server at $JOB that I (with one colleague) vibecoded apart from testing. In this case we can test whether the various harnesses can successfully connect, we can observe the length of sessions, we can see if the agent comes up with sensible answers, and the agent can feedback on what tripped it up.
    @simonw also blogged about how far you can get with game development with just an agent now. Clearly that’s in the category of things that can be sufficiently validated.
    Note that in the case of both of those it’s still a long process of prompting for what is required and thinking about those requirements and testing it. And actually the core of both the things I did successfully vibecode did start with me exercising a fair amount of perspective and taste about how it should work.
    I think the question for agentic development is how much human perspective and direction is required, whether or not you know how to properly test (with agentic assistance) and what is the optimal amount of software to generate and validate, and how much human review is needed. I don’t think we’re yet at the stage where specification alone is enough for every piece of software to be purely llm generated.
