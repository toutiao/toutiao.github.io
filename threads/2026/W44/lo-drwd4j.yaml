    I was originally just going to flag this comment as off-topic and move on, but then I thought better of it.
    So: I don't normally read Hacker News, but someone linked me comments made by the Orkes people over there, so I clicked through. And then I skimmed the rest of the thread. And I wasn't surprised by what I saw there, though I was a little disappointed. I saw, for example, the creator of Redis openly disbelieving that it was possible Orkes could have been using LLMs properly and still ended up in this situation, even after being told that yes, they were using adversarial LLM review like everyone says to.
    And that's the thing that stuck with me. I don't doubt that if we dug into the details we'd find that the folks at Orkes were using LLM workflows that can be traced directly to broadly-recommended best practices from LLM vendors or from major influencers in the LLM world. I don't doubt that their LLM coding agents were telling them everything was great, and that they believed it. I don't doubt that they thought they'd be a positive example and case study for those practices, and I wouldn't be surprised if that played a role in their requesting a Jepsen review. And yet this is still where they ended up.
    This is one of the major things that puts me off about all-in LLM use. If you go "agentic" the way more or less everyone tells you to these days, you're essentially removing all human review from the loop and trusting that layers of agents generating and adversarially reviewing and fixing up code is a reliable enough setup that human review isn't needed. And yet it very clearly is not reliable enough and, worse, people for whom it's failing have no way of knowing it's failing because they've removed the element in the loop that could have noticed.
    But it's not like you can just go and require human review of all the code again, either, because the whole selling point of LLM use is you can generate so much code, so quickly, that no human could possibly keep up with it. So I'm not sure where this leaves the maximalist pro-LLM position, but I think it's not just "validation" of a "chip on [my] shoulder", I think it's a real and damning criticism.
