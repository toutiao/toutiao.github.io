    I guess as a minimum system editor it kind of makes sense, if we assume users are familiar with Emacs bindings.

    The Apple Macintosh's built in text edit as well as gnu readline use some emacs bindings by default, so it might be familiar to those users. My terminal library had Mac users asking me to implement emacs-style bindings for them. Then the actual emacs users come in and ask for weirder sounding concepts like "yank" and "kill ring".... but like the control+a meaning "go to start of line" and similar things like that are standard in mac and gnu, so people coming from there to netbsd might appreciate it.
