  author: andai
  text: "&gt; Now, here&#x27;s where our fun experiment starts. I found out that by
    setting the gate to 1,1 the write strength (beta) to 1,2 and using one-hot key
    encoding,3 every write we perform will overwrite exactly one row, and every one-hot
    query can retrieve an exact value. This means that the GDN layers themselves can
    work exactly as RAM, at a far lower cost than using normal attention as RAM, since
    a GDN head&#x27;s state stays the same size however long the conversation gets,
    unlike attention&#x27;s KV cache.<p>So like... can&#x27;t you use a computer as
    a computer without doing all that roundabout stuff? Like if you want to integrate
    a LLM with hard computation there&#x27;s probably a more efficient way to do that.<p>Or
    is this building towards &quot;but can it run DOOM?&quot; :)"
  score: 0
