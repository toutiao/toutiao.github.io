  author: frotaur
  text: This was not a neuron. This was from a trained sparse auto encoder.<p>In a
    few words, they found a way to map residual stream activations (so, a vector)
    into a few interpretable sparse concepts. They also had the converse maps, that
    translate concepts into activations.<p>Golden Gate claude was obtained by artificially
    increasing the activations in the direction of the &#x27;Golden Gate&#x27; concept.
    It was not neuron surgery.
