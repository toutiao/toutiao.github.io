    Inserting panics is definitely not the norm.

    It's common to panic when prototyping, since it's the easiest way to handle errors. Sometimes these remain in production code because it's easy to forget about them. This is worsened when there are many examples online that both train new developers and LLMs how to write code.
    I've seen Rust panics in apps I've used regularly and also have seen expect abused to produce error messages (I've done this when prototyping, so I'm also guilty).
    In Zig, on the other hand, the easiest way to handle errors is to bubble them up. This is much easier to add proper error handling to later on, and doesn't crash the whole application.

    You definitely don't have to return a boxed error. In fact I consider that a code smell. The alternative not discussed here is to define your error enum like you would with thiserror and then implement the Error trait yourself. This is totally doable, and not that much of a pain if you're wanting to avoid a dependency.

    I have done this before. It's much more annoying to do than in Zig and doesn't handle composition nearly as cleanly.

    .. sometimes is that starting a new project can be a worst case scenario for an ADHD brain ...

