    # [security] Protecting against CVE-2026-98432

    ### Neal Patel

    - Setting "GODEBUG=multipathtcp=0" in a program's environment will disable MPTCP by default at runtime.

    - Placing "godebug multipathtcp=0" in the main module's go.mod file will disable MPTCP by default at build time.
