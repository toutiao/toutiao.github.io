  author: tialaramex
  text: You seem to be taking &quot;copy&quot; much too literally.<p>&quot;Blue Prince&quot;
    is <i>heavily</i> inspired by earlier works, those works just aren&#x27;t video
    games. You could say the same all the way back to ADVENT, the Colossal Cave Adventure
    of the 1970s being inspired by adventures in an actual cave.<p>Of course good
    games do something we haven&#x27;t seen before or do it better, but they are also
    invariably products of a wider culture. A big part of why Animal Well doesn&#x27;t
    need to explain itself is that a modern video game player <i>knows</i> how this
    sort of game works and so when they get Slink or B Wand or similar they realise
    they can explore places they couldn&#x27;t reach before.
