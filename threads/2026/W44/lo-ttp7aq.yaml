  author: bakkot
  text: |-
    There's statements from Anthropic employees over at the orange site. Quoting a couple:

    Dworken from Anthropic here, 2.1.313 was never published on OpenVSX, the VS Code marketplace, or on any of our official hosts. The malicious actor here had published a fake version of this extension on Cursor's marketplace. In order to disambiguate, we made sure our next update was 2.1.314.


    Dworken from Anthropic here, I just want to be clear: OpenVSX was not impacted in this incident, the impacted system was only the Cursor marketplace that they host. We have confirmed that no Anthropic systems or employee devices are involved in this.


    Felix from Anthropic here.
    We’re working with Cursor on this incident, but it wasn’t a compromise of Anthropic’s systems or employee laptops. A malicious actor used access to Cursor’s marketplace to publish a tampered copy of the Claude Code extension, which we didn’t build or publish. The versions on our official channels are not affected and this only impacts Cursor users.

    For anyone else not familiar with the ecosystem here: there's an official VSCode extension marketplace, there's an alternative one called OpenVSX, and there's the Cursor marketplace, which proxies OpenVSX and also adds its own things. Sounds like the Cursor layer is where the compromise happened. Anthropic only publishes on the official one and OpenVSX.
