  text: |-
    All of the write-ups I've seen only mention Cursor Marketplace and Open VSX (which Cursor Marketplace uses), with none of them explicitly mentioning the official Microsoft registry. This leads me to believe that perhaps the official registry did not have a compromised build... but it's hard to say with certainty without actually checking the builds. Unfortunately, it seems like since they've been pulled, it's not possible to fetch them.
    EDIT: The version that was compromised (2.1.313) seems to have never been published on the official Microsoft registry. As per the documentation (https://code.visualstudio.com/api/working-with-extensions/publishing-extension#unpublishing-extensions), unpublished versions should still be discoverable:

    When you unpublish an extension, the Marketplace preserves the extension statistics. The extension remains publicly discoverable and available via an existing API.
