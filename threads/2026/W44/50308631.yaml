    the requester can&#x27;t necessarily identify where the data genuinely originated?
    Suppose I torrent a genuine Linux ISO in france. Do all of the peers get fractional
    bills? Or is it on the distro maintainer? What if the data didn&#x27;t really
    originate from any of the peers but was fetched for me by the peers and the peers
    don&#x27;t tell me (or therefore the ISPs) where they got the data from?<p>What
    if I put, say, VLC in an encrpyted zip. The ISP and therefore the french gov would
    see this as data coming from me since it doesn&#x27;t hash as VLC, but they also
    can&#x27;t prove that it came from me if I demonstrate that it was actually downloaded
    from a forum.<p>What about anonymous data? If 4chan is mirroring images for me
    that I uploaded from a McDonalds and a french frog downloads it, how do I get
    a bill? Does 4chan eat the bill or forward it to the McDonalds? Does the McDonalds
    eat the bill or hire a tech to cross-reference cameras and IP logs? What if I
    paid for the food in cash? Do they check some mythical &quot;who owns this laptop&quot;
    database provided by google&#x2F;meta&#x2F;microsoft? What if my laptop isn&#x27;t
    in those databases? The local McDonalds is forced to foot the bill as they can&#x27;t
    provide a patsie?<p>If I send a friend a video on via facebook messenger, who
