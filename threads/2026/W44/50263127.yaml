  text: I&#x27;ll just push back a little in case anyone thinks that all older translations
    are no good. You&#x27;re quite right that as scholarship advances, they become
    more accurate, and sometimes the quality improves as well. But there are other
    examples (like Pope&#x27;s Iliad) where the accuracy is secondary to the interpretation
    and artistry in the target language.<p>Here however I think you&#x27;re probably
    correct (and probably your comment was specific to this, not general). But I&#x27;d
    also recommend OP and other curious folks try downloading a few versions and reading
    the first few pages or hundred lines, and see which one feels best to you. Enjoying
    the work is the first task, then appreciating and studying will come more naturally
