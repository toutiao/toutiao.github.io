  author: johngossman
  text: The reviewer, Philip Terry, is himself a very good, very clever poet. His
    &quot;Dictator&quot; is an absolutely brilliant translation into Globish, a simplified
    English designed for commerce. He reasons that cuneiform had a similar role in
    cross-language understanding. Terry refuses to use words outside Globish&#x27;s
    1500-word vocabulary, resulting in Gilgamesh being translated &quot;Dictator&quot;,
    but also imposes a bizarre prose form, leaves out holes in the original tablets,
    and &quot;translates&quot; some idioms literally...all with great humor. The result
    looks like this:<p>Then day | light break | …… [And] WILD | MAN make | of he |
    mouth a | shape… he say | to DIC | TATOR ‘Listen | to the | dream I | dream in
    | the night The sky | god | + + + the | war god | the god | of know | ledge and
    | the sun | god all | meet to | gether | in the | great court | of the | sky…
    And the | sky god | AN + + + | say to | the war | god… “Because | they kill |
    the MAN | COW of | the sky | + + + and | because | they kill | TREEGUARD the one*
    | who cut | down the | hard wood | tree on | the moun | tain side | must die”<p>It
    shouldn&#x27;t be your first read of Gilgamesh, but its a fun, insightful second.
