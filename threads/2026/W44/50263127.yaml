  author: wl
  text: 'It looks like he has not studied any Akkadian. He is apparently reliant on
    glosses by Assyriologist Jacob Dahl and presumably other translations.<p>From
    the introduction:<p>&gt; Benjamin R. Foster, another esteemed academic author
    who has made significant contributions to the study and translation of the poem,
    [...] says, “I have no patience with clueless folk who think they can translate
    the epic without going to the trouble of mastering Babylonian.” This is a disheartening
    and discouraging comment. Are we really to accept that satisfactory transmissions
    of the Gilgamesh story rest entirely in the hands of professionals in the subject
    of Assyriology, or that the poem is located behind some kind of intellectual force
    field, or that those of us outside the inner circle must leave such profound work
    to the fellowship? And what of the counter argument: that the job of translating
    poetry cannot be fully realized by professors, only by poets?<p>&gt; Echoing George
    and Foster to some extent, Michael Schmidt comments, “Interlopers achieve mixed
    results among the dead languages of the world.” Am I one such interloper, trespassing
    on hallowed ground? My approach to Gilgamesh has been the same as for my medieval
    translations, with the hope of producing critically informed work that speaks
    to the widest readership, attempting to balance linguistic and historical frameworks
    against literary expectations of the present day. The difference this time is
    that like almost everyone else on the planet I have no comprehension of Akkadian
    or other languages of the period, and for his thorough and no-nonsense translations
    of the cuneiform scripts I am indebted to Jacob L. Dahl, professor of Assyriology
    and fellow of Wolfson College, Oxford, who provided me with the literals to work
    from. Jacob also answered hundreds, perhaps thousands, of my questions, some of
    them well below his pay grade, and stuck to the task for three or four more years
    beyond my wildly optimistic timeframe. I am enormously grateful to Jacob, for
    being a medium between this world and the world of the long dead, and for help
    in bringing them back to life. Any errors of judgment or rogue deviations between
    the files he submitted to me and the publication of this book are entirely of
    my making.'
