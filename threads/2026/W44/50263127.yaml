  author: adrian_b
  text: The ancient authors are quite explicit that the &quot;massage oil&quot; is
    for external use, not for internal use, so the massage oil did not contain drugs,
    even if, when used by rich people, it typically included some strong perfume.<p>For
    example Pliny the Elder says this at the transition between book 14 (on vines
    and wine) and book 15 (on olive trees and olive oil):<p>&quot;There are two liquids
    that are specially agreeable to the human body, wine inside and oil outside, both
    of them the most excellent of all the products of the tree class&quot;<p>A rather
    similar description is given in Gilgamesh when comparing the pleasures of drinking
    beer and being massaged with oil, except that the plants that provided alcohol
    and oil are different, barley instead of grapevines and sesame instead of olive
    trees.
