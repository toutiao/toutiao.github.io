  author: adrian_b
  text: 'Yes, that book review seems pretty good.<p>However, I do not like that it,
    like most other comments that provide only partial information about Gilgamesh,
    fails to mention some details that I consider culturally relevant.<p>For instance,
    it lists only 3 benefits of civilization with which the wild man is lured to leave
    his former life: professional women, eating bread &amp; drinking beer.<p>I fact,
    the Gilgamesh epic lists 4 benefits of civilization, the 4th being the pleasure
    of being massaged with oil (apparently sesame oil is meant, presumably flavored).<p>In
    the antiquity, vegetable oil had only a minor role as food, its principal application
    was for massage, normally as perfumed oil. Massage with oil was a very widespread
    practice, even among the relatively poor.<p>The technologies of oil extraction,
    of milling flour, of making bread and of making beer by fermentation, were indeed
    major advantages of the settled people living on agriculture, in comparison with
    hunter-gatherers.<p>Most comments about Gilgamesh list only the first 3 benefits
    of civilization, because those are the most easy to understand for modern readers.
    Massage with oil is much less used today, so many modern readers do not realize
    that by the time of Gilgamesh (and also millennia later, e.g. in the Roman Empire,
    where it was still the main use of olive oil) it was considered a pleasure as
    important as eating and drinking.'
  score: 0
