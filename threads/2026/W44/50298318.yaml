  author: voidhorse
  text: You&#x27;ll love <i>Correction</i> if you have a taste for experimental literature.
    I&#x27;ve have all of Bernhard&#x27;s novels. They are (mostly) uninterrupted
    walls of text. They can also be quite depressing. You&#x27;ll likely either love
    them or hate them. Correction is probably the most exemplary instance of his style
    and experimentation, and maybe his best novel, but <i>Concrete</i> and <i>Extinction</i>
    fall into this category as well. <i>Wittgenstein&#x27;s Nephew</i>, <i>Frost</i>,
    and <i>Woodcutters</i> are more approachable if you want to ease into it. Starting
    with <i>Correction</i> might be a bit off-putting and intense depending on how
    often you read more experimental&#x2F;stylistic literature.<p>He also wrote poetry.
  score: 0
