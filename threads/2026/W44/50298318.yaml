  author: fasterik
  text: Bernhard is fantastic. Woodcutters might be a gentler introduction to his
    style. It&#x27;s shorter, funnier, and less oppressive than Correction, which
    is his magnum opus. Apparently he was at least somewhat as unhinged in real life
    as in his writing. He was notorious for insulting the Austrian intelligentsia
    and either refusing literary awards or showing up at the ceremony just to rant
    and insult the audience, which he wrote about in a memoir titled My Prizes. He
    was a big influence on W.G. Sebald, another great German language writer (my personal
    favorite) who makes an appearance in McCarthy&#x27;s library.
