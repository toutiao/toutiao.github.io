  author: marttt
  text: "Our son was about 3yo when I read it, and I couldn&#x27;t put it down. To
    me, it is a story of the father standing by his son no matter what. A really immersive
    reading experience. A father-son exchange that touched me:<p><pre><code>  What
    is it?\n  Nothing. I had a bad dream. \n  What did you dream about?\n  Nothing.\n
    \ Are you okay?\n  No.\n  He put his arms around him and held him. It&#x27;s okay,
    he said.\n  I was crying. But you didnt wake up.\n  I&#x27;m sorry. I was just
    so tired.\n  I meant in the dream.\n</code></pre>\nI do think McCarthy&#x27;s
    own family life felt, well, &quot;controversial&quot; in the light of all this.
    But, at least he didn&#x27;t seem to justify himself about it. IIRC, on not paying
    child support after divorce, he has said &quot;with what?&quot; in one of his
    rare interviews.<p>I&#x27;m not a native English speaker, and I&#x27;ve had writerly
    ambitions myself, and his style feels like magic to me (hey, an accidental cormac-y
    polysyndeton here!). But... yeah. Thinking about the way many poets &quot;manage&quot;
    to put art before family life (obviously, they can&#x27;t help it) is a good reflection
    of me myself being just a layperson.<p>But he is a true master, obviously. Could
    be that I liked &quot;All The Pretty Horses&quot; even more than &quot;The Road&quot;.
    Unfortunately &quot;Suttree&quot; isn&#x27;t translated to my language yet."
