  author: fallinditch
  text: 'A random book from the collection looks interesting: Correction by Thomas
    Bernhard.<p>Described as “a mesmerising, claustrophobic novel about obsession,
    genius and the impossibility of perfection. Structured in two enormous, uninterrupted
    blocks of prose, it follows an unnamed narrator reconstructing the life of his
    dead friend Roithamer, before becoming absorbed in his manuscripts. Sentences
    spiral, repeat and contradict themselves, creating the sensation of being trapped
    inside an endlessly turning mind. Roithamer is modelled partly on Ludwig Wittgenstein,
    particularly his intellectual austerity and obsessive pursuit of perfection, reflected
    in his design of an extraordinary house for his sister. A darkly comic, exhilarating
    and exhausting masterpiece.”<p>Adding to my ‘want to read’ list now …<p>A review:
    <a href="https:&#x2F;&#x2F;proletarianpolyglot.substack.com&#x2F;p&#x2F;correction-by-thomas-bernhard"
