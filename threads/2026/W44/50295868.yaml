  text: "&quot;COM&quot; programs as seen in MS DOS and earlier CP&#x2F;M systems
    contain only relative addresses, and can run from any &quot;segment&quot; of RAM,
    as the addresses are relative to the value of a segment register.  This was used
    to load &quot;background&quot; services, typically servicing hardware devices.<p>MCUs
    with MMUs are starting to appear, such as the ESP32-S31."
