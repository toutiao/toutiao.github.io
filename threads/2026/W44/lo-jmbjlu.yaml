  text: |-
    However this unfortunately abuses Poll::Pending, whose docs state: "When a function returns Pending, the function must also ensure that the current task is scheduled to be awoken when progress can be made." This definition is incompatible with how Fuse uses Pending, and so bringing it into the stdlib would require redefining Pending to mean both “pending” and “done”.

    This came up in issue #163678. To me it doesn't seem like there's any contradiction between that documented rule and a future that returns Ready once and then Pending forever after that. (Or for that matter, a future that only ever returns Pending.) If there's no further progress to be made, then returning Pending without scheduling any wakeups is reasonable.
    Specifically, an async fn future currently panics if you poll it again after it returned Ready. That seems like a fine way to catch mistakes early, at the cost of compiling in the panic machinery like you mentioned. But I don't think there would be anything fundamentally wrong with changing async fn futures to return Pending forever in that case instead. If I understand correctly, that's what the new/proposed compiler switch in that issue is doing. Seems like a good way to solve the problem?

    The compiler can guarantee that calling .await never polls after getting Ready, and so it doesn’t need to handle the Done state.

    In this model can the compiler really guarantee that .await is never going to see Done? An incorrect future could return Done before returning Ready. It presumably wouldn't be unsafe/unsound to do so? My intuition is that we'd need to lower .await to something that panicked in that case, which means we're not solving the problem we set out to solve. (Waiting forever on a future that returns Pending forever makes sense, but waiting forever on a future that returns Done doesn't make sense to me.)

    This leads to a rule that we can apply recursively to every future: “When a future is polled, it must also poll all child futures that have had their waker called.” If every future follows this rule, no future will ever be snoozed.

    Incidentally this is now an RFC: https://github.com/rust-lang/rfcs/pull/4019
