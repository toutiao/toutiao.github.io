  author: shadowgovt
  text: 'It&#x27;s not a moat because it&#x27;s a commodity.<p>Enterprises actively
    do not want Cloud provider&#x27;s services distinguished by anything other than
    speed, cost, and reliability, because features imply lock-in. They&#x27;d rather
    have someone else&#x27;s computer as bare-metal and run features atop that.<p>That&#x27;s
    a recipe for racing to the bottom in the cloud space against the other providers,
    where the wins are very raw: what hardware did you predict two years ago you needed
    today, what breakthroughs in information structuring have your competitors not
    yet implemented in their own clouds, etc.<p>It&#x27;s raw capitalistic competition,
    and that&#x27;s good for <i>consumers</i>... But companies don&#x27;t want that
    because it&#x27;s a path to net-neutral revenue in the long-term, which is not
    how you put your stock on the moon.'
