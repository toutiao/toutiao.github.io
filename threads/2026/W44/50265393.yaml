  author: AnthonyMouse
  text: "&gt; The problem isn&#x27;t that we don&#x27;t know how (solved issue: UBI,
    higher pay for less work, high marginal income tax rate, unrealized capital gains
    tax above a minimum, land tax, etc.).<p>Part of the problem is that there are
    people who think all rather than only some of those things are a good idea.<p>High
    marginal tax rates and taxing unrealized gains are both unintended consequences
    factories. <i>Especially</i> the second one, but even the first one is basically
    a trade off between creating perverse incentives and arbitrage opportunities (i.e.
    massive loopholes) because the high rates don&#x27;t apply to everything, or supercharging
    offshoring because the high rates <i>do</i> apply to everything.<p>Conversely,
    a UBI is a good idea, and doesn&#x27;t actually require oppressive tax rates because
    it replaces most of the existing system of government benefits and subsidies --
    which impose <i>even higher</i> de facto marginal tax rates on most of the middle
    class in the form of benefits phase outs. US federal spending is already &gt;$20,000
    per capita.<p>Not all of that is assistance programs, but a <i>large</i> proportion
    of it is. And most of those programs are a net negative compared to reallocating
    their budgets to a UBI. Having separate bureaucracies to administer separate programs
    for food assistance, housing assistance, education assistance, etc. is foolish
    even <i>before</i> they create weird marginal rate cliffs and higher marginal
    rates on lower income people by having arbitrarily overlapping phase out rates.<p>It
    isn&#x27;t about the source of the money. Converting those things to a UBI would
    cost <i>less</i> money to give people <i>more</i> money because you&#x27;d save
    the amount spent on administration, while improving economic efficiency by not
    imposing arbitrary restrictions on how it&#x27;s spent. The primary reason we
    don&#x27;t do that isn&#x27;t upper middle class people demanding a status quo
    in their own interest -- it isn&#x27;t in their interest.<p>It&#x27;s a combination
    of ordinary incompetence and bad structural incentives because politicians like
    to claim credit for creating new programs instead of just indexing the amount
    of a cash payment everybody gets to GDP per capita and then sending them all home."
