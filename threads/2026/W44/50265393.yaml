  text: Even daemontools (0.76-8.1 Debian) is 3771 lines of C, much more than 1000.  Sysvinit
    is much more code than daemontools; sysvinit 3.06 is 8407 lines of C and 3595
    lines of sh, according to David A. Wheeler&#x27;s &#x27;SLOCCount&#x27;.  systemd
