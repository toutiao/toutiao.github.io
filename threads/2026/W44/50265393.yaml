  text: We recently wrote about moving away from OVMF (~1M lines of C) to very minimal
    and hyperspecific firmware (300 lines of assembly)[1] for our specific confidential
    VM machine targets, and the idea that &quot;popular&quot; does not automatically
    mean &quot;secure&quot;. You can point an LLM at any large codebase and it will
    find vulnerabilities, so &quot;patch the planet&quot; isn&#x27;t very scalable.
