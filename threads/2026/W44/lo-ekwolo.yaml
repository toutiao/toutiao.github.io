  text: There is a whole community that have developed clients for Discord, Telegram
    for J2ME phones. I learned about it when I was introduced to the concept of dumbphones-Intentionally
    using older devices to stay away from the soul sucking nature of modern phones.
    I learned how to develop my own J2ME ports-I made a client for Proton Mail, a
    Gemini protocol web browser and a GUI library. Soon after, The phone I was developing
    on gave up and I don't have access to more devices to test on. The cool part about
    J2ME today is that these phones do not support TLS 2.0 and thus all internet connection
    is insecure. People have been working on workarounds and implementing TLS in pure
    Java but the last time I was involved there wasn't much progress. I'm sure things
    must have changed drastically now.
