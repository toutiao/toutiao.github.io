  author: invokestatic
  text: 1) I would argue that different trust stores are a carryover macOS’s Unix
    heritage. Having multiple roots of trust is actually very common. For instance
    Firefox maintains their own root of trust from the system, it’s called NSS. Different
    programming languages like Java and Rust also often use different roots. It’s
    not amazing, and has holes, but a lot of it comes down to historical reasons and
    a certain level of risk acceptance.<p>2) Yes, but actually, this is exactly why
    we have defense in depth. This is a temporary measure while a permanent patch
    is coming. Defense in depth means a single hole does not result in compromise.
    I would argue that this situation with Apple demonstrates defense in depth actually
    working as intended. If this was the permanent solution, and no further patch
    was coming from Apple, then yes, it would violate defense in depth.<p>3) Related
    to above, yes. But it’s not permanent.
  score: 0
  posted_at: '2026-10-28T15:07:50Z'
- id: '50275181'
  parent_id: '50274860'
  author: invokestatic
  text: 'So let’s take a step back and look at this threat model.<p>1) An attacker
    is MITMing your connection. This is already not easily exploitable by most threat
    actors short of being on a public Wi-Fi network, otherwise you are likely at the
    nation-state level attacker at this point.<p>2) An attacker knows exactly which
    Git repo you’re about to clone and has prepared a malicious version (noting they
    can’t snoop on your encrypted web traffic).<p>3) An attacker has developed a way
    to differentiate between Git over HTTPS and Safari, by using a side channel “fingerprinting”
    method that works with your exact versions of git and macOS.<p>4) You don’t pin
    the git clone to a particular hash or signature.<p>This is already a very low
    level of exploitability. All of these things need to be satisfied for the attack
    you’re describing to work.<p>Now let’s look at a more practical attack that exists
    regardless of if you have the patch from Apple.<p>1) A maintainer of an open source
    project you use has their GitHub account compromised due to credential stuffing
    and commits a malicious version.<p>2) You don’t pin the git clone to a particular
    hash or signature.<p>This attack is significantly more exploitable and has happened
    over and over again in supply chain attacks.<p>But look at the commonality: in
    both, no certificate pinning or signature checking was done. If you follow best
    practices, this stops both attacks dead cold.<p>This is the security engineering.
    It’s not just checking boxes. It’s evaluating risks.'
