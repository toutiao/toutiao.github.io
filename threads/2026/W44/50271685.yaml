  author: Polizeiposaune
  text: eMudhra generated multiple weak private keys and included their public counterpart
    in multiple intermediate certificates.  You need to check that all the intermediates
    are rejected.<p>See the lists in <a href="https:&#x2F;&#x2F;bugzilla.mozilla.org&#x2F;show_bug.cgi?id=2083449"
    rel="nofollow">https:&#x2F;&#x2F;bugzilla.mozilla.org&#x2F;show_bug.cgi?id=2083449</a>;
    I believe that &quot;dv-g3b-&quot; corresponds to the intermediate CA certificate
    listed as &quot;EM DV TLS CA - G3B&quot;<p>DV&#x2F;OV&#x2F;EV are &quot;Domain
    Validated&quot;, &quot;Organization Validated&quot; and &quot;Extended Validation&quot;
    which refer to different levels of checking that the CA should done before issuing
    a certificate with a particular name in it.
