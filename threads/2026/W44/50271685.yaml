  text: |-
    Wonderful AWK command there. For those with hobbies other than AWK, here&#x27;s what it does:<p><pre><code>  - set variable s to that string: -v s=&#x27;=== &#x2F;C=IN&#x2F;OU=emSign PKI&#x2F;O=eMudhra Technologies Limited&#x2F;CN=emSign ECC Root CA - G3&#x27;
      - on lines matching the regex between &#x2F;&#x2F;, set skip to false: &#x2F;^(===|###) &#x2F;{skip=0}
      - on lines matching s, set skip to true: $0==s{skip=1}
      - if skip is false, print the line: !skip
    </code></pre>
    Note the last part where it just says !skip without a curly braces. AWK defaults to print in that case.
