  content: "# C2PA's eMudhra Moment\n\n_By David Buchanan (aka retr0id), 29 October
    2026_\n\nThe [eMudhra incident](https://emudhra.we-have-a-problem.com/) has shown
    how the modern Web PKI ecosystem [reacts](https://bugzilla.mozilla.org/show_bug.cgi?id=2083449)
    to a CA compromise. All things considered, I think it went smoothly—all the web
    browsers I use picked up the revocations swiftly. But it has also been a clusterfuck,
    with eMudhra trying to downplay their responsibilities and refusing to elaborate
    on how exactly the failure occurred. There's also a long tail of TLS clients that
    don't have a great way to handle revocations, or are otherwise [not getting their
    trust stores updated](https://emudhra.we-have-a-problem.com/apple.html) in a timely
    manner.\n\nThe C2PA ecosystem tries to solve a very similar problem to Web PKI,
    but it is comparatively in its infancy. The media verification tools you'll find
    in search result top-spots today don't support revocation-checking at all.\n\nSo
    how would the C2PA ecosystem react to a similar compromise? Let's find out!\n\n|
    \n\n     1 2 3 4 5 6 7 8 9101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263646566676869\n\n
    | \n\n    openssl cms -verify -inform PEM \\-CAfile <(curl -fsSL \"https://pki.goog/c2pa/root-g3.crt\"
    |openssl x509 -inform DER) \\\\<\\< EOF-----BEGIN CMS----------END
    CMS-----EOF\n\n |\n\nThe above demonstrates a S/MIME encrypted message, with a
    signature that chains to Google's C2PA root CA, which is in the official [C2PA
    trust list](https://github.com/c2pa-org/conformance-public/blob/295f13bf4d8f483046f13a32a808a7ca3b1742f9/trust-list/C2PA-TRUST-LIST.pem#L101-L115).\n\nThe
    vulnerabilities I exploited to produce this chain are not eligible for bug bounty
    rewards, and are in fact already publicly known. But in the spirit of our little
    experiment I'm not going to elaborate.\n\n### [Erm, Actually ☝️\U0001F913](#erm-actually-)\n\nThe
    astute observer will note that my demo is \"not the same\" as the eMudhra compromise,
    because it's _merely_ a leaf cert that has a private key of 4, rather than a trusted
    intermediate.\n\nI can get Google's intermediate to sign any leaf key I like (via
    an undisclosed method), and that \"4\" key is just how I'm proving it.\n\nIn the
    context of TLS that's kinda how cert issuance works normally, but it completely
    breaks the C2PA [trust model](https://spec.c2pa.org/specifications/specifications/2.4/specs/C2PA_Specification.html#_trust_model)."
