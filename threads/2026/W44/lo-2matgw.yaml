  text: |-
    I guess there's several concepts to disentangle. There's C2PA as a metadata format (+ schemas, + associated semantics), C2PA as a digital signature file format, C2PA as a trust model and overall architecture, and concrete implementations thereof.
    As a metadata format I don't have any major objections, other than that it's very design-by-committee.
    As a digital signature format it has an unfortunate design flaw (discussed here https://www.da.vidbuchanan.co.uk/blog/hacking-time.html ), which could plausibly be mitigated by a spec revision but it's probably going to be more of a workaround rather than an elegant fix.
    As a trust model, in my opinion it's incompatible with reality, in the general case. For narrow use cases like "news outlet signs the files on their CDN as a provenance marker" it's workable, but for any kind of "regular joe's camera signs everything automatically by default and that signature is supposed to prove something useful", it just can't achieve that.
    And in terms of implementations... Google's is the worst, because they've not only tried to implement an incoherent trust model, they've tried to make it "private" at the same time, and they've failed on both fronts. I haven't elaborated on the privacy front yet but I hope to write about it more in the future.
    I think Apple is entirely justified in their not-C2PA implementation, because it lets them opt out of the broken trust model and associated design decisions.
    You can break Google's impl in a weekend with off-the-shelf n-day exploits, but breaking Apple's thing (on the cryptographic level at least) is going to involve novel hardware security research with a large budget. Apple is still vulnerable to the "analog hole", but that's all anyone can do.
