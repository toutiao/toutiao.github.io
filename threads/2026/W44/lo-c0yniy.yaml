  content: "# Stalwart v1.0: The Fastest Mail Server on the Planet\n \n \n \n \n \n\n
    \n  - 16 min read \n \n [![Mauro D.](/img/authors/mdecimus.png)\n \nMauro D.\n
    \nProject Maintainer\n \n ](https://github.com/mdecimus) \n\nFive years ago, on
    3 October 2021, the [first commit](https://github.com/stalwartlabs/mail-parser/commit/c5ed27bb12f6aa3e162827ebaad1e88ecb15abd8)
    landed in a small repository called mail-parser. It was an e-mail parsing library
    written in Rust, and nothing more. Over the following five years it grew into
    a complete mail and collaboration server with JMAP, IMAP, POP3, SMTP, CalDAV,
    CardDAV and WebDAV, a spam filter, clustering, and support for half a dozen storage
    backends. Today, after five years of continuous development, we are proud to announce
    [Stalwart v1.0](https://github.com/stalwartlabs/stalwart), the first stable release.\n\nVersion
    1.0 was never meant to be another feature release. It had two goals. The first
    was performance: making every part of the server as fast as it can be, and proving
    it with numbers. The second was stability of the data itself: finalising the database
    schema so that, from now on, upgrading Stalwart means installing a new version
    and nothing more, without the disruptive migrations some earlier releases required.
    Along the way a few new features found their way in too, including full-text search
    inside PDF and office documents.\n\nLet’s walk through it.\n\n## Months spent
    chasing every microsecond\n[Section titled “Months spent chasing every microsecond”](#months-spent-chasing-every-microsecond)\n\nMost
    of the work in this release happened under a profiler. For months we measured
    where Stalwart spends its CPU cycles, its memory and its database round trips,
    rewrote whatever stood out, and measured again. The release contains close to
    200 commits touching more than 1,300 files, and the vast majority of them exist
    to make something faster or lighter.\n\n### Parsers rewritten with SIMD and SWAR\n[Section
    titled “Parsers rewritten with SIMD and SWAR”](#parsers-rewritten-with-simd-and-swar)\n\nA
    mail server spends a surprising share of its time looking for specific bytes:
    the end of a header line, a MIME boundary, an equals sign in a quoted-printable
    body, the space that ends an IMAP tag. Done one byte at a time, that is a lot
    of loop iterations for a 10 MB message. Two techniques let a CPU do this work
    many bytes at a time:\n\n- **SIMD** (Single Instruction, Multiple Data) uses the
    wide vector registers of modern processors (SSE2, SSSE3 and AVX2 on x86-64, NEON
    on ARM) to compare or transform 16 or 32 bytes with a single instruction.\n- **SWAR**
    (SIMD Within A Register) applies the same idea with ordinary 64-bit integers:
    a few carefully chosen arithmetic and bitwise operations test all eight bytes
    of a word at once. It needs no special instructions, so it works on every CPU.\n\nStalwart
    now uses both, everywhere it matters. At the bottom of the stack sit two libraries
    that reach 1.0 together with the server:\n\n- **[mail-parser 1.0](https://github.com/stalwartlabs/mail-parser)**,
    the very library where Stalwart began, has been rewritten from scratch. SIMD kernels
    locate MIME boundaries and header fields, SWAR handles header names, the parsed
    message lives in a handful of flat vectors, and bodies are only decoded when someone
    actually reads them. The CPU-specific kernel is picked at runtime, and every one
    is fuzzed against a plain scalar reference. Against other parsers it is 3 times
    faster than the popular Rust `mailparse` crate, 9 times faster than Dovecot’s
    own parser, and 15 to 31 times faster than libEtPan!, VMime and GMime on a full
    parse.\n- **[encodify](https://github.com/stalwartlabs/encodify)** is a new encoding
    library with SIMD kernels for Base64, Base32 and quoted-printable, the encodings
    that carry nearly every attachment and non-ASCII header in e-mail. Decoding a
    MIME-wrapped Base64 attachment is 22 times faster than with the standard Rust
    `base64` crate on an AMD EPYC server, and quoted-printable decoding is 9 times
    faster than with the `quoted_printable` crate. It now handles every Base64, quoted-printable
    and IMAP UTF-7 conversion in the server.\n\nAbove them, the protocol layer got
    the same treatment. The IMAP command parser is now table-driven and scans whole
    runs of bytes instead of stepping a state machine per character. The SMTP command
    parser, the JSON parser behind JMAP, the spam filter tokenizers, the HTML-to-text
    converter, the variable-length integer codec and the log serializers all use SWAR
    scanning. Even the expression language, which administrators use for routing and
    filtering decisions, now compiles to a compact bytecode with specialised instructions
    for common comparisons and evaluates them in a recycled memory arena.\n\n### Fewer,
    faster trips to the database\n[Section titled “Fewer, faster trips to the database”](#fewer-faster-trips-to-the-database)\n\nFast
    parsing is wasted if every request then waits on the database, so we spent just
    as long on how Stalwart talks to its storage. Identifiers are now assigned inside
    the same write transaction that uses them, removing whole round trips from every
    message delivery. Read-modify-write updates, such as adding a keyword or appending
    to a search index, run as merge operations inside the backend. Stored objects
    are compressed with zstd using dictionaries trained specifically on e-mail, calendar
    and contact data.\n\nEach backend was also tuned individually:\n\n- **RocksDB:**
    every kind of data now lives in a column family configured for how it is accessed,
    with bloom filters for point lookups, large blocks for scans and compaction tuned
    for data that churns. Hot counters, such as queue quotas, are spread across up
    to 256 slots to avoid write conflicts.\n- **PostgreSQL and MySQL:** pre-generated
    and cached prepared statements, chunked iteration with automatic retry, and fewer
    round trips per write.\n- **FoundationDB:** reads that a transaction will need
    are prefetched in parallel windows, and large values are assembled in chunks.\n-
    **SQLite:** page size, cache, memory mapping and WAL settings tuned for a mail
    workload.\n\nOn top of the storage layer sits a redesigned cache subsystem. Each
    account’s message index is held in memory in a compact packed form, and IMAP sorting,
    threading, flag fetches, searches on message properties and resynchronisation
    are now answered from that cache with few or no database reads. Very large accounts
    get their own cache tier with a memory budget, and cache snapshots can be swapped
    out to local disk, Redis or the blob store instead of being rebuilt.\n\n### A
    new search engine\n[Section titled “A new search engine”](#a-new-search-engine)\n\nThe
    built-in full-text search engine was rewritten from the ground up. The previous
    design stored one bitmap per word and had no notion of word positions. The new
    engine stores postings in blocks of 65,536 documents and keeps word positions
    for every message. That makes real phrase searches possible, and lets a search
    inside one mailbox read only the blocks that mailbox touches. It indexes word
    stems and prefixes, compresses its data with zstd, and indexes new mail through
    a background queue with concurrency control, retries and rebuilds. The PostgreSQL
    and MySQL search backends were reworked as well. On a mailbox of 250,000 messages,
    a full-text search of every message body now returns in under 4 milliseconds.\n\n##
    Stress tested on hundreds of vCPUs\n[Section titled “Stress tested on hundreds
    of vCPUs”](#stress-tested-on-hundreds-of-vcpus)\n\nOptimising code without measuring
    it under realistic load is guesswork, so we built a dedicated benchmarking and
    stress-testing lab to go with this release. It runs on Microsoft Azure, across
    more than 30 regions, with up to 18 complete test labs running in parallel and
    several hundred vCPUs busy at once.\n\nThe test catalogue covers 35 kinds of test,
    spread over more than 550 individual test cells, and they cover:\n\n- Every major
    protocol: IMAP, JMAP (including push over EventSource and WebSoc"
