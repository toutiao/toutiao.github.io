  author: PaulDavisThe1st
  text: Not quite right.<p>The 1000 degree air is not used directly to drive turbines,
    but instead to deliver heat to a heat storage unit via a heat exchanger. The solar-heated
    air, after flowing through the heat exchanger, is still around 250 degrees and
    the article mentions some possible uses of that heated air (again, not generation).<p>Generation
    occurs using heat coming from the heat storage unit, not using the solar-heated
    hot air. Since the heat storage unit can also be fed by hot air heated via other
    means, this makes the heat storage unit &quot;source neutral&quot; - it can be
    heated by solar or fossil fuel combustion (or whatever).<p>The turbines are &quot;downstream&quot;
    of the heat storage unit.
