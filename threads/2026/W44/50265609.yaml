  author: klustregrif
  text: "There&#x27;s some subleties lost in the &quot;just filing paperwork&quot;
    the regulatory filing reports are big content heavy documents, that need to be
    generated. But it&#x27;s not just a job consisting of pasting in lorum ipsum.
    A lot of intelligence goes into creating those documents, which is why it hasn&#x27;t
    been revolutionised by digital templating systems. But there is the very real
    potential for speeding up the process through AI document editing and reviews
    to turn 2 weeks of people sequentially doing edits, passing for review back and
    forth before being able to submit, to perhaps just getting everyone in a room
    for 2 hours and pointing out everything that needs changing and changing it on
    the spot. But even then you&#x27;ll still sometimes have the hook back to the
    slower processes of having to generate new evidence or find and review evidence
    that wasn&#x27;t included. \nBut even a 25% increase in speed will have quite
    significant impact, so it&#x27;s not like it has to become a turn key submissions
    solution to be valuable."
