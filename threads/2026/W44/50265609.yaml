  title: Early progress on accelerating drug development with Claude \ Anthropic
  fetch_status: success
  content: "### \n\n_Anthropic’s [life sciences team](https://www.anthropic.com/science)
    is working to accelerate curing disease. Over the past several months, our scientists
    have engaged in deep research partnerships with six organizations developing new
    medicines: [BigHat Biosciences](https://www.bighatbio.com/), [Bristol Myers Squibb](https://www.bms.com/),
    [Divergence Labs](https://divergencelabs.com/), [Enveda](https://enveda.com/),
    [Generate Biomedicines](https://generatebiomedicines.com/), and [The Column Group](https://www.thecolumngroup.com/).
    We've also begun drug discovery efforts of our own. In doing so, we've learned
    a lot about how Claude can support drug development, and how we’ll need to improve
    Claude further to realize AI's potential in medicine. We plan to scale this work
    up substantially from here_.\n\nThere are many opportunities to speed up drug
    development, even beyond the most commonly discussed applications of AI, like
    [proposing initial designs](https://www.anthropic.com/research/Claude-accelerates-protein-design)
    for new molecules. Developing a drug involves many varied tasks: doing early research
    to identify a target for a drug and the right type of drug to engage it, designing
    a molecule with the right properties, optimizing it to be manufactured reliably
    at scale, drafting the regulatory filings needed to run clinical trials, designing
    and administering those trials, and much more.\n\nOur strategy to realize AI’s
    medical benefits is based on having AI increasingly involved in all of these tasks.
    There is no single problem to solve; the bottlenecks are distributed all throughout
    the drug development process. The best way to identify and work through these
    bottlenecks is to get deeply involved in real drug programs, across many different
    disease areas and stages of development.\n\nSo, over the past several months,
    we’ve partnered with six organizations to do so. We’ve also started drug discovery
    efforts of our own, including programs for rare childhood forms of muscular dystrophy,
    where Claude handles much of the scientific and operational work.\n\nThis work
    serves our goals in three ways. First, it lets us better understand the strengths
    and limitations of our models in relation to a much wider range of drug development
    tasks (we’ve already prioritized specific improvements to our models based on
    what we’ve learned so far). Second, these programs can serve as case studies for
    the wider life sciences community. If Claude is to significantly increase the
    rate of new cures, we need to work with many more biotechnology firms and integrate
    Claude more deeply into their development processes. Third, these projects should,
    if their positive trajectories continue, have direct impact themselves. We’re
    optimistic that some may result in effective new medicines for the diseases they
    target, including food allergies, rare childhood diseases, and several forms of
    cancer.\n\nIn this post, we provide an update on our progress with our partners,
    along with technical reports and preprints that describe our thought process,
    methods, and early results in more detail. We then briefly outline where our work
    is headed next.\n\n## Case studies\n\n**Generate Biomedicines: modality engineering.**
    Generate Biomedicines has been working on increasing the usefulness of a cancer
    treatment known as CAR T-cell therapy. This therapy has historically helped treat
    blood cell cancers; Generate aims to reengineer it so that it can treat solid
    tumor cancers too. To do this, they’re aiming to shorten one part of the therapy’s
    genetic instructions, which would create room for additional instructions suited
    to other kinds of cancer. Six Generate scientists used Claude Code to propose
    new designs for this part. One design was about 70% shorter than the standard
    version, and in lab tests it was more effective: it allowed immune cells to make
    roughly 10 times as many receptors (the proteins they use to spot cancer cells),
    it killed tumor cells more efficiently, and the immune cells remained active for
    longer. Read more, and see [Generate’s technical report](https://generatebiomedicines.com/publications/refactored-intracellular-domains-enhance-car-expression-and-function/).\n\n**Divergence
    Labs: hit generation.** Divergence Labs is working on a novel way to treat food
    allergies. Food allergies are set off by a reaction from a molecule called IgE,
    some of which is attached to our immune cells and some of which floats freely
    in our blood. Divergence Labs is developing drugs that would detach the IgE from
    our immune cells entirely, rather than solely neutralizing the IgE circulating
    in our blood, as standard medications do. This could provide a much more effective
    treatment, but it requires a precise design, with two “arms”: one that would bind
    tightly to IgE, and another that would help prise IgE from the immune cell. Claude
    converted Divergence Labs’ goals into a detailed design plan, and then, largely
    autonomously, generated roughly 35,000 antibody designs in about a month to be
    narrowed down and tested. In those early tests, Divergence found “hits” for both
    arms: three designs that could bind to IgE, and 20 that could dislodge it. Three
    of those 20 appeared to dislodge IgE more than the standard medication. Its next
    step is to build a drug that combines the two arms. Read more, and see [Divergence’s
    technical report](https://divergencelabs.com/publications/ige-preprint.pdf).\n\n**BigHat
    Biosciences: lead optimization.** BigHat Biosciences pairs AI with an automated
    lab to improve potential drugs (or “leads”), which must bind their target tightly,
    remain stable through manufacturing and storage, and avoid clumping together (among
    other criteria). BigHat’s scientists and an Anthropic researcher worked with Claude
    to improve these three properties in two leads, both antibody fragments that could
    become parts of future drugs: one designed to target cancer cells, and one designed
    to keep a drug in the body longer. Claude, connected to BigHat’s lab data system,
    Reccy, proposed changes to each molecule, and BigHat’s lab made and tested about
    1,010 variants in about 10 weeks. Partway through, the team suspected the standard
    heat-stability and clumping metrics were misleading. Claude and the researcher
    reanalyzed the raw data, then proposed different metrics and a protocol change
    to test them. BigHat’s scientists refined and ran it, and the main predictions
    held. Compared with the originals, the best versions bound more than 10x more
    tightly, the cancer-targeting lead stayed in solution 18°C higher, and the lead
    for longer-lasting drugs clumped more than 100x more slowly. Read more, and see
    [BigHat’s technical report](https://www.bighatbio.com/bighat-anthropic-collaboration-report-10-27-2026).\n\n**Enveda:
    manufacturing and filings.** To conduct clinical trials, companies need records
    showing that each batch of a new drug has been made to strict quality standards,
    and to submit an application to regulators, among other requirements. At Enveda,
    manufacturing chemists spent up to 75% of their time on paperwork. To ease the
    load, Enveda built a system that connects all of its manufacturing documents to
    Claude, then lets Claude flag any possible issues. Over tests on 1,061 pages of
    documentation, Claude caught all 11 issues that human reviewers had spotted—and
    flagged seven they’d missed. In the process, this method reduced human review
    time by 89%, from over 25 hours to less than three. Separately, Claude wrote the
    first drafts of two important regulatory documents. One took four hours, compared
    to about three months by hand. For the other, Enveda’s standard human review process
    found one minor error. Read more, and see [Enveda’s technical report](https://enveda.com/CMC-Document-Processor/).\n\n**The
    Column Group (TCG): company creation.** Because drug discovery can be slow, expensive,
    and prone to failure, investors in biotechnology companies have favored safer,
    previously validated ideas over riskier new on"
