  text: |-
    If you hold a PC’s power button for 12 seconds, it will turn off at the hardware level without notifying the operating system. […] After eight seconds of the power button being held down, the Windows kernel realizes that the user is trying to do a force-power-off of the system, […]

    What? 12 seconds? That’s just wrong. I’ve seen it done with plenty of computers (desktops and laptops spanning decades of vintage), and I’d have said 5–6 seconds, and definitely not more than 8. Historically, written guidance I remember was consistently to hold for ten seconds (then it used to be said to leave it for ten seconds before turning it on again, but that doesn’t get said much any more).
    https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/forcing-a-system-crash-with-the-power-button indicates this LPBH bugcheck needs to be enabled in the registry, and says it triggers at 7 seconds and that reset is “usually about 10 seconds”, though “on some systems such as ARM64 laptops, the firmware timer is shorter”.
