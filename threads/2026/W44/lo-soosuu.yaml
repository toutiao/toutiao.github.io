    by :\n\nNewest\n\n[Newest](javascript:void(0))[Popular](javascript:void(0))[Oldest](javascript:void(0))\n\n-
    \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyAQMAAACQ++z9AAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAD0lEQVQokWNgGAWjYGgCAAK8AAGBAoNpAAAAAElFTkSuQmCC)\n\nI
    had a similar experience when I was a developer on Windows PageMaker.\n\nI had
    given a copy to a relative who was trying it out to write some report for work.
    There was a hot key command for some simple operation like Goto Next Page. Every
    time he used it all his text would be deleted, I was puzzling over it until I
    happened to select a region on the page and there was the text in highlight mode.\n\nThe
    kids had been playing with the PC and somehow had remapped the hot key to change
    the text color scheme....\n\n[Read more](javascript:void(0))\n\nI had a similar
    experience when I was a developer on Windows PageMaker.\n\nI had given a copy
    to a relative who was trying it out to write some report for work. There was a
    hot key command for some simple operation like Goto Next Page. Every time he used
    it all his text would be deleted, I was puzzling over it until I happened to select
    a region on the page and there was the text in highlight mode.\n\nThe kids had
    been playing with the PC and somehow had remapped the hot key to change the text
    color scheme. To white on white.\n\n[Read less](javascript:void(0))\n\n- \n\n
    ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyAQMAAACQ++z9AAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAD0lEQVQokWNgGAWjYGgCAAK8AAGBAoNpAAAAAElFTkSuQmCC)\n\nI
    once used an app that reduced screen brightness by overlaying a semi-transparent
    layer on the screen. If the transparency was set to 0%, the screen would go completely
    black.\n\n- \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAoAQMAAAC2MCouAAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAADElEQVQImWNgGFkAAADwAAFTiaRLAAAAAElFTkSuQmCC)\n\nWas
    the customer’s name _Desiato_ by any chance? \U0001F601\n\n“It’s the wild colour
    scheme that freaks me. Every time you try to operate on of these weird black controls
    that are labelled in black on a black background, a little black light lights
    up black to let you know you’ve done it.”\n\n- \n\n ![](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyAQMAAACQ++z9AAAAA1BMVEXW1taWrGEgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAD0lEQVQokWNgGAWjYGgCAAK8AAGBAoNpAAAAAElFTkSuQmCC)\n\n12
    seconds? Every (desktop) PC I’ve encountered shuts down after holding down the
    power button for 5 seconds, so if Windows is waiting 8 seconds to do a dump, it
    won’t do anything.\n\n## Read next\n\nOctober 30, 2026\n\n### [The Microsoft building
