  author: b_llc
  text: Cloudflare R2 bills on writes ($4.50&#x2F;M), reads ($0.36&#x2F;M), and storage
    ($0.015&#x2F;GB&#x2F;mo). The free tier gives you 1M writes, 10M reads, and 10GB
    per month. If you batch uploads hourly, you only make ~720 writes a month. That
    completely eliminates write costs, leaving storage as the only expense.
