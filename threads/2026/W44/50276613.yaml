  text: I think this is a clever happy path solution, but it isn&#x27;t very defensive
    against problems. If the cloud cron doesn&#x27;t fire on time or the consumer
    fails then the queue won&#x27;t be drained in time. That will cause the events
    to be batched in the wrong hour.<p>I don&#x27;t see how you are building the batches,
    but there&#x27;s a lot of complexity around batch sizes, acknowledging that the
    messages were consumed, etc. Having a single dataset.json.gz per hour feels like
    a hint this isn&#x27;t done safely. I&#x27;d double check that carefully to avoid
    losing data.<p>One tip about compression, I&#x27;ve been really pleased with zstd
    compression of json&#x2F;jsonl data.
