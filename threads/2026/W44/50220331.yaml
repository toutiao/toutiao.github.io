  url: https://hallofdreams.org/posts/physicsforums/
  title: PhysicsForums and the Dead Internet Theory | Hall of Impossible Dreams
  fetch_status: success
  content: "# PhysicsForums and the Dead Internet Theory\n\n Posted Jan 24, 2025 _2025-01-24T08:00:00-05:00_
    by David and Felipe \n\nAn exposé no one will read, about the widespread falsification
    of user posts in PhysicsForums, a scientific community founded in 2001. This is
    a microcosm of the death of the human-written Internet.\n\n# What Internet Will
    Look Like in the Future\n\n> cripes does anybody remember Google People\n> \n>
    – qntm, [August 21st, 2019](https://qntm.org/perso)\n\nDoes anybody remember [PhysicsForums](https://www.physicsforums.com/)?\n\nIt
    was never exactly the center of the Internet, but back when it was founded in
    2001, the Internet didn’t really _have_ a center the way it does today. PhysicsForums
    was one forum among thousands, founded by an enthusiastic teenager named Greg
    Bernhardt, existing in the ‘hard science’ niche alongside the likes of [Bad Astronomy](https://web.archive.org/web/20050105042334/http://www.badastronomy.com/phpBB/index.php),
    mostly focused on giving hints for physics homework to struggling students without
    outright _doing_ the physics homework. It had fairly steady growth until 2012,
    before petering out throughout the 2010s and 2020s in lieu of more centralized
    sites like StackExchange, and by 2025, only a small community was left. But, unlike
    so many other fora from back in the early days, it went from 2003 to 2025 without
    ever changing its URLs, erasing its old posts, or going down altogether. Thanks
    to this consistency, PhysicsForums remains quite valuable as a time capsule, and
    can give us a glimpse at how people thought and what they said two decades ago.\n\nFor
    instance, we we might go to [this 2007 post](https://web.archive.org/web/20250124194339/https://www.physicsforums.com/threads/spreadsheet-for-hp-50g-import-export-excel-calc.199904/)
    asking about the capabilities of the now-obsolete [HP 50g Graphing Calculator](https://commerce.hpcalc.org/50g.php),
    and read a very helpful reply by commenter ravenprp:\n\n![user ravenprp claims
    to be a large language model in a forum post dated 2007](data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7%20
    \"user ravenprp claims to be a large language model in a forum post dated 2007\")\n\nSomething
    has gone terribly wrong.\n\n# Quoth the Raven?\n\n> I reset my pw and logged back
    in to Google People for the first time in 10 (?) years just now and discovered
    the following:\n> \n> 1. 10 years of updates on my account, written by me\n> \n>
    – qntm, [September 7th, 2019](https://qntm.org/perso)\n\nAt first glance, ravenprp
    is a very impressive user, writing 2,891 posts in a mere seven-month span (from
    September 2006 to April 2007) for average of more than thirteen posts per day.
    And most of these weren’t casual one-line answers: reading his profile, one comes
    away realizing that he’s a true [omnidisciplinary scientist](https://tvtropes.org/pmwiki/pmwiki.php/Main/OmnidisciplinaryScientist),
    if not a modern-day Renaissance Man. He’s a [member of a university faculty](https://web.archive.org/web/20250124194320/https://www.physicsforums.com/threads/instructional-robot-design-project.112146/#post-6998564),
    a [mechanical engineering student](https://web.archive.org/web/20250124194316/https://www.physicsforums.com/threads/how-do-you-measure-vibration-decay-in-damped-drumsticks.209340/#post-6999271),
    and a [hiring manager at a chemical plant](https://web.archive.org/web/20250124194425/https://www.physicsforums.com/threads/what-are-the-essential-job-roles-in-a-basic-chemical-plant.164542/#post-6998735)
    (presumably in [Canada](https://web.archive.org/web/20250124194401/https://www.physicsforums.com/threads/chem-eng-hot-career-option-for-canada.180877/#post-6998683));
    he’s an expert in [working with .VOB and audio files](https://web.archive.org/web/20250124194358/https://www.physicsforums.com/threads/looking-for-an-expert-with-vob-and-audio-files.134862/#post-6996856)
    and [fasteners](https://web.archive.org/web/20250124194241/https://www.physicsforums.com/threads/what-are-the-differences-between-bolts-screws-and-hi-lok-fasteners.154763/#post-6999349);
    he’s a [structural engineer](https://web.archive.org/web/20250124194325/https://www.physicsforums.com/threads/solving-multiple-couples-in-structural-engineering-analysis.188652/#post-6999291),
    [biologist](https://web.archive.org/web/20250124194617/https://www.physicsforums.com/threads/take-your-side-dawkins-vs-dyson-debate.185437/#post-6998019),
    [medical physicist](https://web.archive.org/web/20250124194254/https://www.physicsforums.com/threads/topical-webpage-title-what-are-the-best-freeware-options-for-medical-physics.198806/#post-6996805),
    [chemist](https://web.archive.org/web/20250124194419/https://www.physicsforums.com/threads/optimize-your-sports-drink-with-advanced-chemist-suggestions-lemonade-flavor.130493/#post-6997583),
    and [aerospace engineer](https://web.archive.org/web/20250124194321/https://www.physicsforums.com/threads/air-frame-life-extension-f-15-problem.209836/#post-6999274).
    And to top it all off, he’s modest, and won’t claim expertise he doesn’t have:
    he’s an aerospace and aeronautical engineer, but [not an expert in aerodynamics](https://web.archive.org/web/20250124194421/https://www.physicsforums.com/threads/an-aerodynamic-simulation-using-panel-method.197033/#post-6999260),
    nor a [mechanical engineer](https://web.archive.org/web/20250124194510/https://www.physicsforums.com/threads/how-can-i-calculate-the-failure-load-for-a-cantilevered-hoist-assembly.177574/#post-6999314),
    nor an [expert in electrical models](https://web.archive.org/web/20250124194335/https://www.physicsforums.com/threads/equivalent-electrical-model-for-spring-damper-circuit-seeking-advice.161781/#post-6998922).\n\nImpressively,
    these posts span from three years before the account was created to a year after
    the account was last logged into. And, as the icing on the cake, ravenprp is prescient
    enough that he can joke about being a language model developed by OpenAI, seven
    years before OpenAI was even founded; evidently he should have joined PsychicsForums
    instead.\n\n![user Ravenprp's many storied careers as a screenshot](data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7%20
    \"user Ravenprp's many storied careers as a screenshot\")\n\nA reasonable question,
    reading these posts, is: what’s the deal with the joined and login dates? If this
    is an entirely fabricated account, then why not just set the account creation
    date to be earlier than the first post, and the account access date to be later
    than the last post? The Wayback Machine gives us an answer: while the account
    currently lists 2,891 posts, an [archive from 2019](https://web.archive.org/web/20190226113743/https://www.physicsforums.com/members/ravenprp.56793/)
    lists 74. Sometime since 2019, these posts were inserted into the database directly,
    without updating the profile at all.\n\nAnd looking at only these 74 posts present
    in the original Wayback Machine list shows us a very different ravenprp: he was
    an electrical engineering student asking for simple advice on [MATLAB books](https://web.archive.org/web/20250124194458/https://www.physicsforums.com/threads/matlab-question-book-software-tools.141015/),
    working through [integrated circuit problems](https://web.archive.org/web/20250124194331/https://www.physicsforums.com/threads/using-555-timer-ic-to-output-100-khz-frequency.141013/#post-1144566),
    giving other commenters useful links on [the Bernoulli Equation](https://web.archive.org/web/20250124194447/https://www.physicsforums.com/threads/find-the-flow-rate-water-pipe-down-a-hill.131786/#post-1082624),
    and seeking information from knowledgeable experts, [such as computer professional
    ravenprp](https://web.archive.org/web/20250124194603/https://www.physicsforums.com/threads/is-a-microprocessor-the-same-as-a-microcontroller.152622/).\n\n![user
    Ravenprp asks himself for advice](data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7%20
    \"user Ravenprp asks himself f"
