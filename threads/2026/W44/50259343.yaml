    disclosed to us exploits that work against a variety of targets and we continue
    to experiment internally. Videos demonstrating our successful exploitations are
    available at[php2shell.com](http://php2shell.com).\n\nThis post summarizes what
    we have observed in terms of remediation efforts and exploitation attempts across
    real world environments and in our own honeypot data to date and shares findings
    from our ongoing investigation into these activities.\n\nWe will continue monitoring
    developments and update this post as new evidence emerges.\n\n## \n\n**Observed
    exposure trends**\n\nFollowing PHP2Shell’s public disclosure on October 21, 2026,
    Wiz telemetry has recorded an approximate 67% decrease in the daily number of
    distinct Internet-exposed machines vulnerable to PHP2Shell over the past few days.
    Separately, among vulnerable Internet-exposed machines, the proportion running
    PHP version 7.3 or earlier fell from 8.3% to 5.7% over a period of five days.
    This measures the share of the observed population running older versions that
    did not receive official backports.\n\nDuring this period, the number of significantly
    affected organizations - defined here as those with at least one exposed and vulnerable
    instance - fell by approximately 47.9% (see graph below). For reference, our data
    shows that PHP itself is in use by 65% of organizations in our dataset.\n\nTogether,
    these observations are consistent with organizations collectively reducing their
    exposure through a combination of patching, upgrading, retiring affected machines
    and restricting internet access (note that this data shows the overall trend,
    but does not establish the relative contribution of each remediation strategy;
    scan coverage and size of observed population can also affect the overall reported
    numbers over time).\n\n![](data:image/jpeg;base64,)\n\n_One
    week after public disclosure, less than 53% of initially affected organizations
    remain vulnerable to PHP2Shell._\n\n## \n\n**Exploitation attempts observed by
    Wiz research**\n\nWe have so far observed the following types of activities in
    this context:\n\n1. **Attempts using the PHP2Shell exploit mechanism,** with techniques
    matching those of public PoCs **.**\n\n2. **PHP2Shell-branded tools unrelated
    to the vulnerabilities** that instead relied on session poisoning and a separate
    local file inclusion (LFI) vulnerability in the application.\n\n### \n\nAttempts
    using the PHP2Shell exploit mechanism\n\nWe observed two variants of an open source
    [exploit kit](https://github.com/9bie/php2shell-bypass-aslr-exp) targeting PHP-based
    software. Neither completed the exploit chain in the attempts we captured. The
    older variant encountered request-size limits or failed to produce the expected
    memory-exhaustion condition. The newer variant did consistently exhaust PHP’s
    memory, but failed to obtain the memory addresses needed to continue.\n\n####
    Variant 1: the legacy chain\n\nThe first request to our PHP-CGI honeypot came
    from `3.37.227[.]134`. It matched the kit’s older chain, found under [archive/legacy-8m/exploit.py](https://github.com/9bie/php2shell-bypass-aslr-exp/blob/main/exploit.py)
    and its accompanying stage scripts. The first full exploit stage used a multipart
    body containing 1,005 parts, including a field named big filled with approximately
