    of 12655437 bytes exceeds the limit of 8388608 bytes\n\nThe author has since moved
    this chain into the kit’s archive directory.&nbsp;\n\n#### **A later attempt against
    Roundcube**\n\nIn a later attempt, `103.151.172[.]95` sent a longer sequence from
