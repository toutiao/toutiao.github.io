  text: Php is still under active development, and has seen a lot of architectural
    changes at the language level over the last decade that have seen real benefits.<p>Now,
    imho, it still isn&#x27;t a good language, but I wouldn&#x27;t call it &quot;old&quot;.
    It&#x27;s not COBOL or FORTRAN where the people who wrote a lot of the mission-critical
    stuff that banks, research labs, hospitals, and government rely on died 20+ years
    ago.<p>A lot of it not receiving investment doesn&#x27;t come at the language
    project level, but the individual project level. Accounting likes to pretend that
    the maintenance portion of the SDLC doesn&#x27;t exist past a certain point because
    &quot;what about the shareholders!?&quot; and there are, to date, very few incentives
    for them to look at the problem in any other way. Let&#x27;s say you run a Php
    application that&#x27;s got Php2Shell vulns and you want to patch it but the only
    way to do that is to shift major versions, meaning a rewrite of some or all of
    the code. The code &quot;works fine&quot; according to the bean counters, and
    there&#x27;s nothing saying they&#x27;ll get fined or jailed if a breach occurs
    as a result, so your project doesn&#x27;t get funded.
