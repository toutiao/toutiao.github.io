  author: idoubtit
  text: "As far as I know, there has been no proven vulnerability on a modern PHP
    (production) stack. The &quot;Steal  my Bitcoin&quot; challenge was a toy project.
    The &quot;lab&quot; target used the embedded PHP server (`php -S`) which is for
    development only.<p>&gt; Warning. This web server is designed to aid application
    development. [...] It should not be used on a public network.\n <a href=\"https:&#x2F;&#x2F;www.php.net&#x2F;manual&#x2F;en&#x2F;features.commandline.webserver.php\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.php.net&#x2F;manual&#x2F;en&#x2F;features.commandline.webserver...</a><p>There
    are 3 main PHP interfaces (SAPI):<p>1. mod_php which is obsolete and requires
    Apache prefork (which should also be avoided)<p>2. php-fpm (FastCGI) which has
    been the default for more than a decade.<p>3. FrankenPHP is a new official interface
    much more suitable for containers.<p>There were 2 vulnerabilities.:<p>1. &quot;OOM
    corruption&quot;.\n The advisory says there was a proven exploit with mod_php,
    but only for that obsolete SAPI. &quot;Source analysis therefore supports FPM
    as a susceptible, though *no complete FPM exploit* has been demonstrated for this
    SAPI.&quot;<p>2. &quot;stale global state&quot;.\n The advisory is \n The last
    PHP release (8.5) was vulnerable when the debug parameter fatal_error_backtraces
    was on. There was a suspicion that an exploit could exist in the session code
    for php-fpm, but it was unproven and probably unrealistic.<p>The &quot;evidence&quot;
    given at the end of the article seems old news to me. The honeypot was based on
    Apache-prefork + mod_php. As stated in the CVE, there is a proven exploit for
    that (obsolete) stack."
