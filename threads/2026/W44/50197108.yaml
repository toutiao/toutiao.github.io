article:
  url: https://charliegerard.dev/blog/overgrown-extension/
  title: Overgrown, when plants invade your abandoned tabs | Charlie Gerard | Senior
    research engineer & Creative Technologist Charlie Gerard | Senior research engineer
    & Creative Technologist
  fetch_status: success
  content: "# Overgrown, when plants invade your abandoned tabs\n\nI was doing a little
    creative exercise the other day around the word \"Overgrowth\". The first thing
    that came to mind was an apocalyptic scene, something like The Walking Dead or
    The Last of Us, where plants tend to overgrow abandoned buildings.\n\nI then wanted
    to apply this idea to the digital world, and the word \"abandoned\" made me think
    of my browser tabs... What if my tabs were slowly taken over by plants the longer
    I left them unread? What if I had to clear away these invasive plants to access
    my tabs again? A bit like trying to open a door that's been overgrown...\n\nSo
    I built this fun little Chrome extension that does just that. It won't necessarily
    make me read my tabs more but it's ok.\n\n## Demo\n\nLink to the repository\n\n##
    The idea\n\n- Every tab has a neglect clock. It runs while the tab is out of view
    and stops while you're looking at it.\n\n- The longer a tab is neglected, the
    more plants grow over it, from the edges towards the middle.\n\n- Once a tab is
    more than 5% overgrown, the page behind the vines is walled off: you can scroll,
    but you can't click, select or drag anything.\n\n- To free it, you have to slash
    through the vines by dragging your mouse across them. Get it down to 5% and the
    last bits fall off. If you abandon your tab once more, the jungle starts growing
    again.\n\n- Just for fun, you can pick your weapon of choice between the rusty
    machete, the chainsaw and the flamethrower.\n\n- You can also change how long
    it takes for your tabs to be fully overgrown.\n\nOriginally, I was thinking about
    blocking users from closing their overgrown tabs until they slash all plants,
    but I thought it would be too annoying... \U0001F605\n\n## The extension\n\nThe
    code is organised in 3 main parts: the background logic, the content script to
    display the plants and animation on the tabs and the popup folder that handles
    the UI of the extension itself.\n\n### Background worker\n\nThe background.js
    file starts the jungle on each open tab and forgets it when it closes.\n\n###
    The popup\n\nThis folder handles the UI for the extension with some small components
    for the time setting, the weapon choice, the list of tabs and their current stat.\n\n###
    The overlay\n\nThe content folder contains the SVGs for the plants and the weapons,
    the logic to position and grow the clusters, the neglect clock and the sounds.\n\nI've
    been wanting to get back into building things for a while now and this project
    felt like a small, fun way to start. I'm writing this on a new computer so I currently
    \"only\" have 22 tabs open but 14 of them are already completely overgrown...
    \U0001F602 It might not make me read them more but slashing through the vines
    makes coming back to them more fun! \U0001FA9A\U0001F33F"
