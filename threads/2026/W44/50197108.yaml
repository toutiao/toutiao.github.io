  text: I&#x27;m one of those people.<p>I have serious ADHD and I often dive a rabbit
    hole for an idea for side project. Or research. Or combination of both. Most of
    my side projects you could categorize as spikes. There&#x27;s no serious intent
    on delivering something of value for the world, just going from A to B and learning
    a thing or two on the run.<p>I&#x27;m like kerosene, I light up instantly, but
    the fire goes away very quickly. I can be researching a thing for 3 nights straight
    in my spare time to gather hooks and pieces of information... and then I get distracted
    and my focus goes somewhere else. And I&#x27;m left with 10 tabs that were suppose
    to kick start my idea.<p>To my own surprise I tend to go back to these ideas,
    but sometimes it takes me months, and sometimes, I keep these tabs on one of my
    devices, opened for months at a time. Sometimes I scrape them, adding links with
    notes to Obsidian.<p>Of course the amount of hoarded information vastly exceeds
