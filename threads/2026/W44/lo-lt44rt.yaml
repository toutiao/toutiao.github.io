  text: |-
    You are the one who has thrown away years of work, years of manual labour by loads of people, by turning it into slop

    Those years of work haven’t been thrown away. I’m using Ghostty today. I love it. I’ve never looked at the source code for it because I’ve honestly never encountered a bug as far as I know. It’s obviously, as a user, software developed thoughtfully by thoughtful people whose work I appreciate.
    When you reject the work that someone has done, it’s nothing more than that: you’re deciding that that work is not something you want to be involved with. It says absolutely nothing about the work that those people have done other than “I don’t like it”. It continues to bring value and joy to those who do like it.
    For me, I wholesale reject the notion that the use of LLMs anywhere in a development process instantly and irrevocably earns it the label “slop”. I’ve worked with slop; I spent a decade doing project-technical-rescue consulting and have seen the kinds of slop humans are able to create all on their own. I’ve seen humans using LLMs generate slop, and I’ve seen humans use LLMs to create and modify elegant code that continues to remain elegant. I’ve seen humans use LLMs to solve subtle rare bugs that have existed for years and having fixed them have objectively made the software better; that assumes you accept the notion that an RTOS that doesn’t randomly hang is superior to one that does, all else code-wise being literally equal (it was a 2 line fix).
    You have your own aesthetic tastes and we’re all welcome to that. Own it. But don’t fool yourself into believing that some piece of code not aligning with your aesthetic tastes means that it’s worthless and a reflection of the value of that code to others, nor that the people involved are somehow failing morally (“if you don’t respect yourself…”).
