article:
  url: https://blogs.kde.org/2026/11/01/introducing-kwi/
  title: Introducing Kwi, a new KDE terminal emulator - KDE Blogs
  fetch_status: success
  content: "# Introducing Kwi, a new KDE terminal emulator\n\nSunday, 1 November 2026
     | [Eike Hein](https://blogs.kde.org/authors/eike-hein)\n\n[#kde-apps](https://blogs.kde.org/categories/kde-apps/)&nbsp;\n\nI've
    started work on a new KDE application. It's called **Kwi** (pronounced _kwee_).\n\n**Kwi**
    is designed to provide users of KDE Plasma and other free desktops with a modern
    and fast terminal, built on a robust tech stack and following the latest KDE HIG
    and UI conventions.\n\nHere's a screenshot:\n\n[\n![A basic screenshot of Kwi](https://eikehein.com/kde/kwi_screenshot_2026-11_01.png)\n](https://eikehein.com/kde/kwi_screenshot_2026-11_01.png)\n\nIn
    some sense, the product vision for **Kwi** is to be kind of unexciting: Just what
    you want and expect out of a KDE Plasma terminal. Of course, given the powerful
    nature users generally expect from KDE software, this does not make the project
    lacking in ambition. :-)\n\nTo achieve things, **Kwi** builds on **libghostty-vt**
    from the excellent [Ghostty](https://ghostty.org/) project and familiar, mature
    KDE Frameworks such as [KPty](https://api.kde.org/kpty-index.html). It has a very
    speedy GPU-accelerated (Vulkan or OpenGL) renderer powered by the Qt Scene Graph.
    Its user interface is built with the latest and greatest by [Kirigami](https://develop.kde.org/frameworks/kirigami/),
    making it blend in very well among more recent KDE applications and the Plasma
    desktop.\n\nIn keeping with the theme, **Kwi's** icon/logo is a cute little terminal
    ghost. This is also how it came to bear its name: _kwisin_, or more typically
    _gwisin_, is a romanized form of _귀신_ - Korean for ghost. It's pronounced a little
    bit like _kwee-shin_.\n\n### Things Kwi has to offer\n\nCompared to the venerable
    and mature **Konsole** , Kwi is young and new. At the moment it offers a more
    streamlined feature set than Konsole, carefully realized using KDE's latest HIG
    patterns. The way forward will be to build on this slowly and carefully, using
    everything we've learned as a community about running mature design processes
    over the last decade or so (hello, VDG!). It's a chance to canvass the scene,
    take stock of how other terminals implement more recent innovations in this space,
    and compete with a KDE spin on things.\n\nKonsole is very intertwined with the
    older of the two user interface tech stacks in Qt, _QWidget_. QWidget typically
    renders using the CPU, and so does Konsole. Newer KDE software (including Plasma
    itself) typically uses [Qt Quick](https://doc.qt.io/qt-6/qtquick-index.html) and
    benefits from GPU acceleration via Vulkan or OpenGL instead. This is what Kwi
    does as well. For certain terminal applications the performance gain (3x-35x faster
    than Konsole depending on what's being benchmarked) can make an actual big difference
    in the user experience, but generally it should also help reduce battery usage.\n\nKwi
    is built on [libghostty-vt](https://libghostty.tip.ghostty.org/index.html), a
    project that describes itself as an ecosystem play - provide a headless lib that
    takes care of all the gnarly terminal parsing and state, enable downstream projects
    and become sort of a rising tide that lifts all boats. It's starting to really
    deliver on this promise lately, outpacing other terminal implementations on support
    for modern TUI features and not hoarding all this good only for itself. While
    the library will only make an ABI/API stable v1.0 promise at some point in the
    next 4-6 months, it's already slowly being adopted by big and popular projects,
    including Neovim, Ghostel and many more. Here's a [list](https://github.com/Uzaaft/awesome-libghostty).\n\nKwi
    marries the library to the KDE/Qt tech stack, which allows the project to focus
    mostly on desktop integration and rendering performance, two areas where KDE's
    software stack is generally second to none. The combination of the two offers
    some improvements over Konsole already, for example:\n\n- General\n  - UI lift-up
    to the latest KDE HIG\n  - 3x–35x faster overall performance, depending on the
    benchmark\n    - E.g. 870 fps in [DOOM-fire-zig](https://github.com/const-void/DOOM-fire-zig)
    on a test system, vs. 23 fps in Konsole\n- Rendering\n  - GPU-accelerated rendering
    via Vulkan or OpenGL\n  - Better support for using the KDE Plasma system color
    scheme, including live changes\n  - Improved support for correct handling of Wayland
    fractional scaling\n  - Improved terminal text rendering\n    - Improved rendering
    of text decorations (e.g. z-sorting for complex underline styles)\n    - Improved
    support for ligatures, especially when they interact with coloration and selection\n
    \   - Support for mode-2027 grapheme widths, Nerd Font icon scaling, etc.\n    -
    Improved support for Powerline and geometry symbols\n    - Support for Unicode
    placeholder images\n- TUI app features, desktop integrations for terminal features,
    etc.\n  - Improved accessibility in the terminal\n    - Much improved text extraction
    for screen readers\n    - Better mouse/hitscan/query support for screen readers\n
    \   - Better support for accessing actions from accessibility tools\n  - Support
    for CSI 996/mode 2031 color scheme queries and updates\n  - Improved, more complete
    support for modern TUI protocols\n    - More complete, significantly faster support
    for the Kitty image protocol\n      - Support for parent-relative image placement\n
    \   - Support for the Kitty animation protocol\n    - Support for the Kitty mouse
    cursor shape protocol\n    - Support for the Kitty/OSC 5522 and OSC 1337 clipboard
    protocols\n    - More complete support for the OSC 9;4 progress protocol, including
    error and indeterminate states, etc.\n    - Improved support for the Kitty keyboard
    protocol\n- Architecture\n  - Support for embedding into Qt Quick/Kirigami apps\n
    \ - More fine-grained threading architecture, also improving performance\n  -
    Additional optimizations for running efficiently when containerized (e.g. as a
    Flatpak)\n\nAnd many more, deeper down in the weeds.\n\n### Why make this, continued
    - a little bit about architecture\n\nWhy make this? First of all, to deliver the
    marked advantages detailed above! But there are also a few deeper motivations
    at play.\n\nThere's a gap we currently have in our developer offerings: Konsole,
    being strongly tied into the older QWidget tech stack, offers an embeddable component
    used in various QWidget-based KDE apps, for example Dolphin, Kate and Yakuake
    (the Kwi project offers a drop-in replacement solution for these apps). It doesn't
    offer anything similar to KDE apps written in Qt Quick/Kirigami, however, nor
    can it easily. This is a (minor) factor increasing the friction to move these
    KDE apps to the new tech stack. It also leaves new Qt Quick/Kirigami apps without
    a well-realized KDE terminal component to use.\n\nKwi installs a public Qt Quick/QML
    module that can be imported and used by other KDE apps, closing this gap.\n\nAn
    aside to this is an architectural improvement over Konsole: Anyone who's ever
    made an app using the Konsole KPart component (I made and maintained the KDE 4
    version of [Yakuake](https://apps.kde.org/yakuake/) for many years) knows that
    the Konsole main application famously isn't a consumer of its own KPart. This
    leads to behavioral differences and some odd limitations between Konsole and alternative
    UIs like Yakuake. It's also a big reason why Konsole has very complex and sometimes
    confusing settings UI, with options placed seemingly at random in either a primary
    _Settings_ dialog or within an _Edit Current Profile_ dialog - it's because only
    the latter can be opened from within apps hosting the KPart. This is addressed
    in Kwi as well: The Kwi application is built around the same public QML module
    it offers for use by others. The settings accessible from the KPart are the same
    as from the application.\n\nThe improvements list in the earlier section also
    documents a pattern: In principle, Konsole is well-maintained and has also kept
    pace with modern terminal features. Often, however, the implementations of newer
    features are neither complete nor "
