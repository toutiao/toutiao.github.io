  author: aborsy
  text: Tailnet owner may not trust all their devices to the same extent. Here is
    a concrete example.<p>I install tailscale on my cloud vps which I use for downloading
    torrents. I want my laptop to talk to this node, but I don&#x27;t want this vm
    talk to my laptop, which is the whole purpose of ACLs. My ACL is deny by default,
    so that is great and easy to set. But now this node can still send arbitrary files
    to my laptop. If I don&#x27;t remember to tag it, I&#x27;m vulnerable. If I do,
    there is still a window that this node can send me files until I tag it (I can&#x27;t
    install tailscale to a tag).<p>Sending a file otherwise normally requires an app
    listening to a port, so taildrop permissions should be same as network permissions
    set by ACL.<p>BTW, last year or so tailscale  advertised a position for someone
    to manage complexity of tailscale. Founder was talking about this issue. They
    seem to be aware of the problem.
