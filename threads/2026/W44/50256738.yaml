  author: Cthulhu_
  text: This is what we as consumers should look out for; what the tools built on
    top of LLMs try to do. Like it&#x27;s neat that a tool can summon a dozen subagents
    with various models to churn out tasks, but if the task at hand is trivial then
    the amount of tokens used for it should be trivial.<p>We&#x27;ll see the tools
    get adjusted over time to use more and more tokens, or at the very least they
    get optimized to use every paying customer&#x27;s tokens for whatever period so
    that they are on the one side thinking they&#x27;re getting their money&#x27;s
    worth, or on the other that they should upgrade to a higher tier plan. Because
    the companies are investing trillions into thousands of datacenters and if they
    sit unused it&#x27;d have been a waste of money.<p>(the datacenters won&#x27;t
    go unused I&#x27;m sure; any unused capacity will end up on a spot market, with
    cryptocurrency generation as a constant baseline. I&#x27;m pretty confident that
