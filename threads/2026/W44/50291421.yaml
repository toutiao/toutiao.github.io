  author: icecheese
  text: 'ANSI art is still alive. We have some great modern editors, like Moebius,
    Durdraw, Icydraw and Pablodraw.<p>Some of them, like Durdraw, have fully embraced
    the extended Unicode character set (Utf-8 encoding instead of IBM&#x27;s Code
    Page 437) and extended colors (xterm 256 colors instead of the traditional 16
    colors), keeping ANSI art relevant and viable into the foreseeable future.<p>People
    are making logos and assets for their modern TUI apps and games, for example.
    Neovim themes. Ly display manager wallpapers.<p>I am personally glad to see that
    the medium is coming back into relevance. It was such a fun part of digital culture
    and creativity in the 90s. I hope the next generation gets to experience some
    of that thanks to modern tooling, instead of just observed as a relic of the past.<p>Edit:
    There is also a debate as to whether Unicode&#x2F;Utf-8 characters with ANSI and
    Xterm escape codes constitutes &quot;ANSI art.&quot; Some are calling it &quot;UNSI
    art,&quot; or just modern terminal art.<p>Also, shout-out to the CP437 ANSI artists
    who continue to evolve the artistic styles of the medium, push the envelope, and
    release new ANSI packs. Hard, valuable work.'
