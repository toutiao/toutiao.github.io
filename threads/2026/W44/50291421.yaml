  author: skrellm
  text: '&gt; &quot;ANSI Art&quot; did not use the American National Standards Institute.<p>Yes,
    they do. All the color escape sequences (CSI and SGR) used in these were standardized
    by ANSI. See <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;ANSI_escape_code"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;ANSI_escape_code</a><p>More
    importantly, where the name is originating from, is the DOS driver. By default
    DOS did not interpret color codes, one would have to load ANSI.SYS for that, and
    that&#x27;s where the term &quot;ANSI art&quot; comes from. See <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;ANSI.SYS"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;ANSI.SYS</a><p>&gt;
    There is also a debate as to whether Unicode&#x2F;Utf-8 characters with ANSI and
    Xterm escape codes constitutes &quot;ANSI art.&quot; Some are calling it &quot;UNSI
    art,&quot; or just modern terminal art.<p>Yes, they do. Escape sequences have
    nothing to do with the encoding and code page (all characters in CSI and SGR are
    ASCII only, hence the same in both CP437 and UNICODE and even as UTF-8 encoded).
    Using the name &quot;UNSI art&quot; for these is good practice though to explicitly
    indicate UTF-8 encoding (and maybe the existence of non-standard SGR sequences,
    like 24 bit RGB colors).<p>I have a project (interactive textual adventure) where
    I convert graphics into ANSI&#x2F;ASCII art on-the-fly. I&#x27;ve implemented
    several methods, you can choose between them with CLI flags (including different
    escape sequences and charactersets as well). See <a href="https:&#x2F;&#x2F;gitlab.com&#x2F;bztsrc&#x2F;meg4_advgame&#x2F;#playing-in-a-terminal"
    rel="nofollow">https:&#x2F;&#x2F;gitlab.com&#x2F;bztsrc&#x2F;meg4_advgame&#x2F;#playing-in-a-termina...</a>'
