  author: JdeBP
  text: "&quot;ANSI Art&quot; has been the true problem name all along.  &quot;ASCII
    Art&quot; used the American Standard Code for Information Interchange.  &quot;ANSI
    Art&quot; did not use the American National Standards Institute.<p>Even if one
    took it to mean using ECMA 35 and ECMA 48 escape and control sequences, which
    wholly forgets the likes of Avatar and PCBoard, &quot;ANSI Art&quot; usually did
    not actually use any ECMA 35 character set switching, instead relying upon SAUCE
    data and suchlike and using IBM&#x27;s (not ANSI&#x27;s nor ECMA&#x27;s) rather
    different code page system and 8-bit character sets, and usually furthermore misinterpreted
    ECMA 48 SGR sequences when it came to blinking, bright, faint, and bold.<p>If
    people are preferring &quot;XTerm Art&quot; or &quot;Terminal Art&quot; for what
    is made nowadays, that seems to be a nomenclature change for the better."
