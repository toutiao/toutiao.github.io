    say “we decided it’s not actually worth all this complexity for &lt;some small
    number&gt;% speed improvement” (I’m not commenting whether in this particular
    case it’d have been a right call), and the PEP (if not withdrawn) was the way
    to exercise that control.<p>[1] <a href=\"https:&#x2F;&#x2F;github.com&#x2F;python&#x2F;cpython&#x2F;pull&#x2F;113465#issuecomment-1919888849\"
    rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;python&#x2F;cpython&#x2F;pull&#x2F;113465#issuecomment-1...</a>"
