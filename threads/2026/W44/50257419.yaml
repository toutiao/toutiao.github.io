  author: cogman10
  text: "&gt; clearly stated scope<p>The scope of a JIT is the entire python runtime.
    \ Not at the beginning, it can be more narrow, but certainly it can evolve to
    cover everything.  JITs touch everything.<p>&gt; success criteria<p>Impossible
    to measure.  JITs don&#x27;t universally make things faster and unless the SC
    was willing to accept &quot;some programs will see around x% improvement&quot;
    then it would be impossible to actually give them the criteria they want.  There&#x27;s
    a reason C++ compilers and their optimizations aren&#x27;t defined by the ISO
    committee.<p>&gt; support plan<p>Like most JITs, support for a JIT is an ongoing
    and ever evolving process.  What&#x27;s needed depends entirely on what&#x27;s
    needed today.  You usually need more than 1 or 2 dev working on it, which may
    be the issue here.<p>&gt; It’s just that open-ended experimentation doesn’t belong
    in main, of all places.<p>Very strong disagree.  That&#x27;s simply the nature
    of performance optimizations for JITs.  They belong on main because new optimizations
    and heuristics will always be generated.  The role of doing a compiler is a long
    term experiment in performance, seeing what your runtime is currently doing and
    how it&#x27;s being used and tweaking it to work better.<p>pypy isn&#x27;t in
    a worse place because it&#x27;s been running a longterm performance experiment.<p>&gt;
    They have an ongoing duty to ensure that a critical piece of global infrastructure
    remains stable and trustworthy to consider.<p>None of the things mentioned actually
    do that, other than perhaps a support plan.  There are plenty of critical infrastructure
    projects who all can manage to develop JITs.  Python is the special snowflake
    that has decided to do JIT development incorrectly.<p>This is a runtime optimization&#x2F;implementation
    detail.  It&#x27;s foolish to send it through a committee approval process.  That&#x27;s
    why you won&#x27;t be able to find a single language with a JIT or advanced optimizations
    that has do it by committee."
