  author: jsmith45
  text: 'That&#x27;s at best a partial fix for the API side. Python side CPython sill
    exposes a LOT of implementation details, and as a result occasionally projects
    will choose to rely on some of these details. Then other implementations need
    to decide whether to also pick the same implementations details and expose them,
    or use different details, and lack compatibility with any library that depended
    upon them.<p>The python documentation has historically also not been especially
    clear at distinguishing between what the language guarantees, vs what is just
    implementation details of the cPython implementation. So even if libraries wanted
    to try to avoid depending on implementation specifics, it isn&#x27;t always clear
    what those are.<p>The net result is that for the end user python the language
    is effectively: whatever cpython does. This really, really discourages creating
    alternate implementations, as the only way to be an alternative implementation
    with good compatibility is to be a living fork of cpython, constantly merging
    in all the changes from it, while also maintaining your improvements.'
