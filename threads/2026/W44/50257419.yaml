  text: "&gt;  I would expect such a project to get continual updates without PEPs.<p>Just
    for completeness: the original JIT PR was merged quite enthusiastically \nand
    only after the fact it was pointed out that it should have went through a PEP
    process [1]. The following PEP 744 was of the “informational” type, and the just-withdrawn
    PEP 836 was the first “standards track” PEP, which means that (in my understanding)
    it’s technically the first actual PEP that the SC would formally comment on. So
    in a way it’s not “can we update the JIT” PEP, but the first real “does SC want
    this JIT as proposed” PEP.<p>That said, I do agree with most of what you said,
    especially the acceptance criteria part.<p>The issue I have and find it hard to
    resolve is that since the code was already on main, the feature was already in
    “sunk cost” mode. It’s hard when the code is already on main and another 3 optimization
