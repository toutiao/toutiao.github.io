  author: jerf
  text: Rust is not your only option. Nor is it automatically the best option, though
    it is certainly a solid option for a certain set of requirements. Go is a pretty
    decent match for a Python rewrite; superficially it seems like you&#x27;re giving
    up a lot but under the hood they&#x27;re philosophically more compatible than
    meets the eye in a lot of ways. But any static language that you have some other
    local reasons to prefer is going to blow its socks off in terms of performance.
    And &quot;blow its socks off&quot; is just for the naive translation of a conventional
    Python code base over to a new language. If your codebase is amenable to threading
    and can take advantage of multiple CPUs somehow, the result may blow Python&#x27;s
    socks off twice over.<p>The problem is that Python just isn&#x27;t going to go
    fast. There are some languages that may have had more resources poured into them
    to make them go faster in absolute terms, like perhaps Java. But I don&#x27;t
    think there&#x27;s a single language that has had so <i>many</i> ways of trying
    to make it go faster given so much effort over so many decades. It&#x27;s really
    time to call it... if you have Python code and it&#x27;s a performance problem,
    if one of the many many many different solutions aren&#x27;t adequate for some
    reason, Python is not going to get any faster than it is today and you&#x27;re
    going to have to move off of it.<p>If you need high performance code, Python is
    simply not the right answer and you&#x27;re going to have to skill up. Or accept
    what you have, which you&#x27;ll have to decide if that&#x27;s a viable option.
    If it&#x27;s fast enough I don&#x27;t advocate switching casually. But if it isn&#x27;t,
    there isn&#x27;t a realistic prospect that you&#x27;re going to wake up in a year
    or two to a 30x-faster Python. I wasn&#x27;t terribly convinced by that claim
    back in the early 2000s, but it hadn&#x27;t really been tested yet. It has been
    tested now.
