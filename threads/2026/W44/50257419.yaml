  author: kannanvijayan
  text: Gonna dump a technical hot take here.<p>Python is a mature production language
    with a lot of users.  Even before it was huge - like 20 years ago when I was in
    college - getting a small backwards compatible API change into a python extension
    module (gnu readline in my case) required convincing GvR personally that the API
    change was necessary.<p>Every JIT attempt I&#x27;ve seen for python just tries
    to cut too deep in the first pass, and scope themselves too large.<p>I believe
    any successful attempt at optimizing python performance from JIT will FIRST start
    with a 100% semantically compatible hidden type model for optimizing object property
    access and method dispatch.<p>The single biggest performance delta in most dynamic
    language jits come from that, not from optimizing guards off of bytecode operations
    or from compiling to machine code.  It&#x27;s from converting hashtable lookups
    into constant-time guard + offset lookups.<p>The hidden type model is also a hard
    nut to crack.  It needs to perserve dict semantics which have very dynamic behaviour
    via the various `__*__` methods, and handle exotics scope objects since scoped
    name lookups are the most common ones which have their own exotic behaviours (I
    remember python providing some ability for callee frames to inspect caller scopes
    in some limited ways).
