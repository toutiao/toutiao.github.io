    rel="nofollow">https:&#x2F;&#x2F;peps.python.org&#x2F;pep-3100&#x2F;</a> - PEP
    3100 is things he set as goals for it, things like all strings are Unicode and
    byte arrays are a separate type, optional type annotations, &#x27;exec&#x27; and
    &#x27;print&#x27; change from statements to functions, None&#x2F;True&#x2F;False
    become keywords, old-style classes are gone, changing inequality comparison from
    &lt;&gt; to != , require C99, drop BeOS support, drop old standard library modules,
