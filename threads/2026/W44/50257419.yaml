  author: kannanvijayan
  text: 'I haven&#x27;t kept up with python development lately, so thanks for pointing
    that out.  I looked this up and it does seem like some sort of property access
    is being optimized.  What&#x27;s not clear is what the hidden runtime type model
    is being used for this, or if it&#x27;s a lightweight tracking that captures some
    subset of property accesses.<p>More digging led to this: <a href="https:&#x2F;&#x2F;peps.python.org&#x2F;pep-0659&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;peps.python.org&#x2F;pep-0659&#x2F;</a> which
    seems to be what the effort is organized around?<p>Python&#x27;s object semantics
    are broadly similar to Javascript, bar the prototypical inheritance chain, but
    with the extra complexity of potentially needing to handle dynamic `__*attr__`
    overrides.  Optimizing for this would require a tree of hidden map objects much
    like JS JIT engines use.  I dug around the codebase a while back looking for something
    like that but didn&#x27;t find it.  `OrderedDict` seemed promising but after more
    investigation that turned out to just be adding property ordering to dictionaries.<p>The
    thing is, you can build that entire hidden type structure out, AND optimize against
    it, without ever having to mess with things like bytecode replacement.  Once you
    have the hidden type model, you can modify the property lookup algorithm in the
    VM itself (as in cpython c code) to use some annotation structure hanging off
    of the bytecode to look up inline caches of type-guarded fastpaths.  It would
    be an optimized fastpath that integrated directly into the C code that interprets
    the GETATTR opcode.'
