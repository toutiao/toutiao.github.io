  text: Unfortunate. I&#x27;ve been following the work on it occasionally.<p>On one
    hand, it seemed like JIT work was really progressing in high gear until SC requested
    a new PEP. Also unfortunate, as it seemed like part of the hope for the JIT was
    that it&#x27;d counter the performance penalty from free threading.<p>On the other,
    it did feel (to me) like with all the fancy (and definitely cool) optimizations
    it got (automatic refcount operation removal, new type-based specializations,
    inplace math operations), the macrobenchmark benefits weren&#x27;t _that_ exciting
    for a JIT. It definitely has potential for more, maybe with even fancier optimizations
    like unboxing ints, but the complexity just keeps going up.<p>&gt; It said that
    the PEP was &quot;overly optimistic&quot; about user-visible differences with
    the JIT enabled.<p>The JIT is technically generated from the same source as the
    interpreter loop itself, so originally the differences were extremely unlikely,
    but I imagine the risk just kept going up as new JIT-only paths and optimizations
    were introduced.<p>And politically, I feel like SC’s reasoning was just “this
    side project has landed in main branch almost by accident and has been stewing
    without oversight ever since, with no stabilization in sight”; and the latest
    PEP was probably still too vague, with a lot of “here’s more things we can add
    to the stew” - so I can understand if SC wasn’t satisfied.
