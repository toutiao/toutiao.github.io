  author: cogman10
  text: So, I&#x27;d grant that it&#x27;d probably be a JEP for java (the initial
    JIT) but not that every change to the JIT would result in a new JEP.  Java&#x27;s
    JIT, hotspot, was integrated right before they started the JEP process.  The JEP
    for the JIT would likely be pretty boring like &quot;It&#x27;s a JIT, it does
    this, in some applications we see this sort of speed up&quot;.  Much like the
    AOT JEP <a href="https:&#x2F;&#x2F;openjdk.org&#x2F;jeps&#x2F;514" rel="nofollow">https:&#x2F;&#x2F;openjdk.org&#x2F;jeps&#x2F;514</a><p>The
    Java governance allows for a lot more open ended projects with follow ups.  Not
    that it&#x27;s reckless, Valhalla is proof of that, but rather that once something
    is good enough they are pretty open to just shipping it as a preview feature and
    refining until it is worthy of being stable.<p>That&#x27;s why, for example, we
    saw ZGC get merged, and then JDK after JDK seeing continuing development and improvement
    on ZGC (Or G1 for that matter).  These GCs were fairly rough on their first release
    and now they are pretty much best in class.<p>I see a Python JIT as the same thing.  Delivering
    the infrastructure for a JIT would need a PIP, but I wouldn&#x27;t put in things
    like &quot;acceptance criteria&quot; beyond &quot;doesn&#x27;t break older code&quot;.  I
    would expect such a project to get continual updates without PEPs.
