  author: cogman10
  text: I think this is a major issue with requiring a PEP for what&#x27;s a performance
    optimization.<p>JITs are big nasty things that by their nature have to do a lot
    of things.  You are basically saying &quot;Give us a PEP for a new python interpreter
    and compiler&quot;.<p>What they do is fuzzy by their nature because optimizations
    are very rarely universally beneficial.  It&#x27;s a game of measuring, looking
    for regressions, and tackling the biggest problem next for whatever sample applications
    you have available.  You always run into the risk of overfitting on top of all
    that (You may have made django faster, but you&#x27;ve made flask slower).<p>This
    is the sort of thing that, IMO, should not go through the PEP process.  It&#x27;s
    an implementation detail for the runtime.<p>Imagine, for example, if the JVM needed
    a bunch of JEPs for JIT improvements.  They&#x27;d never get done.  Or if any
    javascript engine needed ECMA acceptance before they could do a new JIT optimization.
