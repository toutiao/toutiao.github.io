article:
  url: https://www.404media.co/manifestos-fear-and-loser-thinking-inside-protons-ai-reckoning/
  title: 'Manifestos, Fear, and ‘Loser Thinking’: Inside Proton’s AI Reckoning'
  fetch_status: success
  content: "# Manifestos, Fear, and ‘Loser Thinking’: Inside Proton’s AI Reckoning\n\nPhoto
    by Piaras Ó Mídheach/Web Summit via Sportsfile via Wikimedia Commons / Proton
    logo / Collage via 404 Media and Spumoni Cooperative.\n\nAndy Yen, the CEO of
    Proton, had a message for an employee in the company’s security Slack channel
    who urged the company to at least take a few days to pentest newly written code
    before pushing it live. “That’s bullshit and loser thinking. Of course it’s possible
    to be fast and secure,” Yen wrote in the channel at the end of August. “Stop thinking
    always of how to be slower, and focus more on how to be faster.”\n\nIn a follow-up
    message, Yen reiterated his point: “only losers think like that.” His ultimate
    message for the team was to “stop lovingly handcrafting all our code and use AI
    more.”\n\nThat exchange was just one of many that showed how Yen and other company
    executives are aggressively pushing Proton towards AI. Proton is a Swiss company
    that famously makes the encrypted email service Proton Mail and a suite of privacy
    and security-focused products, including an encrypted drive service, an authenticator
    app, a password manager, and more.\n\nIn the last few months, Yen set up an email
    address for employees to contact if they come across anything blocking adoption
    of AI at Proton, so leadership can “ruthlessly smash everything that stands in
    the way of AI velocity;” Proton installed software on workers’ computers that
    track how much AI code the company is generating; and Yen said this is the last
    year that Proton will hire engineers at all, and instead only hire people to build
    things with AI.\n\nThat AI push came to head this week when 404 Media reported
    Proton said it would re-interview staff about their use of AI, with the clear
    implication that those interviews, and employees’ willingness to embrace AI, could
    decide whether a worker is fired or not.\n\n404 Media spoke to eight current and
    one former Proton employees and reviewed Slack chats, meeting recordings, and
    an AI manifesto written by the company’s CTO. Our reporting reveals a culture
    of fear inside Proton, where many employees are hesitant to even mildly critique
    Yen’s views or discuss engineering problems. Workers describe an environment where
    employees have genuine concerns about security or being asked to develop security
    products with AI, but feel unable to voice them, lest Yen berates them in front
    of everyone or threatens their employment at the company.\n\n“The CEO is in full
    AI psychosis and has been for a while now,” one of the sources told 404 Media.\n\nOur
    reporting also paints a picture of Proton that is likely very different to the
    public’s perception of a company with a goal of carefully protecting privacy:
    one that in reality is barreling ahead with AI as quickly as possible so it can
    achieve the explicit goal of more annual revenue.\n\n“Due to insufficient velocity,”
    Proton is not on track to achieve its annual recurring revenue target by the end
    of the year, one internal document obtained by 404 Media reads. Proton’s year-over-year
    growth is also “far away from what the market today considers to be good,” and,
    “By all metrics that matter, we’re an underperforming company.”\n\nIn response
    to detailed questions from 404 Media, a Proton spokesperson did not dispute any
    of our reporting or characterization of what’s happening inside of the company. \n\n“It’s
    clear that some people at Proton are unhappy with our direction, or misunderstand
    it, and many people are anxious,” they said. “In our determination to move fast,
    we have sometimes been too blunt or too slow in explaining ourselves to our people.
    We will work on that, as their questions are the ones we most need to answer.”\n\nYen,
    a former CERN particle physicist, projects a measured approach in public, but
    internally he acts more like what one employee described as a “petulant child.”
    In May, Proton announced it was implementing post-quantum cryptography which should
    protect against future attacks from quantum computers. The work took years of
    effort, with one caveat that it would not work on older emails, only those written
    after the feature’s launch, at least for the moment. Yen was not happy that Proton
    was drawing attention to this limitation.\n\nIn a Slack channel dedicated to thanking
    people for their work, Yen jumped in. “Get it fixed,” he wrote, referring to Proton’s
    Reddit post announcing the feature. “Now Reddit is pissed and we look worse than
    Tuta,” he added, referring to a Proton competitor. When employees explained to
    Yen the nuances of the encryption and why that was not immediately possible, Yen
    wrote, “I find this whole thing stupid. You cannot announce this in this way.”\n\n“Now
    we are left with two shitty choices. Deprioritize more important tasks for the
    business to re-encrypt old emails, or constantly get attacked online for not doing
    it. So maybe you can enlighten me on which of the two shitty choices we will take,”
    he wrote. “In the future there are two options. Either you guys are confident
    enough to not fuck this up, or you get my advice to make sure it is not fucked
    up,” he added. He then told a member of the team that made it to “go on Reddit.”\n\n“So
    go on there with your personal account and comment to set the record straight,”
    he wrote. “Perception is more important than truth, the truth doesn’t matter if
    you don’t win on perception.”\n\nOne employee told 404 Media, “Whatever persona
    Andy [Yen] has out of Proton, he’s a straight up bully inside. He routinely breaks
    his little facade in Slack and calls people losers and stupid, often for stuff
    he’s paying them for.”\n\nEver since launching Proton Mail in 2014 after the Snowden
    revelations, Proton has steadily introduced new products that make Proton more
    of a worksuite than a simple email provider. More recently, those products were
    focused around AI, with the launch of Lumo, a large language model (LLM) chatbot
    that the company says doesn’t log conversations or train on user data. In June,
    Proton launched a 2.0 version of its chatbot.\n\nUp until this point, Yen’s public
    comments on AI were relatively tame. In an August interview with WIRED, he said
    Proton is “building AI features and AI tools, because I think if the privacy companies
    do not find a way to step in to build privacy-first AI, we are essentially ceding
    the future to tech companies that don’t have the best interests of users at heart,”
    and that the company was “capitalizing” on the backlash to corporatized, invasive
    AI from companies like Google. Last year, Yen and Proton were criticized for statements
    he made suggesting the Republican Party and Donald Trump would be harder on Big
    Tech than Democrats. \n\nToward the end of August, Yen’s internal tone on AI shifted
    to having Proton use it as much as possible, and as quickly as possible, according
    to the Slack chats and multiple employees.\n\n“The train is coming, get onboard
    or get crushed. Don’t be the professional fax machine operator in the internet
    age,” he wrote to the security Slack channel. “I think by the end of this year
    most developers stop programming and start writing specs for tests that AI will
    code and run, to validate AI written code that humans will no longer be able to
    review. This will be the last year that we hire engineers, and starting next year
    we hire what we used to call product managers, to build things with AI.”\n\nAI
    is changing how cybersecurity works, with AI agents hacking into companies, and
    AI assisting in the discovery of gaping vulnerabilities in important code. Many
    companies across the privacy and security space are grappling with how to deal
    with AI, either in the development of their products or how to defend themselves
    against hackers who are using AI. Some may do this carefully. Others are trying
    to do it as quickly as possible for profit. This account of Proton’s own reckoning
    with AI provides an unprecedented insight into what is happening inside one security-focused
    company users especially trust. \n\nInitially, "
