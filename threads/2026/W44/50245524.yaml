  author: vkou
  text: The advantage is this:<p>1. Some C-suite asshole wants headcount in your division
    reduced by, say, 5% next year. He has zero visibility into anyone&#x27;s performance,
    or any of the projects anyone is actually working on.<p>2. His subordinate directors
    could do random, or targeted layoffs to hit that 5%, but this ruins morale for
    everyone who survives, and is rather awful for those that don&#x27;t.<p>3. ...Or,
    they could make this offer, let people leave on their own, try to convince any
    stars who want to take it to stay, don&#x27;t do any backfill. Then, hopefully,
    between the voluntary layoffs and no backfill, you might hit that 5% reduction,
    and not have to do involuntary layoffs. (Or if you do, they would be much smaller.)<p>4.
    This is less disruptive for teams and managers, because with voluntary layoffs,
    they have time to plan for these people leaving, instead of showing up to work
    on Thursday, and being told that 5 people on their team were given the pink slip
    this morning.<p>5. This is also, obviously, less disruptive for employees who
    take the offer (as they can control their exit, and get a payout), and less disruptive
    for anyone who doesn&#x27;t take the offer (lower odds of showing up to work on
    Thursday, and getting a pink slip).
