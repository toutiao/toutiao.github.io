  author: vkou
  text: "&gt; What if all the people they wanted to keep accepted while those they
    didn&#x27;t want to keep stayed<p>That&#x27;s not an outcome they&#x27;d <i>like</i>,
    but it&#x27;s an outcome they have to accept, in order to not piss off everyone
    else.<p>1. For anyone they want to keep who takes them up on the offer, they always
    have a chance to try to convince those people to not take the buyout offer.<p>2.
    If you make the buyout offer conditional to particular individuals, it will sow
    resentment and division.<p>It&#x27;s generally better for the employees and the
    employer to do this kind of blanket buyout. If they voluntarily hit the reduction
    targets, nobody needs to be laid off. If they don&#x27;t, the layoffs will be
    there, but smaller. If the &#x27;wrong&#x27; people want the buyout, there&#x27;s
    still a chance to convince them to stay. If they don&#x27;t want to stay after
    the convincing, it&#x27;s probably best for them to go on their way."
