  author: zoeysmithe
  text: This is interesting and I googled a bunch of this.<p>The helicopter base station
    is an off the shelf snapdragon 801 cpu with 4 cores. By comparision the CPU in
    the rover is a BAE RAD750 processor at 200hz, essentially a radiation hardened
    1998 G3 imac chip. They run calculations on each  snapdragon core and if there
    is a consensus take the value. I don&#x27;t know how their voting system works.
    If core 1 and 2 agree and 3 and 4 don&#x27;t, does it just agree with core 1 and
    2&#x27;s consensus if 3 and 4 don&#x27;t match? Or does it was 3 minimum and re-runs
    the calculation.<p>It also performs aggressive memory scrubbing. This sounds like
    software ECC by performing various memory checksums by comparing values to the
    flash drive&#x27;s files. So if script.sh on disk doesn&#x27;t match script.sh
    in memory, they know the memory is bad. I guess they are assuming flash will always
    be correct, which is interesting, but in space maybe its just a &#x27;pick a lesser
    evil&#x27; thing because flash can also be corrupted by radiation. They store
    critical files with triple redundancy on the flash, so the flash sounds pretty
    rugged here. There is also a secondary radiation hardened flash storage &#x27;golden
    image&#x27; the unprotected snapdragon&#x27;s running flash can be compared to.<p>Then
    the software identifies damaged memory addresses and blocks them. One example
    is the software found 25 corrupted bits in its 1gb memory and has marked them
    as unusable. I&#x27;m guessing over time more and more bits will be unusable as
    radiation permanently destroys those transistors. So its a bit of a race against
    the clock. Better to use the base station until it can&#x27;t be used anymore.
