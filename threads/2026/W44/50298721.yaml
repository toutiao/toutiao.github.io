  text: "&gt; After running thousands of simulations, the team raised the rover’s
    tilt limit to 24 degrees and reduced the clearance required under the rover’s
    belly pan to 20 centimeters (about 7.9 inches). The team also updated the rover’s
    braking software to avoid rock hazards, nearly doubled steer motor current limits,
    updated flight software with “dynamic slip tables” to model expected slip, and
    used cross-slope driving to better anchor wheels on exposed bedrock.<p>I wonder
    why they didn&#x27;t model and use these parameters in the original design (I&#x27;m
    not at all suggesting a mistake on their part; I wonder what their thinking has
    been):<p>Were Martian environmental parameters less well-known (e.g., how gravity,
    air resistance &#x2F; wind, and scree dynamics interact)? Bot performance in Martian
    environment (e.g., motor power output) less well-known?  Were they being understandably
    conservative with their irreplaceable bot?"
