  author: Pannoniae
  text: Great article :D The rabbithole actually goes even deeper because buffering
    on the read side is almost always good, but reads are often way more latency-sensitive
    than writes. Which leads to the paradox that increasing the buffer size &#x2F;
    prefetching more with mmapping can lead to worse performance due to the added
    latency. And decreasing the buffer size can have the same effect due to issuing
    more calls, so in order to squeeze in the optimal throughput&#x2F;latency ratio
    on reads you have to tune it per workload.... or just try a few different buffer
    sizes and see which one works better.<p>Writes are the opposite, they&#x27;re
    usually not RAW (read-after-write), they&#x27;re &quot;fire and forget&quot;,
    so you don&#x27;t really care about latency, but you do care a whole a lot about
    your writes actually arriving... again two competing parameters because the more
    you batch the writes, the faster they are but the bigger chance of a torn write
    or data loss. And unlike reads, writes are <i>not</i> idempotent on the application
    level so ideally you&#x27;d want some logic to atomically write a meaningful amount
    of data so it won&#x27;t get torn, even if it crashes.<p>Now in practice just
    about no one actually does any of this but it&#x27;s a fun thought :D
