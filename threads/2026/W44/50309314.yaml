  text: |-
    &gt; I am afraid future of art is bleak. Poems hand written by poets will be competing with machines. Movies by Nolan and AI probably would not be easily distinguishable. Would we still pay for human made movies when AI can generate one for us, with the ending and style we want?<p>If it isn&#x27;t obvious already, it should become obvious soon that economics and society as a whole will need to change. People will still want to do people things, like make art for example, but the need to monetize their work will have to go away.<p>There are many hobbyists that do things for the pleasure of doing them, and by that definition most human activities will become hobbies, done for pleasure and the sake of doing them, not for monetary&#x2F;economic value.<p>The (economic) grind of artists painstakingly creating scenes for The Simpsons - which is already outsourced to cheaper overseas locations - will no longer be a human domain; and as I understand it, is not even currently in the domain of US-based artists and is instead being done in South Korean animation studios [1]. Does that mean US artists have disappeared?<p>There are large communities that come together for non-economic activities. History re-enactors for example. So hierarchy, organization, etc. will continue, just not for pecuniary work. A potential model for this is outlined in The Culture of Iain M. Banks&#x27; sci-fi, with the idea being that eliminating the economic necessity of work does not eliminate the human desire to accomplish [2].<p>I prefer the rosier outlook over the dystopian one. Society could go either way. We shall see.<p>[1] <a href="https:&#x2F;&#x2F;responsejournal.net&#x2F;issue&#x2F;2024-11&#x2F;feature&#x2F;between-seoul-springfield" rel="nofollow">https:&#x2F;&#x2F;responsejournal.net&#x2F;issue&#x2F;2024-11&#x2F;feature&#x2F;between-se...</a>
