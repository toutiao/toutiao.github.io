  author: Kotlopou
  text: I don&#x27;t understand the supposed value of AI-made art tailored to the
    viewer&#x27;s wishes. One of the best film-watching experiences I&#x27;ve had
    recently was After Hours, which I got sent to by some random online article linking
    to a scene [1]. I would never have asked for this film or been able to describe
    it without having seen it. My favorite book of all time is One Hundred Years of
    Solitude, which I was forced to read in high school (balancing out all of the
    other nonsense they made us read) -- it&#x27;s set in a small Colombian town and
    has about as little to do with my life (in a capital city in Central Europe) as
    imaginable. I love the webcomic 1&#x2F;0 [2], whose author was a creationist when
    writing it (I found it as an insufferable atheist kid).<p>We find art that is
    fun and interesting and unexpected and it expands what we are. That&#x27;s one
    of the <i>purposes</i> of art. Watching something predictable eventually gets
    your survival boredom instinct to kick in. Is this not a common experience?<p>[1]
