  author: Kotlopou
  text: 'Case in point: Pangram says this article is 80% AI-written. [1] I only started
    suspecting in the very last paragraph (&quot;Michel Dufrénoy crosses Verne&#x27;s
    frozen Paris carrying almost nothing: a memory of books, a love of poetry, a handful
    of dying flowers and the name of someone he loves.&quot; is a vaguely poetic-sounding
    structure that I&#x27;ve already seen dozens of times in the last year).<p>Ignore
    the debates about quality. This means that this article&#x27;s message is a lie;
    all of the opinions expressed here come not from a human, perhaps an inhabitant
    of Paris, but from a machine. The salvation suggested in the form of Parisian
    1960s poets does not come from someone who likes to read them, but from a machine
    reporting on its training data. (Here it&#x27;s not controversial -- what else
    can an LLM know about a poet besides what has been written about them?)<p>I feel
    like exploring a cave now.<p>[1] The 20% flagged as human is mostly direct quotations
    from the book, which is a nice sign that Pangram isn&#x27;t making things up randomly.'
