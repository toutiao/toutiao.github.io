    KIDS REGISTERED**\n\n….\n\n**TOTAL BOOKS GIFTED**\n\n….\n\n[DONATE NOW](/donate)\n\n#
    **DOLLY PARTON’S IMAGINATION LIBRARY**\n\n## Dolly Parton’s Imagination Library
    is dedicated to inspiring a love of reading by gifting books free of charge to
    children from birth to age five, through funding shared by Dolly Parton and local
    community partners in the United States, Canada, United Kingdom, Australia and
    Republic of Ireland.\n\nInspired by her father’s inability to read and write Dolly
    started her&nbsp;Imagination Library in 1995 for the children within her home
    county. Today, her program spans five countries and gifts millions of free books
    each month to children around the world.\n\n> “When I was growing up in the hills
    of East Tennessee, I knew my dreams would come true. I know there are children
    in your community with their own dreams. They dream of becoming a doctor or an
    inventor or a minister. Who knows, maybe there is a little girl whose dream is
    to be a writer and singer.\n> \n> The seeds of these dreams are often found in
    books and the seeds you help plant in your community can grow across the world.”\n\nIn
    1995, Dolly Parton launched an exciting new effort,&nbsp;Dolly Parton’s Imagination
    Library, to benefit the children of her home county in East Tennessee, USA. Dolly’s
    vision was to foster a love of reading among her county’s preschool children and
    their families by providing them with the gift of a specially selected book each
    month.\n\nBy mailing high quality, age-appropriate books directly to their homes,
    she wanted children to be excited about books and to feel the magic that books
    can create. Moreover, she could ensure that every child would have books, regardless
    of their family’s income\n\n[CAN I REGISTER MY CHILD?](/check-availability/)\n\n[CHECK
    AVAILABILITY](/check-availability/)\n\n[FREQUENTLY ASKED QUESTIONS](https://support.imaginationlibrary.com/category/251-all-frequently-asked-questions)\n\nThere
    is simply no limit on how far we can take this program and to what ends of the
    earth, but it is an absolute impossibility without your help. If your community
    or a community that you are aware of doesn’t yet offer this proven early childhood
    literacy program, then we challenge you to Get Involved! It’s actually quite easy
    to bring the Imagination Library to life in your community and we have an onslaught
    of available resources to help you Start A Program including a personal trainer
    which we like to call “Regional and State Directors” So come on, you can do it,
    follow **[this link](/usa/#getting-started-checklist \"Start a Program Checklist\")**
    to get a simple checklist of what you need to do to Get Onboard Dolly Parton’s
    Imagination Library.\n\n[ABOUT US/HOW IT WORKS](/about-us/)\n\n**NEWS BY COUNTRY**\n\n####
    Categories\n\n- [Imagination Library](https://imaginationlibrary.com/category/imagination-library/)\n
