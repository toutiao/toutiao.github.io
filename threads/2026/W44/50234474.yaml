  author: arjie
  text: 'My daughter receives books through this program and I was curious how it
    was sustained at a $2.5&#x2F;book wholesale cost.<p>Interestingly, the coordinating
    body that selects books, facilitates distribution, and negotiates wholesale pricing
    is the Dolly Parton Imagination Library, but per-book funding is actually entirely
    through local charities and so on. This means that where charities are unable
    to act as partners, children will not receive books, but it also means that the
    program can operate by growing and shrinking as local support (including from
    state and local government grants) comes online and goes offline while keeping
    the overhead for local partners low.<p>Dolly Parton came up with the initial local
    structure for her region in Tennessee and David Dotson of Dollywood scaled the
    operation using this decentralized model. Very impressive structure that makes
    this sustainable.<p>Here’s the interview where he talks about it: <a href="https:&#x2F;&#x2F;www.endbookdeserts.com&#x2F;dolly-parton-imagination-library"
    rel="nofollow">https:&#x2F;&#x2F;www.endbookdeserts.com&#x2F;dolly-parton-imagination-libr...</a>'
  score: 0
