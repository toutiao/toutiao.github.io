  author: csallen
  text: '1. A lot of people already have Claude Code set up, and it&#x27;s easier
    to keep using that than to install something new.<p>2. Lots of people are used
    to Claude Code&#x27;s interface&#x2F;commands&#x2F;etc. and don&#x27;t feel like
    paying the cost of learning something new. The benefits would have to outweigh
    those switching costs, and it&#x27;s unclear that they do.<p>3. Claude Code already
    works with your Claude MAX subscription[0], which gives you an incredible amount
    of usage of the top-tier models for cheap, which can&#x27;t be matched by any
    open-source options. And most people won&#x27;t exhaust this usage, so they have
    no real need to use open-source models.<p>4. Although it&#x27;s hard to 100% confirm
    this, there&#x27;s reason to believe that Claude itself works better with Claude
    Code than with other harnesses.<p>5. There&#x27;s no real lock-in. If tomorrow
    you decide you don&#x27;t want to use Claude Code, you can just switch to something
    else ezpz. So there&#x27;s no reason to worry that you&#x27;re digging a hole
    and locking yourself in. Thus, there&#x27;s no urgency to switch away.<p>[0] Yes,
    open-source harnesses can use your Claude MAX subscription, but does this &quot;benefit&quot;
