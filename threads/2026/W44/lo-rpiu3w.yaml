article:
  url: https://jordi.inversethought.com/blog/the-kluever-maneuver/
  title: The Kluever Maneuver – The Scribbler of the Rueful Countenance
  fetch_status: success
  content: "# The Kluever Maneuver\n\n ![](https://secure.gravatar.com/avatar/3d7505f1580f996cefb2df0ed70c6f6a3b0a5dec4679ff35ef830dd49a450f33?s=48&d=identicon&r=g)\n\nWritten
    by –\n\nJordi\n\nIn brief, it’s this: whenever you are doing a bugfix, do it in
    two commits.\n\n1. **Write a passing test that exemplifies the buggy behaviour.**\n2.
    **Fix the bug and also fix the test we just wrote.**\n\nFor example,\n\n    def
    add(a, b):\n       return a + b + 1\n\nand through your keen eye you observe that
    this addition function is buggy. You therefore write a test that records the bad
    behaviour,\n\n    Commit 1\n    \n    diff --git a/test_arith.py b/test_arith.py\n
    \   --- a/test_arith.py\n    +++ b/test_arith.py\n    @@ -0,0 +1,2 @@\n    +def
    test_add(a, b):\n    + assert add(2, 2) == 5\n\nThen comes the bugfix,\n\n    Commit
    2\n    \n    diff --git a/arith.py b/arith.py\n    --- a/arith.py\n    +++ b/arith.py\n
    \   @@ -1,2 +1,2 @@\n     def add(a, b):\n    - return a + b + 1\n    + return
    a + b\n    diff --git a/test_arith.py b/test_arith.py\n    --- a/test_arith.py\n
    \   +++ b/test_arith.py\n    @@ -1,2 +1,2 @@\n     def test_add(a, b):\n    -
    assert add(2, 2) == 5\n    + assert add(2, 2) == 4\n\n## BUT Y THO\n\nThree reasons:\n\n1.
    Clearly shows exactly how the bug currently behaves\n2. Demonstrable proof that
    the bugfix actually fixed the bug\n3. CI still passes at every commit\n\nThe traditional
    way to do this is to do a bugfix and add a test in the same commit. But what if
    the test accidentally already passed before the alleged bugfix and the alleged
    bugfix didn’t actually work? In that case the added test gives false confidence
    that the bugfix worked.\n\n## Alright, show me\n\nHere’s a less obvious example.\n\nSuppose
    we want to make sure users are not underage,\n\n    def age_in_years(birthday,
    today):\n        return today.year - birthday.year\n    \n    def can_access(birthday,
    today):\n        return 18 <= age_in_years(\n            birthday,\n            today\n
    \       )\n\nYou notice that this age check is buggy. It’s only considering the
    years. If it’s October 2026, but you were born on December 2008, you are not 18
    yet.\n\nTo fix it, the problem is just an off-by-one.\n\n    diff --git a/dates.py
    b/dates.py\n    --- a/dates.py\n    +++ b/dates.py\n    @@ -4,7 +4,7 @@ def age_in_years(birthday,
    today):\n         return today.year - birthday.year\n    \n     def can_access(birthday,
    today):\n    - return 18 <= age_in_years(\n    + return 18 < age_in_years(\n             birthday,\n
    \            today\n         )\n    diff --git a/test_date.py b/test_date.py\n
    \   --- a/test_date.py\n    +++ b/test_date.py\n    @@ -0,0 +1,5 @@\n    +def
    test_can_access():\n    + assert can_access(\n    + date(2007, 1, 1),\n    + date(2026,
    1, 1)\n    + )\n\nThe astute reader will observe the problem isn’t in the `can_access`
    function but in the age calculation. The bugfix isn’t an actual bugfix and the
    proposed test actually passes both before and after the proposed fix.\n\nThe _Kluever
    Maneuver_ would have prevented this.\n\nWe wrongly check that someone born on
    New Year’s Eve in 2008 is eighteen on New Year’s Day in 2026.\n\n    commit 1\n
    \   \n    diff --git a/test_date.py b/test_date.py\n    --- a/test_date.py\n    +++
    b/test_date.py\n    @@ -0,0 +1,5 @@\n    +def test_can_access():\n    + assert
    can_access(\n    + date(2008, 12, 31),\n    + date(2026, 1, 1)\n    + )\n\nThen
    we fix the age calculation and flip the test.\n\n    commit 2\n    \n    diff
    --git a/dates.py b/dates.py\n    --- a/dates.py\n    +++ b/dates.py\n    @@ -1,7
    +1,10 @@\n    +from dateutil.relativedelta import relativedelta\n    \n     def
    age_in_years(birthday, today):\n    - return today.year - birthday.year\n    +
    return relativedelta(\n    + today,\n    + birthday\n    + ).years\n    \n     def
    can_access(birthday, today):\n         return 18 <= age_in_years(\n    diff --git
    a/test_date.py b/test_date.py\n    --- a/test_date.py\n    +++ b/test_date.py\n
    \   @@ -1,5 +1,5 @@\n     def test_can_access():\n    - assert test_can_access(\n
    \   + assert not test_can_access(\n            date(2008, 12, 31),\n            date(2026,
    1, 1)\n        )\n\n## Shouldn’t we use `XFAIL` instead?\n\nOkay, first of all,
    not every testing framework has an `XFAIL` equivalent (sigh, Java…).\n\nSetting
    that aside, a positive passing test isn’t completely logically equivalent to a
    positive failing test. Going back to our addition example, if we were to add this
    test,\n\n    Commit 1\n    \n    diff --git a/test_arith.py b/test_arith.py\n
    \   --- a/test_arith.py\n    +++ b/test_arith.py\n    @@ -0,0 +1,2 @@\n    +@pytest.mark.xfail\n
    \   +def test_add(a, b):\n    + assert add(2, 2) == 4\n\nThis test only tells
    us that the current addition isn’t four, but it doesn’t tell us exactly what the
    addition is. Depending on the nature of the bug, a positive failing test might
    not exemplify as clearly what exactly the bug is. Knowing that two plus two is
    five might make it easier to understand how to fix the bug.\n\nThat being said,
    using `XFAIL` is in general roughly equivalent. If for some reason we can’t currently
    fix the bug right now, only record it, an `XFAIL` is better, since we expect we’ll
    be carrying this around for a longer time.\n\n## What about bug tracking?\n\nAh,
    yes, it’s also a good idea to log a bug in your tracker.\n\nReference the bug
    in your first commit.\n\n    add a test showing the bug\n    \n    diff --git
    a/test_arith.py b/test_arith.py\n    --- a/test_arith.py\n    +++ b/test_arith.py\n
    \   @@ -0,0 +1,2 @@\n    +FIXME: bug #1729\n    +def test_add(a, b):\n    + assert
    add(2, 2) == 5\n\nRecord the fix in the second commit:\n\n    remove off-by-one
    error\n    \n    fixes: #1729\n    \n    diff --git a/arith.py b/arith.py\n    ---
    a/arith.py\n    +++ b/arith.py\n    @@ -1,2 +1,2 @@\n     def add(a, b):\n    -
    return a + b + 1\n    + return a + b\n    diff --git a/test_arith.py b/test_arith.py\n
    \   --- a/test_arith.py\n    +++ b/test_arith.py\n    @@ -1,2 +1,2 @@\n    -FIXME:
    bug #1729\n     def test_add(a, b):\n    - assert add(2, 2) == 5\n    + assert
    add(2, 2) == 4\n\n## Okay but why “Kluever Maneuver”?\n\nOh. Because my colleague
    [Kurt Kluever](https://github.com/kluever) taught it to me, and I immediately
    think back to him when I think of this technique. He usualy calls it “terrible
    tests”, as in “Jordi, can you please write a terrible test for this?” and off
    I go to write a test asserting something I know to be wrong.\n\n* * *\n\n ![](https://secure.gravatar.com/avatar/3d7505f1580f996cefb2df0ed70c6f6a3b0a5dec4679ff35ef830dd49a450f33?s=48&d=identicon&r=g)\n\n[Jordi](https://jordi.inversethought.com/blog/author/jordigh/)\n\nMexican
    free software enthusiast and mathematician.\n\n* * *\n\nPosted\n\nin\n\n[public](https://jordi.inversethought.com/blog/category/public/)\n\nTags:\n\n*
    * *\n\n«[Previous](https://jordi.inversethought.com/blog/exercising-software-freedom-on-firefox/)"
