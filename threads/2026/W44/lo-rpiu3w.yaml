  author: nedbat
  text: |-
    "Known failing" would let you do it in a more natural way: write the test for the correct behavior, and mark it as "expected to fail". Then you can commit the fix to the code, with the change to remove the fail expectation.
    The Kluever Maneuver seems odd to me: write the test confirming the wrong behavior. I'd rather have the first commit confirm the correct behavior with the @pytest.mark.xfail decorator.
    Doing it this way could also let you separate the two commits by a long period of time without having misleading tests in the code.
