  content: "# Copper\n\nCopper is a programming language that I use as a replacement
    to C. The main differences are:\n\n- Type inheritance for any type\n- Genericity\n-
    Multiple return values\n- Out-of-order definitions\n- Simple import system, no
    headers\n- Not everything in the global namespace\n- Deferred statements\n- Simple
    iterators\n- Ruby-style syntax\n- Option types\n- Fast compilation\n- Minimalism\n\nMinimalism
    is the most important feature, the language is intended to be simple so that someone
    with limited brain power such as me could fully understand it. The syntax is simple,
    almost everything is explicit and most constructs are common.\n\n## Example\n\nA
    simple example beyond the pointless \"hello world\".\n\n    class Point\n        attr
    x: Int\n        attr y: Int\n    \n        def init(x: Int, y: Int)\n            self.x
    = x\n            self.y = y\n        end\n    \n        def translate(dx: Int,
    dy: Int)\n            self.x += dx\n            self.y += dy\n        end\n    end\n
    \   \n    func main: Int\n        var pt: Point!\n        pt.init(3, 5)\n        pt.translate(1,
    0)\n        println(\"x = \\a, y = \\a\", pt.x, pt.y)\n        return 0\n    end\n
    \   \n    import \"std\"\n\n## More Information\n\n- [A quick overview of the
    language](overview.html)\n- [Documentation](documentation.html)\n- [Cheat sheet](cheat-sheet.html)
    - if you're not interested but want to understand existing code\n- [More examples](/browser.html?path=examples&title=Examples)\n-
    [Browse standard library source code](/browser.html?path=std&title=Standard%20Library%20Source%20Code)\n-
    [Browse compiler source code](/browser.html?path=copper&title=Copper%20Source%20Code)\n\n##
    License\n\nCopper is released under the BSD license."
