  text: |-
    I&#x27;d like to come up with some constructive comments, but I find everything so inconsistent and alien to me...<p>For example, variable declarations use the pattern &lt;colon&gt; &lt;type&gt;, as in<p><pre><code>  var a: Int32
    </code></pre>
    But literals follow the opposite syntax, as in<p><pre><code>  a = Int32: 42
    </code></pre>
    The return type of a function is introduced by : in func definitions, but by -&gt; in imported func declarations:<p><pre><code>  func foo(a:Int):Int
      import func bar(a:Int) -&gt; (Int)
    </code></pre>
    Other construct that I find far from my habits:<p><pre><code>  var w, h, d = 640, 480, 2
    </code></pre>
    instead of the more obvious (for me):<p><pre><code>  var w=640, h=480, d=2
    </code></pre>
    Arguments are passed by ref, not by val. Good luck with recursion!
