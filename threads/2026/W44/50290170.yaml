  author: mynameisash
  text: Except:<p>a. Even if this model were reasonable, removing trees isn&#x27;t
    ameliorated by letting them grow back in 2.5 days. As an analogy, if I steal $100
    from you, it&#x27;s not reasonable for me to say, &quot;But it only takes you
    x hours to earn that $100 back.&quot; No, you&#x27;re out that $100.<p>b. Tree
    growth (eg, carbon sequestration) is non-linear. The first year of growth of a
    tree is much less productive than the 50th year.
  score: 0
