  author: Polizeiposaune
  text: Add root barrier layers underneath the soil on top of the roof, and weed out
    tree species known to cause trouble..<p>See for instance <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Green_roof"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Green_roof</a><p>Significant
    soil depth can be part of the solution, which no doubt requires additional strength
    in the structure underneath the roof..<p>For a worked example:<p>&quot;The 5.4-acre
    green roof has soil depths that vary from 18 inches to 4.5 ft. This layered planting
    system is a structurally engineered component of the building that functions to
    balance seismic shifting, collect and filter stormwater, and irrigate the gardens.
    Geosynthetic fill was used to build up the rolling topography of the park while
    adding minimal weight to the structure.&quot;<p>From <a href="https:&#x2F;&#x2F;www.landscapeperformance.org&#x2F;case-study-briefs&#x2F;salesforce-transit-center-park"
    rel="nofollow">https:&#x2F;&#x2F;www.landscapeperformance.org&#x2F;case-study-briefs&#x2F;sales...</a>
    under the &quot;sustainable features&quot; tab.
