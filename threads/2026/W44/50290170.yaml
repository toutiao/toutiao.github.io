  author: saalweachter
  text: It also doesn&#x27;t necessarily protect you from anything by obtaining it.<p>If
    you, say, go and get a certificate of no-permit needed when you&#x27;re replacing
    all of your kitchen cabinets, and then you decide to move the sink while you&#x27;re
    at it, you&#x27;re back to still needing a permit for the plumbing change (and
    even if you aren&#x27;t, if your neighbor calls the inspector and says they think
    you might be, the inspector might say, &quot;no, we already know about that, it&#x27;s
    just cabinets&quot;, or they might wonder if you <i>are</i> and then you&#x27;re
    back in the situation you&#x27;d be in without the certificate).
