  author: DocTomoe
  text: 'Actually, that&#x27;s exactly how forestry departments think of forest: how
    many (harvestable) volume units of wood grows per time unit. No cute, parental
    firefighting bear needed: Smokey doesn&#x27;t like wildfires because burnt wood
    can&#x27;t be sold.'
