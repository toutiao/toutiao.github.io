  author: inglor_cz
  text: While this is indeed not how trees work, it puts the number into a useful
    perspective.<p>Finland, comparable in size to Montana, is basically one huge forest
    (75% tree cover) dotted with lakes, and a lot of those forests are harvested every
    year. Of the entire EU, this is probably the place where trees are the least rare.<p>250
    thousand trees cut down in England would have been a very different story.
  score: 0
  posted_at: '2026-10-29T16:15:16Z'
- id: '50291506'
  parent_id: '50290797'
  author: dosinga
  text: how is it not? Finland cuts down hundred of millions of trees every year.
    they grow back, that&#x27;s how their lumber industry works. Google presumably
    cut trees that were of a random age, not of harvesting age.<p>I realize it is
    seasonal, but the maths still works. distribute all trees in cohorts of three
    hours age. every three hours they move one up. every three hours there&#x27;s
    250k trees more over the entire range, allowing Finland to cut the mature trees
    to make paper.
  score: 0
