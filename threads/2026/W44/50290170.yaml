  author: ortusdux
  text: 'A friend worked in the US tree cutting permit process.  There were two main
    goals behind the permits (as I understand it):<p>1) To double check the harvest
    was not going to affect things outside their property (neighbors, land slides,
    erosion, etc), or special govt. interests on their property (endangered species)<p>2)
    To maintain their significant tax break.  The break was for owning forest land,
    and you needed a plan to replant successfully.<p>Keep in mind that these are mostly
    &#x27;working forests&#x27; that are more akin to wheat fields than wild forests.<p>It
    sounds like the issue was insufficient analysis of #1, resulting in excessive
    water run-off to neighboring privately owned property.<p>That being said, it could
    also be #2.  The same friend worked on &#x27;conversion&#x27; permits, wherein
    the owner asked to turn forest land into a residential or business property, and
    special considerations had to be addressed.'
