  author: saalweachter
  text: 'In the US there&#x27;s also a third category besides &quot;permit approved&quot;
    and &quot;permit denied&quot;, &quot;no permit needed&quot;: the thing you are
    doing is allowed and not covered by the permitting process.  You just do it.  This
    shows up in both building code (you typically don&#x27;t need a permit for most
    repairs or cosmetic renovations) and environmental protections (you don&#x27;t
    need an environmental study for logging in a non-protected forest).<p>The tricky
    part with &quot;no permit needed&quot; is that while you can just go and do whatever,
    if someone charged with enforcement suspects you&#x27;re doing something that
    requires a permit, they can still demand you prove you don&#x27;t (and stop work
    until you do), and if you guessed wrong and you did indeed need a permit, you&#x27;re
    double-fucked.<p>That&#x27;s why for many of these processes, there&#x27;s also
    something like a certificate of no-permit needed, where you go through an abbreviated
    permitting process spending a lot of time and money while all of the clerks and
    officials stare at you like you&#x27;re a moron before finally giving you a piece
    of paper saying you didn&#x27;t need to do any of that in the first place.<p>And
    that&#x27;s why a lot of people with a lot of experience and a good understanding
    of the law skip getting a &quot;no permit needed&quot; certificate.<p>I am assuming
    it&#x27;s similar in other countries.'
  score: 0
