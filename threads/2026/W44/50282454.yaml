  author: zahlman
  text: "<i>SO didn&#x27;t ban you for asking a bad question</i>, either. It just
    closed the question, and then if you kept doing it you might face restrictions
    on asking more, which, yes, ended with something far too harsh.<p>If the community
    could have tweaked that system, we absolutely would have. The site owners never
    gave us that access, and it got much worse after getting bought by Prosus.<p>But
    yes, on a Q&amp;A site <i>you absolutely should</i> be prevented from asking certain
    questions. The fact that they&#x27;re facially &quot;on topic&quot; <i>does not</i>
    save them, just like how there are guidelines to post on HN that go beyond &quot;make
    sure it has something to do with technology&quot;. Because <i>it is not the purpose</i>
    of a site like SO to answer your question just because you asked it. The purpose
    is to <i>have good Q&amp;A</i> that everyone can refer to in order to learn something.
    The root of the &quot;hostility&quot; is in the selfishness of those who won&#x27;t
    consider the perspective of everyone else who&#x27;s going to see the question
    later. Which, you know, is the exact problem with the traditional discussion forums
    that SO was created explicitly to provide an alternative to."
