  author: zahlman
  text: They really didn&#x27;t change their minds. The bulk of the prior meta Q&amp;A
    that people on the meta sites ended up citing to justify policy, all came from
    around 2014 and a fair bit of it was older than that. Plus there are numerous
    on-the-record statements from Atwood and Spolsky from 2011 or earlier that are
    broadly speaking consistent with the modern understanding.<p>However, they didn&#x27;t
    really understand what makes a question valuable, or <i>why</i> low-quality beginner
    questions are low quality, and thus what exactly to expect in order to get higher
    quality things that could be helpful to other beginners. And yes, they did initially
    make some gestures towards some threshold of question difficulty, but this was
    a misstep (and also hard to disentangle from question <i>complexity</i>, as well
    as whether a question is <i>interesting</i> and to whom). And yes there were experiments
    like the Documentation project (which I lamented the loss of). And yes the reputation
    system was a totally broken idea and implementation, inconsistent with stated
    goals.<p>It turns out that when you have a critical mass of users and the alternatives
    are frustrating enough, you can get away with a lot of those missteps.<p>As for
    enforcement, that&#x27;s what happens when the overwhelming majority of it is
    assigned as the community&#x27;s responsibility. Misconceptions about the site&#x27;s
    purpose compound when some users get away with them and then gain reputation from
    a single old&#x2F;popular Q&amp;A. (I had some, too.)<p>Fundamentally the site
    failed to figure out how to impress those values upon people before they got too
    involved. I think this was out of a fear of scaring users away, but clearly this
    was counterproductive — surfacing the misconceptions and conflicts later on only
    made things worse. An ideal system would have <i>started</i> questions closed,
    so that having one closed on you wouldn&#x27;t feel like a final judgement (despite
    it <i>not</i> being one); and it would have shielded you from downvotes until
    question opening (because the entire point of this would be to recognize that
    questions <i>require work by default</i> to meet the site standards). In other
    worse, what the half-baked Staging Ground was trying to accomplish (and mostly
    did, for the small minority of questions the system decided to send there at random).
  score: 0
  posted_at: '2026-10-29T20:54:33Z'
