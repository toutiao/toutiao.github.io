    the creator is very confused about what open source is and isn&#x27;t.<p>Here&#x27;s
    a summary:<p>- The project is licensed under the &quot;Corridor Key License&quot;
    [1], which is CC BY-NC-SA 4.0 with extra clauses that permit commercial use of
    you have their blessing (That&#x27;s right, CC BY-NC with commercial use allowed).<p>-
    CC licenses should not be used for software, and the non-commercial restrictions
    make this project not open source.<p>- This project is based on Hiera, which licenses
    its weights under CC BY-NC 4.0 [2]. Again, non-commercial. He is selling this.<p>-
