  content: "[AO3 Down for Maintenance](/incidents/g12jnxck9g6h)\n\n**Update** - Earlier
    today, we detected evidence of a security incident on AO3. We are still in the
    early stages of response to this security incident and determining its scope.
    AO3 will remain down while we continue investigating and addressing what has been
    found so far. However, we want to make some things clear:  \n  \nFirst, no AO3
    data has been deleted. All your works, bookmarks, kudos, etc., are safe.  \n  \nSecond,
    while we currently don't believe that the user database was stolen, we are also
    unable to rule it out. The AO3 database contains account information that may
    include your username, email address, IP address, and a hashed version of your
    password.  \n  \nWe use industry-standard techniques for storing passwords in
    a scrambled form that cannot easily be reversed. Even so, no hashing method can
    fully protect a weak or reused password from being cracked. As a precaution, we
    recommend that you change your passwords on any other sites where you use the
    same password as on AO3.  \n  \nAO3 does not collect real names, so none could
    be exposed. Additionally, our donor information is held in an entirely separate
    system and is never linked to AO3, so that data has also not been exposed.  \n
    \ \nWe will update everyone as our investigation continues; we may be unable to
    respond to individual inquiries from users. Please keep an eye on our official
    outlets for updates. Our next update will be posted when we have further information
    available.  \n  \nOur current expectation is that AO3 will be down for a minimum
    of two weeks; however, it could take up to four weeks. During that time, we may
    be able to bring the site back up in a degraded state, meaning that not all features
    will be available and/or the site may be read-only. If we are able to do that,
    please be aware that we might have to bring the site back down unexpectedly as
    part of our recovery efforts. We will keep you in the loop for any developments.
    \ \n\n**Update** - We estimate that service restoration for #AO3 will take around
    2 weeks but it could be up to 4 weeks. We are hopeful that we will be able to
    bring the site back up in a degraded state sooner. If that does happen, there
    may be times when the site has to be brought down temporarily until this is fully
    resolved. Please stay tuned for further info.  \n\n**Identified** - AO3 maintenance
    is in progress. We expect it to take at least 12 hours, but it may take longer.
    We will provide updates as necessary.  \n\n**Investigating** - AO3 is down for
    maintenance.  \n\n## [About This Site](#about-this-site)\n\nWelcome to the OTW
