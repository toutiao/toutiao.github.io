  author: mrob
  text: "&quot;Open weight&quot; is obviously intended to be analogous to &quot;open
    source&quot;. The name only exists because people rightly complained about people
    calling weights &quot;open source&quot; when they were not. As such, the most
    reasonable interpretation is something that obeys the Open Source Definition as
    closely as possible, but ignores clause 2 because obeying it is legally impossible
    when the source code infringes copyright (as is the case with almost all LLMs).
    If it ignores any of the other clauses, it&#x27;s instead closer to &quot;source
    available&quot; software, so the correct analogous name is &quot;weights available&quot;."
