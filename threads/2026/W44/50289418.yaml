    rel="nofollow">https:&#x2F;&#x2F;mistral.ai&#x2F;contact&#x2F;</a>, to request
    a commercial license.<p>&gt; &quot;Model as a Service&quot; means giving a third
    party access to the Model or its derivative works for inference or post-training
