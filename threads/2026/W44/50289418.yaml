    training data. This does not include (a) end-user products with model capabilities
    solely embedded within specific features or harnesses, or (b) mere relaying of
    requests to models hosted by others.<p>&quot;Meaningful control over the inputs&quot;
    is so ambiguous as to be nearly meaningless. Does a model merely summarizing a
