  author: MatthiasPortzel
  text: People have done experiments like this before.<p>Minecraft isn&#x27;t a intelligence
    problem. An LLM is more than smart enough to play Minecraft. It&#x27;s a robotic
    problem. Even a normal human player can click several times per second, can press
    two different buttons at the same time, etc. Mineflayer gives you an API that
    is more limited than a human in some ways (can&#x27;t see far away from you) and
    less limited in others (can see through blocks) (if I remember correctly, I could
    be thinking of Baritone or a different project). Robotics or playing a video game
    requires a tight continuous feedback loop. When there&#x27;s 500ms of latency
    in order to ask the model for every mouse movement, it&#x27;s no wonder fighting
    a spider is scary.<p>Fun fact, Mineflayer, the Minecraft bot interaction API used
    by YCombinator for these tests, was originally developed by Andrew Kelley (before
    he started Zig).
