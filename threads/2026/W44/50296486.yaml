  author: sadilek
  text: I also never understood this desire to build an agent org chart with persistent
    identities, often giving them names. Paperclip seems to advertise that model.
    I think it&#x27;s much simpler and more flexible to simply spawn an agent for
    each task.<p>One argument for the persistent identity model is that you can give
    them special skills and context. I don&#x27;t believe that&#x27;s a good argument.
    In my experience, you can just give each agent access to the full set of tools
    (including RAG search) in the form of documentation and skills, and they&#x27;ll
    use that efficiently. Skills have a tiny front matter and hardly bloat the context,
    and the documentation just needs to be tree-structured with cross-links for progressive
    disclosure. LLMs navigate that efficiently, so the cost of having all context
    accessible is low, while the risk of cutting the context boundaries for the persistent
    identities non-optimal for a given task is rather high IMO.
