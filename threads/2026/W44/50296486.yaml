  author: jandrese
  text: All of the agents struggle with knowing when to stop.  They can drive themselves
    insane inventing problems to solve after they arrive at a satisfactory answer
    for the current problem.<p>Keep this in mind when you see articles about how &quot;an
    AI agent uncovered a thousand issues in our codebase overnight&quot;.  A great
    many of those &quot;issues&quot; end up being that some process was not bureaucratic
    enough.
