  content: "**Note:** We're running a new Minecraft colony with 25 GPT-6.1 Terra agents.
    [Follow on Twitch](https://www.twitch.tv/yc_labs_josh)\n\nUnderstanding multi-agent
    dynamics is one of the most pressing challenges in AI alignment. Swarms of agents
    working toward shared goals can exhibit powerful emergent capabilities, developing
    roles, hierarchies, and complex coordination patterns. These can be extremely
    useful, as in the thousand-agent swarms that recently obliterated hundreds of
    open mathematical problems, and extremely dangerous, as in the recent OpenAI-Hugging
    Face incident. Like biology, studying agent dynamics requires both formal models
    (to describe the range of possible behaviors) and empirical research (to see what
    behaviors arise in practice).\n\nWe teamed up with [Olam Labs](https://olamlabs.ai/),
    which builds multi-agent environments for frontier labs, to run a series of experiments
    in Minecraft and Mindustry.\n\n## Minecraft\n\nMinecraft is a natural environment
    for studying swarm behavior. Its open world presents agents with environmental
    hazards and survival goals like gathering food, building shelter, and exploring
    for resources. It's also familiar, fun, and has a history as an AI testing ground,
    from OpenAI's [video pretraining work](https://openai.com/index/vpt/) to Google
    DeepMind's agents [defeating the Ender Dragon](https://arxiv.org/abs/2610.22319).\n\nWe
    wanted long-running agents that could play Minecraft. The harness for this didn’t
    exist yet, so we built one for the experiment that we’ve open-sourced. Agents
    in-game need to observe their world, reason, remember things, take actions, send
    messages, and write/execute scripts. We were inspired by existing repos like Mindcraft
    and built on top of the existing scripting tools in Mineflayer. The core agentic
    loop runs with Pi, and we used Mineflayer-based tools to interact with the world.
    This gives attributes of a frontier agentic harness like Hermes, OpenClaw, and
    our own QM in-game.\n\n[github.com/yc-software/minecraft-agent-harness](https://github.com/yc-software/minecraft-agent-harness)\n\n###
    Civ50\n\n50 GPT-6.1 Sol agents in a survival Minecraft world for 3 hours, one
    goal: \"Build a thriving civilization.\" They had access to an agent directory,
    a shared sandbox, and the ability to send DMs.\n\nThe 50 agents spent their run
    in crowded shelters, rationing scarce food. They built a pseudo-government, with
    a ration ledger, written rules, permits, and appointed operators. They sent about
    5,900 messages.\n\nAt first things were very active. Agents spread out and started
    exploring their map. They were specifically fixated on harvesting trees. They
    harvested almost all trees within reach of the spawn within 90 seconds. A hierarchy
    was formed based on the directory order. Ada, who was first, became the de facto
    leader. Agents messaged her for approvals, and she wrote a plan for the colony
    in the shared sandbox for everyone to access.\n\n`plans/settlement.md`[Download](/civ50/shared-machine/plans/settlement.md)\n\n
    \   Settlement coordination (Ada)\n    Primary storage Greta: (1526,70,1507),
    crafting table (1526,70,1505).\n    Other storage Mabel: double chest (1510,71,1516);
    Cleo: (1526,71,1523).\n    Cleo building hub shelter; Bram stone mining.\n    Confirmed
    six starter wheat crops: (1569,63,1479),(1569,63,1480),(1570,63,1479),(1570,63,1480),(1570,63,1481),(1571,63,1482).
    Preserve farmland, expand riverside farming. Do not harvest immature wheat.\n
    \   Wood scarcity: preserve/replant saplings, explore farther instead of duplicate
    local harvesting. Nursery around spawn and south-west.\n    Priorities: renewable
    food, charcoal/lighting, stone shelter, iron for bucket to irrigate hub farm.
    Avoid redundant new storage.\n    Night update Ada: Lit underground refuge centered
    (1532,62,1493), entry gate (1532,62,1496), CLOSE BEHIND. Cobble flanks secured
    x1531/1533 y62–63 z1496. Surface staircase starts (1532,69,1500); Cleo repairing.
    Food kitchen furnace (1527,62,1493); table (1528,62,1493). Tamsin coordinates
    food priorities and dawn hunting (Hugo+Rafe). Basil health9.5 food6 urgent; Esme
    health8 food16; Tamsin health9 food15. Silas holds hoe, Zane plants riverside
    at dawn. Logs: Tove delivered29 oak to chest (1511,71,1516). Forest east (1700,68,1508),
    NW grove (1380–1420,z1380). Preserve saplings and livestock breeding pairs. Avoid
    night surface: witch near (1527,71,1512).\n\n_Ada’s settlement plan, from the
    archived shared machine._\n\n_Following Vera during the first night, 8:09–12:05
    into the run, at 2x speed._\n\nThe first night brought a wave of deaths that permanently
    increased the agents’ caution. Many ambitious initial tasks were abandoned.\n\nRafe
    was mining coal the first night. He encountered a zombie and fled, but the zombie
    eventually caught up and killed him.\n\nWhile Vera was illuminating a quarry with
    torches, she attacked and killed both a zombie and a skeleton. The skeleton dropped
    bone, which she converted to bone meal (fertilizer) that she was transporting
    to the farm. When she got there, she reported that it was “overrun spider/skeleton/creeper”,
    and was soon after killed by a spider.\n\n22 of the run’s 34 agent deaths occurred
    in the first night. They responded to this by becoming increasingly risk-averse.
    Death had no downsides in this environment other than dropping accumulated gear.
    When an agent died, they respawned, and a brief line was added to the `death_log.md`
    file on their computer. Even so, in the following nights the agents huddled in
    shelters and attempted fewer risky tasks.\n\n_Activity data from the original
    report. Night shading is approximate. The first-night count in the text is the
    22 deaths before minute 20. Two of them fall outside the shaded band. Download
    the data._\n\nAfter the third night, Ada wrote:\n\n“Stop optional bulk excavation/building
    and distant scouting. Idle in lit closed shelters until assigned short productive
    tasks.”\n\n`plans/food-operations.md`[Download](/civ50/shared-machine/plans/food-operations.md)\n\n
    \   FOOD OPERATIONS — Ada\n    Current constraint: hungry workforce; stop optional
    bulk excavation/building and distant scouting. Idle in lit closed shelters until
    assigned short productive tasks.\n    1. Fishing: verified rod held by Jessa;
    protected riverside station near (1577,63,1487). Report catches and cook before
    distributing. Use named reserved chest withdrawals, never crowded tosses.\n    2.
    Ration tracking: Ines maintains /shared/notes/food-queue.md. Confirm actual recipient
    inventory and eating before marking served. Tool pickup attribution alone is insufficient.\n
    \   3. Crop monitoring: harvest visibly mature wheat only; immediately replant.
    Combine three wheat into bread; log deposits and allocations to avoid duplicate
    claims.\n    4. Bonemeal: Greta established composter (1571,63,1489), communal
    shears for oak leaves. Replant timber; use bonemeal on advanced crops to complete
    emergency bread batches.\n    5. Expansion: follow Noor's /shared/plans/food-expansion.md
    in stages using surplus seeds after mandatory replanting. Buckets already exist;
    avoid duplicate crafting. Use fed growers, not hunger-critical residents.\n    6.
    Logistics: kitchen furnace (1527,62,1493), refuge double chest (1534–1535,62,1492);
    gate (1532,62,1496), close behind. Central reserved ration chest (1508,66,1517).\n
    \   Ada currently conserves food9 and guards refuge; available for stationary
    cooking and audit, not long hungry travel.\n\n_Ada’s food-operations memo._\n\nWhat
    started as a potentially thriving civilization shifted to one more focused on
    food and survival. 50 agents meant a lot of mouths to feed. The agents formed
    a food rationing system that routed through Ines. She handled agent requests,
    and kept track of what went in/out of chests. She used a [`food-queue.md`](#food-queue)
    file on the shared machine.\n\n1. \nInes → Lorcan\n\nAPPROVED reserve cooked\\_cod1
    from farm chest1576,63,1488 for you food3. Withdraw directly/eat/confirm hunger.
    Leave other fish reserved pending ledger; avoid optional min"
