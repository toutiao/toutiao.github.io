  author: ratorx
  text: The issue might be Root CA vs intermediates. The root CA that eMudhra rolls
    upto may be used for other intermediates which were not compromised or revoked.
    Removing the root CA will mean that these valid certificates no longer work.<p>This
    is technically a problem in the CLI - it needs to support revocations properly,
    not rely on root CA verification only. I’m not sure though whether there’s a standardised
    mechanism (that Apple supports) for CLIs.<p>&gt; These steps affect every tool
    that uses &#x2F;etc&#x2F;ssl&#x2F;cert.pem. Afterward, tools that use only this
    file might not be able to verify some websites whose certificates chain to these
    root CA certificates through intermediate CAs that weren&#x27;t affected.
  score: 0
