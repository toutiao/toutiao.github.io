  author: david_chisnall
  text: |-
    I’m not sure I agree with this. I tend to build public APIs in layers. The low layer public API exposes all necessary functionality. The higher layers expose convenient functionality for common use cases. In C/C++, the higher-level interfaces are often header-only and designed to be inlined in the caller. They also serve as documentation: if you have a use case that is similar to this common case, you can use the body of this wrapper API as inspiration for how you should be calling the lower layer.
    The fact that the lower layer now has additional constraints on its refactoring is a feature. It’s a public API, it should be stable. If the low layer wasn’t useful for implementing the higher layer, then it also probably want useful for other consumers.
    I think the real messages should be:

    Build public APIs to meet requirements and be stable.
    Understand the layering in your system and don’t have lower layers depend on higher layers (except via explicit dependency injection).
    Design your APIs to be composable.
