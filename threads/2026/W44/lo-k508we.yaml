  text: |-
    That's a good observation, that there are many different ways to cut the interfaces such that pure  business is on the one side, and side-effecting syscalls are on the other. And any cut works! But I think ideally you actually want two:

    Most importantly, you cut the thinnest waist that connects your app to the external world (the trick here is architecting your application in a way that creates thin waist. Eg, you can have MyCustomeResourceStore, our you can can sprinkle raw SQL calls all other the place).
    But then, to test implementation of the thin waist itself, you want to cut at the layer of syscalls. This second cut is significantly messier, and gives relatively less bang for buck, but is still a good idea to have.

    The first layer tests logical, the second layer tests physical.
