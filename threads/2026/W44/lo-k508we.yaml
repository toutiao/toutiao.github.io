  text: "Instead of reading my comment, you should watch Gary Bernhardt's superb talk
    \"Boundaries\", which discusses this very question.\nhttps://www.destroyallsoftware.com/talks/boundaries\nBut
    I'll try to do a very brief answer to only your question. Your question sounds
    like it assumes a code structure that looks like this ...\ndef my_procedure():\r\n
    \   input_data = my_custom_resource_store.load()\r\n    ... big block of logic
    that analyses input data and takes actions ...\r\n\n... and now you're wondering
    whether to test the logic by mocking out MyCustomResourceStore.load(), or by mocking
    out the filesystem/database/network calls inside of MCRS.load().\nYou can sidestep
    that dilemma if you refactor this so the logic function does not call MCRS at
    all. Instead, extract a pure input-values-in, decision-values-out function. Then\n\nThe
    logic can be tested with lots of unit tests because it has many paths, but no
    external dependencies.\nAnd you test MCRS.load() by an integration test, or by
    mocking out the lower-level IO calls.\nAnd the function lying above both is hopefully
    so trivial that it hardly needs testing -- it doesn't do IO, and it doesn't do
    logic -- it just threads the data from the MCRS call to the logic function, which
    is something the typechecker can check for you."
