  author: snej
  text: This is especially true when some internal state is guarded by a mutex. In
    that situation there’s the danger of a function holding the mutex calling another
    function that acquires the mutex, causing deadlock. If you have a rule that public
    functions grab the mutex and internal functions can assume the mutex is held,
    and the class never calls its own public methods, you avoid the problem.
