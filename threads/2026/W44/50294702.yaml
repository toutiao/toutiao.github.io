    cherish the peaceful ease and reflection on his face, an enduring reminder of
    his invincible grace.</i><p><i>A son of Mirfield in the West Riding of Yorkshire,
    he travelled from the Royal Shakespeare Company to an equally acclaimed career
    spanning six decades on Broadway, the silver screen and television.</i><p><i>His
