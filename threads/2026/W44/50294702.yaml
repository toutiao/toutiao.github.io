  author: WalterBright
  text: Keep in mind that Star Trek is a <i>fictional</i> utopia. When writing a script,
    one can make anything work out well.<p>The original Star Trek was Roddenberry&#x27;s
    vision of utopia. The benevolent dictator always makes the right decisions. He&#x27;s
    surrounded by his loyal band of perfect lieutenants, who apparently have zero
    desire to advance, and have no flaws at all. Any and all of them are willing to
    sacrifice themselves for the others. None do anything bad (unless it&#x27;s a
    plot device with an explanation that absolves them).<p>Don&#x27;t get me wrong,
    I&#x27;ve enjoyed watching ST very much. Just keep in mind that that it&#x27;s
    a fiction.
  score: 0
