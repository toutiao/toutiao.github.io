  author: tgtweak
  text: 'Had the pleasure of working with Jason Garrett-Glaser (better known as DarkShikari)
    circa 2011 on a patch for x264 to better utilize more cores (slice-threaded lookahead).  At
    the time he was working with Sony to optimize their PlayStation game streaming
    service, and this had the potential to lower encoding latency (critical to game
    streaming) even on same-core systems by spreading the frame over more cores to
    do more parallel work, and doing more intelligent scheduling and convergence after
    that tile-based work was reconverged into a frame. At the time we were using servers
    with 48 physical cores to do transcoding, a bit of a rarity in a single NUMA space
    back then and there were no instances to test this on so I flamegraph traced a
    few encodes at very high thread parallel counts and send back the instrumented
    profiles (from a custom compiled version) showing the core work being done and
    he used that to optimize the motion estimation code which worked on the first
    shot to perfectly level out cpu usage and increase encoding speed across ~24 cores
    (was previously topping out around 8 and running one core hot iirc).  I got a
    look into how exotic and complex this project was, particularly in terms how low
    level and advanced things like motion estimation, quantizing and perceptual compression
    were... it was and still is sort of magic how many smart techniques are baked
    into something that we barely pay attention to.  They were, even at that time,
    working on x265.<p>His blog, Diary of an x264 developer, was a great read too
    for anyone wanting to get a vantage point on how crazy that codebase was.<p>[1]<a
    href="https:&#x2F;&#x2F;github.com&#x2F;mstorsjo&#x2F;x264&#x2F;blob&#x2F;master&#x2F;doc&#x2F;threads.txt"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;mstorsjo&#x2F;x264&#x2F;blob&#x2F;master&#x2F;doc&#x2F;threads.txt</a><p>(edit:
    was Gaikai that was acquired by Sony in 2012 and is the basis for PlayStation
    Now)'
