  text: One uncommonly used feature of H.264 is support for lossless video.  It&#x27;s
    a bit hard to use due to tooling (not easy to discover and select the feature),
    and is sometimes incompatible with web browsers, but you can get actual lossless
    video using a mainstream video codec.  You can verify that it really is lossless,
    and doesn&#x27;t have any conversion step where it&#x27;s quantized to 8-bit YUV.<p>&quot;x264vfw&quot;
    is one tool which supports this format, even inside of an AVI file.  So older
    software that uses Video For Windows can create those files.
