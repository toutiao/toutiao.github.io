  author: dizzant
  text: I&#x27;m surprised that 10 years later, the article still teaches an incorrect
    conceptual understanding of &quot;quantization&quot;.<p>The context heavily implies
    that quantization is &quot;discarding information&quot; generally (e.g. clipping,
    masking). The wikipedia article he links in the footnote disagrees, and so do
    I:<p>&gt; quantization is the process of mapping input values from a large set
    (often a continuous set) to output values in a (countable) smaller set, often
    with a finite number of elements.<p>Quantization is a function over values, or
    the image itself. Clipping and masking, by contrast, are functions over the space&#x2F;frequency
    dimensions, i.e. the pixel indices (&quot;preimage&quot;). A rule like &quot;apply
    a circular mask&quot; or &quot;drop the first quadrant&quot; does not depend on
    the values!<p>The most extreme example of quantization is a threshold filter.
    Regardless of location, output &quot;1&quot; if the pixel is brighter than X,
    or &quot;0&quot; otherwise. This depends only on the value, not on the location.
    He also misses the opportunity to point out that chroma subsampling is another
    application of quantization, this time to chroma values (drop the low-order bits).<p>Codecs
    like H.264 and JPEG use spatially-varying quantization rules to effectively discard
    more information at high frequencies, so his explanation of H.264 is spot on,
    but a non-expert encountering quantization for the first time would probably come
    away with the wrong idea. For an article explicitly targeted to non-experts that
    goes out of its way to introduce the term, it&#x27;s a pretty important oversight.
  score: 0
