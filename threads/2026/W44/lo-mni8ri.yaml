    I just said what I said and it was wrong  \n Or was taken wrong\n\n \n\n[Previous
    post](https://leancrew.com/all-this/2026/10/squaring-the-triangle-with-help/)\n\n#
    [XKCD and Fourier](https://leancrew.com/all-this/2026/10/xkcd-and-fourier/)\n\nOctober
    29, 2026 at 8:45 PM by Dr. Drang\n\nIf you’ve done Fourier series approximations
    of functions, you had three reactions to [today’s XKCD comic](https://xkcd.com/):\n\n![https://imgs.xkcd.com/comics/gravitational_square_wave.png](https://imgs.xkcd.com/comics/gravitational_square_wave.png
    \"https://imgs.xkcd.com/comics/gravitational\\_square\\_wave.png\")\n\nFirst,
    of course, was a smile of recognition. Then came a “wait a minute” as you realized
    that the [Gibbs phenomenon](https://leancrew.com/all-this/2023/02/swings-and-roundabouts/)
    doesn’t get smaller as you add more terms to the Fourier expansion; it just concentrates
    itself at the corners:\n\n![Gibbs phenomenon examples for square wave](https://leancrew.com/all-this/images2023/20230213-Gibbs%20phenomenon%20examples%20for%20square%20wave.png
    \"Gibbs phenomenon examples for square wave\")\n\nThat ringing never goes away.
    Here, for example, is the plot for\n\n![Square wave approximation](https://leancrew.com/all-this/images2026/20261029-Square%20wave%20approximation.png
    \"Square wave approximation\")\n\nFinally, you realized that thinking like this
    ruins the joke.\n\n[Previous post](https://leancrew.com/all-this/2026/10/squaring-the-triangle-with-help/)\n\n
