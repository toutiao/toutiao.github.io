  url: https://radiaverse.com/
  title: Radiaverse – Global Radiation Map
  fetch_status: success
  content: "Where curiosity meets discovery\n\n# The world’s radiation map, measured
    by its people\n\nThousands of RadiaCode owners record dose rate wherever they
    walk, drive and fly. Radiaverse turns those tracks into one shared map, with the
    places worth knowing about described by the people who found them.\n\nMeasurements
    added per week, last six months\n\nTracks published per week, last six months\n\n##
    From a pocket detector to a shared map\n\nEverything on the map is public and
    free to browse. An account is only needed to publish.\n\n- MeasureA RadiaCode
    detector in your pocket logs dose rate and location every second, on a walk, a
    road trip or a flight.\n\n### Measure\n\nA RadiaCode detector in your pocket logs
    dose rate and location every second, on a walk, a road trip or a flight.\n\n-
    Share a trackPublish the recording from the RadiaCode app. Your track joins the
    map, anonymously if you prefer, and its points feed the hexagon layer everyone
    sees.\n\n### Share a track\n\nPublish the recording from the RadiaCode app. Your
    track joins the map, anonymously if you prefer, and its points feed the hexagon
    layer everyone sees.\n\n- Explore and describeZoom from country coverage down
    to single measurements. Found something? Outline it as an area, add photos and
    context, and discuss it with others.\n\n### Explore and describe\n\nZoom from
    country coverage down to single measurements. Found something? Outline it as an
    area, add photos and context, and discuss it with others.\n\n## Radiation mapping
    near you\n\nWhat the community has already measured in your country, and who is
    doing it.\n\n### United States\n\n#### Top contributors\n\n- 1CACaboosey74 km²\n\n-
    2W5W5SAT35 km²\n\n- 3TRTrapper26 km²\n\n#### Most liked areas\n\n- 1Turkey Creek
    Rd.7\n\n- 2Natural History Museum of LA County6\n\n- 3American Natural History
    Museum at New York City6\n\n## New on the map\n\nAreas with photos or videos published
    in the last month, the freshest and most discussed first.\n\n### Thorium sand
    mix\n\nPublic access. Was just walking till I noticed it going off and seeing
    the reddish sand.\n\n### Aiken Canyon Preserve\n\nAiken Canyon is a wildlife preserve.
    There is a trail ending in ruins of an old structure which shows levels of .35
    to .47 microsieverts.\n\n### Parkoviště před areálem Rožná\n\n### oblast zkušebních
    vrtů (900m hluboko)\n\n### Jasenice, oblast zkušebních Vrtů\n\nOblast zkušebních
    vrtů v okolí uranového dolu.\n\n### STORE\n\nStore antiquités\n\n## Who is mapping
    the world\n\nCoverage counts unique cells at street resolution, so driving the
