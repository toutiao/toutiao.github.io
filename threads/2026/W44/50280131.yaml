  author: defrost
  text: Good addition, cheers for that.<p>For context that above is <i>processed</i>
    and <i>reduced</i> data, for those that care.<p>The raw data (which was once online
    (and may still be, having shifted)) is full 256 channel counts + height + distance
    to ground + raw GPS packets + post processed GPS position + etc... straight out
    of the airframes (and additional &quot;meta&quot; data - the concurrent calibration
    runs, stripping weights, raw GPS base station packets, etc).<p>The data linked
    above is three values per grid cell post process - the full spectrums are normalised,
    then U-K-Th (Uranium, Potassium, Thorium) decay product peaks are extracted to
    reconstruct estimated U-K-Th values for a grid cell (and a pseudo colour image
    created from those three values)<p>Great for background environmental radiation
    mapping - useless for spotting out of band &quot;stray&quot; radiation events
    not of a natural origin.<p>For that you want to subtract a NASVD kernel from the
    data and look to the leftover peaks between the big three daughter decay peaks
    ( and similarly for removing radon smear, etc ).
