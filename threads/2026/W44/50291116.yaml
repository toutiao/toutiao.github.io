  author: shong0504
  text: Yes you&#x27;re absolutely right about that. We talked to a bunch of aerospace
    teams who tried to use Renode and QEMU in their CI, but ended up scrapping it
    because their timing mechanisms were terrible and very inaccurate.<p>We do try
    to make our simulations as timing-accurate as possible. We are going to publish
    a report soon, to outline every gap between silicon and simulation, so these teams
    know exactly what to expect.<p>We&#x27;re also not trying to replace HIL testing.
    As a firmware engineer myself, I know that hardware is and will always be the
    source of truth, and we&#x27;re not changing that. What we can do, is reduce the
    amount of testing that needs to be done on hardware, because HIL testing will
    always be slow and clunky. Things like application logic, and replicating garbage
    data on something like a CAN bus, is much better suited to be tested in simulation,
    and that&#x27;s the gap we are focusing on.<p>Let us know if you have any other
    questions!
