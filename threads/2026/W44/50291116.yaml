  author: shong0504
  text: I would say that is true, that hardware vendors should and can provide simulation
    models with their hardware. We know they can because they rely entirely on simulation
    to test their chips before tapeout.<p>We even tried to work with chip vendors
    (won&#x27;t name here but they are 2 out of the 10 biggest microcontroller designers),
    but in reality, them providing their own simulation is a little bit counterintuitive
    for them.<p>They make their money on selling chips, and their thought is that
    providing a simulator would make it so that people buy less chips. If they do
    provide a simulator, it would be hella expensive, like through the Synopsys Virtualizer,
    which costs $500k per seat.<p>For RISC-V and open-source MCUs, they are easy to
    simulate. Just run the RTL through something like Verilator, and you have a fully
    working simulation.<p>We do hope that chip companies eventually do exactly that.
    We are also firmware engineers, and our goal is to make the simulation software
    we needed while working in the field. Either we make it, or they make it. Win-win
    in my opinion.
