    <p><pre><code>  &gt; If basically everything is &lt;X&gt;, does that word mean much then&#x2F;is it a useful term?
     </code></pre>
    Yes and no, because nothing is as well defined as you imply.<p>Let&#x27;s let X = &quot;chair&quot;, to make my point a little more fun.<p>Obviously we know what a chair is, use the Potter definition[0]. Everyone has several of them in their houses, offices, and all around. But can you state a well defined definition? Is a table a chair? I can sit on it (I often do), it has four legs, and practically all things we&#x27;d consider a chair. Okay, it has no back (usually), but then we got to throw out the stool. It has no back. It doesn&#x27;t even have to have 4 legs! So what about that stump on the ground? Is that a chair? I think most people would argue through a definition of convenience. Or maybe closer to a cat&#x27;s definition of &quot;if I fits, I sit.&quot;<p>You can replace X with just about anything and you&#x27;ll find this ambiguity runs rampant. A cup, a table, cereal, sandwich, a tomato; you name it and I&#x27;m sure someone here will point out an instance that makes that definition look a lot fuzzier than you initially thought.<p>So that really shows us the crux of it all: how <i>well defined</i> is something. That only tells us our ability to distinguish something, though it doesn&#x27;t tell us how well that thing fits into the category. So the stump is a little chair-like, the table is pretty chair, a stool is usually considered a chair, and that thing I&#x27;m sitting on is unambiguously a chair[1]. s&#x2F;chair&#x2F;intelligence&#x2F;g and you have your answer. But the if you needed that last sentence, well, there&#x27;s two types of people: those that can infer.<p>All models are wrong, but some models are useful<p>[0] Incidentally this is also a good definition for explaining RLHF and has all the same problems: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;I_know_it_when_I_see_it" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;I_know_it_when_I_see_it</a><p>[1] Though that doesn&#x27;t mean it also isn&#x27;t other things!
