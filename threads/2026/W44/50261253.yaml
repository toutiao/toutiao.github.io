  author: godelski
  text: |-
    I&#x27;ll highlight the gp&#x27;s point here because it is subtle but important<p><pre><code>  &gt;&gt; words that label parts of continua are useful
    </code></pre>
    and I&#x27;ll add one more point: there&#x27;s a difference in how people speak colloquially and how words are used by experts. In fact, different groups of experts may use the same word to mean different things (e.g. a mathematician and mechanic both call things &quot;manifolds&quot;, yet you shouldn&#x27;t confuse them). Natural language is highly overloaded (which is a big reason we invented formal languages).<p>A problem with the word &quot;intelligent&quot; is that very few people look to see how it is actually used in different fields like neuroscience, psychology, or machine learning, which all use the word a bit differently, and none of them use it in the way that we use in natural speech.<p><pre><code>  &gt; &quot;yellow&quot; that isn&#x27;t every color.
    </code></pre>
    But I can ask you how &quot;yellow&quot; is the color green. It is certainly some yellow. Definitely more yellow than red is. Even more so, we might argue over if black is more yellow than white or not. Which in some settings black is more yellow than white and in other settings white is more yellow than black. Hell, the fact that you can read this and understand it is clear evidence of both utility and ambiguity. We haven&#x27;t even mentioned that people may use the same definition but use a word to mark a certain threshold and disagree on that threshold (the root of so many painful to watch arguments).<p>Everything is just a bit fuzzier than you think.
