  author: Animats
  text: |-
    The ancestor is not Braitenberg. It&#x27;s Grey Walter&#x27;s turtles.<p>In 1948, W. Grey Walter built two simple robots that could sense light and touch.[1] Much complex behavior emerged. That&#x27;s where this idea started.<p>Watch the video.[2] It&#x27;s very impressive for 1948 and tube technology.
    If you&#x27;ve seen an original Roomba, you&#x27;ve seen a similar level of intelligence. Rod Brooks went down this road. But it didn&#x27;t go very far. There are severe limits to purely reactive robotics. It doesn&#x27;t work well for anything that moves fast enough that inertia matters.<p>[1] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Elmer_and_Elsie_(robots)" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Elmer_and_Elsie_(robots)</a><p>[2] <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=lLULRlmXkKo" rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=lLULRlmXkKo</a>
