    users have become evangelists for their own disempowerment. They demand that all software be “intuitive,” by which they mean idiot-proof, so simple that a n00b can use the software effortlessly and effectively.

    This reads exactly like a lot of anti-Mac screeds I read in the 1980s. Users should push for software to be intuitive, even if it’s not completely possible. That pressure is what’s gotten us from the dismal UX of the early personal computer era to today.

    A common conceit is that the Mac was easier to use than other computers out of the box; the reality is that the Mac was easier to use after the initial learning curve.

    But DOS and its programs also had a learning curve, one that was considerably steeper. The Mac actually was easier to use. I was there, I remember.
