    (This is my third comment, and I will be careful not to dominate the conversation on this post, so I may not respond if you reply.)

    But DOS and its programs also had a learning curve, one that was considerably steeper. The Mac actually was easier to use.

    I was never a dedicated Mac user and don't have a lot of experience of this era (or, to be frank, a reliable and objective recollection of what things were like more than, say, five or ten years ago,) but did you never have an experience like the author mentions in the article of theirs they cite?

    My contention is that if an adult with no college degree (my dad) and a kid with no high school degree (me at the time) could learn how to use an Apple II+ and become power users, then this skill is well within the capabilities of so-called “ordinary people.”

    — https://lapcatsoftware.com/articles/2026/3/5.html
    I seem to remember having family members who never considered themselves good at computers, who were not only not offended but actually resonated with a “… for Dummies” framing, that had no formal technical background and maybe even some gaps in their formal educational background, who were able to use these early DOS-like interfaces to do complex, useful tasks.
    Obviously, modern computers can operate at scales far beyond those of that era, but I don't seem to recall that having any material consequence on the complexity of the task and the demands on the intuitiveness of the UI.
    For example, I seem to recall visiting the workplace of a relative who was a city office worker using some kind of custom (?) spreadsheet-like software in a largely command-line-like interface (with “cheatsheets” of memorised commands taped on every side of their monitor) to help track restaurant health inspection compute key epidemiological statistics for the municipality.
    Of course, a modern computer with our modern interfaces can do this same task much faster with orders of magnitude larger data sets and can do components of this task with far greater richness (e.g., much more sophisticated numerical analysis or simulation,) and maybe can even do this (even prior to the LLM era) with one officer worker instead of three, (and, of course again, there are accessibility and other features that simply didn't exist in that era, so there are modern staff who can do this work today who might not have been able to do it in the past)… but even though the modern interface is significantly more “user-friendly,” the old interface seems to have been sufficient for this much less specialised user to accomplish a task of roughly the same fundamental operational complexity. (“Operational complexity” suggesting, for example, that computing some population statistic on a billion rows versus one hundred rows necessitated computational advances, but did it really require a different user interface…?)
    So I'm asking this, not because I deny that interfaces have improved or even to suggest that some kinds of interfaces like touch are bad (in fact, there are real tasks where they extremely well-suited,) but instead to probe whether the evolution of interface design was actually directed by user requirements, and whether interfaces that we might casually dismiss as out-dated or non-intuitive may actually have better captured inherent complexity of high-value tasks.
    (So that I may prefer vim over Visual Studio Code is not merely because I am a curmudgeon or because I am an elitist, but because it may actually, genuinely be better at the task and, in the totality of [this phase of] my career, the most intuitive choice. Sure, I may have needed to spend one week learning the tool… but the result is that I am so much more effective at high complexity, high value ad hoc tasks and workflows that this investment pays for itself many, many times over in ways that would be far more expensive or even impossible with an alternative.)
