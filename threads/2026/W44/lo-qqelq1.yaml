  content: "# Design the interface for functionality not familiarity\n\n### October
    29 2026\n\nThis blog post is about touch screen Macs, but I’ll start by talking
    about touch screen cars. Vehicle manufacturers have increasingly replaced physical
    controls in cars with touch screens, and it hasn’t gone well, because the touch
    screens frustrate drivers. As a resident of the Upper Midwest who drives wearing
    gloves in the winter, I suspect that the idea for touch screens came from somewhere
    warmer than the traditional home of the automotive industry, Detroit. For further
    reading on the serious, indeed dangerous problems with touch screens in cars,
    I found a couple of recent articles from [Popular Mechanics](https://www.popularmechanics.com/cars/car-technology/a64543699/touch-screens-making-cars-worse/)
    and [The Conversation](https://theconversation.com/yes-those-big-touchscreens-in-cars-are-dangerous-and-buttons-are-coming-back-272704).\n\nSmartphones
    have become ubiquitous, bringing ubiquitous familiarity with touch screen interfaces.
    Nonetheless, a touch screen is not the best interface for all purposes. In the
    case of cars, familiarity breeds contempt! The introduction of touch screens to
    smartphones was inspired by the physical limitations of the devices. The largest
    iPhone ever made, the new iPhone Duo, is still significantly smaller when unfolded
    than the smallest MacBook. Needless to say, the original 2007 iPhone was tiny
    compared to a MacBook. Mobile phones with a physical keyboard must have a correspondingly
    smaller screen, so manufacturers eliminated the physical keyboard to maximize
    screen size, relying entirely on a touch screen interface, including a software
    keyboard. In this case, touch screens were well motivated.\n\nOver the years I’ve
    owned many different computing devices of various sizes; from Apple: iMac, Mac
    Pro, Mac mini, MacBook Pro, iPhone, iPad. I’ve never once tried to control a Mac
    by touching its screen, not even absentmindedly. I simply never developed that
    habit. Many other people, however, when first introduced to a Mac, having only
    used touch screen computers such as smartphones and tablets, habitually attempt
    to control the Mac by touching its screen. This habit or expectation is cited
    as justification by defenders of touch screen Macs. In a [Wired interview](https://www.wired.com/story/the-inside-story-of-why-apple-finally-brought-a-touch-display-to-the-mac/)
    yesterday, Apple Senior Vice President of Worldwide Marketing Greg Joswiak said,
    “There’s a generation of young creators and young people using our MacBook Pros
    that expect to touch.” In my opinion, such an expectation is a terrible reason
    to introduce touch screen Macs. The habit of touching Mac screens can be broken
    and is worth breaking, because for most purposes the traditional Mac interface
    of a keyboard and indirect pointing device (mouse or trackpad) is so much more
    powerful and productive than the touch screen of an iPhone or iPad.\n\nBefore
    you cite the ungodly AAPL market capitalization as proof that Joz’s opinion trumps
    mine, consider how Apple is the same company that gave us howlers such as the
    trash can Mac Pro, Touch Bar, butterfly keyboard, Liquid Glass, and gave a gold
    statue to Trump. I’m not even making any claims about the future profitability
    of touch screen Macs. I just think it’s a poor design.\n\nIronically, people like
    me who were introduced to computers before the smartphone era are ridiculed as
    “resistant to change,” yet I’ve managed to learn how to use iPhones and iPads
    (the latter without a keyboard), so why can’t people who were introduced to computers
    during the smartphone era learn how to use Macs? Let me quote from a blog post
    I wrote earlier this year, [If computers are the future, why are computer users
    expected to be permanently illiterate?](/articles/2026/3/5.html)\n\n> The iPhone
    seems to have engendered a culture of anti-intellectualism and learned helplessness
    so pervasive that users have become evangelists for their own disempowerment.
    They demand that all software be “intuitive,” by which they mean idiot-proof,
    so simple that a n00b can use the software effortlessly and effectively. A suggestion
    to read the fine manual is greeted with charges of user hostility. Those who habitually,
    endlessly scroll YouTube or social media would balk at investing a little time
    to master the computing tools they use daily. Perhaps they would be surprised
    to learn that the supposedly intuitive 1984 Macintosh came with [170 page manual](https://archive.org/details/1984macintoshmanual/).
    A common conceit is that the Mac was easier to use than other computers out of
    the box; the reality is that the Mac was easier to use _after_ the initial learning
    curve. The system went out of its way to establish internal consistency and interoperability,
    but the user first had to make sense of the system and its principles.\n\nA MacBook
    Pro is bulkier than an iPhone, can’t fit in your hand or your pocket. That’s a
    disadvantage. Thankfully, a MacBook Pro has many advantages that outweigh the
    disadvantages. The larger screen size, the physical keyboard, and the less restrictive
    operating system allow Mac users to perform the same tasks with vastly greater
    ease than on iPhone or iPad and, moreover, to perform tasks not even possible
    on iPhone or iPad. It’s a shame to introduce new users to Mac by telling them
    to use it in the same way they used their old familiar devices, which are strictly
    limited by both hardware and software. A Mac is a terrible thing to waste! Not
    only functionally but also financially, since Macs on average have higher prices
    and longer effective lifespans than iOS devices. Steve Jobs (long before iPhone)
    called computers “bicycles for our mind.” I feel that adding touch screens to
    Macs is like adding training wheels to our bicycles. Some kids are given training
    wheels temporarily, but the ultimate goal is to outgrow training wheels, not to
    grow into them. The difficulty of learning to ride a bike without training wheels
    pays off in short order, giving the rider greater speed and maneuverability. In
    what dystopia would we consider training wheels the future of biking? (I suppose
    the same dystopia that would remove the steering wheel from our cars.)\n\nIn general,
    Hacker News comments tend to be appalling. Occasionally, though, there’s a diamond
    in the rough. I’d like to end by quoting [one of those](https://news.ycombinator.com/item?id=50277746).
    Admittedly, I haven’t independently verified the veracity of the comment, but
    it seems truthy enough to cite, at least as fodder for debate:\n\n> I bought a
    laptop for a relative and didn't realise it doesn't have touchscreen. They complained
    for a day and I often saw them try to touch the screen and then being disappointed
    it doesn't work. Week later they never mentioned it again and use the laptop just
    fine.\n> \n> When I was buying them a second one and asked about touchscreen,
    they said they don't care anymore for it, so second laptop also was without touchscreen."
