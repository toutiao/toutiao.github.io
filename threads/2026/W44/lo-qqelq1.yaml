    About touch, more plainly: I have a bunch of small (handheld) Linux devices that have touch interfaces. (These include the GPD Win Mini, the GPD Win Max, the GPD Pocket, the GPD Win 4, an X1 Ryzen tablet, a OneNetbook device, &c.)
    The devices all run Arch Linux, all use a pretty standard window manager… but the actual experience is just not great. It's not just that Onboard (the onscreen keyboard) has a very high variance of latency or that touch targets are too small or poorly spaced, but that the very high fidelity things I want to do with a Linux computer (things which inherently involve ad hoc modalities,) just cannot be adequately expressed within “swipe left” or “swipe right.”
    And, if I think about where my numerous tablet devices that have touch interfaces excel, it's often in cases where the task can be boiled down to that level of simplicity. That's good for, say, reading a novel, but it's actually not very useful for reading a textbook (where you might likely move through the text nonlinearly, jumping back and forth between sections, quickly riffling through to find something, sticking your finger in a section while you flip to the back so that you can immediate resume where you left off, &c.)
    The moment the task becomes something even vaguely “work-like” (which is nearly the entirety of the things I want to do with a Linux device and, in fact, rarely the thing I want to do with my mobile phone,) the touch UI is simply not expressive enough to encode useful actions, especially if the task can't be constrained to a very rigid, fixed workflow (e.g., point of sales, inventory control, basic video editing, &c.)
