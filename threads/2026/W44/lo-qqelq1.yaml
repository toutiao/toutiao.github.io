    This was very nicely written.
    I would add to the author's complaints that, despite its popularity, touch is an interface really only suited to a certain set of gross-movement operations. It's just far too low-fidelity to really support anything that requires fine control… In fact, I would even go so far as to say that (much in the way that LLMs have been beaten into usefulness,) touch interfaces are only practically useful as a result of enormous after-the-fact modulation of their environments—i.e., only for very carefully constructed tasks, in contexts where you don't quite notice that you're missing key modalities, only as a result of additional predicative shaping. This is why, despite the genuine technical advances in low-latency, high-responsiveness hardware, actual touch interfaces require an enormous amount of very constricting design to create a context where they are useful… which is why Windows and Linux (and even sometimes Android!) touch interfaces never feel that good.
    I also enjoyed the earlier article the the author refers back to (despite maybe a somewhat unfair jab at the players of Guitar Hero): https://lapcatsoftware.com/articles/2026/3/5.html
    The excerpt will likely speak to the frustrations of users on this forum (and maybe programmers in general right now):

    The latest front in the war against power users is Artificial Intelligence. The promise of AI appears to be that you’ll never have to learn anything. Don’t know something? Just ask AI for the answer. Can’t do something? Just ask AI to do it. Ignorance is bliss. Laziness is encouraged in the name of efficiency. The prospect that one may have to work and struggle to achieve one’s goals is considered abhorrent. The very notion of self-improvement becomes obsolete. Life under AI is a video game, pure joy… as long as you continue inserting tokens into the machine. Hopefully my video arcade metaphor hasn’t become obsolete too.

    Though… I am left to wonder whether my objectivity is compromised. Is this simply speaking to my prejudices?
