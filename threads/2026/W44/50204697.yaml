  author: jbarham
  text: 'I have the Epson EcoTank Photo ET-8550 printer and have found it to be excellent
    for printing photos. It prints up to A3+ size (13&quot; x 19&quot;) and ink costs
    are low since it uses tanks, which can be refilled using ink bottles, vs cartridges.
    The main caveat is that it uses dye inks which theoretically don&#x27;t have the
    longevity of pigment inks, but for my purposes (family photos and photo club competitions)
    it doesn&#x27;t matter.<p>Keith Cooper on YouTube has lots of informative videos
    about the ET-8550: <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;@KeithCooper&#x2F;search?query=8550"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;@KeithCooper&#x2F;search?query=8550</a>'
