  author: Ey7NFZ3P0nzAe
  text: "&gt; Dr Xu, an optical engineering researcher at the National University
    of Singapore, reportedly responded to the LinkedIn post. According to Nature,
    Dr Xu accepted that he had used an AI model to assist with post-processing but
    denied breaking the rules of the competition, which clearly state that “AI-generated
    videos are not permitted.”<p>&gt; “It was applied afterwards to the reconstructed
    grayscale data to distinguish and color structures with similar morphology,” he
    wrote.<p>&gt; However, Dr Xu’s messages on the LinkedIn post can’t be found as
    of today (October 1), and his LinkedIn profile now appears to have been deleted
    entirely.<p>&gt; Scientists have repeatedly said that the issue could be resolved
    if Dr Xu shares his RAW grayscale video."
