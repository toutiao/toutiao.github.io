  author: thaumaturgy
  text: For me (I host a lot of PHP...):<p>1. First I hear about it is a heads-up
    at 5:00 am 21st.<p>2. Available info then is pretty much, &quot;omg, it&#x27;s
    the end of the internet&quot;.<p>3. There are <i>no</i> specifics available on
    exploitable configurations.<p>4. Updates are not expected to be available for
    at least two more hours, so people start deciding to do the Madagascar &quot;shut
    down everything&quot; meme.<p>5. Cloudflare says they&#x27;re seeing exploits
    in the wild, well, that&#x27;s not great.<p>6. I shut down everything, including
    a national brand, because wtf else am I supposed to do at this point?<p>7. Updates
    become available at 0645. Fortunately, I don&#x27;t run my entire infra on Docker,
    so I&#x27;m immediately deploying the updates to all configurations and bringing
    sites back online approximately in order of traffic volume.<p>8. Still no specifics
    on the exploit.<p>9. A million vibe-coded PoCs appear on GitHub ... and none of
    them work.<p>10. It&#x27;s late morning local time on the 21st and I&#x27;m still
    bringing things back online, having taken the day off from my regular job.<p>11.
    Conversation starts to shift towards, &quot;...oh, did we over-react? How exploitable
    is this exactly?&quot;<p>12. Still no specifics available.<p>13. Somebody on the
    internet gets as fed up as I am with the whole chaos vortex of idiocy and stands
    up a site saying, &quot;okay, here&#x27;s some money if you can exploit it.&quot;<p>14.
    Hours pass.<p>15. Still no specifics available.<p>16. Zeitgeist becomes, &quot;I
    guess it&#x27;s not exploitable after all.&quot;<p>17. The test site gets &#x27;sploited.<p>18.
    <i>Finally</i> somebody actually posts the damn specifics -- namely, the person
    that grabbed the $2k.<p>19. Late morning local time on the 26th, and the conversation
    becomes, &quot;well, obviously this was exploitable!&quot; &lt;-- we are here<p>Coincidentally,
    I just started reading <i>Crisis Engineering</i>, which seems like an excellent
    and applicable book, but I&#x27;m not sure who to beat with it.
