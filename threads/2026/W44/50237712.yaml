  author: mceachen
  text: An “image ladder” is the same image resampled at several widths. It’s not
    a standard term; MDN calls the technique “resolution switching”.<p>A srcset lists
    those versions, and the browser picks the one that fits the current viewport and
    screen density. <a href="https:&#x2F;&#x2F;responsiveimages.org&#x2F;" rel="nofollow">https:&#x2F;&#x2F;responsiveimages.org&#x2F;</a>
    has details.<p>For an example, view the source of <a href="https:&#x2F;&#x2F;photostructure.com&#x2F;tags&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;photostructure.com&#x2F;tags&#x2F;</a>. All the
    header art looks like this:<p>&lt;picture&gt;&lt;source type=&quot;image&#x2F;webp&quot;
    srcset=&quot;&#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_f9b8e901c6d3512c.webp
    400w, &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_4e2d65cccd03c969.webp 800w,
    &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_11f3bf6c90dbf78d.webp 1200w, &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_8c1a7d0a013e4ee2.webp
    1600w, &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_4cebe999e55b5486.webp 2000w&quot;
    sizes=&quot;100vw&quot;&gt;&lt;source type=&quot;image&#x2F;jpeg&quot; srcset=&quot;&#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_cf5671a2e3bdd0cc.jpg
    400w, &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_2906e4ba7cda040.jpg 800w,
    &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_f59ef0388799d4d2.jpg 1200w, &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_e183d28df837e14a.jpg
    1600w, &#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_ea9c422963c8e0e1.jpg 2000w&quot;
    sizes=&quot;100vw&quot;&gt;&lt;img src=&quot;&#x2F;img&#x2F;2026&#x2F;05&#x2F;desk-2000w_hu_f59ef0388799d4d2.jpg&quot;
