  url: https://frvr.com/blog/news/openai-ceo-sam-altman-says-its-terrible-to-have-everybody-have-a-bunch-of-the-worlds-limited-supply-of-dram-instead-of-shoving-it-all-in-datacentres/
  title: OpenAI CEO Sam Altman says its “terrible to have everybody have a bunch of
    the world’s limited supply of DRAM” instead of shoving it all in datacentres -
    FRVR
  fetch_status: success
  content: "# OpenAI CEO Sam Altman says its “terrible to have everybody have a bunch
    of the world’s limited supply of DRAM” instead of shoving it all in datacentres\n\n![OpenAI
    CEO Sam Altman on Cheeky Pint podcast](https://frvr.com/wp-content/uploads/2026/10/sam-altman-terrible-local-dram-instead-of-datacentres.jpg)\n\n**Published:**\n\n|\n\n**Last
    Updated:** 30 October 2026\n\n|\n\n**By:**\n\n[Lewis White](https://frvr.com/author/lewis-white/)\n\nAs
    the ongoing memory crisis continues, many consumers can no longer afford PCs,
    consoles, or phones due to the rise of AI datacentres buying up unprocessed memory.
    While horrendous for us, [OpenAI](https://frvr.com/tag/ai/) CEO Sam Altman believes
    its worse that everyday people have any DRAM at all.\n\nOver the past year,&nbsp;[memory
    prices have skyrocketed to support the demands of AI](https://frvr.com/blog/news/micron-ceo-celebrates-even-higher-ram-prices-as-2027-will-see-customers-pay-much-higher-prices/).
    Not only has consumer hardware suffered as a result, but memory manufacturer Micron
    even announced its departure from consumer memory production as a result. The&nbsp;[company
    claimed that the needs of AI datacentres are “essential” compared to consumer
    use](https://frvr.com/blog/news/micron-says-substantial-ram-shortages-will-persist-into-2027-as-the-ai-experience-demands-essential-memory/).&nbsp;\n\nIn
    an interview with&nbsp;[Cheeky Pint](https://www.youtube.com/watch?v=iMsUcCYNKqY),
    OpenAI CEO Sam Altman argued that one of the issues keeping the memory supply
    chain strained is the want for local compute by everyday people. While large-scale
    LLMs ran at datacentres by massive companies are the most known forms of AI, Altman
    believes locally-run models—which are arguably far more sustainable—are an issue.\n\n“A
    lot of people want local inference,” Altman said. “And somehow, they assume, that
    the problem is solved now. Because we are going to have open-source models. We’re
    going to be ablw to run them on our own computers. And so we’re not going to need
    all the stuff [DRAM] in the data centre.”\n\nThe tech billionaire argued that
    “from a global allocation perspective, actually, it’s quite terrible to have everyone
    have a bunch of the world’s limited supply of DRAM sitting in their own computer.
    And be used 5% of the time.” While OpenAI is allowed to&nbsp;[buy up 40% of the
    global DRAM output](https://www.tomshardware.com/pc-components/dram/openais-stargate-project-to-consume-up-to-40-percent-of-global-dram-output-inks-deal-with-samsung-and-sk-hynix-to-the-tune-of-up-to-900-000-wafers-per-month),
    Altman believes the 32GB of RAM sitting in your computer is tantamount to public
    greed.\n\n“You want maximum utilisation in the cloud if you’re trying to deal
    with this very constrained environment,” the AI billionaire continued. “And somehow
    everyone’s, many people’s intuition is the opposite of that.”\n\nOn top of the
    DRAM situation, Altman explained that OpenAI is also designing its own custom
    AI processor called Jalapeno. The CEO explained that the chip is being designed
    by AI for AI, and once again argued that his own company’s desires is the correct
    use for the limited amount of computing hardware the world can manufacture.\n\n“Given
    that the world is doing to be limited in its silicon capacity, we all have a shared
    interest,” Altman claimed. The CEO claimed that AI will potentially be able to
    create something as important as the transistor, or discover major efficiency
    gains. The question then becomes what is the point of using AI to create new hardware
    if everyday people don’t get to own, use, and improve that hardware themselves?\n\nAs
    console and PC prices get more and more expensive, many are worried that they
    will be pushed into a future of cloud computing instead of local computing. 55
    years after the first personal computer, it seems that the average person may
    already be stripped of their technology instead of being able to own it. What
    a sadness that would be.&nbsp;\n\n### About The Author\n\n[![](https://secure.gravatar.com/avatar/2e1c85a3b2fc071e8cc6394577017f3d6e9b8e68ca04e1a87bf391c0718efbf8?s=150&d=mm&r=g)](https://frvr.com/author/lewis-white/)\n\n####
    [Lewis White](https://frvr.com/author/lewis-white/)\n\nLewis White is a veteran
    games journalist with over a decade in the field. Starting with beloved Xbox website
    ICXM/XboxMAD, Lewis became the Gaming Editor at MSPoweruser before becoming the
    Editor in Chief of StealthOptional and Gfinityesports. Lewis later jumped to By
    Gamers For Gamers where he jumped to become EIC of VideoGamer and the host of
    the New VideoGamer Podcast prior to the website’s acquisition.\n\nOver the years,
    Lewis has also seen long-form investigative pieces published in outlets such as
    Eurogamer, PCGamesN, Wireframe, Retro Gamer, Nintendo Life, and EDGE. Now, as
    the Editor in Chief of FRVR Blog, Lewis strives to bring the same level of quality
    journalism with interview-led content to the site in both written and audio form
    with the FRVR Podcast.\n\nWith a First Degree BA Hons in Games Journalism and
