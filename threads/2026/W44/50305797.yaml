  author: phil21
  text: "&gt; Weirdly, underutilization of hardware was never a problem before.<p>Fixing
    exactly this has been the constant drumbeat of IT since the early 00&#x27;s at
    least. It started with virtualization, to get capacity factor of hardware up in
    the enterprise. The average server back before VMWare (and HyperV&#x2F;etc.) became
    a major thing was probably sitting at 10% utilization or less 95% of the time.
    Hypervisors were invented to fix this as their primary use case. You&#x27;d take
    a 5-10% performance hit on the raw server performance to gain 90% efficiency back.<p>Next
    came the cloud. Which was virtualization at scale. The larger the scale, the better
    the efficiency.<p>It&#x27;s basically almost all anyone has actually accomplished
    in IT over the past decade or two. Everything else has been largely stagnant compared
    to the 80&#x27;s and 90&#x27;s.<p>AI inference is in it&#x27;s infancy, but I
    imagine we will see more or less the exact same thing play out yet again. Lots
    of initial on-prem stuff due to cost and freedom, and eventually it becomes virtualized,
    commoditized, customer segregated, etc. Just like average cloud workloads are
    today and all the various &quot;small&quot; megawatt-scale builds moved back into
    the hyperscaler type providers within the next 5-10 years.<p>&gt; How many companies
    are building datacenter commons and sharing with other companies to optimize resource
    usage?<p>Quite a few that I&#x27;ve seen. Rented inference&#x2F;token factories
    are the current new hotness. Plenty of speculative builds being done by hundreds
    of smalltime providers. These will consolidate per usual and everyone but the
    last few top percent will remain as the winners. Just like the first hosting providers.
    Virtualization and fancy schedulers to maximize hardware utilization across a
    number of end-user customers are a huge topic in this space at the moment. Heck,
    a lot of these small time players are providing raw compute for the giant AI labs
    and even hyperscalers.<p>I don&#x27;t like that Altman is right on this btw. I
    much preferred the highly inefficient days of every midsize corporate office having
    a 200-500kw datacenter in the basement. AWS and their ilk are quite obviously
    orders of magnitude more hardware efficient though."
