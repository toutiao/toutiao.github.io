  text: Good question, those are all different accents we are pointing out this model
    does well with, but it also does well with White American accents that are usually
    represented well, not only the Black voices (including White southern voices).<p>We
    are calling out Southern American, and the regional African English (e.g. a person
    with a regional Nigerian (igbo) accent speaking english, or someone with a regional
    Kenya (Swahili) accent that is still speaking english). Those are all different
    but all represented well in this model.<p>Those were not a catch all for black
    americans.
