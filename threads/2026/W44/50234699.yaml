  author: Grombobulous
  text: 'Perhaps it’s easier to define companies that are <i>not</i> in the tech sector
    better than ones that are.<p>Either way, I think the category still has a non-zero
    amount of meaning.<p>If your primary product is computer hardware or software
    and you serve more than one market, you’re probably in the tech sector.<p>E.g.,
    Epic Systems is not a tech company, even though all they do is make software,
    since they only serve the healthcare industry.<p>We can’t say the same thing about
    Apple even though they make healthcare products and services.<p>Even companies
    like Epic Systems or other customer-specific tech industries like FinTech can
    get lumped in the tech industry umbrella in the right context, and I generally
    think that makes sense.<p>Developer is where I disagree with you more strongly.
    It is much more straightforward as “a single kind of job” in the sense that almost
    all of them are affected in the same ways by AI. It doesn’t really matter what
    company you work for: if you’re a Java developer and AI is increasing output&#x2F;decreasing
    hours, that affects your employment status regardless of your industry.'
