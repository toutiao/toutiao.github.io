  author: tacostakohashi
  text: |-
    I&#x27;ve periodically struggled with an HTML resume that can be converted to a PDF using chrome headless &#x2F; puppeteer wkhtmltopdf, and looks good both on screen and PDF&#x2F;printed.<p>Admittedly I&#x27;m not an HTML&#x2F;css guru, but I know a bit... and it really feels like it shouldn&#x27;t be this hard &#x2F; require so many tricks to get it working even half ok.<p>The biggest issue is that the pages kind of fight against the DOM structure of the HTML. Like lets say I have big:<p>&lt;div&gt; &lt;h2&gt;Experience&lt;h2&gt;<p><pre><code>  &lt;div&gt; &lt;h3&gt; Job A &lt;&#x2F;h3&gt; &lt;p&gt;Description&lt;&#x2F;p&gt;

      &lt;div&gt; &lt;h3&gt; Job B &lt;&#x2F;h3&gt; &lt;p&gt;Description&lt;&#x2F;p&gt;

      &lt;div&gt; &lt;h3&gt; Job C &lt;&#x2F;h3&gt; &lt;p&gt;Description&lt;&#x2F;p&gt;

      &lt;div&gt; &lt;h3&gt; Job D &lt;&#x2F;h3&gt; &lt;p&gt;Description&lt;&#x2F;p&gt;</code></pre>
    &lt;&#x2F;div&gt;<p>There isn&#x27;t really a good way to say...<p>* Keep &quot;Experience&quot; and &quot;Job A&quot; on the same page.<p>* Don&#x27;t break after Job X &#x2F; before Description.<p>* Don&#x27;t try to keep the whole toplevel div on one page by breaking before, just break within it, sensibly.<p>Whatever tweaks&#x2F;hints&#x2F;hacks one applies to achieve that tend to be pretty brittle across browsers&#x2F;page sizes&#x2F;etc.<p>It&#x27;s very tempting to just give up and go back to... something actually page-centric like word, pagemaker or whatever, instead of HTML and then having print as a second class citizen.
