  author: ButlerianJihad
  text: 'Today, my only two devices consist of an Android 17 Pixel, and a Chromebook.
    The printer drivers in each of these OS are shockingly rudimentary. Like, there
    is no affordance to connect to the printer and configure its settings, or monitor
    its status, or run tests or anything. The only printout options are so basic:
    I can perhaps choose 2-sided, and perhaps what size paper, but there are, max,
    about 5 parameters on the Print dialog.<p>This was something that sort of escaped
    my notice until I finally had to replace my 2011-era HP printer. I chose a SOHO
    HP printer, and basically, it can&#x27;t properly print anything, not even 2-sided,
    unless I go through the Linux subsystem on the Chromebook. This is fine, because
    I seldom print stuff, but it&#x27;s just emblematic that neither ChromeOS nor
    Android really wants anyone to print anything, ever at all.<p>When choosing to
    replace my printer with a modern one, my other option was to not replace it at
    all. I could easily upload documents and print them at the UPS Store, or Staples,
    or FedEx Kinko&#x27;s, the public library, or a pharmacy photo department or something.
    There is not a shortage of outsourced print shops around here. Perhaps I spent
    way too much money on a SOHO model. But at least I can scream and rage at the
    printer drivers in the comfort of my own home!'
