  text: 'I have used CSS for print layouts before. My stance on this is: If you can
    reasonably expect someone will print your website or (more likely) parts of it,
    because of its nature, add a nice add free, no tracking cookie print layout. If
    not, don&#x27;t.<p>I often have to print for example online shopping baskets so
    others can decide which offer they will take. Meaning how your shopping basket
    looks print <i>absolutely</i> will have an impact by annoying or pleasing the
    people who make the decisions. Needless to say, 99% of all shopping baskets look
    like trash when printed out.<p>If you have a blog, it would be reasonably that
    someone might want to read your article offline or store it for archival purposes.
    Having that look decent is not a bad thing. And it is not <i>that</i> hard.'
