  author: dofm
  text: This is precisely why I do make things basically printable right from the
    start.<p>For one, it often entirely heads off the requirement for &quot;can we
    have it so the user can download a PDF of this?&quot; (because users generally
    know how to print things!)<p>And for another, it broadens your options for implementing
    those PDFs if that requirement doesn&#x27;t go away. You may not have to restrict
    your markup to that which some PDF generator library can work with, because printing
    any page in a headless browser is easier.<p>You often don&#x27;t have to do much
    in a CSS stylesheet to get a modern site to render well, because we&#x27;ve moved
    away from so many layout hacks in general.
