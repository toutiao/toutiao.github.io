  author: adrian_b
  text: While what you say is correct, the point is that the excessive use of JS is
    what makes nowadays the print command the only way to save most Web pages.<p>Years
    ago I was never using the &quot;print&quot; command in browsers. I used the &quot;save&quot;
    command. But now the &quot;save&quot; command is useless for most sites, because
    the saved scripts frequently do not work offline or they do not work even online,
    but from local files. So the only alternative is &quot;print&quot;, which is extraordinarily
    buggy in both Firefox and Chrome, but their developers do not give a ****, so
    there are many years or perhaps decades since printing in Firefox or Chrome renders
    completely incorrectly almost all Web pages.<p>As a workaround for the stupid
    rendering in Firefox and Chrome, I frequently print twice a Web page, once in
    Portrait and once in Landscape, because the corrupted parts of the printed page
    will typically occur in different locations. Moreover, I may have to fiddle with
    other printing parameters, e.g. whether to print backgrounds or not, or with different
    margins and paper sizes, because it is unpredictable which settings will work
    best with a given site.
  score: 0
