  author: DonHopkins
  text: 'Or HackerNudes!<p><a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=34129571">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=34129571</a><p>&quot;Yes,
    we have a dress code. You have to dress.&quot; – Scott McNealy<p>On the other
    hand, down the road at SGI there was a practice called &quot;Skinnyhacking&quot;!<p><a
    href="https:&#x2F;&#x2F;rdtk.net&#x2F;internet&#x2F;how-do-you-check-a-computer-s-complete-history&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;rdtk.net&#x2F;internet&#x2F;how-do-you-check-a-computer-s-comp...</a><p>&gt;Snowsinger.
    November 21, 2020 at 07:48.<p>&gt;A truly excellent review of the history of Silicon
    Graphics. I worked in the Australian Sales office as their 1st engineer in the
    Asia Pacific region. Was trained in MtView the 1st week the MtView campus opened.
    The 1st system I worked on was the IRIS 1000 and subsequently all the products
    from then on till I left in mid-2009 when the Australian Engineering division
    was shut. A great company with great people who just wanted to engineer the best
    Graphics experience on the planet until we lost focus and vision of what we did
    well. Brings to Mind the Skinny Hackers, the Rocktain event, PCP monitoring, CXFS
    (Clustered File Systems), Failsafe, Diskless boot, Voxel vision, and so many other
    engineering wins. A great company, great people, &amp; the drive to make a better
    computing world. Thank you for the memories and documenting the history of a company
    that did make some huge breakthroughs in Computer Graphics &amp; Computing architecture.
    Just go ask NVIDIA, Cray and now HP!! Also a shout out to Jim Clark &amp; his
    team for the vision and determination to bring the Graphics Engine to world, the
    heart of the IRIS workstation and subsequent graphics systems.<p><a href="https:&#x2F;&#x2F;groups.google.com&#x2F;g&#x2F;comp.sys.sgi.misc&#x2F;c&#x2F;X50cCoYrU20&#x2F;m&#x2F;kXZ5LwSWk3sJ"
    rel="nofollow">https:&#x2F;&#x2F;groups.google.com&#x2F;g&#x2F;comp.sys.sgi.misc&#x2F;c&#x2F;X50cCoYrU20&#x2F;...</a><p>&gt;Tom
    Davis, Mar 22, 1993, 6:06:21 PM, comp.sys.sgi.misc<p>&gt;In article &lt;gom...@zola.esd.sgi.com&gt;,
    ol...@anchor.esd.sgi.com (Dave Olson) writes:<p>|&gt; In &lt;112...@bu.edu&gt;
    j...@bu-pub.bu.edu (Jason Heirtzler) writes:<p>|&gt; | Okay, I gotta know. Whom
    does the phrase &quot;The Skinny Hackers&quot; refer to?<p>|&gt; A small group
    of (fairly skinny ;) ) folks who are also great hackers&#x2F;developers and mostly
    long time SGI employees. Among other fruits of their group hackerdom was the original
    showcase.<p>&gt;Being skinny didn&#x27;t have anything to do with it. Although
    Showcase was the best known product of the skinnyhackers, the first product was
    an image of them made from a photo of all three sitting naked at computer terminals,
    busily hacking. On top of the photo was the international &quot;no&quot; symbol
    (red circle with a line across it), and underneath, the words &quot;No Skinnyhacking&quot;.<p>&gt;Note:
    Skinnyhacking is a dangerous activity, and should only be performed by professionals.
    Do NOT attempt it at home.<p>&gt;If you&#x27;re interested, you can see the image
    in the most recent (1992) SIGGRAPH proceedings, in distored form on the back cover,
    and in non-distored form on page 252.<p>&gt;I can&#x27;t imagine that anyone would
    want a copy of this image, but I have one in SGI format. (Actually, the secret
    goal is to have this image overtake the mandrill in popularity.)<p>|&gt; I won&#x27;t
    speak further to protect their secret identities ;)<p>&gt;I will! It was me! Tom
    Davis! The bald guy in the front! Oh, and the other two are Rocky Rhodes and Scott
    Carr. Ann Sydeman joined the group a short time later, but unfortunately missed
    the initial photo session (although there was a subsequent video ...). Paul Haeberli
    was the photographer.<p>[Fortunately I found a pdf of the paper with the image:]<p>&quot;Fast
    Shadows and Lighting Effects Using Texture Mapping&quot;, by Mark Segal, Carl
    Korobkin, Rolf van Widenfelt, Jim Foran, Paul Haeberli, Silicon Graphics Computer
    Systems. Computer Graphics, 26,2, July 1992, Page 252, Figure 3: Simulating a
    Slide Projector:<p>NSFSIGGRAPH:<p><a href="https:&#x2F;&#x2F;dl.acm.org&#x2F;doi&#x2F;pdf&#x2F;10.1145&#x2F;133994.134071#page=4"
    rel="nofollow">https:&#x2F;&#x2F;dl.acm.org&#x2F;doi&#x2F;pdf&#x2F;10.1145&#x2F;133994.134071#page=4</a>'
  score: 0
