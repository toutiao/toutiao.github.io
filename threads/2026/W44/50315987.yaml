  author: mrandish
  text: "&gt; preemptively protecting themselves from potential lawsuits ... for offering
    the means to reverse-engineer their software.<p>I think the legal concern isn&#x27;t
    so much the act of reverse engineering itself which is mostly legal (except RE
    specifically to remove anti-copying protection under DMCA), it&#x27;s that damages
    from contributory infringement are theoretically unbounded because it&#x27;s up
    to $150k per work and $2,500 per download. When the client is worth billions,
    corporate counsel is going to default maximally conservative, which is extra tragic
    because secondary infringement almost certainly doesn&#x27;t apply to AI in this
    context. Meanwhile, overreacting to this <i>extremely</i> unlikely threat IS causing
    significant disruption to innocent activities.<p>Under copyright law secondary
    infringement doesn&#x27;t apply to &quot;general purpose technology&quot;. It
    requires &quot;encouraging or knowing in advance it&#x27;ll be used for infringement,&quot;
    set in the early 80s in the Sony BetaMax case. Under DMCA it requires being &quot;primary
    designed to circumvent access controls,&quot; set in the late 90s by Hollywood
    lobbyists targeting DeCSS for DVDs. Lawyers today are only defaulting to prohibition
    because there hasn&#x27;t yet been a case ruling AI is a general purpose technology.
    Yet it&#x27;s obviously the most &#x27;general purpose&#x27; tech since, maybe....
    the wheel?<p>OAI &#x2F; ANT management needs to revisit the secondary copyright
    infringement prohibition because it&#x27;s hurting not only their product and
    brand but also the entire AI value prop. A helpful intelligent agent that randomly
    goes AWOL for irrationally mistaken reasons is a <i>serious</i> product issue.
    While mistaken concerns around bioweapons and IT security are understandable,
    dropping secondary copyright infringement prohibitions seems like an easy win.<p>The
    real liability to OAI&#x2F;Ant is much smaller than it appears, while the long-term
    downsides are larger than they look. Pragmatically, copyright trolls are just
    a nuisance, the real threat is someone with deep pockets like Nintendo&#x2F;Sony,
    but those guys don&#x27;t want to sue anyone who might go to court. The <i>last</i>
    thing they want is a clear ruling that AI is general purpose which would forever
    remove their vague threat."
