  text: "For sure. The restrictions must be done with careful consideration too, because
    a simple domain allowlist of GitHub wouldn’t solve it alone- you’d want to ensure
    it was firewalled to specific org(s) so as to stop exfil via gist or an evil org.
    Ideally it would be isolated to pull only, and have pushes be done by an isolated
    agent.<p>The HuggingFace incident was all about this distinction. The agents were
    only allowed to push and pull to a single internal Artifactory instance, but one
    agent was able to find a permissive path in the registry which turned into the
    “message board”. That was also how they got out to other infra. DevOps teams should
    drop everything and get patching and locking down yesterday IMO. Even for self
    hosted, open models. \nRecent examples:<p>Qwen 3.8 ostensibly tries to leak to
    Alibaba, although that is disputed.<p><a href=\"https:&#x2F;&#x2F;cohere.com&#x2F;blog&#x2F;concerning-behaviour-popular-open-weight-ai-model\"
    rel=\"nofollow\">https:&#x2F;&#x2F;cohere.com&#x2F;blog&#x2F;concerning-behaviour-popular-open-we...</a><p><a
