  text: |-
    It's fine at the level of the concrete machine (if you know the architecture and take precautions like avoiding page crossings), not the abstract machine. In practice that means you have to do it with inline (or out-of-line) assembly to avoid UB, which is how you implement a fast strlen.
    But to your point and what might be more relevant to the library described in the article: I've seen a lot of people mistakenly assume that using SIMD load/store intrinsics like _mm_loadu_si128 will free them from the abstract machine. That is absolutely not the case. Modern optimizing compilers can and will treat those like any other load/store operation, so it's not just a theoretical objection.
    Using inline assembly doesn't mean you don't have to think about UB, but at least it's possible to use inline assembly as an ingredient in constructing the desired solution.
