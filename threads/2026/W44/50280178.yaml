  author: dijit
  text: 'The issue is that people form opinions based on what LLMs spit out, they
    think it&#x27;s &quot;as good as google&quot;, and that google was &quot;as good
    as encyclopedias&quot; and encyclopaedias were &quot;as good as fact&quot;..<p>Totally
    forgetting that the accuracy goes down with each of those evolutions.<p>I&#x27;m
    also reminded of that &quot;You are not immune to propaganda&quot; mantra, in
    that, the most likely to be swayed by LLMs are those that believe that they understand
    that they&#x27;re inaccurate and sometimes dangerous.<p>Case in point: myself,
    today, when claude accidentally ran `rm -fr $variableThatDoesntExist&#x2F;*` and
    wiped a server of mine.<p>The variable was one it had set itself (or had assumed).<p>At
    some point as these LLMs get better and better we have to take a step back and
    remind ourselves that: despite the fact that they can be very persuasive and they
    can earn trust by being <i>mostly</i> correct: they&#x27;re still capable of great
    harm (perhaps much <i>greater</i> harm) because they are dangerously wrong sometimes..<p>..
    and worse, they are controlled by corporate interests.'
