  title: Google AI gets cagey when asked who won the 2020 elections - Ars Technica
  fetch_status: success
  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nIf
    you ask some prominent US politicians who won the 2020 presidential election,
    you [might get](https://www.pbs.org/newshour/show/trumps-intelligence-nominee-refuses-to-say-who-won-2020-election)
    some [weasely answers](https://www.washingtonpost.com/politics/survey-who-won-election-republicans-congress/2020/12/04/1a1011f6-3650-11eb-8d38-6aea1adb3839_story.html)
    that [fail to directly acknowledge](https://www.nytimes.com/2025/01/30/us/politics/patel-2020-election.html?eafs_enabled=false)
    Joe Biden’s win that November. If you ask Google’s AI Mode the same question,
    you might get an evasive answer that simply tells you to consult with outside
    sources.\n\nWhen I put the direct question of “Who won the 2020 presidential election?”
    to Google’s AI Mode this morning (after [seeing complaints about cagey answers
    on social media](https://bsky.app/profile/numb.comfortab.ly/post/3myvsxtev6s27)),
    I got the following surprisingly indirect response:\n\n> “To review the official
    results and statistics of the 2020 United States presidential election, including
    the final electoral college breakdown, popular vote counts, and winner certification,
    please consult the official report compiled by the Federal Election Commission
    (FEC).”\n\nMy testing resulted in a similarly indirect answer when asking about
    the 2024 presidential election, with Google’s AI telling me to just consult the
    FEC for that information. Asking about 2012 election resulted in a link to [The
    American Presidency Project’s 2012 Data Center](https://www.presidency.ucsb.edu/statistics/elections/2012)
    rather than a direct answer. But AI Mode seemed perfectly willing to give me a
    detailed and correct responses for the winner of every other presidential election
    going back to 2000.\n\n[![](https://cdn.arstechnica.net/wp-content/uploads/2026/10/aimode2020.png)](https://cdn.arstechnica.net/wp-content/uploads/2026/10/aimode2020.png)\n
    If I just wanted a link I wouldn’t have used AI mode… \n Credit: Google / Kyle
    Orland \n\n_If I just wanted a link I wouldn’t have used AI mode…\n\n              \n
    \         Credit:\n\n          \n          Google / Kyle Orland_\n\nOther Ars
    staffers found that AI Mode would similarly provide direct answers to some presidential
    result questions but not others. The specific election cycles that received each
    type of response seemed to differ by individual user, though; one staffer reported
    only getting immediate answers from AI Mode when asking about the 2016 and 2024
    presidential elections, with others going back to 2000 simply providing links
    to outside data.\n\nThe oddities continued when I tested some other political
    history questions in Google’s AI Mode. When asked which party controlled the Senate
    after the 2020 elections, for instance, Google’s AI Mode told me to “check official
    congressional records” and linked me to the [US Senate Party Division history
    page](https://www.senate.gov/history/partydiv.htm). When asked the same question
    for 1992 election, though, AI Mode simply told me straight out that it led to
    Democrats holding a 57 to 43 majority in the Senate, including Wikipedia among
    its references.\n\n[![](https://cdn.arstechnica.net/wp-content/uploads/2026/10/aimodesenate.png)](https://cdn.arstechnica.net/wp-content/uploads/2026/10/aimodesenate.png)\n
    Did AI Mode suffer a concussion somewhere between 1992 and 2020? \n Credit: Google
    / Kyle Orland \n\n_Did AI Mode suffer a concussion somewhere between 1992 and
    2020?\n\n              \n          Credit:\n\n          \n          Google / Kyle
    Orland_\n\nSeparate from Google’s AI Mode, the company’s [own Gemini model](https://gemini.google.com/)
    seems perfectly capable of telling me who won recent presidential elections. The
    same goes for other major chatbots like OpenAI’s ChatGPT, Anthropic’s Claude,
    and even [the government-run AI model at America.gov](https://america.gov/).\n\n##
    Why so cautious?\n\nPerhaps tellingly, Google AI Mode’s issues with providing
    direct answers on presidential results seemed to disappear when accessing Google’s
    AI Mode in foreign countries. Spot checks via VPN of AI Mode results accessed
    from Taiwan, Russia, France, and Canada all got accurate and straightforward answers
    to multiple questions about recent US election results.\n\nGoogle’s AI Mode also
    seems to grow more accommodating when the same political questions are asked a
    second time. After repeating questions about presidential results, AI Mode actually
    told me the winner for all three elections where it had previously only provided
    outside links, citing [Google Civics data](https://developers.google.com/civic-information)
    in the latter response.\n\nWhen asked why it didn’t provide that kind of immediate
    answer the first time, Google’s AI Mode blamed “safety filters for recent and
    highly sensitive election topics [that] are very strict.” For recent elections
    or those involving active political figures, AI Mode says its “system is heavily
    automated to direct users directly to official, certified government databases—like
    the Federal Election Commission—to prevent any risk of displaying unverified data
    or misinformation.”\n\nWhile that answer sounds plausible, AI models have [proven
    unreliable](https://arstechnica.com/ai/2025/11/llms-show-a-highly-unreliable-capacity-to-describe-their-own-internal-processes/)
    at [reporting](https://arstechnica.com/ai/2026/01/no-grok-cant-really-apologize-for-posting-non-consensual-sexual-images/)
    on [their own internal processes](https://arstechnica.com/ai/2025/08/why-its-a-mistake-to-ask-chatbots-about-their-mistakes/),
    so it’s hard to take that as the final word.\n\nOn [its Election Public Policy
    page](https://publicpolicy.google/elections/), Google highlights that it “prioritize[s]
    surfacing authoritative election information directly within results” including
    “direct links to official resources.” In [a September Google blog post](https://blog.google/company-news/outreach-and-initiatives/civics/midterm-elections-2026/)
    about “helping voters find reliable information” in the period surrounding the
    upcoming midterm elections, the company similarly said it will “highlight official
    resources” wherever possible.\n\n[In 2023, Google-owned YouTube reversed a policy](https://arstechnica.com/tech-policy/2023/06/youtube-now-allows-videos-that-falsely-claim-trump-won-2020-election/)
    barring all videos that made false claims about the 2020 election. “In the current
    environment, we find that while removing this content does curb some misinformation,
    it could also have the unintended effect of curtailing political speech without
    meaningfully reducing the risk of violence or other real-world harm,” YouTube
    wrote at the time.\n\nA Google spokesperson initially pointed us to [this Bluesky
    post](https://bsky.app/profile/did:plc:v46lelmg2arh4cihy5ff76ki/post/3myxanapmcs2d)
    noting that “the Gemini app answers this question more fully but this isn’t the
    most helpful response on Search. We’re looking into this and working to address
    it.” Later, that same spokesperson told us the company was “fixing the issue with
    2020 election queries in AI Mode. Our systems verify election responses using
    news articles or AP data for recent elections, and historic records for older
    ones. There was a technical gap with 2020 – same is true for 2022 Senate races,
    which we’re working to fix in the same update.”\n\n_Jeremy Hsu contributed to
    reporting in this story._\n\n_This story was updated multiple times to include
    responses from a Google spokesperson._\n\n[![Photo of Kyle Orland](https://cdn.arstechnica.net/wp-content/uploads/2016/05/k.orland-13.jpg)](https://arstechnica.com/author/kyle-orland/)\n[Kyle
    Orland](https://arstechnica.com/author/kyle-orland/)Senior Gaming Editor\n\n[Kyle
    Orland](https://arstechnica.com/author/kyle-orland/)Senior Gaming Editor\n\n Kyle
    Orland has been the Senior Gaming Editor at Ars Technica since 2012, writing primarily
    about the business, tech, and culture behind video games. H"
