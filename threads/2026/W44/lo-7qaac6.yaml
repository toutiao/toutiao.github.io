  content: |-
    There is an old Norse board game, which in Sweden is played under the name_Starve the Fox_, or just _the Fox Game_. According to Wikipedia, _Fox and Geese_ is a simplified version of it played in English speaking countries.

    In _Starve the Fox_, one player plays as the foxes, and one player plays as the sheep. The rules are asymmetric, and obviously the game is almost always won by the fox player …

    … or is it? Let’s find out.
