  text: |-
    The puzzles certainly have been buggy in the past, but I haven't found any actual bugs in a good while. Any time I run across something I think is a bug now, it's just because I didn't read the situation out fully.
    The check is never for a specific fox to eat a sheep. If the puzzle doesn't accept a solution using one of the foxes, it is because doing so would have one of the following consequences:

    The sheep can then fill the pen and win;
    The fox can be trapped; or
    The solution doesn't actually lead to eating a sheep at all, because all sheep can survive a few turns.

    One such situation is when one of the foxes occupies the last non-sheep point in the pen. Often the sheep can fill that location quickly once the fox moves away from it, so that fox must not move.
    The next time you find a buggy solution, it would be helpful if you sent the id of that puzzle so I can check!
