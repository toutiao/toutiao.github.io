    a 2D grid. Every frame, pick a random cell: if it has at least one color like
    it nearby, leave it. If not, move it to a random location. Over many generations,
    segregated color formed. The article used this to describe something about segregated
    communities forming. I offer no opinion about the credibility of the article,
