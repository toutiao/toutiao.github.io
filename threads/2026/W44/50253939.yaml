  author: modeless
  text: 'It&#x27;s mostly hardware design limitations. GPU hardware is way more diverse
    than CPU hardware, so you need to distribute shaders as either source code or
    a portable intermediate representation, in both cases compiled at runtime for
    the user&#x27;s actual GPU. There are also many fixed function parts of the graphics
    pipeline with wildly different behavior on different hardware which you need to
    abstract over. And it all runs in parallel with the CPU, often with a separate
    pool of RAM, so you need implicit or explicit synchronization and data transfer
    which adds a lot of complexity especially in error cases.<p>If you really want
    to see why all the cruft is there, and how much you could remove if you dropped
    support for older hardware, look no further than Sebastian Aaltonen&#x27;s &quot;No
    Graphics API&quot; blog post (which he actually implemented too): <a href="https:&#x2F;&#x2F;www.sebastianaaltonen.com&#x2F;blog&#x2F;no-graphics-api&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.sebastianaaltonen.com&#x2F;blog&#x2F;no-graphics-api&#x2F;</a>'
