  author: flohofwoe
  text: "&gt; they also contain a whole lot of fixed function hardware that is specialized
    for real-time computer graphics. This hardware isn&#x27;t exposed as &quot;fancy
    instructions&quot;, it is set up in other ways, which is achieved through a device
    driver.<p>Those hardwired fixed-function parts are getting fewer and less important
    though (ok, and then raytracing units entered the scene...). Also AFAIK something
    like a texture sampling operation is indeed a &#x27;fancy instruction&#x27;(?),
    even though the actual texture sampling is done by a &#x27;fixed function&#x27;
    hardware unit.<p>&gt; This also necessitates a device driver to manage scheduling,
    synchronization, etc. with the main OS.<p>I bet this type of GPU&#x2F;CPU handshaking
    work could also be baked into the hardware (similar to CPU mirocode) and exposed
    via a standardized memory mapped IO interface (or whatever the current mechanism
    is for letting the CPU control the GPU). E.g. a CPU also implements similar protocols
    to talk to the rest of the computer system (e.g. memory and other CPUs), but this
    is mainly implemented as &quot;hardware protocols&quot; - drivers &quot;just&quot;
    offer more flexibility for hardware vendors because they can delegate the standardization
    into software.<p>...also a lot of the &quot;CPU &#x2F; GPU software ecosystem&quot;
    was probably shaped by CPU and GPU vendors historically being different companies,
    and once the big consolidation started, the conventions were already set in stone."
