  author: corysama
  text: I have been working for a while on a tutorial based on 4.6. When I get close
    to a first release, I’ll have to ask you for a review :)<p>My take is that older
    versions of GL feel nicer to teach to beginner programmers because they have so
    many specific functions to do each specific thing. You can have a lot of verbose,
    step-by-step instruction. But, much of what you have to convey is understanding
    of a convoluted interface to a hidden state machine. And, the one-step-at-a-time
    nature of the old interfaces build bad habits that don’t scale when you get serious.<p>With
    4.6 we can get Direct State Access, Programmable Vertex Pulling and MultidrawIndirect.
    With that we can move the complexity from “lots of functions to manipulate a state
    machine” to a few functions that strongly resemble using malloc and memcpy to
    work with arrays of structs. That’s not trivial. But, it should be extremely familiar.
    It’s visible, flexible, scalable, and it sets you up to move on to Vulkan after
    you’ve learned the essentials of 3D rendering.
