  text: The thing that makes it &quot;hard&quot; is that it&#x27;s all indirect. You
    compile a program for the GPU (a shader). Then you have to setup data (textures
    and buffers) for it. Then, you need to spend a bunch of time telling the GPU how
    to use that data, offsets where each piece of data is, what formats the data is
    in,, how to advance to the next piece of data, etc.. etc..<p>There are a few libraries
    that try to abstract over all this indirection but all the graphics APIs themselves
    are lower-level so you&#x27;re left to do all of that yourself.<p><a href="https:&#x2F;&#x2F;docs.swmansion.com&#x2F;TypeGPU&#x2F;"
