  text: 'You underestimate the effect of two factors.<p>First, GPUs aren&#x27;t simply
    &quot;highly parallel CPUs&quot;, they also contain a whole lot of fixed function
    hardware that is specialized for real-time computer graphics. This hardware isn&#x27;t
    exposed as &quot;fancy instructions&quot;, it is set up in other ways, which is
    achieved through a device driver.<p>Second: GPUs are coprocessor, separate from
    the CPU where another OS is running. This also necessitates a device driver to
    manage scheduling, synchronization, etc. with the main OS. Because, in case you
    were not aware, the GPU itself runs its own little operating system, although
    it is rarely called that.'
  score: 0
