  author: johnnyanmac
  text: It&#x27;s partially historical; I&#x27;m sure if we redesigned GPGPU today
    from the ground up, we&#x27;d have an entirely different pipeline. And partially
    due to hardware vendor lock-in; you can&#x27;t really design an alternative to
    Vulkan&#x2F;d3d12 even if you had the skill and drive to do so.<p>But also partly
    in the fact that the GPU is specialized for certain operations over a CPU. It
    wants and need to obtain data in a different way from a CPU to maximize throughput.
    So language constructs are designed around making sure developers stay on this
    fast path. The complexity can be seen as some intentional gatekeeping to signal
    that this kind of programming is only for specific kinds of problems.
