  author: flohofwoe
  text: 'I think most of it comes down to &#x27;historical accidents&#x27; tbh.<p>E.g.
    if CPUs would have closed ISAs and heavily guarded IPs, you&#x27;d also need a
    &#x27;driver&#x27; and an &#x27;OpenCPU API&#x27; to make any use of them (of
    course the public ISA of a CPU <i>is</i> essentially the driver interface  baked
    into the hardware).<p>The other big difference is focus on decent single-thread
    performance for CPUs versus performing thousands of small tasks in parallel on
    GPUs, but each one slowly. This difference causes a different programming model
    (e.g. running an entire application in a single &#x27;main&#x27; function from
    start to finish, versus spawning small specialized tasks which are running across
    hundreds of threads).<p>And the specific problem with Vulkan is that it tried
    to solve two conflicting requirements: on one hand being an explicit low-level
    API without &#x27;magic abstractions&#x27;, on the other hand supporting very
    different GPU architectures (especially the mobile GPU zoo). The resulting mess
    was quite predictable to be honest...'
