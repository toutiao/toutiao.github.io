    This is because, since Levenshtein distance allows a replace edit, you can get from a string like “abaa” to any string starting with “ab”. So once you have all 841 strings starting with every combination of the first two characters, that’s it, you’re done, no more names. That’s 1.2% of the total name space actually available to choose from.

    841 / 707281 ~= 0.12%, not 1.2%. Furthermore, actually computing all squatted "neighbours" with 2 replacements and insertions/deletions and then greedily taking the first available name as many times as possible (I tried random too, was less effective) yields a set of 672 words that saturates the full 4-character namespace. That leaves just 0.095% of the available namespace.
