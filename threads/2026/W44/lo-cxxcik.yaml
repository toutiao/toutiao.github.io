  author: david_chisnall
  text: |-
    The biggest issue I've seen with quality has nothing to do with the video stream and everything to do with the scaling.  Someone shares a window of a particular size, rendered with antialiasing at their screen resolution.  It's then rendered in my client at a different size and resolution.  Any antialiasing is now introducing blur.
    Teams can do the right thing here for Excel and PowerPoint: instead of streaming video, it runs the web version of the program in every client.  For Excel, everyone can edit (if you set the correct permissions).  For PowerPoint, the presenter gets a presenter view and everyone else gets the slide view.  The slide view is rendered locally and so screen readers work, as does increasing the contrast or arbitrary levels of magnification.
    I would love to see something like this standardised, where each client has a sandboxed web view that will talk to the same service and that service can give different views to different clients.  That way, you could do things like run pdf.js to provide a PDF-based presenter view sync'd to the presenter but still have scalable, antialiased, text.  Or arbitrarily complex views.
