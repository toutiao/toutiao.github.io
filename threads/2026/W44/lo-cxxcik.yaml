  author: k0nserv
  text: 'The problem with allowing WHIP directly for the likes of Zoom, Google Meets,
    and Teams is that they need to balance between producers and consumers. They need
    to ensure the encoded media is using an encoder configuration that the consumers,
    or themselves in the case of transcoding, can decode. They also need a way to
    control bandwidth towards consumers, for example by having several quality levels
    to pick between . All of this to say: to create a good conferencing experience
    you need to control the way media is encoded and decoded, allowing arbitrary media
    ingress is not compatible.'
