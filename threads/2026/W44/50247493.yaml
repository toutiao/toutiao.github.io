  author: samstokes
  text: |-
    I love the idea of helping people learn good debugging habits and understand their code. But this seems like it is still just giving the answers, and would still create the same dependence on AI to do your thinking:<p><pre><code>  You: I&#x27;m not sure, it seems random

      Nietzschian: &quot;Random&quot; is the word we use when we haven&#x27;t looked
      hard enough. What do the server logs say for the 403
      responses? Go look. I&#x27;ll wait.
    </code></pre>
    That move from &quot;I don&#x27;t know&quot; to &quot;where could I look to find out&quot; is one of the key habits that makes someone good at debugging, and here &quot;Nietzsche&quot; is just doing it for you.<p>It might seem obvious to look at the logs, but in my experience 90% of being stuck debugging something is just not yet having looked at all the available evidence.<p>It&#x27;s true you could learn these habits by exposure to them, and this could be a neat alternative to pairing with a more senior engineer for that. But it looks like you could easily just keep saying &quot;it&#x27;s random&quot;, &quot;I don&#x27;t know&quot;, and the model would keep telling you what to do next, without you actually having to think.<p>I wonder if making it even more Socratic would fix this? E.g. &quot;how do you know it&#x27;s returning 403s? Oh, logs you say? Is there anything else they could tell you?&quot;
  score: 0
