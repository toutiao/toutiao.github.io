  author: stillpointlab
  text: What I find interesting is that Nietzsche&#x27;s critique of Socrates dialectic
    has to do with the transfer of power&#x2F;authority.<p>Nietzsche states that sovereign
    power&#x2F;authority commands without justification. Socrates did not have sovereign
    power and was therefore unable to win in a traditional power struggle. Socrates
    therefore reframed the discussion around justification through rational discourse,
    thereby transferring authority from the old aristocracy to a new priesthood of
    truth. This relied on the moral claim made by Socrates and eventually adopted
    by the Greeks (and Western Europe) that virtue = reason (the search for Truth).<p>So
    if we accept this interpretation of Nietzsche, then creating AIs that demand justification
    from us could be seen as handing over power and authority to the AI.
