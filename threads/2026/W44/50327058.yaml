  author: gregw2
  text: This warning goes back much much longer than 2016 even.  Minimizing dependence
    of Europe on USSR&#x2F;Russian energy was an unsung large part of Reagan&#x27;s
    administration&#x27;s strategy for winning the Cold war which was largely an economic
    battle whose policy preconditions for economic warfare were set as far back as
    1962.<p>After Reagan&#x27;s election in 1980 the US tried very hard to slow and&#x2F;or
    block the creation of the Urengoy–Pomary–Uzhhorod (Trans-Siberian) pipeline when
    it started imposing sanctions on the USSR after it declared martial law in Poland.
    German president Schroeder had agreed to the pipeline in 1980.<p>The US imposed
    export controls on technical equipment used for building that pipeline. It urged
    European governments not to build the pipeline, it then expanded the embargo to
    all global subsidiaries of US companies and anyone with licenses with US firms.
    The US even allegedly created dummy plans for covert defective pipeline equipment
    and leaked those plans resulting in a trans siberean pipeline explosion that delayed
    the project. (Some claim the explosion was caused by bad construction techniques
    and&#x2F;or was just a psyop.)<p>All this to pressure the Russian economy which
    was not in good shape and for whom the pipeline would have been an economic lifeline
    for the USSR. The Europeans, wanting to reduce middle eastern dependence on oil
    persisted and eventually got the US to rollback the global sanctions in return
    for other forms of sanctions. Peter Schweitzer wrote about this as early as his
    1994 book &quot;Victory&quot; but there are various others who have covered it
    since. The pipeline started shipping oil to the French in 1984 despite all that.  The
    US started its pipeline focus rather late in part because it did nothing under
    Carter, but the energy dependence it helped lock in was a major, major bone of
    contention in the early 80s between the US and Europe.
