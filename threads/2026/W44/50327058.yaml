  author: adrian_b
  text: The drawings in the article show that the yellow goop is no longer there.<p>If
    they do not use a multiple LED structure but they still have a fluorescent conversion
    layer, the layer must be very thin and deposited on the top surface of the LED.
    It could consist of &quot;quantum dots&quot;, like in some TV panels, i.e. very
    small crystals which emit light of a color depending on the composition and size
    of the nanocrystal when illuminated with ultraviolet or blue light.<p>However,
    &quot;quantum dot&quot; is a term that has already been used for a long time in
    marketing with the intention to suggest a superior technology. If they were using
    this, I expect that they would have bragged about it.<p>So from the wording of
    the press release I think that a multiple LED structure is more likely than a
    &quot;quantum dot&quot; conversion layer, even if the latter would provide both
    a better spectrum coverage and superior aging characteristics (by avoiding a color
    hue shift in old LEDs).
