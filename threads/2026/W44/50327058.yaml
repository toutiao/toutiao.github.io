  content: "[![AES Semigas](/images/external/AES-SEMI-GAS-Semiconductor-Today.png)](https://www.appliedenergysystems.com/stakes)\n\n
    [\n\nSign Up to Our Free Weekly E-Brief\n\n](/subscribe.shtml)\n\n###### [Media
    Kit Download & Details](/advertising.shtml)\n\n[![Honeywell](/images/external/AIS_Semiconductor_Today_BNR_Ad_830X100.jpg)](https://advancedmaterials.honeywell.com/us/en/initiative/pcm-for-evs-knowledge-center?utm_source=ee_times&utm_medium=advertisement&utm_campaign=25-ess-am-em-usa-BitCast_Email-701Hu000002MROfIAO&utm_term=SEMICONDUCTOR_TODAY&utm_content=img-en-SEMICONDUCTOR_TODAY-lp)\n\nNews:
    [LEDs](/news-leds.shtml)\n\n**29 October 2026**\n\nSeoul Viosys begins mass production
    of rare-earth-free white light emitter, with chips as small as 10µm\n\nFor three
    decades, white LEDs have depended on rare-earth materials such as yttrium aluminium
    garnet (YAG) layered onto a blue LED chip (Figure 1). Opto-semiconductor device
    maker Seoul Viosys Co Ltd (SVC) says that it has now broken that dependence by
    developing and mass producing a chip that emits white light without rare earths.
    The chip can be as small as 10µm.\n\n![Figure 1. New invention: white WICOP 3.](Figure_1_New_invention_white_WICOP_3.jpg)\n\n_Figure
    1. New invention: white WICOP 3._\n\nSeoul Viosys and its parent company South
    Korean LED maker Seoul Semiconductor Co Ltd opened up the micro-LED market with
    WICOP (Wafer Integrated Chip on PCB), which is a chip architecture that eliminates
    the package altogether. With WICOP, the two companies have already developed and
    mass produced ultraviolet, blue, green, red and infrared LEDs smaller than 100µm
    in size. WICOP 3 is the third generation of the technology, extending that capability
    to white light without rare-earth elements (REEs).\n\n## White LED market\n\nWhite
    LEDs comprise about $10bn of the $15bn global market for packaged LEDs. WICOP
    3 can now replace them with a technology free of rare earths, reckons the firm.\n\nMore
    significantly, WICOP 3 is claimed to be the world’s first white opto-semiconductor
    to achieve white light in a micro-LED smaller than 100µm.\n\nWICOP 3 uses neither
    rare earths (a major source of environmental pollution) nor a package. Nor does
    it contain synthetic silicone resins, plastics or lead frames used in conventional
    LEDs. The result is said to be a far more environmentally friendly product that
    costs about half as much to make as a conventional white LED.\n\n## Creating new
    markets\n\nThe miniaturized transistor replaced the vacuum tube and created vast
    new markets in electronics. The company believes micro white opto-semiconductors
    can do the same.\n\nWICOP 3 generates white light from gallium nitride (GaN) alone.
    Also, the chip contains no plastics, silicone or other synthetic organic materials.
    It can hence last for decades. In lighting, invisible micro-emitters could be
    embedded in wallpaper or window glass, lighting a space with no fixtures at all.
    This would end the inconvenience of replacing bulbs and the high cost of fixtures.
    The company expects this to create a new market tens of times larger than today's
    $10bn white LED market.\n\n## Performance\n\nIn its first mass production, a micro-LED
    chip measuring just 25µm x 10µm produced 0.015lm of white light. Its chromaticity
    falls inside the CIE standard white region (Figure 2). Luminous efficacy is already
    close to 100lm/W. The company aims to reach 200lm/W within two years. A conventional
    1000µm x 1000µm chip achieves 50lm.\n\n![Figure 2. WICOP 3 brightness by size.](Figure_2.jpg)\n\n_Figure
    2. WICOP 3 brightness by size._\n\n## Technical significance\n\nUp to now, WICOP
    could make chips smaller, but white light still required a package containing
    rare earths. White chips therefore could not go below 1000µm. This held back cost
    reduction. White micro LEDs under 100µm (0.1mm) were also out of reach. Removing
    rare earths changes that. White light is now possible both in large chips of 1000µm
    and above and in micro LEDs below 100µm.\n\n## Future plans\n\nSeoul Group (consisting
    of Seoul Semiconductor and Seoul Viosys) will start mass production of WICOP 3
    in fourth-quarter 2026. It says it will supply first those customers that have
    respected its intellectual property and relied on its products.\n\n## Seeking
    supply chain partners\n\nSeoul Viosys uses WICOP to produce micro-emitters smaller
    than 100µm. Micro-LEDs built on WICOP can now carry high volumes of AI data over
    distances from under 1cm to tens of meters. Over short distances, data has long
    traveled electrically through copper wire.\n\nUnder the data loads of the AI era,
    copper links slow down, generate heat and consume much more power. Using light
    instead, Seoul Viosys arranges 1000 WICOP chips of about 10µm each in a grid within
    an area of 1mm or less. This array transmits data 10 times faster at one tenth
    of the power. Market research firms including Omdia forecast that this technology
    and augmented reality (AR) together will create a new $60bn market within five
    years (equal to half of today's DRAM memory market).\n\nSeoul Semiconductor’s
    founder Chung Hoon Lee says that the company intends to target WICOP 1, 2 and
    3 at applications in AR glasses and AI data communications. These technologies
    work on scales of 10µm or less. To that end, it is seeking trusted upstream and
    downstream micro-LED supply chain partners in AR displays and AI transmitters.\n\nSee
    related items:\n\n[Seoul Viosys expanding business beyond components to data-interconnect
    transceivers](https://www.semiconductor-today.com/news_items/2026/apr/seoulviosys-280426.shtml)\n\nTags:
    [Seoul Semiconductor](https://semiconductor-today.com/search_results.htm?q=Seoul%20Semiconductor)\n\nVisit:
    [www.seoulviosys.com](http://www.seoulviosys.com/)\n\nVisit: [www.SeoulSemicon.com](http://www.seoulsemicon.com/)\n\n[![RSS](/images/rss.png)](/rss.shtml)\n
