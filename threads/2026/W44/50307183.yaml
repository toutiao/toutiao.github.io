  author: jcranmer
  text: To hammer this point home:<p>The sender and the receiver both have a copy
    of the email. The receiver&#x27;s MTA pretty much has to have a copy of the email
    for sane antispam to work. Email itself intrinsically leaks the sender, recipient,
    and time as part of the SMTP message, which means anyone with access to email
    server logs can recover this information no matter how much security and encryption
    you try to put on top of it, and that means that whatever three-letter agency
    you care about probably has access to all the information they want anyways.<p>The
    only meaningful difference in security is going to be whether or not the outgoing
    MTA is going to try to use (or even require) TLS on the MTA-MTA connection, and
    what level of encryption is applied to the at-rest email.<p>Personally, I&#x27;m
    not too fussed about a mail system administrator being able to read my email because
    of the BOFH principle... it&#x27;s not worth the sysadmin&#x27;s time to read
    my email, because it&#x27;s just not interesting.
