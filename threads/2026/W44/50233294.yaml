  author: saghm
  text: My favorite feature is the built-in distinction between what&#x27;s mutable
    and what&#x27;s immutable in my history. I can freely modify any commits I make
    locally without issue, since no one else would be able to depend on them, but
    if I push something or fetch it from a coworker, I have the safety of not needing
    to be careful when doing the equivalent of an amend or rebase because it will
    fail with an error telling me to use a flag to bypass the immutability protection
    if that&#x27;s what I actually want.<p>Not having to stage changes in lieu of
    them automatically getting picked up was a bit of a learning curve for me, but
    now that I&#x27;ve gotten used to it I like it a lot better and I don&#x27;t think
    I could go back. The equivalent of the reflog pretty much always has my changes
    in it if I accidentally lose them without manually saving due to the snapshotting,
    and I have no need for a stash because commits and branches are essentially just
    recording a checkpoint rather than being things that feel &quot;heavyweight&quot;.<p>As
    an added bonus, dealing with conflicts is a lot less annoying because each commit
    records its conflicts separately, so fixing them doesn&#x27;t require doing a
    stateful pipeline of changes in a big rebase; I can just do them piecemeal, in
    any order I want, and even just check out other stuff and work on them before
    coming back later if I feel like it.<p>I was &quot;that guy&quot; who would sometimes
    have coworkers come for help with git problems (<a href="https:&#x2F;&#x2F;xkcd.com&#x2F;1597&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;xkcd.com&#x2F;1597&#x2F;</a> alt text). I&#x27;ve
    forgotten most of that knowledge (and all of that muscle memory) and didn&#x27;t
    have to learn nearly as much to replace it with the ability to do a lot more with
    a lot fewer mistakes.
  score: 0
