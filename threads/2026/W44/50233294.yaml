  author: alexjameson
  text: I&#x27;m a technical writer and I use agents a lot for my work and personal
    projects. I also created a basic open-source preset for agents to create end-user
    documentation.<p>During the preset testing, I created dozens of READMEs using
    agents. Although I can&#x27;t say that any of them were perfect for me, most of
    them were good enough.<p>README is a very special kind of document. For small
    projects, it&#x27;s often the only one that potential users will read. The README
    should explain what the product is, what problems it solves, how to get started,
    provide some examples, and explain the restrictions. It should cover all these
    topics in a concise way so that even readers who aren&#x27;t used to read long
    texts can easily read through it. It&#x27;s definitely up to human to make it
    clear and easy to understand.
