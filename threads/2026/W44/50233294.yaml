  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n# ThinkRail\n\nThinkRail is the agentic IDE that gets better
    every time you use it — learning your project through living specs today, and
    building its own capabilities tomorrow.\n\nWe built a rich interface around the
    pi coding agent, isolated work into separate workspaces, and gave the agent durable
    project knowledge through living specs and reusable skills. Next, we're adding
    full extension support, so ThinkRail can create the tools it needs based on how
    you actually work.\n\nWebsite: thinkrail.ai · Blog: thinkrail.ai/blog\n\n⭐ If
    you find ThinkRail useful, give it a star — it helps others discover it.\n\nA
    pi session and the change it made, scoped to an isolated git-worktree workspace.\n\n##
    What you get\n\n- Isolated workspaces. Open any git repo as a project and cut
    workspaces from it as git worktrees, each with its own branch and working directory.
    Agents work in parallel without touching your checkout; merge the good branch,
    delete the rest. You can also attach existing worktrees or explicitly work in
    the project folder itself. Finished and dormant workspaces settle onto a per-project
    shelf on their own — when their pull request merges or closes, or after a quiet
    week — and come back the moment you work in them. The topbar shows where the active
    branch stands against origin and its pull request, with the next step one click
    away: publish, push, or open a PR described from the plan, the commits, your PR
    template, or an agent-written draft. Once a GitHub PR is open it shows the CI
    checks and review decision, and lets you mark it ready, hand failing checks or
    a diverged branch to the agent, merge it with the repository's last-used method,
    reopen it, or delete the remote branch.\n\n- A real IDE around the agent. A splittable
    workbench of Monaco editor tabs, a Files tree with live git change marks and a
    Changed view, terminals, and documents — all scoped to the active workspace. Leave
    anchored review comments on files and diffs and send them to a chat as structured
    context, or open the worktree in your installed IDE.\n\n- Chats that stream like
    the engine thinks. Several concurrent pi sessions per workspace, each with its
    own model and live token and cost readout. Steer a running turn or queue a follow-up,
    delegate to subagents, and work a shared plan the agent updates and you edit —
    each completed step can be committed and reviewed on its own.\n\n- Specs as ground
    truth. A connected graph of SPEC.md files lives beside the code; the agent reads,
    searches, and maintains it through dedicated spec_* tools, so intent survives
    the session. The read-only Specs tool renders the graph as a tree in the workbench.\n\n-
    Skills and workflows. Portable Agent Skills you already keep for other coding
    agents are read in place, and bundled workflows guide project setup, design brainstorming,
    and shipping a pull request — pushing the workspace branch and opening or updating
    its GitHub PR through your own gh.\n\n- Agent tools beyond the shell. Web research,
    and inline diagrams, option comparisons and file previews rendered right in the
    chat — when the agent proposes a UI change it shows a before/after mockup you
    can comment on like a diff. Settings → Extensions lists the ThinkRail extensions
    the agent gets and lets you switch each one off.\n\n- MCP servers. Connect the
    MCP servers in your pi mcp.json (or add them, and a few presets, from Settings):
    ThinkRail asks in the chat before calls the server does not mark read-only (or
    always allows the tools you trust in a project), keeps servers a repository defines
    off until you approve them, signs you in to OAuth servers from Settings, and shows
    each chat's servers next to its background commands and subagents.\n\n- Your providers,
    your credentials. Sign in with JetBrains AI or connect any provider through pi's
    own auth. ThinkRail has no accounts of its own.\n\n- Desktop app or browser. A
    native desktop app, or the thinkrail CLI that opens the same app in your browser.
    Both embed the same engine host; app state lives under ~/.thinkrail.\n\n- Your
    language. Settings → Language follows your system language or a language you pick;
    English and Simplified Chinese are built in. Add a language ThinkRail doesn't
    ship yet by dropping a translated en.json into ~/.thinkrail/locales — it applies
    as you save. Agent replies and tool output stay as the agent wrote them.\n\nThe
    project's spec graph as a tree, with the spec itself rendered alongside.\n\n##
    Install\n\nThinkRail ships in two additive forms: a native desktop installer and
    the self-contained thinkrail CLI. Both are published with SHA256SUMS on the releases
    page.\n\n### Desktop\n\nDownload the thinkrail-desktop-* asset for your platform:\n\n-
    macOS (Apple Silicon) — open the DMG. There is no Intel desktop build.\n\nmacOS
    (Apple Silicon) — open the DMG. There is no Intel desktop build.\n\n- Windows
    x64 — extract the complete setup ZIP, then run its setup executable in place,
    next to its payload.\n\nWindows x64 — extract the complete setup ZIP, then run
    its setup executable in place, next to its payload.\n\n- Linux x64 / ARM64 — extract
    the setup tarball and run installer. Desktop builds need glibc 2.38+ with GTK
    3, WebKitGTK 4.1, Ayatana AppIndicator 3, and librsvg 2 — Ubuntu 24.04 or newer:
    sudo apt install libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2\n\nLinux
    x64 / ARM64 — extract the setup tarball and run installer. Desktop builds need
    glibc 2.38+ with GTK 3, WebKitGTK 4.1, Ayatana AppIndicator 3, and librsvg 2 —
    Ubuntu 24.04 or newer:\n\nsudo apt install libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
    librsvg2-2\n\nPackaged stable and nightly desktop builds check for updates in
    the background and offer them in Settings → Updates: Download → Preparing update
    → Install & Restart. Nothing is applied until you choose Install & Restart. ThinkRail
    then shows the installation's progress and log, closes, and reopens on the new
    version. After the restart it tells you whether the update installed. If it didn't,
    it explains why and offers to retry. The updater appears only when the package
    carries a valid HTTPS feed identity; installations that predate that identity
    need one manual installation first.\n\n### Command line\n\nThe installer downloads
    the right binary, verifies its SHA-256 checksum, and puts thinkrail on your PATH.\n\nmacOS
    / Linux (also Windows under Git Bash):\n\ncurl -fsSL https://raw.githubusercontent.com/JetBrains/thinkrail/main/install.sh
    | bash\n\nWindows — the same command works from cmd and PowerShell:\n\npowershell
    -c \"irm https://raw.githubusercontent.com/JetBrains/thinkrail/main/install.ps1
    | iex\"\n\nThen run thinkrail, optionally with a git repo to open as a project:\n\nthinkrail
    ~/code/my-repo\n\nthinkrail needs git on your PATH and a model provider — sign
    in with JetBrains AI from the app or use your own provider credentials. thinkrail
    --help lists the flags; thinkrail --version prints the build.\n\nThe installer
    takes --channel stable|nightly and --version; a pinned version must belong to
    the selected channel:\n\ncurl -fsSL https://raw.githubusercontent.com/JetBrains/thinkrail/main/install.sh
    | bash -s -- --channel nightly curl -fsSL https://raw.githubusercontent.com/JetBrains/thinkrail/main/install.sh
    | bash -s -- --channel stable --version 0.1.2 curl -fsSL https://raw.githubusercontent.com/JetBrains/thinkrail/main/install.sh
    | bash -s -- --channel nightly --version 0.2.0-nightly.10\n\nOn Windows the options
    are environment variables (THINKRAIL_CHANNEL, THINKRAIL_VERSION, THINKRAIL_PREFIX,
    THINKRAIL_NO_MODIFY_PATH):\n\n$env:THINKRAIL_CHANNEL='nightly'; irm https://raw.githubusercontent.com/JetBrains/thinkrail/main/install.ps1
    | iex # PowerShell set \"THINKRAIL_CHANNEL=stable\" && set \"THINKRAIL_VERSION=0.1.2\"
    && powershell -c \"irm https://raw.githubusercontent.com/JetBrains/thinkrail/main/install.ps1
    | iex\" # cmd\n\nInstalled stable and nightly CLI hosts periodically offer Run
    Update in Settings → Updates. It runs the host "
