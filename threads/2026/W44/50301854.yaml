  title: Azure's Weakest Link - Five Full Cross-Tenant Compromises
  fetch_status: success
  content: "In my previous blog posts, [Azure’s Weakest Link?](https://binarysecurity.no/posts/2025/03/api-connections)
    and [Azure’s Weakest Link - Full Cross-Tenant Compromise](https://binarysecurity.no/posts/2025/08/azures-weakest-link-part2),
    I gave an overview of the severely insecure architecture behind API Connections
    in Azure, a part of Azure Logic Apps, and an instance of a full cross-tenant compromise
    using these inherent flaws. Now I am back with some more vulnerabilities in this
    system, each giving the same primitives to the attacker. In total, the vulnerabilities
    here netted me a cool $200,000.\n\nI also held a talk detailing this at Blue Hat
    Asia 2026, and when the recordings are out, I will add a link here.\n\n## TL;DR\n\nAPI
    Connections allow anyone to fully compromise any other connection worldwide, giving
    full access to the connected backend. This includes cross-tenant compromise of
    Key Vaults and Azure SQL databases, as well as any other externally connected
    service, such as Jira or Salesforce. The only thing stopping exploitation is really
    the layers of input validation bolted onto the various systems, but as you will
    see, it is really difficult to catch all the edge cases here.\n\n## Architecture\n\nIf
    you haven’t read the first parts of this series, I would recommend checking those
    out first, [Azure’s Weakest Link? - Part 1](https://binarysecurity.no/posts/2025/03/api-connections)
    and [Azure’s Weakest Link - Full Cross-Tenant Compromise](https://binarysecurity.no/posts/2025/08/azures-weakest-link-part2),
    but if you don’t care, I will go through the most important parts of the architecture
    first.\n\nFrom [Microsoft’s documentation](https://learn.microsoft.com/en-us/connectors/connector-architecture),
    we see a quite intriguing diagram of how the API Connection architecture is built.\n\n![Microsoft's
    documented infrastructure](/assets/images/posts/Onr_connector_architecture.png)\n\nThis
    basically spells out all that is needed to understand how the system operates,
    kudos to whoever made it!\n\nIt works like this\n\n1. A logic app, the symbol
    on the bottom left, queries a shared Azure API Management instance\n2. The API
    Management instance first checks the swagger (OpenAPI) definition of the connector
    type and checks that it is a valid action\n3. A sort of key exchange happens where
    the input token, or key, is exchanged for the configured token for the backend
    service\n4. The API Management instance finishes the call with this new token
    to the backend instance.\n\nFrom this, we can surmise that if we are able to trick
    the API Management instance to operate on a different connection than the ones
    we own, we would be able to effectively use the configured token for a victim’s
    connection on their backend service.\n\nThis service can, in effect, be anything.
    As you can see [here](https://learn.microsoft.com/en-us/connectors/connector-reference/),
    the list of backend services is effectively unbounded and includes a number of
    Azure services.\n\nHowever great the diagram is, there is one crucial omission,
    which we have already used to great effect in part 2 of this series. By using
    the ARM REST API `DynamicInvoke` or `/extensions/proxy/` endpoints, we can directly
    query the APIM service through ARM. I have taken the liberty of updating the diagram
    to match this.\n\n![Updated Connector Architecture](/assets/images/posts/Onr_connector_reference_fixed.png)\n\nConsidering
    this, and the fact that, as a resource manager, ARM basically has full access
    to everything, our exploitation pathway becomes clear. We must trick the calling
    service into querying a different connection than ours, and thus get full control
    of the backend service.\n\nCaveat: It is, of course, possible for the people who
    set up these connections to scope their access tokens or keys so that the API
    Connection has minimal privileges in the backend. I would guess, however, that
    this is rarely done. In the case of OAuth connections, it will surely always be
    the token of the person who initially made the connection. And for the API key
    case, well, who cares enough to scope such things minimally? Microsoft doesn’t,
    at least.\n\n## Initial Exploitation\n\nThe first cross-tenant exploitation I
    achieved in API Connections, and in fact in Azure as a whole, has already been
    described in part 2. As a recap, here is an example payload using the `DynamicInvoke`
    endpoint of my own connection to read the Key Vault of a different tenant.\n\n
    \   POST /subscriptions/8e3ce52f-d45b-4347-8705-65892507465e/resourceGroups/token-storer/providers/Microsoft.Web/connections/custom2/DynamicInvoke?api-version=2018-07-01-preview
    HTTP/2\n    Host: management.azure.com\n    Authorization: Bearer <token>\n    Content-Type:
    application/json\n    Content-Length: 147\n    \n    {\n        \"request\":{\n
    \           \"method\":\"get\",\n            \"path\":\"path/%2e%2e/%2e%2e/%2e%2e/%2e%2e/apim/keyvault/fd8d0f4f4069495991ccb4974f96a1ed/secrets/victimsecret/value\"\n
    \       },\n    }\n\n    HTTP/2 200 OK\n    Cache-Control: no-cache\n    Pragma:
    no-cache\n    Content-Length: 1329\n    \n    \n    {\n        \"response\": {\n
    \           \"statusCode\": \"OK\",\n            \"body\": {\n                \"value\":
    \"dontreadme\",\n                \"name\": \"victimsecret\",\n                \"version\":
    \"7914d45aa60342809fb8cc12dc68b10e\",\n                \"contentType\": null,\n
    \               \"isEnabled\": true,\n                \"createdTime\": \"2025-04-04T05:38:26Z\",\n
    \               \"lastUpdatedTime\": \"2025-04-04T05:38:26Z\",\n                \"validityStartTime\":
    null,\n                \"validityEndTime\": null\n            },\n            \"headers\":
    {\n                <Headers>\n            }\n        }\n    }\n\nAs you can see,
    it’s a pretty clear path traversal vulnerability. This implies what we already
    assumed: When the request fires from ARM to the APIM instance, it has rights to
    all connections, regardless of what it operates on.\n\n## Further exploitation\n\nA
    couple of weeks after I reported this vulnerability, it got marked as fixed, and
    when I tried it again, the following error message greeted me:\n\n![Vulnerability
    fixed by restricting the path](/assets/images/posts/ONR_dynamic_disallowed_path_response.png)\n\nNow,
    I considered whether or not this was a sufficient fix. It seemed to restrict the
    paths allowed, rather than the underlying token issue, so I guessed there would
    be ways around it.\n\nAn interesting little fact about the ARM API is that, in
    some cases, it might not be as much of a black box as you assume. The relevant
    code can _sometimes_ be found within the resource types themselves. I do not know
    whether this code actually executes on these machines or is merely included as
    an artifact, but it is a gold mine of interesting information. So, I created a
    Standard Logic App, which provides a fully dedicated host, SSHed into it, and
    extracted the code. Lo and behold, look what I found:\n\n![The validation code
    paths include a check for `../`](/assets/images/posts/Onr_validate_managed_api_definition.png)\n\nCan
    you see the fix they implemented?\n\nWhat was even more interesting here actually
    was something I found, and was not really even looking for. When searching for
    the actual `DynamicInvoke` code, what greeted me was not actually just this one
    public function, but four:\n\n![I found other function definitions right next
    to Dynamic Invoke](/assets/images/posts/Onr_Dynamics_definition.png)\n\nThese
    functions are completely undocumented, and I could find no reference to them anywhere.
    However, they were reachable and located along the same path. So, for instance,
    to hit `DynamicList` here, simply change `dynamicInvoke` in your URI to `DynamicList`.\n\nKnowing
    that the slap-dash blacklisting fix that they implemented only applied to `DynamicInvoke`,
    I assumed that these would all be vulnerable in the same way if they had the same
    functionality. Without boring you too much with the required arguments and return
    values here, the exploitation method is really quite the same, although the payload
    is a bit more involved. For `DynamicList`, you "
