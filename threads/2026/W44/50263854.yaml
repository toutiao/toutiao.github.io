  author: LoganDark
  text: Discord&#x27;s text search is a simple intersection-of-all-words search, with
    some filters slapped on top. And it&#x27;s not even the word you typed, it&#x27;s
    all words that seem maybe semantically equivalent or similar. When I know the
    exact word I want to search for (e.g. &quot;loves&quot;), it sucks to always get
    results for every other related word (e.g. &quot;love&quot;, &quot;loved&quot;,
    &quot;loving&quot;). Maybe it&#x27;d be a useful feature if it had a toggle, but
    it doesn&#x27;t. Some other words that have problems with this are time&#x2F;times,
    caring&#x2F;care, wanting&#x2F;want&#x2F;wants, and fucking allowance&#x2F;allow&#x2F;allows.
    Seriously?? <i>Allowance</i> is treated the same as <i>allow??</i><p>Can&#x27;t
    search for or with symbols. Lots of search engines have this issue. Just ignores
    them. Want to search for instances of &quot;:3&quot;? You&#x27;re actually searching
    for instances of &quot;3&quot;. Not much else to say on this other than it&#x27;s
    annoying.
