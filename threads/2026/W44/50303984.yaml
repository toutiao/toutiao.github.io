article:
  url: https://blog.zamzar.com/2026/10/30/20-years-766-million-files-two-chameleons/
  title: 20 years. 766 million files. Two Chameleons. - The Zamzar Blog
  fetch_status: success
  content: "In 2006, two brothers launched a website using dial-up modems and a battered
    book on writing HTML4, named it after a character who woke up as a giant insect,
    and hoped someone might find it useful.\n\nTwenty years and 766,615,348 file conversions
    later, apparently someone did.\n\n### Some Ridiculous Numbers\n\nBack when we
    launched Zamzar in 2006 we proudly offered a whopping 150 different conversion
    types. We now offer almost 15x that \U0001F440, with 2,128 conversions supported
    in 2026. Over 550 million people have used Zamzar since launch, converting over
    766 million files. We now process over 1 million API requests per day.\n\nBig
    numbers are great (they keep our resident stats-man Mike happy) but more important
    than features and numbers are the people that find and use Zamzar every day. Last
    year alone, we had:\n\n- One visitor from the remote pacific island of Tokelau
    – with a population of 1,499 it is the fourth smallest sovereign state in the
    world.\n\n- Three from Svalbard – a remote Norwegian archipelago which bans cats
    and has more snowmobiles than people.\n\n- 38 from Antarctica \U0001F976 – \U0001F64C
    to the 1,000 scientists who stay there over Winter (hope the vending machines
    are well stocked).\n\n- 41 from the Vatican – h.t. to Leo \U0001F54D \U0001F54A️
    \U0001F64F\n\nWe have questions …\n\n### Twenty years of unexpected adventures\n\nIt
    turns out that running a file conversion website can lead you to some pretty strange
    places.\n\nWe’ve helped the inventor of PowerPoint recover long-lost presentations
    (yes, really), supported internet pioneer Vint Cerf in his efforts to preserve
    our digital history, and partnered with Xerox to help their printers turn documents
    into spoken word audio.\n\nWe’ve been asked to convert sewing machine patterns
    (we couldn’t), resurrect ancient eFax files (we could), and solve more obscure
    file format mysteries than we ever imagined existed.\n\nAlong the way, we’ve appeared
    on the BBC’s Click, received a cease-and-desist letter from Google for letting
    people download YouTube videos, and somehow ended up sponsoring a team of Scottish
    curling champions. That last one definitely wasn’t in the original business plan.\n\n###
    Still small, still independent\n\nTwenty years on, we’re still a small, proudly
    independent UK company. No venture capital, no unicorn valuations, and no plans
    to pivot to an AI-powered blockchain for converting your Gran’s Word documents.
    We’ve watched countless technology trends come and go – social media, Web 2.0,
