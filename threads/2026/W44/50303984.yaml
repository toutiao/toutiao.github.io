    the arrival of Al Pacino, sorry AI.. Throughout it all people still need to convert
    their files.\n\nBeing independent has also given us the freedom to do things our
    own way. We’ve supported more than 60 charities, schools and good causes, donating
    a portion of our profits to organisations doing far more important work than converting
    PDFs.\n\n### The people behind the files\n\nBehind every one of these 766 million
    files is a real person with a real problem. Like Robin, who thought 36 pages of
