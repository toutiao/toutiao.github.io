  author: schiffern
  text: |-
    Extremely cool!<p>Another commenter mentioned[0] that often ergonomic keyboards aren&#x27;t columnar, but staggered. What if for the pin layout, instead of this:<p><pre><code>    1  1  0  0
    </code></pre>
    It was this?<p><pre><code>    1  0  1  0

    </code></pre>
    Then the keys could connect with at least two wires in either columnar <i>or</i> 50% stagger, using the same pins. Each key has a maximum of six neighbors instead of four, but that shouldn&#x27;t be too much trouble.<p>Naturally if you expand to 6 pins it could support 0&#x2F;33&#x2F;66% stagger positions.<p>More cool, I think, is that it doesn&#x27;t have to be aligned? You could imagine shifting the pins and mechanism over from top to bottom, so it&#x27;s a 20%&#x2F;70% stagger. Maybe that would make it structurally stronger, like how bricks are overlapped?<p>Very inspiring project, thanks for sharing.<p>[0] <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50240718">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50240718</a>
