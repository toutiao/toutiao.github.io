  author: fanf
  text: "Yeah, I have an evaluator for C preprocessor expressions which is basically
    this:\nInteger eval_next(Expression *e, int rbp) {\r\n    next(e->here);\r\n    Integer
    i = token[e->here->tok].nud(e);\r\n    while(token[e->here->tok].lbp > rbp)\r\n
    \        i = token[e->here->tok].led(e, i);\r\n    return(i);\r\n}\n\nI removed
    a couple of function calls that do debug tracing, but otherwise that’s it. The
    special cases (including errors) are handled by the token table. The token table
    also dispatches to functions that handle more general cases, such as for binary
    operators:\nInteger led_bin(Expression *e, Integer left) {\r\n    Token op = e->here->tok;\r\n
    \   Integer right = eval_next(e, token[op].lbp);\r\n    return(token[op].bin(left.val,
    right.val));\r\n}"
