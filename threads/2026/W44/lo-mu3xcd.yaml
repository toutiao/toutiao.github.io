  text: "The whole point of Pratt parsing is eliminating the complexity of parsing
    by reducing it to a single question: does the token expect something to the left?\nYou
    no longer see binary, prefix, postfix, ternary, function call, and whatnot operators
    in the stream. You only see nuds & leds.\nI not only dislike Matklad's approach
    to teaching Pratt parsing, but I also strongly believe that it's harmful as it
    completely ignores Pratt parsing mindset itself from growing roots. The whole
    article is not about breaking tokens into nuds & leds, but extending a broken
    parsing loop to actually handle binary, prefix, postfix ... operators. He extends
    the parsing loop every time he stumbles on some \"new\" category of tokens. That's
    not Pratt at all. The point in Pratt is: you don' need to change Pratt's algorithm.
    Pratt's algorithm already works with all these operators. What you need is a framework
    to describe the nuds & leds of your grammar.\nHere's the diff when he adds support
    for postfix operators:\n loop {\r\n     let op = match lexer.peek() {\r\n         Token::Eof
    => break,\r\n         Token::Op(op) => op,\r\n         t => panic!(\"bad token:
    {:?}\", t),\r\n     };\r\n\r\n+    if let Some((l_bp, ())) = postfix_binding_power(op)
    {\r\n+        if l_bp < min_bp {\r\n+            break;\r\n+        }\r\n+        lexer.next();\r\n+\r\n+
    \       lhs = S::Cons(op, vec![lhs]);\r\n+        continue;\r\n+    }\n\nWhy is
    Matklad introducing the unnecessary concept of postfix binding powers? Why is
    Matklad changing the parsing algorithm when the parsing algorithm should already
    be able to handle postfix operators (leds)? If you don't understand nuds & leds,
    you haven't learnt anything about Pratt parsing."
