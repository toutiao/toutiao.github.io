- id: '50334315'
  parent_id: '50334106'
  author: FabCH
  text: It&#x27;s a tradeoff. The length itself is not a problem. It will happily
    diff normal multi-MB files.<p>The problem is the degenerative syntax tree that
    TreeSitter produces in case of, for example a multi-million array of bytes. This
    causes a stack overflow in the TreeSitter C code which takes down the Rust process
    with it.<p>The correct solution would be to prevent TS from crashing, or isolate
    the C&lt;-&gt;Rust boundary better.<p>Or just, not support that for v0.3. Because
    if you are diffing the collected works of Shakespeare as a binary blob in a C++
    header, maybe diffing isn&#x27;t your biggest problem.
