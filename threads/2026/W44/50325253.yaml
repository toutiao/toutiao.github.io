  author: FabCH
  text: |-
    Comparing is slightly complicated but roughly speaking:<p>Difftastic only diffs code, which is only 2&#x2F;3 of all diffs.<p>When only measured on stuff difftastic supports:<p>Difftastic is perfect on 64% of diffs and near-perfect on 17% more.<p>Omnidiff is perfect on 90% of diffs and near-perfect on 5% more.<p>Speed is<p>p50 - 35ms difftastic vs 4ms OmniDiff
    p99 - 637ms vs 420ms<p>Difftastic wins on license. MIT vs AGPL.
