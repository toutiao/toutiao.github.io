  author: joshuat
  text: This also happened on iOS when they began to prompt users before apps could
    access the clipboard. I built an app that would handle the inbound redirect automatically
    if you had a relevant URL in your clipboard - did this for years with many users
    happy with the feature.<p>Then it started prompting users before allowing them
    to paste, and then the claims of privacy violations began to come in.<p>If instead
    I were able to specify what was happening in the prompt rather than iOS giving
    users an ambiguous statement, or even provide a detection pattern, it wouldn&#x27;t
    have been nearly as bad.<p>I feel like this really harms security and privacy
    awareness by flooding the field with unimportant prompts&#x2F;warnings to the
    degree that a real issue is similarly ignored because it is assumed to just be
