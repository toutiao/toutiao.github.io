  author: mschuster91
  text: "&gt; Chromium browsers (Chrome, Brave, Edge, Island, Arc) copy their own
    app bundle into a random temp folder at launch so the code signature survives
    in-place updates. macOS keys the Local Network decision to that random path, so
    the next launch looks like a brand-new app.<p>OH DEAR GOD that explains so much
    other cursed behavior, including the &quot;do you want to allow google chrome
    helper to show notifications&quot; always reappearing. or teams. or anything that
    does autoupdates.<p>&gt; Nothing on a typical Mac needs this permission except
    a printer or scanner utility, a media server, or a LAN-discovery tool, and those
    you answer once and they&#x27;re done.<p>This is wrong. Browsers and media players
    need it because that is how multicast discovery for stuff like Chromecast works.
    Spotify, same thing. And Steam plus virtually all games with LAN multiplay for
    the same reason. Did I note already that Steam also has an autoupdater and so
    does Spotify and... argh.<p>Apple really needs to fix the very first point, preferably
    in a way that doesn&#x27;t force app developers to ship a &quot;helper&quot; binary.<p>(Side
    note: it might even be the case that opening the file picker may be enough, if
    you got network-discoverable paths in your Finder Locations sidebar, but i&#x27;m
    too tired to test that one out...)"
