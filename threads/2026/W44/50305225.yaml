  author: coldpie
  text: For 50 years, computer security has largely been built on the theory that
    most targets aren&#x27;t worth the relatively high effort to compromise, so it&#x27;s
    not worth it to spend the money on security.  We&#x27;re now reaching a point
    where the effort to compromise is dropping close to 0, which means we&#x27;ve
    got 50 years of insecure software to reckon for.<p>The advice today is the same
    as it has ever been, though.  Always assume that any networked computer is or
    may become compromised.  Do not do anything critical on a networked computer,
    because it is or may become compromised.  You can still use computers, but assume
    that a bad actor may take control at any time, and plan for that eventuality.<p>For
    example, if you are hooking up a networked computer to your town&#x27;s water
    supply system, ask yourself &quot;what would happen if Iran got complete control
    of this system?&quot;  If you&#x27;re putting your school system&#x27;s students&#x27;
    mental health data into a networked computer, ask yourself &quot;what would happen
    if all of this data became public?&quot;
