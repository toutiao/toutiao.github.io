  author: rhodey
  text: 'This is the same style of attack that took 1.5B from Bybit ~1yr ago.<p>Fundamentally:
    There is no way to lock webapps to reproducible builds.<p>Except: IPFS could do
    it but IPFS has been very very poorly maintained.<p>I published IPFS-boot ~1yr
    ago and its a simple idea:<p>1. deploy a webapp bootloader using something immutable
    like IPFS<p>2. bootloader is basically react hot reloading except user agrees
    what to load<p>3. bootloader polls a mutable list of app updates and user agree
    or disagree each update<p>Now the bootloader has a static content addressable
    URI but it can also do updates. TBH I think IPFS may be a lost cause but something
    needs to take its place and this idea is transferable to whatever that is. <a
    href="https:&#x2F;&#x2F;github.com&#x2F;rhodey&#x2F;IPFS-boot" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;rhodey&#x2F;IPFS-boot</a>'
