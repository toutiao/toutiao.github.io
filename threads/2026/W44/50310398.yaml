  author: wh33zle
  text: 'In principle, you are right. Async is not I&#x2F;O. And yes, `async` functions
    compile to a deterministic state machine.<p>The problem is, the moment you use
    `async`, your state machine reduces down to one API: `poll`. What if I want to
    change some state in-between two state transitions (i.e. between two `await` points)?
    Now I have to wire-in a channel to supply that data at the right point or access
    some shared data via a Mutex.<p>Rust&#x27;s `async` implementation is great if
    you know everything upfront before you kick off your state machine. The moment
    you need to do many things concurrently, it can become a real mess.<p>Firezone&#x27;s
    sans-IO core handles many things concurrently: inbound IP, inbound UDP, WebSocket
    control messages, TURN allocations, timers, user commands, etc. Having essentially
    one big struct that I can just call `&amp;mut self` functions on for any one of
    these inputs makes this very easy to understand, compose and test.<p>A few things
    like TURN request-response handshakes might be easier as an `async` function but
    in reality, it is not a big deal and the composability you get from it outweighs
    it in my opinion.'
