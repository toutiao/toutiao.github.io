    function from &quot;simply&quot; calling an async one is that the async function
    needs runtime support for certain operations: the simpliest of which is suspending
    until it&#x27;s notified, with more complex ones being async I&#x2F;O primitives.<p>A
    Sans-IO library needs none of these. It can simply be called in a loop and as
    long as the caller provides more inputs it will make progress. An blocking caller
    can simply call the std&#x27;s `Read::read` and pass the received bytes in, while
    an async caller can use async I&#x2F;O primitives to do the same, and since the
    Sans-IO library yields once it finishes consuming the current input it won&#x27;t
    block the async library either.<p>It&#x27;s the best of both world but as always
    you have a tradeoff, and in this case it&#x27;s the ability to express the state
    machine as if it was a straightforward function. Maybe once Rust gets support
    for generic coroutines this will get better."
