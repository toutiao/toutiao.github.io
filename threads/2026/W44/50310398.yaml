  author: Twey
  text: I think at the end of this long road lies algebraic effects. You can write
    your computations with typed effects and, once you&#x27;ve handled every effect
    (or all but a finite subset, if you want to leave some to the runtime), you can
    drive your computation generically. Because the effects are typed, you get to
    narrow the types of the effect arguments at each yield, so you don&#x27;t have
    to handle every possible effect at every yield (on either side of the channel).
