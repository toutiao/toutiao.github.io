  text: Message-passing doesn&#x27;t necessarily involve naïvely copying the data
    around. If you have access to shared memory then you can pass a pointer; the only
    thing you really need to ‘pass’ is the capability to access the message data.
    This is how seL4 does it, for example.<p>Of course if you don&#x27;t have shared
    memory then you have to copy anyway :) And because of CPU caching architecture
    the benefits of having an owned copy of the data can sometimes outweigh the cost
    of copying it, even if shared memory is available.
