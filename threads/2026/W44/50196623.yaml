  author: stonogo
  text: AI and hyperscaler datacenters run at such a high usage rate that they have
    to coordinate with generating facilities regarding outages.  The difference between
    their actual duty levels and &quot;flat out around the clock&quot; is so small
    to be negligible when considering grid operations.  Not all datacenters fit this
    category, but the ones that don&#x27;t are not worth considering in terms of grid
    planning, either, so again this is a difference worth ignoring.
