  author: fwn
  text: 'Discovery is important and a hard problem, worth making some trade-offs for.
    Signal published a good blog post about this, including this passage:<p>&gt; In
    order to turn the address book on a device into a social graph for Signal, the
    Signal client needs to be able to determine which of the device’s contacts are
    Signal users. [...] The obvious problem with this method is that the hash of a
    user identifier can almost always be inverted. [...] This method of contact discovery
