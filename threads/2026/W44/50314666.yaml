  author: nh2
  text: Or this case we encountered, where on iOS Signal apparently corrupts its sqlite
    DB, leading to loss of all messages.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;signalapp&#x2F;Signal-iOS&#x2F;issues&#x2F;5813"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;signalapp&#x2F;Signal-iOS&#x2F;issues&#x2F;5813</a><p>Interestingly
    here, the sqlite DB would be trivially fixable, and messages restorable, with
    the `sqlite3` CLI.<p>But there&#x27;s no way to get at that sqlite DB file. Even
    if you change Signal&#x27;s code to add a feature to export the DB, it apparently
    cannot see your DB, because iOS sandboxes that so that it is only visible to Signal
    builds signed with the Signal developers&#x27; keys.<p>So that means your messages
    are all there, on your device, running open-source software, and yet you cannot
    get them.<p>This cannot have been the intention of Signal being Free Software.
    Where is &quot;change it to make it do what you wish (freedom 1)&quot;?<p>(I do
    not use iOS myself but have friends suffering this issue. Everybody involved is  programmers
    and yet we seem to be able to do nothing about it.)<p>So it seems that even though
    the messages are on the user&#x27;s device, it really is the Signal developers
    who &quot;own&quot; that data, and have the exclusive and ultimate control over
    it.<p>Makes me wonder:<p>Does this mean users suffering this need to GDPR-request
    their data out from Signal?
