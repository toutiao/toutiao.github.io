  author: amiga386
  text: '&gt; I don&#x27;t think this is what Moxie wanted.<p>I think this is exactly
    what he wanted, as these were the complaints levelled against the service when
    he was still in charge.<p>From 2018: <a href="https:&#x2F;&#x2F;drewdevault.com&#x2F;blog&#x2F;Signal&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;drewdevault.com&#x2F;blog&#x2F;Signal&#x2F;</a><p>&gt;
    Moxie knows about everything I’ve said in this article. He’s a very smart guy
    and I am under no illusions that he doesn’t understand everything I’ve put forth.
    I don’t think that Moxie makes these choices because he thinks they’re the right
    thing to do. [...] Moxie can’t come out and say it openly, but he’s made the decisions
    he has made because they serve his own interests.<p>And it looks like it&#x27;s
    working. The Signal social network is growing. Revenue is growing (revenue pays
    for ongoing maintenance). Alternative servers are not sapping user metrics. It&#x27;s
    still easy to push both security fixes <i>and</i> eye-catching new features because
    one central server, and client upgrades are aggressively pushed. Spam is not a
    plague because registration remains <i>expensive</i> - you need a genuine phone
    number you control, or Google to vouch for you (who in turn have their own robust
    defences against account creation).<p>If it was a free sign up where you just
    need an IP address to play, spammers would have hundreds of millions of accounts
    and you&#x27;d get as much nuisance friend requests as you get email spam. Most
    people would leave. You&#x27;ve seen the scraperpocalypse, every sketchy person
    on the planet has money to fund a million sign ups each from a unique US residential
    IP (thanks to &quot;smart&quot; TV vendor neglect&#x2F;corruption allowing residential
    proxies), IP reputation is worthless.<p>Personal instances of Signal would hide
    until spammers found them but you&#x27;d better have your own locked down registration
    because you can&#x27;t hide forever. Not to mention that sending ongoing traffic
    to your own server tells <i>everyone</i> where and when you&#x27;re posting, moreso
    than using Signal&#x27;s centralised services.<p>Its tradeoffs all the way down.'
