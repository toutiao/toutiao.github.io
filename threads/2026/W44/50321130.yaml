  author: rootusrootus
  text: The F150 production was halted because Ford had a constraint on aluminum that
    capped how many F150s (of any variety) they could produce, and the Lightning had
    the tightest margins.  It was the best selling electric truck when they pulled
    the plug.  And Farley could see the writing on the wall -- we were headed into
    a (minimum) four year period where the federal government was going to actively
    punish anybody making technology perceived to be &#x27;green&#x27;.  Easier to
    switch over to something less of a political target and give over the future of
    cars to the Chinese.  Farley drove a Chinese EV for some time as his daily driver
    and he knew the US manufacturers were cooked.  Take a look at Australia now, that
    is where we are headed.<p>&gt; chevy volt<p>Yes, GM screwed you over on that.  Best
    case is it failing under warranty and them buying back the car.  The nice thing
    about the battery in the Lightning is that it isn&#x27;t really a bespoke pack.  It&#x27;s
    a big sealed case with 9 battery modules wired together inside.  So they don&#x27;t
    have to spin up a custom production line to make more, they just need to build
    boxes of the same dimensions and compatible voltages, or update the BMS calibration.  This
    is a way easier lift than making a custom one-off battery pack for a Volt.<p>&gt;
    if you look at something at aptera<p>I see a tricycle, not a car, with a small
    number of die-hard enthusiasts who are slowly recognizing that it is DOA.  Best
    I can tell, it&#x27;s just a grift at this point.  They&#x27;ve been making big
    promises since 2006, been liquidated once already, and still haven&#x27;t delivered
    anything.  They&#x27;ve narrowed their definition of success to &quot;up to 40
    cars for the most enthusiastic customers&quot;, maybe in early 2027 ... if they
    get the funding.  Riiiiight.
  score: 0
