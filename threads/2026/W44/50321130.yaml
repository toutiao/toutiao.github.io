  author: tarpitt
  text: They still are I think. If I had to guess what women want in a car, it&#x27;s
    probably something easy to maintain, quiet.<p>I think what&#x27;s unappealing
    to women about EVs is the unreliability with respect to range and charging availability.
    I struggled with my mom to charge an EV she rented for an inter-city trip and
    she swore off EVs for a while.<p>Slate truck is a good example, I saw that ad
    where it is like decal&#x27;d for a flower shop for example. It&#x27;s pretty
    small and cute (I suppose electric cars are easier to customize aestheticially
    in terms of shape as long as you stick to the skateboard format), and the fact
    that it is quite different-looking than most trucks left some wondering who it&#x27;s
    for. Mostly women I think.<p>Whereas men buy more trucks, and usually there is
    sort of a power aspect to it where they want something that feels and sounds powerful
    (and being a gas car is part of that), so they can race it or can pull a toy hauler
    or something. Women want more of a commuter, but not like a sedan, usually something
    more bulky like an SUV that makes them feel safe. And then like bachelors and
    gay guys want like a 2D coupe or a roadster or something.<p>But it is interesting
    how these niches influence the market.<p>It&#x27;s like most of the money in every
    market these days is made by cornering the market a certain lifestyle and increasing
    markup rather than trying to produce some ultra-efficient everyman vehicle. The
    innovation is all in advertising and consumer control, that&#x27;s how I feel
    about every market these days.<p>If GE cemented the electric car as a must-have
    for women of the time, then we would have seen advances battery tech and EVs decades
    earlier. It would eventually have become mainstream with men as well (think of
    how the wristwatch was originially seen as a women&#x27;s accessory, back when
    men had pocketwatches). The real innovation is in controlling consumer sentiment.
