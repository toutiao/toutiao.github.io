  author: BobaFloutist
  text: I can accept that other people enjoy the sound of loud cars, if you can accept
    that other people find them almost universally annoying, and would rather be listening
    to the far quieter sounds of birds, or the breeze in trees, or the conversation
    they were having.<p>Hmm, maybe a metaphor would help. Imagine if there was a pretty
    substantial subculture of people who loved wearing colorful, flashing, unbelievably
    bright lights on their clothes at all hours of day and night. When you&#x27;re
    at an art museum, people will walk between you and the paintings, blinding you
    for several minutes as even having them in your peripheral vision made it impossible
    to see much of anything else. When you&#x27;re walking down the street, you often
    need to pause what you&#x27;re doing as they walk past. At home, in bed, trying
    to sleep? Despite your best efforts with blackout curtains, almost every night
    in a city, someone manages to light up your room to daylight levels for a few
    minutes just walking past.<p>Most of them, you assume, mean no harm and are just
    having fun and expressing themselves. But having them near you is <i>always</i>
    disruptive, and you&#x27;re disinterested in discussions of how what you actually
    mind is the strobing from low frequencies and the lack of art in poor arrangements
    and not how FUCKING BRIGHT THEY ARE, TURN THAT SHIT DOWN, WE&#x27;RE TRYING TO
    LIVE IN A SOCIETY WHAT THE FUCK IS WITH YOU?<p>And maybe you feel bad for freaking
    out afterward, but it just feels constant, and you understand that living in high-population
    places involves a certain level of tolerance of people&#x27;s idiosyncracies,
    but at a point, it&#x27;s hard not to feel like the sheer level of disruption
    and disregard demonstrated by a fairly small level of the population is actually
    deliberate and malicious.<p>And also they reek.
