  text: "&gt; but I do hope the C projects will preemptively start fuzzing<p>One of
    the points I wish more people understood about fuzzing is what it is doing is
    grabbing a random selection of all the possible inputs and running them through
    the function (Yes the fuzzer can be made to target&#x2F;exercise different branches
    in the code, but it&#x27;s still doing that with a random selection of the possible
    inputs that will exercise said piece of code).<p>Fuzzers miss bugs, because the
    full corpus of possible inputs is impossible to permutate through every function.<p>But
    the advantage of fuzzers is that they choose inputs that developers never think
    to try on the code.<p>edit: some back of the envelope AI math:<p>To enumerate
    every unique state of a 64-bit variable, you must iterate through 18,446,744,073,709,551,616
    individual inputs (2⁶⁴).<p>The exact time in seconds depends entirely on the processing
    speed of the system executing the loop. Here is how the time breaks down across
    three different performance levels:<p>1. Standard Desktop CPU (1 Billion operations&#x2F;sec)<p>•
    Time: 18,446,744,073 seconds<p>• Scale: Roughly 584.5 years<p>• Context: If a
    single core on a modern processor handles roughly 1 billion state evaluations
    per second (1 GHz efficiency), it would take nearly six centuries to finish.<p>2.
    High-End Multi-Core Processor (4.3 Billion operations&#x2F;sec)<p>• Time: 4,294,967,296
    seconds<p>• Scale: Exactly 136.1 years<p>• Context: If you maximize a consumer
    CPU utilizing multiple threads or an incredibly high single-core instruction-per-clock
    rate (4.29 GHz efficiency), it still takes well over a human lifetime.<p>3. High-End
    Enterprise GPU &#x2F; Supercomputer Cluster (1 Trillion operations&#x2F;sec)<p>•
    Time: 18,446,744 seconds<p>• Scale: Roughly 213.5 days<p>• Context: A highly optimized,
    massively parallel hardware setup—like an enterprise GPU cluster capable of churning
    through 1 Terahash&#x2F;Tera-iteration per second—can shrink this problem down
    to a matter of months."
