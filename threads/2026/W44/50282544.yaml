  author: KronisLV
  text: |-
    Forgejo did and will in the future, same as GitLab.<p>The only difference is the architecture&#x2F;moving parts&#x2F;featureset which roughly corresponds to the attack surface, which then roughly corresponds to how many CVEs will be found, though that&#x27;s also affected by how big a given target is.<p>For example, total new CVEs:<p><pre><code>          2024 2025 2026
      Forgejo    1   10  &gt;55 (confirmed ones, checked what I could)
      Gitea      1    9  121
      GitLab   145  165  251
    </code></pre>
    (a lot of the reporting out there sucks, cause some CVEs get assigned to Gitea and may or may not be applicable to Forgejo as well, so you have to dig into the details for example <a href="https:&#x2F;&#x2F;services.nvd.nist.gov&#x2F;rest&#x2F;json&#x2F;cves&#x2F;2.0?keywordSearch=Forgejo&amp;resultsPerPage=2000" rel="nofollow">https:&#x2F;&#x2F;services.nvd.nist.gov&#x2F;rest&#x2F;json&#x2F;cves&#x2F;2.0?keywordSear...</a> and <a href="https:&#x2F;&#x2F;services.nvd.nist.gov&#x2F;rest&#x2F;json&#x2F;cves&#x2F;2.0?keywordSearch=Gitea&amp;resultsPerPage=2000" rel="nofollow">https:&#x2F;&#x2F;services.nvd.nist.gov&#x2F;rest&#x2F;json&#x2F;cves&#x2F;2.0?keywordSear...</a> and <a href="https:&#x2F;&#x2F;services.nvd.nist.gov&#x2F;rest&#x2F;json&#x2F;cves&#x2F;2.0?keywordSearch=GitLab&amp;resultsPerPage=2000" rel="nofollow">https:&#x2F;&#x2F;services.nvd.nist.gov&#x2F;rest&#x2F;json&#x2F;cves&#x2F;2.0?keywordSear...</a> )<p>That&#x27;s not to say that Forgejo is some perfect piece of software, just that it builds on some of the past experience of Gitea and just has both less features than GitLab, is simpler, and also a smaller target. It will probably get &gt;100 per year too soon, but I&#x27;d reckon that the totals will remain than GitLab for the foreseeable future.<p>Maybe I&#x27;m wrong!
