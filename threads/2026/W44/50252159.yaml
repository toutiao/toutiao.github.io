  text: This doesn&#x27;t really have anything to do with GLM-5.3. This is what happens
    when you share models between users and don&#x27;t do your bookkeeping properly,
    the actual model doesn&#x27;t matter. What it shows is that there isn&#x27;t enough
    isolation between the user sessions and that memory can overlap when that should
    never be possible.<p>This is an SGLANG and a Cloudflare bug <i>long</i> before
    it is a Z.AI model bug, I don&#x27;t see what they could have done about it. Cloudflare
    should own it instead of naming other (imo innocent) parties in the title.
