  text: I expect an <i>immense</i> degree of representational similarity to exist
    between humans.<p>You&#x27;re making a mistake there - focusing on the tip of
    the iceberg without considering what lies beneath it.<p>The bulk of what the human
    brain does isn&#x27;t &quot;decide whether skub is good or bad&quot;. The foundation
    that the human cognition is built upon is vast, and mostly invisible from the
    inside. You don&#x27;t get to see the feature matching operators of your visual
    cortex, or the patterns that decide whether a sound is &quot;soft&quot; or &quot;sharp&quot;.
    And a lot of those foundational features are assembled by biological development
    programs spun up all the way from DNA.<p>On that level, when it comes to the bulk
    of neural circuits and the processes implemented by them, the representations
    within a &quot;Pro Skub&quot; and an &quot;Anti Skub&quot; guy might easily be
    90%+ compatible. The two people who had vastly different life experiences, worldviews
    and opinions would be more alike to two different LLMs fine tuned from the same
    base model than they would be to two different architectures trained on completely
    different datasets.
