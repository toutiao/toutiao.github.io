  author: ACCount39
  text: Yes, the mapping function is the thing you&#x27;re missing.<p>When it comes
    to representational similarity analysis, we&#x27;re trying to isolate the representations
    from the &quot;coordinate systems&quot; they sit in. If you take an image, and
    make a second image by rotating it 90 degrees and mirroring it, then, for the
    purposes of platonic representation hypothesis, they&#x27;re the same image. Once
    you get past the &quot;coordinate transform&quot;, the similarity between the
    first representation space and the 90-deg+mirror replica of it is total.<p>A mapping
    function between LE and BE can be constructed easily, and it&#x27;s going to be
    lossless both ways. Which means that those two representations are fully compatible.<p>Now,
    INT16 and FP16? Those are far less compatible representations. There will be an
    overlap subspace where lossless conversion between the two is trivial, but this
    compatibility window will be relatively narrow.
