  author: gmueckl
  text: 'The trick is to understand what is going on here: rather than a singular
    model trained for this exact job, this is performed by a awful hackjob of two
    models cut open and glued together at the seam. That glue layer is a single matrix,
    a fully connected layer, that is the only thing re-trained in the combined model.
    The rest of the coefficients are fixed. Naively, this shouldn&#x27;t work - the
    internal representations of each model are unconstrained and should intuitively
    have completely different shapes. But this paper shows that this isn&#x27;t quite
    the case: the difference between the latent spaces can be mostly expressed in
    a single matrix transform. And that allows that merged model to work at all.'
  score: 0
