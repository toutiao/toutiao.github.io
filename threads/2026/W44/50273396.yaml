  text: By chopping out the first sentence of the quote, you lose the context of exactly
    what kind of labor he&#x27;s talking about. Which is useful if you want to construct
    a strawman version of his argument by suggesting he might be morally opposed to
    four function calculators, too, but not so useful if the goal is to engage with
    the (presumably incomplete) version of his position that the article presents
    in good faith.<p>So let&#x27;s look at that preceding sentence so that we can
    get a better sense of what kind of labor he was talking about:<p>&gt; The process
    and work involved in thinking through situations, through my work, through my
    ethics, through the way I handle other people, is a key component in being able
    to develop myself as a moral person.<p>&quot;thinking through situations&quot;,
    &quot;my ethics&quot;, &quot;the way I handle other people&quot;, &quot;develop
    myself as a moral person&quot;. This doesn&#x27;t read to me like he&#x27;s taking
    a Butlerian Jihad-type position that humans have a moral responsibility to do
    their own arithmetic. We&#x27;re clearly talking about higher-level, more abstract
    thinking and decision-making that might carry real moral weight.<p>And that brings
    us to a difference that I think he might be seeing but that you seemed to be claiming
    does not exist when you said, &quot;My main issue with these people is that they
    think AI&#x2F;LLMs are different than everything that came before them.&quot;
    GPT-style decoder LLMs are the first time we&#x27;ve ever really seen people trying
    to rely on computers to make abstract and open-ended decisions such as drawing
    up business plans, drafting memoranda, or doing deep research-type tasks on any
    sort of scale.<p>I think that you&#x27;re probably aware that there is a even
    a noticeable difference between how people are thinking about LLMs now versus
    how they did back when GPT 2.0 was the latest and greatest. And the fact that
    we can construct a hypothetical continuum of possible models between GPT 2.0 and
    GPT 3.5 Turbo and suggest that, in this counterfactual scenario, it might not
    be possible to draw a hard line that cleanly separates the tech itself into two
    discrete categories, is fundamentally missing the point. His concern was never
    stated to be about the technology itself; it was about how he was being asked
    to use it.
