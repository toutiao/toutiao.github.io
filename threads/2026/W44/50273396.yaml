  author: lo_zamoyski
  text: Sorites doesn&#x27;t actually refute the OP. The paradox is rooted in a failure
    to distinguish between aggregates and integral wholes. A heap is not really a
    natural kind or an integral whole. It is just a convenient label to describe a
    vague range of collections for practical purposes, but it is not what you a &quot;thing&quot;
    in its own right. There is no intrinsic tendency of a heap to be a heap, whereas
    in integral wholes there are. You cannot draw a line between a heap and a non-heap,
    because there is no such thing as a heap in any objective sense. There is no essential
    difference, only an accidental one.<p>Computers and computer programs are much
    more like heaps than integral wholes. There is no essential difference between
    what we conventionally call &quot;AI&quot; and any other computer program. The
    manner in which we have cordoned off &quot;AI&quot; from &quot;non-AI&quot; has
    more to do with human purposes and perspectives rather than any objective facts
    on the ground.
