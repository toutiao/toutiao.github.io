  text: There&#x27;s a chain of classes  P, NP(aka Sigma_1), Sigma_2, .., Sigma_n,
    ... PSPACE, EXPTIME. What we know for sure is that P &lt; EXPTIME, others are
    unknown (well, maybe this paper adds something to this, time will tell).<p>It&#x27;s
    conceivable that each of them is smaller than the next, but also that e.g. P &lt;
    NP = all the sigmas &lt; PSPACE &lt; EXPTIME or many other possibilities. I think
    the general consensus is that it&#x27;s more likely that there are more inequalities
    than not, but the fact is that we can&#x27;t even show that P is less than PSPACE
    so far, which would be extraordinarily surprising if it were true.
