  author: pcstl
  text: The exponential time hypothesis is essentially that NP-complete problems&#x27;
    best solutions are all exponential.<p>NP-complete problems are essentially those
    where you need to make some kind of choice over a superlinearly-growing set of
    options where each option can be solved in polynomial time. Like, for example,
    finding a route between cities on a map under a certain total distance. You might
    need to go over all choices of routes.<p>The ETH essentially assumes that the
    best solution (in terms of complexity, i.e. how it grows) you can get for these
    kinds of problems is exponential. OpenAI just proved that this is false, you can
    have solutions that are below exponential complexity (but still above polynomial
    - if anyone finds a polynomial solution then we&#x27;d have proven that P=NP)
  score: 0
