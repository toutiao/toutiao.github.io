  author: dnautics
  text: 'the language around complexity domains is really confusing.<p>P means &quot;this
    problem can be solved in polynomial # of steps relative to the problem size&quot;<p>NP
    means &quot;we don&#x27;t know if the problem can be solved in polynomial # of
    steps relative to problem size, but we know we can check <i>if the result is correct</i>
    in a polynomial # of steps relative to the problem size&quot;<p>!ETH: it was widely
    suspected that the flagship problem in NP, 3SAT, requires an exponential # of
    steps relative to problem size.  We now know that 3SAT requires AT MOST something
    more than polynomial but strictly less than exponential to solve.<p>&quot;P =
    NP&quot; means &quot;if you can check it in polynomial time, there&#x27;s some
    way to solve it in polynomial time&quot;.  &quot;P != NP&quot; means &quot;there
    are some problems checkable in polynomial time for which there is no polynomial
    way to obtain the result&quot;<p>Today&#x27;s new proof makes &quot;P = NP&quot;
    &quot;feel more likely&quot;, because we know that the flagship problem in NP
    is not exponential.'
