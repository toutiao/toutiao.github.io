  author: tfpgh
  text: This isn&#x27;t quite true, problems in NP can still require exponential time
    to solve.<p>Solving an arbitrary NP problem looks like first reducing that problem
    to SAT and then solving the equivalent SAT problem. We know (via the Cook–Levin
    theorem) that any NP problem can be reduced to SAT in polynomial time, and we
    now know that solving SAT is subexponential in terms of the size of the SAT problem,
    but it&#x27;s possible for the conversion to SAT to grow the problem enough that
    it&#x27;s exponential in terms of the original problem.
  score: 0
