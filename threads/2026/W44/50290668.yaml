  author: jerf
  text: Yes, there are huge national security concerns when everybody&#x27;s cars
    are always on the network and all fly-by-wire. It would be trivial for anyone
    who writes the software for these things to include logic or network bombs in
    them that would enable a catastrophic strike on a country or the rest of the world.
    Cars being on the network all the time is really a terrifically stupid idea.<p>Careful
    readers may note the complete lack of the word &quot;China&quot; in the previous
    paragraph. But, yes, technically it is even that much more dangerous to have a
    whole bunch of potentially-hackable robots roaming up and down all your transportation
    corridors that were <i>also</i> created by your major economic and military rival.<p>But
    I don&#x27;t even like it when it isn&#x27;t created by your rival, though, because
    there&#x27;s no guarantee that your rival can&#x27;t hack anybody&#x27;s software.
