  author: abrambleninja
  text: |-
    We know that P (the set of problems solvable in polynomial time on a deterministic Turing machine) is a strict subset of EXPTIME (the set of problems solvable in exponential time on a deterministic Turing machine) via the time hierarchy theorem. We also know that
    P ≤ NP ≤ PSPACE ≤ EXPTIME
    (using ≤ to mean non-strict subset since I'm typing on my phone)
    where NP is P but with a nondeterministic TM, and PSPACE is the set of problems solvable in polynomial space on a deterministic TM.
    So basically via the time hierarchy theorem, we know that at least some of these have to be strict containment, but we are not sure which.
    Before this result, it could have been that P != NP, but NP = PSPACE = EXPTIME; i.e., the jump from P to NP is the only increase in the computational complexity in that set of classes.
    Hillel seems to be implying that this paper shows NP != EXPTIME . I'm not entirely sure how he came to that conclusion - I didn't read the paper thoroughly and it's been a while since my complexity days, but I don't immediately see how the stated result applies to those two classes, since k-SAT is definitely a member of NP and is not complete for either PSPACE or EXPTIME.
    These questions are interesting because there are many problems in these complexity classes that we don't know how to solve efficiently, or whether they can be solved efficiently. P versus NP is of course the most well known complexity question, but there are tons of other complexity classes that we aren't sure how they relate to each other.
