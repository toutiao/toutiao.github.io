    I was working off the assumption that 3-SAT is NP-Complete, so if there's a subexponential algorithm for solving it then there are problems in EXPTIME harder than 3SAT. But this comment on the orange site points out that a polynomial time reduction of something to 3SAT can increase the problem size enough to recreate exponential time-bounds. That's why the paper says this:

    Note that runtime bounds of the form 2^o(n) do not transfer under general polynomial-time
    reductions (2^n^o(1)
    would be needed for this), so our result does not imply that general NP problems
    admit subexponential time algorithms. However we do obtain subexponential time algorithms for
    counting graph colorings and perfect matchings.

    Does this potentially mean that there are can be other shades of "hardness" inside NP-Complete?
