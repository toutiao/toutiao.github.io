  text: |-
    Thank you!
    For others, here's the linked quote by Russell Impagliazzo, with emphasis added by me for the most relevant part:

    I was one of the researchers who introduced ETH, and further strengthened version the Strong Exponential Time Hypothesis, which are considerable strengthening of P vs. NP. These essentially say that not only aren’t there efficient algorithms for NP-complete problems, but that, for many NP-complete problems, the known algorithms are close to the best possible. Not only is there no consensus on whether these hypotheses are true in the general theory community, I have not reached consensus with myself about whether I believe them or not. If I had to bet, I would say give 2:1 odds that ETH is true, and 1:2 odds on SETH, but the exact odds would depend on my mood that day. This is why we were careful to call them "hypotheses" rather than "conjectures". Why I like these hypotheses even if I don’t always believe them is that they have interesting consequences if they are true, and an equally interesting set of consequences if they are false. If they are true, work by many others that I won’t list here shows that many of the algorithms in textbooks are in fact close to the optimal ones, even for problems within polynomial time. If they are false, through some tricky gymnastics due to Ryan Williams and others, we get new circuit lower bounds. So resolving them either way would be major progress in understanding computational complexity, even more in some ways than P vs. NP (since there is consensus on that—if you prove P is not NP, it’s amazing, but it will confirm rather than change the conventional wisdom.). It also is a clean way of summarizing the basic state of the art in terms of algorithms for many problems, and a challenge for algorithm designers to go beyond this state.
