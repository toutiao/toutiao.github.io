  text: 'I can say specific to AI: I have been seeing friends and colleagues do really
    impressive things with code surpassing what&#x27;s available in the market and
    open source in the past few months. The vast majority of them are _not_ releasing
    their code, for a variety of reasons:<p>- Their output is hyper-customized&#x2F;optimized
    for their personal use case, constraints and quirks<p>- They have zero interest
    in being an open source contributor and maintainer. Usually because it&#x27;s
    a lot of additional work, sometimes for personal safety reasons (harassment targets
    etc.) In a workplace it can also mean dealing with an extremely tedious legal
    process with months of uncertainty.<p>- They figure anyone who wants something
    similar can just make it themselves instead of using theirs. If I spent between
    fifteen minutes and two days to make some software, in 3-6 months someone with
    fewer skills will probably make it in 5 minutes to a few hours using a more powerful
    model.<p>- They may not have full rights to redistribute their source code.<p>Basically
    most people - individuals and corporations alike - aren&#x27;t actually interested
    in donating to open source and in many cases have anti-incentives to do so.'
