  text: Agreed completely. Junos have niceties like copying parts of config, adding
    config even beforeinterface cards are inserted, renaming&#x2F;moving parts of
    config, of course quickly config parts, viewing and exporting config various ways
    etc. etc. Cisco improved config viewing a bit with IOS-XR too, so that it&#x27;s
    possible to scroll  like Junos had ages ago.<p>However there are also things Junos
    vs Cisco was that Cisco had made bit easier. Just to mention few<p>1) a simple
    and quick way to add aliases to config file, which made life easier with long
    commands that could be otherwise always in hurry hard to remember. Now later versions
    Junos they have made this better, before it involved twiddling with XML files
    OS-level etc.<p>2) IOS TCL scripting, that proved to be quite useful automation
    tool.<p>3) OS upgrades of course with a single flash blob made it easier than
    upgrading or downgrading FreeBSD based Junos.
