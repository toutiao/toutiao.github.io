  author: amluto
  text: "&gt; It has a penchant for maintaining API&#x2F;etc contracts to a fault
    in the absence of instructions to the contrary.<p>AI has no magic powers to figure
    out what the “API&#x2F;etc contracts” are in a nasty old codebase.  This problem
    is fundamentally hard and not always well defined.<p>AI is also (at least for
    now) not consistently good at writing tests that test the behavior that matters.
    Recent models seem to be getting slightly less bad, but again, this is a hard
    problem.<p>I’ve personally used AI to rewrite gnarly code where the goal is to
    have <i>exactly identical results</i> to the old code.  GPT-5.6 Sol could do this
    correctly with some extra help guiding it to rest the right things, and I haven’t
    tried this particular task on a newer model.<p>But ancient code like in the article
    is probably an enormous buggy mess full of accidental behaviors and implementing
    protocols in ways that do not fully match the spec. Some, but not all, of the
    mismatches will be cases where the spec is wrong. Sure, an AI can probably generate
    a new implementation with a similar set of bugs, but is this what is actually
    wanted?  Also, depending on the gnarly set of bugs, a clean implementation may
    be unable to reproduce the bugs, leading to a messy implementation instead."
