    Paddy, the 27-year-old Cisco’s president calls an “energizer bunny.” The Gen Z
    ex-founder has been given unlimited AI tokens and told to “go nuts.”Getty Images\n\nAdd
    Fortune on Google for similar content.\n\nGen Z can’t catch a break. Entry-level
    jobs are[vanishing](https://fortune.com/2025/09/21/goodwill-ceo-preparing-for-influx-of-jobless-gen-z-ai-automation-kill-entry-level-jobs-youth-unemployment-crisis/);[some
    40% of bosses](https://www.peoplemanagement.co.uk/article/1946118/employers-plan-reduce-graduate-hiring-ai-research-finds)
    say they plan to hire fewer grads because AI can do the job cheaper, and young
    workers are routinely slammed for[showing up late](https://fortune.com/2023/11/15/mit-interviewer-gen-z-late-research-deadlines/)
    and refusing to put in[overtime for free](https://fortune.com/2024/04/29/gen-z-job-seeker-refused-90-minute-task-recruiter-slammed/).
    Cisco’s president and chief product officer Jeetu Patel isn’t buying it—he’s just
    handed one of the company’s biggest jobs to a 27-year-old he found hidden in the
    org chart “five levels” below him.\n\nRecommended Video\n* * *\n\n“I’ve given
    him unlimited tokens because he’s going to refactor code,” Patel told _Fortune_
    at a small roundtable dinner. “So I’m like, you can go, you can go nuts.”\n\nThe
    “him” is Padmanabhan Krishnamurthy, or “Paddy,” as Patel affectionately calls
    him. He joined Cisco in 2025 after the $429 billion tech giant[acquired EzDubs](https://techcrunch.com/2025/11/17/cisco-acquires-translation-startup-ezdubs/),
    the real-time translation startup Krishnamurthy cofounded in 2023. And despite
    coming in as a former founder with CEO experience, he was, in Patel’s words, “buried
    away in the organization doing something unstrategic.”\n\nThat changed when Patel
    dropped into Cisco’s San Francisco office, and the pair got talking. Krishnamurthy
    reckoned he could rewrite Cisco’s legacy code with a two-person team. Patel says
    even the most AI-forward people on his own team weren’t thinking that way.\n\nSo
    he has given himself four weeks to prove it, with the final goal of refactoring
    98% of Cisco’s legacy code within 24 months.\n\nNow, he’s on the hunt for more
    Paddys: young hires who will “challenge the system and the status quo,” or, as
    he puts it, be “an energizer bunny that just goes out and kind of revs everyone
    up.”\n\n## Cisco’s president says Gen Z should be teaching his veterans, not doing
    data entry—and he’s fine with the tension that causes\n\nAt most companies, only
    someone with decades of experience under their belt would be trusted with a project
    this size. Patel thinks that’s a problem.\n\n“If you don’t hire the early-in-career
    [workers], and you just let your workforce continue the way that they were, where
    do fresh ideas get injected? How do you challenge the status quo?” he said.\n\nSeasoned
    staff can still come up with new ideas, Patel added. What they can’t do is ask
    the questions that only someone with no experience would think to ask.\n\nAnd
    getting the two to get along isn’t always smooth. Patel admits that putting a
    Gen Zer in a room with people who’ve been at Cisco for decades can create friction—but
    he says that’s the point.\n\n“Tension is good,” he said. “I actually try to create
    tension in the teams because you want to have enough friction on the ideas. You
    don’t want to have friction with people and personalities.”\n\n“What you have
    to do is establish enough trust with people to say you are going to be expected
    to create unreasonable goals for yourself,” he added. “And so, in order to go
    out and achieve those unreasonable goals, think outside of the box.”\n\nAnd he’s
    not just pushing senior staff to take notes from twentysomethings. He said that
    he treats every intern as “kind of a reverse mentor,” and even does talks at colleges
    to find students who are “hungry.”&nbsp;\n\nHis latest Gen Z bet came out of one
    of those talks, to 17- and 18-year-old Stanford scholarship students. While a
    line of students fired questions at him, one, Baya, stood off to the side, just
    listening. She waited until everyone else had finished before she opened up.\n\nHe
    told her to email him every month with what she’d learned about AI. It was a test
    of follow-through: “Everyone can go out and have one good conversation. But are
    they going to stick with their commitments?”\n\nShe never missed one, landed an
    internship at Cisco, and redesigned “something” that experienced staff hadn’t
    been able to crack.&nbsp;\n\n“I didn’t bring her in so that she can do grunt work
    and do data entry,” he said. “We brought her in so that she could actually teach
    our people how to think completely differently.” Now he wants to recruit her.\n\n##
