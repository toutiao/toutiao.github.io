  author: phil21
  text: While I certainly don&#x27;t work at Cisco, I&#x27;ve come to the conclusion
    that I need to re-examine my priors when it comes to code rewrites and general
    maintainability.<p>AI makes these projects significantly more feasible, at least
    in my domain. We have some critical-path software I wouldn&#x27;t touch with such
    an approach, but the vast majority of our code is internal and&#x2F;or supporting
    tooling.<p>For those cases, burning it down and rewriting via AI tooling has proven
    far more productive than anything we have attempted in the past. This is for old
    technical debt laden stuff everyone has been afraid to touch for well over a decade.<p>It&#x27;s
    not perfect, but it moves the needle where before a lot of such projects were
    stuck on the backburner for years.<p>It certainly introduces new bugs and such,
    but at least this way forward momentum is happening vs. just being stuck in decision&#x2F;analysis
    paralysis forever.<p>This also assumes some very senior SME folks are driving
    the process. I would not expect similar results with junior or even mid-level
    folks in these specific domains.
