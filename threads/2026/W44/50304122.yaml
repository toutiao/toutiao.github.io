  author: mesrik
  text: "&gt;So was Oracle and Microsoft Windows.<p>Cisco did provide updates via
    CCO and anonymous ftp server. They quite openly told that just download new image
    and test in your lab, and then if feature set did require licensing, please do
    it before deploying production. Trust was put on customers and they did very little
    to check and verify if customers did comply. Which is quite contrary to what for
    example Oracle practise is been.<p>&gt;If history has taught us anything. It’s
    that the measure of a successful product is usually more to do with its sales
    people.<p>As someone who worked Cisco gear over thirty years I still remember
    why us networking did want cisco instead of many other brand devices and it hadn&#x27;t
    anything to do with marketing and sales people did.<p>The Cisco IOS text based
    configuration was in early days of internet which made it so popular.<p>Many other
    manufacturers like HP, 3Com, Cabletron, Madge (IBM), Bridge, etc. did not get
    why we wanted and complained “give us textual configuration format like IOS has”.<p>With
    a plain text based configuration it was easy to adapt configuration from one model
    to have ready made templates for each model, upgrades and migration to new models
    were easier, you could use version controls (rcs,cvs, svn,... long before git)
    and then when RANCiD came it was easy to automate config backups, revert and rollback
    changes, pass audit with human readable configs and what was in production even
    long time after etc. In short text based configs made it possible to build large
    network scale configurations management tools.<p>IOS has compact, but quite easy
    to read config snippets made it much easier emailing others, posting examples
    newsgroups, opening TAC at Cisco CCO, books with examples, learning and teaching
    etc.<p>It took quite long before for example HP understood and switched text formats
    right after turn of century. Juniper seemed to understood right from beginning.
    But some like Fore, Nortel, Alcatel (ATM-switch makers) and many others did not
    understand before going out of business. Most of these others had either menus
    (3Com, HP) or a lousy CLI with obscure unique for just that device model and quite
    often not even option to print config or if they had not just with changes from
    default config but printing everything and providing no means to drop showing
    default. This made it manually while online very hard without external version
    control to even know what is current status and what had been changes.<p>BTW,
    this is still an issue with some manufacturers haven&#x27;t understood and makes
    their devices much worse than they understand. Fortigate firewalls CLI is still
    like this. You can select a subsection of config to print, but it will no indication
    what differs from default configs. And the whole firewall config is hundreds of
    kilobytes. Good luck finding what&#x27;s been changed unless you had saved default
    config when you started using that device!<p>When you have thousands to even tens
    of thousands of network devices in use as many were working you need to be rely
    that even when you encounter device failure and you don’t have same model any
    more available, you are able to adapt and find working fix configuring something
    else doing what is needed.<p>Binary and any non textual configurations may fit
    the purpose SOHO category devices, but when network grows even bit larger and
    configurations more complex there isn’t anything better than text base configs
    as far as us humans will need to configure and maintain those devices.<p>Cisco
    have had issues with software quality for sure, but it was Cisco IOS that was
    the reason it became so popular and we wanted to use it.<p>And we did put more
    weigh on manageability which that IOS text based configuration provided than for
    example speed some manufacturers got with their devices (Madge, etc.) and even
    when some Cisco switches dropped some Network World tests more packets we still
    wanted that manageability more and relied Cisco will fix those issues with software
    upgrades which it often did.<p>Juniper when it came end of 90&#x27;s did understand
    this and made even better configuration system for Junos than IOS was and still
    is. Cisco have improved things with IOS-XR, but it&#x27;s still not up to what
    Junos is currently.<p>e: fixed few typos and added that manageability chapter
    near end. Places where I did work none were always everything Cisco places. No,
    but either so called ABC (Anything But Cisco) places either. Cisco was and is
    still popular for those reasons mentioned above."
