  author: stavros
  text: 'The entire point of a rewrite is to get rid of the behaviour you don&#x27;t
    want, while you keep the behaviour you do want. Consider the pathological case:
    Rewriting your FORTRAN codebase in Rust would obviously be useless if you had
    to reimplement every bug in the rewrite.<p>An LLM doesn&#x27;t have enough context
    to know what you so and don&#x27;t want. If you give it call logs for every function
    that was called and how, maybe, but a seasoned engineer will have more context
    around what the company needs.'
