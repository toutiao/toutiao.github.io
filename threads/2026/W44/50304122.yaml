  author: jimmaswell
  text: A rewrite is a slam dunk for any decent frontier AI. It has a penchant for
    maintaining API&#x2F;etc contracts to a fault in the absence of instructions to
    the contrary. It can easily validate its work and loves building exhaustive test
    cases. You can tell it to get 100% code coverage if you want. It will laborously
    accurate document every accumulated edge case and help you find a better overall
    cohesive structure.<p>A rewrite has historically been a huge mistake in many situations,
    some of which I&#x27;ve personally had the agony of witnessing firsthand, powerless
    to stop it. But AI completely changes the calculus because it doesn&#x27;t waste
    significant developer time or energy crawling back to the previous working state,
    it just does it while you go get coffee. And this I&#x27;ve found to be a huge
    benefit, that I can continue making my codebases nicer to work with and better
    documented&#x2F;integrated with bugs stamped out for free. There are upsides to
    a rewrite, and they&#x27;re now much more likely to be worth it as the downsides
    are automated away.
  score: 0
  posted_at: '2026-10-31T00:52:44Z'
- id: '50312224'
  parent_id: '50305001'
  author: jiggawatts
  text: 'Documentation in &quot;plain english&quot;, architecture diagrams, comments,
    and documentation are notorious for being unreliable, out-of-sync, and not as
    precise a specification as the code itself.<p>The issue with using &quot;the code
    as the spec&quot; is that humans can&#x27;t read 100K lines of code in a day,
    can&#x27;t hold the entire ball of unstructured mud in their brains  all at once,
    and generally require hierarchical &quot;structure&quot;.<p>Modern AIs just don&#x27;t
    have these issues! Their context windows are big enough to encompass an entire
    codebase, so they can &quot;see everything&quot;, all at once.<p>Each line of
    new code they write is compared against <i>every</i> relevant line of code in
    the original, which they treat as a spec.<p>My main issue in my experience is
    that that AIs tended to reproduce the legacy behaviour &quot;bug for bug&quot;,
    which was not my intention.<p>Similarly, the AIs were hamstrung by external constraints:
    I typically prefer to leave the DB schema unchanged, which meant the torturous
    workarounds were needed for design errors in some stored procedures, etc.<p>The
    older the code, the bigger the issues with baked-in assumptions about transactions,
    stateful sessions, data types, string formats, etc.<p>This trips up AIs just as
    much as humans. You can&#x27;t trivially maintain backwards compatibility <i>and</i>
    modernise the codebase! Those are conflicting goals, no matter what.'
  score: 0
