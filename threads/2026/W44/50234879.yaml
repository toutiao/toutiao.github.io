  author: bartread
  text: Man, I was about to go on a proper rant and claim that the site didn’t have
    every battle because it’s missing the battle of Maiden Castle…<p>I claim no great
    historical authority here but, since I grew up mostly within sight of the hillfort,
    we were taught about its history at school to an extent that, at the time, felt
    unrelenting, cruelly repetitive, and utterly tedious. In reality though, it probably
    lasted for a single term at the fag end of 1985 when we learned about the Celts[0].<p>But
    what we learned was that General Vespasian captured Maiden Castle after a brutal
    one day battle in AD 43 in which Maiden Castle’s Celtic defenders were slaughtered
    in what amounted to a one-sided rout due to the superior weapons, tactics, and
    discipline of the Romans. This is what I remembered, but I wanted to look it up
    to ensure my facts were straight.<p>Welp… TIL because subsequent investigation
    and analysis has shown that it didn’t happen at all so, no, dear reader, my “facts”
    were <i>not</i> straight.<p>There never was any big battle.<p>There might have
    been the odd smaller skirmish during the Roman period, but the bodies we found
    that were all supposed to have died in the big battle actually span several generations,
    dying at different times over a period of a couple of hundred years, and the evidence
    of violence in their deaths was in the vast majority of cases inter-tribal and
    occurred before the Romans even showed up.<p>Maiden Castle had already fallen
    into decline by the time the Romans arrived and was mostly abandoned for a long
    period until a temple (that you can still visit the ruins of) was built early
    in the 4th century.<p>So the reason the battle of Maiden Castle doesn’t appear
    on the site isn’t because the site is carelessly built AI-slop but because no
    such battle ever happened.<p>I have been… disillusioned. Hats off to the human
    behind the AI that built the site.<p><i>[0] I remember this with such precision
    because it was the first period of history we learned about at middle school,
    and matters didn’t improve significantly, because next it was the domestic matters
    of the bleeding Victorians, and lots of episodes of “How we used to live”.</i>
