article:
  url: https://iosiflazaridis.github.io/battles-of-the-romans/
  title: 'Where the Romans Fought: Battles of the Romans, 753 BCE – 1475 CE'
  fetch_status: success
  content: "## The map, period by period\n\nPick a period, or drag the year slider
    to see the battles of any 25 years; Play runs through them from the founding of
    Rome. Each dot is a place, its area the number of battles there, and its slices
    the opponents, starting at 12 o'clock and running clockwise in the order of the
    legend; grey is civil war. Diamonds are sea battles; dashed rings are battles
    placed only within their region, in the colour of the most frequent opponent;
    triangles at the edge point to Caledonia, Nubia and Arabia. Nearby dots merge
    as you zoom out and split as you zoom in. Hover or tap a dot for its battles;
    select it to list them with their full records.\n\n## Wins, draws and losses\n\nThe
    Roman record in the 1,469 battles with a known result. The Roman states are counted
    together; the 236 civil-war battles and the 4 with unknown results are left out.
    A battle with several opponents counts against each of them, and once in the total.
    Select a row to list its battles.\n\nThe Empire includes the western and eastern
    courts of 395–480 and the restored empire of 1261–1453; the other successor states
    are counted on their own. Germans, Goths, Gauls and the Greek cities are many
    peoples or cities under one name; the note of each battle names them. Traditional
    battles are counted as the sources tell them: they are most of the early Republic's
    record, which modern historians doubt.\n\n## All the battles\n\nSelect a row for
    the full record: date, place, sides, commanders, the Roman army and its languages,
    the sources, and for doubtful entries the reason. Results give the winner first;
    the coloured edge marks a Roman win (blue), draw (grey) or defeat (orange). Traditional
    marks a battle known only from a tradition that modern historians doubt; borderline
    an entry that may not meet the rules, kept with the reason (hover the label to
    read it). A hollow marker means that only the region of the battle is known.\n\n##
    The images\n\nThe images of the set, made for X: the map, Italy with Rome and
    Latium, the Balkans, Anatolia and the East with Constantinople, the win-draw-loss
    tables, and the full list in fourteen parts.\n\n## How it was made\n\n### What
    counts as a battle\n\nA named land or sea battle in which a Roman force fought,
    as a principal belligerent or as a distinct allied force: one with its own name
    in the ancient and medieval historians or the standard modern works, or in English
    Wikipedia's battle lists and campaign boxes. Sieges count when there was real
    fighting (assaults, sorties, relief battles); a distinctly named battle inside
    a siege is its own entry. Left out: unnamed skirmishes, massacres without a battle,
    captures and surrenders without fighting, and legends. When in doubt an entry
    is kept and marked borderline, with the reason: 649 entries, most of them minor.\n\n###
    Who counts as Roman\n\nThe Roman Kingdom, the Republic and the Empire, West and
    East as one state (the western court to 480, the eastern throughout), and after
    1204 every Roman successor state: Nicaea and the empire it restored at Constantinople
    (1261–1453), Epirus, Thessalonica (1224–46), Trebizond (1204–1461), the Morea
    (1349–1460) and Theodoro in the Crimea (to 1475). Client kings and allies (Pergamon,
    Rhodes, the Numidian kings, the Ghassanids, the federates) are not Rome; Romans
    in foreign service do not make a battle Roman.\n\n### Traditional battles\n\nThe
    battles of the kings and the early Republic are included as the ancient historians
    tell them, and 94 battles known only from a tradition that modern historians doubt
    are marked traditional, each with the reason. Most are the battles of 753–391
    BCE: they rest on Livy, Dionysius of Halicarnassus and Plutarch, who wrote centuries
    later from the annalists, and Livy himself says that most records of early Rome
    perished when the Gauls burnt the city (6.1). Others are victories that Livy took
    from annalists who invented or inflated them (the Scipios in Spain, 215–214 BCE),
    and a few medieval battles known only from much later chronicles (the early Ottoman
    traditions of 1284–1303).\n\n### Civil wars\n\nBattles with Roman forces on both
    sides, 236 in all, are mapped and listed, in grey, with the factions (Caesar and
    the Pompeians, Constantine and Maxentius, John VI Kantakouzenos and the regency),
    but not scored. Foreign armies in a Roman civil war count as allies. Palmyra under
    Zenobia is counted as an opponent; the battles of the Gallic emperors are civil
    wars.\n\n### Colours and dots\n\nEach battle takes the colour of its main opponent:
    Greeks, Persians and the East, peoples of Italy (Latins, Etruscans, Samnites,
    the Italian allies, the slave revolts), Carthage and Africa (with Numidia, Mauretania
    and the Moors), Western Europeans, Balkan peoples and Slavs (Illyrians, Thracians,
    Dacians, Bulgaria, Serbia, the Rus'), steppe peoples, Seljuks and Ottomans, and
    Arabs (the caliphates and emirates, the Fatimids and Hamdanids); grey for civil
    wars. Each place is drawn as a small pie: its area grows with the number of battles
    there, and the slices give the number against each opponent.\n\n### Wins, draws
    and losses\n\nThe victor is the side that won on the battlefield: it held the
    field, routed the enemy, took the city or destroyed the fleet; strategic outcomes
    and disagreements between the sources are in the notes. In a siege the besieger
    wins if the place fell and the defender if the siege was raised. A draw is an
    indecisive battle, or one that both sides claimed with no clear verdict from modern
    scholarship.\n\n### The Roman armies\n\nFor every battle the research recorded
    who fought on the Roman side: the contingents as the sources give them (legions
    and allies, themes and tagmata, federates and mercenaries), their main languages,
    and an estimate of the share of Greek speakers, with its basis and a confidence.
    Where the sources say nothing, the estimate rests on where that army was recruited
    in that period, and the record says so: 1,061 of the 1,709 estimates are of low
    confidence.\n\n### Research\n\nTwenty-one research batches by period, each following
    the same written rules and citing its sources battle by battle; then twelve coverage
    and fact-check passes against the Wikipedia lists and war articles, which added
    123 battles, corrected 129 fields and removed 7 entries (listed under Left out);
    then checks of names, of possible doubles and of every position against the present-day
    country. Positions: 586 known, 812 approximate, 311 only within their region.\n\n###
    The images\n\nThe 18 images were made for X in the house style of the series,
    3200 × 1800 pixels: the overview map with the number of battles per 20 years,
    Italy with Rome and Latium, the Balkans, Anatolia and the East with Constantinople,
    the win-draw-loss tables, and the list in fourteen parts.\n\nEvery battle with
    its date, war, place, coordinates, sides, allies, commanders, result, the Roman
    state, the Roman army (contingents, languages, an estimate of the share of Greek
    speakers, with its basis and confidence), the reasons for doubt, sources and notes:
    as a CSV table, as JSON, or as a spreadsheet with the record tables and the entries
    left out; and the record alone as CSV.\n\nSources, cited battle by battle: Livy,
    Dionysius of Halicarnassus, Polybius, Plutarch, Appian, Caesar, Cassius Dio, Tacitus,
    Josephus, Ammianus Marcellinus, Zosimus, Procopius, Agathias, Theophylact Simocatta,
    Theophanes, Leo the Deacon, Skylitzes, Attaleiates, Anna Komnene, Kinnamos, Choniates,
    Akropolites, Pachymeres, Gregoras, Kantakouzenos, Sphrantzes, Chalkokondyles,
    Panaretos and the Arabic and Ottoman chroniclers, among others; for what counts
    as a battle, the battle lists, war articles and campaign boxes of English Wikipedia
    and the standard modern works (the Cambridge Ancient History, Goldsworthy, Haldon,
    Treadgold, Bartusis, the Oxford Dictionary of Late Antiquity and Kazhdan's Oxford
    dictionary of the medieval empire). Map: Natural Earth; today's borders dashed.\n\n##
