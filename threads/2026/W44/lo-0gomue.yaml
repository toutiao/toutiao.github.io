  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nDefenders
    across the world face the burden of responding to yet another botched code-execution
    vulnerability, this time in boot-time firmware used by most of the world’s server
    vendors and data centers.\n\nThe vulnerability, with a severity rating of 9.5
    out of 10, resides in the TianoCore [EDK II](https://www.tianocore.org/tianocore-wiki.github.io/reference/external-resources/edk_ii.html),
    an open source codebase that hardware makers and cloud providers use to create
    the UEFI firmware that runs during the boot-up sequence. Last year, a representative
    of the UEFI Forum [called](https://uefi.org/sites/default/files/resources/State%20of%20UEFI_UEFI%202025%20DevCon_Final.pdf)
    EDK2 the “preeminent solution / implementation of the UEFI specifications.” Virtually
    all UEFI suppliers (sometimes still called IBVs or independent BIOS vendors),
    including AMI, Insyde, and Phoenix, use the reference code extensively. Project
    Mu, Microsoft’s hardened EDK2 fork, used the code containing the vulnerable component
    as well.\n\nThe vulnerability, tracked as CVE-2026-97631, is a memory-corruption
    flaw in an [ICMP](https://en.wikipedia.org/wiki/Internet_Control_Message_Protocol)
    component that attackers can exploit to execute malicious code that runs before
    the operating system and firmware can implement defenses like [Secure Boot](https://uefi.org/sites/default/files/resources/UEFI_Secure_Boot_in_Modern_Computer_Security_Solutions_2019.pdf),
    which establishes a chain of trust for all code, including the [Trusted Platform
    Module](https://www.trustedcomputinggroup.org/work-groups/tpm) (TPM), loaded during
    boot. While final payloads delivered by CVE-2026-97631 have no persistence—meaning
    they run only once—they can give attackers a wide opening to install other payloads
    that also run each time early in the boot process.\n\n## The cat has left the
    bag\n\nThe parties that discovered CVE-2026-97631—Alex Matrosov of Anthropic and
    Dan Holmes of Google—had arranged for it to stay under wraps until a coordinated
    disclosure that was scheduled for January. AMI, a maker of motherboards and other
    hardware, published [this pull request](https://github.com/tianocore/edk2/pull/13200)
    last month that detailed the vulnerability and included a code fix. Once the post
    came to the attention of the discovering parties, TianoCore Project members published
    a [public advisory](https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m)
    last week.\n\nWith publicly available patch code, it will be trivial for advanced
    hackers to learn how the vulnerability is triggered and to build working exploits.
    Further compounding the urgency, patching UEFI code vulnerabilities in millions
    of end devices sold and used by thousands of hardware makers and cloud providers
    is cumbersome and time-consuming. Word of the vulnerability comes six days after
    another botched disclosure, this one involving a [critical code-execution vulnerability](https://arstechnica.com/security/2026/10/php-maintainers-tell-web-devs-to-prepare-themselves-for-critical-security-patches/)
    in the PHP programming language.\n\n“This vulnerability in the ICMP parser of
    the EDK2 network stack is interesting in terms of how it affects the chain of
    trust and the broader ecosystem,” said HD Moore, creator of Metasploit and chief
    research officer at security firm Dragos. “An attacker intent on compromising
    a nearby endpoint or server could use this bug to hijack program flow at a point
    where the boot process still has access to sensitive components, like the endpoint’s
    TPM. This could be used to break disk encryption for cases where an attacker has
    short-term network access (and it would be even easier in a theft scenario).”\n\nCVE-2026-97631
    is a 16-year-old buffer overflow in the PXE-Base Code driver (NetworkPkg/UefiPxeBcDxe),
    which is responsible for allowing servers, storage equipment, and other devices
    to boot using code downloaded from a local network. During this process—known
    as the pre-execution environment boot—the driver uses a network listener to monitor
    for ICMP errors. Because the driver doesn’t enforce a memory copy limit of 504
    bytes, overwriting adjacent data, a malicious insider or a hacker who has gained
    low-level access to a local network can send an error message that appends code
    past this limit. The IUEFI module running on the CPU then becomes corrupted.\n\nAs
    the official advisory puts it:\n\n> During network boot, the PXE Base Code driver
    (NetworkPkg/UefiPxeBcDxe) keeps a receive request open for ICMP error messages
    and copies each received message into the fixed 504-byte field Mode.IcmpError
    of its private context structure. The copy loop’s bounds handling is incorrect
    in both the IPv4 and IPv6 handlers (PxeBcIcmpErrorDpcHandle and PxeBcIcmp6ErrorDpcHandle):
    for a message longer than 504 bytes it still copies bytes into the field, and
    it advances the destination pointer by the cumulative rather than the per-fragment
    length, so an oversized message writes attacker-controlled bytes past the field.
    Nothing earlier on the receive path restricts the message length.\n\nThe malicious
    error can be delivered through a simple unicast sent from any network distance
    to a target device’s IP address, as long as it’s sent during the PXE boot sequence.
    An attacker can deliver a denial-of-service by causing the boot sequence to hang.
    When the attacker knows what the target firmware build is, it can plant a “counterfeit
    event” that executes the malicious code on the CPU in its UEFI firmware environment.
    The code runs in ring 0, a CPU’s most privileged execution level. Because exploits
    bypass attestation processes designed to cryptographically prove to remote servers
    that the hardware is secure, they present a key opportunity for elevating limited
    privileges.\n\n## Yet another forever day\n\nCVE-2026-97631 joins a long list
    of previously discovered vulnerabilities in UEFI or code that works closely with
    it. The most severe of them, [LogoFail](https://arstechnica.com/security/2023/12/just-about-every-windows-and-linux-device-vulnerable-to-new-logofail-firmware-attack/),
    stemmed from logo images included in the UEFI of just about every hardware maker.
    Rendering bugs allowed attackers to subvert the chain of trust UEFI enforces and
    go on to install malicious components before the OS loaded or Secure Boot ran.
    [PixieFail](https://arstechnica.com/security/2024/01/new-uefi-vulnerabilities-send-firmware-devs-across-an-entire-ecosystem-scrambling/)
    was a vulnerability similar to CVE-2026-97631. It, too, was the result of faulty
    PXE boot flaws in EDK2. Following discovery of the vulnerability, researchers
    embarked on [multiple](https://introspector.oss-fuzz.com/project-profile?project=edk2)
    [fuzzing](https://www.ndss-symposium.org/wp-content/uploads/2025-400-paper.pdf)
    [projects](https://github.com/google/oss-fuzz/tree/master/projects/edk2) designed
    to surface other critical flaws in the open source code library. It appears those
    efforts failed to find this latest flaw.\n\nOther recently discovered UEFI flaws
    include:\n\n- [PKFail](https://arstechnica.com/security/2024/09/secure-boot-neutering-pkfail-debacle-is-more-prevalent-than-anyone-knew/),
    a supply-chain failure resulting from non-production test platform keys, public
    for more than a decade before they were discovered, used in hundreds of device
    models\n- [BootHole](https://arstechnica.com/information-technology/2020/07/new-flaw-neuters-secure-boot-but-theres-no-reason-to-panic-heres-why/)\n-
    [Bootkit](https://arstechnica.com/security/2024/11/found-in-the-wild-the-worlds-first-unkillable-uefi-bootkit-for-linux/)
    and\n- [BlackLotus](https://arstechnica.com/information-technology/2023/03/unkillable-uefi-malware-bypassing-secure-boot-enabled-by-unpatchable-windows-flaw/)\n\nLike
    CVE-2026-97631, exploitation or use of these payloads is appealing because it
    allows attackers to infect machines early in the boot process, before"
