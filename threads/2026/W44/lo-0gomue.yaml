  text: |-
    I don't trust anything that runs before the kernel loads, which is why I always disable ethernet interface intialization in the BIOS, or use non-motherboard ethernet cards, or both.
    I also don't use IPMI because it's horribly insecure by itself and requires a whole separate network, and because Supermicro doesn't think it's a security issue that if your battery on your motherboard dies and there's no link on your dedicated port on certain motherboards, your IPMI defaults to moving to the primary ethernet and to a state where it can be taken over by anyone on the local network.
    It's really unfortunate that the response most people and corporations have is, "that's too unlikely to happen to matter". The fact is that it could happen, and it's much more likely to happen if someone has a reason to want it to happen.
    We (the kind of people who are on this site) should always consider such things, yet for some reason it's not all that common.
    For people who think that this really only effects servers, consider the fact that any device on your home network could be malicious. Your TV could be used to try to hijack rebooting machines. Personal machines are usually rebooted much more often than servers, after all.
