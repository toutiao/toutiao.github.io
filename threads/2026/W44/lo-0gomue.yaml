  text: |-
    I'm not sure if that'd help. Even if the Linux kernel was willing to take on the responsibility of platform initialisation, the image would likely be old because flashing an image like that is scary, since if it goes wrong, then recovery might involve attaching an external flasher.
    If your firmware is broken, you can't just plug in a USB drive and hope to boot that if it's your firmware that does platform initialisation and reads the USB drive. (Though some motherboards do have USB-recovery for writing firmware, e.g. Gigabyte Q-Flash Plus).
    Firmware doesn't have to be terrible though. On x86, I use a lightweight UEFI implementation written in Rust: https://github.com/ArthurHeymans/CrabEFI and with Coreboot's vboot that allows me to A/B deploy the CrabEFI images.
