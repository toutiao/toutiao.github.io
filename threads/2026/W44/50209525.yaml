  author: TehCorwiz
  text: If I&#x27;m reading this correctly it&#x27;s two or threefold. Faster switching
    times, which both increases max speed and reduces power consumption. Avoids flaws
    due to silicon doping, presently we add ions to silicon to get P or N type junctions
    and they&#x27;ve found a way to get P type junctions using &quot;2D Hole Gas&quot;
    which is basically a thin layer of voids inside the bulk diamond crystal after
    treatment and avoids a category of flaws that affect silicon yields. Third, and
    this is speculation, but diamond has a way higher thermal conductivity and lower
    thermal expansion coefficient, so it can likely withstand higher temps and conduct
    heat away faster.
