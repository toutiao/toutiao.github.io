  author: eigenspace
  text: I can see why one might intuitively think this, but actually this is just
    a bad take. For most practical purposes, the main value added by these batteries
    is not really the size of their storage capacity (afterall, their capacity is
    tiny relative to the grid&#x27;s needs), but their ability to quickly sink or
    supply massive amounts of <i>power</i>.<p>If these batteries had 10x the storage
    capacity, but 1&#x2F;10th the power output, they&#x27;d miss out on their biggest
    advantage, which is capturing mid-day solar oversupply, and providing virtual
    grid inertia.<p>Long duration, lower-power batteries <i>will</i> have an important
    role to play once grids get further along in renewable adoption, but for now,
    short duration power-supply is the main value they add, and it makes perfect sense
    to quote battery numbers in terms of power. (not that I&#x27;d complain about
    providing capacity numbers too)
