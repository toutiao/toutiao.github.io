    4.6 mbpd as a result of a ~500 billion CNY investment to increase production.
    Still China imports about 10 mbpd, so it has developed a massive 1.5 billion barrel
    strategic reserve, which allows China to weather disruptions in global oil supply
    even as it races to increase domestic production.<p>And China is also investing
