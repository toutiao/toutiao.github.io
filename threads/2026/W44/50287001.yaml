  author: crote
  text: It <i>can</i> be done, but it would requires additional equipment. Batteries
    are traditionally grid-following, so they&#x27;ll just follow whatever frequency
    the grid is already running on. The frequency itself is then provided by the rotational
    inertia of &quot;spinning metal&quot; power plants.<p>But there&#x27;s no reason
    that <i>has</i> to be your frequency source. Any single battery installation on
    its own is perfectly capable of making up some frequency, which is why home power
    banks with island-mode AC output are a thing - or even just a traditional UPS.
    Doing the same with thousands of individual battery installations across the grid?
    You&#x27;ll need some way to get everyone to agree <i>exactly</i> on frequency
    and phase, which in practice is probably going to mean getting them to agree on
    time to within a few microseconds, which could be done (albeit not very sabotage-proof)
    using GPS.
  score: 0
