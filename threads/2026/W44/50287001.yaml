  author: myself248
  text: One reason they report in MW instead of MWh, is that grid operators primarily
    spec systems by their continuous MW, and only secondarily mention their cumulative
    MWh. So that&#x27;s the way they talk about them, and reporters just mimic that.
    Both are important, but the top-line number is MW, for sure.<p>One reason for
    this is that for a lot of grid-support functions, instantaneous or short-term
    power is vastly more important than long-term energy capacity. The other reason
    is that traditional generation is <i>only</i> sized by MW; you just keep pouring
    fuel into it forever, so the notion of MWh doesn&#x27;t even enter the picture.
    They&#x27;re not even thinking in those terms.<p>You and I, as battery natives,
    think about it the other way around. But we&#x27;re not grid operators.
