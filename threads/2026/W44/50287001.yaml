  author: leoedin
  text: Having worked in the industry for a bit, the reason people talk about &quot;MW
    of batteries&quot; is because they&#x27;re usually designed to deliver the capacity
    for a fixed number of hours. Earlier batteries would do 1 hour (so a battery would
    typically be 1MW&#x2F;1MWh) and newer sites coming online are usually 2 hours
    (so 1MW&#x2F;2MWh). As battery deployment grows the money is increasingly just
    in energy arbitrage, so there&#x27;s a lot of pressure for longer duration storage.
    If you see a headline MW figure it&#x27;s a safe bet that it&#x27;s between 1-2x
    that in MWh.
