  author: toomuchtodo
  text: Both assertions are false. Batteries react within milliseconds, and last 10-25
    years (depending on chemistry and cycling). Australia had to reconfigure its ancillary
    services market due to how fast battery storage reacts, for example (proven out
    with the Hornsdale Power Reserve).<p>Please update priors to current state of
    the art.<p><a href="https:&#x2F;&#x2F;www.eia.gov&#x2F;todayinenergy&#x2F;detail.php?id=50176"
    rel="nofollow">https:&#x2F;&#x2F;www.eia.gov&#x2F;todayinenergy&#x2F;detail.php?id=50176</a><p>-
    The most common cited use case for batteries is frequency response. Frequency
    response is a service that maintains grid frequency as close to 60 hertz (Hz)
    as reasonably possible. Deviations below 60 Hz can lead to protective generator
    trips that result in a subsequent decline in system stability. Batteries are particularly
    well suited for frequency regulation because their output does not require any
    startup time and batteries can quickly absorb surges. At the end of 2020, 885
    MW of battery storage capacity (59% of total utility-scale battery capacity) cited
    frequency response as a use case.
