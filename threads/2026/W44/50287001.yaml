    can mirror, between them Alice and Sam produce 100MW of power smoothly. Obviously
    real life is more complicated but this gets the point across<p>Now, Charlie owns
    a coal power plant, it can ramp from 100MW to zero, but it takes about an hour.
    This doesn&#x27;t directly mirror the solar farm, Charlie and Sam can&#x27;t really
    just work together to smoothly produce the same power<p>Bill&#x27;s 100MWh BESS
    fixes this. An hour before the sun comes up, Charlie&#x27;s coal plant begins
    shutting down, Bill&#x27;s BESS puts out 100MW while consuming the gradually reducing
    coal power output and some of the gradually <i>increasing</i> additional power
    from the solar farm as that increases."
