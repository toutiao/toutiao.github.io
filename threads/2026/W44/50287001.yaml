    [Solar power](https://electrek.co/guides/solar-power/)\n- [Battery Storage](https://electrek.co/guides/battery-storage/)\n\n#
    The US added a record 20.2 GWh of battery storage in just 3 months\n\n[![Avatar
    for Michelle Lewis](https://secure.gravatar.com/avatar/4c5ccfcbb20bacd8be949375c14d6574f4c17589b4e1419275380f6f7923e5ad?s=30&d=identicon&r=g)](https://electrek.co/author/michellelewis/)[Michelle
    Lewis](https://electrek.co/author/michellelewis/)&nbsp;|&nbsp;Aug 31 2026 - 9:01
    pm PT \n\n![Utah largest solar battery storage](https://electrek.co/wp-content/uploads/sites/3/2026/06/Green-River-Energy-Center-Utah.jpg?quality=82&strip=all&w=1600)\n_Photo:
    rPlus Energies_\n\nThe US battery storage market just posted its biggest quarter
    ever, adding 20.2 gigawatt-hours (GWh) of new capacity in Q2 2026.\n\nThe record
    quarter brought total battery storage installations for the first half of 2026
    to 30.8 GWh – up 23% year over year – according to the new “[US Energy Storage
    Market Outlook](https://seia.org/research-resources/energy-storage-market-outlook/)”
    from the Solar Energy Industries Association (SEIA) and Benchmark Mineral Intelligence.\n\n##
    Utility-scale batteries drove the record\n\nNearly all the growth came from large
    grid batteries. Utility-scale projects accounted for about 18 GWh of Q2 installations,
    supported by seven gigawatt-hour-scale projects – four in Arizona, two in California,
    and one in Utah.\n\nArizona alone added a record 6.2 GWh, the strongest quarter
    ever recorded by a single state. Texas added 3.8 GWh, and California installed
    another 3.6 GWh. Of the utility-scale capacity installed during the quarter, 44%
    was paired with solar, while 56% was standalone storage.\n\nAdvertisement - scroll
    for more content\n\nThat matters because batteries can charge when electricity
    is abundant and relatively cheap, then send it back to the grid when demand and
    prices rise. During extreme heat, that stored electricity can help cover the evening
    hours when solar output drops but air-conditioning demand remains high.\n\nBattery
    storage supplied more electricity to the US grid during the first eight months
    of 2026 than it did during all of 2025, according to the report.\n\n“This record
    growth highlights that storage is a powerful reliability tool that strengthens
    our energy security, meets rising demand, and puts downward pressure on electricity
    bills,” said Tim Pawlenty, president and CEO of SEIA.\n\n## Storage growth spreads
    beyond California and Texas\n\nMore than 74% of US battery storage capacity installed
    in Q2 2026 was in states that Donald Trump won in the 2024 presidential election,
    with Arizona, Texas, and Utah leading.\n\nSEIA also notes that US utility-scale
    battery capacity grew from 88 GWh to 165 GWh during the first 18 months of the
    Trump administration. Those figures show when and where the capacity entered service,
    but the report doesn’t attribute individual project investment decisions to a
    particular administration.\n\n“Energy storage is no longer just a California and
    Texas story anymore,” said Shan Tomouk, BESS & Energy Lead at Benchmark Minerals.
    “We’re seeing strong pipeline growth in Arizona, Nevada, Oregon, Colorado, and
    several other states.”\n\nDemand is running ahead of previous expectations, so
    Benchmark raised its storage forecast through 2030 by 11.5%, to 683 GWh. More
    than 10% of all US battery storage capacity now operating came online in Q2 alone.\n\n##
    Home batteries have a rough quarter\n\nResidential battery storage saw a much
    weaker quarter. US homes added 657 megawatt-hours (MWh) of batteries in Q2, down
    27% year over year.\n\nThe report attributes the decline partly to the removal
    of the federal 25D residential clean energy tax credit and partly to homeowners
    rushing installations into 2025 ahead of the incentive change.\n\nBenchmark still
    sees a long-term case for home batteries as electricity costs rise, net-metering
    rules change, power outages remain a concern, and utilities expand virtual power
    plant and demand-response programs. But it forecasts residential installations
    falling 16% in 2026 after jumping 56% in 2025.\n\nCommercial and industrial storage
    added approximately 1.8 GWh during Q2. Benchmark expects data centers to be a
    major source of future demand as developers combine batteries with onsite solar,
    wind, and, in some cases, natural gas generation to work around grid constraints
    and manage fast-changing power loads.\n\nUS battery manufacturing also expanded
    during the quarter. Tesla brought its third Megafactory online in Texas, with
    the capacity to produce 50 GWh of Megapacks annually, and began shipping Megapacks
    containing domestically manufactured lithium iron phosphate cells.\n\n## Top comment
    by [NeilMx](#comments)\nLiked by 8 people \n\nIt's a shame, that residential batteries
    had a drop. Hopefully they will pick up.\n\nI think it's useful, that homes can
    support themselves, and if necessary at the right price support the grid. Heh
    I am not a charity \U0001F609\n\n[View all comments](#comments)\n\nBenchmark now
    expects the US to install about 71 GWh of battery storage in 2026 – around 20%
    more than in 2025 – as utilities and grid operators race to keep up with rising
    electricity demand.\n\n**Read more:** [1 in 7 US students now goes to a solar-powered
    school](https://electrek.co/2026/08/28/1-in-7-us-students-now-goes-to-a-solar-powered-school/)\n\n[![](https://electrek.co/wp-content/uploads/sites/3/2026/08/DES-1038_Electrek-Banners_Resiliency_b040b4.png)](https://www.energysage.com/landing/home-solar/p/electrek-rsm-ml/)\n\n*
