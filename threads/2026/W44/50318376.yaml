  text: Nordhaus&#x27; riksbank price winning work justifies global temperature rise
    to +4°C as optimal. At that point the vast majority of humanity is going to die
    out with just some pockets surviving.<p>The reason is quite basic. Global temperature
    includes the oceans which make up 70% of earth&#x27;s surface and have a higher
    storage capacity for heat. So a 4°C global temperature rise might be closer to
