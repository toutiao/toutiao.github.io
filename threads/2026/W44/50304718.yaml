  author: ijazkhan095
  text: I ran into this building a site that shows where the money in a litre of petrol
    goes in Pakistan. Every number comes straight from the regulator&#x27;s published
    price notices, so I assumed the chart would be neutral. It wasn&#x27;t, because
    the choices were all in the grouping.<p>I could have split the import price into
    &quot;crude&quot; and &quot;premium&quot;, but the documents print cost and freight
    as one line. Any split would have been my estimate presented as fact, so it stays
    one line. A row the document doesn&#x27;t carry shows as empty, not 0.00, because
    a zero tells the reader something the source never said. I also renamed a bucket
    from &quot;The state&quot; to &quot;Government&quot;. The figures didn&#x27;t
    change, but people read &quot;the state&quot; as something abstract and &quot;government&quot;
    as someone who takes a cut.<p>Same data and same sources, but each of those calls
    changes what a reader walks away believing.
