  text: |-
    ElementaryUI author here:<p>It is listed in the js framework benchmark (as elementaryui), so you can check where it lands performancewise ATM:
    <a href="https:&#x2F;&#x2F;krausest.github.io&#x2F;js-framework-benchmark&#x2F;current.html" rel="nofollow">https:&#x2F;&#x2F;krausest.github.io&#x2F;js-framework-benchmark&#x2F;current.ht...</a><p>I am convinced we can keep it &quot;fast enough&quot; for most everything. Bundle size still is a weak spot, and proper bundling&#x2F;splitting of wasm modules has to be willed into existence, but I see no blockers for a pretty smooth experience.<p>Honestly, it mostly started as a &quot;I like Swift, can I use it everywhere?&quot; challenge. But there is a real benefit about fully staying in a modern language and tooling environment. Swift, imho, is a very clean and powerful language that fits this space well, might as well build a comfortable way to use it for web projects.
