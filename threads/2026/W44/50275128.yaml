    \"NVIDIA\") [nvidia](/nvidia)\n\n \n\n  \n\n \n\n \n## One open model for multilingual
    transcription, speaker attribution, translation, and audio Q&A, with top leaderboard
    results, plus the open Granary v2 data pipeline and fine-tuning recipes to adapt
    it. \n\nA transcript can capture every spoken word and still leave users or applications
    wondering who said what, how to translate it, or how to format domain-specific
    jargon. Multilingual calls, fast-paced meetings, and medical dictation each need
    different output: a translation, speaker labels, or correctly spelled medical
    terms.\n\nNVIDIA Nemotron 3.5 Transcribe is an open-weight, promptable model that
    turns recorded speech into useful text, now available on [Hugging Face](https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B)
    and [ModelScope](https://modelscope.ai/collections/nv-community/Nemotron-35-Transcribe).
    It brings transcription, speaker attribution (diarization), translation, and audio
    question answering into one checkpoint: it transcribes 40 languages, translates
    31 of them to or from English, and attributes speakers in 13. It handles recordings
    up to an hour long and labels up to eight speakers. Developers can guide output
    with natural language, choose where their audio is processed, and adapt recognition
    to domain vocabulary and accents.\n\nTranscribe is first among open-weight models
    on the [Hugging Face Open ASR Leaderboard](https://huggingface.co/spaces/hf-audio/open_asr_leaderboard)
    for English and sits on [Artificial Analysis](https://artificialanalysis.ai/speech-to-text/non-streaming?error-rate=word-error-rate-vs-active-size)’s
    accuracy–active-parameter frontier. For speaker attribution, it posts the lowest
    error rate on [David AI’s 21-language diarization leaderboard](https://research.withdavid.ai/blog/dai-asr-i18n#leaderboard)
    and ranks first in [VoiceArena’s 14-system comparison](https://voicearena.com/diarization-bench/methodology).
    Quantized versions are coming soon, so you can run Transcribe locally on your
    RTX Spark, DGX Spark, or Jetson AGX Thor—or scale up on Blackwell data-center
    GPUs.\n\nGranary v2’s multilingual data (available on [Hugging Face](https://huggingface.co/datasets/nvidia/Granary-v2)
    and [ModelScope](https://modelscope.ai/datasets/nv-community/Granary-v2)) and
    reusable curation pipeline, together with [NeMo Speech fine-tuning tools](https://github.com/NVIDIA-NeMo/Speech/blob/main/tutorials/speechlm2/finetuning/README.md),
    extend prompt-level control to training: developers can define the written form
    they need and adapt the model to the speech their applications encounter. In a
    [medical case study](https://github.com/NVIDIA-NeMo/Speech/blob/main/examples/speechlm2/finetuning/docs/medical-asr-synthetic-data.md),
    fine-tuning cut word error rate (WER) on held-out speakers by 45.8% relative to
    the best prompt.\n\n# Guide transcription and analysis with natural language \n\nThe
    same checkpoint can turn one meeting recording into different outputs, depending
    on the instruction:\n\n- “Transcribe this recording and label each speaker.” \n-
    “Translate this audio into English.” \n- “What decisions were made in this meeting?”\n\nExperience
    the model in action in the video below, where it tackles a classic scene from
    the 1940 screwball comedy His Girl Friday—a film famous for its rapid-fire, heavily
    overlapping dialogue.\n\nFor unfamiliar terms, try context before training. In
    a healthcare setting, for example:\n\n`Transcribe this medical discussion in the
    original language. Possible terms: HbA1c, metformin. Use these terms only when
    supported by the audio. Preserve standard medical spelling and write numbers in
    conventional written form.`\n\nThe [model card](https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B)
    has recommended presets, including reasoning for audio questions, plus the full
    prompt guide and a task-by-language matrix: language support differs by task,
    and audio question answering is trained in English. Word-level timestamps are
    also supported. As with any speech model, spot-che"
