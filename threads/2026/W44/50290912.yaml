  text: 'The danger of being excited about old techniques is giving the impression
    that you are years behind everyone else.<p>A coworker once said of a particular
    breed of manager who is an emphatic late adopter: it’s as if every time he goes
    to the dentist he reads an old trade journal in the waiting room and comes back
    to work with a “new” idea that everyone else is already busy replacing.<p>Are
    there any actual newer techniques? For instance, putting 11% of your hardware
    on reserve for hardware failures seems a bit generous to me for such an expensive
    cluster. Even if it’s down from some much larger number. One solution to this
    I’ve seen for handling cpu and memory variability with bin packing is to pool
    the spare capacity between tasks. For instance a data center with four zones might
    have 7 backup generators, instead of eight or twelve, counting on clusters of
    generator failures not to happen frequently.<p>And of course there’s always running
    low priority tasks on the spare hardware and evicting them on a fault. However
    those low priority tasks tend to develop their own shadow priorities when they
    are in house. But that’s a management problem not a technical one.'
