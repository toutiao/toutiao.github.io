  content: "Not all high-speed interconnects are created equal, and using the wrong
    one can be quite costly: running the same distributed training job over InfiniBand
    rather than NVLink can [degrade performance by 43%](https://nanotron-ultrascale-playbook.static.hf.space/index.html#:~:text=which%20typically%20sees%20around,scenarios).\n\nHistorically,
    NVLink was limited to communication within a single node, meaning that multi-node
    AI workloads were forced to communicate over InfiniBand or a cloud equivalent
    (EFA on AWS, GPUDirect-TCPX on GCP). NVIDIA’s NVL72 systems remove this limitation
    by connecting all 72 GPUs in a rack with a unified NVLink fabric, so GPUs on different
    nodes can exchange data with an order of magnitude more bandwidth.\n\n![Infiniband](https://cdn.sanity.io/images/9qcljuzt/production/ccfaea9718e3d712a67506090f439426775972b7-1080x1080.svg?auto=format&h=3840&w=3840&fit=min)\n\nHowever,
    maximizing the benefits of NVL72 systems is highly dependent on workload placement:
    a multi-node job spread across racks is still bottlenecked by InfiniBand. Preserving
    rack-locality gets harder as hardware failures take nodes offline and jobs finishing
    at different times scatter free capacity across racks.\n\nThis blog covers the
    communication bottleneck in large-scale training and inference, the NVL72 rack-scale
    fabric, and slice sizing for resilience to GPU failures, as well as how the [SkyPilot
    Platform](https://skypilot.ai/platform) keeps multi-node jobs rack-local through
    topology-aware placement, in-place recovery from hardware failures, and automatic
    defragmentation of shared clusters.\n\n## [Training at scale is a communication
    problem #](#training-at-scale-is-a-communication-problem)\n\nFrontier training
    jobs run across thousands of GPUs. Doing so requires answering two questions:\n\n1.
    How do you shard your model across GPUs to ensure that it can actually run?\n2.
    Given your compute budget, how many copies of the sharded model can you run to
    maximize training throughput?\n\nThe first question is typically answered with
    a combination of:\n\n- Tensor Parallelism (TP): splitting a layer’s weight matrices
    across GPUs\n- Expert Parallelism (EP): placing a mixture-of-experts (MoE) layer’s
    experts on different GPUs\n- Pipeline Parallelism (PP): splitting a model layer-wise
    across GPUs\n\nThe answer to the second question sets the degree of Data Parallelism
    (DP): the number of copies of the sharded model that train in parallel, each on
    a different slice of the training data.\n\nOf these parallelism strategies, tensor
    parallelism’s all-reduce and expert parallelism’s all-to-all communication patterns
    sit on the critical path during training, making them [the most important to keep
    on NVLink](https://arxiv.org/abs/2603.07685) (§9.1.2).\n\n### Tensor Parallelism\n\nTensor
    parallelism splits the weight matrices inside each layer across GPUs, so every
    GPU only stores and computes a slice of each layer.\n\nTransformer layers are
    made up of two blocks: self-attention and a multi-layer perceptron (MLP). At its
    core, each block is two matrix multiplications (GEMMs) in a row. [Megatron-LM](https://arxiv.org/abs/1909.08053)
    (§3) showed that by partitioning a block’s first GEMM column-wise and its second
    GEMM row-wise, the GPUs only need to synchronize via all-reduce once per block,
    after the second GEMM, instead of after each one.\n\n![Animated diagram: tensor
    parallelism splits A column-wise and B row-wise across two GPUs, and one all-reduce
    sums the partial z results](https://cdn.sanity.io/images/9qcljuzt/production/57989e427e99a44011eac3fcd2758eb912f7c4b4-1200x400.svg?auto=format&h=1280&w=3840&fit=min)\n\n_Figure
    1. Tensor parallelism across two GPUs. A is split column-wise, so each GPU computes
    its own slice of y without communicating. B is split row-wise to match, so each
    GPU produces a partial z, and one all-reduce sums the partial results._\n\nEven
    with this optimization, tensor parallelism still requires two all-reduces per
    transformer layer during the forward pass. [These all-reduce steps sit on the
    critical path](https://nanotron-ultrascale-playbook.static.hf.space/index.html#:~:text=The%20inability%20to%20fully%20hide,directly%20adds%20to%20the%20critical%20path)
    during training because they cannot be fully overlapped with computation. As a
    result, tensor parallelism is typically kept on NVLink: Hugging Face measured
    a 43% drop in training throughput when it moved off NVLink onto InfiniBand.\n\n###
    Expert Parallelism\n\nIn a mixture-of-experts (MoE) layer, the MLP block is replaced
    by many smaller MLPs, called experts, and a router that sends each token to a
    small subset of experts. Expert parallelism splits MoE layers such that these
    small, independent experts are placed on different GPUs.\n\nUnder expert parallelism,
    each MoE layer requires two all-to-all communication steps during the forward
    pass, dispatch and combine. A router selects the top-_k_ experts for each token
    and dispatches tokens to the GPUs that have those experts in memory. Each GPU
    then computes its local experts on the tokens it received via a single grouped
    matrix multiplication. Finally, the expert outputs are sent back to each token's
    original GPU and combined.\n\n![Expert parallelism diagram: an all-to-all dispatches
    tokens to experts on different GPUs, and a second all-to-all combines the results](https://cdn.sanity.io/images/9qcljuzt/production/0fdb50fb0732072a16f453ecd1a787bfd9bb9e9b-2008x950.png?auto=format&h=1817&w=3840&fit=min)\n\n_Figure
    2. Expert parallelism distributes experts across GPUs. The all-to-all communication
    dispatches tokens to their assigned experts and combines results. (Source: NVIDIA,
    Figure 4.)_\n\nAs models add more MoE layers and route each token to more experts,
    the volume of all-to-all traffic grows, introducing a communication bottleneck.\n\nTraining
    an MoE model with 64-way expert parallelism spreads each MoE layer’s experts across
    64 GPUs. On standard 8-GPU servers, that moves the all-to-all traffic off high-bandwidth
    NVLink and through much narrower InfiniBand interconnects where unoptimized communication
    can consume [up to 60% of training time](https://arxiv.org/abs/2603.07685) (§1.2).
    On NVL72 systems, all 64 GPUs stay within a single NVLink domain, [effectively
    eliminating the communication bottleneck](https://arxiv.org/abs/2603.07685) (§9.2.2).\n\n##
    [Inference needs fast inter-node networking too #](#inference-needs-fast-inter-node-networking-too)\n\nThe
    parallelism techniques discussed above are not unique to training. Beyond enabling
    inference engines to serve models that are too large for a single GPU, model parallelism
    can also improve throughput. Splitting a model's weights across more GPUs frees
    up memory for the KV cache, so the engine can process [more concurrent requests
    or support larger context windows](https://vllm.ai/blog/2026-05-14-elastic-expert-parallelism#:~:text=WideEP%20deployments,very%20long%20contexts).
    In some cases, the freed memory grows faster than the number of GPUs: in one [vLLM](https://vllm.ai/blog/distributed-inference#:~:text=we%20are%20able%20to%20increase%20the%20amount%20of%20KV%20Cache%20blocks%20by%2013.9x)
    benchmark, splitting a model tensor-parallel across two GPUs increased the amount
    of KV cache blocks by 13.9x and delivered 3.9x more throughput.\n\n![Animated
    diagram: Llama-3.1-70B weights fill most of one H100, and sharding them across
    two H100s frees memory for 13.9x more KV cache blocks](https://cdn.sanity.io/images/9qcljuzt/production/562f38685bdd27a669651d0bb017fa6fc9b4d859-950x384.svg?auto=format&h=1552&w=3840&fit=min)\n\n_Figure
    3. GPU memory breakdown for Llama-3.1-70B on one vs. two H100s. (Data: vLLM.)_\n\nExpert
    parallelism follows the same logic. With a low degree of expert parallelism, each
    GPU holds many experts, leaving less room for the KV cache. WideEP, which refers
    to expert-parallel configurations spanning multiple nodes, significantly reduces
    the number of experts per GPU. The trade-off is network traffic: every all-to-all
    now spans more GPUs. "
