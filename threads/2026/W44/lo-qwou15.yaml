    Drei Jülicher, Kölner und Norweger Wissenschaftler sind dieser Frage auf den Grund
    gegangen – und fanden dabei große Unterschiede zwischen den Stromnetzen.\n\n](/de/aktuelles/news/highlights/2021/2021-10-08-black-box-stromnetz)\n\n[\n\n
