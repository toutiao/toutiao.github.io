    /   \nRoom R 3028\n\n+49 2461/61-9054\n\nE-Mail\n\n## More on the topic\n\n[\n\n
    ![](/en/news/effzett/2024/build-up-more-energy-reserves/@@images/preview_image-1500-9634b7ec9a86797e61f026fc85e1f3bd.jpeg)\n\nEnergy
    transition\n\n### Build Up More Energy Reserves\n\nWith each percent more electricity
    generated from wind and solar power, it is becoming increasingly clear: more storage
    is required for the energy transition. In particular, different storage systems
