    Dr. Regine Panknin\n](/profile/panknin_r)\n\nPressereferentin\n\nBuilding 15.3
    /   \nRoom R 3028\n\n+49 2461/61-9054\n\nE-Mail\n\n## More on the topic\n\n[\n\n
    ![](/en/news/effzett/2024/build-up-more-energy-reserves/@@images/preview_image-1500-9634b7ec9a86797e61f026fc85e1f3bd.jpeg)\n\nEnergy
    transition\n\n### Build Up More Energy Reserves\n\nWith each percent more electricity
    generated from wind and solar power, it is becoming increasingly clear: more storage
    is required for the energy transition. In particular, different storage systems
    are needed – not just different types of batteries, but also hydrogen. This is
    the only way to offset fluctuations, cope with periods in which little to no energy
    is generated, and keep the network stable.\n\n](/en/news/effzett/2024/build-up-more-energy-reserves)\n\n[\n\n
    ![](/en/news/effzett/2023/the_blackout_fairy_tale/@@images/preview_image-1000-560bac1e950734c61b4fd2d6acaa53d0.jpeg)\n\nEnergy
    supply\n\n### The blackout fairy tale\n\nAre nationwide power cuts in Germany
    due to supply shortages something we have to fear? No, says Jülich grid expert
    Prof. Dirk Witthaut. He also explains why, in some cases, legal regulations are
    a much bigger problem for the stability of electricity grids than renewable energies.\n\n](/en/news/effzett/2023/the_blackout_fairy_tale)\n\n[\n\n
