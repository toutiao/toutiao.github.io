  text: |-
    I was surprised reading the man page that `@daily‘ didn’t do that. Apparently it’s a fixes specified time. I’d assumed it was midnight plus some random jitter. It doesn’t look like POSIX specifies this.
    Aha! It turns out I didn’t completely misremember. FreeBSD uses cron’s regular things to drive periodic, which can then introduce a random sleep and schedule things to run sequentially (avoiding local thundering herds).
    XNU extended kqueue in the opposite direction for power management: you specify not just the time of the wake but also the acceptable jitter, so it can coalesce wakes and leave the CPU in a lower-power state when there’s nothing to do, intentionally triggering thundering herds but for low-compute jobs. It’s interesting that the local and global optimisations sometimes want opposite things here.
