  text: |-
    But how do all these devices synchronize their consumption?

    This question wasn't fully answered by the article, at least not explicitly. I think the implication is that the timers themselves must be synchronized to the same clock somehow? (NTP, GPS, etc.) In other words, it's not sleep for 60 seconds, check power, repeat. It's sleep until the start of the next minute, and the devices all agree when the minute ticks over.
    Systems that wouldn't cause that synchronization:

    A simple microcontroller that sleeps for 60 seconds: I imagine clock drift would act as its own natural jitter.
    Keeping time by counting AC cycles: No drift, but devices would be spread out based on when they were powered on.
