  text: |-
    Almost all of these large deployments sell frequency services and do energy price arbitrage. The EU grid is mostly priced at 15-min increments, so being just a few seconds off the metered clock can put volumes on the “wrong” quarter-hour. For stability services there are variants where you get a message from the TSO saying “discharge x MW starting at <timestamp> for y minutes”..
    In short: the battery operators are highly motivated to get their clocks right, but they don’t have a system perspective, they focus on their one or two assets.
    The system perspective is the TSOs problem, and they did catch it - it’s Tennet that did the sleuthing here. One would have hoped they would have caught it when the specified the battery requirements - they do specify jitter in some places, I think they just were not aware the batteries stopped what they were doing to check SoC
