  text: |-
    This observation sent me on a rabbit-hole of looking at systemd timers. Long story short: AccuracySec is a thing that tells systemd to randomize the start of all timers. Timers are still run at the same time though to minimize power consumption. There's also RandomizedDelaySec but that jitters each timer to run at a separate time, probably not what you want.
    I believe the defaults allow timers to fire within 1 minute of their scheduled time, that sounds just about right. Not sure if this helps old-fashioned cron jobs or not, probably depends on the cron implementation.
