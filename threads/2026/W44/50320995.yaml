  author: jacquesm
  text: 'I have all three and you&#x27;re not going to convince me of that.<p>Side-by-side
    Qwen 3.8 27B is ~6x as fast as DS4 and GLM 5.3 and faster than that if you get
    the speculative engine set up properly. That means you can iterate very rapidly
    on the same problem and for many problems this is the way to solve them. DS4 and
    GLM 5.3 shine when Qwen would take too many turns to solve something, they simply
    have more world knowledge and seem to home in on possible solutions faster in
    #tg but slower in wall clock time. If a particular problem is within striking
    range of all three then Qwen will usually be the fastest solver by far.<p>It also
    depends on how good your prompt is, whether you are setting up points for guidance
    or whether you expect everything to be solved in a single shot.'
