  author: topspin
  text: 'So far, the comments have focused on hopes for the effectiveness of open-weight
    models versus proprietary frontier models. That&#x27;s fine, but I&#x27;m thinking
    about the approach and the results, as opposed to the model.<p>Taking the results
    at face value, what is it about the &quot;team&quot; that makes the system so
    effective? That&#x27;s the key here: presumably, the approach should work regardless
    of the model, open-weight or otherwise.<p>My guess would be that the division
    of labor makes the separate contexts more effective. This is an optimization around
    the limits of context. Some of that is simply the net amount of context brought
    to bear: each team member has a context, so the net amount of context is multiplied
    by the number of team members. Also, since the division limits the scope of each
    team member&#x27;s focus, the context a team member has is used more effectively.'
