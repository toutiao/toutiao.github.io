  author: andai
  text: 'Yeah, that&#x27;s the core of the issue:<p><a href="https:&#x2F;&#x2F;simonwillison.net&#x2F;2025&#x2F;Jun&#x2F;16&#x2F;the-lethal-trifecta&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;simonwillison.net&#x2F;2025&#x2F;Jun&#x2F;16&#x2F;the-lethal-trifecta&#x2F;</a><p>The
    &quot;lethal trifecta&quot;: To be useful, an agent needs internet access, untrusted
    inputs, and your private information.<p>So it can get prompt injected and exfiltrate
    your data. (Indeed I read that Claude Code puts your email address into HTTP requests
    it makes to random servers?)<p>My solution here was to just not give it anything,
    but that does preclude the &quot;my claw bought a car!&quot; result everyone&#x27;s
    excited about.<p>My way of thinking here is &quot;blast radius&quot;. Assume it
    <i>will</i> get prompt injected. What goes wrong? Then design the setup so that
    scenario is not bad. e.g. it has my keys but they&#x27;ve got $5 of credit on
    them. It has access to the filesystem, but only on its own Linux account. (Ok
    I set this up last year before they could communicate thru the bloody CPU cache,
    might need an update :)'
