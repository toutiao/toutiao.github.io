    - Tried to open an account to post stuff on Reddit, every post gets instantly banned because I don&#x27;t have enough karma.  Try to start posting comments to get karma, same thing. IN fairness, this did eventually start to work - where I could post on certain subreddits and comment in others.<p>Overall the experience always has the same shape - something super opaque to the end user, no resolution options, and really you are left with no alternatives because every big tech firm is doing this.<p>So then the same AIs that create the problem recommend you try and get media articles published about it to draw attention to the plights of the real human caused by AI bots.
