    This is objectively hilarious.<p>Basically every large company has gone all in on AI, and as a result the number of bots has (likely, I have no proof) exploded. Then as a result of that, they crack down on &quot;potential bots&quot; by banning them. Of course, all they care about is what % of bots they cracked down on now what % of real people. Then because they&#x27;ve gone all in on AI, you can&#x27;t get an actual human to help you... just a bot they trained to always say no.<p>My current experiences in these arena:
