  text: I am sorry, but this kind of comment has become too common on this site. It
    underestimates the kind of code a highly efficient human being coder is capable
    of writing and managing over a long period of time ( which is what is required
    in a real job, btw ).<p>The only thing that I think coding agents are better than
    good human coders is the ability to generate a lot of usable code in a shorter
    period of time.<p>But can they maintain it over a long period of time? I highly
    doubt that, given the evidence that I have with me. Coding agents under-perform
    quite often in my line of work. They overproduce and yet are not able to cover
    the given requirements.<p>Sometimes they do 100% of the given task, but miss a
    slight detail ( given clearly in the prompt ), that renders their product unusable.
    This quite often results in a complete rewrite - consuming more, guess what, tokens!!!<p>So
    anyone who thinks that right now, coding agents can replace human coders completely,
    is really not working with these agents long enough or hard enough.<p>Once you
    start demanding from agents the same quality of code and the added responsibility&#x2F;liability
    that you would associate with a human code, you will sure see the difference and
    I can tell you that its a lot.<p>I work with Opus 5.5 and Codex Astra 6 on a wide
    range of projects and they are found completely wanting in certain situations
    where a human would be more trustworthy and produce better results.
