    or else they get flooded out. (To be clear, this seems like a reasonable response
    to me; the existing structure often wasn&#x27;t made to handle that kind of influx,
    and the spectrum of current-day AI <i>includes</i> a ton of lower-quality models
    and harnesses that will be cheerfully overconfident. The <i>meta</i> signal can
    be ruined even if there is also high-quality stuff that people who know how to
    get it can get!) This plus popular anger over AI developments seems to mean that
    people who do successfully use AI to find bugs have a lot of incentive to not
    publish anything or try to get it upstreamed because they&#x27;ll immediately
    come under fire. Highly reputable people and organizations sometimes use their
    existing clout to vouch for AI-assisted bug reports for prominent projects, but
    a lot of others just quietly adopt the AI fix in their own tree and give up on
