  author: jonhohle
  text: 'I went down a rabbit hole of copyright and one of the things that clicked
    along the way is that a vibe coded app is not copyrightable. If someone says their
    app is completely Built with AI, they’re also saying: here is a public domain
    program that you can repackage as you wish.<p>It’s not quite that simple - there
    may be minor things here and there that are copyrightable like the name. But anything
    purely prompt generated is fair game to be copied and reused.<p>It will be interesting
    to see this tested, but companies telling people AI is writing their software
