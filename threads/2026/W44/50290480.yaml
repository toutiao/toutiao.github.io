  author: jonhohle
  text: It depends how that selection is done. If an AI prompts a human with 10 layouts
    it generates and the human picks ones, it is not copyrightable.<p>If the human
    takes some number of individually generated components and composes them in some
    creative way, the composition is copyrightable but the individual components are
    not.<p>One existing precedent was the layout of a graphic novel consisting AI
    generated panels. The layout was done by a human and protected by copyright. The
    content of each individual panel was generated by AI and was not. <a href="https:&#x2F;&#x2F;www.copyright.gov&#x2F;docs&#x2F;zarya-of-the-dawn.pdf"
    rel="nofollow">https:&#x2F;&#x2F;www.copyright.gov&#x2F;docs&#x2F;zarya-of-the-dawn.pdf</a><p>Code
    is no different. If AI generates a library and GUI, neither are copyrightable.
    If a dev glues them together, the expressiveness of that work may be, but it also
    might be the logical application of attaching interfaces and not creative enough
    to meet the threshold.<p>The 2024 opinion reinforces that determination.
