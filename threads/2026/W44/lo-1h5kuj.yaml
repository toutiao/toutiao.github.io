  content: "# [Pharo 14 Released!](/news/2026-10-26-Pharo14Release.html)\n\nDear Pharo
    users and dynamic language lovers:\n\nWe have released [Pharo](https://pharo.org/)
    version 14!\n\n## What is Pharo?\n\nPharo is a pure object-oriented programming
    language and a powerful environment focused on simplicity and immediate feedback.\n\n![Screenshot
    of Pharo 14](/news/Pharo14.png)\n_Screenshot of Pharo 14_\n\n- Simple & powerful
    language: No constructors, no types declaration, no interfaces, no primitive types.
    Yet a powerful and elegant language with a full syntax fitting in one postcard!
    Pharo is objects and messages all the way down.\n- Live, immersive environment:
    Immediate feedback at any moment of your development: Developing, testing, debugging.
    Even in production environments, you will never be stuck in compiling and deploying
    steps again!\n- Amazing debugging experience: Pharo environment includes a debugger
    unlike anything you've seen before. It allows you to step through code, restart
    the execution of methods, create methods on the fly, and much more!\n- Pharo is
    yours: Pharo is made by an incredible community, with more than [X] contributors
    for the last revision of the platform and hundreds of people constantly contributing
    with frameworks and libraries.\n- Fully open-source: Pharo full stack is released
    under [MIT](https://opensource.org/licenses/MIT) License and available on [GitHub](https://github.com/pharo-project/pharo)\n\n...
    more on the [Pharo Features page](http://www.pharo.org/features).\n\nIn this iteration
    of Pharo, our efforts have concentrated on three main areas:\n\n- **Modernizing
    the development tools.** We introduced Mission Control and Pulse (the replacement
    for Spotter), reworked the Method Browser and rewrote the Settings Browser, and
    consolidated Epicea and ProfStef into NewTools. This continues our ongoing migration
    of the development tools to the Spec-based tooling stack.\n- **Rebuilding the
    refactoring and command infrastructure.** Refactoring commands were migrated to
    a driver-based architecture behind a unified command registry, and we kept expanding
    Pharo's command-line capabilities (command-line testing, a command-line debugger,
    and Sindarin script tooling).\n- **Modernizing the virtual machine.** We unified
    frames and stack management, added RISC-V JIT support, extended memory management
    (direct old-space allocation and GC improvements), advanced Slang/C compilation,
    and modernized the cross-platform build infrastructure.\n\nWorth noting: starting
    with this release, we have moved our release schedule from spring (March–May)
    to fall (September–November). Pharo 14 is the first version released under the
    new schedule.\n\nSome highlights of this amazing version:\n\n## Highlights\n\n###
    Tools\n\n- Introduction of Mission Control\n- New/reworked Method Browser\n- Settings
    Browser rewrite and switch to default\n- Epicea migration into NewTools\n- ProfStef
    migration into NewTools\n- Introduction of Pulse (Spotter replacement)\n- TestRunner
    integration and command-line testing\n- Calypso fixes\n- Cavrois / window profile
    work\n- File Browser, Finder and Transcript improvements\n\n### System\n\n- Refactoring
    command migration and registry\n- Scoped extensions and selector semantics\n-
    Clean blocks and debugger/evaluation behavior\n- ClassBuilder, trait and superclass
    correctness\n- Compiler API split and method installation\n- UnifiedFFI value
    holders, `FFIMethod`, callbacks and bootstrap resets\n- Command-line debugger\n-
    Debugger / client-model cleanup\n- Package/baseline modularization and bootstrap
    dependency cleanup\n- Morphic / UIManager dependency reduction\n- FastTable, text,
    graphics, Zinc and Zodiac fixes\n- Sindarin script tooling\n- Code editor / code
    presenter work\n- List, tree and filtering behavior\n- Dialog, window and modal
    behavior\n- Action/command enhancements and cleanup\n- Morphic backend and layout
    fixes\n\n### Virtual machine\n\n- Frame unification and stack management improvements,
    delivering substantial interpreter and execution engine cleanups\n- RISC-V JIT
    support, expanding platform coverage and future-proofing VM development\n- New
    memory management capabilities, including direct old-space allocation and numerous
    GC and allocation improvements\n- Extensive compiler and Slang/C translation work,
    with many correctness fixes, new tests, and improved inspection tools\n- Platform
    and build modernization, including SDL updates, improved CI, cross-build support,
    and updated third-party dependencies\n- Large-scale cleanup and refactoring efforts
    across the VM, interpreter, Cogit, PICs, and infrastructure\n\n## Development
    Effort\n\nThis new version is the result of 978 Pull Requests integrated just
    in the Pharo repository.  \nWe have closed 616 issues since Pharo 13.  \nThe project
    now counts 432 forks and 1,494 stars on GitHub.  \nWe also have a lot of work
    in the separate projects that are included in each Pharo release:\n\n- [https://github.com/pharo-spec/NewTools](https://github.com/pharo-spec/NewTools)\n-
    [https://github.com/pharo-spec/Spec](https://github.com/pharo-spec/Spec)\n- [https://github.com/pharo-vcs/Iceberg](https://github.com/pharo-vcs/Iceberg)\n-
    [https://github.com/pharo-graphics/Roassal](https://github.com/pharo-graphics/Roassal)\n-
    [https://github.com/pillar-markup/Microdown](https://github.com/pillar-markup/Microdown)\n-
    [https://github.com/pillar-markup/BeautifulComments](https://github.com/pillar-markup/BeautifulComments)\n-
    [https://github.com/pharo-project/pharo-vm](https://github.com/pharo-project/pharo-vm)\n\n##
    Contributors\n\nWe always say Pharo is yours. It is yours because we made it for
    you, but most importantly, because it is made by the invaluable contributions
    of our great community (yourself).  \nA large community of people from all around
    the world contributed to Pharo 14 by making pull requests, reporting bugs, participating
    in discussion threads, providing feedback, and a lot of helpful tasks in all our
    community channels.  \nThank you all for your contributions.\n\nThe Pharo Team\n\n-
    Discover Pharo: [https://pharo.org/features](https://pharo.org/features)\n- Try
    Pharo: [http://pharo.org/download](https://pharo.org/download)\n- Learn Pharo:
    [http://pharo.org/documentation](https://pharo.org/documentation)\n\n26 October
    2026\n\n \\<-- [What people do with Pharo](/news/2026-10-10-PeopleDo.html)"
