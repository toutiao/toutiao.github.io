    &gt; [code below]<p><pre><code>    let dyn_array = fn (erased t : type) -&gt; record { len : int @@ dynamic, data : pointer(array(len, t)) }
    </code></pre>
    Yes, but array(len, t) has a dynamic layout. Your system needs to understand that that is OK because `pointer(array(len, t))` still has a static layout. You need to understand that pointee-monomorphization is not necessary. You can do special hacks for the `pointer` type constructor, but then you cannot eta-expand it (i.e. wrap in a one field struct). To make this work in a first-class way, so custom data types can have type parameters that do not need to be monomorphized, you need your type system to be layout-aware.<p>Also, you can do<p><pre><code>    let dyn_array = fn (dynamic erased t : type) -&gt; record { len : int @@ dynamic, data : pointer(array(len, t)) }
    </code></pre>
    There is no need to force the element type to be static. The array itself doesn&#x27;t care. The pointee is already dynamic-layout either way.<p>&gt; [code below]<p><pre><code>    let vtable = fn (erased t : type) -&gt; record { print : pointer(t) -&gt; string, ... }

        let dyn_print = record { t : type @@ dynamic erased, vtable : pointer(vtable(t)), data : pointer(t) }
    </code></pre>
    The problem with this is that `vtable` is being called with a dynamic-erased argument, but it itself requires a static type. That means the whole thing is dynamic (well, depending on exactly how the modalities work). But do want to statically know it is a record with a print field, etc.<p>&gt; static layout would require parameterizing on the layout of t, so I see your point<p>:) See <a href="https:&#x2F;&#x2F;docs.rs&#x2F;stack_dst&#x2F;latest&#x2F;stack_dst&#x2F;" rel="nofollow">https:&#x2F;&#x2F;docs.rs&#x2F;stack_dst&#x2F;latest&#x2F;stack_dst&#x2F;</a> for example, which tries to hack it in Rust. It would be much nicely to do it safely!
