  text: 'That was basically Dennis Ritchies&#x27; proposal as well: Dennis Ritchie,
    Variable-Size Arrays in C, September 1990, <a href="http:&#x2F;&#x2F;jclt.iecc.com&#x2F;Jct22.pdf#page=5"
    rel="nofollow">http:&#x2F;&#x2F;jclt.iecc.com&#x2F;Jct22.pdf#page=5</a><p>IIRC,
    one of the problems there is how to generalize it to, e.g., struct members. (Maybe
    you can speak to that.) The approach adopted by C99[1], being based on dependent
    typing, was I think better conceptually. But despite dependent typing being awesome,
    it manifestly was and still remains a tough sell to compiler implementors, so
    VLAs&#x2F;VMTs have languished in C and have yet to be fully developed. I think
    I&#x27;d agree C would have been better off with the approach you suggest. Adoption
    likely would have been quicker, and it could have been implemented in full almost
    immediately.[2] The consolation prize is that <i>hopefully</i> C will soon see
    some progression on the VMT front, specifically the proposals under discussion
    on the committee for forward-referencing in function parameter VMTs and VMT struct
    array members. The final piece of that puzzle would be addressing the scary syntax
    for VLA passing, which feels error prone (C2y countof operator semantics help
    a little bit).<p>[1] Tom MacDonald, Variable Length Arrays, December 1989, <a
    href="http:&#x2F;&#x2F;jclt.iecc.com&#x2F;Jct13.pdf#page=67" rel="nofollow">http:&#x2F;&#x2F;jclt.iecc.com&#x2F;Jct13.pdf#page=67</a><p>[2]
    Ironically GCC already had nascent VLA support, which may have helped nudge the
    C99 committee toward that instead of adopting Ritchie&#x27;s approach. But the
    fat pointer approach has a more obvious and straight-forward implementation.'
