  text: 'I don&#x27;t think you want to avoid this complexity:<p>- OOP is existential
    types where the layouts share some sort of shared prefix (e.g. pointer to vtable,
    fields in common, etc.). To accurately model such things (and they occur in FFI),
    you need to separate types from layout, and hold the &quot;supertype&#x27;s layout&quot;
    fixed.<p>- A classic use-case of dependent types is dynamically-sized arrays,
    and &quot;tensors&quot;. When you have a pair (L: Nat, V: Pointer(Array(N, T))),
    you have a layout behind the pointer that is dynamic, but you don&#x27;t want
    to conflate this with arbitrary types of the pointee.<p>Failure to deal with this
    in fully generality will force you to go down Rust&#x27;s path of ad-hoc arrays
    and &quot;dyn trait&quot;, which is actually more complexity.'
