  text: |-
    I think those can be modeled without explicitly separating layouts from types (not that doing so is necessarily a bad idea).<p>For arrays:<p><pre><code>  let dyn_array = fn (erased t : type) -&gt; record { len : int @@ dynamic, data : pointer(array(len, t)) }
    </code></pre>
    For &quot;dyn trait&quot;:<p><pre><code>  let vtable = fn (erased t : type) -&gt; record { print : pointer(t) -&gt; string, ... }

      let dyn_print = record { t : type @@ dynamic erased, vtable : pointer(vtable(t)), data : pointer(t) }
    </code></pre>
    Both use dependent records and the dynamic modality I mentioned above. dyn_print doesn&#x27;t match C++ since it doesn&#x27;t inline the data, and giving that a static layout would require parameterizing on the layout of t, so I see your point. However, it might be fine to give dyn_print an &quot;incomplete&quot; layout that can only appear behind a pointer.
