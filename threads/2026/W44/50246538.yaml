  text: "&gt; Not entirely, since Syl uses static data to describe types&#x27; runtime
    layout. Allowing dynamic there would require overhead (e.g. a uniform representation).<p>This
    is where it is crucial to distinguish types from layouts. &quot;uniform representation&quot;
    means the layout is static while the type is dynamic. But this isn&#x27;t an overhead
    in the sense of dynamic checks or lack of erasure.<p>Having static (erased) layout
    parameter and dynamic (erased) type parameter is the fully-general solution: monomorphization
    per <i>layout</i>, not type. And the <i>caller</i> decided whether to thread a
    layout parameter, or fix a single layout."
