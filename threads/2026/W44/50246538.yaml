    You&#x27;ve exactly described the answer, but to people who don&#x27;t know much about dependent types, this may be a little unclear.  The point is that there are two sorts of dependent types.<p>When people who don&#x27;t know much about them think of dependent types, they are probably thinking of functions, which can take a value on the left hand side to be used in the type on the right.  Confusingly, these are normally called &quot;dependent products&quot; in the type theory. However since this is confusing and they are generally written with a capital Pi, they are often just referred to as &quot;Pis&quot;.  For example<p><pre><code>    Pi x:nat . Vec x string
    </code></pre>
    is a function that takes a nat (non-negative number) and returns a Vector whose length is that nat and which is encoded in the type.<p>On the other hand, you are talking about pairs (confusingly: &quot;dependent sums&quot;, here &quot;sum&quot; being something like a union&#x2F;enum in type theory), often called &quot;Sigmas&quot;.  These are pairs (2-tuples) of values in which the type of the second value depends on the value of the first.  So, your example, a pair where the vector length is held in the first element and the vector itself in the second. In this contrived example, Vector may not know its own length at runtime, so we need to package them up together.<p><pre><code>        Sigma x: nat . Vec x string
    </code></pre>
    These are both &quot;dependent types&quot;, but people who are only passingly familiar with them might mostly know about the first.<p>(Why are functions &quot;dependent products&quot; and pairs &quot;dependent sums&quot;? I&#x27;ve never understood this but I&#x27;ve heard hand-wavy explanations that infintitary products are functions and infinitary sums are products ¯\(ツ)&#x2F;¯)
