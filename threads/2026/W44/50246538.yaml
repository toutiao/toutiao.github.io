  author: n923263
  text: Pairs in general (ie binary products) are always sums. A pair type `X * Y`
    is a multiplication, which is equivalent to `enum {Y y_x0,Y y_x1,Y y_x2,...}`
    or `Y + Y + Y + ...`, effectively a sum type where the descriminant of the enum
    is a X, and each case of the enum contains a Y. This is equivalent to how 3 *
    7 = 7 + 7 + 7, where you have three terms of size seven.<p>Similarly, functions
    in general (ie (binary) exponentiations) are always products. A function type
    `X -&gt; Y` (or `Y ^ X`) is a exponentiation, which is equivalent to `struct {Y
    y_x0,Y y_x1,Y y_x2,...}` or `Y * Y * Y * ...`, effectively a product (or latent
    array) type where the index of the &#x27;array&#x27; is a X, and each element
    of the &#x27;array&#x27; is a Y. This is equivalent to how 7 ^ 3 = 7 * 7 * 7,
    where you have three factors of size seven. (Note that functions have the exponent&#x2F;argument
    first and the base&#x2F;result second.)<p>All of the above applies without dependent
    types. Dependent types let the `Y` type depend on <i>which</i> value of type X
    is involved. (That is, the Y <i>type</i> depends on the X <i>value</i>.)
