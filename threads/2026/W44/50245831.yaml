  author: dfabulich
  text: I didn&#x27;t say &quot;easy&quot; either, I said &quot;straightforward hard
    work.&quot;<p>What you&#x27;re doing is hard work, but it&#x27;s way more straightforward
    than building out CSS Tricks.<p>You&#x27;re a successful marathon runner. CSS
    Tricks will have to run a marathon with both legs tied together.<p>What makes
    your subject matter (LLMs) work is that it&#x27;s a very fast moving topic, much
    faster moving than CSS, so people come to you for news.<p>Plus, it&#x27;s difficult
    to test new models effectively, so people are looking for trusted names to do
    meta analysis, fast. Is the new OpenAI model better than Claude? Better how? Quality
    of output? Evaluated how? Even comparing <i>prices</i> can be difficult, as different
    models (at different settings) can generate different numbers of tokens (and different
    numbers of cached tokens) for the same tasks.<p>None of that applies to CSS Tricks.<p>CSS
    fundamentally <i>can&#x27;t</i> move that fast, as long as changes in CSS require
    Apple, Google, and Mozilla to all agree on standards. Hardly anybody needs to
    know about the latest CSS news. Mostly you only need to know about Baseline Widely
    Available CSS features, which are at least 30 months old by definition. And when
    you do learn about new CSS features, it&#x27;s usually pretty obvious (either
    to you or to an LLM) whether those new CSS features apply to something you&#x27;re
    working on.<p>It&#x27;s going to be very, very hard to keep CSS Tricks alive,
    even with a lot of hard work.
