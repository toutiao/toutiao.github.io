  author: grahamburger
  text: I run a similar-in-spirit site about starting from scratch on a project and
    getting to something functional. I tried both ads and courses, in my case neither
    were very successful. The most success I had was in offering to do the things
    the site tells you how to do in exchange for money. That&#x27;s been my full time
    job for the last 6 years. I don&#x27;t know if that&#x27;s workable in the UI&#x2F;UX
    world.<p>I&#x27;ve done only a small amount of web-design work over the years,
    but I can imagine that, if I landed on CSS-tricks trying to work out a tricky
    (to me) CSS or usability problem where LLMs had been failing me, and I had a quick
    and easy option to pay a few hundred dollars and meet with the guy who wrote the
    book, I might do that. That&#x27;s also how I got a lot of my first customers
    in my current business; I offered paid phone calls where a user could pay a nominal
    rate and ask some upfront questions about a project they were working on. Many
    of those calls turned in to longer contracts, and the fee kept out the folks who
    were just looking to sell me something.<p>A lot of my customers have been organizations
    whose focus is not my industry, but, for one reason or another, they needed something
    done that fits in my wheelhouse. This means they don&#x27;t (yet) want to hire
    this expertise and build processes internally, so they&#x27;re willing to pay
    my premium rates. Perhaps there is a way to target these types of companies with
    custom services in the space.
