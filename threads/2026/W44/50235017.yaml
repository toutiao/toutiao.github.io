  author: lukaslalinsky
  text: My biggest advice is to keep programming for fun. I don&#x27;t know what do
    you do at work, but for me work was never the satisfying activity what I started
    programming for. Pretty much all the problems at work were obvious and just needed
    the code written. But outside of work, you get to experiment, you get to learn,
    solve challenges. I started programming because I was fascinated by how what we
    learn at math class (trigonometry) can be used to display things on the computer
    (old 8bit one). Then I rented all the books from the local library and studied,
    even though I didn&#x27;t have a computer at home. And this kind of kept me going.
    I always had a personal project which can occupy my head, and in the past, when
    I got home, I could try to write the ideas into code. These days, I use the agents
    for the last step, but that step was never the fun part for me, it was the thinking
    and &quot;connecting the dots&quot;.
