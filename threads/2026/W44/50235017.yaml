  author: chr15m
  text: Conan the Barbarian and Below the Root on our Apple IIe. Tiny worlds behind
    the glowing Orange CRT. How do I make something like this? My mum (lol) helped
    me figure out how to get keyboard input in BASIC. I made a little game where an
    O character chases your X character around the screen. Core game loop. Browsing
    pirate CGA games at the warung in Pondok Indah, well outside the jurisdiction
    of US law. Glorious rack upon rack of tiny worlds to explore. Death Track and
    Prince of Persia. More BASIC and that gorilla throwing bananas. Later on the Multiline
    BBS. Talking late into the night with tech weirdos twice my age. All manner of
    mind bending ideas. Newsgroups. Punks and skaters and cypherpunks. Predicting
    what was coming, seeing the future we expected unfolding. Downloading Commander
    Keen over FTP. WinSock and Netscape. My first homepage. Downloading Linux and
    getting it running. Configuring XFree86 modelines all night lol. Turbo Pascal
    and VAX VMS at uni. My first job coding. Hacking out web backends in gnarly ass
    Perl. No databases just blatting and slurping comma delimited text files lol.
    Getting paid to do the most exciting thing there was to do, all day. Magic.
  score: 0
