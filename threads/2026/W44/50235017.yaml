  text: I took a course at a college in &#x27;79 using fortran on a mainframe (though
    I was just in middle school at the time).  I can&#x27;t say I understood all of
    the incantations required (IBM had JCL), but realized it was &quot;magical&quot;
    and wanted to be part of this tribe.<p>I saved up to buy a VIC-20 (a 4K computer)
