  author: alfiedotwtf
  text: Ever since I started dabbling as a kid, programming has been my hyperfocus,
    so it’s hard to give advice if you’re not coming from angle.<p>I also found that
    my brain has treated problem solving and building in general like gaming where
    every roadblock&#x2F;problem&#x2F;issue is like a level boss, and release to production
    is when you clock the game :)<p>So even if you’re spending 99% of your time in
    an agent cli rather than your editor, look at the problem you’re working on as
    a problem in itself and your task is to golf it - but as in one-shot prompts,
    but how can you do it to the best of your ability with sharp prompting.<p>But
    yeah, like a sibling comment said - keep it fun. I think if you get to serious
    then it takes the fun out of it… you’re no longer problem solving, you’re just
    stepping through the motions.<p>Oh… and also - treat everything like a learning
    experience and with the fascination like discovering Narnia... because If you’re
    not learning&#x2F;growing&#x2F;stressing even just a little in your current job,
    move on! You’re not doing yourself any favours staying stagnant… or maybe that’s
    terrible advice and I’m just addicted to constant fight-or-flight, high cortisol,
    and caffeine
