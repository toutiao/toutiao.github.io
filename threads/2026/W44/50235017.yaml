  author: crypto137
  text: I remember my first job out of uni, I had to convert what I thought was 2000
    files from an old php site to gatsby. Mainly taking the page dump data and turning
    them into Yaml pages for static generation. It took me DAYS.<p>Last day, I realize
    it wasn&#x27;t 2000. It was 8000, and there was not a snowballs chance in hell
    I could do the remaining 6000 in time for the deadline. So I went online, found
    pieces on stack overflow for this disgusting nodejs script that was 8 for loops
    deep, and then ran it against all the files. It took like.... a second, and all
    the files were just done. Poof, instant.<p>I got a job as a programmer and never
    looked back. The last ~decade has been a wild ride of highs and lows, but I still
    love doing it every day. There&#x27;s just something deeply satisfying of taking
    an idea, and the computer just <i>doing</i> it.
