  text: I agree with the framing but the claim is too strong.<p>I don&#x27;t think
    Grassmannian manifolds are necessarily a better representation than simple query&#x2F;key
    inner products. It&#x27;s a valid solution, and it does have advantages in some
    cases.<p>The Grassmannian is only preserving the subspace orientation, so we lose
    information about the actual linear map and basically throw out its basis.<p>Like
    everything, this is a trade off. You&#x27;re trading information for a lower rank
    representation.<p>I&#x27;m still reading through the paper on the implementation
    side, but the other caveat I&#x27;d be wary of is compute. Does this projection
    add MACs to the overall model which would make inference slightly slower even
    with lower rank representations? I don&#x27;t know. Like with any technique that
    trades constrained information representation for space&#x2F;compute you _are_
    widening your search space during training. I&#x27;d be curious what the impact
    of this is on relative data needed to train a model using this architecture versus
    &quot;regular&quot; attention.
