  author: dannyw
  text: Pretty much. See “Scaling Laws for Neural Language Models”, a must read IMO
    <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;2001.08361v1" rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;2001.08361v1</a><p>Compute,
    data, and parameter count are the three logarithmic values that correspond to
    model performance.<p>So if you find ways of improving training efficiency (the
    simplest conceptually is probably local&#x2F;global sliding window attention like
    Gemma; the latest DeepSeek and Kimis have quite fancy ones), you will be able
    to have more effective compute, and train smarter models while keeping data and
    param count the same.<p>If you find this fascinating and want to dive more, I
    encourage checking out nanochat (solid GPT-2 repro; minimal LoC); and trying to
    make architectural tweaks with a coding agent.<p>“Learning through experimentation”
    has never been easier or more fun in my opinion. If you have a GPU, even an older
    8GB card (or a few bucks for Runpod), you can pretrain your own small language
    model and start experimenting &#x2F; tweaking it.
