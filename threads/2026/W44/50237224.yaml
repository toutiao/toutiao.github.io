  author: api
  text: The simple explanation is that von Neumann architecture sucks for intelligence.
    It&#x27;s not a von Neumann machine at all. It&#x27;s an analog neural network
    (plus other systems in operation) with colocated memory.<p>A more far-out explanation
    is that some form of stochastic quantum computing is going on, which has been
    proposed at many levels by biologists. There&#x27;s some work being done on this
    idea. It would not be the discrete qubit form we are trying to do, which is impossible
    in a noisy wet environment, but something analog and stochastic.<p>Both are possible.<p>Also
    note that our current chips, in spite of the tiny feature sizes and a ton of optimization
    work, are <i>not even close</i> to the lower limit for energy cost of computation.
    They still are not very efficient.
