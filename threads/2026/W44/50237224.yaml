  author: hasley
  text: I am not against some kind of &quot;public review&quot; and I really like
    arxiv.org. But I do not see it as a replacement for a peer review. It may start
    after a peer review when the paper is published, which IMHO should almost always
    be in an Open Access way.<p>For AI, the borders seem to have blurred a bit between
    academic scientists (e.g. at universities) and external scientists at companies
    or even private people). The problem with the latter is that it is much harder
    to enforce good scientific practice. Think only about the time it takes to write
    the state of the art of an ordinary conference paper.<p>I am also a bit drawn
    between giving everyone the chance to contribute to research and ensuring good
    scientific practice. Just writing down your latest ideas and successes is not
    the same as writing a scientific paper that shows the research in the context
    of past research and needs, for instance, to be much more mathematically rigorous.
