    your business and it is way above your pay grade. A junior engineer is the one
    that does what is asked to do, in the best way possible. A senior engineer is
    at the border to business impact, maybe, but even then the lead engineer for the
    rocket engines at SpaceX is not responsible of the business impact of the company.<p>But
