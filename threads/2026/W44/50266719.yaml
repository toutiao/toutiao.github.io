  author: lubujackson
  text: I have, and it is surprisingly straightforward.<p>Find an easy to understand
    product, like a step above a todo list app. Share a spec and have them code it
    in their own IDE using LLM. Focus on speed. Then have them extended it, adding
    some features. Then ask them to show you where certain functionality exists in
    the code and to explain the architecture of how it is built. Ask them where it
    is weak and could be improved.<p>That&#x27;s it, that&#x27;s the interview. SWEs
    are getting quite good at the prompting, but fast navigation and understanding
    of the code is the key.<p>Anyone that can effectively translate a spec to code
    with minimal handholding shows product awareness. Anyone who can produce a working
    app can prompt AI reasonably. Anyone who can revise their design on the fly to
    support new features is someone with flexible thinking and some humility. Anyone
    who can navigate and explain what AI built is someone that understands how to
    build a mental map of a codebase. Anyone who can do all of this in an interview
    is someone who can handle pressure, work quickly and communicate.<p>You are welcome
    to keep trotting out linked list traversals and sliding window problems if you
    like, but leetcode is now (and maybe always has been) about culture fit more than
    an ability to build software.
