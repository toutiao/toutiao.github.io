  text: The heart of the coding interview is to get signal on a  candidates’ ability
    to solve a problem without all of the inputs given to them, see how they and explain
    their thought process as they do it.<p>Because of AI, what it means to “not have
    all of the inputs” has changed as anyone can cut and paste a Leetcode problem
    to a chatbot and solve it.<p>I think we are going to iterate a bit to figure out
    a better signal than the typical coding interview. For junior engineers, I think
    coding questions will move towards MBA style problems when someone is given more
    of an open ended question with a codebase and you see what the candidate does
    without context to reduce the problem.
