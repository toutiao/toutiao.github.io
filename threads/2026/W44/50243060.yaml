  author: Aurornis
  text: "&gt; Big issue though is knowing that even if I pay someone 2x the going
    rate for an employee it still will not be a living wage.<p>Being mindful of wages
    is great, but eventually you have to accept that creating a job at a less than
    ideal wage is better than not creating any job at all. If the pay is not enough
    then you’ll get the signal through being unable to hire because workers are taking
    better paying jobs.<p>An unintuitive feature of the job market is that creating
    more low paying jobs actually puts upward pressure on wages. Ideally the low end
    of the job market should be saturated with job opportunities, which creates a
    situation where employers have to compete with each other to raise wages to find
    and retain employees, which means pay goes up for everyone.<p>So don’t let worries
    about not being able to pay as much as you’d like get in the way of paying anyone
    at all. The alternative (less jobs, more outsourcing) is worse in every way."
