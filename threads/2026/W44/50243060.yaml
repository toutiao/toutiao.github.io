    I work on every step from design through packaging (janitor&gt;CEO).  There is
    not enough money to pay a living wage for others...so I end up doing everything
    myself.  70hr weeks are not uncommon.  (I also cook my own meals, fix my own car
    and bake my own bread...otherwise I would not make it)<p>If you have not been
