  content: "# AI Isn't Replacing SREs. It's Deskilling Them.\n\n### When AI handles
    95% of your incident response, do you get worse at handling the 5% that actually
    matters?\n\n[\n\n](https://substack.com/@elizabethmathew21)\n\n[Elizabeth](https://substack.com/@elizabethmathew21)\n\n>
    \U0001F48C _Hey there, it’s Elizabeth from SigNoz!_\n> \n> _This newsletter is_
    a_n honest attempt to talk about all things - observability, OpenTelemetry, open-source
    and the engineering in between!   \n> &  \n> This piece took 6 days, 5 hours to
    be cooked, hope we served._ \U0001F31A\n\nThere are two popular prophecies floating
    around tech circles these days.\n\nThe first says **[SRE is the future of all
    software engineering](https://swizec.com/blog/the-future-of-software-engineering-is-sre/)**,
    that as AI writes more and more code, the humans who remain will be the ones keeping
    systems alive. The second says AI will devour every tech job alive, SREs included.
    Neither is particularly useful if you’re an SRE trying to figure out what your
    Tuesday will look like in 2027.\n\nLet’s ask a more grounded question by looking
    at what’s already happening: When AI handles 95% of your incident response, do
    you get worse at handling the 5% that actually matters?\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!Hgvq!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F530d847f-26cb-4ddd-a6de-875cbbaf8fab_6233x4167.webp)\n\nMost
    of us already use AI for our daily work (our brains a little fried!), and so do
    SREs. Today’s discussion agenda is not whether AI replaces SREs, but whether AI
    is quietly making SREs less capable and whether anyone will notice anything before
    the next novel outage hits. The foundational framework for this entire debate
    comes from a 1983 research paper that’s eerily prescient.\n\n### The Ironies of
    Automation: Part-I\n\n* * *\n\nNote from author: Below is a brief precursor to
    History of Automation, which you might enjoy if you are into History and Cultures
    (like me \U0001F609).\n\n* * *\n\nIn 1983, a cognitive psychologist named Lisanne
    Bainbridge published a paper called _**[Ironies of Automation](https://www.semanticscholar.org/paper/Ironies-of-automation-Bainbridge/0713bb9d9b138e4e0a15406006de9b0cddf68e28)**_.
    It became one of the most cited papers in human factors research, and its core
    argument is almost uncomfortably relevant today.\n\nBainbridge studied what happened
    when factories and industrial systems automated the work of blue-collar operators.
    The findings were paradoxical and revealed that the more you automate a process,
    the more critical the human operator becomes during the rare moments automation
    fails and the less practice they get, and the worse they become at exactly those
    interventions. Automation, which was inherently designed to remove humans from
    the loop, left them with the worst possible job, i.e., long stretches of passive
    monitoring punctuated by rare, high-stakes crises they were increasingly unprepared
    for.\n\nRing any bells yet? \U0001F642\n\nBasically, I’m drawing a parallel between
    the AI revolution and industrial automation. Industrial automation reshaped blue-collar
    work by taking over routine physical tasks, and the workers who remained had to
    handle exceptions they’d lost the muscle memory for. AI is doing the same thing
    to knowledge workers by taking over the routine cognitive tasks, the pattern matching,
    the triage, the known-issue resolution and leaving humans with the rare, complex,
    ambiguous problems.\n\nThe _exact_ problems that require deep _expertise_, the
    _exact expertise_ that atrophies when you stop practising.\n\nNow we’re replaying
    this pattern with AI agents, and the stakes in software systems are only growing.\n\n##
    Current State of AI in SRE\n\nLet’s take stock of where things stand today in
    the world of site reliability engineering.\n\n### **What’s already automated or
    heavily AI-assisted?**\n\nAlert noise reduction and intelligent grouping, runbook
    execution for known issues, log pattern detection and anomaly flagging, and basic
    root-cause suggestions from historical incident data, and auto-remediation for
    well-understood failure modes like restarting a crashed pod or scaling up a service
    that’s running hot, are all fairly automated today.\n\n### **What’s on the horizon?**\n\nSome
    immediate targets include multi-signal correlation across metrics, logs, and traces,
    autonomous root-cause analysis for partially understood failures, predictive incident
    detection before users are affected, AI-driven change risk assessment and automated
    rollbacks.\n\nPagerDuty frames this as a tiered model.\n\n- Tier 1 incidents:
    Known issues with known fixes get fully automated.\n\n- Tier 2 incidents: Partially
    understood problems receive AI recommendations with human validation.\n\n- Tier
    3 incidents: Novel, complex, cascading failures stay human-led, with AI providing
    supporting context.\n\nBut here’s the catch.\n\nIf _human_ SREs (okay, now we
    have to use adjectives like human \U0001F979) only engage with Tier 3 incidents,
    i.e. the novel, never-before-seen outages, where do they build the _intuition_
    to handle them? Intuition is usually developed from years of hands-on incident
    response, pattern recognition built through repetition, and the kind of gut-level
    understanding of a system that only develops from painfully waking up at the odd
    hour to solve the bug that brought the system down.\n\nSubscribe if you wish to
    read some more hot takes. We are cooking some great ones!\n\n## The Crisis of
    Deskilling\n\nThis is where the picture starts getting blurry. Let’s look at some
    emerging research on AI-induced deskilling across multiple fields, which paints
    a consistent and concerning picture.\n\nIn medicine, a [recent study](https://www.thelancet.com/journals/langas/article/PIIS2468-1253(25)00133-5/abstract)
    found that endoscopists who used AI assistance for polyp detection saw their unassisted
    detection rates drop from 28% to 22% after a period of AI use. They got worse
    at the thing they were supposed to be experts in, not because they forgot the
    theory, but because they stopped exercising the skill.\n\nIn aviation, [research](https://flightsafety.org/wp-content/uploads/2019/12/IASS_2019_Behrend_Lafargue.pdf)
    has shown that long-haul pilots who rely heavily on autopilot systems experience
    measurable degradation in situational awareness and manual flying ability. The
    problem got serious enough that the FAA now mandates more manual flying time to
    counteract the effect.\n\nSomewhere over the past year, AI stopped being a tool
    I occasionally reached for and became the first thing I reach for, _always_. My
    instinct now is to offload as much as possible and apply my own thinking only
    where it’s absolutely unavoidable. The problem is that these moments are becoming
    the only exercises my brain gets, and I can feel the _rust_.\n\nWe can draw a
    pattern here. The more you let the system handle, the worse you get at handling
    things yourself and here’s the truly dangerous part, _you don’t feel it happening_.
    It gets masked as hyper-productivity. Cognitive research suggests that because
    AI tools make tasks feel easier and enhance visible performance, users are often
    unable to accurately judge the true status of their own skills. You feel competent,
    dashboards look green, and then on a Wednesday, a novel incident hits that doesn’t
    match any pattern the AI has seen, and you realise the muscle has atrophied.\n\nFor
    SREs, this manifests in specific ways, like we stop reading raw log streams because
    the AI summarises them, we stop forming hypotheses during incidents because the
    AI suggests root causes, we stop building mental models of system architecture
    because the AI maps dependencies for us, and each of these individually looks
    like a productivity win. Collectively, they hollow out the very expertise that
    makes an SRE effective when things go sideways in ways nobody anticipated.\n\nBut
    there’s something even more concerning than deskilling, and researchers have started
    calling it _never-skilling_. Deskilling means you once "
