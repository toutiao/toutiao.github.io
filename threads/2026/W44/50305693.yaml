  author: tamimio
  text: Nice video, but I have said it before, the difference between just “vibe coding”
    and reliably using AI is the specs you need to write first and the tests after.
    If you start prompting the end goal&#x2F;s the AI will basically guide you on
    what needs to be done and you just accept it as long as it runs, and this is following
    what most software developers were doing before LLM, the agile way, the quick
    ship way, the daily standup and ship first discus later way, the code pairing
    way, which worked mostly (even though I hated personally) in teams, so these developers
    are replacing what they were used to do with an agent and that’s the mistake.
    However, if you go with traditional engineering ways, waterfall, specs based,
    blueprints, and then tests, you control the agents and guide them not the other
    way around, in your specs you define the tiniest possible thing to what library
    to be used or excluded, the methods and approaches, among others, the agent here
    will produce the syntax and help you in the tests, just like in other engineering
    aspects how machines didn’t take over, they follow your specs and frameworks.
    The syntax is the past, AI can produce better syntax than any human alive or all
    combined, if you think otherwise you are delusional and still didn’t move on,
    it’s time to stop the “developer” mindset and do the engineering one.<p>I personally
    have a project that have been spending 2 months now making the specs and blueprint,
    more than 1000 files defining every bit including the future features too, and
    not a single code has been written yet, later, an agent will use this to produce
    the syntax and all the needed tests to have exactly what’s been needed.
