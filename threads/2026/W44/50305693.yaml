  text: It&#x27;s not that crashes don&#x27;t happen, it&#x27;s just that they don&#x27;t
    &quot;randomly&quot; happen. The error codes from bad hardware are predictable
    (against kernel bugs... well I use an &quot;allnoconfig&quot; kernel, which disables
    like 95% of the kernel). Bad hardware, bad network, bad RAM, all of these are
    simulateable in QEMU or Linux (tc netem &#x2F; blkdebug).<p>If I count my test
    suite for the ISO, I have ~2500 unit tests (placement groups tests, Raft behaviour
    tests, disk perf tests, SigV4 crypto tests, DHCP tests, kernel rollback tests),
    ~110 fault-injection tests (latency, network, RAM), ~60 block-store failure tests
    (e.g. network interrupt while two disks try to sync), &quot;chaos tests&quot;
    (generating random event scenarios for an hour), bit flip tests, &quot;fsync lies
    to me&quot; tests, power cut tests, round-trip tests, &quot;power cut while in
    the middle of sync between datacenters&quot;,  SMART degradation tests, load tests,
    memory pressure tests, file descriptor resource starvation, NTP drift tests, metadata
    DB loss tests, DNS failover, ....<p>Then for security everything is turned off,
    kernel modules are off, eBPF is off, io_uring is off (lots of CVEs), user namespaces
    are off, most network and file drivers are off, &#x2F;bin&#x2F;sh is off, S3 endpoint
    is minimal, etc.<p>Most rules from aerospace are said to be &quot;written with
    blood&quot;, some crash caused this rule to be legalized. But with ~40k lines
    you can go through each line and say &quot;what if this fails&quot;. With a kubernetes
    cluster it&#x27;s more or less based on hope and happy-path testing.<p>I also
    scraped other competitors for user complaints, esp. about data loss &#x2F; sync
    engine bugs and in total I now have about 4000 tests for 40k lines of backend
    code and another ~1000 tests for the 15k lines for the sync engine code (about
    1 test for every 15 lines).<p>I&#x27;m still not entirely confident (still need
    lots of beta testing), but a chance of data loss of .01% would be pretty high.
    It really depends on the amount of testing whether you need an on-call person
    at all and most orgs are more engineered towards &quot;just hire someone to be
    on-call&quot; rather than doing proper testing.
