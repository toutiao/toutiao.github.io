  author: fschuett
  text: 'On-call problems are mostly just a result of Kubernetes&#x27; &quot;cattle
    not pets&quot; brainrot ideology where people throw local simulate-ability out
    the window because the Rube-Goldberg web of pods and operators and cluster state
    gets too complex to simulate locally or keep in your head (esp. if code is located
    in 50+ microservice repos).<p>Machines (esp. Virtual Machines) are ultimately
    predictable and crashes don&#x27;t &quot;just randomly happen&quot;. But it&#x27;s
    what this entire &quot;enterprise cloud&quot; culture has brought in, the idea
    that it&#x27;s impossible to simulate all possible failure conditions of a cluster
    locally and therefore we shouldn&#x27;t even try doing it. Maybe that&#x27;s true
    at Google scale, but most companies are simply not, not, not Google-scale.<p>As
    a counter-example, I recently built a simple &quot;cloud storage&quot; system
    with a minimal Linux ISO: everything is stripped down to the absolute minimum
    to just boot, start a minimal S3 server and pull (encrypted and signed) update
    commands from an SQL &quot;control plane&quot; database. The entire userspace
    is ~50k lines of Rust (minus 10k init system) and I can simulate the entire VM
    locally and play with the &quot;cluster&quot; of VMs locally. The ISO is ~20 megabytes
    large and I can simulate entire datacenters &quot;burning down&quot;, virtually,
    locally, before it happens for real. I can simulate everything: network failures,
    disk failures, slowdowns, latency, try getting Fable to hack it, etc.<p>But in
    the kubernetes &quot;enterprise&quot; world, I can&#x27;t do any of this. First
    I need 10.000 values.yaml files, 10 add-ons for logging and metrics (because pushing
    metrics to some collection endpoint over HTTP is clearly PhD level complexity)
    and on top you need a service mesh to restrict random containers talking to each
    other because nobody knows anymore what services can talk to which other services.
    The results are constant outages because of misconfigurations and someone having
    to be on-call at all time.<p>Needing on-call at all (except for maybe security
    alerts, but those are usually not part of DevOps) is the result of this Google-influenced
    &quot;crashes just happen&quot; nonsense where &quot;manager&quot; culture is
    preferred over results (aka uptime).'
