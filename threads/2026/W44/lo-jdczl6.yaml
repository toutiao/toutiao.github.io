  content: "[![conference logo](https://static.media.ccc.de/media/events/matrix-conf/2026/logo.svg)](/c/matrix-conf-2026)\n\n#
    A vision for a next-generation timeline\n\n[Jade](/search?p=Jade) and[Ginger](/search?p=Ginger)\n\n[Sofya](/c/matrix-conf-2026/Sofya)[Next
    Gen Spec](/c/matrix-conf-2026/Next%20Gen%20Spec)Playlists:['matrix-conf-2026'
    videos starting here](/v/matrix-conference-2026-99070-a-vision-for-a-next-generation-timeline/playlist)/[audio](/v/matrix-conference-2026-99070-a-vision-for-a-next-generation-timeline/audio)\n-
    20 min\n- 2026-10-21\n- 739\n- [Fahrplan](https://cfp.2026.matrix.org/matrix-conference-2026/talk/WRGTRX/)\n\nThe
    timeline is the most interacted-with piece of any chat software. It's where messages
    live! It's hard to have a chat app without one.\n\nUnfortunately, the matrix protocol
    has... compromises... in the timeline made for the sake of federation. From the
    incosistent ordering between sync and history on Synapse, to the inability to
    jump to pinned messages from before you joined, to the mystery of what happens
    when you join a room your server previously left.\n\nThe good news is we have
    a solution! The bad news is it's gonna take a while. This talk is a rundown of
    every step needed to get a next-generation timeline. I'll explain stitched ordering,
    timeline fragments, and why we need state DAGs.\n\nLicensed to the public under
