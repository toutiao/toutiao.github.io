  text: 'My problem is with the epistemic claim. They say their understanding of mind
    and the cosmos is verified, tested through repetition and consultation over centuries.
    Sure, but a long, stable run for one small society in one mountain range is still
    a single data point. It proves their way works for them, there. It doesn&#x27;t
    prove it scales to 8 billion people, and it doesn&#x27;t tell us anything reliable
    about physics or consciousness.<p>To be fair, they do say they aren&#x27;t telling
    anyone how to live. But calling yourselves the Elder Brother and telling the rest
    of the world it needs your help is a claim to authority. So what earns it? Being
    around a long time and getting a UNESCO listing isn&#x27;t the same thing as predictive
    power.<p>Side note: I&#x27;m fairly certain parts of the English were polished
