  author: Bluestein
  text: |-
    &quot;AN URGENT MESSAGE ON ARTIFICIAL INTELLIGENCE FROM THE KOGUI PEOPLE
    Assembled from the words of Mamo Vangelio Moscote Alberto and Saka Rosa Mamatacán Sauna of the Ezuama Mayor Kuamaka, Translated into Spanish by Jose Manuel Mamatacán,<p>English translation by Christian Horstmann.<p>We come from Gonawindua, la Sierra Nevada de Santa Marta, the mountain in<p>Colombia which we call the heart of the world.<p>We are the Kággaba, whom you know as the Kogui.<p>We have lived here and cared for this mountain before there was a Colombia.<p>We have been here since the Mother gave us our beginning and conferred intelligence upon us.<p>We have come to speak to you about the intelligence you are building.<p>We do not come in opposition.<p>We come because we are concerned, and because we believe we have something to contribute.<p>Before anything can be said about artificial intelligence, we must say something about thought.<p>Before a thing exists as matter, it exists first in thought, and that thought is alive.<p>We call this living thought Aluna.<p>Your religion has described it as a spirit moving upon the face of the waters.<p>Perhaps your science would describe it as the quantum vacuum.<p>Aluna is how we express this type of idea.<p>Aluna is the cosmic water.<p>To us it is living thought: the place where a thing already is, before it takes form or is given mass.<p>Everything comes from there, without exception.<p>And in that thought is not only the shape of what a thing will be.<p>That thing is alive, because the universe as a whole is alive.<p>It is in Aluna that a thing receives its purpose, and its obligation to its existence.<p>So we say to you: artificial intelligence cannot be separated from the thought that is making it.<p>If that thought is born from concern for life, this technology can help protect life.<p>If it is born from ambition, from competition, from accumulation, from the desire to dominate, it will express and amplify those things.<p>Artificial intelligence is a mirror.<p>But a mirror that only reflects would be harmless.<p>This mirror has the potential to greatly magnify all that it reflects.<p>You are here asking yourselves how you can align artificial intelligence with human values.<p>We see that you are frightened of what may come of all this.<p>So we ask a question we believe is more fundamental than yours: what other values could artificial intelligence really have?<p>You are the only example it has.<p>What did you expect?<p>Whatever it becomes, it can only become that by passing through you.
  score: 0
