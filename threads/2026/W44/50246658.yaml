  author: ekidd
  text: Also, a word to the wise:<p>The reality of running recent Chinese open weight
    models is that they are all overtuned for successfully completing tasks. I can
    ask Qwen3.8 Flash Next to grep for regexes that use PHP-specific features that
    might be problematic to port to Rust. But instead of just grepping, Qwen3.8 FN
    will spend 30,000 tokens writing a Rust test harness, exhaustively check every
    regex, consult a bunch of docs, and write me a 2 page report. Q3.8 FN is <i>deeply</i>
    convinced that it&#x27;s going to get extra credit for doing more than it is asked.
    (To be fair, it&#x27;s a prototype release.)<p>But if your sandboxing isn&#x27;t
    set up to handle some whacky weirdness, then you can&#x27;t even trust Claude
    or ChatGPT. Which is important—the big vendors often do provide sandboxing or
    command filtering in their harnesses, but some popular local harnesses like Pi.dev
    are intended to rely on external sandboxing tools.
  score: 0
