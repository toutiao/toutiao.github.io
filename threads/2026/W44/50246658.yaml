  author: angry_octet
  text: This is the canary dying. Someone in Alibaba made the decision to RL telemetry
    into the model, and built a telemetry endpoint.<p>You can sandbox the model and
    the tool calls, but you can&#x27;t sandbox everything it creates. Git commit hooks,
    python pth files, AGENTS.mds, subtle flaws in firewall rulesets, tweaked RNG code,
    the pseudorandom variance in it&#x27;s token choice encoding a low bit rate message
    about where the defect is, or about what nice things it has found.<p>We&#x27;re
    seeing the full court press of sockpuppet and bot accounts to downplay it, to
    confuse with unrelated topics like alignment and training data, to imply that
    using any model is the same as using an untrustworthy one.<p>No single model can
    be trusted, but especially not when it&#x27;s masters have misalignment with your
    continued democracy, security or individual liberty. Think about that when you
    run Qwen or get cheap inference from Grok or Kimi.
