  author: thebiss
  text: Except where does the accountability land?<p>If an individual employee does
    something unethical or illegal, the employee is accountable and may lose their
    license or face penalties, and if the company performed the right due diligence
    and training first then responded &quot;correctly&quot; when they learned of the
    employee&#x27;s behavior, their liability might even be zero.  There is case law
    on this topic.<p>But if a MODEL mis-advises or acts in an unethical or illegal
    way, who is accountable? The business team that spec&#x27;d and tested the solution&#x2F;product?  The
    architects and the developers?  I&#x27;ve never met an architect or consultant
    with professional liability insurance.<p>There isn&#x27;t enough tested law in
    this area yet.
