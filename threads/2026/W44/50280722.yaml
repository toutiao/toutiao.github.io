  author: zamalek
  text: 'File formats are the buffer issue honeypot. You may be aware of how often
    video and audio codecs have vulnerabilities - it&#x27;s nearly never the hand-tuned
    frame decode assembly (where you would think all the mistakes would be). It&#x27;s
    nearly always the thing that reads the metadata and encoded frames to memory.
    Binary formats have things like offsets in them, and those can be trivially used
    to overrun.<p>Same thing applies here. Even Rust has a crate for dealing with
    binary data, despite its memory promises: <a href="https:&#x2F;&#x2F;crates.io&#x2F;crates&#x2F;untrusted"
    rel="nofollow">https:&#x2F;&#x2F;crates.io&#x2F;crates&#x2F;untrusted</a><p>It&#x27;s
    a fucking minefield, and this is one area where the Rust zealots are undeniably
    correct. It doesn&#x27;t have to be Rust, any memory safe language will do, but
    Rust also happens to be performance competitive and that&#x27;s usually also desirable.'
  score: 0
