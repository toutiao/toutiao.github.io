  author: cowlevel
  text: Be careful to use the cryptographic one, not rand(3)<p>And if you&#x27;re
    a sysadmin, be extremely careful when generating keys in VMs or embedded devices.
    They tend to overestimate their entropy sources - it&#x27;s possible that every
    clone of a VM generates the same keys. In some cases (<i>cough</i> ECDSA) generating
    the same key <i>and nonce</i> to sign two different messages is catastrophic -
    it immediately leaks the private key.
