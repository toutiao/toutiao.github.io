  author: ThrustVectoring
  text: 'Human writers also use specific constructions for definite (though not always
    consciously known) reasons, and mapping those correlations onto writing models
    is only getting done on accident. This is a big part of why LLMs doing pointless
    negations (it&#x27;s not X, it&#x27;s Y) is so jarring: people use that construction
    in order to preempt an expected misconception, whereas LLMs try to use linear
    algebra over the learning corpus to generate it in appropriate quantities and
    places according to RLHF&#x2F;fine-tuning&#x2F;etc.<p>In other words, it isn&#x27;t
    just verbiage that has a &quot;preferred&quot; quantity, but also higher-level
    language features, and the appropriate contexts for those features feel like the
    sort of thing that will be extraordinarily difficult to replicate without a theory
    of mind.<p>edit after coming back and re-reading: the &quot;in other words,&quot;
    and rephrase is because I&#x27;m trying to explain something complex enough that
    I&#x27;m not even sure I fully understand it, so I try typing out multiple explanations
    and leave the ones that make the most sense to me. This might be idiosyncratic
    to my writing and not a significant feature of training corpuses, but even if
    it wasn&#x27;t it&#x27;s a second example of the sort of thing I&#x27;d suspect
    LLMs to be bad at using appropriately.'
