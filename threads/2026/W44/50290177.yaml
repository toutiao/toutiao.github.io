  author: martythemaniak
  text: 'I&#x27;ll repost a comment I made a while back describing the process I use,
    which I think balances AI in keeping your voice.<p>If you care about your voice,
    don&#x27;t let LLMs write your words. But that doesn&#x27;t mean you can&#x27;t
    use AI to think, critique and draft lots of words for you. It depends on what
    purpose you&#x27;re writing it for. If you&#x27;re writing an impersonal document,
    like a design document, briefing, etc then who cares. In many cases (scientific
    papers, legal documents) you already have to write them in a voice that is not
    your own. Go ahead and write these in AI. But if you&#x27;re trying to say something
    more personal then the words should be your own, AI will always try to &#x27;smooth&#x27;
    out your voice, and if you care about it, you gotta write it yourself.<p>Now,
    how do you use AI effectively and still retain your voice? Here&#x27;s one technique
    that works well: start with a voice memo, just record yourself maybe during a
    walk, and talk about a subject you want, free form, skip around jump sentences,
    just get it all out of your brain. Then open up a chat, add the recording or transcript,
    clearly state your intent in one sentence and ask the AI to consider your thoughts,
    your intent and ask clarifying questions. Like, what does the AI not understand
    about how your thoughts support the clearly stated intent of what you want to
    say. That&#x27;ll produce a first draft, which will be bad. Then tell the AI all
    the things that don&#x27;t make sense to you, that you don&#x27;t like, just comment
    on the whole doc, get a second draft. Ask the AI if it has more questions for
    you, you can use live chat to make this conversation go smoother as well, when
    the AI is asking you questions, you can talk freely by voice. Repeat this one
    or two more times, and a much finer draft will take shape that is closer to what
    you want to say. During this drafting state, the AI will always try to smooth
    or average out your ideas, so it is important to keep pointing out all the ways
    in which it is wrong.<p>This process will help you with all the thinking involved
    being more up-front. Once you&#x27;re read and critiqued several drafts, all your
    ideas will be much more clear. Then, sit down and write your own words from scratch,
    they will come much easier after all your thoughts have been exercised during
    the drafting process.'
