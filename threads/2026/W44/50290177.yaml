  author: capnrefsmmat
  text: 'The &quot;regression to the mean&quot; or &quot;it&#x27;s just the training
    data&quot; hypothesis doesn&#x27;t work. Pretrained models do not have these weird
    writing styles and sound much more human. It&#x27;s only after instruction tuning
    -- SFT, DPO, etc. -- that LLMs develop weird writing styles.<p>That is, the original
    training on massive text corpora seems to produce an average of human writing,
    but that average looks pretty average. It doesn&#x27;t feel like LLM slop. But
    the instruction tuning on specific tasks (answer this prompt, summarize this text,
    do this math problem), which turns text predictors into chatbots, seems to create
    strange style features as a side effect. And because that tuning step depends
    on company-specific training data (rather than just a crawl of the entire Internet),
    each company&#x27;s LLM has a different style.<p>It&#x27;s not that difficult
    to measure this. Linguists have had measures of style variation for a long time,
    though NLP and AI researchers seem to have forgotten. We&#x27;ve generated parallel
    human and AI corpora to measure it, and can show specifically which writing features
    change: <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2410.16107" rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2410.16107</a><p>Currently
    we&#x27;re working on tweaking the instruction tuning process to see if we can
    pin down which steps and what types of tasks tend to produce the weird style features.'
