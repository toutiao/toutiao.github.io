  author: sparkie
  text: |-
    If you don&#x27;t need insert&#x2F;remove in middle, only at the end, there are more optimal data structures for Lists like RAOTS[1].<p>Btrees are O(log n) random access, O(log n) cons and use O(log n) excess space.<p>Unrolled linked lists are still O(n) random access because we ignore the constant factor of block size. They also use O(n) excess space for pointers, but have O(1) cons.<p>RAOTS are O(1) random access, O(1) amortized cons [O(√n) worse case], and use O(√n) excess space.<p>RAOTS is basically a tree of depth 1. The root is an &quot;index block&quot; of pointers to data blocks which grow in size proportional to the square root of the data length (similar to Hashed Array Trees, but doesn&#x27;t require restructuring on each power of 2). The index block has length ~√n.<p>The square root is an approximation - the structure grows in &quot;superblocks&quot; where each superblock has `~√n` blocks of size `~√n` The pattern is: [1x1, 1x2, 2x2, 2x4, 4x4, 4x8, 8x8, 8x16, 16x16, 16x32, ...] Even indexed superblocks double the data block size, odd indexed superblocks double the number of blocks per superblock. It doesn&#x27;t use an actual `sqrt()` call uses but some bit tricks via `clz`.<p>A simpler trick, which has no single name but have been known as &quot;segmented lists&quot;, is where the index block points to blocks increasing in size geometrically, essentially like a dynamic array but where we don&#x27;t need to `realloc`. The index block is length 1+log₂n and each index i points to a block of length 2⁽ⁱ⁻¹⁾. These have O(1) random access, O(1) amortized cons [O(n) worst case] and waste O(n) space [with constant factor of 1&#x2F;2]. The random access is very efficient as it&#x27;s only two dereferences and a few bit tricks:<p><pre><code>    index_block[bit_width(idx)][idx - bit_floor(idx)]
    </code></pre>
    This is more cache friendly than the other approaches.<p>There&#x27;s also Bagwell&#x27;s VList[2] which is like a mashup of the &quot;segmented list&quot; and an unrolled list - the blocks grow geometrically in size, but still contain the pointer the the next block rather than them being in a separate index block.<p>[1]:<a href="https:&#x2F;&#x2F;cs.uwaterloo.ca&#x2F;research&#x2F;tr&#x2F;1999&#x2F;09&#x2F;CS-99-09.pdf" rel="nofollow">https:&#x2F;&#x2F;cs.uwaterloo.ca&#x2F;research&#x2F;tr&#x2F;1999&#x2F;09&#x2F;CS-99-09.pdf</a><p>[2]:<a href="https:&#x2F;&#x2F;dl.acm.org&#x2F;doi&#x2F;10.5555&#x2F;1756972.1756975" rel="nofollow">https:&#x2F;&#x2F;dl.acm.org&#x2F;doi&#x2F;10.5555&#x2F;1756972.1756975</a>
