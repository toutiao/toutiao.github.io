  author: hinkley
  text: A lot of my poor opinion on developer opinions dates back to a couple projects
    where Product and Marketing were begging us for substantial performance improvements
    and the teams pushed back saying this was as fast as you could expect. I got 2x
    in the first six months on both projects, and delivered 25% per quarter on one
    for almost 2 years (that maths to around 8x) before I started to scrape the bottom
    of my barrel.<p>It’s predominantly a way to shut down thinking, which is why it’s
    so often misquoted. Knuth’s version is more nuanced. Theirs is not at all.<p>As
    a compromise I got really good at doing optimizations that also improved readability.
    Things like hoisting and better variable naming combined together can be mistaken
    for just code cleanup.<p>I also discovered that keyhole optimizations are more
    palatable. Which is to say, move the slow bit yo a separate function with a single
    responsibility. Then do the optimization in a separate commit. Then the other
    devs don’t have to look at your changes and if they turn out to have a bug, we
    can always revert the change later. They almost never do, but having the option
    seems to grease the wheels.
