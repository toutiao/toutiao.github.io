article:
  url: https://pivotlake.io/blog/its-the-memory-latency-stupid/
  title: It's the memory latency, stupid · Pivot blog
  fetch_status: success
  content: "[← All posts](/blog/)\n\nWhen you see your databases CPU at 100%, what
    is it _actually_ doing? We like to act as though CPUs run code linearly for simplicity's
    sake, but in truth CPUs are incredibly complex beasts; they can potentially do
    many instructions at once, or sometimes none at all (despite our console showing
    100%). Because CPUs can do so many things, one CPU at 100% may be doing much less
    than another at 100%. A CPU is considered \"idle\" only if no task (Linux task)
    needs CPU time; this does not mean the CPU itself is being fully saturated. So
    why would a CPU not be fully utilized, even if it appears to be at 100%?\n\nThe
    answer is usually **memory**.\n\nMemory accesses are orders of magnitude slower
    than internal CPU operations. To give a good picture of how much so, a modern
    CPU might be able to process somewhere in the realm of 4-8 instructions per nanosecond.
    A memory access to RAM can take somewhere in the realm of 50-100ns. To ease your
    mathing, that means a modern CPU can do around 400-800 instructions for every
    _one_ memory access from RAM.\n\nCPU\n\nCPU core4–8 instr / ns\n\nL1 cache~1 ns\n\n~64
    KB · ~4–8 instructions per access\n\nL2 cache~3–4 ns\n\n~1 MB · ~15–30 instructions
    per access\n\nL3 cache~10–15 ns\n\nup to a few hundred MB · ~50–100 instructions
    per access\n\nDRAM~50–100 ns\n\nGBs · ~400–800 instructions per access\n\nGiven
    this, CPUs are built from the ground up to work their way around this. The most
    obvious way this is dealt with is CPU caches. CPU caches keep memory closer to
    the CPU than RAM, literally baked into the CPU chip. The closest cache (the L1
    cache) takes around 1ns per memory operation- that's 50-100x faster than RAM!
    The \"problem\" here of course is that the CPU caches are fairly small; the L1
    cache for a modern CPU is probably around ~64KB, while the farther caches max
    out at a few hundred MB for top end processors. A good database tries manipulating
    data in small \"chunks\" to take full advantage of caches, and you'll often hear
    cache utilization as being one of the top concerns of performance engineering.\n\nLet's
    look at GROUP BY aggregations to get a better grip on cache utilization. In GROUP
    BY, we're looking to take a dataset, group it by a certain column (or more), and
    perform certain aggregations (for example, count, or sum on another column). The
    \"naive\" method might be to open a HashTable keyed by the group key that grows
    ever larger. For every new row, you would check if that key exists- if it does,
    go to it's corresponding aggregation and update the result. Simple, right? The
    problem is that if you have millions of unique groups, you're not utilizing your
    cache at all! Nearly every HashTable access will be a \"cold\" hit that goes to
    RAM. This means that although your CPU may /look/ like it's 100% utilized, in
    truth it'll constantly be waiting for cold memory accesses.\n\nTo demonstrate
    this, we'll take our state-of-the-art Pivot engine and ravage it! We'll remove
    all our complex logic and replace it with simplicity:\n\n    fn consume(\n        &mut
    self,\n        batch: RecordBatch,\n        _sender: &mut dyn Sender<RecordBatch>,\n
    \   ) -> unary::Result<()> {\n        let group_keys = batch.column(self.key_column).as_primitive::<Int64Type>();\n
    \       for &key in group_keys.values() {\n            // If the Group Key doesn't
    exist- set it to 0\n            // Afterwards, add 1 to the group- this will give
    us a count(*) GROUP BY key_column\n            *self.counts.entry(key).or_insert(0)
    += 1;\n        }\n    }\n\nWe'll then run a simple query `SELECT count(*), UserID
    FROM hits GROUP BY UserID` on the \"hits\" dataset ClickBench provides (99m rows).
    This query will give us a count per `UserID`, meaning we'll have an entry in our
    HashMap per `UserID`- I'll give a spoiler here that there are ~17m unique `UserID`.
    \ \nOur performance checks will be on a bare metal server from our good friends
    over at CherryServers (AMD EPYC 9124 Genoa, 16 cores, 128 GB DDR5). We unfortunately
    can't use a common AWS/GCP machine because we want access to counters that aren't
    exposed there for security reasons (for example, we want to see how much memory
    is passing from DRAM controller to us). We'll confine ourselves to a single core,
    since this naive group by can't run on many cores.\n\nTo run it:\n\n    cat >
    config.yaml <<'EOF'\n    server:\n      bind: 127.0.0.1:5440\n    workers: 1\n
    \   datastores:\n      default:\n        kind: pivotlake\n        location: ./data\n
    \       default: true\n    users:\n      pivot:\n        auth:\n          method:
    trust\n    EOF\n    taskset -c 3 pivot server --config config.yaml &\n    taskset
    -c 7 psql -h 127.0.0.1 -p 5440 -U pivot -c '\\timing on' -c \"SELECT count(*)
    FROM (SELECT COUNT(*), UserID FROM hits GROUP BY UserID)\"\n\nThis takes... a
    whopping 3.9 seconds. Is that good? Is that bad? Everything in this world is relative,
    or so they say. If we run the query again (without restarting the server), it
    takes 3.6s. The second run is the one we're more interested in- there's no disk
    involved as everything is already sitting in our page-cache.\n\nYou'll notice
    we did `taskset -c`. This pins the process to a given CPU; this will allow us
    to run `perf stat` on that CPU and see what's going on internally. We'll measure
    two metric groups- percentage of CPU slots stalling because of memory (and not
    doing anything in the meanwhile), and percentage of CPU slots actually retiring
    a micro-op:\n\n    sudo perf stat -C 3 -M backend_bound_memory,retiring -- taskset
