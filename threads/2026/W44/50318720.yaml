  author: boricj
  text: "&quot;Clean&quot; code for modelling links between objects would be to store
    pointers within them. But that means dangling pointers when deleting objects,
    so you need to either update manually everywhere (easy to forget somewhere) or
    use shared&#x2F;weak pointers (extra bookkeeping and allocations).<p>&quot;Unclean&quot;
    code for this is putting objects in a table, giving objects a generation (that
    increments whenever you create&#x2F;delete one) and storing pairs of (index, generation)
    numbers everywhere you need a link. Link is live only if the generations matches
    and since only odd generations are live objects, default construction means no
    link. Lifted straight from 2000s video game tricks and with modern C++ it&#x27;s
    basically all encapsulated away.<p>I&#x27;ve made that refactoring in a codebase,
    not because of speed but because of maintenance and memory fragmentation concerns.
    Sometimes, the clean solution really isn&#x27;t the right one and it&#x27;s really
    sad that compsci only ever teaches classical data structures, like we&#x27;re
    still coding in the 1970s on computers with no caches that don&#x27;t suffer from
    pointer chasing."
