  author: Nevermark
  text: 'I thought up a RAM that paired every data word, with an address word, pointing
    to its &quot;next&quot; word. ListRAM.<p>Reduces usable RAM in half, but speed
    is speed.<p>The idea being the RAM buses could be designed to provide fast pipelines
    of chained data to the cache, despite arbitrarily scattering in RAM.<p>There is
    no way this could compete with a single batch read of actually adjacent data.
    But it could speed up &quot;Random&quot; accessed data, which often is not - in
    fact - actually random from the program&#x27;s or the data structure&#x27;s point
    of view, just not adjacent.<p>And it would do one thing better: Reading a null
    terminated string wouldn&#x27;t over read. The null next-address would stop every
    small string read from becoming a page read.<p>Even more flexible, send little
    read-chain algorithms to RAM. A little address math chaining and branching on
    in-RAM values, on little distributed address-math cores (RAM embedded APU cores!),
    could avoid a lot slow turnarounds.<p>These kinds of ideas seem even better to
    me now, by orders of magnitude, than they did originally. RAM really needs help.'
