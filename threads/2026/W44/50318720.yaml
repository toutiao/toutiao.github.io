article:
  url: https://pivotlake.io/blog/its-the-memory-latency-stupid/
  title: It's the memory latency, stupid · Pivot blog
  fetch_status: success
  content: "[← All posts](/blog/)\n\nWhen you see your databases CPU at 100%, what
    is it _actually_ doing? We like to act as though CPUs run code linearly for simplicity's
    sake, but in truth CPUs are incredibly complex beasts; they can potentially do
    many instructions at once, or sometimes none at all (despite our console showing
    100%). Because CPUs can do so many things, one CPU at 100% may be doing much less
    than another at 100%. A CPU is considered \"idle\" only if no task (Linux task)
    needs CPU time; this does not mean the CPU itself is being fully saturated. So
    why would a CPU not be fully utilized, even if it appears to be at 100%?\n\nThe
    answer is usually **memory**.\n\nMemory accesses are orders of magnitude slower
    than internal CPU operations. To give a good picture of how much so, a modern
    CPU might be able to process somewhere in the realm of 4-8 instructions per nanosecond.
    A memory access to RAM can take somewhere in the realm of 50-100ns. To ease your
    mathing, that means a modern CPU can do around 400-800 instructions for every
    _one_ memory access from RAM.\n\nCPU\n\nCPU core4–8 instr / ns\n\nL1 cache~1 ns\n\n~64
    KB · ~4–8 instructions per access\n\nL2 cache~3–4 ns\n\n~1 MB · ~15–30 instructions
    per access\n\nL3 cache~10–15 ns\n\nup to a few hundred MB · ~50–100 instructions
    per access\n\nDRAM~50–100 ns\n\nGBs · ~400–800 instructions per access\n\nGiven
    this, CPUs are built from the ground up to work their way around this. The most
    obvious way this is dealt with is CPU caches. CPU caches keep memory closer to
    the CPU than RAM, literally baked into the CPU chip. The closest cache (the L1
    cache) takes around 1ns per memory operation- that's 50-100x faster than RAM!
    The \"problem\" here of course is that the CPU caches are fairly small; the L1
    cache for a modern CPU is probably around ~64KB, while the farther caches max
    out at a few hundred MB for top end processors. A good database tries manipulating
    data in small \"chunks\" to take full advantage of caches, and you'll often hear
    cache utilization as being one of the top concerns of performance engineering.\n\nLet's
    look at GROUP BY aggregations to get a better grip on cache utilization. In GROUP
    BY, we're looking to take a dataset, group it by a certain column (or more), and
    perform certain aggregations (for example, count, or sum on another column). The
    \"naive\" method might be to open a HashTable keyed by the group key that grows
    ever larger. For every new row, you would check if that key exists- if it does,
