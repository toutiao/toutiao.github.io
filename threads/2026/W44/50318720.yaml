  author: hinkley
  text: When you&#x27;re asked to meet a time limit, that&#x27;s time domain, not
    rate, and so improvements will be reported in the time domain.<p>Time domain also
    works for Little&#x27;s Law, which is the more prevalent measure these days anyway.
    If you double the throughput of a server you can halve the cluster size and retain
    the same level of service. Which isn&#x27;t 200%, it&#x27;s 50%.
  score: 0
  posted_at: '2026-11-01T19:54:37Z'
- id: '50329268'
  parent_id: '50324302'
  author: hinkley
  text: Performance is for the user. If the user has told you that we have an SLA
    that requires this operation to complete in 10s, but it currently runs in 30 seconds,
    and your first set of changes gets it to 15s, what improvement are you going to
    report to the user?<p>You&#x27;re going to report in the time domain. In which
    case 1&#x2F;2 off the time is 50%.<p>One of the benchmarking tools I used to use
    reported 50k ops&#x2F;sec -&gt; 200k ops&#x2F;sec as 75% faster. Which definitely
    IS wrong but I know how he got there. You see you don&#x27;t count operations
    per second, you run the loop ?? thousand times and see how many milliseconds it
    takes. Then you convert that to ops&#x2F;sec. If you compare before and after
    while still in the time domain, that&#x27;s 75%. But if you report throughput
    right next to a ratio in the time domain you&#x27;re gonna have a bad time.<p>When
    that tool stopped being maintained, the person who replaced it wisely switched
    to reporting in multipliers. 4x faster is hard to misinterpret. Though &quot;1.1x
    slower&quot; is still open to misinterpretation.
