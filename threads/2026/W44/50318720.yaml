  author: hinkley
  text: "&quot;Premature optimization&quot; became a battle cry of the Don&#x27;t
    Make Me Think crowd.<p>As I think back to the people who fought me, the same group
    didn&#x27;t like when you refactored code either because now they didn&#x27;t
    have the code memorized. But I&#x27;ve found in the intervening years that making
    code discoverable is much more useful than trying to keep it static because coworkers
    are always going to need to change shit anyway to implement new features even
    if that feature is neither Correctness nor Performance. What you don&#x27;t want
    is for people to <i>hide</i> logic from you. So if you move logic to a function
    call, that&#x27;s fine, because it&#x27;s still in the same neighborhood. But
    if you hoist it all the way up into a much earlier part of the call tree, you
    need to announce that in meetings and maybe in the documentation so people know
    what&#x27;s what."
