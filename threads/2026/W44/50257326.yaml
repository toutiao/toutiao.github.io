  text: Just so we&#x27;re on the same page, this is the one I just skimmed:<p><a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;History_of_HIV&#x2F;AIDS"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;History_of_HIV&#x2F;AIDS</a><p>On
    reflex, I searched for &quot;reagan&quot;. 0 results as of the morning of October
    27, 2026.<p>I was there in the 1980s when the AIDS outbreak started getting mainstream
    news coverage. I watched the Ryan White movie on TV, when it was the biggest topic
    at school for months afterwards:<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Ryan_White"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Ryan_White</a><p>I
    can tell you what really happened. HIV&#x2F;AIDS scared the bejesus out of the
    political establishment of the time. Who then stoked that fear to push their socially
    conservative agenda onto everyone in an attempt to return the US to what they
    viewed as a morally just culture (basically the 1950s), much like MAGA today.<p>And
    just like when Donald Trump refused to wear a mask to set an example in protecting
    the elderly and other vulnerable groups from infection by COVID-19, Ronald Reagan
    refused to devote real resources to slowing the spread of of AIDS and finding
    a cure. Because AIDS furthered the GOP&#x27;s efforts to expand the War on Drugs,
    push abstinence-only sex education, demonize same-sex relationships and criticize
    secular culture in general.<p>In a very real sense, Ronald Reagan and his administration
    let AIDS grow from being a manageable disease to becoming an epidemic that killed
    millions of people. His misplaced priorities set back research and treatment options
    by decades.<p>Omitting Reagan&#x27;s name from the history of AIDS is like casually
    leaving Benedict Arnold out of the history of the American Revolutionary War.<p>The
    domino effect of his abdication of duty has touched everything from US police
    interventions in developing nations that it&#x27;s exploited to its $40 trillion
    national debt. It&#x27;s literally fogged the lens through which we see the world.<p>Its
    easy to forget all of that now that once-daily HIV treatment pills and bi-monthly
    preventative injections exist, and we&#x27;re finally seeing cures on the horizon.<p>Revisionist
    history now dominates our political discourse. I write this because the &quot;AIDS
    is a consequence of bad morals&quot; agenda is not something to be lightly swept
    under the rug. It&#x27;s literally a pillar upon which the alternate timeline
    we&#x27;re on now stands.
