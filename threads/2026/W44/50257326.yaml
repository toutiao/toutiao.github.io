  author: kzrdude
  text: 'That&#x27;s not how academic literature works. The structure is like this:
    Statement (Citation). The citation is not an affirmation of truth but a content
    declaration; this statement is supported by this publication. The receipts are
    there, so that you can trace the argumentation and make your own conclusions if
    necessary.<p>&#x27;Knowledge&#x27; formed this way is a living, evolving graph,
    and sometimes links are broken (findings are reevaluated or disproven); having
    the content declaration so clearly in the open makes it easier to deal with this
    evolving landscape.'
  score: 0
