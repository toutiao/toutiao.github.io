  author: kzrdude
  text: LLMs cook up new sentences based on probability, based on everything in their
    training and their context. There&#x27;s just nothing in their model that traces
    provenance of facts, they physically don&#x27;t store that information. Once they
    have written a sentence, they can&#x27;t tell you from which work they got this
    information.<p>There are tools where they try to retroactively add references,
    the LLM interfaces try to do this, but it&#x27;s usually inaccurate.<p>I think
    of the way a scientific article works. &quot;The sky is blue (Pearson, 1992).&quot;
    The writer is fully aware what the factual statement is and which publication
    supports it (not just that, but which kind of publication - primary, secondary
    source, peer reviewed?). An LLM can try to imitate this, but the actual information
    to support this does not exist in its training.
  score: 0
