    How Wikipedia’s Editors Keep the Online Encyclopedia Human-Written \n\n## \n\nAI-generated
    text is harder to spot, but that hasn’t deterred them\n\n[Eliza Strickland](https://spectrum.ieee.org/u/eliza-strickland)\n\n21
    Oct 2026\n\n4 min read\n\nEliza Strickland is IEEE Spectrum's features editor.
    She also covers AI and biomedical engineering.\n\nEllia Lebleu is a cofounder
    of the WikiProject AI Cleanup effort to keep Wikipedia human-written.\n\n Stuart
    Bradford \n\nEllia Lebleu is a founding member of[the WikiProject AI Cleanup](https://en.wikipedia.org/wiki/Wikipedia:WikiProject_AI_Cleanup),
    a volunteer effort launched in 2023 to find and remove AI-generated material from
    [Wikipedia](https://spectrum.ieee.org/wikipedia-at-25) that breaks the website’s
    guidelines. When the cleanup began, [AI writing](https://spectrum.ieee.org/ai-scientist-research-paper-format)
    was often betrayed by conspicuous clichés. Today, the project’s volunteers are
    developing tools to detect subtler forms of machine-generated content and debating
    AI’s role in the world’s most widely used encyclopedia.\n\n**When did you realize
    [Wikipedia](https://spectrum.ieee.org/tag/wikipedia) had a problem with AI-generated
    material?**\n\n**Ellia Lebleu:** It was around December 2023. A few other editors
    and I were chatting on Wikipedia’s Discord server, and we had all seen very strange
    articles with the same odd characteristics. They repeated phrases like “stands
    as a testament” or “rich cultura"
