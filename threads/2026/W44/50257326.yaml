  author: harrisi
  text: One of the challenging things about sharing knowledge is that it doesn&#x27;t
    exist in a vacuum. With certain things there&#x27;s definitely more complicated
    and nuanced approaches that may make sense. It&#x27;s absolutely true that it
    can swing back too far - and that&#x27;s usually the case with the most important
    areas of life, I&#x27;d argue. It&#x27;s the cause of all sorts of seemingly-well-intentioned
    attempts at sharing information, as well as, of course, intentionally malicious
    forms of sharing information. That&#x27;s what all propaganda does, realistically.<p>To
    bring it back to the topic, this is certainly a serious concern with AI-generated
    content. The world changes and evolves and things that are acceptable become unacceptable
    and vice versa. With training data potentially being stuck in time due to the
    majority of new data being generated, history could essentially just stop here.
    Or at least that is an idea that&#x27;s been proposed. I&#x27;ll be honest that
    I have thought that to be a genuine concern. However, objectively, novel ideas
    <i>have</i> come out of these new technologies. So it&#x27;s a bit of a pickle
    to figure out how that relates to the human experience as time marches on.<p>Thank
    you. The world will keep on spinning. :)
