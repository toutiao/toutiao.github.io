    # The State of Context Engineering

    ### The Job is Knowing When to Be Deterministic & When to Be Probabilistic

    This week, I gave a short talk at [AGNTCon](https://events.linuxfoundation.org/agntcon-mcpcon-north-america/) titled, “Context Fails & Fixes,” that functioned as a sort of “State of Context Engineering.” How did context engineering emerge, where has it gone, and where might it go in the future? As model makers target new capabilities, they inadvertently create challenges we, as users and harness builders, must overcome.

    Below are the slides and a lightly edited transcript. As always, [shoot me a note with any feedback, thoughts, or questions](https://www.dbreunig.com/contact.html). I really appreciate it.

    * * *

    ![Title slide: Context Fails & Fixes. The continuing challenge of preparing precise instructions. Drew Breunig, Cmpnd, October 2026.](/img/resized/agnt_con/AGNT_Con.001.jpg)

    Hi, everyone. Thanks for joining me today. We’re going to walk through context fails and fixes.

    * * *

    ![Hi, I'm Drew Breunig. I write about technology, data, and AI at dbreunig.com; I cofounded Cmpnd, a startup focused on compound AI research and DSPy; and I'm currently editing The Context Engineering Handbook.](/img/resized/agnt_con/AGNT_Con.002.jpg)

    I have a book coming out in a bit, [_The Context Engineering Handbook_](https://www.oreilly.com/library/view/the-context-engineering/0642572260705/). When I first talked to the team at O’Reilly, back in June 2025, they asked me a very reasonable question: “How do we know this won’t become obsolete in a few weeks?” The trouble with AI textbooks is that many age extraordinarily quickly.

    I said, I don’t know, but I’m optimistic. Giving clear instructions about what to do and what not to do, and ensuring those instructions are consistent and not noisy, will forever be a challenge with AI, no matter how good it gets.

    We have coworkers, partners, and other people we know and interact with who _are_ sentient. They pass the Turing test, they are “AGI,” and yet: we still have a hard time conveying instructions, ideas, and concepts among each other.

    Context engineering will continue to be hard. But it will be hard in unique ways, because models aren’t people. You can make assumptions about how models think or interpret things (use whatever anthropomorphizing word you like), but it helps to understand how they’re built, optimized, and trained. Their unique attributes and construction create a unique set of failure modes we need to reckon with.

    So let’s review how we got here.

    * * *

    ![2024: The Promise of Long Contexts. Bar chart of context window sizes: GPT-4o at 128K tokens versus Gemini 1.5 at 1M.](/img/resized/agnt_con/AGNT_Con.003.jpg)

    Let’s flash back to the end of 2024.

    If you remember, this was the height of the “RAG is dead” moment.

    The hope was: if we can just make the context window large enough, we can put the entire internet in it. We can put everything in it. We don’t have to be selective. We don’t have to build agentic systems. We can fit it all in there, and AI will be solved.

    Model builders started aiming at long context capabilities and we had a big leap from ~128,000-token context window models to million-token context window models, starting with Gemini 1.5.

    * * *

    ![Google's Gemini 1.5 Pro marketing graphic comparing context windows: Gemini 1.0 Pro at 32K, GPT-4 Turbo at 128K, Claude 2.1 at 200K, and Gemini 1.5 Pro at 1M, with up to 10M in research, equal to 1 hour of video, 11 hours of audio, over 30K lines of code, or over 700K words.](/img/resized/agnt_con/AGNT_Con.004.jpg)

    If you look at [the marketing material for Gemini 1.5 Pro](https://blog.google/innovation-and-ai/products/google-gemini-next-generation-model-february-2024/), it was mostly about the million-token context window. They were even teasing a _10-million-token context window_ model they had in the lab, that would come out soon.

    * * *

    ![2024: The Promise of Long Contexts. Bar chart of context windows: GPT-4o, Gemini 1.5 at 1M, and Llama 4 at 10M tokens.](/img/resized/agnt_con/AGNT_Con.005.jpg)

    But they got beaten to the punch. Llama 4 Scout came out with a _10-million-token context window_, and well, it wasn’t quite what we hoped. Inference was a challenge, and Scout never really caught on, and we never got another Llama.

    But we still got a million tokens. That’s pretty good. We’ll take it.

    * * *

    ![Just put everything in the context. (RAG is dead)](/img/resized/agnt_con/AGNT_Con.006.jpg)

    So this was the brief at the time: just put everything in the context and let the model sort it out.

    * * *

    ![More Context, More Problems: long contexts are not a panacea. Four failure modes: Context Poisoning, when a hallucination or error is repeatedly referenced; Context Distraction, when the model over-focuses on a long context and neglects base knowledge; Context Confusion, when superfluous information produces low-quality responses; and Context Clash, when new information and tools conflict with other information in the context.](/img/resized/agnt_con/AGNT_Con.007.jpg)

    But with more context, we had room for more problems. Long contexts are not a panacea.

    When I wrote about this, I identified four key failure modes.

    **[Context poisoning](https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html#context-poisoning)** is when something gets into the context that shouldn’t be there. It could be a hallucination or a bad fact, and the model can’t get past it.

    **[Context distraction](https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html#context-distraction)** is when the context grows so long that the model starts to focus on the context over its base knowledge. We can see this in some really interesting ways.

    **[Context confusion](https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html#context-confusion)** is when extraneous facts—things that don’t relate to the problem I’m working on—come in and influence the model in ways we don’t fully understand. This one’s really pernicious. We’re not going to dig into it today, but it’s one of my favorite failure modes. The model makes assumptions about who you are, and those assumptions influence the answer.

    Finally, **[context clash](https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html#context-clash)** is when tool calls, skills, and other information within your harness start to conflict and work against you in ways you didn’t expect.

    (How many of you keep memory on in ChatGPT or Claude? I turn it off. I hate it. Sometimes I’m talking about work conversations; sometimes I’m talking about a project I’m doing with my son. The model will take notes on both, mix up those contexts, and the confusion grows from there.)

    * * *

    ![Box art for Pokémon Red Version on the Game Boy, 1996, with a lemonade icon, next to Pokémon FireRed Version on the Game Boy Advance, 2004, with a tea icon.](/img/resized/agnt_con/AGNT_Con.008.jpg)

    Let me give you my favorite example of context poisoning.

    I’m going to date myself: I played the game on the left. The one from 1996, for the original Game Boy. This is the first _Pokémon Red_. It was in black and white.

    In 2004, Nintendo released _Pokémon FireRed_ for the Game Boy Advance. These were essentially the same game, except one had better colors and audio.

    But there was one subtle change. At some point in both Pokémon Reds, to get past a security guard, you have to give them something to drink. A bribe. Quite the practical lesson for children.

    In the original game, you need to give the thirsty guard lemonade. In _FireRed_, for some reason, they changed it to iced tea.

    * * *

