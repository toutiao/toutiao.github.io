  author: BenoitEssiambre
  text: It&#x27;s nice that this article goes beyond the &quot;context too long&quot;
    scapegoat diagnostic.<p>There is more to it than just reducing content in context.
    LLMs attention mechanism works by finding graphs of related words and concepts
    and it works best when the relevant relationships are close together in the text.
    Length matters but how well the information is organized matters as well.<p>It&#x27;s
    useful to be familiar with the concept of dependency length. The two sentences
    in this image ( <a href="https:&#x2F;&#x2F;benoitessiambre.com&#x2F;img&#x2F;dependencylength.png"
    rel="nofollow">https:&#x2F;&#x2F;benoitessiambre.com&#x2F;img&#x2F;dependencylength.png</a>
    ) have the same words and same meaning but sentence C is organised to minimize
    the distance between related words.<p>This can also apply to paragraphs and sections.
    Ordering them so that related information is recursively closer together, helps
    AIs think better (also helps humans, Dependency Length Minimization, DLM is an
    idea from psycho-linguistics).<p>This is one reason progressive disclosure and
    sub agents are important. Including unnecessary information spreads apart surrounding
    information and makes it more difficult for AIs to figure things out.<p>For eg.
    optimizing skills, it can help to put more important information at the bottom
    of a skill. Usually after a skill is loaded, the AI will start “thinking”, talking
    to itself to try to reason through a problem. The thinking block will have an
    easier time considering the text closest to it, the last part of the skill, than
    information farther up.<p>Thinking blocks can produce a lot of text (a lot of
    it often hidden from users) that also spreads information apart. Sometimes, when
    an early instruction is still relevant but there’s been a lot of thinking and
    discussion added to the context since, it’s worth repeating a summary the early
    information ( keeping in mind that too many reminders can also spread other information
    apart ). I think however, LLMs are tuned to overweight very early information
    so that they don&#x27;t disregard system prompts. You might be able to exploit
    this by placing some important facts near the very beginning of a conversation.<p>If
    you&#x27;ve ever written compression algorithms where repeated blocks are referenced
    instead of encoded, you&#x27;ll be familiar with how related information being
    clustered allows for better compression. It&#x27;s another example of the parallels
    between intelligence and compression and it hints at the information theoretic
    aspect of DLM.
  score: 0
