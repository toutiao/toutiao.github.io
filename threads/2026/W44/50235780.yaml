  text: I think that makes sense for now in individual contributor cases, but the
    turnkey solutions have gaps when it comes to the most powerful capabilities and
    I don&#x27;t see harnesses going away any time soon for that.<p>E.g. you can&#x27;t
    use coworking&#x2F;projects for shared memory in most domains because this hinges
    on compacting&#x2F;refactoring true reusable facts and organisational knowledge
    (as opposed to code, schemas, technical references). The heuristics to find and
    decide on candidates for memory in this case are quite specific to the institution
    you work in. For example, the boundaries of the domain of &quot;sales&quot; versus
    &quot;marketing&quot; vary lots from place to place, as does the trustworthiness
    of certain staff, the way they they communicate or make decisions that contain
    the knowledge you want to store to memory, and so on.<p>I&#x27;m finding harnesses
    are still vastly better for grabbing this sort of complex institutional knowledge.
    Also, they&#x27;re just a bit of a safety net for any frontier labs going bankrupt
    in the next couple of years, if we need an easy way to port over to open weights.
