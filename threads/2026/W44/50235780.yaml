  author: CBLT
  text: Yeah, I also think decision models for pruning context isn&#x27;t worthwhile.  You&#x27;re
    paying to load it into context (of your decision model), in order to save on loading
    the same data into context (of your generation model).  The only way the economics
    makes sense is if you need a much smarter model for the compaction, but can&#x27;t
    pay for it to load all of that context (because it&#x27;s uncached or something).  That
    sounds like a niche but it really doesn&#x27;t exist.  Cheap models are good enough,
    and smart models are cheap enough.<p>Personally, I use a harness extension that
    auto-compacts my context just before the cache expires.  Combined with the default
    compact-when-full, this ends up being pretty much always what I want.  It&#x27;s
    one less thing to think about.
