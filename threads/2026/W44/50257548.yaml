  author: Someone1234
  text: 'Commonly that isn&#x27;t a software issue though, that&#x27;s a hardware
    problem being [correctly] indicated by software. With three notable exceptions:<p>-
    Windows 1.0 through ME era: Legitimately an unstable OS due to dangerous memory
    model&#x2F;lack of memory isolation.<p>- Windows NT through XP: Before KPP was
    added, software was monkey-patching the kernel, and it was causing instability
    (particularly multiple trying to over-patch each other). For example during that
    era it wasn&#x27;t UNCOMMON for antivirus to do so as a matter of course.<p>-
    Windows Vista Specific: They made significant changes to the driver model of several
    popular device types, and manufacturers weren&#x27;t ready. So a lot of driver-related
    failures.<p>But since then, it has mostly be smooth sailing. If you see a BSOD,
    you can trace it down, and more often than not the source will be underlying hardware
    failure which is why BSOD exists and isn&#x27;t a software bug or problem.'
