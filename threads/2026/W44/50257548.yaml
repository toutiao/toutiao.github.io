  author: Pannoniae
  text: IMO it&#x27;s a bit more nuanced than what the author portrays it as. Broadly,
    software used to be much worse on the micro-level but better on the macro-level
    i.e. architecture.<p>Since it was much harder to make stuff, you really had to
    architect it well or otherwise it would simply fall apart. For example in assembler
    you need discipline in your calling conventions, layout and so on, otherwise it
    just corrupted, you needed to follow sensible naming conventions otherwise it
    degenerated into unreadable label spaghetti and so on.<p>Nowadays it&#x27;s the
    other way around, the micro level is so much better due to libraries, code reuse,
    LLMs and better languages&#x2F;tools, you can use highly sophisticated data structures
    and functions at your fingertips. In exchange, you can afford to skimp on architecture
    because computers are fast anyway, and the programming languages don&#x27;t let
    you make a <i>huge</i> mess. (Most don&#x27;t have unstructured goto&#x2F;jumps,
    can&#x27;t corrupt memory accidentally, etc.)<p>However, this has the cost of
    making larger programs a nightmare to maintain and systems suffering from a &quot;death
    of thousand cuts&quot; i.e. on the micro level all is well but when you look at
    the entire system it&#x27;s a sprawling unreliable mess. This is where rewrites
    often happen ;)
