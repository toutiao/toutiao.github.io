    Indeed, this is the tough part about synthetic workload generation for benchmarking.
    Fully randomized input is easy to generate and is a valuable data point for characterizing a system for the engineer working on that system, but it introduces its own kind of bias. As a micro-scale example, if you have a critical inner loop then replacing an input-dependent branch with a branch-free alternative is going to unrealistically favor the branch-free option on fully random input.
    There's really no easy solution to this other than starting from real data sets that represent diverse, realistic use cases. I've had success with synthesizing data sets based on a corpus of real data sets using both parametric (statistical inference of model parameters) and non-parametric (resampling) methods. For structured data you would combine such a model with some kind of structured generator which samples from it.
    As long as you validate the benchmarks on those trained models against the real data sets you can get something pretty good, but it's not a panacea and you must be diligent.
