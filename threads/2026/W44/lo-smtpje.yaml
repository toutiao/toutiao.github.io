    Has anyone thought about making a benchmark that generates queries (from prng seeds), rather than have fixed queries? Similar to how people do property-based testing and fuzzing and so on.
    Then pick some random seeds every time a DB is added to the benchmark or every once in a while, average the results, and call it done. Given a u64 seed, you'll likely run out of ideas for new DBs before the seed combinations are exhausted even if you pick like a million seeds to average against.
    In my mind these benchmarks really want to be more like fuzzers.
