  author: waiwai933
  text: I have a non-trivial tax situation, as a US citizen living abroad. I prepare
    my own tax returns, never having found a cross-border tax preparer I trust, and
    have for the past few years, fed my draft return along with all the supporting
    paperwork into Claude. It has:<p>1. found errors, e.g. where I used the incorrect
    exchange rate (and managed to work out how I had made that error, which I was
    impressed by)<p>2. found items which would appear to be errors except for context
    it did not know<p>3. flagged areas where it disagreed with me as to the correct
    tax treatment, but accepted that the law is ambiguous (and in some cases I preferred
    its interpretation after additional research and in other cases I did not)<p>4.
    flagged areas where it disagreed with IRS guidance, and only acknowledged said
    guidance after I provided links to it<p>5. provided highly inaccurate estimated
    tax calculations, and not been able to fix its estimates even when challenged<p>So
    my takeaway is that it is a very useful tool for tax, but perhaps unsurprisingly,
    it is not good enough to dump all your paperwork into and expect a shiny return
    you don&#x27;t need to check. (Possibly it is if you just have a W-2 and no other
    substantial income, but I can&#x27;t speak for that scenario.)
