  author: RGS1811
  text: Sort of. The formulas for each line live in the form YAML I described above.
    The formulas are built out of a set of primitive operations that are defined in
    lean, with their properties proved there (non-negativity, monotonicity, etc.).
    There&#x27;s also a lean evaluator that&#x27;s run on compiled form data and cross
    checked with the typescript evaluator. (There&#x27;s a lot more detail in the
    README.)
