  author: RGS1811
  text: Not quite. The formalization covers the IRS&#x27;s published procedure, i.e.
    the questions and calculations that go into the published forms, worksheets, and
    instructions. It&#x27;s not a formalization of the tax code itself, and it&#x27;s
    not a tax calculator, though a client of the underlying code could function as
    a tax calculator. (The project includes such a client, a CLI tax interviewer,
    just to exercise the code.)<p>In more detail:<p>- every line of every form gets
    a YAML representation which includes the source text, a data type, and an expression
    built from a small set of lean atoms, plus a citation pointing to the exact location
    of the rule in the original official document.<p>- underneath the yaml layer there&#x27;s
    a lean formalization of the atoms showing that they behave as specified, that
    all comuptations use only the allowed atoms and operations, etc. There&#x27;s
    also a typescript evaluator that&#x27;s used to cross check the lean for agreement,
    so we have the arithmetic represented two ways.<p>The critical failure point for
    an LLM-produced formalization like this is the interpretation of the form text.
    Since I&#x27;m not a tax lawyer and don&#x27;t intend to become one, this is an
    explicitly owned weakness and one I&#x27;ve structured the project around. Publicly
    available tax calculators (PolicyEngine, UsTaxes, OpenTaxSolver, etc.) are used
    to cross check derived numbers from this system. Mutation testing ensures the
    test suite is robust against bugs and arithmetic errors. Interpretations are cross
    checked by different model families (Claude, GPT, Deepseek). Etc.<p>The idea is
    to derive confidence from the formal properties of the system itself, and to allow
    theoretical future users of such a system to derive confidence in the interpretation
    of specific forms by making it easy to cross check line-level formalizations against
    the source documents.<p>There&#x27;s a lot more detail in the (alas, Claude-authored)
    README. When I have time I&#x27;m going to write my own version of the README
    expressing my vision of the project, but I&#x27;m not there yet.
  score: 0
