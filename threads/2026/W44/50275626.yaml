  author: rbhelt
  text: |-
    I am a CPA with 20+ years of experience and I feel like I need to defend our industry here.<p>There is no such thing as &quot;failing&quot; an IRS audit. You either under reported income, overstated deductible expenses, or your &quot;accountant&quot; changed the numbers you provided and committed fraud, which would have resulted in immediate legal proceedings by the IRS against the preparer. So did you &quot;fail&quot; because your preparer committed federal tax fraud or did you underreport your income?<p>The statement that the one time you used an accountant you got audited implies that you are confusing causation with correlation.
    There are about 6 ways that the IRS selects returns for audit but only 3 are actually relevant here.<p>- Information Matching (ie. if your W2 does not match the W2 submitted by your employer). This mostly used for your basic W2, 1099DIV, etc. kind of taxpayer and is usually just a letter from the IRS telling you your numbers are wrong and you need to amend your return.<p>- If they are examining a related return (ie. you own a business and another partner in that business is being audited)<p>- Computer scoring which breaks down into the Discriminant Function System (DIF), basically, how does your return compare to similar returns, and Unreported Income DIF, what is the potential that your return underreported income. This is what is commonly used for businesses and self employed individuals&#x27; Schedule C. Basically, when you prepare a business return (1040 Sch. C, 1041, 1065, 1120, 1120S, or 990) you have to report your business industry&#x27;s NAICS code, and provide a single line explanation what your business does. Using this and the return data, the IRS is able to score a return on the likelihood that profit is understated by comparing a businesses income and expenses to the norm for a similarly sized businesses in that industry. High scoring returns are then reviewed by IRS personnel.<p>One of those three things happened to you and none of them are the fault of a preparer that is using accurate information provided by the taxpayer.<p>Finally, you keep saying things like &quot;accountant&quot;. You disparaging an entire industry without saying what type of tax preparer you used. Was it a CPA, licensed by a state with experience in tax? An  Enrolled Agent, licensed by the IRS directly? Or a tax preparer, an unlicensed person preparing your return either on their own or through something like HR Block or Turbotax? Because if you used an unlicensed tax preparer and are blaming licensed individuals that is like hiring an unlicensed electricians and then when your house burns down from an electrical fire, turning around and saying all electricians are bad
