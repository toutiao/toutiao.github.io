  author: NikZaal
  text: 'Claude Code&#x27;s (CC) status summaries used 16.4% of our token spend in
    a week! We have investigated a source of overhead in CC: it&#x27;s an agent_summary
    query that calls your current session&#x2F;subagent model approximately every
    30 seconds for a few words in CC’s status line.<p>Our DRIM system flagged the
    anomaly in CC&#x27;s OTEL traces. Grouping requests by query_source showed that
    over one measured week agent_summary accounted for: 16.4% of total estimated spend
    (versus 15.7% for the main conversation), and 19.7% of all API requests with approximately
    9,000 input tokens per output token.<p>Most requests reuse the prompt cache, but
    repeatedly reading a large cached transcript still has a cost. Longer contexts
    and more concurrent agents increase the overhead.<p>We couldn’t find a supported
    setting that disables only these summaries while preserving background agents
    and forks. Disabling those capabilities also stops the summaries, but changes
    the workflow we want to keep.<p>Our workaround is a small Bun preload that intercepts
    the summary timer without modifying the CC binary. It identifies the timer callback
    by source-text anchors and leaves other timers alone.<p>In controlled tests on
    Linux (from ver 2.1.257 to 2.1.312), the same workload produced five summary calls
    without the hook and zero with suppression enabled. On our current production
    setup, agent_summary calls remained at zero with the hook enabled. Background
    agents and forks continued running. The only visible change was that their generated
    status summaries stopped updating.<p>The workaround depends on implementation
    details. An update can break the callback matching and silently restore the requests.
    macOS and Windows are untested. If someone could help us with testing there, it
    would be much appreciated.<p>If you want to try it - the script, full technical
    explanation, test results, and installation instructions are on GitHub: <a href="https:&#x2F;&#x2F;gist.github.com&#x2F;flamerix-ai&#x2F;c3905705cc4205e5de3011fa2e74efce"
    rel="nofollow">https:&#x2F;&#x2F;gist.github.com&#x2F;flamerix-ai&#x2F;c3905705cc4205e5de3011fa...</a>'
