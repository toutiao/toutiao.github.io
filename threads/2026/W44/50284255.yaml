  content: "Instantly share code, notes, and snippets.\n\n[![@flamerix-ai](https://avatars.githubusercontent.com/u/335226770?s=64&v=4)](/flamerix-ai)\n\n#
    [flamerix-ai](/flamerix-ai)/**[README.md](/flamerix-ai/c3905705cc4205e5de3011fa2e74efce)**\n\n
    Last active \n\n- [Star110(110)](/login?return_to=https%3A%2F%2Fgist.github.com%2Fflamerix-ai%2Fc3905705cc4205e5de3011fa2e74efce)\n-
    [Fork5(5)](/login?return_to=https%3A%2F%2Fgist.github.com%2Fflamerix-ai%2Fc3905705cc4205e5de3011fa2e74efce)\n\n-
    \n\n- \n\n[Download ZIP](/flamerix-ai/c3905705cc4205e5de3011fa2e74efce/archive/2fe224167473e3185c104a5dbff7a788ab025b3b.zip)\n\n
    Claude Code burns ~15-20% of your tokens on a 3-word status line: a Bun preload
    that turns agent\\_summary off · by Flamerix AI, flamerix.ai · MIT \n\n[Raw](/flamerix-ai/c3905705cc4205e5de3011fa2e74efce/raw/2fe224167473e3185c104a5dbff7a788ab025b3b/README.md)\n\n[**README.md**](#file-readme-md)\n\n#
    Claude Code burns ~15–20% of your tokens on a 3-word status line. Here's how to
    turn it off\n\nby [Flamerix AI](https://flamerix.ai) · MIT License\n\n> Tested
    on Linux, Claude Code 2.1.257–2.1.312 (see Tested versions). The binary is not
    modified (`BUN_OPTIONS=--preload`). An update can silently undo it, so see Verify.\n\n##
    TL;DR\n\n    curl -fsSL https://gist.githubusercontent.com/flamerix-ai/c3905705cc4205e5de3011fa2e74efce/raw/no-agent-summary.js
    -o~/.local/share/no-agent-summary.js\n    claude daemon stop --any\n    BUN_OPTIONS=\"${BUN\\_OPTIONS:+$BUN\\_OPTIONS
    }--preload $HOME/.local/share/no-agent-summary.js\"claude\n\nTo make it permanent
    for every Claude Code process, see [Install](#install).\n\n## The problem\n\nEvery
    ~30 seconds, for every background agent, Claude Code sends that agent's **entire
    transcript** to the agent's own model (usually Opus) and asks it to \"describe
    your most recent action in 3-5 words\". The answer only updates the agent's status
    line in the agents panel; it never reaches the model or your conversation. There
    is no setting that turns it off, and since 2.1.232 (August 2026) it has been on
    by default.\n\nThe anomaly was detected by [DRIM](https://flamerix.ai) in Claude
    Code's OpenTelemetry export: grouping `claude_code.api_request` events by `query_source`
    showed `agent_summary` costing **more than the main conversation itself**.\n\nSpend
    here means Claude Code's own per-request estimate (`cost_usd`), not an invoice:
    on a subscription, what you lose is rate-limit headroom. We are not the only ones
    who measured it:[#86879](https://github.com/anthropics/claude-code/issues/86879)
    collects four independent measurements of 18–26 %.\n\n## The fix (how it works)\n\n`no-agent-summary.js`
    is a Bun preload (~80 lines of code). It wraps `setTimeout`/`setInterval`; when
    a callback's source text contains a summarizer anchor (e.g. the `[AgentSummary]
    Timer fired`log line), it returns an inert handle instead of arming the timer.
    Every other timer passes through untouched. In the OpenTelemetry export the suppressed
    requests are`claude_code.api_request` events with `query_source = agent_summary`.\n\nWhy
    a timer hook rather than something simpler: the module ships as precompiled Bun
    bytecode, so editing its JS text inside the binary changes nothing, and the API
    client does not go through a wrapped `globalThis.fetch`. But `Function.prototype.toString`
    still returns a callback's source even when it runs from bytecode, so the timer
    can be recognised by a string inside it. The inert timer uses exactly 2³¹−1 ms:
    Node and Bun treat a larger delay as 1 ms, so an \"infinite\" delay would fire
    at once.\n\n## Install\n\n1. Put `no-agent-summary.js` somewhere stable; note
    its **absolute** path.\n\n2. Set `BUN_OPTIONS` **globally** so every Claude Code
    process gets it. One of:\n\n3. Restart the daemon and every already-running session,
    then start Claude Code from an environment that has `BUN_OPTIONS`:\n\n### Env\n\n##
    Nuances\n\n- **Restart the daemon after install.** The daemon, pty host and pre-warmed
    `bg-spare` sessions inherit the environment of the client that started the daemon,
    so a daemon started before`BUN_OPTIONS` was set keeps spawning unhooked sessions.
    Hence `claude daemon stop --any`.\n- **Headless runs need it too:** `claude -p`,
    cron, CI, editor integrations.\n- **Platform:** Linux tested, macOS and Windows
    untested. On Windows the `/$bunfs/` gate most likely never installs the hook.\n-
    **A/B:** `CC_AGENT_SUMMARY_MODE=pass` loads the hook but arms every timer; the
    summaries come back, which shows the `off` result is the hook's doing.\n- **Background
    processes:** daemon, pty host and `bg-spare` must carry `--preload` in their environment
    (`/proc/<pid>/environ` on Linux); if not, restart the daemon.\n\n## Verify (after
    every update)\n\n1. **Preload loads:**\n\n2. **Timer suppressed:** with the same
    `BUN_OPTIONS` and `CC_AGENT_SUMMARY_LOG=/tmp/nas.log`, run a background subagent
    for a minute or two. The log shows`summary timer #1 suppressed (setTimeout, delay=30000)`
    and the agent's panel status stops updating. If you export OpenTelemetry, `query_source
    = agent_summary` should stay at zero; this is the only check that catches every
    failure mode.\n\n### Fail-open\n\nMatching is by **source text** : an anchor must
    sit inside the callback passed to the timer. If an update breaks that, the hook
    matches nothing and summaries silently come back. Ways it can happen:\n\n- the
    log line or query-source id is renamed;\n- the callback is passed via `fn.bind(...)`
    (no source in `toString`) or another wrapper;\n- the strings move to a shared
    constant outside the callback;\n- the timer moves to an unwrapped API (`timers/promises`,
    a scheduler loop).\n\nSo re-run Verify after every update.\n\n## Effect\n\n- We
    run it under every Claude Code process on our machine (2.1.301). Since then there
    have been zero `agent_summary` requests, and no other side query grew to take
    its place.\n- Subagents, background agents, forked skills and background sessions
    run normally; only the summary fork is skipped.\n- Visible change: the per-agent
    panel status stops updating; SDK `task_progress` has no `summary`.\n- Overhead:
    one `Function.prototype.toString` per distinct timer callback, cached in a `WeakMap`.`claude
    --version`: ~10 ms → ~17 ms (one measurement).\n\n## Tested versions\n\nLinux
    x64 binary from npm `@anthropic-ai/claude-code-linux-x64` (its sha256 equals the
    native installer's `manifest.json` checksum). **Static:** the extracted bundle's
    summary timer callback carries a hook anchor. **Live:** `claude -p --model haiku`
    with`CLAUDE_CODE_AGENT_PROGRESS_SUMMARIES=1`, one subagent doing 8 steps of ~20
    s, counting`[AgentSummary] Forking` in `--debug-file`.\n\n5 / 5 / 0 = the fork
    happens on this version, merely loading the hook changes nothing, and `off`removes
    it.\n\n## Why there is no setting for this\n\n- **The documented switch only turns
    it on.** The SDK option `agentProgressSummaries` defaults to`false`, but in the
    bundle it is one term of an OR, and every code path that writes it sets`true`.
    So `false` changes nothing, and the undocumented `CLAUDE_CODE_AGENT_PROGRESS_SUMMARIES`can
    only enable summaries too.\n- **The interval belongs to the server.** It comes
    from a per-model-family server flag and is clamped to 30–240 s. The default is
    already the minimum, and no value disables the timer.\n- **The obvious env vars
    miss.** `DISABLE_NON_ESSENTIAL_MODEL_CALLS`, which some packagers set, does not
    occur in the binary at all. `CLAUDE_CODE_FORK_SUBAGENT=0` and`CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1`
