  author: crote
  text: 'Considering the current trend is for SoCs to <i>deintegrate</i>: don&#x27;t
    count on it.<p>Putting RAM inside the logic die is crazy expensive - just look
    at how much footprint L3 cache takes up on a modern chip. It&#x27;ll always make
    more sense to put it in a separate die, made using RAM-specific processes. With
    Zen the memory controller and GPU has (once again) moved to a separate die, and
    with X3D we&#x27;re now even seeing separate <i>cache</i> dies.<p>There&#x27;s
    of course HBM if you want to consider that &quot;integrated&quot;, but the large
    cost bump, additional manufacturing risks, and loss of flexibility don&#x27;t
    make that an attractive proposition unless you <i>really</i> need the extra speed.
    Regular DDR dies? You gain basically nothing by co-packaging those.'
  score: 0
