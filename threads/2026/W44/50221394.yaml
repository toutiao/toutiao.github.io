  author: ACCount39
  text: It is - anything short of HBM can be replaced that way.<p>The issue, of course,
    is just how much time, effort and skill is required to do it.<p>It might become
    a viable commercial process outside third world countries if RAM prices spike
    even more - or if someone finds a way to teach an off the shelf $1000 robot arm
    advanced autonomous microsoldering.<p>Then there&#x27;s the problem of forcing
    the device itself to recognize the new RAM. It&#x27;s a device-specific trick.
    RAM sticks have a little tag chip that tells a PC &quot;how much RAM this stick
    has&quot;, but RAM chips themselves don&#x27;t - so the device has to infer its
    RAM capacity from elsewhere. Like strap resistors on the board. Which you have
    to find and adjust for the new RAM capacity. That, or fix the RAM values in firmware,
    which is also device-specific.
