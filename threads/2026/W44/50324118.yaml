  author: Kevin_Flynn
  text: "&gt; I don&#x27;t think the difficulty is with the drivers, more with the
    logistics of retraining them all at once.<p>The only events that happen &quot;all
    at once&quot; are in our heads as hypotheticals.<p>In the real world, every change
    takes time to propagate.<p>It stands to reason, all of the &quot;experts&quot;
    of the world are going to be in less demand than they were before, because some
    percentage of people, will replace them with AI, for some percentage of tasks.<p>Stated
    another way, each of us will be consulting with AI more, and assigning some number
    of tasks to a non-expert, with the help of expertise from AI, and talking to human
    experts less frequently.<p>Interactions will decrease in frequency. In the commercial
    space, this means transactions will decrease in number and amount. This is &quot;bad&quot;
    for everyone, in the financial sense. Corporations lose revenues, governments
    lose revenues, employees get pay cuts, etc.<p>But downward trajectories on financial
    charts have been a problem for every fiat based economy we know of, long before
    AI came into the picture. The only thing people universally agree upon when sales,
    taxes, salaries, etc start going down, is that &quot;confusion&quot; is the first
    response, followed shortly by &quot;panic&quot;, followed by &quot;doing something
    to fix it&quot; followed by &quot;pretending it worked, even if it didn&#x27;t.&quot;<p>Maybe
    AI will teach the world what to do when the charts turn down instead of up.<p>Infinite
    growth doesn&#x27;t exist in a closed ecosystem, and we arent expanding into space
    yet.<p>For decades magazines and other media have promoted the idea that some
    day, technology will relieve us of the base burden of existence, and free us to
    do all those wonderful leisure activities we enjoy.<p>Now that AI seems to be
    able to deliver on the promise, the thing we seem to fear the most is the deflation
    of our own egos.<p>A conversation with an AI agent carries as little as $0.00
    transactional cost, with a few cents in electricity expense, after the small fixed
    capital outlay for the computer.<p>A conversation with a consultant costs $200
    an hour, and benefits taxing authorities, gas stations, phone companies, etc etc
    etc.<p>Again, it stands to reason, if we replace an expensive form of communication,
    with one that is almost free, that people are going to use it, and all those &quot;expenses&quot;
    they save on, were someone elses income.<p>The end game ... most of us will adapt,
    and some of us will self destruct during that process, and in 1 or 2 generations,
    everything will be &quot;normal&quot; again, and AI will be taken for granted,
    and we&#x27;ll all be worrying about the new crisis.<p>Lets all remember, &quot;the
    economy&quot; as studied by economists, is the study of human behavior at its
    core, and its generally agreed that the human animals greatest natural defense
    is its intelligence and ability to adapt to its environment.<p>Keep calm. Carry
    on. This isn&#x27;t a scarcity problem. It&#x27;s an abundance problem."
