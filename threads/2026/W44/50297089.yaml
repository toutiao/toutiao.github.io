  url: https://journal.animationstudies.org/article/id/66/
  title: |-
    Akimoto | A Pig, the State, and War: Porco Rosso (Kurenai no Buta) |
        Animation Studies Journal
  fetch_status: success
  content: "![A Pig, the State, and War: Porco Rosso (Kurenai no Buta)](/media/cover_images/32a1852c-fcda-4630-b063-f82dd00354b3.jpeg)\n\nArticle\n\n#
    A Pig, the State, and War: _Porco Rosso_ (_Kurenai no Buta_)\n\n**Author:** Daisuke
    Akimoto \n\n**Keywords:** animation, militarism, Miyazaki, nationalism, non-killing
    policy, war\n\n**How to Cite:**\n\nAkimoto, D., (2014) “A Pig, the State, and
    War: _Porco Rosso_ (_Kurenai no Buta_)”, _Animation Studies Journal_ 9(1). doi:
    [https://doi.org/10.64864/a85b8d7f-b345-4fd3-a0ff-4f1b600c9b97](https://doi.org/10.64864/a85b8d7f-b345-4fd3-a0ff-4f1b600c9b97)\n\n**Downloads**
    \ \n[Download HTML](/article/66/galley/68/download/)\n\n**Introduction**  \nHistorically,
    animated cartoons and movies have been used as ‘propaganda’ in war (Roffat 2011).
    Some animated films, however, contribute to conveying an anti-war pacifist point
    of view (Takai 2011). As such, the film _Porco Rosso_ (1992) can be categorized
    as “anti-war propaganda” (Okuda 2003, p. 144). Although Miyazaki has been attracted
    by seaplanes designed and manufactured during the period between the First World
    War and the Second World War (Kiridoshi 2008, p. 72), this film conveys the important
    memory of war, especially the interwar era and the post-Cold War world. Indeed,
    in an interview just before the release of _Porco Rosso_, Miyazaki stated that
    the film is relevant to the Gulf War, and referred to the Yugoslav Wars as ethnic
    and nationalistic conflicts (Miyazaki 1996, p. 519; Miyazaki 2002, p. 95). In
    this context, the film forwards Miyazaki’s anti-war message.This paper examines
    _Porco Rosso_ (_Kurenai no Buta_), which is based on 15 pages of _Hikotei Jidai
    (__The Golden Age of the Flying Boat)_, a comic created by Hayao Miyazaki and
    released in the animation journal, _Model Graphics_, No.14-16 in 1990 (Kiridoshi
    2008, p. 72). A synopsis of the comic story is literally “typed” at the beginning
    of _Porco Rosso_, as follows: “This motion picture is set over the Mediterranean
    Sea in an age when seaplanes ruled the waves. It tells a story of a valiant pig,
    who fought against flying pirates, for his pride, for his lover, and for his fortune.
    The name of the hero of our story is Crimson Pig.” Scholarship on this film has
    focused on issues of “war and peace,” especially in terms of the “non-war” (_hisen_)
    message (e.g. Okuda 2003). Similarly, Kazami et al (2002), among others, (Kano
    2006; Kiridoshi 2008) provide some answers to the central question of the film:
    Why did Porco turn into a pig? The primary reason is that he was traumatized by
    the war. Building on Kazami et al’s work, this paper attributes the reason that
    Porco became a pig to the following three aspects: “man, the state and war” (Waltz,
    1959). According Kenneth Waltz, theorist of international politics, the causes
    of war occur on three levels: individual, domestic, and international. Like Waltz,
    I argue here that Porco became a pig because he hates the following three factors:
    man (egoism), the state (nationalism) and war (militarism). Accordingly, my analysis
    of _Porco Rosso_ is situated in the framework of peace research and international
    relations, such as non-killing philosophy, soft power/hard power, and conflict
    prevention/conflict resolution.  \n**Methodology**  \nIn the field of animation
    studies, animation films by Studio Ghibli have been frequently analyzed as a case
    study. Ghibli animation films are “often considered as artistic productions, both
