    as a symbol of nuclear weaponry. The confrontation between Pejite and Tolmekia,
    the two powerful countries in the story can similarly be regarded as reflection
    of the Cold War bipolar structure (Akimoto 2014a). _Laputa: Castle in the Sky_
    (1986) was also created during the middle of the Cold War. The number of nuclear
