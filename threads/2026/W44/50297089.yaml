    films also have been discussed compared with Disney animation. For instance, Kaori
    Yoshida (2011) offered a comparative analysis on Disney’s _Pocahontas_ (1995)
    and Ghibli’s _Princess Mononoke_ (1997) in terms of national identity. Moreover,
    some scholars (e.g. Kano 2006; Kiridoshi 2008) provided comprehensive thematic
