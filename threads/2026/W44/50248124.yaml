  author: tedsanders
  text: 'I work at OpenAI and I can try to explain our logic.<p>In general, LLM performance
    is incredibly multidimensional. There&#x27;s no guarantee of a fixed ordering
    where the model that is best at math is also the model that&#x27;s best at jokes.
    Despite that complexity, much of the variation in performance is explained by
    just a single variable: model size. In general, models that are bigger will (a)
    be more performant &#x2F; reliable, (b) cost more per token, and (c) have better
    recall of esoteric facts. As you note, our models are ordered:<p>Luna &lt; Terra
    &lt; Sol &lt; Astra<p>Even today, I&#x27;d recommend this as a general starting
    point for picking models. If you care about quality only, pick Astra. If you&#x27;re
    a bit price sensitive, pick Sol. If you&#x27;re very price sensitive, pick Terra
    or Luna.<p>Of course, model size doesn&#x27;t capture all variation. Models that
    are trained later might have new data or new techniques or new architectures that
    earlier models lack. You can see this with models from all providers - Sonnet
    5.5 outperforms Fable 5.1 in ways, and Gemini 3.8 Flash outperforms 3.1 Pro in
    ways.<p>In the case of GPT-6.1 Terra, I&#x27;d say Terra is probably better than
    Astra and Sol at technical communication, similar on vision and computer use (but
    much faster!), and a bit worse on most other things. For API developers, it&#x27;s
    a nice midrange option if you want something cheaper than Sol but a lot smarter
    than Luna (especially for vision &#x2F; computer use &#x2F; communication). For
    subscribers, it&#x27;s not a bombshell release - if you&#x27;re hitting usage
    limits, maybe it helps you go a bit further, and if you want clearer communication
    or faster computer use, it can be a nice option to select.<p>If you have suggestions
    on how to name our products better, I&#x27;m all ears. Our intention is to make
    things clear and simple, even if we miss the mark sometimes.<p>Unfortunately,
    a lot of the complexity is somewhat irreducible and due to to the actual complexity
    of the products. Scaling model size is different from scaling reasoning effort
    which is different from scaling multi-agent count. So if we just swept all of
    those under a single name of &quot;more IQ&quot;, it would make the naming simpler
    but the experience much worse, as important details would be obfuscated from end
    users.'
