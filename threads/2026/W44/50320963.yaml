  author: ltbarcly3
  text: Gluten allergies are relatively rare and <i>extreme</i>.  People with Celiac
    have a major, sometimes life threatening reaction to gluten.<p>People who do not
    have Celiac and say they are gluten sensitive usually are not.  They are either
    experiencing a nocebo effect or have gas from other components of wheat rather
    than gluten.  Actual non Celiac reactions to gluten are minor if they exist at
    all.  So when someone says they are gluten sensitive it is overwhelmingly likely
    they either have Celiac and even a very very tiny amount of gluten will cause
    them horrible consequences, or they are incorrect and they are not sensitive to
    gluten at all.<p><a href="https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;27523634&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;27523634&#x2F;</a><p><a
