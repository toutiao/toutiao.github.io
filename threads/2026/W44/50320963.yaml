  author: adrian_b
  text: No, Einkorn is not the ancestor of all cultivated wheat varieties, unless
    you extend the history of wheat a very long time before domestication, when that
    becomes somewhat true, because the wild ancestor of emmer wheat was produced by
    genome duplication from a wild ancestor of einkorn wheat.<p>At the start of the
    Neolithic, besides barley, 2 species of wheat were domesticated separately and
    they evolved through domestication into einkorn wheat and emmer wheat.<p>Einkorn
    wheat has always remained a minor crop, while either barley or emmer was the major
    crop, depending on soil and climate. For instance in the early Ancient Greece
    barley was the most important, while in the early Roman Republic emmer was the
    more important. Later, emmer (&quot;far&quot; in Latin) was mostly replaced by
    durum wheat (&quot;triticum&quot; in Latin), and even later durum wheat was mostly
    replaced by the hexaploid bread wheat (&quot;siligo&quot; in Latin).<p>Besides
    the original emmer and einkorn, other wheat subspecies have appeared many thousands
    of years later after domestication, either through mutations, like the tetraploid
    durum wheat (pasta wheat) or through hybridization, like the hexaploid bread wheat
    (and also the hexaploid spelt wheat).
