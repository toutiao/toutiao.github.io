  author: teleforce
  text: '&gt; All of the wheat types Grossi had previously seen grew only one such
    ear. But the tall wheat grew a full seven ears, always in the same pattern: a
    long one with six shorties bunched up around it like little fingers. Even the
    kernels themselves were bigger than those of average wheat. And unlike the typical
    pale-yellow wheat kernels, they came in a rainbow of colors—yellow, black, red,
    white and even green, sometimes all on the same stem. Grossi, a grain farmer his
    whole life, had never seen anything like it. “I thought it was a freak of nature,”
    he says. He couldn’t find a mention of it in agricultural books.<p>Thanks for
    sharing the story about this ancient wheat but I recall reading about this highly
    productive type of grains not in agriculture books but in holy books.<p>Fun facts,
    this type of miracle grain is mentioned in Abrahamic religions holy books namely
    Bible (Old Testament) and Quran.<p>In Surah Al-Baqarah (2:261), &quot;The example
    of those who spend their wealth in the cause of Allah is that of a grain that
    sprouts into seven ears, each bearing one hundred grains. And Allah multiplies
    ˹the reward even more˺ to whoever He wills. For Allah is All-Bountiful, All-Knowing.&quot;<p>In
    the Book of Genesis (Genesis 41:5), &quot;He fell asleep again and had a second
    dream: Seven heads of grain, healthy and good, were growing on a single stalk.&quot;<p>This
    exact multiplication of deeds described in the Quran demonstrates the 700-to-1
    ratio represents the actual biological maximum yield for that specific ancient
    wheat variety under optimal conditions.<p>All this while I thought the description
    is metaphorical allegory, but it seems originated from real grains of wheat phenomenon.<p>The
    scriptures specifically mentioned &quot;sanabila&quot; a type of grain with multiple
    ears branching out from a single stalk unlike rice paddy that&#x27;s grow ears
    differently.<p>Another fun facts, in Arabic the word &quot;sabil&quot; meaning
    providing freely flowing water to travellers, and sanabila share the same root
    word, most probably derived from this very verse, because charity in Arabic, Hebrew
    and Aramaic is sadaqa.<p>Please note the only Quran in Chapter of Al- Baqarah
    (Female Cow) mentioned the analogy of multiplications for doing good deeds [1].<p>The
    other verses, one verse inside Bible in Chapter Genesis and two verses inside
    Quran in Chapter Yusuf (Joseph) refer to Egypt Pharaoh&#x27;s or King&#x27;s dream,
    respectively. This led to the introduction of the brilliant economic policy that
    saved Egypt kingdom from the severe famine that effect other sorrounding kingdoms
    at the time as per Yusuf&#x27;s advice based on the correct interpretation of
    the King&#x27;s dream [2],[3],[4]. Yusuf later become one of the appointed ministers
    of Egypt from the very humble beginning of a slave boy, and brought along other
