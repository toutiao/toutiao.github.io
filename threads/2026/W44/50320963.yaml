  title: An Italian Farmer Found Some Unknown Seeds in His Attic and, With Nothing
    to Lose, Planted Them. The Result Was Almost Biblical
  fetch_status: success
  content: "_At his farm near Parma, Italy, Claudio Grossi offers a visual history
    of his miracle grain in photos, crackers and loaves.\n              Clara Vannucci_\n\nSometime
    in the&nbsp;early 1990s, Claudio Grossi, a 40-year-old farmer in Parma, in northern
    Italy, was cleaning his attic when he turned up an old sack full of seeds that
    he couldn’t identify. The bag, he was sure, had been left by his late great-grandfather,
    who’d started the farmstead around 1915. Grossi had no idea how long the seeds
    had been sitting there, deprived of water, soil and sun. Dry and cracked, the
    kernels looked so old in the palm of his hand that he doubted anything would ever
    sprout from them. He carried the bag down the stairs, shook the seeds out into
    a pile of manure and then forgot about them.&nbsp;\n\nTo his surprise, the seeds
    soon sprouted a few different types of wheat. One was particularly striking: At
    six feet high, its plants were about twice as tall as commercial wheat. But the
    most remarkable feature came when it developed ears—the grain-studded parts at
    the top of the plant. All of the wheat types Grossi had previously seen grew only
    one such ear. But the tall wheat grew a full seven ears, always in the same pattern:
    a long one with six shorties bunched up around it like little fingers. Even the
    kernels themselves were bigger than those of average wheat. And unlike the typical
    pale-yellow wheat kernels, they came in a rainbow of colors—yellow, black, red,
    white and even green, sometimes all on the same stem. Grossi, a grain farmer his
    whole life, had never seen anything like it. “I thought it was a freak of nature,”
    he says. He couldn’t find a mention of it in agricultural books.\n\n![Ears grown
    from the very first seeds Grossi discovered in his attic.](https://th-thumbnailer.cdn-si-edu.com/o2Sj6JHbNPgZisrRICpFsVB_V2I=/fit-in/1072x0/filters:focal(1181x787:1182x788)/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer_public/9c/3f/9c3f24a3-7ca6-4ffb-85e5-ee71a11c5991/l2190993_copy.jpg)\n_Ears
    grown from the very first seeds Grossi discovered in his attic. Grossi prizes
    these first grains, now preserved under glass in his kitchen.\n    \n    \n      Clara
    Vannucci_\n\n[![Cover image of the Smithsonian Magazine November 2026 issue](https://th-thumbnailer.cdn-si-edu.com/zzRLTt5aAApiF8BgsfyTEJF2Lc8=/fit-in/300x400/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer_public/93/55/9355363a-7072-47d9-ad17-a35e22de47a0/nov2026_-_web_cover_1024.jpg)](https://subscribe.smithsonianmag.com/?idx=1913&inetz=article-banner-ad&promo_name=current-issue&promo_position=in_article&promo_creative=button&promo_id=subscribe)\n\n###
    [Subscribe to _Smithsonian_ magazine now for just $19.99](https://subscribe.smithsonianmag.com/?idx=1913&inetz=article-banner-ad&promo_name=current-issue&promo_position=in_article&promo_creative=button&promo_id=subscribe)\n\nThis
    article is a selection from the November 2026 issue of _Smithsonian magazine_\n\nFor
    Grossi, a practicing Catholic, the next insight came from a different book altogether.
    Leafing through a Bible at church one Sunday, he found [a passage](https://www.biblegateway.com/passage/?search=Genesis%2041%3A5-7&version=KJV)
    in the Book of Genesis describing a stalk with seven ears, in a dream that Joseph
    interprets for the Pharaoh: “And he slept and dreamed the second time: And, behold,
    seven ears of grain came up upon one stalk, rank and good. And, behold, seven
    thin ears and blasted with the east wind sprung up after them. And the seven thin
    ears devoured the seven rank and full ears.” To Grossi, that sounded just like
    the mysterious crop in his manure pile.\n\n“I connected the dots,” Grossi says.
    _That grain must be really ancient_, he thought. _And if people were farming this
    odd-looking wheat in biblical times, why does no one today?_&nbsp;\n\nBack on
    his farm, Grossi harvested the grain, milled it into flour and baked a loaf of
    bread in his kitchen. Compared with commercial wheat, the dough didn’t rise well,
    but as the loaf sat in the oven, it filled the kitchen with a surprisingly nutty
    and delicious aroma. Once finished, it had a rich, satisfying taste. “You get
    these notes of sweetness that you can’t find in regular commercial flour,” he
    says.&nbsp;\n\nDid you know? More miracles of grain in the Bible\n\n- In [2 Kings
    4:42-44](https://www.biblegateway.com/passage/?search=2+Kings+4%3A42-44&version=NIV),
    Elisha multiplies 20 barley loaves in order to feed 100 men—anticipating Jesus’s
    “Feeding of the 5,000” in the gospels.&nbsp;\n\n- In [1 Kings 17:8-16](https://www.biblegateway.com/passage/?search=1%20Kings%2017%3A8-16&version=NRSVUE),
    Elisha helps a widow at Zarephath to outlast a drought and famine with only a
    handful of flour and a little oil.&nbsp;\n\n- In [Judges 7:9-15](https://www.biblegateway.com/passage/?search=Judges%207%3A9-15&version=NRSVUE),
    a Midianite soldier recounts a dream in which a barley loaf tumbles into the camp
    and overturns a tent. Gideon, the judge and military leader, recognizes the dream
    as a sign that God will deliver the Midianites into Israel's hands.&nbsp;\n\n-
    In [2 Kings 4:38-41](https://www.biblegateway.com/passage/?search=2%20Kings%204%3A38-41&version=NRSVUE),
    during a famine, someone gathers wild gourds and cuts them into a pot of stew.
    The diners discover that the stew is dangerous and cry out to Elisha. He calls
    for flour and throws it into the pot—and the stew becomes miraculously safe to
    eat.&nbsp;\n\n![Grossi holds sheaves of his grain](https://th-thumbnailer.cdn-si-edu.com/r1H2iX5288YkTulSGgz89zNqN8o=/fit-in/1072x0/filters:focal(655x986:656x987)/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer_public/8c/57/8c575784-4d94-44d3-a83b-1f65f4f0454e/l2190314.jpg)\n_Grossi
    holds sheaves of his grain, cultivated on the same farm his great-grandfather
    tilled starting around 1915. \n    \n    \n      Clara Vannucci_\n\nGrossi discovered
    it had other advantages: It was hardier and more self-sufficient than commercial
    varieties. It fared better during droughts, growing so tall that it overshadowed
    the weeds. It didn’t need fertilizer or herbicides. Indeed, it seemed so superior
    to its industrial cousins that he thought of it no longer as a freak of nature
    but as a wonder. He dubbed it [_grano del miracolo_](https://www.molinograssi.it/en/sustainability/our-supply-chains/grano-del-miracolo/)—“miracle
    grain” or “miracle wheat.”&nbsp;\n\nGrossi’s discovery came at just the right
    time. In Italy in the 1990s, a burgeoning slow-food movement aimed to preserve
    traditional farming practices and promote natural diets.&nbsp;\n\nGrossi hoped
    that miracolo could ride this slow-food wave, becoming both a portal to the past
    and a passage to a future. Perhaps, he thought, miracolo could help other farmers
    bring back ancient grains, leading the movement that is changing how we make bread,
    a staple of the human diet. And today, as climate change makes droughts, heat
    waves and plant disease outbreaks more frequent and intense, a grain that has
    shown it can fend for itself would help keep that bread on the table.&nbsp;\n\n*
    * *\n\nFarmers began&nbsp;cultivating wheat about 10,000 years ago, in the [Fertile
    Crescent](https://www.britannica.com/place/Fertile-Crescent)—the area of the Middle
    East known as the Cradle of Civilization. Thousands of years ago, the hardy and
    adaptable plant took hold in Europe and Asia. Compared with our modern crops,
    these ancient wheats were much taller, outperforming other grasses in the field.
    &nbsp;\n\nOver the millennia, humans bred different varieties of wheat, some yielding
    less grain and others more. As human populations grew, the strains of wheat that
    brought plentiful harvests became more desirable. That pattern accelerated amid
    the upheavals of the early 20th century. By the early 1920s, Italy was still recovering
    from World War I and unable to grow enough grain to sustain itself; the country
    was importing roughly a third of its wheat. When fascist leader Benito Mussolini
    became prime minister in 1922, he lau"
