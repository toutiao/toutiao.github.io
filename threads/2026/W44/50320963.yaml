  text: 'key points about wheat Gross (the Italian farmer) discovered in 1990 his
    attic:<p>+ It fared better during droughts, growing so tall that it overshadowed
    the weeds. It didn’t need fertilizer or herbicides.<p>+ It&#x27;s height can be
    a liability. Heavy winds, rains and hail can make the tall stems flip over before
    the grain ripens, ruining harvests.<p>+ Working with the lab of Teofilo Vamerali,
    Perobelli determined that the grain was Triticum turgidum—literally “swollen wheat”
    in Latin. Known in English as “poulard wheat,” it had originally evolved in what
    today are Turkey, Egypt and other nearby Mediterranean countries. And searching
    agricultural references, Perobelli found that it had been grown in Italy, too,
    until farmers shifted toward higher-yield commercial varieties. That solved the
    mystery of the seed bag stashed away in the attic: It had survived because Grossi’s
    grandfather saved some of the heritage grains.'
