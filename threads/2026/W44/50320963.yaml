  author: aDyslecticCrow
  text: Short grains are modern;<p>- allow modern machines to harvest it more easily<p>-
    move slighly more of the plants energy into the seed<p>- prevent wind damage.
    (small farms bordered with trees was more typical historically)<p>On the historical
    side;<p>- The long stalks allow the crop to be bundled and dried without the seed
    touching the ground.<p>- It makes the stalks themselves useful as a building material
    in walls, roofs, isolation, bedding.<p>- It makes for a good grip as the seeds
    are pulled form the stalks with an historical thresher.<p>In short, we didn&#x27;t
    start breeding grains to be short until modern post industrial farming techniques.
    Short grain does provide better yield on industrial mono-crop farming. But would
    have been seen as worse historically.
