  author: adrian_b
  text: Nutrients are divided into micronutrients, most of which are needed in quantities
    much smaller than 1 gram per day, i.e. vitamins, minerals, essential fatty acids
    and a few amino-acid derivatives, and macronutrients, which form the bulk of what
    you eat, i.e. carbohydrates, protein and fat.<p>What you mean is that modern wheat
    was selected for high production per area, which can be attained only when the
    seeds contain smaller amounts of micronutrients, so that their limited availability
    will not inhibit growth.<p>On the other hand, all plant seeds, including wheat
    seeds, in their dry form consist almost only of nutrients, unlike the other plant
    parts, which usually have very little nutrient content.<p>So wheat seeds and also
    the white flour made of them are very rich in nutrients, but only in 2 kinds of
    nutrients, starch and protein.<p>Animals, including humans, need a great number
    of essential nutrients in order to survive, around 50 different chemical substances.<p>White
    bread provides energy and protein that has a good amino-acid profile, except for
    low amounts of the amino acid lysine.<p>For complementary proteins and for the
    very small amounts of micronutrients that are required for a complete food, one
    must eat something else.<p>There exists no natural food that has a perfect composition
    that would allow humans to live eating only that (except mother milk for small
    babies).<p>So anyone must eat a combination of different kinds of foods. People
    who are rich might choose to eat some paleo diet or some keto diet and it is possible
    to conceive such diets that are healthy.<p>However most of the humans must allocate
    a limited budget for food, and within these constraints there are large areas
    in various places of the Earth, including Europe, where any healthy diet of optimum
    cost must include a non-negligible fraction of wheat.<p>For those who unfortunately
    suffer of celiac disease, a higher cost of food is unavoidable.
