  author: phyzome
  text: More on the &quot;other components&quot; issue -- a lot of people have issues
    with some of the fermentable carbohydrates (e.g. fructans) in wheat, which also
    happen to be present in the other gluten-containing grains. &quot;Have gas&quot;
    is a bit of an understatement. For some people this can lead to cramps, vomiting,
    and other fairly severe digestive problems.<p>So people on the low-FODMAPs diet
    end up using &quot;gluten free&quot; as a convenient shorthand for &quot;doesn&#x27;t
    contain these particular grains&quot;.
