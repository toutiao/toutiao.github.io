  text: 'The forms of vitamin A you get from carrots and other plants (called carotenoids)
    aren&#x27;t toxic, but the form you get from animal products and supplements (called
    retinols) can be. The US recommended daily intake for an adult male is 900 μg,
    which is also the recommended daily maximum for 4-8 year old children. This maximum
    includes a hefty safety margin, so there&#x27;s no reason to worry if your children
    eat the same food as you.<p>Except if you really like liver. Chicken liver contains
    more than 4000 μg&#x2F;100g and the liver of other animals contain more. And then
    you start skirting dangerous levels. Apparently Inuits would avoid eating liver
    for this specific reason and a few Arctic explorers became ill partly because
    of this.<p>Sources: the Wikipedia articles on Vitamin A and Hypervitaminosis A,
    so reader beware.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Vitamin_A"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Vitamin_A</a><p><a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Hypervitaminosis_A" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Hypervitaminosis_A</a>'
