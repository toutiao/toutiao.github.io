    remarks of HON. WATKINS M. ABBITT of Virginia IN THE HOUSE OF REPRESENTATIVES
    Wednesday, April 3, 1957<p>-------------------------------------------<p>U.S.
    GOVERNMENT PRINTING OFFICE<p>Folks forget or underestimate how bitter the opposition
