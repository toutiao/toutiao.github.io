  text: One of the things I have of my father is an envelope which has some brass
    bits in it (I believe for a scale) which was mailed to my great uncle, addressed
    by hand, with only the county and state for an address in 1957 from Washington,
    D.C. with a postmark &quot;Pray for peace&quot; and in a box on the left of the
    envelope is written:<p>-------------------------------------------<p>House of
    Representatives, U.S.<p>Part of Congressional Record --- Free<p>FEDERAL GOVERNMENT
    AND NAACP IN COLLUSION TO FORCE SCHOOL INTEGRATION IN VIRGINIA<p>Address by Honorable
    Harry Flood Byrd before the Richmond Kiwanis Club, Richmond, Va<p>Extension of
    remarks of HON. WATKINS M. ABBITT of Virginia IN THE HOUSE OF REPRESENTATIVES
    Wednesday, April 3, 1957<p>-------------------------------------------<p>U.S.
    GOVERNMENT PRINTING OFFICE<p>Folks forget or underestimate how bitter the opposition
    to the Civil Rights Movement was.<p>I was taught to gut a squirrel by the son
    of a freed slave who lived behind the home in Virginia where my family retired
    to, he had worked alongside my grandfather as a sharecropper on my paternal grandmother&#x27;s
    father&#x27;s farm.<p>and it&#x27;s worth noting that that county was one of the
    last to integrate in Virginia, facilitated by student teachers from a college
    in a nearby town whose post office is named for Watkins M. Abbitt.
