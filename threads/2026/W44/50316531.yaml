  author: TacticalCoder
  text: "&gt; How else can you stay safe against a threat that exfiltrates your entire
    digital life in like 10 seconds?<p>I moved part of my wealth to a private bank,
    on an account requiring several signatures (from different persons) plus a vetting
    from the banker for every single outgoing transfer. Not only are several manual
    signatures required, in addition to that the banker <i>must</i> call me before
    authorizing any transfer, even if it&#x27;s only, say, 1 000 EUR (now it&#x27;s
    not a retail bank and that&#x27;s kinda the whole point: transfers are rare and
    when one is done, no matter the amount, a shitload of verification do happen).<p>In
    addition to that, I told my banker that should anything out of the ordinary happen
    (say an order to suddenly wire 100 K to Dubai or Erithrea or something), then
    he should go out of his way to make me come in person to the bank to confirm the
    transfer.<p>You must <i>train</i> your banker: you must demo him voice impersonation
    on the phone. You have to make him become totally paranoid too.<p>I&#x27;m not
    going to say he&#x27;s my buddy, but he knows I know my shit and we regularly
    talk for 20 minutes on the phone.<p>Any transfer to a new bank account: long discussion
    explaining what that account is and why I&#x27;m moving money there.<p>I&#x27;ve
    also got digital files (say administrative stuff, stuff from notaries, etc.),
    encrypted, that I myself cannot easily access. For to access them I <i>must</i>
    physically go to my safe at a bank first. And trying to impersonate me physically
    at the bank to steal my stuff means: <i>&quot;on your way out, you risk being
    locked in the secure airlock and then spend years behind bars&quot;</i>.<p>&gt;
    Makes me want to have like 5 separate computers:<p>I have a setup not totally
    unlike that. For example one phone with <i>one</i> additional app: the country&#x27;s
    official &quot;electronic ID&quot; thinggy. And I don&#x27;t browse from that
    phone.<p>I&#x27;ve got several computers and there&#x27;s definitely my &quot;trash
    computer&quot;, complete with bogus email accounts and crappy apps, etc.<p>&gt;
    How else can you stay safe against a threat that exfiltrates your entire digital
    life in like 10 seconds?<p>The first thing is recognizing there&#x27;s an issue
    if someone hacking your unique email then can steal everything you have. Many
    people stop there: they think, as in the XKCD, <i>&quot;it&#x27;s game over anyway
    if someone gets my email, so I may as well not worry about it&quot;</i>.<p>That
    is the mentality of losers.<p>You&#x27;re already well ahead of the crowd by recognizing
    there&#x27;s a problem and by thinking about solutions.<p>Many things can be done
    to lower the risk of a full compromise. I&#x27;ve got two physical LANs and the
    absolute most sensitive stuff (e.g. my banking apps) are done from a computer
    that does nothing but email + bank.<p>So it&#x27;s not just a separate computer:
    separate computer on a separate physical LAN (not a VLAN). And there a tiny Pi
    doing the bridging between the two LANs. And of course it&#x27;s got a serious
    firewall (a lost art, but it could make a comeback with the help of LLMs).<p>Something
    else that can help is stuff like Google Workspace and keeping the credentials
    for the admin account very secure and hardly ever logging into it. That way if
    &quot;jack@acme.com&quot; gets compromised, there&#x27;s still &quot;admin@acme.com&quot;
    that can help get back control of jack@acme.com.<p>&gt; - one for development
    only<p>I&#x27;ve got a user account for dev only.<p>&gt; - one for gaming only<p>A
    dedicated computer for gaming yes.<p>&gt; - one for socials only<p>Besides HN,
    I don&#x27;t need those.<p>It&#x27;s a wild world out there.<p>The hacks won&#x27;t
    stop coming and you&#x27;re not anywhere near paranoid enough."
