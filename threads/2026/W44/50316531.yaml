  author: Aurornis
  text: I’ve been spinning up VMs or Docker containers for development. Run the harness
    inside the VM or container. Note I do this on Mac so the Docker containers are
    actually in a VM, but standard disclaimers about Docker not being meant for security
    apply.<p>Popular harnesses have mature enough remote access features that I can
    use the same interfaces and even mobile apps.<p>If you’re not familiar with Docker,
    you can even have an LLM set up the environment for you and help you start and
    stop the container. If you do this, be very sure that you switch to having a harness
    run inside the VM or container, not having the harness on the host machine run
    commands inside the container. If you do the latter style, it will be running
    commands on the host which is what you want to avoid.
  score: 0
