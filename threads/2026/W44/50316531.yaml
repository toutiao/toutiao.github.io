  text: AI dev environment gets its own SSD. The second SSD stays in, but since it&#x27;s
    encrypted there&#x27;s no way to exfiltrate the data unless you&#x27;re of interest
    to nation state attackers. Theoretically the AI could destroy the other SSD but
