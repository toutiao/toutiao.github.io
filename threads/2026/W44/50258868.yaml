  author: lordnacho
  text: 'I always build a massive testing harness. I care about correctness, of course,
    and that is normally dealt with by the AI without having to ask. If you ask for
    a function, it will write tests.<p>But I also care about the complexity classes
    of the solution. I prod it about the time and space complexity, and about cache
    locality.<p>I do a lot of black box testing: take the solution, see if it does
    what I expected, then bake in those expectations in a document.<p>I find that
    if I do those things, it produces better code than I could do in the same time.<p>I
    also think it&#x27;s more or less the same as how I used to work, just more thorough
    and with fewer time-consuming, trivial bugs.'
