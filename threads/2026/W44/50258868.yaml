  author: mrothroc
  text: 'This matches my own experience, pre-AI. As I&#x27;ve moved from IC to having
    a team over the years, more code was being written than I could possibly understand
    at the depth I would have if I&#x27;d written it myself.<p>The skill I learned
    is exactly as you describe: understand the system. For me, this means &quot;boxes
    and lines&quot;, the components and how they interact. I&#x27;ve encouraged developers
    on my team to make sequence diagrams part of their deliverable, because it helps
    both of us put the code in the context of the system.<p>The boxes can be opaque
    because I know the boundaries and expected inputs and outputs. This tells me when
    I need to go in a box: is it sending a malformed message? I can trace that back
    into the code.<p>I think that&#x27;s the skill we have to cultivate now that coding
    agents produce far more than we can review line-by-line. The system view is the
    map, and the boundaries tell us where to go hunting inside the box.'
  score: 0
