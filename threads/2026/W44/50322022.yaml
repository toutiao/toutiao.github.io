  author: alwa
  text: Sometimes humans bridge the gap to carry stuff in (firmware updates, say;
    or data for analysis, or reference material), and the hope is that no medium allows
    data to flow the other way. So depending on the sloppiness of the enterprise,
    you might be able to get stuff in but not out.<p>In the Stuxnet attack, famously
    [0], the malware propagated via craftily-formed autorun.inf on USB sticks that
    ferried data into the facility. Nothing crossed the otherwise-robust air gap in
    the other direction, but nothing had to in that case.<p>Lessons have been learned
    since then, but this sort of possibility (electromagnetic exfiltration vector)
    has, for quite a long time, been taken seriously enough to inform secure facilities’
    physical design [1].<p>[0] <a href="https:&#x2F;&#x2F;www.eweek.com&#x2F;security&#x2F;stuxnet-worm-nine-facts-every-it-security-pro-should-know&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.eweek.com&#x2F;security&#x2F;stuxnet-worm-nine-facts-every...</a><p>[1]
