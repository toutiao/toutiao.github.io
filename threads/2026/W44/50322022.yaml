  author: mikewarot
  text: Yes, side channel attacks are sneaky, and always end up leveraging someone&#x27;s
    hubris, with huge effort.<p>If you rely on an encryption machine that can&#x27;t
    give the same letter on the output as the input, and the next thing you know,
    after millions of zł and £ and $ of effort, including capturing a submarine in
    the middle of the ocean before it sinks, others are reading your encrypted messages.<p>You
    isolate your Uranium enrichment facility in the middle of Iraq with guards, barbed
    wire, and pretty good security, but someone is able to slink in, put a passive
    monitoring probe on the 3 phase power going into your facility, and sneak it back
    out a few months later... and then they do an FFT, then measure the peaks to back-compute
    the speed of each stage&#x27;s centrifuge, and the next thing you know, they can
    tell  exactly how well things are going for you (read about that on Slashdot more
    than a decade ago! Possibly related[1])<p>If you put all your data through a digital
    computer, someone may use Van Eck phreaking to spy on your video output, or other
    emissions. If they have the right gear in range. Getting that gear in range again
    usually entails the results of large sums of effort.<p>Sure, it&#x27;s <i>possible</i>
    to leak info out the data lines going from a CPU to RAM with a properly formatted
    set of patterns. If you <i>don&#x27;t even try to isolate that CPU from an ingress
    of control</i>, however, you don&#x27;t need that high effort strategy, you just
    need a good North Korean hacker working from the other side of the globe.<p>Folks,
    we mostly solved the ingress of control problem back in the 1970s, and it was
    getting folded into Multics as multilevel, capability based, security. But, the
    folks at Bell Labs, and many other places (MOST other places, and almost all of
    us, myself included) decided that security wasn&#x27;t really important.  That&#x27;s
    why we&#x27;re in this mess today, not because of idiots with LLMs and too much
    money.<p>We&#x27;re in this because Operating Systems that rely on ambient authority
    can not ever be made secure.<p>Unix, Linux, Windows, and all the rest are unfit
    for purpose in the era of persistent Internet. We need to undo that local minima
    decision back from the era of paying by the minute for dialup connections to the
    BBS, and before every computer was networked. It&#x27;s going to suck, but it&#x27;s
    likely to be a Y2K level problem, not impossible.<p>[1] <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20170828055815&#x2F;https:&#x2F;&#x2F;www.washingtonpost.com&#x2F;archive&#x2F;politics&#x2F;1999&#x2F;03&#x2F;02&#x2F;us-spied-on-iraqi-military-via-un&#x2F;3b9e56ce-1fa7-4aa9-ba9c-8423510bb9f3&#x2F;?utm_term=.bca888fe5303"
    rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20170828055815&#x2F;https:&#x2F;&#x2F;www.washi...</a>
  score: 0
  posted_at: '2026-11-01T16:05:44Z'
