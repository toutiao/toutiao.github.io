  author: adityaathalye
  text: TIL; thanks for sharing! I am not surprised to hear this.<p>Still, I&#x27;d
    guess that the odds of remote exploits are better if one wants to <i>control</i>
    a device via the PSU-as-backdoor, versus <i>exfil</i> data from it. Do like the
    IoT people and UDP broadcast naughty control signals to the power circuit &#x2F;
    subsystem that has the compromised device.<p>Guessing further, remote exfil will
    mean having a close-proximity wiretap into the precise power line circuit of the
    target infra---because of signal losses---it could still be UDP broadcast exfil.
    Or a physical tap at whatever power transformer is the single point of connect
    between the target and the main grid. And if you can&#x27;t get anywhere near
    the installation, well you can&#x27;t exfil, because AFAIK it&#x27;s pretty hard
    to reverse a signal <i>up</i> a transformer back into the main grid.<p>A scan
    of the arxiv paper appears to suggest similarly---the situation they describe
    presumes a wiretap into the circuit <i>or</i> the mains switchboard.
