  author: spwa4
  text: That&#x27;s the thing about machine learning over time, and the big hole in
    the whole world model idea. Time and time again we make simulations and train
    models and we think that loop will work. It never does.<p>And why not? Because
    the first model that can actually learn to handle the simulation not only can
    do the simulation internally too, but it can do it better than out simulation.<p>It&#x27;s
    where (ex-)&quot;AI luminaries&quot; go to die. It&#x27;s a way to make glacial,
    slow progress in the correct direction while never actually getting anywhere.<p>So
    we get to a point and people keep making complicated simulations of one kind or
    another ... and then someone (some model) who&#x27;s never used the simulation,
    and doesn&#x27;t need it for model training gets by far the highest score on every
    benchmark and everyone agrees the simulation was kind of beside the point.
  score: 0
