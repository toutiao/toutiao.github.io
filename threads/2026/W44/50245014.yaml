  author: toast0
  text: I don&#x27;t know <i>any</i> of the details, but dram is basically a whole
    lot of bits and and each bit is one capacitor and one transistor.<p>In the diagram
    for 8F Squared, there&#x27;s a capacitor at every other junction between word
    lines and bit lines. If the lines (and inter line spacing) are 2F wide, you have
    one bit in a 2Fx4F rectangle, or one bit per 8F squared.<p>In the diagram for
    6F Squared, there&#x27;s a capacitor at every bit line on every other word line.
    If the lines (and inter line spacing) are 2F wide, you have one bits in each 2Fx3F
    Rectangle, or one bit per 6F squared. (I guess the word lines without bits are
    needed for spacing or to drive the transistor or maybe it&#x27;s just illustration
    and doesn&#x27;t mean much)<p>In the diagram for 4F Squared, there&#x27;s a transistor
    at every bit line on every word line. Now you have a bit in every 2Fx2F square,
    or one bit per 4F Squared.<p>If you can make dram in all three styles with the
    same F, 4F squared is twice the density as 8F squared. If the F doesn&#x27;t hold
    constant, it&#x27;s squishier, of course.
