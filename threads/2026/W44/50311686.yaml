    shows up in the intro on the Strange New Worlds crossover episode!), but when
    you think about it, that’s not any more silly than Q or the myriad other bizarre
    things on other Star Trek shows.<p><a href="https:&#x2F;&#x2F;www.reddit.com&#x2F;r&#x2F;startrek&#x2F;comments&#x2F;q0udro&#x2F;comment&#x2F;hfavulo&#x2F;"
