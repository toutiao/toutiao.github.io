  author: kalleboo
  text: 'He&#x27;s thinking of Coldcard, which accidentally switched their RNG from
    the hardware RNG to a predictable PRNG <a href="https:&#x2F;&#x2F;www.cryptotimes.io&#x2F;learn&#x2F;what-is-coldcard-hack&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.cryptotimes.io&#x2F;learn&#x2F;what-is-coldcard-hack&#x2F;</a><p>&gt;
    <i>Coldcard’s software is built on MicroPython, and Coinkite supplies its own
    hardware-RNG wrapper for the device’s STM32 chip. To avoid conflicts, Coinkite
    deliberately disabled MicroPython’s built-in RNG path by setting a configuration
    flag, MICROPY_HW_ENABLE_RNG, to zero. The problem: the underlying library checked
    only whether that flag was defined, not whether it was enabled (set to a non-zero
    value). Because a flag set to zero is still “defined,” the build silently compiled
    against the wrong code, and seed generation fell back to a deterministic software
    pseudo-random number generator called Yasmarang</i>'
  score: 0
