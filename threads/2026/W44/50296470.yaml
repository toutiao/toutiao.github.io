  text: Btw, backing and promises of redemption are two different things.<p>Deposits
    at a regular bank aren&#x27;t backed by fiat.  The bank promises to pay you back
    in fiat, but they don&#x27;t keep dollar bills in a vault.  The promise is backed
    with all the bank&#x27;s assets.  Ideally, they have a think equity cushion, so
    that even if the assets take a hit, the promises don&#x27;t.
