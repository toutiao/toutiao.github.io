  text: "&gt; The &quot;random blinking green light&quot; is generally more reliable<p>Yes,
    but not because of the light itself, but due to the safety steps done before.
    \ Which should also have happened before the movement order in any other form.<p>As
    a train driver, you do not have the information required to distinguish these
    situations.  If drivers simple refuse all movement orders, besides &quot;green
    lights&quot;, running trains will become a rare occasion and the drivers will
    simply get fired for not doing their job.  _The train driver is not the one who
    decides where a train goes._  For this safety-relevant decision a driver is (roughly
    speaking) nothing more than an innocent bystander.<p>You can think of a train
