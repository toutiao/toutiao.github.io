  author: julik
  text: It is the proper procedure, and it does come (in a lot of countries, AFAIK)
    with a lot of guardrails:<p>There will be a so-called &quot;train order&quot;
    allowing passage of a specific section ignoring the safety system warnings, which
    has strict validity limits both in time and in the area where it applies, usually
    denoted by specific hectometric mileposts<p>When cab signaling is involved (LZB
    is one of these) and it malfunctions, the entire system normally changes to &quot;driving
    on sight only&quot; - which indeed limits the train to 40, 30, 20, sometimes -
    15 km&#x2F;h (see <a href="https:&#x2F;&#x2F;fr.wikipedia.org&#x2F;wiki&#x2F;Marche_%C3%A0_vue"
    rel="nofollow">https:&#x2F;&#x2F;fr.wikipedia.org&#x2F;wiki&#x2F;Marche_%C3%A0_vue</a>)
    or the line gets switched to lineside signaling - if it is available.<p>I don&#x27;t
    know how you could violate all of those rules - both from the driver&#x27;s side
    and from the traffic control side - but it sounds absolutely horrible. Like an
    override of at least 2 (if not 3) very explicit safety margins.
