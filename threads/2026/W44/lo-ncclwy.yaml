  fetch_status: success
  content: "## Switch lowering in GCC\n\n* * *\n\n**2024-01-14**\n\n### Introduction\n\nWe
    have seen in a [previous post](../verb-parse/) that switch statements are more
    complex than they seem. The compiler is able to implement them as a decision tree
    (even though maybe it shouldn't). Is that everything it can do?\n\n_In this post,
    I'll focus on `gcc`. All optimizations, except the bitset lowering, translate
    to clang. I'll be using the `-O3` optimization flag unless indicated otherwise._\n\n_I've
    also slightly edited `gcc` code and removed certain assertions for brevity._\n\n###
    Examples\n\nLet us start with a simple example. A function that takes two integers
    `x` and `val`. Depending on the value of `x`, it calls a corresponding function
    (`f0`, `f1`, and so forth) with `val` as an argument and returns the result. Were
    we to implement this manually, we'd would use an array of function pointers, where
    the input serves as the index into the array.\n\n    int f0(int val);\n    int
    f1(int val);\n    int f2(int val);\n    int f3(int val);\n    int f4(int val);\n
    \   \n    int compact(int x, int val) {\n        switch (x) {\n            case
    0:\n                return f0(val);\n            case 1:\n                return
    f1(val);\n            case 2:\n                return f2(val);\n            case
    3:\n                return f3(val);\n            case 4:\n                return
    f4(val);\n            default:\n                return 0;\n        }\n        return
    0;\n    }\n\n    compact:\n    \tmov\teax, edi\n    \tmov\tedi, esi\n    \tcmp\teax,
    4\n    \tja\t.L2\n    \tjmp\t[QWORD PTR .L4[0+rax*8]]\n    .L4:\n    \t.quad\t.L8\n
    \   \t.quad\t.L7\n    \t.quad\t.L6\n    \t.quad\t.L5\n    \t.quad\t.L3\n    .L5:\n
    \   \tjmp\tf3\n    .L3:\n    \tjmp\tf4\n    .L8:\n    \tjmp\tf0\n    .L7:\n    \tjmp\tf1\n
    \   .L6:\n    \tjmp\tf2\n    .L2:\n    \txor\teax, eax\n    \tret\n\nThe compiler
    agrees with this approach, and transforms the switch statement into a jump table.\n\nMoreover,
    it is able to identify when the values are offset by a constant:\n\n    int f0(int
    val);\n    int f1(int val);\n    int f2(int val);\n    int f3(int val);\n    int
    f4(int val);\n    \n    int compact(int x, int val) {\n        switch (x) {\n
    \           case 97:\n                return f0(val);\n            case 98:\n
    \               return f1(val);\n            case 99:\n                return
    f2(val);\n            case 100:\n                return f3(val);\n            case
    101:\n                return f4(val);\n            default:\n                return
    0;\n        }\n        return 0;\n    }\n\n    compact:\n    \tlea\teax, [rdi-97]\n
    \   \tcmp\teax, 4\n    \tja\t.L2\n    \tmov\tedi, esi\n    \tjmp\t[QWORD PTR .L4[0+rax*8]]\n
    \   .L4:\n    \t.quad\t.L8\n    \t.quad\t.L7\n    \t.quad\t.L6\n    \t.quad\t.L5\n
    \   \t.quad\t.L3\n    .L5:\n    \tjmp\tf3\n    .L3:\n    \tjmp\tf4\n    .L8:\n
    \   \tjmp\tf0\n    .L7:\n    \tjmp\tf1\n    .L6:\n    \tjmp\tf2\n    .L2:\n    \txor\teax,
    eax\n    \tret\n\nOur intuition suggests that the more sparse the values, the
    less advantageous the jump table conversion is.\n\nThrough experimentation, we
    find that `gcc` considers the threshold to be around eight jump table entries
    per `case` label.\n\nIn other words, the following function compiles to a jump
    table:\n\n    int f0(int val);\n    int f1(int val);\n    int f2(int val);\n    int
    f3(int val);\n    int f4(int val);\n    \n    int compact_7(int x, int val) {\n
    \       switch (x) {\n            case 0:\n                return f0(val);\n            case
    7:\n                return f1(val);\n            case 14:\n                return
    f2(val);\n            case 21:\n                return f3(val);\n            case
    34:\n                return f4(val);\n            default:\n                return
    0;\n        }\n        return 0;\n    }\n\n    compact_7:\n    \tmov\teax, edi\n
    \   \tmov\tedi, esi\n    \tcmp\teax, 34\n    \tja\t.L2\n    \tjmp\t[QWORD PTR
    .L4[0+rax*8]]\n    .L4:\n    \t.quad\t.L8\n    \t.quad\t.L2\n    \t; ...\n    \t.quad\t.L2\n
    \   \t.quad\t.L7\n    \t.quad\t.L2\n    \t; ...\n    \t.quad\t.L2\n    \t.quad\t.L6\n
    \   \t.quad\t.L2\n    \t; ...\n    \t.quad\t.L2\n    \t.quad\t.L5\n    \t.quad\t.L2\n
    \   \t; ...\n    \t.quad\t.L2\n    \t.quad\t.L3\n    .L2:\n    \txor\teax, eax\n
    \   \tret\n    .L8:\n    \tjmp\tf0\n    .L7:\n    \tjmp\tf1\n    .L6:\n    \tjmp\tf2\n
    \   .L5:\n    \tjmp\tf3\n    .L3:\n    \tjmp\tf4\n\nBut this other function is
    expanded as a tree of comparisons:\n\n    int f0(int val);\n    int f1(int val);\n
    \   int f2(int val);\n    int f3(int val);\n    int f4(int val);\n    \n    int
    sparse_8(int x, int val) {\n        switch (x) {\n            case 0:\n                return
    f0(val);\n            case 8:\n                return f1(val);\n            case
    16:\n                return f2(val);\n            case 24:\n                return
    f3(val);\n            case 40:\n                return f4(val);\n            default:\n
    \               return 0;\n        }\n        return 0;\n    }\n\n    sparse_8:\n
    \   \tmov\teax, edi\n    \tmov\tedi, esi\n    \tcmp\teax, 16\n    \tje\t.L2\n
    \   \tjle\t.L10\n    \tcmp\teax, 24\n    \tje\t.L7\n    \tcmp\teax, 40\n    \tjne\t.L1\n
    \   \tjmp\tf4\n    .L10:\n    \ttest\teax, eax\n    \tje\t.L4\n    \tcmp\teax,
    8\n    \tjne\t.L1\n    \tjmp\tf1\n    .L1:\n    \txor\teax, eax\n    \tret\n    .L4:\n
    \   \tjmp\tf0\n    .L7:\n    \tjmp\tf3\n    .L2:\n    \tjmp\tf2\n\nHere's the
    comparison tree visualized for clarity:\n\nA couple of observations:\n\n1. We've
    only tried equally spaced values so far. Can the compiler identify transformations
    that are profitable on a subset of all cases?\n2. So far each `case` led to a
    different result. What if we had different cases with the same result?\n3. The
    switch in `sparse_8` could be simplified by dividing `x` by eight before the jump.
    Interestingly, `gcc` _doesn't_ find this simplification.\n\nLet's dig into 1.
    and 2.\n\n#### Outliers\n\nAltering our first example by including an outlier
    value shows that the compiler is able to recognize dense subsets of cases.\n\n
    \   int f0(int val);\n    int f1(int val);\n    int f2(int val);\n    int f3(int
    val);\n    int f4(int val);\n    int f5(int val);\n    \n    int outlier(int x,
    int val) {\n        switch (x) {\n            case 1:\n                return
    f0(val);\n            case 2:\n                return f1(val);\n            case
    3:\n                return f2(val);\n            case 4:\n                return
    f3(val);\n            case 5:\n                return f4(val);\n            case
    100:\n                return f5(val);\n            default:\n                return
    0;\n        }\n        return 0;\n    }\n\n    outlier:\n    \tmov\teax, edi\n
    \   \tmov\tedi, esi\n    \tcmp\teax, 5\n    \tjg\t.L2\n    \ttest\teax, eax\n
    \   \tjle\t.L1\n    \tcmp\teax, 5\n    \tja\t.L4\n    \tjmp\t[QWORD PTR .L6[0+rax*8]]\n
    \   .L6:\n    \t.quad\t.L4\n    \t.quad\t.L4\n    \t.quad\t.L9\n    \t.quad\t.L8\n
    \   \t.quad\t.L7\n    \t.quad\t.L5\n    .L2:\n    \tcmp\teax, 100\n    \tjne\t.L1\n
    \   \tjmp\tf5\n    .L7:\n    \tjmp\tf3\n    .L5:\n    \tjmp\tf4\n    .L9:\n    \tjmp\tf1\n
    \   .L8:\n    \tjmp\tf2\n    .L4:\n    \tjmp\tf0\n    .L1:\n    \txor\teax, eax\n
    \   \tret\n\nThe compiler emits a branch for case 100, but emits a jump table
    for case 1 through 5.\n\n#### Contiguous\n\nIn our examples so far, each case
    statement lead to a different code block. Let's test what happens when multiple
    `case` labels invoke the same function.\n\n    int f1(int val);\n    int f2(int
    val);\n    int f3(int val);\n    int f4(int val);\n    int f5(int val);\n    \n
    \   int blocks_2(int x, int val) {\n        switch (x) {\n            case 0:
    case 1: case 2: case 3:\n                return f1(val);\n            case 21:
    ... case 24:\n                return f2(val);\n            case 42: ... case 45:\n
    \               return f3(val);\n            case 63: ... case 66:\n                return
    f4(val);\n            case 84: ... case 87:\n                return f5(val);\n
    \           default:\n                return 0;\n        }\n        return 0;\n
    \   }\n\n    blocks_2:\n    \tmov\teax, edi\n    \tmov\tedi, esi\n    \tcmp\teax,
    45\n    \tjg\t.L2\n    \tcmp\teax, 41\n    \tjg\t.L3\n    \tcmp\teax, 3\n    \tjg\t.L4\n
    \   \ttest\teax, eax\n    \tjs\t.L1\n    \tjmp\tf1\n    .L2:\n    \tcmp\teax,
    66\n    \tjg\t.L8\n    \tcmp\teax, 62\n    \tjle\t.L1\n    \tjmp\tf4\n    .L4:\n
    \   \tsub\teax, 21\n    \tcmp\teax, 3\n    \tja\t.L1\n    \tjmp\tf2\n    .L8:\n
    \   \tsub\teax, 84\n    \tcmp\teax, 3\n    \tja\t.L1\n    \tjmp\tf5\n    .L3:\n
    \   \tjmp\tf3\n    .L1:\n    \txor\t"
