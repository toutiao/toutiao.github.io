  author: Gareth321
  text: I partly agree. In support of your scepticism, I also think the frontier labs
    are overvalued. The expensive part which is not currently priced into the subscriptions
    is the training. Inference is usually profitable now - at least from what we can
    tell from industry reports.<p>Where this bubble differs from the dot-com bubble
    is that valuations have very strong, organic user demand behind them. In 1999,
    prototype websites with few customers were getting IPOs worth hundreds of millions.
    This time, demand is insatiable. Frontier mdoels also has very low global penetration,
    relatively speaking, so the TAM permits exponentially more sales, in theory.<p>However
    the risks are numerous for these labs. Foremost is that Chinese labs are able
    to easily distill frontier models. A tiny fraction of the cost of training, and
    they have a close approximation. Second, models are getting much more efficient
    per task. Companies are already discovering what &quot;good enough&quot; looks
