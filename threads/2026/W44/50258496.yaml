article:
  url: https://www.designboom.com/technology/tree-mounted-machines-web-app-users-knock-on-wood-remotely/
  title: tree-mounted machines connect to web app to let users knock on wood remotely
  fetch_status: success
  content: "[FEATURED]\n\n## web app turns&nbsp;superstition into&nbsp;remote-controlled
    device\n\n&nbsp;\n\nKnock On Wood is an internet-connected **[device](https://www.designboom.com/tag/personal-technology/)**
    that performs the familiar gesture of knocking on **[wood](https://www.designboom.com/tag/wood-and-timber-architecture/)**,
    allowing users to follow the superstition remotely when no wood is nearby. Through
    a web **[app](https://www.designboom.com/tag/apps/)**, users press a digital button
    to trigger a physical device that knocks on wood in real time.\n\n&nbsp;\n\nThe
    project is part of an ongoing series, Machines Responding to Superstitions, by
    designers Shashwath Santosh and Nithin Eluvathingal. Drawing on industrial design,
    engineering, manufacturing, critical thought, and world-building, the series uses
    machines to examine everyday beliefs and rituals.\n\n![tree-mounted machines connect
    to web app to let users knock on wood remotely - 1](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-1-6ac46511c1234.jpg)\n_Knocker
    strapped to a tree, about to knock on wood | all images ©Shashwath Santosh and
    Nithin Eluvathingal_\n\n&nbsp;\n\n&nbsp;\n\n## network of machines makes remote
    knocking on wood possible\n\n&nbsp;\n\nEach knocker connects to the internet and
    communicates with a central server, allowing multiple devices to respond to users
    around the world. Someone in a Tokyo café, for example, can trigger a knocker
    in New York’s Central Park using only a web browser, while the device requires
    a Wi-Fi connection. For the woodland setup shown in the project visuals, the designers
    **[Shashwath Santosh](https://shashwathsantosh.com/)** and **[Nithin Eluvathingal](https://nithineluvathingal.com/)**
    used a portable Wi-Fi hotspot to connect the machines.\n\n![tree-mounted machines
    connect to web app to let users knock on wood remotely - 2](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-10-6ac46511c14b9.jpg)\n_Knock
    On Wood is part of the ongoing series Machines Responding to Superstitions_\n\n![tree-mounted
    machines connect to web app to let users knock on wood remotely - 3](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-11-6ac46511c14f4.jpg)\n_the
    system allows users to trigger a physical knock from anywhere in the world_\n\n![knock-on-wood-device-superstition-remotely-designboom-1800-2](https://www.designboom.com/wp-content/uploads/2026/10/knock-on-wood-device-superstition-remotely-designboom-1800-2.jpg)\n_the
    project combines connected technology with a familiar cultural ritual_\n\n![tree-mounted
    machines connect to web app to let users knock on wood remotely - 4](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-5-6ac46511c1376.jpg)\n_users
    trigger a physical knock through a web app_\n\n&nbsp;\n\n![knock-on-wood-device-superstition-remotely-designboom-1800-4](https://www.designboom.com/wp-content/uploads/2026/10/knock-on-wood-device-superstition-remotely-designboom-1800-4.jpg)\n_a
    digital button activates the wooden knocker in real time_\n\n![tree-mounted machines
    connect to web app to let users knock on wood remotely - 5](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-2-6ac46511c12ac.jpg)\n_the
    project translates the superstition of knocking on wood into an interactive machine_\n\n![knock-on-wood-device-superstition-remotely-designboom-1800-3](https://www.designboom.com/wp-content/uploads/2026/10/knock-on-wood-device-superstition-remotely-designboom-1800-3.jpg)\n_the
    web app provides the interface for activating the machines remotely_\n\n![tree-mounted
    machines connect to web app to let users knock on wood remotely - 6](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-6-6ac46511c13b4.jpg)\n_multiple
    knockers can respond to users at the same time_\n\n![tree-mounted machines connect
    to web app to let users knock on wood remotely - 7](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-7-6ac46511c13f6.jpg)\n_the
    devices translate digital commands into physical movements_\n\n![tree-mounted
    machines connect to web app to let users knock on wood remotely - 8](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-8-6ac46511c1435.jpg)\n_a
    portable Wi-Fi hotspot connects the machines in the woodland setup_\n\n![tree-mounted
    machines connect to web app to let users knock on wood remotely - 9](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-12-6ac46511c153a.jpg)\n_diagram
    for how multiple people from around the world could knock on wood remotely_\n\n![tree-mounted
    machines connect to web app to let users knock on wood remotely - 10](https://www.designboom.com/wp-content/dbsub/455001/2026-10-06/machines-that-knock-on-wood-for-you-9-6ac46511c1472.jpg)\n_prototypes_\n\n&nbsp;\n\n**project
    info:**\n\n&nbsp;\n\n**name:** &nbsp;Knock On Wood  \n **designers:** &nbsp;[Shashwath
    Santosh](https://shashwathsantosh.com/) | [@shash.wt](https://www.instagram.com/shash.wt/)
    + [Nithin Eluvathingal](https://nithineluvathingal.com/) | [@nithin.dony](https://www.instagram.com/nithin.dony/)\n\n&nbsp;\n\n&nbsp;\n\n_designboom
