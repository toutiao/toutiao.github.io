  author: ozgrakkurt
  text: Suppose you are implementing an application server (backend).<p>You can limit
    the concurrent requests that can be handled at a time to 2000 and limit memory
    per request handler to 2MB.<p>So you allocate 2000 x 2MB at program start.<p>Then
    you crate an arena allocator with (2MB limit) when starting to handle a request.<p>It
    will just fail if a request uses more memory than 2MB. This means you will basically
    never have OOM issues or a request using unexpected amount of memory to crash
    the server.<p>You also have performance benefits like:<p>- Allocation operation
    is basically an integer increment.<p>- Memory for a request is laid out linearly
    in memory and likely is pre-populated so you won&#x27;t have page fault into the
    kernel.<p>- It is very unlikely to have double free or other memory management
    mistakes.<p>You can also fuzz the system in several ways to make sure requests
    can really never exceed that amount of memory usage so you don&#x27;t have surprises
    in runtime.<p>If a request by a user really exceeds that much memory usage, you
    can just fail that request and log it so it will be debugged and fixed later.<p>You
