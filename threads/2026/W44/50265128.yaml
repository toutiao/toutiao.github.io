  author: i2talics
  text: 'Why does everyone love being able to control the allocator in Zig? I rarely
    want this low level control over the allocator, I would rather have an easy to
    use interface to malloc&#x2F;free (such as RAII) or would prefer the language
    push me to avoiding allocations when unnecessary. C and Zig users are always talking
    about how arena allocators are easier to use than the alternative but I disagree
    because the alternative is extremely easy to use when the language makes it so.<p>Arenas
    have a lot of footguns like growing out of control if you don&#x27;t have space
    in your logic to delete them (e.g. suppose every new HTTP connection required
    obtaining a new allocation from the primary arena -- now you have a memory leak).
    They also aren&#x27;t necessarily faster than malloc: I remember hearing a case
    where mimalloc was <i>faster</i> than an arena for a one-shot program like a linker
    because reclaiming space improved cache locality. Plus it&#x27;s difficult to
    implement things like growable vectors or hashmaps using an arena without wasting
    space.<p>I just don&#x27;t see how &quot;futz about with the allocator constantly&quot;
    and &quot;use an arena&quot; is actually a good default.'
  score: 0
