  author: elendilm
  text: mimalloc aggressively reclaims space and it benefits the use case in our Dip
    database built on rust.<p>This is for a long running process where consuming compute
    and memory should only occur on processing a request and must revert to a baseline
    memory consumption once the request is completed.<p>malloc with default allocator
    always gradually increases the memory consumption. This continues with enough
    request bursts on our testing until the process runs out of memory. mimalloc doesn&#x27;t.<p>On
    mobile, we are stuck with the default allocator. On mobiles, the phenomenon of
    the default allocator consuming memory is reproducible even with normal Qt apps.
    It is what it is.
