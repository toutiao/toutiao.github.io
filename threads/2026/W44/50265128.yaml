  author: hansvm
  text: Allocators help solve the problem of &quot;this code I want to use is almost
    good enough; how do I actually use it?&quot;<p>I distinctly remember one of my
    first &quot;real&quot; jobs, somebody had written a C# library for GraphQL. It
    had some sort of bug or lack of functionality I had to fix. The author had fallen
    hook, line, and sinker for sealed classes and all that nonsense, so the shortest
    path to using the rest of their code was to fork the library and re-write the
    thousand offending lines and all references thereto. Luckily it wasn&#x27;t a
    deep dependency.<p>Contrast that with similar issues in typical Python. The library
    likely accepts my favourite duck-typed solution, if it doesn&#x27;t then I can
    likely work around it with an appropriate choice of dunder methods in the code
    I have interacting with the library, and if it still doesn&#x27;t yield then I
    can just rewrite (monkey-patch) the offending code at runtime.<p>Not that either
    of those scenarios are objectively optimal, but they illustrate one of the principles
    people have in mind when they use an interface like allocators (not the only one,
    I&#x27;m sure other commentors will talk your ear off), that when push comes to
    shove you&#x27;d prefer to be able to use your existing code to solve your new
    problems. And that does empirically mostly work here; you can use nearly the entire
    Zig stdlib (especially when ignoring things like the posix namespace) and most
    of the rest of the ecosystem as well on embedded devices, in WASM, in bounded-memory
    applications, in generic application code, in fast-running CLI apps not even bothering
    to free, etc.<p>I agree with much of your discussion about arenas by the way.
    They&#x27;re a moderately poor fit for the current interface in Zig, largely because
    the free functionality is questionable at best. IME, most uses of arenas actually
    know they need such a thing. Functions taking allocator arguments and expecting
    the allocator to be an arena should take an arena argument. When using arenas
    for lifetime management, something should probably own that arena rather than
    implicitly assuming whatever gets passed through the stack is correct. Passing
    arenas to arbitrary functions expecting general-purpose allocators is prone to
    leaks, and you&#x27;d be better off using the arena (or a buffer created therefrom)
    as a backing allocator for a data structure capable of actually freeing if you
    can&#x27;t trust the implementation you&#x27;re calling into (and if you can trust
    it, they should expose a better API allowing you to detect that trustability at
    the callsite).
