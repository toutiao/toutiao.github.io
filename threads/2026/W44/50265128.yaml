  author: the-tomster
  text: If you don&#x27;t like arenas then that will push you towards avoiding allocations
    :)<p>I don&#x27;t love malloc &#x2F; free, managing frees one-to-one with allocations
    is a nightmare. An HTTP server is actually a great example of a good fit for arenas...
    you can have an arena created per connection, and then free the arena when the
    connection closes. Now all of your allocations during that connection are guaranteed
    to be freed instead of having to keep track of them individually. Need something
    to live across connections? Use the general purpose allocator for those particular
    things.<p>For one shot programs, why bother freeing anything at all? The gpa or
    malloc or whatever else is fine there.<p>Personally I mostly lean on fixed-size
    buffers, but if I&#x27;m writing Zig it&#x27;s just little toy programs where
    blowing up when the buffer runs out of room is fine. But for big non-toy programs
    it might be good to use fixed-size buffers anyway and define your limits in terms
    of things actually relevant to your domain.<p>RAII and smart pointers are fine
    too, but C++ has you covered if you want those. Zig is specifically avoiding that
    kind of invisible code that destructors bring you.
  score: 0
