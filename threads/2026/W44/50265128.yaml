  author: pron
  text: 'Generational moving allocators don&#x27;t move objects much, and so the total
    amount of work they need to do is substantially less than malloc&#x2F;free allocators
    -- that&#x27;s the whole idea of these algorithms and the reason why they&#x27;re
    used (that&#x27;s not under dispute; it&#x27;s just the mathematics of the algorithms
    [1]). Still, there might be some situations where allocators in C++ could be faster,
    but if that were the case for my purposes, I would have stuck with C++. We needed
    very good performance for highly concurrent workloads, and C++ just doesn&#x27;t
    come close in many of those (maybe at 10x the budget).<p>[1]: More precisely,
    the work they need to do doesn&#x27;t scale linearly with the allocation rate
    as is the case with non-moving approaches. Of course, arenas are sort of degenerate
    moving collectors, so they also display the same effect, but they can&#x27;t always
    be used.<p>The way this works is that you allocate in the young generation with
    a pointer bump, and to free memory you compact (move) the surviving objects, which
    make up a small minority, <i>a few</i> times and then promote (move) them to the
    old generation (where you either manage memory with the same technique or a different
    one). And so the total amount of moving is not high (objects either never move
    or rarely move), and what you end up with is essentially two heaps, one where
    the allocation rate may be high but you can completely negate all the extra work
    by increasing the size of that heap, and one where the allocation rate is low.
    This ability to, optionally, not double the amount of work when the allocation
    rate doubles is what gives moving collectors their efficiency (and that you can
    bump-allocate in virtually all cases).<p>Of course, it&#x27;s possible to come
    up with programs where objects do move a lot (or there&#x27;s some other common
    work), e.g. programs that don&#x27;t exhibit the behaviour of the generational
    hypothesis, but the point is that in a very large class of programs, this technique
    is hard to compete with.'
