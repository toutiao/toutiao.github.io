  author: elendilm
  text: I first encountered this behaviour on Linux desktop with Qt QML apps as far
    back as 2015. For a long time, I thought it was Qt QML ListView&#x27;s inefficiency
    and didn&#x27;t think much of it.<p>But in recent years, the phenomenon was visible
    with Dip which was built on rust.<p>Dip does massive parallel fanout using green
    threads (&#x27;may&#x27; coroutines) with work being NUMA pinned (software hash)
    using a thread per core model.<p>A default request may span up to _chunk_count_
    jobs (default 5k) configurable per request.<p>Every request (x 5k jobs) from the
    client on a stress test sees a jump of ~10-20 MB of memory. Sometimes the jumps
    use large swaths of memory - say 100s of MB and stabilizes for a while only to
    gradually climb up again later. Rinse and repeat - OOM kicks in and the process
    crashes.<p>Many times we thought we were leaking memory somewhere. But armed with
    the Qt experience a decade ago, we intuited maybe its the allocator - and switched
    to mimalloc on desktop executable.<p>Dip&#x27;s memory, using mimalloc, stabilizes
    at ~60 MB post request completion no matter how many requests you throw at it.<p>Pity
    that on mobiles, more specifically Android,  we have to live with the default
    allocator on even trivial Qt apps let alone embedded Dip. But people have lived
    with it for at least a decade, so it is what it is.<p>Thus on mobiles, we just
    have to be content like everybody else, unable to squeeze every last ounce of
    performance and efficiency out of the hardware on stress tests ensuring Dip remains
    &quot;just better :(&quot; :)
