  text: "&gt; In Rust you can use ?, which is quicker than unwrap, but you also have
    to do something like Result&lt;Type, Box&lt;dyn std::error::Error&gt;<p>No, you
    don&#x27;t! When returning Result&lt;T, E&gt;, you can use ? on any Result&lt;T2,
    E2&gt; where E: From&lt;E2&gt;. In other words E doesn&#x27;t have to be Box&lt;dyn&gt;,
    it just has to satisfy From&lt;E2&gt;.<p>Crates like thiserror make it easy to
    define your own error types that can be easily converted from all the other error
    types you can encounter in your functions! I do this whenever it doesn&#x27;t
    make sense to use an inner error type directly, or whenever a function does its
    own validation that deserves its own error variant.<p>On top of that, I tend to
    also have error variants for each place in the function rather than only for each
    type of inner error. At error sites I do something like `.map_err(MyError::PlaceInTheFunction)?`
    rather than only `?`, and then errors become like a very efficient backtrace :)"
