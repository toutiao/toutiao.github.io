  author: lukaslalinsky
  text: There is no magic about the I&#x2F;O interface. It&#x27;s a regular dynamic
    dispatch, the same as if you use virtual functions in C++. Currently, and in the
    foreseeable future, there are only two options how it can run, blocking mode where
    each task occupies a dedicated thread, or using stackful coroutines. The interface
    implements blocking functions, there is no async waiting anywhere in there. But
    because it&#x27;s dynamic dispatch, it allows the async implementation to do the
    &quot;prepare operation, suspend until completed, wake up&quot; dance, where the
    threaded implementation would just run the blocking syscall directly. There are
    plans to add stackless coroutines, but that will require many language restrictions
    to happen first, so it&#x27;s not going to happen any time soon and when it does,
    the interface will likely change to accomodate it.
