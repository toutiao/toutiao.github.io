  author: MathMonkeyMan
  text: Passing allocator pointers around has the advantage of allowing you to customize
    the allocator when you want, and to ignore it when you want (which is most of
    the time), i.e. just use the allocator you were given and pass it around like
    some piece of syntax or ctx in Go.<p>The trouble comes when you have data structures
    that manage memory, and you want to associate the allocation strategy with the
    particular instance of the data structure. Or, worse, you don&#x27;t store the
    allocator pointer with the data and you require that all functions operating on
    the data structure happen to use compatible allocators.<p>At its simplest, though,
    passing allocators around is just removing an implicit global variable that is
    sometimes helpful to customize locally, but nearly impossible to customize locally
    if left as a global.
