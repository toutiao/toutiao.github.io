  author: BeetleB
  text: People keep bringing it up and it&#x27;s silly. The huge number is actually
    a sign of their success. Most of those losses were pegged to equity. In only mildly
    inaccurate layman terms, it&#x27;s essentially a promise to give out N shares.
    When the value of the company increases, say, 10x, the value owed also goes up
    10x. For these types of deals, they write it as a loss even though they didn&#x27;t
    lose a penny.<p>They didn&#x27;t lose any money, though. It&#x27;s just a promise
    to give them based on the equity.<p>If they IPO tomorrow and it turns out their
    valuation is 10x lower than what it currently is pegged at, the &quot;loss&quot;
    will magically drop from over $70B to $7B.
  score: 0
  posted_at: '2026-10-26T16:40:47Z'
- id: '50247138'
  parent_id: '50244766'
  author: Rury
  text: The $72B number is just for convertible notes sold prior and through 1st half
    of 2026. They were issued as a way to finance growth costs (e.g. acquiring compute).<p>There
    might be some additional sold in Q3, but that wasn&#x27;t published here. But
    these notes aren&#x27;t costs that Anthropic has to pay in any normal sense -
    they&#x27;re shares they sold pre-IPO and valued at $72B. Anthropic would have
    to pay that much to buy them back at said valuation price, but they&#x27;re not
    obligated in any way to do that.<p>Post IPO, they&#x27;ll have alternative avenues
    for sourcing funds... (e.g. secondary offerings, corporate bonds). Continued growth
    at this rate will need continued financing, but it wouldn&#x27;t be done using
    convertible notes.<p>The real liabilities are the hundreds of billions in non-cancelable
    compute costs Anthropic owes Google, Amazon etc, over the course of the next 10
    years.
  score: 0
