  author: hibikir
  text: While there are incentive problems across all levels, The political quagmires
    that make it impossible to move at any reasonable speed, and that lead to counterproductive
    ideas getting large budgets are in my experience very common at the highest sizes.
    It&#x27;s true that on the other edge of the spectrum, small startups make poor
    choices, but many of said startups will fail due to said choices. So by the time
    you have a viable company making good money, the really badly aligned companies
    are gone.<p>So when I look throughout my long employment career for best security
    and organizational practices, all the highlights are still relatively, relatively
    undersized companies, with headcounts in the 3-4 figures. It&#x27;s as they grow,
    and start to be multi-headed behemoths, that they decay again, as what is good
    for the responsable mid-level exec, for the business unit, and for the company
    as a whole start to have nothing to do with each other. That&#x27;s when you can
    smell the decay in the hallways. A few large companies manage to stave off this
    rot a little more than others, but it&#x27;s inevitable. Then nothing important
    can be done in a timely fashion.
