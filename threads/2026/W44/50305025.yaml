  author: keeda
  text: That is a great definition of adequate for security! My point is that at scale,
    bureaucracy is a necessary (though not sufficient!) condition for achieving adequate
    security.<p>Another way to look at it is, bureaucracy is an aspect of the corporate
    culture, and lasting security comes down to having the right culture. At least
    in that respect Microsoft is doing something right. Doubtlessly a lot of that
    bureaucracy is ineffective, but it&#x27;s a signal that the cultural intention
    exists.<p>As a relevant counterexample, we&#x27;ve never heard of these kind of
    processes at Meta and so you get Cambridge Analytica.<p>My perspective is skewed
    by my experience being on a security-adjacent platform team for years. Our biggest
    challenge was not external threats, it was internal teams seeing us as friction
    on their productivity, to the extent that it regularly led to escalations.<p>So
    when Cambridge Analytica happened, I played it up for all it&#x27;s worth; Meta
    may move fast because they didn&#x27;t have our &quot;bureuacratic team&quot;,
    but look where it got them! Unfortunately the $25B penalty happened just last
    week... I&#x27;d have gotten infinite political mileage out of that.
