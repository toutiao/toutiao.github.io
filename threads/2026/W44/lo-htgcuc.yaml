  author: spillybones
  text: 'When I first looked into atproto, I was deeply grossed out by the privacy
    model: none. I think the reason for its popularity is how easy and fun it is to
    build a weekend project on top of the protocol, but the fundamental nature of
    atproto is that nothing is private. People familiar with other protocols like
    Signal or Matrix or Mastodon are inclined to extend the benefit of the doubt and
    assume that, surely, there is some part of atproto that can be used for private
    direct messages, or selective visibility, or sensitive personal data, but no.
    Everything is public. Even if you bolt on some aftermarket encryption, all the
    metadata is still public. It''s a social endeavor that I want nothing to do with.'
