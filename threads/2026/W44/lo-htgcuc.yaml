    I believe most of the email world will refuse to talk cleartext now. It was viewed as a migration process there. For the web, there are more places where not everyone agrees encryption is useful or desirable. IETF describes how pervasive monitoring is an attack, but not everyone understands or accepts this.
    Really what we needed was something tied to DNS (e.g. DNSSEC/DANE), but it’s too late now.
    I’ve used Firefox in HTTPS Only mode since it first landed on Nightly. It rewrites http: to https: and gives you an interstitial warning if a server doesn't speak HTTPS. That’s clearly where everything is headed, and it would have been decent in a shared-scheme world too.
    For a long time, many people served the same content over HTTP and HTTPS, so the “block HTTPS” attack worked. Now, few do that, almost everyone just implements http: as redirect to https:, rendering http: essentially obsolete. And essentially no one implements different things on http: and https:. The last site I know of that did that (and the only one in at least a decade) was Australia’s Bureau of Meteorology, which served an “HTTPS not supported” message that redirected you to the homepage on http: until about two years ago. It was super annoying, messing up HTTPS Only mode, and they wouldn’t heed my pleas that they just stop accepting on :443 like normal people.
