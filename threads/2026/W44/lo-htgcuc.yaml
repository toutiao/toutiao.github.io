    i strongly disagree, honestly. it doesn't need to be (and very much shouldn't be) welded on in such a brutish way that it justifies needing to specifically call out, at a scheme level, that it's materially different. there are great pains being taken to try and mold this nicely into the existing atproto environment, as evidenced by the current proofs of concept implementations in various pds.
    it's authentication standards introduced into the existing protocol, and largely nothing else changes - especially for an end-user. this would be like inventing a new scheme when we discovered basic authentication would be better than none, and then again when we invented form-based authentication. perhaps yet another for bearer token and similar? they are all http. https is because we put ssl (tls) on top, which is actually a proper difference at a protocol level. you can already 401 / 403 based on whatever you wish, there's simply no proper universal mechanism to do so.
    the discussions around this are textbook bikeshedding. "oh, should we use ats:// or something else? it's just so important and i simply must have my say about it. have we considered atsecure://, perhaps?"
    if i ever have to hear or see "was that at:// or ats://" i will know at that exact moment that the protocol is in an irrecoverable state.
