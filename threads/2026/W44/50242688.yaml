  author: kieckerjan
  text: 'I remember seeing the ZX80 at my parents&#x27; friends house and realizing
    that this was a different kind of beast than the pocket calculator and the electronic
    dictionary we had at home: you could make this thing do.. well.. anything!<p>When
    the ZX81 came out I spent all my pocket money savings on it. First on the thing
    itself, later I would shell out for its 16K RAM extension.<p>Restoring software
    on the ZX81 using cassette tapes was so slow and cumbersome that it was quicker
    to restore it from my own memory. I had a little scrolling evasion game that I
    knew by heart, and I would type it in if I felt the need to play. Changing little
    aspects of that game (first different characters for the obstructions, then game
    mechanics) was what set me on the path of programming.<p>My brother somehow salvaged
    that first ZX81 from our parents&#x27; estate and it is now hanging framed on
    the wall next to me as I type this.'
