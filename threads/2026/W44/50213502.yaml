  author: xyzzy_plugh
  text: 'There&#x27;s a lot of nuance in reverse proxies. You&#x27;re off to a good
    start with Go as the standard library gives you a very strong and battle-tested
    HTTP implementation as well as a basic reverse-proxy interface to build with.<p>Avoiding
    opening a can of security-issue-worms involves knowing what you&#x27;re doing
    and depends heavily on the environment you&#x27;re operating in. Internally proxying
    traffic between services? A cakewalk. Translating between HTTP2 or 3 to 1.1? Forwarding
    origin client IP safely? Sanitizing headers (and I don&#x27;t mean the in-built
    sanitization that Go provides)? There&#x27;s a lot of little things.<p>Tools like
    Nginx and Envoy strike from the opposite direction: an extensive suite of configurable
    tools to reverse proxy the way you need, with relative safety.<p>Like you, I would
    almost certainly prefer writing a small reverse proxy in Go over deploying Nginx.'
