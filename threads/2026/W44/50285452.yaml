  author: dspillett
  text: "<i>&gt; LLMs are always hallucinating that they&#x27;ve found the most severe
    bug in software history.</i><p>That is a function of the training data&#x2F;method,
    like many of AI&#x27;s problems. This doesn&#x27;t stop it being a problem of
