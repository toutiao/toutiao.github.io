    and has tokens for &quot;keep going&quot; or N&#x2F;E&#x2F;S&#x2F;W direction.
    For breakout it uses 4 ball tokens, one per diagonal and it moves one cell per
    step in that diagonal, and for pong the ball has 6 tokens (combiantion between
    [up, level, down] with [left, right], e.g up right, level down)
