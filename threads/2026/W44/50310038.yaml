    Yubikeys with a Fastmail logo on them would be, as the kids said a generation
    ago, &quot;dope&quot;.<p>_<p>&gt; where they have a Helpdesk<p>Quality attention
    to cicd and artifact release may avoid and potentially reduce conventional helpdesk
    activity.<p>For individual users of SaaS, provided the .dmg or .msi of the downstream
