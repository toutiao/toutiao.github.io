    no more additional support tickets than reasonable should occur beyond an initial
    phase.<p>A downstream MUA distro can eliminate manual configuration and superfluous
    details, such as the shit experience with Thunderbird on macOS (Thunderbird&#x27;s
    fault 100%) with Oath2 I saw in the last few months. Such a distro could be tuned
    with a slew of relatively small adjustments reducing existing support ticket traffic.<p>Startups
    with headcount of 20 to 30, a good chunk of that being developers, where I have
    historically preferred to dwell, helpdesk is not there nor wanted for. Higher
    quality customers are here.<p>_<p>&gt; and golden image deploys<p>Chromebooks,
    which not including K-12 did outnumber macOS in non-personal environments around
    a half-decade ago during that Event 201 thing. Super low IT overhead with those.<p>I
    have been distant from MIS type of IT for a while but have  heard echoes or binocular&#x27;d
    in a bit and believe the golden image era has quietly passed us.<p>Conventional
    image pattern shouldn&#x27;t be necessary anywhere now.<p>Somewhere in 2019, Apple
    warped native tooling in tandem with device firmware behavior to squeeze out the
    conventional image pattern ; killed it off.<p>Apple Business now includes built-in
    mobile device management which can enroll and set up Apple devices then apply
    standard settings and apps through &quot;Blueprints&quot; ; the .dmg would be
    trivial to push out. The successor to Jamf.<p>With Microsoft Intune, propagation
    of .msi packages to enrolled devices is a day-to-day task.<p>Ubuntu, RedHat, SuSE,
