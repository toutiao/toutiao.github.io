    is Adam Langley’s personal technical blog. Langley worked at Google on HTTPS infrastructure
    and Chrome’s SSL stack.<p>A Tauri app, which is essentially a Chromium browser
    instance with no address bar and widgets to access browser settings, a Fastmail
