  content: "Encrypted email sounds good, but what does it really mean? Email can be
    encrypted in many different ways, at different times, for different purposes.
    Each protects against different threats, and may have downsides to be weighed
    up. Understanding your options helps you make informed choices about your privacy
    and security.\n\n \n## What are you protecting against?\n \n\nBefore diving into
    encryption methods, it’s worth asking: what threats actually matter for your email?
    For most people, the realistic concerns are:\n\n \n- **Account compromise** :
    phishing or password reuse giving attackers access to your account\n- **Mistaken
    spam detection** : causing important mail to go missing\n- **Malware** : getting
    a virus via email, either linked or as an attachment\n- **Accidental deletion**
    : losing vital data due to human error\n \n\nFar less common, although also important,
    are:\n\n \n- **Network eavesdropping** : someone on your WiFi or ISP intercepting
    your traffic\n- **Data breaches** : attackers gaining access to stored email through
    a security vulnerability\n- **Physical theft** : stolen devices or hard drives
    exposing your data\n \n\nFor a smaller number of people — journalists protecting
    sources, activists in hostile countries, or those facing sophisticated adversaries
    — the threat model expands to include insider threats at providers and legal compulsion
    by governments. Different encryption approaches help protect (or may even hinder
    protection) against subsets of these threats, and understanding this helps you
    choose the right balance.\n\n \n## Encrypting the connection to your email provider\n
    \n\nWhenever you connect to your email provider, [TLS (Transport Layer Security)](https://en.wikipedia.org/wiki/Transport_Layer_Security)
    encrypts everything between your device and the server. This protects you from
    eavesdroppers on your local WiFi network, your ISP, and anyone monitoring network
    traffic between you and your email service. This standard has been widely adopted
    and modernised, the latest version being [TLS 1.3](https://datatracker.ietf.org/doc/html/rfc8446),
    which mandates the strongest ciphers and is the foundation of today’s secure internet.\n\n
    \n\nBut encryption alone isn’t enough. You also need assurance you’re actually
    talking to your email provider and not an imposter. This is where Public Key Infrastructure
    (PKI) comes in. When you connect to Fastmail or Gmail, the server presents a certificate
    that’s been digitally signed by a trusted Certificate Authority (CA) like [Let’s
    Encrypt](https://letsencrypt.org/). Your browser or email client checks this signature
    against its built-in list of trusted CAs, verifying that the certificate was legitimately
    issued to that domain. This prevents attackers from intercepting your connection
    by pretending to be your email provider — even if they can redirect your traffic,
    they can’t obtain a valid certificate for a domain they don’t control.\n\n \n\nThe
    system was strengthened significantly with the introduction of [Certificate Transparency
    (CT)](https://en.wikipedia.org/wiki/Certificate_Transparency) logs: public, append-only
    records of every certificate issued by participating CAs. Domain owners can monitor
    these logs to detect if someone fraudulently obtains a certificate for their domain,
    and browsers now require certificates to be logged before trusting them. While
    no system is perfect — CAs have occasionally been compromised or tricked into
    issuing bad certificates — PKI combined with Certificate Transparency provides
    strong, practical assurance that your encrypted connection terminates at the server
    you intended to reach.\n\n \n\nFastmail fully supports the latest TLS 1.3 standard.
    We also use [HTTP Strict Transport Security (HSTS)](https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security)
    to ensure browsers never try connecting to us without TLS. Similarly, we ensure
    the ports for unencrypted IMAP/POP/SMTP are closed on our servers, so email apps
    do not try to connect without encryption (this is why [we have always preferred
    “implicit” TLS over STARTTLS](https://www.fastmail.help/hc/en-us/articles/360058753834-SSL-TLS-and-STARTTLS),
    which is also now [the recommendation of the IETF](https://datatracker.ietf.org/doc/html/rfc8314)).\n\n
    \n## Encrypting email between servers\n \n\nWhen you send an email, it first goes
    to your email provider’s server, and then they send it on to the recipient’s email
    server. The more interesting challenge lies in that transit between different
    servers.\n\n \n\nServer-to-server encryption relies on “opportunistic TLS”, meaning
    servers attempt encryption but fall back to unencrypted delivery if the receiving
    server doesn’t support it. Fastmail has supported this for inbound mail [since
    April 2009](/blog/opportunistic-ssltls-encryption-on-incoming-emails/) and for
    outbound mail since [January 2010](/blog/opportunistic-ssltls-encryption-on-outgoing-emails/).\n\n
    \n\nThe fundamental limitation is that opportunistic TLS can be defeated by active
    attackers, commonly referred to as a [man-in-the-middle (MITM) attack](https://en.wikipedia.org/wiki/Man-in-the-middle_attack).
    A sophisticated adversary positioned between mail servers can strip the STARTTLS
    command from the initial handshake, forcing an unencrypted connection. There is
    still enough legitimate mail sent to, or received from, servers that don’t support
    encryption that mandating it for everyone would lose an unacceptable amount of
    wanted email.\n\n \n\nAdditionally, servers don’t verify certificates by default.
    They accept any valid-looking certificate without confirming it actually belongs
    to the destination server. This is because verifying the certificate adds no security
    when an active attacker could just fall back to an unencrypted connection.\n\n
    \n### MTA-STS and DANE attempt to close the gaps\n \n\nTwo protocols address these
    vulnerabilities, though adoption remains limited.\n\n \n\n[MTA-STS (Mail Transfer
    Agent Strict Transport Security)](https://datatracker.ietf.org/doc/html/rfc8461)
    lets domains declare they support and require STARTTLS encrypted connections,
    including a valid certificate, when receiving email for addresses at that domain.
    Senders can check this policy and must refuse to send mail if they are unable
    to establish an encrypted connection with a valid certificate for the receiving
    domain.\n\n \n\nMTA-STS is reasonably straightforward to deploy: it requires only
    a DNS record and a policy file hosted over HTTPS. If something goes wrong, the
    worst case is that some incoming mail gets delayed or bounced — it cannot affect
    websites or other uses of the domain.\n\n \n\n[DANE (DNS-Based Authentication
    of Named Entities)](https://en.wikipedia.org/wiki/DNS-based_Authentication_of_Named_Entities)
    takes a different approach, publishing TLS certificate information directly in
    cryptographically-signed DNS records via [DNSSEC](https://en.wikipedia.org/wiki/Domain_Name_System_Security_Extensions).
    This eliminates dependence on certificate authorities and the “trust on first
    use” weakness of MTA-STS — but at significant operational cost.\n\n \n\nDNSSEC
    is not supported by all domains (it depends on the registry for the top-level
    domain). More importantly, DNSSEC’s deployment complexity significantly increases
    the likelihood of a serious outage. Unlike most system failures, DNSSEC errors
    are uniquely unforgiving: when there’s a routing problem, you fix it and service
    is restored immediately, but when there’s a DNSSEC problem, broken records can
    persist in caches across the internet for hours or days.\n\n \n\nEven sophisticated
    operators get this wrong. In October 2023, Cloudflare’s 1.1.1.1 resolver — one
    of the world’s most popular DNS services — [experienced hours of failures](https://blog.cloudflare.com/1-1-1-1-lookup-failures-on-october-4th-2023/)
    when DNSSEC signatures in their cached root zone expired. In May 2023, New Zealand’s
    .nz country-code TLD triggered a [multi-day availability incident](https://internetnz.nz/news-and-articles/dnssec-chain-validation-issue-technical"
