    ago, relatively ongoing time sinks with some archetypal MBA twat types, and some
    perceived legendary tier banks running on one of the two legit clouds (neither
    of which is that Azure garbage), who then fell on customer-facing downtime by
    not deploying with rudimentary cloud patterns that startups don&#x27;t fail to
    do (as we recently found out), I am left feeling not confident that banks can
    do IT with self-reliance these days.<p>They can still push out .msi and group
    policy objects though, for sure.<p>From anecdotes I hear of and distant observations
    of state governments, departments of the big federal government sans some of the
    cooler TLA, and govs in Europe, I am not optimistic about those.<p>About a decade
    and a half ago we used to look at these two types of institutions and go &quot;ah,
    the big guys, in their big buildings, they broker a thing I need, with their marble
    floors and reassuring smiles, these egregore have got it all figured out&quot;.<p>As
    a staff level DevOps &#x2F; DevSecOps &#x2F; whatever who has been along for the
    ride with a share of Silicon Valley culture-OS startups with enterprise customers,
    closely followed practices and white papers of hyperscalers and elite security
    firms, thus can see through any IT product&#x2F;pattern transparently for its
    base principles...<p>-- having witnessed various sitcoms, heard of or read over
    9,000 of first-hand accounts of such sitcoms, on top of the broadly spread cultural
    decay we are experiencing in the West upcoming on this Fourth Turning, with the
    rot of these institutions, and the major cultural shifts on computer illiteracy&#x2F;obliviousness
    being normalized among &quot;professionals&quot; observed over the last couple
    of decades, I think more often than not some scrutiny of IT patterns at these
    institutions uncovers that they are severely retarded.<p>I suspect on the mid
    to lower end of the gov side it&#x27;s just checkboxes, misdirection, and casual
    corruption almost all of the way down. Anyone who actually gives a shit about
    IT security and tries to fix things gets railroaded out.<p>The subcontractors
    who pick up the slack and handle real shit, like SpaceX is something NASA is dependent
    on (macro example), the upper echelon of the private sector, supranational organizations
    run by elite characters, are where not the progressive-minded IT teams are found
    but where IT is treated with some seriousness by leadership. But no transparency
    into IT patterns will be offered by these outside of talks at cool parties like
    DEF CON and AWS Re:Invent (shitty DJs but still a great party)."
