  author: cubesnooper
  text: I self-host my email, in part because I wanted to enforce encryption whenever
    I send. My server does verify the certificate of the target MX, whether it uses
    MTA-STS or not. Delivery fails if the certificate is invalid, and <i>also</i>
    fails if the destination (or a man in the middle) downgrades or strips STARTTLS.<p>In
    eight years, I’ve seen zero servers that refused STARTTLS, and only two invalid
    certificates. In both cases, the certificates were from a valid CA and weren’t
    expired, but the hostname was wrong. Both were due to outdated DNS records, one
    of which was fixed as soon as I reported it, and the other resolved itself after
    a few months.
