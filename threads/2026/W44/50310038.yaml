  text: "Google Mail&#x27;s $5&#x2F;seat offering is the first one that comes to mind.<p><pre><code>
    \ 04 May 2011\n  Starting with Chrome 13, we&#x27;ll have HTTPS pins for most
    Google properties. This means that certificate chains for, say, https:&#x2F;&#x2F;www.google.com,
    must include a whitelisted public key. It&#x27;s a fatal error otherwise. \n\n
    \ https:&#x2F;&#x2F;www.imperialviolet.org&#x2F;2011&#x2F;05&#x2F;04&#x2F;pinning.html\n</code></pre>\nImperialViolet
    is Adam Langley’s personal technical blog. Langley worked at Google on HTTPS infrastructure
    and Chrome’s SSL stack.<p>A Tauri app, which is essentially a Chromium browser
    instance with no address bar and widgets to access browser settings, a Fastmail
    desktop &quot;app&quot; made with Tauri can potentially even the playing field
    between Google the Goliath and Fastmail the David on the TLS certificate pinning
    front. Tauri is like Electron but sucks a lot less.<p><pre><code>  https:&#x2F;&#x2F;tauri.app&#x2F;\n</code></pre>\n_<p>&gt;
    if you&#x27;ve spending tens of thousands of dollars per month<p>Such as, 8,000
    users at $40k&#x2F;month for Google Mail.<p>Yubico has great volume discounts
    for a part of the CapEx side of a sane deployment of this.<p>The basic WebAuthn&#x2F;FIDO2-only
    Yubikeys with a Fastmail logo on them would be, as the kids said a generation
    ago, &quot;dope&quot;.<p>_<p>&gt; where they have a Helpdesk<p>Quality attention
    to cicd and artifact release may avoid and potentially reduce conventional helpdesk
    activity.<p>For individual users of SaaS, provided the .dmg or .msi of the downstream
    Betterbird&#x2F;Thunderbird (or other MUA) has sound cicd and decent release attention,
    no more additional support tickets than reasonable should occur beyond an initial
    phase.<p>A downstream MUA distro can eliminate manual configuration and superfluous
    details, such as the shit experience with Thunderbird on macOS (Thunderbird&#x27;s
    fault 100%) with Oath2 I saw in the last few months. Such a distro could be tuned
    with a slew of relatively small adjustments reducing existing support ticket traffic.<p>Startups
    with headcount of 20 to 30, a good chunk of that being developers, where I have
    historically preferred to dwell, helpdesk is not there nor wanted for. Higher
    quality customers are here.<p>_<p>&gt; and golden image deploys<p>Chromebooks,
    which not including K-12 did outnumber macOS in non-personal environments around
    a half-decade ago during that Event 201 thing. Super low IT overhead with those.<p>I
    have been distant from MIS type of IT for a while but have  heard echoes or binocular&#x27;d
    in a bit and believe the golden image era has quietly passed us.<p>Conventional
    image pattern shouldn&#x27;t be necessary anywhere now.<p>Somewhere in 2019, Apple
    warped native tooling in tandem with device firmware behavior to squeeze out the
    conventional image pattern ; killed it off.<p>Apple Business now includes built-in
    mobile device management which can enroll and set up Apple devices then apply
    standard settings and apps through &quot;Blueprints&quot; ; the .dmg would be
    trivial to push out. The successor to Jamf.<p>With Microsoft Intune, propagation
    of .msi packages to enrolled devices is a day-to-day task.<p>Ubuntu, RedHat, SuSE,
    Qubes, and all related distros, when under IT teams that can code on a rudimentary
    level, are managed with Ansible or Salt, without the &quot;enterprise tax&quot;
    part.<p>What all of these have in common is centralized org-wide device management
    where the ability to push out a .msi or .dmg or .deb&#x2F;.rpm&#x2F;.AppImage
    is there.<p>In similar spirit to certificate pinning, the advanced customers have
    dedicated private cicd consume source code from the OS vendor.<p>The more advanced
    are on<p><pre><code>  Bootstrappable builds: how and why\n  https:&#x2F;&#x2F;lwn.net&#x2F;Articles&#x2F;1088279&#x2F;\n</code></pre>\nwhich
    in tandem with cryptography-grade hashes, has over half way solved the &quot;Trusting
    Trust&quot; problem that Ken Thompson raised.<p>_<p>&gt; what other SaaS consumer
    products use certificate pinning.<p>Slack has the low-hanging-fruit opportunity
    to with their Electron app, but has reportedly dropped the ball. This is great
    for tech workers who like to divert all Slack contents to a separate local data
    sink for archiving and discovery and non-shitty data access.<p>This repo from
