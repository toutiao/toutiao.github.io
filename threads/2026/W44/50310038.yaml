  text: |-
    This is a good overview of email encryption, but it doesn&#x27;t cover what Fastmail actually supports which I think makes this misleading.<p>Fastmail does not enforce MTA-STS for outbound messages. I just checked here (<a href="https:&#x2F;&#x2F;email-security-scans.org&#x2F;view&#x2F;jktrld5e73b2dyxz0h1swutlre5vjt" rel="nofollow">https:&#x2F;&#x2F;email-security-scans.org&#x2F;view&#x2F;jktrld5e73b2dyxz0h1swu...</a>). You can see how your email provider compares at <a href="https:&#x2F;&#x2F;email-security-scans.org" rel="nofollow">https:&#x2F;&#x2F;email-security-scans.org</a>.<p>Fastmail does support MTA-STS for inbound messages... sort of. For inbound MTA-STS the email provider needs to use a TLS certificate issued by a trusted certificate authority, which Fastmail does. Additionally, the domain name in the &quot;to address&quot; needs to enable MTA-STS using some DNS records. Fastmail does not provide the documentation for setting this up, although they have decent adoption by folks who figured it out on their own. I&#x27;m seeing about 0.2% of domains using Fastmail enforce MTA-STS inbound:<p><pre><code>    SELECT mta_sts_mode, COUNT(*) AS &quot;count&quot;
        FROM read_parquet(&#x27;dns-analytics-2026-q3-*.parquet&#x27;)
        WHERE exchange_suffix = &#x27;messagingengine.com&#x27;
        GROUP BY mta_sts_mode
        ORDER BY count DESC;
        ---
        mta_sts_mode  count
        -             174,877
        enforce       354
        testing       313
        none          11
    </code></pre>
    This is about the same as Protonmail (~0.2%), but higher than Outlook (~0.1%) and Google (&lt;0.1%). I suppose this reflects Fastmail&#x27;s popularity among technically minded folks.<p>I&#x27;d like to see Fastmail improve this by clearly documenting MTA-STS support, setup instructions, and validate MTA-STS in their custom domain dashboard. It looks like they may be adding MTA-STS policy hosting, which is a really promising sign, but I don&#x27;t see this documented yet so this is probably being tested internally.<p><pre><code>    $ curl -k --resolve mta-sts.example.com:443:103.168.172.47 https:&#x2F;&#x2F;mta-sts.example.com&#x2F;.well-known&#x2F;mta-sts.txt
        version: STSv1
        mode: testing
        mx: *.messagingengine.com
        max_age: 86400
    </code></pre>
    With that said, I&#x27;ve been extremely happy with Fastmail for several years now and recommend it.
