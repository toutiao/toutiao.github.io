  author: chrismorgan
  text: I don’t know if Google still pin their certificates or if Chrome still pins
    Google’s certificates in some way, but the wind has definitely shifted against
    that approach. In 2015, Chromium and Firefox introduced the general-purpose HTTP
    Public Key Pinning &lt;<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;HTTP_Public_Key_Pinning"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;HTTP_Public_Key_Pinning</a>&gt;;
    but within a couple of years they agreed it was a bad idea, and it was removed
    entirely by 2020. Certificate Transparency and CAA records are the closest thing
    to a replacement. Many sites that did fancy certificate stuff 10–15 years ago
    (e.g. EV certificates) have unceremoniously dropped it since.
