  title: Medicare Will Pay $50k for Your Heart Attack. It Should Pay $100 to Prevent
    It. | MedPage Today
  fetch_status: success
  content: "[Perspectives](/opinion) \\> [Second Opinions](/opinion/second-opinions)\n\n#
    Medicare Will Pay $50k for Your Heart Attack. It Should Pay $100 to Prevent It.\n\n—
    The guidelines have finally caught up to the evidence supporting coronary artery
    calcium scans\n\n by Arthur Agatston, MD, and Oren Mechanic, MD, MPH \n\nOctober
    25, 2026 • 3 min read\n\nMedpageToday\n\n ![](//assets.medpagetoday.net/assets/images/MPT_logo.svg)\n\n
    ![A photo of a mature man lying in a CT scanner.](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAJCAQAAACRI2S5AAAAEklEQVR42mP8/4cBL2AcVQAGAGnrEd24fu28AAAAAElFTkSuQmCC)\n
    ![A photo of a mature man lying in a CT scanner.](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAJCAQAAACRI2S5AAAAEklEQVR42mP8/4cBL2AcVQAGAGnrEd24fu28AAAAAElFTkSuQmCC)\n\nWe
    are currently in a \"[golden age of medical science,](https://www.abebooks.com/Golden-Age-Medical-Science-Dark-Healthcare/32487529021/bd)\"
    yet in a \"dark age of healthcare delivery.\" An important illustration is the
    diagnosis and treatment of America's number one cause of death and disability,
    coronary artery disease. More than [800,000 Americans](https://www.cdc.gov/heart-disease/data-research/facts-stats/index.html)
    suffer a heart attack each year. The great majority of these events are preventable.
    The coronary artery calcium score (CAC) is a simple 10-minute scan that can identify
    the presence and amount of coronary atherosclerosis many years before it causes
    a heart attack. It costs about $100 and uses a fraction of the radiation of a
    standard chest CT.\n\nIn March 2026, after more than three decades of accumulated
    evidence, the American College of Cardiology (ACC) and American Heart Association
    (AHA) finally gave CAC a central role in their [national guidelines](https://www.medpagetoday.com/cardiology/generalcardiology/120301)
    for the prevention of coronary artery disease. The CAC scan, which detects calcified
    plaque in the arteries, is recommended for adults with borderline or intermediate
    risk of coronary disease for whom the decision to start preventive therapy such
    as statin drugs remains uncertain.\n\nFor decades, doctors have relied on risk
    calculators built around age, sex, serum cholesterol, diabetes status, blood pressure,
    and smoking to estimate who might have a heart attack. The calculators estimate
    probability, not the actual presence of coronary atherosclerosis. In contrast,
    a CAC scan detects the disease itself. This is important because a patient with
    a borderline or low cholesterol may already have extensive plaque, while another
    with a high cholesterol may have none. A calcium score of zero re-classifies risk
    downward and thereby can avoid unnecessary pharmacologic treatment, such as statins.
    A score above 100 identifies patients who may benefit from pharmacologic and aggressive
    lifestyle intervention.\n\nAn excellent illustration of the role of CAC scanning
    is Rob\\*, a 52-year-old patient we saw recently. He exercises regularly, eats
    well, and has borderline high cholesterol. He has a family history of heart disease
    but no other known cardiac risk factors. The standard risk calculator places him
    in a low risk category, and he would prefer to defer treatment.\n\nHis CAC score,
    however, tells a different story. It is 220, indicating a substantial atherosclerotic
    plaque burden for a man his age. Genetics account for roughly half of cardiovascular
    risk, but the risk calculators do not include genetics. The scan demonstrated
    that drug treatment gives Rob his best chance of preventing a future heart attack.\n\nDespite
    mountains of evidence proving its superiority over conventional risk factors for
    predicting heart attacks, CAC scanning has been included only peripherally in
    national guidelines for the past 35 years. Why?\n\nPart of the delay is structural.
    Clinical decision support tools were built to modify population-average risk factors,
    not to incorporate individualized imaging. Guideline committees move cautiously,
    as they should, and prevention is harder to standardize than intervention. Cardiologists
    and primary care doctors, constrained by what insurers will cover, are left offering
    the test mainly to patients who can pay cash out of pocket.\n\nWith the updated
    ACC/AHA guideline, heart attack prevention is finally aligning around a simple
    principle: when possible, measure the disease.\n\nArtificial intelligence (AI)
    is also changing the economics of prevention. Millions of Americans already undergo
    chest CT scans for other reasons, yet the cardiovascular information visible on
    those scans is often ignored. AI can identify coronary and vascular calcification
    opportunistically, standardize reporting, and flag patients who should receive
    formal preventive evaluation. That's especially important for patients least able
    to pay cash for elective testing.\n\nAI-CAC is now being used to measure soft
    plaque, an important precursor to hard plaque seen on traditional calcium scores.
    Used responsibly, AI-enabled CAC analysis could help move heart disease prevention
    to the population health level.\n\nHeart attacks are largely preventable, and
    we have had the means to find the disease and treat it in time for more than a
    generation. What we have lacked is a payment system that spends $100 to avoid
    a $50,000 emergency.\n\nThe story of CAC isn't so unique. It is the story of how
    a low-cost, low-risk, well-studied tool can sit at the edge of clinical practice
    for decades because the systems around it -- the guidelines, the reimbursement
    codes, the habits of practice -- were not built to absorb it.\n\nThe evidence
    has been strong for years, and the guidelines have finally caught up.\n\n_\\*Patient's
    name changed for confidentiality._"
