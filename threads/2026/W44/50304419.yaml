  author: brandonb
  text: Coronary CT calcium scans are getting more popular. But before getting one,
    I&#x27;d do these simpler tests first:<p>- ApoB - about 20% of people with normal
    cholesterol results will have abnormal ApoB, and be at risk of heart disease.<p>-
    Lp(a) - the strongest hereditary risk factor for heart disease.<p>- hs-CRP - inflammation
    roughly doubles your risk of heart disease<p>- HbA1c - insulin resistance is a
    risk factor for just about everything.<p>- eGFR - estimates the volume of liquid
    your kidneys can filter, and is an input to the latest heart disease risk models
    (PREVENT).<p>These are simple blood tests. You can get them for &lt;$200 through
    my company or others:<p><a href="https:&#x2F;&#x2F;empirical.health&#x2F;product&#x2F;comprehensive-health-panel">https:&#x2F;&#x2F;empirical.health&#x2F;product&#x2F;comprehensive-health-panel</a><p>Imaging
    is great for detecting calcified plaque in your coronary arteries. But before
    you have calcified plaque, the above risk factors tell you about the buildup of
    soft plaque. And 4 out of 5 of them are modifiable through lifestyle, exercise,
    and medication.
