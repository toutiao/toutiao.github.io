  author: OkayPhysicist
  text: How recently were you in Vegas? I was blown away by how little smoking there
    was post pandemic even compared to 2018. Like, most casinos no longer reek of
    cigarette smoke. I&#x27;m sure that&#x27;s partly explained by better air circulation
    installed to reopen sooner post-COVID, and probably taking the closures as an
    opportunity to replace some seriously steeped carpet, but the amount of smoking
    was way, way down. It used to be if you saddled up to craps table, at least one,
    if not two people would be actively smoking. Now you can look around the entire
    pit and not even see one. The combination of anti-smoking measures in broader
    society, and the uptake of vaping has wildly reduced the amount of smokers. We&#x27;re
    talking a 60% reduction since 2000, and that was after the trend was already heading
    that direction.<p>Compare that to most places internationally, and the contrast
    is stark. The US has less than half the cigarette consumption per capita than
    the EU, with only the U.K., Norway, and Sweden having lower rates. China has a
    similar rate to the EU.<p>Just to drive that point home a little harder, the state
    with the highest number of smokers is West Virginia, sitting at 21% (the national
    average is 9.6%). That would be middle of the pack in Europe, similar to Italy.
