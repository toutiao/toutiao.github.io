  author: patja
  text: Based on my personal experience with Kaiser and their home fecal test (FIT
    test) as a cheaper screening method, I suggest opting out of it and insisting
    on a colonoscopy.<p>The problem is that the fecal tests are totally inconclusive.  Every
    positive test must be confirmed by a colonoscopy.  And then you get into tricky
    waters with insurance.  My Kaiser gastro doc insisted that my colonoscopy after
    a positive home FIT test would be billed as diagnostic and not covered at no charge
    as preventive screening.  Which means I would pay over $2k.  Despite the USPSTF
    publishing explicit guidance on this exact scenario still being screening.  He
    was dead wrong, and I wasn&#x27;t billed, but he and his department did everything
    they could to discourage me from following up with a colonoscopy.<p>And at one
    point he even turned the tables around on me and said this was all a consequence
    of my having opted for the FIT test instead of a colonoscopy.  Which I never did,
    I was not given a choice.  But from his statement I would assume that you can
    opt in to colonoscopy instead at Kaiser.  Then again this could be yet another
    piece of misinformation on his part.
