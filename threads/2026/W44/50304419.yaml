  text: 'Did you know that you can be sentenced to life imprisonment in the UK for
    suggesting that the monarchy should be abolished? [1] That&#x27;s quite progressive,
    since it used to be the death penalty. Now in reality you probably won&#x27;t
    be, but that law is an echo, still ongoing, of the sort of systems everybody used
    to live under. That directly leads to ideals of a smaller government. So I don&#x27;t
    think these sort of values we&#x27;re speaking of are abstract or moralistic in
    nature.<p>It&#x27;s also not just in the past. We continue to live in the era
    of mass domestic surveillance, Patriot Act, Snowden leaks, regular oppression
    for political views (see: pro-Gaza protests), two tier legal systems, and much
    more. All the while governments with vast resources plunge sizable chunks, verging
    on a majority of discretionary spending, into militarism flirting with WW3 and
    the viable end of humanity it would entail. And I&#x27;m not even going to get
    into the insanity that&#x27;s going on, worldwide - including the West, with the
    treatment of political candidates and elections. Suffice to say that&#x27;s also
    enough to make a lot of people quite concerned.<p>So again all of this makes one
    begin to think &#x27;perhaps governments shouldn&#x27;t have this much power or
    wealth&#x27; at a point that I imagine you would say is, itself, already relatively
    low. I think that should all be fairly reasonable, even if one might disagree
    at some point. But I&#x27;m not entirely sure what the comparable evidence for
    the alternative is.<p>[1] - <a href="https:&#x2F;&#x2F;www.theguardian.com&#x2F;uk-news&#x2F;2013&#x2F;dec&#x2F;13&#x2F;calling-abolition-monarchy-illegal-uk-justice-ministry"
