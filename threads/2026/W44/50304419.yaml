    has been in developing countries.<p>I have no illusions about poverty and am not
    going to pretend that the US isn&#x27;t a &quot;rich&quot; country. But I&#x27;ve
    also noticed a very stark trend in the past decade: fewer and fewer people express
    interest in emigrating to the developed world.<p>I currently live in one of the
    fastest-growing countries in the world. Its per capita GDP PPP is about a fifth
