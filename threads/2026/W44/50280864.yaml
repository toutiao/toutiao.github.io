article:
  url: https://www.wired.com/story/massive-leak-exposes-41000-homeland-security-workers-including-undercover-ice-agents/
  title: Massive Leak Exposes 41,000 Homeland Security Workers—Including Undercover
    ICE Agents | WIRED
  fetch_status: success
  content: |-
    An unprecedented leak of [Department of Homeland Security](https://www.wired.com/story/dhs-wants-protesters-signal-group-chats/) records has exposed details of more than 41,000 employees or contractors who work for the department and its constituent agencies. The records include email addresses, phone numbers, and office addresses, but also references to internal systems and sensitive information on undercover and surveillance programs. In all, the leak provides a map of how [DHS](https://www.wired.com/tag/department-of-homeland-security/) is organized and how it operates.

    The records, which span DHS itself as well as seven component agencies, including Immigration and Customs Enforcement and US Customs and Border Protection, were last updated on August 19, 2026. The transparency nonprofit [Distributed Denial of Secrets](https://en.wikipedia.org/wiki/Distributed_Denial_of_Secrets) and cybersecurity researcher and journalist [maia arson crimew](https://www.wired.com/story/leak-exposes-members-of-peter-thiels-secretive-dialog-society/) previewed the data for WIRED, which they say they obtained from a group calling itself the Department of Peace.

    DDoSecrets published the archive, which it calls “Icepick,” on Wednesday. In a press release, DDoSecrets says the data is from DHS's Okta login system. In a note with the files, the hackers wrote, “They have our information, so it’s only fair that we have theirs.”

    An Okta spokesperson tells WIRED that it is unaware of any breach of its systems. “We are aware of this report. Okta is secure, and we have no evidence our data or systems were compromised,” the spokesperson says.

    The leak comes as DHS has aggressively [pursued its critics](https://www.wired.com/story/ices-internal-watchdog-is-now-investigating-online-critics/), seeking to [unmask](https://www.wired.com/story/dhs-demanded-google-surrender-data-on-canadians-activity-location-over-anti-ice-posts/) anonymous social media users, obtain [customer records](https://www.wired.com/story/ice-wants-to-know-who-bought-a-certain-green-beanie-from-rei-in-the-last-2-years/) on protesters, and [secure warrants](https://www.wired.com/story/feds-got-warrants-to-use-fake-cell-towers-to-hunt-down-don-lemons-producer/) for surveillance tools aimed at reporters. Since the start of the second Trump administration, DHS and the federal government have moved to hide DHS employees’ [names and faces](https://www.wired.com/story/states-want-ice-agents-to-show-their-faces-the-trump-administration-is-blocking-them/). The agency has also [expanded its definition](https://www.wired.com/story/ice-agents-are-doxing-themselves/) of “doxing”—a term that typically refers to publishing someone’s home address and other personal details for malicious purposes—to encompass the publication of basic facts about public employees, like their names and titles.

    The leak follows a breach in which a group of hackers known as ShinyHunters claimed to have stolen personal information on nearly every FBI employee and their families. Law enforcement agencies have arrested several suspects and detained another who is alleged to be part of the group.

    The DHS records are searchable on a website crimew built. “I don't think we should let them scare us into not looking into them,” she tells WIRED.

    “DHS is aware of a potential breach and is actively working to address the situation swiftly and effectively,” a Homeland Security spokesperson tells WIRED. “We take all security threats against our employees and officers seriously and will work to ensure all are properly protected. We will update the public when more information is available.”

    The DOJ did not respond to WIRED’s request for comment. The FBI referred WIRED’s inquiry to DHS.

    According to a WIRED analysis of the data, CBP staffers account for more than half of the records. ICE accounts for about 10,000, roughly a third of them in Homeland Security Investigations, ICE’s investigative wing. Another 6,200 belong to US Citizenship and Immigration Services, and nearly 1,000 are tied to the Cybersecurity and Infrastructure Security Agency, more than half of them contractors. Altogether, the files cover about a seventh of DHS’s workforce, revealing how DHS is structured, from senior leadership down to individual immigration agents and detention contractors.

    Like most large organizations, DHS uses permission groups to control access to internal systems, according to the leaked records. Nearly everyone named in the leak has access to at least some of these systems. At HSI, 39 employees across more than a dozen field offices belong to groups whose names include “CUC,” which government court filings say stands for “certified undercover operation.” Another group, apparently based in HSI's St. Paul, Minnesota, area of operations, references "Keyhole," which federal court filings describe as a certified undercover operation that recently funded HSI’s [undercover surveillance of Minneapolis protest groups](https://www.wired.com/story/ice-is-running-one-of-the-largest-anti-left-surveillance-operations-in-us-history/) earlier this year. Others reference a “Communications Intercept Center TechOps (CICTO) Program,” a “Title III Intercept Program” for wiretaps, and an “Illicit Sensor Intercept Program (ISIP).”

    The names of the groups—there are over 55,000 in all—appear to reference tools for accessing immigration court records, pulling data from seized phones, and conducting surveillance. These include Palantir’s Falcon investigative platform and PenLink, which analyzes phone records and social media.

    Two permission groups, named “Executive Leadership” and “AI Access,” appear to list people given exceptions to DHS's web filter, which blocks some websites for employees. They contain the same 13 people, including former DHS head Kristi Noem; Antoine McCord, the recently departed DHS chief information officer who has [returned to defense tech company Anduril](https://fedscoop.com/former-dhs-cio-antoine-mccord-anduril/); Philip Hegseth, listed as a senior adviser to the DHS secretary and the younger brother of defense secretary Pete Hegseth; and Jayce Krachenfels, listed as a policy adviser, who previously worked as a regional field director for Donald Trump’s 2024 presidential campaign, according to his LinkedIn profile. Noem, McCord, Hegseth, and Krachenfels did not respond to a request for comment

    Other groups named in the leak reference AI tools, including OpenAI’s ChatGPT, Google’s Gemini, and Microsoft’s Copilot. One, called “Grok.com,” includes eight DHS technology officials, including the department’s former chief information officer and chief data officer.

    “If authentic and current, this is an extraordinarily valuable intelligence resource for those seeking to penetrate DHS,” says Alexander Leslie, a national security expert at the threat intelligence company Recorded Future. “This dataset becomes way more valuable when correlated with previously compromised information, commercial data, and other intelligence collections. An adversary could spend months exploiting these relationships to identify vulnerable personnel, develop convincing impersonation attempts, or compromise ongoing investigations.”

    More than 700 accounts are associated with a group apparently referencing [Signal](https://www.wired.com/story/signal-tips-private-messaging-encryption/), the encrypted messaging app, nearly all belonging to CBP personnel. More than 200 CBP accounts belong to a group referencing [Mobile Fortify](https://www.wired.com/story/mobile-fortify-face-recognition-nec-ice-cbp/), a face-recognition app that immigration agents use to identify people. The group includes field supervisors, special response team operators, and tactical and intelligence agents. About half are in Texas, California, and Arizona.

