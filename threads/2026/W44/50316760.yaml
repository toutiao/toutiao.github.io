  author: otherme123
  text: 'Modus ponens is a valid &quot;If A happens, B happens in consequence. A happens.
    Then B also happens&quot;. A &quot;modus ponens fail&quot;, also called &quot;affirm
    the consequence&quot; is the invalid &quot;If A happens, B happens in consequence.
    B is observed. Then A happened&quot;.<p>Valid: if someone is hit by a train, he
    dies. Someone was hit by a train, then he is dead.<p>Invalid: if someone is hit
    by a train, he dies. Someone is found death, thus he must have been hit by a train.'
