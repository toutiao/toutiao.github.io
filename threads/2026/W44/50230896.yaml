  text: Turbo Assembler!!! I think that was pretty much the standard in the demoscene,
    at least in my circles. I wrote most of our DOS demos with it. Anything that ran
    in real mode, doing all the wild things like modifying code loaded already in
    memory... Then for actual 32-bit code (using protected mode) watcom c+asm compilers
    became the go-to. I still hand rolled some assembly, but with the advent of Pentium
    processors, their pre-fetch and dual pipeline execution watcom C did a fairly
    good job to compile highly efficient&#x2F;optimised code, so asm coding mostly
    went away. (did use it later professionally for microchip controller programming
    though) As for nostalgia, I&#x27;d rather pick up a virtual console nowadays.
    The limited resolution, colours, etc. gives enough mental exercise without going
    back to x86 asm. :)
