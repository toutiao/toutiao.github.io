  text: Calls have overhead, so they shouldn&#x27;t be used for everything, especially
    in hot paths. The entire point of writing assembly is to optimize performance.
    Even on very limited hardware, or rather especially on limited hardware, you&#x27;d
    usually much rather trade code size for performance.
