  text: The history was a little more complex than that. The trains were not too wide,
    they were the right legal size where ordered.<p>The problem is while the trains
    were being built, the laws changed, requiring now extra space between trains and
    tunnels to evacuate people.<p>The only solution would be to dump all the trains
    and start from scratch in a new design for narrower trains that still  keep the
    same comfort and safety levels. This is not realistic.<p>If you order a car that
    has legally given the green light to  be built in 2026, the government can&#x27;t
    say in 2027 that your car must had measured 1m less. Would be unfair for buyer
    and maker. Unless the government can show a very solid reason, they must accept
    the car model for the expected years of car life. This is why we still can drive
    legally cars with no airbags, and with toy seat belts. Cars that no way would
    be accepted to be built today.<p>Who ordered the trains was doing everything right,
    the problem was created by who changed the specifications in the middle of the
    process.
