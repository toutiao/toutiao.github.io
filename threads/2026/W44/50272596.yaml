  author: amiga386
  text: '<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Automatic_train_operation"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Automatic_train_operation</a><p>What
    this chart doesn&#x27;t show you is how much more <i>expensive</i> it is to advance
    the grade of automation. Systems like the Docklands Railway are only safe because
    all their tracks are grade separated with exclusive track. They still need a person
    on board to be sure that nobody is stuck in the doors or wedged between the train
    and platform before the train starts moving.<p>&quot;Have computers control everything&quot;
    is four words to say, but it&#x27;s millions or billions more in money, and adds
    years to the projects. London&#x27;s Crossrail, for example, was years late due
    to the complexity of switching between 4 separate signalling systems (ETCS on
    the Heathrow branch, AWS on the GWML, TPWS on the GEML, and CBTC in their tunnel
    and exclusive track.)<p>We&#x27;re still using TPWS on the ECML, for example,
    because:<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Train_Protection_&amp;_Warning_System"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Train_Protection_&amp;_Warning_Sys...</a><p>&gt;
    TPWS was developed by British Rail and its successor Railtrack, following a determination
    in 1994 that British Rail&#x27;s Automatic Train Protection system was not economical
    – ATP would cost £600 million (equivalent to £1.2 billion in 2024) to implement,
    compared to value in lives saved: £3 – £4 million (£6 – 8 million in 2024), per
    life saved, which was estimated to be 2.9 per year.<p>TPWS is where a little light
    comes on saying it would be a good idea to brake now because you passed a signal
    at danger. Only very fancy versions of TPWS will actually apply the brakes for
    you.<p>And then we had the Southall and Ladbroke Grove crashes a few years later:
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Ladbroke_Grove_rail_crash"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Ladbroke_Grove_rail_crash</a><p>&gt;
    Both crashes would have been prevented by an operational automatic train protection
    (ATP) system, wider fitting of which had been rejected on cost grounds. The crash
    severely damaged public confidence in the management and regulation of safety
    of Britain&#x27;s privatised railway system.<p>But even then, an inquiry asked
    to look specifically into ATP determined we were right to reject it, it was just
    Too. Fucking. Expensive.<p>&gt; Since both the Paddington and Southall crashes
    had reopened public debate on ATP, a separate joint inquiry considering the issue
    in the light of both crashes was also held in 2000; it confirmed the rejection
    of ATP and the mandatory adoption of a cheaper and less effective system, but
    noted a mismatch between public opinion and cost-benefit analysis.'
