  text: "&gt; It’s not unreasonable to consider jail time or even capital punishment
    for such gross negligence.<p>It is <i>entirely</i> unreasonable to consider capital
    punishment.<p>* an eye for an eye solves nothing - it doesn&#x27;t bring dead
    people back to life, it just results in another person killed<p>* it&#x27;s not
    an effective deterrent, it won&#x27;t change how people act more than the risk
    of jail-time will<p>* it&#x27;s unethical. It sounds like &#x27;justice&#x27;
    if your idea of justice is simple retribution, but it completely undermines the
    concept of redemption - it advocates treating people as unfixable and unable to
    atone for their &#x27;sins&#x27; and instead of limiting the pain and suffering
    - it spreads pain to more people<p>* no system is perfectly and inevitable you
    will end up punishing somebody with death based on faulty &#x2F; flawed evidence
    that only later comes to light as being flawed&#x2F;faulty. You can&#x27;t bring
    a dead person back to life and say &quot;sorry we got it wrong&quot;<p>* finally
    - and perhaps most critically - tragedies such as these are almost the result
    of failures across an entire system with 10s, 100s, sometimes 1000s of people
    each culpable to varying degrees with many &#x27;sliding doors&#x27; moments where
    such a tragedy could have been avoided had a different decision been taken. Sure
    you can always simplify things and point to the symbolic figurehead and say <i>they</i>
    are ultimately accountable and should take the ultimate responsibility for the
    group&#x27;s failure (bonus points if in doing so you highlight how well paid
    they are to take on such a responsibility). But what you&#x27;ll arrive at isn&#x27;t
    justice and higher standards - instead you&#x27;ll just have another dead person,
    killed in cold blood and the generic hope that somehow <i>that</i> additional
    death will act as a stronger driver of change than the already very real deaths
