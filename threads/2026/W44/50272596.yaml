  text: 'That&#x27;s a &quot;nobody&#x27;s dead <i>yet</i>&quot; scenario. Safety
    standards require full platform doors at all stations for attendant-free operation,
    i.e. the platform has wall-to-ceiling barriers, the train arrives perfectly aligned
    (which means zero variation in train configuration, which rules out almost all
    mainline stations that accept different operators services), and the platform
    doors open and close in sync with the train doors.<p>Anything less is begging
    to get someone wedged in there as the train drives off, even if it&#x27;s just
