  author: nomel
  text: Relevant text from TFA:<p>&gt; This isn’t the first time the environmental
    agency has tried to shutter the online web archive. In late January 2022, the
    Biden administration EPA announced plans to discontinue the online repository,
    citing burdensome financial upkeep; through a Freedom of Information Act request,
    Gehrke was able to determine that the agency spent roughly $2 million a year to
    maintain it. A coalition of environmentalists, historians, and librarians swiftly
    condemned the decision, with groups like the EDGI and American Society for Environmental
    History calling the announcement “alarming” and cause for a “tremendous gap” in
    the historical record.<p>&gt; After five months of public backlash, the EPA acquiesced,
    in part by announcing it would delay the web archive’s retirement by one year
    to July 2023.
