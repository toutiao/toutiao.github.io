    (it is), then that means maximizing viewership.  In this way, it doesn&#x27;t
    really matter <i>what</i> people are watching as long as they&#x27;re actually
    watching it.  More hours of streaming consumption = more hours of ads viewed,
    and the clock doesn&#x27;t care if it&#x27;s positive and enjoyable content or
    rage-inducing clickbait.<p>So with meaningful feedback, the good stuff should
    be able to float up to the top.  That would gain viewers, which gains ad placements,
