  author: masklinn
  text: The PDP family had word sizes of 18, 12, and 36 bits, so octal notation was
    very common. The PDP-11 was a rare 16-bit architecture but was full of octal nonetheless
    (e.g. the front panel switches used octal grouping, assembly immédiates defaulted
    to octal, addresses and device registers were in octal, …) so octal would have
    been quite natural to unix developers. In fact the original binary data formatter
    was od, octal dump, and is so old it was reportedly why the bourne shell uses
    do…done rather than do…od.
