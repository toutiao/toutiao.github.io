    Ah this is interesting, and it's along the lines of what I was thinking.
    I've worked on "J8 Notation" intermittently over the last few years -- basically  I would like to make something largely compatible with CSV/TSV and HTML5/XML, but as well-specified as JSON [1]
    So I was hoping to do some data-driven experiments (most likely aided by LLMs), to see what the frontier between "compatible" and "well-specified" is ...
    I would also add "declarative" -- I like that this tar-codec work seems to be based on explicit state machines.   I hope to find time to look into it more.
    So basically I am curious what kind of metalanguage can express formats like CSV TSV HTML5 XML, while also being compatible with say 99.999% of some corpus that we can argue to be representative.
    And you can ask the same question of tar -- PyPI and OCI would be great test corpora.  So basically I would like A fast and secure tar parser for the Rust ecosystem -> A fast and secure tar parser for all ecosystems :-)   (C and C++, Python, Ruby, etc.)
    As mentioned in the article, these problems are NOT related to memory safety, so the same benefit would extend to C and C++, and all languages that use them.

    (Aside: I think many people have PyPI mirrors, perhaps of all 12 TB?   For those  with fewer computing resources, maybe you could get that data with HTTP range requests -- maybe that depends on gzip --rsyncable or some such thing ...)
    [1] JSON only has a couple holes in its spec, which have been addressed by follow-on RFCs I   believe.  Many of the "JSON is a minefield" problems are particular to the representation of values within a programming language, which is an inherent issue -- not part of the JSON spec.
