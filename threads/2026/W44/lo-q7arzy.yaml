    Hm very interesting.  This seems like a tight rope to walk, since compatibility and avoiding parser differentials are fundamentally opposed (i.e. more features supported is more potential differences).
    Without knowing much about Python packaging, I wonder if there are something like 100K or 500K  source tarballs in PyPI?  If so, I wonder what the "minimum tar" necessary to parse those is.  It
    seems like potentially a more bounded problem - parse the things that are in PyPI.
    And then maybe reject input at PyPI upload time (although I understand why this is hard in a social sense)
    I asked Gemini and practically speaking the "writers" include GNU tar, OS X tar which is more like BSD, Python's tarfile module, and Go's tar module.   All of them use SOME extensions, e.g. for long filenames, but I also wonder if the union of all features they emit is meaningfully smaller than "all tar extensions" !

    Also reminding myself that this post also has a bunch of background on the various tar format extensions, in the context of OCI: https://www.cyphar.com/blog/post/20190121-ociv2-images-i-tar/
    I also wonder if tar files that appear in practice in Docker/OCI  are of different dialects than PyPI, or it's all basically the same set of tools creating them.
