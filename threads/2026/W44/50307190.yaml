  author: spijdar
  text: The GPU would also be a problem. I don&#x27;t think the Wii&#x2F;Gamecube&#x27;s
    GPU block really corresponds to any ATI&#x2F;AMD card.<p>What you could probably
    do is take a Wii emulator like Dolphin and virtualize the CPU. Basically combine
    Dolphin and KVM_PR, getting ~native CPU performance while still needing to do
    3D translation and simulate the IOS side of the Wii.<p>(Wii games run with the
    CPU in the supervisor state IIRC, so you can&#x27;t just run them as processes
    under an OS, you&#x27;d either need a proper hypervisor or to catch traps caused
    by running supervisor instructions in &quot;problem state&quot;, a la KVM_PR.)
