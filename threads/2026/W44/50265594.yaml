  text: This is the way forward these days. In my opinion the situations in which
    a Raspberry Pi is the right answer are vanishingly small these days - for interacting
    with physical things like relays or LEDs use an ESP or similar, run Micropython
    on it if you&#x27;re not into writing C and the like, or ESPHome if you want something
    dead simple.<p>If you need an actual computer there are <i>so many</i> options
    along those lines now, and almost all of them are better than a Raspberry Pi in
    various aspects. Finally, if you just want to put some stuff on a screen then
    most TVs already have an operating system and a web browser on them, target that
    and you can get rid of the computer dangling off the back entirely.
