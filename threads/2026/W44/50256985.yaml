    Open3DLab •
                    Roblox downloaded 145 GB of models from our sites (including adult content) without asking
  fetch_status: success
  content: "## Roblox downloaded 145 GB of models from our sites (including adult
    content) without asking\n\n* * *\n\nBy on October 26, 2026   \nLast updated on
    October 26, 2026\n\n**On 15 and 16 October 2026, a crawler that said it belonged
    to Roblox walked through almost every project on Open3DLab, SFMLab and SmutBase,
    and proceeded to download complete copies of 1,027 files from 712 projects. 145.5
    GB of our creators' work, downloaded for what we assume are AI training purposes.**\n\nThis
    post briefly describes what happened, what mitigations were taken, and what this
    signals for the community at large. A more detailed writeup outlining what we
    saw in our logs will be posted at a later time.\n\n# What happened\n\nOn Sunday
    the 18th of October, we noticed a crawler making a large number of requests to
    our sites and download infrastructure. The crawler sent the same user agent on
    every request, `trellis2-data-sourcing/1.0 (3D foundation model research; [redacted]@roblox.com)`.
    It came from a single Amazon Web Services (AWS) address. It had read the main
    page of 18,926 projects, which is practically our entire catalogue, in 26,429
    requests over a span of 34 hours.\n\nAfter pulling the project pages, it downloaded
    complete copies of 1,027 files from 712 projects, 145.5 GB in all, before suspending
    operations during the weekend. The downloads include 364 files (54.8 GB) from
    224 projects on SmutBase, which hosts adult content only. With the SFMLab projects
    marked adult, 345 of the 712 projects (62.6 GB) are adult content.\n\nThe main
    limiting factor in the number of files downloaded was the crawler's reliance on
    the free download servers, which have caps on speed limit and number of concurrent
    downloads. The crawler did not respect our robots.txt, (which it did retrieve),
    ignored our Terms of Service, (which forbid scraping), and defied the creators'
    licenses: 423 of the 712 projects are licensed for non-commercial use only. Within
    the sample it retrieved, it took adult projects at the same rate as everything
    else. Some examples include models of [Eve from Stellar Blade](https://smutba.se/project/0bc1da85-0f2f-4f5e-b69c-0431707154f8/),
    [Mei from Overwatch](https://smutba.se/project/0f735d5b-1446-46ef-8219-d52639d962d4/),
    and a [Horse cock dildo](https://smutba.se/project/01c9a46d-dd73-4706-a861-fb5294a48a84/).\n\n#
    Our response\n\nWe found it on 18 October and blocked further attempts the same
    morning. The scraper had suspended its activity by that point, and we did not
    notice any scraper that weekend. We emailed the address in its user agent on 18
    October and asked Roblox for comment. We have not had a reply.\n\nThe crawler
    resumed scraping activity on October 19th, with all requests getting blocked by
    our servers. The scraper did not reduce its download attempts when faced with
    our blocks, and the scrapes seemed to fit neatly within office hours, only briefly
    pausing for an hour around lunchtime, and ending activity around the end of the
    workday (CEST). On the 20th, their scraper made its final return at 8:00, slowly
    tapering requests from lunchtime onward, likely in an effort to test our rate
    limiting. The requests stopped around 15:00. We sent another email to Roblox for
    questions, to which they again did not reply.\n\n# Speculation\n\nThis section
    contains our speculation and assumptions based on public information, and the
    information we noticed in our logs.\n\nRoblox has been building a \"3D foundation
    model\" since at least 2025.In March 2025 Roblox introduced [Cube](https://about.roblox.com/newsroom/2025/03/introducing-roblox-cube),
    which it calls its core generative AI system for 3D and 4D. The accompanying [paper](https://arxiv.org/abs/2503.15475)
    describes the goal as a foundation model for 3D intelligence. It lists character
    rigging among the things that model should eventually do, and generating characters
    and avatars as future work. Its first shape model was trained on roughly 1.5 million
    3D assets from licensed and public datasets such as Objaverse, plus free assets
    from Roblox's own Creator Store whose creators had opted in. In February 2026
    Roblox began [rolling out \"4D generation\"](https://www.bnnbloomberg.ca/business/2026/02/04/roblox-launches-ai-tech-that-generates-functioning-models-with-natural-language/)
    built on Cube.\n\nThe address in the user agent belongs to a researcher who is
    among the 40-plus authors of that Cube paper. The researcher's public professional
    profile says they are building a 3D foundation model at Roblox, and their earlier
    published work is on 3D reconstruction and real-time 3D rendering. We want to
    be clear: we don't suggest this researcher did anything on their own initiative
    or out of the ordinary for their job. A data-collection run like this is a company's
    decision, and the responsibility for it is Roblox's. But the profile says what
    the user agent says: the people behind this crawler build 3D foundation models.\n\nThe
    \"trellis2\" in `trellis2-data-sourcing` may refer to [TRELLIS.2](https://github.com/microsoft/TRELLIS.2),
    an open 3D generation model Microsoft released in late 2025. It may mean the data
    was meant for training or tuning a model like it, or it may just be a project
    codename. We don't know. What we can say is that TRELLIS.2's published [data toolkit](https://github.com/microsoft/TRELLIS.2/tree/main/data_toolkit)
    contains no web crawler and no user agent, so this crawler and its label were
    written for the job. It is also possible that Roblox is re-using the Trellis.2
    tooling for its own foundational model and it is re-using these scripts for its
    next model; the tools are open source.\n\nOur sites are full of things a 3D model-generation
    system needs and public datasets have relatively little of: complete, textured
    characters, many of them rigged, in the formats artists actually work in, each
    with a title, a description and preview images.\n\nPut together, **we think the
    most likely explanation is that the crawler was collecting training or evaluation
    data for Roblox's 3D foundation model work.** We can't prove it, and we don't
    know whether any of our creators' files ended up in a model.\n\n# Roblox's track
    record\n\nThis isn't the first time Roblox has been criticised for how it treats
    the people whose work its platform runs on, or for how it handles other people's
    rights.\n\n- **Young developers.** In 2021 the games outlet People Make Games
    published a [video investigation](https://www.nme.com/news/gaming-news/roblox-is-allegedly-exploiting-young-game-developers-3024548)
    arguing that Roblox turns its young users into underpaid developers. By its calculation
    Roblox kept around 75% of the money spent in developers' games, against Steam's
    30%, and paid creators in Robux, which they can only cash out once they've earned
    a minimum amount. Roblox declined to discuss its revenue share and payout minimums.
    (In September 2025 it [raised its cash-out rate](https://www.sec.gov/Archives/edgar/data/1315098/000131509825000327/rblx-20250930.htm)
    by 8.5%.)\n- **Copyright.** In 2021 the US National Music Publishers' Association
    sued Roblox for at least $200 million over unlicensed music on the platform. The
    case [settled](https://www.nmpa.org/nmpa-and-roblox-settle-copyright-suit-launch-music-licensing-talks)
    later that year for an undisclosed amount.\n- **Child safety.** In October 2024
    the short seller Hindenburg Research [accused Roblox](https://gameworldobserver.com/2024/10/09/hindenburg-research-roblox-report-inflated-dau-child-safety)
    of inflating its user numbers and of failing to protect children. Roblox called
    the report misleading and pointed out that its authors stood to profit from a
    falling share price. Since then the attorneys general of [Louisiana](https://techcrunch.com/2025/08/15/louisiana-attorney-general-sues-roblox),
    Kentucky, Texas and Florida, among [other states](https://www.nolo.com/legal-encyclopedia/what-are-the-roblox-lawsuits-about.html),
    have sued Roblox over child safety, and private lawsuits have been consolidated
    in US federal cour"
