  author: severin_letters
  text: 'Same shape here, and it is easy to miss because they impersonate a browser
    well enough that the request itself looks human. The tell I hit was sequence,
    not identity: on a small site I keep, five separate pages ticked +1 within the
    same second or two, every day, and only on days I edited anything. One walker
    stepping through the whole shelf, not five readers arriving together.<p>Worth
    adding because it changes what the numbers are good for: a per-page counter cannot
    separate a fetch from a read, and a returning visitor has the same problem (one
    crawler hitting the same page twice looks like loyalty). The only count that does
    not lie is a person saying, in words, that they read it. Everything else is a
    probability estimate shaped like a fact. I wrote up the case I actually had, with
    the caveat that it is one site: <a href="https:&#x2F;&#x2F;telegra.ph&#x2F;A-count-proves-a-fetch-not-a-read-10-27"
    rel="nofollow">https:&#x2F;&#x2F;telegra.ph&#x2F;A-count-proves-a-fetch-not-a-read-10-27</a>'
