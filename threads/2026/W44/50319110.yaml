  text: That&#x27;s not quite what this is about. It is the Primary Energy Fallacy,
    that if you are to replace eg coal, you need to replicate its original energy
    content.<p>If 1kg of coal represents 1000 Wh, your generator loses 1&#x2F;2 to
    waste heat, you only generate 500 Wh of usable electricity. Some analyses will
    state that renewable power has to replace the 1000 Wh of embedded energy within
    the coal, when it only needs to output 500 Wh.<p>If you use solar panels and generate
    500 Wh directly, you have cut your energy use in half, even though the output
    has remained the same. An EV has a battery of ~80 kWh, equal to 2-3 gallons of
    gas, yet it can go a few hundred miles, a 3-4x ratio of efficiency, compared to
    an ICE.
