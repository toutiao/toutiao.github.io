  author: bjelkeman-again
  text: We have a wooden house from 1909, insulated, but not to modern standards and
    many windows. The heating and hot water is provided via a 10 kW (out) modern heat
    pump with a 100 meter borehole into the ground. This is a fairly standard installation
    in Sweden. It provides all the heat needed, except for extremely cold days (-20c
    or lower) when a 7 kW immersion heater can provide support. This is not needed
    more than a few days a year where we are.<p>We have added a small solar installation
    (7kWp) and a battery pack (18kWh). It provides 90% of power needed in the summer
    and allows for decent peak shaving in the winter, to lower network costs.<p>Additionally
    we are Co-owners in a windpower cooperative that provides more than our share
    of electricity into the network. So we are essentially operating our home on wind
    and solar, as well as powering the electric car.
