  text: |-
    Oh, such tactics are still applicable to dehumidify outside air in an air source system (and possibly further extract enthalpy by freezing off the excess water captured in the &quot;wet scrubber&quot;).<p>In general, using heavily salted water (not sodium chloride that&#x27;s quite ineffective) to dehumidify humid cold air during heating and reject heat with a wet interface without having to source potentially scarce water to evaporate, is quite an intriguing alternative to classic fan-laden AC &quot;condenser&quot; coils.<p>Incidentally, KOH is also interesting as it dehumidifies down to quite low humidity (at least indoor-facing) before it saturates (and precipitates out), and as a side-gig scrubs CO2 that can be precipitated out with CaO&#x2F;Ca(OH)2 as CaCO3 (limestone).<p>This can be thermally recovered at around 800~900 C to essentially &quot;boil&quot; the CO2 off.<p>IMHO a chemically appropriate wet heat exchanger based on (cross flow: easy) or (counter-flow: harer to prevent droplet formation) with just a simple corrugated structured packing should be able to operate more hygienically than a theoretically dry, practically humidity-condensing classic mini-split AC coil. And allow most dust to be washed off fully automatically from normal operation.
    It&#x27;d &quot;just&quot; need a regenerator to dry out excess unwanted humidity, but I&#x27;d assume there&#x27;s a reasonable way to boil off the excess humidity from the &quot;salty water&quot;. Maybe the common reverse-osmosis filter materials can resist these chemicals; in that case it&#x27;d sound like a question of pressurization energy recovery; or it could be put under vacuum and a small heat pump could transfer the enthalpy of vaporization from the condenser [distilled water plus dissolved gasses, vacuum] (that isn&#x27;t fully flooded due to presence of dissolved gasses in the feed) to the evaporator [salty water, same vacuum]. If the ratio of dissolved gasses relative to the extracted condensate is small enough, I&#x27;d guess a water jet &quot;ejector pump&quot; using that very condensate (after it&#x27;s cooled down enough to not boil in the ejector) would actually work to provide the vacuum for continuously pumping the dissolved gasses that boil out along the humidity... A small centrifugal pump for that can easily be made completely sealed using magnets to transmit the torque to the impeller and a long life ceramic bearing, at least if there&#x27;s a long enough pipe down to the pump to build minimum inlet pressure (against cavitation).<p>Also: For vacuum btw. remember the convenience of using gravity to pull a (nearly) 10m column of water down. Dissolved gasses are likely the dominant complication.
