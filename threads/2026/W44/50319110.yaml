  author: hinkley
  text: Electric motors have gotten ridiculously efficient. In the right power curve
    you can hit 95%, which is why we have now moved onto power per unit weight and
    unit volume. You make the drivetrain lighter you reduce the power needed for 0-60
    times, which gets you a few more percent of efficiency.<p>Same thing with battery
    power density - it’s the rocket equation. Heavy batteries don’t go far. To go
    farther you add battery, then more battery to carry enough power to carry the
    larger battery. Increase the specific energy rather than the mass, and all the
    extra power goes into going faster or farther.
  score: 0
