  parent_id: '50326620'
  author: adrianN
  text: Heat pumps lose a lot of efficiency when they need to provide higher temperatures.
    Fossil fuel often heats the water in the radiators up to 70C in old systems, so
    that reasonably sized radiators have enough power to heat the poorly insulated
    building. You can do that with heat pumps too, but you get rubbish COP. Adding
    insulation or bigger radiators can be necessary to make the heat pump economically
    viable.
  score: 0
  posted_at: '2026-11-01T18:08:46Z'
- id: '50328193'
  parent_id: '50323596'
  author: WalterBright
  text: Electrical transmission lines lose power, too. So does generating the electricity.
    So does the electric motors. So does the heavier weight of the EV. Regenerative
    braking doesn&#x27;t apply when cruising on the highway.<p>And so on.<p>P.S. Since
    I drive a stick, I coast a lot. I live in a hilly area, and have a pretty good
    feel for just how and where I can shift into neutral and coast. I also coast towards
    a red light with the goal of reaching the intersection just when it turns green.
    (Moving forward from a dead stop uses lots of energy.)
  score: 0
