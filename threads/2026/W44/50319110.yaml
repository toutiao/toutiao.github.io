  author: servo_sausage
  text: The area I&#x27;m in, Victoria, goes from about -4 overnight at the coldest,
    to 45 at absolute peak (Celcius). Energy wise we are a &quot;more heating&quot;
    area, but comfort wise I personally prioritise cooling.<p>It&#x27;s a big place,
    the north is essentially a cooling year round climate.<p>Most of the older places
    have very little insulation, lots of airflow, single pane leaky windows.<p>Usually
    the areas you need to fix are air leakage, better windows (double glazing), then
    in ceiling insulation. In order of impact.<p>Our construction industry is pretty
    much broken, and considers double glazing advanced luxury alien technology...
    So it can cost so much to replace the old windows that you can run heat pumps
    as much as you like with the interest on the sum.<p>And without that the improvement
    from more diy insulation upgrades don&#x27;t really achieve much in a monetary
    sense.<p>On the other side, we have a much better solar and battery uptake, and
    the cost to install is fair. So a typical house might be a leaky wooden crate,
    but with enough solar and battery to be comfortable anyway.
