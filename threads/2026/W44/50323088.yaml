  author: injidup
  text: my experience is that one-shotting a simple front end works great. Then you
    want to add features and move things around and each turn starts getting slower
    and the single page with JS and CSS and HTML starts to turn into a 3000 line monster
    and your context window starts to creak under the strain of even simple changes,
    because the LLM has to keep more and more of the application in its head just
    to make relatively small changes without breaking something else. Either you should
    have started with some kind of framework with hygienic rules on how to separate
    concerns or at minimum a good set of coding standards that force the LLM to start
    building clean components from scratch. The benefit isn&#x27;t necessarily cleaner
    code for its own sake, it&#x27;s that the LLM can work on one part of the application
    without having to understand the whole thing every time. That being said, once
    you have a 3000 line prototype it&#x27;s not that complex to simply ask the LLM
    to refactor it into a set of orthogonal components. As long as it was building
    unit tests using playwright or something this can turn your slop into <i>framework</i>
    code cleanly. The interesting question is whether you saved anything by putting
    off that structure in the first place.<p>I run into this problem turning claude
    artifacts into things I might want to maintain longer term.
