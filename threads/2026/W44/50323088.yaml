  text: There are server side frameworks that use web sockets so you can refresh small
    parts of a page and not the entire page. This involves smaller round trips from
    client browser to web server. In my opinion, for data intensive applications it
    makes more sense rather than REST APIs returning JSON payloads, parsing JSON into
    objects client side, and then update the DOM.<p>I think a lot of JS developers
    fail to recognize the variations of client systems power or people&#x27;s usage
    patterns like how many tabs are open, how much GB of memory is their browser using,
    is the client machine paging out to disk, stuff like that. Not everyone is running
    a MacBook Pro so heavy client side JS apps tend to be &quot;slow&quot; to end
    users, at least perception.
