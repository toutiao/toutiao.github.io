  author: conartist6
  text: 'That JS supports await isn&#x27;t nearly as much a problem as the fact that
    it defensively defers execution any time it encounters one.<p>This hurts most
    badly for iterators.<p>Files are usually read from disks in chunks of 64K bytes.
    If you present the data as an async byte iterator you&#x27;ll get 65,534 defensive
    deferrals, and one actual wait.<p>If you have ten layers of transformation it
    will be 655,350 defensive deferrals and 10 real waits.<p>These defensive deferrals
    aren&#x27;t so expensive in terms of CPU time, but they ARE very expensive in
    terms of wall clock time. All other work must be halted so the event loop code
    can run. Eventually synthetic deferrals dominate the wall clock cost of running
    the program. This isn&#x27;t hypothetical either. Here&#x27;s someone trying to
    build steam parsing on Node and finding that it&#x27;s too slow to be useful:
    <a href="https:&#x2F;&#x2F;github.com&#x2F;nodejs&#x2F;node&#x2F;issues&#x2F;31979"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;nodejs&#x2F;node&#x2F;issues&#x2F;31979</a><p>The
    solution is stream iterators. They are sync when they can be and async when they
    must be: <a href="https:&#x2F;&#x2F;docs.bablr.org&#x2F;architecture&#x2F;spacetime"
    rel="nofollow">https:&#x2F;&#x2F;docs.bablr.org&#x2F;architecture&#x2F;spacetime</a>'
  score: 0
