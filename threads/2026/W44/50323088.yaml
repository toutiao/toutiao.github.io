  text: I disagree. Even if you don&#x27;t put too much weight into this test&#x27;s
    results, if you stick with vanilla JS your agents (or human devs) are going to
    write `element.addEventListener` and `document.querySelectorAll` countless times,
    and each one is going to drift a bit of time.<p>Having some sort of reusable framework
