article:
  url: https://nolanlawson.com/2026/10/28/the-ai-cost-of-javascript-frameworks/
  title: The AI cost of JavaScript frameworks | Read the Tea Leaves
  fetch_status: success
  content: "One of my pet peeves with the web development community is that so many
    of the decisions we make are vibes-based. Frameworks are “blazing fast,” tools
    will “supercharge” your development, the right abstraction will benefit both you
    and your users ( and all in one!). All of this breathless boasting is usually
    offered with zero evidence. Alex Russell has called this [“frontend’s lost decade”](https://www.youtube.com/watch?v=0XwWVjQOmyg),
    Baldur Bjarnason has called programming a [pop culture](https://www.baldurbjarnason.com/2022/programming-is-a-pop-culture/),
    and I’ve tried to counter this trend in my blog with facts and benchmarks (at
    my best, anyway).\n\nFor a long time it seemed like our community’s allergy to
    evidence was driven by the [desire for greater DX](https://infrequently.org/2018/09/the-developer-experience-bait-and-switch/).
    In other words, devs just liked the way it _felt_ to type JSX in React, and the
    arguments promoting React or related tools (“the virtual DOM is fast!”) were largely
    post-hoc rationalizations to justify those initial gut feelings. ([Jonathan Haidt](https://en.wikipedia.org/wiki/The_Righteous_Mind#Key_concepts_and_scholars_discussed)
    would likely agree with this assessment.)\n\nBut in the agentic era, when developers
    are no longer typing code by hand and are thus less constrained by DX, I still
    see vibes ruling the day (and not just in the sense of “vibe-coding”). Frontends
    are rewritten because some framework or another is “better for agents.” (Did anyone
    think to ask the agents?) The resulting code is “faster,” the agents make “fewer
    mistakes,” etc. Once again, these claims are often made without evidence. Whenever
    I read one of these accounts, I think to myself, “Where are the benchmarks?”\n\nWell
    I got curious, so I wrote a benchmark. The structure of this benchmark is pretty
    straightforward:\n\n- Design a small but non-trivial Pokémon app using the [PokéAPI](https://pokeapi.co/)
    (those who have followed [my](/tag/pokedroid/) [work](https://pocketjavascript.com/blog/2015/11/23/introducing-pokedex-org/)
    will be unsurprised)\n- Instruct agents to build the app with a particular JavaScript
    framework/meta-framework (e.g. Next.js, Nuxt, SvelteKit, etc.)\n- Test the output
    against a spec conformance suite (to avoid agent cheating)\n- Evaluate the results
    in terms of development time, tokens spent, lines of code, and performance and
    accessibility scores in [Lighthouse](https://developer.chrome.com/docs/lighthouse/)\n\nThe
    app is fairly simple: you’ve got a list of Pokémon with their types, moves, and
    data from various games. You can search, filter, etc.:\n\n![Screenshot of a Pokémon
    web app with various monsters listed, their types, etc.](/_astro/pokemon-app.DUO5bAVN_34jQQ.webp)\n\nI
    should start off with some caveats: this is not a perfect experiment. This app
    represents only one [holotype](https://jasonformat.com/application-holotypes/)
    – it’s a relatively content-based site with little interactivity, closer to a
    Wikipedia than a Figma, GMail, etc. That said, I had to choose _some_ app to build,
    and this one is at least easy to understand at a high level, and relatively straightforward
    to spec out and test.\n\nTo try to even the playing field, I had each framework/meta-framework
    use the official MCP or skills for that tool. I wanted to avoid accusations of
    “this framework is not well-represented in the training data, that’s why we built
    our MCP, we expect people to use it,” etc. I also didn’t over-specify the exact
    architecture to use (e.g. vs ), nor did I specify that the app should be as performant
    as possible. I simply gave the spec to Opus 5.5 with high effort and told it to
    use the latest version of the given framework. Each agent ran in a sandbox and
    without any knowledge that it would be tested in Lighthouse on performance and
    accessibility, although it was given the conformance test suite.\n\nNote I also
    didn’t mandate any CSS methodology, except to avoid using Tailwind, Bootstrap,
    or any other component framework, and to design based on a set of spec tokens
    to enforce some visual consistency. I didn’t want to make this test all about
    CSS, but instead about JS frameworks, CSR vs SSR, vs , etc. The resulting app
    is tested against a conformance suite based on the accessibility tree rather than
    the raw DOM to avoid mandating any particular HTML structure – one framework uses
    web components which rely on shadow DOM, so this was required.\n\nOne thing I
    learned from this experiment is that everything I’m measuring is very stochastic.
    LLMs are random-word generators, so sometimes you get a low dice-roll and an agent
    goes off on some weird tangent wasting a bunch of tokens, through no fault of
    the framework or its tools. Lighthouse itself can give inconsistent results as
    well: Largest Contentful Paint (LCP) may decide that one image is the “largest”
    element, then pick another one on the next run. It’s hard to have a perfectly
    fair experiment, but running multiple iterations did help, and I’ve tried to be
    honest about the variance.\n\nWith all that throat-clearing out of the way, let’s
    get to the results.\n\n## Results\n\nI’m going to break this down by multiple
    dimensions: cost to build, quality, and maintainability. For each framework/meta-framework,
    I took the median of 5 runs: in other words, I built the same app 5 times in the
    same framework. (Yes, this is the kind of zany thing you can do with coding agents
    these days.)\n\nThe exception was Angular, which failed to create a working app
    twice, so I took 3 iterations instead. (This is explained below.)\n\n### Cost\n\nNote
    that this quotes the API prices directly from Claude Code and doesn’t actually
    represent how much money I spent. I’m on a Max plan, so this was just part of
    my overall $100/month.\n\nNote also the variance: React Router’s median is roughly
    $1 worse than that of Hono+htmx, but the cheapest version of React Router ($2.82)
    is still cheaper than the most expensive version of Hono+htmx ($3.19). However
    some reliable patterns do emerge.\n\nMost clearly, SvelteKit, Gracile+Lit, and
    Angular are more expensive to build than the other frameworks. For SvelteKit,
    this may be due to the fact that the agents read the [SvelteKit v3 migration guide](https://svelte.dev/docs/kit/migrating-to-sveltekit-3)
    in every run, likely because it’s [too new](https://svelte.dev/blog/sveltekit-3-is-here)
    to be in Opus 5.5’s training data. Similarly for Gracile, the agents didn’t know
    the framework very well and either cloned the Gracile repo or read its compiled
    source from `node_modules`. For Angular it seems to be a function of the total
    code size (see below).\n\nI should also mention that not every agent made use
    of an MCP/skill/Claude Code plugin, nor did every framework have one:\n\nClick
    to see AI tool usage\n\n| Framework | Installed | Used by the agents? |\n| ---
    | --- | --- |\n| Angular | [Angular MCP](https://angular.dev/ai/mcp) and [Angular
    agent skills](https://angular.dev/ai/agent-skills) | MCP in 3/5 runs, skill tool
    in 4/5 runs, skill files in 2/5 |\n| Astro | [Astro MCP server](https://docs.astro.build/en/guides/build-with-ai/)
    | MCP in 2/5 runs |\n| Gracile+Lit | N/A | N/A |\n| Hono+htmx | [Hono skills](https://hono.dev/docs/agents)
    | Skill tool in 5/5 runs |\n| Next.js | [next-devtools-mcp and next-dev-loop skill](https://nextjs.org/docs/app/guides/ai-agents)
    | Skill files in 1/5 runs, `AGENTS.md` in 2/5 runs |\n| Nuxt | [Nuxt MCP](https://nuxt.com/docs/4.x/guide/ai)
    | N/A |\n| Qwik | N/A | N/A |\n| React Router | [React Router skill](https://github.com/remix-run/react-router/tree/main/.agents/skills/react-router)
    | Skill tool in 5/5 runs, skill files in 5/5 runs |\n| SolidStart | N/A | N/A
    |\n| SvelteKit | [Svelte Claude Code plugin](https://svelte.dev/docs/ai/claude-plugin)
    | MCP in 5/5 runs |\n| TanStack Start | N/A | Skill files in 2/5 runs |\n| Vanilla
    | N/A | N/A |\n\nFor example, TanStack Start’s agent only discovered its skill
    files in 2/5 runs (they’re shipped in the `node_modules` of the project). For
    Nuxt, "
