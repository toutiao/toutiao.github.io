  author: austin-cheney
  text: The are some very real costs to JavaScript frameworks. These frameworks do
    not exist to empower developers. They exist to:<p>* so that employers do not have
    to invest in training developers.<p>* to ease candidate selection at hiring, which
    greases the wheels of hiring&#x2F;firing<p>In the big corporate world, especially
    at non-software companies, there is a culture that strongly believes internally
    written software sucks. This is <i>Invented Here</i> syndrome, and it reflects
    that internal developers cannot write software and employers will not invest in
    maintenance.<p>The larger costs there are human costs, the inability to efficiently
    solve any problem outside the constraints imposed by the framework.
