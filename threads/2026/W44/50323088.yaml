  author: torginus
  text: It&#x27;s astonishing to me that even after a decade of SPA frameworks, most
    authors don&#x27;t understand how a browser engine like Chrome works. There&#x27;s
    enormous cost of manipulating the DOM from JS, as HTML elements get bound to JS
    objects lazily.<p>An actual high performance framework should manipulate HTML
    as a string directly, or through HTML templates (another feature that has existed
    in most browsers for a decade).<p>If you&#x27;re not building a complex application
    on top of the web stack (interestingly these increasingly use WASM and their own
    GUI frameworks, so another moot point), but building an interactive consumption
    website (scrollable lists of static contents), I&#x27;d say instead of fronted
    frameworks, what most people actually would need is Chrome&#x27;s experimental
    declarative partial updates:<p><a href="https:&#x2F;&#x2F;developer.chrome.com&#x2F;docs&#x2F;web-platform&#x2F;declarative-partial-updates"
    rel="nofollow">https:&#x2F;&#x2F;developer.chrome.com&#x2F;docs&#x2F;web-platform&#x2F;declarative-p...</a><p>Which
    basically stream HTML fragments from the web.
