  author: rramadass
  text: 'Mandatory Background:<p>1) <i>Understanding Formal Methods</i> by Jean-Francois
    Monin - This is the absolute best for getting a grip on the breadth, concepts
    and sample tools for Formal Mathematics&#x2F;Specification&#x2F;Verification.
    Fire-hose of information (not a step-by-step textbook) so use this as a map for
    everything &quot;Formal&quot;. The S&#x2F;N ratio is very high (~250 pages only!)
    so use AI&#x2F;Textbooks to help explain concepts you find difficult to understand.<p>Practical:<p>1)
    <i>Software Abstractions: Logic, Language, and Analysis</i> by Daniel Jackson
    - Uses &quot;Alloy&quot; language to teach Structural (i.e. Data) Modeling.<p>2)
    <i>Specifying Systems: The TLA+ Language and Tools for Hardware and Software Engineers</i>
    by Leslie Lamport - Uses &quot;TLA+&quot; language to teach Behavioural (i.e.
    State Machine) modeling.<p>The above two are for &quot;System Modeling&quot; i.e.
    everything needed to formally build complete systems.<p>3) Finally, You should
    also look at the bunch of free books on the Lean4 website which can be studied
    parallely for &quot;code-level&quot; proofs and verification.<p>PS: There are
    a few more (eg. Event-B method etc.) but you can get to those if&#x2F;when you
    need to.'
