    Transcript\n\nBelow is a polished and edited transcript.\n\nBen Lorica. All right.
    So today we have a treat. We have Leo de Moura, VP and Distinguished Scientist
    in the Automated Reasoning Group at AWS. More importantly, he is the creator of
    Lean, which can be found at lean-lang.org. Lean is both a programming language
    and a theorem prover, and he is also the Chief Architect of the Lean Focused Research
    Organization. So, with that long-winded introduction, Leo, welcome to the podcast.\n\nLeo
    de Moura. Thank you, thank you. Very excited to be here.\n\nBen Lorica. All right.
    So, I guess the overarching thesis of this conversation is that we’re in an era
    where generation has become easy. Not necessarily cheap, as people who use Claude
    Code will attest, but easy. And so, one of the key challenges is verification.
    Lean is normally associated as the go-to tool. In fact, I think it’s going to
    be a tool that will increasingly be on the lips of many people in AI in the next
    year, around the topic of formal verification. So I guess let’s start here, Leo.
    Just the basics: for a listener who’s accustomed to code reviews, QA, and testing,
    what does formal verification mean?\n\nLeo de Moura. Yeah, Lean is both a programming
    language and a proof assistant, right? You can write code, but also state properties
    the code should have. You can state open conjectures in math, and you can provide
    proofs of these claims, right? But the proof is not informal. The proof is written
    in the Lean language, and more importantly, it’s machine-checked.\n\nLean is a
    big piece of code, but to trust a result proved with Lean, you need to trust only
    the kernel, right? That’s where the proof is being checked. Like any other programming
    language, you have all the tooling: LSP server, IntelliSense, code generators,
    autocompletion. All these features are available in Lean, but they’re not important
    for the proof-checking step.\n\nAnd we have more than one checker. In Lean, you
    can view proofs as data that can be manipulated, that can be transformed. You
    can export your proofs and check them with different checkers. Some of these checkers
    are verified now. We have two verified checkers. A third is coming soon.\n\nBut
    this ability to have machine-checkable proofs helps address a trust bottleneck,
    not just a trust bottleneck between humans, but also between humans and AI.\n\nFor
    example, suppose you want to synthesize a piece of code. You want to implement
