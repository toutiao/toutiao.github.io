  author: wbeckler
  text: |-
    I think the royal combo is Lean 4&#x2F;TLA+&#x2F;etc. plus AI plus a deterministic generator. For large systems formal method assertions need to be compressed down to a human comprehensible size. This can happen when the assertions are confirming the accuracy of a model and its attached code generators. The generator can generate proofs of the generated code and a human only needs to ensure that the generator provably generates the correct mass scale assertions.<p>This is how formal methods can constrain AI for large systems.<p>We&#x27;re doing this at the Open Markets Initiative, where we&#x27;ve generated millions of lines of Lean 4, TLA+, and Rocq that ensure that our open source electronic trading protocol code is accurate. We didn&#x27;t expect it but the Lean prover did identify some incorrect steps.
    <a href="https:&#x2F;&#x2F;github.com&#x2F;Open-Markets-Initiative" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;Open-Markets-Initiative</a>
