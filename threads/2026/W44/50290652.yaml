  content: "### Leo de Moura on Formal Proofs, AI Agents, and the End of “Trust Me”
    Code.\n\nSubscribe: Apple • Spotify • Overcast • Pocket Casts • YouTube •  AntennaPod
    • Podcast Addict • Amazon •  RSS.\n\nBen Lorica speaks with Leo de Moura, creator
    of Lean, VP and Distinguished Scientist at AWS, and Chief Architect of the Lean
    Focused Research Organization, about how AI is making formal verification more
    accessible and potentially transforming software engineering. They discuss the
    growing importance of specifications and machine-checked proofs, what it means
    to trust AI-generated code and autonomous agents, and the vision of a verified
    software stack. The conversation also explores how AI and formal verification
    are reshaping mathematics, what this means for the skills and careers of engineers
    and researchers, and where similar breakthroughs might emerge next.\n\nInterview
    highlights – key sections from the video version:\n\n- Introduction to Leo de
