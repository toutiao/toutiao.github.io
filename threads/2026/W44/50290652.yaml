  text: While learning and applying formal verification in the context of using AI
    agents, what I feel is that sometimes it&#x27;s hard to express my own thoughts
    as formal verification. But more than that, I doubt whether formal verification
    being done correctly actually solves the phenomenon of AI spinning in circles
    on a specific task.<p>For example, I want to eat chicken, so I try formally verifying
    &quot;chicken dish,&quot; and every time GPT or Claude starts digging into the
    origin of the sauce in the chicken dish or the breed of the chicken. Then the
    chicken dish never gets finished and never makes it to dinner, and instead I gain
    deep knowledge about the origin of chickens.<p>Of course, I know that formal verification
    has liveness — meaning that there must be progress in the work is also part of
    formal verification — but the AI judges that learning the origin of the chicken
    counts as progress too. Yet it ends up doing work that it actually shouldn&#x27;t
    be doing.<p>Personally, while organizing these AI anti-patterns, I feel that when
    you formally verify one condition, verification of another condition gets weakened,
    and within that phenomenon I sense the AI spinning in circles again. In the end,
    I end up going through the process of reading and merging everything one by one
    myself, and I want to know whether this is something only I experience.
