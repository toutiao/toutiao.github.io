  text: 'Star Trek still does this, as someone mentioned about Strange New Worlds.
    Discovery has perspectives about authority and insubordination, about collapse
    of civilization depending on a single resource (dilithium), and what happens when
    a principled organization (the Federation) abandons its principles and is only
    worried about protecting the organization itself.<p>Starfleet Academy has explorations
    of what humanity is from Klingon&#x2F;robotic perspective (very much borrowed
    from Worf and Data). It asks the painful question of what when the &quot;good
    guys&quot; are actually the &quot;bad guys&quot; and you end up a stray orphan
    because your parents are imprisoned for trying to feed you? What then, of improving
    the Institutions and becoming a better citizen?<p>Lower Decks also has a ton of
    lighter-toned ethical&#x2F;moral explorations and young adults learning to become
