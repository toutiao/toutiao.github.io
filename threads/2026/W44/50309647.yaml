  author: mike_hearn
  text: That hasn&#x27;t changed. Rare is the writer who can just write a good story
    and not try to socially engineer the audience.<p>The problem with TNG wasn&#x27;t
    so much the preachiness, which is still normal for TV. It&#x27;s that the moral
    system behind it was actually quite poor. Picard&#x27;s character was certainly
    not the paragon this thread is making him out to be - the more you look at Star
    Trek the worse it morally gets. It&#x27;s one of those shows that works best when
    you don&#x27;t think about the worldbuilding too much. And the Picard character
    only seems moral and superior on the surface because of the way Stewart acted
    him, and because his character is so unemotional, not because of what he actually
    does.<p>Consider the moral lessons of TNG and Picard.<p>Picard isn&#x27;t married,
    has no family or children, and apparently no desire to change that. He&#x27;s
    actually distinctly uncomfortable around children. Instead he married his job,
    which is all consuming. Right there that renders the character boring, overly
    intense and unrelatable for many people. When he gets assimilated by the Borg
    there&#x27;s no emotional impact because it&#x27;s not clear who cares about Picard
    being turned into an alien except his staff, whose only concern is professional
    duty. In fact when Riker decides to attack the cube with Picard still on board,
    he barely hesitates, and why would he? Picard keeps everyone around him at great
    emotional distance at all times. When the writers want to show Picard having an
    emotional breakdown about his traumatic experience, they have to show him running
    home to a brother he hardly ever sees or talks to, because that&#x27;s the only
    character the writers have who might care about Picard as a person. Sad.<p>Picard
    is supposedly a culture maven, but neither him nor his crew ever creates any.
    They&#x27;re obsessed with replaying stories and music old even when the show
    was made like Moby Dick, Beethoven, Shakespeare, detective stories set in the
    1940s.<p>Although the Enterprise has many crappy jobs on it along with many scarce
    resources (e.g. holodeck time), crew are unpaid. Picard says everyone on the Enterprise
    is there because Starfleet is prestigious and he seems fine with that idea. This
    arrangement could never work in reality so he comes across as delusional, and
    worse, we are left to assume there actually are mechanisms that incentivize or
    force people to beam down into severe danger, but Picard pretends they don&#x27;t
    exist.<p>By the 1980s Roddenberry was a Maoist and the Federation appears to be
    some sort of communist dictatorship. We&#x27;re told it&#x27;s abolished money
    and we don&#x27;t encounter operating businesses or conventional democratic politics.
    There is notionally some sort of elected leader in the Federation but they don&#x27;t
    seem to control anything and Starfleet does whatever it wants. For example, TNG
    doesn&#x27;t show Picard being given new orders because the elected government
    was changed, nor does Picard ever wonder how his actions might affect politics
    back home.<p>Picard holds the capitalist Ferengi in contempt and makes dumb diplomatic
    mistakes, like referring to &quot;civilized societies&quot; when talking to a
    Ferengi captain despite that the Ferengi fly around in advanced spaceships. This
    is because Picard views trade as dirty and beneath him.<p>Although he does occasionally
    disagree with Starfleet orders, he slavishly follows the Prime Directive even
    when the outcome would be absurd, like the entire civilization dying. He never
    even questions this rule despite the writers realizing that it leads to immoral
    outcomes! Starfleet is ambiguously presented as sometimes a sort of scientific
    research org and other times a military that in DS9 implements full blown martial
    law, suggesting the normal military&#x2F;civilian separation doesn&#x27;t exist.
    Picard never questions the structure of Starfleet or Federation society, which
    he seems to view as automatically superior (Sisko does a lot better in this regard).
  score: 0
