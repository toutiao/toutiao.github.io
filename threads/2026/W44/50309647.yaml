article:
  url: https://www.bostonglobe.com/2026/10/29/metro/patrick-stewart-picard-star-trek-the-next-generation/
  title: 'Remembering Patrick Stewart: What Captain Picard taught us'
  fetch_status: success
  content: |-
    Appreciation
    # Through Captain Jean-Luc Picard, Patrick Stewart taught us the measure of a man

    ![Patrick Stewart as Captain Jean-Luc Picard.](https://bostonglobe-prod.cdn.arcpublishing.com/resizer/v2/CGTKMVCJ3II6DM4QQY75UQKYRQ.jpg?auth=1665db2d602a73cebcb708de2cff81cdafb1dff34e84e5e1b3f511472b91079a&width=1440)
    _Patrick Stewart as Captain Jean-Luc Picard. GLOBE PHOTO/ELLIOTT MARKS_

    [Patrick Stewart](https://www.bostonglobe.com/2026/10/29/metro/patrick-stewart-dies/ "https://www.bostonglobe.com/2026/10/29/metro/patrick-stewart-dies/") died yesterday, and for people of a certain age, a little bit of the future left with him.

    For a certain, less-than-new generation of fans of Stewart’s 1990s television work on Star Trek: The Next Generation, there’s a sorrow that the man behind the larger-than-life Captain Jean-Luc Picard would be lost to a very real, very heartbreaking condition, Alzheimer’s and Lewy Body Dementia, according to his family.

    Stewart, of course, was far more than Picard. He anchored the X-Men film franchise and was for decades a dynamo on stage. But there are reasons Captain Picard, commander of the Starship Enterprise, is the character he’s best known for. Over The Next Generation’s seven seasons, four movies, and a revival show —Star Trek: Picard — that ended just three years ago, he portrayed a model of what mature, responsible adulthood could look like for a generation of boys who were bookish, imaginitive, and maybe a little nerdy.

    Two of the Globe’s dyed-in-the-wool Star Trek fans share what Captain Picard, and Patrick Stewart, meant to them.

    **John Hilliard:** For a younger, and likely wiser generation, stanning a bald middle-aged English actor who played a French guy on a spaceship may be a questionable life choice. But here is the thing: What made Stewart resonate as Picard was how he rooted the character, as in the best of fairy tales, in emotional truth.

    **Jason Laughlin:** I agree. Picard seemed as real as the complex characters that would start to populate prestige TV a decade later. But unlike anti-heroes such as Tony Soprano and Walter White, Stewart gave us a nuanced character we actually admired. He loved his job. He had passions like [archaeology](https://www.youtube.com/watch?v=SIRQF8PPvUU "https://www.youtube.com/watch?v=SIRQF8PPvUU"), [Shakespeare](https://www.youtube.com/watch?v=45VAelC_QsI "https://www.youtube.com/watch?v=45VAelC\_QsI"), and [music](https://www.reddit.com/r/startrek/comments/1vtdn25/picards_flute_duet/ "https://www.reddit.com/r/startrek/comments/1vtdn25/picards\_flute\_duet/"). He held to his ideals even when it meant terrible personal sacrifice.

    In the mess of American politics over the past 20 years, there have been so many times I’ve longed for a Picard-style speech that makes right and wrong crystal clear.

    “You know, there are some words I’ve known since I was a schoolboy,” Picard said when a Joe McCarthy-esque admiral began [witch hunting](https://www.youtube.com/watch?v=K5Po40kvI9c "https://www.youtube.com/watch?v=K5Po40kvI9c") on the Enterprise. “With the first link, the chain is forged. The first speech censured, the first thought forbidden, the first freedom denied, chains us all irrevocably.”

    His character’s moral clarity, and Stewart’s conviction in delivering it, put an end to the admiral’s reign of terror. If only real world oppression could be dispelled so easily.

    ![For decades, Patrick Stewart was a star of stage and screen, but no role defined him quite like the noble space captain Jean-Luc Picard of Star Trek: The Next Generation.](https://bostonglobe-prod.cdn.arcpublishing.com/resizer/v2/UXKNMXAXBJIE5D3MFLHNFNMH2A.jpg?auth=8e25b0bb943ca6a4cd164d64d7b170f5597bc20be64079dec693083c93dbebab&width=1440)
    _For decades, Patrick Stewart was a star of stage and screen, but no role defined him quite like the noble space captain Jean-Luc Picard of Star Trek: The Next Generation.STEVE FORREST/NYT_

    **JH:** [Full disclosure](https://www.youtube.com/watch?v=rpgYfB4lZAs "https://www.youtube.com/watch?v=rpgYfB4lZAs"): Star Trek is a show, which Youtube will prove, that leaned hard on latex foreheads and sometimes-flimsy production to tell stories of intergalactic scallywags known as Klingons and Borg, Romulans and Cardassians. Like free office coffee, it’s an acquired taste.

    **JL:** One of my friends has a theory that if you didn’t get into Star Trek before you’re 18 years old, you’re never really going to get it.

    To me, what’s so accessible, and radical, about Stewart, though, was his ability to convincingly portray vulnerability while still maintaining Picard as a credible leader.

    [One episode](https://www.youtube.com/watch?v=lpmw3BV2q9Y "https://www.youtube.com/watch?v=lpmw3BV2q9Y") saw Picard return to his home village in France to heal from a traumatic assault.

    At the conclusion, Stewart surrenders the control that was his character’s hallmark and falls into the mud, sobbing, over his failure to fight off his assailants. It’s a raw, real, depiction of a broken man. Stewart shifts from total collapse into slow recovery by reconciling with his brother. Grief is replaced by warmth, and Stewart sells it perfectly.

    **JH:** Totally. He knew how to make that show work for him.

    That’s despite an episode where he faces off against a [giant, talking tar pit](https://www.youtube.com/watch?v=1ulTgc4Wsjs "https://www.youtube.com/watch?v=1ulTgc4Wsjs"). Or the one [where he sells](https://www.youtube.com/watch?v=1bHQ42zmTt8 "https://www.youtube.com/watch?v=1bHQ42zmTt8") eating a sandwich in the sci-fi version of the family station wagon. Or when he chugs Ecto Cooler (remember Ecto Cooler?) with a [depressed Scotty](https://www.youtube.com/watch?v=9t6MZ7hvzcY "https://www.youtube.com/watch?v=9t6MZ7hvzcY"), from the original Star Trek, and shares stories about first jobs and first girlfriends. He even shows up in tights, as [discount Errol Flynn](https://www.youtube.com/watch?v=Sxo2ccLAMHk "https://www.youtube.com/watch?v=Sxo2ccLAMHk") Robin Hood.

    As a kid raised on television before there was an Internet, Stewart plugged into a world where figures like Mr. Rogers and Bob Ross presented a model for manhood that was gentle, patient, and a teacher. Stewart played Picard in a similar vein, basically everyone’s Space Dad.

    ![Even as recently as last month, Captain Jean-Luc Picard appeared on Star Trek Day in the London Underground.](https://bostonglobe-prod.cdn.arcpublishing.com/resizer/v2/SAGHVDOZSNCSBAQHC6N7NU3R7E.jpg?auth=5b340a245a2461cbbc608cc55e2b4cd171147c5c33629fe956008dca3006882b&width=1440)
    _Even as recently as last month, Captain Jean-Luc Picard appeared on Star Trek Day in the London Underground.Tim P. Whitby/Getty Images for Paramount+_

    **JL:** This is embarrassing, but the first TV episode that moved me to tears was from The Next Generation.

    “[The Inner Light](https://www.youtube.com/watch?v=C0dNcnYln0o "https://www.youtube.com/watch?v=C0dNcnYln0o")” has Picard experience an entire lifetime as a different person on an alien planet. Again, the actor found his character’s humanity through slow revelation that perhaps a life with a wife and children is just as big an adventure as exploring space.

    “Seize the time,” Picard says to his daughter in this other life. “Live now! Make now always the most precious time. Now will never come again.”

    At the end of the episode, it’s revealed the decades he spent in that other life were an illusion he experienced in less than an hour. The only tangible thing he has from that world is a flute he learned to play in that other life. In the final moments, Picard plays it again, and without saying a word Stewart plays absolute heartbreak.

    Seeing a strong, confident leader who was able to express regrets, sadness, and heartache left a lasting impression.

    ![Well into his 80s, Patrick Stewart was playing the character he became best known for.](https://bostonglobe-prod.cdn.arcpublishing.com/resizer/v2/WDAV6UWL377ESK4ZOYTZYXF7Y4.jpg?auth=6fd30f70ee75
