  text: 'Also Melinda M. Snodgrass wrote this episode.<p>I think just watching the
    scene makes it very very dull. I think watching the whole episode and of course
    even more adds a lot, because this is the culmination of many things and while
    in many situations the conclusion is the important bit I think here the context
    really matters. In this scene for example the role of the other side&#x27;s &quot;lawyer&quot;
    is extremely central also to the title of the episode, as well as the relationship
    between the judge and Picard. None of this is apparent without context.<p>It would
    be sad if all that was left of this are small memes that people don&#x27;t know
    the context of and I think for that scene in particular most viewers only find
    it great, because of all that led up to it.<p>It&#x27;s like how in movies often
    the end is quite an epic or emotional scene, but it feels kind of generic without
    context. Sometimes it&#x27;s sad that many shows or movies feel more like a series
    of such situations without buildup. For some shows it fits, but when you need&#x2F;want
    to describe characters and inter-character relationships and how they fit into
    a story summarizing it feels... almost dehumanizing.<p>Cliche characters are the
    worst and something that is really enjoyable about Star Trek is that the most
    serious characters are goofy at times, just like that coworker. People simple
    have something &quot;cringy&quot; and &quot;weird&quot; to them, even when it
    cannot always be seen.<p>I&#x27;d even go so far to say that leaving that out
    in a world where people love to present themselves to the whole world like selling
    a product the absence of such things or the very intentional display of kind of
    &quot;fake&quot; goofyness is a thing even worse than beauty unrealstic ideals.<p>Lot&#x27;s
    of words to say: Actually watch the show. Not with some episode guide, not with
