    ## 1. Projet de loi de finances pour 2027

    #### Première partie (suite)

    Mme la présidente

    - Partager l'intervention

    L’ordre du jour appelle la suite de la discussion de la première partie du projet de loi de finances pour 2027 (nos 3210, 3291 rectifié).Mercredi soir, l’Assemblée a poursuivi la discussion des articles du projet de loi, s’arrêtant à l’amendement no 1358 portant article additionnel après l’article 15, examiné par priorité.

    ##### Rappel au règlement

    Mme la présidente

    - Partager l'intervention

    Cela commence bien : la parole est à M. Mickaël Bouloux, pour un rappel au règlement.

    M. Mickaël Bouloux

    - Partager l'intervention

    Il ne faudrait pas que nous nous fassions un claquage de bon matin. (Sourires.) Je fonde mon intervention sur les articles 54, alinéa 4, 95 et 100 du règlement.Je prends acte de la décision de la conférence des présidents de limiter nos interventions à une minute. Toutefois, le règlement prévoit un temps de parole de deux minutes par amendement et vous permet, malgré la décision de la conférence, d’autoriser un dépassement dans l’intérêt du débat.L’amendement no 1358 de mon collègue Laurent Lhardit instaure une taxe sur les flux de données numériques. C’est un méca
