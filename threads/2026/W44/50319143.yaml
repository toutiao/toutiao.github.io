  author: dhx
  text: 'For more on why MPTCP is not relevant--my limited understanding is the issue
    is with SYN retransmits.<p>SYN packet #1 is received and added to a request queue
    for processing.<p>SYN packet #2 is received and is a retransmit of SYN packet
    #1. It is matched to SYN packet #1 already in the request queue and now there
    is shared state between both SYN packets #1 and #2 in the request queue.<p>CPU
    #1 takes on the task of processing SYN packet #1.<p>CPU #2 takes on the task of
    processing SYN packet #2.<p>CPU #1 responds back with RST packet #1 (e.g. requested
    TCP port is not open) and _should_ defer the destruction of the request socket
    for SYN packet #1, as other CPUs may still be processing the shared state for
    the request socket as is the case for retransmitted SYN packets.[1] However, this
    deferred destruction wasn&#x27;t occurring, and CPU #1 was _immediately_ destroying
    the request socket&#x2F;shared state for SYN packet #1.<p>CPU #2 races with CPU
    #1 and reads from the request socket&#x2F;shared state for SYN packet #1 after
    its _immediate_ destruction by CPU #1.<p>Linux&#x27;s IPv6 handling is unaffected
    because in this IPv6 scenario, there is no shared state between SYN packets #1
    and #2 in the request queue. Instead, each request socket has duplicate data.<p>Someone
    more knowledgeable can confirm&#x2F;correct me on the above please.<p>[1] <a href="https:&#x2F;&#x2F;www.kernel.org&#x2F;doc&#x2F;html&#x2F;latest&#x2F;RCU&#x2F;whatisRCU.html#rcu-overview"
    rel="nofollow">https:&#x2F;&#x2F;www.kernel.org&#x2F;doc&#x2F;html&#x2F;latest&#x2F;RCU&#x2F;whatisRCU.html#rc...</a>'
