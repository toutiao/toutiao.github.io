  author: wahern
  text: See <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Multipath_TCP"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Multipath_TCP</a><p>It&#x27;s
    an extension to TCP that, similar to QUIC, allows you to use multiple address&#x2F;port
    pairs to transmit data over a single logical stream. Both client&#x2F;initiator
    and server&#x2F;listener have to opt into the extension. This might need to be
    enabled explicitly by the application[1], which Go apparently does for you, or
    judging from other posts may be enabled by default systemwide, depending on your
    platform.<p>AFAIU, a major user of MPTCP is Apple and the iPhone, and the ubiquity
    of iPhone clients motivated implementation in and deployment on Linux servers.<p>[1]
    <a href="https:&#x2F;&#x2F;docs.kernel.org&#x2F;networking&#x2F;mptcp.html#sockets-api"
    rel="nofollow">https:&#x2F;&#x2F;docs.kernel.org&#x2F;networking&#x2F;mptcp.html#sockets-api</a>
  score: 0
