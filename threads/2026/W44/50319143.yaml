  author: jacquesm
  text: A listener is a piece of software that advertises itself as available to inbound
    connections. You can do this on a variety of protocols.<p>Multipath TCP is a neat
    trick that allows a single TCP connection (TCP = Transport Control Protocol, a
    stateless protocol for long running connections) to use multiple physical interfaces.
    You <i>could</i> do something similar before MTCP using bonding, but this was
    annoying to set up and usually required application level code to efficiently
    use the bonded connection. MTCP makes this much simpler from an application level
    point of view and it can use widely diverse underlying transport layers at the
    same time (for instance, WiFi, Cellular and wired connections).
  score: 0
