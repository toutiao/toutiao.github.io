  author: cowlevel
  text: Getting the right thing allocated in the right place to exploit a UAF is usually
    very very tricky. For a defender we just need to know it&#x27;s probably possible
    and therefore we patch the bug, but the attacker still has a difficult job to
    do even already knowing a UAF bug.<p>The simplest thing you could try to do is
    allocate several more of the same type of object and hope one of them lands at
    the same memory address. For example if you can UAF a web app&#x27;s user session
    and keep it open for a long time period (not true in the TCP bug), you might try
    to wait until an admin happens to log in with their session at the same address,
    then use their admin session.<p>Or you can allocate a lot of something else objects
    and hope a certain field overlaps, like a function pointer if you can write to
    it. Like suppose you can get some kind of authentication callback pointer to overlap
    where your packet sequence number was, maybe you can send a certain number of
    packets to make it point to the return instruction and skip the authentication.
