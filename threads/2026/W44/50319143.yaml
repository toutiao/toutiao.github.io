  author: ButlerianJihad
  text: '&gt; Transport Control Protocol, a stateless protocol<p>TCP is stateful by
    definition, and that is why it supports robust error correction and reliable streams
    of data. UDP is its stateless counterpart.<p>&gt; bonding, ... usually required
    application level code<p>No, it doesn&#x27;t. <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Link_aggregation"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Link_aggregation</a><p>&gt;
    underlying transport layers<p>TCP <i>is in the transport layer</i>! The layers
    which you name are lower, such as Layer 2 (Data Link)!<p>MTCP, being in the transport
    layer, is working at a higher level of abstraction than bonding or link aggregation.
    There is no need for application-layer support, but it is possible, and easier,
    with MTCP than with the Layer 2 solutions, because MTCP is in the transport layer.
    That is why Go was able to activate it, and the POC uses it, because MTCP controls
    can be exposed at that level.'
