  author: ButlerianJihad
  text: MPTCP is an extension that requires cooperation. So it is only supported if
    the network stacks of both peers and all middleboxes can support it. The Linux
    kernel docs describe it as &quot;opt-in&quot;, so it is not enabled by default
    for every socket opened on the system.<p>Again, the description of this CVE indicates
    that the vulnerability does not depend on MPTCP. But it is a factor in the proof-of-concept
    and its likelihood of success.<p>So if there was any widespread mutual support
    of MPTCP, it may shrink significantly as network admins deploy mitigations.
