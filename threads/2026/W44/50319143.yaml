  author: peanut-walrus
  text: Some notes I&#x27;ve got about this:<p>- MPTCP is not a requirement, it is
    a generic use-after-free.<p>- Exploitability over the internet is unlikely, most
    ISP routers drop packets with ipoptions fields.<p>- At least according to Red
    Hat, dropping packets with ipoptions yourself helps, but is not a full mitigation.<p>-
    Successful exploit requires multiple CPU cores to process packets, so systems
    with just a single core or packet processing pinned to a single core are not affected.
