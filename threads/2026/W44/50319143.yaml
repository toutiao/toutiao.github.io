  url: https://atlasum.net/blog/cve-2026-98432-linux-ipv4-tcp-uaf
  title: 'Linux''s October 2026 TCP Use-After-Free: CVE-2026-98432 — Atlas'
  fetch_status: success
  content: |-
    ## [#](#overview)Overview

    Linux's stable kernels shipped a fix on October 11 and 15, 2026 for [CVE-2026-98432](https://www.cve.org/CVERecord?id=CVE-2026-98432), a use-after-free in the IPv4 TCP handshake that a remote, unauthenticated peer can reach. The kernel's own CVE Numbering Authority (CNA) scores it CVSS 3.1 **9.8, Critical**. The fixed releases are **5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.56, 7.2.10** , and **7.3** , and the bug goes back to Linux 4.4. The upstream fix is a four-line change, but most servers run a distribution's kernel, and as of 8:00 PM CDT, October 29, Ubuntu's tracker still reads "Vulnerable" for its kernel on every release, and Red Hat lists RHEL 8, 9, and 10 as affected with no fix.

    **Why it's urgent:** the bug sits in code every Linux server runs when it accepts an IPv4 TCP connection, before any application sees the connection. Anthropic, whose researcher reported it, says its Claude model wrote a working proof-of-concept exploit that runs commands as root on "Linux servers with a multipath TCP listener," with no credentials. See the [timeline](#timeline-and-exploitation-status).

    ### [#](#key-facts)Key facts

    | Field | Detail |
    | --- | --- |
    | **CVE** | CVE-2026-98432, "ipv4: free inet\_opt and ireq\_opt after an RCU grace period," issued by the Linux kernel CNA |
    | **Severity** | Critical, CVSS 3.1 **9.8** (`AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`), the kernel CNA's score. Red Hat rates it Important with CVSS 3.1 8.1 (`AC:H`), SUSE rates it important, Ubuntu rates it High, and Oracle and Amazon rate it Important with CVSS 3.1 8.1. |
    | **Weakness** | Use-after-free of IPv4 option data during the TCP handshake (the record lists no CWE) |
    | **Impact** | Per the CNA's scoring notes: kernel heap contents disclosed to the remote peer, kernel memory corruption, or a crash. Red Hat: "primarily results in a system crash leading to a Denial of Service (DoS) or potential memory corruption." |
    | **Fixed in** | 7.2.10 and 6.18.56 (Oct 11) · 6.12.113, 6.6.159, 6.1.190, 5.15.223, and 5.10.272 (Oct 15) · 7.3 (Oct 18) |
    | **No fix yet** | Ubuntu (every release), RHEL 8, 9, and 10, Amazon Linux 2, and Amazon Linux 2023's default kernel, as of 8:00 PM CDT, October 29. Upstream branches that reached end-of-life before 5.10 get no fix. |
    | **Proof of concept** | Anthropic says Claude built a remote root exploit for servers with a multipath TCP listener. It hasn't published the exploit. |
    | **CVE records** | Published on [cve.org](https://www.cve.org/CVERecord?id=CVE-2026-98432) on October 15. [NVD](https://nvd.nist.gov/vuln/detail/CVE-2026-98432) lists it as "Received," with no analysis of its own, as of 8:00 PM CDT, October 29. |
    | **Credit** | Reported by Xinyang Ge of Anthropic. Fixed by Eric Dumazet and reviewed by Kuniyuki Iwashima, per the fix commit. |

    ## [#](#who-is-affected)Who is affected

    Any Linux kernel from 4.4 on that lacks the fix, whether it serves the network directly or hosts containers: a container runs on the host's kernel, so a new image doesn't change anything. IPv6 connections aren't affected by the main issue; the commit says "IPv6 is not affected by the first issue."

    | Release line | Status on Oct 29, 2026 | Fixed in | Released |
    | --- | --- | --- | --- |
    | 7.3 | Mainline | **7.3** (from 7.3-rc7) | Oct 18, 2026 |
    | 7.2 | Stable | **7.2.10** | Oct 11, 2026 |
    | 6.18 | Longterm | **6.18.56** | Oct 11, 2026 |
    | 6.12 | Longterm | **6.12.113** | Oct 15, 2026 |
    | 6.6 | Longterm | **6.6.159** | Oct 15, 2026 |
    | 6.1 | Longterm | **6.1.190** | Oct 15, 2026 |
    | 5.15 | Longterm | **5.15.223** | Oct 15, 2026 |
    | 5.10 | Longterm | **5.10.272** | Oct 15, 2026 |
    | 4.4 – 5.4 | End-of-life upstream | distro fixes only | — |

    ### [#](#distribution-status)Distribution status

    Distribution kernels carry backported fixes under their own version numbers, so check the tracker, not the upstream number. As of 8:00 PM CDT, October 29:

    - **Ubuntu:** the [tracker](https://ubuntu.com/security/CVE-2026-98432) lists the `linux` package as "Vulnerable" on every release. On 26.10, 26.04, 24.04, and 22.04 it adds "work in progress" in `7.3.0-10.10`, `7.0.0-43.43`, `6.8.0-149.149`, and `5.15.0-203.213`; 20.04, 18.04, and 16.04 show only "Vulnerable." Many cloud and hardware-enablement kernels are listed the same way, and no Ubuntu Security Notice has been published.
    - **Red Hat:** RHEL 8, 9, and 10 and OpenShift Container Platform 4 are listed as affected, with no fix; RHEL 6 and 7 aren't affected ([CVE page](https://access.redhat.com/security/cve/CVE-2026-98432)). Red Hat says mitigation "is either not available or the currently available options do not meet the Red Hat Product Security criteria."
    - **Debian:** fixed in 12 "bookworm" (`6.1.190-1`, DLA-4841-1, and `linux-6.12` `6.12.113-1~deb12u1`, DLA-4850-1), 13 "trixie" (`6.12.113-1`, DSA-6568-1), and unstable ([tracker](https://security-tracker.debian.org/tracker/CVE-2026-98432)).
    - **SUSE:** rated important. SUSE Linux Enterprise Server 16.0 (`kernel-default` `6.12.0-160000.40.1`) and the 15 SP4, SP5, and SP6 LTSS kernels are fixed; 15 SP7 is in progress, and openSUSE Leap 15.6 and 16.0 are listed as affected ([CVE page](https://www.suse.com/security/cve/CVE-2026-98432/)).
    - **Oracle Linux:** rated Important, CVSS 3.1 8.1. Unbreakable Enterprise Kernel (UEK) errata for Oracle Linux 7, 8, 9, and 10 came out October 16: ELSA-2026-500397, ELSA-2026-500398, and ELSA-2026-500399 ([CVE page](https://linux.oracle.com/cve/CVE-2026-98432.html)). The page lists only the UEK kernels.
    - **Amazon Linux:** rated Important, CVSS 3.1 8.1. On Amazon Linux 2023, `kernel6.18` is fixed (ALAS2023-2026-3251, October 24) and `kernel6.12` is fixed (ALAS2023-2026-3335, October 29). The default `kernel` package and every Amazon Linux 2 kernel are "Pending Fix" ([CVE page](https://explore.alas.aws.amazon.com/CVE-2026-98432.html)).

    ## [#](#how-the-vulnerability-works)How the vulnerability works

    When a Linux server accepts a TCP connection, the kernel tracks the half-open handshake in a lightweight "request socket," then creates a full socket once the handshake completes. If the connecting peer's IPv4 header carried options, the kernel keeps them to echo in its replies. The bug: the kernel handed those saved options from the request socket to the new connection without copying them, then freed them immediately when the connection went away, while another CPU could still be reading them to build a handshake reply. Reading freed kernel memory is a use-after-free.

    The peer needs no login, and it all happens inside the kernel's handshake handling, before any application code runs. The CNA's scoring notes say the stale data can leak kernel heap memory back to the peer, steer kernel writes out of bounds, or crash the machine. Anthropic says a lost race "only fails the handshake without crashing the whole system, so a determined attacker can retry indefinitely until they succeed."

    ### [#](#the-fix)The fix

    Eric Dumazet's commit, "ipv4: free inet\_opt and ireq\_opt after an RCU grace period," changes two plain `kfree()` calls to `kfree_rcu()`, which waits until every reader has finished with the memory before freeing it. Other code paths that replace these options already did that. The commit also fixes the same problem in request-socket migration (`net.ipv4.tcp_migrate_req=1`, or a `BPF_SK_REUSEPORT_SELECT_OR_MIGRATE` program), and says a related IPv6 case "will be addressed in a separate patch."

    _ipv4: free inet_opt and ireq_opt after an RCU grace period
    torvalds/linux · e3f33b0 · Oct 1, 2026_

