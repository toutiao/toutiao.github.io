  author: loeg
  text: 'The Redox article is underselling it somewhat. Part of the problem is Linux&#x27;s
    historical syscall restriction systems (seccomp) did not (does not?) apply to
    io_uring, so io_uring is (was?) all or nothing on async versions of syscalls it
    implements.  Also, io_uring is rapidly adding API surface compared to other parts
    of the kernel.  With these factors combined, it has had repeated security problems
    since 2019 and has lead to, e.g., Android disabling io_uring entirely for applications.<p><a
    href="https:&#x2F;&#x2F;security.googleblog.com&#x2F;2023&#x2F;06&#x2F;learnings-from-kctf-vrps-42-linux.html"
    rel="nofollow">https:&#x2F;&#x2F;security.googleblog.com&#x2F;2023&#x2F;06&#x2F;learnings-from-kctf-...</a><p>&gt;
    in the past year, there has been a clear trend: 60% of the submissions exploited
    the io_uring component of the Linux kernel (we paid out around 1 million USD for
    io_uring alone). Furthermore, io_uring vulnerabilities were used in all the submissions
    which bypassed our mitigations.'
