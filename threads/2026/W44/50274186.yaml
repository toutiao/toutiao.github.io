  author: jauntywundrkind
  text: |-
    &gt; <i>Guess what will happen.</i><p>Throughput for storage networking and GPUs will continue gaining yet more orders of magnitude and radically increased efficiency?<p>I look at this and cheer.
    <a href="https:&#x2F;&#x2F;www.phoronix.com&#x2F;news&#x2F;DMA-BUF-IO-uring-Linux-7.4" rel="nofollow">https:&#x2F;&#x2F;www.phoronix.com&#x2F;news&#x2F;DMA-BUF-IO-uring-Linux-7.4</a><p>I get some hesitancy but do folks really think this Fear Uncertainty and Doubt, that being conservative is going to pay off in the long run?<p>The wins on the book for io-uring are incredible. Massive. It looks like a miracle. It&#x27;s completely changed what a box can do. Orders of magnitude more. With vastly less cpu.<p>Has it had problems? Sure yes, it did. Is it still perfect? Probably not.<p>For cloud providers running arbitrary user code in containers yeah maybe the fear of the unknown makes sense. That the risk of some undisclosed vulnerability is going to get exploited against you and your customers. But most people aren&#x27;t running arbitrary code on their systems. And most people are not going to be the target when there is a high profile vulnerability. We have, from what I can tell, no evidence any of these vulnerabilities from the past have ever had consequences. They&#x27;re not good! But people really are batting so hard to declare an L, wind themselves and others up so hard to justify outrage. I find it ridiculous. Preposterous.<p>The wins are already a landslide. Issues get tackled. The rate and severity of issues has tapered to a trickle. The design fundamentally makes sense as a consumer, a programmer using it. The hardware obviously <i>loves</i> it. Io-uring is going to keep winning, keep cleaning house.<p>And what is going to happen to the dissenters standing outside year after year waving these protest banners? I can&#x27;t help but think that their fate is to look ever more ridiculous. That over time the io-uring protest looks ever more an out of touch farce, completely disconnected from the silent majority&#x27;s very happy better place, that 30x&#x27;s performance and that makes sense to us all and that has never personally hurt a one of us in any way.<p>KSMBd has the same fate (albeit radically less upside), the same endless fearmongering attack hounds who will probably never ever stop yelling about it either. For what? It&#x27;s so unclear. Because sometimes new things do take time to settle some. Because it&#x27;s fun to yell at things, to steal the attention of the room, to feel better than the crowd. History never dies, grudges and people&#x27;s bad impressions of things never get updated, negative experiences and feelings have such potency to sear they ways into our souls, to mark us forever. We are thrown off our poles and forever tilted against things, lost entirely to possibility of reevaluation, reconsideration, reflection on what the new contemporary is. <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Planck%27s_principle" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Planck%27s_principle</a><p>We can and should be excited for no longer needing to cross the syscall barrier as incessantly. We can and should be excited for the radical efficiency. We can and should be excited for mechanistic sympathy, for these circular buffers that work very well on the hardware. Generally we should, for our soul&#x27;s sake, work to behold a possibility of success. To allow room even in darkness for maybe perhaps possibly some light and grace and success some day. I am <i>definitely</i> interested in hearing tales of what else could be, other than io-uring. I know and use iouring and it makes sense to me. It works great, from what I can see. But if there&#x27;s other ideas out there for how else we get to winning, I want to know! To engage in imagining the <i>yes perhaps</i>. Unvetted but here&#x27;s Asterinas. <a href="https:&#x2F;&#x2F;github.com&#x2F;asterinas&#x2F;asterinas" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;asterinas&#x2F;asterinas</a>
