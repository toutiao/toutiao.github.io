  author: rvz
  text: This is great work by the Redox team. This might be over the heads of many
    HNers who are undergoing skill atrophy in real time and addicted to agents, given
    that 4 hours and less than 10 comments on a highly technical blog post about Rust
    and asynchronous I&#x2F;O in Redox.<p>This project is vehemently against AI usage
    of any kind, so I can trust that the contents of this post has been checked and
    written by someone who has read the code and knows what they are doing.<p>&gt;
    The Linux io_uring interface allows the user to submit one or more I&#x2F;O operations
    to the kernel, which are then processed in an asynchronous fashion without blocking
    the userspace process. Redox, being a microkernel, handles I&#x2F;O in userspace
    scheme processes rather than in the kernel.<p>io_uring is incredibly fast for
    async I&#x2F;O but is also a massive security disaster in the Linux kernel. As
    long as Redox is able to show a secure interface for async I&#x2F;O the better.
    Likely part of their long term goals for the OS.<p>&gt; While it has substantially
    improved over the years, IPC is still quite slow on Redox, and this is important
    to optimize as ring buffers can only offset this overhead to a certain extent.
    This has been a focus of our work to improve system performance.<p>I quite like
    this targeted and thoughtful approach for a wholistic improvement starting with
    ring buffers in redox. They need to compare the async executor benchmark results
    with Linux and continue from there for improvements.<p>&gt; The optimization made
    here is that the kernel zeroes the vector registers if the caller and callee entered
    the kernel through syscalls, rather than saving&#x2F;restoring (using vzeroall,
    ldmxcsr etc. as required for correctness).<p>Interesting approach for complete
    correctness over performance in this area and this tells me that they are not
    taking going to risk on overlying on rust&#x27;s &quot;guarantees&quot; to help
    them prevent races or data reuse after free bugs in the Redox kernel.<p>One of
    the most technically sound and researched posts I&#x27;ve read, but unfortunately
    it has been buried under low effort slop posts on HN.
