  author: pigpop
  text: "&gt; Medieval people used to own more property (though not technologically
    equivalent of course) and &quot;owned&quot; more of their time than the average
    person today.<p>That&#x27;s a pretty serious misconception unless by &quot;medieval
    people&quot; you mean the nobility. Common peasants had some hereditary title
    to the land they worked but the land itself was owned by the lord and the king.
    They were more like hereditary tenants but much worse off contractually than our
    modern interpretation of a tenant would suggest since they (and their progeny)
    were often obligated to remain on their land and work it without the option to
    go elsewhere. They paid their rent in labor and produce or sometimes money if
    they had any. They had parcels of land that are large by modern standards because
    they were farmers and they had to sustain themselves on what they grew on their
    land as well as give a portion of what they produced to the lord that actually
    owned the land.<p>They may have &quot;owned&quot; more of their time in that they
    weren&#x27;t employed in the modern sense but they still had to put in as much
    work as it would take to feed themselves and pay their rent. They absolutely had
    to perform the work their lord demanded of them which might include additional
    agricultural labor on other plots of land or threshing grain.<p>It really wasn&#x27;t
    a better system. Agricultural labor is gruelling without modern equipment. It&#x27;s
    even worse when your life depends on it. Not being allowed to choose where to
    live or choose your occupation and having that apply to your children and your
    children&#x27;s children is worse.<p>Imagine if you were permanently contracted
    with your landlord. You could never move to another apartment and your children
    were obligated to live in the same apartment. On top of that you had to do the
    maintenance work for the building whenever the landlord asked you to and you still
    had to pay him rent on top of that. You&#x27;d still be slightly better off than
    a peasant because you wouldn&#x27;t have to be a subsistence farmer."
