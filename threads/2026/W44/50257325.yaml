    come from deskilling the job. Deskilling the job makes the employees time less
    valuable, because they can be substituted for another more easily.<p>[edit: it&#x27;s
    important to mention that this is compatible with programmer ego trips. I consider
    myself a reasonably good programmer and I&#x27;ve been doing it for a long time,
    but AI has made me far more eligible for jobs in languages that I have never used
    on platforms that I have never worked with.]<p>But another factor is that just
    because you can do work faster doesn&#x27;t mean there&#x27;s more work to do,
    so if you were hitting all your deadlines before with two employees, now you can
    fire one. Which one that will be is the result of a reverse wage auction."
