  author: bunderbunder
  text: They aren’t paying more for productivity because they themselves aren’t earning
    more for productivity. The elephant in the room is that customers don’t have any
    more money to spend. Certainly not in this economy.<p>In manufacturing, an oversupply
    of finished product quickly leads to overfull warehouses, and the company knows
    to slow down production until product moves.<p>In software it’s less visible.
    Features that nobody is buying don’t physically pile up in the shipping department.
    Decades of accounting for all programmer time as productivity has left managers
    with limited ability to recognize time spent building unnecessary bloat as a loss.
    Maintenance burden isn’t fully recognized as a loss, either. We tend to assume
    it’s roughly equivalent to profit, the same as all other code the programmers
    churn out.<p>And what you are seeing now is that it was always a myth. Not everything
    you do at work is profitable or productive, and AI is causing that fraction to
    decrease. So of course they aren’t going to pay you more for it.
