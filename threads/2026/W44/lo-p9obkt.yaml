    I switched to Gram when the 1.0 came out and it's such a nice project. I enjoy the editor a lot (especially compared to my neovim setup at the time which was succumbing more and more to entropy), and contributing to it has since become a bit of a hobby project. I really enjoy its focus on code quality and reducing complexity rather than constantly pushing for more and more features.
    For this release, I landed a change which just gives you a command to download and install the server binary via ssh if you're trying to do remote editing against a host without a server in the right place, and I rewrote the protocol to use postcard instead of protobuf (for significant complexity and compile time wins). Compared to mega projects like VS Code and Zed, it feels like my contributions actually matter since it's a small team; and my work enriches the community rather than some company.
    It's empowering for your tools to be small projects which you can take part in moulding. And it helps that the community is nice.
