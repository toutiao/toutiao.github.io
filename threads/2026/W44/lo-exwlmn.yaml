  text: "I'm glad my comment was sufficient provocation. You should finish the article.
    :)\n\nThere’s an obvious simplification using labelled break without value (and
    Knuth didn’t even compare multilevel break with his weirder alternatives):\n\nI
    sent a similar example (a multi-level exit but no labeled break needed because
    break is relative relative to loops and switches, not other blocks) to Xavier
    Leroy 10 months ago as feedback for the draft of his excellent Control structures
    in programming languages. Here's what it said in the book:\nAnother attempt uses
    a while loop with a (structured) early\r\nexit via a break statement:\r\n\r\nvoid
    add(key k, data d)\r\n{\r\n   int i = hash(k);\r\n   while (1) {\r\n       if
    (A[i] == 0) { A[i] = k; B[i] = d; break; }\r\n       if (A[i] == k) { B[i] = d;
    break; }\r\n       i = i + 1; if (i >= N) i = 0;\r\n   }\r\n}\r\n\r\nWhat ends
    up being duplicated here is the storing\r\nof the data ⁠B⁠[⁠i⁠] = d, which occurs
    in both the notfound\r\nand the found branches. This does not significantly\r\naffect
    readability nor performance, however.\n\nAnd here was my comment:\nThere should
    be no need to duplicate the assignment:\r\n\r\nvoid add(key k, data d)\r\n{\r\n
    \  int i = hash(k);\r\n   while (1) {\r\n       if (A[i] == 0) { A[i] = k; break;
    }\r\n       if (A[i] == k) { break; }\r\n       i = i + 1; if (i >= N) i = 0;\r\n
    \  }\r\n   B[i] = d;\r\n}\r\n\r\nIt might also be worth mentioning 'early return'
    as a\r\nwidely supported example of multi-level break.\n\nI know I linked Leroy's
    book on Mastodon, so you probably read parts of it, plus you already knew much
    of the history. But for anyone else, part 1 is a very accessible and self-contained
    historical summary which should be interesting to any programmer. The rest of
    the book is great too and increasingly so as it gets to the leading edge, but
    the relevance to a general audience is narrower."
