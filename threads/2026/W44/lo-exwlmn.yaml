  text: |-
    defer ends up (IMO) not cleaning up the code that much

    I think this is one of those cases where old guys (like me) who have been dealing with this bullshit for 30+ years don’t realise how much unnecessary cognitive load they (we) have been coping with.
    The usual C resource allocation pattern (which this article describes perfectly) has several things you need to pay attention to:


    Keep track of where important resources are allocated. NOTE: you can’t tell which local variables own important resources at the point of their declarations, but you must work it out.


    Read the cleanup code (the goto targets) at the bottom of the function to get an idea of what resources might need cleanup. NOTE: you can’t tell which resources that are cleaned up on error paths are not temporary, and will outlive the function when it returns successfully.


    Examine every early return (every goto fail) and compare how the position of the goto relates to resource allocation and the cleanup code. NOTE: make sure they are nested properly, and be aware of if/when cleanup is a no-op for a default initialized variable or a failed allocation.


    Run through the happy path and make sure that temporary resources are freed (which usually duplicates the goto fail cases).


    The advantage of defer is that it makes clear at the point of the defer statements which variables own temporary resources, and you no longer have to manually cross-check the success and failure cases.
    I think it’s a mistake to judge defer by how clean the code looks, because cleanliness is often judged by how many lines get deleted. If you have well-written C then defer only moves code around. If you judge a change from goto fail to defer by its diff then you are unlikely to consider how much state you need to keep in your head when reading the code in between the allocation and the cleanup.
    The advantage of defer is how much less useless mental state you need to keep track of when reading the useful part of a function.
