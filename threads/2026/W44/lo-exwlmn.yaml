  text: "(Dammit, I have a wip blog post about this and I’m cross with myself for
    failing to finish it two months ago! I started writing it before Casey Muratori’s
    video!)\nKnuth’s article is very annoying! It has several well-chosen examples
    that are hard to write both readably and efficiently in strictly structured programming
    style, so it’s a good resource for judging a language’s control structures. But
    also, he pays a lot of attention to ad-hoc control structures (such as Zahn’s)
    while almost completely ignoring labelled-break or break-with-value. He very briefly
    mentions BCPL and BLISS (which both have break-with-value) but never considers
    how to write his examples in those languages.\nAnd to answer ~ghoti’s request,
    both BLISS and Wasm have that kind of block-structured break-with-value, and both
    lack unstructured goto. There’s no need for an experiment because BLISS was used
    for VMS and other operating systems between the 1970s and 1990s, and Will Smith
    Wasm is the new hotness using the same kind of control structures decades later.\nTo
    satisfy Knuth’s requirements, as well as break-with-value, you need a good case/match,
    and a compiler that’s able to optimize break-within-case so that two jumps become
    one. (This is easily within the capabilities of compilers of that era.) (And I
    assume some way to justify the use of ad-hoc symbols, which I will write with
    prefix . in the example, and I am sure the Zig fans can imagine how that might
    work.)\nSo Knuth’s example that you quoted might become (in some unspecified language):\nif
    :p {\r\n    for i in >= 1 <= n {\r\n        for j in >= 1 <= m {\r\n           if
    table[i,j] == target then\r\n               break :p .found;\r\n        }\r\n
    \   }\r\n    break :p .missing;\r\n} \r\nis .found then\r\n    print (\"item is
    in table\")\r\nor .missing then\r\n    print (\"item is not in table\");\n\nBut
    that’s over-complicated to illustrate the general form that can be used to deal
    with many of Knuth’s examples. There’s an obvious simplification using labelled
    break without value (and Knuth didn’t even compare multilevel break with his weirder
    alternatives):\n:done {\r\n    for i in >= 1 <= n {\r\n        for j in >= 1 <=
    m {\r\n            if table[i,j] == target then {\r\n                print (\"item
    is in table\");\r\n                break :done;\r\n            }\r\n        }\r\n
    \   }\r\n    print (\"item is not in table\");\r\n}"
