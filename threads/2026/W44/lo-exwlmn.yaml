  content: "# GOTO Considered Totally Sick (for error handling in C)\nOct. 25th, 2026\n\nI
    recently started writing C again for the first time since 2018, and handling errors
    has been an especially difficult adjustment coming from languages like Go and
    Zig that coddle me with their wonderful `defer` and `errdefer`. Then I read some
    [emails from John Carmack on inlined code](https://cbarrete.com/carmack.html)
    that gave me an epiphany on writing cleaner error handling code, and now I want
    to share it with the world.\n\n# But First Let’s Defer\n\nI write Go all day at
    my dayjob, and error handling is pretty trivial. When there’s an error we wrap
    it and bubble it up, and let some top dog up the call stack figure out what they
    want to do with it. If there is resource cleanup involved, it’s made easy with
    `defer`:\n\n    type Doer interface {\n        MightError(int) error\n        Lock()\n
    \       Unlock()\n    }\n    \n    func SomeFunc(d Doer) error {\n        d.Lock()\n
    \       defer d.Unlock()\n    \n        if err := d.MightError(3); err != nil
    {\n            return errors.Wrap(err, \"Doer.MightError()\")\n        }\n    \n
    \       // the rest of this very important function has been hidden from you for
    esoteric reasons\n    }\n\nSometimes there’s more complicated handling, but in
    99% of scenarios it’s that simple because Go doesn’t have manual memory allocation
    and you don’t need to worry about cleaning it up when there’s an error.\n\nZig
    on the other hand does require you to manually manage memory, which I find a little
    more difficult because I’m not experienced enough for it to be second nature like
    it is when I write Go. Here’s a snippet from my toy multiplexer that uses `errdefer`:\n\n
    \   fn init(allocator: std.mem.Allocator, env_map: *std.process.Environ.Map, cfg:
    Config) !Model {\n        const sh = env_map.get(\"SHELL\") orelse \"/bin/sh\";\n
    \       const shell_z = try std.fmt.allocPrintSentinel(allocator, \"{s}\", .{sh},
    0);\n        errdefer allocator.free(shell_z);\n    \n        const posix_block
    = try env_map.createPosixBlock(allocator, .{});\n        errdefer posix_block.deinit(allocator);\n
    \   \n        const tabs: []Tab = try allocator.alloc(Tab, cfg.commands.len);\n
    \       errdefer allocator.free(tabs);\n    \n        const pipes: []Pipe = try
    allocator.alloc(Pipe, cfg.commands.len);\n        errdefer allocator.free(pipes);\n
    \   \n        // all done with allocations (and errors)\n        errdefer comptime
    unreachable;\n    \n        // the rest of this function has been stolen by bilgerats\n
    \   }\n\nI’m allocating memory for several types, and because any one of the allocations
    can fail I need to handle freeing up each succesful memory allocation that preceded
    the failure. Zig’s `errdefer` makes this easy, there’s no manual tracking of what
    needs to be freed at any point, because the deferred statements will execute in
    reverse order if the function returns an error. Also I’m following the [Reserve
    First](https://matklad.github.io/2025/08/16/reserve-first.html) pattern, which
    is where I learned `errdefer comptime unreachable` from.\n\n# This is the C Part\n\nNow,
    enter C. There’s no `defer` or `errdefer`. I’ve painted myself into a corner with
    some ugly code a few times because I’m so used to those tools that I don’t regularly
    plan ahead for what my error handling control flow will look like. Until recently
    I’ve been writing code that looks like this:\n\n    struct S {\n        int foo;\n
    \   };\n    \n    S**some_func(const char** paths, const size_t n) {\n        struct
    S** s = calloc(n, sizeof(S*));\n        if (s == NULL) {\n            return NULL;\n
    \       }\n    \n        for (int i = 0; i < n; i++) {\n            s[i] = malloc(sizeof(S));\n
    \           if (s[i] == NULL) {\n                for (int j = 0; j < i; j++) {\n
    \                   free(s[j]);\n                }\n                free(s);\n
    \   \n                return NULL;\n            }\n    \n            int fd =
    open(paths[i], O_RDONLY);\n            if (fd == -1) {\n                for (int
    j = 0; j <= i; j++) { // note the <= instead of <\n                    free(s[j]);\n
    \               }\n                free(s);\n    \n                return NULL;\n
    \           }\n    \n            struct stat buffer;\n            if (fstat(fd,
    &buffer) == -1) {\n                for (int j = 0; j <= i; j++) {\n                    free(s[j]);\n
    \               }\n                free(s);\n                close(fd);\n    \n
    \               return NULL;\n            }\n            *(s[i]) = (struct S){
    .foo = buffer.st_size };\n    \n            close(fd);\n        }\n    \n        return
    s;\n    }\n\nDo you see how resource cleanup is slightly different across each
    error handling if-block? Yuck! Yeah yeah yeah, I know it’s a terrible, contrived
    example, and nobody would ever write C like this. Except me like 3 weeks ago.
    I knew something was wrong when I wrote code like this, but I was hopelessly `defer`-brained
    in a world where `defer` hadn’t been born yet. Some classmates had mentioned using
    `goto` but I couldn’t really wrap my head around it. (We can’t share code with
    eachother otherwise the university would have us killed).\n\nThen when I read
    those [John Carmack emails](https://cbarrete.com/carmack.html) something clicked.
    Carmack doesn’t mention `goto` explicitly, but these two thoughts in particular
    were the special sauce I needed to help me understand (emphasis mine):\n\nA quote
    from Henry Spencer describing control flow in some flight software:\n\n> It disallowed
    both subroutine calls and backward branches, except for the one at the bottom
    of the main loop. **Control flow went forward only**. Sometimes one piece of code
    had to leave a note for a later piece telling it what to do, but this worked out
    well for testing: all data was allocated statically, and monitoring those variables
    gave a clear picture of most everything the software was doing.\n\nAnd Carmack
    on moving code out of large conditional blocks (emphasis mine):\n\n> Enclosing
    pages of code inside a conditional or loop statement does have readability and
    awareness drawbacks, so leaving that code in a separate function may still be
    justified, but in some cases it is still possible to **move the code to another
    place where its execution wouldn’t be conditional** , or just **execute it at
    all times** and inhibit the results in some way with a very small conditional
    block.\n\nOhmygodigetitnow. Instead of having multiple exit points scattered throughout
    my function, each performing their own resource cleanup, I can put all resource
    cleanup behind a single exit point at the very end of the function. Guarding cleanup
    behind the default return, only reachable using a `goto`, is kinda like a psuedo-`errdefer`.
    Hooray! Hooray for John Carmack and Henry Spencer!! Now let’s rewrite the function
    above using this brand new discovery:\n\n    struct S {\n        int foo;\n    };\n
    \   \n    S**some_func(const char** paths, const size_t n) {\n        struct S**
    s = calloc(n, sizeof(S*));\n        if (s == NULL) {\n            return NULL;\n
    \       }\n    \n        for (int i = 0; i < n; i++) {\n            s[i] = NULL;\n
    \       }\n    \n        for (int i = 0; i < n; i++) {\n            int fd = open(paths[i],
    O_RDONLY);\n            if (fd == -1) {\n                goto free_mem;\n            }\n
    \   \n            struct stat buffer;\n            int fstat_ok = fstat(fd, &buffer);\n
    \           close(fd);\n            if (fstat_ok == -1) {\n                goto
    free_mem;\n            }\n    \n            s[i] = malloc(sizeof(S));\n            if
    (s[i] == NULL) {\n                goto free_mem;\n            }\n    \n            *(s[i])
    = (struct S){ .foo = buffer.st_size };\n        }\n    \n        return s;\n    \n
    \   free_mem:\n        for (int i = 0; i < n; i++) {\n            free(s[i]);\n
    \       }\n        free(s);\n    \n        return NULL;\n    }\n\nI’d say that’s
    much simpler to read! And it should be less prone to bugs from expanded responsibilities
    over time, because there’s only one spot where resource cleanup needs to be modified.
    You could also use multiple labels to split cleanup into sections, if you "
