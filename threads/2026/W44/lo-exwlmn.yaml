  text: "Yes, I've tried this in homebrew languages, including the conventional label/goto
    syntax. That's what I was alluding to with \"you can change that by making different
    syntax design choices in your language\". One downside with the conventional syntax
    is that the forward-looking scoping discipline for labels is awkward for both
    humans and computers, and you don't know how many implicit blocks there are and
    where they start while performing a single forward pass.\nYou can avoid that with
    different choices of syntax, but the alternatives are unlikely to be quite as
    syntactically lightweight. For example, Zahn's construct (1974) resolves both
    of the issues I mentioned with scoping and block boundaries, and that's probably
    familiar to some people here since Knuth describes it in Structured Programming
    with Go To Statements. To keep the discussion inline, here's the exitwhen example:\nexitwhen
    found or missing;\r\n    for I := 1 to N do\r\n        for J := 1 to M do\r\n
    \           if table[I,J] = target then found;\r\n    missing;\r\nexits\r\n    found:
    \  print (\"item is in table\");\r\n    missing: print (\"item is not in table\");\r\nendexit;\n\nThis
    particular syntax doesn't have implicit fallthrough (and I don't think it supports
    explicit fallthrough), but that's a choice."
