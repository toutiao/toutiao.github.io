  author: jerf
  text: Write down the definition of a token. Write down the definition of a stock.
    If you look at them carefully you&#x27;ll at least see a <i>lot</i> of overlap.
    For bonus points, write down not the actual definition of a token but the definition
    of a token its advocates want you to use; it is particularly this one that in
    my opinion is already what a share of stock is.<p>I can say you need to be careful.
    It sounds like you&#x27;ve written in to the definition of a &quot;token&quot;
    that it is &quot;meaningless&quot;, and that is a philosophical overreach, not
    an accurate statement. As the reply chain correctly tried to point out, nothing
    stops the same process that turns your abstract, &quot;meaningless&quot; number
    that represents your shares of stock into a meaningful number from being applied
    to a block chain token. Our entire economy is made from top to bottom out of &quot;meaningless&quot;
    things given meaning by convention, law, and other forces. Getting too reductionistic
    leaves you confused about not just tokens but a lot of things.<p>And on the flip
    side, if you actually dig in to what a &quot;share of stock&quot; that &quot;you&quot;
    &quot;own&quot; is, it is already not &quot;some fractional ownership that carries
    legal rights and a claim on assets&quot; and is already more complicated, abstract,
    and partial than you think. Just as the token advocates want you to think of a
    token as something more than it is, the stock system is not in a hurry for you
    to understand what it is you actually hold, but it certainly is not simply some
    fractional ownership in the simple way you probably have in mind, and there are
    more exceptions and caveats and legal ways you don&#x27;t really own it as much
    as you think already in the system. It&#x27;s already more a mere &quot;token&quot;,
    in the sense you originally meant, then you realize.
  score: 0
