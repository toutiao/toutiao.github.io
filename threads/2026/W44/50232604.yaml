  author: jerf
  text: Stocks are already tokens. &quot;Tokenizing&quot; stocks makes no sense, if
    one assumes quite reasonably that &quot;tokenization&quot; involves giving token-ness
    to something that was not already a token. What it is is wrapping what is already
    a token in another token, mostly so the second token can get around the limitations
    of the first. But some of those limitations are incidental and can be eliminated
    at any time by the underlying token provider, mostly because nothing stops a conventional
    stock market from being tradeable 24&#x2F;7. They already are if you&#x27;re in
    the club anyhow, per all the &quot;aftermarket&quot; and &quot;pre-market&quot;
    trading you hear about around quarterly release times.<p>The rest of the limitations
    are regulatory, and if the wrapping token can get access to regulatory approval
    to do their thing, so can the stocks.<p>The whole thing feels skeevy as all get
    out to me. It feels like someone telling me that they&#x27;ll be happy to hold
    my mortgage between me and the current holder. There is no good reason for that.
    Frankly there is already a disturbing amount of indirection in the way you don&#x27;t
    actually <i>own</i> the stocks you think you do, but they&#x27;re held on behalf
    of you on behalf of your broker at the Depository Trust &amp; Clearing Corporation.
    Adding another layer of indirection makes me worry about the motives of the people
    who are very excited about being that layer.
  score: 0
