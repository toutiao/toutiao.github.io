  content: "## FilesExpand file tree\n\n# type-server-protocol.md\n\n## Latest commit\n\n##
    History\n\n# type-server-protocol.md\n\n## File metadata and controls\n\n- Preview\n\n-
    Code\n\n- Blame\n\n# Type Server Protocol\n\nThe Type Server Protocol (TSP) is
    a JSON-RPC protocol for asking a type server for Python analysis data. A type
    server maintains the type-analysis state for a workspace and answers requests
    for the protocol version, snapshots, Python search paths, import resolution, and
    type queries (computed, declared, and expected types).\n\nThe protocol uses Language
    Server Protocol (LSP) data shapes and conventions where they are useful, such
    as Position and Range, and it represents URIs as strings the same way LSP does.
    TSP methods use the typeServer/ prefix.\n\nThe protocol artifacts in this folder
    are the authoritative definitions:\n\n- typeServerProtocol.ts defines the TypeScript
    interfaces and request types.\n\n- tsp.json is the machine-readable protocol model.\n\n-
    tsp.schema.json is the JSON schema for the protocol model.\n\n## Version History\n\nTSP
    uses semantic version strings for client/server compatibility checks. While the
    protocol is in the 0.x line, minor version changes may be breaking. Patch version
    changes remain backward compatible within the same minor line.\n\n## Connection
    Model\n\nA client starts a type server and communicates with it over the main
    JSON-RPC connection using a transport the server supports, such as stdio or Node
    IPC. When using stdio, stdout must be reserved for JSON-RPC protocol messages.\n\nA
    type server is expected to receive enough workspace and document state to answer
    the TSP requests it supports. Clients commonly use normal LSP initialization and
    document synchronization for this state, then send typeServer/* requests on the
    same JSON-RPC connection.\n\nTSP also supports optional extra read-only connections.
    The original connection remains the main connection and owns initialization, workspace
    state, document synchronization, state-changing notifications, and connection
    control. Extra connections are opened only after client and server negotiate support
    during initialization.\n\n## Startup Sequence\n\nA typical session follows this
    order:\n\n- The client starts or connects to the type server.\n\n- The client
    and server initialize any shared workspace state, commonly through the LSP initialize
    and initialized messages.\n\n- The client calls typeServer/getSupportedProtocolVersion
    and verifies that the returned semver string is compatible with the protocol version
    it expects.\n\n- The client calls typeServer/getSnapshot to obtain the first snapshot
    identifier.\n\n- The client sends type-query, import-resolution, or search-path
    requests that include the current snapshot when required by the request shape.\n\n-
    The server sends typeServer/snapshotChanged when prior type results are no longer
    valid.\n\n## Multi-Connection Mode\n\nMulti-connection mode is an optional performance
    feature. It lets a client open additional local channels to the same type server
    for read-only TSP requests, while the main connection continues to own the mutable
    workspace state.\n\nClients should use multi-connection mode only when they can
    benefit from concurrent read-only work, such as high-volume type queries or background
    workers that should not block the main JSON-RPC connection. A server must still
    work correctly in single-connection mode. Multi-connection support must not be
    required for protocol correctness.\n\n### Capability Handshake\n\nMulti-connection
    support is negotiated through the normal LSP initialize request and response.
    A client that can open extra TSP channels advertises the supported transport kinds
    under capabilities.experimental.typeServerMultiConnection:\n\n{ \"capabilities\":
    { \"experimental\": { \"typeServerMultiConnection\": { \"supportedTransports\":
    [\"ipc\"] } } } }\n\nA server that can serve extra TSP channels returns the same
    capability shape in the initialize result:\n\n{ \"capabilities\": { \"experimental\":
    { \"typeServerMultiConnection\": { \"supportedTransports\": [\"ipc\"] } } } }\n\nMulti-connection
    mode is enabled only when both sides advertise typeServerMultiConnection and the
    two supportedTransports lists have at least one transport in common. If either
    side omits the capability, or if there is no common transport, the session remains
    single-connection and the client must not send typeServer/connection.\n\nThe currently
    supported built-in transport kind for extra connections is ipc. This negotiation
    is separate from the main connection, which can use stdio or Node IPC.\n\n###
    Opening An Extra Connection\n\nAfter initialization and transport negotiation,
    the client opens an extra channel by sending typeServer/connection on the main
    connection:\n\n{ \"type\": \"open\", \"kind\": \"ipc\", \"args\": [\"<ipc-endpoint>\"]
    }\n\nFor ipc, the args array identifies the endpoint or endpoints that the server
    should connect to. The server should validate the request, connect to the supplied
    endpoint promptly, and return a result with success: true when it accepts the
    request. If the server cannot open the channel, it should return success: false
    and include a short message when useful for logs.\n\n### IPC Endpoint Arguments\n\nAn
    ipc endpoint is expected to provide a full-duplex JSON-RPC stream when the platform
    IPC mechanism supports it. In that case, args contains one endpoint string:\n\n{
    \"type\": \"open\", \"kind\": \"ipc\", \"args\": [\"<full-duplex-ipc-endpoint>\"]
    }\n\nIf the platform IPC mechanism exposes only one-way endpoints, args contains
    two endpoint strings. The endpoint names are from the type server's perspective:
    the first endpoint is the server input stream, and the second endpoint is the
    server output stream.\n\n{ \"type\": \"open\", \"kind\": \"ipc\", \"args\": [\"<input-ipc-endpoint>\",
    \"<output-ipc-endpoint>\"] }\n\n### Closing An Extra Connection\n\nThe client
    closes an extra channel by sending typeServer/connection on the main connection
    with the same transport kind and endpoint identity:\n\n{ \"type\": \"close\",
    \"kind\": \"ipc\", \"args\": [\"<ipc-endpoint>\"] }\n\nThe server should stop
    serving the matching extra channel and close the transport promptly. A client
    may also tear down its local transport if the server does not complete the close
    within the client's timeout budget.\n\nThe close request should use the same args
    shape that opened the channel: one endpoint for a full-duplex IPC stream, or the
    same input/output endpoint pair for a split IPC stream.\n\n### Allowed Traffic\n\nThe
    main connection owns all state-changing traffic. The following must remain main-connection-only:\n\n-
    LSP initialization and lifecycle messages.\n\n- Workspace, configuration, file-watcher,
    and document synchronization notifications.\n\n- Server-to-client snapshot notifications.\n\n-
    The typeServer/connection control request.\n\nExtra connections are TSP-only and
    read-only. They may be used for requests that do not mutate server state and whose
    results are valid for the snapshot supplied by the client.\n\nThe allowed TSP
    messages on an extra connection are bound to the negotiated TSP version. If a
    server reports support for a TSP version and advertises multi-connection support
    for that session, it must support every extra-connection TSP message defined for
    that version.\n\nThe table below lists the TSP version that first allows each
    message on an extra connection:\n\nServers should reject LSP traffic, state-changing
    notifications, typeServer/connection, and any TSP message not allowed for the
    negotiated TSP version when received on an extra connection.\n\n## Snapshots\n\nA
    snapshot is a non-negative integer that identifies a point-in-time view of the
    type server's analysis state. Type handles, declarations, symbols, and other returned
    objects are valid only for the snapshot in which they were returned unless a request
    explicitly says otherwise.\n\nThe type server must advance the snapshot whenever
    a previously returned type-analysis result may be invalid. Typical invalidating
    events include opened-file changes, closed files, configuration changes, watched-file
    changes, dependency changes, or "
