  author: TomBombadildoze
  text: 20 years working on Python. Two things have driven its success.<p>First, it&#x27;s
    easy to learn and reasonably powerful. You can make a lot of useful things really
    quickly, which was true even 15 years ago. It&#x27;s only gotten easier since,
    and the ecosystem has continued to grow.<p>Second, ML latched onto it. That gave
    Python a lot of credibility for people coming through CS programs and into industry,
    especially as AI use cases were picking up momentum. Think Tensorflow starting
    10-ish years ago, then Pytorch, and so on.<p>[opinion time] Unfortunately, ML
    has contributed to disaster. The quality of software engineering in ML applications
    lags badly behind that in other segments, and there&#x27;s where most Python development
    is happening now. The feedback loop of training Bad Python into LLMs is only making
    it worse. The skill floor was dropping, and now it&#x27;s practically zero.<p>It
    also wasn&#x27;t helped much by language design decisions. Gradual typing was
    a huge mistake. It would have been much better to go the Typescript route and
    define a superset of the language that compiles to native Python. The grafted-in
    typing features that rely on runtime behavior and never got an actual spec for
    a type system haven&#x27;t helped.
  score: 0
