    to by their UTF-16 offset. That means applications are required to store a persistent
    mapping from UTF-16 offsets to whatever they use internally, keep that mapping
    updated as the document is edited, and map back and forth constantly.<p>Oh well.
    It was primarily designed to be a good protocol for VSCode, not for any other
    users. That&#x27;s just the price you pay when using a corporate standard.
