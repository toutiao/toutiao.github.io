  text: 'Bad take. These kind of hybrid regimes or &quot;electoral autocracies&quot;
    are kind of the flavor du jour of modern attempts towards authoritarian governments.
    You take control democratically, and then build a system where you control as
    much of the apparatus of democracy as possible: you change rules or laws to ensure
    opposition parties cannot gain an advantage in elections; you take control of
    or ally with the owners of media institutions to push your agenda; you concentrate
    powers under offices that are easy to control, such as an executive or judicial
    body. When these regimes topple, as with Orban earlier this year and Vucic now,
    it is because the autocrats overestimated their control. Orban didn&#x27;t think
    it was possible for the usually fractious opposition to get the votes to defeat
    him, but Magyar managed it. Pressure from outside helps, too; when Orban took
    power, he did so as a center-right figure aligned with the largest political block
    in the EU (and got support from many of his counterparts, especially Merkel).
    By the time he lost power, much of Europe had distanced itself from Hungary and
    that pressure was being felt internally.<p>I think the important takeaway here
    is not that &quot;a lack of violence means that there wasn&#x27;t real oppression,&quot;
    but rather that modern autocrats are trying to execute a playbook whereby they
    retain the appearance of democracy to legitimize their rule as a mandate from
    the people while stacking the deck as much in their favor as possible. Indeed,
    trying to violently retain power kind of defeats the purpose of the charade; by
    relinquishing control, the autocrats can treat defeat as a temporary setback,
    not a permanent loss. Expect this playbook to evolve as more hybrid regimes fall
    out of favor.'
