  author: ruik
  text: 'The ACPI specification says: Additionally ACPI defines a fail-safe Off protocol
    called the “power button override,” which allows the user to initiate an Off sequence
    in the case where the system software is no longer able to recover the system
    (the system has hung). <i>ACPI defines that this sequence be initiated by the
    user pressing the power button for over 4 seconds, at which point the hardware
    unconditionally sequences the system to the Off state.</i> This logic is represented
    by the PWRBTN_OR signalcoming into the sleep logic.'
