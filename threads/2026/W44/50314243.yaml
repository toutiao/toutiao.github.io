    There seems to be some bits in Intel PCH chipset datasheets for that: Power Button Override Period (PBOP): This field determines, while the power button remains asserted, how long the PMC will wait before initiating a global reset.
    Encoding:<p>000b - 4 seconds<p>001b - 6 seconds<p>010b - 8 seconds<p>011b - 10 seconds<p>100b - 12 seconds<p>101b - 14 seconds<p>Others - Reserved<p>This bit is reset by DSW_PWROK de-assertion. (edited formatting)
