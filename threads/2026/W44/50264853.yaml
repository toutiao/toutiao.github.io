  author: armcat
  text: Back in 2018 I was working on a project for educating schools in certain parts
    of Africa and Middle East, on AI. The issue was it had to be air-gapped (no internet
    guarantees) and small&#x2F;portable. I ended up downloading Wikipedia (not all
    of it), and then created a lightweight inverted index (for search) and TextRank
    (for summaries). The whole thing was on a Raspberry Pi, and installed in a small
    plastic enclosure. We had many of these and could easily ship them. There was
    an &quot;AI Learning Module&quot; as well we built, that started with Scratch,
    and then moved into Python. But if I was to do it all over today, I would probably
    add a tiny LLM and maybe a small ASR and a TTS model too, and you basically have
    a completely self-contained AI knowledge assistant in a cigarette box. The point
    being, you basically also have a &quot;survival AI&quot; you can take with you.
    Of course you still need electricity...
