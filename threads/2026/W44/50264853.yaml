  author: x3haloed
  text: 'This topic is bringing out the hallucination-panic crowd.<p>It&#x27;s perfectly
    safe to use LLMs to surface underlying data and knowledge without having to trust
    that it&#x27;s giving you correct advice.<p>Use the LLM as search technology:
    string match -&gt; semantic search -&gt; search intelligence.<p>This is especially
    helpful when you don&#x27;t know the right question to ask. Semantics only help
    you find text that is semantically near the input query. Semantics won&#x27;t
    help you when what you are looking for is connected to what you have by something
    other than semantics, like causation, mechanism, or interpretation.<p>Trying to
    figure out why your crops aren&#x27;t growing well will likely require you to
    read several articles across a range of sciences, probably scoped to the specific
    conditions you are dealing with. A semantic search is not going to surface those
    first.<p>Allowing an LLM to chain together several sources for you to read first
    does not require you to ask it for a conclusion.'
