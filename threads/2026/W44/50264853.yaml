  url: https://www.brangus.io/survival-llm
  title: Survival LLM
  fetch_status: success
  content: "## What it does\n\n### Works with no internet\n\nThe AI model and the
    library live on your computer. Nothing you ask leaves it.\n\n### Shows its sources\n\nEvery
    answer lists the articles it read. Click one to read it yourself, with the exact
    passage highlighted.\n\n### Made for emergencies\n\nMedical references, FEMA and
    CDC guidance, survival manuals, how-to guides, repair guides and about 930,000
    Wikipedia articles.\n\n## Pick your version\n\nThe app is the same everywhere.
    When it opens, it checks your computer's memory and downloads the AI model that
    fits. More memory means a smarter model.\n\n| Your computer | AI model it uses
    | Our emergency test | Model download |\n| --- | --- | --- | --- |\n| Mac with
    128 GB or more memory | NVIDIA Nemotron 3.5 Super | 21 of 22 right | 80 GB |\n|
    Mac with 32–96 GB | Qwen3.8 27B | 21 of 22 right | 18 GB |\n| Windows PC with
    32 GB or more | NVIDIA Nemotron 3.5 Lightning | 19 of 22 right | 25 GB |\n| Mac
    or PC with 16–31 GB | IBM Granite 4.2 8B | 14 of 22 right | 6 GB |\n\n\"Right\"
    means it got the main point of official guidance right on 22 blackout and first-aid
    questions, graded blind, in our tests on an earlier build of the library ([how
    we tested](#source)). Smaller models make more mistakes, so the app always shows
    the source to check.\n\nPlus the library: a 9 GB download for everything (19 GB
    once installed), or 1.3 GB (3 GB installed) without Wikipedia and iFixit. Free
    disk space needed: the model's size plus 5 GB, plus about 27 GB while the full
    library installs (10 GB for the smaller one). Apple Silicon Macs (M1 or newer)
    with macOS 14 Sonoma or newer, and 64-bit Windows 10 or 11.\n\n## Set it up in
    three steps\n\nSetup takes 20 minutes to about 2½ hours, depending on your computer
    and your internet speed. You only click for about 5 minutes; the rest is downloading.\n\n1.
    **Download Survival LLM** for [Mac](#download) or [Windows](#download) and unzip
    it. On Windows, right-click the zip and choose _Extract All_.\n2. **Open it.**
    On a Mac, double-click _Survival LLM_. On Windows, open the extracted folder and
    double-click _Survival LLM.bat_.\n3. **Follow the setup.** The app opens in its
    own window and downloads the AI engine (built into the Mac app), the AI model
    that fits your computer, and the library. Let it finish while you're online.\n\n**The
    first time you open it,** your computer warns you, because the app isn't sold
    through an app store.   \n**Mac:** click _Done_, open _System Settings \\> Privacy
    & Security_, scroll down to \"Survival LLM was blocked\", click _Open Anyway_
    and confirm with your password. You only do this once.   \n**Windows:** click
    _More info_, then _Run anyway_. \n\n## What's in the library\n\nPlain-text copies
    of openly licensed (some for non-commercial use only) and public-domain references,
    searchable in a fraction of a second:\n\n- About 930,000 of Wikipedia's most-read
    articles\n- WikiMed medical encyclopedia\n- MedlinePlus (U.S. National Library
    of Medicine)\n- UK Medicines A to Z (public sector information)\n- WikEM emergency
    medicine\n- Ready.gov (FEMA) emergency guides\n- CDC travelers' health\n- U.S.
    military medicine and survival manuals\n- Risk references for estimating micromorts:
    life tables and U.S. death rates\n- wikiHow how-to guides\n- iFixit repair guides\n-
    Appropedia (appropriate technology)\n- Q&A on home repair, cooking, gardening,
    the outdoors and ham radio (Stack Exchange)\n\nEach source keeps its own license,
    shown with every article; see the [full list with licenses](#source).\n\n## Good
    to know\n\n### It can be wrong\n\nAI models make mistakes, the small ones more
    often. Every answer shows the articles it used, so you can check.\n\n### Private\n\nNo
    account, no tracking. Your questions never leave your computer, and once set up
    it works with the internet off.\n\n### Your own files\n\nAdd PDFs, Word documents,
    ebooks and notes, like your generator's manual or your family's emergency plan,
    and the AI searches them too. They stay on your computer.\n\n### Updates\n\nCheck
    for updates, at the bottom of the app, installs a new version in one click and
    keeps your models, library and files.\n\n### Battery\n\nOn a MacBook Pro we measured
    about 100 W while it answers, for 5 to 40 seconds per question: a full battery
    answers roughly 100 to 300. A small generator or power station runs it easily.\n\n##
    Update notes\n\nAlready have it? Click _Check for updates_ at the bottom of the
    app.\n\n### 0.3.4 October 27, 2026\n\n- **Reasoning setting:** next to Send, choose
    how much the AI may think before it answers: Off, 1,000, 4,000 or 16,000 tokens,
    or no limit. At the limit its thinking stops and it answers from what it has,
    so a model stuck reasoning in circles still answers. It replaces \"Think harder\".\n-
    When the AI looked things up but never wrote an answer, it now gets the best articles
    it found and tries once more, instead of showing nothing. Thanks to betsyisaac
    for finding this.\n- Ask it to look something up and it searches the library,
    even if it first answered from memory. Answers say whether they came from memory,
    from articles it read, or from search results it didn't open.\n- A warning when
    Reasoning or Length limit is set to no limit.\n\n### 0.3.3 October 27, 2026\n\n-
    Mac: quitting with Cmd+Q now also stops the AI engine and frees the memory its
    model used. Before, it kept running in the background. Thanks to wigginthethird
    for the report and the fix.\n- Library search no longer shows several copies of
    the same page, so the AI sees more different articles. Thanks to ahalekelly.\n\n###
    0.3.2 October 27, 2026\n\n- The AI no longer saves your question as a memory note.\n-
    Some answers no longer open with a made-up \"Sources:\" line that listed the AI's
    search commands instead of articles.\n- Show reasoning reads more clearly: it
    says when you stopped it, the time shown is how long it thought, and long reasoning
    scrolls with the page.\n- Windows: cleans up an empty folder that earlier updates
    could leave behind.\n\n### 0.3.1 October 27, 2026\n\n- **Show reasoning:** under
    each answer, open what the AI thought before it answered, with the searches and
    articles it read in between. It stays hidden until you click it. Most models reason
    first only when _Think harder_ is ticked.\n\n### 0.3.0 October 26, 2026\n\n- **Memory:**
    tell it about yourself, like a family member's allergy or the generator you own,
    and it keeps a short note for later chats. See and edit every note under _Memory_,
    or turn its saving off.\n- Downloads now work on computers whose network or antivirus
    uses its own certificates.\n\n[All releases on GitHub](#source)"
