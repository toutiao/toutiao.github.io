  author: dns_snek
  text: I don&#x27;t think Wikipedia is a good benchmark here. Try 30 random articles
    and see how much of that information you would want to have with you in an emergency
    survival scenario.<p>Either way the comparisons here are unfair. An LLM that runs
    off a backpack-sized solar panel and a laptop might be a substitute for a broad,
    low quality, surface-level encyclopedia but it&#x27;s many orders of magnitude
    worse than a library of books.<p>I would argue that in a survival situation the
    accuracy of information becomes even more important. If an LLM to misidentifies
    a plant (or a medical condition, its treatment, etc.) it could put you in an ER,
    but in a survival situation that could kill you.
