  text: Local AI already is really useful. This has been true since Qwen Flash Next
    and Qwen 3.8 27B rolled out. The struggle with exactly 64GB of unified RAM is
    that you end up having to stream the engram table from SSD because you will need
    almost all of your 64GB to run QFN. A 27B dense model still runs a little slow,
    even on an M1 Max Mac. However if you have even an older gaming GPU with 12-16GB
    of RAM and enough system RAM you can run this model (QFN) at a very respectable
    token rate and intelligence level. It is a Sonnet 5 class model you can run at
    home. There are new quantization techniques that make these models very good at
    agentic tasks.<p>And now if you stretch you can run DeepSeek Flash 4.1.<p>And
    if you were willing to roll up your sleeves you could build your own AI lab at
    home and run this model and models like GLM Flash 5.3 and DeepSeek Flash V4.1
    at lower quants. The budget GPUs (like V100) are kind of not budget now, but still
    &lt;5K to acquire 128GB of fast VRAM that can compete with a 5090 and actually
    has a lot more interesting options available IMO.
