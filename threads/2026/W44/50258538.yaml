  text: The conspiracy is real, it&#x27;s even been proven in court, but as things
    stand, it&#x27;s also necessary because of the factors you describe. Investors
    will not touch the DRAM market with a 10-foot pole, so it has had to rely on self-funding.
    While there have been state subsidies too, price fixing has proven to be the most
    effective way to survive the extreme volatility and fund the massive capex necessary
    for each generational leap. They have gotten a bit more sophisticated about it
    since the court case 20 years ago, but as far as I can tell, it&#x27;s basically
    the same as it&#x27;s ever been. The lack of effective competition is a function
    of the market itself, not any tilted scales. If anything, tilting the scales on
    purpose with greater state involvement is the only way to change the dynamics,
    but few states have the capacity and competence to carry that out effectively.
