  author: plqbfbv
  text: 'I&#x27;ve benchmarked quite a few models on my 9070XT, and I basically gave
    up hope of using models locally: <a href="https:&#x2F;&#x2F;claude.ai&#x2F;artifact&#x2F;77pHgucqQNsmic8ZEnqdBA"
    rel="nofollow">https:&#x2F;&#x2F;claude.ai&#x2F;artifact&#x2F;77pHgucqQNsmic8ZEnqdBA</a><p>I
    asked Claude to come up with 7 problems to solve that were not part of any benchmarks.
    Besides speed, I asked it to put together a scoring that would reflect models
    that perform well on the 7 problems and in a reasonable time-frame (RWS, the definition
    is in the artifact). I valued models that produced good answers in a reasonable
    time better than models that had very high throughput but kept spitting useless
    stuff. Overall, IIRC most of them still had a &gt;30% chance of producing wrong&#x2F;non-working
    replies.<p>I then tested Strata ( <a href="https:&#x2F;&#x2F;github.com&#x2F;niko1221&#x2F;strata"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;niko1221&#x2F;strata</a> ) and
    the results are not even close. You can basically ignore everything in that table
    and use Strata instead, you can use bigger&#x2F;less-quantized models and have
    way better results. Basically any otherwise-decent model degrades noticeably at
    Q &lt; 5, and KV cache at Q4 also contributes a lot.<p>Still, a 20$&#x2F;mo Claude
    subscription is way cheaper&#x2F;more efficient if you code 2-3h in the evening
    than running stuff locally, unless you really have hardware than can hold models
    that get most things right at the first try. You can iterate way faster and cover
    a lot more ground in 2-3h using a Claude subscription, or OpenRouter if you prefer
    to change models. You get faster replies that are 99% correct at the first try,
    whereas using the local model you&#x27;d be spending 30% of your time fixing things
    that don&#x27;t work and prompting it to do better.<p>Nowadays I use the local
    model to delegate tasks that would burn a lot of tokens, like sifting through
    big data archives for indexing and such.'
