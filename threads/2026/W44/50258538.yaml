  author: bitexploder
  text: Dense models are not well suited to this. Depends on your system, but most
    inference engines let you put the KV cache on the host. They should let you use
    &quot;Q8&quot; KV cache format as well which takes half the storage of bf16, the
    default format. You essentially are stuck at having to fit the entire dense model
    into VRAM because it must compute across the entire model every token. Without
    it being in VRAM it is slow. MoE models such as Qwen 35B with 3B active parameters
    are much friendlier to limited VRAM systems. This is why you see systems with
    16GB of VRAM running something like DeepSeek Flash if they have a bit of spare
    system RAM. Usually not at any good token rate, but tolerable.<p>Dense models
    also don&#x27;t like quantization as much and are less tolerant of it. There are
    some very interesting smaller models like <a href="https:&#x2F;&#x2F;huggingface.co&#x2F;nvidia&#x2F;NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16"
    rel="nofollow">https:&#x2F;&#x2F;huggingface.co&#x2F;nvidia&#x2F;NVIDIA-Nemotron-Labs-Dory1.0-4...</a>
    Dory that I would check out. You need system RAM or to stream a larger MoE model
    from disk and it won&#x27;t be fast. You need to specialize the models some to
    get quality results if you have very limited system resources.
  score: 0
