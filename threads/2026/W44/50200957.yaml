    and AFAIK it&#x27;s still not clear if that area is mostly a castle, or if it
    was mostly some cultic thing -&gt; nothing written, not even in clay or chiseled
    into stone.<p>Similarly, in this article <a href="https:&#x2F;&#x2F;de.wikipedia.org&#x2F;wiki&#x2F;Hallstatt_(Arch%C3%A4ologie)"
    rel="nofollow">https:&#x2F;&#x2F;de.wikipedia.org&#x2F;wiki&#x2F;Hallstatt_(Arch%C3%A4ologie)</a>
    that describes the salt mining in Hallstadt since the bronze age there is only
    so much that they know.<p>So, did they use torches?  They have decayed over this
    time.<p>We know however that they had some kind of meat industry at Hallstein.
    They had plenty of salt, and so they used that to make meat durable. Animal skulls
    survived the times ...'
