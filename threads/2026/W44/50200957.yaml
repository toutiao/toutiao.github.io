  author: ButlerianJihad
  text: The editors of major English dictionaries have certainly had significant impact
    on English as She is Spoke, but we cannot ignore the fact that the Spanish language
    is centrally codified and prescriptive (like the French language), while English
    is distinctly decentralized, and its dictionaries are correspondingly descriptive,
    more often than not.<p>Spanish has notably gone through some orthography reforms
    since I learned it in high school, in the 1980s, and so among other things, the
    idiosyncratic &quot;sort order&quot; which we learned doesn&#x27;t really apply
    anymore. In school, we also learned to be <i>aware</i> of the <i>vosotros</i>
    first-person plural, but we didn&#x27;t really learn all the forms, because we
    were chiefly learning Mexican&#x2F;LatAm vernacular Spanish.
