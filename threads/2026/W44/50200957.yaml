  author: holgerschurig
  text: 'No, it means nothing. You shall not needlessly anglicize.<p>The name Hallstadt
    (not the two l letters) means Salt Town.<p>Or, actually &quot;place&quot;. In
    a lot of location names of germanic origin &quot;stadt&quot; doesn&#x27;t the
    current semantics, of being a town with &gt; 10.000. More often than not it just
    means &quot;place&quot;.<p>And &quot;Hall&quot; is an old term for salt. Many
    towns related to salt have it in their names, in many places of Germany and Austria.
    &quot;Halle an der Saale&quot; in Thüringen, Bad Reichenhall (Bayern), Hall im
    Tirol (Österreich), Schwäbisch-Hall (Baden-Württemberg) etc.<p>&quot;Hall&quot;
    is believed to be of celtic origin.<p>And the double l is important. German is
    a language where in the written form you look at the letters and you immediately
    see how it is spoken. A double vocal makes the speed slower, and a double consonant
    makes the speech faster. So &quot;Halstadt&quot; would be slow Hal (so more emphasize
    on the &quot;a&quot; instead), and &quot;Hallstadt&quot; would be a fast &quot;Hall&quot;,
    similar in speed like the english &quot;hell&quot;: little emphasize on the &quot;a&quot;.'
  score: 0
