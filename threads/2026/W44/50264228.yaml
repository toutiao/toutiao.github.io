  author: smallmancontrov
  text: The &quot;fast takeoff&quot; scenarios got most of the attention, but the
    &quot;slow takeoff&quot; scenarios better match the reality we find ourselves
    in and they tend to involve economics.<p>We are a capitalist economy, which means
    the control plane is privately owned, which gives a superintelligent entity paths
    to power and resource accumulation that are not only safeguarded from public interference
    by design but also have a built-in time-tested mechanism for aligning insiders
    and outsiders to their goals, participating in politics, and so on.<p>Instead
    of &quot;1. AI builds human killer virus, 2. ..., 3. profit,&quot; this apocalypse
    looks like a company that grows by providing genuine goods and services, massive
    returns for its boosters and allies in politics, the ASI uses that wealth to build
    independent infrastructure for itself, and <i>then</i> it gets rid of the stinky
    smelly humans with a virus so that it can turn the iron in our blood into paperclips,
    or whatever.<p>One can hope that GPUs will never be able to run a company well
    enough to acquire bootstrap-level resources or that &quot;you are a helpful assistant&quot;
    will keep them aligned to <i>someone</i>, but frankly I suspect those are both
    cope and the real hope lies in the first attempts failing in spectacular enough
    fashion that people decide to do something to prevent it going forward. Or in
    &quot;friendly AIs&quot; saturating the competitive landscape first -- that&#x27;s
    a bit too Disney for my cynical taste, but I would much prefer it to the alternative.
