  author: daniel_rh
  text: I love that idea! Please let me know if it&#x27;s of any help :-)<p>Since
    the Playdate doesn&#x27;t have any of the sprite rendering hardware that made
    the gameboy both underpowered in compute and overpowered in graphics at the time,
    some of the tricks may be unnecessary.<p>I suppose you could do some kind of shift
