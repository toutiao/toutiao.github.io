  author: zetazzed
  text: 'One major element in this is the rise of earnings from pass-through income.
    Self-employed or nearly self-employed individuals who would have been counted
    as employees of their small businesses 30+ years ago increasingly take &quot;profits&quot;
    from their business rather than &quot;wages,&quot; even though they are the same
    thing. The &quot;profits&quot; get tax advantages. This makes labor share decline
    despite dentists, consultants, etc. still doing the same amount of work and taking
    home the same pretax income. See: <a href="https:&#x2F;&#x2F;www.ericzwick.com&#x2F;labshare&#x2F;labshare.pdf"
    rel="nofollow">https:&#x2F;&#x2F;www.ericzwick.com&#x2F;labshare&#x2F;labshare.pdf</a>'
