  author: skew-aberration
  text: All (the value) of the things produced goes ultimately to either labor (wages),
    capital (interest), or land (rent) - Adam Smith. (tax being an intermediary for
    the same).<p>If wages are down then rent or interest returns are up.<p>Market
    interest rates are trending up in recent years but in line with &#x2F; below long
    term averages.<p>So obviously rent is doing the heavy lifting. GFC, housing crisis,
    etc, are all products of the extreme rents and land speculation.<p>Where does
    rent go? It can be consumed (luxury goods, etc) but most of it &#x27;grounds out&#x27;
    in labor and capital through subsequent investments.<p>So higher share going to
    rent actually looks like larger luxury consumption by the landowners, more services
    consumed by them, and (probably most significantly) larger capital investments
    domestically and internationally - huge AI and semiconductor investments, robotics
    and EV factory build outs, complicated R&amp;D programs, etc). These go on to
    employ more laborers globally - with the key change being that the return to laborers
    within any one investment is historically low.<p>Money is only an intermediary.
    It is the flow of goods produced (machines built, technologies developed) and
    services and resources which really matters.
