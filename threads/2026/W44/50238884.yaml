    various physical mediums never revealed to me a fundamental particle that gives
    rise to value of a dollar<p>But go ahead spend another 250 years debating the
    memes of the long dead; I am more interested in weird science and a lived experience
    that&#x27;s more than that.<p>Oh no some people who have zero obligation to me
    took some made up points away... guess I should commit seppuku? You all want me
    to keep you in mind next time I buy groceries; would some HNer find this choice
    generic; lol...nah...<p>Not unreasonable to call such banal arithmetical score
    keeping generic and shallow; a binary up&#x2F;down vote; oh so deep and heretofore
    unknown to humans<p>Believe it or not my real goal is discuss actually interesting
    things not the same old blah blah blah of CNBC. The generic and shallow tone towards
    finance babble is because it&#x27;s a generic and shallow context we pretend to
    find interesting because of its centralness to our social cult practices; when
    all you have is a hammer every problem is a nail; coloring either tool or both
    pink, blue mango... the context is the same context<p>The government is the number
    1 employer of economics PhDs and well... may be that they are ready to quit hiring
    them: <a href="https:&#x2F;&#x2F;www.chrisbrunet.com&#x2F;p&#x2F;the-collapse-of-the-econ-phd-job"
    rel="nofollow">https:&#x2F;&#x2F;www.chrisbrunet.com&#x2F;p&#x2F;the-collapse-of-the-econ-phd-j...</a><p>The
    times are a changing; moving on from ultimately arbitrary academic euphemisms.
    You know how we don&#x27;t call ourselves British in the US? And the world doesn&#x27;t
    default to Latin? Future people won&#x27;t sound like us either; because it doesn&#x27;t
    really matter.<p>I stick to discovery of new music and bleeding edge physical
    experimentation in physics and engineering to get a bump. Dollars and cents bean
    counting is just empty <i>fingers flapping to mime a babbling mouth</i><p>This,
    though, is actually interesting analysis of reality before us:<p><a href="https:&#x2F;&#x2F;www.smithsonianmag.com&#x2F;smart-news&#x2F;for-the-first-time-scientists-trapped-an-elusive-antimatter-particle-and-contained-it-for-months-it-could-allow-them-to-test-an-enduring-physics-theory-180989738&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.smithsonianmag.com&#x2F;smart-news&#x2F;for-the-first-time...</a><p>We
    may be able to just beam consciousness across timespace with out the dick shaped
    rockets; but we will never find out if we keep living in sunk cost fallacy and
    cling to rockets to nowhere because it&#x27;s what the 55+ year olds oo&#x27;d
    and ahh&#x27;d at as kids to the detriment of the next generation of kids finding
    even cooler things to oo and ahh<p>There you go. Some proper deep thoughts.<p>Like
    and subscribe!'
