  author: knappe
  text: 'At the center of their story is a quiet revolution in the American economy:
    the rise of a particular kind of private business. A few decades ago, these businesses
    collectively made far less money than Corporate America. But by 2011, they were
    generating more income than all traditional U.S. corporations combined — and accounting
    for most of the rise in the share of income flowing to the top &quot;one percent.&quot;<p>Over
    the previous few decades, this sort of private business had — quite privately
    — taken over the American business world. In 1980, pass-through businesses generated
    about one-fifth of all U.S. business income. By 2011, they generated more than
    half. Move over, Corporate America. Hello, Pass-Through America!<p><a href="https:&#x2F;&#x2F;www.npr.org&#x2F;sections&#x2F;planet-money&#x2F;2026&#x2F;09&#x2F;14&#x2F;g-s1-143041&#x2F;the-powerful-millionaires-hiding-in-plain-sight"
