  author: SirHumphrey
  text: This article is a bit of a confusing mess, mostly stemming from confusion
    between two vastly different technologies that unfortunately share the same name.
    Shaheds and counter personnel quads deployed in Ukraine are vastly different technologies.
    Shaheds, for a lack of a better word, are essentially cheap cruise missiles which
    are effective because countering them currently usually requires an overly capable
    and much more expensive counter air missile. Doctrinally except for asymmetry
    of their cost, they are used much the same a cruise missile would be.<p>As for
    antipersonnel quads, Ukraine currently uses 7-8 inch ones. They are not small,
    quite loud and not exceptionally maneuverable. They are also extremely fragile
    and can be shot down by hitting just about any part of the quad. Also the thing
    about being difficult to detect using radars is just not true. They have a fairly
    large radar signature relative to their size which is also fairly unique because
    the spinning propellers cause Doppler shift on the rotating props. Small autocannons
    are already being developed for this role and in the urban environments similar
    systems using nets are being considered. There are also some prototypes of special
    rifles or rifle attachments for counter drone use being tested in Ukraine for
    infantry use.<p>The two most realistic dangers come from concealing them in shipping
    containers and then deploying them deep behind enemy lines (I am fairly sure this
    is already illegal in most jurisdictions) and targeted assassinations, where defending
    against drone threat is not that different than defending against other assassinations
    threats (concealed bombs, gunmen, snipers etc.).
