  text: I have to disagree here. While it&#x27;s been proven that a lot of things
    can be done by just searching a very big solution space very fast (either by brute
    compute or by a sophisticated algo or both), hardware solution spaces are not
    that easily searched.<p>For a lot of applications where signal integrity is not
    critical, high frequency switching is not required and power density is moderate,
    yeah. Anyone can do that, even an AI. But you don&#x27;t even need to make a pcb
    for those cases, just throw the components in a protoboard and fire away.<p>When
    you start adding variables to the search space (emi interference, matching routing
    impedances, heat management, mechanical integrity, etc) the search space grows
    so big that any non-expert will become lost in it.<p>Will future cheap compute
    power be able to overcome this? I&#x27;m not betting on it.
