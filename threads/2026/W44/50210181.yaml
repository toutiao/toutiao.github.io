  author: PowerElectronix
  text: A lot of stuff one learn along the way never gets put formally on a document,
    and every iteration has to be checked in the lab.<p>With code or math or simple
    text, or games, you can have swaths of documents easy to digest and readily available,
    you can run thousands of tests per second and you can check results right a way.<p>With
    a power converter, a ddr4 module, an fpga, you have to build the pcb, assemble
    it, test stuff little by little, fix thing as they break, increase power, etc.<p>You
    can take notes on stuff that has been changed , the reason for the change is usually
    a few words note if any. And then you find something weird and you see that there
    is absolutely nothing on internet about it and you have to find out on your own.
    At least that&#x27;s my experience with hardware design.<p>For the important stuff
    that makes you lose a board or a month of work you make sure to document the reason
    and the solution, but it usually is in a internal document no one will (regretably)
    read.<p>If you then add mechanical stuff, thermal management, failure modes, etc.
    I just don&#x27;t think there&#x27;s enough compute power to bruteforce such a
    huge space of solutions, even if you don&#x27;t take into account that you can&#x27;t
    really teach the machine about hardware design apart from some open source stuff
    and development kits where documentation, part lists and gerbers for the pcb are
    available.
