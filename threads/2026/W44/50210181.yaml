  author: PowerElectronix
  text: I say that hardware design has a way bigger solution space.<p>In chess, being
    able to check hundreds of lines per second makes you a superhuman. But in hardware
    design you get lost if you try to search the solution space for a circuit, schematic,
    component selection, layout, routing, stiffener and thermal solution.<p>There
    are a few like positioning and routing where the solution space can just be considered
    infinite as there are infinite copper geometries (even if you stick with straight
    line polygons) that can connect a number of infinitely differently positioned
    components.<p>Then, for the mechanical stiffener, again you have an infinite number
    of geometries that don&#x27;t clash with your components, don&#x27;t run over
    your copper traces and make the board resist the mechanical tests (which the AI
    could check with a lengthy FEM analysis per iteration).<p>After all that, or in
    parallel with the mechanical analysis you can run the thermal ones and tweak positions
    of the hot stuff and thickness of stiffener walls to get everything fine.<p>I
    just can&#x27;t see an LLM do that with a board with a few hundred components,
    even if most are decoupling capacitors.
