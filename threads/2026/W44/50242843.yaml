    <i>starvation </i>. Some fine choice.<p>&gt; And you confused capitalism with
    colonialism.<p>I didn&#x27;t confuse anything, I linked a famous piece of political
    theory positing they are interlinked phenomena.<p>&gt; If you did that on purpose,
    you brought up whataboutism.<p>I&#x27;m also confused by what you are trying to
    say here. Who brought up whataboutism? I never spoke of it? Didn&#x27;t you just
    bring it up? I&#x27;m confused.<p>&gt; I aint playing your game diverting attention
    from my comment.<p>Nobody&#x27;s diverting. I was directly engaging with it and
    providing some theory to further understanding and illustrate different perspectives
    on a term people sometimes get tripped up by.<p>It is telling you perceive anything
    but uncritical agreement as diversion. I would encourage you to bring the spirit
    of curiosity the guidelines call for."
