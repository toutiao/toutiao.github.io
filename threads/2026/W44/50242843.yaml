  author: DonaldPShimoda
  text: Hm, some notes:<p>- I would say that extracting capital from labor does not
    constitute &quot;slavery&quot; in the sense of either de facto or de jure &quot;ownership&quot;
    of humans, but a wider interpretation of the word may apply.<p>- Exploitation
    doesn&#x27;t have to be fraud. People can be willingly exploited. If we imagine
    for the sake of argument that human suffering can be quantified, and we imagine
    a person who starts from a place of, say, a 10 on an arbitrary scale where that&#x27;s
    pretty bad (and 0 is no suffering), they may &quot;choose&quot; to take a job
    that reduces their suffering to an 8. Despite the reduction in suffering, someone
    else benefits from this arrangement more than the suffering human, and the benefited
    person could have chosen to reduce the suffering further but for the increase
    of their profit. This is still exploitation, even if the sufferer was made aware
    of all the circumstances up front.<p>- I said that the people&#x27;s <i>psyches</i>
    were damaged; nothing about &quot;psychic damage&quot;. One example of damage
    to the psyche is being asked to classify images of CSAM for eight hours a day.
    Regardless of the pay, this causes damage to people with even the barest shred
    of empathy.
