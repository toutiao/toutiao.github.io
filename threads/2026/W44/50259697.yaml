  author: gavinray
  text: Because those tests are the only ones that prove the connector is working
    as intended<p>Our connectors receive a generic query IR from a Datafusion-based
    engine<p>Each connector is then responsible for faithfully translating the query
    IR into the semantically equivalent query for the underlying data source<p>For
    a SQL DB this would be a SQL query, for MongoDB a JSON predicate query, for csv&#x2F;json
    files it would be an in-memory predicate engine, etc<p>Running the generated query
    against the target data source and asserting that this doesn&#x27;t throw an error
    and that the records returned are both correct and in the right order is the true
    test
  score: 0
