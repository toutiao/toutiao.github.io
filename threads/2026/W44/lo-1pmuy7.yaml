  text: |-
    From memory (recollection of a university lecture about 18 years ago), the usual trick for picking hash functions for perfect hashing is:

    pick a function at random from some family of hash functions
    you need that function's outputs to be distinct for all of the elements you care about
    which isn't a very strict property
    so when the randomly chosen function's output domain is big enough, the probability of that property being true is reasonably large
    and you can brute force choosing a function that works in an acceptable small number of guesses

    In this case the family of hash functions they picked from was functions of the form f(x)=x*c >> k for some constant c and k.
    edit to add: my vague recollection is that the probability of a perfectly-random function being good enough is something like 50% when the function output domain has twice as many bits as the (log2 of the size of) thr list of items you want to match.
