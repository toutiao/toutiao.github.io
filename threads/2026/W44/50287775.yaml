    Ran across a comment a while ago on some &quot;IPv6 math&quot;:<p><pre><code>    On the surface of the Earth [land+water], there are 8.4 IPv4 addresses per km². Not counting the oceans, that would be 28 IPv4 addresses per km² land.

        IPv6 gives 10¹⁷ addresses per mm² (yes, square millimetre).

        In terms of volume, 10⁸ IPv6 addresses per mm³ throughout the Earth.
    </code></pre>
    * Via: <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=28326806#unv_28331245">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=28326806#unv_28331245</a><p>A second way of thinking about it:<p>* Stars in the Milky Way: 400 Billion<p>* Galaxies in the universe: 2 Trillion<p>* So (4x10¹¹)x(2x10¹²) = 8x10²³ stars in the universe.<p>* Size of IPv6 address space: 3.4x10³⁸<p>* Find the ratio between addresses and stars: 3.4x10³⁸ &#x2F; 8x10²³<p>IPv6 offers about 430 trillion times more addresses than estimated stars in the universe. From Tom Coffee&#x27;s presentation &quot;An Enterprise IPv6 Address Planning Case-Study&quot;:<p>* <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=7Tnh4upTOC4" rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=7Tnh4upTOC4</a>
