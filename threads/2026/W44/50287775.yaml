  text: "&gt; US customary is not &quot;thousands&quot; of years<p>You misunderstood
    me.  It&#x27;s based on measurements that people have been using for thousands
    of years.  The Romans had feet and miles, for example - not exactly the same lengths,
    but for the same purposes.  The Japanese shaku is almost exactly the same as a
    US foot.  A Japanese Shō is about half a gallon.  A Chinese jīn is just slightly
    larger than a pound.  There&#x27;s a reason for this.<p>&gt; there was also sorts
    of inconsistencies<p>I never claimed otherwise.  But do notice that the survey
    foot and standard foot weren&#x27;t used for the same purposes, and the difference
    between them wasn&#x27;t likely to confuse anyone except maybe people new to the
    field.<p>&gt; Here&#x27;s another one: which weighs more, a pound of feathers
    or a pound of gold?<p>Yep, Troy weights.  And no one&#x27;s sure where the Troy
    system came from.  The main reason for its use is because of international trade.
    \ Also not something regular people (i.e. people that didn&#x27;t work directly
    with precious metals) would have had contact with.<p>&gt; Millimeters<p>Hah!  Yeah
    right.  Look at all the various non-metric systems that have existed throughout
    history.  Did any of <i>them</i> use something like millimeters to measure wooden
    planks?  Why not?<p>&gt; As evidence for this Australia&#x2F;NZ&#x2F;EU do everything
    in millimetres in construction.<p>They do it because the metric system is mandated
    there and it doesn&#x27;t give you reasonably sized unit for that scale of work.<p>Try
    this: go to a home center (or whatever it&#x27;s called there - the place you
    buy building supplies) and measure some drywall.  Do the measurements you made
    agree to the advertised ones within half a millimeter?  Compare the dimensions
    of drywall sheets from different pallets and manufacturers.  Do their dimensions
    agree to within half a millimeter?  If not, that&#x27;s a sure sign you&#x27;re
    using units poorly adapted for purpose."
