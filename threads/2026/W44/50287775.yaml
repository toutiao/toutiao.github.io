  author: mahboi
  text: IPv4 is inherently more user-friendly. IPv6 was designed for a world, in the
    1990s, where it was expected that every host wanted to be routable. SLAAC etc
    were all natural consequences of that. For today&#x27;s use cases, the v4 NAT
    public&#x2F;private thing actually turned out to be nicer than v6 global routing.
    There&#x27;s still confusion today about whether devices are exposed on a v6 network
    because the spec itself says default-deny firewall is optional. They had to recently
    add privacy addresses. The other kinds of v6 addrs like link-local and ULA add
    more complexity. V4 addresses are easy to remember, which v6 advocates keep saying
    doesn&#x27;t matter but it does. There are all these little network management
    details that are messier in v6, as you will find on online help forums for v6
    advocates who you cannot write off as just being too used to v4.<p>The v6 spec
    also has all these alternative ways to use it more like v4, commonly brought up
    as a cop-out against the above criticisms, but that&#x27;s actually part of the
    problem. The spec is too big, and things only implement a subset of it, see Android
    not supporting DHCP6. Realistically you&#x27;ll have 99% of people using anything
    like this the default way, and the spec does define SLAAC, no-NAT, etc as default.<p>But
    you could say v6 is better just cause it has more addresses, and that&#x27;s fair.<p>...Imperial
    is better than metric because it lines up with everyday usage better unless you&#x27;re
    specifically concerned about the physical properties of water. Especially ˚F vs
    ˚C. Not a big deal though.
  score: 0
