  text: '&gt; <i>Yes it&#x27;s 3A. They didn&#x27;t need to make the new protocol
    have separate state from the old one.</i><p>Except there will be a period of time
    when many &#x27;network elements&#x27; (routers, firewalls, servers (web, SMTP,
    DNS, <i>etc</i>), clients) will not be updated for the new protocol so you may
    <i>also</i> need 3B.<p>And this will be true for any IPng, and not just the one
    that just happened to be chosen to be for &quot;IPv6&quot; (which was SIPP, over
    CATNIP and TUBA; see RFC 1752).<p>&gt; <i>Let me keep my old address on the new
    protocol.</i><p>You can&#x2F;could. You can encourage people who have addresses
    in the older protocol to use the new one with &quot;free&quot; &quot;automatic&quot;
    address assignments in the new one to encourage translation and tunnelling:<p>&gt;
    <i>For any 32-bit global IPv4 address that is assigned to a host, a 48-bit 6to4
    IPv6 prefix can be constructed for use by that host (and if applicable the network
    behind it) by appending the IPv4 address to 2002::&#x2F;16.</i><p>&gt; <i>For
    example, the global IPv4 address 192.0.2.4 has the corresponding 6to4 prefix 2002:c000:0204::&#x2F;48.
