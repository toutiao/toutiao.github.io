    no &quot;just&quot; extending the address length:<p><pre><code>      So it&#x27;s
    a matter of mathematical and physical fact that to expand\n      the address size,
    you must change the protocol, and that means \n      [three] things immediately:\n\n
    \           You have to change the version number.\n\n            You have to
    add new code to handle the new version.\n\n      […]\n\n            You need a
    coexistence technique so that updated systems, \n            with the new protocol,
    can connect to old systems that know \n            nothing of the new protocol.\n\n
    \     Two minutes of thought show that this third requirement has only \n      two
    solutions:\n\n            (3A) Dual stack, in which the new machines speak both
    \n                 the old (IPv4) and new (IPng) protocol.\n\n            (3B)
    Translation, in which something translates addresses\n                 between
    the old and new protocols.\n</code></pre>\n* <a href=\"https:&#x2F;&#x2F;github.com&#x2F;becarpenter&#x2F;misc&#x2F;blob&#x2F;main&#x2F;why6why.md\"
    rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;becarpenter&#x2F;misc&#x2F;blob&#x2F;main&#x2F;why6why.md</a><p>*
    <a href=\"https:&#x2F;&#x2F;datatracker.ietf.org&#x2F;doc&#x2F;html&#x2F;rfc1671\"
    rel=\"nofollow\">https:&#x2F;&#x2F;datatracker.ietf.org&#x2F;doc&#x2F;html&#x2F;rfc1671</a><p>&gt;
    <i>Keeps all the nice parts of IPv4, doesn’t require everyone to switch to an
    entirely new system, backwards compatible with existing hardware&#x2F;software.
    Problem solved.</i><p>You have to ship new code to every &#x27;network element&#x27;
    to support your &quot;IPv4+&quot; plan. <i>Just like with IPv6.</i><p>You <i>also</i>
    have to update DNS to create new resource record types (&quot;A&quot; is hard-coded
    to 32-bits) to support the new longer addresses, and have all user-land code start
    asking for, using, and understanding the new record replies. <i>Just like with
    IPv6.</i> (A lot of legacy code did not have room in data structures for multiple
    reply types: sure you&#x27;d get the &quot;A&quot; but unless you updated the
    code to get the &quot;A+&quot; address (for &quot;IPv4+&quot; addresses) you could
    never get to the longer with address… <i>just like IPv6</i> needed code updates
    to recognize AAAA, otherwise you were A-only.)<p>You need to update socket APIs
    to hold new data structures for longer addresses so your app can tell the kernel
    to send packets to the new addresses. <i>Just like with IPv6.</i> In any &#x27;address
    extension&#x27; plan the legacy code cannot use the new address space; you have
    to:<p>* update the IP stack (like with IPv6)<p>* tell applications about new DNS
    records (like IPv6)<p>* set up translation layers for legacy-only code that cannot
    be update to reach IPv4+-only destination (like IPv6 with DNS64&#x2F;NAT64, CLAT,
    etc)<p>You&#x27;re updating the exact same code paths in both the &quot;IPv4+&quot;
    and IPv6 scenarios: dual-stack, DNS, socket address structures, dealing with legacy-only
    code that is never touched to deal with the larger address space.<p>&quot;Just
    adding more bits&quot; means updating a whole bunch of code (routers, firewalls,
    DNS, APIs, userland, etc) to handle the new data structures. There is no &quot;just&quot;:
    it&#x27;s the same work for IPv6 as with any other idea."
