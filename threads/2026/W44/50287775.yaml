  text: That would still constitute an entirely new system, just one that looks very
    like the previous one. So much code and other infrastructure (routing tables in
    hardware etc.) relies on IPv4 addresses being 32-bits not 64 and that would all
    need to change, complete with extra new stuff being added for that translation
