  author: spauldo
  text: 'I&#x27;m not the person you were replying to, but I can answer this one.  And
    yeah, I can see all the metric fanboys (a very small subset of metric <i>users,</i>
    mind you) hovering over that downvote button, but I don&#x27;t get paid in Internet
    points so here goes:<p>The nice thing about imperial (as well as the customary
    system used in the US) is that it&#x27;s based on measurements that people have
    found useful over thousands of years.  They&#x27;re human units, adapted to what
    people need to do with them, not the other way around.<p>It&#x27;s difficult to
    explain to metric folks because it&#x27;s really something you have to experience.  But
    here&#x27;s an example:<p>Reservoir volume in the US is measured in acre-inches.  An
    acre is a unit of area used for measuring property, usually farmland.  It&#x27;s
    a bit less than half of a hectare.  And of course an inch is 2.4cm.  Acre-inches
    sounds totally bizarre when you first hear about it.  But for the people that
    need to work with this value, it&#x27;s an extremely useful way to measure reservoirs
    and gives you an intuition that you just don&#x27;t get from cubic meters.<p>It&#x27;s
    true that you can&#x27;t just convert that to other units of volume without doing
    some math or looking up the conversion rate, but that rarely matters.  If you&#x27;re
    trying to figure out how fast the lake will rise or fall with a given inflow and
    outflow, you&#x27;re going to have to have some way to account for the fact that
    the lake is a) an irregular shape and b) takes up more area the higher the water
    gets.  You already need to know the area of the lake at any particular height
    to work out the evaporation rate anyway, so that&#x27;s a number you&#x27;re going
    to have.  The units are designed to make that calculation easier, which was really
    important back in the days when slide rules were the state of the art.<p>All the
    customary units are like this in one way or another.  They&#x27;re units designed
    for a particular domain, and when used in their domain they work very well and
    calculations can be done in your head.  They use fractions because that&#x27;s
    what people have historically used (seriously - my grandfather could work fractions
    in his head faster than I could type them into a calculator, and he made asphalt
    for a living.  Imagine what a carpenter could do.).<p>Think about it.  Imagine
    you were never taught a measurement system.  You find yourself needing to come
    up with a unit to make measurements for wooden planks you&#x27;re going to use
    to build a house.  Would <i>you</i> choose a unit as long as a meter?  Or one
    as short as a centimeter or even a decimeter?<p>Bonus challenge to the fine folks
    clicking that downvote button: give me a real practical reason to prefer Celsius
    to Fahrenheit, besides the fact that Celsius is part of the metric system.  No,
    the freezing and boiling points of water don&#x27;t cut it - I work with hydrocarbon
    fuels, I salt my driveway and patio, I don&#x27;t live at sea level, and quite
    honestly every American 8-year-old can spout off 32° and 212°.  There&#x27;s a
    Fahrenheit equivalent to Kelvin (Rankine) so the Kelvin to Celsius equivalence
    doesn&#x27;t count either.  My claim is that both scales are completely arbitrary,
    and only advantage one has over the other is that you&#x27;re used to one of them.  Go
    ahead, prove me wrong!'
