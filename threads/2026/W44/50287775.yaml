  text: '&gt; <i>The nice thing about imperial (as well as the customary system used
    in the US) is that it&#x27;s based on measurements that people have found useful
    over thousands of years. They&#x27;re human units, adapted to what people need
    to do with them, not the other way around.</i><p>US customary is not &quot;thousands&quot;
    of years; temperature (Fahrenheit) only came out in 1724 for example, and many
    other units were only standardize much more recently:<p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;History_of_measurement#History_of_units"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;History_of_measurement#History...</a><p>*
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;System_of_units_of_measurement#History"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;System_of_units_of_measurement...</a><p>Second,
    even <i>with-in the system itself</i> there was also sorts of inconsistencies.
    Until just a few years ago there were <i>two</i> &quot;foot&quot; units; one was
    recently retired:<p>* <a href="https:&#x2F;&#x2F;www.nist.gov&#x2F;pml&#x2F;us-surveyfoot"
    rel="nofollow">https:&#x2F;&#x2F;www.nist.gov&#x2F;pml&#x2F;us-surveyfoot</a><p>Here&#x27;s
    another one: which weighs more, a pound of feathers or a pound of gold? A pound
    of feathers. Because feathers use one &#x27;pound-system&#x27; [1] and is 453g,
    while gold uses another pound-system [2] and is 373g. But of course an &quot;ounce&quot;
    of gold (31g) is more than an &quot;ounce&quot; of feathers (28g), because Troy
    is 1&#x2F;12 of pound but Avoirdupois is 1&#x2F;16. In addition to the above &quot;ounces&quot;
    there is also &quot;fluid ounces&quot;. And let&#x27;s not forget about the third
    system [3], which got replaced by… the metric system in 1971.[4]<p>[1] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Avoirdupois"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Avoirdupois</a><p>[2]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Troy_weight" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Troy_weight</a><p>[3]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Apothecaries&#x27;_system"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Apothecaries&#x27;_system</a><p>[4]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;United_States_Pharmacopeia"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;United_States_Pharmacopeia</a><p>Also:<p>*
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pound_(mass)" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pound_(mass)</a><p>*
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pound_(force)" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Pound_(force)</a><p>&gt;
    <i>Think about it. Imagine you were never taught a measurement system. You find
    yourself needing to come up with a unit to make measurements for wooden planks
    you&#x27;re going to use to build a house. Would you choose a unit as long as
    a meter? Or one as short as a centimeter or even a decimeter?</i><p>Millimeters.
    That single unit gets you down to very small scales (finer than 1&#x2F;16&quot;)
    and to large lengths: four significant digits (9999mm) gets you to the equivalent
    of &gt;32&#x27; (~11yd).<p>* <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20200516223819&#x2F;https:&#x2F;&#x2F;themetricmaven.com&#x2F;naughtins-laws&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20200516223819&#x2F;https:&#x2F;&#x2F;themetric...</a><p>As
    evidence for this Australia&#x2F;NZ&#x2F;EU do everything in millimetres in construction.'
