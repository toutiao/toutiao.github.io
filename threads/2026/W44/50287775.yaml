  text: In theory IPv6 solves the problem by putting all of this under a single prefix
    (fc00::&#x2F;8) and asking nicely that implementation&#x2F;admins add 40 random
    bits to form their prefix. Which is plenty to prevent (almost all) eventual conflicts.<p>The
    thing is, asking nicely doesn&#x27;t always work. Sure, automated tools like docker&#x2F;incus&#x2F;wireguard&#x2F;tailscale
    will respect it. But admins who don&#x27;t want to be stuck typing long addresses?
    Not so much. I&#x27;ve lost count of how often I encounter a network admin that
    manually set their prefix to some fcXX::, when it&#x27;s not outright fc00::.<p>Of
    course you can (and should) blame this on admins and not on IPv6, but then the
    same could be said of IPv4 where adding entropy to 10.X.X.0 is the usual recommended
    way of doing things.
