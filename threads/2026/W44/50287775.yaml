  author: ndriscoll
  text: 'What problem does 128 bits cause? Just that you don&#x27;t like :: for a
    run of 0s? Do you need to care about ipv6 addresses in your work? Because I can
    tell you that when I&#x27;m trying to design simple, efficient routing and firewall
    rules (with e.g. 100s of thousands of endpoints across different datacenters on
    different continents), it&#x27;s really nice to be able to subnet things the way
    I&#x27;d like instead of the way I must to squeeze things into the space I have,
    and not have to worry about backing myself into a corner later because I gave
    the wrong number of bits to various dimensions. And worst case, if you somehow
    got it wrong, just give yourself an entire &#x2F;64 or more to try again, with
    it being compatible with what you did (no need to do a phased migration that requires
    reclamation as you go along).<p>Like I only tangentially interact with this stuff,
    but I can&#x27;t imagine how a network operator wouldn&#x27;t prefer we live in
    an all ipv6 world.'
