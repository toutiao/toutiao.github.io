    I think this is the core point behind the Douglas Adams joke that the ultimate answer is "42".
    It may be an attribute of the answer, but as an answer itself, it's not much cop.
    Make things smaller. Make things simpler. If you find problems, and you will, try to find a way to make it simpler until the problem is obvious and can be eliminated.
    I do feel that rather than using bots to write even more new software, we should set our goal as making things smaller, simpler, cleaner. Stop focussing on making it faster, and focus on making it simpler.
    This is not my personal observation but I can't remember where I saw it: someone one contrasted European versus American software development practices.
    In Europe, before software got homogenised into pap, companies needing an OS or apps for their product just wrote them. The result was dozens of little OSes, from RISC OS to EPOC to the totally incompatible EPOC32 to QDOS (and Minerva and SMSQ/E), from Amstrad's unique OSes for the later PCWs (a range which started out as the last ever new CP/M machines).
    America? Standardise. DOS for everyone. Then the failed try at OS/2 for everyone. Then Windows for everyone, and if you object, well, Unix for everyone. Don't like this Unix? We have other Unixes! We got both kinds of OS, honey, both Linux and BSD!
    Everything written in C, or some flavour of "C with knobs on." Delphi? Heresy! Erase it from the record! Smalltalk enabled GUIs? Rewrite them in C! We need OOPS? Bolt OOPS onto C! We need simple interpreted scripting languages? Write them in C using C idioms and C libraries! Rewrite Windows using C and Unix tools!
    When I started professionally touching computers for a living, every different box ran a different OS implemented in a different language, talked over a different network protocol, had its own disk formats with its own file formats, its own apps.
    And it worked.
    I started work at the end of 1988 and before the beginning of the 1990s, I'd used...
    CP/M, DOS, Concurrent CP/M, Concurrent DOS, Novell Netware 2 & the almost totally different Netware 3, 3Com 3+Share, 3Com 3+Open, Banyan VINES, Xenix, Alpha Micro AMOS, DEC RSTS/E, OS/400 on AS/400, Solaris, AIX, OS/2 1.x, Windows 2 (very very different from later), Acorn MOS, Acorn RISC OS, Atari TOS with DR GEM, AmigaOS, Psion SIBO, and more.
    Lots of different little simple OSes for simple jobs is not a bad thing, even if now it is anathema. Gigantic fractally-complex OSes that run on everything and can do everything are not better, and LLM powered exploit discovery is starting to prove that.
    Different job? Different OS.
    So long as they can talk to each other, it's all fine. A few standard protocols (and we have those now: TCP/IP, SMB, FAT, etc.) and "nation shall speak unto nation".
    Those multi-gig OSes that cost trillions to make and to maintain are about to become a liability.
