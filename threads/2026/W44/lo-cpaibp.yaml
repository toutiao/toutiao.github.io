    Yes, that's true, it is. OTOH there is at least one recently reborn OS project that's taken a direction on this: OpenVMS.
    I learned VAX/VMS at university, and used it a lot in my first senior role in London. I remain fond of it now.
    OpenVMS 9 is the modern revived x86-64 version, and it targets hypervisors only. There is one hardware model supported and that's it: the HPE Proliant DL380 Gen10. Otherwise it only talks to virtual hardware, and I think they support all the major x86-64 hypervisors.
    That's one tactic.
    The other is what's happening in the Arm space. There are loads of cheap little Arm SBCs now and quite a lot of them have "pi" or "pie" in the name. But the market was opened up by the Raspberry Pi and one thing that few people comparing Arm SBCs realise is the breadth of OS support for the RasPi. Most SBCs support Linux and nothing else, and in many cases, you get 1 OS release from the vendor and then there's a new model and they move on, which is the primary raison d'être of Armbian.
    But the RasPi supports loads. I am counting Linux as 1. Linux is Linux. All distros use the same kernel, even Android.
    RasPi also has OpenBSD, NetBSD, and FreeBSD. And, getting progressively less Unix-like, Plan 9, and Inferno, and RISC OS, and AROS. I think there's an unofficial Haiku.
    7 entirely different OSes all on one SBC. I think it supports more OSes than anything else outside PC-compatible x86.
    I am working on an article right now about several 3rd party replacement kernels for RISC OS on the Pi, some handwritten, some LLM-generated, all aiming to deliver 64-bit support.
    Leave the chaotic world of the PC behind and life gets a lot easier. On x86 PCs, virtualise it, and life gets a lot easier.
