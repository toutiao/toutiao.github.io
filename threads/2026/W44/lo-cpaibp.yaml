  content: "# Signs of Triviality\n_Opinions, mostly my own, on the importance of
    being and other things._\n* * *\n\n* * *\n\n## This is not sustainable\n\n| \n\nWhat
    a week, huh? High fives all around—October is \"Cybersecurity Awareness Month\",
    and I think we've all done a stellar job. If both the [New York Times](https://www.nytimes.com/2026/10/22/world/php-vulnerability-websites-cybersecurity-ai.html)
    and [NPR](https://www.npr.org/2026/10/23/g-s1-149503/hacking-php-flaws) report
    on one of the at least four or five [concurrent fires](https://istheinternetonfire.com/)
    I'm fighting, then I think we can say that yeah, people are aware of cybersecurity.
    Mission accomplished, so... could we maybe turn it down a bit?\n\nThe current
    situation is not sustainable: 0-days are dropping left and right, pre-notifications
    and embargoes are [broken for marketing purposes](https://www.akamai.com/blog/security-research/tlp-is-not-a-suggestion),
    AI companies compete first on who commits the most crimes and then pretend to
    sell you protection in the form of a DoS on the Open Source community. \"_Nice
    project you got there. Be a shame if somebody dropped an 0-day on it.\"_\n\nCompanies
    are not staffed for this, and no matter what the industry wants to tell you, you
    can't AI your way out of this. Vulnerability discovery has fundamentally changed,
    disclosure processes are effectively broken, and patch management has been a losing
    proposition for years now. Severe vulnerabilities are identified and disclosed
    at a pace that defenders are unable to keep up with.\n\nThis is because it still
    takes significant resources to accurately assess the feasibility of a given vulnerability
    within your environment; it takes time to discover your attack surface relevant
    to the given attack vector, and it takes even more time to deploy a fix. As I've
    [said before](everybodys-lost-their-minds.html#sisyphus), development of the fix
    is not the bottleneck. Let me illustrate with examples from the last couple of
    days:\n\n### \"[PwnEscape](https://pwn.ai/blog/pwnescape)\" (CVE-2026-99999)\n\nInitially
    disclosed as a \"KVM escape\", this vulnerability _also_ applies to other virtualization
    as well as containers, although that angle hasn't really gotten much attention.
    You now need to assess which possible mitigations might be in place across your
    fleet of systems, then determine whether you can [livepatch](https://www.kernel.org/doc/html/latest/livepatch/livepatch.html)
    your kernels with the custom patches you pull from upstream or if you want to
    wait for your upstream OS provider to deliver a new kernel and then all you have
    to do is reboot a few thousand systems.\n\nHow does AI help you here? Maybe you
    spend a few thousand dollars on tokens to use the most advanced cyber cyber models
    to develop your own exploit, but in the end, that doesn't really tell you anything
    you didn't already know, and your defensive position and tasks at hand remain
    the same.\n\n### [eMudhra compromise](https://emudhra.we-have-a-problem.com/)\n\nThis
    one's fun, isn't it? Sure, browsers were all set quickly, but guess what, there's
    a few other things that might use TLS in your environment. Like... _everything_.
    So again, having the fix is not the bottleneck. Waiting for upstream packages
    to release an update only blocks you if you actually know that you need to pull
    in that update.\n\nOh, you have a detailed package inventory or, dare I say it,
    SBOMs? That's really nice. Do show me where that lists the various [vendored or
    hard-coded CA trust bundles](https://github.com/NixOS/nixpkgs/issues/576475).
    Yeah, I didn't think so.\n\n(At least this incident was not AI generated, detected,
    or triggered. Just one of your wholesome, classical, [a-human-going-\"huh\"](https://bugzilla.mozilla.org/show_bug.cgi?id=2083449#c2)
    kind of discoveries. It's almost reassuring that we still get these, too.)\n\n###
    \"[php2shell](https://www.php.net/archive/2026.php#2026-10-21-5)\" (CVE-2026-109618,
    CVE-2026-109619)\n\nThe PHP vulnerability that supposedly affects \"over 70% of
    websites\" (a widely quoted, but never attributed statistic) was disclosed under
    embargo to several organizations. If you were part of this inner circle, then
    this should have reduced your panic-mode somewhat, buying you at least _some_
    time to deploy protections for your customers and do the tedious work of sifting
    through your inventory and, again, identify the attack surface, affected systems,
    possible local mitigations, etc. etc. The usual.\n\nUnless the embargo is broken.
    Then you get to scramble again. And you need to keep up to date with all the rapidly
    published (and increasingly verbosely AI polluted) breathless blog posts driven
    by cyber security vendors' marketing teams eager to beat each other as the first
    to detect, first to exploit, first to brag, all of which adds to the distraction.\n\nAnd
    of course you _still_ need to do the actual work of determining the accuracy of
    the various exploits floating around the internet, some put together by people
    with a clue and many, many slopped together by those lacking a full understanding
    of the bug. (More on that below.)\n\n### The [brotli RCE](https://github.com/advisories/GHSA-9v8h-qqgm-4m35)
    (CVE-2026-111497)\n\nAnd then, by the time Thursday rolls around, people start
    to see a [NodeJS security advisory](https://nodejs.org/en/blog/vulnerability/october-2026-security-releases),
    which includes as the third \"high\" severity vulnerability an issue with the
    \"Node.js Brotli decoder\". Alright, attack surface enumeration, software inventory
    check, start to deploy updated packages,... the usual.\n\nExcept, of course, once
    you take a closer look, it begins to [dawn on you](https://www.openwall.com/lists/oss-security/2026/10/23/25)
    that this goes well beyond just Node.js. And so once again, having the [upstream
    fix](https://github.com/advisories/GHSA-9v8h-qqgm-4m35) available is absolutely
    not your bottleneck, because you still need to find the plethora of frankenstances
    of brotli across _all_ of your stacks first.\n\nOf course at that point in time
    OpenAI [starts to go](https://twitterviewer.net/OpenAI/status/2113766354386084338)
    \"Us! It was us! We found it!\" even though the issue [was fixed back in February](https://github.com/google/brotli/commit/0ed4268a4401abcb4472096340477cf4af7d1a2b)
    and Mozilla [noted the critical security impact](https://bugzilla.mozilla.org/show_bug.cgi?id=2029458)
    as far back as April. It seems there's no vulnerability, no compromise, no cyber
    crime AI companies are not willing to claim as their credit.\n\n### (More) Winter
    is Coming\n\nAll of this was going on over the course of one week, and doesn't
    even account for the previous set of weekly Linux local privilege escalation vulnerabilities.
    And no doubt there will be more such disclosures—many more.\n\nAI companies are
    incentivized to continue the onslaught, with the most benevolent interpretation
    of mass disclosures of findings being a canonical example of \"[verschlimmbessern](https://www.studygermanonline.com/blog/the-verschlimmbessern-in-german)\",
    with less friendly interpretations observing that it's profitable for a company
    to create the disease for which they're selling you to treatment (and never the
    cure). They've got a new toy, it's a hammer, and by golly they're gonna swing
    it.\n\nMillions of dollars have been spent on identifying vulnerabilities using
    so-called \"frontier AI models\", and we know that adversaries are feeding, e.g.,
    the Linux kernel commit messages into their models to analyze them for exploitable
    vulnerabilities on the fly. Today, vulnerabilities are found independently by
    multiple parties on a regular basis, so you already have to assume that a disclosure
    embargo only contains the _massive_ exploitation by opportunistic adversaries
    at best.\n\nAt the same time, I'm observing a worrying trend on the defensive
    side of cyber security, which mirrors the same de-skilling trend across the industry:
    AI generated vulnerability reports are often much, much too verbose to be digested
    easily by human r"
