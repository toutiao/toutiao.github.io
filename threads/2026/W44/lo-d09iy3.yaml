    I've experimented with simple designs in this space but not very recently. Anyway, regarding the theorem proving side of things that you lose because of...
    "Although this type system would not be suitable for a theorem proving language, it does not rule out type safety or even useful proofs. It has two practical consequences:

    Functions used in type-level computations may diverge, so typechecking is not decidable.
    Functions don’t discharge universally quantified claims, so the compiler must evaluate all applications that produce proofs before relying on their results."

    "Not suitable" seems to assume the Curry-Howard approach for theorem proving, as in Rocq, Agda and Lean. But an alternative is some version of the HOL = STLC + LCF recipe. This should allow you to use type-level computation for proof automation. To be able to prove things about the code itself (so you can reflect it back to the type checker as trusted facts), you need a sound translation from code to logic.
