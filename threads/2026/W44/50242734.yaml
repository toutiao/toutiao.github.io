    When [Hulk Hogan](https://english.elpais.com/people/2025-07-24/wrestling-legend-hulk-hogan-dies-at-71.html "https://english.elpais.com/people/2025-07-24/wrestling-legend-hulk-hogan-dies-at-71.html") sued the tabloid _Gawker_ in 2016 for publishing a sexual video without his consent, no one gave him a chance of winning. But Hogan won the case and was awarded $140 million in damages, which led to the online outlet’s demise. Peter Thiel, one of Silicon Valley’s most shadowy figures, tipped the legal battle: he secretly funded Hogan’s lawyers. He wanted revenge on _Gawker_ because it had ridiculed him for years and outed him as gay.

    After that legal victory Thiel, the founder of PayPal, believed the jury’s support for Hogan signaled a deep social shift. He foresaw, before most, the victory of a New York real estate developer with a reputation as a womanizer in that year’s election. At the time, Donald Trump was still an unlikely candidate. “Wow, he might win the election,” Thiel thought, he later told [_The Atlantic_](https://www.theatlantic.com/politics/archive/2023/11/peter-thiel-2024-election-politics-investing-life-views/675946/ "https://www.theatlantic.com/politics/archive/2023/11/peter-thiel-2024-election-politics-investing-life-views/675946/"). A few weeks after that he delivered a speech at the Republican National Convention that helped launch Trump’s political career.

    A decade later, Peter Thiel, 58, is the most influential figure in Silicon Valley since Steve Jobs emerged in the late 1970s. A libertarian, anti-establishment [promoter of technoconservatism](https://english.elpais.com/technology/2026-03-15/what-can-the-left-do-against-technocapitalism.html "https://english.elpais.com/technology/2026-03-15/what-can-the-left-do-against-technocapitalism.html"), he is behind the rise of political figures such as Vice President J. D. Vance, who worked for him at Mithril Capital, one of his investment funds, and Ted Cruz, the senior Republican senator from Texas. He has inspired the United States’ technological nationalism and opposes international organizations born after World War II, such as the United Nations and NATO. In late September he took part in a lecture series in Nashville in which he warned about the “Antichrist” and the [dangers of regulating artificial intelligence](https://english.elpais.com/technology/2023-12-05/the-eu-favors-self-regulation-in-new-ai-law.html "https://english.elpais.com/technology/2023-12-05/the-eu-favors-self-regulation-in-new-ai-law.html"). This is not the first time he has cloaked attacks on those who would regulate Big Tech in religious rhetoric. He did the same last year at similar conferences in San Francisco, Rome and Paris.

    “He is the father of a small but powerful sect that pursues these extremist, antidemocratic ideas in Silicon Valley,” says Gil Durán, a writer and journalist and author of _The Nerd Reich: Silicon Valley Fascism and the War on Democracy_, in an email interview. “For 30 years, he has preached against democracy and government, which he called ‘fundamentally evil,’ while investing [in companies that provide surveillance to the government](https://english.elpais.com/economy-and-business/2026-10-16/armies-healthcare-systems-and-intelligence-services-11-european-countries-already-have-multimillion-dollar-contracts-with-palantir.html "https://english.elpais.com/economy-and-business/2026-10-16/armies-healthcare-systems-and-intelligence-services-11-european-countries-already-have-multimillion-dollar-contracts-with-palantir.html").” He adds: “His hijacking of Christian rhetoric conceals Silicon Valley’s true religion, where many believe they are creating a god called AI that will grant eternal life, let them travel to the heavens in spacecraft and enjoy an endless, abundant paradise. Silicon Valley is reshaping Christianity in its own image.”

    ![](https://imagenes.elpais.com/resizer/v2/TWM2AU55FVAYRFSYPLQKYRJZSI.jpg?auth=0299ed41e01c40ebcff2837366f6a138d0cdeba374b698ac5b242f7e3563ee45&width=414)
    _Peter Thiel and Elon Musk in 2000, when both were working at PayPal.PAUL SAKUMA (AP / LAPRESSE)_

    His intellectual baggage alarms the left. [He opposes taxes](https://english.elpais.com/economy-and-business/2026-10-13/more-than-70-progressive-economists-form-alliance-to-promote-a-fairer-distribution-of-wealth.html "https://english.elpais.com/economy-and-business/2026-10-13/more-than-70-progressive-economists-form-alliance-to-promote-a-fairer-distribution-of-wealth.html"), has set up a corporate apparatus with residency in multiple countries to minimize his tax burden; rejects the woke movement, including climate change; loathes universities; and encourages start-up founders to flout regulatory limits.

    A few months ago, he traveled to Argentina, where he has bought a mansion. He has [forged close ties with Javier Milei’s government](https://english.elpais.com/economy-and-business/2026-04-23/tech-magnate-peter
