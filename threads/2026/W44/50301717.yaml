  author: atombender
  text: It&#x27;s not taking a photo. It&#x27;s computation, based on a lot of real
    data, with a lot of inference and synthetic data. The idea is that it&#x27;s broadly
    accurate but cannot capture fine detail.<p>The approach has been calibrated against
    known objects like NRAO 530, a quasar near Sgr A* that has some known properties,
    and it&#x27;s been used on both Sgr A* and M87. And the team has admitted there&#x27;s
    a lot of uncertainty about exactly how accurate it is.<p>Here [1] is a pretty
    good article about how it works.<p>There&#x27;s overwhelming scientific consensus
    that Sgr A* and M87* are black holes. It&#x27;s not really provable at this point,
    but I don&#x27;t think anyone doubts it.<p>[1] <a href="https:&#x2F;&#x2F;www.discovermagazine.com&#x2F;the-event-horizon-telescope-how-it-works-11140"
    rel="nofollow">https:&#x2F;&#x2F;www.discovermagazine.com&#x2F;the-event-horizon-telescope...</a>
