  author: Maxatar
  text: One significant difference in interpretation that layfolks do consider important
    is that it&#x27;s possible to exit from within the event horizon of a black hole
    in Newtonian gravity (without exceeding the speed of light) whereas in general
    relativity that is not possible.<p>In relativity the event horizon really is a
    point of no return, whereas in Newtonian physics it&#x27;s the point at which
    escape velocity is equal to the speed of light. The escape velocity on the surface
    of the Earth is 11 km&#x2F;s, but that doesn&#x27;t mean that I as a human can&#x27;t
    escape the surface of the Earth momentarily just by jumping and I certainly don&#x27;t
    jump 11 km&#x2F;s or even 1 km&#x2F;s for that matter.<p>Similarly in Newtonian
    gravity it would be possible for an object to enter the event horizon of a black
    hole, and then &quot;jump&quot; back out at a much lower speed than the speed
    of light and then get sucked back beyond the event horizon, and you can in principle
    do this over and over again so long as you had some sufficiently powerful source
    of thrust.<p>In general relativity this is in principle not possible.
  score: 0
