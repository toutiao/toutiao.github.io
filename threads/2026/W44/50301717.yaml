  author: raattgift
  text: 'The quanta article at the top is about BH shadows.<p>The black hole shadow
    for Schwarzschild and for Kerr are very different.  The latter, which we expect
    for spinning black holes, is asymmetric and distorted depending on the direction
    to the observer (maximal for an observer in the equatorial plane, minimal for
    an observer above a pole).<p>Most astrophysical black holes have a lot of spin,
    mostly because their progenitors (stars, and smaller black holes formed by stellar
    collapse) have lots of spin.  Infalling gas clouds tend to inspiral rather than
    fall straight in radially on one of the poles, and that also increases the BH&#x27;s
    spin as it grows.<p>So, no, the shadows of most astrophysical black holes will
    not look like Schwarzschild.<p>You need a quadrupole for gravitational radiation.  Blobs
    of gas and distant starlight generate a negligible quadrupole when they are near
    an isolated black hole.  You get significant gravitational radiation when there&#x27;s
    a quadrupole, which we can think of as a barbell: two heavy masses connected by
    an imaginary bar connecting them as they rotate around the barbell&#x27;s centre
    of mass.  (For extreme mass-ratios the centre of mass is inside one of the BHs,
    but for BHs of similar masses, it&#x27;s near the middle of the &quot;bar&quot;).  The
    gravitational radiation is because, if we think of the metric as reflecting a
    gravitational potential, that changes when the two items are eclipsing versus
    when they are spatially separated: you are attracted more strongly to the lined
    up configuration and will tend to fall more towards one or the other of the weights
    when they are not.  Schwarzchild BHs are not barbell-like, and so don&#x27;t emit
    gravitational waves.<p>There is so much noise around real black holes (even ones
    with a vanishingly small accretion structure; there&#x27;s lots of background
    objects in our sky!) that there is little hope of directly observing a horizon-crossing,
    even if the gravitational redshift didn&#x27;t lead to dimming etc.  However,
    we have seen bright flares that are good evidence for parts of things (stars,
    for example) falling in.<p>Infallers are not smeared across the horizon.  They
    are if anything asymptotically &quot;frozen&quot; in the distant observer&#x27;s
    view.  One could imagine a distant observer seeing a pile-up of objects, but the
    later ones will simply occlude the earlier infallers.<p>I dunno where you get
    smearing from.  Complementarity or holography?  That&#x27;s about where (for a
    particular mathematically-related pair of equally valid descriptions) information
    is encoded for outside observers to reconstruct the BH&#x27;s history, and not
    about a physical infaller&#x27;s apparent location.  (An infaller doesn&#x27;t
    experience any of this itself, and would tend to prefer a local description of
    its fate, but not for long).'
