  text: "I just did a print-preview of my website and noticed that all the links are
    busted. I don't like that.\nAre there any good solutions to this? Off the top
    of my head I can think of:\n1. Simply always have the full url showing next to
    the link. Ugly.\n2. Have the full url there in text, but hidden by css when not
    in print-mode. Messy, and might break on some viewers.\n3. Have a [1] footnote
    thingy next to every link and a list of links at the bottom of the page. Simple
    enough.\nActually, it's really simple and I've already added it to my homepage:\n@media
    print \r\n{\r\n  a[href]:after\r\n  {\r\n    content: \" [\" attr(href) \"] \";\r\n
    \ }\r\n}"
