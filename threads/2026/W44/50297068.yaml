  author: evolve-maz
  text: Python makes it very easy to do these experiments without changing cpython
    itself. For example, a lot of the cases for the &quot;not set&quot; Sentinel can
    be handled by making it MyClass | None. Treat None as &quot;not set&quot;. If
    you need a &quot;no-op&quot; then you can give MyClass a field or something which
    implies it does nothing. And then override the bool dunder method to make it return
    false if the no op field is set to true. If you really want, you can have a classmethod
    which returns a &quot;no op&quot; instance of MyClass so people can easily call
    your func with MyClass.no_operation() when you want no op, and null when its not
    actually set.<p>Sentinels just help you wrap that up nicely and for more general
    use cases, but theres value in stepping back and thinking about where the unset
    vs no op case matters.
