  author: aw1621107
  text: |-
    The idea is that optional values are either some value or no value, but sometimes the inner &quot;some value&quot; bit can itself be an optional value (in Rust this would be Option&lt;Option&lt;T&gt;&gt;, in C++ it&#x27;d be std::optional&lt;std::optional&lt;T&gt;&gt;, in Python it&#x27;d hypothetically be Option[Option[T]], etc.). Such a situation gives you three possible states:<p>- You have an inner value and the inner value is something non-null (an integer, a string, another optional, etc.)<p>- You have an inner value and the inner value is null<p>- You do not have an inner value<p>The problem, from what I understand, is that Option[T] in Python is equivalent to the union type T | None, and union types are flattened (e.g., (T | U) | V is equivalent to T | U | V) and duplicates are ignored (e.g., T | U | T is equivalent to T | U). As a result, Option[Option[T]] is equivalent to (T | None) | None, which is equivalent to T | None | None, which is finally equivalent to T | None, which means you lose the distinction between &quot;No inner value&quot; and &quot;Inner value is present but is None&quot;.<p>As a more concrete (albeit somewhat contrived) example, say there&#x27;s some API you can query for the owner of a particular document ID where the document ID may or may not refer to an actual document (e.g., maybe you got it from a cache and the document has since been deleted). One way to express this would be (using Rust syntax)<p><pre><code>    fn get_owner(id: DocumentId) -&gt; Option&lt;Option&lt;UserId&gt;&gt; { ... }
    </code></pre>
    So if you get None, the document does not exist; if you get Some(None), the document exists but it has no owner; and if you get Some(&lt;id&gt;) the document exists and it has an owner.<p>(This can probably be done better by creating new enums, but it&#x27;s an example so give me a bit of slack)<p>A naive port of this signature to Python would be<p><pre><code>    def get_owner(id: DocumentId) -&gt; Option[Option[UserId]]: pass
    </code></pre>
    But to type checkers this is equivalent to<p><pre><code>    def get_owner(id: DocumentId) -&gt; UserId | None: pass
    </code></pre>
    So now you&#x27;re in the pickle the OP describes: you can end up with a None, but you no longer knonw whether it means &quot;no document&quot; or &quot;no owner&quot;. The Python solution is to basically create a different name for either the outer None (e.g., MISSING as in the OP) or the inner one (e.g., NO_OWNER or the like).
