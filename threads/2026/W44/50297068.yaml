  author: aw1621107
  text: "&gt; It returns no owner if the document is deleted or just does not exist,
    which is accurate.<p>&quot;I don&#x27;t know&quot; is not the same as &quot;definitely
    no owner&quot;. You may handle the two answers the same for a particular scenario,
    but then again you may not.<p>Again, consider the case where get_owner is working
    on some kind of cache (in which case sure, the function name could stand to be
    improved). If the document is no longer in the cache it could be because it was
    actually deleted or because it was simply evicted to make room for other entries.
    In general you cannot assume that a missing cache entry is equivalent to the document
    existing and having no owner.<p>Or similarly (and also yet again), consider the
    case where get_owner is working on a versioned filesystem, in which case the outer
    optional could indicate that the (generational) document ID is out of date. In
    such a case treating &quot;I don&#x27;t know&quot; and &quot;no owner&quot; the
    same is incorrect because the owner could have been updated from &quot;no owner&quot;
    to something else (such a case would likely be more realistically handled by returning
    a Result&lt;Option&lt;UserId&gt;, SomeErrorKind&gt;, though, given the myriad
    other ways a file system handle can go stale)<p>&gt; Why do you need get_owner
    to tell you if the document exists or not?<p>Because sometimes there is no good
    alternative. Asking a cache whether it has an entry and then trying to get the
    entry value in a separate operation (particularly in a concurrent environment)
    is a classic setup for TOCTOU errors. You can say something similar for the versioned
    file system example.<p>&gt; If anything it should be an error if the document
    doesn’t exist because you’ve violated a precondition.<p>I mean, enabling that
    kind of handling is precisely the point of the outer optional?"
