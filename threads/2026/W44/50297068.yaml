  author: travisd
  text: "Yeah, this is basically what we do. It ends up a bit more ergonomic to not
    have explicit result types because union types are pretty easy in Python. For
    example, we have functions like<p><pre><code>    # courses.py\n    def create(...)
    -&gt; Course | ErrInvalid:\n</code></pre>\nand they get used like<p><pre><code>
    \   match courses.create(...):\n        case courses.Course() as course:\n            #
    We use `course` below.\n            pass\n        case courses.ErrInvalid() as
    err:\n            # Error conditions are usually translated into early returns\n
    \           raise fastapi.HTTPException(\n                status.HTTP_422_UNPROCESSABLE_ENTITY,
    err.message\n            )\n    \n    return APICourseCreateResponse(id=course.id,
    ...)\n</code></pre>\nIt has worked (for us at least) pretty well to reduce the
    number of unhandled errors that make their way into Sentry. The granularity of
    the error types depends on the need (e.g., sometimes we just have an `ErrInvalid`
    that returns a message which gets displayed to the user, but sometimes we&#x27;ll
    have ErrInvalidAddress or ErrInvalidTaxCode to be more specific for the context).<p>And
    yeah, without nodiscard, we try™ to only do this on functions that return values
    that the caller will definitely need to use. Also combined with exhaustiveness
    checks on switch statements by default."
