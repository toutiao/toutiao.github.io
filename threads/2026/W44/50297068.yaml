  text: I wouldn&#x27;t go as far as <i>evil</i> but they are bad for code quality
    because they obscure the behaviour of functions. You never know what exceptions
    can be thrown. Can a function even fail? Impossible to tell. (Don&#x27;t say &quot;documentation&quot;
