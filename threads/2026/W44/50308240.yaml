  author: TZubiri
  text: I do like the analogy that cowlevel makes with blockchains being P2P but regular
    centralized tech being built on top of that P2P layer. Similarly on top of the
    P2P internet, these intermediaries are building something less co-operative and
    more half-duplex.<p>I always found it interesting what the direction of the data
    has been in this dystopia, might not be signficantly interpretable (as in, &quot;capitalism
    mainly uses the internet to blast propaganda and ads&quot; instead of &quot;capitalism
    uses the internet to spy on the citizens&quot;), because the up&#x2F;downstream
    direction of data will probably be dominated by video, so the direction only tells
    us which way video is going, and it makes sense that corps want to send videos,
    but consumers are more apprehensive about sending huge volumes of theirs.<p>But
    in general, it does seem to be that as time goes by, the corporations seem to
    be less interested in receiving messages, as opposed to sending messages. Maybe
    a decade or two ago virality was this interesting organic phenomenon that emerged
    and was followed by the companies, nowadays it seems to be more of them controlling
    what is viral and what is not, preferring to distribute a unified message.<p>Interestingly
    a tax on consumer bandwidth would not deter peering and huge volumes of traffic
    on the backend, so I feel it would greatly deter edge caching, which relies on
    reducing traffic distance instead of end-user traffic. I&#x27;d assume that at
    least video would be a bit less top-heavy and more indie&#x2F;personal. That said,
    that&#x27;s just video, the rest of the media forms will probably be unaffected
    by such a tax, 5 cents per GB is only relevant to video.
