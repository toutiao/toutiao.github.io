  author: ButlerianJihad
  text: Historically, P2P networks have needed enforcement of share-and-share-alike
    if they wanted people to contribute as much as they downloaded. There are plenty
    of derogatory names for people who only download and never contribute.<p>But obviously,
    this is the reality of a consumer Internet. We all want to download and install
    software, and we want to consume media, watch Netflix&#x2F;YouTube, and generally
    read web pages rather than write them, or produce videos or upload massive amounts
    of content. It&#x27;s typically been beyond our resources, as consumers, to produce
    any appreciable amount of uploads that are worth contributing.<p>However, and
    this chills me to the bone to think about it, but now AIs have democratized the
    production of content, and so anyone who can afford a few tokens can absolutely
    generate mounds of spam, whether it&#x27;s walls-of-text or fake music or hours
    of video content that they didn&#x27;t need to write, produce, or edit. Hollywood
    can produce mass amounts of crap every year, but salaries are still paid and audiences
    still pay, in order to say how much they hated every minute.<p>So if you think
    about it, the commercial consumer Internet may be at a precipice where, all of
    a sudden, everyone begins contributing beyond their means, and it&#x27;s all slop
    that needs to be gated and throttled and rate-limited. Furthermore, it won&#x27;t
    be monetizable or copyrightable; people will just fill up social media storage
    with streams of consciousness where nobody cares. Nobody would miss it if it were
    deleted or shadowbanned.<p>The DOCSIS is a good start; I mean I&#x27;m behind
    100Mbps&#x2F;12Mbps nominally, so I should only be able to contribute 1&#x2F;10th
    of what I&#x27;m consuming, currently. But do we really want a truly P2P Internet,
    where everyone is just shoveling slop at everyone else? Really?
