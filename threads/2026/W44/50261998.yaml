  author: ashkankiani
  text: Thank you for your work on this. When I was working on neovim core and started
    dealing more and more with the edge cases of libvterm and terminal emulation in
    general, I had the same thought &quot;we should just have a gold standard library
    for this.&quot; But that was 6&#x2F;7 years ago (2019) and a lot of stuff happened
    in that interim unrelated to engineering that demotivated me from pursuing it.<p>Periodically,
    I would run into TUI issues and think &quot;I should just finally do it,&quot;
    especially around wanting to replace tmux in general. But I knew from experience
    the long tail of annoying issues for terminals that it&#x27;s more time consuming
    than it appears, and so I again never bothered.<p>Thanks for the good work to
    raise all boats :)<p>I tend to move away from terminal emulation towards GUI when
    I can (and using custom remote protocols somewhat inspired by arcan), but TUI
    is still useful for a while. I actually had a need for a good terminal emulation
    library for the fallback TUI&#x2F;pty attachment for non-gui programs for my supervisor,
    so I&#x27;ll try out libghostty.
