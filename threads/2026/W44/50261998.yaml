  content: "- [Ghostty Docs](/docs)\n- Install\n- [Release Notes](/docs/install/release-notes)\n-
    [1.4.0](/docs/install/release-notes/1-4-0)\n\n# Ghostty 1.4.0\n\nRelease notes
    for Ghostty 1.4.0, released on October 27, 2026.\n\nGhostty 1.4.0 is a major release
    that includes large performance and memory improvements, a 100% complete Kitty
    graphics implementation including animation and relative placements (the first
    non-Kitty terminal to do so), SSH integration improvements, and hundreds more
    improvements and fixes across all platforms.\n\nThis release features **7 months
    of work** with changes from **172 contributors** over **2,889 commits**. Thank
    you to all the contributors, maintainers, community moderators, translators, packagers,
    and users who each helped make this release possible.\n\nThese release notes are
    painstakingly and lovingly hand-crafted by human Ghostty maintainers, including
    the full changelog. They take a combined 16+ hours to write, so please enjoy.
    \U0001F970\n\n[\n\nGhostty is non-profit! Please support development.Almost all
    donations go directly to paying contributors. Learn more about how you can help.\nLearn
    more →](/docs/sponsor)\n\n## Security\n\n- [GHSA-4hwh-wx3w-3fqg](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-4hwh-wx3w-3fqg).
    Paste protection didn't treat carriage returns as line endings, so a paste could
    run a command without confirmation in programs that don't use bracketed paste.
    This requires user interaction (copy-paste) to trigger.\n- [GHSA-mhff-mv4q-fp63](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-mhff-mv4q-fp63).
    Malicious Kitty graphics commands could crash or hang Ghostty, force huge allocations,
    or in limited cases read or delete files outside the allowed temporary directories.
    This only requires displaying malicious output.\n- [GHSA-hcr9-7hcr-mjm8](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-hcr9-7hcr-mjm8).
    Malicious terminal output could crash Ghostty, closing every window, via tmux
    control mode. tmux doesn't need to be installed. This affects Ghostty 1.3.0 and
    1.3.1.\n- [GHSA-hp9c-qp4q-cpw3](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-hp9c-qp4q-cpw3).
    The same impact as above, via a tmux control mode layout with a zero-sized or
    oversized pane. This affects Ghostty 1.3.0 and 1.3.1.\n- [GHSA-w9q4-5jvv-mcv4](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-w9q4-5jvv-mcv4).
    Clearing the screen into scrollback could corrupt memory if it deleted the scrollback
    page holding a styled or hyperlinked cursor. This only requires displaying malicious
    output, but only with a small`scrollback-limit` such as `0`. The default isn't
    known to be affected.\n- [GHSA-2r63-vmw6-3m3c](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-2r63-vmw6-3m3c).
    A crafted directory name could make the zsh shell integration send arbitrary escape
    sequences, such as silently replacing the clipboard via OSC 52. bash was affected
    in a more limited way. This only requires`cd`-ing into a directory from untrusted
    content, such as a cloned repository.\n- macOS: [GHSA-cw69-wm67-5pv8](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-cw69-wm67-5pv8).
    Cmd-clicking a crafted OSC 8 hyperlink could open unsafe local files or custom
    URL schemes, leading to arbitrary command execution. Ghostty now blocks unsafe
    targets and confirms custom URL schemes. This requires user interaction (cmd-click)
    to trigger.\n- macOS: [GHSA-mfw9-xcr3-7gfp](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-mfw9-xcr3-7gfp).
    The same issue as above for links detected by the `link` configuration, including
    the default URL matcher. This requires user interaction (cmd-click) to trigger.\n-
    macOS: [GHSA-v8cw-fg4j-jcc4](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-v8cw-fg4j-jcc4).
    Drag-and-drop text skipped paste protection, with the same impact as above. This
    requires user interaction (drag-and-drop) to trigger.\n- macOS: [GHSA-mxqx-236q-wrv7](https://github.com/ghostty-org/ghostty/security/advisories/GHSA-mxqx-236q-wrv7).
    Opening a file whose name contains control characters could run a different command
    than the one shown in the confirmation dialog. This requires a crafted file on
    your system and confirming the dialog.\n\nNote: I requested CVEs for the above
    advisories weeks ago, but GitHub hasn't assigned them yet. If/when they're assigned,
    I will update the above with proper CVE numbers.\n\n## Highlights\n\n### macOS
    27 Support\n\nPRs: [#12999](https://github.com/ghostty-org/ghostty/issues/12999)
    [#13069](https://github.com/ghostty-org/ghostty/issues/13069) [#13393](https://github.com/ghostty-org/ghostty/issues/13393)
    [#14413](https://github.com/ghostty-org/ghostty/issues/14413) [#14414](https://github.com/ghostty-org/ghostty/issues/14414)\n\nGhostty
    1.4 supports macOS 27 (Golden Gate). Most of the work was compatibility fixes:\n\n-
    Tabs in the titlebar (`macos-titlebar-style = tabs`) lay out correctly again.\n-
    The native tab bar no longer draws as a solid gray bar on top of your theme. It
    now lets the new glass style blend with your terminal background.\n- `macos-titlebar-style
    = hidden` no longer covers the top lines of the terminal when Reduce Transparency
    is on.\n- The app icon no longer has a thin border.\n- The Shortcuts \"New Window\"
    action no longer opens two windows when Ghostty is running without any windows.\n\nGhostty
    1.4 remains fully compatible with prior macOS versions back to and including macOS
    13 (Ventura). See the[system requirements](#system-requirements) for more details.\n\n>
    Note\n> \n> Ghostty 1.3.1 works on macOS 27, but it has some of the visual issues
    listed above, such as the gray tab bar.\n\n### Kitty Graphics Animation and Relative
    Placements\n\nPRs: [#13943](https://github.com/ghostty-org/ghostty/issues/13943)
    [#13939](https://github.com/ghostty-org/ghostty/issues/13939) [#13935](https://github.com/ghostty-org/ghostty/issues/13935)
    [#13934](https://github.com/ghostty-org/ghostty/issues/13934) [#13893](https://github.com/ghostty-org/ghostty/issues/13893)
    [#13933](https://github.com/ghostty-org/ghostty/issues/13933) [#13389](https://github.com/ghostty-org/ghostty/issues/13389)[#13270](https://github.com/ghostty-org/ghostty/issues/13270)
    [#13281](https://github.com/ghostty-org/ghostty/issues/13281)\n\nGhostty now supports
    Kitty graphics[animation](https://sw.kovidgoyal.net/kitty/graphics-protocol/#animation)and
    [relative placements](https://sw.kovidgoyal.net/kitty/graphics-protocol/#relative-placements).
    These were the last major features of the Kitty graphics protocol that Ghostty
    didn't support.\n\nPrograms that display animated images with the Kitty protocol,
    such as an animated GIF shown with `kitten icat`, now animate in Ghostty instead
    of showing a single still frame. Frame transmission, composition, and playback
    control are all supported, and animations pause while the terminal isn't visible.
    Relative placements let a program position one image relative to another image's
    placement, so the child image moves along with its parent.\n\nWe also did a full
    conformance pass against the specification and Kitty itself, fixing dozens of
    behavioral differences. For example, images now scroll with text inside scroll
    regions ([#4323](https://github.com/ghostty-org/ghostty/issues/4323)), retransmitting
    an image ID replaces the old image ([#6711](https://github.com/ghostty-org/ghostty/issues/6711)),
    and invalid image data now gets an error response instead of silence, which could
    leave clients hanging. The full list is in the [terminal capabilities](#terminal-capabilities)
    section.\n\nKitty graphics are faster, too. Image payloads are now parsed in bulk
    with SIMD instead of one byte at a time, making large image transfers **about
    16x faster** to parse in our benchmarks (64 MiB of image data, x86\\_64 Linux),
    and drawing images costs much less per frame.\n\nOur Kitty graphics implementation
    now covers 100% of the published specification, making Ghostty (and libghostty)
    the first terminal t"
