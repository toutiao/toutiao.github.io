  text: "&gt; There are a few big projects that redirect the compiler output and attempt
    to print only one line per output file, so when all goes well there is much less
    output text, but with those it is usually more difficult to debug failures.<p>Why?
    If you use something like tee(1), you can get the full log in a file and then
    filter line according to what you want.<p>&gt; Compiling any big software project
    produces far more text output than can be stored in any pty buffers.<p>The reason
    of my skepticism is that, according to your statement, reading a source file,
    then writing the compiled object file is way faster than a few printf through
    a kernel object in memory. Even for the terminal consuming the characters, parsing,
    and displaying the lines should not be a computation hog for most terminals"
