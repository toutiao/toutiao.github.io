  author: reissbaker
  text: Apple Terminal doesn&#x27;t support:<p>1. The Kitty keyboard protocol, which
    makes it impossible to distinguish e.g. Shift-Enter from Enter<p>2. OSC8 hyperlinks<p>3.
    It breaks on APC queries, so you need special handling to not emit them<p>4. Symbols
    for Legacy Computing Unicode support<p>5. The Kitty Terminal Graphics Protocol
    (or sixel)<p>6. OSC 9 notifications (or any of the later versions)<p>and a bunch
    of other stuff, this is just off the top of my head. For a long time they didn&#x27;t
    even support 24-bit color, although they fixed that in Tahoe.<p>It&#x27;s totally
    fine for basic UNIX tooling, but pretty painful if you&#x27;re trying to make
    nice interactive TUIs.
  score: 0
