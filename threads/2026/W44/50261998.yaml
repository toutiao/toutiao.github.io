  author: reissbaker
  text: "&quot;One implementation of a feature had a bug, therefore this feature should
    be turned off on all implementations by default&quot; is probably not going to
    convince people who think the feature is good.<p>If you don&#x27;t want to be
    able to have clickable hyperlinks, by all means use Konsole — no one is forcing
    you to use Ghostty. But if you want to know why people like Ghostty&#x27;s approach
    vs Konsole&#x27;s, it&#x27;s because Ghostty pushes terminal emulator features
    forward and is low latency. Konsole is low latency and adopts some but not all
    features that other people invent. It&#x27;s a noticeable difference and so people
    who like <i>the feature part</i> of the former like Ghostty&#x2F;WezTerm&#x2F;Kitty
    more than Konsole. If you don&#x27;t care or dislike that part, and want a more
    conservative terminal (that is also low latency), Konsole and many others further
    on the conservative spectrum exist."
