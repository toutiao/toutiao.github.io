  author: sho_hn
  text: KDE guy here.<p>Konsole is a fantastic and very mature terminal emulator,
    but it does have some real gaps that reveal its age.<p>The Qt toolkit that most
    KDE software is based on at some point introduced a next-gen toolkit-within-a-toolkit
    called Qt Quick, which most of our newer apps are written in. However, in its
    library form Konsole can only be embedded into apps that use the old gen toolkit.
    This is a real impediment to some efforts.<p>The old gen toolkit also typically
    doesn&#x27;t use Vulkan or OpenGL for rendering (the new one supports both), and
    so Konsole&#x27;s terminal renderer doesn&#x27;t either. Konsole&#x27;s real-world
    performance during use is arguably just fine, but it does leave a lot of performance
    and battery life on the table.<p>libghostty also has somewhat wider support for
    newer stuff like Kitty protocols, even though Konsole certainly trumps it in support
    for older stuff (like sixels).<p>There&#x27;s some other shortcomings to Konsole
    that are not inherent to the technology, like accessibility support not quite
    being where it should be.<p>And while the default UI is, in most distros, OK,
    there sure is a lot of spiderwebs and spacebar heating lurking in the settings
    dialogs (of which there are strangely many). It&#x27;s also a bit dated vs. our
    HIG at the moment.<p>Which is to say, these projects can and do have a point,
    especially if they provide a nice library instead of hoarding all the good to
    themselves.
  score: 0
  posted_at: '2026-10-27T21:44:20Z'
