  author: mitchellh
  text: 'These are Ghostty GUI release notes, but I want to take a moment to highlight
    the libghostty progress we&#x27;ve made since Ghostty 1.3.<p>As a reminder, libghostty
    is the highly portable, embeddable library that provides core terminal emulation,
    render state, and more. I always felt that a free, high qualty, lightweight, reusable
    terminal emulation core would benefit the developer world more than any single
    GUI application. And that is playing out!<p>It is and always was my true purpose
    with the Ghostty project (I said this in my first ever talk about Ghostty!). I&#x27;ve
    jokingly said many times that Ghostty GUI is just a glorified tech demo for libghostty.
    That&#x27;s not fair though, because GUI is great and there are really talented
    people working on it.<p>Since I started the project, Ghostty has always gotten
    people saying &quot;I don&#x27;t understand why you&#x27;d start a terminal emulator
    today.&quot; Well, the answer is libghostty. It&#x27;s truly unique and its enabling
    something special (imo!).<p>Highlights of libghostty since 6 months ago (none
    of the below was true 6 months ago):<p>- Libghostty has nearly 100% coverage of
    all of Ghostty&#x27;s core (and you can compile with flags to remove any of these
    features for size&#x2F;safety): <a href="https:&#x2F;&#x2F;libghostty.tip.ghostty.org&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;libghostty.tip.ghostty.org&#x2F;</a><p>- Libghostty
    now builds and is tested (in CI) for: Apple (macOS, iOS, visionOS), Windows (MSVC
    and GNU), Linux, FreeBSD, Android, WebAssembly, and freestanding (i.e. direct
    on hardware with no OS).<p>- Libghostty has bindings in pretty much every popular
    programming language: C, Zig, Go, Swift, Python, Rust, .NET, etc.<p>- Libghostty&#x27;s
    memory requirements have dramatically shrunk to enable the portability above.
    There&#x27;s still work to do but a single empty terminal now takes 90% less memory.
    And at scale I&#x27;ve proven 10,000 active (input&#x2F;output happening) terminals
    on a Linux server with 4 cores and 8 GB of RAM.<p>- Libghostty powers all JetBrains
    IDE terminals, over 12.5 million active users. <a href="https:&#x2F;&#x2F;blog.jetbrains.com&#x2F;platform&#x2F;2026&#x2F;10&#x2F;jetbrains-terminal-now-uses-ghostty&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;blog.jetbrains.com&#x2F;platform&#x2F;2026&#x2F;10&#x2F;jetbrains-termin...</a><p>-
    Libghostty is the most popular core behind the wave of venture-backed &quot;agentic&quot;
    terminals and editors, such as Herdr, cmux, and many others.<p>- Libghostty is
    being discussed and has been verbally accepted to replace the terminal core in
    Neovim: <a href="https:&#x2F;&#x2F;github.com&#x2F;neovim&#x2F;neovim&#x2F;pull&#x2F;39773"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;neovim&#x2F;neovim&#x2F;pull&#x2F;39773</a>
    (work still to be done)<p>- Libghostty powers a really popular and powerful terminal
    emulator for emacs (Ghostel): <a href="https:&#x2F;&#x2F;github.com&#x2F;dakra&#x2F;ghostel"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;dakra&#x2F;ghostel</a><p>- Libghostty&#x27;s
    speed is used by Antithesis to fuzz popular terminal programs and has directly
    led to hundreds of bug fixes sent upstream to programs such as tmux, btop, shells,
    and other terminal emulators. :)<p>- And so much more: <a href="https:&#x2F;&#x2F;github.com&#x2F;Uzaaft&#x2F;awesome-libghostty"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;Uzaaft&#x2F;awesome-libghostty</a><p>Libghostty
    is really successfully turning into the tide that raises all boats. As it becomes
    more popular, Ghostty itself gets more performant and stable, and so does everyone
    else. It is also a vehicle for delivering modern terminal emulation to the widest
    source possible.<p>I plan on tagging libghostty 1.0 in the next few months and
    declaring ABI stability at that point!'
