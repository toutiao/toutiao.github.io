  author: reissbaker
  text: A couple of annoyances I&#x27;ve had shipping CLI apps to Konsole users:<p>1.
    By default, Konsole disables OSC8 link support. Users can enable it manually,
    but you need to ship fallbacks by default since otherwise the default users will
    have a broken experience. Ghostty, Kitty, WezTerm, etc all ship working OSC8 support
    out of the box.<p>2. No built-in Nerd Font support, so if you want to render icons,
    you need to tell your users to set up a patched font or else have fallbacks. Ghostty
    and WezTerm ship built-in Nerd Font fallbacks if your configured font isn&#x27;t
    patched.<p>That being said Konsole is much better than most emulators. iTerm2
    is not bad, although it lacks Symbols for Legacy Computing Unicode support (which
    all of the above have, including Konsole, and which is very useful for drawing
    prettier terminal UIs). The worst by far is Apple Terminal, truly the IE6 of terminal
    emulators.
