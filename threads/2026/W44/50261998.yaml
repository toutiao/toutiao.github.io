  author: adrian_b
  text: If you want to use in a terminal emulator features that do not exist in any
    xterm variant and the remote computer does know only xterm, there is no way to
    do that without installing data into the terminfo database.<p>Otherwise, there
    is no need to install anything, you should just set the environment variable TERM
    in the remote computer to one of the xterm variants and then modern terminal emulators
    like kitty or ghostty will still work fine, but of course only as long as you
    use the xterm-compatible subset of their features.
