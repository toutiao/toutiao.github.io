    always in the category of &quot;things don&#x27;t work right&quot;.  It&#x27;s
    never &quot;I wish my terminal emulator ran faster.&quot;  Ghostty seems hyper
    focused on speed, with the negative side effect that compatibility breaks - in
    practice.  I get that it&#x27;s following all the newest standards or whatever
    it&#x27;s doing, but in reality it always needs custom setup to work right.  And
    for me the net effect is that it&#x27;s always creating problems, not solving
    them.
