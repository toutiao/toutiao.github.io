    am I supposed to know what is even possible to change?<p>A brand new ghostty config
    is an empty file because it only shows you what the <i>overrides</i> to the default
    config are, which means if you want to change your ANSI colors, off to the docs
    to look up what they&#x27;re called as config keys and what format it expects
    as a value. Want to hide the Secure Keyboard Entry overlay? Off to the docs to
    figure out what the key is called. Is it a boolean? Does it accept true&#x2F;false,
    or only 0&#x2F;1? Who knows! Go to some website and scroll and scroll and scroll
    and maybe you can find it.<p>Or they can just put &#x27;macos-secure-input-indication=&quot;true&quot;&#x27;
    in a file it creates when it launches for the first time and notices it doesn&#x27;t
    have a config file in an expected location. It can put that in there and every
    other default setting it <i>actually is setting</i> for itself, instead of just
    keeping it all socked away in the compiled executable as a behavior. Show me,
    on the computer I have, in the file I&#x27;m supposed to edit anyways, what all
    of the possible keys are, and some general indication or hint of what the fuck
    I can put in there. Don&#x27;t make me fetch it for every single goddamn boolean.
