  author: chasil
  text: 'I have the two small books of <i>Tom Sawyer</i> and <i>Huckleberry Finn</i>
    on a shelf in my living room.<p>The most poignant moment is in Huckleberry Finn,
    where (floating on the Mississippi) the protagonist asserts:<p>&quot;If my friendship
    damns me to hell, then I&#x27;ll go to hell with him.&quot;<p>Looking it up...<p>&quot;I
    felt good and all washed clean of sin for the first time I had ever felt so in
    my life, and I knowed I could pray now. But I didn’t do it straight off, but laid
    the paper down and set there thinking—thinking how good it was all this happened
    so, and how near I come to being lost and going to hell. And went on thinking.
    And got to thinking over our trip down the river; and I see Jim before me all
    the time: in the day and in the night-time, sometimes moonlight, sometimes storms,
    and we a-floating along, talking and singing and laughing. But somehow I couldn’t
    seem to strike no places to harden me against him, but only the other kind. I’d
    see him standing my watch on top of his’n, ’stead of calling me, so I could go
    on sleeping; and see him how glad he was when I come back out of the fog; and
    when I come to him again in the swamp, up there where the feud was; and such-like
    times; and would always call me honey, and pet me and do everything he could think
    of for me, and how good he always was; and at last I struck the time I saved him
    by telling the men we had small-pox aboard, and he was so grateful, and said I
    was the best friend old Jim ever had in the world, and the only one he’s got now;
    and then I happened to look around and see that paper.<p>It was a close place.
    I took it up, and held it in my hand. I was a-trembling, because I’d got to decide,
    forever, betwixt two things, and I knowed it. I studied a minute, sort of holding
    my breath, and then says to myself:<p>“All right, then, I’ll go to hell”—and tore
    it up.&quot;<p><a href="https:&#x2F;&#x2F;www.gutenberg.org&#x2F;cache&#x2F;epub&#x2F;76&#x2F;pg76-images.html"
    rel="nofollow">https:&#x2F;&#x2F;www.gutenberg.org&#x2F;cache&#x2F;epub&#x2F;76&#x2F;pg76-images.html</a>'
