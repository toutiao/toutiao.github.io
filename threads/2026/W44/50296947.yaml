  author: rramadass
  text: People who are exposed to Mark Twain only through Tom Sawyer&#x2F;Huck Finn&#x2F;A
    Connecticut Yankee&#x2F;etc. works usually think of him as a &quot;fun&quot; author.<p>But
    he had one of the most incisive and intellectual minds of his times, which was
    biting in its criticisms&#x2F;satire of American and the larger Human civilization.
    Everybody (but Americans especially) should read his set of essays titled; <i>On
    The Damned Human Race</i> for edification.<p>I often wonder what he would think
    of current-day American society and so-called democracy. He actually coined the
    term &quot;Gilded Age&quot; to highlight the covering of everything rotten&#x2F;corrupt
    with a superficial sheen so as to sell it to the masses. If that doesn&#x27;t
    describe today&#x27;s society i don&#x27;t know what does.<p>Read, <i>The Lowest
    Animal (aka The Damned Human Race)</i> by Mark Twain - <a href="https:&#x2F;&#x2F;www.thoughtco.com&#x2F;the-lowest-animal-by-mark-twain-1690158"
    rel="nofollow">https:&#x2F;&#x2F;www.thoughtco.com&#x2F;the-lowest-animal-by-mark-twain-16...</a><p><i>And
    so I find that we have descended and degenerated, from some far ancestor (some
    microscopic atom wandering at its pleasure between the mighty horizons of a drop
    of water perchance) insect by insect, animal by animal, reptile by reptile, down
    the long highway of smirchless innocence, till we have reached the bottom stage
    of development – nameable as the Human Being. Below us – nothing.</i>
