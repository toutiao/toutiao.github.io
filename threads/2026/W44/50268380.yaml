  text: "&gt;  Policy makers would be much less likely to explore bold reforms or
    risky bipartisan compromises if their draft quality notes and correspondences
    were publicly tied to their political reputation.<p>Only if those bold reforms
    weren&#x27;t in the interests of the people they serve. Risky bipartisan compromises
    should still be transparent along with what was gained in exchange for them. If
    the people feel that the compromise wasn&#x27;t worth it they should be empowered
    to vote accordingly come election time. It&#x27;s the job of representatives to
    assure the people who elected them that they are doing a good job and if they
    can&#x27;t do that they deserve to lose their position. Refusing to support bold
    reforms that the people they represent want, or refusing to compromise when it
    would be beneficial to voters would become just as costly to their career.<p>&gt;
    It takes significant work to produce successful legislation, and much of that
    work can be productively and safely done without direct public oversight.<p>Often
    most of that work is done entirely for them by corporations and lobbying groups
    and &quot;law makers&quot; just vote how they are paid to vote without even reading
    the bill put before them. Just because something can be done in secrecy doesn&#x27;t
    make that the ideal way to do it. We&#x27;ve have extremely poor results with
    the system as it stands right now, so a change to introduce more transparency
    and accountability seems like a very good idea.<p>&gt; This is the same reason
    an individual might value a private journal.<p>A public servant representing the
    people by making edits to laws and performing the duties they were elected to
    carry out is nothing at all like someone keeping a private journal. Their work
    is not their personal affairs, it is the public&#x27;s affairs. How that work
    is being done matters to the public. Legislators would still remain free to go
    home at the end of the day and write in their private diary all they like.<p>&gt;
    If you have a problem with your representative’s behavior, call their office and
    ask about it.<p>When their behavior is conducted in secrecy behind closed doors
    the public doesn&#x27;t have the ability to hold them accountable for it, which
    is exactly why it takes place in secrecy. Increasing the public&#x27;s ability
    to hold elected officials accountable by increasing transparency can only improve
    outcomes for voters, and it would certainty be inconvenient for elected officials
    who want to put their own interests above the interests of the people who elected
    them."
