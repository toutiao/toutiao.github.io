  author: tpmoney
  text: Following renumbers has to be one of the worst parts of this. As an example,
    the text of the US code that was modified by the BCRA in 2002 has been renumbered
    &#x2F; moved since Citizens United v FEC was decided. But the text itself is the
    same as it was since the BCRA passed, because courts don&#x27;t remove the actual
    law text with their decisions. So if you want to know what parts of the current
    US code were ruled unconstitutional by the courts in that decision and are therefore
    unenforceable, you need to first find the text of the BCRA, because the ruling
    refers to the sections of that piece of legislation. Then you need to find the
    version of the US code that was on the books when the BCRA was passed to find
    the section references that the law talks about. Then you need to find the law
    that renumbered that part of the US Code and find the new parts. Then you need
    to see if any changes have been applied since (there hasn&#x27;t really) and then
    you need to match the changes to the referenced sections in the old version of
    the code to the equivalent text in the current version of the code, modulo any
    changes to references that changed as part of the renumbering but are otherwise
    the same.<p>I&#x27;m not saying lawyers aren&#x27;t really really expensive, but
    you don&#x27;t have to spend a long time digging into just a simple question like
    &quot;what parts of the law are no longer enforceable after a supreme court decision&quot;
    before you start to understand why they charge the prices they do.
