  author: Ericson2314
  text: Did you read the linked piece?<p>The data is &quot;there&quot; in some some
    sense, but it is messy, coarse-grained, and arrives slowly.<p>Once the office
    is familiar with Git, we can start the conversation about having the new version
    of the US code instantly ready when a bill is passed. In particular, rather than
    voting on the informal patch, congress should vote on the final result. (bills
    are patches, but votes should be on the new state with the patch applied.) Then
    the office merely supervises the Git repo, and is freed up to focus on other codification
    tasks, such as hyperlinking definitions, overseeing formalization of the tax code
    like France did, etc.<p>Previous discussions often foolishly conflate version
    control with &quot;no force pushing of any branch&quot; and &quot;all branches
    must be public&quot;. That is stupid. Vote trading will continue to make drafting
    happen in secret, since it is simple game theory that an &quot;atomic transaction&quot;
    of many possibly-unrelated things is an efficacious coordination mechanism. This
    is just about getting the final version and its already-public history cleaned
    up and mechanized to the greatest degree possible.
