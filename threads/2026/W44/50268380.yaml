  author: Xirdus
  text: Poland has an official, somewhat manual version of this - the ISAP system.<p>Actual
    bills are written in the form of patches (&quot;§1. In the law X paragraph 5,
    the words &quot;such and such&quot; are replaced with &quot;this and that&quot;.
    §2. The law X paragraph 4 is striked. §3. After law X paragraph 8, a new paragraph
    8a is added that says &quot;etc. and so on&quot;.)<p>After a patch or a collection
    of patches are passed, they are combined together and a unified version of the
    law is published. These documents aren&#x27;t technically the law, they just show
    a snapshot of what the law is at the specific moment.<p>ISAP system is an online
    collection of all bills that were passed, plus crosslinks between laws that change&#x2F;supercede&#x2F;otherwise
    interact with each other, plus current and archival unified versions, plus related
    administrative orders and other miscellanious documents. Makes looking up laws
    and changes to laws very easy.
  score: 0
