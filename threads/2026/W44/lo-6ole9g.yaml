    Yeah, using WARC files and WARC-related tools and apps is something I've been meaning to try out. But, of course have not done it so far.
    What I used to do for years was simply print out a webpage to PDF....but I changed my approach in maybe last 6 or 8 months ago, where I simply copy/paste the contents of a webpage into an ODT (open docs text) file - basically the equivalent of a Word doc/.doc/.docx...Why? Because in a word processor doc i can add my own comments, maybe notes, basic annotations, etc. I didn't like the experience of annotation in PDF tools....but this "archive" method of mine is only worth doing for web pages whose content is simple text, code, maybe some simple imagery...does not work if the content includes videos of course, and some complex tabular data chunks weird sometimes (not always, but sometimes).  While my approach is far from perfect, its actually worked out pretty well for me. Usually my goal in archiving stuff is merely to get the main corpus of the content, and if style/css or some interactive feature is missing that's ok for me the vast majority of the time...Using an open format like ODT helps with longevity (theoretically) to be able to access/open the content far off into the future. I guess, PDF exports do tend to be smaller filesize than word processor docs, which can be a benefit of PDF tools; sometimes PDFs are like half the size of word proc. files...so my approach may not be ideal if storage space is very limited. I suppose also that my approach is very manual, so other methods like PDF exports or maybe WARC tools probably save time. Nevertheless, my "archive (simple) web content into a word processor file" has been working great for me!
    Though, I'd still like to someday play with WARC stuff...but who has the time? :-)
