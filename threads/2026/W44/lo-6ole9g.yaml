  author: jaculabilis
  text: "In my notes I have this:\nwget \\\r\n  --page-requisites \\\r\n  --convert-links
    \\\r\n  --adjust-extension \\\r\n  --span-hosts \\\r\n  --mirror \\\r\n  --no-parent
    \\\r\n  https://example.com/path/ \\\r\n  -D example.com,static.example.com \\\r\n
    \ --wait=1\r\n\nwhich is probably close to what you want. Sometimes you have to
    retry a few times while adding more domains to -D/--domains to catch image or
    script hosts or other subdomains. I don't remember why --adjust-extension was
    necessary in this case. --no-parent is if you're just archiving below a certain
    path and not the whole website.\nIf you need to adjust it, and don't mind asking
    a machine spirit, a small, local LLM can probably spit out a reasonable wget invocation
    for a given use case, and you can cross-reference its suggestion against the manual
    to determine whether it remembered a useful-but-obscure flag or hallucinated."
