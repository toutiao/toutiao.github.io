  text: The closest thing to the middle is something distributed and content-addressed
    like IPFS or Iroh's recent experimentation with pkarr. Though, what you get is
    persistence of the content when addressed by its hash, so if you only had a human-readable
    DNS that was aliased to the content-addressed URL, you can still lose the content
    when the original host goes down.
