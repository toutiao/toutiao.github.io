  text: |-
    Most use is via a bunch of scripts woven into my personal computing environment.
    Like, there is some Vim scripting attached to keybindings, that knows how to take the currently-under-the-cursor URL and feed it to the external script.
    Rhat latter shell script downloads the content in one of a few possible ways. Plain curl is among them, but also curl-impersonate, obscura the vibecoded headless browser-like runtime — obviously in nsjail just like GUI browsers because JS runtimes are not to be trusted, and something around Drakma — a Common Lisp HTTP client. I should move those curls to nsjail by default, too. Then the script feeds the content to my personal HTML-to-text converter written in Common Lisp (nothing too interesting there, just a bunch of personal preferences what to show and what not to show).
    The script also knows how to open something in Vim… which separately integrates with how I setup tmux, but can also open a new X11 terminal emulator with tmux and vim and the converted text.
    Then there are helpers that make pasting URL in my launcher scripted around rofi work to launch a terminal emulator with tmux with vim with that URL's context.
    Then if something needs browser interaction to get the content, I have scripts to grab the expanded HTML from Firefox. Funny how Firefox insists on informing websites that the browser is under WebDriver / Marionette, but the things websites would care about are exactly the things easy to do with a custom extension (and FF ESR can be convinced to accept unsigned extensions).
    Oh, and additionally to all this, there are feeds (Lobste.rs, local news, etc.) with some Common Lisp scripts to look at the page and figure out the links to new content and save the new content via the same machinery but then add to the queue of unread.
    Overall, a lot of minor automation and not really a single system.
    On a completely unrelated note, among the many things I would like of a dream VCS is basically ability to have home directory under version control, but also export a subdirectory as a separate branch, but also export a not-subdirectory aligned set of files as a separate branch.
