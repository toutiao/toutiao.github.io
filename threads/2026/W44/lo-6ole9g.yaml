    I also long for an IPFS-like system, that would blend the Web Archive, personal bookmarks, personal websites, and personal backup, in a decentralized/federated offline-compatible fashion (also akin to Secure Scuttlebutt).
    I tried to develop this, and kinda still try, but for a number of years now I'm balancing at the edge of burnout and unable to really develop much software in hobby time, lamentably. I tried to build this on IPFS first, since then trying on Iroh (an IPFS successor effort, which now has growing support for both DHT and Scuttlebutt-like mDNS).
    Within this project's vision, I'd like to be able to take a website I browse, and make a bookmark (possibly annotated) to it on my website (and/or a private list), which would also automatically make a WARC and/or a text&images-only (Readability-like) archive of its contents. This would then automatically become shared through p2p with the Internet Archive and a/the DHT, building a (hopefully) growing distributed backup of hand-picked parts of the web. At the same time, it'd become my offline backup and also a collection I can browse whenever I like, also offline.
    With mostly the same mechanism, I'd like to be able to backup my photos, documents, PDFs, music, videos, git repos. I'd like to be able to then easily share them with friends, but also to share them with hand-picked backup locations and machines, notably including my phone. I want to be able to also manage the storage and redundancy level of my data, for every item or group of items manually selecting which backup locations store them, or on which ones I delete them (with some grace period protecting from accidental deletion).
    If somebody's interested in working together, somehow, on this, I'm more than happy to be contacted. Please note it's glacially slow on my end, though, and I can't promise any reasonable speed of co-working; also I'm rejecting any vibecoding for this (though I won't stop anyone from trying it this way; but in such case please do not contact me about it).
