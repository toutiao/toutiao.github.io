  text: Also less useful than one might think at first.<p>Lots of code &quot;typos&quot;
    aren&#x27;t immediately syntactic errors.  Misbalanced parentheses, for example,
    only bite when one needs to close the series.  The solution is to go back and
    fix the original error, but that option is foreclosed to autoregressive LLMs.  In
