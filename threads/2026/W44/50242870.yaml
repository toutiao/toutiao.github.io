    accuracy with the newer Kimi and DeepSeek models.  \n  \nIn this blog post, we
    first describe tool call schema accuracy and why it’s important in serving agentic
    workloads. We then talk about constrained decoding and how it fixes the schema
    accuracy problem.\n\n### Tool-call Schemas\n\nYou can enable an LLM to call an
