    future generation in a way that&#x27;s hard to quntify.<p>Constrained generation
    for tool calls is certainly a type of syntax checking, but it&#x27;s one that
    can be justified because the &quot;hard&quot; syntax choices come up front, both
    in the very format of the tool call itself to the name of the tool and its parameters.  Errors
    are more likely to be detected in the same root-cause tokens that generate them.
