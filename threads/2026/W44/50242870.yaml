  author: hansvm
  text: Ah, I see. IMO the other response [0] I gave is probably the closest to what
    I had in mind. Interestingly, retry very well might not be better, especially
    when measured on a pareto frontier including cost.<p>I have a reasonably strong
    prior that it should be better though. That comes from my observations that whenever
    I notice the difference in distribution the retry method is better (obvious sampling
    bias, but what kind of person ignores their own experiences). As a stronger piece
    of evidence and intuition, the entire goal of these systems is to reproduce a
    certain distribution. If that distribution says that you should use ripgrep 10x
    as often as you should use grep then that&#x27;s a signal you probably don&#x27;t
    want to throw away. Constrained decoding might very well do so and place them
    on even footing or skew 10x the other direction. Retry faithfully captures that
    original distribution. I&#x27;m skeptical of solutions which want to shy too far
    away from it (similarly with most applications of changing the model&#x27;s temperature).<p>The
    more important point is just that they&#x27;re different, so we should probably
    measure the impact.<p>[0] <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50245714">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50245714</a>
