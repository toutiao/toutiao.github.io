  author: NitpickLawyer
  text: "&gt; but massaging the sampler(?) also sounds like that might give a lot
    of control over outputs with the weights staying technically the same?<p>Yes,
    this is what constrained decoding means. You constrain the model to only output
    from a set of &quot;allowed&quot; tokens (a.k.a. grammars).<p>So, if you use tool
    use with constrained decoding, you can be certain that the model will always choose
    from a list of approved tools (i.e. if tools=[&#x27;read&#x27;,&#x27;write&#x27;],
    it cannot output &#x27;execute&#x27;, even if in other sessions it could, if execute
    was in the approved tools).<p>The tricky problem is that certain models work &#x2F;
    have been trained in certain ways. And constraining them can lead to &quot;invisible&quot;
    problems. Constrained decoding only guarantees perfect syntax, not perfect semantics
    (i.e. it could write nonsense in the correct file).<p>&gt; Could something like
    that also be used in other contexts?<p>Sure. You can build pretty cool grammars
    and constrain the model to do cool stuff, akin to &quot;tool use&quot; but more
    free hand. You could, for example, make it always emit a 10 point plan. For any
    prompt, it will give you a fixed syntax 10 point plan, always. And the plan will
    be constant with a plan_title and 10{plan_item, item_text}. But, as above, there&#x27;s
    no guarantee that the individual items in the plan would make any sense... (i.e.
    step7 in a pasta making recipe would be &quot;add glue&quot;)."
