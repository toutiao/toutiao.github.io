  author: matheusmoreira
  text: 'I&#x27;m kinda trying to move past left&#x2F;right labels. I&#x27;ll try
    to explain.<p>Bolsonaro generally supports privatizing Brazilian state companies
    and selling them off to foreigners. I don&#x27;t want that. Especially not to
    the US and Israel.<p>Lula on the other hand is better aligned with China, which
    is also what I want.<p>Lula and myself are aligned on these two points. So this
    outcome is not entirely bad for me.<p>The problem I have with Lula is his party&#x27;s
    obnoxious taxation, lack of a real plan for reindustrialization, continuous defense
    of criminals, and most importantly, his total domination of the supreme court.
    I voted for the right specifically to see those judges impeached and imprisoned,
    because I absolutely oppose everything they did in 2022, far more than I ever
    opposed Lula himself. I&#x27;m of the opinion that presidents and elections barely
    matter anymore, because it&#x27;s the supreme court that runs the country. It&#x27;s
    the Venezuela governance model: president appoints god-like supreme court judges
    and rules monocratically through them.<p>The 1st round this month was such an
    upset not because of Bolsonaro but because of the <i>senate</i>. They are the
    ones who can impeach supreme court judges, and when Brazil unexpectedly elected
    a right wing majority in the senate, it struck true fear into the court. This
    was our chance to completely wipe out that court and forever change the history
    of this country, like Bukele did for El Salvador.<p>While in the end the necessary
    victory didn&#x27;t materialize, Brazilian senate is still absolute majority right
    wing now, and they could still impeach those judges. I&#x27;m not going to hold
    out hope for that anymore, but if I see at least one judge bite the dust I&#x27;ll
    still call it a major win.'
