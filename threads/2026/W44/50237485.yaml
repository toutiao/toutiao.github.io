    winning.<p>Of course just because there are technically flaws, doesn&#x27;t mean
    it&#x27;s not an improvement over the status quo.<p>Instant Runoff Ranked ballots
    are particularly well suited for electing a single position like a Mayor or President.
    Given that it&#x27;s still a majoritarian system like First Pass the Post, it&#x27;s
    a much more questionable system to use for other things like electing a parliament.
