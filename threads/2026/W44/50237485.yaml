  author: xoa
  text: "&gt;<i>gerrymandering</i><p>I don&#x27;t know the specifics of Brazil&#x27;s
    system, but at least in the US gerrymandering has nothing to do with the Presidency
    or Senate, only the House. It&#x27;s also not without risk. Gerrymandering is
    bad, but it doesn&#x27;t change the totals of votes; it attempts to reapportion
    &quot;excess&quot; votes yielding a large win margin in one area to give winning,
    but necessarily <i>smaller</i>, margins in more areas. Amongst other challenges
    though that smaller margin means if there is a wave then a gerrymander can turn
    into a &quot;dummymander&quot; where previously safe districts get flipped.<p>&gt;<i>funny
    business</i><p>This is actually pretty dang hard in anything but a total sham,
    and even then is at least obvious it happened. Some timy fiddling at the margins
    may be possible to sneak through, and yeah some elections that might make the
    difference. But that can&#x27;t counter any serious victory. The more common technique
    seems to be trying to suppress the vote. But as well as also not being trivial
    it also too risks backfiring by motivating people much harder. There is a lot
    of human psychology around &quot;loss&quot;, people often absolutely hate things
    being taken from them even if they were complacent about having them."
  score: 0
