  author: saturn8601
  text: Gerrymandering is the most benign of the tricks, and both sides play that
    trick. What&#x27;s more concerning is we don&#x27;t really have a true paper record
    of the votes. So many of these swing states have machines that produce digital
    only voting records. So how do we even know that the vote is accurate? Even if
    there was a paper record, most states don&#x27;t even bother re-checking unless
    it&#x27;s very close. After 2016, a lot of activism across the country has forced
    states to switch to a paper + digital record, which allows quick tallies, but
    then also paper backup and opens the door to two way verification. Unfortunately,
    this is not enough. There needs to be validation done after the election to confirm.
    But again, the worst part is that the states that really matter have been the
    ones least incentivized to actually switch over. So who knows? While its conspiracy
    thinking that Trump didn&#x27;t actually win in 2024, do we really know for sure?<p>Everything
    else you mentioned also matters. I can&#x27;t tell you the amount of times that
    the state of Georgia, suddenly out of the blue, invalidated a lot of registered
    voters. And if people don&#x27;t check, like my friend in a minority town outside
    of Atlanta, they won&#x27;t realize until election day. Red states are more likely
    to play this trick. Your conclusion is something I disagree with, though. Voters
    have lost so much over the last decade, and they don&#x27;t fight back until it
    really starts to affect them personally. I think the surge that we might see this
    election is only due to economics. If the economics were good, it&#x27;s not out
    of the question that Trump would be doing fairly decent this election cycle. This
