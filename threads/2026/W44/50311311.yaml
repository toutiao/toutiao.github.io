  text: I don&#x27;t think Mythos is even close to what is available privately. If
    you can touch it as a consumer it&#x27;s been heavily nerfed &#x2F; censored and
    isn&#x27;t using nearly as much compute as an actual SOTA model. But it&#x27;ll
    reach the benchmark of improving itself (it&#x27;s already building improved chips
    for itself - crafting its own brain) and people will change the goalposts again.<p>It
    really feels like a lack of imagination to think that this technology that surprises
    even the researchers working on it all the time will just stop improving in the
    fashion skeptics keep saying it will. I&#x27;ve been hearing it&#x27;s &quot;hit
    a wall&quot; on every update since GPT 3.5 and the rate of improvement just keeps
    accelerating. Every single time someone says it&#x27;ll never be able to do X
    (math was the big one I heard a lot - how can a language model do math?) it tends
    to do X not only well but better than us in time.<p>Sophistry goes both ways.
    My guess is if you&#x27;re a skeptic and you&#x27;re able to go back and see your
    thoughts from 2022 they were much different arguments than what they are now.
    Arguing that LLMs aren&#x27;t going to be more intelligent than humans because
    of what they can do now could be like arguing the industrial revolution will stop
    at the steam engine. How can we possibly know either way?<p>My personal bet comes
    from the rate of change I&#x27;m seeing and how it&#x27;s making many of my friends
    (even the high paid ones, in fact especially the high paid ones) obsolete overnight.
