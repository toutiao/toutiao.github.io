  author: CharlieDigital
  text: 'I genuinely prefer OpenAI models for coding and building in general.  My
    observation: GPT models are generally better at following the system prompt, tool
    use, and skill use.<p>I use Paseo and there is a noticeable difference when GPT-6.1
    Sol is driving the orchestrator vs Opus&#x2F;Sonnet 5.5 driving the orchestrator.  Anthropic
    models ignore the shared system prompt to use the Paseo tools for sub-agents and
    prefer to use its own native sub-agents.  It ignores the skills mentioned in the
    system prompt, but will use them if I explicitly tell it to in a user prompt or
    I extra emphasize the instruction in an XML fenced block in the system prompt
    or CLAUDE.md like &lt;BOOTSTRAP_MUST_EXECUTE_AT_START&gt;<p>Sometimes, I feel
    like I have to explicitly prompt Anthropic models to behave the way I want it
    to (even with system prompts in place with the EXACT instruction).  Sometimes
    it even feels like it&#x27;s disregarding CLAUDE.md.  To me, this makes me feel
    like it is the less compliant of the two because I constantly have to steer it
    manually.  Anthropic models also feels like they prefer to go lone-wolf.  I want
    my orchestrator to use the other subs (configured with different platforms and
    models) to evaluate a design; Opus really wants to lone-wolf and solo everything.<p>That
    said, I prefer Anthropic models generally only when the task is more open ended
    and exploratory.  The Anthropic models&#x27; &quot;mind of their own&quot; benefits
    here; GPT models tend to be too agreeable; and too eager to agree with any change
    in direction.  But for actual coding once a direction&#x2F;plan is in place, I
    would much rather delegate it to GPT (more likely to draw on the harness for context,
    skills, instructions, and tools -&gt; more consistency).<p>Anthropic&#x27;s 1m
    context window default and shorter cache TTL are also not great in agentic flows
    where an agent could become idle and then re-activated.  Burns tokens very quickly.  I
    have it tuned down to 300k across all models (recommend doing this for multi-agent
    coding).'
  score: 0
