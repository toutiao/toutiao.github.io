  author: jmyeet
  text: 'I&#x27;m generally anti-advertising but I find Google search advertising
    to be the <i>least</i> objectionable form of advertising because it can be entirely
    relevant to what you&#x27;re searching for.<p>If I search for &quot;how do I fix
    a shower that won&#x27;t drain?&quot; then you will get a mix of results that
    will include articles, Youtube videos, etc. But also links to plumbers in your
    area seem entirely relevant to that query, no? I find it strange how many of the
    most militant anti-advertising purists ignore this completely.<p>As for creating
    things of value, there&#x27;s a problem: housing has become the best performing
    asset in many developed economies and it is fundamentally parasitic and destructive.
    As an example, the Reserve Bank of New Zealand analytically created the best-performing
    portoflio and it was... 100% housing [1].<p>Demand for housing in many places
    is inelastic. It enjoys huge tax benefits. And you can leverage it better than
    most asset classes. Plus it&#x27;s become a political goal of many governments
    to have ever-increasing house prices.<p>So if you want to build a factory that
    makes widgets that you want to sell, that involves a lot of risks. Why would you
    when you get a better, easier and safer return from just buying more housing?<p>If
