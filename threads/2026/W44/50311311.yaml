    Paseo is Apache 2.0 (vs T3 MIT).  Haven&#x27;t tried T3 and can&#x27;t find docs for it to get more insight without installing.<p>Re: changes: Paseo&#x27;s plugin system is very, very good.  Some limitations since not all of the internals are accessible via plugin system, but allows building very custom UIs.  So this may be a point of delta with T3.  But I have some coworkers that have gone absolutely HAM with the plugins and built entirely custom workspaces (wild).<p>For me, what I have found most useful about Paseo is the multi-platform, multi-agent setup because this has given my agent teams much, much more autonomy that I feel like I can trust (after weeks of watching them work).  The agent profile system looks too simple at first blush, but actually, that simplicity and semi-structured dynamic nature of the sub-agents is what makes it powerful.<p>Might try T3 for a week and see; thanks for sharing!<p>EDIT: T3 has no docs site yet, but sifting through docs, this was interesting: <a href="https:&#x2F;&#x2F;github.com&#x2F;pingdotgg&#x2F;t3code&#x2F;blob&#x2F;main&#x2F;docs&#x2F;user&#x2F;remote-access.md#more-machines-with-t3-chat" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;pingdotgg&#x2F;t3code&#x2F;blob&#x2F;main&#x2F;docs&#x2F;user&#x2F;remo...</a><p><pre><code>    &gt; Each T3 Connect account can link up to 3 machines. Phones and browsers do not count. A paid T3 Chat plan raises the limit to 10 machines with Pro, or 100 with Premier.
    </code></pre>
    Paseo has no paid features; only if you want to use the hosted hub gateway (entry point for Slack, Discord, GH).  T3 Connect looks to be the equivalent of the Paseo Relay: <a href="https:&#x2F;&#x2F;paseo.sh&#x2F;docs&#x2F;connectivity#paseo-relay" rel="nofollow">https:&#x2F;&#x2F;paseo.sh&#x2F;docs&#x2F;connectivity#paseo-relay</a> which has no limits (Herdr&#x27;s ipml is better, though; Paseo currently cannot manage individual connections which would make it SICK for team collab. See: <a href="https:&#x2F;&#x2F;github.com&#x2F;getpaseo&#x2F;paseo&#x2F;discussions&#x2F;6896" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;getpaseo&#x2F;paseo&#x2F;discussions&#x2F;6896</a>)
