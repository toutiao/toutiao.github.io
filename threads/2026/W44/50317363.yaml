  author: al_borland
  text: 'I went down the watch rabbit hole for a while. When I was looking for a travel
    watch, I was stubbornly looking for a mechanical watch. I also wanted it to handle
    the issue that arises with countries like India, which are 30 minutes off all
    the other time zones. This was a nearly impossible task, and prices grew to the
    point where I didn&#x27;t think I would even feel comfortable traveling with such
    a watch.<p>I stewed with this problem for the better part of a decade, without
    a solution.<p>I then stumbled across the Casio AE1200, their world timer. As I
    thought about it, this was the perfect choice. With a 10 year battery, I could
    just grab it and go (changing the battery whenever I renew my passport), I didn&#x27;t
    have to deal with setting a bunch of complications, because the quartz movement
    just kept it going all the time. It solved the IST problem. The low cost meant
    that I could travel without having to worry about my watch... if something happened,
    oh well, get another one. Along with that, I wouldn&#x27;t make me a target for
    pickpockets. I had been so caught up in watch culture that I didn&#x27;t realize
    being cheap could be a feature in the right context.<p>I&#x27;ve had it for about
    3 years now and still smile every time I wear it. Sure, it&#x27;s a cheap Casio
    I picked up at some random retail store... but it took me 10 years to grow into
    the person who could appreciate it and it solved a problem that I thought about
    way too much for the previous decade. It&#x27;s one of my cheapest watches, if
    not the cheapest, yet I think it&#x27;s my favorite one.<p>A tip for anyone in
    the market: There is a lot of ugly text on this watch. It can be erased with an
    eraser. I used a white plastic eraser. At first it doesn&#x27;t seem like it&#x27;s
    doing anything, and then the text is gone. This is much better than the chemical
    solutions some videos online use.<p>I was tempted to upgrade the bracelet, case,
    and crystal. There are options for metal and sapphire from 3rd parties, but if
    I did that, I&#x27;d then be more worried about losing it, which is an anti-feature
    when traveling. I have intentionally kept it stock other than erasing the text
    on the case itself to stay true to that realization I had a few years ago.<p>And
    credit where credit is due, I think it was the Talking Watches episode with John
    Mayer and Ed Sheeran that made me realize cheap was a feature. They were showing
    all these crazy one-of-one watches they had custom-made from AP and alike, but
    they both just traveled with a G-Shock for some peace of mind.'
