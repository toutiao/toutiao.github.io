  text: "&gt; No fluff, no marketing that bordered on propaganda<p>Your comment sounds
    a lot like propaganda to me.<p>&gt; ... devices are treated as disposable, depreciating
    products.<p>I would argue that this shift really happened in the last 30 to 40
    years. We can say it started earlier, but that wasn&#x27;t true of the <i>majority</i>
    of goods until around then. Things became &quot;disposable&quot; when the functional
    innards were reduced to a blob IC. LED lighting taking over pushed it even further.<p>&gt;
    Japanese consumer technology meant something incredibly precious to people in
    underdeveloped and developing nations.<p>I&#x27;m sorry, but I can&#x27;t agree
    with this. I grew up pretty damn broke (like unreliable water kind of broke).
    Perhaps not as broke as you&#x27;re describing, but there has always been some
    bittersweet resentment in the back of people&#x27;s minds this whole time too.
    Casio watches are <i>the poster child</i> for exactly the decline you claim to
    be concerned about. Older people I grew up around were not so materialistic.<p>Yes,
    they are stylish in a very cool and functional way that deserves more credit.
    It&#x27;s a very ethically justified and postmodern-inspired genre of design.
    It&#x27;s like jazz. It&#x27;s fantastically free of dogmas and tropes. People
    can fearlessly contribute their own cultural perspectives and elevate everyone&#x27;s
    taste in the process. Let&#x27;s keep it that way, by not hugging it to death.<p>&gt;
    There is a beauty and a tragedy in those vintage Japanese watches.<p>Yes, exactly.
    That&#x27;s the tragedy. We finally got what we wanted since the beginning of
    human history, but at what cost?"
