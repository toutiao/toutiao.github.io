  author: VLM
  text: I had a CFX-400 back in the day and it was much more convenient to use it
    than to not use it.  The option of running newtons method by hand on paper was
    much more annoying than using the watch.  I mostly used trig features IRL.<p>As
    you can see by the small text above and below the screen you pushed F1&#x2F;F2
    to select the scientific operation you wanted and then &quot;exe&quot; it.  I
    don&#x27;t recall how &quot;inv&quot; worked, if you selected sine and then inv
    to arcsin() it or if you tapped inv as a modal and then &quot;exe&quot; while
    its inverted.<p>It really wasn&#x27;t any harder to use than any calculator watch
    ever shipped.  I imagine no one under age 40 has ever used a calculator watch
    but they were pretty easy to use, just imagine a basic phone calculator app on
    your wrist but easier to use tactile because of the keyboard.<p>Its primary downfall
    was 1) being very expensive compared to carrying a HP calculator in your pocket
    2) the buttons and general construction were extremely delicate, the body was
    just chrome plated plastic IIRC.<p>Watches in the 80s were like phones in the
    2010s it was assumed you&#x27;d only get a couple years use out of them before
    &quot;having to&quot; replace them due to poor components or style, so there&#x27;s
    no reason to ship a long term reliable one.  These were not &quot;Rolex&quot;
    lifetime purchases LOL.<p>Watch bands were also designed to rapidly fail, kind
    of like fitness bands today.<p>Watches in the 80s were a very consumerist hobby.  Consumerism
    changes the individual items but the pattern never changes.<p>Extreme sensor watches
    were similar to extreme calculator watches but in the 90s.  I had a DPX-500, very
    nice.  The barometer drifted too much to be usable.  The compass worked very well.  As
    an &quot;outdoor&quot; watch it was fairly durable, rather like desk workers buying
    &quot;offroad&quot; SUVs that are never driven offroad as the only way to buy
    a reliable car.
