  author: anyfactor
  text: I often tell myself that I am conscious and rational when it comes to gifts.
    I don&#x27;t care about brands, but rather the value something offers. Yet I do
    have a soft spot for &quot;Made in Japan&quot; Casio vintage watches and Sony
    devices.<p>To me, they represented the highest form of functional and consumer
    utility at a justified price. No fluff, no marketing that bordered on propaganda.
    Japanese consumer technology meant something incredibly precious to people in
    underdeveloped and developing nations.<p>It wasn&#x27;t just about utility. It
    was about social status, too, and owning a generational asset that would continue
    to work for decades.<p>A Japanese consumer device meant that you had worked hard
    to afford a luxury, and that luxury did not derive its merit from a brand name,
    but rather from manufacturing ethics, quality, and the long-term, sustainable
    value it offered, all while being at the cutting edge of technology.<p>A Rolex
    watch uses essentially the same mechanical principles that have existed for generations.
    Its merit today is largely in its brand, not in being at the cutting edge of technology.
    An iPhone, on the other hand, is largely seen as consumable. Most modern electronic
    devices are treated as disposable, depreciating products.<p>But a Made in Japan
    Casio watch in the 1980s or 1990s was an asset.<p>There is a beauty and a tragedy
    in those vintage Japanese watches.<p>I see it when I talk to people in their 60s
    or 70s who struggled to raise families in developing countries on middle-class
    incomes. A Casio calculator for their children when they start their high school.
    A Sony TV for the family to gather around and watch. A Toyota as their first family
    car.<p>These weren&#x27;t merely consumer products. They were milestones. They
    represented years of hard work, sacrifice, aspiration, and the dignity of finally
    being able to afford something that was genuinely well made. Something that would
    last. Something that could be passed down.<p>I don&#x27;t want to hear about GDP,
    artisanal blue jeans, or deer based tourism industry when it comes to Japan. I
    see how an industry and an economy that once produced these things on such an
    extraordinary scale have been diminished.<p>I don&#x27;t want to rationalize it
    or dissect it.<p>I simply find it truly beautiful what that nation once built
    on an industrial scale.
