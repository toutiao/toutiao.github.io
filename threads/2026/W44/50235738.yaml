  author: nstart
  text: Seeing comments here arguing about the quality of this. To me it shows how
    much loss of love there is for the details in arts. Episode 1 for example immediately
    starts with jank when the camera shifts to the closeup of the guy packing the
    bag. Suddenly the woman in the background is in a position that should be impossible
    relative to where he was in the first shot. In any normal film it would be jarring.
    A 1st semester film student with a smartphone would know to setup the scene better
    than that.<p>Saw folks saying it improves in each episode. Skipped to chapter
    6. First shot shows a disjointed stairway. And then a boy coming skating into
    view in a different spot and picking up the board which flips in an impossible
    way.<p>There&#x27;s interesting stuff being experimented on in the AI video space
    that I keep an eye on. The Naruto &quot;live action&quot; is an interesting experiment
    that pushes the boundary on character + scene control. It&#x27;s obvious copyright
    to me and probably gets far purely because of the source material it can reference.
    Which means artists have done a lot of the visual hard work already. But it&#x27;s
    still a good example of where the frontier could be if piloted carefully. This
    kono express however, is in fact, slop.
