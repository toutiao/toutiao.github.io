  posted_at: '2026-10-25T23:17:54Z'
- id: '50237024'
  parent_id: '50236934'
  author: dahart
  text: "“Better” is a loaded word. When you write your own renderer, you have a lot
    more control and a lot more support. Renderers at the time had not all converged
    on the same algorithms, so you could have a competitive advantage by writing a
    good one. PDI’s shader system was different than RenderMan’s and had some real
    advantages — compiled shaders, geometry &amp; light shaders (not just materials),
    particles &amp; particle shadowing, compositor integration, etc.. The renderer
    also needs to integrate into the pipeline deeply, so PDI’s renderer fits the PDI&#x2F;DW
    pipeline better, whereas with RenderMan you have to try to mold the pipeline to
    fit the renderer in."
  score: 0
