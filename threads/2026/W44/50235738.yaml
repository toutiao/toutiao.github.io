  author: dahart
  text: "&gt; The designers would fully texture out the inside of a dresser draw that
    will never be showing in the film. The idea was imagine how much attention to
    detail<p>Hehe, as an ex FX animator&#x2F;TD, this sounds kinda funny to me, there’s
    likely more to the story. If they knew for sure the textures weren’t going to
    be shown, it’s a waste of time, not craftsmanship or attention to detail. But
    it’s plausible because often modeling &amp; surfacing departments have to start
    work before the shots &amp; camera are fully planned. And sometimes there are
    camera changes late in the production. It could be that someone’s shot that saw
    the inside of the dresser drawers got cut, that surfacing expected the drawers
    to be open in a shot, or that a scene inside the drawer was in storyboards but
    didn’t make it to layout, stuff like that happens a lot. But no productions are
    having artists work on stuff that they know will never be shown in the film."
