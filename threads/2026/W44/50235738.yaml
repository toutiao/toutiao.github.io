  author: dahart
  text: Oh definitely - custom vs commercial. I remember the R&amp;D team having to
    write a yearly report to justify the development expenditure, explain repeatedly
    why we were writing custom tools &amp; renderer when these things were available
    off the shelf. I heard a few strong rants here and there about how the suits just
    didn’t understand. I remember the term “NextGen” being thrown around but I don’t
    remember if I lived through it or it was just getting started when I left (before
    S3). Jono I and tried for a while to stop having our shaders rewritten in C++
    (without otherwise changing them nor adding any features). We eventually gave
    up and just kept building new things, but that was a fairly successful strategy
    to nudge the IP, tech, and support southward. Possibly the right strategy in retrospect,
    but felt a little rough at the time.
