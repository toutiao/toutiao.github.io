  author: Brian_K_White
  text: Stereo lithography using lasers, vs &quot;sla&quot; now has nothing stereo
    about it nor lasers, just an lcd screen that exposes a 2d slice.<p>Why it&#x27;s
    better is a little complicated and maybe not all one-way.<p>Definitely there are
    a lot of difficulties inherent in the way the lcd type has to move the part for
    every layer and fight a lot of suction every time, damaging a film that needs
    to stay optically perfect, frothing up the resin with bubbles yet another source
    of optical defects.<p>Maybe the laser machines have their own problems but not
    having to move the part (or move it much less and in a different less violent
    way) and not having to physically abuse an optical part has to make some difference.
  score: 0
