  author: krisoft
  text: "&gt; what would I do if this is my first 3D printer<p>Resin printers are
    very special type of printers. They are great at some things (tiny intricate details,
    surface quality). They are absolutely the worst in other ways (soo much faff with
    post curing). If you need their pros you can’t do much else but suffer the cons.
    But you should really think through what you want to print before getting one.<p>Your
    question is a bit like: “what if my first shovel were an excavator?” Having an
    excavator is great when you need one. But if you don’t need one it is a complete
    nightmare compared to other shoveling solutions.<p>&gt; I don&#x27;t have the
    ability to wash and cure<p>I don’t know what you mean by lacking the ability?<p>If
    it is not knowing how, then the simple answer is to buy the wash+cure formlabs
    sells with the printer and follow the instructions. Best if you watch a video
    tutorial first before you even buy the printer so you can decide if you have the
    space, want to bother with resin printing."
