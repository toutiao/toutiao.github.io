  author: Joel_Mckay
  text: Consider water-soluble resin, but always use 99% IPA to wash.  First, dab
    with tissue paper to soak up drips, wash in used&#x2F;dirty IPA, and then wash
    again in clean IPA. This will remove most if not all uncured resin.  You should
    be able to hit within 0.1mm repeatability with anti-aliasing turned off.<p>Finally,
    the UVA cure chamber must be able to kick off the resin. After 15min on each side,
    then wash the build with a hand cleaner. Place all PPE like gloves in a clear
    bag, and leave in the sun on both sides for 1 hour.<p>&quot;USD700&quot; is almost
    double what a mid-sized Creality printer costs, and aftermarket 3M flex plate
    kits are about $30.<p>Without a garage&#x2F;outdoor&#x2F;lab work-space people
    shouldn&#x27;t buy stinky resin printers. =3
