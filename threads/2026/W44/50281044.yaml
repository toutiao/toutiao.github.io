  author: dofm
  text: Your regular printer, like mine, presumably puts down a line of melted plastic
    material with an extruder, bit by bit, so the print time is guided by complexity
    as well as size.<p>Resin printers, basically, are stereolithographic. They:<p>-
    dip the build plate (upside down) into a thin tray of resin<p>- push it all the
    way onto onto a screen at the bottom of the tray<p>- blast that screen with UV
    through a translucent LCD display that contains a mask image of the current &quot;slice&quot;
    of the whole plate, enough that the thin layer of resin partly cures<p>- lift
    the plate out of the resin so it peels off the screen and the resin replenishes
    below it<p>- repeat, with the next slice.<p>- then the whole model is taken out
    by hand,  washed off, blasted with UV light to completely cure it, and the (more
    or less inevitable) supports snipped off.<p>So instead of printing line by line,
    the entire plate prints layer by layer — a small print takes (approximately) the
    same time as a full plate.<p>There are several big differences, notably that it
    is single-colour, much higher resolution, the various peel&#x2F;adhesion forces
    are managed differently, larger parts need to be hollow with a vent so uncured
    resin drains out, most resin prints are quite brittle, and the whole process is
    traditionally really rather cytotoxic.<p>There are eco resins, tough resins, and
    printers that do a better job of not being chemically evil; this is one.<p>I&#x27;ve
    stayed away from it, because it&#x27;s not the kind of printing I need (for all
    except one part that I might end up subcontracting) and because it is chemically
    nastier than b&#x2F;w darkroom printing, which until now has been about my limit
    of risk.<p>The above is a bit of an oversimplification but it covers the main
    differences I think (happy to have corrections&#x2F;additional comments)<p><a
    href="https:&#x2F;&#x2F;formlabs.com&#x2F;uk&#x2F;blog&#x2F;ultimate-guide-to-stereolithography-sla-3d-printing&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;formlabs.com&#x2F;uk&#x2F;blog&#x2F;ultimate-guide-to-stereolithogr...</a>
  score: 0
