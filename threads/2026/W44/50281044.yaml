  author: Joel_Mckay
  text: Resin is fairly inert once fully cured + aged&#x2F;dried 2 weeks, but in its
    uncured state PPE should always be used. The uncured resin contact with skin is
    known to sometimes cause autoimmune sensitivities like allergic reactions. If
    you ever get blisters or a rash, than you are likely no longer able to work around
    acrylic resins and paints.<p>Always protect your skin, eyes, and lungs... even
    when the SDS&#x2F;MSDS doesn&#x27;t explicitly warn of currently known possible
    exposure hazards.<p>In general, treat it the same as paint with a booth&#x2F;tent,
    exhaust fan,  and paper-lined drip pan for when(not if) the membrane perforates.
    If the object is small, one could also use 100% infill so it may be cleaned properly
    (coating prints in a automotive UV-resistant clear acrylic spray paint a few weeks
    later prevents yellowing, and reduces handling risks.)<p>Around 40% of people
    will get cancer in their lifetimes, and most will never know. In general, avoiding
    physical contact with organic solvents is a good idea, and be pleasantly surprised
    if it turns out to be an overly cautious decision. =3
