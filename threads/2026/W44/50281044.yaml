    while the PC software that produces the layer images can be replaced, the printer&#x27;s
    brains stays the same.<p>(This is very different compared to the world of conventional
    world of FDM printers, wherein:  It&#x27;s just some sensors, motors, heaters,
    and sensors; a screen, if present, is optional.  A person can replace the brainbox
    of a traditional FDM Cartesian rig with open, off-the-shelf parts and be printing
    <i>something</i> in an afternoon, and there&#x27;s a whole industry providing
    parts to support this kind of thing.<p>ChiTu isn&#x27;t that way.)'
