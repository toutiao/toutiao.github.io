  author: bell-cot
  text: If you&#x27;re unfamiliar, there is a <i>lot</i> of historical context around
    Pascal&#x27;s Wager -<p>Unless you live in a brutal theocracy, it&#x27;s difficult
    to describe just how powerful institutionalized Christianity was at the time.  Likewise
    the scale of religion-themed violence.  A couple generations before Pascal&#x27;s
    birth (in France), the Catholic-vs.-Protestant <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;French_Wars_of_Religion"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;French_Wars_of_Religion</a>
    had kill off something between 10% and 25% of the population of France.<p>Pascal&#x27;s
    own religious beliefs changed several times - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Blaise_Pascal#Religious_conversion"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Blaise_Pascal#Religious_conver...</a><p>The
