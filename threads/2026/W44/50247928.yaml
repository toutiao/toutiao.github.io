  text: People always leave off the <i>second half</i> of Pascal&#x27;s Wager. Pascal&#x27;s
    Wager is not simply that you can map out the odds vs risk and decide being a theist
    is more practical. But rather that if you take the odds, decide to be a theist,
    <i>then start acting like one (participating in rituals, living like one, practicing
    what is preached, etc)</i> then you may find God through those actions.
