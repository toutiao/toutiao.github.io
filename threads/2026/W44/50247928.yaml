  author: Animats
  text: |-
    That&#x27;s true at the beginning of a new field. I&#x27;m noted for some advances in network architecture. But when I did that, everybody working on the Internet could meet in one large classroom.
    If you were reasonably good, you could make major progress.<p>Computer science used to be <i>tiny</i>. In the late 1970s, AI was a few tens of people at MIT, at Stanford, and at CMU, with a few smaller groups elsewhere. I met about half the greats of my generation, as did everyone else who was serious.
    There were almost no textbooks in the early 1970s. When Knuth&#x27;s <i>Fundamental Algorithms</i> came out, it was great to finally see what had previously been folklore on mimeographed sheets in an actual book.<p>I was involved with Autodesk in its very early days. Even went to the founding meeting. The feeling was that PCs were finally getting big enough to be interesting. The founders were all mainframe programmers, and the people who came up from 4K memory on an 8088 had no idea how to organize a big program. But mainframe people did.<p>There was a vast emptyness in the product space ready to be filled. Products considered were a window manager (&quot;AutoScreen&quot;), a text editor (Kern Sibbald actually built that), a database, and a CAD program. None of those existed yet as successful products.
    CAD was picked because the productivity gain was so huge vs. paper and pencil drafting. At the time, the state of the art in drawing editing was drawing on mylar and using an electric eraser to delete. Then you ran the Mylar master through a big copier to make blueprints or whiteprints.
    A CAD system on a PC was a very easy sell.<p>So all you had to do was make it work. No need to overcome the noise level of a thousand similar &quot;apps&quot;.
  score: 0
