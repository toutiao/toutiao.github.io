  author: rf15
  text: That&#x27;s sadly impossible, because the brain, as a limited number of cells,
    cannot store infite data. The problem lies in the people observing them, but you
    have some fun mechanisms (and a few of the commonly known fallacies and biases)
    at work here, that can all contribute to that perceived effect&#x2F;illusion.
    Consider the following ideas:<p>- people can be slightly better than a given random
    observer, because they learned and prioritise to pay attention. They are better
    at recalling memorable and minor details, especially in short term memory and
    in memorable situations that a lot of people share long term. They will still
    forget long term information that is irrelevant.<p>- any such person and also
    observer can easily talk themselves into the belief that their skill must be absolute,
    especially since the observer will largely only test from his own inferior dataset.<p>-
    once the belief takes hold (because people love a good story), observers tend
    to look less for flaws and more for further confirmations to keep mythologising
    people.
