  author: TimTheTinker
  text: That may be true, but embodied human life and history provides a base set
    of axioms by which to evaluate further axioms -- starting with the 5 senses.<p>So
    yeah, Christianity has some axioms, but it doesn&#x27;t ask people to merely accept
    them on faith; that&#x27;s a mischaracterization. The invitation is to consider
    (a) how good the evidence <i>really</i> is for your current worldview, and then
    (b) how good is the evidence for Christianity&#x27;s truth claims.<p>Pascal goes
    one further and suggests considering what you have to gain and lose either way
    -- which may have been helpful for some when the alternative was mere atheism
    or unbelief in Christianity, but I disagree that it&#x27;s helpful in all cases.
    People coming from Islam have a tremendous amount to lose, including their family,
    community, livelihood, reputation, and the risk of being condemned eternally by
    Allah for committing <i>shirk</i> in embracing Christianity, if Islam is true.<p>I
    think a better question to ask, whatever someone&#x27;s background, is &quot;do
    you want to know the truth, even if it turns out you don&#x27;t believe it now,
    and are you willing to follow it no matter what the cost?&quot;
