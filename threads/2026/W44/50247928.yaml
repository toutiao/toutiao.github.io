  text: "&gt; Budapest around 1900 produced an absurd cluster of minds: von Neumann,
    Eugene Wigner, Edward Teller, Leo Szilard, Paul Erdős, Theodore von Kármán, George
    Pólya.<p>Not to mention Nikola Tesla about 20 years prior.<p>&gt; When several
    of them turned up at Los Alamos and realized they had gone to high school together,
    Szilard joked that Hungary was a cover story for a Martian landing.<p>What if
    there actually are people who go to Mars in the future but regret it and the only
    way for them to come back to Earth is to invent a time machine and be reborn as
    a mathematical supergenius. That would explain this at least:<p>&gt; At six, Janos
    (the OG hungarian name for Johnny) could divide eight-digit numbers in his head
    and hold a conversation in ancient Greek. He later added Latin, French, German,
    English, and Yiddish.  The rumor was that he remembered everything he ever read.
    Many years later Herman Goldstine decided to test this by asking him to recite
    &quot;A Tale of Two Cities.&quot; Von Neumann started on chapter one and had to
    be asked to stop fifteen minutes later."
