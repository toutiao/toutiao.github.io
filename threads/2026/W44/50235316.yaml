  author: voidhorse
  text: So, I think it&#x27;s important to bear in mind that the prophecy is to some
    degree self-fulfilling.<p>People in technology read science fiction. That reading
    in part informs and inspires the kinds of things they work on and explore. This
    is illustrated pretty directly with the new Tesla vehicle and various deferred
    dreams of flying cars—this is not an innovation influenced by practicality, it
    is influenced by regressive adolescent fantasy.<p>I think there&#x27;s some degree
    of that in a lot of technical innovation. Yes, it&#x27;s still uncanny how well
    Gibson tracked developments (or perhaps equally, how much his fiction has influenced
    the kinds of things people pursue, consciously or otherwise).
