  text: I will note William Gibson definetly wasn&#x27;t in any traditional sense
    a tech enthusiast.<p>In Novemember 1994 he said:<p>&quot;I don&#x27;t have an
    e-mail address, I don&#x27;t even have a modem. As much as I admire the Internet
    I suffer literally agoraphobia, which in it&#x27;s original sense means a fear
