  author: delichon
  text: Over the last four decades I&#x27;ve written several food logging apps for
    my own use. They&#x27;ve never been good enough to release, because I&#x27;ve
    always wanted more from them. But last week I made one in about a half hour that
    is by far the best I&#x27;ve ever written or used.<p>I added a GrokBot, told it
    that it is my food logger, and to create a Google spreadsheet with the columns
    and sheets I need. After a couple of short iterations it was ready to go. Now
    to log anything I just prompt the bot with a little voice, text, or a photo of
    a meal, and it makes a (usually accurate) guess about what exactly I mean, looks
    up the nutrient stats, and logs it to the spreadsheet. To change any feature or
    refactor the spreadsheet I just describe the change and boom.<p>Before LLMs this
    would have been magic for a sophisticated developer, now it&#x27;s table stakes
    for the frontier AI vendors available to any muggle. This was Eunice slapping
    me in the face and shouting Wake Up!
