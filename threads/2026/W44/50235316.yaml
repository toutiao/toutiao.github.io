  author: egypturnash
  text: '&quot;Pournelle claimed to be the first author to have written a published
    book contribution using a word processor on a personal computer, in 1977.[62][63]&quot;<p>-
    wikipedia<p>On a computer that cost him $12k in 1977 dollars (~$66k in 2026 dollars)
    for &quot;14 lines of 64 characters on a monochrome monitor the size of a small
    black and white TV&quot;, according to the article that footnote 62 refers to
    (<a href="https:&#x2F;&#x2F;www.theverge.com&#x2F;2017&#x2F;9&#x2F;9&#x2F;16279582&#x2F;jerry-pournelle-science-fiction-author-writing-computers-obituary"
    rel="nofollow">https:&#x2F;&#x2F;www.theverge.com&#x2F;2017&#x2F;9&#x2F;9&#x2F;16279582&#x2F;jerry-pournelle-s...</a>).
    Computers were <i>hilariously</i> expensive back then. Pournelle had a lot of
    money to burn and got real good at getting free stuff due to his Byte column.<p>An
    Apple ][ with 4k of RAM was $1200 in 1977 (~$7k now) (plus monitor, drive, and
    printer, also maybe a bit more than double the computer&#x27;s price for a 48k
    machine). Not as expensive as whatever Pournelle bought but still a pretty major
    purchase.<p>A new typewriter in 1977, meanwhile, would run you about $50-170.
    About $300-950 in 2026 bucks. Less for a used one from the local pawn shop or
    typewriter repair shop or whatevs.<p>William Gibson, meanwhile, was a broke-ass
    teacher with a collection of punk records when he wrote <i>Neuromancer</i>, around
    1982-1983. It&#x27;s really no surprise he used a typewriter.'
