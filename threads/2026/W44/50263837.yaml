    The First Amendment has historically protected us from government-imposed identification requirements tied to receiving information. In [_Lamont v. Postmaster General_](https://supreme.justia.com/cases/federal/us/381/301/), the Supreme Court struck down a law requiring recipients to affirmatively identify themselves before receiving certain political publications. The same principle applies to web crawling: requiring people to identify themselves as a condition of accessing publicly available information burdens the freedom to receive information.

    That concern is heightened when laws use vague language. If researchers cannot easily understand what it means to “deploy” a crawler in a prohibited way, or what activity is “reasonably likely to burden or impair a website,” they may refrain from scraping rather than risk violating the law.

