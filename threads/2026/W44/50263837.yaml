  author: AnthonyMouse
  text: "&gt; Someone who is using a residential proxy network, headless browsing,
    and&#x2F;or TLS fingerprint manipulation to evade rate limits and other controls
    to issue large volumes of automated requests under a deceptive UserAgent string
    isn&#x27;t difficult to describe and differentiate versus a normal user using
    a UA.<p>So then why isn&#x27;t it trying to prohibit making multiple requests
    from different IP addresses in a residential proxy network, rather than the thing
    it actually does?<p>&gt; The proposed text of the bill is rather straightforward.
    It turns more on the &quot;stealth&quot; bit than &quot;bot&quot;.<p>Not really,
    look at the definition of &quot;STEALTH BOT&quot; -- the only thing that nominally
    distinguishes it from a browser is the word &quot;bot&quot; which isn&#x27;t itself
    defined, because the phrase &quot;without prior disclosure of its identity and
    purpose&quot; is something that a normal web browser doesn&#x27;t do either.<p>It
    can&#x27;t even get it out of it via &quot;a valid and accurate user-agent string&quot;,
    both because that clause says <i>or</i> and it still fails the second one, and
    because &quot;a valid and accurate user-agent string&quot; is a nonsense phrase.
    The Safari user agent strings start with &quot;Mozilla&quot; even though it&#x27;s
    not. The Android ones do the same and then include &quot;AppleWebKit&quot; and
    &quot;Mobile Safari&quot; too. A browser extension uses the user agent string
    of the browser regardless of what the extension does. When Debian packages their
    version of Firefox, its user agent string says Firefox and not Debian.<p>User
    agent strings don&#x27;t have a registry. &quot;Valid&quot; has no meaning and
    &quot;accurate&quot; is contrary to the default behavior of common browsers."
