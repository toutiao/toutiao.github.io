  author: scotty79
  text: If you have an endpoint with interesting information and you don&#x27;t want
    it spammed with requests, require a proof of work from the client, scale up the
    hardness of it as the load goes up so it never exceeds what&#x27;s comfortable
    for you. Even a hard proof of work won&#x27;t slow down somebody that makes one
    request per second because they are reading the site but will sighificantly interfere
    with crawlers that hit you 10000 a second currently at very little cost to them.<p>The
    module doing proof of work might be a part of your frontend that is static and
    on CDN.<p>If you want agents still have access to your data, just not through
    scraping, provide alternative format for them. Like periodic sqlite dump.<p>I
    made a prototype of such PoW two years ago. A challenge is a random number. Checking
    the client&#x27;s solution is calculating one hash of the challenge glued to client&#x27;s
    solution and checking if the resulting hash is less than a specific value. The
    lower the value, the harder the task for the client to do. Client needs to calculate
    this hash multiple times to find a response that will result (when glued with
    challenge) with low enough hash.<p>The server needs to keep short lived cache
    with challenges so the client can&#x27;t just make up one or reuse another solution
    and provide two responses for every challenge, first, very small and fast with
    a challenge, and the second one with actual content (if response was correct).
    Nothing much worse than CORS preflight.
