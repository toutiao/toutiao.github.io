    # Breaking the Open Web Won’t Stop the Bad Bots
    Lila Bailey, Tess Vartanian / Oct 27, 2026

    ![](https://cdn.sanity.io/images/3tzzh18d/production/46070e9d00c44c7690c79155723ff59e5c1280fe-1200x675.png)
    _A close up of a spider in its web. Valeriia Neganova/Unsplash_

    [
    Republish
    ](/republish)

    [Late last month](https://digiday.com/media/conde-nast-hearst-among-300-media-execs-to-push-federal-bad-bots-bill-on-ai-scraping/), more than 300 representatives from major media outlets were on Capitol Hill to advocate for the [Stealth Bot Prohibition Act](https://www.congress.gov/bill/119th-congress/house-bill/9915/text). They came with a legitimate grievance. Newsrooms are being hit by a surge of automated traffic, mostly from AI developers. AI developers extract enormous volumes of online content and then potentially deprive website owners of referral traffic and ad revenue with generative AI features and chatbots trained on that content. It is a real problem that deserves a real solution. But this bill doesn’t directly target the harms caused by abusive crawling. Instead, it would force anyone accessing a website automatically to identify themselves and their purposes for collecting public information. Rather than protect journalists, the bill threatens a basic tool they, and many others, rely on to gather information online.

    Cutting-edge investigative journalism relies on automated data collection. In 2022, a Pulitzer-winning Wall Street Journal [investigation](https://www.wsj.com/finance/regulation/government-officials-invest-in-companies-their-agencies-oversee-11665489653) analyzed over 31,000 financial disclosures from 12,000 senior government employees, revealing that nearly a quarter of federal officials traded stock in industries their agencies regulated. To conduct an investigation at that scale, the Journal relied on web scraping: an automated process where a software bot, known as a crawler, browses the internet and collects information. This fundamental tool of the open web is now under threat from bills that purport to target “stealth crawling,” but in reality would hamper legitimate public-interest activities, including preservation, journalism, research, and security.

    Again, aggressive, large-scale scraping is a real problem — particularly as demand for AI training and content has exploded. It can overwhelm websites, increase costs, and threaten institutions that produce and preserve knowledge, including commercial publishers, [Wikipedia](https://diff.wikimedia.org/2025/04/01/how-crawlers-impact-the-operations-of-the-wikimedia-projects/), [libraries](https://journal.code4lib.org/articles/18489), and the [Internet Archive](https://blog.archive.org/2026/09/15/an-update-on-wayback-machine-access/), where one of the authors of this piece works.

    In an apparent attempt to reduce or eliminate problematic scraping practices, proposed bills, like the federal [Stealth Bot Prohibition Act](https://www.congress.gov/bill/119th-congress/house-bill/9915/text) and New York’s [Stealth Crawler Prohibition Act,](https://legislation.nysenate.gov/pdf/bills/2025/S9934A) would impose sweeping prohibitions on anonymous scraping without addressing the real harms.

    Both bills define a “bot” or “crawler” as software that “retrieves, scans, indexes, scrapes, or otherwise accesses a website or other internet source.” A bot is “stealth” if it fails to disclose its identity and the “specific nature and purpose of the bot.” Under the federal bill, the FTC can pursue penalties of up to $53,000 if a person uses a stealth bot in a way that is “reasonably likely to damage, impair, or burden” a website’s “technical or commercial operation.” The bill provides no definition or standard of what is reasonably likely to impair a website. Under the New York bill, which only applies to covered news sites, a publisher can obtain a subpoena to unmask a crawler’s identity without requiring a showing of any harm.

    Knowing the identity behind a crawler tells us relatively little about whether its behavior is harmful. Under the New York bill, a company that discloses its identity and then accesses the website 10,000 times a minute complies with the law even though it is still imposing enormous and likely unjustified costs on the site. But a journalist anonymously using a crawler to [investigate](https://themarkup.org/amazons-advantage/2021/10/14/amazon-puts-its-own-brands-first-above-better-rated-products) potentially anti-competitive practices by tech companies does not. Many of the most socially valuable uses of crawling require anonymity. Revealing a crawler’s identity and purposes can change the very nature of the information that is collected; if the subject of the study knows it is being observed and by whom, its behavior will change. That is the point of studying it anonymously.

    Moreover, not all automated data collection is abusive, and not all of it is used to train AI, but these proposed bills risk deterring archivists, researchers, and civic technologists from using automated data collection tools out of fear of liability. Journalists use scraping to analyze public records, as in the WSJ story. Researchers use it to study online [discrimination](https://www.aeaweb.org/articles?id=10.1257/app.20160213) and [misinformation](https://www.cip.uw.edu/).

    The Internet Archive’s [Wayback Machine](https://web.archive.org/) has used crawlers to archive more than one trillion webpages, creating a historical record of the internet that would otherwise constantly change or disappear. That archival record has helped provide the factual background for thousands of news stories, evidence in hundreds of court cases across the country, and often simply a backup for when things go wrong.

    It is not just archivists who rely on scraping to advance the public good. Disability advocates have [used](https://webaim.org/projects/million/?utm_source=chatgpt.com) scraping to automatically evaluate over one million websites to detect accessibility problems. Public health researchers use scraping to track the [opioid epidemic](https://pmc.ncbi.nlm.nih.gov/articles/PMC7367521/) as well as [misinformation](https://formative.jmir.org/2024/1/e44726) surrounding addiction and treatment. The federal government relies on crawlers to scan for threat detection, [offering](https://www.cisa.gov/cyber-hygiene-services) free cybersecurity services to organizations across the country. And for some of these users, anonymity is essential to the integrity and safety of their work. For example, environmental researchers gathering information from public corporate disclosures or satellite image portals may fear retaliation from the companies they are investigating.

