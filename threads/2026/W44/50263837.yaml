  text: Someone who is using a residential proxy network, headless browsing, and&#x2F;or
    TLS fingerprint manipulation to evade rate limits and other controls to issue
    large volumes of automated requests under a deceptive UserAgent string isn&#x27;t
    difficult to describe and differentiate versus a normal user using a UA.<p>The
    proposed text of the bill is rather straightforward. It turns more on the &quot;stealth&quot;
    bit than &quot;bot&quot;.<p>(a) Prohibition.—A person may not—<p>(1) deploy, direct,
    or cause to be deployed, a stealth bot to access a website, digital platform,
    or online service in a manner that is reasonably likely to damage, impair, or
    burden the technical or commercial operation of a website or other internet service;
    or<p>(2) intentionally misrepresent, conceal, or obscure the nature of the bot
    to appear as a human user for use in connection with a generative AI model or
    service.<p>(6) STEALTH BOT.—The term “stealth bot” means a bot that accesses,
    retrieves, scans, indexes, scrapes, or otherwise interacts with a website, digital
    platform, or online service without prior disclosure of its identity and purpose,
    in particular by—<p>(A) failing to identify itself including through a valid and
    accurate user-agent string; or<p>(B) failing to disclose the specific nature and
    purpose of the bot, including any proposed use and purpose of page content (including
    text and data mining, search indexing, inferencing, artificial intelligence development,
    support, or operations (such as training, fine tuning, retrieval augmented generation))
    or other automated processing at the time access is requested and in a format
    that the website operator can access.
