  author: AnthonyMouse
  text: "&gt; User agent strings are a sad consequence of websites incorrectly parsing
    them to enable functionality, resulting in a &quot;every bug becomes a contract&quot;
    type of situation.<p>Which is precisely why trying to legislate them is folly.
    Obviously the reason Android calls itself &quot;Mobile Safari&quot; is so that
    servers send it the mobile version of the site instead of the desktop one etc.<p>Which
    makes &quot;accurate&quot; an unreasonable requirement, since there is already
    a preexisting non-waivable requirement for <i>inaccurate</i>. When someone is
    making their &quot;turn a web page into a PDF so you can view it later on the
    plane&quot; software or whatever, it has to use a user agent string that will
    cause the site to send the version you need turned into the PDF.<p>&gt; That being
    said, if you include GOOGLEBOT in your 1k long query string, alongside a very
    long page describing your crawlers, how to identify them, how to block them and
    how to set limits, no judge will find you guilty of concealing your purpose.<p>First,
    you&#x27;re assuming that the person being prosecuted is the entities who are
    the nominal targets of the bill, when the real problem is when they&#x27;re <i>not</i>.
    Because you&#x27;re proposing a law that says anybody with an inaccurate user
    agent string is in violation, meanwhile <i>everybody</i> has an inaccurate user
    agent string.<p>Moreover, consider what you expect the outcome of legislating
    something like this is going to be. Sites could then try to either blacklist or
    whitelist user agents.<p>If they do the first one, that doesn&#x27;t work, because
    the scraping service can change it whenever they want.<p>If they do the second
    one, that doesn&#x27;t work, because now every third party has to start pretending
    to be a common browser even when they&#x27;re doing something totally innocent
    or they get blocked by default for being something else. Which makes the user
    agent string even less useful than it is now, <i>and</i> subjects innocent parties
    to arbitrary liability for doing something they have to do or their client is
    broken.<p>&gt; As for why the law is written as is instead of banning more specific
    functionality, it&#x27;s so assholes don&#x27;t get any ideas on how to bypass
    it.<p>You&#x27;re describing autocracy. The way you make it so that you always
    prosecute someone is to make it so that you can always prosecute anyone, which
    is <i>very bad</i>."
