  author: Shank
  text: 'I feel like the average tech enthusiast just assumes that most people have
    computers, but they do not. Most people have a phone as a primary computing device.
    Tablets have gone up in popularity, but for a significant portion of people, their
    only device is a phone. Those people are buying phones on carrier financing or
    other deals, so they don&#x27;t even see the full cost of their device at all.
    So for people doing this type of upgrade cycle, a folding phone is quite compelling:
    an expanded screen size for watching video, consuming content, or heck, even maybe
    productivity, while being effectively a marginal upgrade in cost on a monthly
    payment.<p>Also, just for the record, some carriers in Japan are offering financing
    that gives you the option of paying over 48 months and Apple offers 36 months.
    Is that quite absurd to most people? Absolutely, but for the average person who
    wants a bigger screen sometimes, the cost is not even going up much on a monthly
    basis.<p>For the record, especially in Japan, folio cases where you open your
    phone like a book are already the default. Effectively most people on the train
    have their phone open in some &quot;Duo-ish&quot; form-factor already. So the
    jump from a folio case to a folding phone is already substantially lower.<p>Obviously
    the gimmick nature of folding is not the compelling reason why people want folding
    phones. The question is more about tradeoffs, and I think that especially in asia,
    the demand for folding phones is quite obvious: upgrade your primary PC to have
    a huge display when you want it that way, otherwise it stays compact enough to
    be with you all the time.'
  score: 0
