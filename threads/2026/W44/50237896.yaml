article:
  url: https://www.ifixit.com/News/119895/iphone-duo-teardown
  title: 'iPhone Duo Teardown: The Most Repairable Foldable Has a Huge Screen Problem
    - iFixit'
  fetch_status: success
  content: "Apple’s folding iPhone finally made it to our teardown table. Some owners’
    screens [didn’t make it through setup](https://www.reddit.com/r/iPhoneDuo/comments/1xdqmmc/didnt_even_make_it_through_setup_before_i_had_the/).\n\nAfter
    fifteen years of [patents](https://patents.google.com/patent/US8929085B2/en) and
    [rumors](https://www.macrumors.com/2016/12/16/lg-foldable-displays-iphone/), the
    iPhone Duo is here, and repair shops may not have long to wait for their first
    customers. Owners are already [reporting cracks and bright lines along the fold](https://www.macrumors.com/2026/10/23/iphone-duo-screen-cracks/).
    Though Apple’s offering replacement units for now, any out-of-warranty screen
    damage will cost [$999](https://www.ifixit.com/News/119797/how-the-iphone-duos-crazy-repair-prices-compare).
    So of course we wanted a closer look at what’s happening underneath.\n\n![iPhone
    Duo accordioned out](https://valkyrie.cdn.ifixit.com/media/2026/10/24232224/iPhone-Duo_94.jpg)\n\nFirst
    gen hardware teething pains aside, there’s plenty to admire in the iPhone Duo.
    Apple borrowed some of our favorite repair tricks from ordinary iPhones: batteries
    that release with electricity, an outer screen that’s pleasantly simple to remove,
    and lots of components you can reach without dismantling half the phone.&nbsp;\n\nTogether,
    those choices make this the most repairable foldable smartphone we’ve ever taken
    apart. But that’s definitely _not_ an endorsement of repairing the Duo. Fixing
    the phone’s inner screen is still going to be a bear.\n\nWe took the Duo all the
    way down to the gears, followed glowing dust into its hinge, and put its crease-hiding
    nano-texture under the microscope. Here’s what we found.\n\n## The Crease Has
    a Very Good Disguise\n\nEvery foldable, well, folds. Repeatedly. Materials fatigue
    with repeated mechanical stress, and over time you’d expect to see evidence in
    the way of marks, creases, or wrinkles along the fold. It’s a real engineering
    magic trick to make a folding OLED look flat when it’s fully open, and no foldable
    phone has solved that problem completely. Not even the Duo, no matter how many
    [Apple fans call it “creaseless.”](https://x.com/techdroider/status/2097267926999142607?lang=en)&nbsp;\n\nDon’t
    get us wrong. The Duo’s inner display looks remarkably smooth. Its hinge and supporting
    layers help it open flat, while the matte nano-texture finish scatters reflections
    across the surface, further concealing any evidence of a crease.\n\nUnder our
    Evident DSX2000 microscope, that finish looks like tiny rounded bumps packed together,
    a little like bubble wrap. They scatter light, softening the reflections you see
    on the screen.\n\n![Nanotexture with screen lit](https://valkyrie.cdn.ifixit.com/media/2026/10/24232141/179-Nanotexture-w-cam-cutout.jpg)\n_The
    diffusion effect of the nano-texture is obvious when we zoom into the camera cutout:
    on the left, pixels shining clearly through the smooth, untextured circle in the
    nano-texture layer. On the right, the pixel grid is fuzzed by the bubble wrap._\n\nWhen
    lights reflect off the screen, they bend as they cross the crease. Scattering
    that reflection helps hide the dip. When we take off the nano-texture layer, lights
    reflect off the crease not too differently from what we’ve seen in other foldables.\n\n[![iPhone
    Duo without the matte layer, crease visible](https://valkyrie.cdn.ifixit.com/media/2026/10/24232211/iPhone-Duo_45a.jpg)](https://valkyrie.cdn.ifixit.com/media/2026/10/24232211/iPhone-Duo_45a.jpg)\n\n[![Z
    Fold8, crease visible](https://valkyrie.cdn.ifixit.com/media/2026/10/24232212/iPhone-Duo_45b.jpg)](https://valkyrie.cdn.ifixit.com/media/2026/10/24232212/iPhone-Duo_45b.jpg)\n\n_Here’s
    the Duo with the nano-texture removed (left), compared to the Z Fold8 (right).
    Without the bubble wrap disguise, the Duo’s crease is arguably even more visible
    than the Fold8’s. If for some reason you like the shiny Duo better, fair warning:
    the surface underneath scratches more easily._\n\nApple has offered nano-texture
    on rigid displays before, including the [iPad Pro](https://www.apple.com/ie/newsroom/2024/05/apple-unveils-stunning-new-ipad-pro-with-m4-chip-and-apple-pencil-pro/),
    [MacBook Pro](https://www.apple.com/ie/newsroom/2024/10/new-macbook-pro-features-m4-family-of-chips-and-apple-intelligence/),
    and [Pro Display XDR](https://www.apple.com/pro-display-xdr/pdf/Pro_Display_White_Paper_Feb_2020.pdf).
    Here, the surface treatment lives on a flexible polymer cover that can be replaced
    while keeping the OLED beneath it.\n\n![Nanotexture closeup at the edge of camera
    cutout](https://valkyrie.cdn.ifixit.com/media/2026/10/24232145/181-nanotexture-50x.jpg)\n_Rounded
    bumps cover the nano-textured surface._\n\n[Reviewers famously killed](https://www.ifixit.com/News/15681/samsungs-galaxy-folds-are-breaking-after-only-a-few-days)
    their original Galaxy Fold displays by peeling off what looked like a screen protector.
    We’re really glad to see that not only will the display still function after removing
    this cover layer, but Apple actually provides a [cover-layer replacement procedure](https://support.apple.com/en-us/127672).&nbsp;To
    be clear, it’s not a simple DIY screen-protector swap. Apple’s procedure calls
    for specialized fixtures and precise alignment, but being able to replace the
    outer layer without sacrificing the OLED is still a meaningful improvement.\n\n[Cover-layer
    service costs $49](https://www.ifixit.com/News/119797/how-the-iphone-duos-crazy-repair-prices-compare)
    without AppleCare, or $19 with it. Not too bad, and it’s great that you can refresh
    a cover layer without having to replace the whole screen.&nbsp;\n\nReplacing the
    whole screen is where the repair bill starts to look scary. Again, inner-display
    damage will run $999 without coverage. We’ll sell replacement screens as soon
    and as affordably as we can, but this is a complicated part and even on its own
    it won’t be cheap.\n\nAnd don’t be fooled by how quickly Shahram got that inner
    screen off in our video: that screen repair will be slow. We estimate a [similar
    repair on the Pixel 10 Pro Fold](https://www.ifixit.com/Guide/Google+Pixel+10+Pro+Fold+Inner+Screen+Assembly+Replacement/203253)
    will take a typical DIYer 3-5 hours. The Duo should be faster, thanks to the fact
    that you don’t have to go into the other side of the device to disconnect the
    display. But even if you’ve got the [special fixtures Apple uses](http://Apple's%20manual%20calls%20for%20specialized%20fixtures,)
    in their manual, all that adhesive replacement will be delicate, finicky work.\n\n![iPhone
    Duo laid out on a table](https://valkyrie.cdn.ifixit.com/media/2026/10/24232256/iPhone-Duo_layout1b.jpg)\n_Replacing
    that inner screen will cost half as much as a whole new device._\n\n## Why Are
    Some of the Pixels Oval?\n\nZooming past the nano-texture down to the subpixels,
    we think we’ve found another clue to how Apple hides the crease. Some of the red,
    green, and blue pixels are oval, with their long axes pointing in different directions.\n\nOval
    subpixels have been around for years: [DisplayMate photographed them in Samsung’s
    Galaxy S4 in 2013](https://www.displaymate.com/Galaxy_S4_ShootOut_1.htm). But
    Samsung’s oval pixels are arranged regularly. The Duo pixels are more, uh, wobbly.
    Weird!\n\n![](https://valkyrie.cdn.ifixit.com/media/2026/10/25000654/191-OLED-pattern.jpg)\n_A
    nerd snipe for all you pattern-matchers: Can you figure out what the pixel pattern
    is here before you read on?_\n\nSo we went to the patents for an explanation:
    An [Apple patent application on reducing diffraction artifacts](https://patents.google.com/patent/US20250275448A1/en)
    describes varying subpixel shapes and orientations to make reflected light produce
    less conspicuous patterns. It’s a kind of geometric dithering, changing the repeating
    pattern so its optical artifacts don’t all reinforce one another.&nbsp;\n\nOne
    figure from the patent explains why it’s so hard to figure out the pattern of
    pixel orientation from our microscope shots. The display is divided into "
