    to automate small stuff like classifying emails, cleaning your downloads folder,
    etc.<p>It can also be fine-tuned for specific use cases with SFT&#x2F;DPO&#x2F;GRPO.
    The blog post talks about fine-tuning for wind-turbine classification. If there&#x27;s
    things you want to automate, but GPT-6-Luna is not strong enough, and bigger models
    are too expensive, you might fine-tune one of the LFM3 models and use it locally
    for repetitive tasks.
