  fetch_status: success
  content: "Today, we’re excited to announce **LFM3** , our new generation of Liquid
    Foundation Models (LFMs) built for specialized intelligence. The LFM3 model family
    is multimodal by nature and brings text, vision, audio, omni, and decision models
    onto one new shared backbone. The first release of the LFM3 family covers models
    in the 2B parameter range.\n\nBuilt on a new hybrid architecture and 22T tokens
    of pre-training, LFM3 is far more expressive than [LFM2](https://www.liquid.ai/blog/liquid-foundation-models-v2-our-second-series-of-generative-ai-models)
    while maintaining its efficiency. The extra capacity in a small, fast model makes
    LFM3 the ideal starting point in its class for specialized intelligence: this
    is because it can be fine-tuned locally, it can run on any device, and it is capable
    enough to become a reliable expert on a specialized task.\n\nThe base and post-trained
    models are open-weight and available today on [Hugging Face](https://huggingface.co/collections/LiquidAI/lfm3),
    [our Playground](https://playground.liquid.ai/), and the [Liquid AI API](https://console.liquid.ai/dashboard).
    Check out our [docs](https://docs.liquid.ai/) on how to run and fine-tune them
    locally.\n\n[![hugging face logo liquid AI](/_next/image?url=https%3A%2F%2Faypchzzf9pftwuto.public.blob.vercel-storage.com%2Fhugging-face-logo-he4Sh4nCz7LFuUCKOPouBvPe9edHKx&w=48&q=75)Download
    weights](https://huggingface.co/collections/LiquidAI/lfm3)[![Liquid AI logo](/_next/image?url=https%3A%2F%2Faypchzzf9pftwuto.public.blob.vercel-storage.com%2Fliquid-logo-xIjdtFz2499igEZp35jOGE8qF8wpBA&w=48&q=75)Try
    in Liquid API](https://console.liquid.ai/dashboard)[![Liquid AI logo](/_next/image?url=https%3A%2F%2Faypchzzf9pftwuto.public.blob.vercel-storage.com%2Fliquid-logo-xIjdtFz2499igEZp35jOGE8qF8wpBA&w=48&q=75)Try
    in Playground](https://playground.liquid.ai/)[![pipette open source model benchmark](/_next/image?url=https%3A%2F%2Faypchzzf9pftwuto.public.blob.vercel-storage.com%2Fpipette-logo-5jqhZMPL7296ULPa9hrcLcizo3oiM1.png&w=48&q=75)Benchmark
    in Pipette](https://pipette.liquid.ai/)\n## New architecture for more expressivity\n\nLFM2
    showed that a hybrid of short convolutions and attention could run fast on-device
    without sacrificing quality. Its design came from our [automated hardware-in-the-loop
    architecture search](https://arxiv.org/abs/2511.23404). For LFM3, we used this
    search to redesign that architecture for agentic use cases, which need more capability
    per parameter and fast inference over long contexts.\n\nWe also expanded the hardware
    in the loop, from CPUs in one phone and one laptop for LFM2 to 14 device and backend
    combinations for LFM3: phones (Samsung Galaxy S26 Ultra and OnePlus 15), a Raspberry
    Pi 5, laptops (Apple M4 Max and AMD Ryzen AI), and Arm and x86 cloud CPUs, plus
    GPUs and the Qualcomm Hexagon NPU.\n\nGated short convolutions still make up over
    half the layers. To add capability without slowing down long contexts, we tried
    swapping some of them for other sequence blocks, and sliding-window attention
    (SWA) gave the best quality–speed tradeoff. We kept the other changes described
    below only where they improved quality without a meaningful speed cost. The payoff
    shows at long context. Per parameter, LFM3-1.7B matches LFM2-1.2B on short prompts
    across edge devices, and with 8K tokens in context it is about 25% faster.\n\n**Tri-hybrid
    layer mix.** LFM3 combines three operators: gated short convolutions, sliding-window
    attention (SWA), and global attention. Of its 24 layers, 13 are convolutions,
    5 are SWA with a 256-token window, and 6 are global attention. The convolutions
    also use a kernel size of 7, up from 3 in LFM2.\n\n**Head-wise gated attention.**
    A sigmoid gate scales each head’s output, so a head can switch off when it has
    nothing to add. This can help [suppress activation outliers](https://arxiv.org/abs/2306.12929)
    that hurt quantization and[improve training stability](https://arxiv.org/abs/2505.06708).\n\n**Partial
    RoPE.** Global attention layers rotate only the highest-frequency half of each
    head and leave the low-frequency half unrotated, so those dimensions[match on
    content regardless of distance](https://arxiv.org/abs/2410.06205). SWA layers
    keep full RoPE.\n\n**Sandwich norm.** Each block normalizes both its input and
    its output, which helps keep activations well-scaled.\n\nLFM3 uses the same 128K
    vocabulary as[LFM2.5-8B-A1B](https://www.liquid.ai/blog/lfm2-5-8b-a1b), built
    to tokenize non-Latin scripts more efficiently.\n\n**Training.** LFM3-1.7B-Base
    was pre-trained on 22T tokens. Compared with LFM2, the mix adds more scientific
    papers, repository-level code, a wider range of knowledge sources, and considerably
    more math. The final 3.5T tokens are a mid-training stage on curated, higher-quality
    data, with a larger share of agentic traces and diverse tool calls to prepare
    the model for agentic post-training. This stage also extends the context window
    to 256K tokens.\n\n## A multimodal family for every need\n\nThe first LFM3 release
    includes six models, all branched from the same LFM3-1.7B-Base backbone and all
    around 2B parameters. Four of them cover different input modalities (text, vision,
    audio, and omni), and the last two are decision models specialized from the vision
    and omni models. Instead of running one large general-purpose model, you can pick
    the one that fits your use case, customize it, and run it on-device.\n\nFor a
    deeper dive into the performance and inference results behind these models, refer
    to the respective model cards.\n\n“\n\n> As AI increasingly moves from the cloud
    to the client, developers need models that can be deployed efficiently across
    the broad spectrum of AI PCs. Liquid AI's LFM3 family combines strong multimodal
    capabilities with a compact footprint that is well suited for on-device AI experiences.
    AMD has worked closely with Liquid AI across multiple generations of models, and
    we're excited to see LFM3 expand what's possible for specialized AI applications
    running locally on systems with AMD Ryzen™ AI processors.\n\n_Josh HortSenior
    Director & Head of ISV Enabling at AMD_\n\n> Across industries, we’re seeing edge
    AI evolve from running dedicated detection and perception models to supporting
    multiple concurrent AI workloads, including vision-language models, natural-language
    interfaces and multimodal reasoning. The challenge is delivering these capabilities
    within the compute, memory, and power constraints of edge devices. LFM3 brings
    text, vision, and audio together in a unified architecture designed for efficient
    deployment, with open weights that developers can fine-tune for specific applications.
    Developers can already run Liquid AI’s LFM2.5-VL models on Ambarella silicon through
    the Cooper Model Garden, and we have begun enabling LFM3 on the same platform.\n\n_Malhar
    PalkarSenior Director for AI at Ambarella_\n\n> The next generation of AI will
    be more multimodal, personalized, and private while being distributed across devices
    and the cloud. Liquid AI’s LFM3 family is an exciting step in that direction,
    and we’re pleased to work together to bring fast, efficient, and innovative AI
    experiences to devices powered by Snapdragon® processors.\n\n_Vinesh SukumarVP,
    Qualcomm Technologies, Inc._\n\n01 / 03\n\n### Text\n\n[LFM3-1.7B](https://huggingface.co/LiquidAI/LFM3-1.7B)
    is a text model for local agents and specialized applications with a 256K-token
    context window.\n\nIt is post-trained to run in agentic harnesses such as Hermes
    Agent, Pi, and OpenClaw. It can triage your inbox, manage your calendar, research
    topics on the web, send you morning briefings on WhatsApp, and use tool search
    to find the right tool among thousands of options. Since tokens are free, dozens
    of agents can run continuously in the background. You can adapt it to your domains,
    harnesses, and tools with a short fine-tuning run on a single GPU.\n\n| \n\n**Benchmark**\n\n
    | \n\n**LFM3-1.7B (1.7B)**\n\n | \n\n**LFM2.5-2.6B (2.6B)**\n\n | \n\n**MiniCPM5**\n\n**2B
    (2.5B)**\n\n | \n\n**Gemma 4**\n\n**E4B (8B)**\n\n | \n\n**Qwen3.5**"
