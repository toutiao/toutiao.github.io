  author: lakeviewterrace
  text: That&#x27;s because no one knows their history anymore.<p>Nano was a (bloated
    as usual) GNU clone of Pico. Its only reason for existing is GPL freedumb nonsense
    that was popular back in the day. It copied the UX of Pico.<p>Pico was not developed
    as a standalone editor; rather it was the builtin editor for the Pine email reader.
    Hence the weird keybindings — it followed the UX of the email client.<p>Pico stood
    for PIne COmposer.<p>It became a simple universal editor because vi and emacs
    sucked and for some reason no one felt it necessary to invent something better.<p>Users
    repurposed the editor from a mail client because it was already there. Nearly
    every university Sun box in the 90s had Pine installed for reading email.<p>It
    was written by the same guy that invented IMAP at the University of Washington.<p>Can&#x27;t
    wait for the Rust clone of Nano then the cycle will be complete.
  score: 0
