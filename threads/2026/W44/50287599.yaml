  author: arbor-group
  text: 'The beginner-friendly label seems to be obscuring what atto actually is,
    which is a very small Emacs-like editor meant to live in the base system. At roughly
    48 KB and under 2,000 lines of C, it fits places nano and the larger alternatives
    do not, especially a rescue environment or single-user mode where you still need
    something more usable than ed or a stripped-down vi. That constraint also explains
    the choices people are arguing about here: Emacs bindings come with the design,
    and a permissively licensed C program can be maintained with the tools NetBSD
    already ships, unlike a Go editor such as micro. For someone new to NetBSD but
    already comfortable at a Unix terminal, that is a reasonable trade. It is less
    a first editor for a general beginner than a safety net that happens to be approachable
    once you are already in that world.'
  score: 0
