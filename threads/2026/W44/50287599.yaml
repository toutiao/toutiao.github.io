  author: setopt
  text: Just FYI, they did try to improve that a bit. Release notes for nano v8.0:<p>&gt;
    Command-line option --modernbindings (-&#x2F;) makes ^Q quit, ^X cut, ^C copy,
    ^V paste, ^Z undo, ^Y redo, ^O open a file, ^W write a file, ^R replace, ^G find
    again, ^D find again backwards, ^A set the mark, ^T jump to a line, ^P show the
    position, and ^E execute.<p>&gt; Above modern bindings are activated also when
    the name of nano&#x27;s executable (or a symlink to it) starts with the letter
    &quot;e&quot;.<p>So if you symlink nano to &#x2F;usr&#x2F;bin&#x2F;editor and
    make it the default $EDITOR, then you now do get CUA-like bindings by default.<p>There’s
    still a lot of more things they perhaps should enable by default. I don’t know
    whether you’ve looked into .nanorc, but you can turn on stuff like syntax highlighting
    and line numbers, it’s just all off by default.<p>I don’t actually use nano myself,
    but I was really taken aback by how featureful it is when you look closely. Not
    st the level of Vim or Emacs, but more than expected. I basically stumbled upon
    someone on Reddit &#x2F;r&#x2F;unixporn that &quot;riced&quot; their nanorc and
    it piqued my curiosity.<p>For most people though, I think micro is a better fit
    than nano if you want a terminal CUA-style editor.
