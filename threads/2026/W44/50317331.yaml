  author: wolrah
  text: If you have more than one device at all it&#x27;s still better to have a single
    cellular router than to have a bunch of individual cellular devices, so having
    the ability to operate on WiFi or ethernet is a benefit to literally everyone
    who&#x27;s not using it as the sole device at a booth or something at very little
    BOM cost.  That also makes it useful in locations that don&#x27;t have good cell
    service as long as some kind of network can be accessed.<p>Making something intentionally
    significantly worse to save pennies on the BOM is not something that should ever
    be defended.<p>If it has a cellular internet connection there&#x27;s no good reason
    to not at least also have WiFi, and if it&#x27;s the kind of device that isn&#x27;t
    expected to be moving around while in use there&#x27;s no good reason to not also
    have ethernet.
