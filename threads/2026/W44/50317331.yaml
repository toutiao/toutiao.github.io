  author: abijahkaj
  text: 'I wanted a real phone line on my computer: calls and texts on a physical
    SIM, answered through my headset at my desk, or by a script or an AI agent when
    I&#x27;m away. Cloud numbers get treated as VoIP, and old Android phones give
    you no clean way to get call audio in and out over USB.<p>So this is a 4-layer
    USB-C board around a Quectel EC25-EUX. Behind a USB hub, the computer sees an
    LTE network adapter, the modem&#x27;s AT serial ports (caller ID, SMS, answer),
    and an RP2040 acting as a USB sound card. The RP2040 bridges the modem&#x27;s
    1.8 V PCM audio through a level shifter. There&#x27;s a 3.8 V buck sized for the
    2 A GSM bursts, and no battery.<p>I wrote the spec as one page of text, and Koppar,
    the tool I&#x27;m building, generated the schematic and the board. Then I reviewed
    it against the datasheets. The review found a 35 Ω antenna feed that hopped layers,
    a buck 60 mm from its inductor, and a SIM socket facing into the board. The parts
    matching would have bought an 18 µH inductor for a 4.7 µH slot. REVIEW.md in the
    repo has all of it with the numbers.<p>Status: the boards aren&#x27;t built yet.
    The repo is the design as I&#x27;m ordering it: KiCad 10 project, Gerbers, JLCPCB
    BOM and placement files. Bring-up and the sound-card firmware come next.<p>Happy
    to answer anything about the audio path or the power design, and I&#x27;d like
    to hear what you&#x27;d change before the first bring-up.'
