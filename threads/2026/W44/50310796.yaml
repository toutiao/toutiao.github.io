  text: "&gt; No justification, like gasoline tax, which is used to fix the roads
    and fund green technology<p>What? There is no justification for gasoline tax beyond
    &quot;government wants more money&quot; (and has now lent against the income stream
    and so cannot realistically lower the gasoline tax). Gasoline tax in France goes
    into the general budget and so there are 3 main things being paid from that: pensions,
    &quot;health care&quot; (and by that we mean paying sick people to not have to
    work, not expensive cancer treatments), state personnel expenditures (the biggest
    of which is education)<p>Road maintenance is paid partially by tolls, and the
    rest is not a big part of the budget. Another decent chunk of road maintenance
    is forced onto homeowners directly. The rest is not a huge part of the budget
    (which you can tell by the quality of roads in many French cities). Green policy
    is almost exclusively subsidies and is a very tiny part of spending.<p>You should
    check what people say, especially politicians. And reality is that despite endless
    rhetoric to the opposite, the &quot;green revolution&quot; is something that is
    happening <i>to</i> the EU, not something governments are meaningfully contributing
    to. Unless you count extra taxes and fuckups like the German (and French, and
    Belgian, and even a little bit Swiss) nuclear fiasco. Extra taxes are also being
    imposed on the green transition by the way (probably like in Australia: because
    they make especially homeowners less dependent on centralized services and thus
    harder to tax).<p>Financial nuclear fiascos are happening all around except to
    the media it&#x27;s like there&#x27;s a huge explosion in a park, and 3 progressively
    smaller explosions in the same city. In the newspaper you&#x27;ll find details
