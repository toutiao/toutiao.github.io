  author: thoughtpeddler
  text: 'There&#x27;s all kinds of telemetry being collected and sent to data brokers,
    for ad targeting (not directly through Anthropic but third-parties), etc. See
    this study led by IMDEA Networks in Europe: <a href="https:&#x2F;&#x2F;leakylm.github.io&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;leakylm.github.io&#x2F;</a><p>This article talks
    about results at a high-level: <a href="https:&#x2F;&#x2F;networks.imdea.org&#x2F;your-conversations-with-ai-may-not-be-as-private-as-you-think&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;networks.imdea.org&#x2F;your-conversations-with-ai-may-no...</a><p>&gt;
    The study identifies three main issues: the exposure of conversation permalinks
    to third-party trackers; the ability to link these interactions to user identities
    through tracking mechanisms; and the presence of privacy controls and policies
    that may not accurately reflect actual data flows.<p>&gt; One of the main findings
    is the potential transmission of information related to user conversations, such
    as chat titles, URLs (permalinks), or associated metadata, to third-party trackers
    such as Meta or Google, along with cookies and other identifiers.<p>&gt; The study
    also identifies mechanisms that could enable linking activity in AI systems to
    real user identities. The combination of identifiers such as cookies (commonly
    used in tracking services), hashed email addresses, and server-side tracking techniques
    could facilitate the creation of persistent profiles and user re-identification.'
