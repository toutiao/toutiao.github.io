  text: I&#x27;ve tried smaller models and the best open models for a specialized
    UAV focused CAD + CFD + DFM optimization application I&#x27;m building.<p>The
    best open weights models still had a lot of defects and very egregious mistakes
    to fix even after I provided a very well detailed Requirement&#x2F;Design&#x2F;
