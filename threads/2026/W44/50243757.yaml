article:
  url: https://inventor7777.github.io/blog/2026/10/22/debug-access-on-brother/
  title: Getting debug access on a Brother printer over Telnet · Inventor7777
  fetch_status: success
  content: "As it turns out, the Brother NC-8700w Command Console is more interesting
    than it first appears.\n\n## Some context\n\nI’ve always enjoyed seeing how things
    work. It started with hardware and trying to take interesting devices apart, and
    now I do the same with software. And as I’ve learned how software works, one of
    the goals I like is accessing hidden features. On Linux based devices, that’s
    getting a root Linux shell. But what about the printer?\n\n## The unsuspecting
    subject\n\nIs the family Brother MFC-L8900CDW. Unlike the reputations of certain
    other printer brands and models, this one connects and prints every time. mDNS
    doesn’t randomly stop working, the paper doesn’t randomly jam, and the toner lasts
    forever. However, the vendor CLI is limited when it comes to deep system information.
    _(one of these functions is not like the other)_\n\n## The journey begins\n\nThe
    first step to figuring things out in this day and age is getting a firmware binary
    and then using AI to attack it from all angles. _(Some people are, of course,
    skilled enough to do this themselves, but I am not one of those people.)_ On some
    devices you can straight up download a firmware image, but in Brother’s case,
    they expect you to use their own downloader. My AI agent first tried just going
    to the link found in the Brother firmware updater app, but their server rejected
    a guessed XML request. So after digging a bit deeper into the firmware update
    tool, we found the list of models and stuff that it accepts. While writing this,
    I also discovered [an interesting tool](https://github.com/CauldronDevelopmentLLC/oh-brother)
    that might have saved me some reversing trouble had I known about it, but the
    Brother app had enough info to work it out manually. While Brother could change
    the format at any time, this is the request that worked for my printer.\n\n    curl
    -sS \\\n      'https://firmverup.brother.co.jp/kne_bh7_update_nt_ssl/ifax2.asmx/fileUpdate'
    \\\n      -H 'Content-Type: text/xml' \\\n      --data-binary @- <<'XML'\n    <REQUESTINFO>\n
    \     <FIRMUPDATETOOLINFO>\n        <FIRMCATEGORY>MAIN</FIRMCATEGORY>\n        <OS>MAC</OS>\n
    \       <INSPECTMODE>0</INSPECTMODE>\n      </FIRMUPDATETOOLINFO>\n      <FIRMUPDATEINFO>\n
    \       <MODELINFO>\n          <NAME>MFC-L8900CDW series</NAME>\n          <SPEC>0001</SPEC>\n
    \         <DRIVER>EWS</DRIVER>\n          <FIRMINFO>\n            <FIRM>\n              <ID>MAIN</ID>\n
    \             <VERSION>ZU2605160228</VERSION>\n            </FIRM>\n          </FIRMINFO>\n
    \       </MODELINFO>\n        <DRIVERCNT>1</DRIVERCNT>\n        <LOGNO>2</LOGNO>\n
    \       <NEEDRESPONSE>1</NEEDRESPONSE>\n      </FIRMUPDATEINFO>\n    </REQUESTINFO>\n
    \   XML\n\nYou can replace the firmware version with `B0000000000` instead, and
    that also works.\n\nIn response, Brother’s API returned:\n\n    <RESPONSEINFO>\n
    \     <FIRMUPDATEINFO>\n        <VERSIONCHECK>0</VERSIONCHECK>\n        <MEMORYVERSION>a</MEMORYVERSION>\n
    \       <FIRMID>MAIN</FIRMID>\n        <LATESTVERSION>ZV2608181949</LATESTVERSION>\n
    \       <PATH>http://update-akamai.brother.co.jp/CS/D009UD_ZV.djf</PATH>\n        <DLTIME>175000</DLTIME>\n
    \     </FIRMUPDATEINFO>\n    </RESPONSEINFO>\n\nSome very descriptive versions,
    I must say…\n\n## The firmware has landed\n\nNow that the firmware was in hand,
    GPT-6.1 Sol got to work.\n\nHere is what it found, in its own words:\n\n    Conclusion\n
    \   The main application firmware uses the TRON-family T-Kernel real-time\n    operating
    system on 32-bit little-endian ARM. Confidence: high. Exact\n    T-Kernel release,
    CPU core, and SoC have not been established.\n    This is positive T-Kernel evidence,
    not just an absence of Linux strings.\n    \n    Evidence in extracted/ZlibRo.bin
    (hex offsets relative to that file)\n    0x004b0168: T-Kernel/OS SVC in execution\n
    \   0x019c0450: Software Interrupt (SWI) #6 (T-Kernel/OS & Extended SVC)\n    0x019c050f:
    Software Interrupt (SWI) #9 (T-Kernel/DS)\n    0x019c7d7b: OS_Ver\n    0x019c7d82:
    TSysName\n    0x019c7d8b: T-Kernel\n    0x019c7d94: TMaxTskId (followed by semaphore/mutex/etc.
    configuration names)\n    0x0002a624: TASK STACK INFORMATION for ITRON\n    0x002b3014:
    MFC-L8900CDW series (also at 0x00c40f4c and 0x00c4148c)\n    \n    Evidence in
    extracted/KernelRo.bin\n    0x0000e188: T-Monitor Initialize\n    0x0000e8a5:
    TM> prompt\n    0x00009154: Undefined Instruction (ARM)\n    0x00009170: Undefined
    Instruction (THUMB)\n    ARM exception registers R0-R15/CPSR and ARM processor
    modes are present.\n    The opening words decode as ARM little-endian instructions,
    including\n    SUB lr, lr, #4 (0xe24ee004) and PUSH {r3,r12,lr} (0xe92d5008).\n
    \   The RTOS kernel is a separate 141,932-byte section loaded at 0x40100000.\n
    \   \n    Storage and libraries: embedded identification strings, not a security
    audit\n    ZlibRo.bin 0x010050e4: Datalight Reliance Nitro v3.0.6 Build 2306EC\n
    \   ZlibRo.bin 0x003302e4: RTOS Edition for arm; compiled Dec 21 2015\n    ZlibRo.bin
    0x010d6b50: Datalight FlashFX Tera v3.1 Build 2772E\n    ZlibRo.bin 0x00f391e0:
    Lua 5.2.3 version identification\n    ZlibRo.bin 0x008ddaa4: OpenSSL 1.0.1c; other
    sections identify OpenSSL 1.0.2\n    ZlibRo.bin 0x005377b8: libpng version 1.6.43\n
    \   ZlibRo.bin 0x00692ec8: gSOAP/2.7\n    ZlibRo.bin 0x019bb300: wpa_supplicant
    v0.5.7-Devicescape\n    Version labels can survive vendor backports; they do not
    establish\n    which vulnerabilities are present or that every bundled module
    is active.\n    \n    Flash layout and extraction\n    The update wrapper starts
    with PJL EXECUTE BRDOWNLOAD / PROGRAM=FIRM.\n    This package maps file offset
    0x93 to flash address 0xe0060000.\n    A table of 20-byte labels plus 32-bit little-endian
    values begins at\n    package offset 0x8497. It names the kernel, page table,
    and zlib sections.\n    The main compressed stream starts at package offset 0x2b2e7,
    after its\n    4-byte length. Three streams are stored sequentially. Each stream
    passed\n    zlib checksum/end checks and exactly matches the table's expanded
    size.\n    The RW source addresses describe their installed flash destinations;\n
    \   the update package packs those streams immediately after the RO stream.\n
    \   \n    Output Bytes Load address\n    PageTable.bin 33,792 0xe0060000\n    KernelRo.bin
    141,932 0x40100000\n    ZlibRo.bin 28,186,916 0x40222b00\n    ZlibRw.bin 700 0x41e00d00\n
    \   Zlib2Rw.bin 1,526,396 0x43cb8f00\n    \n    Binwalk found embedded images
    and other assets in the expanded main\n    section, but no recognizable Linux
    filesystem/kernel image. This does\n    not prove that no separate chip runs other
    firmware.\n    \n    Hardware\n    Brother's model datasheet specifies an 800
    MHz main processor, 133 MHz\n    subprocessor, and 512 MB memory (regional model
    variations are possible).\n    The image contains SubCPU/print-engine control
    messages. This is consistent\n    with an RTOS application coordinating printing,
    scanning, UI, networking,\n    and a separate engine controller. We have not analyzed
    SUB1 1.35.\n    Generic CPU vendor names in diagnostic tables do NOT identify
    the SoC.\n    The kernel has a T-Monitor debugger/monitor, but that does not establish\n
    \   that it is accessible through the network telnet port. The firmware also\n
    \   contains Brother network-configuration telnet commands. A telnet service\n
    \   is not by itself evidence of a Unix shell.\n    \n    Sources and comparison
    material\n    TRON Forum: T-Kernel and T-Monitor roles\n    https://www.tron.org/tron-project/what-is-t-kernel/t-kernel/\n
    \   TRON Forum: official source downloads\n    https://www.tron.org/source-code-download/\n
    \   Brother model datasheet (processor/subprocessor/memory)\n    https://www.brother.lt/-/media/product-downloads/devices/printers/mfc/mfcl8900cdw/mfc-l8900cdw.ashx\n
    \   STAR Labs: independently inspected a different Brother model using\n    T-Kernel
    and similar named/compressed segments. Used as a format lead;\n    our OS conclusion
    is based on this package's own extracted evidence.\n    https://starlabs.sg/blog/2025/11-breaking-into-a-brother-mfc-j1010dw-three-security-flaws-in-a-seemingly-innocent-printer/\n
    \  "
