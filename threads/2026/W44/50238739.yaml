  text: Why do people try to vibecode PDF engines that already exist in Rust? <a href="https:&#x2F;&#x2F;github.com&#x2F;yfedoseev&#x2F;pdf_oxide"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;yfedoseev&#x2F;pdf_oxide</a>
    which this project builds on completely misses <a href="https:&#x2F;&#x2F;github.com&#x2F;fschutt&#x2F;printpdf"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;fschutt&#x2F;printpdf</a> which
    was already developed with tons of fixes over years (both with and without AI).
    MIT license and also builds on WASM with a demo running on <a href="https:&#x2F;&#x2F;fschutt.github.io&#x2F;printpdf&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;fschutt.github.io&#x2F;printpdf&#x2F;</a><p>One
    Google search (yeah I&#x27;m old, sorry, nobody &quot;Googles&quot; anymore) for
    &quot;rust pdf library&quot; shows this. Yet people now redo and redo and redo
    everything again just to have &quot;their&quot; semi-broken copy of a HTML -&gt;
    PDF renderer (and then run into the same edge cases that were already fixed before).
    There are lots of edge cases in typography especially, I recently had a lot of
    fixes as I was trying to ocr-and-cleanup a 1732 scan of some books with Claude
    auto-extracting the font. There were a <i>ton</i> of edge cases in the layout,
    esp. related to column, footnote and sidebar handling, or things like &quot;Hebrew
    RTL text accidentally disappears if text breaks weirdly&quot;, &quot;1-bit image
    compression&quot;, etc.<p>I have nothing against AI, I use it heavily myself,
    but what is annoying is people completely ignoring the years of work of existing
    projects that do the exact same thing - instead of just forking, but instead re-tokenizing
    the exact same work again. Most likely the author didn&#x27;t research &quot;does
    this already exist&quot; and that&#x27;s annoying, then you get 100 of similar
    projects reinventing the world with tokens again and again. Sometimes its beneficial
    and can lead to faster exploration of new approaches, but in most cases its not
    and misses edge cases that were solved before.
