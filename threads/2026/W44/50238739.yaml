  text: |-
    Hi HN,<p>I built PaperPilot because I was frustrated by the privacy trade-offs of modern PDF utilities.<p>Whenever you need to split, merge, compress, or sign a confidential document (tax forms, legal contracts, medical paperwork) using online tools, your files are transmitted to a third-party server. Most &quot;free&quot; tools retain copies or run in closed-source cloud environments.<p>PaperPilot is a 100% zero-cloud, local-first engine written in pure Rust (built on top of lopdf, pdf-writer, and image). 0 bytes are ever sent to an external server.<p>Key aspects of the project:<p>1. Penta-Interface Architecture:
    Instead of building just another web app or CLI, the same core Rust operations run across 5 surfaces:
    - Terminal CLI: High-throughput local processing and bash scripting.
    - Local Desktop App: Native cross-platform GUI built with Tauri 2 and Svelte 5.
    - Client-Side Web: Runs 100% inside your browser via WebAssembly (<a href="https:&#x2F;&#x2F;usepaperpilot.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;usepaperpilot.com&#x2F;</a>).
    - REST &#x2F; Gateway API: Standalone local daemon (localhost:7823) for local microservices.
    - Model Context Protocol (MCP): Connects local AI agents (Claude Desktop, Cursor, OpenCode) directly to local PDF tools so LLMs can inspect, redact, and sign PDFs on disk without cloud upload.<p>2. Capabilities (75+ Tools):
    - Standard operations: Merge, split, rotate, reorder, burst, booklet imposition, and N-up grid.
    - Privacy &amp; Compliance: Local PII regex redaction (SSNs, cards, emails), metadata striping, and digital signature verification.
    - Document Extraction: PDF to structured Markdown tables (no coordinate loss), PDF to JSON, and pure-Rust layout analysis.
    - Offline RAG: Embedded vector store (libsql_vector) with an actionable visual citation canvas.<p>3. Performance &amp; License:
    - Average operation latency is ~20ms to 130ms.
    - 100% Free and Open Source under the Apache 2.0 license.<p>The GitHub repository is at <a href="https:&#x2F;&#x2F;github.com&#x2F;KrushnaVardhanReddy&#x2F;PaperPilot" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;KrushnaVardhanReddy&#x2F;PaperPilot</a> and the browser-based WASM sandbox is live at <a href="https:&#x2F;&#x2F;usepaperpilot.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;usepaperpilot.com&#x2F;</a>.<p>I’d love to hear your feedback on the architecture, performance benchmarks, and any edge-case PDF formats we should test against!
