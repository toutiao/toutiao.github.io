  author: vardhan1237
  text: 'Huge respect for your work on printpdf, and thank you for chiming in!<p>When
    we evaluated the Rust PDF landscape, printpdf was actually one of the first crates
    we looked at for PDF generation. The reason we opted for a stack centered around
    lopdf and pdf-writer was architectural: PaperPilot&#x27;s primary focus is heavy
    manipulation and non-destructive AST transformation of existing, arbitrary, often
    malformed real-world PDFs (re-ordering cross-reference tables, granular &#x2F;P
    permission bitmask hashing, raw object streams, page imposition, booklet folding,
    and outline splitting).<p>For document synthesis (HTML&#x2F;Markdown to PDF),
    typography and edge-cases (like the RTL&#x2F;footnote issues you mentioned) are
    notoriously hard, and we&#x27;d love to learn from or collaborate with printpdf&#x27;s
    battle-tested approaches there. Thank you for the feedback and all your contributions
    to Rust&#x27;s PDF ecosystem!'
