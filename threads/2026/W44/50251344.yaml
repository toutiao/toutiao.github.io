  author: Rudybega
  text: 'To give some context:<p>Kakeya &#x2F; local smoothing (math): The result
    would resolve the Kakeya conjecture and Stein’s restriction conjecture across
    all dimensions together. Mathematicians had been making progress one dimension
    at a time, so this would settle a whole family of central harmonic analysis problems
    at once.<p>ETH is false (computer science): ETH has been used as a computational
    hardness premise in hundreds of papers, so a disproof would undercut a large body
    of existing complexity results. It would also change what researchers think is
    achievable for efficient computation.<p>QCD existence (physics): It would give
    a rigorous mathematical foundation to the theory of the strong force, which physicists
    have used for decades without proving it’s well-defined. It also bears on a Millennium
    Prize Problem.'
