  author: jltsiren
  text: The challenge is the initial reduction from an arbitrary problem in NP to
    the problem you want to prove NP-complete.<p>In the usual approach, you assume
    a nondeterministic Turing machine (or equivalent) that solves the problem and
    a time bound (which can be an arbitrarily large polynomial). You then create a
    boolean expression that can be satisfied if and only if the Turing machine accepts
    the original problem instance. Unfortunately all constructions so far have included
    the time bound as a factor of the size of the expression.
