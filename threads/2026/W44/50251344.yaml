  text: It&#x27;s been a long time since I seriously thought about complexity theory,
    but I&#x27;d say no. For similar reasons to why complexity class E is not closed
    under polynomial-time reductions.<p>The most important component in the time bound
    is of the form 2^{n &#x2F; polylog(n)}, which is subexponential. But if you have
    reduction from another problem that increases instance size quadratically, the
    algorithm for the other problem is no longer subexponential. Which means we are
    still essentially in the same neighborhood as before.<p>It&#x27;s a huge result
    if true, and probably the first major AI result that affects the papers I read.
    But since the boundary in the hypothesis was kind of arbitrary, breaching it should
    not significantly change our intuition on complexity classes.
