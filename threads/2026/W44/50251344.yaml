  author: krackers
  text: 'Yes. Up until now, it was unknown whether containment of NP in EXPTIME was
    strict or not. (Obviously you can brute-force all possible witnesses, so any problem
    in NP can be solved in EXPTIME, it was open whether you could do better than that.)<p>Showing
    3SAT (technically #3SAT) can be solved in less than EXPTIME resolves this. It&#x27;s
    only slightly subexponential, not even quasipolynomial, but it is a very surprising
    result. And that too a constructive algorithm.<p>Edit:  Apparently not true, the
    constructive algorithm given may not survive under reductions. See discussion
    in <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50252769">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50252769</a>'
