  author: arjie
  text: It’s not an American idea. It’s a pretty normal concept that public transit
    is not a charitable program and must yield benefit commensurate with spend. The
    view that public transit should have low farebox recovery is predominantly American
    and the opposite of the majority of successful public transit programs everywhere
    in the world.<p>If what you said was true then it would be the inverse - operating
    costs would be mostly paid out of government subsidies in the areas with most
    ridership. But in fact, it is (and predictably so) the case that good transit
    systems have high farebox recovery - the HK MTR, Taipei MRT, and the Tube are
    those I’m familiar with and they’re all much nicer and more frequent and have
    high farebox recovery.<p>In fact, I find the whole thing confusing. Do people
    actually believe public transit is meant to be some kind of giveaway to a small
    number of riders? It’s clear from looking worldwide that where it is useful riders
    pay high enough fares because it is so useful.<p>I can understand some sort of
    bootstrap capital investment (or one-off interventions like for COVID-19) but
    the idea that operating costs should be predominantly covered from general taxation
    doesn’t really hold up if you look at which places are effective at this.
