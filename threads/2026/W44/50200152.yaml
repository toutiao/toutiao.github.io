  author: xp84
  text: Most American cities are not laid out in a way that a few or even a bunch
    of BRT routes (or tbh even if we get the money cannon out and make them Light
    Rail) would solve anything.<p>Transit works well in dense areas. For the median
    transit trip, even a city with very shaky and inefficient transit like SF, you
    might be required to take two vehicles (hopefully one is a train or a limited&#x2F;express
    bus) and walk 2-4 blocks at each end. Maybe 30 minutes of riding and 30 minutes
    total of waiting or walking. Driving might be faster, only 25-35 minutes, but
    it costs a lot of money or frustration to find parking, and cars themselves are
    expensive so a lot of people don’t even want to have them. Transit is working.<p>Transplant
    this pattern onto a suburb and it breaks. Driving is a 25-minute trip in climate
    control, there’s plenty of room to park on both ends, and roughly everyone has
    a vehicle already. Assume a very expensive short-headway BRT or Light Rail network
    appears overnight. The average person checks their trip and sees that they’ll
    have to first walk 20 minutes to get to the nearest stop, then wait up to 8 more
    minutes (we’re being very lavish with our spending to keep headways down to 8),
    ride for a few minutes, hop off and transfer, waiting up to 8 more minutes, then
    ride for a few minutes, then walk 20 minutes at the end. These are not the result
    of a terrible transit system design — they are just inevitable for most people
    who aren’t incredibly lucky in how their frequent trips match up with the routes.
    1-2 story suburban density means that it would be cheaper to just subsidize the
    cost of an Uber for every trip than it would be to provide headways <i>and</i>
    bus stop spacing that would make transit a close value proposition to driving
    a car.<p>Plus, you will still need to keep your car, because if you live in 80%
    of the country, it sometimes is a type of weather that you <i>really</i> wouldn’t
    want to walk 40 minutes in each way. And lugging groceries the distances required
    is also a massive pain. So your depreciation and insurance cost will remain the
    same, but you’ll trade gas cost for bus fare. It’s presently about $4 for me in
    gas to drive my kid to elementary school 12 miles away, but it would cost 3 bus
    fares (two for me, one for her) to make that trip, so about $9 in typical transit
    systems.<p>No one in a democracy will ever choose this. Right now in the Bay Area
    even one of the best transit systems there is (BART), is finding itself on the
    brink of insolvency, just from the loss of white-collar commuting brought about
    by remote work, going from a system that needed a light subsidy to one extremely
    dependent on government funding.
