  text: Rowing was common and well known. Many ferries cross rivers where tides and
    the wind are not concerns. Winds near shore are often consistent enough to have
    near fixed frequency routes.<p>Ancient Mediterranean maps often reveal ferries
    and such were not going vast distances but rather they would go from small settlement
    to small settlement. This would be much smaller boats that could be easily rowed
    and, in turn, have relatively fixed frequencies. The small boats could get into
    ports that would be impossible to put a large ship into.  As ships grew larger
    and sailing became more popular, longer distances would happen and then winds
    and tides would be more important.
