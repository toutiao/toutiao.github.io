  author: bluGill
  text: 'Well, there is some of that. It&#x27;s not near as much as you might guess.
    Predictable transit is very helpful because people plan their life around it.
    What the data you&#x27;re looking at will show where the bottlenecks are, and
    yes, you can remove a few bottlenecks and make people&#x27;s life a little bit
    better, but it&#x27;s not going to be a major change because of major change will
    not show up in the data until well after it&#x27;s made.<p>I don&#x27;t remember
    the terms used, but I&#x27;ve seen data sets of where people live and work in
    Manhattan, and you do see people who live on subway lines take jobs on that same
    line, and they don&#x27;t take jobs on a different subway line that while possible
    is overly inconvenient.<p>people have already arranged their life around the existing
    transportation that exists around them. They are not going to change their life
    because it is already in place. They want bottlenecks fixed but otherwise don&#x27;t
    really need a change to their life. Even if a change would greatly benefit them,
    they often can&#x27;t see that and wouldn&#x27;t imagine themselves making the
    change to their comfortable life.<p>The real value of transportation experts is
    they can look at a map and all your data and say, if we make these changes, over
    20 years, the city will redevelop in this way, and then we can ask questions.
    &quot;Is that how we want the city to develop?&quot; however, the data is never
    going to show that because the data shows what people are doing today, not what
    they&#x27;re going to do in 20 years. Don&#x27;t get me wrong, experts get this
    wrong too when they make predictions. However, there is a lot of things we can
    use to inform our predictions. even though we&#x27;re not perfect, we can make
    predictions that are usually right.<p>Varying the route timing is the absolute
    worst thing you can do. People need to depend on your transport system. If they
    have to look at a schedule that&#x27;s going to change by day to figure out when
    they can actually get somewhere, they&#x27;re going to get frustrated and start
    looking up for an alternative that they control. If you vary your timing at all,
    it&#x27;s only because you&#x27;re changing between a train every minute to train
    every five minutes. You don&#x27;t get to go any farther apart than that without
    losing writers because they no longer can trust that the system will get them
    there when they want to be there. Physics puts a lower limit on time. I believe
    the current record is a train every 90 seconds, and I&#x27;m not sure how much
    closer together you can get. The limit for a bus is three minutes apart and even
    that is extremely hard.<p>Transit systems that are running worse than 5 minute
    frequencies have large drops in ridership and as they increase frequency: ridership
    jumps because people start to use, they can always just go out when they&#x27;re
    ready to go. If this wasn&#x27;t so expensive, everyone in the world would be
    running 5-minute frequencies all day.'
