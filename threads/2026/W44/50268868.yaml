  author: rbehrends
  text: 'Neither is the primary cause, I suspect. If you look at the coding index
    alone, you see more plausible results from a software engineering perspective
    (in particular, Terra no longer outperforming Fable) [1].<p>That especially the
    small flash models that are primarily optimized for coding tasks would perform
    worse at non-coding tasks is not per se surprising to me. The introduction of
    Terminal-Bench Science 0.1 in particular hurts their aggregate scores [2].<p>The
    general question remains of how meaningful aggregating the results of very heterogeneous
    tasks into a single numeric score is. (Aside from general questions about individual
    benchmark validity.)<p>Note: the cyber index is also interesting. While refusals
