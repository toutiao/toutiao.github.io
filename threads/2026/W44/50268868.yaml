  author: yorwba
  text: Their problem is really that individual benchmarks are not that informative.
    Bad enough models all perform at chance level, good enough models all saturate
    the benchmark. And the number of tasks is often low enough that differences of
    several percentage points might just be noise. Artificial Analysis&#x27; approach
    of aggregating scores in a weighted sum is largely just choosing which noise to
    amplify more.<p>I prefer Epoch&#x27;s <a href="https:&#x2F;&#x2F;epoch.ai&#x2F;eci"
    rel="nofollow">https:&#x2F;&#x2F;epoch.ai&#x2F;eci</a> methodology as they explicitly
    model benchmark saturation and also provide error bars for their estimates.
