  author: inbharath
  text: I used to think, since it won&#x27;t be feasible to make small models hold
    all the knowledge, the Chinese models were distilled and post-trained in such
    a way that whichever knowledge they lack, they were trained to search online and
    learn, and use that skill during production (inference). Almost none of the AA
    benchmarks had the &quot;web search&quot; access as one of its allowed tool usage
    except for GDPVal. While I do believe that the models must have some amount of
    knowledge on a subject to make proper search queries (just like how it is with
    humans) it need not be an expert on it, to do look up for information to complete
    daily tasks as seen in GDPVal, GDP.pdf, GDP.xlsx (as opposed to research work).<p>In
    this GDPVal benchmark, even a light-weight model such as Qwen 3.8 27B excels.
    And I remember very well, for creating the presentation slides for my master&#x27;s
    thesis, I used Claude Cowork Opus 5 vs OpenCode DeepSeek v4 Flash 0731 (with detailed
    prompt), and I couldn&#x27;t find a difference. Believe it or not, I ended up
    picking the DeepSeek&#x27;s file in the end. I am sucker for Vision-Language models
    and I hated these Chinese models for not being natively multimodal. But then I
    realized, at the end of the day, if we think about it, most of the things that
    we deal at academia&#x2F;work are digital entities and not everything requires
    a human-vision level  of perception (aka not all the AI models needs to be world
    models like the Google&#x27;s Genie model).<p>Now, how can they allow to make
    a small and efficient locally runnable model such as Qwen 3.8 27B (GDPVal score
    1427) look good compared to the gold standard multi-international platinum pro
    Astra model (GDPVal score 1584)? How can the investors be happy about it? AA should
    also have some investors - even if they didn&#x27;t back these US labs directly,
    it is hard to think that they don&#x27;t have some kind of understanding with
    these VCs&#x2F;PEs (or with the people at the top).<p>I saw some comment mentioning
    we need a &quot;Swiss&quot; bench. I am afraid it is very hard to see that kind
    of benchmark becoming popular. I have been following AA for almost an year and
    it has become like a gold standard. Unless there&#x27;s heavy funding from EU
    I don&#x27;t think it will happen. But the EU doesn&#x27;t even have enough funds
    to build AI let alone pour in money on something like this :( We just have to
    make people aware of what&#x27;s what. I hope this information gets widespread.
