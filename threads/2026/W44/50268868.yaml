  author: hgoel
  text: I was a little suspicious last time, but even moreso this time. The slant
    their scores take, and the release timing is very suspect. On the other hand,
    new models drop on a near daily basis, so maybe there&#x27;s no way to appear
    entirely fair.<p>An issue I think all benchmarks suffer from is regarding precision.
    What does a one point difference mean? How many points of difference is needed
    to translate into a meaningful distinction between models?<p>Among fellow humans,
    we often find ourselves picking what we consider to be most intelligent and then
    designing the tests around that. I&#x27;ve noticed a similar thing in AI, where
    whatever OAI&#x2F;Anthropic decide to focus on improving becomes the new measure
    of intelligence. With their latest models, this seems to be 3d modeling&#x2F;game
    making capabilities. Unsurprisingly, because that isn&#x27;t what the Chinese
    companies have been focusing on, they appear behind on &quot;frontier&quot; reasoning
    tests. On top of that, older tests end up being discarded for being saturated.
    Makes me think that maybe unintentionally, the methodology used for these scores
    might be biased towards Western companies.<p>This would also fit with the widely
    discussed decline in writing quality from Opus and the worse readability of code
    produced by one of OAI&#x27;s recent models, despite benchmarks continuing to
    show progress on all fronts.<p>Plus, if they&#x27;re going to update the benchmark
    so frequently to discard saturated components, is there even a research-related
    point to keeping it private?
