  author: toomuchtodo
  text: Solar panels are rated to handle 1 inch hail at 52mph (IEC 61215). Damaged
    panels can be easily replaced, and are typically covered by your homeowner&#x27;s
    insurance.<p><a href="https:&#x2F;&#x2F;www.energysage.com&#x2F;news&#x2F;solar-panels-withstand-hail&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.energysage.com&#x2F;news&#x2F;solar-panels-withstand-hail&#x2F;</a><p>-
    Every panel sold in the U.S. has to pass an industry-standard hail test, which
    fires ice balls at multiple points on the panel and requires no visible cracking,
    delamination, or more than a 5% drop in power output afterward. Companies like
    UL Solutions, an applied safety science company, test solar panels by dropping
    a two-inch solid steel sphere from 51 inches onto panels, simulating the impact
    energy of serious hail. Panels that survive without electrical hazards earn certification
    for real-world deployment.<p>- The proof is in the pudding—or in this case, the
    parking lot. When a severe hailstorm hammered the National Laboratory of the Rockies&#x27;
    (NLR) (formerly National Renewable Energy Laboratory (NREL)) Colorado campus in
    2017, just one single panel out of more than 3,000 suffered damage. That&#x27;s
    a 99.97% survival rate against Mother Nature.
  score: 0
