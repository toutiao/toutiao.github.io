  author: pfdietz
  text: 'Note that the thermal time constant of a given geometry scales as the square
    of the radius.  This is why subsurface geothermal heat is there even though it
    was &quot;charged&quot; gradually over millions of years.  So it&#x27;s not hard
    to achieve very long time constants just by making the pile a bit larger.  They&#x27;ve
    done these computations.  The result is the minimum practical size is a pile that
    provides ~100 kW(th) constant output.<p>So the idea is not practical for storage
    for an individual home, but could work on the scale of a village or small industrial
    enterprise.  It would allow a solar microgrid to be completely disconnected from
    the larger grid, even at high latitude (assuming one could get a sufficiently
    good heat engine to work at that scale; it&#x27;s a bit small for steam turbines.)<p>If
    you look at very large piles of dirt, like large earthen dams, if arranged in
    a suitable geometry they would have thermal time constants (assuming no fluid
    flow through them) in the thousands of years.<p>A computation for you: compute
    the cost of a given R value per m^2 for various materials.   Dirt is very cheap,
    so even if it&#x27;s not the best insulator it comes out on top.   You need the
    thing being insulated to be large enough that you can fit the thick dirt layer
    around it, of course.'
  score: 0
  posted_at: '2026-10-27T10:43:27Z'
- id: '50259064'
  parent_id: '50254662'
  author: pfdietz
  text: 'Even better than that: the thermal time constant is proportional to the square
    of the radius.  There&#x27;s the square&#x2F;cube effect that causes a factor
    of r ratio in the volume to surface area, but there&#x27;s also a factor of r
    from the temperature gradient (which, from the center of the pile to the surface,
    is inversely proportional to r).'
