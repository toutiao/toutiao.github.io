    talk about temperature up to ~600 C, which I believe is limited by the desire
    to use cheap steal (much hotter and creep becomes a problem).  This is also perhaps
    not coincidentally about the temperature of steam from a coal fired boiler, so
    one of the eventual goals is to repower retired coal fired power plants with this
    storage providing the heat instead of coal combustion.<p>You&#x27;re right this
