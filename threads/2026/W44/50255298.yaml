  author: nater5000
  text: Yeah, this is a succinct way to describe a <i>very</i> important dynamic in
    software engineering that is usually unfamiliar to most inexperienced developers
    but a central facet of most experienced developers.<p>Software engineering is
    almost always a process of iteration. The better you get at iterating, the better
    you are at engineering. This can take on a lot of forms (my old manager would
    constantly repeat the mantra &quot;don&#x27;t let perfect be the enemy of good,&quot;
    which is arguably a recognition of the same dynamic), but at the end of the day,
    if you expect to &quot;one-shot&quot; a complex implementation and you build a
    process around that assumption, then you <i>will</i> fail. Almost ironically,
    the best way to avoid that issue is to assume you <i>will</i> fail (potentially
    multiple times) and to build a process around <i>that</i> assumption.<p>Interestingly,
    it seems like a lot of experienced engineers I work with have just forgotten this
    concept in the world of AI. They expect AI to just get things perfect in one-shot
    and are dismayed when it fails. There&#x27;s a lot of discussion around how we
    handle code reviews because some developers are just letting AI one-shot a solution
    then sending it to review. It boggles my mind that competent engineers aren&#x27;t
    allowing their AI to fail, so to speak, and are instead wasting cycles trying
    to figure out how to get AI to produce the perfect solution the first time.<p>To
    me, it&#x27;s obvious that there&#x27;s just a fundamental gap in alignment that
    prevents a consistent &quot;perfect one-shot&quot; to probably ever be possible
    (at least, within the current paradigm of development). I can spend an hour writing
    a spec and try to include every little detail of context I can think of, but in
    what world could we expect anyone, let alone an AI, to be able to envision the
    solution the same way we can? We just lose <i>way</i> too much information through
    communication for that to ever be possible. Yet I see people very dismissive of
    the capabilities of AI because it&#x27;s not literally magic.
