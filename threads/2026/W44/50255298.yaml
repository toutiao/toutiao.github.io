  author: matsemann
  text: 'Not if you turn off your brain. Never actually stop to question the path
    you&#x27;re going down, because the speed is making you blind. Which is what I
    feel I see more and more. Or how do you even know it&#x27;s the wrong answer if
    you didn&#x27;t think it through before starting?<p>One example: setting the agent
    ablaze on some task, keeping it going, and after a few days of working with the
    agent you have a feature. But it&#x27;s not what you were supposed to make. The
    agent didn&#x27;t have all the context and made something slightly off, and you
    never internalized the problem enough to even spot it. If you actually stopped
    to think a bit on how the feature would have to work to tie it in with everything
    else, like you would have done before, you would&#x27;ve spotted it.<p>Second
    example: something wasn&#x27;t feasible to do before, due to not being worth the
    time investment. Like a feature that would need a bigger architectural change
    to implement. You and the agent take a crack at it, and rewrite huge parts of
    the code, and it seems to work. But now no one understands how, and it might have
    been the wrong way to solve it, you just went with it. Before, you would&#x27;ve
    sat down and discussed and thought about the architectural tradeoffs. Now one
    decision was just made with little thought.'
  score: 0
