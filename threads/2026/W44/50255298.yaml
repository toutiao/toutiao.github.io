  title: The Mythical Man-Month in the age of AI - Jan van den Berg
  fetch_status: success
  content: "# The Mythical Man-Month in the age of AI\n\nLast weekend I watched four
    people desperately trying to get a laptop to connect to a screen. I was happily
    observing their efforts, with zero intent to join in.\n\nBut someone nudged me:
    can't _you_ have a look at it?\n\nMy reply: \"Haha sorry no! My experience is
    that adding more people will not solve this problem any quicker\".\n\nI was of
    course -- indirectly -- referring to Brooks's Law:\n\n> \"Adding manpower to a
    late software project makes it later.\"\n\nIt was formulated by computer scientist
    Frederick P. Brooks Jr. in his 1975 book The Mythical Man-Month, based on his
    experience managing the IBM OS/360 project.\n\nHowever I got to thinking. Does
    this still hold up in the age of AI agents and LLMs?\n\nAt first glance, you’d
    think no. The traditional bottlenecks -- onboarding time, endless stand-ups, and
    office politics -- disappear overnight. An AI agent is up to speed in milliseconds
    and doesn't demand a coffee break.\n\nBut when you look closer, and the law hasn't
    vanished. It just mutated.\n\nThe famous [\"Baby Problem\"](https://en.wikipedia.org/wiki/Brooks%27s_law#:~:text=Adding%20more%20people,in%20one%20month%22.)
    remains: nine agents still can’t deliver a baby in one month. Sequential tasks
    are still sequential.\n\nOverhead hasn't disappeared; it shifted: instead of managing
    people, you are now managing agents. Someone still needs to define \"done\", review
    the code, catch hallucinations, and stitch the pieces together.\n\nThat someone
    is you.\n\nThrow nine autonomous agents at a single codebase without crystal-clear
    orchestration, and they will happily rewrite each other's work in a high-speed
    loop.\n\nMaybe the 2026 update to Brooks’s Law should be:\n\n> \"Adding agents
    to a project with unclear requirements gets you the wrong answer faster.\"\n\n⬅
    Previous post  \n[Interview with Ondřej Surý in the Atlanic](/ond%C5%99ej-sury-in-the-atlanic)"
