  author: prmph
  text: 'This does not apply in all cases.<p>Case in point: I am building a digital
    files archive organizer platform.<p>This is simply not the kind of product you
    do a quick prototype of, get it to market quickly, and iterate on based on any
    failures or issues.<p>There are an almost infinite number of ways to get the product
    wrong, in a technical, architectural, and business&#x2F;market sense. It requires
    a lot of deep thinking and internal prototyping to even get at what would actually
    be useful and address the walled-content-silos problem tech vendors love to foist
    on us. it requires careful implementation to not mess up user data. It requires
    a ton of architectural and UX design to get a performant product that is easy
    to understand. I have mulled over architectural decisions for months and thrown
    them out totally after mounting evidence they were not right, without a single
    user yet (except myself).<p>Just quickly coding up the first ideas that come to
    mind in this space is almost guaranteed to be wasted effort, because I could try
    a 100 approaches in the market and all could be bad. Do not let the users do your
    work for you. Make sure you actually understand what you are building and why
    it is important. Then let the user&#x27;s experiences tell you how to tweak it
    to be better.'
  score: 0
