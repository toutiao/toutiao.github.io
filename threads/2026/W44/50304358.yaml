  author: montroser
  text: My great hope is that we will look back on this as a tiny sliver of time,
    when everyone couldn&#x27;t resist the awesome power that came with running our
    devtools over the internet through megacorps, willingly handing over our code
    and secrets and dollars, in exchange for those sweet lines of code.<p>But then
    in the waning months of 2026, some inspired enthusiasts figured out how to run
    a model called Qwen3.8-Flash-Next on modest consumer hardware.  It was comparable
    to Opus-4.6, and the first such model that could run efficiently on a GPU with
    just 16GB VRAM.  This was the breaking point.<p>Next came Qwen4-Flash, which ran
    with similar efficiency but significantly higher capability, comparable to Opus-4.8.  Going
    into 2027, ternary bonsai builds, n-gram offloading, and hybrid diffusion models
    brought even more capable models to modest consumer hardware.<p>By early 2028,
    TPUs and unified memory became standard in Apple and Lenovo laptop computers,
    and the vast majority of software development was now done with LLMs running locally
    on users&#x27; devices.<p>In the 2030s came the humanoid robots.  By the end of
    the decade, for a cool $10k, one could have a trusted personal assistant that
    would cook and clean around the house, walk the dog, play with the children, even
    go to the gym for you.  All running with onboard TPUs and local models.
