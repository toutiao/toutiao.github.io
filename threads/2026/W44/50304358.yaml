  author: mrguyorama
  text: I don&#x27;t know what else to tell you, but yes a world where a company is
    free to single handedly buy all compute and then rent it out to you for insane
    prices is quite literally a free market.<p>If you do anything to prevent that,
    that would be a <i>less</i> free market. By definition.<p>Free markets have nothing
    to do with a market having healthy competition and sane behavior. Free markets
    in fact reward you with doing absurd things that fuck with prices to make your
    bag.<p>It is entirely the point of the free market that Micron can decide that
    selling all memory to only Anthropic is a better distribution of <i>their</i>
    resources and you can go pound sand if you can&#x27;t find any memory any more.<p>So
    yes, monopolizing all silicon in the world and then demanding you pay them for
    using it is literally a free market.<p>Free markets trend torwards monopolies
    and other market failures without intervention excepting very specific markets
    that have genuinely mostly fungible products that are easy to sell, which we call
    commodities, and even those can in fact become failed markets like what once happened
    with onions.<p>If you think this can&#x27;t be a free market because it&#x27;s
    in a bad place for you personally, you don&#x27;t understand market theory.<p>Free
    markets are also free to become &quot;distorted&quot; as you say.
