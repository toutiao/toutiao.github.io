    # Guide on how to grow chocolate at home

    by [CocoTerra](https://www.cocoterra.com/author/cocoadmin/ "Posts by CocoTerra") | Jan 15, 2024 | [Chocolate Information](https://www.cocoterra.com/category/chocolate-information/)

     ![home grown cacao tree](https://www.cocoterra.com/wp-content/uploads/home-grown-cacao-tree.jpg "home grown cacao tree")

    Follow CocoTerra on Social Media

    - [Follow](https://www.facebook.com/CocoTerraCo "Follow on Facebook")[Follow](https://www.facebook.com/CocoTerraCo "Facebook")
    - [Follow](https://instagram.com/cocoterra_co "Follow on Instagram")[Follow](https://instagram.com/cocoterra_co "Instagram")
    - [Follow](https://pin.it/3dwM1pS "Follow on Pinterest")[Follow](https://pin.it/3dwM1pS "Pinterest")
    - [Follow](https://www.linkedin.com/company/cocoterra "Follow on LinkedIn")[Follow](https://www.linkedin.com/company/cocoterra "LinkedIn")

    Growing chocolate at home might sound like a wild idea, right? Chocolate originates from cacao trees, which demand a tropical climate, specific growing conditions, and several years to reach maturity in order to flower and fruit to produce cacao pods. However, our CocoTerra founder, Nate Saal, took on the challenge and grew cacao trees in Northern California to test the limits of growing cacao. Surprisingly, he succeeded!

    Keep reading to discover how you can grow a cacao tree in your home and make your own chocolate.

    ## **What is needed to grow chocolate at home?**

    To grow chocolate, you’ll need a few essential items:

    - Cacao seeds or seedlings
    - A series of small to large pots
    - A tropical/subtropical climate or a warm indoor space (an outdoor greenhouse can also work)
    - A window or skylight with filtered sunlight
    - Water
    - Soil and fertilizer

    ## **Should I grow my chocolate indoors or outdoors?**

    Deciding whether to grow your chocolate indoors or outdoors depends on where you live and what temperatures the tree will be exposed to in your particular environment. [Cacao trees](https://www.cocoterra.com/where-did-the-first-cacao-trees-come-from/ "Where did the first Cacao trees come from?") usually do well in warm and humid tropical climates, so if you’re in such an area, growing them outside is a good choice. Cacao trees are also susceptible to wind damage, so make sure they are not too exposed.&nbsp; However, if you’re in a colder region, it might be better to grow your cacao trees indoors to give them the warmth they require.&nbsp; In the San Francisco Bay Area, indoors is the only option since it can drop to near freezing during the winter months.

    Keep in mind that growing cacao at home might be a bit harder since the tree is&nbsp; not in its usual environment. But if you’re dedicated and create the right conditions, you can enjoy the satisfying experience of growing your own chocolate ingredients.

    ## **Cacao seeds guide – Types and which one to choose**

    Selecting the perfect cacao type is essential for your chocolate-making adventure. In this article [10 distinct varieties of cacao: Ultimate cacao guide](https://www.cocoterra.com/10-distinct-varieties-of-cacao/), we explore different varieties of cacao from around the world. Each variety has its own unique flavor profile, ranging from fruity and floral to nutty and fudgy.&nbsp; When making your selection, make sure that you check the status of your selected variety to determine if it is self fertile or not.&nbsp; If not, you will have to grow at least two trees in order to cross-pollinate the flowers.

    We also strongly recommend the book [“The New Taste of Chocolate, Revised,”](https://www.amazon.com/New-Taste-Chocolate-Revised-Cultural/dp/158008950X) which delves into genetic discoveries related to chocolate varieties.

    ## **Step by step Guide on how to grow chocolate at home**

    ![](https://lh7-us.googleusercontent.com/mSUar1Btlh6az-SxMhrm6i2RhkKOlImveVGOvjlfzzvB1_rB4SGlL5vYBERXASZo-rfjxvfayo3ZwmWjaJk79c_sgJpMUNVQRJ3zf2CzIPh7gYXpqO5SMOE7pc5e7Na-y0KcD7vdsOtSdeR7b4R55AE)

    ### **Step 1 – Location Selection**

    Cacao trees love tropical climates with steady warmth and humidity, usually within 20 degrees of the equator. If you’re thinking about growing your chocolate at home, it’s important to consider your local climate. Depending on where you live, you might decide whether to grow your cacao indoors or outdoors. Temperatures between 65-85 F are ideal for cacao trees. Anything colder and it will die. Additionally, keep in mind that cacao trees can thrive in both full sun and partial shade, but seedlings shouldn’t be exposed to intense sunlight. If you’re growing your cacao plant indoors, a sunny window is an ideal spot for it.

    ![](https://lh7-us.googleusercontent.com/qyKMsXGNOgMosrgaEmS3MMzFeLmHqoKZB8XPEcM-wdwSokokDMyEkon5vIL4ZkIZ6GPBLhRNGt1Zl_3liRKxxEsX8F00IJoJrCfPKA50S3uO4SQuhwWoDz4J_cs_lpSGlQ11ag8pAGLvL5Hz-IbFrCw)

    ### **Step 2 – Prepping the Seeds**

    First and foremost, get cacao seeds from a reliable source and make sure they are fresh.&nbsp; If the seeds are fresh, they will be covered in a white pulp.&nbsp; Wash off all the pulp by lightly rubbing the outside of the seeds under running water.&nbsp; You can carefully peel off the outer seed shell, which will assist the germination (not easy to do and will take some practice).&nbsp; Once the seeds are prepped, place them in a bowl of water for 1-2 days until the root starts to poke out the side of the seed.&nbsp; Your seeds are now ready to plant.&nbsp; Don’t leave them in the water for too long or they might start to rot.

    ![](https://lh7-us.googleusercontent.com/QAo5ZobRrTJfVyoPLh0G8cjILT7iqULqubGdru4iMdaZGBoJTmSGMhVZD4uSve09BHfX1PZtHSxY61VTTMeAW6R5xnjv0FrRXhoNQDVlfZgGQ4sYD9G-pni_VZNWh8XMaszjd3_zQYqGk9QJUGGEsMQ)

    ### **Step 3 – Planting the Seeds**

    Plant the seeds in small pots filled with soil that drains well and is rich in nutrients. Ideally, the soil contains about 50% perlite or coarse sand to ensure proper drainage.&nbsp; When planting the seeds, make sure that they are pointing root side down and only bury them halfway into the soil.&nbsp; The seeds are prone to rotting, so make sure they are poking out of the soil.

