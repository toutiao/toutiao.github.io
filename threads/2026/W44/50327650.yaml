  author: rhaynes
  text: In part, yes of course. One thing that I respect a lot about Roddenberry was
    that when Isaac Asimov gave Star Trek a &quot;bad review&quot; publicly, he reached
    out and asked for feedback. They ended up becoming friends and Asimov helped advise
    him on the character development of Kirk and Spock&#x27;s friendship that became
    central to the original series.<p>But, if you watch the first season of TNG, it
    feels like there is a turning point where Patrick Stewart starts taking the role
    seriously (Symbiosis) and understands that he&#x27;s depicting Starfleet as an
    institution and the restrictions (the prime directive) that institutions must
    enforce. The fellow actors also seem to take the series more seriously after that
    episode while before it felt campy.<p>It&#x27;s clear he brought a gravitas to
    the role that inspired a team of young&#x2F;new actors around him. As he later
    joked in Making it So, he once took things too seriously on set yelling &quot;We&#x27;re
    not here to have fun!&quot; It became more than a job&#x2F;role to him and in
    doing so he and the other actors inspired a science-inclined subset of a generation
    and brought Roddenberry&#x27;s utopia vision to life.
  score: 0
