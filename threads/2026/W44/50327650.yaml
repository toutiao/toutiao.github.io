    Star Trek is cultish ideological juju in the form of swashbuckling egomania and theme park vacation.<p>Look at the colors: a tribe of C-suite nerds zip around in an atomic powered space-faring Hyatt Regency trying to train the universe to Taylorize all production methods. Its protagonists are utterly entitled and classist, who teach war as the essential force by which their lives incur meaning.<p>It&#x27;s is a soap-operatic long tail of Western empire indulging in fatuous &quot;adventure&quot;, which amounts literally beaming into alien realms to cause disturbance and justifying it through dominion or ignorance, while the executives try to believe they&#x27;ve moved beyond themselves so they can feel noble.<p>As a dramatic art, the show offers some moments of transcendence, but these end up sequestered to the commercial dictates of the franchise, which is an epic advert for consumerist Americana.<p>I feel deep suspicion about  anyone who regards cosplay as instructive about what makes for &quot;good men with power&quot;. And as Vox is a notable outlet in the great system of commercial attention-whoring that defines our culture, I feel double the suspicion.<p>Also See:<p>Phase IV (1974)
