  text: Yes and no. DS9 plays with things at the edges, much like Ian Banks’ novels
    deal with the  behavior that lies at the edge of the Culture and is part of what
    permits a utopian society to exist at all. It cuts directly to the question of
    when and if martial force —or other, more subversive mechanisms of power — must
    be deployed for protection against a force that threatens the existence of an
    otherwise non-violent society. I think these are criticisms of visions like Roddenberry’s
    without necessarily undermining them or missing the point entirely. I also think
    it’s been an ongoing commentary on modern civilization as much as speculative
    fiction.<p>Some of the other series and movies miss the point more dramatically
    for me by just becoming space opera. Star Trek was always political.
