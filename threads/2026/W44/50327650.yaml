  author: rhaynes
  text: And most of Shakespeare is similar. The good guys and the bad guys are obvious
    just like in fables. But it&#x27;s a hierarchy. It&#x27;s useful to teach very
    young children fables even though they&#x27;re silly. It&#x27;s an easy way to
    introduce concepts around how we treat each other fairly. TNG and Shakespeare
    are the same way. Just a step on the hierarchy. Yes, as a person reaches adulthood,
    it&#x27;s obvious that it&#x27;s simplified. But you&#x27;ve at least seen examples
    in art of what might be worth aspiring to in life when young. It&#x27;s why we&#x27;ve
    been telling each other hero&#x27;s journey stories since Homer. What are the
    alternatives? Examples of self-interest and power grabs with no consequences?
    To a young person that can be rapidly demoralizing.<p>Totally agree on the 45
    minute window limitation though. That&#x27;s why I&#x27;ve always liked DS9 where
    they took what could have been one episode about a culture and conflict and made
    it 7 seasons.
