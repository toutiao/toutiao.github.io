  text: I think about this episode a lot when people are debating AI.<p>Everyone who
    watches Star Trek roots for Data and his quest for humanity, and obviously sides
    with him in this &#x27;trial&#x27;.<p>Yet, it seems like most people have the
    opposite reaction towards the current advancement of AI. Obviously, the current
    AI we have is not sentient in the same way Data is, and I don&#x27;t think we
