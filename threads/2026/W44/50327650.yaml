  author: mike_hearn
  text: Sometimes, but not this one. The Federation is an impossible society, and
    it can teach us nothing about the real world.<p>It wasn&#x27;t intended to either.
    The writers realized early on that Roddenberry&#x27;s ideas were deluded and so
    they carefully avoided any plot that might get too close to exploring Federation
    society. There are a few quotes where they discuss their frustrations with Roddenberry&#x27;s
    ideas. ST:TNG spends much more time on alien non-Federation races than the Federation
    itself.<p>Eventually the writers and especially DS9 manages to smoothly steer
    Roddenberry&#x27;s universe back to something approximating human reality and
    exploring Federation life becomes possible. But the early years of TNG are largely
    a writeoff from a social commentary perspective.
  score: 0
