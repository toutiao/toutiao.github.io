  author: lemmsjid
  text: 'A historian can make their interpretation of history plausible.  A group
    of historians can reinforce a narrative that is then undercut by the next generation
    of historians.  What made Rommel a good commander is a complex question and we
    might not yet be done exploring the answer.<p>Picard the character was derived
    from the writers’ understanding of historical leaders. Saying the writing of him
    was solely for money or entertainment is like saying that a historian is only
    writing for a paycheck and prestige.<p>If you read the writings of the TNG writers,
    they were quite caught up in the ethical dilemmas they were presenting. Art that
    is purely for money is contrived and one dimensional.<p>Science fiction has an
    interesting and irreplaceable role in art: it can take a situation out of its
    immediate context and put it under another lens, clear of its modern cultural
    baggage. What makes science fiction interesting or not interesting is what it
    does with that ability: does it promote a simple good vs evil scenario, or does
    it explore the rich shades of grey that play out in real scenarios?<p>TNG was
    particularly good at showing real moral and ethical dilemmas that were quite thought
    provoking. Their head writers, particularly Michael Pillar and Ronald Moore and
    Jeri Taylor were deeply interested in exploring the implications and moral contradictions
    of the plots they presented.<p>Waving it all away as money grabbing is a reductive
    history at best.'
  score: 0
