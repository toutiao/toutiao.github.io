  author: rhaynes
  text: I had a similar experience rewatching Doctor Who a few years ago. But then
    I remembered it&#x27;s written as a children&#x27;s show. It introduces some genuinely
    terrifying concepts in a package that&#x27;s developmentally appropriate.<p>That&#x27;s
    why I referenced fables. Your complaint is that Star Trek is too fable-like. I
    would argue that it&#x27;s appropriate for a 12-year-old and having culturally
    relevant and age appropriate material to introduce to developing minds is important.<p>The
    original article&#x27;s thesis is that powerful institutions can also be good.
    If I were a teenager right now, I would feel the opposite based on what I see
    around me. I might believe the solution is to tear it all down. Stories about
    duty to higher ideals provide an alternative narrative that can easily be found
    in actual history (Lincoln&#x27;s belief in the union, Churchill&#x27;s belief
    in democracy).<p>&gt; Odyssey has less predictable structure<p>Yes, the Odyssey
    is higher up the hierarchy from fables and Star Trek. The core of the story is
    reclaiming identity when separated from everything you know. Calypso is the height
    of this. She offers to free Odysseus from his identity as a mortal human.  Seven
    of Nine reclaiming her humanity is probably the closest parallel to Odysseus in
    a simpler, more predictable package.
