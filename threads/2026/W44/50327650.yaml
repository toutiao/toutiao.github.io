    guy struggles with taking action. But the original comment I was countering was
    that popular entertainment doesn&#x27;t have anything to tell us about leadership.
    I think that the fact that Homer and Shakespeare have stayed popular for centuries
    and that we&#x27;re here in 2026 ranking them against other popular entertainment&#x2F;fiction
