  author: kjellsbells
  text: 'The explanation could hold water, but that only demonstrates plausibility,
    not truth.<p>Seems that a router that previously terminated copper interfaces
    was switched to terminate fiber. That alone doesn&#x27;t really tell us much without
    knowing whether this is really all that happened or if it&#x27;s shorthand for
    a bigger move at a higher level in the protocol stack. For example you might &quot;just&quot;
    have changed copper Cat6 ports to fiber&#x2F;SFP but still be doing GigEthernet
    and I rather doubt that a move that simple could make a router misbehave.<p>Moving
    up the stack this get more interesting. For example they might have moved from
    a copper star topology to a fiber ring, and rings need care or else chaos ensues.
    Similarly Ethernet gets pissy if there are loops but the spanning tree protocols
    need very careful usage. I assume since the word router was used that Ethernet
    was fine and we are in layer 3. An interface switch could have triggered recalculation
    or reannouncement of routes, for example by erroneously configured routing protocols.
    eg the Arkansas router announces it is the best hop for traffic to reach Chicago,
    gets swamped with traffic from Dallas, NY, etc, and falls over. (Yes, the tools
    provide guardrails. Who knows if they were enabled?)<p>However, and esp because
    Duffy is pointing at L3Harris, I suspect they installed (or perhaps removed) a
    Juniper TDM to Ethernet converter module (eg DS3 SmartSFP from that vendor) and
    something went bad. These modules are supposed to encap TDM into Ethernet but
    they don&#x27;t (iirc) have any semantic awareness of a telephone call, so if
    they were to be hit by, say, a storm of TDM circuit messages (call setups, say)
    they might just pass them on, not rate limit them like a true telco packet switch
    would.<p>It might be pure coincidence that an AI system was hooked up to the FAA
    system the week before.<p>Bottom line: could be bad luck, could be basic screw
    up, we won&#x27;t know for years.'
