  author: ssl-3
  text: 'It reminds me of a time, over 20 years ago, when I was the main part of upgrading
    large plant&#x27;s phone system to my company&#x27;s on-premise VOIP offering.<p>It
    was more than a normal factory; it was a giant place that designed and built complex
    machines that were sent out to make other complex machines at much higher volume.<p>Anyway,
    the cutover was badly-planned but it went smooth-enough.  I had issues with their
    PRI and the T1, and <i>my fucking manufacturer rep who was supposed to be present
    on-site was completely fucking AWOL</i>, but I got lasting help from some dude
    from Sprint who was exquisitely patient and we walked through switch configuration
    options at all levels, including for circuits that did not belong to Sprint.<p>It
    worked.  It worked great, in fact.  We met the deadline.  There were some details
    to sort, but they weren&#x27;t significant and everyone agreed that they could
    wait a day or three.<p>I dusted myself off after a 38-hour continuous shift, drove
    home, and collapsed on the sofa in the front room with a huge, bright south-facing
    window.<p>20 minutes later, my phone rings.  It&#x27;s my boss.<p>&quot;Hey, uh.  They
    say their network is completely hosed.  For the entire plant.  They want you to
    call them right now.&quot;<p>I know that all I did was replace a phone system
    and put in some VOIP desksets -- all I did was add some network endpoints -- but
    whatever.  I call them.<p>It&#x27;s positively fire and brimstone over there.  &quot;WHAT
    DID YOU DO TO OUR NETWORK!  NOTHING WORKS!  THE WHOLE THING IS JUST FULL OF PACKETS,
    AND NONE OF THEM FUCKING MEAN ANYTHING!  PRODUCTION, OFFICE, EVERYTHING!&quot;<p><i>yawn</i><p>I
    got my boots on, found some coffee, and started driving back.<p>When I walked
    back in I expected to be drawn, quartered, and gutted, but it was instead weirder
    than that:  &quot;WHY DID YOU PLUG BOTH PORTS OF THIS VOIP PHONE INTO THE WALL?&quot;<p>I
    hadn&#x27;t.  None of us had.  It was all working quite sensibly when we left.<p>&quot;BOTH
    PORTS WERE PLUGGED INTO THE WALL!  THIS CRASHED OUR ENTIRE NETWORK!  WE LOOKED
    EVERYWHERE!  AND WHEN WE UNPLUGGED <i>YOUR</i> PHONE, WITH BOTH OF ITS CABLES,
    THINGS GOT BETTER!  WE&#x27;RE SO PISSED AT YOU RIGHT NOW!&quot;<p>I was several
    layers beyond being too tired to care much about these strong words.  And it was
    working again, so I left.  I made it back home somehow.<p>---<p>What happened:<p>This
    plant had a switched network that they were very proud of.  It used HP Procurve
    switches, in a special mesh mode.  They were very pleased to explain, quite early
    on, exactly how robust this was:  It was very fast when the mesh was intact, and
    it would adjust immediately to failures between switches and still be Fast Enough
    when the mesh was not intact.<p>But!  This version of that topology was incompatible
    with STP, so STP was not turned on.<p>So when someone (not us-the-installers,
    nor them-the-plant-IT folks, but <i>someone</i>) plugged both dumb ports of the
    10&#x2F;100 switch in one lowly IP phone into that network:  Their entire network
    shit the bed.  Bad.  It shit up the entire bed very completely.<p>(I understand
    that this HP Procurve mesh&#x2F;STP incompatibility problem was subsequently resolved
    with firmware but that was well after this plant&#x27;s network crash.)'
