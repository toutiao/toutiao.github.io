    flights could land.<p>Regional&#x2F;sector ATC (managing flights en route that
    left the departing airport airspace and have not yet arrived to the arrival airport
    airspace) are also transmitting in AM but the actual operations are not where
    the transmitters are (as a lot of them are in the middle of nowhere). The voice&#x2F;data
    transmits back and forth from the actual op centers to the transmitters&#x2F;receivers
    over the network. Which is what went down.<p>Actually some short flights (like
    flight schools or private pilots on short flights) were allowed to continue to
    operate, as they never left the airport or arrived at an airport so close that
    they never needed to talk to ATC managing a sector.
