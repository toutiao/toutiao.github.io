  author: linsomniac
  text: 'I would hope we have learned something since 1996 about running networks
    though.  ;-)<p>It sounds like part of the problem was a flood of bad traffic,
    which you could imagine rate limiting or loop&#x2F;flood mitigation could reduce
    the blast radius.  Do you suppose that wasn&#x27;t put in place because they figured
    it&#x27;s a secure network so no need?<p>Since we&#x27;re on a historic outages
    sidequest: back in 1996 I was getting my e-mail via UUCP by calling Boulder, CO,
    and they had an outage because they were using the Sun-provided UUCP which stored
    all the data files in one directory.  Once the backlog grew to around 100K files,
    the system couldn&#x27;t read the directory within the UUCP timeout.  Sidebar:
    I suggested they switch to Taylor UUCP and they said it had some stability problems
    at large scale.  I mentioned this to Lance Ian-Taylor and he replied &quot;That&#x27;s
    news to UUNET&quot;.'
