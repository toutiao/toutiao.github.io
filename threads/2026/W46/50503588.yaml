  text: I don&#x27;t have the full story because it happened in another business unit,
    but one of the worst outages I ever worked the rumour was it was caused by someone
    doing prep work for a later cutover to new hardware. Whatever they were doing
    to prep for the upcoming cutover, the router rebooted. They didn&#x27;t know it
