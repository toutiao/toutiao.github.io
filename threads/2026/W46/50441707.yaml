  author: microtonal
  text: "<i>I think this interpretation is a bit too negative.</i><p>You wrote a long
    message to say that you agree with me technically, but then said that it has good
    uses as well. I don&#x27;t disagree with that, but the problem with these companies
    is - you give them one finger and they take your whole hand. Besides that,<p><i>If
    you don&#x27;t want to locally host your smart home automations (you and I do,
    but the average consumer doesn&#x27;t) this can be very useful. It&#x27;s also
    really helpful if you want to access your own devices remotely over the Internet
    and not need to bother with port forwarding.</i><p>this implies that this is not
    possible with Zigbee. You can use your devices remotely with Zigbee, but it is
    fully governed by your Zigbee hub&#x2F;coordinator. You can use Home Assistant,
    the IKEA hub, the Samsung SmartThings hub, Homey, etc. to control your Zigbee
    devices remotely. The very big, but relevant difference is that the devices themselves
    cannot connect to the mothership to do analytics or to lock away functionality.
    There were already some Thread + Matter devices that required talking to the manufacturer&#x27;s
    servers to get all functionality (I think e.g. some Nuki devices, but I might
    misremember).<p><i>If you don&#x27;t want your devices reaching out to the Internet
    (like I don&#x27;t), the solution is to put all that stuff on its own VLAN with
    no Internet access (which I do).</i><p>Putting Thread + Matter devices on a different
    VLAN than e.g. your phone which you are commissioning it with is very fragile.
    So fragile that most Matter documentation just says &quot;your phone needs to
    be on the same WiFi network as your smarthome hub&quot;. It is possible (I had
    such a setup for a while), but requires that you e.g. do allow mDNS advertisements
    across VLANs (since Matter relies heavily on mDNS). Since you are talking about
    average consumers, Zigbee will give them privacy without any extra work, whereas
    with Thread + Matter they have to set up their network in a way that their ISP-provided
    router most likely doesn&#x27;t even support.<p>Thread + Matter has no point outside
    very large deployments and giving a bunch of companies the opportunity to start
    data mining your sensor data as well."
