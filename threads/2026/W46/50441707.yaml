  author: ssl-3
  text: It all has its place.<p>RPi hardware is nice because it&#x27;s a fairly-consistent,
    known quantity.  All copies of a given board have the ~same features and bugs,
    so an image made for someone else&#x27;s Pi 4 will run on my own Pi 4.  This grants
    appliance-like utility that we haven&#x27;t really ever had much of in the x86
    PC space.<p>Pi hardware almost never shows up as cheap as a person might wish
    for.  It&#x27;s scarce on the used market, even when prices are high.  In that
    space, demand outstrips supply.<p>And it&#x27;s never been &quot;cheap&quot;.  A
    decade and a half ago when it first showed up, folks were already comparing the
    price (plus the SD card, and the appropriate power brick, and the USB cable, and
    the wifi adapter, and some kind of housing) to that of a used PC or laptop, and
    the Pi seldom came out on top.<p>But if we&#x27;re doing new vs new, then it does
    alright price-wise.<p>And it&#x27;s tiny.  It&#x27;s got some hackability built
    in, with the not-USB camera interface and the not-HDMI display support, and some
    GPIO that can be useful for some stuff.<p>It&#x27;s got places where it&#x27;s
    useful.  I use them in those places.  (And despite that lengthy defense, I run
    Home Assistant on a cheap SFF Lenovo box that came to me with RAM and an SSD for
    $50, delivered, in pre-used form)
