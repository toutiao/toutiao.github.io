  author: diggernet
  text: 'Love your rules.<p>My personal situation imposes even stricter versions of
    your #1 and #2:<p>1. No network, no problem. Anything core to the house has to
    work with Wi-Fi or automation server shut down.<p>2. Smart functionality must
    not remove dumb functionality.<p>As one example: having a physical switch that
    controls a light and the switch can be operated by automation is good. Having
    automation control a light and the switch just tells automation what to do is
    bad.<p>This does make things hard sometimes. For instance, your sprinkler controller
    doesn&#x27;t pass that bar. In fact the only one I&#x27;ve found so far that has
    a local API for automation plus full &quot;dumb&quot; on-device control (no Wi-Fi,
    no app) is RainMachine, and they are gone. If only OpenSprinkler hardware had
    a touch screen for local UI.'
