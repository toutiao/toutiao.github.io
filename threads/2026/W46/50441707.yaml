  author: wolrah
  text: "&gt; 1. No network, no problem. Anything core to the house has to work with
    Wi-Fi or automation server shut down.<p>This is one of the reasons I love Zigbee,
    the device network is entirely independent of my computer network, can not directly
    communicate to the internet in any way, and every device I&#x27;ve put on the
    network so far can be configured to directly communicate with other devices so
    basic functionality remains operational even if the controller goes down.<p>For
    example, in my living room I have a Lutron Aurora dimmer dial locking a standard
    switch in the on position, then plugged in to the outlet that switch would normally
    control is a Leviton dimmer module.  Both connect to the network controlled from
    a PoE Zigbee dongle, but have been directly paired as well so pressing the button
    on the dial makes it directly tell the dimmer module to turn on, rotation commands
    are sent direct, etc.<p>The controller <i>also</i> receives these commands when
    it&#x27;s active and can add to the functionality for inputs like double-click,
    but if it&#x27;s down the basic functionality still works entirely as a normal
    person would expect.  You walk in to the room and see a knob on a switch plate,
    you turn the knob and the light brightness increases regardless of the state of
    the internet, my home server, or even my network as a whole.<p>The other major
    advantage compared to Matter&#x2F;Thread is that it&#x27;s <i>not</i> IP based
    so it&#x27;s impossible for any Zigbee device to ever have a cloud dependency.
    \ No matter how much some marketing dingus might want to, it can not be ruined."
