  author: microtonal
  text: |-
    Thread over Matter is not fully local. In Thread &lt; 1.4, devices can connect to internet servers through NAT64. Most Thread Border Routers (AFAIR Home Assistant + OTBR is the main exception) do not allow you to disable NAT64.<p>In Thread &gt;= 1.4, devices can request globally routable IPv6 addresses. The Thread 1.4 white paper does not hide the intentions:<p><i>The Thread 1.4 Border Router acts as the
    IPv6 router between the Thread network and external networks,
    including the user&#x27;s home network and the larger internet. It is by default
    configured to support external communication [...]</i><p><i>Cloud Connectivity: Direct internet connectivity enables Thread devices
    to easily connect to cloud services. This facilitates remote monitoring,
    control, and firmware updates, enhancing the user experience and
    enabling remote device management capabilities. Device vendors can
    now directly service and support their deployed fleet of devices,
    regardless of which application ecosystem each device is integrated
    with.</i><p><a href="https:&#x2F;&#x2F;threadgroup.org&#x2F;Portals&#x2F;0&#x2F;Documents&#x2F;Thread_1.4_Features_White_Paper_September_2024.pdf" rel="nofollow">https:&#x2F;&#x2F;threadgroup.org&#x2F;Portals&#x2F;0&#x2F;Documents&#x2F;Thread_1.4_Featu...</a><p>This is what you get when you let Google, Amazon, Apple, and Samsung design a smart home standard. They&#x27;ll use every opportunity extract analytics and increase control. You&#x27;ll own nothing and be happy.<p>Zigbee, Z-Wave, and ESPHome over WiFi&#x2F;Thread are the only major modern local and privacy-preserving smart home standards.<p>Matter over WiFi is also not fully local for obvious reasons (though you can try to block them on the router&#x2F;firewall and&#x2F;or put them on a separate VLAN).
