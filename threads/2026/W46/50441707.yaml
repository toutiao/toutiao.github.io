  author: MostlyStable
  text: I tried to stick to this philosophy, specifically the part about it working
    even if my local automation server is down, for a long time. But I finally found
    an automation case where I wanted functionality where I could not simultaneously
    have the functionality and have the switch continue working when the server was
    off.<p>Specifically, I wanted the switch to turn on different lights depending
    on the time of day. In the evenings in early morning I wanted it to turn on the
    dimmer floor lamps, and during the day, I wanted it to turn on the brighter Center
    room light. This was not possible without turning the switch from a light turning
    on device, to an automation activating device.<p>I thought really long and hard
    about if I was worth the trade off, and in the end I decided that my automation
    server was only likely to be down for significant periods of time if the power
    was out and the lights weren&#x27;t working anyways. If I run into a situation
    where this becomes a problem for me, I&#x27;ll reconsider my decision. Which is
    a great thing about the local control. If I make a decision that I don&#x27;t
    like I can just change it.
