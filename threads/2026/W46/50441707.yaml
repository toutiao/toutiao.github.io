  text: Bought our home almost 20 years ago, and the former owner (apparently) owned
    a now-defunct home automation business. The upside was 100% X10&#x2F;Insteon power
    and light controls, top alarm panel, environmental controls and so on running
    off of a wall-mounted &quot;SmartLinc&quot; touch panel. I expanded the system
    with Axis cameras and a Mac Server running Indigo and SecuritySpy (non-subscription),
    which enabled remote monitoring and control, but it all operates locally.<p>In
    a moment of weakness, I bought a D-Link wireless (wifi) water detector for the
    sump pit (it was on clearance for $30); it relied on a D-Link Home cloud service
    (free) that was closed down a few years ago.<p>Not wanting to toss it, I repurposed
    a spare Chromebook 14 that I was going to recycle and turned it into a Alpine
    monitor for the water detector, which I&#x27;m powering from the Chromebook&#x27;s
    USB port (if power is lost in a rainstorm, I need to know about it before the
    sump pit fills up).<p>An immediate issue was that the D-Link firmware tried to
    &quot;phone home&quot; every 24 hours and would drop from the local network, since
    the server was kaput, and I had no clue what response it was expecting from the
    server to keep it alive. Solution; &quot;reboot&quot; the unit by interrupting
    USB power (with a Pico and MOSFET) every 23 hours. There&#x27;s no question that
    home automation should work without the internet.
