  content: "# 500 Lines or Less  \nA 3D Modeller\n\nErick Dransch\n\nIf you enjoy
    these books, you may also enjoy [Software Design by Example in Python](https://third-bit.com/sdxpy/)
    and [Software Design by Example in JavaScript](https://third-bit.com/sdxjs/).\n\n_Erick
    is a software developer and 2D and 3D computer graphics enthusiast. He has worked
    on video games, 3D special effects software, and computer aided design tools.
    If it involves simulating reality, chances are he'd like to learn more about it.
    You can find him online at [erickdransch.com](http://erickdransch.com)._\n\n##
    Introduction\n\nHumans are innately creative. We continuously design and build
    novel, useful, and interesting things. In modern times, we write software to assist
    in the design and creation process. Computer-aided design (CAD) software allows
    creators to design buildings, bridges, video game art, film monsters, 3D printable
    objects, and many other things before building a physical version of the design.\n\nAt
    their core, CAD tools are a method of abstracting the 3-dimensional design into
    something that can be viewed and edited on a 2-dimensional screen. To fulfill
    that definition, CAD tools must offer three basic pieces of functionality. Firstly,
    they must have a data structure to represent the object that's being designed:
    this is the computer's understanding of the 3-dimensional world that the user
    is building. Secondly, the CAD tool must offer some way to display the design
    on the user's screen. The user is designing a physical object with 3 dimensions,
    but the computer screen has only 2 dimensions. The CAD tool must model how we
    perceive objects, and draw them to the screen in a way that the user can understand
    all 3 dimensions of the object. Thirdly, the CAD tool must offer a way to interact
    with the object being designed. The user must be able to add to and modify the
    design in order to produce the desired result. Additionally, all tools would need
    a way to save and load designs from disk so that users can collaborate, share,
    and save their work.\n\nA domain-specific CAD tool offers many additional features
    for the specific requirements of the domain. For example, an architecture CAD
    tool would offer physics simulations to test climate stresses on the building,
    a 3D printing tool would have features that check whether the object is actually
    valid to print, an electrical CAD tool would simulate the physics of electricity
    running through copper, and a film special effects suite would include features
    to accurately simulate pyrokinetics.\n\nHowever, all CAD tools must include at
    least the three features discussed above: a data structure to represent the design,
    the ability to display it to the screen, and a method to interact with the design.\n\nWith
    that in mind, let's explore how we can represent a 3D design, display it to the
    screen, and interact with it, in 500 lines of Python.\n\n## Rendering as a Guide\n\nThe
    driving force behind many of the design decisions in a 3D modeller is the rendering
    process. We want to be able to store and render complex objects in our design,
    but we want to keep the complexity of the rendering code low. Let us examine the
    rendering process, and explore the data structure for the design that allows us
    to store and draw arbitarily complex objects with simple rendering logic.\n\n###
    Managing Interfaces and the Main Loop\n\nBefore we begin rendering, there are
    a few things we need to set up. First, we need to create a window to display our
    design in. Secondly, we want to communicate with graphics drivers to render to
    the screen. We would rather not communicate directly with graphics drivers, so
    we use a cross-platform abstraction layer called OpenGL, and a library called
    GLUT (the OpenGL Utility Toolkit) to manage our window.\n\n#### A Note About OpenGL\n\nOpenGL
    is a graphical application programming interface for cross-platform development.
    It's the standard API for developing graphics applications across platforms. OpenGL
    has two major variants: Legacy OpenGL and Modern OpenGL.\n\nRendering in OpenGL
    is based on polygons defined by vertices and normals. For example, to render one
    side of a cube, we specify the 4 vertices and the normal of the side.\n\nLegacy
    OpenGL provides a \"fixed function pipeline\". By setting global variables, the
    programmer can enable and disable automated implementations of features such as
    lighting, coloring, face culling, etc. OpenGL then automatically renders the scene
    with the enabled functionality. This functionality is deprecated.\n\nModern OpenGL,
    on the other hand, features a programmable rendering pipeline where the programmer
    writes small programs called \"shaders\" that run on dedicated graphics hardware
    (GPUs). The programmable pipeline of Modern OpenGL has replaced Legacy OpenGL.\n\nIn
    this project, despite the fact that it is deprecated, we use Legacy OpenGL. The
    fixed functionality provided by Legacy OpenGL is very useful for keeping code
    size small. It reduces the amount of linear algebra knowledge required, and it
    simplifies the code we will write.\n\n#### About GLUT\n\nGLUT, which is bundled
    with OpenGL, allows us to create operating system windows and to register user
    interface callbacks. This basic functionality is sufficient for our purposes.
    If we wanted a more full-featured library for window management and user interaction,
    we would consider using a full windowing toolkit like GTK or Qt.\n\n#### The Viewer\n\nTo
    manage the setting up of GLUT and OpenGL, and to drive the rest of the modeller,
    we create a class called `Viewer`. We use a single `Viewer` instance, which manages
    window creation and rendering, and contains the main loop for our program. In
    the initialization process for `Viewer`, we create the GUI window and initialize
    OpenGL.\n\nThe function `init_interface` creates the window that the modeller
    will be rendered into and specifies the function to be called when the design
    needs to rendered. The `init_opengl` function sets up the OpenGL state needed
    for the project. It sets the matrices, enables backface culling, registers a light
    to illuminate the scene, and tells OpenGL that we would like objects to be colored.
    The `init_scene` function creates the `Scene` objects and places some initial
    nodes to get the user started. We will see more about the `Scene` data structure
    shortly. Finally, `init_interaction` registers callbacks for user interaction,
    as we'll discuss later.\n\nAfter initializing `Viewer`, we call `glutMainLoop`
    to transfer program execution to GLUT. This function never returns. The callbacks
    we have registered on GLUT events will be called when those events occur.\n\n
    \   class Viewer(object):\n        def __init__ (self):\n            \"\"\" Initialize
    the viewer. \"\"\"\n            self.init_interface()\n            self.init_opengl()\n
    \           self.init_scene()\n            self.init_interaction()\n            init_primitives()\n
    \   \n        def init_interface(self):\n            \"\"\" initialize the window
    and register the render function \"\"\"\n            glutInit()\n            glutInitWindowSize(640,
    480)\n            glutCreateWindow(\"3D Modeller\")\n            glutInitDisplayMode(GLUT_SINGLE
    | GLUT_RGB)\n            glutDisplayFunc(self.render)\n    \n        def init_opengl(self):\n
    \           \"\"\" initialize the opengl settings to render the scene \"\"\"\n
    \           self.inverseModelView = numpy.identity(4)\n            self.modelView
    = numpy.identity(4)\n    \n            glEnable(GL_CULL_FACE)\n            glCullFace(GL_BACK)\n
    \           glEnable(GL_DEPTH_TEST)\n            glDepthFunc(GL_LESS)\n    \n
    \           glEnable(GL_LIGHT0)\n            glLightfv(GL_LIGHT0, GL_POSITION,
    GLfloat_4(0, 0, 1, 0))\n            glLightfv(GL_LIGHT0, GL_SPOT_DIRECTION, GLfloat_3(0,
    0, -1))\n    \n            glColorMaterial(GL_FRONT_AND_BACK, GL_AMBIENT_AND_DIFFUSE)\n
    \           glEnable(GL_COLOR_MATERIAL)\n            glClearColor(0.4, 0.4, 0.4,
    0.0)\n    \n        def init_scene(self):\n            \"\"\" initialize the scene
    object and initial scene \"\"\"\n            self.scene "
