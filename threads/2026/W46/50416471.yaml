    This seems like a weak argument.  If you look back to the 1990s, Intel was <i>unbelievably</i> dominant in desktop computing.  There was never any discussion that anti-trust law should be used to somehow &quot;break that monopoly&quot;.  They were just damn good -- way, way better than all of the other competitors.  Eventually, Intel&#x27;s intellectual property pipeline slowed considerably (for a multitude of reasons) and AMD was able to catch-up.  And it looks like ARM is biting at the heels of both Intel and AMD.<p>Tangential: I am surprised that the US gov&#x27;t isn&#x27;t paying SpaceX to continue the Falcon 9 programme.  That rocket is used <i>a lot</i> to launch US military &amp; spy satellites.  Plus, Musk is very patriotic.  I suppose there were some private conversations between Musk&#x2F;Shotwell and senior US gov&#x27;t officials (military and&#x2F;or spy).
