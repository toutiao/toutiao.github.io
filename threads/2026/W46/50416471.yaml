  author: skew-aberration
  text: The main negative coverage I&#x27;ve heard is actually that starship is clearly
    optimized for the commercial LEO market while it has received to date $3B (of
    $5B) of government funds intended for space exploration as part of a contract
    it may never deliver on (at least, as it was originally envisaged), delaying Artemis
    by years and costing the government at least a further $5B in funding of gateway
    projects which will also be delayed and require expensive re-engineering if&#x2F;when
    they are ever deployed.<p>This could be seen as either straightforward corruption
    or a gamble on the Starship platform for future Mars exploration.<p>There are
    very sound <i>economic</i> reasons why rockets for Moon exploration like Saturn-V
    were built the way they were. Saturn-V was around $35-40B in today&#x27;s money
    for 13 rockets and 6 landings (excluding lander, crew costs). It took 5.5 years
    from greenlight to first successful orbital flight (which was also its first flight).
    Starship will likely meet this target of 6 landings after about 20 years of development,
    $25B R&amp;D (excluding crew&#x2F;lander contracts), and possibly about $5B in
    launch costs. Asymptotic costs will of course be much lower, but launch costs
    do not dominate space exploration costs. The platform might be capable of Mars
    missions one day - but it&#x27;s not clear how far out that goal is.
