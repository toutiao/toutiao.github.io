    to the HLS contract either.<p>But a) it is more like $40B and b) we don&#x27;t
    have full numbers yet to make this comparison apples to apples. SLS costs come
    from the shorter timeline, the expensive shortcuts like ultralightweight shell,
    H2 fuel, disposable design, the crew rating, and <i>the profit paid to manufacturers</i>.
    We still don&#x27;t know the equivalent numbers for starship: how long the timeline
    will be, the cost of taking the same payload to TLI, if the heavy structure will
    ever work as a lunar lander, if the booster can be used with an H2 upper stage
    &#x2F; lander alternative, if the fully reusable architecture will work for lunar
    missions (depends on refueling performance), and finally how much profit SpaceX
    will make on these government missions (which depends on the market).<p>If those
    problems are all solved, and SpaceX gives NASA a good price, then we could see
    starship emerging as the best value somewhere between 2030 and 2035. Solving them
    in time for Artemis IV 2028 seems very unlikely now though.'
