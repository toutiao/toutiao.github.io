  author: labcomputer
  text: Sure, but this pesky thing called the Constitution (specifically the 5th Amendment)
    requires paying what is essentially the fair market value of whatever is nationalized.<p>Now
    that SpaceX is a public company, it&#x27;s somewhat harder to argue that the $2T
    valuation is just made up.  So nationalizing it would probably entail handing
    Musk a fairly large fraction of a trillion (with a t) dollars in cash.  The total
    cost of nationalization would equal the annual federal deficit, or 1&#x2F;40th
    of the total federal debt.<p>And to what end?  Current jurisprudence is that,
    when the government takes something, the purpose of the taking must be for some
    kind of generalized public benefit, not the enrichment of specific people... so
    that opens an avenue for Musk to argue that the purpose is actually to enrich
    ULA or Blue Origin or Rocketlab (or some combination of those three) via reduced
    competition for space launches.<p>If and when it were decided that the US govt
    can legally take it, I would think that XKCD 538 is relevant to whether or not
    it could be done technicaly.
