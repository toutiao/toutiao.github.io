  author: tristanj
  text: Launching only 26 Starlink v3 satellites is a disappointingly small number.
    That&#x27;s about ~52t or half the block 3 advertised payload capacity of 100t.
    Elon said on the Q3 earnings call that flight 14 carrying 26 V3 Starlinks was
    only about half loaded, so apparently the ship can launch twice as many.<p>I&#x27;m
    curious why they don&#x27;t fully load it, I can speculate:<p>0) starship is still
    in testing, they don&#x27;t want to change too many variables from flight 14 and
    add 50t of payload.<p>1) lower payload gives them more options in engine-out situations.
    On flight 14, both booster and ship had engines fail.<p>2) derisking for ship
    failure, each Starlink sat costs ~$1.2m, and losing $30m of satellites hits less
    hard than $60m if orbital insertion fails.<p>3) the dispenser installed on ship
    42 only fits 26 sats, and increasing this would require a hardware modification
    and possible delays.<p>4) Starlink v3 manufacturing is delayed and they don&#x27;t
    have enough units, which I find doubtful given Starship is years late and they
    should have a backlog of v3s waiting to launch.<p>5) block 3 has worse performance
    than expected and can&#x27;t reliably deliver 100t to orbit. Recent comments that
    raptor 3 can only reliably deliver 230t of thrust instead of 280t support this.
    I speculate SpaceX is running raptor 3 &gt;230t on booster ascent, which is why
    we keep seeing engines failing. This should be resolved by block 4 or 5 with raptor
    4.
