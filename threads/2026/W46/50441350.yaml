    # Draft, model, and document. Together.

    Precision 2D drafting and 3D modeling, with multiplayer editing and an AI agent that drafts, models, and renders alongside you.

    ## Pro 2D & pro 3D in one app.

    2D drafting and 3D solid modeling in one fast, beautiful workspace, from a command line that takes the shortcuts you already know.

    ## Powerful AI on your terms.

    Ask a question or describe an edit in plain words, and the agent works right in your drawing.

    Asked whether a stair meets code, the agent on the command line finds its risers are over the IRC's limit, works out that 15 risers fix it, and, when told to fix it, drafts the change on the plan underneath, waiting for Apply or Discard.

    ## Always up to date. Every change on record.

    One source of truth for every drawing. No emailed copies, no files checked out, no “final_v3.” Every edit is kept with who made it and when.

    ### Multiplayer editing

    Share a link and everyone works in the same file, so there's never a stale copy, and you can see who's working where.

    Maya Chen · 2m

    Can the bore go to Ø32 for the larger bearing?

    Alex Rivera · now

    Opening it up now.

    Two teammates in the same part drawing, each with a named pointer, and a comment thread pinned to the bore asking to enlarge it.

    ### A clear record of every change.

    Every file keeps unlimited version history, so nothing is lost and any change can be traced back.

    Version history

    - Rev AFromAlex · Yesterday, 16:42

    Rev A

    Alex · Yesterday, 16:42

    - Bolt patternYou · Today, 10:18

    Bolt pattern

    You · Today, 10:18

    - Rev BToAlex · Today, 11:06

    Rev B

    Alex · Today, 11:06

    - Current versionYou · Today, 11:32

    Current version

    You · Today, 11:32

    Rev A Rev B

    A mounting plate compared across two versions in its history: a new bolt pattern tinted as added, a larger bore tinted as changed with its old size ghosted, and a deleted slot ghosted as removed.

    ## Document everything, beautifully.

    A drawing set is only as good as its annotation. Dimensions, GD&T, leaders, text, and tables, on layouts with viewports at any scale that print exactly as they look.

    ## Bring your files. Take them anywhere.

    Open DWG and DXF with their layouts, blocks, and dimensions, and bring in Rhino, STEP, glTF, and SVG. Send drawings back as DWG, DXF, or PDF, and models as STL or OBJ.

    Performance

    ## Serious CAD performance.

    250,000+ entities in one file. Keep the whole model in one place instead of splitting it across files to keep your CAD responsive.

    108 floors. 38,510 editable solids.

    ## Make the command you wish you had.

    Write commands in JavaScript on the same API our built-in commands use: inputs with snaps, live previews, options, and one undo step. Keep them in the file or share them with your team. Or describe the command and let the agent write it.

    import { BRep, Curve, Plane } from "aircad"; export const manifest = { name: "Torus", kind: "command", capabilities: ["document:read", "document:write"], inputs: { center: { type: "point", prompt: "Pick the center" }, radius: { type: "length", prompt: "Major radius" }, tube: { type: "length", prompt: "Tube radius" }, }, api: 1, }; export default async function main(cad) { const center = await cad.input.point("center"); // Draw the ring while the pointer moves. const ring = cad.display.show(); const radius = await cad.input.length("radius", { from: center, onChange: (r) => ring.set(Curve.circle(Plane.at(center), r)), }); const tube = await cad.input.length("tube"); return cad.doc.add(BRep.torus(Plane.at(center), radius, tube)); }import { BRep, Curve, Plane } from "aircad"; export const manifest = { name: "Torus", kind: "command", capabilities: ["document:read", "document:write"], inputs: { center: { type: "point", prompt: "Pick the center" }, radius: { type: "length", prompt: "Major radius" }, tube: { type: "length", prompt: "Tube radius" }, }, api: 1, }; export default async function main(cad) { const center = await cad.input.point("center"); // Draw the ring while the pointer moves. const ring = cad.display.show(); const radius = await cad.input.length("radius", { from: center, onChange: (r) => ring.set(Curve.circle(Plane.at(center), r)), }); const tube = await cad.input.length("tube"); return cad.doc.add(BRep.torus(Plane.at(center), radius, tube)); }

    ## Start drawing together.

    Bring your next idea to life, together in one team workspace.
