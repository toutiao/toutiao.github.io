  author: peetle
  text: 'Thanks. Yes, Aircad can be used for 3d printing workflows! You can import
    and export stl and obj file formats, which are used for 3d printing. We plan to
    add more formats.<p>Aircad is a general solid modeler. So, you can model anything
    w the solid modeling tools, and then convert to a mesh. They participate in boolean
    ops like union and subtract. There&#x27;s a collection of commands specifically
    for manipulating meshes: <a href="https:&#x2F;&#x2F;aircad.com&#x2F;docs&#x2F;commands#meshes"
    rel="nofollow">https:&#x2F;&#x2F;aircad.com&#x2F;docs&#x2F;commands#meshes</a>.
    The agent can also write scripts to generate and process meshes completely from
    scratch: <a href="https:&#x2F;&#x2F;aircad.com&#x2F;docs&#x2F;ask" rel="nofollow">https:&#x2F;&#x2F;aircad.com&#x2F;docs&#x2F;ask</a>'
