    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;yuechen-li-dev&#x2F;Aetheris</a><p>There
    are currently a lot of newer browser CAD projects that already wraps OCCT WASM,
    like FluidCAD and Chili3D. And as you said previously, current CAD tools are slow
    to improve, and part of the reason is because of using kernels first built in
    the 1980s, and projects like Shapr3D and Plasticity both hit limitations of their
    existing kernels and switched to Parasolid when their project got bigger, and
    OCCT&#x27;s per entity tolerance issue is pretty well know by now.<p>On another
    topic, getting a plate with thousands of holes to mesh in under a second is some
    serious performance, and I do agree with your conclusion that most CAD apps are
    slow not because of programming language but because accurate NURBS math is inherently
    slow, but their is also the issues with the 2D constraint solver and fillet&#x2F;boolean
    algorithms too. Happy to talk more about the geometry kernel stuff too.
