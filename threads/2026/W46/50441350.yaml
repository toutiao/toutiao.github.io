  text: 'Thanks for asking. Core ops are OCCT. It&#x27;s got great primitives and
    tolerant modeling. For performance purposes, I&#x27;ve implemented my own algorithms
    for hidden line rendering, tessellation, and others. I&#x27;ve spent my whole
    career (15 years+) working on and around kernels.<p>More detail for the curious:
    it’s C++ compiled to WebAssembly and runs entirely client-side with a WebGL2 renderer,
    so there’s no server round-trip for geometry. OCCT does booleans, fillets, and
    STEP. I replaced its mesher with my own tessellator because BRepMesh was the bottleneck
    at scale, and hidden-line&#x2F;Make2D are custom too. Happy to go deeper on any
    of it.'
