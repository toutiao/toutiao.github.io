  text: 'Some years ago I came across this site: <a href="https:&#x2F;&#x2F;sites.google.com&#x2F;site&#x2F;1024cores"
    rel="nofollow">https:&#x2F;&#x2F;sites.google.com&#x2F;site&#x2F;1024cores</a><p>The
    author is a developer working on software that scales to 1,024 cores and greater
    -- which is within spitting distance now thanks to 256-core AMD EPYC processors.
    If you count hyperthreads as a &quot;virtual core&quot; then a dual-socket system
    gets you there!<p>That blog made me realise that almost all software <i>can&#x27;t</i>
    utilise 1,024 cores, not even close! Microsoft SQL Server, as a random example,
    tops out at 64 cores for any single query.<p>Similarly, <i>people</i> couldn&#x27;t
    utilise a machine that big, not with pre-AI software, except for certain embarrassingly
    parallel codes such as simulations and 3D graphics rendering.<p>Now... <i>NOW</i>...
    there&#x27;s no upper limit. None. <i>One person(!)</i> can cheerfully utilise
    millions of cores, billions even, and there&#x27;s no end in sight.<p>If you think
    one conversation thread in &quot;ChatGPT&quot; is all we need, you&#x27;re not
    seeing the big picture of what&#x27;s possible here.<p>Those math proofs OpenAI
    produced were created with <i>tens of thousands</i> of agents running in parallel,
    orchestrated by thousands more agents, and overseen by hundreds of agents, all
    triggered by someone typing as little as a sentence or two to start that avalanche
    of compute!<p>With that kind of AI power at your fingertips, huge, unthinkable
    projects become a fun exercise for the weekend:<p>- Translate the entirety of
