article:
  url: https://www.techpowerup.com/354814/nvidia-allegedly-engineered-scarcity-by-funding-ai-startups-to-buy-its-gpus
  title: NVIDIA Allegedly Engineered Scarcity By Funding AI Startups To Buy Its GPUs
    | TechPowerUp
  fetch_status: success
  content: "Friday, November 13th 2026\n ![](https://tpucdn.com/images/news/nvidia-v1793811817.png
    \"NVIDIA\")\n# [NVIDIA Allegedly Engineered Scarcity By Funding AI Startups To
    Buy Its GPUs](/354814/nvidia-allegedly-engineered-scarcity-by-funding-ai-startups-to-buy-its-gpus)\n\n
    by [Discuss (45 Comments)](/354814/nvidia-allegedly-engineered-scarcity-by-funding-ai-startups-to-buy-its-gpus#comments)\n\nFollowing
    the [departure of now-former NVIDIA CEO, Jensen Huang](https://www.techpowerup.com/354732/nvidia-co-founder-and-ceo-jensen-huang-officially-resigns),
    a new report by [The Wall Street Journal](https://www.wsj.com/tech/jensen-huang-colette-kress-nvidia-ceo-eb289097?)
    (via [Wccftech](https://wccftech.com/jensen-huang-financed-ai-startups-absorb-excess-silicon/))
    has emerged alleging that NVIDIA artificially inflated the ongoing GPU and memory
    shortage by investing in AI startups that would go on to buy NVIDIA GPUs and build
    data centers. The reason behind this was to maintain the perception of ongoing
    high demand and to move an oversupply of semiconductors from TSMC.   \n  \n The
    WSJ report cites an August meeting between Huang and his senior finance team,
    including NVIDIA's CFO and acting CEO, Colette Kress, during which Kress pushed
    for a reduction in circular financing agreements, in response to which Huang allegedly
    lay into Kress, calling her a \"deer in the headlights,\" after she had pushed
    to scale back [NVIDIA's $250 billion deal with OpenAI](https://www.techpowerup.com/351120/nvidia-and-openai-reportedly-discuss-usd-250-billion-deal-for-10-gigawatt-ohio-data-center).
    Jensen's push for further investment into small-scale cloud providers was seemingly
    in response to the changing tide that saw AI hyperscalers move away from off-the-shelf
    components in favor of custom solutions.\n[![](https://tpucdn.com/img/ooCln2q3jkKNGHen_thm.jpg)](https://www.techpowerup.com/img/ooCln2q3jkKNGHen.jpg)
    \nThe situation described in the report saw NVIDIA on the hook for an \"avalanche\"
    of GPUs from TSMC, for which it would have no immediate buyers. Part of the issue
