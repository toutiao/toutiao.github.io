  text: 'Vendor financing is already a sign of an unhealthy market. When widespread,
    almost always. If the only easy way you can borrow enough to buy a thing is from
    the vendor, that’s bad. And if vendor financing is an increasing, not decreasing,
    proportion of the finance in a market, that’s worse.<p>Channel-stuffing, if it
    is happening, is usually plain illegal.<p>The implications are obvious: if people
    are using GPU scarcity and prices as a proxy for AI demand (and they absolutely
    have and still are, at every level), and use it as an indication that they must
