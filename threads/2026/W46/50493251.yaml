  text: "&gt; Or are these buyers sitting on piles of unused gpus?<p>Yes, they are
    literally doing exactly that. Noting that they aren&#x27;t truly &quot;buyers&quot;
    so much as &quot;gift recipients&quot; (in exchange for ownership stake, but the
    value of their remaining ownership also goes up if these gifts generate sufficient
    hype for investors to invest more). GPU production is outstripping datacenter
    capacity.<p>&gt; But presumably those gpus are being actually used by those companies?<p>But,
    even if they <i>were</i> all being used, this wouldn&#x27;t mean much. The central
    point is: suppose Nvidia has produced 10 million[1] datacenter-class GPUs during
    the LLM bubble. Nobody can afford to, or is willing to, buy 10 million datacenter-class
    GPUs at their list price because the economics don&#x27;t work out. But if they
    gift 10 million GPUs for stock, and frame it like they sold the GPUs (a framing
    that is effective -- although this has been an open secret, this is being reported
    like news by the WSJ, and to the majority of their readers, it <i>is</i> news),
    it makes Nvidia GPUs appear to be extremely desirable. Even though, logically,
    an item that you have to give away because it&#x27;s not economically worth its
    market price is the exact opposite. The fact that you can use goods that you&#x27;ve
    effectively been given for free does not increase the actual economic value of
    those goods.<p>It&#x27;s pertinent to note this scheme works only as long as the
    hype lasts. If Nvidia gives away millions of GPUs in exchange for stake in LLM
    startups, and the LLM startups go bust, Nvidia is then billions of dollars in
    the hole.<p>[1] (hypothetical number, it&#x27;s vaguely around this order of magnitude)"
