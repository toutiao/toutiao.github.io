  text: When a bubble pops, the pop typically takes <i>years</i> to happen.  It&#x27;s
    more of a slow deflation in <i>most</i> cases.  Afterwards, you can easily spot
    the peak that would never be reached again but, <i>during</i> a &quot;pop&quot;,
    it&#x27;s not clear if you&#x27;re past that peak or if you&#x27;re just experiencing
    a momentary blip on the path to new highs.<p>Nvidia is likely not going to surge
    back to $240 soon.  It might go lower actually.  Skeletons are still falling out
    of closets.  Huang may have been the tech founder&#x27;s tech founder, but he
    kept some pretty nasty company in recent years and, as we&#x27;re now finding
    out, got both himself and his company into shady territory.  As it turns out,
    ethics are not just for aesthetics.<p>Is Nvidia slowing down for a year or two
    bad for AI as a technology?  Probably not.  Nvidia could find a leader that will
    return them to top form, or another company could take advantage of the situation
    to catch up and surge past.  A lot of AI researchers have been calling for a pause
    or, at the very least, a slow-down.  This might be just what was needed.<p>However,
    given Nvidia&#x27;s utterly unique position as both hardware supplier and bank
    for the data centre build-out, what will the impact be on the rest of the AI sector?  The
    market is going to have to price in a weaker and slower build-out as well as a
    loss of trust in Nvidia.  That&#x27;s clear downwards pressure.  Is it a blip,
    or are we now past the peak?
