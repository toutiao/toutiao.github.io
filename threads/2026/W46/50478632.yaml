  text: 'I tried to write (in C) a PostScript byte compiler for a grad school project.  It
    <i>is</i> a very appealing language to work with, with the simplicity of stack
    machine. And like with this post, I didn&#x27;t get into the graphical elements
    that make PostScript useful.<p>Mainly I learned that Ghostscript is doing a lot
    to make its PostScript interpreter fast: with the non-graphical test programs
    I could think up, GhostScript was many times faster interpreting the program (even
    computationally intensive ones) than my runtime (called &quot;egon&quot;) could
    execute the byte-compiled PostScript.  So it was a computation fail but still
    a pedagogy win.<p>I&#x27;ve always been meaning to learn more about how Ghostscript
    is engineered.'
