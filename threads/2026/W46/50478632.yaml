  author: a4isms
  text: My very first professional gig in the mid-80s was on a classified ad-taking
    application for what were then called penny-savers, physical newspaper-like publications
    that were nearly 100% classifieds. Penny-savers would be distributed in boxes
    around urban centres and could be very profitable. Our app ran on MP&#x2F;M, a
    multi-user CP&#x2F;M variant. And when it was time to go to print, our code generated
    PS directly, there was no &quot;printer driver&quot; or abstraction of any kind.<p>We
    sold our customers <i>two</i> Apple LaserWriters each, because if one went down
    just before going to print they&#x27;d be screwed. We would print on both in parallel
    for speed, but could fall back to just one. And the printed ads? Somebody over
    in the print shop would cut them out in strips and then paste those strips up
    to be photographed for the printing press. We didn&#x27;t have full end-to-end
    digital yet.<p>PS wasn&#x27;t easy, but it was very grokkable.
