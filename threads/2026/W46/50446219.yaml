  author: roenxi
  text: In any market there are an appropriate number of sellers. If you think about
    it in terms of balance equations there have to be exactly as many sellers as there
    are buyers at a given price and any want-to-be sellers who aren&#x27;t competitive
    at that price are eventually forced out of the market through bankruptcy because
    they can&#x27;t sell and run out of reserves to hold on. There are no guarantees
    on how many sellers a market wants. Some markets it is thousands, some tens, some
    just 1. The number also fluctuates continuously in ways too complicated to model.<p>Acquiring
    a competitor is acting competitively if the natural market number of sellers is
    N and there are currently N+1 sellers. Someone is going bust and it is better
    for the assets and whatnot to be reorganised quickly rather than waiting for bankruptcy
    to force everyone&#x27;s hand and cause a disorderly change.<p>A fun lens to look
    at Animat&#x27;s comment upthread is that if the EU was trying to force more sellers
    than a software market can handle, then we&#x27;d expect them all to be weak and
    the EU might be unable to compete in software because they&#x27;d be too small.
