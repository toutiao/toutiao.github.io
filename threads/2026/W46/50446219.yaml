  author: AnthonyMouse
  text: "&gt; Fractional sellers are actually pretty easy for a market to do, there
    are businesses where the product is one thing and they do another thing on the
    side.<p>That&#x27;s not the issue here.<p>Suppose there is some demand for supersonic
    passenger jets, but they&#x27;re also expensive to operate and generate sonic
    booms that de facto require them to be used only for transoceanic flights, which
    limits the demand. So then you&#x27;re stuck trying to recover the costs over
    a small number of planes, and small batch planes are expensive to produce.<p>The
    result is that there are currently <i>zero</i> providers of supersonic passenger
    jetliners. It&#x27;s not that they can&#x27;t be produced -- the Concorde existed,
    but proved <i>economically</i> unviable. Only 20 were ever built, none are still
    in operation and nothing replaced it. Because the cost of doing it is <i>just
    a little bit</i> more than the demand can sustain. It&#x27;s the thing at 0.9
    and there are correspondingly zero suppliers, and will continue to be unless the
    demand changes or somebody figures out how to do it at a lower cost.<p>&gt; Which
    results in this scenario being quite common in practice.<p>The common thing isn&#x27;t
    that the market couldn&#x27;t <i>support</i> more companies, it&#x27;s that it
    consolidates to fewer companies than it could support. The consolidation is more
    likely when fixed costs dominate because then when competitors are eliminated
    through mergers, attrition, dumping, etc. they&#x27;re harder to replace because
    a replacement has to pay the high entry costs.<p>Software also tends to have a
    network effect, which incumbents frequently use anti-competitively. If a company
    makes sure the apps that run on their OS can&#x27;t run on your competing OS and
    vice versa then developers focus on the platform with more existing market share,
    which suppresses competing platforms that would otherwise have been viable. If
    they tie all of their company&#x27;s products together then it creates barriers
    for someone who wants to offer a substitute for only one of them.<p>Compare how
    many alternatives there often are for a given open source app. They&#x27;re often
    not even forks of each other, but because they&#x27;re not actively trying to
    suppress their competitors or create interoperability problems, the number of
    alternatives is higher -- even with lower funding."
