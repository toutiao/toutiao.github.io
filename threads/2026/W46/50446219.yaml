  author: AnthonyMouse
  text: "&gt; If you think about it in terms of balance equations there have to be
    exactly as many sellers as there are buyers at a given price and any want-to-be
    sellers who aren&#x27;t competitive at that price are eventually forced out of
    the market through bankruptcy because they can&#x27;t sell and run out of reserves
    to hold on.<p>That&#x27;s not how it works in practice.<p>In a market with low
    fixed costs, you can have an arbitrarily large number of sellers. Some markets
    have millions of sellers, billions if you count the labor market.<p>In a market
    dominated by fixed costs, larger sellers have an advantage, but even that doesn&#x27;t
    imply that there is a specific &quot;appropriate&quot; number. If all of the sellers
    are the same size then none of them has a scale advantage over the others regardless
    of how many there are.<p>So we have to distinguish between two different things.<p>The
    first is, how many sellers can the market <i>support</i>? In other words, suppose
    it costs a billion dollars to enter the market, the maximum value customers place
    on the product would allow for a gross margin of $100, and there are a billion
    customers. Then the maximum viable number of competitors is 100 because otherwise
    they can&#x27;t each get enough customers to recover their costs and go out of
    business. Whereas if there are 100M customers then it&#x27;s only 10, and if there
    are 5M customers then it&#x27;s 0 and nobody produces that product.<p>But this
    being a low single digit positive integer is <i>very rare</i>, because to get
    there you have to thread the needle <i>exactly</i> and find something that can
    only support 2 rather than 20 or 5000 or a billion, but also not get so tight
    that it&#x27;s 0.9, because anything less than 1 is really 0.<p>Which brings us
    to the second thing. You&#x27;re in the market that can support e.g. 100 suppliers.
    To support 100 suppliers they each need a gross margin of $100, and customers
    value the product in that amount when it&#x27;s not available for less. But now
    suppose some of the sellers are willing to accept $10 margins. At the lower price
    the market would only support 10 sellers; they each need 10 times as many customers.
    At a margin of $1 it would only support one seller. But this is <i>every</i> market
    where the fixed costs aren&#x27;t fully zero. And, of course, the fewer sellers
    there are the less <i>inclined</i> they are to accept the thinnest of margins,
    or the more likely they are to be operating a large inefficient bureaucracy that
    eats up the economies of scale through red tape etc.<p>Notice also that the &quot;maximum&quot;
    number isn&#x27;t necessarily the <i>optimal</i> number -- the market could support
    100, but you might be better off with 15, because then the margins can be $15
    instead of $100, which might be worth it on a $1000 product, whereas trying to
    save the remaining 1.4% by going all the way to a monopoly is not likely to go
    in your favor.<p>Which brings us to the thing that most commonly happens in practice.
    The market can support 100 sellers but one or two of them have more capital, so
    they lower their prices temporarily until the others go out of business, then
    raise them back up again as long as no one new enters the market. Which doesn&#x27;t
    work when the barriers to entry are low because then people constantly enter the
    market anyway, but <i>does</i> work when the barriers to entry are high. Which
    is why we need to keep them low or, where that isn&#x27;t possible, need antitrust."
