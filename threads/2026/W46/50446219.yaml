  author: AnthonyMouse
  text: "&gt; You&#x27;re not describing a situation where the market could support
    0.9 sellers though. You&#x27;re describing a market that can support 0 sellers
    because nobody would pay enough to have the product produced and consequently
    the market supplies 0.<p>That&#x27;s why 0.9 is equivalent to 0. There can&#x27;t
    be 0.9 suppliers because what it implies is a company that only recovers 90% of
    its costs and goes out of business. It&#x27;s the same reason 23.9 is equivalent
    to 23 rather than 24. The 24th company would have to go bust because it can&#x27;t
    get enough customers to recover its costs without taking enough from one of the
    others for <i>that</i> company to go bust.<p>&gt; I suppose there are some semantics
    here on what you mean by &quot;0.9 sellers&quot; since the term isn&#x27;t very
    meaningful without assumptions and I&#x27;m inserting a &quot;per annum&quot;
    on the end in my head, but even if you mean selling 0.9 of a product that is totally
    doable.<p>What I mean is net present cost of entering the market vs. net present
    value of all future sales. If you have to pay a billion net present dollars to
    generate 1.01 billion net present dollars, you&#x27;re only making a 1% margin
    but you&#x27;re in business. If you have to pay a billion to make back 900 million,
    you&#x27;re going bankrupt.<p>That determines the maximum number of companies
    the market can support. Each company has to separately pay a billion dollars to
    enter, so if the total net present value of having the entire market is 100 billion
    then it can support at most 100 companies, in the case where they each get exactly
    1% of the market and recover exactly the 1 billion entry cost.<p>&gt; Anyway;
    it is routine for a small market to only support one, two or other digit of choice
    suppliers providing a good.<p>Again, the number of suppliers that <i>currently
    exist</i> is different than the number the market could support. Any market can
    have <i>fewer</i> suppliers than it could support. All you need is for the existing
    suppliers to either be accepting lower margins to capture more of the market,
    or for them to be artificially raising barriers to entry through anti-competitive
    practices or regulatory capture. And you can pretty much tell which one it is
    by looking at what their net margins actually are."
