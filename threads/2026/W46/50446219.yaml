  text: Companies are basically mini governments. They have leadership (CEO &#x2F;
    President), board, etc. However they are they are not democratic. Corporate takeovers
    happen when an entity with lots of money buys your shares. As such, the rule of
    the jungle abounds, not the rule of &quot;lets make good products&quot; or &quot;lets
    have self respect&quot;.<p>One thing I wish being a public company entailed was
    having a set of internal shares that are distributed only to the people working
    there, that allowed them to vote on board members &#x2F; top leadership positions.
    For example, Amazon currently abuses its delivery staff, but I suspect this is
    a policy that is not endorsed by the majority of Amazon employees. In a democratic
    public company, there would be a feedback loop that enables the employees to have
    a voice.<p>I see this as a way of having built in regulation, where the government
    doesn&#x27;t need to pass laws that are continuously becoming outdated but instead
    giving the people on the ground the ability to fight for their rights.<p>I don&#x27;t
    see it as useful for small companies, but I agree that a large enough company
    should be forced to be public + democratic. Going from the rule of the rich to
    the rule of the people that work there.
