  author: legitster
  text: "&gt; The act was designed to restore competition, but it was loosely worded
    and failed to define such critical terms as &quot;trust,&quot; &quot;combination,&quot;
    &quot;conspiracy,&quot; and &quot;monopoly.&quot; Five years later, the Supreme
    Court dismantled the act in United States v. E. C. Knight Company (1895). The
    Court ruled that the American Sugar Refining Company, one of the defendants in
    the case, had not violated the law even though the company controlled about 98%
    of all sugar refining in the United States. The Supreme Court reasoned that the
    company’s control of manufacture did not constitute a control of trade.<p>The
    reality is that the law itself was not very well written, and takes an extremely
    litigious executive branch to do anything with.<p>Even if you agreed with the
    premise (the idea that Standard Oil arose purely through conspiracy is clearly
    wrong), it&#x27;s ultimately a very ticky tacky set of definitions and has failed
    to achieve anything meaningfully as policy (do we actually feel strongly that
    breaking Microsoft&#x27;s productivity suite from their OS division was really
    worth all the effort?)<p>(The notable exceptions being actual illegal coordination
    - like was recently uncovered in the egg industry. But these have more to do with
    price fixing amongst competitors and less with actual Trusts&#x2F;Monopolies)<p>The
    only practical way that countries have tackled monopolies has been to write legislation
    that specifically puts oversight on that industry."
