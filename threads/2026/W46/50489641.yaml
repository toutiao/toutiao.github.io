  text: |-
    If true and this ends up lasting an hour or more, that&#x27;s going to be undeniably, <i>objectively</i> hilarious. At least they used to keep the planes running on time!<p>--- EDIT:<p>This could just be the first issue that&#x27;s arisen -- the FAA announced it &quot;is expanding across the nation&quot; on Tuesday. Which could really mean anything.<p>FAA Announcement: <a href="https:&#x2F;&#x2F;www.faa.gov&#x2F;newsroom&#x2F;statements&#x2F;general-statements" rel="nofollow">https:&#x2F;&#x2F;www.faa.gov&#x2F;newsroom&#x2F;statements&#x2F;general-statements</a><p>The Ars Technica article behind the Gizmodo one sadly doesn&#x27;t have more info, either.<p>It&#x27;d be kind of absurd if a read-only integration took down nationwide infrastructure, but A) we&#x27;ve all been there... and B) the gizmodo article does mention they&#x27;re also trying to phase out <i>floppy disks</i> for some jobs still, which tells me their CI&#x2F;CD and rollback hygiene might not be top-notch. Hopefully the <i>Real World</i> contestant in charge of our transportation network is on site with a ClaudeCode terminal as we speak!<p>It does sound pretty deeply integrated, I will say:<p><pre><code>  SMART is a cloud-based system that centralizes 200 data streams – including weather patterns, flight paths, traffic flow, and controller staffing metrics – into one platform.
