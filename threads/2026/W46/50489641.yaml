  author: tjohns
  text: There isn&#x27;t really one. This is a system that&#x27;s supposed to have
    it&#x27;s own built in redundancy and must not go down.<p>Flight Service uses
    a different set of radios and can relay messages to ATC, but they&#x27;ve been
    slowly dismantled over the last two decades and wouldn&#x27;t have the capacity
    to step in for an outage (nor should they be expected to - that&#x27;s not their
    purpose).<p>Some aircraft have CPDLC for text-based communication, but it&#x27;s
    asynchronous and you can&#x27;t use that as a replacement for voice communication
    in the terminal environment. Also, many aircraft aren&#x27;t equipped to receive
    it.<p>Pilots are trained on lost comms procedures, so if you&#x27;re in the air
    and the radio fails they&#x27;d fall back to those regulations. Basically all
    the aircraft would fly their last assigned clearance, and attempt to deconflict
    manually with other aircraft over air-to-air radio (similar to flying into an
    untowered airport).
  score: 0
