  author: somat
  text: I would bet the problem is not strictly the radios themselves, they will still
    work, Planes can talk to each other and directly to airports, But that there is
    a large scale highly integrated control center network that failed, and planes
    can no longer talk to centralized traffic control.<p>So it falls back to local
    control, more in the style of visual flight rules. Pilots in existing flights
    will have to be vigilant and do their own deconflictation and new flights  are
    banned out until the network is back up.<p>All conjecture at this stage of course,
    but all the radios won&#x27;t just fail. It is probably going to be a poster child
    example about the dangers of large scale integration. The attraction of course
    is that integration is very efficient, the danger is it tends to fail all at once
