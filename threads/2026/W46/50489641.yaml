  author: tjohns
  text: ADS-B can&#x27;t legally be used to maintain separation. It&#x27;s only approved
    for use as an aid to awareness for additional safety.<p>Could you in an emergency,
    if you had no other options? Yes. But ATC can&#x27;t legally give you a clearance
    that was dependent on using ADS-B for separation.<p>(Similarly, if there&#x27;s
    a potential traffic conflict, and you tell ATC you see the other traffic on your
    ADS-B display, they just have to disregard that statement and assume that you
    can&#x27;t see the other aircraft at all.)
  score: 0
