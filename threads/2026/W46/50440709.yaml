    entire way. Sure, I could let an LLM guide me through it or even do it for me,
    but why bother when the whole point of the hardware is for me to fuck off and
    use it as a subscriber to the OEM and carrier? This is tedium, removed by further
    spending. Not to mention documentation - what bullshit is the OEM hiding in their
    board or firmware thats going to ruin my day? I&#x27;m sure that some of these
    devices are great for reuse as a self contained server with media and modem, but
    is <i>my old phone</i> going to do this?<p>I&#x27;m not gonna spend $50 on ewaste
    to <i>try</i> to do something unless I <i>want</i> to use <i>that</i> ewaste (old
    keyboards, old toys? :3). Old phones are a non-sequitur because, again, they&#x27;re
    engineered to keep me out."
