  author: basilikum
  text: 'The AGPL does not prevent commercial neither as a user nor as a publisher
    of the software. It even prevents anyone from creating a derivative work from
    your software and publishing it under a license that prohibits commercial use.<p>Someone
    can absolutely fork your software and use it commercially. That&#x27;s what FOSS
    is about: You shall not limit what other people can do with the software.<p>You
    may however restrict others from putting restrictions on derivative works of your
    software. That&#x27;s what the GPL is all about. You enforce reciprocity and ensure
    that all works based on your software allow the user the essential freedoms of
    free software.'
