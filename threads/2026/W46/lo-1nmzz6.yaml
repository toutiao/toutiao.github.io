  content: "# Kildall's algorithm\n\nBeen a while. Life is busying.\n\nI got a part
    time job writing a Lisp compiler, so I’m going to talk about that.\n\nThis post
    might be hard to understand if you do not program. Or if you do. There’s a fair
    amount of background required.\n\n## There are Lisp compilers?\n\nYou might be
    familiar with Lisp in the form of a Scheme interpreter you used for a few semesters
    in college. You might think things about it like “it’s so elegant, but it’s kind
    of impractical for day-to-day use”. You might think of it as “an interpreted language”
    and so don’t understand what I mean by Lisp compiler. If you don’t think these
    things you can probably skip to the next section.\n\nIn Lisp, in contrast with
    some languages, the semantics are essentially built around interpretation. When
    you give a Lisp interpreter some code it goes through it step by step and executes
    it. This invites careful execution. It’s natural, for example, to expect that
    a program like\n\n    (defun foo (x) (+ x 237))\n    (foo \"hello world\")\n\nthat
    defines an addition function and then calls it on a string, will do something
    nice like pop you into a debugger, rather than return garbage data.\n\nBut it’s
    also generally slow. The interpreter has to do something on all possible input.
    It can’t, for instance, very well optimize FOO to accept only one numerical argument
    in a register, because later FOO might be called with a string.\n\nSo you add
    a compiler. The compiler is an optimization. It takes code and returns an optimized
    version that tries to preserve these semantics as much as possible while being
    much faster. The optimized version is faster partly because it’s probably composed
    of machine code or JVM bytecode or something else interpretable very quickly,
    and partly because of higher level optimizations. For example\n\n    (defun foo
    (x) (+ x 237))\n    (+ (foo 16) 93)\n    (mapcar (eval) '(3 898 38))\n\nhere the
    compiler might note that FOO can only accept numbers, and when it sees a straightforward
    call to FOO like in the second line that gives it only numbers, it generates code
    that skips the “is this a number? No? Debugger time” check. An “interpreter stub”
    retains the whole safest behavior, and can be used in the third line if `eval`
    returns FOO.\n\nThis strikes a good balance, for me, between speed and freedom.
    The optimized code isn’t any less safe, so I can still write things with abandon
    and watch them fail in the debugger.\n\nThe downside is that the compiler has
    to be pretty smart to be very effective. Luckily several Lisp implementations
    with pretty good compilers already exist, like SBCL and CCL. Both can generate
    fast code without too much trouble.\n\n## So what is it you’re doing\n\nI work
    on a new Lisp compiler called Cleavir. Cleavir is the compiler part of Dr. Robert
    Strandh’s project, [SICL](https://github.com/robert-strandh/SICL). SICL is intended
    to provide modular, reusable, clean, and more positive adjectives code to other
    implementations, as well as being an implementation in itself.\n\nSICL isn’t yet
    an implementation on its own, but Cleavir is used in another new Lisp implementation,
    [clasp](https://github.com/drmeister/clasp), which is Dr. Christian Schafmeister’s
    project.\n\nAs far as I know the initial thoughts for Clasp went something like
    this:\n\n> \\<drmeister\\> My lab has this new system for designing artificial
    protein-oids. They’re made of _bis_-amino acids, which we also invented.\n\n>
    \\<DoD, etc. shadowy masters\\> Frikkin’ sweet.\n\n> \\<drmeister\\> We call them
    spiroligozymes. They could have incredible implications for-\n\n> \\<DoD, etc.\\>
    Sure great. Here’s an award for being a literal nanotechnologist, named after
    that physicist everyone likes.\n\n> \\<drmeister\\> OK so the thing is that this
    stuff we’re doing involves [a lot of computer work](http://dl.acm.org/citation.cfm?id=3005738).\n\n>
    \\<DoD, etc.\\> Because it’s the future.\n\n> \\<drmeister\\> Right, and we mostly
    do that in C++. But I like Lisp.\n\n> \\<DoD, etc.\\> Great. Use it. It’s got
    an ANSI standard. God bless America.\n\n> \\<drmeister\\> But we don’t want to
    lose the C++ code. Lisp can use C functions but C++ doesn’t really have any interoperability.\n\n>
    \\<DoD, etc.\\> So?\n\n> \\<drmeister\\> So I was thinking I’d spend several years
    making a new Lisp implementation that’s tight with C++ from the ground up.\n\n>
    \\<DoD, etc.\\> That sounds hard, and you’re a chemist.\n\n> \\<drmeister\\> So
    that’s a no, or…\n\n> \\<DoD, etc.\\> Here is a zillion dollars. Snap to it.\n\nIt
    must be nice being a respectable scientist, is what I’m saying.\n\nClasp ended
    up being based on Embeddable Common Lisp (ECL), so called because it’s written
    in C and designed to be called from C programs. ECL provides a lot of the runtime.
    For compilation, however, Cleavir compiles Lisp programs into its “Mid-level Intermediate
    Representation”, or MIR; Clasp then compiles this into LLVM-IR, which LLVM than
    compiles to machine code.\n\nThis is pretty convoluted and presents some problems
    (LLVM doesn’t really seem to make itself a good target for something with an online
    compiler and mostly heap allocation, for one). Luckily they are not usually mine,
    because I mostly limit myself to Cleavir, but it’s nice to know the nature of
    the gnashing maw you hang over.\n\n## HIR\n\nCleavir’s MIR, and also HIR (“High-level”),
    are mostly what I work with. Consider this (silly) function:\n\n    (defun example
    (x)\n      (flet ((getx () x)\n             (setx (y) (setf x y)))\n        (setx
    19)\n        (print (getx))\n        (+ (getx) 331)))\n\n`flet` establishes local
    closures, and `setf` assigns. `(example anything)` will print 19 and then return
    350.\n\nIn HIR, after a few transformations, the code looks like [this](../getx_setx.png).
    Here are the basics: white rectangles are “instructions”, and represent basic
    operations. Ovals and the orange rectangles are “data”. The solid black arrows
    indicate control flow. Red dashed arrows indicate inputs to instructions, and
    blue dashed arrows outputs. Functions begin with the instructions called “enter”.\n\nA
    few instruction explanations:\n\n- `enter` is the beginning of a function.\n-
    `Create cell`, `Write cell`, `Fetch`, and `Read cell` have to do with shared variables
    for closures - more on that below.\n- `enclose` allocates a closure. The regular
    inputs are (cells for) closed-over variables, while the input with the dashed
    pink line is the actual function code.\n- `funcall` calls a function, the 1 input,
    with the other inputs as arguments.\n- `ret` returns values from a function.\n\nIt’s
    not really much different from any assembly-type language in form, other than
    having closures and explicitly separating input and output, but it’s more convenient
    to represent control flow graphically than with labels.\n\n## The algorithm\n\nA
    graph of operation nodes is pretty common as an intermediate representation, because
    it maps closely with the conception of computers as state machines. As such, some
    optimization techniques are well-trodden.\n\nIn 1973, G. A. Kildall published
    his paper [“A Unified Approach to Global Program Optimization”](https://drona.csa.iisc.ernet.in/~deepakd/pav/kildall-popl73.pdf).
    The title is a bit grandiose but actually pretty accurate. Kildall laid out a
    very general algorithm for associating optimization information of any kind with
    nodes in an instruction graph of this form. A few weeks ago I implemented it for
    Cleavir.\n\nIt works like this. First, you establish some domain of optimization
    information. This domain can be anything you want, as long as it forms a bounded
    [meet-semilattice](https://en.wikipedia.org/wiki/Semilattice). Elements of the
    domain are called “pools”. Next, you define an “optimization function” which,
    given an instruction node and its pool, returns another pool.\n\nThe algorithm
    has a “work set” consisting of instructions paired with pools. The initial contents
    of the work set are dependent on what you’re doing, but contain at least one instruction.
