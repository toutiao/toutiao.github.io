  author: jitl
  text: 'I’ve also spent the last couple of weeks vibe coding a component-based UI
    framework for C. My target is embedded hardware with 2 * 300mhz ARM 32 CPU, and
    a Nintendo 3DS like OpenGL ES 1.1 GPU from DMP: Fujifilm cameras from 2013-2016
    like the X70, X-E2, X-T1, X100T. It’s a bit faster than iPhone 2007 on CPU side,
    and slower on the GPU side due to needing to copy from GPU back to main memory
    for scan-out. It’s funny how these things seem to come up and then everyone’s
    doing it.<p>I didn’t see the code here because I couldn’t find an easy link to
    its Github. My UI framework i’m calling FocalUI. We do layout and basic geometry
    with a fork Clay where we added “layer” and “focusable” markers to Clay elements.
    Instead of drawing immediate mode, we store a list of draw commands and layer
    geometry in a CoreAnimation-like tree. The renderer composits the layer tree and
    renders to OpenGL, and we use damage tracking to copy just the changed pixels
    from the GPU back to the camera’s framebuffer for scan-out.<p>It’s been a huge
    effort to add touch inertial scrolling, spring animation, navigation effects etc
    at 55hz to this device that before only did d-pad nav at 25 Hz, but things are
    starting to shape up for a release this week :)'
