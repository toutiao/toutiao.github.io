  author: voidhorse
  text: It has no value, and you can tell basically immediately.<p>People are becoming
    extremely lazy and shipping the first slop the model generates because they get
    a rush from putting their stuff in tot he world as fast as possible.<p>However,
    I would bet significant money that all the projects like this (where every aspect
    has hallmark slopisms (the vibe interface design, the copy) will lose out to projects
    that are also heavily AI coded but that took the time and care to actually polish
    and differentiate themselves and thus are later to the game because they shipped
    after a few weeks or a month of work and refinement instead of a day.<p>AI can
    save you a lot of time but it can&#x27;t save you from your own lack of restraint
    and your inability to discern and be an objective judge of the value your thing
    will have <i>to other people</i>. For software, mere existence is no longer sufficient
    anymore. Anyone can generate whatever you made instantly if you put zero effort
    or discernment into it. This is why so many of the Ainfluencers are emphasizing
    &quot;taste&quot;.<p>But even taste won&#x27;t save you on the end either, since
    anyone can clone your stuff as soon as it ships.<p>I personally think the future
    of software is probably just two extremes:<p>1. Personal dinky vibe coded apps
    that all have their individual creator as the sole user.<p>2. Large scale apps
    that don&#x27;t work without significant marshaling of hard physical resources
    (e.g. LLMs themselves).<p>All the middle bits, user applications that target a
    specific problem space but that run locally and&#x2F;or don&#x27;t need legions
    of data centers and networks to run, will probably just die eventually. Maybe
    a couple of established apps will stick around in business contexts because employees
    all using their own personal apps and workflows causes too much coordination overhead,
    but at the consumer level I fully except everyone will be just vibing their own
    stuff pretty soon here.
