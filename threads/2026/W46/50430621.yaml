  text: Yes, and? As the cost of code generation approaches zero, this starts to make
    more sense, especially if you <i>do</i> have mechanisms in place to ensure safety
    and correctness.<p>I did an experiment a couple weeks ago of having Opus 5.5 translate
    an MP3 decoder from Rust into Cortex-M33 assembly language, both raw asm and symbolasm.
    The code was 3x smaller and ~1.5x faster than Rust -O3. These seem like gains
    that are worth it.
