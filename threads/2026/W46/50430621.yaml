  author: badsectoracula
  text: So, i downloaded it, built and tried some demos. On the positive side:<p>1.
    It looks and behaves very polished. From playing around with the gallery the only
    issues i noticed is that the mouse wheel goes to the &quot;outermost&quot; control
    instead of the &quot;innermost&quot; and that there isn&#x27;t a right click &#x2F;
    context menu for text input fields with commands like copy, paste, etc (but the
    common shortcuts do work - including editing shortcuts like home, end, shift+movement,
    ctrl+d, etc).<p>2. According to btop the applications seem to use relatively little
    memory compared to other apps that look similar (~73MB). Of course it &quot;helps&quot;
    that other apps that look similar tend to use either Electron or some embedded
    web browser that balloons memory usage to several hundred MBs :-P.<p>3. There
    are practically no dependencies - even OpenGL seems to be an optional runtime
    dependence. Using objdump shows that it only depends on libm, libSM, libX11, libXext
    and -of course- libc. This is neat for self-contained applications.<p>4. The files
    are also relatively small - after stripping debug info from the release binaries
    (not sure why they&#x27;re there) the hello world example is ~323KB, most examples
    (that use richer UIs) are somewhere between 350KB and 400KB and the gallery that
    contains everything is 1.4MB.<p>5. The UIs feel <i>very</i> light and snappy&#x2F;responsive.<p>On
    the negative side:<p>1. The apps always seem to use ~4-5% CPU here - this is because
    they keep drawing the window all the time. Mangohud shows them not capping the
    FPS at all - which is good for smooth and responsive input, but drawing should
    stop if there are no changes to the scene&#x2F;UI that need updates.<p>2. The
    code looks very messy - i do not see any `.clang-format` or anything like that.
    If you&#x27;re going to use LLMs for writing the code IMO you should have both
    automatic code formatting and a `CODE_STYLE.md` (or something like that) for specifying
    how the code should look. It doesn&#x27;t avoid the LLMisms in code but helps
    a lot to keep it readable (IMO at least).<p>3. There is no custom theme support
    (you can customize some aspects of its theme but you cannot make it look like,
    e.g, Windows 95, Mac OS X Leopard or Morrowind).<p>On the &quot;it depends on
    your taste&quot; side:<p>1. It is clearly <i>very</i> web and mobile inspired.<p>2.
    It uses an immediate mode approach.
