    …not opposed to having a macro system, except that no convincing specific use case has come up that can’t be solved more simply with something else.

    I feel that this is a bit of a self-fulfilling prophecy.  It's true that everything I want to do in Gleam with a macro system could be done without a macro system.  Of course, you could say the same thing about Brainfuck — it's Turing complete and any features you might add could be done in another way.
    One bit that particularly gets to me is the serialisation/deserialisation story.  When I last played with Gleam (about two years ago, so this may be out of date), the recommended solution was using a code generator to write those functions.  Personally, saying that you don't need a macro system because you have a code generator is like saying your car doesn't need an engine because you also have a tow truck.
    There was a lot that I loved about Gleam.  The use statement felt like it could drag people 50% of the way to monads and I've always loved BEAM.  I'm not even sure that I would want a true macro system — something like Haskell's Rep and Data.Generics would solve 95% of the places where I wanted a macro in Gleam (or even Rust!).  However, seeing code generation touted as the solution soured me on Gleam's future.
