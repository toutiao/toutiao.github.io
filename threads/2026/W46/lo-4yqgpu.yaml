  content: "[Back](/blog)\n\n## Introduction\n\nIf you have read my recent [rant about
    programming languages](/blog/desert-island-languages/), you'll know I've been
    quite interested in [Gleam](https://gleam.run). Gleam is a functional language
    that targets BEAM, the Erlang VM, with a simple syntax and interoperability with
    the wider BEAM ecosystem (Erlang and Elixir). Interestingly, Gleam can _also_
    target JavaScript i.e., Gleam can be compiled into JavaScript and run through
    Node.js.\n\nI've been mostly using Rust for hobby projects, which at the moment
    is the only language that really makes coding enjoyable for me, and Gleam has
    managed to scratch that itch too. If you're a Rust _connaisseur_, then Gleam will
    feel familiar to you, bar a few key differences. I feel like 80% of the code I
    write could be copy pasted to Rust (with a tinge of search-and-replace for syntax)
    and it'd compile.\n\nThis post won't give an exhaustive overview of the language,
    if you want to learn more, I recommend the [excellent interactive tour](https://tour.gleam.run).
    You'll get a good feel for Gleam in under half an hour.\n\n## Gleam: the good\n\nOn
    its homepage, Gleam is described as \"a **friendly** language for building **type-safe**
    systems that **scale**!\" (emphasis theirs) which does a good job of conveying
    what Gleam is all about.\n\n### Gleam is friendly\n\nThe syntax is extremely simple,
    most of the complex stuff is hidden by the Erlang runtime which you don't really
    have to interact with unless you want to! Of course, Gleam is a functional language,
    so if you have lived in a C-shaped imperative world your whole life, it might
    be a bit daunting at first. But if you compare it to other functional languages
    (OCaml, Haskell, Erlang), you'll quickly notice Gleam is much simpler. After using
    it a bit, it feels like all the functional parts of Rust, with a few missing ones,
    and none of the imperative parts.\n\nLet's start from an example piece of code:\n\n_Gleam_\n\n
    \   // Omitted imports\n    pub fn main() {\n      let total =\n        \"1,X,5,6\"
    // String\n        |> string.split(on: \",\") // List(String)\n        |> list.map(int.parse)
    // List(Result(Int, Nil))\n        |> result.values // List(Int), the invalid
    entries are dropped\n        |> list.reduce(fn(acc, x) { acc + x }) // Result(Int,
    Nil)\n        |> result.unwrap(0) // Int\n    \n      echo total // 12\n    }\n\n_Rust_\n\n
    \   fn main() {\n        let total = \"1,X,5,6\" // &str\n            .split(\",\")\n
    \           .map(|s| s.parse::<i64>())\n            .filter_map(Result::ok)\n
    \           // Could have used .sum() here\n            .reduce(|acc, x| acc +
    x)\n            .unwrap_or(0);\n    \n        println!(\"{}\", total); // 12\n
    \   }\n\nDissecting this a bit, you can see a few specificities of Gleam:\n\n-
    variables in Gleam are _immutable_ (so no `mut` keyword or anything like that),
    chained functions here all return a new element. You can still _shadow_ a binding
    with a new `let`, which is how you \"update\" a value.\n- `|>` (typed ) is the
    pipe operator used to chain functions on data. The main constraint is that the
    piped variable should be the first argument of the function in the pipe.\n- just
    like Rust, errors in Gleam are just values as part of the `Result` [monad](https://en.wikipedia.org/wiki/Monad_(functional_programming)).\n\nComparing
    with the Rust code snippet, you can see that, up to a few naming choices, they
    look pretty similar. The main difference in this example is really the piping
    vs. chaining syntax. **Gleam types have no methods** so piping is used instead.\n\nThe
    piping operator `|>` is the first of the three mascot features of Gleam you will
    meet in this post, the other two being the `use` pattern and tail-call optimization.\n\n####
    The use pattern\n\nIf you've written a lot of JavaScript, you might be used to
    the indentation creep that arises when nesting many callbacks into one another\n\n
    \   someFunc(arg, function(param) {\n      someOtherFunc(param, function(otherParam)
    {\n        // ...\n      })\n    })\n\nIn Gleam, many functions expect a callback,
    for example because as a way to control access to a resource and clean up when
    the process is done (closing a database connection, releasing a file handle, etc.).
    To avoid this kind of tower of callbacks, Gleam provides some syntactic sugar:
    `use param <- some_func(arg)` is equivalent to `some_func(arg, fn(param) { ...
    })`. The callback must always be the **last** argument of the function. That is
    the opposite of `|>`, which fills the first one.\n\n_With use_\n\n    use param
    <- some_func(arg)\n    use other_param <- some_other_func(param)\n    echo other_param\n\n_Without
    use_\n\n    some_func(arg, fn(param) {\n      some_other_func(param, fn(other_param)
    {\n        echo other_param\n      })\n    })\n\n#### Tail-call optimization\n\nThis
    one might genuinely trip you up if you're not familiar with it. The first thing
    you need to know is **there are no loops in Gleam**! Again, if you've written
    OCaml or Haskell before, you won't be surprised by this. In 98% of cases, loops
    are simple operations over bounded iterations. Think `for` loops on a list or
    a set. Exactly the kind of thing which in Rust you always have two ways of doing:
    one imperative with the exact `for` loop, one more functional with a combination
    of operations on iterators. Well, if you look at the code example in the previous
    section, you'll see Gleam uses the second kind and has a plethora of functions
    to iterate over lists, sets, tuples, strings, anything.\n\nBut what if you need
    something more complicated? What about the 2%? This is where you would instead
    use **recursion**! A simple algorithm which illustrates this is Euclid's algorithm
    to compute the Greatest Common Divisor (GCD). Below you can find a Rust iterative
    example, and a Gleam recursive example.\n\n_Rust_\n\n    fn gcd(mut a: u64, mut
    b: u64) -> u64 {\n        while b != 0 {\n            let remainder = a % b;\n
    \           a = b;\n            b = remainder;\n        }\n        a\n    }\n\n_Gleam_\n\n
    \   fn gcd(a: Int, b: Int) -> Int {\n      case b {\n        0 -> a\n        _
    -> gcd(b, a % b)\n      }\n    }\n\nOf course, you can also write the recursive
    version in Rust, but this usually isn't such a great idea. Recursion in imperative
    languages can quickly get out of hand: every call adds a new stack frame, and
    a deeply recursive function can blow the stack (the infamous **stack overflow**
    ).\n\nOn the BEAM there is no fixed-size stack, so runaway recursion eats heap
    memory until the process is killed instead, but the point remains: deep recursions
    equals trouble. To avoid that problem, compilers for functional languages implement
    a technique called Tail Call Optimization (TCO), which applies when the recursive
    call is the last thing the function does. The existing stack frame is then reused
    instead of stacking a new one, giving performance close to an imperative `while`
    loop.\n\n### Gleam is type-safe\n\nThis piece of the slogan is mostly there to
    answer the obvious question \"why Gleam and not Elixir?\" (another Erlang-based
    language). While Elixir is a dynamically-typed language (with gradual typing now!),
    Gleam was _built_ as a statically-typed language with a strong type system: strong
    types are its _raison d'être_.\n\nA `type` in Gleam encompasses both the `enum`
    and the `struct` concepts in Rust:\n\n_Gleam_\n\n    // A usual enum\n    type
    Directions {\n      Left\n      Right\n    }\n    \n    // A 'struct-like' type\n
    \   type Person {\n      Person(name: String, age: Int)\n    }\n    \n    // A
    combination of both\n    type MyError {\n      Missing\n      InvalidQuery(String)\n
    \   }\n\n_Rust_\n\n    enum Directions {\n      Left,\n      Right\n    }\n    \n
    \   struct Person {\n      name: String,\n      age: i64\n    }\n    \n    enum
    MyError {\n      Missing,\n      InvalidQuery(String)\n    }\n\nBecause Gleam
    types are algebraic data types, they are very useful to ensure undesired states
    are impossible. A great aspect of Gleam, which will be relevant a little bit later,
    is that it compiles to _both_ the BEAM virtual machine _and_ to JavaScript. So
    you can sha"
