    I’ve been getting into Gleam recently as well, and I’ve also really enjoyed it. (And I also came from Rust!)

    The language is too simple.

    In my opinion, while it can definitely feel like this at first, this is really one of Gleam’s strengths. Having written only Gleam for a little while, then gone back to eg Rust, I’d forgotten how many unrelated things other languages make you think about. Truly having one way to do things makes Gleam so much easier to read.

    But I totally understand that the lack of macros or other complex features can put a few people off (for example, I read that currying is dearly missed).

    Specifically related to macros, Louis (the Gleam guy) is not opposed to having a macro system, except that no convincing specific use case has come up that can’t be solved more simply with something else. And especially since macros add so much complexity, it’s a high bar. They wrote a whole post about it.
    Also, a somewhat limited form of currying is available by using function captures: my_fun(wibble, _, wobble) is the same thing as fn(x) { my_fun(wibble, x, wobble) }. If you need more arguments you’ll need to do the full anonymous function, but it covers most use cases.
