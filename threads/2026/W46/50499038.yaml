  author: mjr00
  text: "&gt; DevOps&#x27;issue IMHO is developing software and dealing with the ops
    side are two fundamentally different propositions, and require two different life
    styles. Doing ops also means entering the on-call rotations, being in the war
    room when a data center goes under and being on the hook when a DDOS brings down
    the service.<p>That&#x27;s exactly the issue that DevOps aims to <i>solve</i>,
    though. When you have developers who have no ownership or responsibility once
    the software is running on production, it becomes a &quot;throw it over the fence&quot;
    situation, and devs don&#x27;t care about the operational side.<p>Logging? Who
    needs that, if there&#x27;s a bug report I&#x27;ll reproduce it on my local machine
    (and if I can&#x27;t, CLOSE-WONTFIX!) Performance monitoring? That&#x27;s an ops
    problem, tell &#x27;em to buy better hardware. Application crashes? Works on my
    machine, probably a bug in the server config; ops problem. Tell them to set up
    a scheduled restart every hour.<p>You still need dedicated operations staff who
    deal with the overall system health and design, but yes, a developer needs to
    be involved when a DDOS brings down the service, because how <i>should</i> the
    system behave under heavy traffic? Can it serve up cached read-only pages? Did
    someone find a very CPU-intensive public endpoint that is being exploited and
    needs to be fixed? Only your developers can answer this question, not the ops
    team."
  score: 0
