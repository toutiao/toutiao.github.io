  author: mikepurvis
  text: As someone who has been in the &quot;robot devops&quot; space for like a decade
    now, I think with robot companies it becomes particularly acute because:<p>- Ops
    for cloud services and ops for deployed robots are very different beasts, so it&#x27;s
    really two different teams that could both reasonably be &quot;devops&quot;.<p>-
    Ops&#x2F;tools for robot <i>developers</i> is different since you&#x27;re often
    dealing with simulation environments (local, cloud) and also managing access to
    a more constrained pool of test hardware, all of which needs to be able to quickly
    recover and restore itself to factory state after developers or their code have
    done unspeakable things.<p>- Deployed units are often the worst of both worlds
    between multiple domains. You&#x27;ve got the big deployment assets of a data
    center but without the big data pipe; nothing is virtualized so you can&#x27;t
    just throw away a node that goes bad; you&#x27;re stuck supporting hardware snowflakes
    (here&#x27;s a text file somewhere with the list of units that have bad CPU fans
    and need different frequency caps); it&#x27;s like IOT but with the power and
    disk and observability requirements of a real server.
