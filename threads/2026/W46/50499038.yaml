  author: pona-a
  text: Software is just an extension of electrical engineering, only with the small
    technical difference that instead of building circuits that process signals, you
    write instructions for a pre-made Turing machine instead. FPGA engineers are clearly
    digital engineers, if they want they could write out their circuits with diagrams,
    though most use code, because it&#x27;s more compact, easy to modify, and is easier
    to operationalize with version control and testing. The only thing different from
    software is the depth of our abstractions, and the scope of our problems.<p>A
    lot of said complexity is ultimately because we haven&#x27;t embraced software
    as an engineering discipline but as rules lawyering. We&#x27;ve lost sight of
    actual engineering goals like cost and size, and ventured far into the world of
    marketing, rushing to implement every feature instead of building a sound system
    first, causing immeasurable economic harm in product defects, engineer burn-out,
    and missed opportunity.
