  author: '0xbadcafebee'
  text: It&#x27;s sad that people still think DevOps was about teaching people &quot;dev
    and ops skills&quot;. There isn&#x27;t even such a thing as &quot;ops skills&quot;.
    Ops stands for Operations - as in Operations Management, a job that has nothing
    to do with servers (it&#x27;s a job focused on ensuring business continuity in
    any industry). The term &quot;Operations&quot; got associated with servers and
    server commands because the department that Systems Administrators worked in was
    called the &quot;IT Operations&quot; department, aka, ensuring the business continuity
    of the Information Technology department. All of this happened because the entire
    industry spontaneously became collectively ashamed of the term &quot;Systems Administrator&quot;
    and &quot;sysadmin&quot;. But they still wanted a way to refer to &quot;the server
    people&quot; and &quot;what server people do&quot;, so they started saying &quot;ops&quot;.<p>The
    &quot;Ops&quot; in DevOps was intended to mean the department itself, not the
    tasks they performed. The idea that devs should be learning or doing Systems Administration
    is the same as a building architect learning&#x2F;doing concrete pours. They should
    know <i>about</i> concrete and the pouring&#x2F;curing process, but they don&#x27;t
    (and shouldn&#x27;t) be pouring and smoothing the concrete themselves.
  score: 0
