  author: Riiiiichard
  text: "I agree with you on the core point: the same layer (zebkit embeds chromium
    using Content API), staying sync with upstream (it carries 60+ patches), the size
    reduce (using build options such as turning off features).<p>For the size, I have
    some more to address: the real weight comes from Blink, V8, skia, network stack
    and media. WebRTC cannot be dropped since Blink depends on it. Video playback
    is need by most apps so it stays. And the webusb is small, drop it has little
    benefit.<p>The main differences are mostly from shape, not the engine:\n1. Exposed
    as a library with bindings (rust, python, JS without node) that can be run in
    your application&#x27;s own event loop\n2. Almost everything in the engine have
    a hook point such as permission, network, dialog, menus ..\n3. Exported Chromium&#x27;s
    C Library (such as boringssl, zstd, ffmpeg ..) for your app so you do not need
    compile it or ship it twice such as ELectron. \n4. Exported feature rich PDF library
    (pdfium with improved)\n5. Playwright inside, no cdp and no node are required"
