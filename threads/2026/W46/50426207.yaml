  text: |-
    Electron makes your app live inside its runtime. Its windows, its Node, its packaging. I wanted the opposite: Chromium as a library, the way you&#x27;d add SQLite.<p>zebkit is Blink, V8, PDFium and FFmpeg in one library you link into your own program, in C, Rust, Python or JavaScript. Your app keeps its own event loop, windows and toolkit. Where it needs the web it adds a view. It can be a window, a child of your own window (X11, NSView, HWND), or off-screen with the frames handed to you.<p>Against the latest Electron (45.2.1), on Linux:
    - 34% smaller (62 MB compressed)
    - cold start in 2.3 s instead of 6.6
    - pages in 29% less memory
    - same DOM, text-layout and JavaScript speed<p>No Node: your app is native code, or JavaScript run on the engine&#x27;s own V8.<p>Everything the engine would show the user or ask of the system is your app&#x27;s to decide:
    - permissions, popups, downloads and certificates
    - network requests, at every stage
    - the window frame, so the page can be your title bar
    - menus, dialogs, notifications and tray icons
    - USB, HID and serial device pickers
    - screen capture<p>Without your code, a page gets nothing a cautious browser wouldn&#x27;t give it.<p>For automation and AI agents, it speaks CDP as Chromium&#x27;s own DevTools server, so Puppeteer, Playwright and any CDP client connect unchanged. It also runs Playwright&#x27;s API natively inside the engine, with no CDP, no Node and no JSON between processes. A click takes 2 ms instead of 33 ms with Playwright on Chrome over CDP, and a screenshot 12 ms instead of 34. Playwright&#x27;s own clients can attach to that with chromium.connect(), and there&#x27;s an MCP server.<p>It also exports Chromium&#x27;s own C libraries for your app (SQLite, BoringSSL, ICU, HarfBuzz, zstd and others), plus a full PDF API.<p>Chromium 157. Linux, macOS (Apple silicon) and Windows. cargo add zebkit, or pip install zebkit.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;ikey4u&#x2F;zebkit" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;ikey4u&#x2F;zebkit</a><p>I&#x27;d love feedback, especially from people who&#x27;ve hit Electron&#x27;s or CEF&#x27;s limits.
