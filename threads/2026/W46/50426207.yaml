  text: 'Nice. I&#x27;m a heavy CEF user on ZShot ( <a href="https:&#x2F;&#x2F;zshot-app.com"
    rel="nofollow">https:&#x2F;&#x2F;zshot-app.com</a> , <a href="https:&#x2F;&#x2F;zshot-cli.com"
    rel="nofollow">https:&#x2F;&#x2F;zshot-cli.com</a> ), but strongly with you on
    this sort of thing should be easier to integrate.<p>Also, very much with you in
    terms of exposing those libs ( like PDFium and FFmpeg ) to consumers, it lowers
    the shipping burden by quite a bit and just enables so much.<p>A note to anyone
    going down this road, just as an aside: actually shipping w&#x2F; Chromium ( and
    especially w&#x2F; FFmpeg ) can get complicated. If you&#x27;re shipping on Mac
    OS, you&#x27;ll want to worry about notarizing all your helpers along with your
    main process ( I&#x27;m assuming Zebkit still running w&#x2F; helper processes
    ). Similar w&#x2F; FFmpeg if you&#x27;re linking to the FFmpeg libs. And, w&#x2F;
    FFmpeg, just validating that your license compliance is in fact what you want
    to be shipping w&#x2F; - FFmpeg has GPL and LGPL modes, so making sure you have
    selected the right one is important. If I recall Blink is LGPL as well, so making
    sure you meet what&#x27;s required there has some distribution effects that are
    important.'
