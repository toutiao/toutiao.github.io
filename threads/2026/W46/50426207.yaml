  author: torginus
  text: How does this differ from CEF(Chromium Embedded Framework)?<p>That&#x27;s
    also a fairly pared down version of the Chrome engine, designed for embedding
    used by tons of projects, like games for their in game lobbies or OBS for their
    Web overlays.<p>Personally, my problem with CEF is that it keeps Chrome fairly
    vanilla - and there&#x27;s a <i>lot</i> of things in there that you wouldn&#x27;t
    want to include in your user app.<p>But there&#x27;s a reason they did it like
    this - if they really took an axe to Chrome&#x27;s codebase, they&#x27;d basically
    lose the ability to upstream new versions.<p>Zebkit on the other hand sounds like
    it&#x27;s gonna be more granular - we&#x27;ll if they cope with this better, but
    I think there&#x27;s definitely a market for a much more lightweight browser engine
    that&#x27;s broadly compatible - for example, just getting rid of sandboxes and
    process isolation would be a huge but incompatbile change.<p>So would be dropping
    large modules like WebRTC or video playback or webusb or whatever, that I&#x27;m
    sure 99% of apps don&#x27;t end up using.
