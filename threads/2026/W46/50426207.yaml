  author: Riiiiichard
  text: |-
    Where zebkit easier thane CEF:
    1. setup: cargo add zebkit for rust, pip install zebkit for python. Golang bindings is planned
    2. your event loop
    3. a plain C api with rust, python, and node-free js bindings on the top
    4. offscreen rendering
    6. batteries: PDFium API, 7000+ API from chroium&#x27;s or its dependencies
    7. automation: playwright api in native with no cdp and node required
    8. size: well, smaller but not much (1&#x2F;3 smaller than latest electron, measured on linux)<p>Where CEF is still ahead:
    1. Maturity: it&#x27;s a product over decade and a big community, zebkit is rather young, but I will keep maintain it
    2. platform: zebkit ships linux x64, macos sillicon and windows x64, cef covers mac intels, arm linux and many others.
    3. missing pieces: zebkit has no printing, web bluetooth, wideevine and so on<p>Zebkit is still a young project, and I’d love to hear your feedback to help it keep improving.
