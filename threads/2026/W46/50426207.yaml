  author: torginus
  text: Not only does Webkit support Wayland, but WPE Webkit was one of the first
    apps to get ported, and its basically the poster child for Wayland:<p><a href="https:&#x2F;&#x2F;wpewebkit.org&#x2F;about&#x2F;faq.html"
    rel="nofollow">https:&#x2F;&#x2F;wpewebkit.org&#x2F;about&#x2F;faq.html</a><p>That
    said this is not upstream Webkit (but they do try to keep up to date, its just
    they usually lag due to the customizations they did), but a more cut down version
    of it that supports a bunch of build config flags, and is used by a ton of embedded
    devices.<p>It&#x27;s a fairly significantly more lightweight option to Chrome&#x2F;CEF,
    that does suffer from a somewhat worse DX and compat with web content, but if
    you can tailor your content to it, rather than looking for a flawless ootb experience,
    it&#x27;s a  worthwhile choice.
