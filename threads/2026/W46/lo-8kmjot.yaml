    For languages like Java, that didn't really have any metaprogramming facilities, IDEs would generate a load of code for you.  And this reduced the need to build those metaprogramming facilities because every project would just get the boilerplate code generated by everyone's favourite Java IDE of the day.
    In contrast, a text editor made developers pay in effort for every line of code that they wrote.  This made them resistant to having large amounts of boilerplate and pushed them towards building abstractions that eliminated it.  It also pushed them away from writing sensible function names and variable names and decent comments, but that's a different issue.
