    This of course has produced the same discussion points elsewhere "this isn't because of AI, people can do stupid things too" or "AI is like an electric saw, you don't blame the saw if your table is wonky at the end".
    I think both excuses are deliberately avoiding the reality of the scenario.
    Management types have absolutely been pushing developers to use LLMs to generate code, often to the point where there is neither time nor expectation of the developer reading, reviewing or even understanding the code.
    Management types have also being doing what they've done since I started my career (and likely longer) - using some hot new buzzword they don't understand, as a good excuse to reduce the number and breadth of technical specialists they employ.
    When you combine the two, you end up with smaller teams, of deliberately inexperienced/junior (read: cheap) and/or overworked/given up experienced developers, generating slop code in a "generated once, never read" pattern, over and over.
    Comparing an LLM to an electric saw shows a ridiculous misunderstanding of one or both tools.
    An electric saw, if you have to compare it to software development, is more like the introduction of compilers back when hand written assembly was common. It can provide a huge speed up vs doing it by hand, but you still need to be very precise about what input you provide. If you "use it wrong" the output is likely ruined and just has to be discarded.
