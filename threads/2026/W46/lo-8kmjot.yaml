    To start with, 2-factor authentication no longer exists, it does not ask for any tokens to log in, so your password is the only security on there.


    You can also change your password without confirmation - you don't need to either enter the previous password or double-enter the new password.


    On top of that, you can change your e-mail, without confirming using your password. If your account gets hijacked, you get an e-mail informing you that "your e-mail was changed, if this was not you contact support". And the "security provider" turns out to be an AI shop.

    Maybe you'd  want to access your games some time, without the risk of losing your account.
