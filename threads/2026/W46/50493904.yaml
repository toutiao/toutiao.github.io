  author: hmstx
  text: Earlier this year I studied a few of the Amiga portraits and yes, they reduced
    VGA to fit in 5 bitplanes (32 colors), but they actually don&#x27;t even use all
    of the colors. I found them to be around 20-25, keeping _more than a few_ aside
    for, say, the GUI.<p>Except in close-up chat mode, from memory all you get is
    text and a background color for the text, and not much cursor or anything else.
    So I&#x27;m still wondering why they didn&#x27;t allow themselves a couple more
    color indices, which can go a long way even without dithering and anti-aliasing
    (which there isn&#x27;t too much of in the VGA portraits). Maybe it ended up compressing
    a bit better.
