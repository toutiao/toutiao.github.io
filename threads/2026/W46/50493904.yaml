  author: superultra
  text: 'I see a few people saying they couldn’t get used to CGA, that it was absurd,
    or worse than no graphics at all.<p>I can relate to that. But as I’ve aged I’ve
    appreciated just how much was done with less back. I mean that literally: we couldn’t
    afford a computer so my dad would haul home his work computer each weekend. We’d
    call BBS’ on it, print stuff. Play shareware games. It pissed my mom off because
    it took up half the dinner table. But my brother learned to code this way too.<p>So
    later on when my friends got EGA and VGA, CGA meant “poor.”<p>Fast forward many
    years and I have kids and were in better financial circumstances than my dad and
    mom back then. My kids have MacBooks. One of their friends was over one night
    and was visibly embarrassed that all she had was the school assigned Chromebook.
    She and my daughter were doing homework and her friend said that she wished her
    family could afford better laptops.<p>I didn’t want to embarrass her but then
    next morning after I made pancakes and I was sitting at the table I was like hey
    let’s take a look at these Chromebooks (we had an old one sitting around) and
    the three of us sat there and in about an hour and a half they’d put together
    a very simple farm game in the spirit of Stardew Valley on PICO-8.<p>Point being,
    we live in a world where especially with AI, it’s easy to think we can do everything.
    And it can feel like that, which means that when you can’t, you feel worse that
    you can’t because it would appear everyone else is doing amazing things with no
    limits.<p>But maybe we need more limits on things. Maybe that 4 color palette
    forced devs and artists to be creative back then in ways that make things better
    for everyone.'
