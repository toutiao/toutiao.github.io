  author: argee
  text: I think the world has just changed. Back then, the puzzles were appreciated
    for being hard, because often you would get the demo of the game on a CD bundled
    with a magazine and it would kind of suck to be done in 10 minutes, whereas with
    a challenge (even an obtuse one) you could play the demo over and over, enjoying
    the sights and sounds, without feeling like you were wasting time on a &quot;replay&quot;,
    since you hadn&#x27;t yet cracked it. On top of that there wasn&#x27;t really
    a glut of these kinds of almost indie-styled yet big studio games in the adventure
    genre so it would be one of the few games you&#x27;d have bought, and again it
    would suck to be done with it too soon. (And you always had gamefaqs should you
    decide otherwise.)<p>There were a couple of games though (like the curse of monkey
    island) that gave you a bit of a choice on how much you cared about spending time
    on puzzles.<p>In the TikTok era, you could probably make the argument that even
    a shape matching puzzle is obtuse and overly difficult and it could be a popular
