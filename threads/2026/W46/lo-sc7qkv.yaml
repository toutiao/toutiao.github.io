    Ok, this is an interesting point of view and I share it. I've always considered software to be "political" and not neutral. In Italy there is a podcast called "DataKnightmare" with the motto “L'algoritmo è politico”, in english it literally means “The algorithm is political”, and it expresses the same idea, but for the tech as a whole. This article reminded me a lot of that podcast.

    Software is built by people, maintained by people, and hosted on infrastructure funded by people. Much like art, it cannot and does not exist in a vacuum.

    This is very true, and sometimes I (and maybe we as a "society") forget that. This is also why software has to exist even if there is only one user, maybe the creator themselves. With LLMs, I think this is the key difference. It happens a lot that I discover a new project and later find out that it is largely LLM-generated, and it feels like a vacuum, because there are no people (or not enough people) behind it.
