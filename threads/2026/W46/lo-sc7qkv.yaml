    My main problem with Stallman's moral delegitimisation of non-free software — “open source [rather than free software] presumes that distributing proprietary software without source code is morally legitimate” he says (presenting this as untrue) — is that it seems to intuitively break down almost immediately.
    It implies that doing nothing is more morally praiseworthy — in all cases — than providing a completely optional service at zero monetary cost if accepting that service comes with baggage, even if the provider grants the service with zero ulterior motives, not even ulterior motives that don't in and of themselves entail harm to the user (e.g. they're not doing it for good PR or as a career booster or something).
    I've read some of Stallman's stuff now and again, but I'm not deeply read on him, so maybe he addresses this objection somewhere and I missed it. Anyone know?
    (A perhaps interesting side note: open source's philosophical shallowness is also a feature from a religious standpoint, not only corporate; free software makes moral claims that I don't think can be justified, as far as I'm aware, from any major religion's moral principles — at least not mine — and thus stands as philosophical/behavioural competition — what some religions would call an idol or false god.)
