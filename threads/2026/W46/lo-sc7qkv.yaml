    Open source is and has always been a philosophically shallow concept which as mentioned in the article was a coined as part of a deliberate rebranding to shed legacy of Free software. The lack of philosophical depth is a feature, not a bug of the open source concept. It is precisely what allows for it to be co-opted by businesses to express an apolitical vibe.
    It is almost impossible to read any article of GNU, Stallman or the FSF and come away with the idea that their development practices are not political. Any developer mildly educated on the history of their practice (of which Free software is a massive part) should know this. While many of Stallmans personal view should be viewed as abhorrent, his thoughts with regards to Free software have been proven correct so many times over by now that it almost feels silly to point out once again.
    https://www.gnu.org/philosophy/open-source-misses-the-point.html provides additional context on the distinctions between open source and Free software.
