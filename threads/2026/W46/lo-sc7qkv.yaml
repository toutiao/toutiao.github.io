    Something I learned recently is that Conway's Law, "organizations [...] produce designs which are copies of the communication structures of these organizations", was published just 3 years after McLuhan's, "The Medium Is The Message". 1964 and 1967. I don't know if Conway read McLuhan, but maybe there was something in the air?
    I think McLuhan would have sympathised with this article. I wonder if Conway would too? I think anybody that's ever been employed to write software can appreciate Conway's Law. And that anybody who appreciates Conway's Law would have to see the truth of this article?
