  text: I see a lot of people bemoaning the loss of a public service, but honestly
    I&#x27;m not sure the public library is an important service.  At one time, yes,
    it represented access to knowledge for everyone.  For everyone talking about how
    important this is, I&#x27;m curious how many have visited a library in the last
    5 years to actually get a book.<p>Today, it could probably disappear and no one
    would miss it.  There&#x27;s a reason these places operate on a shoestring budget
    and haven&#x27;t bothered to update software security.  The services we value,
    we pay for or vote for.  If there was a proposition to close libraries in favor
    of some other minor benefit (e.g. one extra field trip for every school child
    per year), it would probably lose badly.<p>Probably most of the relevant functions
    of a library can be accomplished by other more efficient means. Student loan forgiveness
    (librarians), homeless shelters with computers, and free daycare for kids.  That&#x27;s
    basically what people use it for now, and all can be better done if we just admit
    what its for and do that instead.
