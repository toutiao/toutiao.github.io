    An Open Field Guide to Inference Engineering\n\n**On this page**\n* * *\n\nNote\n\n_Numbers,
    prices and tool versions are as of October 2026._\n\nThis guide is for platform
    engineers new to inference. If you need to understand how models and GPUs work
    together and how to run inference in production, this guide will help. You’ll
    also learn about the tools to use and how to grow into an inference engineering
    role.\n\nThis guide builds on the work of others in the inference community. If
    you’re interested in inference engineering, continue your learning with these:\n\n-
    Viktor Farcic’s [_LLM Inference Explained_](https://devopstoolkit.live/ai/llm-inference-explained-12-concepts-you-actually-need-to-know/)\n-
    Philip Kiely’s [_Inference Engineering_](https://www.baseten.co/inference-engineering/)\n-
    [The Pragmatic Engineer, What Is Inference Engineering?](https://newsletter.pragmaticengineer.com/p/what-is-inference-engineering)\n-
    [ByteByteGo’s Guide to AI Inference Engineering](https://blog.bytebytego.com/p/a-guide-to-ai-inference-engineering)\n-
    [Data Gravity on The Rise of Inference Engineering](https://www.datagravity.dev/p/the-rise-of-inference-engineering)\n-
    [Spheron’s Inference Engineering Guide](https://www.spheron.network/blog/inference-engineering-guide-2026/)\n-
    Vishakha Sadhwani’s [_The AI Inference Engineering Roadmap_](https://www.tech5ense.com/p/the-ai-inference-engineering-roadmap)\n-
    Upbound, [_Project Champagne_](https://www.upbound.io/blog/drinking-our-own-champagne-what-it-takes-to-own-your-intelligence)series\n\n##
    1. Why now? \n\nIn an AI-forward organization, platform teams become inference
    teams. Coding assistants can’t send source code to third parties, and frontier
    model bills increase month to month. Support tools also need internal data that
    a hosted model can’t reach.\n\nOrganizations want to run these models themselves,
    and open models now make that practical.\n\n[Hugging Face](https://huggingface.co/models)hosts
    more than two million open models, and the best of them compete with closed models.
    DeepSeek released R1 in January 2025, and [it matched OpenAI’s o1 on math and
    coding benchmarks about a month after o1 came out](https://arxiv.org/abs/2501.12948).
    When you run your own model, you control latency, uptime, and where your data
    goes. At high volume, you can also [cut costs by about 80%](https://www.baseten.co/inference-engineering/).\n\nThe
    work suits platform engineers. The price of a fixed level of AI capability falls
    roughly 10x a year, and most of that comes from how models are served,[not from
    better GPUs](https://www.datagravity.dev/p/the-rise-of-inference-engineering).
    Upbound, the company behind Crossplane and Modelplane, saw this firsthand. In
    its[Project Champagne](https://www.upbound.io/blog/drinking-our-own-champagne-what-it-takes-to-own-your-intelligence)blog
    series, the team ran its own models on[Modelplane](https://github.com/modelplaneai/modelplane)and
    found that vLLM and scheduling worked. The time went to TLS, identity, timeouts,
    storage, IAM and observability.\n\n### Skills that carry over \n\nAn inference
    engineer picks a model, gets it onto the right GPU, keeps it serving, makes it
    faster and cheaper, and gets paged when it breaks. That’s SRE for a new workload,
    and most of your skills carry over:\n\n| What you already know | What it becomes
    in inference |\n| --- | --- |\n| Scheduling and node pools | GPU placement with
    device selectors, taints and exclusive devices |\n| Capacity planning | GPU memory
    math: weights, KV cache and runtime overhead, checked at runtime |\n| Load balancing
    | Cache-aware routing and long-lived streaming connections |\n| Autoscaling on
    CPU | Scaling on queue depth and KV cache use, with cold starts measured in minutes
    |\n| Rollouts | Rollouts of exclusive GPUs, and a version matrix of model, hardware
    and engine build |\n| SLOs and latency percentiles | Time to first token, time
    per output token and goodput |\n| Observability | Engine metrics, real GPU activity
    and speculative decoding acceptance |\n| FinOps | Cost per million tokens and
    cost per user session |\n| Identity and access | Credentials that last as long
    as an agent session |\n\nA hosted API is still [the right call early in a product’s
    life](https://blog.bytebytego.com/p/a-guide-to-ai-inference-engineering). Self-hosting
    pays off when API spend becomes a real line item, when latency or reliability
    needs outgrow vendors, or when data can’t leave your network. In August 2026,
    [Chris Zeoli counted](https://www.datagravity.dev/p/the-rise-of-inference-engineering)about
    58 open inference roles on public careers boards, with no settled job title.\n\n##
    2. Inference 101 \n\nThis section covers the concepts in roughly the order you’ll
    meet them. Most are about what the engine keeps in GPU memory or what limits its
    speed.\n\n[Viktor Farcic](https://devopstoolkit.live/ai/llm-inference-explained-12-concepts-you-actually-need-to-know/)suggests
    asking when each concept starts to matter. Some matter as soon as you deploy,
    others only once many people use the model, and some you may never need. The table
    near the end of this section gives the signal for each.\n\n### What an inference
    engine is \n\nAn inference engine, like [vLLM](https://github.com/vllm-project/vllm)or[SGLang](https://github.com/sgl-project/sglang),
    is the server that turns model weights into an API. For a platform engineer, the
    closest mental model is a stateful database server with a GPU attached. It loads
    a large dataset into memory at startup and keeps per-session state. It also schedules
    work internally and answers over HTTP. [Ollama](https://github.com/ollama/ollama)on
    a laptop is the same idea at small scale, and every hosted model API runs one
    behind the scenes.\n\n| You know this from databases and services | The engine’s
    counterpart |\n| --- | --- |\n| Loading a dataset into the buffer pool at startup
    | Loading model weights into GPU memory, which can take many minutes |\n| Per-session
    state in a session store | The KV cache, one for each conversation in flight |\n|
    A query planner and connection pool | The scheduler, which batches requests into
    each GPU pass |\n| A wire protocol clients already speak | An OpenAI- or Anthropic-compatible
    HTTP API |\n| Warming caches after a restart | Cold starts: pulling a large image
    and reloading the weights |\n\nUnlike a database, the engine keeps its working
    set in GPU memory, not RAM. GPU memory is small and expensive, so most tuning
    is about deciding how much of it each request gets.\n\n### The inference stack
    \n\nThe engine is one layer of four. At the bottom, **kernels** do the arithmetic.
    You rarely choose them directly. Above them sits the **engine**. Above that, a
    **control plane** deploys and manages engines, because sooner or later you run
    more than one. On top, a **gateway** routes traffic across models and replicas.\n\n
    ![Inference stack: four layers and the clients they serve](https://docs.modelplane.ai/content/media/inference-stack_hu_c190e414239fef5d.webp)\n\n_Inference
    stack: four layers and the clients they serve_\n\nRequests pass through the gateway
    to an engine, which runs kernels on the GPU. The control plane deploys and manages
    the gateway and engines, but no request passes through it.\n\n### Tokens \n\nA
    token is the unit a language model works in, roughly a word or word fragment.
    Context windows, prices and speeds are all counted in tokens. When someone quotes
    tokens per second, they mean this unit.\n\n### Weights and the KV cache \n\nThe
    weights are fixed, and the KV cache grow"
