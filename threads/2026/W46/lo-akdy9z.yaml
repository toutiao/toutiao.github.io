    Ghostty is starting to remind me of Chromium; a place where new standards for a platform are unilaterally inserted and by which others are pressured to adopt due to popularity.

    I feel similarly ambivalent.
    Ghostty is a fine terminal emulator (but I haven't tried all of the new ones, though I do also like WezTerm… and I should really try kitty again, since I had a really nice time meeting its core developer at PyCon India, who is really a lovely person.)
    libghostty is extremely useful. As part of some background research, I was looking into the most minimal terminal multiplexer and collecting short examples (similar to the list of X11 window managers with <10k lines of code.) I intended to use these as a starting point for developing my own ideas; however, I abandoned this approach after creating a simple demo in Zig using libghostty. In fewer than a couple hundred lines of Zig code, I was able to create some very complex proofs-of-concept on top of the libghostty state machine (which is both easy to use and fairly complete.)
    However, I would love to see more competition. libghostty is useful and good, but I think it's possible to create a better library for the underlying state machine—better from a performance, code quality, and design perspective. Furthermore, there's still a lot missing from libghostty, namely supporting functionality. That is, the proofs-of-concept that I was able to create in a couple hundred lines of Zig could have been even shorter, if I did not have to write some minimal helper libraries around the edges of the state machine. (To be fair, some of the helper libraries cover gaps in the Zig standard library—e.g., conveniences around system calls like fcntl or ioctl…) In fact, there may be even be a way to design the state machine API such that we can address complaints about common tools like terminal multiplexers.
    It's hard for me to judge the risk of a monoculture evolving around Ghostty. On the one hand, Ghostty is “where the action is,” and we shouldn't extrapolate too much from this. On the other hand, there is a pervasive feeling that programmers have become hesitant to invest in creativity, novelty, or design, because so much work can seemingly be accomplished without such cost. It's very hard to predict what the consequences of Ghostty development being pulled into the efforts of a start-up company developing what appears to be LLM tooling.
    We know that consolidation can occur very rapidly in some circumstances, and they look like those we currently inhabit (e.g., your coworker whose argument is “well, that's what they're trained on,” when advocating against adopting new technologies,) but diversification can also occur very rapidly in circumstances that also look like those of the day (e.g., your other coworker's counterpoint that the bulk of the tedious effort involved in adopting some new technology can be done at very low cost.)
    Terminal emulators have historically evolved very slowly, and this conservatism obviously has upsides and downsides. Many of us have come to terms with or have found coping strategies to mitigate the downsides, so we experience the conservatism as mostly a positive thing, preserving a useful, working environment. (As another comment here states: “terminal emulation is already way too complex.”) This more rapid evolution may seem disconcerting, but I think it's worth considering the goals of the kitty terminal protocol extensions:

    The goal of these extensions is to be as small and unobtrusive as possible, while filling in some gaps in the existing xterm protocol. In particular, one of the goals of this specification is explicitly not to “re-imagine” the TTY. The TTY should remain what it is -- a device for efficiently processing text received as a simple byte stream. Another objective is to only move the minimum possible amount of extra functionality into the terminal program itself. This is to make it as easy to implement these protocol extensions as possible, thereby hopefully encouraging their widespread adoption.

    Considering this, I think there's a case to be optimistic. If the evolution of the terminal protocol is as deliberate, as considered, and as thoughtful as this goal suggest… then maybe we'll be okay?
