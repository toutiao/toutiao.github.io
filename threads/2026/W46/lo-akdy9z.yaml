  text: |-
    The difficulty of controlling VS Code with only the keyboard is the fault of the VS Code developers, and more generally of the culture of GUI developers. It’s not a technical limitation of the Electron framework or of GUIs in general.
    I think all the keyboard-first TUIs I use, such as Vim and LazyGit, could be improved by converting them to GUIs. Why don’t TUI developers write GUIs, then? My guess is that devs are intimidated by the (necessary) complexity of GUI frameworks and that they have not heard of patterns or frameworks for writing keyboard-driven GUIs. They may also fear the responsibility that comes with the ability to make more choices about the UI, such as relative font size. But if the developer did care enough about the UI to put in the work, then a GUI would be better than a TUI for most purposes.
    Given such a GUI, the TUI would only be better for users who rely on terminal ecosystem features: usage over SSH, integration with terminal windowing systems, and being able to simulate user input by piping to stdin. Equivalent features could be added to a GUI, but it would require a lot of integration work – more than most developers can afford.
