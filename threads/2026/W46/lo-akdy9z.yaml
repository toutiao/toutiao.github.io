    I really don’t understand why people keep on doing frames with gaps between them.

    They make for superficial but attractive demos that challenge only uncontroversial or inconsequential preconceptions without demanding much else from the viewer.
    In other words, you can put together something that looks kind of pretty (if you're just scrolling and don't occupy yourself with how you would use the programme being demonstrated); that looks very similar to something you're very familiar with (often, the demos involve recreating well-known GUI applications); that challenge the preconception that terminals and window managers are very separate and distinct things; that challenge the preconception that terminals are very obscure and difficult-to-use-things; that reässure the viewer that the purported complexity of creating, maintaining, packaging, or distributing a GUI may somehow be avoidable (after all, creating a “CLI” is so easy, it's where most introductory educational materials for programming start!); but also do not challenge the viewer to consider that to create an interface of high utility, there is an unavoidable and often very significant level of effort required (irrespective of the interface medium); and do not challenge the viewer to consider the serious gaps in their own knowledge (e.g., that, despite their years of experience using CLIs, many don't even understand how to design a good CLI of any moderate complexity†!)
    † Seriously, most corporate CLIs are so preposterously bad, I wonder what they're even teaching people in school. It's a marvel when you run across one where the author considered, even fleetingly, “maybe we could read (line-delimited) input data from stdin…?” Frameworks made this worse. With LLMs, there is no hope left. (Median LLM CLI design is atrocious.)
    In the era where creating demos required significant effort, we'd often marvel at what someone could create, and our attention would move on before the discussion would ever move to considering “is this thing actually useful?”
    A friend of mine recently used an LLM to quite faithfully recreate the Bloomberg interface for financial data analysis. They didn't write a single line of code. It took about a weekend of work. Five years ago, this would have gotten them an unending stream of job offers. Today, instead, they got a bunch of social media posts… and a few days later, no one cares. Does the thing look very slick? Yes. Does it actually work? I guess? I don't know if anyone on social media even installed it. Does it do anything better than a Bloomberg terminal? Who knows? Is it competition for Bloomberg users? Probably not. Is there anything we can learn from their code, their design, their effort? No.
    Setting this aside, your underlying supposition—one which I share—is that the various interface media (in this case, terminal-based vs window-manager-based) are sufficiently distinct that their design demands specific effort. An interface design that works in one medium will not “fit” in the other. Designing for a GUI should be very different than designing for a CLI or TUI.
    If we investigate more closely, it's pretty clear that there are extremes where this assertion is obvious true and where this assertion is not obviously true. That is, on one extreme, we have programmes like, say, (the simplest version of) top which probably wouldn't look very different as a GUI. At the other extreme, we have CLIs, and I don't think I even need to name an example to help conjure a vision of a workflow that is impossible to reproduce as a GUI. Somewhere in the middle are TUIs, which I think are on unsteady footing, though I think terminal protocol extensions (such as those proposed in this post) are actually mostly harmless.
    As you note, TUIs seem to demand a different design approach than GUIs, as a result of their cell-orientation and other related fundamental limitations. For example, because cell size is uniform, all graphical elements are uniform, and because “zoom” operates at the terminal level, we don't have dynamic resizing; therefore, your terminal window is generally sized and zoomed to the cell-size of the least important text in the interface; therefore, your terminals $LINES and $COLUMNS are always too few; therefore, we're often cramped, wanting for more space, and sensitive to extraneous whitespace like border padding.
    I agree completely that a direct consequence is that visual style must subsequently adapt to these limitations to produce useful tools that are not simply demo-ware. From this perspective, the terminal protocol extensions proposed by this post would actually be very useful; however, it's probably fairer for the author to include as comparison a fallback mode of their demo programme that eliminates the visual styling. (This is basically what I would do, if I were writing such a programme: use all-edge borders more freely in the presence of the protocol extension and fallback to separating-edge borders or no borders in its absence, not just because it will likely look nicer and be less wasteful of space, but also because it will minimally inhibit naïf cut & paste.)
    Similarly, as you note, it's true that TUIs are almost always a clumsy and discordant cramming of GUI metaphors into a foreign medium. However, I don't think that TUIs have to be this way. In fact, I suspect that there may be as-yet-undiscovered metaphors for TUI operation that provide a materially better interface to users than a CLI or GUI. That is, rather than considering the TUI as somewhere between a GUI and CLI, I suspect that the TUI may be it's own unique, distinct paradigm that has its own unique, distinct way of being operated. I don't know if there are many applications whose most effective interface is manifested in this medium, but I am fairly certain there are at least some.
    Personally, I have recently been exploring the idea of programmatic, “non ad hoc” terminal multiplexing as an avenue for exploring this space further, and I think there's utility in this, but it's not clear whether there is really that much novelty, and I actually kind of doubt the idea will prove to be that revolutionary (but, still, probably very useful!)
