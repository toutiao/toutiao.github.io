    I just added a small collapsed version to the sample Ratatui app. Screenshots are in https://github.com/joshka/ratatui/blob/joshka/cell-borders/CELL-BORDERS.md#screenshots
    Press c (or start it with TILING_PANES_COLLAPSED=1) and the panes sit edge to edge: no outer border, one shared line between neighbours, ┼ where they meet. With box drawing, every shared line still costs a row or a column. With cell borders, the line sits on the cell edge and the text keeps the whole pane.
    The thing you'll notice is that the color of the border has to be owned by one of the cells on either side of it, so the approach here where borders are between cells neatly solves that problem
