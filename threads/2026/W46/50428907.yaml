  author: dang
  text: 'Can you please make your substantive points without swipes and fulmination,
    as the guidelines ask (<a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;newsguidelines.html">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;newsguidelines.html</a>)?
    It&#x27;s quite a bummer to check in on a thread and see an aggressive attack
    sitting at the top, sucking all the oxygen out of what was otherwise a curious
    and fun discussion.<p>People are upvoting this submission because it&#x27;s obviously
    a cool project. Yes, we ask commenters and submitters to hand-write the text they
    post to HN, and yes, Show HNs with genai writeups mostly aren&#x27;t that interesting.
    Occasionally, however, one is cool, fun, and creative. HN is better off <i>with</i>
    these, even though few of us want to read generated text.<p>I actually emailed
    the submitter this morning, asking them to replace that text with something handwritten.
    We do that all the time, trying to salvage cool projects from getting flagged
    (either by the software or by users). In this case I never heard back—presumably
    the email didn&#x27;t get through.<p>I decided that the text wasn&#x27;t so bad
    and moved it to the top and re-upped the post anyway. Perhaps that was a mistake—but
    if I hadn&#x27;t, this post would probably never have gotten attention. Given
    how enthusiastic the community response has been (and no, it is not a voting ring),
    that would have been a loss for the site.<p>Society is in a complicated process
    of figuring out the best ways to use AI. It&#x27;s not clear what the conventions
    will end up being. Many people have many takes. Some of them break HN&#x27;s rules—but
    often they haven&#x27;t the foggiest idea there even is such a rule.<p>How about
    we don&#x27;t assume deceptive intentions or seek to send others to hell during
    what is obviously an entirely-in-flux situation which will probably be going on
    for years?<p>Edit: please see <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50434775">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50434775</a>
