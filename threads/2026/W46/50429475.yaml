    News](/national-news)\n# Too many men suffering in silence, national health report
    finds\n\nJenny Hagan,WestCentralOnline.com | Sunday, Nov 08 2026, 12:00 PM\n\n#####
    Share: \n\nCopied!\n\n![](https://dht7q8fif4gks.cloudfront.net/2026-11/Men%20Mental%20Health%20Image%20by%20mary%20taylor-.jpg)Movember
    Canada will continue working with the federal government to engage experts and
    stakeholders as the strategy takes shape. Image by Mary Taylor\n\nArticle continues
    below advertisement ↴\n\nToo many Canadian men and boys are facing challenges
    with their mental health and well-being without the support they need, according
    to findings from a nationwide consultation that will help shape Canada's first
    federal strategy dedicated to men's health.\n\nHealth Minister Marjorie Michel
    released the government's [**_What We Heard Report_**](https://www.canada.ca/en/services/health/publications/healthy-living/what-we-heard-national-conversation-men-boys-health-wellbeing.html)on
    Nov. 2, highlighting concerns raised by nearly 6,000 Canadians who participated
    in discussions about the health and well-being of men and boys.\n\nThe findings
    come during Movember, a month dedicated to raising awareness about men's health,
    and ahead of International Men's Day on Nov. 19.\n\nThe report identifies mental
    health, social isolation and barriers to seeking help as important issues affecting
    men and boys across the country.\n\n## Mental health and social connection among
    key concerns\n\nLaunched in February 2026, the national consultation gathered
    feedback from individuals, community organizations, health experts and Indigenous
    partners.\n\nParticipants emphasized the importance of improving mental health
    services, strengthening social connections and reducing the barriers that prevent
    men and boys from seeking assistance.\n\nThe report also highlights the role of
    mentorship, positive male role models, healthy relationships and community-based
    support programs.\n\nHealth Canada says the experiences of men and boys can vary
    significantly depending on factors such as age, income, culture, geographic location
    and personal circumstances.\n\nThose differences are particularly relevant when
    considering access to health services in rural and remote communities, where available
    resources and support networks may differ from those in larger centres.\n\n\"Nearly
    6,000 people from across Canada took part in our national conversation on men
    and boys' health, sharing their observations and perspectives,\" Michel said.\n\n\"We
    heard that too many men and boys are struggling, often without the support they
    need.\"\n\nThe federal government says the feedback will help identify priorities
    for improving health outcomes and encouraging men to seek support before problems
    become more serious.\n\n## Advocates call for earlier intervention\n\nOrganizations
    involved in the consultation are emphasizing the importance of addressing health
    concerns before men and boys reach a crisis point.\n\nKenton Boston, president
    and CEO of the Canadian Men's Health Foundation, said earlier intervention is
    essential.\n\n\"For too long, we have waited until they're in crisis before offering
    help. We need to reach boys and young men earlier,\" Boston said.\n\nHe added
    that improving the health of men and boys can have broader benefits for families
    and communities.\n\nMovember, which supported the federal consultation as an independent
    partner, also stressed the importance of social connection and preventative approaches.\n\nAndrew
    Little, Movember's global chief executive officer, said improving men's health
    requires creating conditions that support healthier lives long before serious
    problems develop.\n\n\"The findings reinforce what we've long heard from our community:
    improving men's health starts well before a crisis, by strengthening social connections
    and creating the conditions for men and boys to live healthier, longer lives,\"
    Little said.\n\n* * *\n\n#### Related Stories:\n\n- **[National conversation on
    men and boys’ health launched&nbsp;](https://westcentralonline.com/articles/national-conversation-on-men-and-boys-health-launched)**\n-
    **[SJHL supporting Movember following successful 2024 campaign&nbsp;](https://westcentralonline.com/articles/sjhl-supporting-movember-following-successful-2024-campaign-)**\n-
    **[Mental health in Saskatchewan: A snapshot from the CMHA report&nbsp;](https://westcentralonline.com/articles/mental-health-in-saskatchewan-a-snapshot-from-the-cmha-report)**\n\n*
    * *\n\n## Poor men's health carries economic costs\n\nBeyond the personal impact
    on individuals and families, the organizations involved say improving men's health
    could also provide economic benefits.\n\nAccording to a 2025 study by Movember
    Canada, improving men's health could save the country an estimated $12.4 billion
    annually, with additional economic benefits possible through increased productivity.\n\nThe
    federal government says improving men's health will complement ongoing efforts
    focused on women's health, recognizing that different populations face distinct
    challenges and may require different approaches to prevention, treatment and support.\n\n##
    First federal men's health strategy coming in 2027\n\nThe findings will now help
    guide the development of Canada's first Federal [**Men and Boys' Health and Well-being
    Strategy**](https://www.canada.ca/en/health-canada/services/healthy-living/improving-health-men-canada.html),
    expected to be released in early 2027.\n\nThe consultation included online questionnaires,
    written submissions, roundtable discussions and engagement with health professionals,
    community organizations and government partners.\n\nMovember Canada will continue
    working with the federal government to engage experts and stakeholders as the
    strategy takes shape.\n\nWhile specific programs and funding commitments have
    not yet been announced, the government says the goal is to develop an approach
    that better supports men and boys throughout their lives.\n\nWith Movember underway,
    the findings are also drawing attention to the importance of conversations about
    men's mental health, encouraging help-seeking and building stronger support networks
    in communities across Canada.\n\n##### Get the facts\n\nAdd WestCentralOnline
