  author: gudzpoz
  text: 'As per the comments from Ken Jin (CPython JIT developer) on the article (at
    the bottom of the page), the way yk is integrated with CPython isn&#x27;t really
    that &quot;external&quot; though: they make use of the existing CPython JIT&#x27;s
    tracer, micro optimizations, etc., basically only replacing the copy-and-patch
    backend. So yk will have to maintain the whole CPython JIT patch (sans copy-and-patch)
    if they want to retain the same performance after the removal of the JIT compiler
    from CPython[1].<p>[1] <a href="https:&#x2F;&#x2F;lwn.net&#x2F;Articles&#x2F;1102102&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;lwn.net&#x2F;Articles&#x2F;1102102&#x2F;</a>'
