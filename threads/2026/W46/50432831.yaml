    and &quot;pov&quot; without batting an eye. I&#x27;m sure it&#x27;s not a one
    off from you either. Reasonably so, because it&#x27;d be crazy to expand and explain
    what everything means all the time when it takes so little effort for anyone who
    wants to to familiarize themselves yet is so convenient for everyone who already
    knows in a place we&#x27;d expect it to be extremely common to understand such
    things.<p>And what I&#x27;m saying here is different from &quot;you should not
    ever care to expand acronyms&#x2F;abbreviations&#x2F;initialisms&quot;, but that
    does not necessarily mean your goal should be that it&#x27;s &quot;fun&quot; for
    every possible person (you&#x27;ll never achieve that goal, under or overexplaining
    is never fun). It&#x27;s about what&#x27;s reasonably efficient for everyone likely
    to read the article. If 50%, 10%, 1%, and 0.1% of your audience will understand
    an acronym, abbreviation, or piece of jargon then it has different implications
    for what the right balance of reasoning is. Not every piece need target a generic
    audience, not every acronym need assume the reader can&#x27;t be bothered to learn
    anything not spelled out for them in the page, and not everything is equally hard
    to figure out when it&#x27;s not spoon-fed to the reader.<p>And, again, what is
    &quot;Tensor Processing Unit&quot; going to gain you if you don&#x27;t already
    know that&#x27;s what TPU stands for in the context of this article? I.e. who
    knows what a tensor is and why youd have a processor for them yet gains something
    by the acronym being expanded? People who don&#x27;t know what a TPU is should
    start with a different article completely, probably several, and then read this
    one. Expecting every piece of writing should assume no knowledge blocks more knowledge
    than it helps share.<p>One thing I think the &quot;lucky 10,000&quot; XKCD gets
    bang on is that it doesn&#x27;t frame sharing something with the 9,999 in mind
    as error any more than it blames the 1 for not knowing - instead the problem is
    dogging people for saying they&#x27;ve never heard of something. That&#x27;s truly
    a golden rule, regardless the audience and so on, and doesn&#x27;t require changing
    the way humans write to avoid problems like the one you ran into.
