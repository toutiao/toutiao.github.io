    money into private vouchers for over 530,000 students (within a broader pool of
    680,000 nonpublic students outside federal oversight), heavily subsidizing private
    tuition for wealthy families while systematically underfunding public schooling
    for those families that financial cannot afford private schooling.<p>I very much
    welcome corrections and nuances here, but generally, I’m just not currently aware
    of data supporting your opinion here but my awareness of Florida vs Massachusetts
    are much higher since I have family in both who very much are represented in this
    data I presented above and all of its negative&#x2F;positive impacts of the respective
