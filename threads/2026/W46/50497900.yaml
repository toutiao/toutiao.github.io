  text: I am not aware of any data that supports your opinion. I will focus on Federal
    and state budgets for Massachusetts and Florida, IRS records, and Census data
    to make the point here. Poor people are not moving to Florida as IRS migration
    records show households relocating to Florida from New York, New Jersey, California,
    and Illinois bring an average income between $185,000 and $231,000. That includes
    nearly 30,000 net households earning over $200,000 that average $907,000 annually.
    Meanwhile, Census data shows poor residents in Massachusetts leave at the lowest
    rates because they rely on state safety nets that Florida refuses to fund. Ironically,
    federal taxpayers pay 58.2% of Florida&#x27;s $35.5 billion Medicaid budget, putting
    up $885 per resident against just $635 in state funds, while Massachusetts puts
    up $1,540 in state money per resident. Because Florida rejected Medicaid expansion,
    between 2.5 million and 3.9 million Floridians (11% to 17% of the state) have
    zero health insurance, compared to 140,000 people (2%) in Massachusetts. That
    leaves Floridians with the second highest medical debt burden in the country,
    whereas Massachusetts protects its residents from medical debt. Furthermore, Rockefeller
    Institute data shows Florida&#x27;s $325 billion in federal inflows ($13,900 per
    person) overwhelmingly pay for Social Security and Medicare, which are earned
    payroll tax benefits rather than welfare supplements for displaced poor residents.<p>Florida
    runs the exact same playbook in public education by shifting fiscal burdens onto
    federal taxpayers while funneling state money into private schools. Massachusetts
    invests $2,735 per resident in state and local school funds ($22,947 per student),
    keeping federal aid down to 7% of its school budget. Florida puts up just $1,330
    per resident ($12,689 per student) and leans on federal grants for up to 15% of
