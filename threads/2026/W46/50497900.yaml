  text: It&#x27;s important to remember that the loopholes are often intentional.  They
    are left there so that rich people who can afford CPAs can take advantage of them,
    while middle income and poor people cannot afford to.<p>They are also left there
    so there is wiggle room for interpretation if it comes in front of an auditor
    or a judge.<p>And also, it&#x27;s important to remember that in tax matters, the
    final arbiter of interpretation is a judge.  Judges are humans, not machines.  You
    can&#x27;t &quot;Trick&quot; them by saying &quot;well technically this is allowed!&quot;.  Because
    they rule on the sprit of the law, not as it was written.  Judges aren&#x27;t
    amused when you try to be cute with how you interpret a law.  And some Judges
    have biases, where you get a different ruling depending on if you play at their
    golf club or not.<p>Laws aren&#x27;t computer code.  They are vague on purpose.
