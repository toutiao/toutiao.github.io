  author: AnthonyMouse
  text: 'In theory &quot;impossibility&quot; is a defense to most crimes.<p>In practice
    you usually get screwed in one of the following ways: a) the law makes it impossible
    to do X without breaking the law, even though X is a normal thing and neither
    law was supposed to be a total ban on X, but you could comply by not doing X at
    all, b) the inconsistent laws are imposed by different jurisdictions and then
    they each insist you follow theirs, often a special case of the first one where
    X is &quot;be in two different jurisdictions&quot; but sometimes the even stupider
    one where a jurisdiction demands that you follow its laws even when you&#x27;re
    not in it, c) it&#x27;s impossible for you to follow both laws at once so you
    followed only one of them and then they decide after the fact that you should
    have followed only the other one.'
