  author: skeledrew
  text: There was a time when people had to walk around in a room flipping switches
    to create routines that were combined to produce software. Then there was creating
    and feeding punch cards or paper tape into machines. Go forward some more, and
    there was typing into a writer (couldn&#x27;t even see what was being written!),
    and running through an assembler. And then there was the text editor, into which
    one typed (finally can actually see what&#x27;s written so changes can be made)
    and saved, then switched to a terminal and ran a compiler (and maybe linker) on
    the thing saved. After that came the IDE which was not just the text editor with
    a &quot;compile&quot; menu option, but there was also a lot of templating and
    auto-complete and external libraries. Today there are coding agents bringing all
    this together even more with a few instructions.<p>Know what changes? The amount
    of human effort needed to produce increasingly sophisticated software keeps falling.
    And know what doesn&#x27;t change? People are still inputting requirements into
    the machine, testing what comes out, and iterating until it works as they&#x27;d
    like it to. That&#x27;s the software production process in a nutshell. Doesn&#x27;t
    matter if it takes a few thousand iterations over many months, or a single iteration
    that takes a few hours. It&#x27;s still people who actually produce software,
    not the IDE nor the LLM (both of course <i>generate code</i> to help in the production
    process).
  score: 0
