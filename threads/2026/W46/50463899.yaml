  author: berkes
  text: "&gt;  rewrite is functionally worse for users<p>I&#x27;ve been involved in
    many &quot;rewrites&quot;. Almost exclusively, the result is worse for users at
    release.<p>Especially with &quot;big bang releases&quot;. Where a team is working
    behind the scenes for months or longer, attempting to rewrite the old system &quot;bug
    for bug&quot;. Releasing and then finding out that some users would &quot;hold
    the space bar to make the CPU heat up, and configuring emacs to interpret that
    as &#x27;control&#x27;&quot; (XKCD 1172). First, users don&#x27;t see any improvements
    for all the time that the new system was being built. Secondly, they get all the
    new stuff bundled. So while they may even get value from the rewrite, it is bundled
    with the stuff that makes it worse. Three new features, one new bug. And all everyone
    sees is that new bug.<p>But even rewrites where parts are swapped out and released
    immediately, (strangler vine pattern!) are worse for the users. They do get value
    fast. And in small increments. They can give feedback early. But the (much longer)
    period in which the replacements are implemented, is almost always one of confusion,
    complexity, and &quot;having to learn new things every week&quot;. We all know
    the systems where &quot;change email&quot; is a link that leads to a form on some
    other site, in an old design rather than part of the &quot;edit account&quot;
    page. Because the &quot;account service&quot; has been extracted, but the &quot;notification
    service&quot; replacement on the backlog still.<p>&quot;rewrites&quot; are almost
    always for the benefit of the business, the technical team, or other internal
    reasons. If &quot;benefit to the users&quot; is a part of it, it&#x27;s almost
    always secondary: so that we can build and release and scale new features and
    cool stuff for users faster than with the old legacy spaghetti debt."
