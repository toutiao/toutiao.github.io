  author: dt3ft
  text: 'Correct, sticking out is not the best approach. The only protection users
    of any modern browser have (while still having usable APIs) is whitelisting which
    sites can request information like enumerating system fonts and serving every
    other site fake&#x2F;random information, likely through addons. Say a fingerprinting
    mechanism wants to enumerate your system fonts, you look up your whitelist, and
    if it is not on it, browser serves it the most generic list (can be gathered from
    fingerprinting datasets like EFFs) or finetuning it until your score is as generic
    as possible. Essentially, blending in with the crowd. Having such whitelists would
    make browsing a bad visual experience, but hey, why not do what we can to make
    fingerprinting as difficult as it can be. I don&#x27;t mind having this as a native
    feature which prompts the user as they browse, sample prompt: &quot;this site
    would like to access the following information about your browser, will you allow
    it or serve it generic, the least fingerprintable set?&quot;.'
