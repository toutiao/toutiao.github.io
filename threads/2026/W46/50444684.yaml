  author: octoberfranklin
  text: 'Um, no.<p>Scrapers and bots put a ton of effort into anti-fingerprinting.  Ordinary
    users?  Zero.<p>Users care mainly about cross-site fingerprinting.  Bot-fighting
    is concerned with single-site fingerprinting.<p>The good answer to your dilemma
    is x402: <a href="https:&#x2F;&#x2F;x402.org&#x2F;" rel="nofollow">https:&#x2F;&#x2F;x402.org&#x2F;</a>
    Nothing in life is free; you&#x27;ve been paying with your attention via ads,
    which is where the urge to fingerprint comes from (targeting).  Agentic AI is
    rapidly killing web ads as a revenue source.  It&#x27;s time to stop kicking the
    can on micropayments.<p>Also, this article commits the common mistake of assuming
    that privacy means hiding in the largest possible cohort.  That&#x27;s bogus.  You
    can also get privacy by belonging to many one-member cohorts -- i.e. fingerprint
    <i>uniquely but differently</i> to each site you visit and <i>differently to a
    single site over longer timespans</i> (like weeks).  This is precisely what Brave&#x27;s
    &quot;farbling&quot; does; farbled users have very unique fingerprints and yet
    they can&#x27;t be tracked.'
