    (middlemen) that have occupied the internet and engage in surveillance to support
    advertising services<p>The excessive details sent by the so-called &quot;modern&quot;
    browser, that they control (go figure), make it easier to market, sell and deliver
    advertising services<p>I don&#x27;t use a browser to make HTTP requests<p>Advertising
    requires a popular browser<p>Every internet user can be tracked.  IP address alone
    is usually enough<p>But IP address alone is not enough for today&#x27;s online
    advertising.  It needs a graphical browser, images, CSS, Javascript and so on.
    \ The complexity of these programs is a nightmare.  Intricate behavioural surveillance
    of ad targets becomes possible<p>Tor is not generally used as a means to avoid
    advertising-related tracking that is accomplished using &quot;fingerprinting&quot;.
    \ It could work for that but it&#x27;s overkill<p>Using a &quot;Tor Browser&quot;
    (modified Firefox^1) that can show ads doesn&#x27;t make much sense if the goal
    is to avoid ads<p>1.  Mozilla, the source of Firefox, is &quot;all-in&quot; on
    internet advertising<p>What is the point of fingerprinting.  (A: There could be
    multiple purposes.)  If the purpose is tracking for internet advertising, then
    _internet advertising_ is the problem, not fingerprinting<p>Without the ability
    to advertise through a complex, popular so-called &quot;modern&quot; browser,
    tracking via &quot;fingerprinting&quot; becomes less valuable, perhaps even pointless<p>As
    such, the goal is to send fewer details and provide less potential for advertising
    and behavioural surveillance<p>If in doing that, every www user sends the exact
    same, minimum amount of detail with every HTTP request and thereby appears to
    &quot;blend in&quot;, then maybe that&#x27;s a useful side effect<p>But &quot;blending
    in&quot; alone doesn&#x27;t stop advertising and behavioural surveillance.  Perhaps
    it makes it less targeted, but it does not stop it.  There is a reason that Firefox
    needs to be modified for Tor: it&#x27;s a liability.  The so-called &quot;modern&quot;
    browser has immense surface area and plethora of &quot;features&quot;, e.g., a
    Javascript interpreter, that can be used for surveillance, fingerprinting and
    tracking, whether for advertising or anything else<p>I don&#x27;t use it.  The
    goal is not simply to &quot;blend in&quot;.  The goal is to deny the surface area,
    the &quot;features&quot;, the excessive details sent, that can be used for online
    advertising and the fingerprinting and tracking that is _motivated by_ and associated
    with this advertising<p>As they say, &quot;Don&#x27;t feed the beast&quot;"
