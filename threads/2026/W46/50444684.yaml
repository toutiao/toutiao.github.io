  text: On the face, yes, that is true. And it&#x27;s what confused me about your
    post at first. Because I didn&#x27;t see the connect between scraping and user
    privacy.<p>And yes, on the face, being able to determine whether a bot or a person
    is looking at your site is essentially trying to confirm some private information
    about the consumer.<p>But I think the dichotomy can be settled through the habits
    of consumption. Bots are impartial, greedy, and fast. They can consume resources
    faster than a human can. This could be a problem when trying to provide those
    same resources to humans.<p>Not to mention, the bots doing the scraping are doing
    so to put your content in their regurgitation machine. Which has been ruled as
    &quot;not a copyright violation&quot; due to &quot;reasons&quot;. Whereas, a person
    who attempts to use your content without permission is liable for violating your
    copyright.<p>Now, if the position is &quot;human users&quot; have privacy, then
    we would need that critical piece of information before we decide whether to grant
    privacy to an entity. Also, the user is free to not use the resource if the rule
    is that we&#x27;re allowed to determine whether they are human and the user doesn&#x27;t
    want to share that information. As long as we don&#x27;t pursue that information
    beyond what we&#x27;ve stated we&#x27;re going to use it for, we can be said to
    be respecting the users&#x27; privacy. Also, if we don&#x27;t disclose that information
    to other users or companies, we could still be said to be respecting the users&#x27;
    privacy, because information shared in confidence with us remains that way.
