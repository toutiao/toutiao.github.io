article:
  url: https://fingerprinting.study/
  title: |-
    Large-Scale Measurement and Real-World Mitigation of Web Browser
    Fingerprinting in the Wild
  fetch_status: success
  content: "# Large-Scale Measurement and Real-World Mitigation of Web Browser Fingerprinting
    in the Wild \n\nTom Ritter, Fatih Kilic, Frederik Braun, Elisa Luo, Geoffrey M.
    Voelker, Stefan Savage, Christoph Kerschbaumer\n\nMozilla Corporation &nbsp;·&nbsp;
    University of Toronto &nbsp;·&nbsp; UC San Diego\n\nThis is the companion site
    to a study Mozilla ran on browser fingerprinting. With the help of almost 25 million
    Firefox release users, we measured how identifiable browsers really are, found
    which characteristics make them unique, and used that to design the fingerprinting
    protections that shipped in Firefox 143. Here you can read the paper and its key
    findings, browse the full appendix data the PDF had no room for, download the
    privacy-preserving aggregate data and analysis code, learn how the data was collected,
    and run an interactive test that compares your own browser against the measured
    population. If you have a question the data could answer, there is also a discussion
    board for proposing follow-up research.\n\nBrowser fingerprinting is a known tracking
    mechanism on the modern web, but its real-world effectiveness toward users has
    been hard to measure. To build robust protections, we measured uniqueness across
    a large, unbiased population, to determined what individual metrics cause users
    to be unique. These measurements used multiple privacy preserving technologies,
    like , to ensure that no individual users can be identified or tracked across
    the web. The protections we built into Firefox avoid web compatibility problems
    while dropping the percentage of uniquely identifiable users from 75% to 46%.\n\n[Test
    your own browser →](test/)[Read the paper](#paper)[Full appendix data](appendix.html)[Download
    the data](download.html)\n\n_Shows the percentage of users seen as unique by three
    commercial\n      fingerprinters. Each step adds one protection on top of all
    the ones\n      before it, weighted across the four operating systems._\n\n##
    Paper abstract\n\nWeb browser fingerprinting has become a key tracking mechanism
    on the modern web, yet its real-world effectiveness and which of the existing
    mitigations offer value at scale remain insufficiently understood.\n\nIn this
    paper, we present a large-scale study of browser fingerprinting based on real-world
    telemetry from almost 25 million Firefox release users. This dataset enables us
    to quantify user uniqueness at population scale and identify which characteristics
    contribute most to this uniqueness.\n\nOur analysis shows fingerprintability is
    largely driven by a small set of high-impact characteristics and their combinations,
    rather than the accumulation of many independent measurements. Building on these
    insights, we propose and evaluate fingerprinting protections based on their impact
    on uniqueness and cohort structure, and design data-driven mitigations.\n\nThese
    protections, shipped in Firefox 143, reduce the fraction of uniquely identifiable
    users from 75% to 46% while maintaining web compatibility, demonstrating that
    practical reductions in fingerprintability are achievable in a mainstream browser.\n\n##
    Our key findings\n\nHere's what we want to present to you with this paper and
    the broader scope of our work.\n\n## Test your own browser\n\nThis interactive
    test re-implements individual measurements as close as possible to how Firefox's
    own collection code performed them, runs in your browser, and compares each result
    against the published aggregate data. For every characteristic you can see your
    value and how many of the ~25 million measured browsers share it - overall and
    within your operating system.\n\n[Run the browser test →](test/)\n\nThe test runs
    entirely in your browser. All comparisons happen locally, against our static reference
    files. No data is stored or submitted to us.\n\nIf the test, or anything else
    on this site, looks wrong, please [report it as an issue on GitHub](https://github.com/tomrittervg/fingerprinting_paper_artifacts/issues).
    For a problem with the test, include the diagnostics from its **Copy diagnostics**
    button, or, if you would rather not post your measured values publicly, email
    them to [tom@ritter.vg](mailto:tom@ritter.vg).\n\n## Paper\n\nThe extended version
    of the paper is available as a PDF.\n\n[Read the extended version (PDF) →](fingerprinting-in-the-wild-extended.pdf)\n\n##
    Full appendix data\n\nThe paper's appendices contain a wealth of data locked behind
    a reasonable page limit and PDF formatting. This full data page carries all of
    it - every rank for every operating system and all three modeled services, the
    complete protection chains, and the paper's figures regenerated at print resolution.\n\n[Open
    the full data →](appendix.html)\n\n## Data collection\n\nOur measurements come
    from Firefox telemetry, specifically the `user-characteristics` ping, a dedicated
    telemetry ping. Unlike normal telemetry pings that are sent regularly, this ping
    must be explicitly enabled (which has happened twice, once in 2025 and once in
    2026), and sends one data report before becoming dormant again.\n\nThis ping carries
    no client ID, only a UUID unique to the ping used to de-duplicate users. It cannot
    be keyed to any other telemetry submissions. It is submitted over [Oblivious HTTP](https://www.rfc-editor.org/rfc/rfc9458)
    (OHTTP): a relay operated independently of Mozilla forwards the encrypted submission,
    so the relay can see the sender's IP address but not the contents, and Mozilla
    receives the contents but not the IP address. Access to the collected data was
    restricted to four authorized Mozilla employees. The data was retained for 90
    days and has since been deleted.\n\n[Read about the data collection →](https://docs.google.com/document/d/1m_j0BQEprQleRHZ7tVT7mG-krc8UA171GD5Vl6gZbL0/edit?tab=t.0)\n\n##
    Aggregate data & analysis code\n\nWe release four types of data:\n\n1. A list
    of fingerprints generated for different phases of protections, per modeled fingerprinter,
    with the user's OS and locale unmasked.\n2. Aggregate tables of the frequency
    of value per metric, split by OS\n3. Aggregate tables of the frequency of value
    per metric, correlated by other metrics' values, again split by OS\n4. A detailed
    analysis of rendered canvas images that allows comparison\n\nIn the fingerprint
    lists, the fingerprints cannot be recreated from a website measuring user characteristics,
    due to the way the telemetry was collected. After being generated, the files were
    shuffled to a new ordering, and any locale occurring fewer than 100 times was
    anonymized.\n\nIn the aggregate tables, any value observed fewer than 100 times
