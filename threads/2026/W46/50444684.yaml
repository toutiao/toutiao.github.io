    methods. Even if we&#x27;re talking FF&#x2F;gecko engine only.<p>For starters,
    with access to JS, tests like CreepJS accurately collect real OS info via user
    agent that can&#x27;t reliably be spoofed. This test only collects spoofed data
    in the header. Same with time zones, fonts, processor, and extensions running
    that change the page. No IP tracking, either. I can refresh the page and it thinks
    I&#x27;m on Mac OS in California, or Windows in Germany, neither of which are
    my location or OS.<p>This test didn&#x27;t collect data from anyone with RFP on?
    A fingerprint with a hole in the middle is still a fingerprint. Why skip this
    (and lecture me about it) and still make the claim that only a small number of
    data points is all it takes to make a reliable fingerprint? Especially when it
    reliably gets so much wrong?
