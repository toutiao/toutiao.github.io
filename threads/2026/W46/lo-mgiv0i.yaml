    (Mostly for the sake of other readers)... IME there absolutely are a lot of subtle concerns, but that's also the case of just about anything that combines interfaces and generics in any way.  (Just look at the design morass you can get out of Java/C#/C++-style OO code.)
    I also believe that the theoretical concerns are mostly overblown, and the pragmatic sides are hampered more by poor UI and inconsistent design than anything else.  There's been papers written on the design choices between generative and applicative functors for example, when the solution to me is obviously "you want to be able to write both".  Translucency is a large and complicated idea that large and complicated Python programs implement as "private fields are prefixed by _, if you touch them you'll deserve what you get".  Stuff like that.
    Haskell's traits were in many ways originally devised as "ML modules: the good parts", so "why is this so hard" is very much not a new thought on the subject.  :D
