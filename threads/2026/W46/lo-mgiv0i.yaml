    The Fox project (FoxNet) used SML modules to organize their networking stack in the mid 90s.
    More recently, OCaml modules have been used in the MirageOS unikernel, for its network stack and more broadly, and in the VPNKit networking subsystem of Docker (see section 4.1.1).
    I am not an expert but there do seem to be a lot of subtle concerns that ML-style modules introduce, both in the theory/metatheory and pragmatic sides of language design: generativity, full vs partial functorized styles, translucency, etc. Plus the desire to reduce the extent to which the module system duplicates a large subset of the base language; see 1ML.
