    A class Foo introduces both a particular type (we can have instances x : Cat) and a set of methods & associated types (a.k.a. type members in Scala).
    To get from classes to ML modules, we can notice that the job of introducing a new type x : Cat is kind of redundant, since that could just have been another associated type x : Cat.cat. (In OCaml/SML, this associated type is conventionally just called t, so we would write x : Cat.t).
    If we do this, we lose the idea that the methods in Cat "belong" exclusively and inalienably to the receiver type Cat.t. The downside is we lose out on some type-directed name resolution; the upside is that I can define my own set of functionality Cat2 for the same underlying type (Cat2.t = Cat.t), and we don't have any of the weirdness of "extension methods", downstream code can just choose to use my module with no trouble.
