  text: The idea is to move realtime-ish stuff to a popular processor many people
    have worked with and moving the Linux stuff over to an appropriate platform.<p>When
    it came out we used STM32MP257 to demo a quadrature encoder debugger&#x2F;logger
    (for internal use, not a product) since the IO supports easy interfacing of encoders.
    The micro&#x27;s peripherals (SPI, I2C, GPIO etc.) are easy to program at the
    register level and you can run a simple mainloop+interrupts thing on the micro,
    then run Linux for your UI, networking, etc.<p>The fact that there&#x27;s not
    much activity around these kinds of platforms (CPU+micro or CPU+FPGA) suggests
    it&#x27;s too hard to combine the two in a way that makes sense for enough people,
    easier to just use standard components and have them side-by-side on the PCB.<p>It
    is nice to have them on the same die, though, for people like myself who like
    to work on both ends but don&#x27;t know how to make their own PCBs.
