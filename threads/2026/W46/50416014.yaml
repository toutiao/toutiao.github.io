  text: The days of VxWorks, vendor-specific paid-for IDEs, licensed compilers and
    proprietary BSPs pinned to a 2.x Linux kernel are long behind us - and thank fuck
    for that.<p>Back then, the way you were supposed to get into embedded development
    was &quot;don&#x27;t&quot;.<p>Things have changed since. You can now buy a bunch
    of microcontroller and SoC boards and get something to work just by following
    a simple tutorial you found online. Accessibility and ease of use have advanced
    in leaps and bounds.<p>But all of those secondary MCU-like cores? They&#x27;re
    still in the old embedded hell. Things are getting better, but they are getting
    better very slowly.
