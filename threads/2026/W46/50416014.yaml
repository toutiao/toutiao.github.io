  author: adrian_b
  text: As I have already mentioned in another comment, Cortex-A35 is not the replacement
    for Cortex-A7, but for the smaller and slower Cortex-A5. Because of that, Cortex-A35
    is slower at the same clock frequency than Cortex-A7.<p>The successor of Cortex-A7
    was Cortex-A53, which was followed by Cortex-A55, then by Cortex-A510, and so
    on, until the current Arm C1-Nano.<p>The line of Cortex-A5 and Cortex-A35, which
    includes Cortex-A32 and Cortex-A34, can be considered dead, because using so slow
    CPUs instead of the best Cortex-M or Cortex-R cores (like Cortex-M85 and Cortex-R82)
    does not make sense.
