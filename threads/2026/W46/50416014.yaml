    embedded systems got their start in the early 00s and just had issues upgrading
    past the Linux 2.4 -&gt; Linux 2.6 jump.<p>Or in other words: it was far more
    likely that Linux wouldn&#x27;t support Chip X, rather than Chip X was unable
    to support Linux. Or maybe a chip did support Linux but most of the codebase was
    stuck on Linux 2.4. Or if Linux support existed, it was effectively proprietary
    custom kernel modules that individual teams wrote for themselves rather than a
    community-driven internet-based workflow. Etc. etc. Linux was harder back then.<p>But
    the stuff you&#x27;re talking about is early 2010s, if not 00s. Damn well over
    a decade, might be closer to TWO decades (and the only reason I don&#x27;t know
    that is because I was a wee-little ignorant student back then and don&#x27;t really
    know things older than 2010s....)'
