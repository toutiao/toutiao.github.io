  text: Calling it niche is overlooking &quot;product&quot; needs. People have been
    needing a smaller MCU for doing anything meaningful with a bigger SoC. This is
    due to complex power sequencing for powering the SoC + desire for realtime IO
    on these &quot;products&quot;. Offering combined solution makes it easier.<p>--<p>&gt;
    support<p>You are 100% right on this aspect. AMP based SoCs fall in weird range
    - some with great documentation, better isolation, and software support. While
    others basically feel like rotting in hell.<p>--<p>On that note, I picked STM32MP1
    for my grad project for a Embedded Linux course for exactly this reason - &quot;how
    interesting and challenging would it be for developing on a SoC like this&quot;.
    Kudos to ST for making it easier than others!
