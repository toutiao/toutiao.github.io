  author: adrian_b
  text: Calling Cortex-A35 &quot;full-desktop-capable&quot; is quite a stretch.<p>Even
    if it supports the 64-bit ARM ISA, it is a very small and slow core, much slower
    than even the little Cortex-A53 and Cortex-A55 cores, which were used in the early
    Raspberry Pi versions.<p>As mentioned in TFA, at the same clock frequency Cortex-A35
    is much slower than the fastest microcontroller cores, i.e. Cortex-M85 and Cortex-M7.<p>The
    only advantage of Cortex-A35 is that it has a deeper pipeline, which increases
    the latency of many things, like interrupt handling, but it allows a higher clock
    frequency, thus a greater throughput.<p>Having a MMU, it is suitable for Linux,
    but using it for a desktop would be ridiculous, as even the slowest Atom CPU from
    17 years ago was much faster.
