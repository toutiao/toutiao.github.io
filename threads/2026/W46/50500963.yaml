  author: grey-area
  text: This seems a little confused.<p>The 23x more launches figure comes from HLS
    (Nasa sponsored mission to the moon). They may well change the configuration of
    that anyway, but if you want to refuel in orbit, that&#x27;s what it costs. It&#x27;s
    hard to get fuel to orbit (or any sort of payload). Previous Moon missions haven&#x27;t
    refueled anything, but they couldn&#x27;t return anything heavy from the moon&#x27;s
    surface, the vehicle got smaller and smaller as it went and many parts were left
    behind, so it&#x27;s not comparable. You can be sure if it&#x27;s cheaper to somehow
    do this mission with expendable boosters, they&#x27;ll think about doing that.<p>On
    a normal mission just to earth orbit, there is one booster and one starship, and
    reusing the booster is more a question of why not save some money for a little
    more propellant use? The reususable booster doesn&#x27;t contribute much extra
    weight, it uses little propellant for boostback and landing.<p>The booster also
    doesn&#x27;t go all the way and you <i>need</i> a booster if you&#x27;re going
    to reach orbit (due to that equation), so it doesn&#x27;t take much to make it
    reusable. So all in all, why <i>not</i> make it reusable if you can? What would
    you save from using expendable ones?
