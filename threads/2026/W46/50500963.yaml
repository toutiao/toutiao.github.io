  author: labcomputer
  text: "&gt; There weren&#x27;t too many runways available to use as backups<p><i>In
    particular</i>, because the shuttle used an all-but-obsolete terminal guidance
    system, called Microwave Landing System (MLS).<p>While MLS was <i>intended</i>
    to be the &quot;next generation&quot; instrument landing system (to replace VHF
    ILS approaches) for the entire national airspace system, MLS was basically only
    ever installed at a few runways intended as Shuttle abort locations, and Shuttle
    was basically the only aircraft that used it (aside from some other NASA test
    aircraft used to validate MLS approaches, and a couple other one-off airports).<p>It&#x27;s
    a shame, too, because MLS is pretty technically interesting, allows other-than-straight-in
    approaches, and offers horizontal, vertical <i>and</i> high-precision distance
    guidance all in one package.<p>But the point is that Shuttle had very slim margins,
    so the fact that it landed horizontally <i>very explicitly did not mean</i> it
    could land &quot;anywhere&quot;: It required an MLS approach.  The plan for situations
    where an MLS runway was not available was to have astronauts bail out at altitude."
  score: 0
