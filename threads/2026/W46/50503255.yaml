    # We’re Asking an Appeals Court to Require a Warrant for ALPR Searches

     ![sinister cop and cameras loom over street grid with cars identified by license plates](https://www.eff.org/files/styles/resized_banner/public/banner_library/siren_v._san_jose.png?itok=sIQT1Vrk "SIREN v. San Jose")

    Image by EFF (CC-by)

    Today, along with the ACLU, EFF filed an [amicus brief](https://www.eff.org/document/united-states-v-sturdivant-eff-aclu-amicus-brief) in the Sixth Circuit court of appeals in _United States v. Sturdivant_, a case where police warrantlessly tracked a suspect’s movements using [Automated License Plate Reader](https://sls.eff.org/technologies/automated-license-plate-readers-alprs) (ALPR) data. Our brief details the vast, interconnected network of ALPRs that constantly track drivers around the country and argues that this tracking is a “search” under the meaning of the Fourth Amendment.

    _Sturdivant_ involves a series of robberies in and around Cleveland, Ohio. Using surveillance camera footage, police identified the make, model, and color of the robber’s car, but they did not know its license plate number. After running an open-ended search of two ALPR databases, Flock and ELSAG, officers learned a car belonging to the defendant had been tracked near sites of the robberies, eventually leading to his arrest. Faced with a motion to suppress the ALPR evidence, the district court held that Mr. Sturdivant had no reasonable expectation of privacy in his license plate number because it could be observed by members of the public, and that therefore he had no Fourth Amendment interest in not having his car tracked in public places.

    But ALPRs are simply not comparable to observing an individual license plate on a passing car. As we’ve explained in [many](https://macdl.com/wp-content/uploads/2019/09/Brief-Amicus-ACLU-ACLUM-CPCS-EFF-MACDL.pdf) [amicus](https://www.eff.org/deeplinks/2019/03/search-through-millions-license-plates-police-should-get-warrant) [briefs](https://www.aclu.org/cases/schmidt-v-norfolk) and in our lawsuits directly challenging ALPR use in [San Jose, California](https://www.eff.org/cases/siren-v-san-jose) and [Wisconsin](https://www.eff.org/cases/wisconsin-council-churches-v-milwaukee-racine-kenosha-green-bay), ALPRs give law enforcement “a virtual time machine to view suspects’, or anyone else’s, past movements (and much more) with just the click of a button.” Just last month, a federal district court [agreed](https://www.eff.org/deeplinks/2026/10/federal-court-rules-alprs-are-mass-surveillance-eff-gets-disappointing-ruling) and held that ALPRs are a “form of indiscriminate mass surveillance” that can violate the Fourth Amendment.

    We hope the Sixth Circuit will reverse the lower court in this case and hold that ALPR searches require a warrant.

    ## Related Cases

    [Wisconsin Council of Churches v. Milwaukee, Racine, Kenosha & Green Bay](/cases/wisconsin-council-churches-v-milwaukee-racine-kenosha-green-bay)

    [SIREN and CAIR-CA v. San Jose](/cases/siren-v-san-jose)

