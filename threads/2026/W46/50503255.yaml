    ## Related Updates

    Police agencies across the U.S. have deployed Automated License Plate Readers (ALPRs) to capture images of passing vehicles along with time, date, and GPS coordinates. While the technology itself isn’t new (ALPRs have existed in various forms for [more than 50 years](https://www.anpr-international.com/history-of-anpr/), and in [the U.S. since...](https://sam.gov/workspace/contract/opp/c623f29a9eb8599abec842570558e453/view)

    _This post was co-written by_ [_Andi Cao_](https://www.eff.org/about/staff/andi-cao)_, an EFF legal intern._Automated license plate readers (ALPRs) are mass surveillance. They photograph every passing car and log where and when it was captured, building a searchable record of where nearly everyone drives. [Cities should not buy them](https://www.eff.org/deeplinks/2026/08/effs-policy-position-alpr-surveillance-eliminate-it-and-reduce-its-harms), and cities that...

    EFF joined the ACLU of Wisconsin in filing a petition to the Wisconsin Supreme Court, asking it to rule that the state’s constitution requires a warrant for retrospective searches of ALPR databases used by law enforcement in four cities.

    In an extremely disappointing [ruling](https://www.eff.org/document/order-after-hearing-demurrer), a California trial court dismissed [_SIREN v. San Jose_](https://www.eff.org/cases/siren-v-san-jose), our case challenging the city of San Jose’s warrantless searches of its vast stores of automated license plate reader (ALPR) data. EFF and the ACLU of Northern California represent SIREN and CAIR California, two...

    The Marin County Sheriff’s Office is the latest California law enforcement agency to get caught sharing automated license plate reader (ALPR) data from their Flock Safety system with out-of-state and federal agencies. EFF and the ACLU of Northern California are calling them out for this direct violation of California law,...

    San Francisco's [decision to retain its use of Automated License Plate Reader (ALPR) surveillance cameras](https://www.sf.gov/news-mayor-daniel-lurie-unveils-strong-privacy-protections-for-public-safety-cameras-building-on-work-to-drive-down-crime-in-san-francisco) belies what we know about this spying technology tool: it endangers residents and threatens the privacy and civil liberties of our community. Based on what's in the city's press release and announcement, this policy...

    With no warrant requirements, limited guardrails, and deficient audit processes, ALPR databases have fostered a culture of unrestricted access to everyone’s location information. This culture of abuse has allowed police to treat a mass surveillance network like their own personal search engine, permitting the tracking of the movements of everyday...

    Law enforcement agencies across the country are increasingly relying on spying technologies—[automated license plate readers](https://www.eff.org/deeplinks/2026/02/effecting-change-get-flock-out-our-city) (ALPR), [cell-site simulators](https://www.eff.org/document/cell-site-simulators), and [facial recognition](https://www.eff.org/deeplinks/2025/01/police-use-face-recognition-continues-wrack-real-world-harms), to name a few--causing an outcry in many communities where people are rightly concerned about the threat to civil rights and civil liberties these tools present.Some...

    Within the last few days, two important state actions have dealt a big blow to automated license plate reader (ALPR) networks. This is just the latest proof of the growing tide of public opposition to mass surveillance. After years of successful grassroots battles to pull these cameras from local streets...

