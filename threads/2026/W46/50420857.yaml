  author: rayiner
  text: I don’t understand this fixation on scalability in response to state changes.
    UIs have a pretty low ceiling on how many widgets can be in the tree. Doing sophisticated
    diffing to avoid manual updates on a few dozen UI elements hardly seems like a
    win. In situations where you have large numbers of UI elements, like table or
    list views, it’s well known how to display only the rows in view.<p>The new diffing-based
    toolkits almost all suck. First-party SwiftUI stuff on my M5 Pro is more janky
    than anything Apple has released since OS X 10.0 running on underpowered G3s.
    At least that can be blamed on the transition full screen window compositing and
    anti-aliasing. SwiftUI doesn’t actually do anything that MacOS hasn’t already
    been doing for 25 years. And if anything modern SwiftUI apps have less complicated
    layouts than AppKit apps that worked just fine on a 500 MHz G4.
