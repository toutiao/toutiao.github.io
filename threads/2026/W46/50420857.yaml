  author: simonask
  text: GPU-allocated memory isn&#x27;t always kept resident. Depending on the compositor,
    window surfaces get swapped to main memory when VRAM pressure is high. This obviously
    slows things down, but at the end of the day, the window contents need to exist
    somewhere, and the monitor is attached to the GPU, so it needs to at the very
    least pass through VRAM at one point or another.<p>On a desktop system, a software
    renderer makes no material difference in total memory usage, because the contents
    need to go onto a compositor surface no matter what you do, and that is backed
    by memory somewhere.<p>We can debate whether every application needs triple-buffering
    of the window surface, but that&#x27;s configurable.
