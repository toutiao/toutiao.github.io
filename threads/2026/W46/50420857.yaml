    butter of Rust as long as they are not cyclic, but arguably you shouldn&#x27;t
    be declaring your UI with cycles at all.<p>- Ugly state is exactly what Rust was
    made for. It forces you to tame the ugly state instead of hacking at it and hoping
    it works.<p>- Event driven and heavily async are neither a Rust strength nor a
    weakness (some would say it&#x27;s actually a strength but IMO there are tradeoffs).
    Actors and message passing are one of the many patterns that Rust is fantastic
    at.<p>- And I don&#x27;t see how JSON is relevant to UI, but JSON is not only
    &quot;solved&quot; in Rust but the best ser&#x2F;de libraries I&#x27;ve ever used
    are in Rust.<p>Rust gets cumbersome with hyper-connected or hyper-shared ownership
    (think e.g. inodes in a filesystem) where you have to sidestep the borrow checker...
    but UIs are inherently hierarchical.<p>Yes, Rust doesn&#x27;t fit the traditional
    OOP cycle-connected &quot;widget&quot; model where a textbox &quot;knows&quot;
    about its sibling button, and the button &quot;knows&quot; about its sibling textbox.
    Turns out that that model sucks, and that&#x27;s why everyone fled to React and
    other saner models even without Rust&#x27;s constraints.<p>Maybe I&#x27;m just
    biased by the React mindset (unidirectional data flow), but I&#x27;ve never been
