  title: A Critique of GPUI
  fetch_status: success
  content: "[All posts](/)On this page\n- [The only question that matters](#the-only-question-that-matters)\n-
    [GPUI: notify is zone.js](#gpui-notify-is-zonejs)\n- [Making GPUI precise defeats
    GPUI](#making-gpui-precise-defeats-gpui)\n- [Elm: deceptively simple at small
    scales](#elm-deceptively-simple-at-small-scales)\n- [A quick note on immediate
    mode](#a-quick-note-on-immediate-mode)\n- [One engine, different wiring](#one-engine-different-wiring)\n-
    [Why run once](#why-run-once)\n- [Signals do not automatically make your app fast](#signals-do-not-automatically-make-your-app-fast)\n-
    [Conclusion](#conclusion)\n- [Method](#method)\n- [References](#references)\n\nRecently,
    there has been a trend of more desktop GUI apps being built using native rust
    GUI frameworks. And there are now even well known electron apps getting official
    rewrites: Discord announced their app is being rewritten using GPUI. Meanwhile,
    a lot of the LLM-clones being published seem to choose egui. In this post, I want
    to explain why I am not sure those frameworks are a good foundation to build on.\n\nTo
    put it plainly: I believe both GPUI’s and egui’s state models are dead ends for
    complex desktop applications. Both are impressive projects, and they have their
    place. Zed genuinely feels fast and nice to use, and I use egui myself for debug
    interfaces in bevy games. But I don’t think those frameworks should be the default
    choice for native desktop apps.\n\nI want to make two arguments:\n\n- Every UI
    architecture ends up needing to know what changed and who depends on it, or performance
    characteristics will not scale. A framework whose state model cannot say so makes
    the application say it by hand, at the cost of whatever made that framework’s
    API semantics attractive in the first place.\n- Once you admit you want that precision,
    components that run once, with signals and reactive holes, are the simplest API
    for it.\n\n_Disclosure: I ported GPUI’s current Linux renderer to wgpu, I built
    the benchmark harness used below, and I work on[zgui](https://github.com/zortax/zgui),
    a signal-based Rust framework that appears in the charts._\n\n## The only question
    that matters\n\nRaph Levien quotes Ron Minsky: “hidden inside of every UI framework
    is some kind of incrementalization framework.” A UI is a function of state, and
    state changes a little at a time. But if that function becomes expensive, you
    might want to start looking for ways to derive a faster way to update pixels on
    the screen from an incremental state change. So every framework has to answer
    one question: when one value changes, what runs?\n\n| Model | What a write runs
    | Who finds the change |\n| --- | --- | --- |\n| Immediate (egui) | All UI code,
    next frame | Nobody |\n| Elm (Iced) | All of `view`, then a diff | The diff |\n|
    Views (GPUI) | Every view without a cache | You, with `notify` |\n| Signals, re-run
    (Freya, Compose) | Components that read it | The framework |\n| Signals, run once
    (Floem, Solid, zgui) | Closures that read it | The framework |\n\nI understand
    why people like the first three. No state to synchronize, one place where state
    lives, a `render` function that is plain Rust, no macros or separate compiler.
    I’m gonna make the argument that these approaches don’t scale, and fixing the
    underlying problem defeats what makes these models simple and easy to reason about.\n\n##
    GPUI: `notify` is zone.js\n\nGPUI calls itself “a hybrid immediate and retained
    mode” framework. It retains state in entities. The UI is defined in `render` functions,
    changing state must trigger a rerun.\n\n    impl Render for Sidebar {\n        fn
    render(\n            &mut self,\n            _: &mut Window,\n            cx:
    &mut Context<Self>,\n        ) -> impl IntoElement {\n            let inbox =
    self.inbox.read(cx);\n            div()\n                .child(format!(\"{} unread\",
    inbox.unread()))\n                .children(inbox.threads.iter().map(|t| t.title.clone()))\n
    \       }\n    }\n\nIt is ordinary Rust. You can use `if`, `for` and local variables,
    and there aren’t any weird wrappers. State changes require an explicit notification:\n\n
    \   self.threads[i].unread = false;\n    cx.notify();\n\n`notify` carries the
    entity id. Since Rust doesn’t have a write barrier on`&mut`, GPUI cannot see which
    field changed (or whether anything changed at all). The Angular team wrote this
    about zone.js in 2023: it “is only capable of notifying us when something _might_
    have happened”, and “This approach has not scaled well.” `notify` is more precise
    than a zone, since it names an entity, but ultimately it makes the same kind of
    statement. Below that id, GPUI knows nothing, so it re-renders every view that
    is not behind a valid`.cached()` boundary. And in practice, GPUI often rerender
    every view, because`.cached()` is rarely used by application authors, and imposes
    certain restrictions on layout semantics.\n\nGPUI has a reputation of being “fast”.
    And while constants might be relatively low, asymptotically, it is leaving a lot
    on the table. So I ran a few benchmarks, that specifically test how much a sparse
    state change in a large UI actually costs.\n\nAt 3,000 live rows with a cached
    view per row, changing one label takes 8.4 ms. A hover, a keystroke and writing
    a value equal to the old one all cost about the same, because the cost follows
    the tree and not the change. It grows by about 3 ms per 1,000 live rows. Write
    the rows as plain elements, as in the code above, and the same label takes 92
    ms. A hand-written equality guard takes the equal write from 7.9 ms to 0.9 µs
    (demonstrating how much is left for each call site to find).\n\n![On a linear
    axis, the cost per row is the slope](/images/a-critique-of-gpui/scaling-linear.png)
    ![On a linear axis, the cost per row is the slope](/images/a-critique-of-gpui/scaling-linear-dark.png)\n\nThis
    doesn’t mean that every GPUI app is slow, but it shows the limit of the state
    model. Especially with more expensive layout, you _do hit_ this wall in practice.
    Zed might feel fast, but the truth is that Zed is a relatively simple app, UI
    wise. The app’s chrome contains a few buttons, in a simple layout, a sidebar and
    a text editor, and the text editor is implemented as a custom element, completely
    bypassing GPUI’s layout and view semantics. By their own account, a window “has
    tens of nodes and a few thousand elements”.\n\n## Making GPUI precise defeats
    GPUI\n\nThe obvious fix is to retain more. Zed has experimental branches for this,
    and Longbridge’s gpui-fast is a fork that keeps every view’s subtree between frames.
    It works, within a limit: the smallest thing either one can reuse is a view. So
    to update one label without rebuilding the sidebar, the label has to be a view:\n\n
    \   pub struct UnreadBadge { unread: usize, _watch: Subscription }\n    \n    impl
    UnreadBadge {\n        pub fn new(inbox: Entity<Inbox>, cx: &mut Context<Self>)
    -> Self {\n            let unread = inbox.read(cx).unread();\n            let
    _watch = cx.observe(&inbox, |this, inbox, cx| {\n                let unread =
    inbox.read(cx).unread();\n                if unread != this.unread {\n                    this.unread
    = unread;\n                    cx.notify();\n                }\n            });\n
    \           Self { unread, _watch }\n        }\n    }\n    \n    impl Render for
    UnreadBadge {\n        fn render(\n            &mut self,\n            _: &mut
    Window,\n            _: &mut Context<Self>,\n        ) -> impl IntoElement {\n
    \           format!(\"{} unread\", self.unread)\n        }\n    }\n\nIts owner
    then has to create it and keep the handle:\n\n    let badge = cx.new(|cx| UnreadBadge::new(inbox.clone(),
    cx));\n\nThat is an entity, a `Render` impl, a subscription, a stored copy of
    the value, a hand-written guard and an owner, all to express that one label depends
    on one count. In a signal framework it is this:\n\n    let unread = Memo::new(move
    |_| {\n        threads.with(|ts| ts.iter().filter(|t| t.unread.get()).count())\n
    \   });\n    Label::derived(move || format!(\"{} unread\", unread.get()))\n\nThe
    rest of GPUI’s API works against this too. `Render` takes "
