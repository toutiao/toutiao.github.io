  author: slopinthebag
  text: to some extent retained mode is a cache invalidation problem. imgui&#x27;s
    sidestep this, except for a constrained set of cases where building the ui requires
    doing a lot of work, in which case a simple, bespoke cache can be used - to me
    this is far simpler than trying to wrangle your entire application through a generalized
    state cache abstraction. especially since doing so generally requires you to deeply
    adopt the UI framework&#x27;s abstractions into your application code, regardless
    if it&#x27;s a good fit or not - like you said, you can avoid duplication, but
    the tradeoff is massive coupling.<p>i think a glaring red flag with retained mode
    ui&#x27;s is how slow they are. there is a reason they put so much effort into
    granular reactive updates - they&#x27;re just way too slow otherwise. resize retained
    mode ui windows and the fps drops to like 2. meanwhile in an imgui, it doesn&#x27;t
    matter if you&#x27;re rendering 1000 buttons and then need to render 1000 dropdowns,
    the work is roughly identical. this means <i>big</i> problems for a retained mode
    system. this seems like a massive issue to me - the system is so slow, it&#x27;s
    only considered &quot;faster&quot; than imgui (debatable) when it doesn&#x27;t
    actually do much. but we want ui&#x27;s to scale with interactions, not depend
    on minimal changes in order to recover acceptable performance.
