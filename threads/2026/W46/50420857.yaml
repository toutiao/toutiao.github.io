  text: 'According to the benchmarks posted there, it&#x27;s like extreme edge cases
    involving ton of changes in the UI that I&#x27;m not sure which app in the real
    world really does that. And if they do, there are many other optimization techniques
    you can use in pretty much any of those GUI libraries.<p>There are two camps to
    define complexity, as far as I can tell: one involves dynamic updates to plenty
    of elements in the current &quot;view&quot; (where view is not necessarily what&#x27;s
    in the viewport, but what is in the rendering tree of the current process), and
    the other one has to do with intricate visual eye candy stuff such as stutter-free,
    orchestrated modern animations and effects that could involve custom shaders.
    The article is talking about the first one. Personally, what defines a choice
    of UI library has to do more with the second camp, plus how stable it is, extensible,
    and if it works as intended in the platforms I want to ship the app.'
