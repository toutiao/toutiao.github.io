    I bought a true Sega clone from Aliexpress and the cartridge is different and
    the games are in another league compared to 8-bit. If I had that in the 90s, I&#x27;d
    have been the king of the village. We had a Street Fighter arcade in the village
    pub and the kids would crowd themselves along drunks to wonder at the spectacle
    when someone felt rich enough to pay for 2 minutes of  entertainment.'
