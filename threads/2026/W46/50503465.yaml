  text: Basically all 8- and 16-bit consoles, as well as some later ones (such as
    the Game Boy Advance, Nintendo DS and more recently the N64), have very active
    homebrew scenes at this point. There are even no-code options for some platforms
    [1] that have proven to be remarkably popular, to the point even McDonald&#x27;s
    promotional game &quot;Grimace&#x27;s Birthday&quot; was made in GB Studio and
    released in emulated form. The ease of manufacturing new PCBs and cartridges using
    modern parts has also led to a market for physical commercial homebrew releases,
    both through publishers and directly from developers.<p>Unfortunately, like many
    other hobby programming niches, most homebrew communities are currently dealing
    with the recent influx of low-effort vibe coded games that completely defeat the
    point of learning to work and be creative with limited hardware. Some started
    adopting strict no-AI stances, which is refreshing to see when seemingly every
    other community is going the other way; so far my own released work (mainly on
    the original PlayStation) is completely free of LLM contributions and I&#x27;d
    like to keep it that way for as long as I can.<p>[1] <a href="https:&#x2F;&#x2F;www.gbstudio.dev"
    rel="nofollow">https:&#x2F;&#x2F;www.gbstudio.dev</a>
