  author: ImJasonH
  text: I&#x27;ve wanted to get into NES homebrewing for years but found it difficult
    to get started. Eventually I vibe-coded a language specifically designed to build
    NES games, but then fell down the rabbithole of designing that language and the
    compiler, instead of building games. Typical.<p>I was able to produce a few (very)
    &quot;low effort vibe-coded games that completely defeat the point of learning
    to work and be creative with limited hardware&quot;, but along the way I was still
    able to learn how to build a compiler to be creative with limited hardware for
    me. And that was fun.<p>I&#x27;ll never make anything 1&#x2F;1000th as impressive
    as the games passionate hobbyists have made over the years, and I don&#x27;t think
    we&#x27;re even building the same thing, conceptually. For me, vibe-coding the
    game (and the language, and the compiler) is the game itself.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;imjasonh&#x2F;playground&#x2F;blob&#x2F;main&#x2F;nescript&#x2F;README.md"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;imjasonh&#x2F;playground&#x2F;blob&#x2F;main&#x2F;nescript&#x2F;RE...</a><p>My
