  text: '99.98% these were Dendy consoles. Forall I know, these consoles arrived here
    by Russian way, we even called the market where you could buy these things &quot;the
    Russians&quot;, even though in practice they were Moldovans ( <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Moldova"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Moldova</a> ).<p>I
    still have my Terminator2 console at home but doesn&#x27;t power up anymore, otherwise
    it could fetch some 150 EUR on the flea market: <a href="https:&#x2F;&#x2F;www.olx.ro&#x2F;d&#x2F;oferta&#x2F;consola-retro-terminator-2-ending-man-bs-500as-functionala-IDl4owD.html"
    rel="nofollow">https:&#x2F;&#x2F;www.olx.ro&#x2F;d&#x2F;oferta&#x2F;consola-retro-terminator-2-endin...</a><p>But
    I&#x27;m not that attached to it, I bought myself a new Nintendo 8-bit NES clone
    and a Sega 16-bit Megadrive from Aliexpress along with cartridges which contain
    hundreds of games, so I&#x27;m settled.<p>The Sega Megadrive console from Aliexpress
    scratches an itch dating back to the 90s. At the time, in the &quot;Russian&quot;
    flea market there was a strange exhibit of a console which looked 100% as a Sega
    Megadrive, it looked like this: <a href="https:&#x2F;&#x2F;i.ebayimg.com&#x2F;images&#x2F;g&#x2F;gl4AAOSwqh5h8div&#x2F;s-l1200.jpg"
    rel="nofollow">https:&#x2F;&#x2F;i.ebayimg.com&#x2F;images&#x2F;g&#x2F;gl4AAOSwqh5h8div&#x2F;s-l1200.jpg</a><p>But
    worryingly, the &quot;Russians&quot; were telling us that it works with yellow
    Famicom cartridges. And there were no other cartridges for sale anyway, so no
    way to verify if it&#x27;s some unholy bastard between NES and Sega. It cost double
    or triple of a regular Terminator2 and given that also cost a fortune at the time
    respective to my allowance money, I could only dream about buying it.<p>Found
    a few over the years on the Romanian olx ( <a href="https:&#x2F;&#x2F;www.olx.ro"
    rel="nofollow">https:&#x2F;&#x2F;www.olx.ro</a> ) site but wasn&#x27;t that curious,
