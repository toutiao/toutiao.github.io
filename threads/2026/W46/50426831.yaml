  text: "(2015). Connect to g+!<p>Very much a fan of this, of the 9p life. What times
    seeing a shell on the web with 9p access!<p>9p is very shell coded, as we see
    here, but I also really want to imagine going further. I want to imagine apps
    and systems that interoperate via small fine grained files. As a scripting environment,
    I really hope it&#x27;s easy and fun for programs and now llms to look at and
    alter state, to work other systems, and 9p feels like it is rallying around a
    core truth that&#x27;s there all the time just more of it, more files. Instead
    of descending beyond the os into deeper datastructures like toml.<p>A downside
    is that now you need lots of kernel syscalls to talk to all the files. That alas
    has not, historically, been performant."
