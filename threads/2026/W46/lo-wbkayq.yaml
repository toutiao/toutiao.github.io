    On 2026-07-20, a 150 MB binary file was mistakenly committed to the ports tree. The commit broke mirroring to GitHub, which rejects files larger than 100 MB, and added a file of questionable licensing to the repository history. On 2026-07-21, core@ decided to freeze the ports repository to limit the number of commits t
