    # FreeBSD Status Report Third Quarter 2026

    Here is the third 2026 status report, with 51 entries.

    This report is published a bit later than the last few, but we are finally here! The main reason for the delay is the recent PHP vulnerabilities issue: [https://reviews.freebsd.org](https://reviews.freebsd.org) had to be taken down for a little while, and unfortunately some reports were still being reviewed there. But the problem is now fixed and we are back on track. As this happened in October, do not expect to read about it in this status report however. This will be material for the last 2026 status report: do not miss it!

    Have a nice read!

    Lorenzo Salvadore, on behalf of Status Team

