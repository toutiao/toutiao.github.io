    These general expectations, where 'general' means 'among a highly engaged microcommentariat', require conspiracizing that Google has secret intentions other than the ones they state out loud. I think this is very silly because the intentions they declare are easily derived from known-in-advance incentives, and if you put me on the task of solving the problem they say they have to solve then this is exactly how I'd solve it too. Furthermore the alternative intentions (almost always 'it's about control') are not actually a recognizable business strategy for producing some sort of value; every time I discuss this with someone who believes it, they retreat to 'well their goal is something that incidentally results in more control', at which point it's no longer an explanation of why they would mess with sideloading any more.
    So just to state it all directly: Google wants to cut down on scams that exploit their users via apk downloads, where an app does something malicious that would have been caught by the Play Store. ('Malware still gets through!' Yes, but this is a numbers game.) This damages brand value, as Android is uniquely capable of fulfilling the scam pattern, but they are also facing regulatory pressure in various nations about it. ('Society shouldn't be concerned with this!' Society voted otherwise.) Warning screens don't work, settings toggles don't work, no matter what UI elements you throw in front of the user, the scammer on the phone has a magician's patter that puts you in an alternate universe where there is a totally normal reason why you should skip past them. The only thing that breaks a scam is to get them off the phone and break their ability to construct this reality. This is the purpose of the reboot and 24h wait - cooling-off periods are significantly effective at countering scams. Google allows apps to skip this flow that go through identity verification, even if they're not on the play store: even if scams slip through, revocable authorization means the scam can't continue after being reported, and they are not after individual scam artists but rather the scaled operations that create the numbers game. This looks, to me, like a sincere attempt to fulfill their corporate and political obligations regarding their median user without screwing their power user too hard in the process. If there is an additional motivation beyond what I have just described, it should come with positive evidence inconsistent with scam prevention.
