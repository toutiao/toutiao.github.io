  content: "# The need for at least a third option\n\nWritten by\n\n[Gonçalo Valério](https://blog.ovalerio.net/archives/author/gonalo)\n\nin\n\n[Technology
    and Internet](https://blog.ovalerio.net/archives/category/tech)\n\nRecently I
    started exploring and building things for Ubunbu Touch, and I intend to test a
    couple other mobile systems in the upcoming months.\n\n![](https://s.ovalerio.net/system/accounts/avatars/000/000/001/original/48a9fed1ac7ebebe.jpg)
    \n \n## Gonçalo Valério\n [dethos@s.ovalerio.net](https://s.ovalerio.net/users/dethos)
    \n \n \n \n\nJust got my first mobile device migrated from Android to Ubuntu Touch.\n\n
    \n\nI was expecting this Sunday project to take a few hours, but it didn't take
    even one. \U0001F44F \U0001F44F\n\n \n\nLet's see what it has to offer and how
    it holds up in the coming weeks.\n\n \n\n[#ubuntu](https://s.ovalerio.net/tags/ubuntu)
    [#ubuntutouch](https://s.ovalerio.net/tags/ubuntutouch) [#mobile](https://s.ovalerio.net/tags/mobile)
    [#mobileos](https://s.ovalerio.net/tags/mobileos) [#alternatives](https://s.ovalerio.net/tags/alternatives)\n\n
    \n \n \n [August 30, 2026, 19:40](https://s.ovalerio.net/users/dethos/statuses/117186155617490392)
    **1** boosts **2** favorites\n\nThe reason was that late last year, **I came to
    the realization that we really need a viable alternative to Android and iOS**.
    Before that, I still believed that using Degoogled ROMs such as [LineageOS](https://lineageos.org/),
    [GrapheneOS](https://grapheneos.org), or others would be enough. You would just
    install [F-Droid](https://f-droid.org/) or another alternative app store, enable
    the developer settings, and then you would be good to go.\n\n[Recent](https://www.androidauthority.com/google-not-killing-aosp-3566882/)
    [events](https://www.androidauthority.com/aosp-source-code-schedule-3630018/)
    [and the trends](https://news.ycombinator.com/item?id=50083130) we can observe
    tell that things are moving in the opposite direction, the direction of people
    (users and developers) increasingly losing control over their devices and their
    apps.\n\niOS was always closed, and Apple has more control over your device than
    you. Android was supposed to be the open alternative. Deep down in theory that
    is still true, in practice, Google is trying very hard to close that gap gradually.
    Users have been losing control for a while, and recently we found that to run
    software on your devices you will need [to pay for Google’s permission](https://developer.android.com/developer-verification).
    It gets worse; even paying you will need to follow a [cumbersome process to install
    software that can take 24 hours](https://www.androidauthority.com/google-android-sideloading-unverified-apps-new-rules-3650343/).\n\n[A
    movement was started to try to stop this,](https://keepandroidopen.org/en/) but
    I think it is a losing battle.\n\nThe above is completely the oposite of **the
    freedom we still have on our computers, where one can easily change the software
    their device uses with little control from the supplier.** You bought it with
    Windows, but you can replace it with Linux, FreeBSD, OpenBSD, ReactOS, Haiku,
    etc. And then run your or another person’s apps as you wish (the device is yours).\n\n**On
    mobile you are locked down, and they are trying to make it increasingly difficult
    to run anything else.** Even app developers and companies are incentivized to
    lock their apps to only these 2 systems for “security” reasons; [alternative ROMs](https://grapheneos.social/@GrapheneOS/117045625230764434)
    [are being blocked](https://discuss.grapheneos.org/d/35949-volkswagen-app).\n\nOur
    lives are now dependent on these mobile devices (almost everything is an app or
    requires an app); that’s a fact of modern times.\n\nAhead of the disenfranchisement
    of people without a smartphone or people with the old phone, we are close to witnessing
    a person being required to [**become a customer of two foreign companies to be
    a citizen in their own country**](https://github.com/eu-digital-identity-wallet/.github/issues/20).\n\nAnd
    I just don’t want to get started on all the digital sovereignty aspects of it.
    [They affect people](https://www.theguardian.com/law/2026/feb/18/international-criminal-court-icc-judges-trump-sanctions),
    [organizations](https://www.techspot.com/news/110095-international-criminal-court-replacing-microsoft-office-sovereign-eu.html),
    and governments, and it is clear that they nowadays are more important than ever.\n\n##
    What would an alternative look like?\n\nThe truth is that I’m not 100% sure, but
    I do know we need one. I guess it would be nice that it would be open-source (at
    least the core of it), with multiple stores or ways to provide/get software, and
    with a clear focus on interoperability.\n\nIt shouldn’t also be a copy of the
    existing ecosystems. This means a Windows Phone (belonging to Microsoft) wouldn’t
    be a real alternative, since it would also be closed and belong to a foreign big
    tech company.\n\nTiny and completely distinct systems, popping like mushrooms,
    wouldn’t also be a real alternative, since they would fail to get any sort of
    traction and attention. They might be interesting for hobbyists to experiment
    with, but nobody will invest in them if there aren’t sufficient people using and
    building for them.\n\nStarting from scratch is also very hard; we have a few examples
    of failed attempts.\n\nSo, our best bet is to put the weight of all the people
    who are uncomfortable with this situation behind something that already exists,
    that already has some community, that can be developed independently.\n\nThe best
    candidates I could find are:\n\n- [SailfishOS](https://sailfishos.org/)\n- [Nura](https://nura.eco/)
    (previously called PostmarketOS)\n- [Ubuntu Touch](https://www.ubuntu-touch.io/)\n\nThese
    will be the ones I will be exploring, testing, and perhaps contributing to. Regardless
    of my preference, I don’t mind which one wins; **I just think one of them needs
    to take off**.\n\n###### Fediverse reactions\n\n- [![Gonçalo Valério](https://blog.ovalerio.net/wp-content/uploads/activitypub/actors/2653/df7f3846f408a72c031ba03ca0e16c52.webp)](https://s.ovalerio.net/@dethos
    \"Gonçalo Valério\")\n- [![Corriol](https://blog.ovalerio.net/wp-content/uploads/activitypub/actors/3372/b201875e6e66f4d167778ed40393f456.webp)](https://mastodon.social/@tjdiaz
    \"Corriol\")\n- [![Ancient Sounds \U0001F509](https://blog.ovalerio.net/wp-content/uploads/activitypub/actors/3377/d293fadcfd00fbaf0301fc4bda7d039c.webp)](https://mastodonapp.uk/@ancientsounds
    \"Ancient Sounds \U0001F509\")\n\n- [![Ancient Sounds \U0001F509](https://blog.ovalerio.net/wp-content/uploads/activitypub/actors/3377/d293fadcfd00fbaf0301fc4bda7d039c.webp)](https://mastodonapp.uk/@ancientsounds
    \"Ancient Sounds \U0001F509\")\n\n- [![Gonçalo Valério](https://blog.ovalerio.net/wp-content/uploads/activitypub/actors/2653/df7f3846f408a72c031ba03ca0e16c52.webp)](https://s.ovalerio.net/@dethos
    \"Gonçalo Valério\")\n\n- ![crustaceanson.theshelf.top](https://blog.ovalerio.net/wp-content/plugins/semantic-linkbacks/img/mm.jpg)\n\n[Android](https://blog.ovalerio.net/archives/tag/android)[digital
    sovereignty](https://blog.ovalerio.net/archives/tag/digital-sovereignty)[mobile](https://blog.ovalerio.net/archives/tag/mobile)\n\n##
