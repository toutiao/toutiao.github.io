    Users have been losing control for a while, and recently we found that to run software on your devices you will need to pay for Google’s permission. It gets worse; even paying you will need to follow a cumbersome process to install software that can take 24 hours.

    This is false. If you are a developer, you pay Google to verify your identity, at which point you are free and clear and can publish signed apps; it is only for unverified apps that the developer-mode flow must be used. It is one or the other, not both. And if you are a user, you do not pay anything, but if you want to compile open-source software yourself, adb sideloading does not require anything new from you. (It is also misleading in that it implies each app takes 24h; it only takes 24h to enable 'yes I am very sure I want to install unverified apps' mode forever.)
