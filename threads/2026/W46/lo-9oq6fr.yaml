  author: nonagoninf
  text: |-
    Google Play Protect

    You mean Google Play Integrity (Play Protect is a malware scanner for apps installed on a phone). Also, the only thing that does not work on e.g. GrapheneOS is passing Play Integrity meeting device/strong integrity, because it uses remote attestation. It does pass basic integrity.

    which requires an encrypted bootloader, which means no more LineageOS or GrapheneOS either

    I think you mean locked bootloader. GrapheneOS does have a locked boot loader in the default install and has fully (cryptographically) verified boot. GrapheneOS fulfills all the requirements for passing Play Integrity meeting device/strong integrity. The only reason it fails is that Google refuses to enroll the GrapheneOS signing keys. They use it as a mechanism to force other (secure) Android versions out of the market.
