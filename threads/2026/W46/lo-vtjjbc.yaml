    \n \n  \n\nOn October 29, 2026, the Node.js team published [`v27.0.0-alpha.0.0.0`](https://nodejs.org/en/blog/release/v27.0.0-alpha.0.0.0).
    If you have been using Node.js for a few years, that version string alone probably
    made you do a double take. Where is the usual October `v27.0.0` Current release?\n\nNode.js
    27 is the first release to follow the new annual schedule. Under the old schedule,
    October brought a major release that reached end of life six months later without
    entering Long Term Support (LTS). October now starts a six-month Alpha phase,
    ahead of the `27.0.0` Current release in April 2027 and LTS promotion in October
    2027.\n\nIn this first Alpha, V8 moves from 14.6 to 15.6, adding `Iterator.zip()`,
    `Iterator.zipKeyed()`, `Iterator.prototype.join()`, `Iterator.prototype.includes()`,
    and `Math.sumPrecise()`. There is a promises API for `node:net`, along with async-iterable
    TCP servers. The Virtual File System (`node:vfs`) is now unflagged, the Permission
    Model gains `--allow-env`, and HTTP and memory defaults change too.\n\nWe’ll start
    with the JavaScript and Node.js APIs you can use in everyday code, comparing them
    with the older approaches. Then we’ll cover runtime changes and what to check
    before upgrading.\n\n## Quick Answer: what’s new in Node.js 27\n\nThe main additions
    in Node.js 27 so far:\n\n1. New `Iterator` helpers (`zip`, `zipKeyed`, `join`,
    `includes`) pair sequences, join their values into strings, and search them without
    collecting intermediate arrays.\n2. `Math.sumPrecise()` sums an iterable of numbers
    without rounding each intermediate addition.\n3. `node:net/promises` and async-iterable
    `net.Server` let you use `async`/`await` to set up TCP servers and sockets.\n4.
    Virtual File System (`node:vfs`) is unflagged, making in-memory file systems and
    `--vfs-load` available without `--experimental-vfs`.\n5. Core upgrades across
    `fs`, permissions, test runner, and `http`, including atomic temp files with `fs.mkstemp()`,
    `--allow-env`, Jest-style mock helpers, and a 65-second HTTP `keepAliveTimeout`.\n6.
    V8 15.6 and OpenSSL 4.1 update sorting and cryptography, and the default heap
    limit rises to 4 GB on an 8 GB machine.\n\nFor example, we can format a list of
    products and total their prices:\n\n_00-quick-answer/teaser.js_\n\n    const items
    = ['Keyboard', 'Mouse', 'Monitor']\n    \n    \n    const prices = [129.99, 49.99,
    349.95]\n    \n    \n    \n    \n    const lines = Iterator.zipKeyed({ item: items,
    price: prices })\n    \n    \n      .map(({ item, price }) => `${item} ($${price.toFixed(2)})`)\n
    \   \n    \n      .join(', ')\n    \n    \n    \n    \n    console.log(`${lines}
    -> Total: $${Math.sumPrecise(prices)}`)\n    \n    // Keyboard ($129.99), Mouse
    ($49.99), Monitor ($349.95) -> Total: $529.93\n\nIf you want to experiment locally,
    [check your current Node.js version](/blog/checking-node-js-version/) before running
    the snippets below.\n\n## New Iterator superpower: `zip`, `zipKeyed`, `join`,
    and `includes`\n\nThis is the part of the release I’m most excited about. I love
    seeing how far we can push streams, iterators, and generators. Our article on
    [JavaScript async iterators](/blog/javascript-async-iterators/) should give you
    an idea of what I mean.\n\nIn [What’s new in Node.js 26](/blog/whats-new-in-nodejs-26/),
    we used `Iterator.concat()` to consume multiple iterables one after another. Node.js
    27, through V8 15.6, lets us consume them side by side, pairing values at the
    same position.\n\n### Pairing sequences lazily with `Iterator.zip()`\n\nSuppose
    you are checking a weather forecast against the temperatures recorded over the
    same four days. The predictions come from your model, while the actual values
    come from observations. To calculate each day’s error, you need to pair the values
    at the same position. Both sequences must cover the same days in the same order.\n\nIn
    Node.js 26 and earlier, if both sequences were arrays, you would typically use
    `.map()` with an index lookup:\n\n_01-iterators/iterator-zip-old.js_\n\n    //
    Node.js 26 and earlier\n    \n    const predicted = [18, 21, 20, 23]\n    \n    \n
    \   const actual = [19, 20, 22, 21]\n    \n    \n    \n    \n    const errors
    = predicted.map((prediction, i) => actual[i] - prediction)\n    \n    \n    console.log(errors)
    // [1, -1, 2, -2]\n\nThat works well for arrays. But what if observations come
    from a generator, or your model returns an iterator of predictions? Index lookups
    won’t work on those inputs, and converting them to arrays means loading both sequences
    into memory first.\n\nIn Node.js 27, `Iterator.zip()` takes an iterable of iterables
    and returns a lazy iterator of pairs. We can calculate the errors with the same
    pipeline whether the inputs are arrays or iterators:\n\n_01-iterators/iterator-zip.js_\n\n
    \   const predicted = [18, 21, 20, 23]\n    \n    \n    const actual = [19, 20,
    22, 21]\n    \n    \n    \n    \n    const"
