    Yes. Current big project is async versions of iterator helpers, which are going to support concurrency and thus are much more complicated. Other than that I am working on

    uncoupling private fields from class syntax
    pulling in AbortController (shouldn't affect users, but lets JS proposals support cancelation)

    ultimately the goal is something like structured concurrency by composing AbortController with the using syntax


    and then a bunch of stuff queued I'd like to get to, in many cases things other delegates have started but haven't had time to work on:

    Array.prototype.sortNumeric or some other easy way to get that behavior
    destructuring private fields
    seeded random
    TypedArray .equals
    a helper to turn Array<Promise<T>> into AsyncIterator<T> by racing all the promises, like Python's asyncio.as_completed
    dedent
