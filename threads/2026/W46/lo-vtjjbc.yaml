    Two of these are mine! (Math.sumPrecise and Iterator.prototype.join.)
    sumPrecise is fun; it turns out that maximally precise summation can be done reasonably efficiently. Originally the plan was to do a naive Math.sum and accept the error introduced by intermediate rounding but it's not that much slower to do it right so we might as well. I wanted to still call it Math.sum but engines pushed back because it's still somewhat slower, alas.
