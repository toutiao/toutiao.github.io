  author: Onavo
  text: There&#x27;s a lot of use cases that are not &quot;commercially sensitive&quot;
    that would require data center level privacy. E.g. a good percentage of academic
    research and experimentation, long running &quot;boilerplate processing&quot;
    for monitoring logs for e.g. a bird watching system or large scale web crawling
    where the individual website itself is mostly public. There are also use cases
    where the data itself is useless without other data to correlate. E.g. many log
    analytics use cases, if you are missing the main database data itself then the
    logs have zero value when intercepted. There are also use cases where you are
    doing general industrial level hotdog&#x2F;not hotdog classification where unit
    economics is the most important and there&#x27;s no real value to privacy e.g.
    on a factory floor (though sabotage is a bigger risk here).
  score: 0
