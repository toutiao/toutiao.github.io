  text: '&gt; I assume this project is all vibe-coded?<p>You know what happens when
    you assume, right?<p><a href="https:&#x2F;&#x2F;github.com&#x2F;duxlabs-dev&#x2F;dux-shell?tab=contributing-ov-file#generative-ai"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;duxlabs-dev&#x2F;dux-shell?tab=contributing-ov...</a><p>Quoting
    in part from that:<p>&gt; Using an LLM to help write code is fine. Submitting
    its output unread is not.<p>&gt; * You are responsible for every line you submit.
    You have read it, tested it, and can explain it in review.<p>&gt; * Say in the
    PR when a meaningful part of the code was AI generated.<p>&gt; * Write PR descriptions,
    issues, and comments yourself. No AI-written or AI-rewritten text. A few plain
    sentences in your own words beat a page of generated summary. PRs and issues with
    AI-written text get closed without review.<p>&gt; ...<p>&gt; * PRs that read like
    unreviewed output, with narrating comments, invented APIs, or style that ignores
    the file they are in, get closed without review.<p>That looks <i>very clearly</i>
    non-vibe coded to me.  (Also, it&#x27;s a mature project with 79 releases over
    the last year and a bit, and 321 contributors.)<p>As much as I respect the abilities
    of agentic coding LLMs, I don&#x27;t <i>think</i> we&#x27;re yet at the point
    that you could vibe-code a novel Wayland DE.  This is not trivial stuff!'
