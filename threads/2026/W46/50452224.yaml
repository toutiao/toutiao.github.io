  author: tancop
  text: I would do it illegally right now if I had the hardware resources. The article
    is 3 extremely vague pages but from the photo description it looks pretty simple.<p>You
    make a diffuse light only version of the image with one trained NN, estimate a
    depth map from it, take the delta from diffuse to original image and reverse raytrace
    it with Mitsuba to get the environment map, use differentiable rendering to optimize
    the environment map and make a new point light map.<p>You&#x27;re left with a
    3D environment where you can move the lights around and call Mitsuba again to
    get a physics based render. That&#x27;s the whole innovation. I guess the secret
    sauce is in the optimization algorithm, but it could just be basic gradient descent.
