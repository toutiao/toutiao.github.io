  author: rebane2001
  text: I only count it as using AI when it&#x27;s an intentional choice to use it.
    I disable AI features everywhere possible, but if something gets forced down my
    throat against my will I don&#x27;t count it as me using it.<p>For example, if
    I need to talk to the support of a company and I get throws into a chatbot chat,
    I will still use it, though mostly to try to get a human to talk to me. If a website
    or app decides to show me an AI summary, I ignore it.<p>For programming and writing,
    I use Sublime Text without a language server. For talks, I use my own slideshow
    software. For most other tools, provided they don&#x27;t expose a security-critical
    surface, I have older versions saved that I use.<p>There are some things I use
    that some people might technically consider AI but I don&#x27;t, such as search
    engines (outside of AI summaries), smartphone keyboards, machine translation,
    and NPCs in video games. I think an easy way to differentiate what counts as modern-day
    AI for me is to see if said thing was around 10 years ago.<p>One exception for
    where I do use AI is when I need to do so to report on it. For example, I used
    the Google AI Overview while creating this blog post to see what it says about
    me, obviously. I would not have been able to report on it otherwise.
