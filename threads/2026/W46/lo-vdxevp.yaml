    Doing it only for projects The Consensus picks is good and bad. It's bad because it doesn't index the world. But mostly it's good, if you trust our (my) editorial judgement, because all your searches only go against important (and I try to be expansive here) projects. Which makes it sort of more tenable to do meaningful exhaustive search. Unlike GitHub you don't have to pick which projects to search for, since we've picked them for you. (And if anyone asks I'd probably add whatever projects we're missing, as happens over time anyway.)
