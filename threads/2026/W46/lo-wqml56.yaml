    For the anecdote, I had the same experience 22 years ago. My blog was quite young, and was propulsed by Dotclear (self-hosted, there was no Dotclear provider at the time)

    FWIW, I had this happen to my blog back in the early 2010s, too. As far as I understood what was going on: back then, my blog was way more popular, and I had a half dozen posts or so that achieved genuine virality within tech. Not every post went big or anything (this predated Twitter, so I'd be mixing random little personal things in with the heavy-hitting tech ones), so viewership was inconsistent. This particular copycat would grab just the ones that were viral, then rehost them on their blog and share the link with an attempt to get their blog to be the canonical source for those articles. If that happened (it happened to one, which is how I found them in the first place), causing a traffic spike to their blog, they'd then cover that specific article with more ads than the Vegas strip. A lot of destroying my cred and copying my stuff so they'd get a few days of ad impressions.
    While I had full proof, I unfortunately couldn't actually do anything directly about it, because they were on a hosting service in some random country we didn't have extradition or other legal agreements with. But I was able to convince Google that the site was scraping my content, and ultimately got a few of them dropped from the index. Once that happened enough times, they stopped copying my blog.
