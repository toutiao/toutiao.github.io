  text: AVIF supports a higher resolution at 2^32-1 pixels per dimension, vs JPEG-XL&#x27;s
    2^30-1 pixels. But really it doesn&#x27;t matter since something is going to impose
    an arbitrarily smaller limit on either before letting you try to allocate more
    RAM than any computer can address. Yes, plenty of comparison websites confuse
    AV1 limits (sometimes AV1 <i>profile</i> limits!) with AVIF limits.<p>For arbitrary
    planes, AVIF calls them auxiliary images. Unless you mean encoding non-RGB data
    to start with like how DNG uses JPEG-XL. At which point you&#x27;re outside the
    scope of any standard interpretation of JPEG-XL data.
