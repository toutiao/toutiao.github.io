  author: arghwhat
  text: The assumption is that a file is read more than it is written. If you spend
    less time and power compressing the file, you will spend more time and power delivering
    the file, and often not save anything on the decompression side.<p>If you want
    to optimize the user-facing side, you might want to pick HEIC instead to optimize
    for commonly available HEVC&#x2F;h.265 hardware encoding capabilities, or to be
    selective instead and pick AVIF when AV1 capabilities are present.<p>AVIF is notoriously
    CPU-intensive to compress without acceleration, but assuming you pay for storage
    and&#x2F;or delivery, the results are impressive. JPEG-XL and HEIC also do very
    well. JPEG really shouldn&#x27;t be used unless you&#x27;re trying to target devices
    that can only read JPEG.
  score: 0
