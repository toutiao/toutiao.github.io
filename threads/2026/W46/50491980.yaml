  text: |-
    Cool! (And massive thanks for all the great work you and your team do!) An idea I had was to &quot;finetune&quot; the KV cache compression to a dataset that represents what data one uses - but sliding window kinda achieves that out of the box, neat!<p>Some more ideas, most if not all were likely tried out already:<p>- add a decay to the KV cache: Each KV cell has an age, and if not read for a long enough time; we can throw that cell out and free that memory? (as I understood, KV cache stores intermediate results that can be restored on the fly - so if we throw out a cell that will be used in the future; it can just be recomputed)<p><pre><code>  - could expand on that: If we &quot;revive&quot; a KV cell that we killed; we could decrease it&#x27;s likelyhood to get killed again...
    </code></pre>
    - could we dynamically learn what input leads to what KV cache usage? this would be a start time thing - maybe we could preemptively set many KV cells to 2,3,4 bit and just bump their accuracy once accessed at least once? (this is related to the sliding window approach I think)<p>- last; I think probabilistic data structures lurk somewhere around the edges here and wait for their chance to shine... ;D &quot;need to storage big amount of information in a set AND have a fast way to verify&#x2F;falsify whether set membership (i.e. KV cell in the KV cache&quot;) was correct&quot; seems to be applicable; but I don&#x27;t have a clue how! And I am a huge fan of probalistic datastructures in general; so I might be a victim of &quot;if everything is a hammer, ...&quot; ;)
