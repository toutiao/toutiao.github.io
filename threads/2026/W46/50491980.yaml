  content: "For the complete documentation index, see [llms.txt](https://unsloth.ai/docs/llms.txt).
    This page is also available as [Markdown](https://unsloth.ai/docs/models/qwen3.8.md).\n\nQwen3.8-27B
    is a 27B parameter dense model Qwen, featuring **vision** and reasoning capabilities,
    a **256K context** window, and runs locally on **17GB RAM/VRAM** setups. Qwen3.8
    excels at agentic coding, vision and chat tasks, and can now run via Unsloth GGUFs,
    NVFP4 and [Unsloth Desktop](/docs/models/qwen3.8#run-qwen3.8-in-unsloth-desktop).\n\n**Nov
    11 Update:** Qwen3.8-27B GGUFs now use [Unsloth Dynamic V3.1](/docs/basics/dynamic-3.0-ggufs)
    which improves average accuracy by 5-10% accuracy at comparable sizes including
    Terminal Bench, DeepSWE and more benchmarks. We're working on an even better version
    of Dynamic quants which will be applied to **Qwen4** and future models.\n\n[Run
    Qwen3.8 Guide](/docs/models/qwen3.8#run-qwen3.8-guide)[Download Unsloth](https://unsloth.ai/download)\n\nThank
    you Qwen for day zero access. Unsloth quants also include:\n\n- \n\n**Developer
    Role Support** for agentic tools like Codex\n\n- \n\n[MTP enabled](/docs/models/mtp)
    for fast inference\n\n- \n\n**Tool calling:** Improved parsing nested objects
    to make tools succeed more\n\nUnsloth quants: [Qwen3.8- **27B** -GGUF](https://huggingface.co/unsloth/Qwen3.8-27B-GGUF)\n\n###
    Dynamic V3.1 Update (November 11th 2026)\n\nWe're excited to release new Qwen3.8-27B
    GGUFs using our updated [**Unsloth Dynamic**](https://unsloth.ai/docs/basics/dynamic-3.0-ggufs)
    **V3.1 (preview) algorithm** which improves Unsloth quants by 5-10% accuracy at
    the same size on most benchmarks and is the best in class for most tasks including
    coding, agentic workloads and general chat.\n\nMost quants from 2bit until 6bit
    are updated. We found 3bit UD3 quants to do on par with UD3.1, so we do not update
    them. We are actively working on making all quants better!\n\n ![](https://unsloth.ai/docs/~gitbook/image?url=https%3A%2F%2F3215535692-files.gitbook.io%2F%7E%2Ffiles%2Fv0%2Fb%2Fgitbook-x-prod.appspot.com%2Fo%2Fspaces%252FxhOjnexMCB3dmuQFQ2Zq%252Fuploads%252FWf4zRxz4iskzXZcBUQYq%252Ffour%281%29.png%3Falt%3Dmedia%26token%3D0e7bc8b1-6a96-4978-bcbe-227d69705eb2&width=768&dpr=3&quality=100&sign=7ed088405d214652ffd92dfa31a55189&sv=3)\n\n**We
    ran agentic benchmarks including Terminal Bench 2.1, DeepSWE v1.1** , and general
    benchmarks like LiveCodeBench v6, GPQA Diamond, MMLU-Pro, AIME25 and many others.
    We used 256K context lengths for all agentic benchmarks, and 128K for the rest.
    We followed the same methodology for Qwen3.8-27B as [DeepSeek-V4.1-Flash](/docs/models/deepseek-v4.1-flash)
    and [Qwen3.8-Flash-Next](/docs/models/qwen3.8-next) which also utilized our V3.1
    preview algorithm.\n\n ![](https://unsloth.ai/docs/~gitbook/image?url=https%3A%2F%2F3215535692-files.gitbook.io%2F%7E%2Ffiles%2Fv0%2Fb%2Fgitbook-x-prod.appspot.com%2Fo%2Fspaces%252FxhOjnexMCB3dmuQFQ2Zq%252Fuploads%252FAJWlEwcA3LRXIky6AN34%252Fall_no_embedding%281%29.png%3Falt%3Dmedia%26token%3D205c8068-8815-402a-aacf-aa877915be1b&width=768&dpr=3&quality=100&sign=201f7193d181d6a46bf3d4a6f1e4d9b2&sv=3)\n\n####
    Dynamic V3.1 Full Breakdown\n\nClick below to see full details of benchmarking
    and more:\n\nClick to expand Full details and breakdown\n\n#### Exllama-v3 considerations\n\nTo
    compare GSQ-RCO and Exllama-v3, we had to exclude the token embedding layer from
    the x axis, as Exllama-v3 uses BF16 for it.\n\nIf you consider the full download
    size and total RAM usage for Exllama-v3, then adding the BF16 embedding table
    and including all embedding sizes changes the plots. Our main plots's x axis removes
    the embedding layer sizes from all quant providers. **However on pure RAM usage
    and disk space usage vs accuracy, the below plot is the true reflection of actual
    usage.**\n\n ![](https://unsloth.ai/docs/~gitbook/image?url=https%3A%2F%2F3215535692-files.gitbook.io%2F%7E%2Ffiles%2Fv0%2Fb%2Fgitbook-x-prod.appspot.com%2Fo%2Fspaces%252FxhOjnexMCB3dmuQFQ2Zq%252Fuploads%252FOAyvQGNinlCjqTfvInzE%252Fall_file_size%281%29.png%3Falt%3Dmedia%26token%3D71d6a14b-4dd5-4629-9011-c24145c16b41&width=768&dpr=3&quality=100&sign=3beec9c325f9b9b78a7ee83a00123276&sv=3)\n\nWe
    have not investigated why Exllama-v3 keeps token embeddings in BF16, but as the
    lm\\_head is still quantized heavily, the embedding layer might have \"absorbed\"
    most of the quantization damage from it. We would be glad to benchmark new Exllama-v3
    non BF16 token embedding quants like using 8-bit for example, and see if benchmarks
    change.\n\n#### GSQ-RCO results are misleading\n\nFor LiveCodeBench, GSQ-RCO showed
    Unsloth UD3 quants doing consistently worse than ISTA's. However we **found the
    opposite - UD3 quants (our OLD quants) do better than ISTA on LCB on all sizes
    except the smallest.** UD3.1 further improves on LCB as well.\n\nWe approximate
    that GSQ-RCO used a context budget of 96K, as that best fits the data for the
    runs we have. At 96K, GSQ-RCO does somewhat do better than UD3, but at 128K, UD3
    does much better.\n\n ![](https://unsloth.ai/docs/~gitbook/image?url=https%3A%2F%2F3215535692-files.gitbook.io%2F%7E%2Ffiles%2Fv0%2Fb%2Fgitbook-x-prod.appspot.com%2Fo%2Fspaces%252FxhOjnexMCB3dmuQFQ2Zq%252Fuploads%252Fi7fxu1dfYubjTRlaplQd%252Fq27_lcb_auc_vs_budget.png%3Falt%3Dmedia%26token%3D8d364f9a-dcab-4f03-b08a-b1dd149e1ca6&width=768&dpr=3&quality=100&sign=974211283f39875acd94e1f87a17f78f&sv=3)\n\nOn
    another benchmark, for ISTA GSQ-RCO's AIME25 benchmarks, their quants reach 100%,
    100%, 100% and 96.7% accuracy recovery. And they said our quants do worse.\n\nThrough
    out investigations, we estimate ISTA only did 1 trial - we did 14 trials, and
    we show on average the recovery rate is 93% to 96% - not 100% accuracy recovery.
    **And in fact our UD3 old quants do BETTER on average than their quants on 14
    runs vs 1 run of theirs** , so we draw the opposite conclusion if you run the
    trials more.\n\nWe also checked and graded our answers using Math Verify [Dynamic
    3.1 GGUFs](/docs/basics/dynamic-3.0-ggufs/dynamic-3.1-ggufs) and also LightEval
    and we find exactly the same conclusions. We also tried greedy decoding (temperature
    of 0), and this could not get the 100% accuracy recovery ISTA found across multiple
    greedy runs, as GPUs themselves are non deterministic. That is why you benchmarks
    should be run multiple times. Greedy decoding is also not representative of real
    world use cases.\n\nWe also checked 96K (which is most likely ISTA's budget) and
    128K, and our quants still do on average better.\n\n ![](https://unsloth.ai/docs/~gitbook/image?url=https%3A%2F%2F3215535692-files.gitbook.io%2F%7E%2Ffiles%2Fv0%2Fb%2Fgitbook-x-prod.appspot.com%2Fo%2Fspaces%252FxhOjnexMCB3dmuQFQ2Zq%252Fuploads%252Fbh6wGXtOMWkzqRnfoova%252Fq27_aime25_auc_vs_budget.png%3Falt%3Dmedia%26token%3D46081d81-dcf1-4d6f-b30e-6033d33433e6&width=768&dpr=3&quality=100&sign=98e94fc4138ffa221b6056a388128583&sv=3)\n\n####
    KLD of Unsloth v3.1 vs v3\n\nWe did KLD for multiple domains for Unsloth UD3.1
    quants and UD3 quants - we reduce KLD throughout most quants and most domains
    - we did not replace the 3-bit ones, as we found UD3 to do mostly great, and the
    accuracy recovery on benchmarks was not significant enough with UD3.1 to warrant
    an update, so we did not update them.\n\n ![](https://unsloth.ai/docs/~gitbook/image?url=https%3A%2F%2F3215535692-files.gitbook.io%2F%7E%2Ffiles%2Fv0%2Fb%2Fgitbook-x-prod.appspot.com%2Fo%2Fspaces%252FxhOjnexMCB3dmuQFQ2Zq%252Fuploads%252FKjLQfsZa7dpm50lm4487%252Fq27_kld_v3_vs_v31%281%29.png%3Falt%3Dmedia%26token%3D5bda64f6-c756-4709-8f8c-15b60761e7f2&width=768&dpr=3&quality=100&sign=705ad9e088f5ea35653cf034dc3cb18e&sv=3)\n\n####
    Benchmark details and setups\n\nWe follow the same procedure for all benchmarks
    as for Qwen3.8-Flash-Next, DeepSeek-V4.1-Flash as well as discussed in [Dynamic
    3.1 GGUFs](/docs/basics/dynamic-3.0-ggufs/dynamic-3.1-ggufs). We used temperature
    1.0, top\\_p 0.95, top\\_k 20, min\\_p 0, no presence or repetition penalty, preserve\\_thinking
    and xhigh reasoning for Qwen3.8-27B.\n\n### ⚙️ Usage Guide\n\n#### Qwen3.8-"
