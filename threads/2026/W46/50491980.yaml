  author: danielhanchen
  text: Yes! One method is KV cache compression to 4-bits - llama.cpp does have hadamard,
    but it&#x27;s not very accurate - we were researching if 4-bit KV cache can be
    used with a sliding window of 1024 for example of 8-bit KV cache<p>So we can have
    a 4bit KV cache, but the most recent N tokens can be 8bit - we found accuracy
    improves 2x!
