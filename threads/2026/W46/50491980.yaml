  author: danielhanchen
  text: Oh yes I think I saw bottecap&#x27;s work - very interesting!<p>For Qwen3.8-Flash-Next
    (I know not 27B haha), we actually cut reasoning by up to 50% esp for the small
    quants - we found quantizing models naively coincidentally also made them more
    verbose, as it would &quot;correct&quot; itself during the reasoning process.
    We managed to make the extra token usage of lower bit quants now only be +5% vs
    BF16 vs +50% extra from other quants.<p>27B should have similar benefits, but
    it&#x27;s less as it&#x27;s a smaller model!
  score: 0
