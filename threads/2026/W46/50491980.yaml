  author: danielhanchen
  text: Yes the decay is not a bad idea - I think there were some research papers
    on this but I forgot haha - sparse attention partially does this, where if beforehand
    we know softmax(QK^T&#x2F;sqrt(d)) will have a 0 cell, we can skip the calculation
    of QK^T for that cell (ie that KV row has 0 weight)<p>The main issue though is
    Q and K still need to be whole, so cannot be compressed. However one can do some
    sort of KV cache &quot;double cache&quot; where we can offload KV rows that are
    not that attended to - so the &quot;cold KV rows&quot; to RAM and or SSD, and
    the &quot;hot KV rows&quot; are in VRAM - this might work, but sounds complex
  score: 0
