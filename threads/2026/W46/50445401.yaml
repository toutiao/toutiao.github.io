  author: amiga386
  text: This isn&#x27;t true. Road design imparts a psychological effect on the driver,
    and in some countries this is in their design standards. See for example the UK&#x27;s
    <i>Manual for Streets 1</i>, 7.4 &quot;Achieving appropriate traffic speeds&quot;
    (<a href="https:&#x2F;&#x2F;assets.publishing.service.gov.uk&#x2F;government&#x2F;uploads&#x2F;system&#x2F;uploads&#x2F;attachment_data&#x2F;file&#x2F;341513&#x2F;pdfmanforstreets.pdf"
    rel="nofollow">https:&#x2F;&#x2F;assets.publishing.service.gov.uk&#x2F;government&#x2F;uploads&#x2F;...</a>)<p>You
    can slow people down by making lanes thinner, adding in-road obstacles or chicanes,
    removing road markings to take drivers out of their complacency and get them actively
    thinking, and at the slowdown at the end of a road, using tightly packed lines
    or rumble strips to give the <i>impression</i> of speed, to which they naturally
    react by slowing down. You also stagger junctions, and put in bends, rather than
    have a fast road run directly onto a slow one (or vice-versa) and then say to
    yourself &quot;WELL, I DID MY PART, I MADE A NICE FAST ROAD SLAM RIGHT INTO A
    SLOW ONE, AND IT&#x27;S ENTIRELY ON THE DRIVERS TO NOTICE THAT STOP SIGN AND SLOW
    DOWN IN TIME. NOT MY PROBLEM IF THEY DON&#x27;T&quot;<p>Naturally, if you do the
    opposite, and build a wide, long, straight road with few visual indications of
    how fast people are going, even the most conscientious will likely zone out and
    start unintentionally speeding up. It&#x27;s simple human psychology.<p>You can&#x27;t
    be like &quot;human psychology&#x27;s not a thing, I&#x27;ll judge every single
    human like they&#x27;re completely omniscient and perfectly rational&quot;, because
    there are millions of people who unintentionally do things they don&#x27;t rationally
    want to do, every single day, because they were psychologically manipulated. Use
    road design to manipulate them into doing the right thing, rather than manipulate
    them into doing the wrong thing and then directly take money from them. That&#x27;s
    a <i>dark pattern</i>.
