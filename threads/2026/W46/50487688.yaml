  author: EvanAnderson
  text: "&gt; But behind the scenes it is all just still Exchange which if anyone
    has experience managing, its a complex nightmare of code going back decades. With
    all sorts of Active Directory requirements and everything else. The mail database
    system it uses, and probably still used in Office 365 (Office 363 today?) is also
    a nightmare.<p>I hear this so much, but this hasn&#x27;t been my experience. My
    experience goes back to Exchange 4.0. I&#x27;ve run every version of Exchange
    in production. Am I the only person who has a favorable impression of the product?<p>Exchange
    and Active Directory are easily my favorite MSFT products. I&#x27;ve always wished
    they would port them to Linux, even though I know that OS dependencies make that
    a non-starter (though they surprised me w&#x2F; SQL Server for Linux).<p>I&#x27;ll
    concede that the the biggest Exchange environment I ever ran was around 1,000
    mailboxes. I&#x27;ve never seen how it fails in really large environments. I was
    also fortunate that I only ran the earlier versions (pre-2013) in sub-500 mailbox
    environments.  In those settings, though, I found it worked well and wasn&#x27;t
    bad to administer.<p>It was very reasonable to use in small business environments,
    too (sub-100 mailboxes). I put a lot of little Exchange 2003 boxes out in small
    offices. It plugged-away very effectively.<p>Yes-- there were updates here-and-there
    that had issues, for sure. By-and-large it was a stable and predictable product.<p>I
    always tried to be mindful of maintaining free disk space, following MSFT&#x27;s
    recommendations for speeds-and-feeds for I&#x2F;O, and running on solid hardware
    (ECC memory, redundant power, UPS). I feel like I would have had more problems
    if I&#x27;d scrimped on that stuff, for sure, but I was unwilling to let Customers
    cheap-out.<p>With Exchange 2019 and high-availability (database availability groups)
    I was easily able to do zero-downtime maintenance. That &quot;big for me&quot;
    Exchange Customer I worked with had more downtime in the last 24 hours than they
    did the entire time they used Exchange 2019 in production.<p>I haven&#x27;t seen
    the code, so I can&#x27;t speak to the &quot;nightmare of code&quot;. Large parts
    of it were ported to the .NET Framework in between the 2010 and 2013 releases.
    The 2013, 2016, 2019, and current Subscription Edition releases appear to be an
    evolution of the codebase with no signs of major rewrites. I question how much
    pre-2013 code is even present in the codebase anymore.<p>I dunno. My experience
    just hasn&#x27;t been that bad. I don&#x27;t want to be an apologist for MSFT.
    I&#x27;ve never fully gotten over the suspicion I have for their motives going
    all the way back to the Halloween documents. I don&#x27;t like how they&#x27;re
    forcing everyone to hosted offerings and killing their on-prem products. I&#x27;ve
    been pleased with the value my Customers realized from Exchange."
