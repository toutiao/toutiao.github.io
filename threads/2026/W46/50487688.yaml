  author: EvanAnderson
  text: A lot of the bad situations I helped bail other contractors out of, when it
    came to Exchange, related to disk full conditions, a lack of understanding how
    transaction logging in the database worked, and database inconsistencies brought
    on by hardware RAID controller issues or hard power-offs. Very nearly all of my
    ugly ESEUTIL and ISINTEG experience came from people not respecting the product&#x27;s
    storage needs.<p>Sysadmins who were used to running file servers and thought Exchange
    was the same thing were the problem. A DBA was actually more apt to understand
    the product&#x27;s storage needs because it wasn&#x27;t wholly dissimilar from
    the RDBMS they supported.
