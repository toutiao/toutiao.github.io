  author: camgunz
  text: 'I would guess, uncharitably, you would surmise your downvoters are just navel-gazing
    engineers who, given their druthers, would endlessly polish some irrelevant bauble
    rather than ship something genuinely useful to customers. But good products can
    only extend so far from their foundations.<p>The core Dropbox idea was clearly
    good. But in order for it to really be a multi-billion dollar business it needed
    a platform that would support lots of users. Postgres: a pretty good idea. But
    it needs an underlying OS that provides things like processes and storage. iPhone:
    cool idea, made possible entirely by hard won engineering gains in processing
    efficiency, battery tech, touchscreen tech, cellular network buildout, etc etc.<p>Not
    literally everything can be product&#x2F;profit thinking. There is a lot of engineering
    work underlying great products that yielded tremendous profits.'
