  author: swatcoder
  text: Unfortunately, this is one of those HN submissions where people are just knee-jerking
    to the title without even checking what the submission is. Of course, it doesn&#x27;t
    help that it&#x27;s a long video conference presentation with a &quot;handout&quot;
    that&#x27;s beautiful but a little hard to read through on its own.<p>However,
    for those that are actually curious, the submission is not itself a cynical or
    dismissive take. The question in the title is interrogative and contextual, not
    rhetorical and universal, and the presentation tries to break down some of the
    bottlenecks and challenges that are leading to AI integration having a different
    impact on software engineering output than some people might expect.<p>Rather
    than suggesting those bottlenecks&#x2F;challenges are universal or intractable,
    it just enumerates some of them and presents some survey analyses on how widely
    encountered they are.<p>It&#x27;s actually pretty interesting and the kind of
    thing that engineers and those who work with them want to be reflecting on, so
    that they can better engineer their usage and processes <i>around</i> AI itself.
