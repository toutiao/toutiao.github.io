  author: xyzzy123
  text: Maybe? But I don&#x27;t see why _necessarily_; your efforts can compound but
    each attacker will mostly be repeating work that the others already did. Defenders
    also operate white-box with instrumentation and relatively speaking have a lot
    more to spend. Consider how much attackers can extract from defenders (less than
    the defender&#x27;s loss) and what this implies about rational spend.<p>I think
    there are a lot of unanswered questions like &quot;is software security possible&quot;,
    in the sense of, will there be a long tail of bugs left for second tier models
    after frontier models have picked over everything?<p>Most predictions also sort
    of assume that the IT landscape looks similar to the way it does today. But there
    are a lot of possible futures, e.g. a more feudal model where smaller orgs without
    strong security capability shelter in the big clouds, &quot;protected&quot; by
    amazon, google, microsoft level resources etc.
