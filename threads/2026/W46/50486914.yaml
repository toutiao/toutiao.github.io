  author: NortySpock
  text: 'I&#x27;ve been getting ok results from having the LLM research and write
    out a single planning document per task, with code examples and unit tests. I
    collaborate with the LLM on the planning document review, tweaking the architecture
    &#x2F; tests that it plans to build. I iterate with the model on the planning
    document. Only once that document is polished and leaves little room for interpretation
    do I set a (possibly smaller) model on the task of writing the code change and
    running the unit tests. I&#x27;ll come back and read the diff later, possibly
    it still needs minor corrections but far fewer than if I had let the LLM run without
    a detailed plan.<p>While that&#x27;s running, I can, in a second window, collaborate
    with an LLM on the next plan...<p>Edited to add: architecture-wise I have only
    done this on smaller scripts, and I encourage and sometimes enforce &quot;pure
    functions, that act on data, with no internal state&quot;, and then if I need
    state it would go in a specific typed structure, not a object that mixes state
    with functions.'
