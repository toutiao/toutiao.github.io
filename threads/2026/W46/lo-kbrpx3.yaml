    Why isn't there just like a VPN between your car and whatever devices you want?

    I think "just" is doing a lot of work here. Neither the car nor your phone or laptop probably have static global IP addresses, so at minimum you need a server (ran by the manufacturer?) for discovery and likely NAT traversal soo. Then there's enrolling new devices. Can I do that by pressing stuff on my phone? My car? Does either work? There are interesting cryptography and UX implications for all of these. Before long, you have a buggy reimplementation of half of tailscale. It's far less complexity to have everyone just talk to the manufacturers servers.
