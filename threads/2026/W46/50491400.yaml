  author: sho
  text: "&gt;  the main reason is that LLMs are generators, they like to generate
    code where code removal or reduction would solve the problem<p>Don&#x27;t over-index
    on this choice of words. LLMs can just as easily <i>generate</i> a diff that removes
    or refactors code, they don&#x27;t have any intrinsic &quot;preference&quot; to
    always add more code, unless it&#x27;s been trained into them.<p>A lot of the
    early training had concentrated on &quot;wow factor&quot; one-shot style demoable
    use cases, where the models indeed ended up with a tendency to assume they were
    in a &quot;produce something new for me right now&quot; situation and often or
    always started churning out additional code, even without all relevant information.
    As training regimes improve, and as customer demand evolves, this is changing,
    and the latest big models place a lot more emphasis on maintenance tasks - still
    not enough, but it&#x27;s at least in the mix. As they mature, I&#x27;d expect
    the models&#x27; &quot;instinct&quot; to gradually align with what everyone&#x27;s
    idea of a senior software engineer is, taking time to figure out if they can simplify
    and refactor rather than always adding more.<p>It&#x27;s a new field, it will
    take time to get it right, but I don&#x27;t doubt it will eventually be right.<p>&gt;
    Because they are trained on mediocre code that is the vast majority of what&#x27;s
    available on the internet<p>Again, this is outdated. It&#x27;s true that the earliest
    training took this &quot;spray and pray&quot; approach, but data quality filtering
    is now a huge focus and the labs have made a lot of effort (and progress) in figuring
    out what good code is and getting the models to follow that. They&#x27;ve massively
    improved, in my experience, and it&#x27;ll only get better. Again - give it time,
    this is new."
