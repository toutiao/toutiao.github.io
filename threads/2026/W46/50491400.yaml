  author: Telaneo
  text: 'It&#x27;s interesting how there are countless options for music players,
    some simple, some fully featured, and yet there are still holes unfilled in the
    market. There&#x27;s probably some soul out there who&#x27;s even unhappy with
    Foobar2000.<p>It&#x27;s like a microcosm Linux: there are dozens of options, hundreds
    if you really go looking, but there are still holes in the market. Some are for
    somewhat understandable reasons beyond the individual distro&#x2F;music program&#x27;s
    control, while others are simply because no two features are in package at the
    same time, while others again are simply because no actual dev has had that idea
    and actually implemented it yet (maybe it&#x27;s in some ancient thing, but nothing
    made in the past 20 years will have it).<p>On the one hand, I&#x27;m the guy that&#x27;s
    largely happy with Linux Mint and VLC for playing my music files, so I apparently
    don&#x27;t need much. On the other hand, syncing music from my Linux PC to my
    phone while keeping track of play counts seems to be an unsolved problem. Maybe
    there&#x27;s that one program out there which can do it, but I&#x27;ve had to
    put that idea on pause while using Musicbee via Wine on Linux for syncing, which
    also stores my old play counts from my iPod and iPhone days. Hardly an ideal solution,
    just the least bad one.'
