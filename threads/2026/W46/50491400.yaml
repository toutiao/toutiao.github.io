  author: cooljoseph
  text: |-
    It sounds like maybe what you want is to have the &quot;shuffle&quot; mode play songs close to truly randomly while still penalizing songs that have been played too much recently. This gives us an optimization problem:<p><pre><code>    minimize KL(π || uniform) - β E_π[times played already],
    </code></pre>
    where β is an inverse temperature determining how much you dislike repetition and π is your policy. Here I&#x27;ve arbitrarily chosen a reverse KL divergence because it leads to a nicer closed form:<p><pre><code>    π(song) ∝ exp(-β⋅&quot;times song played already&quot;).
    </code></pre>
    I wonder if anyone has implemented this before in a music playlist.
