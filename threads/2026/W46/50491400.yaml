  author: mojuba
  text: "&gt; I was surprised by my own ignorance and how much LLMs like to complicate
    stuff.<p>Exactly and it&#x27;s like a plague. I think the main reason is that
    LLMs are generators, they like to <i>generate</i> code where code removal or reduction
    would solve the problem just as well. You ask them to fix something, they generate
    a fix. You tell them the fix didn&#x27;t work, now they generate a fix for a fix,
    whereas a fix that would also reduce complexity existed from the start.<p>With
    a fair amount of babysitting and constantly reminding the agent that code removal
    is an option, you can eventually get a decent codebase but I wonder why this isn&#x27;t
    a default. Because they are trained on mediocre code that is the vast majority
    of what&#x27;s available on the internet? Most likely."
