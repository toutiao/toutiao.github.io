    to &quot;feel&quot; right for human psyche, famously despite the ipod doing actual
    shuffling[0] users complained because tracks of the same artist &#x2F; album could
    still cluster over shuffling an entire library, so they implemented &quot;smart
    shuffle&quot; to skew the shuffle and break up clusters. An other option is to
    weight the random pick by how far back a track was last played, or how little
    it&#x27;s been played overall. This has the advantage of favouring less played
    tracks across listening sessions.<p>[0] and frankly if the ipod was able to do
