  text: To implement shuffle play, it is not necessary to actually shuffle filenames
    in memory. Just generate a random number modulo the number of files, and then
    play that file. That way your program can shuffle play any number of files, no
    worries about running out of memory.<p>By the way, the Roku box has a &quot;media
    player&quot; app in it by default, and it cannot shuffle play more than a handful
    of files. Completely useless.
