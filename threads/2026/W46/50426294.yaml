  title: Eric Park | Taking another shot at the cheap IP camera, part 2
  fetch_status: success
  content: "# Taking another shot at the cheap IP camera, part 2\n\n### November 9,
    2026\n\n[About a year ago](/blog/2025/2025-04-18-a-rant-about-cheap-proprietary-ip-cameras-featuring-hej-home/),
    I ranted about this particular cheap IP camera that was based on some proprietary
    Chinese IoT platform named Tuya. After trying and failing to get a local video
    stream from it without going through their servers, I concluded that my time would
    be better served by using cameras that actually exposed their streaming capabilities,
    and set it aside.\n\nWell, I recently dug the camera out while moving to my new
    job in New Jersey, and thought it might be worthwhile to give it another shot.
    I had plenty of spare time, and if I couldn’t figure it out, LLMs are recently
    all the rage for being really great at reverse-engineering things. But my initial
    goal was, I’d attempt it myself first, and then hand it off to an LLM if I failed
    and try and learn something from what it had figured out.\n\nSo what’s our goal,
    exactly? We know from last time that the camera has some sort of ONVIF server
    built in. That’s basically a standardized interface for IP cameras, defined by
    the Open Network Vision Interface Forum (or ONVIF!) And most ONVIF cameras expose
    their video streams using RTSP, or the Real-Time Streaming Protocol. You may have
    come across this protocol if you’ve ever streamed to a live-streaming platform
    like YouTube or Twitch.\n\nThe problem is that these servers are disabled on the
    firmware side, and their ports are closed off. Last time, we tried to enable them
    using the configuration options, but that didn’t work. Now, it’s time to figure
    out why that failed, and if there’s truly a way to enable those streams.\n\nSo
    with that in mind, let’s first extract the firmware image with `binwalk -Me`:\n\n|
    Decimal | Hexadecimal | Description |\n| --- | --- | --- |\n| 113992 | 0x1BD48
    | CRC32 polynomial table, little endian |\n| 458752 | 0x70000 | uImage firmware
    image, header size: 64 bytes, data size: 2803328 bytes, compression: none, CPU:
    ARM, OS: Linux, image type: OS, Kernel Image, load address: 0x81C08000, entry
    point: 0x81C08040, creation time: 2021-06-21 03:03:42, image name: “Linux-3.4.35”
    |\n| 3604480 | 0x370000 | CramFS filesystem, little endian, 3 files, total size:
    3248128 bytes |\n| 7736524 | 0x760CCC | JFFS2 filesystem, little endian, nodes:
    256, total size: 648000 bytes |\n\nOK, so it runs Linux 3.4.35. When was that
    released again? March 2013. A 13-year old kernel! (I guess it was only 8-years
    old when they compiled it.)\n\nLast time, we found the Tuya configuration file
    with the ONVIF config at`./extractions/cctv.bin.extracted/760CCC/jffs2-root/tuya_config.json`.
    I think the reason it might not have worked is because we edited the firmware
    image itself with a hex editor, and doing so probably corrupted some checksum.\n\nBut,
    we have the image extraction, so why not trace where the config option is being
