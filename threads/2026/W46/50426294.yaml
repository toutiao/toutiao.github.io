  author: rocmcd
  text: 'It depends on what you mean by range and quality, but IMO there are really
    two important dimensions to drones: weight and video transmission.<p>On weight,
    the FAA has fairly strict rules for anything weighing above 250g. If you&#x27;re
    just looking to have fun flying around your house or yard, I would stick below
    250g. Otherwise you have to register the drone with the FAA, think carefully about
    where you fly, and broadcast a remote ID at all times.<p>For video transmission,
    &quot;analog&quot; video transmission is typically cheaper and has lower latency,
    but is fairly low visual quality (it looks like watching a VHS tape on a small
    screen). Analog is certainly good enough for flying around your yard or house,
    but can make it hard to see some details (like small sticks&#x2F;branches) and
    is not generally good enough for taking shots of scenery. Digital is the other
    video transmission option, which is where you get entrants like DJI that offer
    extremely crisp video but are more expensive and you get locked into the DJI ecosystem
    (have to buy their hardware, including video systems and goggles). For getting
    started I would pick analog and upgrade to digital if you enjoy the hobby.<p>For
    someone just looking to get started flying around, I would start with a tinywhoop
    like an air75[0] (which broadcasts in analog), some entry-level analog goggles
    [1], and an entry-level radio [2]. It may not be pretty and you won&#x27;t be
    able to fly far, but you&#x27;ll get a feel for how to fly and then you can upgrade
    piecemeal as you figure things out.<p>Regarding:<p>&gt; that going the custom
    route could yield better results for less money than just buying something like
    a DJI mini straight away?<p>Unless you really like to tinker, I would start with
    getting an off-the-shelf drone. A DJI Mini is a great drone depending on what
    you want to do. Minis are good for aerial photography and coasting around, but
    not so good for acrobatics or fast flying &#x2F; racing. Plus it&#x27;ll be more
    expensive than the options I outlined above.<p>[0] <a href="https:&#x2F;&#x2F;betafpv.com&#x2F;collections&#x2F;all-drone&#x2F;products&#x2F;air75-ii-brushless-whoop-quadcopter"
    rel="nofollow">https:&#x2F;&#x2F;betafpv.com&#x2F;collections&#x2F;all-drone&#x2F;products&#x2F;air75-ii-...</a><p>[1]
