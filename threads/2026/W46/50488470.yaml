  author: hagbard_c
  text: '&gt; Virtually all old mice die of cancer, especially in the lab<p>Bret Weinstein
    did research on this topic which suggested that this is caused by lab mice having
    extraordinarily long telomeres which cause them to be <i>good</i> at cell repair
    but <i>bad</i> at limiting neoplasm growth due to delayed apoptosis. The result
    of this combination would be that lab tests on potential damage done by preparations
    on these mice is less valid &#x27;cause they are better at repairing such damage
    than the average mammal due to those long telomeres. It also means nearly all
    these mice succumb to cancer. They&#x27;re not normal mice, at all.<p>The reserve-capacity
    hypothesis: evolutionary origins and modern implications of the trade-off between
    tumor-suppression and tissue-repair<p>Bret S Weinstein  1 , Deborah Ciszek<p><a
    href="https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;11909679&#x2F;" rel="nofollow">https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;11909679&#x2F;</a>'
