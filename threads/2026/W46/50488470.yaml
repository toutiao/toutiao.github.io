  author: glenstein
  text: The &quot;in mice&quot; meme needs to be retired. We share critical similarities
    in DNA, proteins, immune systems and immune responses that already have been the
    basis for impressive advances in research applicable to humans when it comes to
    immunotherapies.<p>We shouldn&#x27;t overhype research done on mice but we also
    shouldn&#x27;t reflexively dismiss it as unrelated to humans.
  score: 0
  posted_at: '2026-11-14T03:16:45Z'
- id: '50493500'
  parent_id: '50490188'
  author: glenstein
  text: I don&#x27;t think that any self-respecting biologist would actually make
    any sort of categorical dismissal of research in mice. That kind of research has
    been the basis of noble prize-winning advancements in immunotherapies that now
    positively impact cancer survival rates for humans.<p>I&#x27;m sure the totality
    of opinions from biologists is vast and complex, but there is no way that &quot;all
    opinions have been expressed&quot; is a faithful report of the state of our knowledge
    on biology.
