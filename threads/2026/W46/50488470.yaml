  text: Humans have the same protein. Knock out studies in mice have  historically
    been very informative about human biology (with some exceptions). That’s very
    different from drug studies, where the molecules not only have to have the same
    effect in the model species, but also all off target effects have to be similar.
    That’s a higher barrier to clear and why mice studies of pharmaceutical interventions
    should (and do) face higher scrutiny.
