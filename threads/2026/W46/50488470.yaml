    else. The youth is programmed to revolt against the old ideas to test them. No
    youth, no revolt.<p>I also think both your assumption and the reasoning behind
    it are wrong. Humanity as a whole is the opposite of apathetic, it&#x27;s boiling
    with life. There are occasional pockets of apathy here and there, but they never
    last long.<p>And the reason why people on average are active and risk-taking is
    because their life is worth nothing. You lose your life no matter what you do,
    so you can as well do something good. And if you want to see change in your lifetime
    you better hurry up.<p>No one would risk their precious eternal lives if aging
    is gone. And if you want change you can safely wait forever without taking risks,
    maybe a meteor will fall in 10000 years and change things — who knows!'
