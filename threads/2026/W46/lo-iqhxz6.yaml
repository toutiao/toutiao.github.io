    The mystery button flips between light and dark. Want to return to system default? Tough luck! You shouldn’t have clicked it.

    a pattern I’ve been noticing lately:
    this kind of talk has historically been pretty common amongst software engineers, because frankly building good software by hand is very hard! there are more important details to focus on, so if there’s a known deficiency with something small then fuck the user! I don’t have time for that!
    but now we have agents. if you don’t want to spend the time on something small like that yourself, ask a robot. if you don’t like what it did undo its changes and tell it to try again, and be more specific. if part of your avoidance comes from not having a good solution in your head, talk to it about ideas. if the thought of that icks you out then go approach it from an angle of curiosity with a human.
    whatever your take on agents is (and david, I know you don’t like them) I think this kind of cavalier attitude towards other humans needs to go away. if you want to say you’re anti-ai on the basis on being pro-human, then be pro-human! humans deserve kindness, not tough luck.
