  text: '&gt; <i>People passively invest because active investing rarely outperforms
    passive.</i><p>Active rarely outperforms… after fees:<p>&gt; <i>[…] We&#x27;re
    a hundred students into class, 99 people make a left shoe, one person makes a
    right shoe. One of the students in the class made a right shoe.&quot; And then
    I say, &quot;A pair of shoes goes for $100.&quot; I also made a left shoe. And
    so I approached the only person with the right shoe and they said, &quot;Karl
    Marx said that how much time you spent making something determines its value.
    We both spent the whole day making it. I propose that we both get 50 bucks and
    then we sell the one pair of shoes.&quot;</i><p>&gt; <i>And then regardless of
    who the student is or what their political beliefs are, by the way, they always
    turn down that offer. They immediately say, &quot;No way, you&#x27;re not getting
    $50 for this.&quot; And I say, &quot;Well, explain to me why you feel that that&#x27;s
    the case.&quot; And then they say, &quot;Well, I have all negotiation power because
    they&#x27;re 98 other people in the class that I could go to for a left shoe.
    I have the thing in short supply, you have the thing in large supply. So who gets
    all the rents?&quot; Then I say, &quot;Well, how much do you think the person
    with the right shoe gets?&quot; And invariably the class comes to the conclusion
    that it&#x27;s somewhere between 99 and a hundred dollars, so that almost everything
    goes to the person who has the one right shoe.</i><p>&gt; <i>And so after saying
    that, I say to them, &quot;Well, to do investment management, I need two inputs.
    Instead of the left and the right shoe. I need investible money and I need mutual
    fund managers skill. Now tell me which one of the two is in short supply.&quot;
    And so very quickly they come to the conclusion that having investible money makes
    you in no way special, because everybody has investible money. And so it&#x27;s
    very difficult to call that a skill in short supply. The skill of the manager
    is something that is in short supply. Who is going to go home with the rents from
    this process? Just like the right shoe owner, they go home with everything, the
    manager goes home with everything. And so the value added is entirely absorbed
    by the manager in terms of fees. Which by the way is exactly the same reason for
    why the net alpha is zero. Because in this left and right shoe example, the net
    alpha is the amount of money the left shoe owner goes home with.</i><p>* <a href="https:&#x2F;&#x2F;rationalreminder.ca&#x2F;podcast&#x2F;220"
    rel="nofollow">https:&#x2F;&#x2F;rationalreminder.ca&#x2F;podcast&#x2F;220</a>'
