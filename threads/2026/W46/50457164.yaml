  text: I didn&#x27;t say anything about the management of retirement savings.<p>The
    author claims two things:<p>1. AI company valuations dropped because of fears
    that Democrats would restrict data center construction.<p>2. The AI industry is
    doomed because of unsustainable spending on data centers.<p>If 1 is true then
    investors clearly believe that the current level of spending is appropriate and
    any restrictions on it are harmful to long term returns.<p>If 2 is true and unsustainable
    spending continues despite a lack of RoI, then &quot;arms race&quot; is the only
    explanation for the irrationality. It is driven by the fear that if you don&#x27;t
    spend big, you&#x27;ll be part of the permanent underclass of companies.<p>This
    in turn implies a data center construction moratorium is a blessing in disguise.
    Everyone has an ironclad excuse to reduce financially-irresponsible but mania-driven
    data center investments.<p>Bottomline:<p>&quot;Data center restrictions are bad
    for the industry&quot;<p>and<p>&quot;Data center spending is unsustainable&quot;<p>are
    polar opposite viewpoints and imply vastly different outcomes of the current buildout.<p>I
    don&#x27;t know which one is true. And like most things, I suspect the truth is
    in the middle. But they can&#x27;t be <i>simultaneously</i> true.
