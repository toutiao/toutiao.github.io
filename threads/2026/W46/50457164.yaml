  author: throw0101c
  text: '&gt; <i>And in the end you have a market where nobody has any basis for thinking
    anything has any value, and the market ends up being a random walk.</i><p>Companies
    have value: at the very least they can be liquidated and their assets sold off
    (book value). They also tend to generate profits and may choose to distribute
    them (dividends, share buybacks): this also has value to shareholders.<p>Where
    the random walk comes in is that the information of how healthy or profitable
    a company is gives it a (perceived) value of $<i>x</i>. But new information can
    be learned at any point about the company which can change the (perceived) outlook
    of its health and profitability, which may give it a value of $<i>y</i>. Now it
    could be that <i>x&gt;y</i> or <i>x&lt;y</i>.<p>It is the fact that this new information
    (real, rumoured, fake) can come at any random point in the future:<p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;A_Random_Walk_Down_Wall_Street"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;A_Random_Walk_Down_Wall_Street</a>'
