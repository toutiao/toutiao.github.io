  author: jsrcout
  text: |-
    I still remember the Byte issue on Smalltalk from 1981 [0]. To high school me it was The Future for sure. It looked <i>so cool</i>. I had no way to try it on the family Apple II+ [1] though.<p>Trying out various Smalltalk-family systems in recent years showed the advantages of implementing the entire system in one language and running it in one image. There&#x27;s a refreshing coherence and predictability to everything, and pervasive simplicity instead of fractal complexity.<p>You can browse the entire codebase in a single window - language&#x2F;compiler, math operations (except for the base primitives I believe), data structures, graphics, window system, all nicely organized. Methods, even critical ones, are mostly small, straightforward, and cruft-free. Many are just a line or two.<p>Smalltalk gives the developer immense power. You work directly &quot;in the code&quot;; your changes are live instantly. You can trivially modify the system itself - just go there and start typing. All in the same browser window. You can easily look inside any running program, change its data and even its code, and just keep going. Even now it feels futuristic.<p>You get powerful graphics and a window system out of the box instead of the usual story where you select OpenGL&#x2F;Vulkan&#x2F;GUI&#x2F;DOM libraries and configure tools like make&#x2F;rpm&#x2F;docker&#x2F;pip&#x2F;npm. That&#x27;s probably the most &quot;science fiction-y&quot; aspect by far.<p>In short, this was the &quot;Jetsons&quot; future that seemed possible back when I was getting started. The future we actually got, of course, is far less elegant and unified, and far more messy and practical. That&#x27;s probably for the best. But I still love Smalltalk.<p>[0] <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;byte-magazine-1981-08" rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;byte-magazine-1981-08</a><p>[1] <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;byte-magazine-1985-05&#x2F;page&#x2F;155" rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;byte-magazine-1985-05&#x2F;page&#x2F;155</a>
    (At the time I was sad because we didn&#x27;t have the extra memory it needed. Now I&#x27;m more impressed that it was even possible.)
