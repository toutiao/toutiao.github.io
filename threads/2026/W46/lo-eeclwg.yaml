    Well, I know the feeling and that’s why, instead of sending money, I often send an email.
    In fact, I even implemented "reply" in my own browser: https://ploum.net/2026-03-20-social-smolnet.html
    Let’s see if I use it:
    ls -l ~/.local/share/offpunk/reply | wc -l
    72
    So I’ve already sent email, using the "reply" feature of offpunk (implemented only 6 months ago) to 72 different blog and gemini capsule.  And because I’ve send multiple emails to some,  it means I sent even more.
    The reason is that it is really easy: I read something interesting? I type "reply" then "Thanks for the post", :wq  y (to confirm sending) and I’m back reading.  I believe that will all those chat interface, we simply built the wrong "social" and that "online social" could really be completely different than it is right now.
