  author: adrian_b
  text: There were vastly fewer programmers in the 1970s, but there is no evidence
    whatsoever that the median skill or the top skill were lower than today.<p>The
    extra programmers of today have filled the voids in the distribution of programmers
    vs. skill, but in the best case for the present programmers they have not shifted
    the distribution towards a higher skill. If there was any shift in the distribution,
    it seems more likely that it was towards a lower skill.<p>I am pretty certain
    that any programmer who was exceptional in the 1970s would still be exceptional
    today.<p>Several decades ago, when I was very young, I reverse engineered a few
    Microsoft programs for CP&#x2F;M, including the BASIC interpreter, the FORTRAN
    compiler and the FORTRAN run-time library.<p>At least the BASIC interpreter is
    likely to have included code written by Bill Gates. Given the hardware constraints,
    those programs were well written. They also included a lot of assembly language
    tricks that would not be used today, but which were justified in a program that
    had to run on very weak CPUs and using very little memory.<p>At that time, I considered
    those programs very instructive.
