  text: The overconfidence effect is well documented and a known thing in light aircraft
    private aviation. People with education and good paying professional careers (doctors,
    lawyers, dentists, etc) who have the disposable income to buy a $300,000 aircraft
    and maintain it can <i>easily</i> become overconfident in their abilities. Because
    they&#x27;re good at one thing in their life that requires a lot of education
    and training, they think it automatically extends to every other domain of knowledge
    that they set themselves to.<p>The original v-tailed Beechcraft Bonanza used to
    be known as the &quot;v-tailed doctor killer&quot;.
