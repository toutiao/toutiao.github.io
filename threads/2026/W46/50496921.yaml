    that sort of thing...<p>&gt; Why not just put the data centers near clean power
    sources?<p>a) Unless you live in Texas, folks in the US are connected to a nationwide
    electricity-distribution grid. Folks in nearly all other other countries are in
    similar situations. Proximity to generation is nice, but not mandatory.<p>b) If
    there was grid capacity available to run the new datacenters that are in various
    stages of project completion, why would they be running on-site natural-gas fired
    turbines? Those are <i>way</i> less efficient and <i>way</i> more expensive to
    run than grid-scale generation facilities. That&#x27;d be a huge waste of money
    if the datacenter operators could hook into the grid, yeah?<p>&gt; ...that needs
