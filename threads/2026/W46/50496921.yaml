  author: jdw64
  text: Whether Bill Gates is smart or not isn&#x27;t my concern. I&#x27;m someone
    who reads his writing often, and I think his writing is worth reading. That said,
    on the other hand, this piece actually does contain a performative contradiction
    to some degree.<p>The theme of this piece is, in fact, &quot;don&#x27;t absolutize
    your own standards&quot; — that successful people forget the contingency of their
    success, forget the situation and context of their judgment, and treat it as a
    universally correct judgment. But the problem lies in the writing itself that
    carries this piece&#x27;s theme.<p>A doctor can smoke while telling a patient
    that smoking is bad — that&#x27;s not a problem at all. The biggest contradiction
    in this piece is that, while warning against &quot;absolutizing one&#x27;s own
    standards outside one&#x27;s own field,&quot; it reinforced the psychological
    parts without any argument or evidence. Honestly, everyone has that degree of
    contradiction in a homepage essay. So do I.<p>But separate from that, the difficulty
    in reading this piece is that if you&#x27;re going to demand intellectual humility,
    you should at least be consistent within the text. You can criticize the act of
    reinforcing one&#x27;s own standards outside one&#x27;s field. The problem is
    that it&#x27;s hard when, within the text, the author violates the very standards
    he set. I also tend to think this is to some degree a general human trait. Everyone
    has some logical leaps... it&#x27;s not a bad thing, but that&#x27;s how I am.
  score: 0
