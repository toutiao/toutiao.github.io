  text: This is the crux though, isn&#x27;t it? Are people as overconfident as the
    article claims, or are there many &#x27;hobbyist&#x27; experts milling around?
    I did a Bachelor&#x27;s in philosophy before switching to CS, and have been fascinated
    by IR&#x2F;political theory since high school. While I could not hope to learn
    it all, I can hold a good conversation with a researcher in either philosophy
    or IR, especially if it intersects with a topic of my core expertise.<p>To flip
    it around, I have friends who I would consider (hobbyist) experts in CS. The geneticist
    is much better at C++ and OOP than me, the geologist knows a lot about 3d modelling
    and the whole GIS world, and the economist knows way more about DS, AI and statistics.
    Who am I to say they aren&#x27;t experts? This kind of rigid division of field
    and expertise made no sense in university, and it only breaks apart more as we
    get older and more experienced.
