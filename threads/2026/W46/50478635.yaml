  author: adrian_b
  text: No, that is not true. The speed of light is not a fundamental constant in
    modern physics. It is just an arbitrary exact number with no relationship whatsoever
    with physics, but only with human history.<p>As first proposed by Maxwell in 1870,
    currently the unit of time is derived from the unit of distance by imposing the
    condition that the constants from the expressions of the electric force and of
    the magnetic force are equal.<p>This condition ensures that the strength of the
    electromagnetic interaction is described by a single fundamental constant, that
    from the law of Coulomb.<p>A consequence of this condition proposed by Maxwell
    is that the velocity of light in vacuum becomes an exact constant, whose value
    depends only on the choice of fundamental units of measurement, and not on any
    measurement. In a &quot;natural&quot; system of fundamental units, the numeric
    value of the speed of light in vacuum is &quot;1&quot;.<p>In the older systems
    of units, where Maxwell&#x27;s condition is not true, the speed of light was obtained
    from measurements, but nonetheless it still was not a truly fundamental constant,
    because its value depended on arbitrary choices made by humans for the electric
    and magnetic units of measurement and not on properties of nature.<p>The SI system
    of units still uses an obsolete definition of the unit of time, which is kept
    for now until a consensus will be reached about its best replacement. However,
    the best practical way to implement the units of space and time is with a stabilized
    laser from whose wavenumber the unit of distance is derived, while the laser also
    drives an optical frequency comb and the unit of time is derived from the pulse
    frequency at the output of the frequency comb (an optical frequency comb behaves
    like a frequency divider, whose input is in the tens of THz or hundreds of THz
    range, while the output is in the hundreds of MHz or few GHz range, where a digital
    counter can be used to measure time and frequency).<p>The relationship between
    the wavenumber of the light generated by the laser and the pulse frequency of
    the frequency comb includes the conventional value of the speed of light (299792458).<p>While
    the speed of light is a conventional constant that expresses the relationship
    between the units of time and distance, when they are chosen arbitrarily by a
    human, the elementary electric charge and Planck&#x27;s constant are not fundamental
    constants, but they are 2 fundamental units of measurement, the units of electric
    charge and angular momentum.<p>In a system of units of measurement that uses arbitrarily
    chosen units instead of &quot;natural&quot; units, the elementary electric charge
    and Planck&#x27;s constant are the ratios between the arbitrary units of electric
    charge and angular momentum and the corresponding natural units. In SI the elementary
    electric charge and Planck&#x27;s constant are conventional exact numbers, chosen
    so that the historic values of the ampere and of the kilogram are well approximated.<p>There
    exists a huge number of physics books that say incorrectly what Planck&#x27;s
    constant is.<p>Planck&#x27;s constant is not &quot;the quantum of action&quot;,
    even if Planck himself used this erroneous phrase.<p>There is no such thing as
    a &quot;quantum of action&quot;. Action is a physical quantity that increases
    monotonically with time for any physical system, so it is never constant, much
    less quantized.<p>Like the electric charge, action is a primitive quantity, which
    is not defined using other quantities. Energy is action per time, momentum is
    action per distance and angular momentum is action per angle. Therefore the ratio
    between energy and frequency is an angular momentum, and that is the meaning of
    Planck&#x27;s constant.<p>In a uniform rotation movement, both the angle of rotation
    and the action increase proportionally with time, so the 3 ratios between the
    3 quantities time, angle and action, are constant, i.e. the angular velocity,
    kinetic energy and angular momentum are constant. Resonance conditions between
    multiple rotation movements result in the quantization of the angular momentum,
    which is very frequently encountered in quantum physics, unlike the quantization
    of action, which is as impossible as the quantization of time.
