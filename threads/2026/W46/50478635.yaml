  author: psychoslave
  text: "&quot;What we are&quot; and &quot;how consciousness emerges and what it implies
    about itself and its relation to everything else&quot; are two distinct considerations
    which only partially overlap.<p>For the second part, it&#x27;s completely fine
    to dismiss the first question as irrelevant as &quot;what is &#x27;it&#x27; in
    &#x27;it rains &#x27;&quot;. That is, language artifact are not evidence of ontological
    correspondance in actual things happening. So, &quot;we&quot;, &quot;being&quot;,
    and &quot;me&quot; can be regarded as illusions. The illusion itself actually
    happen, but it&#x27;s more straight forward interpretion is generally misguiding.<p>The
    first approach on the other hand can lead to dismiss consciousness as relevant
    tool to reach some absolute substance which is postulated as ultimate reality.
    That is, there is some &quot;being&quot;, and &quot;I&quot; and &quot;we&quot;,
    just as there are actual ideal spheres in existence in a platonic sense.<p>Both
    don&#x27;t give much credits to the most trivial intuitive interpretation of phenomena,
    but they kind of point to very different directions."
