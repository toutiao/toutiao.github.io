  content: "# CursorsCursorsCursorsCursors \n\nThree weeks ago, at a CSS Working Grouping
    meeting, we discussed an issue [“Cursors for base appearance”](https://github.com/w3c/csswg-drafts/issues/14251),
    and [resolved](https://github.com/w3c/csswg-drafts/issues/14251#issuecomment-6322899089)
    on the following:\n\n> The CSS Working Group just discussed [css-forms-1] Cursors
    for base appearance, and agreed to the following:\n> \n> - RESOLVED: Adopt cursor
    rules in the last comment.\n> - SUMMARY: Pointer = “click this thing”, text cursor
    says “prepare to enter text”, grabbing hand says “drag this”.\n\nOne of the rules
    from the “last comment” mentioned there is\n\n    select, option, input[type=checkbox],
    input[type=radio],\n    button, input[type=button], input[type=submit], input[type=reset],
    input[type=color], input[type=image], ::file-selector-button {\n    \tcursor:
    pointer;\n    }\n\nOr, if we were to remove all non-button selectors,\n\n    button
    {\n    \tcursor: pointer;\n    }\n\nThat is, of&nbsp;course, not a&nbsp;change
    to&nbsp;the default styles in&nbsp;the browser — this is&nbsp;a&nbsp;rule for
    elements that will have an&nbsp;`appearance: base-…`.\n\nAlso note that, this
    user agent style will be&nbsp;very much overrideable —&nbsp;no&nbsp;`!important`.\n\nAnyone
    who does not like `cursor: pointer` on&nbsp;buttons and other similar elements,
    are free to&nbsp;override it&nbsp;to&nbsp;`default` (or&nbsp;anything else) in&nbsp;their
    stylesheets.\n\nThe rest of&nbsp;us&nbsp;can, I&nbsp;guess, celebrate? I&nbsp;was
    always on&nbsp;the side of&nbsp;this decision. I&nbsp;published my&nbsp;[“Correct
    Cursor on&nbsp;Active Elements”](https://kizu.dev/cursor-pointer/) article in&nbsp;2013.
    In&nbsp;2017, I&nbsp;opened my&nbsp;first CSSWG issue — [“Change the pointer cursor
    to&nbsp;indicate any interactive element”](https://github.com/w3c/csswg-drafts/issues/1936),
    which led to&nbsp;a&nbsp;change in&nbsp;a&nbsp;non-normative part of&nbsp;the
    spec.\n\nSince then, I&nbsp;did not see any new arguments in&nbsp;this debate.
    I&nbsp;will not repeat everything that I&nbsp;argued about, but one of&nbsp;the
    most common counter-arguments that I&nbsp;read today is&nbsp;“OS&nbsp;does not
    do&nbsp;it”.\n\nDid you see that “OS”? When was the last time your OS&nbsp;innovated
    anything in&nbsp;the&nbsp;UI? Did it&nbsp;become easier to&nbsp;use over years?\n\nMany
    of&nbsp;people with this argument ask, thinking that this will be&nbsp;a&nbsp;good
    question, something like “What next — change the cursor in&nbsp;the OS?!”.\n\nI&nbsp;mean…
    Yes? I&nbsp;would be&nbsp;happy with that. When I&nbsp;look at&nbsp;like half
    of&nbsp;the (non-native) apps in&nbsp;my&nbsp;desktop OS, they have `cursor: pointer`
    on&nbsp;interactive elements.\n\nCinny, Discord, Signal, Slack, Steam, VS&nbsp;Code
    — some of&nbsp;the apps that I&nbsp;have before me.\n\nWhen I&nbsp;use apps that
    _do not_ change the cursor to&nbsp;anything other than `default`, I&nbsp;cringe.\n\nDefault
    cursor does not communicate anything. It&nbsp;does one job well — point at&nbsp;a&nbsp;specific
    pixel. It&nbsp;could do&nbsp;more.\n\nIn&nbsp;the issue, many people came with
    dislikes and their arguments against `cursor: pointer`. I&nbsp;want to&nbsp;aknowledge
    one argument that I&nbsp;fully agree with —&nbsp;it&nbsp;would be&nbsp;great if&nbsp;buttons
    and links would have different cursors. And also, regular links should have cursors
    different from the links that are opened in&nbsp;new tabs.\n\nWe&nbsp;need more
    cursors.\n\nBut if&nbsp;we&nbsp;were to&nbsp;look at&nbsp;those three things:\n\n-
    Blank space on&nbsp;the page.\n- Buttons.\n- Links.\n\nAnd then had only two cursors
    to&nbsp;assign to&nbsp;all of&nbsp;them, I&nbsp;know which ones I&nbsp;will assign
    to&nbsp;which.\n\nAnd I&nbsp;will never understand anyone thinking that buttons
    have more in&nbsp;common with blank space than with links."
