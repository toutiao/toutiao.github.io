  text: |-
    The linked https://kizu.dev/cursor-pointer/ is kinda ridiculous. It dismisses “Don’t break users’ habits!” outright:

    But you can’t treat the presence of habits as an argument.

    All operating systems have always done it one way. The author is explicitly refusing to consider this to be an argument—not even whether it’s a good or a bad argument, just rejecting its relevance. Ludicrous.
    Truth is, there used to be strong customs about button and form control styles, so that interactivity of an element was rarely in question. That has been diminished a lot, and I think that’s why some started adding cursor: pointer to their buttons.
    That thesis in turn indicates, in my opinion, why this would be patently a bad decision if it was applied to the base style: the base style of buttons matches the operating system to a reasonable degree (though this is less true than it used to be), so the base cursor should match the operating system’s.
    But this is only applied where you’re explicitly changing opting out of that to at least some extent with appearance: base. In that context, I say… meh. Fine. Not enthusiastic about it, but it’s not as unreasonable as it initially seems.
