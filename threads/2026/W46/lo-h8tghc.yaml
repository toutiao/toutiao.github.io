    I do support the general idea, but I guess this never worked for mainstream operating systems because there are so many possible inconsistencies:
    What about menu bars? Not a button, so no pointer cursor. Okay. What about the individual items in the menu bar? Not a button, no pointer cursor, aight. So, what about dropdown menus? Needs a pointer cursor, right. So what about the menu items this opens??
    What about scrollbar thumbs? No a button, so no pointer cursor, right. But what about the scrollbar buttons??
    What about tabbed views, collapsible panels, range sliders, spinner buttons, ...?
    When I started working on the Saudade GUI toolkit, I played around with the idea but quickly gave up because it felt so weird and out of place. Maybe I should look at this again.
