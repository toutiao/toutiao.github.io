  text: |-
    Sure it's a subcategory? But they don't dismiss either problem "outright." There's no blanket dismissal, they literally give reasons for why they disagree with the problems. That's just a normal argument.
    For the general case of breaking user habits, they say that:

    The habit should be treated in its context, and in context of what would happen if we’d break it. Would it be destructive in some way, or would it be just a matter of minor users’ discomfort?

    That is a good general reason why you might want to break user habits, and it makes sense to me in this case. I don't think changing the default cursor behavior on the web is likely to affect operating system savants much, and I expect it would help most web users quite a bit!
    Then underneath the header "The cursor doesn’t change in users’ OS,"_ they ask whether the OS default is usable, and whether it could be improved. Instead of dismissing that point they claim that some native desktop apps are not usable because of needing to guess where to click on active elements. I agree that that's a problem. Some apps are carefully designed with good affordances, but plenty are shit at showing what things are clickable and interactable. And while that problem isn't solely due to the lack of cursor changes—plenty of other comments already address how better visual design would help—if the OS norm were that cursors should change to pointers over buttons, I think the problem would be better!
    I agree with polywolf that your first comment reflects a quick reactive opinion instead of really reading and considering the linked post.
    And to make my own point, not breaking user habits is a bad argument for a system that is as long-lived and as universal as the web. Most students in US schools nowadays are growing up with chromebooks instead of laptops with real operating systems. For those users, operating systems are breaking their habits with outdated default behaviors.
