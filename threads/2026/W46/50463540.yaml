  author: sysrpl
  text: As the title says, I am working on a FOSS Linux Pinball Simulation Engine.
    It is based on my Pascal Tiny.Sim library which has been in github for many years.
    Tables are designed in parametric CAD (OnShape for now) and imported by my engine
    as 3D meshes. It simplifies many of the physics bodies into primitives and has
    options to configure how meshes are convert into a table. The logic for a table
    is written in Typescript. Users can also edit the table inside the game. The idea
    will be that users can use the engine to play and share pinball tables of their
    own designs. I am supporting Linux because I use Linux every day and it needs
    more support when it comes to playing good fun games.<p>If you want to help Linux
    and are an artist, I plan make the initial source code release with 3 different
    tables and a guide for how to create your own pinball tables. I am looking for
    artwork to help with table artwork. My contact information is on the page linked
    to this submission.
