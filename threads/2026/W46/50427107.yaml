  author: toast0
  text: |-
    &gt; Cooperative scheduling is based on the programmer releasing control manually (much like manual memory management) or having yield points baked into the language, often at function calls or IO events. Processes on BEAM can be preempted, they&#x27;re allotted a number of &quot;reductions&quot; and when those are exhausted, the process is preempted (the process may also yield earlier).<p>BEAM is <i>actually</i> cooperative [1]. In userspace, function calls and IO (receive and !) are yield points, and reduction count is simply the number of function calls you&#x27;re allowed. Something something Computer Sciencey reduction basically just means function call.<p>It just feels preemptive because as a functional language, you have to call functions all the time. Your loop becomes<p><pre><code>   loop(I) -&gt; loop(I + 1).
    </code></pre>
    And that will yield once it calls itself enough times.<p>Native code (NIFs, BIFs, and drivers) has to count reductions and&#x2F;or yield explicitly.<p>You can easily hog scheduler threads in native code that does significant computation or does i&#x2F;o without using the runtime facilities; most people who write NIFs will mess it up at least once, I certainly have. It&#x27;s much harder to do in userspace code, but if you fully unroll a very large loop that does not call functions or anything else that can yield, you can do it; I don&#x27;t see how this would happen without specific intent, I&#x27;ve never run into it, but it&#x27;s possible.<p>A blocked scheduler can be vaguely fine or terrible depending on how long it stays blocked and what the system is up to. Often it won&#x27;t be terrible until you do something that needs all schedulers to synchronize, such as operations around code loading, but you can probably wedge the whole BEAM if you try.<p>[1] there&#x27;s not really any other sane way to build preemptive userland threading anyway. You could schedule a timer signal, and task switch in the timer signal handler... but no sane person will recommend doing non-trivial work in a signal handler.
