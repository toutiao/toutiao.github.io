  author: Jtsummers
  text: |-
    &gt; Erlang runtime semantics (cooperative &quot;async threads&quot;)<p>Preemptive, not cooperative. Cooperative scheduling is based on the programmer releasing control manually (much like manual memory management) or having yield points baked into the language, often at function calls or IO events. Processes on BEAM can be preempted, they&#x27;re allotted a number of &quot;reductions&quot; and when those are exhausted, the process is preempted (the process may also yield earlier). This guarantees every process is able to get a turn. Cooperative is fine, but it requires much more care. Go prior to 1.14 suffered from cooperative scheduling, a tight loop (not that you would write this one specifically, but as an example) could hog an OS thread:<p><pre><code>  i := 0
      for {
        i++
      }
    </code></pre>
    The conceptual equivalent in Erlang would only execute the loop so many times before it would be preempted.
