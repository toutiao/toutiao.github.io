  author: chriswarbo
  text: "&gt; an AI agent is in the critical path in production i.e. non-deterministic
    action may occur(albeit with recovery)<p>Most software verification is proved
    &quot;for all possible inputs&quot;, e.g. the system maintains some invariant
    regardless of which sequence of actions is taken. Those inputs could be from a
    user interacting with the software, or they could be API calls made to our library,
    etc. There&#x27;s no reason you couldn&#x27;t model an AI agent&#x27;s choices
    in a similar way: i.e. prove that the desired invariants hold, for all possible
    sequences of actions the AI component might choose.<p>That <i>might</i> be straightforward,
    if the AI agent is constrained to pick from a simple set of domain-specific actions.
    In contrast, we can&#x27;t say much about a system involving an AI agent with
    a full Bash shell.<p>&gt; What scenarios does it make sense to have a lean proof
    from the start?<p>It&#x27;s usually <i>much</i> easier to verify software that
    was written and structured with that in mind; rather than trying to reason about
    some arbitrary blob of code after-the-fact. So, if you <i>do</i> want to prove
    stuff, it should very much be in there from the start."
