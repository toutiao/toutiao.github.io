  text: 'Dijkstra&#x27;s approach would be to prove there is a strictly decreasing
    natural number associated to the loop.<p>This limits programs to the ones that
    can be formally shown to terminate. Which is good enough for most purposes.<p>My
    approach is to accept programs that run forever as long as I&#x27;m fairly sure
    each loop makes progress of some sort (instead of simply doing &quot;while not
    solved: continue&quot;).<p>Edit: There&#x27;s also a fun algorithm that, as far
    as I know, only provably terminates by being bounded by a sequence of strictly
    decreasing ordinals. Which breaks all kinds of models for proving it terminates.'
