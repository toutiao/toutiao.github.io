  author: derefr
  text: "&gt; they only proved narrow properties of the system.<p>It&#x27;s that,
    yes.<p>They didn&#x27;t prove that the code has no bugs; they proved that none
    of the current bugs (known or unknown) are security-breaking bugs, per their formalized
    security model.<p>&gt; First, our researchers collaborated with a mix of models
    to <i>translate Signal’s security goals into formal mathematical specifications</i>,
    with human experts reviewing every one. From there, agents powered by Gemini Carbon
    did the proofs, generating over six million lines of Lean, a computer language
    that mathematically proves the accuracy of code.<p>The generated Lean code here
    is just being checked against the &quot;formal mathematical specifications of
    Signal&#x27;s security goals&quot;, not checked for the low-level properties you
    might care about as a programmer, e.g. &quot;will it ever leak memory&quot; or
    &quot;will it ever crash&quot;, etc. And in fact, the code is not even being checked
    for the reachability of non-security-violating protocol failure states, e.g. &quot;could
    the protocol ever deadlock such that neither side can send messages any more&quot;.<p>It&#x27;s
    still perfectly possible for the code to have all of these problems. It&#x27;s
    now just known that, as of the commit they did this analysis against, none of
    those low-level problems, as far as they exist in the codebase, can cause a security-model
    violation.<p>Or, to put that another way: the system has been proven to &quot;fail
    safe&quot; in all its current failure modes, per their specific definition of
    safety (which is basically &quot;keeping to the security guarantees Signal markets
    itself to users as having&quot;.)"
