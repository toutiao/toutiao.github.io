  author: klodolph
  text: 'Here’s my take: if you don’t personally have a Mac, you should not be making
    Mac builds of your software.<p>Same for Windows.<p>I may be a little old-school
    about this. That’s fine. I think most people out there who are trying to support
    multiple platforms with their code should be going one of three directions—(1)
    some kind of web app, (2) an open-source tool where end-users compile it or run
    it in their Python interpreter or Node.js or whatever, or (3) a pre-built binary
    for systems they personally run at home.<p>I also am not writing out, like, an
    essay on how to replace GitHub actions for every possible use case that people
    have GitHub actions for. I am just providing some suggestions for one possible
    direction. If you get off GitHub actions, you are going to end up with something
    that is missing some of the features that GitHub actions, maybe some features
    that you like. The same is true in the reverse—if you switch <i>to</i> GitHub
    actions, you will obviously lose features that were present in whatever other
    system you had before. GitHub actions is, after all, completely terrible and switching
    to it would just be a kind of disaster in a bunch of different ways.<p>I don’t
    like to put this kind of wall-of-text disclaimer in comments on HN, and hopefully
    y’all can figure this stuff out without the wall-of-text disclaimer. It would
    be kind of… absurd… perhaps, to expect some random commentator on Hacker News
    to give you exactly the answer that satisfies your needs, unless you put those
    needs in a question.<p>Instead I limited myself to two suggestions. If you don’t
    like them, then figure something else out yourself. You will not have trouble
    making something better than GitHub actions.'
