  author: woodruffw
  text: The advice here is really great (as I&#x27;d expect from Hugo), but as the
    maintainer of zizmor I want to note some caveats with the current iteration of
    workflow lockfiles:<p>- They only lock normal action calls. If your workflows
    invoke other reusable workflows, you need to keep those hash-pinned manually for
    now.<p>- Composite actions are not <i>themselves</i> locked. Instead, they get
    locked transitively through their callsites i.e. the workflows that call them.
    This makes any individual caller that uses lockfiles safe, but it also makes the
    current `gh actions-lock` default <i>unsafe</i> (since it removes hash-pins from
    the composite action itself, meaning that any external caller that invokes the
    action loses their transitive pinning).<p>- Other forms of `uses:` clauses, like
    Docker images, are also not currently locked via the lockfile. And the same for
    forms of interior mutability (like an action running `npx ...` under the hood,
    although the latter is fully outside of GitHub&#x27;s control to prevent. But
    these mean that you <i>can&#x27;t</i> assume that a fully locked Actions setup
    is in fact 100% immutable.<p>I hope they address these gaps soon, because it&#x27;s
    otherwise an excellent (and long-awaited) feature.
