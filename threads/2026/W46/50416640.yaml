  author: LuKks
  text: Works across browsers, Node.js, and React Native.<p>- P2P servers. Listen
    for peer connections anywhere, even in the browser.<p>- Direct connections. Connect
    to peers across devices and networks.<p>- Built-in signaling. Automatic SDP&#x2F;ICE
    exchange and negotiation.<p>- Identities. Shareable cryptographic addresses instead
    of IP addresses.<p>- Peer discovery. Announce and find peers using shared topics.<p>-
    WebRTC API. Use data channels, audio&#x2F;video tracks and transceivers.<p>- Ready
    to use. Signaling, STUN and TURN configured by default.
