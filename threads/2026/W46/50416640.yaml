  text: |-
    PeerJS does wrong by forcing opening data channels for you, it&#x27;s already forcing you into a specific opinion on how it should work. Also, it doesn&#x27;t work in Node.js. I understand their API idea but it should have been one level lower first, to build on top.<p>like-webrtc gives you the RTCPeerConnection perfectly negotiated, connected, cross-platform (browsers, Node, React Native), etc but nothing else then you can open a data channel the way you want.<p>Imagine a TCP or HTTP server&#x2F;client API, this is the same but you get a peer connection with no extra assumptions and it&#x27;s up to you what you do next.<p>WebRTC in servers is also important, e.g. imagine long-running bots or literally just run your backend using WebRTC lol.<p>- TCP (congested) + HTTPS (insecure centralized global CA) + JSON (slow)
    versus
    - UDP (low latency) + RPC (request&#x2F;response) + binary encoding (fast)<p>We should start running our centralized backends with WebRTC as a first step to adopt and improve tooling around WebRTC.<p>That&#x27;s why I compiled and released a modern WebRTC build version for Node.js:<p><a href="https:&#x2F;&#x2F;github.com&#x2F;LuKks&#x2F;webrtc-runtime" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;LuKks&#x2F;webrtc-runtime</a> (no signaling, no features, etc)<p>That allows you to use RTCPeerConnection cross-platform anywhere, so I used webrtc-runtime to build like-webrtc (complete solution).
