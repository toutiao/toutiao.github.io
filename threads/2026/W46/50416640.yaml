  text: |-
    When developers are passionate about P2P, they don&#x27;t like seeing a signaling server but that&#x27;s the standard or specification you could say.<p>I don&#x27;t want to force developers to use my opinionated signaling server, but we can provide a best effort and redundant scalable signaling network + peer discovery system by default.<p>Blind negotiation is important so that the signaling can&#x27;t even read the SDP&#x2F;ICE messages, this helps with the goal of letting people run hundreds of signaling servers on their own without need to trust them.<p>E.g. we need to support signaling using HTTPS to join a tiny Kademlia [decentralized] network of RTCPeerConnection including in the browser. Even a long-running peer with a tab open could be contributing to the network, and a long-running node on a server too because the same code already works everywhere cross-platform.<p>I will check BitTorrent and Nostr to see if we can expand the signaling options. I&#x27;m new into WebRTC and this is an early version, so be patient with me haha :) Thanks<p>This module is meant to be minimal with no usage assumptions. Imagine a TCP or HTTP server&#x2F;client API with no opinions, but instead of getting a socket you get a RTCPeerConnection that is connected and ready to use.<p>You could even run your normal backend over WebRTC + RPC with efficient encoding instead of HTTPS&#x2F;POST&#x2F;JSON, because like I said like-webrtc works in Node.js too and it&#x27;s the same code.<p>It&#x27;s not documented in like-webrtc but I will expose the Peer class directly to be more modular e.g.:<p>const a = new Peer(...)
    const b = new Peer(...)<p>a.on(&#x27;signal&#x27;, data =&gt; b.signal(data))
    b.on(&#x27;signal&#x27;, data =&gt; a.signal(data))<p>It already works like that internally. If someone wants to benefit from all the features, Noise encryption, perfect negotiation, etc but use different signaling systems then you should be able to do so.<p>If someone wants to use pure standalone RTCPeerConnection but you want modern WebRTC cross-platform (Node.js, React Native, browser) then you can use: <a href="https:&#x2F;&#x2F;github.com&#x2F;LuKks&#x2F;webrtc-runtime" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;LuKks&#x2F;webrtc-runtime</a> (used internally by like-webrtc)<p>If you want to use WebRTC or you have any questions then feel free to contact me:<p><a href="https:&#x2F;&#x2F;t.me&#x2F;LucasBarrena" rel="nofollow">https:&#x2F;&#x2F;t.me&#x2F;LucasBarrena</a><p>Here to help
