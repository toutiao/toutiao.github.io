  text: |-
    Actually you&#x27;re right if we use your [more correct] definition &quot;built into my service which this package acceses&quot;<p>The signaling server is acting as a free public service right now, so you&#x27;re right haha<p>1. The package connects to an external online WebSocket server.
    2. When you do server = rtc.createServer() and server.listen() it tells the external signaling server to record an announcement in a key-value Map which allows permission to receive relayed data from peers that want to connect with you.
    3. When a peer does rtc.connect(server.publicKey) they send you via relaying small signaling offers&#x2F;answers (SDP&#x2F;ICE) to establish the RTCPeerConnection.<p>Personally, I just wanted to get the direct peer-to-peer connection perfectly negotiated in the browser as fast as possible.<p>Signaling can still be improved a lot as per my other replies, and like-webrtc should allow different options for signaling so anyone can do their own thing as well while still benefiting from the cross-platform, intuitive server&#x2F;client API, the included perfect negotiation, etc.
