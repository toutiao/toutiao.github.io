  author: imtringued
  text: I keep getting clickbait youtube videos about how &quot;NCM&quot; obsoletes
    &quot;LLMs&quot; and &quot;Nvidia memory chips&quot; (yes, it&#x27;s that bad).<p>This
    makes me wonder what these people think an &quot;LLM&quot; even is. The name itself
    implies that it is large and about language. It does not imply that an &quot;LLM&quot;
    is inherently autoregressive or that it has any particular architecture  even
    though most LLMs are transformers. Anything can be a large language model as long
    as it is large and models language.<p>NCM is basically a hierarchical diffusion
    transformer where the further layers take one big token and then generate two
    smaller tokens. So it is more like an evaluation strategy. You could apply this
    to any model architecture.<p>I personally think the name NCM itself is terrible
    because it contains the word &quot;next&quot; which inherently implies an ordering
    and somehow we are supposed to think that &quot;LLM&quot; which contains no mention
    of ordering, is constrained to ordered token production.
