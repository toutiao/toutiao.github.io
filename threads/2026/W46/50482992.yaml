  author: louiereederson
  text: A) The point is mainly that if someone is reporting on something they need
    to separate facts from inference. If he did not say excess, you cannot say he
    did, and there is no support from the WSJ source article for this claim.<p>B)
    Huang has been clear that he needs to diversify his customer base, in part bc
    of the threat posed by in house accelerator programs. He could see urgency in
    finding customers beyond those key accounts without necessarily seeing excess
    supply across the industry. He is also famous for operating with high urgency
    (the “our company is 30 days away from going out of business” quotes come to mind).<p>In
    general it’s important to zero in on what is known vs inferences made to avoid
    getting caught up in faulty media narratives. I’m not making a judgment on supply
    excess, just pointing out that small wording changes can nudge groups of people
    into weakly substantiated conclusions. That can then build into a consensus view
    that is not supported by fact. This is why people hate journalists and analysts
    but also why we need good ones.
