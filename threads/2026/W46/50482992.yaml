  author: jerf
  text: That just represents the inertia of the whole system operating on old assumptions,
    given that it&#x27;s only still <i>early</i> in the process of coming to light
    in a public way how much of the frantic purchasing has literally been sitting
    in a warehouse, depreciating. I mean, I&#x27;ve been pretty suspicious of this
    for literally years now, but it&#x27;s been a &quot;conspiracy theory&quot; that
    this amazing demand is manufactured by a variety of financial hacks rather than
    just pure demand that the system as a whole has not paid attention to because
    number was going up, do not question number going up lest the number stop going
    up.<p>You need to apply first-principles thinking to this sort of scenario. Beliefs
    like <i>the demand is crazy</i> do not just exist floating through space; they
    exist on top of a specific set of facts and deductions from those facts, which
    can be very easy to forget when a fact seems to be true for a long period of time.
    When the set of facts and deductions a conclusion rests on are found to be faulty,
    the conclusions need to be re-examined from scratch. It is not <i>generally</i>
    impossible that a fact could still end up being true, just for different reasons.<p>However
    in this <i>specific</i> case, it strikes me as extraordinarily unlikely. If the
    shortage has been manufactured, then all assumptions around demand and possible
    profitability have to be completely re-examined. Once the system digests this,
    because these things do take some time, it can cease to be a &quot;use it or lose
    it&quot; market very, very quickly, and turn incredibly quickly into a &quot;liquidate
    everything you can while it still has <i>some</i> sort of value&quot; because
    of massive, massive oversupply. What is the value of a rack of nVidia processors
    that nobody can turn on? What is the value of a rack of nVidia processors that
    nobody can turn on when there are warehouses&#x27; worth of the things? Anyone
    who blind operates on &quot;it&#x27;s a use it or lose it market&quot; will lose
    their shirts on the transactions. &quot;It&#x27;s a use it or lose it market&quot;
    is not a foundation; it is contingent on a lot of things, some of which are being
    shown to be false.
