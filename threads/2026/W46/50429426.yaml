  author: kevg123
  text: |-
    This is what I do. OpenSMTPD to receive mail, Dovecot to handle IMAP and spamassassin for full spam rules control.<p>I still configure my clients (Thunderbird, K-9, etc.) to send to my mail server, but that just forwards on to the actual email sender (if authenticated). This way I can change email senders without needing to change all my clients. There are still risks though because if you choose the cheaper plan (as I do), then you get grouped onto a sending pool that spammers might use and then you might get periodically affected if that set of IPs take a reputation hit.<p>My config for sending: With OpenSMTPD, process it with DKIM:<p><pre><code>    action &quot;process_dkim&quot; relay host smtp:&#x2F;&#x2F;127.0.0.1:10027
        match from auth for any action &quot;process_dkim&quot;
    </code></pre>
    A local DKIM process then processes and sends back to OpenSMTPD:<p><pre><code>    listen    127.0.0.1:10027
        relay     127.0.0.1:10028
        [...] DKIM signing config [...]
    </code></pre>
    Then back to OpenSMTPD to forward to the final email sender:<p><pre><code>    listen on lo   port 10028 tag DKIM
        action &quot;process_outbound&quot; relay host smtp+tls:&#x2F;&#x2F;label@... auth &lt;secrets&gt;
        match tag DKIM for any action &quot;process_outbound&quot;
    </code></pre>
    I&#x27;m not sure if I even need to sign with DKIM as my email sender does the final DKIM signing, but it seems that in the email world, it&#x27;s always best to do things as &quot;properly&quot; as possible whenever you can.<p>I&#x27;ve been doing this for years, and spam and deliverability issues have been minimal and I&#x27;ve dealt with some big names.
  score: 0
