  author: scarecrowbob
  text: 'On some level I agree with you that a lot of the anger we see is expressed
    towards empty signifiers.<p>However honestly I think you could mark these changes
    that we see in the tenor of discussions on HN around how active Musk himself has
    been at doing things that many of us don&#x27;t like.<p>It&#x27;s one thing to
    not like him because I am generally anti-capitalist and I&#x27;m super skeptical
    about the actual goodness of his products or see his companies as mere plays to
    get listed in the S&amp;P500.  I never have expected folks on a venture capitalist
    form to find that position intelligible.<p>It&#x27;s another thing when he does
    a bunch of political things that large sections of folks here actively don&#x27;t
    like.  A lot of the folks here like the US for its humanistic, empathetic, and
    liberalized culture.<p>My point (and I have one, so you don&#x27;t think I am
    merely being spiteful) is this:<p>the actual content and degree of that dislike
    might be important to register and dismissing it as simple spite might miss an
    important point.<p>In 2012 many tech companies might look quite benign to many
    people, whereas after the acquisition of Twitter, the ketimine-fueled ideological
    tweeting, the attempts to influence US politics, and the fallout from DOGE might
    seem to many people worth some actual outrage.<p>And further, that ourtage might
    seep into all the other ways we describe other technologies: Flock certainly doesn&#x27;t
    seem benevolent, ICE-&gt;Trump-&gt;Vance-&gt;Thiel&#x2F;Palentir might seem pressing,
    and LLMs might seem less like a really solid autocomplete and more like a way
    to automate mass surveillence.<p>So my point is that while it might be tempting
    to dismiss the anger that people feel as simple social media toxicity and irrational
