  author: simianwords
  text: '1. Wars are fewer than before, we are killing fewer people per capita<p>2.
    Climate change won&#x27;t end humanity itself, by all probability, people will
    be better off in 100 years even if we don&#x27;t do anything about emissions.
    Better off in terms of life expectancy, poverty etc<p>3. Water scarcity and hunger
    have reduced over the last 100 years and will continue reducing thanks to technological
    progress<p>In fact, I&#x27;d say contrary to you that a lot of problems are solved
    because of over population - we have more people, more intelligence and more technology
    created thereby.<p>There&#x27;s a guy called Paul Ehrlich who prophesied end of
    days in very similar ways to you. He mainly blamed overpopulation and resource
    use and predicted something similar to a world catastrophe in 2000&#x27;s. Many
    times. Nothing happened.<p>Unless we have an AI x-risk event, I assure you that
    people will be more prosperous 100 years from now and you&#x27;d prefer to live
    then than today.<p>I&#x27;m also very wary of this rhetoric that population is
    the cause of all problems. This rhetoric is very popular in certain circles and
    is anti-human inherently.<p>Edit: more lore on Paul Ehrlich: he had a bet with
    an economist Julian Simon that the price of metals would go up because of scarcity.
    His logic was that the population would increase with limited supply of raw metals.
    Simon OTOH bet that it would go down because of technological progress - more
    people would have more intelligence combined and find better ways to extract metal.
    Simon won btw.'
