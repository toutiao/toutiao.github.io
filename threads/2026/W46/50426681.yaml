  text: "&gt; Then it becomes very tempting to vibe code your own<p>What about the
    Wall, though? The Wall (tm) is when you vibe code the software through prompts,
    and at some point, the accumulated cruft means that you no longer understand enough
    of the codebase&#x2F;approaches to give useful feedback, so you delegate more
    to the LLM, then your costs keep increasing and eventually you hit The Wall (tm)
    where you can&#x27;t make forward progress without breaking something else.<p>The
    models have definitely improved (i used to hit the wall in one session, now its
    generally weeks), but I&#x27;m currently working on a ridiculous tool replacement
    where even the creator has hit said wall.<p>Coding may be solved, but maintenance
    and maintainability (particularly where the software needs to be accurate) are
    definitely not.<p>We&#x27;ll probably end up with the same number of software
    people doing a lot more.<p>Eventually, we&#x27;ll end up in a world where custom
    software is mostly building harnesses and verification tools to ensure that the
    agents actually build the correct thing.<p>And we&#x27;ll always need someone
    to interface between the users and the software, as most users don&#x27;t really
