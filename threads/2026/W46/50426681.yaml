  author: antonvs
  text: LLMs learned from their training data, and inferred plenty of things that
    were implicit in that data. We don’t have to spell everything out for them - they
    learn, much as we learn.<p>Intuition is essentially a form of system 1 thinking,
    which is an LLM’s default mode of operation, before it gets into chain-of-thought
    loops and so on. You input a prompt, it’s processed through an enormous network
    of weights, and a result pops out. A model can’t tell you how it did that.<p>That’s
    a big reason why research has shown that LLM chain of thought doesn’t necessarily
    reflect its actual process for arriving at conclusions. It’s exactly “intuitions
    that they can’t quite explain.”
