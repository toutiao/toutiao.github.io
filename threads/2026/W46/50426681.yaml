  author: yallpendantools
  text: "&gt; I also understand the code.<p>and the product, the team, and (no matter
    how shallowly) the organizational pressures and politics. Whether we like it or
    not, those are part of the problems developers solve. Even something as rudimentary
    as knowing what is feasible to test given your deadline isn&#x27;t something you
    can encode in a model[1]. Code does not exist in a vacuum.<p>I say this even with
    the latest models, it seems as soon as your development practice falls out of
    the ideals written up in blogposts of the previous ZIRP decade, you have to <i>course
    correct</i>. I use this term because the AI is technically correct (the best kind
    of correct) but practically useless, if not also irresponsible.<p>Recent anecdote
    (literally today): we&#x27;ve been having Claude write exhaustive test suites
    to eat at the coverage backlog. Lately, we noticed that tests in develop are even
    more flakier than usual. Our whole suite runs in 30-40min but lately it could
    exceed an hour and then fail.<p>It seems Claude took &quot;exhaustive tests&quot;
    to mean &quot;exhaust the compute resources of the Jenkins node&quot;. What&#x27;s
    worse is it wrote those tests for features that have been disabled and would soon
    be rewritten anyway.[1] I&#x27;ve always said that LLMs are great for generating
    test suites and this is the first time an LLM &quot;failed&quot; this assignment
    for me.<p>Code is cheap. The right code (or lack thereof) for the right situation
    takes meatspacebrainpower.<p>[1] The solution here is to run your company&#x2F;team
    100% as agents so they have the full context of project timelines, resources,
    customer feedback, etc. ala stevey and gtan but my reasons why I don&#x27;t believe
    in that has already been articulated elsewhere."
