  text: I don&#x27;t think elites are ever benevolent, but sometimes they do limit
    their abuses out of long-term self-interest.<p>A good example of that is the Roman
    Republic. The elites created a system that gave land out to retiring soldiers
    in parcels that were large enough to make them middle class farmers but not genuinely
    wealthy. That let them churn out absurdly large amounts of heavy infantry that
    no one else could match. That made them slightly less wealthy in the short term
    than if they had just taken all the land for their own estates, but it made them
    immensely wealthy and powerful in the long-term.<p>They were also very welcoming
    to outsiders compared to their contemporaries. Conquered territory was basically
    fully Roman within a few generations (though still keeping many local customs).<p>Contrast
    that to Sparta where the elites held onto every ounce of power with an iron fist,
    keeping most people in slavery, and made it virtually impossible for anyone born
    outside the elite to join it. They ended withering away to practically nothing,
    sometimes fielding armies with only a handful of full citizens commanding it.<p>The
    early 20th century US is another good example. Fear of communism led to many elites
    supporting the expansion of worker&#x27;s rights and the institution of a social
    safety net (FDR and JFK were both from very wealthy families).
