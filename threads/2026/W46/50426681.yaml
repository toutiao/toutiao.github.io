  author: BoxOfRain
  text: The same thing every cruel and capricious ruler has got from it, history is
    littered with example after example of the devil making work for unlimited wealth
    and power. That kind of wealth and power generally becomes self-justifying, humans
    have endless capacity for self-delusion and it is very easy for the powerful to
    convince themselves that their selfish actions no matter how inexcusable are actually
    generous and aligned with the public good. When it comes to outright oligarchy,
    wealth and power are simply aspects of the same underlying phenomenon.<p>At any
    rate, your common masses on basic income are still living under illiberal conditions
    even if their shackles have been thoroughly padded. Liberty isn&#x27;t merely
    the freedom from interference as neoliberal types like to claim, since ancient
    times it has been understood that liberty is the freedom from <i>domination</i>.
    According to the classical formulation a renter in a liberal democracy is still
    not at liberty because their landlord may turf them out on a whim, the wage labourer
    is not at liberty since they may be laid off at the whim of a board who neither
    know nor care to know their name, anyone whose living circumstances depend on
    the continued whim of even a benevolent master is not a free individual. Under
    this framing, the people on basic income would be profoundly unfree since their
    entire lot in life depends entirely on the benevolence of the oligarchs.<p>There
    is a good reason that even the Romans understood this danger even as they failed
    to prevent it. Republics should not suffer private princes, it is a lesson we
    have been failing to learn for over two millennia.
