  author: miki123211
  text: LLMs, and other transformer models before them like BERT for example, have
    the benefit of &quot;transfer learning.&quot;<p>If you want to make a ticket classification
    model, you don&#x27;t need to train across many customers doing ticket classification,
    who might not want you to train on their data and whose data is impossible to
    obtain unless you already are a large company. Instead, you can train on a completely
    different task which forces the model to learn the syntactic and semantic structure
    of the English language — say predicting missing words in Wikipedia articles,
    which you can&#x27;t do successfully without a good understanding of English —
    and then fine-tune that model on your specific task with much less data.<p>Because
    the initial task is so general, you can have one company do the expensive pretraining,
    share the base model, and then have everybody else just do the finetuning on their
    (small) proprietary dataset.<p>LLMs and models like Jev go one step further, letting
    you use them as classifiers with no training at all, with nothing but rules in
    the prompt. And with a few tricks, you can indeed use them to get pretty high-quality
    labels, which you can then distill into a fine-tuning dataset for a much smaller
    model.
  score: 0
