  author: firer
  text: All of these seem to be post-auth, except for CVE-2026-116322 (which doesn&#x27;t
    grant code execution, &quot;only&quot; a DoS).<p>About a year ago I found and
    exploited CVE-2026-2004, which is also a Postgres post-auth RCE, as part of Wiz&#x27;s
    zeroday.cloud competition.<p>I choose that target because it immediately stood
    out as highly complex with lots of user input. In my opinion, it&#x27;s a bad
    idea to define this as a security boundary in the first place. Access to a database
    can very likely lead to code execution - there&#x27;s way too much attack surface.<p>Most
    serious cloud providers rightly sandbox their DB offerings exactly for this reason.
    And this year&#x27;s zeroday.cloud competition no longer has authenticated Postgres
    as a target, exactly for this reason.
