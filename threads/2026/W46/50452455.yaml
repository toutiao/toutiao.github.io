  title: My AI Agents Found an Unmapped Maya Site
  fetch_status: success
  content: "# My AI Agents Found an Unmapped Maya Site\n\n5 min read\n\nBy analyzing
    NASA lidar data, my AI agents discovered a Maya site in Mexico that, as far as
    anyone can tell, no one had reported before. It took **less than 72 hours** to
    go from a random thought while traveling to an official reply from the Mexican
    government. This is by far the best time ever to be alive.\n\n![Lidar of the hilltop
    with the forest stripped away, showing a plaza, a pyramid and platforms](hero-lidar.jpg)Lidar:
    bare ground, 2013\n ![Satellite image of the same hilltop: unbroken forest](hero-satellite.jpg)Satellite
    image today\n\n_Drag the slider. The same hilltop today from a satellite (just
    trees) and in lidar (no trees). Colours show height. Satellite © Esri, Maxar,
    Earthstar Geographics._\n\n_Disclaimer: I'm not an archaeologist._\n\nI'm going
    to tell this story as a diary, because the timeline is probably the best part.\n\n##
    18 October\n\nI was traveling in Peru, Gemini-ing about the history of the place,
    when I learned about [Hiram Bingham](https://en.wikipedia.org/wiki/Hiram_Bingham_III),
    the American explorer who \"discovered\" [Machu Picchu](https://en.wikipedia.org/wiki/Machu_Picchu)
    in 1911. \"What luck!\" I thought. He was actually looking for a different city,
    [Vilcabamba](https://en.wikipedia.org/wiki/Vilcabamba,_Peru), the last refuge
    of the Incas, when a local farmer in the valley below guided him to the ruins.
    \"Imagine if Bingham had our tools,\" I thought. \"What would he do?\"\n\n![Hiram
    Bingham standing at his tent door near Machu Picchu, 1912](bingham-1912.jpg) ![Machu
    Picchu in 1912, partly cleared of vegetation, photographed by Hiram Bingham](machu-picchu-1912.jpg)\n\n_Left:
    Bingham at his tent, 1912. Right: Machu Picchu, photographed by Bingham the same
    year. Public domain, Wikimedia Commons (left, right)._\n\nI brainstormed a bit
    with a few agents (Gemini, ChatGPT, Claude and Grok), and they all said [lidar](https://en.wikipedia.org/wiki/Lidar).
    From above, a ruin in the jungle is just a bunch of trees (like Machu Picchu before
    it was cleared), so satellite photos don't help much. Lidar, instead, fires laser
    pulses through the gaps in the canopy and maps the ground underneath.\n\nSo the
    agents went looking for lidar data. Peru isn't well covered, and hiring a company
    to do a survey meant permits, costs and bureaucracy, so I gave up on that. Then
    I thought: why not the [Maya](https://en.wikipedia.org/wiki/Maya_civilization)?
    Their region is much better covered by public lidar.\n\nThat night, I asked the
    agents to analyze it and went to bed.\n\n## 19 October\n\nI woke up and checked
    the agents' reports. 'DAMN!' They had found lots of villages and other regular
    shapes that looked like structures or houses.\n\n![Grid of eight bare-earth lidar
    views of Maya sites flagged by the agents](maya-sites.jpg)\n_A few of the sites
    the agents flagged overnight. Keep an eye on the bottom-left one._\n\n**So how
    did they do it?** They turned the lidar strips (about 1,200 km² of jungle) into
    images, and 48 agents went through them one by one like very patient archaeologists,
    looking for pyramids, platforms, and plazas while filtering out natural hills,
    sinkholes, and roads. There was no special model or classifier involved: the agents
    literally looked at the pictures, following a precise guide.\n\n> **Me:** That's
    awesome! Please check which of these villages haven't been discovered yet. Search
    both the literature and the archives.\n> \n> _…a few hours later…_\n> \n> **Agent:**
    One major village doesn't seem to have been registered.\n\nThis is the hilltop
    from the top of this post. It sits on the edge of a cliff, under the jungle, and
    it has straight edges and sharp corners. Nature doesn't really do straight lines.\n\nZooming
    in, there's a levelled plaza, an oval pyramid at least 8–12 m tall, a raised courtyard
    attached to it and a flat-bottomed hollow that might have been a water reservoir.\n\n[![Bare-earth
    lidar of the whole hilltop, with a zoom into the civic centre below: plaza, pyramid,
    raised courtyard and possible reservoir](lidar-zoom.jpg)](lidar-zoom.jpg)\n_The
    hilltop with the trees removed (top), and a zoom into its civic centre (bottom)._\n\nAnd
    this is what it looks like in 3D.\n\n_The site in 3D, from the lidar. Heights
    exaggerated ~1.5×._\n\n> **Me:** OK, what should I do?\n> \n> **Agent:** You should
    contact [INAH](https://www.inah.gob.mx/) (Mexico's National Institute of Anthropology
    and History), write a report on your discovery, and check whether the site is
    in their register. Sometimes they have unpublished results.\n> \n> **Me:** OK,
    how do I contact INAH? How does the reporting process work?\n> \n> **Agent:**
    _…instructions for the report… + email addresses_\n> \n> **Me:** OK, please do
    the report.\n\nAnd I went to bed.\n\n## 20 October\n\nI iterated on the report
    a bit, since a few things were off, and translated it into Spanish to improve
    the chances of getting a reply (at least, that's what Claude suggested). I don't
    speak Spanish, so I had to trust the agents on that one.\n\nThe agents also checked
    the raw point cloud, to make sure the shapes were really on the ground and not
    created by the trees. Green dots are leaves, brown dots are the ground.\n\n![Point-cloud
    slices across the site: vegetation returns in green, ground returns in brown](point-cloud-profiles.jpg)\n_Two
    slices through the raw lidar points. Under 10–17 m of forest, the ground (brown)
    traces the plaza, the pyramid and the courtyard._\n\nThen I sent the report to
    INAH.\n\n![First page of the report sent to INAH](report-letter.jpg)\n_The top
    of my letter to INAH. The exact coordinates went in a confidential annex, not
    shown here._\n\n## 21 October\n\nINAH replied: they checked their records and
    found **no registered archaeological site at that location**.\n\n![INAH's official
    reply](inah-reply.jpg)\n_INAH's reply. The highlighted part: \"…no registered
    archaeological site was identified at the location given in your report.\"_\n\nTo
    be clear, it's not official yet. But as far as anyone can tell, nobody had put
    this one on a map before.\n\n## So what was it?\n\nThis part is speculation, from
    a long chat with the agents. It looks like a small Maya civic centre from the
    Classic period (roughly AD 250–900), basically the \"downtown\" of a local elite.
    The plaza is where people gathered, for ceremonies and maybe even a market. The
    pyramid was probably a temple, and the raised courtyard next to it might have
    been where the local ruler lived. The hollow could have been an _aguada_, a rainwater
    reservoir: Maya towns needed them to get through the dry season. Or it's just
    a hole. The three platforms around were probably houses.\n\nI asked Gemini to
    imagine how it looked back then:\n\n[![AI-generated artist's impression of the
    site in the Classic period: a plaza, a small pyramid and a courtyard on a forested
    clifftop, with thatched houses around](reconstruction.jpg)](reconstruction.jpg)\n_How
    it might have looked around AD 700. Generated with Gemini from the lidar layout_\n\nFor
    similar studies, have a look at how NASA's G-LiHT instrument works ([Cook et al.
    2013](https://doi.org/10.3390/rs5084045)) and how lidar collected for environmental
    research can be reused for archaeology ([Golden et al. 2016](https://doi.org/10.1016/j.jasrep.2016.07.029)).
    In 2024, archaeologists found a whole Maya city in Mexico this way ([Auld-Thomas
    et al. 2024](https://doi.org/10.15184/aqy.2024.148)), others used lidar to estimate
    how many people lived in the Maya lowlands ([Estrada-Belli et al. 2025](https://doi.org/10.1016/j.jasrep.2025.105288)),
    and another study found what may have been ancient Maya marketplaces ([Šprajc
    2026](https://doi.org/10.1017/S0956536126100923)).\n\n## What's next\n\nIn the
    report I offered to help with a field check led by INAH. In Mexico, archaeological
    sites are protected by federal law, and any fieldwork needs INAH's authorisation,
    so it's now up to the local INAH centre to decide whether to send a team. If they
    go, I'll post an update.\n\n## What I've learned\n\nYou can just do things. I'm
    not"
