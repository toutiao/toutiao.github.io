  text: TBH the Academic reaction to this could likely be to gatekeep it into oblivion
    over bad faith or ideological reasons given the perceived hostile takeover of
    their domain by &#x27;amateurs&#x27;.<p>We saw this with the Dead Sea Scrolls
    where exclusive control was given to a select group of academics who monopolized
    the research to the point of refusing to release photographs or transcripts for
    nearly 40 years. The Huntington Library eventually had to force their hand by
    releasing their microfiche copies.<p>Again, we saw this with both the Ochtendung
    Skull Fraud and the Piltdown Man fraud - systematically falsifying results for
    clout is an exclusively human pre-occupation.<p>More to the point, in May 2025
    YouTuber MrBeast was allowed to film inside the off-limits areas of Mayan Temples;
    something banned for both locals and normal tourists.<p>Academics posit that strict
    peer review is necessary so as not to allow the hoarding and gatekeeping of knowledge.
    However in matters of verification, faslification, and justification, they are
    derelict in their duty to the other half of that contract. The field only has
    itself to blame if other fields start organically superseding their usefulness
    and eroding their domain exclusivity by proxy of poor governance and ways of working.
