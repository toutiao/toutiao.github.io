  author: TSiege
  text: 'It isn’t about having value or not. Some people in the comments are talking
    about using lidar on the whole world and seeing what agents find. Thats a great
    way to give looters all over the world the heads up so they can rush over and
    steal whatever they can. Any archeological site has valuable information on what
    a slice of humanity’s world used to be. Giving looters a head start means destroying
    that information often permanently.<p>A helpful example might be Heinrich Schliemann,
    a businessman who fancied himself an archaeologist and destroyed much of Troy’s
    history by digging it up as fast as he could. He was so focused on finding treasure
    to prove to world he was a great archaeologist he irreparably damaged the real
    layers that were Troy.<p>From his wiki: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Heinrich_Schliemann?wprov=sfti1#Legacy_and_criticism"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Heinrich_Schliemann?wprov=sfti...</a><p>&gt;
    His excavations were condemned by later archaeologists as having destroyed the
    main layers of the real Troy. Kenneth W. Harl, in the Teaching Company&#x27;s
