  author: roryirvine
  text: The 9 pin printer on the 8256&#x2F;8512 was a great example of the Amstrad
    approach.<p>Mechanically, it was pretty good - albeit a bit slow and noisy. But
    it didn&#x27;t have its own power supply or controller, so instead used the host
    computer for both. This cut costs, and enabled the PCW to do without proper serial
    or parallel ports which was yet another way that Amstrad managed to save money.<p>The
    upshot of driving the printer directly was that you could get full control over
    the stepper motor, allowing it to be used in a &#x27;1 pin&#x27; mode which produced
    a single row of pixels at a time giving a much higher effective resolution. Some
    DTP packages like Microdesign II used this to good effect - I recall the results
    looking better than an Epson 24 pin, at the cost of taking something like 30 mins
    to print a single page!
