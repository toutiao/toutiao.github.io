  author: AkBKukU
  text: This is something I&#x27;ve done a lot of research on and getting timelines
    ironed out. Sony did sell the 3.5in Micro Floppy Disk drive before Matsushita
    and Hitachi were able to get the 3in Compact Floppy Disk on the market, but only
    by months, not years. The Amdek Amdisk III was being shown in 1982 [1] using 3in
    CFD drives. It was being reviewed by publications in 1983 [2]. The drives were
    on the market before Amstrad used them and were very seriously contending with
    Sony [3].<p>The Sony MFD had more industry support than the CFD, but it didn&#x27;t
    hit critical mass until the Macintosh released in 1984. Every single machine before
    that using Sony MFDs failed to widely compete because the drives and disks were
    still too uncommon, aside from HP who had a closed ecosystem. Some (Jonos Escort,
    CDI DOT) even attempted to re-released with 5.25in drives to save the base computer
    design. In 1984 there were still new [4] small floppy formats being introduced,
    it absolutely made sense to still try to use CFD. I would say especially for a
    lower end market aimed at children CFDs would be better as they are more robust.<p>[1]
    <a href="https:&#x2F;&#x2F;books.google.com&#x2F;books?id=ia91vNwYgLIC&amp;pg=PA24&amp;dq=microfloppy&amp;hl=en&amp;sa=X&amp;ved=2ahUKEwiQvuu4mu6BAxWlIEQIHe-lC8IQ6AF6BAhAEAI#v=onepage&amp;q=microfloppy&amp;f=false"
    rel="nofollow">https:&#x2F;&#x2F;books.google.com&#x2F;books?id=ia91vNwYgLIC&amp;pg=PA24&amp;dq=mi...</a><p>[2]
    <a href="https:&#x2F;&#x2F;books.google.com&#x2F;books?id=ui8EAAAAMBAJ&amp;pg=PA75&amp;dq=amdisk+III&amp;hl=en&amp;sa=X&amp;ved=2ahUKEwidss6RhoCYAxUaBrwBHfqhHwsQ6AF6BAgNEAM#v=onepage&amp;q=amdisk%20III&amp;f=false"
    rel="nofollow">https:&#x2F;&#x2F;books.google.com&#x2F;books?id=ui8EAAAAMBAJ&amp;pg=PA75&amp;dq=am...</a><p>[3]
    <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;ComputersElectronics1982-11&#x2F;page&#x2F;n89&#x2F;mode&#x2F;2up"
    rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;ComputersElectronics1982-11&#x2F;page...</a><p>[4]
    <a href="https:&#x2F;&#x2F;books.google.com&#x2F;books?id=lC4EAAAAMBAJ&amp;lpg=PP1&amp;pg=PA78#v=onepage&amp;q&amp;f=false"
    rel="nofollow">https:&#x2F;&#x2F;books.google.com&#x2F;books?id=lC4EAAAAMBAJ&amp;lpg=PP1&amp;pg=PA...</a>
