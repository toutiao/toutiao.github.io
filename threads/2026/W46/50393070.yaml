  text: The Oric Microdisc was a rare peripheral, rather than being built into a computer
    like with the Amstrads.<p>It was originally promised for the Oric-1 (with no details
    about what form it would take) but details were initially vague, with it being
    announced as a 3&quot; drive only around the time of the release of the follow-up
    model (the Oric Atmos). It finally arrived on sale around a year after the Atmos,
    only a few months before Tangerine went out of business. I can&#x27;t imagine
    many were actually sold in the UK, though some probably turned up in France where
    the Atmos was a bit more successful.<p>There&#x27;s a bit of info at <a href="https:&#x2F;&#x2F;www.computinghistory.org.uk&#x2F;det&#x2F;31261&#x2F;Oric-Microdisc-Drive&#x2F;"
