  text: |-
    I agree completely with the substance of the article, but I’m not so sure about the label anthropomorphic software. I think maybe the author of the article senses a problem with it, too:

    LLM agents are the ultimate version of anthropomorphic software. But agents do not have to sound human. I force my agents to not speak like humans for my own sanity. Agents might become the default paradigm of computer user interface in the future. I will miss anthropomorphic software then.

    When I encounter ideal versions of anthropomorphic software as in the examples in the article, I don’t feel like I’m having a conversation with the software, I feel like I’m having a conversation with the human that wrote the software. For example, when the Elm parser prints a message saying, “I got stuck...” I take the word “I” to mean the person who wrote the parser (presumably Evan Czaplicki)—someone I can actually relate to and has a particularly human set of values based on human existence and experience.
    Author’s voice could be a better label. LLMs can write prose and code. Setting aside how well or poorly they do it, they don’t have a singular voice and it’s debatable whether they can even be considered an author.
