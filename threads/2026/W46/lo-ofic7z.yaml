  content: "# AnthropomorphicSoftware\n\nThere are some programs that I like to call
    anthropomorphic software. These programs have copy in the first person that is
    personified. A distinction I would like to make is that LLMs and other conversational
    AI do not count. I will, however, talk about them at the end.\n\nA familiar example
    is Git. Have you ever tried to create a commit on a freshly installed system?
    You might have encountered this error:\n\n    *** Please tell me who you are.\n
    \   \n        Run\n    \n          git config --global user.email \"you@example.com\"\n
    \         git config --global user.name \"Your Name\"\n\nQuite personal for a
    tool whose primary use is to track mistakes.\n\nStart a rebase while Git finds
    an existing rebase in progress. It also says \"run me again\" and \"I am stopping.\"\n\n
    \   I wonder if you are in the middle of another rebase.\n\nIn an interactive
    terminal, mark a revision during bisect before starting the bisect.\n\n    Do
    you want me to do it for you [Y/n]?\n\nMy favourite. During `git bisect`, skip
    enough commits that Git cannot narrow the answer further.\n\n    We cannot bisect
    more!\n\nAdjacently, Git changelogs too are personified:\n\n> \"git fsck\" learned
    to catch NUL byte in a commit object as potential error and warn.\n> \n> CI test
    was taught to build documentation pages.\n\n* * *\n\nThe patch command in --verbose
    mode:\n\n    Hmm... I can't seem to find a patch in there anywhere.\n\n    Looks
    like a unified diff to me...\n\n* * *\n\nGNU tar command:\n\n    Cowardly refusing
    to create an empty archive\n\n* * *\n\nThe Elm programming language is an extreme
    example.\n\n    webpack 5.69.1 compiled with 1 error in 55 ms\n    Detected problems
    in 1 module.\n    -- EXTRA COMMA -----------------------------------------------------
    src/App.elm\n    \n    I am partway through parsing a record, but I got stuck
    here:\n    \n    16| { init = \\_ -> init\n    17| , view = view\n    18| , update
    = update,,\n                                  ^\n    \n    I am seeing two commas
    in a row. This is the second one!\n    \n    Just delete one of the commas and
    you should be all set!\n    \n    Note: If you are trying to define a record across
    multiple lines, I recommend\n    using this format:\n    \n        { name = \"Alice\"\n
    \       , age = 42\n        , height = 1.75\n        }\n\nI like this effect when
    used sparingly, unlike Elm.\n\n* * *\n\nWith this option enabled, sudo will insult
    you if you enter an incorrect password:\n\n    Defaults insults\n\n    team@itsfoss:~$
    sudo apt update\n    [sudo] password for team:\n    When you're walking home tonight,
    and some homicidal maniac comes after you with a bunch of loganberries, don't
    come crying to me!\n    [sudo] password for team:\n    I'm very sorry, but I'm
    not allowed to argue unless you've paid.\n    [sudo] password for team:\n    sudo:
    3 incorrect password attempts\n    team@itsfoss:~$ sudo apt update\n    [sudo]
    password for team:\n    You'll starve!\n    [sudo] password for team:\n    You
    can't get the wood, you know.\n    [sudo] password for team:\n    sudo: 3 incorrect
    password attempts\n    team@itsfoss:~$\n\n* * *\n\nIf you have ever attempted
    Linux From Scratch, you will know that Bash can say \"I have no name!\" in the
    prompt.\n\n* * *\n\nOn September 1, running Nmap with -v makes it wish itself
    happy birthday.\n\nFor 2026, the message expands to:\n\n    Happy 29th Birthday
    to Nmap, may it live to be 129!\n\nIt also wishes users a merry Christmas on December
    25.\n\n* * *\n\nIf you are aware of any more examples, I would be glad to list
    them here.\n\nLLM agents are the ultimate version of anthropomorphic software.
    But agents do not have to sound human. I force my agents to not speak like humans
    for my own sanity. Agents might become the default paradigm of computer user interface
    in the future. I will miss anthropomorphic software then.\n\nMost usage of this
    effect is purely for whimsy and isn't intended to improve the user experience.
    Apple's user interface guidelines prescribe avoiding error messages that contain
    \"uh-oh!\"s and \"oops\"es.\n\n[![](https://www.google.com/s2/favicons?domain=elm-lang.org&sz=64)Compiler
    Errors for Humans (elm-lang.org)](https://elm-lang.org/news/compiler-errors-for-humans)\n\n[![](https://www.google.com/s2/favicons?domain=developer.apple.com&sz=64)Writing
    - Apple Developer Documentation](https://developer.apple.com/design/human-interface-guidelines/writing)"
