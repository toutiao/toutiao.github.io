  author: godelski
  text: |-
    <p><pre><code>  &gt; Why doesn&#x27;t their argument hold up?
    </code></pre>
    Let me quote myself<p><pre><code>  &gt;&gt; I find it odd that so many of them are AI doomers, because that illustrates that you can&#x27;t rely on the future for your ethical credits to mature.
    </code></pre>
    To translate: you can&#x27;t do good for future humans if there are no future humans.<p>The common EA argument is akin to &quot;I can do &#x27;evil&#x27; now, iff (if and only if) I get rich doing so <i>and</i> donate a significant portion of my wealth to create future &#x27;good&#x27;.&quot; This has several assumptions that cannot be meaningfully resolved. The obvious one is what I said earlier: you don&#x27;t know if there is a future. Another is that you don&#x27;t actually know what good in the future is. That requires clairvoyance. Magic. Certainly people can do their best and I&#x27;m sure there&#x27;s at least reasonable judgement, but that is a major gamble in the offsetting[0]. But these are the more obvious issues.<p>I&#x27;ll give you another major one. People aren&#x27;t considering if their &quot;evil&quot; actions now, that make them rich, are also creating that future harm that they&#x27;re trying to prevent. The argument they make actually works both ways. They concentrate on the potential &quot;good&quot; compounding over time but they ignore the potential &quot;bad&quot; compounding over time. So their own logic suggests that you should do as much &quot;good&quot; as you can <i>now</i> because that &quot;good&quot; builds the foundation and compounds for many many people down the line. Even if that good is very minor[1]<p>[0] My earlier language in the previous comment was a bit too vague. I&#x27;m basically saying that EA is promoting the idea similar to &quot;carbon offsets&quot; for ethics. You can probably find more issues with their argument if you look into the issues with carbon offsets. That said, I&#x27;m not against carbon offsets, just like I&#x27;m not against trying to create future good, but I&#x27;m also highly in favor of reducing carbon outputs <i>now</i>.<p>[1] Incidentally this is closer to what I personally believe. If you can&#x27;t do major &quot;good&quot; or struggle to, then do minor &quot;good&quot; when you can. That &quot;goodness&quot; compounds and paves the way for others. I also believe you have an ethical&#x2F;societal duty to do &quot;good&quot; when it comes at little to no cost to you but benefits someone else. I believe the world is composed of billions of tiny actions that all add up over time. So a small act doesn&#x27;t necessarily mean the act is small.
