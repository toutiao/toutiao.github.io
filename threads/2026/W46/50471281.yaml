  author: granthamctaylor
  text: 'Thank you for your comment here: you are proving a very valuable point...<p>Relbench
    is a bad benchmark. They say so on their own site:<p>&gt; The RelBench leaderboard
    uses self-reported prediction files, so we rely on the authors to submit in good
    faith. Submissions must follow the rules.<p>&gt; For a more controlled and transparent
    evaluation on RelBench tasks, please see RelArena.<p>Relbench result publications
    can _easily_ be rigged:<p>- Data Leakage<p>- Self Reported predictions<p>- Overfit
    directly to test data with &quot;impractical&quot; solutions (a million handcrafted
    features)<p>RelArena requires reproducible solutions, prevents hand crafted features,
    prevents data leakage in the close model runtime, prevents arbitrary hyperparameters
    per task.<p>Relbench is basically &quot;trust me bro&quot;'
