  text: I think evolving the harness makes the most sense. Models get swapped as new
    ones come along, and anything learned into weights would be lost. Lessons in the
    harness can carry over.<p>I work in a regulated industry and traceability is extremely
    important. This includes explaining why the system did something and being able
    to undo what it learned. A lesson with its evidence attached can be traced and
    deleted, a weight change not so much.<p>Can you trace a result back to the lessons
    that produced it?
