    connection using a device that emits my TCP options.  <i>(Or this could be a corporate
    SNAT pool or corporate VPN pool.)</i>.<p>Even the most clever MitM <i>(man in
    the middle)</i> attacks become significantly harder to perform.  Leaks happen,
    I reduce the blast radius of the damage.
