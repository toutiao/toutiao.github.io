  author: dingaling
  text: This is all, frankly, nonsense.<p>If you&#x27;re using userspace software
    to  decrypt the keys into memory then it&#x27;s all just security theatre.  Any
    sufficiently motivated actor, ot a comprised package in the software chain, can
    capture your private key in the clear.  Especially if using ssh-agent that keeps
    it resident in memory &#x27;for convenience&#x27;.<p>Proper HSM integration with
    SSH requires challenges signed by the HSM without the private key ever being emitted.<p>Just
    keep your SSH keys on disk, one per remote host, with a different encryption password
    for each target host.  If you&#x27;re worried about threats that can defeat that
    then they&#x27;ll just come to your door and beat the passwords out of you.
