  author: invokestatic
  text: In security threat modeling, you only factor in things that you control when
    determining exploitability or risk. So for instance, when you say “a RAT might
    not work right” or “attackers don’t always use RATs” those aren’t things that
    you control, those are things that an attacker controls.<p>One of the principles
    of threat modeling is that you must assume an attacker is working actively to
    maximize their odds of success. Saying something like “well it would be annoying
    for an attacker to do this” is practically universally rejected by cybersecurity
    professionals especially in the age of AI agents.<p>I disagree that I am posing
    a bunch of “what-ifs”. The threat I am modeling here is how companies get compromised
    all of the time. Living off the land attacks as I’ve described is how companies
    large and small get hacked.<p>Furthermore, you do not need an expensive HSM. Most
    computers nowadays have secure enclaves (TPM) that can be used for this purpose.
