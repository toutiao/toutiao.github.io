  author: stryan
  text: 'Hey I&#x27;m in the middle of doing a very similar thing, though I didn&#x27;t
    go quite as far as OP. I&#x27;m slowly deprecating my old RSA SSH keys and replacing
    them with a combination of Yubikey, Password Manager, and alternative SSH auth:<p>1.
    -sk keys on Yubikeys (with touch enabled) are my primary keys, used for signing
    and always installed on every host I touch&#x2F;etc. I initially planned on using
    the PIV slots on my Yubi&#x27;s to store the SSH keys instead of the built-in
    FIDO2 setup, but I hated having to manage multiple moving parts (like getting
    pscd running on all my clients). The only main benefit of using the PIV slots
    was being able to set the &quot;cache&quot; touch policy: the YK would cache a
    touch for up to 15 seconds so doing something like &quot;signing multiple commits
    during a rebase&quot; would only take one touch instead of num_commits. The side
    benefit would have been getting to re-use the same SSH key across primary and
    backup Yubis. The simplicity of the FIDO setup won out and I decided to treat
    getting annoyed at pressing my Yubikey a bunch of times as a sign I should be
    doing some sort of alternative setup like a dedicated key. Most prominently, I&#x27;ve
    now properly setup my Ansible configs with dedicated deploy keys kept as secrets
    instead of reusing my personal key.<p>2. I use 1Pass and Bitwarden (work&#x2F;personal)
    to store a secondary SSH key that&#x27;s only used for basic Git auth or other
    low-risk tasks. This SSH key is loaded from the Password manager directly into
    ssh-agent via stdin so it never touches my disk; I use fnox to make this backend
    agnostic.<p>3. Work uses Teleport, personal uses Tailscale so I rely on those
    SSH auth most of the time. Nothing much to say here except that Tailscale ssh
    is really convenient :) .<p>I&#x27;ve also setup PAM login and sudo on my machines,
    which brings me back to the old Sun Ray&#x2F;Smartcard days. None of this is really
    to prevent security breaches&#x2F;dedicated attackers or anything, though it certainly
    makes me harder to compromise. I just wanted to make absolutely sure I couldn&#x27;t
    accidentally upload an SSH private key somewhere.'
