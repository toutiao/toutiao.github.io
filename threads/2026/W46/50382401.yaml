  author: palata
  text: The first one sets &quot;no-touch-required&quot; and not the second one, is
    that expected?<p>Anyway, resident key means that you can extract the public key
    from the yubikey. Say someone steals your Yubikey Fido2 PIN <i>and</i> your Yubikey,
    they have everything.<p>Non-resident key means that the attacker needs to get
    that &quot;useless&quot; file you describe, too. And if you lose it, then you
    can&#x27;t use the key anymore.<p>Another difference is that a resident key takes
    space <i>on</i> the Yubikey, so you can&#x27;t have infinitely many. Whereas you
    can have infinitely many &quot;useless&quot; files.
