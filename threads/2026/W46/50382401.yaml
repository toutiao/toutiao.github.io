  author: mshroyer
  text: 'You can use agent forwarding (ssh -A) to make your local hardware-backed
    key available on the VPS.<p>If you&#x27;re using tmux on the VPS this can get
    a little tricky, because by default your tmux panes will inherit your initial
    SSH client&#x27;s SSH_AUTH_SOCK; when you re-attach tmux in a different SSH session
    you&#x27;ll no longer be able to authenticate with the local YubiKey.  But I wrote
    a shell script that hooks into tmux to keep SSH_AUTH_SOCK working correctly with
    this kind of setup: <a href="https:&#x2F;&#x2F;github.com&#x2F;mshroyer&#x2F;socklink"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;mshroyer&#x2F;socklink</a>'
