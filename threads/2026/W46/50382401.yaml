  author: sidneythekidney
  text: |-
    Resident keys have their &quot;metadata&quot; stored on the yubikey, in an exportable way. This means using the same ssh-key on a different computer is as easy as plugging in the yubikey and typing ssh-keygen -K.
    With a non-resident key you’d have to copy the &quot;privatekey&quot;, which contains the metadata needed to use the key, to the other computer first.<p>The downside with resident keys is that someone stealing the yubikey can see what resident keys are on it, and then possibly use those keys (if they aren’t protected). Newer firmware comes with ways to protect against this, but you’d have to enable it.<p>[1] has more details<p>1: <a href="https:&#x2F;&#x2F;developers.yubico.com&#x2F;SSH&#x2F;Securing_SSH_with_FIDO2.html" rel="nofollow">https:&#x2F;&#x2F;developers.yubico.com&#x2F;SSH&#x2F;Securing_SSH_with_FIDO2.ht...</a>
