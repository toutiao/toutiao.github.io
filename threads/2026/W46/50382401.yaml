  author: TacticalCoder
  text: 'Speaking of which I do something cool with my main desktop (an AMD 7700X,
    but whatever). It&#x27;s running Debian and there&#x27;s zero executable with
    the suid bit set. There&#x27;s no <i>sudo</i> command installed. Using &quot;su&quot;
    to su to root is technically possible but it&#x27;s like a 40 characters long
    password, meant to never be entered (and I never ever entered it using su).<p>The
    only way I can get root (short of using a local privilege exploitation exploit
    to gain root) is by logging, using a Yubikey, over ssh, from a dedicated laptop
    that has nothing but a SSH client. So the Yubikey is plugged into the laptop.<p>That
    dedicated laptop has no wifi drivers and is on a dedicated LAN and that dedicated
    LAN only has two machines on it: my desktop and that laptop.<p>The laptop serves
    no purpose other than: <i>&quot;log in as root on the desktop&quot;</i>.<p>Of
    course both that laptop and the desktop have firewalls.<p>This means, yes, I allow
    log in as root using SSH. But password logins are disabled and the only way to
    log in as root using SSH is to use the Yubikey. And the firewall only allow SSH
    attempts to port 22 from the MAC address, IP, and dedicated LAN that corresponds
    to the laptop.<p>In addition to that my main desktop has multiple user accounts:
    but none of those users are allowed to su or sudo.<p>Now, I know, I could use
    Qubes or whatever.<p>But what I explained above is how I do it: even myself I
    cannot get root on my own desktop without my laptop + Yubikey (I&#x27;d need to
    find and enter the 40 chars long root password).<p>When I really need to do something
    as root (and once becoming root becomes extremely hard, suddenly you realize how
    rare are the occasions when you really need to be root), I open my laptop and
    boot it (and because that laptop has no GUI and basically nothing besides a SSH
    client, it boots in three seconds or so).<p>Haters gonna hate but that&#x27;s
    been working totally fine for me since years and years.'
