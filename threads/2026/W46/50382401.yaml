  text: My method reduces the threat of exfiltrated keys when someone or something
    manages to bypass the aforementioned methods without the need to purchase anything
    or use anything proprietary.<p>- One must connect from the correct address and
    with the correct TCP options.<p>So for example I could give you one of my ssh
