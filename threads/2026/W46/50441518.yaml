  text: It is incorrect to name this pixelart. Perhaps diffusion-art. I wouldn’t go
    so far as to call it &quot;slopart&quot;—that would be derogatory.<p>First, it
    has very little in common with the process of creation of actual pixelart imagery,
    as all here on the map is blurred, no pixels are clearly distinguishable.<p>Second
    of all, pixelart is something ppl intent-fully create one layer at a time, very
    often - one pixel a time. Is akin to as embroidery (which pixelart very much resembles),
    and embroidery is not the same as textile produced by a Jacquard Loom. And the
    whole point of embroidery is to do it like this in order to achieve the result,
    not that you cannot do whatever you want with machine textile, and not that we
    don&#x27;t wear it daily, because it was programmed and done by machine.<p>Present
    map is perhaps the third similar attempt at something... which has its value,
    but should be regarded the same as perhaps taking Pink Floyd&#x27;s lyrics and
    progressions recreated in Suno... or rather training a model to play like Pink
    Floyd and then call a diffusion product psychedelic rock.<p>As s.o. who is both
