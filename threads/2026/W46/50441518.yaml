  author: TacticalCoder
  text: 'For those who wonder what that gigantic green garden is, it&#x27;s one of
    the best thing in Valencia: it&#x27;s the path of the old Turia river.<p>But because
    Valencia has regularly seen terrible floods, including floods with many deaths,
    with water reaching as high the second floor of some houses (!), at some point
    it&#x27;s been decided to divert the Turia so that it doesn&#x27;t flow in the
    middle of the city anymore.<p>Many cities have been build along a river and then
    spread on both side of the river: be it Paris, Prague, Brussels, Budapest (literally
    the name of the two sides of the river: Buda and Pest), etc.<p>But Valencia is
    magical in that the river has been diverted and most of the old path of the river
    has been transformed into garden &#x2F; bike paths &#x2F; run track &#x2F; etc.<p>It&#x27;s
    like if you were to take Paris, divert the &quot;Seine&quot; and in its place
    put a gigantic garden.<p>IMO more cities should do just that: Valencia is the
    proof it can be done.'
