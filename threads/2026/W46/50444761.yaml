  author: articulatepang
  text: Looks like gradient boosted trees did really well! XGBoost and LightGBM took
    the top two spots on average error, doing better than the more computationally
    expensive transformer models.<p>They did weaker on low-glucose detection, which
    is pretty bad in this particular case. But it&#x27;s possible that&#x27;s fixable
    by tweaking the loss function to care more about detecting low glucose. As far
    as I can tell, there&#x27;s no structural reason the transformer model did better
    on low glucose, probably just that it was pretrained on a synthetic dataset that
    had more lows than the author&#x27;s data.<p>I love gradient boosted trees because
    they&#x27;re fast, easy to train and unreasonably good at tabular and forecasting
    problems like this one. Of course they can&#x27;t compete with transformers for
    complex tasks like writing code, but they&#x27;re amazing specialists.
  score: 0
