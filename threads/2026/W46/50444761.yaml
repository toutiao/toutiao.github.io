  text: When I began this project my model was indeed being provided time-of-day features
    (they were sinusoidal like in the published literature). Then one day I decided
    to remove it to see what happens. The accuracy didn&#x27;t degrade so I thought
    hmm maybe it&#x27;s because the model can *infer* time-of-day from past blood
    sugar alone? So I attached a time-of-day head to test it and it worked!<p>Interestingly
    I have noticed that I get sleepy when the model&#x27;s predicted clock gets close
    to midnight rather than the actual clock when I travel between time zones.
