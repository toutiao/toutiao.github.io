  author: capyba
  text: Doing keto diets with T1D can be extremely risky because it’s easy to fool
    yourself that you’re getting enough insulin. Diabetic ketoacidosis (how untreated
    T1D kills) stems from generally a lack of sufficient insulin, is characterized
    by a buildup of ketones in the bloodstream (among other things), and requires
    a multi-day hospital stay to treat it, assuming you’re lucky to catch it early
    enough and have access to medical help.<p>I have heard of T1D’s who have done
    this successfully but afaik it’s not a widely encouraged practice. Also, as I’m
    sure you’re aware, it makes social eating way more complicated than most people
    can comfortably tolerate.
