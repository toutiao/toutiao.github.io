  content: "# A Great Old-Timey Game-Programming Hack\n\nBy [Tom Moertel](https://blog.moertel.com/about.html)\n\nPosted
    on \n\nTags: [assembly](../tags/assembly.html \"All pages tagged 'assembly'.\"),
    [6809](../tags/6809.html \"All pages tagged '6809'.\"), [games](../tags/games.html
    \"All pages tagged 'games'.\"), [hacks](../tags/hacks.html \"All pages tagged
    'hacks'.\")\n\nA long time ago, when I was a college undergrad, I spent some time
    working on computer video games. This was in the 8-bit PC era, when the gaming
    hardware was almost impossibly slow by today’s standards.\n\nIt might not surprise
    you, then, to learn that game programmers of yore did all sorts of crazy things
    to make their games run at playable speeds. Crazy, crazy things.\n\nThis is a
    story about one of those things.\n\nWhile I’ve done my best to recall the important
    details, I may have gotten some things wrong. If I have, please forgive me. It
    was a long time ago.\n\n(_Note: This post contains some small images as inline-data
    URLs that some feed readers apparently don’t handle well. If you can’t see the
    images in your feed, click through to the original article to see them._)\n\n_Update
    2013-12-16: There have been lots of great comments about this story on [Hacker
    News](https://news.ycombinator.com/item?id=6913467) and [Proggit](http://www.reddit.com/r/programming/comments/1t05uy/a_great_oldtimey_gameprogramming_hack/),
    as well as [here on the blog](http://blog.moertel.com/posts/2013-12-14-great-old-timey-game-programming-hack.html#disqus_thread).
    Thanks for sharing, everyone!_\n\n### The set-up\n\nA friend of mine, a gifted
    programmer, was nearly finished with a new game. Somehow, he had squeezed into
    a 1980’s-era PC, pretty faithfully, what was at the time a graphically impressive
    coin-op game popular at the arcades.\n\nThe only problem was that his version
    of the game was unplayable. It was too slow, and the choppy motion broke the player’s
    immersion. It was after all a side-scroller.\n\nMy friend, who had been working
    on the game while also taking a full load of college courses, was starting to
    seem a little frazzled. Fearing that he had missed some easy optimization, he
    asked me to take a look at the code.\n\nI did. But there was no easy optimization
    to be had.\n\nThe code was _tight_. Everywhere I looked, he had already done all
    the things I could think of. Loops had been unrolled. Unneeded draws had been
    eliminated. All evidence of waste had vanished.\n\nAnd, with them, our hopes of
    an easy fix.\n\nBut what about a hard fix? A crazy fix?\n\nWell, that was always
    a possibility.\n\nBefore I get to the crazy stuff, however, I should back up and
    explain how graphics hardware worked back then.\n\n### How graphics hardware worked
    back then\n\nHere’s the quick version: The graphics hardware didn’t do jack squat.\n\nOn
    the PC in question, if you wanted to draw something onto the screen, you had to
    do that yourself, byte by byte. No texture mappers, no blitters. Just bytes. Bytes
    that you had to move yourself.\n\nFun.\n\nMy friend’s game spent most of its time
    redrawing the background. (Again: side-scroller.) For every frame, it had to draw
    nearly a screen’s worth of background tiles, shifted for the player’s position.\n\nIf
    my memory serves me, each tile was 28 by 28 pixels. Each pixel was one of 16 colors,
    taking half a byte to represent. Therefore, tiles were represented in memory as
    28 contiguous rows of 14 bytes each. The first 14 bytes represented the first
    row, the second 14 bytes the second row, and so on.\n\nThe screen, however, was
    320 pixels wide by 240 pixels high. In memory, then, a screen buffer was laid
    out as 240 contiguous rows of 160 bytes each.\n\nSo when copying a tile at address
    _X_ onto a screen buffer location starting at address _Y_, you had to copy 28
    rows. To copy each row, you had to copy 14 bytes. Fortunately, the processor for
    this game was a 6809, which had a few 16-bit index registers and delightful “auto-increment”
    addressing modes (sort of like applying the postfix `++` operator to pointers
    in C). That meant you could copy 4 pixels at a time while advancing both the _X_
    and _Y_ registers in passing:\n\n    LDU ,X++ ; read a 2-byte word (= 4 pixels)
    from source tile\n        STU ,Y++ ; write it to screen buffer\n\nTo copy a full
    row, you had to do that seven times, so you might sandwich those lines within
    a 7-count loop:\n\n    LDB #7 ; remaining words <- tile width in words\n    @LOOP\n
    \       LDU ,X++ ; read a 2-byte word (= 4 pixels) from source tile\n        STU
    ,Y++ ; write it to screen buffer\n        DECB ; reduce remaining-word count\n
    \       BNE @LOOP ; loop while words remain\n\nWhen you were done copying the
    row, you needed to advance the destination pointer _Y_ so that it pointed to the
    starting address for the next row you would draw into the screen buffer. Since
    the screen buffer was 160 bytes wide and a tile was only 14 bytes wide, that meant
    you had to add their difference to _Y_:\n\n    LEAY 160-14,Y\n\nAnd, just like
    that, you have copied a row onto the screen.\n\nThat’s one. To copy a full tile,
    you need to do the same thing 28 times. So, in turn, you sandwich _that_ code
    within a 28-count loop.\n\nPutting it all together, and giving names to the important
    numbers, you might end up with a subroutine like this:\n\n    ;;; important constants\n
    \   \n    SCRW = 160 ; screen-buffer width in bytes (= 320 4-bit pixels)\n    TILW
    = 14 ; background-tile width in bytes (= 28 4-bit pixels)\n    TILH = 28 ; background-tile
    height in rows\n    WOFF = SCRW - TILW ; s-b offset from end of one tile row to
    start of next\n    \n    \n    COPYTILE\n    ;;;\n    ;;; Copy a 28x28 background
    tile into a screen buffer.\n    ;;; Arguments:\n    ;;; X = starting address of
    background tile\n    ;;; Y = starting address of destination in screen buffer\n
    \   ;;;\n        LDA #TILH ; remaining rows <- tile height\n    @COPYROW\n        LDB
    #TILW/2 ; remaining words <- tile width in words\n    @LOOP\n        LDU ,X++
    ; read a word (= 4 pixels) from source tile\n        STU ,Y++ ; write it to screen
    buffer\n        DECB ; reduce remaining-word count\n        BNE @LOOP ; loop while
    words remain\n        ;;\n        LEAY WOFF,Y ; advance dst ptr to start of next
    dst row\n        DECA ; reduce remaining-row count\n        BNE @COPYROW ; loop
    while rows remain\n        ;;\n        RTS ; done! return to caller\n\nAnd that
    code would be fine.\n\nIf you didn’t care about speed.\n\n### Caring about speed\n\nKnowing
    that the game is probably going to spend most of its time running that code, you
    do what any good programmer would: start counting cycles. Here’s the inner loop
    again, with setup and finishing, annotated with cycle counts:\n\n    LDB #TILW/2
    ; 2 cycles (set-up)\n    @LOOP\n        LDU ,X++ ; 8\n        STU ,Y++ ; 8\n        DECB
    ; 2\n        BNE @LOOP ; 3\n        ;;\n        LEAY WOFF,Y ; 8 (finishing)\n\nLooking
    at those counts within the loop, you’re not likely to miss that you’re burning
    21 cycles to copy just 4 pixels. To copy a full row, then, works out to 2 cycles
    + (7 iterations) \\* (21 cycles/iteration) + 8 cycles = 157 cycles. Ouch.\n\nBut
    this isn’t your first time at the keyboard. You know what to do. Unroll that loop!\n\n
    \   LDU ,X++ ; 8 cycles\n        STU ,Y++ ; 8\n        LDU ,X++ ; 8\n        STU
    ,Y++ ; 8\n        LDU ,X++ ; 8\n        STU ,Y++ ; 8\n        LDU ,X++ ; 8\n        STU
    ,Y++ ; 8\n        LDU ,X++ ; 8\n        STU ,Y++ ; 8\n        LDU ,X++ ; 8\n        STU
    ,Y++ ; 8\n        LDU ,X++ ; 8\n        STU ,Y++ ; 8\n        LEAY WOFF,Y ; 8
    (finishing)\n\nNow, with the loop overhead reduced to zero – you’ve even eliminated
    the set-up – each row takes only 7 \\* (8 + 8) + 8 = 120 cycles. That’s a 30-percent
    speed-up. Pretty good.\n\nAnd that’s where most programmers probably would have
    left it.\n\nBut not my friend.\n\nHe knew that those `++` operations were costly,
    3 cycles apiece. And, with the loop unrolled, he also knew exactly where each
    word to be read or written was located with respect to _X_ or _Y_. So he cleverly
    replaced those 3-cycle post-increments with exact offsets. They cost only 1 cycle
    a"
