  author: mrandish
  text: 'The clever 6809 PSHU&#x2F;PULS memory copy trick was probably independently
    discovered several times before Tom Moertel discovered it. The game Tom worked
    on was for the Coco 3, which was released in 1986.<p>My first computer was the
    original 4K Color Computer (1981). I learned 6809 assembler on it and worked full
    time programming it for several years, while also running one of the largest users
    groups for it. Traveling to Coco trade shows around the country, I met many of
    the devs writing the most popular Coco games and the trick was definitely known
    by around Summer 1983 as that&#x27;s when the first Rainbowfest was held and I
    heard about there.<p>Around 1983, Steve Bjork (MegaBug &#x2F; Zaxxon Coco) told
    me the devs at DataSoft, the company behind some of the popular 1st party cartridge
    games Radio Shack sold, were using it. I also heard about it in 1984 from Tim
    Jenison (CocoMax). The earliest usage of the trick in a commercial game was probably
    in a Williams arcade game, either Defender (1981) or Joust (1982). A few years
    ago at the Hackers Conference Tim told me he&#x27;d once asked Eugene Jarvis (Joust,
    Defender) about it and Eugene told him after discovering it they&#x27;d nicknamed
    the trick &quot;PUSH-U &#x2F; PUL-Me.&quot; I confirmed this with Sam Dicker (Sinistar
    (1983), Defender) last year during the Amiga 040th anniversary at the Computer
    History Museum.<p>While the basic trick to do a fast software block image transfer
    was discovered separately by several 6809 programmers, I can&#x27;t recall ever
    seeing the Direct Page (DP) register used with it before today. That and some
    of the other refinements in TFA are quite clever additions. I think the Coco&#x27;s
    lack of <i>any</i> hardware sprites, tiles, scrolling or acceleration made Coco
    devs especially desperate, so we had to become masters of software blits with
    PSHU&#x2F;PULS and software sprites with XOR. And since all this was happening
    before Usenet and dial-up BBSes were commonly available, there was no way to share
    cool tricks widely except printed books and magazines.<p>Fortunately, the 6809
    made up for Radio Shack&#x27;s penny-pinching design by being <i>much</i> faster
    than the 6502 and Z80, which were microcoded while the 6809 was implemented directly
    in logic gates. It&#x27;s widely considered the most advanced of all the 8-bit
    CPUs with an especially elegant, orthogonal ISA supporting position independent,
    re-entrant, multitasking code and powerful indirect addressing modes. One little
    known bit of history is that Jef Raskin&#x27;s team at Apple used the 6809 for
    the initial Macintosh prototypes before Steve Jobs managed to cut a steep discount
    deal with Motorola on the workstation-priced 68000 CPU. By 1981, Moto was probably
    starting to realize they&#x27;d been pricing their CPUs far too high, having lost
    the Apple II, Commodore PET, VIC-20, C64 and then IBM PC designs, despite having
    a better chip. Waking up just in time to win, arguably, the LAST big desktop computer
    CPU design... ever? Way to go Moto!<p>2013 Hacker News comments here: <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=6913467">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=6913467</a>'
