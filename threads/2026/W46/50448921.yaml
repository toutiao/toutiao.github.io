  author: RetroTechie
  text: 'A ZX81 works like one of those pre-framebuffer machines:<p>At some point,
    the Z80 cpu jumps into an array that holds character info for each line on the
    screen. Its ULA chip intercepts that instruction fetch, and feeds the Z80 a NOP
    instruction.<p>Character itself is read by the ULA, and output onto the address
    bus. The ROM then outputs the corresponding bit pattern. ULA reads that, and clocks
    it into a shift register: 8 bits parallel in, serial out produces the pixels on
    screen.<p>But here&#x27;s the nifty bit: that ULA stuff is timed to take exactly
    8 cycles of a 6.5 MHz pixel clock. The Z80 runs on 1&#x2F;2 that, so it takes
    the exact same time to execute the NOP (4 cycles). Done -&gt; next instruction
    fetch, ULA ready to grab bit pattern for the next 8 pixels.<p>That&#x27;s how
    screen lines are built on a ZX81. 50&#x2F;60 Hz screen refresh is done by varying
    the # of lines displayed. Downside is that the (already &#x27;slow&#x27;) CPU
    is executing NOPs ~3&#x2F;4th of the time, making for an effective CPU speed of
    ~0.8 MHz.<p>But the scheme was somewhat flexible, and programmers found ways to
    produce high-resolution graphics by (ab)using ROM data for non-text graphics.
    And with a RAM pack you could enjoy full hi-res graphics. All of this in b&amp;w
    only.<p>The follow-up ZX Spectrum added a regular framebuffer with color (and
    even hardware flashing!) in 8x8 pixel blocks. This required a much more complex
    ULA chip though.'
