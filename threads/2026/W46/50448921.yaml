  author: mrandish
  text: "&gt; to learn a trick like this, you&#x27;d either have to talk to someone
    who knew it, or figure it out again.<p>Yes, personal computers were a new thing
    and before the internet, people doing it were pretty much isolated. When I got
    my 4K 8-bit in 1981 no one in my entire extended family&#x27;s social network
    knew anyone who had a computer at home OR used one at work. I&#x27;d excitedly
    tell people &quot;I got a <i>personal</i> computer!&quot;, and they&#x27;d respond
    like I&#x27;d said &quot;I got a <i>personal</i> cement truck!&quot; Just a long
    pause, followed by a puzzled,&quot;Why? What can you do with that?&quot; :-)<p>The
    only computer books the local library had were about programming COBOL on a mainframe
    with punch cards. So I started a local computer club just to find people who knew
    more than I did. And it quickly grew to hundreds of people with some driving more
    than an hour to attend. Users found each other via word of mouth or flyers at
    a computer store and formed into computer clubs, each was basically like an isolated
    island community and we&#x27;d travel to connect with each other. Early BBSes
    helped and when FidoNet got going, as primitive as it was, it could relay forum
    messages across the country in &quot;just&quot; three days! I connected with people
    in the New York and Chicago microcomputer &#x27;islands&#x27; and later traveled
    to meet them at regional shows.<p>Around late 83 I started to get tantalizing
    bits of info passed along by a guy who occasionally came to the club which he&#x27;d
    heard from a magical thing called &#x27;Arpanet&#x27;, because he worked for a
    big defense contractor. It wasn&#x27;t until after 86 those outside large universities
    and mega-corps could even get expensive dial-up access to Usenet. In 1987 I was
    still driving over an hour once a month to a guy&#x27;s house, who&#x27;d driven
    an hour from from <i>him</i> to another guy&#x27;s house, who had free, unmetered
    1200 baud access and downloaded every month&#x27;s set of &quot;Fish Disks&quot;,
    collections of open source utilities, games and source code curated by a guy named
    Fred Fish and posted to Usenet. We&#x27;d chat for half an hour while the disks
    copied onto the blanks I&#x27;d brought and then the next day at the users group
    meeting, people would bring their computers and set up an ad hoc assembly line
    to copy over a hundred sets of disks during the meeting - and I know at least
    three of those disk sets were feeding other users groups.<p>In 1988 it was still
    a long distance call and high per-hour fee when I first got Usenet access but
    I simply couldn&#x27;t wait any longer. Reading COMP.SYS.* was just too awesome.
    Each of those steps from BBSes to Fidonet to monthly disks to Usenet to Internet
    felt like a <i>huge</i> leap for those of us who started out waiting for monthly
    newsletters and hobbyist zines to arrive in the mail. The lack of specialized
    information was frustrating but the silver-lining was it forced everyone to work
    a lot out for themselves. Then when little trickles of info began to intermittently
    flow, we&#x27;d pore over each and every one. Since the 2000s the problem has
    gradually inverted to being buried under low value &#x27;content&#x27; and having
    to sift through it to find value and extract meaning. And now we can just have
    an LLM sift all the slop and then understand... <i>something</i> in a higher dimensional
    space - and enjoy it for us. Yay! We&#x27;re living in the future?"
