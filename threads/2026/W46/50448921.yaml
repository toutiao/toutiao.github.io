  author: sehugg
  text: The 6502 has a more narrow and diabolical version of the 6809&#x27;s PSHS
    trick. The BRK instruction pushes the PC and status register to the stack in three
    consecutive cycles, and is pretty much the only non-interrupt instruction that
    writes more than twice.<p>The Atari 2600 has horizontal object counters that you
    can&#x27;t set directly, but they latch when you write to them, and they set the
    corresponding object to the X position of the beam at that cycle. Pole Position
    requires three of these objects to draw the left&#x2F;right side of the road and
    center line, and they are supposed to meet at the horizon.<p>But the beam moves
    to the right 3 pixels for every CPU cycle, and writing with STA would result in
    each being separated by 9 pixels. What&#x27;s the fix? Move the stack pointer
    to where the object pointers live (the 2600 maps the stack to zero page, where
    the RAM and registers live) and invoke BRK, making sure the BRK vector returns
    you to the next instruction. The object pointers are adjacent, so BRK writes to
    each object pointer on successive cycles, and now each of them is 1 cycle = 3
    pixels apart.
