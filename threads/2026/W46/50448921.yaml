  author: mikewarot
  text: Back in the MS-DOS days, my friend Ward Christensen worked at IBM in Technical
    Sales Support. They had a file informally maintained that listed every single
    product they had for sale, in a format that could be read on a PC. He was really
    good at searching it with his text editor, but he wanted a MS-DOS based stand
    alone program to make it easy to search for his co-workers. Thus was born, PCxREF
    which was a Turbo Pascal based program I wrote, that included search.<p>My first
    pass at it was a naïve search using the built in string matching. Because of the
    size of the file, and the speed of PCs, it would sometimes take more than 30 seconds
    to do a search.  Ward wanted it faster, <i>much</i> faster.<p>I eventually came
    up with an algorithm that took the text you wanted to search for, and changed
    it into a special kind of bit mask, table. It was a table 256 bytes long, initialized
    to zeros.  If the first character of the string you wanted to search for was a
    D, then the first bit of the $44 and $64 mask would be set, to handle case sensitivity.  A
    wildcard * was only 1 character long, but would set all bits for that character.  I
    then used the 8088 XLAT instruction and a very small loop ingest a character of
    the text being searched, use that as an index into the mask table, and AND that
    with the existing flag in a different register, then shifted it, checking for
    CARRY (a match!) and looping if not zero.<p>It took search down to less than 3
    seconds if the whole file was loaded in RAM. The thing we used as a benchmark
    was searching for &quot;DOS TECH REF&quot;, the IBM DOS Technical Reference Manual.<p>I
    can&#x27;t find the code, lost it over the years, but it was one of my coolest
    hacks.
