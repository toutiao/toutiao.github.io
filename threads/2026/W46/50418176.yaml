  text: My experience is it&#x27;s short to get a working tool and long to finish.
    Many 3D modulers (blender for example) have literally 1000s of features. Yes,
    you might not need all of them but you probably need 100s, each with quirks and
    UI&#x2F;UX decisions. Just iterating on camera controls can take days. You get
    an orbit camera working via a prompt. But then find it only zooms in&#x2F;out
    so far because the LLM decided that was ideal. So you prompt to fix that. Then
    you find moving the camera is not zoom aware so it moves in meters per frame and
    when you&#x27;re zoomed in things move too faster. So you prompt to fix that.
    Repeat 10000x. Every feature, extrude, bevel, chamfer, subdivide, select vertices,
    select faces, select edges, etc etc all require this handholding and finese.<p>At
    least that&#x27;s my experience.<p>Small tools with few features is great. a 3D
    modeler is not that.
