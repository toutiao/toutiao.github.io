  text: |-
    It may be invented, but not by him.  It is at least as old as the 1997 film Contact.<p><a href="https:&#x2F;&#x2F;vimeo.com&#x2F;188517388" rel="nofollow">https:&#x2F;&#x2F;vimeo.com&#x2F;188517388</a><p>The description blurb reads:<p><pre><code>  &quot;Since Apollo 13 many people have asked me, &#x27;Did you have suicide pills on board?&#x27; We didn&#x27;t, and I never heard of such a thing in the eleven years I spent as an astronaut and NASA executive,&quot; - Jim Lovell, commander of the ill-fated Apollo 13 mission.

      For this scene, from the movie &quot;Contact&quot;, based off his book, I guess Carl Sagan got inspiration from the Soviet Voskhod 2 mission. Cosmonaut Alexey Leonov said he was given a suicide pill by the authorities, in the event that he might get stuck outside of the Voskhod spacecraft while attempting the very first &quot;spacewalk&quot; or EVA (extra-vehicular activity).

      For NASA&#x27;s options, Gerry Griffin, a former director of the Johnson Space Center in Houston, Texas, corroborated Lovell&#x27;s statement, bluntly adding that if an astronaut truly wished to end his or her life, space provides plenty of opportunities. Outer space is just as effective a suicide agent as a cyanide capsule, perhaps even more so. Exposure to its empty vacuum often results in a blissful loss of consciousness in a matter of seconds. Death by asphyxiation usually follows within two minutes. (from http:&#x2F;&#x2F;www.realclearscience.com&#x2F;blog&#x2F;2013&#x2F;10&#x2F;astronauts-and-suicide-pills.html)

      Uploaded on Oct 23, 2016 at 5:36 am
    </code></pre>
