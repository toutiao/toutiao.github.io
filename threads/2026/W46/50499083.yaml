  author: zugi
  text: 'The people to blame for complicated taxes are Congress and the President.
    Over time Congress slips in all sorts of special taxes and special exclusions
    to support their interest groups. The last time there was a concerted effort to
    simplify the tax code was 1986 <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Tax_Reform_Act_of_1986"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Tax_Reform_Act_of_1986</a>
    .<p>Critics of the 1986 Tax Reform Act said, why bother simplifying the tax code
    when Congress will just make it complicated again? The response was sure, we&#x27;ll
    just need to clean up the tax code again every 20 years or so. Well that&#x27;s
    never happened since.<p>In 2017 many in Congress wanted to simplify the tax code.
    Unfortunately Trump said he didn&#x27;t want to simplify taxes, he just wanted
    to <i>lower</i> them. As one great example, some folks wanted to eliminate the
    State and Local Tax deduction (SALT), which is a complicated deduction. (Example:
    You file federally based on &quot;estimated&quot; state and local taxes, but if
    you get a refund or owe state and local taxes, the next year you have &quot;adjust&quot;
    your prior year&#x27;s deduction.) Instead of eliminating them, the 2017 tax bill
    just phased them out at higher income levels, which just <i>adds</i> complexity
    to an already complex part of the tax code.<p>Certainly the act of <i>filing</i>
    one&#x27;s taxes can be made a bit simpler, but it seems there&#x27;s never any
    incentive behind actually simplifying the tax code itself, because every tiny
    change to the tax code creates winners and losers who object.'
  score: 0
