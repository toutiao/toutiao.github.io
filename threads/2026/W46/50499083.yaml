  text: A few coworkers and I were able to point a combination of Fable and Astra
    at our statements and compute our federal and state taxes. They seem to understand
    W-2 income, K-1 partnership income, rental income, brokerage accounts, backdoor
    Roth rollovers, and late-payment penalties 100%? I even sanity-checked mine against
