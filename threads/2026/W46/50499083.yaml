    I was eligible for first-time penalty abatement, something my accountant did not.
    I don&#x27;t think I&#x27;m going to pay for an accountant for taxes again unless
    my finances become substantially more complicated.<p>Once you&#x27;re confident
    in the federal tax calculation, you can point Claude at Free Fillable Forms through
    Chrome&#x27;s remote-debugging port and e-file your taxes that way. Most states
    (all states?) don&#x27;t have an equivalent. Some of us did Claude + computer
    use + Turbotax Premier. Some of us did Claude + Chrome remote debugging port +
    FreeTaxUSA. It sometimes helps to do both Free Fillable Forms and shell out $20
    for FreeTaxUSA just so another calculator can check your work. But, again, Fable&#x2F;Astra&#x27;s
    numbers were accurate. They certainly made errors along the way, but if you can
    handle the fatigue of reading LLM English and patiently answering every little
    question the models come up with (if I was good at skimming text before this year,
