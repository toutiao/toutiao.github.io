  author: markvdb
  text: You&#x27;ve given the perfect example yourself. Try filling out taxes with
    any of your income sourced from more than one EU member state.<p>Not just labour
    income tax. Try dividend withholding tax on shares from another EU member state.
    How this is taxed is partly determined by bilateral double taxation treaty between
    the EU member states involved, so it&#x27;s a patchwork of different regimes for
    every permutation. There has been an effort to make a tiny sliver of this slightly
    less dog slow, the FASTER directive, &quot;Faster and Safer Relief of Excess Withholding
    Taxes&quot;, officially (EU) directive 2025&#x2F;50. Read about that and cry.<p>Now
    try moving between member states. If you have saved any of your royal IT income,
    you need to consult an expensive fiscal specialist before even thinking of moving.
    Otherwise you risk triggering exit taxes or extreme differences in wealth or capital
    gains taxes.<p>I&#x27;m not even speaking working in one member state while living
    in another, or setting up a company with people living in different member states.<p>In
    short, most EU member states have more advanced tax _declaration_ systems on top
    of _much_ more complicated taxation rules. The declaration systems often paper
    over the complexity of internal EU member state rules if any. Many EU citizens
    also do not trigger the complicated web of intra-member state rules.
