  author: xoa
  text: "&gt;<i>Why these are viewed as &quot;successes&quot; or &quot;heroic&quot;
    baffles me as well.</i><p>Your source of confusion seems to be not recognizing
    that sometimes in life multiple things can be true at once. &quot;Heroism&quot;
    is generally about the actions of the individuals in response to a dangerous scenario,
    not how the scenario came about in the first place. &quot;Success&quot; is more
    overloaded, but can refer to both the overall system in place <i>and</i> the outcome
    of a given dangerous scenario, again separate from what caused that scenario to
    come about. This is near perfectly true in particular if, as is usually the case,
    the ones dealing with merde-hitting-spinning-blades on the ground are not the
    leadership. It may be idiotic, short sighted, lazy, inept leadership that lead
    to the problem (or it may simply be an unforeseen alignment of holes in the cheese),
    but if people on the ground go above and beyond to prevent the worst that&#x27;s
    still heroic of them, personally. And if their efforts work that&#x27;s a success.
    It&#x27;d be pretty strange to insist that the efforts of firefighters shouldn&#x27;t
    be recognized just because somebody else did something stupid that resulted in
    a fire.<p>Yes, it&#x27;s absolutely just as important what comes after. Ideally
    it&#x27;s like the commercial aviation industry, where heroism on the parts of
    flight crews can be recognized <i>and</i> said heroism results in a top-to-bottom
    full systemic investigation and efforts to ensure that ideally nobody will ever
    be heroes in quite that way ever again. And have constant efforts to make sure
    heroism isn&#x27;t ever required in the first place.<p>The opposite extreme of
    some organization using it as an excuse for inaction and cheapness (at least until
    the day arrives when heroic efforts are not enough and a true disaster really
    does occur) is abominable. Even worse, because in that sort of utterly failed
    leadership environment the people on the ground will probably get scapegoated
    too. And it&#x27;s 100% worth acknowledging that there can be a &quot;success
    trap&quot; and Normalization Of Deviance situation here, where heroics keep averting
    the worst which lets bad leadership&#x2F;management escape correction. But it&#x27;s
    a trap precisely because each individual failure can still be bad, up to and including
    literally people dead, so the pressure to succeed is still there each time.<p>But
    if employees, be they civilian or military for that matter, perform far beyond
    the call of duty why would that ever not be heroic?"
