  author: kergonath
  text: "&gt; In a market in which two companies are competitors, and one takes the
    former approach and one takes the latter, which company do you think will still
    be around in ten or twenty years?<p>That is an argument of faith (that companies
    where employees work longer survive more than companies that optimise differently),
    and I am not convinced it is supported by evidence.<p>One could argue that all
    other things being equal, companies with employees doing more hours are more productive
    (even though I seriously doubt that, there are diminishing returns very quickly).
    But then I would argue that if a company drives their employees harder, there
    are leadership and management issues, so other things are not equal. And this
    is associated with younger workers (adaptable: good, inexperienced: less good),
    high turn-over (so, long-term information retention issues) and lower worker satisfaction
    (so the whole thing is self-defeating in the long term).<p>Besides, there are
    many, many factors involved that have nothing to with with working time. Again,
