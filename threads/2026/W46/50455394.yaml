  text: "<i>&gt; With all the business efficiencies we&#x27;ve made with computers
    as devs and IT, we should all be working 3 days weeks, instead a few people are
    so rich they can buy elections.</i><p>It&#x27;s never going to work like that,
    and you don&#x27;t need any dastardly, sinister, or conspiratorial explanations
    for why. It&#x27;s a natural side effect of the market being competitive.<p>When
    tools and technology make people more efficient, some people take that to mean
    they can work fewer hours and get the same job done. Which is true. But other
    people take that to mean they can work the same amount of hours, and get way more
    done. This is also true.<p>In a market in which two companies are competitors,
    and one takes the former approach and one takes the latter, which company do you
    think will still be around in ten or twenty years? Obviously the latter. And that
    pressures people in the former group to demand more output and stable working
    hours so they can remain competitive."
