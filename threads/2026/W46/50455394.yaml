  author: gecko
  text: Generators go on the 17th floor so they can vent out exhaust and heat. Pumps
    need to go in the basement because you can only <i>suck</i> a liquid up by one
    atmosphere, which is something like 30&#x27; for diesel, but you can <i>push</i>
