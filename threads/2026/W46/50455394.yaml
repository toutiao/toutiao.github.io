  text: Not the person you asked, but I&#x27;ve learned that if you&#x27;re not careful
    about what you tell your employers and&#x2F;or coworkers that it will almost invariably
    come back to haunt you in the form of unpaid labor.<p>It took me an embarrassingly
    long time to realize that (my 30&#x27;s), and now I keep my conversations with
    my coworkers very utilitarian and divulge minimal information about myself.  I
    try not to be a dick or anything, I&#x27;m polite enough, but pretty much everything
    I talk about is either directly relevant to work and&#x2F;or so surface level
    as to border on &quot;vapid&quot;.<p>ETA:<p>Just as an example, I used to have
    really bad sleep issues in my 20&#x27;s that would make it so I wouldn&#x27;t
    be able to get to sleep until around 4am, if at all.  I made the mistake of bringing
    that up at work to my manager.   Two weeks later I got a phone call at 3am because
    there was something he wanted to look at and &quot;he knew I would be up&quot;.  I
    <i>was</i> up, but I didn&#x27;t really have much desire to get my laptop out
    and do work.  I liked that job at the time and I liked my manager, so I did it
    anyway, and it wasn&#x27;t until years later did I think about that incident and
    how utterly <i>weird</i> it was that I was sort of being punished for my insomnia.<p>My
    sleep issues have gotten a lot better now, so if someone calls me at 3am I probably
    won&#x27;t hear it because I&#x27;ll be asleep, but I remember that incident now
    and have it constantly spinning in my brain when I chat with coworkers.
