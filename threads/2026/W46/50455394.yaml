  author: cyberax
  text: Diesel fuel has to be periodically filtered (&quot;polished&quot;) by passing
    it through cans of dessicant. It removes accumulated water and prevents bacterial
    growth. There are also biocide additives but they just _extend_ the periods between
    maintenance.<p>That&#x27;s also why it&#x27;s not a great idea to use diesel for
    your backup home generator. It will go bad sooner than you expect, and then you&#x27;re
    left with drums of gunk that you can&#x27;t dispose and can&#x27;t use.<p>And
    gasoline won&#x27;t help you either. It goes bad even faster.<p>Propane tanks
    are the best option they can sit in storage indefinitely.
