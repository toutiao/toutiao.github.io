  author: solid_fuel
  text: |-
    Linus, like anyone else, has been wrong about things before, I&#x27;m not really interested in the appeal to authority here.<p>Two simple facts:<p><pre><code>    1. Reading &amp; understanding code takes longer than writing it the first time.
        2. Caring about what you ship requires *understanding* what you ship.
    </code></pre>
    <i>Therefore</i><p><pre><code>    Using LLMs to write code cannot save you time, because it takes longer to understand what it has written than it would to write it in the first place.
    </code></pre>
    That leaves simple changes like refactorings as the main use of LLMs in responsible development.  Hardly a massive accelerator.
