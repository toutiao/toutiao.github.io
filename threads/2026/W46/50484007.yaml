  author: solid_fuel
  text: "&gt; Point 1 is dependent on the individual and often not the case.<p>Not
    really.  To properly understand code you must have a mental model of what it is
    doing.  You need that model whether you are reading or writing the code.  It is
    easier to build that model while <i>writing</i> the code than while simply reading
    it.  To build the model while reading the code requires having the same understanding
    of the problem and the same approach already in mind, which is almost never the
    case for any moderately complex problem.<p>&gt; Especially in cases where the
    part that takes effort is figuring out the poorly documented syntax&#x2F;api you’re
    stuck with for the task<p>Reading LLM generated code does not avoid this, and
    in fact it is often worse since LLM comments are terrible at getting to the point."
