    continue as planned.”\n\nGuarini Ph.D. students received an annual stipend of
    $49,862.40 for the 2026-2027 academic year, along with tuition remission, health
    insurance and other benefits, according to the Guarini website. The College guarantees
    five years of financial support to students making satisfactory academic progress.
    \ \n  \nGraduate students typically teach “one course in each of their final three
    years of study,” according to the math department graduate student handbook. Starting
    this term, math Ph.D. candidates must also serve as a teaching assistant for one
    term each year after their third year, while first and second-year Ph.D. candidates
    must serve as teaching assistants for three terms a year instead of the previously
    required two, according to the handbook.\n\nThird-year math Ph.D. candidate Jacob
    Lehmann Duke GR said he and his fellow graduate students learned of the suspension
