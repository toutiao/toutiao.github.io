    ’01 and College spokesperson Jana Barnello did not specify when or whether the
    program would resume admissions.&nbsp;\n\nColla wrote in a Nov. 10 email statement
    to The Dartmouth that Guarini “regularly considers how to best invest in graduate
    education.”\n\n“As part of those regular reviews, we are pausing admissions to
    the math Ph.D. program for the 2027-2028 cycle while the School of Arts and Sciences
    conducts a department review,” she wrote.\n\nThe decision to suspend the program
    “was made in close partnership with leaders in the School of Arts and Sciences
    and we look forward to working collaboratively with the department on this review,”
    Colla added.\n\nShe wrote in a Nov. 10 email to current graduate students that
    there “will be opportunities for students to participate in the review” and that
    she would meet with math graduate students and department faculty on Nov. 17.
    Graduate students can also reach out to math department chair Dimitrios Giannakis
    and math professor Vladimir Chernov to share questions and concerns, she wrote.&nbsp;\n\n“While
    I know it is disappointing news that your cohort will not be growing next year,
    I am confident that this approach will allow us to strengthen the experience of
    both our Ph.D. students and the undergraduate students in the department,” Colla
    wrote.\n\nDuring a Q&A at the Nov. 9 general faculty meeting, which The Dartmouth
    attended but was not permitted to record, faculty raised concerns about the suspension.
    Math professor Peter Winkler, who opposed the suspension, said at the meeting
    the decision was communicated to math department faculty on Nov. 6. Winkler declined
    to provide additional comment after the meeting.&nbsp;\n\nThe Ph.D. program’s
    pause follows a national trend of decreasing Ph.D. program seats. Data collected
    from 55 undisclosed research institutions that Ph.D. acceptances dropped 15% in
    2026 from the previous year, even though domestic applications increased.\n\nIn
    a Nov. 10 email to current graduate students, which was obtained and reviewed
    by The Dartmouth, Giannakis wrote that faculty members were “continuing to engage”
    with College administrators to “find a path forward” that would “eventually resume”
    the Ph.D. program.\n\nGiannakis added in the email that Colla and School of Arts
    and Sciences dean Nina Pavcnik would attend a math department faculty meeting
    on Nov. 11 to discuss the suspension.   \n  \n“While I do not expect a reversal
    of the decision to pause admissions, I hope there will at least be a constructive
    dialogue with actionable outcomes,” he wrote.&nbsp;\n\nGiannakis was unable to
    comment by time of publication.\n\nThe Guarini admissions office communicated
    the decision to applicants on Nov. 10, according to an email obtained by The Dartmouth.
    Any materials or recommendation letters that have already been submitted “will
    not be reviewed,” the Guarini admissions office wrote. Applications for the program,
    which typically accepts seven to nine students per year, would have been due on
    Dec. 15, 2026, according to the math department .\n\n“We recognize this is disappointing
    news and we are sorry for the disruption to your plans,” the email to people who
    already submitted application materials reads.   \n  \nOn Nov. 10, Colla wrote
    to current math graduate students that “status and support” for current students
    “are not changing” and that the program will see “every currently enrolled student
    through graduation,” according to an email obtained and reviewed by The Dartmouth.\n\n“Stipends,
    insurance and the five-year funding guarantee all remain in place for students
