  author: analog31
  text: More written material is expected. Consider as a data point the length of
    dissertations. In the 1950s (my parents) they were about 50 pages. In my generation
    (early 90s), 250+ pages. I&#x27;ve heard that they&#x27;ve grown even further.<p>Today,
    many systems are automated. The bureaucrats have shifted from manual processing
    of normal cases, to handling edge cases and failure modes, of which there are
    still many. Among other things, there has been an explosion of academic fields,
    convoluted degree requirements, and funding mechanisms.<p>There are some bright
    spots. In my state, all of the state colleges now have the same entrance requirements,
    same degree requirements, and so forth. The community colleges are integrated
    with the 4-year schools so students can start at one and finish at another without
    losing credits.<p>The private schools are founded on being unique, meaning that
    each one has a bespoke set of rules that have to be navigated and administered.
