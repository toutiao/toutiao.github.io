  author: fooker
  text: You seem to have a weird misunderstanding of what a PhD is.<p>It&#x27;s 3-6
    years of your life spent figuring out everything everyone has ever tried to solve
    a narrow class of problems that you are passionate about, guided by an expert
    on that topic. Without the worry of being able to afford food or rent.<p>Around
    the end, you make a contribution or two to that topic and become one of the top
    experts on the world in the field.<p>People hire PhDs for two reasons, one if
    they really need an expert in that field, or if they want someone who is proven
    to be able to spend a long time on a topic while figuring out and understanding
    what others have been doing there for the last several years.<p>Smartness does
    not have anything to do with the second part here. Without this training to do
    research, you can often train someone to do something technical but all their
    new ideas will likely be those that have been tried and failed 20 years ago.<p>Of
    course you could find exceptional candidates who can do this without a PhD, but
    employers are not in the business of taking low probability chances.
  score: 0
