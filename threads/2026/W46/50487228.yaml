    of &quot;real&quot; pixel art:<p>- <a href="https:&#x2F;&#x2F;www.slynyrd.com&#x2F;blog&#x2F;2022&#x2F;11&#x2F;28&#x2F;pixelblog-41-isometric-pixel-art"
    rel="nofollow">https:&#x2F;&#x2F;www.slynyrd.com&#x2F;blog&#x2F;2022&#x2F;11&#x2F;28&#x2F;pixelblog-41-isometr...</a><p>-
    <a href="https:&#x2F;&#x2F;www.behance.net&#x2F;gallery&#x2F;18524751&#x2F;Pixel-Art-City"
    rel="nofollow">https:&#x2F;&#x2F;www.behance.net&#x2F;gallery&#x2F;18524751&#x2F;Pixel-Art-City</a><p>-
    <a href="https:&#x2F;&#x2F;platform.theverge.com&#x2F;wp-content&#x2F;uploads&#x2F;sites&#x2F;2&#x2F;chorus&#x2F;uploads&#x2F;chorus_asset&#x2F;file&#x2F;13069909&#x2F;eboy_pixorama_2.0.1408639556.gif?quality=90&amp;strip=all&amp;crop=0%2C2.8436018957346%2C100%2C94.312796208531&amp;w=1200"
    rel="nofollow">https:&#x2F;&#x2F;platform.theverge.com&#x2F;wp-content&#x2F;uploads&#x2F;sites&#x2F;2&#x2F;cho...</a>
    (this may look blurry if you zoom in or have a monitor display scale other than
