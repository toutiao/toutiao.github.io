  author: pfg_
  text: Pixel art is generally made out of well-defined pixels that are all on the
    same grid in the same scale. When you zoom in, the pixels look sharp. Pixel art
    usually rarely has anti-aliased lines, whereas every line in Isometric SF is anti-aliased.<p>Comparison
    of how lines look with vs without anti-aliasing:<p>- <a href="https:&#x2F;&#x2F;media.geeksforgeeks.org&#x2F;wp-content&#x2F;uploads&#x2F;20230720100012&#x2F;Anti-aliasing-768.png"
