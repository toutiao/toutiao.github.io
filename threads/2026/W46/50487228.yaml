  author: vunderba
  text: 'I mention this a lot: the two basic post-processing steps you have to do,
    at a minimum, to give genai images even a <i>semblance of pixel art</i> are palette
    reduction and square grid alignment.<p>Unfortunately, the definition of &quot;pixel
    art&quot; like &quot;vibe coding&quot; has been diluted to the point of almost
    being meaningless.<p>If you have a project like this with tens of thousands of
    tiles, you have to run them all through square grid alignment. That process tries
    to pick an optimal square grid and then reduce the image to a discrete set of
    pixels, with each square resolved to a single color.<p>It&#x27;s similar to what
    you do when you shrink an image using nearest-neighbor scaling. As a result, you
    mitigate a lot of the irritating high-frequency noise and fringing that occur
    in these higher-resolution pixel art images from generative AIs.<p>Applying it
    to a project with tens of thousands of images still requires a lot of manual intervention.
    This is what makes separates good pixel art from bad pixel art: even at a low
    resolution of 16x16 or 32x32, it&#x27;s still recognizable.<p>Try taking any of
    the 512x512 tiles from this particular isometric city project (or any of the other
    dozen variants) and feed&#x27;em into Spritefusion and you&#x27;ll quickly see
    what I mean.<p><a href="https:&#x2F;&#x2F;imgpb.com&#x2F;ePXki" rel="nofollow">https:&#x2F;&#x2F;imgpb.com&#x2F;ePXki</a>'
