    composite index of personal and knowledge work._\n\n## Coding\n\nMuse&nbsp;Ember
    is built for the coding subtasks an agent sends off hundreds of times a session:
    reading files, running tests, making targeted fixes.\n\n### Terminal-Bench 4.0\n\nTerminal-Bench
    4.0 results at max reasoning, reproduced from the doc's current chart.. Score\n\n|
