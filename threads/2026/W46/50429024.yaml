  author: GuB-42
  text: Human lawyers, coders, accountants and designers are a lot more than their
    jobs.<p>They are people with common knowledge, a lawyer has to understand carpentry
    to understand how to deal with how a client&#x27;s roof fell off, a coder has
    to understand transportation for writing a travel app, an accountant has to understand
    medicine to do accounting for a pharmacy, a designer has to understand cooking
    to design a toaster. Not expert knowledge, but enough to understand that toasters
    are hot and need electricity.<p>A LLM for people working these jobs also needs
    to have common knowledge, that&#x27;s the whole point of using LLMs, you can prompt
    them with intrinsically ambiguous and incomplete natural language and they are
    supposed to fill in the gaps. And the more common knowledge they have, the better
    they are at it. So why settle for less? If it is an optimization problem, we already
    have the solution, it is the &quot;mixture of experts&quot;, which is better at
    optimizing then having an &quot;lawyer LLM&quot;, &quot;coder LLM&quot;, etc...
    because it is better adapted to the internal structure of the neural network behind
    it.
