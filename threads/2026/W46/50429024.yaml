  content: "Today, we're introducing Muse&nbsp;Ember, our smallest and most efficient
    model designed for complex reasoning execution and the work agents repeat all
    day: tool calls, coding subtasks, routing, extraction, and long document parsing.\n\nMuse&nbsp;Ember
    delivers more intelligence per dollar than Claude Haiku 5.5 or GPT-6 Luna at any
    reasoning setting: it matches Haiku's best score at about a third of the cost
    and beats every Luna setting. It also sits on the efficiency frontier of the full
    Artificial Analysis leaderboard: no model scores higher for less per task.\n\n###
    Intelligence vs. Cost Per Task\n\nArtificial Analysis Intelligence Index against
    cost per task at each reasoning effort, from the raw Artificial Analysis results.
    Muse Ember costs are estimates at proposed pricing.\n\n- xhigh\n- max\n- medium\n-
    high\n- xhigh\n- max\n- high\n- xhigh\n- max\n- Muse Ember\n- Claude Haiku 5.5\n-
    GPT-6 Luna\n\n| Series | Measurement | Value |\n| --- | --- | --- |\n| Muse Ember
    | Cost Per Task (USD) | $0.116 |\n| Muse Ember | Score | 33.9 |\n| Muse Ember
    | Cost Per Task (USD) | $0.136 |\n| Muse Ember | Score | 35.8 |\n| Claude Haiku
    5.5 | Cost Per Task (USD) | $0.092 |\n| Claude Haiku 5.5 | Score | 24.6 |\n| Claude
    Haiku 5.5 | Cost Per Task (USD) | $0.159 |\n| Claude Haiku 5.5 | Score | 29.6
    |\n| Claude Haiku 5.5 | Cost Per Task (USD) | $0.248 |\n| Claude Haiku 5.5 | Score
    | 34.3 |\n| Claude Haiku 5.5 | Cost Per Task (USD) | $0.411 |\n| Claude Haiku
    5.5 | Score | 36.2 |\n| GPT-6 Luna | Cost Per Task (USD) | $0.073 |\n| GPT-6 Luna
    | Score | 21.4 |\n| GPT-6 Luna | Cost Per Task (USD) | $0.104 |\n| GPT-6 Luna
    | Score | 23.3 |\n| GPT-6 Luna | Cost Per Task (USD) | $0.152 |\n| GPT-6 Luna
    | Score | 27.8 |\n\n_Artificial Analysis | November 9, 2026. Each point is one
    reasoning-effort setting. Muse Ember cost at list pricing._\n\n### Muse Ember
    evaluation results\n\n| Evaluation results | Featured model. Muse Ember (max)
    | Claude Haiku 5.5 (max) | GPT-6 Luna (max) |\n| --- | --- | --- | --- |\n| Agents
    | AutomationBench-AAE2E business workflows | Best result. 37.8 | 13.9 | 20.2 |\n|
    Agents' Last ExamEnd-to-end agent tasks | Best result. 61.6 | 57.0 | 57.1 |\n|
    Personal Superintelligence IndexInternal composite index of personal and knowledge
    work | Best result. 46.8 | 36.1 | 37.0 |\n| Coding | Terminal-Bench 4.0Agentic
    terminal coding, best published harness | Best result. 40.9 | 39.2 | 16.4 |\n|
    Coding Agent Index-AACoding in real agent harnesses | Best result. 46 | 37 | 31
    |\n| FrontierCode 2.0-AAReal engineering tasks judged on mergeability | 27.2 |
    Best result. 34.9 | 25.2 |\n| Multimodal | GDP.pdf-AAProfessional work over long
    documents | Best result. 22.8 | 20.8 | Best result. 22.8 |\n| OSWorld 2.1Computer
    use across desktop apps | Best result. 69.5(partial)33.8(binary) | 68.9(partial)27.8(binary)
    | 50.5(partial)17.0(binary) |\n| PerceptionBench (w/ tools)Fine-grained visual
    perception | Best result. 80.6 | 78.6 | 62.8 |\n| General | Artificial Analysis
    Index | Best result. 36 | Best result. 36 | 28 |\n\nFor more details about our
    evaluations, see our [report](/static/muse-ember-evaluation-report \"Muse Ember
    Evaluation Report\").\n\nMuse&nbsp;Ember is available today on the Meta Model
    API, at $0.10 per million input tokens and $0.50 per million output tokens.\n\nIn
    early testing, our partners put Muse&nbsp;Ember to work on the kinds of tasks
    agents repeat all day, from reviewing contracts to writing code.\n\n## Agents\n\nAgents
    spend most of their tokens on many small, structured steps, and Muse&nbsp;Ember
    is built for exactly that. It can carry a business workflow end to end, pulling
    records, calling tools in sequence, and updating systems across apps.\n\nWith
    a 1M-token context window and up to 512K output tokens, it can take in a full
    codebase or document set in a single call.\n\n### AutomationBench-AA\n\nAutomationBench-AA
    results at max reasoning, reproduced from the doc's current chart.. Score\n\n|
    Series | Measurement | Value |\n| --- | --- | --- |\n| Muse Ember (max) | Model
    | Muse Ember (max) |\n| Muse Ember (max) | Score | 37.8% |\n| GPT-6 Luna (max)
    | Model | GPT-6 Luna (max) |\n| GPT-6 Luna (max) | Score | 20.2% |\n| Claude Haiku
    5.5 (max) | Model | Claude Haiku 5.5 (max) |\n| Claude Haiku 5.5 (max) | Score
    | 13.9% |\n\n_Artificial Analysis | November 9, 2026. Strict pass@1._\n\n### Agents'
