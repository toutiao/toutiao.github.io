  author: swatcoder
  text: They&#x27;re not. It&#x27;s an illusion from the composition.<p>If you look
    at the code for each of these (and probably most across models), you can see that
    the drawing elements are organized by concept. Presumably, this helps accuracy
    by keeping attention on one concept at a time, but you end up with a stack of
    conceptualized objects and lose the ability to interleave things.<p>No doubt these
    could all do better with a more thorough and specific prompt that coached them
    <i>away</i> from that technique, but otherwise it&#x27;s a very subtle detail
    that a &quot;thinking&quot; process needs to stumble upon independently.
