  author: shagie
  text: My grandmother used blueberry pie filling for her benchmark of &quot;is this
    store cheaper than that grocery store?&quot;<p>One store has four brands that
    range from $2.99 (on sale from $3.29) to $7.99 (on sale from $9.59).  Another
    nearby store has a single brand at $9.49 that&#x27;s marked as local.<p>Given
    this information, which store likely has the less expensive food?<p>Furthermore,
    it was her marker for inflation - she knew what blueberry pie filling cost the
    previous month, the previous year, ... and many previous years to that.<p>She
    lived in a small town in the rural south that had a general store - any grocery
    store was a forty minute to two hour drive away...<p>It was a consistent thing
    that she could track and measure across the months and decades and compare when
    shopping (is this a store that I get only the essentials for the next week or
    is this a store that I should stock up on and come back to?).<p>So too is the
    pelican, or the raccoon with a radio in a where&#x27;s Waldo style drawing.  It&#x27;s
    something to measure across models that is consistent.<p>Fortunately, none of
    the stores caught onto my grandmother&#x27;s preference for blueberry pie filling.<p>One
    might worry about pelican maxing... or raccoon maxing... and Goodhart&#x27;s law
    gets into the question of &quot;do LLM testers use that for testing too?&quot;
