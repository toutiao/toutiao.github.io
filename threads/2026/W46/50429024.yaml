    9, 2026_\n\n### FrontierCode 2.0-AA\n\nFrontierCode 2.0-AA results at max reasoning,
    reproduced from the doc's current chart.. Score\n\n| Series | Measurement | Value
    |\n| --- | --- | --- |\n| Claude Haiku 5.5 (max) | Model | Claude Haiku 5.5 (max)
    |\n| Claude Haiku 5.5 (max) | Score | 34.9% |\n| Muse Ember (max) | Model | Muse
    Ember (max) |\n| Muse Ember (max) | Score | 27.2% |\n| GPT-6 Luna (max) | Model
    | GPT-6 Luna (max) |\n| GPT-6 Luna (max) | Score | 25.2% |\n\n_Artificial Analysis
    | November 9, 2026_\n\nFor the hardest problems, pair it with Muse Wonder: Muse
    Wonder plans, Muse&nbsp;Ember handles the volume.\n\n## Multimodal\n\nMuse&nbsp;Ember
    natively understands text, images, audio, and video, so agents can read screenshots,
    charts, and scanned documents, or work from voice memos, meeting recordings, and
    video without a separate model. It can work through long real-world documents,
    operate a computer directly from screenshots, and pick out fine visual detail.\n\n###
    GDP.pdf-AA\n\nGDP.pdf-AA results at max reasoning, reproduced from the doc's current
