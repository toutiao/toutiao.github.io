  author: swatcoder
  text: Same reason they&#x27;re all facing right with the same composition, they
    all have three motion lines, they all have a yellow sun and 2-3 blobby clouds,
    they&#x27;re all on two-lane pavement with a white dashed lane separator.<p>And
    the same reason Claude has all its notorious Claudisms in prose.<p>The shorter
    and vaguer a prompt you give to an LLM, the more it fills in further details using
    associations they&#x27;ve developed through training. These are ley lines that
    the models gravitate towards. Diffusion models too.<p>It&#x27;s why lazy AI use
    for creative work always comes across as lazy in the wild and always will.<p>When
    you use AI for &quot;creative&quot; purposes yourself, it feels like magic to
    see a pelican riding a bicycle at all, and you&#x27;re impressed by all those
    cool details it added. But then 10, or 100, or 10M people throw more or less the
    same trivial prompts at it and we start to recognize all those &quot;ley line&quot;
    associations fill in the gaps the same way again and again and again.
  score: 0
