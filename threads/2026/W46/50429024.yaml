  author: ProblemExplorer
  text: 'Meta seems to have designed Ember to be a strong &quot;all round&quot; great
    value model - it dominates most of its class on cost<p>The <i>noncoding</i> results
    on some reports grabbed my attention. Ember also looks like a particularly inexpensive
    option for some agent workflows.<p>On Artificial Analysis, Ember max scored 36
    on the Intelligence Index at ~$0.14 per task, compared with 35 at $8 for Grok
    4.7 xhigh, and 28 at $0.15 for GPT-6 Luna max. Haiku 5.5 max also scores 36, at
    $0.41 per task. These are AA&#x27;s measured costs across its index for those
    specific configurations.<p>That puts Ember in roughly Grok&#x27;s aggregate score
    range at about <i>1&#x2F;55</i> of the measured cost, and ahead of Luna at a similar
    cost! [1]<p>The Vals finance&#x2F;legal results are also particularly interesting:
    comparing Ember with GPT-6.1 Terra, both evaluated at &quot;max&quot; reasoning:<p>-
    Finance Agent v2.1: 63.83% vs 55.96%, at $0.06 vs $1.92 (!) per test. [2]<p>-
    Legal Research Bench: 49.04% vs 25.96%, at $0.06 vs $3.22 (!) per test. [3]<p>-
    HLAB-Vals-1.1: <i>25</i>% vs 1.67%, at $0.12 vs $1.48 (!) per test. [4]<p>Those
    are INSANE score differences, at roughly 1&#x2F;32, 1&#x2F;54 and 1&#x2F;12 of
    Terra&#x27;s respective benchmark costs!<p>Misleadingly, their overall Vals Index
    scores are almost identical: 60.48% for Ember and 60.54% for Terra. Terra also
    scores higher on Vals&#x27; Terminal-Bench 4.0 run: 49.49% vs 39.39%. They arrive
    at similar aggregate scores through quite different strengths. [5][6]<p>For me,
    this reinforces the case for custom, workload specific evals. Broad benchmarks
    have been useful for shortlisting models but choosing between them, calls for
    representative tasks, explicit success criteria and measurements using the tools
    and reasoning settings <i>you</i> actually intend to deploy.<p>I certainly want
    to measure cost per successfully completed task, including retries and escalation.<p>Reusing
    a framework such as Harbor with a custom task suite seems increasingly useful
    here. [7] The aggregate score here gives me a starting point but the tasks I actually
    need done then determines my choice.<p>Goign by the generic benchmarks would confuse
    me to no end and likely burn me out.<p>Great times to be in!<p>[1] <a href="https:&#x2F;&#x2F;artificialanalysis.ai&#x2F;leaderboards&#x2F;models"
    rel="nofollow">https:&#x2F;&#x2F;artificialanalysis.ai&#x2F;leaderboards&#x2F;models</a><p>[2]
    <a href="https:&#x2F;&#x2F;www.vals.ai&#x2F;benchmarks&#x2F;fabv2-1" rel="nofollow">https:&#x2F;&#x2F;www.vals.ai&#x2F;benchmarks&#x2F;fabv2-1</a><p>[3]
    <a href="https:&#x2F;&#x2F;www.vals.ai&#x2F;benchmarks&#x2F;legal_research" rel="nofollow">https:&#x2F;&#x2F;www.vals.ai&#x2F;benchmarks&#x2F;legal_research</a><p>[4]
    <a href="https:&#x2F;&#x2F;www.vals.ai&#x2F;benchmarks&#x2F;hlab" rel="nofollow">https:&#x2F;&#x2F;www.vals.ai&#x2F;benchmarks&#x2F;hlab</a><p>[5]
    <a href="https:&#x2F;&#x2F;www.vals.ai&#x2F;models&#x2F;meta_muse-ember" rel="nofollow">https:&#x2F;&#x2F;www.vals.ai&#x2F;models&#x2F;meta_muse-ember</a><p>[6]
    <a href="https:&#x2F;&#x2F;www.vals.ai&#x2F;models&#x2F;openai_gpt-6.1-terra"
    rel="nofollow">https:&#x2F;&#x2F;www.vals.ai&#x2F;models&#x2F;openai_gpt-6.1-terra</a><p>[7]
    <a href="https:&#x2F;&#x2F;github.com&#x2F;harbor-framework&#x2F;harbor" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;harbor-framework&#x2F;harbor</a>'
