  author: theYipster
  text: 'No it is not. Cars have static MSRPs and then you haggle over the price person-to-person
    at a dealer. Airlines prices are based on markets (literal demand and supply between
    city pairs,) expected load factor, and what can best be described as a min-maxing
    algorithm to minimize spoilage (% of unsold seats when the flight takes off.)
    It&#x27;s all predictive analytics, constraints modeling, and optimization at
    scale while finding opportunities here and there to maximize within local factors.<p>Contractual
    discounts--which corporations do have--are usually balanced by a guaranteed spend
    figure. For small and midsized companies, the spend is often paid in advance,
    to the benefit of the airline, which can carry the float and lock up a portion
    of market certainty.<p>My two cents: I have a deep amount of respect for United&#x27;s
    tech stack. It is the best amongst US airlines and among the best in the world.
    However, this is the wrong move for them, and unless other airlines follow (doubtful,
    since United taking the lead here gives others competitive advantage,) United
    will have to backtrack in a year or two.'
