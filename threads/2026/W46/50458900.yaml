  author: ProblemExplorer
  text: 'The airlines are trying to reduce prices for <i>everyone</i> without giving
    <i>specific</i> people (atleast those who they don&#x27;t deem &quot;worthy&quot;)
    an edge. Here&#x27;s a great, short comment: <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50459444">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50459444</a><p>It&#x27;s
    mostly a commodity, specially for economy class where price matters.<p>After gas
    and grocery, its the most vicious, cut throat business where a customer will switch
    from United to Delta over $5. Unlike gas and grocery they cannot compete on volume
    (even a 747 has a fixed capacity per leg).<p>It sounds counterproductive but personal
    AI agents cause a <i>local optima</i> while overall <i>increasing</i> cost for
    rest of the travelers.<p>For example, if you had an MCP connector to United and
    found a flight from SFO to DEN for $50, the rest of the seats have to go up in
    price to compensate and not just by a few cents because the nominal cost of an
    economy seat is likely $250, not $50.<p>Now United isn&#x27;t against offering
    a $50 flight to customers who they deem &quot;worth it&quot; - they just don&#x27;t
    want it to be <i>anyone</i> who can run an MCP connector. They are just betting
    that the &quot;worth it&quot; will &quot;make it up&quot; in the long run vs.
    a customer who&#x27;s just there for the $50 seat.<p>What happens if you say &quot;screw
    it, I&#x27;ll code my own custom MCP connector to United.com!&quot;<p>Well, eventually
    they will try and block you and then those $50 flights will just be <i>gone</i>
    from the website.'
  score: 0
