  content: "# How I accidentally became a millionaire\n\n \n- ¦ [deceit](/blog/tags/deceit/)\n\nI’m
    Lyra.\n\nI am not a millionaire. I have never been one. And yet, if you were to
    ask Google about it, you might just walk away with the impression that I am.\n\nI
    am a hacker, though. I am a hacker with 14 Chrome CVEs. And I think I am a good
    hacker. But I don’t think I’m the bestest hacker. I don’t believe I’m capable
    of finding a vulnerability that’s worth over a million dollars. And even if I
    were, I don’t think Google would pay that much for a Chromium vulnerability.\n\nContent
    note: Due to the topics discussed, this post contains some examples of AI-generated
    text. Those examples are clearly differentiated. Everything else in this blog
    post is fully human-made - I do not use AI.\n\n## Step 1: Making the million\n\nThe
    story begins with a Chromium vulnerability I reported to Google back in 2022.
    It was a pretty fun logic bug in the Background Fetch API that allowed an attacker
    to form browser botnets by just making the targets visit a website (or iframe!).\n\nDue
    to the rather unusual nature of the vulnerability, it was stuck in limbo for a
    few years until it finally got fixed in February of 2026. Google gave me a $1000
    bounty, and a few months later the bug became public.\n\nActually nevermind, turns
    out it was merely _marked_ as fixed. And thus, yours truly appears in an article
    titled “[Google publishes exploit code threatening millions of Chromium users](https://arstechnica.com/security/2026/05/google-publishes-exploit-code-threatening-millions-of-chromium-users/)”.\n\nAnyways,
    Google makes the bug private again, ships a fix, and wants to make sure that the
    bug is actually fixed for real this time. And during the process, they somehow
    end up assigning me as the _verifier_, which is not actually supposed to happen.\n\n###
    Wait, what’s up with the verifier thing\n\nSo the way reporting security bugs
    in Chromium works is that your reports go to this platform called the Buganizer.
    When you make a report, you get assigned as the reporter, which means you can
    view and comment on the issue.\n\nFrom then on, Chromium developers and Google
    employees will edit the issue as necessary - changing its status, assigning a
    priority/severity, CCing people etc. One of the things they do is giving a bug
    bounty to the reporter, for which the [VRP panel](https://chromium.googlesource.com/chromium/src/+/HEAD/docs/security/life-of-a-security-issue.md#8_vrp-panel)
    calculates a sum and then sets the vrp-reward field on the issue.\n\nAs an external
    reporter, you cannot edit any of those fields. But people set as the assignees,
    verifiers and collaborators [can](https://developers.google.com/issue-tracker/concepts/access-control#expanded_access)!
    And in this case, I was set as the verifier.\n\n### Okay so now you just give
    yourself the million?\n\nPretty much, yeah!\n\nI didn’t immediately realize that
    I had been given the edit access, but looking back at the issue in November I
    found that the UI had some extra buttons I hadn’t seen before, and figured out
    the rest from there.\n\nAt first I just poked around the issue to see what fun
    stuff I could uncover. While doing that, I somehow managed to accidentally click
    on a sudden popup menu, which immediately assigned the issue to a bot account.\n\nRealizing
    my cover had been blown, I decided to just go for it and set the vrp-reward value
    to $1333337, the largest bounty sum in the history of all Google VRP programs.\n\n##
    Step 2: Twitter\n\nHaving achieved my newfound wealth, I decided the next best
    step would be to announce it on the everything app. I made my tweet in two parts
    - first, an announcement of achieving the record bounty, and then a video of me
    changing the vrp-reward value as the punchline.\n\nIn just an hour, the joke tweet
    had already reached 600 likes. Since my intent was to just make a joke and not
    actually deceive anyone, and the tweet was clearly escaping containment, I followed
    it up with a clarification.\n\nNow, Twitter does actually have a feature to combat
    disinformation - Birdwatch (aka Community Notes) is a system that lets people
    add context to misleading posts. And this feature was in fact used on my tweet
    - in just a couple hours, the likes stopped rolling in, and this funky box appeared
    underneath.\n\nAnd this would’ve been the end of it, if it wasn’t for the fact
    that Elon completely fucked up the Community Notes system! You see, this note
    here was generated by an “experimental AI contributor”, and thus, it claimed that
    I had “edited the screenshot [myself]”, which was simply not true!\n\nThis made
    me unhappy. And what do we do when we’re unhappy? We tweet about it!\n\nAnd thus,
    pretty soon, the community note disappeared.\n\n## Step 3: Disinformation machines\n\nFrom
    here on out, the tweet was picked up by an automatically generated AI news-podcast
    thing called _Daily Vibe Casting_, which describes itself as _“A ten-minute daily
    roundup of what cracked \U0001D54F in the last 24 hours.”_ Or in other words,
    it throws trending tweets into a chatbot.\n\nI now had a viral tweet _and_ an
    AI-generated “news” article - both of which claim I made a million dollars and
    show up in Google’s search results.\n\nSo, I performed a Google search.\n\nAnd
    there it was! My little stunt turned into something that Google’s AI believes
    and makes into a story shown to every person searching for the highest Chrome
    bounty. And looking up my name now tells you about me being a millionaire!\n\nThere
    are a bunch of screenshots of this from other people under [this thread](https://x.com/rebane2001/status/2119502972262518840).
    I’ve also seen cases of this affecting ChatGPT as well as Kagi Assistant.\n\n##
    Now what?\n\nSo that is the end of my fun little story. I doubt it was particularly
    surprising to anyone, but I think it’s a good case study on how both social media
    platforms and people’s reliance on AI can be abused to distribute disinformation
    and cause harm.\n\nThis example here, of course, is mostly harmless and just something
    that happened on accident - I wasn’t attempting to mislead people, and it’s not
    really my fault that Google’s AI didn’t read my replies in the Twitter thread.\n\nOne
    could argue that I’m a reputable security researcher with a track record of posting
    truthful information, so this is all moot anyways because I _am_ trustworthy.\n\nBut
    I think this here demonstrates just how fragile and easily abusable our information
    channels are. If I was a threat actor looking to spread disinformation, how difficult
    would it be to pull something like this off intentionally?\n\n### Let’s play pretend\n\nThere
    are many ways to game Twitter. [Its algorithm](https://github.com/twitter/the-algorithm)
    is publicly available, and people have figured out what kind of engagement results
    in what kind of algo boost. Bigger accounts can boost tweets and accounts significantly
    more, so if you’ve got a few of those you can bootstrap new accounts way easier.
    But you can also just make bot accounts and slowly work your way up. And if you’ve
    got a bunch of accounts with reach you win.\n\nAnd oh boy are there a lot of bot
    accounts! Look at, for example, [the tweet this blogpost is about](https://x.com/rebane2001/status/2119178106359763263).
    There are _a lot_ of obvious bot accounts in the replies. Maybe those very same
    accounts are also building reputation and voting on random community notes?\n\nIt’s
    kind of crazy to me that I could just post a tweet and have a community note removed.
    While the community note _was actually_ wrong on a technicality, I’m sure there
    isn’t much preventing a bad actor from doing the same thing I did.\n\nIf I were
    a bad actor, I’d post disinformation that’s difficult to accurately disprove.
    If a community note doesn’t have a good source, or if it’s highly likely to get
    details wrong, it either won’t appear, or will have an easier time disappearing.\n\nAnd
    all you really need to do is get a few tweets with specific keywords trending,
    and you’ve poisoned the search results, which then also poisons the AI.\n\nAnd "
