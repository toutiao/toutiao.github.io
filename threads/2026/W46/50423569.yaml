  author: j_not_j
  text: 'There were several obstacles for me to understand this:<p>1. Press Return
    before logging in.  Simple to remember, but if you don&#x27;t, you get...nothing
    after typing LOGON CMSUSER.<p>2. Use model 3278-4 (which is 80 columns by 43 rows)
    otherwise you get mystery blank screens.<p>3. There is no autoscroll.  After 60
    seconds it will timeout and scroll another screenful.  Otherwise press PA2 for
    the next screenful (useful for lengthy LIST commands.)  To interrupt very long
    output, type HT to halt text.  NOTE: PA2 not PF2.  See &quot;MORE...&quot; at
    bottom right indicating there is more text to scroll.<p>4. The CLI is an overlay
    mount of CP and CMS.  If CMS doesn&#x27;t recognize a command, it gives it to
    CP to process.  Compare Q DISK and Q DASD, the Q DISK result it from CMS, the
    Q DASD result is from CP.<p>5. Use LIST (ISODATE) for more details and modify
    dates.  Abbreviate as L (ISO.<p>6. Redirect Fortran unit 6 to the terminal with
    FILEDEF 6 TERMINAL (BLKSIZE 133) and you may be unsurprised to learn this took
    me three days of searching to find.  Now your LOAD HELLO (START will produce output
    on your screen, not a file.<p>7. There is GCC with two available runtimes; BISON,
    DIFF, DIFF3, as well as PL&#x2F;I, PL&#x2F;360, Pascal and WATFIV for those old
    enough to remember the Waterloo Fortran compiler which had actual usable error
    messages. MINIZIP is there too. No APL, unfortunately.<p>8. I never did manage
    to get Hercules to exchange files via the Punch or Printer logical units.  So,
    no file exchange at all.  If there is a way to get ascii files or binary files
    in or out that would be helpful.<p>9. The 3270 terminal display is programmed
    with special character pairs indicating fixed text, text fields changeable, double-wide
    text, etc.  So far I haven&#x27;t found a way for a C or Fortran program to send
    and receive text from the terminal that can completely control the screen and
    read back the contents.  (A program running under CMS of course.)'
