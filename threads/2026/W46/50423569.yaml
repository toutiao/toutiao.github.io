  text: To learn more about the mystery first character, the search term is “Fortran
    carriage control”. I’m not sure all the choices were ever standardized, but you
    can typically use + (don’t advance the carriage; i.e., overprint the last line),
    0 (double space), or 1 (“form feed” to the next page).<p>I can remember my Fortran
