  author: JdeBP
  text: 'So much here:<p>Notice in EE the use of [F3] to exit as in the original CUA.  As
    I said at <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50026580">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50026580</a>
    .<p>Unix called it &#x27;text&#x27; too.  That&#x27;s why the ETXTBUSY error&#x27;s
    traditional message string is &quot;Text file busy&quot;.<p>It&#x27;s not losing
    the first character from FORMAT because of some magic line printer discard for
    the first character.  It&#x27;s losing the first character because you don&#x27;t
    understand FORTRAN.  FORMAT, as you can see in that example program, uses field
    descriptors to describe formats.  It&#x27;s losing the &#x27;H&#x27; from &#x27;HELLO&#x27;
    because that character means a &#x27;Hollerith string&#x27; follows it, which
    in your case is the Mockney &#x27;ELLO WORLD&#x27;.  (-:  You need an extra &#x27;H&#x27;,
    to start with.<p>In Unix terms, this is akin to the classic mistake of using printf()
    instead of puts() for your Hello program, and using a percent character in your
    string.  In BASIC terms, this is PRINT USING, not PRINT.  And yes, that does mean
    that technically you are holding it wrong.  The text to write should be in the
    list given to WRITE, and FORMAT should just be specifying the field descriptor.<p>Only
    <i>then</i> do you get to the fact that the first column of formatted output specifies
    the number of printer lines to advance.  So you are holding it <i>doubly</i> wrong.  (-:  There
    should be a space after the &#x27;H&#x27; denoting your Hollerith string that
    precedes the &#x27;H&#x27; of your &#x27;Hello&#x27;.  Notice that IBM&#x27;s
    program has a space between the field descriptor &quot;14H&quot; (14 character
    Hollerith string) and &quot;PROGRAM ERROR&quot; (13 character string).  That&#x27;s
    not just random whitespace.  It&#x27;s the first character of the string, it means
    1 line of vertical space, and the string is actually &quot; PROGRAM ERROR&quot;.<p>You
    can get several native versions of REXX for Linux-based operating systems and
    the BSDs, including ObjectREXX and Regina.<p>* <a href="https:&#x2F;&#x2F;pkgsrc.se&#x2F;lang&#x2F;rexx-regina"
    rel="nofollow">https:&#x2F;&#x2F;pkgsrc.se&#x2F;lang&#x2F;rexx-regina</a><p>*
    <a href="https:&#x2F;&#x2F;pkgsrc.se&#x2F;lang&#x2F;oorexx" rel="nofollow">https:&#x2F;&#x2F;pkgsrc.se&#x2F;lang&#x2F;oorexx</a><p>*
    <a href="https:&#x2F;&#x2F;pkgsrc.se&#x2F;lang&#x2F;rexx-imc" rel="nofollow">https:&#x2F;&#x2F;pkgsrc.se&#x2F;lang&#x2F;rexx-imc</a><p>It&#x27;s
    2026, and I just wrote about FORTRAN 66.  Good heavens!'
