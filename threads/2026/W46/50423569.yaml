  author: j_seigh
  text: CMS had some neat stuff at the time. Rexx and exec2 supported the subcommand
    environment.    You could write xedit macros in rexx with edit commands instead
    of system commands.<p>The mini disk letters were your command search order, like
    unix path.  But internally it was a linked list so you could rearrange the order
    it you wanted to.<p>File mode 0 files were supposedly private, you couldn&#x27;t
    see them if you accessed the disk read only.  But the access command ran from
    the transient area, so you could load it, no-op the test for char &#x27;0&#x27;,
    and then execute it to access the file mode 0 files on a read only disk.<p>Mini
    disks supported sparse files.  So if operations didn&#x27;t migrate mini disks
    correctly, you could put a 100 MB file on your 5 MB mini disk (this was the 70&#x27;s),
    that would stop them.<p>There was a diagnose command to read your 3270 terminal
    screen including the field attribute chars which you could replace with markup
    tags so you get screenshots for your documentation.<p>There was a lot of hacking
    going on in IBM at the time.  Just wasn&#x27;t public.  If Peter Capek&#x27;s
    VMNewsletters and some of the internal discussion groups were ever published,
    you  would know.
