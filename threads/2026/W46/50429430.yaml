    wafer.\n\n“This technological milestone further strengthens our leadership in
    power systems. Congratulations and thank you to our passionate team, making significant
    progress in bringing 300-millimeter SiC out of the lab into a manufacturing environment,”
    said Jochen Hanebeck, CEO of Infineon Technologies. “Leadership in power semiconductors
    means continuously pushing technology to the next level. With silicon, gallium
    nitride and now silicon carbide 300-millimeter wafers, we are in a leading position
    to scale semiconductor manufacturing and drive profitable growth.”\n\nThe milestone
    demonstrates the potential of future full-scale industrialization of SiC on 300-millimeter
    wafers. Infineon will plan the 300-millimeter SiC technology and ramp timing in
    close collaboration with its customers and partners, while further executing on
    its 200-millimeter SiC manufacturing roadmap. Advanced SiC power technology provides
    Infineon customers with a cost-effective and secure supply base for automotive,
    renewable energy, industrial and AI data center applications.\n\nSiC is a key
    semiconductor material for highly efficient power conversion. Its material properties
    enable lower power loss, higher power density and efficient operation at high
    voltages and temperatures for example in traction inverters, on-board chargers,
    EV chargers, large scale energy storage and industrial drives as well as uninterruptible
    power supplies. Demand is also rising in AI data centers with new roles for SiC
    in solid-state transformers, circuit breakers and power supply units. Infineon
    addresses these applications with a broad CoolSiC™ portfolio.\n\nIn parallel,
    Infineon has also successfully proofed the feasibility of its Cold Split technology
    with 300-millimeter SiC at its Dresden, Germany, site. Cold Split separates wafers
    from a SiC boule with less material loss and substantially reduced processing
    time than conventional wire sawing, so more wafers can be obtained from the same
    crystal with compared to less capital expenditure. Both developments position
    Infineon well to scale SiC technology in line with market demand and meet the
    evolving needs of its customers.\n\nInfineon manufactures semiconductors based
    on all three relevant materials: silicon, silicon carbide and gallium nitride.
    On 27 October 2026, the company announced an approximately €1.1 billion investment
    in a high-volume manufacturing facility for GaN power semiconductors on 300-millimeter
    wafers in Villach. This SiC achievement extends this approach to a second wide-bandgap
    material and reinforces Infineon’s position as an innovation leader in semiconductor
    manufacturing.\n\n**Infineon at electronica 2026**\n\nInfineon will show the public
    the world's first processed 300-millimeter SiC wafer at the electronica trade
    show in Munich. From 10 to 13 November, Infineon will present innovative and energy-efficient
    solutions for an increasingly intelligent and connected world in Hall C3, Booth
    502. More information is available at [www.infineon.com/electronica](http://www.infineon.com/electronica).\n\nInfineon
    Technologies AG is a global semiconductor leader in power systems and IoT. Infineon
    drives decarbonization and digitalization with its products and solutions. The
    company had around 57,000 employees worldwide (end of September 2025) and generated
    revenue of about €14.7 billion in the 2025 fiscal year (ending 30 September 2025).
    Infineon is listed on the Frankfurt Stock Exchange (ticker symbol: IFX) and in
    the USA on the OTCQX International over-the-counter market (ticker symbol: IFNNY).\n\n##
