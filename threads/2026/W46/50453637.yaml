  author: d4rkp4ttern
  text: |-
    If you only need this on one machine, I&#x27;ve been using my own tool, &quot;aichat search&quot;, for the same thing. It&#x27;s a Rust TUI over a Tantivy index of your Claude Code and Codex sessions. It indexes the session files in place rather than keeping its own copy.<p>On my machine, with ~22 GB of sessions, its index is under 1 GB, while Threads added 8.1 GB after importing the same sessions (it stores each conversation twice: once encrypted for sync, once for search). Agents can use it too (aichat search --json), and from a search result you can resume, or carry the work into a new session.<p><pre><code>  uv tool install claude-code-tools
      brew install pchalasani&#x2F;tap&#x2F;aichat-search   # or: cargo install aichat-search
      aichat search

    </code></pre>
    aichat also has other subcommands for working with sessions: porting one between Claude Code and Codex (or to another provider), rolling over to a fresh session that carries the context, trimming bloated sessions, moving a session to another project or account, etc.<p>No sync across machines; that&#x27;s where Threads is nicer. Also Threads seems to show sub-agent relations and live-status, which mine doesn&#x27;t. I like my TUI interface better though.<p><a href="https:&#x2F;&#x2F;pchalasani.github.io&#x2F;claude-code-tools&#x2F;tools&#x2F;aichat&#x2F;search&#x2F;" rel="nofollow">https:&#x2F;&#x2F;pchalasani.github.io&#x2F;claude-code-tools&#x2F;tools&#x2F;aichat&#x2F;...</a>
