  author: baalimago
  text: 'I suspect this is one of those problems &quot;everyone&quot; has built their
    own solution for. Including me!<p>I built slivingdoc[0] with an alternative approach:
    instead of syncing exact sessions (which are often quite noisy, and not so useful),
    the agents gets a living document with automatic merge conflict resolution backed
    by s3 (&quot;infinite&quot; storage). Idea being that the agents are prompted
    to summarize their context into slivingdoc as normal utf-8 files. So this way
    only you only need to add the stdio MCP server to all your harnesses which supports
    it and it just works!<p>Some harnesses are _super_ hyped about this concept. Codex
    needs no prompting at all to start communicating. I got the idea from enabling
    agentic forums via all the openAI hacks.<p>[0]: slivingdoc.dev'
