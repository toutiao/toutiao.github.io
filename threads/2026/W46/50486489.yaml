  author: saturn8601
  text: Rare was a legendary game publisher in the UK owned at the time by the Stamper
    brothers (some of the richest people in the UK). They developed a culture of people
    working horrendous hours under immense pressure and entire teams quitting after
    a game release. However despite that they would release game after game that would
    become cult classic and historic. Furthermore the teams that would quit would
    often have the skills to develop excellent game studios on their own. Microsoft
    buys them in 2002, institutes &quot;work life balance&quot; and the historic magic
    that they were known for completely vanishes to the point where even Microsoft
    having dumped endless amounts of money loses hope. I don&#x27;t think they have
    released a single historic title on Microsoft platforms since they were acquired
    <i>24 years ago</i>.<p>There is no such thing as a free lunch in life. If you
    want to be top 1% you have to make sacrifices. While I feel for the devs as I
    am one as well, I must also feel bad for the current people to be in a position
    where fans once clamored for every new title transitioning to the public accepting
    the greatness is gone.<p>If you read into NVIDIA&#x27;s history you&#x27;ll know
    how much Jensen set the culture and enforced it.
