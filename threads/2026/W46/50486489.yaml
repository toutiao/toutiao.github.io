  author: Conscat
  text: HR essentially reviews us once at the end of every year. It is primarily our
    managers who oversee our productivity, and they&#x27;re all too busy to micromanage
    anyone (and discouraged from it anyways). There are no quarterly reviews, no regularly
    scheduled layoffs, no extremely deep management hierarchies, etc.<p>Compared to
    Google, Amazon, or Meta, we have a huge amount of freedom as well as very open
    insight into most of what other teams are doing on Slack. I follow several developer
    Slack channels for software I was a fan of prior to onboarding.<p>I read online
    that there isn&#x27;t a standard hiring procedure, but in my interviews they didn&#x27;t
    give me esoteric coding puzzles, they mainly wanted to discuss computers and let
    me yap about my interests. The whiteboard problems were trivial.
