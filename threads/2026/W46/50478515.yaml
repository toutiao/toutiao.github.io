  author: shevy-java
  text: |-
    No, that is a straw man argument; metux already debunked this
    if you go through all the comments he made in the last ~5 years,
    before Red Hat banned him:<p><a href="https:&#x2F;&#x2F;github.com&#x2F;X11Libre&#x2F;xserver" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;X11Libre&#x2F;xserver</a><p>The reality is much simpler. The parent corporations, mostly Red Hat really back in the days, wanted to have more control. And, in some ways, wayland is indeed simpler as a protocol.<p>Also, you write &quot;replacing Xorg is reasonable&quot;. First, I don&#x27;t think it is, but even more importantly than that, wayland is NOT a replacement. It is another display server and protocol. They do not have as goal to be compatible to Xorg at all, so &quot;replacing&quot; is the wrong term here. They indeed broke a ton of things, or rather, required of downstream applications to be rewritten - but the statement that they aim to replace Xorg is not the case. They are simply another display server + protocol at the end of the day. And they won&#x27;t be a full &quot;replacement&quot; feature-wise either, that&#x27;s why using wayland always feels like a dumbed down variant of xorg-server. Admittedly wayland also has a few new features such as the easy restart, but this may come to the new xserver too eventually. One has to wait and see. (The easy restart variant is something I like in wayland; hopefully xserver will have that too eventually. It would be technically possible. Also, xserver already is different to xorg-server, in many ways better too. Neither wayland nor xserver aim for 100% compatibility with the old, venerable xorg-server anymore.)
