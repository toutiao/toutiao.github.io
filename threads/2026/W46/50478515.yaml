  author: sorrywhat
  text: For most commercial software vendors that go out of their way to support Linux,
    it will account for less than 1% of their userbase. It already doesn&#x27;t make
    any commercial sense for them to support it -- in a lot of cases it will be the
    project one or two passionate programmers that ported in their free time, and
    vouched to support it themselves.<p>They already have to deal with the fact that
    if they&#x27;re shipping binaries that they actually want to work, they have to
    compile their own compiler, libc, libc++, Xlib, static link everything, don&#x27;t
    touch anything the system provides, dynamically load the things you can&#x27;t
    get around, test multiple .so paths for different distros, etc, etc, etc...<p>Now,
    on top of that, they&#x27;re being asked to support a second completely different
    Window System layer, that an even smaller percentage of people use (and who mind
    you all also run Xwayland).Unlike X11, Wayland doesn&#x27;t have one de-facto
    standard implementation, and the spec doesn&#x27;t define anything - some common
    functionality is provided through different incompatible extensions, and some
    common functionality is not supported at all.<p>I was trying to set up my VR headset
    for Linux a few week back and I saw [1]. Feature disparity is so bad that Valve,
    the biggest corporate proponent of the Linux desktop, concluded they just can&#x27;t
    support SteamVR on the biggest desktop environment, and basically tells you to
    switch to X or another compositor.<p>That&#x27;s without going into the technical
    insanity of the protocol, like using sockets and a client-server architecture
    for something that can&#x27;t actually run over the network, because Linux developers
    just can&#x27;t envision a form of IPC that doesn&#x27;t pass through the kernel
    and take 2ms, or the fact that the standard client library can&#x27;t be static
    linked by default without you rewriting its build system.<p>If one day X11 dies,
    it will be because Linux has settled on the Win32 API, not Wayland.<p>[1] <a href="https:&#x2F;&#x2F;help.steampowered.com&#x2F;en&#x2F;faqs&#x2F;view&#x2F;18A4-1E10-8A94-3DDA"
