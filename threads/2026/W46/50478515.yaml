  author: shevy-java
  text: |-
    I have no idea what you write, but clearly what you write is absolutely incorrect.<p>See: <a href="https:&#x2F;&#x2F;github.com&#x2F;X11Libre&#x2F;xserver" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;X11Libre&#x2F;xserver</a><p>Also I don&#x27;t understand why you write that pipewire broke with the
    past. That&#x27;s also totally incorrect.<p>Wayland I agree with your statement but that&#x27;s a corporate-controlled project by the GNOMEy overlords, so this is not a surprise (GTK5 will support wayland only; that was one reason why I stopped writing more GTK code).<p>As for your systemd comment: again I have no idea what you write. It does not make any sense. And the word &quot;cohesive&quot; is odd: all the systemd components, of course, form a cohesive unit WITHIN ITSELF from the get go - that was the whole point for the systemd developers to make themselves more important. systemd was never a &quot;replace init only&quot; attempt, they deliberately took over the ecosystem here to leverage more control. And that also, kind of, makes sense for those controlling many computers in a, say, university campus or so; administrators find that some jobs were made easier by that. For me, and many others, systemd brought nothing to the table that was needed. They always built strawmen such as &quot;you may abandon your legacy shell scripts booting your system&quot; - I don&#x27;t use shell scripts in general. All logic I have is done via ruby + yaml files mostly (or, data files that describe the logic in a DSL like manner), so I never had any use case for systemd. As for your claim that you do not have to tinker with systemd: again, I have no idea why you write this. It sounds like a very poor and one-sided attempt to promote systemd. You never had an issue? I had numerous issues whenever I would use systemd, starting from smaller to larger issues. For instance, I remember that my local clock was not well-aligned so I changed it. Then I tested again and noticed the clock did not change. It took me a while to figure out that systemd inserted itself here and ignored my attempt to fix the local clock. Past that point I treated systemd as an invasive virus that attempts to ignore my commands, so off it went. That&#x27;s just one example of many more issues with systemd. The philosophy the systemd devs use is mega-aggressive and incompatible with many other things, including the old UNIX pipe idea as well as &quot;everything is a file&quot;.<p>&gt; We just need someone to break away clean from the cancer that is Gnome&#x2F;GTK and friends.<p>I would not use the term cancer, but I would agree that we could need more flexibility. We simply lack viable options here. Corporations de-facto control
    most of the code here. Or AI. Not a good future really.<p>&gt; Qt and KDE is does not count, they too are very encumbered with legacy. Yes, it will be a grind to get anything working without those, but I could live with a gtk&#x2F;kde shim a la xwayland.<p>Again, no clue what you write here, but let&#x27;s also be realistic: which alternatives to GTK or QT do you see coming up here? Plus, we then have more code for a toolkit. What we need is a meta-toolkit, that can be used in its own right (e. g. without qt and KDE) but also be used in way to allow people to create applications in qt and kde at the same time. One toolkit to rule them all. And it must be as flexible as possible. In many ways it is kind of HTML&#x2F;CSS&#x2F;JavaScript, de-facto really; would be nice to have a way to have something that could target all of the above, but I think the boat has sailed. HTML&#x2F;CSS&#x2F;JavaScript kind of won, and perhaps via webassembly we could at the least use something else other than JavaScript.
