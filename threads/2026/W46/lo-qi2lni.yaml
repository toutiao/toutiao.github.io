  content: "## A C++ Quicksort Faster Than std::sort\n\n_blqsort_ is a very fast quicksort
    algorithm. I am not aware of any other general-purpose comparison-based sorting
    algorithm that is faster on random data. Only specialized SIMD-based algorithms
    are generally faster when dealing with small primitive data types.\n\n### blqsort\n\nThe
    main ideas are branchless partitioning, sorting networks for small partitions
    and robust pivot selection.\n\nThe implementation is available on GitHub under
    the MIT license. There is also a C version of it, including multithreaded versions,
    each as a single header file.\n\n[_blqsort_ on Github](https://github.com/chkas/blqsort)\n\nThe
    following **benchmarks** show the execution times for sorting 50 million random
    `doubles` using different sorting implementations. The measurements were taken
    on an _Apple M1_ system using _Clang_ and on an _Intel i5-9300H Linux_ system
    using _GCC_, both compiled with the `-O3` option.\n\n| Implementation | Apple
    M1 | Intel i5-9300H |\n| --- | --- | --- |\n| std::sort | 1.33s | 4.97s |\n| ipnsort
    ClickHouse C++ port | 0.99s | 2.31s |\n| blqsort | 0.67s | 1.33s |\n\nFor a fair
    comparison, the single-threaded version of `blqs` was used here. On the _M1_,
    the multithreaded versions are roughly another factor of 3 faster. In terms of
    runtime, the _C_ versions differ only very little from the _C++_ version.\n\n*
    * *\n\nExecution times for sorting 50 million of these `structs` with random id
    values.\n\n    struct entry {\n        int id;\n        int value;\n        bool
    operator<(const entry& other) const { return id < other.id; }\n    };\n    struct
    entry data[SIZE];\n    blqs::sort(data, data + SIZE);\n\n| Implementation | Apple
    M1 | Intel i5 |\n| --- | --- | --- |\n| std::sort | 3.45s | 4.10s |\n| ipnsort
    ClickHouse C++ port | 0.98s | 2.63s |\n| blqsort | 0.75s | 1.40s |\n\nAlready
    sorted and reverse-sorted inputs are detected and handled efficiently. Inputs
    with many duplicate keys are optimized as well.\n\n### From Basic Quicksort to
    a Fast Branchless Implementation\n\nThe execution times, unless otherwise specified,
    apply to an _Apple M1_ system.\n\nA small, elegant, recursive quicksort:\n\n    #include
    <cstdio>\n    #include <cstdlib>\n    #include <chrono>\n    \n    constexpr int
    SIZE = 50000000;\n    double data[SIZE];\n    \n    double time() {\n        static
    auto time0 = std::chrono::high_resolution_clock::now();\n        auto t = std::chrono::high_resolution_clock::now();\n
    \       std::chrono::duration<double> diff = t - time0;\n        return diff.count();\n
    \   }\n    \n    void sortq(double ar[], int len) {\n        if (len < 2) return;\n
    \       double piv = ar[0];\n        int mid = 0;\n        for (int i = 1; i <
    len; i++) {\n            if (ar[i] < piv) {\n                mid += 1;\n                std::swap(ar[mid],
    ar[i]);\n            }\n        }\n        std::swap(ar[mid], ar[0]);\n    \n
    \       sortq(ar + mid + 1, len - mid - 1);\n        sortq(ar, mid);\n    }\n
    \   \n    int main() {\n        double t0;\n    \n        printf(\"Sorting %d
    million doubles\\n\", SIZE / 1000000);\n        for (int i = 0; i < SIZE; i++)
    data[i] = rand() / 1024.0;\n    \n        t0 = time();\n        sortq(data, SIZE);\n
    \       printf(\"sortq: %.2fs\\n\", time() - t0);\n    }\n\n    c++ -O1 main.cpp
    && ./a.out\n\n    Sorting 50 million doubles\n    sortq: 4.61s\n\nIf you sort
    the sorted data again, all elements in the partition are greater than or equal
    to the pivot element. The second partition becomes only one element smaller each
    time, and the function is called recursively millions of times, which leads to
    a stack overflow after a few hours.\n\nYou can prevent this with _tail call elimination_.
    That is, the first recursive call remains, while the second is replaced by a loop
    iteration. You now need to ensure that the smaller partition is called recursively.
    So swap them if necessary.\n\n    void sortq(double* ar, int len) {\n        while
    (len >= 2) {\n            double piv = ar[0];\n            int mid = 0;\n            for
    (int i = 1; i < len; i++) {\n                if (ar[i] < piv) {\n                    mid
    += 1;\n                    std::swap(ar[mid], ar[i]);\n                }\n            }\n
    \           std::swap(ar[mid], ar[0]);\n            double* ar2 = ar + mid + 1;\n
    \           int len2 = len - mid - 1;\n            len = mid;\n            if
    (len2 > len) {\n                std::swap(len, len2);\n                std::swap(ar,
    ar2);\n            }\n            sortq(ar2, len2);\n        }\n    }\n\nNow the
    program no longer crashes, but it will take a few days to finish. Because of this
    unfavorable partitioning, the worst-case scenario of _O(N²)_ has become a reality.
    However, insertion sort would not make it any faster either.\n\nLet’s just use
    the middle element as the pivot - then the problem of sorting already sorted data
    will be gone.\n\n    .\n        while (len >= 2) {\n            std::swap(ar[len
    / 2], ar[0]);\n            double piv = ar[0];\n        .\n\nThe only remaining
    risk is that someone intentionally sends specially crafted data to trigger this
    behavior. To eliminate this threat, the pivot point should be selected randomly.\n\nThis
    implementation is sufficient for many purposes and is also reasonably fast. By
    the way, “Lomuto” partitioning is used here. “Hoare” partitioning performs fewer
    comparisons and swaps, but on modern CPUs its cache behavior can be less favorable.\n\nBut
    why write your own implementation when _std::sort_ exists?\n\n    .\n    #include
