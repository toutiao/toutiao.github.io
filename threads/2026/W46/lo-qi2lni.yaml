    \   std::sort: 1.31s\n\nThat’s on ARM Mac - on a x86 system, `std::sort` is only
    about 10% faster.\n\nHow can you make a quicksort run faster than std::sort?\n\n###
    Sorting networks\n\nFor partitions with up to about 20 elements, insertion sort
    is faster than quicksort. But there is something even faster for small partitions:
    _sorting networks_. Each partition size is handled in its own program branch.
    For a partition size of two, the two elements are simply compared and swapped
    if necessary. However, as the number of elements increases, the logic becomes
    increasingly complex.\n\n    inline void sort2(double& a, double& b) {\n        if
    (a < b) std::swap(a, b);\n    }\n    inline void sort3(double& a, double& b, double&
    c) {\n        sort2(a, b); sort2(b, c); sort2(a, b);\n    }\n    inline void sort4(double&
    a, double& b, double& c, double& d) {\n        sort2(a, b); sort2(c, d); sort2(a,
