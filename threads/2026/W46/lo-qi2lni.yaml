    double& b, double& c, double& d, double& e) {\n        sort2(b, c); sort2(d, e);
    sort2(b, d);\n        sort2(a, c); sort2(a, d); sort2(c, e);\n        sort2(a,
    b); sort2(c, d); sort2(b, c);\n    }\n    \n        .\n        while (len >= 6)
    {\n            .\n            .\n        }\n        if (len == 5) sort5(ar[0],
    ar[1], ar[2], ar[3], ar[4]);\n        else if (len == 4) sort4(ar[0], ar[1], ar[2],
    ar[3]);\n        else if (len == 3) sort3(ar[0], ar[1], ar[2]);\n        else
    if (len == 2) sort2(ar[0], ar[1]);\n    }\n\n## When _if_ slows you down, avoid
    it\n\nLet’s consider a simple task: Iterate through an array and copy all numbers
    less than 500 into a new array. A straightforward implementation in _C_ looks
    like this:\n\n    smlen = 0;\n    for (int i = 0; i < 1000; i++) {\n        if
    (numbers[i] < 500) {\n            small_numbers[smlen] = numbers[i];\n            smlen
    += 1;\n        }\n    }\n\nIf the numbers are randomly distributed, the result
    of the `if` condition becomes unpredictable for the branch predictor. This results
    in a high misprediction rate, which severely impacts performance because the processor
    must constantly flush its pipeline and restart execution.\n\nWe can avoid this
    problem by using a branchless approach:\n\n    smlen = 0;\n    for (int i = 0;
    i < 1000; i++) {\n        small_numbers[smlen] = numbers[i];\n        smlen +=
    (numbers[i] < 500);\n    }\n\nAlthough this version introduces an unconditional
    write operation (writing to memory even if the condition is not met),"
