    &gt; Molecules entangled themselves in self-sustaining, self-reproducing loops.<p>Now - one can derive to this conclusion, but the problem is: when you make such a statement, it is only speculation. You have to prove it. And nobody has been able to prove that statement so far.<p>Yes, you can prove that you have the molecules necessary, e. g. under abiotic conditions. But you need to prove it still that this relates to a system where information is stored and transmitted. Which, again, nobody has done so far.<p>Thus, making such a claim, even if logical (because after all you need to assume that life as such, is also logical, from a scientific point of view), you need to explain it. The article does not explain it. The article does not refer to other articles that explain it either.<p>&gt; Over time, these systems became more complex.<p>Ok, that makes sense. Now ... HOW did these systems originate exactly? This is missing. You need to explain the bootstrapping part.<p>&gt; Life invented new ways to move, and to capture, store, and use energy.<p>Ok this is getting worse. Now the author injects &quot;Life&quot; here. What is Life? Did it invent anything? How exactly?<p>Again - we can assume there must be a logical pathway here, if we do not believe in an invisible god writing RNA&#x2F;DNA, but the article totally dodges that question.<p>&gt; Through cycles of birth, reproduction, and death;<p>They seem to refer to a stage where a cell already existed. What about the parts before that point? It is quite easy to go from a cell to anything more complex. The foundation explanation is missing. Even in the RNA world theory.<p>&gt; Then, at some point, life gained a sense of itself<p>Now it is getting worse.<p>&gt; Scientists clashed over which type of molecule — RNA, lipids, proteins, and metabolites are prime suspects<p>That&#x27;s not really true. Which theory claims that lipids played
