  text: In one sense, it is. Regardless of its origins (i.e. Consciousness vs. Mind,
    Emergent property of biological system etc.) we emote&#x2F;feel&#x2F;think&#x2F;act&#x2F;live
    subjectively in our mind and thus it has a distinct identity of its own which
    must be managed on its own terms.<p>In Hindu philosophies, the concept of &quot;Mind&quot;
    is defined as <i>Antahkarana</i> i.e. inner organ (<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Antahkarana"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Antahkarana</a>)
    with three specific aspects viz. 1) Ahamkara (Self-Identity&#x2F;Ego&#x2F;etc.)
    2) Buddhi (Intellect&#x2F;Reasoning&#x2F;Rationality&#x2F;etc.) 3) Manas (Sensing&#x2F;Perception&#x2F;etc.)<p>Note
    that the above is a logical&#x2F;functional mapping and not a physical one. However
    it is interesting to also note that Hindu philosophies (specifically Samkhya)
    say that though mind is subtle it is just another evolute of Nature (aka Prakriti)
    and thus subject to its laws. There is a very distinct separation between Consciousness&#x2F;Awareness
    (aka Purusha and not part of nature&#x2F;prakriti) and Mind (evolute of prakriti).<p>This
    actually maps very nicely with the biological idea that consciousness is an emergent
    property of the complex biological organism and hence distinct for each organism.
    Samkhya simply states it as an axiom.<p>The key point is to separate out the contents
    of awareness from awareness itself. I can affect your mind (i.e. contents of awareness)
    with psychedelics but not your true consciousness. Coma patients in a vegetative
    state can have parts of their mind shutdown but their consciousness is still very
    much &quot;there&quot;.
