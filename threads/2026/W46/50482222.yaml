  author: rf_physics
  text: |-
    If I can expand on why I like this - my understanding from the article is that two realizations came from experiments:<p>1. No one could produce any plausibly simple self replicating RNA structure<p>2. Chance events that generate biologically relevant molecules generate them in huge varieties. So restricting yourself to only one type of molecule isn&#x27;t necessary.<p>A third point that I&#x27;ve heard before but isn&#x27;t mentioned in the article - there&#x27;s also no reason that the original life needs to resemble anything found today. Even basic candidates like RNA or lipids soups are essentially free food in today&#x27;s environment.<p>As I understand it, the best we could hope for is demonstrating in the lab a series of &#x27;realistic&#x27; chemical reactions that generate molecules that can both reproduce and mutate, and perhaps more ambitiously that such molecules mutate and eventually begin to build RNA, DNA, proteins. There&#x27;s no guarantee that such an experiment even exists (real world timescales and sheer magnitude means that the chance event could be extremely low), so even this best case condition isn&#x27;t possible. But given this fact and 1&amp;2, I thought their experiments in the latter half of the article on a minimal set of amino acids, and on self-catalyzing and seemingly mutating benzene rings were interesting ways at trying to make some potential progress.<p>About competing molecules, they mention in the article:
    &quot;There was also a lipid world, in which the molecules that form cell membranes and contain cellular chemistry came first. There was a protein or peptide world, a virus world, a coenzyme world, a zinc world, and even a clay world&quot;
    This is outside my field of expertise so I can&#x27;t verify this, though I&#x27;ve heard people talk about lipids being more necessary since they make small enclosed environments for all the interesting chemical reactions to happen.<p>I saw your other comment and I agree there are plenty of pretty stupid sounding phrases. I take this for granted (quanta has plenty of this, and my own university adopts the stupidest slogans imaginable). But regardless I do appreciate learning a bit about recent progress field I wouldn&#x27;t normally read on. I also didn&#x27;t get much from astrobiology sections - more interested in the chemistry parts.
