  text: 'Good article, longish but worth the read.<p>It is just amazing that while
    we know the constituents of all earthly matter (made up from the elements of the
    periodic table) to a high degree of precision we still don&#x27;t have a definite
    idea of how they give rise to &quot;Life&quot; (the definition itself is problematic).
    Molecular systems undergoing chemical processes somehow give rise to &quot;Biology&quot;.<p>As
    the article says, &quot;Life&quot; needs a &quot;compartment&quot; (i.e. cell)
    to begin and grow. It must hold 1) a mechanism to store information (for further
    propagation) 2) a mechanism to generate energy and do work 3) a mechanism to evolve
    further. variations.<p>You start with a chemical soup with various elements&#x2F;molecules&#x2F;ions
    in various levels of concentration, provide energy to the system to encourage
    reactions and see what happens.<p>Applying &quot;Complex Systems Science&quot;
    theories tells us that at a certain scale and with right set of conditions a &quot;primordial
    cell&quot; maybe formed. Note that there might be multiple types of these cells.<p>Once
    this happened it started influencing the very chemical reactions in which it could
    participate using feedback loops i.e. starts exhibiting &quot;functions&#x2F;behaviours&quot;.
    To understand this part, i found the book <i>Vehicles: Experiments in Synthetic
    Psychology by Valentino Braitenberg</i> which shows how &quot;complex perceived
    behaviour&quot; can arise from extremely simple rules, useful - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Braitenberg_vehicle"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Braitenberg_vehicle</a><p>Add
    &quot;survival of the fittest&quot; over time and you get to where we are today.'
