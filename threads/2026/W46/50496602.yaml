  author: pessimizer
  text: '&gt; they have a more recent one which was much closer to an oppressive techno-surveillance
    state (Stasi).<p>The Stasi were low-tech card catalogs and blackmail.<p>The Nazis
    used IBM, and digitized census data that had already been collected and was just
    there to be used.* Places without extensive census data are where Jews survived.
    Plenty of people didn&#x27;t even know they were &quot;Jewish&quot; until the
    Nazis told them.<p>It absolutely maps to GDPR. I bet that if you pulled a few
    good sources of private data, you could map every single e.g. homosexual in the
    US, with few false positives or negatives. This could still happen if we passed
    a privacy law tomorrow, and only used data collected until today.<p>The odds are
    very much non-zero that this will happen. It should be illegal to collect and
    trade in massive collections of dossiers on US citizens. The government can just
    buy them. Weird how we could see it as bad when it was anti-Chinese propaganda
    about &quot;social credit,&quot; but Americans don&#x27;t know that it&#x27;s
    illegal in just about every country in the world to collect and make decisions
    based on dragnet &quot;credit ratings&quot; like we do here.<p>The problem with
    GDPR is that Europeans don&#x27;t control anything; and they don&#x27;t really
