  author: AnthonyMouse
  text: "&gt; This puts often overlooked initiatives like GDPR in a completely different
    light to me.<p>The problem with initiatives like GDPR is that they don&#x27;t
    actually solve the problem. If you&#x27;re worried about the SS then a law that
    tries to tell companies what they can do with some data is totally useless, because
    the thing you need is for the companies to not <i>have</i> the data.<p>If Apple
    can run code as root on every iPhone then when the SS comes, the SS can run code
    as root on every iPhone. They go to Apple and put a gun to their head, or infiltrate
    the company with operatives, and then do what they please with the central control
    the company already holds.<p>To prevent that you need to change the <i>architecture</i>
    of the systems in popular use to remove central chokepoints that authoritarians
    could use for censorship and surveillance. But none of those initiatives have
    accomplished that, and most of them don&#x27;t even attempt it, even though that&#x27;s
    the thing you&#x27;d need them to do.<p>You need &quot;no chokepoints&quot; to
    be the pre-existing default when the baddies come so that when they try to change
    it, people can already see why they shouldn&#x27;t and refuse to give up the existing
    systems without it. Instead of needing to <i>develop</i> those systems only after
    the need arises, and then needing to do it under a hostile regime which is meanwhile
    using the existing systems to commit atrocities."
