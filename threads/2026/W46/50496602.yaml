  author: Silhouette
  text: 'The Internet was in many ways a better place before data capitalism came
    along so the likes of Google and Facebook could monetise.<p>We had email and it
    worked just fine. You got an account via your ISP or paid a small amount for a
    separate service and perhaps a custom domain that you controlled yourself. Centralising
    this with the likes of Google is not progress.<p>We had more content than anyone
    could ever consume in a lifetime on the Web even back then. It was mostly created
    by people interested in sharing for personal satisfaction and perhaps the enjoyment
    of a good discussion that followed or by organisations that benefitted from sharing
    that information freely. It wasn&#x27;t done with a direct profit motive based
    on metrics like page views. We didn&#x27;t have endless AI spam designed to host
    endless auctioned ad spots diluting the good stuff.<p>So here&#x27;s my proposed
    privacy-friendly alternative business model: You don&#x27;t get to harvest personal
    data for reasons unrelated to whatever products or services you&#x27;re providing
    to willing consumers and if you do then we throw you in jail. I&#x27;m pretty
    sure the Internet would find a way to continue providing the functionality that
    is actually useful. I&#x27;m pretty sure the signal&#x2F;noise ratio online would
    be much better too.'
