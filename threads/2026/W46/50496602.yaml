  author: adolph
  text: This UN declaration doesn’t seem to establish an enduring definition of privacy.<p>Hayek
    offers a significant observation that things that work among small orders, like
    a family, don’t work when applied to a whole city. It speaks to the gap between
    a single police officer seeing something and a city-wide camera crime detection
    network.<p><pre><code>  Part of our present difficulty is that we must constantly
    adjust our lives, our thoughts and our emotions, in order to live simultaneously
    within different kinds of orders according to different rules. If we were to apply
    the unmodified, uncurbed rules of the micro-cosmos (i.e., of the small band or
    troop, or say our families) to the macro-cosmos (our wider civilization), as our
    instincts and sentimental yearnings often make us wish to do, we would destroy
    it. Yet if we were always to apply rules of the extended order to our more intimate
    groupings, we would crush them. [Friedrich Hayek, The Fatal Conceit]</code></pre>
  score: 0
