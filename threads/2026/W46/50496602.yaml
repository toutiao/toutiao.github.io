  author: thadt
  text: Tech companies respond to incentives. If the technology exists to create and
    sell devices that are useful to people and legal, then they&#x27;ll do it, and
    people will buy and use them. And that is <i>fantastic</i> - I&#x27;m great with
    tech companies making tools that makes my life easier. I absolutely plan on using
    the heck out of the next wave of AR glasses for digitizing historical documents
    so I can have both hands free instad of holding a phone in one. Better audio recording
    devices? Yes, please.<p>Simultaneously - I own my words, either written or spoken.
    This isn&#x27;t really all that different from copyright, and I&#x27;m rather
    surprised we don&#x27;t more regularly bring that reasoning to bear on this issue.
    If I give them to you in a private conversation, then those words are for you
    to hear. If you record them without my consent, then you&#x27;re violating my
    (copy)right. If a company takes those words without my consent, then that company
    is violating my copyright.<p>I don&#x27;t know exactly what should happen to people
    and companies violating my copyright, but I do remember when it was the other
    way around a few years back and the RIAA was getting people fined thousands to
    tens of thousands of dollars per incident. That seems about right.
  score: 0
