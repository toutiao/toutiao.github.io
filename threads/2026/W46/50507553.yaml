  url: https://joshblais.com/blog/emacs-as-my-browser/
  title: Emacs is my browser - The Universe of Joshua Blais
  fetch_status: success
  content: "![eww inside emacs](https://cella.b-cdn.net/joshblais/eww.png)\n\nIn my
    ever-increasing desire to [use emacs as my sole computing environment](https://www.youtube.com/watch?v=n5VMWuxLi10),
    I have started to take browsing the web inside it far more seriously. Where I
    previously had thought EWW to be a niceity but far from capable, after using it
    for a few days it seems to be useable for about 85-90% of use cases - even on
    the javascript riddled hellhole that is the internet.\n\n## Why?[#](#why)\n\nI
    have seen in my own use of the modern browser (chromium/firefox) that it is far
    too easy to get distracted - too easy to get off track and fall down rabbit holes
    that take over my day. There are infinite suggestions as to how I should spend
    my time, uncountable shiny objects that take my eye off the prize that is Creativity
    and Depth. This has been momentously negated with EWW (or any terminal browser,
    [lynx](https://en.wikipedia.org/wiki/Lynx_(web_browser)) or [browsh](https://www.brow.sh/)
    for the non-emacs users).\n\nIn addition to this, my belief is that we should
    make strides toward leaving behind [Layer 8](https://en.wikipedia.org/wiki/Layer_8)
    of the internet - the limiting frontends of social platforms and locked away corners
    of the net that limit actual discourse (Discord, I’m looking at you). We have
    given up far too much to big tech platforms, and gotten nothing of value in return,
    to the point that many now [think the internet is dying](https://www.youtube.com/watch?v=A41zzxyVANo&pp=0gcJCdMKAYcqIYzv).\n\nThe
    internet is just a delivery mechanism, and for people that see it for what it
    really is, the internet has [never been more alive](https://joshblais.com/community/).
    I truly recommend [using the internet as if it was 1999](https://joshblais.com/using-the-internet-like-its-1999).\n\nEven
    on my phone, I’ve stopped using javascript frontends and embraced using eww in
    emacs (in termux), only falling back to fennec for about 5-10% of usecases:\n\n![img](https://cella.b-cdn.net/joshblais/nobrowser.jpeg)\n\nI
    find this way of using the internet far higher in signal than any other method,
    allowing me to look up information, read documentation, and produce more.\n\n##
    How I am doing this[#](#how-i-am-doing-this)\n\nFor the uninitiated, emacs ships
    with [EWW](https://www.gnu.org/software/emacs/manual/html_mono/eww.html) (Emacs
    Web Wowser) permitting you to browse the web with image and gif (when did gifs
    die, I almost never see them these days!) support directly inside Emacs.\n\nI
    have some sane defaults that permit ease of use such as using `B` for back, `U`
    for yanking url at point, and a few built in functions.\n\nHitting `R` will invoke
    `eww readable` which is similar to reader mode in firefox, removing headers and
    footers and focusing in on the text on page. Useful.\n\nYou can send the page
    to your default browser with `&`. If a page doesn’t render nicely, this is a good
    fallback.\n\n`D` will download images locally, `b` goes back a page, `a` will
    save bookmarks. All of this makes browsing in eww truly enjoyable.\n\nI have also
    set .pdf to open in emacs, .mp4 and youtube/video hosting links to open in mpv,
    and gopher/gemini links to open in elpher. [Elpher](https://github.com/emacsmirror/elpher)
    is the EWW for the [gopher](https://en.wikipedia.org/wiki/Gopher_(protocol)) and
    [gemini](https://geminiquickst.art/) protocols, the smolweb that is all signal
    and no noise.\n\nEWW uses [Shr](https://github.com/emacs-mirror/emacs/blob/master/lisp/net/shr.el)
    to render html, so you will see some callouts to that in my configuration below:\n\n##
    My browser.el setup:[#](#my-browserel-setup)\n\nHere’s how I have configured EWW
    to work in my [Emacs configuration](https://github.com/joshuablais/studium-emacs):\n\n(setq
    eww-search-prefix \"https://searx.labrynth.org/search?q=\")\n    (setq eww-download-directory
    (expand-file-name \"~/Downloads/\"))\n    \n    \n    (defun my-browse-url-mpv
    (url &rest _args)\n    \n      \"Open URL in mpv.\"\n    \n    \n      (start-process
    \"mpv\" nil \"mpv\" url))\n    \n    \n    \n    (defun my-browse-url-pdf (url
    &rest _args)\n    \n      \"Fetch remote PDF and open in pdf-tools within Emacs.\"\n
    \   \n    \n      (let ((tmp (make-temp-file \"emacs-pdf-\" nil \".pdf\")))\n
    \   \n    \n        (url-copy-file url tmp t)\n    \n    \n        (find-file-other-window
    tmp)\n    \n    \n        (pdf-view-mode)))\n    \n    \n    \n    (setq browse-url-handlers\n
    \   \n          '((\"\\\\(youtube\\\\.com\\\\|youtu\\\\.be\\\\|vimeo\\\\.com\\\\|twitch\\\\.tv\\\\)\"
    . my-browse-url-mpv)\n    \n    \n            (\"\\\\.mp4$\" . my-browse-url-mpv)\n
    \   \n    \n            (\"\\\\.pdf$\" . my-browse-url-pdf)\n    \n    \n            (\"^gemini://\"
    . elpher-browse-url-elpher)\n    \n    \n            (\"^gopher://\" . elpher-browse-url-elpher)\n
    \   \n    \n            (\".\" . eww-browse-url)))\n    \n    \n    \n    ;; Keep
    your fallback setting\n    (setq browse-url-secondary-browser-function 'browse-url-generic\n
    \   \n          browse-url-generic-program \"chromium\")\n    \n    \n    \n    (with-eval-after-load
    'eww\n    \n      (define-key eww-mode-map (kbd \"=\") #'text-scale-increase)\n
    \   \n    \n      (define-key eww-mode-map (kbd \"-\") #'text-scale-decrease)\n
    \   \n    \n      (define-key eww-mode-map (kbd \"0\") #'text-scale-adjust))\n
    \   \n    \n    \n    (setq shr-width 100)\n    (setq shr-max-width 120)\n    (setq
    shr-indentation 4)\n    \n    \n    (setq shr-use-fonts nil)\n    (setq shr-max-image-size
    '(800 . 600))\n    (setq shr-image-animate t)\n    \n    \n    (defun my/eww-download-image-at-point
    ()\n    \n      \"Download image at point to `eww-download-directory'.\"\n    \n
    \   \n      (interactive)\n    \n    \n      (let ((url (or (get-text-property
    (point) 'image-url)\n    \n    \n                     (get-text-property (point)
    'shr-url))))\n    \n    \n        (if (not url)\n    \n    \n            (message
    \"No image at point\")\n    \n    \n          (let* ((filename (file-name-nondirectory
    (url-filename (url-generic-parse-url url))))\n    \n    \n                 (dest
    (expand-file-name filename eww-download-directory)))\n    \n    \n            (url-copy-file
    url dest t)\n    \n    \n            (message \"Saved: %s\" dest)))))\n    \n
    \   \n    \n    ;; Keybinds\n    (with-eval-after-load 'eww\n    \n      (define-key
    eww-mode-map (kbd \"b\") #'eww-back-url)\n    \n    \n      (define-key eww-mode-map
    (kbd \"a\") #'eww-add-bookmark)\n    \n    \n      (define-key eww-mode-map (kbd
    \"U\") #'shr-copy-url)\n    \n    \n      (define-key eww-mode-map (kbd \"D\")
    #'my/eww-download-image-at-point))\n    \n    \n    \n    (provide 'browser)\n\nMy
    default search engine is my own [Searx instance](https://github.com/searxng/searx-instances),
    a privacy respecting frontend that amalgamates all other search engines.\n\n##
    Limitations[#](#limitations)\n\nYou will not be watching youtube videos or reading
    Tweets (x.com is adversarial to non-JS supported browsers). You will not be using
    social media, nor will you be logging into any platforms. You will not be doing
    your online banking, filling in government forms, or viewing client portals.\n\nThe
    usecase is quick web searches, documentation, and reading blogs generally. Once
    more, hitting `&` in any web page will bring up your default browser to continue
    your session in chromium or firefox when you do run into pages that don’t work
    well in EWW.\n\n## Conclusion[#](#conclusion)\n\nI have reverted all my url functions
    to default to browsing in EWW, so any web interaction must first go through EWW.
    This has encouraged me to deeply consider what I am doing online first and foremost,
    and then only falling back to a modern browser when needed. I have been pleasantly
    surprised with how much I am able to do inside emacs, and continue to move toward
    using it as my computing environment in perpetuity.\n\nAs always, God bless, and
    until next time.\n\nIf you enjoyed this post, consider [Supporting my work](https://joshblais.com/support/),
    [Checking out my book](https://mountainthebook.com), [Working with me](https://joshblais.com/work-with-me),
    or sending me an [Email](mailto:josh@joshblais.com) to tell me what you think.\n\n
    \n \n* * *"
