  author: not_kurt_godel
  text: '&gt; The difference is the text consumption. Can you easily retrieve any
    text you&#x27;re seeing on the screen into your editor?<p>&gt; Inserting any piece
    of text I see on the screen into my notes? A couple of keystrokes. I can grab
    text in any form, even if it&#x27;s a frame in a YT video - I&#x27;d just select
    the area, snapshot it - Emacs OCRs the text out of it, which takes milliseconds.<p>Yes,
    Mac does this natively&#x2F;automatically with screenshots. I&#x27;d be surprised
    if I&#x27;ve ever used&#x2F;needed OCR more than a half-dozen times. Far more
    often it just gets minorly in the way when I want to copy-paste the image itself.<p>&gt;
    I have complete and utter control over text - I can send a query to an LLM in
    the middle of typing this very comment, without ever missing a beat. I can ask
    for anything - fact-check it, spell check it, reword it, explain it, give me different
    variations of the same sentence.<p>Mac natively offers AI writing tools context
    menu options in every app for text selections. Right click -&gt; search effectively
    does the same thing (every search engine has AI functionality featured prominently
    by default). I believe most browsers also offer straight-to-AI equivalents as
    well.<p>&gt; Similarly, I can directly grab a piece of any text in Emacs and send
    it over to another app, e.g., as a command to run in the terminal.<p>I can do
    this natively and trivially on my Mac in every single app without having to learn
    a bizarre alternate universe of awkward, inconvenient hotkeys.<p>&gt; What if
    I could change the &#x27;Open File&#x27; dialog in Sublime so I can browse GitHub
    repos directly instead of folders and files?&quot;<p>My IDE has featured this
    prominently as a native option for approximately forever.<p>&gt; What Emacs grants
    as a Lisp-REPL loop with a built-in text editor is lowering that affordability
    bar to the lowest imaginable minimum.<p>It&#x27;s literally not affordable to
    spend my time inefficiently re-inventing the wheel on every common UI&#x2F;UX
    task in a usually fundamentally limited and broken way. I need an IDE where it&#x27;s
    not a major source of controversy as to whether it&#x27;s possible to configure
    basic auto-complete.<p>&gt; Emacs can search through my browser history too -
    <a href="https:&#x2F;&#x2F;github.com&#x2F;agzam&#x2F;browser-hist.el" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;agzam&#x2F;browser-hist.el</a><p>Having
    to install a random third-party extension to use a basic browser feature is a
    bug, not a feature.<p>...I&#x27;m not sure what I&#x27;m trying to accomplish
    by poking these holes. By all means, enjoy using emacs. It&#x27;s just...strange
    to me that an emacs user would believe these are selling points when in fact having
    to configure them myself is a major downgrade from just using the native features
    in commonly used software.'
