  text: "&gt; Can you be more specific about this?<p>No, they can&#x27;t. People like
    to play this kind of fear-mongering and &quot;cybersecurity theater&quot; without
    even questioning first the cybersec posture, network perimeter - vpn, firewall,
    malware protections, etc. Everything the article describes is perfectly possible
    even without Emacs. OSA layer on Mac been doing even weirder things for odd thirty
    years.<p>It&#x27;s not like people giving Emacs root shell access. It&#x27;s culturally
    fitting for HN - signaling caution is always socially safe. Nobody ever got criticized
    for saying &quot;that sounds risky&quot;. But &quot;I evaluated the risks and
    accepted the tradeoffs for my situation&quot; is the actual, pragmatic engineering.
    Security is risk management, not risk elimination."
