  author: iLemming
  text: "&gt; The example you describe is something I would rarely do<p>There is some
    tacit knowledge in here that is nearly impossible to convey in words. Your &quot;rarely
    do&quot; is the thought that subconsciously ignores the principle of least effort;
    there&#x27;s an affordability gap, e.g., I am more likely to use a thesaurus simply
    because I have it built into my text editor, versus someone who has to reach for
    it in the browser&#x2F;separate app.<p>&gt; building a process around it would
    be inefficient for me<p>That&#x27;s what you&#x27;re missing. Emacs makes it incredibly
    cheap. It&#x27;s a Lisp REPL. When you understand what it means in practice, it
    opens up incredible opportunities for exploratory computing. You&#x27;re not &quot;building
    processes around&quot;, you&#x27;re essentially living in one mega-process, a
    simulation, a digital universe where you are a god, commanding change at will.
    Right now, as I&#x27;m typing this very comment, I noticed a tiny gap in the way
    how I&#x27;m using LLMs, so I&#x27;m changing this stuff on the fly, with the
    agent running things in the adjacent buffer while I&#x27;m finishing this comment.
    The crazy thing is that it doesn&#x27;t have to compile, restart, ask me to pause
    typing, etc. It&#x27;s applying changes to my editor live. By the time I finish
    typing the comment, it will probably have already built this feature, tested it
    out, and it will be ready for me to use, instantly."
