article:
  url: https://english.nv.ua/nation/thirteen-day-drone-blitz-paralyzes-36-of-moscow-s-oil-50658616.html
  title: Thirteen-day drone blitz paralyzes 36% of Moscow's oil / The New Voice of
    Ukraine
  fetch_status: success
  content: "Ukrainian drone strikes knocked out 36% of Russia’s total oil refining
    capacity in less than two weeks, hitting at least nine major refineries between
    Oct. 30 and Nov. 11, defense manufacturer Fire Point [reported](https://t.me/firepointofficial/502)
    on Nov. 12.\n\nThe combined annual processing capacity of the Russian plants hit
    over the past 13 days exceeds 120 million metric tons of crude oil—accounting
    for 36% of the aggressor state’s entire domestic oil refining capacity.\n\n\"In
    under two weeks, enterprises accounting for more than a third of Russia's total
    oil refining capacity came under strike,\" Fire Point noted.\n\nAd\n\n Read also:
    \n[Russian oil refining drops 30% after new wave of Ukrainian strikes](https://english.nv.ua/russian-war/russian-oil-refining-drops-30-50658107.html)\n\n##
    Recent Strikes on Russian Refineries\n\n**On Nov. 6,** President Volodymyr Zelenskyy
    stated that in direct retaliation for Russian strikes against Ukraine’s energy
    grid, Kyiv would press forward with its campaign targeting the aggressor state's
    oil refining infrastructure.\n\n Read also: \n  \n[NATO's European command commends
    Ukrainian strikes on Russian refineries](https://english.nv.ua/nation/nato-praises-ukraine-s-strikes-on-russian-oil-refineries-despite-criticism-from-trump-50658536.html)\n\n**On
    Nov. 7,** long-range drones struck Saratov Oil Refinery. Two days later, on Nov.
    9, Ukrainian forces hit Russia's second-largest processing facility — Kirishi
    Oil Refinery in Leningrad Oblast.\n\n**On Nov. 11,** strike drones hit oil export
    terminals at the Baltic port of Ust-Luga, a vital maritime hub for Russian crude
    shipments.\n\nAccording to _Reuters_, Ukrainian drone attacks on Russian refineries
    since late October 2026 have reduced Russia's operational refining capacity by
    roughly 30% and triggered acute fuel shortages across at least six Russian oblasts.\n\n**The
    military war may be swinging in our favor, but the information war continues.**\n\nJust
    as an army needs soldiers, so does a free society need its journalists to ensure
    that people have access to honest, trustworthy voices to understand the world
    around them.\n\nFor the past five years, The New Voice of Ukraine has been working
    tirelessly to push back against Russian narratives and defend democracy. But we
    cannot do it alone.\n\nPlease consider [supporting us on Patreon](https://link.nv.ua/promo_en_nv_ua)
    for just $5 a month – your donation does directly to supporting journalists and
    ensuring that this front of the infowar says solid and defended.\n\nThank you.\n\nFollow
    us on [Twitter](https://twitter.com/NewVoiceUkraine), [Facebook](https://www.facebook.com/TheNewVoiceUkraine)
    and [Google News](https://news.google.com/publications/CAAqBwgKMLeesQswxLnIAw)\n\nEditor:
    [Daryna Halperina](https://english.nv.ua/korrespondents/daryna-halperina.html)\n\n[![Google](https://english.nv.ua/images/social/google-color.svg)
    Read NV on Google](https://www.google.com/preferences/source?q=nv.ua)\n\nIf you
    find an error in the text, select it with the mouse and click Ctrl + Enter\n\nТеги:&nbsp;&nbsp;
    [Russian oil refineries](https://english.nv.ua/tags/russian-oil-refineries.html)[successful
    Ukrainian strikes](https://english.nv.ua/tags/successful-ukrainian-strikes.html)[drone
