  text: I have to say that I spent a lot of time recommending this author to people.
    &quot;Light&quot;, and &quot;Nova Swing&quot; are both ABSOLUTELY INCREDIBLE.<p>I
    was on holiday, and stopped at a second hand bookshop to grab something hopefully
    a bit trashy to read. I picked up Nova Switch because the cover made it look like
    some weird sci-fi detective romp. But after about three pages it became apparent
    that I had happened upon something very special indeed, and when I made it to
    the end I did something that I&#x27;d never done before. I turned back to page
    one and read the entire thing again.<p>It is magnificent. Everyone should read
    it. It turned out to be the second book in a trilogy, and maybe that was part
    of its appeal. It didn&#x27;t explain anything, it just launched into a beautiful
    and strange sci fi world, filled it with extraordinary characters, and moved languidly
    through the story.<p>So much science fiction is just dreadful garbage. Harrison
    is most definitely not.
