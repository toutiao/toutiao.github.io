  author: sunshowers
  text: In general, literary fiction has a certain artistic prestige associated with
    it. Sometimes that is because it focuses more on prose and character than on plot,
    and at other times because it plays with the novel form in some kind of exciting
    or challenging way. This is as opposed to genre fiction, which might be more of
    a comfort plot-driven read which isn&#x27;t aspiring to the highest prose.<p>Overall
    I don&#x27;t really subscribe to this binary between literary and genre fiction
    -- I think there&#x27;s a fair bit of speculative fiction that is serious character-driven
    art, such as the works of Ursula Le Guin and the Fifth Season trilogy by NK Jemisin.
    I&#x27;d also recommend Cloud Atlas by David Mitchell (made into a movie by the
    Wachowski sisters) as a lovely work of form-bending fiction that&#x27;s hard to
    classify as one to the exclusion of the other.
