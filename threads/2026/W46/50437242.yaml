  author: SideburnsOfDoom
  text: 'I have read <i>The End of Everything</i> and other  M. John Harrison books,
    both conventional rock-climbing memoir and way out space opera.<p>IMHO  if you
    like Harrison&#x27;s  prose and the atmosphere, keep going. Even if the plot is
    hard to make out. IHMO, If you are reading M. John Harrison for the plot, then
    you&#x27;re in the wrong book.<p>I can see how some would be bored or baffled
    by this book, or even dislike it intensely. If you didn&#x27;t like his other
    books, then this one is more in that vein, and in some ways more so. If so, you
    probably won&#x27;t enjoy this one either.<p>He has said &quot;A good ground rule
    for writing in any genre is: start with a form, then ask what it&#x27;s afraid
    of&quot; (1) He is deconstructing, not constructing, stories.<p><i>The End of
    Everything</i> has an anti-plot, is set in anti-places and contains at least character
    that is anti-person.<p>If it&#x27;s not for you then that&#x27;s perfectly OK.
    I don&#x27;t pretend to understand why it won an award, but I liked it. Probably.
    It&#x27;s hard to be sure. And that&#x27;s something out of the ordinary.<p>There
    are though, themes or images that are of a particular time and place (2026, South
    coast of England). Most notably Boats taking people across the Channel to some-place
    uncertain but &quot;not here&quot;.  If you are somewhere else then that image
    might not mean anything to you, but the resonance with current UK political discourse  must
    be deliberate. And it helps to &quot;get&quot; it.<p>In the same way that his
    last book <i>The Sunken Land Begins to Rise Again</i>  (2020) was about the fallout,
    the curdled nostalgia and  communication failures of the post-Brexit moment. (2)
    Maybe. If it&#x27;s &quot;about&quot; anything other than aquatic humanoids, dodgy
    jobs and fairy tales, IDK.<p>1) <a href="https:&#x2F;&#x2F;www.theguardian.com&#x2F;culture&#x2F;2012&#x2F;jul&#x2F;20&#x2F;m-john-harrison-life-in-writing"
