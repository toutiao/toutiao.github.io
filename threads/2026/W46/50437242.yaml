  author: tialaramex
  text: It doesn&#x27;t beg the question, &quot;begging the question&quot; is a type
    of fallacy in which we insist upon presuming X and then rely on that to prove
    X which is a waste of everybody&#x27;s time. But yes, it is reasonable if we notice
    that Atwood&#x27;s &quot;The Handmaid&#x27;s Tale&quot; is Science Fiction to
    expect that awarding a Booker to its sequel &quot;The Testaments&quot; would constitute
    a Booker for Science Fiction.<p>I would imagine the distinction attempted here
    is that despite writing those novels, Atwood doesn&#x27;t consider herself to
    be an SF author, perhaps Harrison says he is an SF author. Atwood also won for
    &quot;The Blind Assassin&quot; which very much is not Science Fiction, it&#x27;s
    historical fiction, it&#x27;s not history but all the stuff happening in the background
    was real.<p>This shades over somewhere. If your story features an England ruled
    by literal Nazis it&#x27;s Science Fiction (alternate history is a type of SF,
    &quot;What if the Nazis won?&quot; is a fairly popular theme) but if your England
    just has some Nazi sympathizers and your story is set in the 1930s it might just
    be historical fiction.
