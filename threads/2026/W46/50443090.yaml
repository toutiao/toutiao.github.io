  content: "# AMD’s Zen 6 Family: Feeding the Beast\n\n[\n\n](https://substack.com/@cheesecake16)\n\n[George
    Cozma](https://substack.com/@cheesecake16)\n\nHello you fine Internet folks,\n\nToday
    we’re looking at AMD’s next-generation Zen 6 CPU core family. We’ll explore the
    changes from Zen 5 and what the differences between Zen 6 and Zen 6c tell us about
    AMD’s approach to microarchitecture.\n\nHope y’all enjoy!\n\n# **Overview**\n\nFrom
    a bird's eye view, Zen 6 is the natural evolution of Zen5, with the expansion
    of many OoO structures and iterative improvements found throughout the core.  \n
    \ \nDigging in deeper however tells a different story, with AMD heavily re-working
    several parts of the core, reminding me of the changes from Zen 1 to Zen 2.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!R25V!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fff0ea2d4-ea2d-440b-ad51-1bc99a695511_2022x1382.png)\n\nAt
    a high level the changes AMD made to the integer schedules stand out, returning
    to a layout reminiscent of Zen 3 and Zen 4.\n\n# Branch Prediction\n\nZen 5 had
    the best direction predictor of any core we have measured and Zen 6 seemingly
    builds upon that same direction predictor.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!LKuF!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91946bdf-c5e2-4c04-b8f1-b332854c24d7_1365x762.webp)\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!P8g0!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9971593c-59b3-49bf-b0e3-37a2c468992e_1300x625.png)\n\nThe
    biggest difference we do see is in what happens once the direction predictor gets
    overwhelmed. Both cores hit that wall in about the same place and past it, the
    predictor is left guessing at random data, so the time per branch mostly reflects
    how long the core takes to recover from a wrong guess.   \n  \nThat plateau sits
    at roughly 3.5 to 4 ns of extra time per branch on Zen 5 and roughly 3 to 3.5
    ns on Zen 6 so Zen 6 is paying less for each branch it gets wrong, which speaks
    to AMD reducing the latency of a branch mispredict compared to Zen 5.\n\nZen 6
    has also improved the ability of the core to do 2 branches per cycle with Zen
    6 able to do 2 branches per cycle within the L1 instruction cache.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!oG7B!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F92cb7d6d-0772-42c7-9200-b5c2dd4c93bb_977x526.png)\n\nWhen
    the footprint exceeds the L1i, then it falls to just a single branch per cycle
    for the rest of the BTB except for the 64B test which goes up to 4 cycles per
    branch for the L2 BTB.\n\nWhen comparing the BTB of Zen 6 to Zen 5, Zen 6 appears
    to have focused on improving the speed of the BTB compared to beefing up the capacity.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!24kn!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cac7812-c368-4eba-8911-f8e31f3e59dd_2307x917.png)\n\nThe
    accuracy of Zen 6’s Branch Predictor Unit is very similar to Zen 5’s while also
    being faster which is a good thing considering that Zen 5 already had a very accurate
    Branch Predictor.\n\n# Instruction Fetch\n\nZen 6 carries forward the same dual
    decode cluster schema that Zen 5 introduced but, unlike Zen 5 where a single thread
    could only effectively use a single decode cluster, now with Zen 6 a single thread
    can use both decode clusters.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!0X5u!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F362e75a6-f958-4fde-be89-f692cabd76d0_1417x709.png)\n\nOutside
    of the L1i, Zen 6 looks very similar to Zen 5’s behavior on the instruction side
    of things.\n\n# Execution Engine\n\nThe execution engine of Zen 6 is overall very
    similar to Zen 5, but there are some important differences to be mindful of.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!O9I-!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff142a3ba-44cd-4928-a9b3-bbd87d6c2d22_1365x1184.webp)\n\nOn
    the integer side, Zen 6 brings back Zen 4’s NOP pairing behavior, retiring up
    to 16 NOPs per cycle. Zen 6 also comes closer to theoretical peak throughput for
    simple integer instructions than Zen 5, sustaining 5.96 64-bit adds per cycle
    against Zen 5’s 5.25 with the same six ALUs.\n\nAMD has reduced the number of
    integer multiply units from three to two, with PDEP and PEXT throughput also falling
    from three instructions per cycle to two. According to AMD, Zen 5’s third integer
    multiply unit did not justify its area cost.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!e2zc!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8dfd7d9a-3bee-408d-b28d-ed8cd3be6bc9_1418x738.png)\n\nOn
    the vector side, the floating-point units are unchanged, with Zen 6 still handling
    two 512-bit FADDs, FMULs, or FMAs per cycle. The change is in VNNI, where Zen
    6 doubles the number of units from two to four and our 512-bit VNNI test goes
    from 1.99 to 3.88 instructions per cycle, with Zen 6c matching it. VNNI instructions
    are useful for operations like calculating the inner loop of quantized inference
    as well as for video codecs using them for video filters as well.\n\nMoving over
    to the other notable change, Zen 5 could already perform four per cycle, but our
    test shows only two of them could be vector loads, regardless of if they were
    256 or 512 bit loads. Zen 6 raises 256-bit loads to four per cycle on both cores
    while leaving 512-bit loads at two, so both widths now reach the same 128 bytes
    per cycle which matters because most shipped vector code still targets AVX1/2.\n\n#
    The Out of Order Engine: Where Zen 6 and Zen 6c Split\n\nIn the past the difference
    between the Classic cores and the Dense cores in terms of the architecture were,
    for all intents and purposes, functionally identical with the biggest changes
    being in the number of cores on a CCD and the amount of L3 cache per core. With
    the Zen 6 family, that has changed.\n\nStarting inside of the core, the changes
    occur after micro-op dispatch and seemingly end after the load queue.\n\nThe main
    differences between Zen 6 and Zen 6c lie in the capacities of their out-of-order
    structures. Several of these structures are larger on Zen 6c, allowing it to keep
    more work in flight and absorb more latency than Zen 6. The reorder buffer grows
    from 576 to 640 entries, the integer register file from 288 to 352, the vector
    scheduler from 138 to 180, and the load queue from 280 to 330.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!_Lrh!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa1159fcc-3ba0-4ab3-957a-b444fff2038c_2032x1382.png)\n\nThe
    differences suggest that AMD is specializing the two designs. Zen 6 appears tuned
    for high frequency, while Zen 6c has more capacity to tolerate comparatively high
    memory latency.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!Tce3!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F631c910d-0976-4d8a-9f7c-16188456e5cc_2032x1382.png)\n\nZen
    6 and Zen 6c use 12-core and 32-core CCDs, respectively, but both provide 4 MB
    of L3 cache per core. That gives the 12-core CCD 48 MB of L3 cache and the 32-core
    CCD 128 MB.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!naz1!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33907f2-c445-46cd-b7d3-942814d9da4a_1417x768.png)\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!noA_!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd46fd82d-44d2-426b-86fa-bc7e865729ef_1417x767.png)\n\nL3
