  author: Tuna-Fish
  text: I think it&#x27;s less there because of differences in the memory subsystem,
    but more because clock targets are lower so they can afford more. The structures
    they grew cost basically nothing in die area, but make timing tighter. It&#x27;s
    possible they&#x27;d like them to be bigger for the non-c core too, but can&#x27;t
    fit them in their timing constraints.<p>The unified L3 per CCD really helps on
    some key desktop loads (especially games). Most server throughput loads partition
    nicely into smaller partitions, but most games are hurt so bad by the latency
    penalty of crossing into a different partition that AMD&#x27;s game drivers park
    the second CCD on their 2-CCD CPUs when they detect a game running. So long as
    games are an important target for them, I suspect they will not partition the
    CCD again. (It, of course, used to be parititioned for Zen 1 and 2.)
  score: 0
