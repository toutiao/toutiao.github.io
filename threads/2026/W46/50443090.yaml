  text: Amdahl&#x27;s law prevents great improvements through parallelism only in
    small problems, e.g. those that can be completed in seconds or minutes.<p>In big
    problems, e.g. those whose solution requires hours or days of computation, it
    is almost always possible to decompose them in enough quasi-independent subproblems
    that can be executed in parallel, so that you can get an acceleration from parallel
    execution not much less than the number of available processor cores.
