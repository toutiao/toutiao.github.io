  author: phire
  text: "<i>&gt; Shouldn&#x27;t those &quot;µops&quot; be the ISA?</i><p>Well... that
    is the pure RISC philosophy from the 80s.<p>But there are advantages to having
    a disconnect between the encoded instructions and μops. So much that most &quot;RISC&quot;
    ISAs have instructions that are explicitly intended to decode to multiple μops.
    ARMv8 takes this approach pretty far, with quite a few instructions that are explicitly
    intended to be split into multiple μops.<p>Hell... Even RISC-V has begrudgingly
    expermented with the idea: See the Zcmp&#x2F;Zcmt extensions which are explicitly
    defined to decoded to multiple 32-bit instructions; Or arguably the Zaamo Atomic
    instructions, which are part of RVA23."
