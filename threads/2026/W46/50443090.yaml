  author: AnthonyMouse
  text: "&gt; There was a brief period of affordable threadripper, but then product
    segmentation made that not great for amd...<p>The thing they&#x27;re doing which
    is completely insane is using different sockets for Threadripper and Epyc.<p>The
    primary difference between them isn&#x27;t the price -- they&#x27;re both expensive
    -- it&#x27;s that Epyc uses the power budget to reach higher core counts and Threadripper
    uses it to hit higher clock speeds. So for example, Zen5 Threadripper 9975WX has
    32 cores with a 4 GHz base clock and 5.4 GHz boost clock. There is no equivalent
    Zen5 Epyc, the most similar is 9375F which is 3.8GHz&#x2F;4.8GHz. Conversely,
    Epyc 9755 has 128 Zen5 cores and Epyc 9965 has 192 Zen5c cores and there is no
    Threadripper with that many cores.<p>The reason this matters is that the system
    boards themselves are pricey, not just the CPUs, but as the platform starts to
    age you start to get a lot of old servers on the used market that originally had
    a bottom-end Epyc in them. Which you&#x27;d then like to pull and replace with
    a Threadripper -- i.e. pay them more money to buy a new Threadripper -- except
    that they inexplicably decided to screw you and themselves by using a different
    socket.<p>And the same thing the other way around. It also means you can&#x27;t
    find an older workstation with the bottom-end Threadripper and pay them money
    for a high core count Epyc with better performance per watt to use it as a server.<p>Whoever
    did it this way doesn&#x27;t seem to understand that market segmentation is intended
    to separate price segments rather than just creating arbitrary compatibility impairment
    between things that have similar prices."
