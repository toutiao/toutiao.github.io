  text: That&#x27;s true.<p>However, besides the big SP7 socket with 16 DIMMs and
    1 DIMM per channel, Zen 6 Venice will be available also with the somewhat smaller
    SP8 socket, which uses the same 16 DIMM sockets, but here there are 2 DIMMs per
    channel at a halved number of channels, so the maximum memory throughput is halved,
    from 1.6 TByte&#x2F;s to 0.8 TByte&#x2F;s, while the maximum amount of memory
    stays the same, at 2 TB.<p>It is interesting that Zen 6 has 2 I&#x2F;O dies, each
    with 8 memory controllers, but in the smaller SP8 socket the same 2 memory controllers
    are used, with only 4 memory controllers enabled in each I&#x2F;O die, instead
    of using only 1 I&#x2F;O die.<p>Presumably that was done in order to not reduce
    the number of PCIe lanes in the SP8 socket, which actually has more PCIe lanes
    than the SP7 socket.
