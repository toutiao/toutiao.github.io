  author: p_l
  text: Memory controllers are pretty much limited by external pinout.<p>Zen 4 and
    newer consumer chips have 4 memory controllers (for legacy reasons shown as 2)
    which handle 32bit wide LPDDR5 or DDR5 interfaces (2x per dimm for DDR5)<p>The
    AM5 (desktop) socket has in addition to the 4x 32bit memory lanes, 28 PCI-E lanes
    (generally 16x for GPU, two 4x general purpose, one 4x to chipset), 4x combined
    DP&#x2F;HDMI outputs, USB 2.0 port, 4 USB 3.2 Gen 2 ports. And that&#x27;s just
    the major buses, there&#x27;s ton of other components exposed (simpler IO, sound,
    power)<p>All of that counts to staggering 1718 pins - anyone remember when moving
    dual-channel K8 from 940 pin to 939 allowed removal of whole layer from motherboard
    PCB, making them way cheaper?<p>The high-end performance server socket from AMD
    has <i>6096</i> pins, significant chunk of it being the 24x 32bit DDR5 interfaces.<p>So
    unfortunately it&#x27;s very much not easy to add more memory, and that&#x27;s
    before considering issues with routing it on motherboard even if you accept changing
    shapes
