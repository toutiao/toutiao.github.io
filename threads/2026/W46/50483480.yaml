  author: areoform
  text: "Sadly, this has already been done. For <i>several</i> decades with billions
    of dollars of compute.<p><pre><code>    &gt; Neural networks in drug discovery:
    have they lived up to their promise?\n</code></pre>\n1999.<p><pre><code>     &quot;Over
    the last decade neural networks have become an efficient method for data analysis
    in the field of drug discovery. The early problems encountered with neural networks
    such as overfitting and overtraining have been addressed resulting in a technique
    that surpasses traditional statistical methods. Neural networks have thus largely
    lived up to their promise, which was to overcome QSAR statistical problems. The
    next revolution in QSAR will no doubt involve research into producing better descriptors
    used in these studies to improve our ability to relate chemical structure to biological
    activity&quot;\n</code></pre>\n<a href=\"https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;abs&#x2F;pii&#x2F;S022352349980052X\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;abs&#x2F;pii&#x2F;S02235...</a><p><pre><code>
    \   &gt; The use of neural networks in drug discovery started at the end of the
    1980&#x27;s when they were applied to various chemical problems including the
    study of quantitative structure–activity relationships (QSAR) \n</code></pre>\n&gt;
    Combining Decision Trees and Neural Networks for Drug Discovery<p>2002.<p><a href=\"https:&#x2F;&#x2F;link.springer.com&#x2F;chapter&#x2F;10.1007&#x2F;3-540-45984-7_6\"
    rel=\"nofollow\">https:&#x2F;&#x2F;link.springer.com&#x2F;chapter&#x2F;10.1007&#x2F;3-540-45984-7_6</a><p>Want
    more robots and silicon? That&#x27;s been a thing too!<p><pre><code>    &gt; Computer-aided
    drug discovery and development (CADDD): In silico-chemico-biological approach\n</code></pre>\n2006.<p><pre><code>
    \    In biomedical arena, computer-aided or in silico design is being utilized
    to expedite and facilitate hit identification, hit-to-lead selection, optimize
    the absorption, distribution, metabolism, excretion and toxicity profile and avoid
    safety issues. Commonly used computational approaches include ligand-based drug
    design (pharmacophore, a 3D spatial arrangement of chemical features essential
    for biological activity), structure-based drug design (drug-target docking), and
    quantitative structure–activity and quantitative structure–property relationships.
    Regulatory agencies as well as pharmaceutical industry are actively involved in
    development of computational tools that will improve effectiveness and efficiency
    of drug discovery and development process, decrease use of animals, and increase
    predictability. It is expected that the power of CADDD will grow as the technology
    continues to evolve.\n</code></pre>\n<a href=\"https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;abs&#x2F;pii&#x2F;S0009279706003541\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;abs&#x2F;pii&#x2F;S00092...</a><p>Biologists
    aren&#x27;t slouches. The thought about using computers to process biological
    data has been &quot;obvious&quot; for as long as there has been computers. AI
    and biology have been a thing since the Dartmouth conference. A lot of things
    that could have been tried have already been tried, but I guess we&#x27;ll keep
    trying until something works?<p>There ain&#x27;t much room for miracles here.<p>I
    wish that wasn&#x27;t the case. I really do. But it is what it is."
