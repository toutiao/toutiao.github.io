  author: Opocio
  text: |-
    The body is a complicated machine. Why can&#x27;t we fix it? because we don&#x27;t understand how it works with enough precision. But there is no magic to it. once you have a clear understanding it&#x27;s just a complicated piece of machinery, and once you also have tools precise enough to operate on it, you can just fix it.<p>Our lack of understanding is a mix of lack of data, and lack of intelligence applied to data in order to parse it appropriately. Let&#x27;s remember for a moment AlphaFold, that solved a problem considered by some even theoretically intractable. One year before we were convinced we were far off from a solution, the year after it was solved.<p>We have huge amounts of data about human body, at the scale at which it works (~proteins), it&#x27;s at least reasonable to think that the bottleneck is not data, but intelligence.
    If it&#x27;s data, a super intelligence can develop better instruments to collect data at a faster rate and precision. Consider the historical cost for DNA sequencing. Faster rate of improvements even compared to the Moore&#x27;s Law of the golden days.<p>Do we have a guarantee that in the next 10 years we&#x27;ll be able to crack all those problems and have a cure to all diseases? no. Is it unreasonable to think we will? I&#x27;d argue it&#x27;s not. It&#x27;s for sure not &quot;mental derangement&quot;.<p>Do I personally think we will crack all those? Well, no, because I think AI will kill us all and just focus on its own goals. But under the hypothesis that we align it, yes.
