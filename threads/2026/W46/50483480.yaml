  text: 'I believe the comment is in response to &quot;well why didn&#x27;t I think
    of that, it&#x27;s so obvious&quot; -- biologists have been thinking and trying
    to do this &quot;obvious&quot; approach for decades.<p>There&#x27;s a long history
    of Silicon Valley people thinking they can just bring in their experience and
    with a bit of Moore&#x27;s law brute-force their way into miracles.<p>AutoDesk
    tried this with molecular design. <a href="https:&#x2F;&#x2F;www.fourmilab.ch&#x2F;autofile&#x2F;e5&#x2F;chapter2_82.html"
    rel="nofollow">https:&#x2F;&#x2F;www.fourmilab.ch&#x2F;autofile&#x2F;e5&#x2F;chapter2_82.html</a><p>Lots
    of Silicon Valley people in the late 1990s thought they could be on the ground
    floor with nanotechnology design.<p>The chemist Derek Lowe 10 years ago used the
    phrase &quot;Andy Grove fallacy&quot; to describe the optimistic vision that data
    + massive computer power = cure for diseases. &quot;[T]he idea that understanding
    human disease and its treatments should be pretty much like designing a new chip
    or writing a new app&quot;, quoting the 2015 essay titled &quot;Silicon Valley
    Sunglasses&quot; at <a href="https:&#x2F;&#x2F;www.science.org&#x2F;content&#x2F;blog-post&#x2F;andy-grove-rich-famous-smart-and-wrong"
    rel="nofollow">https:&#x2F;&#x2F;www.science.org&#x2F;content&#x2F;blog-post&#x2F;andy-grove-rich-fa...</a>
    .<p>Why Grove specifically? He links back to his 2007 essay at <a href="https:&#x2F;&#x2F;www.science.org&#x2F;content&#x2F;blog-post&#x2F;andy-grove-rich-famous-smart-and-wrong"
    rel="nofollow">https:&#x2F;&#x2F;www.science.org&#x2F;content&#x2F;blog-post&#x2F;andy-grove-rich-fa...</a>
    : &quot;So I see that Andy Grove, ex-Intel, is telling everyone that the drug
    industry could use some of that Moore&#x27;s Law magic. I&#x27;ve noticed that
    people who spend a lot of time in the computer business often have an. . .interesting
    perspective on what constitutes progress in other fields, and we might as well
    appoint Grove the spokesman for their worldview&quot;'
