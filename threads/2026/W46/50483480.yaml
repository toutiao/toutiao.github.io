  text: No, “simply optimistic” doesn’t capture it.<p>Like, if your optimism is great
    enough, big enough, then you lose touch with what’s actually feasible. That’s
    where delusion starts.<p>It might be possible to compress 100 years of research
    into 10 years. Maybe. But it won’t be <i>these</i> 10 years.<p>Check the math.
    Say we get <i>huge</i> advances in AI tomorrow that double the speed of biology
    research. And imagine we then have 3 years where research is now 2x faster (which,
    again, would be absolutely enormous).<p>How much faster do the <i>remaining</i>
    7 years have to be, in order for the entire 10 years to capture 100 years of research?
    Roughly 13x.<p>Basically, every year you’re not already at &gt;10x is a year you’re
    falling behind. And AI is nowhere even <i>remotely</i> close to doubling the speed
    of research, much less 10x-ing it.
