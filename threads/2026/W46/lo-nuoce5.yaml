  text: |-
    Thanks for this, I wouldn’t have read it without your comment.
    Unfortunately the back and forth isn’t very illuminating. The OP seems excessively dogmatic. But the question is how well the paper author’s approach will work in practice. The idea that you can specialize your DB to the customer is appealing, but even a real world customer isn’t guaranteed to be as predictable as a benchmark. Real users’ requirements are going to change, data distributions will shift.
    I have a project of my own that has a risk/opportunity of “cheating in a principled way”—it compiles a separate class per regex, which means that I can theoretically have optimizations that are as narrowly scoped as I want. If the regex \${[a-z]+} turns out to be important for real world software, I could special-case it (and with AI, it’s pretty damn easy).
    However, I have no interest in cheating benchmarks for the sake of cheating benchmarks. The goal is to make real world use cases better, and generality and not-micro-optimizing benchmarks helps.
