  text: 'This is a very common problem with LLM-generated code.  ''Agents'' run in
    a loop generating and refining code towards some set of constraints.  Some of
    these are functional (does formal verification pass?  Do tests pass?), others
    are performance goals.  It''s very common to see someone write a benchmark to
    test some feature and then see the ''agents'' optimise for that microbenchmark
    at the expense of the common case.  The same applies to the functional correctness
    things: code that is correct for all of the tests, but introduces new corner cases
    that the tests don''t cover, or code that passes formal verification by exploiting
    some inadequate specification.  The last one is not new: I particularly remember
    EverCrypt accidentally satisfying their ''no memory is accessed after it is deallocated''
    property by never deallocating memory, but LLMs do this at an impressive scale.  They
    are machines for producing plausible sequences of tokens, not correct sequences.'
