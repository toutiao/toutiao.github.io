  text: |-
    A slice of the vulnocapyse firehose arrives on my plate to triage or fix, and from what I’ve seen I’m skeptical of anti-AI forks fixing security bugs themselves.
    Empirically, humans haven’t found the bugs that have been present for a long time and that LLMs are finding now, so a project that takes the stance that the method of discovery makes knowledge of the bugs inadmissoble aren’t going to find the bugs independently, so they will eemain unfixed.
    Projects that accept awareness of upstream bugs are going to run into ones where there is one reasonable fix (sometimes it really just is flipping the right boolean) is the one that came as an LLM suggestion along with the vulnerability report. Now you can’t prove if you wrote the same fix yourself or if you took the LLM fix. The list is going to go with the least charitable interpretation, so “$FORK_NAME is now slop”.
