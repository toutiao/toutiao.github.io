    [Resources](#u)\n  - [The Utah Teapot](/teapot/)\n  - [Teapot Rendering   \nCompetition](/trc/)\n
    \ - [Slide Templates](/resources/templates/)\n- [Contact](/contact/)\n\n- [Home](/)\n-
    [Resources](/resources/)\n- [Utah Teapot](/teapot/)\n\n  \n\n# The Utah Teapot\n\nModel
    Type: Orientation: \n\n  \nVersion: \n* * *\n\nBottom: \n\nInterior Version: \n\nSpout
    Cap: \n\nTexture Coordinates: \n\nSide: \n\n ![](textures/teapot-cy.jpg)\n\nThe
    **Utah Teapot** has been the symbol of computer graphics. It was one of the first
    computer graphics models created using [Bézier patches](https://en.wikipedia.org/wiki/B%C3%A9zier_surface).
    This is the official Utah Teapot page, where you can you can visualize and download
    any of these historical versions or customize it, using the settings above.\n\n_The
    Utah Teapot model files are freely available for any use, including commercial
    use. To preserve the historical identity and provenance of the model, users are
    requested to identify the model, and any substantially derived version of it,
    as a **Utah Teapot** (or **Modified Utah Teapot** ) and to acknowledge its origin
    as the historic Utah Teapot developed at the University of Utah. This request
    is intended solely to preserve the historical identity of the Utah Teapot and
    is not intended to restrict use of the model. The model files are provided “as
    is,” without warranty of any kind. The provider of these files shall not be liable
    for any claims, damages, or other liability arising from their use._\n\nThe Utah
    Teapot was originally created by Martin Newell and went through a number of modifications
    over the years. It quickly became famous within the graphics community after making
    its first appearance at SIGGRAPH in 1976. Its extensive use in graphics prompted
    Arvo and Kirk [1987] to name it the “Teapotahedron” and jokingly call it “the
    sixth [Platonic solid](https://en.wikipedia.org/wiki/Platonic_solid)”. It remains
    one of the standard models for evaluating new computer graphics algorithms and
    frequently appears in technical papers presented at SIGGRAPH and other graphics
    conferences. Utah Teapot has also appears in art installations, movies, video
    games, and a wide range of other graphics applications. Versions of the Utah Teapot
    model are included in numerous rendering and modeling programs and graphics APIs,
    among them 3ds Max, Direct3D, Houdini, Modo, OpenGL, POV-Ray, Quartz Composer,
    and RenderMan. See the [Wikipedia page on the Utah Teapot](https://en.wikipedia.org/wiki/Utah_teapot).\n\n[Martin
    Newell](https://en.wikipedia.org/wiki/Martin_Newell_(computer_scientist)), [Jim
    Blinn](https://www.jimblinn.com/), and [Cem Yuksel](https://www.cemyuksel.com/)
    tell the story of the [Utah Teapot](https://graphics.cs.utah.edu/teapot/) at SIGGRAPH
    2026, commemorating the 50th anniversary of the Utah Teapot's first appearance
    at SIGGRAPH in 1976. The extended abstract of this talk includes additional information:
    “[The Return of the Utah Teapot](https://doi.org/10.1145/3799818.3816116)” ([PDF](The_Return_of_the_Utah_Teapot.pdf))
    by Cem Yuksel, Jim Blinn, and Martin Newell.\n\n## Utah Teapot Versions\n ![](images/utah_teapot_evolution.svg)\n\nThe
    Utah Teapot has a number of versions that were developed and released over the
    years by different people from the University of Utah, as summarized below. [Version
    1975](#v1975) is how [Martin Newell](https://en.wikipedia.org/wiki/Martin_Newell_(computer_scientist))
    modeled it. [Version 1976](#1976) is the scaled down version by [Jim Blinn](https://www.jimblinn.com/).
    [Version 1987](#v1987) by [Frank Crow](https://en.wikipedia.org/wiki/Franklin_C._Crow)
    adds the round bottom. [Version 1992](#v1992) is the first attempt by [Hank Driskill](https://www.linkedin.com/in/hank-driskill-1a7140165/)
    for turning the Teapot into a solid object. [Version 2006](#v2006) by [Russ Fish](https://www.linkedin.com/in/russ-fish-b1113b/)
    improves the interior shape. Finally, [Version 2026](#v2026) by [Cem Yuksel](https://www.cemyuksel.com)
    further improves the interior, adds chamfers where the handle and the spout connect
    to the body, and makes the shape of the Teapot [curvature-continuous](https://graphics.cs.utah.edu/research/projects/continuity-enhancement/)
    to achieve reflection continuity.\n\n ![](images/utah_teapot1975.svg)\n### Version
    1975 - Martin Newell\n\nThis is the original version created by [Martin Newell](https://en.wikipedia.org/wiki/Martin_Newell_(computer_scientist)),
    while he was a PhD student at the University of Utah, by approximating the proportions
    of a physical teapot (Melitta by Friesland Porzellan). It is formed by 28 cubic
    Bézier patches, which he first [drew the control points on an engineering paper](https://archive.org/details/newell_teapot_drawing/).
    It is one of the first computer graphics object modeled using a set of nonlinear
    surfaces, rather than a collection of polygons. Notably, Martin Newell's version
    is taller than the commonly known shape of the famous Utah Teapot, and it has
    no bottom. This is the model that appeared in his dissertation, titled “[The utilization
    of procedure models in digital image synthesis](https://collections.lib.utah.edu/ark:/87278/s651906h)”
    in 1975, along with the rest of the tea set he modeled, though he prepared these
    models earlier, sometime in 1974.\n\n ![](images/newell-teapot-drawing-01-small.webp)
    ![](images/newell-teaset-640-471.webp)\n\nMartin Newell's drawing of the Teapot
    and the tea set image from his dissertation.\n\nHere is [a YouTube video](https://www.youtube.com/watch?v=ui3R1Dlmsk0&t=3182),
    where Martin Newell, at an event celebrating the 50 anniversary of [Computer Science
    department at the University of Utah](https://www.cs.utah.edu/), talking about
    the Teapot model.\n\n ![](images/utah_teapot1976.svg)\n### Version 1976 - Jim
    Blinn\n\n[Jim Blinn](https://www.jimblinn.com/), while he was a PhD student at
    the University of Utah, scaled Martin Newell's teapot model by 3/4 during a demo.
    He liked its new shape and kept it that way. In fact, everyone liked this shorter
    version, including Martin Newell. Since 1976, this version of the teapot appeared
    in numerous publications, turning it into a symbol of computer graphics.\n\nUtah
    Teapot was first introduced to the computer graphics community at SIGGRAPH 1976
    in an article by Jim Blinn and Martin Newell, titled “[Texture and Reflection
    in Computer Generated Images](https://doi.org/10.1145/360349.360353)” ([PDF](Texture%20and%20Reflection%20in%20Computer%20Generated%20Images.pdf)).
    It was also published in the Communications of the ACM journal and an image from
    this article, featuring the Utah Teapot with a texture mapped to its patches,
    was used as the cover of the October 1976 issue.\n\nJim Blinn explains the components
    of the teapot and why it was squished in an article titled “[What, Teapots Again?](https://doi.org/10.1109/MCG.1987.277080)”
    ([PDF](What%20Teapots%20Again.pdf)), published in IEEE Computer Graphics & Applications
    in September 1987. There, he also suggests adding a flat bottom cap.\n\n ![](images/cacm-cover-oct1976.jpg)
    ![](images/blinn-teapot-fig9a-orig.webp) ![](images/blinn-teapot-fig9b-orig.webp)\n\nThe
    cover of the CACM journal in October 1976, featuring one of the images from Blinn
    and Newell's paper at SIGGRAPH 1976, and two other images from the same paper
    with the original pixels computed on PDP-11 (after tone mapping) by Jim Blinn.\n\nHere
    is [a YouTube video](https://www.youtube.com/watch?v=VktqJ5I9aKY&t=3942s), where
    Jim Blinn, at a reception honoring [Ivan Sutherland](https://en.wikipedia.org/wiki/Ivan_Sutherland)
    at SIGGRAPH 2018, explaining why the Utah Teapot model is squished.\n\n ![](images/utah_teapot1987.svg)\n"
