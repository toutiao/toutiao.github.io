  text: But still - the basic space-time group properties and symmetries don&#x27;t
    give you the actual particles, not even a little bit. You could maybe say they
    give you a concept of a particle, and you can describe the actual particles that
    happen to exist in our universe using the properties that this group defines -
    sure. But you can&#x27;t simply write the group symmetries and discover that a
    particle with spin 1&#x2F;2 and mass 0.15MeV has to exist - you just discover
    that particles in this theory are described by mass and spin, with a certain relation
    between possible combinations of mass and spin. But there&#x27;s still an infinite
    number of such possible combinations, and only 30 or so actual elementary particles.<p>Plus,
    calling the particles that you get out of such a theory &quot;the electron&quot;
    or &quot;the quark&quot; is profoundly misleading. If you only start with a space-time
    related symmetry, you don&#x27;t get &quot;electrons&quot;, you maybe get particles
    with the spin and mass of an electron. But it doesn&#x27;t have charge, nor color
    nor weak hypercharge. It doesn&#x27;t decay and doesn&#x27;t absorb photons nor
    do anything else that an electron does - it&#x27;s not an electron. You need to
    combine this with a lot more symmetry groups to start getting the actual particles,
    and even then you still need to add the experimentally discovered values to match
    physics - the math allows for infinite numbers of various particles with properties
    similar to the ones our universe actually contains.<p>I&#x27;d also note that
    apparently the Euclidean group doesn&#x27;t have anything to do with particles
    anyway, it&#x27;s the Poincarre group whose irreducible symmetries lead to the
    (mass, spin) description of particles.
