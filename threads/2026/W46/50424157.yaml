  author: netbsdusers
  text: Notwithstanding that most kernels today are written almost entirely in C anyway,
    you&#x27;ll see learn a great deal about memory allocation by inspecting malloc().<p>The
    usual division of labour in most operating systems is the kernel manages the virtual
    memory and physical pages and provides a mechanism for coarse page-aligned allocation
    of virtual address for userland. These coarse mappings userland (malloc or something
    else) is responsible for carving up, and in that is much design space. Just look
    at mimalloc for example.<p>The kernel&#x27;s own page allocation is often very
    simple (many get by with a simple freelist, some use buddies.) The allocators
    for the kernel&#x27;s own datastructures are usually relatively simple at least
    conceptually. Bonwick explains the slab allocator - the almost universally acknowledged
    queen of all kernel memory allocators and mother of those of Linux, BSD, and beyond
    - in a 12-page paper.<p>As for the firmware there&#x27;s basically nothing of
    an ongoing role for it after the kernel is in charge. Its role is limited for
    the most part to providing the kernel with a map of the physical addres space.<p>By
    reading malloc() you will not learn everything about allocation - that is a problem
    that spans multiple layers - but you will certainly learn a lot about it. To call
    it a mere wrapper is not reasonable.
