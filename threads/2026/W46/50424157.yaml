  author: giannischatz
  text: |-
    A thing worth adding for anyone reading: in long-running PHP processes
    (workers, queue runners, Laravel Octane), the overhead of malloc&#x2F;free
    patterns compounds in ways the request&#x2F;response model hides.<p>A page handler that leaks 2KB per request is invisible under php-fpm
    (the process dies on the next request anyway) but becomes a slow memory
    creep in a queue worker that runs for hours. The fix usually isn&#x27;t
    &quot;call unset more&quot; — it&#x27;s recognizing which objects Zend&#x27;s refcount
    can&#x27;t collect without a full GC cycle (circular references, mostly),
    and forcing `gc_collect_cycles()` at known-safe points.<p>Took me a while to realize that in production.
