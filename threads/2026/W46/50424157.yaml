        .section bss
        ;;
        ;; Two heaps so we can flip-flop between them
        ;;
        heap_a:
            resb HEAP_SIZE
        heap_a_end:
        heap_b:
            resb HEAP_SIZE
        heap_b_end:
    </code></pre>
    Of course there are other syscalls involved in my compiler&#x2F;runtime, but for memory allocations the static area sufficed for me.
