  text: mmap is covered later on, and as an introduction to heap memory management
    this seems like the right place to start. jemalloc and mimalloc build upon the
    fundamentals explained here.<p>What I&#x27;d love is for an article that goes
    a step <i>back</i> in allocator theory instead of &quot;forward&quot; to jemalloc&#x2F;mimalloc.
    Optimal resource allocation has a rich history in pre-computer fields whose general
    theories are applicable today. Replace &quot;linear memory&quot; with &quot;paper
    roll&quot; and &quot;types&quot; with &quot;items&quot;, and instead of malloc
    you have the cutting stock problem! <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Cutting_stock_problem"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Cutting_stock_problem</a><p>The
    reason why allocator fundamentals are important is because there is no universally
    optimal solution. jemalloc &quot;emphasizes fragmentation avoidance and scalable
    concurrency support&quot; while mimalloc focuses on a bounded worst-case allocation
    latency. Meanwhile if you&#x27;re writing extremely memory constrained code for
    certain embedded systems, you may still be best off using a simple bump allocator
    with no free! <a href="https:&#x2F;&#x2F;devblogs.microsoft.com&#x2F;oldnewthing&#x2F;20180228-00&#x2F;?p=98125&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;devblogs.microsoft.com&#x2F;oldnewthing&#x2F;20180228-00&#x2F;?p=98...</a>
    The optimal resource allocation strategy is always use case dependent.
