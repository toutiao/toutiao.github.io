  author: Panzerschrek
  text: "<i>malloc</i> has terrible interface.<p>It has no way to specify custom alignment.
    So, if more than 8 or 16-bytes alignment is needed, custom user-code tricks are
    necessary (allocate more than necessary, round up).<p>It has no way to report
    how many bytes are actually allocated. Sometimes it may be useful, like if I reserve
    9 bytes for a string and underlying allocation granularity is 16 bytes, I want
    to know that I can increase string size up to 16 bytes without calling <i>malloc</i>
    again.<p>It&#x27;s a single entry point allowing no allocation size customizations.
    So, if I allocate objects of fixed size, I still need to pass a dynamic size parameter
    to <i>malloc</i> and it needs to perform branching in case if it does have some
    optimizations for particular sizes.<p><i>free</i> has no size parameter, which
    is a mistake. This forces the allocator to maintain size values somewhere inside,
    which is often an unnecessary overhead, since user code already knows size (like
    for fixed-size allocations or containers storing explicit capacity).<p>With interface
    fixes described above a <i>malloc</i> implementation can be much more performant
    and (sometimes) even easier to use."
