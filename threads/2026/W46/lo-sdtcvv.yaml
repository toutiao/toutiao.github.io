    ... since it was surprisingly difficult to find a tool to convert the ed25519 public key (--- BEGIN PUBLIC KEY --- or the like) into the familiar format you can stuff into authorized_keys.

    I've actually had the same issue in the past, and I made this bash one-liner which generates the authorized_keys line from the PEM using just openssl:
    {
      printf '\000\000\000\013ssh-ed25519\000\000\000\040'
      openssl pkey -pubin -in id_ed25519-whatever.pem -outform DER | tail -c 32
    } | base64 -w0 | sed 's/^/ssh-ed25519 /'; echo

    Of course these days I just stuff it into my ssh agent instead and just do ssh-add -L.
