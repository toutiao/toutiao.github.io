  text: |-
    I wanted to use ed25519-sk keys, but found out that a lot of LTS distros I work with have too old OpenSSH versions to understand them. Additionally most network appliances with custom CLIs don't pass validation if the key type isn't ed25519 even if the underlying OpenSSH version was new enough. Cloud instance provisioning is another place where those are not accepted. I feel like we've barely reached a place where ed25519 keys are accepted in most places in place of RSA keys, but still not everywhere.
    I had long discarded the possibility of using PIV applets (also present on Yubikeys for instance) since most of the examples I could find used certificate auth. There are even less places that would accept an SSH CA certificate if it's not a plain linux server that I directly manage. Recently I found out that it's possible to use the PIV applets to just store and use a private key!
    So I can also generate an ed25519 private key directly on the yubikey into one of the few key slots, and then use that like any key I would have generated with ssh-keygen -t ed25519. Fully accepted by vendor appliances etc. while only my client knows the difference.
    Of course RSA keys are also possible this way, and probably even easier to work with, since it was surprisingly difficult to find a tool to convert the ed25519 public key (--- BEGIN PUBLIC KEY --- or the like) into the familiar format you can stuff into authorized_keys. For RSA keys support was included in the ssh utilities, while for Ed25519 I ended up using some nodejs project after a quick review (because who doesn't like to set authorized_keys to the output of a random project from npm)
