  author: jMyles
  text: 'Huge isolated fields of solar end up with the same problem as nuclear: they
    introduce multiple single-points of failure.<p>The source can be attacked, the
    transmission infra can be attacked, the delivery point can be censored.<p>I think
    most people want highly distributed, reliable, affordable power.  That&#x27;s
    why off-grid tech is experiencing such a boom.<p>I live in a 36&#x27; skoolie,
    so I&#x27;m nomad-indexed, but I can confirm that over the past 10 years or so,
    most RV-lifers have transitioned their focus from recreation &#x2F; comfort to
    off-grid experimentation.  Essentially everywhere I go in the US, if I&#x27;m
    camped near others, they are going to have minimum viability for boondocking.  That
    was not the case when I started.<p>Especially amidst the current political instability
    and apparent looming collapse of the US state, one of the simplest things that
    most of us can do is stabilize off-grid power in our neighborhoods, and that is
    quietly happening all over the place.<p>So, the role of vertically integrated
    solar (both literally and metaphorically) has more to do with the grid shape that
    serves our stability needs, and less to do with large-scale differences in efficiency.'
