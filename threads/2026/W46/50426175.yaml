  url: https://www.anthropocenemagazine.org/2026/10/magenta-solar-panels-may-be-agrivoltaics-cleverest-trick-yet/
  title: Magenta solar panels may be agrivoltaics’ cleverest trick yet
  fetch_status: success
  content: "![Magenta solar panels may be agrivoltaics’ cleverest trick yet](https://www.anthropocenemagazine.org/wp-content/uploads/2026/10/rose-colored-agrivoltaics.jpg
    \"Magenta solar panels may be agrivoltaics’ cleverest trick yet\")\n\nDAILY SCIENCE\n\n#
    Magenta solar panels may be agrivoltaics’ cleverest trick yet\n\nSee-through solar
    cells harvest some wavelengths of light to make electricity, while passing through
    the red and blue wavelengths that plants need. In a new agrivoltaics experiment,
    broccoli yields held steady.\n\nBy [Douglas Fox](https://www.anthropocenemagazine.org/author/doug-fox/)\n\nOctober
    16, 2026\n\nLet the best of Anthropocene come to you.\n\n Sign up for our free
    newsletters\n\nVegetable farms and solar farms both need lots of sunlight and
    open space. But how do we divide our limited lands between these two priorities?
    One elegant solution is to put crops and solar panels on the same land—and share
    the broad spectrum of incoming sunlight between them.\n\nA new study in _Cell
    Reports Physical Science_ does this with photovoltaic cells that are semi-transparent:
    They capture some wavelengths of sunlight to make electricity, while letting the
    wavelengths most critical to photosynthesis pass through and reach the plants
    below. The new study suggests that [broccoli can be grown in the magenta shade
    of these solar panels](https://doi.org/10.1016/j.xcrp.2026.103555)—without sacrificing
    the harvest.\n\n[Agrivoltaic schemes—](https://www.anthropocenemagazine.org/2025/06/solar-farms-help-grasslands-beat-the-heat-and-significantly-boost-their-biomass/)putting
    plants and solar on the same land – could help us avoid clearing more land for
    human use. Climate studies suggest that [this might work especially well across
    a wide sunbathed swath](https://www.anthropocenemagazine.org/2026/03/how-beneficial-are-solar-panels-on-farms-it-depends/)
    of the United States, [from Texas up to Nebraska and west to California](https://www.nature.com/articles/s44359-025-00110-9).
    Devoting just one percent of U.S. farmland to agrivoltaics could [cover up to
    20 percent of the nation’s electricity](https://www.anthropocenemagazine.org/2021/01/on-a-mere-1-of-farmland-solar-panels-could-provide-20-of-us-electricity/)
    needs.\n\nBut traditional photovoltaic panels are opaque—and by shading plants,
    they can reduce crop yields. So engineers are trying to create new photovoltaic
    cells that divide the spectrum of sunlight between plants and electricity generation—similar
    to how governments segment different frequency bands for television, radio, cell
    phones, and other uses.\n\nA 2020 study looked at panels that allow red wavelengths,
    critical for photosynthesis, to pass through—while harvesting green and blue wavelengths
    to make electricity. Basil grown under these panels produced similar yields, while
    spinach yields decreased. But the researchers estimated that by selling both electricity
    and crops, farmers growing spinach [could generate 35 percent more income](https://www.anthropocenemagazine.org/2020/08/color-tinted-solar-panels-could-benefit-crops-the-environment-and-farmers-finances/)
    from the same land.\n\n&nbsp;\n\n[\n\nRecommended Reading:\n\nNew study compares
    growing corn for energy to solar production. It’s no contest.\n\n](https://www.anthropocenemagazine.org/2025/04/new-study-compares-growing-corn-for-energy-to-solar-production-its-no-contest/)\n\n&nbsp;\n\nIn
    the newest study, scientists evaluated a different kind of semi-transparent panel
    that lets most red and some blue wavelengths pass through—casting a magenta light
    on the plants—while converting much of the rest to electricity.\n\nBroccoli cultivated
    under them grew more slowly, requiring an additional 25 days for harvest, but
    produced roughly the same yield. Meanwhile, these magenta sunscreens improved
    the microclimate below, reducing the “vapor pressure deficit”—a measure of when
    plants need to halt photosynthesis to avoid excessive water loss. This may have
    improved the plants’ efficiency in converting sunlight into plant biomass, which
    increased by 2.8- to 4.5-fold compared to unshaded plants.\n\nThe shaded plants’
    levels of macronutrients such as calcium, magnesium, and phosphorus were either
    higher than or similar to unshaded plants, while levels of some micronutrients
    such as iron, copper, and zinc were slightly lower.\n\nThis was only a preliminary
    study. Future studies should look at larger plots, farmed across multiple seasons,
    and in different locations with varying climate and sunlight. It suggests that
    for now, the future of agrivoltaics might be best seen through rose-colored glasses.\n\nLu
    et al. “[Evaluating land productivity with semi-transparent colored CdTe thin-film
    PV and broccoli cultivation in agrivoltaic systems](https://doi.org/10.1016/j.xcrp.2026.103555).”
    _Cell Reports Physical Science_, 2026.\n\nImage: Broccoli growing beneath semi-transparent,
    colored solar panels at the experimental site at Kärrbo Prästgård farm in Sweden.
