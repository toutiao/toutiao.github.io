  author: myrmidon
  text: 'Kinetic orbital bombardment is utterly worthless from a military perspective.<p>People
    tend to have a completely inaccurate view on this because of bad popsci, out-of-context
    feasibility studies from the 1950s and fiction that just leans toward the &quot;fantasy&quot;
    on that.<p>The reasons for this is are very simple:<p>1) There is no &quot;high
    ground&quot;. Being in orbit does not enable you to throw things &quot;down&quot;
    for free, thats simply not how orbital dynamics work. All the impact energy you
    have to pay for up front, and delta-v on some orbital object is almost inevitably
    more expensive than the equivalent amount of explosives on the ground.<p>2) Anything
    launched from beyond earth orbit would be unusably delayed. And telegraphed.<p>3)
    The concept does not have a single selling point from a military perspective;
    not really faster than an ICBM, penetration is limited by newtonian physics regardless
    of speed and more expensive than just delivering the equivalent amount of explosives
    (or nuclear payload) via missile.<p>edit: Yes an interplanetary transport system
    could be weaponized. But so could the explosives currently used in mining (~tens
    of millions of tons per year), no one cares.'
