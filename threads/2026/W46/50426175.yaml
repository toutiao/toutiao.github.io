  author: kempbellt
  text: I believe that, while a cool technological innovation, the cost of installing
    and maintaining these panels will be significantly higher than doing the same
    on open land.<p>The article’s biggest claim is that devoting one percent of US
    farmland to agrivoltaics could cover 20 percent of the country’s electricity,
    pointing at the Texas to Nebraska to California corridor, which is exactly where
    big mechanized farms are most common.<p>They run large equipment (combines, sprayer
    booms, center pivot irrigation systems[1], etc). To keep that working under panels
    you need tall posts, wide spans, and a layout that matches the equipment paths,
    which would push structural cost <i>significantly</i> above a ground installation.
    All maintenance would require a boom truck, not just a ground crew. And center
    pivots in particular (very common) need an entire circle cleared for the system
    to pivot, meaning a multi-acre span with no posts for the pivot to hit, which
    is simply infeasible.<p>That’s before accounting for pesticide spray and dust
    on the PVs, or the logistical burden of running PV crews through a working farm.<p>It’s
    also worth noting that the study itself was broccoli, which is hand harvested
    and about the best case crop for this. Even so, the broccoli took 25 extra days
