  author: jMyles
  text: I bought my bus in 2015, so my personal picture is of the past 11 years.<p>The
    big changes seem to have been:<p>* Better &#x2F; more varied solar panels<p>*
    Lithium batteries (which I don&#x27;t use for a house bank, but still benefit
    from by dint of them having driven the price deep-cycle lead batteries down)<p>*
    USB-C everything<p>When I first started this lifestyle, almost everyone had lead-acid
    batteries powering an inverter, and a zillion wall warts converting power back
    to DC.  Some people had solar for sure, but a solid majority only camped where
    they were able to plug in.<p>At festivals, powered sites sold out quickly and
    at a premium.  Dispersed camping in national forests was the purview of tent campers,
    truck campers, and people who don&#x27;t use much power (ie, not a ton of remote
    workers).  New campgrounds always focused on power pedestals and seemed to regard
    that as the MVP.<p>Now, festivals are a sea of solar and&#x2F;or off-grid-cooled
    beers.  Campgrounds are often a de-facto swap meet of usb-c oddities (I have a
    USB-C coffee grinder - what a world!).  Dispersed camping in national forests
    are often transient standing desk communities.  Nary an inverter in sight - everything
    is direct-to-USB-C.<p>The difference between most people needing to plug in within
    a few hours in order to have their basic comforts vs. being able to live indefinitely
    without the grid has significantly changed what it feels like to be on the road.
  score: 0
