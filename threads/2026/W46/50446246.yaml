    and recognizing how they’re cousins to each other.<p>&gt; I encourage everyone
    to fool around with numbers—some enthusiasts discover important patterns that
    way, and some famous mathematicians, like the late John Conway, made a career
    of it.<p>&gt; When we give word problems in school, we tend to cherry-pick perfect
    models that have one correct answer. Rather than teach a preordained procedure,
    we could encourage exploration by asking students to fix more realistic models
    where things are slightly noisy or slightly incorrect.
