    are like that would be good candidates for this right?<p>But this question shares
    at least a spiritual geneology with the response to some new startup code that
    does some thing, and the comment here is &quot;Gee, I can&#x27;t believe that
    got this funded, I could write that in a weekend.&quot;<p>The problem is, there
    are many things that are easy to describe but difficult to pin down, and reality
    is complicated. So many times I&#x27;ve gone into a project thinking it would
    be &quot;easy&quot; only to start uncovering layer after layer that are much more
    involved than I expected.<p>So no, you cannot &#x27;1-shot prompt&#x27; pretty
    much any significant software, and that goes doubly true if it affects your life
    in any potentially devastating way.<p>One of the things I&#x27;m constantly amused
