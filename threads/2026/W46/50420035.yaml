  author: boie0025
  text: Yeah, my consultancy had used Harvest for over a decade. It just worked; it
    did what we needed, and I didn&#x27;t think twice about the $1500&#x2F;yr or so
    bill... Until this year when they dumped us over into &quot;enterprise&quot; and
    charged my business card TWENTY THOUSAND DOLLARS.  I found that charge two days
    after it posted when I went in to remove a seat for a contractor who had moved
    on.  I absolutely lost my shit.  I couldn&#x27;t get ahold of anyone at harvest
    at all, and wound up executing a charge back. Finally someone reached out via
    email with a &quot;deal&quot; charging us &quot;only&quot; $5000&#x2F;yr (for
    literally the same service we had used prior).  I get an increase of maybe even
    10% but this was pure nonsense.  Ultimately harvest refunded us and the chargeback
    was reversed, which came with its own set of problems.<p>In response we have moved
