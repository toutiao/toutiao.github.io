  content: "# [RIP, Harvest](/posts/427-rip-harvest)\n\n[Software](/tags/software)
    [Business](/tags/business)\n\nI’ve been a self-employed contractor for about a
    decade now, and I’m bummed about [Harvest](https://www.getharvest.com/).\n\nHarvest
    was a time-tracking and invoicing service. You’d track how many hours or weeks
    you spent on a project, put together an invoice, email it to the client, and close
    it out when they paid. There was a little Stripe integration for accepting credit
    and ACH payments on the invoice web view. A historical chart of total billed/paid
    amounts over time, and a table of invoices. Harvest was exactly what you want
    from small-business software: it solved a well-defined problem with a reliable,
    simple interface, and did so at a reasonable monthly price. They managed to avoid
    scope creep and never tried to become an accounting platform, or a blockchain
    for washing machines. I loved Harvest and raved about it to every self-employed
    person I met.\n\nBack in 2025 Harvest got bought out by [Bending Spoons](https://www.reddit.com/r/HarvestApp/comments/1q25xpy/purchase_by_bending_spoons/),
    the company that [gutted Vimeo](https://news.ycombinator.com/item?id=46707699).
    I was worried they might ruin it, but was busy with other things and didn’t have
    time to look for new invoicing software.\n\nLong story short, they raised my price
    from $13.32 to $133.98 per month by moving everyone to a new “enterprise” plan
    and “unlimited” usage billing model, which is, as far as I can tell, exactly what
    I had before. There’s also a “flex” plan which costs $12.65 per month… but that
    plan now skims an additional 2% on top of the usual ~3% card transaction fees.
    To be clear, that 3% pays for the whole credit card network, plus all the people
    working at Stripe and Mastercard, plus the financial risk of chargebacks and fraud,
    etc. Harvest isn’t doing any of that work. I don’t know about you, but I don’t
    think I need to spend 2% of my gross revenue to send a couple PDFs a month and
    wrap a Stripe web form.\n\nI wrote to Harvest about this, and discovered that
    they don’t read customer emails any more. Instead they have a Large Language Model
    repeatedly vomit thousands of words at you. I’m no stranger to enshittification,
    but man, I did not anticipate the speed at which Bending Spoons would drive a
    perfectly good company into the ground.\n\nTime to find a new invoicing service,
    I guess. Maybe bookkeeping too—Intuit’s Quickbooks Online seems to have completely
    jumped the shark. Any of y’all freelancers have a system you like?\n\n* * *\n\n1.
    Yes, someone actually tried this.\n\n ![Lucas Cherkewski](https://www.gravatar.com/avatar/d283f8d93b4b59077ff0c45af78f8d7b?r=pg&s=96&d=identicon
    \"Lucas Cherkewski\")\n\n[Lucas Cherkewski](https://lucascherkewski.com) on \n\nSorry
    to hear this—it was such a quality service. I used to used Harvest, but changed
    many years back to [Cushion](https://cushionapp.com/) when I was still freelancing.\n\nHas
    the same core set of features (including invoicing integrated with Stripe, but
    with no markup!), plus a number of others designed specifically with freelancers
    in mind. Kind of a one-man shop, but dependably so—Jonnie always responded quickly
    to support issues when they came up.\n\nReally quality piece of software, full
    of delightful little bits, and felt much better supporting someone I could put
    a face to than a faceless company.\n\n ![Chris](https://www.gravatar.com/avatar/22d0038769b1786fcdc0983bdb2e4033?r=pg&s=96&d=identicon
    \"Chris\")\n\n[Chris](https://sirh.cc) on \n\nI’ve had some success with Odoo.
    Have you tried it?\n\n ![Cypress](https://www.gravatar.com/avatar/9e06601efd25d92b663356b57948b40f?r=pg&s=96&d=identicon
    \"Cypress\")\n\n[Cypress](https://cypress.com) on \n\nI’ve heard good things about
    [https://usebilly.app/en](https://usebilly.app/en) but I think it targets the
    EU so it might have a niche for the specific requirements there and not work as
    well for the US\n\nI personally don’t use it but I really admire their design
    ethos and local-first apl design\n\nI do use a timetracking app called Tim [https://tim.neat.software/](https://tim.neat.software/)
    it’s very simple and doesn’t generate invoices but it’s also local first and saves
    to a human readable text file so you can import it into an invoicing script or
    software\n\n# Post a Comment"
