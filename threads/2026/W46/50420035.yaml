  author: cjcampbell
  text: We also just encountered the new pricing structure when we received the notice
    for our annual renewal. I am able to limit the impact to a roughly $200&#x2F;30%
    increase due to the prior year basis, but with no changes to the pricing structure,
    I’ll jump another $2k when I renew next year.<p>The big impact will be due to
    us trying to serve a larger number of small clients. Since pricing tracks clients&#x2F;projects&#x2F;tasks,
    our 2028 pricing will rise substantially as we add clients (or decide to track
    projects more granularly for existing clients).<p>The move feels like enough of
    a price gouge that I have also decided to move away from harvest. With a year
    to plan and execute, I will likely build a solution into our client portal. It
    won’t take much effort to replace what we got from harvest, and there’s an opportunity
    to create something that further automates the rest of our billing and tax workflow.<p>I
    don’t tend to wish ill for others, but I’m happy to see similar anecdotes in this
    case. My gut is that bending spoons has done lasting damage to the brand. I wasn’t
    considering a change before I encountered the new pricing. But now I can confidently
    say that there’s not much they could offer to keep me as a customer beyond 2027.
    The trust is broken, and they have vastly overestimated their value proposition.
