  title: A Message to Our Company | NVIDIA Newsroom
  fetch_status: success
  content: "# A Message to Our Company\n\nNVIDIA founder and CEO Jensen Huang sent
    the following email to NVIDIA employees earlier today.\n\n November 8, 2026 \n\n[![A
    Message to Our Company](https://iprsoftwaremedia.com/219/files/202512/692f56983d6332f89cbbc58b_nvidia-logo-horiz-wht-16x9/nvidia-logo-horiz-wht-16x9_mid.png?v=44a60e3f-c4e5-4d8a-879f-ec5121ad6f4b
    \"A Message to Our Company\")](https://iprsoftwaremedia.com/219/files/202512/nvidia-logo-horiz-wht-16x9.png)\n\nI
    owe my family and all of you an apology.\n\nI was unfaithful to my wife. My actions
    hurt her and our children. There is no excuse for what I did. I am deeply sorry.\n\nThroughout
    my life, my family has given me love and support. They deserve my honesty and
    loyalty. Instead, I let them down and damaged the life we built together. I take
    full responsibility for what I did and the hurt I caused, and I accept the criticism
    that comes with it.\n\nTo my wife and family: I love you. I know an apology cannot
    undo what I have done. I hope our family will heal and that, over time, I can
    earn back your trust.&nbsp;\n\nTo my colleagues at NVIDIA, including those I have
    worked alongside for decades, and to our board, partners, and shareholders around
    the world: you deserve better from me. Leading NVIDIA is the privilege of my life.
    My responsibility is to serve you and be worthy of your trust. I have fallen short
    of that responsibility. I am fully committed to NVIDIA and will work to earn back
    your confidence.\n\nRegarding the national security concerns raised in news reports,
    NVIDIA’s Board of Directors has initiated an independent investigation. I support
    the investigation and will cooperate fully. I love our country and our company.
    I am committed to protecting NVIDIA and supporting America’s national security.
    I am proud and grateful to be an American.\n\nMy family bears no responsibility
    for my choices. I do. Please give them privacy.\n\nJensen"
