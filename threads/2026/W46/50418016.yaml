  text: |-
    Full text:<p>Subject: A message to our company<p>Body: &quot;I owe my family and all of you an apology.<p>I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.<p>Throughout my life, my family has given me love and support. They deserve my honesty and loyalty. Instead, I let them down and damaged the life we built together. I take full responsibility for what I did and the hurt I caused, and I accept the criticism that comes with it.<p>To my wife and family: I love you. I know an apology cannot undo what I have done. I hope our family will heal and that, over time, I can earn back your trust.<p>To my colleagues at NVIDIA, including those I have worked alongside for decades, and to our board, partners, and shareholders around the world: you deserve better from me.
    Leading NVIDIA is the privilege of my life. My responsibility is to serve you and be worthy of your trust. I have fallen short of that responsibility. I am fully committed to NVIDIA and will work to earn back your confidence.<p>Regarding the national security concerns raised in news reports, NVIDIA&#x27;s Board of Directors has initiated an independent investigation. I support the investigation and will cooperate fully. I love our country and our company, and I am committed to protecting NVIDIA and supporting America&#x27;s national security. I am proud and grateful to be an American.<p>My family bears no responsibility for my choices. I do. Please give them privacy.&quot;
