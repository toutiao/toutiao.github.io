  content: "# Rust 1.100.0\n\n# Choose a tag to compare\n\n## Sorry, something went
    wrong.\n\n## Sorry, something went wrong.\n\n### Uh oh!\n\nThere was an error
    while loading. Please reload this page.\n\n## No results found\n\n## Language\n\n-
    Stabilize never type\n\n- Lint against repeated #[repr(..)] attributes\n\n- Stabilize
    extern \"custom\"\n\n- Extend dropping_references, dropping_copy_types and undropped_manually_drops
    lints to drop_in_place\n\n- unfulfilled_lint_expectations no longer fires on #[expect(dead_code)]
    inside code that is covered by a dead parent's diagnostic\n\n- Turn the error
    for repr(align) fields in a repr(packed) type into a deny-by-default lint aligned_fields_in_packed\n\n-
    volatile: allow accesses to non-AM memory to trap\n\n## Compiler\n\n- Stabilize
    -Cprofile-sample-use\n\n- Enable next solver by default in orphanck\n\n## Platform
    Support\n\n- i686-pc-windows-gnu is now a tier 2 without host tools target\n\n-
    Promote wasm32-wasip3 to Tier 2\n\n- Add new Tier 3 target powerpc64-sony-ps3\n\nRefer
    to Rust's platform support page for more information on Rust's tiered platform
    support.\n\n## Libraries\n\n- Stabilize custom allocators\n\n- Map ENOTSUP to
    ErrorKind::Unsupported\n\n- Fix soundness issues in std::sys::pal::sgx::waitqueue::unsafe_list\n\n##
    Stabilized APIs\n\n- impl PartialEq<Cow<'_, [U]>> for Vec<T, A>\n\n- impl PartialEq<Cow<'_,
    [U]>> for &[T]\n\n- impl PartialEq<Cow<'_, [U]>> for &mut [T]\n\n- std::alloc::Allocator\n\n-
    std::alloc::Global\n\n- std::alloc::System\n\n- impl Allocator for Global\n\n-
    impl Allocator for System\n\n- impl<A: Allocator> Allocator for &A\n\n- impl<T:
    Allocator, A: Allocator> Allocator for Box<T, A>\n\n- impl<A: Allocator> Allocator
    for &mut A\n\n- impl<T: Allocator, A: Allocator> Allocator for Arc<T, A>\n\n-
    impl<T: Allocator, A: Allocator> Allocator for Rc<T, A>\n\n- Box::new_in\n\n-
    Box::from_raw_in\n\n- Box::from_non_null_in\n\n- Box::into_raw_with_allocator\n\n-
    Box::into_non_null_with_allocator\n\n- Box::allocator\n\n- Vec::new_in\n\n- Vec::with_capacity_in\n\n-
    Vec::from_raw_parts_in\n\n- Vec::from_parts_in\n\n- Vec::into_raw_parts_with_allocator\n\n-
    Vec::into_parts_with_allocator\n\n- Vec::allocator\n\n- Child::main_thread_handle\n\n-
    impl Default for std::sync::Once\n\n- bool::toggle\n\n- Box::take\n\n- Box::map\n\n-
    Rc::map\n\n- Arc::map\n\n- impl AsRef<T> for !\n\n- impl AsMut<T> for !\n\n- core::mem::DropGuard\n\n-
    core::mem::conjure_zst\n\n- UnsafeCell::replace\n\n- UnsafeCell::as_ref_unchecked\n\n-
    UnsafeCell::as_mut_unchecked\n\n- str::trim_prefix\n\n- str::trim_suffix\n\n-
    [T]::trim_prefix\n\n- [T]::trim_suffix\n\n- Path::trim_prefix\n\n- Vec::from_fn\n\n-
    os::windows::process::CommandExt::show_window\n\n## Cargo\n\n- Introduced Cargo's
    own linting system: some Cargo warnings are now emitted as lints that users can
    control in the [lints.cargo] table. This includes a new built-in unused dependency
    check via the cargo::unused_dependencies lint. docs #17298\n\n- Introduced minimum
    publish age configurations, also known as dependency cooldowns. When the relevant
    config is set, the resolver ignores versions published more recently than that,
    unless they are already in Cargo.lock. (RFC 3923) docs #17335\n\n- cargo-install:
    now uses the existing lockfile in the .crate tarball by default. --locked in cargo
    install becomes a no-op. #17388\n\n- Cargo now uses a new directory layout for
    intermediate build artifacts. Tools that inspect the build directory may need
    to use Cargo’s JSON messages to locate build artifacts instead of relying on the
    build directory layout. The layout is not a stable interface and is subject to
    change. (build cache doc) #17354\n\n## Rustdoc\n\n- Add new invalid_markdown_table
    rustdoc lint\n\n## Compatibility Notes\n\n- Closures now more precisely capture
    variables used in if let. This may cause new errors\n\n- Check dyn-compatibility
    of trait objects in more places\n\n- Infallible is now a type alias to !\n\n-
    The never type fallback was changed to ! on all editions\n\n- box patterns are
    no longer syntactically allowed\n\n- Report Query Cycle errors in more cases when
    computing the layout of enums with explicit discriminants\n\n- Always escape grapheme
    extenders in str::escape_debug\n\n- Make let-else respect macro_rules expr metavariable
    grouping\n\n- Iterator::{min,max}(_by_key) changed which Ord methods they use.
    This cannot change behaviour (other than being potentially faster) for types correctly
    following the Ord rules, but may impact types with inconsistent trait implementations.\n\n-
    Emit an error when trying to enable SSE/AVX on an x86 (32bit or 64bit) softfloat
    target\n\n- Require windowed (and exception) for Xtensa ABI\n\n- windows-gnullvm:
    always link libunwind statically\n\n- From version 1.94 up to 1.100 a number of
    ARMv7-A hardfloat targets required the VFPv3-D32 FPU as a minimum, as they erroneously
    had the d32 feature in their baseline list of features. Breakage introduced as
    a result of correcting this can be fixed by passing -Ctarget-feature=+d32 to Rust.\n\n-
    Change \"Rust\" ABI on x86 to use SSE registers if they are always-available for
    the current target\n\n- Make the ambiguous_glob_imported_traits lint fire in slightly
    more cases\n\n- Make +fix-cortex-a53-835769 a default feature for aarch64-unknown-fuchsia\n\n-
    Some impls on Box have been generalised to arbitrary allocators, which may cause
    new type inference errors\n\n- The standard library now uses Unicode version 18.0.0\n\n-
    WASI SDK version was bumped from 33 to 34\n\n- On ARM targets, -Ctarget-feature/-Ctarget-cpu
    values that would alter the ABI are rejected as hard errors now.\n\n## Other\n\n-
    Test harness now allows passing --test-threads and --color multiple times, with
    later arguments overriding earlier ones\n\n### Uh oh!\n\nThere was an error while
