  author: jared_stewart
  text: The point is to have a DMARC record, setting it to none doesn&#x27;t really
    do much of anything for you though. If you really wanted to take advantage of
    it you will need a DMARC monitoring solution - the market seems to typically price
    these around $10&#x2F;month for small-ish domains (though there are a lot of caveats).
    I&#x27;m trying to build a reasonable free option that maybe isn&#x27;t enough
    to get a domain to a reject policy, but should be enough for you to maintain a
    reject policy.<p>The truth is that there are amply &quot;non-sending&quot; domains
    out there which ignore DMARC and allow abuse. Stopping the assumption of no policy
    mean p=none prevents this abuse from persisting.
