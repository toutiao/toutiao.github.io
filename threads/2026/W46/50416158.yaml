  author: jared_stewart
  text: You don&#x27;t have to, this is the key reason to have a DMARC monitoring
    service. It will tell you when there&#x27;s a deliverability issue with some particular
    receiver.<p>DMARC applies not on your mail server, inbound or outbound, but on
    the server that is receiving your mail (which may in fact be your mail server).<p>That
    server will look at how the mail authenticates and decide if it should allow the
    mail to proceed, it (for the most part) will then tell you whether or not it allowed
    the mail. This is how you will know you might have a deliverability problem before
    your customers do.<p>If you&#x27;re wanting to know about deliverability (particularly
    for this Microsoft case), my company (Alesian Security) has a free check at <a
    href="https:&#x2F;&#x2F;alesiansecurity.com&#x2F;try?tab=deliverability" rel="nofollow">https:&#x2F;&#x2F;alesiansecurity.com&#x2F;try?tab=deliverability</a>
  score: 0
