  author: jared_stewart
  text: 'Yes, this is an older announcement from last year. Yahoo and Google did the
    same at that time.<p>The failure associated with that announcement is different.
    It is 5.7.515.<p>This new failure mode is &quot;5.7.1 Message rejected: Message
    lacks SPF&#x2F;DKIM&#x2F;DMARC Auth Records (AS9031519)&quot;, I haven&#x27;t
    seen any formal announcement on my end. The important thing to know about 5.7.1
    is that it represents a few different failure modes, the AS9031519 is the important
    bit and it indicates that the domain lacks a DMARC record.'
