- id: '50417696'
  parent_id: '50416824'
  author: jared_stewart
  text: There&#x27;s been ample evidence of this, many different blogs, notification
    emails etc.<p>This thread duplicates the first observations of this which showed
    up here yesterday at <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50404161">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50404161</a><p>My
    mail provider, MXroute, sent me a notification of the issue early yesterday. There
    is commentary from various DMARC providers (Suped and PowerDMARC). This is a real
    thing.<p>It does not matter which host you are using, this has nothing to do with
    the hosting provider. It has everything to do with having your domain correctly
    set up on DNS so that anybody receiving mail will know how to authenticate it.
    Microsoft has apparently advanced a policy that if you don&#x27;t even try you
    don&#x27;t get to send.<p>IMO this is the right call, I&#x27;ve seen plenty of
    spoofing attacks where the attacker took advantage of nonexistent policy on non-sending
    domains. You might think that if you don&#x27;t have an MX record the domain can&#x27;t
    be used to send mail, that is wrong. The MX record only tells others where to
    send your mail, it says nothing about whether the domain can send mail itself.
  score: 0
