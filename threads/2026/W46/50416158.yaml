  text: "&gt; so tell me what benefits that has over having no dmarc record at all
    ?<p>The the existence of a DMARC assertion record in the DNS changes how the MTA
    (the receiving system) assesses the authentication of the message and  authorization
    of the sender with SPF and&#x2F;or DKIM, as per rfc7489 (and now also rfc9989).<p>No
    DMARC results in the MTA falling back to the original assessment method as defined
    in the original SPF and DKIM RFCs. These RFCs have design flaws and don&#x27;t
    define the assessment flow all that well, they leave a lot up to the MTA&#x27;s
    digression&#x2F;interpretation.<p>So, the existence of a DMARC record with p=none
    is fundamentally different over not publishing a DMARC assertion record at all.
    It&#x27;s just that with p=none you don&#x27;t enforce the MTA to reject the email
    if it fails authentication&#x2F;authorization, you&#x27;re leaving it up to the
    MTAs digression."
