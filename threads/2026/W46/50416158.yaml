  text: DMARC is a DNS record that says &quot;send emails about spoofed messages here&quot;,
    or optionally &quot;I don&#x27;t need you to tell me that scammers exist on the
    internet&quot;.<p>It doesn&#x27;t prevent spoofing, it doesn&#x27;t say which
