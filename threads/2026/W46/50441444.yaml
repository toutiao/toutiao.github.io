  author: breakwaterlabs
  text: "&quot;Reason about it&quot; is where your abstraction has sprung a leak.<p>LLMs
    do what they say on the tin: they model language. If you ask an LLM &quot;find
    security vulnerabilities in my code&quot; for hello_world.rs, the next likely
    tokens are &quot;I found the following vulnerabilities&quot;, regardless of what
    logic or reason say.<p>It happens to be true that predicting next tokens on your
    own output mocks actual reasoning fairly well. But it still just a simulacrum
    rather than the real thing, and when held as an abstraction it leaks everywhere.<p>Understanding
    this is critical to avoiding the common failure case of scope creep and code slop."
  score: 0
