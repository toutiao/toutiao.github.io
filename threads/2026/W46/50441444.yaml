  author: make3
  text: Your counterpoint is incorrect. The savings of speculative decoding are a
    direct function of how hard it is to predict the next token. Which means that
    for a specific task, the smaller model can be used more in a language which uses
    more tokens to say the same thing (to perform the same task), as the difficulty
    of the task is fixed between languages and the language that takes more tokens
    &quot;spreads the same difficulty&quot; over more tokens.<p>I suspect that it
    still ends up being cheaper in English, but parent&#x27;s point that speculative
    decoding helps is valid.
