  author: ozgung
  text: My understanding is that it’s about tokenization. English input is converted
    into less tokens because tokenizer is optimized for English. This makes huge difference
    because all the output tokens are fed back into the input at each token generation.
    And attention blocks are generally quadratic with the input tokens. So foreign
    language means more tokens everywhere and more tokens mean more passes and much
    more compute and memory.
