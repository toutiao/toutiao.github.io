    [_RSS_](/feed/ \"RSS\")\n\n###### Trending\n\n## Generative AI uses more energy
    on non-English text\n\n### Models can use up to 15 times more energy to process,
    generate text in widely spoken languages, often with lower-quality output\n\n[![A
    portrait of a woman and a man. Flags from several countries hang from the ceiling
    in the background.](https://news.umich.edu/wp-content/uploads/2026/11/generative-ai-uses-more-energy-on-non-english-text-Portrait-1024x683.jpg)](https://news.umich.edu/wp-content/uploads/mc-image-cache/2026/11/generative-ai-uses-more-energy-on-non-english-text-Portrait.jpg)\n_Rada
    Mihalcea, Janice M. Jenkins Collegiate Professor of Computer Science and Engineering
    and director of the U-M AI Lab, stands next to Naihao Deng, a doctoral student
    in computer science and engineering. Image credit: Brenda Ahearn, University of
    Michigan Engineering._\n\n**Key takeaways:**\n\n- Gen AI uses 1.4 to 180 times
    more energy to produce text outside the English language.\n- Higher energy costs
    increase the barrier to using AI for billions of people worldwide—they must either
    pay more or switch to a non-native language.\n- AI developers could improve energy
    efficiency by training models optimized for specific languages or incorporating
    translation pipelines into their services.\n\nWhen processing and producing non-English
    text, generative AI burns more energy and sometimes provides less accurate answers,
    potentially reinforcing existing global inequalities, according to University
    of Michigan Engineering researchers.\n\nThe energy disparity is greatest in languages
    that don’t use Latin script and have less digital content available for training.
    AI models could use 1.4 to 180 times more energy to generate non-English text,
    with most Western European languages coming in at twice the energy expenditure
    or less. However, Hindi and Bengali, each spoken by hundreds of millions of people,
    require 7.9 and 15.3 times more energy than an equivalent English prompt.\n\n[![Naihao
    Deng](https://news.umich.edu/wp-content/uploads/2026/11/generative-ai-uses-more-energy-on-non-english-text-Naihao-Deng-100x100.png)](https://news.umich.edu/wp-content/uploads/mc-image-cache/2026/11/generative-ai-uses-more-energy-on-non-english-text-Naihao-Deng.png)\n_Naihao
    Deng_\n\n“The languages that typically consume more energy also tend to have lower
    accuracy in the model output,” said [Naihao Deng](https://dnaihao.github.io/),
    a doctoral student in computer science and engineering from the [U-M AI Lab](https://ai.engin.umich.edu/)
    and the first author of the study, which was presented at the Empirical Methods
    in Natural Language Processing conference of the Association for Computational
    Linguistics.\n\n“Most people will want to use AI models by asking questions in
    their native languages, and they may feel pressured to use it as it’s incorporated
    into more parts of society, but the double penalty makes it more likely that certain
    people will be priced out of AI and that companies will be more reluctant to serve
    models in certain languages.”\n\n[![A chart plots the amount of energy used by
    LLMs (in Joules) when responding to user prompts in several languages against
    the number of native speakers of those languages. Urdu and several Indic languages
    are the first languages for more than 800 million people combined, but generative
    AI requires more than four times more energy when using these languages instead
    of English. More people speak Spanish and Chinese as their first language than
    English, yet generative AI requires twice as much energy when using these languages.](https://news.umich.edu/wp-content/uploads/2026/11/generative-ai-uses-more-energy-on-non-english-text-AI_energy_by_language-1024x685.png)](https://news.umich.edu/wp-content/uploads/mc-image-cache/2026/11/generative-ai-uses-more-energy-on-non-english-text-AI_energy_by_language.png)\n_A
    chart showing the amount of energy required, on average, for large language models
    to respond to user prompts in eight languages ranked among the world’s most widely
    spoken, as well as several commonly spoken Indic languages. The chart is based
    on data available in this spreadsheet: AI energy use by language. Image credit:
    Scott Hyde, University of Michigan Engineering._\n\nAt present, around 5.2 billion
    people have to use more than twice as much energy to generate text in their first
    language compared to English speakers, according to the researchers’ measurements
    and demographic data available in [Ethnologue](https://www.ethnologue.com/). But
    the researchers also provide recommendations to bridge the gap and ensure that
    users aren’t penalized for trying to use AI in their language of choice.\n\nTo
    help quantify AI energy use and improve efficiency, the National Science Foundation
    and the Defense Advanced Research Projects Agency (DARPA) partially funded the
    research.\n\n#### Measuring AI’s language energy disparity\n\nThe researchers
    found the energy and accuracy disparity by measuring the amount of energy used
    by three open-source AI models, Alibaba’s Qwen 3, Google’s Gemma 3, and Meta’s
    Llama 3.1. They asked each model to answer multiple-choice questions included
    in [Belebele](https://aclanthology.org/2024.acl-long.44/), a dataset for assessing
    the reading comprehension of AI models in 122 different languages. They then measured
    the amount of energy used to answer each question using the [ML.Energy framework](https://ml.energy/data/),
    developed at Michigan Engineering.\n\nTo check for the disparities in other types
    of tasks, the researchers also asked the models to answer a collection of grade-school
    math word problems and open-ended user prompts included in other benchmarking
    datasets. Because these datasets aren’t multilingual, the researchers translated
    the English questions into seven other languages using Meta’s translation tool,
    [No Language Left Behind](https://ai.meta.com/blog/nllb-200-high-quality-machine-translation/).\n\nAll
    the models used less energy for English text, on average. The energy disparity
    persists at larger model sizes and across different types of computer processors.\n\n[![A
    chart plots the amount of energy used by LLMs (in Joules) when responding to user
    prompts in several languages against the number of native speakers of those languages.
    Urdu and several Indic languages are the first languages for more than 800 million
    people combined, but generative AI requires more than four times more energy when
    using these languages instead of English. More people speak Spanish and Chinese
    as their first language than English, yet generative AI requires twice as much
    energy when using these languages.](https://news.umich.edu/wp-content/uploads/2026/11/generative-ai-uses-more-energy-on-non-english-text-AI_energy_plot_more_examples-1024x683.jpg)](https://news.umich.edu/wp-content/uploads/mc-image-cache/2026/11/generative-ai-uses-more-energy-on-non-english-text-AI_energy_plot_more_examples.jpg)\n_A
    chart showing the amount of energy required, on average, for large language models
    to respond to user prompt"
