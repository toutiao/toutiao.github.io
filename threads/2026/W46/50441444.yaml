  author: rhdunn
  text: The Anthropic and OAI APIs report token usage (input, output, and in some
    cases reasoning&#x2F;thinking). The input tokens consist of the system prompt,
    the user input&#x2F;messages, and any other context data.<p>Given the same model
    the only variable is the token count. The more tokens, the more passes through
    the LLM (to generate the next output token), the more energy used.<p>It&#x27;s
    well known that non-English text consumes more tokens [1], [2] and thus more energy.
    This is due to two factors:<p>1. Latin script languages having different character
    pairings to English and modified characters, including language features like
    modifying verbs for person&#x2F;tense&#x2F;etc. (e.g. Spanish);<p>2. Non-Latin
    scripts that take more bytes to represent in UTF-8 and (esp. for ideographic and
    syllabic languages like Chinese, Japanese, and Korean) have lower common character
    pair sequences, meaning shorter tokens for those scripts and thus more tokens
    for a given text sequence.<p>[1] <a href="https:&#x2F;&#x2F;ikriv.com&#x2F;blog&#x2F;?p=5322"
    rel="nofollow">https:&#x2F;&#x2F;ikriv.com&#x2F;blog&#x2F;?p=5322</a> &quot;LLM
    tokens and foreign languages&quot; (5 Aug 2025)<p>[2] <a href="https:&#x2F;&#x2F;medium.com&#x2F;@programmerraja&#x2F;how-your-llm-costs-5x-more-if-you-dont-speak-english-e65912a870e0"
    rel="nofollow">https:&#x2F;&#x2F;medium.com&#x2F;@programmerraja&#x2F;how-your-llm-costs-5x-mor...</a>
