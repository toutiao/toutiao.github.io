  author: anal_reactor
  text: It&#x27;s extremely difficult to find, hire, and then put into the right position
    a competent security engineer. Meanwhile competent hackers grow on trees. I understand
    that mistakes here were silly, but that&#x27;s not the point. The point is, security
    is fucking difficult.<p>IMO the practical solution to this problem - because telling
    companies &quot;just do security better&quot; works as much as telling fat people
    &quot;just eat less&quot; - would be some kind of central registry of car parts.
    This was already implemented in iPhones back in the day that if a repair wasn&#x27;t
    signed off by Apple, you couldn&#x27;t install a new part to your iPhone. I imagine
    that if the government had a similar thing but for cars, then thieves would stop
    stealing cars because each stolen part would eventually be flagged somewhere and
    the end customer would be upset, never coming back.<p>I say &quot;government&quot;
    because companies cannot be trusted to make a simple interface &quot;log in -&gt;
    enter part number and car license plate -&gt; ready to install&quot;. I assume
    that outside of the US the &quot;log into government website&quot; part is already
    solved in one way or another. On the privacy side, it really shouldn&#x27;t be
    controversial, assuming that people are already used to the VIN having a repair
    history tied to it.
