  author: jaza
  text: Sounds like the automaker in question actually did plenty of things right
    - they put robust auth in place, they didn&#x27;t roll their own auth &#x2F; cryptography,
    they were most of the way there. Yes, security is difficult, but there are some
    simple rules that you don&#x27;t need to be a security expert in order to adhere
    to (I&#x27;m definitely not one myself, I&#x27;m just a garden variety dev), and
    that these guys did not follow, in particular:<p>- Never hard-code credentials
    (especially in front-end exposed code)<p>- Never share credentials between environments
    (especially between prod and non-prod)<p>And that first rule, in particular, you
    can (and should) very easily enforce with static analysis tools. If they had just
    made it harder to shoot themselves in the foot, with basic checks like that, this
    hack would probably not have been possible.
