  author: msandford
  text: That&#x27;s more my personal estimation than a Number Backed By Science (tm)
    but here are my reasons:<p>1. Enough computer control for reasonable efficiency<p>2.
    Largely independent computers<p>3. No centralized infotainment that controls the
    entire car (you can swap the radio)<p>4. Still lots of knobs and dials, no touchscreens<p>5.
    Enough computers to get pretty good diagnostics if&#x2F;when something goes wrong<p>6.
    Most of them have lock clickers, maybe trunk, almost nothing else<p>7. Engines
    are older, built &quot;heavily&quot; and don&#x27;t suffer from too much boost
    &#x2F; high bearing load<p>I think the last one is a big one that the closer a
    car gets to say 2020ish the more you really have to look at how it was built to
    know what you&#x27;re getting.  It&#x27;s great to have a two-stage oil pump to
    reduce pumping losses when an engine doesn&#x27;t REALLY need 60psi of oil pressure
