  author: _fw
  text: "&gt; “Unattributable” means the chats weren&#x27;t labeled with who wrote
    them or which workspace they came from, and the transcripts did not contain tool
    call results. Beyond what’s in the chat transcript itself, there’s no information
    tying the chat back to a workspace, user, or company.<p>This is astonishing.<p>They’re
    saying “OTHER THAN THE ACTUAL CONTENTS OF YOUR CONVERSATION, NO INFORMATION WAS
    PRESENT”. That is not what unattributable really means and they’re trying to assert
    otherwise.<p>It’s trivial to identify the organisation or individuals involved
    in a conversation most of the time, but Notion are trying to make out that because
    the metadata wasn’t present, it’s no cause for concern.<p>That’s absolute bullshit
    and will give people a false sense of security. The contents of your conversation
    IS the critical information. Notion’s desktop app is very aggressive in prompting
    users to transcribe their calls and I imagine a large proportion do so by default.
    The potential for harm here is large.<p>I appreciate it’s Fireworks’ fault this
    happened, but Notion’s response destroys my confidence in them."
