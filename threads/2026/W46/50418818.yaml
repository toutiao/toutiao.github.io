  author: xyzzy_plugh
  text: The problem is that when you build at this layer, you end up writing far more
    scheduling code than business logic. Eventually you&#x27;ve built the abstractions
    we already use today.<p>The vast, vast majority of software, and software developers,
    simply do not care about core affinity, NUMA, noisy neighbors, etc.<p>Even on
    systems or situations where this matters (massive number of cores and memory,
    multiple sockets, thousands of threads, etc.) the juice is rarely worth the squeeze.<p>Doubly
    so when you end up being I&#x2F;O bound anyways.<p>Nearly every software developers
    wants their software to work across multiple deployment targets. Maybe you just
    target x86-64, and you don&#x27;t care about the number of CPUs because you&#x27;ll
    be upgrading your servers every couple of years.<p>No one wants to deal with difficult-to-reproduce
    issues related to scheduling in niche configurations. It&#x27;s much more efficient
    for runtime or compiler engineers to solve these problems for us, leveraging the
    vast amount of resources of corporations to develop and test these features. Then
    you have a place your code can live happily ignorant of its runtime constraints.<p>And
    that, my friend, is the beauty of our industry.
