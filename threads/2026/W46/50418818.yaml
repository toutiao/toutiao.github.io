  author: tialaramex
  text: I don&#x27;t think fearless concurrency is strongly related to the atomic
    memory ordering model.<p>C++ 11 wants to model two non-trivial orderings, Acquire-Release
    and Consume-Release, but only Acquire-Release is actually usable. So yes, C and
    Rust both also choose to offer Acquire-Release ordering like C++ but it&#x27;s
    also clear that the universe of possibilities is actually smaller than WG21 realised
    when C++ 11 was developed.<p>If on your first random stab you guess 65537 is prime,
    you&#x27;re correct and you <i>might</i> foolishly assume all those Fermat Numbers
    are prime and then try say, 4294967297. Nope, that&#x27;s divisible by 641 for
    some reason. There are only Five of these Fermat Primes so far as we know, they
    weren&#x27;t common after all.
