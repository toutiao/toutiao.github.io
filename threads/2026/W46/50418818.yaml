  author: cowlevel
  text: 'Explanation: shared_ptr is an implementation of &quot;reference counting&quot;.
    All shared_ptrs to the same object collaborate to know how many of them exist
    (it&#x27;s just a ++ on creation of one, -- on destruction of one) and when the
    last one is destroyed it also destroys the object that&#x27;s pointed to.<p>weak_ptr
    is like shared_ptr but doesn&#x27;t add to the count. When the last shared_ptr
    is destroyed it destroys the object even if there are still weak_ptrs. Any weak_ptrs
    pointing to that object become null. I won&#x27;t dive into how that&#x27;s actually
    implemented. Obviously it costs some CPU cycles to make that happen, so you don&#x27;t
    see shared_ptr or weak_ptr a lot in code that&#x27;s written with a performance
    mindset. Although you&#x27;re still getting 90% of the performance benefit by
    writing C++ instead of JS even if it&#x27;s &quot;inefficient&quot; C++.<p>I agree
    with GP&#x27;s point and add, <i>if this isn&#x27;t something you need to do,
    then don&#x27;t even think about it</i>. C++ is like a toolbox with a bunch of
    tools. I don&#x27;t study all the tools before building a table, I look up how
    to build a table, and then see if the tools are in my toolbox. Studying the triangle
    screwdriver would be a waste of time and only confuse me more, unless I&#x27;m
    trying to drive triangle screws. Only when I need to drive a triangle screw then
    I can look for the triangle screwdriver.'
