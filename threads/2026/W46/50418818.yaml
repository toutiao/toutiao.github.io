  author: Vaushite
  text: Knowing the story behind a decision like that is worth a thousand spec clauses.<p>When
    the language got operator overloading there was the question of how to convert
    the arguments from the operator itself to its implementation. You wanted to write
    a+b, not &amp;a+&amp;b but most versions of operator+ were going to want const
    pointers for efficiency. One option was to make the &amp; implicit, another was
    to introduce a type of argument that didn&#x27;t need &amp; but acted like a pointer.
    So references were born.<p>I ignore people who advise to use references when something
    can&#x27;t be null. A null reference is UB just like a null pointer, it just shifts
    where the UB is, but the compiler is likely to produce the same code either way
    and the program is just as likely to crash. Instead, I use pointers to make it
    obvious that something is a pointer, and references when it should be invisible,
    just like with operator overloading.
