  author: steveklabnik
  text: "&gt; Why is this so critical that we can&#x27;t say we&#x27;re going to put
    it in another next version of the standard?<p>This feature was first proposed
    in 2004. In 2018, they were added to the draft of the standard, and then removed
    in 2019. So that already has been happening, for over a decade.<p>Part of the
    reason this is coming to a head is that it&#x27;s already been a long time. Another
    reason is that some see contracts as fitting into the safety story for C++. Part
    of it is because, well, standards are done by the people that show up, and the
    people who show up care about this.<p>&gt; I&#x27;m disagreeing that this is so
    critical it needs to abort the whole process.<p>It&#x27;s a byproduct of how the
    process works. There are a series of votes, and they&#x27;re not done by the same
    people. Some people voted yes to put them in, and then the vote after involved
    people voting no, they don&#x27;t think they&#x27;re good enough to put in. It
    is not so much that &quot;this is so critical that it needs to abort the whole
    process,&quot; so much as it is &quot;the final vote is the time when those people
    get to express their support or dissent.&quot; One of the proposals in the paper
    is that they could remove this feature, and then the rest would likely move forward.
    It will only hold up the entire thing if the people who are pro this feature landing
    decide that it&#x27;s worth holding everything else up for."
