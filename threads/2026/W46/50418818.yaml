  text: This is a well-written and quite diplomatic summary by Herb Sutter. I&#x27;m
    not plugged in enough to be sure he&#x27;s correct that Stroustrup&#x27;s opposition
    was the main reason the C++26 vote failed where others have passed, but it sounds
    plausible.<p>It also lists 6 possible paths forward for C++26 with pros and cons.
    I think they are roughly:<p>A. Skip an official C++26 standard but roll these
    features into C++29.<p>B. Remove contracts from C++26 and pass it.<p>C. Say &quot;please&quot;
    and vote again.<p>D. Tweak contracts regarding virtual functions and vote again.<p>E.
    Pass C++26 as many different countries&#x27; <i>national</i> standards rather
    than an international standard.<p>F. Do E and also consider leaving ISO and moving
    to ANSI&#x2F;INCITS instead.
