  author: bluGill
  text: What does guaranteed enforcement mean? Is it worth the trade-offs? There&#x27;s
    a reason why most code turns assert off in production and only does it in debug
    builds. A lot of checks are certainly possible to run, but they&#x27;re unreasonably
    expensive to run and so if the code is trusted to work, you wouldn&#x27;t want
