    I graduated last year and it very well might just have been the teams I was interacting with and looking at their code but command based seems to have become far more common and at least for our team was the default choice. I am quite curious what the rewrite will look like as I graduated before we got to use it (and systemcore which is very sad). The WpiLib team has done a really good job trying to make it intuitive to use but the main issue from my standpoint was too many very similarly named options and very few docs beyond just javadoc. There are very different options that are all setup as commands almost identically to each other.
    I may be coming at this from the 5% angle though. Our team was never super competitive but we did always have a workable bot that let us push for autonomous control (which was also very much my hobby. At least from the limited set of regional competitions I went to it seemed like most of them had a pretty good grasp on hardware. I’ve been really surprised how fast the manufacturing techniques have advanced for a lot of teams as it is largely not feeling possible be competitive without having a large metal shop and people who can design custom parts.
