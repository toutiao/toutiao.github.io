    I would offer that the critique of command-based in this article largely seems to be referencing the old Commands v1 way of doing commands, which has changed significantly in the last few years. You now just define a single function to define a command now, rather than having to write an entire class. The semantics are also much clarified. Take a look at a modern robot project before deciding against it for the reason of verbosity.
    That said, a lot of the critiques in this article are entirely fair, given different circumstances for different teams.
