  text: |-
    FRC is quite weird from a software point of view. I would say that probably 75% of teams struggle to design/build the hardware reliable enough to play the game. For these teams (I was on one of them) it doesn't really matter what software is running, you can't patch bad hardware. This is where a lot of the bits of advice in the article make less sense - it's impossible to not store arm position in software (estimation) if you want to attempt autonomous period work if you don't have a sensor (well, you can also do it purely on time here too). It's also impossible to be position-based instead of time-based without various sensors for position.
    For the next 20% of teams that have competent hardware, then I would totally agree that dead simple periodic code without commands is the most appropriate fit. And these teams generally end up well funded enough to have sensors to be able to measure these and use it. (It seems like this is where you fit from a look at the blue alliance). But this is what I also see a lot of, though often quite spaghetti (these are high schoolers, after all).
    I'll add here that WPILib (especially Tyler of 3512? iirc) has done a lot of wonderful work here on bringing a lot control theory beyond PID to be easier to implement for these teams, and having a lot of turnkey components for this, something previously limited to the top teams (or people using LABVIEW). Kudos also to Dalton (who I think works for CTRE now?) for doing a lot of work on documentation.
    The top 5% of teams is where this changes. Listed in the advanced section of documentation, Command-based makes significantly more sense when your robot is heavily automated, and you have half a dozen different preplanned trajectories for your (hypothetical) double arm grabber claw mechanism for the different goals. You have a desire to do the many different "modes" of operation this article describes because you are doing many different things. This is mostly driven by team factors, and the current year's game, not software.
    I'll add also that I believe command-based waz significantly reworked by (iirc) someone rom one of the top-scoring Israel teams. This is where it fits and makes sense.
    Maybe this has changed, as I haven't been involved in a few years, but I do not recall seeing many command-based teams in the wild.
