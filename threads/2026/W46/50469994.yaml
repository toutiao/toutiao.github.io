  author: spwa4
  text: 'It doesn&#x27;t matter. The courts are entirely unfair. Take the copyright
    office&#x27;s arguments: it states the court should <i>explicitly</i> address
    &quot;Market Harm&quot;. Essentially, ANY fair use, such as AI training should
    be illegal, if it harms the market for the original authors EVEN WHERE THE LICENSE
    WOULD NORMALLY ALLOW THAT USE. That was reasoning applied to protect billionaire
    profits from the horror of library lending. The copyright office&#x27;s position
    documents this extensively.<p><a href="https:&#x2F;&#x2F;www.copyright.gov&#x2F;ai&#x2F;Copyright-and-Artificial-Intelligence-Part-3-Generative-AI-Training-Report-Pre-Publication-Version.pdf"
    rel="nofollow">https:&#x2F;&#x2F;www.copyright.gov&#x2F;ai&#x2F;Copyright-and-Artificial-Intell...</a><p>See
    IV. Fair use, D. Factor Four<p>In other words, <i>no matter the license</i>, the
    fact that OpenAIs fair use of the works for training MIGHT take opportunities
    from the plaintiffs should, BY ITSELF, be an argument to make that AI training
    illegal. Even if the software programmers agreed to allow AI training, then still
    sued OpenAI, that is a valid argument accepted from billionaire companies.<p>In
    case you&#x27;re wondering how the court argued that in this decision? It didn&#x27;t.
    Not covered at all. Obviously brought up by the plaintiffs, not adressed. The
    weirdest pro-billionaire arguments are just accepted by the court (the big one
    is accepting AI models as making new works despite the copyright act clearly stating,
    50+ times, only &quot;natural persons&quot; can make new works), and the most
    reasonable, long established principles, such as market harm (if the use of a
    copyrighted work harms its authors in the smallest way, even lost sales, even
    lost job opportunities, lost licensing opportunities, ...) is enough to forbid
    it&#x27;s use EVEN WHERE THE LICENSE STATES DIFFERENTLY.<p>This was required because
    they wanted to forbid digital lending out of Disney&#x27;s movies, where the lending
    software would guarantee that only one copy is actually in circulation (ie. use
    of DRM to let a library just show a movie without the patron coming to the library
    to get it). In other words: when billionaires want to make money of works, and
    the first sale doctrine as well as long standing fair use principles for libraries
    were in the way, the courts declared that market harm superseded fair use. And,
    of course, suddenly, when it protects programmers from billionaires, it doesn&#x27;t
    apply anymore.<p>The courts deciding this way has done incredible damage to the
    availability of older works, to the point of destroying them entirely, since libraries
    cannot legally keep collections of older works and make those available over the
    internet, and it is impossible to keep the physical media in working condition
    and available over a large area, like the united states, for example.<p>Repeating
    theme here: absurd arguments to protect billionaire profits, silently rejecting
    and ignoring reasonable arguments to protect normal people.'
