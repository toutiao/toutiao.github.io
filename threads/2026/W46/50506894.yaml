  author: mike_hearn
  text: Ahhhhh this is a common misconception and it&#x27;s dangerous. V8 is <i>not</i>
    a battle tested sandboxed execution environment, not unless by battle tested you
    mean battle wasted. V8 is full of sandbox escape vulnerabilities practically &quot;by
    design&quot;, always has been, probably always will be - and the Chrome engineers
    knew this from the start which is why from day one they invested so heavily in
    kernel-level sandboxing.<p>But the kernel sandbox is <i>NOT A PART OF V8</i>.
    It&#x27;s not even reusable or modular, it&#x27;s a hard coded part of Chrome&#x27;s
    startup sequence and tuned for Chrome&#x27;s exact needs. If you embed V8 via
    its API you don&#x27;t get it.<p>I&#x27;ve seen this misconception several times
    now including in quite serious places, where people talk as if V8 on its own has
    a robust sandbox. It doesn&#x27;t! This will blow up in people&#x27;s faces eventually.<p>If
    you want a JS engine that&#x27;s secure by design then the only one I know is
    GraalJS, as it&#x27;s written in a memory safe language and uses partial evaluation
    to create its compiler so you can&#x27;t get interpreter&#x2F;JIT mismatches.
    It also has a proper sandboxing API and can transparently run code out of process.
    They&#x27;re experimenting with integrated Landlock support now, so it actually
    will get a built in kernel sandbox on Linux out of the box, unlike V8.<p>This
    issue vexes me enough that I wrote a whole article about it:<p><a href="https:&#x2F;&#x2F;medium.com&#x2F;graalvm&#x2F;writing-truly-memory-safe-jit-compilers-f79ad44558dd"
    rel="nofollow">https:&#x2F;&#x2F;medium.com&#x2F;graalvm&#x2F;writing-truly-memory-safe-jit-com...</a><p>There&#x27;s
    an introduction to the sandboxing APIs here:<p><a href="https:&#x2F;&#x2F;medium.com&#x2F;graalvm&#x2F;sandboxing-script-extensions-with-graalvm-f192a8fb0c5f"
    rel="nofollow">https:&#x2F;&#x2F;medium.com&#x2F;graalvm&#x2F;sandboxing-script-extensions-with...</a>
