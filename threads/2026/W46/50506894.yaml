  author: atombender
  text: 'ObjectPascal&#x27;s downward spiral was tied to Borland&#x27;s. When Borland
    started to struggle, there weren&#x27;t any other implementations — Borland&#x27;s
    was the only viable one.<p>Evne in its heyday, Borland&#x27;s Pascal-based products
    were not that big in the developer tools market. Delphi was a huge hit in Europe,
    but in the US, they were dwarfed by Microsoft. So Pascal&#x27;s influence is a
    bit like that Brian Eno saying (paraphrasing): “Only 30,000 people bought the
    first Velvet Underground album, but everyone who bought it started a band.”<p>Part
    of Borland&#x27;s fall was betting too much on client&#x2F;server database stuff
    at a time when the web was happening. They renamed themselves Inprise and marketed
    a suite of technologies called MIDAS which nobody remembers anymore. You used
    Delphi to build database GUIs on top of MIDAS and, say, Oracle. I don&#x27;t know
    what they were thinking. They also did a Linux version of Delphi called Kylix
    which was just using Wine (!).<p>Even so, I suspect ObjectPascal would have failed
    eventually. A language tied to a GUI toolkit, without a standard spec, or a cross-platform
    open source implementation, just couldn&#x27;t last forever.<p>I held onto Delphi
    far after it was evident that it was a dying language. I actually did a ton of
    my work in the 1990s and early 2000s doing non-GUI stuff in Delphi, including
    web backends and commercial games, which I suspect was not that common. ObjectPascal
    actually worked wonderfully as a server-side language. It was a strict, statically
    typed language, it had modern constructs like classes and threads, it was natively
    compiled, very fast, had a terrific interactive debugger. In many ways a perfectly
    fine alternative to C++ at the time, including for game development — I made my
    own bindings for DirectDraw, DirectSound, and so on.<p>At the time — say, around
    2000 — I didn&#x27;t find the alternatives compelling. Java was dead slow and
    didn&#x27;t offer anything language-wise. Languages like Python were also slow
    and were not type-safe. But there came a point when Linux had just taken over,
    and ObjectPascal wasn&#x27;t a viable option anymore.<p>Today, the closest thing
    in spirit to the ObjectPascal language isn&#x27;t C#, I think, but Go.'
