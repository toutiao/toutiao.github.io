  author: pjmlp
  text: Outside Borland and Apple, people tend to forget that already in 1976, Niklaus
    Wirth came up with Modula-2, exactly to fix all the shortcomings from a language
    originally designed for teaching, with one properly designed for systems programing
    from the start.<p>As for your sequence, from someone that was around back then,
    .NET and C++ only exist as you know it thanks to Sun&#x27;s lawsuit regarding
    Java language and runtime extensions introduced in J++.<p>Then an internal research
    language originally named Cool, became C#, the language extensions in J++ were
    made into C# features (events, J&#x2F;Direct, COM interop), Windows Foundation
    Classes became Windows Forms, and J# was released in .NET 1.0 as transiton technology.<p>Had
    it not been for the lawsuit, Ext-VOS (.NET codename) would have been released
    with J++ instead.<p><a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20190111203733&#x2F;https:&#x2F;&#x2F;blogs.msdn.microsoft.com&#x2F;dsyme&#x2F;2012&#x2F;07&#x2F;05&#x2F;more-c-net-generics-research-project-history-the-msr-white-paper-from-mid-1999"
    rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20190111203733&#x2F;https:&#x2F;&#x2F;blogs.msd...</a><p>Follow
    the linked paper for Ext-VOS, aka COM+ Runtime, aka .NET.<p>Microsoft would revisit
    this COM+ Runtime a decade later with WinRT,<p><a href="https:&#x2F;&#x2F;arstechnica.com&#x2F;features&#x2F;2012&#x2F;10&#x2F;windows-8-and-winrt-everything-old-is-new-again"
    rel="nofollow">https:&#x2F;&#x2F;arstechnica.com&#x2F;features&#x2F;2012&#x2F;10&#x2F;windows-8-and-winrt...</a>
  score: 0
