  author: MichaelRo
  text: 'Went the way of the dinosaurs. I learned about pointers and memory on Hi-Soft
    Pascal on a ZX Spectrum from this book: <a href="https:&#x2F;&#x2F;www.okazii.ro&#x2F;limbajul-pascal-corina-corici-dorin-manz-a236207648"
    rel="nofollow">https:&#x2F;&#x2F;www.okazii.ro&#x2F;limbajul-pascal-corina-corici-dorin-ma...</a><p>Here&#x27;s
    a page from the book I was reading in 1993: <a href="https:&#x2F;&#x2F;imgur.com&#x2F;a&#x2F;7UWdGgS"
    rel="nofollow">https:&#x2F;&#x2F;imgur.com&#x2F;a&#x2F;7UWdGgS</a><p>For reference,
    ZX-Spectrum has 48Kb of RAM out of which 8Kb is video memory, so unusable.<p>Then
    you have to load the Pascal compiler into the remaining 40k of RAM. Allocate some
    RAM for stack and environment variables for the editor where you write your program,
    plus space for the actual program. Then compile your program into the same 40k
    of space. And run it, using heap and stack memory from which memory space? You
    guessed right, same 40k.<p>To recap, on 40k of RAM you had back then:<p>- The
    Pascal compiler<p>- The Pascal source code in text form<p>- The Pascal executable
    form in machine code<p>- The Pascal data&#x2F;memory. Of which, recently in a
    &quot;tech demo&quot; of automated tests, one colleague said &quot;unfortunately
    we only have a very limited amount of RAM to be able to do basically anything
    [that&#x27;s why the product is a mess with no tests]. Only 32Gb per [virtual]
    machine&quot;.<p>One of my first programs was a Tetris clone, because ZX-Spectrum
    BASIC was slow as molasses. All on top of only having tape for storage so if I
    fucked up a pointer (I don&#x27;t think Pascal had the concept of access violation
    back then but I sure discovered it on my own skin), it would take 5 minutes to
    load the Pascal compiler + some backup copy of my Tetris game, hopefully not from
    a month ago and hopefully I remember what I changed. Lots to discover and have
    &quot;fun&quot; with.<p>About a year later I did find a compiler for BASIC and
    it turned the unplayable BASIC code for Tetris I wrote in the 9th grade into a
    totally playable Tetris game, without the need to learn another language and paradigm
    (pointers!) but the damage was done. Ignoring a year of databases, in 12th grade
    of high school computer science class (elite class, found there basically all
    the Math olympics I was competing with in gymnasium), I got introduced to C and
    from then on, here I am, 30 years later, doing C++ in finance for an S&amp;P 500
    company.'
