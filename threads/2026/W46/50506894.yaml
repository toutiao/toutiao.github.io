  text: 'While some comparisons may look silly, the fact that the touch command&#x27;s
    binary should exceed Turbo Pascal is insane: the command basically creates an
    empty file or updates the file change date if the file already exists, not more.<p>There&#x27;s
    no reason (other than laziness) why that should take more than 2k.<p>On the other
    hand, a lot of boilerplace code is repeated in each and every command. When I
    first learned as a kid about UNIX commands being ordinary programs, I was intrigued
    (there is nothing &quot;special&quot; about them, you can also write your own!)
    but also shocked about the overhead compared to an architecture in which e.g.
    the shell contained all (at least core) commands compiled into a single binary,
    which could share all the error handing, startup code, command line parsing code
    and so on.'
