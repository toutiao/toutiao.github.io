  author: raddan
  text: 'If you run `strace` you can get a hint at why `touch` (and any modern, compiled
    C binary) might be big: it is doing way more than you think it does, and you definitely
    _want_ a lot of that.  For example, any program that uses the C standard library
    needs to have that code available-- since virtually every C program is going to
    use it, it will be loaded and mmap&#x27;ped into some region of memory.  The stack
    needs to be set up, memory protection bits will be set, a random value is read
    to be used as a stack canary, etc, etc.  I count on the order of 50+ system calls.<p>Watching
    `mv` do its thing is even better.  About 100 system calls, including playing nice
    with SELinux in case it happens to be installed, just to issue a single `renameat2`
    system call.<p>Don&#x27;t forget that we&#x27;re running on a 64-bit machine.  MS-DOS
    in 1986 was a 16-bit machine?  The word size on a modern machine is bigger because
    we have a bigger address space, more registers, and more instructions.<p>We want
    speed and security and convenience and pleasant error messages.  All of this is
    put here by the compiler to ensure that we have nice things.  It sounds awesome
    to have such a small Pascal compiler, and it makes the modern state of binaries
    seem bloated, but all those extra bytes are paying for things that we want.  There&#x27;s
    probably a little bloat, but really, there is not much bloat.'
