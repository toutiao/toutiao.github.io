    get people to do things they wanted to do <i>anyway</i>. They just act as a kind
    of meeting point (or &#x27;lightning rod&#x27;, take your pick) that senses the
    general mood, and figures out a way forward that most of the group can agree with.
    Repeated (sometimes continuous) back-and-forth is important here.<p>In politics
    it&#x27;s often the other way around: many people are unhappy, politician comes
    up with a plan to do <i>something</i>, and tries to push that through. Such action
    often fails as it -mostly- ignores feedback from the people the changes are imposed
    upon.<p>Acknowledging a problem is important. But more important is understanding
    the problem through the eyes of those affected by it, understanding how an action
    would change things from that point of view, and adjusting control knobs as you
    go. Few leaders are good at ALL those things.'
