  author: safety1st
  text: I don&#x27;t really like the grey rocking idea, I think it has its place,
    the article covers this, there are a few true psychopaths out there where the
    best strategy is to totally disengage but if you can&#x27;t do that the next best
    thing is to grey rock around them.<p>But beyond that I wouldn&#x27;t use it, I
    think it creates a boring and stagnant life. What I think is better is to have
    a few &quot;north stars&quot; and pick your battles. Only pick the fights which
    bring you closer to your north star and which you have a good shot at winning.
    Go ahead and pick those with reckless abandon, and when you run out of them you
    really do just get to turn off, go home, watch some TV, maybe meditate on where
    you might find more of those battles, but otherwise ignore anything and everyone
    you feel like ignoring.<p>This will create a way more interesting and fruitful
    life than a general policy of being boring in order to be ignored. This is how
    you carve out a life which is exactly what you want to live, instead of living
    in reaction to others. Just be smart about when you stick your neck out or spend
    your energy and attention. Especially in the modern era where attention is the
    most valuable resource in existence.
