  author: avidiax
  text: 'My suspicion, as someone that has anhedonia and dysthymia myself, is that
    there are a couple of nuances to your situation.<p>First, is that grey rocking
    is a tactical choice, an act. If you&#x27;ve done this since adolescence, it suggests
    that this is a learned defense mechanism, not a tactical choice. Someone that
    is truly &quot;grey rocking&quot; has some kind of relatively lively personality
    that they are suppressing as a tactic. This doesn&#x27;t sound like what you&#x27;ve
    described for yourself. That&#x27;s not to say that you don&#x27;t have some lively
    personality in waiting: we all were rambunctious or curious children, and somewhere
    inside all of us, that child lives.<p>Second, I would suspect that you grew up
    in an environment where having needs, showing excitement, or expressing strong
    opinions drew attack, mockery, or drama. Thus, being boring and expressing no
    opinions or emotions was a quite valid adaptation to the environment, which persists
    into adulthood.<p>The unfortunate trick is that you usually won&#x27;t start doing
    various activities that make healthy people happy (socializing and hobbies) and
    experience the same happiness and joy. The early phase will be that you feel some
    curiosity, attention or engagement, and perhaps anger and annoyance at the friction
    in any new or long disregarded experience.<p>Feeling <i>something</i> is the first
    step.'
