    putting on, so the potential adult version of who I was never formed, it was created
    while acting.<p>For someone who is already an established adult, it may be a different
    story, especially if it&#x27;s just for a few months and around one person who
    has the ability to leave.<p>I am trying to work on it now, after 20 years of using
    alcohol as a crutch to feel things and participate socially, which killed all
    my other hobbies and the social participation over time.<p>The warning is more
    for younger readers or those who would need to employ this for years on end, especially
    through big life transitions. Be careful not to lose yourself in the role.
