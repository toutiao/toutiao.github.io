    was being created, the file behind the two different hard links changed; the archival
    utility noticed it, and included the new content of the file as the content for
    the second hard link instead of rewinding and overwriting the original file in
    the archive (which would be impossible to do on a tape, you know). At least I
    believe that&#x27;s what was the rationale for this allowance, and the intended
    behavior on the extraction."
