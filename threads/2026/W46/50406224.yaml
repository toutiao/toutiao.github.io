  fetch_status: success
  content: "## Hacking the meta ray-ban smartglasses\n\n[hacking](https://p0pcycle.com/category/hacking/)\n\n[educationalsabbatical](https://p0pcycle.com/tag/educationalsabbatical/),
    [meta](https://p0pcycle.com/tag/meta/), [smartglasses](https://p0pcycle.com/tag/smartglasses/)\n\nBack
    in July I wanted to check out the pwn2own targets for 2026. Since the rules hadn’t
    been released yet, I decided I would check last year’s targets in the hope that
    it would be similar.\n\nImagine my surprise when I managed to get arbitrary code
    execution on the glasses and they weren’t in the wearables category anymore :’).\n\nIt’s
    fine though because I still reported it to meta, and after fighting the payout
    a few times, we settled (ok there was no settling but I agreed to the new payout).\n\nBefore
    attempting this, I remember telling my friend about it. They said “ooof good luck.
    These are usually pretty hardened and no-one attempted them last year at p2o.”\n\nMy
    response: Watch me.\n\n![](https://i0.wp.com/p0pcycle.com/wp-content/uploads/2026/11/image-3.png?resize=1024%2C835&ssl=1)\n\n###
    Acquiring glasses because who’s paying €500 (not me)\n\nFirst step was acquiring
    the glasses. I am lucky that my brother-in-law had a pair he didn’t really use,
    so I could steal them for a few weeks.\n\n### First recon\n\nI installed the Meta
