  content: "## Hacking the meta ray-ban smartglasses\n\n[hacking](https://p0pcycle.com/category/hacking/)\n\n[educationalsabbatical](https://p0pcycle.com/tag/educationalsabbatical/),
    [meta](https://p0pcycle.com/tag/meta/), [smartglasses](https://p0pcycle.com/tag/smartglasses/)\n\nBack
    in July I wanted to check out the pwn2own targets for 2026. Since the rules hadn’t
    been released yet, I decided I would check last year’s targets in the hope that
    it would be similar.\n\nImagine my surprise when I managed to get arbitrary code
    execution on the glasses and they weren’t in the wearables category anymore :’).\n\nIt’s
    fine though because I still reported it to meta, and after fighting the payout
    a few times, we settled (ok there was no settling but I agreed to the new payout).\n\nBefore
    attempting this, I remember telling my friend about it. They said “ooof good luck.
    These are usually pretty hardened and no-one attempted them last year at p2o.”\n\nMy
    response: Watch me.\n\n![](https://i0.wp.com/p0pcycle.com/wp-content/uploads/2026/11/image-3.png?resize=1024%2C835&ssl=1)\n\n###
    Acquiring glasses because who’s paying €500 (not me)\n\nFirst step was acquiring
    the glasses. I am lucky that my brother-in-law had a pair he didn’t really use,
    so I could steal them for a few weeks.\n\n### First recon\n\nI installed the Meta
    AI app, which is the app to control the glasses (connecting them, synchronizing
    pictures, and so on).\n\nIn order to extract the firmware, I obviously wasn’t
    going to tear the glasses apart and start fiddling with probes n shit. So I went
    for extracting it using the OTA (over-the-air) update.\n\nWhen connecting the
    glasses for the first time, it immediately offered to update the firmware. So
    naturally, I was intrigued. Using JADX, I reversed the Meta AI app to see how
    the update is fetched.\n\n`OtaArtifactFetcher` prepares and sends the update request.
    The response is converted into an `OTAArtifactInfo` object containing metadata
    such as the device/build information.\n\n    arrayListA0y2.add(new OTAArtifactInfo([...],
    downloadUri, [...]));\n\nI then notice this assignment in `OTAArtifactInfo`():\n\n
    \   this.downloadUri = str3;\n\nI found that I could just hook into `OTAArtifactInfo`
    and print `str3` which contained the CDN update URL :))) and then I just printed
    it.\n\n    Java.perform(function () {\n    \n    \n    var OTAArtifactInfo = Java.use(\"com.facebook.wearable.common.ota.models.OTAArtifactInfo\");\n
    \   \n    \n    OTAArtifactInfo[\"$init\"].implementation = function (l, j, oTAArtifactType,
    ..., str3, ...) {\n    \n       this[\"$init\"](l, j, oTAArtifactType, ..., str3,
    ...);\n    \n        console.log(\"downloadUri:\");\n    \n        console.log(str3);\n
    \   \n    \n    };\n    \n    \n    });\n\n![](https://i0.wp.com/p0pcycle.com/wp-content/uploads/2026/11/image-6.png?resize=1024%2C153&ssl=1)\n\nThat
    URL contained a zip, so that looked like the right candidate. **HOWEVER** , this
    was around 156 MB and its payload depended on the device’s existing build. It
    was an incremental update… I wanted the full update.\n\n**Getting the full firmware
    update**\n\nDecompiling further code revealed a GraphQL input named `device_firmware_full_update_only`.
    The app normally populated it with false, so I hooked the generic method responsible
    for adding GraphQL fields and replaced the value with true only when the field
    name matched exactly. This allowed me to fetch the full firmware update URL.\n\nI
    was then able to retrieve the zip from the CDN. Unzipping it showed me that this
    was an Android update, including the **payload.bin**.\n\n![](https://i0.wp.com/p0pcycle.com/wp-content/uploads/2026/11/image-4.png?resize=1024%2C278&ssl=1)\n\nUsing
    [payload-dumper](https://github.com/ssut/payload-dumper-go) on payload.bin, I
    could dump the images and mount them into a filesystem.\n\n![](https://i0.wp.com/p0pcycle.com/wp-content/uploads/2026/11/image-5-edited-1024x430.png?resize=1024%2C430&ssl=1)\n\nFirmware
    was acquired but how do I get a shell on the glasses?\n\n### Device Access Toolkit\n\nThere
    is a developer mode on the Meta AI app that allows devs to write apps that can
    interact with the glasses. It is called DAT SDK (Device Access Toolkit).\n\nIn
    order to do that, you need to install the DAT APK on the glasses. The MetaAI app
    basically downloads it in real-time and fetches the DAT application to install
    it on the device. Do you see where I am going with this?\n\n![](https://i0.wp.com/p0pcycle.com/wp-content/uploads/2026/11/image-2.png?resize=1024%2C237&ssl=1)\n\n###
    Installing self-signed app on the glasses\n\nUp until and including firmware 126,
    the firmware did not verify that the DAT APK was signed by Meta. So it was theoretically
    possible to install any app on the glasses because there was no verification as
    to if it was a legit app or not.\n\nAn easy-not-so-easy swap was possible. I could,
    using frida, swap out the legit DAT application for a self-signed application
    of my own. That meant I could run any app on the glasses.\n\n    // hook DAT Installer\n
    \   \n    \n    field(this, \"$localFile\")\n    \n      .set(this, replacement);\n
    \   \n    \n    field(this, \"$appName\")\n    \n      .set(this, \"DAT Probe\");\n
    \   \n    \n    packageField.set(this, cachedPackage);\n    \n    \n    // Meta
    AI sends my apk\n    \n    return invokeSuspend.call(this, result);\n\nNow I have
    my own self-signed DAT apk running on the glasses! bosh!! \U0001F60E\n\n### How
    to run the DAT APK on the glasses\n\nThe DAT apk runs only when a DAT session
    is requested by the developer app to interact with the glasses.\n\nSo, in order
    to run the fake DAT apk, I installed a sample app from Meta called **Camera Access**
    , which would then create a DAT session with the app on the glasses.\n\n![](https://i0.wp.com/p0pcycle.com/wp-content/uploads/2026/11/image-1.png?resize=1024%2C454&ssl=1)\n\nHowever,
    I couldn’t really check that it was running properly. It was difficult to debug.\n\n###
    Beep is the new printf\n\nThere is no screen on this pair of sunglasses. No console,
    no logs, no “yoo your code is running”. So how could I make sure my code was even
    executing? The answer is by _listening_ to it.\n\nI used **android.media.ToneGenerator**
    in my DAT APK to signal which part of the code was executing:\n\n- 3 beeps: listener
    started, looking for a Wi-Fi Direct address\n- 5 beeps: found one (in wifi group
    192.168.49.x)\n- 4 beeps: TCP 31337 bound, we’re in business\n- 6 beeps: something
    went wrong\n\nSo using this sequence, I managed to debug a big issue that I hadn’t
    considered: the Camera Access app was failing because it was expecting the real
    DAT apk on the glasses. When it couldn’t start DWA,` startDwaReadinessProbe()`
    would report `START_ERROR_DWA_UNAVAILABLE`.\n\nAnd every time it failed, it closed
    my connection.\n\n**The fix**  \nI used frida to hook `startDwaReadinessProbe()`
    in order to disable the DWA timeout and keep the connection alive.\n\n    startDwaReadinessProbe.implementation
    =\n    \n    \n    function () {\n    \n    // No operation\n    \n    };\n\n###
    Bind shell\n\nWhen the Meta AI app wants to sync photos & videos from the glasses,
    it will create a WiFi Direct group on subnet 192.168.49.x. The glasses will connect
    to that group and they get an IP address.\n\nIn order to get the glasses to connect
    to the Wi-Fi Direct group, I used Frida to hook into the CameraAccess app and
    request the “high link lease” from the Meta AI app.\n\n    sub = device.createLinkLease(2,
    1, cb); \n    highLeaseSubscriptions.push(sub);\n\nMy implanted app bound a listener
    on TCP 31337 on that address, which dropped me into an interactive shell.\n\nSo
    from the phone I could just nc’d into it and sent commands, like `id`, to get
    shell-level execution in the app’s context.\n\n    ServerSocket listener = new
    ServerSocket(31337, 4, address))\n\n    nc <glasses-ip> 31337\n    \n    # id\n
    \   \n    uid=10097(u0_a97) gid=10097(u0_a97) groups=3003(inet) ...great power
    comes great opsec\n\n**great power comes great opsec**\n\n### Great power requires
    great opsec\n\nI had this uncontrollable power for about 5 days, and while I was
    searching for a privesc on the glasses, my shell access had disappeared."
