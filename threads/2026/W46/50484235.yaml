  text: '&gt; There is this memo video of S. P. Jones that famously says &quot;Haskell
    is Useless&quot;.<p>I think that is an unfair characterization of the video and
    the intent of Haskell&#x27;s co-creator, based on the rest of your comment. Simon
    Peyton Jones makes a graph with two dimensions, useful&#x2F;useless and safe&#x2F;unsafe.
    The question he gets at is: how can one distinguish between effectful and effect-free
    computations in a programming language? He proceeds to characterize most useful
    languages as unsafe, and Haskell as useless but safe. He then spends the majority
    of the video talking about how useful languages are becoming safer, and at the
    same time how Haskell must become useful.<p><a href="https:&#x2F;&#x2F;youtu.be&#x2F;iSmkqocn0oQ"
    rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;iSmkqocn0oQ</a>'
