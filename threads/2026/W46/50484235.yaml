  text: "&gt; Haskell is very terse and token efficient<p>I&#x27;m not certain this
    is the case. I find AI better at producing code in languages where there are fewer
    abstractions. It&#x27;s great at writing Go, because everything is there on the
    page in text&#x2F;tokens, and I find it less good at writing (good) Swift, because
    there are lots more abstractions for it to reason about, which are not written
    in text&#x2F;tokens on the page.<p>This is part of why I think LLMs producing
    dense and unpleasant to read text is linked to their ability, it&#x27;s no coincidence
    that people have this criticism of all of the independently developed frontier
    models.<p>We can train around this, the frontier models are getting better at
    it, but it&#x27;s a good reminder that LLMs are just text calculators at some
    level, and do much better when the concepts are in text rather than abstractions
    in our minds."
