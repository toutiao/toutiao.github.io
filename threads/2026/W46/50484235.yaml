  author: calebkaiser
  text: 'I do AI research and mostly work with Lean these days. I love Haskell, though
    I wouldn&#x27;t consider myself a particularly strong Haskell programmer (just
    never spent a ton of time working in it). I think you&#x27;re spiritually correct
    that there are lots of reasons to use extremely strict languages with AI, but
    the reality is a little messier than you&#x27;d expect.<p>Token efficiency is
    specifically the place where strict languages get a little trickier. With dynamic
    languages where the model has a ton of training data, like Python, the agents
    are really good at writing code that just works. You still have challenges there,
    but they&#x27;re just different than the challenges you hit with a language like
    Haskell&#x2F;Lean&#x2F;Agda etc. With Lean, for example, the amount of things
    the agent decides it needs to prove for a relatively trivial operation can lead
    to an absurd amount of code. And the way it decides to prove them can be borderline
    labyrinthian. It sort of plays perfectly towards current agent weaknesses, where
    agents can run off and reinvent a lot of machinery and build unnecessarily complex
    abstractions.<p>And those iterations have a cost. Even if the final artifact is
    more terse, the path to getting there can involve a huge amount of backtracking
    and rewriting and off-by-one syntactic corrections.<p>Ultimately, a lot of this
    comes down to developer experience. Getting useful error messages for the agent,
    having fast compile times so that the agent can iterate quickly, providing useful
    utilities for debugging, etc. There was a popular blog post specifically about
    Haskell that generally makes this point--the Haskell language is, in a vacuum,
    ideal in a lot of ways for AI, but the Haskell developer experience and ecosystem
    made it hard for this team to build with it via agents: <a href="https:&#x2F;&#x2F;avi.press&#x2F;posts&#x2F;2026-07-10-after-7-years-in-production-scarf-has-reluctantly-moved-away-from-haskell.html"
    rel="nofollow">https:&#x2F;&#x2F;avi.press&#x2F;posts&#x2F;2026-07-10-after-7-years-in-producti...</a><p>Note:
    I am not advocating against using these kinds of language. Obviously, I still
    work in Lean and a little in Agda and some related languages&#x2F;projects, so
    I think this direction is right. Probably biased in that I love them with or without
    LLMs, but I do think they&#x27;re also more ideal for AI development. There are
    still just challenges in getting agents productive in them, and most of the challenges
    are not about the type systems but the actual ergonomics and dev experience.'
