  author: chriswarbo
  text: 'I disagree. About a decade ago I made some tooling to extract and analyse
    code from Haskell packages. That&#x27;s easier said than done, given the use of
    pre-processors, TemplateHaskell, language extensions affecting the syntax&#x2F;grammar,
    using external files like `.cabal` to specify such pre-processors&#x2F;extensions,
    etc.<p>I went through several iterations, to get something that I could throw
    arbitrary packages at from Hackage, GitHub, etc. The result was a hacky mess containing
    a GHC plugin to dump Core code, a library to dynamically generate and evaluate
    strings of Nix to handle dependencies, shell scripts that piped `:t` commands
    through GHCi, and so on.<p>It was annoying, not because of the effort involved
    (I was doing weird, bespoke things; so it&#x27;s no surprise it needed weird,
    bespoke code to be written); but because all of the functionality I needed <i>already
    existed</i>, just buried deep inside GHC&#x2F;Cabal&#x2F;etc.<p>Admittedly the
    GHC API has gotten <i>much</i> better in recent years; but there&#x27;s no way
    the developers of &quot;one tool to rule them all&quot; can predict all of the
    different things that users will want it to do. Indeed, it&#x27;s probably wise
    for such tools to <i>avoid</i> supporting&#x2F;maintaining particularly weird&#x2F;niche
    uses!<p>Having a collection of tools instead, which &quot;do one thing and do
    it well&quot;, side-steps that problem entirely: users with weird use-cases are
    empowered to plug things together in a way that suits their needs, without needing
    the devs to add special features&#x2F;flags just for them (or maintain their own
    forks with such flags, etc.)'
