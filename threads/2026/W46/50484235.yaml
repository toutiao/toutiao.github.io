  text: I&#x27;m wondering the inverse, actually.  That LLMs can make regular haskell
    programming (e.g. typing in code, not english that LLMs convert to code) powerful
    enough to prefer.  Can we have LLMs do enough of the grunt work on building type
    machinery, dealing with compiler errors, looking up exact types and conversion
    systems, to make the APIs presented to us preferable?<p>So, I could write what
    I want in haskell, and it&#x27;s faster for me than to have an LLM do it.  The
    haskell would be high-level enough and precise enough to describe what I want
    the program to do with less iterations than I&#x27;d have with an LLM writing
    code, finding its own bugs, fixing them, then having me ask it what it did, tell
    it what to do differently, etc.<p>Direct control is very powerful.  LLMs take
    that away from us, in exchange for a great speedup.  But perhaps we can use LLMs
    to give it back to us by making our actual programming languages more powerful.
