    # Palantir hires a former Democratic senator as it faces scrutiny in new Congress

    By Luke Garrett

    Monday, November 9, 2026 • 5:00 AM EST

    Heard on [Morning Edition](/nx-s1-5961637/2026-11-09)

    Tech companies are expecting a wave of scrutiny from Democrats for the industry's ties with the Trump administration when they take over Congress in January. In anticipation, many are hiring former Democratic lawmakers and aides to make their case to the incoming House and Senate majorities.

    * * *
     Related Story: [NPR](/nx-s1-5372776)
    * * *

    Among the latest to make that move is [Palantir](/2025/05/01/nx-s1-5372776/palantir-tech-contracts-trump), which has hired former Sen. Jon Tester, a colorful Montana Democrat who's also an organic farmer.

    "My agreement with Palantir is advisory in nature, it is not lobbying," Tester, who lost reelection to the Senate in 2024, told NPR in an interview.

    The secretive American software and artificial intelligence company has drawn the ire of Democrats in Congress during President Trump's second term. Palantir — named by billionaire founder Peter Theil after the mythical "seeing stone" from J.R.R. Tolkien's _The Lord of the Rings_ — has been accused of abetting mass surveillance on Americans and immigrants.

    "Perception is reality in Washington, D.C. and in politics in general," said Tester. "But the fact is, I think Palantir has got a good story to tell, and they need to tell it. And hopefully folks will be receptive to it."

    Palantir has long denied claims it aids mass surveillance on the American public — saying it doesn't gather or manipulate data at all, but instead creates tools for government agencies and private companies to organize and optimize their own information. The company has [said](https://www.palantir.com/privacy-and-civil-liberties-engineering/) it is committed to "protecting privacy and upholding liberal democratic values."

    Earlier this year, while in the minority, Sen. Ron Wyden, D-Ore., along with 30 other Democratic lawmakers [demanded](https://goldman.house.gov/media/press-releases/goldman-wyden-velazquez-demand-answers-ice-use-palantir-developed-technologies) answers about Palantir's contracts with the Department of Homeland Security and whether its tools are part of efforts by the federal government to surveil Americans. Palantir denied the accusation and said it is "neither conducting nor enabling mass surveillance of American citizens," but Wyden wasn't fully satisfied with its response, according to his Senate office.

    "Senator Wyden has a number of questions about Palantir's work to facilitate the Trump-Vance abuse of government data that he intends to ask again as chairman of the Finance Committee," Wyden's staff wrote in a statement to NPR. "If Palantir is not responsive next year, compulsory processes will be on the table."

    It's not a coincidence that tech companies are turning to Democrats to help burnish their reputation, said Aya Ibrahim, a senior fellow at the AI Now Institute and a former State Department official.

    "I think at the end of the day, these companies have an inordinate amount of money and they will try and put it wherever they can in order to stave off any real accountability," Ibrahim said.

    * * *
     Related Story: [NPR](/nx-s1-5668284)
    * * *

    During Trump's second term, Palantir's CEO and co-founder [Alex Karp](/2026/01/06/nx-s1-5668284/nprs-book-of-the-day-michael-steinberger-the-philosopher-in-the-valley) — a self-described liberal — has been highly critical of Democrats on issues like immigration and AI.

    "I would say to my Democratic friends, also of which I still have, I hope many," Karp said in an interview [with Axios in 2025](https://www.youtube.com/watch?v=S0URfGzq_ro) specifically referencing his support for much more restrictive immigration policies. "You have to grow a spine because a lot of these people actually agree with me in private."

    During his 18 years in the Senate, Tester was [an outspoken critic](https://www.mtpr.org/montana-news/2015-05-21/montana-senators-speak-out-against-patriot-act) of the PATRIOT Act that passed shortly after the 9/11 attacks that expanded the Justice Department's surveillance powers. When asked whether his concerns over government surveillance remain and whether he has the same concerns with his new employer, Tester said Palantir is different and that the company doesn't build "big databases" or trade in private data.

    "I wanted to do away with the Patriot Act because it was about privacy," Tester said. "It was about making sure that I am not being watched by anybody, including Big Brother. And by the way, I've talked to many people within Palantir. They believe the same way I do. This is an organization that believes in privacy."

    * * *
     Related Story: [NPR](/nx-s1-5387514)
    * * *

    Last year, over a dozen [former Palantir employees](/2025/05/05/nx-s1-5387514/palantir-workers-letter-trump) criticized the company over its $30 million contract with U.S. Immigration and Customs Enforcement to create a tool that provides "near real-time visibility" into the movement of migrants. The former employees argued the company violated its own [code of conduct](https://investors.palantir.com/files/Palantir%20Code%20of%20Conduct.pdf) by working with the Trump administration on such products.

    * * *
     Related Story: [NPR](/nx-s1-5898504)
    * * *

    Valued at over $350 billion, Palantir currently holds $2 billion worth of federal contracts, according to government [records](https://www.usaspending.gov/recipient/1ea8a9a4-3726-3491-9040-66950bb67606-P/2026). The lion's share are with the Departments of Defense, Homeland Security and State — but the software firm also works with the Departments of Agriculture, Veterans Affairs and [Health and Human Services](/2026/07/17/nx-s1-5898504/ice-medicaid-palantir-data).

    Tester said he'll be focused on the government services side of Palantir's work.

    The former Montana senator called the midterm election results a blue "tidal wave" after two years of a Congress that gave him "great disappointment."

    "It is going to make a difference as far as the policies that are being advocated for," Tester said of the upcoming Congress. "I don't think you're going to see the kind of aggressive tactics that were taken forth by ICE moving forward."

    * * *

