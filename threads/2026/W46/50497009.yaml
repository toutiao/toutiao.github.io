  author: microtonal
  text: <i>Is it even possible for Europeans to consent to a class of actions?</i><p>Yes.
    I suggest you actually read the GDPR rather than drawing caricatures of it based
    on not actually knowing the law. It is very readable.<p><a href="https:&#x2F;&#x2F;www.privacy-regulation.eu&#x2F;en&#x2F;recital-32-GDPR.htm"
    rel="nofollow">https:&#x2F;&#x2F;www.privacy-regulation.eu&#x2F;en&#x2F;recital-32-GDPR.htm</a><p>Consent
    should be give per purpose. So, if you asked consent to access photos for performing
    an upload <i>when the user requested it</i>, you cannot use that to do an ML analysis
    of all the photos. But obviously, if the users gave consent to e.g. analyzing
    all photos for face recognition, you do not have to ask this for every photo,
    every scan, etc. It should just be easy to revoke the consent and remove any data
    stored.<p>(IANAL blah blah)<p>The GDPR is really a straightforward law. It only
    isn&#x27;t if you want to collect private data without telling the user about
    it. Or if you want to use dark patterns to make the user accept data collection
    without them giving free, informed consent.
  score: 0
