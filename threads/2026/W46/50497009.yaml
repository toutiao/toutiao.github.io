  text: It might also have to do with the self-image of developers.<p>The slice of
    software development that is purely &quot;finding technical solutions&quot; is
    shrinking.<p>You increasingly need to identify with the purpose of the software
    you are developing.<p>Spaces of detached &quot;purely technical&quot; software
    development are shrinking.<p>So you either say your job is to turn specs into
    software, then you need to aim at technically demanding tasks. Or you aim at being
    good at doing this at scale without being particularly involved with the purpose.<p>The
    pure &quot;developing an efficient implementation of this clearly defined requirement&quot;
    part of software engineering is retreating to spaces with really thanklessly complex
    or tight requirements, and even then, you need to be extraordinaly good.<p>The
    gray area between &quot;software where the tiniest bug is a legal liability&quot;
    and &quot;software that seems cool, fix bugs later&quot; is shrinking.
