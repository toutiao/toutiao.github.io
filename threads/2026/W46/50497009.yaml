  author: Doohickey-d
  text: This isn&#x27;t the case for me on Android anyway. You can turn off access
    for media &amp; photos in settings, and then yes, it nags you to enable it, but
    there&#x27;s still two ways to send photos:<p>* either share from an outside app,
    e.g. the gallery, choose &quot;share&quot;, choose &quot;whatsapp&quot;. This
    gives it access only to the photo you shared from the other app.<p>* and in Android&#x27;s
    settings you can give Whatsapp access to a subset of photos, then it works normally
    on only that subset. Then you can always add more from outside that set, by pressing
    the paperclip icon when you write the message, there you see the &quot;gallery
    option&quot;, then you see the limited subset of photos you gave access to, at
    the bottom right you have a folder picker icon which opens the system&#x27;s gallery
    picker view (google photos in my case), where you can see all photos, and it can
    then access that photo too.<p>* if you chose no access to media at all, but if
    whatsapp has camera access, click on the paperclip icon in the message box, then,
    &quot;camera&quot;, then the &quot;gallery&quot; icon, there you get a screen
    prompting for gallery access, but on the bottom right it has the same folder icon
    that gives access to the system photo picker, which again will only allow access
    to the photo you pick there.<p>The first two cases are pretty low-friction.
