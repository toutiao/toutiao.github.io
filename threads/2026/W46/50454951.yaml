  author: ambewas
  text: No problem, it&#x27;s easy to miss. But the underlying architecture here is
    each brush stroke is represented as data, like a vector in SVG, but rendered as
    a pixel brush. That means you can also do other things like smudges, paint blending,
    etc... Which you can&#x27;t do with SVG.<p>The other thing is that this is also
    a first class drawing app with pen support. So you don&#x27;t have to use an agent,
    and you can still profit from the editability. Or start a drawing yourself and
    have an agent come in later..
  score: 0
  posted_at: '2026-11-11T18:42:37Z'
- id: '50456946'
  parent_id: '50456773'
  author: ambewas
  text: No browser version unfortunately. It&#x27;s a pretty heavy thing to do to
    render thousands of brush strokes and keep them all editable. So it is written
    in rust, with highly optimized memory management. I don&#x27;t think a browser
    app could deliver the necessary performance.<p>I am still waiting on apple for
    signing a build, but once I can I will release binaries as well. There&#x27;s
    an email list you can sign up on the site, if you&#x27;re interested to be notified.
    Once the binary is out, an MCP will be as well. Right now it&#x27;s a cli and
    a UI app you can build yourself.<p>But if you want to try a headless version,
    just point your favorite LLM to it and ask it to build it in a sandbox
