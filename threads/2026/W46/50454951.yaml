  author: ambewas
  text: They have more features, yes, but the architecture of klad is different from
    the ground up.<p>I explicitly designed the klad file format to be git compatible,
    which matters for agents that can easily track changes, but it is also a lightweight
    format that describes every brush stroke in a drawing rather than recording pixels.<p>The
    latter means every single one of the strokes an agent or you make, remains editable
    even thousands in. You can move every one, change the colour, transform it like
    a vector... And all the pixel rendering replays for the chunks it was in, in pretty
    much real time.<p>This then enables much deeper control for any changes you or
    an llm want to make, and I think this fundamentally makes klad positioned much
    better for agents drawing than any existing adobe clone.<p>I could be wrong about
    this, of course. Time will tell. For now I have received positive reports from
    people especially about the editability and consistency that comes with this format
