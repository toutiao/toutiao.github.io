  author: vunderba
  text: 'Nice job~~<p>So I&#x27;ve done a little bit of testing. When I loaded up
    the editor, I expected it to communicate with the installed binaries for my large
    language models, or possibly use a BYOK (bring your own key) approach. But once
    I understood that it&#x27;s driven from the command line and you see the changes
    happen in the editor that gets spun up, I had no problems.<p>I&#x27;ve been experimenting
    a fair amount with LLMs driving procedural graphics myself, although my experiments
    have been mostly limited to relatively low-resolution stuff, such as EGA adventure
    game graphics.<p>So I decided to put Klad through a relatively hard test: I took
    a reference picture of an illustrated squirrel and asked it to recreate it, then
    set up the rigging for a basic walk cycle. This was using Fable 5.2 high.<p>Then
    I did the same thing, but with a more traditional approach, using standard generative
    models to manually create a walk cycle. This was all done relatively quickly,
    so bear that in mind.<p>Here are the results. I still think these are early days,
    and LLM-driven graphics are only going to improve.<p>And there are obvious advantages
    to a procedural system with rigging: Much easier to maintain consistency, palette
    control, and the ability to make precise alterations without having to deal with
    any kind of conventional in-painting nonsense.<p><a href="https:&#x2F;&#x2F;imgpb.com&#x2F;vJFpP"
    rel="nofollow">https:&#x2F;&#x2F;imgpb.com&#x2F;vJFpP</a>'
  score: 0
