  author: ambewas
  text: 'Hey thanks so much for putting Klad and Fable through this test!<p>I think
    the results are really interesting. I think it&#x27;s very obvious the classic
    image-to-video approach yields much more natural results at this time and with
    the current models.<p>I think I&#x27;m going to do some testing of my own, and
    see where things can be improved. I do think that the bottleneck at this time,
    is the model you use itself.<p>But it&#x27;s like you say, it&#x27;s very early
    days with an LLM expressing its ability to draw&#x2F;paint. In my own testing,
    it kind of feels like it did with coding 2 years ago: yeah sure the model is pretty
    Okay at building a function, but I wouldn&#x27;t have let it build a whole feature
    back then.<p>Nowadays, I&#x27;m practically only reading code and thinking about
    how to refine my instructions for the next build.<p>I&#x27;m sort of betting that
    this evolution could go the same way for graphics (and possibly audio&#x2F;midi
    as well). And I wanted to have a tool ready, to see how it evolves.'
