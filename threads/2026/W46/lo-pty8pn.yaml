    I’m [Ploum](https://fr.wikipedia.org/wiki/Ploum), a writer and an engineer. I like to explore how technology impacts society. You can subscribe [by email](https://listes.ploum.net/mailman3/lists/en.listes.ploum.net/) or [by rss](/atom_en.xml). I value privacy and never share your adress.

