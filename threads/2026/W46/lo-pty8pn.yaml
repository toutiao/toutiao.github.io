    No inline links is perhaps one of the defining feature of gemtext.
    That’s exactly part of the game: without inline text, you need to write very differently. Each link must have a clear purpose. It has a real cost, it must be introduced and really relevant to not interrupt the reading flow.
    Inline text is, in fact, lazyness from the writer: I put links everywhere and I let the reader confronted with the dilemma of contiune reading or clicking without really knowing what the link is and if it is really relevant.
    People wants Gemini but with inline links, with bold/italics and with at least some style customization.  Then stay on the Web.  There’s a reason why Gemini was, on purpose, written as non-extendable : just to avoid that.
    But, no, you will not be able to just translate your website into a gemini capsule. That would defeat the whole thing.
    If you really want to try Gemini, you must first write Gemtext. You must adapt to the constraints. (which is something every writer in history had to do with his own media).  Try it. Write a couple of blogposts with the Gemtext constraint (no inline link, no bold/italic, no inline picture). And see by yourself.
    It mades me a better writer, for sure.  It might not work for you. But you need to really try it by yourself.
