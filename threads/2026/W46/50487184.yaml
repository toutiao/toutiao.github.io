    \n[Wen Shao](/author/wen-shao/)\nWen Shao\nAI Fellow\n\nNovember 13, 2026, 12:05
    PM ET\n\n ![Workers checking humanoid robots that are arranged in a line.](https://fortune.com/img-assets/wp-content/uploads/2026/11/GettyImages-2304572308-e1794587995495.jpg?format=webp&w=1440&quality=75)\n\nOpenAI
    has disbanded its stand-alone robotics team and reassigned the researchers working
    there to other parts of the company. The company said the move was an effort to
    accelerate progress on robotics, not abandon it. The company wants its more general-purpose
    AI models to be able to control robots, including humanoid robots such as these
    seen here in a CTIC Heavy Industries production line.Huang Zhengwei—VCG via Getty
    Images\n\nAdd Fortune on Google for similar content.\n\nOpenAI has disbanded its
    stand-alone robotics team, moving its researchers onto other teams.  \n  \nThe
    company confirmed the reorganization when asked about it by _Fortune._ A company
    spokesperson said that robotics remains a core part of OpenAI’s long-term vision
    and portrayed the reorganization as a sign of the company’s commitment to robotics,
    rather than a retreat from it.  \n  \nOpenAI said it has reassigned its robotics
    research team to the company’s main research team, reporting to Chief Research
    Officer Mark Chen, while the applied robotics and hardware teams have been reassigned
    to the company’s larger Applied organization, which reports to OpenAI President
    Greg Brockman.  \n  \nThe change came recently enough that OpenAI had already
    registered a booth at CoRL, a top academic robotics conference in Austin, this
    week. Though the conference app and floor plan marked OpenAI’s spot, when _Fortune_
    visited booth #208, it sat empty with OpenAI’s logo nowhere to be seen.&nbsp;\n\nRecommended
    Video\n* * *\n\nOpenAI had a robotics team in its early days but wound it down
    in 2020, with cofounder Wojciech Zaremba later citing limited robot data and a
    more efficient path toward artificial general intelligence (AGI)—the human-like
    AI that has been OpenAI’s goal since its founding—through other methods. In particular,
    OpenAI became increasingly devoted to training ultra-large language models on
    vast datasets of human-written text. This is the approach that eventually yielded
    the company’s breakthrough product ChatGPT in late 2022.  \n  \nOpenAI rebuilt
    a stand alone robotics team in 2024, announcing a partnership with the startup
    Figure to develop AI models for humanoid robots. That partnership ended in February
    2025, when Figure said it would develop its own robot AI. OpenAI has said it is
    currently developing its own humanoid robot, with CEO Sam Altman targeting a first
    public demonstration in 2027.   \n  \nThe company spokesperson said that despite
    the reorganization, OpenAI remains committed to bringing general-purpose robots
    into the world.  \n  \nThe reorganization reflects a bet that is gaining traction
    across the AI industry: that general-purpose models built for language, code,
    and vision can also be used for “embodied AI”—where AI models control devices
    that can act in the physical world, such as robots, driverless cars, or drones.
    This would obviate the need to have separate robotics teams building specialized
    AI models just to be the digital “brains” for robots.  \n  \nResearchers have
    seen surprising performance when connecting GPT-6 Astra to robots, directly using
    the general-purpose AI model to perform some robotic tasks.  \n  \nGuanya Shi,
    an assistant professor at Carnegie Mellon University’s Robotics Institute who
    had previously heard about OpenAI’s reorganization, told _Fortune_ that he would
    interpret the move as a signal that OpenAI sees robotics as “no longer a special
    problem.” Instead, he said, they likely see robotics as a challenge that can be
    addressed as a downstream application of general intelligence—similar to the way
    the same underlying frontier AI models now power specialized coding tools, or
    tools for legal or financial work.  \n  \nOpenAI seemed to confirm this view in
    its response to _Fortune._ It said that at the start of the year, the company’s
    researchers assumed the best way to make progress on robotics was to build on
    its work on AI models such as Sora, a video generation model that, in order to
    create realistic videos, had to have some implicit understanding of how the physical
    world works.  \n  \nBut since then, the company spokesperson said, the company’s
    general-purpose frontier models, including GPT-6 Astra, have shown that can be
    directly applied to robotics. This discovery is what motivated OpenAI to disband
    the stand alone robotics team and move the affiliated researchers onto teams working
    on more general AI models.  \n  \nThe reorganization also comes at a time when
    OpenAI is under pressure to rein in its costs and show that it is more focused
    on a few, core products. Last year, Altman told the company that it needed to
    abandon “side quests,” and the company has jettisoned some efforts—including Sora—in
    order to reallocate computing resources to more core and potentially-profitable
    endeavors. The company is under pressure to stanch its heavy operating losses—which
    reportedly totaled $10.9 billion in the most recent quarter—as it seeks to close
    a new funding round and prepares for a possible IPO in early 2027.\n\nThis line
    of thinking—that general AI models can be applied directly to controlling robots
    without the need to create specialized models with “spatial intelligence”—would
    seem to challenge the assumptions underpinning many of today’s robotics startups,
    which have raised billions on the premise that robots need brains of their own.&nbsp;\n\nBut
    Russ Tedrake, an MIT professor and cofounder and CEO of Walden Robotics, said
    robotics companies still have an advantage the AI labs don’t: Their robots are
    already gaining work experience in real places, such as on factory floors. Such
    “deployment” experience—and the data these robots gather—helps robots adapt to
    specific workplaces and tasks. Better foundational models make that site-specific
    data more valuable be"
