  author: Tadpole9181
  text: 'Saved the NVIDIA paper below for reading material, but if I had to guess
    just as a SWE how I would do it: use hierarchal thinking.<p>At the top sits a
    SOTA model capable of seeing snapshots of what&#x27;s happening and directing
    intent. Then smaller, more reactive models translate the intent down into actions,
    before coming to a purely deterministic layer that handles inverse kinematics.<p>Sorta
    like how I control my body. I usually don&#x27;t think about my fingers going
    to every key as I type - I know what I want to type, then that signal goes to
    some autonomous &quot;using a keyboard&quot; system, which invokes my muscle memory,
    which actually moves my muscles.<p>And if I get burned while I do something, my
    actual thinking brain doesn&#x27;t really have time to process it before I&#x27;m
    already moving away; because those smaller systems have much faster - but more
    rudimentary - feedback loops.'
