  author: jacquesm
  text: General models <i>can</i> run robots. They are very bad at it. It is much
    more efficient to have a stack of models with &#x27;dumber&#x27; but faster models
    taking care of lower level functions and higher level ones that are much slower
    taking care of high level planning. Consciousness isn&#x27;t super fast, but it
    is very smart. Your &#x27;lizard brain&#x27; (to use an overstretched metaphor)
    and reflexive system are relatively stupid but far faster and condense a whole
    raft of inputs to something your consciousness can deal with. For robots it isn&#x27;t
    all that different. Sensors and actuators require millisecond level responses,
    that&#x27;s something you&#x27;re not going to get out of an LLM on the other
    side of a communications link.
