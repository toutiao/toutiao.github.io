  author: jvanderbot
  text: 'Let me dispel one myth: The bitter lesson can be true, and you can still
    want a bespoke, customized solution.<p><i>If</i> it is true that <i>eventually</i>
    a general approach that scales with compute&#x2F;data will supersede a bespoke
    expert solution, it is <i>not necessarily</i> true that <i>today&#x27;s</i> expert
    solution should be thrown away at the first sign of a data-driven model.<p>It
    says nothing about what you should use today to build things, it says everything
    about how you should do research that <i>lasts</i>.<p>If you&#x27;re building
    for billions of users <i>in 10 years</i>, sure go with whatever you think is the
    bitterest.<p>But if you&#x27;re building for <i>right now</i>, you probably mashup
    whatever works best. That might still be a PID loop, EKF, and Homographies sometimes.
    But when you hit the frontier of what &quot;works&quot;, then you have to reach
    for new things anyway.<p>Chesterton&#x27;s baby&#x2F;bathwater<p>WRT humanoids
    - I am making no statements.'
