  author: somenameforme
  text: Definitely. The reason I ask is because right now if you go through this thread
    there seems to be about a 100% correlation between people who are down on the
    game and those who are down on everything LLM. If this was &#x27;published&#x27;
    3 years ago there&#x27;d be nothing but praise, and it&#x27;s not because the
    beat-em-up genre radically changed in those 3 years.<p>Games are subject to taste,
    but I think there are also objective elements. And this game just objectively
    feels and plays great, which is a remarkable achievement for an LLM, because it&#x27;s
    a genre where it&#x27;s easy to get things that look right but don&#x27;t feel
    right. For instance Sacred Citadel is a game that was made by a studio with over
    a decade of experience, published by a publisher with decades of experience, and
    it&#x27;s worse than this game - <i>much</i> worse. It got the look right, but
    it felt&#x2F;played terrible.<p>The fact that a single guy can casually one-shot
    games dramatically better than what passed for a [relatively] big studio title
    a decade ago is testament to where we&#x27;re at. And I think that&#x27;s freaking
    some people out. I suppose that freak out is reasonable from one perspective,
    but from another it&#x27;s just shaking your fist at the clouds. Even if all LLM
    advances stopped today, what we&#x27;ve already unleashed is already way more
    than enough to change the game forever, and things are never going back to how
    they were. And, of course, we&#x27;re not stopping today.
