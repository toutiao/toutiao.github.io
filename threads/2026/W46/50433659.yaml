    <i>fun</i> for it to get them to a thing they wanted. Versus months of drudgery
    and study as the price of entry (and an end result that would probably be super
    janky compared to the consumer products on offer to them).<p>I learned some about
    carpentry by reading, and by watching videos. I learned <i>much more</i>, much
    faster, by picking up bits of wood and tools and just doing. I did little dumb
    stuff that was trash but that was <i>mine</i>, and that was satisfying enough
    that I did more, and before I knew it I’d backed my way into picking up some scraps
    of proper technique.<p>And now so many more people with a vague itch can “just
