article:
  url: https://notesbylex.com/fable-5-2-one-shotted-my-nephews-dream-game
  title: Fable 5.2 One-Shotted My Nephew's Dream Game - NotesByLex.com
  fetch_status: success
  content: "# Fable 5.2 One-Shotted My Nephew's Dream Game\n\nLLMs can make complete
    multi-level games that are fun.\n\nLex Toumbourou ·\n\n[GameProjects](/tag/gameprojects)[CodingAgents](/tag/codingagents)\n\n![](/_media/aidens-revenge/title.jpg)\n\n**TL;DR**
    - Fable 5.2 one-shotted my nephew's dream game from a bunch of drawings, and it's
    a lot of fun. You can try it [here](https://aidens-revenge.pages.dev/).\n\n* *
    *\n\nI've always loved beat 'em ups, and they seem to have come back into vogue
    in the last few years, with remakes of old classics and some new gems. When my
    nephews visit, I use it as an excuse to try them out.\n\nLately, we've been playing
    Shredder's Revenge on my old PS4, which took me straight back to the arcade machine
    at my local pool.\n\nOne day, my younger nephew, Aiden, came to me with a proposal.
    Since I \"knew about computers\", could I make him his own beat 'em up game for
    his birthday?\n\nHe had already drawn up the game design docs. There were to be
    5 selectable heroes based on the family - including our dog, Doggo - each with
    their own special powers based on their interests. He had 12 bosses drawn up and
    a loose outline of a story. One objective would be to rescue their puppy, Pudding,
    and Mum and Dad would be special characters you could unlock.\n\n| Heroes | The
    Battle Wagon | The villains, numbered 1st to 12th |\n| --- | --- | --- |\n| ![Aiden's
    drawing of the heroes](../_media/aidens-revenge/scan-heroes.jpg) | ![Aiden's drawing
    of the Battle Wagon](../_media/aidens-revenge/scan-battle-wagon.jpg) | ![Aiden's
    drawing of the twelve villains](../_media/aidens-revenge/scan-villains.jpg) |\n\nAt
    the time - around January 2026 - building an indie game from scratch was a pretty
    unreasonable ask for a birthday present, and I did warn him to temper his expectations.
    Still, I thought it would be a fun exercise to test the agentic tools at my disposal.\n\nI
    shipped a first version for his birthday in June, mostly with Claude Code, using
    Opus 4.8 and Fable 5, and a side-scrolling template courtesy of [AIOriented.dev](https://www.aioriented.dev/).
    It worked, but it wasn't worth playing for more than a couple of minutes.\n\n[![The
    June version: a single hero fighting two skeletons on a plain green field](../_media/aidens-revenge/first-version-fight.jpg)](../_media/aidens-revenge/first-version-fight.jpg)\n_The
    June version._\n\nAiden was appreciative, but it clearly wasn't the game he'd
    imagined.\n\nHe gave me notes on what was missing, which I half-agreed to take
    on, but I was also kinda hoping he'd forget - I really didn't have time to make
    a whole game.\n\nUnfortunately, he did not forget. Every time I saw him, he asked
    about the game.\n\n## Enter: Fable 5.2\n\nI was lucky enough to get an early look
    at [Claude Fable 5.2](/claude-fable-5-2), and was told to try it on \"my most
    ambitious use case\". Finishing this game immediately sprang to mind.\n\nThe kids
    were coming over the next day, so I wanted to see how far it could progress in
    one shot.\n\nBefore bed, I let it rip with this prompt:\n\n> I want you to help
    me finish this game. Make it as fun as possible. It should feel like a modern-day
    Ninja Turtles arcade game. An action-packed beat 'em up.\n> \n> Make the graphics
    amazing. You can use OpenAI's ChatGPT Images 2.5 for images. And ElevenLabs for
    sound effects. OpenAI key is /path/to/openai-key. ElevenLabs key is /path/to/elevenlabs-key\n>
    \n> You can redo any characters that have already been created. The enemies and
    heroes can be found in scans in this directory: generation/scans\n> \n> I have
    created some of the villains, but you should add the rest and turn them into spritesheets.\n>
    \n> Use any assets you find online. Create new sprites for the henchmen. Create
    backgrounds and power-ups in the levels. I'd like to plug in a controller so up
    to 4 people can play.\n> \n> Use your own judgment - the main goal is to make
    it fun like TMNT and other classic beat 'em ups like Streets of Rage.\n> \n> Make
    it one of the best games you can possibly make. You are a truly world-class game
    developer. Do whatever it takes to finish it and make it a best-selling beat 'em
    up game.\n> \n> Commit as you go. Don't worry about destroying what exists. Start
    fresh where it makes sense.\n\n_Note: The prompt uses a technique from this [Latent
    Space Engineering](https://blog.fsck.com/2026/01/30/Latent-Space-Engineering/)
    article about gassing up the agent to put it in a good \"frame of mind\". Not
    sure how relevant it is in the Fable 5.2 age, but hey - it didn't hurt._\n\n*
    * *\n\nWhen I woke up, the game was waiting for me. And I couldn't believe my
    eyes!\n\nFable had generated a game that was fun. Like, a lot of fun. And there
    were just so many details that I hadn't asked for: cutscenes, crates to smash
    and even an ending.\n\nIt threw away most of my code and rewrote the game. It
    generated roughly 175 images and 140 audio clips.\n\nReviewing the reasoning traces,
    I noted that it wrote a bot to play the game, ran it through all twelve stages
    in a headless browser, and checked the screenshots for problems.\n\n![Shellshock,
    the eighth boss](../_media/aidens-revenge/boss-shellshock.jpg)\n\n## Play testing\n\nBefore
    they came over, I charged up my four PS4 controllers and connected them all to
    my MacBook (which, it turns out, you can do). They worked perfectly.\n\n![The
    macOS Bluetooth menu with four DualShock 4 controllers connected at once](../_media/aidens-revenge/four-controllers-bluetooth.png)\n\nWhen
    they arrived, Aiden was absolutely delighted. \"It's exactly as I imagined,\"
    he squealed.\n\n[![Two kids sitting on the floor playing the game on the TV](../_media/aidens-revenge/playtest-afternoon.jpg)](../_media/aidens-revenge/playtest-afternoon.jpg)\n_The
    afternoon shift_\n\n[![Playing the Boardwalk Beach boss fight in the evening,
    with Hulk Owen on screen](../_media/aidens-revenge/playtest-hulk-owen.jpg)](../_media/aidens-revenge/playtest-hulk-owen.jpg)\n_Hulk
    Owen takes on Shellshock_\n\n[![The whole family playing together in the lounge
    room](../_media/aidens-revenge/playtest-family.jpg)](../_media/aidens-revenge/playtest-family.jpg)\n_Everyone
    in_\n\nA few rounds of playtesting, however, highlighted some deficiencies in
    the game.\n\nFirst, my older nephew, Owen, felt his character lacked a Hulk Smash
    move. Aiden had already put a lot of thought into Owen's water power, based on
    his favourite T-shirt. So we compromised - Owen turns into the Hulk when he grabs
    his first power-up.\n\nI asked Claude to make the change, with a special case
    for this character, and Owen was very happy with the results.\n\n![Hulk Owen slams
    the boardwalk with Hulk Smash, sending a shockwave through the henchmen](../_media/aidens-revenge/hulk-owen.jpg)\n\nAiden
    also insisted that his special weapon be the most OP - the game is named after
    him after all. Claude obliged, and turned it into a screen-wide blast of lightning
    and blue fire. \"Oh, that's perfect!\" Aiden exclaimed.\n\nUnlocking Pudding,
    Mum and Dad by beating bosses turned out to be the best part of the game, and
    it gave each mission a sense of urgency. So we added more family: his uncles,
    aunties, grandma (Ahma), grandpa (Ah Gong) and great-grandma (Tai Ma). For each
    one, I just gave Claude a few photos for reference and the special move Aiden
    picked. When he couldn't decide, he had us call them up and ask what they wanted.\n\nEach
    time we added someone, Claude redrew the cutscene art and updated the story.\n\n![The
    gang driving off in the Battle Wagon with the whole family in a cage on the roof](../_media/aidens-revenge/kidnapped-family.jpg)\n\n|
    Grandpa's Card Storm | Grandma's Super Bloom | Uncle Kev's Cheat Code |\n| ---
    | --- | --- |\n| ![Playing cards flying across the Golden Vault](../_media/aidens-revenge/super-card-storm.jpg)
    | ![Sunflowers bursting out of the ground under the enemies](../_media/aidens-revenge/super-super-bloom.jpg)
    | ![Uncle Kev holds his controller overhead as the CHEAT CODE! banner flashes
    across the Honeycomb Hive](../_media/aidens-revenge/super-cheat-code.jpg) |\n\nOn
    top of the human family, they deci"
