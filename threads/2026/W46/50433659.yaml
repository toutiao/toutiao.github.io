  author: somenameforme
  text: Then it&#x27;s likely that beat-em-up isn&#x27;t the genre for you, because
    this is a very solid entry in the genre. If you&#x27;ve ever played a bad beat-em-up
    you&#x27;d be able to see the strengths more clearly. A huge thing is that this
    game feels like it has weight in the attacks, and that&#x27;s really hard to do.
    That&#x27;s a subtle mixture of responsiveness, sound effects, animation (not
    just movement but also text&#x2F;visual fx&#x2F;flashes&#x2F;etc), and more. And
    the hit boxes seem to be pretty much perfect, which is another aspect many games
    miss on. Then there&#x27;s lots of nice subtle touches - invincibility frames,
    juggling, bosses with phases&#x2F;knockdowns&#x2F;cueing, and much more.<p>Nothing
    revolutionary, but a bunch of different parts all working together well that are
    generally implemented at a very good to excellent level. That&#x27;s way better
    than most can say. Of course the walking animation, like the one guy mentioned
    is hilariously bad, but fixing that&#x27;s also just a prompt away. Oddly enough
    I didn&#x27;t even notice it when playing.
