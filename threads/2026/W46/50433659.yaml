  author: andai
  text: Interesting. I hadn&#x27;t heard of that twilight zone episode.<p>My mum liked
    to tell me, when she was little, she imagined having a magic wand, that she could
    wave and get anything she wanted. Almost immediately she realized that life would
    become pointless.<p>I&#x27;m not really sure if that&#x27;s true. For starters,
    having too much scarcity and adversity can also make life pointless. You just
    can&#x27;t do anything you want. Maybe there&#x27;s a sweet spot somewhere in
    the middle.<p>For me the most satisfying part of projects has always been overcoming
    difficulty. Although I had a slightly unpleasant version of that lately, where
    the difficulty turned out to be a hundred times worse than I anticipated, took
    years instead of weeks, and by the time I finished overcoming it, AI could make
    a better project than mine in a matter of minutes...<p>There&#x27;s a story I
    always come back to in my mind, there was a story of a man in the mountains in
    India, who spent 20 years carving a passage through the mountain — by hand — so
    that his village would have easier access to the city and the hospital.<p>It&#x27;s
    a very heroic story of course, and you have to respect the effort and dedication...
    but surely it would have been better for all the people who needed the hospital,
    if he had just been given a bit of TNT instead.
