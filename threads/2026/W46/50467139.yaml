article:
  url: https://www.bbc.co.uk/news/live/c6zjry11v8w1t
  title: Nvidia CEO Jensen Huang quits in wake of affair with suspected Chinese spy,
    as firm's stocks plunge - BBC News
  fetch_status: success
  content: "## Summary\n\n- Jensen Huang has resigned as CEO of tech giant Nvidia,
    the company's board says, with chief financial officer Colette Kress appointed
    interim boss\n\n- The company's shares have recovered some ground after initially[plummeting
    more than 13% when US markets opened](https://www.bbc.co.uk/news/live/c6zjry11v8w1t?post=asset%3Acabae22c-72d8-472a-9edb-a2287bdd2301#post)shortly
    after news of Huang's resignation \n\n- It comes after the New York Times reported
    that he had a second affair with an executive at his own company\n\n- On Sunday,
    [Huang admitted an affair with a woman](https://www.bbc.co.uk/news/live/c6zjry11v8w1t?post=asset%3A0d3685e6-b858-41b5-b6d5-dec675906abc#post),
    who was reportedly from another company and suspected to be a Chinese spy\n\n-
    _Huang steered Nvidia to enormous success, and in an extraordinary and strangely
    old-fashioned tale, he was ultimately undone by his love life,_ [_our technology
    and AI editor writes_](https://www.bbc.co.uk/news/live/c6zjry11v8w1t?post=asset%3A7eacbb01-49b8-4612-bd91-acc2622539b5#post)\n\n-
    [Meanwhile, Beijing has warned the US](https://www.bbc.co.uk/news/live/c6zjry11v8w1t?post=asset%3A57f5f651-02d7-4272-9f87-c25be3ce9e58#post)
    not to use the spying allegations as a pretext to once again restrict tech sales
    to China \n\n- Nvidia is already investigating the affair Huang has admitted,
    as is the FBI. [_What does Nvidia's code of conduct say?_](https://www.bbc.co.uk/news/live/c6zjry11v8w1t?post=asset%3A3868bbc3-63b4-4dfb-b2d1-0c5fae6a0b3f#post)
    \n\n_Media caption, Watch: What we know so far about Nvidia CEO resignation_\n\n##
    Live Reporting\n\nEdited by Tinshui Yeung and Ben Hatton, with technology and
    AI editor Zoe Kleinman and business reporter Rachel Clun\n\n1. \n\n**Dearbail
    Jordan**  \nSenior business and economics reporter\n\nTucked inside the announcement
    of Jensen Huang’s departure and his temporary replacement, is the news that Nvidia
    has appointed its first-ever chair.\n\nThis is a big deal. Part of a company chair’s
    responsibility is to have oversight of the chief executive. Nvidia has gone without
    one for more than 30 years.\n\nHuang often lauded the company’s “flat” management
    structure. “If you want to empower people, you want to make the organisation as
    flat as possible so that information travels quickly,” he once said.\n\nHuang
    had dozens of people reporting to him, which may well have sped up the flow of
    information and decision-making but also resulted in an extraordinary concentration
    of power in one man’s hands.\n\nNow, Nvidia’s new boss, whoever that ends up being
    in the long term, will have someone overseeing them - in this case, Harvey Jones,
    a tech industry veteran who was the former boss of Synopsys, a chip design software
    maker.\n\nShare page\n\n[About sharing](https://www.bbc.co.uk/usingthebbc/terms/can-i-share-things-from-the-bbc)\n\n2.
    \n\n**Anuk Weerawardana**  \nBusiness reporter\n\nJensen Huang's resignation as
    CEO didn't just affect Nvidia's share price today but also that of companies that
    previously benefitted from its hype.\n\nNeocloud companies like CoreWeave and
    Nebius - essentially companies that rent out data centres to AI developers - dropped
    roughly 5% and 16% in share value respectively after the US market opened today.\n\nBoth
    companies had previously received large investments from Nvidia and now rent out
    its hardware to manage AI workloads.\n\n\"Nvidia became such a crucial cog in
    the machine that it has become an investor, financier and ultimately strategic
    backer of a lot of companies involved in the supply chain,\" says Ben Barringer,
    head of technology research at investment platform Quilter Cheviot.\n\nNvidia
    is one of the \"key mechanisms\" that keep the investment cycle moving so any
    bump in the road could mean ripples across the wider AI ecosystem.\n\nYet, Barringer
    tells me there is still a high probability that the chipmaker will continue to
    support companies that ultimately buy and use its chips in the long-term.\n\nShare
    page\n\n[About sharing](https://www.bbc.co.uk/usingthebbc/terms/can-i-share-things-from-the-bbc)\n\n3.
    \n\n![](https://ichef.bbci.co.uk/ace/standard/128/cpsprodpb//vivo/live/images/2026/10/28/cce13363-b8e2-41ee-9c24-e770b8e95f46.jpg.webp)
    **Rachel Clun**  \nBusiness reporter, in New York\n\nJensen Huang’s resignation
    and the revelations that led up to it have followed a turbulent period for artificial
    intelligence and tech firms in general, as investors have in recent weeks reacted
    to the US midterm elections and massive spending on AI infrastructure.\n\nStephanie
    Balaouras, vie president and group research director at market research firm Forrester’s,
    says Huang’s resignation is \"a stress test for the AI boom\".\n\n\"If Nvidia
    stabilises quickly under new leadership, the AI infrastructure boom will have
    demonstrated resilience,\" she says, adding that if Nvidia’s position remains
    under pressure it would suggest the AI ecosystem is more fragile.\n\nEldar Tuvey,
    is the chief executive of AI procurement platform Vertice. He tells the BBC most
    of its clients spend money with Nvidia, and one customer has been spending billions.\n\nWhile
    he says the turbulence will affect the company and its clients, the bigger picture
    was that firms would keep spending with Nvidia, Tuvey adds: \"I think it will
    necessarily impact all of us, but I have full confidence in Nvidia to be able
    to move forward from here.\"\n\nShare page\n\n[About sharing](https://www.bbc.co.uk/usingthebbc/terms/can-i-share-things-from-the-bbc)\n\n4.
    \n\n![Stephen Witt, a man, pictured wearing a grey shirt](https://ichef.bbci.co.uk/ace/standard/640/cpsprodpb/vivo/live/images/2026/11/12/20007265-67ef-4309-b210-492f09bc836c.jpg.webp)\n\nJensen
    Huang's biographer, Stephen Witt, has described news of his resignation as \"one
    of the most incredible downfalls of a corporate executive in recent history\".\n\nWitt,
    who wrote The Thinking Machine, a biography of Huang, tells BBC Newsnight it's
    \"almost impossible\" to imagine the company without him, as he's been \"the only
    chief executive this company has ever known\".\n\n\"This is the age of AI,\" he
    says, \"but this is a human story. This is a very classic human story of hubris,
    masculine hubris and overconfidence. Some things never change.\"\n\nWitt has interviewed
    the 63-year-old six times and describes him as a \"demanding\" boss, who \"really
    pushes his people to the limit\".\n\nWhile he says Huang is \"very brilliant\"
    and a \"world-class computer scientist\", there's also \"a level of arrogance\"
    and \"a level of self-deception as well\".\n\nShare page\n\n[About sharing](https://www.bbc.co.uk/usingthebbc/terms/can-i-share-things-from-the-bbc)\n\n5.
    \n\n![](https://ichef.bbci.co.uk/ace/standard/128/cpsprodpb//vivo/live/images/2026/10/28/cce13363-b8e2-41ee-9c24-e770b8e95f46.jpg.webp)
    **Rachel Clun**  \nBusiness reporter, in New York\n\nNvidia shares have recovered
    some ground as investors digest the news of Jensen Huang’s resignation.\n\nShares
    initially opened down more than 13% after plummeting in after-hours trading, but
    by mid-morning in the US they were down about 6%.\n\nThe tech-heavy Nasdaq Composite
    Index had also recovered slightly, trading down about 0.6%, and the S&P 500 and
    Dow Jones Industrial Average were also trading in negative territory.\n\nShare
    page\n\n[About sharing](https://www.bbc.co.uk/usingthebbc/terms/can-i-share-things-from-the-bbc)\n\n6.
    \n\n![A file photo of Tim Cook](https://ichef.bbci.co.uk/ace/standard/640/cpsprodpb/vivo/live/images/2026/11/12/e937dddc-4f36-4e1a-8618-31a901b89753.jpg.webp)Image
    source, AFP via Getty Images\n\nUS President Donald Trump has just weighed in
    on the debate about Jensen Huang's successor on Truth Social.\n\nHe writes: \"NOW
    THAT Nvidia CEO JENSEN HUANG, who has done a fantastic job, has resigned, there
    is only one man to take his place - TIM COOK of Apple. A Legend replaces a Legend!\"\n\nCook
    served as Apple's chief executive until August this year, and currently serves
    as the company's executive chair of the board.\n\nAs we've been reporting, finance
    chief Colette Kress has been named Nvidia's interim chie"
