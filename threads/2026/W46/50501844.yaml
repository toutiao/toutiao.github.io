    L3Harris has been modernizing the communications infrastructure supporting the National Airspace System in close coordination with the FAA.&nbsp;With safety and reliability as our highest priorities, L3Harris, together with its telco partners and the FAA, has completed more than 70% of the planned airspace communications conversion from legacy copper wires to a fiber optic system. We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation’s air travel. L3Harris takes the nationwide ground stop and its impact on travelers, airlines and air traffic operations seriously.

