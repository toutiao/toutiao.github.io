  text: DeepSeek’s claim to fame is massively shrinking the per-user memory footprint,
    enabling many more concurrent users in your fixed hardware footprint.   Having
    more concurrent users leads to much higher overall throughput on that same hardware.  That’s
    why DS is so cheap to host.<p>See table 2 in this article to see the tradeoffs
    of overall throughput vs per user latency as an example.<p>Deepseek would let
    you host higher concurrency than GLM.<p>Presumably that compression doesn’t come
    for free on the quality side.  (This is totally speculative on my part.  I haven’t
