  author: AnotherGoodName
  text: For anyone actually considering this $200k+ setup for home or even small business
    use the power usage and noise is extreme. 1.6kw each with the fans to match. 600tokens&#x2F;s
    at concurrency 16 is not what you need for home use or even sub 100 employee business
    use either. Really reconsider please (do you seriously need people to tell you
    this?). I get tech wages are high and you can probably afford this but seriously.<p>Right
    now there’s no great solution to the frontier or near frontier models for home
    use. But there are cards and options coming in 2027. For now just accept that
    you run qwen 37b or similar.<p>What’s coming in 2027 that changes this and why
    i implore you to wait? Well for these models you need massive amounts of memory
    and memory bandwidth. The solution above gets this by using expensive HBM spread
    over enough cards with enough compute to give a ridiculous tok&#x2F;s. For home
    use you’d actually be happier with a single GPU that had lots of cheap memory
    to hold the weights and just enough memory bandwidth to feed that single gpu and
    no more. This in theory gets you close to 50tok&#x2F;s on GLM 5.3 if it existed.<p>In
    2027 there’s expected to be multiple HBF (high bandwidth flash) options incoming.
    High bandwidth flash has ~10x the latency of HBM but that actually doesn’t matter
    much for inference. Inference is latency tolerant and local inference time to
    first token beats over the internet time to first token no matter what you do
    in any case. The bandwidth and amount of memory is the blocker.<p>In 2027 there’s
    expected to be many multi terabyte HBF options coming. NAND&#x2F;NOR flash is
    massively cheaper than RAM per byte (multiple states per logical unit so it’s
    denser) and it’s not that hard to wire it in a more parallel way to increase its
    bandwidth. Nvidia has the Kioxia solutions and Sandisk, Samsung, Tenstorrent,
    Mythic have also previewed HBF with GPUs to do local inference on the open source
    frontier models at reasonably high tok&#x2F;s. Even if HBF is sold for 10x the
    price per terabyte of todays flash that’s still an extremely small fraction of
    the price of any other option right now.<p>Make do with the subscriptions for
    now. Don’t go crazy trying to run the frontier at home today. We should have something
    much better solutions are coming.
