    AI-Generated Summary\n\n- [GLM-5.3 NVFP4](https://huggingface.co/nvidia/GLM-5.3-NVFP4),
    a quantized mixture-of-experts model with 753 billion parameters and 40 billion
    activated per token, requires about 464 GB of GPU memory, exceeding the 252 GB
    HBM3e on a single GB300 GPU.\n- Two NVIDIA DGX Stations connected over ConnectX-8
    RDMA serve the model through one OpenAI-compatible endpoint using tensor parallelism
    (TP=2), with each GPU holding and computing roughly half the weights.\n- vLLM
    launches a distributed service across both Stations, enabling multi-token prediction,
    FP8 KV-cache storage, and prefix caching to maximize throughput under concurrent
    load.\n- AIPerf benchmarks on the SPEED-Bench Coding dataset show overall output
    throughput peaking at 607.8 tokens per second at concurrency 16, then falling
    to 385.0 tokens per second at concurrency 32 with mean request latency of 453.5
    seconds.\n\n### Next Steps\n\n- Follow the [Connect Two DGX Stations playbook](https://build.nvidia.com/station/connect-two-stations)
    to link and validate the hardware before deployment.\n- Review the [NVIDIA Local
    AI recipe repository](https://nvidia.github.io/local-ai-inference-recipes/hardware/dgx-station-2gpu/index.html)
    for the latest recommended configurations.\n- Connect an application using the
    [vLLM serving documentation](https://docs.vllm.ai/en/v0.30.0/serving/online_serving/)
    and rerun AIPerf with custom prompts to find the optimal concurrency for the workload.\n\nPowered
    by NVIDIA Nemotron. AI-generated content may summarize information incompletely.
    Verify important information.&nbsp;[Learn more](https://www.nvidia.com/en-us/agreements/trustworthy-ai/terms/)\n\nRunning
    a frontier-scale model locally means keeping all its weights in GPU memory; the
    largest models no longer fit on one machine. Two NVIDIA DGX Stations connected
    over ConnectX-8 RDMA serve one model through a single endpoint, with tensor parallelism
    splitting the model weights and computation across both GPUs.&nbsp;\n\nThe NVIDIA
    [GLM-5.3 NVFP4](https://huggingface.co/nvidia/GLM-5.3-NVFP4) model, a quantized
    version of [Z.ai](http://z.ai)’s mixture-of-experts (MoE) model, has 753 billion
    parameters, with 40 billion activated per token. Sparse activation reduces computation,
    but all model weights still need to remain available because each token can be
    routed to different experts. At about 464 GB, the checkpoint exceeds the 252 GB
    of HBM3e on a single GB300 GPU. This tutorial uses two DGX Stations to keep the
    weights in GPU memory, with CPU weight offload disabled.\n\nBefore starting, connect
    the two Stations with the [Connect Two DGX Stations playbook](https://build.nvidia.com/station/connect-two-stations).\n\nThis
    post shows how to serve GLM-5.3 locally across two NVIDIA DGX Stations with vLLM,
    send a request, and measure behavior under concurrent load. Tensor parallelism
    (TP=2) splits the model’s tensors across the two GB300 GPUs. Both Stations compute
    every request, and Station A returns the answer through one OpenAI-compatible
    API. By the end, you’ll have a working endpoint and a baseline for how it behaves
    under load.\n\n![Two stations serve one model: each GPU holds and computes part
    of the model over the selected RDMA connection. Their memories remain distinct.](data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%201999%201125%22%3E%3C/svg%3E)\n_Figure
    1. Two Stations serve one model: each GPU holds and computes part of the model
    over the selected RDMA connection. Their memories remain distinct_\n\n## Prerequisites\n\n-
    Two GB300 DGX Stations running Linux, connected and validated with the [Connect
    Two DGX Stations playbook](https://build.nvidia.com/station/connect-two-stations),
    including its GPU-memory RDMA test on both rails.\n- SSH and sudo access on both
    Stations with the same Linux username. Docker and the NVIDIA Container Toolkit
    come preinstalled with the [DGX Station software stack](https://docs.nvidia.com/dgx/dgx-station-development-guide/porting/software-requirements.html).
    Allow outbound access to the container registry, Hugging Face, and package repositories.\n-
    At least 464 GB of free disk space on each Station for its copy of the checkpoint,
    plus room for the vLLM container image and temporary files.\n- Acceptance of the
    NVIDIA Open Model Agreement and the original GLM-5.3 license terms, listed on
    the [model card](https://huggingface.co/nvidia/GLM-5.3-NVFP4#licenseterms-of-use).
    SPEED-Bench is governed by the [NVIDIA Evaluation Dataset License Agreement](https://huggingface.co/datasets/nvidia/SPEED-Bench/blob/main/License.pdf).\n-
    A Hugging Face account and read access token, with access to the gated [cais/hle](https://huggingface.co/datasets/cais/hle)
    dataset: sign in, open its page, and select **Agree and access repository**. Step
    5 downloads SPEED-Bench prompts from this dataset.\n\nThe companion video follows
    the same workflow.\n\n_Video 1. Walkthrough of preparation, inference, benchmarking,
    and shutdown_\n\n## Step 1. Prepare the two Stations\n\nThis tutorial uses a separate
    computer, such as your laptop, to manage both Stations. Start by opening an SSH
    session to each Station from that computer. Alternatively, work from a local terminal
    on each Station. Run every command in this step on both Stations unless it starts
    with “On A.”\n\nThe two Stations run the same container and checkpoint in different
    roles: Station A (rank 0) hosts the API, and Station B (rank 1) runs only a worker,
    with no API server.\n\nFirst, check Docker access and collect the network values
    you’ll use later:\n\n    docker version\n    ibdev2netdev\n    ip -br addr\n\n|
    **Note:** If the `docker version` output has no `Server` section, the client cannot
    reach the Docker daemon. If the error is `permission denied`, follow the [Docker
    post-installation procedure](https://docs.docker.com/engine/install/linux-postinstall/):
    add your user to the `docker` group with `sudo usermod -aG docker \"$USER\"`,
    run `exit`, then reconnect and rerun `docker version`. The `docker` group grants
    root-level privileges. |\n| --- |\n\nThe `ibdev2netdev` output lists the two direct
    rails, `cx8r0` and `cx8r1`. Pick one for serving traffic, for example `cx8r1`,
    and note two things for it on each Station:\n\n- **Its RDMA device** , on the
    `ibdev2netdev` line that ends with the rail’s name. In `mlx5_1 port 1 ==> cx8r1
    (Up)`, the device is `mlx5_1`.\n- **Its IPv4 address** , on the `ip -br add"
