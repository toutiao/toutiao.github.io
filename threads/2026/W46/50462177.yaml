  author: tredre3
  text: 'There is a way nginx&#x2F;fpm to host multiple domain where each domain has
    its own user and group and they maintain 0750 permissions so they can&#x27;t see
    eachother but nginx and php can both access them:<p>- php-fpm is easy, you can
    make the pool run as the domain&#x27;s user&#x2F;group directly<p>- nginx: you
    must add nginx&#x27;s user (www-data) to the domain personal&#x27;s group<p>The
    downside to this approach is that it&#x27;s harder to reason about for someone
    unfamiliar with it and it&#x27;s easy to misconfigure file permissions. There
    is also a limited number of extra groups a user can be part of before it becomes
    an issue (plus one fpm pool per user takes memory).<p>That being said the best
    massively-shared hosting system I&#x27;ve ever used was apache mpm_prefork with
    mod_php and mod_ruid2. It used as much(little) memory as a single user setup,
    it scaled to 10k users if you wanted, and file permissions were all naturally
    handled.<p>The way mod_ruid2 worked was to use linux capabilities to change the
    effective user&#x2F;group of the apache process before serving the request, so
    it would run as the tenant&#x27;s group and user, then switch back to nobody&#x2F;nobody.
    It had very little overhead compared to things like mod_suphp and, more importantly,
    it also worked on static files and .htaccess!<p>The module has been abandoned
    and was never that popular so I always wondered if it was found to be exploitable
    or something... Thanks to Linux Capabilities an exploiter couldn&#x27;t gain root,
    but as seen from the recent exploit apache&#x27;s mod_php doesn&#x27;t do a full
    cleanup so maybe there was leakage when the process was reused (but then that
    is solvable by limiting the requested to 1)'
  score: 0
  posted_at: '2026-11-12T16:56:38Z'
