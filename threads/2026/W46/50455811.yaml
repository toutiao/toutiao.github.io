  author: primitiveai
  text: I like the separation between deterministic sign-in and the agent-visible
    workflow.<p>One thing I&#x27;d be interested in is the lifecycle after sign-in.
    If the browser profile holds a live session, what is the revocation boundary?<p>Can
    a user revoke one agent&#x27;s access without killing their own browser session?
    Are TOTP seeds and derived session material independently protected?<p>Avoiding
    model access to the password is a good start, but the live session is often the
    more powerful credential.
  score: 0
  posted_at: '2026-11-25T09:49:39Z'
- id: '50641638'
  parent_id: '50455811'
  author: mdutt2399
  text: On the government sites you mention, it&#x27;s worth checking for an official
    API before wrapping the front end. A lot of the US federal portals people end
    up automating, SAM.gov, USAspending, SEC EDGAR, Grants.gov, have free JSON APIs
    that are far more stable than their UIs, and the UIs do move, FPDS&#x27;s search
    closed in February and beta.SAM got folded in before that. State and local procurement
    portals and anything behind an agency login are where you actually need the wrapper.
    How do you handle sites that explicitly refuse automated access, like the Senate&#x27;s
    financial disclosure site, which started returning 403s to scripts recently?
  score: 0
