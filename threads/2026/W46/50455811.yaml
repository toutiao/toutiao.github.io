  author: kingefman1
  text: 'One caveat on &quot;deterministic tools reduce the risk of prompt injections&quot;:
    returning only structured fields does close the arbitrary-DOM channel, but any
    field that holds text written by someone else (a review, a message subject, a
    claim note, a payee name, a product description) is still an injection path. The
    string lands in the agent&#x27;s context the same way page text would.<p>A few
    things that help there: give those fields a schema with a max length and, where
    you can, a pattern or enum, so a &quot;name&quot; can&#x27;t carry a paragraph.
    Say in the tool description that the value is third-party data, not instructions.
    And keep the tools that read separate from the tools that write, or put the irreversible
    ones (payments, claim submissions) behind a human approval whatever the model
    says, since that still holds if an injection does get through.<p>Curious whether
    any of that happens at the schema level on your side, or whether it&#x27;s left
    to the calling agent.'
  score: 0
