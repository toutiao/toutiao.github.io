  author: JerradBe
  text: this failure mode is worse when the tool has a side effect in the real world.
    we&#x27;ve had agents retry a call or a text because the tool returned 200 while
    the action was still in flight, or had already happened. what happens is that
    you burn tokens on the web and you annoy the same person twice on a phone. so
    what the tool needs is an explicit state (queued &#x2F; in-flight &#x2F; done
    &#x2F; failed), an idempotency key the agent has to pass back, and a way for later
    events to arrive without a second invoke. if you just retry based on the HTTP
    status, it probably won&#x27;t catch it.
