  author: augment_me
  text: Crazy to not see a word about benchmarking&#x2F;evaluation of the kernels.<p>IMO
    at this time when all performant GPU kernels are generated&#x2F;hill-climbed,
    its the largest source of error we see.<p>Should be kernel run with a hot or cold
    cache in practice? Should your kernel be bitwise equivalent to a ref? What error
    margins should your kernel have to ref? How many times are you running the kernel
    to avoid thermal noise? Are you running on separate GPUs to avoid overfitting
    the current hardware? Can you cudagraph-compiling your kernel to remove launch
    overhead? Are you A&#x2F;B B&#x2F;A interleaving your kernel&#x2F;reference runs
    to avoid running thermal bias?
