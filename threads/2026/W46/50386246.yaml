  author: augment_me
  text: 'It&#x27;s a bit of a footgun to do benchmarking with AI models. If you worked
    with really performant GPU kernels (SOTA, better-than cuBLAS&#x2F;FlashInfer level),
    you know that the LLMs reward hack:<p>Primer: <a href="https:&#x2F;&#x2F;ornith.ai&#x2F;defense_kernel_hack.html"
    rel="nofollow">https:&#x2F;&#x2F;ornith.ai&#x2F;defense_kernel_hack.html</a><p>In-depth(follow
    links etc): <a href="https:&#x2F;&#x2F;x.com&#x2F;myainotez&#x2F;article&#x2F;2037258418843771349"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;myainotez&#x2F;article&#x2F;2037258418843771349</a><p>Parts
    relevant: <a href="https:&#x2F;&#x2F;www.coreauto.com&#x2F;blog&#x2F;when-ai-starts-writing-systems-code"
    rel="nofollow">https:&#x2F;&#x2F;www.coreauto.com&#x2F;blog&#x2F;when-ai-starts-writing-systems...</a><p>----<p>When
    you do this with benchmarking, the same thing happens but on a much deeper, shittier,
    harder to understand level. It will set up the caches to benefit your kernels,
    it will set up the timing to benefit your kernels, it will set up the evaluation
    order to benefit your kernels. I&#x27;ve seen half-cache flushes, which only benefit
    large shapes.<p>I wouldn&#x27;t be surprised if you pointed a language model on
    your benchmarking with the comment above, and it found something that is reward-hacking
    your task.'
