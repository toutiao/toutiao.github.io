  text: 'Seems like the kernel portion of that competition is closed. I can probably
    compare whatever the serving winner is against JamInfer when it&#x27;s out (seems
    like they start that track on the 12th). Main issue being any submission code
    goes straight to SGLang which I don&#x27;t think my advisor or university will
    appreciate spending resources on.<p>The top of the article shows the e2e times
    on some math RL tasks, with fp8 weights&#x2F;activations&#x2F;KV, comparing against
    SGLang on two models. They use the same concurrent batch size, quantization scheme,
    and the final lengths were about the same. I think Qwen3 models are probably very
    mature compared to Muse by now.<p>30B-A3B MoE<p>Jam    - 67,241<p>SGLang - 44,696<p>+50.4%<p>8B
    Dense<p>Jam    - 58,821<p>SGLang - 41,759<p>+40.9%<p>Math RL is pure decode, so
    kernels are the most major factor here.<p>Also-- I feel as if this has gone a
    bit off-track. The point of my reply was to comment on agents being actually decent
    at benchmark development and usage if you tell them to be, not as a comment on
    how great the harness is (I even state in the article: &quot;it&#x27;s a fairly
    simple and minimal setup that seems to work well.&quot;).<p>I don&#x27;t think
    it&#x27;s a footgun at all, and generally feel like (at least OpenAI&#x27;s models)
    tend to do well in stating when there is some caveat to watch out for (they&#x27;ll
    probably say when they&#x27;re about to hack for the user to catch). The benchmarking
    suite they&#x27;ve made is actually very similar to what&#x27;s in the open kernel
    challenge. Given that this was initially made many months ago, I&#x27;d think
    Opus and GPT did a pretty good job if someone is betting $100k+ (in prize money)
    on a similar suite being decent.'
