  author: nomi_uw
  text: |-
    Yes, they can reward hack. However, making sure the model knows what your requirements are (e.g., &quot;do not quantize, meet this set of specifications&quot;) can mitigate that, and simply looking at the code briefly (or having the LLM describe it back to you) can mitigate it quite easily. Often, such issues are a result of insufficient specificity by the user. If you tell it just to make the model faster, it&#x27;ll do it and not assume additional requirements.<p>Same thing applies to benchmarking, a few guardrails goes a long way. As long as you aren&#x27;t completely vague (&quot;set up benchmarks&quot;, vs. &quot;write tests over a variety of common shapes, be careful to control for environmental variables&quot;) the models do quite well. I&#x27;ve checked over the code it&#x27;s written and it&#x27;s all fairly reasonable. I do mention cache eviction in the article, this generally wasn&#x27;t an issue and the model did this automatically on the first pass (back in Opus 4.6 days). I think you might not be giving them enough credit here.<p>I&#x27;m not completely familiar with the writers of this article, but I&#x27;ve never had an LLM try to hack this, even sometimes telling me a target was impossible without quantization or approximation:<p>&quot;Code based analysis already tells a detailed story, but there is an overlooked parameter: &quot;boundaries of the hardware&quot;. &quot; - the myainotez post<p>This project has spanned several models since Opus 4.5. I think even then such details were trivially known by them, thought they required much more handholding than they do now. I&#x27;m honestly not sure how the article writers ran into the hacks they did.<p>edit: I should mention this article is based on my experience developing an RL and inference framework dealing with trainer-inference mismatch. I don&#x27;t know if hill-climbing a kernel in an isolated set of benchmarks would perform differently. At the end of the article, I mention what my hill-climber looks like:
    <a href="https:&#x2F;&#x2F;www.nabo.dev&#x2F;blogs&#x2F;kernel-primer#section-in-the-age-of-agents" rel="nofollow">https:&#x2F;&#x2F;www.nabo.dev&#x2F;blogs&#x2F;kernel-primer#section-in-the-age-...</a>
    It has to go through numerics and correctness checks, then isolated tests for common shapes (where launch parameters are determined by an autotuner, not the agent), followed by end-to-end throughput tests.
