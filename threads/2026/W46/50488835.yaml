  author: pmooney
  text: "&gt; Now no one even cares how something is implemented ...<p>&gt; The &quot;good&quot;
    ones today are looking exclusively at external properties rather than internal
    ones.<p>To provide a little additional context here: This effectively was an external
    property of the system (just to the userspace VMM).  One of the significant challenges
    for those implementing a feature live migration is how you&#x27;ll deal with multiple
    version of the software (older and newer) interacting in the future.  A primary
    use case for live migration is moving workloads around to permit software updates,
    making that multiple version issue even &quot;worse&quot;.<p>Abstracting the implementation
    details of those in-kernel emulated devices was helpful in two ways.  Firstly,
    it reduced (hopefully) the chances that a later change to the internal implementation
    would be visible in the exported&#x2F;imported state.  Secondly, that the act
    itself of doing that state abstraction required a much more intentional and thorough
    examination of the emulation logic itself, resulting in a cleaner and simpler
    artifact.<p>So while it may seem like it was driven by a desire to take pride
    in the craft (undeniably _a_ factor), the main motivation was avoiding a versioning
    mess in the future.<p>&gt; Thank you for the comment.<p>My pleasure!"
