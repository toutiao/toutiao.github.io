  author: gouggoug
  text: 'This article is about a weekend project and not a serious product, so what
    I&#x27;m saying below is not criticizing the author&#x27;s approach — I&#x27;m
    making a point about something tangential.<p>The post touches on my biggest pet
    peeves about how many software engineers currently use AI at work: they ask it
    to &quot;write out a problems.md file describing the problem we want to solve&quot;
    then lob the output over the fence for the rest of the engineering org to review,
    often times without even disclosing they used AI to generate it (it&#x27;s, of
    course, obvious).<p>AI can not do the reasoning for us; thinking that because
    it is great at writing code that works, the same applies to documents whose primary
    purpose is to demonstrate critical thinking, explore trade-offs, and reason through
    a problem is absurd.<p>In fact (or IMO?), this &quot;problems.md&quot; document
    is entirely unnecessary. In many cases, simply describing the issue and providing
    the relevant context is enough for AI to come up with a working solution.<p>AI
    can not do critical thinking (yet), so don&#x27;t ask it to (and stop sending
    your fellow software engineers AI-slop RFCs).'
