    the spotify version of the Metal Gear Rising&quot; soundtrack sound so bad&quot;
    - to great results.<p>Compared with the CD rips on archive.org, the noise floor
    was 27dB (!!!) higher, and, the whole thing was 10dB more compressed.<p>I cannot
    vouch for these specific numbers, but subtracting the good version from the bad
    one gave me a horrible delta wav file with lots to listen to, so there was definitely
    a _lot_ of difference.<p>It got the job done is what I want to say.
