  author: db48x
  text: It’s because it doesn’t have enough overtones, or a notable attack. You might
    have noticed that some trucks these days make a weird noise when they back up
    instead of a beep. They’re using white noise because it’s easier to locate; it
    has many overtones that allow your brain to pick the sound out of the background
    more easily, and thus more easily correlate the signals from both ears. You get
    a much more accurate location just from hearing that sound than you ever could
    with a pure tone.
