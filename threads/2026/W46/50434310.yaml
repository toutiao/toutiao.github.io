  author: akoboldfrying
  text: 'Good point about the moving effort required. But if moving an object takes
    constant time, then it&#x27;s O(n) overall -- since &lt;incorrect argument deleted&gt;.<p>EDIT:
    My earlier analysis was wrong (it assumed you never move the beeping item after
    the initial halving), but the conclusion was right for a different reason: Each
    time you move items, you move half as many as you did last time. You initially
    move n&#x2F;2 items, and the geometric series n&#x2F;2 + n&#x2F;4 + n&#x2F;8 +
    ... + 1 sums to n-1. So O(n) moves are done, and this dominates the log n term
    for the number of steps.'
  score: 0
