  author: HPsquared
  text: 'Consider a pure sine wave, it&#x27;s harder (in theory anyway) to match the
    signals from the left and right ears, and identify the time delay between the
    two signals: each cycle of the wave is just like the others, so there&#x27;s no
    distinct signature to match and say &quot;the sound reached the left ear 0.5 ms
    before it reached the right ear&quot;. This is especially the case for higher
    frequencies where there can be something like aliasing.<p>Animal species sometimes
    use this in different sounds they make. An alarm call has that kind of &quot;smooth
    tone&quot; characteristic, so a predator can&#x27;t locate the source of the sound
    but it still works to raise the alarm. Meanwhile more social sounds are more &quot;chirpy&quot;
    and sharp, so they can locate each other.'
  score: 0
