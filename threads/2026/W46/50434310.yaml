  author: Confiks
  text: "&gt; In fact (or IMO?), this &quot;problems.md&quot; document is entirely
    unnecessary. In many cases, simply describing the issue and providing the relevant
    context is enough for AI to come up with a working solution.<p>I don&#x27;t mean
    to respond to your &#x27;professional work&#x27; scenario, but I find it quite
    useful to first let it draft a PLAN.md, even when &quot;in many cases&quot; it
    would one-shot some implementation without it. I mostly prompt it with a problem
    statement, &quot;write a PLAN.md&quot;, &quot;ask me any questions in prose and
    numbered&quot;, &quot;don&#x27;t start implementation until my say-so&quot;. The
    back-and-forth questions are often pretty significant to the final result, and
    I can (skim) review the plan and make other adjustments.<p>When you ask most models
    to write that plan, you see an extended thinking trace similar to implementation
    itself, but now all the decisions are made up front. If you one-shot it an implementation,
    those decisions are sprinkled all over the implementation phase, while half of
    it has been written and some architectural choices have already been locked in.
    I then frequently adjust that plan to end up (IMO) with a much better implementation,
    or much better suited to my situation, with less shortcuts."
