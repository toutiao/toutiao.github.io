  author: NekkoDroid
  text: 'To prevent evil maid attacks you&#x27;d need to use verification of the entire
    boot chain, so bootloader, kernel, and system packages would be e.g. signed and
    each verifying each subsequent step before executing it.<p>Encrypting instead
    of verifying would still allow for evil maid attacks since they can just replace
    it with something that ask for a key and never really does anything with it other
    than sending it to a remote server.<p>To reply to your &quot;And where is the
    trust store database stored by default?&quot;: The root store would be the motherboards
    secure boot databases for the signed bootloader (or kernel if doing direct boot).
    the following steps can verify however they like. E.g. something like ParticleOS[0]
    uses the roothash of the usr-verity partition, which was embedded into the signed
    UKI.<p>[0]: <a href="https:&#x2F;&#x2F;github.com&#x2F;systemd&#x2F;particleos"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;systemd&#x2F;particleos</a>'
