  text: Forgot about Tails. No hate for Tails, per se. Tails and Whonix serve somewhat
    different niches and threat models, I suppose. Qubes&#x2F;Whonix is more general
    purpose and designed for defense in depth against exploitation through virtualization,
    isolation, zero trust, whereas Tails is designed for deniability by being amnesic
    and booted off USB, and is much more light-weight, obviously. I guess it depends
    what you&#x27;re doing on Tor. If you&#x27;re handling a bunch of untrusted files
    Tails gets kinda sketchy because if the files contain malware, you&#x27;re one
    priv esc&#x2F;kernel exploit away from being deanonymised because afaik Tails
    has no virtualization. Qubes is much nicer for that type of task, but it&#x27;s
    also unwieldy and not particularly good at being amnesic, though it can be made
    amnesic with a ton of manual configuration I&#x27;m sure.
