  text: I never mix unencrypted with encrypted devices for a very specific reason;
    I do not trust that every package will 100% of the time behave correctly and only
    write on the encrypted device. I have seen so many times where packages will write
    caches or temporary files in the same location where the binary&#x2F;libraries
    are located (as in &#x2F;usr&#x2F;...), and while it is against policy, policy
    violations do occur. I would only trust such system if all the unencrypted were
    read-only, but managing that takes more effort than simply encrypting everything.
