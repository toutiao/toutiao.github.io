    me a website&quot; work? Because not only does it spit out the HTML, CSS and JS,
    it also starts trying to test it by starting a local server and so on. Agency
    is what has made LLMs so useful - the ability to actually execute the bash commands
    they spit out and react to them. Without tool-use and chain-of-thinking - effectively
    the two features which allow them to express agency through their reactions -
    they are truly little more than fancy autocomplete.<p>&gt; These models CAN direct
    themselves - in the same way a circular saw can.<p>This is a hopelessly shallow
    comparison.  You&#x27;re really comparing an entity that reacts to its own output
    with what is effectively a blade stuck onto a motor. A circular saw has exactly
    one job and that is to cut whatever comes in reach of its blade. An LLM given
    the same inputs and access as a human developer can do their entire job end-to-end.
    Perhaps the long-term quality won&#x27;t be as good - but the LLM can definitely
    do it."
