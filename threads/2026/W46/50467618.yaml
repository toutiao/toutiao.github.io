  text: 'A few things:<p>- Splitting your community is a concern. The classic example
    is multiplayer DLC: if not everyone can access it then it will risk low adoption.<p>-
    Presales and first week sales are hugely important to financing projects. Not
    many games achieve a long tail.<p>- Developers are expensive. Paying a team of
    artists and designers and programmers demands that they generate enough revenue
    to make it worthwhile.<p>AI opens this door because:<p>- Its capacity to be constrained
    fits neatly into mod frameworks.<p>- It&#x27;s incredibly cheap to operate, compared
    to the human team.<p>- Users are comfortable with its SaaS model and so won&#x27;t
    be deterred by a subscription model.'
