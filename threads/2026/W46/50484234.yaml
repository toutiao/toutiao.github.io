    # Semicircle packing

    A couple of weeks ago, I entered the [GPU World short story competition.](https://www.gpuworld.org/) I'll post my entry here once the winners are announced. The [guidelines](https://www.gpuworld.org/official-rules) imply that I needn't wait until then, but _usually_ writing contests don't allow self-publishing before the end of the competition, so I'd rather not take the risk.

    The cash prizes are **crazily high** for a writing competition: a $40,000 first-place prize; and 7 runner-up prizes of $4,000 each. GPU World's prize pool is 13x to 100x bigger than the other short story competitions I've entered this year. If you submit the minimum 1,000 words required and go on to win first place, each word nets you 40 US dollars. It is (well, _was_) worth a punt.

    Alright, enough talk about numbers.

    It wasn't until I was halfway through writing my GPU World story that I started to scrutinise _where_ this prize money was coming from. At the bottom of [the main contest page,](https://www.gpuworld.org/) two supporters are listed: _Paradigm_ and _Guardian Angel Intelligence Inc._ The former, [Paradigm](https://paradigm.xyz) is a venture capital firm, which the competition guidelines lists as the provider of the cash prizes. The latter, Guardian Angel Intelligence, piqued my interest with its name alone. I was even more surprised when I clicked on its link and discovered it is [an article by Gwern Branwen,](https://gwern.net/guardian-angel) who also serves as one of the judges for the competition. There is some [discussion here on Hacker News](https://news.ycombinator.com/item?id=49174900) about Guardian Angel Intelligence and Gwern's announcement of it, but it is mostly speculative because (at time of writing) there is not much public information about the company itself.

    * * *
    \*\*\*
    * * *

    Back to Paradigm. I simultaneously felt two things when I clicked on Paradigm's website:

    1. Awe. Their website is ridiculously cool. To me, it's reminiscent of [Ryoji Ikdea.](https://www.ryojiikeda.com/)
    2. Intrigue. Even though I've run a [venture-backed startup before,](/work/kenobi) I don't recall hearing about their fund until now.

    I spent a few minutes leafing through the flat-futurist interactive visualisations on Paradigm's homepage, and eventually found myself on their [Puzzles page.](https://www.paradigm.xyz/research#paradigm-puzzles)

    > It is at this point I would like to note that I could easily spend my time producing an article about the motivations behind venture capital firms and startups running and funding writing contests. I'm going to earmark this topic for a future essay, as it appears that we are on the precipice of human originality, creativity, and artistic ingenuity being valued far higher than they were just a couple of years ago.

    Paradigm's Puzzles page is an eclectic mix of challenges, such as: making a [prediction market bot,](https://www.paradigm.xyz/puzzles/prediction-market-challenge) writing a prompt for an AI agent's [negotiation strategy,](https://www.paradigm.xyz/puzzles/negotiation) and [Anthropic's original take-home test.](https://www.paradigm.xyz/puzzles/anthropic-challenge) Each puzzle has a public leaderboard and you can submit a solution easily by logging in with your X.com account. What I like the most about the puzzles is that they cover the gamut of approachability, in terms of technical ability. While you _can_ try to hand-optimise an Anthropic kernel if you're able to, you could instead write [a prompt to pursuade AI buyers](https://www.paradigm.xyz/puzzles/persuasion) that a pen is worth a lot of money.

    I spent a bit of time on the persuasion puzzle but since its verifier is closed and rate-limited to 5 tries per hour, it's not the kind of thing I could obsessively try to crack. So, I looked for something else -- ideally something that I could verify locally on my own machine. It was at this point that I stumbled upon the puzzle that took up a great deal of my thinking time thereafter: the one called ["Pack Semicircles".](https://www.paradigm.xyz/puzzles/packing)

    * * *
    \*\*\*
    * * *

    Principally, this semicircle packing puzzle is quite simple. You have to arrange 15 identical semicircles into whatever arrangement you can come up with, with the objective to pack them as tightly together such that **when you draw a circle around your arrangement** the size of _that_ circle is as small as possible.

    With these kinds of experiments, I like to think about things independently first without looking up any kind of answer. There's a tendency these days to just throw the URL of the page at Claude or Codex and have it come up with a solution or explanation (spoiler alert: I do eventually enlist Codex's help), but I want to sauté my own -- likely naïve -- approaches before getting external inspiration, at least initially anyway.

    I'm a visual thinker and tinkerer, so after sketching in my Remarkable tablet for 15 minutes, I moved over to a graphics editor. I've been mostly using Figma for the past couple of years, but I needed some stronger tooling for dealing with shapes (I used to be a power user of Affinity [Designer](https://en.wikipedia.org/wiki/Affinity_Designer) / [Photo](https://en.wikipedia.org/wiki/Affinity_Photo)), so I booted Affinity Photo up first to do some rough arranging.

    I started by packing most of the semicircles into a rough "outer fan" shape, with a "core" in the middle that would house the remaining semicircles.

    ![Screenshot 2026-11-13 at 6.35.24 pm.png](/_next/image?url=%2F_next%2Fstatic%2Fmedia%2FScreenshot%25202026-11-13%2520at%25206.35.24%2520pm.CYFqmmjd.png&w=640&q=75)

    But I realised that the segments for the inner core couldn't just be manually fiddled into place without creating a large, inefficient gap. So I started experimenting (again, manually) with more deliberate symmetry and came up with some pleasing inner packings.

    ![Screenshot 2026-11-13 at 6.39.25 pm.png](/_next/image?url=%2F_next%2Fstatic%2Fmedia%2FScreenshot%25202026-11-13%2520at%25206.39.25%2520pm.DC2bcmpQ.png&w=640&q=75)

    This felt like a great way to work on some visual ideas. It was _so much_ easier using an interactive graphics editor than pen and paper to nucleate different, sometimes random arrangements. But I was still struggling to _efficiently_ pack the shapes together in a way where progress was _measurable._ Up until now, I had been manually setting the enclosing circle to a radius of `3` -- which would put me in the top ⅔ of the leaderboard. Every time I came up with a new visual idea, or tweaked one subset of the semicircles, I had to manually readjust all the other semicircles.

    I moved over to Affinity Designer since that has a _Symbols_ tool.

    ![Screenshot 2026-11-13 at 6.49.39 pm.png](/_next/image?url=%2F_next%2Fstatic%2Fmedia%2FScreenshot%25202026-11-13%2520at%25206.49.39%2520pm.BumxxJAX.png&w=640&q=75)

    Using a mixture of reusable symbol components, and [blending modes,](https://en.wikipedia.org/wiki/Blend_modes) I was able to create subgroups of semicircles that I could arrange into different patterns, and automatically repeat and update those patterns as I tweaked them.

    ![Screenshot 2026-11-13 at 6.51.03 pm.png](/_next/image?url=%2F_next%2Fstatic%2Fmedia%2FScreenshot%25202026-11-13%2520at%25206.51.03%2520pm.CVFFQ1P9.png&w=640&q=75)

    I began to realise a couple of things at this point:

    1. Getting an efficient packing of the semicircles with a symmetrical layout is very fiddly -- even in graphics software that has tools for reusable symbols.
    2. In isolation, I was discovering asymmetrical tweaks which allowed me to pack certain groupings more efficiently. This was also very fiddly.

    I realised that I wanted to build my own visualisation tool. But since I was coming to the end of my initial independent research on this problem, I decided to see what research existed out there just in case that would help inform any tool I decided to build for myself.

