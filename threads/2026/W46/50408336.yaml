  author: bob1029
  text: The mapping between audio gear and the power grid is pretty close. AC power
    and audio waveforms are basically the same thing. If you connect a speaker directly
    to <i>normal</i> mains power, it will operate briefly before burning out. You&#x27;ll
    get a very loud 60 or 50 hz test signal depending on where you plug it in. There
    are some drivers large enough that they can withstand this power level indefinitely.
    The car audio market has some pretty crazy designs.<p>There are pro audio amplifiers
    that are capable of producing &gt;120v RMS at their output terminals. I would
    be much more interested in seeing a youtuber purchase one of these and attempt
    to run a bunch of household appliances using it. Blowing up random shit with ridiculous
    amounts of power got pretty old for me as a form of entertainment.
