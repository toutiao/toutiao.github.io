  content: "Here is a program that, until July, never finished in Bun or Safari.\n\nnever.mjs\n\n
    \   const p = Promise.resolve(1);\n    p.constructor = {\n    \tget [Symbol.species]()
    {\n    \t\tthrow new Error(\"boom\");\n    \t},\n    };\n    \n    console.log(\"before\");\n
    \   await p;\n    console.log(\"done\");\n\nDon't worry if this looks confusing.
    The JavaScript spec says that because the getter throws an error, then `await
    p` should also throw, and so the program should crash. Node.js does, but Safari
    26 and Bun 1.3.14 print `'before'`, report the error, and then hang.\n\n![](/_next/static/immutable/media/traffic-lights-light.076k7um4vfh1l.png)
    ![](/_next/static/immutable/media/traffic-lights-dark.119dy2loza6f2.png)node\n\n
    \   \n    $ node never.mjs\n    \n    before\n    \n    Error: boom\n    \n    exit
    1\n    \n    $ \n\n ![](/_next/static/immutable/media/traffic-lights-light.076k7um4vfh1l.png)
    ![](/_next/static/immutable/media/traffic-lights-dark.119dy2loza6f2.png)bun 1.3.14\n\n
    \   \n    $ bun never.mjs\n    \n    before\n    \n    error: boom\n\nSafari 26
    fails the same way as Bun:\n\n![](/_next/static/immutable/media/traffic-lights-light.076k7um4vfh1l.png)
    ![](/_next/static/immutable/media/traffic-lights-dark.119dy2loza6f2.png)Safari
    26\n\n    const p = Promise.resolve(1);\n    p.constructor = {\n    \tget [Symbol.species]()
    {\n    \t\tthrow new Error(\"boom\");\n    \t},\n    };\n    \n    console.log(\"before\");\n
    \   await p;\n    console.log(\"done\");\n\nbefore\n\nError: boom\n\nBun and Safari
    both embed JavaScriptCore so the behaviour is the same - the promise is never
    settled! It is neither fulfilled nor rejected, so it stays pending forever. This
    was [WebKit bug 318399](https://bugs.webkit.org/show_bug.cgi?id=318399). I fixed
    it in [WebKit/WebKit#68749](https://github.com/WebKit/WebKit/pull/68749), and
    the fix was only +16 lines!\n\nWhat went wrong?\n\n## What `resolve` does\n\nLet's
    quickly brush up on promises.\n\nWhen you construct a new promise in JavaScript,
    the engine creates two functions, `resolve` and `reject`, and passes them to the
    callback you pass to the promise constructor.\n\nnew-promise.js\n\n    new Promise((resolve,
    reject) => {\n    \tconsole.log(\"I got my resolve function!\", resolve);\n    \tconsole.log(\"I
    got my reject function!\", reject);\n    \tresolve(42);\n    });\n    \n    //
    In V8 this logs:\n    // I got my resolve function! ƒ () { [native code] }\n    //
    I got my reject function! ƒ () { [native code] }\n\nThe builtin helper function
    `Promise.resolve(value)` does the same thing by constructing a promise and immediately
    calling `resolve` with the value you passed (with the exception that if `value`
    is a promise, and has a `.constructor` property equal to `Promise`, it is returned
    as is). A simple userland implementation would look like this:\n\npromise-resolve.js\n\n
    \   function PromiseDotResolve(value) {\n    \tif (value instanceof Promise &&
    value.constructor === Promise) {\n    \t\treturn value;\n    \t}\n    \n    \treturn
    new Promise(resolve => resolve(value));\n    }\n\nThe same is also true for literally
    writing `await 42`. The engine creates a promise and immediately calls `resolve(42)`,
    just like `Promise.resolve()` does, and the same exception applies.\n\nMany folks
    think of a promise as a value that can end in two ways - fulfilled with a value
    or rejected with a reason. This is a reasonable approximation since it maps pretty
    closely to how using promises actually feels when writing JavaScript day-to-day.
    Therefore, a naive implementation of a promise might look like this:\n\nmediocre-promise.ts\n\n
    \   type PromiseState<T> =\n    \t| {type: 'pending'}\n    \t| {type: 'resolved',
    value: T}\n    \t| {type: 'rejected', value: unknown};\n    \n    class MediocrePromise<T>
    {\n    \tprivate state: PromiseState<T> = {type: 'pending'};\n    \tprivate callbacks:
    Array<() => void> = []; // registered by .then()\n    \n    \tprivate resolve(value:
    T) {\n    \t\tthis.settle({type: 'resolved', value});\n    \t}\n    \n    \tprivate
    reject(reason: unknown) {\n    \t\tthis.settle({type: 'rejected', value: reason});\n
    \   \t}\n    \n    \tprivate settle(state: PromiseState<T>) {\n    \t\tthis.state
    = state;\n    \t\tfor (const callback of this.callbacks) callback();\n    \t}\n
    \   \n    \t// For example's sake this is missing `constructor`, `then`, etc.\n
    \   }\n\nI've called it MediocrePromise. It has a pending state, a way to resolve
    with a value, and a way to reject with a reason. It even has a list of callbacks
    to run, just like a real promise! Is this a good implementation?\n\nSadly, no.
    It is not a good implementation. MediocrePromise misses an important difference
    between how resolving and rejecting work.\n\nLet's start with rejections. Rejecting
    a promise is simple! Calling `reject(reason)` marks the promise as rejected, with
    `reason` as the rejected value. Excellent! MediocrePromise implements rejections
    correctly!\n\nResolving is more complex. Calling `resolve(value)` does _not_ store
    `value` straight away. First, it checks whether `value` has a `.then()` method.
    If it **doesn't** (e.g. a number, a string, an object without one, ..) the promise
    is **fulfilled** with `value` and we are done. Otherwise, if it **does** have
    a `.then()` method, `value` is treated like _another_ promise. Our original promise
    is _not_ settled yet and instead, `resolve` passes itself and the reject function
    to `value.then(resolve, reject)`. Whichever of those functions `value.then()`
    _eventually_ calls is what settles the promise. Sorry, that was a mouthful. There's
    a diagram in a sec to explain. Bear with me.\n\nThe `resolve` function [is defined
    in the spec](https://tc39.es/ecma262/#sec-promise-resolve-functions) as the **resolve
    procedure**. To find out whether `value` has a `.then`, it reads `value.then`,
    and a property read can run a getter, and a getter can throw (just like in our
    program at the beginning). So, looking for a `.then()` method on some value can
    result in three possible outcomes:\n\nOur MediocrePromise is missing the extra
    check and additional behaviour!\n\nThis asymmetry exists because _ **a failure
    is not a pending operation** _. When something fails, you **already** have the
    reason in your code (presumably an error)! So you can call `reject(reason)` immediately.
    This is not the case for the happy path of resolving, where a useful value might
    arrive later:\n\n    reject(new Error(\"bad request\")); // the reason is right
    here\n    resolve(response.json()); // the body is still arriving\n\nThis is why
    the extra behaviour is only implemented in `resolve`.\n\nIn the path where `value.then`
    _is_ a function, the spec considers `value` to be a **thenable**. Promises are
    thenables, since they have a `.then()` method. Any other object with a `.then()`
    method is a thenable too. Thenables work everywhere a promise would.\n\nSimply
    put: a **thenable** is any value with a `.then()` method. Therefore, any promise
    is also a thenable.\n\nFor example:\n\n    // `thenable` is not a promise!\n    const
    thenable = {\n    \t// resolve(thenable) calls this with the outer promise's resolve
    and reject\n    \tthen(resolve, _reject) {\n    \t\tresolve(42);\n    \t},\n    };\n
    \   \n    // resolve() called with the thenable\n    await new Promise(resolve
    => resolve(thenable)); // 42\n    \n    // a .then callback returning the thenable\n
    \   await Promise.resolve().then(() => thenable); // 42\n    \n    // await on
    the thenable directly\n    await thenable; // 42\n\nThe spec calls the aforementioned
    process of passing the resolve/reject functions to a thenable's `.then()` **assimilation**.
    But, perhaps a friendlier word is **flattening** : instead of holding the inner
    thenable as its value, the outer promise waits for it, so two layers become one.\n\nLastly,
    note that \"resolved\" isn't a real promise state. MediocrePromise also got this
    one wrong! Once `resolve` has been called the promise is **locked-in** to an outcome,
    but it can absolutely still be pending:\n\n    const inner = new Promise(() =>
    {}); // never settles\n    const outer = new Promise(resolve => resolve(inner));\n\nHere,
    `outer` was resolved, but it stays pending forever because `inner` never set"
