  text: |-
    Nice writeup. There's several dumb bits of this machinery. Symbol.species was a mistake in general and the committee has committed not to add it to new methods, but we're probably stuck with it for things like this.
    On a closely related note, there's an open spec PR that would swap the "check if .constructor is Promise" check for "check if the prototype is Promise.prototype", which at least would be  one less place user code can run and cause chaos. Probably we'll need to convince a browser to ship some instrumentation to see if that would break anyone, though I think it's quite unlikely.
