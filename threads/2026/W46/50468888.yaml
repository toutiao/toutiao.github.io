  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n# \U0001F90F smolmaxxing\n\nRun the biggest language model
    you can on the smallest hardware you own.\n\nTV boxes, old phones and tablets,
    single-board computers and routers all have a CPU, some RAM and flash storage
    that sit idle most of the day. smolmaxxing finds the biggest model each of them
    can really run, then pushes it further with custom kernels, careful memory use
    and weights streamed from flash. Every number in this repo was measured on the
    device itself.\n\n## Three devices so far\n\nThe TV box and the iPad run 8B and
    16B mixture-of-experts models on about 1 GB of RAM, and the phone runs 35B and
    80B ones with about 3 GB free. They all keep only part of each model in memory
    and read the rest from flash as it's needed.\n\nThe chart below compares the two
    1 GB devices size class by size class; the phone plays in a bigger league, and
    its results are in docs/phone.md.\n\nMore devices (single-board computers, routers,
    more phones) are coming. The techniques aren't tied to one box: the 1-bit kernel
    needs only basic NEON, and the flash streaming works on any Linux or Android device
    with more model than RAM.\n\nGot a small device? Run a model on it and submit
    your numbers: we'll add them to the results.\n\n## How it works\n\nAll of it is
    a patch on llama.cpp. The main ideas:\n\n- Kernels built for the chip. A 1-bit
    lookup-table kernel, repacked 2-bit and ternary formats for the Cortex-A55, and
    versions of them for the A7, which has no dot-product instructions.\n\n- Less
    RAM per model. Most of a small model's vocabulary is rarely used, so we drop those
    output rows. On the TV, a \"headless\" mode also stops the launcher and Google
    services while a model runs.\n\n- Experts paged from flash. A mixture-of-experts
    model only uses a few experts per token. We keep the popular ones in RAM, read
    the others from flash on demand and prefetch the next layer's. This is how 8B
    and 16B models run on 1 GB, and 35B and 80B models on a phone.\n\n- Streaming
    for dense models bigger than RAM, at the flash's full speed.\n\ndocs/how-it-works.md
    has every technique with its measured gain.\n\n## Try it\n\nThe quickest start
    is a ready-made model file from Hugging Face. The TV box and iPad files need the
    patched llama.cpp (stock llama.cpp can't load their pruned heads); the phone files
    load anywhere, but their speeds need the patch's expert pager.\n\n- TV box or
    another ARMv8.2 Android device: docs/tv-box-setup.md\n\n- Jailbroken iPad on iOS
    12: ipad-air/README.md\n\n- Android phone with 8 GB of RAM: Qwen3.6-35B-A3B (12.3
    GB) and Qwen3-Next-80B-A3B (27.6 GB, two files), set up as in docs/phone.md.\n\n-
    All model files and how to rebuild them: docs/models.md\n\n## Read more\n\n##
    What's in the repo\n\n## Similar projects\n\nOther people running language models
    on hardware that was never meant for them:\n\n## Star History\n\n## License\n\nMIT.
    The llama.cpp patches are derivatives of llama.cpp (MIT). Model weights keep their
    own licenses, and the evaluation texts are Wikipedia excerpts (CC BY-SA 4.0).\n\n##
    Credits\n\nBuilt on llama.cpp and llama2.c. Models from Qwen, unsloth (GGUFs and
    importance matrices), PrismML (Bonsai), inclusionAI (Ling-mini-2.0), tablinum
    (Moon-Beam), bartowski and mradermacher (GGUFs), Google (Gemma) and stories260K.
    The iPad is jailbroken with Amethyst. The banner uses Archivo (SIL OFL) and is
    rendered by tools/banner/render.sh. The \U0001F90F logo is the pinching-hand emoji
    from Google's Noto Emoji (Apache 2.0).\n\n## About\n\nmaxxing the ability to run
    different LLMs on the smallest devices possible\n\n### Topics\n\n### Resources\n\n###
    Contributing\n\n### Stars\n\n### Watchers\n\n### Forks\n\n## Contributors\n\n##
    Languages"
