  author: Farmadupe2
  text: 'For the last five months or so, opus and fable have both been able to do
    this task as a soneshot prompt. An inference engine is almost pure compute and
    to a first approximation the only operation your hardware needs to support to
    do llm inference is multiplication [the rest of an inference engine is &quot;some
    trig&quot;].<p>So to get any model working on $OLD_HARDWARE, the hardest part
    of the task is now sourcing the hardware itself and giving the agent ssh access
    -- a modern agent will be able to source a compiler, write the implementation,
    optimize it, test in qemu (or any other simulator) and push it onto the device.<p>Example
    prompt: &quot;write an inference engine for qwen3 0.6b in pure assembly that runs
    on this device. Write a script to attach the weights to the resulting binary.
    Prefix is supplied as a stream of u32 token IDs on stdin. The engine streams u32
    token IDs on stdout.&quot;'
