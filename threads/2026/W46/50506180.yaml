    closely with the chipmaker.<p>&gt; Bitdeer hosts a Chinese language website that
    lets customers rent A.I. chips and gain access to Chinese open source A.I. models
    through data centers in Malaysia, Canada and elsewhere. The Johor facility is
    one of five data centers the company plans to open in Malaysia in the coming years,
    according to filings with the Securities and Exchange Commission.<p>&gt; Cantor
    holds a stake in Bitdeer through its investment in Tether, the crypto company.
    It is far from the only American financial heavyweight investing in overseas data
    centers. Bain Capital, Citadel and Blackstone have all poured money into A.I.
    computing clusters across the region.<p>&gt; Cantor also previously provided financial
    services to Gorilla Technology, which is building data centers in Thailand and
    Indonesia, and has a contract to provide A.I. computing to Freyr AI, a Singaporean
    data center firm that corporate filings and job ads indicate has ties to China.<p>&gt;
    Cantor has worked with other Nvidia partners globally, including IREN, an Australian
    cloud computing company, and Lancium, a Texas data center developer.<p>&gt; A
    Commerce Department spokeswoman said that Mr. Lutnick makes policy decisions based
    on the best interests of the United States. He does not discuss department matters
    with his sons, nor do they discuss Cantor Fitzgerald business with him, she added.<p>&gt;
    Cantor Fitzgerald declined to comment. Bitdeer did not reply to a request for
    comment.<p>&gt; Mr. Lutnick, as of October 2025, transferred his remaining ownership
    stake in Cantor to his family. Before that, he had been given what the White House
    had called a “limited waiver” that allowed him to participate in certain decisions
    that could have “a direct and predictable effect on Cantor Fitzgerald,” exempting
    him from a federal criminal law that would otherwise have required him to entirely
    recuse himself from these discussions.<p>&gt; Even after Mr. Lutnick finished
    transferring his ownership stake to his sons late last year, he still had to abide
    by an ethics rule prohibiting federal employees from using their public office
    for their private gain or the gain of friends and relatives.<p>&gt; The Times
    reported last year that Mr. Lutnick was promoting data center projects that worked
    with his family firms. Senator Elizabeth Warren, Democrat of Massachusetts, and
    two dozen other Democratic lawmakers called for an investigation.<p>It is apparent
    there is a conflict of interest but the NYT was unable to find an explicit causal
    connection. The headline is objectively correct and in most administrations of
    the past, overlapping interests like this would constitute a scandal and would
    call for further investigation.
