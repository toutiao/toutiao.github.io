  author: dofm
  text: 'Yeah — I don&#x27;t really see how it can work except on the bass strings
    (played open).<p>This is a novel but slightly peculiar take on this problem. But
    there are lots of other things, right?<p>Listing for others since I suspect you
    know: all of this scheming about live-manipulating the basic tuning of an electric
    guitar dates back to the Parsons-White stringbender (and arguably further, since
    that was a way to get pedal steel sounds), which has led to stuff like the Duesenberg
    Multibender, the really extraordinary MayTrem (which keeps all strings in relative
    tune as the pitch is bent), the amazing Hipshot Doubleshot which lets you tune
    a guitar or dobro in two separate open tunings and switch between them instantaneously
    with a lever, etc.<p>Ed Gerhard added single-string frets to the bass side of
    his weissenborn (acoustic lap steel) that he can play with the fingers behind
    his slide or (incredibly) with his thumb.<p>All of these things are sort of fiddling
    at the edge of the question of a musical instrument, which is: should you confound
    their constraints or work within them? It&#x27;s a bit like the thing about whether
    a dulcimer should be diatonic, whether you should add just the frets you need,
    whether it should be chromatic, whether it should have removable frets, etc. etc.<p>As
    a sort of hobbyist lap steel player I find all these things fascinating, but I
    think the ultimate question is — where do you draw the line? There are lots of
    things I can&#x27;t play on a six-string lap steel, but should I change the instrument
    so I can, or should I accept the role the instrument plays, and play the things
    I can?<p>Another way to look at it is: why is the Harpejji niche? Why isn&#x27;t
    everyone playing the Linnstrument? Why don&#x27;t all pianists play the ROLI Seaboard?'
