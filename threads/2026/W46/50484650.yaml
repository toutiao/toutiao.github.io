  url: https://www.echopress.com/business/minnesota-guitarists-invention-strikes-a-new-chord
  title: Minnesota guitarist's invention strikes a new chord - Duluth News Tribune
    | News, weather, and sports from Duluth, Minnesota
  fetch_status: success
  content: "_Musician Ben Ranson reveals his \"palmfrets\" invention at Stella's in
    Fergus Falls on Oct. 28, 2026._\n\nContributed / Ben Ranson\n\nBy[Mary Olson](https://www.echopress.com/mary-olson)\n\nNovember
    12, 2026 at 9:30 AM\n\n[\n Listen \n](#instaread)\n\n[\n Comments \n](#conversations)\n\n
    Share \n\nShare this article\n\n News Reporting \n\nNews Reporting\n\nBased on
    facts, either observed and verified firsthand by the reporter, or reported and
    verified from knowledgeable sources.\n\n ![The Trust Project](https://static.forumcomm.com/images/trust-project/trustproject.png)
    The Trust Project \n[What is this?](/policies-and-standards)\n\nFERGUS FALLS —
    The back room of Stella’s restaurant in Fergus Falls filled with people on Oct.
    28, all there to see musician Ben Ranson play.\n\nRanson, who grew up in Sebeka,
    Minnesota, and currently lives in Sandstone, is a regular performer at venues
    across the region, including in Fergus Falls. But Oct. 28 was no ordinary gig.
    That night, Ranson revealed something he’d been working on for years.\n\nADVERTISEMENT\n\nIt
    wasn’t a new song or a clever guitar lick, it was an invention called “palmfrets”
    — something Ranson believes could change the way guitarists use their instrument.
    It allows players to play new bass lines or melodies using their palm, a special
    set of frets called palmfrets and a technique called palmfretting.\n\n## The invention\n\nThe
    idea for palmfrets came to Ranson over five years ago.\n\nRanson had already been
    doing musical experiments — even constructing organ-like foot pedals and learning
    the seven string guitar — all in a quest to get more notes out of the guitar,
    specifically more bass notes.\n\nHe said the reason behind the invention, initially,
    was entirely artistic. He wasn’t thinking much about developing a commercial product.\n\n“That
    was not on my mind at all,” Ranson said. “And it wasn’t really until I made one
    that really worked that it sort of dawned on me like, oh, this is something that
    people are really going to want.”\n\nRanson made an early-stage version of the
    invention in his garage, and said that, at first, he didn't recognize the importance
    of what he had created. He set it aside and left it in a corner for awhile — years,
    even.\n\nEventually, he returned to his forgotten creation. It was then that he
    began to hear the music.\n\nADVERTISEMENT\n\nHe drafted his ideas and designs
    on paper, and enlisted the help of engineers. Together, they created new prototypes
    made from 3D printed plastic and laser-cut metal parts.\n\nIt was during that
    time when Ranson said something shifted.\n\n“It hit me, like, I’ve really done
    it.”\n\nRanson knew the plastic and metal version was not practical, and only
    lasted a matter of weeks. But it worked, and from there, Ranson said the engineering
    became more serious.\n\nSerious enough that Ranson applied for a patent, which
    he received on Oct. 6, 2026.\n\nRanson had an inkling that this was something
    special, and recalled the first time he started playing the guitar with a solid
    prototype.\n\n“I was like, ‘I’m doing things that Chet Atkins never did,’” he
    joked. “I just had this sort of realization, like, other people are going to want
    to do this.”\n\nADVERTISEMENT\n\nFast forward to Oct. 28 in Fergus Falls, and
    Ranson’s invention is now in the hands of other guitar players.\n\n_Musician Ben
    Ranson demonstrates his \"palmfrets\" invention at the Fergus Falls Daily Journal
    on Oct. 30, 2026._\n\nMary Olson / Fergus Falls Daily Journal\n\n## How it works\n\nUsing
    the pisiform bone — a small, pea-shaped bone in the wrist, near the bottom of
    the palm — players depress a string on the palmfret, an extra fret or set of frets
    near the wrist of the picking hand. The player can then use the thumb of their
    picking hand to pluck the string fretted by the pisiform bone.\n\nThis frees up
    the fretting hand — the hand which frets strings on the neck of the guitar — meaning
    the player can move up and down the fret board more freely, and fret other strings
    because the pisiform bone is doing some of the hard work.\n\n“So if you want to,
    you can move (the fretting hand) anywhere you want, play any other notes that
    you want to play,” said Ranson.\n\nEssentially, guitarists could play a bass line
    with their pisiform bone and play other melodies or chords that would have otherwise
    been, literally, out of reach.\n\n## Learning curve\n\nRanson had some rules when
    designing palmfrets.\n\n“One of the basic principles in inventing it has been:
    if it interferes with the normal way that you would play the guitar, it’s no good,”
    he said.\n\nADVERTISEMENT\n\n“So the basic principle is you have to keep all of
    the function of the guitar as people know it,” he explained. “It has to add, but
    it can’t take away. That’s the basic principle.”\n\nStill, adding another element
    to the guitar introduces a learning curve, even for players as skilled as Ranson.\n\nHe
    gave proof of the learning curve by showing a callus on his pisofone bone — a
    callus reminiscent of the ones beginning guitarists get on their fingers when
    first learning to play — and compared his skill-level with the palmfrets to being
    a teenager playing in their first band and only knowing six songs.\n\n“That is
    the stage I am at now, frankly.”\n\nDuring the reveal, other guitar players tested
    out the palmfrets, taking turns passing around acoustic guitars, electric, and
    even the bass.\n\nDarren Quam, a musician from Battle Lake, who was in attendance
    on Oct. 28, tried his hand — or palm — at the new invention.\n\n“At first, you
    know, it took me a second to kind of understand how you could use it,” Quam said.
    “But then — especially when Ben had us come up and try it — then, you know, trying
    it with my own hands, I was like, okay, I see how this could be very useful in
    certain situations.”\n\nADVERTISEMENT\n\nQuam also commented on the learning curve.\n\n“It’s
    not a whole new instrument, but it’s a whole new way of playing.”\n\nDespite the
    new way of playing, during the reveal show, Quam seemed to catch on quickly, with
    Ranson joking “we’re going to have to take this away from you.”\n\nFrom a practical
    standpoint as a gigging musician, Quam thought the invention would be useful for
    solo players.\n\n“I think it really is probably the most useful in like a solo
    situation where you’re playing and you can accompany yourself, especially with
    those lower notes where you can fret with your palm hand and change the root note
    or the chords, and still be able to have the freedom to play on the higher strings
    as if there was someone else accompanying you, you know, like a bass player.\n\n“So
    it’s kind of like you’ve got a bass player on your palm all of a sudden.”\n\n_Musician
    Ben Ranson explains his \"palmfrets\" invention to attendees during an Oct. 28,
    2026, reveal show at Stella's in Fergus Falls._\n\nContributed / Ben Ranson\n\nAnd
    speaking of bass players, Ranson believes the bass guitar, as it now is, could
    become “obsolete.”\n\nADVERTISEMENT\n\n“But for a great reason, as far as bassists
    are concerned,” he said.\n\nWith the palmfrets, a bass player could play a bass
    line beneath a bass line, or play chords while playing a bass line. Meaning a
    bass player could accompany themselves, or add chords when playing with a group.\n\n“As
    a guitarist, you might want to play some jazz song, or whatever song you want
    — it’s got a clear melody, but you just need to have chords underneath it so that
    people can understand what that melody is.”\n\nWith palmfrets, the bass player
    can play the chord and the bass line, rooting the listener, while allowing the
    lead guitarist to focus on the melody.\n\nRanson explained that he expects the
    invention to make the bass into a very powerful instrument, “kind of like a piano.”\n\n##
    The future\n\nFor Ranson, thinking about how the invention will be used in the
    future is all speculation.\n\n“But I think it’s going to be really interesting.
    I mean, I can’t wait,” said Ranson.\n\nThe true potential of the invention, according
    to Ranson, might not be revealed for many years.\n\n“Let’s say 15 years from now,
    there’s going to be some kid who got one of these a"
