  text: "&gt; it sounded like you were softly arguing against modifying instruments
    universally,<p>Oh, no, not at all. I just feel that sometimes eliminating constraints
    is not the right choice; there&#x27;s sort of a tension between freedom and focus&#x2F;clarity
    etc.<p>ETA: though on further thought, the question of their instrumenthood is
    in there at some level, I must concede. But it is quite a complex notion.<p>e.g.
    is a fully chromatic mountain dulcimer still really a mountain dulcimer? To what
    extent is an instrument indivisible from its canon&#x2F;repertoire?<p>Certain
    classic pieces of folk music may never have evolved if the early instrument had
    more freedom to fret more notes, because an entire style of playing the dulcimer
    (the &quot;noter&quot; style where you fret with a small stick) really is rather
    interwoven with the diatonic layout.<p>Like I say — there&#x27;s no hard answer
    but I think this is a question musicians often grapple with as they develop their
    talent more deeply. In the same way that a lot of guitarists at the top of their
    ability abandon a lot of the anciliary kit (effects pedals, particular instruments)
    and strip back.<p>In the AI era I spend quite a lot of time thinking about creativity
    and constraints, but it has always been fascinating to me."
