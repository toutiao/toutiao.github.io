  author: bena
  text: Like, neat, but I wonder what it really gets you.<p>A guitar has a lot of
    duplicated notes. The lowest 5 notes of the low E string are unique and the highest
    5 of the high E for a guitar in standard tuning.<p>Standard tuning is EADGBe.
    Every fret is a half tone. So on the low E string it goes, from open E-&gt;F-&gt;F#&#x2F;Gb-&gt;G-&gt;G#&#x2F;Ab-&gt;A.
    That A is the same A as the second open string. This is how guitars are tuned
    to themselves, you can play the fifth fret on most strings to find out what the
    next string should sound like. The exception is the B which is tuned to the fourth.<p>It&#x27;s
    a bit by design, you have access to a full scale within reach of your hand, no
    matter where your hand is.<p>And this really only extends the higher range. So
    on the high e, instead of 5 unique notes, you&#x27;ll have 5 + whatever the palmfrets
    give you.<p>Now. If it jumped you an entire octave, that could possibly be cool.
    Basically replace an entire pedal with a bit of hardware on your bridge.
