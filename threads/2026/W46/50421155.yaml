  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\nEnglish · 简体中文 · 日本語\n\nNews · Quick start · Models · Options\n\nFlide
    is fast inference infrastructure for Jev-style decision models. With exact state
    forking it is up to 9.5 times faster than vLLM and SGLang, and every answer is
    the one the model gives the question alone. It serves the Jev /v1/systemone API.\n\n##
    \U0001F525 News\n\n- \U0001F525 2026-11-10 We added an email triage demo in Flide
    0.1.11, where Flide tags 10,000 emails with eight questions each in 28 seconds
    on one H200.\n\n- \U0001F525 2026-11-09 We added Ainvest-Decision, Darwin-27B-RSI-Decision
    and KnowLine-31B-Gen1.5 in Flide 0.1.10, and the KnowLine family now reads images.\n\n-
    \U0001F525 2026-11-09 We added pplx-decider-v1.1-27b and JEV-35B in Flide 0.1.9,
    and /v1/systemone now takes several requests in one body.\n\n- \U0001F525 2026-11-08
    We added two decision model families in Flide 0.1.8, including AutoTrust and Clef,
    and also drex-max-v1.\n\n- \U0001F525 2026-11-02 We released our paper Flide:
    Accelerating Decision Inference with Exact State Forking on arXiv.\n\n- \U0001F525
    2026-10-29 We added three decision model families in Flide 0.1.7, including SynACK
    Decide, Wald and Xor, and Gemma 4 mixture-of-experts models such as KnowLine-26B-A4B.\n\n-
    \U0001F525 2026-10-29 We added two decision model families in Flide 0.1.6, including
    Drex and KnowLine, and flide verify checks exact forking on your own model and
    requests.\n\n- \U0001F525 2026-10-28 We added six decision model families in Flide
    0.1.5, including Jeffan, JevAny, Kev, Lychee, pplx-decider and StartLux, and images
    for Lumma and mammoth.\n\n- \U0001F525 2026-10-26 We added five decision model
    families in Flide 0.1.4, including cerno, JADE, Linne, mammoth and Sieve, and
    also Quyet-1.0-Large.\n\n- \U0001F525 2026-10-26 We added eight decision model
    families in Flide 0.1.3, including AJev, Bespoke-Nimble, Darwin, jiwo, Lumma,
    mogan, Quyet and Senova, and LoRA adapters now serve as they are.\n\n- \U0001F525
    2026-10-25 We added two decision model families in Flide 0.1.2, including Intern-Decision
    and torchcast, and a question now takes up to 256 options.\n\n- \U0001F525 2026-10-24
    We released Flide 0.1.0 on PyPI, serving Qwen3.5 and Gemma 4 chat models and the
    OneJev and Open-Jev decision models. Welcome to have a try.\n\n## Quick start\n\nSee
    the docs for every model, images, the API and all options.\n\nuv venv -p 3.12
    && source .venv/bin/activate uv pip install flide torchvision flide serve --model
    OmniJev/OneJev1.6-0.8B\n\nAny model in the model table starts the same way, for
    example Perplexity's decision model.\n\nflide serve --model perplexity-ai/pplx-decider-flash-v1.2\n\nEvery
    one of them answers this request.\n\ncurl http://localhost:8000/v1/systemone -H
    \"Content-Type: application/json\" -d '{ \"state\": \"Order #1182 arrived with
    a cracked screen. The customer asks for a refund and attached two photos.\", \"questions\":
    { \"action\": {\"type\": \"choice\", \"instructions\": \"What should support do
    next?\", \"criteria\": {\"refund\": \"refund the order\", \"replace\": \"send
    a replacement\", \"escalate\": \"ask a human\"}}, \"urgent\": {\"type\": \"noul\",
    \"instructions\": \"Does this need a reply within the hour?\"} } }'\n\n## Example\n\nFlide
    answers eight questions for each of 10,000 emails in only 28 s. The email triage
    demo has the code to run it yourself.\n\nOn one H200 with OneJev1.6-0.8B, Flide
    answers one email in 10.0 ms and all 10,000 in 28 seconds, 3.5 times as fast as
    the fastest other engine for one email and 4.1 times for all of them.\n\n## Models\n\nThe
    last three columns say how much faster Flide answers one request than the engine
    its release ships, as the median latency over the requests of each workload on
    one H200, where DI is the Decision Index. The chat models run against the faster
    of vLLM and SGLang, and OneJev against qev, the engine it used before Flide. KnowLine
    35B runs with --quantize fp8, as its release serves it in FP8. A value marked
    ~ is the average over the sizes tested.\n\n## Options\n\n## License\n\nApache-2.0.
    flide/kernels/gdn.py holds a kernel derived from two kernels of flash-linear-attention
    (MIT); THIRD_PARTY_NOTICES lists it with the other code Flide builds on.\n\n##
    Citation\n\nIf you use Flide in your research, please cite our paper.\n\n@article{li2026flide,
    title = {Flide: Accelerating Decision Inference with Exact State Forking}, author
    = {Li, Bobo and Song, Jiajia and Fei, Hao and Hsu, Wynne and Lee, Mong Li}, journal
    = {arXiv preprint arXiv:2610.42148}, year = {2026} }\n\n## About\n\n\U0001F525\U0001F525
