  text: This is my post. Basically, I needed P2P between four R9700s for tensor parallel
    serving, which means a 32 GB BAR on each card. With all six GPUs in, the BIOS
    couldn&#x27;t map them, and Linux sized the switch&#x27;s window too small, so
    only two cards got their BARs. The module in the post works around that. With
    P2P off, prefill was about half as fast.
