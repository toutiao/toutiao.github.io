  author: wtallis
  text: Even as late as the PCIe 2.0 era, it was very plausible to still have peripherals
    that couldn&#x27;t be relied upon to support 64-bit addressing (eg. a motherboard
    I had back then had Firewire provided by a PCI controller behind a PCIe bridge).
    I&#x27;d say it was the PCIe 3.0 era when consumer PC hardware should have started
    making 32-bit addressing support an explicit non-goal; motherboards and peripherals
    should have both expected to be able to use a much wider address space to allow
    a GPU&#x27;s entire VRAM capacity to be mapped by default. That would have been
    starting around the GeForce 600 and Radeon HD 7000 series 28nm GPUs circa 2012.
    At the very least, there should have been a push to start using Resizable BAR
    around then, not <i>eight years later</i> as actually happened. PCIe has <i>theoretically</i>
    supported 64-bit addressing from the beginning, but consumer hardware didn&#x27;t
    start trying to actually take advantage of that in a real way until 2020.
