  author: SkyBelow
  text: I&#x27;ve tried something like this and ran into a problem which I&#x27;m
    not seeing a fix for.  Generally, to really apply this method, you need to understand
    the person asking the question.<p>&gt;Tell the user that you will start by asking
    a few questions, one at a time, to see what they already know.<p>This puts it
    into the session each time.  Do this once and it seems to work.  By the 5th time,
    you are getting tired of reconfirming your mastery.  This ends up depending upon
    the user to have a pretty solid foundation of what they know and then use this
    skill to expand the boundary a bit, and even then the AI can end up making so
    many assumptions that a person has trouble following it along.<p>I was thinking
    some sort of concept mapping kept long term might help, but such a mapping can
    become really difficult to build.  Which should be expected when we consider that
    teaching isn&#x27;t just its own discipline, but has many sub-disciplines targeted
    to specific areas (even if some of it, like classroom management, doesn&#x27;t
    apply to this scenario).<p>I made a few attempts at a knowledge tracking tool
    for personal use to track how much I knew Japanese beyond a simple JLPT level
    or similar with the plan to tie it into something like this, but it wasn&#x27;t
    great.  I could &#x27;cheat&#x27; and just tap into my Wanikani API to see my
    progress, but that still skips so many other areas of Japanese, and even when
    WaniKani says something is burned, I really want AI to still use it until I truly
    internalize it like I do words in English.  I suspect other areas of knowledge
    are similar.
