  author: Mikhail_Edoshin
  text: It has another interesting AI-related angle. We do have an inner brain mechanism
    that is similar to AI. Every moment it reacts to the current input by scanning
    the accumulated &quot;weights&quot; and classify it, coming up with a canned answer.
    (It actually goes very deep, down to what we perceive as physical sensations.)
    And the point of Socratic questioning (and other techniques) is to turn that mechanism
    off! If we know we do not know something we won&#x27;t take the canned &quot;answer&quot;
    because we know it is wrong. Instead we&#x27;ll start just observing the thing
    and then, somehow, we gain something new. Which the internal LLM immediately tucks
    away into &quot;weights&quot;.<p>And, of course, the input that stops the internal
    LLM cannot be some output of an external one. The teacher cannot give canned prompts;
    he must observe the pupil in the very state of not-knowing he wants to induce.<p>I
    think it was Plato who said that teaching is not transferring of some knowledge,
    it is lighting a fire.
