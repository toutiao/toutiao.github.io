  content: "# Statement from NVIDIA Board of Directors\n\n November 8, 2026 \n\n[![Statement
    from NVIDIA Board of Directors](https://iprsoftwaremedia.com/219/files/202512/692f56983d6332f89cbbc58b_nvidia-logo-horiz-wht-16x9/nvidia-logo-horiz-wht-16x9_mid.png?v=44a60e3f-c4e5-4d8a-879f-ec5121ad6f4b
    \"Statement from NVIDIA Board of Directors\")](https://iprsoftwaremedia.com/219/files/202512/nvidia-logo-horiz-wht-16x9.png)\n\nThe
    NVIDIA Board is initiating an independent investigation in light of recent reporting
