  title: "‘Bring Back THE Boss’: Nvidia Employees Petition for Jensen Huang’s Return
    | WIRED"
  fetch_status: success
  content: "Some Nvidia employees are calling for [Jensen Huang’s](https://www.wired.com/tag/jensen-huang)
    return even after his multiple reported extramarital affairs and [abrupt resignation](https://www.wired.com/story/nvidia-ceo-jensen-huang-steps-down/),
    according to internal correspondence reviewed by WIRED.\n\nAn internal “suggestion
    box” post submitted before Huang’s resignation by a longtime engineer at [Nvidia](https://www.wired.com/tag/nvidia/)
    urged the company’s board to take employee sentiment into consideration prior
    to taking any action. The submission has attracted more than 1,600 comments since
    then, with several asking board members to find a way to bring back Huang.\n\n“If
    you believe in the mission, bring back THE boss,” wrote one anonymous commenter.\n\n“We
    are all humans and can make mistakes. Jensen did so many good things and he needs
    a second chance,” wrote another.\n\nOne employee went as far as sending a companywide
    email demanding transparency into Huang’s exit. “I stand by Jensen,” the staffer
    wrote. “Not because I believe any person is infallible, but because I refuse to
    believe that standing for fairness must mean standing at a distance from someone
    whose leadership has meant so much to us.”\n\nThe employee couldn’t be reached
    for comment, while the engineer behind the suggestion box post declined to comment.\n\nNvidia
    and its new board chair, investor Harvey Jones, didn’t immediately respond to
    requests for comment.\n\n| Got a Tip? |\n| --- |\n| Are you a current or former
    Nvidia employee who wants to talk about what’s happening? We’d like to hear from
    you. Using a nonwork phone or computer, contact the reporter securely on Signal
    at peard33.24. |\n\nHuang, a 63-year-old who had led Nvidia since its founding
    in 1993, wrote in an email to employees on Sunday that he had been “unfaithful
    to [his] wife” and that there was “no excuse.” The acknowledgement followed reports
    of an affair with a [suspected Chinese intelligence asset](https://www.wired.com/story/chinas-nvidia-honeypot-isnt-surprising-jensen-huang-fell-for-it-anyway/).
    The board announced Huang’s resignation on Thursday morning, following [reports](https://www.nytimes.com/2026/11/11/technology/jensen-huang-nvidia-affair.html)
    of an alleged second affair with a direct report. (This employee has not commented
    on the matter.) Since then, Reuters [reported](https://www.reuters.com/technology/former-nvidia-ceo-huang-had-relationship-with-second-employee-sources-say-2026-11-12/)
    on an alleged affair with yet another Nvidia employee. Huang hasn’t commented
    about these reports since his Sunday email.\n\nNvidia’s board is largely made
    up of early Nvidia investors and Huang’s longtime confidants. It named Nvidia
    chief financial officer [Colette Kress](https://www.wired.com/story/jensen-huang-colette-kress-replacement-powerful-women-in-tech/)
    [interim CEO](https://www.wired.com/story/who-is-colette-kress-the-woman-who-could-succeed-jensen-huang/)
    and appointed former Synopsys CEO Harvey Jones as chair of the board. The crisis
    has cost the company [$1 trillion in market value](https://www.wired.com/story/jensen-huang-tanked-a-trillion-dollars-in-less-than-a-month/)
    since the allegations surfaced, prompted investigations from US lawmakers and
    the FBI, and raised the prospect of new export controls on chips.\n\nIt’s been
    business as usual inside the company throughout this week, but [Huang’s resignation
    left many employees stunned](https://www.wired.com/story/silicon-valley-is-still-defending-jensen-huang/).
    In the hours after, about two dozen employees posted on LinkedIn in support of
    Huang, with one describing their faith in his leadership as unwavering. Over the
    same period, WIRED couldn’t identify any posts from Nvidia employees in support
    of his resignation.\n\nOne employee who has been at Nvidia for a couple of years
    and wasn’t authorized to speak publicly says they perceive the desire for Huang’s
    reinstatement as widespread. They worry the company will eventually suffer without
    its founder at the helm and say that the board must bring him back. “Nvidia is
    Nvidia because of Jensen,” the employee tells WIRED.\n\nMany employees had expected
    a board investigation to conclude before any big changes would occur. For instance,
    the suggestion-box post called on the board to share its findings with employees
    and formally solicit their sentiment “about Jensen’s continuing as our CEO.”\n\nInstead,
    Huang left just as the inquiry had begun. Staffers are seeking to better understand
    why. “If America fails the man who helped build its future,” the employee in the
    companywide email stated, “then this world does not deserve Jensen Huang.”\n\n##
