  author: gnabgib
  text: DNS controls the length of time an answer is valid (with time-to-live&#x2F;TTL),
    some (poorly configured, but for a historical good reason) caching servers ignore
    the TTL and keep the record much longer (~24 hours).<p>A non-existent (not yet
    resolvable) domain, will get an NXDOMAIN response which also gets cached via a
    TTL setting (which again might be ignored by caching servers).<p>All that caching
    - while the current response is still &quot;valid&quot; because the TTL hasn&#x27;t
    expired - is what people call &quot;propagation&quot;.
