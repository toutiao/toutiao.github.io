  author: adrianmonk
  text: 'Aside from regular caches (that use TTLs), there can also be a replication
    delay between primary master and secondary master servers.<p>You make your changes
    to the zone file on the primary server. The secondary replicates the zone file
    (a &quot;zone transfer&quot;) and uses its copy to serve requests, enabling you
    to have multiple authoritative servers.<p>In the old days, the secondary server
    simply polled the primary server at a fixed interval to see if its zone data was
    out of date. It could potentially be hours if that&#x27;s the schedule you chose.
    It wasn&#x27;t uncommon to restart the secondary servers by hand if you needed
    something to propagate faster.<p>Later, more sophisticated stuff was added like
    incremental zone transfers and the ability for the primary to send a notification
    to the secondary instead of relying only on polling. Those made it more practical
    to replicate quickly.<p>There were scenarios back in the day when quick replication
    wasn&#x27;t worth the cost. The primary and secondary servers might be on opposite
    sides of a 9600 baud modem connection where zone transfers would eat up a significant
    portion of available bandwidth.<p>TLDR: DNS &quot;propagation&quot; is real, not
    a myth. It&#x27;s just that today it&#x27;s pretty trivial to make the propagation
    delay so tiny that it&#x27;s negligible.'
