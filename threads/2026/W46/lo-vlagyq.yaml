    I didn't write it because it wasn't relevant to my core point and my comment was already getting pretty long, but my idea is actually that std::contract_violation should not be an exception, aka not inherit from std::exception. That would mean it can be caught if you actually want to (just like you can catch panic in e.g Rust or Go), but it won't be caught by typical existing catch-all exception handlers.
    And when compiling with -fnoexcept it's just be a call to std::terminate anyway.
