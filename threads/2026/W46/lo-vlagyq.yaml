    Safety-critical systems tend to be so specialized that it's hard to talk about them as a class. There are automobile control systems, medical implants, avionics, etc. They each have different kinds of fundamental correctness assumptions, and different sorts of "safe default" actions to take. On top of that, even if these systems are written in a language like C, they're written in a highly-specialized way, using specific practices and tools.
    My own limited experience is with mobile robotics, which sometimes have actuators strong enough to punch through walls—or through engineers standing too close. My coworkers had actual scars from previous jobs.
    So let's say your safety critical system suffers an assertion failure. Some state, which you were sure was impossible, has been reached. One of your code's fundamental assertions about the universe has turned out to be wrong. Maybe your robot's current arm position is recorded as 36778912 out of a possible 360 degrees. (Oops.) Maybe your autopilot has been instructed to set the flight level to 2 miles below current ground level, when higher level routines were never supposed to do this. Maybe your data structure contains -6 elements.
    Something has gone deeply wrong. It's possible that your heap or your data structures are corrupt. Or perhaps your program logic is fundamentally invalid. You have some very tough engineering decisions to make, because now you know you're operating on "impossible" state or that you're using known-bad logic.
    The correct answer varies depending on what you're building. Frequently, your first goal should be to escape the "blast radius" of the damage. If your data structure contains -6 elements, then your probably shouldn't be using that data structure. If your fundamental system state (like actuator positions) contains blatantly impossible numbers, then you can't really make decisions based on them. And looming over all of this like two specters are the possibility of memory corruption, and the historically high rates of bugs in error-recovery code.
    Erlang's approach is wiser than most: Each process is isolated. When things go too wrong, you assume the entire process is untrustworthy, kill it, and return to a supervising handler. You still have hard decisions to make, and there's no one-size-fits-all answer. Maybe you want to run a specialized power-down routine for your robot (which may itself require complex code or tradeoffs). Maybe you want to gracefully disengage the autopilot and notify the user that they need to take over, because your autopilot is clearly defective. You need to have some story on how you fail to a safe state despite running on bad code and/or impossible data.
    (For what it's worth, I've read enough crash reporter stack traces  to be convinced that most desktop software is buggy garbage that barely limps along on a good day. And I fear that basically all C/C++ programs bigger than 1,000-line embedded hardware controllers are unfixably buggy, as the recent endless deluge of CVEs suggests. We have not been doing well as an industry.)
