    I'm pretty well aware of this bit of Rust history, and I think I agree with both your characterization and that in the article. I'm not sure they're actually incongruent. It doesn't say Graydon ever was or wanted to be a BDFL, it even lays out that various governance models, BDFL being just one of them, can all lead to this split:

    No governance model has prevented such a disagreement: it has happened under ANSI and ISO committees, under ECMA, under benevolent dictators, under open-source communities, and even in corporately owned languages.

    The article also mentions the creator stepping back as one of the ways to resolve this issue:

    When neither side yields, the usual end result is “fork” or “quit.” Perl forked permanently; Python temporarily lost its creator’s involvement (he later resumed participating but no longer as BDFL); Pascal, Swift, and Java lost their creators’ involvement permanently.

    They don't list Rust here, perhaps for a lack of detail knowledge, but I'd characterize the result as "quit", too. Graydon stepped back, leaving entirely for a while and then returning slowly, but never exerting a great deal of influence over the language's direction again.
    That being said, I also agree that Rust's case is unique, insofar as none of the other listed languages had their creator reject the BDFL role as early and as strongly as Graydon did.
