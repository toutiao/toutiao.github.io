    OpenStep’s NSAssert macro threw an NSInternalConsistencyException if the assertion failed. So we have over 30 years of this model being tested in production at scale (almost every OS X and iOS app will do this somewhere: inside system libraries if nowhere else).
    One of the objections to aborting comes from safety-critical systems (the place that P2900 claimed to be helping, though the fact that it makes source-level reasoning non-local means it’s a disaster in that domain). Stopping is often more dangerous than continuing in an erroneous state in such systems, because the software is controlling some physical process.
