    I think this whole situation is incredibly politically interesting. The C++ standardization process is fascinating.
    One thing I've been thinking about regarding the criticisms of concepts is: to me, an "obviously good", incremental change to the language would've been to add better assertions. Standardize something like Google's CHECK and DCHECK, with proper language support. I imagine a solution where C++ defines 3 build modes: debug, release and release-unchecked, then introduces modernized assert functions, std::check(bool) and std::dcheck(bool).

    std::check(bool) runs in modes debug and release, it throws a std::contract_violation (or abort or whatever) if passed a false-y value
    std::dcheck(bool) runs only in debug mode, it also throws a std::contract_violation or whatever if passed a false-y value but is for slower checks which should only be run in debug mode
    Maybe have some magic standardese somewhere which guarantees that the code inside the check functions don't get compiled for the modes which they shouldn't apply to (magic behavior in "functions" in std isn't new, look at std::launder)

    I personally would love something like this; I wouldn't have to try to remember whether I was meant to define/undefine NDEBUG or _NDEBUG or _DEBUG, moving more things away from macros is a good thing, it would be nice to have a standard way to define heavier debug-only checks and lighter "you probably want to run these in release mode too" checks, etc.
    Yet it runs foul of one of the major issues which C++26 Contracts detractors bring up, which is that behavior changes depending on compiler settings for the particular TU and that checking behavior might therefore be different depending on the compiler settings for the TU whose implementation of a function happens to be picked.
    I don't understand why this is worse for C++26 Contracts than for my obvious and minimal version, or C-style assert() for that matter. Is there anyone who could care to explain? ODR violations due to compiler settings between TUs is obviously a big problem, but it has been an obvious big problem for most of the language for the past 30 years, why does it matter more now?
