    The constant push for new features in C++ seems to me to be more driven by existential fear rather than actual technical merit. This fear is driven by the "javaification" of C++ -- that it may one day become a "don't write new things in this," kind of language. That is scary to the people with the power to make decisions because that means their code is all of a sudden "unsafe legacy code." That statement, regardless of its technical truth, deters stakeholders enough to foment panic.
    I'm going to go out on a limb here and assume things about C++ contracts that I do not know to be true, so if I'm wrong, please correct me.
    There are two benefits I can see to standardizing contracts:

    Congruence between API, documentation, and behavior
    Static analysis

    To address #1, this does not need to be in the standard to be done, as stated explicitly in the write-up.
    As for #2, semantics that intuitively become compilation errors are a) practically speaking unstandardizable without becoming a turing-complete combinatorial explosion of compiler switches and b) not necessary to standardize.
    Do not mention the potential benefit of compiler optimization. We're already scared enough of restrict.
    This is not to say that contracts should not be implemented, since that depends entirely on how you define "should."
    As above, the real reason this is being pushed is that major parties want to be able to declare to their investors and institutional customers that their code is "safe at the language level, just like Rust" with the minimum amount of resources expended for the maximum amount of checkboxes ticked. It is not a stretch to call the committee's rhetoric propagandous.
    From my perspective, it looks like C++ is a 41-year-old man wearing a jorts and a sideways baseball cap.
    Edit: reading this back, it reads more inflammitorily than I meant it to. I don't mean to paint any big bad wolves, nor do I mean to discount the real technical merits of contracts.
