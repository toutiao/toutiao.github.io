    Throwing an exception in response to an assertion violation seems weird to me. An assertion failure means, "Some fundamental invariant of this program was supposed to be impossible to violate, but it happened anyway. Presumably everything we though we knew was a lie?"
    The correct response to an assertion failure is an abort, or some dire last case mechanism like killing a thread and notifying a handler supervising that thread. Erlang/BEAM and Rust essentially have versions of the latter. Erlang gets away with this because Erlang processes have isolated memory spaces and because processor supervisor trees are standard. Rust mostly uses this mechanism when running tests, to catch assertion violations in a test and report them nicely.
    But exceptions are essentially an error flow, not a "panic-like flow". They don't feel like a good match when your program is in a known-broken state where fundamental assumptions have been violated.
    (Not that I have a dog in the C++ fight.)
