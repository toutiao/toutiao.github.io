    yes, phosphoramidites are what you use as ink.  You print many many dots on a
    flat surface, and then you print over the same dots again and again, building
    up layers one base at a time.  Then you dissolve those dots, giving you short
    strands in solution, which can be assembled into longer strands by being strategic
    about what else is in that solution and about which sequences you programmed in
    to the printer.<p>I&#x27;ve been considering making one in my garage.  I don&#x27;t
    think it&#x27;s going to be easy, but I also don&#x27;t think it&#x27;s going
    to be difficult enough to be a good candidate for use as a regulatory chokepoint.  We&#x27;re
    not talking about a warehouse full of centrifuges here, it&#x27;s a printer with
    special ink.
