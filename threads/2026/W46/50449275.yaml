  author: epistasis
  text: No, that&#x27;s a basic category error.<p>Novel viruses are not pathogens,
    and in fact it&#x27;s right there in the article that they are phage for bacteria.<p>Moreover
    they ordered these viruses and build them through exactly the same DNA manufacturers
    that are subject to these regulations.  They are not pathogenic and can not infect
    human cells.<p>But new viruses that do infect human cells are created all the
    time.  It&#x27;s common for experimental gene therapy treatments.<p>That&#x27;s
    entirely different from the type of screening needs to predict pathogens. We don&#x27;t
    have the technology to predict if a novel sequence is going to be able to bind
    to some arbitrary human cell surface receptor and allow entry of a virus into
    the cell and infect it. Much less predict what would make it contagious, etc.<p>All
    that comes down to searching for sequence similarity to known pathogens, viruses,
    etc., and when there&#x27;s a hit, vetting the person ordering the sequence.
