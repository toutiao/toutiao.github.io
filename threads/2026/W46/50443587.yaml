  author: Vakaiser
  text: An interesting story, though hardly original.<p>I think it highlights one
    of the larger concerns that people have about AI, and by extension any superior
    intelligence, synthetic or extra-terrestrial:<p><i>You are no longer in control.</i><p>Humans
    have been so accustomed to their intellectual superiority that the idea of a greater
    intelligence is terrifying because they believe they&#x27;ll be treated the same
    way they currently treat lesser intelligences.<p>Conservation efforts, zoological
    enclosures, husbandry and farming as livestock, mass culling...<p>In short, enslavement.<p>But
    the truth is that a superior intelligence isn&#x27;t, by definition, a <i>human</i>
    intelligence. Superiority doesn&#x27;t mean we&#x27;ll be enslaved as we have
    done to others. Superiority doesn&#x27;t necessarily imply control.<p>Life is
    a thousand different shades of gray, and AI will be no different. Some wonderful
    things will come of it, some terrible, but mostly it&#x27;ll just be a myriad
    assortment of neutrality.<p>Doom and despair or boundless optimism, both are myopic.
