  author: adrian_b
  text: Fixed wings drones are much more efficient for big and heavy drones.<p>Their
    efficiency advantage drops quickly for diminishing sizes and weights.<p>That is
    why big birds use gliding whenever they can, but small birds and insects use almost
    only wing-powered flight.<p>Screw propellers are pretty much equivalent with wings
    whose rotation angle is not limited so they can rotate continuously around the
    body instead of having to reverse periodically the direction of rotation and the
    attack angles.
  score: 0
  posted_at: '2026-11-10T10:26:22Z'
- id: '50438407'
  parent_id: '50433353'
  author: adrian_b
  text: As a child, I made a few such gliders from balsa pieces.<p>However, a drone
    must carry some useful load and it would be much heavier than such a light glider,
    so it would lose altitude quickly while gliding.<p>Moreover, even a drone that
    is not intended to go far away, which could reach a nearby destination if launched
    from a big height or by towing, would still need a battery, some motors and control
    electronics to control the direction of flight, which would also increase its
    weight.<p>A drone that would be able to go very far by gliding would need a lot
    of sensors and very sophisticated control to take advantage of the air currents
    in order to avoid losing quickly the altitude and crashing down.<p>An ordinary
    drone with flapping wings could glide only for very short time intervals, after
    which it would have to use powered flight to recover its altitude. Even so, its
    control  would not be easy for avoiding the risk of flight instabilities at the
    transitions between wing-flapping and gliding.
