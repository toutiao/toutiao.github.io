    If an insect could carry something useful, we could enter sci fi technology with only a step or two removed from state of the art. There&#x27;s been an appreciable amount of work programming fruit fly movement with various remote methods.<p>2005 showing some movement using lasers and a fly engineered to be sensitive to them with the receptor hooked up to a biological response.
    <a href="https:&#x2F;&#x2F;www.science.org&#x2F;content&#x2F;article&#x2F;remote-control-flies" rel="nofollow">https:&#x2F;&#x2F;www.science.org&#x2F;content&#x2F;article&#x2F;remote-control-flies</a><p>2024 and we are now writing &quot;Hello World&quot; using a fly in Fig 4.
    <a href="https:&#x2F;&#x2F;www.pnas.org&#x2F;doi&#x2F;10.1073&#x2F;pnas.2426180122" rel="nofollow">https:&#x2F;&#x2F;www.pnas.org&#x2F;doi&#x2F;10.1073&#x2F;pnas.2426180122</a>
