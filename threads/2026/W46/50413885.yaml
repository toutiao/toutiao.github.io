  author: nostrademons
  text: I think that endurance is an intrinsic limitation of drones, but I take the
    opposite conclusion as you.  Instead of it meaning drones will never catch on,
    it&#x27;ll mean that <i>military missions</i> and consequently <i>the size and
    structure of the state</i> will adjust their form to suit what drones are good
    at, rather than drones not catching on.  In other words, we&#x27;ll get drones,
    but we&#x27;ll lose nation-states, rather than keeping nation-states but having
    them fail to adopt drones.<p>Drones&#x27; ability to absolutely dominate the battlefield
    inside of ~200km is just too powerful.  You&#x27;ll end up with small regional
    powers that are basically impregnable to invasion, but also can&#x27;t project
    power because the range of drones is too short.  City-states, basically.  And
    because the defining characteristic of a state is its monopoly on physical force,
    the structure of the state will adapt to the dominant military technology of the
    time.
