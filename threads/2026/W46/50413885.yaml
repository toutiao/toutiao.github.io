  author: asdff
  text: Part of it is also perhaps the difference in roles. There are small birds
    that are gliders. But the big birds we have in mind such as birds of prey and
    such are basically loitering munitions, and when a target is identified, they
    operate like energy fighters, dropping from upon high on top of their prey. There
    is no need for the maneuverability demanded by a pollinator like a hummingbird
    or a bee, where one slowly samples over an entire flowering bush. Nothing big
    flaps to the extent of a hummingbird either; the energy demands would be untenable
    with available resources, a hummingbird is basically constantly fueling up with
    high octane as it is.
