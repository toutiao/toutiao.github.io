  author: tombert
  text: When I would visit my grandmother as a kid, my parents wouldn&#x27;t let me
    bring a game console with me, and she lived in the middle of nowhere so I would
    get bored pretty easily.<p>One summer, I had brought a book on how to make different
    paper airplanes.  My grandmother had this huge crate of dot matrix printer paper
    [1] that I was given freedom to use to my heart&#x27;s content.<p>I made hundreds
    of planes, of varying quality.  I even did quasi-scientific tests to see which
    ones would fly farther, and I used a rubber band extended to the same length each
    time to try and ensure I was applying roughly the same amount of force in each
    launch.<p>I look back at that time pretty fondly.  It was the only time in my
    life that I actually had fun visiting my grandmother&#x27;s house.<p>[1] Even
    at the time this was somewhat outdated; she had a normal inkjet printer at the
    time so the paper was basically useless as printer paper.
