    how smoothly it stays straight in the air compared to all my paper airplanes in
    childhood.<p>Edit: Tried making the flapping wings AeroDactyl but it didn&#x27;t
    work out :( wasn&#x27;t aerodynamic and didn&#x27;t flap its wings just went straight
    to the ground<p>Edit 2: Tried making the Jetstream (another 1 minute plane) and
    it came out well! Mine is INCREDIBLY asymmetrical and still flies better than
    any other plane I&#x27;ve made other than the Mystic!<p>Edit 3: Tried making the
