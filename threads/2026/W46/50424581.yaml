  author: shermantanktop
  text: The author, Felix Rosenthal, was a family friend.  He had an incredible life,
    like something out of &quot;The Third Man&quot;:<p><i>Born on January 12, 1917
    in Munich, Felix emigrated from Germany in 1933, shortly after Hitler came to
    power, and settled with part of his family in his mother&#x27;s native Florence;
    after obtaining his Italian high-school degree (&quot;licenza liceale&quot;) he
    went on to study engineering at the Istituto Politecnico in Milan, but when the
    Fascists&#x27; anti-semitic laws of 1938 prohibited Jews from enrolling in public
    schools and universities, he settled in Paris, again with part of his family.
    At the outbreak of WWII in September 1939, Felix was in Switzerland and a return
    to France was impossible; in 1940 he emigrated to Chile before finally settling
    in Berkeley to join his brother Bernard in 1941, and enrolling in the engineering
    school of the University of California. From 1943 to 1946 he served in the US
    Army and became one of &quot;The Ritchie Boys&quot; - GIs of German origin who
    spoke German natively and were trained in Military Intelligence at Camp Ritchie,
    Maryland. He was discharged with the rank of Master Sergeant and returned to the
    University of California to study architecture; after having obtained his MA he
    became assistant to Eric Mendelsohn, the renowned architect who had recently joined
    Berkeley&#x27;s Architecture Department. </i><p><a href="https:&#x2F;&#x2F;www.legacy.com&#x2F;us&#x2F;obituaries&#x2F;legacyremembers&#x2F;felix-rosenthal-obituary?id=22333887"
    rel="nofollow">https:&#x2F;&#x2F;www.legacy.com&#x2F;us&#x2F;obituaries&#x2F;legacyremembers&#x2F;felix-r...</a><p>We
