  author: Jtsummers
  text: "&gt; I imagine equipment is regularly updated and upgraded without them knowing.<p>Part
    of the reason for this outage was that these systems are <i>not</i> regularly
    upgraded. That&#x27;s why they&#x27;re dealing with decades old network hardware
    and lines and marrying them up to modern fiber. It&#x27;s expensive to do the
    upgrades, but instead of doing regular rolling upgrades to their network components
    they generally do big-bang upgrades like the one happening now (that apparently
    caused the outage). In 20-30 years there will be another big-bang upgrade replacing
    the Juniper routers and fiber lines they&#x27;ve been installing now, and it&#x27;ll
    probably cause similar problems.<p>This also happens a lot in DOD (not surprising,
    same contractors doing the work and probably the same companies in the program
    offices for FAA as DOD giving the same bad advice), it&#x27;s incredibly frustrating
    because it&#x27;s very obvious that there are better ways to do things, but the
    funding isn&#x27;t there until it&#x27;s urgent. That&#x27;s why they&#x27;re
    still using 1980s computers with floppy disks in their critical path for ATC as
    well. Now that those systems are nearly impossible to maintain, there is enough
    noise to push funding a proper replacement effort, about 20-30 years after it
    should have been done."
