    [Trump Weighing Executive Order to Label Disliked Nonprofits as ‘Terrorist’ Groups:
    Report](https://www.commondreams.org/news/trump-nonprofits-terrorism)\n\nUS Transportation
    Secretary Sean Duffy speaks during a press briefing at the Department of Transportation
    headquarters building in Washington, DC, on November 14, 2026.\n\n (Photo by Aaron
    Schwartz/AFP via Getty Images) \n\n# 'Duffy Lied': Air Traffic Controllers Refute
    Trump Transportation Secretary's Ground Stop Explanation \n\n## \n\n\"I’ve spoken
    with 60 air traffic controllers tonight about what Sean Duffy said at the White
    House today,\" said one journalist. \"None of them are buying what he said.\"\n\n[Brett
    Wilkins](https://www.commondreams.org/author/brett-wilkins)\nNov 14, 2026\n\n[News](https://www.commondreams.org/news)[Politics](https://www.commondreams.org/politics)\n\nNov
    14, 2026\n\nAir traffic controllers are rejecting US [Transportation](https://www.commondreams.org/tag/transportation)
    Secretary Sean Duffy's explanation for Friday's nationwide flight ground stop,
    raising questions about the Trump administration's account of a communications
    failure that disrupted air travel across the [United States](https://www.commondreams.org/tag/united-states),
    affecting an estimated 1.5 million travelers.\n\n[Washington](https://www.commondreams.org/tag/washington)
    Examiner homeland security reporter Anna Giaritelli [told](one%20of%20them%20are%20buying%20what%20he%20said%20because%20they%20said%20these%20types%20of%20switches%20that%20the%20FAA%20is%20doing,%20they%20don%E2%80%99t%20happen%20during%20the%20day,%20they%20don%E2%80%99t%20happen%20during%20busy%20times%20like%20a%20Friday%20afternoon.%20They%E2%80%99re%20doing%20these%20midweek,%20middle%20of%20the%20night%20when%20there%20is%20no%20air%20traffic%20going%20on.%20The%20controllers%20were%20saying,%20%E2%80%9CWe%20don%E2%80%99t%20buy%20that%20this%20is%20actually%20what%E2%80%99s%20happening,%20the%20reason%20that%20Sean%20Duffy%20is%20saying%20this%20has%20happened.%E2%80%9D)
    CNN's Laura Coates during a Friday night interview that she'd spoken with 60 air
    traffic controllers about the Federal Aviation Administration (FAA) ground stop,
    which was just the third to ever occur.\n\n\"None of them are buying what he said,\"
    Giaritelli said. \"The controllers were saying, 'We don’t buy that this is actually
    what’s happening, the reason that Sean Duffy is saying this has happened.'\"\n\n>
    Duffy lied.  \n>   \n> [[image or embed]](https://bsky.app/profile/did:plc:t6ubj2wlhc34awzcymh3qpur/post/3n2bf7mglsc2s?ref_src=embed)
    \ \n> — Ron Filipkowski ([@ronfilipkowski.bsky.social](https://bsky.app/profile/did:plc:t6ubj2wlhc34awzcymh3qpur?ref_src=embed))
    [November 14, 2026 at 3:24 AM](https://bsky.app/profile/did:plc:t6ubj2wlhc34awzcymh3qpur/post/3n2bf7mglsc2s?ref_src=embed)\n\nAt
    a [White House](https://www.commondreams.org/tag/white-house) briefing Friday
    evening, Duffy blamed the disruption on America's aging air traffic control [infrastructure](https://www.commondreams.org/tag/infrastructure),
    saying overloaded switches and routers had produced inconsistent radar and communications
    data.\n\n“Our switches, our routers actually got overloaded with data,” he said.
    “And because of that, we shut the system down.”\n\nBut Giaritelli said the controllers
    she contacted questioned the plausibility of the administration's account, particularly
    the timing of the alleged equipment changes.\n\n“These types of switches... that
    the FAA is doing, they don't happen during the day,” she told Coates. “They don't
    happen during busy times like a Friday afternoon. They're doing these midweek,
    middle of the night, when there is no air traffic going on.\"\n\nGiaritelli's
    comments came as the [Trump administration](https://www.commondreams.org/tag/trump-administration)
    struggled to explain how a failure in the nation's air traffic control network
    could have escalated into a shutdown affecting airports nationwide. The FAA lifted
    the ground stop at approximately 8:15 pm Eastern on Friday, but the disruption
    continued Saturday.\n\nDuffy offered a new detail on Saturday, [saying](https://apnews.com/article/ground-stop-flights-airlines-cancellations-faa-1fbf4992f0ddaa4c463b0e4990b6e291)
    that a system overload occurred when contractor L3Harris Technologies Inc. was
    replacing a section of the air traffic control system’s old copper wire with new
    fiber wire.\n\n“Our contractor didn’t meet the moment or the equipment didn’t
    meet the moment,” the secretary said, adding that officials were investigating
    whether the contractor's \"incompetence\" or a faulty router was to blame.\n\nDuffy
    emphatically denied that the FAA's recent nationwide rollout of an $875 million
    [artificial intelligence](https://www.commondreams.org/tag/artificial-intelligence)
    system called Strategic Management of Airspace, Routes, and Trajectories (SMART)
    had anything to do with Friday's disruption, claiming that the system \"is not
    even plugged in.\"\n\nThe FAA [said](https://www.faa.gov/newsroom/statements/general-statements)
    earlier this week that it \"will now use SMART in the airspace of all 22 [air
    traffic control] centers across the country to reduce delays, reduce fuel consumption,
    and improve the travel experience for the flying public.\"\n\nDuffy also used
    the crisis to renew his demand for $50 billion in congressional funding to overhaul
    the nation's air traffic control system, arguing that the aging infrastructure
    would continue to fail without additional investment.\n\nThe administration's
    shifting account has added to calls for an independent investigation. Homeland
    Security Secretary Markwayne Mullin said Friday that investigators had found no
    evidence of a cyberattack, although he acknowledged that the possibility had not
    been entirely ruled out.\n\nRep. James Walkinshaw (D-Va.) was among those who
    challenged the administration's explanation, suggesting that Duffy had concealed
    the role of the Trump administration's own modernization efforts.\n\nWalkinshaw
    cited a September [report](https://files.gao.gov/reports/GAO-26-107992/index.html?pubDate=20260922)
    from the Government Accountability Office warning that precisely this could happen.\n\n>
    \n\n“In essence, the FAA is buying delivery speed at the risk of cost uncertainty
    and potential disruptions,\" GAO said. \"The net effect could be that air traffic
    controllers are forced to continue to rely on severely outdated systems that are
    prone to failure leading to more system outages, ground stops, flight delays,
    or worse—safety incidents.”\n\nThe fiasco prompted critics, in"
