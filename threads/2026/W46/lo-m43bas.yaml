  author: blip
  text: |-
    As you can't control upcoming exploits, you want to:

    Reduce the number of people getting access to a potential zero-day exploit
    Reduce the impact of exploiting a zero-day
    I mentioned zero day, because I am assuming your system will be kept up-to-date.
    => Automate your updates (both for your packages and container images)

    Reducing the access:
    Some only allow access to these ports: 22 for SSH (if you leave it on standard port, which you will see some people advise to change), 80 (normally never used except to ease SSL setup via Let's encrypt), and 443 (only for services that need to be public).
    For the services not intended to general public, people would use a VPN or Tailscale, which means only people you allow on the network will be able to access these (it means you will likely need to help your family member and friends to setup Twingate if you want them to access these, and they won't be able to reach your services from any laptop).
    Some people find the above even too open, and would reduce it further. Everything is behind tailscale (even SSH), and public services leverage Tailscale Funnel. No port is open on your machine, but a tunnel exist between your machine and tailscale infrastructure that expose your websites there.
    Reducing impact:
    The public websites can still be vulnerable to zero days (from tailscale funnel or not), so the idea is containing damage. Run your services in a containers is an easy way to limit impact to that service only if things go wrong (and not the whole server).
    If you want to go a bit more advanced, I found this blog contains good advice generally:

    https://dataswamp.org/~solene/tag-selfhosting.html

    There are obviously much more you can do: VLAN for your home server, and a lot of permutation for the same idea: wireguard instead of tailscale, iroh instead of tailscale, VM instead of containers, different service users instead of containers, etc.
