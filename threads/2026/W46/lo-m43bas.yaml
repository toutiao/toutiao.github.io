    As a chronic putting stuff publicly accessible online guy, I'd say you get 95% of the way there by:

    Regularly updating your system
    Disabling password logins on SSH
    Running SSH on a non-standard port (low effort automated drive-by intrusion attempts are, to be realistic, the main threat vector for this type of stuff, so reducing your target profile does help a fair bit even if your grandma could run nmap and find your hidden port)
    Setting up UFW (or the like) and blocking every port that shouldn't be accessible
    If you do not have a PhD in docker networking, don't use docker as it's very easy to have it helpfully poke holes in your firewall
    For anything you want accessible only by you, put it behind caddy or nginx and add basic_auth.   Never trust a web app's login screen to keep you safe.   You can further improve this with fail2ban.  Client certs are a way to level this up even further but it's a bit of a hassle to set up.  Just basic_auth goes a very long way.
