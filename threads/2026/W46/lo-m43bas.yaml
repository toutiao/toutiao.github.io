    Hell yea. I love this question.
    It sounds like what you may want is "nobody can read my packets but me!" If that's the case I would look at the chain of things.

    you need to route traffic to the pi. DNS for translating the hostname to the static ip, and then some way to route on the internal network from the static ip to your pi.
    you need a valid key and certificate so the traffic you serve is recognized as secure to other browsers (keys and certs)
    you want tls, and to deliberately terminate tls somewhere you control

    These three are super intertwined, "self hosting" is choosing which of these you want to own.
    My personal favorite setup:

    rent a $5/mo box from any provider (anything works - vultr, linode, digital ocean, hetzner)
    use your pi to ssh to the box you rent, port forward 443 to your pi.
    run acme.sh on whatever is terminating tls (eventually your pi)

    I like this setup for a few reasons.

    This provides a static IP address you can point DNS records to. It also doesn't disclose where you live. You may or may not care about this. But it also means you spend more time learning about internet and less about fighting port forwarding on home networks.
    If your pi can touch the internet at all, it can find your box. this means you can duct tape your pi to a mint mobile hotspot and a solar panel and have your static site served anywhere there's sunshine. I always picture it baking in the sun on the cracked back dash of a 1996 Toyota Camry flying down the highway. I don't know why, it just makes me smile.
    Because you're using ssh, there's TLS over TLS. But that really doesn't matter. The point is that nothing between you and a user is visible to anyone but your pi. When you eventually move off of ssh port forwarding to something more stable nothing else changes.
    When your initially setting this up and debugging, anything you do on your pi you can do on the $5 box you're renting. It's a touch more stable, and closer to what someone will actually pay you to do some day.

    You may end up using nginx or haproxy somewhere to get ports to line up. But you can also use iptables. Dealer's choice.
    Tailscale and Cloudflare tunnels are really cool. They take a bit of the headache away, but you're right that they give up that bit of security (and the learning!).
    I'm so psyched for you :) let me know how it goes!
