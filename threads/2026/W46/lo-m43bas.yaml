    I'll tell you what I don't do: put everything behind Authelia (an authenticating web proxy) and put it on the public Internet. That should be secure but I just don't trust it. Some discussion here.
    So instead I have the Authelia reverse proxy but it's only on my tailnet. Everything's on the tailnet and I'm trusting a consumer NAT router (and the IPv6 equivalent) to keep people out. So far so good.
    My public stuff is all static files. I'm publishing static content: my weblog, book reviews, etc. So it's easy enough to generate a static set of HTML with some Javascript and call it a day. Doubly so now that AI is so good at writing static site generators.
