    out of the working repository, which makes them exactly as bad as the humans who
    originally wrote the code.<p>&gt; will always code at a lower level with the time
    passes<p>For humans, this is traditionally an anti-pattern. We are good at intuiting
    abstractions and knowing when to use them or climb up and down the abstraction
    hierarchy. For LLMs, this is also an anti-pattern, because going lower-level is
    an exponential waste of tokens; both for writing and reading the resulting code,
    which they do constantly in order to understand the project again and again in
    order to fulfill your prompts.<p>Thinking of human review as a &quot;bottleneck&quot;
    is incorrect framing. We are quality control. You can choose to cede quality control
    to LLMs and agent harnesses, that&#x27;s up to you. In my experience this generally
    leads to a meteoric rise in slop, because the tools increasingly resort to writing
    more code to solve a problem instead of updating existing code or writing the
    correct code. When I shake my head at some slop code, then read the slop comment
    that uses some slop justification that isn&#x27;t real and only existed in the
    prompt context, I am happy that I took the time to review it. Maybe that makes
