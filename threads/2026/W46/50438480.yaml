  text: The problem is that protecting children overzealously in the short term can
    make them more vulnerable in the long term. By attempting to protect them from
    every concievable risk, real or imagined, you risk preventing them from developing
    the defences that they will need later in life.<p>Traffic collisions and drowning
    are the major causes of death in children in developed countries; not childhood
