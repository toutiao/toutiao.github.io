  text: Most marketing for most things preys on guilt, fear, and avarice - negative
    emotions are uncomfortable, and you first create the negative emotion in the target&#x27;s
    mind, and then sell them the solution, to alleive their discomfort.<p>I was a
    kid who wandered. Sometimes through bear infested forests at night. Sometimes
    through abandoned factories with collapsing roofs. Sometimes to the homes of people
    my parents strongly disapproved of.<p>I lived. So did pretty much everyone else.
    I had a few significant fuck-ups. I learned from them, and didn&#x27;t repeat
    them. In my childhood, I knew one kid who died from misadventure - grain silo
    - and many who died from disease - meningitis, cancer, sepsis. Perhaps parents
    should keep their children in protective plastic bubbles, if they&#x27;re going
    to be consistent about it.<p>My kid - no tracking, and autonomy that I see makes
    other parents writhe with discomfort, as they&#x27;re like &quot;she&#x27;ll be
    stolen! Her kidneys!&quot;, and I&#x27;m going &quot;you guys don&#x27;t understand
    statistics, and your kids are going to live with you until you die, and lead stunted
    lives&quot;.
