  author: runako
  text: 'If a friend is posting a person&#x27;s location, they likely post other information
    about that person. The aggregate information could allow the assembly of a much
    more complete picture of a person than is possible by observing a person at a
    random juice bar.<p>For example: are they married? Do they live alone? Who are
    some of their friends? Where do they work? What do they do at work? Have they
    recently lost&#x2F;found&#x2F;experienced something interesting? These are the
