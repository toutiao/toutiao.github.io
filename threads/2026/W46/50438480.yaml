  author: ToucanLoucan
  text: It&#x27;s so wild to me as a millennial who grew up with a single mom who
    worked all day to see the obsession with child surveillance&#x2F;protection that
    permeates society today. When I was a kid, my mom required only that I let her
    know where I was gonna be, call her if those plans changed and let her know the
    new ones, and apart from that I was basically out the door by 7am and home for
    dinner, absent like sleepover plans or something. In the wintery months I was
    regularly gone for all daylight hours, and yeah she knew where I was, in theory,
    but I wasn&#x27;t wearing a GPS, and her up-to-date information on my place of
    being was strictly down to my communicating that info.<p>And this situation was
    not unique to me, my friends all had basically the same thing going on with minor
    differences. And like, I dunno maybe this is a reach, but these were the foundations
    that IMO made me a responsible human, who is able to move and function in the
    world autonomously, and it seems like newer generations of kiddos are really struggling
    with that in particular. Perhaps these are connected?
