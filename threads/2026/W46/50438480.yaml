    - that starts with _you_, car owners! - swimming lessons, and greater adult supervision
    when children are near water, are the most important things here, not surveillance.<p>When
    people do horrific things to children, it is almost never a stranger, but someone
    close to home, and again surveilling the child will not prevent that.
