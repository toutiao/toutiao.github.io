  author: ericmay
  text: "&gt; Capitalism is parasitic and it just increases wealth inequality.<p>Wealth
    equality isn&#x27;t a good goal. We shouldn&#x27;t all have the same wealth, same
    access to goods and services, or the same opportunities. Things can be <i>too</i>
    unequal, but they should at least be somewhat unequal. Equality in this context
    is tantamount to authoritarianism which we should probably avoid if we want to
    maintain liberal democracy.<p>&gt; Wealth inequality is getting completely out
    of hand. Raising a child is getting ridiculously expensive to the point where
    a cost of $500k-$1M per child is a significant factor of your lifetime earnings.
    You need a larger house too probably. At some point it becomes so expensive and
    consumes so much of your working life that fertility rates drop. That&#x27;s what&#x27;s
    happening now.<p>I know people in my own life who make less than $60,000&#x2F;year
    and have multiple children and even with state subsidies aren&#x27;t spending
    anywhere near that. The quoted figures ($500,000+) are inflated, and also reflect
    something akin to spending all of your money on the most expensive education,
    the latest toys, and all sorts of other things. Of course, if you&#x27;re a rich
    college graduate living in San Francisco and working at Google (and obviously
    completely out of touch) you might think figures like that are the norm or what
    one <i>must</i> spend. While you probably want to in order to give your child
    the best possible chance, it&#x27;s not strictly necessary and probably not necessary
    at all.<p>With that being said, cost is certainly a factor... cost of homes too
    (but we already know there are affordable homes all over the US so that&#x27;s
    less of a factor than reported), but those aren&#x27;t the only factors. Education
    for women, condoms and abortions, no real pressing need to actually have kids,
    &quot;travel&quot;, work and careers, all of those are factors too and the combination
    of them is probably what is driving us toward having fewer children. We simply
    have better things to do and plenty of surrogates like dogs and social media that
    keep people satiated.<p>&gt; Even the idea that everybody has a 401k&#x2F;HSA
    is incorrect [1].<p>I didn&#x27;t write that everyone has a 401k. But now that
    I think about it you also would include state assistance like food stamps or other
    such programs.<p>&gt; As for South Korea, what&#x27;s the reason to describe the
    population as &quot;homogenous&quot;?<p>The population is 95% Korean, that&#x27;s
    why. Problems and issues that occur there, and remember it&#x27;s also a country
    with a population of California living in a state the size of Indiana, are not
    exact mirrors of problems in the US with respect to birth rates. For example,
    we can simply import people. Korea can&#x27;t.<p>You even point this out yourself
    with your description of South Korea. I&#x27;m not sure how accurate your depiction
    is, but that&#x27;s not something you could accurately apply to the United States,
    ergo the reasons for declining birth rates aren&#x27;t the same across all countries.<p>&gt;
    I&#x27;m sorry but that&#x27;s just tradwife alt-right propaganda.<p>&gt; My spider
    sense is tingling.<p>I&#x27;m just going to ask nicely this one time to please
    not engage in this kind of rhetoric if you&#x27;d like to continue having a discussion."
