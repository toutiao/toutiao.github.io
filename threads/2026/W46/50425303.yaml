  author: pbalau
  text: 'I&#x27;d wagger because the story works on multiple levels and some characters
    are quite multidimensional.<p>Take the main bad guy, Immortan Joe.<p>On one hand,
    he gate keeps access to water, he keeps sex slaves and he doesn&#x27;t blink sending
    his War Boys to die.<p>On the other hand, there is nothing in the film pointing
    to there being a large reservoir of water, yet he does share some with the people
    around his citadel. He is also portrayed as quite sick and having only two surviving
    children: a deeply physically flawed one and a dimwit (and they made this one
    a pedo in the prequel). Maybe all he wanted was a sane and healthy offspring to
    eventually take over in running the community he built.<p>There is quite a bit
    more to talk about, like the war boy&#x27;s arc, or the lack of gratuitous sexiness,
    or how Max is not that relevant for the entire story, but I believe this film
    works so well is because it gives so many opportunities to overthink things and
    that&#x27;s always a fun thing to do.'
