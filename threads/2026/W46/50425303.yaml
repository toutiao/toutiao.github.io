  text: "&gt; When I&#x27;m thirsty, I walk over to the tap and pour myself a glass
    of water. Virtually no uncertainty over if I&#x27;ll then keel over and die from
    pathogens in the water, and no crisis of typhoid or cholera or diptheria where
    I live in living memory.<p>And do people &quot;outside the modern developed world&quot;
    perceive that as &quot;crisis and uncertainty&quot; or &quot;just another Tuesday&quot;?<p>&gt;
    I think people underestimate the depth of crisis and uncertainty that exists outside
    the modern developed world.<p>Crisis isn&#x27;t defined by parachuting in a person
    from a Western developed country, and seeing how they feel about living in those
    conditions. It&#x27;s a subjective feeling based on what you&#x27;re used to.<p>I
    think the GGP is wrong, and the &quot;people always have more babies in crisis
    and uncertainty&quot; is not a reaction to &quot;crisis and uncertainty,&quot;
    it&#x27;s a <i>side effect</i> of move primitive technological conditions, not
    some kind of conscious or unconcious reproductive strategy."
