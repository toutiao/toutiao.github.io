  author: jmyeet
  text: This depends heavily on what time frame you&#x27;re talking about.<p>For much
    of history people would often have children to work on farms and support the parents
    when they&#x27;re older. Sometimes this support system was nuclear. Sometimes
    it was broader in society. So how do you account for &quot;expensive&quot; here?
    I honestly don&#x27;t know.<p>But a lot of people focus on more modern times,
    particularly post-WW2, because the trend here is pretty much straight up. Education,
    housing and medical expenses have far exceeded inflation and real wages.<p>In
    more developed Asian countries (eg South Korea, Japan, China) the number of children
    has gone down in part because it is so expensive. In South Korea, so much is spent
    on tutoring to get into a good university to get a good job. The entire family&#x27;s
    income is devoted to that. In China, for a man to be marriageable he often needs
    to pay the bride&#x27;s family, have property, have a good job and so on. China
    has actually tried tackling some of this by popping the real estate bubble and
    outlawing private tutoring. Still, competition is intense and the bride price
    is still very real.<p>I think about the Fermi Paradox. What if the answer to why
    there are no galactic civilizations is as simple as &quot;because capitalism&quot;?
    Birth rates in developed countries are generally falling off a cliff as the barrier-to-entry
    gets increasingly higher.
