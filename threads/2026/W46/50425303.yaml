  author: AnimalMuppet
  text: "&gt; Functional human extinction in 120 years, absolute human extinction
    in 350 (or fewer).<p>I would <i>love</i> to see your basis for claiming this,
    because I don&#x27;t believe a word of it.<p>My personal take is that, as population
    declines, we eventually won&#x27;t be able to produce birth control pills (or
    plastic, if you believe that microplastics are the cause).  A couple generations
    after that, the population decline will halt.<p>&gt; Technological stagnation
    (no new advancement) in fewer than 50.<p>This I could at least see.  Society requires
    a certain level of specialization in order to advance, and that requires a certain
    number of people.  More technologically advanced societies may get by with fewer
    people, but there&#x27;s still a lower limit, below which technological progress
    halts (or at least massively slows down)."
