  author: throw0101c
  text: 'Not single-continuous takes:<p>&gt; <i>However, the commonly reported statement
    that the action scenes are continuous shots[53] is not entirely true. Visual effects
    supervisor Frazer Churchill explains that the effects team had to &quot;combine
    several takes to create impossibly long shots&quot;, where their job was to &quot;create
    the illusion of a continuous camera move&quot;. Once the team was able to create
    a &quot;seamless blend&quot;, they would move on to the next shot. These techniques
    were important for three continuous shots: the coffee shop explosion in the opening
    shot, the car ambush, and the battlefield scene. The coffee shop scene was composed
    of &quot;two different takes shot over two consecutive days&quot;; the car ambush
    was shot in &quot;six sections and at four different locations over one week and
    required five seamless digital transitions&quot;; and the battlefield scene &quot;was
    captured in five separate takes over two locations&quot;.</i><p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Children_of_Men#Single-shot_sequences"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Children_of_Men#Single-shot_se...</a>'
