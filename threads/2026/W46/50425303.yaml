  author: rglullis
  text: This is not what I&#x27;m arguing.<p>Of course authors will inject their worldview
    into what they create. Of course stories will reflect fundamental aspects of humanity,
    and with that how people (and groups of people) relate to one another. This is
    all valid.<p>&gt; Sometimes in the context of the modern day<p>The problem is
    that writers nowadays write *only* for the &quot;modern day&quot;. Everything
    becomes &quot;social commentary&quot; for $CURRENT_THING, which means that the
    story becomes stale the moment that the powers-that-be move on and $CURRENT_THING
    stops being a thing.<p>Good stories are perenial and worthy of be retold, no matter
    who is in power at any given moment. &quot;Malcolm in the Middle&quot; is a TV
    show that has things that working class families can relate, no matter if they
    are living in 2006, 2026 or 2056. &quot;The Wire&quot; is a show with very clear
    social commentary, but the same story would be told whether you had a Democrat
    or a Republican in the White House. &quot;The Boys&quot; was a show that started
    with a perenial premise (what if gods were just as broken as humans) and by the
    third season it turned itself into a caricature of Trump&#x27;s America. Guess
    which ones from these will be talked about 25 years from now, and which one is
    pretty much forgotten already?
