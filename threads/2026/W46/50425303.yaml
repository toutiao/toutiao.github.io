  text: '&gt; Babies have always been expensive.<p>They have always been expensive,
    and they have never been as expensive as today.<p>More than any other resource,
    babies require time. Talking purely from a US perspective, inflation adjusted
    income has never been higher.<p><a href="https:&#x2F;&#x2F;fred.stlouisfed.org&#x2F;series&#x2F;mehoinusa672n"
    rel="nofollow">https:&#x2F;&#x2F;fred.stlouisfed.org&#x2F;series&#x2F;mehoinusa672n</a><p>When
    we earn more, the time spent to care for a baby &#x27;costs&#x27; more because
    it&#x27;s time not spent working. It&#x27;s time not spent continuing your education.
    It&#x27;s time not spent doing some expensive bougie luxury like paying someone
    else to cook you a meal.<p>It&#x27;s a similar reasoning as to why working hours
    have only dropped a bit. When we earn more per hour, we can afford the same quality
    of life with fewer hours worked. However it also means each hour we choose not
    work is costing us more in opportunity cost. So we choose to work more.<p>Still,
    considering how many years we spend in education with little to no employment,
    and how many years we are currently able to live after we have retired, the %
    of our lifetime spent working has never been lower.'
