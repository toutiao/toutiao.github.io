  author: ericmay
  text: "&gt; Yes, anything you buy or own is a product of someone&#x27;s labour.<p>That&#x27;s
    not strictly true but I digress<p>&gt; Economic systems need to be designed around
    this fact, it can&#x27;t be hidden forever. When there&#x27;s a shortage of labour
    there will be a shortage of products, full stop. Yet the system pretends that
    we can all just do nothing and live on saved money.<p>Well I think in the case
    of markets they are actually designed around that fact. That&#x27;s why we invented
    things like coinage and banks. If there&#x27;s a labor shortage there isn&#x27;t
    necessarily a shortage of products, that&#x27;s a misunderstanding of economics.
    If there&#x27;s a labor shortage we either raise prices to reflect the change
    in availability (or conversely we lower them), or we automate. The system as it
    exists today allows you to transform <i>your</i> labor into other productive uses.
    When you&#x27;re old your labor probably isn&#x27;t very productive, in a manner
    of speaking capital markets allow you to save that labor in a way that you can
    use later via dividends, stock investments, bonds, things like that."
  score: 0
