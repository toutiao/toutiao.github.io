  text: "&gt; Wealth equality isn&#x27;t a good goal. We shouldn&#x27;t all have the
    same wealth<p>After reading the first sentence I immediately the knew the second
    sentence was coming. It&#x27;s a common tactic. It&#x27;s called a <i>false dichotomy</i>
    or <i>false dilemma</i>. It&#x27;s the product of American post-WW2 Red Scare
    propaganda.<p>We don&#x27;t need <i>absolute</i> wealth equality. But we do need
    to guarantee a sufficient baseline for everyone, which is not that much really.
    It&#x27;s access to adequate housing and food, health care and education in the
    wealthiest country in the world.<p>&gt; ... cost of homes too (but we already
    know there are affordable homes all over the US so that&#x27;s less of a factor
    than reported),<p>This is just wrong. You need to live where the jobs are. The
    fact that there are shacks in West Virginia for $20,000 does not negate the argument
    that there is a housing affordability crisis.<p>Also, there are a whole bunch
    of jobs that need to get done for society to function from picking up the trash,
    fixing the drains&#x2F;sewers, paving the roads, working in hospitals (from orderlies
    to doctors), teaching the children and so on.<p>All of those people need to be
    able to afford to live where their services are required. The San Francisco Bay
    Area is an extreme example of how just bad this situation is. There are stories
    going back over a decade of the people who drive the buses from SF to the SFBA
    tech campuses who have to live 2-3 hours away. It doesn&#x27;t have to be that
    way. It shouldn&#x27;t be that way.<p>&gt; you also would include state assistance
    like food stamps or other such programs.<p>Walmart employees receive a huge chunk
    of food stamps. Those food stamps are then often used at Walmart. Why exactly
