  author: cowlevel
  text: Capitalist markets do not allow you to <i>store</i> labour. Instead they allow
    you to <i>exchange</i> labour in one time period for labour in another, usually
    at a rate that&#x27;s favourable to the earlier period, Ponzi-style. Also like
    Ponzi, the whole thing collapses once the amount of labour that&#x27;s owed in
    a time period exceeds the amount that&#x27;s actually available.
