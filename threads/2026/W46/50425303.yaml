  author: julianpye
  text: 'I went to the Biennale in Venice last weekend and thought about the movie
    intensely after visiting the Japanese pavilion. If you don&#x27;t know about it
    - the Biennale features artists representing specific countries as they transform
    a fixed pavilion building into their vision. When you walk across the Giardini
    site, you walk through themes of the globe. Often these themes are overly political
    and identity-themed, but the simplicity of the Japanese pavilion this year was
    refreshing.<p>This year the Japanese pavilion was full of 11lb baby dolls, which
    a user could adopt and walk around with and interact with in changing stations
    and sleep and play areas. The intro said: &quot;Babies are born anywhere, regardless
    of wars, terrors, and boycotts.&quot; It made me think how they used to be everywhere
    and now that birth rates have declined significantly they have become rare, expensive
    and often parents handle them like some luxurious pet, when they should be &#x27;renewables&#x27;
    of ourselves.'
