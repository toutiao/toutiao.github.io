  author: hmstx
  text: "I imagine you are vaguely familiar with subtractive synthesis; oscillators,
    filters, envelopes, modulation. It wouldn&#x27;t hurt, although the building blocks
    are laid out differently in an FM synth.<p>Anyway, I found these hands-on demos
    on the DX1 to be some of the most &quot;aha&quot; moments I&#x27;ve had trying
    to understand how FM patches are made.<p>TLDR, an FM &quot;operator&quot; is an
    oscillator. A <i>carrier</i> is the oscillator you hear, its <i>modulator</i>
    is an oscillator that wiggles the carrier and brings out different harmonics.
    You can stack more modulators and you can have multiple carriers going in parallel,
    the various combinations of operators available in a synth being the different
    <i>algorithms</i>.<p><a href=\"https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=YV9vQGqoO5c\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=YV9vQGqoO5c</a><p><a
    href=\"https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=k0xGyR_lKoM\" rel=\"nofollow\">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=k0xGyR_lKoM</a><p><a
    href=\"https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=1-boGIxRZ_s\" rel=\"nofollow\">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=1-boGIxRZ_s</a><p>There
    was also one from Venus Theory about how to get <i>musically useful</i> stuff
    out of frequency&#x2F;phase modulation: \n<a href=\"https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=wqc8rZnzTVI\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=wqc8rZnzTVI</a>"
