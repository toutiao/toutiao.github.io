    First they killed Safe C++ im such a toxic way that Sean decided to not touch the topic again

    I wasn't part of any discussion of that with Sean, but the problem I never saw resolved for Safe C++ was any implementable semantics for the borrow checker.  I really want C++ to get something that can be used to check borrowing at compile time but the Safe C++ approach did not document an algorithm for doing so.
    It is fine for Rust to say that safe borrows are whatever this week's rustc is able to prove are safe and rustc tests on every cargo crate so rustc n+1 should accept all correct programs that rustc n accepted.  It is not okay for a language specified by an ISO standard with multiple implementations to say the same.  We need the specification to define the list of programs that any compliant C++29 compiler will accept and the set it will reject.  If GCC's borrow checker can handle some cases that Visual Studio and Clang's can't, Clang's can handle some that GCC and VS can't, and VS can handle some that GCC and Clang can't, that's a mess.  No one can write C++ code in that world.
    For a proposal with a borrow checker to be considered by WG21, it needed to define what the borrow checker did in such a way that VS, Clang, and GCC programmers can all implement the algorithms and ensure that they accept and reject the same set of programs.  And Safe C++ did not do that.
