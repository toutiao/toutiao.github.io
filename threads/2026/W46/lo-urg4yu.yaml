  author: bitshift
  text: |-
    Let's say your passphrase is eight random words (~12 bits of entropy each), and you store four of those words on the remote server. Your passphrase has 96 bits of entropy total, which should be sufficient for an encryption key. But if you already know half of the passphrase, the unknown half only has 48 bits of entropy, and a motivated attacker could brute-force that. (See also: EFF's custom DES cracker brute-forces 56-bit keys.)
    One threat model is someone getting their hands on your powered-off home server. If I understand ZKeys correctly, half of your passphrase is stored unencrypted on your home server, and the other half is known by the ZKeys server (but is inaccessible to the attacker). So the attacker reads half of the passphrase from local disk, brute-forces the other 2^48 possibilities for the other half, and decrypts your hard drive.
    I think @cyberia's suggestion of an XOR one-time pad is the correct thing to do here. One half tells you no information about the other, so you are protected by the whole undiluted strength of your passphrase.
