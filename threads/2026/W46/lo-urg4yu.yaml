  text: |-
    Right, that makes sense.
    I'm writing an end-to-end encrypted app right now (for fun), and I solved a similar problem by having the server keep an HKDF-derived hash of the password, to compare against a client-provided hash for authentication.
    My flow goes:

    Client uses scrypt to derive some bits (D) from their password
    Client computes an authentication key A = HKDF(D, "authentication") and an encryption key K = HKDF(D, "encryption")
    Client submits A to the server (over HTTPS)
    Server compares A with a stored, known value
    If successful, server returns encrypted content (C) to client
    Client computes Decrypt(K, C) to get the decrypted data.

    That way you can use the same password for auth and decryption, but HKDF gives you the guarantee that the server can't get the decryption key from the auth key.
