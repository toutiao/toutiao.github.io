  content: "Do you run a small home server or NAS holding your precious photos and
    sensitive documents? If so, I suppose the drives are encrypted, right? But then&mldr;
    can you reboot the machine without manually entering a passphrase before being
    able to access your files again?\n\nIf you answered yes to the questions above—which
    is common for convenience—that implies the encryption keys live in the machine
    which&mldr; kinda defeats the purpose of disk encryption, doesn’t it? A thief
    can break into your house, lift the whole box (they are small these days, huh),
    plug it in elsewhere, and gain free rein over your files.\n\nSo, which one is
    it? Simplicity and reliability by allowing automatic reboots or data protection
    by keeping the key in your head? With ZKeys—a little new project I’m launching
    today—you can have your cake and eat it too.\n\nA blog on operating systems, programming
    languages, testing, build systems, my own software projects and even personal
    productivity. Specifics include FreeBSD, Linux, Rust, Bazel and EndBASIC.\n\n[![Follow
    @jmmv on Mastodon](/images/badges/mastodon-logo.svg)](https://mastodon.online/@jmmv)[![Follow
    @jmmv on Twitter](/images/badges/Twitter_logo_blue.svg)](https://twitter.com/intent/follow?original_referer=https%3A%2F%2Fjmmv.dev%2F&screen_name=jmmv)[![RSS
    feed](/images/badges/feed-icon-28x28.png)](/feed.xml)\n\n# TL;DR\n\nZKeys is a
    managed service that stores encryption passphrases off-site. Client machines fetch
    the encryption keys from the service and keep those keys alive (unlocked) via
    periodic keepalive messages.\n\nIf the server stops receiving those messages for
    a long period of time (e.g. because it has been unplugged as part of theft), access
    to the key is automatically locked. You get automatic, passwordless reboots while
    keeping your data protected against real incidents.\n\n# Storytime\n\nAbout a
    year ago, I was reinstalling my FreeBSD home server to act as my NAS after a [short
    stint with a Synology box](/2024/12/synology-ds923-vs-freebsd.html). During that
    process, I decided to enable encryption for the ZFS data pool. But as I did that,
    I faced the question: how do I allow the machine to automatically serve my data
    after a reboot? I could put the key in a local file, which FreeBSD supports via
    the `keylocation` ZFS option, but that would render disk encryption pretty much
    useless.\n\nSo I had an idea: what if I put the key on a _different_ machine away
    from my house? I could then make the NAS fetch the key to mount the drives. And
    if someone stole the server, I could wipe the remote key and make the data unreadable
    _before_ they could plug it back in. I did post this to Twitter and there was
    some interest in the idea:\n\n> Silly or smart? I wrote a startup rc.d script
    to automatically mount my encrypted ZFS pool by fetching the key from a remote
    server. What I want to protect against is the \"drives stolen from home\" case.
    If that happened, I could quickly remove the key. https://t.co/eZle2nJlXW\n> \n>
    — Julio Merino (@jmmv) [September 7, 2025](https://x.com/jmmv/status/1964517899101725041?ref_src=twsrc%5Etfw)\n\nBut&mldr;
    did you notice the problem with what I said above? Wiping the key by hand after
    noticing something is wrong is problematic because the gap between those two events
    may be large. What if I’m on a long vacation and I have no means of noticing that
    the machine has been stolen? Game over.\n\nSo I refined the idea: what if I had
    a _service_ that stored the key remotely and required the consuming machine to
    send it frequent pings to keep the key unlocked? This way, if the machine were
    stolen, it’d likely be offline for more than a few minutes and the service could
    automatically determine that something is wrong and lock the key from future accesses.
    And that’s precisely what ZKeys does.\n\n# Zero-knowledge protection\n\nBefore
    getting into details, it’s important to get something out of the way early on:
    ZKeys is designed so that a compromise of the server is insufficient to retrieve
    or reconstruct your keys. This is done in two ways:\n\n- **Split keys:** The ZKeys
    server only stores _half_ of the passphrase used to unlock a volume. The other
    half remains on the client machine. The `zkeys` client program combines both halves
    to produce the whole passphrase.\n\n- **Encryption at rest:** The keys are encrypted
    at rest with a password that the `zkeys` client must supply for retrieval and
    which is securely transmitted over HTTPS. The password only lives in the server’s
    memory for a brief period of time.\n\nThe tradeoff is, simply, that you MUST back
    up the full encryption keys in a third location of your own (a paper in a safe,
    a password manager, you name it). If ZKeys goes down or you lose your remote key
    password, there is absolutely nothing I can do to help you. _You have been warned._
    The setup instructions later on will instruct you how to back the key up.\n\n#
    Installation and setup\n\nThe ZKeys service is available at [https://zkeys.jmmv.dev/](https://zkeys.jmmv.dev/)
    and the open-source client—along with system integrations for FreeBSD and Fedora—is
    in my [`jmmv/zkeys`](https://github.com/jmmv/zkeys/) repository.\n\n> Disclaimer:
    ZKeys is offered to you for free. I make no promises about its reliability, availability,
    or anything else. I am giving you access because I expect that supporting a handful
    of extra users won’t be a big issue. But if support becomes a burden, or if load
    becomes unmanageable, I’ll have to re-evaluate my choices here. Which means that,
    for now, you have to use the limited `LAUNCH50` code to get started!\n\nThe basic
    idea to set ZKeys up is the following:\n\n1. Install the `zkeys` client CLI tool.\n2.
    Create a service account.\n3. Create a new key (or onboard an existing key).\n4.
    Configure the keep-alive service on the target machine.\n5. Change or add the
    filesystem encryption key to be the one stored in ZKeys.\n6. Configure the auto-mount
    service on the target machine.\n7. Reboot!\n\nThat’s all it takes, but the steps
    are quite manual at the moment because no upstream OSes provide packages. The
    [service documentation](https://zkeys.jmmv.dev/#/docs) covers several scenarios
    in detail for FreeBSD and Fedora, so I’m not going to repeat them here.\n\n_Demo
    of the integration between ZKeys and Fedora 44 with a fully encrypted root volume:
    the video starts by showing a fully unattended boot, followed by a manual lock
    of a key that causes Fedora to refuse to reboot on its own, and finishes with
    another automatic reboot after the key has been unlocked again._\n\n# Behind the
    scenes\n\nNow for the nerdy details, because that’s what you’re here for:\n\n-
    The CLI is Rust, of course, but it has to come with a bunch of shell scripts to
    integrate with FreeBSD’s rc.d system and Fedora’s systemd and dracut. These integration
    points are the trickiest part of the client package and the hardest to validate
    automatically, which is why I only provide support for the two systems I use on
    a daily basis. It should be possible to integrate ZKeys with any other Unix-like
    OS, though.\n\n- The CLI package is a frankenmonster made up of Cargo and GNU
    Automake/Autoconf because of the above. I believe system-level tools should abide
    by de facto standard tooling even if such standard tooling is deficient, so GNU
    Autotools it is.\n\n- I run two non-replicated instances of the service: one in
    US West and one in EU West, because I have machines in both locations and both
    rely on encryption. I strongly suggest you use the US instance as I’m seeing frequent
    power hiccups in my EU deployment.\n\n- The frontend uses Bootstrap, straight
    from the 2010s. Does it look ugly? Maybe, but I kinda like it and, most importantly,
    it’s _functional_. Of course I could have asked AI to produce yet-another-dull-site
    full of gradients and slop, but I did not want to do that, so I stuck to what
    I already knew how to do by hand from previous services.\n\n- The admin page is
    an SPA, yes. This is an intentional design choice that forces a very clear separation
    between the backend APIs and the f"
