  text: |-
    Out of interest, how come the server decrypts the password-half that it keeps using the client-provided key, rather than just sending the encrypted data and letting the client handle the decryption? That way, the server would never touch the key or the raw password-half.

    That's a good question. The reason it's this way is because I wanted to protect key retrievals with a password (to prevent arbitrary access, but also to detect malicious retrieval attempts as shown in the dashboard), so the natural thing to do after that password already made it to the server was to reuse it for encryption/decryption of the server-side key. I definitely didn't want to store user keys unencrypted at rest.
    As a different option, I could return the encrypted blob to the client, but that'd no better because then the server would still see the password for a moment.
    Yet another option would be to have a different password on the client to handle key decryption, but that would adds extra complexity (we'd end up with a password for retrieval, a password for decryption, and a local half) and I'm not seeing much of a gain for that.
    Which leads to another completely different option: the "local half" could become the decryption key for the remote blob, instead of gluing together two halves. That would resolve this, but I kinda like the local/remote key separation + recombination that I have now because it's easy to reason about and convince yourself that the local portion was really generated locally and never left the machine.
