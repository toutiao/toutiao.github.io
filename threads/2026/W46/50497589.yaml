  author: VaibhaavTiwari
  text: 'I wanted to understand what actually makes DeepSeek V3 different, so I rebuilt
    its three main ideas from scratch in pure JAX: Multi-head Latent Attention, mixture-of-experts
    with bias-based load balancing instead of an auxiliary loss, and multi-token prediction.
    The model is about 190 lines.<p>It’s a 36.2M-parameter version trained on a MacBook
    Air M5 (24 GB) with jax-metal, on 207 old detective novels. 12,000 steps took
    about 2.6 hours.<p>Full write-up with diagrams and results: <a href="https:&#x2F;&#x2F;vaibhaav.in&#x2F;writing&#x2F;deepseek-v3-jax&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;vaibhaav.in&#x2F;writing&#x2F;deepseek-v3-jax&#x2F;</a><p>The
    trained checkpoint and exact data are in the v1.0 release, so you can generate
    text without training.<p>Would love corrections if I got anything wrong :)'
