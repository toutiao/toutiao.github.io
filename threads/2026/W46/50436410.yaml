    </code></pre>
    Still set to &quot;Allowed only while in use&quot;: Camera and WhatsApp<p>Activity controls<p>Web &amp; App Activity: turned off, but I did not delete the history<p>Timeline (Location History): was already off since January 1, 2025<p>YouTube History: left on<p>Personalized ads:<p><pre><code>  - My Ad Center is turned off
