  text: Wait for people to learn about that you can listen in virtually anywhere through
    fiber-optic cables, as sound waves are enough to  redirect the light in the cable
    to a measurable degree by &quot;bending&quot; the cable itself. Special devices
    to filter these variances out and transform them back to audio signals are a thing.
    It&#x27;s only per line though, as any repeating device will just output a new
    cleaned up signal again.<p>Oh well, there have always been ways to snoop on someone
    like that. Back in the day it was CRTs emitting measurable waves through the neighborhood,
    with some papers even going as far as restoring the displayed image through a
    wall. Nowadays it&#x27;s fiber and WiFi, and those seem to be much easier to work
    with even. Plus everyone carries a device that is tracked by their mobile provider&#x27;s
    cell network. <i>shrug</i>
