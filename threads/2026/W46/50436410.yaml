  author: guax
  text: I assume the problem is still tracing and association. So long as there is
    no direct link between you and the device, there is no saying if that is you or
    not. So grabbing a used phone via cash transaction from someone and only turning
    it on and using outside of your usual locations could be enough to have it being
    &quot;anonymous&quot;. Then, using a vpn or other proxy that hides your network
    can make you very hard to find, so long as you don&#x27;t associate with your
    real identity in any substantial form.<p>The danger with these technologies is
    not when they allow to precise track you once your general vicinity is known,
    that was always possible by putting some goons after you. General mass surveillance
    that is constantly tagged is the problem, flock, PRISM and the other stuffs.
