article:
  url: https://maurycyz.com/projects/fading/
  title: 'Your TV can see through walls:'
  fetch_status: success
  content: "# _Your TV can see through walls:_\n — \n\nThis is a spectogram of the
    signal from a local TV station:\n\n![A strong, unchanging signal](/projects/fading/spectro1.jpg)\n\nWalking
    between the receiver and TV station causes a slight disturbance to the signal,
    but it's nothing to write home about:\n\n![](/projects/fading/spectro2.jpg)\n\nFor
    this capture, I moved the antenna a few centimeters:\n\n![](/projects/fading/spectro3.jpg)\n\n_This
    is selective fading_: The direct signal is being canceled out by a strong reflection.
    Because the phase of the reflection depends on frequency, this effect is not uniform
    over the whole signal. Apart from being annoying if you're trying to watch TV,
    this state is extremely sensitive to any nearby movement.\n\nHere's what happened
    to the signal when I got up from my chair:\n\n![](/projects/fading/spectro5.jpg)\n\n...
    and here's me walking around in a neighboring room:\n\n![](/projects/fading/spectro4.jpg)\n\n_The
    gaps between the stripes_ happen when my reflection perfectly cancels out the
    residual signal, which happens each time the path length changes by one wavelength.
    Let's use this to figure out how fast I was walking:\n\nThe gap between each stripe
    is around 70 pixels, and the waterfall has an update rate of 150 Hz...\n\n    70
    pixels * 1 second/150 pixels = 0.47 seconds = 2.1 Hz\n    speed of light / 490
    MHz * 2.1 Hz = 1.3 m/s = 4.6 km/h\n\nI was walking perpendicular to the direct
    signal path, so the speed can be used as is, without any adjustments for geometry.\n\n_So,
    a simple radio reciever is able to detect motion and provide an estimated speed_—
    and it's not just TV that works for this: any wideband radio signal like WiFi
    or LTE can be used in much the same way. Those make worse demonstrations because
    they have a messy waterfall, but it's possible extract the [same data](https://en.wikipedia.org/wiki/Channel_state_information)
    with a bit of work.\n\nHappy paranoia!"
