  author: isityettime
  text: 'A lot of words in English are etymologically related but have grown significant
    connotative or denotative differences since the root word was reintroduced to
    the language by another path.¹ &quot;Complex&quot; and &quot;complicated&quot;
    are just such a pair. They are not the same word.<p>In this case you can think
    of &quot;complex&quot; as referring to essential complexity and &quot;complicated&quot;
    as referring to incidental complexity.<p>----<p>1: See also, for example: &quot;intention&quot;
    vs. &quot;intension&quot;, &quot;chief&quot; vs. &quot;chef&quot;, &quot;hotel&quot;
    vs. &quot;hostel&quot;, &quot;corpse&quot; vs. &quot;corps&quot;, &quot;compliment&quot;
    vs. &quot;complement&quot;, etc. Sometimes related pairs do the opposite, entering
    with distinct denotations and developing overlapping ones e.g., &quot;intellect&quot;
    vs. &quot;intelligence&quot;. Some transitionsl ones still include overlap but
    have had specialized senses come to dominate, e.g., &quot;dispositive&quot; vs.
    &quot;dispositional&quot;. In that last case, the special legal sense of &quot;dispositive&quot;
    came to dominate the word (or the other senses became archaic) in a way that &quot;made
    room&quot; for the more general &quot;dispositional&quot; to enter the language.)<p>If
    you wanna get your head around English (or probably any language), the intuition
    that alerts you to related words is a very useful sensitivity, but you have to
    learn to absolutely resist the temptation to treat etymologically related words
    as identical. It&#x27;s just not how language works.<p>English seems like it might
    be especially rich with these &quot;etymological doublets&quot; (thanks ChatGPT,
    for teaching me this word today). They&#x27;re really useful for capturing distinct
    shades of meaning between closely related concepts, which is exactly what they
    do in this adage from Tim Peters.'
