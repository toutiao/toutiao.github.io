  author: mmooss
  text: '&gt; it’s the same word!<p>I guess if you take the square root of -1 you
    do get a <i>complicated</i> number, but it&#x27;s a complex one. And then there&#x27;s
    the complication for modern democracy called the military-industrial complex,
    and Oedipus&#x27;s complex certainly complicated things. Then there&#x27;s <i>Ghost
    in the Shell: Standalone Complex</i>, but I&#x27;m not really sure what that means.<p>Seriously,
    here&#x27;s the best summary I can quickly find: [0]<p><i>&quot;Complicated problems
    can be hard to solve, but they are addressable with rules and recipes, like the
    algorithms that place ads on your Twitter feed. They also can be resolved with
    systems and processes, like the hierarchical structure that most companies use
    to command and control employees.</i><p><i>... Complex problems involve too many
    unknowns and too many interrelated factors to reduce to rules and processes. A
    technological disruption like blockchain is a complex problem. A competitor with
    an innovative business model — an Uber or an Airbnb — is a complex problem. There’s
    no algorithm that will tell you how to respond.</i><p><i>This could be dismissed
    as an exercise in semantics, except for one thing: When facing a problem, says
    Nason, managers tend to automatically default to complicated thinking. Instead,
    they should be “consciously managing complexity.”&quot;</i><p>Those are very different
    problems for software development too, and many in IT definitely try to treat
    every problem as <i>complicated</i>.<p>[0] <a href="https:&#x2F;&#x2F;sloanreview.mit.edu&#x2F;article&#x2F;the-critical-difference-between-complex-and-complicated&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;sloanreview.mit.edu&#x2F;article&#x2F;the-critical-difference-...</a>'
  score: 0
  posted_at: '2026-11-11T23:54:30Z'
- id: '50460801'
  parent_id: '50458818'
  author: kstrauser
  text: A complication on a wristwatch is anything other than telling time. Phases
    of the moon? Tides? Calendars? Complications. They make the innards more complex
    and fragile and difficult to build and repair. Complexity is the inherent difficulty
    in building the thing.<p>Together, what that&#x27;s saying is that sometimes the
    minimal baseline complexity is going to be pretty high. If you&#x27;re making
    a library to support all of HTTP&#x2F;2, it&#x27;s going to have lots of codepaths,
    and that&#x27;s unavoidable. It&#x27;s a complex problem requiring a complex solution.
    But consider SMTP, the &quot;simple&quot; mail transfer protocol. The protocol
    itself is stupidly simple. I can use — and have used — telnet to port 25 to send
    email. But because the protocol is so simple, implementing it is extremely complicated.
    Were the protocol a little more complex, the implementations could be vastly simpler.<p>Or
    perhaps more simply, if you&#x27;re writing a textual protocol, define it as using
    UTF-8 encoding and move on. UTF-8 is more complex than simpler encodings like
    ASCII. Allowing your clients and servers to decide that they&#x27;d rather support
    something goofy, like Shift JIS or UTF-16, just makes everything vastly more complicated.
    Accept that the complexity of UTF-8 is inherent and sufficient, pay the cost,
    and then let all of your consumers be much simpler.
