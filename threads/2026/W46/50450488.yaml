  text: "As a greybeard (literally) of the industry, I&#x27;ve reached the age where
    the people who shaped my younger years, and much of the computing world around
    me, are slowly being piped to &#x2F;dev&#x2F;random.<p>It&#x27;s sad to hear,
    but reflecting on the impact Tim made brings some comfort. Most of us will never
    know how many people our work helped. Tim could at least see some of that, though
    even Python&#x27;s reach can only tell part of the story.<p>Reading the tributes
    (<a href=\"https:&#x2F;&#x2F;discuss.python.org&#x2F;t&#x2F;in-memoriam-tim-peters-1952-2026&#x2F;110028\"
    rel=\"nofollow\">https:&#x2F;&#x2F;discuss.python.org&#x2F;t&#x2F;in-memoriam-tim-peters-1952-202...</a>),
    what strikes me is how often people mention his patience and humour alongside
    his technical brilliance. There&#x27;s something to aspire to there: doing good
    work, and taking the time to help others do theirs.<p>The older I get, the more
    I appreciate what it takes to leave both kinds of legacy.<p>Quiet lines of code
    \ \nStill guide the hands of strangers  \nHis kindness lives on<p>Rest well, Tim."
