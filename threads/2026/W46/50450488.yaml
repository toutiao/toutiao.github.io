  author: mmooss
  text: We are naive when we think, as we all do at times, that humans in our &lt;group&gt;
    differ from the others -  that we have no politics or biases and aren&#x27;t affected
    by those things, and we form some just, meritocratic ideal.<p>When we find ourselvees
    thinking that, then we are part of the status quo - the system is designed to
    suit us. It&#x27;s very easy to think that status quo is the entire universe;
    just keep doing what you&#x27;re doing. Instead, to avoid perpetuating the bad
    aspects of the system, it&#x27;s essential to curiously and closely look for its
    boundaries, look outside it, notice the humans out there who are not being served,
    who may express unhappiness.<p>Take them at their word; they may seem absurd,
    but that&#x27;s your human response to someone violating norms - the norms being
    the status quo. Their expression may include being disruptive or unpleasant. &#x27;Disrupt&#x27;
    means &#x27;violate the status quo&#x27;; it shows you the status quo&#x27;s limitations.
