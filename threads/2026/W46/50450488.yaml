  author: ofek
  text: 'Tim was one of the people who contributed to my love of the Python language
    eventually expanding to its entire community.<p>He was always so willing to foster
    discussion that nearly every interaction resulted in an improved understanding
    of some topic and a shared eagerness to try or learn more out something tangential
    that came up via digression. I never knew how many types of voting systems there
    were nor how extensively they are researched! He also reached out about a comment
    [0] I made a few years ago which made me feel less discouraged and more welcome.<p>Tim&#x27;s
    writing style was greatly appreciated by myself and many others. What he had to
    say was often lengthy, to address reader assumptions or some nuance, but was written
    with such a jovial tone that it was rarely dull or inaccessible.<p>RIP Tim<p>[0]:
