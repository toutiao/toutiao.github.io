  author: lumpa
  text: 'Once upon a time I used to read all python-dev posts and bugs.python.org
    issues, so I got to follow (and get a feeling of knowing) these people I admired
    working and discussing together. Tim was always a favorite.<p>Another thing that
    made me feel close to him was his work on the Python Cookbook 2nd Edition, in
    which he (and other big names in the community) delightfully talks the reader
    through intricacies and insights of programming, &quot;We read Knuth so you don&#x27;t
    have to&quot;.<p>Watching Tim do his thing was a pleasure. He&#x27;d go from long,
    deep technical dives (that he&#x27;d make as approachable as possible) into comic
    relief and human connection in the fractional wink of an eye.<p>The brief interactions
    we had will always be cherished as high points in my Pythonista trajectory.<p>One
    favorite of mine was this response: <a href="https:&#x2F;&#x2F;www.python.org&#x2F;doc&#x2F;humor&#x2F;#id15"
    rel="nofollow">https:&#x2F;&#x2F;www.python.org&#x2F;doc&#x2F;humor&#x2F;#id15</a>.
    I also like <a href="https:&#x2F;&#x2F;www.python.org&#x2F;doc&#x2F;humor&#x2F;#id19"
    rel="nofollow">https:&#x2F;&#x2F;www.python.org&#x2F;doc&#x2F;humor&#x2F;#id19</a>
    very much.'
