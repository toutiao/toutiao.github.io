  author: dalke
  text: 'In the 1990s I was a novice developer, though I considered myself a hotshot
    because I was better than those around me in college and grad school.<p>I was
    an active participant in the comp.lang.python Usenet channel in the late 1990s.<p>I
    learned much from reading Tim Peters&#x27; posts. To many, including me, he was
    affectionately referred to as &quot;Uncle Timmy.&quot;<p>One of the things I learned
    was that I still had much to learn about the art of programming.<p>Much of the
    little I know about numerical methods comes from reading his posts. It was fun
    to read his stories about Kendall Square Research and the (for me) old days of
    computing.<p>I remember posting questions about things I didn&#x27;t understand,
    which he figured out and explained. [1]<p>I remember bringing up concepts I thought
    were specialized and esoteric, only to find that it was actually just my lack
    of experience. He gently corrected misapprehensions like mine. [2]<p>He wrote
    a lot on comp.lang.python. If I recall correctly, at the 7th International Python
    Conference in Houston, November 1998, there was Festschrift in his honor. He would
    use &lt;wink&gt; in his messages, and often end with something like &quot;let&#x27;s-hear-it-for-lambda-in-curly-assignment-stmts-ly
    y&#x27;rs - tim&quot; (that&#x27;s from the posting where he outlines the Zen
    of Python). I wondered if they were collected by looking for messages containing
    an &#x27;-ly&#x27; only to have Andrew Kuchling remind me about the &quot;From&quot;
    header. &lt;wink&gt;<p>Here is Guido van Rossum starting the thread on &quot;In
    Memoriam: Tim Peters&quot;, at <a href="https:&#x2F;&#x2F;discuss.python.org&#x2F;t&#x2F;in-memoriam-tim-peters-1952-2026&#x2F;110028"
    rel="nofollow">https:&#x2F;&#x2F;discuss.python.org&#x2F;t&#x2F;in-memoriam-tim-peters-1952-202...</a>
    .<p>Here&#x27;s an interview of him at PyCon 2006, <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=1wAOy88WxmY"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=1wAOy88WxmY</a><p>[1]
    In one case, I was parsing a file format where a field was usually three spaces,
    but was sometimes an integer. I couldn&#x27;t figure out why one parser was so
    much faster than the other. The answer was that one tested for three spaces first,
    and if that failed tested for the int, while the other did the int test first.<p>Yes,
    this is something a senior developer knows. I bring it up now to highlight how
    hotshot-me didn&#x27;t have that experience, learned that experience, and learned
    it from someone who was kind about sharing his knowledge.<p>[2] I was doing bioinformatics
    back then, and learned about dynamic programming as way to do sequence alignment.
    I didn&#x27;t think others knew about the technique, and thought I was bringing
    esoteric new information to the discussion. Uncle Timmy had used dynamic programming
    techniques for speech-to-text software at Dragon Systems, and politely pointed
    out it was more widely known. He also implemented Python&#x27;s &#x27;difflib&#x27;.'
