  author: zestyping
  text: 'This will probably sound crazy to some of you, but I believe the introduction
    of the boolean type was a mistake.<p>Every primitive type has a null value, and
    the &quot;if&quot; statement tests for such a value.  Whether a value is true
    or false is a property of the value.  Notice that &quot;true&quot; and &quot;false&quot;
    are adjectives, not nouns.<p>That is a simple, internally consistent model with
    one concept of trueness.<p>The introduction of the boolean type made this a lot
    messier: it makes &quot;if&quot; look like type coercion, and introduces two different
    ways to think of boolean-ness (as an adjective or as a noun) which you must hold
    in your head at the same time.  For example, it became possible to compare things
    as equal to True or False, doubling the number of ways to express a condition:
    &quot;if x&quot; and &quot;if x == True&quot; are now very similar, but subtly
    different, ways to express the same thing.  The fact that we have to talk about
    things as &quot;truthy&quot; or &quot;falsy&quot; as if these were different from
    &quot;true&quot; and &quot;false&quot; is a further illustration of the mess this
    has created.<p>If we had stuck with 0 and 1, we would have avoided all this confusion.  It
    is imperfect but simple; what we ended up with is still imperfect and needlessly
    complicated.'
