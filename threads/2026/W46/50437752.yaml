    solar has both economic efficiency disadvantages (generally poorer siting, being
    dangerous and expensive to install) and advantages (no transmission losses, no
    added load on transmission and distribution systems, and in some cases elimination
    of inverters and other power electronics).  It isn&#x27;t clear to me whether
    it comes out to be overall more or less economically efficient, and I suspect
    that it probably depends on local circumstances, and especially on whether you
    can reduce or eliminate inverters.<p>However, the most persuasive case for rooftop
    solar is basically political rather than economic: it reduces or eliminates the
    building&#x27;s dependency on utility-scale generation, transmission, and distribution.  This
    dependency can bite in the form of unreliability (like California&#x27;s intentional
    power outages during the now-yearly summer brushfire season, or the &quot;load
    shedding&quot; rolling blackouts South Africa had for several months last year),
    in the form of extortionate energy prices due to monopoly rent extraction (California
