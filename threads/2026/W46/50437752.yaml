  text: You have some good points, but I think there are some flaws in them.<p>Heat
    pumps are probably now economic only in niche scenarios, even at current PV module
    prices; they cost dramatically more than the solar panels they displace.  And
    they&#x27;re really only applicable to climate control, not to other applications
    of heat, such as cement kilns, electric arc furnaces, or baking bread.  I do use
    one to heat my bedroom in winter, but I don&#x27;t think they are really relevant
    to the future.<p>It is true that electric cooking is more efficient, especially
    when the heat can be produced in close proximity to the food, as in induction
    stovetops, crockpots, and microwave ovens.  I don&#x27;t know how to size this,
    but I don&#x27;t think it&#x27;s very large.<p>40% of global shipping by weight
    is fossil fuels, not just oil (<a href="https:&#x2F;&#x2F;billmckibben.substack.com&#x2F;p&#x2F;the-happiest-number-ive-heard-in"
    rel="nofollow">https:&#x2F;&#x2F;billmckibben.substack.com&#x2F;p&#x2F;the-happiest-number-ive-...</a>)
    but that&#x27;s by weight, not energy consumption.  The vast majority of fossil-fuel
    shipping is shipped by shipping ships, not by railroads, tractor-trailer trucks,
    stepvans, small boats, or personal cars, and, if I&#x27;m understanding <a href="https:&#x2F;&#x2F;unstats.un.org&#x2F;unsd&#x2F;energystats&#x2F;pubs&#x2F;documents&#x2F;2026pb-web.pdf"
    rel="nofollow">https:&#x2F;&#x2F;unstats.un.org&#x2F;unsd&#x2F;energystats&#x2F;pubs&#x2F;documents&#x2F;2026p...</a>
