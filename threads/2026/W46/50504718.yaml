  author: YeGoblynQueenne
  text: This is a list of books for programmers, not computer scientists, with the
    exception of Knuth&#x27;s book, which is for both.<p>For example, Hopcroft &amp;
    Ullman&#x27;s &quot;Formal Languages and their Relation to Automata&quot; is nowhere
    to be found, neither is its second edition &quot;Introduction to Automata Theory,
    Languages and Computation&quot;. Nor is there anything else on formal languages
    and automata, or complexity theory, boolean, propositional, and first-order logic,
    boolean satisfiability, (gasp) category theory, type theory, and so on and so
    forth.<p>So why not? Obviously programming texts are very useful and you have
    to be on top of that material if you want to call yourself a &quot;computer scientist&quot;,
    but why is all the theoretical computer science missing? Don&#x27;t &quot;streetfighting
    computer scientists&quot; need it? How do you get in a fight with someone who
    knows their finite state automata from their pushdown automata, and don&#x27;t
    expect to get a bloody nose?
