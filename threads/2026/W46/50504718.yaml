    that&#x27;s too much trouble too.<p>How about you just try it? Demonstrate getting
    claude, the best model, making a big application for you. See if it works. Have
    it make Excel or Call Of Duty, like seems popular. Try it! It won&#x27;t work!
    It&#x27;ll look a bit like it works but it won&#x27;t, while using $10k or so
    in tokens, but critically, what happens when you find flaws.<p>It will fix bugs,
    but will systematically require more tokens to do so and bog down more than more.
    After a few more thousand dollars worth of tokens it starts recreating old bugs
    every time you ask it to fix something, then takes ages fixing those, and eventually
    it gets so bad it notices and breaks the process off before it even fixes what
    you asked.<p>Maybe that&#x27;s why both Claude and OpenAI have started making
    ridiculous amounts of test (I&#x27;m all for test driven development, BUT according
    to me if your test file is more than twice the length of the source, something&#x27;s
    gone wrong and you need a better strategy for testing)
