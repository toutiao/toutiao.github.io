  author: rramadass
  text: I rather like this list of books. Anybody who follows the &quot;Church of
    Edsger Dijkstra&quot; can never go wrong :-)<p>I was rather surprised by the author&#x27;s
    mention of <i>The Anatomy of a High-Performance Microprocessor</i> which few people
    have heard of. It is a great concrete case-study to follow and understand.<p><i>Network
    Algorithmics</i> is an excellent guide to performance engineering (app level&#x2F;OS&#x2F;hardware).
    There is an updated 2nd edition which i have not yet browsed. It is relevant for
    everybody and not just for people making networking devices only.<p>Stepanov&#x27;s
    <i>From Mathematics to Generic Programming and The Elements of Programming</i>
    shows you how to map your programming language constructs onto abstract algebra
    such that your &quot;Program&quot; implements a &quot;Model&quot; of that &quot;Theory&quot;.  Do
    not go to the second book (which should be in the advanced section) without reading
    the first more introductory book.<p>Crochemere et al&#x27;s, <i>Algorithms on
    Strings</i> is new to me and seems relevant to NLP (used in LLMs?). Anybody browsed&#x2F;read
    this care to share their opinions?
