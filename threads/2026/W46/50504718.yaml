  author: rramadass
  text: For the &quot;Advanced CS Streetfighter&quot; you need;<p><i>Understanding
    Formal Methods by Jean-Francois Monin</i> - This is the best for getting a good
    grip on the breadth, concepts and sample tools for Formal Mathematics&#x2F;Specification&#x2F;Verification.
    Gives a map of the whole domain. Will force you to <i>learn and understand</i>
    a large set of mathematics, logic, its mapping to CS-theory&#x2F;PLT and finally
    shows how they all come together in specific languages&#x2F;tools. The chapters
    alternate between the needed abstract mathematics&#x2F;logic and concrete languages&#x2F;tools
    applying them.<p>Because everything is so succinct and precise (a graduate course
    in ~250 pages!), you will need to consult other detailed textbooks&#x2F;AI tutor
    to understand difficult concepts. Specifically, you would need to consult detailed
    texts on the languages&#x2F;tools you are interested in.<p>This is particularly
    important today for use with AI. Without knowing the mathematics&#x2F;logic involved
    one cannot direct an agent correctly nor verify its output properly.
