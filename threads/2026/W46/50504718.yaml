    # Book list for streetfighting computer scientists

    From dankwiki

    [Jump to navigation](#mw-head)[Jump to search](#searchInput)

    [![](/dankwiki/images/thumb/a/ad/Dijkstra.jpg/250px-Dijkstra.jpg)](/dankwiki/index.php?title=File:Dijkstra.jpg)
    _Edsger Dijkstra is watching you_

    2025 edition. this is very different from most "best books for programmers" lists you'll see, with _Code Complete_ and _Clean Code_ and _Wistful Wanking for Practical Wankers_ and _Design Slatterns_ and titles like that. you'll figure all that out as you go along. these are books to read so that you can cut motherfuckers with knives. do you need to read all of these? only if you want to know the things inside, i guess.

    ## Introductory streetfighting

    - Stepanov, _From Mathematics to Generic Programming_ and _The Elements of Programming_
    - Gustedt, _Modern C_
    - Hanson, _C Interfaces and Implementations_
    - Stroustrup, _The C++ Programming Language_
    - Josuttis, _C++ Move Semantics_, because a language feature requiring 200 pages of explication is worth studying? no, because this book justifies Rust better than any text on that language.
    - Klabnik, Nichols, and Krycho, _The Rust Programming Language_

    need you write in C or C++? not generally. but they are a lingua franca, implemented on most hardware you'll meet, and serve as the native API expression of all operating system that matter. rust is a pretty good language to write and read, and much less to talk about all the fucking time, so cut that shit out.

    ## Brawling combat

    - Dijkstra, _A Discipline of Programming_. the most beautiful book, page-for-page, in all of computer science.
    - Knuth, _The Art of Computer Programming_, especially volumes 1 and 4B, third edition
    - Warren, _Hacker's Delight_. make sure you get the second edition
    - Stevens and Rago, _Advanced Programming in the UNIX Environment_, get at least the second and preferably the third edition
    - Stevens, _UNIX Network Programming_, second edition
    - Abelson + Sussman, _Structure and Interpretation of Computer Programs_, best cover on a CS textbook hands down, second edition
    - Varghese, _Networking Algorithmics_
    - McKusick, _The Design and Implementation of the FreeBSD Operating System_
    - Kerrisk, _The Linux Programming Interface_
    - Garcia + Widjaja, _Communications Networks_. do you even ARQ, bro?
    - Kleinrock, _Queueing Systems_, especially volume 1. this is why they made you take prob/stats.
    - Hennessy + Paterson, _Computer Architecture: A Quantitative Approach_. the older editions don't lock material away from you online, but are...older.
    - Kennedy, _Optimizing Compilers for Modern Architectures_. if you want to actually implement compilers make sure you get Muchnik's _Advanced Compiler Design and Implmentation_ as well
    - CLRS, _Introduction to Algorithms_
    - Samet, _Metric and Multidimensional Data Structures_
    - McKenney, _Is Parallel Programming Hard, And, If So, What Can You Do About It?_ despite its preposterous title, this book is excellent, and covers things you won't find anywhere else. If Naming Books is so Hard for You, Why Didn't You Ask For Help?
    - Crochemere et al, _Algorithms on Strings_. just as french as it sounds, a true _force de frappe_
    - Culler et al, _Parallel Computer Architecture_
    - Ward + Halstead, _Computation Structures_
    - Shriver + Smith, _The Anatomy of a High-Performance Microprocessor_
    - Vazirani, _Approximation Algorithms_
    - Raghaven + Motwani, _Randomized Algorithms_
    - Garey and Johnson, _Computers and Intractability_. it's always embarrassing to realize you've promised a solution to an np-complete problem.
    - Sipser, _Introduction to the Theory of Computation_. but not as embarrassing as realizing you've promised a solution to an undecidable problem. also, the pumping lemma!
    - Galub + Van Loan, _Matrix Computations_. this is pretty much a straight mathematics textbook, but roaming multiethnic gangs of matrices make up many streetfights.

    ## For the advanced streetfighter

    - Ahora + Barak, _Computational Complexity_
    - Pierce, _Types and Programming Languages_
    - Okasaki, _Purely Functional Data Structures_
    - Van Roy + Hardidi, _Concepts, Techniques, and Models of Computer Programming_
    - Barendregt, _The Lambda Calculus_. it is true that the λ-cube is rarely useful within the tight confines of a knifefight. after a long day of bandanas and leather gloves and switchblades, even the brawler must eventually go home to family and fire and food and F systems. in a pinch, its bedazzling yellow cover can blind opponents.

    speaking of math, you might want to take a look at Axler's _Linear Algebra Done Right_ and Knuth's _Concrete Mathematics_. you'll want to know your combinatorics, your prob/stats, and your linear algebra cold. calculus through diffeqs is necessary to know, but i'm a pretty hardcore nerd and yet don't find myself integrating things all that often.

    now go forth and [fight in the streets](https://www.youtube.com/watch?v=BUt0dZXPFoU). i list no machine learning because i dislike machine learning. there are no quantum books because quantum is not yet useful for streetfighting (we all look forward to this situation changing). i list no SIMT/accelerator books because they're all shite. i list no infosec because infosec is a subfield of QA, fight me. there are no links because i'm a lazy, lazy man.

    i've heard good things about Tim Roughgarden's algorithms books, and have them on my shelves to read soon, but cannot yet speak to them. likewise Beej's book on networking, though that looks kinda lightweight. neither he nor Stevens goes into modern [fast networking](/dankwiki/index.php?title=Fast_UNIX_Servers "Fast UNIX Servers") using things like [XDP](/dankwiki/index.php?title=XDP "XDP") and [Io\_uring](/dankwiki/index.php?title=Io_uring "Io uring").

    you should of course also read [Hacking the Planet with Notcurses](https://www.amazon.com/Hacking-Planet-Notcurses-Character-Graphics/dp/B086PNVNC9), buying copies for your team and family.

