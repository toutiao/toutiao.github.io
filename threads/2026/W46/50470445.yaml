  text: Not as far as I can tell. Web Functions let you configure concurrency, maximum
    environment count, and request rate limits, but there&#x27;s no setting for how
    long an environment stays alive after its last request. The configurable timeout
    applies to individual requests, not the environment itself.<p>I measured between
    5 and 7 minutes of idle time (after the last request had ended) across six environments.
    I was able to cut this short by exiting the process myself, but AWS records this
    as a runtime error so IMO it&#x27;s not suitable to rely on in production.<p>Here&#x27;s
    the AWS scaling documentation. I&#x27;m happy to be corrected if I missed anything.<p><a
    href="https:&#x2F;&#x2F;docs.aws.amazon.com&#x2F;lambda&#x2F;latest&#x2F;dg&#x2F;web-functions-scaling.html"
    rel="nofollow">https:&#x2F;&#x2F;docs.aws.amazon.com&#x2F;lambda&#x2F;latest&#x2F;dg&#x2F;web-functions-s...</a>
