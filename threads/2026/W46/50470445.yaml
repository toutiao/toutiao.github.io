  author: inkyoto
  text: Organisations do not purchase service A from the cloud platform X and service
    B from the cloud platform Y. They choose X or Y, sometimes both (if the organisation
    is large and the business case justifies it), and invest into that platform.<p>GCP
    is also not the easiest to onboard with, which is how Google appears to roll in
    general.<p>On the technical side, AWS Lambda is more feature rich, mature, offers
    extensive configuration controls and really excels at granular, <i>event source
    type agnostic</i>, event-driven execution and its integration with the wider AWS
    ecosystem.<p>Cloud Run functions are more skewed towards HTTP based workloads,
    although, since it integrates with Eventarc, at least some feature parity with
    AWS Lambda should be expected. Cloud Run services are closer to AWS Fargate rather
    than the Lambda, but not everyone has (or wants) a container to run.<p>The extensive
    amount of publicly available knowledge on AWS Lambda should not be discounted,
    either. Google Cloud Run functions and services are just not as widely known and
    discussed.
