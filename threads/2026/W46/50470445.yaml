  author: seanw265
  text: Yes, the sample was two cold starts. The warm request benchmarks used 100
    samples per route.<p>You raise a good point about the hardware generations. I
    would like to do a larger sample, though I&#x27;m not so concerned about benchmarking
    each cpu separately since deployers can&#x27;t control the hardware their functions
    run on.<p>IMO your thought about the idle lifetime is plausible. But the distinction
    between  how Event and Web functions handle idle time (outside of billing) is
    that Event functions are frozen after the invocation completes. No code can execute
    while frozen. Whereas Web functions stay alive during that entire period. They
    can do anything they want after the invocation completes and before they are shut
    down.<p>I confirmed this by logging heartbeats during the idle period.<p>Thanks
    for your thoughtful comment.
