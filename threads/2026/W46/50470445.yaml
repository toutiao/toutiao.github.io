  author: perpil
  text: 'It isn&#x27;t clear what you mean by this: &quot;The cold-start comparison
    has only two paired samples&quot; Are you saying these results are based on a
    sample size of 2 coldstarts? If so, that&#x27;s way too small to draw any conclusions.  I
    don&#x27;t know whether the web functions fleet is currently homogeneous, but
    I know that for ARM, the event functions fleet has a mix of Graviton2&#x2F;3&#x2F;4
    of varying percentages.  You probably need a sample size of at least 100 for each
    cpu generation to see trends.<p>It&#x27;s not documented but if you make one request
    with event functions, the Lambda runtime lives for about 7 minutes before it&#x27;s
    reaped. I assume this is why the Web Function bills you for about 7 minutes of
    memory, it needs to hold that memory while it&#x27;s running in case another request
    comes in.  If you have a lot of rarely invoked functions, it is cheaper to use
    Lambda Event Functions.  There you&#x27;ll pay for GB&#x2F;s for the duration
    of your function.<p>For Event Functions with node, your best possible E2E coldstart
    time with an AWS service call is sub 500 ms <a href="https:&#x2F;&#x2F;speedrun.nobackspacecrew.com&#x2F;blog&#x2F;2025&#x2F;07&#x2F;21&#x2F;the-fastest-node-22-lambda-coldstart-configuration.html"
