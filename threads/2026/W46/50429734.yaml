  url: https://e-means.github.io/
  title: 'e-means: 10x faster k-means at equal loss - Blog'
  fetch_status: success
  content: "## An order of magnitude less epochs\n\nAcross a [large range of scales
    and datasets](#validation), e-means reaches a test loss below Lloyd's at 25 epochs,
    in 1.2 to 3 epochs. Measured end to end, that is a 10–45× wall-clock reduction
    on GPU against the state-of-the-art Lloyd implementation (Flash-KMeans), and 8–15×
    on CPU against Faiss. Speed and quality usually trade against each other in k-means,
    while e-means achieves both better speed and loss.\n\n![e-means against Lloyd’s
    k-means, in epochs, CPU time and GPU time](assets/emeans_vs_lloyd_readme_v9.png)\n\n##
    The k-means problem\n\nGiven a fixed dataset of n points X = {x, ..., x} ⊂ R and
    an integer k, the k-means problem is to find k centroids C = (c, ..., c) minimizing
    the mean squared distance between each point and its nearest centroid:\n\n\\[\\mathrm{MSE}(X,
    C) = \\frac{1}{n} \\sum\\_{i=1}^{n} \\|x\\_i - c\\_{a(i)}\\|^2, \\qquad a(i) =
    \\arg\\min\\_{j \\in \\{1,\\dots,k\\}} \\|x\\_i - c\\_j\\|^2 \\]\n\n\\[\\mathrm{MSE}(X,
    C) = \\frac{1}{n} \\sum\\_{i=1}^{n} \\|x\\_i - c\\_{a(i)}\\|^2 \\]\n\n\\[a(i)
    = \\arg\\min\\_{j \\in \\{1,\\dots,k\\}} \\|x\\_i - c\\_j\\|^2 \\]\n\nIt's a static
    dataset, unlike codebook learning inside VQ-VAEs, where the distribution to cluster
    is constantly moving.\n\n## The e-means project\n\nThe goal of e-means is to provide
    a modern optimization rule for the k-means problem. We started this project from
    the following observations:\n\n- k-means is one of the rare problems in machine
    learning where full-batch optimization is still widely used.\n- Mini-batch k-means
    methods in the literature exist, but are mostly based on the MacQueen update rule,
    released in 1967.\n- Modern deep learning offers optimization tools that can enhance
    mini-batch methods.\n\nFor e-means, we chose to do mini-batch updates with exponential
    moving averages, which we found to be most efficient for the k-means problem.
    Contrary to previous mini-batch approaches, e-means requires no hyperparameter
    tuning because it automatically sets the batch size and step size with scaling
    laws (see [Automatic hyperparameter tuning with scaling laws](#scaling-laws)).
    In addition, e-means improves the initialization and the dead-cluster revival
    strategy, adds a cosine-scheduled decay rate, and introduces a finalization stage
    that reduces the training loss for a negligible runtime penalty at the end of
    training. e-means is highly parallelizable, and comes with specialized kernels
    that translate its algorithmic advantage into wall-clock speedups.\n\nMoving-average
    updates\n\nEach mini-batch updates every cluster's count and sum. The centroid
    is their ratio.\n\nNo hyperparameter tuning\n\nEverything is derived from scaling
    laws.\n\nStart and finish\n\nNovel initialization and finalization methods. The
    run ends on each cluster's exact last-epoch mean.\n\nCosine scheduling\n\nThe
    step α anneals from α to 0.1α, as a learning rate does.\n\nDead-cluster revival\n\nClusters
    with size below a threshold are revived by splitting a large cluster.\n\nSpecialized
    kernels\n\nGPU kernels fuse the nearest-centroid assignment, turning the epoch
    savings above into matching wall-clock speedups.\n\n## The centroid update rules\n\nThe
    centroid update rule is the central component of e-means. This section aims to
    provide an overview of update rules for k-means clustering. All methods maintain,
    for each cluster j, a sum S and a count N of the points assigned to it, and take
    the centroid as their ratio:\n\n\\[c\\_j = S\\_j / N\\_j \\]\n\nThey differ only
    in how S and N are updated. Below, s and n denote the sum and the count of the
    points in the current batch that are assigned to cluster j (both zero if none
    are).\n\n**Lloyd’s algorithm** assigns every point to its nearest centroid and
    recomputes the statistics from scratch, using the full dataset as the batch:\n\n\\[S\\_j
    \\leftarrow s\\_j, \\qquad\\quad N\\_j \\leftarrow n\\_j \\]\n\nso c is the exact
    mean of the points currently assigned to it. Each update costs one full pass over
    the data, and the procedure is repeated a fixed number of times (typically 20
    to 50 iterations).\n\n**MacQueen’s update** accumulates the statistics without
    ever discarding them:\n\n\\[S\\_j \\leftarrow S\\_j + s\\_j, \\qquad\\quad N\\_j
    \\leftarrow N\\_j + n\\_j \\]\n\nso c is the uniform mean of every point assigned
    to cluster j since the start of training, including points assigned under earlier,
    possibly poor, centroid positions. This was later partially addressed by Staleness-Reduction
    Mini-Batch K-Means, a hybrid method between k-means and MacQueen. They obtained
    important speedups, but only on very low numbers of clusters.\n\n**e-means** works
    on mini-batches and replaces this sum with an exponential moving average:\n\n\\[S\\_j
    \\leftarrow (1-\\alpha)\\,S\\_j + \\alpha\\, s\\_j, \\qquad\\quad N\\_j \\leftarrow
    (1-\\alpha)\\,N\\_j + \\alpha\\, n\\_j \\]\n\n\\[S\\_j \\leftarrow (1-\\alpha)\\,S\\_j
    + \\alpha\\, s\\_j \\]\n\n\\[N\\_j \\leftarrow (1-\\alpha)\\,N\\_j + \\alpha\\,
    n\\_j \\]\n\nso older assignments are forgotten at rate α, and the centroid tracks
    recent assignments rather than the whole history. This update rule is typically
    used for moving distributions, hence their adoption for training VQ-VAEs. What
    we found is that it’s also extremely efficient for static datasets if it’s combined
    with e-means’ other components, and hyperparameters are properly tuned.\n\nWhy
    exponential moving average updates and not gradient descent?\n\nThe e-means project
    started from previous work at Meta FAIR by Hugo Touvron and Hervé Jégou, who had
    found that mini-batch k-means by gradient descent could beat Lloyd’s algorithm.
    While I could reproduce these results, I found that the performance of gradient-descent
    based centroid updates is unstable at large learning rates, unlike exponential
    moving average updates. I suspect that is because EMA updates guarantee that the
    centroid is always in the convex hull of points assigned to it, while gradient
    descent updates may overshoot past that hull.\n\n![Test error against the effective
    step for exponential moving averages and plain gradient descent, at a large batch](assets/ema_vs_sgd_large_batch.svg)\n_Test
    error against the effective step a centroid takes, at a large batch, for exponential-moving-average
    updates (EMA) and plain gradient descent (SGD), each at every step setting tried.
    DEEP, 1 million vectors, and SIFT, 10 million vectors, 16,384 clusters, 5 epochs,
    median over 3 seeds. The vertical axis is percent above the best test error in
    the panel. At its best setting, gradient descent ends 1.6% (DEEP) and 0.4% (SIFT)
    above the moving average._\n\nIn order to achieve the lowest loss at a fixed number
    of epochs, we chose exponential moving average updates, hence the name e-means
    for our method.\n\nLloyd is a special case of e-means: hyperparameter study\n\nIf
    you set the batch to the full dataset, B&nbsp;=&nbsp;n, _and_ α&nbsp;=&nbsp;1,
    then N and S become exactly the count and sum of the whole cluster, so one e-means
    iteration becomes exactly one Lloyd iteration. Lloyd is an extreme case of e-means
    without cosine scheduling on the learning rate. However, our hyperparameter search
    found that this extreme setting is highly suboptimal, which explains why e-means
    largely outperforms Lloyd. Below, the loss is measured for every batch size B
    and step α: Lloyd lands in a corner, well outside the region where the loss is
    lowest.\n\n![Validation loss for every batch size and constant step at 5 epochs;
    the lowest losses lie on a diagonal band, and Lloyd, at full batch and step 1,
    sits in the top-right corner 1.8% above the best](assets/loss_map_t5.svg)\n_Validation
    loss for every batch B and step α, relative to the best cell, after 5 epochs.
    DEEP, n = 106, k = 1024. The step is constant here (no cosine schedule) so that
    Lloyd is exactly one of the cells: full batch, α = 1. The lowest losses follow
    a diagonal band, a larger batch calls for a larger step._\n\nThis hyperparameter
    study motivated us to derive scaling laws that automatically pick the optimal
    batch size B and step size α.\n\n## e-means better escapes local minima\n\nTo
