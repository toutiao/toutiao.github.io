  author: swann_bessa
  text: 'Hi saagarjha, I&#x27;m Swann Bessa, the author of the paper. Thank you for
    your message on the work. If I may I&#x27;d like to address a few points.<p>&quot;People
    have been doing minibatch k-means for a while, including with an EMA update&quot;
    : EMA updates are indeed used in clustering, but to our knowledge there is no
    paper that uses pure EMA updates for k-means clustering on a static dataset. EMA
    updates are typically used for moving distributions because of their ability to
    forget the past (as in VQ-VAEs), but their advantage for static datasets had not
    been empirically demonstrated. If you take a look at appendix E of the paper,
    we compare EMA to other gradient descent methods and show that EMA is much more
    stable and has better quality, especially at large batches. Our method also integrates
    EMA updates in an optimization framework that reliably outperforms Lloyd and previous
    mini-batch methods.<p>&quot;the contribution here is that they tried to measure
    how much better it is&quot;: The contribution here is to integrate EMA updates
    in an optimization framework to provide a method as robust and performant as we
    could. If you look at previous mini-batch k-means papers, the speedups and the
    performance is nowhere nearly as good as e-means, which beats Lloyd at 25 epochs
    in 2 to 3 epochs. In fact, mini-batch k-means is known in the literature as a
    fast method but with lesser convergence than Lloyd, and we compare to them in
    Figure 3. The e-means framework allows to be both faster and have better convergence
    than Lloyd, without the user having to tune the batch or the step.<p>&quot;How
    your algorithm scales as more data is present&quot;: In the first figure of the
    paper, we show that e-means scales up to 10 billion points and 16 million clusters.<p>On
    communication: workers only exchange per-update statistics (K×d numbers with replicated
    centroids). You argue that bigger batches have diminishing returns, so that extra
    local work doesn&#x27;t cut the number of updates. But that&#x27;s precisely what
    our batch law addresses: it returns the largest batch whose loss stays within
    ~0.2% of the best loss at a fixed number of epochs. In other words, we carefully
    scale the batch size to avoid that our speedups are driven down by the diminishing
    returns you mention.<p>The multi-node regime is in the paper: the 10B run used
    32 machines, so synchronization went over the inter-node network, and the bottleneck
    was still the distance computation, not communication. That&#x27;s also why an
    IVF variant, which cuts distance computations, does it in ~23 GPU-hours.'
