  author: swann_bessa
  text: Hi shiandow, I&#x27;m Swann Bessa, the author of the paper.<p>The fact that
    the update rule keeps the centroid within the convex hull is indeed very important.
    If you look at Appendix E, the gradient descent methods don&#x27;t have this property
    and are less stable than EMA updates.<p>Regarding simulated annealing, I agree
    with the parallel. You can see mini-batches as introducing noise in the beginning
    of the optimization to espace local minima and the step size decreasing through
    the training acts like a temperature in simulated annealing. Simulated annealing
    was already used for k-means with theoretical proof that you can reach the global
    minimum in enough epochs, but in practice, those methods are really slow. A paper
    that comes to mind is &quot;A simulated annealing algorithm for the clustering
    problem&quot; (<a href="https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;pii&#x2F;003132039190097O"
    rel="nofollow">https:&#x2F;&#x2F;www.sciencedirect.com&#x2F;science&#x2F;article&#x2F;pii&#x2F;0031320391...</a>).<p>The
    parallel with expectation maximization is also coherent, though less straightforward
    to me. K-means can be viewed as a hard-assignment, special case of the Expectation-Maximization
    algorithm applied to Gaussian Mixture Models (GMMs).<p>If you have any other questions,
    I&#x27;ll be happy to answer.
