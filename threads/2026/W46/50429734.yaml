  author: swann_bessa
  text: Hi Thomashuet, I&#x27;m Swann Bessa, the author of e-means.<p>The goal of
    e-means is to be a drop-in replacement for k-means. It solves the exact same problem,
    with the exact same inputs and delivers better centroids and quality in a fraction
    of the time. So I&#x27;m not sure what we get wrong by working on a problem that
    hundreds of papers also worked on. Is the whole k-means literature getting it
    wrong then ?<p>Picking the k is a separate problem, on which also a body of literature
    has worked too. e-means is a drop-in replacement for k-means so you can use any
    method you would use for choosing the k but with e-means instead of k-means.<p>e-means
    performs better on a very wide array of datasets, definitely not degenerate cases,
    don&#x27;t hesitate to check out our paper at <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2611.09501"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2611.09501</a>.<p>If
    you have any question or objection, I&#x27;ll be happy to answer.
