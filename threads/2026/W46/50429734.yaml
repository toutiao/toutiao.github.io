  text: |-
    Thanks for your kind responses.<p>I&#x27;d be very interested if they have a reference. If you feel like it, you can always send me an e-mail at swann@meta.com with the references. I&#x27;ll add them to my benchmarks.<p>The fewer centroids case is super interesting. Because we found in our experiments that basically if your n&#x2F;k ratio (n is the dataset size, k the number of clusters) is high, running the clustering as is on your n points is a waste of resource. You should subsample your dataset such that there is about 250 points per cluster and you will get very similar loss at a fraction of the compute. This is why faiss k-means, by default, subsamples datasets to 256 points per cluster if n&#x2F;k &gt; 256.
