  text: "&gt; to our knowledge there is no paper that uses pure EMA updates for k-means
    clustering on a static dataset<p>So I&#x27;ll be honest the reason I said this
    is that I know there are people who are using it and I just assumed it was common
    :P I will ask if any of them are relying on published work or what for where they
    got this from.<p>&gt; In the first figure of the paper, we show that e-means scales
    up to 10 billion points and 16 million clusters.<p>Sorry, I should have clarified.
    I actually think this is what is saving you: with that many clusters, your arithmetic
    intensity is inherently really high, so you are truly super compute limited. In
    this case introducing a bit of comms is cheap relative to the bazillion matmuls
    you&#x27;re doing for distance calculation. However if you have fewer centroids
    then the amount of work you do is much lower between updates. As an extreme example,
    if you&#x27;re doing hierarchical k-means you might have as few as 2 centroids,
    which means you barely do any work, and adding any sort of comms just kills you.
    Of course you are doing very little math but even if you&#x27;re just looking
    at memory bandwidth at that point (because your intensity is like 5 FLOPs&#x2F;byte
    or something) it will be done too fast.<p>(I don&#x27;t actually know how to solve
