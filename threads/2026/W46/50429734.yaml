    wins by needing fewer passes over a huge dataset&quot;: the improvements of e-means
    are shown on datasets from 10k up to 10B points (you can try e-means against Lloyd
    at low problem sizes at <a href="https:&#x2F;&#x2F;e-means.github.io&#x2F;playground.html"
    rel="nofollow">https:&#x2F;&#x2F;e-means.github.io&#x2F;playground.html</a>) so
    I would not say huge datasets only. It depends on what you call huge obviously,
    and that&#x27;s relative.<p>&quot;It has the same objective and the same optimum,
    so at best it matches Lloyd.&quot; I strongly disagree with that. e-means has
    the same objective and the optimal clustering is set by the problem, but Lloyd
    doesn&#x27;t find this optimal clustering in the vast majority of cases. Lloyd
    gets stuck in a local minimum, and what we find is that e-means reliably finds
    better clusterings than Lloyd in terms of MSE, but also other clustering metrics.<p>Regarding
    your usecase : I&#x27;d be curious to know what settings you used for e-means
    and a reproduction code. Don&#x27;t hesitate to send me your code at swann@meta.com,
    I&#x27;m down to have a check because we&#x27;re confident about e-means&#x27;
    performance against Lloyd.'
