  author: saagarjha
  text: As far as I can tell this isn&#x27;t particularly new, people have been doing
    minibatch k-means for a while, including with an EWA update. I assume the contribution
    here is that they tried to measure how much better it is and provided code? I&#x27;m
    not sure I agree with their claims though, because they didn&#x27;t really measure
    the things that matter–sure, it&#x27;s better than Lloyd&#x27;s algorithm, but
    that&#x27;s a very low bar.<p>If you are claiming that your algorithm is &quot;highly
    parallelizable&quot; and comes with &quot;wall-clock speedups&quot;, then the
    actual metrics that matter here is not number of steps or even basic wall clock
    time as your size remains fixed, but how your algorithm scales as more data is
    present or parallelism is required. This algorithm splits up the minibatch across
    workers and has them compute local updates, then allreduces it. As the amount
    of data goes up, the comms become much more expensive (since you have to use a
    worse transport layer), which means that you&#x27;re basically locked in a desperate
    attempt to do more local work before you send your partial update to everyone
    else. If you attempt this (not explored in the paper) you will find that the improvement
    in clustering by doing this extra work has diminishing returns–you only reduce
    the number of updates by a few steps (which is what drives your wall clock time).
    At scale you end up being heavily comms limited and not super parallel at all.
