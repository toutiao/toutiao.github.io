  author: swann_bessa
  text: 'It&#x27;s not a new kind of clustering. It solves exactly the same problem
    as k-means (minimize the mean squared distance to k centroids), returns the same
    thing (k centroids and an assignment), and has the same inputs (k and a number
    of epochs). The batch size and step size are set automatically, so there&#x27;s
    nothing extra to tune. So it is a drop-in replacement for k-means specifically:
    in Faiss it&#x27;s Emeans(d, k).train(x) where you&#x27;d call Kmeans(d, k).train(x).
    The code is in faiss at <a href="https:&#x2F;&#x2F;github.com&#x2F;facebookresearch&#x2F;faiss&#x2F;tree&#x2F;main&#x2F;contrib&#x2F;e_means"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;facebookresearch&#x2F;faiss&#x2F;tree&#x2F;main&#x2F;contrib&#x2F;...</a>'
  score: 0
