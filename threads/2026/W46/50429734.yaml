  text: 'I wonder if this could be used anywhere as an alternative to Lloyd&#x27;s
    algorithm. I have a hobby project which uses Lloyd&#x27;s to &quot;relax&quot;
    an icosohedral equal area mesh on the surface of a sphere [1]. I&#x27;m going
    to try to swap it out with an adaptation of this and see if it&#x27;s much better
    or if I can afford more iterations with this method.<p>Edit: tried it, and it’s
    definitely <i>not</i> better for this use case. e-means wins by needing fewer
    passes over a huge dataset, but relaxing a mesh on a sphere has no dataset: each
    Voronoi cell’s centroid can be computed directly from its geometry. Mini-batches
    just swap that for a noisy sampled estimate of the same thing. It has the same
    objective and the same optimum, so at best it matches Lloyd. In practice it was
    much slower and left the grid noisy, and with small sample budgets it even tangled
    the mesh.<p>[1] <a href="https:&#x2F;&#x2F;webgcm.app&#x2F;explain&#x2F;grid#nudging-the-cells-into-shape"
