  author: iLemming
  text: Yes. Lisps are great (probably the best) when paired with LLMs. Clojure is
    well-known to be one of the most token-efficient [mainstream] languages, due to
    the mere compactness of its syntax. The syntax density can be easily observed
    by grabbing a piece of JSON and converting it to idiomatic EDN; it would be almost
    twice as compact and far more readable.<p>When an LLM is given access to a REPL,
    it gets even more interesting. Agents stop guessing and start empirically analyzing
    the current state of affairs, changing things dynamically, reaching the correct
    solution much faster and costing even fewer tokens.
