  author: iLemming
  text: "&quot;[It&#x27;s better to] learn type theory, category theory, lambda calculus,
    logic, etc.&quot; I have heard a similar notion for years. And I tried. Oh boy,
    I tried. Grokking Haskell felt like a Sisyphean grind. And then I tried Lisp.
    I dunno what happened to my brain, but the sheer pragmatism and plain simplicity
    of it suddenly made all the things that before felt so difficult to grok clearer
    than Lego-set instructions. Recursion, with its small intricacies that confused
    me for years, made me realize how simple it actually was, I just wasn&#x27;t seeing
    it the way it actually is. Y Combinators, Folds, Monads, Applicatives, Laziness,
    and many other things.<p>I wish I had found Lisp many years sooner. That simplified
    Haskell, Rust and Idris for me. The downside is that it turned out to be vastly
    pragmatic, and for personal stuff I&#x27;m on Lisp. Even though most things at
    work are not.<p>So, maybe you should honestly self-reflect: had that book not
    happened in your life before, would you even consider understanding LC today,
    unadulterated by &quot;gimmicks&quot;?"
