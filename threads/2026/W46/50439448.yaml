  author: phoe-krk
  text: IIUC &quot;hygienic&quot; in this context relates not to the define-syntax
    style of macro writing that eliminates even a chance to leak symbols, but to the
    deliberate choice where plenty of LOL macros introduce implicit bindings as a
    part of their functionality.<p>It&#x27;s possible to write macros without problems
    like variable capture in Lisp, it just takes some more care and a choice to follow
    this paradigm. LOL macros often explicitly choose <i>not to</i> follow it.
  score: 0
