  author: antonvs
  text: The Result example illustrates this debate nicely. Software is composed entirely
    of abstractions, even down to the machine code level. You have to understand the
    abstractions to use them effectively.<p>&quot;Too clever&quot; is subjective,
    and often just means that the developer lacks sufficient familiarity with the
    abstractions, such as Result in this case.<p>The abstractions are what allow us
    to build systems with intrinsic complexity and keep them manageable. The &quot;too
    clever&quot; accusation is about <i>perceived</i> complexity, and depends on the
    observer. Expertise changes what seems complex or simple to someone.
