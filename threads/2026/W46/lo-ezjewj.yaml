  text: |-
    This is so cool! I've been obsessed with thinking about this for NixOS/Nixpkgs for months, and have been trying to reason about ways to get energy usage down.
    One of the (small) ways I've been approaching this is the strictDeps migration that is happening across the repo. It does a couple of things related to separating build vs runtime dependencies and cross-comp, but one side effect is that less dependencies may be downloaded when installing a package (specifically, build time dependencies may not be downloaded when substituting the pre-built package from a binary cache)!
    It's a small save for a single user, but I've been thinking about it at a wide scale: for thousands of users of a package, the electricity saved by not downloading and storing the extra dependencies adds up over saved network transmission costs (every packet requires energy to be routed through routers, switches, etc.) over these thousand users adds up. Now, do this calculation for the few hundreds (thousands?) of packages in a modern NixOS system. Surely, this is greater than 0 savings.
