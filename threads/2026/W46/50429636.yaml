  content: |-
    MeowDisplay

    # Mac Everywhere.On Whatever Display.

    Turn an iPhone, iPad, Android device or another Mac into a display for your Mac. Mirror it, extend it, and control it with touch.

    Free and open source. iOS 2.0 on the App Store · Mac 2.0 companion for macOS 14+ (stable release: 2.0.0) · Android 10+ in closed testing.All downloads ›

    Window view

    ## Your Mac’s windows.Arranged your way.

    Show individual Mac windows instead of the whole display. Keep them as tabs, split them into panes, and swap or resize them as you work. Touch and hold a window’s label to pick it up, then drop it where you want it.

    Touch and hold a window’s label, then drag it.

    Stage Peek

    ## Hold the edge.Every window, in reach.

    Rest a finger on the edge of your iPhone or iPad and your Mac’s windows rise in a column beside it. Tap the one you want, and it replaces the window you’re looking at.

    Press and hold the left edge of the screen.

    Natural Touch

    ## Touch your Mac.The way you’d expect.

    One finger does what a fingertip should. MeowDisplay reads how long you rest before moving, so scrolling, dragging and right-clicking need no extra fingers or modes.

    Two fingers tap to right-click and pan to scroll.

    Tap, swipe, rest then move, or hold. Try it on the list.

    Remote Finder

    ## Your Mac’s files.Made for touch.

    Tap Finder in Stage Peek and MeowDisplay opens its own browser of your Mac’s files, instead of a Finder window that’s tiny on a phone.

    Prefer Finder itself? Its windows are one tap away. Copy on one and paste on the other with Unified Clipboard.

    It can see the files in the folders you approved, preview them and save copies on the device. It can’t change anything.

    Tap Finder in Stage Peek to browse your Mac’s files.

    Per-device displays

    ### One Mac.Different views.

    Mirror on one receiver and Extend on another, and change either one without touching the other. Drag the virtual displays to arrange them around your Mac, just like in Displays settings.

    Drag either receiving display. Each receiver can independently Mirror or Extend.

    Features can differ by platform. Android is currently in closed testing. Platform status ›

    Two ways to make room.

    ## The whole picture.Or a little extra space.

    Mirror what’s on your Mac, or give it a whole new display. Switch between them any time in the Mac app.

    ### Mirror.The same screen on both.

    Your iPhone shows exactly what’s on your Mac, and follows along as you work. If your Mac has more than one display, choose which one to share.

    ### Extend.A second screen of its own.

    Your iPhone becomes a separate display beside your Mac. Drag a window over, keep a reference or a second app there, and arrange it with your other displays in macOS.

