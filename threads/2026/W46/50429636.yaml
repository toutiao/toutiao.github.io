  text: |-
    The question I saw coming, and was hoping for too.
    Thank you for asking!<p>There&#x27;s quite a bit of overlap in what we&#x27;re both trying to do. I&#x27;ve come across Sill and tried it as well, and it&#x27;s nice.<p>I think the biggest difference for most people would be the iPhone experience across both apps. I&#x27;ve specifically prioritized making the whole &quot;use your Mac from your phone&quot; experience better, and the iPad has received the same care too, with additional customizability to make use of the extra screen space.<p>I&#x27;ve looked at quite a few remote desktop apps, how they&#x27;ve approached things and the trade-offs they&#x27;ve made, and weighed those against how I&#x27;d want MeowDisplay to do things.<p>Part of MeowDisplay also came from a question: why hasn&#x27;t Apple done something like this natively? The iPad has Sidecar, so I&#x27;ve often imagined how Apple might&#x27;ve approached it for the iPhone, and how I&#x27;d do it based on my experience with remote desktop apps.<p>Coming to how they&#x27;re different, I think the biggest distinctions are how I&#x27;ve chosen to handle Mac windows, the limited screen space on phones, and the overall UX.<p>Sill&#x27;s optional virtual display moves the selected window onto a separate display sized for the receiver, which can resize the actual Mac window. MeowDisplay&#x27;s Window view keeps the Mac window&#x27;s existing size and position, adapting how it&#x27;s displayed on the phone instead.<p>My reasoning behind this is that most desktop apps weren&#x27;t designed for phone-sized windows. Resizing them can make their interfaces cramped or awkward, and I&#x27;d rather preserve their original layouts, even if that means occasionally zooming, which I find acceptable.<p>Sill currently focuses on displaying one window or the desktop at a time, while MeowDisplay offers a different multitasking workflow with multiple windows arranged in tabs and panes, and floating windows coming in 2.1.<p>Another difference is the screen space. Sill&#x27;s portrait layout has the streamed picture at the top with a dedicated trackpad below it, although it also offers a Larger Picture option and direct touch.<p>I&#x27;ve questioned why we even need a separate trackpad when the whole phone is already a touch surface. MeowDisplay lets you use the displayed content itself for Direct Touch or trackpad-style input, without sacrificing a portion of the screen for a dedicated trackpad. Personally, I find that screen space too valuable to give up.<p>There&#x27;s a difference in how you navigate through the UI as well. Sill has window thumbnails and app selection, while MeowDisplay uses Stage Peek, which you pull from the screen&#x27;s edge to browse and search windows and apps, along with an expanded window overview.<p>So yupp, we&#x27;re both trying to solve a similar problem, just with different approaches and trade-offs. I think some people might prefer Sill&#x27;s approach, and others might prefer MeowDisplay&#x27;s.
