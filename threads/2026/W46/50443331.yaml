  author: tialaramex
  text: The insurer&#x27;s operating costs do not vanish when you don&#x27;t pay them,
    so they are out of pocket. I think the problem is that it&#x27;s very common,
    rather than expensive each time it happens. Also however there&#x27;s a gap between
    issuing insurance and becoming aware that you won&#x27;t get paid. You <i>could</i>
    demand irrevocable payment up front, but you can be more attractive to customers
    if you offer riskier payment options.<p>That is, insuring 17-year-old Jim to drive
    a Porsche 930 &quot;Widowmaker&quot; but quoting the same price as his father&#x27;s
    renewal on a BMW 316i is very very stupid and might cost the company a pile of
    money, but Jim is extremely rare and you don&#x27;t need sophisticated models
    to tell you not to do that. Whereas enrolling Sarah who can&#x27;t always afford
    her insurance doesn&#x27;t cost very much but there are a <i>lot</i> of Sarahs
    out there and so it multiplies. You found Sarah via a deal where Sarah is paying
    monthly and her bank can claw back payments for up to 10 working days because
    <i>they</i> don&#x27;t trust Sarah either. Unlike Jim, Sarah would have been a
    net-positive customer <i>if</i> she always paid and the trouble is figuring out
    if she will pay,
