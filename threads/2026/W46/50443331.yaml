    A rare glimpse inside the high-risk, high-reward Hormuz trade\n\n### \n- Mercuria
    freight trader recounts how his company chartered Sinokor VLCCs to bring stranded
    crude through Hormuz using a specially devised declining demurrage clause\n- Inside-Hormuz
    fixtures in the early months of the crisis were thwarted by owner requirements
    for ‘SOH Clause’ that allowed either owners or masters to refuse a transit\n-
    Mercuria testimony recounts meeting with US government on military escorts and
    dealings with Navig8, acting as a middleman for Adnoc shuttle service\n\n- \n-
    \n###### Analysis\n\n- \n ![Headshot of Greg Miller](/-/media/maritime/headshots/greg-miller-2026.png?rev=367e3a78503d4192958330032071eff7&h=120&w=120&la=en&hash=CE0B5A5E66C8CC51A5FC955E70E5A72A)\n\n[Greg
    Miller](https://www.lloydslist.com/authors/greg-miller)[@GMjournalist](http://www.twitter.com/GMjournalist)[[email&nbsp;protected]
    ](/cdn-cgi/l/email-protection#a7c0d5c2c089cacecbcbc2d5e7cbcbc8dec3d4cbced4d3cec9d3c2cbcbcec0c2c9c4c289c4c8ca87)\n\n####
    \n\nThe witness statement of Mercuria freight trader Renaud Hauspy in the case
    of&nbsp;_Mercuria v Baltic Exchange_, now at trial in London, sheds new light
    on the business of getting crude through the Strait of Hormuz\n\nBRINGING crude
    through the Strait of Hormuz is a highly secretive affair. The transaction terms
    are very private, the players are exceptionally press-shy, the security risks
    are extreme, and the financial rewards are enormous.\n\nWith Iran still attacking
    tankers eight months after the crisis began, providing details on Hormuz transit
    mechanics and naming names is not something you’d do outside of a court proceeding.\n\nAs
    it happens, there’s a proceeding now underway.\n\nThe _Mercuria&nbsp;v Baltic
    Exchange_ trial is ongoing in London, with [Mercuria](https://www.seasearcher.com/company/476470/overview)&nbsp;seeking
    to invalidate the [Baltic Exchange](https://www.seasearcher.com/company/53202/overview)’s
    assessments for the TD3C Middle East Gulf-China index from March 1-July 3. Witness
    statements have just been made public.\n\nThe witness statement of Renaud Hauspy,
    a Switzerland-based crude freight trader at Mercuria, provides a rare inside glimpse
    of the Hormuz crisis charter market — or lack thereof.\n\nHauspy’s account (supported
    by email and chat message documentation) begins in early March, just after the
    missiles began flying, and extends through the US-Iran “peace” Memorandum of Understanding
    period in June and July.\n\n**Mercuria turns to Sinokor in the early days**\n\nMercuria
    has a fleet of around 200 vessels, he wrote, with around 60 in the crude segment,
    including very large crude carriers, suezmaxes and aframaxes. All its VLCCs are
    chartered in.\n\nThe company did not have any VLCCs or suezmaxes inside the strait
    when the war broke out, but did have VLCCs outside the strait that had been fully
    fixed with commitments to load in the Middle East Gulf after hostilities began.\n\nThese
    fixtures were either renegotiated to load outside of Hormuz, such as in [Fujairah](https://www.seasearcher.com/place/1730/overview),
    or were cancelled. “I believe our customers, including [TotalEnergies](https://www.seasearcher.com/company/16950/overview),
    [CNOOC](https://www.seasearcher.com/company/70529/overview), [Unipec](https://www.seasearcher.com/company/194045/overview)&nbsp;and
    [IOC](https://www.seasearcher.com/company/55230/overview), all agreed that it
    was impossible to load inside the Arabian Gulf,” said Hauspy.\n\nMercuria also
    had oil cargo inside Hormuz that needed to be moved on a contracted schedule that
    was agreed to before the crisis began.\n\n&nbsp;\n\n&nbsp;\n\n&nbsp;\n\nIt couldn’t
    use the VLCCs it chartered from owners including [Olympic Shipping](https://www.seasearcher.com/company/11928/overview)&nbsp;and
    [Maran Tankers](https://www.seasearcher.com/company/45743/overview). The owners
    “were not comfortable with ships transiting the strait”, he said.\n\nSo Mercuria
    turned to [Sinokor](https://www.seasearcher.com/company/219069/overview), which
    has since [grown into the key non-state-backed player in the strait](https://www.lloydslist.com/LL1158759/Sinokor-takes-centre-stage-in-high-risk-Hormuz-tanker-trade-as-security-risks-mount).\n\nIn
    early March, Larry Johnson, Mercuria’s global head of marine business, reached
    out directly to Sinokor’s chartering manager, KB Lee, Hauspy testified.\n\nSinokor
    had tankers inside Hormuz when the conflict began. To get its crude out, Mercuria
    fixed Sinokor’s _Singapore Loyalty_ ([IMO: 9322293](https://www.seasearcher.com/vessel/357622/overview))&nbsp;on
    March 11 and _Habrut_ ([IMO: 9500730](https://www.seasearcher.com/vessel/3974347/overview))
    on March 13.\n\nThe prices on the fixtures were redacted in the court filing;
    Hauspy said, “They were&nbsp;extremely high. We agreed primarily because we had
    little choice.”\n\nImportantly, the charter terms included a special demurrage
    structure taking into account the risk of not being able to transit the strait,
    a structure that would become a model for future charter negotiations.\n\nMercuria
    agreed to pay a daily demurrage rate as the cargo holder that declined as time
    passed, “meaning that if the ship was trapped inside the Arabian Gulf for a long
    time, the fixture essentially became cheap floating storage for Mercuria”,"
