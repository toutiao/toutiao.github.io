  text: |-
    OLEDs commonly flicker at some small multiple of the refresh rate because they often use something somewhat similar to DLP bit-plane modulation to avoid non-linearity at low brightness. You can&#x27;t do that at xy kHz because that would require xy kHz scanout to the panel, which is physically ... not very plausible. You can gate drive current, but then you&#x27;re back to how a 2010 LED backlight operates.<p>This:
    <a href="https:&#x2F;&#x2F;www.notebookcheck.net&#x2F;fileadmin&#x2F;Notebooks&#x2F;Apple&#x2F;MacBook_Pro_14_M5_Pro_OLED&#x2F;mbp_14_OLED_m5_pro_pwm_75.png" rel="nofollow">https:&#x2F;&#x2F;www.notebookcheck.net&#x2F;fileadmin&#x2F;Notebooks&#x2F;Apple&#x2F;MacB...</a>
