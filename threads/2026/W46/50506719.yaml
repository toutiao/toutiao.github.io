  author: adrian_b
  text: The purpose of that study was to show that the traditional fusion frequency,
    which is in the range of 50 to 90 Hz for most people, is valid only for what it
    was initially measured, i.e. the threshold where a sequence of complete static
    images is perceived to consist of continuous movements.<p>But when some new display
    technology is based on showing various image fragments at moments shifted in time,
    expecting that the eye will integrate them over time to form complete images and
    continuous movements, that may require higher sampling frequencies, up to 10 times
    higher, due to the interaction with the fast subconscious eye movements.<p>The
    study results are not surprising at all, and this is an effect that should be
    kept in mind by anyone who designs displays.
