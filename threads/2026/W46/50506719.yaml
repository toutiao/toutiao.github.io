  author: amluto
  text: 'Here&#x27;s my hypothesis: I&#x27;m guessing that the reviewer is using some
    kind of photodetector that is sensitive, to different extents, to different portions
    of the screen.  And that the actual display modulates at 240Hz but that some portions
    of the screen are 180 degrees out of phase with other portions.  Or that one of
    the subpixel colors is out of phase with the others.  This could explain the weird
    alternating-depth signal at ~2ms intervals.<p>Here&#x27;s notebookcheck&#x27;s
    review methodology:<p><a href="https:&#x2F;&#x2F;www.notebookcheck.net&#x2F;How-does-Notebookcheck-test-laptops-and-smartphones-A-behind-the-scenes-look-into-our-review-process.15394.0.html"
    rel="nofollow">https:&#x2F;&#x2F;www.notebookcheck.net&#x2F;How-does-Notebookcheck-test-la...</a><p>And
    the sensor they use might be this one:<p><a href="https:&#x2F;&#x2F;www.thorlabs.com&#x2F;item&#x2F;PDA100A2"
    rel="nofollow">https:&#x2F;&#x2F;www.thorlabs.com&#x2F;item&#x2F;PDA100A2</a><p>That
    doesn&#x27;t look like it&#x27;s even close to being able to focus on a single
    subpixel or even a single row without additional optics.<p>In any case, the 0%
    and 25% waveforms look pretty bad.  In my experience, light with sharp, short
    pulses (like &quot;driverless&quot; LED lights produce) are unpleasant, but the
    unpleasantness is related to how bright the source is compared to everything else
    in the field of view.  (The 0% and 25% waveforms are solidly at twice the frequency
    of driverless LEDs, which will make the effect considerably less bad.)'
