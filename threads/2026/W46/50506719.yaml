  author: vitaflo
  text: I am sensitive to PWM, but not CRT&#x27;s (I have an old Sony CRT I use to
    play retro games).  The reason is that CRT&#x27;s do not turn the entire screen
    on&#x2F;off like PWM does, they draw scanlines.  This isn&#x27;t nearly as bad
    as what PWM does.  It&#x27;s the on&#x2F;off of the entire screen rapidly that
    is the issue.<p>In fact there is research being done in the retro gaming scene
    of using CRT-like scanline drawing to mimic what CRT&#x27;s do for modern displays.  This
    allows &quot;blackframe like&quot; insertion without the flicker.  Only issue
    is you need a very high refresh rate display to take advantage of it and there
    aren&#x27;t many of those.
