  author: amluto
  text: 'I was expecting to read this and learn that the display was reasonably engineered
    and that there is some small subset of people who have extreme PWM sensitivity
    who have problems. But no, Apple modulates at 240Hz, according to plenty of articles.<p>We’re
    no longer in the dark ages of flicker. There’s actual industry guidance: IEEE
    1789.  And 240Hz, at any respectable depth of modulation, does not meet the low-risk
    limit, let alone the no-observable-effect limit.<p>I am wondering whether this
    is actually just an amazing firmware goof: the reports seem to suggest that operating
    at full brightness mitigates the problem, which makes little sense for an OLED
    display.  An OLED showing 50% (post-gamma) gray ought to drive the pixels the
    same way as an OLED at 50% brightness showing white. And this display supports
    HDR, so even 100% brightness white isn’t really 100%.<p>I’m wondering if a little
    engineering mistake snuck in: some (most?) LCD displays dim by PWM-dimming the
    backlight, and plenty of backlights have current-to-light transfer functions that
    inherently low-pass filter the light. If someone naively ported the <i>same logic</i>
    to an OLED (which doesn’t have a backlight), they might have implemented brightness
    controls by applying a 240Hz envelope to the pixel excitation waveform. This makes
    <i>no sense at all</i> as an actual implementation, but I can totally see an AI
    doing it and writing tests to validate it :)<p>Even if there is a genuine engineering
    factor that requires low frequency PWM, I bet Apple could mostly mitigate the
    problem by deliberately mismatching the phases. For decades, pre-LED stadium lights
    had rather extreme flicker at 120Hz, but it was tolerable because the overall
    system was engineered to roughly evenly split the lights between three electrical
    phases, giving an effective modulation depth near zero.<p>I haven’t seen one of
    these displays myself. I find 120Hz flicker to be extremely obvious and very very
    unpleasant, and if these displays really do modulate in a nasty way at 240Hz,
    I expect I’ll be able to see it, albeit rather less obviously than at 120Hz. Also,
    pretty much any modern phone can see this in slo-mo video mode :)'
