    This is exactly what we’ve built at Xata. Even if a database has multiple terabytes of data, creating a branch takes only around 3 seconds. This means the schema and the data appear as if they were instantly copied to the child branch. At the same time, the child branch is fully independent: it has its own compute, running on a different physical node, and nothing that happens on the child branch impacts the parent database.

    The key capabilities are:

    - **Instant database provisioning:** Create a new, fully functional Postgres database instantly.&nbsp;
    - **Instant copy-on-write branching:** Create database branches in seconds, without duplicating the underlying data. You only pay for the diff: create 50 branches of a 1TB database and you’re billed for something much closer to 1TB than 50TB.
    - **Scale-to-zero compute:** Automatically suspend idle databases and wake them on the next connection, in about one second, minimizing costs.
    - **Anonymized production data:** Remove sensitive information before data leaves production, so developers and agents can safely work with database branches.&nbsp;

    Together, these capabilities make it [remarkably cheap](https://xata.io/blog/a-thousand-postgres-branches-for-1) to run a branch per PR, per agent run, or even per SQL session. AI-native customers like [Sapien](https://sapien.ai/), [Enginy](https://www.enginy.ai/), [David AI](https://www.withdavid.ai/), [Runner AI](https://www.runnerai.com/), and [LoopAI](https://www.loopai.com/) each create thousands of database branches every week.

    You might also know Xata from our [open-source projects](https://xata.io/open-source) in the Postgres ecosystem, including **pgstream** , for logical replication with anonymization and DDL support, and **pgroll** , for zero-downtime, reversible schema changes.

    # Why ClickHouse

    Earlier this year, ClickHouse launched [ClickHouse Managed Postgres](https://clickhouse.com/cloud/postgres), which became generally available today. Built on local NVMe storage, it's currently the [fastest Postgres service](https://postgresbench.clickhouse.com/) out there, and not by a small margin.

    When we started talking with the ClickHouse Managed Postgres team, it quickly became clear just how complementary the two services are: ClickHouse Managed Postgres is optimized for high-throughput, long-lived production workloads, while Xata is designed to provision large numbers of small, short-lived databases in seconds, with production-like data and capabilities like instant branching and scale-to-zero that are particularly well suited for agentic workloads.&nbsp;

    Both platforms run unmodified vanilla Postgres and share a strong focus on reliability and stability. The common foundation puts us in a great position to move quickly on integrating the two platforms. In fact, [David AI](https://www.withdavid.ai/) is an example of a customer that already uses ClickHouse Managed Postgres and Xata together and they shared the following with us:

    > _As an AI company working with large volumes of data, we need reliable infrastructure that help us move fast.&nbsp; We moved from Neon to ClickHouse Managed Postgres for better reliability and performance, and our users immediately noticed how much faster everything felt. Xata’s branching has been a great fit for our devs (and AI coding agents!), making it easy to build and test in parallel. Bringing both together means high-performance Postgres and instant branching in a single platform, simplifying our infrastructure and giving our team more time to build._

    ## Best-in-class OLTP and OLAP

    By almost any measure, Postgres is the most popular OLTP database and ClickHouse is the most popular OLAP database. Combining the two is something teams have been stitching together themselves for years. The Postgres team at ClickHouse has been making that integration first-class: [very fast replication](https://clickhouse.com/blog/introducing-walshadow) from Postgres into ClickHouse and a [unified query layer](https://clickhouse.com/blog/introducing-pg_clickhouse) to build applications.&nbsp;&nbsp;

    An integrated transactional and analytical data platform is something we've wanted to build since Xata's early days, when our first product paired Postgres with a search and analytics engine.

    On a personal level, we've long admired ClickHouse and already knew the founders and many of the engineers, which gives us confidence that together we can take this vision much further.

    # What Xata enables

    ## A database branch for every pull request and agent run

    The GitHub integration enables automatically creating an isolated database branch for every pull request. These branches can be integrated into CI/CD pipelines, allowing code changes to be safely tested before merging into production. Since they are only needed for testing, branches are often scaling to zero after only a few minutes, minimizing costs.

    The same approach applies to coding agents, where every agent run can have its own isolated database to develop and test changes without affecting production.

    For details on the branch-per-PR use case and the cost savings it provides, see [this blog post](https://xata.io/blog/a-thousand-postgres-branches-for-1).

    ## Powering AI platforms

    AI platforms that embed Postgres are seeing an explosion in demand: first thousands, then hundreds of thousands, and eventually millions of databases per week. There are two main use cases: **instant database provisioning** for every new application, and **a database branch for every deployment preview** , allowing code changes to be tested safely against production data.&nbsp;

    Because unused databases scale to zero, platforms can run very large fleets of small, mostly idle databases at a fraction of the cost, while keeping full compatibility, since it's simply vanilla Postgres.

    # How it works

    Two key technologies enable fast branching and short wake-up times: our Xatastor storage engine and warm pools for compute instances.

