  text: |-
    I knew of cycle-walking but this is my first time seeing a hash function designed for it. It took me a while to see why Kensler's hash stays invertible even when you mask off some of the bits:

    Multiplication does not allow high-order bits to affect low-order bits. So multiplication by an odd number is invertible, but just as importantly you can look at bit suffixes (of any length) in isolation, and they will have the same property.
    Similarly, whenever idx is XORed with a right-shifted copy of itself, the mask is applied to the right-shifted copy, preventing bits from outside the masked region from changing anything inside the masked region. So this too stays invertible.

    Because each individual step keeps the low-order bits invertible, the hash function as a whole is also invertible over those low-order bits, which means you can use it for efficient cycle walking. Pretty cool stuff!
