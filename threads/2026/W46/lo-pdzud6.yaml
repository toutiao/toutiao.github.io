  text: A lot of these things can be explained in a simple and general way algebraically.
    E.g. if x is a nilpotent operator (the nth iterate x^n eventually becomes the
    0 operator) the geometric series 1/(1+x) = 1 - x + x^2 + ... truncates to a finite
    sum, so the operator 1+x is invertible with that as its inverse. This makes it
    easy to solve toy cryptanalysis problems like https://cryptopals.com/sets/3/challenges/23.
