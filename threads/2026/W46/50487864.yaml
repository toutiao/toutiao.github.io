    [Phil Brink](https://www.freightwaves.com/news/author/philbrink)\n\n Phil Brink
    is the Head of Fraud Media and Education at FreightWaves, where he investigates
    cargo theft, freight fraud and transportation security. He owned and operated
    a freight brokerage for more than a decade before organized fraud targeted his
    business, forcing him to rethink how freight companies identify and manage risk.
    The lessons he learned continue to shape his reporting, education and collaboration
    with brokers, carriers, shippers and law enforcement. He developed FreightWaves'
    Certified Fraud Compliance Officer (CFCO) program to give transportation professionals
    practical knowledge and a structured framework for identifying and managing fraud
    risk. Reach him at phil.brink@firecrown.com. \n\n- [Facebook](https://www.facebook.com/phil.brink.7)\n-
