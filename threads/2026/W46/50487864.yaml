  author: esseph
  text: I&#x27;ll leave this here, it has their reasoning behind it:<p><a href="https:&#x2F;&#x2F;www.congress.gov&#x2F;crs-product&#x2F;R48642"
    rel="nofollow">https:&#x2F;&#x2F;www.congress.gov&#x2F;crs-product&#x2F;R48642</a><p>---<p>Semiconductors
    are strategic and uniquely important electronic devices. They are fundamental
    to most industrial and national security activities and serve as essential building
    blocks of other technologies, such as artificial intelligence (AI). Policymakers,
    including top leaders in the United States, the People&#x27;s Republic of China
    (PRC, or China), and elsewhere, see semiconductors and AI technologies as critical
    to future economic competitiveness, national security, and global leadership.
    In 2014, the PRC government issued a national semiconductor industrial policy
    with the stated goal of establishing a world-leading semiconductor industry in
    all areas of the integrated circuit supply chain by 2030. To achieve its goals
    of technology leadership and independence, China has used government financing
    and certain policies to foster targeted foreign commercial ties across the semiconductor
    supply chain.<p>Since 2018, the U.S. government has sought to strengthen U.S.
    export controls of advanced semiconductors with the stated intent of both restricting
    PRC access to the technologies and ability to produce advanced chips, and curtailing
    PRC access to related computing and AI applications. U.S. actions have also sought
    to sustain U.S. leadership in advanced chips, related parts of the semiconductor
    supply chain, and computing and AI applications, while slowing China&#x27;s development
    of competitive capabilities. U.S. actions have been grounded in concerns about
    PRC efforts to build an indigenous, self-sufficient, and secure and controllable
    semiconductor ecosystem; and PRC military-civil fusion policies that seek to use
    commercial advancements in semiconductors, AI, and other technologies for military
    uses. Some analysts have noted that before 2018, some U.S. controls and licensing
    policies vis-a-vis China allowed some U.S. firms across the supply chain to contribute
    to the development of China&#x27;s semiconductor industry. U.S. efforts to enhance
    controls have restricted some advanced technologies and activities from China.
    Other parts of the semiconductor supply chain remain open to China.<p>---
