  text: It happens all the time. I work in logistics, it&#x27;s unbelievable how much
    general criminality and fraud there is in this industry.<p>The scenario you outlined
    is not all that common. There are much more sophisticated scams. What I see the
    most often are disclosures of load information and pickup numbers to bad actors
    (e.g. via social engineering).<p>When you roll up to a facility with a truck,
    you need to provide information from the bill of lading, and the key piece of
    data is the pickup number, which is basically like a PIN for the shipment. If
    that gets into the wrong hands, then someone else can show up at that facility,
    pose as the carrier, and get loaded with the goods. It&#x27;s quite low risk during
    the operation because there&#x27;s no hijacking or anything else obviously criminal
    happening. People will literally load the thief&#x27;s truck.
  score: 0
