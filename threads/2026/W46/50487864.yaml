  title: "$11.4 million in NVIDIA hardware vanishes during shipment from California
    to Texas - FreightWaves"
  fetch_status: success
  content: "[![](https://www.freightwaves.com/wp-content/uploads/2026/10/23/CFCO-ad_1400x175_promo.png?w=1200)](https://academy.freightwaves.com/CFCO)\n\nSix
    pallets of NVIDIA computer hardware worth a reported $11.4 million disappeared
    during a shipment from California to Texas. A truck collected the merchandise
    in Oakland on Aug. 29 for delivery to Fort Worth. Investigators reportedly tracked
    the vehicle through several extended stops before losing its trail in Southern
    California. The Oakland Police Department confirmed an ongoing grand theft investigation
    following a complaint filed Sept. 13, 2026. The disappearance comes amid [reports
    of nearly $111 million in stolen data center freight](https://www.freightwaves.com/news/nearly-111m-in-data-center-freight-stolen-as-thieves-test-bump-and-run-tactic)
    involving other high-value technology shipments.\n\nAccording to [The Mercury
    News](https://www.mercurynews.com/2026/11/04/police-investigating-11-4-million-nvidia-cargo-theft-from-oakland/),
    the vehicle displayed a food transportation company’s logo during the scheduled
    pickup. The driver subsequently traveled south, making several stops lasting multiple
    hours. Investigators eventually lost track of the truck in San Bernardino County.
    A [separate $12 million cargo theft investigation](https://www.freightwaves.com/news/feds-charge-driver-in-alleged-12m-cargo-theft-scheme-built-on-hijacked-carrier-identities)
    involved suspects who allegedly exploited established trucking identities to obtain
    freight. Authorities have not linked the two investigations.\n\n### Oakland police
    confirm investigation\n\nThe Oakland Police Department provided FreightWaves with
    the following statement:\n\n“The Oakland Police Department (OPD) is investigating
    a grand theft that occurred in East Oakland. The victim reported the crime to
    OPD on September 13, 2026. The investigation is ongoing, and anyone with information
    is asked to contact the OPD General Crimes Unit at (510) 238-3728.”\n\nThe Sept.
    13 complaint date does not establish when the theft occurred. Police have not
    confirmed the reported $11.4 million valuation or identified the specific merchandise.
    Authorities also have not identified the cargo’s owner, shipper, motor carrier
    or driver. Investigators have not publicly explained the vehicle’s extended stops
    or established whether criminals impersonated a transportation provider. Police
    have not announced arrests or confirmed any recovery of the merchandise. FreightWaves
    contacted NVIDIA for comment and followed up, but the company has not responded.\n\n###
    Previous thefts involving NVIDIA products\n\nThe Oakland investigation follows
    other significant thefts involving NVIDIA merchandise in Northern California.
    During 2025, Fremont and Union City police investigated burglaries involving more
    than $7.5 million in NVIDIA products. Those incidents targeted valuable computer
    hardware at separate locations. Authorities have not established any connection
    between those investigations and the latest disappearance.\n\nIn a separate September
    incident, thieves [stole two PlusAI trailers, including one displaying NVIDIA
    branding](https://www.freightwaves.com/news/thieves-steal-plusai-trailers-with-nvidia-branding-get-40000-pounds-of-sand-instead),
    from a Fremont, California, warehouse. The trailers contained approximately 40,000
    pounds of sand rather than NVIDIA hardware. Police recovered both trailers in
    nearby Newark. Investigators have not established any connection between that
    theft and the Oakland case.\n\n### Why it matters\n\nThe reported disappearance
    of $11.4 million in NVIDIA hardware underscores the financial stakes of transporting
    high-value freight. Regardless of how this shipment disappeared, carrier verification,
    shipment visibility and communication remain critical throughout transportation._[
