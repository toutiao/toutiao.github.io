  author: WorldMaker
  text: Seems to be a gift of the modern CLR cycling faster with each release since
    .NET 5 versus the backwards compatibilities the runtime used to have to keep in
    .NET &lt;= 4 because the same runtime would power multiple versions at a time
    of the compilers and BCL above it. In the old world &quot;Framework&quot; days
    after the CLR made the huge changes from 1.0 to 2.0 (for generics and other things)
    it seemed almost &quot;afraid&quot; to add features, especially for things that
    compilers could support themselves. The .NET 5+ CLR makes fewer &quot;forward
    compatibility&quot; guarantees as it now assumes it cycles directly with the compilers
    and that most deployment methods &quot;bake&quot; the CLR version with the application.<p>There
    have been smaller runtime improvements like this one in recent releases, but this
    one seems a big one to point to to prove that the runtime is truly growing at
    a faster and more interesting pace than the old days.
