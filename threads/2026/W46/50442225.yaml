  author: mdasen
  text: "&gt; go is much more efficient in syntax and memory<p>I&#x27;m going to talk
    about the second part first. .NET is often deployed with a JIT compiler runtime
    like Java. That means that hello-world scripts use a lot more memory than Go,
    but that difference becomes a lot smaller on real-world programs and .NET can
    use less memory than Go depending on what you&#x27;re doing.<p>C#&#x27;s concurrency
    can also be more efficient than Go&#x27;s since it&#x27;s coroutine based async&#x2F;await
    is a lightweight state machine rather than green threads. That&#x27;s not to say
    Go is especially heavy or anything, but it is more overhead.<p>In terms of &quot;efficient
    in syntax&quot;, Go has a lot fewer features. That&#x27;s one of Go&#x27;s biggest
    strengths and weaknesses.<p>Here&#x27;s an example. With Go, you just have struct
    tags: strings of anything that can be attached to a field in a struct. Let&#x27;s
    say you have a User struct and you want to make it so the JSON won&#x27;t have
    the user&#x27;s email in it. You do: Email string `json:&quot;-&quot;`. But what
    if you mess up and write &quot;jsom&quot; or `json:-` without the quotes? It&#x27;s
    basically a meaningless string to the compiler. With C#&#x2F;.NET, you have annotatons&#x2F;attributes
    that are a part of the language and checked as types. You&#x27;d do: [JsonIgnore]
    public string Email. JsonIgnore is an attribute class so your IDE can help you.<p>There&#x27;s
    a lot in Go where the answer kinda becomes &quot;f-it, we&#x27;ll just use strings
    instead of having something meaningful.&quot; Go talks about how important error
    handling is, but then you get an error from a function and it&#x27;s basically
    just a string. If you&#x27;re doing good error handling, you want to handle different
    errors differently, but that&#x27;s not easy in Go. Frankly, it&#x27;s not easy
    in most languages, but this is definitely an area where it felt like Go gave up
    on creating something good in order to get something out the door quickly enough
    that Google didn&#x27;t cancel the project. In a language like Zig, errors are
    enums and you get exhaustiveness checking. With Go, someone could add another
    error state to something you&#x27;re using and you&#x27;d never know - or they
    could change the phrasing of an existing error and you&#x27;d silently stop matching
    on it.<p>Go&#x27;s lambda syntax is clunky. func(x MyType) string { x.ToString();
    } vs (x) =&gt; x.ToString()<p>There&#x27;s lots of stuff like that. I&#x27;m not
    arguing that Go is bad, but it has a ton less stuff and that&#x27;s both a blessing
    and a curse."
