  author: mickdarling
  text: 'It&#x27;s a lot of fun to see what people can do with the voice transcription
    tools available now that are all open source.<p>I&#x27;ve been building my own
    Jarvis, and I still haven&#x27;t built my own meeting mode for him yet, though
    it&#x27;s on the trajectory. I may borrow some ideas from this.<p>I really like
    the filter for the whispered, hallucinated words that Whisper sometimes hears,
    like, &quot;Thanks for watching,&quot; when it&#x27;s silent. That&#x27;s cool.<p>I
    do a similar splitting of speech, but I think a slightly different mechanism.
    So I&#x27;ll have to take a look at how well yours works.<p>And, I&#x27;m not
    checking the loudness of the mic and the computer audio to figure out when the
    speaker output is leaking. That&#x27;s nice.<p>If there was anything I would add
    to yours, it would be diarization on the same inputs. So the room mic might have
    two or three people behind it, and to have diarization for that to know who is
    talking at any one time would be probably helpful. I use NVIDIA&#x27;s Nemotron
    on the Mac. <a href="https:&#x2F;&#x2F;huggingface.co&#x2F;nvidia&#x2F;Nemotron-3-Diarization"
    rel="nofollow">https:&#x2F;&#x2F;huggingface.co&#x2F;nvidia&#x2F;Nemotron-3-Diarization</a><p>And,
    I have enrollment for voices with speaker embeddings using this:  <a href="https:&#x2F;&#x2F;github.com&#x2F;wenet-e2e&#x2F;wespeaker"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;wenet-e2e&#x2F;wespeaker</a>'
