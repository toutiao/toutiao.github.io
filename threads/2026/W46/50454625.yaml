  author: jgrodziski
  text: 'I got frustrated with call note apps too, and also built my own as a native
    Mac app: <a href="https:&#x2F;&#x2F;retranscript.app" rel="nofollow">https:&#x2F;&#x2F;retranscript.app</a><p>I
    wanted full automation, full customisation of prompts for summary, ideas extraction,
    etc. and using the best speech-to-text models available (I will also add Apple&#x27;s
    SpeechAnalyzer soon for mundane transcription where the best accuracy is not needed).<p>Once
    started, Retranscript runs on its own. It notices the call automatically, records
    all voices with no bot in the meeting. Everything lands as plain files in a configurable
    folder.<p>The trade-off is the reverse of Yogurt&#x27;s: the audio goes to the
    model you chose instead of staying on your Mac. With your own keys it goes straight
    to the provider on openrouter, and nothing passes through my server. There&#x27;s
    no subscription. The app is free, and you pay for the models, at the provider&#x27;s
    price with your own key or with prepaid credits. It&#x27;s closed source for now
    (will release as open-source in the future), and Mac-only.<p>Congrats on the launch,
    it&#x27;s good to see so many people exploring this space, each with a different
    take on it.'
