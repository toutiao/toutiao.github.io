  title: Quasi-logarithmic kitchen timer - lcamtuf’s thing
  fetch_status: success
  content: "# Quasi-logarithmic kitchen timer\n\n### When life gives you meters...\n\nLike
    some of you, we have several kitchen appliances with integrated digital timers.
    I find them annoying: they are clunky to operate and if one uses them while cooking,
    the reflective surface gets covered in muck.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!7Ze1!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F35eb4d28-ad54-46fa-b384-76cc123d297d_2500x1668.jpeg)\n_Confusing,
    alien, evil technology._\n\nYou can buy mechanical (wind-up) kitchen timers, but
    they’re imprecise and only ring once. There’s also a couple of cheap battery-operated
    units that can be adjusted by twisting an outer ring, but they have so-so reviews.\n\nBut
    if there’s no good product to buy, why not make your own? I decided to build a
    digital timer with an old-school analog display and an easy-to-use adjustment
    knob. Further, to improve precision and legibility, I figured it would be nice
    to go with a logarithmic scale.\n\nWell, sort of: a truly logarithmic display
    wouldn’t work well with customary time units. That said, I came up with a compromise
    solution that divides the dial into four linear sections:\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!SGAj!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6d5d6b36-e317-4fcc-bb44-85d1007614b7_2523x1664.png)\n_Dial
    design (printable PDF version here)._\n\nIn the section up to the one-minute mark,
    major ticks represent ten-second increments. The next section covers 1 to 5 minutes,
    major ticks every minute and minor ticks every ten seconds. The third section
    spans 5 to 30 minutes, with five-minute major ticks and one-minute minor ticks.
    Finally, for the range from 30 minutes to 3 hours, every major tick is half an
    hour and every minor tick is ten minutes.\n\nAlthough this sounds complicated,
    the scheme is self-documenting: the labels “1 min”, “5 min”, and “30 min” describe
    both the corresponding timer setting and the stepover in the section that follows.
    For example, three minutes is just “1 min” plus two major ticks, while 20 minutes
    is “5 min” plus three ticks. It doesn’t take long to get a hang of it.\n\nFor
    the actual electromechanical display, I repurposed a vintage, switchboard-style
    Crompton 244-05VG-LS panel meter. Internally, the device is an ammeter with a
    full scale of 1 mA. Analog meters of this sort have gone out of fashion but they’re
    still available from surplus outlets; I scored this pair on eBay for $30 each:\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!kqzt!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac83850d-6a83-4f68-bbe3-13cc77b034e5_2500x1668.jpeg)\n_Switchboard-style
    meters, after modification (left) and before (right)._\n\nTo make a custom face
    for the meter, I simply disassembled the device, measured the dimensions, and
    printed replacement graphics on adhesive paper.\n\nWith the display sorted out,
    I sketched out the design of an enclosure. I kept it uncomplicated to make the
    unit easy to clean:\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!zldn!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F24a383c1-cc36-4ae0-9156-692f69ddaf1d_2457x1438.jpeg)\n_A
    rough CAD sketch of the enclosure._\n\nTo make the enclosure, I grabbed standard
    4/4 maple stock and resawed it on a bandsaw. The assembled enclosure is shown
    in the photo below:\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!XFTC!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe1c1eddb-4822-4e67-952e-7cacabc17871_2500x1668.jpeg)\n_Let’s
    cook._\n\nMost of the effort was getting the UI right. The timer is activated
    by tapping an illuminated button on top and then dialing in the desired time with
    a knurled knob mounted on the side. The wake-up tap is meant to eliminate nuisance
    activations. The active period is 20 seconds, indicated by a beep and a steady
    LED. If there is no encoder input in that time window, the device goes back to
    sleep.\n\nThe countdown starts three seconds after the last encoder input, provided
    that the chosen interval is greater than zero. While the timer is running, the
    interval can be seamlessly adjusted with the knob. Once the countdown reaches
    zero, the device enters an alarm mode and starts making noise every 15 seconds
    until the button is pressed again. The alarm can be also canceled by turning the
    knob clockwise to add more time.\n\nSimilarly to my earlier [voltmeter clock project](https://blog.coredump.cx/p/a-nicer-voltmeter-clock),
    the circuit uses an 8-bit [AVR DB series](https://ww1.microchip.com/downloads/aemDocuments/documents/MCU08/ProductDocuments/DataSheets/AVR128DB28-32-48-64-DataSheet-DS40002247.pdf)
    microcontroller ($1.50) and drives the meter using single-bit PWM with a variable
    duty cycle on pin PC0:\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!CKIZ!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F04f70c86-e584-4669-83df-f854ef92a0bd_3250x1966.jpeg)\n_Circuit
    schematic._\n\nSquare-wave audio is produced by a small speaker driven via pin
    PA6. An inexpensive 250 mA rail-to-rail op-amp, [AD8531](https://www.analog.com/media/en/technical-documentation/data-sheets/AD8531_8532_8534.pdf)
    ($1), is configured as a voltage follower to drive the speaker; many other chips
    with a reasonable current capacity — say, [OPA310](https://www.ti.com/lit/ds/symlink/opa310.pdf)
    ($0.80) — would also work fine. So would a two-transistor push-pull circuit.\n\nThe
    speaker I used is probably [CUI CMS-3048-058SP](https://www.sameskydevices.com/product/resource/cms-3048-058sp.pdf)
    ($2.50). The encoder is [Bourns PEC16-2220F-N0024](https://www.bourns.com/docs/Product-Datasheets/pec16.pdf);
    it produces 24 pulses per revolution and has detents that provide a nice tactile
    feel. The whole circuit is powered by a compact 5 V wall wart, [CUI SWI5-5-NW-P5](https://www.belfuse.com/media/datasheets/products/power-supplies/SWI5-N.pdf).\n\nThe
    code running on the MCU can be found [here](https://lcamtuf.coredump.cx/soft/embedded/burninator.c).
    For a demo, check out the following clip:\n\nOf course, all of this is very outmoded.
    The modern approach to hobby projects is to have an LLM do everything, then slap
    your name on it and submit straight to Hacker News. Alas, I come from a token-poor
    household, so I needed to do this by hand.\n\n# **\U0001F4D6**\n\nIf you liked
    the article, you’ll enjoy _[The Secret Life of Circuits](https://lcamtuf.coredump.cx/electronics/)_.
    It’s a richly illustrated, lucid introduction to electronics — from the physics
    of conduction to embedded system programming. It features 290+ color diagrams,
    420+ pages of original content, and zero AI.\n\n* * *\n\n_Some of the other silly
    projects on this blog:_\n\n[\n\n#### Panel meter calculator with floating point\n\n[lcamtuf](https://substack.com/profile/92541588-lcamtuf)\n\n·\n\nJul
    12\n\n[\nRead full story\n](https://blog.coredump.cx/p/panel-meter-calculator-with-floating)\n\n](https://blog.coredump.cx/p/panel-meter-calculator-with-floating)\n\n[\n\n####
    MCU land, part 7: life in full color\n\n[lcamtuf](https://substack.com/profile/92541588-lcamtuf)\n\n·\n\nFebruary
    24, 2023\n\n[\nRead full story\n](https://blog.coredump.cx/p/mcu-land-part-7-life-in-full-color)\n\n](https://blog.coredump.cx/p/mcu-land-part-7-life-in-full-color)\n\n[\n\n####
    Now you're thinking with relays\n\n[lcamtuf](https://substack.com/profile/92541588-lcamtuf)\n\n·\n\nNovember
