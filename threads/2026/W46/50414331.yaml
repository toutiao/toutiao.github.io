    [

     ![](https://cdn.slowdownwiseup.co.uk/media/original_images/723b56cd695724e0d31d34349f5927a338d0df3c.jpg)

    He said Google’s AI was conscious. But what was it doing to his mind?

    ](/news/technology/article/he-said-googles-ai-was-conscious-but-what-was-it-doing-to-his-mind)

    [

     ![](https://cdn.slowdownwiseup.co.uk/media/original_images/72d21a165ce16b5a3698c4f0d964e0feefd8a579.jpg)

    The toxic cost of counterfeit beauty products

    ](/news/business/article/the-toxic-cost-of-counterfeit-beauty-products)

    All smartphones and tablets would be blocked from viewing or creating child sexual abuse material, under proposals to be put to parliament by a powerful cross-party alliance of peers and MPs.

    Technology companies would be required under the plans to install software on all devices sold in Britain to prevent people being able to see explicit images of children. Images and videos of child sexual abuse, including AI-generated material, would be instantly blurred, and livestreaming of abuse would become impossible.

    Older devices could also be covered using a mandatory software update.

    The campaign is being spearheaded in the House of Lords by the Conservative peer and former education minister [John Nash](https://observer.co.uk/news/national/article/lords-propose-ai-tool-on-phones-to-stop-child-sexual-abuse-images), who successfully championed a ban on [social media for under-16s](https://observer.co.uk/listen/daily-sensemaker/social-media-could-be-banned-for-under-16s-in-the-uk). The Labour [former safeguarding minister Jess Phillips](https://observer.co.uk/news/national/article/safe-in-their-rooms-children-are-being-caught-in-a-global-grooming-pandemic), who resigned over the failure of Keir Starmer’s government to act quickly enough to block nudity on children’s phones, is leading the charge in the House of Commons.

    The government has already promised to legislate to force Apple and Google to prevent children from taking or sharing nude images on devices. In September, the culture secretary, Lisa Nandy, said the tech companies had “failed to protect children from some of the worst harms” and she was determined to bring about “whole ecosystem changes, tackling the means by which children are most often abused or groomed in the online world”.

    Andy Burnham said the protections would be “built into the device and switched on by default”.

    Nash said there was a “ghastly worldwide industry” of child sexual abuse material being created, and that Britain was one of the biggest consumers of it, so had a responsibility to act.

    “The government have very sensibly decided that they are going to block the ability of children in this country to take and send nude images, and view nude images,” he said. “If it can be done for children’s phones on these images, it can be done for child sexual abuse images on all phones. Frankly, these are trillion-dollar companies. Of course, if they are made to do it, they can do it.”

