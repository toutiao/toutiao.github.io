    [

    He said Google’s AI was conscious. But what was it doing to his mind?

     ![](https://cdn.slowdownwiseup.co.uk/media/original_images/723b56cd695724e0d31d34349f5927a338d0df3c.jpg)

    ](/news/technology/article/he-said-googles-ai-was-conscious-but-what-was-it-doing-to-his-mind)

    [

    The toxic cost of counterfeit beauty products

     ![](https://cdn.slowdownwiseup.co.uk/media/original_images/72d21a165ce16b5a3698c4f0d964e0feefd8a579.jpg)

    ](/news/business/article/the-toxic-cost-of-counterfeit-beauty-products)

    Although he insisted free speech was important, he added: “We are talking about stuff that is illegal. The harm that is being done to so many children, and to the people who are watching it, is so awful that we have to do this.”

    If ministers do not legislate, Nash will introduce an amendment, probably to the forthcoming national security bill, which will include a raft of cybersecurity measures.

    He is confident of getting a measure passed in the Lords, where peers voted overwhelmingly in favour of a social media ban for under-16s, but said: “Rather than going through the same palaver I went through last time, which was four votes in the House of Lords, each one with a bigger majority, and a last minute change of heart by the government, I would much rather the government did it themselves.”

    Phillips insisted the software already existed to blur or block inappropriate images. “My absolute priority has always been protecting UK children, and I don’t want to derail that, but what I want the government to do is look at the technology that we are going to demand children have on their phones and see what else we can think about.

    “I don’t want paedophiles in our country to be abusing children in the Philippines. If we could stop it, why would we not seek to try?”

    [Simon Bailey](https://observer.co.uk/news/national/article/safe-in-their-rooms-children-are-being-caught-in-a-global-grooming-pandemic), the former chief constable of Norfolk, who was the National Police Chiefs’ Council lead on child protection for eight years, insisted tougher regulation was needed. “The technology exists to be able to say with a degree of confidence: ‘This is child sex[ual] abuse material,’” he said.

    Last year, the Internet Watch Foundation (IWF) removed more than 312,000 online child sexual abuse images – a 7% increase on 2024. Analysts also found 3,440 AI-generated videos of child sexual abuse, compared with only 13 in 2024.

    A paper written by technology, law enforcement, cybersecurity and child protection experts, to be published this week, proposes a “paradigm shift” towards the prevention of child sexual exploitation by using AI tools to identify and disrupt suspected abuse on devices before images are viewed or shared.

    The contributors to the paper include Mark Bevan, Interpol’s head of crimes against children, Dan Sexton, chief technology office at the IWF, and Sarah Napier from the Australian Institute of Criminology.

    The public is overwhelmingly in favour of tougher action to protect children and prevent adults viewing illicit material, according to a poll by The Observer. Only 6% are very confident that the tech companies are doing enough to detect and remove child sexual abuse material.

    After a short description of the blocking technology, 80% support it being installed on their smartphone or tablet, while only 5% oppose the move. Almost 90% of both Labour and Conservative voters back the software.

    A government spokesman said: “We are putting in place the strongest online safety laws in the world. This includes preparing world-first legislation to call on the biggest technology companies to make it impossible for children to take, share or view nude images.

    “We will also give the police the powers they need to keep pace with criminal use of emerging technologies in order to keep our children safe.”

