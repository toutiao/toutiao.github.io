    # Fight to block child sexual abuse images unites peers and MPs in cross-party campaign

    ## Smartphones and tablets in UK would be prevented from viewing or creating illicit content by mandatory software on all devices

     ![](https://cdn.slowdownwiseup.co.uk/media/original_images/7c1e9d02c8efd2b17dca435af1c78889e92c43e1.jpg)

     ![Photo of Rachel Sylvester](https://cdn.slowdownwiseup.co.uk/media/original_images/Rachel_Sylvester_bw.jpg)

    Rachel SylvesterPolitical editor

    [Children](/tags/children)

    [Smartphones](/tags/smartphones)

    [Parliament](/tags/parliament)

    [Young people](/tags/young-people)

