  author: amiga386
  text: "&gt; you are running jellyfin on a device, like a NAS. it reports telemetry<p>Jellyfin
    Server packages are hosted on repo.jellyfin.org, so the Jellyfin organisation
    gets the data that you&#x27;re probably still running Jellyfin and want updates,
    not Microsoft. I will accept that if you use the Dockerised version, Docker or
    GitHub will get that data instead. None of this is &quot;telemetry&quot;, e.g.
    detailed usage information. It&#x27;s quid-pro-quo; you want to know if there
    are updates, you ask the update server, it records that your IP looked for updates.<p>Jellyfin
    Server collects data and stores it locally on your device in logs and its database
    (e.g. viewing data, login sessions). This data doesn&#x27;t leave your device.<p>What
    Jellyfin Server _will_ share a lot of, is data about your collection, to its metadata
    providers. You chose those when setting up your libraries. In return, they hand
    back nice metadata and pictures. So TheTVDB.com, OMDB, MusicBrainz and others
    you&#x27;ve configured, get queried about &quot;Film name (year)&quot; or &quot;TV
    series S01E01&quot; or &quot;Band name Album name&quot; and thus learn everything
    that&#x27;s in your collection... but not whether or when you&#x27;ve watched
    it."
