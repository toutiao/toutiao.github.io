    If no wake word is detected, the audio is processed locally, promptly deleted,
    and is not stored, converted to text, or transmitted.\n\nPanasonic:\n\nPanasonic
    did not provide an answer to this question.\n\nRoku:\n\n> While Roku TVs don’t
    have built-in microphones, some Roku remotes do. Standard voice remotes listen
    only while the mic button is held, and hands-free remotes can be switched off.\n\nWhile
