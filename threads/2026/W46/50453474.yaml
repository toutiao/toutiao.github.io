    press the microphone button on the remote control or they can use Hands-free Voice
    Control on supported models.Hands-free Voice Control is disabled unless a user
    opts into this feature and then uses a wake-word. Wake-word detection is performed
    locally on the TV. If no wake word is detected, the audio is processed locally,
    promptly deleted, and is not stored, converted to text, or transmitted.\n\nVoice
    recognition is off by default and operates only if the user has opted in by accepting
