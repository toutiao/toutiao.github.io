    RSS\n\n- Tech\n\n- Gadgets\n\n- Privacy\n\n# I asked every TV manufacturer 17
    questions about how they spy on you\n\nAfter LG was accused of spying through
    its TVs, I wanted to see how other TV companies were collecting and protecting
    our data.\uFEFF\n\n- Link\n\n- Share\n\n- Gift\n\nEvery TV company is spying on
    you, not just LG. Like other tech companies, they collect lots of information,
    and while some is necessary for products to work, not all of it is — and could
    include details you’d prefer to keep private. Many customers are concerned about
    how TVs and streaming devices might be spying: listening to what you say, taking
    screenshots of everything you watch, storing sensitive information on your TV,
    and sharing your data with the cloud.\n\nTo find out what TV and streaming device
    companies are doing, I decided to ask every one to explain itself. I put together
    17 yes-or-no questions, like “Do your TVs store any recorded audio, or transcripts
    based on audio, captured in the home?” so that companies couldn’t just link to
    a confusing and legalese-ridden privacy policy. TV users deserve to know the answers.\n\n##
    Company representatives providing responses\n\nAmazon: Eric Sveum, PR manager\n\nApple:
    Emily Ewing, public relations manager\n\nGoogle: Alex García-Kummert, spokesperson\n\nLG
    Electronics: Chris De Maria, director of public relations\n\nRoku: Sarah Novatt,
    spokesperson\n\nSamsung: Frank Giancamilli, corporate communications senior manager\n\nTCL:
    Rob Manfredo, head of communications and events\n\nOne month ago, I invited 11
    companies, including Amazon, Apple, Google, Hisense, LG, Panasonic, Roku, Samsung,
    Sony, TCL, and Walmart’s Vizio to share those answers. We now have answers from
    the top three TV manufacturers as well as every major streaming device company.
    Some companies declined to answer. Below, you can see and compare how each company
    answered (or failed to answer) each question and then decide how you feel. (One
    company, Hisense, ignored our emails entirely.)\n\nAs you’ll see them say, some
    of this data collection is opt-in, and you can often opt out. We know that many
    TVs use automatic content recognition (ACR) to figure out potentially everything
    we’re watching, and use that information to tailor ads, gather audience metrics,
    and serve up content recommendations based on our viewing habits. But though it
    sometimes seems like it’s required during the cavalcade of agreements thrown at
    us during setup, you can generally stop ACR even after you’ve agreed to it.\n\nOpting
    out might not be as effective as it should be, however. A recent Northeastern
    University study found that Walmart’s Vizio kept on sending data after an opt-out
    (Vizio told me it was “routine operational data used to support the Vizio experience,”
    not ACR), while traffic with both Samsung and Roku was limited, but not stopped
    completely.\n\nBelow are the answers to our 17 questions. You will notice that
    some companies would not answer yes or no. We’ve also noted where companies declined
    to answer at all or ignored the questions. If any company becomes willing to directly
    answer our questions, we’ll add their responses.\n\n### 1. Do your TVs ever use
    their embedded microphones, or the microphones in their remotes, to listen to
    sound in a customer’s home?\n\nAmazon:\n\n> No. Fire TV includes voice functionality
    to help customers use their devices and get to content they love and fast, not
    to surveil homes. The microphones on our voice remotes are designed to only work
    when the mic button on the remote is physically pressed. And TVs with hands-free
    Alexa are designed to detect the wake word (and only the wake word) before connecting
    to Alexa. No audio is stored or sent to the cloud unless the device detects the
    wake word. Customers can also turn off the microphones at any time. Every Fire
    TV smart television that has microphones also has a physical button or switch
    that disables the microphone.\n\nNo. Fire TV includes voice functionality to help
    customers use their devices and get to content they love and fast, not to surveil
    homes. The microphones on our voice remotes are designed to only work when the
    mic button on the remote is physically pressed. And TVs with hands-free Alexa
    are designed to detect the wake word (and only the wake word) before connecting
    to Alexa. No audio is stored or sent to the cloud unless the device detects the
    wake word. Customers can also turn off the microphones at any time. Every Fire
    TV smart television that has microphones also has a physical button or switch
    that disables the microphone.\n\nApple:\n\n> Apple TV 4K will use its far-field
    microphones and the Always On Processor strictly to listen for the Siri wake word.
    The Always On Processor does not process or act on any other sounds in the home.
    Users have full control over this and can turn off “Siri” or “Hey Siri” as a wake
    word, or disable Siri entirely. When using the Siri Remote, users must actively
    press and hold the microphone button for it to start listening.\n\nApple TV 4K
    will use its far-field microphones and the Always On Processor strictly to listen
    for the Siri wake word. The Always On Processor does not process or act on any
    other sounds in the home. Users have full control over this and can turn off “Siri”
    or “Hey Siri” as a wake word, or disable Siri entirely. When using the Siri Remote,
    users must actively press and hold the microphone button for it to start listening.\n\nGoogle:\n\n>
    If Google Assistant or Gemini is enabled or available, microphones (built-in hands-free
    ‘Hey Google’ or remote push-to-talk button) listen for activation triggers. Microphones
    remain in passive standby until triggered by hotword or button press.\n\nIf Google
    Assistant or Gemini is enabled or available, microphones (built-in hands-free
    ‘Hey Google’ or remote push-to-talk button) listen for activation triggers. Microphones
    remain in passive standby until triggered by hotword or button press.\n\nHisense:\n\nHisense
    did not respond to The Verge’s questions despite five attempts to make contact.\n\nLG:\n\n>
    Voice recognition is off by default and operates only if the user has opted in
    by accepting the Voice Information Agreement. Even if the user has opted in, they
