article:
  url: https://makepad.github.io/relax/
  title: 'Relax: Rust without the wait'
  fetch_status: success
  content: "This is the page's full text as plain HTML, for readers without JavaScript.
    The same text is in the [README](https://github.com/makepad/relax#readme) and
    on the [plain HTML page](retro/).\n\n# Relax\n\n**Rust without the wait.**\n\n**rustc
    builds your program, then you run it. Relax runs your program while it builds
    it.**\n\nRelax is a live compiler and JIT runtime for Rust, written in Rust. It
    runs a Cargo package straight from source, with no rustc, LLVM or linker in the
    loop: it compiles each function when it is first called, optimises the hot ones
    while the program runs, and patches your edits into the running process.\n\n##
    Relax vs cargo and rustc\n\n| | cargo + rustc | **Relax** |\n| --- | --- | ---
    |\n| **Large 3D game, clean checkout → first frame** | ~3 min build, then start
    | **11 s** on an M4 MacBook, straight from source |\n| **Same game, second run
    → first frame** | start the built binary | **1.15 s** on an M4 MacBook, nothing
    recompiled |\n| **Small app → first frame** | build it first | **3.7 s** cold,
    **0.41 s** warm (M4 MacBook) |\n| **Change one function in a running program**
    | rebuild, relink, restart: state lost | **patched in** : state kept |\n| **Save
    a file → 92 tests re-run** | rebuild the test binary first | **2.2 s** after the
    save |\n| **Type and borrow check** | `cargo check`; a build checks everything
    first | `relax check`; a run type-checks each function before it runs and borrow-checks
    in the background |\n| **Speed of optimised code** | 1.00× (`--release`) | **slower:
    1.12× the time on x64, 1.24× on arm64** (geomean of 21 workloads) |\n| **Needs**
    | rustc, LLVM, a linker | **one Rust library** : 438k lines, 0 crates.io dependencies
    |\n\nCode generation for x86-64 and AArch64; from a fresh clone the repository
    builds and its tests pass on Linux x86-64 and macOS arm64. Windows isn't tested.\n\n##
    The tradeoffs\n\n- **Slower optimised code.** Overall the code Relax runs is slower
    than rustc's `--release`: 1.12× the time on x64 and 1.24× on arm64 (geomean of
    21 workloads), 1.22× and 1.25× against a native-CPU build. It is faster on only
    a few workloads: see [where LLVM still wins](#plain-where-llvm-still-wins).\n-
    **More memory.** The compiler, its caches and every code version it publishes
    share your program's process, and JIT code is append-only. `relax inspect <pid>
    memory` shows the split, `code` the growth. The code cache in a package's `target/relax`
    takes 120 to 190 MB for `hello`.\n- **`relax check` isn't faster than `cargo check`
    yet.** On a large package a cold check takes longer and uses more memory than
    `cargo check`, and an edit can re-check more than it needs to. We're working on
    it.\n- **Not every crate runs yet.** [libs/relax/KNOWN\\_GAPS.md](https://github.com/makepad/relax/blob/main/libs/relax/KNOWN_GAPS.md)
    lists the open gaps, each with a repro.\n- **Not every edit patches live.** Function
    bodies do. A changed struct layout, import, trait or impl header, or macro waits
    for a restart, which Relax offers: `relax inspect <pid> session relaunch`.\n-
    **The borrow checker runs beside the program.** A run type-checks each function
    before it runs and borrow-checks in the background; `relax run --check-first`
    waits for the borrow checker instead.\n- **Not a release build.** Relax is for
    the edit-run loop. Ship what `cargo build --release` builds.\n\n## What you get
    from a JIT\n\n`relax run` prints a `relax-remote: pid <pid>` line. Every command
    below except `run` and `test` is `relax inspect <pid> <command>`, a question the
    running program answers while it runs.\n\n| | What it does | Command |\n| ---
    | --- | --- |\n| **Hot patching, state kept** | Save a file: the changed functions
    are rechecked, recompiled and swapped into the running program. A call into code
    that doesn't compile waits until an edit fixes it. | `relax run <package>` |\n|
    **Tests on save** | Keeps the tests warm and re-runs the ones that entered the
    functions you changed. | `relax test --live <package>` |\n| **Pause on panic**
    | A panic parks its thread with the stack intact: up to 10 minutes at a terminal,
    2 s when nothing is attached. Read its locals, evaluate Rust in its frame, then
    let it unwind, or rerun a `restartable` function from its entry. | `panics`, `locals
    panic=P1`, `eval <expr>`, `resume P1 panic` |\n| **Breakpoints, no debugger**
    | A hit parks the thread at the call with its stack intact. | `break <file>:<line>`,
    `locals break=K1`, `continue` |\n| **Hangs explained** | Deadlock, blocked, busy
    or idle: the verdict, the wait chain and the stacks of the threads in it. | `why-hung`
    |\n| **Profiling** | Samples JIT and native frames: CPU per thread, the top functions
    with their hottest line, a call tree with each frame's tier, folded stacks for
    flame graphs. | `prof s=3`, `prof view=tree`, `why-slow` |\n| **Flight recorder**
    | Always on, in bounded memory: the last minutes of threads, waits, compiles and
    events, saved by itself on a panic, a fault or a hitch over 1 s. | `rec save`
    |\n| **Memory and leaks** | Where the memory is (RSS by kind, malloc in use and
    held free, Relax's own share), and the program's heap by allocation stack, with
    leak candidates between snapshots. Heap tracking runs on Linux x86-64 and macOS
    arm64 only. | `memory`, `heap start`, `heap snap a`, `heap diff a now` |\n\n`relax
    inspect <pid> help` lists the rest, among them `asm <fn> vs=rustc` (the JIT's
    machine code beside rustc's), `count <fn>` (exact call counts) and `counters`
    (hardware counters).\n\n## Try it\n\nFrom a fresh clone, build `relax` and run
    a new package through the JIT:\n\n    git clone https://github.com/makepad/relax\n
    \   cargo build --release --manifest-path relax/Cargo.toml -p relax-runner --bin
    relax\n    \n    cargo new hello\n    cd hello\n    ../relax/target/release/relax
    run --quiet hello # run main under the JIT\n    ../relax/target/release/relax
    test hello # run its #[test] fns\n    ../relax/target/release/relax check hello
    # type- and borrow-check only\n\nRun `relax` in the package's folder and give
    it the package's name, not a path. It reads Relax's std from the checkout it was
    built in, so keep the `relax` folder where it is.\n\nMeasured from a fresh clone:
