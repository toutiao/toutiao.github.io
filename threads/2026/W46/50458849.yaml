  author: knuckleheads
  text: After working on <a href="https:&#x2F;&#x2F;github.com&#x2F;PowderworksCode&#x2F;headstart"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;PowderworksCode&#x2F;headstart</a>
    and some good conversations with the compiler team, I&#x27;ve been working on
    finding a way to make big changes to speed up rust while also respecting their
    wishes around the usage of LLM&#x27;s. I don&#x27;t really want to support a vibe
    slopped fork of rustc&#x2F;cargo that is full of patches that are pretty much
    immediately out of date, and I don&#x27;t think anyone else does either, at least
    not in a long term dependable way. I also don&#x27;t feel like recreating daemons
    from the ground up, I would rather build on top of what already exists and make
    that compile faster and have better performance.<p><a href="https:&#x2F;&#x2F;breakneck.powderworks.dev&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;breakneck.powderworks.dev&#x2F;</a><p>It&#x27;s
    not done yet nor do I have enticing numbers to show, but I think in a few weeks
    Breckneck Rust will be someplace nice. For big changes such as getting all crates
    in the same process, I&#x27;ve been having Claude develop and use a mass static
    code rewriting tool. So instead of having an agent go and found all the places
    where LOCAL_CRATE_ID is defined and used, a query finds it and then rewrites can
    target it and it&#x27;s surroundings.<p>My hope is that mass code rewrites are
    more acceptable to the compiler team, in that they can author, review and debate
    the rewrites ahead of time without any time pressure. Listening to the team, there
    were things they might want to do&#x2F;try (dropping memory, all crates in one
    process), but the changes are so comprehensive that to do them by hand is effectively
    a stop the world process. With mass code rewriting tools, it should be possible
    to rerun the rewrite on main whenever, and as well, any work that others have
    going on in pr&#x27;s can likewise be transformed without any impact. This way
    takes a bit of coordination, but not years and years of it.<p>Similarly, it&#x27;s
    not clear that any of the big changes are actually worth it yet. Maybe dropping
    memory is a meh, or compiling all the crates at once is not that big a win. I
    can run this on nightly and keep up to date with what&#x27;s going on there while
    experimenting with weird stuff, without wandering out into the wilderness with
    a hard fork. Maybe there&#x27;s a way to 100x perf on the other side, and if a
    pathway can be shown to get there in theory via agents, then the team can find
    their own path there that fits their attitudes around use or none use of agents
    and we all benefit. Exciting times!
