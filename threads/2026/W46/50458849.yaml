  author: wahern
  text: The borrow checker doesn&#x27;t rely on interprocedural analysis. The function
    prototype provides all the information needed to maintain lifetime invariants
    across functions, so given static typing already then interprocedural borrow checking
    is effectively zero cost at compile time. (Cf. Intraprocedural, non-lexical borrow
    checking.) So borrow checking is no impediment to dynamically replacing function
    definitions. And it would be less of a headache for intraprocedural REPL but-for
    non-lexical semantics. But in a REPL you could always use an interpreter for running
    a function currently being edited, then compile it down once complete. REPLs are
    a headache for languages like Rust because of static typing generally, generics,
    trait semantics, etc.
