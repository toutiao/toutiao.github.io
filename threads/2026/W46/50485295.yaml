    but that shouldn&#x27;t grant authentication by itself.<p>The Brazilian CPF is
    the same in identifying a person and being used everywhere, but it&#x27;s not
    used a the sole mechanism of authentication as often as the SSN is used, although
    when it is then it ends up suffering from the same problem.<p>The only way to
    really solve this is for governments to enforce that solely knowing these types
    of IDs can&#x27;t lead to any authentication, that&#x27;s unacceptable and should
    be treated the same way knowing the name of a person is (which funnily enough
    some governments also treat it wrongly in similar ways, but you get the point).
