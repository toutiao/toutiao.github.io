  author: rescbr
  text: You can&#x27;t vote with just a CPF. The cards aren&#x27;t issued since 2011,
    and they didn&#x27;t have a photo or anything like that. At that time, they were
    considered tax identifiers only. They moved to printing the CPF number on receipt
    paper when somebody requested it at the post office when they reached 16-18 years
    old, usually at the same time when one would request their electoral registration
    or when requesting an employment booklet. It was a rite of passage to the adult
    life. More recently all newborns receive a CPF number when they are registered
    on their birth certificate.<p>In any case, you have to vote with a photo ID document
    and you have to scan a fingerprint that was previously enrolled in the electoral
    justice courts or whenever you renew a driver&#x27;s license or photo ID. By now
    88% of the population have their fingerprints collected for electoral purposes.<p>In
    2023 a law was passed to deprecate state-level ID cards and numbers to use a single
    federal identifier, and since every economically active person in the country
    already had a tax ID, the government decided to use the same number.<p>I do think
    they cause unnecessary friction for non-residents though, because companies could
    simply accept passport numbers, as authorized by tax law, but I guess nobody gives
    this a thought.
