  author: rescbr
  text: In Brazil companies must have the purchaser&#x27;s (natural person or company)
    tax ID for invoicing purposes. Point-of-sale in-person sales transactions don&#x27;t
    require invoicing, just receipts, but any other commercial transaction does. Even
    returning merchandise that was bought with a receipt will require an inbound invoice
    and a CPF. Thanks tax evaders.<p>Maybe 30 years ago one could think of their CPF
    as a number to keep mostly private, but since a large part of the economy now
    goes through digital channels, a CPF is simply a person identifier rather than
    something secret.<p>Nobody trusts CPFs to be a secure identifier anymore. The
    backstop currently rests on biometric validation on B2C scenarios. For more secure
    purposes (like contracts) we have digital signatures backed by the gov.br infrastructure,
    which are widespread but requires acceptance by both parties, and also digital
    signatures backed by PKI like e-CPF and e-CNPJ that carries full validity by law
    and are equivalent to notarized signatures. Very few people have e-CPFs though.
