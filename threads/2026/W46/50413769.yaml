  author: ch4s3
  text: These are types. Cap(Io) is a type, and used to grant IO, but you can narrow
    to reads or writes of single files&#x2F;folders, network requests to single URLs,
    and so on. Needs is a declaration of the necessary Cap grant. The compiler will
    error on permissions that aren’t granted.<p>The Cap system is modeled on Eiffel
    and a series of papers I can link to later when I’m at my laptop.<p>It can audit
    dependencies for capability changes and can inspect binaries for undeclared IO.
    The run tool can analyze binaries and refuse to run a binary that tries to hide
    effects.<p>March’s capability system can be used to build binaries into a Linux
    sandbox so that you have multiple layers guarding prohibited actions.
