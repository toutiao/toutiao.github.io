  author: EGreg
  text: 'If you like having something for security — even in Node — check out something
    I invented, called SafeScript.<p>It’s for executing untrusted code written by
    others… a large subset of Javascript which guarantees the code can only call the
    Facades you inject, and you can hook and intercept anything. It works with callbacks
    and promises.<p>What’s more is that it runs in WebWorker sandboxes on the web,
    and uses a proxy to transparently make existing code make same method calls, or
    use existing objects, like window.document, but to safer versions, which only
    allow eg createElement.<p>And because SafeScript automatically awaits every async
    function, your synchronous calls to HTMLElement methods etc. will be proxied asynchronously
    and “just work” without changing the original JS code. SafeScript is robust enough
    that most existing JS components will simply work without changes when ported
    to SafeScript.<p>PS: It can also be embedded in PHP, so you can run untrusted
    handlers there, too, without worrying about PHP’s large security surface.<p>PPS:
    SafeScript is deterministic by default, so you can also get the same results across
    all environments or runs. You can set the random number generator seed yourself,
    or inject Date.now() as one of your APIs if you want.<p>Here it is. Should I do
    a Show HN?<p><a href="https:&#x2F;&#x2F;github.com&#x2F;SafeScript&#x2F;Safescript"
