  author: cadamsdotcom
  text: 'Re the first point: stdio only offers one way to interact with users. stdio
    is what pulls naive designers into this trap - untrusted output sharing a channel
    with trusted decision input.<p>Deno should disallow arbitrary output on stdout&#x2F;stderr.
    Even prefixing the lines won&#x27;t work because control characters like ^H are
    sent in-band and can delete the prefix.<p>The &quot;in-band vs. out-of-band&quot;
    is nothing new. Worth looking up 2600hz, the signaling frequency of the US phone
    system way back when. Pick up a handset, generate a 2600hz tone. Suddenly you&#x27;re
    talking to the call routing system. Only a few steps from there to free phone
    calling anywhere in the world. Call routing signaling should&#x27;ve been separate,
    out of band - but given the tech at the time they&#x27;d have needed extra wires
    for signal lines ($$$) so the tradeoff was made, risk accepted.<p>The phone system
    designers went for in-band signaling to save money. Deno doesn&#x27;t need to
    save money by running less copper so my money&#x27;s on naïveté. Which doesn&#x27;t
    bode well.<p>And the rest of the points made.. well yep the author is on point
    - made worse by Deno developers publicly defending their wrong choices.<p>Thankfully
    there&#x27;re great alternatives.'
