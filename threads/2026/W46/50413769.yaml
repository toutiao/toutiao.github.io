  author: amluto
  text: 'If I’ve understood this correctly, you’re using “capability” to mean something
    kind of like what Linux means: there is a collection of capability types, and
    each type is a singleton.  (And at least the beginning of your page does not clarify
    whether the distinction between “needs IO” and “Cap(IO)”.)<p>This is genuinely
    useful in a language, but I suspect it’s also pretty weak. Serious capability
    systems have capabilities that are instances of types, and two instances are not
    necessarily the same. For example, the capability to read one file is not the
    capability to read another file.  Singletons may still exist: the capability to
    read the system clock could reasonably be a singleton. (Or not: one may reasonably
    debate whether the cycle counter and the realtime clock are instances of the same
    type or not, and you’ll find that mainstream languages have what amount to very
    different answers to this sort of question.)'
