  text: Stripping out just the control characters isn’t enough. A lot of terminal
    control sequences start with a single control character followed by normal printable
    characters but such printable characters are part of the control sequence. And
    even when you strip out entire terminal control sequences there are still other
    Unicode characters that will play tricks. Examples include the Unicode right-to-left
    override, which is not an ASCII control character but a Unicode control character.
    There are also dozens of space characters that look like spaces but won’t be split
    by ASCII word splitting processing, etc.
