article:
  url: https://www.cnx-software.com/2026/11/03/when-will-this-stop-the-raspberry-pi-5-16gb-sbc-now-sells-for-385/
  title: When will this stop? The Raspberry Pi 5 16GB SBC now sells for $385 - CNX
    Software
  fetch_status: success
  content: "Raspberry Pi has announced yet another price increase, this time for most
    models with 16GB of RAM. The Raspberry Pi 5 16GB now sells for $385, an $80 increase
    compared to the last price hike in April, and the Raspberry Pi CM5 system-on-module
    gets a $40 increase, starting at $375 for the Lite model without wireless.\n\nThe
    “good news” is that the Raspberry Pi 500+ mechanical keyboard PC stays at the
    same price, starting at $410. I suppose they can afford it on that model, because
    it’s already richly priced and the demand must be lower than for single board
    computers and compute modules.\n\nHere’s the updated price list for the Compute
    Module 5 16GB variants.\n\nInterestingly, the price is the same whether we get
    32GB or 64GB eMMC flash.\n\nI still remember people complaining about the $120
    launch price of the Raspberry Pi 5 16GB. That was less than two years ago, and
    that price would feel like a bargain today. Of course, Raspberry Pi isn’t the
    only company impacted by high RAM prices this year. Here’s a recent list of price
    hikes for popular SBCs and SoMs:\n\n- April 1, 2026 – All Raspberry Pi boards
    with 4GB RAM or more get a price increase. The Raspberry Pi 4 3GB is launched
    to compensate somewhat.\n\n- July 22, 2026 – NVIDIA increases the price of Jetson
    modules and devkits by up to 101%\n\n- October 1, 2026 – Raspberry Pi 4/5 2GB
    boards aren’t immune and also get a price hike.\n\n- October 19, 2026 – The Arduino
    VENTUNO Q now sells for $399 instead of $299. In all fairness, the latter was
    an introductory price, so the higher retail price was expected.\n\nOf course,
    all other vendors like Orange Pi, Radxa, Hardkernel, Banana Pi, and so on, also
    had their own price increases, just not as broadly advertised across the web.\n\nSo
    when will this all end? It’s hard to know. Micron expects the RAM shortage to
    last at least until 2028, and SK Hynix thinks it could only be resolved sometime
    in 2030. On the flip side, the stock prices of memory vendors have cratered in
    recent months, as investors worry about the sustainability of profits, which could
    signal cracks in the current cycle. Some of their customers also struggle to get
    financing as the price of tokens keeps collapsing, and the profitability of AI
    is put into question.  The war in the Middle East is also a wildcard, as critical
    materials (e.g., helium) required for the manufacturing of wafers and chips could
    also experience shortages. We’ll have to wait and see.\n\nThanks to TLS and Anonymous
    for the tip.\n\nJean-Luc started CNX Software in 2010 as a part-time endeavor,
    before quitting his job as a software engineering manager, and starting to write
    daily news, and reviews full time later in 2011.\n\nSupport CNX Software! Donate
    via cryptocurrencies, become a Patron on Patreon, or purchase goods on Amazon
    or Aliexpress. We also use affiliate links in articles to earn commissions if
    you make a purchase after clicking on those links.\n\nIf people will stop buying
    in these prices, the price will go down. AI bubble also may burst in the meantime.\n\nThis
    is not limited to Raspberry Pis and is a disaster in progress for ALL products
    that use SDRAM. “AI” has long term contracts for almost all SDRAM production for
    at least the next 4 years. I’ve been through every RAM shortage since the original
    PC and there is nothing that even comes close to this. At this point only the
    “AI” bubble popping will bring an end to this before 2030.\n\n[ … maybe there
    will be new RAM/memory concepts, meanwhile(?), for shared memory (servers) with
    ‘high bw/low latency’ for device networks (but ‘lan’-connected means latency and
    limited to 1-10Gbit/s for most consumer devices, or usb3-levels(?)) and software
    (prerequisites, program ‘extensions’/’services’/’additions’/etc.) requiring at
    least 4GB (e.g. Win11, rec. 8GB) for useful ‘desktop profile’ usage(?) (thx) ]\n\nMeanwhile,
    right now on Amazon, a BOSGAME E5 Mini PC w/ Ryzen 3 5300U, 16GB DDR4, 512GB NVMe
    SSD, Dual 2.5G LAN | Triple 4K Display is going for $289 with free shipping. And
    that’s for a complete, much more performant machine.\n\nI like the Raspberries,
    but at that price they’re a hard pass.\n\nCrazy… I have one 8GB no emmc with original
    7″ touch display and housing if someone is interested. Here it’s collecting dust,
    barely used and no power supply. Sending within EU\n\nIs anyone actually buying
    those Pis?\n\nApparently yes. I’ve just received a quotation request for 150 pieces
    of Raspberry Pi CM5 16GB wireless…\n\nNew side business? \U0001F601\n\nPeople
    search for products they need, somehow end up on my website, don’t read the fine
    print, and send a quotation request. I get about 2-3 requests per week. \U0001F642\n\nDid
    you ever submit a bid? Maybe a new way to pay some extra bills \U0001F601\n\nwe
    will go back to Optane soon. A 32GB module connected to a PCIe 5.0 slot will do
    the trick, and save the day for people who want to use computer for daily use
    no stupid gaming.\n\nWe will not go back to Optane. It is dead, buried, non-competitive
    with NAND, and not a replacement for DRAM.\n\nThere is no reason to get rid of
    DRAM at all. Windows 11 (what normies use) already works with 4-8 GB, Microsoft
    just announced some changes that reduce RAM usage. Today’s high prices will eventually
    fall, DRAM will get denser, daily use requirements not involving local AI probably
    won’t scale up with the density/capacity increases.\n\nYep, 99% of the consumption
    these days comes from horribly designed programs and UIs that consume memory because
    the main goal was time-to-market with a target RAM envelope of multiple GB. I
