  text: '&gt; It looks like on Linux that the authors are obsessed with making the
    smallest possible binary instead of the smallest possible binary that runs anywhere.<p>Yep,
    the site offers a download link to a binary that should work everywhere (small
    JS detects OS and arch). The default Linux binary even has an embedded Unifont
