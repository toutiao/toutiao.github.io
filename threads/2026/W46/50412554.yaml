  text: |-
    The true vi:<p><i>Vi is actually one mode of editing within the editor ex. When you are running vi you can escape to the line
    oriented editor of ex by giving the command Q. All of the : commands which were introduced above are available
    in ex. Likewise, most ex commands can be invoked from vi using :. Just give them without the : and follow them
    with a CR.</i><p><a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50373004">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50373004</a><p><a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50403300">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50403300</a>
