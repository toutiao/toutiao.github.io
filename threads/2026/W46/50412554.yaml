    access the device without privilege). This latter also downloadable as .deb (Ubuntu
    and RaspiOS ARM too).<p><a href="https:&#x2F;&#x2F;gitlab.com&#x2F;bztsrc&#x2F;usbimager&#x2F;#usbimager"
