    forgotten about.<p>* <a href="https:&#x2F;&#x2F;man.dragonflybsd.org&#x2F;?command=ee&amp;section=1"
    rel="nofollow">https:&#x2F;&#x2F;man.dragonflybsd.org&#x2F;?command=ee&amp;section=1</a><p>*
    <a href="https:&#x2F;&#x2F;man.freebsd.org&#x2F;cgi&#x2F;man.cgi?query=ee&amp;manpath=FreeBSD+2.1.5-RELEASE"
    rel="nofollow">https:&#x2F;&#x2F;man.freebsd.org&#x2F;cgi&#x2F;man.cgi?query=ee&amp;manpath=FreeBSD...</a><p>But
    NetBSD and OpenBSD went their own ways on this, to the extent that NetBSD didn&#x27;t
    even <i>have</i> a non-vi-like editor in base until just a month or so ago.
