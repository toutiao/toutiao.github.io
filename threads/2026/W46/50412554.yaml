  author: rustyhancock
  text: PKG_PATH is set and pkg_add automatically adds details to make it point to
    a package.<p>With PKG_PATH set (he does it in the .profile in the blog post)<p>pkg_add
    pkgin becomes pkg_add <a href="https:&#x2F;&#x2F;cdn.NetBSD.org&#x2F;pub&#x2F;pkgsrc&#x2F;packages&#x2F;NetBSD&#x2F;$(uname"
    rel="nofollow">https:&#x2F;&#x2F;cdn.NetBSD.org&#x2F;pub&#x2F;pkgsrc&#x2F;packages&#x2F;NetBSD&#x2F;$(uname</a>
    -m)&#x2F;$(uname -r | cut -d_ -f1)&#x2F;All&#x2F;pkgin<p>So you can also just
    use the second command and not set PKG_PATH, or atleast not for every session.<p>I
    prefer to do it that way since pkgin has its own repository config, and if I use
    pkg_add after installing pkgin it&#x27;ll be to install packages from the pkgsrc
    and that might clash if PKG_PATH is set.<p>I know it seems contrived.<p><a href="https:&#x2F;&#x2F;www.netbsd.org&#x2F;docs&#x2F;pkgsrc&#x2F;using.html"
    rel="nofollow">https:&#x2F;&#x2F;www.netbsd.org&#x2F;docs&#x2F;pkgsrc&#x2F;using.html</a>
  score: 0
