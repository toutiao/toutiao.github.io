  author: skrellm
  text: 'May not work, OS dependent. According to POSIX &quot;sync&quot; flushes the
    file system level buffer cache of opened files, and not necessarily the block
    device cache inside the kernel. (Eg. &quot;sync&quot; flushes devfs under &#x2F;dev,
    so updates the &#x2F;dev&#x2F;sda directory entry, but maybe not the block cache
    of the (8,0) device.)<p>There&#x27;s a good reason why the dd command exists,
    believe me.<p>FYI: <a href="https:&#x2F;&#x2F;linux.die.net&#x2F;man&#x2F;2&#x2F;sync"
    rel="nofollow">https:&#x2F;&#x2F;linux.die.net&#x2F;man&#x2F;2&#x2F;sync</a> syscall
    is not the same as <a href="https:&#x2F;&#x2F;linux.die.net&#x2F;man&#x2F;2&#x2F;fsync"
    rel="nofollow">https:&#x2F;&#x2F;linux.die.net&#x2F;man&#x2F;2&#x2F;fsync</a>
    syscall.'
