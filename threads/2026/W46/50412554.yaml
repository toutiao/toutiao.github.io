  author: jandrese
  text: This is one of those things that SystemD can make more complicated.  When
    you DD a disk image on something it rewrites the disk header, which can cause
    SystemD to reparse the header and do some weird stuff with the device that causes
    the write to fail or get corrupted.  Etcher works around that problem.<p>That
    said, the more lightweight &quot;Disk Image Creator&quot; also gets around this
    problem without dragging in an entire self contained browser.
