  author: motbus3
  text: |-
    Caleb is right.
    Also it seems the results are not straightforward.<p>Let say you have a model that score 100 in a benchmark and you distill it into a model half the size. It has very few guarantees that it will score close to 100 again.<i>1<p>But I assume one of the hard problems is to know that the model might not perform well enough outside of the distillation part.<p>There is also another caveat that models do display some level of sub language control, by this I mean that innocuous text might contain information relevant for the own agent or for other agent with it shares tasks.
    (Like when your partner says there is nothing wrong)
    Because distillation uses very few resources, we don&#x27;t know exactly what gets send forward or not.</i>2<p>As Caleb said, many companies found that they can tune small open weight agents over procedural known tasks because that&#x27;s easy to inspect and check and because there is little space dor ai-loitering, it tends to be less problematic.
    The key difference, at least in my understanding, is that you are not concerned with the weights or reducing data. You are basically tuning agents existing weights to emulate another agent answer.<p><i>1 - The process of distillation is super effective for specific domains though.<p></i>2 - I know I will be called out for supposed AI mystery machine. What I mean is that Large models rely on latent reasoning and nuanced context, often lost during condensation. Distilling models to use fewer tokens or parameters makes predicting retained details difficult.
    Some papers suggest that model preferences introduced during training, whether intentionally or inadvertently, may be inherited by distilled and fine-tuned models.
