  author: calebkaiser
  text: 'There&#x27;s a lot of research along this particular line, if you&#x27;re
    interested!<p>This is a dataset basically constructed by taking a bunch of DeepSeek
    R1 trajectories and filtering out the incredibly long rambling ones: <a href="https:&#x2F;&#x2F;huggingface.co&#x2F;datasets&#x2F;open-thoughts&#x2F;OpenThoughts-114k"
    rel="nofollow">https:&#x2F;&#x2F;huggingface.co&#x2F;datasets&#x2F;open-thoughts&#x2F;OpenThoughts-1...</a><p>There&#x27;s
    also a bunch of RL research around strategies to coax the student model towards
    more concise trajectories.<p>In general, a lot of people in industry are finding
    cost savings these days by tuning a smaller model over longer agent trajectories
    (not exactly the same as distilling the reasoning traces, since those aren&#x27;t
    exposed by many frontier labs anymore) collected from their production agents.
    Typically works best when you have a pretty workflow-y agent whose tasks all share
    a similar shape.'
  score: 0
