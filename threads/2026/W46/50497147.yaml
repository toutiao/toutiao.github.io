  author: paul_nameless
  text: 'I run several agents at once. Playwright&#x27;s Chrome windows kept popping
    up and grabbing my keyboard, and headless got blocked by some sites and you can&#x27;t
    see easily what&#x27;s happneing.<p>agweb keeps what&#x27;s good about headless
    and still lets you watch. It never pops up or takes focus, and idle tabs get suspended:
    five idle pages sit at 0% CPU and 590 MB, vs 1.6 GB for Playwright&#x27;s Chrome.
    ⌘D shows every agent&#x27;s tabs live.<p>For agents, the commands mirror playwright-cli,
    which they already know. Each reply also says what the action changed (fetches,
    elements added or removed), so they need fewer snapshots, fewer tool calls and
    fewer tokens.<p>Also: one login shared by all agents through a named profile,
    fill --secret-cmd &#x27;pass show site&#x27; keeps passwords out of the transcript,
    and ask hands the tab to you for MFA or a CAPTCHA.<p>macOS 26+, WebKit only, no
    CDP.'
