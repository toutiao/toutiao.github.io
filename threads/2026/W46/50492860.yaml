  author: 3RTB297
  text: There&#x27;s a few reasons driving all of these things, and yes, climate change
    is largely not a top issue as it moves far too slow as compared to other reasons.<p>First,
    is that places where elephants live are facing increasing pressure from the outside
    due to human settlement. National parks established decades ago or longer have
    borders which face ever-increasing human populations right on them. Human-wildlife
    conflict and elephants raiding crops farmed right next to parks are incredibly
    commonplace.<p>Second, that national parks established decades ago in most places
    were not designed for wildlife corridors to connect the parks. The concept of
    a way for elephants to walk 100km or 200km to another park is a relatively new
    notion. So, already, roads, cities, railroads, etc. prevent long-range migration,
    if for no other reason than the landscape and water sources needed for those migrations
    are also great spots for people to get water and establish a town.<p>Third, that
    poaching has forced elephants to change their own patterns to consolidate. They
    are increasingly isolated because they now feel they need to form super-herds
    of 50-100 individuals just to survive in places lacking proper wildlife law enforcement.
    So the elephants themselves see more danger in leaving the herd than staying put,
    which obviously creates a genetic diversity issue, among other problems.<p>These
    are all very recent issues, maybe the last 50 years in some ways, but changes
    in behavior like super herds are maybe the last 10-15 years in certain areas.<p>Dying
    at accelerated rates could have a number of factors, including poaching, obviously,
    but also stress from being in areas where poaching happens frequently drives behavior
    changes that might not lead to long life spans. There could also (just a guess)
    that after CITES was established in the 1970s to limit the ivory trade, there
    might have been a relative population boom. Elephants have long life expectancy,
    and so you have the competing incentives of older elephants with longer tusks
    being poached more, competing for food more, and older elephants are cantankerous.
    If they get into a village to eat crops, they might be shot to prevent human death,
    or (as I&#x27;ve seen happen) might each a whole field of something recently sprayed
    with pesticide, which can and does kill elephants.
