  author: mmaunder
  text: Hi all. Thanks for the interest. I&#x27;m going to post an impromptu blog
    post here just explaining what this is. The rather unfortunate ground stop today
    made this unexpectedly useful with the pilots here on Orcas just to get a sense
    of the chatter in our airspace re the situation.<p>This is an ETTUS B210 attached
    to a dual 4090 box. It&#x27;s a polyphase channelizer that takes the entire airband,
    channelizes it using cuda code on GPU, demodulates it, detects transmissions,
    throws away data tx and then feeds the tx through a voice model I created for
    transcription. A separate LLM reads the transcriptions to create a situational
    awareness picture of the airspace.<p>I&#x27;m interested in open sourcing this
    and making it available for folks who can run an ETTUS B210 or high quality SDR
    with enoguh bandwidth and a local GPU machine, so that we can cover more airpsace.<p>This
    was born out of an incident we had not too long ago where a pilot around KORS
    (based at Friday Harbor) lost the engine in his 172, and put it in the water in
    front of a ferry and was picked up by the ferry. We&#x27;re a pretty close bunch
    on Orcas Island and we only heard about it days later via social media. That felt
    completely unacceptable, and I set out to create a radio that could monitor everything
    in real-time, all the time, and alert on emergencies. That has extended to transcribing
    and creating situational awareness for a chunk of airspace.<p>I&#x27;m an IFR
    pilot. I fly a T206H regularly in IMC around here and I&#x27;m a ground instructor.
    You can email me at mark@defiant.com or find me on x at mmaunder if you&#x27;d
    like to connect. I&#x27;m particularly interested in hearing from folks who can
    run a station on their own hardware and are under bravo or a charlie or even just
    somewhere interesting re airspace.
