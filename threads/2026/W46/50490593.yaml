  author: mmaunder
  text: Yeah sorry about that. This is a software defined radio based on a hangar
    at Orcas island, receiving the entire airband, channelizing it into over 700 channels,
    and then demodulating the channels and playing whatever is sent provided it&#x27;s
    voice. It also transcribes using a voice model and an LLM parses the output and
    attempts to create cards on the right hand side. It&#x27;s also trying to detect
    simulcasts and remove the duplicate transmissions. Hope that helps explain it.
    It&#x27;s also archiving everything so you can listen to old transmissions. Right
    now I&#x27;m working to keep the server up. Thanks HN. :-) For context, I&#x27;m
    a pilot based at KORS and a nerd.
