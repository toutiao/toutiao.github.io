  author: dcrazy
  text: Absolutely. It is a common Bay Area pastime to make the roughly one-hour drive
    to wine country and do tastings at one or more wineries.<p>A “wine club” is a
    discount purchase program. Virtually all wineries run one, as do some larger wine
    merchants like Total Wine. You commit to purchasing some number of bottles periodically
    (quarterly or semi-annually) at a discounted rate. Membership also usually includes
    free on-premise tastings, so when it’s time to make your purchase it’s very common
    to visit the winery, taste their current offerings, and come home with your selections.<p>This
    becomes impractical if you belong to several wine clubs or don’t live near wine
    country, and some of the retail-run clubs choose the wines for you. Hence my quip
    about UPS delivery. (Legality of alcohol delivery varies by state, as a legacy
    of the repeal of prohibition.)
