  content: "# A faster Easter date function\n\n## A very fast Easter \"computus\"
    algorithm, accurate over ±10 million years.\n\nThis post is a fun little side
    quest to kickstart my journey optimising _regional_ calendars.\n\n### Background
    \n\nComputing the date of Easter faster is not going to matter in any real application.
    Even&nbsp;in places where it might seem to matter, like high frequency trading
    applications, it is probably better to just use an in-memory lookup table for
    holiday dates...  \nHowever, no \"Fast Date\" series would be complete without
    some mention of this classic problem.\n\nThe rules for Easter were broadly decided
    at the First Council of Nicaea, organised by Emperor Constantine in 325 AD, ultimately
    landing on _the first Sunday after the first full moon, on or after March 21_.
    Later, for operational efficiency, the church defined _\"full moon\"_ according
    to a formula, which was eventually modified by Pope Gregory XIII in 1582 _(\"Gregorian
    Easter\")_, with the first Easter under the new rules applying in most Catholic
    countries the following year.  \nThe Church of England first observed the new
    date of Easter in 1753, but Eastern / Orthodox churches continue to follow the
    old rules.\n\nThis&nbsp;article is about the new \"Gregorian\" Easter, because
    it is much more complex and slow to compute. For more details on the underlying
    algorithm, you can see [Gauss's Algorithm on Wikipedia ![](/static/media/link-external.f2d3f5e2e0517a859106527b07648224.svg)](https://en.wikipedia.org/wiki/Date_of_Easter#Gauss's_Easter_algorithm)
    _(the first known self-contained function, which basically all later algorithms
    build on)_.\n\n### The Function \n\nThe code below runs really fast.  \nIt's around
    twice as fast as a standard easter function that you might find in a typical date
    library, and I suspect it may be the fastest one made so far \U0001F937.  \nPart
    of that speed is attributable to using **only 5 multiplications** _(whereas&nbsp;typical
    reference algorithms have 10 or more multiplications)_.\n\nThe accuracy range
    of around `-11m → +16m` years might seem a bit of overkill, but the reason I targeted
    this range is so that any date library that expresses dates via a signed or unsigned
    32‑bit \"rata die\", is covered by this function. This&nbsp;means that if you
    decide to not clamp the logic to years after 1582, at least it will return something
    resembling the correct rules, rather than garbage.\n\n**New Gregorian Easter Function
    \ \nGiven: `year` ∈ [-11,103,600 ... 16,663,835]  \nReturn: `month` and `day`**
    \ \n\n1. \n\n    u32 constexpr_SHIFT_= 400 * 19 * (25 * 30 * 2 - 39)\n\n2. \n\n
    \   u64 constexpr_M19_= (1 << 32) / 19 + 1 + (11 << 32)\n\n3. \n\n    u32 constexpr_M1C_=
    (1 << 32) / 100 + 1\n\n4. \n\n    u32 constexpr_M25_= (1 << 32) * 8 / 25 + 1\n\n5.
    \n\n    u32 constexpr_M30_= (1 << 32) / 30 + 1\n\n6. \n\n    u32 constexpr_M67_=
    (1 << 32) * 6 / 7\n\n7. \n\n    \n\n8. \n\n    u32_y_=_year_+_SHIFT_// Constant
    fold\n\n9. \n\n    u32_c_= (u64)_y_\\*_M1C_>> 32// y / 100\n\n10. \n\n    u32_a_=
    (u64)_c_\\*_M25_>> 32// c \\* 8 / 25\n\n11. \n\n    u64_b_= (u64)_y_\\*_M19_//
    Hi & lo bits\n\n12. \n\n    u32_d_= (u32)_b_> 0x90000000// (y % 19) \\> 10 \n\n13.
    \n\n    u32_e_=_b_>> 32// Metonic cycle \n\n14. \n\n    u32_f_=_c_- (_c_>> 2)//
    Julian map \n\n15. \n\n    u32_g_=_a_-_f_+_e_// Epact \n\n16. \n\n    u32_h_=
    (u64)_g_\\*_M30_>> 32// g / 30 \n\n17. \n\n    u32_i_= (_g_+ (_h_<< 1)) & 31//
    g % 30 \n\n18. \n\n    u32_j_= 31 -_i_- (_d_>=_i_)// Epact adjust \n\n19. \n\n
    \   u32_k_=_y_+ (_y_>> 2) +_j_-_f_// Weekday input\n\n20. \n\n    u32_m_=_k_\\*_M67_>>
    29// 7 - (k % 7)\n\n21. \n\n    u32_v_=_j_+_m_+ 115// Bit prep\n\n22. \n\n    u32_
    **month** _=_v_>> 5\n\n23. \n\n    u32_ **day** _= (_v_& 31) + (_v_>> 7)\n\n**New
    Gregorian Easter Function  \nGiven: `year` ∈ [-11,103,600 ... 16,663,835]  \nReturn:
    &nbsp;_Days since 22 March_ ∈ [0..34]**  \n\n1. \n\n    u32 constexpr_SHIFT_=
    400 * 19 * (25 * 30 * 2 - 39)\n\n2. \n\n    u64 constexpr_M19_= (1 << 32) / 19
    + 1 + (11 << 32)\n\n3. \n\n    u32 constexpr_M1C_= (1 << 32) / 100 + 1\n\n4. \n\n
    \   u32 constexpr_M25_= (1 << 32) * 8 / 25 + 1\n\n5. \n\n    u32 constexpr_M30_=
    (1 << 32) / 30 + 1\n\n6. \n\n    u32 constexpr_M67_= (1 << 32) * 6 / 7\n\n7. \n\n
    \   \n\n8. \n\n    u32_y_=_year_+_SHIFT_// Constant fold\n\n9. \n\n    u32_c_=
    (u64)_y_\\*_M1C_>> 32// y / 100\n\n10. \n\n    u32_a_= (u64)_c_\\*_M25_>> 32//
    c \\* 8 / 25\n\n11. \n\n    u64_b_= (u64)_y_\\*_M19_// Hi & lo bits\n\n12. \n\n
    \   u32_d_= (u32)_b_> 0x90000000// (y % 19) \\> 10 \n\n13. \n\n    u32_e_=_b_>>
    32// Metonic cycle \n\n14. \n\n    u32_f_=_c_- (_c_>> 2)// Julian map \n\n15.
    \n\n    u32_g_=_a_-_f_+_e_// Epact \n\n16. \n\n    u32_h_= (u64)_g_\\*_M30_>>
    32// g / 30 \n\n17. \n\n    u32_i_= (_g_+ (_h_<< 1)) & 31// g % 30 \n\n18. \n\n
    \   u32_j_= 31 -_i_- (_d_>=_i_)// Epact adjust \n\n19. \n\n    u32_k_=_y_+ (_y_>>
    2) +_j_-_f_// Weekday input\n\n20. \n\n    u32_m_=_k_\\*_M67_>> 29// 7 - (k %
    7)\n\n21. \n\n    **return** _j_+_m_- 3\n\nNote that this function contains more
    terms than traditional Easter functions, but bear in mind that the compiled assembly
    will be a lot smaller. So if you don't care about the speed, but want a tiny impact
    on binary size, that could be a reason to consider this function.\n\nThe rest
    of this post will briefly explain the tricks used in this function:\n\n- [Trick
    #1 - Aggressive Constant Folding](#trick1)\n- [Trick #2 - Never computing: _year
    mod 19_](#trick2)\n- [Trick #3 - Computing \"X − (Y % 7)\" without negation.](#trick3)\n-
    [Trick #4 - Computing MOD 30 faster with the mod-pad technique](#trick4)\n- [Trick
    #5 - The fancy day & month](#trick5)\n\n_See also [benchmark results](#benchmarks)._\n\n###
    Trick #1 - Aggressive Constant Folding [Deep link](#trick1)\n\n1. \n\n    u32
    constexprSHIFT = 400 * 19 * (25 * 30 * 2 - 39)\n\nYou'll notice that the very
    first thing we do is add a strange value `SHIFT` to the input value. This is done
    for two reasons:\n\n1. to move all dates to the positive domain to avoid complexity
    associated with signed operations\n2. but also importantly, to allow various constants
    throughout the algorithm to be factored out.\n\nFor example, most Easter algorithms
    have a term like `(5 + 8 * c) / 25`, where `c` is the century (`year / 100 + 1`).
    The term `25` in the calculation of shift is responsible for aligning the century
    such that the constant `5` can be removed, resulting in `c * 8 / 25`, which is
    then approximated in the final algorithm with a single mul-shift: `(u64) c * M25
    >> 32`.\n\nOther terms in `SHIFT`: `19, 400, 30` are all doing similar things
    related to the 19-year-cycle, 400-year-cycle, and mod-30 steps.  \nThe term `*
    2` is different. Without this term, the range of coverage would be -5,403,600
    → +22,363,835; which doesn't quite cover the range we wanted, which for signed
    32-bit rata die, is ±5.88m years. Including `* 2` increases the value of shift
    by exactly 5,700,000, which is how many years it takes for the Easter pattern
    to repeat, and gets the range we are after.\n\nIf you like this type of optimisation,
    but are not a fan of the low-level bit-shifting and so on, then you might prefer
    to use this function here below. It is a much more readable version of the function,
    which only has these higher-level optimisations applied.\n\nNote that unlike in
    the main function presented earlier, `MOD 30` needs to be a positive-modulus function
    (even for positive dates), and that the `nextSunday` helper is anchored to the
    internal logic of the function, not related to Unix day-counting.\n\n**Readable
    Easter Function  \nGiven: `year` ∈ [-11,103,600 ... 2-1]  \nReturn: _Days since
    22 March_ ∈ [0..34]**  \n\n1. \n\n    u32getEpact(u32_y_,u32_c_,u32_f_) {\n\n2.
    \n\n    u32_n_=_y_%19\n\n3. \n\n    u32_i_=i32(11\\*_n_-_f_+_c_\\*8/25)MOD30\n\n4.
    \n\n    **return** 31 -_i_- ((_n_> 10) >=_i_)\n\n5. \n\n    }\n\n6. \n\n    \n\n7.
    \n\n    u32nextSunday= (u32_k_) => 7 - (_k_%7)\n\n8. \n\n    \n\n9. \n\n    //
    Returns days since March 22:\n\n10. \n\n    u32simpleEaster(i32_year_) {\n\n11.
    \n\n    u32 constexprSHIFT = 400 * 19 * (25 * 30 * 2 - 39)\n\n12. \n\n    u32_y_=_year_+
    SHIFT\n\n13. \n\n    u32_c_=_y_/100\n\n14. \n\n    u32_f_=_c_-_c_/ 4\n\n15. \n\n
    \   u32_j_=getEpact(_y_,_c_,_f_)\n\n16. \n\n    u32_m_=nextSunday(_y_+_y_/ 4 +_j_-_f_)\n\n17.
    \n\n   "
