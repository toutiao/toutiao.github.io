  author: michaelt
  text: It looks like the author used Tesseract, a traditional OCR image with lineage
    going back to HP flatbed scanners in the 1980s [1]<p>Obviously, it&#x27;s been
    improved a lot since then - but traditional OCR is mostly about black text on
    white backgrounds. Or at least, the text being high-contrast relative to the rest
    of the document.<p>Light gold text on a white background, while there are black
    splatters? That&#x27;s the sort of thing it would struggle with for sure.<p>[1]
    <a href="https:&#x2F;&#x2F;static.googleusercontent.com&#x2F;media&#x2F;research.google.com&#x2F;en&#x2F;&#x2F;pubs&#x2F;archive&#x2F;33418.pdf"
