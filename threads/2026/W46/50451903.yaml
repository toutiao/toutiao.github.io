  author: nomel
  text: No, that&#x27;s absolutely not the perspective of the bean counters at hardware
    companies. The fuses are also for economic security. If someone wants more features,
    you make sure that they paid for them. You don&#x27;t give away higher tier SKU
    <i>functionality</i> for free. There was probably some cost&#x2F;engineering justification
    for it, possibly like you say! Maybe too high of yield. This will almost certainly
    be removed in the next revision, as have all the many other similar cases before
    it.<p>For those unaware, product tiers come naturally with IC&#x27;s, by disabling
    physical sections of the chip that can&#x27;t work due to inevitable manufacturing
    defects. You don&#x27;t throw defective chips away, you layout in a way where
    you can physically cut off those defective sections of the chip, with a saw and&#x2F;or
    with a fuse, in a way that minimizes lost sales. This works great in the beginning,
    when your yields are low and you&#x27;re still dialing in the manufacturing process.
    But, as yields increase, you might not have enough of the lower tier chips to
    meet demand. So you, just fuse otherwise good chips. Chips are cheap, after all!
    New revisions are <i>not</i> cheap, so features&#x2F;bugs like this can remain
    around for a while.<p>In both IC companies I worked for, had around 6 ICs. If
    you opened any of them up, you would see the <i>exact</i> same die in every one.
    After a couple years of great yield, you would then find half missing in the lowest
    tier.
