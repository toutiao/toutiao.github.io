    eFuse can be in one of two states (blown=1, unblown=0), and the 512 rows are divided
    into 4 regions:\n\n1. Regular fuses (rows 0-221). These are straightforward; often
    single (pairs of) fuses will map to an option word, such as OPT\\_ENABLE\\_FUSE\\_PROGRAM
