    | 1 | 2 | 4 |\n| NVLink | No | No | Yes |\n| ECC | No | No | Yes |\n| Multi-Instance
    GPUs | No | No | Yes |\n| NVDEC | 0 | 0 | 5 |\n\n## Hardware restrictions\n\nSo,
