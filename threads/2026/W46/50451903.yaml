    \   '-----------------------------------------------------------------------------'\n\nNVIDIA
    uses fuses for product segmentation, security features, and other fun access control
    features - and crucially, there are several functions where blowing a fuse on
    an NVIDIA die can grant you _more_ access, not less. In a properly secured design,
    a blown fuse should always induce a more restrictive state, because a blown fuse
    cannot be unblown in an economically feasible way. NVIDIA’s design allows one
    to _relax_ restrictions by blowing more fuses!\n\nIn this post, I will go over
    the GA100 die, its fuse controller, the use of VFI, and future research directions.
    I’ve decided to publish some of the work that enabled my research [here](https://github.com/kate-land/ga100vfi).\n\n##
    Acknowledgements\n\nMy work builds on [prior research by Jon Pry](https://www.researchgate.net/publication/408132536_A_Canary_in_the_Crypto_Mine_Defeating_Stack_Protection_in_a_GPU_Secure_Coprocessor)
    and numerous others who have dedicated much of their time towards better understanding
    the GA100 die. I am disclosing my findings subsequent to another security researcher
    independently discovering the same vulnerability; I believe it to be in the best
    interest of the public to make this information publicly available. These findings
    were disclosed to NVIDIA’s product security team ahead of the publication of this
    article.\n\n## GA100 versions\n\nThe GA100 is an NVIDIA die that has been used
    to power almost 20 different SKUs - the A100 being the most well-known variant.
    I won’t delve into [every SKU](https://www.techpowerup.com/gpu-specs/nvidia-ga100.g931),
    but I will present the GA100 manifestations that matter to my work, covering the
    different versions of the CMP 170HX and the A100.\n\nAs fabbed, the GA100 die
    has 128 SMs, 12 FBPs, 5 NVDEC units, a PCIe Gen4 x16 controller, and depending
    on the framebuffer size, comes with 4-6 stacks of HBM co-packaged with the die.
    NVIDIA uses eFuses for yield-control and product segmentation–undifferentiated
    GA100s turn into more restrictive variants based on defect testing and manufacturer
    demand.\n\nIn one of the most extreme manifestations of product segmentation,
    the CMP 170HX, an Ethereum mining card with nominally 8 or 10 GB of application-exposed
    framebuffer capacity, actually comes with, respectively, ~80 and ~40 GB of HBM
    onboard! This work chiefly centers around how to fully unlock and use that capacity.
    Previous work has made great strides in unlocking the GA100 via software methods;
    VFI takes us across the last mile.\n\n| SKU | Out-of-box | Software (cmpunlocker)
