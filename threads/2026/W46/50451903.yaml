  author: WarmWash
  text: With a bit of nuance of understanding it&#x27;s not that wild or egregious,
    and no one is really getting cheated.<p>Basically the high price of the fully
    unlocked models is what makes it possible to sell artificially limited models
    at the lower price point (while also offering the ability to possibly sell lower
    binned units). Basically you can gas the profit on the high-end to drive down
    the cost on the low end, but obviously this only works if you have a distinct
    High and Low end.<p>People think that if we banned this practice it would lead
    to the top shelf models being sold at the bottom shelf price. But that&#x27;s
    just naive market confusion. A ban would just mean that the top shelf unit at
    a higher price and the lower shelf unit at a higher price would be available.<p>There
    is no solve to the &quot;problem&quot; that results in &quot;High shelf unit being
    sold at lower cost&quot;, in fact the thing you are complaining about is already
    the closest to that ideal, as the manufacturer can leverage economies of scale
    to drive down costs across the product line.
