article:
  url: https://blog.kate.land/posts/using-voltage-glitching-to-unlock-the-a100/
  title: Using voltage glitching to unleash the A100 in my mining card · Kate's blog
  fetch_status: success
  content: "# Using voltage glitching to unleash the A100 in my mining card\n\n[View
    more blogs with the tag&nbsp;hardware](/tags/hardware/), [View more blogs with
    the tag&nbsp;security](/tags/security/)\n\nOn this page\n\n## Summary\n\nI’ve
    discovered a voltage fault injection vulnerability on the GA100 die, allowing
    an operator to blow arbitrary fuses. Utilizing this vulnerability, I’ve converted
    my CMP 170HX 8GB card into what is effectively an A100-80G! Further, my unlocked
    cards actually perform ~1.2x faster than a retail A100 by having all functional
    SMs enabled (~120-126, die-lottery dependent), rather than the yield-safe 108
    SMs NVIDIA chose for all production A100 cards. Finally, CMP-disabled features
    like NVLink, PCIe Gen4, NVJPG, NVDEC, MIG are all unlockable with this approach,
    though I haven’t specifically tested NVJPG/NVDEC/MIG.\n\nHere’s how my “A100-80G”
    appears and functions.\n\n_GPU inventory and topology_\n\n**GPU 0** 81920 MiBNVIDIA
    Graphics Device`00000000:81:00.0`\n\n**GPU 1** 81920 MiBNVIDIA Graphics Device`00000000:C1:00.0`\n\nGPU
    0 **NV12** GPU 1\nFull nvidia-smi output\n\n    $ nvidia-smi --query-gpu=index,pci.bus_id,pci.device_id,name,memory.total;
    nvidia-smi topo -m\n    index, pci.bus_id, pci.device_id, name, memory.total [MiB]\n
    \   0, 00000000:81:00.0, 0x20C210DE, NVIDIA Graphics Device, 81920 MiB\n    1,
    00000000:C1:00.0, 0x20C210DE, NVIDIA Graphics Device, 81920 MiB\n    \tGPU0\tGPU1\tCPU
    Affinity\tNUMA Affinity\tGPU NUMA ID\n    GPU0 X NV12\t0-127\t0 N/A\n    GPU1\tNV12
