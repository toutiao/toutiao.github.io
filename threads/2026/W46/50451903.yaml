  author: octoberfranklin
  text: "<i>there are several functions where blowing a fuse on an NVIDIA die can
    grant you more access, not less. In a properly secured design, a blown fuse should
    always induce a more restrictive state, because a blown fuse cannot be unblown
    in an economically feasible way.</i><p>Not really.<p>If the fuses are for security,
    sure.  But these aren&#x27;t.<p>These fuses are for economic extraction.  Doing
    it the way NVIDIA did it is a safety feature: it ensures that blowing a fuse will
    never destroy economic value -- it will never turn a card that was previously
    able to do something correctly into a card that can no longer do that thing correctly."
