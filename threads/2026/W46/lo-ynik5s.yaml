    Essentially, all three are required, because:

    DKIM signs the body, preventing the MIME From header from being spoofed. However, the DKIM signature does not have to be from the domain in the From header.
    SPF specifies who can use your domain in FROM in the SMTP session.
    DMARC requires, even if your policy is "none", that the SMTP session FROM and the MIME From header has the same domain (roughly, depending on if strict or relaxed) and that the DKIM signature is also in the same domain.

    Without DMARC, people can still spoof mail from your domain, they just need to provide their own DKIM keys on a domain they control. Without SPF, they can also claim that it was sent from your mail server.
    Email runs on ancient protocols, and we keep finding "new" ways they are broken, and kinda paper it over with extensions.
