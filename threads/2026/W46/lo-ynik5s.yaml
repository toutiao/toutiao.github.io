    Is there any reliable data on this?  As the article notes, even Microsoft, notoriously finnicky, was accepting mail without DMARC records just fine up until recently.   Google definitely accepts mail without either DMARC or SPF records.
    And while I agree with the philosophy of DKIM, SPF was a bad design that only makes sense in the rare cases where

    Your domain sends no mail at all
    You have a vast network of servers that all send mail uncontrollably, making DKIM impractical

    It should not be used for new deployments.
    Mail server administration is made worse by the fact that most advice and bad practices are cargo culted scare stories about the strange rituals necessary to appease the mail server gods.
    And yes, undoubtedly there are mail server admins somewhere who will drop your mail if your server doesn't have a SPF record, just as there are admins who block and drop on a variety of questionable reasons, such as spam content filters, long-dead RBLs, lack of reverse DNS, etc.
    If you make your "best practices" the intersection of the most strict and stupid practices of all mail server administrators in the world, you're obviously better off sending a post card.
