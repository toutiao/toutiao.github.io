    First of all, that requires a mechanistic interpretation of the standards that I don't think any of the large providers abide by.
    But even if this were the case, this argues for DMARC, not SPF.  SPF does not prevent a spammer from impersonating anyone, it's not applied during the HELO handshake.  It's a historical artifact that used to have a limited application in preventing backscatter spam.
    Not having an SPF record present actually removes an impersonation vector, as only DKIM records will be used as proof of alignment.
    Since requiring the envelope sender and the MIME From to be identical is extremely brittle anyway, we would all be much better off without it.
