  text: 'I&#x27;ve been struggling to memorize the entire guitar fretboard for several
    decades, and I blame the Germans! :-)<p>Context:<p>* in USA &amp; Canada, notes
    are a-b-c-d-e-f-g<p>* Where I&#x27;m born though, due to Germanic tradition and
    influence, b is called h. b-flat is b.<p>* Given that most teachers start you
    with C major, it was taught as c-d-e-f-g-a-h<p>* And of course, where I&#x27;m
    born, you&#x27;re first taught solfago (do-re-mi-fa-so-la-si&#x2F;ti-do)<p>So
    my brain never really learned to think of musical notes as &quot;alphabet&quot;.
    My natural inclination is solfago, and when I use the single letters, my brain
    interprets them as random string of letters that you have to think about every
    time (given that for whatever reason &quot;H&quot; is between &quot;A&quot; and
    &quot;C&quot;), rather than just alphabet. It&#x27;s like I have two parallel
    sets of neural pathways: Alphabet - no problem, I can do it forward and backward
    reflexively, vs Musical Notes - stop all trains, engage upper brain functions,
    this is the difficult one with no sense or reason.<p>Grrr, Germans :=D<p>... that
    being said, I&#x27;ll try the app :)'
