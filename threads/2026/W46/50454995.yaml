  author: jawilson2
  text: To me, the theory is as much a communication tool as a knowledge. It is a
    common language for musicians to communicate musical ideas, at a higher level
    than musical notation. E.g. I can go to a jazz open mic, someone says the progression
    is &quot;ii V I in Dminor&quot;, or a blues jam and its &quot;I IV V, A major&quot;,
    or a Grateful Dead-type jam and its all mixolydian in B, and everyone is on the
    same page out of the gate. The theory is you know all of the scale modes, AND
    what they are called, AND can tell another musician what you&#x27;re doing and
    why. Tons of people can play interesting things outside of the box, without know
    why or how it&#x27;s defined.
