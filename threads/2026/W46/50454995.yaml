  author: sublinear
  text: I was in some music classes early on (piano and guitar) and in band from middle
    school through the end of high school.<p>If I have perfect&#x2F;absolute pitch
    (very doubtful), it&#x27;s from having certain pitches absolutely <i>burned</i>
    into my brain. B-flat and F on brass instruments, C on piano, E on guitar, etc.<p>I
    can generally memorize and sing back the exact pitches of any song once I&#x27;ve
    heard it a few times. If I like the song enough, that pitch memory is forever.
    I will never sing it in the wrong key ever again and that&#x27;s actually how
    I get around in music. I can always play back the original song in my head like
    a tape recording. I learned the names of some chords a long time ago from my favorite
    songs and now <i>just know</i> them by heart when I hear them (add9, sus4, minor
    7th, etc).<p>Unfortunately, I cannot do this in reverse and name the notes or
    do any supernatural tricks like Rick Beato&#x27;s kid. I would have to hum every
    individual note for a little while and run through the chromatic scale in my mind
    to tell you the name.<p>I think to a large extent, it can be trained. I didn&#x27;t
    get started until I was like 8 years old and wasn&#x27;t always the best student
    either. I hesitate to call this relative pitch because I don&#x27;t need to hear
    an outside reference and I can very easily tell when an instrument is out of tune.
    I&#x27;m somewhere in between, and so are most band kids.
