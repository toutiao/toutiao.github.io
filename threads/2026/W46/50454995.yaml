  author: jawilson2
  text: In Miles Davis&#x27; autobiography, Davis talked about how they jammed a few
    times. Davis would tell him to play a particular chord or scale, and Hendrix had
    no idea what it was at first, e.g. &quot;try an E minor diminished yada yada there...
    a mixolydian scale would work on top of these changes...&quot;<p>Once Davis taught
    him the concepts he got them immediately, or it might be a chord he knew and played,
    but didn&#x27;t know the formal name of. So, he was a brilliant intuitive musician,
    but didn&#x27;t have the theory chops of someone who attended Juliard like Davis.<p>That
    is what we mean by Hendrix didn&#x27;t know the theory.
