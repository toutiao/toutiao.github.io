  author: scarecrowbob
  text: As a person who performs a lot of music on various instruments, playing in
    &quot;closed&quot; positions where you don&#x27;t know the note you&#x27;re playing
    is a just-fine strategy.<p>There are reasons why folks know the names of notes
    in some positions better than others.<p>When I was playing a lot of bass for folks
    in low rent with bands that were playing standard music and never rehearsing,
    I generally only paid attention to the low string and worked my parts out (often
    on the fly) around the relative pitches.<p>If you&#x27;re trying to keep up with
    the bass part on a song you&#x27;ve never heard before while performing it on
    stage, it&#x27;s much more relevant (and far easier&#x2F;faster) to know the position
    of the minor 3 note of the scale than it is to know what note is the minor 3.<p>Over
    the decades I play a lot more piano, and that changes.  I play a lot of blues
    and jazz but am quite poor at reading typical rep for the instrument.  While I
    started out mostly playing using chord fingerings (and inversions), the more I
    play the more specific I can get on my understanding of actual notes.  Because
    I&#x27;ve been playing a lot of clarinet (which forces me to transpose a whole
    lot, including reading a part and transposing on the fly), the names of specific
    notes has gotten a whole lot more important, but also easier with practice.<p>On
    the pedal steel (which I have only been playing for a decade on and am still coming
    to terms with), while I can pull all that knowledge I am still usually playing
    based on a notes position- I know what string&#x2F;lever combo is going to get
    the 6 note in a given scale rather than thinking &quot;I need to play an A to
    get this C chord to be a C6, and that&#x27;s this position on the neck with the
    BC pedals down or that position with the LKR lever pushed.<p>All that is to say,
    it&#x27;s okay to not know the names of notes if you understand their function
    related to the melody.
