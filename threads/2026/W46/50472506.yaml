  text: i have absurdly lightweight amounts of markdown within my projects that are
    meant to stay for the long term, a minimal agents.md, which whatever harness im
    using that day consumes, which maybe has some lines that point at another md file
    or two or whatever if i deem it vital for rules of a specific section<p>The real
    use for markdown for me and why i have a TON of markdown usage, is for planning
    tasks. these aren&#x27;t &quot;permanent&quot; or anything but end up in a very
    much archived section of the repo once concluded but will have commit ids and
    such attached so intent can be retrieved at a later date if needed, as well as
    session ids for whatever model&#x2F;harness i was using for that particular task.<p>It
    also serves another purpose of allowing me to nicely chunk up work as i see fit,
    so if i start a task in CC, and would prefer a section be done with some other
    model i can easily do so, or if i feel the work is suited to parallel sessions
    i can spin those up as well, with whatever models&#x2F;harnesses i want.
