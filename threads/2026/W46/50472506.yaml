  author: CrimsonCape
  text: 'The anecdote the author gave is already kind of outdated, since Claude will
    write tests and debug itself as it progresses. It doesn&#x27;t take much insight
    to realize that the maintainers are going to be AI.<p>Houses are still standing
    built with hand saws and elementary-school level tools; we don&#x27;t tear them
    down, just cut new pieces with power tools and bolt on new additions built with
    new pieces made from advanced tools.<p>Isn&#x27;t AI just another purity test?
    nasty VSCode users instead of pure elite Vim users?<p>While the maintainers surely
    will be AI, the last bastion is the architects. Claude can write the scaffolding,
    but does Claude know how the parts go together? Even the concept of fuzz-testing
    existing means that even humans can&#x27;t envision all the failure paths, so
    it would be unfair to hold the metric against AI. What we are going to see more
    of is the architectural failures: massive data breaches because the architecture
    aroung the breach will be reveaed to be laughably simple, from prompts that just
    didn&#x27;t know what to ask.'
