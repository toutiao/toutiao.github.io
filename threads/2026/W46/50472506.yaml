  author: BubbleRings
  text: 'Well, you&#x27;ve changed the subject but fine, let&#x27;s go there.<p>That&#x27;s
    one of the things that has drastically changed, in my opinion. One way to look
    at it could be: in the past it was okay to have a minimal design spec doc, if
    your programmer wrote excellent code and comments, and the system wasn&#x27;t
    too big.<p>But now, you can&#x27;t complete if you try to do it that way while
    not using AI. You need to take all that effort that used to go into good code
    and good comments, and put it into a good spec doc, and hand that file to the
    AI.<p>So that once the AI has built your system, you can say either &quot;hey
    AI, a bug just showed up in the widget area, go look at your strange spaghetti
    code of yours and the design doc and fix it&quot;, or, &quot;hey AI, the whole
    sub-system seems to have gone critical mess, take the code, spec doc, lessons
    learned, and the following few high-level design decision changes, and re-write
    the whole thing!&quot;<p>Apologies for bluntness, but there just isn&#x27;t going
    to be much need in this world for people that are excellent at hand-building intricate
    watches, in a world where $20 quartz-movement watches have appeared.'
