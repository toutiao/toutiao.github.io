  author: XenophileJKO
  text: Every time I see a comment like this I feel like you are only 50% into the
    transition that is occurring.<p>The crafting of the requirements is better suited
    to an interactive process. You will have superior results and a quicker turn around
    by having the AI research the change implications, what current implementations
    actually do and where (so you can look at the parts you want to), etc.<p>When
    working in a BIG codebase, having it detail up a flow of how all the parts fit
    together is great and helps get you setup to work. Then work through your planned
    constraints with the AI and make sure the perception matches your intent (with
    prevents a lot of issues that a fire and forget document creates).<p>Then when
    you are satisfied that it sees the problem as you do, have the model capture it
    and then let it rip.
