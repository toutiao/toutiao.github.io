  author: BubbleRings
  text: "&gt; &quot;...or the parts that have never once executed in production because
    they’re there for a worst case someone sat down and imagined.&quot;<p>Good stuff.<p>&gt;
    &quot;It’s the record of what the code was supposed to do ... written down somewhere
    a human or an agent can read them back. Ours are markdown files in git...&quot;<p>I
    keep getting surprised how many quite technical people I know are doing real work
    with AI but have never touched markdown.<p>If you are one of those people, allow
    me to offer a suggestion:<p>Stop. No more sending questions to ChatGPT or Claude
    until you do the following:<p>- Install Typora on your Windows or Mac machine.<p>-
    Write a .md (markdown text) file a full page long using Typora (or another editor
    that understands markdown, but Typora will do just fine). Make use of Heading
    1, Heading 2, and underline formatting, at least.<p>- Make the one page file be
    a complex request to an AI. Something like &quot;research x, compare it to y,
    make a guess what will happen in the future, here are some of my opinions and
    guesses, make your replies short, provide references&quot;.<p>Hand that .md file
    to your favorite AI. (Bonus points for using drag and drop or pointing the AI
    at the dir the file is in.) Look at your results. Make a change to your .md file.
    Hand it to the AI again, see the different results.<p>In my opinion, if you work
    on a keyboard and you&#x27;ve been making use of AI for the last 8 months, you
    should have done the above 4 months ago. Until you do, you will have a hard time
    understanding how drastically AI has changed almost all developer&#x27;s lives,
    and how it is changing more and more fields that are not software development."
