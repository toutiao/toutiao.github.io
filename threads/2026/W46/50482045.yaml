    countries have abandoned: national champions and cartel.<p>The EU, for all its
    faults, is a far more competetive environment than the US and has been for decades.  Air
    travel, telecoms, and banking are far more competetive than the US.  The US favors
    cartel systems so that there are a small number of airlines, telecom providers,
    foor companies, etc.  Strict competition rules make things like credit cards much
    cheaper (no &quot;points&quot; etc because there&#x27;s no money to fund them).
