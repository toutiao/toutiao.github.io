  author: regedit
  text: I started sketching an anti scraping access convention for Gemini that runs
    entirely on the server and needs no protocol changes. It would build on client
    certificates and the existing 6x status codes so OpenPGP key signs an attestation
    that binds the user TLS client cert to their PGP identity. Server then checks
    the web of trust from the operator trust roots. A trust path only makes someone
    eligible. A person still approves first time access so the web of trust mainly
    keeps the approval queue manageable (hopefully). Approved users get access limited
    to specific paths that expire quickly. They can renew by signing again without
    going through approval and revoking the PGP key ends access. Aim is more so accountability
    and per identity rate limits. It's obviously not perfect prevention since an approved
    user can still copy content but thats not the concern. Wondering how to distribute
    third party certifications now that keyservers strip them. The privacy cost of
    linking certs across capsules is probably going to be seen as a drawback by a
    lot of people but privacy is not the goal here.
