  author: AnthonyMouse
  text: The premise of &quot;the purpose of a system is what it does&quot; is that
    if it did something the people in control of the system didn&#x27;t want then
    they would change it, from which the implication is that they like what it does
    and want it to keep doing that, i.e. that&#x27;s the system&#x27;s purpose.<p>There
    <i>are</i> real instances of that happening, e.g. the purpose of zoning rules
    is to constrain the housing supply. It isn&#x27;t an unintended consequence, there
    are people in actual reality who lobby for things like density restrictions under
    disingenuous pretenses because &quot;we want to charge higher rents to tenants&quot;
    or &quot;we want housing prices to go up forever even if it means young people
    get priced out of home ownership&quot; are not sympathetic motives.<p>The problem
    is naturally that the quip is false whenever the reason the system fails is incompetence,
    lack of resources&#x2F;information, etc. rather than ulterior motives. Which is
    also why it&#x27;s a meme, because it&#x27;s essentially the inverse of Hanlon&#x27;s
    razor and therefore becomes the thing people reach for when they want to insinuate
    malice rather than stupidity.<p>The problem with both is, of course, that it isn&#x27;t
    <i>always</i> malice but it also isn&#x27;t <i>never</i> malice.<p>The example
    from the thread is basically perfect, because bureaucracy is both <i>at the same
    time</i>. Some of the rules were put there by honest people with honest goals,
    but not all of them. Meanwhile this (see &quot;General Interference with Organizations
    and Production&quot;):<p><a href="https:&#x2F;&#x2F;www.gutenberg.org&#x2F;ebooks&#x2F;26184"
    rel="nofollow">https:&#x2F;&#x2F;www.gutenberg.org&#x2F;ebooks&#x2F;26184</a>
