  author: nullc
  text: "&quot;The purpose of a system is what it does&quot; is, in my view, a statement
    about accountability.  It&#x27;s an answer to &quot;it causes this or that harm?
    Well, that&#x27;s not the purpose of the system&quot;.  We should reject those
    arguments: The purposes is what it does.<p>It takes a particular kind of rationalist-cult-addled
    weaponized autism to strawman this basic and important position. (not referring
    to you, of course :))<p>It might well be <i>literally</i> false in any specific
    case-- systems often have unintended and unexpected consequences and in large
    systems the unintended effects are often more significant than the primary effects.
    \ But it is <i>never</i> acceptable to dismiss those on the basis that they&#x27;re
    unintended.  We are no less responsible for the systems we create, control, and
    (often) impose upon others because of some argument about their &quot;purpose&quot;--
    and sure, sometimes the effect truly is intended and someone is just lying about
    it but we don&#x27;t need to go down that rathole.   If a system&#x27;s &#x27;purpose&#x27;
    was somehow different than what it does we must adapt it or abolish it, or otherwise
    we must admit that we accept what it does, that we expect and intend what it does
    to continue, and that we who are responsible for it are responsible for all its
    consequences-- what it does is its purpose either by actual intent or because
    we failed to eliminate the system.<p>If the standard of care of treatment for
    cancer treatment results in 30% mortality, and a facility achieves that-- then
    we can say that it&#x27;s purpose is to provide that standard of care.  The purposes
    is what it does doesn&#x27;t imply that such the facility it trying to kill people.
    \ It&#x27;s purposes is to provide a service which includes in its effect a level
    of mortality, and its existence is desirable in spite of the death because we
