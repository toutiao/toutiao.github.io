  text: I was reading this and a question came up. It ultimately works under the premise
    that there is only one ticket — so the conclusion is that the ticket must be ownership.<p>But
    if machines produce more, couldn&#x27;t the state provide free services rather
    than cash? In kind provision could be less dependent on wages than taxation is.<p>Then
    couldn&#x27;t we divide the monetary system further — not as banknotes, but by
    subdividing it? Would the administrative system be too difficult after all?<p>In
    other words, if the problem is that only the &quot;wage&quot; earned for participating
    in production grants the right to consume, then shouldn&#x27;t tickets to the
    means of production also be distributed?<p>Still, no matter how I think about
    it, in the end it comes down to the problem of distribution. The OP also gives
    capital ownership as an example, but...<p>If automation can enable substantial
    production without human labor, then what on earth is the reason we should keep
    demanding that humans do wage labor for survival? I find myself thinking about
    this a lot these days.<p>Someone who did not participate in production can consume
    the product because they own capital. Then what is the basis on which that right
    arises?<p>In fact, economic logic, when you think about it, seems to be mostly
    a kind of circular reasoning. It says &quot;capital&#x27;s share equals its marginal
    contribution,&quot; but that market itself is ultimately something created by
    power.<p>Sometimes I have thoughts like this. In fact, the core of capitalism
    is the ownership of the means of production, and such ownership will keep accumulating
    ever-widening disparities. If automation keeps advancing, humans will eventually
    become unnecessary — and then how will the market be maintained? We cannot give
    everyone a claim on automated production. In the end, a ruling class and a ruled
    class will inevitably exist, and the question becomes how the ruling class can
    rule entirely with the consent of the ruled. Lately, it seems this principle no
    longer works in capitalism.
