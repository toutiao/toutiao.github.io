  text: "<i>On the Principles of Political Economy and Taxation</i> by David Ricardo.<p>This
    book is most famous for being misquoted by nitwits trying to argue that globalization
    is always good for everyone, but if you had asked David Ricardo he would have
    said his most important result was that of <i>Rent</i> (later specified as <i>differential
    rent</i> or <i>Ricardian rent</i>), the idea that economic productivity tends
    to get squeezed onto land prices. A modern update would argue that this applies
    to assets more generally. Assets go up by squeezing productivity out of the main
    economy. Whether you think this is brilliant or terrible depends largely on whether
    you own lots of assets."
