  text: |-
    I'm not blaming them for Brexit, I'm blaming them for how they handled Brexit.
    They could've grandfathered old registrations in. This isn't a free, tax-funded service - you have to pay for domains, and even despite .eu's low cost I bet it could cover all the administrative costs. Even if it somehow wouldn't, you could bump up the cost for grandfathered British citizens or something.
    But let's say you absolutely do not want the British to have .eu domains. You could at least reserve the domains they used to own, instead of selling them to other people. Keep in mind that, for example, there isn't a standard way to revoke an email address. If you lose your domain, I can buy it and receive all the email that was meant for you. Are you sure that you updated it everywhere?
    Allowing this to happen is unacceptable behavior from a registrar.

    Besides, let's step back for a moment. What, exactly, is the point of preventing British people from having .eu domains? Is it a disgrace to the TLD? Do you not want them to potentially misrepresent themselves as affiliated with the EU? Well, resellers such as njal.la still offer .eu domains, and I assume you could buy one just fine even if you're British.
    I don't think that's a great option for regular people (I'd rather actually own my domain), but if you want to do... whatever this was meant to prevent - you probably don't mind.
    There's even precedent for letting non-EU citizens buy .eu domains officially - Iceland, Liechtenstein, and Norway got into the list because they're part of the EEA. They could've just put Britain on that list too.
