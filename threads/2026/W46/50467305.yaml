  text: 'Interesting. Generally, waterborne freight is far cheaper than rail. Also,
    at least sometimes you might need to transfer between modes - ship to rail then
    rail to ship. But with the underwater catenary solution now we&#x27;re talking
    about new infrastructure (not to mention R&amp;D, etc.).<p>As a sort of transitive
