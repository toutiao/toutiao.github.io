    competitive to standard waterborne energy costs, it beats rail easily. If the
    underwater catenary is not competitive, it has no value anyway.<p>It could still
    have value if we price in, as we should, the externality of GHG output. THe underwater
    catenary could reduce GHG output in busy waterways by powering boats that don&#x27;t
    have batteries.'
