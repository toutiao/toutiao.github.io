  author: namibj
  text: |-
    Assuming 100$&#x2F;kWh and those 2G$ (giga&#x2F;billion), a full charge would be 20 GWh.<p>Realistically: probably exposed wire like on regular high voltage pylons.
    Hooked to a not-too-far (the wires will be on the larger end, but you likely don&#x27;t want the other end to be anywhere it could get in the way of cargo operations, and given the voltages involved, you can probably get half way across the city before it really begins to matter) grid battery bank that normally takes care of day-to-day scale grid balancing&#x2F;energy arbitrage.<p>Then you just run a (group of) wires to the ship and apply basically the same principles as those DC fast charge stations for cars, except that you feed the high power DC link of the charging cable from the shore-side battery through much more efficient and importantly cheaper DC&#x2F;DC regulators instead of involving transformers and AC.<p>You obviously have remote-controlled switches and circuit breakers to keep those cables grounded while the workers hook them up.
    You&#x27;d probably have several DC links that have their own DC&#x2F;DC regulators and can be split between ships.
    Mostly also because there&#x27;s a limit to how high-current any individual cable&#x2F;connector is made in practice and because you want to use the current rating on your DC&#x2F;DC converters and the thick-but-off-the-shelf cables between the battery park and the pier.<p>Note that these are huge: the largest grid battery plant in operation (according to <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Battery_energy_storage_system" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Battery_energy_storage_system</a> ) is only 4GWh, so 1&#x2F;5th of such a ship.
