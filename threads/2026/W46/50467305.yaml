    they burn other fuels to make ethanol.<p>That doesn&#x27;t include the costs of
    farming the corn.<p>[1] <a href="https:&#x2F;&#x2F;energy.sustainability-directory.com&#x2F;learn&#x2F;how-does-the-eroi-of-corn-ethanol-compare-to-that-of-gasoline-or-cellulosic-ethanol&#x2F;"
