  text: '&gt; We already have an entire, scaled up industry of producing artificial
    fuel in a non-petrochemical route: It&#x27;s where the ethanol in your gas tank
    comes from.<p>Ethanol as a fuel is mostly a subsidy for US farmers. The net energy
    gain is low.[1] Ethanol plants need a lot of heat energy to process corn into
