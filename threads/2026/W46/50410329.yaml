  text: "&gt; <i>Simon Winchester was born in London on Sept. 28, 1944. He was the
    only child of Bernard and Andrée Winchester (de Wael.) By some accounts, his father,
    a British soldier, was imprisoned in Nazi Germany at the time of his son’s birth.
    In interviews, Mr. Winchester has frequently suggested that, when he returned
    from captivity, his father was not enthusiastic about his young son and sent him
    to boarding school in England at around the age of 5.</i>"
