  author: FatalLogic
  text: '&gt;<i>This is done by publishers all the time</i><p>Also, to emphasize that
    point, book titles can be changed even more in translation to other languages.
    There are many examples, and the weirdest are probably titles that are translated
    between languages like Japanese, Chinese and Korean to European languages.<p>A
    simpler example is Huxley&#x27;s &quot;Brave New World&quot; which became “The
    Best of (All) Worlds” in some French editions[0]. It&#x27;s a literary allusion
    which is meaningful in that culture.<p>[0] <a href="https:&#x2F;&#x2F;fr.wikipedia.org&#x2F;wiki&#x2F;Le_Meilleur_des_mondes"
