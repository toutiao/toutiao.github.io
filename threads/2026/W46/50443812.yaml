  author: philipwalton
  text: 'It&#x27;s currently being added to WebKit: <a href="https:&#x2F;&#x2F;github.com&#x2F;WebKit&#x2F;WebKit&#x2F;pull&#x2F;73271"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;WebKit&#x2F;WebKit&#x2F;pull&#x2F;73271</a><p>Regarding
    corporate incentives: I was involved in the design of this API, so I know the
    history. It was proposed many years ago as a solution to make it easier for RUM
    analytics providers to measure Core Web Vitals metrics that needed to account
    for more than just page load (e.g. layout shifts and slow interactions can happen
    any time, not just during page load).<p>The RUM providers we worked with were
    reluctant to wait until page <i>unload</i> to send telemetry data because it resulted
    in too many lost beacons, so what they do instead is send beacons every few seconds
    with the most up-to-date payload.<p>The `fetchLater()` API enables them to send
    just one beacon, which is good for users and also reduces their server load.'
  score: 0
