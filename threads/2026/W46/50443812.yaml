  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n# Modern Web Guidance\n\nModern Web Guidance is a set of skills
    that embed web platform expertise, best practices, and browser compatibility data
    directly into your coding agents. It helps to steer your coding agents away from
    legacy patterns, and instead toward solutions that harness the power and capabilities
    of the modern web platform.\n\nStewarded by the Google Chrome, Microsoft Edge,
    Mozilla Firefox, and MDN teams, alongside the web development community.\n\nDocumentation
    · Eval Dashboard · Source Code · Report an Issue\n\n## Quickstart\n\nnpx modern-web-guidance@latest
    install\n\nThis command runs an interactive wizard to install Modern Web Guidance.
    See Alternative Installation Methods below.\n\n#### Try it out (without installing)\n\n#
    Search for relevant guides npx modern-web-guidance@latest search \"animate a dialog
    modal backdrop\" # Retrieve a guide by ID npx modern-web-guidance@latest retrieve
    \"animate-to-from-top-layer\" # Scan a codebase for legacy patterns to modernize
    npx modern-web-guidance@latest legacy-scan .\n\n## Why?\n\nCoding agents often
    default to older patterns because LLM training data contains vast amounts of legacy
    code. This often leads them to generate bloated JavaScript for tasks that now
    have native, high-performance web platform solutions.\n\nEven if a model knows
    an API exists, it often lacks the density of real-world, modern implementation
    patterns required for production-ready code.\n\nModern Web Guidance bridges this
    gap. Our skill's CLI returns targeted, expert-curated guidelines directly into
    your agent's context window, focusing on:\n\n- Modern Browser APIs: Helping models
    correctly structure APIs they frequently misuse.\n\n- Performance & Accessibility:
    Preferring platform-level APIs that can be optimized by the browser and include
    built-in accessibility affordances.\n\n- Responsible Fallbacks: Guiding models
    to use sensible, lightweight fallbacks instead of heavy polyfills or legacy libraries.\n\n##
    What's Included?\n\nWe cover the past several years of the web platform's new
    features, all the way up to the cutting edge. The guides are designed to be token-efficient;
    we run evals enabling us to prune lowest-common-denominator content that models
    already know.\n\n### Core Disciplines\n\n#### \U0001F3A8 User Experience\n\nSmooth
    visual states (View Transitions, entry/exit animations, parallax scroll, CSS scrollbar-color).\n\n####
    \U0001F4D0 CSS Layout\n\nModern layout systems (container queries, subgrid, modern
    color spaces like oklch, text-wrap tuning, and line-height trimming).\n\n####
    ⚡ Performance\n\nSpeed optimizations (instant preloading, Interaction to Next
    Paint (INP) diagnostics, and scheduling tasks via scheduler.yield).\n\n#### \U0001F4DD
    Forms & UI\n\nNative components (Anchor Positioning for tooltips, Popover API,
    dialogs, :user-invalid validation, and auto-sizing fields).\n\n#### ♿ Accessibility\n\nImportant
    considerations (screen reader and keyboard operability, content navigation and
    discoverability).\n\n#### \U0001F916 Built-in AI\n\nLocal client models (native
    translation, summarization, and language detection APIs).\n\nView an example:
    the navigation-drawer guide.\n\n#### The full list\n\n### CSS & Layout (140 features)\n\n###
    HTML & DOM (36 features)\n\n### JavaScript & APIs (74 features)\n\n### accessibility\n\n-
    accessible-error-announcement: Synchronize programmatic accessibility states (like
    aria-invalid) with the visual :user-invalid state to ensure screen reader users
    receive error feedback only after interaction, mirroring the visual experience.\n\n-
    accessible-generated-content: Use CSS generated content (::before/::after) in
    ways that stay accessible, including alternative text for decorative content.\n\n-
    respect-os-text-scale: Respect the operating system's text scale preference for
    a page so font sizes, layout, and rem-based measurements follow the user's accessibility
    settings.\n\n### built-in-ai\n\n- language-detection: Detect the language of user-generated
    content or already present site content.\n\n- language-model: Run on-device natural
    language inference in the browser using the Prompt API, with streaming output,
    structured JSON responses, and multi-turn session management.\n\n- summarizer:
    Summarize text content using the on-device Summarizer API.\n\n- translator: Translate
    text between languages using the on-device Translator API.\n\n### css\n\n- animate-to-intrinsic-sizes:
    Smoothly animate interactive components (like accordions, menus, and expanding
    cards) to and from their natural dimensions.\n\n- atrule-support-conditionals:
    Conditionally apply certain CSS rules or declarations only if a certain at-rule
    is supported by the browser.\n\n- calculate-with-intrinsic-sizes: Calculate the
    size of an element based on its intrinsic size, while ensuring it fits within
    given design constraints.\n\n- child-state-based-styling: Build a component that
    changes its styling based on the state of one of its child elements. For example,
    a component that renders in light or dark mode based on whether a theme toggle
    is checked (or not).\n\n- content-based-styling: Build a component that changes
    its layout based on whether it contains specific child elements (or not). For
    example, if the component contains an image, use a multi-column layout, otherwise
    default to a single-column layout.\n\n- css: Action-oriented guidelines for modern
    CSS architecture, including the cascade, selectors, scoping, nesting, and design
    tokens. Use this guide when authoring styles or managing design systems.\n\n-
    css-layout: Modern CSS layouts such as flexbox, grid, subgrid, container queries,
    anchor positioning, and intrinsic sizing. Use this skill when architecting responsive
    UI components or page layouts.\n\n- design-token-reactivity: Define higher-order
    design tokens, like density modes (compact, comfortable, spacious) or themes and
    have descendant components react to changes directly and in component-appropriate
    ways.\n\n- dynamic-sibling-styling: Create dynamic visual spectrums or layout
    arrangements that automatically adapt to the number of elements in a group.\n\n-
    fluid-scaling: Scale items like font size, spacing, and media sizes smoothly based
    on the parent container's size rather than using fixed breakpoints\n\n- individual-transform-properties:
    Animate or override individual CSS transform properties (e.g. translate, rotate,
    scale) independently of other transform properties on a single element.\n\n- overflow-clipping-control:
    Adjust the visible clipping boundary of an element to align with the content edge,
    padding edge, or border edge—or a specified offset from any of these—offering
    finer-grained control over how content is clipped.\n\n- reduce-style-repetition:
    Reduce excessive style repetition by encapsulating complex or dynamic styling
    logic into reusable functions (such as a function that computes a gradient based
    on a set of input parameters).\n\n- responsive-design: Build UI that adapts to
    container and viewport size, including container queries, dynamic viewport units,
    aspect ratios, and responsive typography.\n\n- selector-atrule-combinations: Target
    elements based on the intersection or union of selectors and conditional @-rules
    while minimizing repetition.\n\n- size-aware-styling: Build a component whose
    styles can be conditionally dependent on its own width or height, rather than
    the width or height of the viewport. For example a card component that can change
    its layouts depending on how large it is, or a call-to-action button that can
    conditionally display helper text based on its width.\n\n- style-parent-with-has:
    Style parent elements of a form field (e.g. labels or fieldsets) when the field
    is invalid.\n\n- usage-aware-component-variations: Build components that adapt
    visual logic based on semantic context using CSS container style queries.\n\n###
