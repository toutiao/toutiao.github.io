  author: philipwalton
  text: If your feature use policy is that you will <i>never</i> use any feature unless
    it&#x27;s supported in at least X, Y, and Z browsers, then yes something like
    this would be possible. But most sites don&#x27;t have a policy like that.<p>Most
    sites are willing to use <i>some</i> features as a progressive enhancement, whereas
    other features they won&#x27;t even consider using unless it&#x27;s in 99+% of
    their users&#x27; browsers.<p>And unfortunately there&#x27;s no easy way to make
    that decision for users on a feature-by-feature basis, because it all depends
    on what use case they&#x27;re trying to accomplish, and what will happen if the
    feature is not available (given that particular use case).<p>So our approach is
    to (1) explain in the guide how to implement the use case with the modern feature,
    (2) explain why the modern feature is the preferred solution (e.g. what the user
    benefit is), and then (3) explain how to implement a fallback solution if the
    feature is not available.<p>I think we could potentially experiment with some
    version of what you&#x27;re describing, like a config option where we only surface
    guides that have robust, widely-available fallbacks, and where we have high confidence
    that it makes sense for the majority of sites to be following the recommendations
    in the guide.<p>I&#x27;ll raise it with the team.
  score: 0
