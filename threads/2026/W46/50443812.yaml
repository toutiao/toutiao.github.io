  text: 'Agreed the line can be blurry, but I want to stress that the goal of this
    project is NOT to push Chrome-only APIs on users.<p>The mental model we&#x27;ve
    been using on the team is:<p><i>If you hired an expert web development consultant
    to build X, what would they recommend as a best practice? When does it make sense
    to use the new API (because it provides real benefits) vs. when does it make sense
    to wait until it&#x27;s available everywhere?</i><p>To use your `fetchLater()`
    example, this is a case where the `fetchLater()` API legitimately solves a very
    real problem for people trying to build accurate analytics or telemetry features,
    see: <a href="https:&#x2F;&#x2F;nicj.net&#x2F;beaconing-in-practice&#x2F;" rel="nofollow">https:&#x2F;&#x2F;nicj.net&#x2F;beaconing-in-practice&#x2F;</a><p>And
    lots of companies actually are  already using `fetchLater()` in production now
    because of its increased reliability.'
