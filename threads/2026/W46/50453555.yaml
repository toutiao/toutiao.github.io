    RSS\n\n- Tech\n\n- News\n\n- Apple\n\n# Apple is killing its Support Community
    forum next week\n\nThe Apple Support Community platform is now read-only, and
    will permanently close on November 20th.\uFEFF\n\nThe Apple Support Community
    platform is now read-only, and will permanently close on November 20th.\uFEFF\n\n-
    Link\n\n- Share\n\n- Gift\n\nIt’s the end of the road for the Apple Support Community.
    The dedicated discussion forum, which gave Apple users a place to exchange advice,
    troubleshoot, and generally chat about Apple products, has been placed into read-only
    mode, with a message from the company announcing that the Support Community will
    shut down for good on November 20th.\n\nHere’s the full banner notice that’s currently
    displayed on the website:\n\n> “The Apple Support Community will permanently close
    on November 20, 2026. Starting today, the site will no longer accept new posts
    and is available in a read-only state. You can continue to find trusted guidance
    and support on the official Apple Support site. We want to thank the community
    members who have contributed their time and expertise to help others with their
    Apple products.”\n\n“The Apple Support Community will permanently close on November
    20, 2026. Starting today, the site will no longer accept new posts and is available
    in a read-only state. You can continue to find trusted guidance and support on
    the official Apple Support site. We want to thank the community members who have
    contributed their time and expertise to help others with their Apple products.”\n\nThe
    Apple Support Community has undergone several name changes over the years, but
    its history as an online forum for providing user-to-user tech support goes back
    to 1998, when it first launched as the Apple Tech Exchange. Apple hasn’t specified
    what will happen to the decades worth of Support Community posts when the platform
    shuts down next week. Presumably, they’ll all disappear with it.\n\nIn a statement
    to MacRumors, Apple said it decided to sunset the Apple Support Community after
    a careful evaluation of strategy and customer needs. We have reached out to Apple
    for comment.\n\n- Jess Weatherbed\n\n- Apple\n\n- News\n\n- Tech\n\n## Most Popular\n\n-
