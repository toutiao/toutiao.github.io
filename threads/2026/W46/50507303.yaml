  author: echelon
  text: 'AI generated art with human steering is copyrightable [1,2].<p>Agentic code
    development is human steering, thus copyrightable under the same grounds per the
    language used by the US Copyright Office.<p>Open source code is copyrighted, otherwise
    we would be talking about public domain.<p>When you edit something in the public
    domain to enrich it, that derived work then becomes copyrightable again.<p>[1]
    <a href="https:&#x2F;&#x2F;journals.law.harvard.edu&#x2F;jsel&#x2F;2025&#x2F;03&#x2F;u-s-copyright-office-grants-registration-to-ai-generated-artwork&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;journals.law.harvard.edu&#x2F;jsel&#x2F;2025&#x2F;03&#x2F;u-s-copyright-...</a><p>[2]
    <a href="https:&#x2F;&#x2F;news.artnet.com&#x2F;art-world&#x2F;invoke-snags-first-ai-image-copyright-2608219"
    rel="nofollow">https:&#x2F;&#x2F;news.artnet.com&#x2F;art-world&#x2F;invoke-snags-first-ai-imag...</a><p>---<p>Edit:
    open source software itself has only been lightly tested in court. But that isn&#x27;t
    even my point here.<p>The US Copyright Office has assigned copyright to works
    that leveraged AI. The USCO stated,<p>&gt; “[we] decided to register a copyright
    claim in [the] work because we find that it contains a sufficient amount of human
    original authorship in the selection, arrangement, and coordination of the AI-generated
    material that may be regarded as copyrightable.”<p>Copyright office activity is
    orthogonal to litigation and the court system.<p>If a work receives a copyright,
    the courts will treat it differently if it becomes the subject of litigation.<p>Even
    open source license claims have not been fully litigated. We don&#x27;t have to
    wait on the court to make certain assumptions.'
  score: 0
