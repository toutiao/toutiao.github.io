  author: jsrcout
  text: There was also a mini-assembler [0] that let you enter assembly code directly
    into memory. It was dead simple to use, and since it printed an assembly listing
    after you entered each instruction, it was conducive to learning the hex codes
    by heart.<p>The mini-assembler didn&#x27;t understand symbols (other than the
    opcodes themselves), but it did understand the addressing modes. This saved you
    from, for instance, hand calculating branch offsets.<p>Not all Apple II models
    included it, but I can&#x27;t find a reference right now. Ours had it.<p>[0] <a
