  author: sowbug
  text: 'The Apple II had a thing called the monitor, which was a tiny CLI program
    in ROM that you could invoke from the BASIC command line (CALL -151). With it
    you got the ability to disassemble memory (300L would spit out 6502 opcodes starting
    at address 768), set memory regions to sequences of hex digits (300: A9 21 20
    FO FD 60 would write a tiny program on an Apple II Plus that printed an exclamation
    point, if my memory serves), and execute memory (300G).<p>With these three commands,
    and a working memory of the hex that corresponded to the opcodes, you could be
    reasonably productive writing short 6502 programs.<p>Fun and extremely niche fact:
    the typo CALL -161 jumped into the monitor, but only after the weird side effect
    of unhooking the sniffer that watched for DOS 3.3 commands sent via the ROM&#x27;s
    text I&#x2F;O. Not only did this make text print faster -- useful when you were
    visually dumping memory to the screen to find something quickly, but it also protected
    against accidentally destroying your disk if you unwittingly printed a sequence
    like ^M^DINIT HELLO^M, which would trigger the disk initialization routine.'
