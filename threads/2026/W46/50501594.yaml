  author: II2II
  text: 'Follow-up question: how did Woz get BASIC into ROM?<p>The handwritten interpreter
    is fairly common knowledge since Woz has told that story many times, but I don&#x27;t
    recall any accounts of how he bridged the gap from paper to silicon. All of the
    discussion about the machine language monitor doesn&#x27;t really address the
    question. At best, it moves the question from programming a ROM for BASIC to programming
    a ROM with the machine language monitor. Even with the monitor, additional hardware
    would be required to program a ROM. At the very least, a latch would be required
    to hold the address and data. Of course, it is possible that he did it without
    the computer (using a rig that let him &quot;toggle&quot; the pins). It is also
    possible that he used another computer to program the ROM, but, as he said, he
    didn&#x27;t have the money to program BASIC on a computer so why would that be
    different for a ROM?'
