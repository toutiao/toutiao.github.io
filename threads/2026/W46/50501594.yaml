  author: skeeter2020
  text: 'I had a Vic20 but after it was stolen was the first kid in my neighbourhood
    to get a disc drive with a C64. Floppys were more expensive early but I remember
    about $20 for a box 10 - still a lot of 80&#x27;s money! Learning you could double
    side a disc with a hole punch (and later the nibbler tool) is one of the head-exploding
    moments of my computer life.<p>OT: others are the first times I drew graphics
    on the amber monitor of a PC clone and adding data to a BE database and then seeing
    said data on a webpage. I think my security was about the same as current-day
    Lovable :)<p>OOT: Thinking about it, I believe the pure wonder &amp; joy came
    because it seemed like magic, but then you figured out how it worked which gave
    you an immense feeling of power and self-determination. I worry that with AI today
    you&#x27;ll get the former and never the latter, which will have serious, long-term
    ramifications. I hope I&#x27;m wrong.'
