    per subroutine and screw memory efficiency (not for the last time in the following
    forty five years). The only time I crunched it back down was for a “use almost
    all 8K for the decimal digits of E” (which was fun and much faster than Pi but
    not totally useful as I couldn’t print them or save them to tape).
