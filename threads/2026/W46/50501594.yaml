  author: Steve44
  text: You&#x27;d hand write most of the code, type it into the assembler and that
    could then create what was effectively a machine code binary which you&#x27;d
    save to tape.<p>With small stuff you could run the code and drop back out to the
    OS. Generally you&#x27;d load and run the binary to test it and then back to loading
    the editor and source code, edit that, reassemble.  Repeat ad infinitum.<p>Much
    of the ZX81 and Spectrum code I wrote was initially done on pen &amp; paper and
    developed like that.<p>When I got my first in-house job in 1984 they were using
    TRS80s for editing and assembling which also had a custom hardware link to transfer
    the binary to the Spectrum.<p>By the time we got onto Atari &amp; Amigas there
    was much better custom hardware, such as SNASM, which also facilitated remote
    debugging from a PC.
  score: 0
