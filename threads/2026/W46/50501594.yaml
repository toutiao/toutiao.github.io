  author: jibalt
  text: No, and contrary to one of the responses it was not at all common to have
    personal program decks numbered -- that would only be the case for commercial
    data. Nor did I have access to a card sorter -- I was submitting personal programs
    to the computer center via the UCLA Computer Club. (Also, PL&#x2F;1 did not have
    a fixed line length.) And while it was indeed common and wise to draw a diagonal
    line or two across the side (not top) of a deck, I hadn&#x27;t done so, and this
    was a program that was being developed so the cards kept changing.<p>I got the
    deck back in order by using a listing that I fortunately had, but it took a bit
    of work.
