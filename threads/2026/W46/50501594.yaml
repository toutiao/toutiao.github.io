  author: mrandish
  text: I got my first computer in 1981, a 4K Radio Shack Color Computer for $500
    (a huge purchase decision at the time). So I missed hand assembling for bare metal
    and Altair-type toggles.<p>However, there was an interesting period of a few years
    where assembler tools were either unavailable or fairly expensive, so it was common
    to use the computer&#x27;s BASIC to write an assembly language monitor program.
    Such program listings were pretty common in early hobbyist &#x27;zines. It was
    also pretty common to use BASIC to POKE in a quick bootstrap program to load a
    value in a register and jump to an address, which I could usually do from memory.
    After 40 years I still remember the 6809 RTS was $39 and NOP was $12, two very
    handy instructions to POKE a quick mod into a program.
