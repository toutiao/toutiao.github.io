  author: tmoertel
  text: 'Guess what? Apple <i>brought back</i> the mini-assembler when it released
    the &quot;enhanced&quot; version of the Apple &#x2F;&#x2F;e in in 1985:<p><i>Monitor
    changes also included a return of the mini-assembler, absent since the days of
    Integer BASIC. It was activated by entering a “!” command in the Monitor, instead
    of a jump to a memory location as in the older Apple II. Features also added included
    the ability to enter ASCII characters directly into memory, and an “S” command
    to make it possible to search memory for a byte sequence. Interrupt handling was
    also improved. However, the “L” command to disassemble 6502 code still did not
    handle the new 65c02 opcodes as did the IIc disassembler.</i><p>Source: <a href="https:&#x2F;&#x2F;www.apple2history.org&#x2F;history&#x2F;ah07&#x2F;#07:~:text=Monitor%20changes%20also%20included%20a%20return%20of%20the%20mini%2Dassembler"
