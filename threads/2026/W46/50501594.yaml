  author: david-gpu
  text: I only had to assemble instructions by hand three times in my career. It is
    not difficult if you are already familiar with the ISA of that particular processor,
    but it is tedious.<p>The first time was in my first job writing OpenGL ES 2.0
    blending operations for the Imagination Technologies SGX 535, which was a remarkably
    advanced little GPU for its time. Alpha blending happened through special instructions
    in the fragment&#x2F;pixel shader. We did have a compiler, but it didn&#x27;t
    handle blending, for whatever reason.<p>Through testing I noticed that NVidia
    GPUs performed blending incorrectly, according to the specification, which was
    a big surprise. Only years later I figured out that the <i>specification</i> had
    some errors; I now would bet that NVidia was doing the correct thing.<p>The second
    time I had to assemble instructions by hand happened while working on a stripped
    down version of the Radeon 7xxx series that shipped on some mobile phones. I don&#x27;t
    recall what the problem was, whether we were adding a feature or optimizing the
    microcode generated for a particular OpenGL operation, but it involved a rarely-used
    feature called user-defined clipping planes. We didn&#x27;t have an assembler
    for that GPU; all microcode was assembled by hand.<p>The third time happened at
    NVidia, and I will be vague, as not enough time has passed for me to be comfortable
    going into any detail. I had an idea for how to provide hardware acceleration
    for persistent CUDA kernels, which eventually was marketed as Cluster Launch Control
    (CLC). In order to quantify the benefit of adding some hardware, when it was possible
    to approximate that functionality in software, I needed to test the most efficient
    software implementation that was possible, and the compiler wasn&#x27;t quite
    giving the assembly I wanted, so I had to manually patch some instructions post-compilation.
    Why did I not use the assembler that was available? I couldn&#x27;t, because the
    assembly language did not provide a way to express the exact feature I had to
    patch.
