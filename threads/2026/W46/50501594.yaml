  author: tmoertel
  text: |-
    &gt; 300: A9 21 20 FO FD 60 would write a tiny program on an Apple II Plus that printed an exclamation point, if my memory serves.<p>Ancient assembly hacker tip: A JSR&#x2F;RTS sequence can be simplified to a JMP. To continue your example, the bytes you provided decompile as follows (assuming Apple 2 monitor ROM at $F800):<p><pre><code>            PRINTBANG:
        A9 21      LDA #$21
        20 F0 FD   JSR COUT1
        60         RTS
    </code></pre>
    So, you load the A register with #$21, which is the ASCII code for `!` in hexadecimal, and then call COUT1 which will output the character in the A register, printing the exclamation point. When COUT1 is finished, it will return to you using an RTS instruction, and then you&#x27;ll return to your caller using another RTS instruction.<p>Since the call to COUT1 is a tail call, you can borrow its RTS instruction to return to your caller and save one instruction. So the following code is equivalent to yours but a little bit smaller and faster:<p><pre><code>            PRINTBANG:
        A9 21      LDA #$21
        4C F0 FD   JMP COUT1
    </code></pre>
    Notice that the JSR instruction has become a JMP.<p>Another related trick: When you have a routine that callers often want to call twice—say to print `!!` for extreme exclamations—you may be tempted to create a do-it-twice call:<p><pre><code>              PRINTBANG2:
        20 00 03    JSR PRINTBANG
        20 00 03    JSR PRINTBANG
        60          RTS
    </code></pre>
    But now we know better and code it this way:<p><pre><code>              PRINTBANG2:
        20 00 03    JSR PRINTBANG
        4C 00 03    JMP PRINTBANG
    </code></pre>
    But we can do even better! We can eliminate the jump and save three more bytes by placing our do-it-twice routine immediately before the routine it is calling:<p><pre><code>              PRINTBANG2:
        20 03 03    JSR PRINTBANG
                  PRINTBANG:
        A9 21       LDA #$21
        4C F0 FD    JMP COUT1
    </code></pre>
    When PRINTBANG2 is called, it calls PRINTBANG to print an exclamation point, but when PRINTBANG returns, it returns to PRINTBANG2, which promplty falls through to PRINTBANG, calling it again and printing a second exclamation point. This time, however, when PRINTBANG returns, it will return to the original caller.<p>Back when every byte mattered, these tricks were useful to know.
