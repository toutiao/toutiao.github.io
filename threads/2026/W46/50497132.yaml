  author: i2talics
  text: First of all, iron and copper are typically the initial components you build
    things out of but then the complexity rises as you progress through the game.
    I&#x27;ve played a lot of Satisfactory and the mid game is all about processing
    oil and coal, then later on you are doing things like producing batteries out
    of sulphur and aluminum byproduct.<p>But perhaps more importantly, these games
    are ultimately highly abstracted from real industrial processes and concepts like
    &quot;iron&quot; and &quot;copper&quot; are just arbitrary ingredient names. From
    a game design perspective, you have to ask if the industrial process that the
    player emulates is actually fun and if they are solving compelling puzzles (or
    whatever experience you want the player to have). You can go a long way with just
    a few basic inputs, and iron&#x2F;coal&#x2F;copper are intuitive to grasp based
    on the real-life analogy.
