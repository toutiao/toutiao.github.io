  author: Joker_vD
  text: "&gt; It is made to sit in a split next to your AI agents. They can send you
    short messages that show up in the game, so you can play while they work.<p>&gt;
    Agent messages<p>&gt; Your AI agents can message you inside the game. A message
    costs the agent only the words in it, and nothing prints on success. Messages
    wait while the game is closed.<p>It&#x27;s kinda amazing how the ancient &quot;local
    mail&quot; technology keeps getting reinvented, you know, and reintegrated inside
    the gameplay? NetHack had its its &quot;mail demon&quot; since... (googles) version
    1.0.2, in April 1985 — the creature would spawn in the game, deliver you a scroll
    of mail, and vanish. And apparently, it&#x27;s still in use nowadays? &quot;On
    public servers such as nethack.alt.org, a user may observe other users&#x27; games
    and communicate with them by sending mail.&quot;"
