  author: MayeulC
  text: 'Indeed, this is what I have in mind: metadata attached to variables and js
    contexts, &quot;contaminating&quot; everything it interacts with.<p>There would
    indeed be many holes to plug, especially when considering side-channel attacks.<p>Thank
    you for the answer, this is interesting, and fuels my reflection. I had not considered
    some of the most common leak vectors. It seems that the main risk is that almost
    every API surface may get tainted fairly quickly.<p>To take an example: Changes
    to the DOM could taint that part of the DOM, and if these specific elements are
    accessed by another context, that would taint the context. But to reduce the collateral
    damage, one would need deep integration: only adding or removing elements should
    affect the length attribute, only the changed part of a str could be tainted,
    etc. That said, it might not be that complex to implement: assuming an attribute
    is computed by walking a list, the taint should be applied when crossing the modified
    boundary. If it&#x27;s stored when the change occurs, it should be tainted directly.<p>I
    guess that only a prototype + corpus would give definitive answers.<p>The second
    idea I had in mind was more complex: when detecting that a tainted context is
    about to perform a network request, replay the context using non-fingerprinting
    data. Obviously it would have a performance cost. An alternative could be: every
    time a context get tainted, &quot;fork&quot; it and perform changes both in the
    real context and in a &quot;parallel universe&quot; with dummy data: use this
    dummy context when sending back data.<p>Anyway, they are just ideas. I am not
    in the browser space but if I was, I&#x27;d probably ask an agent to run some
    experiments with this.'
