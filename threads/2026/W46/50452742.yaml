  author: nneonneo
  text: 'I think the idea is that a given JavaScript variable&#x2F;context would be
    “tainted” the moment it accesses those APIs; taint tracking would then be used
    to guarantee that tainted data couldn’t be attached to any network request. The
    idea here is that fingerprint-capable APIs could be used but only locally.<p>There’s
    some parallels to canvas tainting: JS is blocked from reading the pixels of any
    canvas that has had a cross-origin image rendered to it. This is done to enforce
    the same-origin policy while allowing canvases to use cross-origin images like
    the &lt;img&gt; tag can.<p>Unfortunately, when you can run arbitrary JS, even
    doing strictly local computations can likely be used to leak tainted data to a
    cooperating untainted context. Since you’d want the JS to still be able to do
    something useful with the tainted data, that resulting changes could be measured
    to leak the data. A more draconian measure could be to just block fetch() and
    similar APIs entirely after you call a fingerprinting API, but that would probably
    break too many sites.'
