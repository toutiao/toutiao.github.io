  author: xp84
  text: Checking account &quot;Bill Pay&quot; features are a fusion of multiple ideas
    that you access through a single interface.<p>Adding a biller to it involves typing
    in the biller name, providing the account number (e.g. your credit card number)
    and the ZIP where your bills say to mail a check.<p>Big billers (like say, Chase
    credit cards) register with the other big banks and the handful of companies who
    provide white-labeled platforms for all the small banks and credit unions so that
    when you input one of their accounts this way, it&#x27;ll match it up and turn
    into an electronic transfer which tends to show up pretty quickly (though I assume
    it does still take a couple of days to fully clear, you&#x27;ll usually &quot;get
    credit for it&quot; the day of the payment).<p>But you can also just add literally
    any person or company name and address. Say, Bob Smith, 123 Example Street, City,
    ST 12345 and they&#x27;ll just mail Bob a check on your behalf. So, those will
    always require days of time because they have to print and mail a physical check
    in those cases.<p>So, the generic advice has to assume it&#x27;s not matched to
    an electronic biller profile.<p>In the case of most banks I&#x27;ve used, they
    hide this implementation detail slightly -- they just always have you pick the
    date the payment &#x27;will be received&#x27; - and when it&#x27;s not an electronic
    biller, you just can&#x27;t pick a date that&#x27;s too close.
