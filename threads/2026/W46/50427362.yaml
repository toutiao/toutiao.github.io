  author: toomuchtodo
  text: Canada&#x27;s Interac is anagolous to US&#x27; Zelle payment network (which
    is owned by the largest US commercial banks), while RTR is the US FedNow equivalent
    (&quot;true&quot; instant payment and settlement with broader use case support,
    operated as a utility by the US Federal Reserve).<p><a href="https:&#x2F;&#x2F;www.redcompasslabs.com&#x2F;insights&#x2F;why-canada-needs-another-instant-payments-scheme&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.redcompasslabs.com&#x2F;insights&#x2F;why-canada-needs-ano...</a>
    was something I found via a search that explains some of the nuance without writing
    a new post on the topic, other citations and resources are welcome.<p>(it should
    be expected that newer, utility ran instant payment systems cannibalize existing,
    more expensive, lower speed payment rails; going fast and being cheap as a utility
    is the innovation)
