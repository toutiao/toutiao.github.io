  author: toomuchtodo
  text: ~$800B&#x2F;year in annual volume run rate, as of this comment. You can move
    up to $10M per value message for less than 5 cents, with a max 20 second time
    to completion SLA.<p><a href="https:&#x2F;&#x2F;www.frbservices.org&#x2F;resources&#x2F;financial-services&#x2F;fednow-service-resources&#x2F;fednow-service-volume-value-statistics&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.frbservices.org&#x2F;resources&#x2F;financial-services&#x2F;fed...</a><p>(i
    am contributing subject matter expertise to policymakers to make offering FedNow
    rails to financial services customers a requirement of having a banking license,
    so I&#x27;m a bit biased; this is the only way we&#x27;ll get off of closed payment
    rails like Zelle, slow open rails like ACH, or expensive faster legacy credit
    card rails)<p>&gt; Are bill payments and bank to bank transfers now happening
    instantaneously?<p>Walmart is currently rolling it out. I expect others to start
    to as you see them surcharge credit card payments (US mobile phone providers,
    internet providers, etc). It&#x27;s trivial to build into an app experience, with
    or without a partner like Plaid (for example).<p>&gt; “It surprised me,” Henry
    said of adoption of Walmart’s first iteration of pay-by-bank, which is available
    online but hasn’t been marketed to customers. “It’s certainly surpassed our expectations
    of the amount of customers that have registered and actually use the payment type.”<p>&gt;
    Walmart’s upgraded pay-by-bank offering will be rolled out in 2025. The transactions
    will occur over bank technology provider Fiserv’s NOW Network, which integrates
    with The Clearing House’s Real Time Payments network and the Federal Reserve’s
    FedNow. Until now, large retailers hesitated to launch real time payment options
    because many banks were not connected to an instant settlement system, meaning
    their customers would not be able to use the product. NOW Network aims to connect
    to as many banks as possible to reach 100% of deposit accounts by combining its
    own network with RTP and FedNow.<p><i>Walmart Plans Instant Bank Payments, Cutting
    Out Card Networks</i> - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=41593450">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=41593450</a>
