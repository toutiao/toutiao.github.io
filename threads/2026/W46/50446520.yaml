  content: "- [AI](https://9to5mac.com/guides/ai/)\n\n# Apple has new Mac app coming
    to make running local AI models easy\n\n[![Avatar for Ryan Christoffel](https://secure.gravatar.com/avatar/bff64efa105c91e6f9c64ea73476006e59b7e460b60496788eec4ade77e58f72?s=30&d=mm&r=r)](https://9to5mac.com/author/rchristoffel/)[Ryan
    Christoffel](https://9to5mac.com/author/rchristoffel/)&nbsp;|&nbsp;Nov 10 2026
    - 11:15 am PT \n\n![](https://9to5mac.com/wp-content/uploads/sites/6/2026/10/Mac-mini.jpg?quality=82&strip=all&w=1600)\n\nLeaker
    Aaron Perris has [discovered evidence](https://x.com/aaronp613/status/2120229190477992162?a=em8hy9-X3UtcmFWDyN0&s=61)
    of a new Mac app in the works at Apple called Harbor, which makes it easy to run
    local AI models across one or more Macs.\n\n## New ‘Harbor’ app revealed at Apple:
    ‘turns your Mac into a private AI inference server’\n\n![Unusual timing of Mac
    mini and Mac Studio updates all about AI, claims report | Image shows the new
    Mac Studio with M5 Max and M5 Ultra chips](https://9to5mac.com/wp-content/uploads/sites/6/2026/08/Unusual-timing-of-Mac-mini-and-Mac-Studio-updates-all-about-AI-claims-report.webp)\n\nThe
    Mac has been getting a lot more popular this year, both because of budget-friendly
    options like MacBook Neo but also as a tool for running AI models locally on Mac
    Studio, Mac mini, and more.\n\nIt seems Apple plans to lean harder into the latter
    use case, as leaker Aaron Perris has discovered a new Mac app called Harbor that’s
    been designed to turn your Mac into a private AI inference server.\n\nHere’s [Perris’s
    post on X](https://x.com/aaronp613/status/2120229190477992162?a=m3_ZPlpfCpfOZMSwac8&s=61)
    with the details:\n\n> Apple is working on a new app called Harbor  \n>   \n>
    Harbor turns your Mac into a private AI inference server. Run open-weight models
    locally on Apple silicon—your data never leaves your hardware, and nothing reaches
    the cloud. Connect multiple Mac computers over Thunderbolt 5 to pool… [pic.twitter.com/UYJBQeX4Nf](https://t.co/UYJBQeX4Nf)\n>
    \n> — Aaron (@aaronp613) [November 10, 2026](https://x.com/aaronp613/status/2120229190477992162?ref_src=twsrc%5Etfw)\n\nAs
    the post notes, here’s what the app does:\n\n> Harbor turns your Mac into a private
    AI inference server. Run open-weight models locally on Apple silicon—your data
    never leaves your hardware, and nothing reaches the cloud. Connect multiple Mac
    computers over Thunderbolt 5 to pool unified memory, enabling large models and
    higher concurrency that a single computer can handle alone.\n\nAnd here are the
    feature highlights:\n\n- **Setup in minutes, not hours** : “Harbor automatically
    detects your devices over Thunderbolt 5 to form a cluster. Plug in, start, and
    you’re running—no manual configuration, no command line, no infrastructure expertise
    required.”\n- **Download and run models directly** : “Browse, download, and load
    open-weight models from within the app. Harbor handles model management so you
    can focus on the work, not the setup.”\n- **Cluster for scale** : “Connect two
    or more Thunderbolt 5-capable Mac computers and Harbor pools their unified memory
    into a single inference resource. Run models that exceed any single computer’s
    capacity, or serve more concurrent requests across your cluster.”\n\nHarbor is
    currently in a private preview under Apple’s Claris brand, but it seems likely
    that we’ll see it launch to the public in the weeks and months ahead.\n\nAre you
    interested in using Harbor on your Mac? Let us know in the comments.\n\n### Best
