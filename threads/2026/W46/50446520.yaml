  text: Apple has had &quot;about 10% of the global laptop market&quot; since 2013.
    If there&#x27;s some powerful growth driver, I&#x27;m not seeing it.<p>The proliferation
    of web-based enterprise software mostly stands to Windows and ChromeOS&#x27; advantage.
    macOS is the platform that has relied on &quot;native&quot; and &quot;ecosystem&quot;
    efforts that are becoming increasingly unpopular among consumers and industry
    pundits that don&#x27;t like paying per-seat for software services. The Mac Pro
    used for render farms, on-prem hosting and cluster computing was depreciated completely,
    driving some of Apple&#x27;s highest-margin customers over to Linux and Windows
    servers. Apple has absolutely began their Mac pivot to prosumer&#x2F;B2C vending,
    and it&#x27;s resulted in advertisements and SaaS slop invading macOS.<p>Lenovo
    will keep selling laptops because that&#x27;s their product equivalent to the
    iPhone. Apple&#x27;s equivalent to the iPhone is... well, the iPhone. If they
    see an opportunity to force Mac users into an iPad-esque experience, they&#x27;ll
    take it in a heartbeat and play coy asking &quot;what&#x27;s a computer?&quot;
    like the iPad advertisements. The Mac not an important product for Apple these
    days, the App Store <i>is</i>.
