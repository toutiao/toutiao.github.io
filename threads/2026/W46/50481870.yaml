  author: footydude
  text: "&gt; what unique perspective am I getting if it&#x27;s just AI?<p>It is entirely
    possible for existing AI tools to introduce you to a perspective on something
    that is neither new or unique to the world, but which IS <i>new to you</i>.<p>Whether
    what represents is a wholly unique perspective or not is kinda irrelevant, so
    long as it&#x27;s unique to you.<p>For example - most popular science or history
    books aren&#x27;t offering up wholly unique perspective that nobody in that field
    of study has ever thought about before &#x2F; ever committed to paper. Most of
    them are providing an engaging overview of widely studied topics in a way that
    is accessible and engaging to the average enthusiast.<p>Sure, the more in-depth
    your knowledge of a subject is the harder it is for those books to give you a
    unique perspective...but that is true of human authors too  (as anybody who has
    read multiple books on the same subject will surely attest).<p>Also - without
    getting all Rumsfeldian...there are things you don&#x27;t know that you don&#x27;t
    know...and whilst with the right approach you could get AI to enlighten you, there
    can be value in someone&#x2F;something having already curated that content together
    for you.<p>Just to be clear here - i&#x27;m not arguing in favour of AI books
    or suggesting they are as good&#x2F;equivalent to human-authored books. I don&#x27;t
