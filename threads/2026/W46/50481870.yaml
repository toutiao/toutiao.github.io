  author: vidarh
  text: "&gt; That&#x27;s a book a day (give or take), per account. No human author
    is publishing a book per day.[0]<p>Note that it is 2 per week <i>per format</i>.
    So if you want to publish an e-book, print book and audiobook of your title, you
    can publish 2 titles, not 6.<p>Still more than most humans will typically sustain
    but it does change publishing patterns.<p>E.g. on Kindle+ (formerly Kindle Unlimited)
    a lot of people would publish short stories or short novellas. You absolutely
    <i>can</i> turn around more than 2 short stories per week.<p>The changes may push
    some writers to change what they write or bundle up stories.<p>&gt; How do people
    think that distribution will change now that supply has increased (at least) tenfold?
    If the consensus on X.com is to be believed, it&#x27;s all about personal brand.
    This used to be the case, but perhaps 80% of it. Is conventional discovery dead
    now?<p>For books, I&#x27;m hearing there are literary agents who now won&#x27;t
    even sign anyone unless they have a sizeable social media following.<p>Conventional
    discovery for books will get you a <i>very</i> slow drip. But Amazon massively
    reward you if you publish lots and often by showing each of your works if someone
    clicks on one, letting you link series, and letting you do giveaways that are
    actually quite heavily promoted.<p>This, of course, incentivises people without
    a budget for promotion to push hard to release often. E.g. shorter titles, short-stories&#x2F;novellas.<p>And
    <i>that</i> as noted above is being affected by the reduced limit.<p>&gt; [0]
    - If this includes organisations, like publishing houses, then fair enough.<p>It
    includes anyone who is not large enough to get Amazons attention to get access
    to send them feeds directly.<p>I have a client that runs a small press, and basically
    their only option for Amazon is going via aggregators (and that too is relatively
    limited) and only pushing their top titles direct as until&#x2F;unless they sell
    a lot more than they do now it seems they won&#x27;t even get to talk to someone
    with any power to even escalate to anyone with authority to let them bypass KDP.<p>For
    e.g. Google on the other hand they got ONIX feeds set up no questions asked (ONIX
    is an XML format for feeding larger book catalogues to retailers) and pushed their
    entire ca. 200 book backlog right out of the gate. But Google e-book sales are
    tiny compared to Amazon - last I heard it was about 5% of their revenue.<p>The
    problem for Amazon - and for everyone else - is that for anyone but the biggest
    publishers Amazon is so dominant that most of the effort from people who want
    to push out high volume will continue to target Amazon."
