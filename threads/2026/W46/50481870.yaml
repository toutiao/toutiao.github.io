  author: Lerc
  text: The question was not, &quot;why do you think this is art?&quot;<p>The debate
    of what is and isn&#x27;t art is older than art and almost as old as art critics.<p>I
    like to think of art as &quot;An invitation to consider&quot;  and not as a binary
    value.  On this scale a banana taped to a wall is elevated above some paintings,  A
    human drawn tree as a background of a video game that ends up always obscured
    by a house would be lower on this scale than an AI generated image crafted to
    make people think about an idea.  The worth, financial, aesthetic, or moral, of
    the axis is purely a projection of human ideology.<p>That&#x27;s a side issue
    to why someone might like it. Something doesn&#x27;t have to be art to be liked,
    or enjoyed.
