  text: Does it really impact people that much though?<p>There are two categories
    of (physical) products I buy on Amazon.<p>Regular “brand name” items sold in pretty
    much any big box retail store. I have more or less the same experience with Amazon
    as I do Walmart or Target or wherever for that category. Over thousands of orders
    I’ve never received a fake or had an issue outside of very rare packaging issues
    like damaged boxes.<p>The other category is “trash I need faster than aliexpress”
    and it’s basically exactly as-advertised for that junk. I usually get the item
