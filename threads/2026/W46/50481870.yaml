  author: AnthonyMouse
  text: Except that&#x27;s not the trade off, because the slop producers would then
    just create more accounts instead of uploading more books on the same account.
    Which is probably what they&#x27;re doing even with the <i>existing</i> rate limit.<p>So
    all you&#x27;d be doing is inconveniencing the actual human who just wants to
    use one account for all their books. Of which there could easily be more than
    one.<p>Moreover, trying to justify things with ratios like that proves too much,
    because slop can give <i>anything</i> a ratio like that. They can generate trillions
    of books, any number. If you banned <i>everything</i> then you&#x27;d be banning
    millions of pieces of slop for every one human-authored book, but you&#x27;d also
    be banning every human-authored book.<p>What you need is the thing that minimizes
    false positives, because the base rate of true positives is now so high that even
    a negligible false positive to true positive ratio would swallow most of the real
    books.
