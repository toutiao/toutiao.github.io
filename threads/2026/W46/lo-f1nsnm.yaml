    # Hacking the T-Mobile Sidekick, 20 Years Too Late
    2026-11-04

    The Danger Hiptop, better known as the T-Mobile Sidekick, came out in 2002 with a full QWERTY keyboard, AIM and Yahoo Messenger built in, and push notifications, at a time when most phones could barely handle a text message. All of it ran on DangerOS, Danger's own Java-based operating system.

    The Sidekick was a cloud device before "the cloud" was even a term most people knew. Everything lived on Danger's servers: contacts, messages, photos, settings. Most users had no idea that their phone was essentially a thin client, completely dependent on a backend they'd never think about. It just worked, and that was enough. Microsoft acquired Danger in 2008, and after a [catastrophic data loss](https://en.wikipedia.org/wiki/2009_Sidekick_data_loss) in 2009 that wiped users' contacts, photos, and personal data, the service shut down for good in 2011. A phone that kept everything on someone else's servers now had no one to talk to.

    ## Permission to Run

    With Danger long gone, I started digging through whatever survived of it. Eventually I found a copy of the SDK on archive.org, containing everything needed to develop for the device: documentation, examples, a device simulator, and a set of JAR files. Throwing those JARs into JADX and decompiling them revealed how the device actually worked under the hood.

    I wanted my own code running on a real Sidekick, and that meant dealing with Danger's security model. DangerOS only runs software signed by Danger or your carrier. Developers got around this with a _developer key_. Flash one onto your phone and it switches into developer mode, which accepts apps over USB and turns on `htconsole`, Danger's debug console.

    Getting one used to be surprisingly easy. In 2003 Danger hand-picked its first developers and emailed keys out one at a time, and some people waited weeks to hear back.

    ![A 2003 post on Danger's developer wiki asking how to get on-device access after emailing Danger with no response, and Brian Swetland's reply that the poster is on the list for the second round of on-device developers](/blog/redanger/level2.webp)

    By the end of the year there was a self-serve web form: enter your T-Mobile account and IMEI, agree to give up carrier phone support, and a signed key showed up in your inbox. That lasted until September 2010, when Danger told developers it would stop accepting new apps and shut its developer site down weeks later, taking the only place to get a key with it. Nobody is issuing keys anymore, so if I wanted one, I'd have to make it myself.

    Needing permission from the manufacturer just to run your own code sounds insane next to how open Android is. Then again, maybe not: Google is now [rolling out developer verification](https://developer.android.com/blog/posts/android-developer-verification-rolling-out-to-all-developers-on-play-console-and-android-developer-console), and soon an app from a developer who hasn't registered with Google will only install through `adb` or a buried "advanced flow".

    ## Finding the Key

    A Sidekick developer key is tiny: one config setting, `lock_to_imei_0`, set to the phone's IMEI, and Danger's signature over it. It comes in two forms. Older Hiptops took it as a small `.sq` file, while the Sidekick 3 takes it as a `.jar`, laid out like a signed Java app, installed from recovery mode. Both are signed the same way, and the only real key I could find was an `.sq`.

    The setting is easy. The signature means knowing which key the phone checks against, and that key had to be somewhere in the firmware. Back in the day, a college student had gotten full JTAG access to an older Sidekick and dumped its flash, but that takes hardware I don't have, and their download links are long dead.

    Luckily, Danger's ServiceProgrammer, a tool for reflashing Sidekick IIs, is preserved on archive.org. It ships complete factory OS images. I scanned every image for anything shaped like a certificate or public key, and pulled out dozens: per-carrier signing certificates for T-Mobile, Fido, KPN and others, factory roots, and a few public TLS roots. No private keys, of course. Most of them were 1024-bit RSA, but one certificate stood out:

        CN=Danger Developer Program, OU=Developer, O=Danger
        [email protected]
        Not Before: Sep 17 2003
        Not After: Apr 11 2006
        Public Key: RSA (512 bit)

    A self-signed root for the Developer Program, trusted by the OS on every generation I checked, from the Hiptop 1 to the Sidekick 3. To check that it was really the key behind developer keys, I needed a real key to test against. Danger's old developer site is archived on archive.org as well, and it still has a copy of `null-device-key.sq`, a key with no IMEI lock that the phone accepts and then deletes, which Danger handed out so people could leave developer mode. Its signature verified against the Developer Program key. That was the one.

    ## 512 Bits

    In 1999, a team of researchers factored [RSA-155](https://en.wikipedia.org/wiki/RSA_numbers#RSA-155), a 512-bit number, meaning they found the two primes that multiply to make it. That's all it takes to break an RSA key: every public key contains a number like that, and its two primes are enough to rebuild the private key. It took them about seven months on hundreds of computers. From then on, 512-bit RSA was no longer considered safe, and Danger issued this certificate four years later. To be fair to Danger, in 2003 factoring a 512-bit key was still a research project, and this one only guarded developer mode. Nobody was going to rent a university's worth of computers to sideload apps onto a Sidekick.

    In 2026 it's an overnight project, if you have enough cores.

    The standard tool for this is [CADO-NFS](https://gitlab.inria.fr/cado-nfs/cado-nfs), an open source implementation of the [general number field sieve](https://en.wikipedia.org/wiki/General_number_field_sieve). Most of the work is sieving, which splits into independent work units, so it scales across as many machines as you can throw at it.

    My workstation alone, a Ryzen 9 9950X3D, would have needed about a day and a half, assuming nothing went wrong. Luckily I had a few servers that weren't doing much. CADO-NFS runs a central server that hands out work units over HTTP, with clients that sieve and upload the results, so I wrote a small script to copy a client bundle to each node, start dozens of clients as low-priority processes, and tunnel everything back to my workstation over SSH. In total, 220 CPU cores (436 threads) across seven machines worked on the problem. I started the run a little after 9pm.

    Things did go wrong. Every node dropped off at once around 11pm, and later the server choked when 200 clients tried to upload results at the same moment. Both times I patched it up and got it going again. Still, at 6:09am, CADO-NFS printed two 78-digit primes:

        p = 104491666572898294264047880744514595625924491114579942567545554396922436316211
        q = 110787645499676419929932206845243986470558771418524609420578927381066743957279

    Multiply them together and you get `n`, the 155-digit number in Danger's public key:

        n = 11576385713948644711688861097066027618113758646736035007798668946285132955940594207257263351308819380417615195922932748143994263878857883771956785119149869

    | Stage | Work |
    | --- | --- |
    | Polynomial selection | ~63 core-hours |
    | Sieving | ~578 core-hours, 204.5 million relations |
    | Filtering | ~2 core-hours |
    | Linear algebra | ~35 core-hours, 2.5 hours on one machine |
    | Square root | about a minute |
    | **Total** | **~1,175 core-hours (about 49 core-days), 8.5 hours of wall time** |

