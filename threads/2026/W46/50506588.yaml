article:
  url: https://lucypero.com/lucynes.html
  title: lucyNES - Lucy's Save Room
  fetch_status: success
  content: "A NES emulator written in Odin\n\nI made a NES emulator in [Odin](https://odin-lang.org/)!\n\n[Github
    link](https://github.com/lucypero/lucynes)\n\n![lucyNES](../assets/images/lucynes/src_Dn6Bdt7DGO.png)\n\n##
    Intro\n\nI’ve started this project in late June of 2024. I’ve worked on it in
    my spare time off and on. I decided to put a pause on this project in January
    2025 to focus on other things.\n\nI’ve learned so much about:\n\n- The NES architecture,
    and possibly about game console architectures in general\n- Bits and bytes, hex
    notation, and bitwise operations.\n- The Odin programming language. I haven’t
    used it on a serious project before.\n- How computers work. CPU instructions,
    “cycles”, etc\n- Emulation. It’s very hard. Respect to emulator developers!\n\nIt’s
    been a wild ride. I’ve had a lot of fun, but I’ve also suffered more towards the
    end, when trying to make the emulator “fully” accurate.\n\nYou can read the [Github
    Readme](https://github.com/lucypero/lucynes) for more info about the project.\n\n#
    Features\n\n- Enough emulation accuracy to run Battletoads and hundreds of other
    games perfectly.\n- Debugger view with some debugging features\n- Menu view to
    interact with the emulator\n- Save states\n- Controller support\n- CRT Shader
    toggle\n- (Partial) Sound\n- Supported Mappers: NROM, MMC1, UXROM, CNROM, MMC3,
    GxROM, AxROM\n\n## Making an emulator\n\nI’ve seen some people say that making
    a NES emulator is a simple weekend project, and I frankly found that baffling.
    Because _evidently_, it’s not. It took me 7 months to get my emulator to how it
    is now.\n\nI think what they actually mean is that getting a NES emulator “working”
    takes a short time. Like maybe getting Donkey Kong to run. And that’s true. You
    can get to 80% or maybe 90% pretty fast. It’s the last 10% that takes a long,
    long time.\n\nThe NES hardware has many idiosyncrasies that need to be emulated
    for certain games to run. Many games depend on very specific NES behavior. And
    if you don’t implement it right, they won’t run. A lot of the challenge is about
    timing. The CPU and the PPU (the chip that handles the graphics rendering in the
    NES) run in parallel and they communicate with each other. That timing needs to
    be very accurate, or many wrong things can happen. Most games will run fine with
    a less than accurate emulator, but a lot of them won’t, and they will need you
    to consider things in more detail.\n\nAnother issue is _mappers_. Mappers are
    what we call an implementation of a type of cartridge. You see, NES games come
    in cartridges, and cartridges aren’t just data. They are circuitry with their
    own behavior and extra resources like read-only memory, and writable memory. Some
    come with extra audio capabilities, but I haven’t implemented that.\n\nAnyway,
    you have to implement these mappers if you want a game that comes in that cartridge
    to run in your game. They complete the NES’s circuitry. In a way, they are a part
    of the NES hardware. There are many mappers, but you can support a lot of games
    by just implementing a few. I’ve had trouble implementing some mappers, and some
    of them are still badly implemented, causing some games to not work. I found it
    hard to understand some of the mapper documentation.\n\nThe biggest challenge
    with making an emulator, I think, is to know what to implement. Information about
    the hardware, and what needs to be emulated about the hardware for games to work
    in your emulator. Thankfully, the NES is very well documented online. I’ve used
    many resources, like:\n\n- [The Nesdev wiki](https://www.nesdev.org/wiki/Nesdev_Wiki)\n-
    [The nesdev wiki discord](https://discord.com/invite/JSG4kuF8EK). People here
    have helped me with my issues a lot.\n- [Javidx’s NES series](https://www.youtube.com/watch?v=F8kx56OZQhg).
    The code has many mistakes but it’s a good starting point.\n- [This article about
    the NES’s PPU](https://austinmorlan.com/posts/nes_rendering_overview/#pattern-table)\n-
    [Test ROMS](https://github.com/christopherpow/nes-test-roms). These NES ROMS thoroughly
    test particular aspects of your emulator. This is an extraordinary tool to accelerate
    development of emulator accuracy.\n\nI wouldn’t have been able to do any of this
    without these resources and the help from people in the nesdev discord.\n\n##
    Odin\n\nI’ve learned a lot about Odin while making this project. I think it fit
    this project like a glove. Being a very simple, strongly typed C-like language
    that gives me all the freedom I want makes making an emulator much easier than
    using other languages, I feel.\n\nOne thing that threw me off was that Odin has
    no [automatic integer promotion](https://www.skillvertex.com/blog/integer-promotions-in-c/).
    When doing calculations on numbers, Odin will never promote types to a bigger
    one. That led to a few bugs. But I blame this all on me and me being used to C’s
    integer promotion.\n\nOne fun thing that I’ve learned was doing a bit of memory
    allocation strategy. Odin has no automatic memory management, so you have to come
    up with smart ways to handle memory. I’ve had fun thinking about how I should
    handle memory best. I didn’t need to do anything complicated. I mostly use one
    temporary allocator that clears every frame, a global heap allocator for things
    that need to live forever, and a NES Arena allocator for anything that needs to
    live along a NES session. I found memory allocation fun.\n\nAnother thing I had
    to learn is how to serialize Odin objects. I used the CBOR library, and I ran
    into a few issues. I thought my code was misbehaving due to a bug in the library,
    but that was [cleared up](https://github.com/odin-lang/Odin/issues/4661). It was
    only having trouble because I made a few odd types that it didn’t know how to
    serialize. Once I learned how to properly write custom handling for types, everything
    worked perfectly. This was one of the tricky types that cbor didn’t know how to
    serialize:\n\n    PpuCtrl :: struct #raw_union {\n    \t// VPHB SINN\n    \tusing
    flags: bit_field u8 {\n    \t\tn: u8 | 2,\n    \t\ti: u8 | 1,\n    \t\ts: u8 |
    1, // sprite pattern table address for 8x8 sprites (0: $0000, 1: $1000)\n    \t\tb:
    u8 | 1, // bg pattern table address (0: $0000, 1: $1000)\n    \t\th: u8 | 1, //
    sprite size (0: 8x8, 1: 8x16)\n    \t\tp: u8 | 1,\n    \t\tv: u8 | 1, // vblank
    NMI enable\n    \t},\n    \treg:         u8,\n    }\n\nI love how Odin lets you
    define raw unions like this, and with bit fields. It fits emulator development
    very well.\n\n## What’s missing\n\nI don’t consider this project “finished”. Of
    course, a project like this is never truly finished, but a lot of aspects of it
    need a lot of work, for sure:\n\n- The sound. lucyNES doesn’t sound very well
    still. Some games will sound fine but most won’t. I have to improve the implementation,
    and implement the DMC channel which I haven’t done.\n- Some games that I’ve tested
    don’t work due to a poor mapper implementation\n- I could implement more mappers
    so more games are supported.\n\nThese are the main things that are lacking at
    this moment. Maybe at some point I will return and keep working on this so the
    project can feel “complete”.\n\n## Showcase\n\n### Debugger showcase\n\n### Menu
    showcase\n\n### Game showcase\n\n![showcase image](../assets/images/lucynes/407106733-edcbadf1-9f50-46f0-8274-e45dc8d71233.png)\n\n![showcase
    image](../assets/images/lucynes/407106076-41ba0e3a-9520-4b11-a5cc-7926bf3f15bd.png)\n\n![showcase
    image](../assets/images/lucynes/407106574-7bba8fa2-858e-4e73-86e4-8f94d46db19e.png)\n\n![showcase
