  author: n8m8
  text: |-
    Couldn’t help myself, asked Claude for the most iconic post complaining about developing Apple software every year since iOS came out.<p>2007 — John Gruber, &quot;WWDC 2007 Keynote News&quot;
    This was his reaction to Jobs telling developers to build web apps instead of real ones. Its best-known line: &quot;If all you have to offer is a shit sandwich, just say it.&quot;<p>2008 — Fraser Speirs, &quot;App Store: I&#x27;m Out&quot;
    The battle lines were drawn when an Apple representative reviewing submissions for the App Store rejected a program called Podcaster for duplicating iTunes. Speirs then vowed never to write another iPhone app for the store &quot;as currently constituted.&quot; Runner-up: the anger over the SDK&#x27;s secrecy agreement (NDA), which Apple dropped in October after admitting it placed &quot;too much of a burden&quot; on iPhone developers.<p>2009 — Paul Graham, &quot;Apple&#x27;s Mistake&quot;
    Graham wrote that the App Store is an ongoing karma leak. Pair it with Joe Hewitt quitting the Facebook iPhone app the same month: &quot;I am philosophically opposed to the existence of their review process.&quot;<p>2010 — Lee Brimelow (Adobe), &quot;Apple Slaps Developers in the Face&quot;
    This was about rule 3.3.1, which banned apps built with cross-platform tools like Flash. Brimelow ended it with: Go screw yourself Apple. (coverage)<p>2011 — Readability&#x27;s open letter to Apple
    &quot;We believe that your new policy smacks of greed,&quot; wrote Rich Ziade, Readability&#x27;s creator. Apple reversed itself within days. (coverage)<p>2012 — Marco Arment, &quot;The Mac App Store&#x27;s future of irrelevance&quot;
    His target was the new sandboxing rules: &quot;leaving is often a better option, or the only option, for the affected developers&quot;. Runner-up: Wil Shipley&#x27;s essay arguing the Mac App Store needs paid upgrades.<p>2013 — Ken Case (Omni Group) on OmniKeyMaster (the weakest year)
    Omni tried to offer discounted upgrades to Mac App Store buyers and had to back down: &quot;My apologies: I&#x27;m afraid we will not be able to offer upgrade pricing to our Mac App Store customers after all.&quot; (coverage)<p>2014 — Jared Sinclair, &quot;A Candid Look at Unread&#x27;s First Year&quot;
    His sales numbers set off the &quot;indie apocalypse&quot; debate. Runner-up: Apple ordered PCalc&#x27;s calculator widget removed while featuring it. Apple then backed down possibly due in part to the firestorm of press and social media criticism.<p>2015 — Bohemian Coding, &quot;Leaving the Mac App Store&quot; (Sketch)
    Gruber&#x27;s verdict on it: &quot;The Mac App Store is rotting, at least for productivity software.&quot;<p>2016 — Bogdan Popescu, &quot;Dash and Apple: My Side of the Story&quot;
    Apple shut his developer account. He published a recorded call in which they want me to write a blog post in order to restore my account. One caveat for your article: Apple said the account was linked to almost a thousand fraudulent reviews.<p>2017 — Matt Gemmell, &quot;Damage&quot;
    His thesis: &quot;No company has done as much damage to the perceived value of software, and the sustainability of being an independent developer, as Apple.&quot;<p>2018 — The Developers Union open letter
    It asked Apple for free trials for apps and a &quot;more reasonable revenue cut.&quot; (coverage)<p>2019 — Daniel Ek, &quot;Time to Play Fair&quot; (Spotify)
    Spotify&#x27;s CEO compared Apple&#x27;s rules to inviting you to a match on our ping-pong table and then forcing you to play blindfolded while we change the rules throughout the game.<p>2020 — DHH&#x27;s Twitter thread about the Hey email app (archived on hey.com)
    &quot;I will burn this house down myself, before I let gangsters like that spin it for spoils.&quot; Probably the most famous thread in this whole history.<p>2021 — Kosta Eleftheriou&#x27;s thread on scam apps
    It opened with &quot;The App Store has a big problem&quot;: copycat scam apps were outselling honest developers while Apple took its cut. (coverage)<p>2022 — Judgment call
    The most-seen post was Elon Musk&#x27;s &quot;Did you know Apple puts a secret 30% tax on everything you buy through their App Store?&quot; (it got quickly tagged by Community Notes). For a working developer&#x27;s complaint, use Alin Panaitiu&#x27;s post about being rejected for being &quot;too similar to a website&quot;.<p>2023 — Eric Migicovsky and Beeper Mini
    Beeper Mini brought iMessage to Android, and Apple kept blocking it. By late December Beeper gave up, with Canadian CEO Eric Migicovsky writing in a blog post that Beeper &quot;can&#x27;t win&quot; against Apple.<p>2024 — Tim Sweeney&#x27;s thread on the EU rules
    Apple&#x27;s response to the EU&#x27;s Digital Markets Act was, he wrote, &quot;a devious new instance of Malicious Compliance&quot;, with plenty more &quot;hot garbage&quot; in it. (coverage)<p>2025 — David Smith, &quot;The Forgotten Customer&quot;
    &quot;They aren&#x27;t trying to win me over by being excellent; they are assuming my loyalty through strong-arm tactics and intransigence.&quot; Runner-up: the backlash to Apple&#x27;s Liquid Glass redesign, as in this line collected by Michael Tsai: &quot;Liquid Glass has killed my motivation and desire to develop anything for Apple platforms.&quot;<p>2026 (so far) — Marco Arment on App Review delays
    &quot;App Store review delays are back to Shoemaker-era levels.&quot; Many blame a flood of AI-generated apps. That makes a neat bookend to 2008, which was also about waiting on App Review. (Mastodon) Runner-up: Jeff Johnson&#x27;s &quot;Small ways the App Store could be improved for developers&quot;.
