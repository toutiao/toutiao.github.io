    \"Pittsburgh Modular Microvolt 3901: the 3900 semi-modular synth returns as a
    plugin (desktop/iPadOS)\")\n\n_SYNTH ANATOMY uses **affiliation** & **partner
    programs (big red buttons)** to finance a part of the activity. If you use these,
    you support the website. Thanks!&nbsp; &nbsp;_ **Reading Time: 6 minutes**\n\n**The
    surge of AI-generated apps is overwhelming Apple’s app review process, leaving
    developers caught in the crossfire – two examples among many.**\n\nA flood of
    new iOS apps has emerged over the last few months. An estimated 10–20 new iOS
    music apps enter the market every day. This is because AI now makes it possible
    for anyone to vibe code their own apps and AUv3 plugins.\n\nHowever, getting an
    app into the Apple App Store requires going through the app review process. AI
    has affected not only the number of new releases per day but also Apple’s holy
    app review process, creating more nightmares than joy for many developers.\n\n[![Ai
    Apple App review](data:image/png;base64,)](https://synthanatomy.com/wp-content/uploads/2026/11/AI-Apple-App-review.jpg)\n\n###
    What Is The Apple App Review Process?\n\nDeveloping and releasing a VST plugin
    is simple. You set up a website, upload your installers, set a price, and you’re
    good to go. It’s more complicated on iOS.\n\nTo publish an app, you must first
    join the Apple Developer Program, which costs $99 per year. As a member, you can
    submit apps with AUv3 support, but they won’t become available immediately.&nbsp;\n\nWhether
    they are hand-coded or created with the help of AI, all apps must go through Apple’s
    review process. Every app, whether a synthesizer, effects, game, or utility app,
    must first get through this barrier.\n\nThis process verifies that the app meets
    requirements, including security standards. That’s a major advantage over many
    new, freely available VST plugins . You can be confident that everything you download
    to your iOS or macOS device has been checked and is free of anything suspicious.\n\nSo
    far, the process from submission to release has taken 24 to 48 hours, and sometimes
    a few days. Developers say the typical review takes a day or two. Apple’s own&nbsp;[App
    Review guidelines&nbsp;](https://developer.apple.com/distribute/app-review/)state:\n\n>
    App Review works around the clock, typically reviewing at least 50% of submissions
    in less than 24 hours and 90% in less than 48 hours.”\n\n[![AI Apple App review
    process](data:image/png;base64,)](https://synthanatomy.com/wp-content/uploads/2026/11/AI-Apple-App-review-process-delays.jpg)\n\n###
    AI And The Impact Of The Apple App Review Process\n\n24-48 days or a few days!
    That’s what most developers are currently dreaming of.&nbsp; The Apple App Review
    process is currently on the verge of collapsing due to the flood of new iOS apps
    (AI or not), or even hallucinating, if you ask iOS developers.\n\nVarious developers,
    including AudioThing, Igor Vasiliev, Sugar Bytes, and others, say their new apps
    have been stuck in App Review for weeks rather than days, with no updates. As
    a result, many releases focused on cross-platform compatibility are currently
    struggling.\n\nTake **Pittsburgh Modular** , for example: their new **Microvolt
    3901 synth** was released as a VST on October 27th, while the iOS version only
    arrived today, November 12th. However, they planned a simultaneous release.\n\n**Igor
    Vasiliev** ‘s new **HollowTone** app (go check out that brilliant app!) also spent
    weeks stuck in the review process.&nbsp; Most developers can handle a few delays,
    provided the app is good and ultimately gets purchased.\n\nThe problem arises
    when the app review process becomes erratic—or stops accepting the app altogether—even
    though it’s just another synth. Some developers have reported this.\n\n[![AI Apple
    App review process](data:image/png;base64,)](https://synthanatomy.com/wp-content/uploads/2026/11/AI-Apple-App-review-process-Unfiltered-Audio.jpg)\n\n###
    Unfiltered Audio Sinusoidal Run Rhythm\n\nUnfiltered Audio—which offers a range
    of high-quality AUv3 plugins in the App Store, including the brilliant Battalion
    drum machine—had trouble bringing its Sinusoidal Run Rhythm to market.\n\nMichael
    Hetrick of Unfiltered Audio, who’s been in the iOS game for years, wrote on the
    [Loopy Pro forum](https://forum.loopypro.com/discussion/69387/unfiltered-audio-sinusoidal-run-rhythm-and-srr-midi-public-beta/p2):\n\n>
    Apple seems to be using AI for automated App Store reviews. SRR got rejected 4
    times. The first time, they asked for a video of me demonstrating it (which almost
    always happens with our plugins).\n> \n> The second time, the editor hallucinated
    that “Polyharmonic” was an audio technology that we needed to show a documented
    license for to use the term in the description. The third time, it asked for a
    video again, this time with the app connected to the “required proprietary hardware”.
    The fourth time, it flagged SRR MIDI as spam because of its similarity to SRR.\n>
    \n> It was over a month of back-and-forth, so I threw my hands up and released
    it audio-only for now. What we will do is"
