  author: tombert
  text: I think about Something Awful a lot.<p>Something Awful has a $10 one time
    fee to buy an account; this is cheap enough to not really exclude any potential
    posters, but it does a good job weeding out a lot of low-effort spam; if you post
    a bunch of low effort stuff your account gets banned and you would have to buy
    another, which could get pretty expensive very quickly for spammers.  In the rare
    event that you <i>do</i> get a persistent spammer, it just leads to more revenue
    for the site.<p>Importantly, I think it&#x27;s a myth that people won&#x27;t pay
    for things on the internet.  People will pay for things if those things don&#x27;t
    suck.  Something Awful was&#x2F;is <i>fun</i> to go on, I&#x27;ve gotten many
    hours of enjoyment from it, so the $10 fee is a bargain to me.  I think it&#x27;s
    telling that people wouldn&#x27;t bother using Facebook if it actually cost them
    money, because <i>they don&#x27;t actually enjoy using the site very much</i>.<p>I&#x27;m
    not saying that SA is perfect and we can argue about the quality of its moderation,
    but I think it&#x27;s a model that is underutilized; I think such a model might
    be able to survive now that so much of the &quot;free&quot; internet has been
    botted to shit. I would like to point out that SA both predates and outlived MySpace,
    so it <i>can</i> be a sustainable model.
