  author: antonvs
  text: 'I wonder if the term might have been influenced by Terry Bisson&#x27;s excellent
    short story &quot;They&#x27;re Made Out of Meat&quot;[1], which was published
    in Omni Magazine in 1991.<p>Bisson himself credited the idea to the poet Allan
    Ginsberg[2]:<p>&gt; “I was thinking about an interview I had read or heard that
    Allen Ginsberg was doing with some journalist,” he stated, “and he was talking
    about poetry and the guy was saying that it was like they were two poets talking
    or something like that and Ginsberg says, ‘No, we’re just meat talking to meat.’
    And somehow that got stuck in my head.”<p>The earliest known online usage of &quot;meatspace&quot;
