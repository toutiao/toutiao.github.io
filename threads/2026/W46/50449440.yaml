  author: keane
  text: I agree that many or even the majority of posts were not helpful.<p>But there
    were some long-lasting OS flaws and third-party app frictions where the workaround
    was helpfully posted on this site. As an example, every time MacOS updated, Sonos
    would stop working. Privacy &amp; Security --&gt; Local Network --&gt; Toggle
    the permission for &quot;Sonos&quot; off. Wait. Toggle it back on. Fixed. (While
    doing this, you&#x27;ll also notice Google&#x27;s workaround of adding fresh entries
    here on each update of Chrome.) I think before Googling &#x27;mac sonos stopped
    working&#x27; I checked if the Sonos app had permissions and the OS reporting
    that it did is how I got stumped. A Google search and 30 seconds in one of these
    threads later and I learned the truth about the toggle on state. It seemed like
    an embarrassing workaround to leave necessary for a year but Apple seemed to be
    okay with this solution mentioned here and no where else.<p>Additionally, some
    phrases that you knew existed inside Apple products (like app store URL parameters
    or a Safari feature flag maybe) you might search as &quot;site:apple.com DisablePNGTransparency&quot;
    and the <i>only</i> result would be on discussions.apple.com and, yes, you would
    groan that Apple hadn&#x27;t bothered to document it and cringe as you prepared
    for the chaos you anticipated in the thread. But you still appreciated that you
    weren&#x27;t the first user to be looking for information about the term, you
    hadn&#x27;t dreamt it.<p>I wonder if Archive Team will care to scrape it before
    the 20th.
