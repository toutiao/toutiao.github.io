  text: 'Not sure what parent was referring to, but for me iMessage frequently gets
    confused when dealing with devices that don&#x27;t have a phone number or when
    moving SIMs between phones. Sometimes messages silently get routed to other devices
    or seem to disappear into the void in these cases which can be extremely frustrating.
    Since it&#x27;s Apple, there&#x27;s no way to tell when this is happening and
    try to correct it either. In <i>theory</i> iMessages tells me I&#x27;m sending
    a message to John Smith, but am I sending it to johnsmith@icloud.com or 555-122-4455
    or some other alias associated with that Apple user? No way to tell until you
    get some error in iMessage that the message could not be delivered and no way
    to explicitly select which alias is going to receive it as far as I can tell.<p>Edit:
