  title: Testing a Trash Can Faraday Cage
  fetch_status: success
  content: "- [Jeff Kaufman](/)\n- [Posts](/p/index)\n- [RSS](/news.rss)\n- [◂◂RSS](http://www.jefftk.com/news/back_from_2621.rss)\n-
    [Contact](/contact)\n\n* * *\n\n| \n### [Testing a Trash Can Faraday Cage](/p/testing-a-trash-can-faraday-cage)\n
    | November 10th, 2026 |\n| _[preparedness](/news/preparedness)_, _[tech](/news/tech)_
    |\n\nWith how quickly AI is going basically all futures are weird in some ways.
    I've been thinking about how this affects me personally, and \"try as hard as
    possible to keep AI from getting us all killed\" is pretty high on the list. For
    me this mostly looks like [donations](https://www.jefftk.com/p/donating-80-while-it-still-counts)and
    [pandemic deterrence](https://securebio.org/detection/), but I also put some time
    into thinking about [disasters](https://www.jefftk.com/p/disasters). There are
    ways AI might go very well, or very poorly, and then there's the \"messy middle\"
    where we muddle through and things might fall apart some in the meantime.\n\nThe
    big things here are making sure you have enough water and [food](https://www.jefftk.com/p/storing-food)
    for a while, along with [critical medications](https://www.jefftk.com/p/emergency-prescription-medication)
    and the standard \"prepping\" recommendations. But lately I've been thinking about
    what you might do for other risks, such as [engineered](https://www.jefftk.com/p/elastomeric-fitting-session)[pandemics](https://www.jefftk.com/p/running-an-air-purifier-on-batteries),[mirror
    bacteria](https://www.jefftk.com/p/initial-diy-cleanroom-experimentation), or
    [fire suppression outages](https://www.jefftk.com/p/estimating-our-tail-fire-risk).
    And today, [EMP](https://en.wikipedia.org/wiki/Nuclear_electromagnetic_pulse)s.\n\nAn
    EMP is an electromagnetic pulse, and a strong one could destroy a lot of electronics.
    The most likely way we get one in the near future is a high-altitude nuclear detonation.
    This could be part of a nuclear war, or fighting around an AI takeover attempt.\n\nIt's
    not totally known what effect an EMP would have on stuff. The initial pulse (\"E1\")
    is very short and the voltage it induces is proportional to the length of the
    conductor it hits. The power grid (famously involving long conductors) would be
    seriously damaged, especially the massive and hard to replace transformers. Unplugged
    electronics, however, are pretty safe: no long conductors to get high voltages.\n\nThe
    best source I've found on EMPs is the 2008 [Report of the Commission to Assess
    the Threat to the United States from Electromagnetic Pulse (EMP) Attack](https://tile.loc.gov/storage-services/master/gdc/gdcebookspublic/20/23/69/30/57/2023693057/2023693057.pdf).
    They simulated nuclear EMPs and looked at how a wide range of common things were
    impacted. Generally things were fine as long as they were off and unplugged.\n\nOn
    the other hand, this was all tech from two decades ago, and it's possible that
    things have changed. Many things now have more resistance to electromagnetism
    in their design (shorter conductors, more PCBs vs wires, more shielding) but some
    electronics are more voltage-sensitive (ex: switching transistors from silicon
    to gallium nitride, smaller transistors generally). One category I'm especially
    worried about is equipment that's never fully off, because it has a permanently
    attached battery. For example, I have some[LiFePO4](https://www.jefftk.com/p/running-an-air-purifier-on-batteries)batteries
    and these have a built in battery management system: an EMP might be able to break
    this in a way that can't be fixed without opening up the system and disconnecting
    it, which is pretty risky.\n\nOverall, I think it's pretty likely that for EMP
    resistance it's enough to leave your equipment off and unplugged. Unless you're
    excited about testing Faraday cages, make sure your stuff stays unplugged and
    you can stop reading now.\n\n* * *\n\nWhat if we're wrong and in the past 20y
    equipment has become more vulnerable to EMPs than we expected? What if you didn't
    do the research above until after you went and got a galvanized trash can, a noise
    generator, a radio receiver dongle, and some conductive tape?\n\nThe standard
    way to protect against electromagnetism is a [Faraday cage](https://en.wikipedia.org/wiki/Faraday_cage).
    If you put something inside a metal box, as long as there aren't gaps in the box
    the electromagnetic field stays outside. A large mass-produced metal box is an
    [Oscar](https://en.wikipedia.org/wiki/Oscar_the_Grouch)-style galvanized trash
    can. How much would it help to put our stuff in that? And would it help more to
    seal the gap between the lid and the body with metallic tape?\n\nI set up a [cheap
    broadband radio-frequency noise generator](https://www.amazon.com/dp/B0DK34P3N4)
    with a [29\" telescoping antenna](https://www.amazon.com/dp/B09BVNK7WV), powered
    by the 12v power supply from an AirFanta 3Pro. Since I knew this needed to work
    inside a trash can, I used my Anker SOLIX portable power station instead of the
    wall. I also put a cardboard tube around the antenna and put the base in a cardboard
    box, so that it wouldn't touch the body of the trash can. The goal was to block
    electrical connections, without affecting the radio signal.\n\nTo pick up the
    signal I used a [Nooelec NESDR SMArt v5](https://www.amazon.com/dp/B01GDN1T4S),
    attached to my laptop. This has a very similar antenna, and I set it up a ~foot
    from the noise source antenna and parallel:\n\n[![](/receiver-source-no-trash-can.jpg)\n\n](/receiver-source-no-trash-can-big.jpg)\n\nI
    compared this to the same setup with a trash can around it:\n\n[![](/receiver-source-in-trash-can.jpg)\n\n](/receiver-source-in-trash-can-big.jpg)\n\nI
    tested both with the lid on, and with the lid on and also seam taped:\n\n[![](/trashcan-taped-seam.jpg)\n\n](/trashcan-taped-seam-big.jpg)\n\nTechnically
    I'm measuring in the \"wrong direction\" since I would be very surprised if an
    EMP were initiated inside a trash can in my basement, but shielding works the
    same in both directions so this doesn't matter. How much noise gets out in each
    of these tests tells us how the configuration changes how much of a pulse would
    get in.\n\nI had Claude write the software and run the measurements. It steps
    the radio receiver from 24 MHz to 1.7 GHz (its full range) and records power in
    each 100 kHz slice. We tested:\n\n- Source off (background: FM stations, cell
    towers, the receiver's own noise)\n- Source on and no can (reference)\n- Source
    in the can with the lid off\n- Source in the can with the lid on\n- Source in
    the can with the lid on and taped\n\nHere's what I found, in dB. Every 10 dB is
    a factor of ten, so 30 dB means only 0.1% of the power got through:\n\n| Band
    (MHz) | Limit of detection | Lid off | Lid on | Lid taped |\n| --- | --- | ---
    | --- | --- |\n| 25–50 | 20 | ≥20 | ≥20 | ≥20 |\n| 50–100 | 21 | ≥21 | ≥21 | ≥21
    |\n| 100–200 | 29 | ≥24 | ≥25 | ≥25 |\n| 200–400 | 29 | ≥28 | ≥29 | ≥29 |\n| 400–800
    | 35 | 19 | ≥31 | ≥30 |\n| 800–1200 | 45 | 18 | ≥43 | ≥45 |\n| 1200–1700 | 47
    | 22 | 29 | ≥46 |\n\nA \"≥\" means I couldn't detect the source at all, so we
    just have a lower bound on the reduction, determined by our ability to distinguish
    the source from background (limit of detection).\n\n[![](/attenuation-by-frequency-trash-can.png)\n\n](/attenuation-by-frequency-trash-can-big.png)\n\nNotes:\n\n-
    A lot of this is lower bounds. The receiver only has about 45 dB between noise
    and overload, and less than that at radio station frequencies.\n\n- The lid does
    leak at the seam. At the highest frequency (1.2–1.7 GHz) it's ~29 dB, with dips
    down to ~20 dB, and there was also a very narrow leak at 339 MHz where the can
    did ~nothing. The lid makes good contact with the can most of the way around,
    but there are four spots, evenly spaced, where the rim has ~1cm gaps to let the
    lid flex. I think these are the most likely culprit, though I haven't confirmed
    it.\n\n- Taping the seam fixes the leak. Once I taped all the way around I didn't
    detect the source at any frequency, including the problem frequencies above.\n\n-
    The \"lid off\" test isn't realistic. The wal"
