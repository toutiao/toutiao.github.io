  author: Animats
  text: |-
    The Oahu info is interesting. That was a series street light system, something rarely seen any more. The idea is that all the bulbs are wired in series, the street light system is a big loop, and there&#x27;s a constant-current transformer at the head end, providing a few thousand volts.<p>Constant current lighting is kind of a mirror world of normal constant voltage systems. Each lamp is equipped with not a fuse, but an insulating shorting disk between two contacts, wired in parallel with the bulb. In normal operation, each lamp sees 1&#x2F;N of the system voltage, usually 120V. If a lamp burns out, no current flows, all lights go out, the failed lamp&#x27;s insulating disk sees the full system voltage, the high voltage arcs through the insulating disk, the contacts close, and the dead lamp is thus bypassed. Now the lamp string has less resistance, current goes up a bit, the constant-current transformer adjusts, and things go back to normal, minus one lamp.
    The Oahu system had a mix of incandescent and mercury vapor lamps, running at different voltages. complicating the situation.<p>This is apparently a bad case for EMP vulnerability. But all that happened was that some of the shorting disks at the voltage conversion points arced through and cut that part of the loop out of circuit.<p>Those old series lighting systems are almost totally gone. But one application for series lighting remains - airport runway lights. That&#x27;s because it&#x27;s the easiest way to get uniform voltage for a string of lights several miles long. No need for a distribution transformer every few hundred feet.
