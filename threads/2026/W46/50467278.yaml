  author: superkuh
  text: Yep. The exact placement of the monopole w&#x2F;r to the close can wall will
    change the the polarization which changes how will it will get through the imperfections
    in the horizontal seam slots which will be polarized. And that&#x27;s ignoring
    the that different places will be better or worse (vs frequency) for exciting
    the can&#x27;s cavity modes (at $frequency) in the first place.<p>But a long distance
    high power RF source can have these properties altered too by the type of emission
    mechanisn, reflections, scattering, etc and items placed in such a faraday cage
    will be located at good and bad places to excite the cavity mode too.<p>So it&#x27;s
    kind of a wash and probably okay for this kind of test. The fact that the electric
    and magnetic components of the field aren&#x27;t in balance (near field) doesn&#x27;t
    matter too much.
