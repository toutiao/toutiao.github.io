  author: KennyBlanken
  text: 'This is idiotic.<p>First off, this isn&#x27;t Hollywood. You can&#x27;t put
    an EMP device in the back of a panel van like in Ocean&#x27;s 11. There are no
    non-nuclear weapons that can do the whole &quot;aliens knock out all our electronic
    devices&quot; schtick.<p>The effects of HEMPs (ie extremely high altitude nuclear
    explosions) are wildly overstated and based off Starfish Prime which was in the
    60&#x27;s, with the effects used to scaremonger people ever since. The electrical
    grid and everything connected to it then, bears nearly zero resemblance to the
    grid of today and the devices on it. Both the grid and everything connected to
    it are all much better protected and tolerant of electrical surges. Also, if a
    country did something like Starfish Prime it would take the US <i>minutes</i>
    to figure out where the weapon had come from, regardless of what country did it,
    or what country was hit, because US space command tracks everything bigger than
    about the size of an apple.<p>Your cell phone (and nearly everything else around
    you that is electronic) is designed to handle static electricity shocks which
    can be 20,000 volts and 10-20mJ. The modern electrical grid is designed to tolerate
    solar flare storms and more, with automatic protection devices that trip disconnects,
    and there are millions of arresting devices (like this: <a href="https:&#x2F;&#x2F;www.hubbell.com&#x2F;hubbellpowersystems&#x2F;en&#x2F;products&#x2F;power-utilities&#x2F;arresters&#x2F;cl&#x2F;559824"
    rel="nofollow">https:&#x2F;&#x2F;www.hubbell.com&#x2F;hubbellpowersystems&#x2F;en&#x2F;products&#x2F;powe...</a>)
    all along transmission lines and in stations to deal with lightning strikes and
    so on. Our electrical grids have much more sophisticated monitoring and automatic
    protection devices. Substations have their own backup power systems to keep control
    systems running for restarting after a blackout.<p>Most electronics made in the
    last 40 years are well shielded for EMI&#x2F;EMF for preventing &amp; not being
    affected by interference. That same shielding protects against emp&#x27;s. Open
    up any laptop or desktop. fully shielded inside. Nearly every switching power
    supply has both wide input voltage range but also internal surge protection, and
    high voltage isolation is extremely common, at least in well made devices. Go
    look at a writeup about an Apple USB power brick to see what this looks like when
    it&#x27;s well done.<p>Most semiconductors, with some exceptions, are generally
    much more tolerant of surges and static electricity, or the circuits built around
    them are better designed to protect them.<p>Nearly any car made in the last 20
    years has electronics that are very tolerant of electrical noise and voltage spikes.<p>EMF
    pulses were a concern in the 50&#x27;s through the 70&#x27;s because nothing was
    shielded, electronics and chips were poorly protected, and nearly every household
    appliance or electronic device was two-prong and if it had a ground lug, it was
    rarely connected. Electrical codes are stricter, houses have the ground circuit
    connected to an earthing rod and also often the water pipe if the pipe coming
    into the house is metal, semiconductors and circuits are better designed, and
    so on.'
