  author: snowwrestler
  text: 'The PHP2Shell vulnerability ended up being paradoxically comforting for me.<p>They
    turned frontier models loose on PHP, and the big one they found was based on a
    previously known logic flaw that was extremely difficult to exploit. Which makes
    sense: hence the need for frontier models.<p>And in the wild, while there have
    been many attempts and a few simple demo successes, the practical impact has seemed
    to be small, seemingly constrained by the length of the chain and the diversity
    of PHP configs.<p>In short, it was indeed a major vulnerability, but not magic
    (in the Arthur C Clarke sense).<p>I think ultimately the fear comes down to: do
    you believe that code can be secured. I recognize that there is probably no objective
    way to deductively prove it because of the Halting Problem etc. But if one believes
    code can be constructed to operate to spec, then there must be a limit to the
    damage an LLM can do, even a very smart one.<p>I think we are going through a
    phase where a lot of known triaged code shortcomings will get exposed and hopefully
    fixed. Sucks while it is happening. But not actually the first round of this type
    of evolution. And ultimately I think as before, we will come out the other side
    with more secure and durable technology.'
  score: 0
