    also mostly design (intended for manufacture). Unless you&#x27;re an EE working
    primarily on one-offs, and small ones at that, you don&#x27;t build most of the
    products of your mind. MEs don&#x27;t build the cars. CEs don&#x27;t build the
    dams or bridges.<p>Engineering is principally a design discipline, with a small
    fraction actually doing the hands-on building of their designs at least once they
    hit a certain scale of manufacture or get past prototyping. Technicians, skilled
    and unskilled labor, and machines do the vast majority of the building of those
    designs.
