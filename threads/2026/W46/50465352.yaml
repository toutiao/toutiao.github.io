  text: Capsicum did this for the POSIX model, and they have rigorous analyses (and
    maybe proofs). But of course the first thing they did was remove the filesystem
    namespaces from the process, requiring significant rearchitectures of existing
    software. You can still use file descriptor passing to give file and even directory
    access, but it still requires some significant work.<p>Linux never accepted the
    Capsicum patches, but they eventually added process descriptors and some important
    openat flags so that almost all the difficult pieces are effectively in place.<p>I
    don&#x27;t know how far along they&#x27;ve gotten (presumably not as nearly far
    as OpenBSD has gotten with pledge+unveil refactorings), but FreeBSD reworked many
    of their utilities and services to utilize Capsicum.
