    suddenly change at runtime due to an idiosyncratic failure of the environment
    where that formally verified code runs.<p>This is one of the real limits of formal
    verification. Defects or subtle inconsistencies in hardware are not that uncommon.
    This is mitigated to a some extent by using assertions in release builds but this
    has significant limitations.
