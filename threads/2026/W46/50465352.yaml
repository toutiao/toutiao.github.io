  author: Veserv
  text: Yes, a dynamic sized hash table is hard to prove unless you just take it axiomatically.<p>How
    are you demonstrating that Insert(“Alice”, True) followed by Insert(“John”, True)
    does not result in memory stores that cause Get(“Alice”) to not return True? Or
    result in Get(“Blorg”) giving a different value?<p>How are you proving that you
    can lift this generically so you can reason about non-interference considering
    only the abstract interface? So you can generically reason that Insert(x, _) allows
    you to continue to assume that Get(y) is unchanged if x != y even in the presence
    of dynamic resizing and copying of the underlying data in a hash table implementation?
    How are you proving that about the keys the leaf piece of code does not even know
    about even though it may have changed the memory locations previously used in
    the Get(unknown y) calculation?<p>How are you proving that no other operation
    violates that abstract data model and can thus be ignored for the purposes of
    your proof? And as a corollary, how do your proofs start failing if a violating
    operation is added?<p>Sure, if you just assume you have a magical key-value map
    that does not interact with the concrete data model, then life is easy because
    you skipped the hard part. Being able to easily encapsulate a data model into
    a higher-abstraction data model is the thing that is largely missing. It is why
    formal proofs generally stop in the low hundreds of lines proving a single data
    structure and its operations.<p>Building and proving you implement usable abstractions
    that can be reasoned about by your proof system at the abstract level is extremely
    hard with current systems.
