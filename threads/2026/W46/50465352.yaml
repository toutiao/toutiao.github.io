  author: WorldMaker
  text: 'It&#x27;s the same boolean value that you are testing: does it &quot;halt&quot;
    because it completed its computation successfully or does it &quot;halt&quot;
    because it failed? If Program A terminates on success and Program B terminates
    on failure you can generally rewrite one to be the other (run Program A in a busy
    loop after a success; monitor Program B in another process and report the first
    success then kill B). Ultimately, you have the same decidability problem asking
    &quot;does it halt?&quot; and if you could solve it for one case you could solve
    it for the other.<p>In fact, it&#x27;s generally considered a <i>harder</i> problem
    to include the second boolean &quot;does it halt successfully?&quot; Does it stop
    at all is a hard enough question before asking if it stops with a success or a
    failure&#x2F;crash. In practice this is often the easier problem to debug: once
    it stops we generally know if it was successful or failed. But that doesn&#x27;t
    help to answer the questions like &quot;will it <i>always</i> stop successfully?&quot;
    or &quot;will it &#x27;forever&#x27; run successfully without ever stopping for
    a failure&#x2F;crash&#x2F;hang&#x2F;deadlock?&quot;'
