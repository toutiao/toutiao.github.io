  author: sigbottle
  text: Basic problems such as change over time and interoperability are reasons why
    formal methods break.<p>Formal specification presumes a priori a great deal of
    control over the world in general, <i>especially</i> the more you move away &quot;from
    nature&quot; and more towards what a human might want to instantiate themselves.
    Formal methods often try not to deal with things they don&#x27;t &quot;understand&quot;,
    or try to abstract the parts that &quot;don&#x27;t matter&quot; away. But inevitably
    it changes, and the repsonse to that change is to subsume more and more into your
    own ontology so you understand the nuances. Or you simply control all interoperable
    endpoints, and so the nuances vanish away, because <i>you&#x27;re</i> in control.<p>This
    is great when the battle is against nature. &quot;Nature&quot;, for all its ambiguities,
    we generally can assume to be stable. What about with human society?<p>In some
    sense, there might not be much <i>to</i> formal methods if you could solve the
    underlying capability of getting everybody to agree on the semantics in the first
    place, and have no desire for change at all. But that is an absurdly strong requirement.
    Formal methods is constantly a race to try and find good abstractions and then
    breaking them.<p>I don&#x27;t think there really is a way out of this, but I&#x27;m
    not that creative :&#x2F;
