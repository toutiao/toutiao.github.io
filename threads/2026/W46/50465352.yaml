  author: js8
  text: I don&#x27;t think there is a hard dichotomy (and I also think the original
    article is mostly wrong).<p>The software is always interpreted in the real world,
    and you can always convert the software plus the interpreter into a mathematical
    proof (via Curry-Howard isomorphism) that given input gives a given output. It
    is mathematically equivalent to running a program, up to the reliability of the
    interpreter and correctness of the mathematical model of the interpreter.<p>What
    might be a bit harder, to show, that a set of inputs causes a set of outputs.
    But that&#x27;s just partial interpretation and depending on properties, in practical
    programs quite doable.<p>And frankly, existence of LLMs shows that you can quite
    easily prove most program properties. When LLM creates a program it translates
    a program description in natural language together with formal version of natural
    language (which it has from training) into a computer program. In other words,
    LLM doesn&#x27;t work with the real world, but with a model of the real world.
    Although LLM&#x27;s world model is not sound (in the sense that logical fragment
    of its reasoning has not been proven sound), many people are mostly happy with
    the results. This shows that LLM can preserve properties between the description
    of the program in natural language and the world model embedded in LLM (these
    often include implicit desirable properties), and the resulting source code to
    be executed. And if you&#x27;re able to preserve the properties, the actual sound
    proofs transfer by construction, too (up to the few cases where LLM slips and
    reasons unsoundly, but AI labs are trying hard to reduce these cases to minimum).
