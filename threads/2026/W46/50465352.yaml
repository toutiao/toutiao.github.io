  author: the_af
  text: "&gt; <i>A lot of modern programs never terminate and thus to me &quot;halting&quot;
    means no longer able to compute, i.e it&#x27;s hung&#x2F;deadlocked.</i><p>The
    terminology of the &quot;halting problem&quot; is a very specific term of computer
    science, and it didn&#x27;t age badly. This is like saying a reactor &quot;going
    critical&quot; hasn&#x27;t aged well because non-physicists don&#x27;t understand
    what &quot;critical&quot; means: it&#x27;s not meant for them. Or about &quot;prime
    numbers&quot; because non-mathematicians don&#x27;t know what &quot;prime&quot;
    means. Or what a &quot;continuous function&quot; is, etc, etc. You get the idea.<p>Modern
    programs are still composed of functions, and those functions are subject to the
    halting problem, in the sense that they get inputs and provide outputs. If they
    don&#x27;t, they did not &quot;compute&quot; in precisely the sense you meant
    it. So let&#x27;s say your videogame or whatever is waiting for input (the joystick
    or mouse) and you don&#x27;t provide it, and because it&#x27;s a turn-based game,
    nothing else happens. Has it &quot;halted&quot; in the sense we&#x27;re discussing?
    Nope. It would be subject to halting if, once you provide input, the program cannot
    produce the intended result for your input (move a sprite, display &quot;game
    over&quot;, start another round, play an animation, modify internal game state,
    etc).<p>In other words, Computer Science talks of &quot;programs&quot; but it&#x27;s
    really any computation that takes an input and produces an output, and modern
    programs are made of them, so the problem applies to them."
  score: 0
