  author: johnbender
  text: As best I can tell the article wrongly conflates Rices Theorem with the idea
    that one can’t prove something about the small program generated by Yedidiya and
    Aaronson but that’s not what Rices Theorem tells us. Instead it tells us that
    we can’t come up with a general method to determine yes or no correctly for all
    programs whether a program reaches a given point.<p>For a given program and a
    one off proof one can prove many things or if we over approximate by assuming
    loops terminate we can prove many things soundly with the risk of rejecting programs
    that are sometimes correct (eg type systems).<p>This may have been a quirk of
    language or my interpretation though.
