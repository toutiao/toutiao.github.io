  author: Aurornis
  text: "&gt; Anyone care to guess why someone would make this choice?<p>My guess:
    At some point in the past, a firmware was developed without plans to include firmware
    update functionality. The team that did this was later burned when the client
    tried to use a new certificate that the hardcoded, unchangeable system didn&#x27;t
    recognize.<p>Angry meetings occurred, developers were chastised, and someone realized
    they could avoid that problem by fetching an updated root CA on demand. They did
    it over HTTP to avoid a chicken and egg problem.<p>In hardware manufacturing,
    everything is about crossing items off the list of problems. A problem was raised,
    someone came up with an idea to solve that problem, and it was implemented. The
    practice might have spread to other products because it became institutional knowledge
    about how to avoid a problem that made a customer angry once.<p>This is from my
    experience in the consumer hardware industry. If you&#x27;re not watching the
    outsourced development closely, they will take the easiest route to solve the
    problem in front of them and nobody will consider any other consequences."
  score: 0
