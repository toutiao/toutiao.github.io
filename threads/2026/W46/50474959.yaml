  author: NotOscarWilde
  text: "(Not the OP, but want to spread awareness, sorry.) The Wikipedia page already
    lists the greatest disadvantage:<p>&gt; (..) the ability to commission a finished
    product into a Matter network in the field mandates certification and membership
    fees, entailing both one-time, recurring, and per-product costs. This is enforced
    using a public key infrastructure (PKI) and so-called device attestation certificates.<p>Matter
    is designed to necessitate phoning into the internet for certification, which
    allows all manufacturers to just easily add-in phoning into the internet for telemetry.
    Furthermore, it does not define exactly which functionality must remain if a device
    is disconnected from the internet for a long time (assuming the user is trying
    to avoid sending out telemetry, not even bypassing certification)."
