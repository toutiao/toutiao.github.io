  author: notaproton
  text: 'It kind of makes sense opsec wise when you are on a network with adversaries
    though.<p>1) Others knowing knowing exactly which package you are downloading
    could give them a very clear way to fingerprint and target services you are running<p>2)
    HTTPS could allow you to potentially reduce your risk surface in a case where
    there is a bug in Steam&#x27;s signature checker itself and someone sends a crafted
    payload instead of game files. Server validation would have prevented that. This
    has actually happened with apt before: CVE-2019-3462.<p>Odds are small, but I
    believe in DiD. I could imagine an attacker with nothing better to do could get
    up to this on say, a Uni&#x27;s network.<p>And before you come at me with I should
    be using a VPN to protect against these scenarios, I do that already. This is
    about HTTPS being a sane default when possible.'
