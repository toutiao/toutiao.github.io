  author: bombcar
  text: I took a Vornado TRANSOM, a Broadlink RM4, and a Shelly Smart Plug, a Qingping
    Air Quality Monitor Gen 2 + claude and HASS, and now I have a fan that turns itself
    on when the CO2 level gets too high.<p>And I can override or change it from Apple
    Home.<p>The smart plug lets it verify that the fan is actually running, (because
    it measures usage) and we worked out that after a power cycle the Vornado goes
    back to a known state,  and we can find the speed by forcing it all the way to
    4 and then stepping back.
