article:
  url: https://scottjg.com/posts/2026-11-11-reverse-engineering-my-coway-air-purifier-to-ditch-the-cloud/
  title: Reverse Engineering My Coway Air Purifier to Ditch the Cloud | Scott's Blog
  fetch_status: success
  content: "![Photo of the titular Coway air purifier](https://scottjg.com/posts/2026-11-11-reverse-engineering-my-coway-air-purifier-to-ditch-the-cloud/coway-airmega-icons-cover.jpg)\n_Nice
    enough air purifier, but I don’t love the app._\n\nThe year is 2017. A string
    of annual wildfires rocks the West Coast. The sky looks like this in the daytime:\n\n![A
    city skyline with an orange sky](/posts/2026-11-11-reverse-engineering-my-coway-air-purifier-to-ditch-the-cloud/orange-sky.jpg)\n\nMy
    home, like many in the Bay Area, has no insulation and isn’t really air sealed.
    To avoid choking on soot, a lot of people started buying [air purifiers like this
    one](https://link.amazon/B0a88fihq):\n\n![A Coway ad showing a black and a white
    Airmega purifier, each a square box with a large round front panel, under the
    headline Wirecutter top pick for 10 years](coway-mighty.jpg)\n_The venerable Coway
    Airmega_\n\nIt’s an overpriced box fan with a HEPA filter and an air quality sensor.
