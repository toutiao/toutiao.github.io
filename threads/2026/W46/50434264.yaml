  author: miki123211
  text: 'On that note: I was always wondering whether you could do stupid CT log tricks.<p>If
    I remember correctly, Let&#x27;s Encrypt lets you go up to a hundred domains per
    certificate, with 256 characters per domain[1]. If you get a short domain like
    a.bc and start requesting certificates for its subdomains, you can easily get
    a few kB of user-controlled data embeddable per certificate. Given LE&#x27;s rate
    limits, it should, within a few weeks of easily-automated work, be possible to
    embed child pornography into a CT log, making it illegal to host and destroying
    it completely.<p>You could do something more useful (and less destructive) with
    this idea; like embedding a separate public key, with the corresponding private
    key stored offline in an HSM, which could then be used to sign the location of
    your new domain in case the old one was seized. This would, in a weird and perverted
    way, add a lot more censorship resistance to DNS than what it natively provides.<p>You
    could even use a CT log as a blockchain, with the order of log entries being used
    for consensus.'
