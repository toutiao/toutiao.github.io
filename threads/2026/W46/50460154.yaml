  author: zbentley
  text: Not to be That Guy, but WINE <i>doesn&#x27;t</i> use those techniques, and
    thus isn&#x27;t an emulator.<p>It lightly translates <i>binary formats</i> (Windows
    executables) into Linux-compatible executable code, and then runs that code against
    libraries that implement Windows APIs in terms of Linux underneath. It&#x27;s
    not an emulator in the same way that your libc isn&#x27;t <i>emulating</i> lockf(3)
    in terms of fcntl(2) underneath. In web-dev parlance, we&#x27;d call WINE a polyfill.<p>Rosetta
    and QEMU on the other hand <i>are</i> emulators--emulators, in this instance,
    being a term of art that implies interpreting bespoke meaning from machine code
    instructions written in another program. Some emulators translate instructions
    1:1, some have optimized stencils, some (like Rosetta) have kernel support for
    emulating very quickly, and some (maybe like Rosetta; sources disagree) also have
    hardware support as well.
