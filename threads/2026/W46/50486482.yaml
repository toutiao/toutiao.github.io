  author: StableAlkyne
  text: A major barrier to the improvement of giant FOSS replacements like GIMP and
    LibreOffice is that the people who develop it and the people who use it have become
    very used to all of its quirks. It&#x27;s extremely hard to identify the rough
    edges in a UI without an external perspective.<p>Blender is a little different
    because every 3D modeling program is odd in its own way, and the new UI was close
    enough that it was easy to learn after the transition (I do still use the legacy
    keybinds though).<p>But Blender is very niche hobby software. To &quot;succeed&quot;
    (if we define success as capturing a significant user share from closed source
    spyware), Libre and GIMP need to offer workflows that are close to what the average
    non-coder technical person expects. Maybe that isn&#x27;t valued by the teams,
    or maybe they don&#x27;t have enough resources to make it happen, but the end
    result is a reputation of jank.<p>I dislike vibe coded clones because of concerns
    about the engineering quality. But the reason they&#x27;re making waves when traditional
    FOSS hasn&#x27;t is that the UX is leagues ahead.
  score: 0
