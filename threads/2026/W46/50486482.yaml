  author: adrian_b
  text: Are you talking about MS Office?<p>In my opinion, the user interface of modern
    MS Office is absolutely horrible.<p>I have used a lot of old MS Office versions,
    and until 20 years ago I thought that its user interface was very good.<p>Then
    there was a gap of about a decade when I did not need MS Office at work and I
    also had no reason to update my personally purchased MS Office Professional (which
    I was running on Linux, using Crossover, where it was more performant and more
    stable than on Windows; Crossover is a paid derivative of Wine, which ensures
    a better support for MS Office and for other professional applications).<p>After
    that gap, when I encountered again MS Office, I was shocked by how awkward its
    UI had become meanwhile.<p>Today I prefer very much the UI of LibreOffice, which
    is similar to the old MS UI, instead of the modern MS Office UI.<p>There are a
    lot of details that I dislike in the LibreOffice UI, but even so, I consider the
    MS Office UI much worse.<p>Because there was a time in the past when I was a heavy
    MS Office user, when using the modern MS Office I am aware about a great number
    of commands that exist, but I am no longer able to find them in the MS Office
    menus.<p>In the old MS Office, those commands were grouped in a way that was logical
    for me, so it was easy to find them even when I did not know where they were,
    because I had not used them before. But in the modern interface many commands
