    also not saying that this subsidy is irrational, it does buy mindshare, but it
    still distorts the true demand for tokens. I wouldn&#x27;t be using anywhere near
    as many tokens if the price was as high as the API costs, if anything I would
    switch to a cheaper model, and likely not an Anthropic one.<p>If you&#x27;re gonna
    point to gross margins on the API, those 85% really are meaningless in isolation.
    They <i>can</i> charge top dollar because they have one of the top models, but
    only because they <i>keep spending</i> top dollar on training it, as does OpenAI.
    It&#x27;s a game of chicken where whoever stops heavy training investments first
    is likely the one to lose market share to whoever keeps spending. So the play
    is to try and keep the investment capital flowing and be the last one standing,
    which only works if you can keep selling a fantasy of <i>future revenue</i>, not
    the dire reality of current revenue.
