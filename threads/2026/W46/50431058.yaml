  author: kube-system
  text: "<i>Zip codes</i> aren&#x27;t even quite specific enough to get to the route
    level.  But <i>postal codes</i> in the US pre 1962 were not even zip codes.<p>My
    grandfather&#x27;s postal code growing up in the US was simply &quot;6&quot;.
    \ He did not have a zip code, because they had not been invented yet.<p>We didn&#x27;t
    quite get enough info to determine the particular route until Zip+4 in 1983.<p>&gt;
    It&#x27;d find it difficult to believe that when the system was originally created,
    mail delivered by a Nevada post office to a physical location in California had
    a zip code starting with a 9 rather than an 8.<p><i>When the US first implemented
    postal codes</i>, 100+ cities had a duplicate postal code of &quot;1&quot;, which
    was the first postal zone within <i>that particular city</i>.  We&#x27;ve increased
    the specificity of our postal codes twice since then.  (well, three times if you
    count IMb)<p>But more to your modern zip code example -- addresses and their 5
    digit ZIP codes historically followed the post office together in lock step.  (This
    is why many system have separate &quot;mailing addresses&quot; from &quot;physical
    addresses&quot;, they weren&#x27;t always the same thing) -- e.g. if you lived
    in rural town and your mail was delivered from a different town you&#x27;d have
    something like a rural route address and both the municipality and the zip code
    you&#x27;d put on the letter would be for town the post office was in, not the
    town you lived in.<p>For example, when I was young and wrote a letter to my grandmother,
    I wouldn&#x27;t put her street address on it... because she didn&#x27;t have one.
    \ I&#x27;d address it to her rural route number and box number, and I would address
    it not to the town she lived in, but to the town the post office was in, and the
    zip code of that post office.<p>In the case where this was across state lines,
    your mailing address would be a different state than where you lived.<p>This is
    part of the reason why USPS has been converting from RR addresses to the Locatable
    Address Conversion System.  Because it was difficult for first-responders to find
    homes when people calling didn&#x27;t have addresses that matched where they actually
    were."
