  author: exogenousdata
  text: Structural changes are required for then USPS to be financially stable.  Chief
    among them is modifying the Universal Service Obligation (USO).<p>For far too
    long, private shipping&#x2F;logistics firms like UPS &amp; FedEx unfairly take
    advantage of the requirement by the USPS to deliver mail six days a week to over
    160 million addresses at uniform, affordable rates.  UPS&#x2F;FedEx will receive
    the package and do the long haul.  But then instead of driving the package to
    a final residential doorstep themselves (incurring high residential and fuel surcharges),
    they drop it off at a local USPS branch or regional hub.  USPS letter carriers
    complete the final-mile delivery to the recipient&#x27;s home or P.O. Box.  It&#x27;s
    literally part of their business model.  UPS calls it &#x27;UPS Ground Saver&#x27;
    and FedEx calls it &#x27;FedEx Ground Economy&#x27;.<p>These hybrid services typically
    cost 20% to 40% less than standard UPS Ground or FedEx Ground.  It takes longer
    to ship but UPS&#x2F;FedEx bypass the steep residential delivery fees (often $6.45–$6.50+
    per package) that private carriers charge for dropping off at houses rather than
    businesses.  Also, it&#x27;s the only way to deliver to PO Boxes because standard
    UPS and FedEx ground services don&#x27;t do directly.<p>This is classic example
    of capitalism where private companies &#x27;keep profits and socialize losses&#x27;.  The
    5% annual dividend paid by FedEx every year to shareholders is paid for by American
    tax-payers funding the last-mile delivery of packages at dirt cheap rates.
  score: 0
