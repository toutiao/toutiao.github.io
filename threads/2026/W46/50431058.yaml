  author: ezfe
  text: |-
    Well, Postal Code is a geographical region but it&#x27;s not one aligned with legal boundaries.<p>These are all real scenarios I&#x27;ve lived&#x2F;have family who has lived:<p>- Town A contains a region called &quot;Village B&quot; with no distinct government structure. However, Village B has its own post office, so a subsection of Town A has a separate ZIP Code and is delivered mail by this second post office.<p>- Town C contains two disjoint sub-regions (unincorporated villages) called &quot;Village D&quot; and &quot;Village E.&quot; Both have post offices and both have their own ZIP Codes. Some addresses in Village D are delivered mail by the post office in Village E—not the one in Village D.<p>- Town F has its own post office, but a street in town F receives mail delivered by the post office in Town G.<p>The practical impact of these is twofold:<p>- Mail is written to addresses not matching the municipal governmental structure of your town&#x2F;city.
    - Mapping apps that rely on USPS data to provided addresses (which is generally good, because it means mail will go to the right place) will show the wrong legal town names for the structure.
