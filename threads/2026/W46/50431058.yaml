  text: As someone who has worked with geodata quite a lot, that wouldn&#x27;t be
    a good idea in terms of resource usage. You are blowing up the size of the dataset
    by one or two orders of magnitude. Maybe even more. Processing these polygons
    would be extremely annoying.<p>I once built an interactive map for some areas
    in Switzerland with postcodes rendered on it. I had to use a lot of tricks to
    keep it down to a few hundred KB for just about 5% of Switzerland&#x27;s area.
    If I tried to add more areas, I&#x27;d have to abandon the approach of rendering
    polygons directly with Leaflet and move to static, pre-rendered images. Now, if
    you add 10 or 100 times more points, you would barely be able to render it fast
    enough on the CPU anymore.<p>So, nice idea, but the polygons become hard to work
    with then.
