  text: This is interesting. For a long time it was pointed out that ZIP codes, unlike
    say, city or state boundaries, were not properly representable as polygons, since
    they don&#x27;t divide up acreage into zones, but rather label postal delivery
    routes. Suppose I build a new neighborhood way out in the middle of nowhere. The
    &quot;polygon&quot; concept suggests that we could look and see what polygon I&#x27;m
    in, and that will determine what post office delivers my mail. But in reality,
    if there was no route to that area already, they could decide to make it part
    of any one of the surrounding routes.<p>I suppose though, as long as you let the
    polygons map has uncontained areas, where no routes currently exist, it&#x27;s
    a doable task to draw polygons around the limits of every route network, as long
    as you don&#x27;t mind that they may have lots of weird ragged edges.
