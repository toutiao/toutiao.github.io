  author: themgt
  text: 'Reminds me of one of my favorite little rabbit holes, trying to find this
    data for Canada:<p><i>Canada is one of the only major countries where the postal&#x2F;zip
    code boundary data is not available as an open data set. Canada Post has a monopoly
    on that dataset. As a Canadian GIS person it drives me nuts as many other Candian
    government GIS programs have been active in the open data&#x2F;open-source world
    for decades. Even crazier is that Statistics Canada has an open database of all
    addresses in the country here <a href="https:&#x2F;&#x2F;www.statcan.gc.ca&#x2F;en&#x2F;lode&#x2F;databases&#x2F;oda"
    rel="nofollow">https:&#x2F;&#x2F;www.statcan.gc.ca&#x2F;en&#x2F;lode&#x2F;databases&#x2F;oda</a>
    that has a postal code column, but it&#x27;s empty for all addresses.</i><p><i>Anyone
    who has tried to create their own dataset of polygons has usually ended up being
    chased down by Canada post. There is a company called Geocoder.ca who made a geocoder
    and when you passed in a street address with a postal code in it, it would keep
    track of that, and geocode based on the street address. Over time they built up
    a database of coordinates and postal codes and were able to generate their own
    approximate boundaries that where pretty accurate. Canada Post went after them:
    <a href="https:&#x2F;&#x2F;geocoder.ca&#x2F;?sued=1" rel="nofollow">https:&#x2F;&#x2F;geocoder.ca&#x2F;?sued=1</a>
    Their data is still free for non-profits, and relatively cheap for commercial
    purposes: <a href="https:&#x2F;&#x2F;geocoder.ca&#x2F;?freedata=1" rel="nofollow">https:&#x2F;&#x2F;geocoder.ca&#x2F;?freedata=1</a>
    The only other open data related postal codes you will find easily available is
    Forward Sortation Code boundaries (FSA) which is the area that represents the
    first three characters of a Canadian Postal code. For example, postal code &quot;N0R
    1K0&quot; would have an FSA of &quot;N0R&quot;. For demo&#x27;s and some analysis
    scenarios that can often be enough.</i><p><a href="https:&#x2F;&#x2F;learn.microsoft.com&#x2F;en-us&#x2F;answers&#x2F;questions&#x2F;1655227&#x2F;plot-postal-codes-on-a-map"
    rel="nofollow">https:&#x2F;&#x2F;learn.microsoft.com&#x2F;en-us&#x2F;answers&#x2F;questions&#x2F;1655227&#x2F;...</a>'
  score: 0
