  author: mannyv
  text: This is historical.<p>The Federal Government really doesn&#x27;t deal with
    addresses, roads, etc. That&#x27;s the job of the states, counties, towns, etc.
    The USPS, though, needs to know all of that so mail can be delivered.<p>Via multiple
    different processes (depending on the entity in charge) the USPS and the entity
    (state&#x2F;county&#x2F;city&#x2F;town&#x2F;village&#x2F;developer&#x2F;whatever)
    that comes up with road names&#x2F;parcels&#x2F;lots determine the addresses.
    These addresses get sent to the USPS.<p>It sounds like the process depends on
