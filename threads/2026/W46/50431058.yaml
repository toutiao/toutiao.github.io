  author: legitster
  text: Some important context - Zip codes were not established as geographic markets.
    A &quot;Zip Code&quot; is collection of routes USPS uses - so it&#x27;s whole
    goal was to get the right package on the right truck.<p>The &quot;Zip+4&quot;
    was the attempt to solve this- the 9 digit code narrows down the zipcode to a
    single block. But no one in the US cares enough to use these. It also doesn&#x27;t
    solve the canonical problems the industry has with mapping data - people want
    to be able to put a pin in a random place on the map and pull up a clean zip code
    for data processing reasons.
