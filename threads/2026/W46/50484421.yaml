  author: jmyeet
  text: 'There are two big levers the government has to control inflation: monetary
    policy and fiscal policy.<p>Monetary policy is where the central bank changes
    rates. This is effective to a point. It defuses a lot of zero-interest nonsense
    but the primary idea was to cool the business sector by making borrowing more
    expensive. Thing is, we don&#x27;t really do that anymore. We don&#x27;t borrow
    a bunch of money to build a factory to make widgets. No, we simply financialize
    everything. Yes, we have a ton of AI debt now but (IMHO) it&#x27;s not productive
    output. The big product and promise of AI is <i>labor displacement</i>. That&#x27;s
    going to destroy the economy.<p>Private equity technically borrows money but usually
    only temporarily. The target gets bought, restructured, a loan is taken out against
    the assets to pay back to investors and the corpse is spun out before the debt
    explodes. The problem? The market seems to be wising up to this bargain and these
    husks need to be kept on the books longer than desired. PE firms are having to
    borrow to refinance. That&#x27;s another house of cards in all of this.<p>But
    what really fuels PE and all of this? Real estate. Hoarding land has become the
    best performing asset.<p>So the second lever the government has is fiscal policy,
    specifically taxation. Prior to the pandemic, a lot of companies were afraid to
    raising prices too much as they&#x27;d lose market share. An energy crisis triggered
    a fundamental change in corporate attitudes to raising prices and we&#x27;ve had
    a ton of raising prices simply to maintain profits or in anticipation of inflation.
    Pepsi now is in deep trouble because they&#x27;ve discovered that people don&#x27;t
    want to pay $8 for corn chips and Walmart&#x27;s generic brand is $5 and probably
    made by the same factory.<p>In the wake of the pandemic some countries introduced
    a windfall profits tax. Basically, predatory price-raising should be punished
    with at least a form of wealth redistribution. These measures were few and far
    between however.<p>As an example, because of 2020 energy crisis (caused by Trump)
    and Russia&#x27;s invasion of Ukraine, Europe has been in a deep energy crisis
    for years with no end in sight. Many European governments have tried to protect
    consumers by subsidizing electricity. Well, these energy providers are making
    record profits. Why aren&#x27;t they taxing the back end to pay for those subsidies?
    Instead, we just have a massive wealth transfer from European governments to (often
    private) utilities and gas producers.<p>But fiscal policy, particularly in the
    US, <i>never</i> gets discussed int his way. We could solve so many problems by
    simply having a 50% corporate tax rate. The standard objection is &quot;they&#x27;ll
    move overseas&quot;. Well, you can&#x27;t move land overseas, particularly mines
    and oil wells. And the IRS is capable of tackling transfer pricing and profit
    shifting. Well, they would be if they weren&#x27;t deliberately starved by successive
    governments. And if all else fails, punish companies for moving overseas with
    tariffs. That&#x27;s what they&#x27;re actually for.<p>So, back to your question,
    no, I don&#x27;t think the theory is sound because we have a malignant tumor at
    the heart of our economy, which is land-hoarding.'
