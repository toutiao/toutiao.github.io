  author: jmyeet
  text: 'Nope. I&#x27;m talking about the Trump 2020 OPEC deal [1][2].<p>Without recounting
    the entire saga, OPEC tries to maintain a floor and a ceiling for oil prices.
    Too low and they don&#x27;t make enough money. Too high and it causes political
    problems. They meet every 3 months to project demand and they adjust supply accordingly.
    Some members cheat and lie about their output but the system <i>generally</i>
    works. One thing that keeps the Gulf powers in line is military support, particularly
    Saudi Arabia.<p>When the pandemic hit in March 2020, demand cratered. Futures
    prices briefly went negative because producers had nowhere to store oil and nobody
    was buying. This is where Trump cajoled MBS into cutting supply in a 2 year deal.
    This superseded the normal 3 month review and adjustment process so it wasn&#x27;t
    even necessary. This deal was huge too. It would initially cut global supply by
    10%.<p>So then in 2021 demand roared back and prices exploded. The Biden admin
    obviously came in in January 2021. They quietly went to MBS to get him to rescind
    the deal. MBS refused.<p>Republicans blamed Biden even though it was a Trump deal.
    Democrats blamed oil companies for being greedy because they, just like the Republicans,
    didn&#x27;t want to upset Saudi Arabia even though Biden could&#x27;ve absolutely
    threatened Saudi Arabia with the weapons the US provides.<p>As to why MBS refused,
    it&#x27;s complicated and there&#x27;s a lot of history but a big part of it is
    that Trump screwed over OPEC in 2018 and (in OPEC&#x27;s view) the Obama admin
    screwed them over in 2015 by removing the ban on crude oil exports.<p>What gets
    me though is <i>nobody talks about the Trump 2020 OPEC deal</i>.<p>[1]: <a href="https:&#x2F;&#x2F;www.reuters.com&#x2F;article&#x2F;economy&#x2F;special-report-trump-told-saudi-cut-oil-supply-or-lose-us-military-support--idUSKBN22C1V3&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.reuters.com&#x2F;article&#x2F;economy&#x2F;special-report-trump...</a><p>[2]:
    <a href="https:&#x2F;&#x2F;www.reuters.com&#x2F;article&#x2F;business&#x2F;opec-agrees-largest-ever-oil-output-cut-of-97-million-bpd-sources-idUSKCN21U0QN&#x2F;"
