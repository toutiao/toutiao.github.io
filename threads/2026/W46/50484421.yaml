  author: jmyeet
  text: 'What I believe you&#x27;re referring to is NIMBYism. The belief seems to
    be that we can build our way out of this problem, often called YIMBYism. I believe
    YIMBYism is generally well-intentioned but fundamentally flawed.<p>YIMBYism is
    often used an excuse for rampant deregulation. I believe that private developers
    won&#x27;t ever build our way out of this problem because that hurts profit. It
    takes the government as a major player to solve this problem. People will point
    to examples like Austin having declining rents as a direct result of supply but
    that doesn&#x27;t really invalidate my criticism.<p>UK supermarkets used to engage
    in a practice called land banking [1]. Basically they would buy up land and do
    nothing with it. They were buying it to prevent competition. And if land kept
    going up in value there was no cost in doing it. Ultimately Aldi and Lidl came
    along and ate their lunch by building in less desirable but cheaper areas. But
    another consequence was that it restricted the supply of housing.<p>What YIMBY
    policy would prevent land banking (hoarding)? You need something and it&#x27;s
    not even more deregulation. The cost of just holding land needs to be higher.
    You need some form of land value tax [2].<p>More than a decade ago, I remember
    hearing about &quot;investors&quot; buying up all the trailer parks and jacking
    up the rents (eg [3]). This is entirely parasitic behavior. Any form of ground
    rent on permanent structures like this should be somewhere between illegal and
    uneconomical. The land of the trailer parks should be co-owned by the residents,
    period.<p>This has a huge negative social cost too. Trailer parks are often the
    housing of last resort for many. Make it unaffordable and people end up living
    in cars and them ultimately the streets. So what have we achieved here other than
    padding the profit margins of investors? We&#x27;ve shifted that cost onto the
    government, which is just another wealth transfer from tax coffers to the wealthy.<p>Ten
    years ago, Xi Jinping quietly popped China&#x27;s real estate bubble, which has
    been in decline ever since. He famous said [4] &quot;Houses are for living, not
    for speculation&quot;. It&#x27;s funny reading Western reporting on this because
    China&#x27;s real estate recession is viewed as a negative when it&#x27;s just
    a correction from intentional state policy.<p>That required government intervention
    in the housing market. This would never have happened with any set of incentives
    of private developers.<p>[1]: <a href="https:&#x2F;&#x2F;www.theguardian.com&#x2F;business&#x2F;2014&#x2F;jun&#x2F;26&#x2F;tesco-hoarding-land-that-could-build-15000-homes-supermarket"
    rel="nofollow">https:&#x2F;&#x2F;www.theguardian.com&#x2F;business&#x2F;2014&#x2F;jun&#x2F;26&#x2F;tesco-hoard...</a><p>[2]:
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Land_value_tax" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Land_value_tax</a><p>[3]:
    <a href="https:&#x2F;&#x2F;publicintegrity.org&#x2F;inequality-poverty-opportunity&#x2F;warren-buffetts-mobile-home-empire-preys-on-the-poor&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;publicintegrity.org&#x2F;inequality-poverty-opportunity&#x2F;w...</a><p>[4]:
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Houses_are_for_living,_not_for_speculation"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Houses_are_for_living,_not_for...</a>'
  score: 0
