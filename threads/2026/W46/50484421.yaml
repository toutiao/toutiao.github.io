  text: '&gt; <i>any efforts to reduce energy inflation with interest rates is going
    to be futile</i><p>Raising rates makes credit more expensive. That cools down
    growth. That, in turn, eases resource demand (as a function of the resource intensity
    of GDP).<p>Practically speaking, higher rates today would mean less borrowing
    to build datacenters. (And new homes, <i>et cetera</i>.) Which would mean those
    marginal resources going to other uses. Which would ease price pressure.<p>&gt;
    <i>there will be, for long into the future, more projects chasing a shrinking
    supply of capital</i><p>Capital is priced in rates. Too many projects chasing
    too little capital will drive rates up until the capital markets balance. The
    case where that doesn&#x27;t happen is when rates are being held low.<p>And current
    spreads indicate a <i>surplus</i> of capital [1]. That&#x27;s why we&#x27;re seeing
    <i>e.g.</i> multi-trillion dollar IPOs.<p>&gt; <i>the Fed could beat on the economy
    all it wants with higher rates and this would not cause mass unemployment, because
    the world is rapidly aging and how fast workers are retiring out of the labor
    force</i><p>I like this thesis–it means the Fed has a lot more room to raise rates
