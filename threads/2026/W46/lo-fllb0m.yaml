  text: |-
    I was working on something related as a hobby project. My thinking was exactly this:

    People enjoy the cloud as a "place" where their data lives safely, over the relative pain of managing files and folders locally on-disk, making backups, etc. The average user isn't even that good at finding a file they themselves saved.
    Data should be portable by default, not vendor locked-in. You should be able to inspect the entirety of it, and edit as needed. This realizes the GDPR automatically (can request, correct, delete).
    Web apps generally store and access two kinds of data: records (strong consistency, maybe relational?) and blobs (images etc.). They are different by nature, and this duo covers 90% of all use cases.
    Database access should be mediated by an RDBMS for consistency, instead of "upload an SQLite file to overwrite your previous work".

    What I got working was a "personal data server" (a bit like Solid Project's), but the API was generally just SQL, instead of a semantic Web layer. This seemed most practical. Under the hood, it was a Go server that spawned HTTP adapters to hold open an SQLite database on behalf of the user's app. It would close the DB when not needed to conserve resources, and was built as multi-tenant from the ground up, so each user/app pair would get their requests routed to their respective "shard".
    It never really got anywhere, because by the time I got the implementation underway, two things dawned on me:

    Transactions over HTTP suck and a sane API around them is going to be very hard.
    This execution model does not support collaboration very well, and any sharing scenario would necessarily feel bolted-on.

    I haven't really dabbled in this for some months, but it is an area I'm likely to revisit some day.
