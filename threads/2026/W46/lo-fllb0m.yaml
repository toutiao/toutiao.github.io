    I built a proof-of-concept social network where data was stored locally on IndexedDB, but it was also kept in encrypted form by any friends you had on the network. If you lost your laptop you were able to login with the public key (the sign up page generated a PDF and would tell the user to confirm having printed it), and retrieve your data from your friends whenever they were back online (using WebRTC).
    I think this approach solves the problem where people don't want to host their own data because they could lose it -- or is at least a good compromise, since all the user needs to save is the public key.
