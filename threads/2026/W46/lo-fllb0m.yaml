    I've been banging my head against this problem for the past year as well, trying to make my app store and sync data through whatever file syncing service the user (probably) already uses (Dropbox, Google Drive, iCloud, etc).
    Alas, I didn't really manage to make it work. One challenge is that file syncing is quite unpredictable (when files sync, in which order they sync, etc), and another is that it's not easily accessible on mobile, which is why I want syncing between devices in the first place.
    The approach I now landed on is syncing through any S3-compatible service, which is not really accessible to "normal" end users (not my target audience anyway), but at least it's more or less a standard with lots of implementations, and other than creating a bucket the user then doesn't have to host anything.
