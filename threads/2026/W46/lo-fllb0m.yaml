    An API to run SQL queries isn't compatible with people hosting their own data. If people host their own data any time soon it's going to be in simple JSON blobs with extremely basic formats that are shared across consumers of this new type of thing.
    It's a bit like SQL/NoSQL. If you want the speed advantage of NoSQL, you lose the power of being able to run arbitrary SQL queries. If you want complete arbitrary localisation and distribution of data, you're not going to be able to query it, search or index in it in any way that's recognisable to web apps today.
