  author: cadamsdotcom
  text: It can do basic arithmetic because it&#x27;s fed millions or billions of synthetic
    calculations as training data.<p>Quick!<p>What&#x27;s the next top-k tokens after
    each of these?<p>&quot;999 + 999 = &quot;<p>&quot;999.0 + 999.0 = &quot;<p>&quot;999
    * 2 = &quot;<p>&quot;999 * (3-2) = &quot;<p>Mathematically identical. But as a
    token sequence, not so much.<p>Modern models will of course have very similar
    next-token distributions across all of these. But not identical!<p>Now add a few
    digits and you quickly land in territory whose synthetic training data is much
    sparser.<p>Code has determinism and runs in milliseconds. It&#x27;s the better
    tool for the job.
