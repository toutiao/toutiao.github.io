  text: Reading these types of of stories growing up was always humbling.<p>I started
    at Microsoft on the Windows Mobile compiler team, having never taken a compiler
    class in college. I was surrounded by people who had already done great things,
    and by the time my career started the glory days of doing real software engineering
    was already waning.<p>I got to work with a few of the greats during my time as
    Microsoft, and I wish I&#x27;d taken up an in offer I had to meet Raymond Chen.<p>Sitting
    next to people of old school caliber and watching them work is, to use the proper
    word yet again, humbling as hell.<p>Fuck your design patterns. These people can
    debug starting at assembly, and sometimes when that fails they&#x27;ll debug by
    pulling out an oscilloscope. Then when that is done they&#x27;ll build design
    patterns on top of the foundations they laid themselves.
