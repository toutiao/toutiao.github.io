  text: My recommendation is to have ChatGPT write code to solve calculations like
    this, and have it put the data it fetches as constants in said code.<p>AI is not
    a calculator, but it&#x27;ll try to fake it - and above say, three or four digits,
    there&#x27;s not enough training data to guarantee accuracy enough of the time.
    Labs probably train models on massive amounts of arithmetic, but still. It&#x27;s
    not the right tool for the job.<p>Now, ChatGPT won&#x27;t solve problems with
    code unless asked, but if you ask, it has its own full computer and can write
    code for it!<p>AI is powerful because it can use tools and can build tools for
    you to use or for it to use.<p>But it is not a calculator.
