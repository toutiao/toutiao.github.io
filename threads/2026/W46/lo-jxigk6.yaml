    My house has a domestic example of the kind of industrial remote access that this article is talking about: our electrical systems include a solar+battery system, a smart meter, and a car. They all talk to our electricity provider to coordinate when to charge the car or top up the house batteries, depending on the current price of electricity. They use our domestic wifi to talk to their online support services.
    The point of the article is that the devices need to be online so that they can react to externally-provided data, or so that they can report their status to a central monitoring system. And in many cases there must also be remote control as well: consider for example flood control pumps which (in places like the Cambridgeshire fens) need a wide-area overview to operate safely.
    Now, while there are excusable reasons for things to be designed this way, they are clearly not good reasons in many cases and they are often not designed well. Obviously there isn’t enough attention paid to security architecture or hierarchies of privilege or whether it makes sense for a device to act as a remote command server (dangerous, ubiquitous) instead of as a reactive client (safer, rarer). And the designers of these things are optimizing for convenience and cost and minimal staffing, at the expense of safety and resilience.
    Over-optimization and brittle systems are a problem caused by caring more about the price of things rather than the value they provide or the cost of failure.
