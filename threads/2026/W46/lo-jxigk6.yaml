    I disagree with the conclusion : "These connections were built one sensible business decision at a time, and they now help keep the lights on, the water running, and the food cold."
    In a newly built house, I had to fight every single vendor, every single subcontractor that wanted to connect each appliance (up to the toilet lid). I counted that, without fighting, I would have 18 apps installed on my phone only to "handle my house".
    Each time, I asked the question: "Why should it be connected?". Each time I had vague answer like "It’s better, you can use the app".  When pressed, they all ultimately fall down to "If you are not connected, you will not receive update".
    So I said: "why should receive update ?  If it is currently functional, I don’t want it to change."
    "but for security".
    So, ultimately, most sellers (which are totally uneducated at anything IT related) believe that "you must connect everything to receive update to avoid problems you would not have without being connected".
    This post try to rationalize a situation which is mainly built on total incompetence at every level. People connect stuff because they believe everything has to be connected. And every appliance offer "Wifi connection" because some marketing people thought that it was cool (now, they add AI inside your toilet lid).  So it more or less completely stupid.
    Think about fridges: it makes sense to get remote sensing. But it doesn’t make any sense to remote control a fridge. If a fridge is not at the right temperature, the first thing you want is a human walking in and checking the fridge.  You never want a remote "disconnect the fridge" button that could be remotely activated, sometimes without ever realizing it  (bad button pressed in the web interface)|
    So I strongly disagree with the post: systems should, by default be offline. Getting online should be a conscious choice with a clear responsibility. Getting online should, by default, be a read-only state where you could get information but not act on system. Acting remotely on any physical system should never be considered lightly.
