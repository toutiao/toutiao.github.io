  author: neathack
  text: "From the blog post:<p><pre><code>  Using datasets from the open web archive
    Common Crawl,\n  we identified and analyzed 159,041 Lovable projects from\n  December
    2025 to September 2026. Of these, 34,545 used\n  Supabase.\n  \n  24,664 websites
    sent database records from Supabase as\n  soon as they loaded, without requiring
    a login or any\n  other interaction. That alone is not a security issue:\n  the
    data may be intended for public display. But by\n  making additional read-only
    requests, we were able to\n  retrieve more database content. We found records\n
    \ containing email addresses in 10,560 tables across 7,403\n  of the 24,664 websites
    (30%).\n</code></pre>\nWhat isn’t mentioned in the analysis is that we ran a System
    1 decision model on each dataset to determine whether it contained privacy-sensitive
    data. Using a confidence threshold of 85%, we found that nearly 4,000 websites
    leaked such information.<p>Edit: That&#x27;s 15,9% of all Lovable websites that
    use Supabase."
  score: 0
