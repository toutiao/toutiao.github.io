  author: hn_throwaway_99
  text: Folks are blaming AI, and that&#x27;s certainly part of it (folks without
    knowledge and experience can now build polished apps, though there were still
    plenty of &quot;WTF&quot; security breaches before AI), but I feel like the only
    thing that can fix this are real, stiff liability consequences.<p>The defects
    listed in this report didn&#x27;t require some complicated 0-day exploit chain
    - they were just sensitive data stored without any authentication at all, in a
    database that anyone with Internet access can view. In other words, it would be
    the  equivalent of a company like Public Storage leaving all of its storage units
    with no locks on them at all.<p>Affected users should be able to sue for a lot
    in these basic security failures. And obviously for many of these small websites,
    the potential damages would quickly bankrupt the site owners, but that&#x27;s
    the point. People would think a lot more carefully about how they protect sensitive
    data if there were real negative consequences for their failures.
