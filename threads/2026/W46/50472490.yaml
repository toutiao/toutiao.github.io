  author: antonvs
  text: Hydrostatic equilibrium is the most defensible of the requirements to be a
    planet.<p>The IAU wording is, &quot;...has sufficient mass for its self-gravity
    to overcome rigid body forces so that it assumes a hydrostatic equilibrium (nearly
    round) shape.&quot;<p>In this case it just means that the planet&#x27;s mass and
    therefore gravity is sufficient to give it a spheroidal shape. (Technically the
    equilibrium is with the opposing push from the planet&#x27;s material, which resists
    gravity&#x27;s attempts to compress it. The result is a sphere, made spheroidal
    in real planets by rotation.)<p>Less massive objects like asteroids can have weird
    shapes, like the asteroid Toutatis which has a sort of dumbbell &#x2F; unshelled
    peanut shape. The hydrostatic equibrium requirement prevents such objects from
    being classified as planets, as well as small objects that just happen to be round
    for other reasons.<p>This isn&#x27;t really social history but simply classifying
    the objects according to intrinsic properties, which seems fine to me. This classification
    could be applied to objects anywhere in the universe without any problem.<p>The
    other two requirements are more problematic and arbitrary. One is that it has
    &quot;cleared its orbit&quot;. Earth, let alone Mercury, would be unlikely to
    qualify for this if it were at the same distance as Pluto, for example. Rogue
    planets also can&#x27;t satisfy this one, and we&#x27;ve observed those.<p>The
    other is that it has to be in direct orbit around the Sun, not a satellite of
    some other object. This excludes exoplanets as well as rogue planets. The rationale
