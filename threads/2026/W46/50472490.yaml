  text: "&gt; but that is literally how scientific fields always approach arbitrary
    classifications<p>No, not always. What you are describing there are shoddy classifications.
    I already addressed this exact point in my previous reply when I stated that classifications
    are crafted to serve a useful purpose. It is sometimes useful to hew close to
    the historical norm; other times it serves no purpose.<p>&gt; But remember, it
    must not take into account what we today consider &quot;planets&quot; to be.<p>An
    arbitrary restriction that I do not accept.<p>&gt; please give me an example of
    what kind of definition for &quot;planet&quot; you&#x27;d be happy with<p>I already
    did this in my original comment. I proposed an earth centric system that bins
    mass by powers of ten. My proposed range for planets was 10^23 &lt;= x &lt; 10^26.
    Hydrostatic equilibrium works well as a constraint to eliminate things that are
    clearly not earth like (such as black holes) but alternative formulations such
    as stipulating an acceptable density range are possible (such cross cutting subcategories
    might even be preferable).<p>Note that this would result in ganymede being classified
    as both a planet and a moon. I think that makes perfect sense given how similar
    in size it is to mars. In fact ganymede being excluded as a planet is precisely
    the sort of gerrymandering I object to.<p>As it turns out my proposed criteria
    also relegates pluto to the status of dwarf planet. I think that&#x27;s sensible
    given that it&#x27;s both smaller and lighter than the moon. However I&#x27;d
    be willing to entertain a set of criteria that acknowledged both pluto and the
    moon as proper planets - the important thing to me is consistency."
