    ED138 joins the rapidly growing sample of solar system objects discovered by Rubin
    since it began collecting early data in preparation for the Legacy Survey of Space
    and Time (LSST), which began in June 2026. In April, before LSST formally began,
    the Rubin solar system team announced observations of over 11,000 new asteroids,
