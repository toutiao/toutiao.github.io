  author: skissane
  text: "&gt; Classifications are useful.<p>I wasn&#x27;t arguing against classification,
    just that I remain unconvinced that the classification which IAU adopted is superior
    to the alternatives.<p>One problem with the IAU definition: it only works for
    our planetary system, not for exoplanets – with the end result that we have two
    different definitions of &quot;planet&quot;, one for our system, one for everywhere
    else.<p>Now, of course, that in part reflects that we have vastly more information
    about our own system than any other – but, a few centuries or millennia from now,
    I expect we&#x27;ll know a lot more about some of those other systems – we will
    probably have sent probes to explore the nearer ones by then – at which point
    people (or AIs?) will probably push to unify the two definitions. My own bet is
    they&#x27;ll be more likely to unify them by dropping &quot;clear the neighbourhood&quot;
    from the our-system definition than extending it to apply to other systems. Splitting
    the common category of &quot;planet&quot; into two subcategories based on &quot;does
    it clear its neighbourhood&quot; works much better than insisting on two disjoint
    categories based on that criterion when you have very limited information on where
    that criterion is met."
