  author: cookingmyserver
  text: Classifications are useful! It is poor form to take a widely used and historic
    term and add on a whole different (dynamic!!) category of attribute as a filter
    on the definition. There is quite a bit of absurdity in the 2006 IAU&#x27;s definition
    of a planet. If a massive object came into the solar system and perturbed orbits,
    caused chaos and collisions, then any &quot;planet&quot; with debris within its
    neighborhood would cease to be a planet. What do we gain from adding a whole different
    category of attribute (relationship to its neighborhood) as a criterion? Does
    it realistically outweigh decades or centuries of peoples intuition of the existing
    definition? Its not just a matter of science, but language and communication.
    If you want greater specificity, come up with a new term or use compounded terms.<p>It
    very much seems like the definition was just shoe-horned to stem any more planets
    needing to be added. It would be interesting to know if astronomers walk the walk
