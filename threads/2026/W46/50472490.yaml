  text: |-
    &gt; that is literally how scientific fields always approach arbitrary classifications.<p>That&#x27;s a big overstatement. It&#x27;s how some soft science fields sometimes do it. You can&#x27;t get away with that in, say, physics and still end up with useful theories, because your theories quickly break down due to inconsistencies. You can&#x27;t design working scientific theories by committee, because votes don&#x27;t affect fundamental physical reality.<p>Much of astronomy is a hard science, which is why this definition came in for pushback even from astronomers themselves. Here&#x27;s astronomer Phil Plait&#x27;s take:<p>&gt; &quot;For some time now I, and many others, have stated that the IAU definition is silly for many reasons, including a line that says that planets can only orbit the Sun. If that’s true, then exoplanets — worlds orbiting other stars — aren’t really planets!&quot;
    -- <a href="https:&#x2F;&#x2F;www.syfy.com&#x2F;syfy-wire&#x2F;mea-culpa-are-exoplanets-planets" rel="nofollow">https:&#x2F;&#x2F;www.syfy.com&#x2F;syfy-wire&#x2F;mea-culpa-are-exoplanets-plan...</a><p>The article goes on to clarify that the IAU explicitly limited its definition to solar system planets - in fact, the resolution is titled &quot;&quot;Definition of a Planet in the Solar System.&quot;<p>As such, it&#x27;s not even a universal scientific definition for &quot;planet&quot;.<p>Another quote:<p>&gt; &quot;At [the IAU] 2006 international meeting in Prague, they drafted a series of defining characteristics for planets and put it to a vote. The definition passed, and the outcome was entirely predictable: They made things a lot worse.&quot;<p>&gt; &quot;...the more proximate problem is that these definitions are, um, silly.&quot;<p>-- <a href="https:&#x2F;&#x2F;www.syfy.com&#x2F;syfy-wire&#x2F;redefining-planets-answer-search-question" rel="nofollow">https:&#x2F;&#x2F;www.syfy.com&#x2F;syfy-wire&#x2F;redefining-planets-answer-sea...</a>
