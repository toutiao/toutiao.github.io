  author: Timon3
  text: "&gt; My point is that you can&#x27;t get away with arbitrary classifications
    in the context of hard science theories.<p>Arbitrary classifications don&#x27;t
    factor into hard scientific theories, so I have no idea how this is relevant.
    Or what &quot;hard science theory&quot; are you thinking of that relies on whether
    we classify an object as a planet?<p>We can modify arbitrary classifications without
    any theories being affected, because the theories don&#x27;t rely on arbitrary
    classifications. We arbitrarily decided what &quot;one meter&quot; is, yet we
    use &quot;meters&quot; all over physics. We could change the definition of &quot;one
    meter&quot; tomorrow, and all our theories would stay valid, because <i>they don&#x27;t
    rely on arbitrary classifications</i>.<p>&gt; There&#x27;s an example of a definition
    of &quot;planet&quot; in one of those Plait articles I linked:<p>&gt;&gt; &quot;A
    planet is a sub-stellar mass body that has never undergone nuclear fusion and
    that has sufficient self-gravitation to assume a spheroidal shape adequately described
    by a triaxial ellipsoid regardless of its orbital parameters.&quot;<p>How does
    one arrive at this definition, without taking into account what we today consider
    &quot;planets&quot; to be? What principle of physics tells you that a planet must
    be sub-stellar mass, or that it has never undergone nuclear fusion?<p>You&#x27;ll
    have to actually explain how this definition is any less arbitrary, but I don&#x27;t
