  author: delta_p_delta_x
  text: 'I find this interview very interesting, because around a decade prior, Stern
    himself proposed &#x27;clear the neighbourhood&#x27;[1] as a finer-grained rule
    for planet classification involving the dynamics of the planetary body in question.
    That is, planets that could clear their neighbourhoods are überplanets; otherwise
    unterplanets. In fact, near the end of that paper he proposes not two, but <i>five</i>
    classifications of planets: subdwarf, dwarf, subgiant, giant, and supergiant.<p>Now,
    Stern&#x27;s broader argument in that interview is that we should not take into
    account the dynamical behaviour of planets. I disagree, especially since dynamics
    determine the static future state of any given object. Take chthonian planets—former
    gas giants whose gaseous envelopes have been stripped away by the primary. Do
    we insist that they are still gas giants? No, we even came up with a name for
    the <i>transitory</i> period when these planets are losing their gas envelopes.<p>Personally,
    I think Stern was being a little more animated to drum up support for and shine
    a beacon on <i>New Horizons</i>, a then-ongoing mission that he was principal
    investigator of.<p>To directly answer your question:<p>&gt; If a massive object
    came into the solar system and perturbed orbits, caused chaos and collisions,
    then any &quot;planet&quot; with debris within its neighborhood would cease to
    be a planet.<p>There actually are (multiple) mathematical formulations for &#x27;clearing
    the neighbourhood&#x27;[2]; it&#x27;s not purely empirical or based on vibes.
    Stern proposed one in the above-mentioned paper. Jean-Luc Margot suggests several
    more[3]. I suspect a more universal model will be probabilistic but grounded in
    celestial mechanics.<p>&gt; Does it realistically outweigh decades or centuries
    of peoples intuition of the existing definition?<p>People&#x27;s intuition for
    &#x27;planet&#x27; in the centuries before telescopes were invented was &#x27;something
    that moves against the fixed background of stars&#x27;—that is literally the Greek
    etymon for the English &#x27;planet&#x27;. The Sun and Moon used to be a part
    of the &#x27;classical planets&#x27;. We didn&#x27;t even find the last two (or
    three) planets in our own Solar System until around two centuries ago. We didn&#x27;t
    know about nuclear fusion until 1925, and we didn&#x27;t know other galaxies existed
    until similarly recently. We didn&#x27;t understand the inflationary model of
    the universe until the 1960s. The first exoplanet was discovered only in 1992.<p>We
    have repeatedly and retroactively renamed, retconned, reworked, revamped and rewound
    scientific definitions and models over and over again. I think planets will be
    OK.<p>[1]: <a href="https:&#x2F;&#x2F;doi.org&#x2F;10.1017&#x2F;S1539299600013289"
    rel="nofollow">https:&#x2F;&#x2F;doi.org&#x2F;10.1017&#x2F;S1539299600013289</a><p>[2]:
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Clearing_the_neighbourhood"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Clearing_the_neighbourhood</a><p>[3]:
    <a href="https:&#x2F;&#x2F;doi.org&#x2F;10.1088&#x2F;0004-6256&#x2F;150&#x2F;6&#x2F;185"
    rel="nofollow">https:&#x2F;&#x2F;doi.org&#x2F;10.1088&#x2F;0004-6256&#x2F;150&#x2F;6&#x2F;185</a>'
  score: 0
