  author: delta_p_delta_x
  text: "A planet is an object that:<p><pre><code>  a) orbits a star, and is not a
    star nor a brown dwarf itself;\n     i) a star is an object that is massive enough
    and hot enough to conduct protium fusion in its core\n    ii) a brown dwarf is
    an object that is massive enough to conduct deuterium fusion, but insufficiently
    massive (and hence insufficiently hot) for protium fusion  \n  b) has attained
    hydrostatic equilibrium, that is, it is spheroidal;\n  c) it has cleared its local
    neighbourhood of &#x27;rival planets&#x27; since its birth;\n</code></pre>\nErgo,
    Jupiter is a planet. It is a certain <i>type</i> of planet—a gas giant—but a planet
    nonetheless.<p>There <i>is</i> some controversy about when giant planets stop
    being giant planets and start being brown dwarfs—typically around 30 Jupiter masses—but
    this is an active area of research, to understand the fusion ignition in these
    objects. As I mentioned in another comment, classifications are useful. Of <i>course</i>
    they are arbitrary and they are biased—they were decided by <i>humans</i>. But
    the entire point of science is to push the edges of our understanding and reduce
    these biases and make our models more general and less arbitrary."
