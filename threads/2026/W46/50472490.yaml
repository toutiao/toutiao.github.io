  fetch_status: success
  content: "_The new dwarf planet candidate, called 2026 ED138, orbits on a plane
    tiled nearly 25 degrees compared to our solar system's main planets, suggesting
    it was disturbed by gravitational interactions with Neptune.\n              NSF–DOE
    Vera C. Rubin Observatory/NOIRLab/SLAC/AURA/R. Proctor Image Processing: M. Zamani
    (NSF NOIRLab) Orbit data provided by the IAU Minor Planet Center (MPCorb catalog),
    funded by NASA PDCO and the Tamkin Foundation. Gaia DR2: ESA/Gaia/DPAC_\n\n[Matthew
    Holman](https://astronomy.fas.harvard.edu/people/matthew-holman), a senior astrophysicist
    at the Smithsonian Astrophysical Observatory, was sifting through data from the
    [Vera C. Rubin Observatory](https://rubinobservatory.org/) in Chile when something
    odd caught his eye. Running a custom-made computer program, he and his colleague
    [Kevin Napier](https://midas.umich.edu/directory/kevin-napier/) had already spotted
    more than 2,000 little bright dots in the telescope data, corresponding to newly
    discovered small objects in the distant solar system. But this one was different:
    It seemed to be big.\n\nHolman managed his expectations. After all, astronomers
    in the business of finding distant objects are used to disappointment. “We all
    have ‘found Mars’ … in terms of a false positive,” Holman tells _Smithsonian_
    magazine. They find a bright object that seems really big, then, with a closer
    look, learn that it’s nothing very remarkable after all. “We’re all really cautious
    when you see something that looks like it’s large.”\n\nStill, this object grabbed
    Holman’s attention, so he tried to verify it with Napier and Rubin solar system
    lead scientist [Mario Jurić](https://astro.washington.edu/people/mario-juric).
    They found the celestial body in previous photos of the sky throughout the past
    decade, which helped them zero in on its orbital path—and the more historical
    data they found, the more confident they became.\n\n“We know that it’s real,”
    Holman says. “Every time you look at the predicted location, there it is.” They
    even found it in photographic plates from 1937, stored in the [Harvard plate stacks](https://platestacks.cfa.harvard.edu/),
    he says.\n\nThe object, called [2026 ED138](https://www.minorplanetcenter.net/mpec/K26/K26U85.html),
    is 46 times farther from the sun than Earth is, and it takes 281.1 years to complete
    an orbit. Now, the central question is whether it’s big enough to be classified
    as a new dwarf planet, which would put it among the rare ranks of only five other
    objects in our solar system.\n\n“This is incredibly exciting,” [Paul Byrne](https://eeps.washu.edu/people/paul-byrne),
    a planetary scientist at the Washington University in St. Louis who was not involved
    in the discovery, tells _[National Geographic](https://www.nationalgeographic.com/science/article/new-dwarf-planet-rubin-pluto)_’s
    Robin George Andrews. “It heralds a new era of solar system and planetary science.”\n\n2026
    ED138 3D orbit\n\n[Watch on ![YouTube Logo](/static/smithsonianmag/img/youtube-white-logo.8f2627848a7a.png)](https://www.youtube.com/watch?v=GScw6xLHPp4)\n\n
    ![2026 ED138 3D orbit](https://th-thumbnailer.cdn-si-edu.com/TDC2pHyKOarNUWKTd_pAuNRmVms=/1072x603/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/embedly/Screenshot_2026-11-10_at_2.02.34PM.png)\n\n[Dwarf
    planets](https://science.nasa.gov/dwarf-planets/) are smaller planets that orbit
    a star and have a nearly round shape, which happens naturally with objects above
    a certain size, as their gravitational force pulls [evenly on all sides](https://spaceplace.nasa.gov/planets-round/en/).
    But dwarf planets are not large enough for their gravity to clear their orbital
    paths of similar-size debris—the eight planets of our solar system, meanwhile,
    have achieved that feat. (Pluto’s designation was [changed from planet to dwarf
    planet](https://www.smithsonianmag.com/science-nature/once-the-solar-systems-ninth-planet-pluto-was-reclassified-20-years-ago-heres-why-planetary-scientists-and-the-public-alike-love-the-small-icy-body-180989383/)
    in 2006 for this reason—its orbit is littered with icy [Kuiper Belt](https://science.nasa.gov/solar-system/kuiper-belt/)
    objects.)\n\nQuick fact: Dynamic dwarf planet\n\n Ceres, a dwarf planet in the
    main asteroid belt between Mars and Jupiter, may [contain salty water](https://www.nasa.gov/centers-and-facilities/jpl/mystery-solved-bright-areas-on-ceres-come-from-salty-water-below/)
    that can percolate onto the surface in some regions. \n\nED138 is likely big enough
    to be round and, therefore, a dwarf planet—estimates for its size currently range
    from 370 miles to 930 miles across. But astronomers will have to confirm that
    measurement, and from the object’s brightness alone, that’s impossible. A highly
    reflective, smaller object, perhaps covered in gleaming ice caps, might appear
    just as bright as a less reflective, duller body that’s much larger.\n\nAstronomers
    have two ways to get the required data. They could observe the world in infrared
    light, which reveals the thermal energy that it emits after being warmed by the
    sun. “From that you can figure out how big it is, because we know approximately
    what temperature it should have,” Holman says.\n\nAlternatively, astronomers could
    watch the dwarf planet candidate pass in front of a star. If they know how much
    light comes from that star and how fast ED138 is moving, they can calculate the
    body’s size based on how long it obscures the light.\n\nHolman says people are
    working on making those observations with telescopes such as the [Atacama Large
    Millimeter/submillimeter Array](https://www.almaobservatory.org/en/home/) (ALMA).
    The dwarf planet candidate isn’t extremely easy to see at the moment, he adds,
    but “in the next few months it will be, and people will try.”\n\n![a mosaic of
    night sky images showing different detections of the dwarf planet candidate 2026
    ED138](https://th-thumbnailer.cdn-si-edu.com/cEAcaOOWAvwdFfR4ExL5QABxacc=/fit-in/1072x0/filters:focal(1024x770:1025x771)/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer_public/a7/55/a75585a2-6d6a-4b9e-bfb5-97c4db693402/noirlab2626f.jpg)\n_The
    Vera C. Rubin Observatory captured the dwarf planet candidate 2026 ED138 in these
    images between March and June this year.\n    \n    \n      NSF–DOE Vera C. Rubin
    Observatory/NOIRLab/SLAC/AURA Image Processing: M. Jurić (UW), D. de Martin &
    M. Zamani (NSF NOIRLab)_\n\nRight now, astronomers recognize five dwarf planets:
    [Pluto](https://science.nasa.gov/dwarf-planets/pluto/), [Eris](https://science.nasa.gov/dwarf-planets/eris/),
    [Makemake](https://science.nasa.gov/dwarf-planets/makemake/) and [Haumea](https://science.nasa.gov/dwarf-planets/haumea/)
    in the distant Kuiper Belt, and [Ceres](https://science.nasa.gov/dwarf-planets/ceres/)
    in the main asteroid belt between Mars and Jupiter. Experts have long suspected
    that there could be more of these objects, but many of them could have highly
    elliptical orbits that keep them too far away for us to see most of the time.
    What we observe is potentially the “tip of the iceberg of a few that are in the
    close part of their orbit,” Holman says. “There must be a lot that we just haven’t
    yet detected.”\n\nThe discovery also hints at a relatively unexplored area of
    our solar system—the region that’s in front of the dense, starry core of the Milky
    Way from our perspective. It’s harder to pick out objects against all the background
    light in that zone, and ED138 has been traveling through it for the past 25 to
    30 years, Holman notes. “There’s a swath on the sky where we really don’t have
    a good idea of what is there,” he adds.\n\nWhat’s more, ED138 is in the southern
    hemisphere’s sky, and a lot of astronomical observations have focused on the northern
    hemisphere. But Rubin is poised to help change that: The new telescope, which
    has the world’s largest digital camera and [captured its first images](https://rubinobservatory.org/news/first-imagery-rubin)
    last year, is one of several observatories operating out of Chile’s Atacama Desert.\n\n“Rubin
    is giving us an "
