  author: delta_p_delta_x
  text: Classifications are useful. Even the &#x27;proper&#x27; planets we split into
    terrestrials, Jovian giants, and ice giants. Each planet is individually interesting
    in itself. One might even argue all of the bodies in the Solar System exist on
    a continuum of mass from the tiniest mote of space dust, to rocks and asteroids,
    to moons and dwarf planets to terrestrial planets, ice giants, giants, and then
    the Sun, and then hypergiant stars, neutron stars, black holes, and then supermassive
    black holes, so let&#x27;s call all of them &#x27;celestial objects&#x27;—which
    we kind of do. But such a catch-all is pointless. Each object behaves very differently,
    with wildly different physical laws governing its interior and its neighbourhood.<p>Classifications
    impose structure on a collection of celestial objects, and we can derive relationships,
    commonalities, understand their development, the physics governing these objects,
    and build useful physical and mathematical models to widen our understanding of
    the universe.<p>Most reasonable scientists understand that some of these objects
    will blur the edges—like many moons being more massive and larger than Mercury.
    Or like the largest super-Earth exoplanets being nearly as massive as Neptune,
    or the largest gas giant exoplanets being 30-80 times as massive as Jupiter and
    hence having a surface temperature of ~2000 K. But that is part of science, and
    possibly even where the most interesting work is.
  score: 0
