    The thing about HBM memory is that it is part of the same chip as the GPU itself – the memory die and logic die get bonded to an interposer die during manufacturing.
    Because of this, it is quite plausible that the GPU die cannot be fully yield-tested early enough in the manufacturing process to install reduced amounts of RAM in the mining cards.
