  author: jauntywundrkind
  text: Oh, you want to install an apk you want to try? First enable developer mode,
    go into settings and click some random thing a bunch of time. Which unlocks an
    intimidating scary section. Then wait 24 hours. Then you can install an apk. <a
    href="https:&#x2F;&#x2F;www.bgr.com&#x2F;2303296&#x2F;how-to-install-apps-android-phone-outside-play-store&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.bgr.com&#x2F;2303296&#x2F;how-to-install-apps-android-phon...</a><p>Are
    your users going to do that? I can imagine you or I doing that. But is that what
    you want to tell your users to go do?<p>Alternate app stores are coming. But my
    understanding is they still require the same developer verification. As a developer,
    it&#x27;s only $25&#x2F;life for now to get registered, if you&#x27;re an individual.
    And jumping through some legal hoops, which hopefully you have your paperwork
    setup for. If your an org, the costs may be higher.<p>There was some hope open
    source types might set up their own app stores, to help with the sometimes extremely
    slow or frustrating or limiting Google Play Store reviews. But we just found out
    it&#x27;ll be $10,000&#x2F;year. And no one in the US is going to get access to
    that. Also, this channel while convenient still assumes your users have to switch
    to that app store to get your app. <a href="https:&#x2F;&#x2F;www.techrepublic.com&#x2F;article&#x2F;news-google-android-registered-app-stores-program&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.techrepublic.com&#x2F;article&#x2F;news-google-android-reg...</a><p>Oh
    and by the way, you can&#x27;t sign your apps anymore. You don&#x27;t actually
    have control over your apps. Google is replacing apk with App Bundles. In this
    model, you have to sign your app to upload it, with an upload key you control.
    But then what actually goes out and gets checked is Google shipping their signature
    on an App Bundle, with their keys. There&#x27;s nothing to stop Google from pushing
    out a release to your app with whatever changes they want. This caused great consternation
    with VLC for example who was (quite justly) not very happy about this new arrangement.
    That got resolved, but now Google&#x27;s the one signing VLC. <a href="https:&#x2F;&#x2F;arstechnica.com&#x2F;gadgets&#x2F;2021&#x2F;07&#x2F;google-play-dumps-apks-for-the-more-google-controlled-android-app-bundle&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;arstechnica.com&#x2F;gadgets&#x2F;2021&#x2F;07&#x2F;google-play-dumps-ap...</a>
    <a href="https:&#x2F;&#x2F;dev.to&#x2F;npomepuy&#x2F;vlc-for-android-updates-on-the-play-store-179j"
    rel="nofollow">https:&#x2F;&#x2F;dev.to&#x2F;npomepuy&#x2F;vlc-for-android-updates-on-the-play-...</a><p>So
    yes, it&#x27;s technically still possible! For users and for devs&#x2F;corps,
    for people, there&#x27;s still technically options for people to install apps.
    As an individual you and I can manage getting stuff installed! With more and more
    hoops. With ever more onerous terms.<p>On Windows, Windows Baseline Security Mode
    got introduced this year, which also is ratcheting up demands, demanding signing
    systems for apps on Windows. <a href="https:&#x2F;&#x2F;blogs.windows.com&#x2F;windowsexperience&#x2F;2026&#x2F;02&#x2F;09&#x2F;strengthening-windows-trust-and-security-through-user-transparency-and-consent&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;blogs.windows.com&#x2F;windowsexperience&#x2F;2026&#x2F;02&#x2F;09&#x2F;stren...</a><p>These
    systems aren&#x27;t totally imbalanced right now. Native apps on native platforms
    have intense access to systems. They don&#x27;t have the secure sandbox of the
    web to protect them. It&#x27;s not reasonable to let users just stumble upon apps
    and run them, in the way that it&#x27;s perfectly fine for users to browse the
    web and run webapps willy nilly. But it&#x27;s also a war against user freedom,
    part of a broader War on General Purpose Computing, that has been steadily going
    one direction (down) for a while now. The number of asterisks will continue to
    increase, on <i>still allows people to install apps***</i>.
