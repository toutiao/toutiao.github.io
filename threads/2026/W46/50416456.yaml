    that, sometimes iframes.<p>&gt;  How do you open a port and receive network packets?<p>Webrtc,
    hopefully <a href="https:&#x2F;&#x2F;wicg.github.io&#x2F;local-peer-to-peer&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;wicg.github.io&#x2F;local-peer-to-peer&#x2F;</a><p>&gt;
    In order to run code in a language other than Javascript, you had to wait years
    for WebAssembly to become usable,<p>GWT, CoffeeScript, examples go on and on and
    on. You did have to wait years for wasm. But also, it&#x27;s fine and in some
    ways far far better that there are de facti languages for the web, and that&#x27;s
    been a huge part of why it&#x27;s so uniquely rfc8890 compliant, in ways that
    no mere platform has ever been.<p>There&#x27;s more out there alright, but it&#x27;s
    still this libertarian what can I do. It&#x27;s the developer centric view. None
    of these other platforms improve what can we do. None of them have the ambition
    to be available on tens of billions of devices. None of them are connected by
    default, networked, in anywhere near the way the web is. None of them have multi-polar
    governance &amp; cooperation.<p>I&#x27;m very glad there&#x27;s other things happening.
    But also their ambition has been very low. The web remains ridiculously different
    than every other way to run processes, while everything else (except Erlang&#x2F;beam)
    clusters very very tightly around writing single processes that need libraries
    to build up to http or websocket or grpc or quic. There&#x27;s been a tragic failure
    to think anywhere near as big as the web, to develop models where something declarative
    like the page leads the charge, grounds the programming model in something material,
    constructible, clear.<p>Google as far I&#x27;m concerned did make the web, added
    heat and pressure to keep going, to not stop here, to make it fast, gave us examples
    of use like (via acquisition I believe) Google Maps, and Gmail. We would still
    have had a web, but the parallel reality if they hadn&#x27;t been finding browsers,
    spec writers, dev tools: it&#x27;s a ghastly impoverished sad world, one where
    native apps actually look like a good choice for the world.'
