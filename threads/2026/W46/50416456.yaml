  text: 'to be clear to everyone running into this: we&#x27;ve had libertarian software
    politics like this <i>for decades</i>. &quot;i don&#x27;t want any software i
    cant drown in my bathtub and then also make myself again, preferrably still in
    my bathtub&quot;. or something like that.<p>i find it ridiculously uncompelling.
    it&#x27;s always felt not like a well formed grounded way to be. it&#x27;s amazing
    that we have really good capable platforms that can help us. especially when there
    are multi-polar orgs like w3c and what and lately wicg that serve as stewarts,
    that watch over these platforms. when there are often ietf tie ins. when there
    are projects like interop that help move the platform forward across browsers,
    agree on the baseline.<p>what&#x27;s so viciously deeply libertarian coded to
    me about this assessment is it&#x27;s me me me me me. what can i do? what can
    i make? what software can i build? with some notes of fear to tell you google
    is bad. beware google. i realize the anti-google sentiment is super strong in
    the world, but after being around the web for decades i can hardly say what thanks
    and joy and celebration i have to google for building the ultimate existential
    hedge against everyone else: a free platform for the free world that runs free
    on endless devices, that is the only free platform the world has ever seen with
    any success. that has gotten vastly better.<p>i think at this point and for half
    a decade plus on HN the &quot;I know it tends to be an unpopular opinion&quot;
    is thanks for the web and google. i think i&#x27;m in the minority for my thanks.
    i think the outrage and dismisal and scare words is by far the most popular stance.<p>but
    what&#x27;s on the other hand? native apps, on native platforms? those things
    that run on 20% of computers, that you have to be a licensed paid up authorized
    developer to ship to, that have very long queues for submitting your app to to
    maybe some day have it approved perhaps?<p>the libertarian view is what you can
    do. yeah, the super small, the do it yourself. it&#x27;s a fantasy.<p>the mature
    societal view is what <i>we</i> can do. it&#x27;s having this permissionless platform
    that <i>anyone</i> can build software for. it&#x27;s having Project Fugu trying
    to make that platform competitive, good, capable: giving hte native platform a
    constant run for the money. so that we all can benefit. so that any dev can make
    an app. it&#x27;s &quot;extensible web manifesto&quot;, where the web doesn&#x27;t
    bake in particular flavors of software development, so we can choose jquery or
    backbone or react or vue or solid or svelte or lit, so <i>society</i> can iterate
    and keep refining and re-deciding what surface they want to program to, what models
    fit them, what they want to program against: you don&#x27;t see that with native
    platforms! you get what they are and that&#x27;s mostly that!<p>you get such a
    wide ranging low level platform, such freedom to use it as you please on the web.
    but much much much more, everyone else can enjoy it too. it&#x27;s a civilized
    platform, the only civilized one where we have control, where we the world has
    say. if you don&#x27;t like the native platforms, well, you can remake something
    else, but it&#x27;ll be you and your couple friends perhaps amid the 7b people
    who are still using either the web or what big companies gave them.<p>the libertarian
    sees what they can do. but i&#x27;m really interested in what we can do. and there&#x27;s
