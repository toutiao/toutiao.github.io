  author: skydhash
  text: 'There&#x27;s also that the fact that computing historically have two models
    as far as managements goes: a) The mainframe model where users have reduced right
    and there&#x27;s a set of administrators that are responsible for choosing programs
    and configuring them b) and the microprocessor model where it&#x27;s a tool owned
    by the user and programs acting on the behalf of the users.<p>The main issue comes
    from the mixing of those two models where users own a computer, but vendors keep
    thinking of them as clients for their services. No longer content to use the network
    as the boundary, they also want a boundary inside the computer. Discord is not
    that fundamentally different from IRC, and people usually had no reason to sandbox
    their IRC clients, but you always have to worry about Discord doing some nefarious
    updates or abusing its role.'
