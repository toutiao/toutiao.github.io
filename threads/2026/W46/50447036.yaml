  author: zamadatix
  text: 'It makes a million times more sense when given the context it&#x27;s found
    in <a href="https:&#x2F;&#x2F;vine.dev&#x2F;docs&#x2F;features&#x2F;conditions"
    rel="nofollow">https:&#x2F;&#x2F;vine.dev&#x2F;docs&#x2F;features&#x2F;conditions</a><p>Tl;dr:
    Vine offers explicit versions of short circuiting and non-short circuiting conditions,
    but non-short circuiting is the default. The above explains that because it uses
    the `&amp;` operator rather than the `and` operator.<p>Broken down further: Short
    circuiting means you can defer computing everything needed to know `c` until you
    have confirmed you need to know c to answer the comparison chain. If a &lt; b
    then you might save a ton of work by not needing to ever calculate everything
    leading up to c. If a &gt;= b then you&#x27;ve now held off even starting to find
    out what c was until you need to know what c is.<p>If you have a ton of parallel
    compute then it&#x27;s not as big a deal to always compute all 3 in parallel at
    the same time, even if sometimes a lot of that compute was not needed to answer
    the question. The upside is you always finish in the shortest amount of time possible,
    even if c is a ton of work to figure out.'
