  title: "$30M Raised to Redo the CPU"
  fetch_status: success
  content: "# $30M Raised to Redo the CPU\n\n_As of today, Tendrils has completed
    a $30M round led by Benchmark to rebuild general-purpose computing._\n\nContemporary
    CPUs are made under the constraint of backwards compatibility with sequential,
    single-core chips. Accumulated layers of historical designs are locking engineers
    into decisions dating back to the 1970s. As a result, all existing CPUs are bottlenecked
    by complex cache coherency protocols and elaborate reorder buffers. CPU scaling
    is sabotaged from the start. At Tendrils, we believe that the future of general-purpose
    computing lies beyond legacy architectures for legacy software.\n\nTendrils is
    answering the question: _what if we redo the CPU?_ Instead of starting from a
    sequential design, we’re building our processor to have thousands of cores operating
    in parallel. This requires moving beyond the notion of shared mutable memory and
    linear instruction sequences. To make this possible, we’re working in tandem on
    the open-source language [Vine](https://vine.dev/), which has been designed from
    the beginning to target a new wave of parallel-first architectures.\n\nWe’re delighted
    to announce that Tendrils has raised $30 million to support this vision. This
    round is led by Benchmark, with significant participation from Visionaries Club,
    the UK Sovereign AI Fund, FR8, Antimatter, Cloudberry VC, Conviction, Embassy
    Ventures, and SV Angels. We are grateful for additional support provided by all
    of our angel investors. Additionally, we wish to extend a warm welcome to our
    newest board member, Jack Altman.\n\nWith thanks to all who have supported us,
    \ \nThe Tendrils Team\n\n* * *\n\n_At Tendrils, we insist that the chips of the
    future will be a result of close collaboration between hardware and software engineers.
    If this strikes you, consider [joining us](../../join)._"
