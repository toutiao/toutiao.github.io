  author: quilombodigital
  text: |-
    Am I missing something?<p>I couldn&#x27;t find any parallel constructs in the language. So, as I understand it, it&#x27;s a regular language that gets compiled into a graph, and the runtime parallelizes the execution of that graph.<p>This factorial won&#x27;t run any faster with more cores, since each step depends on the previous one:<p><pre><code>  fn fat(n: N64) -&gt; N64 {
        if n &lt;= 1 {
          1
        } else {
          n * fat(n - 1)
        }
      }
    </code></pre>
    This other version can run in parallel, but only because the algorithm was deliberately written that way:<p><pre><code>  fn fat(n: N32) -&gt; Nat {
        if n == 0 { 1 as Nat } else { prod(1, n) }
      }

      fn prod(lo: N32, hi: N32) -&gt; Nat {
        if lo == hi {
          lo as Nat
        } else {
          let m = (lo + hi) &#x2F; 2;
          let left = prod(lo, m);
          let right = prod(m + 1, hi);
          left * right
        }
      }
    </code></pre>
    So the programmer still has to think about parallelism; the language just removes the need for threads and locks.<p>Also, as the graph grows, sequential dependencies still limit the speedup, and more cores means more data moving between them. How does the hardware deal with that?
