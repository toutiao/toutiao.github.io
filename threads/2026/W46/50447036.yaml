  text: This is a big misunderstanding of languages and multi-threading. First, plenty
    of languages including C++ have a const keyword, rust is just const by default,
    so that doesn&#x27;t enable anything new through the language.  Even marking something
    const doesn&#x27;t enable anything new, it&#x27;s just convenient safety.<p>Single
    threaded programs being normal was originally from almost no systems having more
    than one core or CPU. Then there were few languages that had threading built in.
    Someone knowledgeable would have to use the OS API to launch threads.<p>After
    that threading has mostly come from structures that are already built. There is
    nothing difficult about copying data if that&#x27;s what people want to do. There
    is nothing that says scheduling has to be slow since you can have threads taking
    data from a queue. None of this has anything to do with rust.<p><i>you are no
    longer being slowed down by the software scheduler in the kernel</i><p>This isn&#x27;t
