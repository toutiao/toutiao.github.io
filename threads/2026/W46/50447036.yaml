  author: imtringued
  text: Before the advent of Rust all code was written with mutable aliasing by default
    in mind which has lead to the proliferation of single threaded code. Now that
    Rust code is mutable xor shared by default it is easy to copy data into scratchpads
    without risking invalidation and the tree based borrow checking model also ensures
    that you can split algorithms into independent tasks automatically.<p>The other
    problem is that automatic parallelism with the right language is actually easy,
    but the scheduling cost eats the gains because you cannot launch subtasks in the
    100s of nanoseconds timescale.<p>What&#x27;s needed is hardware accelerated scheduling
    within the same process so that you are no longer being slowed down by the software
    scheduler in the kernel.
