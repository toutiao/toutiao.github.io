  author: nukanse
  text: 'An use of SIMD in x86 is fast ram copy&#x2F;filling by sending all Avx register
    to ram with one instruction.<p>But I&#x27;m thinking more about having multiple
    logical CPUs, ALUs, or ports working on a single giant register. I think SIMD
    wastes a lot of hardware.<p>Example: radix sort needs to calculate a prefix sum.
    As the sum accumulates, it requires more bits, so the bit length should be adjustable.
    On x86, you can cast an array of bytes to a uint64_t and calculate eight prefix
    sums with a single multiplication. But eventually, you run into SWAR lane overflow
    problems. Ask an AI what this means and how the code works.<p>We need a CPU designed
    to handle lane overflow and dynamically adapt bit lengths, so at the start we
    do more parallel sums with less bits, and as the sum accumulate we increase the
    bit length gradually. This is just a simple use case. We could store more prefix
    sums as a periodic sum more deltas.'
