  author: adrian_b
  text: Such a CPU is not difficult to design, but the problem is that for the majority
    of the applications it would be much slower than a traditional CPU, by having
    a much lower clock frequency, caused by the additional delays through a great
    number of multiplexers and buffers that would be needed in such a CPU (even the
    multiplexers that are not implemented with physical gates, but e.g. with tri-state
    buffers driving common bit lines, introduce extra delays due to driving greater
    capacitances).<p>Besides a lower clock frequency, such a CPU would also have a
    power consumption, due to a greater total capacitance of the internal nodes.<p>The
    number of problems whose solution could be accelerated by such a structure is
    too low to make it worthwhile.<p>The latest SIMD instruction sets have a lot of
    instructions that handle the entire SIMD registers as bit strings, with which
    many clever algorithms can be implemented, so there is not a lot more that could
    be done by explicitly partitioning the register file into registers of arbitrary
    length.<p>For instance AMD Zen 6 has just introduced a so-called bit-matrix multiplication
    and bit reversal instruction set extension, which will also be available in future
    Intel CPUs.<p>Despite their name of &quot;bit matrix multiplication&quot; which
    does not suggest much, those instructions (which use either OR reduction or XOR
    reduction) can implement a great number of bit manipulation techniques, by choosing
    some appropriate bit string constants for some of the operands (which will mask
    parts of arbitrary lengths of the bit strings that are combined).<p>In general,
    even with the older instruction sets, you can use the SIMD registers as if they
    would be the concatenation of an arbitrary number of registers of arbitrary lengths.<p>The
    only difference from your desired CPU is that you must intercalate in any algorithm
    many register masking and register copying instructions, which would not be necessary
    in your desired CPU, because it would remember the current register set configuration
    with its number of registers and their lengths, until you change it again.<p>The
    addition of all the extra instructions needed to simulate a CPU with registers
    of arbitrary lengths could be done by a compiler or interpreter designed for this.
