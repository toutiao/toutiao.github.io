  author: jcranmer
  text: That&#x27;s not the usual way to discuss CISC or RISC (and ARM fails two of
    the three questions anyways).<p>To be honest, CISC versus RISC has not been a
    useful distinction in architecture design for 30 years. Intel managing to make
    a superscalar CISC processor, the Pentium, should have put to bed any idea that
    there&#x27;s a fundamental distinction between CISC and RISC that is useful.<p>The
    reality is that RISC isn&#x27;t a single idea so much as it is a collection of
    ideas for how to design a microprocessor, and some of those ideas have turned
    out to be good and some of them have turned out to be bad. Rather than evaluating
    on the merits of RISC or CISC, we should evaluate on the merits of the embodied
    ideas. Let&#x27;s stop trying to view 2020s design decisions based on 1970s models,
    okay?
