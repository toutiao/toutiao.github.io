  author: socketcluster
  text: I feel like these kinds of platforms which simplify the hosting and development
    with AI will be critical. I bootstrapped a product in the space but I&#x27;m not
    feeling the interest yet from other people and I&#x27;m just using it for myself
    and a few close customers for now. Not really promoting anymore even though it
    cut my own development and maintenance time by at least 90% and significantly
    improved security.<p>I think people need to experience more critical vulnerabilities,
    more hacks, more pain.<p>When vibe coders will be lost in tangled webs of complexity
    with hundreds of thousands of lines of code, unhappy customers and they can&#x27;t
    find engineers to fix their slop (because the good ones are all too busy fixing
    other slop) and they are on their knees begging for relief, that will be the right
    time.<p>Or maybe it will be after that point. Let them hit rock bottom and their
    startup collapse due to complexity. Then I can try to promote to them for their
    next startup. Start-up failure due to complexity hasn&#x27;t really been a bottleneck
    in the past; usually product-market fit is the bottleneck but I&#x27;m hoping
    this changes.<p>Paul Graham said it right, &quot;Make something people want&quot;
    and it&#x27;s a very different problem from &quot;Make something people need&quot;.
    I&#x27;m sure I made something people need, but they won&#x27;t know they &quot;want&quot;
    it until they&#x27;ve felt a significant amount of pain.
