    not.<p>A lot of the problems can&#x27;t happen in popular datacenter-buildout
    areas in Poland <i>because</i> the local government cannot change anything about
    taxes nor can it give any sort of tax break and the most sweetheart deal thing
    you could pull is water pricing and that is also hard to sell. Nationwide rules
    set which government levels get what part of the taxes levied on the datacenter,
    and because of how what USA would call &quot;property taxes&quot; are calculated,
    there&#x27;s considerable pressure for owner of the DC to get paying tenants to
    pay for them.<p>Even at maximum imaginable tax &quot;optimization&quot;, a DC
    is one of the best RoI things a local government can have in Poland
