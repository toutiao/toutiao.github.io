  author: 10u152
  text: This is a regulation problem, not a datacentre problem.<p>In Aus, when anyone
    makes an application to connect to the electricity network, you get charged for
    ALL upstream upgrades to service your load. That might mean new powerlines, new
    substations upstream etc. That both shifts the load onto the DC operator AND moves
    them to areas where spare capacity is available.<p>Similar thing applies for a
    water connection.<p>Datacentres still technically drive up spot price for electricity
    but with the amount of new generation coming online that will even out over time.
    We&#x27;re building DCs like crazy here and the average spot price is actually
    falling.
