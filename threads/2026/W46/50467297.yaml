  text: 'Not GP.<p>The trick is to get a good sense of the algorithms associated with
    basic data structures (list, stack, queue, graph, hashmap,...). They are primitives
    and almost any standard problem can be solved with those.<p>What you need to train
    most is the capability to break down problems: Like I have this input (and associated
    metadata), I have this context (may be null), I have those constraints (values,
    ranges, memory space, time, both, or neither), and I need these outputs. Then
    it&#x27;s just a puzzle.<p>I no longer prepare for coding problems other than
