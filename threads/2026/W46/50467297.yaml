  author: zahlman
  text: That&#x27;s largely because the OP couldn&#x27;t clearly describe a specific
    situation to ask about (the question underlying the problem, but also a clearly
    recognizable, reproducible example); and solving <i>your</i> problem might depend
    on things that are different in your setup vs. the OP&#x27;s.<p>That&#x27;s the
    thing, though. Stack Overflow <i>is not and never was</i> intended to <i>solve
    your problem</i>, nor to solve the OP&#x27;s problem. It was intended to <i>answer
    questions</i>. It was your responsibility, both as someone posting a question
    and as someone reading the Q&amp;A later, to adapt knowledge to your circumstances.
    That&#x27;s why they&#x27;re called questions and answers, and are <i>not</i>
    called problems and solutions.<p>People who use a web site to get a solution to
    a problem are looking for a help desk, or a forum. Stack Overflow was <i>specifically</i>
    created to be <i>not that</i>, and that choice was <i>specifically</i> motivated
    by the frustration people had with trying to search those kinds of sites for information,
    and the frustration that experts had with trying to help people (for free) in
    that kind of environment.
