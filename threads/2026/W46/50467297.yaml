  author: saghm
  text: At previous jobs, I was the one coworkers would come to when they had messy
    git problems and needed help cleaning them up. I&#x27;ve put in the hours in the
    past to learn how to do all of that, and then later forgotten it because it&#x27;s
    just not worth it anymore. I switched to jj a few years ago and had the majority
    of the annoying rebase issues go away, and whatever&#x27;s left goes into my LLM
    to spit out a potential solution that I can then manually tweak if the result
    isn&#x27;t perfect.<p>My OS professor in college once told us about what he considered
    the difference between &quot;knowledge&quot; and &quot;information&quot;, with
    &quot;knowledge&quot; being the underlying facts about how something works and
    &quot;information&quot; being the terminology&#x2F;labeling&#x2F;bucketing&#x2F;etc.
    of how to refer to it. The point he made was that knowledge was more important
    than information, and that he would try to test us on knowledge rather than information.
    To me, knowing how the underlying version control model works and what &quot;shapes&quot;
    you might want to make with it is useful knowledge. The exact set of commands,
    interactions with an IDE, or specific prompts you can use to ask an LLM to produce
    them is information. Arguably the entire benefit of LLMs is that you can ask them
    to do things even if you don&#x27;t have the exact information memorized; if you
    can describe it in a rigorous way, and recognize whether what it gives you as
    an output fits that or not, you don&#x27;t need to know any of the actual information
    of how to do it manually.
