  author: saghm
  text: No, the reason not to learn your tools is if they&#x27;re not your tools anymore,
    and something else is. I don&#x27;t spend time trying to manually invoke filesystem
    APIs to create files in my work projects and instead will often just have my LSP
    do it when I declare a module and the file isn&#x27;t found. I <i>could</i> memorize
    the exact sequence of system calls needed, but my employer would prefer I spend
    time on things that are more worthwhile to them.<p>I don&#x27;t disagree that
    having a deterministic CLI is useful, but I&#x27;d argue that&#x27;s not the question
    here, because the CLI is what the statistical machine will be using. The question
    is whether the time spent doing it manually is worthwhile compared to the tokens
    spent on it. I&#x27;d further argue that if you instead learn how to pick the
    right model for the right job so that you don&#x27;t use something way more expensive
    than needed for the task at hand, the token overhead will be extremely minimal
    for stuff like git operations; knowing that you can use something cheaper than
    like, Astra or Opus if all you want to do is a quick git cleanup and push is going
    to save your employer a lot more money in the long run than if you insist on doing
    every messy rebase by hand.
