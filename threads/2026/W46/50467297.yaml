  author: SkyPuncher
  text: I run a live coding challenge on a rather benign coding problem with the explicit
    expectation that candidates will use an LLM.<p>Interestingly, an LLM involved
    feels like it’s made it easier to assess candidates. Senior candidates know exactly
    what they’re doing and strongly driving the LLM. They pre-communicating design
    decisions, gotchas, and requirements.  They also ask a lot of clarifying questions
    and dial in the scope (after all not building something is better than building
    it).<p>Less experienced candidates tend to jump right in, build way too much,
    and stumble because they delegated all of the critical thinking to the agent.
    They often end up in a place where the agent doesn’t align with their vision and
    they can’t really reign it back in.
