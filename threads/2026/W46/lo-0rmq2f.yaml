    I found this quite interesting: a deceivingly simple feature with far-reaching privacy implications.
    A related issue I've been pondering is images in e-mails. Most modern clients ("user agents") will not blindly request an image from your machine. Webmail is another story. Take GMail, for example: it displays images by proxying them through Google's cache, and will often do so unprompted. This seems good on the surface - the client does the obvious thing (just display the HTML), and the user's browser is not really involved in external requests.
    On the other hand, this still discloses several facts about the recipient: namely, that they opened the message at a given time. You might be excused for thinking "the attacker only gets one shot", but no - from my testing, the proxy respects the cache headers, so as to enable useless gimmicks important marketing features such as countdown GIFs generated on-demand (these usually contain just 60 frames for the next minute). So, if you repeatedly open the same e-mail, several requests have to go out from somewhere, and they are not temporally de-correlated.
    I'd rather stick with "Show images" on demand, thank you.
