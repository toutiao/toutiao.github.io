    Good read. This is why my IRC client project comes with a separate service for generating link and media previews. It's a privacy and security problem with essentially all other IRC clients that have link preview support, that the IRC client itself is fetching the link or media, exposing your connection to people with malicious intent. On top of that, it's good to have your link preview fetcher isolated from the rest of the application server, so a malicious link doesn't have access to your users data if something bad does get through. Oh, and then there's DNS rebinding attacks, too! With a cache in place, a multi-user IRC client also somewhat masks the 'you know who saw the link' issue mentioned in this thread, as any number of users on your instance could be the one who saw the link and no one knows how many users you have. Though I guess this breaks down with private messages.
    Kind of one of those things a lot of people don't seem to think about. Sorry, I guess I am just patting myself on the back in this comment, but this topic really interests me and my first time seeing something on Lobsters that is really in my wheelhouse, so I had to say something. :)
