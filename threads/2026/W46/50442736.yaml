  author: schoen
  text: 'There is a Ninth Circuit decision that domain names are a form of property<p><a
    href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Kremen_v._Cohen" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Kremen_v._Cohen</a><p>but
    it&#x27;s tricky because the domain name registries and registrars have a kind
    of thicket of contracts nowadays that subordinates registrants&#x27; property
    interests to other rules and considerations. So I don&#x27;t think a court would
    think that a modern-day domain name registrant has property rights in a domain
    name that supersede all of those contractual terms.<p>Edit: my recollection is
    that Kremen v. Cohen interpreted the legal defaults that applied because Kremen
    registered the domain name in an era when Network Solutions didn&#x27;t require
    registrants to agree to a contract that limited Network Solutions&#x27;s liability
    and gave it various explicit rights and powers.<p>I&#x27;m not a huge ICANN expert,
    but I think ICANN broadly thinks the status quo is preferable to one in which
    registrants had stronger, less equivocal property interests in names.'
  score: 0
