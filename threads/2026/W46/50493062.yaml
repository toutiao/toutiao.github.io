  author: magicalhippo
  text: |-
    &gt; DJ Delorie&#x27;s djgpp project<p>Fun story time. I started programming on Turbo Pascal. I had read some C code from those demo scene guides, so felt I understood it fairly well by the time I got my hands on a copy of djgpp. I decided to port a relatively simple program I had written in Turbo Pascal, about 300 LOC, line-by-line. It was a small demo just doing a simple rotating, texture-mapped triangle.<p>I carefully converted it, and went over it several time one line at a time, fixing it until I had read over it three times and was happy.<p>I then ran the djgpp compiler...<p>Now, what I hadn&#x27;t realized at the time was the difference between C and C++. The examples I had seen was C, and I didn&#x27;t really know what C++ was.<p>The compiler churned on my code and spit out about 3500 errors and warnings (it counted for me).<p>I was shocked. How did my 300 line C program manage to produce over 10 errors and warnings per line, on average?!<p>I spent a long time trying to figure this one out. The first error was inside the first function, and the error made no sense to me.<p>After several days of carefully going over each line and banging my head against the table, I suddenly saw it. There, at the very start of the program, before the line the first error or warning pointed to.<p>In Turbo Pascal I had used const to define things like screen width and height. So I&#x27;d have<p><pre><code>  const SCREEN_WIDTH = 320;
      const SCREEN_HEIGHT = 240;
    </code></pre>
    Well, C doesn&#x27;t have const, but I had picked up it had #define. However, my Turbo Pascal habits had kicked in, and so I had written<p><pre><code>  #define SCREEN_WIDTH 320;
      #define SCREEN_HEIGHT 240;
    </code></pre>
    I removed the two semi-colons and the program compiled and ran just fine...<p>I ended up staying in Turbo Pascal, I preferred a compiler that gave me sensible errors and quickly. I did pick up C++ much later, and I guess ironically came to appreciate its const correctness.
