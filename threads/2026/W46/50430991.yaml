  author: emptybits
  text: 'There is no transaction fee (or &quot;convenience fee&quot;) in Vancouver.  &quot;Like
    PayByPhone, there are no added fees for using HotSpot to pay for parking.&quot;[1]
    (2026)<p>It definitely happens in some cities and with private operators. It shouldn&#x27;t
    and there used to be a strong reason why. When we were still rolling PayByPhone
    out to as many cities as we could, the argument was strong (and often accepted
    by the city) that by having no additional app usage fees the city would see more
    rapid adoption of the service by users. That was everyone&#x27;s goal because
    a reduced need for meter coverage in busy areas, for new meters in new areas,
    and reduced physical wear and tear and vandalism and theft, the cheaper the city&#x27;s
    operating and capital costs are. Those costs are real.<p>As the radius of paid
    parking expands in a metro area, and it always does, it&#x27;s an enormous cost
    saving for cities (read: taxpayers) to see it happen with apps and not hardware
    on streets. The maintenance contracts of meter manufacturers is truly a racket.
    The city will pay millions up front for a neighbourhood of meters and then pay
    hundreds of thousands per year for the maintenance contract. Forever. That sort
    of nonsense is buried in parking rates.<p>So yeah, IMO, transaction fees are mostly
    bullshit. Apps help keep capital and operating costs low. They&#x27;re ahead of
    the game by ditching street hardware and eating the very small transaction costs
    (their merchant accounts are typically low cost because of the sheer volume they
    push through).<p>[1] <a href="https:&#x2F;&#x2F;vancouver.ca&#x2F;news-calendar&#x2F;mobile-option-pay-for-street-parking-vancouver-april-2026.aspx"
    rel="nofollow">https:&#x2F;&#x2F;vancouver.ca&#x2F;news-calendar&#x2F;mobile-option-pay-for-str...</a>'
  score: 0
