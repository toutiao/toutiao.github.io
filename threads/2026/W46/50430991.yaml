  author: dghlsakjg
  text: 'I&#x27;m looking at three receipts from the past few months with fees added
    on top of parking fees. You are correct that they are not called convenience fees.
    They are called SMS reminder fee, and SMS confirmation fee totalling $.26 on every
    single transaction.<p>By digging through google and reddit (can&#x27;t find this
    anywhere in the PayByPhone app) I can see that it is possible to avoid these fees
    by digging into user settings, although the app NEVER told me that I was being
    opted in to this optional fee, and nowhere in the receipt, the checkout screen,
    or the settings screen does it note that the setting is connected to a fee and
    optional or vice versa.<p>I maintain that charging a 500% upcharge on SMS sending
    (making an assumption that they are paying the highest possible rate for sms send
    at twilio, which would be excpetionally stupid. EDIT: I just checked, Twilio charges
    are less than I remember. The real markup is 1,400% per text) that users do not
    know they can disable is abusive.<p>So you are correct that there is no convenience
    fee. There is just an &quot;optional&quot; fee that you are default opted into,
    and opt-out is buried 3 layers deep in the settings of the app, that charges 1400%
    markup on cost to send a text message for an app that has notifications. Is there
    a single setting to disable all SMS? nope. You have to opt out for each message
    type. Honestly, I think this sort of dark pattern is far more abusive than convenience
    fees when the city has already negotiated to eat that, and PayByPhone opts you
    into paying for something without notification. I would be pretty embarrassed
    to ship this. Its either incredibly bad UX design, or intentional dark patterns.<p>It
    shouldn&#x27;t take a highly technical user having a random interaction with a
    founder to discover that they have been paying fees they didn&#x27;t need to after
    being opted-in without notification (no mention of costs or opting in in the TOS).<p>EDIT:
    I dug into the help page. The fees listing is paginated, so at first glance it
    appears that SMS fees do not apply in Vancouver until you paginate through. Fees
    have now been increased to $.15. The upside is that I can now say that I literally
    got nickel and dimed by PayByPhone'
