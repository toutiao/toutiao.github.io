  author: socalgal2
  text: 'The common example is Mastercard and Visa. They charge a fee to the merchant
    but they require that that the merchant cannot offer you a lower price to pay
    some other way to avoid the fee. On top of that, there are 2 fees, one for &quot;regular
    cards&quot; and one for &quot;premium cards&quot; (gold cards, platinum cards).
    They charge the merchant more when a user uses a premium card but they require
    the merchant not to tell you.<p>In an ideal world (well, my ideal world), these
    fees would be called out so that you, the customer, could choose not to pay them.
    You might see, &quot;if I pay cash this $100 product will cost $100 but if pay
    with my platinum card it&#x27;s $105. I can save $5 by paying cash&quot;.<p>Mastercard
    and Visa forbid this for two reasons: (1) they don&#x27;t want you choose the
    cheaper cash option (2) they don&#x27;t want a competitor to be able to offer
    a lower fee. In the example above, they charge $5 but a competitor could charge
    $1. You&#x27;d might pick the cheaper option but you&#x27;re unaware of it since
    they forbid the merchant from offering.<p>They can only do this because they effectively
    have a duopoly on the market. Don&#x27;t play by their rules, lose 99% of your
    customers. Various governments try to fix this. The cynical reason it hasn&#x27;t
    been fixes is they pay off politicians to make sure it doesn&#x27;t get fixed.'
