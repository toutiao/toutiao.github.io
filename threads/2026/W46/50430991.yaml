  author: rmunn
  text: "&gt; A high school kid with AI coding could build a perfectly functional
    app in an afternoon and keep more money in local communities.<p>If I were still
    a high school kid, I hope I would be wise enough not to vibe-code an app that
    handles money. Because any time your app handles money, all kinds of laws and
    regulations may end up applying to you. How do you handle refunds? How do you
    handle claims (true or not) of fraud? How do you handle actual fraud? If your
    app has a bug that means someone&#x27;s payment didn&#x27;t get sent to the city
    &#x2F; parking lot owner correctly, and the customer&#x27;s car gets towed, you&#x27;re
    going to have an angry customer calling you and demanding that you reimburse their
    towing fees, or threatening to sue you for negligence, or something.<p>There are
    just all kinds of minefields when you start coding up an app that handles money.
    And they can vary <i>wildly</i> from one jurisdiction to the next. What city is
    this in? What state&#x2F;province? What <i>country</i>? What are their laws about
    all of the above (refunds, fraud, etc.)?<p>So in this particular case, I&#x27;m
    not sure AI is nearly as like to disrupt the market as it would be in use cases
    that don&#x27;t involve handling money. Because the <i>risks</i> you undertake
    when you set up to be a payment middleman are quite a bit higher than they are
    in other fields."
