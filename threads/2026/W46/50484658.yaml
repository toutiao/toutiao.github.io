  author: skydhash
  text: |-
    From &quot;The Mythical Man-month&quot; (1995 ed)<p><pre><code>  For some years I have been successfully using the following rule of thumb for scheduling a software task:
        l&#x2F;3 planning
        l&#x2F;6 coding
        l&#x2F;4 component test and early system test
        l&#x2F;4 system test, all components in hand.
    </code></pre>
    The separation can be blurred if you follow an iterative approach (also explained in the book), but it aligned roughly with my experience. And whenever I helped a colleague in the past, coding was not the problem. It was either the lack of planning (no data modelling, no rough algorithm design), or no test  setup (trial and error coding). It was never the coding part. Syntax errors is trivial to solve (with any good editor) and most libraries have good reference docs (not learning the library is an orthogonal matter).
