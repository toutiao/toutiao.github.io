  author: renehsz
  text: "&gt; All through your post you are assuming I’m getting stuck or “don’t enjoy
    figuring things out”<p>I should have made it clear that I was referring to the
    generic&#x2F;impersonal &quot;you&quot;, the HN readers, not &quot;you&quot; as
    in the specific account I was replying to. Sorry about that! I should have worded
    it more precisely. It certainly wasn&#x27;t meant to be condescending.<p>Re puzzle
    difficulty in The Witness, this is the part of your previous comment that confuses
    me:<p>&gt; The hardest part of the Witness is the fact you aren’t told the rules
    of the line-drawing puzzle you’re presented. But often, they’re not that hard
    to discover. It’s not half as clever as Blow thinks it is. It’s essentially “what
    number am I thinking of”? Then being called a fool when you didn’t guess 12,859,155.<p>I
    might have misunderstood this paragraph the first time I read it and wrote my
    reply. But now that I&#x27;ve read it about ten times, I still don&#x27;t understand
    what exactly you&#x27;re referring to.<p>On the one hand, you say that the rules
    often aren&#x27;t that hard to discover. Fair enough. On the other hand, you compare
    it to guessing the number 12,859,155. I took that to mean the rules are very hard
    (take a lot of tries) to guess correctly.<p>I don&#x27;t remember the latter being
    true at all. There is some guesswork initially to discover the rules, but those
    rules then apply to a lot of puzzles, and different rules combine to form larger
    and more interesting puzzles.<p>What I personally found most satisfying was eventually
    gaining a meta-understanding of how the rules are structured, and sometimes being
    able to predict what the new rules for a set of puzzles will be, taking away the
    guesswork completely.<p>(Granted, it&#x27;s been a long time since I played the
    game at release, so maybe I&#x27;m misremembering things or viewing them through
    a lens of nostalgia.)<p>&gt; And Order is sokoban. Just, like, a lot of it. [...]
    They are not mind-expanding journeys into the very nature of the meaning of puzzles.<p>For
    me personally, Blow&#x27;s games have been mind-expanding. But I rarely play puzzle
    games. If I did, I might already be familiar with a lot of these ideas and find
    the puzzles boring. For me, the difficulty was just right. But I can imagine that
    people who play a lot of puzzle games need more to find something interesting,
    and that&#x27;s fine.<p>So if your criticisim is that the puzzle rules aren&#x27;t
    interesting or sophisticated enough for some people, then fair enough. They are
    interesting enough for me, though, and judging by sales and reviews, a lot of
    other people feel the same.<p>Either way, none of this is meant personally, I
    just enjoy talking about these games. Also, I can&#x27;t speak to Blow&#x27;s
    politics or other opinions people have brought up elsewhere in this discussion.
    All I can say for sure is that I&#x27;ve really enjoyed his games, and other people
    might too."
