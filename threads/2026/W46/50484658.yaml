    that excludes everyone else on the team. From their perspective, they are wondering
    why everyone else isn’t getting on board. But it’s a situation where one person
    understands it, and their deep understanding of it contributes to them moving
    fast, and then add AI and now the ground is shifting faster than anyone else can
    understand enough to contribute. This is another kind of wisdom gap, knowing how
    to get a team performing at a high level, versus an individual contributor performing
    at a high level.<p>This is where, from your perspective, you’re driving a speed
    boat as fast as you can, wondering why your coworkers aren’t on board. But from
    their perspective, they’re following your boat in their boats, but your boat is
    creating waves behind it and splashing water up, so their experience is a bumpy
    ride getting water splashed in their face constantly while they’re yelling “hey
    can you slow down up there?” From your perspective, it makes no sense to slow
    down. You’re not experiencing any problems. Yet both perspectives are still true.<p>The
    person who is charging forward as fast as possible also seems to be the one who
    has less experience operating and supporting systems, understanding how systems
    fail in unexpected ways, and so forth. Every week I have a conversation where
    someone tells me, “oh, I didn’t consider it might fail in <i>that</i> way”, and
    every time I think, yeah it would have been really nice if we’d had a 20 minute
    conversation 6 weeks ago when you started.<p>In general, it’s not that “other
    people just haven’t figured out the tools yet”, it’s also a significant part of
    who’s leading each initiative. I could absolutely do what my coworker does and
    setup my custom harness to pull off amazing stunts of productivity. I just think
    it’s irresponsible much of the time.<p>[0] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Knight_Capital_Group"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Knight_Capital_Group</a>
