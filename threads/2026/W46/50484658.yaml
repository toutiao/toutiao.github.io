  text: "&gt; you compare it to guessing the number 12,859,155. I took that to mean
    the rules are very hard (take a lot of tries) to guess correctly.<p>The puzzles
    in The Witness can be obvious from a certain perspective and so then if you <i>have</i>
    that perspective there&#x27;s only one answer, why can&#x27;t everybody see that.
    But if you lack that perspective, or worse, have slightly different perspective
    which you have falsely believed to be correct, you struggle.<p>If I know every
    US sports team&#x27;s nickname then a Connections solution which hinges on knowing
    New York&#x27;s team names seems obvious. If I didn&#x27;t even know who the &quot;Yankees&quot;
    are then I&#x27;m going to find that particular connection hard to understand.
    Likewise if you know Lead&#x27;s atomic symbol is Pb then you&#x27;re going to
    more easily see that the letters PB might be related to a clue you had previously
    thought was about the verb &quot;lead&quot; not the noun."
