    coding discipline to maintain.)<p>4) Turn off Xbox and go home.<p>Between the
    Visual Studio debugger and the Whole Tomato coding assistance, it was easy to
    understand the code and the runtime behavior. For anything GPU-related, <i>Microsoft
    Pix for Xbox</i> gave you a scrubbable timeline of every action, every pixel,
    every register change in the GPU while drawing a frame.<p>The hardware capabilities,
    available libraries, and artist tools have increased tremendously since then.
    But, the coding experience has not. 20 years later, I&#x27;m outside of gaming
    and I find most people using re-run-and-printf debugging for professional development.
