  author: tialaramex
  text: So, two things can be true simultaneously.<p>That &quot;Eureka&quot; moment
    you describe is what puzzle makers are striving for, which is why e.g. Portal
    2 has a hack where either portal button will save you in a situation where players
    may realise &quot;Oh! A portal can save me!&quot; but forget which end they need
    - just dying because you picked wrong isn&#x27;t satisfying. This isn&#x27;t Wolverine
    - if you just stubbornly don&#x27;t use a portal you will die - but if you flail
    and pick orange when you needed blue the game has mercy on you.<p>However, Blow
    doesn&#x27;t seem to have yet understood that the skill isn&#x27;t in making the
    puzzle difficult and having a &quot;Eureka&quot; moment for some players but in
    designing your game to maximise this experience for the most players.<p>You can
    learn about this more easily playing &quot;Zendo&quot; <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Zendo_(game)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Zendo_(game)</a>.
    A master who invents a rule their player cannot discover isn&#x27;t a <i>good</i>
    master, that&#x27;s just frustrating for everybody, there is skill in choosing
    a rule that will give your players the &quot;Eureka&quot; moment.<p>Two recent-ish
    video games stick out in my mind for delivering on this in very different ways.
    The first is Blue Prince. Blue Prince <i>really</i> wants you to figure out what&#x27;s
    going on and have those Eureka moments. I have seen one gamer go &quot;Bridge.
    Bride. OK I see what we&#x27;re doing here&quot; in their first five minutes of
    the game. I have seen a different gamer go &quot;Yes, yes, a map of the house
    and more riddles, but what does it all mean?&quot; while standing in the Study
    still not having understood the exact same puzzle... Tonda designed the game to
    be enjoyable for both players.<p>Secondly, Fleb&#x27;s games, most obviously &quot;20
    Small Mazes&quot; and its sequal &quot;20 More Somehow Even Smaller Mazes&quot;.
    This time rather than offering many, many clues, the game delivers Eureka at pace
    by not forcing you to solve increasingly complicated versions of the same puzzle
    as &quot;The Witness&quot; does but instead you go from not understanding to then
    figuring it out and at about the time you go &quot;Eureka!&quot; the maze is solved
    and the next one is different.<p>That meta-stuff you mention leaves me cold because
    it&#x27;s just introspection and I can do that without a video game. If the video
    game needs to fit in a Commodore Vic 20 (a machine with 4096 bytes of RAM, yes
    I said bytes) then sure there&#x27;s no room to do more, giving me pause to reflect
    on my own beliefs is maybe the best you can do. But games like Animal Well show
    that in a modern video game you can, and I argue you should, actually put more
    game in the game, not just sit back and tell players their thoughts are part of
    your game. &quot;The Witness&quot; has moments where you think &quot;Ooh, maybe
    there&#x27;s more game in this game&quot; but no, Jon couldn&#x27;t be bothered
    to deliver more game, that&#x27;s really your job apparently.
