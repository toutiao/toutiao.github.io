  author: patryk_builds
  text: 'The part about saturating a home upload link is what makes this different
    from ordinary bot noise. On a rented box a crawler wave is an annoyance; on a
    home connection it takes the whole household offline.<p>One middle ground between
    &quot;home server takes everything&quot; and &quot;put a large CDN in front&quot;:
    a small rented VPS as a caching reverse proxy, with the home machine reachable
    only through a tunnel from it. I run a small site and a demo on a few-euro VPS,
    and at that price the bandwidth is no longer mine to worry about. The crawlers
    hit the cache, rate limiting happens there, and the home line only sees cache
    misses. It is still paying someone, but it is a commodity box you can move in
    an afternoon, with no dependency on one provider&#x27;s edge.<p>Blocking by ASN
    instead of hand-picked &#x2F;16s might also save you some evenings, since the
    cloud ranges keep changing.<p>Does the photography site need to be public at all
    for what you want from it, or would a password shared at events get you most of
    the way there without going fully to print?'
