  author: Bender
  text: |-
    Don&#x27;t give up.  Blocking, redirecting and tarpitting bots can be turned into a fun game or puzzle of sorts.  The bots evolve and so the game must evolve.  I slow the residential bots down just a little and the obvious bots to somewhere between 32 and 96 bytes per second.  I thought most would abort but many do not.  They hang around for the slow dribble.<p>Here&#x27;s just one example.  It&#x27;s kindof rude, especially for legit people behind corporate firewalls but such people should not be on my site anyway.  Adjust as needed.  It&#x27;s just a silly example.<p><pre><code>    if ($server_protocol = HTTP&#x2F;2.0) { set $limit_rate 384k; set $ok 1; }
        if ($http3 != &quot;&quot;) { set $ok 1; } # no rate limit for quic
        if ($ok != 1) { set $limit_rate 32; limit_rate_after 128; set $trace &quot;${trace}not-h2h3 &quot;; add_header Content-Type text&#x2F;html;return 200 &#x27;&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;title&gt;Welcome to nginx!&lt;&#x2F;title&gt;&lt;style&gt;body{width:35em;margin:0 auto;font-family:Tahoma,Verdana,Arial,sans-serif;}&lt;&#x2F;style&gt;&lt;&#x2F;head&gt;&lt;body&gt;&lt;h1&gt;Welcome to nginx!&lt;&#x2F;h1&gt;&lt;p&gt;If you see this page, the nginx web server is successfully installed and working. Further configuration is required.&lt;&#x2F;p&gt;&lt;&#x2F;body&gt;&lt;&#x2F;html&gt;&#x27;; }
    </code></pre>
    People not behind fascist firewalls and not on proxies will be able to use QUIC (via alt-svc header and dns) for full speed.  Most real VPN&#x27;s should be able to use QUIC.<p>This is just one silly example.  One can use nginx geo in combination with FireHOL and other spammer IP repositories <i>(consolidating with iprange)</i> to also slow or tarpit or give dummy HTML and keep them on your edge servers and away from the origin <i>or app servers or whatever</i>.
