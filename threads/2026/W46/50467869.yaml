  title: Running web sites makes me not want to - Lowkey Party
  fetch_status: success
  content: "# Running web sites makes me not want to\n\nIt is so just depressing these
    days.\n\nSeveral years ago now I started self-hosting things. Initially the learning
    process and how to set up everything drove me to eagerly keep learning more and
    more, and even how to manage keeping everything up and reliable. But then the
    LLM Scrapers arrived.\n\nI looked at [Anubis](https://github.com/TecharoHQ/anubis)
    and decided I didn't want the delay loading for regular viewers, so moved to [iocaine](https://lowkey.party/iocaine-powder)
    which is slightly different in what it does, and that was fine until so many scrapers
    hit my site that it saturated my upload with generated content feeding the them.
    So I removed it, watched iftop - for not even very long - over a few evenings
    and noted a bunch of IP ranges owned by cloud companies and the likes of Meta(Facebook)
    who's servers have zero reason to hit my sites. Pretty sure no one is sharing
    links to my blog there. Also Azure, Alibaba... and a bunch of others.\n\nLarge
    cloud provider servers don't need to hit my website.\n\nI do realise that scrapers
    are also using residential IP ranges via SDK pitched to app developers that add
    backdoors to utilise the connection for \"other things\" (I cbf finding a link
    to put here but you can search for them if you want to get even more depressed
    about the state of the web), but most of the traffic was from a small number of
    large cloud allocated /16 IP ranges so I just dropped those in nftables.  \nI
    also added [nft-blackhole](https://github.com/tomasz-c/nft-blackhole) with what
    seems to be a few not overly zealous IP lists, and it seems to help a bit too.\n\n##
    So anyway, on to my point...\n\nPeople who check my photography site would have
    noticed I haven't updated it in a couple of years now. I have [talked about it
    a few years ago](https://lowkey.party/would-i-be-the-arsehole), but it is driving
    me to consider removing my photography website as it currently is, and just have
    links to sell physical zines per event.\n\nZero digital image uploads.\n\nThis
    is more work for me, but it really irks me how entitled the corporate scraping
    of the web has become just so they can sell back to us a poor imitation of creativity.
    \ \nI do not want my time spent on something that ends up feeding that machine.
    Yes I know they are now buying books and destroying them to feed it new data because
    the online pool it slurps up is now so muddied with LLM slop that it corrupts
    its own training data, but it seems unlikely they would buy some shitty zine from
    a local photographer in New Zealand - and I can monitor that.\n\nI watched a video
    recently where a bunch of devs said they miss the old web, when everyone had their
    own site. I can't see this being likely again with the amount of \"legal\" DDOS
    we have to put up with if we have a website hosted on our home server. You just
    can't be a casual tech enthusiast and have enough limiting/protection in place
    these days. A certain amount of knowledge and skill is required, unless you...
    pay another large corporate to be the CDN in front of it. And the amount of traffic
    I _should_ be getting means I very much dislike that answer.\n\nMaybe I will enjoy
    the zine/book-making process if I can streamline the process to a certain point.
    If I get something useful sorted, I will update here of course.\n\n### Sorry.\n\nThis
    is yet another post on the depressing reality of the current times and corporate
    tech over-reach.  \nBut maybe it will force me to make something that only exists
    in the physical world instead, so there is that for our silver lining.\n\n[I know
    I am not the only one feeling this way](https://lowkey.party/strategies-against-algorithms).\n\n[tech](/tag/tech),
    [AI](/tag/ai), [zine](/tag/zine), [self hosting](/tag/self-hosting), [photography](/tag/photography)\n\n[Reply
