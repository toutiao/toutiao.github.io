  text: "&gt; I looked at Anubis and decided I didn&#x27;t want the delay loading
    for regular viewers<p>There really isn’t that much of a delay, and once a visitor
    is confirmed, the rest of the site can still be zippy AF.<p>The downside with
    Anubis is that a properly-secured web browser will not be able to run its anti-AI
    code, and will fail. Not “you are a bot” fail, but “cannot run our checks” fail.<p>This
    is at a much more stringent level than CloudFlare’s maliciously invasive and user-hostile
    “protections”, so even fewer site visitors will be impacted, but can still be
    annoying to a privacy-oriented user."
