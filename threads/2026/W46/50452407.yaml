  author: StrictDabbler
  text: It&#x27;s literally and intentionally reductive, so I&#x27;m good with that,
    because these processes are reductive.<p>Have you ever read &quot;Stranger in
    a Strange Land&quot;?<p>The character of Jubal Harshaw is instructive. He&#x27;s
    become very rich because he can just unhook his brain and produce a tear-jerking
    and profitable story in a few seconds as he lounges around his pool.<p>He gives
    his secretaries the gist of the story, they fill it out, they arrange for somebody
    to make the film.<p>The point of the character is that what he&#x27;s doing takes
    no emotional effort or insight. He&#x27;s writing Hallmark movies. Everybody who&#x27;s
    working for him adds nothing to it.<p>And we have Hallmark&#x2F;Lifetime movies
    already. People were making them for decades before the LLMs came along.<p>But
    if you could send an LLM back to 1950 and train it on the pre-existing literature,
    you couldn&#x27;t have it generate The Shining, A Scanner Darkly, Piranesi, Perdido
    Street Station, The April Witch, or Starship Troopers.<p>-none of the research
    indicates a mechanism by which you can create a selfhood that gets banged around
    by time and has feelings about itself, but admittedly, that might change<p>-even
    if you could do such a thing, you can&#x27;t then put the robot in a human body
    and let it nurse and get potty trained and sent to pre-school and bullied and
    wonder about its mortality as it starts to think about what its career might be,
    etc etc etc<p>We were already making slop, because we already had a big production
    machine that transforms any input into a &quot;movie&quot; or &quot;a television
    show&quot;, and a lot of the inputs were garbage.<p>The movie &quot;A Talking
    Cat?&quot; exists and predates AI by about ten years.<p>The point is that we were
    already delegating this stuff to human beings who didn&#x27;t care about it and
    weren&#x27;t bringing their humanity to it. Nothing changes on that side of things
    except that they don&#x27;t have jobs to show up to.<p>So, at least <i>for now</i>,
    this isn&#x27;t very different from the previous way of doing things, except that
    it&#x27;s cheap enough that some people are spending a few thousand dollars to
    say &quot;make me a story about a sad orphan&quot; and the machine rips off Charles
    Dickens and Horatio Alger to make a thing nobody wants to watch without paying
    a bunch of key grips and best boys and caterers.
