  author: xnorswap
  text: 'I think AI is useful and fine for non-creative work. I don&#x27;t see programming
    as an especially creative work. It&#x27;s about translating as best we can, the
    design into execution.<p>There is a little more creativity the further up the
    architecture and design you go, but the lower level you go, the less creative
    it is. Indeed for decades we have handed off the mechanical conversion into machine
    code to deterministic compilers.<p>Programming is certainly a skilled practice,
    but it isn&#x27;t especially creative.  Given the same problem, many programmers
    would produce a similar output.<p>This is very different to creative work, where
    the same requirements can lead to vastly different results. The range of art that
    could be described, as &quot;Draw me the night&#x27;s sky&quot; is immense.<p>Generating
    assets, be that genAI, or procGen, takes away from the creative, and doubly so
    if you don&#x27;t have much of a filter on the output and just accept what is
    given.<p>Look at procGen: the worlds of No Man&#x27;s Sky have no soul to them.
    Compare that to the much lower and less detailed lands of Azeroth, which had so
    much soul that we&#x27;re still recreating and enjoying them 20+ years later.<p>Generative
    AI can trick us into thinking there is a soul and that something creative has
    happened when it hasn&#x27;t.  Programming has no such deception.<p>If you&#x27;re
    working with generation but then hand-filtering a million results back down to
    a hand-picked few, then there is a creative process once again, a curation that
    is itself an artistic process, so these things aren&#x27;t absolute, there are
    always grey areas all over.'
