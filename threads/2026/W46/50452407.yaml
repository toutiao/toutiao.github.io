  author: simonask
  text: 'For me, the dividing line is this question: Do you know what&#x27;s going
    on?<p>You see people brag about how &quot;they&quot; &quot;made&quot; something,
    with neither the qualifications nor the vision to motivate me to care. If I wanted
    vibecoded slop, I could just cut out the middle man, like everybody else with
    a Claude subscription.<p>But this stuff really does shine when competent people
    such as myself - an expert, gentleman, scholar, etc. - use it for things like
    exploring a new topic, rubberducking design ideas, diagnosing problems, and sometimes
    go the extra mile.<p>Software projects are full of incidental, boring stuff, and
    it makes a meaningful difference to be able to say to Claude things like &quot;please
    compare the performance of these 5 different approaches, and show me your notes&quot;.
    But just like a colleague, it has no clue what your actual intentions are unless
    you tell it, and you can&#x27;t communicate those intentions if you don&#x27;t
    know them yourself - and crucially, you can&#x27;t know them if you don&#x27;t
    have the expertise to know what you actually want.<p>This doesn&#x27;t feel like
    cheating at all, and I don&#x27;t relate to the choir of disillusioned programmers
    who feel demotivated by the introduction of LLMs in their workflow. I mean, maybe
    their work wasn&#x27;t all that interesting to begin with? I don&#x27;t know.
    I get that it sucks to feel replaceable.'
