  author: talmr
  text: Many have said things like “do you know what’s going on in your car while
    you’re driving?”<p>IMO, this is a wrong way of looking at things if the job is
    software engineer.<p>We aren’t the end user who is driving. They don’t need to
    know how the car works. It takes them to and from work or their kid’s sports event.<p>The
    engineer does need to know how the car works. Sure, there are specializations
    so someone working on one part of the car might not know how another part works.
    But, they know how these things work together, at least at a high level.<p>I’m
    noticing that without proper planning and architecture, these AIs go off the rails
    and introduce horrific complexities that are hard to diagnose and even harder
    to fix.<p>For some small app that nobody cares about besides me, I don’t really
    care about the internals much. I can have the agent churn and do fixes and updates.<p>For
    something larger that will have end users who rely on the software to work, I
    don’t think having the agents burning millions of tokens and many minutes on each
    task is a good way to work.<p>The strength of AI is that it can work across many
    files, reading and writing magnitudes faster than any human. Their weakness is
    that they need direction, otherwise the result is chaos.<p>I’ve tried various
    approaches and honestly, I’m back to spending time up front planning the system
    and doing a little bit of mixed (manual and AI assisted) coding to set the foundation.<p>A
    few days or even a week or two of focused writing concise documentation, with
    enough foundational code that shows how the system is architected, yields tremendous
    results down the road. Even the AI benefits from it because it knows exactly where,
    what, and how to change. Every system is unique, that last 10% that separates
    it from the generic recipe is what matters.<p>I am not saying that humans are
    perfect or that I’m some god-tier engineer. I know my limits, and as an AI enthusiast
    I have also realized where these tools have consistently fallen short. Unfortunately,
    we must realize that no system is perfect, and humans need to do boring work like
    planning and proper guardrails because chaos is easy.<p>Sorry for the long write
    up&#x2F;rant.
