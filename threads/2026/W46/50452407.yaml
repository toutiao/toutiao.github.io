  author: superultra
  text: This article hooked me when it mentioned Big Wall, because Big Walk is easily
    one of the best games I’ve played in years.<p>It sounds like this author’s argument
    is “AI in games sucks for lots of reason but mostly because it robs people of
    jobs.” I don’t disagree with that in theory but the real question is whether House
    House <i>would</i> have actually hired another human.<p>My guess is that they
    would’ve either delayed it more, or not known about the bugs and released it.
    They are purposefully small and bringing on even a freelancer introduces a lot
    of complexity and room for error. So too does AI but ultimately you control the
    output. You don’t have to worry about it being late, or it having a bad day.<p>If
    the end result of using AI is an artful, beautiful game like Big Wall, I’m all
    for it.<p>In my opinion the metric shouldn’t be whether AI was used, it should
    be whether the end result is *good*. I realize that’s subjective but I think we
    can objectively say Big Walk is a wonderful, artful game. When AI is used and
    the output is bad - as was the case, say, with those Coca Cola or McDonalds ads
    - that’s when we should question it.<p>When it’s being used for artwork or writing  -
    I also think that’s a valid argument against it because it is, as we all know,
    utilizing artwork and writing without consent.<p>Is that true for code? Maybe
    some code but we would all say, I think, it’s much looser around code than creative
    outputs like artwork and writing.<p>It sounds like House House used AI like a
    tool the same way they did whatever engines or coding tools they used.<p>The metric
    should be quality.
