  text: This exchange is missing something. Remember the bridge comparison? There
    are like 7 bridge designs total, and we&#x27;re always building the same ones.
    But software is very different per use case, and outsourcing software is more
    similar to outsourcing blueprint design, not building.<p>We never had a situation
    where we could outsource unique problem solving at all levels.<p>You say &quot;Putting
    software into those roles loses us nothing that is human.&quot; but you can have
    LLM produce design at all levels. I can&#x27;t think of anything LLM cannot replace
    humans with, except maybe physical labor, which requires good robotics precision,
    that we haven&#x27;t perfected yet.<p>The main part that&#x27;s missing however,
    is that the nature of linguistics (and the core to LLMs&#x27; success) is that
    LLMs are wiring together useful concepts that humans spent thousands of years
    polishing and relating to one another in speech.<p>Language has been the code
    behind all human thought, understanding, emotions, and innovation. It&#x27;s what
    enables LLMs to work. LLMs don&#x27;t _understand_ words, they connect them together
    usefully, which works because humans mapped useful composable words to useful
    composable concepts.<p>And if you think about how human thinking and consciousness
    is often attributed to language in the first place (not clear if we even would
    be conscious without language), a lot of human is being delegated.<p>I&#x27;m
    not sure what to do about it, but I find your kind of explanation incredibly reductive.
