  author: StrictDabbler
  text: This is perfectly expressed.<p>I was trained as an animator at one point.
    The process was to do the storyboards, layout, key drawings, map out the timings,
    slug out the dialog, and then send it off to a company in Korea that would in-between
    and produce the final product.<p>That Korean studio has been replaced by a machine.
    Fiscally, that is unpleasant for those animators, but they&#x27;re really talented
    and now they can also hire such a machine to implement their ideas if they want
    to.<p>Disney was doing this in 1930. In-betweeners and the ink-and-paint girls
    were the machine. Nasa was doing it in the late 40&#x27;s. Women were the computers.<p>Putting
    software into those roles loses us nothing that is human. As you say, all that
    matters is the output, not the input.<p>And if you want to do a project where
    you think the input is what will impress somebody, because you manually assembled
    50k bottlecaps, that&#x27;s still an available form. Sometimes that works and
    people care a little more because it was done directly.<p>All of this sort of
    already happened, dozens of times. Socks, knives, screws, engines, a million different
    things that used to be about mastery and are now about understanding.<p>Understanding
    is hard. Making that the requirement leaves a bunch of people behind. We&#x27;re
    going to have to figure out how to support them, we can&#x27;t keep having a society
    that depends on the moral value of work when work is unavailable, but as you say,
    there is no going back.
