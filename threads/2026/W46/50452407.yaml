  author: disillusionist
  text: My personal opinions on AI and AI usage in software development have fluctuated
    in the past year, especially as I&#x27;ve used it more in my professional work.
    As AI becomes more deeply embedded in the tools that I use, I struggle to identify
    a hard line on what &quot;Made with AI (tm)&quot; actually <i>means</i>. If I&#x27;m
    using it for refactoring work as basically a glorified &quot;find-and-replace&quot;
    or to help me track down the cause of tricky bugs through trace files, does that
    make my work &quot;made with AI&quot;? (I think &quot;yes it does&quot; and would
    follow up with &quot;but does it matter?&quot;) If I send an agent to complete
    a JIRA ticket on a system that I designed, read the diff, and approve the changes
    - does that invalidate my prior design and development work? (I think &quot;no&quot;.)
    If I use a website builder, a 3rd party library, or one more abstraction layer
    past what is currently acceptable, should that change how others or I feel about
    that project? I&#x27;m not really sure, but since I work on business software
    I don&#x27;t think my customers really care about how the sausage is made; they&#x27;re
    mostly looking for results.<p>I do, however, see a massive difference between
    &quot;AI as tools&quot; and &quot;AI as creative director&quot;. I agree with
    the mindset of &quot;I want to hear stories from humans&quot; and &quot;I want
    to experience creative expression from humans&quot;. But some of the current discussion
    feels like the arguments we had back in the day of whether Photoshop&#x2F;digital
    media&#x2F;video games were &quot;real art&quot; or not. If a human has creative
    vision and uses a robot stir-er to mix their paints, I don&#x27;t think that should
    invalidate their painting. We can still judge it, though.
