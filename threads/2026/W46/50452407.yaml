  author: Aurornis
  text: "&gt; It sounds like this author’s argument is “AI in games sucks for lots
    of reason but mostly because it robs people of jobs.”<p>I am very interested in
    discussing and reading about the impact of AI on the job market.<p>However, I
    think that topic deserves a separate discussion focused only on the broader economic
    story. When articles start blending every possible anti-AI angle into one generic
    critique it gets hard to separate the real difficulties from authors who don’t
    like the fact that the world is changing.<p>A common story I’m noticing is that
    established figures with comfortable positions are terrified of AI, while the
    newer, younger, less experienced entrants are more excited about what it can do
    for them. It makes sense: If you spent your career grinding your way up a skill
    and experience ladder you are naturally going to be resistant to anything that
    threatens your position in the hierarchy of the world. Having hard-earned skills
    and a history of having done the hard work was a moar for your career and reputation.<p>Now
    a lot, but not all, of those old skills is 80% achievable by a kid with a $20
    Claude plan. That moat you spent an entire career building became a lot less valuable
    for maintaining your position, and it happened suddenly over a couple years.<p>That’s
    why it’s difficult to interpret articles like this. It’s hard to separate out
    the valid critiques from the author’s own rationalization for their dislike of
    AI disruption."
