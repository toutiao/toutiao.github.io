  author: cloverich
  text: "&gt; Orchestrator takes a dynamic, bidirectional approach between Carbon
    and Gemini 4 Hydrogen within the evolution of a single trajectory. For example,
    Carbon can start in a read-only phase to explore dependencies, resolve ambiguities,
    and build a concrete plan with explicit re-planning triggers. Hydrogen could then
    take over to write edits, update packages, and run tests. If Hydrogen hits friction,
    it would hand back to Carbon to inspect the state, repair the plan, and resume
    execution. This allows Orchestrator to reach near-Carbon task success while being
    faster and more quota-efficient. On Terminal-Bench 4.1, Orchestrator reached near-Carbon
    task success rates while, on average, consuming 24% less quota and completing
    19% faster.<p>Is this now how e.g. Opus works now? I use Opus 5.5 on high for
    just about everything now, and my bill&#x27;s not gone up (gone down actually).
    I had assumed under the hood it was doing this (e.g. I&#x27;m sure its not literally
    Opus doing the log checking &#x2F; file searches). Towards Google&#x27;s choice,
    I&#x27;m skeptical introducing a new concept (Orchestrator) for this is really
    necessary, when they could have just done it by default, unless its plainly lower
    quality than pinning Carbon."
