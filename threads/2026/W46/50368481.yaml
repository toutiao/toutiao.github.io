  author: btown
  text: 'Oh, this is very, very cool, and very, very timely!<p>Paper here: <a href="https:&#x2F;&#x2F;declarative-dragging.github.io&#x2F;D2.pdf"
    rel="nofollow">https:&#x2F;&#x2F;declarative-dragging.github.io&#x2F;D2.pdf</a><p>IMO
    one of the remaining gaps of agentic coding is that it&#x27;s hard for even multimodal
    LLMs to check interactive motion effects for correctness and &quot;feel.&quot;
    Like, sure, they can take screenshots of a few snapshotted states, but in terms
    of how things react as underlying nodes move and (potentially) reflow. How do
    you QA the feel of moving your wrist rapidly in the context of nested zones?<p>The
    answer is that you avoid the need to: you have a (nearly-provably) <i>correct</i>
    foundation that ensures that behavior is predictable regardless of state, and
    just render accordingly.<p>The paper&#x27;s approach is incredible here: simultaneous
    optimistic rendering of multiple possible states, and a composable algebra (a
    small combinator language) over how drop zones and distance are derived - allowing
    for an extremely high-level interface in practice. Everything feels snappy and
    <i>right</i>, and the code you write is about as minimal as you can get - though
    the paper notes that state management is somewhat complex. But this seems solvable!<p>Once
    this is ported to HTML, it&#x27;ll become an incredible part of the modern dev
    toolkit. I&#x27;m very excited for what this means.'
