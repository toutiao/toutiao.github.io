  content: |-
    # Declarative Dragging

    [Joshua Horowitz](https://joshuahhh.com/), [Andrew Blinn](https://andrewblinn.com/), [Jeffrey Heer](https://homes.cs.washington.edu/~jheer/)

    ★ [Best Paper Award](https://uist.acm.org/2026/awards/#best-paper), UIST 2026

    What if making a diagram draggable was as simple as specifying what it can become?

    Drag-and-drop makes the digital graspable. But designing bespoke drag interactions involves a lot of fiddly code to handle geometry, feedback, and animations. As a result, many people, from educators to game designers, mathematicians to creative tool builders, often don't bother.

    **Declarative dragging** inverts the problem. Rather than programming all that visual behavior directly, you simply say, for each element you want to make draggable, which future states of your application dragging it should lead to. Our system speculatively renders those states to work out where things can go, then combines these possible worlds into a smooth, responsive drag-and-drop interaction.

    Our goal with this project is to let people keep working within the semantic worlds they inhabit, while helping them turn the rules of their worlds into rich tactile interactions in ours.

    [![Title card: Declarative Dragging, with illustrations labelled Model-Driven and Composable.](video-poster.webp)](https://www.youtube.com/watch?v=l7v-UwpsEbk)

    A five-minute video introducing declarative dragging.

    ## How it works

    D2 is _model-driven_: An interface author makes an element draggable by specifying which future model states should be accessible by dragging it. An engine speculatively renders these states to view trees, extracts the position of the dragged element in each of these renderings, and uses these to synthesize a drag-and-drop interaction, all without detailed work required by the interface author.

    ![Diagram: a model state is rendered to a view; when a drag starts, possible target states are rendered speculatively, and where the dragged element lands in each becomes a drop zone for an animated drag.](how-it-works-four.webp)
    _Dragology is a library implementing “declarative dragging”: a new way for interface developers to make
            higher-quality drag-and-drop interactions with less work. Dragology enables model-driven dragging._

    To provide greater expressive range and customizability, D2 is _composable_: simple model-driven drag-and-drop behaviors can be combined to create more complex ones, and modifiers can layer features like floating, snapping, and transitions. For more details, see [the paper](D2.pdf).

    ## Dragology demos

    We implemented D2 in a library called [Dragology](https://github.com/declarative-dragging/dragology), built for SVG interfaces on the web.

    [algebra](https://joshuahhh.com/dragology/#/demos/animate-algebra-tree)[twisted trees](https://joshuahhh.com/dragology/#/demos/twisted-trees)[bézier curve](https://joshuahhh.com/dragology/#/demos/bezier)[braid](https://joshuahhh.com/dragology/#/demos/braid-old)[card piles](https://joshuahhh.com/dragology/#/demos/card-piles)[face](https://joshuahhh.com/dragology/#/demos/face-creator)[trominoes](https://joshuahhh.com/dragology/#/demos/tromino)[sprouting tree](https://joshuahhh.com/dragology/#/demos/sprouting-tree)

    See our [demo gallery](https://joshuahhh.com/dragology/#/demos) for many more interactives built with Dragology.

    ## Where it came from

    > Back in 2022, I had a prototype of a game aimed at making math more tangible, a long-running obsession of mine. It had a lot going for it, but the fundamental mechanic, based on selecting transformations from a menu, lacked the juicy tactility I craved. I eventually came up with a primitive version of what would become model-driven dragging, but implementing it seemed daunting, so it sat on my whiteboard for the next two years, haunting me every time I went to make a sandwich.

    ![A whiteboard titled 'nool' covered in small algebraic expression trees, with arrows showing how each rewrite rule would be dragged, a section labelled CONFLICT, and a row labelled DISAMBIGUATION STAGE listing choice tree, overlap-click, default-drag and split-drag.](whiteboard-2023-06.webp)
    _Andrew's whiteboard in June 2023, sketching a basic version of model-driven dragging for tree rewriting._

    > On a really nice walk in Seattle back in 2023, Andrew shared his draggy ideas with me. I kept thinking about them over the years, but didn't do anything about it. And then last year, it all came together. My buddy Elliot was playing with order-preserving maps between trees. I came up with a fun way to draw these structures, but I realized I didn't just want to draw them – I wanted to reach in and pull them around, and feel out their dynamics (what became the twisted trees demo above). That felt pretty tough, until I remembered Andrew's ideas. I got working on a library that, with Andrew's help, grew into declarative dragging.

    ![A map of a walk through Capitol Hill in Seattle, its route in orange, with Josh's drawings of order-preserving maps between small trees laid over it: a hand-drawn lattice of trees with strands running between them, a computer-drawn version of the same lattice, and single trees cut from them.](walk/walk-figure.webp)
    _Our walk in Seattle in 2023, and Josh's later drawings of order-preserving maps between trees._

    ## Since the paper

    Josh has been working on a variety of new, more intricate mathematical explorables. We've found Dragology particularly suited to interfaces that combine parallel representations, where you see the same system from different perspectives. In the permutation lab below, interacting with any one representation fluidly updates the others, even halfway through a drag, showing their relationships in real time.

    _Parallel representations for permutations, updating in tandem.
              Permutation lab_

    Andrew has been working to bring declarative dragging to existing applications, including his research on user interfaces for programming languages, as well as restarting work on the math game concept that kicked it all off.

    _Hazel is an academic programming environment where every edit keeps your
                code meaningful. Using declarative dragging, refactorings become tangible and discoverable._

    _Not long after submitting the paper, Andrew began working on his math game
                again, adapting declarative dragging to the gamepad and moving off the 2D canvas into a 3D world._

