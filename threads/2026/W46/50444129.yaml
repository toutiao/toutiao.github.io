  author: briffle
  text: I often work from campsites. I no longer have to rely on if there is 4&#x2F;5G
    signal, and can borrow a family members Mini (and pay for a month of service).<p>That
    means I can now head out on Wednesday after work, drive 3-5 hours to the middle
    of no-where, and work Thursday and Friday.  But each of those days, I am able
    to be done working and then at a camping site with my family. Go on hikes, fish,
    swim, etc.<p>So now my whole family can enjoy being in the wild, and I don&#x27;t
    have to burn up vacation days. And we don&#x27;t have to try to jam it all into
    a weekend were you feel like your just travelling the whole time.<p>Side note..
    Having no signal on the west coast can actually be extremely dangerous, with how
    fast some wild-fires have spread.  You can have one 10 miles away and not know
    it with the wind blowing the other way, and if it shifts direction, you can have
    a very limited time and path to get away.<p>Being able to check tools like WatchDuty
    and weather reports from the middle of nowhere is a safety feature.
