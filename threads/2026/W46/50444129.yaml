  author: macNchz
  text: 'A lot of folks here making arguments for safety and convenience, but ultimately
    for me the issue is around what I might call &quot;plausibility of unreachableness&quot;:
    basically whether being genuinely offline and unreachable is normal and socially
    expected when you&#x27;re doing certain activities, the number of which has dwindled
    over time.<p>It&#x27;s obviously possible to <i>say</i> &quot;I&#x27;m going to
    be unreachable&quot;, but people don&#x27;t really like that, and it becomes a
    push-pull unless you&#x27;re doing something where you genuinely have no service
    or connection. For a long time, being on an airplane allowed this sort of ability
    to disconnect: even if there were $5&#x2F;minute in-seat phones, nobody reasonably
    expected to be able to reach you if you said you&#x27;d be on a flight. A few
    hours where you could fully tune out the noise of the world, no questions asked.<p>Wilderness
    backpacking trips have maintained this sort of unreachableness fairly well–I&#x27;ve
    had a Garmin inReach for years, and used it to keep family apprised of our movements,
    and once to coordinate a fairly serious situation where a large wildfire kicked
    up near our exit, but ultimately the slow messaging and short length limits prevent
    any real communication. Cell phones have also started getting satellite functionality,
    but it doesn&#x27;t work very well, yet, at least as far as I&#x27;ve seen.<p>I
    see this march towards internet everywhere all the time as ultimately leading
    to expectations of connectivity, even in the most remote places–then &quot;will
    you have made camp by 6pm on Tuesday? If so can you join this quick call?&quot;
    becomes a real question people feel entitled to ask, notifications start coming
    through when you turn it on to check the weather, &quot;I&#x27;m going back to
    my tent to check a few emails before bed&quot; might be something you hear around
    the campfire...'
  score: 0
