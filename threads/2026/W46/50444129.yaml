  author: annzabelle
  text: I do a fair bit of wilderness backpacking, and I always put my phone on airplane
    mode as soon as I walk into the woods, and take it off airplane mode when I get
    back to civilization. No Garmin InReach, but I do have a PLB for safety (here
    in NZ land SAR advises everybody who is in the backcountry to carry a PLB), but
    it has no functionality beyond &quot;press this in case of emergency.&quot;<p>I
    once had a hiking partner on a classic hut to hut hike on the north island (Tongariro
    Northern Circuit, it&#x27;s where they filmed mount doom and mordor) who walked
    out of the hut at night to find a ridge to get service to do a job interview with
    a company in the UK.<p>The disconnection from real life is a huge part of why
    I like to wander off into the woods, and I pray that I will never be expected
    to have internet in these remote places.
