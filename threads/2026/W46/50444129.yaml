  author: annzabelle
  text: Agreed. I live in NZ where the rule of thumb is to keep a PLB on your person
    at all times and time from pulling the PLB to having a SAR helicopter overhead
    can be as low as two hours (it can be significantly longer depending on weather).<p>Most
    people I know who spend significant time outdoors here have one and keep it on
    our person whenever we&#x27;re on something more intense than a well marked day
    hike. This is true of everybody I know from those of us who do 2-3 night backpacking
    trips between marked campsites to backcountry skiing to mountaineering. It&#x27;s
    one of the first things that is advised to tourists here is to borrow one from
    a gear shop or visitor centre before going into the backcountry.<p>Here at least
    it is viewed as common sense safety on the same level as carrying layers and water.
