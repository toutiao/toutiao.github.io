  author: apublicfrog
  text: We introduced &quot;Right to disconnect&quot; laws in Australia years ago:<p>&gt;
    Employees have the right to refuse contact outside their working hours unless
    that refusal is unreasonable. This means an employee can refuse to monitor, read
    or respond to contact from an employer or a third party.<p>We don&#x27;t have
    &quot;at-will employment&quot;, so you can&#x27;t be fired for arbitrary reasons.
    And if you were to treat someone poorly or fire them for refusing to be available
    for free after hours, you would end up in serious trouble in front of the Fair
    Work Commission.<p>This is the main value of governments, have them regulate these
    things for your protection!
