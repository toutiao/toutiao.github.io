  author: SequoiaHope
  text: The other day I sat on a bench at sunset at Albany Bulb and watched as San
    Francisco slowly turned on the lights and day gave way to night. After some photography
    and quiet moments with the view, I took a few minutes to test the latest rev of
    my mobile webapp. Then I used voice mode to give feedback to my coding agent,
    and it started working up fixes. I looked up from the phone and was struck with
    the beauty of the view once again.<p>Products like Apple Vision Pro promised working
    on productivity apps with beautiful views of Yosemite displayed behind the virtual
    computer screens. But now with a cell phone and voice mode (I don’t have starlink
    but I have enjoyed it in the past), I can work on my app while I’m taking a break
    in the middle of a bike ride.<p>I often say I love the work that I do but I don’t
    like being at the computer. Specifically that the best work I’ve done is sitting
    at a desktop in one place for hours at a day for years on end. To me, things like
    voice mode on mobile is a revelation. I long dreamed of doing productive work
    on the go, and this is a way I can do that. I’m not sure I want starlink personally,
    but I can certainly see the appeal of setting up at a park and getting a few hours
    of work done before putting it all away and doing a hike to the summit.
