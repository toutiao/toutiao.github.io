  author: mmooss
  text: For me also, and for camping, it&#x27;s not just for disconnection from work,
    etc.<p>There&#x27;s a very different psychology when you&#x27;re completely self-reliant,
    with no communication with civilization. It&#x27;s hard to express precisely,
    but it&#x27;s powerfully liberating and a much more immersive alternative from
    everyday civilization. The door is shut on other options for a few days, at least.<p>(Yes,
    there&#x27;s risk - though that can be greatly overemphasized and there&#x27;s
    risk in everything - and you need to rely on yourself (and your group) to mitigate
    those risks and respond effectively to them, not on others. One leading trainer
    I read said that, once you&#x27;re out of harm&#x27;s way, the first thing is
    think. Nothing is going to happen immediately; the ambulance isn&#x27;t going
    to be there in 5 minutes; the doctors won&#x27;t see you for days, at least.)<p>The
    risk isn&#x27;t the focus. It&#x27;s just you and world around you.<p>Not everyone
    can do that - they have responsibilities they can&#x27;t turn off, they have health
    challenges, they may want a compromise, like one of those emergency pager devices.
    I&#x27;m saying the effect of actually being disconnected is real, powerful, and
    valuable.
