    cycles (which keeps your old setup as much as is practical)). It works for them,
    has less bloat that they might not need, can be easier to debug, and they know
    it well, …, though isn&#x27;t as well-supported any more with some packages that
    provide services just defining systemd jobs and you have to work out an alternative
    yourself. Debian even includes other init systems (like the one from Gentoo) -
    there is more than systemd out there if you want to try something different. Some
    people would still prefer upstart, which Ubuntu used for some time before moving
    to systemd.<p>I&#x27;d prefer to keep the older sysvinit init scripts, with all
    logs just going to text files rather than the systemd journal, but not so much
    that I make the effort to “fight” to keep things running that way on new installations.
    A lot of stuff still works the old way anyway (journal logs being mirrored to
    files in &#x2F;var&#x2F;log, init-like scripts in &#x2F;etc&#x2F;init.d calling
    systemd parts to mimic what the script on its own would have done previously so
    you can still `&#x2F;etc&#x2F;init.d&#x2F;apache reload` or such).
