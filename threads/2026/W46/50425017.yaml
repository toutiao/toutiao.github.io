  author: bayindirh
  text: The definition of my and your ages might differ a little. I have used many
    things which have came before systemd and did a lot of work on them. As a result,
    I have seen and experienced a lot of fail-modes of both systemd and others which
    came before.<p>One of the most important feature of prior tools were transparency.
    Since they were single-purpose tools written with UNIX philosophy in mind, they
    were simpler, more robust and has less fail-modes. Systemd is pretty opaque and
    non-deterministic in that regard. This is not a &quot;old man yells at cloud&quot;
    stuff. You can&#x27;t trust to a piece of code you can&#x27;t trace and debug.
    Systemd makes it almost impossible with all the intertwined gears and IPC layers
    it has.<p>On the &quot;I didn&#x27;t have any problems&quot; with it side. It
    might be working on your system, for your use case. It might not show its bugs
    on a system with a 90-day average uptime. I don&#x27;t live on that world. I manage
    way more systems with way more different, niche, interesting hardware and software
    than that, and this tends to surface edge cases and where things break.<p>On the
    &quot;do you run systemd?&quot; part, yes I run it. On <i>many, many</i> machines
    7&#x2F;24&#x2F;365.<p>It&#x27;s easy to say &quot;Why do you even run it, it&#x27;s
    Linux, just distro-hop&quot;, when you have a single system. I don&#x27;t. Projects,
    software has requirements, compatibility targets, etc. Also, considering the hardware
    we run, it&#x27;s not that simple either.<p>Lastly, I run Debian personally since
    version 3. We use other distributions alongside Debian in our datacenter. I&#x27;m
    very involved and rooted in these systems, and Debian feels like home after using,
    contributing, and developing derivatives on top of that.<p>...and how systemd
    has been forced into systems is another story. I have been there, watched that,
    so, errm, it&#x27;s not all voluntary, peaceful and friendly, to put it kindly.
