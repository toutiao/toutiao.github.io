  author: jeroenhd
  text: 'You can `systemd-analyze` to check what&#x27;s holding you back (specifically:
    `sudo systemd-analyze critical-chain` for the slowest part, `sudo systemd-analyze
    plot &gt; &#x2F;tmp&#x2F;analyze.svg` to get detailed graphs which help you skip
    over parallel boot).<p>For me, it&#x27;s decrypting the FDE partition (Grub has
    a slower encryption routine than cryptsetup, which determines round number on
    &quot;how many rounds can we do in X seconds&quot;), followed by Linux decrypting
    the swap partition (takes 2 whole seconds) followed by NetworkManager waiting
    several seconds to discover networks before resuming boot services.<p>With the
    right setup, you can boot Linux in (dozens of) milliseconds. You&#x27;ll have
    to throw out all subsystems you don&#x27;t need, compile and configure all drivers
    you do need, and preferably skip the initramfs step. Doable, but not very practical,
    because you&#x27;ll need to recompile the kernel for every update or boot reconfiguration.'
  score: 0
