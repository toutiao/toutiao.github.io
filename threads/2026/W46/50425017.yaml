  author: bayindirh
  text: The problem is, these parts sometimes are forced upon you, creating rugpulls.
    You update your system, and tada! something has changed without you even notice,
    and that might be something you have relied on for a decade or more.<p>Learning
    new things is not a problem, but now I have to adapt into that thing and it might
    not even perform the same, and a fallback might not be possible. Opening a great
    can of worms you didn&#x27;t want in the most unpleasant time.<p>One of the problems
    with integrated solutions is how much glue code they contain to handle these interactions.
    KISS tools talk over sockets, via very simple protocols. i.e. they shout each
    other over mountains using well defined horns and the voices they use are distinct
    and simple. Less glue code, simpler codebases, more robust tools.<p>KISS, Everything
    is a File, Send conservatively but receive generously are three pillars of what
    makes *NIXen robust systems. If that interconnectedness and meshing of things
    were robust, we wouldn&#x27;t have made Windows a laughing stock for its crashes
    and security problems.<p>Tell me, how can a WMF or cursor file can infiltrate
    a whole OS? How can not you print without installing half of the desktop or literally
    can&#x27;t have a terminal only Windows Server system? Because everything is connected
    and they can&#x27;t be separated anymore.<p>These &quot;tools thrown together
    in a bucket in haphazard manner&quot; have kept systems running for literal years
    between reboots because they talked over these simple sockets. Heck, many good
