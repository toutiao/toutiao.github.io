    shy away from shipping very early and unstable versions of it. That had me hopping
    for alternative DEs, I seriously tried several (and stuck for a while with some)
    of the minimalistic ones (enlightenment, XFCE, ...) and quickly ended up depending
    on either KWin, and&#x2F;or some battery&#x2F;networking&#x2F;disks applet from
    plasma, or configuring something via systemsettings. The plasma desktop itself
    is fine (I don&#x27;t mind it so much, I&#x27;m not crazy about shell theming
    and customisations, I do love my global menu on top, though), but what sells KDE
    for me is all the clever ancillary stuff that makes it &quot;smart and usable&quot;
    (dealing with Bluetooth, network setup, local and remote drives, audio output,
    ...), that&#x27;s where the &quot;environment&quot; metaphor kicks in and elevates
    the experience above that of a &quot;desktop shell&quot;.
