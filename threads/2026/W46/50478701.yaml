  author: thesz
  text: 'From the article: &quot;The findings reveal three recurring patterns of misplaced
    trust in unsafe code: <i>trusting code not to panic,</i> trusting user-provided
    implementations to be correct, and trusting the underlying system.&quot;<p>The
    call to &quot;panic&quot; is an effect and can be checked at compile time. Haskell
    does this with MonadError class, marking up code that may throw.<p>Rust has Turing
    complete type system for years and still does not have effects of any kind.<p>To
    be fair, &quot;trusting user provided implementation&quot; is also has something
    to do with effects. Proper type system would require user-provided implementation
    to use only certain effects and nothing else.<p>So two of of found shortcomings
    are directly related to the type system and, specifically, to the choice of original
    Rust implementors to not to distinguish between pure and effectful computations.<p>Do
    Rust implementors highly competent? Yes, of course! They work on Turing complete
    type system. Will they eliminate two of three recurring patterns? I strongly doubts
    so. It is a design decision and these are especially hard to change. Changing
    it will also break all Rust source code produced to that point of time.<p>Is it
    a scandalous situation? For me, it is. The situation is so dire, actually, that
    &quot;highly competent people working&quot; has to be defended with trivially
    true fact that &quot;bugs exist in complex software no matter how hard you try,&quot;
    instead of addressing core problem.'
