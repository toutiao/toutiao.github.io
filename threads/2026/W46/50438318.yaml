  author: dofm
  text: 'An LLM can&#x27;t have intuition itself.<p>It can only simulate the <i>written
    outcomes of intuition</i> in its training set.<p>For sure, some of those written
    outcomes are a good guide to reaching the outcomes of intuition.<p>But the likely
    uncloseable gap is that some intution is unspoken, literally <i>felt</i> by the
    brain&#x27;s default mode network and by parts of the prefrontal cortex.<p>LLMs
    basically never shower, do the washing up, kick their foot in the dirt while sitting
    on a park bench with a coffee: the domain of the default mode network. And they
    never sit frustrated looking at things, guided by their long experience, with
    the itchy brain feeling that there is a solution before they can even say the
    words.<p>A lot of this stuff happens to us deep down, way outside of the reach
    of words. And as a result, some aspects of intuitions are just never described
    in words.'
