  author: Topfi
  text: I do agree with some parts but not others. Reverting a flawed changed, e.g.
    should have never been as difficult as I have seen it been in some orgs before
    the advent of LLMs. Same for poor UX landing, both are issues that sure, may be
    thrown into sharper relief now, but were issues in some code bases and not others
    and remain that way today. More over, they are issues which can be permanently
    addressed in the former and in the later are one of the key sources of differentiation
    today.<p>On code readability, shallow tests and general quality, I can agree emphatically,
    though not universally. In other words, there are models which write the densest,
    hardest (for me) to parse code and tests that break with the lowest load&#x2F;timing
    deviations yet proof less than nothing.<p>These do that regardless of how much
    one ships in my experience however so I wouldn’t attribute this to the velocity
    and more poor data at the heart.<p>I know this reads a bit like “you are using
    the wrong model” and I understand if someone testing e.g. an OpenAI models understandably
    extrapolates across all models and considers poor parse-ability in code a likely
    result of velocity, but you can always step back and work slower, plus, for what
    it’s worth, I struggle to parse OpenAI code when running their models through
    my evals after step 7 which is still a fairly measured in scope code base.<p>Essentially,
    I have seen LLMs, even the newest frontier, produce barely legible slop when building
    simple CRUD and I have seen a massive rewrite of the existing Firefox code base
    using APZ to enable an infinite canvas of browser tiles grow in a manner where,
    even at this stage having replaced a lot outside Places and Gecko, I can walk
    through changes made and explain the logic, as well as look at any part I haven’t
    been in for a while and find my bearing even without assistance.<p>Whatever model
    you use, however much you trust it, if you can get a grip and explain what something
    does, that puts you in great shape. It also, for what it’s worth, helps future
    changes by better models to land with higher token efficiency and accuracy. I
    have put Opus 5.5 into a GPT-6 Astra written code base and it could land features,
    but the rework the model did along the way was eye opening. I then repeated, explicitly
    enforcing no changes beyond the initial scope which Opus 5.5 still could succeed
    in, but took far longer, far more tool calls and significantly more tokens then
    that change should have taken. I also have examples where any model can be more
    error prone and slower than myself, though those are unique and I myself have
    been told I was using the wrong model and sucked at prompting.<p>Use models like
    any tech if you want for what you feel comfortable for or don’t, both can yield
    good or bad outcomes. I was and still am an enthusiastic Flutter&#x2F;Dart dev,
    which with pub.dev meant I drew in a lot of external packages of dubious quality
    and compatibility, that I never read. LLM output, I do read and can go beyond
    my manual contributions in understanding because of it. Doesn’t mean model use
    doesn’t enable me to do more. Code was, for me, always a means to an end, enabling
    something. That hasn’t changed and never needed more LOC or massive scope.
