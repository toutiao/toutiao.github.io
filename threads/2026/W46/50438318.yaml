  text: 'Imagine a junior engineer in the same position: they write shallow tests,
    they write overly complex code.<p>What do you do? You provide guidance, support
    and tooling so they can write better tests and code. You supervise and help them
    meet the standard. It is the same with AI agents (including the challenge of how
    to carry that knowledge around and transfer it). You are responsible.<p>You are
    <i>also</i> responsible for the understanding part: know what is being worked
    on, glance at changes, inspect the outcomes, cross-check specifications, tests,
    product requirements. The &#x27;moving too quickly&#x27; idea is the other side
    of the same coin; it is your responsibility to keep track of things and decide
    what&#x27;s worth intervention. The exact same thing happens in a project where
    you have ten developers (or 200) working together — you cannot possibly read all
    of the code they write.<p>Seeing all of these as downsides is a choice.'
