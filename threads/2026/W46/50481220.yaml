  text: My point is that your &quot;outsourcing to a compiler&quot; analogy does not
    make sense. And that running a hosted, <i>proprietary</i> LLM is not the same
    as &quot;running a script in a remote server&quot;.<p>The whole &quot;AI is a
    tool&quot; argument only works if the &quot;tool&quot; is a commodity that is
    universally available and still exists even if the tool manufacturer disappears.
    Open-weights, locally hosted LLMs fit this criteria. Anything that depends on
    a cloud provider does not.
