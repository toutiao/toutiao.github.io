  content: "[Read in English](#)[Edit](https://github.com/dotnet/docs/blob/main/docs/core/whats-new/dotnet-11/runtime.md)\n*
    * *\n\n* * *\n\nNote\n\nAccess to this page requires authorization. You can try
    [signing in](#) or changing directories.\n\nAccess to this page requires authorization.
    You can try changing directories.\n\n# What's new in the .NET 11 runtime\n\nThis
    article describes new features in the .NET runtime for .NET 11. It was last updated
    for release candidate 2 (RC 2).\n\n## Updated minimum hardware requirements\n\nThe
    minimum hardware requirements for .NET 11 have been updated to require more modern
    instruction sets on both x86/x64 and Arm64 architectures. Additionally, the ReadyToRun
    (R2R) compilation targets have been updated to take advantage of newer hardware
    capabilities.\n\n### Arm64 requirements\n\nFor Apple, there's no change to the
    minimum hardware or the ReadyToRun target. The Apple M1 chips are approximately
    equivalent to `armv8.5-a` and provide support for at least the `AdvSimd` (NEON),
    `CRC`, `DOTPROD`, `LSE`, `RCPC`, `RCPC2`, and `RDMA` instruction sets.\n\nFor
    Linux, there's no change to the minimum hardware. .NET continues to support devices
    such as Raspberry Pi that might only provide support for the `AdvSimd` instruction
    set. The ReadyToRun target has been updated to include the `LSE` instruction set,
    which might result in additional jitting overhead if you launch an application.\n\nFor
    Windows, the baseline is updated to require the `LSE` instruction set. This is
    [required by Windows 11](/en-us/windows-hardware/design/minimum/minimum-hardware-requirements-overview)
    and by [all Arm64 CPUs officially supported by Windows 10](/en-us/windows-hardware/design/minimum/windows-processor-requirements).
    Additionally, it's inline with the Arm SBSA (Server Base System Architecture)
    requirements. The ReadyToRun target has been updated to be `armv8.2-a + RCPC`,
    which provides support for at least `AdvSimd`, `CRC`, `LSE`, `RCPC`, and `RDMA`,
    and covers the majority of hardware officially supported.\n\n| OS | Previous JIT/AOT
    minimum | New JIT/AOT minimum | Previous R2R target | New R2R target |\n| ---
    | --- | --- | --- | --- |\n| Apple | Apple M1 | (No change) | Apple M1 | (No change)
    |\n| Linux | armv8.0-a | (No change) | armv8.0-a | armv8.0-a + LSE |\n| Windows
    | armv8.0-a | armv8.0-a + LSE | armv8.0-a | armv8.2-a + RCPC |\n\n### x86/x64
    requirements\n\nFor all three operating systems (Apple, Linux, and Windows), the
    baseline is updated from `x86-64-v1` to `x86-64-v2`. This changes the hardware
    from only guaranteeing `CMOV`, `CX8`, `SSE`, and `SSE2` to also guaranteeing `CX16`,
    `POPCNT`, `SSE3`, `SSSE3`, `SSE4.1`, and `SSE4.2`. This guarantee is required
    by Windows 11 and by all x86/x64 CPUs officially supported on Windows 10. It includes
    all chips still officially supported by Intel and AMD, with the last older chips
    having gone out of support around 2013.\n\nThe ReadyToRun target has been updated
    to `x86-64-v3` for Windows and Linux, which additionally includes the `AVX`, `AVX2`,
    `BMI1`, `BMI2`, `F16C`, `FMA`, `LZCNT`, and `MOVBE` instruction sets. The ReadyToRun
    target for Apple remains unchanged.\n\n| OS | Previous JIT/AOT minimum | New JIT/AOT
    minimum | Previous R2R target | New R2R target |\n| --- | --- | --- | --- | ---
    |\n| Apple | x86-64-v1 | x86-64-v2 | x86-64-v2 | (No change) |\n| Linux | x86-64-v1
    | x86-64-v2 | x86-64-v2 | x86-64-v3 |\n| Windows | x86-64-v1 | x86-64-v2 | x86-64-v2
    | x86-64-v3 |\n\n### Impact\n\nStarting with .NET 11, .NET fails to run on older
    hardware and might print a message similar to the following:\n\n> The current
    CPU is missing one or more of the baseline instruction sets.\n\nFor [ReadyToRun](../../deploying/ready-to-run)-capable
    assemblies, there might be additional startup overhead on some supported hardware
    that doesn't meet the expected support for a typical device.\n\n### Reason for
    change\n\n.NET supports a broad range of hardware, often above and beyond the
    minimum hardware requirements put in place by the underlying operating system.
    This support adds significant complexity to the codebase, particularly for much
    older hardware that's unlikely to still be in use. Additionally, it defines a
    \"lowest common denominator\" that AOT targets must default to, which can, in
    some scenarios, lead to reduced performance.\n\nThe update to the minimum baseline
    was made to reduce the maintenance complexity of the codebase and to better align
    with the documented (and often enforced) hardware requirements of the underlying
    operating system.\n\nFor more information, see [Minimum hardware requirements
    updated](../../compatibility/jit/11/minimum-hardware-requirements).\n\n## Runtime
    Async\n\n.NET 11 introduces runtime-native async (Runtime Async V2), a significant
    step toward replacing compiler-generated async state machines with runtime-managed
    suspension and resumption. Instead of the compiler emitting state-machine classes,
    the runtime itself tracks async execution, producing cleaner stack traces, better
    debuggability, and lower overhead.\n\nRuntime Async is a preview feature. To opt
    in, add the following property to your project file:\n\n    <PropertyGroup>\n
    \     <Features>runtime-async=on</Features>\n    </PropertyGroup>\n\nA `net11.0`
    project no longer requires `<EnablePreviewFeatures>true</EnablePreviewFeatures>`
    to use Runtime Async.\n\nThe .NET runtime libraries themselves are compiled with
    `runtime-async=on`. The runtime libraries no longer contain compiler-generated
    state machines and rely entirely on runtime-provided async. This makes it possible
    to migrate an entire app (with only library dependencies) to the new model, and
    it provides broad functional and performance validation of the feature. The product
    team welcomes any reports—positive or negative—about throughput and library size
    changes you observe.\n\n.NET 11 also includes two additional improvements:\n\n-
    **Covariant `Task` → `Task<T>` overrides:** When a derived class returns `Task<T>`
    for a base method that returns `Task`, the runtime now generates a void-returning
    thunk that bridges the calling convention difference, so virtual dispatch works
    for both flavors. The same fix applies to NativeAOT.\n- **Inlining in crossgen2:**
    Restrictions that prevented runtime-async methods from being inlined during ReadyToRun
    (R2R) compilation have been removed. All async tests pass with both crossgen2
    and composite R2R, and inlining of await-less async calls (the synchronous fast
    path) is confirmed end-to-end.\n\nNote\n\nThe `DOTNET_RuntimeAsync` and `UNSUPPORTED_RuntimeAsync`
    environment variables that previously controlled runtime-async behavior have been
    removed. To opt out of runtime-async per project, set `<UseRuntimeAsync>false</UseRuntimeAsync>`
    in your project file instead of relying on the environment variable.\n\n### Cleaner
    live stack traces\n\nThe most visible improvement is in _live stack traces_—what
    profilers, debuggers, and `new StackTrace()` see during execution. With compiler-generated
    async, each async method produces multiple frames from state-machine infrastructure.
    With Runtime Async, the actual methods appear directly on the call stack.\n\n
    \   // To enable runtime async, add the following to your .csproj:\n    // <Features>runtime-async=on</Features>\n
    \   \n    await OuterAsync();\n    \n    static async Task OuterAsync()\n    {\n
    \       await Task.CompletedTask;\n        await MiddleAsync();\n    }\n    \n
    \   static async Task MiddleAsync()\n    {\n        await Task.CompletedTask;\n
    \       await InnerAsync();\n    }\n    \n    static async Task InnerAsync()\n
    \   {\n        await Task.CompletedTask;\n        Console.WriteLine(new StackTrace(fNeedFileInfo:
    true));\n    }\n\n**Without `runtime-async`—13 frames, state-machine infrastructure
    visible:**\n\n    at Program.<<Main>$>g__InnerAsync|0_2() in Program.cs:line 24\n
    \      at System.Runtime.CompilerServices.AsyncMethodBuilderCore.Start[TStateMachine](...)\n
    \      at Program.<<Main>$>g__InnerAsync|0_2()\n       at Program.<<Main>$>g__MiddleAsync|0_1()
    in Program.cs:line 14\n       at System.Runtim"
