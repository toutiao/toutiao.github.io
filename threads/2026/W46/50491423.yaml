  text: Nothing really - Ghostty has a bit of padding that&#x27;s unused per cell
    - 16 bits. The implementation stores an ID into a lookup table with border combinations.
    If all of those were used and never cleaned up, 65535 at around 100 for each combination
    used, order of magnitude 25MB absolute worst case assuming no real optimization
    in place for this.
