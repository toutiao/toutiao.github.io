  author: favori995749721
  text: 'One benefit worth calling out: the box-drawing fallback is worse than it
    looks for CJK users. U+2500-257F and the half&#x2F;full block elements are East
    Asian &quot;Ambiguous&quot; in UAX #11, so in a terminal configured to render
    ambiguous as double width (xterm&#x27;s cjkWidth, iTerm2&#x27;s checkbox) every
    line glyph takes two cells and the whole frame lands in the wrong place. Cell
    borders aren&#x27;t text, so that failure class just disappears.<p>The part I&#x27;d
    want specced early: borders are per-cell, but cells aren&#x27;t per-grapheme.
    A CJK char owns two cells plus a continuation placeholder, and combining marks
    or ZWJ emoji sequences own zero-or-more depending on whose wcwidth table you ask,
    so app and terminal routinely disagree across Unicode versions. Today that shows
    up as a vertical bar one column off; with cell borders it becomes a line that
    stops short of the corner. Does the border attach to the cell or to the grapheme
    cluster?'
