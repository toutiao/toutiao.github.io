  text: 'A pet peeve of mine is that most people &#x2F; WM get &quot;useless gaps&quot;
    wrong. You do want a gap between two terminals because otherwise there are times
    where things can get <i>really</i> confusing (where you don&#x27;t know what belong
    to which terminal &#x2F; window).<p>So the &quot;borderless&quot; (0 pixels) &#x2F;
    zero &quot;useless gaps&quot; simply are confusing and... Wrong.<p>But then people
    who do use useless gap, as in TFA, get it wrong too: they typically add gaps near
    the monitor&#x27;s edges.<p>Yeah. But no. Sorry but my monitor&#x27;s edge is
    a perfectly fine gap. I don&#x27;t risk mistaking it for anything.<p>So I modified
    my WM (the Awesome WM) to do proper &quot;useless gaps&quot; computation and remove
    the ones that really <i>are</i> useless: and that&#x27;d be those near the monitor&#x27;s
    physical border.<p>I mean: nearly everybody gets it wrong, but it&#x27;s not complicated
    to get it right, is it?<p>P.S: even the terminology is wrong... People calling
    those &quot;useless gaps&quot; haven&#x27;t got a clue: they are useful. The only
    useless ones are the one on the monitor&#x27;s edge (if your monitor has physical
    edges, which it probably does).'
