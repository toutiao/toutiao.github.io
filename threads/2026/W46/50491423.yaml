  author: joshka
  text: Yep,and I want to do that too :)<p>I&#x27;ve written about it before, but
    in brief the mountain of standards is worth ripping out wholesale and doing write
    as a semantic protocol. It&#x27;s needed to solve several things that work really
    poorly in terminals because their unit of compatibility is cells rather than a
    higher primitive. It&#x27;s hard to bake something on top that works well.<p>The
    need is most strong in Accessibility, Text wrapping, Scrollback handling (i.e.
    making the scrollback editable and not dead text), and various other bits that
    make writing highly functional TUIs. Coding agents tend to find all those edge
    cases.<p>This often gets push back that it&#x27;s easy, to which I can point nay
    sayers at the various many months long issues on things in Codex, Gemini, Claude
    etc. on flickering, scrolling, key handline, IME, ... doing anything moderately
    complex involves modeling a terminal in a terminal app effectively.<p>Ghostty
    and Rex sort of do the opposite bit. If you think of  it like a stack, they write
    a new layer underneath that transports the cells on a better multiplexer layer
    0. I think a new semantic layer 2 is an approach that would be neat to work with.
  score: 0
