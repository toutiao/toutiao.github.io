    in partnership with IEEE Xplore._\n\nCERN’s [Large Hadron Collider](https://spectrum.ieee.org/lhc-radiation-chip)
    (LHC) uses extremely strong magnets to collide particles at nearly the speed of
    light, breaking them up into smaller components for study. The LHC is already
    capable of slamming about 60 particles together 40 million times per second in
    a single experiment, which has led to some of the [most important particle physics
    discoveries](https://spectrum.ieee.org/higgs-boson-unmasked-by-worlds-biggest-test-instruments)
    of the century.\n\nBut scientists at [CERN](https://spectrum.ieee.org/tag/cern)
