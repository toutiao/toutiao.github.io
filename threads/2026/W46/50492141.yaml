  author: bcherny
  text: 'Boris from the team here. Projects are how I write pretty much all my code
    these days. Happy to answer any questions.<p>The motivation for building the new
    coordinator is: as people get more comfortable using Claude Code, we noticed they
    start running more agents in parallel — Claude works, so you start another thread
    to work on the next thing. As the model gets smarter and more token-efficient,
    and as features like auto mode and cloud let agents run longer, this has become
    more and more common. You can do a lot of work in parallel this way. But the longer
    you multi-Claude this way, the more it feels like the UX is not good enough: it
    is hard to manage the complexity and context switch. It feels bad to fragment
    your attention like that.<p>At the same time, sometimes you want to deeply focus
    on a single task, and go back and forth on it without switching your attention
    to something else. Not every kind of work needs parallelization. This kind of
    single threaded focus remains really important.<p>The solution we came up with
    is coordinators. You do your work in Projects, then talk to your project’s coordinator,
    which then delegates work to threads when needed. Threads run in parallel and
    bubble up information and questions to the main thread. You can also jump into
    a thread to do deep work.<p>If you’ve tried it, we’d love to hear what you think.
    If you haven’t, give it a spin and please share feedback on what we can do to
    make it better for your use case (run &#x2F;bug or make a GitHub issue).'
