  author: russellbeattie
  text: "&gt; &quot;<i>You do your work in Projects, then talk to your project’s coordinator,
    which then delegates work to threads when needed.</i>&quot;<p>Correct me if I&#x27;m
    wrong, but you skipped a layer: Projects use a coordinator → worker → threads
    pattern.<p>This is the reason I only tried Projects once and then went back to
    my previous way of working: Threads in the current UI aren&#x27;t easy to track
    or to watch over. Apparently if you want to know what they&#x27;re doing you&#x27;re
    supposed to ask your coordinator. That&#x27;s crazyville.<p>It may not be &quot;correct&quot;
    but I like to use Fable as a coordinator&#x2F;orchestrator&#x2F;planner&#x2F;assistant
    and validator. I chat with it constantly. I&#x27;ve banned it from doing any implementation
    or research work on its own. Instead it always fires off Opus subagents to do
    the work and then it validates their work when they&#x27;re done and then updates
    me.<p>This way, the Fable thread is always available for me to chat with, plan,
    brainstorm, answer questions, etc. Yes, just like a Project&#x27;s coordinator,
    but I always know what it&#x27;s doing and workers are just one step away. The
    way the Projects are set up seems way more hands-off.<p>Working this way in the
    Desktop GUI, I can easily see all the subagents and subtasks that are running
    and I can drop in and check out what they&#x27;re doing&#x2F;thinking&#x2F;etc.
    with a single click. This has helped numerous times as they can get stuck, or
    I can see that I&#x27;ve given the wrong instructions, or something else. I also
    have the main Fable session set timers so it can monitor for stuck agents as well
    (waiting for a test suite to return that never does, for example). I don&#x27;t
    have anywhere near the same control and visibility into threads.<p>Projects instead
    defaults to a less advanced coordinator&#x2F;orchestrator (I know you can change
    it but the point is that the system is designed for a dumber coordinator), then
    the smarter worker subagents start, but I don&#x27;t get to talk to them directly
    unless I hunt them down, and then they fire off threads which I have NO visibility
    at all into and have no idea what they&#x27;re doing.<p>You guys at Anthropic
    need to think about us poor schmucks that don&#x27;t have unlimited tokens to
    work with. I can&#x27;t have threads out there sucking up tokens&#x2F;usage allowance
    only to find out later that they were wasting their time."
