    I admire this. Myself, I am just before the final examination that is going to allow me to work as a lawyer in Germany (I spent several years on a PhD/Dr in case somebody wonders why I am not there even though I am a year-long lobster), though I am not sold on pursuing that route (German jurists have several options once everything formal is completed, including e.g. judge positions). Many of the tools mentioned here are interesting, though I am in the Emacs camp and not the Vim one, even doing my e-mails with Emacs (Gnus). If I go the lawyer route, I am going to follow what is proposed here probably to a large extend; just as this person I have been using free software since many years and do want to continue that. Some options are going to be eaten by Emacs, though – of course I do my personal wiki in org-mode and intend to keep that.
    It seems that over in the UK there are no restrictions on the messaging tools lawyers have to use. In Germany, there is; the beA is mandated by law, and even though it at least has a web interface, it is not going to interact nicely with power e-mail tools like mutt, procmail, or Gnus. If there are some fellow German lawyers on Linux around here, I’d be interested in how you deal with the beA. So far, I have not yet met a single fully completed jurist who uses Linux at all. MacOS is the most "nerdy" option I have seen so far.
