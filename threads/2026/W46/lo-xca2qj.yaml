    Knowing only that this is a cardinality estimation that's really simple, I'm going to make a guess at what the algorithm could be.
    If you pick n numbers each generated uniformly at random between 0 and 1, their minimum is 1/(n+1) in expectation, but with a bunch of variance. If you repeat this process k times and take the average, you should get something pretty close to 1/(n+1). So an algorithm could be:

    Assume you have k independent hash functions h_0..h_k. Define p_i(x) to be h_i(x)/H where H is the largest possible hash. This normalizes hash outputs to be between 0.0 and 1.0. For each input x, we will compute p_0(x)..p_k(x).
    For each i=0..k, track the minimum p_i(x) for all inputs x seen so far.
    To get a cardinality estimate, let p be the average of the minimum p_is, and compute (1-p)/p (the inverse of 1/(n+1)).

    EDIT: Nope, different. I was looking for something vaguely like hyper-log-log but simpler, while CVM impressively manages not to use hashes at all!
