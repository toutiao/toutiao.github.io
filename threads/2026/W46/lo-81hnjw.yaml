  title: Announcing Rust 1.100.0 | Rust Blog
  fetch_status: success
  content: "The Rust team is happy to announce a new version of Rust, 1.100.0. Rust
    is a programming language empowering everyone to build reliable and efficient
    software.\n\nIf you have a previous version of Rust installed via `rustup`, you
    can get 1.100.0 with:\n\n    $ rustup update stable\n\nIf you don't have it already,
    you can get [`rustup`](https://www.rust-lang.org/install.html) from the appropriate
    page on our website, and check out the [detailed release notes for 1.100.0](https://doc.rust-lang.org/stable/releases.html#version-11000-2026-11-12).\n\nIf
    you'd like to help us out by testing future releases, you might consider updating
    locally to use the beta channel (`rustup default beta`) or the nightly channel
    (`rustup default nightly`). Please [report](https://github.com/rust-lang/rust/issues/new/choose)
    any bugs you might come across!\n\n## What's in 1.100.0 stable\n\n- [Never type](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#never-type)\n-
    [`Allocator` API](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#allocator-api)\n-
    [`DropGuard` API](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#dropguard-run-a-closure-on-every-exit-path)\n-
    [Conjuring zero-sized types](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#conjuring-zero-sized-types)\n-
    [Reporting unused dependencies in Cargo](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#reporting-unused-dependencies-in-cargo)\n-
    [Reducing Cargo cache collisions](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#reducing-cargo-cache-collisions)\n-
    [Cargo min-publish-age](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#cargo-min-publish-age-a-k-a-dependency-cooldowns)\n-
    [Stabilized APIs](https://blog.rust-lang.org/2026/11/12/Rust-1.100.0/#stabilized-apis)\n\n###
    Never type\n\nAfter 10 years and 5 failed stabilization attempts, **the [never
    type](https://doc.rust-lang.org/stable/std/primitive.never.html) is finally stable**!
    This also completes the [project goal](https://goals.rust-lang.org/2026/stabilize-never-type.html)
    for this work.\n\nThe never type, spelled `!` in code, is the canonical uninhabited
    type. It represents the type of diverging computations – computations which never
    resolve to any value – where any code that follows is unreachable. Expressions
    that terminate control flow, such as `return`, `break`, and [`std::process::exit`](https://doc.rust-lang.org/stable/std/process/fn.exit.html),
    also have the type `!`.\n\nSince having a value of the never type is impossible,
    Rust permits a never-to-any coercion, allowing to turn `!` into any other type
    (this is what distinguishes it from any other uninhabited types). This can be
    used, for example, to not return a value from one of the branches of a `match`
    or an `if`:\n\n    fn mrrrow(option: Option<u32>) {\n        let value = match
    option {\n            // `x` has type `u32`\n            Some(x) => x,\n            //
    `return` has type `!`, which is then coerced to `u32`,\n            // allowing
    the `match` to pass type checking.\n            None => return,\n        };\n
    \       // ...\n    }\n\nWhile the never type could already be used and observed
    this way, and even named in the return type of functions (`-> !`), this release
    allows naming the never type anywhere:\n\n    fn infallible_unwrap<T>(res: Result<T,
    !>) -> T {\n        // ^^ writing `Result<_, !>` was not allowed before\n        let
    Ok(v) = res;\n        v\n    }\n\nAdditionally this release changes [`Infallible`](https://doc.rust-lang.org/stable/std/convert/type.Infallible.html)
    to be an alias to the never type. That makes all old APIs that used `Infallible`
    be compatible with using `!`. This was the plan ever since the introduction of
    `Infallible` and is one of the reasons why the never type stabilization was so
    hard (waffle gave a [talk](https://www.youtube.com/watch?v=3jM4cnEVrLc) about
    some of the troubles of the stabilization).\n\nUnfortunately, to allow changing
    `Infallible`, we had to introduce a breaking change. This release changes the
    \"never type fallback\" from `()` to `!` in editions **before** 2024 (i.e. 2015,
    2018, and 2021), similarly to what has [already been done in edition 2024](https://doc.rust-lang.org/edition-guide/rust-2024/never-type-fallback.html).
    This should largely be unnoticeable, but can affect code in some rare cases (for
    example when ignoring a result of a function returning a generic parameter). Note
    that this change might also make the compiler detect more code as unreachable.\n\nWe
    tried to minimize the impact of this breaking change as much as possible, by providing
    future compatibility warnings far in advance and releasing fixes to public crates
    that have been broken by this. If a dependency is failing due to issues with the
    never type, consider updating it, as a fix might have already been released for
    it.\n\n### `Allocator` API\n\nThis release brings about the stabilization of the
    core parts of [`allocator_api`](https://github.com/rust-lang/rust/issues/32838),
    enabling library authors to define custom allocators that can be used together
    with certain standard library types - currently `Vec` and `Box`. These are enabled
    through the newly-stabilized [`Allocator`](https://doc.rust-lang.org/std/alloc/trait.Allocator.html)
    trait.\n\nThis is the foundation of the [Allocators 1.0 project goal](https://goals.rust-lang.org/2026/allocators-1.0.html).
    A lot remains to be done still, including expanding the API surface usable with
    custom allocators and stabilizing their use on more collections and pointer types;
    with the core trait and design out of the way though, expect to see more being
    stabilized soon!\n\n### `DropGuard`: run a closure on every exit path\n\nThe `Drop`
    trait in Rust makes it possible to run code when a variable goes out of scope,
    regardless of whether we `return`, `?`, or panic. `Drop` being a part of types
    means that [in Rust you never have to close a socket](https://blog.skylight.io/rust-means-never-having-to-close-a-socket/).\n\nImplementing
    `Drop` can however feel a little inconvenient when all you want is to run some
    code unconditionally when a function exits. This is why we’re introducing `core::mem::DropGuard`:
    a new helper type that runs a closure when dropped.\n\n`DropGuard` takes two arguments:
    a variable and a closure. It implements `Deref` and `DerefMut` so you can keep
    working with the variable as normal. But when dropped it runs the closure and
    consumes the variable.\n\n`DropGuard` also implements a `dismiss` method which
    returns the variable from the guard without running the destructor. This makes
    it possible to quickly implement all-or-nothing transaction-like APIs with a rollback.
    Here is an example implementing a parser which uses a guard to roll back mutations
    in case of failure:\n\n    use std::mem::DropGuard;\n    use std::num::ParseIntError;\n
    \   \n    /// Attempt to parse all `strings` and push them into `nums`.\n    ///
    If parsing any of them fails, `nums` remains unchanged.\n    fn parse_all(nums:
    &mut Vec<u32>, strings: &[&str]) -> Result<(), ParseIntError> {\n        let len
    = nums.len();\n        let mut nums = DropGuard::new(nums, move |nums| {\n            nums.truncate(len);
    // ← 1. Reset the vec on failure\n        });\n    \n        for s in strings
    {\n            nums.push(s.parse()?); // ← 2. If `?` returns an error, roll back\n
    \       }\n    \n        DropGuard::dismiss(nums); // ← 3. Parsing successful,
    dismiss the guard\n        Ok(())\n    }\n\n### Conjuring zero-sized types\n\nAs
    Rust's [unsafe code guidelines](https://github.com/rust-lang/unsafe-code-guidelines)
    are still being decided, it became clear that it would be very useful to decide
    what exactly it means to create zero-sized types in an unsafe way, and what we
    should recommend for people to do this.\n\nThis question is answered in Rust 1.100
    with a single function: [`std::mem::conjure_zst`](https://doc.rust-lang.org/stable/std/mem/fn.conjure_zst.html).\n\nInstead
    of transmuting `()`, `MaybeUninit::uninit().assume_init()`, or various other incantations,
    this is the dedicated way to create a value of a zero-size"
