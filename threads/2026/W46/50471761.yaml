  content: "![Cover image for Part 3 of 6 in a PostgreSQL security series, titled
    \"Turning a 22-Year-Old Type Confusion Primitive into RCE\". A diagram shows a
    composite-type row stored as int4, int4 and int8, then read back with the wrong
    layout so the first 8 bytes become a pointer, leading to remote code execution.](https://mehmetince.net/wp-content/uploads/2026/11/postgresql-composite-type-confusion-primitive-rce-cve-2026-6460.png)\n\n#
    Part 3/6 | How I Ended Up Turning a 22-Year-Old PostgreSQL Type-Confusion Primitive
    into RCE (CVE-2026-6460)\n\nIf you had told me in April 2026 one question “Mehmet,
    can we use managed PostgreSQL for this project?” would send me into the deepest
    rabbit hole of my life, I would have laughed.\n\nMonths later, I finally found
    the bottom of that rabbit hole. It was a 22-year-old zero-day in PostgreSQL core.\n\nIn
    this blog post you will read a story of how I ended up uncovering a new class
    of type-confusion vulnerabilities in PostgreSQL.\n\nThis is the 3rd part of blog
    post series named “[Systemic Risks in the Managed PostgreSQL Industry](https://mehmetince.net/tag/postgresql/)”.
    For those who have missed the first two part, feel free to start from 1st and
    2nd which will give you a complete context of this madness.\n\n> I gave PostgreSQL
    a value inside a composite type, changed the type of one of its fields, and asked
    it to read the value back. That type confusion led to one of the most reliable
    memory-corruption exploit I have seen. But I did not start by looking for a PostgreSQL
    core vulnerability.\n> \n> I was exploiting pg\\_clickhouse, and getting that
    exploit to work left me with a question about how PostgreSQL understands its own
    data. With an AI agent as my teacher, I worked through the internals one question
    at a time. Then a seemingly unrelated conversation gave me the idea that connected
    it all, and eventually I found myself staring at a primitive that had been there
    for for awhile.\n> \n> This is the full true story of how those pieces came together,
    I am sure you will enjoy this story.\n\n## **Beginning of August 2026**\n\nDuring
    June and July, I had been exploiting memory-corruption vulnerabilities across
    several PostgreSQL extensions. One of the extensions that I achieved code execution
    was `pg_clickhouse`. That case study has its own story, which I will share in
    the future.\n\nWhat matters here is what that exploit forced me to learn. `pg_clickhouse`
    translates ClickHouse values into native PostgreSQL values. A ClickHouse Array
    is not a PostgreSQL array, right ? So the extension had to rebuild its elements
    as `Datum` values in the format that PostgreSQL expected. A mistake in that conversion
    was what eventually gave me a code execution.\n\nThis was my first time meeting
    with things like `Datum`, `OIDs` etc in the PostgreSQL universe. I learned only
    enough to finish the exploit, but one question remained in the back of my mind:\n\n>
    How does PostgreSQL itself decide what a value is? And how does it process and
    represent it?\n\nSomewhere around late July, I finally got my head out of the
    extensions and just followed that question into PostgreSQL core.\n\n> Disclaimer:
    I reported pg\\_clickhouse oob write + read chain to the vendor and they fixed
    it at Jun 23.&nbsp;\n\n## PostgreSQL Types 101\n\nI started learning with a very
    simple query. What happens when I run the simplest query SELECT 1337?\n\nWhile
    I avoided all the black magic in Postgres internals, I kept this crash course
    on the basics of data types.\n\nI start with this query.\n\n    \n\n    SET debug_print_parse
    = on;\n    SELECT 1337;\n\nThe database scanner looks at the query, recognises
    SELECT as a keyword, and 1337 as an integer token. Then it creates a parse tree
    for the query. Next, PostgreSQL walks the tree and transforms it into a typed
    query tree.\n\n    \n\n    {QUERY\n       :commandType 1\n       :targetList (\n
    \         {TARGETENTRY\n             :expr\n                {CONST\n                   :consttype
    23 \n                   :consttypmod -1 \n                   :constlen 4 \n                   :constbyval
    true \n                   :constisnull false \n                   :location 7
    \n                   :constvalue 4 [57 5 0 0 0 0 0 0]\n                }\n          }\n
    \      )\n    }\n\nParse tree looks like above. But I just wanted to better understand
    things like what is the `consttype 23` ? why `constvalue` has `[57 5 0 0 0 0 0
    0]` &nbsp;and where is my `1337` value ? At this point, I asked Opus 5 to prepare
    me a full deep-dive course on PostgreSQL types. &nbsp;Spending a few days around
    there and talking with my agent, whom I named `pg_expert` taught me these:\n\n
    \   \n\n    consttype = 23 → int4\n    constlen = 4 → four-byte payload\n    constbyval
    = true → stored by value\n    constisnull = false → this is not NULL\n\n`constvalue
    4 [57 5 0 0 0 0 0 0]` can be converted to hexadecimal, making the value easier
    to recognize:\n\n    \n\n    57 decimal = 0x39 \n    5 decimal = 0x05\n\nOn my
    little-endian system, the bytes were stored least-significant first:\n\n    \n\n
    \   39 05 00 00  →  0x00000539  →  1337\n\nSo `1337` had not disappeared. &nbsp;But
    why do we even have `8 bytes` [57 5 0 0 0 0 0 0] instead of simply 4 bytes ?\n\nThat
    was because `constvalue` was not declared as an `int32`. It was declared as a
    `Datum`, which was `8 bytes` Our value `1337::int4` value stored at the lower
    four bytes of that generic carrier.\n\nHow can that same 8-byte `Datum` represent
    a `text`, an `array`, or custom types ?\n\n## A Datum Does Not Know What It Is\n\nChatting
    with my pg\\_expert agent taught me more. A Datum does NOT know what it represents.\n\nThe
    eight bytes carrying `1337` did not contain a hidden label saying “I am an integer.”.
    PostgreSQL knew its type only because of this `consttype = 23`.\n\nThat number
    is an OID (Object IDentifiers) pointing to a row in the `pg_type` system catalog\n\n
    \   \n\n    SELECT\n        oid,\n        typname,\n        typlen,\n        typbyval,\n
    \       typalign,\n        typinput::regproc,\n        typoutput::regproc\n    FROM
    pg_type\n    WHERE oid = 23;\n    \n    \n     oid | typname | typlen | typbyval
    | typalign | typinput | typoutput\n    -----+---------+--------+----------+----------+----------+-----------\n
    \     23 | int4 | 4 | t | i | int4in | int4out\n\nThat means the `pg_type` row
    shows what the value means and how PostgreSQL will use it. So far, it’s brilliant
    and easy to understand. But what about the `text` type ?\n\n    \n\n    SELECT\n
    \       oid,\n        typname,\n        typlen,\n        typbyval,\n        typinput::regproc,\n
    \       typoutput::regproc\n    FROM pg_type\n    WHERE oid IN ('int4'::regtype,
    'text'::regtype) // <== HERE FILTERIN THE INT4 and TEXT only\n    ORDER BY oid;\n
    \   \n    \n    typname | typlen | typbyval | typinput | typoutput\n    ---------+--------+----------+----------+-----------\n
    \    int4 | 4 | true | int4in | int4out\n     text | -1 | false | textin | textout\n\nFor
    text, `typlen = -1` means that the representation have a variable length. And
    `typbyval = false` means that the Datum carried a pointer.\n\n    \n\n    Datum
    ──> pointer ──> variable-length text representation\n\nSo the same `8-byte` value
    stores a memory address for the text. Datum can pass the value either by value
    itself or by reference to it. Nice, I love the elegant abstraction Datums provides!\n\n###
    Unknown is a type!\n\nSo far everything makes sense, but I wanted to better understand
    the &nbsp;`typinput` and `typoutput` columns too. These functions convert the
    value provided by the query into a native Datum or vice versa. So I ran this again.\n\n
    \   \n\n    SELECT 1337, pg_typeof(1337), pg_column_size(1337);\n    \n     ?column?
    | pg_typeof | pg_column_size\n    ----------+-----------+----------------\n         1337
    | integer | 4\n\nBut then I added quotation marks to see if PostgreSQL has dynamic
    type casting/recognition or something:\n\n    \n\n    SELECT pg_typeof('1337');\n
    \   \n     pg_typeof\n    -----------\n     unknown\n\nI was a bit confused at
    this moment. I initially thought unknown meant “PostgreSQL does not know the type.”
    So I went back to chat"
