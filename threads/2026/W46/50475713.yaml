  author: nico
  text: It&#x27;s amazing the level of optimizations we are discovering. At this rate,
    I wouldn&#x27;t be surprised if the trend starts reversing, ie. instead of releasing
    bigger and bigger models, companies start releasing smaller, more capable, specialized
    models for specific applications<p>Over the past few weeks, I&#x27;ve been putting
    together a small, 6.5M param model. It is conversational, does tool calling, RAG,
    mathematical modeling&#x2F;calculations, basic physical simulations, and multi-step
    chained reasoning. It&#x27;s still very much _not_ a frontier model. But it already
    does more than I could get a qwen 2.5 0.5b param model to do with finetuning just
    1 year ago<p>Most of the improvements come from being able to direct claude to
    apply different ideas from recent research that keep coming out. AI labs seem
    to be focused on 1B+ models, so not much comes out about small models, but many
    of the things being discovered in research with billion+ model, are adaptable
    to small ones as well
