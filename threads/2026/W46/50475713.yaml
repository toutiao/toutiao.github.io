  author: wuschel
  text: |-
    I am not in the material, so perhaps someone else can comment on the quality of the outcome and technique? After skimming a page I am not really sure that the whole model fits inside 29 GB RAM. They seem to use some interesting techniques.<p>ModelTokenMemoryUsage [Bytes] = Parameters * (BitsPerParameter&#x2F;8)<p>For a model with 145B parameters, this means:<p><pre><code>    Precision       GB       GiB
        2-bit         36.25     33.76
        3-bit         54.38     50.64
        4-bit         72.50     67.52
        6-bit        108.75    101.28
        8-bit        145.00    135.04
        16-bit       290.00    270.08
        32-bit       580.00    540.17

    </code></pre>
    You have roughly a factor 8 in memory usage from 32 bit down to 4 bit precision. That is quite some room already, but not new.<p>It seems that they radically reduce the model information required per token via the sparse expert approach - 145B-&gt;10B parameters, probably at lower precision - and then use some other approaches I do not understand at that point to make effective use of loaded information.<p>Did anyone try the model?
