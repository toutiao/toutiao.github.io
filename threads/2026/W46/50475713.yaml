  author: Tade0
  text: Most likely a huge part of the magic is keeping the ngram table on disk, as
    only one row from it is read per token, so there&#x27;s next to no performance
    hit.<p>Qwen 3.8 Flash Next utilizes this, with 40% of its parameters being offloaded
    to disk, making the effective memory requirements much lower.<p>My daily driver
    is this:<p><a href="https:&#x2F;&#x2F;huggingface.co&#x2F;ISTA-DASLab&#x2F;Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF"
    rel="nofollow">https:&#x2F;&#x2F;huggingface.co&#x2F;ISTA-DASLab&#x2F;Qwen3.8-Flash-Next-GSQ-RC...</a><p>It
    takes things a step further by simply chopping off that half of experts which
    isn&#x27;t (or rarely is) activated in coding tasks.<p>End result is a somewhat
    competent [0] coding model which runs on a 64GB machine.<p>[0] it still occasionally
    does weird stuff like replacing an entire file with just one line from its answer
    when you ask it a question if you don&#x27;t explicitly tell it to not change
    anything or loop itself if the KV Cache is quantised at below Q8_0.
