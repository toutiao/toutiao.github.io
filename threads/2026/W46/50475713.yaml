  author: MezzoDelCammin
  text: 'For basic 3D models (think project boxes, adapters of one shape to another
    etc.), give OpenSCAD a try. Add &quot;BOSL2&quot; library into it if you need
    threads or some extra niceties.<p>It&#x27;s not a CAD in the traditional sense,
    but since it&#x27;s basically a scripting language for 3D primitives, it works
    surprisingly well in LLMs. And since it&#x27;s just text, there&#x27;s not even
    any MCP or agents necessary (though it can save some time).<p>Basic test : open
    a chatbot of your choice (I&#x27;ve tried Gemini 3.8), ask it for some basic box
    for your model of Arduino, or give it some napkin drawing with dimensions and
    ask it to give you an OpenSCAD code for it. Then paste to OpenSCAD, render, take
    a screenshot and mark on it what you don&#x27;t like and prompt again. Usually
    it&#x27;s pretty usable within 2-3 such iterations.'
