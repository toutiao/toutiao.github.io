  author: Beijinger
  text: "The patent generally covers methods and architectures for transmitting compressed
    screen updates over a general-purpose data network, such as USB or Ethernet, the
    patent specifically claims Haar-transform decoding.<p>So only the combination
    may be new.  But this reminds me of a USPTO thing from my past.<p>The landmark
    ruling you are referring to is the U.S. Supreme Court case KSR International Co.
    v. Teleflex Inc. (2007), which led directly to the USPTO publishing its highly
    influential 2010 Examination Guidelines for Determining Obviousness.\nUnder this
    framework, if element A is known and element B is known, combining them is not
    patentable if the combination yields nothing more than predictable results.<p><a
    href=\"https:&#x2F;&#x2F;www.uspto.gov&#x2F;web&#x2F;offices&#x2F;pac&#x2F;mpep&#x2F;s2143.html\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.uspto.gov&#x2F;web&#x2F;offices&#x2F;pac&#x2F;mpep&#x2F;s2143.html</a><p>So,
    general-purpose data network, such as USB or Ethernet was known (A), claims Haar-transform
    decoding was known (B) [DE69909880T2 &#x2F; EP0955609]. Even if we don&#x27;t
    find this combination in prior art, it is dubious that this is patent worthy based
    on USPTO guidelines (combine A with B).<p>But I see a lot of stuff that suggests
    prior art:<p>1. Noriaki Yamazaki and Tetsuo Tanaka (2007). “ZYWRLE: Enhanced VNC
    Codec for Motion Picture.” IEICE Transactions, J90-D(7), pp. 1790–1798.  \n   Brief
    summary: Adds wavelet compression to VNC’s ZRLE codec for transmitting moving
    images, reducing network traffic to 20–50% of standard ZRLE.  \n   <a href=\"https:&#x2F;&#x2F;search.ieice.org&#x2F;bin&#x2F;summary.php?abst=j&amp;category=D&amp;id=j90-d_7_1790&amp;lang=O&amp;year=2007\"
    rel=\"nofollow\">https:&#x2F;&#x2F;search.ieice.org&#x2F;bin&#x2F;summary.php?abst=j&amp;category=D&amp;i...</a><p>2.
    Joshua G. Senecal, Peter Lindstrom, Mark A. Duchaineau and Kenneth I. Joy (2004).
    “An Improved N-Bit to N-Bit Reversible Haar-Like Transform.” Proceedings of Pacific
    Graphics 2004, pp. 371–380. DOI: 10.1109&#x2F;PCCGA.2004.1348368.  \n   Brief
    summary: Introduces PLHaar, a reversible Haar-like transform supporting lossy
    and lossless image compression without increasing coefficient bit width, suitable
    for bandwidth-limited video and graphics hardware.  \n   <a href=\"https:&#x2F;&#x2F;www.osti.gov&#x2F;servlets&#x2F;purl&#x2F;15014239\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.osti.gov&#x2F;servlets&#x2F;purl&#x2F;15014239</a><p>3.
    Joshua G. Senecal, Mark A. Duchaineau and Kenneth I. Joy (2004). “Reversible n-Bit
    to n-Bit Integer Haar-Like Transforms.” Proceedings of the Data Compression Conference
    2004, p. 564.  \n   Brief summary: Introduces lookup-table Haar-like transforms
    that preserve bit width and reversibility, with applications to fast image compression
    and streaming hardware such as DVI channels.  \n   <a href=\"https:&#x2F;&#x2F;www.osti.gov&#x2F;servlets&#x2F;purl&#x2F;15013668\"
    rel=\"nofollow\">https:&#x2F;&#x2F;www.osti.gov&#x2F;servlets&#x2F;purl&#x2F;15013668</a><p>Good
    luck synaptic!"
