  text: At some point there needs to be a test of when software is related to owning
    hardware.<p>Some questions that come to mind are:<p>Do you actually own the hardware?<p>Do
    you stop owning the hardware, meaning you&#x27;re not allowed or able to use it
    once the company that&#x27;s sold it to you stops providing or updating hardware?<p>Does
    every piece of hardware come with a guarantee that it will work on every piece
    of hardware that it&#x27;s attached to forever?<p>These are just a few of the
    really troubling questions when people forget that software has to run on hardware.
    And the closer the software is to the core operation of a piece of hardware and
    equipment, the more topics like right to repair or right to maintain or right
    to optimize come up.<p>I never thought that a video card replacement driver would
    make me think of companies that are limiting Farmers from repairing and updating
