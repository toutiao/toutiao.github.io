  author: kube-system
  text: 1.  Reverse engineering for interoperability gives you a defense for copyright
    and trade secret claims in the US.  It provides zero protection from patent claims.  &quot;reverse
    engineering a patent&quot; doesn&#x27;t even make any sense.  Patents are public,
    there&#x27;s nothing to reverse engineer.  You could &quot;reverse engineer <i>a
    specfiic implementation of a patent</i>&quot;, but the only thing you&#x27;d be
    accomplishing is just avoiding infringing on the parts of the implementation that
    are subject to copyright or trade secret protections.  You&#x27;d still be violating
    the patent.<p>2. I&#x27;m not saying their arguments are valid.  It&#x27;s a demand
    letter with multiple claims.  There&#x27;s many reasons it might be an invalid
    argument but listing more than one grievance and&#x2F;or not explaining them in
    detail are not some of those reasons.
