article:
  url: https://lwn.net/SubscriberLink/1102549/acbc92e00cee3a3f/
  title: Synaptics patent claims stop work on DisplayLink drivers [LWN.net]
  fetch_status: success
  content: "By **Joe Brockmeier**  \nNovember 10, 2026 \n\nMike Lothian owns a docking
    station (or dock) that uses a [DisplayLink](https://en.wikipedia.org/wiki/DisplayLink)
    chipset that had, at least in his opinion, subpar performance on Linux. He decided
    to try improving the Linux driver, with LLM assistance, but ran into one problem
    that he could not solve—so he asked for help, hoping that Synaptics's developers
    would lend a hand. (DisplayLink was [acquired by Synaptics](https://www.synaptics.com/company/news/displaylink)
    in 2022.) Rather than help him in improving the driver, however, the Synaptics
    legal team responded with patent infringement claims, a [demand](https://lists.freedesktop.org/archives/dri-devel/attachments/20261006/d690bb16/attachment-0001.pdf)that
    he cease unauthorized implementation of DisplayLink technology, and threats of
    expensive legal penalties. For now, it appears that Linux users of the company's
    docks will have to continue to live without feature parity with other platforms.\n\n####
    Synaptics and Displaylink\n\nThe dock that he was trying to support is a Dell
    device that connects to a system via USB&nbsp;3 and allows users to connect multiple
    monitors and other devices to their computer. It provides its [DisplayLink Manager
    (DLM) software for Linux](https://www.synaptics.com/products/displaylink-graphics/downloads/ubuntu)
    for the devices via an APT repository for Ubuntu.\n\nThe company only provides
    DLM software in binary form, and only for x86-based platforms. The software is
    proprietary, but the company does maintain an open-source, out-of-tree kernel
    module that is included with DLM, the[Extensible Virtual Display Interface](https://github.com/DisplayLink/evdi#readme)
    (EVDI) project. It provides a driver that's compatible with [Linux&nbsp;DRM](https://docs.kernel.org/gpu/introduction.html)
    and allows users to manage their docked displays with standard tools used for
    display settings, such as or GNOME and KDE&nbsp;Plasma's utilities.\n\n> **Stay
