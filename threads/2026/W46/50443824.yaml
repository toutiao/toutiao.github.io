  author: bluGill
  text: If any part of the contract is found invalid that can invalidate the whole
    not just the in illegal parts. That is why many contracts have a clause that if
    any part is found invalid the rest holds - you can point to that clause and tell
    the court we agreed not to do that - but the judge need not agree. In some cases
    the judge can decide without the illegal part the whole makes no sense and invalidate
    the whole. Usually (In Practice always) most contracts make sense except for minor
    details that don&#x27;t matter to the point of the contract and so the whole holds
    except for those details. However if any part of it doesn&#x27;t hold the whole
    is open to be rejected.
