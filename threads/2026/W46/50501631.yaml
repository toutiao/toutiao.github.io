    waiting and not enough soup for all of them.<p>“He’s a better businessperson than
    all of you,” Huang told the cloud computing CEOs. The soup-man doesn’t sell out
    all his inventory to one or two customers, but instead keeps prices high and his
    customer base diverse, the CEO said.<p>“You are not establishing the value of
    my products,” he said.&quot;'
