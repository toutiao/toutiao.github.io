article:
  url: https://www.techspot.com/news/114558-nvidia-deliberately-kept-gpu-prices-high-through-circular.html
  title: Nvidia deliberately kept GPU prices high through circular financing deals,
    report claims - TechSpot
  fetch_status: success
  content: "Serving tech enthusiasts for over 25 years.   \n TechSpot means tech analysis
    and advice [you&nbsp;can&nbsp;trust](https://www.techspot.com/ethics.html). \n\n**Connecting
    the dots:** The AI boom has been widely blamed for GPU prices spinning out of
    control over the past year. Following Jensen Huang's [resignation](https://www.techspot.com/news/114533-jensen-huang-resigns-nvidia-ceo-following-allegations-two.html)
    from Nvidia,new information suggests that this was the goal of the former CEO's
    business strategy, which has long drawn accusations of circular financing.\n\nA
    recent [Wall Street Journal](https://www.wsj.com/tech/jensen-huang-colette-kress-nvidia-ceo-eb289097?)
    profile of Nvidia interim CEO Colette Kress has shed more light on how Nvidia
    controversially financed its own customers to drive the AI boom. According to
    the report, the company pushed for more deals in mid-to-late 2026 to absorb an
    oversupply of TSMC wafers and keep GPU prices high.\n\nSince at least last year,
    Nvidia has been accused of prolonging the AI boom by supporting the companies
    that buy its chips. Co-founder and former CEO Jensen Huang, along with CFO Kress,
    even went so far as to defend the company against comparisons to Enron, which
    used similar tactics to illegally obscure its debt before its 2001 collapse.\n\nAlso
    read: [GPU Prices Are Spiraling Out of Control - Q4 2026 Update](https://www.techspot.com/article/3192-gpu-pricing-q4-2026/)\n\nBehind
    the scenes, Kress expressed concern about the scale of the deals Nvidia had inked
    with cloud providers and major AI companies like OpenAI. Nvidia pushed ahead anyway,
    but by summer 2026, the company was wondering whether it had pushed too far amid
    an \"avalanche\" of semiconductors it had ordered from TSMC.\n\nIt was around
    this time that Huang berated Kress, calling her \"a deer in headlights,\" according
    to someone familiar with the matter. Nvidia began to slow down, downsize, and
    pause some of its financing deals, including one with OpenAI that originally included
    a $250 billion backstop for the world's largest data center.\n\n \n\n#### // Related
    Stories\n\n- [AMD wants gamers to remember Radeon loyalty, days after declaring
    itself a data center-first company](https://www.techspot.com/news/114547-amd-wants-gamers-remember-radeon-loyalty-days-after.html)\n-
    [Without Jensen Huang, is it game over for GeForce?](https://www.techspot.com/news/114538-without-jensen-huang-game-over-geforce.html)\n\nSource:
    [Bloomberg](https://www.bloomberg.com/news/features/2025-10-07/openai-s-nvidia-amd-deals-boost-1-trillion-ai-boom-with-circular-deals)\n\nAI
    data centers have siphoned off DRAM and NAND manufacturing capacity traditionally
    used for RAM and storage in consumer devices, inflating prices. Nvidia's GeForce
    GPUs have been hit especially hard, with prices often exceeding 160% of their
    original MSRP. The company's flagship RTX 5090 has become unobtainable because
    Nvidia has directed its VRAM and semiconductors toward data center GPUs.\n\nAs
    its financial support deals wound down, Huang became worried about the company's
    stock market valuation, with its average monthly stock multiple falling far behind
    those of other large tech companies.\n\nRelated: [Without Jensen Huang, is it
    game over for GeForce?](https://www.techspot.com/news/114538-without-jensen-huang-game-over-geforce.html)\n\nColette
    Kress, Interim CEO and Executive VP and Chief Financial Officer (CFO) of Nvidia.\n\nAt
    a Berlin conference, the former CEO told major clients a story about a busy Japanese
    soup vendor who refused to give him a second serving after he had waited in a
    long line, saying the vendor had too many customers and not enough soup. Huang
    used the story to highlight the value of maintaining a diverse customer base and
    keeping prices high, suggesting that Nvidia's circular financing strategy inflated
    GPU prices by creating the perception of high demand.\n\nThe story emerged after
    Huang's resignation [following](https://www.techspot.com/news/114483-us-officials-chinese-businesswoman-close-nvidia-jensen-huang.html)
    the revelation of multiple extramarital affairs. One was with Alice Huang (no
    relation), whose company, Megaspeed, was suspected by US intelligence of diverting
    Nvidia chips to China in violation of export regulations. While some allege that
    she is a spy for Beijing, President Trump and the Justice Department [said](https://www.reuters.com/world/china/us-justice-department-has-not-concluded-alice-huang-was-chinese-spy-blanche-says-2026-11-12/)
    that hasn't been determined.\n\n[45 comments 4.8K likes and shares](#commentsOffset)\n\nShare
    this article:\n[\n\n](https://www.reddit.com/submit?url=https://www.techspot.com/news/114558-nvidia-deliberately-kept-gpu-prices-high-through-circular.html&title=Nvidia%20deliberately%20kept%20GPU%20prices%20high%20through%20circular%20financing%20deals,%20report%20claims)[\n\n](#Share)\n\n**See
    more TechSpot in Google** Add us as a preferred source and our reporting shows
    up first when you search.\n[Add TechSpot](https://www.google.com/preferences/source?q=https://www.techspot.com
    \"See more TechSpot stories on Google Search\")"
