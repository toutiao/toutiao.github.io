  author: inexcf
  text: Image size isn’t a good proxy for features here. Sonarr&#x2F;Radarr&#x2F;Lidarr&#x2F;Prowlarr
    are .NET, Bazarr is Python, Overseerr is Node. Each Docker image ships its own
    runtime and base OS layer, so a big chunk of those ~718 MB is the same kind of
    overhead duplicated six times. One static Go binary skips all of that. And the
    *arrs in my opinion really should not be different tools, each has its own indexer
    handling, download client integration, queue, scheduler, database, auth and web
    UI. Most of what each tool does completely overlaps with the others. So even more
    of the overhead is not necessary.
