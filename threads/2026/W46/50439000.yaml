  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\nEnglish · 简体中文 · हिन्दी · Español · Français · العربية · Português
    · Русский · 日本語 · Deutsch · 한국어 · Italiano · Polski · Nederlands · Türkçe · Українська\n\n    \n\n###
    Six apps to watch a show. Now it's one.\n\nHolyArrs is one self-hosted app for
    your shows, movies and music.Browse like a streaming app, ask for what you want,
    and it handles the rest.\n\nAbout 15 MB to download · about 140 MB of RAM idle
    with 10,000 titles · amd64, arm64, armv7The six apps it replaces download 718.2
    MB together.\n\nQuick start · Why · What it does · Moving from other apps · The
    manual · Help\n\n## \U0001F680 Running in two minutes\n\nSave this as docker-compose.yml
    in a new folder on a local disk:\n\nname: HolyArrs services: holyarrs: image:
    holyarrs/holyarrs:latest container_name: holyarrs environment: - PUID=1000 - PGID=1000
    - TZ=America/New_York volumes: - /your/local/path:/config - /path/to/movies:/movies
    #optional - /path/to/tv:/tv #optional - /path/to/music:/music #optional - /path/to/downloads:/downloads
    #optional ports: - 6262:6262 restart: unless-stopped\n\ndocker compose up -d\n\nOpen
    http://your-server:6262 and make the owner account. A short setup walks you through
    folders, a downloader and a Source.\n\nNo API keys to hunt down. No second container.
    Every setting is explained in the manual further down.\n\n## \U0001F4A1 Why I
    built it\n\nA normal media server runs six apps: Sonarr, Radarr, Lidarr, Bazarr,
    Prowlarr and Seerr.\n\nThat's six logins, six ports, six update cycles and six
    API keys to copy between them. When a show doesn't land, you check six places
    to find out why.\n\nI wanted one app. One login, one port, one place to look.\n\nSo
    I built it.\n\nAbout 48 times smaller. Compressed registry download, linuxserver.io
    images, amd64, measured 2026-11-08. Idle RAM measured with 10,000 titles and 55,000
    movies and episodes.\n\n## \U0001F3AC Ask for a title, and it shows up in your
    library\n\nSomeone asks for a title. HolyArrs searches your Sources, picks the
    best release with your Pick rules, sends it to your downloader and files it in
    your library. Your media server hears about it when it lands.\n\n## \U0001F91D
    It works with what you already run\n\n- Downloaders: qBittorrent, Transmission,
    Deluge, SABnzbd, NZBGet\n\n- Media servers: Plex, Jellyfin, Emby\n\n- Sources:
    any Torznab or Newznab indexer, or Prowlarr or Jackett\n\n- Moves your setup from:
    Sonarr, Radarr, Lidarr, Prowlarr, Bazarr, Seerr, Overseerr, qBittorrent, SABnzbd\n\n##
    \U0001F69A Bring your old setup with you\n\nOpen Settings > Move from other apps,
    add each old app's address and API key (or a backup zip), pick what comes over,
    run Try it, then Move. You can undo a move later.\n\nHolyArrs only reads your
    old apps and changes nothing in them, so you can run both side by side until you
    trust it.\n\nKeys and passwords stay behind; you type them in again or import
    them from a file. Custom formats, tags and history don't come over. Media files
    never move. Step by step: Move from other apps.\n\n## \U0001F9ED What it doesn't
    do yet\n\n- Downloading by itself. HolyArrs connects to qBittorrent, SABnzbd and
    the others. It doesn't replace them.\n\n- AI or MCP features. Not in 1.0.\n\n-
    Phone and TV apps. Not built. The web app works on a phone.\n\n- Music in Explore
    is still being built.\n\nWhat's next is on the roadmap. You vote, I build. Post
    ideas on r/HolyArrs.\n\n## ❓ Questions people ask first\n\nDo I keep qBittorrent
    or SABnzbd? Yes, for now. HolyArrs connects to the downloader you already run.
    A built-in downloader is planned for a later release.\n\nCan Sonarr and Radarr
    keep running while I try it? Yes. HolyArrs reads them once and never changes them.\n\nIs
    it free? Yes. It's free and open source.\n\n# \U0001F4D6 The manual\n\nEverything
    below is reference. The full guides live at docs.HolyArrs.com.\n\n## Supported
    architectures\n\nPulling holyarrs/holyarrs:latest gets the right image for your
    machine.\n\nOn a NAS? See Unraid, Synology and other NAS boxes.\n\n## Version
    tags\n\nImages live on Docker Hub as holyarrs/holyarrs.\n\n## Usage\n\n### docker
    compose (recommended)\n\nname: HolyArrs services: holyarrs: image: holyarrs/holyarrs:latest
    container_name: holyarrs environment: - PUID=1000 - PGID=1000 - TZ=America/New_York
    volumes: - /your/local/path:/config - /path/to/movies:/movies #optional - /path/to/tv:/tv
    #optional - /path/to/music:/music #optional - /path/to/downloads:/downloads #optional
    ports: - 6262:6262 restart: unless-stopped\n\n### docker cli\n\ndocker run -d
    \\ --name=holyarrs \\ -e PUID=1000 \\ -e PGID=1000 \\ -e TZ=America/New_York \\
    -p 6262:6262 \\ -v /your/local/path:/config \\ -v /path/to/movies:/movies `#optional`
    \\ -v /path/to/tv:/tv `#optional` \\ -v /path/to/music:/music `#optional` \\ -v
    /path/to/downloads:/downloads `#optional` \\ --restart unless-stopped \\ holyarrs/holyarrs:latest\n\nContainer
    settings go in compose. Everything else is set in the app.\n\n## Parameters\n\nEach
    one is written <outside>:<inside>. Change the left side only.\n\nMore variables
    (reverse proxy, URL base, save path): Environment variables.\n\n### Environment
    variables from files\n\nPut FILE__ in front of any variable to read its value
    from a file, such as a Docker secret:\n\nenvironment: - FILE__HOLYARRS_ALLOWED_HOSTS=/run/secrets/holyarrs_hosts\n\n##
    User and group\n\nPUID and PGID must match the user that owns your media folders.
    Find them with:\n\nid youruser # uid=1000(youruser) gid=1000(youruser)\n\nHolyArrs
    never changes the owner of your media or download folders. Give that user write
    access to them, because HolyArrs makes folders and moves files.\n\n## Application
    setup\n\nOpen http://your-server:6262 and make the owner account right away. There
    is no default password. Until you make it, whoever opens HolyArrs first becomes
    the owner.\n\nThe setup that opens next asks for your folders, a downloader and
    a Source. Guide: First run.\n\n### Media folders\n\nThe four optional mounts are
    the easy way to start. The cost: each mount is its own filesystem inside the container,
    so every import is a full copy.\n\nWant instant moves that take no extra space?
    Mount one parent folder with downloads and Library folders inside it, and give
    your downloader the same mount at the same path. Guide: Folders.\n\n### Docker
    Desktop on Windows and Mac\n\nUse a named volume for /config. Media folders can
    stay host folders. Guide: Install.\n\n## Keep your master key safe\n\nholyarrs.key
    in your config folder is what opens your stored passwords and keys. Backups don't
    include it, so keep a copy somewhere else. As the owner, open Settings > Backups
    and choose Download key kit. See Backups.\n\n## Updating\n\ndocker compose pull
    docker compose up -d\n\nIf the new version changes how data is stored, HolyArrs
    makes a backup first. To go back to it: docker exec holyarrs /holyarrs restore
    --pre-update, then docker restart holyarrs. Never remove /config during an update.
    See Updates.\n\n## Security\n\n- The owner account is made at first visit. There
    is no default password.\n\n- Stored passwords and keys are encrypted with holyarrs.key.\n\n-
    The image has no shell inside it.\n\n- Don't forward port 6262 on your router.
    Use a VPN such as Tailscale, or a reverse proxy with HTTPS.\n\n- Report security
    problems privately: SECURITY.\n\n## Support info\n\nThe image has no shell, so
    docker exec -it holyarrs /bin/bash won't work. HolyArrs' own commands do:\n\n-
    Follow the log: docker logs -f holyarrs\n\nFollow the log:\n\ndocker logs -f holyarrs\n\n-
    Check your setup. Every line says OK, WARN or FAIL, and each WARN or FAIL says
    how to fix it: docker exec holyarrs /holyarrs doctor\n\nCheck your setup. Every
    line says OK, WARN or FAIL, and each WARN or FAIL says how to fix it:\n\ndocker
    exec holyarrs /holyarrs doctor\n\n- Locked out of the owner account: docker exec
    -i holyarrs /holyarrs reset-owner\n\nLocked out of the owner account:\n\ndocker
    exec -i holyarrs /holyarrs reset-owner\n\n- Version number: docker inspect --format
    '{{ index .Config.Labels \"org.opencontainers.image.version\" }}' holyarrs\n\nVersion
    number:\n\ndocker inspect --format '{{ index .Config.Labels \"org.opencontainers.image."
