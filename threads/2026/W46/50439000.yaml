    hi HN, im luis. 10+ years in software and security, homelabbing for about 5<p>&quot;netflix and spotify&quot; is how it feels to use, not what it does under the hood. holyarrs doesnt play anything. you browse your shows, movies and music like a streaming app (top 10s, new &amp; popular, coming soon), tap what you want, and it sends it to your downloader and files it into jellyfin or plex. those still do the playing<p>before this, my server needed 6 apps for that: sonarr for shows, radarr for movies, lidarr for music, bazarr for subtitles, prowlarr for indexers and overseerr for requests. 6 setups, 6 databases, and nobody in my house but me could use any of them<p>- the image is 15 MB. the 6 apps it replaces are 718 MB together
    - one go binary, svelte UI, sqlite. the image has no OS and no shell
    - runs on amd64, arm64 and armv7
    - works with qbittorrent, sabnzbd, plex, jellyfin, emby
    - imports your sonarr&#x2F;radarr setup, and speaks their api so seerr can keep talking to it
    - no api keys to set up. posters and search come from a metadata server i run and pay for
    - free, AGPL-3.0<p>how it got built: claude code wrote most of the go and svelte. i wrote the specs, reviewed everything and tested it on my own server. what it got wrong: it never noticed cost. the app got heavier build after build until i started measuring every single one. thats the only reason its still 15 MB<p>why you might want to wait: its young, 1.0.7 shipped today and im fixing reports as they come in. music is still being built out, and a few features are held back until theyre fully tested (plex watchlists, trakt lists, subtitle sites)<p>why i built it: my family wanted netflix and i had 6 apps nobody but me could use<p>im in the comments, tell me what breaks
