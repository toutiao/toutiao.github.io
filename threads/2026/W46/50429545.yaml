  author: PaulKeeble
  text: 80 TOP&#x2F;s and 150GB&#x2F;s memory gives us the fundamentals of where this
    sits performance wise although its not said if the TOP&#x2F;s is for INT4 or FP16
    or what which changes the prefill performance considerably.<p>A consumer graphics
    card (say a 9070 XT) will be something more like 750 TOP&#x2F;s on INT4 (20TOP&#x2F;s
    on FP16) and 650 GB&#x2F;s. So its probably about a tenth the performance for
    prefill but maybe its only a third if its FP16 and can&#x27;t handle more than
    15GB per token due to its memory bandwidth (at Q4 that would be ~7B active parameters)
    for decode to achieve 10 token&#x2F;s and to get its 30 token&#x2F;s it would
    be max 2.5B active parameters at Q4. A full FP16 model on this seems very unlikely
    unless its a lot bigger than we think it is.<p>This I think is just about enough
    for a decent home AI, its a little slow and its only going to be of use for MOE
    (so no qwen 27B) but depending on price I can see it being of interest to a lot
    of people as some flash models aiming for 100B and 2-7B active parameters could
    be really quite a lot of home capability in a relatively low power consumption
    unit.
