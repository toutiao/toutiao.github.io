  text: Then what even is the value of creating and owning something? I might as well
    recreate all my dependencies from scratch. The reason I use something like Emacs
    is because I trust the people maintaining it that they will make choices I agree
    with or are in my interest most of the time, and that they care about what the
    create and have taken the time to make sure that it&#x27;s high quality. Something
    that another person has cooked up quickly to solve a problem I care about isn&#x27;t
    worth anything to me unless it offers a level of quality I wouldn&#x27;t be able
    to match with a few hours&#x2F;days of LLM-whacking.
