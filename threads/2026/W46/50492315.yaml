  content: "#### The Brief\n \n- \n  - Amtrak's ticket booking system is returning
    to normal after an outage Friday night.&nbsp;\n  - Officials say the train service
    is operating normally, but is seeing increased demand.\n  - The outage came amid
    a nationwide FAA ground stop that has since been lifted.\n\n \n\n**WASHINGTON**
    - Amtrak said its booking system is returning to normal after a network outage
    that coincided with a nationwide FAA ground stop.\n\n \n\n \n\n \n\n  \n \n\nImage
    1 of 2 \n▼\n\n \n\nAn error message on Amtrak's website while attempting to book
    a ticket on Friday, Nov. 13, 2026.\n\n \n \n \n## Users report outage\n \n\n \n\nWhat
    we know:\n\n \n\nUsers on social media started sharing frustrations over ticket
    reservations Friday afternoon, with travelers showing error messages on Amtrak's
    website and app.\n\n \n\nHundreds of users reported issues on [DownDetector](https://downdetector.com/status/amtrak/),
    beginning shortly before 5 p.m. Friday, with another surge just before 6 p.m.\n\n
    \n## Issues caused by increased demand\n \n\nWhat they're saying:\n\n \n\nIn response
    to a request for comment, Amtrak's Communications Director W. Kyle Anderson said
    that \"Amtrak service is operating normally, and we are seeing increased demand
    for travel across our network.\"\n\n \n\nResponding to a frustrated customer Friday,
    Amtrak officials said in a post on X that the booking issues were related to a
    system-wide update, but did not elaborate.\n\n \n\nAround 9 p.m. officials said
    the booking systems were returning to normal.&nbsp;\n\n \n\nThe company said some
    customers may still experience issues while processing payments, booking trips
    or modifying existing reservations. Amtrak’s call centers experienced higher-than-normal
    call volumes, resulting in longer wait times for some.\n\n \n\nFOX 5 DC attempted
    to call the support number during the outage, around 8 p.m., but an automated
    message said officials were unable to take calls due to \"unusually high call
    volume.\"\n\n \n\nFeatured\n\n \n\n[\n\n ![Live updates: FAA says nationwide ground
    stop due to 'temporary telecommunications outage'](https://images.foxtv.com/static.livenowfox.com/www.livenowfox.com/content/uploads/2026/11/0/100/nov-13-ground-stop.jpg?ve=1&tl=1)\n
    \n article\n](https://fox5dc.com/news/faa-issues-nationwide-ground-stop-due-to-extraordinary-circumstances)\n
    \n\n### [Live updates: FAA says nationwide ground stop due to 'temporary telecommunications
    outage'](https://fox5dc.com/news/faa-issues-nationwide-ground-stop-due-to-extraordinary-circumstances)\n
    \n\nA nationwide ground stop has been issued by the the FAA due to a \"temporary
    telecommunications outage.\"\n\n \n## Travelers scrambling during ground stop\n
    \n\nThe backstory:\n\n \n\nThe outage came as thousands of travelers across the
    country scrambled for new plans, after the Federal Aviation Administration issued
    a nationwide ground stop — the first since January 2023 and just the second since
    the Sept. 11, 2001, attacks.\n\n \n\nThe FAA has said that the ground stop was
    ordered due to a \"temporary telecommunications outage.\" It has since been lifted.&nbsp;\n\n
    \n\n**The Source:** Information in this story is from social media posts commenting
    on the ticket booking outage, error messages on Amtrak's website and app, phone
    calls to Amtrak's support and media relations lines and previous FOX reporting
    on the Federal Aviation Administration's nationwide ground stop.&nbsp;"
