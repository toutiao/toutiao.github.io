  author: jmyeet
  text: '<i>Nighthawks</i> and <i>Sunday Afternoon</i> were both in the museum scene
    of <i>Ferris Bueller&#x27;s Day Off</i> (but no <i>American Gothic</i>), which
    came from a personal connection John Hughes had with the Chicago Art Institute
    [1].<p>In particular, Cameron focuses on <i>Sunday Afternoon</i> going right up
    to an extreme close up down to individual dots where all detail is lost. Cameron
    focuses on the child, seemingly being without a mother.<p>Separately, <i>American
    Gothic</i> is one of the most important pieces from 20th century American art
    history. It was painted in 1930 and is seen as a symbol of the hardworking resilience
    of rural Americans at the time. This was early on in the Great Depression. It
    speaks to Protestant stoicism and while not directly relevant to nor painted in
    an area to be affected by the Dust Bowl, that event is so significant to the Midwest
    in the 1930s, you can&#x27;t really ignore it.<p>When I was younger I didn&#x27;t
    have as much of a reaction to <i>Nighthawks</i> but now? It seems like an early
    bellwether to the urban isolation and fragmentation of society in postwar America
    that has eventually come to pass. It&#x27;s like this late night spot became a
    place for people to go who had nowhere else to go.<p>[1]: <a href="https:&#x2F;&#x2F;www.tiktok.com&#x2F;@johnhughesmovies&#x2F;video&#x2F;7227281023661378862?lang=en"
