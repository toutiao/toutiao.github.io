    # The Story Behind Edward Hopper’s Iconic Painting, “Nighthawks”

    ## Louis Shadwick on Hopper’s Most Famous Work

    [Via Yale University Press](https://yalebooks.yale.edu/book/9780300263787/edward-hopper/)

    [Louis Shadwick](https://lithub.com/author/louisshadwick/ "Louis Shadwick")October 26, 2026

    Article continues after advertisement

    Edward Hopper had certainly started _Nighthawks,_ his iconic vision of a sparsely populated New York diner aglow with artificial light, by late November 1941. When Arnold Newman photographed him in front of the empty canvas that month, Hopper had clearly decided the picture’s dimensions; he had also probably completed many of the nineteen preparatory sketches in both pencil and chalk, several of which featured numeric notes detailing how to scale up the composition to its final form.

    As winter set in, Hopper made numerous excursions, trekking up to the Dixie Kitchen diner in Midtown to sketch the coffee urns, as well as salt and pepper shakers, cups, and napkin dispensers. For the figures, Hopper modeled himself for the two suited men using a full-length mirror, while Jo modeled for the auburn woman clad in burgundy. The blond barman Edward dreamed up from scratch, though Jo recognized this character as “practically Capt. Ed Staples,” suggesting once again the resurgence of Hopper’s painterly alter ego.

    A gesture of endurance through the nation’s darkest hours, _Nighthawks_ celebrates a poignantly American resilience.

    Edward later stated that the diner itself was first “suggested by a restaurant on Greenwich Avenue where two streets meet,” adding that “_Nighthawks_ seems to be the way I think of a night street.” A _Vogue_ article claimed in 1954 that the picture was “based partly on an all night coffee stand Hopper saw on Greenwich Avenue in downtown New York, only more so.” he certainty that the source of _Nighthawks_ once existed on Greenwich Avenue has led to many rounds of detective work to identify Hopper’s famous diner. Wedge shaped establishments at 70 Greenwich Avenue—a newsstand in Hopper’s day and now a florist—and a 1940s restaurant named Riker’s at the junction of West Fourth Street and Seventh Avenue South, where the Hoppers frequently dined, have been identified as potential sources.

    No consensus exists, though the most likely origin was identified by Carter Foster in 2013 as a long gone establishment called Crawford Lunch, which once stood where Greenwich Avenue meets Twelfth Street, just north of the Sheridan Theatre. The existence of the word “Lunch” on the diner window in one of Hopper’s final studies for _Nighthawks_ lends credence to this theory, as does the distinctive shape of the premises.

    Many details of Hopper’s diner differ, however, not least the large, curved glass-plated window in _Nighthawks_ that lends the painting its iconic fishbowl effect. The advertisement for $5 Phillies American cigars crowning the cornice and the diner’s sleek, art deco design were also missing from these suggested sources. This has led to credible suggestions that Hopper amalgamated details of several establishments in combination with imagined elements. The long, seamless window of the diner has not been identified as a feature of any historic restaurant on Greenwich Avenue, suggesting the possibility that Hopper derived this element from the renowned glass-fronted prow of the famous Flatiron Building, which once housed a cigar store. If so, Hopper’s intent was surely to create a stylized diner with a distinctly New York shape and feel.

    Indeed, the overwhelming Americanness of _Nighthawks_ has long been felt and observed: from the aquarium style architecture to the artist’s inclusion of an ad reading “America’s no. 1 Cigar”; from the presence of cigarettes and coffee to the hardboiled, fedora clad “nighthawks” themselves. Beyond its dramatic aesthetic—masterfully conjured through a utilitarian approach to light, color, and form—the painting’s mood and substance feel palpably American in a manner that countless writers have spilled acres of ink on, in attempts to explain its singular aura.

    It is important to return to the original contexts of _Nighthawks_ to plumb its depths. The work was produced during a period of extraordinary existential tension across the United States and specifically in New York. Though _Nighthawks_ was planned in the weeks before the devastating attack on Pearl Harbor on December 7, 1941, the event had shaken America to the core, creating a dramatic new context for the painting. The United States was finally dragged into the Second World War, resulting in nightly blackouts and very real concerns about the bombing of their cities. New York was a primary enemy target, a worry expressed by Jo in a letter to Marion Hopper on December 17:

    Ed refused to take any interest in our very likely prospect of being bombed—and we live right under glass skylights and a roof that leaks whenever it rains. He refuses to make any more precautions and only jeers at me for packing a knapsack with towels and keys and soap and check book, shirt, stockings, garters—in case we ran to race out doors in our nighties. For the blackout we have no shade over the sky light—so can’t have lights in studio at all—so no way to cook even.

    Jo continued that, amid the blackouts and trepidation, Edward had become particularly obsessive about his new painting:

    He’s doing a new canvas and simply can’t be interrupted! he Rehn gallery invites E to remove some of his pictures to a store house so that the whole collection won’t be in one place. Frank Rehn is very concerned and making many precautionary measures. I can’t say I’m a bit panicy but I’m the kind that believes in precautions, and in a matter that everyone is so concerned in, I can’t see why anyone refuses to take an interest. Hitler has said he intends to destroy New York and Washington. It’s certainly indicated that he will try. We’re right close up to that center of Jewry, the NY University. We should have heavy curtains for front of house to keep glass from smashing in all over the floor—but with glass overhead, what good would they do. It takes over a month for E to finish a canvas and this one is only just begun…E won’t now discuss any emergency&nbsp; Surely, this is the time to think things out…But E. doesn’t want me even in the studio…Can it be that E. Hopper senses in his bones the admonition: “Be still and know that I am God!”

    Painting continued for over a month. On January 22, 1942, Jo revealed that Edward had “just finished a very fine picture—a lunch counter at night with 3 figures. Night Hawks would be a fine name for it. He was about a month and a half working on it—interested all the time, too busy to get excited over public outrages. So, we stay out of fights.”

    The extraordinary extent of Edward’s absorption in _Nighthawks_ suggests that the painting was a product of exceptional, almost obsessive focus, with little of the typical delays or doubts plaguing its genesis. It seems clear that the anxiety of war facilitated the conditions for such sustained labor, _Nighthawks_ providing not only distraction from pressing worldly concerns but also a channel for Hopper’s private thoughts and fears. The environment of wartime New York rings out silently but urgently from _Nighthawks;_ as a temple of fluorescent light persisting through the infernal darkness, Hopper’s diner figuratively and symbolically resists the blackouts imposed upon the city. A gesture of endurance through the nation’s darkest hours, _Nighthawks_ celebrates a poignantly American resilience.

    Through stoicism, _Nighthawks_ spins the dark side of American life as _cool;_ its quiet menace is slick and alluring, and its lonesome, shadowy characters are iconic.

