  author: logophobia
  text: I mean, even if you&#x27;ve stopped even reading code (good luck with that),
    the right abstraction should make things things easier for the LLM. A good rich
    type system to stop incorrect code, linters to catch common errors. A good set
    of battery-included system libraries. BEAM should provide a good abstraction for
    highly parallel and distributed systems, which means the LLM doesn&#x27;t need
    to build all those abstractions itself. If you&#x27;re building a distributed
    system, it should be like providing a set of good guardrails, guiding the LLM
    in building a correct system.<p>I&#x27;ve seen even the best models try to build
    &amp; debug parallel and distributed systems. The results are always a bit uneven
    at best, even with a good harness and a lot of guidance.<p>The disadvantage of
    niche languages is that the LLM won&#x27;t quite know the language as well due
    to less training data being available. But if you actually need to build something
    distributed, then this might be a good trade-off.
