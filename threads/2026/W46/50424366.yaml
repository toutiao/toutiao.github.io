  text: For what it&#x27;s worth, I still parse code changes and feel uncomfortable
    if I struggle to understand code output without assistance.<p>On the &quot;languages
    for LLMs front&quot;, isn&#x27;t that a bit &quot;cart-before-horse&quot;? Doubt
