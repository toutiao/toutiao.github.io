  author: wakamoleguy
  text: We might still read them, but let’s set that aside. Some languages may offer
    ways to eliminate entire classes of bugs. Gleam and Haskell-ish languages do that
    through very strong type systems and expressive high-level functional constructs.
    Rust similarly eliminates a ton of memory errors through its borrow checker. LLMs
    aren’t infallible, so this can result in better quality code (or if you believe
    every bug will still be caught…less code to do it).<p>Gleam also runs on BEAM,
    which has important runtime characteristics vs other languages. That will impact
    your system and how it scales even if you never look at the code.
