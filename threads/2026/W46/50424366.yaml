article:
  url: https://nchagnet.eu/blog/you-should-try-gleam
  title: You should try Gleam | Nicolas Chagnet's Homepage
  fetch_status: success
  content: "[Back](/blog)\n\n## Introduction\n\nIf you have read my recent [rant about
    programming languages](/blog/desert-island-languages/), you'll know I've been
    quite interested in [Gleam](https://gleam.run). Gleam is a functional language
    that targets BEAM, the Erlang VM, with a simple syntax and interoperability with
    the wider BEAM ecosystem (Erlang and Elixir). Interestingly, Gleam can _also_
    target JavaScript i.e., Gleam can be compiled into JavaScript and run through
    Node.js.\n\nI've been mostly using Rust for hobby projects, which at the moment
    is the only language that really makes coding enjoyable for me, and Gleam has
    managed to scratch that itch too. If you're a Rust _connaisseur_, then Gleam will
    feel familiar to you, bar a few key differences. I feel like 80% of the code I
    write could be copy pasted to Rust (with a tinge of search-and-replace for syntax)
    and it'd compile.\n\nThis post won't give an exhaustive overview of the language,
