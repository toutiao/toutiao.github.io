  author: jcarver
  text: 'You have two options:<p>1. Agentic merge queue. Lower risk PRs enter a queue
    and are auto-merged by a specialized agent. Higher risk PRs are still reviewed
    by humans. We&#x27;re currently doing this for Dependabot PRs via a product we
    built: <a href="https:&#x2F;&#x2F;patchwave.ai&#x2F;" rel="nofollow">https:&#x2F;&#x2F;patchwave.ai&#x2F;</a>
    , but the approach generalizes to any kind of PR.<p>2. Stop doing PRs. Review
    moves upstream into a multiplayer agent thread that&#x27;s visible to the team
    - tag a teammate to pop in and look when you need feedback. PR checks move upstream
    into this thread as well, the agent just runs them as part of verifying its work.
    Push to main, ci checks run and deploy as normal from there.<p>We&#x27;re at 1
    now, but actively working towards moving to 2 and want to help other teams do
    the same.'
