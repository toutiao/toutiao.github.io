  author: philipp-gayret
  text: 'For my own projects: Agents have access to managed tools which enforce quality
    metrics, build, test, and deploy all more or less in parallel and get it ready
    to go into git. Examples of metrics are: test coverage, allowed dependencies,
    linters and the usual. These tools run on the same machine where the software
    will be deployed (for performance reasons). These tools submit attestations for
    everything they do. I made my own system for it, it keeps track of everything.
    The whole process including docker build and deploy to a test env is 10s or less.
    (I find 10s is reasonable to achieve for all projects I&#x27;ve worked on). Secondly
    I run a daily process for all projects that runs another set of quality metrics
    ; picture for example dependencies out of date, tests getting too slow and similar
    topics. These become work for the agents to pick up. Review is me checking if
    the app does what it should at best. If it passes all the quality metrics, I don&#x27;t
    care much for the code.<p>For clients (who are not that AI-pilled): They&#x27;re
    liking CodeRabbit and developers are not reviewing as strictly anymore. Quality
    metrics are obtained via CI&#x2F;CD and attached to PR&#x27;s. If it&#x27;s all
    green then most developers would give it a LGTM'
