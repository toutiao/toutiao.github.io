  author: derefr
  text: 'It solves for the same thing a &quot;train of thought&quot; (internal vocalization)
    solves for in the human brain: there&#x27;s a lot of stuff you &quot;know&quot;
    as episodic memories of words you&#x27;ve heard&#x2F;read, but haven&#x27;t yet
    internalized via practice into reflex reactions. It&#x27;s a lot faster and cheaper
    to acquire a memory of some words, than it is to acquire an entire new skill,
    so you end up picking up far more memories-of-words than concrete skills from
    a given training corpus.<p>Reasoning (i.e. bubbling those remembered words up
    into your mental context, and then using a special &quot;trigger effectively arbitrary
    synaptic activations dependent on the content of the attention-masked context
    and an ongoing state&quot; bridging reflex on them, a.k.a. &quot;system-2 thinking&quot;)
    is how you leverage memories-of-words into useful behavior. Rather than executing
    native skills embedded into your synaptic weights, you&#x27;re running a single
    very fancy native skill that acts as an interpreter for word-memory data, slowly
    and strenuously turning words you&#x27;re holding in mind into more words (synthesis),
    or into associations to other memories (word-memories or otherwise), or into actions&#x2F;outputs,
    etc.<p>(An especially useful &quot;trick&quot; of this system is <i>planning</i>,
    i.e. chaining the interpreter through &quot;mere words&quot; that conjure more
    &quot;mere words&quot; to mind until you end up at words that form a declaration
    of what you&#x27;re about to do. You can then rely on a special part of the bridging
    reflex, namely the &quot;instruction-following&quot; reflex, to react in a way
    where your actions are constrained by the plan you&#x27;ve generated.)'
  score: 0
