  author: derefr
  text: AFAICT those are various intermediate representations it uses for what you
    wrote &#x2F; things it already stated in other ways; and when you see it restating
    things multiple times, it&#x27;s due to a kind of swapping where it&#x27;s struggling
    to juggle those representations.<p>If you think about how the algorithms the LLM
    has learned to do what it does must be represented across its layers, each such
    algorithm must be spread across a certain number of layers (since there&#x27;s
    only so much logic that can encoded in a single GEMM op.) But this includes the
    algorithms the LLM uses to understand (recognize, parse) the context; and the
    algorithms the LLM uses to turn its semantic idea of how it should respond into
    tokens appropriate to the &quot;word game&quot; being played at the moment. Every
    single token-generation step is therefore its own independent scheduling problem,
    of selecting a particular recognizer algorithm, some number of analysis algorithms,
    and a generation algorithm, such that they can all take the previous sub-step
    algorithm&#x27;s output as their input, despite each such algorithm only existing
    across a certain layer-slice of the model, and thus only being able to be fed
    input on the specific layer where it starts. (Algorithms can be &quot;forwarded&quot;
    outputs from other algorithms that finish early, but there&#x27;s no way to feed
    output to an algorithm in an earlier layer if the first substep takes too long
    and &quot;misses&quot; the layer where it begins!)<p>One consequence of this is
    that complex recognition&#x2F;generation, and complex analysis, trade off against
    one-another. The more a given token-generation step tries to &quot;think&quot;,
    the less-sophisticated an understanding that step can have of the context, and
    the less-sophisticated a speech pattern that step can have for its output. And
    vice-versa.<p>In all parts of the LLM&#x27;s output <i>other than</i> reasoning,
    a trained expectation of consistently high fluency in both recognition and production
    is expected&#x2F;required. So analytical capacity is always sacrificed.<p>But
    reasoning has no such requirement. And so LLMs learn that during reasoning, they&#x27;re
    free to flip between advancing with &quot;NLP-focused&quot; steps vs. &quot;analysis-focused&quot;
    steps.<p>And because the LLM&#x27;s &quot;verbal IQ&quot; is temporarily decreased
    during analysis-focused steps, for those steps to make successful progress, they
    need the assistance of previous NLP-focused bridging steps to rephrase anything
    in the context that&#x27;s too complex for the simpler NLP algorithms that get
    used alongside those complex analytical algorithms, into intermediate representations
    that those simple NLP algorithms can handle.<p>And then, for associational-memory
    reasons, you might see more bridging steps where the &quot;simple language&quot;
    the high-analysis-low-NLP algorithms output gets turned back into &quot;fluent
    language&quot;. And on it goes, back and forth, during reasoning.
