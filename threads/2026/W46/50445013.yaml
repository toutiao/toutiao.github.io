  author: gertlabs
  text: This is a great article. In our RL work, we think of reasoning as a skill
    -- a set of tools and protocols to leverage knowledge a model already has to improve
    the probability of creating knowledge the model doesn&#x27;t have.<p>Although
    specifically defining reasoning as a skill is hard, we&#x27;ve seen success with
    partners who agree that you don&#x27;t need to enable reasoning on every single
    rollout -- you get diminishing returns past a certain point (the model often already
    has a complete toolkit for how to explore ideas and run calculations inside of
    its reasoning budget). Instead, it&#x27;s more compute efficient to spend some
    percentage of rollouts training models with reasoning disabled, on problems that
    they are calibrated to have a good solve rate on without reasoning. This improves
    the cognitive core&#x2F;latent reasoning directly which translates to fewer total
    tokens needed to solve problems, and harder problems that a model can solve. And
    it&#x27;s more realistic, considering that humans don&#x27;t need an inner monologue
    to solve many problems (even hard ones, e.g. a flow state).
