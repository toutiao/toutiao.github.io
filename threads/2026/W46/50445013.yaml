  author: devmor
  text: There&#x27;s no efficient validation function for optimization problems. If
    there was, most NP-hard problems wouldn&#x27;t exist.<p>You have to approach those
    with a goal of &quot;be better than x&quot; rather than &quot;be exact&quot;.<p>Caveat
    that I am an amateur in this field, but given the Traveling Salesman problem in
    your example, if we aren&#x27;t allowed to use an existing solver to check against,
    I&#x27;d aim for a suite of validation functions that certify different parts
    of reaching the solution like:<p>- validate properties of the logic that have
    to hold up, such as &quot;shifting the order of my list of cities alone should
    never change the outcome&quot;<p>- validate that the outcome never reaches above
    or below certain bounds that we know aren&#x27;t possible due to trivial understanding
    of the problem<p>- validate that the outcome is always below some other algorithm
    we know is inefficient<p>Essentially, for most logic problems, checking validity
    is exponentially simpler than deriving a solution, but with optimization problems
    specifically, we are validating that the outcome <i>is not wrong</i> rather than
    <i>is correct</i>.
