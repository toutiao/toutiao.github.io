  author: GauntletWizard
  text: Fraud has been the fastest growing sector for about 20 years now. Much of
    this is movement of previously simply scammy products into actual scams. The kinds
    of things that you used to find advertised on late night television are now supercharged
    by Amazon availability, by ads that can directly target likely marks, and by the
    terrible state of reviews; it&#x27;s so easy to manipulate that there&#x27;s effectively
    zero correlation between quality and reviews on any major site, and paradoxically
    the sites actually selling products are the least awful at this.<p>This is only
    the start, though, because growing even faster are obviously criminal exploitations.
    Flat out forgeries dominated the Amazon marketplace due to Amazon&#x27;s binning
    practices. This ruined the margins and destroyed the reputations of every quality
    vendor. They have reversed this course, but too late, the quality vendors mostly
    went under or were bought up by scammers to ride their reputations, and we are
    left with marketplaces full of fly-by nights. Every major retailer dropped their
    quality to zero to keep up.<p>And last, we get to do the brazen criminality, pig
    fattening scams, tech support scams, identity theft, criminal gangs raiding supermarkets
    en-mass, and all manner of wire fraud. These are growing even faster, as an aging
    population has provided ample prey for these sorts of scams. They are generally
    headquartered overseas and effectively immune from prosecution.<p>It is not all
    Doom. These are problems that have been dealt with before. There is an idiom that
    has softened with use, &quot;wild west&quot;, that accurately describes this.
    The solution, historically, was the posse system, state authorized activity that
    otherwise looked an awful lot like vigilante justice. We haven&#x27;t demanded
    that yet, but we will soon.
  score: 0
