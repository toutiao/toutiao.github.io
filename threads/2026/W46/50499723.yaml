  author: ht_th
  text: I went looking for a new job a couple of months ago. As before, I uploaded
    my CV to a bunch of career sites, but didn&#x27;t get any reaction at all. Not
    even from recruiters, who, when I was looking for a job 5, 10 or 15 years ago,
    who start spamming me with unsuitable jobs almost immediately after uploading
    my CV.<p>So I applied to jobs myself. However, because a lot of these career sites
    don&#x27;t put in relevant details in the job descriptions, I now used AI to find
    the companies behind the vague job descriptions. That worked like a charm!<p>Once
    I found the companies, I checked if they had any job openings listed on their
    website and applied through their website.<p>I applied to six job listings. Three
    companies didn&#x27;t bother to react at all, including one from HN&#x27;s &quot;Who&#x27;s
    hiring&quot; page. The other three companies reacted to my message, two were a
    possible match, and went to in person interviews etc. One of them I picked for
    my new employer.<p>All in all, it took a couple of weeks from actively looking
    for a job to finding one.<p>However, I had my CV up for quite a while, but looking
    for a job passively didn&#x27;t do a thing at all. That&#x27;s decidedly different
    from the early 2000s and 2010s.
