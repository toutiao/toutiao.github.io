    I think what original article says is, «if the company is broken and you are not in position to fix it, you should not seek to be the one paying for the brokenness». What this article convincingly explains is «the company being broken is bad, actually», and how to do better.
    However, it is in fact better if companies that insist on staying broken do not get sacrifices from employees. Large tech companies are not worth any effort they are not paying for in liquid assets. Working at a C-quality organisation is already settling for mediocrity, doing A-quality work there just lets the company deal more damage.
    The original article is about maintaining access to getting anything done at all, and also to getting anything rewarded, at a broken company one cannot fix. I don't think that the (good at what it actually is!) response about how not to be so broken is a true «Contra», and I don't think that extrapolating from way-less-broken companies to more-broken ones is a safe activity.
