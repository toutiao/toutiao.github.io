  author: nirui
  text: WireGuard by itself is bare. Currently it don&#x27;t have a &quot;proper&quot;
    (&quot;official&quot;) way to make custom transport for it. Thus if you have to
    do it, the task is no different than writing a UDP proxy.<p>But that UDP proxy
    is then an independent program, with no awareness on the states of the WireGuard
    instance, thus the proxy have to run in a very dumb&#x2F;blind way. That&#x27;s
    not ideal.<p>If you want to write a network proxy, it&#x27;s the best for the
    proxy to know as much user intent as possible, so for example it knows which request
    should be retried, which should be given up as fast as possible if encountered
    a fault, and which request should just be rerouted to another server, etc.
