  author: aborsy
  text: You didn&#x27;t get it. It would be more clear if you implement it.<p>With
    these wrappers, peers also install and run wrapper and unwrapper services, to
    encapsulate udp packets into websocket frames and vice versa. For example, the
    software that proceses incoming packets from the internet could be wstunnel listening
    on 443&#x2F;TCP. This layer converts the websocket TCP traffic to wireguard UDP,
    which wireguard would then decrypt. Wireguard could even listen to local host.<p>In
    popular implementations, this layer could have notable attack surface, particularly
    because it often provides additional features, such as obfuscation behind https,
    authentication, TLS client certificate validation, etc. I recall Debian has a
    minimal package which does only UDP to tcp parsing and conversion, which is written
    in C and not maintained. That layer could be insecure, and may lead to code execution
    on server before wireguard is even involved.
