  text: "&gt;My interpretation of OP is that they trust Wireguard’s code to be secure
    - random wrappers, somewhat less so.<p>There is not such thing as &quot;wireguard
    code&quot;. Wireguard is a protocol, and &quot;the security of wireguard&quot;
    is the inability of the attackers to read the contents of the stream. This is
    not affected by the wrapper, because a wrapper is no more hazardous than the high
    seas, i.e. the Internet.<p>Speaking of implementation code. There are three wireguard
    implementations that I am aware of: Go, Linux, and OpenBSD. I am quite sure that
    none of those are bug-free, but adding a wrapper around wireguard packets has
    NO effect on the security of the implementation. The implementation is receiving
    packets from &quot;something&quot;. This something can be either the net, or the
    wrapper, or even &#x2F;dev&#x2F;urandom"
