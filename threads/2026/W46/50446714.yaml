  author: aborsy
  text: 'Trivially, any layer on top very much influences the security. It usually
    runs on the same server, and in fact is often combined with wireguard code into
    a new VPN. In fact there are additional layers: firewall code, networking stack
    code, VPN, rest of OS. Just recently there was a critical vulnerability in Linux
    kernel TCP connection handling code. It wouldn&#x27;t matter if OpenVPN listens
    to TCP connections on the same server: attacker may become root before meeting
    the VPN.<p>You can write a bare wapper in few hundreds lines of python, but it
    won&#x27;t be robust to resume connections etc. The next step up is something
    like ProxyGuard referenced in this post, but look at repo to see the size of the
    code. It&#x27;s this software that listens to open port, and if it has vulnerabilities,
    there will be remote code execution on the wireguard server. Then we have more
    featureful software such as wstunnel that are much bigger.<p>Most if not all software
    changes with platform. That&#x27;s trivial.<p>I have dealt with this issue for
    a while.<p>Update: It seems you acknowledge the issue when you say in another
    comment &quot;as long as the remote attacker does have sudo privilege&quot;. First,
    remote attacker may get root. Second, even if someone runs as a non root user
    on the same wireguard server, that&#x27;s equivalent to that person bypassing
    the wireguard plus logging in as that user, which is worse. Authenticating to
    the server is an additional step that they would have to do even if they bypass
    the VPN.'
