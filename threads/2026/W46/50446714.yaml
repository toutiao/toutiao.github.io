  author: breakwaterlabs
  text: 'LLMs are not the tool for this. LLM calls operate in tokens per second with
    latencies of tens of seconds. That is 3-9 orders of magnitude too slow, and solves
    the problem wrong.<p>Tunnel protocols require formalization and deployment, and
    this generally happens over months to years.<p>&quot;Detectors&quot;-- network
    admins and vendors, fundamentally -- can generally ship detections in days-to-weeks
    when the detection is robust enough.<p>You can flip this asymmetry somewhat with
    private protocol shapes (&quot;stealth&quot; or &quot;chameleon&quot; modes) that
    ship out with proprietary client updates, but good &quot;detectors&quot; will
    have automated systems building detections for these updates as they ship.<p>The
    way you evade these detections is by being small enough to escape notice, or by
    developing a mathematically robust way of making your protocol indistinguishable.
    That is unfortunately extremely difficult, because web browsing traffic tends
    to be bursty and sporadic, and tunnels tend to be inherently less so-- if you
    pipe 10 connections over 1 tunnel, it will tend to flatten the traffic spikes
    when compared with 10 direct connections (== 10 spikes). Not only that, any major
    tunnel provider endpoint is going to have a disproportionate amount of this unusual
    traffic flowing to it, made more notable by its lack of a major web presence (site,
    video platform).<p>Fundamentally, detecting that something is encrypted is not
    difficult, nor is characterizing the 99% of traffic that is &quot;legitimate&quot;
    HTTPS: common patterns, common destinations. The rest is more forgiving of false
    positives, and it turns out that you do not need to stop all &quot;evader&quot;
    traffic; simply slowing the experience or introducing packet loss is highly effective<p>-
    Regular users will assume it&#x27;s just the internet doing internet things<p>-
    Tunnel &#x2F; VPN users will rightly assume that this is the jank that comes with
    VPN usage, and will be discouraged from continuing use'
