article:
  url: https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/
  title: Gemini 4 Carbon is now available
  fetch_status: success
  content: "# Gemini 4 Carbon is now available\n\nNov 10, 2026\n\n- x.com\n\n- Facebook\n\n-
    LinkedIn\n\n- Mail\n\n- Copy link\n\nDevelopers, enterprises, scientists, and
    consumers can now try our latest frontier model.\n\nKoray Kavukcuoglu\n\nSVP,
    Google DeepMind and Chief AI Architect, Google\n\n- x.com\n\n- Facebook\n\n- LinkedIn\n\n-
    Mail\n\n- Copy link\n\nYour browser does not support the audio element.\n\nToday,
    we’re making Gemini 4 Carbon available to developers, enterprises, scientists,
    and consumers. Carbon is our strongest model with frontier performance in cybersecurity
    capabilities and long-horizon agentic workflows across complex knowledge work,
    software engineering, and scientific reasoning.\n\nTwo weeks ago, we released
    Carbon to a set of cybersecurity defenders via our Fairwind Program. Following
    our recent launch of Gemini 4 Argon, Carbon pushes the frontier even further.
    Argon remains the ideal choice for the majority of software engineering and knowledge
    work, while Carbon is built for tasks that test the limits of a model’s intelligence
    like complex, multi-step coding and debugging and open-ended scientific research
    and discovery — using more tokens than Argon to explore thoroughly, reason deeply,
    and run extended verification loops.\n\nAcross independent benchmarks designed
    to test model performance in real workflows, Carbon pairs frontier accuracy with
    practical production economics. It ranks #1 on CursorBench 4.0, Perplexity’s WANDR,
    and Zapier’s AutomationBench at more than 2X lower cost per task compared to the
    next best external model.\n\nTo put Carbon’s capabilities to work on larger and
    complex projects, we’re previewing /swarm in Google Antigravity, turning a single
    prompt into a coordinated team of agents you can track in real time. Developers
    can assign Carbon to roles that demand the deepest reasoning, like architectural
    design, coordination, and auditing, while pairing it with faster, lighter models
    across parallel isolated workspaces and adversarial verifiers that test every
    change.\n\nGemini 4 Carbon is available via the API in Google AI Studio and Gemini
    for business for all paying developers and enterprises, at the same introductory
    price 1 as Gemini 4 Argon ($2 per million input tokens and $10 per million output
    tokens). It is also rolling out to all Google AI Ultra subscribers in Google Antigravity,
    the Gemini app, and AI Mode in Search.\n\n## Higher-precision knowledge work,
    artifact generation, and data analysis\n\nAcross legal, finance, and enterprise
    operations, Gemini 4 Carbon combines frontier visual understanding, reasoning,
    and exhaustive retrieval to synthesize grounded insights across large sets of
    dense documents and data. It follows strict schemas and formatting to generate
    polished and precise spreadsheets, presentations, and reports.\n\nExisting benchmarks
    don’t adequately capture how agents reason natively over dense files with charts,
    images, blueprints, schematics, and tables, so we partnered with Artificial Analysis
    to launch the new Multimodal Knowledge Agent (MKA) benchmark that tests a model’s
    multimodal performance in agentic workflows. Carbon ranks #2 while being more
    than 6X lower in average cost per task compared to the top performing model.\n\nUsing
    Google Antigravity’s new /swarm feature, a team of Gemini 4 Carbon agents turned
    historical photos and engineering plates into an interactive Three.js 3D exhibition
    of the Eiffel Tower's 1887–1889 construction from a single prompt.\n\nWith seven
    public City Council planning PDFs (206 extracted engineering drawing views) and
    a single prompt, a multi-agent Carbon team using Google Antigravity’s /swarm feature
    built an interactive 906K-triangle Three.js reconstruction of Google’s Platform
    37 office across 10 overnight loops.\n\nIn Google Antigravity, Gemini 4 Carbon
    built an interactive multiscale textile visualizer based on an academic paper,
    modeling a virtual-fiber finite element framework with interactive 3D yarn meshes,
    110-fiber polar tracking, and dynamic stress-strain curves with minimal prompting.\n\nIn
    pre-release evaluations, Carbon matched the performance of the best model tested
    on deep financial research on Hebbia’s E2E Financial Agentic evaluation, and ranked
