  author: jen729w
  text: 'I use 1Password&#x27;s `op` for this, but with an allowance: my dev environment
    keys.<p>I found I was getting fingerprint fatigue. Do I need a fingerprint request
    <i>every</i> time my dev server wants to connect to dev Supabase? No. That&#x27;s
    expected, and zero risk. There&#x27;s no data there.<p>I worried that a nefarious
    request would be auto-approved by me. When you see 20 requests a day, your muscle
    memory just reaches for the sensor.<p>So I have a separate 1Password vault that
    a service account [0] can read. That token is in my environment as OP_SERVICE_ACCOUNT_TOKEN,
    which the `op` tool understands.<p>It also has access to a vault with &#x27;AI-safe&#x27;
    keys that I want Claude to be able to access without asking me.<p>Now, these requests
    work invisibly. And when I see a fingerprint popup, it&#x27;s unusual, and I don&#x27;t
    auto-approve by habit.<p>I also keep an item called &#x27;_One-day keys&#x27;
    in a separate vault. (The underscore just pushing it to the top of the list for
    easy access.)<p>It has prod keys, mostly restricted read-only. If required, I
    move that over to the open vault. Claude knows this item and has instructions
    to remind me to move it back out when it&#x27;s finished what it was doing.<p>[0]:
    <a href="https:&#x2F;&#x2F;www.1password.dev&#x2F;service-accounts&#x2F;get-started"
    rel="nofollow">https:&#x2F;&#x2F;www.1password.dev&#x2F;service-accounts&#x2F;get-started</a>'
