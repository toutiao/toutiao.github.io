  author: mavam
  text: |-
    One fundamental problem with agentic development is that accessing the secure enclave key requires human presence. If you&#x27;re running headless and aren&#x27;t logged in, Secretive (not sure about others) will not be able to access the enclave, even when you only chose &quot;notify&quot; and not &quot;touchid&quot;.<p>This is why I&#x27;m skeptical that the approach can scale reliably, even though I&#x27;m relying on it today. (Yes, PATs would fix this, but the enclave model is what I&#x27;m trying to retain for now.) What I&#x27;ve done instead is wrote a small daemon that sets the SSH authentication socket and does agent forwarding. This works when I&#x27;m traveling with laptop...but not yet from my mobile phone.<p>Example:<p><pre><code>    Laptop                                   Remote Mac
       ┌─────────────────────┐                  ┌──────────────────────────┐
       │ Secretive           │                  │ ssh &#x2F; git commit -S      │
       │ (Secure Enclave)    │                  │          │               │
       │        ▲            │  ForwardAgent    │          ▼               │
       │        └── ssh ─────┼─────────────────►│  ~&#x2F;.ssh&#x2F;agent.sock       │
       │                     │                  │  (stable proxy)          │
       └─────────────────────┘                  │      │          │        │
                                                │      ▼          ▼        │
                                                │  forwarded   local       │
                                                │  laptop      Secretive   │
                                                │  agent       (if you sit │
                                                │              at this Mac)│
                                                └──────────────────────────┘
    </code></pre>
    NB: I&#x27;m not using Rex instead of herdr and because Rex uses its own protocol, I always need to have one SSH tunnel to reset the remote agent socket. Not optimal, but it works. All of this feels wrong from a UX perspective, and it feels like I&#x27;m holding on too hard on secure enclave for what my use cases are. Feedback appreciated!
  score: 0
