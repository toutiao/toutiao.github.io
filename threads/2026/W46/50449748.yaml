  author: Vegenoid
  text: To prove possession of a private key, one needs only to sign something with
    that key (this is how SSH key auth works). This is how things like the macOS Secure
    Enclave operate - the private key is stored in a separate hardware chip that only
    exposes an interface to sign something with that key, never to actually present
    the key. To obtain the key would require having physical access to the computer,
    ripping it open, and performing advanced deconstruction and analysis of that chip.
  score: 0
