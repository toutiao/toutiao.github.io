  text: Can echo this, I&#x27;ve also fallen foul of keychain behaviour. In my case
    I found a lookup that passed the account name as raw bytes instead of text didn&#x27;t
    match my item. On macOS it matched all items with a blank account (strictly, generic
    password items), which on my computer meant items from GitHub CLI, Malwarebytes,
    and Adobe Creative Cloud. The app I was building silently used one of those as
    its key, and would change whenever one of those apps would update its entry. The
    fix was to make sure the account is passed as a string and that it has a service
    name so that lookup either matches exactly my item or none. The API takes a loosely
    typed dictionary, so wrong types throw no errors, just different behaviour. I
    now always test against the real keychain and not a mock.
