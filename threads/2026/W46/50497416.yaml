    # Demystifying phone unlocking tools: A technical overview.

    _7 May 2026_ -[Research](/categories/research)

    This post is a written description of a presentation titled _Phone unlocking tools and where to find them_ that we have delivered privately to different events and organizations, including [Primavera Hacker 25](https://phacker.org/), the [Freedom of the Press Foundation](https://freedom.press), and the [Public Interest Technology Group](https://pitg.network). It provides a technical overview of how commercial forensic tools compromise mobile devices, focusing on the specific attack surfaces exploited at each stage of the device lifecycle. Further posts will focus on sample analysis, and defenses. See also the previous posts of this serie:

    - [Cellebrite and the routine use of digital surveillance in Italy](https://osservatorionessuno.org/blog/2025/03/cellebrite-and-the-routine-use-of-digital-surveillance-in-italy/)
    - [A deep dive into Cellebrite: How it came to be](https://osservatorionessuno.org/blog/2025/03/a-deep-dive-into-cellebrite-how-it-came-to-be/)
    - [A deep dive into Cellebrite: Android support as of February 2025](https://osservatorionessuno.org/blog/2025/03/a-deep-dive-into-cellebrite-android-support-as-of-february-2025/)

    ## Introduction[#](#introduction)

    Commercial phone unlocking tools are not magic. They exploit the same classes of vulnerabilities that security researchers publish about at conferences and in academic papers. What makes them distinctive is not the novelty of the techniques, but the systematic commercialization of exploitation: acquiring or developing exploits for each hardware and software combination, and reaching a certain degree of stability, packaging them into automated workflows that require minimal operator expertise.

    This post aims to demystify the technical foundations of these tools. The attack vectors available to a forensic examiner with physical access to a device are constrained by well-understood boundaries: the boot chain, the trusted execution environment, the secure element (when present), and the kernel’s peripheral driver stack. This post mostly details Android internals, however iOS equivalent concepts are technically similar.

    Much of the background research referenced here comes from [Quarkslab](https://www.quarkslab.com/), whose extensive publications on TEEs, and Android’s data encryption architecture have been invaluable to understand these tools. Their work, alongside reporting from [Amnesty International’s Security Lab](https://securitylab.amnesty.org/) and other NGOs, and analysis by the [GrapheneOS](https://grapheneos.org/) project, provides the empirical basis for the claims made in this post.

    ## Hardware security architecture[#](#hardware-security-architecture)

    Before examining attack vectors, it is necessary to understand the hardware security architecture of modern Android devices. The following sections describe the components that forensic tools must eventually hack or bypass.

    ### The System-on-Chip: Normal World and Secure World[#](#the-system-on-chip-normal-world-and-secure-world)

    Modern ARM-based mobile processors implement TrustZone, a hardware security extension that partitions the processor into two execution environments: the **Normal World** and the **Secure World**. The Normal World runs the Android operating system, user applications, and the Linux kernel. The Secure World runs a separate, minimal operating system, the **Trusted OS** , along with small, specialized applications known as **Trusted Applications (TAs)**.

    ![SoC diagram showing Normal World and Secure World partitions, with the TEE running Trusted Applications and communicating with an optional Secure Element over SPI](/blog/2026-05-01-demistifying-phone-unlocking-tools-soc.svg)
    _SoC diagram showing Normal World and Secure World partitions, with the TEE running Trusted Applications and communicating with an optional Secure Element over SPI_

    The two worlds share the same physical processor cores but are hardware-isolated: the Normal World cannot directly read or write Secure World memory. Communication between the two happens through a monitor, a piece of code running at the highest privilege level (EL3 on ARMv8), which handles context switches triggered by Secure Monitor Call (SMC) instructions. Each physical processor core effectively provides two virtual cores, with the Non-Secure bit in the Secure Configuration Register determining which world is active at any given time.

    The Trusted OS hosts critical security services. Two are directly relevant to device unlocking:

    - **Gatekeeper** : responsible for verifying user credentials (PIN, password, pattern). It implements rate-limiting to throttle brute-force attempts and, upon successful authentication, issues a signed authentication token.
    - **Keymaster** : the key management service that stores and operates on cryptographic keys. Some keys are _authentication-bound_, meaning they can only be used after Gatekeeper has issued a valid token.

    Different SoC vendors ship different TrustZone implementations. Google (and AOSP in general) uses [TrustyOS](https://source.android.com/docs/security/features/trusty); Qualcomm uses QSEE; Samsung uses TEEGRIS (on both Exynos and MediaTek SoCs in Samsung devices); Huawei uses TrustedCore; Trustonic’s Kinibi is also often found on MediaTek and Exynos SoCs. The security properties vary between implementations.

    ### The Secure Element[#](#the-secure-element)

    A Secure Element (SE) is a physically separate, tamper-resistant hardware chip that provides an additional layer of security beyond the TEE. Unlike the Secure World, which runs on the same SoC as the Normal World, a Secure Element is an independent processor with its own boot chain, its own firmware, and its own cryptographic key storage.

    In the Android ecosystem, the Secure Element is exposed through the **StrongBox** API (introduced in Android 9). Google’s Pixel phones, starting with the Pixel 3, include the **Titan M** chip as their Secure Element, that was later upgraded with the **[Titan M2](https://docs.cloud.google.com/docs/security/titan-hardware-chip)** from Pixel 6 onward. On Apple devices, the equivalent is the **Secure Enclave Processor (SEP)**.

    The Secure Element’s role in device encryption is to hold key-encryption keys and enforce rate-limiting for credential verification in hardware that the main SoC cannot tamper with, even if fully compromised. This is an important distinction: on a device without a Secure Element, compromising the TEE is sufficient to extract or bypass credential-derived keys. On a device with a Secure Element, the attacker must additionally compromise a separate, hardened chip.

    Unfortunately, only flagship devices typically include a Secure Element. Most mid-range and budget devices rely solely on the TEE for credential protection. This architectural gap is the single most important factor determining the chances that a device has to resist forensic unlocking when powered off.

    ### The boot chain[#](#the-boot-chain)

    The boot chain establishes a _chain of trust_ from immutable hardware to the running operating system. Each stage verifies the integrity of the next before executing it.

    ![Boot flow diagram showing Boot ROM → Preloader → Trusted OS and Monitor (Secure World) / Bootloader → OS (Normal World), with the Secure Element running its own boot chain](/blog/2026-05-01-demistifying-phone-unlocking-tools-bootflow.svg)
    _Boot flow diagram showing Boot ROM → Preloader → Trusted OS and Monitor (Secure World) / Bootloader → OS (Normal World), with the Secure Element running its own boot chain_

