  author: adrbn
  text: 'The thing is that both Wine and DXVK would still need the original x86 code
    to run through Rosetta. Which is exactly what I wanted gone. Here it’s all ARM64
    before the game even starts. DXVK is also a Windows DLL that reaches Vulkan through
    Wine so without Wine I can’t really use it. And BO2 is 32-bit, so every Windows
    and D3D11 call has to be adapted anyway! Going straight to Metal ended up simpler
    :) No benchmark against them yet but it’s on my list! There is a short explanation
    in the README too if you&#x27;re curious: <a href="https:&#x2F;&#x2F;github.com&#x2F;adrbn&#x2F;bo2-mac#pipeline"
