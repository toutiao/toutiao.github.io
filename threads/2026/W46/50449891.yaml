  author: adrbn
  text: 'Yes, it uses two already existing tools for the heavy lifting. Remill lifts
    the x86 machine code to LLVM IR, and LLVM then compiles that IR to ARM64. And
    no, nobody translates the assembly by hand luckily, not me nor the agent. All
    of these 150k functions go through this automatic chain I explained before.<p>What
    I wrote with Claude is basically everything else: custom LLVM passes, a hand-written
    runtime that replaces the Windows calls, a Direct3D 11 to Metal layer and the
    shader translation! Plus fixing the crashes one by one by iterating and playing.
    All details are in the Pipeline section of the README if you&#x27;re interested:
    <a href="https:&#x2F;&#x2F;github.com&#x2F;adrbn&#x2F;bo2-mac#pipeline" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;adrbn&#x2F;bo2-mac#pipeline</a>'
  score: 0
