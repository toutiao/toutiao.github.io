  author: saagarjha
  text: "&gt; Remill lifts each function to LLVM IR, a chain of our own passes rewrites
    that IR, and the result is linked with a Win32 runtime written by hand, whose
    Direct3D 11 is drawn by Metal. There is no Wine and no JIT: the game runs as native
    code, in one process. About 150,000 functions are translated across the three
    executables. Only the short sequences that the copy protection hides run in a
    small x86 interpreter, and so does any code the translation missed, so a hole
    is built to cost speed rather than crash the game."
  score: 0
