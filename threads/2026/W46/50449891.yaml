  url: https://github.com/adrbn/bo2-mac
  title: 'GitHub - adrbn/bo2-mac: Call of Duty: Black Ops II statically recompiled
    from 32-bit x86 Windows to native ARM64 macOS: Remill → LLVM IR, a hand-written
    Win32 runtime, Direct3D 11 drawn by Metal. No Wine, no game files. · GitHub'
  fetch_status: success
  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n# bo2-mac\n\nCall of Duty: Black Ops II, statically recompiled
    from 32-bit x86 Windows to native ARM64 macOS. Campaign, Zombies and multiplayer
    against bots, built on your Mac from your own Steam copy.\n\nEnglish · 中文\n\n 
         \n\nWhy · Abstract · Method · Limits · Repository · Legal Beta, 2026-11-03
    · measured on one Apple M1 (4 performance + 4 efficiency cores, 16 GB)\n\nCampaign
    (Angola), Zombies (Town) and multiplayer (Hijacked, against bots) on an Apple
    M1, recorded while playing; the number in the top right corner is frames per second,
    and the screen recording itself costs some, mostly in the campaign. 80-second
    video (MP4, 20 MB)\n\nImportant\n\nThis repository contains no game file and no
    translated game code. It turns your own Steam copy of Black Ops II into an app
    for your Mac, on your Mac. The game's code ends up inside that app, so nobody
    can hand you a ready-made one: each player builds their own, and it may not be
    shared. Unofficial fan project, not affiliated with Activision, Treyarch or Microsoft.
    To play, buy the game. Beta: read what has and has not been proven.\n\n## Why\n\nBlack
    Ops II never came out on Mac, and on Apple Silicon it was not really playable
    before. AppleGamingWiki lists it as unplayable under CrossOver and not supported
    under Rosetta 2. What remains is a Windows ARM virtual machine in Parallels, with
    reports ranging from 1 frame per second in matches on an M1 Max to 60–80 on M3
    and M4 (MacGamingDB). Here the game is translated once, before it starts, into
    a native ARM64 app: 51–60 frames per second on a base M1, with no Windows and
    no virtual machine. Being native also means it can be fixed and extended like
    any Mac app: split-screen, which the PC version never had, is in progress.\n\n##
    Abstract\n\nbo2-mac takes the three executables of Black Ops II, the campaign
    (t6sp.exe), Zombies (t6zm.exe) and multiplayer (t6mp.exe), and turns their x86
    machine code into ARM64 machine code ahead of time. Remill lifts each function
    to LLVM IR, a chain of our own passes rewrites that IR, and the result is linked
    with a Win32 runtime written by hand, whose Direct3D 11 is drawn by Metal. There
    is no Wine and no JIT: the game runs as native code, in one process. About 150,000
    functions are translated across the three executables. Only the short sequences
    that the copy protection hides run in a small x86 interpreter, and so does any
    code the translation missed, so a hole is built to cost speed rather than crash
    the game.\n\nOn an Apple M1 the campaign runs at 51–60 frames per second, and
    every mission loads and hands over to the next one, down to the end credits. Zombies
    is played solo on six maps through the game's own menus at 57–60. Multiplayer
    is played against bots through its real menus, eleven game modes, at 53–60. One
    app, Black Ops II.app, opens the campaign, and the CAMPAIGN / ZOMBIES / MULTIPLAYER
    entries of each menu switch to the other game.\n\nNothing is downloaded from anyone
    but you: the converter reads the executables of the copy you bought, checks them
    byte for byte, and builds the app on your machine.\n\n## Results\n\nFrame rate
    counts the drawables really presented to the screen, checked against the screen
    and the Metal HUD.\n\nWhat you can play\n\nAll three modes: keyboard and mouse,
    or a DualSense as XInput through GameController.framework; sound on; movement
    keys follow their position on your keyboard (ZQSD on AZERTY, WASD on QWERTY),
    unless you bound them yourself in the game's options.\n\n## Pipeline\n\nIn five
    steps, all on the player's Mac:\n\n- Check. The converter accepts only the exact
    Steam build of each executable, checked by SHA-256. The launcher asks the Steam
    client on your Mac whether the signed-in account owns the game, and refuses otherwise.\n\n-
    Catalogue and lift. Ghidra lists the functions of your own executable; Remill
    v6.0.1 lifts each one to LLVM IR. Five patches to the lifter are carried in tools/remill-patches/,
    among them the x87 rounding mode, and one that forks a running Remill for each
    function instead of reloading its x86 semantics.\n\n- Fold. Remill's IR is correct
    but slow: every guest memory access, flag and x87 push is a call or a store into
    a State structure. Our passes rewrite it before clang -O2: guest reads and writes
    are inlined, lock sequences become hardware atomics, the guest ret stays inside
    the lifted code, and the x87 stack is promoted to locals.\n\n- Runtime. runtime/
    implements the Windows imports the game really calls, with exact stdcall arities
    (the Steam API ones taken from Valve's public headers). Guest memory is one 4
    GiB mapping. Direct3D 11 is a fake-COM layer over Metal; DXBC shaders go through
    HLSLcc. XAudio2 goes to CoreAudio, and the videos are decoded natively with libvpx.\n\n-
    Threads. Guest threads start as coroutines on one host thread, which removes most
    sources of non-determinism and makes a run replayable. The fast configuration
    moves the server, the render backend, sound mixing and decoding, and the job workers
    onto real host threads. ARM is not TSO, so this needed real memory barriers.\n\nThe
    copy protection is executed, not bypassed. The game hides integrity checks behind
    hardware exceptions, single-step traps and code it decrypts into the heap. A small
    x86 machine built on Unicorn (x86_guest_vm.cpp, heap_code.cpp) runs exactly those
    sequences and hands control back to the recompiled code. No check result is forced
    and no key is placed by hand.\n\nA hole in the translation is built to cost speed,
    not a crash. When the game reaches x86 code that was never lifted, the same machine
    runs its original bytes (interp.cpp) and gives control back to the recompiled
    code at the next translated block, call or return. Each interpreted address is
    logged ([INTERP]).\n\nThe online service is answered locally. Zombies and multiplayer
    expect Demonware; a responder written from the game's own requests (dw_local.cpp)
    answers the lobby, storage and ticket on your Mac. Nothing leaves the machine.\n\nThey
    translate Windows calls at run time and keep the x86 code under Rosetta. Here
    the x86 code itself is gone: it is ARM64 machine code before the game starts.
    DXVK and DXMT are PE DLLs that reach their native backend through Wine's unixlib
    mechanism; this port has no Wine, and its Direct3D 11 is its own layer over 32-bit
    guest memory. Only shader translation was needed from outside, and HLSLcc, a plain
    C++ library, covers it.\n\n## Findings\n\nEach entry is a symptom seen on screen,
    the cause that was measured, and the effect of the fix.\n\nF1 · The lifter ignored
    the x87 rounding mode. In Zombies the prone view shook. fistp rounded to nearest
    where the game had asked for truncation, inside the network codec of the view
    height. The height received by the client was wrong on 8 samples out of 8, and
    on 0 out of 8 after a Remill patch and a re-lift of the codec.\n\nF2 · One reserved
    bit of the x87 control word. A campaign mission froze in an effects loop, only
    with real threads. The lifter stored bit 6 of the control word differently from
    real hardware. A one-line Remill patch and four re-lifted runtime functions fixed
    it, with no slowdown.\n\nF3 · A CPU feature flag changes the algorithm. Our IsProcessorFeaturePresent
    answered \"no SSE2\", so the C runtime took its x87 ceil, which rounded to nearest
    under our runtime. An effect then sampled index −1 forever: two missions froze.\n\nF4
    · Our own log caused the stutter. Hitches of 170–430 ms were the render thread
    blocked in write(): our log, redirected to a file on a nearly full disk. Sending
    it through a pipe to a child process took the hitches per run from 12 and 8 to
    0 and 0.\n\nF5 · Shader translation moved constants by 4 bytes. HLSLcc placed
    a float2 after a float at offset 24 where Direct3D reads it at 20. 31 of 2,664
    shaders were affected, among them the eyes and the reticles.\n\nF6 · The protection
    has to run. The options menu froze 8 times out of 8. An integrity check rewrites
    its own return address to "
