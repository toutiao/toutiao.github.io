  text: |-
    I just got Beacon approved for the Apple App Store, it’s a mobile app for answering “which friend is free to talk right now?”<p>It’s a one-to-many phone call that only one person can answer. Send a beacon to a group, and everyone gets pinged at the same time. The first person who answers gets connected for a 1-1 call, and for everyone else the signal drops silently. It does not log any missed calls so there’s neither pressure to answer nor pressure to return calls.<p>Overall it works really well!
    It works best if you&#x27;re able to join with at 4+ friends&#x2F;family you’d like to chat with more. I have dozens of connections in the app now and it feels like magic to me. I press the button and get a random friend!<p><a href="https:&#x2F;&#x2F;trybeacon.chat&#x2F;" rel="nofollow">https:&#x2F;&#x2F;trybeacon.chat&#x2F;</a>
