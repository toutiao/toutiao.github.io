  author: jesse__
  text: Thank you :)  One of the nice things about working on a game engine is it&#x27;s
    actually a large collection of small projects disguised a big one.  That let&#x27;s
    my squirrel-brain jump from thing to thing and have enough variety to not get
    bored.<p>I just started using AI a few months ago.  My smoke-test was &quot;can
    it write a simple memory allocator&quot;.  Until recently, every time I tried
    to get an AI to write an arena or simple buddy-style heap allocator, they just
    vomited all over themselves.  To my surprise, the last time I tried, the AI absolutely
    crushed it; it unearthed tricks I didn&#x27;t even know about in one shot.  Since
    then, I&#x27;ve been using AIs to do the boring, rote work that effectively just
    boils down to me typing in something that&#x27;s in my head.  For that, they&#x27;re
    great.  I typically sketch out the thing I want it to make, then tell it to fill
    in the blanks.  Sometimes they still go off the rails, but all in all it&#x27;s
    a useful tool.<p>Where I&#x27;ve found they still struggle is making any architectural
    decisions, or where performance matters.. even a little bit.  They often make
    super braindead decisions when it comes to performance for no discernable reason.  They&#x27;ll
    course correct when you tell them to, but I&#x27;ve had to keep a close eye on
    the output and reign it in frequently.  Asking an AI to design a system from the
    API level hasn&#x27;t ever returned a good result for me.. I always do that work.<p>All
    in all, I feel like using AI will probably make me a better programmer in the
    long run, contrary to popular belief.  They accelerate the boring stuff I already
    know how to do, which leaves me with more time to work on the edge of my skill
    level where I grow as an engineer.  Guess we&#x27;ll see in 5 years.
