  author: atguy
  text: "Hence (<a href=\"https:&#x2F;&#x2F;hencegame.com\" rel=\"nofollow\">https:&#x2F;&#x2F;hencegame.com</a>)
    is a modern twist on Einstein&#x27;s puzzle, with fun picture clues instead of
    text. It&#x27;s a free online daily puzzle, the same for everyone, where every
    puzzle is always solvable by pure deduction with no guessing.\nI launched it October
    5. The hardest part was the graphics, making each picture clue unique enough that
    you recognize it immediately and know what category it&#x27;s from, even at small
    sizes. Easier said than done.<p>Every puzzle is run through a verifier first to
    make sure it is solvable without any guessing, just by pure logic, so there is
    always a next step to find, which is what makes it feel so rewarding. There&#x27;s
    a hint system to help and it works really well if I do say so myself . No account
    needed to play.<p>From what I&#x27;ve been hearing so far, the people who have
    checked it out are enjoying it and can&#x27;t wait for tomorrow&#x27;s puzzle,
    so that&#x27;s a good sign. \nI&#x27;d love to hear how the difficulty feels,
    and whether the pictures read clearly."
