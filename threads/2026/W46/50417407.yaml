  author: jesse__
  text: I&#x27;ve been working on a voxel game engine called Bonsai for ~10 years.<p>Probably
    the most interesting thing about it at the moment is the editor. The world, and
    most things in it, are represented as collections of SDFs. More accurately, they&#x27;re
    density fields, but, potato-tomato.  One neat thing about representing the world
    as SDFs is they&#x27;ve been thoroughly researched and documented by a guy named
    Inigo Quilez, and they have a lot of nice mathematical properties. For example,
    you can do a smooth union of arbitrary SDFs to get nice rounded contours where
    shapes join.<p>The world generator and editor operate almost entirely on the GPU.  The
    terrain and editor pipeline is a three stage process. The first stage is user-configurable;
    users write an arbitrary &#x27;shaping&#x27; shader in GLSL. The second stage
    is a fused stage; it does a convolution on the output of the first stage to compute
    a normal, runs a second user-configurable &#x27;decoration&#x27; function, and
    finally applies edits. Edits are collections of SDFs that are &#x27;compiled&#x27;
    from a graph structure on the CPU into a bytecode, and interpreted in the shader.
    The last stage runs another convolution to compute the final normal, then packs
    an occupancy bit, color, and normal down into a 32-bit representation, suitable
    for transfer back to the CPU. I expect I will expand this to include additional
    user-level bits for encoding biome type and GPU-driven spawning.<p>The entire
    shader pipeline is one fused &#x27;ubershader&#x27; .. everything is bound at
    startup and the shader is dispatched three times, incrementing a &#x27;Stage&#x27;
    uniform on each dispatch. This strategy conceptually makes the driver overhead
    nearly zero, and the profile agrees.<p>The final step in the process is giving
    the CPU a chance to spawn additional entities and structures after generation.
    This is not completely fleshed out, but the bones are there. The idea is that
    the results of the GPU work are passed back to the CPU, which can run arbitrary
    callbacks to spawn additional edits and entities. Once spawning is complete, the
    result is meshed using a fast binary meshing algorithm and uploaded to the GPU.
    I keep 16 bits of data per voxel from the GPU work, 1 bit of occupancy, and 15
    bits of normal for collision response, which works out to half a megabyte per
    chunk. At the moment I only keep chunks which contain a piece of the world surface,
    and discard the rest. Surface chunks are dense, and may be compressed in the future,
    but keeping this amount of data scales to world sizes greater than 1B voxels cubed,
    which seems good enough for now.<p>In terms of raw performance, GPUs are ridiculous.
    My 3080ti mobile gets somewhere on the order of 500B-1T perlin samples per second
    with a naive perlin implementation. Compared to FastNoise2, that&#x27;s about
    1000x more, which sounds wrong since my GPU only has 35x more capacity, but, that&#x27;s
    what my initial profiling said. That number is the marketing number; the real
    throughput is significantly less due to multi-stage nature of the system, but,
    there&#x27;s a lot of headroom for improvement. For example, dropping the backing
    textures from 32bit to 16bit roughly quadruples performance. Since we only really
    care about the surface where values are near zero, I believe using 8 or 16 bit
    is a viable option, though this claim will require a fair amount of study to validate.<p>All
    in all, I&#x27;m pleased with how this is all working out. My original goal was
    to write a highly flexible system giving users both easy-to-use tools and granular
    control over the final output. I think I&#x27;ve done a fairly good job at that,
    and the fact it&#x27;s also super fast is the cherry on top.<p>I&#x27;ll do some
    shameless self-promotion and leave some links here for anyone interested in looking
    at the engine, language code, or some pretty pictures.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;scallyw4g&#x2F;bonsai"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;scallyw4g&#x2F;bonsai</a><p><a
    href="https:&#x2F;&#x2F;github.com&#x2F;scallyw4g&#x2F;poof" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;scallyw4g&#x2F;poof</a>
