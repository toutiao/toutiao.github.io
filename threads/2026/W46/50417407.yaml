  author: kstenerud
  text: 'I&#x27;m building a self-hosted media server for video, like Plex or Jellyfin.
    I&#x27;ll be opening the beta in about a month.<p>Features:<p>- No paywalls, bandwidth
    limiting, or crippled behavior. No login required.<p>- Single go binary, deployed
    via Docker.<p>- Reaches your home server from anywhere with no port forwarding,
    no VPN and no paywall, even behind carrier-grade NAT. No Tailscale required.<p>-
    Cast to another device. You can use any logged in device as a playback screen.<p>-
    Watch together, with voice support: Play synced video with friends, and also chat
    voice. You can also mix this with casting to another device.<p>- Dialogue boost
    and loudness levelling for every film.<p>- Real adaptive quality, tuned for a
    home&#x27;s upload.<p>- Hardware transcoding, full quality in every supported
    browser.<p>- A library that explains itself: what the scanner saw, why each title
    matched, guesses marked for you to check, and a disk that&#x27;s gone missing
    shown as missing instead of its titles silently vanishing.<p>- Your data stays
    yours: The database is a rebuildable index, metadata corrections can be written
    back as NFO files that Kodi and Jellyfin read, and an automatic backup keeps what
    can&#x27;t be re-derived (watch state, preferences, shares).<p>Security is a primary
    concern:<p>With the ever increasing pace of hacks and CVEs and AI-assisted intrusion,
    you simply can&#x27;t be too careful anymore.<p>- The core (which talks to the
    network, handles the API, users and the database) never opens a media file or
    runs FFmpeg.<p>- A separate media node does every file read and every transcode.
    It has no network access and talks to the core only over Unix sockets.<p>- FFmpeg
    runs under Landlock and seccomp with no path to the file and no socket. All it
    can do is read and write streams.<p>- Small dependency tree on an allowlist, pure
    Go with no cgo, secrets sealed at rest and never logged.<p>- The library can be
    mounted read-only, so even a full compromise can&#x27;t encrypt or delete your
    media.<p>- Cryptographically signed chain for servers and releases.<p><a href="https:&#x2F;&#x2F;orpheum-app.com&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;orpheum-app.com&#x2F;</a>'
