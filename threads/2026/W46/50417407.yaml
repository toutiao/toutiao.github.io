  author: srid68
  text: '1-year part-time experiment: can you build a large project with AI writing
    the code and AI plus deterministic tools verifying&#x2F;guiding&#x2F;enforcing
    it for structural and behavior consistency, without a human reading the code?<p>I&#x27;m
    building a polyglot web framework in 15 languages, with C# and Lean4 as the reference
    implementations. Structural and behavioral audits using deterministic tools check
    that every port stays consistent with the reference. It&#x27;s about 1.8M lines
    now. I have not reviewed the code&#x2F;neither have i verified the behavior tests
    except at the time of giving requirement and never seen some of the language code
    at all.<p>The question is how far can we produce &quot;working code → correct
    code [Possible] → good code [Unknown]&quot; with deterministic audits correcting
    structure, ai mistakes and behavior validation.<p>So far the quality looks acceptable
    with lots of correction of AI output done without looking, but it isn&#x27;t fully
    verified.<p>Line counts per language, with changes since August: <a href="https:&#x2F;&#x2F;claude.ai&#x2F;artifact&#x2F;5f1m1pTM7tZ4boQzwsoAG7"
