  author: streetfighter64
  text: The issue here is just that the permission model does not allow for all use
    cases. On iOS you can either give an app access to all your images, or select
    a subset (this interface is somewhat annoying to use, and could be improved),
    or just give it temporary access to a single image using the &quot;share&quot;
    dialog.<p>It&#x27;s been a long time since i used Android, but why don&#x27;t
    they just implement the ability to grant access to a given folder? The you could
    grant your preferred image viewer access to all your images, without it having
    access to your other documents. And apps that you might just want to give access
    to a select few images, like social media, could stay with the per-file permission.<p>The
    fact that the full path isn&#x27;t revealed just seems like a sensible thing to
    do. Even if you give an app access to a full directory, why would it need to know
    where that directory is located?
