  author: streetfighter64
  text: Right click -&gt; paste just triggers a paste event. Menu -&gt; paste just
    triggers a paste event. The key is that apps can just present the option, not
    initiate it silently in the background.<p>Consider how the file picker works.
    If you press a button in the app, then a file picker is opened, but the app gets
    no access to anything until you select a file to give it. Clearly, this is way
    better than giving the app read access to your whole HDD.<p>Though, that&#x27;s
    the way everything used to work previously, and a lot of apps still do that, but,
    only after the user has granted them full file system reading. So if an app is
    very specialized, perhaps it could be granted &quot;full clipboard access&quot;,
    though I at least can&#x27;t think of any app I&#x27;d give that.
  score: 0
