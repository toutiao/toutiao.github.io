  author: iggldiggl
  text: "&gt; The issue here is just that the permission model does not allow for
    all use cases.<p>The problem is that for anything more complicated than a simple
    &quot;grant access to this one file&#x2F;directory&quot; both the permission system
    and its associated UI also get pretty complicated pretty quickly.<p>Like &quot;opening
    a file with a certain app will allow that app to read that file&quot; is pretty
    easy to understand, but &quot;opening a file with a certain app will allow that
    app to read all other files within that directory&quot; already less so (but is
    precisely what would be needed for an image viewer).<p>Eventually you get to a
    point where it&#x27;s easier to just fall back to a generic &quot;all files&quot;
    permissions, which then leads back to arguments whether users can be trusted with
    it.<p>&gt; The fact that the full path isn&#x27;t revealed just seems like a sensible
    thing to do. Even if you give an app access to a full directory, why would it
    need to know where that directory is located?<p>You wouldn&#x27;t necessarily
    need the full path of the directory, but you need at least some kind of handle
    to it, and Android doesn&#x27;t give you one when you&#x27;re receiving a single
    file from another app. And since the file path is hidden from you even if the
    file is local and not cloud-based or something else, you can&#x27;t even ask the
    user for directory viewing permissions yourself (or maybe you&#x27;ve even already
    been granted those permissions, but you still can&#x27;t use them because you
    don&#x27;t know where that file resides).<p>The technical justification was that
    the new file sharing API could in theory be backed by anything, not just the local
    file system, so they didn&#x27;t want apps to rely on a local file system path
    and therefore made the design to force apps away from it (only semi-successfully,
    because at the same time the default implementation still somewhat leaks the original
    path, so you could try to reverse-engineer it from that, plus when I tried to
    research a bit, it seemed that possibly even without root there still was some
    way of getting a file system path back from a raw file handle, provided of course
    that the file really was backed by something local, and not cloud storage).<p>So
    far so fine, but it does break some stuff. E.g. it messes up LRU lists (opening
    the same file once via app A and once via app B creates two distinct LRU entries
    in app C), plus like I said, even if the receiving app already holds sufficient
    file system permissions itself, it cannot use them because it doesn&#x27;t (officially)
    know which file and which directory it&#x27;s dealing with.<p>And like I said,
    for the use case of an image viewer being able to browse adjacent files, it needs
    to know not only the specific file it&#x27;s supposed to open, but also its containing
    folder.<p>&gt; It&#x27;s been a long time since i used Android, but why don&#x27;t
    they just implement the ability to grant access to a given folder?<p>They did,
    but in combination with the new file sharing API that is precisely what broke
    advanced UX workflows like wanting to browse adjacent files in an image viewer.
    (Or being able to view local HTML files that aren&#x27;t monolithic MHTML archives
    – if you pick such a file from a file browser to open it in your web browser,
    the web browser won&#x27;t be able to open any associated subresources or follow
    any links to other local files.)"
