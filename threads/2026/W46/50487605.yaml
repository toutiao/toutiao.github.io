  author: streetfighter64
  text: I think allowing any program to <i>read</i> the clipboard at all is a huge
    mistake. The way it <i>should</i> work is that it&#x27;s entirely safeguarded
    by the OS, and the only time an app can see the contents is when it receives them
    in a Ctrl+V event initiated by the user. This is the way most users, even non-technical,
    expect it to work, I&#x27;m pretty sure.
