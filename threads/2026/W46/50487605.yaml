  author: potato-peeler
  text: You have entirely misunderstood&#x2F;misread the comment.<p>streetfighter64
    said “ event initiated by the user.”<p>Copy&#x2F;paste can be initiated multiple
    ways, including through many entries. That does not matter. What matters is ,
    the application has zero knowledge on what is on the clipboard. It can’t read&#x2F;modify&#x2F;delete.
    It can only allow the user to trigger an action, and the result of that action
    is transparent to the user.<p>Applications shouldn’t have access to contents inside
    the clipboard, otherwise you get in situations like this - <a href="https:&#x2F;&#x2F;cybersecuritynews.com&#x2F;fake-captcha&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;cybersecuritynews.com&#x2F;fake-captcha&#x2F;</a>
