  author: streetfighter64
  text: 'The point is to not make the data available to the app before the user has
    indicated that they want the app to process it: by pressing Ctrl-V (or clicking
    somewhere).<p>Sure, it&#x27;s impossible in practice to design something that
    can never be circumvented by a dedicated app developer (using a hidden paste button
    that&#x27;s triggered by another user interaction, or what have you). But having
    good defaults makes it much less likely that apps that are at least pretending
    to be legitimate, such as Facebook, Google, etc. would implement an outright exploit
    (the harder the exploit is to implement, the harder it&#x27;s to claim plausible
    deniability if it&#x27;s found).<p>Implementing a perfectly secure HTTP server
    is probably also impossible in practice, but that doesn&#x27;t mean that we should
    just give up on trying.'
