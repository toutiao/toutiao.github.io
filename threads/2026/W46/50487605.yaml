  text: |-
    &gt; Consider how the file picker works. If you press a button in the app, then a file picker is opened, but the app gets no access to anything until you select a file to give it. Clearly, this is way better than giving the app read access to your whole HDD.<p>For some values of better – e.g. I&#x27;m browsing through a folder with some (the) file explorer, and then decided to open an image with my favourite image viewer.
    The UX-friendly expectation is that I can then continue browsing (go to the next or previous image) from right inside the image viewer.<p>File system sandboxing however insists that the image viewer isn&#x27;t allowed to access anything else, so instead I either have to go back all the way to the file explorer to open the next image, or at the very least invoke some kind of OS-blessed file open dialogue for the image viewer to be allowed to continue.<p>The latter is the official situation on Android, and it&#x27;s rather suboptimal, to put it that way. (Made worse by the fact that the blessed way of opening a file with another app also tries to hide that file&#x27;s location from the receiving app, so even if my image viewer e.g. already had sufficient file system permissions to access that file and its whole folder, without some hacky workarounds it still couldn&#x27;t offer me to continue viewing other pictures inside the same folder because it doesn&#x27;t really know which file it&#x27;s currently opening.)
