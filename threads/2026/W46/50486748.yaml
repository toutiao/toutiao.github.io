  text: "&quot;all defined axiomatic systems have sentences about the far past and
    future that cannot be defined in those languages with certainty.&quot;<p>This
    is often misunderstood or misstated to mean that there are some things that are
    unknowable or unable to be solved. (I&#x27;m not saying that&#x27;s what you were
