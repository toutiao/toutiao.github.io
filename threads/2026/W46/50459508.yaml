  author: pvaldes
  text: They confirmed it with radiocarbon data, that is known to have their limits
    in modern samples since decades. Rings in the bones are known to be difficult
    to read and not very trustable. I know. I tried it. Is a nightmare. Unlike tree
    rings, this rings fuse, fork and vanish all the time. Different observers will
    come with different ages, to the point of the protocols for otoliths directly
    advise to take the average of three measures taken by three different people.
    You repeat the read one year after and obtain a different age for the same sample.<p>In
    cartilaginous fishes I bet that is much much worse. In young fishes the method
    can give a clue, but being able to count 200-400 clear rings is not realistic.
    At that point the error intervals are too big. We can&#x27;t even be sure that
    we are not registering 200 meals instead.<p>Of course everybody just swallowed
    the glittering result as a proven fact, without much critical thinking, because
    it made for a great history. Saying &quot;we don&#x27;t know&quot; wouldn&#x27;t
    be publishable.<p>The only real way to prove this is to keep the animal in captivity
    from their birth so you are totally sure of his real age.
