    this all doable. DeepSeek itself is quite fast, but I crave even more speed (and
    ideally something hosted outside of China).<p>Fireworks and Baseten seem to be
    the leading providers that are available to a solo dev like myself, and support
    any reasonably decent modern models (DeekSeek 4.x, GLM 5.x, etc). Fireworks has
    been a real dud, but Baseten in FAST mode has been absolutely amazing. Not cheap
    - but I find it substantially cheaper than Terra &#x2F; Sol (low), etc. I haven&#x27;t
    found Haiku to be smart enough to be useful.<p>DeepSeek (the provider) and beyond
    seem to hit the sweet spot to keep me mostly in-context, so I don&#x27;t need
    4 parallel work items to feel productive. So roughly 200tps or greater. Vanilla
    Baseten is ~400 tps, and FAST is 700-800 avg.<p>Price wise, Deepseek hosting is
    extremely cheap, Baseten is a step up - maybe 5x or more, and FAST mode is well
    beyond that. But I still find myself dual wielding Deepseek and Baseten FAST when
    I need the speed.<p>The other benefit: for my own work in very limited hours,
    I&#x27;m more than happy to pay for answers to come back faster.'
