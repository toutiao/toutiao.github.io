  author: AStrangeMorrow
  text: 'Yeah I use my phone heavily too now. I have my setup running on a PC, and
    ignoring code review the vast majority of my time is refining issues.<p>Process
    is:<p>1. I describe the issue (voice mode) then I wait &#x2F; do something else.<p>2.
    Model looks at my repo, my gitlab issues board, stuff currently worked on etc<p>3.
    Model creates a gitlab issue and presents it.<p>4. Model starts a grilling session.
    That is: it will keep asking me questions until everything for the task is addressed:
    design decisions, unclear elements, default behaviors, edge cases, conflicts with
    current behavior. Usually around 5-30 questions.<p>5. Loop of me answering and
    it asking a new batch of questions<p>6. Model updates the issue with all the decisions
    that were made.<p>7. Model with start implementing once I give the go. Once done
    it runs tests&#x2F;validation and sends me a MR to review. (That takes anywhere
    from 5 mins to 2h depending on the task complexity, but on larger projects just
    the final test&#x2F;validation&#x2F;no regression step can be 10 mins)<p>8. I
    review &#x2F; merge<p>The grilling is nice because for the most part if solves
    a lot of future issues by not allowing the model to make decisions you didn’t
    agree with, and it front-loads all questions so it can work uninterrupted. Very
    rarely does it need to ask a question during implementation.<p>But yeah most of
    my time is helping the agent define all the boundaries of the problem, decide
    how to break goals into issues (such as high level PM issues into technical issues)
    and so on.<p>Also one chat per issue which limits chat compaction.'
