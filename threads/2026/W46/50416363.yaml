  author: godelski
  text: |-
    <p><pre><code>  &gt; A lot of people are suggesting taking breaks, thinking before typing
    </code></pre>
    While I think these are actually some of the best suggestions they really do require a massive overhaul of our work culture. The technology field has put speed ahead of all else, including profits. We&#x27;ve frequently shown that we&#x27;re penny wise but pound foolish. The industry is overrun with FOMO.<p>I think so much of this is because everything is hype driven, from the core. To even get funding we have to promise hopes and dreams. While that started out reasonable it has escalated into selling promises that are obtuse at face value. Things that are more fantasy than Sci-Fi, or things that while they&#x27;re even possible they&#x27;re wildly impracticable simply due to the laws of physics (data centers in space?). Hell, people even propose things that would violate tons of international treaties AND have little to no practical value[0].<p>AI isn&#x27;t the cause of any of this, but it is a catalyst. We need to have serious discussions about this now before the snake eats itself[1]. I don&#x27;t know why we pretend that these things aren&#x27;t foreseeable. Many of them are widely discussed long before they come to fruition. But I do also believe that this lust for speed forces blinders onto many. They don&#x27;t have time nor energy to think creatively[2] or they fool themselves. AI increased speed, but that doesn&#x27;t mean it increased velocity. That velocity still comes down to the engineers using this tool[3].<p>This new tool has forced us to come face to face with one of our oldest and greatest enemies: understanding. And I do mean old, Dijkstra wrote about it long ago[4].<p>We still can do great things in this age, but we&#x27;re forced to take a step back and look at what has actually driven progress in the past. And if anyone claims to have a clear fool proof formula, well... that&#x27;s just magic.<p>[0] Yes, giant mirrors in space are, in fact, space weapons. If you couldn&#x27;t figure that out on your own you have some serious reflecting (pun intended) about your career choice as an engineer <a href="https:&#x2F;&#x2F;www.reflectorbital.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.reflectorbital.com&#x2F;</a><p>[1] At least fully. Google&#x27;s latest earning reports already show that. And it isn&#x27;t like years ago people called out Google&#x27;s plan for AI search and how it would affect ad revenue. That discussion even started long before Gemini!<p>[2] Something that drives innovations and consequently, profits!<p>[3] It is still a tool. It is not magic. It never has been and it never will. Maybe you don&#x27;t call it magic. Maybe you give it a &quot;technical explanation&quot; and conclude that it isn&#x27;t. But actions speak louder than words and it isn&#x27;t hard to see that people have treated code like magic since day one, it shouldn&#x27;t be surprising that it&#x27;s become more prolific with AI.<p>[4] <a href="https:&#x2F;&#x2F;www.cs.utexas.edu&#x2F;~EWD&#x2F;transcriptions&#x2F;EWD02xx&#x2F;EWD288.html" rel="nofollow">https:&#x2F;&#x2F;www.cs.utexas.edu&#x2F;~EWD&#x2F;transcriptions&#x2F;EWD02xx&#x2F;EWD288...</a>
