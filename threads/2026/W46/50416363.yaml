  author: gb2d_hn
  text: It&#x27;s interesting watching everyone build their solutions to this new
    world of problems. Mine has been to double down on my markdown notes, extending
    <a href="https:&#x2F;&#x2F;app.etherpk.com" rel="nofollow">https:&#x2F;&#x2F;app.etherpk.com</a>
    so that every task (plain markdown) can be viewed under it&#x27;s wikilink (or
    several) on a kanban board. An MCP server knows how to interact with the notes
    graph. I copy a reference to the task, hand it to an agent, and the agent works
    with blocks under the task from there. It basically means I can give the agent
    really rich context up front - images, excalidraw drawings etc and the agent can
    update the task as it goes. Having everything on a kanban board makes it easier
    to step away from a task to work on whichever really needs my attention and come
    back. Putting this together with herdr has been very productive. I still have
    to watch the brain fry, but it is helping. Don&#x27;t know if I&#x27;m selling
    the idea but I feel like I&#x27;m on to something after experimenting with various
    systems similar to what the author is suggesting. I&#x27;m working on making a
    product of it. The onboarding needs some streamlining but it&#x27;s available
    to use for free for local graphs.
