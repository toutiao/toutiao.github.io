  author: brodydung
  text: 'The part I keep coming back to isn&#x27;t the payment rail, it&#x27;s what
    happens before the payment. At $0.005 a search the unit price looks trivial, but
    the agents I&#x27;ve run don&#x27;t search once — they re-search the same question
    with slightly different phrasing when the first results don&#x27;t quite fit,
    and each retry is a fresh paid call. Removing the API key also removes the one
    place I used to see that happening, the monthly bill.<p>So the missing piece for
    me isn&#x27;t 402 itself, it&#x27;s a budget envelope around it: a per-task cap,
    client-side dedup&#x2F;caching of near-identical queries, and a receipt ledger
    I can audit after the run. Without that, making payment frictionless mostly makes
    runaway spend frictionless too. Does Brave&#x27;s proxy do any dedup or idempotency
    for repeated identical queries, or is that entirely left to the harness?'
