    errors at 2026&#x2F;11&#x2F;12 17:33 UTC. As of writing it&#x27;s 2026&#x2F;11&#x2F;13
    09:44 UTC and we are still encountering a full outage, so 16 hours and 11 minutes.<p>With
    a SLA calculator [1], assuming no other downtime this month and entering 16h11m,
    we get:<p>* Yearly SLA: 99.82%<p>* Monthly SLA: 97.78%<p>Next, what is the actual
    agreement? I found an SLA document list here [2].<p>I downloaded Service Level
    Agreement for Microsoft Online Services (WW) English (2026&#x2F;10&#x2F;01). There&#x27;s
    a heading for Exchange Online that says:<p>Uptime Percentage : Service Credit<p>&lt;
    99.9% : 25%<p>&lt; 99% : 50%<p>&lt; 95% : 100%<p>Which seems to agree with what
    the original commenter said for this month.<p>[1] <a href="https:&#x2F;&#x2F;uptime.is&#x2F;reverse"
    rel="nofollow">https:&#x2F;&#x2F;uptime.is&#x2F;reverse</a><p>[2] <a href="https:&#x2F;&#x2F;www.microsoft.com&#x2F;licensing&#x2F;docs&#x2F;view&#x2F;Service-Level-Agreements-SLA-for-Online-Services"
