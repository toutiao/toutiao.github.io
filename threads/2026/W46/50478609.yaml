  author: sobiolite
  text: 'Not so long ago, I was assigned to a project that had to be built on Azure
    due to client requirements. Because we were underhanded and it was an MVP, we&#x27;d
    elected to use PaaS as much as possible: Postgres Flexible Server, Static Web
    Apps, Easy Auth, etc. On paper, these all looked fine. They had lots of documentation,
    example projects, GitHub repos, blogs, roadmaps, etc. Then we started building
    and running into issues, and we realised a bunch of these offerings were basically
    unmaintained. There were features that had been stuck in &quot;preview&quot; status
    for literally years. The blogs and roadmaps were no longer updated, and issues
    were piling up in GitHub.<p>I started digging into the historical blog posts,
    GitHub comments, etc. and I realised everybody at MS who&#x27;d been working on
    them, SWEs, PMs, architects, etc. had either left the company, or moved to other
    teams. And the one constant about the internal moves was that people were now
    working in some &quot;AI&quot; related project or product. Literally, I didn&#x27;t
    find a single person who wasn&#x27;t now working on AI.<p>Clearly, there has been
    a huge internal push to get into AI. Resources have been reallocated, and anything
    non-AI related has been starved. And since working on an AI project is probably
    considered the only route to advancing your career, anybody with any ambition
    has moved to a team doing something AI-related. The result is that huge numbers
    of products and teams doing vital but non-AI related work have been hollowed out,
    and now we&#x27;re seeing the consequences.'
  score: 0
