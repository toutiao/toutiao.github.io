    \ \n[Blog archive](/laurie/blog/archive.html)\n\nEarlier this year I [wrote a
    post on yk](/laurie/blog/2026/retrofitting_jit_compilers_into_c_interpreters.html),
    which can automatically add JIT compilers to C interpreters. Since then we’ve
    applied yk to more interpreters, fixed various bugs, and improved performance
    notably. Towards the end of October I showed some data where on our benchmark
    suite[1](javascript:;) yklua is 2× faster than the PUC Lua interpreter it takes
    as a base.\n\nI was quite pleased with myself until someone brought me down to
    earth by asking “how do you know if this works for large interpreters?” It’s a
    fair question: PUC Lua is at least an order of magnitude smaller[2](javascript:;)
    than CPython or CRuby and who’s to say if it would work with much bigger interpreters?
    We had looked at CPython a year or so ago, but at that point yk was missing several
    obvious things that CPython would need, so we quickly moved on. A lot has changed
    since then, and a quick LLM experiment got far enough to suggest it would be worth
    looking again.\n\nHappily, having taken a deeper look, CPython not only works
    when adapted for yk as [ykcpython](https://github.com/ykjit/ykcpython)[3](javascript:;),
    but there are meaningful performance gains to be had — not only relative to normal
    CPython, but also relative to Python’s experimental JIT[4](javascript:;). Roughly
    speaking, this is the result of 3-4 days’ work on ykcpython directly; there was
    a separate week and a half of generic yk bug fixing necessary to get to the point
    that I could look at ykcpython itself.\n\nHere are the “final” numbers from my
    brief odyssey on ykcpython and the AWFY benchmark suite:\n\n| | cpython | cpython\\_jit
    | ykcpython |\n| --- | --- | --- | --- |\n| Bounce | 19.27±0.20 | 11.09±0.05 |
    **10.09±0.04** |\n| CD | 32.21±0.23 | **26.10±0.08** | 29.33±0.16 |\n| DeltaBlue
    | 7.43±0.02 | **6.21±0.02** | 7.62±0.04 |\n| Json | 11.81±0.08 | 10.93±0.05 |
    **9.98±0.03** |\n| List | 15.01±0.22 | **8.10±0.05** | 10.44±0.09 |\n| Mandelbrot
    | 11.66±0.28 | 6.94±0.27 | **4.20±0.07** |\n| NBody | 18.97±0.13 | 12.77±0.12
    | **10.98±0.02** |\n| Permute | 22.97±0.34 | **17.95±0.13** | 21.04±0.05 |\n|
    Queens | 13.18±0.14 | 9.65±0.11 | **8.32±0.03** |\n| Richards | 54.80±0.20 | 40.56±0.40
    | **33.18±0.17** |\n| Sieve | 23.34±0.06 | 17.02±0.07 | **13.74±0.06** |\n| Storage
    | 22.03±0.19 | 19.94±0.08 | **19.67±0.04** |\n| Towers | 20.46±0.25 | **12.65±0.05**
    | 13.67±0.04 |\n\nIn this table `cpython` is “normal” CPython 3.15.1; `cpython_jit`
    is CPython 3.15.1 with the experimental JIT turned on; and `ykcpython` is commit[31b4d387](https://github.com/ykjit/ykcpython/commit/31b4d3875a9a63184546d7065863d42b4e24c2fc).
    Times are in seconds (lower is better) with means and 99% confidence intervals
    bootstrapped from 30 process executions, running on a 64 core AMD EPYC 7773X Debian
    machine in `performance`mode ([download the repeatable experiment and the raw
    data](/laurie/blog/extra/2026/adapting_cpython_for_yk/adapting_experiment.tgz)).
    On each row the fastest entry(s) are shown in bold.\n\nA simple summary of the
    table is: `ykcpython` is faster than `cpython` on every benchmark except DeltaBlue
    (where it’s about 2.5% slower); and faster than`cpython_jit` on 8 out of 13 benchmarks.\n\nThe
    point of this post is not to pretend that ykcpython is in any way ready for people
    to use — it definitely is not! Nor is it to pretend that one can expect performance
    on a wider set of programs to be as good as the numbers above — it definitely
    won’t! My view is that benchmark suite performance is a hoop to jump through rather
    than an end in itself: a system which benchmarks well might perform poorly in
    the real world; but a system which benchmarks poorly nearly always performs poorly
    in the real world.\n\nRather, I wanted to use this post as a way of showing what
    it’s like to adapt an interpreter for yk[5](javascript:;): the stages I went through;
    and to give a sense of how the just under 450LoC I added were enough to achieve
    a meaningful effect. Luckily I had a sense that this might be a useful journey,
    so I was able to write enough stuff down to be able to flesh out this full post.\n\n##
    A quick refresher\n\nIf you haven’t read [the earlier yk post](/laurie/blog/2026/retrofitting_jit_compilers_into_c_interpreters.html),
    here’s a very brief refresher. Given a lightly modified C interpreter[6](javascript:;)as
    input, yk produces a VM with a meta-tracing JIT compiler as output[7](javascript:;).
    yk doesn’t aim to produce the fastest possible JIT compiling language implementation:
    rather, it aims to make the language implementation you know and love somewhat
    faster while retaining 100% compatibility. Put another way a “ykified” interpreter
    is a fork of the existing C version of the interpreter, with (hopefully!) a handful
    of adjustments.\n\nAs with any meta-tracing JIT compiler, yk identifies _hot_
    loops in the _guest_language (e.g. Lua or Python), and _traces_ the interpreter
    (i.e. records what the C code is executing while it is interpreting the guest
    language). It then optimises those traces and converts them to machine code.\n\nyk
    requires interpreters to tell it where potential loops in the guest language are
    via the `YkLocation` struct. Optionally – though if you want to get good performance,
    definitely necessary! – interpreter authors can add _optimisation hints_ that
    embed knowledge about the language or its common idioms of use such as “at this
    point this seemingly dynamic value almost never changes”. In general, working
    out where to put `YkLocation`s is relatively easy, but working out where to put
    hints requires a much greater understanding of the interpreter, and careful measurement
    to understand which do and don’t help.\n\nThe challenge I face when adapting an
    interpreter for yk is that I rarely know the interpreter well, if at all. Rather
    than trying to do everything at once, I have learnt to start off as simple as
    possible: I try and do the minimum changes that lead to some traces being recorded
    and compiled to machine code. This can be trickier than it seems: I’ve got to
    understand the build system[8](javascript:;), and work out where to put some semi-sensible
    `YkLocation`s. I’ve also learnt to make sure that the language’s test suite works
    from this very first step: keeping it working thereafter is not only much easier,
    but it lessens the number of times one attempts optimisations that are unsound.\n\nFor
    a simple interpreter, you might get a basic JIT compiler from an interpreter with
    fewer than 10LoC (Lines-of-Code) changed. For somewhat bigger interpreters, a
    few more changes tend to be necessary. For example, yk doesn’t like “threaded”
    interpreters that use `goto` between opcodes, because it doesn’t give it enough
    opportunities to intercede and see"
