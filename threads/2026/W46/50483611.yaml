  author: treyd
  text: Rust&#x27;s Allocator APIs have been around since 2016, less than a year after
    1.0, they&#x27;re just now <i>stabilized</i>.<p>The stdlib types that allocate
    have been generic (with default generic parameters) over the underlying Allocator
    used for a very long time.  All widely-used data structure libraries where it&#x27;s
    feasible&#x2F;reasonable to use other allocators also are already generic over
    the Allocator.<p>It won&#x27;t &quot;take time to retrofit&quot; because the language
    and ecosystem have already been prepared for it for 10 years.  For context, async
    syntax was introduced a few years after that and if you just started learning
    the language today you wouldn&#x27;t notice it wasn&#x27;t there in 1.0.
