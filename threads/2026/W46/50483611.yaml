  author: pron
  text: In critical low-level code, any kind of overloading - operator or otherwise
    - is something you&#x27;d rather not have.<p>By expressivity I don&#x27;t mean
    what characters you use in the conrecte syntax, but the number of lines needed
    to express an algorithm (up to a small constant). C doesn&#x27;t have C++&#x27;s
    expressivity because it lacks templates, and while you can sort of express that
    kind of thing with macros, it&#x27;s not all the way there. Zig, however, gets
    you all the way there (you might need to write matrix_plus instead of +, but the
    expressivity is the same).
