  author: tialaramex
  text: "&gt; Seems like it will be useful for use-cases like embedded where you&#x27;re
    restricted to certain parts of the library anyway. But the battle is kind of already
    lost for support at the level of Zig or Odin.<p>Odin in particular does a simply
    terrible job here. Take the most common need for allocations, a growable array
    type, in Rust Vec&lt;T&gt; and in Odin dynamic[T]<p>In Rust we only pay extra
    to store the allocator metadata if there <i>is</i> allocator metadata. If we&#x27;re
    content using the general purpose allocator Global with global metadata it&#x27;s
    free. In Odin we always need to pay to store an &quot;allocator proc&quot; function
    pointer and a (possibly unused) metadata pointer, so that&#x27;s 2x machine word
    worse for Odin. We pay this even if we never allocate, and indeed even if we <i>can&#x27;t</i>
    allocate, whereas of course in Rust that&#x27;s free.<p>But then when we do need
    to allocate, in Rust that&#x27;s a static dispatch <i>unless</i> our allocator
    specifically wants dynamic dispatch. So again for Global it&#x27;s just a static
    dispatch. But in Odin it&#x27;s <i>always</i> a slower dynamic dispatch.<p>The
    upside? To the extent there is one it&#x27;s probably the New Jersey style, ie
    it was simpler to implement Odin. Which is a benefit to Ginger Bill, but not to
    you as an Odin programmer."
  score: 0
