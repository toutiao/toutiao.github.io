  author: bunderbunder
  text: I’ve also experienced some unnecessary shenanigans related to blurring the
    distinction between primitive operations, and stuff that happens dynamically at
    run time such as method calls.<p>For a somewhat different example of the same
    general idea, look at how Java handles primitives and their boxed counterparts.
    = on two ints always compares their value. = on two Integers compares their pointers.
    But it uses flyweight instances for values up to 256, so in Java, whether two
    Integers with the same numeric value are equal according to the = operator depends
    on what that value is.<p>Then throw autoboxing and generics into the mix, and
    it suddenly becomes very easy to do refactorings that work fine in the unit tests
    (which tend to use small numbers) but fails in confusing ways in production.<p>This
    isn’t an example of operator overloading, of course. But I hope it more simply
    illustrates why, at least in certain problem domains, there’s value in being able
    to visually tell when surprising runtime shenanigans are and are not possible.
    And also to make it impossible to cross that boundary without touching all code
    that falls within the blast radius of that change.
  score: 0
