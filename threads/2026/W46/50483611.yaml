    than a strong statement of how things should be.<p>The point is, it’s a tradeoff.
    With overloading, exactly which code executes on a specific line becomes a bit
    more implicit because it depends on extra information from the surrounding context:
    the types of the arguments.<p>That comes with the usual tradeoffs. On the one
    hand, you could argue that the compiler is taking care of it for you, which saves
    the programmer from having to manually deal with it, and removes some visual clutter
    from the code.<p>But you can also argue that letting the choice of function be
    implicit means that a programmer who wants&#x2F;needs to keep track of exactly
    what every line of code is doing needs to carry all that contextual information
    in their own head, too. For this programmer, it’s adding to the mental burden.<p>I
