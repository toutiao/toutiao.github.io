    Programming languages are a deeply personal topic (not sure these days, some say it doesn't matter any more, others say it matters more than ever).
    Every 6 months, no kidding, I look at Go longingly. Native single binary deployment, nice quick compilation, non-fugly build system and tooling, okay-ish syntax[0], excellent ecosystem, pretty good performance OOTB, much to like!
    And then I go writing it, nope out in first 30 minutes and 6 months later the cycle repeats. For some reasons I just cannot stand those anemic enums[1], even before I get to error handling (yeah, I know).
    I like that Go.is out there, and people enjoy it, I really want to enjoy it, but turns out my brain doesn't really want to like it. Oh well.
    Hope to see Go around for another 17 years, just so I keep learning from a great attentive team behind it.
    [0]: I never quite gelled with Haskell/Ruby like statement-ish syntax, nor Python's significant whitespace
    [1]: no encapsulated values, no pattern matching, not to mention the fact that they're just bloody integers internally
