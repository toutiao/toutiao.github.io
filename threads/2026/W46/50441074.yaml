  author: uptrails
  text: I don&#x27;t think it&#x27;s that simple. In the early 2000s, Google won by
    showing up with an algorithmic solution to web spam. The algorithm <i>could</i>
    be gamed if you had sufficient resources, but it worked because there wasn&#x27;t
    all that much money at stake.<p>Then, they essentially bankrolled their enemy
    by giving websites a way to monetize spammy content. By the late 2010s, they started
    losing the battle for many types of organic queries - although many HNers forget
    that the most common and &quot;important&quot; search queries are things like
    &quot;Nike shoes&quot;, not &quot;an implementation of a Bloom filter in Rust&quot;.
    And then, in the 2020s, they pioneered LLMs and made the technology public, and
    drove a final nail in that coffin by making it possible to produce SEO spam on
    any topic, including Bloom filters, practically for free.<p>Now, they see AI answers
    as their salvation, steamrolling a variety of non-monetizable use cases that never
    really mattered to them. And this will probably work only until AI-poisoning SEO
    is in full swing, at which point Google will find themselves with dissatisfied
    users and diminished ad revenue.
