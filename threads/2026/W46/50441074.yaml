  author: Modified3019
  text: I’ve been using Kagi search for a while, and had no real complaints, as the
    search does what I’ve always expected it to do. For a while I completely ignored
    Kagi assistant because why the fuck would I want a slower and verbose version
    of a search that already worked fine?<p>In the past few months though, I’ve been
    heavily using the assistant set to use deepseek to assist with putting together
    a Minecraft 26.2 mod pack. It’s saved me so much time and frustration it’s unreal.
    Turns out there are certain things that are complex enough that regular search
    really isn’t all that great for.<p>For example, I can now do things like ask if
    there’s a mod that allows torch placement from the hotbar while holding something
    else, via middle click, compatible with Minecraft Java 26.2 neoforge, as the one
    I previously used is stuck on 1.21.1. And instead of spending 2-3 hours trying
    a bunch of keywords and combing through poorly named and documented mods, I can
    quickly get fairly reasonable confirmation that this doesn’t exist, along with
    some alternatives.<p>I can also hand it a GitHub source and asking it what needs
    to get changed to update a mod to newer versions, giving me an idea if doing so
    will get within my extremely limited coding capability. A real game changer is
    basically asking it for a tutorial, like what’s involved with fixing a model from
    an outdated resource pack for a recent version and having it work with Fresh Animations.
    This would previously have required many days of painful and frustrating searching.<p>I
    can also ask it for basic scripts, rather than spending time hoping to find something
    someone else already made. Such as taking ratings from my navidrome database,
    and writing them into tags in the related songs. Just the other day I asked it
    for a violentmonkey script that can take a Reddit comment with a video, and give
    me a url that yt-dlp can handle as is without having to dig through a bunch of
    nonsense manually. I would have never have had the expertise or time to learn
    to implement these things myself.<p>Of course, one must keep in mind that the
    knowledge the llm has has a time cutoff, but I’m frankly have so much of a better
    time than before.<p>I can now see myself using the next update of Claude to generate
    mods (the current version does not have much knowledge of Minecraft 26.2) with
    features I want. While I’m reasonably competent technically, actual coding is
    beyond me, and is far beyond my free time to learn.<p>While AI doesn’t replace
    my use of classic search wholesale, it does take a set of problems I was trying
    to poorly solve with classic search, and actually gives me what I want.
