  author: woodruffw
  text: 'There&#x27;s a discussion thread for email attestations here[1]. Those would
    support local builds.<p>But to take a step back: if you want attested builds because
    you think attestation is <i>itself</i> a gold star, then you&#x27;re working from
    the wrong priors. Attestations do not imply that a package is secure any more
    than a hash does; what they are is a cryptographic signature over a set of claims,
    which allows for <i>authenticated</i> auditing of a project&#x27;s state over
    time.<p>I think PyPI&#x27;s documentation does a good job of conveying this nuance[2],
    and that much of the opprobrium of attestations comes from people either not understanding
    that nuance or imputing conspiracies into it.<p>[1]: <a href="https:&#x2F;&#x2F;github.com&#x2F;pypi&#x2F;warehouse&#x2F;issues&#x2F;18007"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;pypi&#x2F;warehouse&#x2F;issues&#x2F;18007</a><p>[2]:
    <a href="https:&#x2F;&#x2F;docs.pypi.org&#x2F;attestations&#x2F;security-model&#x2F;#trustworthiness"
    rel="nofollow">https:&#x2F;&#x2F;docs.pypi.org&#x2F;attestations&#x2F;security-model&#x2F;#trustwort...</a>'
