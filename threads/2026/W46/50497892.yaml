  text: Have you considered that perhaps you are working from the wrong priors?<p>I
    believe your prior is that you expect people who read the PyPI page to understand
    what attestation means. I believe your prior is they will see a notice about &quot;not
    from a trusted publisher&quot; and not treat it like demerit or warning. I believe
    your prior is that seeing this message will get people to do more due diligence
    than they currently do, and that the due diligence will be relevant and appropriate.<p>Based
    on my experience with my users, I don&#x27;t have the same confidence.<p>I don&#x27;t
    understand what &quot;authenticated auditing&quot; means, so why should they?<p>What
    project state do people think is important to audit? My code repo is private,
    hosted on Sourcehut. My build system is private, done locally. The only thing
    I release is the pre-built binary package. There&#x27;s very little state to examine,
    and I can&#x27;t figure out why anyone cares.<p>I also have customers who buy
    a source code license. They have never asked for an audit of the project&#x27;s
    state over time.<p>I read the &quot;Security model and considerations&quot; document.
    I found it opaque, no doubt because the entire topic is foreign to me, but it
    doesn&#x27;t do a good job of explaining. Take the second paragraph:<p>&quot;The
    most basic type of attestation (the type enabled by default in pypa&#x2F;gh-action-pypi-publish)
    asserts that the project was published by an authorized publisher such as a particular
    CI provider in a particular code repository.&quot;.<p>I know pypa&#x2F;gh-action-pypi-publish
    is some sort of GitHub thing. I don&#x27;t use GH or third-party CI so that clarification
    does not help.<p>It doesn&#x27;t describe what &quot;authorized publisher&quot;
    means, other than a generic example of &quot;particular CI provider in a particular
    code repository&quot;. That phrase exists only once in the document. Is it different
    from a &quot;Trusted Publisher&quot;?<p>Why are the terms &quot;authorized&quot;
    and &quot;Trusted&quot; used, instead of something like &quot;affiliated&quot;?
    If someone is not a trusted publisher or an authorized publisher it&#x27;s is
    too easily misinterpreted as &quot;untrusted publisher&quot; or &quot;unauthorized
    publisher&quot;, which seems scary. If someone is not an affiliated publisher,
    &quot;unaffiliated publisher&quot; sounds less scary. (I&#x27;m not saying &quot;affiliated&quot;
    is the right word, only an example of a roughly appropriate word where the negation
    of it is not so scary.)<p>Then later, &quot;It protects against modification of
    a project after it was built&quot;.<p>I think that&#x27;s supposed to be &quot;modification
    of a <i>release</i> after it was built&quot;?<p>My use of &quot;project&quot;
    matches the one at <a href="https:&#x2F;&#x2F;docs.pypi.org&#x2F;using-pypi&#x2F;pypi-basics&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;docs.pypi.org&#x2F;using-pypi&#x2F;pypi-basics&#x2F;</a>
    &quot;A project is a collection of releases and files, and information about them.
    ... A &quot;release&quot; on PyPI is a specific version of a project.&quot; I
    <i>want</i> to modify the project with updated metadata as things change, and
    to make new releases.<p>Oh, and I can&#x27;t find a description of what &quot;build&quot;
    means in that document. It&#x27;s used as if everyone expects to know what it
    means, but a few years ago I learned that modern Python packaging uses &quot;build&quot;
    different than I do.<p>When I compile my Python&#x2F;C extension I &quot;build&quot;
    it. When I make a wheel I &quot;package&quot; it.<p>I believe that modern packaging
    calls the whole thing &quot;build&quot;? Or just the latter step?<p>Incidentally,
    &quot;python -m build --sdist&quot; on my project does not work as a replacement
    for &quot;python setup.py sdist&quot; because my setup.py includes a code generation
    step to get from a clean repo to the Python&#x2F;C extension files included in
    the distribution. I haven&#x27;t figured out the modern way to handle that. I
    think it&#x27;s because of the differences in philosophy of what &quot;build&quot;
    means, and what actions are allowed during different stages of the distribution
    process, which is why I think &quot;build&quot; needs a specific definition, just
    like &quot;project&quot; and &quot;release&quot; have specific definitions.
