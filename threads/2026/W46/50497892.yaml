  author: woodruffw
  text: "&gt; Which is great--but does not in any way require that the attestation
    can only be produced by working through one of a small set of recognized &quot;forges&quot;<p>That&#x27;s
    true, there&#x27;s some context elsewhere in these threads about how PyPI can
    enable email attestations. The short version is that PyPI wanted to make this
    work by default, which was trivial with Trusted Publishing (since it already provides
    a strong source of verifiable machine identity).<p>&quot;Why not a public key?&quot;
    is a good question, and the very short answer is that greenfield signing designs
    should not assume that all users are able to manage the secrecy of long-lived
    key materials, much less force them to make parameter decisions when (re)generating
    materials. This is the same mistake that the Web PKI made for decades, and has
    spent the last 15 years slowly untangling. The ideal setup is one where users
    demonstrate control over an identity, and then the signing scheme <i>binds</i>
    that identity to a short-lived signing key. That&#x27;s how email attestations
    work."
