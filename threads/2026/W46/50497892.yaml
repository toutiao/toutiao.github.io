  author: woodruffw
  text: 'Support for Codeberg is being discussed here[1]. I think there&#x27;s broad
    consensus among PyPI&#x27;s maintainers and admins that more publisher providers
    are desired, but we also need them to demonstrate strong key management and rotation
    controls due to the degree of trust and access that becoming a publisher provider
    grants them (effectively, they become the PyPI credential broker for the projects
    that use their service).<p>(If you pan through that thread, you&#x27;ll note that
    one of open issues with Codeberg is that their underlying server wants to store
    OIDC private keys on disk at the moment. This is okay for small deployments of
    personal services, but not for something that PyPI needs to federate with and
    trust.)<p>[1]: <a href="https:&#x2F;&#x2F;github.com&#x2F;pypi&#x2F;warehouse&#x2F;issues&#x2F;19786"
