  author: woodruffw
  text: "&gt; The design itself should be able to scale for individual OIDC providers
    through webfinger and OIDC discovery like Tailscale does it[1], but it doesn&#x27;t
    look like it&#x27;s there yet.<p>This is the right idea, but it&#x27;s actually
    not that simple unfortunately: Trusted Publishing relies on per-IdP claims that
    are more precise than the `sub` claim (because doing pattern matching on the `sub`
    claim is brittle and prone to security problems). So we require publisher providers
    (OIDC IdPs) to provide distinct claims that we can match on. For GitHub and GitLab
    that&#x27;s things like the repository name, workflow filename, etc., while for
    others it might be distinct username and immutable ID claims, etc.<p>This is all
    downstream of OIDC-driven federation being a much weaker and more bespoke process
    than all parties would like it to be. I think the discourse around this could
    be much improved by people taking the time to understand these complexities and
    why they pose a challenge to groups with limited engineering resources (like PyPI)."
  score: 0
