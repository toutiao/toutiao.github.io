  author: woodruffw
  text: Attestations <i>are</i> code-signing. PyPI once supported PGP signatures on
    uploads, but as since disabled it because (1) only a tiny minority of users ever
    signed, and (2) many of the signatures and corresponding keys were either functionally
    insecure or unusable.<p>Both of these are latent problems when trying to use PGP
    in packaging ecosystems; the subset of ecosystems that successfully adopt PGP
    tend to have very different topologies (namely, small rings of trusted...publishers)
    rather than an &quot;anyone can publish&quot; architecture like PyPI has.
