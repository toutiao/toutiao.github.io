  author: msteffen
  text: Yeah, I look for opportunities to replace personal vibe-coded utilities with
    public projects for this reason.<p>Software still feels like this grand exploration
    to me—what&#x27;s the best way to use a computer? What&#x27;s the best way to
    express a program?—and a hackable text editor epitomizes that ethos (though I&#x27;m
    partial to neovim myself). Every time I install a plugin, I feel like I&#x27;m
    participating in a clinical trial of UX design.<p>I think a lot of us feel this,
    and the community will have to solidify the ethos that trying out other peoples&#x27;
    software is noble and healthy, exposing you to their ideas, even if it&#x27;s
    actually harder and worse in some ways than vibecoding.<p>(I also think, by extension,
    the OSS community will need a more developed ethics of project governance. This
    was a hot issue even before AI, e.g. the terraform license change. But when the
    default is a vibe-coded bubble, authors will need to communicate either<p>1. this
    is just code—use at your own risk, PR at your own risk, or<p>2. this is a community,
    here&#x27;s what we want for&#x2F;from users, here&#x27;s what we want for&#x2F;from
    contributors, here&#x27;s how to get involved in maintainance&#x2F;governance.<p>You
    can be either but you have to say which.)
