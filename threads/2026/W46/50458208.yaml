  author: stalfie
  text: I would guess that for most people AI still promotes this definition of freedom.<p>The
    modern world is too complex for anyone to understand all topics fully. So as a
    result of this cognitive cap, by Spinoza&#x27;s definition people have grown progressively
    less free for centuries. AI can, for anyone who seeks it, allow easy access to
    fields where they previously would have to consult with a human expert in order
    to begin to understand. Coding agents arguably make coding more accessible then
    it&#x27;s ever been, it&#x27;s just that as a side effect they make understanding
    less necessary to produce software (and thus also less valuable). Any schmuck
    can now ask an agent &quot;hey how does this program work&quot; and get a competent
    answer in terms they can parse. Of course, most people do not do this. Human beings,
    as a general rule, do not do things they don&#x27;t have to. But the option is
    there.<p>As a board saturated with experts, people here on HN don&#x27;t tend
    to appreciate what kind of incredible super power vibe coding is for people who
    did not pursue an education and career in software engineering. Everything that
    a computer can do is now accessible to everyone. As the vast majority of people
    on earth would not and could not spend the time and effort to understand software
    (or simply don&#x27;t have the talent to do so), this is a pure upgrade in terms
    of average freedom.
