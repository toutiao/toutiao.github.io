  author: msteffen
  text: Well, my point is precisely that there’s an alternative to OSS that didn’t
    used to exist, and it’s pretty compelling, and it will probably keep getting better
    over time.<p>Why use OSS then? Because of the community—you will get ideas from
    using other people’s software that you wouldn’t get from staying in your bubble.
    OSS projects therefore ought to see themselves as a community first and a software
    project second. Do other people in the gnome community like the change? Why did
    the maintainers make it? You have less reason to use gnome than ever, but if you
    do use gnome 3, you’ll be trying out software that (a) <i>somebody</i> thought
    was a good idea, and (b) you definitely wouldn’t have vibe-coded for yourself.
    So that’s something.
