  author: dkarl
  text: "&gt; Imagine if every scientist resolved to refer to already written books
    and carry on their research in closed labs with no discussion with the rest of
    their field.<p>Open source projects have always had forks, public and private.
    The ability to fork a project and use your own version of it privately, without
    needing permission or buy-in from others, has always been an explicitly valued
    aspect of open source software. If it was always seen as a good thing before,
    why do we see it differently now?<p>I think the reason is an implicit assumption
    that the production of more unshared work means that less work will be shared.
    But I don&#x27;t see why that would be true. We could just as easily, and more
    likely in my view, see more work shared with the world at the same time we see
    more work not shared with the world. The incentives for cooperation remain, even
    as it becomes easier to work alone.<p>Has anyone made a persuasive argument to
    the contrary, or provided evidence? It seems like the main problem AI has created
    for open source projects is an avalanche of bad PRs, not a drying up of good contributions."
