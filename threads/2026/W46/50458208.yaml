  text: |-
    &gt; Whither now, we ask -- now that we have, even to my
    jaded eye, a god machine that makes short work of all the stuff we
    emacsers believed we were faster at than people using lesser tools.
    Editing speed, customization, the expressiveness of LISP: every
    advantage we claimed vanished the moment we stopped typing and started
    telling the AI what we wanted.<p>Is that a common thought? I learned vim, then emacs, and various other tooling not because I wanted to increase my speed competitively, but just to reduce my frustration with the gap between thinking and doing. Using something like VSCode to code is like playing on a laggy piano (if that exists). You think about I need to quickly update the signature of this function and it turns into a mouse&#x2F;keyboard chaotic dance with your eyes focusing all over the place. It&#x27;s like doing a three legged race.<p>With emacs and vim, I think about the code, notice that I want to change to change something, and can do the necessary actions (almost) subconsciously. Which means, I never stop thinking about the code. It may be longer or faster than someone using another software, but the advantage for me is to rely mostly on muscle memory while I&#x27;m thinking deeply about some problems.<p>Another thing is multiple buffer&#x2F;views at once. This is why I don&#x27;t like editors that have vim mode, because it&#x27;s a pain to browse code with them, especially when you want a global view of something. With both emacs and vim, I can have multiple related files&#x2F;sections of files&#x2F;output of commands visible at once. Like how you would want physical papers and lay them on a desk.
