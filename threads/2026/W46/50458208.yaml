  author: sublinear
  text: "&gt; If it was always seen as a good thing before, why do we see it differently
    now?<p>Writing code shouldn&#x27;t merely be about accomplishing a goal, but making
    deliberate and good decisions that lead to more good decisions with increasing
    ease and clarity. It&#x27;s no different than any other type of planning, engineering,
    or architecting. FOSS demands this more than any other genre of software because
    it&#x27;s made collaboratively.<p>I think AI is just too irresistible for the
    reckless and dumb developers who were, unfortunately, always the majority in our
    line of work. Now we don&#x27;t have to guess at that fact anymore or be afraid
    of being judged as arrogant for saying it. Now we know. These developers don&#x27;t
    bring anything to the table. The problem of rejecting garbage PRs is far from
    new."
