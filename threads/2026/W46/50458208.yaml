    job they&#x27;ll PIP you for not just trusting the dark factory. Judgement is
    the new moat. Wait, Opus 5.5 is pretty good at that too; business context is the
    <i>new</i> new moat. It&#x27;s just an upward retreat into fewer and fewer, less
    and less concrete decisions made by people, until engineering simply isn&#x27;t
    done by people anymore; there&#x27;s only a need for human business people, product
