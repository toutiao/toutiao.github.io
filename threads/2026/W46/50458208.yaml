  text: This is a concept that has stuck with me a lot. I believe I first heard it
    the GDC 2016 Talk from Mark Ferrari. I&#x27;ve come to call it &quot;limitation
    breeds creativity&quot;.<p>I believe a lot of people will find out with AI that
    most people don&#x27;t have very original ideas. And that the limitations we encounter
    while realizing those ideas enable us to grow it into a good art piece or product.
    Due to being forced to consider if the effort of working around the limitations
    is worth it. And then put in the effort to realize something that approaches the
    initial idea as close as possible. Instead of instantly being able to realize
    the first idea in you mind without any obstacles.
