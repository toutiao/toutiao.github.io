  author: chicken-stew
  text: 'With Citrus it’s wild: in a lot of hybrids and species (not all) you get
    seeds that will sprout 2 or more seedlings from the same seed. One seedling will
    be the result of pollination (with the reshuffled genes as you describe) while
    the others will be a clone of the motherplant. You let them grow next to each
    other and remove the odd ones. Mine haven’t flowered yet, my climate is too cold
    and this prolongs the  period to first flowers.'
