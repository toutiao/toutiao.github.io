  author: chicken-stew
  text: 'During lockdown, I started citrus plants from seed (they’re polyembryonic
    and have a copy from the parent plant). I really wanted Clementines, you never
    see those in nursery catalogs, the sweet ones with the thin skin that falls off.
    So I dived into the literature to find out more about its history and … no consensus
    whatsoever. There’s one pile of publications claiming it’s a hybrid from this
    and that parent, and a diff pile of papers stating it’s most definitely not a
    hybrid but a mutation. So whenever I come across a poster like this I feel the
    urge to ask the author: why are you in the hybrid origin camp?'
