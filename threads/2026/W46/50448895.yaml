  author: motionlessveloc
  text: 'Citrus ancestry is stupidly complex, and the generally commercially available
    varieties sadly few.<p>You may have heard of yuzu, which was a foodie fad a couple
    of years ago (and deservedly so, it smells &amp; tastes great). In Japan, it&#x27;s
    only one of numerous citruses, including dekopon (navel mandarins, occasional
    sold in Australia as &quot;sumo&quot;), tachibana, kabosu, sudachi, etc.<p>Hop
    a few islands down to Okinawa, and the fruits change yet again! Here you have
    shikwasa (hirami lemon), tachibana, tanibuta, etc.<p>An incomplete list on Wikipedia:
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Japanese_citrus" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Japanese_citrus</a>'
