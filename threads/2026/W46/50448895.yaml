  author: thaumasiotes
  text: "&gt; Nobody does that work to make money on a poster.<p>You reminded me of
    something. I was looking at a book of artwork with my brother and he commented
    that some of the art was bad because there was too much drawn in the background.<p>I
    think this is a case of &quot;misplaced advice&quot; - the belief that background
    artwork lowers the overall quality of a piece is false, but it persists because
    it is helpful to artists.<p>If you&#x27;re trying to <i>sell</i> your artwork,
    people will pay a lot more for foregrounds than they will for backgrounds, but
    backgrounds aren&#x27;t any easier than foregrounds - generally they&#x27;re harder
    - so any time you spend drawing stuff in the background effectively lowers your
    hourly earnings. (Unless the level of background detail in your art is <i>so</i>
    low that it&#x27;s making it all unsaleable.)<p>But if you ask people about what
    artwork they like, background detail is always helpful."
