  text: There does seem to be a bug - if you drag the tongue to the bottom left-most
    position, close the lips and bring them back as far as possible, raise the larynx
    all the way, and lower the soft palate all the way, the synthesizer  starts making
    some kind of inhuman screeching sound (which is definitely not physically accurate).<p>My
