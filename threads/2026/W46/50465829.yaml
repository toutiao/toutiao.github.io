  author: alembic_fumes
  text: 'Either the volatility must be tolerated and so it can be straddled. Or there&#x27;s
    no need to tolerate it, so the shorting is &quot;easy&quot;. Of course these are
    not the only possible outcomes, so I wouldn&#x27;t recommend anything.<p>My point
    is, any claim about what is going to happen is implicitly weighing that information
    higher over the background. So if one thinks it&#x27;s worth sharing, then they&#x27;re
    claiming insight that they could be staking on.<p>I think in your claim that is
    the &quot;tolerate the volatility in the interim&quot; part. Stating this implies
    that you think that the volatility is going to be higher than the market expects
    (as otherwise the statement wouldn&#x27;t contain new information, i.e. it wouldn&#x27;t
    be worth stating) so that means you should be willing to take a straddle position
    to profit from this assumed volatility, as long as the costs associated with assuming
    such a position are less than the expected profit. If this isn&#x27;t true, then
    you may want to aeconsider whether you actually believe that the volatility is
    going to be high enough to be worth considering.<p>Now I suppose there are further
    meta levels, where one can ask and advise to consider the possibility that volatility
    might be high, even if one doesn&#x27;t actually regard the chance of volatility
    to be high themselves. But for that to be a true neutral claim, one should also
    ask to consider the chance of unexpectedly low probability. So to say &quot;before
    you short, consider that volatility might be high&quot; is itself a pro-volatility
    claim, mildly disguised as a hypothetical.<p>I hope I&#x27;m not coming off as
    too contentious. My principal point is this: any statement reflects underlying
    sentiments about what&#x27;s expected to happen, made because those stated expectations
    deviate from what is commonly understood to happen. That is &quot;delta&quot;,
    which can be monetised if large enough.'
  score: 0
  posted_at: '2026-11-12T19:00:41Z'
- id: '50472912'
  parent_id: '50472406'
  author: jstanley
  text: "&gt; Stating this implies that you think that the volatility is going to
    be higher than the market expects<p>No, I&#x27;m not trying to imply that.<p>You
    <i>don&#x27;t know</i> what the volatility will be in the interim. You can take
    a view on whether you think it is likely to be higher or lower than the rest of
    the market expects but you don&#x27;t <i>know</i>.<p>My claim was as simple as
    &quot;making money shorting requires you not just to be right that it will eventually
    go down, but that you also tolerate the volatility in the interim&quot;. <i>Whatever</i>
    that volatility may be.<p>That claim can be true without implying any profitable
    trade.<p>The fact that the claim is true isn&#x27;t evidence that the price will
    eventually go down.<p>I don&#x27;t think either of us really misunderstand each
    other at the object level, we&#x27;re just arguing pedantically about the precise
    statements we&#x27;ve made. (Which, no shade, this is one of my favourite hobbies).<p>&gt;
    My principal point is this: any statement reflects underlying sentiments about
    what&#x27;s expected to happen<p>This is a statement about the stock market, how
    do I trade on this?<p>My principal point is that it is possible to make statements
    about a system that are generally true <i>without</i> taking any view at all on
    the specific future states of that system."
  score: 0
  posted_at: '2026-11-12T19:31:57Z'
- id: '50474287'
  parent_id: '50472912'
  author: alembic_fumes
  text: "&gt; I don&#x27;t think either of us really misunderstand each other at the
    object level, we&#x27;re just arguing pedantically about the precise statements
    we&#x27;ve made. (Which, no shade, this is one of my favourite hobbies).<p>I think
    I agree. And it indeed takes one to know one ;) That said, I wish to keep going
    for a bit at the least!<p>&gt; My principal point is that it is possible to make
    statements about a system that are generally true without taking any view at all
    on the specific future states of that system.<p>So from a purely logical point
    I agree. However, I&#x27;ve found that in most discussions such statements aren&#x27;t
    typically made, as participants share points that bring at least some level of
    new information or surprise into the discussion. And, perhaps as a fault that
    I should learn out of, I&#x27;ve come to expect this as the default mode of how
    conversation happens.<p>Raising points that the point-raiser themselves doesn&#x27;t
    think carry any surprise or novel insight sounds strange to me. To construct a
    contrived programmer-centric analogy, it&#x27;s a bit like including lines like
    `if my_boolean != true || my_boolean != false { panic!(&quot;my_boolean isn&#x27;t
    true or false!&quot;); }` in programs. It&#x27;s not technically _wrong_ to do
    so, but it doesn&#x27;t serve any point and lines like that are typically removed
    because they&#x27;re redundant.<p>I suppose &quot;redundancy&quot; is the key
    term here. If you condition investment on (paraphrasing) &quot;also tolerating
    the volatility in the interim&quot;, <i>without</i> intending that as a statement
    about volatility being particularly important over the period, that begs the question
    why was volatility as a point raised instead of, for example, opportunity costs
    or importance of a good brokerage or cons of dealing with plain stocks over more
    tax-efficient investments. And so, choosing between &quot;this person has happened
    to include redundant if-statements around their booleans and is aware of their
    redundancy&quot; vs &quot;this person has included extra checks around their booleans
    believing in their purpose&quot;, I opt for the latter interpretation.<p>And so
    while I concede that I am making an assumption over the literal interpretation,
    I also believe that it&#x27;s warranted. My claim is: a person wouldn&#x27;t make
    statements about a topic, if they themselves didn&#x27;t believe those statements
    to be worth raising, where worth is measured by the personally perceived insightfulness
    of those statements.<p>Although, thinking out loud a bit here, I suppose that
    statements can also be made for other perceived sources of worth, such as pointing
    out non-obvious behaviours for sake of informing or educating. But even then the
    point-raiser believes that the non-obvious behaviour is worth knowing about, i.e.
    it has some real effect when accounted for by a person who wasn&#x27;t aware of
    that. In this volatility example, I think that would equate an underlying belief
    of &quot;volatility negatively affecting whether short positions are worth taking&quot;,
    outside of the positively-affecting &quot;required&quot; amount of volatility
    resulting from the price dropping and the short position becoming profitable.<p>Regading
    this,<p>&gt; &gt; My principal point is this: any statement reflects underlying
    sentiments about what&#x27;s expected to happen<p>&gt; This is a statement about
    the stock market, how do I trade on this?<p>I suppose one could trade this (albeit
    somewhat contrivedly) by looking at what the people &quot;in the know&quot; make
    statements about vs. what they don&#x27;t. As an example, a CEO making a press
    release about &quot;We&#x27;re increasing our usage of AI&quot; is making an overt
    statement statement about the company&#x27;s AI usage changing, and a covert statement
    about they themselves believing that communicating about increasing AI usage is
    a good thing. Depending on what slide of the keynote the line stands, it (in my
    mind, per my own perception of the rate of current adoption) reads as a stronger
    or weaker signal that the company is a technological laggard because the CEO thinks
    that communicating &quot;yesterday&#x27;s news&quot; is still worth it.<p>How
    tradeable is that by itself? Likely not at all. As a component of analysis? Maybe
    it&#x27;s worth something."
  score: 0
