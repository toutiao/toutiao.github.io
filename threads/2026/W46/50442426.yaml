    didn&#x27;t discuss how I think the tech will change. I pointed out a current
    gap in crystalizing knowledge acquisition gained on-task because I feel that gap
    is still under-appreciated. There&#x27;s a lot of very interesting work trying
    to identify how to cost effectively narrow that gap (Dynamic Modular Adapters,
    Background Distillation, Test-Time Training, etc).<p>They all can be effective
    to varying degrees in different ways but they also all have their own gaps and
    trade-offs. As of now, there&#x27;s no clear path to per-instance knowledge crystalization
    that&#x27;s both broadly generalizable <i>and</i> scales cost-effectively. Will
    both be solved eventually? I think almost certainly. Will both be solved in the
    next 2-5 years? Maybe... but it smells like the kind of fundamental problem that&#x27;s
    &#x27;wicked&#x27; hard, so I wouldn&#x27;t be surprised if the LLM you and I
    can afford to daily drive in 2 - 5 years is <i>far</i> more capable and &#x27;smart&#x27;
    but isn&#x27;t that much better at automatic crystalized learning from on-task
    knowledge acquisition than the best LLMs are today.<p>To be clear, LLMs are fabulously
    useful in myriad ways and I think they&#x27;ll continue getting much more useful
    in many more ways. That&#x27;s so much a given, it makes identifying which remaining
    gaps are so fundamental there&#x27;s a good chance they won&#x27;t be solved in
    2-5 years especially interesting."
