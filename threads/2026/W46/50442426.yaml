  author: mschuetz
  text: In my experience it isn&#x27;t really about quad overdraw&#x2F;helper lanes,
    but rather about primitive assembly. On my RTX 4090, vertex shaders max out at
    about 20M tris&#x2F;ms, while mesh shaders, which bypass primitive assembly, can
    reach 40M tris&#x2F;ms. Maybe quad draw might be the next bottleneck after primitive
    assembly.<p>But it&#x27;s a bit difficult to find the exact reason since profilers
    won&#x27;t really tell you a concrete bottleneck when drawing vast amounts of
    tiny tris.
