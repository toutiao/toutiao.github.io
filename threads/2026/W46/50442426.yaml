  text: 'Nanite does support mesh shaders and does use that for the larger triangle
    rasterization when available.  But quad overdraw is brutal with triangles near
    pixel size, making 4K as expensive to render as 8K, and they&#x27;ve said it&#x27;s
    the reason they fall back to compute shaders even when mesh shaders are available
    for small patches.  That might have been part of the reason on Dreams though since
    there weren&#x27;t any mesh shaders on PS4.<p>4K has 8 million pixels so should
    be able to do pixel per triangle with a separate depth pass and still fall within
    that 20M even with some overdraw from not all patches able to be culled.<p>edit:
    opps thought you said per frame, per ms would give 330M&#x2F;660M triangles per
    frame, doesn&#x27;t seem like a big bottleneck; PS4 was more like 26M per frame
    though but rendered at 900p-1080p.  I think it&#x27;s translucency was stochastic
    so lots of stuff could still get culled, but wouldn&#x27;t be able to cull as
    aggressively (like nanite with masked materials).'
