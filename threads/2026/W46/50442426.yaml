  author: commieneko
  text: I would argue that we have no idea how the technology will change. Humans
    have a poor record of predicting what human based technology can do in a given
    amount of time. This is non-human intelligences. All bets are off. Maybe the AI
    can give us a clue. If they feel like it.<p>Sci-fi stuff aside, it&#x27;s not
    just a matter of the AI&#x27;s telling the supporting tech what to do.  We are
    already at the point where we can&#x27;t predict what the AI will do to the supporting
    tech. Blender, for example, is mostly traditional computer science with some physics
    and art direction thrown in. It&#x27;s damn hard to use.<p>This is not a criticism,
    that&#x27;s just where we are in developing a UI for the math and physics and
    art direction.  Just using the AI to make for me UI changes, convenience features,
    and special utilities has drastically changed not only the way I work, but the
    kind of projects I&#x27;ll undertake.  I think nothing of having Claude whip up
    a special physics based particle system or compositing stack these days.  I could
    have done that in the past, but it would have been so much work for a one time
    job I wouldn&#x27;t consider it. I&#x27;d just brute force a solution with manual
    keyframes and a lot of trial and error.<p>And while I can program and solve (simple)
    physics problems, its not my day job.  My day job is telling stories and explaining
    things with animated narratives.<p>Earlier today I was asked to help with some
    animations explaining how musical scales worked and to come up with ways to visualize
    them.  Using Claude I&#x27;ve already got Blender doing a credible job at creating
    musical notation and linking it up to a (sort of) physically accurate sound wave
    simulation&#x2F;visualization.  Not done yet, but it&#x27;s looking promising.  This
    is within a few tens of minutes of an instructional designer asking me what might
    be possible for the topic.  And I already have a sound synthesizer written in
    javascript (by Claude) that I used for a project a while back. Hooking them together
    is just a json file or two away...<p>Even if the Super Intelligence never materializes,
    just using current LLMs as an amplifier for existing technology is going to change
    things into something unrecognizable. And something that is very dangerous in
    the hands of human bad actors.
