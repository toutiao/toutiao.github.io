  author: commieneko
  text: 'I&#x27;ve been using Claude to drive Blender with the official Blender MCP
    server. Mixed results; but some of them very good.<p>Claude Opus is very good
    at creating geometry nodes for specific applications.  You have to know what to
    ask for. It&#x27;s not a magic genie.<p>For example, I asked it to make a node
    setup to create the geometry for a table.  It did a mediocre job of it. Then I
    told it to do research on the nomenclature for tables and create a parametric
    control interface to generate tables with the UI using the table nomenclature.  It
    did a very good job of that. It set it up so that I could put the units in using
    Imperial or metric.  I also asked it to come up with reasonable default values
    for the parameters and it did. With just a little tweaking I have a very useful
    table generator for greyboxing scenes.<p>I then did a similar round with it for
    book cases and straightback chairs with useful results.<p>I asked it to make material
    nodes for wood: oak, maple, etc.  And it did a pretty good job of that. Nothing
    amazing, but a useful place to start.<p>It won&#x27;t be replacing people that
    know what they are doing, but its useful for giving that person better specifications
    for what you want.<p>I had Claude keep notes on the project and it made a skill
    that has been useful for later projects.<p>Think of it as a very bright intern
    that works very fast but has very little practical experience.<p>The problem,
    of course, is that if AI replaces interns, then there may not be a future generation
    of experts.  By then, though, the AIs may be good enough to replace the experts.  Next
    year? Next week? Who knows.  If you guide it right to learn as it works, it _does_
    get better over time.<p>I have no idea what to expect or what the actual limits
    of this tech is.  I&#x27;ve see it make really hilarious mistakes, then turn around
    and explain the math its using so well that I can ask for what I want &quot;properly&quot;
    and it&#x27;s surprised that that was what I really wanted.<p>It is like dealing
    with a very well read alien.<p>If the AIs don&#x27;t end up murdering us all in
    our sleep it could be an amazing world we are entering.'
  score: 0
