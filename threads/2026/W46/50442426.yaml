  author: mrandish
  text: "&gt;  By then, though, the AIs may be good enough to replace the experts.
    Next year? Next week? Who knows.<p>Lately, I&#x27;ve been pondering this question
    in general and I&#x27;m worried the answer might be &quot;Never&quot; for some
    kinds of work - at least if we don&#x27;t change how LLMs are currently developed
    and improved. At a high-level, the problem is they don&#x27;t &#x27;learn on the
    job&#x27; like a human and writing their memory &amp; learning in .md files works
    for some things but fails for others.<p>While the &#x27;rising tide&#x27; of baseline
    LLM knowledge continues to grow, they are still FTIs (Factory Trained Intelligences),
    meaning they <i>mostly</i> learn from data which can be assembled&#x2F;tagged
    or synthesized in mass bulk - plus specific abilities in certain domains which
    the factory has prioritized for more costly special training. For some broad categories
    of important work, I suspect there&#x27;s a significant unfilled gap in our LLM
    instances being able to effectively <i>crystallize</i> knowledge acquired on-task.
    Without that, context files will remain helpful crutches not true substitutes."
