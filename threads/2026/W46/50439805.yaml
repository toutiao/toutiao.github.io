  author: microtonal
  text: Smartphones started in a very different time. Our point of reference were
    PCs and laptops, where we were the owner and could do pretty much anything we
    want. They took a lot of that away with smartphones, but because smartphones started
    in the in-between times, they (at least Android) still have side-loading, the
    possibility of installing browsers with ad blockers, heck even the source code
    in the form of AOSP, etc.<p>You can be sure that almost twenty years later, they
    will use a new device type as an excuse to lock things further down. Remote attestation,
    no side-loading, no or little browser competition, etc. This has kind of already
    happened with smart watches, where there is no AOSP-equivalent, virtually no models
    with unlockable bootloaders, etc.<p>AR glasses will be the next venue to further
    trample on your rights. The difference compared to smart watches is that they
    could potentially replace smartphones.<p>All this is without taking into account
    the grave privacy violation AR glasses are to other people. Yes, phones can also
    make photos and film, but it is <i>much</i> more visible.<p>Luckily, at least
    where I live, most people find AR glasses creepy and there is a majority of parliament
    that wants to ban them (though the government is kinda weak as usual).
