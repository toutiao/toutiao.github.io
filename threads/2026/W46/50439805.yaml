  author: ModernMech
  text: 'The law of ad entropy in technology states that over time, ad coverage always
    increases.  First in the applications hosted on the platform, and then eventually
    the platform itself will just start serving ads. At the heat death of technology,
    all platforms will be completely covered in ads, leaving no more more energy for
    useful work.<p>See: the web itself, search engines, app stores, desktop search,
    operating systems from desktop to mobile to TV... the list is endless and the
    trend is relentless. It already started with AI, now injecting ads directly into
    chats.<p>So I think it&#x27;s not a stretch to predict AR platforms will be the
    same and the ads will be in your eyeballs. It doesn&#x27;t really matter that
    these anti-features will cause the product to be worse for users if it makes the
    platform more profitable for owners.<p>I can also guarantee with complete certainty
    that any sort of &quot;neural implant&quot; technology will one day be serving
    ads directly into your brain.'
