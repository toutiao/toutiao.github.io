  author: hunterpayne
  text: Have you ever asked yourself why this is?  There are two basic types of reasons
    why the UK nuclear industry does so poorly.  The first reason are scientifically
    illiterate &quot;activists&quot; that delay and block construction.  But this
    is only part of it.  The other and possibly bigger part is that the UK doesn&#x27;t
    build stock nuclear plants.  They &quot;Wallace and Grommet&quot; things far too
    often.  In this case, that means not building proven designs but instead building
    experimental ones.  Specifically building high temp reactors which haven&#x27;t
    been built before.  Normally (at least in the US) we build pilot plants (think
    1&#x2F;10th the normal size, so 100MW or so) and then once we get the kinks worked
    out, we built the full size plant.  In the UK they just built full sized experimental
    reactors.  This is why the UK has so many problems with (the cost of) their nuclear
    plants.  Had they built a stock design (like the French) they wouldn&#x27;t have
    these problems.
  score: 0
  posted_at: '2026-11-13T19:36:36Z'
- id: '50488682'
  parent_id: '50487247'
  author: hunterpayne
  text: There are nuclear designs that follow load just fine.  The UK just didn&#x27;t
    build them.  Also, the designs that load follow are usually liquid fueled reactors,
    not solid fueled ones which are normally built.  PWRs generally have the lowest
    utility costs (the actual cost you pay, not the cost to build which is normally
    quoted) of any power source we have tried.  Even the fast-sodium reactors the
    Soviets built can&#x27;t match their price.  That&#x27;s part of why building
    stock nuclear designs works so well (eg the French) but trying to build experimental
    reactors doesn&#x27;t.  And when you try a new design, you have to build a pilot
    plant first to work out the kinks.  The British always skip this step and this
    shows in the results.
