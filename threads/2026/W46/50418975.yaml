    an unsustainable rate in order to pay millions of people to do nothing for decades.<p>We
    have made decisions that <i>looked</i> reasonable at the time they were made,
    but too much has changed in the meantime and now we are stuck in bad equilibria.<p>The
    Bismarckian pay-as-you-go pension system was stable as long as people had plenty
