    and spend 20 years in retirement before they die. The maths of that system just
    does not work out anymore.<p>The European highly regulated industry was king as
    long as the rest of the world had no other choice, but now that Asia has industrialized,
    they are blowing us out of the water. First with lower prices, but now also with
    quality. German exports are half of what they used to be, with another halving
