  author: Xirdus
  text: 'Mathematically, types are sets of possible values.<p>Any type (like in TypeScript;
    Rust doesn&#x27;t have one) is a set of every possible value; a supertype of all
    types. Every expression regardless of type can be assigned to a variable of type
    any.<p>The opposite is the never type, which is an empty set; no value is of type
    never. Per set theory, an empty set is a subset of every set, which makes the
    never type a subtype of all types. An expression of type never can be assigned
    to every variable regardless of type.<p>If never type has no values, then how
    can an expression have never type? Easy: it must never evaluate. Infinite loops,
    unconditional panics&#x2F;exceptions, process exit&#x2F;abort, etc. Also, generics
    - you can have Vec&lt;!&gt; that&#x27;s always empty, Result&lt;T,!&gt; that can
    never be an error, etc.'
  score: 0
