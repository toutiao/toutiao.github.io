  text: Usually people advocate dependency cooldowns as a mitigation for supply-chain
    attacks, where you&#x27;re depending on a module with a malicious maintainer,
    possibly a new one (perhaps one who stole the old maintainer&#x27;s keys so they
    can pretend to be the old maintainer).<p>In that situation, how do you distinguish
    between &quot;normal updates&quot; (that you should let cool down) and &quot;security
    advisories&quot;?  If all the hypothetical malicious maintainer has to do to get
    you to update is to publish a security advisory for their own package, wouldn&#x27;t
    they just do that?  It might even be a real advisory about a real security hole
    that they introduced, but claiming more versions are affected than actually are
    affected.
