  author: JoshTriplett
  text: The primary challenge in having a stable ABI is that we have generics. So,
    even if we never changed the <i>calling conventions</i>, an ABI is not as simple
    as exporting a symbol with the right name. We implement generics by providing
    MIR (our main intermediate representation) that gets compiled by the linking program
    for each instantiation of a generic.<p>Swift handles this through the equivalent
    of Rust&#x27;s `dyn`. We <i>could</i> have a stable ABI that&#x27;s based entirely
    on `dyn`. Such an ABI would have some limitations, since there are traits `dyn`
    can&#x27;t represent (anything that&#x27;s generic over something other than the
    type that implements the trait, which is quite common), though we&#x27;re working
    on some of those.<p>Essentially, you wouldn&#x27;t be able to have a `Vec&lt;T&gt;`
    in your ABI without either pinning down T or using something like `Vec&lt;Box&lt;dyn
    Trait&gt;&gt;`. Which is <i>possible</i>, but kind of awful.<p>We&#x27;re still
    planning to ship a stable ABI at <i>some</i> point, but that gives a flavor for
    some of the kinds of problems we&#x27;d need to solve in order for that stable
    ABI to be useful.<p>(C++ typically handles generics by having types defined in
    header files, and those get compiled with the program consuming the library, which
    is effectively the same situation Rust is in. You <i>could</i> export symbols
    from a shared library for specific instantiation of a template, but people rarely
    do that.)
  score: 0
