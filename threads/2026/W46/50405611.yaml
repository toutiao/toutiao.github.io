  author: rickdeckard
  text: I&#x27;m not surprised that this doesn&#x27;t change the CPU temp.<p>The important
    heat-exchange from the CPU is usually managed by a heatsink and a radial fan,
    with the grille of the casing designed as fan inlet&#x2F;outlet.<p>Blowing&#x2F;sucking
    additional air at the inlets doesn&#x27;t affect the cooling surface of the heatsink,
    it just blows at the radial fan.<p>This may make sense if there&#x27;s a weakness
    of the radial fan (that heat is building up at the heatsink which the original
    fan cannot remove).<p>But it&#x27;s much more likely that the heat is not distributed
    well away from the CPU, either <i>to</i> the heatsink (thermal paste) or <i>by</i>
    the heatsink (weak heatsink design&#x2F;material).<p>I&#x27;d look into ways to
    replace the radial fan or the thermal paste
