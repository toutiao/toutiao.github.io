  author: schobi
  text: Well - the challenge is with the right type of fans.<p>I like the idea of
    a pump curve for a garden water pump. If you pump water without any back pressure
    (not even a hose connected), the pump will give a certain volume per time that
    is can move. If you connect a hose and pump upwards, you will reach a max pressure
    &#x2F; max height at which no water will flow any more. Both cases are useless,
    but this is what the manufacturer prints on the box. Your sweet spot is in between.
    If you pay enough, you will get a datasheet with the pump curve in between these
    two points.<p>For simple and cheap PC fans, you are at most given the number of
    air volume without back pressure. I&#x27;ve not come across a cheap fan that gives
    a defined backpressure of even a curve.<p>For your application you would need
    a fan that can push air through a restriction.<p>I had success with high rpm server
    fans. They create pressure, consume 20W of power or more and also make a lot of
    noise. But in this case - this is not a solution
