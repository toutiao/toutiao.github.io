    will take a bus”, just that if you have bus route where 20 people on each bus
    stop need to wait for the next bus, if you increase capacity of buses by 10, then
    only 10 people will be waiting on bus stops, but you will still have 100% bus
    utilization.<p>In other words, with added lane on highways, it’s sociological
    mechanism, which is slightly less precise analogy.
