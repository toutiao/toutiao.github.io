  author: janalsncm
  text: 'A lot of AI stuff is like that, actually. GPT 2 and 3 were mainly curiosities
    that would get articles on tech news sites but didn’t attract much attention from
    the general public. But after RLHF the UX improved dramatically and ChatGPT became
    mainstream. A lot of MLEs underestimate how much UX matters, and the same is true
    for Jev.<p>&gt; how do these models calculate probabilities?<p>The short answer
    is: more and better data.<p>The long answer is: probably the same way any other
    classifier does. Take your ground truth probabilities and your predicted probabilities.
    The gap between those is called cross entropy, which is used to push the model
    towards the correct probabilities.'
