  author: reexpressionist
  text: Yes, in a sense, with some important caveats. Cross-entropy will tend to yield
    reasonable <i>marginal</i> (i.e., not class-wise, not approximately conditional)
    calibration for in-distribution (i.i.d. data). The challenge with LMs, and neural
    networks more generally, is that the resulting estimators that are based on the
    output logits are very brittle to covariate shifts and out-of-distribution data,
    and that for real applications, we often need robust estimates in high-probability
    regions (e.g., of class- and prediction-conditional accuracy at least some value
    near 1) for conditional-branching decisions (by a human or a model). (ECE is the
    wrong metric for that quantity.)<p>The various decision APIs don&#x27;t give you
    that, and would themselves need to be recalibrated with constraints in feature-representation
    space over the applicable reference class, as with <a href="https:&#x2F;&#x2F;pypi.org&#x2F;project&#x2F;reexpress-sdm&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;pypi.org&#x2F;project&#x2F;reexpress-sdm&#x2F;</a>.
