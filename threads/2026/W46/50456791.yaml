  author: jermaustin1
  text: Image input is a primary reason I&#x27;ve never moved off my &quot;home rolled&quot;
    version of Jev (that Claude wrote for me over a year ago) for my file organizer&#x2F;indexer.
    Takes images resizes them to 1k, then asks a handful of questions about the image
    for tagging purposes. It is able to process around 3 images a second based on
    Qwen 3 VL, but distilled and optimized for 1k images and up to 2048 token inputs
    (after the system prompt, then the questions are asked one after each other reusing
    the cache). Documents that are longer than that end up going through a summarizer
    that runs on my other GPU (Qwen 3.6, I think). And all of that gets fed into a
    vector search engine, for easy lookup later.<p>I&#x27;m not even sure what all
    is going on inside it anymore, because I just add new features when they popup,
    and tell Claude to do it, and it let&#x27;s me know when it is done, and every
    new &quot;input feature&quot; can run against the entire catalogue of files.
