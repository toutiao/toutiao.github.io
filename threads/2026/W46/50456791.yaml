  author: AStrangeMorrow
  text: Yeah, a few years back I briefly worked on the outlines library that did alternate
    sampling&#x2F;constrained outputs (classes, json, grammars etc).<p>It was pretty
    obvious that calibration was a major problem.<p>You might ask a question, and
    say your classes&#x2F;target tokens are “high”&#x2F;“medium”&#x2F;“low”. Well
    maybe the model really want to say “The” first, and none of your classes might
    be in the top 1000 tokens for all you know. The models were really not trained
    to produce one word answer but sentences.<p>It was still useful for tool calling
    as back then parameter&#x2F;API hallucinations were common. But the actual results
    were sub-par.
