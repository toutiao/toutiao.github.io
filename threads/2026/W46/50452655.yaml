article:
  url: https://nathan.rs/posts/weight-space-lp/
  title: Can a Linear Program Do Weight-Space Programming?
  fetch_status: success
  content: "Last week, MIT CSAIL published [_Sparks of Weight-Space Programming_](https://rikiyat.github.io/blog/weight-space-programming/).
    Given the raw weights of a small network, GPT-6 Astra could tell which game it
    had been trained to play. Given only a game’s rules, it could write the weights
    of a small network from scratch and beat networks trained with PPO for 100 million
    steps. No gradients, no training loop, just reasoning about what the weights compute.
    They coined this **weight-space programming**.\n\nIn another experiment, they
    asked Astra to make Qwen3.5-0.8B better at math by editing its weights. Astra
    changed only 0.016% of the weights, and MATH-500 accuracy jumped from 7.9% to
    48.1%.\n\nLooking at Astra’s edit, I realized most of its search was solving a
    linear program by trial and error. It spent about 8 hours and 28 forward passes
    choosing which weights to change and by how much. A couple of LP solves, about
    a minute each, do the same job with 8× fewer changed weights. In this post I’ll
    walk through the edit, why it’s an LP, and what that says about the fix itself.\n\n##
    Thinking loops[#](#thinking-loops)\n\nSmall reasoning models have a common failure:
    they get stuck in **thinking loops** , repeating the same few lines over and over
    instead of finishing their reasoning. Qwen3.5-0.8B is especially prone to it,
    and its model card says so. On MATH-500, 93% of the base model’s answers ran into
    the 32,768-token limit without ever reaching an answer.\n\nThe edit fixes the
    loops, so it helps anywhere the model loops. That includes instruction following:
    IFEval went from 21% to 62%.\n\n| Qwen3.5-0.8B | MATH-500 | GSM8K | IFEval | Hit
    token limit |\n| --- | --- | --- | --- | --- |\n| Base | 7.9 | 13.8 | 21.0 | 93.0%
    |\n| Astra’s edit | 48.1 | 67.1 | 62.3 | 33.1% |\n\nOn Gemma 3 270M, which rarely
    loops, Astra couldn’t meaningfully improve its math ability. As the authors put
    it, editing the weights could remove an obstacle hiding an ability, but couldn’t
    add one the model lacked.\n\n## How Astra fixed the loops[#](#how-astra-fixed-the-loops)\n\nTransformers
    use residual connections: each layer’s output is added to its input rather than
    replacing it. Follow one token through the network and you get a single vector
    that every layer adds to, called the **residual stream** (1,024-dimensional in
    this model). When the model is looping, the residual stream shifts in a consistent
    direction. Astra’s fix was to edit two layers so that what they add points the
    opposite way.\n\n### Finding the loop direction[#](#finding-the-loop-direction)\n\nAstra
    wrote four pairs of short texts, each a piece of productive reasoning and a looping
    version of the same reasoning. It ran all eight through the model and recorded
    each token’s residual stream vector at one layer. Averaging over the looping texts
    gives one vector, and averaging over the productive texts gives another. Their
    difference, normalized, is the **loop direction** $u$: the way the residual stream
    moves when the model loops.\n\n### Editing the weights[#](#editing-the-weights)\n\nEach
    MLP ends with a matrix $W$ (called `down_proj`). At every token, it turns the
    MLP’s 3,584-dimensional hidden activation $h$ into a 1,024-dimensional output
    $Wh$, which gets added to the residual stream $x$:\n\n$$x \\leftarrow x + Wh,
    \\qquad Wh = \\sum\\_j h\\_j \\, w\\_j$$\n\nSo the MLP’s output is always a weighted
    sum of the same 3,584 vectors, the columns $w\\_j$ of $W$. $W$ fixes what those
    vectors are; the activations $h\\_j$ decide how much of each one gets added at
    each token.\n\nEach column points partly along $u$. That amount, $u^\\top w\\_j$,
    is how much column $j$ pushes the model toward looping whenever $h\\_j$ is active.
    Astra’s edit subtracts a multiple $\\alpha$ of it:\n\n$$w\\_j \\to w\\_j - \\alpha
    \\, (u^\\top w\\_j) \\, u$$\n\nAt $\\alpha = 1$ the component along $u$ is gone,
    so the column no longer pushes toward looping. Doing this to every column in layers
    15 and 19 took accuracy from 9% to 33% on GSM8K and MATH training problems. At
    $\\alpha = 6$ the component is flipped: a column that wrote $+a$ along $u$ now
    writes $-5a$, and pushes the model _away_ from looping whenever it’s used.\n\nEvery
    edited column changes by a multiple of the same vector $u$. So the whole edit
    is one direction $u$ plus one number per column, $v\\_j = -\\alpha\\,(u^\\top
    w\\_j)$, which is zero for columns left alone. That’s a **rank-1** change:\n\n$$\\Delta
    W = u\\,v^\\top$$\n\nAt each token, it adds $(v \\cdot h\\_t)\\,u$ to the residual
    stream: some amount of $u$, set by how active the edited columns are. No other
    direction changes.\n\nThat leaves $v$ to choose: which columns to edit, and how
    large $\\alpha$ should be. Astra worked it out by trial and error, testing each
    edit on a fresh batch of those training problems:\n\n| Edit on layers 15 and 19
    | Accuracy |\n| --- | --- |\n| Base model | ~9% |\n| Every column, α = 1 | 33%
    |\n| Every column, α = 2 | 43% |\n| Every column, α = 3 | 48% |\n| Random direction
    (control) | 12.5% |\n| Top 64 columns, α = 6 | 55% |\n\nPushing harder than $\\alpha
    = 1$ helped more, and a random direction did nothing. The final edit used $\\alpha
    = 6$ on only the 64 columns per layer that wrote the most $u$ on looping text.\n\n###
    Where the time went[#](#where-the-time-went)\n\nThe paper released Astra’s full
    logs: every tool call, every forward pass, every note it wrote to itself. Astra
    had a Python kernel with the weights loaded and a budget of 50 forward passes,
    each a batched run of the model on training problems or texts of its choosing.\n\nThe
    edit was frozen after about 10 hours, and the last 17 passes re-tested it without
    changing anything. Of those 10 hours, finding $u$ took 15 minutes. Finding $v$
    took about 8 hours.\n\n## Choosing v is a linear program[#](#choosing-v-is-a-linear-program)\n\nAstra
    was searching for a $v$ that strongly pushes looping tokens away from $u$ while
    barely touching productive ones. Since the push at token $t$ is $v \\cdot h\\_t$,
    linear in $v$, both requirements are linear inequalities.\n\nI labeled tokens
    from the base model’s own traces: **looping** tokens ($R$), deep inside a loop,
    and **productive** tokens ($P$), well before any loop starts, and recorded their
    activations $h\\_t$ at layers 15 and 19. Each one becomes a constraint, and the
    LP picks the $v$ with the smallest L1 norm $\\sum\\_j |v\\_j|$:\n\n$$ \\begin{aligned}
    \\min\\_v \\quad & \\sum\\_j |v\\_j| \\\\ \\text{s.t.} \\quad & v \\cdot h\\_t
    \\le -\\delta && t \\in R \\quad \\text{(at least } \\delta \\text{ away from
    } u\\text{)} \\\\ & |v \\cdot h\\_t| \\le \\varepsilon && t \\in P \\quad \\text{(at
    most } \\varepsilon\\text{)} \\end{aligned} $$\n\nIn practice no $v$ satisfies
    every constraint, so each one gets a penalized slack variable.\n\nMinimizing L1
    tends to make $v$ sparse. The L1 ball is a diamond, and when you grow it until
    it touches the feasible region, it usually touches at a corner, where most coordinates
    are exactly zero. So the LP picks the columns as well as the amounts.\n\nTo get
    exactly 8 columns per layer, I kept the 8 with the largest effect and solved again
    with the rest fixed at zero.\n\nThat replaces Astra’s 8-hour search, including
    its choice of columns and $\\alpha$, with a couple of LP solves. An off-the-shelf
    solver (HiGHS) took over 20 minutes each on these constraints, so I wrote a GPU
    solver (PDHG, the algorithm behind PDLP) that gets within 0.2% of its optimum
    in about a minute.\n\n## Results[#](#results)\n\nI tested two LP edits. Both use
    Astra’s layers. One uses Astra’s direction $u$. The other uses a **heuristic direction**
    : label tokens in the model’s own traces as looping or productive with a simple
    repetition detector, then take the difference of their average residual streams.
    It’s the same recipe Astra used, minus the hand-written texts, so no LLM is involved.
    I tuned the LP’s settings on a separate 128-problem dev set; everything in the
    chart and table is on data never used for fitting or tuning.\n\n| | Changed weights
    | GSM8K test | MATH-500 | IFEval |\n| --- | --- | --- | --- | --- |\n| Base model
    | 0 | 14.1 | 7.0 | 22.9 "
