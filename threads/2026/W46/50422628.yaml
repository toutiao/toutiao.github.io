  author: 1broseidon
  text: Friction is good when it serves a security purpose, not for its own sake.
    Too much of it and users either stop using the thing or find ways around it, which
    is arguably worse - as you pointed out!<p>To have LESS friction you need MORE
    signals, ones that add up to &quot;this action is low risk, proceed&quot; as a
    cumulative risk score. Kind of like credit card transactions... most transactions
    go through silently because the issuer scores them on merchant, amount, device
    and history, and you only get the step-up prompt when the score is off.<p>&quot;Manual
    Approval&quot; and &quot;Bypass Everything&quot; are both what you ship when you
    have no signals.
