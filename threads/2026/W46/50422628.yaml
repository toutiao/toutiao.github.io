  author: api
  text: It&#x27;s an inherent tension, and is also why so many things are insecure.
    People <i>hate</i> friction, and so they don&#x27;t use secure stuff and turn
    security features off. Security abominations like &quot;curl | bash&quot; and
    package managers that traverse trees and download stuff and run scripts are popular
    for a reason.<p>It&#x27;s true in the real world too which is why even in secure
    buildings a person can often slip in by coat-tailing someone. Stopping every single
    person to check ID is cumbersome and slows everyone down. People have stuff to
    do.<p>Truly high security environments are zero-tolerance, which makes them annoying
    and expensive to work in. I&#x27;ve talked to people who have worked in US military
    and CIA&#x2F;NSA places and a very meaningful amount of time is spent complying
    with security and jumping through hoops. Even with all that, stuff gets leaked
    and stolen.
