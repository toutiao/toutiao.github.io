  text: When you&#x27;re running ZFS (or probably some other clever layering violation
    like bcachefs) on <i>heterogeneous</i> workloads, you will quickly run into the
    limits of built-in assumptions. At least that&#x27;s my experience:<p>- ARC may
    require manual tuning for size and metadata size to accommodate page cache, in-app
    caches, file count etc<p>- L2ARC and SLOGs are very obviously useful for some
    clear workloads, but have some cliffs you don&#x27;t expect, such as ram required
    for L2ARC mapping, unexpected cold&#x2F;hot&#x2F;boot behavior<p>- Reasoning about
    reliability becomes harder the more tiers you have<p>Just imagine, to pick a simple
    example, you&#x27;re running postgres, thousands of sqlite3 dbs and one huge duckdb
    (larger-than-ram) on a single such system - it would perhaps manage to adapt to
    one such workload at a time, but would it balance all three at the same time?<p>So
    much as I&#x27;d love to see this direction, I can also imagine the pains coming
    with it.
