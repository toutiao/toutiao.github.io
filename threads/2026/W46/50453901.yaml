  content: "Story text\n\n\\* Subscribers only  \n &nbsp;&nbsp;[Learn more](/store/product/subscriptions/)\n\nSeagate
    doesn’t think hybrid drives are done just yet. On Tuesday, the company announced
    the launch of the new FireCuda Forge line of storage drives. The new drives combine
    the high capacity of a traditional plattered HDD with the speed and responsiveness
    of a user-supplied solid-state drive (SSD). The new hybrid storage solution is
    Seagate’s first to be powered and managed by the new Alkemi intelligent storage
    platform.\n\nThe FireCuda Forge is available right now through [Seagate’s web
    store](https://www.seagate.com/products/gaming-drives/pc-gaming/firecuda-forge/),
    and comes in 8TB ($699) or 20TB ($899) HDD configurations—neither of which includes
    the required SSD. Users will have to bring their own SSD, with some specific restrictions.
    The FireCuda Forge is compatible with M.2 2280 NVMe drives that are PCIe Gen3
    or higher. The maximum supported NVMe capacity is 1TB, which means that’s as much
    data as you’ll be able to dedicate to storage on the “fast side” of the hybrid
    setup. The NVMe will require minimum speeds of 2,400MB/s read and 2,000MB/s write,
    and a unit with DRAM cache is recommended. Seagate claims 2,500MB/s read and 2,000MB/s
    write speeds for the combined system, along with USB4 and support for Windows
    11 and macOS 26+.\n\n[![What's included with the new Seagate FireCuda Forge drives.](https://cdn.arstechnica.net/wp-content/uploads/2026/11/Seagate_FireCuda_Forge_Specs.pdf.png)](https://cdn.arstechnica.net/wp-content/uploads/2026/11/Seagate_FireCuda_Forge_Specs.pdf.png)\n\n
    Credit: [Seagate](https://www.seagate.com/content/dam/seagate/en/content-fragments/products/datasheets/firecuda-forge/firecuda-forge-DS37-1-2609US-en_US.pdf)\n\n_Credit:\n\n
    \                     \n          \n          Seagate_\n\nAfter dipping to historical
    lows earlier in the decade, storage pricing per TB has exploded amid the AI boom.
    According to data collected by [Tom’s Hardware](https://www.tomshardware.com/pc-components/ssds/ssd-price-tracking-2026-lowest-price-on-every-m-2-ssd),
    some solid-state drives now cost two to three times their historic lows, and it’s
    not just SSDs. Mechanical drives haven’t been immune either. According to [PCServerParts](https://pcserverandparts.com/news/hard-drive-shortage-2026-what-to-do/),
    a Seagate Exos 24TB drive that sold for $298.99 in the summer of 2025 was priced
    at $699.99 by August 2026.\n\nHybrid drives had largely fallen out of fashion
    since their heyday in the early to mid 2010s. The promise then was similar to
    what Seagate is offering now. A large HDD is combined with a smaller SSD and handed
    to the user as a single storage pool. Apple introduced its own hybrid solution
    back in 2012 with the Mac mini’s Fusion Drive. When [Ars opened up a unit](https://arstechnica.com/gadgets/2012/11/achieving-fusion-with-a-service-training-doc-ars-tears-open-apples-fusion-drive/),
    the Fusion Drive system was found to write in 128KB tiered blocks. Information
    was generally written to the SSD first, and was then migrated to the HDD as needed.
    If the files were frequently used, they might find a more permanent home on the
    SSD side of things.\n\nAs solid-state storage continued getting cheaper, the hybrid
    approach was largely abandoned. Fast-forward to our current storage cost predicament
    in 2026, and Seagate’s line of thinking that everything old is new again starts
    to hold water. All storage costs have exploded, but the 2012 math still works
    today. NAND flash is still fast, but expensive, and traditional mechanical drives
    are at least comparatively cheaper per TB for higher capacity storage.\n\nThe
    problem with Apple’s Fusion solution was its fragility. If one of the two drives
    failed, that was likely it. Recovery depended on both drives coming together as
    a single volume. If one of those two disks experienced a physical failure, recovery
    became difficult since the remaining working drive depended on the now broken
    drive’s data to rebuild the full system picture.\n\nAccording to Seagate’s press
    release, the Alkemi intelligent storage platform takes a different approach. Where
    Apple’s Fusion Drives used tiering managed by macOS, Alkemi manages the storage
    pool directly from the enclosure. Seagate says, “Alkemi learns and adapts over
    time to keep high-demand content fast and accessible on a user’s SSD, while the
    HDD provides space for growing libraries. Behind the scenes, Alkemi manages data
    placement, giving users the simplicity of a single storage drive.” The product
    data sheet PDF from the FireCuda Forge website describes the Alkemi system as
    a two-tier storage system, but doesn’t elaborate any further on whether the system
    uses SSD caching, automated tiering, a combination of the two, or something else
    entirely.\n\nThe announcement doesn’t address how the Alkemi platform manages
    the data between the two drives. The old [Intel Smart Response Technology](https://arstechnica.com/gadgets/2014/05/new-intel-chipsets-speed-up-your-storage-but-theyre-missing-new-cpus/)
    kept failure risks low by mirroring data from the mechanical HDD to the faster
    SSD, with the HDD retaining the authoritative copy. The optional write-back mode
    could still hold new data on the SSD, though. Apple’s Fusion Drive instead tiered
    data in 128KB blocks across the storage pool, storing data on both drives. The
    distinction matters, and is probably why [Ars asked the same question](https://arstechnica.com/gadgets/2012/11/achieving-fusion-with-a-service-training-doc-ars-tears-open-apples-fusion-drive/)
    after Apple’s hybrid announcement 14 years ago.\n\nSeagate’s announcement speaks
    of “intelligent data tiering” without further explanation. The data system promises
    that your most accessed files will be quickest to access via intelligent storage
    management, but stops short of explaining whether one drive going down means failure
    for the whole system. There’s also no mention of how the Alkemi system distributes
    data on first boot. Does all the new written data go directly to the SSD until
    the 1TB cap is crossed, and then the system starts determining which files are
    important enough to remain on the speedier drive? Seagate seems to be keeping
    things mum for the moment, but as the drives have already launched for sale, there
    should be answers to all of these questions coming soon.\n\nSeagate hasn’t published
    technical documentation regarding how the Alkemi system handles drive failure
    or repair. Until it does, the new FireCuda Forge drives offer the same appeal
    as Apple’s old Fusion Drives: SSD speed with HDD capacity, along with the same
    questions Ars was asking about hybrid storage [years ago](https://arstechnica.com/gadgets/2012/11/achieving-fusion-with-a-service-training-doc-ars-tears-open-apples-fusion-drive/).\n\n[![Photo
    of Nick Indge](https://cdn.arstechnica.net/wp-content/uploads/2026/10/5814.jpg)](https://arstechnica.com/author/nickindge/)\n[Nick
    Indge](https://arstechnica.com/author/nickindge/)Senior Technology Reporter\n\n[Nick
    Indge](https://arstechnica.com/author/nickindge/)Senior Technology Reporter\n\n
    Nick Indge is a Senior Technology Reporter at Ars Technica covering hardware,
    embedded systems, and self-hosted infrastructure. A former security investigator
    turned tech writer, he writes to help readers escape subscription traps and regain
    ownership of their digital lives. He lives in Chicagoland with his family and
    a goofball husky. \n\n[92 Comments](https://arstechnica.com/gadgets/2026/11/seagate-resurrects-the-ssd-hdd-hybrid-drive/#comments
    \"92 comments\")\n\n[Prev story](https://arstechnica.com/space/2026/11/the-us-military-seems-to-be-getting-nervous-about-the-launch-supply-crunch/
    \"Go to: The US military seems to be getting nervous about the launch supply crunch\")\n\n[Next
    story](https://arstechnica.com/ai/2026/11/signals-encryption-just-passed-an-ai-powered-mathematical-checkup/
    \"Go to: Google DeepMind just mathematically verified key parts of Signal\")\n\n1.
