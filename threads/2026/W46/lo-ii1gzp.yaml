    This neatly explains a problem with contemporary amd64 "server" grade hardware that people really should consider: the OS should have awareness of environmental factors.
    I don't use "server" grade, because IMPI is too insecure, I can get ECC on consumer motherboards, and companies like Supermicro don't seem to take security seriously until the media lights a fire under their asses.
    I build my own servers, and each one can run at ridiculously high temperatures. Not only can they run at high temperatures, they're tested extensively at intentionally high temperatures long before they're colocated.
    When a server starts thermal throttling, instead of just letting the throttling happen and ignoring it everywhere else, the systems will automatically clock down to lower speeds, then, if the temps stay above a certain threshold, all but one CPU core will cpuctl offline. If the temperatures still stay above a certain threshold, a more attention grabbing alert is sent and a machine will shut itself down.
    Why this is almost never set up elsewhere is beyond me.
