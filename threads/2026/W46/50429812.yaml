  author: 4onthefloor124
  text: It takes a photo on lock-screen activity, an unlock, or activity after an
    idle period (2 minutes by default). It doesn&#x27;t continually photograph you
    while you work. If it detects someone else, it can take up to five follow-up photos,
    90 seconds apart, while they remain active.<p>It identifies you by comparing against
    photos you take during setup, entirely on your Mac. The camera light comes on
    with every capture, and you can restrict detection to only lock-screen activity
    and unlocks.
