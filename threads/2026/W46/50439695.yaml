  author: piva00
  text: 'Modulators [0], for example, they are available as a side-panel on any device
    which you can click the rectangle with a &quot;+&quot; button and select any type
    of modulator: LFOs (many different kinds), curves, envelopes, segments, etc.<p>Instead
    of creating a LFO as part of the chain of devices it&#x27;s clearly a thing embedded
    to the device itself, including on VSTs (so any VST can have more complex modulation
    than they offer natively). You can multi-target the modulator to affect any parameter
    on any of the devices across the whole track, so a LFO modulating something on
    the 1st device in the chain can also apply the same modulation to a parameter
    on the 9th device so they can be &quot;coupled&quot; to that movement, this mapping
    is also attenuated per application so even though the movement is the same it
    can have different magnitudes when assigned.<p>It completely removes the need
    of LFO Tool for complex curves&#x2F;ramps, etc., or the LFO as a device with the
    &quot;map&quot; button to assign to parameters, if I want 10 LFOs I can just have
    them all together as a side-pane of a device or the track itself. It makes much
    more sense that a modulator is attached to something instead of being its own
    thing on a long list of devices.<p>Another improvement: macros can live on a control
    panel for a device, whole track, or even the whole project, so you can create
    a macro knob at the project-level and map it to affect any parameter of any track,
    and just map the project-level macro knob to a MIDI controller to modulate whatever
    parameter in the whole project.<p>These are just a couple of intuitive features
    from the top of my head I use in almost every single project.<p>[0] <a href="https:&#x2F;&#x2F;www.bitwig.com&#x2F;userguide&#x2F;latest&#x2F;the_unified_modulation_system&#x2F;#modulator_devices"
    rel="nofollow">https:&#x2F;&#x2F;www.bitwig.com&#x2F;userguide&#x2F;latest&#x2F;the_unified_modulati...</a><p>Quick
    edit: another feature I remembered after writing this comment that I find more
    intuitive is the creation of control pages for a device, it&#x27;s accessible
    right below the &quot;modulators&quot; button and opens a side-pane to create
    up to 8 control knobs mapped directly to a device&#x27;s&#x2F;VST&#x27;s parameter
    or even mapped to a &quot;macro&quot; modulator which itself can be mapped to
    many parameters of a device&#x2F;VST, it&#x27;s really intuitive to create pages
    of these controls and only use the controls themselves to change parameters, I
    barely open the VST window after experimenting a bit with which parameters I want
    to play with and mapping those to controls.'
