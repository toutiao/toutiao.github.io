  author: grvdrm
  text: 'I don&#x27;t think I have anything groundbreaking yet.<p>Blending lots of
    ideas from other places (unsurprising I&#x27;m sure). I first used FL Studio,
    and am more recently an owner of Ableton. Some things I like and dislike about
    both, so what I tried to do with my app is blend what I like.<p>E.g. FL Studio
