  author: diskzero
  text: I spent some time with Soundcraft. It is no way a clone, or even a blurry
    reflection of any of the leading DAWs like Ableton, FL Studio, Logic, etc. It
    has some passing resemblance to Reaper, but Soundcraft isn&#x27;t even close in
    usability and cohesiveness.<p>I have heard people claim that ArtCraft are not
    using LLMs to generate their apps, but the presentation and code almost seem like
    someone gave their LLM agent the Reaper manual and asked it to produce a clone.<p>Their
    main tagline on the site is also strange &quot;Professional audio recording and
    mixing, rebuilt in pure Rust.&quot; Really, who cares? No one I know in the performance,
    composition and recording industry cares at all. What they care about is reliability,
    stability, workflows and support. Yes, and price. But none of the flagship DAWs
    have onerous pricing and as others have pointed out, FL Studio has been a good
    investment over the years. If price is a concern, it is hard to beat Reaper in
    terms of value and functionality.<p>I am sure people will continue to one-shot
    or iterate clones of the leading DAWs and some people will try to use them and
    probably end up wasting their time on their productions when whoever is behind
    the project moves on. It is extremely hard work supporting any application and
    the users of MIDI, audio and notation software are extremely demanding.<p>My career
    started way back working on apps for companies like Passport, Opcode and some
    other music startups, and it I had the sufficient time, the last thing I would
    want to do is just clone Ableton. My hope is that some effort will come along
    to total re-invent what and how a music creation and production app should be.
    I often times feel we hit &quot;Peak DAW&quot; over 20 years ago.
