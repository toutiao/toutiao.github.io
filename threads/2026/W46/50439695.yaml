  author: nonethewiser
  text: "&gt;If you’re determined you can always buy packs and such.<p>Im talking
    about what the biggest barrier will be to developing a DAW with LLMs. Buying the
    sounds doesnt let you redistribute them like that, you need commercial redistribution
    &#x2F; software-embedding rights. The sounds people demand are going to be a bigger
    barrier than an agent coding it.<p>Your options are<p>1. synthesize the sounds
    yourself in code. LLMs aren&#x27;t very good at this. Try it - you will play your
    sound next to a real TR808 recording and and think &quot;this isnt even close&quot;.<p>2.
    Record a real machine yourself. Expensive and outside the domain of someone who
    only has coding experience. And with the 909 there may not even technically be
    a legal way to do it since some of the sounds are recorded and stored on the device,
    so you are essentially copy their recording. Many DAWs do do this but its murky.<p>3.
    License samples from a sound company. Normal sound pack licenses only cover making
    music with the sounds, not distributing them in a DAW. You’d need a custom OEM
    deal (contacting the company, negotiating, paying probably a lot, lawyer to check
    contract, etc).<p>4. License directly from Roland (not a thing as far as I know)<p>You
    need a real sound designer. But you could make a serviceable DAW with an LLM without
    having experience writing DAWs.<p>This is the same problem seen elsewhere, like
    video games. AI can do the code. It&#x27;s the media that it can&#x27;t really
    understand and someone without domain experience doesn&#x27;t have the expertise,
    and doesnt even know what they don&#x27;t know."
  score: 0
