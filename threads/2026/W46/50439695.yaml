  author: vectordust
  text: Part of this answer depends your specific budget&#x2F;financial situation.
    I&#x27;ve been an Ableton user since 2014. I bought Live 9 Lite at the time (probably
    came included with a midi device I bought), because I was still in undergrad and
    wasn&#x27;t sure if I was going to stick with it. Looking at my order history,
    I later bought Live 9 Standard and used that until 2018 when I upgraded to Live
    10 Suite (I&#x27;ve since upgraded to every new version of Suite on release, including
    13).<p>My advice, if you have the budget, get Standard and upgrade to Suite later
    (at a discount). Suite is _nice_ but it&#x27;s really mostly bells and whistles
    that you don&#x27;t &quot;need&quot; to get from Ableton. Suite has a ton of included
    sound packs and instruments that are certainly useful but may not be useful to
    you.<p>As for the Akai MPK Mini, that&#x27;s going to be entirely subjective IMO.
    I&#x27;ve bought several midi controllers over the years, and I&#x27;ve settled
    on a few key pieces that I&#x27;m happy with. The Arturia KeyStep 37 is the perfect
    keyboard for my desktop. It has enough range in a compact form factor and doesn&#x27;t
    have any features I don&#x27;t need (I&#x27;m not affiliated with Arturia).<p>If
    you don&#x27;t already have a midi keyboard, I would suggest grabbing an affordable
    one!
