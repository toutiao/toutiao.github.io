  author: Skeime
  text: I think we will just end up disagreeing here. If I want to get out a presentation
    combining data from two tables in a one-to-many relationship, potentially filtered
    by fields in both tables, I see no really convincing option. To be explicit, I&#x27;ll
    use &quot;Give me a list of all my customers in Oregon who have made a purchase
    within the last year together with those purchases&quot; as an example.<p>I can
    write a single join in SQL to get this, but then the customer information will
    be repeated on each purchase line. For my report I will also need to group orders
    from the same customer together. So now I have asked my database to duplicate
    the customer information across rows, only to deduplicate the data in my application
    again.<p>I can create two SQL queries, one for the customers, one for the purchases.
    I will still need to use joins (or WHERE-EXISTS clauses), because I do not want
    to extract all my customers and&#x2F;or purchases from the database. Then, in
    the application I need to combine the results of those two queries. This will
    require me to implement the same join (or at least, its matching logic) yet again.<p>Neither
    of these really seem all that great to me. Of course, one can work around these
    limitations, many database adapters do. But in my opinion, this does not mean
    that SQL should not have provided a native solution for this. (There are tons
    of other things it could have left out as well, by that logic.)<p>The agg functions
    are probably the closest thing we have. I have mentioned my gripe with the JSON
    versions before, they lose valuable type information due to JSON&#x27;s limited
    data model. The array_agg version is usually not very ergonomic on the receiving
    end. Both are also more cumbersome to write in SQL than I would like.<p>For what
    it&#x27;s worth, I also think that SQL teaching generally emphasizes joins as
    the natural way to work with relational databases way to much. The agg functions
    might appear almost as an afterthought at the very end. (To be fair to the creators
    of teaching materials, to me, they also appear as an afterthought in SQL itself.)
