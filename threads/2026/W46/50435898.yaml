  content: "# The missing user interface for [relational databases](/docs/intro/what-is-ultorg/#rdb)[PostgreSQL](/docs/connect/postgresql/)[Microsoft
    SQL Server](/docs/connect/mssql/)[MySQL](/docs/connect/mysql/)[MariaDB](/docs/connect/mysql/)[DuckDB](/docs/connect/duckdb/)[BigQuery](/docs/connect/bigquery/)[Oracle](/docs/connect/oracle/)[Microsoft
    Access](/docs/connect/msaccess/)[spreadsheets](/docs/connect/excel/#as-db)[Excel
    sheets](/docs/connect/excel/)[Google Sheets](/docs/connect/gsheets/)[CSV Files](/docs/connect/csv/)\n\nUltorg
    is an efficient, spreadsheet-like UI for relational databases. Query and edit
    data across tables and relationships, without SQL or custom CRUD apps. [Watch
    the conference talk.](/docs/intro/demos/#hytradboi22)\n\n[Download Ultorg](/download/)\n\nMacOS
    | Windows | Linux  \n14-day free trial\n\n### Explore, combine, query, and edit
    data in spreadsheets and relational databases:\n\n- [![PostgreSQL](images/conn_postgresql.svg
    \"PostgreSQL\")](/docs/connect/postgresql/)\n- [![Microsoft SQL Server](images/conn_mssql.svg
    \"Microsoft SQL Server\")](/docs/connect/mssql/)\n- [![MySQL](images/conn_mysql.svg
    \"MySQL\")](/docs/connect/mysql/)\n- [![MariaDB](images/conn_mariadb.svg \"MariaDB\")](/docs/connect/mysql/)\n-
    [![DuckDB](images/conn_duckdb.svg \"DuckDB\")](/docs/connect/duckdb/)\n- [![BigQuery](images/conn_bigquery.svg
    \"BigQuery\")](/docs/connect/bigquery/)\n- [![Oracle Database](images/conn_oracle.svg
    \"Oracle Database\")](/docs/connect/oracle/)\n- [![Microsoft Access](images/conn_access.svg
    \"Microsoft Access Database Files\")](/docs/connect/msaccess/)\n- [![Excel](images/conn_xls.svg
    \"Microsoft Excel Workbooks\")](/docs/connect/excel/)\n- [![Google Sheets](images/conn_gsheets.svg
    \"Google Sheets\")](/docs/connect/gsheets/)\n- [![CSV/TSV Files](images/conn_csv.svg
    \"CSV/TSV Files\")](/docs/connect/csv/)\n\n> [![Profile Photo](/images/twquote/pp3.jpg)\n>
    \n> Matías Fernández\n> \n> @matias\\_\\_eduardo\n> \n> ![Logo X](/images/logo_twx.svg)](https://twitter.com/matias__eduardo/status/1532289966939811840)\n>
    \n> [@ultorg](https://twitter.com/ultorg) is the most mind blowing database tool
    I have ever seen. The way it can visualize multiple joins feels canonical in the
    sense that now, when I run complicated SQL queries, \\*that’s\\* the format I
    use to imagine the results. [vimeo.com/695905306](https://vimeo.com/695905306)\n\n>
    [![Profile Photo](/images/twquote/pp4.jpg)\n> \n> Gene Kim\n> \n> @RealGeneKim\n>
    \n> ![Logo X](/images/logo_twx.svg)](https://twitter.com/RealGeneKim/status/1522323700619522048)\n>
    \n> Jaw dropping talk on a way to view SQL databases without writing a custom
    app.  \n>   \n> Imagine Microsoft Access crossed with Microsoft Excel and a big
    dose of incredible sorcery  \n>   \n> So exciting!! Can’t wait to learn more about
    [@ultorg](https://twitter.com/ultorg)\n\n> [![Profile Photo](/images/twquote/pp8.jpg)\n>
    \n> Justin Duke\n> \n> @jmduke\n> \n> ![Logo X](/images/logo_twx.svg)](https://twitter.com/jmduke/status/1195076568516743168)\n>
    \n> This presentation by [@eirikbakke](https://twitter.com/eirikbakke) on a generic
    UI abstraction to navigate a relational database is the most exciting bit of interaction
    design I've seen in a long, long time.  \n>   \n> [vimeo.com/372006027](https://vimeo.com/372006027)\n\n>
    [![Profile Photo](/images/twquote/pp7.jpg)\n> \n> Petri Aukia\n> \n> @aukia\n>
    \n> ![Logo X](/images/logo_twx.svg)](https://twitter.com/aukia/status/1519598605304315905)\n>
    \n> The future never came: I expected dynamic multi-dimensional spreadsheet to
    sooner or later become the norm ever since I saw Lotus Improv.  \n> With [@ultorg](https://twitter.com/ultorg)
    you get to wonder – perhaps the multidimensional UI is to a set of database tables,
    not to a spreadsheet.\n\n_“Harmonic is building mathematical superintelligence.
    Deep, detailed analysis of our system's outputs is crucial for rapid advancement
    of our research agenda. Ultorg provides, by far, the best tool for visualizing
    and investigating our data. It is an invaluable tool for our research.”_\n\n —Tudor
    Achim, co-founder and CEO, [Harmonic](https://harmonic.fun/about)\n\n ![Table
    Icon](images/sect_tables.svg)  \n\n## Tables of Data\n\nWhether in finance, engineering,
    operations, or the life sciences, you are likely working with _tables of data_
    in spreadsheets, CSV files, or an external database. Spreadsheets are excellent
    tools for managing a single table of data. They are a poor fit for database tasks,
    however, where data must be combined and queried in many different ways.\n\nUltorg
    is a general-purpose, graphical user interface for [relational databases](/docs/intro/what-is-ultorg/#rdb).
    That means any data that's organized into tables with rows and named columns.
    Behind the scenes, Ultorg generates [SQL queries](/docs/intro/what-is-ultorg/#queries)
    that execute either remotely or on your local computer.\n\nConnect to:\n\n- [PostgreSQL](/docs/connect/postgresql/)\n-
    [Microsoft SQL Server](/docs/connect/mssql/)\n- [MySQL/MariaDB](/docs/connect/mysql/)\n-
    [DuckDB and Parquet](/docs/connect/duckdb/)\n- [Google BigQuery](/docs/connect/bigquery/)\n-
    [Microsoft Access Files](/docs/connect/msaccess/) (.mdb/.accdb)\n- [Microsoft
    Excel Files](/docs/connect/excel/) (.xls/.xlsx)\n- [Google Sheets](/docs/connect/gsheets/)\n-
    [CSV/TSV Files](/docs/connect/csv/)\n- Other [JDBC-based data sources](/docs/connect/otherdbs/#jdbc)\n-
    In beta: [Oracle](/docs/connect/oracle/), [Snowflake](/docs/connect/otherdbs/#snowflake),
    [SQLite](/docs/connect/otherdbs/#sqlite), [Athena](/docs/connect/otherdbs/#athena),
    [Exasol](/docs/connect/otherdbs/#exasol)\n\n ![Join Icon](images/sect_joins.svg)
    \ \n\n## Visual Joins\n\nA [join](/docs/query/fields-and-joins/#joins) is a fundamental
    database operation that combines data from two different tables, based on a common
    identifier such as “Room Number” or “Customer&nbsp;ID”. Joins are frequently needed
    when working with multi-table datasets.\n\nIn Ultorg, you can quickly join data
    from multiple tables or data sources, and interact with the result through a single,
    spreadsheet-like data manipulation surface.\n\nFor SQL-based data sources, Ultorg
    will recognize existing foreign key relationships, and suggest relevant joins.
    Or you can join on arbitrary fields, e.g., to [combine data](/docs/query/multi-source/)
    from a spreadsheet and a CSV file.\n\n ![One-to-Many Icon](images/sect_plural.svg)
    \ \n\n## One-to-Many Relationships\n\nA join between two tables will often involve
    a [one-to-many relationship](/docs/query/fields-and-joins/#one-to-many), where
    each row in the first table can match multiple rows in the second table.\n\nUltorg
    will visualize any combination of one-to-many relationships, in a compact but
    readable way, using a specially developed system of visual data layouts. Sorting,
    filters, and formulas can be applied at any level, and joins can be chained or
    included side-by-side without losing or duplicating rows.\n\nAmong visual database
    tools, Ultorg is unique in its ability to handle one-to-many relationships in
    a general way.\n\nOne-to-many relationships also occur inside database queries,
    when grouping on fields to calculate sums or averages, or when nesting one query
    within another. Ultorg will visualize each stage of such data flows.\n\nFor example,
    you can see the individual values that contribute to a group-wise [sum](/docs/query/formulas/#aggregates).
    This lets you audit the query visually. You can tweak filters and calculations
    in the input, while gaining confidence in the aggregated totals.\n\n ![Filter
    Icon](images/sect_sql.svg)  \n\n## SQL Without SQL\n\nAt first glance, Ultorg's
    [direct manipulation](/docs/query/sql-equivalence/) interface resembles a spreadsheet.
    The tabular layout you see on the screen, however, represents a real database
    query, which can be refreshed and modified without risking changes to the underlying
    raw data.\n\nA visual query lets you see exactly the data you need for a particular
    business task, without descending into a code editor, form designer, or flow chart.
    Even for database experts, Ultorg will serve as a rapid alternative to hand"
