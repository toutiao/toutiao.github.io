  text: Ultorg is mostly UX research that Bakke published in 02009 when he was working
    on his Master&#x27;s Thesis at CSAIL.  I haven&#x27;t heard of any patents on
    it, but any patents that cover the version of SIEUFERD he published at the time
    would have had to be applied for by 02010 (02009 outside the US), meaning they&#x27;d
    expire by 02030 (02029).  And I think it would have been pretty difficult to get
    a patent on the things they added later, like adding crosstabs to it.<p>Having
    published it so long ago means that it&#x27;s excellent prior art for patents
    <i>others</i> might try to use against Ultorg or Ultorg clones.
