  author: Skeime
  text: It is the language&#x27;s fault, because SQL offers no good way to get nested
    results. If you want to avoid the duplication, you can do multiple queries, but
    then you essentially have to do the join on the receiving end, which kind of defeats
    the purpose of having joins in SQL.<p>Alternatively, you might use functions to
    aggregate in the query, but they&#x27;re not standard, as far I know, which means
    that interfaces in programming languages often do not support them. The best bet
    might be aggregating into JSON, but this removes quite a bit of the type information
    that values in SQL usually carry. (Also, the aggregation functions are generally
    less pleasant to write than standard joins.)
