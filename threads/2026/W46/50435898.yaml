  author: win311fwg
  text: SQL&#x27;s biggest design flaw was rejecting the relational model, which leads
    to the join problems the earlier comment talks about.<p>The second biggest flaw,
    which isn&#x27;t really about SQL itself but in implementation, was attaching
    SQL to the network where latency starts to become a problem. That requires hacks
    to work around. This is likely this is why you&#x27;re seeing data duplication
    — trading all that duplication to avoid the latency problems that wouldn&#x27;t
    be a problem if you kept it on the same machine like SQL originally intended.
  score: 0
  posted_at: '2026-11-10T16:05:42Z'
- id: '50442369'
  parent_id: '50439196'
  author: win311fwg
  text: "<i>&gt; because SQL offers no good way to get nested results</i><p>Because
    you don&#x27;t need nested results. You can fire off another query.<p>Although
    I am venturing to guess that you feel you need nested queries because you&#x27;re
    doing doing something stupid like trying to send SQL queries over the network
    where the cost of firing off another query becomes a great performance burden.
    But the answer to that is don&#x27;t do that. SQL was specifically designed to
    be run on the same machine as your application.<p>If you need to present the data
    to network clients where nesting is necessary for performance reasons, turn your
    application into the network database service that produces nested data (the &quot;API
    server&quot; as the kids call it). Leave the SQL as an implementation detail hidden
    behind the scenes."
  score: 0
