  title: Synaptics patent claims stop work on DisplayLink drivers [LWN.net]
  fetch_status: success
  content: "By **Joe Brockmeier**  \nNovember 10, 2026 \n\nMike Lothian owns a docking
    station (or dock) that uses a [DisplayLink](https://en.wikipedia.org/wiki/DisplayLink)
    chipset that had, at least in his opinion, subpar performance on Linux. He decided
    to try improving the Linux driver, with LLM assistance, but ran into one problem
    that he could not solve—so he asked for help, hoping that Synaptics's developers
    would lend a hand. (DisplayLink was [acquired by Synaptics](https://www.synaptics.com/company/news/displaylink)
    in 2022.) Rather than help him in improving the driver, however, the Synaptics
    legal team responded with patent infringement claims, a [demand](https://lists.freedesktop.org/archives/dri-devel/attachments/20261006/d690bb16/attachment-0001.pdf)that
    he cease unauthorized implementation of DisplayLink technology, and threats of
    expensive legal penalties. For now, it appears that Linux users of the company's
    docks will have to continue to live without feature parity with other platforms.\n\n####
    Synaptics and Displaylink\n\nThe dock that he was trying to support is a Dell
    device that connects to a system via USB&nbsp;3 and allows users to connect multiple
    monitors and other devices to their computer. It provides its [DisplayLink Manager
    (DLM) software for Linux](https://www.synaptics.com/products/displaylink-graphics/downloads/ubuntu)
    for the devices via an APT repository for Ubuntu.\n\nThe company only provides
    DLM software in binary form, and only for x86-based platforms. The software is
    proprietary, but the company does maintain an open-source, out-of-tree kernel
    module that is included with DLM, the[Extensible Virtual Display Interface](https://github.com/DisplayLink/evdi#readme)
    (EVDI) project. It provides a driver that's compatible with [Linux&nbsp;DRM](https://docs.kernel.org/gpu/introduction.html)
    and allows users to manage their docked displays with standard tools used for
    display settings, such as or GNOME and KDE&nbsp;Plasma's utilities.\n\n> The [LWN
    kernel-source database](/ksdb/) is the definitive source of information about
    kernel releases. [Try a one-month free trial subscription](https://lwn.net/Promo/KSDB/claim)
    for immediate access to LWN's kernel content and KSDB as well.\n\nA [short article](https://support.displaylink.com/knowledgebase/articles/1104056-why-has-displaylink-not-released-source-code-for-t)
    explains why the company has not released source code for DLM: the software uses
    a proprietary graphics technology called DL3 to create a compressed stream of
    the various channels (e.g., USB, DisplayLink video, audio) over a communication
    channel (USB&nbsp;3 in this case) and decode it again for output to the user's
    devices.\n\nUnfortunately, the vendor-supplied software did not work well for
    Lothian. I spoke and chatted with him via Signal while writing this article; he
    said that the driver kept crashing under Linux, so he decided to use his Claude
    subscription to try to develop a new driver and support software.\n\n#### Vino\n\nHe
    posted the [first patch series](https://lwn.net/ml/all/20260617151249.2937-1-mike%40fireburn.co.uk/)
    for Vino—his Rust-based DRM/KMS driver—to the kernel's dri-devel list as an RFC
    on June&nbsp;17. Lothian noted that it was in an incomplete state, and asked for
    help with a blocker that he had run into trying to communicate with the dock's
    control plane. \"\" He received feedback from a few developers, including [guidance](https://lwn.net/ml/all/DJBG3H7N9GS9.7AMMRJIHGHRN@kernel.org/)from
    Danilo Krummrich to rework the driver to use the Rust [KMS bindings](https://lwn.net/Articles/997850/#kms),
    but no advice specific to the problem he was trying to solve.\n\nLothian also
    opened [an issue](https://github.com/DisplayLink/evdi/issues/577) on the EVDI
    GitHub repository on June 17. It explained the work he'd done so far, outlined
    the approach in trying to reverse-engineer the DL3 protocol, provided links to
    his GitHub repository with the Vino code, and asked for clarification on a few
    issues. There was no reply to his issue.\n\nHe also reached out to Łukasz Spintzyk
    of Synaptics directly by email; his correspondence with the company between July&nbsp;5
    and October&nbsp;7 is available in [this PDF compiled by Lothian](/images/pdf/synaptics-correspondence-jul-oct-2026.pdf).
    He noted that he had found a few bugs in EVDI and opened a [pull request](https://github.com/DisplayLink/evdi/pull/581)
    (that went unreviewed for several months), and also asked for assistance where
    he was blocked on Vino. On July&nbsp;20, he received a reply, not from Spintzyk,
    but from Michal Lukaszek of Synaptics:\n\n> The reason I'm writing is that DisplayLink
    is not an open standard. The protocol, codec, and other technologies used by DisplayLink
    devices are proprietary to Synaptics and are protected by a substantial portfolio
    of patents in a number of jurisdictions, including the UK.\n> \n> From what you've
    published, it appears that the VINO project is progressing beyond interoperability
    work and toward implementing technology that we believe is covered by those patents.
    While many developers understandably focus on avoiding copyrighted source code,
    patent law is different. An independently written or clean-room implementation
    does not necessarily avoid patent infringement if it implements patented inventions.\n\nLukaszek
    said it was entirely possible that Lothian was unaware of the \"\", so he wanted
    to make him aware now rather than \"\". Lothian lives in Scotland and has a \".co.uk\"
    email address, which explains why the email made reference to the UK.\n\n####
    Cease and desist\n\nOn August&nbsp;17, Andrew Bateman, an assistant general council
    of intellectual property for Synaptics, sent a [cease-and-desist notice](/images/pdf/Cease_and_Desist_Notice_Mike_Lothian_08-17-2026.pdf).
    The letter stated that Lothian had not \"\" to Lukaszek's communication, and had
    continued with \"\". It included an appendix with a list of 125 patents that \"\",
    but did not specify which patents might be infringed by the work.\n\nSynaptics
    included a list of eight demands it expected immediate compliance with, including
    ceasing development of \"\", withdrawing submissions of materials \"\", and to
    identify in writing every location \"\". It also demanded that he provide Synaptics
    with a signed confirmation, by August&nbsp;28, that he had complied with its demands.\n\nLothian,
    instead, posted [version three of his Vino](https://lwn.net/ml/all/20260826163913.7052-1-mike@fireburn.co.uk/)
    work for the DisplayLink docks to the dri-devel list on August&nbsp;26. He said
    that the previous two versions had \"\", but the new work could control three
    generations of DL3 docks without any vendor software. There were no substantive
    reviews of the patch set posted to the list, though there were some automated
    reviews from Sashiko.\n\nOn August 27, Lothian responded to Bateman and asked
    him to elaborate on the patents that Synaptics thought were being infringed. \"\"\n\nHe
    also expressed confusion about Synaptics's position that his work was being treated
    as patent infringement. Synaptics is a member of the [Open Invention Network](https://openinventionnetwork.com/)
    (OIN), which was [created](https://lwn.net/Articles/163038/) to help open-source
    developers and vendors deal with the threats of expensive patent litigation. It
    holds a large, cross-licensed portfolio that serves to provide patent protection
    to individuals, open-source projects, and large vendors alike. Lothian said that
    he was now an OIN licensee as well, and he thought that it was supposed to \"\".\n\nHe
    asked Bateman to explain how Synaptics claims \"\", and expressed a desire to
    sort things out with Synaptics constructively. \"\".\n\nLothian did not think
    he could \"\" Synaptics had demanded by August&nbsp;28 without understanding which
    patent claims it was alleging. He asked for an extension to the deadline. There
    was no response from Bateman, so Lothian sent a follow-up email on September&nbsp;18.
    He said he was concerned there was no acknowledgment to his last email, a"
