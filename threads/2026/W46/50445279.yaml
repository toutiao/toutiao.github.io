  text: It reminds me of the story of Yutaka Taniyama.  He was trying to solve elliptic
    curves, and took a very different approach, that unfortunately didn&#x27;t work,
    but it was so unique it got people looking into it, and eventually it was solved.  It
    may not have been solved if this one guy hadn&#x27;t failed at solving it so uniquely.  He
    committed suicide in part because of his perceived failure.<p>A co-worker of his,
    Goro Shimura stated:<p>Taniyama was not a very careful person as a mathematician.
    He made a lot of mistakes. But he made mistakes in a good direction and so eventually
    he got right answers. I tried to imitate him, but I found out that it is very
