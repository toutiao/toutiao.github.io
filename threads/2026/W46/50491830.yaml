  author: bishopsmother
  text: 'A few lessons from my early IT life, all by way of 3Com...<p>A strange OSPF
    problem with 3com NetBuilder routers of which nobody could get to the bottom of.
    Based in a team that maintained the 3Com relationship with this arm of the (UK)
    civil service, who solely used 3Com networking products (LAN &amp; WAN), we duly
    rang our contact and described the problem (and attempted fixes)... &quot;<i>You
    should change the PSU(s)</i>&quot; he said (eh? it&#x27;s an OSPF problem?!?!?).
    Apparently they had some sort of (RF?) issue(s) with certain NetBuilder PSUs that
    had been known (note: undocumented, at least not publicly) to cause &quot;strange&quot;
    issues (it did resolve the problem).<p>Lesson 1: Sometimes it&#x27;s the thing
    that wouldn&#x27;t even occur to you that are the root cause.<p>Having ordered
    lots (&gt;£1mn) of 3Com enterprise networking equipment (from LAN switches to
    their CoreBuiler 9000 chassis), and stuck it all in a warehouse, in preparation
    for a country-wide network upgrade - 3Com shortly thereafter (and seemingly out
    of the blue) announced their complete withdrawal from the enterprise network market.
    3Com&#x27;s messaging, as I recall, was pretty much - once the existing stock
    is gone there will be no more, and hardware support would last 2 years and after
    that - tough! Needless to say this caused quite some consternation with civil
    service execs, of which I assume invited 3com to a meeting (without biscuits)
    to discuss the situation. 3Com eventually partially walked back on said withdrawal
    (continuing to manufacture&#x2F;sell smaller variants - and card&#x2F;PSU&#x2F;etc
    compatible - of the CoreBuilder 9000) although this wasn&#x27;t enough to un-sour
    the relationship.<p>Lesson 2: Maybe this isn&#x27;t the best way to treat your
    customers, and no matter how large the vendor (or how much you spend with them)
    - this may happen to you.<p>In one of 3Com&#x27;s offices (Partington, a delightful
    place) - if you parked near the edge of the, fenced off, office car park - you
    may return to your car to find a brick embedded in it as a gift from the one of
    the locals. I assume much merriment was had by the cheeky scamps when tossing
    bricks over the fence at 3Com employee&#x27;s cars.<p>Lesson 3: Get to this 3Com
    office <i>early</i> and park in the <i>center</i> of the car park.<p>Sat with
    a (TUPEd ex-civil servant, and hence un-sackable) senior network specialist who
    was updating the network monitoring for all devices in a specific region. This
    involved refreshing (via SNMP) the interface list of all the routers&#x2F;switches&#x2F;etc.
    During this process, which was basically click refresh - move onto the next device
    - and then revisit the original device after a while to confirm it had completed,
    one of the edge routers dropped offline (and didn&#x27;t return). No problem -
    traffic would route (and bridge! IPX FTW!) via the backup router&#x2F;link. The
    senior network specialist was quite methodical in his polling, moving from one
    (now offline) edge and around the ring of devices before eventually arriving at
    the final (note: backup - and now only - route) edge router (NetBuilder). Prior
    to reaching the final router it had dawned on my little (junior, green) brain
    that maybe he had triggered a (documented) NetBuilder bug that would cause the
    router to hang - needing a physical reboot - if SNMP walking a device with an
    FDDI card (which these routers had). Having voiced my theory, and in doing so
    suggesting that polling the final router may not be the wisest course of action,
    he confirmed that it was his job to poll the routers and that is what he was damn
    well going to do. The backup router dropped offline. 100s&#x2F;1000s of civil
    servants now unable to do their job (that required mainframe access that resided
    beyond the edge routers) and needing physical intervention (i.e. ~1 hour) to resolve.
    Based on previous observations, I assume productivity for those users dropped
    by a single-digit percentage within that dark hour.<p>Lesson 4 (one of <i>many</i>
    such lessons reinforcing this view): 3Com&#x27;s enterprise networking software
    sure has some strange bugs. Also, welcome to the public sector (or public sector
    adjacent).<p>Given the various bugs observed during my time in the team - I didn&#x27;t
    hold the quality of 3Com&#x27;s enterprise networking products&#x27; software
    in very high regard. Such low opinions would only be surpassed in later years
    by Fortinet&#x27;s security&#x2F;networking products&#x27; software releases.'
