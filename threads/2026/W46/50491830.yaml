  author: msgilligan
  text: 'It was great to work with Metcalfe. I have two funny stories to share.<p>I
    was on the Macintosh network os client team. For whatever reason (maybe he was
    annoyed that Apple copied so much from Xerox) Metcalfe didn&#x27;t like Macs.
    In this era Macs used Apple&#x27;s proprietary AppleTalk&#x2F;LocalTalk network.
    We did a demo for 3Com execs using a large external monitor connected via a single
    black coax cable that looked just like thin-ethernet. He got excited for a moment
    and came right over to look at the Mac and was very disappointed to see the cable
    attached to a display! (3Com was working on Ethernet cards for Mac at the time
    but they weren&#x27;t ready at the time of this demo.)<p>For those too young to
    remember: there was an SF Bay Area baseball park known as Candlestick Park that
    was briefly branded &quot;3Com Park&quot; -- to the great annoyance of SF Giants
    fans. During one interview he as asked if in the early days of 3Com he would have
    done anything differently. He said, &quot;I would have named the company &#x27;Candlestick&#x27;!&quot;'
