  author: jonah-archive
  text: |-
    My favorite 3Com-related thing: <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20210421224904&#x2F;https:&#x2F;&#x2F;nixdoc.net&#x2F;man-pages&#x2F;FreeBSD&#x2F;man4&#x2F;i386&#x2F;ep.4.html" rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20210421224904&#x2F;https:&#x2F;&#x2F;nixdoc.ne...</a><p><pre><code>     ep0: 3c509 in test mode. Erase pencil mark!  This means that someone has
         scribbled with pencil in the test area on the card.  Erase the pencil
         mark and reboot.  (This is not a joke).
    </code></pre>
    It&#x27;s the E1 pad between the barcode and the empty BIOS socket: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;3Com_3c509#&#x2F;media&#x2F;File:3Com_3C509BC_Ethernet_NIC.jpg" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;3Com_3c509#&#x2F;media&#x2F;File:3Com_3C...</a><p>Details (pg 88): <a href="https:&#x2F;&#x2F;www.ardent-tool.com&#x2F;NIC&#x2F;3c5x9b_Technical_Reference.pdf" rel="nofollow">https:&#x2F;&#x2F;www.ardent-tool.com&#x2F;NIC&#x2F;3c5x9b_Technical_Reference.p...</a><p>----------------------------------------<p>It is the user’s responsibility (with help from the configuration program) to avoid configuring the boot PROM on the adapter in such a way that the system is not able to boot. If this does occur, you can manually jump the Test Via using a #2 pencil. The Test Via forces the adapter into test mode, which disables the boot PROM so that the adapter configuration program can be run. You must cover the designated area thoroughly with the pencil mark.<p>Test mode forces the adapter not to perform the Automatic Initialization sequence, which means the EEPROM is not read and the adapter is left in the following configuration:<p>■ Address Configuration register = 0000h<p>■ Resource Configuration register = 0000h<p>■ Product ID register = 0000h<p>Test mode also shortens the ID sequence to 8 bytes (first is still FFh and last is 69h) and forces it to the active state (that is, the adapter is active and will respond to I&#x2F;O cycles at base address 0200h even without going through the ID sequence).<p>After you are done, thoroughly erase the pencil mark.<p>----------------------------------------
