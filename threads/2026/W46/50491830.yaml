  author: mesrik
  text: "&gt;That&#x27;ll stop people logging in and making local changes and expecting
    everyone else to somehow just know about their tampering.<p>How about changing
    &quot;enable secret&quot; password and not sharing it with those who you do not
    approve making changes?<p>Or even setting up TACACS+ or RADIUS service and getting
    SSO to network gear that way. TACACS+ even free versions by default as an AAA
    that last A accounting makes you able to log all logins and commands being executecuted
    IOS cli.<p>Also, you can set up a management server (station) which collects all
    configs, checks in a db or VCS (RCS, CSV, git) which you can then build on changes
    monitoring, revert back configs as far as you have saved config versions. Like
    I had while working over 20 years backlog about half thousand switchers and other
    gear. RANCiD can do it for cheap, if you don&#x27;t like to buy commercial solution
    which also can do similar things. Oh, OpenNMS and FreeNMS probably can do this
    also if you prefer getting those. I didn&#x27;t use those as we built from mid
    90&#x27;s own systems and didn&#x27;t bother changing at least when I was still
    working.<p>If you still need to allow other users login let other commands that
    enable level requires, you can use a &quot;parser view group-name&quot; and pick
    what additional commands you let them also access from exec enable level (15)
    without letting then become full enable 15 level users.<p>ps. Cisco IOS has long
    had service which autoloads config from TFTP server, but that isn&#x27;t perhaps
    what you are looking for. It&#x27;s mostly intended getting initial config uploaded
    to system enabling remote management over telnet and further making proper config
    automation easier."
