  author: giancarlostoro
  text: "&gt; Exact is a cross-platform application runtime. You describe your interface
    in Contract, a small declarative language, and you write your data logic in TypeScript
    or Rust. The Contract compiler turns the interface into a compact plan. On the
    web, that plan becomes one ES module over a ~20 KB runtime that drives the real
    DOM.<p>It&#x27;s funny, I&#x27;m working on a few different compilers with Claude
    Code to experiment, and I had an epiphany this morning, we&#x27;re entering an
    age in programming, where you could just create your own compiled language (or
    DSL) for your framework &#x2F; application effortlessly, it can have whatever
    requirements you want.<p>I&#x27;ve also used Claude to help me make Mojo compile
    under Windows, since they haven&#x27;t ported it yet, took less than you&#x27;d
    think, downside is the key thing about Mojo is not open source, so I could never
    port that myself, but at least basic Mojo programs compiled. Might have to try
    DMD on Apple Silicon next to see..."
  score: 0
