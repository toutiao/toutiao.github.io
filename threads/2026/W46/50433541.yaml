    ### 2. Speed is king

    Speed of the app and speed of the loop. Each budget in rules/RULES.md is tracked on every commit, and a regression is a P0 with a name on it.

    How the design keeps those numbers:

    - The boot path executes and compiles nothing. TypeScript is compiled to Hermes bytecode at build time and loads after the first pixel. The first frame comes from data baked into the plan.

    - Pay only for what you use. GPU rendering, the Markdown editor, text flow, and browser SQLite are separate artifacts, loaded on demand. Nothing is a feature flag on a core crate.

    - The web gets its own small runtime. On the RealWorld ("Conduit") benchmark, Exact's runtime was up about 300 ms before the React SSR build had hydrated. It used 26 KB of code against React's 81 KB (the RealWorld benchmark in apps/realworld).

    - Edits land in about a tenth of a second. On a fresh app made by exact new, a saved Contract or TypeScript edit was rebuilt and in the page in 99 ms.

    ### 3. Write the web, ship the platform

    What you write is CSS: the vocabulary, the layout model, the development loop. What you leave unsaid is the platform's: controls, colour, type, motion, gestures, the keyboard and accessibility come out as an app built by hand with UIKit or AppKit would have them, and on the web as a carefully built web app would. What you write wins. The order is author, then platform, then CSS's default, and one test settles a dispute: would someone who knows the platform notice?

    - Layout is CSS's, because a person can't see a layout default, only its result. A bare node is display: block, box-sizing: content-box, flex-direction: row, flex-shrink: 1, the same as a bare <div>.

    - Names are CSS's, because names are what you write: font-size, object-fit, text-overflow, line-clamp, light-dark(), env(safe-area-inset-top). The compiler refuses an alias and names the web's spelling.

    - Unsaid presentation is the platform's. Text is the system's label colour and size (17 points on an iPhone, 13 on a Mac, the reader's setting in a browser), a button is the system's button, a pushed screen has the system's Back. An app that says less looks more at home.

    - The browser is the parity oracle for layout and for what you wrote. Native layout given the same inputs, Canvas 2D, SVG, gradients, and authored motion are checked against what Chrome draws.

    - The web is also the development loop. You work on the seconds-long web loop, and the native hosts are swept behind you.

    - Any unavoidable deviation in layout is declared, with its reason. For example, Taffy has no position: static.

    Writing the web doesn't mean the lowest common denominator. Where a platform can do more (real HTML in an SVG foreignObject on the web, MapKit through a native module on Apple), Exact lets it.

