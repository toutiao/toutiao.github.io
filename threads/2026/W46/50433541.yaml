    ## Three principles

    ### 1. Agent native

    Exact assumes much of the code will be written by AI agents. An agent can make an app, run it, look at it, operate it, and prove it works without a person in the loop.

    - Ten operations, the same on every host. tree · screenshot · tap · type · state · layout · logs · clock · prefer · perf drive the web, macOS, iOS (Simulator or a real iPhone), and Linux through one script, scripts/agent.mjs. There are ten on purpose: an agent API grows one reasonable addition at a time until no one can hold it in mind.

    - The clock belongs to the agent. Between two operations nothing moves. Instead of sleeping until an animation finishes, the agent says clock +60000 or clock settle and reads the result. No timing flakes, no waits.

    - Tests are scripts of those operations. An app.test.contract file runs unchanged on any host, with no second evaluator.

    - Every tool speaks to machines. contract build --json gives diagnostics with stable ids and source ranges. contract symbols gives navigation. A development source map leads from any node on screen back to the line that declared it. The driver refuses to drive a build older than its sources and names the rebuild.

    - Contract is small on purpose. A whole app fits in a context window. Every write is declared, every list is keyed, every value is typed. Mistakes are refusals that say what to do, not quiet misbehavior.

