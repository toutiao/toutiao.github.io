  author: whilenot-dev
  text: |-
    If I understand you correctly, #1 is just plain wrong. JSX is transformed into standard ECMAScript[0]. You can store JSX-nodes in variables and pass them around however you like.<p><pre><code>  &#x2F;&#x2F; this
      &lt;Box&gt;
        {
          shouldShowAnswer(user)
            ? &lt;Answer value={false}&gt;no&lt;&#x2F;Answer&gt;
            : &lt;Box.Comment&gt;
                Text Content
              &lt;&#x2F;Box.Comment&gt;
        }
      &lt;&#x2F;Box&gt;

      &#x2F;&#x2F; ...can be written like this
      const answer = (
        &lt;Answer value={false}&gt;
          no
        &lt;&#x2F;Answer&gt;
      );
      const comment = (
        &lt;Box.Comment&gt;
          Text Content
        &lt;&#x2F;Box.Comment&gt;
      );
      const result = shouldShowAnswer(user) ? answer : comment;

      &lt;Box&gt;
        {result}
      &lt;&#x2F;Box&gt;
    </code></pre>
    In React at least, <i>null</i> won&#x27;t render anything.<p>#2 is a known trade-off, and so marginal and well known that it&#x27;s almost not worth mentioning it.<p>[0]: <a href="https:&#x2F;&#x2F;react.github.io&#x2F;jsx&#x2F;" rel="nofollow">https:&#x2F;&#x2F;react.github.io&#x2F;jsx&#x2F;</a>
