  text: With all the talk of game decompilations lately, I thought it'd be interesting
    to look back at early writing on the topic. This article is from two developers
    who worked on the Phantasy Star Collection for GBA; it's interesting seeing that
    they had access to the actual source code for Phantasy Star III, but still went
    for decompilation/translation and only referenced the source code for bugfixes
    and enhancements.
