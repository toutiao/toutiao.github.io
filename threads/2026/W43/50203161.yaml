  text: The magic sauce in intelligence is context-awareness. If a prompt is somewhat
    general (&quot;make me a calculator&quot;) an AI should either ask questions,
    or make reasonable assumptions, or both.<p>IME LLMs <i>often</i> make reasonable
    assumptions, but sometimes they don&#x27;t and you have to backtrack and say &quot;No,
    what I meant was...&quot;<p>When the process works it&#x27;s almost magical because
    the LLM successfully anticipates your needs, and implements your request in a
    much fuller way than you might have done yourself.<p>When it doesn&#x27;t it makes
    a mess you have to clean up.<p>But generally I&#x27;ve been impressed by how well
    the leading LLMs will Do The Thing from a brief description, interpolating useful
    and correct details without being told to.<p>Compilers don&#x27;t work like that.
    They&#x27;re translators, not (entry level) inventors with independent agency.
