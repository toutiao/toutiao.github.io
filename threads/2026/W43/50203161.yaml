  author: nickm12
  text: I send this article to everyone who tells me how English is now a high-level
    programming language, the next level of abstraction up the chain from machine
    language to &lt;their favorite language&gt;. This analogy tends to be followed
    by &quot;Just like most programmers never look at assembly code, looking at higher-level
    source code is going to become something only a few people do&quot;.<p>Dijkstra&#x27;s
    arguments tend not to change their minds. I think the analogy takes hold because
    there is a kernel of truth in it. AI models now give us the magical ability to
    program in natural language, but the implication that an AI model is a form of
    compiler is deeply flawed. AI models don&#x27;t replace compilers, they replace
    software developers. The reason software developers rarely look at assembly code
    is that compilers (and emulators and VMs) are able to precisely preserve the semantics
    of the original program.<p>A natural language spec is not a program, and there
    are many possible programs that can meet the spec. Software engineers and AI models
    turn specs into code, but the code is not the spec I think the analogy clouds
    our thinking about the value of programming languages as a tool for formally describing
    what the computer should do and enforcing properties of the program that should
    not be left to either humans or AI models to uphold.
  score: 0
