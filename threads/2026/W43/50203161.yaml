  author: ninkendo
  text: These two statements are distinct:<p>- You can program in natural language<p>-
    You can tell an AI what to do in natural language, and it can gather requirements,
    sketch up a design, write code, search the web for error messages, and iterate
    on the program until it works.<p>For certain things people care about, they’re
    equivalent (I tell the computer what I want and out pops a program) but for certain
    other things, they’re absolutely not (natural language doesn’t map deterministically
    into machine instructions.)<p>When people talked about natural language programming
    decades ago, they were talking about a system that compiles natural language into
    machine code. They weren’t talking about a system that autonomously gathers requirements,
    decides what frameworks to use, searches the web to look up error messages, iterates
    on ideas, etc… these things are so different from “natural language maps to machine
    code” that I don’t think we’re going to have a useful discussion if you think
    “I tell the computer what I want” is the only aspect of this worth looking at.
