  author: Crosseye_Jack
  text: "&gt; I just thought it was more time efficient to do it manually rather than
    spend days trying to figure out how to automate SD card pull&#x2F;plug<p>Heres
    the thing. You only have to build the automation once. While it will only take
    you seconds at most to pull a card, you gotta sit around and be ready for the
    card to be pulled.<p>For your problem I see 2 quick things that came to minq very
    quickly that could do SD card pulling for you.<p>1) shove a level shifter in between
    the SD card and device under test and have a micro enable&#x2F;disable the level
    shifter when you want to pull&#x2F;unpull. ( you can even get multiplexer IC that
    will do the same thing as the level shifter as acting as a switch for the SD card
    lines, but would allow you to connect the SD card to a 2nd device (the testing
    pc) to allow you to write&#x2F;read data from the card when its &quot;pulled&quot;
    from the DUT.<p>2) 3D print a jig that will insert&#x2F;remove the SD card and
    use a cheap RC servo to handle the movement - again using a mirco to control the
    servo. gives a more real world test of pulling the SD card. but only gives the
    the ability to pull&#x2F;insert. Still required manual effort if you need to read&#x2F;write
    to the SD card<p>Once you have build the jig, you can reuse the jig on the next
    project, so while it will take some time to do&#x2F;setup it could save you time
    later down the road.<p>Edit: As for the code driving the ICs or Servo, I&#x27;m
    presuming you already know embedded programing, but even so, a simple Arduino
    sketch will be able to handle it for you, fuck ton of example code already exists
    for it, and can be easily controlled over USB."
