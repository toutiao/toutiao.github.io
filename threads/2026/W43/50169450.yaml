  author: defrost
  text: |-
    <i>Apician Morsels; or, Tales of the Table, Kitchen, and Larder</i> &quot;a farrago of gastronomical curiosities published in 1829 under the pseudonym Dick Humelbergius Secundus&quot; isn&#x27;t exactly comedic, but you&#x27;re right to question its sources.<p>AFAICT it draws from the same source pool as the more scholarly papers and articles on Sugar and Lead in the Roman Empire.<p>I cited that little ditty as it headed the USofA EPA May 1985 by Jack Lewis that I cited from above ( <a href="https:&#x2F;&#x2F;www.epa.gov&#x2F;archive&#x2F;epa&#x2F;aboutepa&#x2F;lead-poisoning-historical-perspective.html" rel="nofollow">https:&#x2F;&#x2F;www.epa.gov&#x2F;archive&#x2F;epa&#x2F;aboutepa&#x2F;lead-poisoning-hist...</a> ) that article in response to the &quot;Did lead kill The Roman Empire&quot; debate roaring back into life in 1983 after an article in the <i>New England Journal of Medicine</i> speculated that it did.<p>So, to defer to a clearer quote from Roman times about what was and was not known:<p><pre><code>  &quot;Water conducted through earthen pipes is more wholesome than that through lead; indeed that conveyed in lead must be injurious, because from it white lead [PbCO3, lead carbonate] is obtained, and this is said to be injurious to the human system.

      Hence, if what is generated from it is pernicious, there can be no doubt that itself cannot be a wholesome body. This may be verified by observing the workers in lead, who are of a pallid colour; for in casting lead, the fumes from it fixing on the different members, and daily burning them, destroy the vigour of the blood; water should therefore on no account be conducted in leaden pipes if we are desirous that it should be wholesome. That the flavour of that conveyed in earthen pipes is better, is shewn at our daily meals, for all those whose tables are furnished with silver vessels, nevertheless use those made of earth, from the purity of the flavour being preserved in them&quot;
    </code></pre>
    ~ Vitruvius <i>De Architectura</i> (VIII.6.10-11) ( <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Vitruvius" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Vitruvius</a> )<p>We can be confidant that an Architect &#x2F; Engineer born ~ 70 BC understood lead to be health hazard without appeal to any gods or witches.
