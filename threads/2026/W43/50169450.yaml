    The &quot;ancients&quot; (Roman era writers and workers, post Roman UK Peak District lead workers, the Chinese, etc) understood the hazards of acute lead poisoning first hand and often referenced mad hatters, crazy painters, and the symptoms of extreme exposure in literature.<p>What they seemingly failed to grasp until more recent times was the slow creep of incremental mild exposure:<p><pre><code>  However, they were so fond of its diverse uses that they minimized the hazards it posed. Romans of yesteryear, like Americans of today, equated limited exposure to lead with limited risk. What they did not realize was that their everyday low-level exposure to the metal rendered them vulnerable to chronic lead poisoning, even while it spared them the full horrors of acute lead poisoning.
    </code></pre>
    ~ <i>Lead Poisoning: A Historical Perspective</i> (1985) <a href="https:&#x2F;&#x2F;www.epa.gov&#x2F;archive&#x2F;epa&#x2F;aboutepa&#x2F;lead-poisoning-historical-perspective.html" rel="nofollow">https:&#x2F;&#x2F;www.epa.gov&#x2F;archive&#x2F;epa&#x2F;aboutepa&#x2F;lead-poisoning-hist...</a>
