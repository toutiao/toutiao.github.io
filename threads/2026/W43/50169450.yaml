  text: |-
    &gt; Apparently they had no idea it was bad in medieval times.<p>Tell me more, how do we know this to be true?<p>&gt; The wealthy were particularly afflicted, as lead was used in glazes<p>Sure .. but you&#x27;re saying that &quot;the wealthy&quot; purchased poorly fired earthenware and had high acid diets?<p><pre><code>  Traditional pottery and other forms of ceramicware are made with earthenware, a porous form of clay which must be glazed in order for the pottery to hold food or liquid. Glazing applies and fuses a thin, glass-like coating onto the surface of the clay to seal its pores. The glaze – which may contain lead to facilitate the melting of glaze particles – fuses to the pottery when it is fired in a kiln, a special oven used to bake clay. When the pottery is fired at the proper temperature for the proper amount of time, essentially all the lead is bound into the glaze.
    </code></pre>
    ~ <a href="https:&#x2F;&#x2F;www.fda.gov&#x2F;food&#x2F;environmental-contaminants-food&#x2F;questions-and-answers-lead-glazed-traditional-pottery" rel="nofollow">https:&#x2F;&#x2F;www.fda.gov&#x2F;food&#x2F;environmental-contaminants-food&#x2F;que...</a><p>To the best of my knowledge it takes continuous leaching by &gt; ~  4% acetic acid (from acidic food and drink) of poorly fired lead glaze earthenware for lead glaze to become &quot;potentially hazardous&quot;<p>&gt; The common folk weren&#x27;t spared though, as they were caught up in production.<p>I would have though production would be where the worst <i>actual</i> exposure occurred, breathing in fumes from liquid mercury.<p>That would be the more extreme acute exposure, that was known about as problematic in medieval times (at least to those people who read and copied earlier manuscripts regarding minerals, processing, health, etc).
