  author: ACCount39
  text: AI price-performance is improving rapidly. AI usage, whether in tokens used,
    in cash spent, or any of the above performance-adjusted, is curving upwards too.<p>Causality
    is uncertain, but the &quot;Jevons paradox&quot; interpretation is certainly not
    contradicted by the available data. Anecdotes of per-employee AI spend rising,
    and multi-agent freerunning AI tasks becoming more common are also plentiful.<p>Personally,
    I think that the &quot;Jevons paradox&quot; interpretation is basically correct.
    Humanity doesn&#x27;t have a limited demand on intelligence - but humans are expensive,
    so it&#x27;s supply-constrained. The cheaper intelligence gets, the more of it
    ends up used. As AI gets cheaper and more capable of substituting for human intelligence,
    usage will rise.
