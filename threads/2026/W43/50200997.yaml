  author: CoolestBeans
  text: Unknown. AI usage went up exponentially this year but a lot of that was driven
    by access to frontier and near-frontier models and a shift to agents. Does that
    constitute a decrease in prices because $ per unit of intelligence (whatever that
    could mean) has gone down? Maybe.<p>One issue is that token usage and revenue
    seem to be decoupling in real time. For Jevons paradox to be true, prices need
    to be going down but total spend on AI has to be going up. That&#x27;s technically
    true right now but total usage is going way up while total spend is going up slightly.
    Another problem is that we may be witnessing the end of &quot;tokenmaxxing&quot;
    with Anthropic&#x27;s revenue growth decelerating and OpenRouter&#x27;s token
    volume plateauing. Two points of data do not make evidence but the possibility
    that AI usage is an S curve rather than exponential is live.
