  text: This is correct, mice don’t naturally experience alzheimer’s or other dementias
    during their lifespans and the structure of their amyloid beta protein is different
    as well. To continue using them as model organisms, we have to induce the disease
    in them by either introducing human genes that are linked with alzheimer’s, or
    chemically inducing a disease state that we believe to be similar. Mice are much
    better models organisms for studying metabolism or cancer, by comparison.
