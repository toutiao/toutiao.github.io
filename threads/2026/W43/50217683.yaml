  author: jcranmer
  text: 'The &quot;... in mice&quot; qualifier is somewhat overdone, but for Alzheimer&#x27;s
    in particular, it&#x27;s actually extremely important: <i>mice do not experience
    Alzheimer&#x27;s</i>. We test Alzheimer&#x27;s drugs in mice by artificially inducing
    something that produces similar dementia symptoms, and then seeing how the drugs
    influence that progression. If that model is different from how Alzheimer&#x27;s
    works--and there&#x27;s pretty decent suggestions from the history of failed Alzheimer&#x27;s
    drugs in humans that our models of Alzheimer&#x27;s are in fact wrong--then anything
    that fixes that model has suspect utility.'
