  author: epihelix
  text: Plaques probably&#x2F;likely affect local neurotransmission in close proximity
    of a plaque.  But plaque load does not correlate well with dementia severity,
    and removing plaques entirely (which we can now do very well) does not prevent
    further cognitive decline (and appears to have very little effect at all).<p>Plaques,
    however, do lead to an aggravated response by the immune-equivalent cells in the
    brain (microglia).  There has been a lot of interest in how much this microglia
    response to plaques triggers some of the symptoms of AD, and this what the research
    summarised in TFA is interested in also.  Despite what TFA implies (it&#x27;s
    an overcooked Uni press release) there&#x27;s been heaps of interest in microglia
    over the last few years in the AD space.<p>Ultimately, we still don&#x27;t know
    what causes the majority of AD symptoms, and this is a very controversial space.  Historically,
    a number of AD researchers (including one very prominent researcher) staked their
    reputation on plaques being fully or mostly causative, and refuse to let go of
    this idea despite the growing body of contrary evidence -- which has created a
    bit of cognitive hysteresis in the field (and led to vast amounts of arguably
    wasted pharma R&amp;D).  It was a good idea at the time as it was the obvious,
    most parsimonious explanation; but biological reality has a habit of not conforming
    with Occam&#x27;s razor, sadly.<p>(As for terminal lucidity -- this is not my
    field; IIUC it&#x27;s also debated, but your idea is not entirely at odds with
    one theory.  There are many theories, and it&#x27;s not entirely accepted that
    this even reliably occurs at all.)
