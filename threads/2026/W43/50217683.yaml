article:
  url: https://www.sciencedaily.com/releases/2026/10/261018084421.htm
  title: '"Mind-blowing" Alzheimer’s breakthrough: Two hours of sleep restored without
    clearing brain plaques | ScienceDaily'
  fetch_status: success
  content: "Science News\n\nfrom research organizations\n\n* * *\n\n# \"Mind-blowing\"
    Alzheimer’s breakthrough: Two hours of sleep restored without clearing brain plaques\n\nFULL
    STORY\n\n* * *\n\n![Scientists Restore Sleep in Alzheimer's Mice](/images/1920/sleep-man-brain-spine-nervous-system.webp)\n_Scientists
    discovered that overactive brain immune cells drive sleep loss in Alzheimer’s,
    and removing them restored more than two hours of sleep per day in mice. Credit:
    Shutterstock_\n  \n\nScientists have discovered an unexpected reason why Alzheimer's
    disease disrupts sleep, and their findings suggest that the problem may be reversible.
    In experiments involving mice with Alzheimer's-like brain changes, researchers
    restored more than two hours of sleep per day without removing the amyloid plaques
    associated with the disease.\n\nThe surprising discovery points to an overlooked
    culprit: the brain's own immune cells. Rather than simply protecting the brain
    from damage, these cells can trigger inflammation that interferes with healthy
    sleep.\n\nResearchers at the University of Kentucky found that temporarily eliminating
    most of these immune cells allowed the mice to sleep longer and spend more time
    in the deep, restorative stages of sleep. The results suggest a potential new
    approach to treating one of the most disruptive symptoms of Alzheimer's disease.\n\nThe
    findings, published in the journal _Alzheimer's & Dementia_, were reported by
    a team led by Shannon L. Macauley, Ph.D., an associate professor of physiology
    at the University of Kentucky College of Medicine, and first author Nicholas J.
    Constantino, Ph.D., a recent doctoral graduate.\n\nMacauley described the discovery
    as \"paradigm-shifting\" because it challenges the prevailing understanding of
    why people with Alzheimer's often experience severe sleep problems.\n\n**How the
    Brain's Immune System Can Disrupt Sleep**\n\nTo understand what the researchers
    uncovered, imagine a small fire breaking out in a kitchen. Instead of containing
    the flames, the building's sprinkler system activates everywhere, flooding the
    entire house and causing widespread damage.\n\nSomething similar may happen in
    the brain during Alzheimer's disease.\n\nAmyloid plaques are deposits of sticky
    protein fragments that accumulate between nerve cells. They are one of the characteristic
    features of Alzheimer's and have long been investigated for their role in the
    disease.\n\nThe brain also contains specialized immune cells known as microglia.
    These cells normally protect the nervous system by removing debris, responding
    to injuries, and helping maintain a healthy environment for neurons.\n\nHowever,
    when microglia detect amyloid plaques, their defensive response can become excessive.
    Instead of simply addressing the threat, they release inflammatory signals that
    may interfere with normal brain activity.\n\nScientists have traditionally linked
    sleep problems in Alzheimer's primarily to damaged neurons or the accumulation
    of amyloid plaques. The new findings suggest that the immune system's reaction
    to those plaques plays a major role.\n\n\"Basically, we showed that it is not
    the plaques themselves, or solely dysfunctional neurons, that cause sleep loss
    but actually microglia,\" said Macauley. \"Microglia are immune cells that, when
    they respond to plaques, kick off this elaborate cascade of inflammation, as if
    the microglia are partying all night, and keeping the brain awake.\"\n\nIn other
    words, the brain's response to Alzheimer's pathology may create additional problems
    beyond those caused by the plaques themselves. The researchers compared this widespread
    reaction to a \"whole house response,\" in which a defense mechanism ends up causing
    more disruption than expected.\n\n**Tracking Alzheimer's Sleep Changes Inside
    the Brain**\n\nTo investigate the connection between microglia and sleep, the
    scientists studied two groups of mice. One group was genetically predisposed to
    develop amyloid plaques, while the other consisted of normal \"wild-type\" mice
    that experienced typical aging.\n\nThe researchers examined the animals at two
    ages: six months, when plaques first appeared in the genetically modified mice,
    and 18 months, when the disease model showed more advanced pathology.\n\nComparing
    these groups helped the scientists distinguish changes associated with Alzheimer's
    pathology from those that naturally occur as the brain ages.\n\nThe team used
    several advanced technologies to measure sleep and examine what was happening
    inside the brain.\n\nEach mouse was fitted with a small device that recorded electroencephalography
    (EEG) and electromyography (EMG).\n\nEEG measures the brain's electrical activity,
    including the patterns and rhythms produced when networks of neurons communicate.
    These electrical signals change depending on whether the brain is awake, dreaming
    or experiencing deep sleep.\n\nEMG measures electrical activity in muscles. Combining
    the two techniques allowed researchers to identify different sleep stages and
    determine how long the animals remained in each one.\n\nThe scientists also wanted
    to visualize the relationship between amyloid plaques and immune cells throughout
    the brain.\n\nFor this, they used light-sheet microscopy, an imaging technique
    that makes biological tissue transparent and illuminates it with a thin layer
    of laser light. The resulting images can be assembled into detailed three-dimensional
    maps, allowing scientists to examine structures that would otherwise be difficult
    to see.\n\nThis approach revealed the distribution of plaques and microglia across
    the brain, helping researchers understand where immune cells were responding to
    Alzheimer's pathology.\n\n**Scientists Temporarily Remove 87% of Brain Immune
    Cells**\n\nTo determine whether microglia were actually responsible for disrupted
    sleep, the team conducted an experiment designed to temporarily eliminate most
    of these cells.\n\nThe researchers administered a drug called Pexidartinib (PLX3397),
    which was originally developed for cancer research. It blocks a cellular signal
    that microglia depend on for survival.\n\nAfter the mice received the medication
    in their food for 14 days, approximately 87% of their microglia had been depleted.\n\nThis
    allowed the scientists to test whether sleep would improve when the cells driving
    the inflammatory response were largely absent.\n\nThe researchers also performed
    a detailed analysis of the animals' brain activity using a mathematical method
    called Fitting Oscillations and One Over Frequency (FOOOF).\n\nThis technique
    separates electrical signals into periodic activity (the rhythmic waves we usually
    think of as brain waves) and aperiodic activity (the background electrical noise).\n\nBy
    examining these different components, the team could identify changes in how the
    brain was functioning, including whether it remained unusually active during periods
    when it should have been resting.\n\nThe process is somewhat like monitoring a
    car engine to determine whether it continues running at high speed even when the
    vehicle is supposed to be idle.\n\n**A Surprising Discovery About Alzheimer's
    Brain Plaques**\n\nMacauley called the results \"mind-blowing and unexpected.\"\n\nOne
    of the most surprising findings was that sleep problems did not continue worsening
    as amyloid plaques accumulated.\n\nThe researchers initially expected that increasing
    plaque buildup would lead to progressively more severe sleep disturbances. Instead,
    the mice developed substantial sleep problems relatively early, and those problems
    remained largely unchanged even as plaque levels increased dramatically.\n\n\"I
    expected that as plaque burden became more severe, sleep disruption would also
    worsen,\" said Constantino. \"The disruptions in sleep and cortical EEG activity
    that occur at 6 months, when plaques first emerge, did not worsen by 18 months,
    despite more than double the amount of plaque burden.\"\n\nThe team described
    this pattern as a ceiling effect. Essentially, sleep disruption appeared to reach
    a certain level early in the disease process rather tha"
