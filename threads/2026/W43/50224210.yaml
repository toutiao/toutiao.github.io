  author: chilmers
  text: "&gt; If that&#x27;s true, how do you explain the observable pattern of many
    consumer applications degrading in UI functionality and coherence after a certain
    point?<p>Most consumer software in developed under the assumption that features
    only have a cost when being built. Their maintenance cost, and the combinatorial
    complexity each new feature adds, is barely considered. As a result, software
    teams add complexity at a speed that exceeds the rate at which the team&#x27;s
    size, and the volume of work it can handle, grows. Eventually this reaches a critical
    threshold and the quality of the software starts to decline. But this doesn&#x27;t
    mean the software couldn&#x27;t still be improved, just that there isn&#x27;t
    the resource available to do so."
