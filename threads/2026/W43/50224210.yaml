    # SpeedCrunch

    A free, open-source high-precision scientific calculator.

    Built for STEM professionals, students and teachers.

    [&nbsp;Download](download.html)[&nbsp;User Manual](introduction.html)[&nbsp;Donate](donate.html)

    Free to download and use on Windows, macOS, and Linux.

    - Up to 50 digits of precision, with [complex number support](userguide/syntax.html#complex-numbers)
    - [140+ functions, and a myriad of units and constants](reference/index.html)
    - [User-defined variables, functions, and units](userguide/advanced.html)
    - [Vector and matrix support](reference/basic.html#lists-and-matrices)
    - History rewriting, and per-result settings
    - [Keypad presets and a fully customizable layout](userguide/interface.html#keypad)
    - [Multiple active sessions with tabs, panes, or windows](userguide/interface.html#session-tabs-and-panes)
    - More than 40 translations, and over 40 color schemes
