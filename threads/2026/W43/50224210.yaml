  author: Gormo
  text: "&gt; Most consumer software in developed under the assumption that features
    only have a cost when being built. Their maintenance cost, and the combinatorial
    complexity each new feature adds, is barely considered.<p>I suppose that&#x27;s
    true, but I don&#x27;t see what it has to do with UI design from a usability standpoint.<p>&gt;
    But this doesn&#x27;t mean the software couldn&#x27;t still be improved, just
    that there isn&#x27;t the resource available to do so.<p>It&#x27;s a push and
    pull from both sides, isn&#x27;t it?  The accretion of process complexity among
    the developers may increase over time, but so too does the completion of core
    features and solution of all of the low-hanging-fruit development tasks.<p>Pretty
    much every GUI application I&#x27;ve ever used seems to hit a point where the
    original purpose for which the software was devised is satisfied for essentially
    all common use cases, but the incentives of the dev team are to <i>keep going</i>,
    so they move more and more toward gimmicky features, unnecessary bells and whistles,
    visual changes to the UI, etc. because any real functional improvement is a big
    investment, but they still need to justify a new release.<p>UI churn is one of
    the most common failure modalities here: when you&#x27;ve already picked all of
    the low hanging fruit in functionality and performance, major UI changes can create
    the appearance of improvement and innovation without actually having to do any
    of the hard work to achieve real improvement.<p>So when I see unnecessary UI changes
    to an application that still basically does the same things in the same way, at
    this point I&#x27;m conditioned to assume that that application has hit the point
    of diminishing returns for actual functionality, and the development incentives
    are now going to be driving more and more churn.  And that&#x27;s when I consider
    the software &quot;finished&quot;."
  score: 0
  posted_at: '2026-10-25T16:30:53Z'
- id: '50233424'
  parent_id: '50229127'
  author: Gormo
  text: 'I don&#x27;t think we&#x27;re disagreeing.<p>The point at which new changes
    are more likely to degrade an application that&#x27;s already excellent for its
    established use cases than they are to improve it further is the point at which
    we should consider the software &quot;finished&quot;.<p>There may be lots of theoretically
    plausible improvements that could be made, but if the constraints of actual practice
    make pursuing those ideas a net detriment, that&#x27;s probably a good place to
    stop.<p>I think AI may actually make this simultaneously better and worse: it
    will eventually be really easy to hit all of the functional and performance targets
    early on, so &quot;finished&quot; software will at some point be much better and
    closer to <i>true</i> completion, but the mentality that drives people to keep
    fiddling with it instead of moving on to a new project will be just as prevalent,
    and the post-&quot;finished&quot; releases will likely be even worse.'
  score: 0
