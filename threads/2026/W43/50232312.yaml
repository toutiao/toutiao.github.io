    operate on a franchise model, and corporate employees are very limited. For example
    the 414K employees listed for Marriott aren&#x27;t directly employed by them.
    But then you don&#x27;t apply the same logic to McDonalds, where you are only
    counting the corporate employees.<p>- Holding companies (like Berkshire Hathaway)
    show the full employee count of their portfolio companies even through they may
    only own a small share. And again the logic isn&#x27;t consistent because you
    are only counting 714 employees for Welltower, which is also a holding company.<p>Collecting
    incomplete or incorrect data and adding a hunded disclaimers at the end of the
