  author: joshheitzman
  text: 'I use that specific model as my primary LLM for coding and diagnostics on
    projects in Python, C++, CUDA, and for web research.<p>I&#x27;m also using it
    with my own harness (you mentioned &quot;in my harness&quot;), so I&#x27;ll share
    two things I found about using open weight model providers.  The first is that
    getting the configuration right isn&#x27;t a per model thing, its a per model
    per provider per point in time thing.  The point in time thing comes from middleware
    updates as those introduce or fix defects that can very seriously impact inference
    quality.  The second thing is inference quality varies a lot between providers,
    even when they are ostensibly using the same quant of the same model.<p>If you
    want to try it something else for comparison I open sourced my harness a couple
    of weeks ago: <a href="https:&#x2F;&#x2F;fluximp.org" rel="nofollow">https:&#x2F;&#x2F;fluximp.org</a><p>I
    recommend trying deepseek v4.1 flash from together.ai (not the 1017 one the one
