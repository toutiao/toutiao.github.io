  author: anon7000
  text: 'This line stands out to me:<p>&gt; One waits for an expensive ad, then asks
    for a hand you can’t place<p>Something about “asks for a hand you can’t place”
    just triggers the alarm bell. I think it’s unfortunately because I’m reading a
    lot of AI at $job. I do read books in my free time but something about the patterns…<p>Some
    more quotes from early on:<p>“Most of Block Blast isn’t in the app you install”<p>And
    then<p>“It waits for three things to line up: you finished your last three rewarded
    ads, the ad loaded right now is worth at least 3.5 times your last one, and you’re
    1,000 points past your high score. All three get checked in one function.”<p>A
    really big AI tell for me is sensationalism and drama about things that don’t
    matter. Ok, fair, checking code in one function doesn’t seem dramatic. But consider
    this: a paragraph is building to a conclusion. You have a fairly long sentence,
    then a short sentence. The contrast in length gives the short sentence a lot of
    emphasis when I read it. In a newscaster voice: “all three get checked.. in one
    function”<p>But obviously it doesn’t matter at all, even to the technical reader,
    if they check this in one function or multiple functions. AI does this ALL the
    time, they emphasize some implementation detail that’s true, but completely irrelevant
    to the point the author wants to make. In fact this detail really should be removed
    from the article completely because it adds LITERALLY nothing to our understanding
    of how this app works.<p>So my alarm bells go off because a technical writer probably
    wouldn’t emphasize that point.<p>I’m not actively analyzing that, but when I read
    AI, I notice emphasis on things that are entirely irrelevant. The text starts
    feeling self-important about complete nonsense.<p>I think it all adds up for me,
    and I just notice the patterns in a surprising number of blogs and YT videos.
    It gets distracting, but IMO the bigger issue is that the wrong details are put
    in focus, so explanations get hard to follow.'
