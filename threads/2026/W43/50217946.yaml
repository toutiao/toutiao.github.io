  author: peter_d_sherman
  text: "&gt;&quot;The <i>lethal puzzle</i> is a generator, and any rule can ask for
    it. The ad rule is one caller. While we were testing it live on iPhone, a second
    caller fired on camera: PersonalMarginBreakTrait. Once you’re 10% past your high
    score, it rolls on every deal, and 20% of the time it asks for the same <i>lethal
    puzzle</i>:<p>Our record was 1,304, so its line was 1,434. At 3,356 points it
    rolled, and the game dealt a five-long bar, a five-tall bar and a zigzag. The
    game’s own record of that deal names this rule as the caller, shows algorithm
    9 both requested and used, and labels all three pieces <i>致死题, lethal puzzle</i>.&quot;<p>I
    love it!<p>From a linguistic &quot;this one takes the cake in terms of strange
    terminology&quot; strange terminology, this one takes the cake!<p>I could see
