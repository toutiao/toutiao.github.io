  content: "I posted a video about this game that got over 15 million views, so I
    wanted to do the full technical write-up: the code, and how you can reproduce
    it yourself.\n\nSome context on why it matters: between January and May 2026,
    Block Blast made an estimated $127 million from ads. Candy Crush Saga made $81.1
    million over the same months (Sensor Tower estimates).\n\n## Most of Block Blast
    isn’t in the app you install\n\nWe started with the Android app, version 10.8.2.
    We decompiled the Java side with jadx and the native Cocos library with Ghidra,
    and found almost nothing interesting in the package you download from the store.
    Block Blast is built from small modules the code calls traits, and each trait
    has variants called arms. Running it on a clean Android 14 emulator with no account
    and watching its cache and logcat showed how it works: when the app launches,
    the server sends a config that says which arm of which trait you get, and the
    app downloads them as encrypted JavaScript. The config my install got names about
    700 traits. My install selected 254 of them, and 101 were downloaded after install.\n\nAdLevelTraitAdPlusMinusStrategyTraitAddClearTipsExTraitAddMoreGameTraitAdjustPercentChTraitAlgoFillSortEdgeTraitAlgoSDK\\_modifyBlockPosTraitAlgoSDK\\_\\_tips\\_lv\\_\\_player\\_direct\\_guide\\_to\\_\\_board\\_init\\_\n\n_All
    254 traits assigned to my Android test install. The ones about losing, revives
    and ads are highlighted._\n\nSo two people playing side by side can be running
    different games, and the studio can change yours without an app update. Most of
    those 254 are ordinary: tutorials, animations, sounds. A handful are about when
    you lose. One of them is about ads.\n\n## The rule that waits for an expensive
    ad\n\nIt’s called `RewardHighValueAdHarvestTrait`. By finding where the game unlocks
    these files in its own native library, we decoded it into 15,616 bytes of plain,
    minified JavaScript. Its constructor sets the parameters:\n\n_RewardHighValueAdHarvestTrait.js
    · lines 63–67_\n\n    t.HIGH_PRICE_MULTIPLIER = 3.5;\n    t.MEDIUM_PRICE_MULTIPLIER
    = 1.5;\n    t.MIN_HISTORY_AD_WATCH_COUNT = 3;\n    t.RECENT_AD_NO_ESCAPE_COUNT
    = 3;\n    t.TARGET_AD_LEVEL = \"high\";\n\nIt waits for three things to line up:
    you finished your last three rewarded ads, the ad loaded right now is worth at
    least 3.5 times your last one, and you’re 1,000 points past your high score. All
    three get checked in one function. Here it is with the minified null checks rewritten
    as optional chaining; the logic is the same:\n\n_shouldTriggerDeath · lines 262–267
    (reformatted)_\n\n    shouldTriggerDeath() {\n      if (!this.canTrigger()) return
    false; // finished your last 3 rewarded "
