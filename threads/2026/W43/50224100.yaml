  author: nextaccountic
  text: "&gt; The &quot;faster than&quot; is on average, and both in my own benchmarks
    and independent benchmarks you can find examples of algorithms where it is slower,
    but they tend to be the exception. &quot;substantially&quot; slower I haven&#x27;t
    found yet.<p>Well message passing with literal memcpys (rather than, say, just
    a shared buffer, like is common in Rust) is very expensive when the messages are
    huge. Of course as the message size increases, the Rust program will become faster
    than the Goose one (and if it doesn&#x27;t, you should look into your benchmarks)<p>Being
    more specific, it means that for each message, we are writing on memory twice
    - one to build our own buffer with the message, and another to make a copy to
    another worker. Message passing violates, in spirit, the Goose rule that things
    are built on their end destination: we can&#x27;t write into a buffer owned by
    another task, so we need to first write on our own buffer, and then do a copy,
    which is a lot like first writing the value to the stack, then copying the heap.
    Writing twice has an overhead, specially when messages don&#x27;t fit in the cache
    - you just need benchmarks with sufficiently large messages to demonstrate it.<p>Beyond
    that, there are some algorithms that can be made much faster when written with
    atomics rather than message passing. (Also there are algorithms that will get
    faster if you use locks! Locks aren&#x27;t always slower). It&#x27;s just a matter
    of finding such examples, and writing a Rust code that will use atomics, compared
    to a Goose program that uses messages between workers because Goose doesn&#x27;t
    expose atomics to the user.<p>So if you didn&#x27;t find such examples, it&#x27;s
    because you didn&#x27;t specifically write benchmarks with those scenarios in
    mind (or, I mean, didn&#x27;t told your LLM to write this).<p>That is: if the
    Rust program and the Goose program do the same thing in the same way, then it&#x27;s
    reasonable that Goose is faster on average. But Goose is limited because it doesn&#x27;t
    let you do some things, but Rust does, so to compare the languages you need to
    find those cases where the Goose limitations end up making the software slower"
