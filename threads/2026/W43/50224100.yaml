  author: Aardappel
  text: The compiler automatically optimally allocates all arrays currently in scope
    that are able to grow to &quot;stacks&quot; (address spaced reserved areas).<p>The
    programmer choose what to store where, so you typically store things in arrays
    by lifetime. Goose gives you many more tools to do that, it can store entire variable
    sized trees of an enum type in a single array.<p>You try to avoid having to deallocate
    in mixed&#x2F;random order, but if you absolutely must, you can turn arrays into
    pools, basically.
