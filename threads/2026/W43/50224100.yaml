  author: Aardappel
  text: It means that to do variable sized things like vectors and strings, C++ often
    ends up having to allocate their contents dynamically. Which results in data structures
    with lots of 64-bit pointers over multiple allocations.<p>Even Rust&#x27;s &quot;enum&quot;
    feature, which can store different sized things all in the same space, does that
    at the cost of the smallest variant being just as big as the biggest.<p>Goose
    can do all of that not only inline (no pointers), but with variable size, meaning
    small items take less space. It&#x27;s like a serialized data representation,
    but iterable. It makes for big space savings vs these languages.
