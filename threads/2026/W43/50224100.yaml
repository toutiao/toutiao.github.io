  author: Aardappel
  text: Only top level growable arrays get their own &quot;stack&quot;, if you create
    an array of arrays it only uses one stack.<p>How you deal with the inner stack
    growing depends, ideally they don&#x27;t grow (construction only), or you can
    make them fixed size, or with a capacity, or in the worst case, as a pool. The
    language has facilities for all of these.
  score: 0
  posted_at: '2026-10-24T21:03:53Z'
- id: '50225292'
  parent_id: '50225038'
  author: vanderZwan
  text: I think what you might be missing is that you can also do a sort of livenes
    analysis to determine how many dynamically-sized variables are &quot;awake&quot;
    at the same time at most. Then you only need to create as many stacks as that
    number, because you can reuse the stacks of &quot;sleeping&quot; variables (since
    the &quot;awake&quot; variables are guaranteed to be freed once their block goes
    out of scope, and threads don&#x27;t share any memory so no data race worries
    regarding those stacks).<p>For example, suppose we have a function with a growable
    array that calls another function (without passing said array) that also uses
    a growable array as some temporary scratch space. Then the first function&#x27;s
    array isn&#x27;t being used when the second is sleeping, so the inner function&#x27;s
    array could safely share the stack because it will all be freed with a single
    pointer restore once the second function exits.<p>Now, I actually don&#x27;t know
    how the compiler works but as I understand it does things similar to my example
    to optimize the number of stacks needed (but let&#x27;s wait for WvO to confirm
    or deny whether my understanding matches reality).
  score: 0
