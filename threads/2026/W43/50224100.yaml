  author: Aardappel
  text: The copy is made by the runtime, which obviously does use atomics underneath,
    but you don&#x27;t ever use these yourself.<p>The workers are threads. The separate
    memory is the concurrency model, but it&#x27;s still single process, multiple
    threads.<p>The &quot;faster than&quot; is on average, and both in my own benchmarks
    and independent benchmarks you can find examples of algorithms where it is slower,
