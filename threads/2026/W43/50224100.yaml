  author: malisper
  text: 'I&#x27;m not familiar with Goose, but based on some research and my understanding
    of how memory works:<p>At compile time, Goose will analyze your program and determine
    a number of stacks, N, for it. N is the maximum number of &quot;growable&quot;
    items you can have in existence at any given point in time. Using virtual memory
    tricks, each stack can grow up to 2GB, but it uses a contiguous address space
    and only uses as much physical memory as it actually needs.<p>For the program
    you&#x27;re describing, I think you would end up with two stacks: one to parse
    the input and a second to print it. When you parse the input, Goose reads characters
    from the string one at a time and puts them onto the stack. Once it has hit the
    end of value, it will update the stack so it now represents the decoded JSON value
    (strings will just leave the characters in place, numbers will pop off the characters
    and push the number onto the stack). Goose repeats this until it has parsed the
    whole JSON, and now the whole JSON is on the stack.<p>Then, when you print the
    JSON, Goose uses the second stack to build a string. Like the parsing approach,
    it iterates through each element of the JSON and pushes its string representation
    onto the stack. Once it&#x27;s done, it resets the stack pointers to free the
    memory.<p>This is really nice because allocating memory is just adding to the
    pointer, and freeing it is subtracting from the pointer.<p>In contrast, Rust automatically
    inserts malloc() and free() calls throughout your code, which are much more expensive
    than pointer arithmetic. On top of that, freeing a vector of heap-allocated objects
    is O(n), whereas if done right in Goose, it would be O(1)'
  score: 0
