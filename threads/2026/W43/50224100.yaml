  author: Aardappel
  text: 'In this particular combination, most certainly.<p>There is lots of prior
    art on the individual parts of the design, e.g. &quot;regions&quot; and various
    stack languages etc, see: <a href="https:&#x2F;&#x2F;github.com&#x2F;aardappel&#x2F;goose&#x2F;blob&#x2F;master&#x2F;docs&#x2F;design&#x2F;prior_art.md"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;aardappel&#x2F;goose&#x2F;blob&#x2F;master&#x2F;docs&#x2F;design&#x2F;p...</a><p>Part
    of this is that 64-bit address spaces make this design practical, and almost all
    languages in use today were designed with the limitations of 32-bit in mind. Once
    you can assign arrays huge amounts of address space, you don&#x27;t have to realloc,
    which gets you stable pointers, and a lot of the other Goose features.'
