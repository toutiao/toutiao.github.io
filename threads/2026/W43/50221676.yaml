  author: Hamuko
  text: 'Again, do you work for Google? Because that&#x27;s the only reason I can
    think of why you&#x27;re so boldly saying these things that are just not true.
    Especially the part where you constantly try to pin this on a contractor.<p>This
    is not about a permit. It&#x27;s about doing an environmental impact assessment.
    Google&#x27;s Finnish subsidiary started logging the forest in March. Then right
    at the end of April, Tuike Finland (Google) asked the national regulators if they
    could get a case-by-case decision on the need for the environmental impact assessment,
    wanting to not have to do it for their permits. Then they got an answer on May
    22nd, clearly saying that the environmental impact assessment is required. And
    Google continued logging until August.<p>This is Google themselves not following
    the law, asking for exemptions, not getting one, and then continuing to not follow
    the law.<p>But please, feel free to post your source if you have contradicting
    evidence. Here&#x27;s mine: <a href="https:&#x2F;&#x2F;www.hs.fi&#x2F;politiikka&#x2F;art-2000012304991.html"
