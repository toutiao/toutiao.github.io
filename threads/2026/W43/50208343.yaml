    | |\n\n#### **[README.md](#readme)**\n\n[![shitter logo](/shitter/shitter/media/branch/master/public/android-chrome-192x192.png)](/shitter/shitter/media/branch/master/public/android-chrome-192x192.png)\n\n#
    Shitter - a Nitter fork\n\nA free and open source alternative Twitter front-end
    focused on privacy and performance.   \nInspired by the [Invidious](https://github.com/iv-org/invidious)
    project.\n\n- No JavaScript or ads\n- All requests go through the backend, client
    never talks to Twitter\n- Prevents Twitter from tracking your IP or JavaScript
    fingerprint\n- Uses Twitter's unofficial API (no developer account required)\n-
    Lightweight (thanks to [@nim\\_lang](https://shitter.thepixora.com/nim_lang),
    60KB vs 784KB from twitter.com)\n- RSS feeds\n- Themes\n- Mobile support (responsive
    design)\n\n## Resources\n\nThe wiki contains:\n\n- [**List of public instances**](https://codeberg.org/shitter/shitter/wiki/Instances)\n-
    [Forks of the Nitter code repository](https://codeberg.org/shitter/shitter/wiki/Forks-of-the-Nitter-code-repository)\n-
    [Browser extensions](https://codeberg.org/shitter/shitter/wiki/Extensions) for
    auto-redirecting to Nitter\n- Guide: [Self-hosting a Nitter instance](https://codeberg.org/shitter/shitter/wiki/Self-hosting+a+Nitter+instance.-)\n-
