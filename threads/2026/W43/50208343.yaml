    Guide: [Using Nitter embeds](https://codeberg.org/shitter/shitter/wiki/Embeds-guide)\n\n##
    Contributing\n\nThis repository does not accept Pull Requests, but contributions
    are welcome in the form of **Patch files** , which can be submitted on an issue
    and are much more convenient to merge and work with.\n\n## Why?\n\nIt's impossible
    to use Twitter without JavaScript enabled, and as of 2024 you need to sign up.
    For privacy-minded folks, preventing JavaScript analytics and IP-based tracking
    is important, but apart from using a VPN and uBlock/uMatrix, it's impossible.
    Despite being behind a VPN and using heavy-duty adblockers, you can get accurately
    tracked with your [browser's fingerprint](https://restoreprivacy.com/browser-fingerprinting/),
    [no JavaScript required](https://noscriptfingerprint.com/). This all became particularly
    important after Twitter [removed the ability](https://www.eff.org/deeplinks/2020/04/twitter-removes-privacy-option-and-shows-why-we-need-strong-privacy-laws)
    for users to control whether their data gets sent to advertisers.\n\nUsing an
    instance of Nitter (hosted on a VPS for example), you can browse Twitter without
    JavaScript while retaining your privacy. In addition to respecting your privacy,
    Nitter is on average around 15 times lighter than Twitter, and in most cases serves
    pages faster (eg. timelines load 2-4x faster).\n\n## Screenshot\n ![nitter screenshot
    - Framasoft](/shitter/shitter/media/branch/master/screenshot.png)\n## Install\n\n###
