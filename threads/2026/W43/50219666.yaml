  author: gyrovagueGeist
  text: 'You can imagine the general idea by imagining the state space of a bunch
    of billiard balls: their position and velocity in a 6D space.<p>This is a metaphor
    and not the state or experiment that superdeterminism seeks to answer. I am also
    speaking well outside the areas of physics I was trained in. So huge grain of
    salt.<p>In classical determinism, the trajectories of all billard balls can be
    derived precisely from their initial conditions. Due to sensitivity to initial
    conditions and our ability to know them precisely, we can see chaotic mixing behavior
    where the trajectory of even two billiard balls that start at nearly the same
    place become more and more uncorrelated as time goes on as they bounce around
    and into each other. One expects that many accessible observables and functions
    loose detectable correlations as this billiard ball universe goes on and the billiard
    balls go on to roughly fill the full 6D state space up to conservation of momentum.<p>Now
    imagine the weirder scenario, that there exists some function and statistical
    comparison you can make between state variables from sets of billiard balls. Although
    these state variables themselves seem uncorrelated after enough time has passed,
    there are these properties that always hold with perfect correlation even after
    infinite chaotic time bouncing around. The points in state space that the balls
    cover is restricted to some manifold where these statistical properties are true
    when checked. The system cannot evolve in a way where those correlations of bulk
    quantities would disappear.<p>In this toy metaphor it’s not so horrifically odd.
    Superdetermism gets more flak because: (i) the state space and property in question
    is so much weirder and more complicated than the kinematic example, the correlations
    are between objects that measure and the objects being measured!  (ii) if these
    properties are always true under any check we can make there is no way to falsify.
    Then it doesn’t matter if the behavior is from some unimaginable underlying universal
    state space geometry or local quantum effects. This same argument could also be
    applied more generally and inappropriately to reduce any experiment to “that’s
    just the way the structure of the universe is”.'
