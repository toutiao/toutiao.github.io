    you&#x27;ll always get +1 in the X direction.<p>Now measure those electrons in
    the Y direction, you&#x27;ll also get either +1 or -1.<p>But now, if you measure
    in the X direction again, you&#x27;ll get +1 or -1 with 50% probability; although
    before measuring in the Y direction, these electrons always had spin +1 in the
    X direction.
