  text: When I learned about causal sets program and algebraic quantum field theory,
    I finally (somewhat) understood quantum physics.<p>Tl;dr spacetime does not exist
    as a global background where things are &quot;placed&quot;, it is not ontic. &quot;Things&quot;
    are first, and spacetime is derived from interaction statistics of &quot;things&quot;.
