  author: beloch
  text: If you split up an entangled pair of particles and measure them in a the same
    50&#x2F;50 basis simultaneously (sort of like a coin flip) at distantly removed
    places, the results will be individually random but perfectly correlated when
    compared with each other.  It seems natural to assume that something here was
    pre-determined.  i.e. There&#x27;s was some kind of hidden information that we
    haven&#x27;t found a way to measure yet. The way in which the coin-tosses were
    going to pan out was determined when the pair of particles were entangled.<p>Quantum
    physics makes predictions that suggest this isn&#x27;t so.  You can design experiments
    (e.g. A Bell inequality test) in which quantum physics predicts correlations that
    go beyond what would be possible with some hidden local information attached to
    the entangled particles that we just don&#x27;t know about.  Experiments don&#x27;t
    <i>prove</i> theories to be correct.  That&#x27;s not how science works.  However,
    experimental tests of Bell inequalities have pretty conclusively shown that local
    hidden variable theories are inadequate to explain what&#x27;s going on.<p>Yes,
    it appears what Einstein called &quot;spooky action at a distance&quot; seems
    to propagate close to instantly.  It&#x27;s important to appreciate that you can&#x27;t
    transmit information this way though.  We can only make sense of the quantum correlations
    after communicating other information at classical speeds.  Sometimes you see
    quantum entanglement devices allowing FTL communication in sci-fi, but that&#x27;s
    pure horse hockey.<p>That all being said, I don&#x27;t understand quantum physics
    either.
