    a computer. In the early days of computing, an engineer might plausibly have known
    every component in a computer, understood how these components worked, and understood
    why each one was there. As computers got more complicated, no longer could anyone
    understand the entire system on that level. But still, as an individual engineer,
    you can understand the system at a high-level, and for each lower-level component,
    you can have an approximate idea of why it&#x27;s there, what it does, and how
    to learn it in more detail if you ever have to. Any &quot;why&quot; question that
    you might have about it has a straightforward answer that can be stated in a few
    sentences.<p>With quantum mechanics, there&#x27;s a lot that you have to accept
    when you learn the subject without understanding why. Why complex numbers? Why
    infinite-dimensional Hilbert spaces? Why non-commutative algebra? You can kind-of,
    with great effort, make arguments that all of these are at least reasonable. But
    nobody really understands &quot;why&quot; at a level beyond &quot;because the
    theory works&quot;.
