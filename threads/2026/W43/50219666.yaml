  author: lkm0
  text: One of the &quot;coping mechanisms&quot; is to say that information cannot
    travel faster than light, even if entanglement is propagated instantaneously and
    measurement acts faster than light. If Alice and Bob share an entangled pair of
    spins and Alice measures it, Bob has gained no information until Alice communicates
    (sublight speed) her result. No new information is shared at measurement time.
    This is known as the no-communication theorem.
