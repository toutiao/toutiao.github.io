  text: Saying I don&#x27;t understand Quantum Mechanics is like saying, &quot;I don&#x27;t
    understand how attention&#x2F;transformers explain the human brain.&quot;<p>It
    doesn&#x27;t. It&#x27;s model. All models are wrong (including quantum mechanics
    and attention) but some are useful. You understand the domain of the model, the
    problems it can solve, the math behind the models and use the model to make predictions.
    If you are competent at linear algebra and functional analysis, you can do quantum
    mechanics.<p>If you make the error of believing that quantum mechanics is ontological
    god&#x27;s honest truth of nature, you will end up with blunders like using it
    to explain consciousness like Prof Penrose. His math was impeccable, but he was
    making a category error.
