  text: Saying I don&#x27;t understand Quantum Mechanics is like saying, &quot;I don&#x27;t
    understand how attention&#x2F;transformers explain the human brain.&quot;<p>It
    doesn&#x27;t. It&#x27;s model. All models are wrong (including quantum mechanics
