  author: triMichael
  text: No, they are completely different. Determinism is the idea that if you have
    a perfect snapshot of the universe at one time, you could run that snapshot forwards
    or backwards using the laws of physics and have a complete history of the entire
    universe. It&#x27;s a valid scientist idea, but Bell&#x27;s Inequality experiments
    pretty much prove it false by showing that either realism or locality is false,
    and you kind of need both to have determinism.<p>Meanwhile, superdeterminism is
    the idea that you can still have realism and locality by claiming that Bell&#x27;s
    Inequality experiments are invalid because the universe could somehow &quot;know&quot;
    you are performing a Bell&#x27;s Inequality experiment and rig it to get the &quot;wrong&quot;
    answer. Superdeterminism is equivalent to saying that we can&#x27;t prove smoking
    causes lung cancer, because the universe might rig any science experiments to
    make it look like smoking causes cancer. Anytime you ask why the universe would
    do that or how you can prove anything in such a universe, they shrug their shoulders.
    It&#x27;s a completely BS idea that got traction because specific people pushed
    it and others don&#x27;t understand quantum physics enough to know how unserious
    of an idea it is.
