  author: antonvs
  text: 'The strong belief before QM was discovered was that the universe was deterministic
    - that given sufficient knowledge of a physical system&#x27;s present state, you
    could accurately predict its specific future states (not just possible future
    states.)<p>Laplace expressed this in &quot;A Philosophical Essay on Probabilities&quot;
    in 1814: &quot;We ought then to regard the present state of the universe as the
    effect of its anterior state and as the cause of that which is to follow. [...]
    For [an intelligence that has sufficient information] nothing would be uncertain,
    and the future, as the past, would be present to its eyes.&quot;<p>Superdeterminism
    essentially extends this idea of deterministic physical evolution to quantum mechanics.
    It could be considered an appropriate default simply because it was previously
    considered to be, not only the default, but the strongly believed truth.<p>&gt;
    Superdeterminism says that there’s no way to pick your experimental choices in
    a way that reveals things because any possible random number sources you could
    use have contrived correlations that prevent that<p>You&#x27;re arguing against
    a consequence of superdeterminism, not its motivation. Its motivation is as I&#x27;ve
    described.<p>The word &quot;contrived&quot; is doing some heavy lifting in your
    statement. Nothing needs to be contrived in superdeterminism, even if it seems
    that way to an observer within the universe.<p>The explanatory problem you&#x27;ve
    alluded to only arises because we&#x27;re trying to understand the universe from
    within the universe. The universe is under no obligation to make itself sensible
    to us.<p>Essentially, you&#x27;re saying little more than that you don&#x27;t
    <i>like</i> the idea of superdeterminism.'
