  text: I take issue with &quot;understand&quot;.  I agree QM can not be understood
    in terms of everyday experience.  One must build experience, language and proper
    metaphor for the understanding.  For example, in the intro Ross uses the example
    of explaining a waterfall to someone who never saw it.  He says that can be done
    but he relies on implicitly the listener knowing what people on Earth may take
    for granted.  That understanding of a waterfall can only happen if the listener
    already has some understanding of fluid flow and gravity.  We do, but say a newly
    found alien friend from a dry environment that had never experienced fluid flow
    would not have the mental building blocks to understand it.  Feynman gave a famous
    interview where he said, essentially, &quot;no, I can&#x27;t explain it to you
    because you are too ignorant&quot; (he said it more politely).  Going the other
    direction, Physics steeped enough in quantum theory do understand QM enough to
    have meaningful discussions free (at times) of rigorous math.  They do this because
    they have a shared language, vocabulary, metaphor.  Sure, they must rely on math
    and experiment to ground that understanding in truth but I guarantee they do not
    communicate understanding (solely) in math and measurement data.
