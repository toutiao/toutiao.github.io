    I know very little about Roc, but I would be interested to see these compared against a previous version in roc-deflate with a more “naïve” implementation.
    The author mentions:

    Most of the optimizations that improved roc-deflate's numbers came from general optimization techniques that are widely beneficial across languages…


    Some of the optimization techniques were Roc-specific, though, and I wanted to mention them here as a reference for others.

    I don't think I can read Roc well-enough to pick out the latter from the code diffs, but what would be interesting to me is:

    to what degree does the improved version deviate from the naïve approach?
    how obvious are these improvements (and why might they not have been made previously)?
    in cases where these improvements required reformulations, what early warning guidance could we derive that our initial design inclination may run contrary to latter desire for performance?

    In other words, if I am not a very good Roc programmer—this is almost certainly a trivially true statement about me!—how achievable and unachievable are these impressive results?
    It is probably the case that I will not become a Roc programmer—much less a better Roc programmer—but I am, of course, open-minded. However, I am currently a Zig programmer (in that I have written Zig programmes that I have then subsequently used,) and I've been trying to think more deeply about optimisation in the context of the dynamic evolution of a project.
    It seems to be the case that some small Zig utilities I can write are faster than the Go utilities they have replaced, and I could follow very naïve, very obvious approaches to achieve said performance. In many cases, I could more or less take the same approach as the Zig standard library, which I have found to be very readable. It has been argued that the readability of the Zig standard library (at least in contrast to the standard library's of other languages) is a transient artefact of the language's overall age and maturity, which suggests that there may be an untapped “well” of significant additional performance somewhere out there, and that exploiting this may come at the cost of legibility. Well, I sure hope not.
    In truth, as a practical matter, while it's very interesting and very impressive to see what is possible, if I am likely to always only ever be a mediocre programmer (or, through the circumstances of my work, the creator of mediocre products,) it's much more useful for me to know what is possible within my capabilities and resources (or, with no increase to my capabilities or resources, I can be aware of consequential initial design choices that I might otherwise mistakenly believe to be equivalent…) Also, like, if I screw up and write something really terrible (or, as has been the case, I inherit responsibility for a large code-base that did not make the right choices,) how much work will it be to dig myself out?
