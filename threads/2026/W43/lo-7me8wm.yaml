  text: |-
    Very good questions!
    An important difference between Roc and Zig in this area is that I'd say ergonomic high-performance code is a main area of focus for Zig, whereas Roc's focus is elsewhere. We want it to be achievable to get results like this, but I don't anticipate optimizing code to this degree being something that typical Roc programmers would do, or need to do - in the same way that (for example) most Go, TypeScript, Python, Java, etc. programmers don't need to know how to make maximally-performant compression algorithms (and similar) in those languages.
    This part is important to me though:

    if I screw up and write something really terrible (or, as has been the case, I inherit responsibility for a large code-base that did not make the right choices,) how much work will it be to dig myself out?

    For large code bases, I don't expect people to need to know any of the performance optimization techniques under the "Roc-Specific Optimizations" section except for the first one: Avoid Unnecessary Sharing. There's almost a rite of passage for Roc beginners where they share some code on Roc Zulip that's running way slower than they expect it to, and a veteran points out that they're sharing something that doesn't need to be shared, and then immediately after addressing that, the code becomes fast.
    Fortunately, so far it seems to be the case that Roc code with that problem exhibits very obvious symptoms very early, so I haven't seen it be a problem yet that someone builds on a bad foundation that will need rewriting later. That said, there aren't many sizable Roc code bases out there yet, and even the biggest ones aren't as big as in other languages (e.g. I've heard of hundreds-of-thousands-of-lines code bases, but no million-plus ones yet), but I'm optimistic that what we've seen so far will continue to hold!
