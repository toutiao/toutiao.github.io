    Rust has a bunch of ways to do non-wrapping unsigned arithmetic, with methods like checked_add() or strict_add() or saturating_add() or overflowing_add() (which returns a carry bit) https://doc.rust-lang.org/std/primitive.u64.html#method.checked_add
    C has <stdckdint.h> which allows programmers to mix and match types in a way that Rust doesn’t, but it doesn’t provide saturating arithmetic. C++ relies on <stdckdint.h> for checked arithmetic and has saturating arithmetic in its <numeric> header.
