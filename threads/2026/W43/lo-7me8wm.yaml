    Idiomatic as in ordinary Roc code that you'd write normally when not trying to squeeze every last drop of performance out of the code?
    Assuming that's the question, I'd say you can definitely tell it has been performance-optimized. The easiest tell is that it uses List.prefetched in some places; that function is a no-op aside from performance characteristics, and you'd only want to use it after measuring because prefetching can both improve and degrade performance depending on where it's used.
    Another easy thing to spot is the optimization technique I mentioned in the last section of the post: adding an explicit (and redundant-looking) bounds check outside a loop so the optimizer can tell it's safe to skip the automatic bounds checks inside the loop. It's the type of thing I'd only add after measuring, never in a first-pass implementation. Same with things like clearing and recycling collections instead of just making fresh ones.
    That said, I'd say roc-deflate's code looks unusual but not ridiculous. The way I see it, it's important to be able to write Roc code that has good performance without needing to do weird tricks, but in the cases where the goal is maximum performance (like it was here), it's fine if you need to go out of your way to write unusual code as long as the code is still understandable.
