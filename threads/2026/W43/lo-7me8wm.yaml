    On a meta-level, I'm amused that this post and https://lobste.rs/s/gajtrm/debunking_faster_than_rust_malicious are currently right next to each other on the front page, with the same amount of upvotes. Both posts are about compilers for languages with automatic memory management competing on performance with languages that are generally in a higher tier of performance, but the tone of the comments is very different!
    I'm glad I included an explicit paragraph on why it wouldn't be reasonable to conclude that "Roc is faster than C" even in the minority of inputs where roc-deflate happened to outperform libdeflate. I have the same instinctual reaction as the author of that post did when people say "X is faster than [Rust/C/C++/Zig]" because all of those languages give you ways to access everything the hardware is capable of. They vary by ergonomics and guarantees, not by performance ceiling!
