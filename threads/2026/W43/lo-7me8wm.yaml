    I'm 100% sure a referentially transparent language that employs direct linearity/affinity instead of opportunistic mutation will get closer, and may in fact be faster than C or Rust with enough effort. When aliasing and Von Neumann addresses are out of the picture, vectorization, changes in representation or even automatic parallelization (with the help of heuristics) are easier.
    (I also believe affinity would be more successful compared to linearity with user-defined deconstruction.)
    I believe in a referentially transparent future, it just hasn't arrived yet. And when it does arrive, I believe it's not going to have the "sufficiently smart compiler" problem.
