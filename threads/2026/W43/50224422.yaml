  author: Animats
  text: |-
    Yes. But you have to go beyond page one of Google results because there is so much slop, human and otherwise. See [1] for a technical overview.  See page 14 of [2]
    for the strategic and political aspects of who controlled what in a crisis.
    &quot;Cheget No. 1 (the Soviet premier&#x27;s portable terminal) had
    priority status: its owner could enact heightened level of
    alert and, after the early warning system registered the
    launch of U.S. nuclear weapons, give launch order (transmit
    codes unblocking the launch command).&quot; That&#x27;s the key point. <i>The premier of the USSR did not have personal first strike authority.</i><p>Putin, however, has said that he now does. Trump has first-strike authority too.<p>The definitive book on this seems to be &quot;Russian Strategic Nuclear Forces&quot;[3], an English translation from MIT Press of a Soviet-era document. That&#x27;s what the good sources cite.<p>[1] <a href="https:&#x2F;&#x2F;subhranil.com&#x2F;the-dead-hand-system-a-technical-analysis-of-the-perimeter-nuclear-command-and-control-system&#x2F;" rel="nofollow">https:&#x2F;&#x2F;subhranil.com&#x2F;the-dead-hand-system-a-technical-analy...</a><p>[2] <a href="https:&#x2F;&#x2F;npolicy.org&#x2F;wp-content&#x2F;uploads&#x2F;2021&#x2F;08&#x2F;Controlling_Soviet-Russian_Nuclear_Weapons_in_Time_of_Instability.pdf" rel="nofollow">https:&#x2F;&#x2F;npolicy.org&#x2F;wp-content&#x2F;uploads&#x2F;2021&#x2F;08&#x2F;Controlling_S...</a><p>[3] <a href="https:&#x2F;&#x2F;search.worldcat.org&#x2F;title&#x2F;51969872" rel="nofollow">https:&#x2F;&#x2F;search.worldcat.org&#x2F;title&#x2F;51969872</a>
