  author: icegreentea2
  text: 'If you had the resources to run and maintain a nuclear submarine force, but
    were also resource limited to a single form of strategic deterrence, then yeah,
    you would probably go with SLBMs. This is what the UK and France settled into.<p>But
    it costs a lot to feel confident in SLBMs, especially if the top of your target
    list includes the USA.<p>Otherwise, if you&#x27;re talking about the USA specifically...
    ICBMs should probably be considered an expensive hedge.<p>Finally, &quot;optimal&quot;
    depends on your definition. China has chosen a public &quot;no first strike&quot;,
    while also avoiding launch on warning likely for a variety reasons. China&#x27;s
    publicly stated &quot;minimal deterrence strategy&quot; (which they seem to be
    walking away from) was probably at least partly a pragmatic choice, driven by
    resource constraints. Also, for what its worth, it does seem like China is also
    walking away from a strict &quot;no launch on warning&quot; policy as well.<p>The
    lack of launch on warning (this is my speculation) was probably a combination
    of lack of technical capability (both ISR and C2), wanting to maintain tight central
    control, and wanting to play up the advantages of being &quot;the third player&quot;.<p>Here&#x27;s
    a whole recent report on China&#x27;s nuclear force: <a href="https:&#x2F;&#x2F;www.tandfonline.com&#x2F;doi&#x2F;full&#x2F;10.1080&#x2F;00963402.2025.2467011#d1e918"
    rel="nofollow">https:&#x2F;&#x2F;www.tandfonline.com&#x2F;doi&#x2F;full&#x2F;10.1080&#x2F;00963402.2025.2...</a>'
