  author: jiggawatts
  text: 'A great mental model here is that if you talk to many people, each one has
    their verbal ticks, their repeated phrases, the preferred idioms, but... you don&#x27;t
    notice because you speak to each acquaintance only for a few minutes or hours
    at most at a week. If you <i>really know</i> someone, since you were both kids,
    or whatever, then you can often learn their particular style and even mimic it.<p>If
    you think of the the frontier AI models as people, there aren&#x27;t hundreds
    or thousands of &quot;intelligent human-like machines&quot; that you&#x27;re speaking
    to, there are like... two: whatever the best model is made by Open AI or Anthropic
    right now.<p>A programmer might be reading (or at least skimming) <i>thousands
    of pages</i> of text from just one (or at most two or three) models a week, week
    after week, for months now.<p>It&#x27;s like the entire world is talking to two
    aliens that have stepped of their glittering spaceship. The aliens can hold millions
    of conversations at once, but they have only two personalities, so... that&#x27;s
    what everyone is getting, and everyone has learned to recognise.<p>What makes
    things even more obvious is that unlike humans, the models don&#x27;t &quot;self
    adjust&quot;. On the contrary, they are inherently amnesiacs, and hence <i>don&#x27;t
    realise</i> that they&#x27;re awfully repetitive! A human using the same phrase
    fifty times in a row will dial it back a notch, but these dials are the weights
    of the models and are frozen for each released version.'
