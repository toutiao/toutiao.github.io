  author: Animats
  text: |-
    &gt; The Russian’s dead man switch is the exact opposite. I wonder if it’s still in place.<p>Perimetr? That&#x27;s misunderstood. The idea behind Perimetr was that the Premier of the USSR did not have first-strike authority. Only the Politburo did.
    After they got rid of Stalin, the later governments of the USSR were very wary of a leader with too much power. Further down, control was divided between the KGB, which controlled the warheads, and the Strategic Rocket Forces, which controlled the launchers.<p>The most the Premier could do on his own was enable Perimetr. If it detected actual nuclear explosions and could not communicate with any of the top command bunkers, it would, after a delay of hours, release the arming codes for ICBMs to lower levels of authority.
    So it only worked for a second strike where a first strike had taken out most of the leadership. That was more restrictive than the US system.<p>Today, both Putin and Trump have first strike authority. Sleep well.
