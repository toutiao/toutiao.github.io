article:
  url: https://www.vanityfair.com/story/jared-kushner-hacked-phone-secret-negotiations
  title: 'The Art of the Deal: Jared Kushner’s Hacked Phone Revealed His Secret Negotiations—Including
    More Than $700 Million in Transfers | Vanity Fair'
  fetch_status: success
  content: "_In late spring 2020, a source I knew to be reliable called me with a
    story. The Dutch government had hacked into [Jared Kushner](https://www.vanityfair.com/news/story/jared-kushner-saudi-arabia-ea-games)’s
    phone and monitored him as he accessed a Dubai-based bank account. What was odd,
    the source said, was that the money in the account—hundreds of millions of dollars—had
    come from a bank in Azerbaijan. Most importantly, [Kushner](https://www.vanityfair.com/news/story/jared-kushner-is-reportedly-hitting-up-wealthy-donors-on-trumps-behalf)
    appeared to have transferred significant [amounts of money](https://www.vanityfair.com/news/2018/05/kushner-cos-brookfield-qatar?)
    from the Dubai account to other individuals, including a warlord, a mercenary
    and a one-time hit man. The story sounded preposterous, I told my source. And
    yet._\n\n_Six months later, I found myself speaking with someone else about the
    [UAE government](https://www.vanityfair.com/news/2018/03/saudi-arabia-united-arab-emirates-jared-kushner-robert-mueller)
    and their use of mercenaries in conflicts around the [Middle East](https://www.vanityfair.com/news/2021/05/jared-kushner-peace-institute)
    and Africa when I asked, on a whim, whether they knew anything about [Kushner](https://www.vanityfair.com/story/sazan-resort-ivanka-trump-jared-kushner)
    and bank transfers from a UAE account. My acquaintance grew quiet. Then they replied,
    “Yes.”_\n\nOver the next four years, I came to learn that, sometime in late 2017,
    the Netherlands Defense Intelligence and Security Service (MIVD) made a startling
    discovery. A General Staff of the Armed Forces of the Russian Federation (GRU)
    operative, a dark web hacker specializing in stolen bank data, was traveling to
    the UK for an espionage mission. They reached out to the British government for
    permission to apprehend him when he arrived. The British agreed.\n\nWhen the Russian
    national arrived in England, the Dutch informed him that he had two options: he
    could work for them against the GRU, or the British would arrest him. Once in
    UK government custody, the operative would be charged with espionage. If convicted,
    he would spend years in a British prison. The Russian chose to change his employer.\n\n###
    'Princes and Thieves: Jared Kushner and Mohamed bin Zayed's Secret Plot to Remake
    the Middle East' by Matthew Cole\n\n[$30 \n\nSimon & Schuster\n\n](https://cna.)\n\nLater
    that year, the Russian operative gave the Dutch spies access to one of the GRU’s
    most sensitive assets. Located in Rostov, Russia, the GRU’s hacking and cyber
    team operated a remote server on which they stored some of their bounty. During
    their search through these secret files, the Dutch found something astonishing:
    screenshots of Jared Kushner’s iPhone.\n\nIn The Hague, the MIVD hacking team
    tried to reverse engineer the Russian penetration of Kushner’s iPhone. Kushner
    owned what was then the latest model, the iPhone X. Released in November 2017,
    it featured Face ID, a state-of-the-art security feature that Apple had promoted
    at its launch. The Dutch team had been trying to pick the phone’s door lock, so
    to speak, when it occurred to them that the Russians may have found an unlocked
    window to gain entry instead. Their hypothesis was correct. By early 2018, the
    MIVD had found a vulnerability in the iPhone that gave them access. The security
    exploit wasn’t perfect, however. Some malware allows a hacker to turn a victim’s
    phone into a microphone and video camera, turn the phone on or off, and pull and
    add files. The Dutch solution did not provide that level of access. Instead, when
    Kushner used the phone, they could see his screen. Almost as soon as they got
    inside, the intelligence service began capturing every image of Kushner’s screen
    as he used it, filing their own cache of surveillance on their internal computer
    servers.\n\nAs they monitored Kushner’s phone, they discovered he used it to log
    in to a UAE bank account. By the time the Dutch spies had visibility into the
    phone, the account had received hundreds of millions of dollars from a bank in
    Azerbaijan. Their initial assessment was that the bank account was affiliated
    with the government there.\n\n> \n\nFor the MIVD hackers, the bank account became
    an intelligence mystery to unravel. Nearly everything they worked on had a tinge
    of Russian conspiracy. A little over a year into Trump’s first presidency, the
    MIVD, like FBI agents and federal prosecutors in Washington working on the Robert
    Mueller investigation, had only part of the story.\n\nKushner, UAE ruler Mohamed
    bin Zayed (MBZ) and Mohammed bin Salman (MBS) of Saudi Arabia, converged at an
    auspicious moment. MBS wanted to be crown prince. MBZ wanted to blow up Obama’s
    Iran nuclear deal, and Kushner wanted both to help him force the Palestinians
    into a deal that Israel would accept. Despite the perception of his wealth, Kushner
    was not entirely financially independent of his parents, and the family business,
    Kushner Companies, faced a billion-dollar loan coming due on their trophy property,
    the Manhattan office building at 666 Fifth Avenue.\n\nEarly in the first Trump
    administration, MBZ and MBS offered to pay for a slush fund dedicated to helping
    the new administration with foreign policy goals. The idea was to help pay for
    Trump’s promised wall between Mexico and the US, for example, in an effort to
    secure a second term in the White House. The two Arab royals initially discussed
    with Kushner putting more than $10 billion into the effort. Within months, though,
    as MBZ pushed the Trump administration to help back MBS’s effort to become his
    country’s crown prince—and future king—the broader foreign policy slush fund idea
    fizzled. Instead, MBZ and MBS initially, and then MBZ alone, put at least $2 billion
    into at least two bank accounts for Kushner. It is unclear how the royals organized
    their $2 billion in combined payments, but they effectively split the cost. For
    the purposes of explanation, it is best to understand where and how each bank
    account was controlled.\n\nBank account Alpha was held at First Abu Dhabi Bank,
    the largest in the UAE, and was overseen by MBZ’s brother, Tahnoon bin Zayed,
    who served as the bank’s chairman. Beginning in 2017, the Saudis and Emiratis
    transferred roughly $750 million into the Alpha account. Alpha would be used as
