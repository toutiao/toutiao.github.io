  text: |-
    My understanding is that time protocols like NTP and PTP don’t allow for time to go backwards.

    They absolutely do! Most obviously, if the time is wrong for whatever reason, it might need to be corrected by setting the clock back.
    But also, NTP (like unix time_t) goes backwards one second when there is a positive leap second. (PTP keeps counting as usual because it uses a TAI/GPS-like timescale.) Fortunately, leap seconds have been abolished so we should no longer have bugs like these or these.
