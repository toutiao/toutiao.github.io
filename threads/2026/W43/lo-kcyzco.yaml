  text: |-
    As an example, TigerBeetle recommends using something similar to UUIDv7 [1] for client-side generated idempotency IDs. To prevent double spending arising from retries at various network layers, the database must ensure that every financial transfer is executed at most once. So, a website or a mobile app generates a transfer ID locally, and the database needs to check if it has ever seen the same ID before. If you have 10 years of transfer history, that's very slow!
    However, if IDs are roughly monotonic [2] (e.g., based on client's local time), then it's enough to keep, say, the last day's worth of ID in memory for the checks, which is one way to make idempotency checks fast.
    [1]: UUIDv7 is specced to be big endian, which is useful when you compare a pair of ids as strings/byte slices, but we want to compare them as u128 numbers, and so use little-endian.
    [2]: Because ID is client side, it is not actually monotonic, and the clock value can be completely bogus, so the time can't be trusted. For internal IDs, we use server-side strictly monotonic u64 timestamps. If you assign ID server-side (and you DB is strictly serializable), you don't need randomness component at all, and server clocks can be made reliable.
