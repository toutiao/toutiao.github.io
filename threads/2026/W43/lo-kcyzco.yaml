  text: |-
    Yes, you need two clocks!
    locally-monotonic but not globally monotonic purely client-side clock for end-to-end idempotency checks. It's important that idempotency ID is generated on the client, it's too late to do that when the data gets to the server, as it might have been duplicated by that time already. And you can't guarantee strict monotonicity in this case, because clients don't communicate with each other.
    And once the data gets on the server, you want to stamp it with hybrid logical physical time. It's not strictly required, but it's so very useful: 64 bits instead of 128 bits, strict creation order, temporal locality, deterministic time for business logic, observability.
