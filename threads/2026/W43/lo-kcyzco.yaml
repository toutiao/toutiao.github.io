  text: I want to move some identifiers to UUIDv7 so we can partition tables by ID
    rather than timestamp. We currently partition by timestamp for keeping a fixed
    window of data, yet cheaply drop old data without expensive vacuums. One of the
    drawbacks is that for lookup by a v4 UUID you have to (potentially) search all
    partitions to find an item, but with UUIDv7 you can benefit from partition pruning
    to hit only the relevant partition.
