  author: thisisnotauser
  text: A few years ago, I wrote a few research papers using cve generation rate by
    functional area to estimate a kind of &quot;mean time to novel hack&quot; across
    an attack graph for a given architecture. It used the relative consistency of
    cve generation as a reasonable baseline to project &quot;how long until the next
    set of zero days that actually impacts your system.&quot;<p>AI doesn&#x27;t break
    that model, but it certainly turns all the estimated times from months or days
    into basically minutes.
