  author: strenholme
  text: 'It has hit the point where I’ve told people reporting bugs with my software
    that I won’t acknowledge the bug unless they provide a patch to mitigate the issue.<p>A
    lot of these bug reports are incorrectly filed.  Let’s look at one issue, which
    I am sure was found with AI assistance:<p>CVE-2026-40719<p>Here’s the issue: An
    IP authorized to perform recursive queries can cause the DNS server to be non-responsive
    if it sends hundreds of specially crafted packets a minute (this can be changed
    to millions of packets a minute if one sets a parameter in the configuration file).  Normal
    service is restored within a minute of the attack being stopped. The workaround
    would require me to essentially rewrite the recursive part of the DNS server.<p>Since
    the DNS server, like any server in a LAN, is already vulnerable to a flooding
    attack, this is just a flooding attack with extra steps.<p>I told the guy that
    was interesting, I’m not being paid enough to rewrite the DNS server to be immune
    to the attack, and people shouldn’t be using its recursion (it has very limited
    IPv6 support, for starters), and if they do use its recursion, only authorized
    IPs (e.g. 127.0.0.1 or 192.168.1.0&#x2F;24) should be allowed to perform recursion.<p>It
    wasn’t a serious enough attack to merit a patch, and anyway the guy reporting
    the bug didn’t even have the decent courtesy to give me a patch.<p>The guy responded
    by filing for a CVE report, incorrectly calling it a “high impact” bug, and I
    had to make a “patch” which simply disables recursion: <a href="https:&#x2F;&#x2F;samboy.github.io&#x2F;MaraDNS&#x2F;patches&#x2F;MaraDNS-CVE-2026-40719.patch.txt"
    rel="nofollow">https:&#x2F;&#x2F;samboy.github.io&#x2F;MaraDNS&#x2F;patches&#x2F;MaraDNS-CVE-2026-40...</a><p>Point
    being, a lot of these CVE reports out there which supposedly are high impact bugs
    are trivial things like “someone can overload a server for about one minute if
    they send hundreds to thousands of specially crafted DOS packets”.<p>(Today, I
    got an issue which, as far as I can tell, looks to be a Linux kernel issue and
    not an issue with my code.  I told him to show me how he would patch my code to
    “fix” the issue, but so far have gotten nothing but crickets)'
