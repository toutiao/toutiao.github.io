  text: It’s not just the job situation. The world in general sucks now and the broad
    reasons are smartphones and social media, but if you drill down the real problem
    is everyone feels surveilled all the time. Anything slightly out of the ordinary
    is brutally made fun of, any slight misstep during any part of the day can be
    recorded and immortalized on social media. There is so much cultural meme sharing
    that everyone has a brutal, acerbic take on every imaginable situation ready to
    go. The stuff we used to do in college in the 00s that made college such a fun
    experience would be kind of career ending today. Imagine getting blackout drunk
    and then naked and dancing on a table during a house party nowadays. You’d be
    done, a laughing stock forever.<p>There’s just a general feeling of dread and
    malaise in society. You see it in public too. Everyone is stonefaced and going
    about their day. There is no hum&#x2F;hustle and bustle like I used to see in
    public places in the past. Money is very tight and everything is way too expensive.
    I mean lunches cost between 15 and $20 even in places that are not big cities.
    Basic grocery shopping runs cost $500 at this point. I think one of the biggest
    things is, you can essentially live a whole life without really having to interact
    with a whole lot of people now. Corporations provide all your services. The Internet
    provides community knowledge.<p>That being said I feel like I existed at the perfect
