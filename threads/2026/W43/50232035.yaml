  author: icegreentea2
  text: If you choose to define intensity as the ability&#x2F;willingness to turn
    other knobs to 11 (which is what the author does), then its not unexpected to
    see correlation of &quot;intensity&quot; and &quot;success&quot;.<p>As long as
    the other knobs show a generally positive relationship between input and output,
    then obviously turning the knobs up will generally result in higher output.<p>The
    questions are:<p>* What are the downsides of turning up the knob? Both in terms
    of the specific knobs you&#x27;re turning, as well as &quot;going to 11&quot;
    in a more general sense.<p>* Why do people and organizations find it difficult
    to turn the knob to 11?<p>My take is that intensity is painful. This brings two
    things that have to be overcome:<p>You must somehow build a pain tolerant organization.
    You can do this by selecting for pain tolerant people, by inoculating a mission&#x2F;message
    that positively improves pain tolerance (make people believe that it&#x27;s worth
    it), by creating organizational structures that attenuates the pain feedback loop
    (ie, somehow insulate decision makers from the pain, while finding ways to mitigate
    or work around the pain where it is felt... ie, probably just accepting the churn)
    or other means.<p>The other thing to overcome is that pain is supposed to be instructive,
    and provide useful negative feedback. As you build up your pain tolerance, you
    ideally are still able to extract real information from the pain signals. If you
    achieve pain tolerance through blocking off or ignoring all pain signals, then
    you are probably at higher risk of just... doing stupid things.
