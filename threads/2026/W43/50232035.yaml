  author: trentnix
  text: Of course intensity is required for success. Intensity in the service of genuine
    productivity and value is a recipe for success in all walks of life. But lots
    of intensity is cosmetic, and there are lots of people whose intensity isn&#x27;t
    in the service of productive things.<p>The Michael Jordan documentary <i>The Last
    Dance</i> is a great example of this. His intensity, focus, and arrogance was&#x2F;is
    <i>maniacal</i>. Even in a world of hyper-competitive egos, he&#x27;s in a class
    by himself. And that mania resulted in his alienation of almost everyone around
    him - namely his own teammates. Steve Jobs, as mentioned in the blog, was similar.
    Loud firings, public insults, and fits of condescension haunt his legacy. And
    worse, the world is full of sociopaths mimicking the worst of Jordan and Jobs,
    mistakenly thinking being an asshole is the secret ingredient to great success.
    But it&#x27;s not.<p>I&#x27;m friends with a semi-retired public high school basketball
    coach who is broadly considered a &quot;living legend&quot;. He won 19 state championships,
    1300 games, and is a part-time assistant even in his 70s. His winning percentage
    over his entire career is in excess of 90%, which is simply an absurd accomplishment.<p>As
    the son of a successful basketball coach (and have another HS Hall-of-Fame caliber
    coach in the family), I&#x27;m familiar with the passion and intensity of successful
    coaches. I know the hours they put in, the focus they demand, and how the best
    coaches build programs, not teams. I know how they commonly hate losing much more
    than they enjoy winning.<p>But this &quot;legend&quot; I know, on the surface,
    seems an outlier in both success and behavior.<p>He&#x27;s broadly known for his
    calm, cool demeanor. He has only received two technical fouls in his career, one
    for a clerical error and the other for a technicality. He doesn&#x27;t raise his
    voice. He doesn&#x27;t get excited or upset. He&#x27;s &quot;mild-mannered&quot;
    in a world of red-faced, hyper-competitive rage monsters. If it weren&#x27;t for
    his peerless success, his mild temperament would probably be viewed as a liability.<p>He&#x27;s
    universally loved by his players, his peers, and his assistants. He&#x27;s generous
    with his time and energy, willing to share his knowledge and experience with anyone
    who will listen. Those that know him talk about him as a <i>good person</i> first,
    and a coaching prodigy second.<p>But underneath his calm demeanor is a tireless,
    never-satisfied intensity that <i>demands</i> the best from players, schools,
    and parents alike. He&#x27;s examining every angle. He&#x27;s using every moment
    afforded to him for maximum effect. Even if there is a day off, it&#x27;s in service
    of a bigger plan.<p>He sees how all the little habits, the little behaviors, and
    little efforts achieve big goals in aggregate. He watches Junior High B-teams
    practice to make sure everything is done right and that his coaches are investing
    in each player appropriately. And he makes sure each player is investing in themselves.
    He&#x27;s conducting a symphony and passionately ensuring each note is being played
    as best it can.<p>He&#x27;s also very straightforward, to his players, to their
    parents, to the administration, and to anyone that will listen. He knows what
    he wants from his players in practice, in the game, and in all other avenues of
    their lives. He sets lofty but attainable goals for each of them. He doesn&#x27;t
    sugar coat anything. He is willing to tell the truth even when a lie would be
    easier. But that truth is always in the same calm, cool demeanor he coaches with.<p>His
    ability to direct his intensity productively is world class. I don&#x27;t think
    it&#x27;s any surprise that other extremely high achievers, like Steve Jobs, were
    able to do the same. But he&#x27;s proof you don&#x27;t have to treat people poorly
    to succeed at the highest level in your field.
