  author: solatic
  text: This is an overgeneralization.<p>If your company is larger than Dunbar&#x27;s
    number (150 employees), you have low-level employees making median wage and a
    fraction of a fraction of a percent equity, it&#x27;s not <i>impossible</i> to
    have a high-engagement culture, but it would be close to exploitative and at least
    unhealthy for them.<p>But a founder accepting a fatalistic viewpoint on this would
    be signing their own death warrant. There&#x27;s no room for fatalism in startups.
    Rather, good founders need to both bring boundless optimism <i>and</i> work to
    ensure that there is a means for expansion and reward for employees that continues
    as the company gets larger.
