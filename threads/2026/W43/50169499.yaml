  author: bena
  text: Being in a Marvel movie greatly increases your connectedness.<p>Samuel L.
    Jackson and Robert Downey Jr. are central to a lot of plotlines in the first 10
    years of Marvel movies. With either them or characters connected to them appearing
    in other movies.<p>Then you have other franchise connections. If you&#x27;ve been
    in a Kevin Smith film, you&#x27;re at most three steps from Samuel L. Jackson
    by way of Kevin Smith -&gt; Bruce Willis -&gt; Samuel L Jackson. And even if you&#x27;re
    not in a film in the &quot;View Askewniverse&quot; like &quot;Zac and Miri Make
    a Porno&quot;, <i>that</i> movie has Justin Long, who was in a movie with Willis.<p>Every
    actor in the Fast and Furious franchise is connected through Vin Diesel.<p>Every
    actor in the OT and sequel trilogy of Star Wars is connected through Harrison
    Ford. The prequel trilogy connects through Natalie Portman.<p>Just between those,
    it&#x27;s not too hard to reach everyone.
