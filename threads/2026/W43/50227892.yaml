  content: "- [Movie News](https://www.darkhorizons.com/section/movie-news/)\n\n[![](https://cdndark.darkhorizons.com/wp-content/uploads/2026/05/more-halo-remakes-are-on-the-way.jpg
    \"more-halo-remakes-are-on-the-way\")](https://cdndark.darkhorizons.com/wp-content/uploads/2026/05/more-halo-remakes-are-on-the-way.jpg)\n_Halo
    Studios, Microsoft_\n\nNetflix reportedly offered Microsoft $500 million for a
    seven year deal that would allow the streaming giant to adapt shows and films
    about Xbox characters.\n\n[Puck](https://puck.news/what-if-peter-rice-doesnt-change-netflix-all-that-much/)
    broke the news, indicating that Microsoft responded with an offer for $800 million
    – as a result, the deal has reportedly fallen through.\n\nIn a statement to Puck,
    Xbox said, “We have received record-breaking interest in our I.P.; Netflix is
    a valued partner and we are excited for the forthcoming release of our Minecraft
    and Diablo animated series together, among other adaptations.”\n\nMicrosoft is
    now said to be in pursit of “smaller deals with more partners,” doing things on
    a case-by-case basis rather than an overarching exclusivity deal.\n\nMicrosoft
    previously partnered with Paramount to produce the live-action “Halo” series,
    which ran for two seasons. They currently have a “Call of Duty” film in the works
    at Paramount, a third season of “Fallout” at Amazon and a sequel to “A Minecraft
    Movie” opening next year.\n\nTitles like “Gears of War,” “The Elder Scrolls” and
    “Sea of Thieves” are also being pitched for possible adaptations.\n\nNetflix has
    various works based on games coming out, including the animated “Cyberpunk: Edgerunners”
    which returned this week.\n\n \n[![](https://cdndark.darkhorizons.com/wp-content/uploads/2026/03/returnlatest.png)](https://www.darkhorizons.com/all-stories/)"
