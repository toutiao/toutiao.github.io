    as good as the commercial version, but it also doesn&#x27;t cost $100k&#x2F;seat&#x2F;year.<p>Unfortunately
    work paid for the tokens so I can&#x27;t share them, but I&#x27;ve seen it with
    my own eyes. It really works now. The code is not slop (and I am a perfectionist;
    it&#x27;s not just that I have low standards).<p>It doesn&#x27;t work with pre-Astra
    models for sure though.
