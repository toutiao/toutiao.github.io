  author: jeremyjh
  text: You are a demonstration that their marketing campaign is working. The reason
    OpenAI is focusing on math is because it is one of a very, very few domains where
    RLVR can be done at massive scale because large sets of problems with automatic
    verification can be produced and evaluated relatively cheaply. It has no value
    to OpenAI beyond marketing. It has negative value for mathematicians.<p>So far
    the only economically valuable activity that AI has really proven itself very
    capable in is coding - and its for the same reason of economical RLVR. It can
    do significant tasks completely end-to-end in that domain.  It is very helpful
    in other types of tasks such as data analysis and legal research, but those things
    are not going to fulfill your expectations for broad economic impact.<p>There
    is simply no evidence at all for the broad claims of disruption in 1-2 years.
