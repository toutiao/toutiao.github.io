  author: jerf
  text: Only a few curmudgeons at this point are claiming there is nothing, nothing
    whatsoever, to AI.<p>The question is really about the fate of the current build
    out. For those of us who have extensive experience with AI, which is to say, those
    of us here, because we are probably the only people not only using it day in and
    day out but potentially using multiple sessions of it all the time, I think it&#x27;s
    not so surprising that it isn&#x27;t necessarily immediately radically transforming
    every industry everywhere. Even as it has rewritten the minute-by-minute process
    of doing my job entirely, it hasn&#x27;t actually changed my job all that much
    at the higher level and it&#x27;s hard to assign much more than a 2x or a 2.5x
    overall improvement to it once I account for all the Amdahl&#x27;s Law issues
    that come up from the parts that have not been so amenable to acceleration.<p>And
    without unit testing, continuous integration testing, pull request review, the
    fact that the AI is building code which is itself a highly reviewable artifact
    rather than just doing whatever directly, and all the many many guard rails we&#x27;ve
    built up in our industry that happen to be extraordinarily amenable to use by
    automated systems, I still wouldn&#x27;t trust AI all that much for a real task.
    They still bang into those guard rails a lot, and still make what I consider to
    be deeply suboptimal decisions far too often to take my hands off the wheel. With
    all the stuff we have in the programming space they are a game changer, but in
    a field that doesn&#x27;t have anywhere near that much padding and safety nets
    I&#x27;d be way, way more hesitant.<p>I want to say it&#x27;s weird to talk about
    such things when they are also capable of such amazing math proofs, but at the
    same time when you consider the numbers tossed around for how much those things
    have cost, I think you&#x27;re seeing another space that has guard rails comparable
    to software engineering. By contrast to the way these AIs are working, when a
    human solves a comparably hard problem the human tries a few things but from the
    outside would seem to proceed almost directly to the solution, compared to the
    staggering amount of blundering about the AIs do before arriving at their solutions.
    Now, in terms of the final results, yeah, they got there and I won&#x27;t deny
    that. I&#x27;m just saying that in fields where the acceptance criteria are nowhere
    near as sharp as math or software, they&#x27;re operating at a significant disadvantage
    still.
  score: 0
