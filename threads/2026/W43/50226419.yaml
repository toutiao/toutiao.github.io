  text: I just don&#x27;t pay for it. If there&#x27;s something I really wanna watch
    I might buy one month of the service binge it then cancel.<p>The streaming model
    has imho mostly killed old style television formats with the new way of hyping
    up a show in the first couple episodes by tossing money and talent, then leave
    people to hang with unsatisfying conclusions once you&#x27;ve got that sub money.
    It&#x27;s all about convincing people to sign up and stay signed up with promises
    for new content. The quality of the content doesn&#x27;t matter as long as there&#x27;s
    a lot of it and it&#x27;s enough to keep people from unsubscribing.<p>With traditional
    TV your value was directly determined by how many people were watching so you
    could sell addspace. And despite there being less choice and harder for independent
    players to get time, in some ways it was weirdly more democratic because if a
    show sucked or an episode sucked people would just change the channel or watch
    something else. With streaming they still do that but it&#x27;s all in the same
    price scheme so doesn&#x27;t hurt their bottom line. They&#x27;re incentivised
    to just crank out as much crap as possible to keep subs up. Won&#x27;t last.
