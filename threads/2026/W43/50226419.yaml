  author: alephnerd
  text: "&gt; record job loss after the covid bump which we all know resulted in massive
    hiring sprees in a lot of sectors followed by massive layoffs. Is the movie and
    movie production sector really experiencing an apocalyptic downturn where the
    line will reach zero, or just returning to its median?<p>The 2023 Hollywood Strike
    strike, the COVID lockdowns shutting down theaters, and the aggressive film production
    (UK, Poland, Ireland, Norway, Italy, Spain, Colombia) and VFX (Ireland, India,
    Colombia) subsidizes right as American states like California, Georgia, NY, and
    others began cutting them meant much of the American film and television industry
    got obliterated earlier this decade.<p>The reality is revenue is roughly consistent,
    but production costs one you remove subsidies (like what most of the US and Canada
    did) become exhorbitant in low margin industries like entertainment.<p>It&#x27;s
    now cheaper to produce an &quot;American&quot; movie or TV show in Ireland, using
    British actors affecting an American accent (thank Hugh Laurie, Idris Elba, and
    Dominic West for that), with post and VFX done in India than it is in the US.<p>This
    is something that has been reported on in the space for a decade now, but not
    much can be done.<p>This article is also another example of why HNers should stick
    to their own lane, as most lack context or visibility into other industries."
