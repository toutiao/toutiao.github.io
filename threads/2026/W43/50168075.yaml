  author: pfdietz
  text: That&#x27;s not true of iodine.  Iodine deficiency has been quite common;
    it&#x27;s why salt is artificially supplemented with the element.  Natural occurring
    trace iodine in salt and food, unlike with bromine, is often not enough.  For
    this reason the hypothesis that iodine is needed biologically goes all the way
    back to 1851.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Iodised_salt"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Iodised_salt</a><p>&quot;Worldwide,
    iodine deficiency affects about two billion people and is the leading preventable
    cause of intellectual and developmental disabilities.&quot;
