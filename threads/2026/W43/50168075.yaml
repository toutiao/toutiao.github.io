  author: pfdietz
  text: Collagen is a foundational class of proteins, found in all animals in large
    amounts.  It&#x27;s weird -- it has an unusual amino acid, hydroxyproline, that
    is not directly specified in the standard genetic code (instead, it is made by
    modification of proline after the protein has been synthesized; this conversion
    requires vitamin C and its failure is one of the pathologies of scurvy).<p>One
    version of collagen, Collagen IV, has this weird sulfur-nitrogen double bound
    that is produced (again, by post-translational modification) using bromine as
    a reagent, and for this reason bromine (as bromide) in tiny amounts is a necessary
    trace element in diets.  This last fact was only discovered in 2014.<p><a href="https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;24906154&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;pubmed.ncbi.nlm.nih.gov&#x2F;24906154&#x2F;</a>
  score: 0
