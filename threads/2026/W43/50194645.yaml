  author: frading
  text: 'Polygonjs Maker here.<p>Thanks a lot for your questions.<p>Yes, the SDK being
    limited to jai beta is absolutely not something I&#x27;m happy about. I was hoping
    it would be public by the time polygon v2 was ready, but of course that was a
    gamble. Now the rumor is that it will be in 2027, so this is hopefully just a
    matter of waiting a bit more time. So I completely appreciate presenting Polygon
    like this isn&#x27;t ideal.<p>But depending on what projects you have in mind,
    the node-based editor is already quite flexible. Feel free to let me know what
    you&#x27;re thinking of building and I can tell you what you could try.<p>To your
    questions:<p>- Is the dev environment still web first or is that a secondary target?:
    I personally mostly dev in native, do most of the work and tests there, and then
    do final checks in wasm&#x2F;js. Most of the projects I deliver using it still
    are web-based, so this target remains as solid as I can make it.<p>- [...]see
    changes reflected in your running app without a refresh or losing state within
    a second: I used to rely on that, but as projects scale grew, I always found that
    state would become stale in ways I did not understand, so I stopped chasing that.
    And when working in native against the SDK, re-compiling a project takes about
    1-2seconds, so I have not needed to make this work as smoothly as in js. But I
    could look into it. And when you scaffold a SDK project, the wasm is reloaded
    without a page reload, but I think your app state my still need vuejs or react
    to handle that. In short: not fully sure, but it&#x27;s most likely possible.<p>-
    How complete is the PBR support?: You can use env maps. The materials of imported
    GLTF are decent (see example: <a href="https:&#x2F;&#x2F;polygonjs.com&#x2F;gui&#x2F;gltf_import"
    rel="nofollow">https:&#x2F;&#x2F;polygonjs.com&#x2F;gui&#x2F;gltf_import</a>).
    Several things are still missing like clearcoat, and maybe others I am not fully
    aware of. There are advanced features like order-independent-transparency, volume
    rendering, raymarching.<p>- Lightprobes or lightprobe grid supported?: no light
    probes at the moment. I want to look into it. And I&#x27;m evaluating&#x2F;experimenting
    with various GI solutions, which may vary depending if you&#x27;re rendering polygons,
    SDF or voxels.<p>- I didn’t see support for skeleton meshes: There is none yet,
    but that&#x27;s definitely on my roadmap.<p>- Also, how feasible is WebXR support?:
    not implemented yet, but also high on my roadmap.'
