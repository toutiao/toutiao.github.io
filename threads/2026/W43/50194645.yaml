  author: program_whiz
  text: My comment on Jai is that it is a language with some conveniences, but ultimately
    no strong reason to favor it.  Similar to zig, odin, and others, its basically
    just C with some syntax conveniences.<p>It has some design choices that I appreciated
    at first, but are really strongly suited to a particular way of writing games,
    and I wouldn&#x27;t call it general purpose (those same design choices are very
    limiting in other domains).<p>I do appreciate compiler speed, but ultimately I
    bounced off of it because the slight improvement in syntax doesn&#x27;t justify
    losing massive tooling, libraries, docs, support, etc.<p>The language is also
    quite quirky in its conventions, which I think is due to Jon Blow&#x27;s style,
    but which can feel quite odd to anyone who has a wider breadth of programming
    (than just custom game engines).<p>Also of course, any contributions or suggestions
    are met with the typical JB politeness and charm :)<p>All the flaws people mention
    here, are simply because you just don&#x27;t get what a genius he is, those are
    actually features!
