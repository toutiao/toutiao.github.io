  author: torginus
  text: My understanding is that thinks C++ sucks period (an uncontroversial opinion
    even among C++ devs).<p>His reasoning was that C was a pretty minimalist language
    introducing structured control flow and little else, yet it&#x27;s flexibility
    and neutrality has allowed people to explore lots of approaches.<p>C++ on the
    other hand is highly opinionated, and a lot of its opinions are considered wrong
    or at least controversial (template metaprogramming, RAII, exceptions, diamond
    inheritance, just to name a few).<p>A lot of the C++ community doesn&#x27;t use
    these features (for example Chrome, LLVM have exceptions turned off).<p>Jai on
    the other hand goes heavily into typed AST macros (along with a reasonably powerful
    type inference enigne), a very powerful extension of the language, that this language
    has gotten <i>right</i> - the feeling you get when looking at the docs is &#x27;well,
    duh it obviously has to be done like this&#x27; - considering how long it took
    devs to arrive at this system suggests this is far less an obvious task than it
    looks like.<p>Other than this, what the language offers over C isn&#x27;t much
    - it shares Odin&#x27;s &#x27;context&#x27; idea that you can inject an allocator
    or logger function and have your methods use that - which is kind of the point
    imo.<p>Blow, as outspoken and controversial a figure he is; seems to have designed
    a pretty unopiniated language - something designed for master programmers (like
    ones he has worked with in the games industry, who worked mostly in C) to express
    themselves, rather than a set of &#x27;correct&#x27; opinions the language imposes
    on you.<p>Imo it&#x27;s a shame it took so long to release, as I&#x27;m p. sure
    Jai would&#x27;ve been much more influential 2-3 decades ago or more, and would&#x27;ve
    had a good chance to dethrone C++.
