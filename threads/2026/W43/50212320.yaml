  author: yfontana
  text: 'Yeah, I personally draw a distinction between data viz and BI. AI has definitely
    changed the former, it&#x27;s pretty cool to be able to design visuals with claude
    design: you&#x27;re not bound by what libs can do, html + svg lets you visualize
    data exactly how you want (and you can even get fancy with 3d stuff, with the
    pitfall of just showing eye candy with no real insights). I&#x27;ve built some
    fun stuff like that myself (also with duckdb-wasm).<p>But BI is more than just
    visualization: you need stuff like solid data models and semantic layers, tools
    that help enforce data governance (so that the same metric doesn&#x27;t get re-defined
    in 12 different places, possibly with slight variations each time), proper access
    control (with RLS&#x2F;CLS). Sure you can probably vibe-code your own BI tool,
    but it&#x27;s gonna take quite a bit more work than just the viz part.'
