  url: https://www.bitdefender.com/en-us/blog/hotforsecurity/hacker-leaks-281-gb-data-germany-afd
  title: Hacker leaks 281 GB of data from Germany's far-right AfD party
  fetch_status: success
  content: "[Industry News](/en-us/blog/hotforsecurity/tag/industry-news \"Industry
    News\")[Data Breach](/en-us/blog/hotforsecurity/tag/data-breach \"Data Breach\")
    \n \n \n \n \n  2 min read \n  \n\n \n# Hacker leaks 281 GB of data from Germany's
    far-right AfD party \n \n\n[![Graham CLULEY]( \"Graham CLULEY\")](/en-us/blog/hotforsecurity/author/gcluley
    \"Graham CLULEY\") \n\n[Graham CLULEY](/en-us/blog/hotforsecurity/author/gcluley
    \"Graham CLULEY\")\n \n\nOctober 23, 2026\n\n   \n\n \n\n  \n\nGermany's far-right
    AfD (Alternative für Deutschland) party has confirmed that it has suffered a security
    breach, after a hacker published what appear to be hundreds of thousands of the
    controversial political party's internal emails.\n\nEarlier this week, the AfD
    admitted that its hosting provider had been hacked in September, and that some
    of its mailboxes had been copied. The party claims that most of the affected mailboxes
    had not been used for years, but the leaked archive reportedly includes messages
    dated [as recently as 12 September 2026](https://securityaffairs.com/201346/data-breach/afd-email-breach-exposes-421000-messages-in-anonymous-online-archive.html).\n\nThe
    news came as the Hexane.cc leak site published AI-written summaries of hundreds
    of thousands of the messages into categories such as racism and antisemitism,
    graded Low to Critical, according to [local media reports](https://www.heistberlin.com/news/afd-leak-what-421-179-hacked-emails-show-about-the-german-far-right/).\n\n![](https://blogapp.bitdefender.com/hotforsecurity/content/images/2026/10/afd-leak.jpeg)\n\nTo
    add to the AfD's discomfort, reports suggest that the hacker's access may have
    been gained in an embarrassingly simple fashion, via a website that had allegedly
    been left unpatched. However, this has not been independently verified.\n\nWhat
    is unusual is that the leaked emails are not published on the site directly. Instead,
    AI-generated summaries are shown, categorised and rated from Low to Critical.
    The site encourages anybody who wants to read a complete original email, including
    headers, message bodies, attachments, and DKIM signatures, to download it via
    a torrent.\n\nOf course, everyone should be wary of trusting AI-generated summaries,
    as artificial intelligence has a history of making sometimes large mistakes with
    great confidence. Indeed, party sources [told the media](https://www.yahoo.com/news/world/articles/germanys-afd-investigates-alleged-theft-141832402.html)
    that although the leaked emails appeared to be authentic, the AI-generated summaries
    appeared to contain several inaccuracies.\n\nThe full corpus of 281 GB of stolen
    messages and files has been made available for download via the torrent, and claims
    to contain 421,179 stolen internal party emails as well as more than 100,000 files.\n\nThe
    hacker says the leak is intended to [expose the party's \"degeneracy and hypocrisy.\"](https://taz.de/Website-veroeffentlicht-tausende-Mails/!6222819/)\n\nThey
    have also claimed that someone with a Proton Mail email address reached out to
    them offering 100,000 Euros if the leak site was taken down.\n\nShould you be
    tempted to download the torrent and explore the contents of the messages yourself?
    I would advise against it. In the past, cybercriminals have used torrents of trending
    topics in the public eye to distribute malware. That's before you even consider
    the possible legal questions that can arise from handling stolen personal data,
    whatever you might think of the individuals exposed.\n\nIt's not the first cybersecurity
    headache that the AfD has suffered recently. On 3 September, a press spokesman
    for the party's group in the Thuringia state parliament warned that his work email
    account had been used to send phishing emails, and urged recipients not to open
    PDF attachments they may have received.\n\nWhatever you may think of the AfD,
    there appear to have been security failures in this case that are far too common.
    It's not unusual for websites to be overlooked or half-forgotten, and left unpatched.
    It's not rare for shared infrastructure to not be segmented properly.\n\nFurthermore,
    whether you are an individual or an organisation, you should be aware that an
    email account can be a treasure trove of sensitive information. Even if it has
    not been used for years, it can hold vast amounts of correspondence that can be
    exploited by hackers and fraudsters.\n\n \n \n\ntags\n\n \n \n[Industry News](/en-us/blog/hotforsecurity/tag/industry-news
    \"Industry News\")[Data Breach](/en-us/blog/hotforsecurity/tag/data-breach \"Data
    Breach\") \n \n\n* * *\n \n\n### Author\n\n \n* * *\n\n \n\n[![Graham CLULEY](
    \"Graham CLULEY\")](/en-us/blog/hotforsecurity/author/gcluley \"Graham CLULEY\")
