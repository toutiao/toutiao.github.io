  author: gus_massa
  text: As the sibling comments say, it&#x27;s a single positron so the energy released
    is tiny. I tried to find positrons sources in common life, the best I could find
    was <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Positron_emission_tomography"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Positron_emission_tomography</a>
    The relevant paragraph are<p>&gt; <i>For a typical dose (245 MBq) of FDG, one
    of the most common radiotracers used for PET neuroimaging and cancer patient management,[48]
    the effective radiation dose is 4.7 mSv.[49]</i><p>and<p>&gt; <i>This limitation
    restricts clinical PET primarily to the use of tracers labelled with fluorine-18,
    which has a half-life of 110 minutes and can be transported a reasonable distance
    before use.</i><p>Where &quot;245 MBq&quot; means 2*10^8 positrons per second
    for. And &quot;110 minutes&quot; means a half disappears every 2 hours, so the
    total sum is equivalent to 4 hours but I&#x27;m missing some small constant and
    they ae probably averaging the dose. I guess &quot;3 hours&quot; is a good compromise
    but multiply it by 2 or 4 if you prefer a smaller or bigger number. Anyway, 3
    hours are 10^4 seconds, so the total numbers of positrons in a PET is approximately
    2*10^8 * 10^4 = 2*10^12.
