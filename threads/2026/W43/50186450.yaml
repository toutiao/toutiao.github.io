  author: vlovich123
  text: I could be wrong but my understanding is that’s purely a function of our technological
    limitations in how we create antimatter, not in the fundamental energy required.
    Our tech of a particle acceleration is ~1e9 times less efficient than the actual
    energy required because most of the energy is lost, not converted. A gram would
    be $~6.2M&#x2F;gram if we could get to 1% energy conversion efficiency. No one
    bothers of course to even try because it’s not worth it - expensive, difficult,
    and huge energy losses. Fusion reactors for space ships will probably come before
    antimatter gets cracked as a battery source.
