  text: Note in this case the title says &quot;O(n log n)&quot;, but the important
    part is this is &quot;o(n log n)&quot;, not just &quot;O(n log n)&#x27;. The former
    is a strict subset of the latter. We already knew how to multiply two n-bit integers
    in O(n log n) time, via the FFT.
