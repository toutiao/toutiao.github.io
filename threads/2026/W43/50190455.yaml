  author: chowells
  text: If you can&#x27;t understand what the machine has done, math is not being
    done. Math is not pushing symbols around to find sequences that follow all the
    rules. Math is the process of understanding how those sequences of symbols map
    to meanings. If you can&#x27;t follow the proof but have validated it&#x27;s correct,
    all you know is that it&#x27;s a proof of <i>something</i>. Is it a proof of what&#x27;s
    claimed in the adjacent plaintext? Who knows!<p>Math is about clear communication
    between people first and foremost. That&#x27;s why Shinichi Mochizuki&#x27;s claimed
    proof of the ABC conjecture isn&#x27;t accepted - he&#x27;s unable to communicate
    it to enough mathematicians to get a consensus on its validity. LLMs generating
    Lean proofs are basically following that same schema. Sure, something has been
    proven. But what? Where&#x27;s the clear communication explaining it to the satisfaction
    of other mathematicians?
