  text: Math that isn&#x27;t communicated is valueless - by definition.<p>Applies
    to STEM generally, because the foundation of STEM is peer review and <i>independent
    testing and confirmation.</i><p>Even if the practice never quite lives up to the
    theory (true) that&#x27;s no excuse to hand-wave away the requirement as if it
    doesn&#x27;t matter.<p>Proofs that can&#x27;t be confirmed are valueless because
    no one learns anything from them. The value of a proof isn&#x27;t just in proving
    something but in inventing new techniques and insights that can be reused for
    other applications.<p>Brute force searches are <i>fundamentally</i> less valuable,
    because the creative foundation of math is discovering leaps of logic that solve
    problems with insightful shortcuts that can be generalised and reused for other
    applications.
