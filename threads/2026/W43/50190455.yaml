  author: kuboble
  text: |-
    To complement on other comments that have already provided definitions.<p>The big O notation is very often used to denote exact complexity of an algorithm even if the notation is technically an upper bound.<p>The little o notation is usually used to denote a small asymptotic improvement over some known complexity.<p>For example if some sublinear algorithm would have n^(7&#x2F;8) complexity - would be probably advertised as big O of that.
    But n^(1-eps) is shared as o(n) with exact constant provided as a detail.
