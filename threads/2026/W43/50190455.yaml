  author: contravariant
  text: "&gt; o(2n+1) &gt; o(2n) &gt; o(n)<p>I don&#x27;t think any of those are right.
    The latter two are trivially equivalent, the former also is since it differs by
    a factor of at most 3 for all n &gt;= 1.<p>I still think the simplest definition
    for o(f) is &#x27;g in o(g) iff O(g) is a proper subset of O(f)&#x27;. Or you
    can just say g is dominated by f in the sense that lim sup g&#x2F;f = 0.<p>I&#x27;m
    fairly sure those two are equivalent, but it&#x27;s a good little exercise."
