  author: D-Machine
  text: The emotion &#x2F; cognition distinction is somewhat poor and often breaks
    down, because you can&#x27;t really have one without the other (different mental
    states just involve differing degrees of both, phenomenologically). They aren&#x27;t
    really causally separable, but are only really phenemonologically separable (cognition
    and emotion have different feels &#x2F; textures, but almost always co-occur).<p>Most
    importantly, you rarely have &quot;cognition-free&quot; emotional states, because
    emotions always involve some mental model or representation of the self &#x2F;
    world &#x2F; self and world, i.e. they involve a cognitive state. Only in very
    extreme cases (drugs, perhaps some cases of persistent depression, etc) might
    you be able to have emotions that are largely uncorrelated with any kind of particular
    cognition.<p>Likewise, the same is almost certainly true for cognitive states,
    in that we tend to think about &#x2F; model things because we need to evaluate
    those things. Evaluation too seems to rely heavily on emotional processes, in
    that damage to emotional processing tends to make rational &#x2F; logical decision-making
    severely impaired (e.g. Damasio&#x27;s work in the 90s, or <a href="https:&#x2F;&#x2F;pmc.ncbi.nlm.nih.gov&#x2F;articles&#x2F;PMC2396787&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;pmc.ncbi.nlm.nih.gov&#x2F;articles&#x2F;PMC2396787&#x2F;</a>).
    Regardless, you can&#x27;t remove evaluation &#x2F; valuation from most thinking,
    and that is fundamentally linked to emotion.<p>Doesn&#x27;t mean you couldn&#x27;t
    potentially build a machine &#x2F; thing that detects mental states, mind you.
    But it likely won&#x27;t be very useful if it is just using simple folk-psychological
    terminology and concepts (or using such concepts will likely not result in much
    insights into the machine outputs).
