  author: nekitamo
  text: |-
    The Qwen3.8-Flash-Next model is ok for reverse engineering. It can definitely solve simple tasks, but it gets easily confused, and burns tokens like crazy.<p>I&#x27;ve been sick with stomach flu the past few days, so I put together a small benchmark for all the top AI models where I ask them to reverse engineer a very simple small crackme (<a href="https:&#x2F;&#x2F;www.crackmes.one&#x2F;crackme&#x2F;6ab4ce5195b976f8f1300b54" rel="nofollow">https:&#x2F;&#x2F;www.crackmes.one&#x2F;crackme&#x2F;6ab4ce5195b976f8f1300b54</a>) using Ghidrasql (<a href="https:&#x2F;&#x2F;github.com&#x2F;0xeb&#x2F;ghidrasql" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;0xeb&#x2F;ghidrasql</a>)<p>(As an aside: I think representing tools for AI as virtual SQL tables is much better than traditional MCP servers, and that this approach deserves a lot more attention. Props to Elias Bachaalany for thinking out of the box and putting it together).<p>The results of the benchmark are below. It&#x27;s sorted by cost, but I added notes about each AI model for myself. The notes try to talk about intelligence, speed, and cost. Intelligence is a subjective measure which I assign to each model by reading its thinking tokens and watching its tool calls. You can definitely tell which models are more intelligent, even on this small benchmarks, by their tool use, false starts, and how easily they fall for the simple misdirection in the crackme.<p>(gist is more readable on mobile)
    <a href="https:&#x2F;&#x2F;gist.github.com&#x2F;markoglasgow&#x2F;8812c19b6fbffed30b2661b127d9b010" rel="nofollow">https:&#x2F;&#x2F;gist.github.com&#x2F;markoglasgow&#x2F;8812c19b6fbffed30b2661b...</a><p>```<p><pre><code>  +----------------------------------+--------------------------------------------------------------------------------+-----------------+-----------------+-----------------+
      | Model &#x2F; route                    | Experience &#x2F; outcome                                                           |    Total tokens |   Output tokens | Cost            |
      +----------------------------------+--------------------------------------------------------------------------------+-----------------+-----------------+-----------------+
      | Xiaomi MiMo v2.6 Flash           | Incredibly fast and intelligent; solved.                                       |         225,291 |           3,281 | $0.005 (0.5c)   |
      | GLM 5.3 Flash &#x2F; OpenRouter       | Least intelligent group but cheapest; solved.                                  |         340,006 |          11,205 | $0.01           |
      | ChatGPT Luna Latest              | Very fast, concise, token-efficient, intelligent, and cheap; solved.           |         401,837 |           5,119 | $0.01           |
      | Qwen 3.8 Flash                   | Initially confused and failed, then eventually solved.                         |        ~418,000 |          16,676 | $0.02           |
      | Qwen 3.8 27B                     | Fast; one wrong answer, then quickly self-corrected.                           |        ~774,784 |          12,658 | $0.02           |
      | DeepSeek Flash &#x2F; direct API      | Fast, cheap, and accurate; solved.                                             |         369,334 |           9,089 | $0.03           |
      | DeepSeek Flash &#x2F; OpenRouter      | Fast and intelligent; solved in 76 seconds.                                    |         371,689 |          13,888 | $0.03           |
      | Claude Haiku 5.5                 | Fast and surprisingly intelligent, but overly thorough and token-heavy.        |         662,346 |          26,244 | $0.03           |
      | Thinking Machines Inkling        | Low intelligence; good speed and relatively token-efficient; may loop.         |             N&#x2F;A |             N&#x2F;A | $0.03           |
      | Xiaomi MiMo v2.6 Pro             | Overthought the task and wandered into tangents.                               |        ~420,644 |          13,638 | $0.05           |
      | GLM 5.3 &#x2F; OpenRouter             | Cheap and intelligent but behind DeepSeek; solved in about 2m 20s.             |       ~702,473* |          11,879 | $0.08           |
      | GPT Sol Latest (Sol 6.1)         | Slow, but highly intelligent and extremely token-efficient; solved in ~89s.    |         294,957 |           1,406 | $0.15           |
      | MiniMax M3                       | Least intelligent comparison; many wrong turns and repeated small mistakes.    |      4,546,552* |         116,804 | $0.20           |
      | GPT Terra Latest                 | Very fast, very smart, and token-efficient; solved.                            |         229,888 |           2,342 | $0.20           |
      | Mistral Large 4.0                | Medium speed; small mistakes but reached the solution.                         |         303,687 |           4,041 | $0.21           |
      | Kimi K2.7 Code                   | Less intelligent, slow, expensive; not worth using.                            |         100,740 |           8,938 | $0.22           |
      | Claude Opus 5.5                  | Highest intelligence and token efficiency; pretty fast; cheaper than Sonnet.   |         312,837 |           1,862 | $0.24           |
      | Qwen 3.8 Max 0902                | Fast and intelligent, better than Kimi K3, but token-hungry.                   |       1,305,241 |          26,390 | $0.25           |
      | Kimi K3 &#x2F; OpenRouter             | Faster and cheaper than direct K3, but still very expensive.                   |         750,064 |           5,922 | ~$0.32          |
      | Meta Muse Spark Open             | Intelligent and medium speed, but among the more expensive runs.               |         872,850 |          10,284 | $0.35           |
      | Gemini 4 Argon                   | Extremely fast and intelligent; strong value for capability.                   |         384,046 |           2,870 | $0.35           |
      | Grok 4.7                         | Very fast and intelligent, but expensive.                                      |         655,648 |           4,217 | $0.46           |
      | Meta Muse Glimmer 30B            | Fast but low intelligence and token-inefficient; cancelled unsolved.           |             N&#x2F;A |             N&#x2F;A | ~$0.50 wasted   |
      | Claude Sonnet 5.5                | Smart and fast but very token-inefficient and expensive.                       |      1,243,285* |          20,381 | $0.57           |
      | Kimi K3 &#x2F; direct API             | Intelligent but not notable; extremely slow and far too expensive.             |         205,710 |           3,215 | $0.72           |
      | ChatGPT Astra Latest             | Medium speed, token-efficient, highly intelligent; cost similar to Fable.      |         278,603 |           1,536 | $0.83           |
      | Claude Fable 5.1                 | OK speed, very expensive, medium token efficiency; solved in ~53s.             |        397,806* |           2,857 | $0.85           |
      | Gemini Flash                     | Refused the reverse-engineering task.                                          |             N&#x2F;A |             N&#x2F;A | Not reported    |
      | Thinking Machines Inkling Small  | Got stuck immediately and was terminated.                                      |             N&#x2F;A |             N&#x2F;A | Not reported    |
      +----------------------------------+--------------------------------------------------------------------------------+-----------------+-----------------+-----------------+
    </code></pre>
    ```<p>The latest Deepseek-Flash model was the most impressive of the open models. Intelligent, fast, cheap. What more do you want? I think the Xiaomi MiMo - Flash model did well, but it might be a fluke, given how poorly the Xiaomi MiMo Pro model performed (it wandered off on a million side quests).<p>What&#x27;s also interesting is how competitive Luna is to the lower end Chinese models. It&#x27;s quite a bit more intelligent, burns a lot less tokens, is plenty fast and very cheap. After doing this experiment, I don&#x27;t think it&#x27;s a foregone conclusion that the American AI labs will be having the bottom of the market eaten away by the Chinese models. It seems they (at least OpenAI) can compete on the bottom end as well.<p>Finally, the benchmark&#x27;s results reinforce a few things people have been saying about Sonnet and Terra, namely, they&#x27;re not competitive for a range of tasks. For easier tasks, Haiku&#x2F;Luna are plenty capable. For harder tasks, Opus and Sol are so much more intelligent, that they can get them done quicker and cheaper. Maybe there is a place for them in the &quot;Opus designs and Sonnet implements&quot; workflows, but in that case, why not &quot;Opus designs and Deepseek implements?&quot;<p>PS Code harness used was Claude Code. $20 in openrouter credits was used to access the models. Kimi K3 and Deepseek were also accessed directly via the API and then compared to Openrouter. Kimi K3 specifically was much faster on Openrouter, and the difference in output tokens to get the same results for Deepseek&#x2F;Kimi makes me think the Openrouter providers are hosting significantly quantized versions of the model. Goes to show that Moonshot.ai&#x27;s acceptance testing of providers is a useful thing, otherwise your model might look artificially bad when it&#x27;s hosted as heavily quantized by providers who dont care about quality, just top-line cost and speed.
