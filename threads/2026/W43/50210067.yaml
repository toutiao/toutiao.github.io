    \"1 revision\")\n |\n| |\n\nOriginal Reporter: [rdaurne77@gmail.com](mailto:rdaurne77@gmail.com)
    (Wayne)\n\nOn 17th October @ 20:06 UTC, Mozilla received a report to [certificates@mozilla.org](mailto:certificates@mozilla.org),
    forwarded by the Chrome Root program, from Wayne, that the private key of 8 eMudhra
    Intermediate certificates have been compromised. The report also notified eMudhra
    and the Apple & Microsoft root programs. The report included a proof of key control
    for all 8 certificates.\n\nMozilla acknowledged the report @ 20:08 UTC, confirmed
    the proof of key control was valid and began the process to distrust the certificates
    in Firefox via OneCRL. This process was tracked in [Bug 2083382](/show_bug.cgi?id=2083382
    \"RESOLVED FIXED\") and completed @ 22:59 UTC.\n\neMudhra acknowledged the report
    @ 21:29 UTC and reported that they were investigating the issue and had notified
    Sectigo, who had cross-signed some of the impacted certificates.\n\nMozilla was
    able to recover the private keys for the impacted certificates independently @
    21:48 UTC and without any knowledge of the method the original reporter used,
    confirming the key generation process was flawed and is trivial to exploit.\n\n6
    of the impacted certificates are for TLS and trusted by the Chrome, Mozilla, Microsoft
    and Apple root programs. The other two certificates are for codesigning and trusted
    by Microsoft:\n\n    EM EV TLS CA - G3B (eMudhra BV), CCADB A012304\n    SHA-256
