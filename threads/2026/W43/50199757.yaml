  author: gruez
  text: Only if they&#x27;re lazy and went with the &quot;download key and certificate
    (and we&#x27;ll generate the keys for you)&quot; option. Otherwise at least how
    it&#x27;s supposed to work is that you give a CA a certificate signing request
    (CSR) containing your public key, they sign it and hand back your certificate.
    The certificate itself doesn&#x27;t contain anything sensitive, because it&#x27;s
    the same thing that your server presents to clients. But people are lazy and might
    not know how to generate a csr locally, hence the aforementioned option. And of
    course if they&#x27;re too lazy to generate a csr locally, they&#x27;re probably
    also too lazy to keep backups, so you can be sure that eMudhra keeps a copy in
    case they deleted it from their downloads folder.
