    rel="nofollow">https:&#x2F;&#x2F;discuss.python.org&#x2F;t&#x2F;information-for-python-users-re...</a>).
    Pip will trust certificates from both sources.<p>Users of uv who have already
    updated their system certificates can use:<p><pre><code>  UV_SYSTEM_CERTS=true
    uv self update</code></pre>
  score: 0
