- id: '50228622'
  parent_id: '50221260'
  author: zahlman
  text: '&gt; All of these are at one out of two compromises from being MITM&#x27;d
    during the upgrade.<p>This is not true; pip supports hash pinning, so an attacker
    would have to be able to defeat SHA256 as well (or compromise <i>both</i> the
    official Python discussion forum and PyPI itself, so as to forged the published
    hash). Other hashes can also be used. Instructions are provided on the Python
    discussion forum to self-upgrade pip with hash pinning: <a href="https:&#x2F;&#x2F;discuss.python.org&#x2F;t&#x2F;information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident&#x2F;109576"
    rel="nofollow">https:&#x2F;&#x2F;discuss.python.org&#x2F;t&#x2F;information-for-python-users-re...</a>'
  score: 0
  posted_at: '2026-10-25T05:32:29Z'
- id: '50228684'
  parent_id: '50222929'
  author: zahlman
  text: "&gt; But python die-hards look at me like I&#x27;m insane when I suggest
    this.<p>They have a point. The distro is only carrying a small fraction of what&#x27;s
    available on PyPI, and will have out-of-date versions that may lack security patches
    (and for projects like yt-dlp, are highly unlikely to <i>work at all</i>). Realistically
    they aren&#x27;t applying security backports; there would rarely be a reason not
    to just use the new version, and the resources just aren&#x27;t there for that
    scale of patching anyway.<p>Further, pip will interfere with your system package
    manager&#x27;s tracking of the system environment (PEP 668), and any attempt you
    make to install from .deb&#x2F;.rpm&#x2F;etc. to a virtual environment is a hack
    at best. Maybe you could symlink individual package folders to the system environment
    while installing a superset, but ugh. Oh, and if you&#x27;re a <i>developer</i>
    (like most &quot;Python die-hards&quot; are) then this isn&#x27;t very helpful,
    as you aren&#x27;t testing the installation of <i>your</i> package the way that
    <i>your users</i> will do it."
  score: 0
