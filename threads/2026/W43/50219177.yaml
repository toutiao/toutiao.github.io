  author: da_chicken
  text: Exactly.<p>Security fixes for actively exploited vulnerabilities demand an
    emergency response. The risk of introducing new, unknown flaws is less than risk
    of having an active known exploited vulnerability.<p>However, absent the risk
    of a KEV, that changes the equation. Now the risks of code changes causing breaking
    changes plus the risk of supply chain attacks is greater than the risk of having
    to put some thought and time in to manage your software library versions.<p>It&#x27;s
    not like AI created this distinction, either. Neither did CI&#x2F;CD. This is
    standard systems administration -- literally ISO&#x2F;IEC 20000 ITSM. It&#x27;s
    exactly why, traditionally, new features are often limited to major versions.
    It&#x27;s why binary compatibility was a huge issue with RHES 20 years ago, and
    why distros pin versions and backport security and selective bug fixes. A developer
    that doesn&#x27;t know this is telling on themselves why they shouldn&#x27;t have
    write access to production. Stability matters a lot because we like to get paychecks.
  score: 0
