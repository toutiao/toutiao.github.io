  author: saltcured
  text: Heh. This is part of why I always preferred getting my python runtime and
    all these core libs from my linux distro packager. But python die-hards look at
    me like I&#x27;m insane when I suggest this.<p>Even in today&#x27;s LLM-addled
    world, I still think it&#x27;s a better tradeoff for smaller system&#x2F;site
    operators. Get the distro-level testing and regular auto-patching, rather than
    telling yourself it is a good idea to &quot;freeze&quot; your python world at
    the pace of your slowest app&#x2F;system integrator.<p>It&#x27;s the same reason
    I think docker is an anti-pattern for these small groups. You really cannot safely
    use these strategies to bake an image and divorce yourself from the maintained
    distro layer unless you are going to adopt CI&#x2F;CD that does the same thing.
    Keep tracking all these patches to the entire runtime with all the dependencies,
    rebuild, re-test, and redeploy.<p>It&#x27;s total cargo culting to adopt the freeze&#x2F;image
    techniques and just abandon apps in place as if that is robust!<p>But, it&#x27;s
    also more than just automatically updating everything. There is an editorial aspect
    to distro management to help secure the supply chain to your app. Most smaller
    orgs cannot feasibly do this as well as the regular linux distro maintainers.
    Some large orgs can probably do it better, but that doesn&#x27;t matter if you
    aren&#x27;t doing it large org style with dedicated security folks tracking all
    this against well-developed policies and procedures...
