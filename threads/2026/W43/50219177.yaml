  author: cowlevel
  text: HTTP 1 is full of parser differential vulnerabilities, which 2 fixes. That
    is probably its biggest flaw.<p>SMTP is too chatty - it uses too many round trips
    for efficient transfer across the internet. It can take several seconds just to
    get to the point of sending the email data. It also duplicates information between
    the SMTP envelope and the email body which creates vulnerabilities when they don&#x27;t
    match.<p>For APIs that don&#x27;t have to work in a browser I suggest JSON lines
    over TCP, or over TLS.
  score: 0
