    much faster in writing code, just like compilers are much faster at assembling
    all the functions.<p>And yes, in a roundabout way, this is Stallman&#x27;s dream
    fulfilled to the tip with his printer driver ;)<p>Many of these people wanted
    a project to run and gatekeep the people &quot;not worthy enough&quot; to hack
    on it or to use it. That&#x27;s changing now, everyone can prompt together a bunch
    of crap. Fun fact I think I&#x27;ve got like... probably more than ten people
    into C++ programming simply by helping them prompt AI on how to get started, then
    they&#x27;ve picked up actual skills along the way. Note, they weren&#x27;t <i>any</i>
    kind of programmers before because code is scary, but with a much lower barrier
    of entry, many more people can do stuff. It&#x27;s amazing to see.
