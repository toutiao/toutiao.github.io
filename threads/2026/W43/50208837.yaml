  author: throw0101c
  text: '&gt; <i>Is there any way out of this &quot;shareholder value&quot; hell?
    The moment a company goes public they&#x27;re legally required to make stupid,
    short-term decisions that are worse for everyone, even the shareholders?</i><p>Shareholder
    value (primacy) is one interpretation on the purpose of companies (and a relatively
    recent one):<p>* <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Friedman_doctrine"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Friedman_doctrine</a><p>There
    are others:<p>* “Profits are to business as breathing is to life. Breathing is
    essential to life, but is not the purpose for living. Similarly, profits are essential
    for the existence of the corporation, but they are not the reason for its existence.”
    ― Charles A. O&#x27;Reilly, Lead and Disrupt: How to Solve the Innovator&#x27;s
    Dilemma, <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Charles_A._O%27Reilly_III"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Charles_A._O%27Reilly_III</a><p>*
    “On the face of it, shareholder value is the dumbest idea in the world. Shareholder
    value is a result, not a strategy...your main constituencies are your employees,
    your customers and your products.”[72] — <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Jack_Welch#Politics"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Jack_Welch#Politics</a><p>If
    you back to the mid-1900s US:<p>&gt; <i>In 1949 General Foods’ president Clarence
    Francis told Congress that he had a “three-way responsibility to the American
    consumer, to our associates in this business, and to the 68,000 [stockholders
    in General Foods]. We . . . would serve (the company’s) interests badly by shifting
    the fruits of the enterprise too heavily toward any one of those groups.” Two
    years later, the president of Standard Oil of New Jersey claimed that managers
    needed “to conduct the affairs of the enterprise in such a way as to maintain
    an equitable and working balance among the claims of the various directly interested
    groups—stockholders, employees, customers, and the public at large.” So widespread
    were such views that, in 1959, one writer in the Harvard Business Review complained
    that it was no longer “fashionable for the corporation to take gleeful pride in
    making money.” Instead, he complained, it was typical “for the corporation to
    show that it is a great innovator; more specifically, a great public benefactor;
    and, very particularly, that it exists ‘to serve the public’.”</i><p>* <a href="https:&#x2F;&#x2F;law.temple.edu&#x2F;10q&#x2F;purpose-corporation-brief-history&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;law.temple.edu&#x2F;10q&#x2F;purpose-corporation-brief-history...</a><p>Or
    further:<p>&gt; <i>American corporate law has long drawn a bright line between
    for-profit and non-profit corporations. In recent years, hybrid or social enterprises
    have increasingly put this bright-line distinction to the test. This Article asks
    what we can learn about the purpose of the American business corporation by examining
    its history and development in the United States in its formative period from
    roughly 1780-1860. This brief history of corporate purpose suggests that the duty
    to maximize profits in the for-profit corporation is a relatively recent development.
    Historically, the American business corporation grew out of an earlier form of
    corporation that was neither for-profit nor nonprofit in today’s parlance but
    rather, served a multitude of municipal, religious, charitable, educational, and
    eventually business purposes in early nineteenth-century New England. The purposes
    of early American business corporations—rather than maximization of profit to
    private shareholders— were often overtly public, involving development of local
    transportation, finance, and other much-needed economic infrastructure. With the
    rise of factory-based manufacturing, railroads, and other capital-intensive industries
    in the middle decades of the nineteenth century and the advent of general incorporation
    statutes, the purpose of the American business corporation shifted fundamentally
    from public to private. By 1860, the stage was set for the modern firm.</i><p>*
    <a href="https:&#x2F;&#x2F;repository.law.umich.edu&#x2F;mbelr&#x2F;vol9&#x2F;iss1&#x2F;2&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;repository.law.umich.edu&#x2F;mbelr&#x2F;vol9&#x2F;iss1&#x2F;2&#x2F;</a><p>The
    idea that it is some kind of &#x27;legal requirement&#x27; is also a myth:<p>*
    <a href="https:&#x2F;&#x2F;scholarship.law.cornell.edu&#x2F;facpub&#x2F;771&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;scholarship.law.cornell.edu&#x2F;facpub&#x2F;771&#x2F;</a>'
