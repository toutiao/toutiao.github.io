    and about a quarter of the physical land mass<p>The rest of the state is served
    by either local cities with their own utilities or cooperatives. The cooperatives
    are not government agencies, they are privately owned non-profit corporations
    whose customers are the owners. These companies aren&#x27;t regulated by the state
    PSC and have the ability to set their own rates unilaterally. The only regulation
    they have is that they report their rates to the PSC, but it&#x27;s just a report,
    no approval<p>Technically they&#x27;re almost all subject to regulation by the
    US Government as a condition of taking loans in the 30s&#x2F;40s (and most of
    them have rolled that financing over and continue to use it to finance operations
    even today) but for the most part that regulation just says they have to at least
    charge enough to cover their interest, and can&#x27;t sell their systems without
    the feds&#x27; approval<p>They could raise rates as much as they want, but the
    structure of a customer-owned company like that is the profits just get redistributed
    back to the customers, so there&#x27;s no reason or incentive to do so<p>And,
    FWIW, that 23% number from the linked article is about right. GPC is usually 15-20%
    higher than most of the coops and city-owned systems in Georgia (there are some
    that are higher). And this is even with some of those coops and cities actually
    buying power wholesale from GPC
