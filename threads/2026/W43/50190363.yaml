  author: efreak
  text: The office UI has changed dramatically over the years. We have floating toolbars,
    live preview, ribbons, collapsing menus, an undo button in the title bar, a tabbed
    interface. We&#x27;ve moved from SDI to MDI and back to SDI. If you had a customized
    toolbar layout in office, upgrading to 2007 meant you had to learn to use office
    the way Microsoft wanted it. The default font changed multiple times. Chart wizard,
    clip organizer (and later clip art as a whole) were removed. Print preview changed
    to a tab. Contextual help (the `?` button) was removed when Microsoft got rid
    of winhlp, followed by the office assistant, followed by offline help as a whole.<p>Want
    to extend the idea to office as a whole? Lync was replaced with Skype, OneNote
    came and went and then came back again. Groove, infopath, publisher, frontpage,
    SharePoint, various versions of Outlook, the office shortcut bar, photo editor,
    picture manager - they&#x27;ve all disappeared (some have come back again or been
    replaced with something else).<p>I used office XP and 2000 (blocked at the firewall;
    I mostly saved files as rtf for personal use) for years (admittedly this is mainly
    because they loaded in 0.5s on my crappy laptop and PC) until I was forced into
    upgrading to office 2007 by the need to pass around files for class with someone
    who complained incessantly about their stylesheets being lost every time I converted
    the file.<p>I&#x27;m still salty I can&#x27;t waste my time editing 16x16 (32x32?)
    256-color dicks into the toolbar icons i when I&#x27;m supposed to be writing
    essays or setting up autocorrect to quietly put typos into a shared computer (the
    computer isn&#x27;t shared anymore, and it&#x27;s no fun doing it to myself)
