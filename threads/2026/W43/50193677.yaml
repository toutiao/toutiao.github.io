  author: Panzerschrek
  text: I don&#x27;t know what Unreal Tournament did use internally, it&#x27;s hard
    to investigate, since there is no (official) source code release for it. But I
    do know, that brush-based (additive) approach isn&#x27;t strictly necessary for
    creating maps for Quake&#x2F;Quake II&#x2F;Quake III, it&#x27;s technically possible
    to write a map compiler taking maps in some subtractive format. The reason why
    it&#x27;s not done (or at least not common) is because it&#x27;s not a trivial
    task and because existing infrastructure adds some friction.
