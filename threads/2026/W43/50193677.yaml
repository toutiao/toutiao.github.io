  author: somat
  text: The unreal method and the quake one are almost exactly the same technically.
    The level has to be watertight, no leaks from the inside out, even outside areas
    are actually inside. I suspect for the previs set calculation to work correctly.
    The editors were both csg brush based and compiled to similar bsp data structures.
    But in one of those strokes of brilliance where the problem is inverted, the unreal
    editor devs said &quot;if we start from a solid world and you subtract the rooms
    you want then you can never have a leaky level&quot; goofy as hell compared to
    how you think about building things, but it generally worked.<p>Note, that I never
    mapped much, but my standard approach was generally to cut a few large rooms out
    in the general shape of the map(because despite the clever opening if you got
    too ambitious too quick unreal absolutely would leak like a sieve) then use a
    mix of add and subtract brushes to make the fine geometry, which was exactly the
    same as quake maps, large simple rooms to avoid leaks(this time needing to be
    assembled) filled with fine geometry via adds&#x2F;subtracts.<p>This is sort of
    the early id, Epic engines in a nutshell, id better technically, Epic better tooling
    and ergonomics.<p>And a footnote on brushes, because I did not understand this
    until long after I stopped mapping, A &quot;brush&quot; is a 3d primitive unique
    from the point,face one commonly used in 3d modeling software. A brush is defined
    as the convex shape made from intersecting planes. So where for a point,face model
    you define where the points are and which points form a face, for a brush you
    define where the face is(point, normal) and what faces are in the brush, the shape
    comes out of how they intersect. I assume this was because for large simple geometry
    that you are going to be doing csg operations on the plane model is more attractive
    than the point model.
