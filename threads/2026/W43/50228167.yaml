  author: badsectoracula
  text: "Interesting but (from the PDF):<p><pre><code>    Every role but the verifier
    is the same\n    underlying model, called in a fresh context\n    and coordinating
    through a shared workspace on disk:\n    \n    &lt;ws&gt;&#x2F;task.md - the problem
    statement\n    \n    &lt;ws&gt;&#x2F;plan.md - the manager’s overarching plan\n
    \   \n    &lt;ws&gt;&#x2F;tasks.json - a debug mirror of the task list\n    \n
    \   &lt;ws&gt;&#x2F;notes.md - curated ideas &#x2F; findings &#x2F; partial proofs\n
    \   \n    &lt;ws&gt;&#x2F;solution.py - the current solution\n</code></pre>\nThen
    they describe how there is a ping-pong between manager and worker with fresh context
    for the worker, but i wonder, is that part or even the worker really necessary?<p>My
    use of Qwen 3.8 27B (which is the only model i use almost since it came out) is
    really doing something very similar to the above where first a task is described,
    a `PLAN.md` file is made with the (current) plan and tasks are either in the plan
    file or in a separate issue tracker the LLM has access to via a CLI tool, a `STATUS.md`
    that tracks the current status and a `GOTCHAS.md` file for writing down various
    notes&#x2F;tidbits&#x2F;gotchas (TBH this is largely because Qwen 3.8 27B does
    want to note down stuff anyway so it mainly acts as an attractor for not writing
    its notes down in the other two places :-P).<p>There isn&#x27;t any real harness
    driving this, i just give it a task, tell it how it&#x27;ll be handled and off
    it goes. I guess i&#x27;m playing the &quot;role&quot; of the harness there as
    i tell it to not go and do everything in one go :-P but i never bother with fresh
    contexts, Pi&#x27;s &quot;rolling&quot; approach to compaction (i.e. summarizing
    the older messages to make space while keeping the recent messages as-is) make
    it almost a non-issue.<p>I have considered making it a planning tool, though as
    some tool it can use via the CLI (it is running in a container), not a harness
    - but at the same time it feels like it can do the same thing with the `PLAN.md`&#x2F;`STATUS.md`&#x2F;`GOTCHAS.md`
    triplet. The only thing the tool would help with is to provide a UI for me to
    check what it&#x27;s currently doing, but even then i usually just stop it and
    ask it directly :-P then tell it to continue.<p>Perhaps at some point i&#x27;ll
    make some custom benchmark with stuff that are vaguely similar to what i work
    on and try a bunch of different approaches. It is something i want to do anyway
    to see how and if Qwen4 27B (whenever that comes it) is an improvement over 3.8."
