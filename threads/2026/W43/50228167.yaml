  author: badsectoracula
  text: The model itself (Qwen 3.8 27B specifically) can handle being interrupted
    just fine and i often interrupt it to clarify things when i see it finding my
    instructions vague or to add some extra info.<p>However there is a bug somewhere
    between my instructions and the model - i <i>think</i> it is the jinja template,
    though i&#x27;m not sure as i haven&#x27;t actually looked too deep into it -
    that in some cases make my last message be sent repeatedly to the model after
    each tool call, making the model think that i&#x27;m getting impatient or something
    :-P. When i notice it, i tell the model that this is some harness bug and it can
    ignore the repeated messages, which it does.<p>It seems to happen when i stop
    it while it is thinking after a tool call but i&#x27;m not certain. I try to stop
    it while some tool call is in process so it cancels the call as that seems to
    avoid the issue. Restarting llama-server also seems to make the issue go away
    so it might be a llama.cpp bug, but TBH i haven&#x27;t found a clear repro case
    aside from it happening when i interrupt it while it is thinking. I <i>think</i>
    it is more common when the context is close to full, or at least i mainly remember
    it happening when i&#x27;ve been using a session for some time (i.e. not in fresh
    sessions, which does make reproducing it a bit harder).<p>In any case, the model
    itself seems to deal with all the above fine (and accepts the bug explanation
    for repeated messages), it is the rest of the stack that can show an issue with
    interrupting it (but even that is relatively rare).
