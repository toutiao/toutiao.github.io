  author: octoberfranklin
  text: First off you need to pick a harness that you can use with <i>every</i> model.  This
    way you isolate model problems from harness problems.  If you had to switch harnesses
    (Claude Code) in order to try out Fable, you&#x27;re doing something wrong.<p>Secondly
    yeah, all models have issues with foreground vs background subagents.  So I just
    modified my harness to delete foreground subagents.  No more confusion.  If they
    need the subagent&#x27;s output tokens they can read it from the session transcript.<p>&quot;Take
    away tools&quot; is often the best solution for model-gets-confused problems.  Narrow
    down your toolset until there&#x27;s only one way to do things, and then make
    it the maximally-powerful way.
  score: 0
