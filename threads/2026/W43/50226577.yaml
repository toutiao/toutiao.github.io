  author: rcxdude
  text: The disorder&#x2F;difference thing is very much a matter of degree and context.
    Most disorders are essentially an extreme version of a &#x27;normal&#x27; variation
    in some trait. ADHD among them. Psychiatrists define disorders when that variation
    is extreme enough to cause problems for the individual or those around them, but
    still there is a wide range of degrees between e.g. &quot;struggling to get into
    work sometimes&quot; and &quot;literally can&#x27;t hold down a job&quot;.<p>So
    you could argue that if you are on the boundary, whether you have ADHD traits
    to the extent of being a disorder depends on the environment you find yourself
    in, and so you could characterise that as some aspects of that environment &#x27;giving
    you ADHD&#x27;, but it&#x27;s still not yourself changing.
