  text: |-
    &gt;it depend s on a third party to keep the service running<p>Does Nostr address this? Even things like freenet, tor, i2p rely on third parties...just more third parties than the traditional web, with the idea being that more means more uptime and less individual power.<p>But if you spin up a nostr (or any of the above) relay <i>after</i> the others have shuttered, you&#x27;ll have no data because there are no peers. Torrents are fairly durable because there&#x27;s <i>usually</i> at least one peer, but when there isn&#x27;t, there just isn&#x27;t.<p>&gt;A book doesn&#x27;t disappear from your shelves just because the author lost interesting
    That&#x27;s because the book is actually on your shelf. If you have local backups of websites, they don&#x27;t disappear quite so easily. The web is just the library but on the web - you send a request to borrow, they let you if they have a copy, what you do with that copy is up to you and your legal system.<p>&gt;You shouldn&#x27;t need to write raw HTML to write a website
    wysiwyg editors are better than ever, no? Plenty of themes available to take the burden of CSS off. Plenty of engines to take the pressure of JS off. Even in-browser IDEs and the inspect window if you do want to play with the code.
