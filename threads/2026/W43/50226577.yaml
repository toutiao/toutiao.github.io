  author: grumbel
  text: Neocities is just a repeat of Geocities, and like everything else on the Web,
    it depend s on a third party to keep the service running, and whenever they lose
    interesting, all the content is lost. Even when somebody archives it, all the
    links are broken and the content becomes nearly impossible to find.<p>One of the
    big problems with the Web is that it&#x27;s all ephemeral, it not a question of
    if it breaks, but when and how badly. A book doesn&#x27;t disappear from your
    shelves just because the author lost interesting or the publisher goes out of
    business, but websites disappear from your bookmarks like that all the time. That&#x27;s
    what needs fixing.<p>The other part is HTML itself. You shouldn&#x27;t need to
    write raw HTML to write a website. That&#x27;s the job of the browser. The very
    first browser that Tim Berners-Lee wrote supported editing, but that got completely
    lost over the years. A little bit still exist in the form of the &#x27;contentEditable&#x27;
    attribute, but you can&#x27;t author websites with that all by yourself, as there
    is no means of saving or publishing the results. No modern browser supports WebDAV
    either.
