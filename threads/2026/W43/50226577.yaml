  author: GuB-42
  text: 'Gemini is essentially GopherS, Reticulum doesn&#x27;t seem to operate at
    the same level (it is L3, like IP, from the look of it).<p>I hold the controversial
    opinion that encryption can be an anti-feature on the &quot;small web&quot;. One
    of the reason is technical: encryption takes computing resources, and can hardly
    be made time proof, as it has to evolve in response to threats, and certificates
    tend to have expiration dates. The other is more philosophical: you use encryption
    when you want to share secrets: personal data, passwords, credit card numbers,
    etc... A system that doesn&#x27;t support encryption doesn&#x27;t support transfer
    of personal data, accounts or commercial transactions, which I believe is a good
    thing in this niche. There is no shortage of secure communication systems when
    you need one, let that niche stay a niche.'
