  author: 1potato
  text: 'For anyone who may not be familiar with it, SDF is actually pretty amazing.
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;SDF_Public_Access_Unix_System"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;SDF_Public_Access_Unix_System</a><p>Among
    many, many other services, you can get your own Gopher or Gemini site there.<p>I
    really like the Lagrange browser, which works with both Gopher and Gemini: <a
    href="https:&#x2F;&#x2F;gmi.skyjake.fi&#x2F;lagrange&#x2F;" rel="nofollow">https:&#x2F;&#x2F;gmi.skyjake.fi&#x2F;lagrange&#x2F;</a><p>Another
    excellent Gopher resource that hasn’t been mentioned here yet: <a href="https:&#x2F;&#x2F;gopher.floodgap.com&#x2F;gopher&#x2F;gw"
    rel="nofollow">https:&#x2F;&#x2F;gopher.floodgap.com&#x2F;gopher&#x2F;gw</a><p>Gopher
    is still quite active, and there’s lots to read. Gemini, from what I’ve seen,
    is less so. A lot of what I’ve seen is just cross-posted between Gopher&#x2F;Gemini
    or even Gopher&#x2F;Gemini&#x2F;WWW, so there’s not much point to it.<p>You’ll
    also see a lot of “I’ve just discovered Gemini! Here’s why I think it’s awesome.”
    And then, they never post again. There&#x27;s a good amount of that on Gopher
    as well, but you&#x27;ll also find lots of Gopherholes that have been active for
    years.<p>Still, though, I think Gemini has a lot of potential. It’s a much more
    pleasant browsing experience than today’s web, but it’s had trouble finding a
    niche so far.<p>There’s one group of people who think that it doesn’t really solve
    any problems not already solved by Gopher, and there’s another group that just
    cross-posts all of their content to the web to maximize its potential audience,
    which kind of defeats the point.'
