  author: anthk
  text: "Gemini it&#x27;s good on legacy machines and some clients can be really barebones
    (awk+less), and for some security there are clients written in Go. For awk+less,\ndo
    yourself a favour. Run<p><pre><code>    unset LESSOPEN \n</code></pre>\nor have
    it at ~&#x2F;.profile.<p>Reticulum it&#x27;s unusable in 32 bit machines, it badly
    needs a Go port for nomadnet.<p>On Gopher, well, lynx&#x2F;sacc and maybe i2pd
    for some security and anonimity.<p>As a start, there&#x27;s:<p><pre><code>     gopher:&#x2F;&#x2F;magical.fish\n
    \    gopher:&#x2F;&#x2F;sdf.org\n</code></pre>\nFor gemini,<p><pre><code>     gemini:&#x2F;&#x2F;gemi.dev
    it&#x27;s nice.\n</code></pre>\n&#x27;Lagrange&#x27;  covers both gemini and gopher
    as a client.<p>You can set an HTTPS proxy for it and read news sites and blogs
    over Gemini.<p>Just set<p><pre><code>     stargate.gemi.dev:1994\n</code></pre>\nAs
    the HTTP proxy in the settings for Lagrange.<p>For the terminal guys, there&#x27;s
    Telescope and it can use HTTP proxies as well. Read the man page."
