  author: pmlnr
  text: 'WhatsApp has little to do with doomscrolling. I really wish I could afford
    to not use it, but it seems to be impossible.<p>Scenario 1: video calls<p>I live
    abroad. The family, including a 80+ grandmother, has Androids, iPhones, computers.
    If I were to run something, maintenance would be limited to a few times per year,
    and I couldn&#x27;t be there when they get a new device. Besides, remote support
    on android is virtually impossible.<p>I&#x27;m a veteran sysadmin and I have an
    XMPP ecosystem working with video calls &amp; all, but that is not common. It
    needs a secured TURN&#x2F;STUN server beyond a well configured XMPP one, DNS service
    entries, etc. For someone less experienced I can clearly see that being a nightmare.<p>Scenario
    2: mailing lists<p>I&#x27;d absolutely run to communicate with the group of people
    I run classes for on mailing lists, except mailing lists are essentially dead
    since DKIM&#x2F;DMARC. DKIMv2 might address this, but if you ask people, especially
    young ones, they&#x27;ll look at you as if you&#x27;re from Mars.<p>Summary<p>I&#x27;d
    absolutely love to have a non-profit, cross-platform video call app that comes
    pre-installed everywhere, just as the phone (aka voice) &quot;app&quot; is there,
    but there&#x27;s zero incentive from the current ecosystem for such thing. I&#x27;m
    aware of carrier-level video calls, but I seriously doubt it&#x27;s used a lot.'
