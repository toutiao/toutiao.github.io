    Thanks for the extra references! I wrote this a few months ago when I was understanding the algorithm for the first time and it was written in a very rough way haha. I've been revisiting it as I am using it again for a VCS+CI system I'm building.
    I found the algorithm very nice at the start of the year and very elegant. I think more people should know about it. One thing that I don't think I express very well is how nice it is that once you describe your computation in terms of these cacheable computation graphs a lot of the manual orchestrating I used to do before to keep things up-to-date goes away. The whole data model is very very nice to work with.

    And I can't find where in the rest of the algorithm we'd depend on that.

    changed_at basically tells you when this was computed the last time. Let's say you do a query at time T, you check and the last time that query value was verified was at T - 1, so it could be out of date. You then check its dependencies and to each of the dependencies you check if dep.changed_at < q.verified_at, if that's the case then the value is up to date since none of its dependencies has changed since you last verified it. That's how in my version of the algorithm at least you stay lazy and avoid recomputation.
