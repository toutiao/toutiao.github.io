    My implementation doesn't need this? And I can't find where in the rest of the algorithm we'd depend on that.
    Also missing from most discussions is a twist I added to make the changed-at checking return false more often, by eagerly re-querying dependencies that may have changed in order to not re-run a potentially expensive function with no actually-changed deps.
