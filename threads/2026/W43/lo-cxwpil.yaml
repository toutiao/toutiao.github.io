  text: You can emulate regex capture variables by copying the selection, then pasting
    it; this works as long as the cursors stay separate. The biggest frustration I
    run into when doing this is that find-and-replace in many editors is a little
    'smart' with respect to capitalization (so foo -> bar changes Foo -> Bar, FOO
    -> BAR), but you can't do that with multi-cursor.
