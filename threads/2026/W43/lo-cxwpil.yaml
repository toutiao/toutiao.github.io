  text: |-
    just as snappy

    I'd even say it can be much snappier than Vim! Maybe it had something to do with the plugins I was using or my config, but Vim was extremely sluggish when I tried reading a large raw database dump. Vis handled it just fine for the most part, only becoming unresponsive on searches and such (which is understandable on a multi-GB file).
    The way it does multiple cursors is pretty good too; I quickly found myself trying to use them even in Vim.
    My main annoyance when switching over from Vim was that it (sometimes?) positions the cursor differently after switching modes than Vim would, which trips up my muscle memory. I've mostly adjusted to it by now, but I still feel slightly awkward navigating in it.
