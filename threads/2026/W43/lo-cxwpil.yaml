  author: lonjil
  text: |-
    When I decided to use Vim Classic, I had already tried, and rejected, Helix. If it hasn't changed since then, Helix is completely incapable of find and replace. Of course, you can do a mass regex select, and then a replace, but this is an unsuitable alternative, for two reasons. When two selections butt up against each other in Helix, they merge into a single selection. So if two things you want to replace happen to be adjoined, they'll be replaced with a single thing. The other issue is that you can't use regex capture variables in your replacements.
    I also considered Vis, but I likewise rejected it, though I don't recall why. I've heard of Kakoune but never tried it.
  score: 1
