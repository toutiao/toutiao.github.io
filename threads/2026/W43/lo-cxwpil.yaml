    As I understand it, there’s no specific patch or regression. It is a philosophical opposition to the use of AI to develop the software.
    From the project homepage:

    Vim Classic is a fork of Vim 8.x for long-term maintenance, providing a stable, dependable editor — maintained entirely by humans.

    Emphasis mine.
