  text: |-
    It probably varies a lot.  My .vimrc is 77 non-whitespace lines.  A chunk of that is because I configure ALE to use different versions of clang-format and clang-tidy for different projects in there (and I share it across machines, so it has some checks to see which one it's on and then use the correct paths for the tools depending on that).  It also has around ten lines of 'I tried NeoVim and wanted my config to work with it' changes that I should probably rip out since I'm never going back to NeoVim.
    So a 'make vim minimally nice for the things I care about the most' .vimrc is probably around 20 lines (source $VIMRUNTIME/vimrc_example.vim is the first one, currently sitting in a if !has("nvim") guard).  Probably a good 80% of what I want comes from there.
    But I've seen other folks who do a lot more customisation of their editor than me.  They have hundreds, if not thousands, of lines of config and actually care about them.  For anyone in this situation, moving configs to a different editor, even a similar one, is a lot of work.
