    Not extremely clued in to the whole chain of events, so my reading might be off, but it seems to me that the panic was fuelled by the recent over-confidence in, and over-reliance on, AI agents and LLMs. As soon as rumours of the exploit hit the internet, everyone and their grandma put their chatbots on the task - and chatbots are very good at very quickly producing a large volume of results that look very convincing but only half-work or don't hold up of the further scrutiny, and also immediately try to attack targets if controlled by a black hat.  The result was a deluge of "confimed exploits" and "active attacks" hitting the internet as soon as the news broke.
    People scrambling to respond to this probably themselves had to resort to LLMs to analyze the situation due to the lack of reliable information and the speed in which everything was moving, and knowing how the current models are primed to overemphasize security issues (and be overly dramatic in general) it would not surprise me if they defaulted to confirming people's worst fears: "The exploit has been thoroughly corroborated. This isn’t just a bug. It’s a genuinely profound vulnerability woven into a load-bearing part of the whole internet."
    Combine this with a pre-existing fear that AI actually would be able to exploit something like this in a catastropic manner, and a reasonable better-safe-than-sorry stance, and the reports of widespread severe exploits become very believable even for experts.
    Actually analyzing the situation and the real impact still required human effort and thoughtful analysis, but such an approach moves with a glacial speed in comparison.
