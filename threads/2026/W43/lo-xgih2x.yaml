    That’s actually, for me, one of the more subtle pieces of it:

    non-trivial bug to actually exploit in the wild

    If it were trivial to exploit, there would likely be a massive armada of shit disturbers pointing their mass DDoS tools at the entire internet and popping every PHP server in existence. That might still happen, but if hitting any particular server is a non-trivial exercise it might not be worth the effort.
    On the other hand, because there isn’t visible mass exploitation, I’m speculating that the massive long tail of small services running older versions of PHP will just continue on running unpatched, ready to be exploited in the future in a more targeted campaign. Bob’s wordpress blog that isn’t on anyone’s radar until he posts something that upsets someone and gets some publicity, then boom… popped.
    Maybe this ends up being one of the few times when things like CloudFlare and their WAF stuff ends up actually being a good thing? Hard to say for sure, but for me personally the fact that this isn’t mass-automated-exploitable suggests that the door’s going to remain open for a long long time and will probably be talked about in security circles like MS08-067 (literally the only Microsoft security advisory that I know by memory)
