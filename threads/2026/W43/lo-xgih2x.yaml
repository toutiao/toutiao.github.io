    Against myself, you could've looked at the latest version of Nextcloud's official Docker image. It has my PHP version, my OS version, and my number of workers. I haven't changed the defaults.

    (stuff about WAF)

    I don't run a WAF, and I have seen security people complain about them and essentially call them useless. Maybe they're wrong, and maybe I should've been running a WAF. In any case, Nextcloud's default configuration doesn't include one, and I don't think most other self hosted services do either.
    Rate limiting is obviously a good idea independent of WAFs but since we're talking about 153 requests here I don't know that that would've kicked in.

    Against very low-traffic websites that do not have any bot protection, leak information about their version, running close to stock configuration, you might get lucky.

