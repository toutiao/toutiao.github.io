    discord and helped people debug their programs. I wouldn&#x27;t share answers
    directly as the professors checked for identical and identical-with-renamed-identifiers.
    So the incentives were pretty well aligned for a collaboration where the students
    did learn something themselves.<p>I was incentivized to teach them stuff instead
