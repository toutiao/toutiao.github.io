  author: anilgulecha
  text: This is a good point.<p>Zoho is a classics example of picking students at
    age 16&#x2F;17, when they&#x27;d typically join a UG course, and instead train
    them on the job.<p>Some of the large tech service companies change incentives
    by tying a training fee (&quot;bond&quot;) which is tied to some tenure (1-2 years).
    Departing before this would mean giving this back - which broadly incentives the
    planned tenure.<p>Other companies (musigma is an example) present pay as a 4 year
    package (10X), which is split 1&#x2F;2&#x2F;3&#x2F;4X across 4 years.<p>I think
    the challenges US universities&#x2F;companies are today facing is something India
    has needed for a couple decades now. I would not be surprised if many of these
    are tried in the US.<p>If you do plan - reach out to me, it&#x27;s something I&#x27;ve
    wanted to expand into (currently run UG curriculums).
