  text: The thing is that the policy has been splitting off infrastructure from the
    operators, allowing competition of operators, and selling off shares of national
    operators. This policy is straight from the books of neo-liberalism, and it promised
    us greater efficiency.<p>My point is that these promises are lies. Neo-liberalism
    is a failed policy (yet it is the dominant policy among every single government
    in power today). And when GP claimed education was expensive because it is done
    by the government, I was here to call it out as another lie of neo-liberalism.
  score: 0
  posted_at: '2026-10-26T00:27:00Z'
- id: '50237471'
  parent_id: '50233611'
  author: myegorov
  text: As someone who tasted both education models, the US model of babysitting students
    for the first few years after high school is superior. Students coming in with
    relatively weak preparation are able to catch up to their better prepared peers
    within a couple years. At the junior (3rd year) level you can hardly tell the
    difference between the graduates of elite high schools and run of the mill public
    schools. I think the entry bar is much higher, and in many cases insurmountable,
    in Europe. It persists through the years so someone perfectly capable of developing
    the required discipline and chops has no chance if they didn&#x27;t come from
    the right high school or high school track.
  score: 0
  posted_at: '2026-10-26T00:29:41Z'
- id: '50237495'
  parent_id: '50233598'
  author: myegorov
  text: If it was that simple, the cost of education per student would be highest
    in places like Germany.
  score: 0
  posted_at: '2026-10-26T00:33:00Z'
- id: '50237504'
