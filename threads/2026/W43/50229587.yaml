article:
  url: https://www.panamericandispatch.org/p/meta-ignores-brazilian-court-order
  title: Meta Ignores Brazilian Court Order to End Bolsonaro Favoritism
  fetch_status: success
  content: "[News](https://www.panamericandispatch.org/s/brazil/?utm_source=substack&utm_medium=menu)\n\n#
    Meta Ignores Brazilian Court Order to End Bolsonaro Favoritism\n\n### Sleeping
    Giants and CTRL-Z sent evidence to Brazil’s Superior Electoral Court today showing
    Meta AI continues to spontaneously link Lula to negative content \n\n[\n\n](https://substack.com/@padispatch)\n\n[Panamerican
    Dispatch](https://substack.com/@padispatch)\n\n_by Otávio Rosso_\n\nSleeping Giants
    Brasil and the organization CTRL+Z sent new evidence to the Superior Electoral
    Court on Monday. The groups say it points to possible unequal treatment by Meta
    of the campaigns of President Luiz Inácio Lula da Silva, of the Workers’ Party,
    and Sen. Flávio Bolsonaro, of the Liberal Party.\n\nThanks for reading! Subscribe
    for free to receive new posts and support my work.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!CdTr!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2d3b04ca-0141-4aca-81e2-f64fd77e8555_1157x626.jpeg)\n\nThe
    groups argue that Instagram and WhatsApp tools keep showing results that would
    favor the Liberal Party candidate. They also say the tools link Lula to derogatory
    content. This continues despite an electoral court order that Meta ensure equal
    conditions for both candidates.\n\nJournalist Mônica Bergamo [broke the story
    today in](https://www1.folha.uol.com.br/colunas/monicabergamo/2026/10/entidades-apontam-novos-indicios-de-tratamento-desigual-da-meta-a-lula-e-flavio-no-tse.shtml)_[Folha
    de S.Paulo](https://www1.folha.uol.com.br/colunas/monicabergamo/2026/10/entidades-apontam-novos-indicios-de-tratamento-desigual-da-meta-a-lula-e-flavio-no-tse.shtml)_.
    According to her report, the organizations filed a petition addressed to Superior
    Electoral Court Justice Marco Aurélio Bellizze, who is overseeing the court caset.
    They asked him to order the alleged irregularities fixed within 24 hours. They
    also want Meta to explain how it ranks search results and produces answers with
    artificial intelligence. And they ask the court to enforce the daily fine of R$500,000
    (about $99,000) it already set.\n\nThe new records involve searches for animated
    GIFs, the ordering of hashtags and answers from Meta AI, the artificial intelligence
    system built into WhatsApp. The organizations say the examples reinforce their
    suspicion that the platforms do not apply equivalent criteria to the two presidential
    campaigns.\n\n**Image searches put Flávio Bolsonaro in the spotlight**\n\nThe
    petition describes a GIF search on WhatsApp for the word “brasil.” The first result
    was an image of Flávio Bolsonaro. It showed his ticket number and identified his
    running mate.\n\nAccording to the records sent to the court, the same result appeared
    on three separate accounts. The groups use this to ask whether its top position
    comes from systematic ranking criteria.\n\nA similar check on Instagram also showed
    images of the senator among the first results. Users who searched for “brasil”
    found three images of Flávio Bolsonaro in the top positions. The only mention
    of President Lula was his name in writing, with no photo.\n\nThe two organizations
    say the difference deserves an explanation. Search and recommendation tools can
    increase the exposure of certain candidates on social media. They are not claiming
    that they have proven bias in Meta, choosing instead to posit the question to
    the Superior Electoral Court.\n\n**Lula linked to derogatory content**\n\nAnother
    set of examples ties Lula to negative terms in searches on Meta platforms.\n\nOn
    WhatsApp, a GIF search for the word “ladrão” (thief) returned a caricature of
    the president in a striped uniform, a reference to prison dress. Another result
    carried the message “Supporting the Workers’ Party is a mental illness.”\n\nOn
    Instagram, a search for the same word showed a GIF reading “Vote 13.” That is
    the Workers’ Party election number, tied to Lula’s candidacy.\n\nFor Sleeping
    Giants Brasil and CTRL+Z, these results point to an imbalance in how political
    references are shown to users. The imbalance stands out against the visibility
