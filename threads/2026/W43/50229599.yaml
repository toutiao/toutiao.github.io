    use it; most people don&#x27;t use it because there&#x27;s nowhere it can be used.<p>As
    for a universal social media platform, that used to exist. It was called &quot;webrings&quot;.
    Every website would link to other websites they vouched for, so you could browse
    around them, and sign up for those you liked by clicking a single button on your
    browser of choice, adding it to your RSS feeds, after which you&#x27;d be notified
    whenever a creator you subscribed to posted something new.<p>Most of that died
    when Google decided to oppose RSS as a public-facing feature, and pressured Firefox
    in doing the same. So <i>nowadays</i> it suffers from the same networking effects
    problem crypto does.<p>The whole thing is deliberately engineered to centralize
