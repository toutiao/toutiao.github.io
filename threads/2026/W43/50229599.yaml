  author: xg15
  text: 'I do think it&#x27;s important to have intermediate categories. A world in
    which there is only &quot;family friendly&quot; content on the mainstream platforms
    and <i>everything else</i>, including extreme fetishes is shoved together into
    the sketchy no-name sites would be bad. On the one hand, it would associate a
    lot of people whose content is reasonably close to the mainstream with the extreme
    ends, on the other hand, it would confront a lot of <i>users</i> with extreme
    stuff even if they don&#x27;t really have an interest in it.<p>As a concrete example:
    What the queer community wants is do become <i>more</i> accepted as a normal part
    of societies. Telling them &quot;you&#x27;re not welcome here, but feel free to
    promote at pornhub with the other freaks&quot; would be the exact opposite.<p>Lastly,
    &quot;content&quot; doesn&#x27;t exist in a vacuum. It&#x27;s possible that large
    commercial platforms can show stuff that small indie artists would be getting
    banned for.'
  score: 0
