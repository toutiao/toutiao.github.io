  author: gr_norm
  text: From the article:<p>&gt; Proving that a fuzz test has no more crashes to find
    is more significant than it sounds. It’s common for fuzz tests in real-world code
    to test for violations of meaningful high-level properties, such as encode-decode
    roundtripping, idempotence, algebraic laws, differential testing, self-consistency,
    or equivalence to reference implementations. For example, a fuzz test for the
    LZO compression algorithm asserts that if you compress an input, then decompress
    it, the result is the same as the original. If the property does not hold, the
    program crashes—so proving the test never crashes is equivalent to proving the
    property itself.<p>However, you&#x27;re correct that this is <i>not</i> formal
    verification in the sense of a correctness proof against a full specification
    validated to capture what the program is intended to do. Pretty impressive though.
