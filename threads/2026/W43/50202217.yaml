article:
  url: https://www.anthropic.com/research/formal-verification
  title: LLMs are making formal software verification feasible at a much larger scale
    \ Anthropic
  fetch_status: success
  content: "### \n\n_Keane Lucas, Aengus Lynch, Luna Tong, Luke Champine, Zygi Straznickas,
    Dino Distefano, Harshikaa Agrawal  \nEvyatar Ben Asher, Ava Howell, Sami Jawhar,
    Chris Rohlf, Nickolai Zeldovich  \nNicholas Carlini, Rajashree Agrawal, Jason
    Gross_\n\n_Most software is riddled with bugs, which AI can now easily [find](https://hacks.mozilla.org/2026/05/behind-the-scenes-hardening-firefox/)
    and [exploit](https://www.anthropic.com/research/exploit-evals). The standard
    defenses against cyberattacks are no longer sufficient: we need ways to prove
    that code is free of bugs. Formal software verification could provide this guarantee,
    but it has historically required years of expert effort, making it impractical
    for most real-world projects. In a collaboration with [Theorem](https://theorem.dev/),
    however, we show this is no longer the case: LLMs can now produce formal proofs
    at large scale, enabling new software development workflows that include proven
    security guarantees. Using Claude, we proved security properties at the assembly
    code level (RISC-V) in over 100 real-world open-source software libraries. **To
    our knowledge, this represents the first large-scale effort to use AI to apply
    formal verification to production software at the assembly code level.** While
    writing the proofs, Claude also discovered bugs that had eluded detection for
    years, despite [trillions of test runs](https://opensource.googleblog.com/2016/12/announcing-oss-fuzz-continuous-fuzzing.html).
    As model capabilities continue to improve, we expect formal verification to become
    an essential part of secure software development._\n\n## Introduction\n\nEven
    mature, heavily tested software contains bugs, and LLMs are [increasingly adept](https://hacks.mozilla.org/2026/05/behind-the-scenes-hardening-firefox/)
    at finding them. The Linux kernel—one of the most well-tested pieces of software
    today, deployed on billions of devices worldwide—recently had [over 1,000 vulnerabilities](https://lwn.net/Articles/1097401/)
    disclosed. With frontier models becoming more capable of [chaining seemingly benign
    bugs](https://www.anthropic.com/research/exploit-evals) into critical exploits,
    we need techniques that can detect and fix these bugs before they can be exploited
    in the wild.\n\nIdeally, such techniques could find and patch _all bugs,_ and
    then provide some proof that there are no more to be found. _Formal verification_
    is one way to do this. In formal verification, developers translate their code
    into a mathematical model, then try to prove that it always follows some defined
    set of security rules. If they fail to prove this, that means there could be a
    bug in the code that would violate a rule, and the nature of the failure implies
    what the bug might be. Repeating this process (after eliminating the cause of
    failure each time) will ultimately yield proof that the code is devoid of any
    bug that would violate those rules.\n\nHowever, formal verification isn’t easy.
    Proofs can be many times larger than the original code, and writing them requires
    significant effort and a niche, highly specialized skill set. For instance, it
    took two person-years to implement the seL4 operating system kernel, but _20_
    person-years [to formally verify it](https://sel4.systems/Research/pdfs/comprehensive-formal-verification-os-microkernel.pdf).
    Accordingly, formal verification has been practical only in truly mission-critical
    applications, such as [Airbus’s avionics code](https://www.astree.ens.fr/papers/astree_airbus_sas2007.pdf).\n\nBut
    LLMs are making it far easier. Frontier models can now produce correctness proofs
    for real-world software fully autonomously. To demonstrate this, we asked Claude
    to prove useful security properties across 123 open-source libraries, including
    showing that some of their executable artifacts can _never_ crash under certain
    conditions. Specifically, Claude proved that these programs will always exit normally
    without triggering memory-safety errors or failing assertions, for every input
    less than 64 MB and every modeled Linux operating system (OS) response and memory
    layout, under certain assumptions (namely that the program runs as a single-threaded
    static binary with a fixed memory budget on a RISC-V CPU using Linux OS). This
    is still far away from fixing _all_ possible bugs, but it does get us much closer
    than before and provides a roadmap toward that end.\n\nWe’re publishing a [subset
    of these proofs](https://github.com/theorem-labs/oss-verify-proofs) so that anyone
    can verify and reuse them, along with the [RISC-V and OS semantics](https://github.com/theorem-labs/rocq-linux-process-semantics).
    [Theorem](https://theorem.dev/), our collaborator on this project, is also offering
    to run the same pipeline for [other open-source projects](https://theorem.dev/oss-verify/),
    and is publishing a [Claude skill](https://github.com/theorem-labs/oss-verify/blob/main/.claude/skills/add-project/SKILL.md)
    to help developers get started with verifying their own code.\n\nFormal verification
    is a broad field with many methodologies. Below, we also describe our initial
    explorations using other formal verification methods to accelerate other security
    or software development tasks, such as assessing the security of the zlib compression
    algorithm, proving behavioral equivalence of a Python interpreter written in Rust,
    and rooting out long-standing bugs in critical software.\n\nThe road ahead for
    formal verification is promising. The cost of writing proofs is falling as models
    become more intelligent. Moreover, as more code is formalized and methods of achieving
    security guarantees become more standardized, the ability to reuse or modify proofs
    across codebases will amortize the cost. We encourage all developers to explore
    formal verification with LLMs—_especially_ those who previously tried it with
    less capable models and found it didn’t work.\n\nIn the rest of this post, we
    cover our formal verification experiments in more detail.\n\n## Turning tests
    into proofs\n\nTo prove that a piece of software is correct, we must first state
    what “correct” even means. Correctness is defined by the _specification_ (spec).
    In some programs, there is a clear way to formally specify the program’s intended
    behavior. For example, a [PNG](https://en.wikipedia.org/wiki/PNG) decoder takes
    a sequence of bytes and (following [RFC 2083](https://www.rfc-editor.org/info/rfc2083/))
    decodes these bytes into the corresponding image. But for most programs, things
    aren’t so straightforward. What would it mean for a text editor or a web browser
    to be “correct”? The difficulty of obtaining a comprehensive and unambiguous spec
    is a significant obstacle to verifying software at a larger scale.\n\nTo address
    this for the code in the open-source libraries that we sought to prove, we take
    the approach of automatically converting their preexisting compilable test suites
    into a spec by encoding the rule “this test suite always passes,” using a general
    model of what it means to execute any RISC-V-compiled binary on Linux. Historically,
    proving such specs was intractable, given the inherent complexity of writing a
    proof that can encompass and make an argument over all possible behaviors and
    interactions of tens of thousands of assembly instructions over any input (and
    the fact that proofs tend to be extremely large as a result). This is where today’s
    LLMs come in: churning through millions of lines of code in pursuit of a well-defined
    goal is a task that LLMs are extremely well suited for.\n\nFor this project, we
    started with _fuzz tests_. In these tests, developers write an _entry point_ into
    their code that takes inputs, such that any input that causes a crash is a bug
    the authors care about. Then the _fuzzer,_ a testing engine, generates enormous
    numbers of semirandom and mutated inputs at the entry point to try to find a bug
    (visualized in Figure 1). The longer a fuzzer runs, the more bugs it can find.
    But this is inherently a brute-force process, with no guarantee of exercisin"
