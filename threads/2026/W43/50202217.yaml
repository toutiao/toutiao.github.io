  author: Chris_Newton
  text: "<i>I think somewhat of the opposite will actually occur. LLMs won’t formally
    verify LLM generated imperative style code. We (including agentic development)
    will move on from imperative languages, skipping functional and move to deterministic
    declarative languages.</i><p>I’m generally cautious&#x2F;sceptical about the current
    LLM hype, but if that did ever happen and it worked to a useful degree, it might
    truly be a significant advance. I’m not saying that just because of the LLMs themselves,
    though.<p>To reach that point, we would first need to overcome the classic problems
    in this area:<p>1. How can you specify the required behaviour for a system in
    precise detail without ending up with a specification language that is essentially
    another programming language with similar complexity to the ones we use today?<p>2.
    How do you solve the sufficiently smart compiler problem so that producing reasonably
    efficient and reliable implementations of those declarative specifications is
    not only viable but expected?<p>And then, if you still need someone (let’s call
    them a “developer”) to carefully specify the required behaviour of the system
    in detail, and you also know how to reliably generate a good implementation of
    a specification, how much value is left for LLMs to add in this picture?<p>Maybe
    LLMs really could be trained to reliably produce good implementations in that
    scenario? Never say never, but it seems more likely to me that we would develop
    deterministic algorithms for doing so. That’s already a very hard problem that
    a lot of smart people have explored, but if a solution could be found, most likely
    it would be strictly better than relying on LLMs in this part of the process.<p>Maybe
    there would still be a role for LLMs to convert natural language problem statements
    into specifications? Maybe for systems that don’t really matter, that would be
    enough and a big time saver. However, I’m sceptical about how much time it would
    be likely to save for systems that did need to work, where you would still need
    careful design and review of all the detailed specifications by developers anyway.<p>Maybe
    LLMs would end up in a similar role to the scaffolding tools that are popular
    in some ecosystems today, where you feed in some basic choices and the tool then
    produces a first pass at the files and code you might need, which you take as
    a starting point for the real work but without wasting so much time on boilerplate?
    That seems realistic and useful, but it’s a relatively small part of what would
    then be the overall development process.<p>In short, I would love for the existence
    of LLMs&#x2F;agents to push us towards those better programming languages and
    tool chains, but if that did ever happen, I wonder how much benefit LLMs&#x2F;agents
    could still offer once developers had the more powerful languages and tools available
    and could work at a “higher level of abstraction” themselves."
