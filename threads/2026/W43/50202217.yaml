  author: david-gpu
  text: "<i>&gt; how can you be truly sure that, when formally verifying a program,
    you have correctly modelled the software you’re trying to verify?</i><p>You can
    do it backwards. You declare the properties you want the resulting program&#x2F;function
    to have, using a proof assistant like Lean, then prove that a program exists that
    meets those requirements, and the proof assistant spits two things: a confirmation
    that the proof is valid, and a piece of code that implements the proof, in the
    form of computer code.<p>At least that&#x27;s how the proof assistant Coq would
    often be used. You still have the challenge of ensuring that you have defined
    the properties you <i>really</i> want in the first place, but at least it solves
    the part where you want the code to meet the specification."
