  author: skew-aberration
  text: Coming at it from another angle, we have historically made distributed systems
    manageable &#x2F; &#x27;verifiable&#x27; with RTOSs which give deterministic scheduling
    and locking primitives. We know that a task&#x27;s max duration is its uninterrupted
    duration + max duration of all higher priority tasks which could pre-empt it,
    and so on. Deterministic pre-emptive scheduling and locking alone could be enough
    to prove a lot of invariants without full temporal logic, and writing code in
    &#x27;RTOS logic&#x27; might be more natural for humans&#x2F;LLMs than the more
    expressive and powerful alternatives.
