  author: 3lambda
  text: |-
    Isn't this what Rust already does? I.e. the type of an integer literal without a type suffix is inferred by how it is used later.
    I am going to try an alternate design:


    Run a typing pass that types all integer expressions as Integer (an arbitrary precision integer).


    Compute constant values of expressions, using arbitrary precision arithmetic.


    Run a pass to refine the integer expression types from step 1 as follows:


    a. If an expression e was given a value v in step 2, then give e the type { v }. { v } is a subtype of every type that contains v as a value. For example, if v = 5, then { 5 } is a subtype of i8, u8, i32, u32, etc.
    b. Otherwise if e is an explicit conversion to type T, then e has type T
    c. Otherwise e has a type computed from its structure and a set of combination rules, e.g., U32 * U32 = U32
