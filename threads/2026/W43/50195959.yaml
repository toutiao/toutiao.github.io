  content: "[Back to Blog](/news/blog/)\n# Farewell, France\n\n![](/news/blog/au-revoir-france/french-announcement-image.png)\n\nWe
    have some news to share with you.\n\n## Summary\n\nStarting November 24, Quad9
    will no longer be able to offer its free cyberprotection service to users located
    in France.\n\nThe French courts yesterday handed down an [unfavorable ruling](/uploads/20261021_-_Jugement_selon_la_PAF.PDF)
    against Quad9 in a major case that undermines the transparency and stability of
    the internet. This decision in favor of beIN forces Quad9 to block the recursive
    DNS resolution for a number of domain names for users located in France.&nbsp;\n\nThe
    good news is the court significantly reduced the financial penalty, from €580,000
    to €1,000 per day. However, for Quad9, this has never been just a financial issue:
    it is a matter of principle.\n\nWe cannot comply with this ruling over the long
    term while remaining faithful to our mission to protect your privacy, defend you
    against cyber threats, and preserve the integrity of the internet. For us, recursive
    DNS resolution is a neutral and passive service. We categorically refuse to alter
    or lie to you about the DNS responses you receive in a way that opposes your expectations.\n\nThis
    ruling forces an untenable position upon us. Compliance is technically unfeasible,
    and implementation directly contradicts our mandate to serve the public. As a
    result, we have made the difficult decision **to withdraw Quad9 services from
    France as of Tuesday, November 24.** We deeply regret that French internet users
    will be left without an alternative that can adequately protect their cybersecurity
    while remaining compliant with European privacy law.\n\n## Background\n\nbeIN,
    a Qatari company with offices in France, previously sought to force Quad9 to block
    resolution for a set of domain names they assert are participating in copyright
    infringement of its audiovisual rights on sports event broadcasts. Quad9 has no
    association with these domain names, nor with the operators of the websites. The
    French courts have fundamentally misunderstood the working of the internet and
    the role of the domain name system and have allowed a financial penalty to apply
    to Quad9 if we do not block DNS responses to users in France.\n\nQuad9 is a Swiss
    public-benefit, nonprofit foundation established for the explicit purpose of protecting
    the cybersecurity of internet users. We charge nothing for our service and serve
    all people and organizations which seek to improve the security and privacy of
    their internet use. Our core values are to make privacy, security, and integrity
    available to all internet users, and our mission is to universally apply these
    guiding principles to recursive DNS resolution services in order to serve end
    users.&nbsp;\n\nWe want to be very clear: we do not condone content piracy. Quad9
    exists to create a safer, more trustworthy internet experience for end users.
    We offer global blocking as an option for malicious cyberactivity against users
    worldwide. We do not block content, and we give users the choice to use our threat
    blocking services, or not, based on their interests and needs. Content piracy
    needs to be dealt with at the source: the place where the infringing content is
    published. Forcing uninvolved third parties to break the fundamental operating
    principles of the internet to benefit individual parties to the detriment of the
    global internet-using public is misguided, counter-productive, and distracts from
    actual solutions addressing the hosting of the content directly, or the market
    pressures which cause piracy to exist in the first place. Not only are DNS recursive
    resolvers, like Quad9, the wrong actors to address piracy, but applying legal
    pressure to Quad9 will also have vast unintended consequences harming the cybersecurity
    of hundreds of millions of innocent internet users.\n\nFor Quad9, complying with
    this ruling is impossible. We have no database of users associating them with
    jurisdictions. Our service is free to the public and does not require sign-up
    or proof of identity. Recursive DNS is so fundamental to the underlying operation
    of the internet that there is no method to map users’ jurisdictions reliably,
    nor do we think there should be a way to force users to identify themselves before
    they can connect to the internet. Our core goals – privacy of user data and honesty
    of responses - are directly opposed to the methods necessary to implement the
    blocking this court ruling would require us to perform. There is no way we can
    determine which users this ruling applies to – we have no list of French users,
    because we do not keep dossiers of our users at all.\n\nIf we do not comply, we
    will face a daily penalty of 1.000 euros until the blocking concludes on November
    14 (i.e., 24.000 euros) not including our legal defense. Quad9 cannot survive
    the accumulation of penalties yet to be assessed in 20 other pending cases, nor
    those of future cases similar to the one brought by beIN. Inaction is, therefore,
    not an option to challenge this decision.\n\n## Can Quad9 just comply via global
    blocking?\n\nWe could add these names to our global malicious domain blocking
    database, which is what we use to provide internet users with malware and phishing
    protection. This is a single, monolithic set of names applied to all users of
    our protective services (9.9.9.9 & secondaries) globally but not to our nonprotective
    services (9.9.9.10 & secondaries). Blocking these names for all users globally
    would satisfy the requirements of the court.&nbsp;\n\nHowever, this would have
    the “extraterritorial” effect of applying French legal decisions to every internet
    user worldwide, when they are meant to solely apply to France, for the commercial
    benefit of a single private, foreign-owned company. We suspect if other nations
    wished to impose their national legislation within France, there would be a strong
    reaction from French users and authorities. The converse is equally true: the
    findings of a French court are not applicable to the rest of the world. Such a
    system would set a precedent that any nation could impose their laws, morals,
    economic demands, or social constructs upon any other nation by the means of blocking
    DNS names, and thus blocking communication and content.&nbsp;\n\nTherefore, this
    global blocking method is entirely unworkable for us as a solution to be compliant
    with the court order.\n\n## What is “France” from the perspective of the internet?\n\nThere
    are more important reasons geoIP blocking will not work. We already prevailed
    in a similar legal case in Germany in 2021-2023 in which we learned an important
    lesson: we tried to use geoIP blocking as a “hack” in a similar circumstance at
    the start of the legal proceedings, allowing us to continue services in Germany
    until the case concluded. The plaintiff (Sony Music Entertainment GmbH) then used
    a VPN to access the blocked content from Germany in circumvention of the geoIP
    blocking. The court agreed with Sony in their assertions of noncompliance, and
    we were fined for contempt of court.&nbsp;\n\nFrom this experience, we know that
    the geoIP-based model is not only unfit from a technical perspective, but we have
    proven, historical evidence that using geoIP methods results in fines being levied
    against us by courts. To any technology-aware person, this seems absurd and outrageous
    – but this is what we face in these lawsuits where there is a disconnect between
    the courts’ understanding and how (and why) the technical protocols of the internet
    actually operate. We cannot risk this negative outcome in this or any other future
    instance, as absurd decisions apparently are de rigueur in these cases.\n\nWe
    eventually [won that case against Sony](https://quad9.net/news/blog/quad9-turns-the-sony-case-around-in-dresden/),
    but it took several years, six figures of cost to Quad9, and massive wasted time
    – all of which set us back in our ability to deliver services and is a resource
    debt we are still paying for today. This case "
