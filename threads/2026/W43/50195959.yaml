    on them).<p>&gt; And somehow people have come to believe that without it, creation
    will cease.<p>Come on, you&#x27;re being black and white about it? Without copyright,
    will it stop? No. Will it change, for the worse? Probably. More paid for and catering
    to the whims of the wealthy, far less &quot;middle class&quot; creation, and almost
    no &quot;middle class&quot; <i>professional</i> creation, etc."
