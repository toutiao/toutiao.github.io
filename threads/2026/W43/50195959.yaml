  author: betterunix2
  text: Copyright has <i>never</i> existed for the benefit of authors, and anyone
    who authors a scientific paper knows this.  Copyright has always benefited the
    publishing industry and was established at the request of publishers in the first
    place, after they lost the monopoly they had under the previous censorship regime
    (the &quot;star chamber&quot;).  Authors receive at best a small fraction of the
    sales of their work and most authors never receive enough compensation to actually
    live on, hence the expression &quot;don&#x27;t quit your day job.&quot;<p>At this
    point copyright is an obsolete system.  It was set up at a time when large-scale
    copying required an industrial operation, and that is simply not the reality of
    the world anymore.  We do not need to &quot;reform&quot; copyright, we need to
    build a brand new system that is more reflective of modern technology.  Maybe
    that new system will actually focus on compensating authors as there is no need
    for a publishing industry, or maybe we will just accept that authors are not guaranteed
    any payment for their work and will have to make money some other way.
