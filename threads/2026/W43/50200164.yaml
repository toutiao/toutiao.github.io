  author: rudedogg
  text: "&gt; Which GUI toolkits over internet do you refer to?<p>My point is there
    is no GUI toolkit for the browser and there should be. They should stop trying
    to morph the <i>document</i> object model into a platform for delivering applications,
    let it do documents, and give us something else&#x2F;new. It&#x27;d also be the
    proper path to the new thing having accessibility support. Instead people raw-dog
    the GPU for UI and you get no screenreader support.<p>What they&#x27;re doing
    here is a half-assed attempt: letting people draw but using the DOM for accessibility.
    The worst of both worlds I guess?<p>Our only hope is for AI to supplant screen
