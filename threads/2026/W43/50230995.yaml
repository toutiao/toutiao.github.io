  author: hliyan
  text: Perhaps this is where the question of &quot;what is a human right?&quot; becomes
    important. A human right is not where you are automatically entitled to the thing
    in question (e.g. food, water, education), but where no entity can prevent you
    from your pursuit of the thing. Whether the thing qualifies as a human right depends
    on whether a human can function in society without it. In the earliest, most basic
    societies, food and water qualified, but not necessarily education, clothing or
    even permanent housing. Fast forward to the twenty first century, I think now
    electricity, internet and access to the financial system qualifies. Perhaps in
    the future, access to machine learning models would qualify too.
