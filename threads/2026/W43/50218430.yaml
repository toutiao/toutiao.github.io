  author: damowangcy
  text: I think this is what the whole &quot;AI killed software&quot; fallacy came
    from.<p>&gt;nearly the same amount of effort to post a complaint you can delegate
    the task of reproducing the issue, diagnosing the root cause, and proposing a
    fix.<p>Is the effort the same though?<p>And even it is the same, making a meaningful
    contribution to an open source project doesn&#x27;t mean just fixing your problem,
    but you also need to stay in line with the contribution guidelines, the project&#x27;s
    direction and many more, which takes much more effort than just vibe coding a
    version for yourself.<p>Building software for one and for a bunch are two different
    things. AI is good at the former and can be used for the later but not without
    much effort. Models will get better, true, but that doesn&#x27;t mean we need
    less engineering, in fact we need more to stay up-to-pace with AI. Imagine everyone
    submitting a PR to fix a bug, how fast can you review it manually? And if you
    use AI to review&#x2F;verify them, the cost just shift from person who submitted
    the PR to the open source maintainer.<p>That doesn&#x27;t mean AI is bad but that
    we need new systems and rules.
