    # OBS Studio 33.0.0

    # Choose a tag to compare

    ## Sorry, something went wrong.

    ## Sorry, something went wrong.

    ### Uh oh!

    There was an error while loading. Please reload this page.

    ## No results found

    ## 33.0 New Features

    - Updated CEF from 127/6533 to 150/7871 [WizardCM] (#13900) This is a massive update to the underlying framework used for browser sources and docks from the July 2024 release to September 2026 All of this work is on the backend and should be invisible to users. Please be sure to report any new weirdness or problems you run into with browser sources!

    - This is a massive update to the underlying framework used for browser sources and docks from the July 2024 release to September 2026

    - All of this work is on the backend and should be invisible to users. Please be sure to report any new weirdness or problems you run into with browser sources!

    - Complete overhaul to plugin loading [FiniteSingularity/PatTheMav] (#13594) First-party plugins are now in a new folder named core Third-party plugins have an updated installation location and folder structure Existing third-party plugins will continue to load from the legacy locations until OBS Studio 34.0 More information is available in our knowledge base article

    - First-party plugins are now in a new folder named core

    - Third-party plugins have an updated installation location and folder structure

    - Existing third-party plugins will continue to load from the legacy locations until OBS Studio 34.0

    - More information is available in our knowledge base article

    - Improved how source snapping works in the preview [Warchamp7] (#12298) New visual indicator added Sources now snap along the entire axis instead of only when directly touching Sources no longer snap to hidden sources

    - New visual indicator added

    - Sources now snap along the entire axis instead of only when directly touching

    - Sources no longer snap to hidden sources

    - Improved behavior of spinboxes for number values [Warchamp7] (#12337) Typing is no longer mysteriously blocked in some situations Numbers are no longer cut off in some situations Values now update only after pressing Enter and Enter does not close the window Holding Shift + Up/Down now advances multiple steps at a time Dragging the cursor inside the input but outside the text itself now works properly

    - Typing is no longer mysteriously blocked in some situations

    - Numbers are no longer cut off in some situations

    - Values now update only after pressing Enter and Enter does not close the window

    - Holding Shift + Up/Down now advances multiple steps at a time

    - Dragging the cursor inside the input but outside the text itself now works properly

    - Enabled NVENC on Arm64 [RytoEX] (#13827)

    ## 33.0 Changes

    - Added a check for encoders being missing when loading a profile [derrod] (#11340)

    - Added support for newest NVIDIA Broadcast SDKs for NVIDIA Audio Effects and Video Effects [pkviet] (#13838)

    - Added hotkeys for controlling audio monitoring of a source [Warchamp7] (#13599)

    - Changed Safe Mode to not start WebSocket Server [FiniteSingularity/RytoEX] (#13984)

    - Fixed issues with groups in Studio Mode [Warchamp7] (#11092) Fixed moving sources inside a group causing them to glitch out in Program Fixed moving sources inside a group showing up live in Program

    - Fixed moving sources inside a group causing them to glitch out in Program

    - Fixed moving sources inside a group showing up live in Program

