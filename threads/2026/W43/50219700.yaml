  author: jacquesm
  text: I put it together myself. It was a lot of work and I learned a lot of nasty
    lessons along the way. The short version of the recipe:<p>- get the largest PSU
    you can find (1500W at a minimum, more is better)<p>- get the ADT PLX Quad PCIe
    backplane. Run 4 thin (single slot) GPUs inside your main enclosure, stick the
    ADT interface board in between two of the thin boards (don&#x27;t stack them close
    to each other or they won&#x27;t be able to breathe).<p>- ensure you have as much
    or more RAM as you do VRAM<p>- Ensure your CPU has enough PCIe lanes to run at
    least five boards in x16 (four for the GPUs in the main enclosure, another for
    the PLX PCIe switch)<p>- In the BIOS set BAR1 to &#x27;resizable&#x27; and &gt;
    4G decoding should be enabled.<p>- ditch the cables that come with the ADT board,
    they may work but there are much better ones out there and they&#x27;re not expensive,
    this will save you days of troubleshooting<p>- Build your own enclosure rather
    than trying to adapt a standard one, it won&#x27;t work anyway (the board pitch
    is wrong, as is the placement of the mounting holes).<p>- Put another four double
    or triple boards on the backplane.<p>- Add another 3x 140 mm fan to the front
    of the case so you get good airflow without the feeling of being next to a Harrier
    at take-off<p>- I used 3D printed parts to mount the PSU and the board as well
    as the fans (see below).<p>- Make sure the board is properly grounded to the enclosure<p>-
    If you&#x27;re running 3090&#x27;s or other cards that are P2P capable that were
    hobbled by NV then look at this <a href="https:&#x2F;&#x2F;github.com&#x2F;aikitoria&#x2F;open-gpu-kernel-modules"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;aikitoria&#x2F;open-gpu-kernel-modules</a>
    driver module.<p>- Power on the ADT board, wait three seconds then power on the
    main machine. Enjoy your VRAM :)<p>If you have more questions please email me
    and I&#x27;ll be happy to help out.
