  author: Zagitta
  text: |-
    It&#x27;s quite nuanced. In a nutshell the unlock just flips the 2 bits that halves how often the core can issue the specific instructions Nvidia locks to full rate on the professional and datacenter cards.<p>Obviously doing more compute requires more power but what it does is shift the card down on the frequency curve to keep the wattage in check.
    So you&#x27;re right that at stock power limits it hits a cap where the full issuing rate isn&#x27;t reached but it depends heavily on the exact workload how much juice is left.<p>The frequency curve also takes heat into account so in general you end up with a nice perf boost for a slightly hotter card.<p>I&#x27;ve been running this on my 2 3090s for a month now with no issues but they are also water cooled :-)
  score: 0
