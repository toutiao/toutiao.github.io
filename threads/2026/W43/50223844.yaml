  author: impizulu
  text: 100%. Most people are not programmers. Most people do not see software as
    something interesting to figure out. It&#x27;s just a tool for them to do their
    job.<p>To get the average office worker to want to switch, you not only have to
    provide a finished product that works smoothly, but also one that feels familiar.
    Most office workers grind through their day doing repetitive tasks in familiar
    software they have been using for a decade. When the top of the food chain says
    they are overhauling the entire software suite that people have been grown accustomed
    to for their entire career, the new software better have real benefits that incentivise
    employees to actually engage with learning it. Otherwise productivity will simply
    crater.<p>Most office workers do not care to learn new software. They just want
    to get on with their job. For better or for worse. But if you can demonstrate
    a switch will make their lives easier and the UI UX of the new software is very
    familiar and intuitive (and it actually works) you may be able to pull off a clean
    switch and keep your employees happy.<p>An MVP is fine but I think it&#x27;s crucial
    that the UI UX is very similar to the software that it is replacing because it
    means people don&#x27;t have to relearn whatever habits they have developed over
    the years in the old stack. I think that&#x27;s what creates the most resistance
    to change.
