  author: ochrist
  text: |-
    Full Danish text here:<p>I al stilhed har Digitaliseringsministeriet droppet sit ellers meget omtalte pilotprojekt med et open souce-baseret alternativ til Microsofts Office-pakke, som ministeriet ellers anvender i stor stil.<p>Projektet blev søsat i sommeren 2025, da knap 40 medarbejdere i ministeriet gik i gang med at teste open source-systemet Collabora som alternativ til Office. Systemet blev dengang leveret af danske cBrain.<p>Dengang sagde daværende digitaliseringsminister Caroline Stage (M), at pilotprojektet var et &#x27;kærkomment skridt i den rigtige retning&#x27; frem mod at frigøre sig fra afhængigheden af Microsoft opg at hun ønskede at hendes ministerie skulle være spydspids for frigørelsen fra amerikansk teknologi.
    Det kan du læse mere om her: Her er den løsning, som skal erstatte Microsoft Office for alle medarbejdere i Digitaliseringsministeriet<p>Nu meddeler en pressemedarbejder til Version2, at projektet blev droppet, da der blev udskrevet valg i foråret.<p>Og der er ingen planer om at genoptage det, hedder det. Projektet er ikke blevet evalueret som det ellers var planen.<p>Og det ærger professor Mikkel Flyverbom fra CBS.<p>&quot;Det er en fin ide at afprøve alternativer i et pilotprojekt. Jeg ville dog ønske, at ministeriet benyttede muligheden for at lære af pilotprojektet og dele de erfaringer med andre dele af den offentlige sektor,&quot; skriver han i en mail til mediet.<p>Digitaliseringsministeriets departement er i dag lagt sammen med andre ministerier, så ministeriet i dag hedder Forsknings-, Uddannelses-, og Digitaliseringsminister med Christina Egelund som minister.<p>Med afslutning ved valgudskrivelsen i slutningen af februar 2026 nåede open source-piloten kun at være i luften i godt et halvt års tid.<p>Pilotprojektet koblede Collabora ind i ministeriets centrale sagsbehandlingssystem, F2, der leveres af danske cBrain, og det var planen, at de 38 test-ansatte allerede fra første dag skulle udarbejde ministeriets dokumenter, præsentationer og tabeller uden Microsofts Word, PowerPoint og Excel.<p>Særligt funktioner som ’track changes’ og konvertering mellem Microsoft-formater og open source-formater bliver noget af det, ministeriet vil arbejde med i testperioden, hed det dengang.<p>Pilotprojektet skulle afklare, om britiske Collabora overhovedet kunne understøtte ministeriets arbejdsgange og behov på tilfredsstillende vis. Det står i dag uklart, om det har været tilfældet, da projektet ikke er blevet evalueret.<p>Der var dog flere historier fremme om, at Collabora-projektet havde ført til visse frustrationer blandt ministeriet ansatte.<p>Blandt andet har der været med formateringer af typografier, afsnitsformateringer, blanke sider og udfordringer med track changes.
