  text: |-
    Agreed, and I can back up your numbers on JSON. For my streaming implementation of simdjson, per-source throughput tops out in the 4-5GB/s range, and that's pulling all the stops, using many threads inefficiently on a single source. Using a single thread efficiently, you're down to the 2-3GB/s range.
    If your data fits entirely in RAM and is already loaded, you can get better throughput while using threads efficiently (as the original simdjson does), and if you know that your data is valid NDJSON on top of that, then you can meaningfully parallelize and crack 10+GB/s, but you need to throw a bunch of threads at the problem under very particular conditions before the problem is meaningfully I/O-bound on a modern SSD.
    Last I was aware simdjson still did tape building and tape walking in separate steps, though the On-Demand variant API lets you build the tape progressively, without requiring the source file be all in memory up front.
    On most hardware, this problem (at least the non-NDJSON streaming version) is actually bottlenecked on the SIMD: the lanes aren't wide enough. I got an experimental version of this running on a discrete GPU, simulating super-wide lanes (give or take some hacks to the classification algorithm), which is I/O-bound... but on the PCIE bridge, not on memory->RAM, the throughput on a T4 wasn't high enough (6GB/s each way IIRC). I haven't gotten it working on an integrated GPU yet, but once I do, I expect it will still be CPU-bound, just on the bitwalking+parsing step rather than byte classification.
