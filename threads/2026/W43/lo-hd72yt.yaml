    Yes.  And even on servers it really hasn't been true for a while.  SSDs are fast, and even the I/O paths of many programs are actually CPU-bound.
    Case in point:   mkfile(8).  A program that does nothing except write zeros to disk.  CPU-bound on macOS.  And not by a little bit either.
    mkfile(8) is severely syscall limited on OS X
    Case in point:   reading JSON.  I noticed that when doing some measuring on our Wunderlist iOS and macOS clients.  The I/O was not I/O bound.  It was CPU bound.  I was surprised.
    Side note:  talking about or acting on performance without measurements is usually pointless and leads to comically wrong results like the ones in this blog post.
    Swift, a language some consider "fast" managed JSON parsing at a blazing 10 MB/s for its built-in mechanism, which people who didn't measure thought was fast.  With a less braindead design and Objective-C instead of Swift, I got to around 200MB/s, which was close to the pure rate of object allocation.  Even the SSD at the time did 2 GB/s, so 10x what I managed and 200x what Swift did out of the box.  So 99.5% CPU, 0.5% I/O for Swift.  90% CPU and 10% I/O for me.
    Somewhat Less Lethargic JSON Support for iOS/macOS, Part 1: The Status Quo
    This discrepancy was also what "inspired" David Lemire to create the fantastic simdjson library, which does actually manage to make things I/O-bound, but at that time at the cost of not offering a direct object-generation hook.  So you had to first parse the entire file to an intermediate representation and then walk that to get your objects.  I haven't checked whether that is still the case.
