    Python has entered the chat

    This comment is meant to be flippant and meant to be a joke, but I think it's worth hearing a bit from the cohort of Python users who are very performance sensitive—those of us who do data analysis or numerical computing.
    Codes that rely on NumPy are often dismissively viewed as just “bolting” C onto Python, and the performance of the resulting system is, in my view, incorrectly attributed wholly to the capabilities of C. This really underestimates the amount of (evolved) “design” in these systems.
    This is why I have maintained that the “restricted computation domain” formulation is useful when thinking about these systems. The idea that the “heavy lifting” or “number crunching” gets delegated to some C or Fortran codes (e.g., the aforementioned NumPy,) while the “programme structuring” or “business logic” happens within Python is an interesting but not particularly deep observation.
    I don't think there's is much debate over whether Python semantics provide the ability to express information currently necessary to achieve performance on contemporary hardware—the deliberate choices (e.g., automatic integer promotion) and the missing pieces (e.g., control over memory layout) are quite well-documented. It remains to be seen whether these can be inferred or otherwise synthesised through code improvements (e.g., reducing the number of C-level stack frames required to perform a Python-level function call) and JIT (which, as I understand from talking to the core developers, has been successful in some benchmarks but has introduced some other undesirably complexity) and other approaches but, historically, the CPython interpreter just hasn't been particularly fast at doing some fundamental operations.
    Where the “restricted computation domain” formulation goes beyond simpler descriptions of Python as a glue language or observations that limitations in Python force heterogeneous computation (i.e., some in Python, some lower,) is that these entities require a significant amount of design to actually work. While a lot of the popular tools did not undergo a particularly extensive or deliberate design process, there were evolutionary factors at play that forced them to be mostly effective at encoding computations. However, it is actually not uncommon to “fall out” of the design of these tools.
    For example, I spoke some years ago at PyData Amsterdam about “group-weighted summary statistics” (e.g., group-weighted standard deviation or z-transform with high cardinality of groups) using the popular pandas DataFrame library. From the most naïve approach using just pandas to a very contorted approach using just pandas to an approach relying on cython, I recall getting a 1× → 10× → 100× improvements. Similarly, when talking about developing simulators with Python and pandas, we must contend with computations that cannot readily be encoded into the tools themselves, and given the (polarised or dichotomous in nature) heterogeneity of these tools and the degree to which they cannot readily be decomposed, we end up having little choice but to accept the subsequent contortions.
    All of this is to say… I genuinely simultaneously believe that:

    Python today is faster than Python was yesterday
    many fundamental operations may never be fast in Python
    naïve approaches (i.e., unaware of the designs discussed above) may inevitably lead to slow programmes
    the non-naïve approach does require design and is generally tenable without extraördinary effort
    a system that undergoes said design may be as fast or faster than an equivalent system in, say, C++ (and that other factors of C++ may contribute to this likelihood)

    In fact, regarding the last point, a common refrain on a recent simulator project I worked on was that, if we had been involved in the original writing of that system, we could have written it in Python (and, of course, with C or Cython or C++ or Rust or Zig,) and it would have been easier to extend, debug, less code overall, and at least an order of magnitude faster if we had taken a naïve approach (and maybe even two or three orders of magnitude faster with a little sophistication…!!)
    That means that I both agree and disagree with the thesis of this post. Python, as a language, doesn't lend itself to being fast. Many Python programmes are not fast. Some or even many Python programmes are not fast, and gain nothing from using Python, where a line-for-line rewriting of them in another language would be faster. But the use of Python does not inevitably lead to systems that are slow, and, in fact, the necessary design to produce fast systems in Python may not (in terms of smarts and efforts and luck) be significantly more than what is necessary to achieve the same in, say, C++.
