  text: |-
    I don't think this is correct.
    Changes to implementation can absolutely have big effects on performance within a single language. CPython gets faster with most new version as the interpreter and the standard library improve, and you can step out CPython into Jython, or IronPython, or JITted PyPy, and see very different performance characteristics while remaining recognizably the same language. We might even conceive of an OCaml-like dual interpreter/compiler that can do both.
    But there are differences in language semantics which mere implementation details can't bridge.
    A language whose semantics include loose or dynamic typing will place restrictions on the implementation that will reduce performance. A language whose semantics relies on dynamic dispatch without the ability to monomorphize will see unavoidable overhead. A language which abstracts away memory allocation takes a lot of optimization tools away from the program author, etc.
    Changes to core language semantics like these would be extremely disruptive even in a whole-version migration breaking backwards compatibility. Adding required static typing to a dynamic language or manual memory management to a previously GC'ed language would be such a large difference that you almost certainly can't call it the same language before and after.
    You can of course write extensions in faster languages, but at that point you're deliberately stepping outside your language's established semantics because you've acknowledged that they're too restrictive or insufficiently powerful to achieve your goals.
    So I don't agree that slow languages don't exist. By virtue of their core semantics and the abstractions they aim to provide to the program author, all programming languages limit the performance they can deliver even with an ideal implementation.
