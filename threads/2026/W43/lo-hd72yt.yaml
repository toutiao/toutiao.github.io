  text: |-
    A language whose semantics relies on dynamic dispatch without the ability to monomorphize will see unavoidable overhead.

    I’m not sure there are languages that really can’t be monomorphized. In principle someone could implement such a dynamic language with a Self-style JIT that dynamically monomorphizes, so the code can be optimized to perform as well as static dispatch. But I suppose the JIT itself is unavoidable overhead :-)
    Also, a dynamic language’s design can make it easier to monomorphize, by making it clear when the metalevel is being mutated (things like class definitions) and when those mutations take effect. But that kind of design is relatively rare: CLOS is designed that way, and I think Java too (tho Java relies more on dynamic reoptimization than CLOS).

    A language which abstracts away memory allocation takes a lot of optimization tools away from the program author, etc.

    Yeah, but I’d say memory layout is more important than allocation: if a program can control when subobjects are embedded in other objects and in arrays, and isn’t required to refer to them indirectly, then it’s easier to get better memory performance. This is one of the big advantages of Golang relative to Java. And project Valhalla, adding value types to Java, has taken many years of careful work to avoid being disruptive.
    Data structure layout at a high level (how objects relate to each other, as opposed to the internal layouts of objects) is in almost all languages controlled by the programmer. Language semantics usually don’t allow data layouts to be changed by optimizers because it’s prevented by features like object identity and mutability and aliasing. So I think data layout is the primary thing that determines whether a language is “fast” in the sense of being able to get the most out of the hardware (assuming it isn’t held back by a slow implementation).
