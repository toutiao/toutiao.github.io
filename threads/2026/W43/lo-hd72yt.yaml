    And "O(1)" algorithms are actually roughly O(sqrt(n))

    One of the beefs I had with big-O when I was introduced to it in my CS classes in the 90s was that, as commonly practiced, it papers over some significant costs. Like a sorting algorithm that's presented as O(n log n) only has that complexity if comparing two elements is a constant-time operation, which it isn't if you're, say, comparing arbitrary-length strings that can have common prefixes.
    My college roommate and I invented a variant on radix sort for linked lists of variable-length values (by accident; neither of us had learned about any existing radix sort algorithms yet) and we were frustrated that using the analysis techniques we'd learned in class, it was an O(n) sorting algorithm, but the actual execution time clearly depended on the lengths of the values, not just the number of values.
    I realize some of that is just "we give undergrads the simplified version" but I'd wager most people who learned big-O at all didn't learn about the more sophisticated, comprehensive approach to it.
