    Totally agree. I have used C# on nearly every project I've done for the past 10 years (when it got good Linux support). While there has certainly been dumb moves by me that have caused slowness per request, in general I never think much about scaling, even at very high rps. Some of this is certainly experience in design but a lot (most?) of it comes from a framework that is fast (in general C# is as fast or faster than golang, if you wondered what I was talking about!).
    I then get called in to help speed up $DYNAMIC_LANGUAGE and it's often a total horror show, with dozens of app servers maxxing CPU and memory, constant fire fighting of load based outages, and complicated layered caching structures which cause weird edge cases.
    In general the core issue imo is that ruby, python, node et al do not handle threads efficiently. Back in the day, this wasn't much of an issue, you may have 1, 2 or maybe 4 CPUs on a server. Now you have 16 cores on a cheap phone. So you end up having to run lots of separate processes to take advantage of the hardware.
    You then put on top of this in general they have far higher RAM usage per process because they are not compiled, and before you know it you are using 10x the RAM. And because you are using 10x the RAM you get constant GC events which starts burning all the CPU .
    Then you just rewrite it in a statically typed languages with a good threading model and suddenly the same app is barely using 10% of your only app servers CPU. I've seen it so many times.
