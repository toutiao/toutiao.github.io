    I'll raise one point of disagreement with this post: I don't think 'writing in a slow higher-level language can make it much easier to optimize the code, because you can see at a glance what the program is doing.'
    That would certainly be the case with a program written in assembly, and likely also in C, but I'm now sure if that can be attributed to them being 'low level'.
    But my issues with optimizing programs in higher level languages, generally Python, is that I wind up wrestling with the language or packages to figure out what's actually happening under the high-level abstractions. I've also found that the designs encouraged by higher-level languages, especially with lots of inherited classes and indirection and spooky action at a distance, tends to make the overall structure of the program more confusing (I'm looking at you, Julia!) and things like rereading the same file thousands of times in a loop instead of once can sneak in more easily.
    I would attribute the difficulties more to dynamic typing/poor type systems and runtime dispatch that can't be checked at compile time.
    I also find that, when understanding and fixing the bad design of an existing program in a higher-level language, rewriting (parts of) the program to a language that offers more low-level visibility is a great help in untangling the design and figuring out the data flow. I find that Rust is generally a good fit for this, since you can move very quickly between low level control and high level abstraction, and the ownership system highlights tangled dependencies.
