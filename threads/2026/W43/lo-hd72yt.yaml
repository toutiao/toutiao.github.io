    One of the beefs I had with big-O when I was introduced to it in my CS classes in the 90s was that, as commonly practiced, it papers over some significant costs.

    (From below.)
    When I first encountered “big-O,” it was presented in the context of Bachmann-Landau notation as a mathematical tool for characterising the behaviour of mathematical functions that had practical applications as a tool to understanding the performance of a computer programme.
    From this perspective, it seems obvious that there is a considerable amount of judgement necessary to employ the tool to support decision-making. The limitations of this tool (e.g., the practical consequence of ignoring constant factors) was discussed quite thoroughly, but it seems fairly obvious that there is a high degree of abstraction inherent to any discussion of performance, and no single analytical tool or metric can, in isolation, justify a decision in the human world. (Human existence, and the universe we inhabit, is simply too infinitely profound.)
    As a result, while I think details like cache memory and branch prediction are very worthwhile to consider, I'm not sure they detract from the value of the “big-O” as a tool, since we have never been able to justify statements like “this is better than that, because O(n) is better than O(n²).”

    aren't as simple as they were in the 90s

    I am reminded of a scene from David Hare's Turks & Caicos:

    MAITLIS [Kobna Holdbrook-Smith]: Because that's the way of things now. Mr Eliott [Bill Nighy], I used to be able to open the bonnet, take out a wrench, and fix my car. Now I'd need a degree in electronics. Even easy things are difficult now.

    Not only is the execution environment dramatically more complex and, thus, harder to analyse than it was in the 1990s, but more than a few codes written in the 1990s are still in use today.
    But I think this further reïterates both the usefulness of (and, of course, the limitations of) “big-O” as an analytical tool.
    If I were to write codes today that I expected to still be in use in twenty years, it would be impossible for me to account for future changes in execution environment. (e.g., if I write a lookup table to avoid a computation, because my CPU is slow, but then ten years on, my code is slower than if I had not done that, because my CPU is now faster than memory… well, what happens when this flips yet again sometime in the following decade?)
    As a mathematical formulation, the Bachmann-Landau functions are definitely less effective at justifying immediate decisions, but they may be more durably correct over time. Of course, we want these analyses to not merely be correct but also be useful, and we may find that to be the case if we can make confident predictions about the monotonic growth of the data.
    So, while I cannot, in any way, disagree that “big-O” is a very rough tool for qualifying the performance of a software programme, (I don't think it's any less rigorous than what people actually do and…) I think there are more obvious, more significant, and more consequential failings in how we support decision-making around performance.
