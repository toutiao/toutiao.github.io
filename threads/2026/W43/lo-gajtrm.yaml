    I use HashSet<u64, rapidhash::RapidHasher> in a bunch of hot loops (eg. set of visited nodes in a Breadth-First Search). Even with the extra restriction to keys <= 50B it's really hard to beat with custom structures.
    The best I came up, besides bit vectors, with is using Vec<HashSet<u32, rapidhash::RapidHasher>> by storing each value n as  n % (1<< 21) in the (n >> 21)th bucket (I have no idea why 21 gives the best perf). it saves half the memory (because we only store a u32 per value) but performance-wise it's only 5% faster.
    Right now, 30% of the runtime of a multi-day script is spent in contains() :(
