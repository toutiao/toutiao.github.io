  author: david_chisnall
  text: "It's also not always a clear-cut thing.  The hand-optimised version is not
    semantically identical, because it's now supporting closed-world types whereas
    the original was open-world.  This is fine if you're doing whole-program optimisation
    and not loading plugins.  LLVM can do this for C++, so probably could do the same
    for Rust.\nBut the real win comes from that conversion: it's a closed world, which
    means the call site is statically provably polymorphic not megamorphic.  And that
    composes with the fact that all of the implementations are 3-4 instructions, so
    inlining is a clear win.  Especially once you realise that CSE will unify the
    rectangle and triangle implementations, so you actually end up with something
    like two branches in the final version, possibly even one branch and a conditional
    move.  Something like (C-like pseudocode):\nif (tag_is_circle)\r\n{\r\n    result
    = PI * field0 * field0;\r\n}\r\nelse\r\n{\r\n   tmp = field0 * field1;\r\n   tmp1
    = tmp * 0.5;\r\n   // Conditional move\r\n   result = tag_is_triangle ? tmp1 :
    tmp;\r\n}\r\n\nThe initial check is a branch because most architectures don't
    have predicated loads (you could make this faster if you had a non-trapping load,
    otherwise the load of the second field may trap so has to be hidden behind a branch).\nBut
    the fact that this is slower for this specific example is misleading.  It's not
    removing the dynamic dispatch at execution time that makes it fast, it's the subsequent
    optimisation.  If you want to preserve the original semantics, then other implementations
    may be faster.\nThere is a good argument to be made that a source language can
    be faster if it doesn't mandate any of these implementation choices and, ideally,
    conveys enough information to allow the compiler to choose the right one.  Implementations
    of Smalltalk-family languages typically do this via profiling, but that may not
    show up in such a small benchmark."
