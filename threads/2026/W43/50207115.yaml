  author: thomashabets2
  text: It could lead to a mess, sure. But my favourite prompt on an LLM-untouched
    codebase is along the lines of &quot;find UB and other bugs. If the fix is less
    than 5 lines, fix it and commit it. One change per commit&quot;. Then I of course
    check the commit history before pushing.<p>My experience over the last couple
    of years with this type of prompt is that eventually you run out of bugs to find
    (meaning you reach &quot;I see what you mean, but I disagree&quot;).<p>And those
    fixes don&#x27;t cause messes.<p>And a new model may find something new, but not
    even remotely the volume seen the first time. This indicates to me that the supply
    of bugs is finite, and after this period of house cleaning, it should go down.<p>But
    anyway, a mess (decoherence) doesn&#x27;t necessarily mean an exploitable mess.<p>Reading
    that good article, I find myself thinking that we did not need LLMs to get decoherence
    in complex software or systems. At least LLMs don&#x27;t have personal fiefdoms,
    egos, and company politics adding to encouraging decoherence.
