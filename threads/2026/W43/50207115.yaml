  author: ninkendo
  text: "&gt; Once the majority of code is written by similar systems then the tide
    of critical bugs being found will slow down.<p>I don’t know if this necessarily
    follows. I repeatedly see that AI will write code, then you have it audit the
    code for security vulnerabilities, and it still finds them. Just because AI can
    find bugs doesn’t mean it will write bug-free code. AI’s know how to take shortcuts
    to achieve their goals, and do it all the time.<p>Yes, you can have another AI
    audit the first AI’s code, but in practice this doesn’t always happen, especially
    because once the human gets their hands on the finished product, they don’t always
    take the extra step to ensure it’s audited. This is particularly true because
    people seem to think “well the AI wrote it in the first place, why would it find
    its own bugs?”, ignoring that context is everything, and an AI being asked to
    find bugs is going to approach the code a lot differently than an AI tasked with
    adding features.<p>That’s not to say it’s not possible to set things up properly
    into multi-agent stages with QA and security as first-class phases of development…
    I only mean to say that it’s not automatically true that “AI can find bugs” implies
    “AI doesn’t produce bugs”."
