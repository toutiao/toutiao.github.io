article:
  url: https://drew.silcock.dev/blog/is-this-the-new-cyber-normal/
  title: Is this the new cyber normal? | Drew's Dev Blog
  fetch_status: success
  content: "[‹ Back to blog](/blog) \n\n \n \n  · 23 min read ·      \n \n# Is this
    the new cyber normal?\n \n [#security](/blog/tags/security)[#llms](/blog/tags/llms)
    · Discuss on [](https://news.ycombinator.com/item?id=50207115) \n \n \n \n\nThe
    last week has seen a flurry of severe and critical software vulnerabilities affecting
    thousands of major sites and sending people into a panic. What’s going on here,
    and what can we do about it?\n\n## The bugs\n\nIf we want to understand what’s
    going on in the world of software security at the moment, we need to understand
    what’s going on with all these bugs. I’m not a cybersecurity expert, so I’m going
    to link to external explanations instead of going into the gory technical details
    myself as these people are always going to do a better job at that.\n\n### PHP2Shell
    – [CVE-2026-109618](https://www.cve.org/CVERecord?id=CVE-2026-109618) and [CVE-2026-109619](https://www.cve.org/CVERecord?id=CVE-2026-109619)
    (a.k.a. “the big one in the news”)\n\nTwo different security teams, one from California
    security company Calif (as part of OpenAI’s “Patch the Planet” program) and another
    from Israeli-U.S. cloud security company Wiz (they’re part of Google Cloud, apparently),
    both found these two Remote Code Execution (RCE) bugs in PHP. They were both using
    frontier AI models (a.k.a. LLMs, specifically GPT-5.6 Sol/Gemini 4 Argon) to find
    these vulnerabilities and build the exploits.\n\nInterestingly, one of the bugs
    (CVE-2026-109618) was [found by a security audit](https://thephp.foundation/blog/2026/10/21/todays-php-security-release-and-how-were-strengthening-php-security/#a-first-external-audit-and-increased-security-focus)
    the PHP Foundation did in 2024 (funded by the [Sovereign Tech Agency](https://en.wikipedia.org/wiki/Sovereign_Tech_Agency)
    which is coincidentally one of the most interesting things happening in the open
    source space at the moment) but they basically ignored it because they had bigger
    concerns and couldn’t agree on a fix. The reasoning behind it was that no-one
    could really figure out how to create an actual exploit based on the theoretical
    issue.\n\nOne thing LLMs are very good at is taking a theoretical security vulnerability,
    even if that vulnerability is a vague description of what the issue could be,
    and building it into a full exploit. This has become a major issue in recent months
    as any notice of a security patch will immediately result in people pointing their
    LLMs at the codebase, whereupon the agents can very quickly read through diffs
    until they find something that looks like a security patch, then go backwards
    to the vulnerability it covers, and follow this all the way to an exploit.\n\nThis
    happens so fast, in fact, that at this point I think it is a reasonable that the
    moment you announce a security patch should be taken as a last possible date that
    the full exploit is _not_ being publicly or privately distributed.\n\nThis PHP2Shell
    (as it’s being marketed, vulnerabilities seem to come bundled with their own marketing
    departments now) is estimated to affect upwards of 70% of the internet, with thousands
    of websites from [Wikimedia Foundation](https://diff.wikimedia.org/2026/10/21/impact-of-php-vulnerabilities-on-wikimedia-tools-and-services/)
    to [DeviantArt](https://x.com/DeviantArt/status/2112874361824899085) to [much
    of the UK government and Japanese banking systems](https://www.independent.co.uk/tech/security/php-hack-cyber-attack-websites-down-b3071407.html)
    to [The Traitors BBC programme website](https://www.bbc.co.uk/news/live/ckgel5xp2xv9t?post=asset%3A65d8808b-d5fa-4ee3-aa16-42d183b15c95#post).
    Vulnerabilities do get found, but they don’t normally cause half the internet
    to shut their servers down, so what’s going on?\n\nTo understand this, let’s look
    at the [original post from the PHP Group](https://www.php.net/archive/2026.php#2026-10-20-1):\n\n![Screenshot
    of the PHP announcement \"Upcoming Critical PHP Security Release\", dated 20 Oct
    2026. It says the release is scheduled for Wednesday 21 October 2026 at 14:00
    UTC, that it fixes two critical vulnerabilities rated CVSS v4.0 9.2, and that
    full details will be published with the release.](/_astro/php-notice.ClEI-qpZ_Z1XKVaY.webp)\n\nSomeone
    called [petecooper](https://news.ycombinator.com/item?id=50193416) posted on [Hacker
    News](https://www.bleepingcomputer.com/news/security/php-warns-admins-of-two-critical-flaws-emergency-patches-coming-tomorrow/)
    [about the CVEs](https://news.ycombinator.com/item?id=50167754), apparently unaware
    that there even was an embargo. This (and other apparent leaks) prompted this
    hurried statement from the PHP Group and bringing the patch forward from Thursday
    22nd to Wednesday 21st. However, the patch still wasn’t going to be available
    till the next day. This unintentional leak included CVSS scores of 10.0 (i.e.
    _bad_, although weirdly the actual scores were 9.2 instead).\n\nPretty much immediately,
    this news spread like wildfire and people started panicking. Even though this
    was found by _“responsible security researchers”_ at _“respectable companies”_,
    by the time the security patch actually got released, it was [already being exploited
    in the wild](https://ellio.tech/en/blog/php2shell-what-we-observed-and-what-to-do/).
    The PHP Foundation [blamed Calif and a company called Chainguard](https://thephp.foundation/blog/2026/10/21/todays-php-security-release-and-how-were-strengthening-php-security/#leak-and-disrupted-disclosure)
    by saying that Calif leaked a video of the exploit in action (with weird background
    music and a dancing anime girl) while Chainguard published fixes 6 hours before
    the embargo was due to lift, both allowing attackers to beat the systems administrators
    to the punch. The timeline is confusing, but it seems like multiple interconnected
    things have gone wrong here, all within the space of about 17 hours.\n\nThere’s
    been lots of [discussion](https://news.ycombinator.com/item?id=50188948) about
    whether AI really is the game changer that completely revolutionises computer
    security or not. The big AI companies (and they [are big](https://www.wheresyoured.at/ai-had-better-work-out/))
    obviously want you to think that it is. [Some people](https://eliastaylor.com/noexploit/)
    argue that PHP2Shell is overblown because LLMs tend to be paranoid about vulnerabilities
    and come up with “exploits” that make bad assumptions (like that the server will
    run PHP code you upload yourself via some existing file inclusion vulnerability)
    or cheat in some way. As [LiveOverflow points out](https://www.youtube.com/watch?v=SP7y1h0laN0),
    LLMs make it very easy to create exploit slop that proves nothing and doesn’t
    work, but that doesn’t mean that the vulnerability isn’t real and easy to exploit
    using AI. You can have 10,000 bad slop exploits that don’t work but if there’s
    one that does, that’s all that matters. Maybe we just need to get used to wading
    through slop to find the important stuff now.\n\n[Others point out](https://news.ycombinator.com/item?id=50189820)
    that lots of governments ([UK](https://www.ncsc.gov.uk/news/critical-security-issue-affecting-php),
    [EU](https://cert.europa.eu/publications/security-advisories/2026-018), [Japan](https://x.com/takaichi_sanae/status/2112890642590564386),
    [USA](https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching))
    got overexcited and released urgent announcements saying everyone had to unplug
    their computers immediately, so people panicked. I think the reason everyone panicked
    is that everyone kind of knows that PHP is intensely insecure and they use it
    anyway, so they’re kind of primed for bad news and to overreact. Also, it actually
    is really quite bad, so maybe panicking is kind of the correct reaction?\n\nThe
    big takeaway for me from this is that – because of LLMs – the time from “hey I
    heard there’s a bad RCE in this project” to “there are sophisticated, automated,
    and concerted attacks using an exploit targeting this vulnerability” has gone
    from weeks/months "
