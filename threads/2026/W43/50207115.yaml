  author: pegasus
  text: 'I had in mind living systems, as most software systems of interest are: a
    perpetually moving target, continuously modified, expanded and refactored. Many
    of these systems are apparently now being polluted via careless and massive vibe-coding.<p>One
    thing to keep in mind is the logic of technological evolution and market competition
    will ensure that we always push the complexity of our systems to the edge of what
    is possible using current tools.<p>I don&#x27;t deny that coding agents can be
    (and are) very useful for software engineering, as you say they have a lot going
    for them, and I&#x27;m pretty sure that once the dust has settled, they will be
    seen as an intrinsic part of the process, but I also am convinced that skilled
    humans will still very much be needed to direct and supervise them.'
