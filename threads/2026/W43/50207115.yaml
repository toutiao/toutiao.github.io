  author: Flere-Imsaho
  text: "&gt; Not only this, a significant number of developers have stopped looking
    at code<p>This is what I find frustrating about the whole AI&#x2F;slop debate.
    Developers stopped looking at code a long time ago... Well before LLMs. Take for
    example a typical nodejs project with its 100s of dependencies. Is a developer
    going to look through the layers upon layers of code running their app? Of course
    not, there&#x27;s to much of it. We&#x27;ve seen supply chain attacks even this
    week.<p>Actually what I think will happen is that all those abstractions, dependencies
    will become irrelevant now that an LLM can just write custom code to solve the
    business problem. This will massively reduce the supply chain problem.<p>Then
    have LLMs dedicated to scanning codebases for security issues."
