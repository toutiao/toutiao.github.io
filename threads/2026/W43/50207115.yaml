  author: thomashabets2
  text: Vibe coding may produce a lot of code, but I&#x27;d say LLMs can already find
    more than 99% of bugs, and I extrapolate that they therefore won&#x27;t add them
    to living systems.<p>But even if new code gets bugs, we run a bug finding pass
    on the delta. So the vulnporalypse will end.<p>And in my prompts I&#x27;ve seen
    LLMs find complex interaction bugs that a human would basically never find (and
    the bug was added by a human).<p>You say polluted by vibe coding. But in terms
    of bugs, especially in the last like 6 months, you could argue that humans are
    the polluters.<p>E.g. while I&#x27;ve seen &quot;ai deleted our database&quot;,
    but if what you&#x27;re saying is true, we should be seeing &quot;AI added this
    buffer overflow&quot;. But we don&#x27;t, because humans are the polluters of
    that.<p>Yes, there have been &quot;ai coded up client side password checking&quot;,
    but I&#x27;ve not seen that recently. Only like 6 generations and three years
    ago.<p>At some point it&#x27;s like telling the cab driver to just follow Google
    maps directions. Like... sorry, cabbie (Black Cabs in London with their &quot;the
    Knowledge&quot; is what I&#x27;m thinking), your memorization, while impressive,
    is worse than the app.<p>The painter, while impressively skilled, is a worse documentarian
    than the camera.<p>And that point is probably behind us. At least for typing.
    And it&#x27;s climbing up in abstractions.
