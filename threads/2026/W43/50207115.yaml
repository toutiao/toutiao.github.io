- id: '50219189'
  parent_id: '50207450'
  author: Flere-Imsaho
  text: "&gt; because AI-generated code is kind of notoriously terrible at security.<p>This
    is simply not true, perhaps it was in the past but recent models are very capable...
    To the point that I trust them more than humans to write secure code.  It&#x27;s
    all about the prompting. Have a step in your development pipeline whereby an LLM
    scans, checks, audits your code. Make it a different model&#x2F;session from the
    LLM that wrote the code in the first place. Acts like an independent auditor."
  score: 0
