  author: ninkendo
  text: "&gt; it really comes down to whether humans or AI is more likely to take
    &#x27;shortcuts&#x27;?<p>That’s not the original claim though, the claim is that
    this “vulnpocalypse” is only temporary because AI will no longer produce the kind
    of code it’s finding issues with. If AI still takes shortcuts, but only marginally
    less than the humans it’s trained to imitate, we won’t get there.<p>You could
    speculate that a year from now the models will improve to always approach problems
    from multiple angles and bring in multiple sub-agents each tasked with red-teaming
    the resulting code, and that this will be done implicitly and automatically for
    all tasks… and maybe that will be what actually makes this prediction come true.
    But that’s speculation and not what we have now."
