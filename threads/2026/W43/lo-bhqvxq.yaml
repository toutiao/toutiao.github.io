    Yes, but you have to use file-backed mappings. Windows has a temp-file attribute that you can set that gives you swap-like behaviour (writes to memory are not required to be written back to disk ever, though they may be).
    Be a little careful on Windows though because this is the one place NT makes an exception to its ‘don’t make promises you can’t keep’ rule in the memory manager. Private (CoW) mappings of a file don’t count against your commit charge until you take the CoW fault. If there is no available commit, you get an exceptions (SEH or VEH).
