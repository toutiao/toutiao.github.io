  text: |-
    this is cool because regardless of the size of the initial allocation, the copy isn't taking up any physical memory

    The PTEs for the demand-mapped pages of the copy allocation take up physical memory at a rate of only 1/512 ~= 0.2% assuming all pages of the 2 MB range are mapped. But 0.2% is not 0%. And this overhead becomes 100% if there's only one mapped page in the 2 MB range. The same pattern repeats at the coarser scales of the page table, but the PTE level is usually what's worth thinking about if at all. The VmPTE metric for Linux processes counts the overhead at several levels.
    (The concrete numbers assume x86-64 and small pages.)
