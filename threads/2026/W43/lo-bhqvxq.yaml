    It has another benefit (or, at least, did.  I presume it still does). The region is fairly large and contains a bunch of pages in different places. This means it will often miss in the TLB. It turns out TLB misses on modern systems are not that bad if the page tables are all in cache, especially if they’re all in L1. XNU maps all of the read-only (including execute) shared region using the same page-table pages. The root of the page table in every macOS / iOS app has one entry that points to the same page. The page table walkers keep those pages in L1 so accessing them is faster.
    This alone, I’m told, gave a 1-10% performance improvement on app performance when they rolled it out.
    It’s a really neat trick. It’s a shame F/OSS ecosystems are so fragmented that there isn’t a common set of libraries that everyone would want. And things like Flatpack are making this worse by making it easier to ship different versions of the same libraries.
