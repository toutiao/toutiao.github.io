  author: Jeaye
  text: Hey folks. I&#x27;m the jank creator.<p>jank is a full Clojure dialect with
    unprecedented C++ interop. Unlike the OG Lisp&#x2F;C++ combo, Clasp, there is
    no bridge API necessary for registering C++ functions, types, or values. jank
    can seamlessly interop with any C++ by just including the headers. Interop includes
    template instantiations, overload resolution (implicit conversions, ADL, etc),
    exception throwing&#x2F;catching, virtual function calls, and literally everything
    else.<p>jank _is C++_, since it compiles to C++ and uses the C++ type system.
    It ships with a Clang-powered JIT C++ compiler to make all of the REPL goodies
    work. jank also improves upon the C++ build ecosystem with Cargo-like tooling.<p>This
    means you can use jank to make C++ native applications, you can embed jank into
    your C++ applications, or you can even use jank to just write portable Clojure
    libraries that people use from other Clojure dialects.<p>We&#x27;re still in alpha
    right now, so things are a bit unstable. We&#x27;re targeting a more stable beta
    release in January. The best way you can help is to try jank out and report every
    friction point you have on Slack, Discord, or Github.<p>I&#x27;ve been working
    on jank for several years. It is not vibe-coded.
