    through my application&#x27;s states (and I can also move back&#x2F;forward in
    time from the REPL ofc). And I can then resume from any past state&#x2F;inspect
    any past state from the REPL, save any state, etc.<p>I used to do it in the past
    with re-frame and events replayed but it was, IMO, a bit complicated for my needs.
    I now much prefer to have it all on the server-side and I simplified everything
    by using SSE &#x2F; datastar (YMMV: for more complex needs, SSE may be insufficient).<p>Everything
    is immutable&#x2F;functional except for one atom that contains the app&#x27;s
    state. And that one is basically both a DB and a DB of all previous states.<p>I
    haven&#x27;t done the full undo&#x2F;redo as a tree yet (say like Emacs&#x27;
    undo&#x2F;redo does) but it&#x27;s been modeled to allow it. So I&#x27;ll add
    that &quot;navigation into past app state as a tree&quot; (i.e. when I when backward
    then forked the state) visualization at some point.<p>Immutability &#x2F; functional
