  author: f6v
  text: "&gt; People taking the shortcut to build new games - and for what purpose,
    I wonder?<p>It&#x27;s a trend that started before the AI. Games went from niche
    to mass market. There&#x27;re billions of devices - and potential customers. Mobile
    game publishers haven&#x27;t been trying to make a &quot;memorable&quot; game
    for over a decade. It&#x27;s all about A&#x2F;B tests, retention, lifetime revenue,
    etc.<p>The same is true for many desktop studios. The recent Wolverine debacle
    is a prime example. Studios are making generic, &quot;safe&quot; games.<p>In summary,
    I think it&#x27;s an industry problem that predates AI. The only difference between
    now and five years ago is that you don&#x27;t have to rely on cheap human labor
    all that much to create a clone of a clone of a clone."
