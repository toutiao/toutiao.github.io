  text: Well traditional publishers are responsible for the content of what shows
    up in their medium.  Nobody would argue that the NYT shouldn&#x27;t be responsible
    for what op-eds they publish.<p>New media outlets&#x2F;websites do have a carve-out
    in the law to not be responsible for what people post there, presumably because
    &quot;they (the platform) don&#x27;t really have control over what people post&quot;
    which is largely true.<p>But it&#x27;s only largely true as long as new media
    outlet&#x2F;platform isn&#x27;t doing editorial work ala deciding which op-eds
    to show everyone and which ones to bury.  But, their algorithms are de-facto editorial
    policy.<p>When you only saw updates from your friends or friends-of-friends or
    whatever there was no editorial policy because THEY didn&#x27;t decide what you
    saw, YOU did.  YOU were in charge of what you saw by who you associated with.  The
    algorithm was a 1:1 correlation between your friends and what you saw.<p>That
    is no longer the case.  My Facebook feed is at least 70% not updates from my friends
    but rather random crap that FB decides to show me.  That&#x27;s much closer to
    NYT deciding which articles&#x2F;op-eds to put into the paper than it is running
    some kind of &quot;people post what they want and find what they want&quot; thing
    like the forums of the old days were.<p>Will a new law get written?  I don&#x27;t
    know.  Will the tech companies allow you algorithmic choice to try and avoid getting
    regulated?  I don&#x27;t know.  But there&#x27;s a lot of latent discontent around
    how corrosive social media is by constantly stoking outrage&#x2F;anger&#x2F;whatever.  I
    don&#x27;t think it would necessarily be good if they got regulated but to me
    it&#x27;s absolutely believable that it could happen.
