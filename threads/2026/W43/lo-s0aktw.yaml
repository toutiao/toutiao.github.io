    Taking a quick look at the decision (IANAL, I am not a French lawyer, and I am not your lawyer), the bulk of the decision seems to be that Quad9 didn't follow the previous court order, and is therefore liable for penalties.
    This is fairly normal for the court process.  It doesn't matter how insane / stupid an order is, the only way to negate it is appeal or get a different order which counters the first one.  And yes, this requirement applies to court orders which are illegal, abusive, etc.
    You can't just ignore a court order that says you have to do something impossible.
    Translating from the French order, Quad9 was supposed to:

    implement ... all appropriate measures to prevent, until the date of the final match of the 2026 WTA tournament, currently scheduled for 14 November 2026, access to the identified and to IPTV sites and services not yet identified

    The blocking seems to be specific to DNS:

    ...  a penalty payment of 10,000 euros per day of delay and per domain name or subdomain remaining accessible via the services of Quad9 within three days

    Later text shows that Quad9 claimed that geoblocking wouldn't work, but didn't demonstrate it to be true.
    This is a key point.  Courts are adversarial systems with extremely rigid rules.  If the other side claims that you're a drug dealer and you don't argue, then the courts assume that the other sides statements are true.
    So whatever else is going on, it looks like Quad9 didn't obey a previous order, and had insufficient arguments to convince the court of their position.
