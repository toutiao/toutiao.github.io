    The judgment here is not terribly new. There is a law stating that sport event broadcasters can request technical intermediaries to prevent a user accessing unauthorized access to copyrighted content. This law has already applied to numerous parties and Quad9 is just the next on the list. Quad9 answering a bogus result for names leading to an unauthorized access to a copyrighted content fits the law.
    Also, courts have access to judicial experts. I don't think the problem here are the courts. The problem here is that France has passed a law making an obligation for third parties to prevent access to a specific kind of copyrighted content.
