- id: lo-slevb9
  parent_id: '0'
  author: muvlon
  text: |-
    Well it wouldn't be just one adapter, because the battery standards are also all mechanically incompatible.
    But yes you can make makita -> dewalt and dewalt -> makita etc. adapters and include the BMS whenever necessary. You'll end up with n² adapters for n battery systems. If you're willing to stack adapters, you can reduce this to 2n (e.g. by having everything -> makita and makita -> everything). Nobody 'official' sells these, but you can find them on sites like etsy or aliexpress.
    Some of them do the correct thing w.r.t. battery safety but many just YOLO it, so I would only use them after taking a really close look at the circuitry. It's not just about the cases where you need to add the full BMS, but also about forwarding the right signals. For example, one battery system may use a simple NTC pin to communicate temperature, another may use a digital protocol, so the adapter would ideally convert between those two.
