  author: vladislavp
  text: |-
    I spent an unreasonable amount of time on tool batteries...
    The most recent ones often use tabless 21700 or 18650 cells and can push between 50 to 90A of power (at 20-21v) that's a lot of power. They can power electric bicycles too.
    They can definitely power laptops or even dedicated GPUs, but not more than at 100W.
    Without regulations, tool makers use battery formats as a consumer lock-in mechanism.. unfortunately.
    I think for the 18v-21v Makita format batteries, happen to have a  lot of makita-compatible 3rd party tools and batters, they cannot use makita charges but can fit makita ecosystem otherwise (tools and batteries). At 18-21 v -- these are also well compatible with a USB-C triggering voltage.
    Going back to tool battery to USB-C converters.  To get max 240W out of the USB-C PD protocol, you would need a 48V battery.
    20v batteries will not cut it (because of 5A limit of the protocol).
    When you see that a USB-C adapter for a tool battery can provide over 100w of power, check if the manufacture means, through more than one port at the same time (rather than in one USB-C port)
    The other thing  -- is that some tool makers (eg Makita, Ryobi) have the BMS (Battery management system) circuit in the battery, but others  --like dewalt , have it in the tool.
    It is a fire hazard to use a lithium battery without a BMS, because if the voltage drops in one or more cells below like 3.0v -- it may ignite.  So using say dewalt batteries outside of their tool (or tools that explicitly manage battery voltage) -- may be dangerous, in my mind (and I am not an electrical engineer by any means...)
    Anyways, when choosing a battery system -- make sure you understand if the BMS is in the battery or the tool (as batteries without BMS should not be used in any applications that do not provide a BMS function)
