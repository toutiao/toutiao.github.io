  content: "[![back to slurp index](/site/templates/img/header_back.webp) ![back to
    slurp index [mouse over]](/site/templates/img/header_back_on.webp)](/)\n\n# the
    slurptop\n\n**Table of Contents** [The Design Process](#design) | [Power Delivery](#power-delivery)
    | [Bill of Materials](#materials) | [Closing Thoughts](#closing-thoughts)\n\n[![](/site/assets/files/1017/dscf4327.900x0.jpg)](/site/assets/files/1017/dscf4327.jpg)\n\n###
    \n\n## Basic Build Specs\n\n- Ryzen 7 7730u laptop CPU (8c/16t)\n- 64gb DDR4 RAM\n-
    500gb NVME SSD\n- 14\" 16:10 screen (1920x1200)\n- Custom 82 key mechanical keyboard\n-
    Integrated trackball mouse\n- UPS battery system that takes Kobalt powertool batteries
    (swappable, not hot-, sadly)\n\n[![](/site/assets/files/1017/dscf4310.0x260.jpg)](/site/assets/files/1017/dscf4310.jpg)[![](/site/assets/files/1017/dscf4311.0x260.jpg)](/site/assets/files/1017/dscf4311.jpg)[![](/site/assets/files/1017/dscf4314.0x260.jpg)](/site/assets/files/1017/dscf4314.jpg)[![](/site/assets/files/1017/dscf4315.0x260.jpg)](/site/assets/files/1017/dscf4315.jpg)[![](/site/assets/files/1017/dscf4317.0x260.jpg)](/site/assets/files/1017/dscf4317.jpg)[![](/site/assets/files/1017/dscf4319.0x260.jpg)](/site/assets/files/1017/dscf4319.jpg)[![](/site/assets/files/1017/dscf4320.0x260.jpg)](/site/assets/files/1017/dscf4320.jpg)[![](/site/assets/files/1017/dscf4321.0x260.jpg)](/site/assets/files/1017/dscf4321.jpg)[![](/site/assets/files/1017/dscf4323.0x260.jpg)](/site/assets/files/1017/dscf4323.jpg)[![](/site/assets/files/1017/dscf4324.0x260.jpg)](/site/assets/files/1017/dscf4324.jpg)[![](/site/assets/files/1017/dscf4327.0x260.jpg)](/site/assets/files/1017/dscf4327.jpg)[![](/site/assets/files/1017/dscf4328.0x260.jpg)](/site/assets/files/1017/dscf4328.jpg)[![](/site/assets/files/1017/dscf4331.0x260.jpg)](/site/assets/files/1017/dscf4331.jpg)[![](/site/assets/files/1017/dscf4338.0x260.jpg)](/site/assets/files/1017/dscf4338.jpg)[![](/site/assets/files/1017/dscf4339.jpg)](/site/assets/files/1017/dscf4339.jpg)\n\n###
    A Genesis of an Idea\n\nPrior to completing this project I didn't have a modern
    laptop. I also had never tried out a trackball mouse. After completing a Writerdeck
    and a Cyberdeck based on Raspberry Pi SBCs, I felt that it would be incredibly
    useful to have a full-fledged x86 portable computer. You know, a laptop. Why not
    spend two months designing, building, and refining a laptop myself instead of
    just hitting up Best Buy for a new laptop that's ready to go? I mean, I don't
    have good justification beyond \"because I can, and I want to\", but sometimes
    that's all the justification you need!\n\n### The Design Process Begins\n\nAt
    the outset of the design process I started looking at Intel N50 and N100 mITX
    motherboards and PicoPSU power delivery, but started getting discouraged at the
    price prospect of something that was more expensive than a Raspberry Pi, consumed
    more power, didn't offer much more computing power than a Pi, and consumed significantly
    more power. That's when I figured if I was heading in a high power draw x86 setup,
    why not start shopping out some mini PCs?\n\nThat's where I found some decently
    spec'd out units with laptop processors and integrated graphics. These, I figured,
    would fit the bill for a machine that would be destined for some coding and light
    design work. Next up would be figuring out the power delivery.\n\nSince my last
    folding screen Cyberdeck, I've been really enjoying designing within the Cyberpunk
    aesthetic. One of the aesthetic aspects that I felt the last build was missing
    was improvised part selection. Then I had the thought of powering the unit with
    a 24v power tool battery. The design aesthetic and the improvised hardware selection
    dovetailed beautifully in the design of the power delivery. The mini PC I bought
    had a 19v/5a power supply, and my power tool batteries were 24v. With a properly
    spec'd boost/buck converter, that should work perfectly both on the aesthetic
    requirement as well as the power and current requirement.\n\n### The Fun Stuff\n\nNow
    we get to the fun stuff: sketching out the design.\n\n[![](/site/assets/files/1017/sketch1.900x0.png)](/site/assets/files/1017/sketch1.png)[![](/site/assets/files/1017/sketch2.900x0.png)](/site/assets/files/1017/sketch2.png)[![](/site/assets/files/1017/sketch3.900x0.png)](/site/assets/files/1017/sketch3.png)\n\nIf
    you're interested in Cyberdecks, I'm sure you've seen a plethora of devices. From
    slabs without a hinging screen, to vintage computer style raising screens (like
    I used on my gray Cyberdeck), to absolutely awesome sliding designs like u/Personalitysphere's
    sliding modular Cyberdeck. I wanted something that would have the rough form factor
    of a laptop.\n\nWith the form factor decided on, the next step in every project
    I do is to gather up all the components, grab my calipers, and get to measuring
    and modeling in Blender. I make \"good enough\" 3d models of EVERYTHING. It's
    tedious and time consuming, but I wouldn't do it any other way. You can package
    everything so much nicer when using this method, and you run into WAY fewer problems
    during the assembly stage, WAY fewer redesigns and reprints, etc. This is the
    \"measure twice\" process when building a device like this, even though it's more
    along the lines of \"measuer ten thousand times\". Very worth it, and I highly
    recommend approaching things from this direction. Not to mention you're honing
    your ability to measure and model things, which is invaluable as a desinger.\n\n[![](/site/assets/files/1017/layout1.900x0.jpg)](/site/assets/files/1017/layout1.jpg)[![](/site/assets/files/1017/layout2.900x0.png)](/site/assets/files/1017/layout2.png)\n\nAfter
    establishing the layout of the individual components, I start going through a
    process of sketching out designs and layouts. Usually I have a pretty clear vision
    of what I'm going for at this point, but a lot of design elements are \"discovered\"
    at this stage. It's also where some hard choices have to be made because establishing
    certain design elements sets you down a road where if you choose to go a different
    direction you can't just CTRL+Z you're way out of. You have to delete a LOT of
    work sometimes.\n\n[![](/site/assets/files/1017/pxl_20260727_040706470.900x0.jpg)](/site/assets/files/1017/pxl_20260727_040706470.jpg)[![](/site/assets/files/1017/pxl_20260724_054307001.900x0.jpg)](/site/assets/files/1017/pxl_20260724_054307001.jpg)[![](/site/assets/files/1017/pxl_20260722_225600135.900x0.jpg)](/site/assets/files/1017/pxl_20260722_225600135.jpg)\n\nI'll
    jot out some of the notable design choices and processes that I went through:\n\n-
    I knew because of the size of the finished unit that I wanted to be able to incorporate
    some aluminum bar material to increase total unit rigidity and strength. I had
    initially planned on incorporating much more aluminum in the design, but whiddled
    that amount down in the design process to one bar that spans the width of the
    laptop, underneath the monitor hinges. It's designed to be a 4 layer sandwich
    where the bolts that hold the hinges in place also hold: the rear lower case fan
    covers, the aluminum bar, and the front keyboard switch plate. These are all bolted
    down to standoffs designed into the lower case housing that have heatset inserts
    installed.\n- I didn't want the screen bezels and overall screen housing to be
    TOO big and bulky. This was fortuitous because as designed, the screen components
    and outer lower case frame are EXACTLY sized to my printer bed (340mm) with less
    than 2mm to spare on either side.\n- The main design principles I had in mind
    were: Utilitarian (think power tools and modern rugged designs for products meant
    to be used and abused), Sci-Fi/Cyberdeck almost touching into NASA-punk (this
    is where a lot of the 45deg facets and bevels come from), and Cyberpunk (improvised
    design, scavenged hardware, etc).\n- The handle was an integral element I wanted
