  author: muvlon
  text: |-
    Going back to tool battery to USB-C converters. To get max 240W out of the USB-C PD protocol, you would need a 48V battery. 20v batteries will not cut it (because of 5A limit of the protocol).

    You can just use a DC-DC converter to give you the right voltage. They're really cheap and effective these days.
    You'd probably want one anyway even if you're only ever going to draw 20V, as a voltage regulator (the actual battery voltage will go as high as 21V and as low as ~16V). USB-PD specifies a tolerance of ±5% on source voltage, so 21% is cutting it close and 16V is far, far out of spec.
    Edit: one more thing

    It is a fire hazard to use a lithium battery without a BMS, because if the voltage drops in one or more cells below like 3.0v -- it may ignite.

    The first part is true, the second is not really true. Yes, using it without a BMS is a fire hazard, but dropping a cell below 3V is not. You can discharge a lithium ion battery cell all the way to 0V and you will only have a (permanently) dead battery, not a fire. The operations that can cause fire are

    Too high voltage (anything far above 4.3V)
    Too much current, either charge or discharge
    Short circuit (really a special case of too much current)
    Too high temperature
    Mechanical impact/puncture
