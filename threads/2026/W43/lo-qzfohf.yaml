  author: pervognsen
  text: |-
    Anything to do with old-fashioned game AI tends to be a good fit for this because there are several natural time scales. For each unit in an RTS you might have orders -> pathing -> steering/physics -> rendering. Rendering interpolates based on the latest physics poses. Steering uses the latest navmesh path. Pathing calculates the navmesh path (usually only the first few triangles are actually emitted) toward the latest order's goal point.
    With a system like this you can keep a simulation deterministic while performing load-sensitive scheduling/smearing of work. The scheduling can't be directly reactive to wall-clock time (that breaks determinism), but you can schedule based on any deterministic game state. E.g. if more units are currently moving they might re-plan their paths less frequently because the deterministic simulation plans at most 64 paths every simulation tick.
