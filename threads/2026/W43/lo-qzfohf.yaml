  author: mort
  text: |-
    Tile entities and scheduled ticks are a different system from this.
    Tile entities are Minecraft's solution for things which want to tick more frequently. But we're talking about random world ticks (https://minecraft.wiki/w/Random_Tick). Every game tick, 3 random blocks are chosen in each 16x16x16 sub-chunk. Blocks which don't "do anything" are still selected for these random ticks, so the game still has to look up what block is at the given coordinates and check whether it's a block which should be ticked.
    Saplings, wheat, cactus, ice, leaves, etc. don't all have associated tile entities to handle their growth/melting/decay/whatever, they handle that behavior in the random tick.
    The question was about why these random ticks which apply to every block are smeared out over many game ticks.
