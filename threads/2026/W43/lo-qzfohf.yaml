  text: |-
    Random world ticks aren't expensive, but there's a ton of blocks.
    We could imagine a system where every single block in the world has a random tick function which runs every game tick (i.e 20 times per second). For most blocks, this would do nothing, for slow-growing things like wheat you could just have a low probability to increase the growth counter, and the occasional tile which actually wants to do things every game tick could do that. The gameplay could be identical to today's (though there would be more developer freedom), storage would be identical to today. But every chunk, that's 16x16x384 blocks, would be roughly 100 000 updates per game tick. An absolutely tiny 128x128 block world (so 8x8 chunks) would have ~6.3 million block updates per game tick. 126 million per second.
    This would give you a time budget of roughly 8 nanoseconds per block update function, in total. At 4GHz, that's 4 clock cycles per block.
    The difficult thing about block games is never that any single thing you want to do with a block is expensive, it's that there are so damn many blocks.
