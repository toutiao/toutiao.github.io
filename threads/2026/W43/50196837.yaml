  author: thaumasiotes
  text: '&gt; For anyone else who can never remember how much a hectare is and think
    &quot;420 football fields&quot; sounds more like some weed joke than an area<p>It
    turns out there&#x27;s something much weirder going on.<p>Here&#x27;s an earlier
    article by Agence France-Presse (&quot;AFP is one of the world&#x27;s three major
    news agencies, and the only European one.&quot;): <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20261004152900&#x2F;https:&#x2F;&#x2F;www.afp.com&#x2F;en&#x2F;finnish-town-braces-change-google-data-centres"
    rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20261004152900&#x2F;https:&#x2F;&#x2F;www.afp.c...</a><p>And
    look at this:<p>&gt;&gt; &quot;In our view, operations at this construction site
    should be suspended until it is clarified whether the project is in compliance
    with the law,&quot; Hanna Halmeenpaa, chair of the board of the Finnish Association
    for Nature Conservation, who filed the request with the agency, told AFP at the
    edge of the deforested area.<p>&gt;&gt; &quot;From the satellite images, we&#x27;ve
    seen that nature sites which should be preserved have also been logged,&quot;
    she added, explaining that the size of the clear-cut area was comparable to 420
    football fields.<p>I just can&#x27;t bring myself to believe that a Finnish bureaucrat,
    speaking to a French news agency, explained that the area in question was comparable
    in size to 420 football fields.<p>And in fact the numbers don&#x27;t seem to work.
    The area is estimated at &quot;more than 300 hectares&quot;. 420 football fields
    is more like 224 hectares.<p>On the other hand, 420 soccer pitches would total
    299.9 hectares. This tells us some interesting things:<p>1. The area in question
    may be &quot;more than 300 hectares&quot;, but it&#x27;s also less than 307 hectares
    (which could fit 430 soccer pitches). Or, alternatively, zero effort was made
    to express the actual cleared area in terms of soccer pitches, and it was first
    rounded to 300 hectares and then the rounded figure was converted to soccer pitches.
    (Which I have to assume was done by AFP and not by the Finnish government.)<p>2.
    Either the &quot;global audience&quot; that TechSpot serves doesn&#x27;t include
    the United States, or they copied a French agency&#x27;s English-language press
    release without bothering to consider whether any of the numbers in it made sense.'
