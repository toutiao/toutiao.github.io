  title: Google cleared 300 hectares of Finnish forest for a data center, and regulators
    want answers | TechSpot
  fetch_status: success
  content: "Serving tech enthusiasts for over 25 years.   \n TechSpot means tech analysis
    and advice [you&nbsp;can&nbsp;trust](https://www.techspot.com/ethics.html). \n\n**Cutting
    corners:** Google recently announced a major expansion of its data center footprint
    in Finland. The US company plans to invest billions in the new infrastructure
    but is allegedly moving a bit too quickly with its forest-clearing plans. Regulators
    are now looking into the matter, and the outcome could have far-reaching consequences
    for the broader market.\n\nGoogle was apparently so eager to build its new data
    center infrastructure in Finland that it began bulldozing large swaths of forest
    before the required environmental review of the full plan was complete. The work
    could now be suspended, just as other major data center projects are being delayed
    in the US and elsewhere around the world.\n\nThe [issue surfaced](https://lvv.fi/-/lupa-ja-valvontavirasto-on-pyytanyt-selvityksia-muhoksen-ja-kajaanin-palvelinkeskushankkeisiin-liittyvista-toimenpiteista)
    last month, when Finland's Permit and Supervision Agency (Lupa- ja valvontavirasto,
    or LVV) asked Tuike Finland Oy (TFO) to explain its actions. TFO is Google's local
    company for the Finnish data center project, for which Mountain View is [investing
    €13 billion](https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/google-ai-commitment-to-finland/)
    in new AI-focused infrastructure.\n\nIn theory, TFO is supposed to operate in
    an environmentally friendly manner, with specific measures covering energy sustainability,
    job creation, and support for the local environment. Public reports cited by the
    LVV indicate that around 300 hectares of Finnish forest, roughly 420 football
    fields, had already been cleared before the project's environmental impact could
    be properly assessed.\n\n[Google argues](https://www.afp.com/en/finnish-town-braces-change-google-data-centres)
    that the forest clearing complied fully with Finnish laws and regulations. The
    site was properly surveyed before the bulldozers moved in, it said, so that no
    high-value environmental areas would be damaged. According to Hanna Halmeenpää,
    chair of the Finnish Association for Nature Conservation, things are not going
    quite the way Google describes.\n\nHalmeenpää said [satellite imagery](https://www.gadgetreview.com/google-is-accused-of-destroying-nearly-500-football-fields-of-forest-for-new-data-center-project)
    shows that areas that should have been protected have already been leveled. Beyond
    the loss of so much forest, the outcome could be dire for wildlife preservation.
    She is asking the LVV to halt the entire construction site so that authorities
    can determine whether Google tried to bring the forest down without first obtaining
    formal approval.\n\n \n\n#### // Related Stories\n\n- [Nokia 3310 & 5110: The
    Indestructible Phones Before the Internet](https://www.techspot.com/article/3163-legends-nokia-phones/)\n-
    [Nvidia reportedly refused some neoclouds access to GTC Berlin for adding AMD
    and TPU chips](https://www.techspot.com/news/114273-nvidia-allegedly-punishing-cloud-providers-using-amd-hardware.html)\n\nWhen
    it comes to environmental protection standards, Finland is one of the [highest-rated
    countries](https://finland.fi/life-society/environmental-protection-in-finland/)
    in the world. Large data center buildouts like the one TFO is pursuing carry a
    significant environmental cost, both in physical land consumption and power requirements.\n\nGoogle
    may be moving faster than the procedures of local environmental authorities, but
    communities are increasingly [voicing their dissatisfaction](https://www.techspot.com/news/113935-ai-data-center-boom-hits-growing-resistance-68.html)
    with the unchecked expansion of Big Tech's AI data center plans. Most likely,
    sending [chips into space](https://www.techspot.com/news/113989-google-launching-ai-chips-space-see-if-they.html)
    will not ease the distrust of AI infrastructure that these mega-corporations are
    eagerly fostering down there.\n\n[25 comments 1.8K likes and shares](#commentsOffset)\n\nShare
