  author: eddythompson80
  text: It&#x27;s been happening, but just like all fads, especially nostalgia driven
    ones, it&#x27;ll die soon. Every few years a new batch of people enter their higher
    earning years where they have more disposable income (mid to late 20s for some,
    early 30s for some, late 30s for others, etc) and nostalgia hits and they go crazy
    for a piece of their childhood or adolescence or their crazy 20s. If enough of
    said batch line up, you get a phenomena or a fad.<p>The sudden growth rate in
    sales derive some people to capitalize on it. Mostly either Chinese manufacturers
    or drop shippers though sometimes big names get swept up in the frenzy too. Then
    the market is flooded and it&#x27;s not cool or unique anymore, or the target
    audience is saturated and then it&#x27;s forgotten. I suspect something similar
    is happening now with screenless fitness trackers right now (even though I bought
    one because I hate smartwatches but want a fitness tracker)<p>It&#x27;s especially
    funny seeing people who are into &quot;MP3 players for digital detox&quot; speak
    on podcasts or online. &quot;I love that it&#x27;s not a phone. I just wish it
    had &lt;insert random ass app(s)&gt; so I can take it on walks and leave my phone
    behind&quot; then those random apps are different per person. It&#x27;s really
    funny.<p>Similar thing with the screenless fitness trackers I mentioned. On every
    single review or discussion board for them, you will find people complaining that
    a screenless fitness tracker is, in fact, screenless and that they wish it just
    had a small screen for their important notifications or if it can answer calls
    or get phone notifications or connect to LTE.
