  author: matheusmoreira
  text: 'Let&#x27;s not compare computer issues with murder. And of course it is happening
    regardless of what we want: trillion dollar industries and governments want this.
    We&#x27;re nothing to these people.<p>Coexist? That&#x27;s total nonsense. This
    is merely a temporary solution for them. The end game is the total destruction
    of computing freedom as we know it today. Video games are just the first thing
    they will take away from you. They also want your encryption, your local AIs,
    your torrents, your adblockers, your emulators, anything and everything that harms
    their bottom line and subverts their laws in any way.<p>Soon you will no longer
    be allowed to boot into anything that will give you any form of control. It&#x27;s
    the war on general purpose computing, cheating in online games is completely irrelevant
    next to that. The democratization of cryptography allows citizens to defeat police,
    judges, even literal spies. Computers are too subversive to allow us citizens
    to own them, they think we should only have computers that run a restricted set
    of government signed executables. It&#x27;s the end of everything the word &quot;hacker&quot;
    ever stood for.<p>What makes it especially hilarious in a sad way is the fact
    that <i>this</i> is what makes personal computers truly special. Consoles are
    just locked down computers, we&#x27;re the ones who have freedom. Considerable
    effort is spent on jailbreaking consoles precisely to restore that freedom. Yet
    the PC gamers seem to be almost eager to &quot;coexist&quot; with these hostile
    corporations whose entire mission is to reduce our computers to appliances.'
  score: 0
