  author: matheusmoreira
  text: 'We shouldn&#x27;t be forced to choose between a free system and one where
    we can play online games. They should just have to accept the fact they have no
    control and deal with it. Nobody cares how much it costs them.<p>If you want to
    see what happens when you compromise on this, all you have to do is look at mobile
    operating systems. They&#x27;re all owned by corporations and governments, and
    it&#x27;s enforced by hardware remote attestation. Install a custom system where
    you&#x27;re in control? Attestation fails. You&#x27;re banned from everything,
    you get no service anywhere, you are ostracized from digital society, you become
    a second class citizen. Mark my words: one day we will need remote attestation
    <i>just to connect to the internet</i>.<p>Not everyone plays online games, but
    most people <i>need</i> communications apps, banking apps, government apps. Our
    &quot;free distros&quot; will be nothing but paperweights soon if we don&#x27;t
    find a way literally outlaw remote attestation. I think people are really underestimating
    what&#x27;s truly at stake here.'
