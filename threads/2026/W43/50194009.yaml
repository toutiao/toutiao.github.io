  author: matheusmoreira
  text: 'I do follow him. I use AGPLv3 on all the code I publish. Stallman saw far
    into the future and predicted much of this decades ago.<p>There is a problem though:
    he talks about <i>software</i> freedom, not <i>computer</i> freedom.<p>Right now
    we can make free software ourselves and enjoy the freedom that brings, but the
    war on general purpose computing rages on and it threatens to invalidate all of
    our efforts. Free software is completely pointless if our computers start refusing
    to run it.<p>We need to enshrine computer freedom into law and literally ban stuff
    like remote attestation. We also need distributed computer manufacturing technology
    so that normal people can simply create their own free computers at home just
    like they can create free software at home.'
