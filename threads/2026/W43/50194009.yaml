    and leverage over. Let it happen. Play with friends you know and trust instead
    of internet randoms.<p>&gt; Booting into a special environment just for competitive
    games would allow both to coexist.<p>There will never be such a &quot;special
    environment&quot; for games. Every government and corporation under the sun wants
    this for much more sinister reasons. The notion that this will be limited to video
    games is laughable. Video game are merely how they are selling this subversion
