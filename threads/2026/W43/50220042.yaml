  author: pessimizer
  text: In this particular case it is not viral. All MIT-licensed code can be &quot;licensed
    as a whole at no charge to all third parties under&quot; GPL 2. The point of the
    MIT license is that it can be freely relicensed.<p>You actually have <i>more</i>
    rights with that file than with the others; the GPL doesn&#x27;t <i>restrict</i>
    non-GPL&#x27;d code distributed with it, it requires that that code be licensed
    in a way that allows it to be distributed under GPL 2. For example, I myself can
    take this code and redistribute the entire thing under GPL 2 <i>without</i> an
    exception for .&#x2F;kernel&#x2F;mem.c (as long as I include any acknowledgement
    required by MIT, such as a copy of the MIT license and a copyright notice.)<p>You&#x27;re
    overcomplicating things and (maybe accidentally) spreading FUD. MIT was specifically
    designed to be compatible with anything from copyleft to proprietary.
