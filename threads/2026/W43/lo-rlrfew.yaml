  author: david_chisnall
  text: |-
    Contracts that can be used for formal verification can’t have side effects that extend outside of the verifier’s abstract machine. The first thing that you need to do is define a subset of the language that is amenable to formal verification. C++ already, in the form of consteval defines a subset that can be evaluated at compile time with an abstract notion of memory. The contracts group explicitly declared defining such a subset as out of scope.
    The other side is that you can’t prove arbitrary properties and that the set of properties that you can prove in the presence of arbitrary aliasing and concurrent mutation may be small. This is true, but you can at least provide building blocks that let people prove that their program sufficiently constrains aliasing such that it can prove properties that they cared about. Verus manages this in Rust’s unsafe subset but we don’t get the experiment to see whether C++ could benefit from this because the contracts folks declared it out of scope.
