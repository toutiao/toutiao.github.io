    Ada has been around for a long time and is a good example.  In Rust, Verus provides a newer implementation of the same vision.
    There's no reason that C++ couldn't have had contracts like this.  But defining a subset of the language for formal verification was declared explicitly out of scope.
    In another direction, Erlang-style guard clauses provide a nice way of doing things like adding dynamic type guards and forwarding to specialised implementations depending on run-time properties (with the option of optimisers specialising the dispatch if they can prove a call site meets the requirements).  But having dispatch influenced by contracts was explicitly declared out of scope too.
    M# found that you could get some interesting speedups by inlining contracts at the right point to allow them to both be erased because they could be statically proven to always hold and become assumptions later.  The requirement to support different contract enforcement policies across compilation units makes this impossible.
    So we end up with a design space that has a number of interesting and useful design points and C++ picking a place that very carefully avoids intersecting any of them.
    And then we're told that people who criticise contracts aren't engaging in good faith.
    And then we end up with a situation in which we have a minority that is pushing contracts, a minority that has looked carefully at contracts and finds the design riddled with flaws, and a majority that believes the claims of one or other group and we're told that this is 'consensus' and the design is pushed into the draft.  And then people are surprised when the ratification isn't unanimous.
