    Where are you getting this claim of no consensus then? Clearly you read this paper and came to the conclusion that there was no consensus, because this paper is written in a way that makes you think that.
    To cite Herb Sutter's trip report[1] from croydon, first that "lack of consensus vote" to pull contracts into C++26:

    In February 2025 when we took the plenary poll to adopt contracts in the C++26 working draft (“merge it to trunk”), the vote was:
    100 in favor, 14 opposed, and 12 abstaining

    And in 2026 the vote to approve C++ 26, with the inclusion of contracts

    the vote was non-unanimous primarily because of the sustained concerns about contracts:
    114 in favor, 12 opposed, and 3 abstaining

    So, what you are seeing is a paper denying the existence of consensus, where the consensus was overwhelmingly in favor, published after the committee voted to approve recommendation of C++26, but before the ISO national bodies voted essentially as to whether they should accept that recommendation.
    Given you thought there was not consensus, even though there was overwhelming consensus, how do you think other groups might have read that paper?
    [1] https://herbsutter.com/2026/03/29/c26-is-done-trip-report-march-2026-iso-c-standards-meeting-london-croydon-uk/
