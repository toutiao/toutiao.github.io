    Probably unrelated to this discussion, but I'd be interested to hear what you're working on here. Is this a pointer provenance thing? Is it about ensuring CHERI compatibility? I didn't know there's any "open discussions" on pointer behavior in C++, I figured most of this would be completely set in stone.

    The core model is fairly uncontentious but there are other things like the semantics of intprt_t. In C, it remains optional. C++ has made it mandatory but with implementation-defined semantics. I’m working (though haven’t updated the paper for a bit) on codifying the semantics to permit both what CHERI does and a slightly more lenient model.
    In particular, there are some simple things people expect. If you cast a pointer to an intprt_t and add N, then cast back, the result should be the same as if you’d cast to char*. This is not guaranteed by C or C++ but it’s such an obvious ‘of course it works that way’ thing that an implementation that didn’t preserve that property would not work for most non-trivial codebases. And, since compilers have to be able to do the right thing for char*, all implementations can do that.
    Other arithmetic also needs to be defined in similar terms. In the CHERI C/C++ work, we found that the most common use of intprt_t was to align pointers up and down. That use requires masking the low bits. Again, that should be defined because it’s currently 100% implementation-defined but people assume it works (we had to make it work with CHERI C/C++ because the other option was break everything).
    Beyond that, I want some feature-test macros that define whether arithmetic that takes the address to another object is defined. It doesn’t work in CHERI, but it is expected to in some low-level systems code (e.g. CPU-local storage in the FreeBSD kernel), so there needs to be a way for software to say ‘I assume this works, static assert fail if it doesn’t on thei target’.
