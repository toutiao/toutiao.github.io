  author: andrewaylett
  text: |-
    In the interests of accuracy, the law (the Metropolitan Police Act 1839) actually states<p>&quot;&quot;&quot;
    54 Prohibition of nuisances by persons in the thoroughfares.<p>Every person shall be liable to a penalty not more than level 2 on the standard scale, who, within the limits of the metropolitan police district, shall in any thoroughfare or public place, commit any of the following offences; (that is to say,)<p>...<p>8. Every person who shall roll or carry any cask, tub, hoop, or wheel, or any ladder, plank, pole, showboard, or placard, upon any footway, except for the purpose of loading or unloading any cart or carriage, or of crossing the footway:<p>...
    &quot;&quot;&quot;
    <a href="https:&#x2F;&#x2F;www.legislation.gov.uk&#x2F;ukpga&#x2F;Vict&#x2F;2-3&#x2F;47&#x2F;section&#x2F;54" rel="nofollow">https:&#x2F;&#x2F;www.legislation.gov.uk&#x2F;ukpga&#x2F;Vict&#x2F;2-3&#x2F;47&#x2F;section&#x2F;54</a><p>The plank of wood is one element in a much broader statute, rather than an example of hyper-specificity.  And it might have been strictly applied at the time, but that doesn&#x27;t mean you&#x27;re definitely going to get into trouble nowadays.<p>In a similar vein, the UK *does* have laws that affect big tech.  UK GDPR places requirements on processing of personal data:<p>&quot;&quot;&quot;
    Personal data shall be:<p>(a)processed lawfully, fairly and in a transparent manner in relation to the data subject (‘lawfulness, fairness and transparency’);
    &quot;&quot;&quot;
    <a href="https:&#x2F;&#x2F;www.legislation.gov.uk&#x2F;eur&#x2F;2016&#x2F;679&#x2F;article&#x2F;5" rel="nofollow">https:&#x2F;&#x2F;www.legislation.gov.uk&#x2F;eur&#x2F;2016&#x2F;679&#x2F;article&#x2F;5</a><p>Whether that&#x27;s properly enforced is (as with the plank) a completely different matter.<p>In the UK, at least, we don&#x27;t need new regulations, we need to more effectively apply the regulations we already have in place.  But there is also a balance to be made between enforcement through fines and enforcement through changing behaviour: it&#x27;s much better to work with companies to bring them into compliance than it is to just fine them and without actually changing anything.
