  author: alexpotato
  text: Long time SRE&#x2F;DevOps person here:<p>Even pre-AI, I or other team member
    could have written our own versions of:<p>- JIRA<p>- Prometheus<p>- etc<p>but
    we didn&#x27;t.<p>Why not? A couple reasons:<p>- Why write custom software for
    common problems that lots of other people have? We are already helping build internal
    custom systems for the business<p>- We were already supporting internal apps and
    now we have to support more apps? Apps that have dedicated support teams that
    are cheaper than us supporting them due to economies of scale&#x2F;<p>You might
    say that AI changes the economics of the above to which I respond:<p>the marginal
    cost of a vendor adding another cloud instance of their existing software is,
    while non-zero, MUCH cheaper for them than for us. They also handle all of the
    security, patching, stability etc.<p>Yes, AI changes the absolute prices of this
    work but it doesn&#x27;t necessarily change the relative pricing dynamics which
    are effectively the same.
