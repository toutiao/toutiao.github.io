  text: I&#x27;d say though that a lot of open source developers and technical people
    have a relationship with documents that has nothing to do with &quot;word processing&quot;.<p>That
    is,  a lot of us use plain text editors together with systems like markdown or
    restructured text or TeX.  We never touch a WYSIWYG editor or if we do it is embedded
    in a web page.<p>If you look closely at how WYSIWYG editors behave (selections,
    cut-and-paste, etc.) you realize there is something conceptually wrong with the
    model behind them that causes them to misbehave, at worst they can seem like they
    are possessed by the devil.  Word has problems but other editors,  especially
    those ones embedded in web pages, are worse.  I think plain-text editors in the
    open source world are fantastic but the WYSIWYG tools are awful...  and plain-text
    tools are kind of a &quot;blub&quot; vs WYSIWYG tools,  but you can live a great
    document life with them.
