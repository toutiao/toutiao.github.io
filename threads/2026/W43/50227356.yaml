  author: ekidd
  text: Qwen3.8 27B is a dense model with expensive K&#x2F;V caching. It&#x27;s <i>fantastic</i>
    if you have 32-48GB of VRAM and want to run 1 or 2 agent sessions locally. But
    if serving batch inference for many users, it&#x27;s expensive.<p>DeepSeek V4
    Flash 0731 is dirt cheap at scale, less than 10% of the cost of Qwen3.8 27B. This
    is because it&#x27;s an MoE and it uses much less VRAM for KV cache. And it&#x27;s
    generally a better model. V4.1 is also cheap at scale, though I&#x27;ve heard
    mixed reports on the optimized K&#x2F;V caching.<p>You should not be running Qwen3.8
    27B on an API normally. Maybe Cerberas&#x27;s hardware is bad at batching or supporting
    more efficient K&#x2F;V caching schemes, or something like that?
