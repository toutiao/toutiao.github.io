  text: It&#x27;s describing a different type of parallelism - pipeline parallelism.
    The network is laid out spatially on the wafer in CB&#x27;s case. So weights are
    stationary and activations flow. A GPU is going to process the network one layer
    at a time. GPUs also use other types of parallelism (tensor and expert mainly
    in inference). Pipeline parallelism doesn&#x27;t make much sense on a GPU for
    inference.
