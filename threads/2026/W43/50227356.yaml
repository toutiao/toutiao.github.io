  author: Nevermark
  text: My guess is it is more like the opposite. They distribute spares evenly along
    every array in every dimension, so that there are always the same number of selected
    and unselected cores in each core-set.<p>With flexible addressing and bus-linking,
    along any set-line. So configuration happens the same way, with the same efficiency,
    regardless of whether any of the unselected elements are failed or not. As long
    as failures don&#x27;t exceed the unselected-elements per element-array-set number.<p>And
    that number of unselected cores per element-array-set, is chosen to put wafer
    yields where they want them.<p>Trading a generous fixed wafer under-utilization
    for high yields, uniform configuration and processing efficiency, despite variable
    element failures.
