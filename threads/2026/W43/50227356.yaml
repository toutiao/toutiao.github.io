    sometimes better. And in particular, when a machine is involved, all things being
    equal, faster is better. Would you rather use a fast compiler or a slow compiler,
    all things being equal except cost to keep the analogy with the original? Compiler
    A produces the same binary with the same optimization levels a compiler B, but
    in 1&#x2F;10th the time. Assuming you can afford it or someone above you in your
    organization is willing to buy it for you, you take compiler A. If you can’t afford
    it, you lust after it. Why, because a slow compiler results in a slow iteration
    loop no matter what. With an instantaneous compiler, the loop is as slow or fast
    as the human part of it. You want to think some more, rearchitect this or that?
    Fine. Your code is always ready to run.<p>I get the sense that you’re anti-AI.
