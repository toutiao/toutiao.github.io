  text: 'Ah, this prompted a few questions from me. Perhaps someone with more hardware
    background could chime in.<p>They don&#x27;t really show it here, but supposedly
    a Cerebras&#x27; chip is sub-divided into a 2D mesh of what they call PEs (cores).
    So data flow generally flows in two axis, and maintains consistent timings to
    its 4 neighboring cores. They show the layers flowing from left-to-right being
    streamed by PEs, but I wonder how true that ends up being: maybe the communications
    are easier to stream via diagonals, or some other shape that has better topology
    for data flow.<p>Then, even from die shots of CPUs and GPUs we often see that
    cores are tiled as squares, and those don&#x27;t have the same cross-core connection
    and streaming requirement. Now, I assume that some parts of what we call a core
    can be moved around more freely while maintaining whatever power&#x2F;heating&#x2F;timing
    requirements we have, so perhaps it&#x27;s easier to &#x27;force&#x27; a square
    by moving those loose parts around. But why do we confine those to squares? Is
    super-core layout just something not worth investing time into, like how interconnects
    are timed,  non-convex tilings, and distances to I&#x2F;O?<p>And for streaming
    architectures like Cerebras, why aren&#x27;t other types of tilings considered,
    something like a hexagon grid? This could have 3 inputs &#x2F; 3 outputs, which
    could allow more complex data flow (?). Similarly, we could have 8 connections
    with longer diagonals in a square tiling, etc.<p>I guess, what are the tradeoffs
    in place such that so many chip designs seem to reuse square tilings both locally
    and globally?'
