  author: pardner
  text: 'Unfortunately non-citizens probably don&#x27;t have this luxury, but before
    entering certain countries - including returning to the USA as a citizen from
    a recent trip abroad, I wipe and do a fresh OS reinstall (simple new password
    not used anywhere else, zero user data, no email or chat or cloud accounts configured).<p>Right
    before the wipe I update my cloud backups of course, and if I&#x27;ve been doing
    a lot of work I use Carbon Copy Cloner to an SSD encrypted APFS volume and use
    DHL to ship the SSD to someone I can retrieve it from once home. I also have finally
    started traveling with a second phone (a cheap Consumer Cellular backup flip phone
    with only a few family in the address book).<p>&quot;Password, please&quot; -
    &quot;sure, no problem: Travel1234 with a capital T.&quot;*<p>Restoring the devices
    is a bit of a pain, but is faster and easier with the SSD assuming it arrives.<p>But
    them&#x27;s the times we&#x27;re living in.<p>* I suppose if it they ever ask
    and login, CBP will ask &quot;Why doesn&#x27;t your device have any user data?
    This is suspicious.&quot; I might tell them about the time an Israeli border dude
    took my computer into a back room for an hour and by the time I got home someone
    in Israel had stolen and sold one of my better domain names. Or might just shrug
    and say &quot;Citizen&quot;.<p>I am a little curious in that scenario (thoroughly
    wiped device, comply with password request) if they still impound the wiped device
    (after they presumably connect it to whatever digital-strip-search gadget they
    hide in the back room and it comes back clean).'
