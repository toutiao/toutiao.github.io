  author: tialaramex
  text: In the UK the vast majority of prosecutions are made by the Crown Prosecution
    Service. The CPS are civil servants and, unlike in the US where they elect the
    guy emptying the trash, the crossing guards and the receptionist, these are just
    career lawyers.<p>Most importantly here, the CPS has a &quot;Test&quot; <a href="https:&#x2F;&#x2F;www.cps.gov.uk&#x2F;publication&#x2F;code-crown-prosecutors#section4"
    rel="nofollow">https:&#x2F;&#x2F;www.cps.gov.uk&#x2F;publication&#x2F;code-crown-prosecutors#se...</a>
    to tell them whether they <i>should</i> prosecute people. This is going to weed
    out a whole lot of the worst examples you&#x27;ll see in the US.<p>You may remember
    Horizon not so long back, which was a gross misscarriage of justice in which large
    numbers of people who effectively worked for the Post Office were accused of crimes,
    in some cases jailed and even in a few cases committed suicide. Horizon is exceptional
    because, since mail was historically very important, the Post Office actually
    did have the same power as a Crown Prosecutor. Those cases were still sometimes
    really the fault of the CPS (not least because the CPS has a legal right to just
    seize control of, and then terminate a prosecution if they believe it would be
    prudent to do so) but are exceptional because most organisations could not have
    done this even if they wanted to try it.
  score: 0
