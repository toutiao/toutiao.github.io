    implementations like musl's are hacks where it's trivial to find stuff like shell bypasses

    Yes I am going to start using the term "parser differential" for this.  It is often used in the context of say web firewalls trying to parse HTML incorrectly and block stuff, but I see it extremely often in relation to shell -- simply because shell is hard to parse, and people write a second, crappy, and incomplete shell parser.
    https://nhimg.org/glossary/parser-differential/
    And even bash can't parse shell correctly in many cases, after 30 years of trying :-)   That is one reason I started https://oils.pub/
    I don't have the bugs handy, but simply parsing nested () {} $() ${} in shell is extremely difficult, and the unbalanced case 0 in *) is one reason, but not the only one.
