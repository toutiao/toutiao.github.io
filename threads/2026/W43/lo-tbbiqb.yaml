  text: |-
    A while back I came to the same conclusion when researching wordexp, because we were having discussions about adding a wordexp:: module to the Hare standard library. I was extremely against it, both because it's impossible to use safely on untrusted input (as you noted), and also because pretty much no one fully implements it correctly: implementations like musl's are hacks where it's trivial to find stuff like shell bypasses, and implementations like glibc which don't use the system shell (except for command substitution) can't handle edge cases like $(case 0 in *) echo hi; esac)
    The compromise we ended up on was to ignore POSIX altogether. This means that Hare's wordexp always uses the system shell (even if it isn't a POSIX shell), and, more importantly, we don't implement WRDE_NOCMD at all; we instead document that the interface is only suitable for trusted inputs:

    Note that, by design, this module runs arbitrary shell commands from user-supplied inputs. It must only be used in a trusted environment.

    IMO providing a flag like WRDE_NOCMD which doesn't actually make the interface safe to use is worse than providing nothing at all, since it gives a false illusion of security.
    The main motivator for us to implement wordexp was for the upcoming hare.ini configuration format, to declare dependencies and linker flags and stuff (that way the user can use pkg-config, for example). Although wordexp wouldn't have been my first choice, I'm happy with the compromise we ended up with.
