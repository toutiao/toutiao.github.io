  text: |-
    Yeah, there are quite a few POSIX APIs that directly or indirectly assume the presence of a full sh lexer, a full C lexer, etc. But very few (approachably) POSIX systems are built such that the sh or C lexer is reusable from libc, so we end up with these crazy hacks instead.

    Not sure who put it there, and why.

    The post I linked to has an interesting explanation (quoting):

    It seems the problem was that people kept demanding more and more features for glob, so it seems like the committee threw up their hands and added the far-too-broad wordexp in attempt to cover all possible bases.

    From: https://www.cipht.net/2023/11/21/worried-by-wordexp.html
