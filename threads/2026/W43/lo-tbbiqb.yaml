  text: |-
    A few other things that make wordexp(3) dangerous:
    You can’t use it in a multithreaded program, because it usually forks a shell.
    On glibc wordexp is built in, but shell expansions that set variables call setenv() which is not thread safe, and which also modifies the caller’s environment which traditional forky wordexp() does not. (libc basically never calls setenv which is why this is a notable oddity.)
    It really is a lunatic function that should be documented with a big “do not use this” health warning.
