  url: https://yossarian.net/til/post/posix-wordexp-3-is-dangerous/
  title: 'TIL: POSIX wordexp(3) is dangerous'
  fetch_status: success
  content: "[`wordexp(3)`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/wordexp.html)
    is a POSIX API for performing shell-style expansions from C.\n\nIt's often cited/recommended
    as a way to do tilde expansion (e.g. `~/foo` to `/home/me/foo`):\n\n    #include
    <stdio.h>\n    #include <stdlib.h>\n    #include <string.h>\n    #include <wordexp.h>\n
    \   \n    int expand_tilde(const char *input, char **output) {\n        wordexp_t
    p;\n        int ret = wordexp(input, &p, 0);\n        if (ret == 0) {\n            *output
    = strdup(p.we_wordv[0]);\n            wordfree(&p);\n        }\n        return
    ret;\n    }\n    \n    int main(void) {\n        char *expanded = NULL;\n        expand_tilde(\"~/foo\",
    &expanded);\n        printf(\"expanded: %s\\n\", expanded);\n        return 0;\n
    \   }\n\nHowever, `wordexp(3)` is also dangerous! That last `0` argument is for
    the _flags_ parameter. By default, all expansion features are enabled, **including
    command expansion** :\n\n    expand_tilde(\"$(whoami)/foo\", &expanded);\n\nor:\n\n
    \   expand_tilde(\"$(cat /etc/passwd)/foo\", &expanded);\n\nDisabling this requires
    passing [`WRDE_NOCMD`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/wordexp.html#:~:text=WRDE_NOCMD,Substitution%2C%20is%20requested.)
    as a flag. Unfortunately, this palliative at best in some libc implementations:\n\n-
    [musl implements `wordexp(3)`](https://git.musl-libc.org/cgit/musl/tree/src/misc/wordexp.c)
    by delegating to the system shell. It adds some perfunctory scanning for command
    substitutions before delegating, but fails to match some patterns that the underlying
    shell (like GNU Bash) can treat as valid command substitutions.\n\n- [macOS's
    libc implements `wordexp(3)`](https://github.com/apple-oss-distributions/Libc/blob/71bbe350ab79eef58113991d817ccc6165061a64/gen/FreeBSD/wordexp.c#L201)
    in a similar manner, delegating to`/usr/lib/system/wordexp-helper`. According
    to [Julian Squires](https://www.cipht.net)this had the same bypass as musl [as
    recently as 2023](https://www.cipht.net/2023/11/21/worried-by-wordexp.html), although
    I didn't bother testing whether it's still effective now that the default macOS
    shell is `zsh`instead of `bash`.\n\nBottom line: don't use `wordexp(3)` on untrusted
    inputs, even with `WRDE_NOCMD`."
