  text: "I have seen this in libc, and I wonder why it is there at all.  No shells
    use it to implement anything.  Tilde expansion can be implemented with a much
    more straightforward algorithm.\nAnd if it just forks a shell, yes that is incredibly
    dangerous !!    (Not to mention making it impossible for shells to use it :-)
    )\nI think the problem is that the specification of such a function involves the
    entire shell, because the entire shell language can appear inside command subs:\n$
    echo $( f() { echo 'defined function'; }; f; f && f; f | f )\r\ndefined function
    defined function defined function defined function\n\nNobody is going to implement
    an entire shell inside libc ... that would be crazy.\nIt seems like it should
    be removed from libc.  Not sure who put it there, and why."
