  text: |-
    Oh and now I remember the reason I was looking into parser differentials.  I noticed that there were two cases of longstanding design bugs in the Go stdlib that can be thought of as parser differentials:
    (1) One them was a motivation for JSON v2 - https://go.dev/blog/jsonv2-exp (Sept 2025)
    e.g. two parsers handling {"admin": false, "admin": true} differently
    An example (not involving Go) is https://nvd.nist.gov/vuln/detail/cve-2017-12635 - Due to differences in the Erlang-based JSON parser and JavaScript-based JSON parser
    (2) The other parser differential is in contextual auto-escaping in Go's template packages
    https://nvd.nist.gov/vuln/detail/cve-2023-24538 - Templates do not properly consider backticks (`) as Javascript string delimiters, and do not escape them as expected. Backticks are used, since ES6, for JS template literals
    Basically Go has a crazy HTML/CSS/JS incomplete parser / state machine, in order to do automatic escaping.  But the difference between that parser and the real one can lead to  missed escaping of untrusted variables, and thus a vulnerability.

    If shell and HTML and other "crappy languages" weren't already entrenched enough, then LLMs really put the nail in the coffin.  We will be using shell and HTML "forever".
    But maybe we can do better with LLMs ... i.e. nobody wants to do all this work to migrate toward stricter languages (e.g. OSH vs bash, which is easy in 99.9% of cases), but we really should.
