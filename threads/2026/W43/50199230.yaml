  author: Merrill
  text: The academic literature has a problem in that it is relatively incoherent.
    Each new paper provides some small advance, with only a meager indication of how
    it fits into the known science in the area, its importance, and its consistency
    with previous results. It also remains in the corpus if later publications disprove
    its results or fail to replicate them. Only slowly do the aggregate of published
    results find their way into more systematic and complete authoritative texts.<p>AI
    promises to solve this problem by absorbing the entire corpus quickly and making
    a coherent whole available for further research and progress. It will be particularly
    useful if it can immediately flag any conflicts and inconsistencies, as well as
    any new relationships with other results not indicated in citations.
  score: 0
