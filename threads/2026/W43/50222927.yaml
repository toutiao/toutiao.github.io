  author: silves89
  text: My father was the dentist on St Helena from 1998-2022. I visited, taking a
    military jet from Brize Norton airbase in the UK to Ascension Island, and then
    a 3-day boat on the RMS St Helena. I never took the 5-day boat from South Africa.
    It&#x27;s a hilly and rugged place, and very green. I was a student when I went
    there, and I was with my twin brother and we met another set of twins who were
    visiting at the same time. They were our age and we all got pissed and shared
    the cheap cigs. My bro and one of them climbed Jacob&#x27;s Ladder late at night
    after many beers, and they took ages while we waited at the top. They kept having
    to stop to vomit. That was an excellent Christmas and new year.
