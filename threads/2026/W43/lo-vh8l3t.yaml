    The responses to this are honing in on "worked with" to a degree that is bordering on nuance trolling.
    I'm in the "begrudgingly admit that AI is helpful for certain tasks, and simultaneously think the externalities are pretty bad and that they represent the largest theft in human history" camp, to give context on my broader stance on AI. With that out of the way, some of you need to touch grass and stop nitpicking just for the sake of nitpicking.
