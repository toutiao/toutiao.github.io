    "I told Visual Studio to build release and debug builds for x86 and arm" is a very reasonable thing to say.

    This person was, charitably, pretty deep into what I think is now considered "AI psychosis" -- ceased collaboration with coworkers; started frequently arguing with just about everyone; pasted reams of LLM output in direct chats, shared channels, and emails at every opportunity; denigrating others as people he could replace with "just another claude agent". A pretty bad situation.

    Yeah, very thankfully not something I've had to experience much yet. The whole LLM pronoun thing is super interesting both from a language and thought-process perspective. From a thought-process perspective, it takes me no effort at all to not anthropomorphize these tools. I use them sometimes, I get good results often, I get trash results occasionally, and I have a reasonable-enough mental model of how things work inside the black box to properly contextualize the output.
    From a language perspective, things get a bit weirder when I think about it. I'm bilingual, with English as my mother tongue and French coming via French Immersion through grade school, and it's different between them.
    In English, no problem at all using "it" to refer to either conventional tools or LLM tools ("Visual Studio started the build, but then it crashed" or "I got Claude doing a lit review but it got stuck because of paywalls").
    In French, where all* nouns are gendered, animate or inanimate... things get a little weird. There's, as far as I remember at least, no real deterministic way for determining whether a particular noun is male or female, but after doing it for a while you just kind of... know? For inanimate common nouns there are heuristics based on the end of the word and similar, but it's kind of vague and there are exceptions. Anyway, point of that is, in my head Claude is "il / le" (masculine) and ChatGPT/Codex is "elle / la" (feminine), for whatever reason. The English part of my brain has no problem not assigning gender to inanimate objects, but the French part of my brain insists that it must be done and it comes up with inconsistent assessments there, which fascinates me. No clue how native French speakers handle that either.
