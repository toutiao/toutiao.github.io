    Having done that, it is hard to imagine any activity is important beyond the immediate experience of it. But with AI, you are not getting any experience of doing anything - because you’re not doing anything.

    Just yesterday I was working on a TLA+ model we have at work, extending it to explore some new behavior we're adding. I had Fable work with me to find a bug in the original model, then work to extend it. But the precondition it came up with to satisfy a property only worked under an assumption that is currently true but might not be true in the future. My (human) coworker and I discussed this for an hour or so, and together we came up with a tighter precondition that doesn't require that assumption. I implemented this other precondition with Fables help, including showing that without the assumption the original precondition failed, and that (under a reasonable monotonicity assumption) the tighter precondition is both necessary and sufficient. I was also able to (through my own prose) articulate the reasoning behind all this informally, though I still need to write down the more formal argument here. All this took 3ish hours of my time.
    Look, I know a lot of people turn their brains off when dealing with this stuff, and also that the default model of interaction with these tools pushes you strongly towards turning your brain off. But it is patently absurd to say that this counts as "not doing anything". I now have a much deeper understanding of the system than I did the day before.
    In generaI, one should be very careful about making universally quantified statements.
