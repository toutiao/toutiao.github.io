  author: ataraxia937
  text: This one again feels overblown, at least for servers. I just checked an org
    of over 200 GitHub repos. Node, Python, and C#. None of them are vulnerable...
    because none of them actually call the Brotli decoder. It&#x27;s just not enabled
    by default on the server side, by the platforms themselves. This is much like
    the PHP bugs, where specific conditions have to be in play before you&#x27;re
    actually vulnerable.<p>For clients? Sure, that&#x27;s a bigger risk. Patch them.
    But bad guys aren&#x27;t attacking your clients unless the clients connect to
    them. Don&#x27;t stay up late to fix this.<p>(And yes, .NET is included here,
    because Microsoft&#x27;s Brotli module is a binding for Google&#x27;s vulnerable
    reference implementation.)
