  author: '0xbadcafebee'
  text: 'If you are using Python, you are affected if you use <i>urllib3</i>, <i>requests</i>,
    <i>httpx</i>, <i>aiohttp</i>, <i>Scapy</i>, and others, if they were installed
    when Brotli was also installed. You can mitigate by uninstalling brotli and brotlicffi,
    OR, strip `br` from Accept-Encoding on outbound AND reject `Content-Encoding:
    br` on inbound.<p>This is not a server-side issue (unless for some weird reason
    you&#x27;re using Brotli decoding in your http request processing), it&#x27;s
    client-side.<p>Thank you Paul for the write-up (<a href="https:&#x2F;&#x2F;opensourcemalware.com&#x2F;blog&#x2F;node2shell-affects-python"
    rel="nofollow">https:&#x2F;&#x2F;opensourcemalware.com&#x2F;blog&#x2F;node2shell-affects-python</a>)'
  score: 0
  posted_at: '2026-10-24T03:37:52Z'
- id: '50218176'
