  author: octoberfranklin
  text: 'Nope, run ldd on cargo; it links to libbrotlidec.so.1.  Via libcurl.<p>Aren&#x27;t
    you glad cargo connects to the network whenever it feels like it?  I just love
    it when my build tool does that.<p>There are 753 crates that drag in brotli this
    way: <a href="https:&#x2F;&#x2F;lib.rs&#x2F;crates&#x2F;curl&#x2F;rev" rel="nofollow">https:&#x2F;&#x2F;lib.rs&#x2F;crates&#x2F;curl&#x2F;rev</a><p>The
    real killer is the oath crate.  Basically every rust project using OAuth is vulnerable.  That&#x27;s
    398 projects on crates.io plus who knows how many binaries (a lot of non-library
    projects don&#x27;t bother publishing to crates.io).<p>Another scary one is &quot;a
    practical HTTP client that is fun&quot; <a href="https:&#x2F;&#x2F;lib.rs&#x2F;crates&#x2F;isahc"
    rel="nofollow">https:&#x2F;&#x2F;lib.rs&#x2F;crates&#x2F;isahc</a> used in 317
    crates including sequoia.  In case you wanted somebody to steal your private keys.'
