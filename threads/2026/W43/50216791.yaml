  text: 'There’s apparently no writeup on exactly what was the fix. So I’m going to
    make a guess that this is the chromium commit that fixed the problem: <a href="https:&#x2F;&#x2F;source.chromium.org&#x2F;chromium&#x2F;chromium&#x2F;src&#x2F;+&#x2F;224140d410af003ca0266a3328accaabd24329f9"
