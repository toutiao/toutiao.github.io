  author: mirashii
  text: I feel as though this should be googlebrotli2shell, not http2shell. Google
    deserves to take a bit of a reputational hit for this. This is a basic memory
    safety violation, from the same organization that does wuffs, that promotes Rust
    for memory safety, that has Carbon. zstd has high quality rust implementations
    and is from roughly the same time.<p>On top of that, the brotli library saw no
    releases for almost a full year, with the fix for this vulnerability being committed
    back in February. Google builds from main for all their projects, so were unaffected,
    but open source releases are a complete afterthought. Over 100 commits with miscellaneous
    fixes left languishing until a security incident forces a release.
