  author: owls-on-wires
  text: Physics and known-constant problems were definitely the focus. My ambition
    was to create a fast algorithm that could pull out a nice, “natural-looking” equation
    from (potentially noisy) data, if one existed. Model ranking and selection, coefficient
    snapping, noise robustness, and the search patterns were all designed to that
    end.<p>For that reason, it does terribly on the SRBench black-box track (it doesn’t
    like to produce long, overfit models), but (to my knowledge) it scores the highest
    on exact symbolic recovery, and even with noise it can often find the answer in
    under 10s (single-thread, no GPU).
  score: 0
