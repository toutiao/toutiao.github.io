  author: saithound
  text: 'PySR itself is still alright, mostly because of previous development. But
    not for long. Quality control has collapsed, and e.g. the examples in the repo
    are now embarrassing vibeslop.<p>Pangram reports 100% AI on most comment blurbs
    in the examples directory. That in itself is not the problem, AI-generated code
    could still be valid. But in this case, the AI-generated examples have the characteristic
    shape of slop: plausible sounding technical jargon, combined with zero actual
    understanding of either the target domain, or even evolutionary search (loss function
    design). They were vibed by people who had no idea what they were doing.<p>I suggest
    taking a look at the &quot;evolved PRNG&quot; example [1].<p>First, its loss function
    is basically designed to reward discovering linear feedback shift registers (LFSRs)
    only. It deliberately gives a massively lower loss to LFSRs than most other functions.<p>The
    AI slop phrased this in terms of &quot;certifying the period&quot;, but the period
    certificate used only identifies LFSRs of max period, is unsound on the rest of
    the search space, and gives a meaningless very high loss to most non-LFSRs. So
    the regression will almost always just return an LFSR.<p>Whoever designed the
    example (Codex I suppose) also knew that most LFSRs are defective, and make poor
    random number generators. Thus, they included a &quot;shear&quot; penalty to detect
    such defective LFSRs, but of course they slopped it together.<p>The 360 correlations
    they measure should have been added together (having just one strong correlation
    is bad, and having two strong correlations is twice as bad as havin one). Instead,
    they take the MEAN of the correlations, so a perfect correlation contributes only
    1&#x2F;360=0.00278 to the loss.<p>And indeed, the result of their example run,
    reported in the docs [2] has such a perfect correlation: bit 29 is copied to bit
    31 every two iterations.<p>[1] <a href="https:&#x2F;&#x2F;github.com&#x2F;astroautomata&#x2F;PySR&#x2F;blob&#x2F;master&#x2F;examples&#x2F;prng_period.py"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;astroautomata&#x2F;PySR&#x2F;blob&#x2F;master&#x2F;examples&#x2F;p...</a><p>[2]
    <a href="https:&#x2F;&#x2F;pysr.ai&#x2F;v2.7.0&#x2F;examples&#x2F;objectives#inventing-a-pseudorandom-generator-with-no-target"
    rel="nofollow">https:&#x2F;&#x2F;pysr.ai&#x2F;v2.7.0&#x2F;examples&#x2F;objectives#inventing-a-pseud...</a>'
