  text: 'I believe I wrote the second deterministic algorithm for SR<p>- FFX (Fast
    Function eXtraction) was the year before or so.<p>- PGE (Prioritized Grammar Enumeration)
    won best paper at GECCO 2013<p>I go into the problems and causes in my paper:
    <a href="https:&#x2F;&#x2F;github.com&#x2F;verdverm&#x2F;go-pge&#x2F;blob&#x2F;master&#x2F;pge_gecco2013.pdf"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;verdverm&#x2F;go-pge&#x2F;blob&#x2F;master&#x2F;pge_gecco2013...</a><p>And
    took a stab at vibe coding with a tiny LLM to port it to JAX: <a href="https:&#x2F;&#x2F;github.com&#x2F;verdverm&#x2F;pge-jax"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;verdverm&#x2F;pge-jax</a> I&#x27;ll
    put some more effort (tokens) into this and get it added to SRBench.<p>Fundamentally,
    most of GP based SR research fights issues with the algorithm (loss of diversity,
    equation bloat, premature convergence). I have not seen the field really adopt
    a new mentality in the 13 years since, not that I have been paying close attention,
    but I do look at the papers in GECCO GP track from time to time.'
