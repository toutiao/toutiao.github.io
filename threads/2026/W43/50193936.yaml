  author: ggm
  text: In the old Tsukiji market you walked past wooden boxes of the flakes wafting
    gently in the breeze and saw people milling them with green enamelled powered
    industrial bench planes, while cooking gas powered market trolleys trundled around,
    with curious drum like round control panels shifting frozen tuna sides and boxes
    of abalone. I&#x27;ve never seen those motorised carts anywhere else.<p>the stuff
    we buy in packets here in oz must suffer in transit and packaging, they are shattered
    fragments but they still waft gently in the steam of a bowl of salmon and rice.<p>The
    bonito shavings reminded me of the litter around a wood turners lathe. Waste there,
    but here the point of the exercise.<p>I think I&#x27;ve had them served as a garnish
    on Oden. They dance.
