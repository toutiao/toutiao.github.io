    # How is music possible

    [

    ](https://substack.com/@henrikkarlsson)

    [Henrik Karlsson](https://substack.com/@henrikkarlsson)

    [

    ](https://substackcdn.com/image/fetch/$s_!jv_m!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffefd7c8e-1e7a-4602-97b3-3565e99383c9_1920x1551.png)

    ###### _Woods near Oele_, Piet Mondrian, 1908

    * * *

    If there is a rapid change in the weather, we can sometimes receive faint radio signals from Poland or Lithuania on the island, once even Finland.[1](#footnote-1) Out of nowhere these unfamiliar soundscapes will enter the car, evoking worlds I know little about—then we’ll make a turn down the hill, and they’ll be gone.

    Today, we listened to Swedish P2, where they were playing a mixtape that Sara Parkman had put together of folk music from around the world. I looked in the rearview mirror and saw that Maud, our nine-year-old, had closed her eyes. She does that when something is particularly good. It makes her see things, she says. Little films. Though she won’t say what they are. Parkman played a Sámi joik that had been recorded in Moscow a few months after the collapse of the Soviet Union,

    and I turned off the main road, down one of the gravel paths through the beech forest, so I could slow the car to a walking pace and really listen. Rolling my window down and leaning out, I looked up at the slowly passing trees—they looked otherworldly wrapped in this music. I had never seen them like that before.

    How is it possible for music to alter the world like this? It’s like when you take a scene from a horror movie and add funny music and the killer suddenly looks hilarious. Isn’t it strange that that happens? Why can we put certain sounds together that make the trees feel unfamiliar? Music is tones and rhythms in various mathematical relationships to each other—it is almost pure abstraction.[2](#footnote-2) Why should _that_ move us? It is a realm of patterns largely independent of outside reality, and yet, when Maud closes her eyes, the music leads her somewhere, to some inner landscape.

    How can these landscapes arise?

    ## Very brief notes on music psychology

    Looking into it a little bit, I get the impression that people who study musical psychology are fairly confused about this, too. There are, as I interpret it, two broad families of perspectives. One, the more traditional, suggests that music works roughly the same way as painting. We have a very sensitive auditory processing system in our heads that helps us keep our bearings in the world, especially the world of social relationships. We can tell from the sound if something is far away, [approaching or leaving](https://www.tandfonline.com/doi/abs/10.1207/S15326969ECO1302_2), and [infer the size and shape of a space from its echo](https://pubmed.ncbi.nlm.nih.gov/27834730/). We can tell what someone is feeling from [the slightest pause or change in tone](https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0027256). And music, according to this theory, plays around with these perceptual systems and expectations. For example, if we are sad [we might speak with melodies that contain a lot of minor thirds](https://pubmed.ncbi.nlm.nih.gov/20515223/)—and so if we play that interval on a piano, our brains will pattern match that as sad. Music is complex patterns of sounds that trigger various things like that, weaving together a series of emotional and spatial cues into something we interpret as a mood or a story or a landscape. It is a way of hacking our biology to produce novel experiences, allowing us to travel far outside the realm of landscapes that exist in outside reality.

    This story is somewhat complicated by studies that show that the way we experience and interpret sound depends a lot on what culture and music we grew up surrounded by. The sorts of results I’m referencing in the last paragraph tend to come from studies done on people who live in the West, often specifically students at the US universities where many of these studies are done—not a very representative sample. And when music psychologists bother to go out in the field and ask, say, The Kalash of northwestern Pakistan, how they experience music, the results can contradict the theories quite a bit. The Kalash, for instance, [rate minor chords as positive](https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0244964). Major chords (which is what people who grew up hearing Western music tend to rate as positive), the Kalash instead describe as “strange,” rating them as less pleasant to listen to than “the most dissonant [of] all the possible tetrachords possible within the octave”. So it’s not a simple story of music pushing certain buttons in us. It is, from this second perspective, some messier kind of thing where our innate capacities to read sound are shaped by associations and norms until we can sense certain landscapes in the music.[3](#footnote-3)

    I notice I’m not very satisfied by these sorts of explanations, though. I mean, when Maud performs with her choir, they have these sections where the audience joins in the singing, and when I mumble my way through these Danish hymns I don’t know and look around at the other villagers, all singing about the beauty of leaves in spring or some such thing—I can never keep myself from crying. To explain that by saying that the music is manipulating the audio processing circuits in my brain feels too thin compared to the vastness of that experience. I will look around at the faces of the people congregated in the community center, strangers whom I normally only see at the store or passing by in cars, and suddenly I feel so close to them—they, too, are afraid of death and feel a deep joy when spring arrives and a sadness late at night when they have nobody to talk to. In other contexts, we would never express these things among strangers. If one of them comes to my house to fix the plumbing, we’re polite with each other and money changes hands, but we would never ever drop our guards and share our humanity with each other, it is unthinkable—except when we’re singing.[4](#footnote-4) Somehow music lets us feel a wide-open connection both to ourselves and others, a connection that would be too scary and intimate in other situations. And that doesn’t feel at all like “the overtones of the chords creating dissonances that we experience as tension” and “the reward center getting activated.” It feels divine.

    ## Metaphysical theories of music

    Experiencing music can give us the feeling that we are confronted with “the deepest recesses of our nature,” as Schopenhauer put it. His explanation for that feeling, by the way, was very different from the accounts I’ve given so far. He didn’t merely think music evoked emotions; he thought music and emotions were _both_ evoking something, and evoking the same thing, something more fundamental than both. Let me give his theory as an example of how people have gone about attributing music to sources outside normal reality.

    For Schopenhauer, the world that we perceive—all the objects and events—is the outward manifestation of an underlying reality he called _Will_. And music, he thought, is unique among the arts because unlike painting and narrative, which depict the trees and people and situations that the Will manifests itself as, music depicts the Will directly; the other arts “speak only of shadows, but [music] speaks of the thing itself.” Since humans are also manifestations of the Will—we experience its force as desire and frustration and effort and so on—we recognize our deepest nature in the emotions evoked by music because… music is a representation of the same thing as us.

    There is something obviously kind of bonkers and tautological about this sort of explanation. But I have to admit that it does match how music feels to me. When I hear a piece that I get overwhelmed by, there is precisely this sense of stripping away the veil
