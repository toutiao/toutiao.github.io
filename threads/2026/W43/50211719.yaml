  author: lo_zamoyski
  text: Music is not &quot;pure abstraction&quot; detached from concrete reality.
    Music has objective properties communicated via audible medium, and what&#x27;s
    more, of a quantitative nature. It expresses order. The more beautiful music is,
    the more integrity, proportion, and clarity it has.<p>Indeed, we might say music
    moves our senses and through them shifts our passions; our intellects through
    expressed order and pattern which we abstract from it; and our wills by appealing
    to our desire for beauty. Accordingly, we can rank music based on where the effect
    is greatest. Does it appeal more to the carnal or to the higher faculties?<p>That
    neurons play a role is not at odds with the above. It is fallacious to lump the
    existence of neurons and their role in human apprehension of reality with some
    kind of intellectually poor metaphysical stance like materialism.
  score: 0
