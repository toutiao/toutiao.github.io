  author: scarecrowbob
  text: 'One thing I have found in playing a lot of jazz off of lead sheets is that
    while you can really play some deep and idiomatic music in all the jazz forms,
    it&#x27;s almost impossible to recreate much of modern rock by compressing it
    to a lead sheet.<p>Especially with the less progressive forms of rock that I enjoy
    more than the &quot;pedantic&quot; stuff (like various flavors of progressive
    metal), it gets hard to make &quot;the thing&quot; based off of a reduction of
    the music to a form.<p>Like, you can play the fully-notated versions of metallica
    songs and pull them off, but without a whole lot of notation and rehearsal you&#x27;re
    going to have a hard time getting &quot;the thing&quot;.<p>And you&#x27;re really
    going to have a hard time pulling off the noisy parts of Neutral Milk Hotel I
    loved so much without notating a whole lot of that noise which becomes important
    to the work- so much so that in those generas people don&#x27;t even bother to
    play other peoples&#x27; work because you only get into an uncanny valley around
    the artist&#x27;s affective presentation and personality.  That might be the excess
    you&#x27;re describing as &quot;more than&quot;- I&#x27;d point you to Georges
    Bataille if you&#x27;re actually interested in that kind of thing.<p>What I enjoy
    about that noisy music is the noise, which is difficult to notate and compress
    and transmit to other musicians; from where I stand as a musician, noise is what
    is lost when the art is compressed to its formal notation.<p>With all the older
    blues and jazz forms I enjoy (Django or Louis Armstrong or Danny Barker) I can
    get on stage and perform fairly complex music with minimal or no rehearsal- as
    long as someone knows the melody the tunes are playable.  The &quot;essential&quot;
    parts of the music are not simple, but there is a lot of history and education
    in the players about how to properly rehydrate the music.<p>I wouldn&#x27;t say
    that old jazz music or the musicians are &quot;good-er&quot; than the rock and
    metal folks, though most of the jazz musicians I know also do play pop gigs while
    pop musicians might have a harder time sitting in.<p>But it&#x27;s just not as
    fun to solo over the changes to Iggy Pop&#x27;s &quot;I wanna Be Your Dog&quot;
    or the Ramones &quot;I wanna be sedated&quot; and the skill sets for being able
    to come up with a part on the fly are different than they are for prodigiously
    performing a piece note-for-note (which is the same in classically oriented music
    as it is in indy rock bands, though the memo-ization methods are much different).<p>While
    I can&#x27;t say the music is better, I personally find the chord progressions
    of older jazz forms easier to solo over because they have more interesting (to
    me) features.  Lately I have a harder and harder time finding engaging-to-me things
    to play over a 2 chord funk jam or a 3 chord country song, whereas I really enjoy
    blowing over stuff like Basin St. Blues or Nuages.<p>My point being that the decoders
    for these improvisational forms often are doing a lot more interpretive work in
    decompressing a lead sheet out into music-in-the-world than the folks who are
    playing note-for-note parts that they&#x27;ve worked out from recordings and that
    are specific to the tune.<p>Since the decoders are doing more work, the music
    becomes quite a bit more &quot;compressible&quot; while retaining a lot of its
    complexity.  &quot;Autumn Leaves&quot; is not &quot;simpler&quot; than &quot;I
    Wanna Be Sedated&quot;, but it more easily compresses into a transmittable form
    without losing that essential excess that makes me like the Ramones.<p>With the
    jazz or blues or bluegrass or old-time or older country dance music or folk, the
    decoders only need someone in the band who knows (most of) the chords and the
    lyrics and the complexity of the resulting music is largely up to how the folks
    playing it decide to play it.<p>Tonight I am playing pedal steel at a dance and
    have never played with the band, and that&#x27;s not big deal because a) I have
    stored reduced versions of the tunes in my body and b) I have a bunch of strategies
    for quickly decoding what the other musicians are doing and responding appropriately.<p>But
    the music itself isn&#x27;t simple.  &quot;Friends in Low Places&quot; (and much
    of country and western swing) has more in common with older jazz than with modern
    rock, and I have worked with a lot of truly bad musicians who think that because
    a lot of the songs are 3-chord tunes the music doesn&#x27;t require some attention
    to play idiomatically.<p>So with music, it&#x27;s easy and fun to add the noise
    back in if you know what to add, but it&#x27;s not (in my opinion) the case that
    &quot;simple&quot; music is easily compressed: the &quot;simpler&quot; the music
    is (at least in the west) the more it relies on the specifics of the noise it
    produces in order to create its artistic effects, and thus simpler music less
    compressible.<p>So from my standpoint, it&#x27;s very difficult to compress good,
    &quot;simple&quot; and &quot;noisy&quot; rock music, whereas the more specific
    designs of stuff like jazz is much easier to compress and transmit.'
  score: 0
