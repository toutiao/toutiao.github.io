  author: moefh
  text: 'I think you misunderstood the comment you&#x27;re replying to.<p>They meant
    (like Wikipedia says) that traditionally a tetrachord <i>spans</i> a perfect fourth
    (i.e., that&#x27;s the interval between the first and last notes), not that it&#x27;s
    a stack of perfect fourths.<p>As to the original point, any discussion about dissonance
    of chords is meaningless without mention of temperament: in the modern tuning
    system (equal temperament[1]) both major and minor triads are pretty dissonant,
    look at the thirds at the table in the section named &quot;Comparison with just
    intonation&quot; in that Wikipedia page.<p>We have been dealing with the tension
    between keeping thirds and fifths pleasant for centuries: very roughly, people
    used meantone temperaments[2] in the Renaissance (which had perfectly tuned thirds),
    then came the era of well temperament[3], and eventually we settled for the simpler
    equal temperament we use today with its nasty thirds (it has several other advantages,
    but &quot;having pleasant major and minor triads&quot; is not one of them).<p>[1]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Equal_temperament"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Equal_temperament</a><p>[2]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Meantone_temperament"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Meantone_temperament</a><p>[3]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Well_temperament" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Well_temperament</a>'
