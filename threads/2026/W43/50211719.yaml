  author: zahlman
  text: Thanks for filling in the detail.<p>It&#x27;s explained in the article, but
    I want to emphasize that &quot;well temperament&quot; was not a single thing,
    but various separate attempts at compromise. Bach wrote <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_Well-Tempered_Clavier"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_Well-Tempered_Clavier</a>
    seemingly to celebrate the idea of tunings that sound acceptable in every key
    (without the wolf fifths of meantone temperaments), but it&#x27;s not at all clear
    what specific tuning he had in mind, if any:<p>&gt; During much of the 20th century
    it was presumed, possibly mistakenly, that Bach intended equal temperament, which
    after Bach&#x27;s death became popular as the standard keyboard tuning, and had
    been described by theorists and musicians for at least a century before Bach&#x27;s
    birth. Accounts of Bach&#x27;s own tuning practice are few and inexact. …Despite
    the presumption of equal temperament, research has continued into various unequal
    systems contemporary with Bach&#x27;s career; there is debate whether Bach might
    have meant a range of similar temperaments, perhaps altered slightly in practice
    from piece to piece, or possibly some single, specific, &quot;well-tempered&quot;
    solution for all purposes…<p>Personally, while I know on some academic level that
    our 12edo minor and major thirds are off by something like 14 cents, they don&#x27;t
    sound unpleasant to me. I think it takes a specific sort of ear training to become
    really, er, attuned to purely consonant intervals and to notice dissonance on
    that level (which only produces real clashes in the higher harmonics).
  score: 0
