  author: triMichael
  text: I&#x27;ve had a theory for a while now that music is related to Kolmogorov
    complexity, or in other words how compressible it is. Random noise that we find
    unpleasant is very incompressible. On the other hand, simple sound patterns that
    we find boring such as Do Re Mi is very compressible. What we call music sits
    in the middle, and is maximizing the amount of signal. In this way, we can view
    humans as information seeking machines, which is why we like music.
  score: 0
