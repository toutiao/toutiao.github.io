  author: NyxWulf
  text: Many schemes do exactly this, if all you are doing is single table inserts
    that works pretty well.<p>If you do anything that creates related records via
    foreign keys you start to run into lock contention. For example:<p>If your insert
    requires a parent record with a single child record, you have to get the next
    sequential id which involves a non-preemptable single threaded lock, increment
    it, and send it back to the connection which requested it.  In most databases
    this would mean writing the parent record and getting the sequential id of the
    parent record back so you can set the foreign key reference on the child record.  Stored
    procedures are one way to mitigate the network transit time, but they don&#x27;t
    solve the single threaded lock acquisition time.<p>The reason most distributed
    systems use UUIDs or another flavor of distributed id is so you can generate the
    id for the parent record on the client, set the foreign key there as well, then
    send both records in as simple inserts.  It&#x27;s not that there aren&#x27;t
    ways to work around it or mitigate it.  Using a coordination free id, is just
    much easier to work with and scale in practice.
  score: 0
  posted_at: '2026-10-23T20:46:09Z'
- id: '50215229'
