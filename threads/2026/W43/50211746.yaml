  author: NyxWulf
  text: The biggest advantage I&#x27;ve seen for UUID come with distributed systems
    imo.  The ability to create an id without lock coordination allows for much easier
    horizontal scaling.  UUIDv1 avoids the collision issue by using a portion of the
    MAC in the id, but v1-4 all have sorting issues.  UUIDv7 is a good choice if your
    use case warrants it.  If you can get away with a single integer field like a
