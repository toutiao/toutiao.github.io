  author: NyxWulf
  text: In my testing the primary bottleneck isn&#x27;t about writing to the same
    partition.  Lock coordination to increment the serial key, then send it back across
    a connection was the real culprit.  Virtually all databases make updates into
    RAM and to a write ahead log, which is then spooled to disk in the background.  No
    matter which pages are written or updated, the changes all go sequentially in
    order into the WAL.  For me, getting rid of Serial Keys was the big hot spot in
    processing.  YMMV.
  score: 0
