  text: I feel like this article way downplays the entire point of UUIDv7s, which
    is that it lets you sort (and store!) your data <i>kinda sorta</i> by creation
    time, no overlap ever. That&#x27;s great for cursors, for streaming data, for
    twitter clones, for chat messages, for player moves, and so on and so forth. Nearly
    everything that&#x27;s vaguely realtimey that you might like to both persist and
    broadcast live to other clients, and displayed in a stable &amp; reasonable order,
    benefits from a property like this.<p>In fairness, he does mention this, but squeezes
    it into a single sentence near the end. But eg the fact that you can&#x27;t reliably
    extract the precise timestamp from the UUIDv7 is a feature, not a bug. It&#x27;s
    either that or collisions and you don&#x27;t want the collisions.
