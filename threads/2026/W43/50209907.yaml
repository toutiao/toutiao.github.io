  text: It feels clear to me that smaller models are moving parameter-level thinking
    into inference time. i.e. they use more tokens to perform computation because
    they don&#x27;t perform it in the model itself. There&#x27;s some conservation
    of difficulty for tasks and you either do the computation in the model or you
    do it in the looped iterations of the model.<p>This is why the massive tok&#x2F;s
    you see on many small MoE never manifest as worthwhile outcomes. Sonnet 5.5 can
    be faster on tasks than DeepSeek 4 Flash Vision simply because it gets there faster.
