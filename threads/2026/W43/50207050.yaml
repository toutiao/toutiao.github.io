    70% contribute and 30% receive, without either increasing `x` or reducing `y`.<p>You
    could have planned ahead for this long ago, and seen that the ratio was going
    to change and increased `x` over time accordingly or planned to reduce `y` over
    time accordingly.  But we didn&#x27;t, and mostly no one else has either."
