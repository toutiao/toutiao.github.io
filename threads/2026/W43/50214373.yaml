  author: eiopa
  text: "ok I read up on the sandbox. \nIIUC, this applies to the installer&#x2F;formula
    part. The app itself is still unsandboxed.<p>I can see that it closes one vector
    of attack (attacking the install script serving), but beyond that the user still
    runs the binary outside a sandbox.<p>I feel that the binaries themselves, both
    directly and indirectly (supply chain attack) are the elephant in the room.<p>Any
    thoughts on that?\nI always wished the cli stuff I install from Homebrew was locked
    down by default, but it&#x27;s not practical with today&#x27;s computer systems
    since it kills usability.<p>Anyway, big fan of Homebrew. Looks like I can&#x27;t
    submit a formula to core until I get more traction on GitHub (stars&#x2F;forks&#x2F;watchers).
    \nOtherwise I have to go to taps which takes away a lot of the benefits of being
    on homebrew-core iiuc."
