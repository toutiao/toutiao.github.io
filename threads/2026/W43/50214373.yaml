  content: |-
    ## keeps watch

    Every agent, what it's doing, and who needs you.

    - ▶ working

    - ● needs you

    - ● finished

    - ○ idle

    ## agent aware

    - ▶ working

    - ● needs you

    - ● unread

    - ○ clear

    F1 to catch up.

    - Claude Code

    - Codex

    - Pi

    - OpenCode

    ## new tab agent

    Ctrl-T to jump into work, new or old.

    Use your existing accounts. All of them.

    ## top for your tokens

    Where did the tokens go?

    ## activity tracking

    Hover an agent to see what it did.

    ## Keep ’em running

    Like tmux, your agents and processes keep running in the background.

    corgi and you’re in.

    ## see their changes

    Every file it touched, in one scroll.

    ## worktrees

    Fantastic trees and where to find them.

    ## clever corgi

    Organizes your workspaces for you.

    ## resource usage

    Per workspace, live.

    ## embraces the modern terminal

    ⌘V just pastes an image, even on SSH*.

    Links you can copy.

    Images you can see.

    * Requires Ghostty Nightly.

    ## Tab Tricks

    Undo tab closes with Ctrl-Shift-T.

    ## ssh friendly

    Image paste just works* with ⌘V. On a slow link, Corgi keeps pace.

    plain ssh

    corgi

    * Requires Ghostty Nightly.

    ## hackable

    Drive Corgi from any terminal. corgi --skill teaches your agents.

    ## keyboard and mouse

    Corgi loves both.
