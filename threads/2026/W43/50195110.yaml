    being completely honest here.<p>Clearly there is a fundamental problem with the
    overarching approval and monitoring process which means it could have happened
    anywhere. This time it just happened to be India.<p>Secondly, in direct reference
    to the <i>&quot;far away company&quot;</i> comment India does have quite strict
    controls on both certain technical things (speaking generally here, not specifically
    in relation to certs ... e.g. use of sat phones).   And in general it is quite
    difficult (read: almost impossible) to turn up in India and do business as an
    external company.  So there is probably a genuine need for an Indian company CA
    since not every body can&#x2F;wants to use Let&#x27;s Encrypt or whatever.'
