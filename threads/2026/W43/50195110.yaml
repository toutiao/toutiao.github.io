  text: 'Yes, its all very well someone here shouting about &quot;the absolutely brutal
    question battery the Chrome team publicly submitted to eMudhra&quot;.<p>But in
    all honesty there are serious questions to be asked about:<p>a) The initial approval
    process for <i>ANY</i> CA<p>b) The ongoing monitoring process for <i>ANY</i> CA<p>The
