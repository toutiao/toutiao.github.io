  text: I am a Python programmer. I love Astral; I think Ruff is great and uv is life-changing,
    but I don&#x27;t actually like ty that much.<p>I want my type checker to check
    types and to scream at me when it can&#x27;t. I don&#x27;t want it to do &quot;gradual
    typing&quot;, if it is unsure about what type something is, I want that to be
    a failure instead of it modeling the unsureness and not showing potential errors.
    We live in the age of agents, having to add an extra annotation here and there
    is not so much of a problem any more.<p>Meta&#x27;s Pyrefly largely does what
    I want. I don&#x27;t quite love Pyrefly either; I don&#x27;t like the fact that
    it edge-cases and gives monopoly status to some popular packages (Pydantic, Django,
