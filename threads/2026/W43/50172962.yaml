  author: hobofan
  text: The only major opinionated tools that were in use prior to uv were Conda,
    Pipenv and Poetry (- ignoring pip here, as it&#x27;s mainly a package installer).
    None of them contributed towards PEP 518 (Conda significantly predated it, and
    Pipenv actively created a competing format even though the PEP already was accepted).<p>Most
    of the lessons that make uv good can be directly traced back to Cargo (which in
    turn can be traced back to Bundler). The main portions from the Python side that
    helped it have a good foundations were standards work (PEPs), none of which were
    driven by the people behind any of the three &quot;major&quot; package managers.
