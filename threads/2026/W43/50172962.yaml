  author: zahlman
  text: 'I work with Python today without type annotations, don&#x27;t find that kind
    of type tracking difficult at all, nor do I find the annotations worth the effort.
    The questions I&#x27;ve seen over the years, meanwhile, from people trying to
    force the annotation system to do strange things, have suggested to me that people
    are creating far too much complexity for themselves. Incidentally, IMX, ChatGPT
    usually writes un-annotated new code unless you specifically ask for annotations.
    And it can easily refactor that un-annotated code, too.<p>Annotations are ignored
    by the compiler (except insofar as they require adding some attributes to objects)
    and do not guide the bytecode-compilation process or empower any kind of optimization
    (without a dedicated third-party system like mypyc). Nor are they relevant to
    PyPy. They are not even free abstractions: as mentioned some objects gain additional
    attributes (in case you want to introspect something at runtime, but you usually
    don&#x27;t), and e.g. calls to `typing.cast` still have to be looked up and made
    even though it&#x27;s explicitly intended as a no-op. Plus, expecting annotations
    to reflect types that can be statically checked gets in the way of <i>other</i>
    interesting uses of annotations (and the original PEP explicitly designed with
    other use cases in mind).<p>I have been using Python for over 20 years. If anything,
    my attitude has become further against type annotations in the last few.'
  score: 0
