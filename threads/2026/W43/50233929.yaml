  author: retrac
  text: |-
    I&#x27;ve been reading about the early history of the Internet.<p>The first ARPANET link to the United Kingdom required an exception to UK law.  The traditional interpretation was that the state telecom monopoly (the General Post Office) had a monopoly on data transport.  It was assumed that national governments have an absolute sovereign right to inspect data packets at the border, just like they do mail and parcels.  That includes searches and seizures of foreign propaganda, material illegal under domestic law, etc.<p>&gt; In early 1971 Larry proposed to break the circuit and connect in the NPL
    network to the ARPAnet. Unfortunately for that plan (but not for me), at this time the British government was trying to get the United Kingdom into the European Economic Community (EEC). The EEC governments, particularly France, were in any case suspicious of U.K. links with the United States. It was therefore politically impossible for NPL to be linked directly to a U.S. defense project. [1]<p>But the Internet was an experimental network.  An exception could be made.  Everyone would pretend that they were inside the United States legally speaking.  This sort of worked when everyone was an academic restricted by network access policies of their institutions.<p>&gt; I set up a Governing Committee, with the funding partners on it: Ann Letts represented the BPO, Donald Davies represented the NPL, and I was the Chair. Because of the questionable legality of what we were doing, all proposed users had to be approved individually. I put in security procedures so that all users had to log-in, with a password, on our relay.<p>[2]<p>This is related to the protocol wars of the 1980s.  The X.25 protocol that was supported by all the established telecoms providers, included mechanisms for packet authority, automatic packet billing, and political boundary packet inspection mechanisms. [3]<p>X.25 was decried as too centralized, too complex, and too centred around the interests of the established telecoms.  (Which it was.)  TCP was better for both technical and political reasons.  But the Protocol Wars were not a permanent victory.  It was a wonderful moment in world history but the underlying tensions have resurfaced.<p>[1] <a href="https:&#x2F;&#x2F;www.researchgate.net&#x2F;publication&#x2F;224386328_The_early_history_of_packet_switching_in_the_UK_History_of_Communications" rel="nofollow">https:&#x2F;&#x2F;www.researchgate.net&#x2F;publication&#x2F;224386328_The_early...</a><p>[2] <a href="http:&#x2F;&#x2F;www0.cs.ucl.ac.uk&#x2F;research&#x2F;darpa&#x2F;internet-history.html" rel="nofollow">http:&#x2F;&#x2F;www0.cs.ucl.ac.uk&#x2F;research&#x2F;darpa&#x2F;internet-history.htm...</a><p>[3] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;File:Internet-OSI_Standard_War.jpg" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;File:Internet-OSI_Standard_War...</a>
