  author: stackghost
  text: In the late aughts and early 2010s I and a few other people came up with the
    `darknet plan` aka `project meshnet` which was a subreddit and adjacent communities
    dedicated to creating a completely parallel internet using 802.11s mesh networks
    akin to the Athens and NYC meshes that span a huge portion of those metros.<p>The
    movement eventually got coopted by the CJDNS project and its fans.  Instead of
    a completely separate internet they were advocating more of an overlay on top
    of the existing internet (because that didn&#x27;t require solving interurban&#x2F;intercontinental
    backhaul), which to my mind addresses essentially none of the problems we set
    out to solve, so I eventually lost interest.<p>But today we have things like LoRa
    and a greater hacker community around the ISM bands, which might be just what&#x27;s
    needed.  I have hope one day we can achieve global interconnectivity without rent-seeking
    ISPs.
