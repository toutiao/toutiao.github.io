  author: rramadass
  text: "<i>The faculty of re-solution is possibly much invigorated by mathematical
    study, and especially by that highest branch of it which, unjustly, and merely
    on account of its retrograde operations, has been called, as if par excellence,
    analysis. Yet to calculate is not in itself to analyse. A chess-player, for example,
    does the one without effort at the other. It follows that the game of chess, in
    its effects upon mental character, is greatly misunderstood. I am not now writing
    a treatise, but simply prefacing a somewhat peculiar narrative by observations
    very much at random; I will, therefore, take occasion to assert that the higher
    powers of the reflective intellect are more decidedly and more usefully tasked
    by the unostentatious game of draughts than by all the elaborate frivolity of
    chess. In this latter, where the pieces have different and bizarre motions, with
    various and variable values, what is only complex is mistaken (a not unusual error)
    for what is profound. The attention is here called powerfully into play. If it
    flag for an instant, an oversight is committed, resulting in injury or defeat.
    The possible moves being not only manifold but involute, the chances of such oversights
    are multiplied; and in nine cases out of ten it is the more concentrative rather
    than the more acute player who conquers. In draughts, on the contrary, where the
    moves are unique and have but little variation, the probabilities of inadvertence
    are diminished, and the mere attention being left comparatively unemployed, what
    advantages are obtained by either party are obtained by superior acumen. To be
    less abstract --Let us suppose a game of draughts where the pieces are reduced
    to four kings, and where, of course, no oversight is to be expected. It is obvious
    that here the victory can be decided (the players being at all equal) only by
    some recherche movement, the result of some strong exertion of the intellect.
    Deprived of ordinary resources, the analyst throws himself into the spirit of
    his opponent, identifies himself therewith, and not unfrequently sees thus, at
    a glance, the sole methods (sometimes indeed absurdly simple ones) by which he
    may seduce into error or hurry into miscalculation.<p>The analytical power should
    not be confounded with simple ingenuity; for while the analyst is necessarily
    ingenious, the ingenious man is often remarkably incapable of analysis. The constructive
    or combining power, by which ingenuity is usually manifested, and to which the
    phrenologists (I believe erroneously) have assigned a separate organ, supposing
    it a primitive faculty, has been so frequently seen in those whose intellect bordered
    otherwise upon idiocy, as to have attracted general observation among writers
    on morals. Between ingenuity and the analytic ability there exists a difference
    far greater, indeed, than that between the fancy and the imagination, but of a
    character very strictly analogous. It will be found, in fact, that the ingenious
    are always fanciful, and the truly imaginative never otherwise than analytic.</i><p>--
    &quot;The Murders in the Rue Morgue&quot; by Edgar Allan Poe<p>Now apply the above
    to &quot;complex&quot; (eg. C++&#x2F;Rust&#x2F;etc.) vs. &quot;simple&quot; (eg.
    C&#x2F;Scheme&#x2F;etc.) languages. Note also the different mental modes between
    &quot;constructing a program&quot; (i.e. synthesis) vs. &quot;debugging a program&quot;
    (i.e. analysis).<p>The overall mental model&#x2F;framework must be &quot;simple&quot;
    while its components (layered and treated as black-boxes) can be complex at a
    different layer (eg. DSLs) to which another simple model can be applied recursively.
    It is useless to focus on individual language features while it is all important
    to construct the larger paradigm&#x2F;pattern&#x2F;usage into which those same
    features can be grouped and thought of as a single unit. Always employ top-down
    and stepwise-refinement in thinking."
