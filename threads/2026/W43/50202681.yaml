  author: shykes
  text: The article&#x27;s point that Go is a bad fit for some of the low-level interactions
    with the kernel, is absolutely correct though. We had to do a lot of juggling
    to get it to work properly. But in the end it was fine. I would say it was the
    correct choice of language at the time, and it certainly contributed to Docker&#x27;s
    early success.<p>Another explicit goal was to facilitate contribution. We thought
    Go syntax was &quot;vanilla&quot; enough to attract a broader set of contributors
    than a more niche, opinionated language like Erlang, Haskell, Clojure etc. I think
    that also worked out well - Docker was known for attracting many contributors,
    many of them making their very first open source contributions. We even ran special
    meetups to help people become contributors, that was fun.
