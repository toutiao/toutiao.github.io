    runtime: ruby, python or Java mostly. Shipping a compiled binary allowed us to
    be adopted by all tribes.<p>None of these things can be transposed today, so I
    guess I can&#x27;t answer...<p>For what it&#x27;s worth, my current project (dagger)
    is written in Go.'
