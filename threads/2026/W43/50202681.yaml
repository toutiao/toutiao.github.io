  author: shykes
  text: You are correct :)<p>&gt; <i>the previous generation of the technology used
    by dotCloud [...], which was using LXC with AUFS</i><p>One small note, the earliest
    versions (2007-2011) were based on vserver then openvz, which predated lxc. Back
    then you had to patch the kernel to get container primitives. And since virtualization
    also required patches (eg. Xen), we had to carefully combine both sets of patches,
    which was poorly supported because nobody else was crazy enough to stack 2 kinds
    of virtualization!
