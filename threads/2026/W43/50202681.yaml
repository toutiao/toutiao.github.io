  author: shykes
  text: 'This is incorrect.<p>Docker in its earlier incarnations was based on openvz,
    which predates lxc. The  lxc project was initially a kernel development project:
    a collection of kernel patches to add container support. The userland tool was
    just a companion. When it became apparent that these patches would &quot;win&quot;
    the race to be upstreamed even though openvz was much more mature, we switched
    our tooling to lxc. The patches matured over time, but the userland tool (what
    we now know as &quot;lxc&quot;) was finicky.<p>The original open-source release
    of Docker wrapped lxc for low-level container operations. But it was just too
    unreliable and we swapped it out for an in-house Go implementation called &quot;libcontainer&quot;.<p>As
    for &quot;commercializing&quot;: Docker was famously bad at commercializing anything,
    we open sourced so much (maybe too much) and still people complained that we were
    not open enough.'
  score: 0
