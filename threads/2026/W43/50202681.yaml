  author: shykes
  text: I feel grateful for having seen from the inside one of those rare &quot;hypergrowth&quot;
    moments, it&#x27;s a terrifying and exhausting experience but I would do it all
    over again without hesitation.<p>I also feel lucky that people are still using
    my work, that it endures without me, and that it generates (mostly) positive reactions.
    There was a time where Docker had a lot of haters, which was hard on me. But with
    time I&#x27;ve noticed that the negativity gets mostly washed away, and what remains
    is positive interactions like the ones in this whole thread. So now Docker is
    this cool experience I share with lots of people around the world, and when we
    meet we get to talk about this shared interest. I love it.
