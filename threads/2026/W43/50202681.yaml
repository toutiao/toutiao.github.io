  author: phlakaton
  text: 'I think the key thing for a university student is to get the big ideas down:
    what is a container exactly, how does it work, how does it differ from a VM, what
    assumptions does it make about what you&#x27;re running (and how do you run something
    that doesn&#x27;t fit that pattern), why do images exist in layers and how are
    layers implemented, what are the performance benefits&#x2F;tradeoffs, etc. etc.<p>When
    I was learning Docker I can&#x27;t tell you how many people would describe it
    to me by analogy to a standardized shipping container, and start going off about
    shipping container dimensions and supersized cargo ships and trucks and railcars...
    and finish by smiling beatifically, like they had just explained the whole thing
    in a masterstroke. Let&#x27;s... uh... not do that. :-D<p>In a problem set, the
    student might learn a bit about dockerfiles or docker-compose.yml... but only,
    I think, so they can try building and running a container of their own!'
