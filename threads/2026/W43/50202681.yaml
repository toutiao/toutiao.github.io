  author: shykes
  text: 'Yes, I was around for that. It was one of my skunkworks projects, as I had
    lost formal authority over engineering and product by then, and mostly used my
    &quot;founder aura&quot; to convince small pockets of people within the company
    to build cool things with me.<p>However Moby was a poor choice for a skunkworks
    project, it involved mostly communications and project management, which requires
    consistency and scale. Overall it was poorly executed because I failed to build
    enough support internally (&quot;Solomon&#x27;s at it again, let him do his thing&quot;).
    Here I am trying to explain it on Twitter after the keynote, using a picture of
    a hand-drawn diagram, because nobody in marketing or product was assigned to help.
    <a href="https:&#x2F;&#x2F;x.com&#x2F;solomonstre&#x2F;status&#x2F;855918630915133440"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;solomonstre&#x2F;status&#x2F;855918630915133440</a><p>I
    think the goal of Moby was fundamentally correct: we were trying to replicate
    the Red Hat model, with well-scoped upstream components (linux -&gt; runc, containerd..)
    integrated into a commercial product (Docker -&gt; RHEL), with a faster-moving
    community project in between (Fedora -&gt; Moby).<p>This was a way for us to clarify
    that Docker was a <i>product</i>, with a community of users, and Moby was an <i>open
    source project</i>, with a community of contributors. This clarity was very much
    needed, because different communities were projecting very different expectations
    on the brand &quot;Docker&quot;, and these expectations conflicted with each other.<p>In
    a way, Moby aspired to be what CNCF ended up becoming - the &quot;big tent&quot;
    where the broader community meets to hammer out the general shape of the container
    stack. It seems obvious now that a single company can&#x27;t be the sole authority
    over such a vast scope. But in the first years of Docker, we really did have that
    level of influence, because we literally invented the market, and brought the
    community together in meetups and an ever-growing Dockercon. It&#x27;s only when
    Google and Red Hat pushed Kubernetes and CNCF, that our influence over the stack
    started to wane. Maybe it was for the better, I don&#x27;t know if we would have
    been up to the task as designers and engineers. But at least there would have
    been a consistent design, with a Linus Torvalds figure willing and able to say
    &quot;no&quot; to stupid and redundant features. For a while I played that role
    - but then I was replaced by SIGs and committees.'
  score: 0
