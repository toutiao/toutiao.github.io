  author: ak217
  text: I believe Docker was always called Docker, but it grew directly out of the
    previous generation of the technology used by dotCloud (the company Solomon founded),
    which was using LXC with AUFS.<p>I think the breakthrough with Docker was bundling
    the AUFS-based image layer format with a centralized container image sharing registry.
    This was revolutionary at the time. But another huge element of success was Solomon
    and others evangelizing the technology relentlessly at meetups and conferences.
    I distinctly remember attending a demo in 2012 where the crowd was very excited
    to see the Docker workflow that we now take for granted, in large part because
    Solomon was so good at presenting it. At the time, I was working at a cloud PaaS
    company where we developed a similar technology on top of LXC and BTRFS (but no
    image registry). Docker really made me think hard about what we were doing, although
    I didn&#x27;t end up making any moves.<p><a href="https:&#x2F;&#x2F;jpetazzo.github.io&#x2F;2017&#x2F;02&#x2F;24&#x2F;from-dotcloud-to-docker&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;jpetazzo.github.io&#x2F;2017&#x2F;02&#x2F;24&#x2F;from-dotcloud-to-docke...</a>
