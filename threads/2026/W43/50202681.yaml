  text: '&gt; And if you bothered to look at that comment then why do you ignore what
    &#x27;macvlan&#x27; - which is an actual bridge both in terms of a Linux device
    and the functionality - is not called &#x27;bridge&#x27;?<p>Because renaming things
    that map 1:1 onto the underlying concepts is a terrible idea that makes learning
    and communication harder by introducing ambiguity and indirection. &quot;bridge&quot;
    now means multiple things and not only is it needlessly obfuscated, it&#x27;s
    <i>wrong</i> (explained later). I _hate_ projects that do this.<p>&gt; Because
    you don&#x27;t understand the problem. More so, you ignore the actual question
    there about the broadcast domains.<p>A Docker &#x27;bridge&#x27; network driver
    creates a broadcast domain <i>between containers attached to that network</i>.<p>Rhetorical
    question, maybe it&#x27;ll help you find a source of misunderstanding: Why do
    you expect it to join the broadcast domains of your containers and your LAN? And
    which LAN, exactly?<p>&gt; No, if even if you use a bridge internally when your
    container is on a isolated network which is invisible to anyone on your network
    and the container access the network behind your host through the NAT - this can&#x27;t
    be called a bridge.<p>Your misunderstanding seems to stem from the flawed assumption&#x2F;expectation
    that every container is automatically attached to your LAN. Therefore you incorrectly
    expect and demand that term &quot;bridge&quot; accurately describe the logical
    connection between your container and your LAN.<p>Docker networks are entities
    independent of your LAN, they&#x27;re isolated networks that primarily serve to
    connect containers amongst themselves.<p>A Docker &#x27;bridge&#x27; network is
    not <i>necessarily</i> routed to LAN either so your suggestion of calling them
    &quot;hostnatnetwork&quot; is wrong. Auto-configuration of NAT between the internal
    bridge network and your LAN is just a convenience feature which you can disable,
    it&#x27;s not an inherent property of bridge networks.<p>Disabling NAT for a specific
    brige network (com.docker.network.bridge.enable_ip_masquerade): <a href="https:&#x2F;&#x2F;docs.docker.com&#x2F;engine&#x2F;network&#x2F;drivers&#x2F;bridge&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;docs.docker.com&#x2F;engine&#x2F;network&#x2F;drivers&#x2F;bridge&#x2F;</a><p>Disabling
    auto-configuration of all firewall rules: <a href="https:&#x2F;&#x2F;docs.docker.com&#x2F;engine&#x2F;network&#x2F;packet-filtering-firewalls&#x2F;#prevent-docker-from-manipulating-firewall-rules"
    rel="nofollow">https:&#x2F;&#x2F;docs.docker.com&#x2F;engine&#x2F;network&#x2F;packet-filtering-fire...</a><p>&gt;
    But hey, I&#x27;m just knowledge lacking guy without experience at all, just yesterday
    saw a computer a first time in my life, sure, sure.<p>No I didn&#x27;t say that,
    I think you suffer from the curse of having a lot of previous experience in an
    adjacent area where you built a strong mental model of how things ought to work,
    but now you&#x27;re trying to forcefully apply this same mental model onto Docker.<p>All
