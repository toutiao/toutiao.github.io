  author: saghm
  text: 'How would you even know whether you knew the facts? It sounds like what you
    knew was more than just consistent with there being no embargo, you were explicitly
    told there was no embargo. After a certain point, there&#x27;s a limit to how
    far up the chain any of us can be expected to follow the logical chain of what
    we genuinely think are true, and this doesn&#x27;t seem like a glaringly obvious
    case where you were being reckless.<p>We&#x27;re all (well, I guess not <i>all</i>,
    but the group that&#x27;s worth caring about, and I hope it&#x27;s at least most)
    just operating the best we can on the information we have and trying to make decisions
    based on that. As long as you&#x27;re acting in good faith on information that
    you had genuine basis for believing is true, it seems like it would be unreasonable
    to expect someone in your situation to somehow intuit that you were given false
    information or grossly misunderstood what sounds like a pretty straightforward
    declaration of fact from someone you didn&#x27;t have any reason to doubt.<p>At
    the risk of some armchair paycholoanalysis because it does seem like you genuinely
    feel some guilt over this: I can emphathize feeling guilty about the outcome of
    an action that in a vacuum would not have been hard to make differently, but my
    experience is that those of us who have a nasty habit of beating ourselves up
    over things when we really don&#x27;t have much blame will often recognize when
    on the other side that it would not be fair to hold someone else to that standard.
    I struggle a lot with how sometimes knowing something is true doesn&#x27;t always
    make it <i>feel</i> true, and even though hearing someone else saying it doesn&#x27;t
    magically make it all better, I still think it&#x27;s valuable to hear it from
    someone else, so if I happen to be right about how you&#x27;re feeling, nothing
    about all of this is your fault, and to the extent that you&#x27;re able to, try
    not to beat yourself up over your misfortune to get caught in the middle of all
    this due to circumstances that realistically were outside your control.'
