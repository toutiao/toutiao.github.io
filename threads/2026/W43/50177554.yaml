  text: Brazil is almost an undiscovered country for the international bicycle-travel
    community. Long-haul South American routes go down the west side of the continent.
    Historically this was blamed on Brazil&#x27;s roads being regarded as unusually
    narrow and dangerous. However, in the bikepacking era when lots of people want
    to ride rough tracks, not roads with many vehicles, it&#x27;s odd that no such
    rough routes across Brazil have become popular among cyclists coming to the region
    from elsewhere.
