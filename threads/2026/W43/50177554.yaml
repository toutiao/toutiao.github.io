  author: jaza
  text: Cycling through the Andes mountains is far more appealing to most people than
    cycling through the Brazilian savanna is, for various practical reasons. Steep
    and windy vs flat and tedious. Sweeping varying scenery vs close-range monotonous
    scenery. Sometimes cool vs always hot. Dry dirt (in dry season at least) vs muddy
    dirt. Less bugs vs more bugs. Less (although still quite a few) infectious diseases
    vs full-on tropical infectious diseases.
