    |\n\nWhite noise machines are widely used for sound masking, increasing privacy
    in offices and helping people sleep. The [classic approach](https://www.nytimes.com/2018/12/27/style/white-noise-machines.html)
    is a fan in a box, though in the past ten years people have mostly switched over
    to electronic ones. But a fan is really a great approach; you just need to put
    it to better use: have the fan clean the air.\n\nInstead of spinning a fan in
    free air to make noise, you can have it pull air through a filter. A small purifier
    sounds a lot like a classic noise machine, is only a bit larger and more expensive,
    and removes smoke and infectious particles from the air. For example, [here's
    a $47 purifier](https://www.amazon.com/LEVOIT-Purifiers-Freshener-Core-Mini/dp/B09GTRVJQM/?th=1)
    with a 6.5\" diameter, cleaning [34 cubic feet of air per minute](https://levoit.com/products/core-mini-p-air-purifier)
    (\"CADR\") at 45dB. For most circumstances where someone would use a white noise
    machine, this kind of small purifier is all-around better.\n\nNow, 34 CFM is not
    very much air cleaning. I usually run an [AirFanta 3Pro](https://www.amazon.com/dp/B0D9D5L15F)
    and it cleans ~6x more air for the same amount of noise, or ~12x more air with
    much more noise (~56dB). On the other hand it's more expensive ($165) and bulkier
    (12.6\" square), and arguably uglier.\n\nStill, even a 34 CFM purifier helps a
    lot with smoke. If you have a 10ft square room with an 8ft ceiling and a reasonably
    typical 0.5 air changes per hour through leakage from outdoors, this small purifier
    will cut particulate levels to 16% of the outdoor level. In AQI terms (not linear)
    this is like going from AQI 200 to 72 or AQI 100 to 31.\n\n[ \n ← \n Vertical
