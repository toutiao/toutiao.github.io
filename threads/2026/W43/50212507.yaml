  author: gpm
  text: CO2 - I&#x27;m thrilled with anything less than 800 ppm (half justified by
    being the lowest number I&#x27;ve ever seen a study suggest <i>might</i> have
    health effects, half justified by being at a point where I personally don&#x27;t
    notice that I&#x27;m more drowsy).<p>PM2.5 - My impression is the health risks
    here are more cumulative exposure (and include things I&#x27;d like to go without
    in my life, like alzheimers) and a pretty straight line of &quot;lower is better
    all the way to zero&quot;. The WHO&#x27;s guideline is mean exposure of 5 µg&#x2F;m³
    so I guess I&#x27;d adopt that if I had to put a number on it. (But it&#x27;s
    a mean, I wouldn&#x27;t worry about briefly exceeding it)<p>PM10 - No real opinion
    (I&#x27;d rather worry about PM2.5)<p>VOC index - I&#x27;m not sure this is a
    standardized thing, but the version I&#x27;ve come across is an index <i>relative
    to the average that particular sensor has seen in the last 24 hours</i>. So there&#x27;s
    no standard possible here.<p>---<p>As for a gas range I would worry about NOX
    considering the studies with them causing and aggravating asthma. That said your
    CO2 levels are low so I suspect you might have sufficient ventilation that this
    isn&#x27;t a huge issue for you (especially if that ventilation is in the form
    of a fume hood over your stove that you actually use).
