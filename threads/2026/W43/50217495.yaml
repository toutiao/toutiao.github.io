  text: Not necessarily, it depends on how they fixed it. It isn&#x27;t up to us.
    Some of these apps began supporting it by fixing their own anti-tampering code
    to stop being incompatible with our exploit protections to avoid needing users
    to opt-out for the app.<p>Some were using the Play Integrity API and stopped doing
    it.<p>Others were using the Play Integrity API and implemented the Android key
    attestation API as an alternative which means only a list of operating systems
    and hardware they choose to permit will work in addition to Google certified devices
    with the stock OS via the Play Integrity API.
