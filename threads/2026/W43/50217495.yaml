  author: grapheneos
  text: We&#x27;re not aware of any apps banning GrapheneOS because of that. Play
    Integrity API adoption has been ongoing for a while. The device and strong integrity
    levels don&#x27;t specifically ban using GrapheneOS but rather any non-Google-certified
    OS. Google certification isn&#x27;t available to GrapheneOS.
  score: 0
