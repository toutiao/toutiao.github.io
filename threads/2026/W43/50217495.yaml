  author: jon128
  text: |-
    No no, we don&#x27;t want tokens. We don&#x27;t want that at all.<p>In the United States, users of Chase are already using FIDO2  to access their Chase accounts with hardware keys often priced at $15 or $20 made by a diverse set of 3rd party vendors such as Yubico, which has the same cryptography-grounded effects I suggested above. One hardware key can store private keys for several remote sites, this is a basic part of FIDO2.<p>Before Chase did this, I directly kvetched at Chase on LinkedIn pointing out that many smaller banks had already been securing access to accounts with FIDO2.<p>Trezor and Yubikey 5C devices happen to also do FIDO2, but the ultimate answer that provides end-to-end cryptography, meaning the cryptographic pieces reach all the way to the record matching the actual contents of the transaction stored at the bank, uses a different format. The legacy tokens never provided end-to-end cryptography, and from a security perspective are as crummy and vulnerable to MITM as OTP&#x2F;TOTP.<p>As far as holding onto hardware keys, users don&#x27;t lose hardware keys&#x2F;wallets when those are attached to a keychain and the users are instructed to attach to add it to their general car&#x2F;house keys. Attached to general car&#x2F;house keys&#x2F;fobs, hardware keys survive user-chaos at a much better rate than smartphones do. Other security-focused IT pros&#x2F;execs have reported the same.<p>The key difference between those hardware tokens and hardware keys&#x2F;wallets that do OpenPGP, or PIV, or the underlying cryptograpy functionality of &quot;Bitcoin wallet&quot;, is they<p><pre><code>  1.] generate a cryptographic signature for the actual content ie &quot;this much $xx.xx to meloney@example2.com&quot; that the bank can keep and present later as reliable proof if appropriate
    </code></pre>
    and<p><pre><code>  2.] display on the screen the contents for #1, so a compromised user endpoint (smartphone or laptop) displaying false info is less likely to successfully bamboozle a user.</code></pre>
