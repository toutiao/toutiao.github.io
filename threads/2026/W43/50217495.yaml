  author: grapheneos
  text: GrapheneOS doesn&#x27;t have app accessible root and has it limited to a tiny
    set of processes where it&#x27;s still largely contained via SELinux. Debug builds
    of GrapheneOS have root for Android Debug Bridge (ADB) and it doesn&#x27;t limit
    how people can modify it. We don&#x27;t recommend using a debug build on a production
    device and people should at least set ro.adb.secure=1 if they do.<p>GrapheneOS
    is an open source project and people can make their own builds with arbitrary
    modifications. We recommend not adding a third party system giving root access
    to a large portion of the OS and making it possible to grant to apps with a dialog
    since it greatly reduces security if it isn&#x27;t used. People can do what they
    want regardless of our recommendations.<p>Modifying GrapheneOS in any way creates
    a new OS which is no longer GrapheneOS itself. Forks of GrapheneOS must come up
    with their own name and branding if they&#x27;re going to distribute their modifications.
