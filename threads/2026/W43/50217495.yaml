  author: edent
  text: In my experience with UK banks &amp; financial institutions, GrapheneOS support
    can be roughly divided into four types.<p>None. Explicitly banned. And, though
    I feel bad for saying it, I can&#x27;t blame them. If some idiot roots their phone
    and downloads malware, the bank may be responsible for refunding them. I can see
    why they don&#x27;t want that headache.<p>Some. App works, but some functionality
    is unavailable. I&#x27;ve got a credit card app which works, but refuses to set
    up virtual cards or use &quot;remember me&quot;. That&#x27;s good enough for my
    use. Similarly, I had a merchant account which let me see my balance, but I couldn&#x27;t
    use my phone as a credit card reader.<p>Works, but only in main profile. I&#x27;d
    rather keep financial things in a locked profile. But lots of banks disallow that.<p>Full.
    Everything works (although you may need to toggle some exploit protection off).<p>Some
    banks are reasonably good at letting you pass on technical queries to their developers
    - mostly the smaller ones. The nice thing about the UK banking sector is that
    it is trivial to move banks. So I switched accounts to providers which worked
    with my phone and let the old ones know why I was moving.
