  url: https://keepandroidopen.org/?
  title: Keep Android Open
  fetch_status: success
  content: "Your phone is about to stop being yours.\n\nStarting in 2027*, a silent
    update, nonconsensually pushed by Google, will block every Android app whose developer
    hasn't registered with Google, signed their contract, paid up, and handed over
    government ID.\n\nEvery app and every device, worldwide, with no opt-out.\n\nSpread
    the word\n\n## What Google is doing\n\nIn August 2025, Google announced a new
    requirement: starting in 2027, every Android app developer must register centrally
    with Google before their software can be installed on any device. Not just Play
    Store apps: all apps. This includes apps shared between friends, distributed through
    F-Droid, built by hobbyists for personal use. Independent developers, church and
    community groups, and hobbyists alike will all be frozen out of being able to
    develop and distribute their software.\n\nRegistration requires:\n\n- Paying a
    fee to Google\n\n- Agreeing to Google's Terms and Conditions\n\n- Surrendering
    your government-issued identification\n\n- Providing evidence of your private
    signing key\n\n- Listing all current and all future application identifiers\n\nIf
    a developer does not comply, their apps get silently blocked on every Android
    device worldwide.\n\n## Who this hurts\n\n### You\n\nYou bought an Android phone
    because Google told you it was open. You could install what you wanted, and that
    was the deal.\n\nGoogle is now rewriting that deal, retroactively, on hardware
    you already own. After the update lands, you can only run software that Google
    has pre-approved. On your phone: your property, that you paid for.\n\n### Independent
    developers\n\nA teenager's first app, a volunteer's privacy tool, or a company's
    confidential internal beta. It doesn't matter. In 2027, none of these can be installed
    without Google's blessing.\n\nF-Droid, home to thousands of free and open-source
    Android apps, has called this an \"existential\" threat. Cory Doctorow calls it
    \"Darth Android\".\n\n### Governments & civil society\n\nGoogle has a documented
    track record of complying when authoritarian regimes demand app removals. With
    this program, the software that runs your country's institutions will exist at
    the pleasure of a single unaccountable foreign corporation.\n\nThe EFF calls app
    gatekeeping \"an ever-expanding pathway to internet censorship.\"\n\n### Google's
    \"escape hatch\" is a trap door\n\nGoogle says \"power users\" can \"still install\"
    unverified apps. Here's what that actually looks like:\n\n- Delve into System
    Settings, find About Phone\n\n- Tap the build number seven times to enable Developer
    Mode\n\n- Dismiss scare screens about coercion\n\n- Enter your PIN\n\n- Restart
    the device\n\n- Wait 24 hours\n\n- Come back, dismiss more scare screens\n\n-
    Pick \"allow temporarily\" (7 days) or \"allow indefinitely\"\n\n- Confirm, again,
    that you understand \"the risks\"\n\nNine steps. A mandatory 24-hour cooling-off
    period. For installing software on a device you own.\n\nWorse: this flow runs
    entirely through Google Play Services, not the Android OS. Google can change it,
    tighten it, or kill it at any time, with no OS update required and no consent
    needed.\n\n## This is bigger than Android\n\nIf Google can retroactively lock
    down billions of devices that were sold as open platforms, every hardware manufacturer
    on the planet is watching.\n\nThe principle being established: the company that
    made your device gets to decide, after you've bought it, what software you're
    allowed to run. In software, this is called a \"rug pull\"; but at least you could
    always install competing software. In hardware, it is a fait accompli that strips
    you of your agency and renders you powerless to the whims of a single unaccountable
    gatekeeper and convicted monopolist.\n\nAndroid's openness was never just a feature.
    It was the promise that distinguished it from iPhone. Millions chose Android for
    exactly that reason. Google is now revoking that promise unilaterally, on devices
    already in people's pockets, because they've decided they have enough market dominance
    and regulatory capture to get away with it.\n\nArs Technica: \"Google's Apple
    envy threatens to dismantle Android's open legacy.\"\n\n## But wait, isn't this...\n\n####
    \"...just about security?\"\n\nThe security rationale is a smokescreen. Google
    Play Protect already scans for malware independent of developer identity. Requiring
    a government ID doesn't make code safer. It makes developers identifiable and
    controllable. Malware authors can register. Indie developers and dissidents often
    can't. The EFF is blunt: identity-based gatekeeping is a censorship tool, not
    a security one.\n\n#### \"...still sideloading if you use the advanced flow?\"\n\nNine
    steps, 24-hour wait, buried in Developer Options, delivered through a proprietary
    service that Google can revoke whenever they want. That's not sideloading. That's
    a deterrence mechanism built to ensure almost nobody completes it. And since it
    runs through Play Services rather than the OS, Google can tighten or kill it silently.\n\n####
    \"...only a problem if you have something to hide?\"\n\nWhistleblowers, journalists,
    and activists under authoritarian governments will be the first victims. People
    in domestic abuse situations are next. All these groups have legitimate reasons
    to distribute or use software without putting their legal identity in a Google
    database. Anonymous open-source contribution is a tradition older than Google
    itself. This policy ends it on Android.\n\n#### \"...the same thing Apple does?\"\n\nApple
    has been a walled garden from day one. People chose Android because it was different.
    \"Apple does it too\" is a race to the bottom and a weak tu quoque argument. And
    under regulatory pressure (the EU's Digital Markets Act), even Apple is being
    forced to open up. Google is moving in the opposite direction: attempting to further
    entrench its gatekeeping status.\n\n#### \"...just $25 and some paperwork?\"\n\nMaybe,
    if you're a developer in the US with a credit card and a driver's license. Try
    being a student in sub-Saharan Africa, or a dissident in Myanmar, or a volunteer
    maintaining a community health app. The cost isn't only financial: you're surrendering
    government ID and evidence of your signing keys to a company that routinely complies
    with government demands to remove apps and expose developers.\n\n## Fight back\n\n###
    Everyone\n\n- Install F-Droid on every Android device you own. Alternative stores
    only survive if people actually use them.\n\n- Contact your regulators. Regulators
    worldwide are genuinely concerned about monopolies and the centralization of power
    in the tech sector, and want to hear directly from individuals who are affected
    and concerned.\n\n- Share this page. Link to keepandroidopen.org everywhere.\n\n-
    Push back on astroturfers. The \"well, actually...\" crowd is out in force. Don't
    let them set the narrative.\n\n- Sign the change.org petition and join the over
    100,000 signatories who have made their voices heard.\n\n- Read and share our
    open letter\n\n- Tell Google what you think of this through their own developer
    verification survey (for all the good that will do).\n\n### Developers\n\nDo not
    sign up. Don't join the program by signing up for the Android Developer Console
    and agreeing to their irrevocable Terms and Conditions. Don't verify your identity.
    Don't play ball.\n\nGoogle's plan only works if developers comply. Don't.\n\n-
    Talk other developers and organizations out of signing up.\n\n- Add the FreeDroidWarn
    library to your apps to warn users.\n\n- Run a website? Add the countdown banner.\n\n###
    Google employees\n\nIf you know something about the program's technical implementation
    or internal rationale, contact tips@keepandroidopen.org from a non-work machine
    and a non-Gmail account. Strict confidence guaranteed.\n\n## All those opposed…\n\n71
    organizations from 23 countries have signed the open letter\n\nRead the full open
    letter and thank the signatories →\n\n## What they're saying\n\n### Tech press\n\n>
    \"Google plans to block side-loading like Apple, declaring war on Android freedom\"
    Tuta Blog\n\n\"Google plans to block side-loading like Apple, declaring war on "
