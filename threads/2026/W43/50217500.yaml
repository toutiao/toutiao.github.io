  author: gregsadetsky
  text: I feel like there should be a comparison table listing all of these engines
    and how they compare on their external dependencies, whether a single leader&#x2F;any
    node can write, their shape (embeddable library vs server), etc.<p>IMHO support
    for transactions is a pretty important dividing line. Some engines support full
    SQLite transactions while others - like rqlite - don&#x27;t officially support
    BEGIN&#x2F;COMMIT [0], which matters if you rely on multi-statement transactions.<p>A
    friend&#x2F;colleague has been building a pure-Python client for dqlite [1] (DB-API
    and SQLAlchemy), which may interest folks here. dqlite has full support for transactions,
    and like rqlite doesn&#x27;t have external dependencies (ie no S3&#x2F;Consul).<p>No
    knock on rqlite or any other engine - dqlite has warts too [2].<p>[0] <a href="https:&#x2F;&#x2F;rqlite.io&#x2F;docs&#x2F;faq&#x2F;#does-rqlite-support-transactions"
    rel="nofollow">https:&#x2F;&#x2F;rqlite.io&#x2F;docs&#x2F;faq&#x2F;#does-rqlite-support-transactions</a><p>[1]
