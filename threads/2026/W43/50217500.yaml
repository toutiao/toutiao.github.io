    Having used D1 in production - it&#x27;s not very reliable. There was a comment on HN from one of D1 devs [1] saying that D1 is a sql wrapper on top of durable objects that mimicks sqlite distributed like nature.<p>&gt; I&#x27;ll let you in on a sort of dirty secret:
    It&#x27;s almost always better to use Durable Objects storage, rather than D1. Even if you only want a single global database, it&#x27;s better to implement that as a singleton Durable Object, than by using D1. Because that&#x27;s all D1 itself actually is: a singleton Durable Object that exposes an API to its SQLite database. It&#x27;s just a wrapper.<p>[1] <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48611834">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=48611834</a>
