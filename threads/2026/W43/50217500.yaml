  author: rapind
  text: |-
    The problem is &quot;remote&quot; SQLite. Just run a &quot;single&quot; beefier box with in-process SQLite and Litestream backups to object storage and never have to think about RDBMS again. I&#x27;d wager there are 90%+ applications that would be better served, more performant, and cheaper with this design.<p>I&#x27;m able to handle around 200k&#x2F;s on a sub $100 box.
