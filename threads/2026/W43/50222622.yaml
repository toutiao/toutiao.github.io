  author: verdverm
  text: Michael Sandel is not a communist, he thinks capitalism and markets are the
    better way to organize an economy. He&#x27;s trying to reframe the conversation
    around meritocracy, the inequality this leads to, and distributive vs contributive
    justice.<p>Distributive is more the communist &#x2F; far-left take from the rich
    and give to the poor. Contributive is about the dignity of work. People are happiest
    when they are part of a community, have work which can support a family and contribute
    to the greater good, and above all receive social recognition for their contributions.
    (like the essential workers during COVID we rarely speak of these days)<p>While
    we&#x27;ve always had technological advancement and automation, the computer changed
    things. We stopped producing new types of tasks for many humans. Almost all new
    tasks are cognitive. We told people &quot;if you want to get ahead in the new
    economy, go to college.&quot; Well, most people do not have college degrees, and
    within that there is an implicit insult that if they are suffering, it is their
    fault for not doing what we told them. The people who rigged the game also obviate
    these people and make it harder for the average person to have a decent life.<p>I
    recommend his conversations with Daron Acemoglu. Both have perspectives worth
    hearing and considering.
