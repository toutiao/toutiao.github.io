  author: sklargh
  text: 'I&#x27;m so juiced to buy this. I went to Alive 2007 at Coney Island, which
    was a surprisingly intimate venue for the show (if this is your thing, go watch
    it if you haven&#x27;t - <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=QmR4zLcORNc"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=QmR4zLcORNc</a>),
    and it remains one of the more remarkable musical experiences I&#x27;ve had. One,
    it was pre-phone saturation, so the crowd was engaged and the experience was novel.
    Two, it was astoundingly unique at the time; the production values and concept
    were just so far forward. For those of you who are younger, it&#x27;s a little
    hard to explain, but for me there is &quot;before Alive&quot; and &quot;after
    Alive&quot; in terms of larger scale electronic music performances. It&#x27;s
    sort of like seeing the beginning of a new evolutionary tree. Then of course it
    becomes really interesting that Random Access Memories really was a fundamental
    rejection of the beast they&#x27;d helped generate. I thought it was super interesting
    that Bangalter did Ally Pally with Fred Again recently... he seems, along with
    a newer generation of DJs (Barry Can&#x27;t Swim is another), to have gotten the
    message... took a while.<p>Edit: when I say the experience was novel, I mean I
    had only heard the faintest of news that I was going to this amazing show. I had
    no prior visual information on what to expect -'
