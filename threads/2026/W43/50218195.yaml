  text: The execute stage very much modifies state; in fact it <i>always</i> modifies
    state. Any non-memory instructions modify registers, and any memory instructions
    either write to registers or to memory. Even a noop will increment the instruction
    pointer, so you&#x27;re always modifying a register regardless.
