  author: raddan
  text: Modern computers are exquisitely sensitive to spatial and temporal locality
    because many of the hardware features that speed your code up (for free!) take
    advantage of data or instructions that are “next to each other.” This can be a
    challenge in a functional program, because not only do you often have little control
    about where things go, the abstractions that make cool things possible (eg, closures,
    or lazy evaluation) naturally introduce indirection that hurts locality.
