article:
  url: https://rtfeldman.com/fp-vs-c
  title: How close can pure FP get to C?
  fetch_status: success
  content: "# How close can pure FP get to C?\n\n_October 22, 2026_\n\nIn [Why Lean
    is Faster Than Rust](https://kim-em.github.io/blog/2026-7-24-why-lean-is-faster-than-rust/),
    the author shares an impressive result: a [DEFLATE compression](https://en.wikipedia.org/wiki/Deflate)
    library written in [Lean 4](https://github.com/leanprover/lean4), a functional
    programming language and proof assistant, outperforming an equivalent Rust package
    that [crates.io says](https://crates.io/search?q=miniz_oxide) has been downloaded
    _over a billion times._ From the article:\n\n> `lean-zip` beats every single compression
    level `miniz_oxide` provides, i.e. we're capable of providing the same compression
    at higher throughput. At its fastest setting we're 15% quicker and the output
    is 8.8% smaller.\n\nHowever, the article also notes that while they managed to
    surpass Rust's `miniz_oxide`, they were no match for the end boss of DEFLATE performance:
    [libdeflate](https://github.com/ebiggers/libdeflate), written in C.\n\n> `lean-zip`
    is certainly not the best here: `libdeflate` unsurprisingly blows it out of the
    water (unsurprisingly because this is a very carefully tuned implementation using
    architecture-specific SIMD, that we can't touch in Lean).\n\nEnter [Roc](https://roc-lang.org),
    a functional programming language (but not a theorem prover) with an explicit
    focus on runtime performance.\n\nRoc's tagline is \"Fast, Friendly, Functional,\"
    and [Fast comes first](https://roc-lang.org/fast) because both running fast _and_
    compiling fast have always been central goals. Roc is not a mature language (it's
    still weeks away from its first numbered release, 0.1.0), and its nascent package
    ecosystem has had almost no optimization work done on it. Still, between its language
    design, [longstanding optimizations](https://youtu.be/vzfy4EKwG_Y?si=oYa6k2pFdsRJcQW7),
    and [brand-new compiler implementation](https://rtfeldman.com/rust-to-zig), I
    figured Roc already had enough of a foundation in place to take on the champ:
    libdeflate.\n\nSo I spent a bunch of time grinding through performance optimizations
    on [roc-deflate](https://github.com/niclas-ahden/roc-deflate), a package [Niclas
    Ahden](https://www.youtube.com/@NiclasAhden) wrote (and [uses in paid production
    work](https://youtu.be/12yVcgQHAK0?si=JETe6lec5y4jCLVL)) for DEFLATE compression.
    I didn't expect to beat libdeflate's performance across the board, but I wanted
    to see how close it could get on the non-streaming APIs (as roc-deflate hasn't
    implemented streaming yet), using the classic Silesia corpus for benchmarking
    and verifying that it produced identical outputs.\n\n## [Under 10% Slower](#under-10-slower)\n\nHere's
    where the benchmarks stand today, running on the 2021 M1 MacBook Pro where I did
    all the optimization work, as well as on an AMD Ryzen 9 3900X Ubuntu machine for
    an x64 comparison.\n\nroc-deflate ran these 144 benchmarks slower on average than
    libdeflate, in the median case **8.9%** slower on the Ryzen 3900X, and **2.6%**
    on the M1 MacBook Pro.\n\n_Compression on Silesia corpus_\n\nSo while we didn't
    outperform the champ on average, a median slowdown percentage in the single digits
    compared to such a carefully-tuned SIMD-powered C library is _wild._ It's frankly
    not a result I knew was achievable going in, since Roc is a functional language
    with automatic memory management racing against code that doesn't have to do bounds
    checks. (Bounds checks have a cost, but then again, the last time a skipped bounds
    check in C compression code led to a major Remote Code Execution vulnerability
    [was yesterday](https://nodejs.org/en/blog/vulnerability/october-2026-security-releases#nodejs-brotli-decoder-out-of-bounds-write-permits-remote-code-execution-cve-2026-111497---high).)\n\nThe
    graph shows more detail than just the median gap. On the worst-case inputs, roc-deflate
    was 18% slower than libdeflate, but on the best-case inputs, roc-deflate was slightly
    over 18% _faster!_ That's not because Roc has some magical optimization that C
    can't access; it's just that the two implementations are different, and although
    on average roc-deflate is slower, for certain inputs it happens to be faster.
    So while it's _possible_ to get a speedup by switching from libdeflate to roc-deflate,
    you shouldn't expect it on average.\n\nTo be clear, C's performance ceiling is
    higher than Roc's. For any input where roc-deflate currently outperforms libdeflate,
    C code can close that gap. The reverse is not true; Roc code is memory-safe, does
    automatic reference counting, checks bounds, and supports no Rust-style `unsafe`
    to opt out of any of that. These properties give Roc code stronger safety guarantees
    than code written in C, Zig, Rust, and other languages that allow full access
    to the hardware—and the price it pays for those guarantees is a lower performance
    ceiling.\n\nObviously we can't extrapolate from this one result about how close
    Roc can get to C in the general case, but now something has been demonstrated
    that nobody knew was achievable before. As far as I know, this is the most optimization
    effort that has been put into any Roc package to date, so how close others can
    get to this result is a complete unknown right now. So while I'm thrilled by this
    result, I'm fully aware that we won't know how well it generalizes until we've
    optimized a wider sample of real-world Roc code bases!\n\n## [What the Performance
    Gap Buys](#what-the-performance-gap-buys)\n\nAn obvious question is \"Why settle
    for _any_ amount slower?\" If you _could_ get C levels of performance, why not
    use libdeflate itself and close that remaining gap?\n\nA pure-Roc implementation
    has several advantages over a pure-C one:\n\n- **Memory safety.** Roc code is
    fully memory-safe and has no language primitives that let you opt out of it. This
    code is only able to approach C levels of performance because Roc's optimization
    pipeline determined that many bounds checks and reference counting operations
    were provably safe to optimize away. Compression packages written in pure Roc
    don't have access to the unchecked memory operation that caused yesterday's [Brotli
    Remote Code Execution vulnerability](https://nodejs.org/en/blog/vulnerability/october-2026-security-releases#nodejs-brotli-decoder-out-of-bounds-write-permits-remote-code-execution-cve-2026-111497---high).\n-
    **No side effects.** Roc's type system [infers which functions are pure](https://roc-lang.org/docs/main/langref/functions/)
    and which can perform side effects. Pure functions' types use a thin arrow, like
    `Bool -> Bool`, whereas _effectful functions_ use a thick arrow, like `Bool =>
    Bool`. (As with memory safety, Roc enforces this and supports no way to opt out.)
    So when you see that roc-deflate's functions have only thin arrows in their annotations,
    you know they really are pure functions.\n- **Supply-Chain Security.** Roc does
    not have an arbitrary [FFI](https://en.wikipedia.org/wiki/Foreign_function_interface),
    meaning you know for sure that roc-deflate's pure functions can't even attempt
    to do I/O or access arbitrary memory. Given the explosion in [supply chain attacks](https://shattered.io/npm-supply-chain-attacks-2026/),
    it's valuable to know that the damage a malicious actor can do with a pure function
    in a compromised Roc package is limited to returning the wrong value, crashing,
    or wasting system resources. Roc packages also don't support build scripts, which
    was the vector used to [successfully compromise the popular Rust `arrayref` package](https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/)
    two months ago.\n- **Portability.** Roc pure functions are designed to be extremely
    deterministic: they always return the same values when given the same arguments—not
    just when run on the same machine, but also on any target you compile that code
    to. (The functions may also crash or fail to terminate, but that behavior should
    also be deterministic across targets.) The only way a Roc pure function should
    be expected to behave differently when run on two different "
