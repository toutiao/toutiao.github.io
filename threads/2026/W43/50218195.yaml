  text: "&gt; but the computer itself is place-oriented<p>You could similarly argue
    that the computer is in fact fundamentally functional, since the core instruction
    cycle (Fetch Decode Execute) does not modify any memory.<p>The key insight into
    that system is that we&#x27;ve embedded a functional system within a mechanism
    that makes it imperative. The functional cycle can output commands to fetch it
    more data, that it can then use in the next cycle. It becomes imperative by the
    addition of time, which it needs because it&#x27;s limited in the amount of input
    and output."
