  text: |-
    Try auxclick event. I made a little demo webpage for you
    https://arsdnet.net/auxclick.html
    It also adds an event ("contextmenu") for right click, but you might not want to keep that one since a lot of your users might right click to copy link target, and that defeats the whole point. But the click and auxclick events are both solid maybes for you to consider.
    Note that ctrl+click and middle click often do the same thing, but the events might not be the same; I see ctrl+click triggering the "click" event here and middle click is "auxclick". Keyboard triggering of a link does just trigger the "click" event though.
    see also: https://developer.mozilla.org/en-US/docs/Web/API/Element/auxclick_event
    (tbh i called it #evil in the demo link cuz i also don't like this, i think my preference would be to have two links, like your logged in link then a sharable link next to it or something (if i wanted to be cute, i'd use a little picture of a cannon as its icon, lol blast out that canonical link) but that might be hard to make space for it so meh.)
    My demo does NOT use preventDefault because the event handler is run before the defalt event. You can rewrite the link then let the default handler run and it will navigate normally to the new link, observe how you land on #evil instead of #good.
    But the downside of this specific approach is if you middle click to open in new tab, then copy/paste, you'll get the evil link. You could preserve the original link somewhere like in another property/attribute of the node, then on a blur and/or mouseout event, reset it to the original. That might work for you but you can experiment from here, breakfast time for me lol
