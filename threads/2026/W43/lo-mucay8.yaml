  text: |-
    I run Hackers' Pub, an ActivityPub social network, and I ended up on the other side of this argument.
    Like many fediverse servers (Mastodon included), Hackers' Pub shows remote posts on a mirrored page of its own. The timestamp on a remote post in the timeline links to that mirror, which is where you can reply to or like the post from your account. Those interactions only work from our side. The catch is that someone who wants to share the post and uses the browser's “copy link” on the timestamp gets the mirror URL, not the original permalink on the remote server. I didn't like that, since the canonical URL is what people actually want to pass around.
    My workaround was to put the original permalink in href and add an onclick handler that calls preventDefault() and navigates to the mirror instead. Copying the link yields the original URL, and a plain click still lands on the mirror. I was fairly pleased with it for a while.
    It is exactly the kind of thing the article complains about, though, and some of our users have said so. Open the link in a new tab (Ctrl + click, middle click) and the handler never runs, so they land on the original page on the remote server. Reading works there, but they can't reply or like, which was the reason they wanted the mirror in the first place.
    I haven't found a clean fix. Part of it is a limitation of the fediverse today: the remote server's page knows nothing about your account here. Still, I sometimes wish a link could carry one URL for copying and another for navigating. I'd expect that to be abused within a week, so I'm not seriously asking for it.
