  content: "# Proton hosts map of 300,000 Flock devices amid legal threats\n\n _By_
    [Alex Lekander](https://cyberinsider.com/author/alexlekander/) — [Leave a Comment](https://cyberinsider.com/proton-flock-map/#respond)
    \n\n[X](https://x.com/intent/tweet?text=Proton%20hosts%20map%20of%20300%2C000%20Flock%20devices%20amid%20legal%20threats&url=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F)[LinkedIn](https://www.linkedin.com/shareArticle?title=Proton%20hosts%20map%20of%20300%2C000%20Flock%20devices%20amid%20legal%20threats&url=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F&mini=true)[Reddit](https://www.reddit.com/submit?url=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F&title=Proton%20hosts%20map%20of%20300%2C000%20Flock%20devices%20amid%20legal%20threats)[Facebook](https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F)[Share](#)\n\n![Proton
    Flock Camera Map](https://cyberinsider.com/wp-content/uploads/2026/10/Proton-Flock-Camera-Map-1024x580.png)\n\nProton
    is hosting a public map showing more than 300,000 Flock surveillance devices across
    the United States, preserving access to a research project whose creator faces
    legal threats and intimidation.\n\n[The map](https://proton.me/flock-camera-map)
    draws on an inventory obtained by cybersecurity researcher [Joshua Michael](https://whoisjoshuamichael.com/)
    from Flock’s own systems. According to Proton, it includes more than 170,000 cameras
    and over 130,000 other devices.\n\nIn November 2025, Michael discovered that an
    access token could be obtained without logging in and used to retrieve device-location
    information. He reported the exposure to Flock and archived the inventory in December.
    His website dates the release of his formal research paper and surveillance map
    to September 23, 2026.\n\nProton, the Swiss company behind [Proton Mail](https://cyberinsider.com/email/reviews/protonmail/)
    and [Proton VPN](https://cyberinsider.com/vpn/reviews/protonvpn/), is offering
    another way to inspect Flock Safety’s footprint, whose automated license plate
    readers are used by police and private customers. The systems record passing vehicles
    regardless of whether their drivers are suspected of an offense, creating searchable
    records of plates, locations, and timestamps. Vehicle characteristics can also
    help identify cars without a readable plate.\n\nUnlike crowdsourced projects such
    as DeFlock, Michael’s inventory comes from company records rather than sightings
    submitted by volunteers. However, Proton warns that the map reflects a December
    2025 snapshot: subsequent installations and removals will not appear.\n\n![](https://cyberinsider.com/wp-content/uploads/2026/10/map-2-1024x490.jpg)\n_Proton_\n\n###
    Security research draws legal threats\n\nThe dispute extends beyond the original
    security disclosure. In a September 25 update, Michael said Flock had sent him
    a cease-and-desist letter threatening litigation and told customers it had notified
    law enforcement.\n\nIn that notice, Flock said it had investigated the exposed
    token, closed the access path, and initially found no evidence of unauthorized
    access. Following further investigation in September, it identified anomalous
    activity involving the token but said its forensic review found no impact on customer
    data. Michael argues that the initial finding illustrates shortcomings in the
    company’s ability to detect access.\n\n### Growing scrutiny on Flock opponents\n\nEarlier
    this week, [404 Media reported](https://www.404media.co/cops-warned-to-look-for-suspicious-behavior-from-people-opposing-flock-at-city-council-meetings/)
    that California’s Orange County Intelligence Assessment Center had circulated
    a bulletin warning police about people attending city council meetings to oppose
    the surveillance technology.\n\nAlthough it acknowledged that no specific, credible
    threats had been identified, the July bulletin urged officers to watch for suspicious
    behavior, including unusual questions and loitering. It also listed media attendance,
    livestreaming, and emotional exchanges among potential public safety concerns,
    bringing ordinary civic participation into a police threat-assessment framework.
    The center said its reporting supported safety planning and recognized constitutional
    protections for speech and assembly.\n\nFor residents, the map offers a starting
    point for asking local authorities where cameras operate, how long they retain
    vehicle records, which agencies can access them, and how they audit searches.
    Its age and coverage limitations mean it should be treated as a historical inventory
    rather than a complete picture of surveillance on today’s roads.\n\nIf you liked
    this article, be sure to follow us on **[X/Twitter](https://twitter.com/CyberInsidercom)**
    and also **[LinkedIn](https://www.linkedin.com/company/cyberinsider/)** for more
    exclusive content.\n\n[X](https://x.com/intent/tweet?text=Proton%20hosts%20map%20of%20300%2C000%20Flock%20devices%20amid%20legal%20threats&url=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F)[LinkedIn](https://www.linkedin.com/shareArticle?title=Proton%20hosts%20map%20of%20300%2C000%20Flock%20devices%20amid%20legal%20threats&url=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F&mini=true)[Facebook](https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F)[Reddit](https://www.reddit.com/submit?url=https%3A%2F%2Fcyberinsider.com%2Fproton-flock-map%2F&title=Proton%20hosts%20map%20of%20300%2C000%20Flock%20devices%20amid%20legal%20threats)[Share](#)\n\n*
