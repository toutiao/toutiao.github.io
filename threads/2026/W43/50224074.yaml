  author: u1hcw9nx
  text: 'Select the right OSS license and use dual licensing.<p>GPL&#x2F;AGPL&#x2F;LGPL
    is the way to go for business.  There are many dual-licensing success stories
    using GPL&#x2F;AGPL, both large and small: Qt, iText, Grafana, Loki, Tempo, Mattermost,
    Cal.com, Baserow, and even MongoDB originally.<p>Qt is an especially interesting
    case because KDE and the Qt Company have a written contract. Qt can&#x27;t just
    switch licenses. They have  retreated from every voluntary contribution to open
    source, but the contract binds them and they can&#x27;t do anything to it unless
    they do complete rewrite from scratch.'
