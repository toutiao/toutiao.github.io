    Sorry, I don't understand what you mean by

    why is a C compiler subordinate to what POSIX wants

    So I don't know if this answers your question, but maybe this can help:
    POSIX is not like other standards that define C APIs, like for example OpenGL or Vulkan.
    Other standards explicitly tell you the definitions of structs and enums, and what functions are available, e.g.

    "Pos is defined as struct Pos { int x; int y; float z; }"
    "Color is defined as enum Color { COLOR_RED = 0xFF }"
    "the library exports a function void setColor(Pos pos, Color color);"

    You can use that information to create "portable header files". As long as your language knows how to map from a C definition to the correct ABI, you can use that to create structs and call functions. For example, Python's ctypes library, Rust or Zig's extern "c" declarations, etc.
    POSIX doesn't do that. Instead it would say something like:

    "the system has a file called <position.h> which contains a definition for a struct X, which has at least a field called y"
    "<color.h> contains the definition of COLOR_RED which is an expression that evaluates to an integer"
    "<color.h> contains a definition for setColor which may be a function or a preprocessor macro, and which can be called with the signature setColor(Pos pos, Color color)


    That's not enough information to actually use the API. The only way to compile to POSIX is by writing a C program and compiling it against the header files that are found on that specific POSIX implementation. You can't safely call a general POSIX function from any other language, and your build process needs access to the OS & CPU architecture specific header files.
    That's why the parent comment says you need to write a C wrapper around the POSIX APIs and call the wrapper instead.
