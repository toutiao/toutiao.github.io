  author: fanf
  text: |-
    The other issue with errno is that the standard doesn't say if errno is a macro or a variable with external visibility (even in C89). This allows an implementation to define errno as macro that calls a function to return a pointer (or "modifiable L-value").

    The C standards are more specific than that.
    C89 and C99 say errno is a macro, but they also contradict themselves by saying “It is unspecified whether errno is a macro or an identifier declared with external linkage.” That sentence was removed in C11, so now errno is unambiguously a macro.
    There is a footnote which describes the usual implementation of errno (though the name of the underlying function varies):

    The macro errno need not be the identifier of an object. It might expand to a modifiable lvalue resulting from a function call (for example, *errno())

    C23 beefed up the footnote to say more strongly that, “The macro errno is not expected to be the identifier of an object.”
