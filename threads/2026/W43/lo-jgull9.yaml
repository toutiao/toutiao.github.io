    Last time I built an FFI layer for a language, it embedded clang for this kind of thing. Macros were treated in three ways:

    A macro that expands to a constant expression would have its result available as a constant.
    A macro that expanded to an expression would be wrapped in a function that invoked it and returned the result, which was then exposed via the FFI layer.
    A macro that referenced identifiers that were neither arguments nor globals was initially ignored, I had some plans to wrap it in a function that took the macro arguments as value but these were generally better reimplemented in the other language (especially ones where the ambient things are identifiers, not typed values).

    Redirecting stderr is problematic because the file descriptor table is global, so it will affect other threads in exciting ways.
