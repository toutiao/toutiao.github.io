  author: spc476
  text: No standard function in the C library will ever set errno to 0.  The C standard
    (since C89) states, "The value of errno is zero at program startup, but is never
    set to zero by any library function."  The other issue with errno is that the
    standard doesn't say if errno is a macro or a variable with external visibility
    (even in C89).  This allows an implementation to define errno as macro that calls
    a function to return a pointer (or "modifiable L-value").
