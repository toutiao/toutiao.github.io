  author: smashed
  text: 'I am tackling this using the Lethal Trifecta principle.<p>The idea is that
    agents never have all parts of the trifecta, maximum 2: untrusted content, private
    data or network access.<p>Harness have network access by default since they are
    driven by their provider API, unless you use offline models. So that&#x27;s a
    problem.<p>I am then passing around messages that are tagged trusted&#x2F;untrusted
    and the engine can monitor if any agent in the project ever completes the Lethal
    Trifecta and thus, is vulnerable.<p>Usually this means for most workflows, the
    &quot;work&quot; gets done by an offline LLM after some input&#x2F;classification
    stages. There&#x27;s not many ways around it.<p>Yes, it&#x27;s a difficult problem.'
  score: 0
  posted_at: '2026-10-22T21:44:10Z'
- id: '50201496'
  parent_id: '50201266'
  author: fennecbutt
  text: Yeah, exactly. I&#x27;d say it borders on almost unsolvable for any agent
    of reasonable complexity.<p>You see some of the vulnerability chains humans come
    up with and they&#x27;re just insane.<p>Even scanning network data for sensitive
    strings (say matching against a codebase or data set it works on) is tough because
    you can only check so granularly before you get loads of false positives.<p>But
    maybe like a &quot;rolling&quot; sort of check would help with that, % of outbound
    data matching private dataset (which should be operated on but not transmitted)
    over time. That way it minimises what gets out while dealing with false positives.
    Some biz thresholds might be &gt;20% of data others might be &gt;0.5%. Hmm.
  score: 0
