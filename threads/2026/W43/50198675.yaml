  text: 'The data is passed as a message and the message is tagged as untrusted, so
    the engine knows it.<p>Agent A has internet access and the dangerous message,
    but no access to the secret company data, so nothing can get exfiltrated.<p>Agent
    B gets a tainted message from Agent A. Agent B can process the message using the
    secret company data. Agent B has no internet access and can only receive&#x2F;send
    messages.<p>You can imagine an agent C that moves the work along or replies to
    an external user with the outcome.<p>Any workflow that has both an input and an
    output will complete the Lethal Trifecta as a whole, but no single agent does
    by itself. It raises the bar quite a lot, you need to confuse multiple agents
    in the loop to exfiltrate data.<p>Fun research, but it&#x27;s a bit hard to see
    all my coworkers right now installing Claude desktop and moving on with no afterthought
    whatsoever...<p>Regarding infrastructure: my toy sandbox is just a docker-compose
    inspired YAML project file. So it&#x27;s only containers. See my profile. The
    principle can be implemented anywhere you can run agents and cut network&#x2F;data
    access though.'
