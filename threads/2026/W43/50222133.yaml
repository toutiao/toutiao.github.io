  author: 8organicbits
  text: 'I&#x27;ve used FreeDNS on occasion for test domain names, one-off experiments,
    and similar. I&#x27;m very appreciative this exists, but there are some pain points
    that similar services handle better.<p>The domains are missing from the public
    suffix list. This impacts how cookies are handled by the domain names, with concerns
    the browser will allow software to set the cookie on the shared domain name instead
    of the subdomain. This can be a security problem. Getting added to the PSL may
    not happen: <a href="https:&#x2F;&#x2F;github.com&#x2F;publicsuffix&#x2F;list&#x2F;pull&#x2F;79"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;publicsuffix&#x2F;list&#x2F;pull&#x2F;79</a><p>It
    can be difficult to get a free HTTPS certificate for your subdomain. Let&#x27;s
    Encrypt applies per-domain name rate limits and these domain names see lots of
    issuance requests. There&#x27;s a process to lift those limits, but last I checked
    FreeDNS didn&#x27;t use it. You can still, of course, pay for a certificate.<p>There&#x27;s
    tons of abuse on free domains so you may find that your domain is blocked on various
    lists.<p>Here are some compelling alternatives I use now, which manage these issues
    better:<p>- <a href="https:&#x2F;&#x2F;messwithdns.net&#x2F;" rel="nofollow">https:&#x2F;&#x2F;messwithdns.net&#x2F;</a>
    - Exceptionally well-made DNS console for learning DNS<p>- <a href="https:&#x2F;&#x2F;open-domains.com&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;open-domains.com&#x2F;</a> - Uses Cloudflare,
    great Discord group<p>- Even more: <a href="https:&#x2F;&#x2F;free.hrsn.dev&#x2F;#&#x2F;?id=domains"
    rel="nofollow">https:&#x2F;&#x2F;free.hrsn.dev&#x2F;#&#x2F;?id=domains</a>'
  score: 0
