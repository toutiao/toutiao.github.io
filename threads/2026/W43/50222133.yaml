  author: jonathanlydall
  text: In some situations it is most convenient&#x2F;practical to have your router
    do dynamic DNS updates and depending on your router the options may be limited
    giving you no &quot;great&quot; options.<p>Regarding your valid concerns about
    the PSL, as long as you have a domain already, you can just make a CNAME record
    to a free dynamic DNS provider&#x27;s sub-domain record, I&#x27;ve done this for
    years with a No-IP ddns.net record. I don&#x27;t especially recommend No-IP as
    the 30 day verification is a bit annoying, but at &lt; 1 minute of work per month,
    it&#x27;s tolerable for a free service and $2.50 a month is an order of magnitude
    more than what I feel a single dynamic DNS record is worth.<p>Since I moved to
    having a pfSense box at home, I&#x27;m using Cloudflare for dynamic DNS, no extra
    fee and works perfectly, but like I said above, probably not available on typical
    home routers without a regular machine behind the router having to poll your IP
    to detect needed updates of a dynamic DNS record.<p>As I was on Namecheap, I was
    initially going to use their dynamic DNS option, but it turns out it&#x27;s behind
    a higher fee to enable full API access to administering your domain, totally stupid,
    but with their having been bought out by the PE entity I wouldn&#x27;t want to
    stay with them anyway.
