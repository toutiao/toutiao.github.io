  author: 8organicbits
  text: One of the complications that gets discussed is that there are way too many
    use cases with different requirements on what it means for domains to be related.
    The cookie problem is something browsers need to solve, so its perhaps reasonable
    that Mozilla (and volunteers) manage a list that focuses on that user case. But
    that&#x27;s poorly suited for other use cases.<p>There&#x27;s a lot of people
    thinking about this though. One somewhat related example is <a href="https:&#x2F;&#x2F;datatracker.ietf.org&#x2F;doc&#x2F;draft-manelidis-dnsop-domain-affiliation&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;datatracker.ietf.org&#x2F;doc&#x2F;draft-manelidis-dnsop-domai...</a>,
    which has a double-opt-in DNS TXT record mechanism. That draft and forthcoming
    discussions on the mailing list are a good place to understand the complexities
    here.
