  author: clivedup
  text: If, for example, you could trick a client into thinking &quot;com&quot; was
    not a public suffix, then from malicious.com you could set cookies on paypal.com<p>DNSSEC
    is not widely deployed, and so we cannot rely on the authenticity of DNS.<p>Maybe
    if we had DNSSEC, then we could rely on it for publicsuffix. Maybe lots of others
    things could be more easily solved if we had that too.<p>DNSSEC automation is
    coming, e.g. <a href="https:&#x2F;&#x2F;www.rfc-editor.org&#x2F;info&#x2F;rfc10026&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.rfc-editor.org&#x2F;info&#x2F;rfc10026&#x2F;</a>.
    It might never become mainstream, but don&#x27;t let anyone tell you that we couldn&#x27;t
