  author: Gabrys1
  text: DNS caching and thus the load distribution is outside the control of the entity
    running the servers. You assume you get roughly same traffic on each of the published
    IP addresses, you even think you can advertise some address twice so that it gets
    twice the load vs other severs (if you just set up a server capable of serving
    twice the traffic), but the reality is one of these IP addresses might be used
    for 90% of the requests (as an example) due to caching and bad luck.<p>So no,
    you cannot reliably control load balancing using one domain name pointing to multiple
    IP addresses. (IP anycast is better suited, but much harder to implement)
  score: 0
