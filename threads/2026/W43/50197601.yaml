  author: pessimizer
  text: "&gt; Indefinitely doesn&#x27;t mean infinitely<p>It&#x27;s another example
    of how euphemisms are poison. &quot;Indefinitely&quot; <i>has</i> come to mean
    infinitely, because of people using it to mean infinitely. The first step to fraud
    is to come up with a euphemism for what you&#x27;re doing, and on of the the smartest
    things to do is make that euphemism an already existing word that already meant
    something different.<p>Even better if that euphemism meant something more general
    that includes your meaning but isn&#x27;t limited to your meaning. Or if it meant
    something totally different, but you want to eventually substitute your meaning
    with its original meaning within current laws or norms (see shoving the word &quot;Open&quot;
    or &quot;Free&quot; into software that are not associated with Open Source or
    Free Software.)<p>The law should be dealing with this, but Western governments
    have abandoned governance for patron-serving. If somebody says &quot;indefinitely&quot;
    when it comes to a product or service, and people are known to be confused by
    that term, they should simply be forced to clarify. Same for &quot;own&quot;&#x2F;&quot;buy&quot;,
    &quot;unlimited,&quot; or any number of accepted lies that have become standard."
  score: 0
