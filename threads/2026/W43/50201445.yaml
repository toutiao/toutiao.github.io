  author: TacticalCoder
  text: 'Yeah exactly: it&#x27;s a fact that humans have been doing steganorgraphy
    by, for example, XOR&#x27;ing encrypted messages that are undistinguishable from
    noise with pictures where the lowest bits of pixels were... Undistinguishable
    from noise.<p>The recipient of the cat picture has the key allowing him to decrypt
    what looks like noise.<p>We didn&#x27;t really think 100% of those cat pictures
    on the Internet were really just cat pictures did we?<p>Now of course this doesn&#x27;t
    survive lossy re-encoding of the picture, nor rotation, etc. It&#x27;s not like,
    say, a watermark.<p>XOR&#x27;ing a properly encrypted secret with bits that are
    by definition random (say from a picture coming out of a camera) is quite solid.<p>It&#x27;s
    noise (except it not but it&#x27;s impossible to tell it&#x27;s not) and more
    noise. And they&#x27;re XOR&#x27;ed and that gives still noise (except it&#x27;s
    not but it&#x27;s impossible to tell it&#x27;s not).<p>And that&#x27;s just one
    way to do it. Anywhere there&#x27;s something that could be noise, it&#x27;s a
    venue to do stego. Metadata with GPS coords? Thanks, you just gave me a few bits
    to do stego. The possibilities are really endless.<p>It&#x27;s one of the reason
    why it&#x27;s very hard to detect all types of data exfil and the &quot;klepto&quot;
    type of attacks (which is basically stego but hidden for example inside the &quot;random&quot;
    cryptographic parameters picked to sign messages).<p>Noise is just noise and indistinguishable
    from noise. Until it&#x27;s not noise. But even then  it&#x27;s still indistinguishable
    from noise.'
