  author: Trusteando
  text: Here using images is incidental. In fact, what Fable is actually doing is
    generic encoding&#x2F;decoding of a message into a medium. Ask it to hide a message
    in a poem and it should try to apply a strong (high signal-to-noise ratio) family
    of schemes, for example quantized, margin-rich encoding. Robustness of features
    depends on the medium, so Fable is selecting strong encoding and robust features
    tailored to it. This frames AI steganography not as a trick of computer vision,
    but as an emergent property of a model reasoning about information density across
    arbitrary media. Here emergent is just surprising general pattern matching and
    constraint-satisfaction and cross-representation mapping  that allows it to express
    the encoding&#x2F;decoding across media.
