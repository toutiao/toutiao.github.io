  content: "# Indian government sites are serving revoked eMudhra certificates ⚓\n23
    Oct 2026\n\nOn 17th October, eight eMudhra intermediate CAs chaining to emSign
    ECC Root CA - G3 were found to have [trivially recoverable private keys](https://emudhra.we-have-a-problem.com/).
    They were revoked the next day, and Mozilla and Chrome are now distrusting the
    G3 root. Separately, on 19th October eMudhra revoked 9,356 certificates on its
    unaffected RSA hierarchy (emSign Root CA - G1) with the reason “Superseded”. That
    batch matches every unexpired certificate missing a certificate-type policy OID
    required by emSign’s own CP/CPS ([Bug 2082782](https://bugzilla.mozilla.org/show_bug.cgi?id=2082782)).\n\nOn
    21st October, MeitY [posted this thread](https://x.com/GoI_MeitY/status/2112914722656076060):\n\n>
    A security incident concerning eMudhra’s Public Key Infrastructure (PKI) was reported
    in the public domain. […]\n> \n> However, some social media accounts are indulging
    in fear mongering about the impact of this incident. […]\n> \n> **The impact of
    this incident on Indian websites and applications have been very limited and for
    a very short interval.**\n> \n> — [@GoI\\_MeitY](https://x.com/GoI_MeitY/status/2112914722656076060),
    21st October 2026, 16:31 CEST\n\nThat last claim is wrong on both counts. The
    interval wasn’t short: the flawed keys were generated in April 2025, so anyone
    could have recovered them for 18 months before the report. The impact isn’t limited
    either: the compromised intermediates barely issued anything, but Mozilla and
    Chrome are now distrusting the entire G3 root, so eMudhra [estimates 30,000 certificates](https://bugzilla.mozilla.org/show_bug.cgi?id=2083449#c19)
    from its unaffected G3 intermediates must be migrated. From what I could see,
    most of those seem to belong to US universities using eMudhra through InCommon
    rather than Indian sites.\n\nMeanwhile, the 19th October revocations have left
    **Indian government sites serving revoked certificates days later** , including
    four bodies under MeitY itself: [STPI](https://www.stpi.in/), [Bhashini](https://bhashini.gov.in/),
    [UIDAI](https://lea.uidai.gov.in/), and the Controller of Certifying Authorities,
    whose [India PKI site](https://indiapki.cca.gov.in/) is serving a revoked eMudhra
    certificate. Notably, Controller of Certifying Authorities regulates eMudhra’s
    CA business in India.\n\nI checked the 8,947 hosts in the [IGOD directory](https://github.com/rishirishhh/IGOD-Dataset)
    of Indian government websites. As of 23rd October, 156 of them are still serving
    one of these revoked certificates. All of them were revoked between 15:34 and
    15:49 CEST on 19th October, and are listed in eMudhra’s CRLs for [DV/G2A-1](http://crl.emsign.com?EMDVTLSCAG2A1.crl),
    [OV/G2A-1](http://crl.emsign.com?EMOVTLSCAG2A1.crl), [EV/G2A-1](http://crl.emsign.com?EMEVTLSCAG2A1.crl)
    and [G1](http://crl.emsign.com?emSignSSLCAG1.crl).\n\nWhether these sites open
    depends on your browser. Firefox ships [CRLite](https://blog.mozilla.org/security/2020/01/09/crlite-part-1-all-web-pki-revocations-compressed/),
    which covers every revocation, and refuses to load them. Chrome’s [CRLSet](https://www.chromium.org/Home/chromium-security/crlsets/)
    (version 10856, 24th October) has none of these certificates, nor any of the 6,235
    entries on the DV/G2A-1 CRL, so Chrome, Edge and Android load them fine. So does
    Safari on iOS, which only checks OCSP for EV certificates. Two sites on the list
    have one: [www.isea.gov.in](https://www.isea.gov.in/) and [nfscnagpur.nic.in](https://nfscnagpur.nic.in/),
    and emSign’s OCSP responder reports the isea.gov.in certificate as revoked, so
    Safari on iOS refuses to load it. [SSL Labs](https://www.ssllabs.com/ssltest/analyze.html?d=aaib.gov.in&latest)
    checks the CRL itself and marks all of these as Grade F / revoked.\n\nRevocations
    happen (GoDaddy just revoked 4 lakh certificates), but they are usually accompanied
    by notifications to subscribers to get them to new valid certificates. I’m not
    sure if eMudhra is doing any of the sort, now that they don’t care about their
    TLS business.\n\nThe table will be updated with timestamps as cert rotations happen.\n\n|
