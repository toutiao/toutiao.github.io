    The impact of this incident on Indian websites and applications have been very limited and for a very short interval.

    That last claim is wrong on both counts. The interval wasn’t short: the flawed keys were generated in April 2025, so anyone could have recovered them for 18 months before the report.

    I’m actually okay with describing the impact as a very short interval. Sure, the window was wide, but the impact was narrow. It seems likely that no one detected it during that time. Certainly from Certificate Transparency logs we know that no one targeted it for mainstream browsers, which is the most obvious and juiciest target. Maybe someone did detect and exploit it in other ways, but there’s no evidence to suggest it.


    Separately, on 19th October eMudhra revoked 9,356 certificates on its unaffected RSA hierarchy (emSign Root CA - G1) with the reason “Superseded”.

    Are these are the certificates listed later on the page? I’ve looked at the one that’s affecting me now (ociservices.gov.in) and it’s G1 rather than G3 which https://emudhra.we-have-a-problem.com/ indicates was the stupid one. Or are some in the list G1 and some G3?
    Why did eMudhra do this G1 thing, abruptly revoking ones that were fine and making the impact of the incident worse?
    However it is, it’s pretty wild that so many government sites, some major, have just been broken for most of the week. Surely eMudhra would have contacted every affected customer and they could sort it out in under a day?

    Unrelated to the content: this page is a good demonstration of why not to put html, body { overflow-x: hidden } in your styles. (It’s more common than it should be because it fixes an unimportant overflow issue in one of the traditional full-bleed decoration techniques.) Some time later you’ll put something like a wide table in, and whoops, its right columns are inaccessible.
