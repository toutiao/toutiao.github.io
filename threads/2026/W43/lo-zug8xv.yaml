  text: |-
    Not an expert, but if I'm reading correctly, when the cert is submitted to the CT log operator, they get back a "signed certificate timestamp (SCT)" which is basically "we promise to publish this in our log within N hours". The browser has a list of trusted CT log operator keys and checks it via whatever public-key mechanism.
    It doesn't check the log itself so in theory a log operator could collude with whoever's issuing the malicious cert to return an SCT but not publish it, but then they'd also get in trouble when the cert is discovered to have an SCT but no log entry.
