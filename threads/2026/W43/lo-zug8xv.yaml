  text: |-
    So... is there anything actually indicating "criminal levels of incompetence" on eMudhra's side yet?
    As I understand the story so far, this is the main bit of information we've got:

    As for these ECC keys, our review of the KGC, assessment of the code and view of HSM keys so far indicate that a) a set of original ECC keys were created onboard as expected b) an approved deviation to our usual KGC to test a wrap/unwrap was introduced as these keys were meant for export for this instance c) a flaw in the code resulted in the second pair of keys being created onboard which were weaker d) these second pair of weaker keys were used by mistake to create the csr (because the key labels were similar) and signed by our root e) the CSR from these weaker keys were also sent over to Sectigo for cross signing (we verified the files sent over to Sectigo)

    My interpretation of this is that they created an additional keypair on the HSM ("second pair of keys being created onboard"), and then mixed up the two pairs due to human error. They shouldn't have mixed up these keys, but this, in of itself, isn't something that should have had such catastrophic consequences. The second keypair should've been just as secure; a HSM should never let you generate such weak keys. That's the entire point of a HSM.
    Something else went wrong, and we don't yet know the whole story. eMudhra's response so far hasn't been... entirely satisfactory either, but I feel like a lot of people are interpreting everything they say in absolutely the worst way possible.
    FWIW, I'm not a cryptographer, I've never worked with an HSM, etc. Maybe I'm missing some piece of damning evidence? I'm hoping someone with more relevant experience can speak out here.
