  text: |-
    Flippant at best. Misdirection as read literally.
    One single bad-actor entity foisted weak practically no encryption onto everybody in the world.

    Only by sheer luck did it not poison everything or get visibly exploited---yet. We don't know the risk exposure from activity that is dark / unreported (certs not being publicly logged). It could be nothing, but that's not how security is done. If you leak a secret, you drop everything and immediately rotate the secret and everything derived from that secret, no matter what. You do not hide behind a fig leaf of weak sauce lying PR to the tenor of "well, nothing to see here move along... 'coz, like, it's only in our house and there has been no impact here (according to us), and like, besides, it wasn't for thaaat long anyhow".
    Emergency fixes arrived post-disclosure only due to the "all-hands-on-deck" hard work of a very small number of competent security people.

    None of the work was initiated or driven by the entity. The concerned security community had to hand-hold them and egg them on at every step.
    And then, tadaaa! The entity proceeds to literally leave the chat... Ghosts the bugzilla thread, announces shuttering of the PKI business, releases incomplete, misleading, and responsibility-abdicating PR.

    For everyone splitting hairs in this thread, I will simply defer to Chrome team's latest remark on the bugzilla: https://bugzilla.mozilla.org/show_bug.cgi?id=2083449#c41
    Emphasis theirs.

    [In response to Comment 39.]
    While we understand that many things are happening in parallel right now, "social media scrutiny" and "analysis by investors/customers" are not acceptable explanations for delayed responses here.
    That scrutiny is the predictable result of eMudhra's own failure (i.e., intermediate CA keys that anyone could recover -- resulting in anyone being able to issue certificates for any domain), not an external circumstance that befell it. Offering it as an excuse conveys that reputation management is being prioritized over the obligations that eMudhra still owes to the billions of relying parties its mistake exposed. Those obligations do not relax because the consequences are uncomfortable.
    We expect eMudhra to prioritize its review of this issue and its security response.
