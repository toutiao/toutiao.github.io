  author: nullc
  text: 'This is a surveillance oriented alternative to cryptocurrencies which uses
    the distraction of complicated cryptography to obfscuate the fact that by design
    it intentionally undermines the privacy of its users: it attaches the receivers
    identity to every payment they receive, along with the amount and makes it non-private--  potentially
    opening the door to abuse by kidnappers, extortionists, marketers responding to
    income signals, plaintiffs attorneys, and other such scoundrel.<p>The claims that
    is is privacy preserving are deceptive, and in my option constitute an act of
    intentional fraud on the part of its creators -- the fact that people are deceived
    by the privacy claims is clear in your comment:  You ask why would the banks adopt
    something private. The answer is: it isn&#x27;t.<p>Its existence is justified
    under a fairytale model of how the world works-- a <i>false</i> belief that actually
    anonymous payments are unlawful and that their compromised alternative is the
    best possible.  In the path of doing so, they not only falsely sell a system with
    compromised privacy as private, but they also help bring about a dystopia where
    privacy is unlawful in much the same manner that doing business with companies
    that refuse to accept cash does.<p>It would be fair to say that its an upgrade
    to privacyless systems-- because it doesn&#x27;t attach the sender&#x27;s identity
    to the transactions themselves--, but to characterize it as a private or privacy
    preserving system is a lie.'
