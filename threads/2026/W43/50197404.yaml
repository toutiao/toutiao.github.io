    you and I are aware of the limitations-- but we&#x27;re domain experts.<p>People
    hear that it&#x27;s private and -- unsurprisingly-- think it&#x27;s private! :P  In
    my view it&#x27;s like to Apple&#x27;s proposed content scanning in end to end
    encryption that applies a lot of additional cryptographic complexity with <i>language</i>
    that suggests that it&#x27;s protecting the user&#x27;s privacy, but in reality
    the complexity is entirely there to undermine their privacy (in a somewhat selective
    way) and a far simpler scheme would give much stronger privacy.<p>I think it&#x27;s
    analogous to promoting a key-escrow cryptosystem as &quot;communicate privately!&quot;--
    both in terms of people not getting the privacy from it they would expect and
    helping to bring about a world where actual privacy is unlawful.  The privacy
    problems of Taler are essentially identical to those of key-escrow:  even if you
    don&#x27;t have any fear of &#x27;lawful&#x27; access, any access that exists
    may be abused.  The only reliable solution to the security&#x2F;privacy problems
    is for the access to not exist unless that is literally impossible.  But it&#x27;s
    clearly not impossible, as many people use more private systems than taler every
    day including in Germany.<p>Taler is strictly less private and considerably more
    complicated than a basic chaum-cash token system-- which actually provides the
    privacy people expect it to have.  So it&#x27;s not like I&#x27;m suggesting blockchain
    mumbo-jumbo is the only alternative. :)'
