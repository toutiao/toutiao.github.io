  author: nullc
  text: 'Indeed, taxation today and historically is not based on mass surveillance
    and doesn&#x27;t depend on mass surveillance.<p>If you&#x27;re failing to pay
    taxes on any scale you&#x27;re going to get caught by whistleblowers or by conspicuous
    visible purchases. Enforcement isn&#x27;t 100%, of course, but it never is for
    any crime and it doesn&#x27;t need to be.<p>Even if your effective tax rate is
    50% evasion can <i>only</i> double your money at best, and you&#x27;ve only got
    taxes to pay if you&#x27;ve got a successful income stream-- it doesn&#x27;t take
    much threat of imprisonment or large fines to keep someone with something to lose
    staying within the lines.  You&#x27;re already making good money (if you&#x27;re
    not-- no taxes) so why risk your good situation for a small constant factor more?<p>Some
    amount of successful evasion simply means somewhat higher taxes for everyone else,
    and that is a reasonable compromise for not living in a panopticon-- particularly
    since no amount of surveillance can entirely prevent tax evasion.<p>To the extent
    that someone wants to engage in evasion they&#x27;d route around this surveillance
    system or not even worry about it: Data isn&#x27;t intelligence, visible income
    can be offset by fake expenses (which are private in this system too!)-- and so
    it can&#x27;t be said that this scheme&#x27;s surveillance would even be particularly
    effective at blocking tax evasion.  You&#x27;d be left with detecting it via traditional
    means, just as you already can even with completely private transactions, but
    without the privacy loss.<p>So it&#x27;s a non-solution to a non-problem, that
    create significant privacy related collateral harm.  It can do both because non-evaders
    won&#x27;t bother to take the additional steps to protect themselves, and are
    exposed to every hack, leak, data-breach, change of policy, or abuse of lawful
    process.<p>(Analog: run strong encryption or strong encryption+steganography inside
    key-escrowed encryption. This possibility bounds the potential benefits of key
    escrow but fails to bound the harms.)<p>For any system one should imagine the
    abuse potential should the currently benign regime be replaced with a future genocidal
    one.  Certainly Germans should be well acquainted with the value of that kind
    of reasoning-- it isn&#x27;t like targeting sub-populations for asset seizure
    is a hypothetical threat.  A key property of privacy loss is that it&#x27;s forever:
    you might not mind a piece of exposure today but years from now it could turn
    fatal.<p>But even then I wouldn&#x27;t complain about it <i>except</i> for the
    misleading presentation of it as a privacy system and the smearing of opponents
    as tax evaders.<p>It&#x27;s simply a falsehood to claim people opposed to this
    are opposed to taxation.  Personally, I find taxation to often be a superior choice
    to fund public infrastructure compared to the most obvious alternatives such as
    printing money or accumulating debt-- particularly because taxation is more visible
    and thus more accountable.  But we must take great care to mitigate the potential
    collateral damage of taxation including accounting overhead, market distortion,
    and loss of privacy.<p>The false and defamatory characterization of opponents
    as tax protesters is part of why I feel comfortable saying that I believe the
    mischaracterization of the system as &#x27;private&#x27; is an act of intentional
    fraud. An honest system doesn&#x27;t need to discourage or suppress its critics
    by falsely accusing them of being in favor of crime or other anti-social conduct.'
