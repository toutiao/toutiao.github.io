  author: dathinab
  text: "&gt; buys Taler<p>it&#x27;s more transaction tokenization system then a crypto
    currency, so you don&#x27;t really &quot;buy Taler (currency)&quot;, you give
    Taler digital Euros and they give you a token representing this digital Euros
    in a more anonymous way. (They also can work for other currencies, but doesn&#x27;t
    do currency exchanges&#x2F;cross currency transactions itself).<p>Effectively
    this means:<p>- The merchant (e.g. your local grocery store, restaurant etc.)
    doesn&#x27;t get information about you they can aggregate, sell etc. This is the
    main improvement.<p>- It&#x27;s not controlled by a US company, this is also a
    pretty big improvement.<p>- Taler doesn&#x27;t strictly require customer wallets
    to be bound to an bank account nor do they identify who you are as a customer.
    This makes it hard for Taler to abuse the audit log, which is also an improvement.<p>-
    It does strictly require merchants (anyone receiving money) to be bound to a bank
    account for given currency (here Euro). It&#x27;s best to think about it as the
    money going directly to the merchants normal bank account.<p>- Taler has audit
    logs containing what token was used from which customer(id) with which merchant
    (which is strictly bound to having to have a bank account), as well as logs about
    how money got into the customers wallet and all this methods you can put money
    into it will (likely) be traceable, so criminal investigator and similar can still
    pretty much trace back who did which transaction when. Just with a bit more effort&#x2F;extra
    steps. So with enough automation states can as much surveil you then they can
    now. Practically it seems to make things a bit more high effort then today, which
    is a good thing to have.<p>IFF Taler allow putting digital Euros into a wallet
    using gift cards buyable with cash this indeed could still be used for money laundering
    (similar to how most gift card systems can be used for it), but I think it&#x27;s
    unlikely they allow such things and most people practically will likely link up
    their bank account.<p>Another thing to consider is that for any ordering of physical
    good you normally have to put in a shipping address with your name, even if you
    send it to a post box.<p>And for a bunch of other things the vendor also has to
    get your identity out of band (independent of used payment processing). E.g. many
    kinds of contracts, high value payments, currency exchanges etc. etc.<p>This doesn&#x27;t
    make it useless. It still is an improvement. Especially if payment terminals in
    physical shops get support for it and&#x2F;or digital goods can be bought with
    it. In Germany a lot of the large chains with physical shops more or less all
    use the same payment terminals for card payment with support relative flexible
    software so it&#x27;s actually possible I think. Just hard to happen without regulatory
    pressure, similar to Wero support on a payment terminal."
