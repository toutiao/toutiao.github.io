  author: _jackdk_
  text: 'One point of Taler&#x27;s architecture is that blind signatures are used
    to create tokens, so the issuer doesn&#x27;t know which coin was issued to which
    person. Then the merchant doesn&#x27;t know who the coin was issued to but can
    redeem it with the issuer if it&#x27;s valid. So if there&#x27;s enough transaction
    volume it&#x27;ll be hard for issue of coins and redemption at merchants to be
    correlated.<p>What worries me is the SNB whitepaper on &quot;how to issue a digital
    currency&quot; they worked on with Taler: <a href="https:&#x2F;&#x2F;www.snb.ch&#x2F;public&#x2F;asset&#x2F;de&#x2F;www-snb-ch&#x2F;publications&#x2F;research&#x2F;working-papers&#x2F;2021&#x2F;working_paper_2021_03&#x2F;publications0&#x2F;working_paper_2021_03.n.pdf"
    rel="nofollow">https:&#x2F;&#x2F;www.snb.ch&#x2F;public&#x2F;asset&#x2F;de&#x2F;www-snb-ch&#x2F;publications&#x2F;r...</a><p>&gt;
    &gt; In addition, charging an exchange fee would allow the central bank to implement
    negative interest rates, if deemed necessary. The central bank could also impose
    a conversion limit per customer for AML&#x2F;CFT (“cash” limits) or financial
    stability reasons (to prevent hoarding or bank runs), if desired.<p>And also I
    don&#x27;t think they have a privacy-preserving solution for money transfers between
    consumers. So if I wanted to give you 20€ I think that has to be represented as
    a burning of tokens and a reissue, so the central issuer learns all those transactions
    even though purchases at merchants are private.'
  score: 0
