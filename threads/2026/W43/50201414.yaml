  author: amiga386
  text: What you&#x27;re saying sounds insane. You&#x27;re saying that a person taking
    a photo&#x2F;video in public -- EVERY person doing so -- has to identify EVERY
    person in the photo&#x2F;video, and inform EVERYONE of their rights, etc.... if
    they upload it to YouTube or Flickr?<p>I don&#x27;t believe they do. That would
    be massively disproportionate. Show me they do, show me even a single tourist
    being prosecuted for not informing every street passer-by behind them in their
    selfie-stick video of their data rights.<p>The law has been applied at e.g. commercial
    photographers (who make contractual agreements with the intended subject in the
    photo because they want to make full use of the subject&#x27;s identity, e.g.
    advertising), CCTV (notice has to be given) and events (where people are informed
    there is filming and they can choose not to be in it), but the public in public
    filming the public? (in general, and not specific people) It has not happened
    to my knowledge.<p>If the law were applied like you say it is, the only legal
    filming in public would be to CLOSE the area to the public and have no members
    of the public in public. Like a film set, where the only passers-by are paid extras
    who signed a release. That&#x27;s completely untenable.<p>I can&#x27;t speak for
    member states laws, I only know one country&#x27;s laws, but in the UK, this simply
    wouldn&#x27;t be done. The reasoning would be that providing such data subjects
    with information about the data processor would be IMPOSSIBLE. The data processor
    (tourist) has absolutely no idea who any of the people in the photo&#x2F;video
    are, and never will.<p>My understanding is that when videos are uploaded to YouTube,
    the fact Google is publishing it makes Google the data processor, and Google&#x27;s
    duties are fulfilled by <i>not</i> seeking to identify the people in the video,
    but offering them their rights nonetheless should the data subject be able to
    identify themselves.
  score: 0
  posted_at: '2026-10-23T15:20:33Z'
- id: '50211951'
  parent_id: '50210551'
  author: buzer
  text: There is <a href="https:&#x2F;&#x2F;gdprhub.eu&#x2F;index.php?title=Rb._Gelderland_-_C%2F05%2F368427"
    rel="nofollow">https:&#x2F;&#x2F;gdprhub.eu&#x2F;index.php?title=Rb._Gelderland_-_C%2F05%2...</a>
    for example. While it didn&#x27;t touch Article 13 itself it did touch 2(2)(c).
    One of the reasons court gave is (machine translated, I do not speak Dutch):<p>&gt;
    In addition, with Facebook it cannot be ruled out that placed photos may be distributed
    and may end up in the hands of third parties.<p>So court considered just that
    possibility as one of the aspects which led to household exemption being unavailable.<p>&gt;
    What you&#x27;re saying sounds insane. You&#x27;re saying that a person taking
    a photo&#x2F;video in public -- EVERY person doing so -- has to identify EVERY
    person in the photo&#x2F;video, and inform EVERYONE of their rights, etc.... if
    they upload it to YouTube or Flickr?<p>They do not need to identify them, but
    they need to provide the sufficient Article 13 notice. That could be, for example,
    sufficiently clear sign that they wear. You can check C‑422&#x2F;24 for what CJEU
    said about body worn cameras. One of the important points court highlighted is:<p>&gt;
    If it were accepted that Article 14 of the GDPR applies where personal data are
    collected by means of a body camera, the data subject would not receive any information
    at the time of collection, even though he or she is the source of those data,
    which would allow the controller not to provide information to that data subject
    immediately. Therefore, such an interpretation would carry the risk of the collection
    of personal data escaping the knowledge of the data subject and giving rise to
    hidden surveillance practices.<p>And regarding:<p>&gt; If the law were applied
    like you say it is, the only legal filming in public would be to CLOSE the area
    to the public and have no members of the public in public. Like a film set, where
    the only passers-by are paid extras who signed a release. That&#x27;s completely
    untenable.<p>It can be legal to film in public, but it either requires using the
    derogations and applicable Member State laws (like artistic expression exemption)
    or making sure you actually give that Article 13 notice. Or truly just use it
    for household use.<p>Of course these things are not normally enforced unless someone
    actually files a complaint.<p>[EDIT] since I forgot to address this point<p>&gt;
    My understanding is that when videos are uploaded to YouTube, the fact Google
    is publishing it makes Google the data processor, and Google&#x27;s duties are
    fulfilled by not seeking to identify the people in the video, but offering them
    their rights nonetheless should the data subject be able to identify themselves.<p>Processing
    is evaluated per processing operation. YouTube itself is controller for many of
    these. These could, for example, include actually surfacing the video via algorithm.
    The important decisions here are C‑492&#x2F;23 from last year and C-188&#x2F;24
    from this year.
