  author: amiga386
  text: 'This is not the case at all!<p>GDPR Article 2(2)c &quot;This Regulation does
    not apply to the processing of personal data: by a natural person in the course
    of a purely personal or household activity&quot;. If you&#x27;re photographing&#x2F;videoing
    for yourself (non-commercial), an exception for you already exists. You don&#x27;t
    need to become a data controller for all the incidental people in your holiday
    videos.<p>But if you upload the video to YouTube... Google is the data controller,
    and billions of unnamed, unknown individuals are its data subjects. Courts have
    ruled that even if you post on social media and you&#x27;re restricting it to
    friends &amp; family, that falls under the individual&#x2F;household exception,
    but if it&#x27;s viewable to all, GDPR applies.<p>Google doesn&#x27;t need to
    discover who these people are. That would be bad in and of itself (Article 11:
    Processing which does not require identification)<p>But if a data subject <i>does</i>
    contact Google, and can confirm they are the specific person in a video, they
    can get their Article 13&#x2F;14&#x2F;15&#x2F;16&#x2F;17&#x2F;18 rights... which
    are subject to the other exceptions you mention.'
  score: 0
  posted_at: '2026-10-23T12:22:21Z'
