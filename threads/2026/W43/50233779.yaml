  author: bayindirh
  text: Actually not. Watt per task is a metric bothers more than LLM operators and
    users. We care about it a lot, and working a lot to measure and improve it, and
    we&#x27;re not doing it in context of AI or LLMs.<p><i>Effectively instant</i>
    means nothing, since everything is fast for small <i>n</i>. I love to give this
    example from a codebase I have worked on during my Ph.D. The problem which took
    half an hour under Matlab was done in ~40 seconds with mine, however, a thousand-step
    version of the same problem would take 11 <i>hours</i>. Saving a single second
    from that 40 second loop would shave my work by ~20 minutes, and this will compound
    for bigger problems still.<p>Just because we see the results instantly, doesn&#x27;t
    mean it&#x27;s fast or efficient by any means. It means we might forego optimizing
    it for sufficiently small n, if we don&#x27;t care about that part of the code.
    That&#x27;s all.
