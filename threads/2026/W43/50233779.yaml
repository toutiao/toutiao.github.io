  author: randcraw
  text: Frankly, I think we very much _do_ need to be reminded that LLMs are in fact
    _not_ eating the world.<p>It&#x27;s at the forebrain of every executive in America
    that LLMs imbued with RLHF are on the cusp of replacing every job they can imagine,
    from robot chauffeurs to carpenters to surgeons.  But as this paper suggests,
    the integration of generally capable vision systems with basic tool handling that
    will be needed to replace the specific skills essential to most human jobs --
    especially using only today&#x27;s frontier models -- still takes us unforeseeably
    and undeniably far into the realm of sheer fantasy.
