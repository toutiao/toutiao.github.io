  author: chilmers
  text: 'Here&#x27;s a good heuristic for predicting the ability of a modern frontier
    LLM at any non-automatable task: Is it hugely overrepresented in their pre-training
    dataset (e.g. code), and were they specifically post-trained on it using reinforcement
    learning (e.g. coding)? If the answer to one or both is yes, you should expect
    them to be very good at it. Otherwise, you should expect them to be, at best,
    as good as an average human who&#x27;s read a few books on the subject and is
    good at bullshitting.'
