  author: yesco
  text: It&#x27;s funny you mention this, because I&#x27;ve been thinking lately that
    all the focus on code quality benchmarks for LLMs seems to miss something. In
    my experience, LLMs aren&#x27;t actually all that good at prompting <i>other</i>
    LLMs, and that&#x27;s exactly the skill that matters for proper subagent usage.<p>The
    corpus of code available to train LLMs on is rich in both volume and quality.
    The same can&#x27;t be said for LLM prompts. Prompts only came into existence
    alongside LLMs themselves, so most of the prompts out there are actually LLM generated,
    and training on them causes every model to overfit to the same patterns.<p>LLMs
    can give clear and concise directives to other LLMs, but only for basic tasks.
    Beyond that, they frequently overstuff their prompts with too much prose and too
    much direction, and worse, they often fill them with subtle contradictions.<p>Of
    course, there&#x27;s a spectrum here. Some models turn out to be better at this
    than others, and I suspect this is what differentiates Fable-type models from
    the rest, and why vendors have started keeping their models&#x27; reasoning confidential.
  score: 0
