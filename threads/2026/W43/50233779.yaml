  author: thereforegrin
  text: They are supposed to, but often times they don&#x27;t and there are no consequences
    for it.<p>Current diagnostic setup relies on humans having vast expert knowledge,
    when in fact it&#x27;s almost always impossible.<p>A well trained neural net&#x2F;LLM
    will always be better at visual detection because of sheer number of examples
    it sees during training, compared to a dermatologist which, if lucky will observe
    no more than 20 patients&#x2F;day x 270 days a year x 40 years of practice i.e.
    around 220k samples throughout his lifetime.<p>MD with other specialties will
    see significantly less and we are talking about top of the top specialists.<p>An
    average MD knows more amount medical diagnostics than than the average Joe, but
    in principle much less than a well trained AI.<p>Do we have those kinds of models
    already? Maybe not yet but, ceteris paribus, we will definitely have them in the
    future.<p>IMHO we do have those models already but they aren&#x27;t available
    to the public, though their availability would certainly lower cost for healthcare
    providers.
