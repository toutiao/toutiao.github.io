article:
  url: https://lynchlab.net/llm-skin-cancer
  title: A 10-year-old CNN outperforms frontier LLMs for skin cancer diagnosis | Lynch
    Lab
  fetch_status: success
  content: "This is a melanoma.\n\n![Clinical photograph: Invasive melanoma on the
    ear, under 0.8 mm thick.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_7403025.jpg)
    ![Dermoscopic image: Invasive melanoma on the ear, under 0.8 mm thick.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_4552372.jpg)\n\n_Figure
    1. Invasive melanoma on the ear, under 0.8 mm thick. Both LLMs called it a seborrhoeic
    keratosis and said it could be discharged. The CNN called it a melanoma. Clinical
    photograph on the left, dermoscopic image on the right. Images: MILK10k, MILK
    study team, CC BY-NC._\n\nI showed these two images - a clinical photograph and
    a dermoscopic (skin microscope) image - to GPT-6 Astra and Claude Fable 5.1, two
    of the most capable AI models available in October 2026. Both said it was a seborrhoeic
    keratosis, a harmless warty growth, and that the patient could be discharged.
    I then showed them to fine-tuned version of Inception v3, a convolutional neural
    network (CNN) first published by Google in 2015 and fine-tuned here on public
    dermatology images. The CNN got the right answer based on the dermoscopy view.\n\nIt
    was one of 200 biopsy-proven lesions I gave to all three. The CNN named the right
    diagnosis (out of 6 possiblities) for 125 of them (62%). The two frontier LLMs
    named it for 84 and 85 (42%). A ten-year-old network, fine-tuned for about twenty
    minutes, beat both of them at recognising skin cancer.\n\n## The test[#](#the-test
    \"Link to this section\")\n\nThe lesions come from [MILK10k](https://doi.org/10.34970/648456),
    a public dataset released through the International Skin Imaging Collaboration
    in 2025, in which each lesion is photographed twice: a clinical close-up and a
    dermoscopic image taken through the illuminated magnifying lens dermatologists
    use. I drew 200 lesions at random, all confirmed by histopathology:\n\n- **100
    that should not be discharged:** 30 melanomas, 25 basal cell carcinomas, 25 squamous
    cell carcinomas (including Bowen’s disease) and 20 actinic keratoses.\n- **100
    that are safe to discharge:** 50 benign naevi (moles) and 50 seborrhoeic keratoses.\n\nEvery
    lesion was biopsied, including the benign ones, so these are harder to diagnose:
    a mole that somebody decided to cut out is one that worried a clinician.\n\n![Clinical
    photograph: Basal cell carcinoma on the trunk of a 75-year-old man. Both models
    answered correctly.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_5168853.jpg)
    ![Dermoscopic image: Basal cell carcinoma on the trunk of a 75-year-old man. Both
    models answered correctly.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_2485182.jpg)\n\nBasal
    cell carcinoma on the trunk of a 75-year-old man. All three models answered correctly.\n\n
    ![Clinical photograph: Invasive melanoma under 0.8 mm thick, with very little
    pigment. GPT-6 Astra called it a basal cell carcinoma with 95% confidence.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_1091183.jpg)
    ![Dermoscopic image: Invasive melanoma under 0.8 mm thick, with very little pigment.
    GPT-6 Astra called it a basal cell carcinoma with 95% confidence.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_6551749.jpg)\n\nInvasive
    melanoma under 0.8 mm thick, with very little pigment. GPT-6 Astra called it a
    basal cell carcinoma with 95% confidence. Claude Fable 5.1 and the CNN called
    it a melanoma.\n\n ![Clinical photograph: Seborrhoeic keratosis on the leg. Both
    models called it an actinic keratosis and said it should not be discharged.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_3428806.jpg)
    ![Dermoscopic image: Seborrhoeic keratosis on the leg. Both models called it an
    actinic keratosis and said it should not be discharged.](https://d2gaqzonlm544h.cloudfront.net/skin-ai/samples/ISIC_6279832.jpg)\n\nSeborrhoeic
    keratosis on the leg. Both LLMs called it an actinic keratosis and the CNN a squamous
    cell carcinoma: all three were wrong, though all three would have kept it rather
    than discharge it.\n\n_Figure 2. Three more of the 200 test lesions. Clinical
    photograph on the left, dermoscopic image on the right. Images: MILK10k, MILK
    study team, CC BY-NC._\n\n**The LLMs** were given both images and nothing else,
    and asked, as a clinician might use them, for the most likely of the six diagnoses
    (or “unsure”), a confidence, a second choice, and whether the lesion could be
    safely discharged with no treatment, biopsy or follow-up. Both models got the
    same prompt at default settings, and neither refused a case.\n\n**The CNN** is
    deliberately not state of the art. I used Inception v3 pretrained on everyday
    photographs and then fine-tuned all layers on 68,011 dermoscopic and clinical
    images from the [ISIC Archive](https://www.isic-archive.com) on a single H100
    GPU. These 200 test lesions, and every other photograph of the same lesion or
    patient, were removed from its data (including the validation set) before training,
    so it had never seen them, and they were not used to choose the model or set its
    threshold. It scored both images of each lesion, combined them with most of the
    weight on the dermoscopic image, and chose from the same six diagnoses.\n\nYou
    can [try the CNN yourself](/skin-ai-inception). Remarkably the model is small
    enough to run entirely in a phone browser using WebGPU. Nothing is uploaded, and
    its random sample button draws from these same 200 lesions.\n\n## Diagnosis: 62%
    against 42%[#](#diagnosis-62-against-42 \"Link to this section\")\n\n_Figure 3.
    Correct first-choice diagnosis for the two LLMs and the CNN, which chose from
    the same six diagnoses. Labels show correct answers out of the number of lesions
    with that histology._\n\nThe CNN was right more often overall and on most diagnoses.
    Allowing a second choice, it reached 173 of 200 against 134 and 138. It named
    13 of the 30 melanomas against 8 and 11. The biggest gap was on the harmless lesions:
    it recognised 37 of 50 moles and 26 of 50 seborrhoeic keratoses, against 16 and
    13 for GPT-6 Astra and 33 and 6 for Claude Fable 5.1. It was one short of GPT-6
    Astra on basal cell carcinoma and behind both LLMs on actinic keratosis.\n\nThe
    models also failed differently. Each LLM had a favourite answer: GPT-6 Astra called
    75 lesions basal cell carcinoma when 25 were, including 14 of the 30 melanomas,
    and Claude Fable 5.1 called 53 lesions actinic keratosis when 20 were. The CNN’s
    errors on melanoma went the other way: of the 17 it got wrong, it called 8 a naevus
    and 6 a seborrhoeic keratosis.\n\n## The results in one table[#](#the-results-in-one-table
    \"Link to this section\")\n\n| | GPT-6 Astra | Claude Fable 5.1 | CNN (Inception
    v3) |\n| --- | --- | --- | --- |\n| Correct diagnosis (of 200) | 84 (42%) | 85
    (42%) | 125 (62%) |\n| Correct in first or second choice | 134 | 138 | 173 |\n|
    Melanoma as first choice (of 30) | 8 | 11 | 13 |\n| Unsafe lesions kept (of 100)
    | 97 | 96 | 77 at its preset threshold; 98 or 99 when matched |\n| Safe lesions
    discharged (of 100) | 32 | 22 | 76 at its preset threshold |\n| Melanomas discharged
    (of 30) | 3 | 4 | 18 at its preset threshold; 2 or 1 when matched |\n\n## Caveats[#](#caveats
    \"Link to this section\")\n\n- **Small numbers.** Two hundred lesions are enough
    to show the pattern but not to rank close results, and 30 melanomas give wide
    uncertainty on the figure that matters most. Each LLM case was run once; answers
    vary between runs.\n- **Hard cases.** Every lesion was biopsied. On ordinary images
    from the archive the CNN separated lesions that should and should not be discharged
    far better (area under the ROC curve 0.96, against 0.86 here).\n- **Contamination.**
    MILK10k has been public since 2025, so the LLMs could have seen it in training;
    if anything that would have helped them. The CNN certainly had not.\n- **Not state
    of the art.** Inception v3 is a baseline. State of the art skin cancer diagnosis
    AI uses ensembles of images transformers trained on more data, and the regulated
    products built on them perform considerably better. \n\n## Asked as a patient[#](#asked-as-a-patie"
