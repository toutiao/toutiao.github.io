  author: sungam
  text: The CNN architecture used here is definitely outdated. I used it as a baseline
    to compare to the LLMs and because the model is small enough to run using WebGPU
    in a phone browser for demonstration. Modern approaches use ensembles of vision
    transformers and have proven accurate in clinical trials
