  text: It&#x27;s very strange to me that articles like this get upvoted, because
    they are coming from this assumption that LLMs are better at everything and that
    it&#x27;s notable and newsworthy when there&#x27;s something that they aren&#x27;t
    actually better at.<p>I don&#x27;t think we should need to be reminded that frontier
    models aren&#x27;t particularly good at most tasks. Just like we shouldn&#x27;t
