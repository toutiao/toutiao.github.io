  author: pessimizer
  text: 'Like another commenter, I&#x27;ve also been on the other side, and there
    was open discussion about how to delay responses or leave incriminating information
    out of them.<p>I remember specific examples of figuring out spurious legal objections
    to raise that would immediately fall if challenged, but would take months to challenge.
    I also remember people using records retention policies as 1) an excuse to destroy
    records that were still held, and pretending like they had been destroyed in the
    past, and 2) actively changing them in order to destroy things that had been requested,
    but maybe the request had been withdrawn to be resubmitted. I, as the IT person,
    remember being asked to come up with technical reasons why something could not
    be done, or would be expensive to do.<p>Related: I remember my innocence as an
    eager little guy in one of his earliest professional jobs, installing a system
    that would make everybody&#x27;s email easily searchable if a subpoena or a FOIA
    had to be responded to, and the sheer panic and chaos that ensued. The solution
    was to install a chat that instantly dumped history and was not searchable, and
    to have a lot more face to face meetings.<p>Hanlon&#x27;s Razor is a corruption
    enabler that only resonates because people confuse it with Occam&#x27;s Razor.
    Occam was a logician; Hanlon&#x27;s Razor was some bullshit submitted to a jokebook,
