  author: manwe150
  text: I’ve often wonder if cancelling trains (and busses) would make them on time
    more in practice too, by queuing theory. If you just let them run late, that starts
    to compounds until you get a Bernoulli distribution (exponential arrival delays)
    as the system becomes unstable. If canceling a train means the next one can run
    actually on time, then the system is forced back towards stability with predictable
    reliable times. Sure you had to miss one slot, but in the alternative scheme where
    everyone is late, you miss every slot — and average wait times are doubled in
    an exponential process compared to a periodic system that sometimes skips an entire
    train intentionally.
