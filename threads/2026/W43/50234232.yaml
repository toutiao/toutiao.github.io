  author: jmyeet
  text: 'There&#x27;s no one standard because it depends on if you&#x27;re talking
    about federal FOIA requests or laws for one of the 50 states. And they&#x27;re
    different.<p>A big difference is that so many positions that in the UK would be
    civil servants are elected positions in the US or are appointed and possibly confirmed
    by a legislative body. That means that so many positions down to the local level
    in the UK are political. Even if the position isn&#x27;t political, the person
    in that job might be hoping to gain one of those positions one day.<p>We famously
    have a Kentucky clerk, Kim Davis, who refused to issue marriage licenses for same-sex
    couples because it was, she argued, against her faith [1]. That should be unacceptable
    from any person fulfilling a government function. If something is against your
    faith, don&#x27;t do that job. Or leave your faith at the door when you go to
    work. So many other places that just wouldn&#x27;t happen.<p>But this infects
    a lot of state and local government functions too where sheriffs and DAs are elected
    positions and there have been cases where they simply won&#x27;t investigate or
    prosecute certain cases. This was a real problem as civil rights activists were
    the victims of violence in the South in the 1950s and 1960s. Nobody would get
    prosecuted.<p>On top of all of that, many people who one day want to run for office
    want to be perceived as &quot;tough on crime&quot; so they back the police even
    when doing so is indefensible.<p>Back to FOIA, depending on what laws are applicable,
    there are often laws about deadlines for a response and limitations on cost, being
    only reasonable labor and materials. Yet agencies will slow walk FOIA requests,
    sail right through deadlines and, as in this case, come up with ridiculous cost
    estimates to comply.<p>But increasingly in the US, particularly at the federal
    level, people responsible will just flagrantly break the law because there will
    be no consequences.<p>This has forced a lot of people to file what in the US are
    called <i>(writ of) mandamus</i> lawsuits. This is when you ask a judge to force
    an agency to do something they&#x27;re supposed to do anyway. Really what you&#x27;re
    doing is forcing them to explain themselves to a judge. It shouldn&#x27;t be necessary
    but it is.<p>[1]: <a href="https:&#x2F;&#x2F;www.npr.org&#x2F;2024&#x2F;01&#x2F;04&#x2F;1222810445&#x2F;ex-kentucky-clerk-who-refused-to-issue-same-sex-marriage-licenses-must-pay-260-0"
    rel="nofollow">https:&#x2F;&#x2F;www.npr.org&#x2F;2024&#x2F;01&#x2F;04&#x2F;1222810445&#x2F;ex-kentucky-clerk-...</a>'
  score: 0
