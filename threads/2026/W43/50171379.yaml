  text: I wrote this after a few weeks of experimenting with image models through
    APIs, mostly to work out what’s actually cheap and reliable. Every image in it
    came from those experiments and cost about a penny each. The bits I found most
    interesting were why “describe the camera” works better than “describe the view”,
    and how poorly general models handle exact structure like sprite sheets. Happy
    to answer questions.
