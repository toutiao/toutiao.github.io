      - [Doing pixel art properly](#doing-pixel-art-properly)
      - [Where the line falls](#where-the-line-falls)

    - [Integrating image generation into a coding project](#integrating-image-generation-into-a-coding-project)
      - [Put a thin interface in front of every provider](#put-a-thin-interface-in-front-of-every-provider)
      - [Expect the ground to move](#expect-the-ground-to-move)
      - [Log everything](#log-everything)
      - [Treat generation as a slow, failing job](#treat-generation-as-a-slow-failing-job)
