    ## TLDR

    - **Most models start from noise and clean it up.** Text steers the clean-up. Newer models also plan the image the way a chat model plans a sentence.
    - **You pay for the canvas, not the content.** A plain wooden table costs the same as a detailed oil painting of the same size.
    - **ChatGPT is the easiest way in and the hardest to control.** Great for one-off images and conversational edits. For anything repeatable you want the API.
    - **Prices vary more than 100 times over.** Anything from a fraction of a cent to 15 cents or more per image. Running a model locally costs nothing. The cheapest model isn’t always the cheapest result.
    - **The APIs move under you.** Models get retired with weeks of notice and providers quietly ignore parameters. Keep the model in config and log what you actually got back.
    - **Describe how it was made, not how it should look.** Camera, film, print process and layout get better results than “stunning” and “hyper-detailed”.
    - **Spelling and fingers are no longer the giveaway.** The tell now is taste. Too much glow, too much drama and nothing allowed to be plain.
    - **Agents are good at this.** A multimodal agent can write the prompt, call the API, look at the result and try again. You still need to supply the taste.
    - **The best pipelines are hybrids.** Let AI do the creative part. Let ordinary code do the exact parts like sizing, transparency, palettes and layout.

    ## A short history

    - **2014 - GANs.** Ian Goodfellow’s [generative adversarial networks](https://arxiv.org/abs/1406.2661) pit two networks against each other, one making images and one spotting fakes. They go on to produce convincing synthetic faces but are hard to steer with text.
    - **2015 - DeepDream.** Google’s [Inceptionism experiments](https://research.google/blog/inceptionism-going-deeper-into-neural-networks/) turn image recognition inside out. The results are full of [psychedelic dog faces](https://www.fastcompany.com/3048941/why-googles-deep-dream-ai-hallucinates-in-dog-faces), because the network was trained on a dataset with a lot of dogs in it.
    - **2018 - AI art goes to auction.** A blurry GAN portrait called _Edmond de Belamy_[sells at Christie’s for $432,500](https://www.bloomberg.com/news/articles/2018-10-25/ai-generated-portrait-is-sold-for-432-500-in-an-auction-first), more than 40 times its top estimate.
    - **2019 - Faces that don’t exist.** NVIDIA’s [StyleGAN](https://arxiv.org/abs/1812.04948) powers [thispersondoesnotexist.com](https://thispersondoesnotexist.com), a new photorealistic fake face on every refresh.
    - **2021 - DALL-E.** OpenAI links text and images in one model. You can type a sentence and get a picture, even if it’s a small, blurry one.
    - **2022 - The breakout year.** DALL-E 2, [Midjourney](https://en.wikipedia.org/wiki/Midjourney) and [Stable Diffusion](https://stability.ai/news/stable-diffusion-public-release) all arrive within a few months. Stable Diffusion is open source and runs on a gaming PC with about 7GB of video memory, which kicks off a huge community of fine-tunes and tools.
    - **2023 - Photorealism and readable text.** A Midjourney image of the [Pope in a white puffer jacket](https://www.snopes.com/fact-check/not-real-photo-pope-in-puffy-coat) fools much of the internet. [Ideogram](https://en.wikipedia.org/wiki/Ideogram_(text-to-image_model)) launches with text you can actually read. SDXL raises the bar for open models and DALL-E 3 moves into ChatGPT.
    - **2024 - Flux and the backlash.** Former Stable Diffusion researchers found Black Forest Labs and [release Flux](https://bfl.ai/announcements/24-08-01-bfl), which becomes the default open-weight model. Meanwhile AI posters become a byword for cutting corners (more on that [below](#marketing-is-where-ai-images-get-the-most-criticism)).
    - **2025 - Native image models.** OpenAI builds image generation into GPT-4o itself and the “Studio Ghibli” trend takes over social media. Google’s [Gemini 2.5 Flash Image](https://developers.googleblog.com/en/introducing-gemini-2-5-flash-image/), nicknamed Nano Banana, makes conversational editing cheap at $0.039 an image.
    - **2026 - Abundance and churn.** OpenAI [switches off DALL-E](https://community.openai.com/t/deprecation-reminder-dall-e-will-be-shut-down-on-may-12-2026/1378754) in its API. OpenRouter alone lists over 60 image models from a dozen companies, and older models are retired every few months.

    ### Six fingers and gibberish text

    For a few years the easiest way to spot an AI image was to count the fingers or try to read the sign in the background. Both problems are now mostly fixed, and why they happened says a lot about how these models work.

