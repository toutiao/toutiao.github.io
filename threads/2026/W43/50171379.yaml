  author: vunderba
  text: <i>&gt; Whenever I try to run Image generation locally, be it with Flux or
    Qwen, I seem to be getting results that are about 1-2 years behind what ChatGPT
    can produce today.</i><p>At the risk of stating the obvious, you can&#x27;t really
    compare local models to proprietary frontier models. For all we know, those models
    are heavily subsidized and have trillions more parameters than the smaller, modest
    ones you can run on a single GPU.<p>I&#x27;ve been running a prompt-adherence
    benchmark site [1] all the way back since the days of SDXL. If you look at the
    progress dropdown, I do think the gap is closing.<p>June of this year saw the
    release of some of the biggest open-weight bangers (Krea 2, Ideogram 4, and the
    kind of slept-on Boogu-Image 0.1), though the license terms can be kind of meh.<p>The
    best locally hosted model scores 8 out of 15, while the proprietary ones score
    12 out of 15 on the text-to-image metric. If you want something that can reasonably
    decent for local gen while still being relatively small for modest GPUs, take
    a look at the recently released Moss-Image model [2]. But if you&#x27;re expecting
    results at a level of something like GPT-Image-2.5 Sunburst, you&#x27;re going
    to be disappointed.<p>[1] - <a href="https:&#x2F;&#x2F;genai-showdown.specr.net"
    rel="nofollow">https:&#x2F;&#x2F;genai-showdown.specr.net</a><p>[2] - <a href="https:&#x2F;&#x2F;huggingface.co&#x2F;Comfy-Org&#x2F;MOSS-Image"
