    - [What you get with ChatGPT](#what-you-get-with-chatgpt)
    - [What it costs](#what-it-costs)
      - [You pay for the canvas](#you-pay-for-the-canvas)
      - [Four ways you get billed](#four-ways-you-get-billed)
      - [The landscape in October 2026](#the-landscape-in-october-2026)
      - [Cost per usable image](#cost-per-usable-image)

