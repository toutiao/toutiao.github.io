  author: vunderba
  text: Nice article. There&#x27;s another option for pixel art that&#x27;s recently
    been coming into vogue as tool usage improves in LLMs which is procedural graphics.<p>I
    actually experimented with creating a set of skills around rendering early AGI
    style EGA graphical scenes, and it worked surprisingly well.<p>So rather than
    storing full bitmaps, you instead store sequences of simple drawing instructions
    designed to recreate some specific scene - like you would an SVG.<p>As a result
    you end up sidestepping a lot of the problems with larger generative models, which
    can have issues with grid alignment, palette choices, and high-frequency noise.<p><a
    href="https:&#x2F;&#x2F;github.com&#x2F;scpedicini&#x2F;agi-stylist" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;scpedicini&#x2F;agi-stylist</a><p><a
    href="https:&#x2F;&#x2F;kq-styles.specr.net" rel="nofollow">https:&#x2F;&#x2F;kq-styles.specr.net</a>
  score: 0
