  author: NitpickLawyer
  text: "&gt; So they admit that they could do more, but they won&#x27;t?<p>Yeah,
    there&#x27;s another paragraph:<p>&gt; Identifying and removing cyber-related
    data. During development, we observed vulnerability research performance improving
    steadily as post-training scaled. Tracing the source of this trend, we found that
    cyber-related content was embedded within the general mid-training corpus, and
    cyber-related tasks were present in the RL environment mix — a natural byproduct
    of training on broad data. In preliminary experiments on internal models, we found
    that without data removal at either the mid-training or the RL stage, downstream
    cyber capability would increase substantially. These findings gave us a concrete
    lever for control. <i>For the open-weight release of K3.1 Pro, we identified and
    removed cyber-related data from both training stages</i>, while retaining the
    general-purpose coding tasks needed for model usefulness. We will continue to
    apply appropriate controls at every training stage, of which cyber-related data
    identification and restriction is one example.<p>(emphasis mine)<p>It&#x27;s clear
    that cyber is a touchy subject right now. But it&#x27;s also clear that RL works
    on it, because it&#x27;s highly verifiable. So smaller models are going to become
    very interesting, because they can be fine-tuned later to cover this field."
