  author: david_chisnall
  text: |-
    I really don't like the conflation of a specific implementation of a container shim and containers.  Containers are not 'a thing' in the same way that processes are not 'a thing': they're an abstraction that is implemented in a few different ways in different places and is assembled from a variety of different components (e.g. some kernel state, MMU mappings, privilege modes, and so on).  The runc and crun container runtimes (formerly: shims, in older Docker terminology) implement containers as cgroups, namespaces, some seccomp-bpf, and so on.  But other Linux implementations use kvm (e.g. Kata Containers use KVM and Firecracker) to isolate things.  Apple's container tool isn't 'Docker', but it is an OCI implementation and implements the isolation with VMs as well, as do most cloud container systems.
    Similarly, images are not just folders.  Images are an abstraction built from layers.  The implementation is defined by the snapshotter (Docker originally used a unionfs abstraction, containerd and later things moved to a snapshotter abstraction because it's trivial to implement snapshots with a union / overlay FS, it's much harder to implement unions with a CoW filesystem).  If your implementation uses an overlay / union FS, each layer is a folder and the final image is also a folder that's a special kind of mount.  If it's ZFS (for example) each layer is a ZFS dataset that is a clone of the layer above.
