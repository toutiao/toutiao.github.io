  author: muvlon
  text: |-
    I suppose under the hood the kernel abstracted out a 'task' concept, but that's not exposed (AFAIK) anywhere to userspace?

    Yes it is exposed to userspace. The documentation is confusing though. What man 2 clone et al. call a "process" is actually a task. As far as those docs go, anything with a PID is a task. However, in common parlance, threads within a thread group are not considered processes (even though they have their own PIDs). And fun fact: The concept of threads arrived in Linux way later than tasks, in version 2.4.
    Essentially, a Linux thread is a task that shares a bunch of properties (virtual memory mappings, file descriptor table, namespaces, working directory, parent PID, signal handlers etc.) with its thread group (~="a process"). But using the clone syscall, which creates a new task, you can decide almost arbitrarily what it should or shouldn't share with the calling task, really blurring the boundary between process and thread. For example, you can pass CLONE_VM without passing CLONE_THREAD nor CLONE_FILES, giving you a task that shares its entire virtual memory with you but gets its own thread group and file descriptor table.
