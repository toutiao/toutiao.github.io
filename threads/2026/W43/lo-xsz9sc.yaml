    So if you run docker run -it --rm ubuntu /bin/bash, Docker is going to:

    Download the ubuntu image from Dockerhub.
    Put that image somewhere.
    Run /some/weird/docker/path/bin/bash


    Slightly more complicated: there's a transformation that needs to happen during the extraction phase between the OCI whiteout (deletion) markers (roughly AUFS-shaped) and whatever is materialized on disk. By default this is overlay, so AUFS-style whiteouts -> overlay whiteouts, but the disk storage could also be materialized into a snapshotting filesystem like ZFS in which case each layer becomes a snapshot and the runtime has to actually run deletions.
    I gave a talk on this back in 2020 and wrote a bit more about images in 2024.
