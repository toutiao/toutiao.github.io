  author: david_chisnall
  text: |-
    Except the kernel presents an API to userspace defined around the concept of a 'process'

    Well, kind of.  Linux has a system call called clone, which creates a new schedulable unit of concurrent execution.  This can share some the state with the parent, including the virtual memory mappings, the file descriptor table, the view of the filesystem, IPC namespaces, and so on.
    If you call clone and ask to have the virtual-memory mappings and file descriptor table shared, you get a thing that can be used to implement the thing that POSIX calls a thread.  If you call it with a new virtual-memory mapping and file-descriptor table, then you have a thing that looks like what POSIX calls a process.
    This is quite similar to how Linux defines containers.  The clone system call creates a new child that has different namespaces / cgroups.  The extra fun thing is that, because the notions of container, thread, and process are entirely ad-hoc in Linux, you can have one process that has multiple threads that are in different containers and each of those containers can hold multiple processes (please do not do this).
