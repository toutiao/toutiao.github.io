  text: |-
    I saw OpenVZ as an attempt to bring FreeBSD Jails to Linux. Jails were originally created as a ‘better chroot’, but the comparison to VMs didn’t really apply because VMs weren’t much of a thing. Jails first shipped in 2000 (OpenVZ in 2005). Xen first appeared in 2003.
    Prior to 2003, VMWare existed but it did dynamic binary translation. It had to scan the instruction stream for specific instructions and patch them, which meant it wasn’t great for server-side things.
    With Xen, VM hosting started to take off. In 2005, Intel shipped virtualisation extensions, but they took a couple of years to be widely deployed.
    But early Xen was not that efficient. It had around a 5-10% perf hit and it required a load of disk and memory duplication that wouldn’t happen with a shared-kernel system. Jails and similar techniques were faster and lower-cost to provide. They allowed much more dynamic resource provisioning.
    The big shift since then has been identifying and addressing sources of VM overhead. Sharing the kernel isn’t actually as a big a win as you might guess. It introduces contention in kernel data structures (FreeBSD now lets each jail have its own copy of the network stack to address this in some places).
    But sharing the buffer cache is a big win. Imagine you have ten VMs or ten jails, all running the same userland. With jails on ZFS and dedup or clones from the same origin, you’ll have one copy of libc on disk. This will result in one copy in the buffer cache. Each process in each jail will mmap it and there will be one copy in RAM and one copy in cache.
    In contrast, in traditional VMs, each VM will have its own block device with its own copy of libc. Each VM will have its own copy in the buffer cache. Each process will then have the VM-private version in the CPU cache. VirtIO-FS addresses this. The host can provide each VM with a read-only filesystem and expose pages from its buffer cache directly. This lets container-like workloads run with similar memory overhead between jail-like and VM isolation.
    Similarly, modern SmartNICs allow direct pass through so Ethernet frames destined for a VM go straight to the VM, rather than being bounced via a privileged VM and exposed as paravirtualised interfaces. The big cloud providers implement something that looks like a block device interface in their SmartNICs and do the same direct assignment (the backing store is blob storage). For smaller deployments, NVMe emulation is very fast, so most of the overheads of VMs have gone away.
