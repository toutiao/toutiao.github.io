    Tbh, Docker is weird because the solution it solves for just is weird and the entire thing got yarnballed with a bunch of (largely unnecessary, overcomplicated) enterprise tech.
    A lot of it's bad/messy decisions stem from the fact that the software Docker is an answer for isn't the "just get a virtualenv/local dependency folder for the project dependencies, plug it into your postgres instance with an account and wire up nginx" projects. Those projects never needed (and arguably shouldn't use, at least in a selfhosted context) Docker.
    Docker is made for That Application. You know the one. The one whose installation guide begins with a "we recommend you buy a completely separate server for our tools", as if your budget isn't a concern to them. It's for the Ruby hellscape that has hardcoded environment details littered throughout the codebase and requires hand fixing whenever you set up a deployment that doesn't exactly match it's original upstream. It's made for software that can't untangle it's own connection to Unix user accounts, even as they increasingly become a worse and worse way to protect data. Docker is for the software where deploying it fills you with a sense of dread because it requires like 10 adjacent daemons and services to be booted up alongside it to work and while you can trust it's secure-ish because your VPS provider firewall blocks everything, that's 10 more daemons to think about.
    Docker takes all that and simplifies it: you get a dockerfile (and usually a compose file for multiple services), an environment file you configure and then a port/series of ports you can tell nginx to reverse proxy towards. That's also why Podman falls short of it so often; everything you gain in terms of better security (containers aren't root by default) and tighter integration (read: systemd services instead of the opaque docker daemon), you lose in terms of bringing back that complexity that docker simplifies away. I don't need to think about the fact that it's a 20 microservice architecture with incredibly powerful failover; docker handles everything to configure and set it up.
    The problem is then also that docker itself has been riddled with abstractions that only really make sense if you're looking at "docker" as not a daemon running on a VPS you own, but as a sort of generic container orchestrator that runs on a hyperscaler. That's where a lot of it's stranger decisions come in, and something that the documentation habitually points you to using. Volumes are probably the biggest sin: your average selfhosting/learning to use docker will not want to use volumes. They're a concept that completely abstracts away the concept of "where do my files go" into the docker daemons internal structure (with it being rather easy to accidentally destroy the contents of a volume when freeing up space). For a selfhoster, "where do my files go" is a question whose answer needs to be "right here, go run Borg/restic on it every once in a while"; they basically are the target audience for bind mounts... which the documentation discourages you from using because "what if it goes cross filesystem", a concern that only matters when your server stack is actually that complicated.
    Another reason it's weird is because these sorts of "we own the server" tools are becoming increasingly rare (since while they're what docker works with, they're also something that docker gradually discourages by preferring leaner images and expressing all configuration into environment variables). The only notable examples I can think of in recent memory are Discourse and Sourcehut, both of which pretty much expect that you dedicate a full server's worth of resources to them. In the case of Discourse, because it's a Ruby dinosaur mess of a forum software that I'd argue is also really bad at its job, since it's lead developer can't envision anyone with a tech stack smaller than a silicon valley startup wanting to run a forum (and I despise that so many FOSS communities opt to use it). In the case of Sourcehut, it's because from what I can tell, Drew just hosts it on raw alpine and his deployment mechanism is literally just using alpine's package manager, which meshes with docker in a pretty awkward way.
