    I think it's possible that Docker's early success prevented these features from evolving in a better direction.
    For some of the issues mentioned here (“Docker requires root”—not only that, but Docker typically access implies root permissions!) Podman has managed to significantly improve upon Docker. (Of course, there is rootless Docker, and it still seems that unprivileged user namespace are considered to have a high surface area for security issues.)
    Hopefully, Podman can help untangle some of the consequences of these design choices, like how containers that rely on volume mounted external data require some Entrypoint contortions to avoid permission issues (for example) to work properly. Since some of Docker's surrounding mechanisms are YAML-configuration-based (e.g., compose,) some of these flaws end up creating extra work such that replacing a Dockerfile with a Containerfile that assumes non-root ends up dramatically simplifying the entire setup.
    In fact, a lot of Docker design choices seem to play out like this: there's some design flaw or limitation, which then requires stacking more and more and more technology on top. In fact, I'm not even particularly impressed with the whole build definition system, which seems to work delightfully for small demos but then generate an enormous amount of (often Docker-specific) complexity when we want to do something moderately complex. (Look through the above example for Jellyfin and see how this tends to evolve…) Since an image is just a filesystem and some metadata, I've considered ditching the Containerfile/Dockerfile-style  build system entirely and constructing these with simple scripts.
    It may be unfair to blame Docker for all of this complexity. Unfortunately, when it comes to just namespaces, I think some of the fault lies in the Linux kernel's implementation. Namespaces are frequently presented as though they are composable, but, in practice, this just doesn't work. (Peeking at code paths like for namespace dispatching in the Kernel, and how they actually check for things like UTS namespaces, I can hazard a guess at the very reasonable thinking that led to this design…)
    There are a lot of very interesting things we could do if namespaces composed perfectly—we could use them in leaf-level entities to improve their isolation (for both correctness and security.) Unfortunately, though, if you have a shell script that uses bwrap that calls another shell script that uses unshare or pasta or  that calls another executable within podman… things break. (In fact, the last time I tried it, you can't even compose a single bwrap with a single podman!) Instead, it seems like we are better off superficialising our use of namespaces (i.e., in the case of composed processes, emitting namespace modalities on a side channel and constructing a single top-level namespace.)
