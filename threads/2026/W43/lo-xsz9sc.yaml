  text: Yup, memory ballooning still doesn’t work perfectly. It’s typically implemented
    as a driver that allocates a load of memory that it hands to the hypervisor, and
    then grabs it back and frees it when memory is tight. Unfortunately, the back
    pressure in Linux doesn’t work well, so you can often have a process spike in
    RAM requirements, then the balloon driver starts to run, then the process is killed
    due to memory exhaustion. Running it again works, but it!s weird.
