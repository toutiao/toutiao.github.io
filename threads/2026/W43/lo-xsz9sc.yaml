    The way that the 8 or so different types of namespaces interact with each other is quite restricted in some senses, to the point where there's not that many things you can build with them that aren't a container runtime.

    They're used much more heavily in plan 9. For example, $PATH is replaced with a few namespace operations on union all your binaries into /bin.
    Proxies and VPNs work by putting a new network (/net filesystem) into a program's namespace.
    And I've also done fun tricks with different shared memory threads running in different file namespaces to do tab completion tricks.
    (Of course, these are all file namespaces. Everything is a file, except process attributes like shared memory)
