  text: "<i>&gt; You seem to be implying that no reformers have skin in the game though.</i><p>I&#x27;m
    only describing that case (for both reformers and conservatives), yes. Historically,
    that seems to be the most relevant case, at least if we want to talk in terms
    of size of human impact.<p>To put it another way: if the problem (if there is
    one--see further comments below) can be solved by the people who do have skin
    in the game working things out among themselves, the labels &quot;reformer&quot;
    and &quot;conservative&quot; don&#x27;t even come into play. You just have people
    who have to find some way of working together, doing it. So the only cases where
    those labels even arise are the cases where the people who do have skin in the
    game can&#x27;t work things out among themselves--or at least that the people
    looking in from the outside, who don&#x27;t have skin in the game themselves,
    think so.<p>The term &quot;reformer&quot;, historically, does have another meaning:
    people who have some grand idea for how society <i>should</i> be organized, observing
    that it currently is <i>not</i> organized that way, and treating that as a Problem
    even if others don&#x27;t agree that it is. A &quot;conservative&quot; seeing
    that would just say, look, you can&#x27;t just impose your own idea of how society
    should be on everyone else. But historically, &quot;reformers&quot; in such cases
    have always framed things in terms of there being a Problem that isn&#x27;t just
    &quot;society isn&#x27;t the way I think it should be&quot;--the workers are oppressed,
    or the rich are getting richer while the poor are getting poorer, or whatever,
    and using that as an excuse to implement their ideas for the ideal society. Which
    has never worked out well."
