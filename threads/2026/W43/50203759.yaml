  author: pdonis
  text: I haven&#x27;t hand-waved anything away. I said there are cases where the
    people who do have skin in the game can&#x27;t work things out among themselves.
    What you&#x27;re describing is one case of that--those people can&#x27;t even
    come to agreement about whether something needs to be done or not.<p>I did qualify
    my statement with the caveat that whether people looking in from the outside,
    who don&#x27;t have skin in the game, think there&#x27;s a problem that the people
    who do have skin in the game can&#x27;t resolve among themselves, doesn&#x27;t
    always match whether there actually <i>is</i> such a problem (a caveat which I
    could argue that you have hand-waved away). But I am not saying that all cases
    are like that.<p>What I <i>am</i> saying is that, even in the cases that aren&#x27;t
    like that, the cases where the people who do have skin in the game really can&#x27;t
    resolve a problem by working among themselves, that does <i>not</i> mean that
    reformers coming in from outside can do any better. I think such outside interventions,
    through human history, have a very poor track record of working. A quick summary
    of my point about conservatives and reformers would then be that conservatives
    recognize this unpleasant truth of human history, whereas reformers don&#x27;t
    acknowledge it and are way, way too eager to make such interventions, and end
    up making things even worse.
