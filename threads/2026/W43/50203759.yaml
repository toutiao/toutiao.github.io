    will feed <i>you</i>.<p>Nowadays our children endure “active shooter” drills and
    sometimes die at the hands of active shooters. Parents are charged with neglect
    for letting  children go to the store unaccompanied. Stand-your-ground laws defend
    shooting someone through a locked door, or in a parking lot. Vote canvassers have
    been shot at for turning onto the wrong driveway. Salt of the earth, those townsfolk.<p>The
    price of housing continues to rise mainly because those already there prevent
    building for those who would come. San Francisco is 1&#x2F;2 the density of New
    York. It’s expensive because Palo Alto looks like Levittown and not, say, Queens.  That
    was decided by those same sweet townsfolk.<p>Maybe Heinlein’s essay was inspirational
    in the McCarthy Era. In the present day, when Republicans root for deporting citizens
    elected to congress, it’s a transparent fantasy.  Take every sentence as false,
    and it’s a useful guide to the world that we sadly actually live in.'
