article:
  url: https://www.awakin.org/v2/read/view.php?tid=468
  title: This I Believe, by Robert A. Heinlein
  fetch_status: success
  content: "[![Image of the Week](https://www.awakin.org/pics/rand/smile-balls.jpg)](#)\n\nI
    am not going to talk about religious beliefs but about matters so obvious that
    it has gone out of style to mention them. I believe in my neighbors. I know their
    faults, and I know that their virtues far outweigh their faults.\n\nTake Father
    Michael down our road a piece. I'm not of his creed, but I know that goodness
    and charity and loving kindness shine in his daily actions. I believe in Father
    Mike. If I'm in trouble, I'll go to him.\n\nMy next-door neighbor is a veterinary
    doctor. Doc will get out of bed after a hard day to help a stray cat. No fee --
    no prospect of a fee -- I believe in Doc.\n\nI believe in my townspeople. You
    can knock on any door in our town saying, \"I'm hungry,\" and you will be fed.
    Our town is no exception. I've found the same ready charity everywhere. But for
    the one who says, \"To heck with you -- I got mine,\" there are a hundred, a thousand
    who will say, \"Sure, pal, sit down.\"\n\nI know that despite all warnings against
    hitchhikers I can step up to the highway, thumb for a ride and in a few minutes
    a car or a truck will stop and someone will say, \"Climb in Mac -- how far you
    going?\"\n\nI believe in my fellow citizens. Our headlines are splashed with crime
    yet for every criminal there are 10,000 honest, decent, kindly men. If it were
    not so, no child would live to grow up. Business could not go on from day to day.
    Decency is not news. It is buried in the obituaries, but is a force stronger than
    crime. I believe in the patient gallantry of nurses and the tedious sacrifices
    of teachers. I believe in the unseen and unending fight against desperate odds
    that goes on quietly in almost every home in the land.\n\nI believe in the honest
    craft of workmen. Take a look around you. There never were enough bosses to check
    up on all that work. From Independence Hall to the Grand Coulee Dam, these things
    were built level and square by craftsmen who were honest in their bones.\n\nI
    believe that almost all politicians are honest ... there are hundreds of politicians,
    low paid or not paid at all, doing their level best without thanks or glory to
    make our system work. If this were not true we would never have gotten past the
    13 colonies.\n\nAnd finally, I believe in my whole race. Yellow, white, black,
    red, brown. In the honesty, courage, intelligence, durability, and goodness of
    the overwhelming majority of my brothers and sisters everywhere on this planet.
    I am proud to be a human being. I believe that we have come this far by the skin
    of our teeth. That we always make it just by the skin of our teeth, but that we
    will always make it. Survive. Endure. I believe that this hairless embryo with
    the aching, oversize brain case and the opposable thumb, this animal barely up
    from the apes will endure. Will endure longer than his home planet -- will spread
    out to the stars and beyond, carrying with him his honesty and his insatiable
    curiosity, his unlimited courage and his noble essential decency.\n\nThis I believe.\n\n--Robert
    A. Heinlein\n\n Moved by this reading? [Join a live Awakin Circle](https://www.awakin.org/v2/local/city/santaclara)
    to discuss in community. \n[Join this week](https://www.awakin.org/v2/local/city/santaclara)\n\nMore
    ways to connect\n\n[ \n\n \n\nJoin a Metta Circle\n\nPractice loving-kindness
    meditation together\n\n ](https://pod.servicespace.org/metta)[ \n\n \n\nExplore
    peer-learning pods\n\nSmall groups diving deeper into shared themes\n\n ](https://pod.servicespace.org/welcome)[
    \n\n \n\nStart your own local circle\n\nOne living room, one intention — we'll
    help\n\n ](https://www.awakin.org/v2/local/?op=start)\n\n## Add Your Reflection\n\n10
    Past Reflections\n\nWM\n\n Wilfred Macaulay\n\nOct 23, 2026\n\n This takes me
    aback to my childhood days, these words ring true. \n\nRT\n\nRonice Tanner\n\nMay
    7, 2023\n\n This reminds me of the values I was bought up with. The selfless kindness
    and care I have found from time to time in my life and I am grateful to have experienced
    such things. Thank you. \n\nED\n\nEdward\n\nMay 28, 2016\n\nThank you for posting
    this, but...  \n  \n This first aired in 1952, and Heinlein died in 1988.&nbsp;
    Please, please&nbsp;correct the&nbsp;date.&nbsp; That sort of accuracy... would
    have been important to Robert.\n\nLM\n\nLinda Macdonald\n\nJul 18, 2006\n\n it
    is healthy to have a positive uplifting attitude and believe in the goodness of
    people, BUT, we also must be discerning when it comes to others, God does not
    want us to have BLIND faith, and always seek the light. \n\nBR\n\n[brinda](https://www.awakin.org/read/view.php?op=auth&mid=govbria)\n\nJun
    8, 2006\n\n Every act of kindness we receive inspires us to do more.....  \n each
    and every day look for the opportunity!  \n It may seem like a small thing, but
    I am eternally grateful to a kind man who stayed with me and my young son after
    I had an accident (in which I landed flat on my face and lost a tooth)...I don't
    have a cell phone and he gave me his phone to call my husband to come and get
    us, and he waited with us til he came.  \n I was so \"out of it\" that I couldn't
    think to take down his name or address, but I will never forget his kindness and
    hope I can do the same for someone someday.  \n This I believe---actions speak
    louder than beliefs! Please check out the 50 facts to change the world  \n Thank
    you for giving us the space to share on Wednesdays.  \n With gratitude,  \n Brinda
    \n\nNI\n\n[Nipun](https://www.awakin.org/read/view.php?op=auth&mid=nipun)\n\nJun
    8, 2006\n\n Discussion notes from Wednesday ... What do I believe? Accumulation
    of wealth is accumulation of sin. Inconvenient Truth This author hasn't lived
    in my neighbhorhood; it's hard to trust! The problem of our times is values. A
    felon is disallowed to vote for the rest of your life; assumes that once you make
    a mistake, you're not a good person. What I am is more important than what I believe
    in. I stayed with my friend for two days; another friend stayed in the same place
    and saw God. It's all about perspective. You have earn your beliefs; you can't
    just believe. By being who you are, you allow others a chance to be who they are.
