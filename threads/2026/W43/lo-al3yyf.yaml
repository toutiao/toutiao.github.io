  text: |-
    Rust would have prevented all of these issues in the PHP

    Be careful not to overstate your case! The PHP issue was a combination of three things:

    lack of panic-safety in code that called allocators which unwind to the top level instead of aborting the process
    re-use of the main data structure across multiple requests without reliably reinitializing it
    the combination of 1 and 2 leading to use-after-free bugs and attacker control over callback function pointers

    Rust protects you against 3. It avoids 2 because that style isn’t idiomatic, not because the language prevents it. And per-request panic recovery like 1 is common in Rust server frameworks.
    Whether 1 and 2 can lead to interesting state corruption (even when memory safety is guaranteed) depends a lot on how badly the invariants are broken when the panic happens, and how buggy the state reset is. Neither of them are likely to give an attacker much of a hole to exploit, which is also why actual PHP RCE is difficult.
