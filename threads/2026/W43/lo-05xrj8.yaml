  text: |-
    They behave a lot like vtables, except that they are evaluated at comptime rather than runtime.

    That is the standard type class desugaring. The remaining difference is indeed binding time (comptime vs runtime) in the partial evaluation sense, which has a bearing on admissible and practical compilation strategies, especially for systems languages. You can see a first-class approach to type class dictionaries as structures in Lean;  here is an explained example.
    Most functional language implementations use a uniform value representation as a baseline to support parametric polymorphism, and bounded polymorphism via type classes then builds on that. But especially for a systems language you don't want to be forced into a uniform value representation and you want to perform monomorphization at least some of the time. Languages like Haskell don't have Rust's dyn-safe distinction, and runtime dictionary passing can easily support higher-rank polymorphism, polymorphic recursion and other things that are not compatible with Rust's compilation strategy; Rust does support rank-2 polymorphism but only for lifetimes, e.g. std::thread::scope, and that's because the representation of references is the same (as pointers) regardless of lifetime.
    Swift is to my knowledge unique among systems languages in its specific set of choices in this area. It uses runtime dictionary passing as its strategy (motivated by its commitment to ABI resilience) and treats monomorphization as a compiler optimization (specialization on a comptime-known dictionary argument). But unlike the standard functional language approach to runtime dictionary passing, it does not rely on a uniform value representation, which complicates things greatly but seems to me a necessary choice for a systems language if you're going to use runtime dictionary passing. This part about Swift's strategy is from my years-old reconstructed memories of watching a tech talk by Slava Pestov and John McCall, so it's likely I got some of the details wrong.
    As an aside, I have to imagine the fact that Rust and Swift have their own names for type classes (traits, protocols) makes it harder for people without a functional programming background to make the connection to prior art when searching the Internet. That's a bit of a shame.
