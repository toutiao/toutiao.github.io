  author: squeek502
  text: |-
    There's no real ambiguity

    There's no ambiguity in the rules, but there is ambiguity about whether or not the actual precedence rules match with what the programmer writing the code intended, since they could have misremembered the rules.
    The approach here tries to find a happy medium: precedence rules for common operator combinations that you might expect from a C-like language, with fewer rules to remember, and with the less common operator combinations always being fully unambiguous about the programmer's intent.
