  author: pessimizer
  text: The slop-in, slop-out theory. I&#x27;m very much an advocate.<p>The neat thing
    about LLMs is that in a way they proved that only the truth turns out to be grammatical
    (statistically), largely because there are so many more ways to be wrong than
    right that the mode is almost always right.<p>But people also lie and bullshit
    in consistent ways, with the intention of fooling people with well-known empty
    arguments. Part of being a &quot;good writer&quot; is to make the meaningless
    sound meaningful - and the techniques are ancient.<p>Train on a bunch of people
    trying to push their framework and get rich, whether in online garbage, literary
    garbage, or in ostensibly serious nonfiction or scientific works, and you&#x27;ll
    end up with modal language that is trying to play deceptive games with reasoning,
    but has nothing in particular it&#x27;s trying to convince you of (no motives.)<p>People
    would either fall for that language (if they weren&#x27;t thinking much and the
    context was one that comforted them), or they would methodically try to put that
    language into a model (let&#x27;s say a series of syllogisms for an argument about
    what to do or what to believe, but it could be any model), and see that it failed.
    And speaking again of the context, the context of humans interacting with human
    content implies motives that help the listener focus on particular parts of their
    model to look for rhetorical tricks. The LLM, again having no motive, just does
    this in random places.<p>The latest advances in AI have been in the tooling around
    AI, which I think largely reduces to recursively creating models and populating
    them in outputs short enough that hopefully the text generation won&#x27;t go
    off the rails.<p>Symbolic AI is coming back, it&#x27;s just that the mortar is
    random word association.<p>Call me crazy, but I think Georges Bataille saw all
    of this. In my interpretation, he simultaneously thought of random associations
    as the most important component of reason and also completely irrelevant in the
    reality of the world. The only way you could discover the structure of things
    is through random collisions; your view of the universe was entirely constructed
    by your prejudices, lusts, and fears; but whether that view was wrong or right
    was based on how it <i>worked</i> and the particular content of the id-garbage
    that got you there was ultimately irrelevant. The fabric of the world is completely
    id-less, but can only be digested by id-driven beings. LLMs (without the tooling
    around them) are all id.
