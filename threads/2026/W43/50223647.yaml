  text: I’ve no idea what you refer to with &quot;laziness&quot;. The &quot;rule&quot;
    that you claim you were taught simply does not always apply.<p>A smart writing
    assistant will give advice that’s appropriate to the context, register, the recipient’s
    culture, communication style and tastes, and the author’s relationship with the
    recipient. Sometimes writing very normatively and by the book is part of the message.
    Sometimes the exact opposite is true. If the assistant is unaware of all the context
    relevant to the communication, it’s likely to be a bad assistant.<p>Dropping articles
