  author: antonvs
  text: "&gt; I find the most passionate advocates of LLMs right now ...<p>Whether
    or not that&#x27;s true, you have to keep in mind that it&#x27;s not true of everyone.<p>I&#x27;m
    a passionate advocate of LLMs. I implemented my first neural net, for image recognition,
    in the late 1980s (based on Bart Kosko&#x27;s work, I&#x27;m not claiming to have
    invented anything.) Now, I use LLMs daily for coding and other tasks. I don&#x27;t
    usually &quot;vibe code&quot; unless it&#x27;s a simple enough project that the
    code quality really doesn&#x27;t matter - a simple example would be data integration,
    where as long as the data in the target system matches the data in the source
    system, I don&#x27;t care much about how the sausage in between is made.<p>But
    otherwise, I&#x27;m approving or denying every tool call, like a caveman, and
    when they mess up, I explain to them why. I interrupt them and redirect them when
    they need it. I change code myself and let them know. With all that, they&#x27;re
    still incredibly useful - more useful than most &quot;junior programmers&quot;,
    realistically. No human software developer can hope to match LLMs on many significant
    dimensions of development. But that doesn&#x27;t mean experienced and competent
    humans have no role, at least currently.<p>The disconnect here is that your characterization
    of &quot;the low quality of their output&quot; is too simplistic. The quality
    of their <i>natural language writing</i> is <i>different</i>, for the kinds of
    reasons stated in the OP. Some of the accusations of &quot;lower quality&quot;
    really boil down to &quot;too compressed for humans to easily understand&quot;,
    again as the OP points out. And the quality of their <i>code</i> has a lot to
    do with how they&#x27;re prompted.<p>One of the biggest barriers to good LLM output
    - both writing and code generation - is that they&#x27;re trained on data generated
    by humans who fit George Carlin&#x27;s observation that half of them are stupider
    than average. When it comes to coding, on average they don&#x27;t have enough
    education not to think that imperative code with minimally-restricted mutation
    all over the place is a good idea. They think dynamic typing, so that code can&#x27;t
    be statically verified, is a good idea. They reflect our own collective limitations.
    If you recognize that and redirect them to sources of good practices, they can
    be much better.<p>In short, they&#x27;re much more of a mirror than most people
    realize or admit.<p>With all this noise, it should not be forgotten that we appear
    to have figured out roughly how a significant component of intelligence works,
    and have real life, useful proofs of concept. All the <i>technical</i> criticism,
    to me, is just coming from people who don&#x27;t seem to understand how intellectual
    advancement works. The <i>political</i> criticism is another matter."
