  text: I think that is an interesting observation. You&#x27;re comparing the &quot;why&quot;
    we have a language vs. the &quot;how&quot; the language is structured, and for
    sure the former is more important than the latter.<p>A side effect of studying
    programming languages in my youth was that I began understanding grammar better.
    Suddenly words belonged to &quot;classes&quot; and when thinking about &quot;object
    references&quot; in sentences, and the rules that followed, it helped me read
    and write more clearly.<p>I think I might be slightly opposite of you, but not
    very far opposite. I prefer reading a precise and accurate sentence that - when
    understood - clearly describes the intent without a shred of doubt much more than
    an easy to understand sentence that I find ambiguous because, to understand it,
    it requires context and a social agreement that nobody is trying to trick people.<p>I
    had a friend once that kept using open-ended phrasings and ambiguous descriptions
    because (I think) he enjoyed the feeling of power or control that the confusion
    and miscommunication introduced. Like if he were to &quot;run to the stores&quot;
    you could ask what he was buying and he&#x27;d follow up with a &quot;oh, I didn&#x27;t
    say I was <i>buying</i> anything, I&#x27;m just going for a run&quot;. If I have
    to guess which of the variations of meanings is the intended one, then the communication
    has failed in my book, regardless of how easy it was to understand the sentence.
