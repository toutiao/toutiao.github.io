  author: Tanoc
  text: Pacing is extremely important in writing. The way one speaks out loud is often
    not the way that they actually read in their head. Speaking out loud has three
    parts to it in conception, translation, and vocation. Conception as to what the
    thought is, translation of that thought to language, and vocation of the language
    through visuals or sound. Reading only shares the translation portion, but also
    has organization added to it where you need to organize the information as you
    ingest it. As such, it&#x27;s important to format whatever you&#x27;re writing
    so that it can be organized first and translated second. People look at the words
    linearly but don&#x27;t ingest the information linearly. This is a principle many
    literary jokes are built upon.<p>ChatGPT, Gemini, and whatever else do not in
    fact have the capability to understand that interaction between organization and
    translation. They process the information linearly, organize it linearly, and
    translate it linearly. That&#x27;s what makes it so strange to read. A must lead
    to B which must lead to C. A cannot connect to C and then circle back to B which
    is connected to both A and C obliquely. It&#x27;s a failure in understanding language
    and how it is used.
