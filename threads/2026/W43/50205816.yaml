  author: chuckadams
  text: 'It was certainly assisted by AI, but there isn&#x27;t an agent out there
    that does that kind of cheating without deliberate prompting by the operator.<p>I&#x27;ve
    taken a vibe-coded project pretty far, with even better testing than most other
    things: the main factor is that it&#x27;s big on falsifiability, i.e. it has to
    see a test for a new feature actually fail before it considers the test any good.  Not
    just the red&#x2F;green from being originally unimplemented, it does a mutation
    test to ensure it flips back to red.  But wow did it ever make that test framework
    complicated, byzantine, and ultimately brittle until I stepped in and forced a
    consolidation and simplification pass (twice now). Part of the complexity came
    from it being a polyglot monorepo, but I&#x27;ve found even in other places, you
    have to follow an expand-contract cycle of development when vibe-coding.  Not
    all that different from any other system you&#x27;ve built up organically, just
    on a much faster cycle.<p>But back to my original point, none of this really applies
    to the pgrust benchmark, which was obvious and blatant cheating on the human&#x27;s
    part.'
