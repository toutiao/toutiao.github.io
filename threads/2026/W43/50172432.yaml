article:
  url: https://rootkitlabs.com/2026/10/06/i-built-a-stereo-vision-board-for-hardware-hackers/
  title: I Built a Stereo Vision Board for Hardware Hackers - Rootkit Labs Blog
  fetch_status: success
  content: "_This article was written entirely by a human, for humans._\n\n* * *\n\nI
    tend to get excited about certain chips. This time, it was a microprocessor: The
    Rockchip RV1103 is a single-core 1.1 GHz ARM Cortex-A7 SoC (system on chip) with
    64 MB of DDR2 RAM and a MIPI CSI-2 bus shoved into a QFN-88 package. With this
    chip, I built a cheap, simple stereo vision board with built-in compute and Linux
    support.\n\n![Design Files](/img/4reel/4reel-front.jpg)\n_Design Files_\n\nI en
    **vision** integrating this board into robotics projects, like an Arduino needing
    obstacle avoidance or navigation. Once powered up, the board transmits data over
    serial. Or you can use it on its own, with everything you’d expect from a Linux
    board.\n\nThe video below shows image capture and depth processing on the hardware:\n\nThis
    blog post outlines the hardware, firmware, and software details!\n\n# System Overview\n\n![](/img/4reel/4reel-system-overview.svg)\n\n#
    The PCB\n\nA cheap four-layer board worked for this project.\n\n![Top Layer: Controlled-impedance
    traces: USB, MIPI, and Ethernet. With some Signal/Power.](/img/4reel/4reel_ee-B_Cu.svg)\n_Top
    Layer: Controlled-impedance traces: USB, MIPI, and Ethernet. With some Signal/Power._\n\n![Inner
    L1: Solid ground.](/img/4reel/4reel_ee-In2_Cu.svg)\n_Inner L1: Solid ground._\n\n![Inner
    L2: Signal/Power](/img/4reel/4reel_ee-In1_Cu.svg)\n_Inner L2: Signal/Power_\n\n![Bottom
    Layer: Signal/Power](/img/4reel/4reel_ee-F_Cu.svg)\n_Bottom Layer: Signal/Power_\n\nI
    got the board mostly correct on the first shot, but there were a few issues:\n\n-
    I requested the wrong SoC. That was a fun replacement.\n- The holes for the lens
    mounts were drilled at 1.8 mm instead of 2.2 mm.\n- 1k resistors were too small
    to make the LEDs light up nicely.\n- The 0.9 V trace was too thin, although it
    seemed to work fine.\n\n# The Kernel, Bootloader, and OS\n\nI needed a bootable
    OS, with drivers, a bootloader and a kernel. For this I used my favorite Linux
    build system: _Buildroot_. Buildroot combines these elements into `sdcard.img`,
    which you flash to an SD card, pop into the board, and boot.\n\nSadly, not everything
    needed for this project is available upstream. The Rockchip MIPI drivers, hardware
    accelerators, and some other key components all came from the vendor BSP. Buildroot
    has support for out-of-tree kernels.\n\nFor this chip, there are a few different
    boot stages. Most ARM MPUs look _something_ like this:\n\n1. (Bootloader) **BootROM**
    : Gets TPL and runs it. This is in ROM and uses SRAM (smaller, non-main RAM).\n2.
    (Bootloader) **TPL** (“Tertiary Program Loader”): Sets up the DRAM controller.
    This is a binary from Rockchip.\n3. (Bootloader) **SPL** (“Secondary Program Loader”):
    Loads U-Boot, bundled with the U-Boot project.\n4. (Bootloader) **U-Boot** : This
    is our main bootloader; it loads the kernel. It has other fancy features.\n5.
    (Kernel): **Linux**\n6. (OS) **Init System** : Starts services.\n\nAfter some
    [simple config](https://github.com/o7-machinehum/4reel/blob/master/os/configs/rv1103g_defconfig)
    in Buildroot, I had access to a shell over serial. I eventually moved to SSH,
    with the USB-C port as an Ethernet adapter.\n\n# The Software Stack\n\n![The SW
    architecture](/img/4reel/4reel-software-overview.svg)\n\nThe software MVP needed
    to communicate with the kernel to get image data, control the camera, and use
    the hardware accelerators. Luckily, everything in the kernel space marked above
    was assembled for us with Buildroot. We just needed to make the blue part, but
    I’ll explain the rest briefly.\n\n## Kernel Space\n\nYou may notice drivers get
    more abstract at the top of the diagram, while lower down they’re hardware specific.
    This means a user application can talk to a node created by V4L2 and doesn’t need
    to care about specific camera commands.\n\nThere are SoC-specific drivers for
    the SoC peripherals (like I2C, CSI, etc.). This is so the camera driver (OV9281
    in our case) doesn’t need to know which SoC it’s running on.\n\nThis is all pretty
    standard Linux device driver stuff, so I won’t go into any more details beyond
    this.\n\n## User Space\n\nThe data eventually flows up to Video4Linux2, which
    exposes our cameras in various nodes `/dev/videoX`. Each camera shows 11 video
    nodes:\n\n- video0: Normal video capture\n- video1-3: Other stream IDs\n- video4-7:
    Scalers\n- video8-10: Auxiliary tools\n\nCamera control is exposed through `/dev/v4l-subdevX`.
    We can use these nodes to set exposure and control various camera features.\n\nThe
    “Rockchip Video Engine” is exposed through `/dev/rve`. We use the proprietary
    `librve.a` to talk with the engine and schedule various hardware video acceleration
    tasks. I’ll get more into this later.\n\nThe userspace app&mldr;\n\n1. Configures
    the cameras from `/dev/v4l-subdevX`\n2. Takes the image data from `/dev/videoX`\n3.
    Feeds it into the `/dev/rve` node\n\nThe Rockchip Video Engine contains a SAD
    engine (sum of absolute differences). This is a hardware accelerator block that
    runs on the Rockchip SoC itself.\n\nSAD is the core of how we do stereoscopic
    vision. A grayscale image can be represented as a matrix, with each element being
    a number from 0 to 255. Let’s say we have 2x images that are 2 × 2 px each. We
    can calculate the SAD:\n\n    Image 1 Image 2 Absolute differences\n    [10 20]
    [10 20] [0 0]\n    [30 40] [30 40] [0 0]\n    \n    SAD = 0 + 0 + 0 + 0 = 0\n\nWe
    can say the two images are the same.\n\nNow instead of comparing these tiny images,
    we have two big images and break them up into a bunch of smaller images, called
    patches, and do this everywhere.\n\n![With apple](/img/4reel/4reel-sad-with-apple-patches.svg)
    ![Without apple](/img/4reel/4reel-sad-without-apple-patches.svg)\n\n_Normalized
    SAD per patch (0 = identical)._\n\nWe now have an algorithm to determine how similar
    patches of the image are, so with this information we can certainly say that this
    section of this image is different.\n\nSAD-based stereo block matching uses the
    same principle, but compares a vertical column of patches after a horizontal shift.
    Our two images come from two separate cameras, separated horizontally by a distance
    we call the baseline. We keep one image fixed, shift the other, and try to find
    matching blocks; when the blocks match, this is a depth value. If they match at
    a very early shift, this is a far-away value, while a later shift is a closer
    image.\n\n![Two stereo cameras](/img/4reel/4reel-stereo-disparity.svg)\n\n![Stereo
    images: Middlebury Cones.](/img/4reel/4reel-stereo-matching.gif)\n_Stereo images:
    Middlebury Cones._\n\nYou can see that images farther away require less shifting
    to get a match, and once you get a match, the shifting required is your depth!
    The boxes show your patch size, and the green box is showing a SAD match. This
    is illustrated in this GIF above with three separate depths.\n\n# What’s Next?\n\nI
    would like to sell a few of these devices and get some feedback.\n\nIf you’re
    interested in this device, please sign up for the [email notification here](https://shop.rootkitlabs.com/products/4reel-stereo-camera).
    If I get more than 20 signups, I’ll order another 10 boards with all the fixes
    and list these for sale. Please note this isn’t a pre-order, but only sign up
    if you are serious about supporting the project :)\n\nIf I get enough interest,
    the next stage of the project will be software cleanups, image optimisations,
    implementing SLAM, and YOLO.\n\nThanks for reading!\n\n* * *\n\n### Author\n\n
    ![Ryan Walker](/img/me.png)\n\n#### Ryan Walker\n\nBuilding open source stuff
    with open source stuff.\n\n[![](/img/shop.png)Our Shop](https://shop.rootkitlabs.com)[![](/img/email.png)Email](mailto:info@rootkitlabs.com)[![](/img/youtube.png)Youtube](https://www.youtube.com/@rootkitlabs)[![](/img/github.png)GitHub](https://github.com/o7-machinehum)\n\n[![](/img/ig.jpg)Instagram](https://www.instagram.com/rootkitlabs/)[![](/img/discord.png)Discord](https://discord.gg/EtZT7mjNuM)[![](/img/twitter.png)Twitter](https://twitter.com/machinehum)[![](/img/rss.png)RSS
    Feed](https://rootkitlabs.com/atom.xml)"
