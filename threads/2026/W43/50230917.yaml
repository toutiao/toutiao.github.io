  author: Gabriel54
  text: I don&#x27;t like to frame it in terms of, &quot;this person is using AI,
    so I am no longer interested in communicating&quot;, because it is not really
    the AI that is the problem.  It is the lack of effort put into communication with
    another human.  AI can be extremely helpful for some people (e.g., proofreading
    text if one&#x27;s native language isn&#x27;t English).  But this use case is
    almost never a problem if done carefully because the original ideas were all there
    in the beginning.<p>I focus my frustration on writing that is circular, vague,
    unnecessarily explanatory, etc.  In my experience this is a symptom of the fact
    that there were no original ideas to begin with.
