  author: jacquesm
  text: Pigments are a rabbithole that will suck you in and spit you out 10 years
    later with arcane knowledge about grinding up various gemstones, drying plants
    and all manner of minerals such as clays and so on. You will also be exceptionally
    well traveled.<p>If you&#x27;re ever in the Netherlands I can recommend a visit
