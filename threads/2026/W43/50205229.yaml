  author: bob1029
  text: The reasoning effort knob is becoming a really important variable regarding
    how much impact AI models will have on energy consumption. Medium and max can
    differ by as much as two orders of magnitude in their token consumption. We also
    have to consider the amplification of compute demand that occurs by way of the
    tool calls themselves. Tokens are mostly a constant cost thing, but how they are
    interpreted can mean the difference between a 5 minute cpu bound operation and
    a 50uS cached database lookup. At some point, the CPU is going to become the bottleneck
    again.
