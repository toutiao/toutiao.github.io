  author: bayindirh
  text: "&gt; AI-assisted autofocus, subject tracking...<p>This is already present
    for the last decade. It&#x27;s the foundation which makes &quot;sports DSLRs&quot;
    possible. AI here is not what we know as today&#x27;s &quot;AI&quot;. These are
    specialized models baked into DSPs to run at inhuman speeds. In Sony&#x27;s case
    it&#x27;s phase data, image itself, information from the lens, and sometimes the
    accelerometers on camera. This is not making something up from thin air.<p>AI
    assisted autofocus is smarter phase detect autofocus. Subject tracking is an educated
    guess for where the focus shall move, based on movements in the image.<p>My ~20
    year old Nikon D70s has a 1004 pixel &quot;scene detection and metering&quot;
    sensor &quot;trained&quot; on thousands of images to make educated guesses in
    full-frame metering mode to exposure correctly. This is in no way helping or altering
    the image in any way. Same for faster autofocus and object tracking.<p>Exposure,
    white balance, noise reduction, color correction, HDR et al can be all achieved
    with deterministic and traditional algorithms as well. Some of these processes
    have history in film photography and carried over to digital from analog. Some
    photographers are famous for their darkroom treatment of their shots during development.<p>Processing
    an image with deterministic algorithms using the data in the raw photo is fine.
    This is how darkrooms work as well. However, guessing things, altering images
    by adding something which was not there and claiming otherwise is not acceptable.
    This can be a new element inside the scene or pixel details which was not resolvable
    by the lens&#x2F;sensor&#x2F;film to begin with. Both are &quot;photomanipulation&quot;,
    not photography."
