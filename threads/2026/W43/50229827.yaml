  title: Nikon photography contest winner loses title after scientists spot telltale
    signs of AI-generated footage | TechSpot
  fetch_status: success
  content: "Serving tech enthusiasts for over 25 years.   \n TechSpot means tech analysis
    and advice [you&nbsp;can&nbsp;trust](https://www.techspot.com/ethics.html). \n\n**A
    hot potato:** It seems that the once-popular trend of entering AI-generated content
    in competitions made for humans hasn't gone away. The winner of one of the world's
    most prestigious scientific photography awards has just had his title stripped
    from him after his entry was determined to have been created using AI.\n\nNikon's
    16th annual Small World in Motion [contest](https://www.nikonsmallworld.com/galleries/small-world-in-motion)
    is open to any movie or digital time-lapse photography taken through the microscope.\n\nThis
    year's winner was Dr. Ning Xu, from Tsinghua University in China, whose video
    captured tiny cilia beating in the airways of a child with primary ciliary dyskinesia,
    a rare respiratory disorder.\n\nBut Xu's entry raised several concerns among members
    of the scientific community. Some researchers said there were abnormalities in
    the structure and size of the cells and that their features appeared and disappeared
    in a way not seen in cellular biology.\n\nOne associate professor at the University
    of Florida said some of the structures \"pop in and out of existence\" and the
    cilia \"appear from nowhere,\" which are classic indications that a video was
    AI-generated.\n\n \n\n#### // Related Stories\n\n- [OpenAI claims 10,000 of its
    AI agents solved one of mathematics' hardest problems in 88 hours](https://www.techspot.com/news/113785-openai-claims-10000-ai-agents-solved-one-mathematics.html)\n-
    [Geely's new charging system takes EVs from 10% to 70% in 4 minutes, 30 seconds](https://www.techspot.com/news/113966-geely-new-charging-system-takes-evs-10-70.html)\n\nA
    more damning discovery came from PhD student Ian Donovan at UT Southwestern Medical
    Center, who said the source image appeared to contain a distinctive watermark
    indicating it had been AI-generated. Two former competition judges also raised
    concerns about the clip's legitimacy.\n\nIn a now-deleted LinkedIn post, Xu admitted
    to using AI in the video, but he said it was only used to \"distinguish and visualize
    features in the reconstructed grayscale images from the super-resolution optical
    imaging\" during post-processing.\n\nHe added that AI had not been used to generate
    the video itself, the cilia, or their movement.\n\nXu insists that he has not
    broken competition rules. While enhancing the visibility of microscopic structures
    is common and allowed, researchers typically use techniques such as applying stains
    and dyes to the samples themselves.\n\nHowever, Xu's explanation doesn't account
    for the abnormalities found in his video. Some scientists said the doubts could
    have been removed if Xu had shared the RAW grayscale video.\n\nAn investigation
    by Nikon found that Xu had violated the competition's rules, and he was subsequently
    stripped of his prize. The top spot has instead been awarded to Nguyen Nam Nhat
    of Vietnam, who entered a video of a tiny roundworm and a single-celled organism.\n\nFollowing
    the incident, Nikon said in a statement that it plans to \"revisit rules and evaluation
    procedures for future competition entries.\"\n\nWe've seen several examples of
    AI-generated images being entered into, and sometimes winning, art competitions
    going back years. A Midjourney image won a category in Colorado State Fair's annual
    art competition in 2022, while another creation won a photography contest hosted
    by Australian photo retailer digiDirect in 2023.\n\nThere was also the case of
    an artist who won a category in the 2023 Sony World Photography Awards but [refused
    his prize](https://www.techspot.com/news/98337-creator-whose-ai-generated-image-won-photo-competition.html)
    because his image (below) was AI-generated – something that seems quite obvious
    these days.\n\nIn a more satisfying story from 2024, a man who won a digital art
    competition using an AI-generated image and was thoroughly unapologetic about
    it complained that people had started [stealing his \"work\"](https://www.techspot.com/news/104966-man-who-won-art-competition-ai-generated-image.html)
    and he couldn't copyright it.\n\n[1 comment 415 likes and shares](#commentsOffset)\n\nShare
    this article:\n[\n\n](https://www.reddit.com/submit?url=https://www.techspot.com/news/114171-nikon-photography-contest-winner-loses-title-after-scientists.html&title=Nikon%20photography%20contest%20winner%20loses%20title%20after%20scientists%20spot%20telltale%20signs%20of%20AI-generated%20footage)[\n\n](#Share)\n\n**See
    more TechSpot in Google** Add us as a preferred source and our reporting shows
    up first when you search.\n[Add TechSpot](https://www.google.com/preferences/source?q=https://www.techspot.com
    \"See more TechSpot stories on Google Search\")"
