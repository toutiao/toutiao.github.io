  author: voidhorse
  text: I think your response misses pretty important distinctions between art and
    practical pursuits.<p>People get upset when other people use AI in the arts because
    the point is largely <i>human expression</i>. Technical virtuosity isn&#x27;t
    even necessarily the most important thing in art (just look at modern art and
    how common the philistine refrain of &quot;my kid could do that&quot; is).<p>Art
    doesn&#x27;t serve a utilitarian function. Using AI for it largely misses the
    point, and I think that&#x27;s what people get upset about. It&#x27;s like showing
    up to play tag and saying &quot;actually I&#x27;m going to play hide and seek
    instead&quot; you aren&#x27;t following the established social norms of the game.<p>Contests,
    in general, always ways have restrictions around them, because they are meant
    to test particular human feats. I&#x27;m sure plenty of future contests will have
    rules against AI just as today plenty of contests arbitrarily limit technologies
    for the good of the competition (e.g. no doping in sports).<p>To respond to this
    situation by emphasizing the utilitarian function and value of AI is to completely
    miss the point.
