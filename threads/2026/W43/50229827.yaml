  author: bayindirh
  text: 'It&#x27;s not deblurring, there&#x27;s no post processing. It just selects
    where to autofocus, and commands the lens to focus to that point, that&#x27;s
    all.<p>AI assisted autofocus and object tracking doesn&#x27;t alter the image
    after capture. It just moves your focus point and tries to keep the object <i>optically</i>
    in focus during the half-press phase.<p>The most expensive equipment doesn&#x27;t
    give you any advantage in composing, exposure, etc. If you&#x27;re shooting birds,
    you need some tracking capabilities and fast focusing lenses. These are not expensive
    because they post process the image, but they have expensive glass, fast motors
    and powerful DSPs to track that bird in that frame. If you can&#x27;t frame the
    bird and press the shutter the right moment, you&#x27;re toast.<p>Nobody is using
    relighting tricks like Nikon D-Lighting in competitions, it&#x27;ll disqualified
    anyway. I&#x27;m not sure my Sony has similar post processing options, even.<p>These
    are shot with a D70s: <a href="https:&#x2F;&#x2F;www.flickr.com&#x2F;photos&#x2F;zerocoder&#x2F;39910477633&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.flickr.com&#x2F;photos&#x2F;zerocoder&#x2F;39910477633&#x2F;</a>,
    <a href="https:&#x2F;&#x2F;www.flickr.com&#x2F;photos&#x2F;zerocoder&#x2F;41901384135&#x2F;in&#x2F;photostream&#x2F;"
