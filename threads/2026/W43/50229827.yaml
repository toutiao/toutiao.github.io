  author: razster
  text: 'Oh man, I love using AI to retouch my photographs. I shoot with a Canon 5D
    Mark I (OG), which has a faulty sensor. Since I can’t afford an upgrade, I rely
    on vintage glass: Pentax SMC 50mm and 35mm lenses adapted from M42 to EOS. With
    FIBO2 and Qwen Image 2.1, I can transform my raw shots so they look as though
    they were captured with a high-end digital camera. I then pass them through Lightroom
    for fine adjustments, add some Photoshop magic, and bam—the result is exactly
    what I want. I’ve been photographing as a hobby for a little over 25 years now.<p>Going
    forward, I’ll be using local diffusion models exclusively, and I couldn’t care
    less what others think. This workflow suits me perfectly, and I genuinely enjoy
    the process. I have over 100,000 digital and film photos I&#x27;ve slowly been
