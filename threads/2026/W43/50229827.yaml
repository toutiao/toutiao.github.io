  text: There has always been some fuzziness behind what counts as &quot;genuine photography&quot;
    and people have been gatekeeping it for decades as new camera tech became available.
    Generating statistically likely pixels given the context of the image and massive
    amounts of (untraceable, stolen) training data definitely seems like a different
    kind of post-processing than what you&#x27;d normally do in an editor, or even
    changing pixels by hand.<p>Nikon gets to gatekeep their competition however they
    like. Personally I think it would be a shame to reward photographers for the work
    they do outside taking the shot and light editing&#x2F;compositing. What&#x27;s
    the point of a competition if you&#x27;re not going to enforce high standards
    and challenging constraints?
