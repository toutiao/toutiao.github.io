    script syntax that it can link Linux kernel modules and is close to being able
    to link the Linux kernel itself.\n\nThe Mac port has made significant progress.
    The feature isn't yet to the point where we're prepared to enable it by default,
    but Wild is able to link itself on Mac and at least one of the maintainers is
    now using Wild as their default linker for Rust on Mac.\n\nWe've also fixed some
    performance issues that were affecting various filesystems and made a few general
    performance improvements. We also got a bit slower due to implementing proper
    ELF COMDAT support.\n\nWe now cap the number of threads to at most 32 unless overridden
    by --threads. This avoids bad performance that occurs with larger numbers of threads
    due to contention on a Linux per-inode mutex.\n\nOur benchmarks have been expanded
    to include a wider range of scenarios such as different filesystems and whether
    the output file already exists.\n\n### Build requirements\n\n- Minimum rust version
    for building Wild is now 1.99.0\n\n### \U0001F680 Features\n\n- Implement FILEHDR
