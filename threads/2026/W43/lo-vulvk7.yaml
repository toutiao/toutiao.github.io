  author: MaskRay
  text: |-
    Many interesting updates.

    COMDAT section group support (PR #2727): This is a major addition that makes performance comparisons between lld/mold/wild much fairer. I blogged about this feature before. However, this feature slows down symbol resolution considerably. I believe the COMDAT winners are different among the three linkers in some corner cases: the differences should be acceptable in practice.
    Host kernel/filesystem probing for I/O optimization. I feel this is rather unfortunate https://maskray.me/blog/linker-io-tricks-and-their-downsides

    They now vendor lld-tests.

    On the feature front, it's sad to see the implementation of niche features that are virtually unused in GNU ld -- such as the LDEMULATION environment variable and --error-execstack.
    These original requests typically come from reporters who may not know which options are actually important (likely driven by LLM-generated linker comparisons).
    I've noticed a similar trend with mold a few years ago, where several options are implemented that you almost never need, even if you build every package in Gentoo Linux. Rui Ueyama likely would have rejected them back when he maintained lld/ELF.
