article:
  url: https://danluu.com/ambitious/
  title: "“We should be more ambitious with the software we build”"
  fetch_status: success
  content: "Since early this year, Michael Malis (of [pgrust](https://github.com/malisper/pgrust))
    has been showing me interesting things he's done and saying\n\n \n\n> [W]e should
    be more ambitious with the software we build\n\n \n\nThere is, understandably,
    a lot of skepticism about projects like pgrust because there are so many low-quality
    AI-generated projects out there. If I didn't know Malis and didn't look into it,
    I would just assume that pgrust was another vibe slopped project that's never
    going to work. But I know Malis well enough to trust his work without looking
    into it, and if you look into it a bit, you'll see that in testing pgrust, he's
    testing thoroughly enough that he's even uncovering real bugs in Postgres, such
    as [this numerical bug that can cause valid SP-GiST operations to fail](https://www.postgresql.org/message-id/19597-39c532e61d78dff6%40postgresql.org),
    [this format cache bug that can cause incorrect results from JSONPath](https://www.postgresql.org/message-id/19594-5d9bdc019e3f7f6e%40postgresql.org),
    [this pgcrypto bug that can cause later operations to fail](https://www.postgresql.org/message-id/19600-e5fb479f50f5022d%40postgresql.org),
    [multiple memory safety bugs in the dictionary loader](https://www.postgresql.org/message-id/19595-7dc18b4e212c4757%40postgresql.org),
    [this money overflow bug](https://www.postgresql.org/message-id/19586-bb603bf5ad9934dd%40postgresql.org),
    etc.\n\n \n\nThis isn't to say that pgrust is bug free, but it does indicate that
    there's a substantial amount of testing happening and, even if pgrust itself is
    never successful, just making the attempt will have improved Postgres in a durable
    way. The main pitch for pgrust is actually performance, and that's where the really
    interesting work is happening; if pgrust fails, it's possible that some of the
    optimizations they've demonstrated will make it into Postgres, Clickhouse, etc.,
    but that's obviously less direct than filing Postgres bugs which get fixed.\n\n
    \n\nThat being said, I find it understandable that, every time I see pgrust discussed
    on a news aggregator, most people dismiss it as vibeslop garbage because almost
    all of these rewrite projects are slop. If I didn't know Malis, I would make the
    same assumption, because who has the time to look into all of these projects?
    Because I know Malis, I didn't bother to look at it; I just trusted him (I only
    found the above because I wanted to check on pgrust before using it as an example
    for this post).\n\n \n\nAs a consumer of software, everywhere you look, there's
    [slow software that the creator is claiming is fast](/benchpocalypse/) because
    the creator is touting some slop benchmark, e.g., [here's one of multiple examples
    I saw yesterday](https://x.com/anthonysheww/status/2108627889910669707), and of
    course low-quality software that doesn't work is more common than ever.\n\n \n\nBut,
    as a builder of software, it doesn't matter that almost all of these projects
    are vibeslop, that other people are out there shoveling out huge piles of crap
    and calling it gold. You can build things like pgrust or other projects that would've
    been too large to really be feasible in the past and, if you do a reasonable job
    with testing and benchmarking, that stuff can actually be good-enough quality
    to use.\n\n \n\nIf I were writing it, I would say \"we can be more ambitious with
    the software we build\" and not \"we should\", but Malis has been casually chatting
    with me when he's said this, so maybe he would say the same in an actual post;
    don't read too much into should vs. can here. What's interesting to me is how
    capabilities have advanced such that we can do a lot more.\n\n \n\nJust for example,
    after hearing that OpenAI was going to use Cerebras for their SOTA models and
    not just fast-but-low-quality models like 5.3-Codex-Spark, I looked at where time
    on my computer would go if I was using a SOTA model, but 10x to 100x faster; some
    things that were already sometimes a bottleneck that would only get worse with
    a faster model were:\n\n \n1. Ripgrep\n2. Compiling Rust\n3. Syscall and filesystem
    overhead\n \n\nAt the level of a \"works for me\" project, these are all things
    that can seriously be improved. I don't have much spare time at the moment but,
    even so, I built [this regex engine that can be tweaked to be faster than other
    general-purpose regex libraries on any particular workload I care about](/benchpocalypse/),
    [this ripgrep fork that uses the native code compiler from the regex engine and
    is faster for my codex ripgrep workloads](/perf-opt/) (of course a text index
    is the better solution, [but I've already worked on text indexing](https://danluu.com/bitfunnel-sigir.pdf)
    and this was a \"just for fun\" project where I wasn't trying to do the optimal
    thing), and a Rust that sped up builds for my projects (huge improvement for cold
    builds, moderate for warm, limited by wanting to avoid forking the Rust compiler
    front-end). For syscalls and filesystem overhead, just switching development from
    Mac to Linux improved this a lot, and of course this is another thing that can
    be sped up a lot as well, especially when agents are hammering lots of small filesystem
    operations (it's not uncommon to see my machine waiting on filesystem ops because
    the standard OS filesystem interface wasn't designed with modern disk performance
    in mind).\n\n \n\nFor someone like me who doesn't know anything about regexes,
    string matching algorithms, compilers, interpreters, etc., this set of projects
    would've taken a year or more to get to \"works for me\" quality. Instead, this
    was a low single-digit number of hours of my time. If I wanted to make any of
    these things meet a \"useful product or open source project\" quality bar, that
    would be a lot more work, but it's still pretty incredible how much this process
    is sped up.\n\n \n\nMy read of Malis's meaning when he says “we should be more
    ambitious with the software we build”, is that it doesn't even occur to people
    to do these things that are now easy. For weeks, every time I logged into Twitter,
    I saw someone complain about how Rust compilation is slow and is limiting development
    velocity (I think this wasn't actually true when I saw the complaints, in that
    this was before 5.6 Sol and 6 Astra were available on Cerebras, and if you measured
    where the time actually went, Rust compilation time wasn't actually that much
    of a bottleneck at the time). Sure, Rust compliation is slow. You can just write
    a Rust interpreter as well as speed up compilation directly. There are problems
    like this which I see people complaining about daily that are solvable without
    a lot of time or effort now. As far as I can tell, these problems are problems
    because people are implicitly carrying around a pre-agentic cost model. Ten years
    ago, the kind of person who implemented a new compiler because their compiler
    was slow was the kind of person who started programming a new 3d game engine when
    they wanted to make an indie game, i.e., the kind of person who never ships anything.
    Most productive programmers I know still have an aversion to this kind of thing,
    even though it is now actually reasonable to implement this kind of thing now.\n\n
    \n\nAnother project I previously mentioned was [this Azul AI which is superhuman
    at matched time controls](/game/tile/). When I did that (with GPT-5.1/5.2), with
    zero AI knowledge, it took about 5 hours of my time to get something superhuman,
    and about 20 hours of my time to become what appeared to be the strongest AI at
    the time, [including being stronger against humans than this AI that was used
    to cheat on Board Game Arena](https://www.youtube.com/watch?v=qkzpeXGwE-4). Gabriel
    Cangussu recently built an AI that demolishes my AI, and AFAICT, it took him substantially
    less time than my AI took me. From talking to him about it, one key difference
    is that Fable 5.1 and Opus 5.5 have a much better understanding of board game
    AIs. When I used GPT-5.1/5.2, pretty much every suggestion they had was wrong
