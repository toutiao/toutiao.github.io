  author: linsomniac
  text: '&gt;In the spirit of the latter, here&#x27;s mine!<p>To pile on, here&#x27;s
    mine: <a href="https:&#x2F;&#x2F;github.com&#x2F;linsomniac&#x2F;apt-cacher-ultra"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;linsomniac&#x2F;apt-cacher-ultra</a><p>It
    is a robust, reliable cache of apt packages, with the additional goal of still
    being able to serve packages from the cache even when the upstream is down.  This
    was started shortly after that DDoS of Canonical this past year.  We&#x27;ve run
    apt-cacher-ng and apt-cacher over the last dozen years, but (a) it requires hand-holding
    about once a month and (b) it did absolutely nothing for us when Canonical was
    under DDoS.<p>I&#x27;ve put well over 100 hours of my time into it.  Still running
