  author: ricardobeat
  text: Those were exactly my thoughts when deciding to write a new JS engine [1]
    written from scratch.<p>Having been a product and UX-focused dev for my entire
    career, I knew only the basics about parsers and compilers, but have enough experience
    to grasp where each piece of the puzzle fits, and how to evaluate them. At the
    beginning it was just a fun test, but it got progressively more serious; it now
    implements 100% of the latest spec, beats QuickJS in performance, and surpasses
    V8&#x2F;JSC in test262.<p>It took me four months, and I imagine it would take
    me a single month to do it again - I’ve learned a lot. Someone who already knew
    what they were doing, and with the right orchestration, could achieve this in
    <i>weeks</i> at minimal cost.<p>I really think we are in for a cambrian explosion
    of software, enabling things that were just always a little out of reach before
    (like why can’t most of your devices really talk to each other, in 2026).<p>[1]
    <a href="https:&#x2F;&#x2F;github.com&#x2F;ricardobeat&#x2F;boomkat" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;ricardobeat&#x2F;boomkat</a>
