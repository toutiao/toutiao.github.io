  author: Karrot_Kream
  text: Plenty of other professions were hit by computing. Part of why programmers
    are so  emotive about this concept (other than the fact that emoting online loudly
    seems to be much more accepted in software than other professions) is that programming
    has never been threatened in the same way as other professions have been until
    now.<p>My parents-in-law started their careers as management consultants. The
    job in their time was much higher prestige and much higher value than it was when
    I started my career; free flow of information over the internet and commodification
    of spreadsheets changed all of it. From my parents&#x27; generation, I know practical
    effects folks who became unemployable once movies went to digital effects; engineers
    who found their draftsmanship skills obsolete. Folks with near-photographic memories
    whose entire superpower was destroyed by computing. I personally grew up in a
    blue collar community that was income depressed because its labor became commodified,
    though that was due to mechanization.
