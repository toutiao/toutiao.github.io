  content: "Emacs\n\n# Emacs finally folds to my liking\n\n· 11 minutes\n\nI’ve been
    slowly turning [my Emacs config](https://codeberg.org/jjba23/heks-emacs) into
    something I actually _enjoy_ using, not just something that works, and folding
    was the last place where that wasn’t true.\n\nEvery mode had its own idea of what
    folding is: `treesit-fold` in Tree-sitter modes, Hideshow in the Lisp-ish ones,
    Outline in everything that resembles text, Org with its own invisible text that
    no one else’s commands can undo.\n\nSo every buffer had different keys, a different
    look, and worst of all different _performance_ characteristics. Folding a big
    file sometimes felt like holding my breath.\n\nI’m running Emacs 32.0.50 from
    `master` (built from source, as one does), and it’s finally one system.\n\n![](https://jointhefreeworld.org/static-assets/heks/screen-2026-10-23-16-17-32.png)\n\n##
    kirigami is the piece I didn’t know I needed&nbsp;[#](#kirigami-is-the-piece-i-didnrsquot-know-i-needed)\n\n[kirigami](https://github.com/jamescherti/kirigami.el)
    doesn’t fold anything itself. It _dispatches_: it keeps a list of folding engines,
    checks which one is actually active in the buffer, and forwards to it. Tree-sitter,
    Hideshow, Outline, Org, Vdiff — all behind one interface.\n\nSo on top of it I
    put one set of keys, the same in a Kotlin buffer, YAML, a Scheme or ELisp buffer
    and an Org file:\n\n| Key | Does |\n| --- | --- |\n| `C-c v c` | close this fold
    |\n| `C-c v C` | close every fold |\n| `C-c v o` | open this fold |\n| `C-c v
    O` | open this fold and everything under it |\n| `C-c v r` | reveal everything
    |\n| `C-c v t` | toggle the fold at point |\n\nThat sounds small. It is not small.
    The number of times a day I used to think “wait, what does TAB do in this mode
    again” is now zero, and the muscle memory transfers across an entire polyglot
    config.\n\nOne wrinkle worth mentioning: kirigami answers with the _first_ engine
    in its list whose mode is on, and `outline-minor-mode` is on in nearly every buffer
    I have. In the buffers where I deliberately turned on Hideshow — Scheme, for instance
    — that choice has to win, otherwise `C-c v c` folds “headings” a Scheme file doesn’t
    have. So I reorder `kirigami-fold-list` to put Hideshow first instead of rewriting
    it; engines kirigami adds later still get used wherever Hideshow is off.\n\n##
    Tree-sitter folding, with guides that are actually lines&nbsp;[#](#tree-sitter-folding-with-guides-that-are-actually-lines)\n\nMost
    of my programming buffers are `*-ts-mode`, so `treesit-fold` does the work there
    — bash, C, C++, CMake, CSS, Dockerfile, Elixir, Go, HTML, Java, JS/TS/TSX, JSON,
    Kotlin, Lua, Nix, PHP, Python, Ruby, Rust, Scala, TOML, YAML. Line counts are
    shown inline, which I find genuinely useful when deciding whether to open a fold.\n\nThe
    indicators took the most fiddling. `treesit-fold-indicators` draws a block’s guide
    with a bitmap 23 rows tall, centered in the line beside it. A line in my config
    is 29 pixels — the font’s 23 plus six of `line-spacing` — so every row of the
    guide was a 23-pixel dash with three pixels of nothing above and below it. A folded
    block looked like a _dotted_ line running down the fringe. Not subtle, just wrong.\n\nThere’s
    no setting for that, so I replaced the bitmaps: a single-row bitmap that `define-fringe-bitmap`
    repeats down however tall the line is (no spacing can introduce a gap), plus a
    `+=/`-= box and an end-elbow cut to the exact height of a line, so the guide runs
    from the marker into the row below and turns toward the text where the block ends.
    It’s an advice on the function that builds the string for each line. It looks
    like a bracket now, not a perforation.\n\nAnd the colour: the indicators inherited
    `shadow`, which most themes make as bright as a comment. Fine for one marker on
    one line, wrong for a marker on _every_ line of a block — the grey became a rule
    drawn through the code. They’re now `shadow` blended 50% toward the theme’s background,
    recomputed on every theme and scale change, so it fades correctly on light themes
    too and no theme needs a special entry.\n\n## Hideshow earns its keep&nbsp;[#](#hideshow-earns-its-keep)\n\nNot
    everything has a grammar, and I’m not going to pretend otherwise:\n\n- **Scheme**
    — my Emacs build has no Scheme grammar, so Scheme buffers use Hideshow with `hs-block-start-regexp`
    set to `\"^(\"` and `hs-forward-sexp-function` set to `forward-sexp`. A Scheme
    file is a sequence of top-level forms, so each definition is a fold, and collapsing
    the one you’re inside works from anywhere within it. That’s the behaviour I wanted
    from the start and Hideshow doesn’t guess it by default.\n- **Emacs Lisp** — the
    `prog-mode` fallback, same keys.\n- **XML** — folds from start tag to end tag
    using `nxml-scan-element-forward`, skipping `<?xml ?>`, comments, DOCTYPE and
    self-closing elements.\n- **YAML** (the non-Tree-sitter mode) — indentation-based
    blocks with a small `forward-sexp` of my own that walks to the end of the indented
    block.\n\nHideshow’s own fringe indicators (`hs-show-indicators` + `hs-indicator-type
    'fringe`) are on in all of these, so it doesn’t feel like a downgrade from the
    Tree-sitter buffers.\n\nThe rule I enforce per buffer is **exactly one set of
    indicators** : Tree-sitter buffers get `treesit-fold` and Hideshow is turned off;
    Hideshow buffers get Hideshow and Outline’s clickable buttons are turned off so
    the two don’t double up; outline-only buffers (Markdown, diff) keep the buttons.
    Nobody ends up with two markers per block.\n\n## Org, which needed its own everything&nbsp;[#](#org-which-needed-its-own-everything)\n\nOrg
    folds with text properties, not overlays, so neither Tree-sitter nor Hideshow
    nor Outline’s buttons can draw a marker for it. So I wrote its own indicators:
    a fringe triangle pointing down for an open heading, right for a folded one, clickable
    with `mouse-1` to toggle exactly like `TAB`. Folding itself is untouched — `TAB`,
    `S-TAB` and the `C-c v` keys all still work.\n\nThe performance part is where
    the real win is. A naive “redraw indicators after every command” implementation
    is a disaster in a large file, because it re-searches the buffer and rebuilds
    every overlay on every pause. Mine is driven by the text instead:\n\n- if `buffer-chars-modified-tick`
    didn’t change, only the indicators that are **on screen** are redrawn — off-screen
    headings can wait until they’re scrolled to;\n- if it changed and the change was
    recorded, only the **dirty region** is rebuilt;\n- if it changed with no recorded
    change, only then is the whole buffer rebuilt.\n\nFolding changes text properties
    rather than characters, so folding alone takes the cheap path. Fold state is read
    back from Org on each redraw rather than remembered, so external folding can never
    leave a stale marker.\n\nTwo config choices matter just as much: `org-fold-core-style`
    is `text-properties` (so a visibility cycle doesn’t re-parse the file), `org-element-use-cache`
    is on, and Org starts with `showeverything` — which is both what I want (a note
    is read, not consulted) and the cheaper state, because it skips the visibility
    passes that walk every heading on open. I also removed a `org-restart-font-lock`
    that was re-fontifying the whole buffer a second time on open; JIT-lock handles
    what’s on screen.\n\n## It feels smooth, and that’s the whole point&nbsp;[#](#it-feels-smooth-and-thatrsquos-the-whole-point)\n\nThe
    end result is that folding is _boring_ now. `C-c v c` in Kotlin, Scheme, Elisp,
    Org, XML, YAML, Markdown. Guides that look like brackets. Indicators quiet enough
    to ignore until you need them. No pause on a 3000-line Org file. No two competing
    markers.\n\nIt honestly changes how much I collapse and expand while reading code.
    I used to avoid folding because it felt fiddly; now it’s free and mouse friendly.\n\nIf
    you want to read the actual code: it’s in [dev-folding.el](https://codeberg.org/jjba23/heks-emacs/src/branch/trunk/src/modules/dev-folding.el)
    for the engines and indicators, the `heks/fold-*` wrappers in `heks-emacs.el`
    for the keys, and the Org "
