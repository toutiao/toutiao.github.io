  author: mrkeen
  text: |-
    I think the viewpoint that your&#x27;re missing is: how do I make sure the machine code means the same thing as the source code?<p>Trying to one-shot &#x27;print &quot;hello world&quot;;&#x27; into<p><pre><code>  .LC0:
            .string &quot;hello&quot;
      &quot;square&quot;:
            push    rbp
            mov     rbp, rsp
      ...
    </code></pre>
    is probably a non-starter, so compiler writers tend to attack the problem by breaking it down into lots of passes.<p>Parsing into an AST is obviously the first, then you might opt into other passes, like type-checking, handling closures, simplifying into some kind of IR, and finally generating code.  Each of those stages can be effectively unit-tested (except maybe the last).  If you make a mistake in parsing (e.g. mistaking a statement for an expression), you don&#x27;t want to have to catch that error by inspecting machine code.  It&#x27;s nice if each pass can be easily tested.  And one simple way to test these things is to write an interpreter for each pass (mostly because you get to enjoy the facilities of whatever host language you&#x27;re writing in).  Then you can start saying things like &quot;for all inputs, interpreting the AST gives the same result as interpreting the type-checked-AST, gives the same results as interpreting the closured-AST, gives the same results as interpreting the list of IR instructions.&quot;<p>You mention &quot;It ought to be easy because it is possible to only target the common subset of features these architectures support.&quot;  &lt;- That&#x27;s your IR right there!<p>Once you have an IR that looks close enough to the target machine language, it shouldn&#x27;t be too hard to translate the final step.  Or just use LLVM.<p>I noticed in your code that you&#x27;re using C, and really there&#x27;s no need.  Languages don&#x27;t need to be stacked in a hierarchy (e.g. Clojure on top of the JVM which is C++ which compiles to asm).  The compiler can be any language, because it only needs to be able to take in source code and spit out bytes.
