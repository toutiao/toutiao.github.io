  author: abainbridge
  text: "&gt; I think the viewpoint that your&#x27;re missing is: how do I make sure
    the machine code means the same thing as the source code?<p>Ooo, no. I already
    have an AST. When writing the code gen for a node type in the AST, I normally
    start by typing a few lines of C into godbolt that exercises the same kind of
    thing represented by the node type. I try a few different compilers and optimization
    settings and look at what gets generated. I pick an approach that looks simple
    and good enough. Then I ask an AI to assemble the instructions I see the compilers
    using. I like to ask an AI to do this because it will explain what all the bits
    do in the instruction encoding and it is less error prone at reading the ISA docs
    than I am. The description from the AI might prompt me to ask things like, &quot;what
    if the jump target doesn&#x27;t fit in the 32-bit immediate&quot; etc.<p>All I
    was claiming was that this is easier than generating code for a byte code of my
    invention, partly because I don&#x27;t have to invent a byte code and partly because
    I can use existing tools to help, eg disassemblers&#x2F;debuggers to check my
    output or compilers to give me ideas on how to convert C-like statements into
    machine code.<p>I don&#x27;t have any IR at the moment. I&#x27;ll have a think
    about what benefits that might bring.<p>The reason I posted my project under this
    top level thread is because I&#x27;m interested in Small Programs and Languages.
    My experiment is in what I can remove from a language implementation to make it
    simpler. Adding a dependency on LLVM is the opposite of what I had in mind :-)<p>There
    are many reasons I&#x27;m writing it in C but mainly because I like C."
