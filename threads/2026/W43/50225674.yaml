  author: bitwize
  text: Says more about the very real limitations of the human mind than anything
    else.<p>With an LLM, you can get a good-sized code base to converge on bug-free.
    The size of the code base your human mind can comprehend on its own is very small,
    so tiny pieces of code that do something interesting or useful seem beautiful
    and phenomenal to us. LLMs bust through that limitation and are capable of comprehending
    far more at one time than we are. Ultimately, human comprehensibility of code
    will no longer matter, and we will soon be guiding the evolution of vast towers
    of complexity that Just Work because they&#x27;ve been meticulously checked by
    machine at all but the highest levels of abstraction.<p>Where LLMs currently fall
    down is nuance, things like &quot;business context&quot; and what information
    resources users actually need.
