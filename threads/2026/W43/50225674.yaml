  author: abainbridge
  text: 'I&#x27;m interested in making a really simple compiled scripting language.
    I don&#x27;t understand why most scripting languages compile to bytecode and then
    interpret that. This requires the following steps:<p>1: Design a bytecode. 2:
    Write a compiler. 3: Write an interpreter.<p>It seems like it would be simpler
    to not bother with 1 and 3 and instead use machine code as the bytecode. A side
    benefit is that programs will run faster.<p>I think it is easy to generate machine
    code for x86_64, ARM64 and risvc64, as long as you don&#x27;t mind it being 3x
    larger and slower than an optimizing compiler would generate. It ought to be easy
    because it is possible to only target the common subset of features these architectures
    support.<p>I made a start, <a href="https:&#x2F;&#x2F;github.com&#x2F;abainbridge&#x2F;mortar"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;abainbridge&#x2F;mortar</a>,
    but haven&#x27;t got much past being able to compile and run a Fibonacci sequence
    generator. I have no experience with language design or compiler implementation.
    I was somewhat gobsmacked when the fib generator ran 380x faster than an almost
    identical looking Python program.<p>Any comments or suggestions, including, &quot;that&#x27;s
    a bad idea, you will fail because of XYZ&quot;, or, &quot;save yourself the effort,
    here&#x27;s one I wrote earlier...&quot;?'
