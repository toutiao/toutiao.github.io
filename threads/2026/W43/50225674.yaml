  text: "uxntal and varvara bring me such joy, it&#x27;s that perfect complexity where
    everything feels like a fun puzzle you can approach one step at a time.<p>The
    first time I saw it years back I was skeptical. As foremost a hardware guy I saw
    instructions in transistor count and gate delay, all that spaffed away on 16x16
    multiply and you couldn&#x27;t spare one flip flop for an overflow flag? Preposterous!<p>But
    the software already written was cool enough to convince me it was worth emulating,
    and once you&#x27;ve got an emulator you may as well write some software. A few
    short programs and I was in love. \nIt&#x27;s not about running code efficiently,
    it&#x27;s about making it fun to write efficient code.<p>No sharp edges, no corner
    cases, generally minimal machine state. The cognitive load is so much smaller
    than any real world assembly I&#x27;ve used.<p>I didn&#x27;t mean to write such
    a lot of meandering offtopic fluff, but damn, I just love that little guy \n(
    ⊖-w-⊖)"
