  content: |-
    My [Implementing a Forth](../forth/implementing) article got some great feedback, particularly around the subject of tiny Forth implementations. (And it was an excuse to list some of the tiniest Forths I’ve seen.)

    I know I’m not alone in seeing the appeal of tiny Forths, tiny languages, tiny programs, and just small stuff in general. What’s up with that, anyway?

    ## The appeal of tiny programs

    Tiny programs are approachable.

    If I see that something is 200 lines of code, I’m _much_ more likely to read it than if it’s 2,000 or 20,000 lines.

    What’s more, if it’s a program that does something interesting in 20 lines when I was _expecting_ 2,000, then I’m going to be very, very interested to read those 20 lines!

    When I was researching DOM diffing libraries prior to creating [RetroV](../retrov/), one of the repos I looked at was **ijk** by Luke Jackson.

    I was pretty used to looking at fat JavaScript libraries at that point, so when I cracked open the source file for ijk, I was really surprised. Here’s the source: [index.js](https://raw.githubusercontent.com/lukejacksonn/ijk/refs/heads/master/index.js) (githubusercontent.com).

    **Just 25 lines!** I was instantly intrigued.

    More recently, one of the responses to my aforementioned Forth article was Philippe Brochard with a 46 byte "Forth".

    **46 bytes!**

    It’s _so_ small, I can just put the hexdump right here:

        50b8 8e00 31d8 e8ff 0017 003c 0575 00ea
        5000 3c00 7401 eb02 e8ee 0005 0588 eb47
        b8e6 0200 d231 14cd e480 7580 c3f4

    (See my update to [Implementing a Forth](../forth/implementing) for more about this artifact.)

    Sure, very few people jump at a chance to read raw machine code. But that’s exactly my point. Something _this_ small doesn’t feel so scary, right? I mean, 46 bytes. If you put the effort into it, you _know_ you can figure out how it works eventually.

    This next one almost serves as a counter-example because the code is so dense and frightening, but I can’t help mentioning it anyway.

    One of my favorite software stories is Roger K.W. Hui’s Appendix A "Incunabulum" from _An Implementation of J_ in which he describes Arthur Whitney writing an array-based language interpreter,

    > "…​on **one page** and in one afternoon — an interpreter fragment on the AT&T 3B1 computer. I studied this interpreter for about a week for its organization and programming style…​"

    Hui can list the entire interpreter in the appendix because it’s just that single page, **122 lines** of incredibly cryptic C, which you can view here:

    [https://code.jsoftware.com/wiki/Essays/Incunabulum](https://code.jsoftware.com/wiki/Essays/Incunabulum)

    I haven’t personally tackled that puzzle yet, but it’s in my unwritten list of dense computer things that I would print out and take with me if I suddenly found myself cast out of society and forced to go live alone up on a mountain or something.

    (By the way, J is in the family of array languages which include APL. If you enjoy brevity, cryptic programming puzzles, and high performance numerical computing, these languages have got you covered!)

    **Update July 2026:** Speaking of Arthur Whitney,[Alex](https://alexalejandre.com/) (alexalejandre.com) sent me a link that I knew I’d have to add here. Check this out: [https://fall.tr/kos](https://fall.tr/kos)

    It’s a transcript of a Geo Carncross talk describing an operating system, kOS, featuring Whitney’s `k` array language, `kdb` database, and a GUI and window manager in a **90 Kb** bootable image. Individual source code stats are just as impressive (such as **60 lines** of C for the aforementioned GUI and window manager). And apparently kdb is 100 lines of C? Is that right? Even Whitney C, that’s still impressive. Now I’m even _more_ intrigued by kdb than ever! And if any of that seems interesting, you’ll definitely enjoy the article[Impending kOS](https://vector.org.uk/impending-kos/) (vector.org.uk).

    Something else that would certainly need to be in the collection I take to that lonely mountain would have to be _The Most Beautiful Program Ever Written_, according to the title of a talk by William Byrd. Spoiler alert: It’s this Lisp interpreter in Lisp:

        (define eval-expr
          (lambda (expr env)
            (pmatch expr
              [`,x (guard (symbol? x))
                (env x)]
              [`(lambda (,x) ,body)
                (lambda (arg)
                  (eval-expr body (lambda (y)
                                    (if (eq? x y)
                                        arg
                                        (env y)))))]
              [`(,rator ,rand)
               ((eval-expr rator env)
                (eval-expr rand env))])))

    (The above is from Alberto Zaccagni’s[transcription of the code](https://gist.github.com/lazywithclass/6af94f652cd59796e9592a5ea5772d17) (github.com) shown in Byrd’s slide.)

    ## Recreation or fundamental truths?

    Now, we all know that[code golfing](https://en.wikipedia.org/wiki/Code_golf) (wikipedia.org) is a programmer’s recreational game, and just for fun, right?

    But is any of this actually useful?

    I say yes. And I’ll go one step further: They are _meaningful_.

    When you see a[ray tracer that fits on a business card](https://fabiensanglard.net/rayTracing_back_of_business_card/) (fabiensanglard.net), it makes you realize that a ray tracer is_something that can fit on a business card_!

    That’s an actual _fact_ about the minimum complexity of ray tracers.

    [Kolmogorov complexity](https://en.wikipedia.org/wiki/Kolmogorov_complexity)(wikipedia.org) is:

    > "…​the length of a shortest computer program (in a predetermined programming language) that produces the object as output."

    (I learned about Kolmogorov complexity in a book about Kurt Gödel and it was my favorite thing in what was otherwise a pretty dry and depressing book.)

    The meaning I get from this is that code golfers, for the benefit of the whole human race, produce versions of programs that represent the minimum_complexity_ of those programs. Way to go code golfers!

    What do we know about the fundamental complexity of the Lisp programming language?

    Thanks to Justine Tunney, we know that a [LISP with garbage collection can be as small as 436 bytes](https://justine.lol/sectorlisp2/) (justine.lol).

    That’s a _fact_ about Lisps with garbage collection. When you strip everything else away, you can get the essentials down to **436 bytes!**

    I take comfort in this because that means the concept can be boiled down to this hand-held size. And _that_ means I can probably fit it in my head.

    Thanks to Frank Force, we know that a 3D browser game can fit in 2Kb of (insanely compressed) JavaScript source:[A 3D game in 2Kb of JS](https://frankforce.com/how-i-made-a-3d-game-in-only-2k-of-javascript/) (frankforce.com)

    [Martin Kleppe’s whole site](https://aem1k.com/) (aem1k.com) is filled with wonders you can run right in your browser.

    And we haven’t even scraped the _surface_ of what the demoscene has to offer for computers going back to the 1980s. Here’s a good place to start: [https://demoscene.assembly.org/](https://demoscene.assembly.org/)

    Mini-things are fun _and_ useful _and_ meaningful.

    My point here is that you don’t have to actually study the intricate clockwork puzzle of a miniaturized/golfed program to benefit from it. The miniature simply serves to prove that the concept _can_ fit on a business card and it _can_ fit in your head. Go ahead and find a readable version to study instead. (The miniature will likely have many things to teach, but some of them will be about how to make miniature programs.)

    ## Small languages

    Small programs are interesting. But I’m also interested in small programming languages.

    _Generally_ speaking, the smaller the language, the less expressive it is.

    One of the most well-known, least expressive languages is assembly.

    Assembly languages are _very_ syntactically and conceptually simple. There’s not much language at all: it’s mostly a rigid sequence of opcode mnemonics. Even with macros, writing in assembly is mostly about unders
