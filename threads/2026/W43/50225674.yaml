  author: norir
  text: It is straightforward to pick an isa and then design an ir that closely mirrors
    it. Codegen from the ir the original isa is dead simple. Other isas are also straightforward
    except that it may be necessary to introduce virtual registers and implement certain
    instructions as multiple instructions if there isn&#x27;t a 1:1 correspondence.<p>I
    think the op is far too pessimistic about code size and performance. TCC for example
    produces terrible machine code but I rarely see 3x size or performance diffs compared
    to clang (at least for the kinds of programs I tend to write). It is also very
    easy to find edge cases where the clang optimizer makes heinously bad decisions.
    In one trivial example, I&#x27;ve written a program that has a helper function
    with no arguments that simply prints &quot;Hello, world!&quot; and a main function
    that calls the helper 1 million times. With optimizations, the version of clang
    on my computer inlined the helper call 1 million times, which made the binary
    I believe 4-6x bigger than -O0. With -O0, I believe compilation took 6 seconds
    compared to something like 15 minutes with -O2 (tcc took maybe 250ms and produced
    a binary that I think was about 2x the size of gcc -O0). All that is to say, I
    have less faith in the quality of optimizing compilers than most.
