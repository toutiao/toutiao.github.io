  text: |-
    As you can see from the diff linked in the article (and now here), only three files needed changes:


    lib/std/zig/BuiltinFn.zig: declares the builtin (the parser picks it up automatically with no further changes).

    lib/std/zig/AstGen.zig: handles the builtin (here's where we generate the 4 that the user sees in the end).

    lib/std/zig/AstRlAnnotate.zig: I don't understand this part too well. Here we opt out of something that is relevant for other builtins but not for others.

    Interestingly, the compiler's frontend (or at least part of it) is part of the standard library. I don't know how many stages there are, and even though I did everything manually (except searching for the first file to edit), most of it is still uncharted territory for me (the compiler is big enough and the builtin handling is encapsulated). I hadn't looked at Zig's compiler before this week. I do have some background knowledge in compilers, which helped me navigate the codebase.
