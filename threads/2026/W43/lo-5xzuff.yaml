    I assume this was meant as a reply to my comment, not ~tomsmending's.
    There are multiple options here as a C developer.
    You can just assert that you're writing against POSIX, and then write source code and a build configuration which, if compiled and executed on a POSIX system, behaves as you want. Here, "the implementation" is "the implementation of a POSIX system" and it has a "system C compiler" which behaves as POSIX demands. Your program is a "POSIX + C11" program.
    But you can also cobble together your own "implementation". You pick TCC as your compiler, musl as your libc, and Linux as your kernel. There's no singular "implementation" here, there's just the components you picked. "The implementation of C" and "the implementation of the POSIX C APIs" become different, independent parts; TCC and musl+Linux respectively. In this context, we are forced to view the language extensions demanded by the POSIX C API as distinct from the implementation of the language, and it becomes possible to pick an implementation of the language which is incompatible with the POSIX C API.
    In the end I think we agree, but I might default to the "cobble together an implementation from parts" way of thinking while you may default to the "write against a POSIX implementation" way of thinking. I am happy to describe "C11 with the extensions demanded by the POSIX C API" as "POSIX + C11"
