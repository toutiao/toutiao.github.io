  text: "There are two kinds of underlined behaviour in C and C++.\nThe first is for
    things where there is not necessarily a consistent delivery possible in an efficient
    implementation. For example, consider division by zero. Different ISAs behave
    differently on division by zero. Okay, you might think, make it implementation
    defined and let implementations define it as ‘whatever the CPU does on a divide
    instruction’. That’s a nice idea except that depends on a bunch of things that
    might not be true:\n\nThe ISA spec must define it (in some ISAs, the destination
    register is define to have an unspecified value and the exact behavior varies
    depending on implementations).\nIt must be consistent and enumerable. On some
    ISAs, you may or may not get a trap depending on the state of some register. On
    UNIX-like platforms on x86 raise SIGFPE on division by zero, unless the floating-point
    environment is defined to not trap, in which case they resume execution after
    the divide with whatever value was in the target register before the instruction,
    so the defined semantics are ‘you will get a trap or an arbitrary value’.\nit
    must be consistent across lowerings. Consider autovectorisation. If you do x /
    y in a loop and the loop is vectorised. Is the behaviour consistent between a
    scalar divide and a vector divide?\n\nC++ recently introduced a concept of Erroneous
    Behaviour (EB) which says, roughly: don’t do this. If you do, you may get unspecified
    values, but the value will be stable. Not the same each time, necessarily, but
    if you use the value twice then it will be the same value. The first place this
    is used is for uninitialised variables on the stack. Consider the following:\nbool
    x;\r\nif (x) foo();\r\nif (!x) bar();\r\n\nIn C++, the read of x is now EB. The
    standard mandates that either foo or ‘bar will be called, but does not specify
    which. It must be *exactly* one of them because the first conditional read the
    variable and subsequent reads must give the same result. The *next* time that
    you reach this code and ‘x reenters scope, the other function may be called. Ideally,
    a compiler will warn about this.\nThere’s ongoing work to constrain more of this
    kind of UB in ways that doesn’t impede optimisation. Division by zero is hard
    because of the vectorisation question. If a new version of the standard gave a
    4x slowdown for performance-critical code, people would object loudly.\nThe other
    kind is more interesting. It is behaviour that should not happen but cannot be
    statically proven to not occur. The canonical example of this is use-after-free.
    Consider this contrived example:\nint increment_and_clamp(int *array, int length,
    int threshold, int *max)\r\n{\r\n  for (int i=0 ; i<length ; i++)\r\n  {\r\n    array[i]++;\r\n
    \   if (array[i] > threshold)\r\n    {\r\n        *max = std::max(*max, array[i]);\r\n
    \       array[i] = threshold\r\n    }\r\n  }\r\n  return *max;\r\n}\r\n\nA compiler
    may wish to hoist the initial load of *max out of the loop and move the final
    store to the end. This is permitted in the C++ abstract machine (and C if you
    replace std::max with a C equivalent) because nothing in this function establishes
    a happens-before edge, so the order in which these stores are visible to other
    threads is unspecified.\nNow consider that the max is a dangling pointer and accessing
    it traps. As written, this means that all of the array up to the first one above
    the threshold will be incremented and then the trap will happen. Assume this thread
    dies, other threads will see the partially incremented array. But after optimisation,
    the function will trap on entry.\nNow consider a slightly more complex transform
    that vectorises the loop. Now the trap could happen in the middle of an operation,
    interleaved between source-level loop iterations.\nThe same applies to the rule
    that says dereferencing null is undefined. If the compiler must trap on null dereferences
    at the precise place in program order that they occur, this significantly constrains
    the set of permitted optimisations. Ensuring that max is not a null or dangling
    pointer is, in the general case, not computable. It is a whole-program dataflow
    property. If this is a public function, the C/C++ compilation model ensures that
    the compiler cannot see all callers so cannot even guarantee this in some trivial
    cases unless you do whole-program LTO (and give up on shared libraries).\nThis
    is where languages like Rust are interesting. A Rust compiler can generate the
    same LLVM IR as a C compiler for an example like this. The mid-level optimisers
    can, in both cases, assume that max is a valid pointer for the duration of the
    call and perform the same transforms. The difference is that the Rust type system
    and borrow checking statically guarantee this with checks performed before generation
    of the IR (and will reject programs where this cannot be statically proven, which
    is a superset of programs where it is not true). The C compiler guarantees this
    via a mechanism known informally as ‘trust me, bro’."
