  content: "After [my post on undefined behavior in C](https://blog.habets.se/2026/05/Everything-in-C-is-undefined-behavior.html)some
    people insisted that it’s demonstrably fine, we know what the code will do, and
    at worst we’ll get a segfault.\n\nThis is false.\n\nHere’s an example.\n\n## C
    code\n\n    #include<utility>\n    \n    // Let's pretend this is a memory mapped
    device controlling\n    // motors and gears and stuff.\n    volatile int device_command
    = 0;\n    \n    void serve_hot_chocolate() {\n            device_command = 42;\n
    \   \n            // Oh no, we spilled some hot chocolate, invoking UB.\n            //\n
    \           // The definition of `std::unreachable()` is:\n            // Invokes
    undefined behavior at a given point.\n            std::unreachable();\n    }\n
    \   \n    void explode() {\n            device_command = 3;\n    }\n\n## Example
    assembly output\n\nWith GCC 16.2 with `-O1`.\n\n    \"serve_hot_chocolate()\":\n
    \           mov DWORD PTR \"device_command\"[rip], 42\n    \"explode()\":\n            mov
    DWORD PTR \"device_command\"[rip], 3\n            ret\n    \"device_command\":\n
    \           .zero 4\n\nRuh roh. Exploding chocolate! The function `explode()`
    will be executed, even though it was never called!\n\n[godbolt link](https://godbolt.org/z/Y5844eTKe)\n\n##
    Another example: dereferencing a null pointer\n\nSome people insisted that dereferencing
    a null pointer is _fine_. It’ll just try to access address zero! And these people
    supposedly know what happens when you try: if nothing is mapped there, you’ll
    get a segfault.\n\nAgain, not true.\n\nLet’s say we change `std::unreachable()`
    to `int* ptr = nullptr; *ptr = 99;` in the previous example. Now we [get this](https://godbolt.org/z/efqKrzefa):\n\n
    \   \"serve_hot_chocolate()\":\n            mov DWORD PTR \"device_command\"[rip],
    42\n            mov DWORD PTR ds:0, 0\n            ud2\n\nCurious, eh? First it
    writes zero, **not** 99, to memory address zero. Then it crashes the program using
    an invalid instruction. The number 99 never appears in the generated program.
    But the null pointer write does. Presumably the null pointer write is done in
    order to improve debugger error messages.\n\nNow let’s check [clang with godbolt](https://godbolt.org/z/86M7MWTT8):\n\n
    \   \"serve_hot_chocolate()\":\n            mov dword ptr [rip + \"device_command\"],
    42\n    \n    \"explode()\":\n            mov dword ptr [rip + \"device_command\"],
    3\n            ret\n    \n    \"device_command\":\n            .long 0\n\nAgain
    we get exploding chocolate.\n\n## Let’s do some pointer arithmetic on the null
    pointer\n\nOk, so what happens if we add `ptr += 10`. That’s UB for three reasons:\n\n1.
    using a null pointer for anything other than comparison against other pointers,\n2.
    even if an object would be valid at the null pointer (which it’s not), creating
    a pointer that points outside that object, or if an array, beyond one-past the
    array, is UB,\n3. even if that were valid (which it’s not), we then dereference
    the address.\n\nLet’s [try it](https://godbolt.org/z/8z6hPPsvG).\n\n    \"serve_hot_chocolate\":\n
    \           mov DWORD PTR \"device_command\"[rip], 42\n            mov DWORD PTR
    ds:40, 99\n            ret\n\nWow. _Now_ it did what someone naively would expect,
    taking the code at face value. Lucky.\n\nWhy did GCC (and clang, by the way) not
    detect that `*(ptr + 10) = 99` is equally UB as `*ptr = 99`, and do the same thing?\n\nWrong
    question. No compiler is obligated to “detect” UB at all. Looks to me like GCC
    and clang, if we want to anthropomorphize them, saw “oh, null pointer dereference?
    Well that can’t happen, so I’ll stop emitting instructions for this function,
    to save on the binary size”. Because of the [halting problem](https://en.wikipedia.org/wiki/Halting_problem),
    it cannot in the general case know if the code will ever be executed.\n\n## So
    what does UB do?\n\nAnything. I have now demonstrated three things UB can do,
    when UB was triggered in the same place:\n\n1. Run whatever happens to be next
    in memory (exploding chocolate).\n2. Store a (for all intents and purposes) _random_
    value at address zero (wrote zero, not 99), and then deliberately crash.\n3. Do
    what one would naively expect: write the value to the address seen in the code
    at face value.\n\nAnd to think that some people don’t believe in [nasal demons](https://en.wikipedia.org/wiki/Undefined_behavior).\n\ndisqus
    has started showing ads. :-(\n\nShowing (probably incomplete) comments in a static
    read-only view. Click button to be able to leave comments."
