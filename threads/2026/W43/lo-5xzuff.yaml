  text: |-
    Clang at -O0 doesn't do SSA construction at all, for example, which means that every temporary variable ends up being a stack spill.

    LLVM IR is an SSA-based IR, so "doesn't do SSA construction" is a confusing way of putting it. Indeed, Clang doesn't run mem2reg at -O0 so local variables won't be register allocated, but the Clang front-end converts expression temporaries to SSA values during lowering rather than relying on mem2reg. So the "which means" conclusion part of this isn't true: https://clang.godbolt.org/z/qaMjjdjnr. As you can see there are no spills during the deep expression evaluation, just the redundant loads of n.
    I agree with the broader claim that -O0 in practice isn't fully in the spirit of "only do what I say, plus obvious stuff" even if it's partway there. Aside from register allocation for local variables, there's at least a few other problems. E.g. whether a given strength reduction still happens at -O0 depends on which specific passes are responsible, which is an untenable mental model for the C programmer, and it can change at a whim as compiler passes are refactored.
