    I think it comments like yours and posts like this contribute to an extremely negative sentiment around the state of undefined behaviour in languages like C and C++.

    And I think that’s a reasonable reaction. Even the C committee is at last working to eliminate as much undefined behaviour from the standard as possible, because everyone agrees the current situation is intolerable.

    undefined behaviour arises as an emergent property across multiple (desirable, reasonably optimisations,)

    No, that’s backwards. UB was introduced to cope with corners of the spec which were too difficult to pin down, because of divergent hardware behaviour, or because someone might want to enter a program on punched cards, or because it’s just too hard to determine what havoc a wild pointer might cause, etc. It wasn’t until years later that compilers started exploiting UB to make optimizations that would be unsound according to the original intended purpose of UB. UB is part of the language specification, not a result of compiler optimizations.

    What do I do in the next (… maybe the last? … hopefully the last?) hundred thousand lines of C that I write?

    Study Annex J, crank up the warnings, write thorough tests, use sanitizers, use static analysis.
