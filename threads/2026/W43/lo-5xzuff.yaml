    If it's genuinely the case that the compiler folks have just gone mad

    They haven't gone mad, it goes something like

    Does the syntax allow a programmer to express <edge case>? Yes.
    Does the language define the semantics of that <edge case>? No.
    Ok, assume it never happens and any occurance is programmer error. "You shouldn't do that" is sometimes a fine answer to "what if I do this"

    Now optimizations combine in spooky and unpredictable ways sometimes. Like a particular rewrite of an IR may open up new opportunities for inlining or constant folding, and now a handful of very sane optimizations look like the compiler devs went crazy "exploiting" UB. Making decisions assuming the absence of behavior is something we do all the time.

    naïvely trapping on any undefined behaviour (e.g., via mechanisms like Fil-C) seem to be attracting attention

    The problem is that this is equivalent to removing optimizations and increasing complexity in the design. You need to detect the presence of something that by definition has no presence in correct programs then emit instructions for it that are carried through optimization passes, linking, and loading.
    Where I think the gap lies is that UB is supposed to be things that are so unreasonable in correct programs that no compiler could reasonably define a check for it. But C is filled with UB that's easy to detect and reject, which is why the language is moving to define previously undefined behavior (usually as compile errors).
