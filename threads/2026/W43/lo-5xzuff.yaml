    So nobody should program for POSIX in C then?

    What?

    I can't use dlopen() because it mandates that a void * can store a function pointer?

    You're right, much like signed integer overflow, it often works. It's also not correct C.

    I can't use memset() on a structure with pointer fields and assume they're now NULL?

    You can, that's what Implementation Defined behavior is for.

    To a point, yes, those violate the C standard, but if I'm targeting POSIX, I have less UB do worry about than pure C (not much, but some).

    This is literally my point. You can't say "I am targeting POSIX and therefore what the standard says is not relevant". If C says X is UB, it is UB. Being able to get away with it does not make it non-UB, and it does not make your code correct.
    For many many years people relied on null dereferences as having safe termination semantics, and then compilers said "well that's UB" and suddenly all that incorrect code became insecure incorrect code.
    If your code relies on UB, your code is wrong according to the standard. If a compiler chooses to, that incorrect code can become a symptomatic bug in future.
    Getting away with UB today does not change anything.
    Let's look at your first point: void* cannot hold a function pointer, that's UB. Code that stores a function pointer in a void* is wrong. What it should be is implementation defined behavior, but like so many examples of implementation defined behavior in C and C++, it is labeled as UB.
    If you want to store function pointers in a void*, and have your code be correct, you need the C committee to make it implementation defined behavior. Or you can join the linux kernel and acknowledge that standard C cannot be used for systems programming due to it incorrectly labeling implementation defined behavior as UB.
    Anyway, my point is simple: UB does not enable different platform behaviors, it mean any code relying on that implementation defined behavior is wrong, even when a platform does define the behavior.
