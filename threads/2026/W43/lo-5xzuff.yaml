    It does not matter what your implementation, platform, or hardware do. If the behavior is UB according to the language, the compiler can do anything, or nothing, or different things in different places.

    This is incorrect.  The compiler can do anything and still be standards-compliant.  The creators of the C standard never meant for the standard to be all-encompassing, it was intentionally a limited standard.  A compiler that does stupid shit is still a shitty compiler, even if it is formally standards-compliant.   Standards-compliant ≠ good.  Standards-compliant ≠ fit-for-purpose.
    And they actually put language in the standard that does put limits on the behavior of the compiler when encountering UB, by giving a range of options.  None of the options in that range is "do anything at all", nor does interpolating between the options in that range get you to "do anything at all".
    That language still is in the standard and was initially binding.  It was later voted to be non-binding,   presumably by people who wanted to use UB for optimization and therefore traded sanity for marginal gains in their benchmarks.
