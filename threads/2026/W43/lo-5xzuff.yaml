  text: |-
    UB is part of the language specification, not a result of compiler optimizations.

    UB in the language is what allows the compiler to do some optimizations. At it's core, it's primarily an assumption about semantics;

    "This doesnt alias - so I can cache the read across these writes"
    "This doesnt escape this range - so i can omit the checks/branches verifying such"
    "This doesnt overflow - so i can distribute terms or do inductive reasoning to amortize expensive ops"
    This wont change under me & doesnt need to be immediately visible - so I can reorder these reads/writes to more optimal points, merge them together into bigger ops, or eliminate them entirely"

    It's pretty pervasive to many optimizations. The other end of the spectrum would be if everything was a side effect and the compiler could keep zero assumptions after every op.
