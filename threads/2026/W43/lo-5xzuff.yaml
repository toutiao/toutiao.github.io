    Sure, if you write an actual std::unreachable() at a point in code that is quite clearly actually reachable, or take a literal null pointer and dereference it, the compiler may generate code that has what could be seen as pretty whack behaviour (and even that is happening less as there's been more focus from the compiler engineers on avoiding it - witness the output of the GCC compiler that is referenced in the actual post). But coders generally don't do these things, because they don't make sense in the first place. I'm not saying these sort of thing absolutely never happen, but using them as examples of how UB can "always" have unpredictable results seems off.
    (As an aside, the existence of std::unreachable() is designed to make it easier for the compiler to optimise safely, i.e. it can emit trapping instructions such as ud2 in cases where it sees definite UB on some path, and omit those traps when the code has been marked as expectedly unreachable via std::unreachable(). I.e. there's a reasonable alternative for the compiler to optimise other than by relying on the mere presence of UB to identify paths that won't actually execute. For this reason, programmers need to be especially careful when using std::unreachable(); get it wrong and there really are no compiler-provided safety nets, unlike some other forms of UB where there may be. And already it should be clear that the linked post is vastly oversimplifying things).
    Anything involving pointers is pretty prone to horrible consequences if there's UB - while a null pointer dereference typically does manifest in an immediate crash, things like buffer overrun and use-after-free can be much more subtle and much more insidious. This isn't news. It also applies mostly to a very limited subset of causes of UB. Throwing all UB in the same bucket is really misleading, at best. You'll occasionally see people (in reference to just how bad UB is) remark that even just having a missing newline at the end of a source file is UB. They always neglect to mention that it never, ever, actually causes the compiler to do anything significantly different than if the newline was present (beyond perhaps emitting a warning).
    I also strongly suspect that the vast majority (I'm saying "vast majority", not all*) of actual runtime UB occurrences that don't involve dereference of invalid pointers are either harmless in effect or at least do exactly what you would expect (eg integer overflow typically wraps if that's what happens on the underlying architecture). The post is needlessly sensationalist, as was the preceding one.
    *: notable exceptions include two classics, "the compiler ate my overflow check" and "I logged the value of an uninitialised variable but nothing happened" - even the latter one should cease to be an issue going forward with language changes that have been coming down the pipeline
