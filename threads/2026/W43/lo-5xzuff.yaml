    UB is part of the language specification, not a result of compiler optimizations.

    What is considered undefined behaviour is part of the language specification, sure. There is, after all, the old joke about the SIMPLE programming language.
    However, it is not the presence of undefined behaviour that is of concern but the byzantine behaviour that arises as its consequence.
    I believe the argument made in the comments I cited is that the undesirable behaviour is an unavoidable result of desirable optimisations. Somewhat similarly, we might argue that “undefined behavior in programmer-visible abstractions represents an aggressive and dangerous tradeoff: it sacrifices program correctness in favor of performance and compiler simplicity. On the other hand, UB at lower levels of the system, such as machine code or a compiler IR, is an internal design choice that needn’t have any effect on the programmer-facing parts of the system”.

    Even the C committee is at last working to eliminate as much undefined behaviour from the standard as possible, because everyone agrees the current situation is intolerable.


    Study Annex J, crank up the warnings, write thorough tests, use sanitizers, use static analysis.

    I think this is why, as an alternative to just crying one's self to sleep every night, naïvely trapping on any undefined behaviour (e.g., via mechanisms like Fil-C) seem to be attracting attention, even in the absence of the C committee taking any action.
