    You cannot write code that depends on UB.
    There are also standards, such as POSIX, that themselves define some things which standard C leaves undefined.
    And that does not matter.
    I C says an API is UB if used in a specific way, it does not matter what the API implementation does or says. If the C standard says that is UB, it puts no requirements on the compiler.
    There is no difference between using an API that posix says is defined but C says is not vs dividing by zero, or overflowing an integer.
    If you write C code that depends on implementation defined behavior (POSIX), but C says is UB, your C code is wrong.
    The fact that you can get away with it today, doesn't magically make your code correct. It does not mean that it will work if you change header orders, or inlining changes, or anything else.
    If your code invokes UB according to the language, you are not writing conforming C. Maybe your compiler allows it (for example -fwrapv, -ftrapv, -fno-delete-null-pointer-checks, etc) but that is no longer conforming C, and your program is wrong vs the standard: any other C compiler is free to assume your UB code does not occur, or is unreachable, etc.
