    They're technically correct in the most annoying way. It's not up to the API, you can't just cast from an object pointer to a function pointer "because the API I'm using requires me to do so"; it's up to the implementation. But the POSIX API is so privileged that any implementation which intends for you to write against POSIX, defines casting between object pointer and function pointer.
    Now this doesn't necessarily mean that "if you're targeting POSIX you're fine". I could write a new, standards compliant C compiler tomorrow which doesn't guarantee anything about what happens when you cast between object pointer and function pointer. Or I could write a compiler which detects it and aborts the process when you do that. You could still import the musl header files on my implementation and use the POSIX dynamic linker API, and your program would crash when you cast from the void * returned by dlsym to a function pointer.
    But you're using the POSIX API through gcc, clang, MSVC, TCC, Fil-C or some other implementation that's made with the intention to support the POSIX API. So you're fine. All implementations you could ever conceivably want to use with POSIX in practice will define that behavior even though ISO declares it undefined.

    As for using memset() on a struct with pointers: this is an issue of IB rather than UB. Your implementation has to define a bit pattern for the null pointer, per the standard. By doing memset(&foo, 0, sizeof(foo)) and then checking pointers in foo against NULL (or the null pointer constant 0), you risk[1] invoking UB on implementations which define the null pointer's bit pattern to be something other than all 0s. This isn't a concern if you don't care about extremely niche implementations. On GCC, Clang, MSVC, TCC, Fil-C and all other "normal" C compilers, the null pointer is defined to have an all zero bit pattern, so you never invoke UB.
    [1] I should explain what I mean by "risk" here. I was thinking about stuff like, if (mystruct.someptr != 0) { x = *mystruct.someptr; }. If you have initialized mystruct to the all-zero bit pattern with memset, and your implementation's null pointer bit pattern is something else, (mystruct.someptr != 0) will be true because mystruct.someptr is zero and 0 is non-zero in this context (it's the null pointer constant, not the integer 0). Your code's assumption that your all-zero pointer compares equal to 0 would be the bug, but the UB doesn't happen until the dereference in x = *mystruct.someptr.
    NULL is just a macro which expands to either 0 or ((void *)0).
