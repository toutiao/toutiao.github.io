    I don't get this response?
    My entire point is that UB is not about supporting different platforms, that "implementation defined behavior" is a term that exists in both the C and C++ standards specifically to say "this operation has defined behavior, and the implementation (compiler, platform, etc) defines that behavior".
    The big problem is when people apply "UB is for cross platform support", and then treat UB operations as being ok because they know the platform that they are targeting. Which it isn't.
    If you want to make a difference, write proposals to WG16(C) and/or WG21(C++), to make platform defined operations be specified as having defined behavior (defined, implementation defined, unspecified, erroneous) rather than being UB.
