  author: Vaushite
  text: Don&#x27;t dwell on the weight of obsolete history, it&#x27;ll only prevent
    you moving forward. Modern displays are better for <i>most</i> purposes.<p>It&#x27;s
    fine to mourn physical movie media, or vector displays, or PEEK&#x2F;POKE, because
    those had good sides, but CRTs in general-purpose raster use have absolutely no
    advantages. They don&#x27;t need to be controversial like social media or AI.<p>It&#x27;s
    fine to preserve some in a living or dead museum too.<p>By the way HDMI or DP
    protocol is not crazy to implement on an FPGA. It&#x27;s a very similar idea just
    with bit-serial digital streams instead of analog. Many FPGAs contain SERDES I&#x2F;O
    blocks that can take a 24-bit medium-speed digital signal very similar to the
    one you feed to your VGA DAC, and convert it to a high-speed bit-serial differential
    form for transmission to the display.
