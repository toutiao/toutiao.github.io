    then use inputs to move the chess piece around. We also used the ARM processor
    onboard the Cyclone FPGA to run Linux where we wrote a program in C to send board
    positions to that chessboard logic circuit.<p>It was kinda hard and I struggled
    a bit but got it working in the end.
