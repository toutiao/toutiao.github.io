  author: Vaushite
  text: I did a LabVIEW project to run on an FPGA in a college extracurricular. LabVIEW
    is capable of taking your serial CPU code and cross-compiling it for FPGA but
    I wrote mine in actual FPGA style with everything being parallel and impressed
    everyone with the compile&#x2F;synthesis speed (still 5 minutes instead of 30
    minutes) and low area use. Also people thought it was impressive I could control
    our SPI peripherals with only two virtual toggle switches... their learned helplessness
    I suppose, it&#x27;s a dead simple protocol.<p>Writing code in everything-parallel
    style takes a different mindset but you can certainly get used to it. Do not fall
    victim to the trap of learned helplessness. If you can make something in Logisim-NG
    then you can program an FPGA.<p>Unfortunately the standard languages for FPGA
    are ones derived from simulators that run sequentially on CPUs, so for the most
    part people are writing sequential imperative code and the  compilers are pattern-matching
    for things that can run in parallel. That&#x27;s why writing VHDL or Verilog is
    universally a fairly miserable experience. To make it work, you have to think
    backwards from the compiler - think of the circuit you want to implement, then
    how to template-expand it into code the compiler can pattern-match.
