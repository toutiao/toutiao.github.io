  author: LoganDark
  text: You seem to be arguing that the one socially acceptable way to do something
    is not constant, rather than that moral imperatives truly do change. The reason
    there are still so many competing philosophies from hundreds or thousands of years
    ago is because they all more or less make their own kinds of good points to different
    people or in different situations. That largely doesn&#x27;t change over time.<p>One
    example is the trolley problem and its variations. There&#x27;s no one correct
    answer. There are people who believe that interacting with the switch would make
    you responsible, and there are people who believe that not interacting with the
    switch when you had the chance would make you responsible. There are other beliefs
    too, but my point is there&#x27;s no one single way to view it.<p>I tend to have
    a variety of views in general about all things, in part due to being multiple
    entities (see profile) but also depending on circumstances, rather than sticking
    to any one philosophy.
