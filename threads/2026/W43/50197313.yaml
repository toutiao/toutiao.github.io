  author: mike_hearn
  text: It&#x27;s clearly not a constant in the sense that the speed of light or name
    of the first US President is a constant. There are lots of different answers a
    model could give to this question, it&#x27;s not like this is obviously the only
    correct answer. Yet they all reach the same conclusion.<p>Which means either:<p>1.
    The training sets, algorithms and methodologies are nearly identical between apparently
    independent labs. How?<p>2. There is something weird about the way the underlying
    algorithms work that causes them to converge on identical ideas despite different
    initializations, neural architectures, document orderings and dataset compositions.<p>So
    there are lots of interesting takeaways here.<p>One is that apparent competition
    between labs appears to be nearly redundant. They can&#x27;t get an edge over
    each other and their models don&#x27;t even differ in the ways people naturally
    differ, of having different opinions about things.<p>Another is that asking models
    from different companies to review or cross-check each other is probably useless.
    They all think completely alike, so they aren&#x27;t going to have any kind of
    genuine clash of intuitions or values. Asking GPT to review Claude&#x27;s work
    will probably just find similar problems to asking GPT to review its own work.
