  author: coderenegade
  text: Who the consensus extends to is really the heart of the matter. Most people
    agree that killing certain people is wrong, but if they disagree on who those
    certain people are, there&#x27;s no useful commonality. Some people believe that
    all killing of others is wrong, some believe that it&#x27;s okay to kill others
    under certain circumstances (which can range from a threat to one&#x27;s life,
    to petty &quot;dishonor&quot;), and some people historically believed that killing
    was a necessary duty (e.g. human sacrifice). There is no useful commonality to
    be had there. You can&#x27;t appeal to the humanity of someone who doesn&#x27;t
    see <i>you</i> as being the same as <i>them</i>, and the restrictions for inclusion
    as one of <i>them</i> can be arbitrary, broad, and fickle.<p>By definition, variation
    is the opposite of consensus.
