    of you in the Andes, or in California. The apple falls the same in both places,
    but the guinea pig doesn&#x27;t taste the same in both places.<p>There is no &quot;ethics
    as the ethicometer measures it&quot;. Just &quot;ethics as the society around
    you recognises it&quot;."
