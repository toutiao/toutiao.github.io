  text: 'Slaves were a solution to two problems: 1) the lack of industrial automation;
    2) winning wars being better served by enslavement than death.<p>Humans are a
    territorial kind of ape that is always pushing to expand, principally for security
    and then for prosperity. The industrial revolution enabled such expansion to most
    efficiently without enslavement. Nothing, morally, changed. No one has ever really
    thought such expansion morally good -- only that it is better that we survive&#x2F;prosper
    than die off. And in the end, our shared prosperity usually leads -- when taken
    to the fullest extent -- in a general empire of prosperity for all. Dominion,
    in the end, aims towards to more prosperity for more people.<p>As for ritual human
    sacrifice -- we still engage in such behaviours, which are in general called &quot;scapegoating&quot;.
    Now located on social media. These behaviours allow for group cohesion by purging
    dissenters from the group, related again to our nature above.<p>For western culture,
    the ritual physical sacrifice of human life roughly ended in the days of the OT.
    But it continued across the world up until <i>today</i>, where there are still
    societies with large populations engaged in it. Principally where there is an
    undeveloped justice system.<p>It&#x27;s doubtful many think ritual human sacrifice,
    of any kind, is moral. Rather they think it necessary for group cohesion -- and
    better our group is cohesive, dominate, and then prosper.<p>The material logic
    of prosperity and security is domination, and insofar as material circumstances
    require violent domination, so they require it. And require it they often do.'
