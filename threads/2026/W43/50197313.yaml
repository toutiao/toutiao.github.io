  text: Can&#x27;t say I agree with this, considering <i>lex talionis</i>[1] is still
    the primary directive of most legal systems when it comes to criminal law, as
    well as basically all military operations (<i>jus in bello</i>, <i>jus ad bellum</i>,
    etc.). The principle of proportionality (&quot;an eye for an eye&quot;) also is
