  author: modeless
  text: If you look at what they actually demonstrate, zero-shot embodiment generalization
    is limited to controlling two-finger grippers on two stationary arms. The embodiments
    are all very similar, and when they&#x27;re slightly different (even just replacing
    two fingers with five fingers) they can&#x27;t do zero-shot anymore. But there&#x27;s
    no real reason to do zero-shot embodiment generalization in practice, as it&#x27;s
    trivial to collect a small amount of data on a new embodiment to get significantly
    improved performance. Zero-shot embodiment generalization, especially in such
    a narrow domain of similar configurations, is not an important problem to solve
    and doesn&#x27;t necessarily indicate progress on the important problems.<p>Zero-shot
    task generalization is more interesting, but has been demonstrated by many other
    companies at this point, so it&#x27;s not new. And it only becomes useful with
    high success rates on long-duration tasks, so demonstrating short zero-shot tasks
    with low success rates in toy environments is uninteresting.<p>What&#x27;s hard
    and still unsolved in general-purpose robotics is doing real useful tasks end-to-end
    in real uncontrolled environments with high reliability. I guess there&#x27;s
    just a lack of understanding generally about what&#x27;s actually hard and useful
    in robotics.
  score: 0
