    word.  In Canada the Liberal party is a fiscally centrist&#x2F;corporate &amp;
    socially liberal(ish) (aka it&#x27;s similar to the traditional British definition
    of Liberal).  The Conservatives are a large right wing reactionary block that
    seems to be perpetually in the minority but with a large loyal voting block while
    the actual opposition mostly comes from three parties that rotate in and out of
    relevance as a left-wing voice BQ (Bloq-quebecois), NDP (New Democratic Party
    - fading since the death of Jack Layton), and the Greens (Environmental sorta,
    but also weirdly anti-science sometimes).  And that&#x27;s on the national level
    - at the provincial level it gets even weirder with the BCLiberals (recently named
    BCUP) being socially and fiscally conservative and opposed by the BC NDP and other
    minor parties.<p>Liberal doesn&#x27;t mean the same as it does in the US because
    it barely has a consistent meaning up here.
