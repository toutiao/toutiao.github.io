  author: mesrik
  text: "I&#x27;ve had since Debian 8 (2015) few helper scripts to make me remember
    better how to manage approved CA&#x27;s. There are three of those, which have
    been working all Debian versions since 8 to current 13.<p># cat &#x2F;usr&#x2F;local&#x2F;sbin&#x2F;ca-certificates-list-active<p><pre><code>
    \ #!&#x2F;usr&#x2F;bin&#x2F;env bash\n  #\n  # BFMI tool to list Debian CA certificates
    active  - mesrik, 2015\n  #\n  \n  CA_CONFIG=&#x2F;etc&#x2F;ca-certificates.conf\n
    \ CA_REPO_DEBIAN=&#x2F;usr&#x2F;share&#x2F;ca-certificates\n  \n  if [ -f $CA_CONFIG
    ]; then\n      # study any ca-certificates which have been configured active\n
    \     for i in $(egrep -v &#x27;^[#!]&#x27; &#x2F;etc&#x2F;ca-certificates.conf)
    ; do\n         cert_source=$(dirname $i)\n         cert_file=$(basename $i)\n
    \        openssl x509 -in $CA_REPO_DEBIAN&#x2F;$cert_source&#x2F;$cert_file -noout
    -subject |\\\n           sed &#x27;s&#x2F;^subject=&#x2F;&#x2F;&#x27;\n      done\n
    \ \n  else\n      echo &quot;$(basename $0): Ooops, was not able to access $CA_CONFIG&quot;\n
    \ fi\n  \n  # eof\n  </code></pre>\n# cat &#x2F;usr&#x2F;local&#x2F;sbin&#x2F;ca-certificates-reconfigure<p><pre><code>
    \ #!&#x2F;usr&#x2F;bin&#x2F;env bash\n  LANG=C dpkg-reconfigure ca-certificates\n</code></pre>\n#
    cat &#x2F;usr&#x2F;local&#x2F;sbin&#x2F;ca-certificates-invalidate-all<p><pre><code>
    \ #!&#x2F;usr&#x2F;bin&#x2F;env bash\n  #\n  # BFMI tool to invalidate all CA
    certificates in Debian Jessie - mesrik, 2015\n  #\n  \n  CA_CONFIG=&#x2F;etc&#x2F;ca-certificates.conf\n
    \ prog=$(basename $0)\n  usage=&quot;Usage: $prog  { -commit }&quot;\n  \n  if
    [ $# -lt 1 ]; then\n      echo $usage\n      exit 1\n  fi\n  \n  if [ &quot;$1&quot;
    = &quot;-commit&quot; ]; then\n      if [ -f $CA_CONFIG ]; then\n         backup_ext=$(date
    -r $CA_CONFIG +&quot;.%FT%T%z&quot;)\n         perl -wpi$backup_ext -e &#x27;s&#x2F;^([^!#].*)$&#x2F;!$1&#x2F;;&#x27;
    $CA_CONFIG\n         if [ $? -eq 0 ]; then\n            echo &quot;$prog: backup
    $CA_CONFIG$backup_ext was made.&quot;\n            &#x2F;usr&#x2F;sbin&#x2F;update-ca-certificates\n
    \        fi\n      else\n         echo &quot;$prog: Ooops, was not able to access
    $CA_CONFIG&quot;\n      fi\n  else\n      echo &quot;$prog: Need -commit to actually
    invalidate all CA&#x27;s&quot;\n  fi\n  \n  # eof\n\n</code></pre>\nps.  I did
    bit of editing, I didn&#x27;t expect Tab to be ignored when pasting here."
