  author: sspiff
  text: That&#x27;s not the case, Go uses the system store with an additional revoke&#x2F;deny
    list in crypto&#x2F;x509 because it allows updating a deployed application on
    an out of date or slow moving platform or OS.<p>This CVE is literally just &quot;versions
    of the Go deny list don&#x27;t contain the eMuhdra revokation yet&quot;. Older
    versions of Go will still deny certs signed through the compromised certificate
    if the system store already has the update.<p>It&#x27;s an or situation, not and.
  score: 0
  posted_at: '2026-10-22T10:43:13Z'
