  author: colinmarc
  text: 'TL;DR:<p>The very urgent uv&#x2F;certifi&#x2F;etc releases (and yet-to-be-done
    bun release) are about removing the compromised CAs as described here:<p><a href="https:&#x2F;&#x2F;emudhra.we-have-a-problem.com&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;emudhra.we-have-a-problem.com&#x2F;</a><p>In
    other words, that software bundled the compromised certs into the binary, so upgrading
    it is the only way to remove them.<p>This is about Go proactively blocking intermediates.
    Which shouldn&#x27;t strictly be necessary as long as your OS has removed or distrusted
    the CAs (on my laptop, macOS has done that, although it seems like it did so in
    a way not all tools have access to; for example, rustls-platform-verifier respects
    it, but rustls-webpki still loads the bad CAs from the system trust store).<p>edit:
    forgot I can&#x27;t use code blocks on HN'
