  text: "&gt; <i>Go uses the system store with an additional revoke&#x2F;deny list
    in crypto&#x2F;x509 because it allows updating a deployed application on an out
    of date or slow moving platform or OS.</i><p>Reminder: Neither the CVE nor the
    linked go alert seem to say that you have to recompile and redeploy your application
    with the new go version in order to take advantage of this change. Just updating
    the tool chain and go stdlib isn&#x27;t enough, because this stuff gets baked
    into the resultant binary. This is unlike, say, python, Ruby, or java where updating
    the runtime <i>may be</i> sufficient, depending on your development and deployment
    model."
