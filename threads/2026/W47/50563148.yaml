article:
  url: https://www.anthropic.com/research/claude-black-hole-physics
  title: Claude Fable 5.2 solves two open problems in the physics of black holes \
    Anthropic
  fetch_status: success
  content: "### \n\n> _Claude has solved two open problems in theoretical physics.
    Both concern black holes and the search for a theory of quantum gravity. In the
    first, it completed a calculation that physicists set up more than 20 years ago,
    but which had never been solved. Claude’s result showed that a sudden transition
    associated with the formation of black holes persists even where spacetime no
    longer has a definite shape. In the second, Claude found the exact limit of the
    simplest version of a technique used to test candidate theories of quantum gravity.
    This post explains both findings, first in plain terms and then in more technical
    detail. The preprints are available [here](https://hexagonmath.org/2611.00175v1)
    and [here](https://hexagonmath.org/2611.00174v1)._\n\n## Introduction\n\nModern
    physics rests on two frameworks: general relativity and quantum mechanics. General
    relativity describes very large things, like stars; quantum mechanics describes
    very small things, such as atoms. Both are astonishingly good at predicting how
    the universe behaves, but they’re mathematically incompatible. Finding a theory
    that unites them—“quantum gravity”—is one of the field’s biggest goals. Black
    holes are a natural testing ground, because they’re one of the few areas where
    both relativity and quantum mechanics matter—they pack immense mass into a very
    small space.\n\nOne of the most useful tools for studying quantum gravity is called
    _holographic duality_. The real universe has three dimensions of space and one
    of time, which relativity combines into four-dimensional spacetime. But physicists
    studying quantum gravity often work with simpler model universes that they can
    understand in more detail.\n\nThe basic idea of holographic duality is that some
    of these theoretical universes can be described in two ways: as a complete universe
    with gravity and spacetime, and in quantum terms, with no gravity at all, “written”
    on the universe’s outer boundary. Just as a real hologram encodes a 3D image on
    a 2D plane, the quantum model encodes all the information of the universe in one
    dimension fewer (a universe with four dimensions of space, for instance, can be
    fully described by a quantum theory with three). This lets physicists turn hard
    questions about gravity into questions about quantum physics, which are sometimes
    easier to answer.\n\n[The first problem](https://hexagonmath.org/2611.00175v1)
    Claude solved concerns what happens when you heat up one of these theoretical
    universes. At low temperatures, the universe fills up with a gas of particles.
    Above a certain temperature, a black hole forms instead. In 1983, Stephen Hawking
    and Don Page showed that this switch is abrupt: it’s a phase transition, similar
    to how water suddenly boils at 100°C. But Hawking and Page’s calculation relies
    on general relativity, which holds only when the universe is vast, compared with
    the tiny scale at which that description breaks down. As the theoretical universe
    shrinks toward that smaller scale, spacetime loses any definite shape and becomes
    blurry, and nobody knows how to do the calculation on the gravity side of the
    duality. On the quantum side, though, the same situation can be calculated, at
    least in principle.\n\nIn 1999, physicists found that there was a phase transition
    in that regime as well. But they didn’t know whether it was abrupt, like Hawking
    and Page’s, or smooth. In 2003, a group of physicists [set out the calculation
    that would settle the question](https://arxiv.org/abs/hep-th/0310285), but it
    was extremely complex and was never completed. Claude did it by running a small
    research group of copies of itself, in which it worked out almost every piece
    of the calculation independently and checked its math against known results. It
    showed that the phase transition _is_ abrupt. The same sudden switch appears at
    both extremes, suggesting that black hole formation isn’t just a feature of relativity
    but is actually built into the underlying quantum theory.\n\n[The second problem](https://hexagonmath.org/2611.00174v1)
    concerns a simplified theoretical universe with two dimensions of space instead
    of three. This universe is straightforward enough to study in detail, but still
    has black holes and other mysteries similar to those of our own universe. Even
    in this simpler universe, physicists don’t know how to create a full theory of
    quantum gravity, so they approach it from the other direction: rather than building
    a single, correct theory, they try to rule out wrong ones by showing that they
    are internally inconsistent. This method is called _bootstrapping_.\n\nSince 2009,
    physicists have used a version of this method to set a ceiling on how heavy the
    lightest black hole in such a universe could be. Any theory that breaks the ceiling
    is ruled out, and each lowering of the ceiling narrows the search. Results from
    numerical calculations hinted at where the best possible ceiling lay, but they
    couldn’t prove it, and the best proven ceiling was well short of what the numerical
    results suggested.\n\nClaude Fable 5.2 noticed a pattern in the numerical results
    that physicists had missed and borrowed a method from elsewhere in math and physics
    to calculate the precise ceiling for the simplest version of this technique and
    prove that it could not be lowered. It doesn’t identify the correct theory, but
    it may point physicists in the right direction.\n\nNeither result describes our
    own universe directly, and neither has practical applications, but both contribute
    to a long-running theoretical effort to understand how quantum mechanics and relativity
    fit together.\n\nIn the rest of this post, we explain in more detail what each
    problem was and what Claude did to solve them.\n\n## A note about Claude’s methods\n\nIn
    August, an Anthropic researcher, Hongbin Chen, was testing Claude’s capabilities
    as a side project. He asked Claude to draw up a list of interesting open problems
    in theoretical physics, specifically focusing on black holes and the bootstrap
    method. Claude came back hours later with 22 candidates, and Hongbin set up separate
    agents to work on each one; they could read each other’s progress posts and collaborate
    when working on related problems. The agents ran in the background, with no special
    setup, for about six weeks.\n\nThe agents solved the two problems in this post.
    One was the Hawking-Page phase transition, the question of when a hot gas turns
    into a black hole. Weeks after one of the agents reached a solution, a physicist,
    who had independently used Claude to tackle the same problem, shared his result,
    and a colleague realized that Hongbin’s agent had reached the same answer earlier.
    The two solutions used different methods, so they were a useful check on each
