article:
  url: https://www.anthropic.com/research/claude-black-hole-physics
  title: Claude Fable 5.2 solves two open problems in the physics of black holes \
    Anthropic
  fetch_status: success
  content: "### \n\n> _Claude has solved two open problems in theoretical physics.
    Both concern black holes and the search for a theory of quantum gravity. In the
    first, it completed a calculation that physicists set up more than 20 years ago,
    but which had never been solved. Claude’s result showed that a sudden transition
    associated with the formation of black holes persists even where spacetime no
    longer has a definite shape. In the second, Claude found the exact limit of the
    simplest version of a technique used to test candidate theories of quantum gravity.
    This post explains both findings, first in plain terms and then in more technical
    detail. The preprints are available [here](https://hexagonmath.org/2611.00175v1)
    and [here](https://hexagonmath.org/2611.00174v1)._\n\n## Introduction\n\nModern
    physics rests on two frameworks: general relativity and quantum mechanics. General
    relativity describes very large things, like stars; quantum mechanics describes
    very small things, such as atoms. Both are astonishingly good at predicting how
    the universe behaves, but they’re mathematically incompatible. Finding a theory
    that unites them—“quantum gravity”—is one of the field’s biggest goals. Black
    holes are a natural testing ground, because they’re one of the few areas where
    both relativity and quantum mechanics matter—they pack immense mass into a very
    small space.\n\nOne of the most useful tools for studying quantum gravity is called
    _holographic duality_. The real universe has three dimensions of space and one
    of time, which relativity combines into four-dimensional spacetime. But physicists
    studying quantum gravity often work with simpler model universes that they can
    understand in more detail.\n\nThe basic idea of holographic duality is that some
    of these theoretical universes can be described in two ways: as a complete universe
    with gravity and spacetime, and in quantum terms, with no gravity at all, “written”
    on the universe’s outer boundary. Just as a real hologram encodes a 3D image on
    a 2D plane, the quantum model encodes all the information of the universe in one
