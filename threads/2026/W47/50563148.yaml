  author: throwaway81523
  text: Trouble is you can declare things to be true that are strictly speaking mathematically
    false, and from there get to proving any falsehood.<p>The Dirac delta function
    is a famous example of something mathematically non-rigorous at its inception,
    and mathematicians objected to it, but a few decades later Laurent Schwartz developed
    generalized function theory, that made it work.<p>Or going even further back,
    calculus was done in terms of ratios of infinitesimals (like dy&#x2F;dx) or infinite
    sums of them (integrals).  A century or two later the formulas of calculus were
    proven rigorously through classical analysis (delta-epsilon proofs) but that lost
    sight of the original motivations.  A century or two after THAT, nonstandard analysis
    made a rigorous theory of infinitesimals, but reliant on relatively high powered
    mathematical logic that didn&#x27;t exist til the 1950s or so.<p>Right now I think
    quantum field theory (renormalization, path integrals etc.) have been put on a
    sound mathematical basis but physicists mostly don&#x27;t care.  And very recently,
    an AI proved something about Yang-Mills theory that helped rigorize part of the
    Standard Model of particle physics.  I don&#x27;t understand that last part at
    all.<p>Besides physics, a lot of the procedures of machine learning and AI are
    mathematically suspicious but people use it anyway because it empirically works.  People
    in the field have told me that yeah, they expect mathematicians will someday get
    around to backing it up, but for now, practitioners are moving forward with what
    they have.
