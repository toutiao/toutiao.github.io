  author: libertine
  text: I tie this with collectibles market, where people want to compress the experience
    of decades into waves of months. It&#x27;s completely fake.<p>People used to play
    and had fun with their toys, a small fraction took better care because there was
    something about it that was worth treasuring - not because they could resell it
    in the future, but because of what it represented, usually a memory.<p>That&#x27;s
    where scarcity of collectibles used to come from.<p>Most people had to be lucky
    to have something in a special occasion.<p>Now people turned this upsidedown and
    they&#x27;re not even having memories with their toys, and companies are feeding
    into this.<p>Or they buy stuff to keep it boxed in, we&#x27;re talking about toys.
    I used to save the boxes of the toys I cherished the most, but I played the hell
    out of them.<p>Now it&#x27;s gambling, or artificial scarcity, or what ever this
    is that&#x27;s completely hollow. There&#x27;s no moment attached to it.<p>I really
    struggle to understand this behavior, I mean, I get it but I don&#x27;t understand
    how people play into it without feeling something is off.
