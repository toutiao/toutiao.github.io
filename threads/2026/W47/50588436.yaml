  text: I find it extremely bizarre for adults to be doing this. The sysops guy in
    a state of arrested development who has a bunch of action figures on his desk
    - and at work! - or the woman of a certain age whose house is full of plush toys
    and Precious Moments angels who overuses diminutive nouns, to give two stock examples.
    (I would add the phenomenon of going on walks with dogs in strollers as a third.)<p>It&#x27;s
    very concerning when this behavior becomes widespread enough to become profitable.  At
    some point, we made not becoming a mature adult acceptable. We don&#x27;t even
    have a clear and accurate picture of what that even means. Everything is culturally
    relative and arbitrary, or worse, childishness is celebrated. And then there are
    the political implications. It&#x27;s not difficult to imagine out how children
    might would vote compared to adults.<p>Perhaps this suits the oligarchic class
