  text: 'Any activity is an adult activity if you do it when you&#x27;re an adult.
    I bought myself a new-release BigTrak when I saw one for sale, after growing up
    reading about them and wanting one. It was janky out of the box and so it&#x27;s
    currently half-disassembled waiting for me to upgrade it with a proper mind (when
    I have time <i>sigh</i>). I have more Lego than ever before (most of it built
    with my kids). I&#x27;ve rebuilt a 1997 5hp Johnford Bridgeport-style milling
    machine, stripping it to bare metal and re-assembling including fabricating the
    missing&#x2F;broken parts. The first thing I machined with it, from a slice of
    hinge pin from a hydraulic boom, was a fly cutter, because of course. And of course
    because I&#x27;m a lost cause, I immediately pulled it apart again for a CNC conversion.
    I bought an &quot;unrepairable&quot; 15hp screw air compressor (I&#x27;ve always
    loved how screw compressors work) and fixed it (some domestic sparky had tried
    to diagnose the control panel) and now it makes me unreasonably happy every time
    it fires up. I don&#x27;t know how &#x27;grown up&#x27; any of these things really
    are (and most are a tangent to my IRL minmaxing critical path)  but I reckon most
    are definitely &#x27;adult&#x27;.<p>Edit: Also I dunno where this sits on your
