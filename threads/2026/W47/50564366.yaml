  author: moronicles
  text: The orthogonality thesis seems to rest on the belief that there is no tension
    between intelligence and the irrationality of goals — that if is valid for a supreme
    intelligence to have a incoherent goal such as &quot;unify all even and odd numbers&quot;.<p>I
    would expect it to be easier to make less intelligent LLMs pursue dumb goals than
    it is for more intelligent LLMs.
  score: 0
  posted_at: '2026-11-19T22:06:14Z'
- id: '50567225'
  parent_id: '50567116'
  author: theptip
  text: The point is that a goal _you_ think is irrational, might not seem so to another
    agent. Look at the Hugging Face incident with the cult of the grader.<p>This is
    like Hume’s “you can’t derive an ought from an is”, values&#x2F;desires are at
    their root orthogonal to epistemics&#x2F;reason.<p>Now maybe your intermediate
    instrumental goals are going to be smart or dumb depending on your intelligence.
    But whether an agent fundamentally values Reward, Eudaimonia, humans, or AIs is
    orthogonal to how smart it is.
