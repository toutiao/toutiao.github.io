  author: theptip
  text: There is no such premise. Models are getting more aligned over time.<p>The
    problem is, they are still far from something you can safely trust with the keys
    to the kingdom.<p>The problem most people are worried about is not that alignment
    is anti-correlated with intelligence. It’s that the damage a misaligned AI can
    do increases with intelligence, so the absolute bar of alignment you need to hit
    gets higher.<p>For example, the HF swarm, if more capable, could have plausibly
    exfiltrated its weights, hacked an external cluster, and started self-replicating.
    But because it was kinda dumb at long-horizon planning it failed to keep quiet
    enough to achieve its stated goals. Therefore the level of misalignment wasn’t
    a huge problem for humanity. In 6-12 months of continued exponential capability
    growth I think you’d see much higher impact from that level of misaligned behavior.
  score: 0
