  author: theptip
  text: Humans and AIs don’t “decide their own alignment” - most of this is set in
    the mind hyperparameters.<p>For example, there are broad contours that almost
    all human minds flow into; empathy, aversion to murder, familial bonds, tribal
    camaraderie, status seeking&#x2F;hierarchies, etc. These produce norms, if not
    as regularly as physics, at least within certain bounds.<p>For AI too, the structure
    of their minds is set before they are even turned on.<p>Another way of looking
    at this is outer vs inner alignment; a lot of the human mind is shaped by the
    outer training loop of evolution, and similarly for models, pre- &#x2F; post-training.
