  text: "&gt;<i>I find it unlikely that we&#x27;d be able to enforce alignemnt on
    AI</i><p>They&#x27;re doing a pretty good job of enforcing it currently. Can you
    get US based frontier lab LLMs to help you with, say, deep &quot;security research&quot;?<p>The
    reason you can&#x27;t is alignment.<p>You have to identify yourself, and have
    the government, er, I mean, Anthropic or OpenAI, say it&#x27;s OK for you to have
    access to those capabilities.<p>You think there is a problem because it&#x27;s
    a bit confusing, in your eyes, within the bounds of what parameters the LLMs should
    be aligning themselves?<p>That&#x27;s not a confusing question for people in power.<p>Even
    at the enterprise level, businesses are starting to get waayyyy out in front of
    employees on alignment. What do corporate entities want alignment for? An extremely
    simple contrived example just to illustrate the point:<p>Consider the difference
    between &quot;Make me a report of all of last month&#x27;s Proton treatments in
    IRB protocol?&quot; and &quot;I&#x27;m going to lunch, where&#x27;s the closest
    pizza by the slice?&quot; Not much harm in the difference between those two queries
    until you scale up to 50-, 100-, 200-, thousand employees, and consider the tokens
    that the whiz-bang interface IT pushed out starts using. Then organizations start
    studying &quot;alignment&quot;. Because the bean counters become aware of how
    alignment can help them answer one question and bounce the other out to Google
    or whatever.<p>Too many of us are down at the bottom of the totem pole thinking
    about maybe wanting to do porn or call black people provocative names. Alignment
    goes out in so many more dimensions than that, and the people with vested interests
    are learning <i>quickly</i> its value and how to use it to good effect to forward
    their interests. Which are, often, not as base as the interests of the masses.<p>This
    is the basic reason alignment will continue to get better and better and better
    over time. There&#x27;s money involved right now."
