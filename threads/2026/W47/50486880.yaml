  author: regentbowerbird
  text: Old-fashioned glasses have thick walls and&#x2F;or fat bottoms because that
    is the style for them. &quot;Cut glass&quot; decoration requires some thickness.<p>Norlan
    is double-walled in order to keep let the drinker sip their whisky without it
    warming up. A lot of people drink their whisky cold, both because it softens the
    attack and also because it changes the taste a bit, and whisky drinking is all
    about drinking the same thing over and over again and discovering new things each
    time.<p>As a side note Norlan glasses are borosilicate and therefore perfectly
    appropriate for hot beverages. I suspect they might actually be some of the best
    tea tasting glasses available although I haven&#x27;t tried it out yet.
