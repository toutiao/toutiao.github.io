  author: beloch
  text: 'I have three recommendations:<p>1. Do what makes you happy.<p>2. Don&#x27;t
    make other people feel bad for not being as discerning&#x2F;picky as you about
    something.<p>3. Becoming more discerning about something may make you happy at
    times, but it may also cost you money and turn a simple pleasure into an unsatisfying
    pursuit.  Choose your obsessions carefully!  You <i>can</i> choose not to care.<p>You
    probably have friends who, by your standards, are shamefully oblivious to the
    quality of fruit they eat.  If they&#x27;re happy don&#x27;t spoil it for them.<p>The
    stuff aficionados do does tend to make a difference up to a point.  It&#x27;s
    not <i>all</i> BS.  However, there is typically a diminishing returns curve.  Often,
    there is also some self-deception or outright snake-oil further up the curve.<p>The
    only argument I&#x27;d make for getting picky about whisky is that you can enjoy
    the equivalent of a shot for an hour or more.  Not as pretense.  I mean <i>genuinely</i>
    enjoying the smell of it for that long and slowly sipping it.  It&#x27;s a way
    to drink without drinking much.  My experience is that glasses do make a difference,
    but only if you like whisky on its own (or with a few drops of water) at room
    temperature.  If you prefer cocktails or whisky on the rocks, whisky-specific
    glasses are probably something you don&#x27;t need to worry about.<p>Remember
    recommendations #1 and #3 before you go any further!  If you&#x27;re happy, <i>stay</i>
    happy!  It&#x27;s okay to choose not to care about whisky. If you can choose not
    to drink alcohol at all you&#x27;re probably better off.'
