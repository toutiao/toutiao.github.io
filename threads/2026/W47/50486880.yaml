  author: mickeyp
  text: 'Serious whisky collector (and drinker) here...<p>You don&#x27;t need a fancy
    glass. Your sense of smell makes a huge difference when it comes to food and drink,
    as anybody with a nasty cold can tell you. You want something that keeps it from
    diffusing into the air so anything with a wide mouth makes it harder to appreciate.<p>So:
    a cognac snifter; sherry glass; a glencairn, which was &quot;&quot;made for whisky&quot;&quot;;
    etc.<p>But of course it&#x27;s down to taste.<p>If the aroma is too heady? Blow
    air into glass and then inhale the aroma. The burn is gone (important if you&#x27;re
    drinking 62% rocket fuel single cask whisky) and you get a more dilute smell.<p>No
    need for all this pretension; this glass is that.'
