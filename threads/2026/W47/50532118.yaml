  author: thephyber
  text: I would argue the snapshot of 2025 CWE rankings isn&#x27;t super helpful to
    resolve the argument here. It is an objective ranking, but it&#x27;s missing a
    lot of context of how an OOB write  is observed, reported and fixed.<p>If an OOB
    write happens, it is likely to be investigated and solved quickly because the
    most likely symptoms are going to be memory corruption or a crash. These are super
    high impact symptoms.<p>If an XSS or SQLi is present, there is not necessarily
    any symptom until some security researcher probes the code.<p>The dichotomy allows
    for vastly more memory corruption issues to both be created and found+fixed early
    before there is a CVE reported for that product.<p>What most people are missing
    here is that the article didn&#x27;t need to restrict the memory corruption &quot;to
    the internet&quot;. If you include all of the embedded devices that are not internet
    enabled and that run on C code, it&#x27;s much more likely to be a true statement.<p>Also,
    the pedantry in this thread is boring. If people actually bothered to understand
    the intent of what was being written rather than the imperfect communication,
    this thread wouldn&#x27;t need to exist.
