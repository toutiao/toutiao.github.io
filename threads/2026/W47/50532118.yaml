  author: tptacek
  text: 'It&#x27;s just a category error comparison. SQLI is a web pest vulnerability†;
    memory corruption RCE is a vulnerability research vulnerability. They&#x27;re
    different disciplines. Web SQLI vulnerabilities are usually application-code-specific
    (not just &quot;application specific&quot;, but with a specific origin in a mistake
    made in application code). Big ticket vulnerability research publications are
    generally platform vulnerabilities; one specific coding mistake impacting thousands
    or millions of installs.<p>It&#x27;s very weird to look at a memory corruption
    RCE and say SQLI is &quot;more common&quot;. On <i>typical</i> web targets, memory
    corruption RCE is basically unheard of (and SQLI is not the most common sev:hi
    vulnerability; SSRF probably outranks it).<p>These are just vulnerability researchers
    talking like vulnerability researchers.<p>Here&#x27;s another way to put it: well
    over 90% of all vulnerabilities with a market value are rooted in memory corruption.<p>†
    <i>There are, of course, platform-level SQLI vulnerabilities; they&#x27;re just
    quite rare.</i>'
