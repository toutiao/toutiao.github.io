  text: |-
    If panic="abort" causes anything other than an increase in the rate of denied requests corresponding to the intervals when your service manager is restarting the service, your program has much deeper issues.



    panic="abort" is the gentlest, tamest version of a problem a responsible developer/architect is already supposed to be accounting for.

    I'm not a Rust developer other than doing some variation of Hello World every 6 months, but am I understanding correctly that panic="abort" means that the catch_unwind machinery never fires?

    Heck, catch_unwind was only added in Rust 1.9 as an adapter for exposing C functions without needing to spin up an internal thread to synthesize a catch_unwind primitive. Versions 1.0 through 1.8 evolved on the idea that unwinding should always kill the thread it occurs in.

    That makes me think that there's an issue here beyond "the backend application crashes and needs to be restarted": this makes it sound as if there is some code that relies on panic/catch_unwind as an internal mechanism, and the "service manager restarting the service" thing solves the fact that the application crashed, but it doesn't solve the fact that the endpoint that called the code that relies on panic/catch_unwind as a control flow mechanism is going to deterministically crash the application every time it's called... so it's not just "restart the service" it's also "this url will always cause the application to crash" and "you can't call that url anymore and get a 200, ever"
