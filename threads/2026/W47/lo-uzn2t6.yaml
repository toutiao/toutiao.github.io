  text: |-
    I agree with the post.
    If you don't trust yourself that you won't have non-unwind-safe code in the critical section - I have bad news for you: unwind safety affects everything outside of critical sections too. In Rust everything can panic, and mutable state can also be external (files, sockets, databases). The classic problem of a counter drifting typically happens with Atomic that can't track poisoning.
    These problems aren't limited to panics either. It's super easy to make a bug like:
    *locked_state += bad;
    op()?;
    *locked_state -= bad;

    and leave a bad state due to an early return from ?. It's the same bug as an early return due to a panic, but in that case poisoning doesn't trigger!
    Poisoning is an incomplete solution to an imprecise assumption about a potential problem. It's the fallacy of "we need something, this is something, therefore we need this".
    The real solution is to hunt down the non-transactional state that needs being restored and use drop guards (now in std). This has to be done everywhere, so poisoning won't save you.
    In my experience, poisoning is just an outage amplifier for servers. It doesn't prevent errors, it only escalates panics that would be rare and affect only one bad request into a permanent failure that breaks all requests. And if that particular lock isn't checked by your healthcheck, you now have a serious problem. lock().unwrap() is a domino of poison. Do lock().unwrap_or_else(|_| abort()) to at least avoid leaving a server running that panics on every request.
