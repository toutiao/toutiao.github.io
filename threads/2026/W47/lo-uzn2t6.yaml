  text: |-
    I think there are realistically only 3 types of non-trivial rust programs:

    panic=abort
    programs that carefully join every single thread/task and check for panics
    programs with bugs on panic

    Type 1 obviously prefers nonpoison.
    Type 2 is the only case where poisoning might be good. But realistically, if a program goes to great lengths to handle panics, it probably don’t want to panic on poisoned mutexes. That kind of hardening is all about using drop guards / RAII to ensure everything stays consistent, especially in async programs where cancel safety matters even more than panic safety.
    Type 3 programs have already made the “uptime is more important than correctness” choice. I doubt removing poisoning from type 3 programs would meaningfully increase exposure to bugs for most programs. I also don’t see why Mutex should be a special case that narrowly acts like panic=abort. If you really care about correctness over uptime as a default, you don’t actually want poison Mutex, you want uncaught panics to abort.
