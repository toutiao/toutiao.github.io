    I would never change such a setting globally.

    It can only be changed globally. It's a build-time setting controlled exclusively by the top-level of the dependency tree.
    Heck, while things like catch_unwind will compile either way, some of the APIs are #[cfg(panic = "unwind")] and will fail at compile time if a transitive dependency tries to use them in a panic="abort" build.
    Beyond that, as ghoti pointed out, Rust actively encourages treating panics as uncatchable. Heck, catch_unwind was only added in Rust 1.9 as an adapter for exposing C functions without needing to spin up an internal thread to synthesize a catch_unwind primitive. Versions 1.0 through 1.8 evolved on the idea that unwinding should always kill the thread it occurs in.
    (I catch them at the "unit of work" boundary in batch jobs, but that's purely a workaround for not having a stable way to audit my transitive dependencies for reachable panics because I don't trust my dependencies. Heck, at one point, I had to mix image 0.24 and 0.25 in the same codebase because I had a dependency that required 0.25 but the new zune-jpeg was panicking on some of the JPEGs I needed to batch-process, so I'd use image 0.24 to load the images, then flip the data over to an image 0.25 object before processing. A perfect example of why I don't trust dependencies to judge whether "can never happen" can be triggered by untrusted inputs and sanely choose between Result<T, E> and panic!.)

    Other than in extremely controlled environment, changing such a setting globally is just too dangerous.

    Do you have a contract with all your service providers that they'll be responsible for any and all liability if they can't prevent a tornado, earthquake, fire, flood, or other act of god from interrupting program operation?
    If panic="abort" causes anything other than an increase in the rate of denied requests corresponding to the intervals when your service manager is restarting the service, your program has much deeper issues.
    More mundanely, panic="abort" should be handled by whatever measures you have in place for people tripping over cords, kernel panics, OOM kills, power interruption in the presence of dead UPS/laptop batteries, etc.
