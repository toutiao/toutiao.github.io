    Is it such a big deal to use another Mutex from a library?

    I think it is. The lowest friction, syntax- or stdlib-supported way to do a thing ought to be the right way to do that thing, and in every case where it's the wrong way and conventional wisdom is to abandon the straightforward solution and do some less obvious thing makes the language worse.
    Rust is a great language overall, and is my go-to language. But the fact that conventional wisdom is "don't use the standard mutex, use parking_lot, because the stdlib's mutex isn't very good" makes the language worse than it would otherwise have been. Just like C++ is made worse by the fact that conventional wisdom is, "std::unordered_map isn't a very good hash map, you should use one from a library".
    (Note: I don't mind mutex poisoning, and I even think calling .lock() on a mutex which was locked by a thread that's since paniced should also panic. I don't like how we have to call .lock().unwrap() all the time; the panic already happened, the place to handle it would've been to use panic::catch_unwind. But the particulars of this specific discussion isn't the point.)
