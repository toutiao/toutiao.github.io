  author: dns_snek
  text: "&gt; And why would that be different than, say, asserting &quot;You can&#x27;t
    have debian&#x2F;Linux exposed to the internet&quot;<p>I would assert that if
    you exposed any services directly to the internet without a justifiable reason.
    I don&#x27;t think exposing a NAS management interface to the public internet
    is justifiable.<p>Most non-security&#x2F;networking appliances don&#x27;t take
    security seriously enough to even contemplate it.<p>Most NAS protocols and their
    implementations have an awful track record and assume to be operating on a secure
    local network, e.g. SMB and NFS.<p>My rule is that appliances should never be
    accessible from untrusted networks and regular server systems (e.g. debian) only
    expose the minimum set of services that must be publicly accessible, like a public
    website.<p>Everything else, all management web uis and other non-public services
    are only accessible via Wireguard or mTLS as a fallback option when supported
    by client software."
