    also means that on a kernel so old you don&#x27;t have the networking performance
    improvements and features of the last 10 years.<p>They&#x27;re using a btrfs version
    they forked 10 years ago that they&#x27;re maintaining out of tree, that also
    doesn&#x27;t have any of the new features, and that&#x27;s not compatible with
    recent btrfs versions. On top of that, they self built a super messy ACL system
    that&#x27;s using a vmtouch version also from 10 years ago.<p>They always have
    super outdated libraries. They&#x27;ve been using PHP7.4 (EOLed 4 years ago) until
    past winter, and PHP8.1 until this summer.<p>I take a look to the running daemons
