  author: Scottn1
  text: I set up two Synology for someone who needed to backup files. One unit at
    his office and one at home. He does 90% of his work at the office, but wants to
    be able to access them at home or weekends if needed. He works with very large
    video files and a cloud cost per month for 8-10tb and growing wasn&#x27;t in his
    budget (couldn&#x27;t afford it).<p>Synology was a perfect solution. Low-cost
    unit, stick a 15gb drive in it and do again for second unit. DSM is a breeze to
    work with and the built in rsync was pretty easy to setup and has been working
    seamlessly for a year now.<p>Just free willy opening ports and sticking a default
    setup NAS to the internet, I agree, is asking to be hacked. Tailscale was my preferred
    way to get them connected but there is no Tailscale Synology client, and if I
    remember, would required hacks to get one on it and working. Use long passwords
    for the user is first start. Then on both use the security settings to only accept
    the ONE IP from each other, even though only one of them is actually exposed to
    the internet. Also select the settings to install any security updates automatically.
    Logs show this has all been working good to protect the units. The only catch
    so far is the IP of his house changed once in the year, being it isn&#x27;t static,
    but simply changing it on the sending unit to new one fixed it in about 3 minutes.<p>I&#x27;m
    thinking of replicating this setup for myself to backup all PC&#x27;s and phones
    in my household and syncing to another unit I set up at my relative&#x27;s house
    in another state while I visit over the holidays. It pays for itself in short
    time compared to a cloud provider.<p>I&#x27;m curious now after this CVE how long
    it will take the units to auto update to newest version after it becomes available
    to manually install.
