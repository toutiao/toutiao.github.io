  author: Liuser
  text: Yes, this I absolutely agree that JWT is simpler to work with by virtue of
    remaining on http layer 7 and parsing claims out of JSON compared to working with
    extracting identity and other embeddings from x509 and lifting this out from the
    TLS layer.  OIDC exceptionally so as it’s purposely designed with passing identities
    as its sole purpose.<p>I just take issue (maybe pedantically so or I admittedly
    misunderstood the GPs original point) with blanket statements that no one uses
    mTLS for just authn but for authz also so that makes it a bad tool.  There is
    no authz and that should be completely apparent after first authentication and
    logically raise to the developer with next steps to extract the identity.  We’re
    disagreeing on the basis that a human’s incorrect conflation that it does provide
    authz should&#x2F;shouldn’t be attributed to mTLS.
