  author: catlifeonmars
  text: The tooling ecosystem around it matters, the language documentation around
    it matters. It’s rarer to see documented examples of mTLS where the identity is
    then accessed and (for example) checked against a users db. It’s even rarer to
    see examples of (e.g transporting signed claims about a user via mTLS cert).<p>Let’s
    use JWT OIDC token as another example of a technology used to provide authn. The
    JWT has standard structure for sending authenticated claims about a user (such
    as subject ID, email, email verification state, scopes) that can subsequently
    be used by an authz layer after authn is completed. My point isn’t that OIDC is
    better than mTLS, but that the design makes it clear to handoff to the authorization
    layer so there is less ambiguity about what to do after authn.
  score: 0
