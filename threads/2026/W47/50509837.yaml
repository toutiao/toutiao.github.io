  author: motoroco
  text: yeah, basemaps are small enough to store and host cost effectively, but high
    res satellite imagery gets big and expensive fast as you go up in zoom level.
    I built my own satellite mosaic of North America for my app so I can offer users
    offline access to the tiles and had to stop at z17 because of projected storage
    requirements. high res global coverage can get you into the hundreds of TB range
    which is no longer in the &quot;stick it on r2 and serve it with a worker&quot;
    or &quot;download and upload the entire dataset sequentially over your residential
    internet&quot; territory<p>the fun&#x2F;hard parts of the project weren&#x27;t
    really scale dependent, although downloading source imagery and building the tile
    pyramids did take literally weeks to run. actually, the hardest part was getting
    demosaicing right, e.g. making the quilt seamless. filtering out cloudy and smokey&#x2F;hazy
    tiles while picking alternatives from the same time of year so groundcover &amp;
    crops are in a consistent growth stage so you don&#x27;t end up with checkerboard
    patterns or cloud silhouettes randomly across your map. and there were other problems
    that came up more or less just because of how &amp; when the satellite took the
    images that require exposure correction and more filtering<p>I also have a pelias
    index with 170M records for search and self-host valhalla for routing. the open
    source mapping ecosystem has really impressed me the more I learn with each project
  score: 0
