  text: 'OpenFreeMap is a similar project:<p><a href="https:&#x2F;&#x2F;openfreemap.org&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;openfreemap.org&#x2F;</a><p>&gt; <i>What is OpenFreeMap?</i><p>&gt;
    OpenFreeMap lets you display custom maps on your website and apps for free.<p>&gt;
    Using our public instance is completely free: there are no limits on the number
    of map views or requests. There’s no registration, no user database, no API keys,
    and no cookies. We aim to cover the running costs of our public instance through
    donations.<p>&gt; <i>What is the tech stack?</i><p>&gt; There is no tile server
    running; only nginx serving a Btrfs image with 300 million hard-linked files.
    This was my idea; I haven’t read about anyone else doing this in production, but
    it works really well.'
