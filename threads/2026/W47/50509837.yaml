  author: twelvechairs
  text: Yes and no. Agree openfreemap and protomaps have complexity in their tile
    building systems which they have to build and maintain, but dont think the postgis
    approach has difficulty serving them at all - its pretty trivial and low code
    even if a few systems.<p>I just think the postgis approach works better at both
    ends of the scale. For large users its a mature, well maintained (by others) and
    heavily optimised (again by others) system. For small users the benefit of not
    having to worry about rebuilding individual tiles especially when data updates
    is a no brainer.<p>Openfreemap probably has the use case where its pretty close
    to comparable (set up for osm data so global, large data, very clear use case
    and feature set to design for, you can update via cadence, enough of a user base
    to support development, the sell of it all being &quot;one package&quot; is positive
    for some users, etc.). Whenever i see protomaps, versatiles, tilemaker, maptiler
    etc. Ive never seen a major use case I can buy into them for.
