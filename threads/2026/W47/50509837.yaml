  author: perrygeo
  text: You can use the pmtiles:&#x2F;&#x2F; protocol in Maplibre GL, requires protomaps.js
    and a few lines of setup [1]<p>My experience with it is ... ok. It works. But
    going directly to cloud storage (s3 in my case) is unpredictable latency and neither
    the browser nor most servers really cache HTTP range requests granularly, so every
    tile is another high-latency round trip. Not worth it - I ended up putting Martin
    tile server in front of it.<p>I assume someone could write a protomaps adapter
    in WASM with some smart caching? Until then, Standard GET requests are just easier
    to cache and perform much better in practice. The downside being you have to run
    a server or statically generate files.<p>[1]- <a href="https:&#x2F;&#x2F;docs.protomaps.com&#x2F;pmtiles&#x2F;maplibre"
    rel="nofollow">https:&#x2F;&#x2F;docs.protomaps.com&#x2F;pmtiles&#x2F;maplibre</a>
