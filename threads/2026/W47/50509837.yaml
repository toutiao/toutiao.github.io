  author: cldellow
  text: Two small uses:<p>1. The app is a remix app, workers do server-side rendering,
    so that a vanilla `curl` shows the actual payload, not just a script tag that
    loads the app.<p>2. I&#x27;m a great big nerd, so I recently added the ability
    to post reviews&#x2F;photos&#x2F;GPX traces to your AT protocol PDS. The app has
    a Worker cron job that subscribes to Bluesky&#x27;s Jetstream for events in its
    namespace, and indexes these into D1 in order to answer certain API calls like
    &quot;get traces in this area&quot; or &quot;get reviews for this hike&quot;.
    So the app itself isn&#x27;t the primary source of truth, a person&#x27;s PDS
    (which they control) is. The app just maintains a cache&#x2F;index that can be
    rebuilt.
  score: 0
