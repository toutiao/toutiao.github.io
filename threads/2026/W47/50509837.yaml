article:
  url: https://bruceroettgers.eu/blog/protomaps/
  title: 'Protomaps: Self-hosting map tiles has gotten cheap and easy — Bruce Röttgers'
  fetch_status: success
  content: "[blog](/blog/)//[dev](/blog/tags/dev/)//[projects](/blog/tags/projects/)\n\n#
    Protomaps: Self-hosting map tiles has gotten cheap and easy\n\nPMTiles is a tile
    format which works via HTTP Range requests and can be deployed as a single file
    to a storage bucket.\n\n//4 min read\n\n//contents\n1. [1Getting some Maps](#getting-some-maps)\n2.
    [2Deploying to Bunny.net](#deploying-to-bunnynet)\n3. [3Embedding the Map](#embedding-the-map)\n4.
    [·Notes](#notes)\n\nI came across Protomaps in research for my latest project,
    [Mapboard](https://mapboard.bruceroettgers.eu). For most non-commercial projects,
    commercial APIs become prohibitively expensive if you ever go viral (Mapbox, for
    instance, charges [$5 per 1k map loads](https://www.mapbox.com/pricing) once you’ve
    exhausted the free tier).\n\nPMTiles, part of the [Protomaps](https://protomaps.com/)
    ecosystem, is a tile format that ships in a single file, accessible via Range
    requests, and is thus extremely portable and easy to deploy. For CDNs that support
    caching Range requests of large files, it requires no effort besides down- and
    uploading it to storage. For others, like Cloudflare, you can [utilize an edge
    function](https://docs.protomaps.com/deploy/cloudflare) to translate between the
    traditional x/y/z URL path and Range requests.\n\n## Getting some Maps\n\nIf all
    you want is the world map, getting it is as simple as going to the [build page](https://maps.protomaps.com/builds/)
    and downloading the latest daily build.\n\nHowever, more fun can be had with the
    [CLI](https://github.com/protomaps/go-pmtiles). For example, you can [extract
    data](https://docs.protomaps.com/guide/getting-started#_3-extract-any-area) for
    only a bounding box or specific zoom levels, to get a significantly smaller file.\n\n##
    Deploying to Bunny.net\n\nOne great CDN for deploying this is [Bunny.net](https://bunny.net?ref=9o9z1a5ws8)
    _(affiliate link)_. They support HTTP Range requests, don’t collect personal data
    by default, are headquartered in the EU, and offer low-cost access to a global
    network of CDN and edge storage servers.\n\n[Pricing](https://bunny.net/pricing/)
    varies based on region and replication factor of the edge storage. But generally
    you pay $0.01/GB ($0.005/GB on the smaller Volume network) for bandwidth to Europe
    and North America, and $0.01/GB/month (no replication) to $0.055/GB/month (maximum
    replication) for storage. A high degree of replication mostly matters for latency
    in case of a cache miss (as the data is further replicated when it’s cached at
    the CDN PoPs).\n\nIn practical terms, storing the 139GB world map with replication
    to most continents (5x) will run you about $5/month in storage fees. Loading a
    map of Europe on a laptop and zooming in on a city causes about 5MB of data to
    be transmitted, which would be $0.00005 — further navigations and reloads will
    be less expensive as more of the map gets cached locally. At $0.05/1k map loads
    that could be 100x cheaper than Mapbox. However, the actual bandwidth of course
    varies (less for people that bounce immediately, possibly tens of MB for heavy
    users). For Mapbox you only pay a flat fee per visit.\n\n### Uploading the file\n\nIt’s
    a good idea to create a storage zone with S3 compatibility enabled, as uploading
    via the HTTP API timed out after 15 minutes for me.\n\nThen, with [rclone](https://rclone.org/)
    installed, you can download and stream the file to the Bunny storage zone. Preferably
    in [tmux](https://en.wikipedia.org/wiki/Tmux) or from a temporary VPS, if your
    connection isn’t great.\n\n    rclone config create bunnycdn s3 \\\n      provider=Other
    \\\n      access_key_id=\"<zone-name>\" \\\n      secret_access_key=\"<storage-key>\"
    \\\n      endpoint=\"https://<primary-region>-s3.storage.bunnycdn.com\"\n    \n
    \   rclone copyurl \"<build-url>\" \"bunnycdn:<zone-name>/<filename>.pmtiles\"
    \\\n      --s3-chunk-size 256M \\\n      --progress\n\n### Configuring the pull
    zone\n\nTheoretically, at this point you just need to create a pull zone, select
    the storage zone as an origin, and you’re done. Practically, it would be sensible
    to change some settings.\n\nAllowed CORS origins can be configured under Security
    \\> General \\> Allowed referrers, so that other websites cannot embed your tiles.\n\nYou’ll
    also want to verify under Caching that “Optimize for large object delivery” is
    enabled, as this makes it possible to cache Range requests.\n\nYou might also
    want to dissuade people from downloading the whole file and leaving you with a
    large CDN bill. The most practical way I’ve found for this is limiting the download
    speed to 10kB/s after 10MB transmitted in a single request (using the “Download
    speed limits” and “Limit after” settings under “Network limits”). Regular usage
    should never reach this amount. You may further want to introduce a requests/second
    limit (do note that legitimate usage can also quickly reach high numbers here)
    or a monthly bandwidth limit for the pull zone.\n\n## Embedding the Map\n\nWith
    the tiles deployed, the only thing left to do is to embed them in your website
    via MapLibre GL, for example. To do this, you’ll need to install the `pmtiles`
    npm package and add the protocol and a style to MapLibre as detailed in the [official
    installation guide](https://docs.protomaps.com/pmtiles/maplibre).\n\nCongratulations,
    you now host your own cost-effective and highly available map of the world!\n\n//notes
    (2)\n1. Basically, Excalidraw but on a map for travel planning. Launch post coming
    soon. [↑](#user-content-fnref-1)\n\n2. The last octet of IP addresses is dropped.
    If you transmit personal data via the CDN, that is of course still processed.
    [↑](#user-content-fnref-2)"
