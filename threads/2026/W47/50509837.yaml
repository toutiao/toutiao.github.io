  author: jillesvangurp
  text: I was playing with their elevation data last week. Maptiler provides elevation
    data as well but it gets expensive quickly with them. We managed to blow through
    our 50$ limit in two days with them just testing this out. So, we tried out Mapterhorn.<p>I
    really like their data set. For self hosting, vector map tiles are  small enough
    that storing it in a bucket won&#x27;t break the bank. I think you need somewhere
    around 100-150GB or so for protomaps. A few dollars per month goes a long way.
    However Mapterhorn&#x27;s elevation data set is something like 11 TB or so. That&#x27;s
    going to cost some money to store somewhere. Satellite imagery is similarly expensive
    to host. And you typically want both.<p>There is of course an asymmetric relation
    with what you store and what you serve. Ideally, you store data for the whole
    planet. But you probably are only going to serve a tiny portion of it. This favors
    hosted setups where you pay for what you use via a CDN and share the storage with
    others. A shared service also relieves you from the burden of having to keep that
    data up to date. The main issue with that is commercial map services tend to overcharge
    for more intensive usage to the point where self hosting actually becomes attractive
    despite this.<p>The main issue is that the number of requests really goes through
    the roof if you start getting tiles beyond certain zoom levels, which pushes you
    into the expensive price tiers. With most providers you pay per request and you
    can easily generate hundreds of thousands of requests just panning around at low
    altitude over a map, which means you download lots of small tiles. That&#x27;s
    how we hit the Maptiler limits. They have high resolution elevation data and exploring
    the Alps is a lot of fun. We hit 800K requests per day without any real users
    using our system even. This was just us playing with the data. We switched to
    Mapterhorn and cap the zoom level at zl-12 for now. Since it&#x27;s a free service
    I want to be a bit mindful of not hammering their service.<p>I&#x27;d be interested
    in reasonable commercial solutions that won&#x27;t cost me 300+$ per month that
    would allow me to remove zoom level limitations. At those price levels, self hosting
    becomes a possibility of course. Which suggests to me that somebody should be
    able to undercut that price and still make a decent profit.
  score: 0
  posted_at: '2026-11-16T09:25:01Z'
