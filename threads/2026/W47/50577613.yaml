  author: proberts
  text: In my firm, the O-1 approval rate hasn&#x27;t changed - it&#x27;s still very
    high - although the RFE rate has gone up.  The change that has occurred has occurred
    at the Consulate level.  This means that even if USCIS has approved an O-1 petition,
    the Consulate might still push back at the visa application stage and this pushback
    has become much more common. So it&#x27;s critical to be well-prepared for the
    visa application interview since this step isn&#x27;t a formality.
  score: 0
  posted_at: '2026-11-20T17:12:13Z'
