  text: It is certainly possible. I built a highly optimized KV store, originally
    designed to add tags (key-value pairs) for the object store I invented a few years
    ago. This tagging system turned out to resemble a columnar store database, so
    I started using it to create relational tables.<p>As predicted, it was very good
    at performing analytic operations; but it also was very fast at traditional OLTP
    operations too. I benchmarked a large number of queries against other databases
    and in the majority of cases, it was actually faster. In some cases it was much
    faster. It was able to do all this using just one copy of the data without needing
    to create and maintain separate indexes.<p>There are several short demo videos
    on my YouTube channel (listed in my profile).
