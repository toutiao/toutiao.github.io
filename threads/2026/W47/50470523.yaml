  author: OskarS
  text: 'One thing to add is that databases tend to take it further using compression.
    For instance, if you have a column that is all either A or B, you can use run-length
    encoding (&quot;the next thousand entries are B&quot;). Or you can do delta encoding:
    if you have some very large number that takes a lot of bits to store, but the
    deltas between them are quite small, you can save a lot of disk space and I&#x2F;O
    by just storing the deltas.<p>You can also combine these two: if you have a numeric
    id that increases by 1 every row, you can delta-encode that to just get a massive
    list of 1&#x27;s, which you can then run-length encode to just be &quot;the delta
    for the next million rows is 1&quot;, saving huge amounts of space.<p>You generally
    don&#x27;t do this with AOS&#x2F;SOA, because you do want to be able to random-access
    your entries (&quot;index&quot; them, in database terms) and I&#x2F;O performance
    is much less important. Databases have this issue too, which is why indexes tend
    to either not be available or much slower in column-oriented DBs.<p>EDIT: ah,
    read the original commenter a bit too quickly, missed that they mentioned run-length
    encoding. Apologies.'
