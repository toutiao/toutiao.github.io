  author: akoller
  text: 'There are always tradeoffs. Databases are fundamentally about managing optimizations,
    and the question is whether those tradeoffs make sense for your workload.<p>HTAP
    has historically been niche because the cost of analytics on fresh data wasn&#x27;t
    worth the squeeze (sooner or later the MBAs step in). Separating the OLTP and
    OLAP layers gives you better workload isolation and the ability to optimize each
    independently.<p>Databricks Lakebase&#x2F;LTAP uses Postgres for transactions
    and lakehouse engines for analytics, with a shared storage layer. They also use
    Spark to build Postgres pages in parallel and write them directly to storage,
    avoiding the single-writer bottleneck when loading large volumes of data.<p>SingleStore
    takes a different approach: a distributed database based on MySQL with an in memory
    rowstore for transactions tightly coupled with a merger to columnstore for analytics.<p>I
    don&#x27;t think HTAP DBs will become the default for every use case. But I do
    think the space will grow as we move towards agents and automated decision making
    and optimizations.'
  score: 0
