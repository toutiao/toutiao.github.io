  author: ConnorTsui20
  text: 'We generally refer to an index that holds the data it indexes at its leaves
    a &quot;clustered index&quot;. But this only means that the tuples are organized
    according to the ordering of the index: you still generally store the entire record
    (all columns&#x2F;attributes) together.<p>For example, if I cluster on my sorted
    primary key, that just means that the index can jump to the tuple with the correct
    primary key quickly (log time), but you will still end up reading* the entire
    tuple in the same way I explain in the blog. And if you only store a record ID
    that points to the other fields instead of the entire tuple at the leaves of the
    index, then that wouldn&#x27;t be considered a clustered index.<p>I will note,
    however, that DBMSs should be smart enough to know that an aggregation on only
    an indexed column does not need to fetch the rest of the columns, only the data
    at the leaves of the index.'
