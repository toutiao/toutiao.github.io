  author: ConnorTsui20
  text: One of the cool things about Vortex (which is a file format, but in this context
    can be better thought of as the storage layer of a DBMS) is that we have implemented
    compression encodings that _do_ support fast random access. For example, FastLanes
    allows us to bit-pack values extremely effectively while retaining random access,
    and this can be combined with other encodings such as ALP and FSST.<p>I believe
    Vortex is unique in its ability to retain random access while recursively compressing
    data. And turns out that this is helpful for both in-memory _and_ on-disk (we
    might write about that in the future)!<p>I unfortunately didn&#x27;t have much
    space to write about that in this blog, but in the compression section I did link
    to other blogs that we have written that go into much more detail, if you are
    interested :D
