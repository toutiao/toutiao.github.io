  text: One can argue each view of a database is merely a derivate of the WAL, and
    therefore every view is an index. The major benefit of columnar databases is the
    data stored being continuous in memory. Avoid all serialize&#x2F;deserialize and
    control flow logic. Most core index data structures in relational DBs do not support
    this kind of tight vector view, Arrow[1]is a format that does.<p>Theoretically
    one can have a custom index extension which stores the data in a column-oriented
    manner, yet then one has major duplication, which is a problem for petabyte-scale
    databases, and is an even bigger problem in the Cloud.<p>KDB+ is the best implementation
    of a columnar DB in my opinion. Simple C, and one can understand how the data
    is stored down to the DRAM cells. Durability is just MMAP, which is fine as OLAP
    DBMSs tend not to be ACID.<p>In my personal opinion one shall learn from the best.
    The best in the world in massively parallel vectorized computation are the people
    at OpenAI and Anthropic, and the people who built PyTorch. Much of their work
    can be applied to analytical DBMSs.<p>(Draft, of course the topic is much more
