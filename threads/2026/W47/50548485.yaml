  author: joe_the_user
  text: 'Key point(edit): Supposed RSI as has supposedly been shown happening at Anthropic
    is ONLY a &quot;compute multiplier&quot; and &quot;dangerous&quot; the &quot;wrong
    hands&quot; only if those &quot;wrong hands&quot; have a lot of computer ALREADY.<p>...<p>The
    thing about RSI recursive self improvement is that has a model something like
    &quot;the algorithms A that we have lead to X fundamental level of  intelligence
    but if we use this intelligence to create new algorithms B, they will to Y fundamental
    level of intelligence&quot;. However, it should be noted that all the large language
    models retain the same transfomers architecture as started the present &quot;revolution&quot;.
    What algorithmic improvements have done is speed up training and inference in
    those transformers architecture models. Essentially, the speed-up are pretty exactly
    analogous to companies getting bigger data centers. That doesn&#x27;t mean it
    won&#x27;t reach &quot;AGI&quot; but it makes &quot;runaway&quot; improvement
    less likely than a situation where arbitrary algorithms create arbitrarily better
    algorithms. Especially, one would expect that there&#x27;s a limit to how effectively
    one can move data around to simulate Attention (which in its basic formulation
    is O(n^2) in speed and so actually scales only slowly).'
