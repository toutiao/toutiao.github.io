  author: r58lf
  text: At the February 2026 data cutoff (median follow-up of 8.5 months), the median
    overall survival for daraxonrasib was 13.2 months, with a 95% confidence interval
    of 10.0 months to &quot;not estimable&quot;. In contrast, the chemotherapy group&#x27;s
    survival data had matured enough to lock in a tight confidence interval of 5.8
    to 8.0 months.<p>So, it could be that the new drug is much much better, but they
    couldn&#x27;t tell at the time because they only were trying to say that it was
    significantly better then chemotherapy.
