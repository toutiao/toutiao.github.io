  author: epistasis
  text: This is absolutely <i>NOT</i> hyperbole, this has been an intractable disease
    for deacades, and the very first trial to show improvement is a lower bound on
    how effective the drug will be, not a full estimate.<p>First, this is a brutal
    drug, very hard to tolerate, and as better ways are found to manage side effects
    and to dial in the dosing, the treatment effects will increase.<p>Further, this
    is in <i>metastatic</i> pancreatic cancer, a stage of the disease where virtually
    all hope of a cure is gone for most. Any progress here will translate into bigger
    gains in earlier stages of the disease. We test new unproven therapies in metastatic
    cases like these because all other better options have been exhausted. And for
    decades, all those trials have been failures, this is the first time something
    has worked at all.<p>Additionally, this is just the first drug showing how to
    go after KRAS. Follow-on drugs, which some people call mere &quot;me-too&quot;
    drugs, will improve efficacy, have fewer side effects, and be more tolerable,
    all improving real-world results.<p>And as we learn to make KRAS treatments more
    tolerable, we&#x27;ll also learn about how best to combine them with other existing
    chemotherapies, which requires lots of testing. Go to ASCO, and you&#x27;ll see
    trial after trial after trial of small variations, trying to continuously improve
    existing treatments. It&#x27;s a slow and brutal way to learn, but it&#x27;s all
    we&#x27;ve got.<p>So if you only look at 13.2 months versus 6.7 months, yes, you
    are missing something! This is like discovering a whole new vein of gold ore to
    mine. We don&#x27;t know where it will lead or how big it is, but what we can
    see right now is far far more than 13.2 &#x2F; 6.7.
