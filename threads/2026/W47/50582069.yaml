  author: ijidak
  text: Maybe you&#x27;re assuming the parent comment meant on the same timescale
    as GRH was solved.<p>Otherwise I feel the parent&#x27;s comment is perfectly reasonable.<p>Cancer
    is simply a fatal combination of mutations that results in a set of cells that
    no longer follow the regulations in place that the organism uses to control unbounded
    and out of place growth of that or those cells.<p>I see no reason AI would be
    unable to help with such a simple problem statement.<p>In many ways cancer is
    simpler than the Riemann hypothesis to attack.<p>The complexity of cancer, from
    what I&#x27;ve studied, isn&#x27;t that we don&#x27;t understand what&#x27;s broken
    about the cells. It&#x27;s that we don&#x27;t manipulate matter as efficiently
    as biology to attack those broken cells.<p>Just this week news hit about a virus
    that can stop pancreatic cancer in its tracks.<p>Now why can the virus do this
    and not our medicines?<p>Because viruses work on the same scale of matter manipulation
    and process genetic information at the same physical scale that our cells do.<p>You&#x27;re
    right that the ability to emit tokens, no matter how intelligent, is tangential
    to our ability to manipulate matter.<p>However DNA and RNA can be expressed as
    tokens.<p>Thus one can imagine that just as AI has helped us emit information
    via language and code tokens faster, it ought to be able to emit DNA sequences
    faster than any human typing out A&#x27;s, T&#x27;s, C&#x27;s and G&#x27;s by
    hand.<p>Thus, I can imagine a world in which cancer cell sequencing happens much
    faster and viral targets for those cancer cells are written by AI as easily as
    they write code today.<p>That AIs have somehow managed to wrangle all human information
    to advance human capability in a variety of domains is promising because individual
    humans likely have no hope of wrangling, in a single human mind, all of the genetic,
    physical, and chemical pathways in a living organism as complex  as a human.<p>I&#x27;m
    not predicting when this happens but given that there are already services that
    will print a custom DNA or RNA strand to order, I absolutely see a world in which
    viruses, custom-designed to attack an individual&#x27;s cancer cells bearing genetic
    markers matching the cancer cell type (e.g breast, lung, etc.) and mutations should
    be possible since fundamentally biology is built on information (RNA and DNA).<p>So
    I agree with you that we shouldn&#x27;t expect a &quot;cancer cure&quot; in the
    next 6 months.<p>But since cancer starts in the information-holding part of the
    cell, building therapies that are information-sensitive with a previously unimagined
    rapid turnaround, and packaged in a virus which may also be heavily genetically
    modified to suit this purpose, does seem like exactly the type of problem these
    new generative manipulators of information are built to solve.
