  content: "## About\n\nSarasa Gothic is a typeface designed for the multilingual
    programmer in mind. Born from the seamless union of Source Han Sans and Iosevka,
    it fills a niche in the world of sterotypically limited, boring monospace type.\n\n##
    Features\n\n- programming ligatures and math symbols\n- true type font hinting
    designed for pixel-perfect tiny sizes\n- condensed for maximum semantic value\n-
    _complete_ latin, cyrillic, greek, and east asian language support\n- exactly
    0.5em set width characters to _always_ perfectly align with 1em width asian characters\n-
    glyph/language alternates\n- free and open source\n- continuously updated\n\n*
    * *\n\n* * *\n\n> A user interface is like a joke. If you have to explain it,
    it’s not that good.\n> \n>   \n> — Martin Leblanc\n\n* * *\n\n## Family info\n\n###
    The Love Child of\n\n- [Source Han Sans](https://source.typekit.com/source-han-serif/)\n-
    [Iosevka](https://typeof.net/Iosevka/)\n\nIf a child can inherit nearly 100% of
    its traits and _rock it_ flawlesly\n\n### Complete Superfamily Features\n\n- Uncountably
    large number of glyphs\n- 480 individual .tff files or 5 .ttc files \n  - Each
    font contains complete Latin, Cyrillic, and Greek characters\n- Subfamilies: \n
    \ - 5 weights: ExtraLight, Light, Regular, SemiBold, Bold\n  - 2 styles: _Italic_,
    **Bold**\n\n  - Stylistic Usage: \n    - Mono, Slab Mono: for code editors, IDE
    and tables\n    - UI: matching proportional sans serif for display\n    - Term:
    for terminals, Fixed: Term with no ligatures\n  - Language Orthography: \n    -
    CL: Classical Chinese\n    - SC: Simplified Chinese\n    - TC: Traditional Chinese\n
    \   - HC: Hong Kong Chinese\n    - J: Japanese\n    - K: Korean\n\n> Any fool
    can write code that a computer can understand. Good programmers write code that
    humans can understand.\n> \n>   \n> — Martin Fowler\n\n## Designers & Developers\n\nMain
    Typeface Designer & Developer: [be5invis](https://typeof.net/) (Renzhi Li)\n\nPublished
    by 兆邦中国 (Zhaobang China)\n\nlinks to obtain and install\n\n- [Github Repository:
    be5invis/Sarasa-Gothic](https://github.com/be5invis/Sarasa-Gothic)\n- [Microsoft
    Store: 更纱黑体](https://www.microsoft.com/en-us/p/fF4~B1%EF%BF%BDD1%E4%BD%93/9mw0m424ncz7?SilentAuth=1&wa=wsignin1.0&activetab=pivot:overviewtab)"
