  text: |-
    I won’t skip the opportunity to share why these are a bad idea & a misuse of what ligatures are actually for.

    […] Ligatures are special characters in a font that combine two (or more) troublesome characters into one. For instance, in serifed text faces, the lowercase f often collides with the lowercase i and l. To fix this, the fi and fl are often combined into a single shape (what pros would call a glyph).
    In this type designer’s opinion, a good ligature doesn’t draw attention to itself: it simply resolves whatever collision would’ve happened. Ideally, you don’t even notice it’s there. […]
    Ligatures in programming fonts follow a similar idea. But instead of fixing the odd troublesome combination, well-intentioned amateur ligaturists are adding dozens of new & strange ligatures. For instance, these come from Fira Code, a heavily ligatured spinoff of the open-source Fira Mono.

    I agree with the author that what we actually want is better Unicode support in languages so we can type what we mean instead of the likes of trying to shoehorn ASCII Hyphen + Greater-than sign into → when we have the technology (there are multiple solutions to inputting & quite a few (tho not enough) languages that support Unicode).
