  text: |-
    So, a bit more context from a CJK user: I think this series of fonts is mostly used if you have CJK characters in your code/terminals. In popular monospace fonts like Fira Code or Jetbrains Mono, the width of two Latin characters doesn't match the width of a CJK character (displayed with other fonts, as Fira Code, etc. don't cover CJK charsets), so in a non grid-based editor (that is, not TUI) or some not grid-rendered terminals, the rendered texts can look as disastrous as this:

    1 2 3 4 5 6 7 8
    一二三四

    (Most CJK users, TUI applications and your Markdown / Orgmode tables expect "8" to line up with "四".) This is best illustrated by the screenshots from cnfonts, an Emacs package that helps you adjust the relative size of your monospace fonts and CJK fonts so that they line up. Even with cnfonts, I remember being unable to line things up perfectly however I try (because the ratio isn't a good fixed-point number?), not to mention other non-Emacs editors. So here goes Sarasa, a font bundling Iosevka and Source Sans CJK, ensuring their dimensions match up exactly.
    (As other comments pointed out, it's huge in size, and probably more intended to be used in your local IDEs than as a font on webpages.)
