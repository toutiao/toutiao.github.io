  author: Pomax
  text: |-
    true type font hinting designed for pixel-perfect tiny sizes

    Why? This is what the bitmap tables are for: write actual pixels instead of trying to push vectors past their useful scale and then using what is effectively a programming language to compensate for that again. Monospace fonts have the extreme benefit that every glyph is the same width: literally what the bitmap tables make trivial. And then the font's faster, too, because it has nothing to process: the bitmaps already exist in the font itself.
  score: 1
