  author: lrvick
  text: Production servers should be hardened, immutable, and remotely attestable
    appliances. Everyone should be able to prove every line of code in memory at all
    times, with access to secrets gated on signed quorum approval from multiple reviewers.
    They should not have dev tools, ssh, a shell, and certainly not capable of blindly
    modifying themselves at runtime if a single admin of a Puppet control server asks
    them to.<p>Such tactics mean a single compromised engineer laptop means a compromise
    of production, and thus a data breach is all but inevitable.<p>I would disqualify
    anyone seriously suggesting Salt, Puppet, Ansible or otherwise advocating for
    live-mutating production servers in a sysadmin interview today.
