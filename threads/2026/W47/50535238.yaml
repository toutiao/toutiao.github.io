  author: prmoustache
  text: I understand and subscribe to some of the things you say but:<p>&gt; Such
    tactics mean a single compromised engineer laptop means a compromise of production,
    and thus a data breach is all but inevitable.<p>I hope you don&#x27;t believe
    that an immutable image cannot be compromised. The commits done to the build system
    come from the same engineer laptops and, in a world where CVE are published ao
    frequently, said compromised image could be deployed largely in only a few minutes
    hours.<p>Also there is something to be said with lack of debugging tools. While
    I agree that reducing the surface of attack is the way to go, I am pretty sure
    the reason it takes so long for some of the big infra outages we have experienced
    from various cloud vendors comes from the inability of engineers to log on some
    systems, observe and potentially fix temporarily by hand to stop a race condition.
    There is often a race condition and serpent eating its own tail situation involved
    and logs might not even reach the monitoring infra anymore.<p>Going back to manage
    pets is not the way to go but I am not entirely certain removing ability for a
    subset of engineers to log on systems is exactly the way to go.
  score: 0
