    The answer is sort of in your question; historically, Rust has been somewhat allergic to adding much in the way of opinionated APIs into the stdlib (speaking as a total outsider / third party observer). This has started to relax a bit in recent years, from what I've seen.
    Date/time is hard, though. It means different things to different people. I might just want to increment timestamp by a day. Does that take into account timezones and leap years? Do I need to pull the tzdb from files? Or embed it in? Where are those files located? Should I add a trait for reading that info, or should it be a filesystem side effect? Who updates them? When should they be read? In memory cache? Should embedded RTC mechanisms use these types, or should they roll their own? Does this need to be so general that all third party date libs can implement traits for the standard types? Does it need to handle formatting as localized strings? Or just a format library? Which calendars should it support? Just the Gregorian? Does it link in all the strings too? Or pull from a localization database?
    The list of design considerations is so great. There's probably a subset of functionality that could be standardized. And IMO rust has done well to keep it at what exists now - instants and durations, for the most part.
