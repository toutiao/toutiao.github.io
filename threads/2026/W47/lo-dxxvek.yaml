    Because cargo and the internet are good enough now that something not being in the standard library isn't a problem any more. The whole of crates.io is in essence the standard library, but versioned so mistakes don't become forever-mistakes, and with only marginally more friction to use. You just have to run cargo add jiff to add a dependency. It's one of those things where new tools/infrastructure have erased a cost so much it completely changes the value calculus in a field, but people are still sticking to the solutions to the old constraints. Python etc. had big batteries-included standard libraries because downloading libraries and managing dependencies was a pain in the arse back then (among other reasons), and that was their solution. But in Rust, the extended standard library is just one command away, it's easy, fast, neat and tidy, so who cares if it's not actually in the compiler? It almost doesn't matter.
    It does make me wonder whether Rust actually needed a standard library at all. Maybe std, or large parts of it (maybe note core), could have been versioned too and thrown up on crates.io. That would be an interesting experiment.
