  author: david_chisnall
  text: |-
    I'm not a user of this, but having both used an implemented APIs for working with time in a few languages, including some that went through standardisation: The above is 100% the correct approach.
    Handling time is incredibly hard.  Even the lowest level is not trivial.  Timeouts are hard to make non-racy.  Absolute timeouts give early wake if you're preempted in between reading the time and calculating the displacement.  Relative ones can lead to missed wakes if you're preempted during the API call.  More importantly, what is your timeout relative to?  Wall clock time?  What happens if the local clock is wrong and NTP sets it to an hour in the past?  Monotonic time?  Current-thread runnable time?  Different approaches have different tradeoffs.  There's a huge amount written about this core part (POSIX made a mess of it and then fixed it in some APIs, inconsistently).
    But all of that is, comparatively, the easy bit.  Representing time in a way that you can communicate to users is incredibly hard because the right solution depends a lot on the domain.  Want to show the current time to the user?  That's not too bad, you can find the time-zone correction and it mostly works.  Want to show them an historical time in their current time zone?  Now it gets fun, because a load of calendars have discontinuities.  For example, the late Russian move to the Gregorian calendar meant that the October Revolution happened on November 7 in the new calendar: should you show November 7 (consistent with the current time) or October 25 (consistent with the date accounting at the time)?  Even simple things like scheduling meetings and accounting for daylight-saving times require storing things as a calendar date and adjusting for each occurrence, whereas things like nightly CI jobs are fine to schedule in UTC (or UNIX Epoch time).  And that's just the smallest edge of the problem.
    I don't think I've ever seen a good API for handling all of this but I've seen numerous bad ones.  And they're all exploring different parts of the design space to find new bad ideas that looked like great ideas until they came into contact with the wrong use case.  Rushing to standardise time APIs is a well-known recipe for disaster.
