    Because Rust has a stability guarantee, and libstd doesn't support versioning, so nothing can ever be removed or changed in there.
    This means that every bad API stays forever. DateTime especially is an incredibly difficult one to get right. Given that this is yet another crate made because all the other crates weren't good enough, the old first try that would have landed in std would be the worst of them all.
    Instead of having std with bad APIs and telling people not to use them and use crates instead, Rust skips the first step and goes for crates directly.
    Second issue is that there's one std for everyone, and one size doesn't fit all. Embedded and WASM folks usually wouldn't want to bundle a time zone database. People targeting specific platforms may want to use the OSs' preferred date APIs.
