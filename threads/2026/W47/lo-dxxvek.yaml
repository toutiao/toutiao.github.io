  text: |-
    The problem is that Rusts standard libraries do not act like normal crates (I think there might be some ongoing efforts to reduce their weirdness, but I'm not sure); they get versioned and distributed in precompiled form along with the rest of the Rust toolchain because they're more integrated with the compiler and use internal features. For example, core uses #![feature(lang_items)] to define 182 (according to a quick grep) definitions that rustc needs to know about. As a consequence, unlike normal crates you cannot use multiple versions of a standard library simultaneously, and specifically have to use the ones that matches your toolchain.
    A commonly used library like rand not being distributed the same way doesn't mean it doesn't get maintained nor that it doesn't care about backwards compatibility. But it means that if a new, backwards incompatible API really is needed, it's not as big of a problem as e.g. in Python. You can continue using the old version (which ofc can still receive updates) even if a dependency already uses the new one.
