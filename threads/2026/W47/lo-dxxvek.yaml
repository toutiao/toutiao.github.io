    is a plain Gregorian date, unattached to any specific location.\n- A [`civil::Time`](https://docs.rs/jiff/1.*/jiff/civil/struct.Time.html)
    is a plain time on a clock, to nanosecond precision, unattached to any specific
    location.\n- A [`civil::DateTime`](https://docs.rs/jiff/1.*/jiff/civil/struct.DateTime.html)
    combines a `civil::Date` and a `civil::Time` to provide both a Gregorian date
    and a time on a clock. It is also unattached to any specific location.\n- A [`Timestamp`](https://docs.rs/jiff/1.*/jiff/struct.Timestamp.html)
    is an unambiguous specific instant in time regardless of geographic location,
