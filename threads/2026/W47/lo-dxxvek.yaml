  text: |-
    An early version of the time crate actually used to be shipped as part of the Rust distribution prior to Rust 1.0. That's ancient history now, but we explicitly kicked it out of the distribution because we knew it was a huge and complex domain whose modeling is difficult to get right. What if we had standardized on it? No good. What if we waited a few years and standardized instead on chrono? Still no good. (You can see more of my thoughts on why in Jiff's comparison and design documentation.)
    It really wasn't until the Temporal folks invested many person years of effort into modeling the domain that I think we've arrived at a real nice answer to the question of, "How does one design a datetime library?" But that only happened recently. Jiff really wouldn't be what it is without it.
    Is Jiff the final answer? Who knows. 1.0 was just released. It's already used in production across many applications, but we'll see what happens as more folks adopt it.
    Also, Jiff is way bigger and more complex than Go's standard library time package. By an order of magnitude at minimum. There are lots of reasons for this:

    Jiff has a stronger focus on using types to prevent domain errors. Go's time.Time is like a jiff::Timestamp combined with some kind of ZonedDateTime.
    Rust APIs are usually inherently more complex because of its approach to polymorphism and because their tends to be a stronger cultural focus on performance.
    Go has only one basic duration type. Jiff has a similar duration type but also a Span that combines calendar and physical time units all into one type.
    Jiff support civil time. Go's time package doesn't support this at all.

    There's probably more stuff too. But that's from a quick look (and memory, since I used to use Go a lot).
    In principle it would be nice for something like Jiff to be in std. But its API surface area makes it a huge risk. I don't want to release Jiff 2.0, but I can if the need really arises.
