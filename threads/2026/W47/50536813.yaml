  author: kingstnap
  text: |-
    Except the explanation doesn&#x27;t make any sense. A period is a period.
    Earth doesn&#x27;t look like its spinning half as fast if you are 1 light-day away...<p>The real effect is actually to do with making a graph and noticing an oscillation in the phase of the orbit. In particular the cumulative phase shifts that add up as earth moves further away and the cumulative small phase shifts that add up as earth moves closer to Jupiter. This looks like a sine wave.<p>Like if someone before you made a table of predicated date and times of io transits (Cassini&#x27;s constant-period tables) based on the assumption that the oscillation is jitter-free, you could actually realize that there is this +-11 minute jitter in the real measurements after collecting a lot of samples.<p>There are lots of these textbook simplifications that make a line fitting problem look like some magic 2 point measurement impossibility.<p>Like the Millikan’s oil drop experiment wasn&#x27;t some magic nonsense where you figure out how to balance a single drop in mid air.<p>The Cavendish weighing the earth wasn&#x27;t a static twist on some wire where you cannot possibly measure the torsion constant precisely enough. It involved measuring a peak to peak deflection of some small oscillation.<p>The Foucault rotating mirror was not magically shooting a discrete laser pulse and measuring an RPM, as it came back in the second gap it was realising that you could modulate the returning intensity as you ramped angular frequency. Fitting angular velocity against harmonic number was what gives you time of flight not a single tooth.
