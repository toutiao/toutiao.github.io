  author: Maxatar
  text: This is a subtle misunderstanding. As you approach the speed of light, physical
    processes including clocks or other time measuring devices appear to slow down
    relative to an observer. Exceeding the speed of light, at least as a conceptual
    generalization, doesn&#x27;t mean that you end up going back in time and experiencing
    past events like Back to the Future, rather it would allow for future events to
    influence the outcome of past events, what is called retrocausality [1].<p>Retrocausality
    is not the same as time travel. With time travel it&#x27;s as if you get to go
    back in time and reexperience things that happened in the past, which is not what
    faster than light travel implies. Retrocausality is more about things happening
    in the present that are influenced by future events, as opposed to causality where
    only past events can influence the outcome of future events.<p>[1] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Retrocausality"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Retrocausality</a>
