  author: adrian_b
  text: The pendulum clock had been invented by Christiaan Huygens a couple of decades
    earlier.<p>It became quickly widespread, especially at astronomical observatories.<p>It
    is likely that the recent availability of accurate pendulum clocks was essential
    for Rømer&#x27;s measurements, so such a result about the speed of light would
    have been impossible for the previous generation of astronomers.<p>Nonetheless,
    inside a fixed astronomical observatory, where there has been built a meridian
    circle with a telescope, and if there is available a good catalogue of stars,
    it is possible to measure the current &quot;sidereal time&quot; and use differences
    in sidereal times to compute the corresponding differences in time, even without
    a clock. The sidereal time is not a time, but the angle of rotation of the Earth
    vs. the stars. The rotation of the Earth vs. the stars is much more uniform than
    the apparent movement of the Sun on the sky, which determines the days.<p>So it
    would have been possible, but in a much more difficult way, to measure accurately
    the duration of some astronomical events even without clocks, but only with accurate
    instruments for measuring angles, used to determine the celestial coordinates
    of the stars, then compute the difference in the transit times of some stars whose
    transits coincided with the beginning and the end of the duration that must be
    measured, from the angles between them.<p>When good clocks are available, it is
    easier to measure the transit times of the stars and compute the angles between
    them from the times, than the reverse procedure, which would be needed without
    good clocks.
