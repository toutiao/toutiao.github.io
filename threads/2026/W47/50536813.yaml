  text: No. I don’t mean for six months. A variation of a minute per day is more than
    accurate enough to time an event that is expected to have a 10 minute deviation.<p>The
    clock only has to keep time between times when it can be accurately reset to true
    time. If you know your position on earth, there are several daily events that
    can tell you exactly what time it is. They also knew what time the eclipses were
    supposed to happen in absolute time.<p>So I can use my 1 minute per day clock
    to get the correct absolute time of an eclipse in January and then ignore my clock
    until the next time I want to observe in June. Then I can get it accurate to true
    time again and make my observation.<p>E.g. if I give you a watch that is set today
    and accurate to 1 second per day, you can tell me what time something happened
    today within a second. If you wait a full year with the battery taken out and
    I set the time to be accurate again, you can tell me what time something happened
    to an accuracy of 1 second. You can also tell me what the difference between those
    two times were to an accuracy of 2 seconds.
