  author: cyberax
  text: "&gt; As you &quot;slowly&quot; move the two clocks away from one another,
    the two clocks will no longer be synchronized due to time dilation, and so you
    need to account for time dilation, but in order to account for time dilation you
    need to already know what the one-way speed of light is.<p>That&#x27;s why I said
    &quot;slowly&quot; so that the effect of the time dilation can be kept negligible.
    If you insist that you MUST account for it, get an additional clock that you move
    at a different velocity. It&#x27;ll provide you another data point for the system
    of equations that you can solve to get the &quot;c&quot; value.<p>You can measure
    velocity precisely without any reference to the speed of light by timing how long
    (according to the clock itself) it takes for it to traverse a given length.<p>To
    make it even more watertight, do the experiment in an inertial reference frame
    with pre-accelerated clocks. Launch two clocks with arbitrary but different velocities
    along a race track. At the start of the track you have the pulse source along
    with the reference clock, you synchronize with it as your moving clocks cross
    the starting line.<p>Then you measure how long it takes for each moving clock
    (according to its measurement!) to cross the finish line. This will provide you
    enough data to solve the equation for the time dilation."
