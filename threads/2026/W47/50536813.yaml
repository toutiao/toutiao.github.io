  author: toast0
  text: It&#x27;s not <i>really</i> possible to measure the time it takes light to
    move from point A to B. You can really only measure the time it takes for light
    to move from point A to B and back.<p>But you can do measure the difference between
    light going from point A to point B and light going from point A to point C to
    point B (and adding point C in the reverse direction as well) and I think you
    can use that to get reasonable confidence that light has constant speed in a given
    medium in all directions.<p>But this is totally relevant for trying to figure
    out asymmetric delivery delays in packet switched networks... You can&#x27;t measure
    the delay directly, and if you use the network to synchronize your clocks, you
    can&#x27;t use the clocks to measure the delay either, because most synchronization
    assumes symmetric delay. You need an externally synchronized clock, like a GPS
    reference etc.
