  author: Coeur
  text: 'From the comic: &quot;Over the course of a year, Io&#x27;s orbital time varied
    by 22 minutes&quot;.<p>This sentence implies that at some point in the year the
    time it takes for Io to do one single orbit, as viewed from earth is 22 minutes
    longer. That&#x27;s not true. This is not a good explanation comic.<p>What happens
    is that if you have a clock that is very accurate and has a drift of less than
    a minute for a whole year, and you measure the exact moment that Io&#x27;s eclipse
    happens (every 42.5 hours) over a full year, you might expect that it&#x27;s every
    42.5 hours all the way through the year. But what you actually see is that this
    moment varies over the course of a year by 22 minutes - it&#x27;s later if Jupiter
    is far away.<p>Now you might ask how can somebody create such an accurate clock
    - in the 17th century? He used a pendulum clock which had a drift of like a second
    in 6 hours, and at the beginning of each night, he corrected that clock based
    on some other daily occurring measurement of the night sky, like when a certain
    star crosses a fixed point when viewed from his observatory.'
