  text: Not just light, it&#x27;s impossible to know if the speed of anything is constant
    in all directions. The so called one-way speed of an object depends on a synchronization
    convention used for clocks at different locations. Different conventions can produce
    different one-way speeds while leaving all other observable physical phenomena
    unchanged.
