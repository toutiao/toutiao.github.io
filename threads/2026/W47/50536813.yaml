  author: dghlsakjg
  text: The eclipse is the same length. When an observer on Earth sees it will vary
    since our distance to Jupiter varies.<p>Think about lightning and thunder. The
    thunder happens the instant the lightning does (the lightning being the eclipse).
    When you hear the thunder depends on the you, the observer&#x27;s, position. Imagine
    we know exactly where and when the lightning&#x2F;eclipse happens. If hearing
    the thunder (seeing the eclipse) happens later than that time, we can then calculate
    the speed of sound based on our distance from the event, and the time we observed
    it. The final trick is that they <i>didn&#x27;t</i> know when the eclipse would
    happen exactly, but they did know when it would be observed by an observer in
    a given location. If you then observe it from a second location that is farther
    away from the eclipse, you can determine the speed of light. They used the fact
    that the earth moves through space to change locations enough for the time differential
    to be super obvious.<p>Accurate clocks aren&#x27;t super duper necessary. You
    just need one that can be accurate enough for a few hours (since you can fix your
    time based on celestial observations several times per day). Pendulum clocks were
    invented about 20 years before this discovery and were accurate to about 1 minute
    of drift per 24h.
