  author: Maxatar
  text: Usually when people are introduced to the issue of measuring the one-way speed
    of light, one of the first ideas that comes to mind is exactly what you suggest,
    and it&#x27;s a very good first thought, but of course it doesn&#x27;t work since
    implicit in your approach is an assumption about what the one-way speed of light
    already is.<p>As you &quot;slowly&quot; move the two clocks away from one another,
    the two clocks will no longer be synchronized due to time dilation, and so you
    need to account for time dilation, but in order to account for time dilation you
    need to already know what the one-way speed of light is.<p>I put &quot;slowly&quot;
    in quotes because why would it possibly matter whether you move clocks slowly
    or quickly? It&#x27;s the principle of the matter that is at issue, not the practicality.
