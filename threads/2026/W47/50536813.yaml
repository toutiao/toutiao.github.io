  author: rramadass
  text: To add an even more fascinating take;<p>The &quot;speed of light&quot; is
    not a speed like the commonly understood speed of an object (eg. ball&#x2F;car&#x2F;etc).
    It is all mind-bending but worth trying to get a grasp on.<p>&quot;c&quot; is
    a geometric property of the &quot;unified spacetime&quot; fabric and is actually
    the conversion factor between space (3 dims) and time (1 dim). See <i>Spacetime
    Diagram</i> - <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Spacetime_diagram"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Spacetime_diagram</a>.
    Thus there is a &quot;motion through time&quot; and a &quot;motion through space&quot;
    (this is the commonly understood meaning of the term motion).<p>This article explains
    it - <a href="https:&#x2F;&#x2F;www.aoc.nrao.edu&#x2F;~smyers&#x2F;courses&#x2F;astro12&#x2F;speedoflight.html"
    rel="nofollow">https:&#x2F;&#x2F;www.aoc.nrao.edu&#x2F;~smyers&#x2F;courses&#x2F;astro12&#x2F;speedofligh...</a><p>One
    way to understand this; when an object moves through spacetime its combined rate
    of motion (i.e. in space + in time) is always fixed to c. So when an object is
    at rest all its motion is &quot;motion through time&quot; but when it starts accelerating
    in space the &quot;motion through time&quot; is converted into &quot;motion through
    space&quot; and in the limit becomes c. This is why you have length contraction
    and time dilation at speeds close to c.
  score: 0
