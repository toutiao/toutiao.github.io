    We build this as a c++ library, do to query-compilation for our stream processing engine.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;nebulastream&#x2F;nautilus" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;nebulastream&#x2F;nautilus</a><p>It allows us to implement operators or functions without having to write them in terms of LLVM IR DSL (or similar). Rather, you write your functions over a wrapper type (and returning one), for which there is an overload of anything which you can overload in c++.<p>You can instantiate a wrapper from some c++ value, in which case the wrapper will just forward everything to this value, which was nice for debugging in the preagentic era.
    But, you can also instantiate such a wrapper as a tracer, and the result of the functions evaluation will be a trace.<p>For controlflow, we record whenever a wrapper type is evaluated as a bool, first return true, and when we reach the end of one branch, throw an exception to get back to the beginning, and start all over again, but evaluate it to false.<p>The resulting trace we can turn into LLVM IR and compile, or run for example in wasm
