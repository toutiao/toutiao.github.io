  author: TuringTest
  text: "&gt; For me, the most beautiful pieces of software are those that reveal
    something about the nature of programming languages.<p>There are three moments
    that make the functional programmer evolve their understanding of how a programming
    language really works as a symbolic representation of human thought, beyond the
    metaphor taught in school of a computer program as a grinder that crunches input
    data and produces results.<p>The first one is when you really understand recursion
    and how a function can be defined in terms of itself (with varying parameters
    for each call).<p>The second is when you discover Prolog variable unification
    or Haskell lazy evaluation and how you can represent infinite data structures
    without having the program hang in an infinite loop.<p>Third one is when you learn
    that the behavior of any imperative language (down to the working of the microprocessor
    data paths) can be fully represented in a pure functional rewrite language (without
    destructive assignment &#x2F; cell state changes).<p>Those insights make one realize
    that all programming paradigms have the nature of symbols processing in common
    and there&#x27;s no &quot;true description&quot; of a program&#x27;s runtime execution
    - the imperative, functional and logic views of the running program are all equivalent
    representations."
