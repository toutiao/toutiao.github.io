  text: 'In the NTP Pool community, I&#x27;ve seen a few people mention CenterClick
    NTP servers; I&#x27;m happy to do my own DIY builds (Pi or otherwise), but this
    looks like a nice option for SMBs or time-nuts who don&#x27;t want to manage their
    own hardware: <a href="https:&#x2F;&#x2F;centerclick.com&#x2F;ntp&#x2F;" rel="nofollow">https:&#x2F;&#x2F;centerclick.com&#x2F;ntp&#x2F;</a><p>There
    are also a lot of people who buy old Spectracom or other &#x27;enterprise&#x27;
    time servers since they can be had for low hundreds of dollars with some nice
    features like rubidium or OCXO oscillators, so they can hold over time much more
    accurately when GPS is down, or upstream NTP providers are unreachable.<p>And
    regarding chrony, it&#x27;s the default in many distros now, I like some of its
    built-in monitoring and clock adjustments, it just feels easier to manage if you
    want more than just base NTP features. It also supports hardware timestamping
    if you have network hardware that has it, which IIRC NTPd doesn&#x27;t? I haven&#x27;t
    messed with systemd-timesyncd or ntpd-rs, so can&#x27;t say much on them.'
