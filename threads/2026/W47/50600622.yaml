  text: 'Well, I’m partial to Meinberg.  After all, when I joined the NTP Public Services
    Project in 2003, it was Heiko Gerstung who gave me my first Primary Time Appliance,
    for our testing purposes.  And they’ve been a strong supporter of NTP.org and
    the Network Time Foundation ever since.<p>Heiko is now the CEO of that company.  I
    got to see his face in person for the first time a few years ago, when I was working
    on the EC2-Chronos team at AWS, and we were considering bringing in Meinberg as
    one of our preferred vendors of Primary Time Appliances, with a goal to install
    them at each and every AWS datacenter around the world.<p>That effort was part
    of the enhanced version of the Amazon Timekeeping Service that we officially launched
    in 2023, and highlighted as part of the Re:Invent keynote that Peter DeSantis
    did (see: <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=pJG6nmR7XxI"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=pJG6nmR7XxI</a>).  Originally,
    the SLA was accuracy within one millisecond, but with this project, we got that
    down to 20 microseconds.<p>Internally, AWS uses Chrony.  Both on the back-end
    Stratum-2 time servers, and we also controlled the default Chrony configuration
    on all of the EC2 instances.  And I so got familiar with doing chronyd configurations.<p>I
    think it’s fine for that purpose, but I would make sure that you’re not doing
    leap second smearing.  I know the leap second is going away, but the last time
    I checked with Ask Bjørn Hansen, he did not allow any time servers into the pool
    if they were doing leap smearing.  Which is why we could operate our own time.aws.com
    service, but we couldn’t contribute time servers to the NTP Pool, because all
    of our servers did leap smearing.<p>Ironically, during the time I was actively
    working to support NTP.org, I helped Ask Bjørn Hansen to set up the NTP Pool,
    but it has been years since I talked to him about it.  I should reconnect with
    him.'
