  author: bradknowles
  text: So, on EC2 nodes, the internal Stratum-2 servers provide time to the NTP client
    on the hypervisor card.  From there, it is provided via the link-local address
    to the EC2 instances.  That’s the best quality of time sync that you could possibly
    get to those instances.  The Stratum-1 servers inside the AWS network in each
    availability zone are providing the signal to the Stratum-2 distribution servers,
    and those Stratum-2 distribution servers are what feed the hypervisors across
    all regions, all availability zones, and all datacenters.<p>On the newer instances,
    your local NTP client could also be configured to receive a 1PPS signal from the
    hypervisor card, and in that case you can get an SLA of 20 microseconds or better
    from “true time”.  For these systems, there are Stratum-1 servers within the same
    datacenter as the hardware where your instance is running.  That’s what allows
    AWS to run a custom fabric for 1PPS signals that is very high fidelity, low jitter
    and wander, etc….<p>Older instances aren’t running on hardware that has access
    to that proprietary fabric where 1PPS is transmitted with very high fidelity,
    and so there is no 1PPS signal that can be fed to your instance.  In that case,
    you get an SLA of one millisecond (or better).<p>Either way, this is at least
    an order of magnitude better than you can get from any other source, since that
    source would have to be from outside of the AWS network.  You might be able to
    get yourself down to single-digit millisecond accuracy, but still not down as
    low as you can get from AWS if you just use the link-local service.
