  author: geerlingguy
  text: The other clocks all agree on :28 seconds, which is indicated in the bottom
    clock (OCEST WiFi NTP clock), whereas the top WWVB clock is showing :38 ;)<p>But
    in order from top to bottom:<p>PTP Wallclock (yellow matrix display), running
    Oliver Ettlin&#x27;s software I found out about through a CCC talk on PTP<p>Masterclock
    NTDS (unlisted on their site, but they still make these for broadcast) &#x27;analog-style&#x27;
    digital NTP clock<p>Mitxela Precision Clock Mk4 (gets time straight from GPS,
    displays accurate time to the ms, though you need a high speed camera to see it).<p>The
    two wall clocks are a radio time clock from La Crosse I found at Micro Center
    (up top), and an OCEST WiFi NTP clock.
