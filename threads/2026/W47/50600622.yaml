  author: Avamander
  text: |-
    For the price and complexity of building a good Linux-based time server I&#x27;d heavily recommend looking at FPGA-based solutions instead. x86 platforms also have PCIe PTM and TGPIO options available[0], which are tad better than the common ARM equivalents and GPIO interrupts.<p>In general Pi-s are relatively bad for timekeeping. Not just the NIC (which can be replaced by hats with their own), there are also oscillator replacement mods[2] to work around this to some extent. Though all this still leaves many other sources of timekeeping error.<p>So if the goal is low-cost precise timekeeping, one can assemble something FPGA-based[2] for quite a bit less money, that can reach very low noise figures. You can spend the remaining money on the GNSS antenna and receiver instead.<p>I&#x27;m also sure a FPGA-based approach could be taken even further with some external timekeeping chips available and the FPGA could just do the NTP&#x2F;PTP protocol stuff.<p>[0]: <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=zxK0_j2Ah2I" rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=zxK0_j2Ah2I</a>
    [1]: <a href="https:&#x2F;&#x2F;raspberrypi.stackexchange.com&#x2F;questions&#x2F;74482&#x2F;switch-out-the-x1-oscillator-on-a-rpi-2-3" rel="nofollow">https:&#x2F;&#x2F;raspberrypi.stackexchange.com&#x2F;questions&#x2F;74482&#x2F;switch...</a>
    [2]: <a href="https:&#x2F;&#x2F;fy.chalmers.se&#x2F;~f96hajo&#x2F;fakernet&#x2F;board_Arty_A7-35-GPS-NTP.html" rel="nofollow">https:&#x2F;&#x2F;fy.chalmers.se&#x2F;~f96hajo&#x2F;fakernet&#x2F;board_Arty_A7-35-GP...</a>
