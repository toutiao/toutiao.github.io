  author: bradknowles
  text: So, the cool thing about `ntpd` and Chrony is that they do exponential backoff,
    once they have gathered enough statistical information about the upstream servers
    they are using.  They will typically keep a tighter loop on their selected SYSPEER,
    but the others will be allowed to relax.<p>This will reduce the load on any additional
    upstream time servers that you configure, but obviously it won’t go all the way
    down to zero.<p>You still want to be considerate of your neighbors, and not abuse
    their servers.  But it is generally considered fine to be connected to as many
    as ten upstream time servers.<p>Now, if you use the “pool” directive, when you
    get back multiple IP addresses for the same name, you will connect to each of
    those servers in that pool.  If you do the numbered server trick that I explain
    elsewhere, and each name comes back with just three IP addresses, that means that
    you will actually be connecting to four or five names, times three IP addresses
    per name.  That’s twelve to fifteen servers, probably.<p>But that’s okay, because
    you’re just connecting to the servers you were told about when you did the DNS
    query, and given the DNS load balancing built into the pool, when the next person
    asks the same question about those same machines, they will probably get different
    answers.<p>Whether it’s `ntpd` or Chrony, when your client goes through the periodic
    re-evaluation process of those configured upstream time servers, that’s when it
    should pick up any IP addresses per name changes.  And if the IP address is different,
    then it doesn’t matter that the name is the same.  The design of the NTP protocol
    is such that you must have one and only one unique clock behind each IP address.  That’s
    why load balancing switches don’t work with NTP.
  score: 0
