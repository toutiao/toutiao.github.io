  author: geerlingguy
  text: 'It all depends on the gains you&#x27;re looking for. Almost any solution
    with PPS input can get you under 1µs, even on Linux through GPIO.<p>If you want
    to chase lower, you need a hardware-disciplined  clock. Either through FPGA, or
    in the case of my Time Pi, I have a PTP NIC with a PHC disciplined from the ublox
    F9T—which should be within 5-20ns of GPS time. This can be measured on higher-end
    boards like the TimeHAT by comparing PPS out from the GNSS module, PPS from the
    NIC, and PPS from a separate GPSDO, along with a timestamp comparison tool like
    the tinyGTC or TAPR TICC: <a href="https:&#x2F;&#x2F;tapr.org&#x2F;product&#x2F;tapr-ticc&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;tapr.org&#x2F;product&#x2F;tapr-ticc&#x2F;</a><p>The
    annoying thing is there are few PC hardware combos that include the relevant PPS
    and frequency outputs to allow actual verification of your time in hardware. Software
    can show numbers but even on my Pi dashboard, the sub-20ns sync reported is between
    the system clock and the NIC PHC... but not currently accounting for the delay
    when the kernel reads the PHC over PCIe.<p>Pi <i>could</i> support PTM on its
    PCIe bus, that would be awesome. Overkill for 99.9% of its market though!'
