  text: Like the recent brouhaha about Proton email, this business decision breaks
    user trust. Email and backups are the most personal digital information available.
    For a business to do anything to violate the integrity of that agreement forever
    taints every action. Today it is only &quot;metadata&quot; - how long until they
    again alter the deal?<p>People previously felt like they could trust the Backblaze
    client to faithfully mirror their data. No longer. That client may decide that
    it has the right to inspect some &quot;harmless&quot; metadata that would be valuable
    to advertisers. Will the software start scanning browser cookies of recently visited
    sites? Pull GPS coordinates of recently acquired photos?<p>From this moment, running
    Backblaze software is an unacceptable risk, and the convenience of the service
    is now negligible. Privacy focused individuals will have to setup their own encryption
    pipeline using trusted software to dump encrypted blocks onto Backblaze servers.
