  author: 3eb7988a1663
  text: I am not saying this is some explicit strategy, but something that naturally
    happens in the numbers. Given enough customers, Z% of uploaded data will be highly
    compressible or redundant amongst all clients (eg OS system files). Giving you
    free storage margin. You offer a customer X TB for $, but, on average, you only
    need to allocate Y TB.<p>However, if all of your clients start uploading encrypted
    files, there is now 0% possible compression&#x2F;redundancy gain. Those Windows&#x2F;Mac&#x2F;Linux
    system libraries are all going to be stored on the backend. If Backblaze is offering
    &quot;unlimited&quot; system backups, and they archive system files, that is dozens
    of duplicated gigabytes per customer that could previously be zeroed out of their
    storage calculation.
