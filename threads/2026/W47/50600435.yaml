  text: |-
    It all weighs into their business model for costs.<p>If you upload an uncompressed 10MB markdown file to Amazon S3, Amazon will charge you for 10MB of storage, but is almost certainly going to use some internal compression so that they only have to commit 500KB to disk. Given enough scale, and you can project that every x TB of customer data only actually requires y TB of storage space.
    If all ingested data is already encrypted, x now equals y and that savings ratio disappears, so you are going to have to provision x storage hardware.
