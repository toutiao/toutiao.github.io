  author: jeroenhd
  text: OS rollback is possible if you&#x27;ve configured it. A combination of btrfs
    + timeshift has served me very well after a failed Ubuntu upgrade. You can just
    boot into the previous snapshot from Grub.<p>Although you can set this up after
    the fact (converting ext4 to btrfs is supported and you can update your mounts
    from any recovery distro), that&#x27;s probably just something to keep in mind
    for your next fresh install. It&#x27;s also extremely for any other kind of failed
    upgrade, though, not just full OS upgrades.
