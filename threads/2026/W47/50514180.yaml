  text: Containers !~= VMs (except Kata Containers and similar). VMs ensure specific,
    isolated, supported compatible kernel versions in controlled environments because
    what&#x27;s supported &#x2F; should work isn&#x27;t the same as what&#x27;s technically
    possible &#x2F; might work. At scale, tiny differences matter.<p>Containers seem
    lightweight and magical until the tyranny of the quirks of the kernel matters
    with some gotchas of supported configurations as opposed to unsupported gremlins
    running custom stuff that other vendors refuse to touch.
