  author: smsm42
  text: The laws are accessible, I am pretty sure all the regulations are available
    on the IRS site. Just if you ever tried to research anything on that site, you&#x27;d
    quickly learn how much distance there is from information being there somewhere
    to it being in a form that is practically useful for you. Those documents are
    not user-friendly at all, and there are so many branches and special cases that
    doing it from the raw documents would be enormously exhausting and you&#x27;d
    never be sure that you didn&#x27;t miss something. This is why having a software
    package that does it would be huge help.<p>The problem is, those laws and regulations
    change literally all the time - e.g. just the last week IRS updated on FSA limits
    for the next year. Prior to that, the information just didn&#x27;t exist. So somebody
    needs to maintain all those things and keep them in shape and consistent and up
    to date. This is not trivial. There exists software like <a href="https:&#x2F;&#x2F;opentaxsolver.sourceforge.net&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;opentaxsolver.sourceforge.net&#x2F;</a> but I
    am not sure how much does it cover.
