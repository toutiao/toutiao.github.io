  author: rescbr
  text: Eh… tax rates for products that go through the formal import mechanism (i.e.
    the one distributors use) are completely different to the ones available to a
    natural person.<p>In fact many parts I bought for my PC had their prices at the
    same or at lower prices than what it retails in the US. Others I bought on a trip
    to the US.<p>There is a LOT of profiteering done by intermediates that is blamed
    on taxes (hello car manufacturers!), and them being cascading also does not help.
    The fact that they are structured in this way simply makes it opaque to the layman
    and allows for this scapegoating discourse while allowing for increased profits.
    Thankfully the new VAT structure will remove these cascading effects. It’s 20-30
    years late, and will take longer for the tax regime to be fully transitioned,
    but it was finally approved.<p>Remember that Brazil opts to have high consumption
    tax rates while having lower income and property tax rates, which impacts people
    with lower income. There is zero dividend tax! Ask any colleague that lives in
    an OECD country how much do they pay in taxes combined (consumption, income and
    property) and you’ll see that you pay proportionally less in taxes than them.<p>The
    problem with Brazil is misallocation of public funds, corruption, bureaucracy,
    the famous <i>custo Brasil</i>, not that “taxes in Brazil are high”.
