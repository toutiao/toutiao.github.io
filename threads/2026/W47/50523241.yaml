  author: tetha
  text: Complexity theory has a couple of interesting &quot;sandwiches&quot; as a
    prof called them.<p>For example, we know that LOGTIME is a subset of PTIME, which
    is a subset of NPTIME and PSPACE, both of which are a subset of EXPTIME. We also
    know that EXPTIME is strictly bigger than LOGTIME and PTIME.<p>So somewhere between
    PTIME, NP, PSPACE and EXPTIME, there must be a change in computational capability.
    We just don&#x27;t know where.<p>This also exists between constant-depth circuit
    networks and algorithms using LOGSPACE. A circuit network of depth of log^2(input_size)
    can compute more than any nondeterministic LOGSPACE algorithm, which can compute
    more than a circuit network of constant depth using threshold gates. We also know
    that a deeper circuit network has strictly more computational power than the constant
    depth one.<p>But where is the specific jump in computational power? We don&#x27;t
    know.<p>That makes the &quot;practical applications&quot; very strange to consider.<p>I
    keep jesting, the funniest resolution of P vs NP would be that P = NP, except
    it has a cost factor that stops any practical collapse, like a proven minimum
    of O(n^&lt;number of atoms in the universe&gt;). That&#x27;d be the most annoying
    resolution of them all.
