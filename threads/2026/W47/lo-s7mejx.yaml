    True, but I don't think it distracts from the point.  There's a reason I recommend people learn Smalltalk, Haskell, Erlang, C, and a few others.  It's not because those languages are the only languages that have the concepts that they rely on.  It's not because those languages are widely deployed in industry.  It's because they are good ways to learn specific styles of programming that will give you useful tools in other languages.
    People who know Haskell and C, for example, write much better C++ than people who know just C, because they reach for the type language when it's useful and express useful compile-time properties in ways that are correct by construction.  Haskell isn't the only language that will teach you this and I don't actually care if you learn, say, Idris (thought you will be more even sad if you have to move from Idris to C++ than you would if you came from Haskell), as long as you learn the concepts.  And a language that's more widely deployed that teaches the same things is much easier to teach people.
    I'd also say that, although I know many people who love it, I can't stand ML syntax.  Even when I knew nothing at all about Rust other than some of the high-level claims, I never found Rust code particularly hard to read.  I can go to a Rust codebase as someone who does not yet routinely write Rust and understand it.  When I had to implement reader-writer locks on top of futexes a few months ago, I read a Rust implementation, understood how it worked, and why their approach made some assumptions that didn't quite align with what I needed.  But reading ML requires a lot more work for me because it (like Haskell: this seems to be a thing FP encourages) aggressively goes for very concise (often single symbol) syntax that has little error correction.  Sure, it's faster to type, but optimising for writing code rather than reading it is exactly the wrong thing to do.
