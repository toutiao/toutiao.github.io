    they will treat the people doing that thing well (better than the people not creating
    value, anyway). If they don&#x27;t, then those people will be treated poorly.
    The key is understanding and not the on the ground outcomes. That is why metrics
    and processes always end up being such a big deal in corporate culture; because
    the people in charge are aware that the limiting factor is their ability to understand
    their own company and they&#x27;re just not necessarily very competent at acting
    on that knowledge."
