  author: george_max
  text: 'We&#x27;ve had spectacular infrastructure outages for decades; I think that
    a cluster of incidents in one week doesn&#x27;t establish that AI is directly
    responsible for declining reliability.<p>IMO, the issue is that AI is reducing
    the cost of building and modifying systems much faster than it&#x27;s reducing
    the cost of understanding them. For example, an engineer can work on a problem
    or project for a week that could otherwise be done by AI in an hour or so. But,
    that week spent was not &quot;wasted time&quot;; it was understanding what it
    is they are building, discovering undocumented assumptions, knowing about different
    dependencies, developing intuitions about the system and how it works, etc.<p>This
    causes comprehension debt. Yes, the system does ultimately work, the tests  also
    pass. But the level of comprehension goes down significantly.<p>That said, AI
    can also help reduce this debt by asking it what you need help understanding.<p>A
    good blog post on this: <a href="https:&#x2F;&#x2F;larsfaye.com&#x2F;articles&#x2F;ai-coding-will-prevent-expertise"
    rel="nofollow">https:&#x2F;&#x2F;larsfaye.com&#x2F;articles&#x2F;ai-coding-will-prevent-experti...</a>'
  score: 0
