  author: bshaughn
  text: |-
    The status quote of how to run a business has enabled this extreme corporate abstraction that has completely detached decision makers and the capital class from understanding all the details that we nerds care about. I think Boeing is one of the best examples of this. What used to be a legendary organization with an engineering first culture, that was able to make the 747, has turned into this MBA led shell of itself that is the poster child for late stage capitalism.<p>The business leaders only see things that they can fit into their spreadsheets (both literally, and figuratively representing the mental models they use for decision making).<p>The productivity and skills of individual engineers get washed out via some average. The blockers and nonsense that slow down your best teams disappear, and those good teams are measured to be average. Building things the right way does not increase revenue so therefore it is not worth doing. Off shore engineers are cheaper so its more profitable to use them.<p>Do this a few hundred times and you get to this insane point where the mental model of those incharge is so off base from reality that planes start falling out of the sky...<p>Even if you have a pocket of middle managers who do understand, and want to communicate that change upward, you are still in a terrible spot of telling your bosses everything they know and have done is a lie.<p>This problem is not limited to just MBAs vs Engineers. We nerds are guilty of it  in other ways. I have worked in Data Science &#x2F; Machine Learning &#x2F; AI Engineering my whole career - which always has the fascinating problem of building what stakeholders think is magic and managing those expectations. What I have noticed, especially the last year, is people use the magic of AI to offload the hard parts of product design, figuring out ugly data, contradictory business rules, etc... this sort of thinking feels good, because it lets us believe the problem is easier than it really is. But at the end you are left with some AI slop product, or disappointing automation.<p>I&#x27;ll never forget attending a project proposal by a fresh big 4 consultant hire  at my current job, that promised to save $10M in costs. The plan was literally:
    1. Get data on &lt; problem &gt; (which did not exist in a useable way)
    2. &lt; My name &gt; builds a solution with claude
    3. we save $10M a year<p>Its literally the underpants --&gt; ?? --&gt; Profit meme from southpark.<p>I see this issue getting worse and worse, because the decision makers are further and further detached from the details that keep our planes from falling out of the sky, or outlook crashing.<p>The real work gets done in the trenches, and the generals don&#x27;t know what the mud smells like. The one upside in all this, those who are willing to get into the trenches have the tools to leave the generals behind.
  score: 0
