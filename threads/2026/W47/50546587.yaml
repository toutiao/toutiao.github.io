  text: That&#x27;s not quite right - source expresses the idea relative to a language
    syntax and grammar, whereas machine code (or assembler) implements the idea against
    a specific target machine, for a specific set of circumstances.<p>So as an example,
    there are a bunch of different ways a for or while loop can be implemented in
    compiled code, but there are also situations where two quite different source
    constructs can result in the same machine code sequence.<p>Machine code certainly
    won&#x27;t teach an LLM much about how to write good source code.
