  author: adrian_b
  text: Disassembly is not 100% solved, at least not in a way that is easy for an
    LLM to use.<p>Disassembling directly an executable program, especially when it
    is some proprietary program for which there is no debugging information, is likely
    to produce a lot of garbage that does not correspond to correct assembly instructions.<p>Correct
    disassembly can be obtained only by simulating the execution of the program and
    disassembling only the instructions that are reached in this way. This is still
    not completely foolproof, because during simulation some parts of the code might
    be reached only for some specific input data, which is unknown. Sometimes one
    may guess all the possible inputs and disassemble anything reached in this way,
    but in reality some of those inputs can never occur, which can lead to erroneously
    disassembling parts that should not be disassembled, as they are not instructions.<p>That
    said, most executable programs are easy to disassemble, but some may be intentionally
    or unintentionally very obfuscated, and for such cases any disassembling tool
    would have to be guided by a human to achieve a complete disassembly.
  score: 0
