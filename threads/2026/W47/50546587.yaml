  author: plqbfbv
  text: The incredible part is that an LLM that wasn&#x27;t explicitly trained for
    this, can analyze bytes as if they were natural language, and surgically modify
    and&#x2F;or insert bytes directly without going through intermediate steps (source
    -&gt; ASM -&gt; ...).<p>This process would normally require a human to lift bytes
    -&gt; ASM, ideally ASM -&gt; obfuscated source, making sense of it, and doing
    the chain backwards, and it requires coordinating a lot of knowledge. Which of
    course is no problem for an LLM.
