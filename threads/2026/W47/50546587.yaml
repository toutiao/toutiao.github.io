  text: 'Like the weight space stuff, I think there&#x27;s a small misdirection in
    how this is presented: Phrases like &quot;write directly in machine code&quot;
    seem to imply that ordinary LLMs intuitively understand machine code as just another
    language, like English or JavaScript, that they read from context and write directly
    as tokens, and that this intuitive understanding could mean increased efficiency
    or capabilities if you ask the LLM to just use the bytes rather than asking it
    to use the tools that human reverse engineers use.<p>If that&#x27;s what you assumed,
    the DeepSeek reasoning trace shatters that illusion. It&#x27;s just disassembling
    by hand like what a human reverse engineer would do if you (sadistically?) denied
    them a disassembler. Yeah, the human reverse engineer would need an excellent
    memory of the x86_64 instruction reference, but we already know LLMs can recall
    a breadth of information. What we don&#x27;t know, that this article also provides
    no evidence for, is if there will be any benefit in using the LLM for this over
    objdump.<p>The article seems to intentionally conflate disassembly (computationally
    cheap) with decompilation (can be computationally expensive) to imply that there&#x27;s
    some benefit to asking the LLM to work with machine code (seems impressive to
    the RE layman) rather than working in assembly (something you probably already
    assumed LLMs can do,) but the DeepSeek trace has a disassembly in it, and it&#x27;s
    hard to imagine that inference will ever be cheaper or more reliable per-token
    than objdump is at producing the same output.'
