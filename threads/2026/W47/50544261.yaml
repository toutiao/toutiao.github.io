  text: Google, Microsoft, Amazon, etc. are essentially too big to be held accountable
    for internet abuse. Google is probably the biggest source of spam on the internet,
    but nobody is willing to blacklist gmail&#x27;s servers because it&#x27;d mean
    cutting off almost everyone using email for anything. It isn&#x27;t right, but
    that&#x27;s the reality.<p>That certainly doesn&#x27;t mean that other companies
    shouldn&#x27;t be held accountable if they fail to prevent and remove phishing
    and malware from their platforms however. Codeberg has a history of being abused
    by scammers and hackers. If they have repeatedly failed to prevent that or refused
