  author: autoexec
  text: Besides them just being the lapdog of the MPA&#x2F;RIAA, none of it is great
    really. In one of the articles MarkMonitor accused RapidShare of being &quot;the
    leading ‘digital piracy’ site with over 13 billion yearly visitors&quot; while
    ignoring that the vast majority of those yearly visitors were using the site for
    legal things and while also ignoring that youtube has far more visitors and to
    this day is filled with pirated content.<p><i>“In an interview with mediapost.com
    MarkMonitor’s vice president of communications Te Smith said that she did not
    consider websites like YouTube piracy sites as they ‘have procedures in place
    where brandowners can take down the material.’ RapidShare offers the exact same
    take down features to copyright owners as YouTube does. Now, where is the difference?”</i><p>Other
    articles talk about their history of sending unverified and wildly inaccurate
    DMCA take down notices (for example sending a DMCA notice on behalf of HBO telling
    Google to remove “infringing” links to what was actually legal content being hosted
    at HBO.com, and situations where the rights holder didn&#x27;t authorize them
    to send notices on their behalf at all), and incidents where MarkMonitor tried
    to hide evidence from defendants in piracy lawsuits and fought to keep evidence
    about their operation from the public.
