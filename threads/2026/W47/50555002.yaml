  author: ChrisMarshallNY
  text: 'That&#x27;s a pretty big transition.<p>Get comfortable with breadboards,
    scruffy command-line interfaces, and hex dumps. You&#x27;ll need to stare at a
    block of raw memory, and determine the data structure, therein.<p>I started with
    embedded. It&#x27;s a lot of fun, but you&#x27;ll spend a hell of a lot of time,
    preparing the stage. You will be responsible for all the low-level stuff that
    a modern host OS does.<p>I&#x27;d actually suggest starting with pure Machine
    Code, first. It will make ASM look easy, and help you to really understand the
    processes in the chips.<p>Also: IRQ is The Way. It&#x27;s a whole new way of looking
    at threading. There are absolutely no safety nets.<p>That said, it&#x27;s been
    35 years, since I did that low level work. I suspect the tools have come a long
    way, since.<p>The #1 thing to remember about firmware, is it&#x27;s often a big
    deal to patch. It can be done, but it should not be done often.<p>Get in the habit
    of triple-checking everything. Mistakes can be rather difficult to fix.'
