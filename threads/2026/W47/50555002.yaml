  author: snailcoder
  text: |-
    I think if you have a genuine interest in solving problems where that tooling is the best solution, it should be an easy transition. Especially being able to use generative AI as a resource.<p>Now, if you’re just over, focused on technologies and want to use a technology for the sake of using that technology, probably won’t be as easy.<p>Saying you want to transition to C, C++, or Rust is like a handyman saying they want to to get better with electrical tools vs plumbing tools or circular saws vs reciprocating saws. They focus on the problem than try to pick the right tool for the job.<p>Focus on what you want to solve, and then apply the tooling. Solve the same
    Problems you’ve already been solving, with your new tooling and weigh the pros and cons of both. The obvious choices will come out based on the problem at hand. The jump from web apps to firmware may be a big jump. But if you focus on a problem that interests you, and it appears those techs may be a better tooling for your task. Maybe solve it in your traditional languages first, then re apply the new stack. Or contribute to tools you’re already using, written in those stacks.
