  author: AnimalMuppet
  text: 'There are two issues:  1) transitioning your skills, and 2) persuading someone
    to hire&#x2F;pay you for your new skills.<p>Transitioning your skills is possible.  But
    embedded is a different world and a different mindset.  You a lot less RAM and
    a smaller CPU.  You may have hard deadlines - the right answer can be wrong if
    it&#x27;s too late.  You may have multiple threads that have to share data and
    not corrupt it, no matter what order events occur in.<p>In the worst case, you
    may not have logging available at all, and you may not have a debugger.  (I think
    the worst I ever had to do was attach a logic analyzer to the address bus, triggered
    by a specific address, and then use it to look at past memory addresses in order
    to figure out what path of execution had got me to the point of the crash.)<p>So,
    yeah.  It&#x27;s a different world.  Learnable, but different.<p>Getting someone
    to believe you can do it enough that they&#x27;re willing to pay you:  I don&#x27;t
    have great advice there.  I spent almost my whole career in embedded.  It seems
    to me that it&#x27;s easier to get from there into, say, desktop programming,
    than it is to go the other way.  Your best bet might be to emphasize your native
    development background, and count on there being a shortage of embedded people.'
