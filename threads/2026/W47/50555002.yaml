    doing new stuff, be it exploring a new peripheral and making it work just so,
    or integrating lots of different activities into an RTOS and making sure the timings
    are still spot on.  Yesterday was implementing a radix tree.  Or doing mechanical
    design and test fixtures.  There&#x27;s a lot of variety, and the hands-on application
    of software, electronic and mechanical aspects to make working systems is very
    satisfying.<p>Not having an electronics background or an embedded background,
    there was certainly a steep learning curve.  Lots of stuff to learn and master.  But
    anyone who already knows C and C++, and who is prepared to knuckle down and get
    stuck in, will do fine.
