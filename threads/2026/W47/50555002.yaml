  author: Joel_Mckay
  text: C is king on mcu with C++ for higher end chips, but most use a subset dialect
    compatible with janky compilers on multiple platforms.<p>This list of rules applies
    to most languages ( <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_Power_of_10:_Rules_for_Developing_Safety-Critical_Code"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;The_Power_of_10:_Rules_for_Dev...</a>
    )<p>A bit of history where these rules came from, and why they matter.<p>&quot;Why
    Fighter Jets Ban 90% of C++ Features&quot; ( <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=Gv4sDL9Ljww"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=Gv4sDL9Ljww</a>
    )<p>The basis of the cited 10 rules helped form many standards for reliable code
    ( <a href="https:&#x2F;&#x2F;www.stroustrup.com&#x2F;JSF-AV-rules.pdf" rel="nofollow">https:&#x2F;&#x2F;www.stroustrup.com&#x2F;JSF-AV-rules.pdf</a>
    )<p>The age of the legacy mcu is closing, as full blown SoC with specialized peripherals
    now cost about the same.<p>It is shite pay, naive people incorrectly assume they
    can write for real-time,  and unless you wrote bare metal Assembly at some point
    in your past... you will have difficulty understanding why certain things break.  esp32
    are a cheap capable chip to learn on, and the Pluto course work is a great intro
    to the Zynq 7010 fpga hybrid Soc.<p><a href="https:&#x2F;&#x2F;www.analog.com&#x2F;en&#x2F;resources&#x2F;evaluation-hardware-and-software&#x2F;evaluation-boards-kits&#x2F;adalm-pluto.html"
    rel="nofollow">https:&#x2F;&#x2F;www.analog.com&#x2F;en&#x2F;resources&#x2F;evaluation-hardware-and-...</a><p>The
    world needs Erlang&#x2F;Elixir OTP devs right now as everything shitty is burning
    down in CVEs.  Easy money if your work can take the &quot;AI&quot; audits and
    survive.  =3
