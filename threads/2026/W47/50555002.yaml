  author: jcarrano
  text: One of the biggest differences is that in web development you are most of
    the time oblivious to how things are actually implemented and to the layers underying
    your software, all the way up to the metal. In embedded, even if you are not working
    directly with the lower layers of abstraction, it is something you always keep
    in mind.<p>For example, even if the project uses Linux, with an app written in
    a higher level language- there are people using Python or even C#- maybe at some
    point you need to look into the bootloader, and eventually you find yourself reading
    the reference manual for your SoC to find the boot pins configuration.<p>As to
    the transition, some time ago I worked with a colleague that had been transferred
    from another, non-embedded team. I think this is a valid strategy, to join a team
    with experienced embedded devs. 15+ years of software engineering experience is
    a lot even if on a different field. On the other hand, on these projects there
    will likely be some part adjacent to web development, where you can contribute
    more.
