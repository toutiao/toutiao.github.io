  author: analog31
  text: "&gt;&gt;&gt; There&#x27;s simply a lot more high-level work to be done than
    low-level work.<p>Something I&#x27;ve observed for a long time, is that if a system
    has O(N) pieces, then the number of interactions between pieces is O(N^2). Thus
    as complexity increases, most of the work will involve interactions, not basics.<p>For
    this reason, most people with engineering job titles spend most of their time
    organizing and arranging things, fitting things together, meetings, and troubleshooting.
    It only takes a small handful of people working on the pieces themselves to keep
    the rest of the department busy indefinitely.<p>Also, resources will tend to be
    thrown at a project when it&#x27;s running late, which tends to be after the pieces
    have already been designed and tested. Software always comes after hardware, sometimes
    disastrously after, with embedded in between.<p>Also for this reason, while AI
    could affect embedded and hardware (and I&#x27;m seeing it happen), the biggest
    gains are to be made in taming the software beast."
