  author: Joel_Mckay
  text: "&gt;Can you expand on why the world needs Erlang&#x2F;Elixir OTP devs?<p>Primarily
    the transparent fail-over multi-host cluster coordination areas need cleaned up,
    or will likely face resiliency issues moving forwards.<p>&gt;trying to get into
    SWE work with the AI slop<p>OTP languages remain operational even when other areas
    are under active RCE attempts.  These systems usually remain operational when
    pinned at 100% CPU usage by a code defect, interpreter has live internal state
    debugging as part of the API, and are compatible with constraint programming paradigms
    (Erlang&#x27;s list comprehension feature is somewhat functionally similar.)<p>The
    fact is daemon functionally will be more important than perfection when repo code
    is audited several times an hour... long before patches can be pushed out to the
    public.<p>&quot;LLM&quot; cannot help much in my problem domains, but are good
    for looking up poorly maintained documentation. Anything that lies to you 30%
    of the time is a waste of time, but does certainly bring out the petulant and
    naive.  lol  =3"
