  author: rkagerer
  text: Way too much caution in this thread.  I&#x27;ve done all kinds of programming
    including embedded and full stack (from before the latter was even a colloquialized
    term).<p>I absolutely love the degree of control you can get at the microcontroller
    level.  One of my proudest projects had IRQ handlers written in assembly where
    I counted instruction cycles in order to guarantee worst-case latencies and  well-defined
    impact to realtime activities in the main loop.  There were also some lower-priority
    tasks going on that were cooperatively multitasked.<p>Some time later I wrote
    a JavaScript library that mimicked some of those cooperative multitasking concepts
    to queue background image downloads and other generic &quot;ITasks&quot; in a
    manner that maximally utilized available connections (which were extremely limited
    by servers back then) and allowed on-the-fly reordering.  The frontend used it
    to always ensure whatever image the user was most interested in (i.e. tiny previews,
    and large version of the result presently hovered over or that we anticipate will
    be hovered next) came up as close to instantaneous as we could get, and the rest
    of the large images lazy-loaded in an intelligent order.  The result was an experience
    that felt so much faster than how most other websites operated back then (and
    ironically even now as bloat has really slowed a lot of sites down), and users
    loved it.<p>So the concepts you learn at one end of the spectrum can definitely
    benefit you at the other.<p>I have much less fun now that so much of the web has
    moved to React and other cookie cutter frameworks where the level of control comes
    at a higher cost (in terms of learning curve, understanding all the layers of
    abstraction, and space for developer creativity).<p>In other words, just get in
    there and start playing with a personal project or two, and trust your instincts
    and all the experience that honed them!
