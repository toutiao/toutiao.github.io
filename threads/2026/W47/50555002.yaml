  author: rramadass
  text: "&quot;Embedded&quot; has four distinct categories;<p>1) Embedded devices
    running fullblown OSes like Linux etc.<p>2) Embedded devices running realtime
    RTOSes like FreeRTOS etc.<p>3) Embedded devices where you do bare-metal programming.<p>4)
    Embedded devices using FPGAs. This is completely different from the above.<p>If
    you already know C&#x2F;C++ you can transition to the first three above. Start
    with writing apps on the platform (with&#x2F;without AI help). Learn to use tools
    like multimeter&#x2F;oscilloscope&#x2F;logic analyzer&#x2F;JTAG etc. to gain visibility
    into and debug the hardware. This will make you comfortable with Electronics and
    Hardware which is the biggest challenge for software folks.<p>Note that &quot;realtime&quot;
    programming (soft or hard) is mandatory to understand hardware. This is the main
    difference between higher-level apps vs. embedded apps.<p>Learning to program
    FPGAs is a whole different ballgame altogether. They support what is known as
    &quot;Reconfigurable Computing&quot; so that you can implement whatever you need
    (eg. Neural-Network, Cryptography, Network accelerator etc). You will have to
    learn different HDL languages like Verilog etc. and how to run&#x2F;test systems
    in a simulator. The thinking and development processes are quite different from
    &quot;standard&quot; software development.<p>W.r.t. to a career, your guess is
    as good as mine with all that is happening in the industry. However since there
    is actual physical hardware and a lot of complexity involved, a &quot;human-in-the-loop&quot;
    will always be necessary (AI cannot do everything) in the prototype-to-production
    process."
