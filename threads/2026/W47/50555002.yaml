  author: tptacek
  text: 'I started my career in C&#x2F;C++ and have done a fair amount of embedded
    work. In terms of actually <i>doing</i> stuff, there has never in the history
    of the world been a better time to do low-level and embedded systems work. The
    right advice here: find a project, scrounge the parts, and have an agent do basic
    bring-up work for you. If your last serious C work was 15 years ago, I think you&#x27;ll
    be astonished how quickly you can progress to the &quot;rewarding&quot; part of
    any project.<p>If your question is instead how you make a career transition to
    embedded&#x2F;firmware work, that&#x27;s much trickier. The obvious concern is
    AI&#x27;s impact on the job market, but I&#x27;m chiming in to observe that this
    isn&#x27;t the biggest problem with a web-&gt;embedded transition. Good jobs doing
    embedded stuff, at least for people who don&#x27;t already have a pedigree doing
    that work, has for as long as I can remember been a bottleneck for people wanting
    to do this stuff. There&#x27;s simply <i>a lot</i> more high-level work to be
    done than low-level work.<p>I can see bright spots potentially ahead; I&#x27;m
    not a big Jevon&#x27;s Paradox person but one kind of clearly Jevon-y area is
    hardware, because we&#x27;ve zorched one of the biggest impediments to getting
    new projects off the ground. But it hasn&#x27;t happened yet, and might not.'
