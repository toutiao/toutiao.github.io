  author: peteforde
  text: Most important thing is to have a passion project that you are extremely motivated
    to complete. I&#x27;m always baffled when folks try to learn an extremely deep
    domain by just watching random videos and following tutorials.<p>ChatGPT is an
    incredible engineering mentor. You can copy&#x2F;paste chunks of your KiCAD schematic
    into the chat and it will just jump in and start recommending parts that meet
    the moment. Just ask it everything, and keep asking follow-up questions.<p>Make
    no mistake; you aren&#x27;t just learning embedded development... you&#x27;re
    learning electronics. That means you should get into the mindset that you&#x27;ll
    be doing a lot of skill stacking.<p>If you don&#x27;t know how to CAD things in
    Fusion and 3D print them, fix that. I&#x27;m happy to recommend an excellent tutorial
    video.<p>I recommend getting a bag of 25 of each of the ~100 most common resistor
    values and putting them in a bin. This will cost ~$100 and you will have all of
    the resistors. I cannot tell you how great this is. It&#x27;s like having a jar
    of every spice.<p>Amazon has many vendors that sell plastic snap cases of capacitor
    values and various diodes. I have a stack of different parts. Again, all of the
    spices.<p>IMO the most underrated microcontroller is the ESP32-P4. It&#x27;s a
    powerhouse, and a company called Wireless Tag makes a module called WT0132P4-A1.
    It is the bee&#x27;s knees. RP2354A is also an amazing thing because it has something
    called PIO that will make you very happy when the time comes.<p>Not all breadboards
    are created equal. Many are terrible. Invest in BB1660.<p>KiCAD has become really,
    really good. And JLCPCB is both cheap and flexible.<p>If you get curious about
    surface mount - and you will - if you remember one thing from all this, it&#x27;s
    to invest a few hundred in a decent STEREO microscope on AliExpress. If you give
    your brain the ability to perceive depth, you&#x27;ll suddenly realize that you&#x27;re
    a soldering ninja. (A Robin&#x27;s Tools Pixel Pump doesn&#x27;t hurt, either.)
