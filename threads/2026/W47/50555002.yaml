    tools (simulators, scripts) that can be JS (think node wrapping the embedded code
    in a simulator) or Python.<p>If you’re in a regulated environment (automotive,
    medical, aerospace) then there’s a lot of process pieces for conducting reviews
    and tracing requirements that’s fundamentally a people skills activity.<p>I’d
    also look at where the role falls in the org chart. Sometimes the embedded developers
    get shunted back and forth between software and EE. Also if it’s in a heavy EE
    environment that can mean the role pays less than a software role.
