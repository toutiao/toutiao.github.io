  author: antirez
  text: 'It uses two techniques: B+ tree instead of sorted sets, but also the hash
    table side, the dictionary, is specialized for sorted sets and stores several
    items per allocation. The B+ tree leaves hold all the members and scores (also
    in clusters of many elements, 96 max or 4k: that&#x27;s a big part of the win),
    rank lookup can skip many children because of meta data, which is part of the
    ability to go as fast or faster than Redis <i>even</i> if the memory is so much
    smaller. The hash table points to leaves in the B+ tree, does not have elements
    at all, and is heavily optimized to do just the minimum, a single byte tag is
    used as a speed optimization to optimized lookups in an optimistic way. Basically
    it is the sum of many different techniques conceived during the years and never
    adopted for fear of complexity (today no longer a problem), and newely discovered
    techniques.<p>P.S. I tried several variants with different representations, so
    this specific implementation is the Pareto frontier in speed&#x2F;size of many,
    many attempts.'
  score: 0
