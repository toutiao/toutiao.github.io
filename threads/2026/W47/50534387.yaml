  author: dreamcompiler
  text: "&gt; Every node carries a backward pointer<p>Curious. Skiplists don&#x27;t
    need back pointers. You can traverse a skiplist backward almost as fast as forward
    if you keep the &quot;finger&quot; around. The finger is the set of nodes from
    level-n down to level-0 that point as close to the goal node as possible without
    going beyond it. The ideal place to keep these nodes is on the stack. To traverse
    backwards, you do a conventional search for the starting node but every time you
    go down a pointer level, you push the last pointer on the stack first. Then back
    traversal becomes stack pops together with appropriate forward recursive calls
    when you pop back to a pointer that was too far to the left.<p>It&#x27;s easier
    to convey the idea with code than english but I&#x27;m not typing the algorithm
    with my thumbs into my phone."
