  author: boricj
  text: Compute speed has been outpacing memory speed for decades now. So when you
    spend the cycles to fetch a cache line (64 bytes generally), you want to milk
    it for all its worth, to minimize time spent waiting on memory.<p>On a cold cache,
    you pay for each level of indirection, so you want to increase fan-out as much
    as possible. B-trees do that intrinsically.
