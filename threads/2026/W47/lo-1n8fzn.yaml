  text: |-
    Yep that pretty much brought Firefox for Android to its knees. It very effectively covers all the tropes I see everywhere now. Makes me so sad.
    They are always effects you can achieve with some basic CSS rules and minimally invasive structure changes, cause that's what Claude likes best. A graphic artist might have designed some nice looking status-badge-adjacent-thing that used to require a bit of finesse from a webdev to get it looking as intended on all target platforms, while Claude always chooses the same damn pill with monospace all caps and a neon dot on the left. So lame.
    I think the problem is that it looks alright to the person generating it, but they don't put the effort in to realise that it's exactly the same as everyone else's zero-effort webpage. If I squint then I see that it's a good thing, because I can spot the signs and leave straight away.
    Edit: Pro tip, your LLM can generate these atrocious webpages, but you can also ask it to remove all the styles from a webpage. My dancing class posted this link to a chatgpt site they generated that laid out the curriculum for each week in a painfully difficult to browse tree thing. I fought fire with fire and used chatgpt to turn it into a markdown file, which I've been using ever since.
