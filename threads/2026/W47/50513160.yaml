  author: forgotmypw17
  text: '&gt;The {mode: &quot;open&quot;} argument gives the page a way to break the
    encapsulation of your shadow DOM. If you don&#x27;t want to give the page this
    ability, pass {mode: &quot;closed&quot;} instead, and then shadowRoot returns
    null.<p>&gt;However, you should not consider this a strong security mechanism,
    because there are ways it can be evaded, for example by browser extensions running
    in the page. It&#x27;s more of an indication that the page should not access the
    internals of your shadow DOM tree.<p><a href="https:&#x2F;&#x2F;developer.mozilla.org&#x2F;en-US&#x2F;docs&#x2F;Web&#x2F;API&#x2F;Web_components&#x2F;Using_shadow_DOM"
