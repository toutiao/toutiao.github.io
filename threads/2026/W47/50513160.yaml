  author: rafram
  text: No, the opposite. Firefox WebExtensions inherit the two main security features
    that XUL extensions used to separate page content from extension code. But in
    the XUL extension days, if page content <i>did</i> manage to control an extension,
    it could directly take over your machine and execute any code with full filesystem
    access.<p>(The two security features are X-ray vision and cross-origin access
    controls. The former makes it so extension code doesn’t see the page’s modifications
    to built-in properties. For example, if my extension calls document.createRange(),
    but the page has overwritten that method, my code will see the original and not
    the modified version. But if I call document.wrappedJSObject.createRange(), I
    ask to get the page’s version, which might be malicious. The latter just means
    that objects created by extensions and made accessible to the page can’t actually
    be used by it unless the extension explicitly exports them. Both of these are
    still active for WebExtensions.)<p>Lotta rose-tinted glasses when people remember
    the XUL extension days. It was an extraordinarily risky and fragile architecture.
    Every single extension had full control over your machine, and every major Firefox
    update broke most extensions (or made them break Firefox), because the main way
    to inject your logic into the browser was monkey-patching.
