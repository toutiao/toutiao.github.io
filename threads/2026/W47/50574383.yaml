  author: MSFT_Edging
  text: 'This is such an interesting part of the whole AI equation.<p>The main benefit
    of the closed models is the regulatory control to say, insert guard rails against
    hacking things. That&#x27;s also the main drawback as you now have handed control
    over this technology to a handful of companies, who will reap all the rewards
    of this captured sector.<p>It would be like the google&#x2F;apple duopoly on steroids.
    Everyone forced to buy in to one of two ecosystems, with limited to no ability
    to undermine the duopoly via control of the device hardware. One can&#x27;t make
    a real competitor because it requires access guarded by existing relationships
    and money. For the AI houses, it means you need approval from these groups to
    create in a competitive manner. That, IMO is too much power for an unelected organization
    to carry.<p>AI will likely only provide real benefits to humanity if it&#x27;s
    open. But if it&#x27;s open, it will also enable extreme harm in the form of cyber
    attacks, scams, and destruction of IP.<p>By keeping AI closed, it will bring a
    new form of imperialism. Instead of the core maintaining IP and the periphery
    suffering the secondary effects of industry, the core will maintain the capability
    and the periphery will be locked out of competition due to silly nation-state
    rivalries. This won&#x27;t benefit humanity, it will lock us into the same cycle
    of misery for marginal gains measured in stock values.<p>So there&#x27;s two ways
    AI can reasonably go: Cyber punk corporate overlords or cyber anarchy due to the
    inability to put a cork on the genie&#x27;s bottle.<p>Both seem terrible to me.
    What good is space travel without freedom? What good is automation if there are
    incentives to maintain profit over stability? What good is the technology if any
    usage of it exposes you to fraud, violence, and blackmail at any moment?<p>Big
    fans of LLMs never ask &quot;to what end?&quot;, they repeat shallow near term
    &quot;wows&quot; without considering the second and third order effects. &quot;wow
    think about how good LLMs can spot cancer in scans!&quot;, great! but who will
    afford the scan without work? Will the overlords commit to luxury gay space communism?
    Or will they simply say &quot;tough luck&quot; and let that cancer fester?<p>Real
    AGI is incompatible with our current power structures, yet those current power
    structures desire the AGI. This cannot end well. Stagnation and stability would
    be preferable to the level of misery that would follow.'
