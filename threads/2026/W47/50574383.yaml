  author: FunkyMushroom
  text: 'The related economic concept here is the Broken Window Fallacy. Doing &#x27;redundant&#x27;
    work doesn&#x27;t improve the economy, because there&#x27;s an opportunity cost
    doing to anything. And replacing the need to &quot;fix broken windows&quot; or
    do now-AI-automated work would free up that opportunity cost. Which is how it&#x27;s
    worked for nearly all automation. (Though Computers are subject to long running
    debate about this. See the Solow Productivity Paradox)<p>The gigawatt-sized asterisk
    on all of this is that AI companies <i>have</i> to capture that $1 billion. Anthropic
    has to ten-fold increase it&#x27;s revenues or it goes bankrupt under it&#x27;s
    current commitments. It has to increase it&#x27;s revenues <i>another</i> 10 times
    to reach the $10,000,000,000,000&#x2F;yr revenue required to support it&#x27;s
    current valuation.<p>Anthropic put their Total Addressable Market at 35% of Global
    GDP (~$40 trillion&#x2F;yr). They&#x27;re planning to capture all of the money.<p>The
    <i>second</i> gigawatt-sized asterisk is that because of the fine handiwork of
    Mr. Huang, China has made very competitive AI models <i>available for free</i>,
    so the actual ability for AI companies to capture the value of the labour they
    displace ends up being quite limited. Thus a problem in the predictions: Something
    as to break, but it is as of yet unclear what that will be. Maybe Chinese AI will
    be banned, maybe Anthropic &amp; OpenAI go bankrupt.'
