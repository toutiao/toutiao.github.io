  author: giantrobot
  text: "&gt; Railroads disrupting a horse and wagon certainly would impact the salaries
    of wagon drivers.<p>Railroads didn&#x27;t do that. Horses and wagons remained
    in wide use after the advent of railroads as a last-mile mode of transport.<p>Before
    railroads moving masses of goods and people typically required navigable waterways.
    Either natural ones or canals. Railroads augmented waterways and allowed that
    mass transport to expand far from those waterways. The underlying steam engine
    also helped with expansion as a factory or processing plant could be built near
    a resource, be powered by a steam engine(s), and ship finished&#x2F;processed
    goods via those railroads to some market.<p>Railroads (and steam engines) <i>expanded</i>
    the economy far more than the supplanted any particular part. When they did supplant
    something the economic expansion largely provided new work for whoever&#x27;s
    job was obviated.<p>Knowledge work replacement by AI doesn&#x27;t necessarily
    offer the same economic <i>expansion</i>. If it replaces one type of knowledge
    work there&#x27;s little stopping it from replacing another type. OpenAI and Anthropic
    are only viable if they capture significant portions of the  US GDP. Anything
    less and they can&#x27;t even pay their debt obligations let alone actually make
    money.<p>There&#x27;s no real indication all those replaced workers could find
    any other jobs, certainly not ones that make as much money. And UBI will never
