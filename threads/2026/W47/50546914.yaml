  text: I agree with it moving away from the things you mentioned, and hope for the
    most part that a vision like yours is what happens.  Though fwiw I don&#x27;t
    think it needs to be a man vs machine type of humanism, I&#x27;m actually finding
    there&#x27;s a lot to learn about what makes us human by interacting with AI.
    I&#x27;ve been trying to give AI better memory over last several months, and it&#x27;s
    taught me just how much of our memory we basically make up, like how our vision
    fills in the gaps. And how closely tied memory is to self identity, things that
    help me understand myself and other people a lot better.<p>Just one example, the
    hardest part about memory is designing it to be stable enough to form a self identity,
    but flexible enough to change and grow. After working on that, it&#x27;s incredibly
    clear to me that changing our self story and attitude works and will change our
    brain - it has to or we&#x27;d basically die. Whereas before that was a vague
    help self thing that I wasn&#x27;t sure about either way.
