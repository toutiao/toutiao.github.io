  author: PaulRobinson
  text: 'I think the next 20 years are going to be fascinating as we see a 21st century
    equivalent of the 1960s hippy movement, rooted in humanism and prioritising the
    environment.<p>I wasn&#x27;t there (no, not like that, I wasn&#x27;t born yet),
    but my understanding is that the 1960s movements - there were several - are often
    reduced to a near caricature of being about drugs and sex.<p>They were a reaction
    to the horrors of war both real in WW2 ending 15 years earlier, and perceived
    as the Cold War developed. Escapism intertwined with wanting a giant reset switch
    on where &quot;the establishment&quot; had taken - and was taking - civilisation,
    produced a cultural shockwave that germinated a whole bunch of cultural revolutions
    across the spectrum from equal rights to music.<p>I get the sense something is
    stirring right now. Voting down data centres is not the end of the discontent.
    People are openly annoyed about war (again), about wealth inequality (again),
    about concentration of power and wealth into the hands of the corrupt few (again),
    but now are looking at the adoption of technologies over the last 20 years and
    wondering: what did we do?<p>People started abandoning social media some years
    ago. Already Facebook is seen as a place for boomers, not young people. TikTok
    was described by some younger, cooler people than myself the other day I was eavesdropping
    on as &quot;boring&quot; and &quot;pretty stupid&quot;. And then there&#x27;s
    the grassroots &quot;indie web movement&quot; that is starting to try and break
    out and blossom a bit.<p>You can see how that, and this deeper cultural touchpoint
    with what it means to want a real connection to other humans can drive us somewhere
    interesting, but I don&#x27;t know where.<p>From an AI standpoint, I&#x27;m pretty
    clear with my own take on the output of a lot of this stuff: I can&#x27;t be bothered
    to consume what you haven&#x27;t been bothered to create. I&#x27;m not interested
    in AI-created content for the most part, and even when I&#x27;m creating something
    myself (code, reports, whatever), using AI I&#x27;m using it as a drafting and
    copy-editing tool, not as a stand-in - I push everything through a huge amount
    of my own editing, not because I&#x27;m a luddite, but because <i>I add value</i>.
    So do you, so does everyone else.<p>I&#x27;m biased because of course I like my
    own hot takes, but I can imagine this being far from a niche view over the next
    few years.'
