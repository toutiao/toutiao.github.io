  author: forgetfreeman
  text: The reason this seems like a complex debate topic is the underlying premise
    requires massive cognitive dissonance and doublespeak to elide the inherent fractal
    stupidity.<p>1.) The basis of the world economy is labor. Assuming we take AI
    industry claims about potential impact of the technology seriously AI threatens
    this arrangement without offering anything new to replace it. Letting a handful
    of extra-national businesses threaten the world economy is stupid.<p>2.) AI improves
    through access to high quality training data. Using AI internally funnels your
    company&#x27;s institutional knowledge, proprietary data, and processes into the
    training pipeline for the AI tools you use. You are now paying to improve the
    tools your competitors use and building an existential threat to your business
    by setting the stage for your AI provider of choice to vertically integrate into
    your industry segment once sufficient training has been achieved.<p>3. Letting
    extra-national organizations operate the computer security equivalent of WMD with
    no oversight is a ludicrous national security threat.<p>4. On a warming planet
    with aging power distribution infrastructure and significant and growing local
    and regional water availability issues, massive increases to either power or water
    use is deeply unethical if not outright negligent. Doing both simultaneously solely
    to profit a handful of investors beggars belief.<p>5. The financials are fucking
    unhinged. If investment figures are to be believed the AI industry would have
    to capture 100% of the economic output of France, or if you prefer Ireland, Belgium,
    Sweden, Austria, Norway, and Denmark combined. Annually. Just to break even.
  score: 0
