  author: TFNA
  text: I hardly think TikTok and other short-form video is regarded as uncool now.
    Whenever I am on intercity trains and buses, I can look around and see people
    using it for the entire journey, one 30-second vid after another, particularly
    women in their teens and twenties who are drawn to beauty content and cosmetics
    influencers.<p>I also cannot share your optimism of a revival of the Sixties spirit.
    I obsessively collect books about the counterculture, and it is clear that people
    were then brought together into real-life communities through quaint things like
    live-music scenes or sheer boredom (not much else to do). That spur to real-life
    socialization is gone now. Live arts have been hollowed out by increasing rents,
    recorded music has become a matter of personal listening through earbuds instead
    of a communal practice, people have plenty of addictive slop to consume. While
    people do complain online about a dearth of real-life social opportunities, that
    usually doesn&#x27;t translate into any actual revival of such. Personally, I
    suspect the world is only going to go further into tech addiction and isolation,
    especially as the developing world comes increasingly onboard through affordable
    and plentiful mobile data.<p>&gt; And then there&#x27;s the grassroots &quot;indie
    web movement&quot; that is starting to try and break out and blossom a bit.<p>I&#x27;m
    sorry, but this is pure fantasy. I have followed indie-web stuff closely over
    the last decade (yes, people have sought a revival for that long already), and
    it has not been going anywhere. It is a tiny, tiny community and will eventually
    sputter out, as the browser becomes less and less a familiar tool to broad society
    in the age of dedicated apps.
