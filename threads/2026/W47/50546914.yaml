  author: chilmers
  text: Even in societies where social care is relatively well-funded, instances of
    neglect, abuse and substandard care are rife. This is not a problem that can be
    solved by throwing more money at human carers.<p>Providing full-time care for
    seniors is incredibly demanding, both physically and mentally. There is a limited
    pool of people with the requisite mindset and aptitude to do it well. Better renumeration,
    while certainly deserved by those people, won&#x27;t automatically increase the
    size of this pool, it may simply attract more ill-suited people to the profession.<p>And
    even with the most compassionate and skilled carers, needing to rely on other
    human beings for your physical needs results in a loss of dignity and independence.
    It also creates a power imbalance that will always make abuse or neglect a possibility.<p>Done
    right, automated care offers the possibility to provide high-quality physical
    care that is more convenient, private and dignified for the recipient than needing
    everything to be done by a human. It also allows for that pool of skilled human
    carers to focus on higher-value support without being spending the majority of
    the time addressing basic physical needs.
  score: 0
