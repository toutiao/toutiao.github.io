  author: altmanaltman
  text: The blog article doesn&#x27;t say they have written thirteen <i>unit tests</i>.<p>&gt;
    *GIMP already has unit tests*. A unit test checks one small part of the code,
    for example how GIMP reads an XCF file. But our unit tests were not opening a
    real window. So it coult not tell us if a dialog opens, or if a menu item did
    its job.<p>&gt; Note that GIMP *already had tests of GUI code*, usually interacting
    directly with the core code, and sometimes even simulating input devices’ events
    (pointer movements, clicks, drags…). But nothing can beat interacting with the
    real interface. Furthermore such legacy tests directly hijacking core code come
    with their own problems, such as breaking all too often (and not because they
    detected a bug), all while not being able to detect whole categories of bugs.<p>&gt;
    UI tests check the program as a whole, in the same way as you use it.
