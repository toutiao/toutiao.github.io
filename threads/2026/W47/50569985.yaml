    ## [Improved Graphical User Interface&nbsp;testing](/news/2026/11/16/gimp-ui-tests/ "Permalink to Improved Graphical User Interface testing")

    [Previous Post](/news/2026/11/02/gimp-3-2-8-released/)

    GIMP has a lot of intertwined menus, dialogs and tools. When we change a part of the interface, another may stop working and sometimes, the problem can be missed until a user reports&nbsp;it.

    To find these problems early, a new **testing** platform was implemented. A typical GUItest starts GIMP, clicks menus and buttons, and then checks the result. These tests run automatically each time we merge contributor&nbsp;changes.

    ### Why we need them[⁠](#why-we-need-them "Permanent link")

    GIMP already has unit tests. A unit test checks one small part of the code, for example how GIMP reads an XCF file. But our unit tests were not opening a real window. So it coult not tell us if a dialog opens, or if a menu item did its&nbsp;job.

    Note that GIMP already had tests of GUI code, usually interacting directly with the core code, and sometimes even simulating input devices’ events (pointer movements, clicks, drags…). But nothing can beat interacting with the real interface. Furthermore such legacy tests directly hijacking core code come with their own problems, such as breaking all too often (and not because they detected a bug), all while not being able to detect whole categories of&nbsp;bugs.

    UI tests check the program as a whole, in the same way as you use&nbsp;it.

    ### What the tests do[⁠](#what-the-tests-do "Permanent link")

    Each test starts a real GIMP and does one small task. Then it reads the result from GIMP. If the result is not correct, the test fails and tells us what went&nbsp;wrong.

    We have 13 tests at this time. They check&nbsp;that:

    - GIMP starts and shows its main&nbsp;window.
    - The Welcome dialog opens on the correct tab. It also stays hidden when you turn off “_Show on Start_”.
    - **File \> New** makes an image with the size you&nbsp;set.
    - **File \> Export As** writes a correct PNG&nbsp;file.
    - **Tools \> Swap Colors** swaps the foreground and background&nbsp;colors.
    - You can type a new foreground color in the **Colors** &nbsp;dialog.
    - You can add a layer and delete a&nbsp;layer.
    - **Undo** and **Redo** &nbsp;work.
    - **Zoom In** changes the zoom&nbsp;level.
    - A click on a tool button in the toolbox selects that tool. The test then uses the Bucket Fill tool on the&nbsp;canvas.
    - A change in **Preferences** is saved when you click OK.
    - A menu action, **Image \> Flatten Image** , does its&nbsp;job.

    ### How they work[⁠](#how-they-work "Permanent link")

    The tests do not need a screen. Each test starts a small, hidden desktop, runs GIMP in it, and removes it at the end. Because of this, the tests can run on our servers, where no screen is&nbsp;available.

    To find a button or a menu, the tests do not look at the pixels on the screen. They use the accessibility information that GIMP gives to tools such as screen readers. This has one more good result: when we make GIMPeasier to test, we also make it easier to use with a screen reader, hence improve the software&nbsp;accessibility.

    The tests use [dogtail](https://gitlab.com/dogtail/dogtail), a Python tool for UI tests. To run GIMP on a server with no screen, dogtail needed a new feature. We contributed this feature upstream, to dogtail itself, so other projects can use it&nbsp;too.

    At this time, the tests run only on Linux (both X11 and Wayland)&nbsp;since`dogtail` does not support Windows or&nbsp;macOs.

    Adding even these few simple tests considerably increases confidence that the GIMP build has worked, and also shows the test infrastructure is working and&nbsp;useful.

    ### Credits[⁠](#credits "Permanent link")

    - **Harsh Verma** wrote the UI tests and the new dogtail&nbsp;feature.
    - **Jehan** reviewed the UI&nbsp;tests.
    - **Michal Odehnal** reviewed the new dogtail&nbsp;feature.

    You can read the full change in[merge request !2909](https://gitlab.gnome.org/GNOME/gimp/-/merge_requests/2909).

    ### How you can help[⁠](#how-you-can-help "Permanent link")

    13 tests is a good start, but GIMP has many more dialogs and tools. If you want to help, you can write a test for the part of GIMP that you use the&nbsp;most.

    We wrote a guide that shows how to write a new test and how to find the cause when a test fails:[UI tests on developer.gimp.org](https://developer.gimp.org/core/debug/ui-tests/).

    We hope this work will help us find bugs earlier and keep GIMP working well for&nbsp;everyone.

    [Previous Post](/news/2026/11/02/gimp-3-2-8-released/)

