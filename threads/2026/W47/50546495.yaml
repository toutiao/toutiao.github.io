  author: hnedeotes
  text: "I think that for these situations you need to create a model of execution
    that can understand these interactions so that it can move beyond the linear mode
    of going through every option. \nI&#x27;m designing Aether Summon (<a href=\"https:&#x2F;&#x2F;aethersummon.com\"
    rel=\"nofollow\">https:&#x2F;&#x2F;aethersummon.com</a>) and currently building
    the native clients to play (which have the hearthstone&#x2F;arena like game play).<p>I
    haven&#x27;t yet introduced complex mechanics that can lead to infinite combos
    or exponential triggering, but for combos my idea is to have the human&#x2F;AI
    operator declare itself that it&#x27;s going to combo, so the game&#x2F;client
    register that intention and then &quot;records&quot; the actions that lead to
    the combo, in doing so, and for a combo to be declared, it has to do a few checks,
    e.g., on each full cycle of combo (that can be 1 or more sequences of actions)
    the state of the game had to move irrevocably to an increase in some stats (life
    increase, aether increase, creature count increase, etc) and the conditions to
    re-do the cycle are present. If this is true then it should mean that you&#x27;re
    in a combo, as the engine is deterministic (except for some random effects, but
    if they don&#x27;t target you then it should recognize the combo without issues,
    for instance if on each cycle you remove 3 scrolls out of your opponent&#x27;s
    tome, it doesn&#x27;t matter for the repeatability of the combo, it will just
    go down to 0 and future ones won&#x27;t do any &quot;side-effects&quot; in practice)
    it means you should be able to play the same cycle as many times as you wish,
    so when validated the user just needs to choose how many times he wants to repeat
    the cycle and then things are computed based on that.<p>This isn&#x27;t exactly
    the same problem as your&#x27;s but it&#x27;s close, if in this cycle it created
    X+n (where n is the number of times the cycle runs) creatures then it could calculate
    that if you chose to play the cycle N times, it would create a set amount of creatures
    and as such it could jump to the final calculation instead of going through each
    cycle independently and updating the state in each step.<p>I think something similar
    could be applied to the trigger stacking. You still need to take care of the other
    player&#x27;s possibility of interactions, but these can use a similar system
    where you announce to the other player that player 1 entered a combo state that
    ends on X step, you can ignore this is the player has no meaningful way of interacting
    with it, but otherwise offer the same thing, let the first cycle play as usual
    so the player can &quot;break&quot; the combo, or allow him to say, on iteration
    Y of the X that are going to be played, give me back control.<p>In your case I
    think you should try to first derive the mathematical properties and relationships
    between the triggers and the state - this is easier than for an open problem because
    you have the state after an interaction to derive them and although almost limitless
    it&#x27;s still limited the things that can happen in an MtG board.<p>#edit and
    regarding turing completeness or not, I think that the issue is that most of the
    rules and cool interactions where designed for a human to human play mode, with
    physical cards, time limited, etc. There&#x27;s plenty of rules in magic that
    a toddler understands but are extremely complex to model in a program - more so
    because the rules, their readings and interactions kept being iterated on throughout
    the game history and for a long time didn&#x27;t worry about consistency or its
    computability - that&#x27;s why this only happens with older editions, new ones
    dont suffer from the same issues... I would imagine due to already taking into
    account its practical computability..."
