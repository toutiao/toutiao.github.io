  author: olivergregory
  text: Every card, permanent, spell, etc. is an object in Magic. So I’m using a set
    multimap, with the key being the zone the card is in. Those filters you mention
    are actually cheap until you get unrealistic numbers like those that let you win
    this turn or the next one. You could create an index of the mana cost, the types,
    but that ends up being over-engineered.<p>I’ve tested using an ECS just for handling
    the core of the objects, but that lead nowhere event though it seemed a good fit
    from some perspectives.<p>I’m not surprised that an array is actually efficient
    after trying so many implementations.
