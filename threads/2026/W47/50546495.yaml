  text: 'In the 3 Card Blind format (played with only 3 vs 3 cards, the optimal play
    wins, short intro: <a href="https:&#x2F;&#x2F;youtube.com&#x2F;watch?v=29P243ggtU8"
    rel="nofollow">https:&#x2F;&#x2F;youtube.com&#x2F;watch?v=29P243ggtU8</a>), there
    exists a game in the tournament history which no one has been able to solve due
    to the sheer combinatorial explosion of possibilities, the Hangarback Walker game:
    <a href="https:&#x2F;&#x2F;youtube.com&#x2F;watch?v=hdaiKwKN50U" rel="nofollow">https:&#x2F;&#x2F;youtube.com&#x2F;watch?v=hdaiKwKN50U</a><p>It
    is also possible to represent small Turing machines with unsolved halting status
    (&quot;Cryptids&quot; <a href="https:&#x2F;&#x2F;wiki.bbchallenge.org&#x2F;wiki&#x2F;Cryptids"
    rel="nofollow">https:&#x2F;&#x2F;wiki.bbchallenge.org&#x2F;wiki&#x2F;Cryptids</a>)
    as a legally reachable board state (Example: <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20241222020126&#x2F;https:&#x2F;&#x2F;aesort.com&#x2F;antihydra"
    rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20241222020126&#x2F;https:&#x2F;&#x2F;aesort.co...</a>).
    It&#x27;s unlikely anyone will manage to do that in a tournament, but it is conceivable
    that the outcome of a specific game will remain undetermined by any judge (unless
    the math or computer science problem it represents is solved).<p>In practice,
    what makes MtG games in common formats (especially optimally) unsolvable is the
    large amount of hidden information, and combinatorial &quot;predictive firewall&quot;
    of random deck shuffles and the vast card pool.'
