  author: amluto
  text: 'Indeed.<p>My point is that the state is highly compressible (including the
    stack).  And that it should be possible to have an engine operate on the <i>compressed</i>
    state by resolving multiple copies of a repeat together.<p>It is indeed the case
    that the players have opportunities to respond to each individual event, which
    means that a strategy can have an exponentially large branching factor: a strategy
    can choose to let any prefix of a repeating unit through before responding. But
    I bet that, if there is a stack containing a consecutive block of 100M repeats
    of the same thing, there are not actually 100M interesting choices of which one
    to respond to.'
