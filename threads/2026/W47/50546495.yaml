  text: There&#x27;s a bit of an open source Magic renaissance going on lately, which
    I find really cool.<p>Forge has been around forever, but we&#x27;ve managed to
    get it running in the browser via WASM with Manabrew [1]. I&#x27;m one of the
    maintainers, and we&#x27;re mostly building it because we wanted a nicer way to
    play Commander with friends.<p>Meanwhile, Phase and Ironsmith are working on new
    engines in Rust, Gorge is building one in Go alongside a bot and cross-engine
    testing tools, and people are starting to collaborate across projects.<p>Magic
    is such a ridiculously difficult game to implement that I think it&#x27;s pretty
    amazing how many people are tackling it in their spare time.<p>If you&#x27;re
    into Magic and software engineering, come hang out with us. There&#x27;s a lot
