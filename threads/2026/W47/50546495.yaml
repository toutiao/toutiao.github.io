  author: '0x3444ac53'
  text: Ehhh, not quite. The tokens are their own independent objects that act identical
    to the original, but are removed from the game if they change zones. When anything
    enters onto the battlefield, it has to notify every other permanent on the battlefield
    that it has entered, and then those permanents triggers are all put on the stack
    in addition to the trigger that goes on the stack with whatever enters. The main
    thing is that either player can respond to the stack at any point even as things
    are resolving and coming off of it. And there is a very important difference between
    static abilities (usually called replacement effects) and triggered abilities.
    Replacement effects don&#x27;t use the stack, triggered abilities do.<p>Let&#x27;s
    say I have 128 scute swarms, and play a land. That land triggers all 128 scute
    swarms, causing them to create copies of themselves. That doesn&#x27;t just happen,
    instead, all 128 triggers go onto the stack. Priority then goes to the next player,
    who can respond (which will add another thing to the stack), before passing back
    to me. The top trigger on the stack resolves putting a creature on the battlefield
    (which might cause more triggers to be added to the stack), and then that priority
    passing happens again until the stack is empty.<p>So if my opponent has a card
    in play that says they gain one life whenever a creature I control enters, then
    that is also a triggered ability. So for all 128 creatures, they come into play
    1 at a time, and notify all other objects when they do. In this example, each
    time one of those original 128 triggers resolves, another trigger is added and
    my opponent gains 1 life, that has to go onto the stack, I get the opportunity
    to respond to it, and then it resolves, and we continue.<p>And if Scute Swarm
    is currently in the meta, then it would make sense to have a card that gains me
    life whenever a creature my opponent controls enters. So it would be smart to
    also have a lot of cards that trigger off me gaining life. Let&#x27;s say that
    I have two separate cards in play that do so.<p>So, 128 triggers on the stack,
    one resolves, my opponent gains a life, that resolves, two other triggers go on
    the stack, they both resolve. And then we continue this pattern with the other
    127 triggers. And importantly as the next one resolves and puts a creature into
    play, there is yet another permanent that has to be checked for triggers before
    we can continue.<p>Meaning that while 128 seems somewhat doable (nevermind that
    that number can and willget bigger), the actual number of triggers we have to
    resolve is 4 times higher, and each time one resolves we have to check the state
    of the entire game to see if we need to do anything else before we move on.
