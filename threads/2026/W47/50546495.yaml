  author: peter_d_sherman
  text: "&gt;&quot;One of the sources of my fascination with Magic, and, indeed, one
    of the reasons that a truly performant and <i>complete</i> software implementation
    of the game has yet to be achieved, is the nature of abilities in the game.<p><i>Abilities
    in Magic can compound exponentially</i><p>, and the amount of different possible
    interactions that can occur when any ability is triggered leads to a situation
    where although there may not be an unfeasible amount of state in principle, the
    amount of checks that are required to ensure that no further side effects must
    be put on the stack also grows exponentially, and as we all know, exponential
    behavior is an enemy of us mere mortal computer scientists.&quot;<p>This is not
    different than any other system...<p>In Computer Programming, for example, software
    features may affect other software features (or functions may affect other functions,
    or state may effect state, if you prefer), and they may compound linearly, multiplicatively,
    or exponentially (or conversely, not at all, or negatively linearly, negatively
    multiplicatively, or negatively exponentially).<p>&quot;The whole might be greater
    than the sum of the parts&quot;, as that old expression goes, but then again (conversely),
    it might also be exactly equal to the sum of the parts, or even (if parts detract&#x2F;subtract
    from other parts), <i>less</i> than the sum of the whole of the parts&quot;.<p>In
    Physics, waves can add to one another (aka &quot;constructive interference&quot;),
    not interfere with one another (if at the wrong direction&#x2F;angle&#x2F;frequency
    (etc.) relative to the medium), or subtract from one another (aka &quot;destructive
    interference&quot;).<p>But, exponential (aka &quot;compounding effects&quot; aka
    &quot;synergy&#x2F;synergistic&quot;) behaviors are possible in a variety of systems
    with multiple parts (heck, any system with multiple parts!)... including but not
    limited to such things as corporations, governments, militaries, trade, economics,
    video games, and even such things as education, both personal and nationwide...<p>I&#x27;d
    even go so far as to potentially believe that exponential, compounding effects
    are even responsible for every winner of every Nobel Prize, because exponential
    &#x2F; compounding effects <i>happen</i> in the space of <i>Ideas</i> as well...<p>That
    is, think of each possible Idea that could exist in the mind of someone -- as
    its own &quot;Magic: The Gathering&quot; card...<p>Now what happens when we (or
    the Nobel Prize winners, as the case may be) &quot;stack&quot; or compound several
    really good existing ideas together?<p><i>Idea A + Idea B + Idea C</i><p>What
    happens?<p>Well those ideas (and there may be more than 3 of them, often many
    more!) <i>stack</i> or <i>compound</i>...<p>That is, they become <i>exponential</i>
    in their effect; they generate <i>exponential</i> behavior!<p>(But, we can observe
    <i>exponential behaviors</i> in a variety of <i>systems</i>... M:TG is one example
    of such a system...)<p>Anyway, great article!"
