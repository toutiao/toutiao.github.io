  author: deathanatos
  text: |-
    &gt; <i>The tokens are their own independent objects that act identical to the original, but are removed from the game if they change zones.</i><p>This is still model-able with a qtx×type structure. Yes, a token Scute Swarm might be a different object vs. a Scute Swarm, but that&#x27;s still pretty finite:<p><pre><code>  ...
        1× Scute Swarm
        4× 1&#x2F;1 green insect token creatures
      256× Scute Swarm token creatures
    </code></pre>
    &gt; <i>Let&#x27;s say I have 128 scute swarms, and play a land. That land triggers all 128 scute swarms, causing them to create copies of themselves.</i><p>Sure, but we can represent this as &quot;the 256× Scute Swarm stack has triggers on when lands are played&quot;, so, in effect, we have two trigger registrations, but representing here 257 separate firings of that trigger. E.g., our stack would be something like,<p><pre><code>  ^ 256×Scute Swarm token creature landfall trigger
      |   1×Scute Swarm landfall trigger
    </code></pre>
    &gt; <i>Priority then goes to the next player, who can respond (which will add another thing to the stack), before passing back to me. The top trigger on the stack resolves putting a creature on the battlefield (which might cause more triggers to be added to the stack), and then that priority passing happens again until the stack is empty.</i><p>Now, this is <i>definitely</i> more complicated, but I think we can still do it with reasonable resource consumption. At the moment we execute that a player can respond to the stack, we let them do so, <i>or</i> let them declare (probably secretly) where in the stack to interrupt (including not at all). E.g., a player&#x27;s response could be summarized as &quot;I&#x27;ll permit all 256 Swarm landfall actions to resolve&quot;, and if all players do so, then we can batch resolve them. If any player chooses something different (such as &quot;I&#x27;m doing this now&quot;, or &quot;I&#x27;m permitting 20 to resolve, and then interrupting&quot;, then we can allow that (and cancel any other players&#x27; commands to permit the resolutions, as someone else doing something might cause them to reconsider, of course).<p>It would be pretty hard to say if this&#x27;ll hold over the <i>entire</i> game (there may be cases where batch consideration just does not work) but I think this is going to be &quot;good enough&quot; for most sane play.
