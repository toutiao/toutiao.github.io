  text: We&#x27;ve done our homework, at least as much as a small OSS project reasonably
    can :D<p>Forge and Cockatrice have both been around for a long time and have had
    to navigate legal concerns around card art and Wizards&#x27; trademarks. One approach
    has been to avoid distributing the artwork directly and let users fetch it separately
    from Scryfall. Forge itself is over 15 years old at this point.<p>We&#x27;ve taken
    a similar approach with Manabrew. We don&#x27;t bundle card art or Wizards&#x27;
    trade dress, the project is entirely free and open source, and people can self-host
    it. We&#x27;re also careful not to present it as an official Wizards product.<p>That
    doesn&#x27;t mean there&#x27;s zero legal risk, of course. But we&#x27;re not
    simply crossing our fingers either.
