  author: mochidusk
  text: I built Brewhaven[1], a card game harness with agents that can play MTG&#x27;s
    4-player commander.<p>I was curious to see how frontier models fare when it comes
    to playing a complex game AND if it can scheme, barter, bluff, banter, etc...<p>All
    the frontier models are very capable at gameplay but only Claude impressed me
    with table-talk&#x2F;diplomacy. They&#x27;re not superhuman at MTG yet, but the
    more interesting takeaway is this:<p>Current day AI is the ultimate translation
    machine; if you can translate something X -&gt; Y, you can also go in reverse
    and do Y -&gt; X; think text-to-image and image-to-text.<p>So if we have something
    that was trained on a corpus of all human data -&gt; plays MTG and scheme&#x2F;bluff&#x2F;make
    deals then it&#x27;s possible something like Brewhaven can generate trajectories
    that not only improve MTG gameplay but also general LLM performance on tasks that
    requires long-term planning (and sparse rewards). Basically, my belief is that
    if it can play MTG competently, it can generalize to do just about anything competently
    in other domains.<p>[1]<a href="https:&#x2F;&#x2F;x.com&#x2F;duskqho&#x2F;status&#x2F;2119890372663153140"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;duskqho&#x2F;status&#x2F;2119890372663153140</a>
