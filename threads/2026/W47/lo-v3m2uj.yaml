  content: "![100% Human Made - no AI used.](images/human-made-solid-black.png) ![100%
    Human Made - no AI used.](images/human-made-solid-white.png)\n\n# Signs of Triviality\n_Opinions,
    mostly my own, on the importance of being and other things._\n* * *\n\n* * *\n\n##
    The Claude Delusion\n\n| \n\nSomething weird happens to people who are successful.
    They start to think they're gods.\n\nActually accomplishing anything is obviously
    no strict pre-requisite of success. And maybe it's not so much \"being successful\",
    but rather \"being rich\". How do you become rich? Some people are just lucky.
    Lucky to have a physical talent, lucky to have parents able and willing to nurture
    your talent, and of course quite often lucky to have been [at the right place
    at the right time](https://nishankmagoo.medium.com/an-interesting-story-about-bill-gates-b5dc6b922c93).\n\nBeing
    lucky doesn't mean they didn't _also_ work hard. But even—especially!—the Paris
    Hiltons of the world, the children of Hollywood superstars, the crooks starting
    their corrupt empires with \"[a small loan](https://www.nytimes.com/interactive/2018/10/02/us/politics/donald-trump-tax-schemes-fred-trump.html)\"
    (or a share of an emerald mine) from their fathers—they all strongly believe that
    they _deserve_ their success and then conclude that anybody _not_ as successful
    only has themselves to blame.\n\nThis is especially the case for people in tech,
    where for years and years being good at programming has been equated with overall
    (and often: superior) intelligence, and those illusory superiority effects then
    amplify rampant Dunning-Kruger to quickly turn \"_I am good at writing code, and
    with some luck, I managed to be successful_\" into a train of thought that goes
    more like \"_I am successful. Success is not random, so I must deserve my success.
    I appear to be a genius, I've mastered coding, anything else is trivial. Ergo,
    I am good at **everything**._\"\n\n### Bill Gates, MD / PhD Biology\n\nLet's take
    Bill Gates as an example. Now, mind you, Bill Gates certainly has accomplished
    a lot, and his skillset and professional background includes without a doubt a
    lot of computer programming and various ruthless monopolistic business tactics.
    In [a recent New York Times interview](https://www.nytimes.com/2026/09/29/opinion/ezra-klein-podcast-bill-gates.html),
    he describes how he evaluated OpenAI's level of progress (emphasis mine):\n\n>
    And I was going down to see OpenAI on a regular basis to see the work they were
    doing, and I challenged them, saying: Hey, if you can read a biology textbook
    and pass the advanced placement exam — getting a perfect grade, which is a 5 —
    then you will have proven that you are reading. That is, encoding knowledge in
    an accessible form. And so it’s six months before the public release that Sam
    Altman, Greg Brockman and Ilya Sutskever come to my house and demonstrate to me
    getting a 5 on the A.P. exam, _even on questions that I had made up that it couldn't
    possibly have seen — very complex biology problems_. It was nearly perfect. So
    that was shock No.1.\n\nNow Bill Gates surely has shown an interest in biology
    and, through his work with the Bill & Melinda Gates Foundation, has probably read
    a lot of articles and research in this field. But the hubris to think himself
    a subject matter expert able to make up advanced, _novel_ questions in a scientific
    field outside his own and suitable to assess AI's true capabilities and then being
    \"shocked\" that it could answer these questions makes my point.\n\nAlthough,
    what really cooks his noodle is the idea that AI can do what he used to do: write
    code.\n\n> And then late last year, when Anthropic's Claude coding models got
    super good, I could see that they are _as good as I am_ — it’s significantly my
    most developed talent, because I was obsessed from age 13 to 24 as to whether
    I could write code as good or better than anyone. That’s another moment where
    I went: _This is incredible_. That the capability of doing long-running, complex
    tasks has now gotten to the point that they are _superhuman_ at writing code and
    in finding flaws in code.\n\nTake note of the emphasis I added: the very notion
    that something else could be \"_as good as I am_\" is, first of all, hard to believe
    and secondly necessarily means that it's \"_superhuman_\". That man is not lacking
    self-esteem, no sirree, Bob.\n\nLikewise, this is also where many of the tech
    bros appear to be [losing their minds](everybodys-lost-their-minds.html), and
    this thinking (\"Anything approaching my skill level is superhuman.\") explains
    a lot about how we ended up with both stories of ultimate doom and human extinction
    as well as the utopian nirvana where AI solves all of mankind's problems (well,
    all of the _billionaires'_ problems, which appear to largely converge on [pesky
    mortality](https://www.motherjones.com/politics/2024/01/alcor-cryonics-peter-thiel-billionaires-dynasty-trusts-aging-disease-death-immortality/)).\n\n###
    Revenge of the Nerds\n\nFor most tech nerds, being good at programming computers
    was a differentiating skill. It was weird, normies didn't understand it at all,
    you spoke your own language (languages!), you could make a computer _do things_.
    You understood how the internet works, and anything that's not working was clearly
    written by complete and utter morons, and you could easily write this yourself
    in an afternoon if you wanted to.\n\nSo now you've created a computer program
    that can do the same thing. Your mind boggles! And it speaks! It confirms you,
    it praises you, it tells you that you're brilliant—clearly evidence that it is
    infallible itself. But now imagine if it was _better_ than you. What at first
    seems inconceivable then must strike fear and awe in your heart, for you have
    created a [powerful monster with direction and purpose all its own](https://genius.com/Bad-religion-chimaera-lyrics).
    (And you sure have consumed enough pulpy science fiction to know that your creature
    is coming for you eventually.)\n\n\"Can you imagine a Beowulf cluster of these?\"
    was an old Slashdot meme before memes were a thing. But the notion of having an
    army of minions to do your bidding has always appealed to the nerds looking to
    assert their superiority, and thus we arrived at \"agents\". \"Swarms\" of \"autonomous\"
    \"agents\".\n\nThis narrative of agency conveniently also relieves you of responsibility.
    You didn't fail to properly restrict a potentially malicious program you trained
    to hack other systems with persistence. No, the \"agents\" went \"rogue\". You
    have summoned powerful daemons indeed. Daemons that can produce code faster than
    you (gasp!), code you don't fully understand (although of course you could, you
    just don't want to, you don't have time, you have too much going on, what with
    your homegrown heavily customized harness). It becomes obvious quite quickly that
    this, then, must be SUPERINTELLIGENCE. Superintelligence that COULD KILL US ALL!\n\n![A
    dozen or so daleks](images/daleks.jpg \"Exterminate!\")\n_Finally got my agent
    harness set up just the way I like it._\n\n### Power corrupts etc.\n\nI picked
    on Bill Gates above to illustrate the [overconfidence effect](https://en.wikipedia.org/wiki/Overconfidence_effect),
    but of course there is no shortage of much more [exaggerated egos](https://www.forbesmiddleeast.com/industry/healthcare/elon-musks-false-covid-predictions-a-timeline)
    making bold [statements outside](https://www.cnet.com/tech/tech-industry/elon-musks-submarine-not-practical-for-thai-cave-mission-rescue-head-says/)
    of (or even [within](https://www.digitaltrends.com/computing/metaverse-will-have-legs/))
    their purported area of expertise, reflecting a complete and utter inability to
