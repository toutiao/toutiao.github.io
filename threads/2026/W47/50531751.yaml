  author: mirrir
  text: |-
    No I did read further. I just don&#x27;t think your perspective is correct. Baidu has doubled its cloud revenue YoY and so has Xiaomi&#x27;s AI division. They <i>are</i> making money. They are worried that they will not be able to sustainably maintain that growth.<p>&gt; Baidu and Xiaomi experiment with models. Test the efficacy of different models. Get an idea of the relative economics of different models. Maybe create a model of their own to see if they can improve the business case in one dimension or another.
    &gt; Baidu and Xiaomi are trying to figure out how to make money. Not how to make models. Making models is not their business and they don&#x27;t want to be in that business. China is full of dime a dozen PhDs who can make models. They don&#x27;t want to do that, they want to make money. That&#x27;s the point.<p>Both are currently in the business of providing efficient compute and deployment platforms as well as first party models. From Baidou&#x27;s perspective their biggest competition in the space is squarely Alibaba who has attributed a significant amount of their massive 45% growth this quarter to Qwen and their compute platform in general.[1] Making money and making models are not opposed, but the structure of the business matters significantly.<p>&gt; What they&#x27;re saying is that, in their role as customers for these models, they&#x27;re a bit confused about the business case. I think that&#x27;s a fair statement. They&#x27;ve presumably put a lot into finding out how to make money out of these models, and presently, the returns are not there with respect to the bottom line. Additionally, their experiments have given them enough background to feel comfortable asking, openly, where exactly everyone else feels the returns will come from?<p>I don&#x27;t think I&#x27;d characterize their positions as this. The returns <i>are</i> there. Their quarterly financials explicitly say so. From the statements in the article, they are concerned with the continuation of their downstream customers&#x27; spending. In Baidu&#x27;s case it hasn&#x27;t been enough to offset their advertising losses. As providers they need better downstream products and actual value adds, otherwise they will not be able to continue providing the quarterly guidance of growth that they have been communicating to their investors.<p>&gt; But it&#x27;s clear from their statements that they really don&#x27;t want to because it&#x27;s, currently, a terrible business.<p>It is not.<p>[1]: <a href="https:&#x2F;&#x2F;www.alibabagroup.com&#x2F;en-US&#x2F;document-2027233133950140416" rel="nofollow">https:&#x2F;&#x2F;www.alibabagroup.com&#x2F;en-US&#x2F;document-2027233133950140...</a>
