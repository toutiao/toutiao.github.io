article:
  url: https://www.hntrends.com/2026/november.html
  title: '"Who is Hiring?" postings stuck near 12-year lows as AI reaches half of
    all jobs (November 2026)'
  fetch_status: success
  content: "# \"Who is Hiring?\" postings stuck near 12-year lows as AI reaches half
    of all jobs (November 2026) \n\nNovember 2026 Hacker News Hiring Trends\n\n###
    November Highlights\n\nSaturday, November 14, 2026\n\nIt's been two and a half
    years since the last update, so this one covers a lot of ground. As of November
    14, [November's thread](https://news.ycombinator.com/item?id=50338728) has 244
    job postings, down 37% from 387 at the same point last year. Every thread since
    July has landed between 224 and 255 postings, and August's 224 was the fewest
    since January 2014. So far 2026 averages 287 postings a month, the lowest yearly
    average since 2013.\n\nAt the same time, AI is now mentioned in more than half
    of all postings (51.6%), up from 30% two years ago.\n\n#### AI is in half of all
    postings\n\n[AI](?compare=AI) appears in 51.6% of November's postings, second
    only to Remote. It crossed 50% for the first time in June 2026. Two years ago
    it was 30%.\n\nThe work itself is shifting toward agents. [AI agents](?compare=AI+Agents)
    (including \"agentic\") appear in 14.8% of postings, ahead of [LLMs](?compare=LLM)
    at 10.7%. [MCP](?compare=MCP) barely existed a year ago (0.3%) and is now in 4.5%
    of postings, the biggest climb in this month's rankings. Meanwhile, the older
    [machine learning](?compare=Machine+Learning) label slipped from 14.8% to 11.5%.\n\n[Compare
    AI, AI Agents, LLM, and Machine Learning](?compare=AI&compare=AI+Agents&compare=LLM&compare=Machine+Learning)\n\n####
    Top 10 Programming Languages\n\nPython (22.1%) and TypeScript (17.6%) still lead,
    though TypeScript is down from 22.5% a year ago. Rust has climbed to #3, appearing
    in 8.2% of postings, up from 4.9%, and has been ahead of Go in four of the last
    five months. C++ and Java are up too, but on small numbers (14 and 11 postings).\n\n1.
    [Python](?compare=Python)\n2. [TypeScript](?compare=TypeScript)\n3. [Rust](?compare=Rust)\n4.
    [Go](?compare=golang)\n5. [C++](?compare=C%2B%2B)\n6. [Java](?compare=Java)\n7.
    [JavaScript](?compare=JavaScript)\n8. [Ruby](?compare=Ruby)\n9. [C](?compare=C)\n10.
    [Kotlin](?compare=Kotlin), [Scala](?compare=Scala), [Swift](?compare=Swift) and
    [Elixir](?compare=Elixir) (tied, 2 postings each)\n\n[Compare the top 10 programming
    languages](?compare=Python&compare=TypeScript&compare=Rust&compare=golang&compare=C%2B%2B&compare=Java&compare=JavaScript&compare=Ruby&compare=C&compare=Kotlin)\n\n####
    Front-end roles keep shrinking\n\nFigures in this section are three-month averages,
    which smooth out month-to-month swings, so they differ a little from the November-only
    numbers in the chart and tables. [Front End](?compare=Front+End) has had the steepest
    fall of any role label: from 27% of postings in early 2022 to 6.6% now, and from
    15.6% a year ago. [Full Stack](?compare=Full+Stack) (26.2% to 20.1%) and [Back
    End](?compare=Back+End) (23.6% to 18.8%) also dropped over the past year, most
    of it in the last few months.\n\nSeniority mix has been steadier. [Senior](?compare=Senior)
    has stayed around 30% for years, [Staff](?compare=Staff) has roughly quadrupled
    since 2019 to about 12%, and [Junior](?compare=Junior) remains rare at around
    3%.\n\n[Compare Full Stack, Back End, and Front End](?compare=Full+Stack&compare=Back+End&compare=Front+End)\n\n####
    Remote, Onsite, and Hybrid\n\nWork arrangements have barely moved. [Remote](?compare=Remote)
    is in 55.7% of postings, [Onsite](?compare=Onsite) 26.2%, and [Hybrid](?compare=Hybrid)
    17.2%, all within two points of last November.\n\n[Compare Remote, Onsite, and
    Hybrid](?compare=Remote&compare=Onsite&compare=Hybrid)\n\n#### Changes to the
    data\n\nNew terms this month: AI Agents, LLM, MCP, RAG, LangChain, Anthropic,
    pgvector, Vector Database, Bun and Deno. Every thread back to 2011 is re-analyzed
    on each run, so their full history is included.\n\nI also fixed a bug where a
    few terms with alternate spellings didn't count their own name (for example, \"Next.js\"
    was only counted when written \"NextJS\"). Next.js, NestJS, WebAssembly, Front
    End and Back End are higher across all months than in earlier posts. The December
    2011 thread, which has a single posting, is no longer included.\n\n### Rankings
    and movers\n\n| Tech | Rank | Last Month | Change | Last Year | Change |\n| ---
    | --- | --- | --- | --- | --- |\n| [Remote](?compare=Remote) | 1 | 1 | 0 | 1 |
    0 |\n| [AI](?compare=AI) | 2 | 2 | 0 | 2 | 0 |\n| [Senior](?compare=Senior) |
    3 | 3 | 0 | 3 | 0 |\n| [Onsite](?compare=Onsite) | 4 | 4 | 0 | 5 | +1 |\n| [Python](?compare=Python)
    | 5 | 5 | 0 | 8 | +3 |\n| [Full Stack](?compare=Full+Stack) | 6 | 6 | 0 | 4 |
    -2 |\n| [Back End](?compare=Back+End) | 7 | 10 | +3 | 6 | -1 |\n| [TypeScript](?compare=TypeScript)
    | 8 | 9 | +1 | 7 | -1 |\n| [Hybrid](?compare=Hybrid) | 9 | 8 | -1 | 10 | +1 |\n|
    [React](?compare=React) | 10 | 7 | -3 | 9 | -1 |\n| [Cloud](?compare=Cloud) |
    11 | 19 | +8 | 19 | +8 |\n| [Security](?compare=Security) | 12 | 13 | +1 | 17
    | +5 |\n| [AI Agents](?compare=AI+Agents) | 13 | 11 | -2 | 15 | +2 |\n| [Postgresql](?compare=Postgresql)
