  author: georgemcbay
  text: Deskilling and reduction in need for overall developers will be, IMO, coupled
    for the software labor market.<p>If you previously had a dozen software developers
    with deep niche knowledge of different areas (a few backend, a few front end,
    a database expert, a couple of mobile devs, whatever) now you can probably get
    by with 3 or 4 people running agents who lack deep knowledge of all of these areas
    but know enough to get by driving agents.<p>So, yes, there is deskilling going
    on, but it is also very likely to be reducing overall headcount significantly
    because more software can be created by less people because of less need to be
    skilled in very niche areas of development.<p>I don&#x27;t really buy into the
    Jevons paradox theory that the profession will be fine because things will equalize
    or expand with an explosion in new software being built.  Yeah, there will be
    even more software being built going forward but most of it will be built by people
    who were never historically software developers (and wouldn&#x27;t have become
    that had they aged into the labor market sooner). They&#x27;ll just skip the old
    &quot;software development market&quot; entirely to get that new software out.<p>In
    the end, AI won&#x27;t eliminate every software job, but even if just eliminates
    25% (let alone the 75% in my limited example) that&#x27;s still an economic crisis
    that leaves the profession in ruin for most people who currently rely on it for
    a living.
  score: 0
