  author: delichon
  text: |-
    <p><pre><code>  Jevons paradox ... is an economic phenomenon said to occur when technological improvements that increase the efficiency of a resource&#x27;s use lead to a rise, rather than a fall, in total consumption of that resource. Greater efficiency reduces the amount of the resource needed per application, lowering its effective cost; if demand is sufficiently price elastic, this induces demand, frequently resulting in a net increase of total resource consumption. -- https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Jevons_paradox
    </code></pre>
    With AI literally fewer coders are needed per application. Coders are more efficient. Since demand for coder-hours is price elastic, this induces demand. That doesn&#x27;t necessarily result in a net increase in consumption of a resource, but it frequently does. If you think AI will tank the programmer job market, the existence of the Jevons effect should at least add uncertainty.
