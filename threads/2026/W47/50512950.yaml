  author: rubicon33
  text: Exactly.  I have seen this EXACT situation unfold at my workplace.  We are
    100% AI invested, and have not hired a single person in the last year.  Some have
    left, and we&#x27;ve had zero need to replace them.  Velocity of features is at
    an all time high, and its driven by the smallest team we&#x27;ve ever had.<p>Nobody
    is handwriting code.<p>I suspect anyone saying AI isn&#x27;t going to reduce headcount
    or pay, has not seen a full AI shop at work.  We have integrated AI tools EVERYWHERE.  Something
    happens in our software stack, it&#x27;s audited first across the entire code
    base, by AI agents.  These AI agents have confidence levels based on our own internal
    direction and instrumentation, and are able to fix code and push to production
    without ANY human involvement.<p>Slop, I hear people say.  Nope.  We&#x27;ve improved
    our products dramatically over the last year.  We&#x27;ve shipped more code than
    ever, and have the actual metrics to prove that we are performing better across
    the board.<p>This is why I can so confidently say AI will be detrimental to the
