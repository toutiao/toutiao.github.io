  author: tzs
  text: China&#x27;s ultra high voltage grid is DC for long distance transfer from
    remote western and northern hubs to eastern cities. This uses 24 long lines with
    1 at 1100 kV and the rest at 800 kV. It has about 40000 km of lines.<p>They also
    have 20+ ultra high voltage AC lines (1000 kV) for shorter region interconnects.<p>Historically
    long transmission lines were AC because long lines have to be high voltage to
    reduce losses¹. Boosting AC voltage for high voltage transmission can be done
    with a transformer. DC requires more complicated equipment which wasn&#x27;t really
    commercially feasible until early this century.<p>¹Losses are proportional to
    current. Power is current x voltage. To transmit a given amount of power the higher
    the voltage the lower the current, and hence the lower the losses.
