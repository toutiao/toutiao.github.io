  author: toomuchtodo
  text: This study is seven years old, but explains the nuance of transmission costs
    in the US. Broadly speaking, the closer you can get low carbon generation to demand
    and load centers and avoid long haul transmission, the better (check out <a href="https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20261114074622&#x2F;https:&#x2F;&#x2F;www.eia.gov&#x2F;electricity&#x2F;monthly&#x2F;images&#x2F;figure_6_01_c.png"
    rel="nofollow">https:&#x2F;&#x2F;web.archive.org&#x2F;web&#x2F;20261114074622&#x2F;https:&#x2F;&#x2F;www.eia.g...</a>
    | yellow is solar, purple are battery storage).<p><a href="https:&#x2F;&#x2F;emp.lbl.gov&#x2F;news&#x2F;new-national-lab-study-quantifies-0"
    rel="nofollow">https:&#x2F;&#x2F;emp.lbl.gov&#x2F;news&#x2F;new-national-lab-study-quantifies-0</a><p><a
    href="https:&#x2F;&#x2F;emp.lbl.gov&#x2F;publications&#x2F;improving-estimates-transmission"
    rel="nofollow">https:&#x2F;&#x2F;emp.lbl.gov&#x2F;publications&#x2F;improving-estimates-transmi...</a><p><i>Improving
    estimates of transmission capital costs for utility-scale wind and solar projects
    to inform renewable energy policy</i> - <a href="https:&#x2F;&#x2F;linkinghub.elsevier.com&#x2F;retrieve&#x2F;pii&#x2F;S0301421519305816"
    rel="nofollow">https:&#x2F;&#x2F;linkinghub.elsevier.com&#x2F;retrieve&#x2F;pii&#x2F;S03014215193058...</a>
    - December 2019<p>- Estimating the overall costs of transmission needed to integrate
    variable renewable energy (VRE) onto the grid is challenging. An improved understanding
    of these transmission costs would support electricity system planning as VRE penetrations
    increase. This paper brackets VRE transmission capital costs using multiple approaches
    based on interconnection studies, actual transmission projects, capacity-expansion
    simulation models, and aggregated U.S. VRE-related transmission expenditures.
    Each approach possesses advantages and drawbacks, and combining the approaches
    lends confidence to the results. The resulting range of average levelized VRE
    transmission costs is $1–$10&#x2F;MWh, which is generally lower than earlier estimates
    in the literature. These transmission capital costs can increase the direct plant-level
    levelized cost of VRE by 3%–33%, based on levelized costs of energy of $29–$56&#x2F;MWh
    for utility-scale wind and $36–$46&#x2F;MWh for utility-scale solar. As VRE deployment
    continues to expand, policy makers can use this information to (1) assess the
    benefits of transmission avoidance and deferral when comparing distributed energy
    resources versus utility-scale projects, (2) evaluate the potential costs of large-scale
    public transmission investments, and (3) better analyze system-level costs of
    utility-scale VRE technologies. Future research can expand on the framework presented
    here by providing a review of operation and maintenance costs for transmission
    systems.<p>I don&#x27;t have a link handy at the moment, but there is also a project
    to use machine learning to maximize the power existing transmission lines can
    carry using real time monitoring of their health metrics to push harder towards
    maximum safe utilization (versus more conservative limits).
