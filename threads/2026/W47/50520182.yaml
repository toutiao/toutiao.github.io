  author: scblock
  text: Most utility scale multi-megawatt solar is designed for 1500 VDC, so depending
    on weather conditions string voltage will be in the 900-1200 VDC range, typically.
    Those will have string lengths in the mid-20s instead. The exception is thin film
    modules from First Solar, which have higher per-module voltage and will probably
    have 6 strings instead.<p>In my experience the cables will probably run straight
    into the combiner box, and then into the ground without additional protection,
    then over to the nearest inverter and transformer.<p>I have also seen a few projects
    with the cables run above ground on hangars, though this is less common.
