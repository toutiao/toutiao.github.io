  author: SAI_Peregrinus
  text: To briefly describe why:<p>Current flowing through a conductor produces heat.
    This scales <i>quadrtatically</i> with the current, and linearly with the resistance.
    The resistance depends on the cross-sectional area of the conductor and its length.
    Long wires have more resistance for the same size of wire.<p>Transformers can
    raise the voltage &amp; lower the current, or the opposite, in direct proportion.<p>So
    you want long-distance transmission to use the highest voltage and lowest current
    possible, so that the least amount of power is wasted heating up the wires, and
    so that you don&#x27;t have to have ridiculously thick wires.<p>Transformer efficiency
    rises with frequency. Standard AC grid frequency is quite low, &lt;100Hz everywhere
    in the world. For small scale utility transformers that&#x27;s not a big problem,
    but for transmitting a <i>lot</i> of power the transformer efficiency matters
    much more. When a transformer heats up that heating happens all throughout it,
    but heat only dissipates on the surface, so bigger transformers get harder &amp;
    harder to cool.<p>Recent (last decade or two) advances in semiconductor design
    has enabled some really big transistors which can switch a heck of a lot of power
    very quickly. Switching DC power on &amp; off to create a square wave creates
    enough changing current that transformers can use it. Transformers don&#x27;t
    strictly need AC, they just need changing current through them.<p>So it ends up
    being more efficient to convert AC from generators to DC, switch it on &amp; off
    really fast to create a really high frequency square wave, run that through a
    step-up transformer designed for that high frequency, and smooth the result out
    with some big capacitors to clean up the DC. Then that high-voltage DC can be
    transmitted with relatively low losses on relatively small cables, and go through
    a similar process to convert down to low(er)-voltage AC at the receiving end.<p>That
    wasn&#x27;t possible until recently, the transistors to switch that much power
    fast enough didn&#x27;t exist. Thus the existing grid mostly being AC, with HVDC
    preferred for new lines.
