  author: KaiserPro
  text: All the cables need to be managed. mainly because you can&#x27;t keep all
    the bastard animals out.<p>Solar panels are joined together into &quot;strings&quot;
    which means that you have something like 12-18 panels in series. Those strings
    are joined into a combinerbox that takes 8-15 strings and join them into one big
    lump.<p>Each string is &gt;500volts DC. So they need to be protected from both
    sun and animals.<p>The main animal oopsey is where the strings enter the string
    combiner box. the stings come straight out the back of the panels, run along the
    mounts and then into the combiner at the end of the row. When the strings emerge
    into the combiner box, they are protected by a metal cage.<p>The big fat combined
    cable then goes into a ground conduit to go to the inverter.
