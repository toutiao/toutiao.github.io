  author: hatthew
  text: 'Some people are comparing the AI revolution to the industrial revolution
    as evidence that AI is a good thing. I think this comparison fails for many reasons.<p>My
    most relevant point is that solving the Riemann hypothesis is not like a large
    industrial project such as a canal. It&#x27;s a work of art. Imagine a team of
    a few master craftspeople working for years on a large, incredibly detailed and
    intricate sculpture. Now imagine they are close to finished, but someone comes
    along and 3D prints a finished version of their sculpture in a week. That&#x27;s
    what is happening with RH right now.<p>Another point is that humans are generally
    weak but intelligent. The industrial revolution replaced our weakness with machines.
    It made sense to be glad that machines could shore up our weakness. But our intelligence
    is something we should be proud of.<p>Another point is that, very roughly, there
    are two types of jobs: physical and mental. The industrial revolution replaced
    our physical jobs and left society with the capacity to do many more mental jobs.
    But the AI revolution is replacing those, and there&#x27;s no obvious category
    of jobs left for us.<p>The final point I&#x27;ll mention here is that the industrial
    revolution wasn&#x27;t all sunshine and roses. There used to be industries of
    artisans making high quality products. The industrial revolution didn&#x27;t just
    replace unglamorous jobs of digging holes and the like, it replaced relatively
    &quot;virtuous&quot; jobs (such as the village cobbler) with mass-produced goods
    of less quality. A high quality and reliable custom-fit pair of shoes is less
    accessible today than centuries ago (measured by factors like number of days wages,
    ease of finding someone to make them, and trust that the result will be good).<p>I
    think the AI revolution has the potential to be a good thing if we use it to drive
    a utopia where &quot;artist&quot; is a reliable career, but my bet right now is
    that the future is heading more dystopian than utopian.'
