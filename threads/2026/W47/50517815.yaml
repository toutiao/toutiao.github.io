  author: jiggawatts
  text: 'What Linux admins don’t “get” about Active Directory was the superpowers
    granted by its Group Policy feature.<p>Everyone loves to harp on about how terrible
    the Registry is, but that’s missing the forest for a tree.<p>The registry + GPO
    engine is a strongly typed and <i>layered</i> settings engine with:<p>Machine,
    Machine Policy, User, and User Policy layered on top of each other, consistently,
    through pretty much every native app!<p>More importantly, policy would apply or
    unapply dynamically and cleanly.<p>You could move a laptop to a different office
    and soon as it connected the wifi its set of configured printers would change,
    its outbound proxy could be reconfigured, etc.<p>More importantly: Microsoft engineers
    of the era <i>put in the work</i> of writing up thousands of settings in template
    files that shipped with Windows, with simple checkbox UI controls and paragraphs
    of descriptions in <i>every language!</i><p>If you think your terrible “settings
    automation” tool is a viable alternative just ask yourself this question: does
    it “put the work in” or does its user have to?'
