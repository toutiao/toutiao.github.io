  author: bodeadly
  text: |-
    A central point of this article seems to be claiming that adding a device in AD is an administrative bottleneck compared to cloud.
    If that is the claim, it is false.
    By default Authenticated Users have an &quot;Add workstations to domain&quot; capability (AKA ms-DS-MachineAccountQuota attribute on their account) that allows a regular user to create up to 10 machine accounts with zero admin intervention.<p>Machine accounts have limited rights compared to regular users.
    AD provides fine grained distributed policy and cert managment.
    After decades of emperical refinement, AD is often superior to what the cloud offers including Entra.
    In environments with many PCs that require centrally managed policy, AD is still relavant and probably required.<p>I think it is also true that there are and always will be many companies that simply cannot expose these PCs to the cloud either because they&#x27;re working with data that cannot be in the cloud like legal files, finanical documents, schematics or they cannot risk being tethered to the Internet.
    You know that little micro PC attached to the cart in every exam room in a doctors office?
    There is a 99% chance it is joined to AD.
