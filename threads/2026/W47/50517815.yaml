  author: EvanAnderson
  text: 'Group Policy is so immensely handy. It was a game-changer feature for provisioning
    and maintaining Windows clients and servers from its introduction in Windows 2000.
    When Active Directory (AD) was brand new I became immediately enamored with Group
    Policy. &quot;Superpowers&quot; is definitely the right way to put it.<p>I had
    a hard time getting excited about Ansible, Puppet, Desired State Configuration,
    etc, because I was provisioning machines with Group Policy in 2001. Load Windows,
    join the domain, and the machine gets configured (software loaded, settings locked-in,
    defaults overridden, etc).<p>Today I&#x27;m provisioning tons of Windows VMs this
    way: PXE boot the VM to an unattended Windows setup that ends up joining the domain
    and getting all its configuration. It makes disposable VM instances and horizontal
    scaling Windows VMs a breeze.<p>The now-defunct Likewise Open product (<a href="https:&#x2F;&#x2F;github.com&#x2F;vmware-archive&#x2F;likewise-open"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;vmware-archive&#x2F;likewise-open</a>)
    extended Group Policy to Linux machines. I&#x27;d lost touch with the product
    but it looks like it got GPL&#x27;d. It was handy, albeit I don&#x27;t have the
    experience with it like I had with the native Windows Group Policy client. I only
    encountered it in one environment and, at the time, it was commercially licensed.<p>I&#x27;m
    not in love w&#x2F; the CIFS-based portion of Group Policy, but there&#x27;s nothing
    stopping anybody from extending the AD schema and using the AD LDAP server to
    deliver policy settings (or any other mechanism). Using the filesystem to deliver
    settings always seemed like a hack born of expedience.'
  score: 0
