  author: breakwaterlabs
  text: 'gMSAs solve several problems.<p>Password rotation is an issue because the
    necessity of <i>using</i> a credential incentivizes its insecure storage and low
    entropy so that ops teams can onboard new services. This in turn necessitates
    rotation to limit the danger of exposure or kerberoasting (bruteforcing the TGS).<p>gMSAs
    ensure that credentials<p>- Are frequently rotated with no coordination or admin
    involvement<p>- Are of sufficient entropy to be non-bruteforceable<p>- are infeasible
    to store insecurely<p>They also robustly solve the question of tracking use: the
    gMSA states where it may be used and what principals may retrieve the credential,
    secured with a machine password (which, itself, carries the above security properties).'
  score: 0
