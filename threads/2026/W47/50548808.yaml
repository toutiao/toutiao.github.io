  author: krisoft
  text: "&gt; modeling the finished product in 3d is going to be a significant fraction
    of the work of actually carving it in stone.<p>Of course. But what is the problem
    with that?<p>We have the same situations with many other things. With printers:
    It takes way more effort to write a book worth printing than the actual effort
    of putting in the reams of paper into the printer and hitting the print button.
    Same with 3d printing. People spend days, weeks, months, or years modelling something
    interesting and then it is relatively easy to get it printed once it is designed.<p>&gt;
    Can it sculpt something that will command your attention in reverent, slack-jawed
    awe for hours? I don&#x27;t see it happening.<p>I don’t see why it couldn’t carve
    a model which evoke those emotions into stone. And i used my words deliberately
    there. Because i would call the person who made the model the sculptor. I wouldn’t
    say that the machine sculpted anything.<p>The machine is a machine. It carves
    the stone. We can talk about how accurately it does what it does, we can talk
    about the surface quality it leaves behind. We can even talk about what geometries
    it can or can’t tackle due to the particular arangement of the arm and the spindle.<p>If
    those “datasheet properties” are good enough, then all you need to do is get a
    good artist who is handy with some modelling software let them play around with
    it and you will get your “awe inspiring”."
