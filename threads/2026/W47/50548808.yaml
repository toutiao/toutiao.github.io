  author: aanet
  text: 'This is fascinating!!<p>I&#x27;m both awestruck at the at the final sculptures,
    as much as I am fascinated by the (hi-tech) robotic carving aspects of it.<p>The
    Feynman statue looks awesome (<a href="https:&#x2F;&#x2F;www.monumentallabs.co&#x2F;work?project=Richard+Feynman"
    rel="nofollow">https:&#x2F;&#x2F;www.monumentallabs.co&#x2F;work?project=Richard+Feynman</a>
    ) as does Athena (<a href="https:&#x2F;&#x2F;www.monumentallabs.co&#x2F;work?project=Athena+Promachos"
    rel="nofollow">https:&#x2F;&#x2F;www.monumentallabs.co&#x2F;work?project=Athena+Promachos</a>
    )<p>The details are just jaw dropping. Are the details carved by human hands or
    by the robot itself??<p>As an amateur artist and as a robotics techie, I&#x27;m
    both fascinated -- and alarmed -- by the use of AI in the process. Part of the
    artistic process has always been the &quot;human struggle&quot;, ranging from
    inspiration to the actual hard work of putting pencil &#x2F; paint &#x2F; chisel
    to work. Often, but not always, that has determined our <i>value</i> of the work,
    whether it is the Sistine Chapel or the Last Supper, or indeed Shakespeare&#x27;s
    plays.  With AI tools short-circuiting the necessary &quot;burden&quot; of the
    artistic process, whether generating the next token, or next pixel, the chunk
    of stone, or the next note in a musical score, our value of that resulting work
    changes (and has changed). Sometimes dramatically.  Who&#x27;d prefer the n-th
    copy of Warhol&#x27;s &quot;Campbell Soup&quot; or the Marilyn posters if they
    had the opportunity for the original (painting?)?? Which would you rather hang
    in your living room??<p>For sculptures, the work is a physical entity, in your
    face, sometimes architecturally, sometimes not. Even then, does the provenance
    of the sculpture actually diminish its value?? I&#x27;m not so sure. I do welcome
    these robotically made sculptures, but I do wonder if&#x2F;when there are too
    many of them, all around. Kinda like AI-slop articles on the webz.<p>I dont have
    any solid answers... just some feelings (pls. dont call &#x27;em vibes)<p>Regardless,
    at least for now, I do love these, and I&#x27;m just fascinated that this tech
    is being used to create more art.  We all could use more of it in our lives.<p>[To
    the OP: I have a few more ideas on what else we could create. Happy to chat.]'
