    # Teaching robots to carve marble sculptures

    Autonomous Toolpathing at Monumental Labs

     Eleanor Wiesler · Oct 6, 2026 robotics

    We taught KUKA KR240 robots how to carve marble sculptures.

    This month, my team and I at [Monumental Labs](https://www.monumentallabs.co/) announced the first end-to-end autonomous CNC stone carving system of its kind. Sebastian Marino, James Darby, and I presented it at Embodied AI NYC, hosted by NY Robotics and ZeroSpace Labs in Brooklyn. This post is a written version of our talk: how our system turns a 3D model and a block of marble into a finished sculpture, with no human in the loop.

    _Sim-to-real: the planned toolpaths in simulation alongside the robot carving them in stone._

    ![Finishing toolpath on the simulated bunny (left) beside the carved marble bunny from the same angle (right).](../../public/img/blog/autonomous-toolpathing/slide-pass-01.jpg)
    _From simulation to stone: a finishing toolpath on the Stanford bunny (left) and the marble bunny the robot carved from it (right)._

    ## Why stone, and why now

    Civic buildings like Penn Station and Grand Central were once expected to be monumental. Stone carving never disappeared, but rising costs pushed it out of ordinary construction. At Monumental Labs we use machine learning, computational geometry, and optimization to cut that cost: de-extinction, not displacement.

    Our goal is zero humans in the loop during the robotic manufacturing process: a fully automated, end-to-end pipeline built for “lights-out” manufacturing. We will continue to work with artists and designers to decide on the final desired sculpture. After robotic manufacturing, we intend to continue to use a hand finishing carving team for final surface quality refinements.

    ![Industrial robot arms on pedestals in a large warehouse workshop.](../../public/img/blog/autonomous-toolpathing/hq.jpg)
    _Monumental Labs HQ in Greenpoint, Brooklyn._

    ## Complex CNC machining already exists. What is actually new?

    Monumental Labs has been carving stone with classic CNC machining techniques for a couple of years, without our automated system. A few of those pieces are below, from restoring landmarked New York facades to life-size figures.

    [![Carved sandstone balcony on the Villard Houses in New York.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/3218F749-529C-41BD-9744-80AA1BFBD57E_1_105_c.jpeg) **Villard Houses, NYC** ](https://www.monumentallabs.co/work?project=Villard%20Houses)[![Carved limestone ornament for The Frick Collection.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/94EA37CC-9B2A-40A9-B249-9D755899D07B_1_105_c.jpeg) **The Frick Collection** ](https://www.monumentallabs.co/work?project=The%20Frick%20Collection)[![Life-size stone figure of Richard Feynman.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/109EEF56-C161-47D8-83DC-5CDA3AC83660_1_105_c.jpeg) **Richard Feynman** ](https://www.monumentallabs.co/work?project=Richard%20Feynman)[![Monumental stone carving of the Stripe test credit card.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/stripe.jpeg) **Stripe Statue** ](https://www.monumentallabs.co/work?project=Stripe%20Statue)[![Reconstructed limestone tympanum at Carnegie Hall.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/1C988EF3-9D40-42A7-8B2B-832F53378189_1_105_c.jpeg) **Carnegie Hall** ](https://www.monumentallabs.co/work?project=Carnegie%20Hall)[![Three-foot marble capital for the de Seversky Mansion.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/3B8AF99D-BB84-4A54-B175-FC9607DCD788_1_105_c.jpeg) **de Seversky Mansion** ](https://www.monumentallabs.co/work?project=de%20Seversky%20Mansion)[![Seven-foot stone astronaut sculpture.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/showroom/Astronaut/7.jpg) **Astronaut** ](https://www.monumentallabs.co/work?project=Astronaut)[![Four-foot marble reduction of the Athena Promachos.](https://assets.tina.io/0c46fbcd-acbd-48b2-847d-2bc4e0d0f432/F90F9ACA-118A-4F25-9C47-A82BAE964002_1_102_o.jpeg) **Athena Promachos** ](https://www.monumentallabs.co/work?project=Athena%20Promachos)

    _Pieces Monumental Labs carved with conventional, manually programmed CNC toolpaths. More at monumentallabs.co/work._

    So what is new? Each of these pieces took our digital fabrication team **weeks to months** of manually programming toolpaths in CAM software like Autodesk PowerMill. That largely drag-and-drop software was built for parts like injection molds and engine blocks, where one toolpath gets reused thousands of times. Our sculptures are the opposite: intricate, complex, and bespoke every time. Programming each one by hand won’t scale as we open more factories. Our proprietary autonomous toolpathing system runs completely unsupervised, turning a 3D model and a block of stone into millions of toolpath points and tool orientations, complete with kinematics and simulations. Available compute is now the only limit to the number of sculptures that could be programmed each day.

    Making this fully autonomous meant solving various open problems in computer graphics and robotics.

    ## Roughing vs. finishing

    Carving happens in two broad phases. **Roughing** is about material removal rate: getting as much stone off the block as quickly and safely as possible. **Finishing** is about surface quality: tracing the final form closely enough that what comes off the robot matches the design. The two phases call for different tools, different strategies, and different algorithms.

    ## A magic trick: autonomous roughing paths

    The running example in the talk was a magic trick: start with a block, carve a top hat, and pull a rabbit out of it. The rabbit is the Stanford bunny, a classic test model in computer graphics. We carved the top hat first partly for fun, and partly as a reminder of the magic that happens when robots and art come together.

    ![Simulated rough marble block in front of a robot arm.](../../public/img/blog/autonomous-toolpathing/trick-block.jpg)Block

    →

     ![Simulated top hat shape carved from the block.](../../public/img/blog/autonomous-toolpathing/trick-tophat.jpg)Top hat

    →

     ![Simulated Stanford bunny emerging from the top hat on a pedestal.](../../public/img/blog/autonomous-toolpathing/trick-rabbit.jpg)Rabbit

    _The trick in simulation: block, top hat, rabbit._

    ## Voxels

    Everything starts with a voxel representation of the stone. Voxels let us accept arbitrary mesh inputs and store them in a sparse data structure, which matters because a dense grid scales cubically with resolution. From the voxels we compute a signed distance field, along with normals and gradients. That gives us a natural basis for constructive solid geometry, which is exactly what subtractive manufacturing is: the stone minus everything the tool has removed.

    ![Voxelized bunny and block inside a bounding volume.](../../public/img/blog/autonomous-toolpathing/voxels.jpg) ![Close-up of a sparse voxel grid along the stone surface.](../../public/img/blog/autonomous-toolpathing/voxels-closeup.jpg)

    _The stock and target as a sparse voxel grid, and a close-up of the grid at the surface._

    ## Bulk material removal

    The first job is primary bulk material removal: clearing the large volume of stone between the raw block and the rough shape of the part.

    ![Layered roughing passes around the top hat shape, colored by pass.](../../public/img/blog/autonomous-toolpathing/bulk-sim.jpg) ![Marble top hat shape carved by the robot in the workshop.](../../public/img/blog/autonomous-toolpathing/bulk-carved.jpg)

    _Bulk roughing passes for the top hat, and the result in marble._

