  author: MisterTea
  text: "&gt; I assume thats because anything bigger will cause the arm to deviate
    toomuch.<p>I&#x27;ve been around a lot of CNC machines, wood routers, metal cutting,
    plasma&#x2F;water-jet&#x2F;laser cutters, laser welding, etc. The key to accurate
    motion is rigidity and heavy CNC machine tool frames that push a tool into work
    are hunks of cast iron or steel structures encased in cast epoxy granite. They
    ride on box ways or heavy linear bearings. They are MASSIVE.<p>Those robot arms
    have the rigidity of a wet paper straw by comparison. IMO, this should be a two
    step process where traditional machines with big tools hog out the rough shape
    then the robot arms carve the final details."
