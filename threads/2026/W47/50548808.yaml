  author: badlibrarian
  text: 'A tenet of modernism is that you don&#x27;t hide the structure. And not necessarily
    for cost reasons. It can extend to: don&#x27;t paint it. If you don&#x27;t like
    the aesthetics of the material, find a better-looking material.<p>Ornamentation
    costs money to transport and install. It can require additional support structures.
