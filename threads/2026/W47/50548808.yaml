  author: mauvehaus
  text: Two things:<p>1) A great podcast about why we&#x27;re bad at statues in the
    US:<p><a href="https:&#x2F;&#x2F;slate.com&#x2F;podcasts&#x2F;decoder-ring&#x2F;2026&#x2F;07&#x2F;how-taste-politics-and-art-schools-chipped-away-at-the-tradition-of-american-sculpture"
    rel="nofollow">https:&#x2F;&#x2F;slate.com&#x2F;podcasts&#x2F;decoder-ring&#x2F;2026&#x2F;07&#x2F;how-taste-po...</a><p>2)
    This isn&#x27;t a particularly interesting model to sculpt. The parent model is
    a scan of a ceramic rabbit, and it doesn&#x27;t have crisp details like really
    good marble sculptures do.<p>I have seen Venus Victrix[0] in person, and the detail
    in the mattress the figure is lying on is absolutely transfixing. You would swear
    the marble would softly yield if you put your finger on it. There&#x27;s a detail
    rendered around the edge of the mattress that likely represents embroidery and
    it&#x27;s unbelievably crisp, even as it follows the folds and creases in the
    mattress.<p>If we&#x27;re going to have robots sculpt marble, that is the standard
    we should be reaching for. If we&#x27;re reaching for that, I think we&#x27;re
    going to find that modeling the finished product in 3d is going to be a significant
    fraction of the work of actually carving it in stone. I think we&#x27;re also
    going to find that the mastery also lies in the tiny decisions the sculptor makes
    as they work, informed by how light plays off the material in different directions
    in real time throughout the day.<p>Can the process in the article achieve results
    suitable for mounting at the top of a building and viewing from ground level?
    Probably, and if not now, certainly with time. Can it sculpt something that will
    command your attention in reverent, slack-jawed awe for hours? I don&#x27;t see
    it happening.<p>[0] <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Venus_Victrix_(Canova)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Venus_Victrix_(Canova)</a>
    Seriously, this and Bernini&#x27;s David, also at the Galleria Borghese, are worth
    the trip to Rome to see. If there were <i>nothing</i> else in Rome worth seeing
    and the food was terrible, they would justify the pilgrimage on their own.
