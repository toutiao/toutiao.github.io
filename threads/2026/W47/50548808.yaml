  text: I&#x27;m not an artist, so maybe I&#x27;m missing the mark, but I feel like
    the hard part of making art should be learning how to express or project your
    artistic vision or complex emotion or some other aspect of human experience into
    physical space. I&#x27;m not sure I subscribe to the idea that the difficulty
    of the medium you choose is necessary. Sometimes it&#x27;s the point of the work,
    but I don&#x27;t think you&#x27;re getting the most out of the Pietà if your take
    home is &quot;wow, that must have been difficult&quot; (although that&#x27;s just
    my opinion).<p>We can look at other art forms that are pretty accessible w.r.t.
    barrier to entry. Most folks learn creative writing as school children and master
    the fundamentals quite quickly. Sure, there&#x27;s reams of bad (and good, don&#x27;t
    come at me) fanfic at ao3 as well as middling pulp at the gas station, but I don&#x27;t
    think that stops great works from appearing or being any less special.<p>Similarly,
    we see pretty terrible statues in public places quite frequently (I&#x27;m thinking
    the derpy Ronaldo statue or the Lucille Ball statue in Celeron).<p>So all that
    to say, I&#x27;m optimistic that if something like this meant statues were easy
    to make and you can design one in your underwear in a few hours and hit &quot;print&quot;,
