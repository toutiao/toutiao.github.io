  author: upboundspiral
  text: I completely agree that so much interesting math is hidden behind hyper-proprietary
    tools that engineers are expected to use.<p>As you note, all the Finite Element
    tricks are hidden, all the meshing tricks are hidden, and while you can find some
    in old research papers, in general the main companies hoard them.<p>The landscape
    has been 3 &#x2F; 4 forces:<p>1) individual academics that do interesting work
    but more often than not abandon the codes they produce after a paper or three.<p>2)
    Proprietary companies that hire enough expertise to take academic research, generalize
    it, and sell a hyper-proprietary product with very little competition because
    the expertise is hard to come by<p>3) The national labs which do amazing work,
    that release a body of reliable open source work, though some of it is tailored
    to their systems - usually hard to use &#x2F; very few people know about it outside
    academia.<p>4) Open projects like OpenFOAM &#x2F; OpenCascade that struggle along
    at the edges to create a cohesive whole that can compete with the big companies.<p>I
    think that LLMs offer an opportunity free us from this status quo:<p>1) The open
    source work of the past is much easier to use &#x2F; decipher with an LLM<p>2)
    The research is there, it just hasn&#x27;t been productized (through an open source
    vector) &#x2F; made accessible yet<p>3) I do believe that LLMs make learning the
    past codes &#x2F; getting ideas for new codes &#x2F; extending codes easier<p>I
    think engineering tools are up for a shakeup, as both LLMs + new paradigms are
    emerging. There is really interesting research into new meshing methods &#x2F;
    CAD representation (Brep vs SDF) &#x2F; topology optimization.<p>I believe this
    is an opportunity for an open source ecosystem to start making inroads into the
    bottom layers of the engineering stack (CAD kernels &#x2F; representation), and
    from there make inroads into meshing + make open source FEA more accessible.<p>I
    am excited by what the future might bring, and remain cautiously optimistic that
    just like no one buys a programming language anymore, the lowest levels of the
    engineering stack might become open source so that research is accelerated,  engineers
    are freed from total lockin, and in general the ecosystem is much healthier and
    innovative.
