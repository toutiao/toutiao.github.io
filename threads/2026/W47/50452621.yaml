  author: CamperBob2
  text: 'That&#x27;s Kleppner &amp; Ramsey&#x27;s book, who shared the physics Nobel
    for the invention of the hydrogen maser.  Ramsey had already come up with the
    key principle that made atomic clocks practical.  (Edit: Kleppner was the co-inventor
    but didn&#x27;t get a ticket to Stockholm, and in fact Ramsey was awarded for
    his other work on atomic clocks.)  They were some of the all-time great experimental
    physicists.  I didn&#x27;t learn calculus from them but I have that book on the
    shelf.<p>&quot;Programmed instruction&quot; books like that one were big in the
    post-Sputnik era, part of a larger push to systematize STEM education.  I&#x27;ve
    always wondered why it never caught on.  I guess it&#x27;s not ideal for a classroom
    setting where everybody gets dragged along at the same predetermined rate.'
