  author: helterskelter2
  text: 'This comment reminds me: I was in a used bookstore a few weeks ago with my
    dad (a retired engineer) and he bought up a bunch of the old math and engineering
    books because, he said, they approach their subjects differently and explain how
    things work, they walk you through the math and work to build up a detailed mental
    model of what&#x27;s actually happening. His feeling was that modern textbooks
    make everything so abstract that the subject begins to feel divorced from what
    you&#x27;re trying to do or understand, which makes getting an intuitive grasp
    on a topic really difficult.<p>He showed me some of the books from the 40&#x27;s
    and 50&#x27;s geared towards teens and honestly they did a better job of explaining
    things than the college textbooks I had to use -- they didn&#x27;t go into fine
    detail, but they gave you a good framework to build on and a way of thinking about
    something which I feel is lacking from contemporary texts.<p>Tangentially, Feynman
    said something in a similar vein about the transition from analogue to digital.
    Kids couldn&#x27;t tinker anymore and had no real impetus to learn some of the
    laws which underpin their workings, and most importantly, had no way to build
    an intuition around these laws through casual experimentation (i.e. fixing a broken
    radio with a handful of parts from Radio Shack).<p>Abstraction can be a very powerful
    tool, but growing up and learning in an environment which has these abstractions
    already built-in is a real handicap to building a deep understanding of a subject.
    You become dependent on the tools themselves instead of developing the knowledge
    used to build the tools -- in effect, the tools become limitations. Look at kids
    who grew up with iPhones instead of Amigas, or people already becoming dependent
    on LLM&#x27;s.'
