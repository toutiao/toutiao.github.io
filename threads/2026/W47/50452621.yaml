  author: annzabelle
  text: There are a few great books aimed at self study that I&#x27;ve used over the
    years, and this and the other one I really liked were both from the 50s&#x2F;60s
    (Wheelock&#x27;s Latin being the other). There&#x27;s something about the seriousness
    while also not expecting you to be using any other materials or have the support
    of a lecture&#x2F;grader that both of these books had that more recent books don&#x27;t
    seem to replicate.<p>The For Dummies and other such lines of books for interested
    amateurs stay very surface level, while textbooks aimed at classrooms tend to
    assume that you have lectures, a grader, and, at this point, a login to an expensive
    portal. I do find higher level CS and math texts to be better quality, but I suppose
    that is because I am familiar enough with those fields to access them.<p>There&#x27;s
    something about the assumption that the reader is a serious self motivated learner
    that authors in the 50s and 60s have that doesn&#x27;t seem to be as common anymore.
