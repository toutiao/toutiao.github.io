  author: annzabelle
  text: There&#x27;s a book called &quot;Quick Calculus&quot; (originally published
    in 1965, though I have the 1991 second edition) that my high school physics teacher
    gave me as a way to prep for physics class over the summer. It&#x27;s a self teaching
    guide to basic calculus and is written to be used standalone without a lecture
    or grader. It has choose your own adventure stuff where if you get a question
    right you can skip over an extra explanation&#x2F;example.<p>I&#x27;ve kept it
    around and used it for self teaching when I went down the rabbit hole of prepping
    for actuarial exams a year back, and again for prepping for going back to college
    to change careers to medical physics (yes, I have been looking at a bunch of different
    options to leave software).<p>I find it so much more elegant and straightforward
    than modern textbooks, and it&#x27;s so much easier to focus on pen and paper
    vs screens. I&#x27;ve had people suggest Khan Academy and 3Blue1Brown, but I find
    I learn more deeply and retain better from a good old school textbook.
