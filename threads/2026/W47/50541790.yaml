  url: https://kernel.dev/blog/why-is-gemini-4-carbon-taking-so-long/
  title: Why is Gemini 4 Carbon taking so long? · Kernel
  fetch_status: success
  content: "# Why is Gemini 4 Carbon taking so long?\n\nNovember 2026\n\n[YDiscussion
    on Hacker News▲ 238 points125 comments→](https://news.ycombinator.com/item?id=50541790)\n\nWhile
    benchmarking Gemini 4 Carbon on one of our private evals, we found something surprising:
    it spent close to an hour completing tasks that routinely took Opus and Astra
    only a few minutes:\n\n### Time and cost per trial\n\nLeft is faster; lower is
    cheaper.\n\n_Carbon is priced at its post-introductory rate.Subscription subsidization
    rates used: Opus 40×, Astra 13×, Carbon 3×, Hydrogen 17×._\n\nTurns out we weren't
    alone in noticing this.\n\nI don't really know how to properly emphasize this.
    Gemini 4 Carbon is unacceptably slow in real world usage.\n\nGemini 4 Carbon low:
    22m21s  \nOpus 5.5 high: 9m33s\n\ni really love gemini 4 carbon but its too slow.
    im losing my mind waiting just to stay focused and learn simple things\n\ndude
    why is carbon so fucking slow\n\ncarbon is nearly unusable because of how slow
    it is, but people are majorly sleeping on it\n\nTo find out why, we traced every
    step of Carbon's runs and quantified what contributes to the slowness.\n\n## The
    Task\n\nIn each task, the agent gets a codebase from just before a bug was fixed,
    along with a report that describes the bug only by its symptoms. Its job is to
    diagnose the bug and fix it, without making any unrelated changes.\n\nMuch of
    the task's difficulty comes from engineering judgment rather than raw intelligence:
    tracing the user's symptoms to the right code path, ruling out rival explanations,
    putting the fix in the right place, and knowing when to stop.\n\n## Slow inference,
    or more work?\n\nThe first (and easiest) factor to separate out was inference
    speed: queueing at the provider, network latency, prompt processing and generation
    speed. Together, these set how long each step takes:\n\n### Seconds per step\n\nSlower
    inference accounts for part of the gap: 16–30% of Carbon’s extra time compared
    with Astra, and 45–49% compared with Opus. The rest comes from longer trajectories.
    Carbon simply does more work per task, as the step counts, tool calls and tokens
    below show:\n\n### The workload\n\nGPT-6 Astra against Gemini 4 Carbon, mean per
    bug.\n\nGPT-6 AstraGemini 4 Carbonlighter = lower effort\n\nCarbon takes about
    seven times as many steps as Astra, and eleven times as many actions such as reading
    a file or running a command. It writes seven times as much and, because every
    step re-sends a longer and longer conversation, it processes more than sixteen
    times as much input.\n\n## Ruling out the obvious\n\nBefore looking inside the
    runs, we checked two simpler explanations.\n\n- **The harness.** We also ran Carbon
    inside two other coding agents, opencode and mini-SWE-agent, and saw no meaningful
    difference.\n- **Mismatched reasoning levels.** Effort settings aren't standardized
    across providers, so Carbon's \"high\" may sit closer to the other models' maximum
    settings, and the fairer comparison might have been Carbon on low. But on low,
    Carbon often failed to produce a fix at all: it went in circles, re-reading code
    it had already read instead of making the fix.\n\n## Reading the traces\n\nWe
    labelled every step of the Astra and Carbon runs by what it was for, and then
    counted how many steps went to each kind of work:\n\n### Semantic trace analysis\n\nEach
    model’s steps, grouped by what they were for.\n\n_Leaves out the 20 steps Carbon
    spent re-reading code it had already read; the next section covers those._\n\nHalf
    of Carbon’s steps went into work the ticket never asked for:\n\n- **Auditing code
    beyond the bug.** Once it had found the cause, Carbon kept widening its search,
    checking every related path through the system and auditing code the fix never
    needed to touch.\n- **Closing loopholes the ticket had already ruled out.** Carbon
    defended against cases the ticket's facts had already excluded, hardening the
    code against problems nobody had reported.\n\n## Carbon's necessary work is also
    slower\n\nEven within the steps the fix needed, we found some additional low-hanging
    fruit: Carbon got less done with each step, and it kept re-reading code it had
    already seen.\n\nAstra made more than two tool calls per step, often reading several
    files at once — Carbon, on the other hand, made about one, usually reading a single
    file. Carbon also re-read far more: 39% of the lines it read were ones it had
    already seen, against 7% for Astra. We estimate that these two \"mechanical\"
    inefficiencies account for roughly 25% of Carbon's excess runtime.\n\n## Conclusion\n\nOn
    difficult bug-fixing tasks, Carbon took close to an hour where Opus and Astra
    took minutes. We traced that gap to three sources:\n\n- **Slower inference.**
    Each step takes longer, which explains 16–30% of the gap against Astra and about
    half against Opus.\n- **Unnecessary work.** About half of Carbon's steps went
    on work the tickets never asked for: auditing code the fix didn't need and closing
    loopholes the ticket had already ruled out.\n- **Mechanical inefficiencies.**
    Fewer tool calls per step and frequent re-reading slow Carbon down; we estimate
    that fixing them alone would cut its runtime by roughly a quarter."
