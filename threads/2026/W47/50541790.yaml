  author: tristanj
  text: It&#x27;s pretty obvious that Gemini 4 Carbon is not token efficient. It also
    has relatively low tokens-per-second compared to other models. I can think of
    several reasons why this is the case:<p>1. Google has huge amounts of cash and
    compute. Their goal was to train a model that that has the highest quality &amp;
    frontier performance, not create a model that&#x27;s efficient to run and serve.
    They have other models for that, like Hydrogen.<p>2. Google created Carbon without
    caring for inference costs. DeepMind is subsidized by the rest of Google&#x27;s
    empire. Selling inference is an insignificant part of Google&#x27;s revenue. But
    for Anthropic and OpenAI, selling inference is their entire business model. Anthropic
    and OpenAI have enormous incentive to sell as much inference as they can in the
    most efficient manner. Google doesn&#x27;t have this incentive.<p>3. They are
    one of the few companies that can be inefficient. Out of all the frontier labs,
    Google DeepMind is probably the least constrained by compute. Chinese labs have
    around 10 to 100 times less compute, so they must release highly optimized models.
