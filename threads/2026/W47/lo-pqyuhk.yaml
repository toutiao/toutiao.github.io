  text: |-
    GitLab's database load balancer did (and still does IIRC) something similar: after a write it records the WAL pointer from the primary and stores it in your session. The next time it wants to read from a secondary it first compares that value against the WAL pointer of the secondary. Only if that value is newer than the one from the last write does it read from the secondary.
    Seeing something like this (finally) included in PG itself is nice and would probably make that entire implementation a lot simpler.
