  content: "Today we launched a change that has been a long time in the making: The
    updated website for freedesktop.org, as well as the refreshed wiki.freedesktop.org
    are live now!\n\nYou can read the announcement here, this blog post elaborates
    a bit on it and on the background of the changes, as well as future plans.\n\n###
    Why change anything?\n\nThe freedesktop.org website has been a wiki for a long
    time, which definitely was the right call in its inception. A wiki is very much
    in spirit of Freedesktop’s mission statement to foster collaboration between desktop
    environments and to be a place to create de-facto standards.\n\nHowever, over
    the years, working with the wiki became a bit of an issue: Not only did we face
    multiple spam-apocalypses (which in part motivated the switch to IkiWiki in 2013
    and resulted in us heavily restricting write access to the wiki), but it also
    meant that official project information, finished specifications, half-finished
    proposals and pages nobody had touched in fifteen years were all sitting next
    to each other.\n\nSince 2000 when Freedesktop.org was started, the project has
    grown so much and has had so many associated projects and specifications over
    the decades that it is now very difficult for new people to get an overview what
    is current and what state the software projects and specifications hosted by Freedesktop.org
    are in.\n\nHaving only a wiki as a large and somewhat disorganized pile of information
    did not help with that issue, so I worked to split things up: We now have a website
    as well as a wiki, using different designs to distinguish the two, and serving
    different purposes.\n\n### Website & website plans\n\nThe website at www.freedesktop.org
    will be the place for “official”, or rather, more curated information. Now that
    the new website is live, its content is still largely that of the old wiki. Over
    the next weeks, I will be working on cleaning up its contents and listings. For
    example, I will clearly split active projects from archived ones, add missing
    ones, and also work towards synchronizing the specifications hosted on the former
    wiki / website with the ones listed on specifications.fd.o.\n\nSo, basically I
    will do an inventory check of Freedesktop. That work has already started, but
    until now, I could not make any public changes to not disrupt workflows or make
    my own future work harder by having diverging information in two places (website
    & wiki).\n\nI also wanted to make it easier for people to find information on
    how to get involved with Freedesktop and associated projects, so the new website
    now has a more discoverable section for that.\n\nThe new website is a static site
    hosted via GitLab Pages and using Pelican. You can view its sources if you like.\n\n###
    Wiki changes\n\nOf course, we also still want to keep the Wiki and all of its
    rich history around! It remains the easy-to-edit place for collaboration on upcoming
    projects and specifications.\n\nWiki edits must now happen through GitLab instead
    of the old IkiWiki web interface. While this sounds like an additional barrier
    to edit the wiki, it is significantly easier than requesting an account on annarchy
    to edit the old Wiki through the web interface. It also still allows us to keep
    the existing history as well as spam protection measures. In order to use the
    wiki with GitLab Pages and to keep the history easily accessible and readable,
    I rewrote the Git history of the wiki to make it pretend that all changes always
    happened in a content subdirectory. So, if commit signatures are missing and hashes
    are different: That is the only reason why. There have been no content changes
    or other metadata changes (and we still have a copy of the pristine wiki Git repository).\n\nFor
    the fd.o wiki, we are now also using Hari’s IkiWiki template that is already in
    use on the X.org website and which is much easier on the eyes.\n\n### Next steps\n\nAt
    the moment, I am mostly concerned with ensuring that the change has not broken
    any existing links and all systems keep working. After that, the wiki \U0001F858
    website deduplication work will start and we can modernize both the content of
    the website and wiki.\n\nIf you find a broken link, an outdated page or anything
    else that looks wrong, please file an issue or, even better, open a merge request.For
    the wiki, you are very welcome to just fix or otherwise update the page directly.\n\nI
    did reach out to all wiki editors and projects impacted by this change in advance,
    but since there are so many people and projects involved, it is always possible
    to miss someone or something. If you found a bug, need edit permissions, or need
    help with anything, don’t hesitate to ping me: You can find me as ximion in OFTC’s
    #freedesktop IRC channel, in the very recently created #xdg-specs channel on the
    Freedesktop Matrix space, or you can email me.\n\n### Thank you!\n\nI do want
    to echo the announcement news post here: None of Freedesktop.org would exist without
    the people who filled it with life over the years and who worked on cross-desktop
    collaborative projects. I have read through a lot of wiki history and old project
    pages over the recent months, and it feels amazing to know how much work and passion
    people have poured into the projects and collaborative efforts over the years
    – no matter if they were successes in the end, or remained experiments. I am very
    thankful for all current, past and future editors of the website and wiki, as
    well as all project maintainers and contributors.\n\nI also want to thank the
    Sovereign Tech Agency once more for supporting me in their fellowship program
    as a maintainer, which enabled me to work on this task among other things.\n\nThanks
    to all contributors, in whichever way you contribute to our free desktop ecosystem!\n\n##
    2 thoughts on “Changes on freedesktop.org!”\n\n### Leave a Reply Cancel reply\n\nYour
    email address will not be published. Required fields are marked *\n\nΔ\n\nThis
    site uses Akismet to reduce spam. Learn how your comment data is processed."
