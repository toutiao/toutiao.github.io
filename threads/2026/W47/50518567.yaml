article:
  url: https://www.wired.com/story/nvidia-was-already-in-trouble-before-the-jensen-huang-mess/
  title: Nvidia Was Already in Trouble Before the Jensen Huang Mess | WIRED
  fetch_status: success
  content: "Nvidia played a key role enabling the AI gold rush thanks in large part
    to its [recently ousted CEO](https://www.wired.com/story/nvidia-ceo-jensen-huang-steps-down/)
    [Jensen Huang](https://www.wired.com/tag/jensen-huang). Huang was a master of
    [foreseeing technological changes](https://www.wired.com/story/big-interview-nvidia-jensen-huang-2024/),
    investing in [chips](https://www.wired.com/tag/chips) to train AI earlier than
    most.\n\nBut just as [he’s leaving](https://www.wired.com/story/jensen-huang-tanked-a-trillion-dollars-in-less-than-a-month/),
    the company has a [growing list of competitors](https://www.wired.com/story/uncanny-valley-podcast-jensen-huang-is-out-will-nvidias-rivals-cash-in/)
    with a range of new, advanced technology breathing down its neck. For [Nvidia](https://www.wired.com/tag/nvidia),
    where CFO Colette Kress has now taken the reins, the timing isn’t great.\n\n“Everything
    sold today was designed two to three years ago,” says the CEO of a large AI company,
    who spoke to WIRED on condition of anonymity to avoid hurting business relationships.
    Kress, or whoever replaces her permanently, will have to chart the course that
    the chip industry will take two years from now, the CEO says.\n\nAlready, competitors
    have started to move in.\n\nNvidia dominates the market for AI accelerators, capturing
    80 percent of sales, [according to](https://siliconanalysts.com/analysis/amd-vs-nvidia-ai-gpu-market-share-2026)
    Silicon Analysis. Longtime nemesis [AMD](https://www.wired.com/tag/amd/) is now
    making a concerted effort to build competitive AI chips. Its share of the market
    has crept up from just two percent in 2022 to between 7 and 10 percent in 2026.\n\nBig
    US cloud players—Google, Amazon, and Microsoft—are all developing more specialized
    chips to power the training and serving of AI models. Each has seen similar gains.
    These companies are designing their own silicon to reduce costs and to gain some
    independence from Nvidia.\n\nSeveral startups now offer more specialized chips
    that promise improvements over Nvidia’s core products. Cerebras, for instance,
    [sells giant ones meant to power](https://www.wired.com/story/cerebras-chip-cluster-neural-networks-ai/)
    giant AI models. AMD recently bought Taalas, a company that burns models’ weights
    into silicon to make computations ultra efficient. Using these chips requires
    rewriting a lot of code, however, to make them work with cutting-edge AI models.\n\nPatrick
    Moorhead, chief analyst at MoorInStrat, a company that tracks the chip industry,
    says the rise of AI agents makes inference, or running models that have already
    been trained, more important. That’s an area where Nvidia has less of an edge
    compared to cloud hyperscalers and startups. Nvidia did, however, acquire a startup
    making specialized chips, called Groq, in December of 2025.\n\nAnd because of
    the rise in AI assistants and agents, there’s also growing demand for general
    purpose central processing units (CPUs), Moorhead said, an area where Nvidia barely
    competes.\n\nNvidia still maintains a huge lead in AI thanks to Huang’s foresight.
    Huang cofounded the company in 1993 to design graphics chips for PCs. In the mid-2010s,
    he saw the promise of AI. He funded academic research on the topic, developed
    software to support AI engineering, and gave hardware to labs and startups.\n\nIn
    2022, [ChatGPT took AI mainstream and](https://www.wired.com/tag/chatgpt/) sales
    of Nvidia chips skyrocketed. The company’s revenue went from $26.91 billion in
    January 2022 to $215.94 billion in January 2026. The challenges it faces may not
    be existential—but they do add up, especially on a global scale.\n\n## China Challenge\n\nWhile
    Nvidia’s fortunes have risen in the US, they have declined in the world’s other
    big market for AI: China. Washington is trying to restrict access to its most
    advanced chips, while Beijing is trying to develop its own chip industry. Nvidia
    is not allowed to sell its most powerful chips in China, but it can sell previous
    generations. Sales of these chips as well as non AI chips doubled over the past
    year, but China now accounts for only eight percent of the company’s overall revenue,
    compared with 20 percent in 2024, according to its fillings. It remains unclear
    how many chips exported to other countries may either end up in China or end up
    being used remotely by Chinese firms.\n\nHuawei, a Chinese tech giant targeted
    with US sanctions for several years, has developed new kinds of supercomputers
    that harness many more chips than usual to train and run AI models. Some Chinese
    AI companies, such as Z.ai, which makes one of the world’s best open source models,
    [say](https://web.archive.org/web/20260114135444/https://mp.weixin.qq.com/s/89kksB37sUs-mmG20AW5Fw)
    they’ve trained their models entirely using Huawei’s chips. If Chinese open-weight
    models gain traction in other countries, it could create a market for Chinese
    chips elsewhere.\n\nHuang’s dealings with China played a major role in his downfall.
    He had a romantic relationship with Huang Le, also known as Alice Huang, a Chinese
    executive at a Singaporean company called Megaspeed who the US government suspects
    of being an asset of China’s Ministry of State Security. Megaspeed and its subsidiaries
    have reportedly imported between $4.6 and $7.5 billion Nvidia chips into southeast
    Asia. [Reports](https://www.bloomberg.com/news/articles/2026-11-09/what-to-know-about-nvidia-ceo-jensen-huang-s-affair-with-suspected-chinese-spy)
    suggest that the company may have provided access to the chips to Chinese AI firms.\n\nBabak
    Minovi, a senior analyst at the Eurasia Group, a consultancy that focuses on technology
    and geopolitics, says Huang was right to point out that cutting off access to
    China would empower domestic rivals. “Huang was taking a pragmatic line, and he
    knows competition,” he says.\n\n## Trend Spotting\n\nEven in markets that it dominates,
    Nvidia may turn out to be a victim of its own success. The AI models built using
    Nvidia’s chip are automating the very elements of coding, data analysis, and scientific
    research that help design chips.\n\nMost chip design firms use specialized AI
    models to arrange components on processors—something that traditionally required
    deep engineering expertise and experience. And both OpenAI and Anthropic [have
    recently](https://www.anthropic.com/research/claude-electronics-design) touted
    the [ability of their newest models](https://openai.com/index/accelerating-engineering-for-the-physical-world/)
    to design electronics from scratch.\n\nMoorhead says the shift towards AI chip
    design may not pose a huge threat to Nvidia because it’s riding the same wave.
    “They have access to AI too,” he notes.\n\nBut Moorhead says the way AI models
    can now quickly rewrite code to run on different hardware may prove a problem.
    For years, Nvidia has attracted developers by providing software that makes it
    easy to write programs and build models for its silicon. Its Compute Unified Device
    Architecture, or CUDA, has long been seen as a moat to ensure AI companies continue
    to rely on Nvidia chips.\n\nBut AI models are now so good at reading and writing
    code that they can port an AI model over to a competitor's silicon at speed.\n\nWafer,
    a startup that uses AI to port models to AMD and then serves them more cheaply,
    has seen revenue grow spectacularly in recent months, boasts CEO Emilio Andere.\n\nEvery
    time a major new open weight model is released Wafer can have it running on AMD
    hardware at least 80 percent as efficiently within hours, he says. Andere says
    AI is getting so capable that his engineers barely have to edit or review the
    code.\n\nDan Hutchinson, a veteran chip analyst, says Nvidia may be entering its
    “Intel swan moment,” referring to the 2019 replacement of engineering-focused
    CEO Brian Krzanich with its CFO Bob Swan. ([Sound familiar](https://www.wired.com/story/who-is-colette-kress-the-woman-who-could-succeed-jensen-huang/)?
    Krzanich also resigned after a relationship with an employee; Huang is alleged
    to have had "
