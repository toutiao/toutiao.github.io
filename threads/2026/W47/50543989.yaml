  author: thelaxiankey
  text: There&#x27;s a distinction between reasoning with access to a turing machine
    and reasoning without access to a turing machine. In one case, you must sometimes
    become a turing machine yourself and execute &quot;algorithms&quot;, which is
    something LLMs can struggle with.<p>When I was learning combinatorics, I was aggressively
    discouraged from using induction to prove things. Not because it was bad, or because
    it didn&#x27;t work, but because if I used induction, I wouldn&#x27;t be practicing
    &#x27;combinatorics&#x27;, I&#x27;d be practicing induction. You can make similar
    observations about solving ODEs numerically, or using mathematica for all your
    integrals.<p>One way to think of this is that banning coding prevents the agent
    from outsourcing some of the skills it&#x27;s bad at (discrete sequential reasoning)
    to a computer. We are grading precisely the thing it&#x27;s outsourcing because
    we suspect improving that might make it better.
