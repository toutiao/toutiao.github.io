  text: |-
    That&#x27;s also my default assumption: <i>P(x) ∝ e^(−E(x))</i> Or, in more detail,<p><pre><code>    E(x) = −log P(x) + constant
    </code></pre>
    If that&#x27;s the correct interpretation, then the main advantage of energy-based methods over strictly probabilistic methods seems to be that, since the energy function does not need to integrate to one, it can be parameterised with <i>any</i> nonlinear regression function. That means density estimation is basically a nonlinear regression problem.<p>This is the interpretation in [1]. I am not sure, however, if the paper here is an unnormalised probabilistic model.<p>[1] Y. Song, D. P. Kingma, <i>How to Train Your Energy-Based Models.</i> (2021) <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2101.03288" rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2101.03288</a>
