  author: program_whiz
  text: |-
    A clarifying way to think about this for sudoku:<p>For every clue, mark the probability of sampling its number in the row&#x2F;col to zero.  Also mark the probability of selecting a &quot;clue cell&quot; for modification to 0.<p>Pick a random cell for modification, based on its &quot;energy&quot; (higher energy get modified first):<p><pre><code>    1. Every conflicting cell gets energy +1.0 (try to resolve conflicts before new empty cells).  E.g. two 7s on the same row both get +1 energy.

        2. Empty cells have small energy 0.1

        3. Filled cells with no conflicts have energy 0
    </code></pre>
    For the selected cell, choose a digit.  Look at numbers in its row&#x2F;column, every occurrence of a number in the row&#x2F;col drop prob of sampling by 90%.  Example:<p><pre><code>    | No. of 7s | chance of 7 |
        | --- | --- |
        | 0 | 10% (equal to other digits) |
        | 1 | 1% |
        | 2 | 0.1% |
    </code></pre>
    Obviously this would get more complex with more numbers on the line (this is just checking 7 on otherwise empty line).<p>This is essentially what these models are doing.  It provides a kind of &quot;wave function collapse&quot; search with random exploration based on &quot;energy&quot;, but energy is just defined as conflict &#x2F; unsolved.  For something like a maze, energy is disconnected path segments or walls, etc.
