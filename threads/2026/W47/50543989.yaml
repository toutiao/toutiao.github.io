  author: tristenharr
  text: if we ahead of time collect training data on the desired behaviors we can
    predict things. Something not being deterministic in it&#x27;s operation does
    not mean we don&#x27;t understand it.<p>I understand the intent of the statement,
    but it feels like it would be better for the field as a whole to talk about interpretability
    and explainability. The AI can&#x27;t explain and we can&#x27;t understand a lot
    of why it does what it does, that doesn&#x27;t mean we don&#x27;t actually understand
    &quot;why&quot;. It&#x27;s not some mystery, it squeezed a bunch of patterns using
    mathematical mechanisms we design and piece together out of data we feed it.<p>We
    can predict ahead of time what will happen with strongly in-distribution data,
    but it&#x27;s true that out-of-distribution data (which can be most data in a
    fuzzy world).<p>Most of the researchers I&#x27;m talking with (which my bias is
    very sf pilled, going to frontier research club so like whitepaper readings from
    the AI labs and such, events all over the bay area from sf to san jose so i&#x27;m
    sure experience varies) will say that we generally do understand AI, but we don&#x27;t
    understand AI is kind of the cop-out statement we make to the general population
    because it&#x27;s easier than explaining that we can&#x27;t get AI to explain
    how&#x2F;why&#x2F;what it knows and does and it&#x27;s internal representations
    and we can&#x27;t get it to tell us the rules&#x2F;morals&#x2F;decision-trees
    it&#x27;s going to use in all situations.<p>We can design AI that we can rule
    out the possibility of the model trying to break out of the sandbox, or statistically
    design it in a manner where it&#x27;s essentially not possible. The issue is that
    it would be cost-prohibitive. Nobody is spending billions of dollars on safety.
    They are spending billions of dollars on chips. They also are training the AI
    on humans, so it feels like &quot;we have no way of ruling out the possibility
    the models will try to do behaviors that would be in-distribution for a human
    to do within the scenario&quot; is silly.<p>I&#x27;m just a pedant, I design compilers
    and programming languages. In my hometown people take that kind of thing literally,
    get scared and start believing the AI is conscious and has a soul and such rather
    than viewing it through the lens of being a pile of math that we can&#x27;t always
    predict but do fully understand.
