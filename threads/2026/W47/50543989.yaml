  author: eli_gottlieb
  text: 'Energy-based models parameterize energy functions $$E_{\eta}(x) = -log p_{\eta}(x)$$
    with neural networks $$\eta$$.  The FEP and active inference are specializations
    of this paradigm to latent-variable models where the energy function is defined
    by the unnormalized Bayesian posterior over the latent instead of just a marginal
    distribution over the observed data.<p>Source: I&#x27;ve worked with a lot of
    core FEP folks and published at their conference.'
