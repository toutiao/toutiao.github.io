  title: Thousands of UK fridges secured from hackers in secret operation - BBC News
  fetch_status: success
  content: "Image source, AFP via Getty Images\n\n_Image caption, Sweden was among
    countries to report a cyber incident in which some supermarket fridge units had
    been hiked up in temperature_\n\nByJoe Tidy\nCyber correspondent, BBC World Service\n\n-
    \nPublished\n\n**A behind the scenes cyber-security operation has taken place
    to secure tens of thousands of fridges and freezers at major UK supermarkets,
    warehouses, restaurants, petrol stations and stadiums from hackers, the BBC has
    learned.**\n\nRecent [waves of cyber-attacks in Europe](/news/articles/cq1kd1nee80eo)
    have seen tonnes of food spoiled at hundreds of stores, causing millions of pounds
    of damage.\n\nFrance has blamed Iran for one of the waves of attacks that impacted
    its supermarkets, [a claim Tehran denies](/news/articles/cmg474vk6dyqo).\n\nIt
    was thought the UK had [largely escaped such hacks](/news/articles/ckq6ndq8l6v0o)
    as the British refrigeration industry relies on different devices but there was
    in fact a potential vulnerability the sector has been rushing to fix.\n\nIn late
    October, security researchers discovered a major flaw that, if found by hackers,
    could have led to even worse damage to the UK.\n\nSince then, researchers, IT
    teams and the National Cyber Security Centre have been working around the clock
    to warn dozens of companies.\n\nThe BBC has not reported on the large-scale, secretive
    operation until now to reduce the chances of hackers causing harm if they found
    the vulnerability.\n\n**Tech Life: The everyday tech at risk of hacks**\n\nAs
    Europe sees a wave of cyber-attacks on commercial fridges, we investigate how
    everyday devices are vulnerable to basic attacks using easily-available tools.\n\n[Listen
    on Sounds](/sounds/play/w3ct8jyv)\n\n## Thousands of fridges taken offline\n\nThe
    security threat was discovered by staff at refrigeration consultants Omega Solutions
    - it was then verified and expanded upon by experts at Pen Test Partners who helped
    raise the alarm.\n\nThe National Cyber Security Centre (NCSC), the Department
    for Environment, Food & Rural Affairs (Defra) and Food Standards Agency (FSA)
    were then involved in the campaign to plug the security holes.\n\nThey held industry
    conference calls and tasked teams to contact firms at risk.\n\nThousands of devices
    controlling tens of thousands of refrigeration devices were taken off the open
    internet either remotely or, in some cases, physically - with staff ordered to
    remove internet cables and monitor temperatures manually.\n\nBBC news has learnt
    most major supermarkets have been forced to divert IT teams to address the risks,
    with a worker at one large chain saying they took hundreds of devices offline
    every day over the course of a week.\n\n\"It did feel like a race against time
    as we were expecting another wave of these fridge hacks to come,\" said the person,
    who did not want to be publicly named.\n\n\"From a business perspective it could
    have been potentially devastating with business interruption and supply chain
    problems. Our warehouses have millions of pounds worth of food that could have
    been spoiled if any hackers found out about this method of attack,\" they added.\n\nThere
    have been three waves of hacks on refrigeration temperature controllers so far
    this year:\n\n- In August, fridges at a small number of US military bases were
    impacted\n\n- On 11 and 12 October hundreds of supermarkets and food processing
    sites in France were hit when Danfoss temperature control systems were targeted\n\n-
    On 1 and 2 November dozens of supermarkets across seven European countries were
    hit, with Belgium and Luxembourg the worst affected. A small number of blood bank
    sites in France were also impacted\n\nThe waves of attacks prompted an expert
    at Omega Solutions to examine the security of the most popular refrigeration controllers
    in the UK, made by British firm Resource Data Management (RDM).\n\nRDM disputes
    the critical nature of the vulnerabilities exposed but has been praised for its
    professional response to address the concerns, the BBC understands.\n\nAs well
    as supermarkets, multiple other areas of UK food and beverage industry were also
    warned to take action about the risks.\n\nThese include convenience stores, petrol
    stations, restaurants and fast food chains, sports arenas, hotels, food processing
    plants and cold storage sites.\n\n_Image caption, Each RDM controller can be used
    to remotely control the temperature of dozens of fridges and freezers_\n\n\"These
    popular controllers had a similar weak password problem to the Danfoss and other
    controllers that were attacked so successfully in previous hacks so we had to
    get the message out as soon as possible and keep it secret,\" said Ken Munro of
    Pen Test Partners.\n\n\"There is so much extra attention on these ubiquitous bits
    of kit now that it was likely a matter of days until criminals or nation state
    hackers figured it out,\" he added.\n\nRDM, though, says comparisons with the
    units attacked in mainland Europe are not fair because hacking their fridges and
    freezers would have involved getting hold of a piece of hardware.\n\nThe ethical
    hackers say this would have been achievable as the hardware in question can be
    purchased cheaply online on sites like eBay.\n\n\"This was a vulnerability identified
    in a test environment,\" said Ged Evans, CEO of RDM.\n\nHe said the test \"went
    beyond\" what such exercises usually involved, as it \"included dismantling our
    hardware\".\n\n\"In any event we have acted at pace to address this issue and
    have already deployed first patch releases and have been in proactive contact
    with our customers to flag any issues and recommend mitigatory steps,\" he added.\n\nRDM
    confirmed that there was no sign of any malicious activity on the controllers
    and that it continued to work with the NCSC and other authorities to monitor the
    situation.\n\n## Get in touch\n\nWhat are your thoughts on this topic? Let us
    know\n\n[Contact form](/send/u254133050)\n\n- \n[\n\nUK meat industry hit by cyber-attack
    which targeted European supermarket freezers\n\n](/news/articles/ckq6ndq8l6v0o)\n\n
    \ - \nPublished\n\n3 November\n\n- \n[\n\nIf hackers can take control of a supermarket
    freezer, how vulnerable is other tech?\n\n](/news/articles/ckpqg8lve73go)\n\n
    \ - \nPublished\n\n2 November\n\n[Sign up for our Tech Decoded newsletter](/newsletters/zxh6cxs)
    to follow the world's top tech stories and trends. [Outside the UK? Sign up here](https://cloud.email.bbc.com/techdecoded-newsletter-signup).\n\n##
    Related topics\n\n- [Cyber-security](/news/topics/cz4pr2gd85qt)\n- [Supermarkets](/news/topics/cm11e5kg099t)\n-
    [Retailing](/news/topics/ce1qrvlegjyt)\n- [Cyber-attacks](/news/topics/cp3mvpdp1r2t)\n-
    [Computer hacking](/news/topics/c347w30eq7xt)"
