  author: hilbert42
  text: You don&#x27;t need the internet for warning&#x2F;failure detection, we had
    sophisticated systems in everything from power stations, water supplies&#x2F;dams,
    burglar alarms etc. long before the internet. The intrinsic nature of these specialist
    networks made them hard to hack.<p>It&#x27;s been known almost since the inception
    of the internet that putting systems online that used the standard internet made
    them highly vulnerable, so it&#x27;s why critical systems should not be put online
    but use proprietary methods&#x2F;protocols that cannot be easily hacked, especially
    so if used with specialized hardware built for the purpose.<p>It&#x27;s clear
    to me this was either cheapskate design, or fashion, or done for convienience—i.e.
    check the status with a laptop or one&#x27;s phone.<p>We&#x27;ve seen this security
    shortsightness previously, for example axing the job of the dam keeper who&#x27;d
    always be present to open and close dam sluice gates just because someone could
    monitor the dam online from afar—just to save a few bucks.<p>It&#x27;s not as
    if these vulnerabilities weren&#x27;t foreseen, they were. Now these dumb (and
    greedy) planners are paying the penalty.
