  author: OkCompute64
  text: From the article<p>&gt; It was thought the UK had largely escaped such hacks
    as the British refrigeration industry relies on different devices but there was
    in fact a potential vulnerability the sector has been rushing to fix.<p>&gt; In
    late October, security researchers discovered a major flaw that, if found by hackers,
    could have led to even worse damage to the UK.<p>Having worked with industrial
    equipment like this that often had some kind of network interface retrofitted
    to a 20+ year old device; I am going to <i>guess</i> it was a manufacture default
    master password that can be used to remotely manage&#x2F;reset&#x2F;reprogram
    the device and that essentially all deployed units never changed&#x2F;disabled
    it.<p>In fact it may not even have been <i>possible</i> to disable or change it.
    It is scary the number of appliances, both industrial and consumer, that have
    &quot;secret god mode&quot; reset passwords and also just happen to work remotely..<p>Now
    to defend the manufactures <i>a little bit</i> here these master passwords were
    originally used because these devices didn&#x27;t have any kind of network connectivity
    <i>at all</i> when they were originally design back in the 90s (or perhaps even
    earlier).<p>They were there for an engineer to come along, plug in an RS232 or
    similar and they could use the master password to just fix whatever was wrong.
    Then over time either networking&#x2F;internet functionality was added via an
    additional interface (such as a master control unit all machines were connected
    to and then <i>that</i> MCU had network&#x2F;internet access but essentially acted
    like an unmanaged network switch and just passed on whatever it was sent) or directly
    to the system in a new model revision.<p>However nobody deals with the whole master
    password part and so you end up with a warehouse or supermarket freezer that is
    now on the internet and if you&#x27;re lucky &quot;protected&quot; by CG-NAT (usually
    that is the best case, rarely do you see any real network security in these setups)
    with essentially a remote login that all use the same password.<p>Of course this
    is just a guess from my own experience but if I were a betting man that is where
    I would put my money.<p>As for the &quot;security researchers discovered a major
    flaw&quot; I would also <i>guess</i> this flaw has been known by the manufactures
    since forever but it was security through obscurity as few people knew of a master
    password or how to use it.<p>However most likely aided by LLMs some researchers
    just dropped in firmware blobs from industrial systems they started looking at
    after the hacked systems in France in the summer and the LLM did what they do
    extremely well and find these things.<p>This set off the alarm bells and the NCSC
    got involved as a national security concern and thus begins a quiet but rapid
    call to mitigate the issue before someone else discovers it.
