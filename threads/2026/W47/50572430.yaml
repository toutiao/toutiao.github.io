    Russia killed 300 of its own people in false flag bombings on Russian apartment
    buildings to build public support for the Second Chechen War.<p>(It was a typically
    Russian fiasco. At least one bombing was to be done by the FSB. The local police
    weren&#x27;t looped in. Residents and police found the bomb, the police arrested
    the men responsible for planting it, turns out they were FSB agents. Moscow intervened,
    had the FSB agents released.<p>The Speaker of the Duma accidentally condemned
    the awful bombing in Volgodonsk. They got their dates wrong, and announced the
    Volgodonsk bombing three days too early, as that one hadn&#x27;t yet been blown
    up. Sure enough, they blew it up anyway three days later, killing 17 people.)<p>These
    bombings triggered the second Chechen war,  which saw Putin elected President
    the next year.
