  author: Lio
  text: A national network of fridges uses quite a bit of energy to run.  Cooling
    empty fridge space on that scale is a huge waste of energy and money.<p>Connecting
    them up to an integrated logistics system opens up big savings.  You can start
    cooling only as a delivery is on the way and at temperature when it arrives.<p>Britain
    has historically had some of the best run supermarkets in the world.  This is
    a way to pass savings on to customers.<p>It&#x27;s one reason why fresh produce
    is generally cheaper in the UK than the USA even though the cost of energy is
    much higher in the UK.
