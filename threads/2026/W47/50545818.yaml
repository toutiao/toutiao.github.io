  text: ATMega vs ATTiny no longer exists.<p>Microchip, for some reason, decided to
    rebrand like in 2022.<p>They are called AVR DD, DA, DB, EA, EB, and DU now.<p>They
    are better than both ATtiny and ATmegas of old. But the rebranding seems to have
    been a mistake IMO. I feel like a lot of hobbyists missed the name switch.<p>The
    AVR DD is cheaper, lower power and (if you buy VFQN packages) smaller than any
    ATtiny ever was. They are good products IMO if you only need an 8-bitter still
    in 2026.<p>---------<p>The Cortex M0+ parts have dropped down below $1 however,
    but they still seem to have worse peripherals than an AVR DD or AVR EA. The ADC,
    AC, DAC and LUTs offered by AVR remains legendary.<p>But if you want something
    like a 2014 era ATMega or ATTiny but 32-bit, well yeah those Cortex M0+ chips
    are possibly a superior choice. Comparable peripherals to the 8-bitters of the
    2010s but with more SRam and Flash.<p>I would say that the standout Cortex M0+
    chip line is TI&#x27;s MSPM0+ line, which come in with ATMega328 like peripherals
    but like 50cents and modern 32-bit ... Or you can buy the more expensive ones
    with OpAmps.... Even fancy OpAmps like chopper OpAmps or self-zeroing OpAmps (or
    regular rail to rail OpAmps, etc. etc).
