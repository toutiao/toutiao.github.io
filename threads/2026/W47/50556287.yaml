  author: tialaramex
  text: 'We know LLVM has miscompilation bugs. Sometimes it is practical for Rust
    to fix those bugs and so it carries patches for LLVM, but in some cases LLVM IR
    semantics are just incoherent nonsense. An example of the former (Rust carries
    patches): LLVM got confused about discriminants when Rust uses niches, when the
    niche bit pattern used was usually right next to the legitimate values for a type
    the bug in LLVM caused little notice, it could corrupt data but probably not.
    However Rust changed which bit patterns to prefer here, so e.g. None for Option&lt;char&gt;
    went from 0x0011_0000 to the bit pattern 0xFFFF_FFFF and now that same LLVM bug
    caused crashes as values which had previously been very slightly wrong were instead
    hugely wrong.<p>For an example of the latter (LLVM is just nonsense): LLVM still
    today has a bug found years ago where pointer provenance (a legitimate but hard
    to think about idea for optimising compilers) accidentally leaks into integers,
    and so LLVM can end up with two integers a, b which it believes are not equal
    and yet a - b == 0. Boom.'
