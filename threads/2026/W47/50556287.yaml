    to handle some operations.<p>And according to sources like CISA and the NSA [1],
    Java is considered memory safe. Furthermore, Rust has been found to have some
    memory safety issues as well [2]. I think the point to get across is that yes,
    Rust can help eliminate a very large set of memory safety bugs, but it&#x27;s
    prone to issues that other generally considered memory safe languages also have:
    at some point to do useful work there are going to be unsafe operations. The surface
    area might be much smaller, so you&#x27;re likely better off using a memory safe
    language if you can help it, but it&#x27;s not a panacea for having layers of
    security, especially since it means any issue found is likely to affect a large
    swath of code written in the language because it&#x27;s in a load bearing area
    of the language ecosystem.<p>[1]: <a href="https:&#x2F;&#x2F;www.nsa.gov&#x2F;Press-Room&#x2F;Press-Releases-Statements&#x2F;Press-Release-View&#x2F;article&#x2F;3608324&#x2F;us-and-international-partners-issue-recommendations-to-secure-software-products&#x2F;"
