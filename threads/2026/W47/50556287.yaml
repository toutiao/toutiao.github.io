  text: "&gt; PPS The Java memory model is just superior to Rust&#x27;s in every way...deal
    with it.<p>I don&#x27;t see it. In Safe Rust we can&#x27;t write a Data Race so
    we get SC&#x2F;DRF because we know we don&#x27;t have a data race. If we write
    <i>unsafe</i> Rust we do need to be careful not to break the rules and introduce
    a data race.<p>In Java we do not get such a promise at all, just the SC&#x2F;DRF
    proof, any of our code might race. However, if we do lose Sequential Consistency
    we still have defined behaviour, we probably no longer understand how our program
    behaves (if it&#x27;s not trivial) but we can say e.g. &quot;I didn&#x27;t write
    any code to delete the database&quot; and so conclude it doesn&#x27;t delete the
    database.<p>This doesn&#x27;t seem like a clean win. I can see valuing either
    proposition more, but &quot;in every way&quot; I don&#x27;t get that."
