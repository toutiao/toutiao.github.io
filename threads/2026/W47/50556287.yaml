  author: tptacek
  text: The simplest core mechanism of these kinds of exploits is that you can groom
    the heap by triggering lots of similar-sized allocations, so you have a good guess
    as to what the heap will contain where your wild write occurs, and then you can
    trigger specific allocations to land juicy victim structs in the heap where you
    want them.<p>It&#x27;s an evolution of the old &quot;nop sled&quot; idea from
    stack overflows (and viruses before that), where you don&#x27;t know exactly what
    the stack addresses you&#x27;re targeting are, but you can in your exploit trigger
    payload include data that will carpet bomb the stack with NOP instructions so
    that you have a big window to guess.
