    rigor&#x2F;ops&#x2F;testing around accuracy for deployment and regression.<p>I&#x27;ll
    give you examples for failures IRL:<p>Offline:<p>- sample distribution for test
    data didn&#x27;t have p99 customers in it, failed in production when it launched
    for those customers.<p>- test data sets were all synthetic, launch to real customers
    fails because data set was not representative of real.<p>Online:<p>- yeah we used
    LLM as a judge in prod&#x2F;online eval, but the judge sampling failed to measured
    against our japanese customers, our bilingual customers, customers with media
    devices etc.<p>- the LLM as a judge was used, but there was no measure of human
    accept rate measures&#x2F;alarms for various use cases (lightbulbs turning off,
    music playing, etc) so the lightbulbs started failing.<p>- there was no consistent
    human sampling of online data, so for example samsung TVs stopped working, but
    no one caught it until 3 months later when some VP was watching his TV and it
    broke and was accelerated despite it affecting 2-3% of customers.
