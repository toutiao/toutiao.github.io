  text: That&#x27;s just a caloric efficiency thing, isn&#x27;t it?<p>Far easier to
    simply spread peanut butter and jelly on bread than to consider how the peanuts
    were harvested, how many bugs were in the fruits, how close the wheat was to molding,
    how much sugar is in the bread, how many years it tooks us to perfect such tasty
    and long lasting ingredients, what potenitally substandard conditions the labor
    involved endured...etc, every time one wants a sandwhich.<p>And then a multiple
    of that easier as well in conversing about a peanut butter and jelly sandwhich
    as few if any of the parties will think about any of the above.<p>We see the same
    in computers. A web dev can make it quite far without once considering the OSI
    model. A game dev can complete an entire career without ever worrying about the
    underlying bytecode.<p>There are situational benefits to diving deeper, of course,
    but I don&#x27;t imagine we&#x27;d make it very far if we had to reinvent the
    universe for every word in every conversation or chain of thought.
