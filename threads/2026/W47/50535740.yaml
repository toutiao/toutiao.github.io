  url: https://newsletter.posthog.com/p/decision-models
  title: Not everything needs an LLM - by Jina Yoon - build mode
  fetch_status: success
  content: "# Not everything needs an LLM\n\n### How we use decision models\n\n[\n\n](https://substack.com/@jinajay)\n\n[Jina
    Yoon](https://substack.com/@jinajay)\n\nLLMs love to yap. Ask a simple question
    and you get a few hundred words of \"it depends.\" It's annoying as hell.\n\nThis
    is why we love [decision models like Jev](https://typesafe.ai/) for simpler tasks.
    You ask a structured question and get a typed answer with a probability, which
    looks something like this:\n\n- **Noul.** Are hedgehogs mammals? → Yes, 0.99\n\n-
    **Choice.** Which animal family do hedgehogs belong to? → Mammal, 0.99\n\n- **Score.**
    What is the current conservation status of hedgehogs? → Least Concern, 0.77\n\nWhereas
    LLMs return free-form and overly confident prose, decision models make model uncertainty
    explicit. In a calibrated model, answers that score 0.8 are right about 80% of
    the time. That means a score of 0.5 is a coin flip.\n\nWe've been experimenting
    with them at PostHog and several use cases have made it to production. This is
    everything we've learned about using decision models so far: when to use them,
    how to use them, and mistakes to avoid.\n\n* * *\n\n## 1. Use them to gate expensive
    LLM calls\n\nDecision models are up to 444.6x cheaper and 193.6x faster than frontier
    models,[1](#footnote-1) so you can use them to check whether you even need to
    make an expensive LLM call at all.\n\nWe do this in a pipeline that scrubs personal
    info in [Replay Vision](https://posthog.com/replay-vision?utm_source=posthog-newsletter&utm_medium=post&utm_campaign=decision-models),
    our product that watches and summarizes user session recordings for you. Here's
    how it works:\n\n- Each session summary goes through 2 yes/no questions from a
    decision model. Using narrow questions like this cuts false flags to about a tenth
    of what a single question produced.\n\n- If either scores 0.4 or above, Gemini
    rewrites the summary without the personal info and it gets checked again.\n\n-
    Otherwise, it's clean and passes through the gate. [In production](https://github.com/PostHog/posthog/pull/120387),
    98.7% skip the LLM call entirely.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!q5Ow!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa914005d-963b-49d5-8581-70159c7e6a46_1920x1080.png)\n\nWithout
    the decision model, we'd have to keep fussing with prompts and regexes that miss
    things, or sending every summary to Gemini to catch the 1% that need it.\n\n###
    But remember they make mistakes\n\nA probability score of 0.85 still means ~150
    wrong answers per 1,000 checks, so plan ahead for false positives and false negatives.\n\nIn
    the PII example, a false positive only costs us an extra LLM call, whereas a false
    negative stores personal data as clean. That's why we set the threshold low at
    0.4.\n\nWhen false positives are the costlier mistake, use _higher_ thresholds.
    For example, we recently updated the PostHog in Slack bot, so it can answer questions
    [without being tagged](https://github.com/PostHog/posthog/blob/master/products/slack_app/backend/temporal/activities/untagged_question.py).
    To avoid being annoying, it checks every message in a channel to see (1) whether
    it's asking for information, and (2) whether PostHog could answer it. Only messages
    that pass both at 0.85+ go through.\n\n> **Takeaway:** Use decision models to
    filter jobs before they hit an expensive LLM call, and set the threshold based
    on which mistake costs you more.\n\n* * *\n\n## 2. Use them as model routers\n\nOur
    [PostHog in Slack](https://posthog.com/slack?utm_source=posthog-newsletter&utm_medium=post&utm_campaign=decision-models)
    bot also uses a decision model as a [model router](https://github.com/PostHog/posthog/blob/master/products/slack_app/backend/services/model_router.py).\n\nWhen
    the bot gets tagged, it first checks whether the message asked for a specific
    model. If not, one `choice` question picks from the list:\n\n_“Pick the cheapest
    option that will most likely finish the task correctly on the first try. A failed
    run costs more than a smarter option.”_\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!28Ha!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffe76f7bf-59ca-48ca-8a92-4f23c2a2532c_1920x1235.png)\n\nEach
    option in the list carries a short note on what that model is good for. GPT Luna
    is described as “a light and very cheap model. Good for short answers, lookups,
    summaries and very small edits.” The decision model then scores the request against
    each option’s text.\n\n### But don't assume they're interchangeable\n\nDifferent
    tasks, models, and providers all have different thresholds.\n\nWe were experimenting
    with using them to auto-merge similar logs in [Error Tracking](https://posthog.com/error-tracking?utm_source=posthog-newsletter&utm_medium=post&utm_campaign=decision-models)
    and found that thresholds changed between v1 and v2 of the same model. We had
    to make its thresholds configurable per PostHog project and keep the judge in
    shadow mode while recalibrating based on [hand-labeled data](https://github.com/PostHog/posthog/pull/117014).\n\nThis
    is one of the reasons why [Fernando](https://posthog.com/community/profiles/42799?utm_source=posthog-newsletter&utm_medium=post&utm_campaign=decision-models)
    on our growth team pushed for a model-agnostic interface early. We now have an
    internal AI gateway for swapping and testing models, including self-hosted ones.\n\n>
    **Takeaway:** Use a `choice` question to route free-form LLM requests to the cheapest
    model that can handle it. Keep in mind that thresholds don't carry over, so set
    them per task and per model.\n\n* * *\n\n## 3. Use them for face-value checks\n\nIf
    a question requires more context or chains of reasoning, it's better to use an
    LLM. However, you can still use a decision model if you have a way to flatten,
    or pre-process the input, so it's checkable at face-value.\n\nIn Replay Vision,
    when a user searches for a theme like \"onboarding friction,\" there's a chance
    for the query to return a few unexpected results because of the way embedding
    distance works.\n\nA decision model can’t \"Rank the top 10 sessions that contain
    summaries that match the user's search query.\" It’s too complicated.\n\nInstead,
    we use the embeddings first to derive an initial list of session recordings to
    pass to the decision model. Then, the only task left for the decision model is
    to look at how closely each result in the list matches the user's original search
    term:\n\n_\"Does this summary describe a session that matches what the search
    looks for?\"_\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!Qn-G!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F42bb4937-025f-4a62-87fc-f6bff543fc98_3840x2160.png)\n\nResults
    are then [reranked](https://github.com/PostHog/posthog/pull/107372) by that probability.
    On 20 test queries, this improved ranking quality by about 25%.\n\n### But avoid
    multi-step reasoning\n\nWe've tried [using a decision model](https://github.com/PostHog/posthog/pull/114045)
    for multi-step reasoning before. Before embeddings were ready in Replay Vision,
    we tried ranking a \"Highlights\" feed of sessions worth a human's time. The questions
    were:\n\n1. Is this session worth watching?\n\n2. If so, why is it worth watching?
    (With choices like “error on screen,” “slow or stuck,” “user confused”, “user
    gave up\", etc.)\n\nProcessing these two questions in order required an hourly
    job that sent large requests – up to 32 sessions and 12-38k tokens each –&nbsp;which
    flooded the model server and blocked other products' calls for hours.\n\nSo yes,
    technically, you can chain decision models into multi-step judgments, but it's
    not operationally worth it. Leave that to LLMs, or do the heavy lifting before
    the decision model sees the data like in the embedding search example above.\n\n>
    **Takeaway:** Decision models judge what's in front of them in a single pass.
    Leave multi-step reasoning to LLMs.\n\n* * *\n\n## 4. Use "
