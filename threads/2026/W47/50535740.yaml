  author: abhgh
  text: |-
    Maybe I should write up a post about this, but about evals ... I have feelings.
    Yes you&#x27;re right that writing evals is hard. And it comes down to the simple fact that the thing that you&#x27;re testing - a LLM-driven feature that presumably suffers from variance and inadequate accuracy - and your measuring device - an LLM judge - suffer from the fundamental problems. But the lure of natural language is such that instead of seeing this pipeline of LLM-driven things as a path of cascading errors, it is easy to view it as one set of problems correcting for another set.<p>In this world, the LLM-driven feature is a probabilistic entity, and the judge layered on top of that is another probabilistic entity. The real work is to look at the judge&#x27;s response and <i>infer</i> the performance of the feature. Good evals make the inference step &quot;pass-through&quot;, i.e., the judge outcomes have a 1:1 mapping with feature outcomes. But this kind of reliability often doesn&#x27;t naturally appear. I think of reliability as being composed of three attributes: (a) consistency: do we get the same result for an eval run on the same llm with the same input (b) inter-llm agreement: do outcomes agree over multiple trials of running an eval over multiple llms with the same input (c) accuracy: does the eval agree with human judgement. You need extra work to guarantee these properties. And even when you can, you won&#x27;t get 100% reliability, but say high 90s, and you still to make a judgement call as to call a feature &quot;functional&quot;.
