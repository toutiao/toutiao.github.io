  text: Disagree. This is configuration dependent, and generally enterprise firewalls
    send a reset to quickly close the connection and letting the client know about
    that instead of retrying assumed lost SYNs.<p>Palo Alto and Cisco firewalls reset
    by default (you can, of course, change that). Linux will if you REJECT instead
    of DROP.<p>You may be configuring to silently drop, but many people don’t.<p>Either
    way, the point wasn’t that you can find all firewalls that way, but that this
    tool purports to be able to tell you quickly when this behavior does occur.
