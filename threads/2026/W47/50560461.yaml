  content: "October 27, 2026 · kixelated\n\n# OpenAI still has a WebRTC Problem\n\nOn
    a previous episode, [I flamed OpenAI for using WebRTC](/blog/webrtc-is-the-problem)
    and it went [viral on Hacker News](https://news.ycombinator.com/item?id=48051951).\n\n**thx**\n\nA
    huge shoutout to Sean DuBois and Justin Uberti (WebRTC **experts** at OpenAI)
    for reaching out after my unhinged rant. You could have just said `@kixelated
    ur dumb` but you didn’t.\n\nAlas, my divinely anointed crusade against WebRTC
    is not over. deus vult\n\n## Hot Take Alert\n\nLet’s say you’re a vibe coder at
    a frontier lab working on a voice AI product.  \nLet’s say you’re making (and
    burning) an obscene amount of cash.  \nLet’s say one of your users vocalizes:
    `what is le capital of France?`\n\nIf your AI ever replies with:\n\n> I’m sorry,
    you broke up, can you repeat that?\n\n**You fucked up**. You picked WebRTC for
    voice AI.\n\n## The Danger that Lurks Beneath\n\nYou boot up your favorite application:
    ChatGPT™. You click on the microphone and grunt:\n\n> What is le capital of France?\n\n**OH
    NO** , hypothetical sudden **packet loss**. A kraken nibbles on some underwater
    cable. All too common I’m afraid.\n\nWebRTC is designed for conference calls,
    aka real humans and real voices. It is hyper aggressive and will drop any late
    audio packets to keep latency **real-time**. Just like Leonardo DiCaprio, anything
    above 30ms is too old.\n\n_What is le France?_\n\nThis kind of sucks for a **voice
    AI product**. You walk out of wifi range, hit a cellular dead zone, or starlink
    terminal switches satellites. Oops, your **tokens are wasted** , or worse, **AI
    tries to guess what you said**.\n\nWebRTC can _usually_ detect packet loss and
    retransmit. But retransmissions are disabled by default for audio. And even when
    enabled, the audio jitter buffer won’t wait for them.\n\n**But why not?** Isn’t
    this networking 101? Just send that shit again?\n\nIt’s because of **us**.\n\n##
    The Speed of You\n\nWe flesh bags consume/produce audio in “real-time”, aka a
    **human clock rate**. Our neurons can only fire so fast.\n\nFor a real-time conferencing
    product like Google Meet, latency needs to be near zero. Any delay is super fucking
    annoying, which is why WebRTC does everything in its power to minimize it.\n\nBlocking
    on retransmissions will cause delays. It’s the fatal flaw with TCP and why WebRTC
    is UDP based in the first place. And worse yet, retransmissions will cause a rapid
    burst of audio on recovery.\n\nThis is a **bad user experience**. Humans do not
    want to wait, then process a burst of audio at 10x speed. WebRTC instead primarily\\*
    relies on **human retransmissions**.\n\n**You:** What is le … France?\n\n**Me:**\n\n**You:**
    I said, what is le capital of France?\n\n\\* Before a WebRTC warrior flames me
    on LinkedIn, read the `fix it fix it fix it` section.\n\nAre we doomed to mediocrity?\n\n##
    Clock That Solder Boy\n\nOf course not. **Wake up old man** , it’s not 2020 any
    longer. The internet is no longer for our flabby lips.\n\nOur robot overlords
    produce/consume audio based on a **silicon clock rate**. We shoved electricity
    into a rock and now it can read a library in minutes. What a time to be alive.\n\nVoice
    agents can **hear and speak** audio faster than real-time.  \nListening at 20x
    the speed? No problem.  \nSpeaking at 20x the speed? No problem.\n\n**Humans stuck
    at real-time.**  \nWe speak too slowly, so **speech-to-text** has to wait for
    us.  \nWe hear too slowly, so **text-to-speech** has to wait for us.\n\nWebRTC
    is designed for humans, not voice AI agents. These poor robots are being held
    back by our mediocrity.\n\n## I Require Context\n\nWhen it comes to LLMs, latency
    budgets get **_weird_**.\n\nNormally you would think of **latency** as the amount
    of time it takes for a grunt to traverse a tin can. However, **LLMs are blocked
    on context**.\n\n![I require context](/blog/webrtc-is-still-the-problem/context.svg)\n_i
    require context_\n\nHere’s a dumb example of context growing over time:\n\n- **1s**
    : What\n- **2s** : What is\n- **3s** : What is le\n- **4s** : What is le capital\n-
    **5s** : What is le capital of\n- **6s** : What is le capital of **France?**\n\nIf
    an LLM tries to answer my prompt **before** getting the full context, shit will
    suck. **France is le gatekeeper** , and everything before it is effectively a
    prerequisite. In this example, what matters is the **latency of the last packet**.\n\nThose
    poor packets that were attacken by the kraken? WebRTC actually had **seconds to
    retransmit** with no latency penalty. The AI agent can process **faster than real-time**
    to catch up without the end user (aka **YOU** ) noticing a thing.\n\nSo that’s
    what Mr. MoQ does. No packet left behind: we keep retransmitting until the AI
    actually needs the audio.\n\n_get stuffed mr kraken_\n\nIt’s not expensive either:
    audio is _tiny_. 1s of Opus @ 64Kbps is 8KB, originally sent as 50 tiny packets,
    but it can be retransmitted as ~6 QUIC packets. We have **literal seconds** to
    retransmit **6 packets** to avoid any user impact.\n\nAnd if we manage to accomplish
    this herculean task: **all the context arrives in time!**\n\nThe model no longer
    has to guess. It no longer has to be trained on silence or distortion either.
    **This is a pure user experience win**.\n\n## Not Just Mics\n\nGuess what? WebRTC
    doesn’t just suck for STT, it also sucks for TTS.\n\n![not just mics](/blog/webrtc-is-still-the-problem/mics.svg)\n_cars
    suck too, I’m an equal opportunity hater_\n\n**Fun Fact** : WebRTC renders audio
    (and video) based on **when it arrives** , not when it is **supposed to be rendered**.
    Every other protocol uses timestamps, but Mr. WebRTC barely looks at them, because
    accuracy is a non-goal. Sure, it’ll nudge audio and video into sync by a few milliseconds,
    but good luck sending the video 500ms after the audio.\n\n**This is a huge problem
    for voice AI**. TTS is generated faster than real-time, stamping each packet with
    a future timestamp. But in order to play back audio at the correct time with WebRTC…
    the agent needs to **sleep before transmitting each packet**.\n\nAnd if there’s
    any packet loss, our TTS is lost, will never be retransmitted, tokens burned,
    yada yada.\n\n_When the kraken attacken, there’s no coming backen._\n\nIf only
    there was some way to signal when to render each audio packet. A stamp of sorts.\n\n##
    Random Access Memory\n\n**Welcome back to the future Marty**. We faster than real-time
    now.\n\n**RAM** has this amazing property of being stupidly expensive. And being
    able to store stuff locally. You know, like audio that needs to be played over
    the speakers.\n\nWe put a timestamp on each audio frame and use that to determine
    when to play it out of RAM. Absurd, I know.\n\n_I’m fast as fuck boye_\n\nIt’s
    how the Youtubes keeps playing back video even when you lose network connectivity.
    MoQ does the same thing but for voice AI. Your _sick_ baking recipe won’t be subject
    to surprise congestion.\n\nAnd don’t you fret, 2 minutes of audio is only 1MB.
    You’re not going to have to take out a loan to buy another RAM stick.\n\n**Disclaimer**
    : this behavior is not IETF standardized. It’s something only my [moq.dev](https://moq.dev)
    clients (and thus Pipecat) support. Be my guest if you want to argue with Cisco
    and get it into the official standards.\n\n## Enter the Antagonist\n\nThen why
    is [OpenAI using WebRTC](https://openai.com/index/delivering-low-latency-voice-ai-at-scale/)?\n\nWebRTC
    is the state of the art for real-time, conversational audio. It’s available in
    every browser via [libwebrtc](https://webrtc.googlesource.com/src), a C++ monolith
    maintained by Google. It’s so complicated and sophisticated that Safari and Firefox
    use `libwebrtc` too, rather than vibe code their own like everything else.\n\nThe
    problem is that **WebRTC _is_ the Google Meet client**. It is designed specifically
    for Google’s conferencing product, **not their voice AI product** (they use WebSocket),
    and certainly not your product.\n\n**quite the anti-competitive ruse tbh**. Google
    can ship product updates without consulting the other browser vendors. No other
    conferencing app can d"
