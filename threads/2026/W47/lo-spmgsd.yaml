    Great reason to always have at least 2 mirrors of your projects (ideally 1 self-hosted where you are in control). You might not have bug tracker up, but at least folks can fetch the source from a fallback for these situations.
    For instance if you use Git, downstream folks that are fetching your Nix overlay, they can get the tarball from Codeberg or self-hosted cgit with pkgs.fetchzip { urls = [ /* … */ ]; } & not be interrupted by downtimes (no, not all source code is in cache.nixos.org).
