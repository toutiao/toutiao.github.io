  text: |-
    So here's the thing - and I don't mean this as victim-blaming, but I do think it's worth calling out because a lot of people don't necessarily understand this. If what I see online is to be believed, the registrar involved here is NameSilo. Their tagline is "Find cheap domain names for your website." Hosting starting at $0.99, that kind of thing. The total extent of Codeberg's years-long relationship with this company is probably less than $100.
    People have a lot of problems like this with registrars because registrars are a highly price sensitive and absolutely race-to-the-bottom industry, where the well-known names run on the thinnest possible margins. They do this by not investing any money in their abuse team beyond what they absolutely have to, and that results in an abuse team that "swiftly resolves" complaints by just suspending the domain. every time.
    The main fix for this is to use an expensive registrar, one with which you actually have a meaningful relationship. The main, and almost only, name there is MarkMonitor. They can cost thousands a year, they definitely aren't perfect, but they do have a legal team that will talk to your legal team about issues like this - before they suspend the domain.
    Registrars are still very much a "you get what you pay for" industry, but unfortunately that only really becomes obvious in infrequent and painful situations like this one. An incredible number of major websites still do their registration through a provider whose main, and only, marketing claim is "cheap."
