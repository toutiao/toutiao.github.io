    This is a strange take. What are "norms"? Whose norms, exactly, should developers adhere to? The whole case for the rule of law is that laws are created through a process which provides, in theory, some level of accountability; in contrast norms are defined by their arbitrariness. If they weren't arbitrary they'd be laws.
