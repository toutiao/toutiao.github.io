  author: sandworm101
  text: 'I have tried some router options over the years without luck. They are not
    ready for a multi-user sharing scenario (10+ devices). It isn&#x27;t the wifi
    but the USB interface that usually gives up, which is why I think an NVME option
    would be better. The one that actually worked was my home router. It was total
    overkill and much too big but could stream properly from usb to multiple devices.<p>It
    sounds petty, but even having to plug in a USB drive to an external port is not
    ideal as they break easily. I would prefer a barrel jack over an easily-broken
    USB-C (I have a couple barrel-USB-c adapters). Internal lithium batteries are
    a no-go due to flying&#x2F;packing&#x2F;mailing rules.<p>Ideal package: Something
    the size of a coke can, with only a power port, that can share a 1 or 2TB media
    library amongst 10-20 devices within a 50-foot range. No fiddly bits to break,
    no external drives. Something that could be dropped a couple times without issue.
    Encrypted file containers (veracrypt) and  rocket.chat would be stretch goals.<p>Doing
    research in the last couple hours, some of the new rugged Pi cases with M.2 ports
    seem be the way to go.'
