  author: netsharc
  text: 'I went on a backpacking tour. My aim was to take a lot of pictures, but I
    didn&#x27;t want to carry a laptop. So my SD card backup setup was: a Raspberry
    Pi clone, a card reader, a 500G Sandisk USB3 external NVMe disk the size of a
    credit card and the thickness of maybe 3 credit cards and a power bank.<p>The
    backup routine was:<p>1. Plug the card to the card reader, plug it into one of
    the USB3 ports of the Pi.<p>2. Plug the NVMe disk into another USB3 port.<p>3.
    Power the contraption from my USB powerbank.<p>4. Plug the phone to the Pi on
    another USB port. Enable network sharing over USB.<p>5. Connect Bluetooth keyboard
    to the phone.<p>6. Open a terminal on the phone,<p>7. Find out the IP address
    of the Pi that the phone&#x27;s DHCP server gave<p>8. SSH into the Pi.<p>9. Run
    rsync to copy files from the SD card to the NVMe disk (luckily the Linux distro
    auto-mounts the USB storage devices).<p>After all that&#x27;s done I can plug
    the NVMe disk straight to my phone to browse the images...<p>I&#x27;ve been thinking
    of creating a Pi distro that creates a WiFi network, and use a Jenkins-like web
    UI so I can just plug everything in and control the procedure from the phone&#x27;s
    browser. One day..!'
