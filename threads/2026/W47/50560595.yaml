  author: dspillett
  text: "<i>&gt; A pocket-sized NAS that could plug into power and share a media library
    via wifi to nearby devices would be VERY useful.</i><p>This already exists. There
    are many portable WiFi APs out there. Some of them have a built-in battery or
    can be powered via USB so you can use some other portable power source (which
    could of course be one of your devices you want to connect via its AP), so you
    don&#x27;t even need to have wired power to plug them into for short use.<p>The
    media sharing side isn&#x27;t massively advertised as the main feature most want
    is to use them to share a cell connection (or another WiFi connection), and perhaps
    offer VPN access over that connection, but a number of them have USB ports that
    are cable of powering and mounting (depending on filesystem of course) an SSD
    so its contents can be shared via an HTTP interface or maybe a common file share
    protocol like SMB.<p>Even if direct media sharing is not supported, you can arrange
    that from one of the devices that you connect to the AP.<p>A quick search for
    “portable hotspot” and “travel router” finds no-name devices claiming 8-to-10
    hours use time per battery charge (obviously take that with a pinch of salt!),
    just mobile-&gt;WiFi&#x2F;WiFi-&gt;WiFi bridge or plain AP (no VPN or file sharing),
    for £17, and devices from more recognised companies for ~£30. Units with built-in
    VPN support (or running OpenWrt where you can probably add that yourself) start
    at more like £40 (GL.iNet devices claim OpenVPN and WireGuard support, I assume
    that is similar on other devices but you&#x27;d have to find more detailed specs
    than the sales page to check that). There are fewer offering built-in storage
    sharing than I expected but they are available (though with storage via SD or
    USB - I&#x27;m sure I&#x27;ve seen units with the option of an internal NVMe or
    SATA drive advertised but none came up in the first pages of my search results)."
