  content: |-
    ## Latest commit

    ## History

    ## Folders and files

    ## Repository files navigation

    # floppy3.5

    floppy3.5 is a 3.5" floppy disk portable WiFi NAS. It reads photos from the floppy disks of old digital cameras like the Sony Mavica. It shows the photos on a web page through WiFi. It can also copy the photos to a microSD card expanding the amount of photos you can take on the move.

    It can read any FAT12 1.44 MB HD disk. It shows the files in the root folder of the disk on the web page and can copy them to the SD card

    slimline 3.5" drive ──26-pin──▶ RP2354A ──SPI──▶ ESP32-S3 ──WiFi──▶ browser (floppy.local) controller bridge └──▶ microSD (/DISKnnnn/)

    The two processors are on one custom PCB. The RP2354A controller uses the Greaseweazle host protocol. You can also use the gw tool with the controller through the secondary USB. The ESP32-S3 bridge controls the controller through a custom SPI link. The bridge decodes the disk and shows the photos on a web page. Both are OTA updatable

    ▶ Click the picture to see floppy3.5 in action on YouTube

    ## History

    The first prototype used an ESP32 development kit, a Greaseweazle-type adapter board with the Greaseweazle firmware, and a desktop floppy drive:

    The current design has the two processors, the charger and the power supplies on one PCB and targeting a slimline drive:

    ## Contents of the repository

    Firmware files that are ready to install are on the GitHub Releases page.

    ## Parts

    Parts on the PCB: Refer to the schematic (hardware/schematic.pdf). The main parts are:

    - An ESP32-S3-WROOM-1-N16R8 module (16 MB flash, 8 MB PSRAM)

    - An RP2354A controller

    - SN74LS07 bus buffers

    - A BQ25180 charger and a MAX17048 fuel gauge

    - An LTC2954 power button controller

    - A TPS63020 regulator (3.3 V) and a TPS61022 regulator (5 V for the drive)

    - An RV-3028-C7 real-time clock

    - A microSD socket

    Other system parts:

    ## Build the board

    > WARNING: Make sure that the polarity of the battery connector is correct before you connect the battery. Incorrect polarity can cause damage to the LiPo battery. A damaged LiPo battery can cause a fire.

    WARNING: Make sure that the polarity of the battery connector is correct before you connect the battery. Incorrect polarity can cause damage to the LiPo battery. A damaged LiPo battery can cause a fire.

    - Order the PCB. Use the files in hardware/gw-esp32-2_gerber.zip.

    - Order the parts and assemble the board. Use the schematic and the assembly drawing.

    - Install the LiPo battery. The board does not start without the battery. With only USB power, the voltage decreases too much at power-on.

    - Install the firmware/esp32-bringup/ firmware.

    - Make sure that all tests pass. The results show on the USB serial console.

    - Install the usual firmware.

    The PCB was kindly subsidised by PCBWay, I would have used them anyway so was very happy for their support

    ### LCD connections

    Connect the wires as follows:

    ## Print the housing

    The files are in mech/:

    The 3MF files have a paint line. Use the paint tool of your slicer on this line to apply a different color to the front band.

    To assemble the housing:

    - Install the M2.5 heat-set inserts in the posts of the top half.

    - Install the M2 heat-set inserts in the LCD bosses.

    - Put insulation tape on the top cover of the drive.

    - Put the PCB on the tape.

    - Attach the two halves with the M2.5 screws from the bottom.

    ## Firmware

    ### Install the prebuilt firmware

    Get the firmware files from the Releases page.

    Controller (RP2354A):

    - Push and hold the BOOTSEL button (S4).

    - Connect the power. On a blank chip, you do not have to push the button.

    - Copy gw_rp2354.uf2 to the RP2350 drive on your PC.

    When the bridge operates, you can also update the controller through WiFi from the web page.

    Bridge (ESP32-S3): You must install the firmware through USB the first time:

    esptool.py --chip esp32s3 -p <PORT> erase_flash esptool.py --chip esp32s3 -p <PORT> write_flash @flash_args

    After this, you can update the firmware through WiFi. On the web page, go to Rear panel ▸ SHOW ▸ FIRMWARE UPDATE.

    ### Build the firmware from the source code

    Controller: You must have pico-sdk 2.x (for the RP2350), arm-none-eabi-gcc, CMake and Ninja.

    cd firmware/rp2354 cmake -S . -B build -DPICO_SDK_PATH=<path-to-pico-sdk> cmake --build build

    The build makes two files:

    - build/gw_rp2354.uf2: to install through USB.

    - build/gw_rp2354.bin: to install through WiFi.

    Bridge: You must have ESP-IDF v5.2 or later. The first build downloads the managed components (mdns, qrcode and led_strip).

    cd firmware/esp32 idf.py set-target esp32s3 idf.py build flash monitor

    Use the same procedure for firmware/esp32-bringup/.

    Host tests: These tests do not need a board or a target toolchain. Run test/host/build.ps1 in firmware/esp32 or in firmware/rp2354. You can use TinyCC, gcc or clang.

    ## Operation

    ### Set up the WiFi

    - Start the device. The first time, the bridge starts an open WiFi access point with the name Floppy-Setup.

    - Connect your phone or PC to Floppy-Setup. The setup page opens. If it does not open, go to http://192.168.4.1/.

    - Type the name and the password of your network.

    - Submit the data. The device starts again and connects to your network.

    - Go to http://floppy.local.

    If the password is incorrect the device tries 5 times after it goes back to the setup mode.

    ### Buttons

    Each disk gets a different folder. This is necessary because a camera starts the file numbers again at MVC-00001 after you erase the disk. The device compares the contents of the files (SHA-256). It does not copy a photo that is already on the card. If the card already has a copy of the full disk, the device does not copy the disk. To copy the disk again, do a long push on SAVE.

    ### The screen

    The LCD looks like a segment display. Unused segments and icons show as light "ghosts" and come on in dark ink when they are active.

    Status bar (all screens): The icons at the top are, from left to right:

    The battery level is at the right. Below the icons, the free space on the SD card shows, or NO SD CARD.

    Screens:

    Track map: The 80 cylinders show as 4 rows of 20 columns. Each column has two blocks, head 0 on top and head 1 below. Each block is one track:

    - Dark: the track was read correctly.

    - Only the bottom of the block is dark: the track was read correctly after a retry.

    - Blinking: the track has bad sectors.

    - Light: the track was not read yet.

    ### USB and Greaseweazle

    The controller is a USB CDC device with the VID:PID 2E8A:000A. The gw tool does not find the device automatically. Thus, you must give the port:

    gw read --device <PORT> --format ibm.1440 disk.img

    ### Quirks

    - The charger needs the firmware to set its limits. The default settings of the BQ25180 charger are too low for this board. For example, the default battery over-current limit (1000 mA) trips when the drive starts to turn on battery power. The ESP32 firmware sets the correct limits at each start. Thus, install the ESP32 firmware for the first time with the board on USB power. Until the firmware runs, the device does not operate fully on battery power.

    - The peak current can be near the charger limit. A disk read together with WiFi traffic at full transmit power draws a high current. This current can come near the battery current limit of the charger (1500 mA). I did not see a problem during my tests. If you build the device and you get resets or power loss during a read, please open an issue.

    ## Credits and license

    The controller speaks the Greaseweazle protocol by Keir Fraser (keirf/greaseweazle), and its firmware is a port of the Greaseweazle firmware to the RP2354. The command handling follows his firmware closely. The flux engine, the part that reads and writes the disk signal, was reworked to use the RP2354's own hardware: PIO programs and DMA take the place of the STM32 timers that Greaseweazle uses.

