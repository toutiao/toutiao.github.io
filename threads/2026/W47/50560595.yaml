  author: ssl-3
  text: 'Try it again?  Things do change.<p>A Pi (or any other small-ish linuxey-type-thing)
    can work, but the built-in wifi isn&#x27;t very good on a Raspberry Pi.  A different
    wireless adapter connected to USB helps tremendously, but now:  There are two
    boxes.<p>Consequently, it seems that there are always going to be two boxes (even
    if you print or find a special case) for any performant solution.<p>So if it&#x27;s
    going to have two boxes, then:  Why not put the big&#x2F;fast storage in one little
    box, and the compute+fast wifi in another little box?<p>Something like a Beryl
    7[1], maybe?<p>Diminutive box.  Fast networking (wifi 7 with usefully-folding
    antennas, 2.5-gig ethernet).  Runs from USB C with proper multi-voltage PD, so
    you can standardize on power supplies&#x2F;chargers with the rest of your kit.<p>Has
    <i>enough</i> built-in storage and RAM to be a file server (512MB is still a ton
