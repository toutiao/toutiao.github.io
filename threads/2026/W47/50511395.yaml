  author: g-b-r
  text: Somewhat related, I&#x27;ve been getting a lot of spam with links to urls
    of big, reputable, organizations, such as universities.<p>You&#x27;d think that
    the organization was hacked, but in all these case instead these were old domains
    that used CNAMEs.<p>The domain that the CNAME pointed to was once owned and used
    by the organization, but at some point it was let go, and it ended up being purchased
    by the spammers.<p>So, the spammers were able to use links that looked safe, and
    maybe that also helped with passing spam filters.<p>Thus, if you manage domains,
    please keep track of the ones with CNAMEs, recommend the users to tell you when
    they stop using them, and maybe check every once in a while (better if automatically)
    that the domain they&#x27;re pointing to hasn&#x27;t changed hands.<p>I&#x27;d
    be curious to know how the spammers find these old cname domains, by the way.
