  author: ljm
  text: I think the problem has always been the shit that gets appended in the query
    string, like UTM parameters for analytics or other random stuff that has no real
    impact on the rendering of the page itself.<p>The other problem was the dawn of
    the slugified URL where the title of the page was converted into a URL friendly
    format, and then the page&#x27;s actual ID appended in it somewhere. The slug
    was just for SEO because it looked more &#x27;readable&#x27; but the only thing
    responsible for fetching the page was the ID attached to it.<p>I think the walled-gardening
    of the internet was more responsible for this than individual webmasters. Half
    of that tech is useless unless you are running the hosting platform for bloggers
    or tweeters or whoever, and it was those companies playing the SEO arms race with
    Google.
