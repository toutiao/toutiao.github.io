  author: shagie
  text: The issue wasn&#x27;t necessarily the stable URLs underneath, but the query
    parameters being long with characters in them that often broke or confused older
    systems.<p>Remember too that we were often dealing with 1024 x 768 or even 800
    x 600... 1280 × 1024 was the emerging laptop standard.  Long URLs without formatting
    would often wrap the text display panel.<p>Those that didn&#x27;t reformat would
    have formatting issues.  Those that did attempt to wrap excessively long lines
    on punctuation and hyphens would break the URL.<p>One very long url in a chat
    panel on the side of a web game would cause everyone&#x27;s chat panel to be messed
    up until that scrolled off.<p>URL shorteners were (for me) more useful for ephemeral
    chat where it will scroll off the screen in an hour or so.<p>They lost their utility
    when message boards would take really long lines and reformat them (like HN does)
    so that they fit or would allow for [title](link) style so that the ugly url could
    be hidden behind a nice title.
