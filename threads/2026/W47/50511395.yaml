  author: xp84
  text: 'Link shorteners <i>that are outsourced</i> are in my humble opinion an order
    of magnitude worse for the internet than they would be if in-house.<p>The way
    they accrete URLs over time, and then time passes, and anything can happen (your
    account gets deactivated, shortener company goes out of business &#x2F; experiences
    catastrophic data loss &#x2F; etc) is just asking for permanently broken links
    which may be unfixable.<p>Especially when you consider how these services can,
    unless they&#x27;re spammy enough to inject gross interstitial ad pages, make
    0 revenue from you if you aren&#x27;t currently paying for a premium service,
    it&#x27;s easy to see how they can go under.<p>Note: Clearly with the kind of
    ephemeral crap these 2011 tweets were, I&#x27;m assuming the &#x27;attacker&#x27;
    publicized &quot;Hey guys look at these funny tweets&quot; because obviously who
    cares about 15 year old McDonalds marketing messages. But in general it&#x27;s
    sad to see these still being used. To be fair to bitly, they do offer the ability
    to use your own domain at least, but sadly, with a service targeted mainly at
    marketing departments, usually they don&#x27;t have the ability to work with the
    in-house tech team(s) to even set up DNS.'
