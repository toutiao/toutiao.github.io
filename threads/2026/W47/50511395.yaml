- id: '50512532'
  parent_id: '50512250'
  author: transcriptase
  text: My take is that any shortener without one would voluntarily close doors after
    being inundated with the most illegal, scammy, and horrid use-cases, and subsequent
    requests from law enforcement that would far outweigh any ROI.
  score: 0
  posted_at: '2026-11-16T00:33:01Z'
- id: '50512571'
  parent_id: '50512393'
  author: g-b-r
  text: They can also accumulate a fair amount of data to sell (IP x was interested
    in y at time z)
  score: 0
  posted_at: '2026-11-16T00:37:34Z'
- id: '50512586'
  parent_id: '50512151'
  author: dijit
  text: Yeah, but the alternative is everyone having a short domain, which is unfortunately
    difficult due to the fundamental mathematical principle that a low amount of characters
    has a very small number of options available.<p>Everything with finite space is
    expensive, the more finite the more expensive.<p>So, while I am in favour of what
    you say, and I’m in favour of self-governance as much as possible, I understand
    the challenges.
  score: 0
  posted_at: '2026-11-16T00:39:44Z'
