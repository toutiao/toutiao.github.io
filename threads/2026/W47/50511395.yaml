  text: |-
    I&#x27;m surprised there isn&#x27;t a DNS standard or standardized API for link shorteners.  You&#x27;d think we&#x27;d have a SHORTN record type that works like SRV or TXT with a standard format to verify where the short link is supposed to point.  For example:<p><pre><code>    short.name. 300 IN SHORTN 0 5 &#x2F;foo https:&#x2F;&#x2F;some.long.name&#x2F;whatever&#x2F;foo
    </code></pre>
    ...could tell a browser&#x2F;app&#x2F;whatever that http(s):&#x2F;&#x2F;short.name&#x2F;foo is supposed to point to <a href="https:&#x2F;&#x2F;some.long.name&#x2F;whatever&#x2F;foo" rel="nofollow">https:&#x2F;&#x2F;some.long.name&#x2F;whatever&#x2F;foo</a><p>At the very least, we could have a standard shortener API call that clients could use to verify before allowing the link redirect.
