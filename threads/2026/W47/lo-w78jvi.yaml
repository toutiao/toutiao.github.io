    I think it's a fun idea and more practical than the truly sparse gemtext of Gemini, but I suspect you'd still run into limits too often. I've found I often embed raw HTML when I blog with Hugo or use short codes like figure. My html base template needs things like a link to my RSS feed for auto discovery (although I'm hoping we can standardize feed menus as a replacement for that).
    I've seen a couple RSS feeds embedding Markdown instead of HTML, which makes a lot of sense if you write in Markdown anyway and the feed reader is going to apply it's own style.
    I'll suggest adding <link rel=alternative type="text/markdown" href="..."> to your HTML so people can auto discover markdown on sites that support it. I think I saw some docs sites doing this (especially for agents to read).
