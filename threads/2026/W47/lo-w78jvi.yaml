    HTML is a fine format as is.

    Agreed. I haven't assembled a real web page since the 20th century, so the modern stuff, from CSS on, goes way over my head. I judge in part based on demos and competitions. I rather miss the competitions for who could do the smallest web pages...
    Random associated example --
    https://1kb.club/
    https://250kb.club/
    https://512kb.club/
    https://1mb.club/
    Whereas with JS these days, there are no effective limits. You can embed full-function rich apps in pages; this is entirely normal. You can embed browsers in those apps to make them standalone, at horrific cost. Balena Etcher is my default image writer app and it's 200MB. I have used multiple entire OSes that were much less than 200MB. I have installed and run OSes that were less than 2MB in production. Hell, I used an OS whose working set was about 2kB, and I used it for some years.
    You can run a VM in a web page, and in that VM, run an entire desktop OS, and in that OS, run another emulator if you want. It's not a markup language, it is an entire computer platform -- one with a bad, loose, incomplete, and ever-changing spec.
    We don't need Gemini. We just need a movement of web sites that completely ban JS and celebrate it as a badge of pride. No cookies, no scripts, no worries. What's left is more than enough for a rich interactive web.
