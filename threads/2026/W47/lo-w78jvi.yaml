    The allure of writing in Markdown has always been simplicity, and to an extent, "progressive enhancement". (I'm unsure if this is the correct term here, I mean the following.)
    Many Markdown renderers allow certain HTML elements, and LaTeX math mode to be interleaved with Markdown syntax, which alleviates most of the restrictions one can feel imposed upon them when writing Markdown. Importantly, if no need arises for such additions, one can ignore these extensions to the language, and keep to the minimalistic parts of Markdown.
    The problem is that this extension of Markdown not standardized, and is an incohesive amalgam of three different markup languages. A language that achieves roughly the same goal as the Markdown+HTML+LaTeX monster, is Typst.
    Basic markup in Typst is almost exactly the same as in Markdown, unlike HTML and LaTeX, which have an uncomfortable amount of boilerplate (i.e. bold versus <b>bold</b> or \textbf{bold}). Simple styling, usually achieved through embedded HTML in Markdown is also simpler, and is more cohesive in Typst. Math mode is also nicer in Typst, than in LaTeX-in-Markdown.
    Point is, in my opinion, that Typst fits the "progressively enhanced markup language" niche the best, which is only approximated by Markdown, and barely poked at by HTML and LaTeX. Typst would fit the idea of the post perfectly, even more so than Markdown.
