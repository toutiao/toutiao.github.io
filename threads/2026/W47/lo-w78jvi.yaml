    I've found I often embed raw HTML when I blog with Hugo

    I can get farther with reStructuredText (not in the Markdown spec: actually having metadata in the file like every other creative work format, summary/details, abbreviations, callouts, description lists, table captions, figures, attributions/citations for quotations, footnotes). I found one case where I needed straight up raw HTML (embedding a certain SVG), & I still do a fair amount of post processing. All this to say is we lose so much of the richness & semantics HTML provides by stripping things down to dumber & dumber formats—for both humans & the robots (if one cares). A huge part of the problem is all the gunk added to the markup: ads, 4000 Tailwind classes. With the more modern advancements in CSS/SVG, we don’t need nearly as much JavaScript or 80% of the hacks still floating around there that have duplicate elements, tons of wrappers, & so on. HTML is a fine format as is.
    w3m is out there rendering HTML pages just fine in plain text (& is subjectively easier to read than Markdown). I wish we were targeting TUI browsers instead—where I have long suggested this as a coarse sanity check that your site is easy to crawl & easy for screen readers.
