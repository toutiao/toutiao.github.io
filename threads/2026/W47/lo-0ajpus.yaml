    ## Unlocking agent development

    Because ABFS does lazy loading and local cache deduplication, developers and their agents can now mount multiple concurrent Android workspaces on a single machine, benefit from a shared local build cache, and achieve massive scale in development time.

    # Mount 5 distinct Android release branches side-by-side in under 8 seconds each $ abfs mount -b android-latest-release /ws/a17 $ abfs mount -b android16-qpr2-release /ws/a16qpr2 $ abfs mount -b android16-release /ws/a16 $ abfs mount -b android15-release /ws/a15 $ abfs mount -b android14-release /ws/a14

    An agent can check out a full Android tree in under 10 sec
