  author: moltopoco
  text: 'Just one data point, because I have to get it off my heart. I loved Modern
    C++ when it meant C++11, but I&#x27;ve become more negative with each new language
    standard reaching my workplace.<p>Using string_view over string by default is
    probably the #1 cause of memory errors that landed on my desk. I also keep hearing
    that &quot;int x{0}&quot; is preferable to &quot;int x = 0&quot; which allows
    for super dangerous implicit conversions, but then the same people rewrite push_back
    into emplace_back, which is much more lenient w.r.t. type conversions. It is also
    much easier to litter every function with [[nodiscard]] constexpr nothrow than
    it is to argue for readability.<p>My best explanation is that &quot;Modern C++&quot;
    is making developers biased towards whatever language feature is newer, instead
    of making good decisions. I wish the community gave up on the moniker.'
  score: 0
