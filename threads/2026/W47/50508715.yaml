  author: spacechild1
  text: "`string_view` (and `std::span`) is great! Finally I don&#x27;t have to use
    concrete types like `const std::string&amp;` or `const std::vector&lt;float&gt;&amp;`
    as function parameters when all I really want is just something that <i>behaves</i>
    like a string or array&#x2F;vector type.<p>In fact, `std::string_view` can lead
    to very elegant and efficient (zero-allocation) string parsing code.<p>IME, taking
    a string_view as an argument is pretty unproblematic. Two areas where I have seen
    problems:<p>1. returning a string_view from a function. Think twice before doing
    that.<p>2. calling data() and passing the result to a function that expects a
    null-terminated C strings. (std::string_view is not guaranteed to be null-terminated.)<p>---<p>Apart
    from that, there are so many great features and libraries in C++17 and C++20 that
    I use on a regular basis and that I would really miss:<p>- structured bindings<p>-
    if-statement initializers<p>- fold expressions<p>- inline variables (<i>very</i>
    useful for handling global state in header-only stuff)<p>- if constexpr (replaces
    many uses of SFINAE)<p>- concepts (replaces all of the remaining uses of SFINAE)<p>-
    coroutines (really nice to use with ASIO)<p>- std::optional<p>- std::variant<p>-
    std::filesystem<p>- std::format (although I personally stick to fmt::format)<p>-
    from_chars() and to_chars() (fast, local-independent string-number conversion
    routines)<p>- std::bit<p>- std::apply, std::invoke, std::bind_front<p>- etc."
