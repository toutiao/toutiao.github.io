  author: qalmakka
  text: The problem is that the language is simply too complex with way too many corner
    cases.<p>For instance, C++ the only programming language that comes to my mind
    where the grammar is type 0 in the Chomsky classification - it means it has to
    be parsed with a Turing machine and thus every C++ compiler suffers from the halting
    problem.<p>This means that having a C++ compiler that will never crash or hang
    is literally mathematically impossible unless you stick to only parsing a subset
    of the grammar. Modern compilers bypass this by doing things like capping how
    many times templates can recurse, etc but this means that the frontend it will
    inevitably end up in unsavoury corners where it relies on its authors explicitly
    handling them - which sometimes they did not
