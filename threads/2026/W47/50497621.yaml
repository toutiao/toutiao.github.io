  author: nanolith
  text: I can give a real-life example. WPA2 was formally verified at the protocol
    level, but the formal specification -- while reviewed by multiple humans -- was
    flawed, which directly led to the KRACK attack.<p>The Needham-Schroeder Public-Key
    Protocol failed to include the responder&#x27;s identity in the protocol, which
    led to a man-in-the middle attack found via model checking. This is despite numerous
    proofs -- some even machine-checked -- of implementations against specification.<p>When
    cryptocurrencies had their formal methods moment a few years ago, there were numerous
    vulnerabilities and attacks found in cryptocurrency protocols despite claims of
    being formally verified, and despite much of this verification being published
    in Rocq, Lean, etc. If the specifications are unsound or flawed, then the implementations
    will also be. While in these cases, it&#x27;s quite clear that the folks performing
    the formal methods work were likely inexperienced, I don&#x27;t see how an LLM
    will create anything more sound.<p>Remember that an LLM is trained on publicly
    available information. It&#x27;s not going to make a leap above and beyond what
    has been published openly, and much of what has been published with respect to
    security is related to student projects (e.g. &quot;Let&#x27;s build a formally
    verified AES implementation&quot;) or one-off applications, some of which, like
    WPA2 KRACK, have incomplete specifications.<p>This is a difficult problem that
    experienced proof engineers get wrong, after performing rounds of threat modeling
    and review.
