  author: nanolith
  text: 'It&#x27;s not just a matter of competence: it&#x27;s a matter of knowledge,
    experience, and tenacity. Currently, frontier model companies are trying to tackle
    the problem of their models writing potentially unsafe software by demonstrating
    that their models can build formal proofs. However, someone who lacks formal verification
    experience, the domain knowledge to make such software safe, or the understanding
    to combine the two into formal specifications will build bad proofs, because the
    formal specifications will be unsound. LLMs don&#x27;t necessarily improve this
    outcome. An inexperienced engineer, with or without LLM assistance, is just as
    likely to not add a property to verify that nonces aren&#x27;t re-used as the
    WiFi Alliance.<p>WPA2 wasn&#x27;t designed by a single individual. It was designed
    by a committee of people including respected cryptographers and information security
    folks. They missed the fact that nonces could be re-used in the design, and they
    trusted the formal specifications that lacked a check on nonce re-use. It happens.
    Unfortunately, formal specifications tend to trap folks into a sense of complacency.
    Soundness is a hard problem, and if it&#x27;s not solved, folks will make bad
    assumptions. &quot;But, it&#x27;s been formally verified...&quot;<p>Could LLMs
    accelerate tactics and Curry-Howard level hole filling of specifications? Absolutely.
    But, they aren&#x27;t likely to do much better than humans at building sound specifications.
    This is a difficult problem, for experienced humans with a narrow specialization
    in formal methods.'
