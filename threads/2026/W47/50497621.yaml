  text: "&gt; For any first-order universally quantified property of a program we
    can write as a property-based test, I think we will be able to generate proofs
    at the binary level, against architecture models that have themselves been validated
    by millions of hours of testing. The challenge of extending this to multi-threaded
    programs, distributed systems, [..] will be years more of work we must conduct
    across thousands of verification engineers and researchers.<p>I expect the distributed
    and concurrent version of this will come more quickly. In fact, I would be willing
    to bet that by EOY 2030 the bar mentioned here of single threaded software will
    be met for multi-threaded and distributed systems under non-adversarial failure
    modes. This is significantly more aggressive than most in the field (and I&#x27;m
    field-adjacent at best), but given the rate of progress I think it&#x27;s actually
    a rather conservative bet (the really aggressive bet would be &quot;July 2027&quot;).<p>&gt;
    The more &quot;bouba&quot; a piece of software or a given layer is, the harder
    it is to talk about what makes it correct. We can always talk about some correct
    attributes, but to talk about a uniform notion of correctness is not possible
    in my opinion.<p>I largely agree with this, although I do think we&#x27;re going
    to see more progress than expected in quantifying (and therefore verifying) usability
    and &quot;look and feel&quot; aspects of software. The risk is that this happens
    in a &quot;narrow&quot; way that forces all &#x27;correct&#x27; software to look
    and feel the same, because that sameness correlates with the learned definition
    of &#x27;correct&#x27;.<p>&gt; In solving these challenges, I think random testing
    and random exploration in general will prove to be invaluable tools. A test execution
    is a measurement, so it produces information about the real underlying system
    that we can leverage to falsify, harden and validate the models we use for verification.
    The verifiability of testing will continue to be a huge driving force of its adoption
    as well as a gateway into the rest of formal methods, and maybe it will even help
    us trust when we hear software is &quot;formally verified&quot; instead of wondering
    what was left out or when someone will find a bug in there.<p>Strongly agree with
    this."
