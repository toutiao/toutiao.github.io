  author: RetroTechie
  text: 'You can also turn this around:<p>Once you have proven an implementation matches
    the specification, you could have that implementation <i>become</i> the spec,
    potentially tossing the spec you started with.<p>That&#x27;s not unlike binary
    translation: say you have program A that is proven to produce correct output for
    all possible inputs, and you convert&#x2F;translate&#x2F;port it to a program
    B which produces exact same output for all possible inputs, then you could say
    that program B is proven to work correctly.<p>The proof for B then consists of
    [A proven to behave correct] paired with [comparing output of B with output of
    A for all possible inputs].<p>Note this does NOT require the converter&#x2F;translator&#x2F;
    porting process to be proven correct.<p>Generally the spec you started with is
    a more convenient format. Or conveys intent in a more concise way. But perhaps,
    sometimes, a known-good binary might serve as a more practical &#x27;specification&#x27;.<p>Of
    course as the article notes: it&#x27;s important to understand underlying assumptions,
    declare those explicitly, and have that be integral part of a proof, showing its
    limitations. Flaky hardware, CPU errata, flipped bits in RAM, and un-sound specifications
    are a thing.'
