  text: 'From an app developer’s perspective, using formal verification for the software
    we build sounds like sci-fi. Not only are there tons of billions of use cases
    to handle, but the requirements and user stories themselves are rarely solid:
    quite the opposite, they are usually vague and volatile. PMs often don&#x27;t
    know exactly what they want, so they just monitor metrics and come up with a new
    *great* idea day to day. With that situation, you have no choice but to accept
    that degree of uncertainty.<p>However, I believe formal verification could have
    progress by letting agents finally be able to design&amp;build production systems.
    Many of these systems are fairly boilerplate, mixture of pre-existing features.
    And for those tasks, what agents really need is the ability to test their designs
    with realtime feedback and refine their implementation in a loop, and finally
    produce usable product.'
