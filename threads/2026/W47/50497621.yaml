  text: |-
    &gt; This allows us to (1) elide modelling the semantics of the high level programming language, we can instead model the semantics of the machine--presumably simpler semantics<p>ISAs are pretty complicated and reasoning about programs in that context is hard which is why we have high level languages.<p>&gt; This distinction in terminology used to be a colloquially accepted notion, when we heard &quot;CompCert is a formally verified compiler&quot; or &quot;seL4 is a formally verified microkernel&quot; we assumed the authors did not verify vacuous or trivial properties, because the work of verification itself was held to a high standard that highly affected the reputation of the researcher.<p>CompCert has also had extensive empirical evaluation to vet the theorems. Famously the CSmith paper (<a href="https:&#x2F;&#x2F;users.cs.utah.edu&#x2F;~regehr&#x2F;papers&#x2F;pldi11-preprint.pdf" rel="nofollow">https:&#x2F;&#x2F;users.cs.utah.edu&#x2F;~regehr&#x2F;papers&#x2F;pldi11-preprint.pdf</a>) has this rather choice quote:<p>&gt;  As of early 2011, the under-development version of CompCert is the only compiler we have tested for which Csmith cannot find wrong-code errors. This is
    not for lack of trying: we have devoted about six CPU-years to the task. The apparent unbreakability of CompCert supports a strong
    argument that developing compiler optimizations within a proof framework, where safety checks are explicit and machine-checked,
    has tangible benefits for compiler users.<p>At my work we&#x27;ve extended this to CPU millennia. I hasten to add this of course doesn&#x27;t rule out the possibility of poorly formed assumptions in the semantics etc (it&#x27;s empirical after all) but it helps to build evidence that we have the theorems and semantic design right. More generally differential testing of this sort offers a possible way forward to build evidence in favor of theorem statements beyond expert examination.<p>&gt; Every discussion of formal verification must come with a list of caveats, a precise understanding of what is trusted, what is proven and what is not.<p>Anyone that seriously participates in this work practices this. The whole community. More importantly this is precisely the point of writing down a theorem so that we can closely examine the assumptions. To abuse the CompCert example yet further it&#x27;s now entirely possible to draw the envelope of assumptions, which are many for a non-toy compiler: <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;2201.10280v2" rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;2201.10280v2</a>.<p>Last note, I like the kiki bouba diagram if only because it evinces the problematic &quot;round cow&quot; assumption and how that doesn&#x27;t pan out for real software.
