  text: Proofs are useful insofar as the formal specification is sound. The <i>problem</i>
    is that building a sound formal specification is the hard part, and it&#x27;s
    not something that LLMs are going to be particularly good at. Yes, they can write
    a formal specification. But, is this formal specification sound? Is it usable?
    Is it applicable? Is it complete? This all requires human level reasoning and
    perhaps beyond to verify.<p>Once you have a sound formal specification, building
    proofs that software follows this specification is actually fairly straightforward.
    LLMs aren&#x27;t doing any magic here.
