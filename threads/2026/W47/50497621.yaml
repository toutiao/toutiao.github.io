  author: sirclueless
  text: I disagree with EWD, I find the distinction between a &quot;bug&quot; and
    an &quot;error&quot; helpful. In any robustly engineered system, existence of
    a bug means that multiple errors have been made by multiple people. Singling out
    &quot;the programmer who made the error&quot; is not only unhelpful, it&#x27;s
    misleading and disingenuous to even try.<p>If I write an Outlook networking server
    that handles 100k req&#x2F;s, and it fails in production when someone points 200k
    req&#x2F;s at it, there is a bug. Whose error is it? Is it my fault for writing
    a component that only handles 100k req&#x2F;s? Is it the code-reviewer who didn&#x27;t
    catch that it only handles 100k req&#x2F;s? Is it the team lead who told the programmer
    it needed to handle 100k req&#x2F;s? Is it the project manager who assigned this
    task to a junior engineer who can&#x27;t be trusted to know that the system might
    need to handle more than 100k req&#x2F;s? Is it the business leaders who laid
    off everyone who knew it would need to handle way more than 100k req&#x2F;s? Is
    it the engineers who wrote load tests that didn&#x27;t reach 200k req&#x2F;s?
    Is it the operations team that configured this in a way where it can get 200k
    req&#x2F;s?<p>In reality any one of these people could have made a decision that
    avoided this bug. There are always many errors on the critical path of a bug,
    identifying &quot;the root cause&quot; means you have already made a leap in logic
    and concluded which issue(s) you are planning on addressing and which you have
    decided are not worth tackling.
