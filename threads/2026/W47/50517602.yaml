  author: derefr
  text: 'Sibling comments covered the other stuff, but I&#x27;ll clarify the particular
    &quot;strange parallel universe&quot; this article exists in: it&#x27;s investigative
    web security &#x2F; web-forensics journalism. And not the kind written by general-beat
    journalists, re-digested for a general &quot;pop science&quot; reader; but rather,
    the kind written by people who do such investigations themselves (whether they
    did the particular investigations they report on, or are getting the information
    from their trusted sources and contacts in the web-security community.)<p>A well-known
    web security journalist, who writes in this mode, is Brian Krebs of <a href="https:&#x2F;&#x2F;krebsonsecurity.com&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;krebsonsecurity.com&#x2F;</a>.<p>This type of
    ingestigative web-security writing has three audiences:<p>- the &quot;general&quot;
    audience of non-security-focused IT professionals, who are nevertheless interested
    in security topics from afar;<p>- the &quot;professional&quot; audience of other
    web-security professionals, who do the exact same kinds of investigations the
    author themselves does (whether or not they then share their results publicly);<p>-
    and the &quot;oppositional&quot; audience, i.e. the very malicious-actor groups
    the investigations target.<p>Each article thus serves three purposes:<p>1. to
    the &quot;general&quot; audience, the article provides an entertaining and informative
    journalistic narrative (and this encourages this group to spread the article,
    to increase the likelihood people in the other two groups will read it);<p>2.
    to the &quot;professional&quot; audience, the article serves as an &quot;investigation
    log&quot; that must provide enough information to <i>reproduce</i> the derived
    information (so that the results can be trusted and acted upon), and&#x2F;or so
    that the investigation can be taken further without wasting time doing things
    that have already been done (because each piece like this, if it doesn&#x27;t
    end in the investigation target being cleaned up, serves double-duty as an invitation
    for collaboration, either directly, or via encouraging independent &quot;federated
    investigations&quot;);<p>3. to the &quot;oppositional&quot; audience, the article
    acts as propaganda for the power and reach of the &quot;side&quot; of the investigators,
    with the intent of producing chilling effects against others doing the same thing;
    and, more specifically to would-be collaborators with the target group, acts to
    scare them off from doing that, cutting off the target group&#x27;s resources.<p>Note
    the three-way conflict-of-interest this introduces: security professionals need
    to know how and where you got your information; general audiences don&#x27;t really
    care and just find such info to be needless detail; and your investigation targets
    should ideally know as little as possible about these tools, so that they don&#x27;t
    start enacting countermeasures to make these tools useless against them. (But
    it&#x27;s good that the opposition is aware that these tools <i>exist</i> and
    understand the chain of inputs and outputs that goes through them -- to show exactly
    the sloppiness that got them got, and so prove that web security people are not
    just bluffing about having such powerful tools while actually parallel-reconstructing
    info they get via e.g. double-agents.)<p>This conflict-of-interest is mostly resolved
    by just <i>naming</i> these tools while <i>describing</i> them as little as possible,
    and absolutely never <i>linking</i> to them.<p>Security professionals are expected
    to recognize the names and know how to get access to them (if they don&#x27;t
    have it already); general audiences are expected to just gloss over these names
    as some kind of technobabble (an expectation you and I, being curious-by-nature
    people, failed); and the opposition is expected to recognize that these tools
    exist, but either struggle to find them (these tools are often referred to by
    nicknames that are also names of larger services in other domains, so just punching
    the tool&#x27;s name into google often does nothing), or struggle to get access
    to them. (With a specific additional goal of minimizing the knowledge the opposition
    has of these tools so that they can&#x27;t socially-engineer their way into convincing
    some bureaucratic employer that they &quot;should&quot; be given access to them.
    Which means never describing how these tools work, providing screenshots of them,
    etc.)'
