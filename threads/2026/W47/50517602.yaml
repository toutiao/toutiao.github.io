  author: lopsotronic
  text: Mr. Sleepy, I&#x27;m afraid I would exchange either of those fictional statesmen
    over our timeline after only the most cursory examinations of their relative characters[1].<p>If
    anything, the political import of Transmet -- that venal&#x2F;corrupt&#x2F;cunning
    is ultimately more trustworthy than idealistic -- is an artificial premise right
    in its shellac. The Smiler is a supernatural creature, a slasher villain, a Demiurge,
    whose motivation isn&#x27;t in the world as it is presented to us. Like the actual
    Gnostic Demiurge, we have to construct a delicate narrative&#x2F;worldbuilding
    framework to explain both the actions, the scope, and the depth of byzantine schemes.<p>I
    love the hell out of Transmet and more or less anything with Ellis in the byline,
    but this 1990s-style cynicism was -- as any professional historian could have
    told them -- horribly, lethally, awfully wrong. Venality, pettiness, monstrous
    vanity, and almost incomprehensible irresponsibility is all you need to make an
    Auschwitz. No idealism required.<p>[1] Although the base cunning of the Beast
    would be welcome. Some form of entity capable of making complex plans, with a
    conceptual framework that allows for introspection and self-correction.
