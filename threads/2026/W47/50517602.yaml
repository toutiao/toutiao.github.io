    in the sweat, tears, and blood of the common Chinese worker, of course. Grunting
    out an unending stream of manufactured goods to sell the West on giving up their
    industrial base.<p>Now, with the Western rules-based order in tatters, China&#x27;s
    greatest opponent is geography, the curse of Mackinder’s heartland, walled in
    by shallow seas and narrow passages. But that is a deceptive reassurance. It&#x27;s
    a different era from the one Mackinder or even Dugin wrote in. Narrow passage
    - or wide ocean - is not what it once was. Something you&#x27;d think we&#x27;d
    have learned twenty five years ago."
