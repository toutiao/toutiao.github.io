  author: ElProlactin
  text: "&gt; I had stripe fleece me for 4.5k...<p>In your post, you stated:<p>&gt;
    \ I structured an overall secure system - there was very little negligence on
    our side<p>Overall secure system? Very little negligence?<p>Since the other comment
    critical of yours is being downvoted, for clarity: it appears you set up a service
    where you allowed individuals to set up accounts and sell their products or services
    to other people. Your service facilitated this, ostensibly for a fee. Fraudsters
    set up accounts and then proceeded to buy from themselves using stolen credit
    cards. Apparently, your service allowed the fraudsters to withdraw the funds from
    their fraudulent sales before you or Stripe caught on, leaving you on the hook
    to deal with the chargebacks and fees.<p>You also said this &quot;all happened
    so fast&quot;, which suggests a planned, coordinated attack, which is not uncommon
    for credit card fraud these days.<p>Online payments suck and it&#x27;s not comfortable
    dealing with big companies like Stripe. There are lots of horror stories about
    Stripe, PayPal, etc. that are legitimate, but yours doesn&#x27;t sound like one
    of them.<p>Any service under which you allow individuals to sell things and you
    facilitate the transaction is inherently risky. Stripe might support this model
    (Stripe Connect) but no payment provider can completely insulate you from fraud
    in this model, and none is going to provide &quot;insurance&quot; for your losses
    if something goes wrong. It also doesn&#x27;t matter that you had been an early
    user, referred other people to them, generated $x in fees from other projects,
    etc. Being a loyal customer doesn&#x27;t give you a free pass to run an inherently
    risky business model carelessly and get bailed out when the risk becomes real.<p>Expecting
    Stripe to cover your losses was unrealistic. You were actually extremely lucky
    your total loss was only $4,500. It could have been much, much worse."
