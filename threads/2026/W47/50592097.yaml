  author: hannob
  text: It&#x27;s been known for a while, and certainly long before the recent AI
    vuln flood, that ghostscript is really problematic in terms of security.<p>Ultimately,
    postscript is its own programming language, and executing a programming language
    in a secure, sandboxed way is not trivial. ghostscript has only a very poor pseudo
    sandbox that fails regularly. Unfortunately, ghostscript is the only implementation
    of postscript that&#x27;s out there.<p>All of that would matter much less if people
    only used it to parse postscript. But it&#x27;s used indirectly by imagemagick
    (you can disable it), which means many people using imagemagick to parse images
    from untrusted sources get exposed to ghostscript&#x27;s poor security.
