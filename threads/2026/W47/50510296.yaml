  author: kqr
  text: I&#x27;m surprised how well this handled. I usually have large complaints
    on the flight dynamics in projects like these, and for this (in expert mode) they
    were not that large. Of course, it&#x27;s no  X-Plane, but I&#x27;m trying to
    keep in mind what sort of project it is. In a good blend of arcade and simulation,
    it should be a toy that is easy to get into, but someone who has simulator experience
    should also feel at home and not run into counter-intuitive dynamics.<p>I suppose
    I am a little surprised the biplane was able to loop on its own power from level
    flight.<p>Interaction-wise, I would have liked<p>- to be able to invert the Y
    axis on the mouse control! Nuts that this alternative is not included.<p>- a vertical
    speed gauge all the time, not just when the simulator thinks I&#x27;m about to
    land.<p>- go-arounds to be handled more gracefully, rather than as a very long
    landing.<p>- a trim control on the mouse wheel to set the airspeed. (And then
    the mouse control could keep returning to centre, at least in expert mode.)<p>-
    a toggle for opting out of metric units, and instead using more customary knots
    for speed, feet for altitude, feet per minute for vertical speed etc.<p>- pre-tuned
    navigation radios (or even just VFR charts) as an optional replacement for arrows
    in the sky.<p>With these changes (and possibly more I think of later) this could
    be a really fun way to get children into flight simulation, since it&#x27;s so
    action packed.
