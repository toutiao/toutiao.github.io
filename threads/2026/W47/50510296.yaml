  author: greggman65
  text: 'There are tons of seed generated examples from Claude (and others)<p>Here&#x27;s
    mine:<p><a href="https:&#x2F;&#x2F;greggman.github.io&#x2F;gen-city-auto&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;greggman.github.io&#x2F;gen-city-auto&#x2F;</a>  (430k,
    4 cites, tons of vehicles, trains, signs, water, bridges, rain, road details)
    - video for highlights: <a href="https:&#x2F;&#x2F;x.com&#x2F;greggman&#x2F;status&#x2F;2117605120745881692"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;greggman&#x2F;status&#x2F;2117605120745881692</a><p><a
    href="https:&#x2F;&#x2F;greggman.github.io&#x2F;cyber-web-city&#x2F;" rel="nofollow">https:&#x2F;&#x2F;greggman.github.io&#x2F;cyber-web-city&#x2F;</a>  (200k,
    10 cities themes) - video for highlights: <a href="https:&#x2F;&#x2F;x.com&#x2F;greggman&#x2F;status&#x2F;2109451367941378213"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;greggman&#x2F;status&#x2F;2109451367941378213</a><p><a
    href="https:&#x2F;&#x2F;greggman.github.io&#x2F;webgpu-driving&#x2F;" rel="nofollow">https:&#x2F;&#x2F;greggman.github.io&#x2F;webgpu-driving&#x2F;</a>  (170k
    - 10 environments, several vehicles, tunnels) - video for highlights: <a href="https:&#x2F;&#x2F;x.com&#x2F;greggman&#x2F;status&#x2F;2104533425478930568"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;greggman&#x2F;status&#x2F;2104533425478930568</a><p><a
    href="https:&#x2F;&#x2F;greggman.github.io&#x2F;webgpu-aquarium&#x2F;" rel="nofollow">https:&#x2F;&#x2F;greggman.github.io&#x2F;webgpu-aquarium&#x2F;</a>  (102k
    - several fish, different ocean styles)<p>note: iOS in particular is really slow
    to start up these.<p>Maybe it&#x27;s all AI slop. None of them are fun games,
    they&#x27;re just tech demos.<p>The interesting things are they are all small.
    All assets are built at startup. They aren&#x27;t using any libraries. That suggests
    there is lots of low-hanging fruit for quick to start web-games.<p>Telling the
    LLM to build from scratch and follow AAA practices frees the LLM to use whatever
    is appropriate, rather than whatever some library dictates. The LLM was also good
    at optimizing, at least to an extent. It would run experiments, turning features
    on&#x2F;off to find where the speed was going. It would also do A&#x2F;B screenshots
    to see how much changing techniques effected the output.<p>Each demo from prompt
    to first output took 2-3 hours and then a few prompts in my free time to clean
    up the most outstanding issues.<p>One thing that helped a bunch was telling the
    LLM to model cars using NURBS instead of polygons. Another was telling it to have
    a separate modeling agent, and a separate judging agent.<p>None of the demos are
    perfect. They got to a point where I was happy that they showed want I wanted
    to see. I wasn&#x27;t planning to take them to perfection. The gen-city-auto demo
    has the most issues. While it made a giant city, there are lots of places where
    a road makes no sense. I could prompt through that but all I really wanted to
    see was a GTA like city in a small amount of code and for that it proved the concept
    is valid. Given ways for a designer to declare what they wanted where I could
    see the concept generate much more &quot;designed&quot; cities.'
