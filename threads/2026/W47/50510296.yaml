  author: diverted247
  text: 'Here is the design <a href="https:&#x2F;&#x2F;dai.studio&#x2F;ted&#x2F;ex-baron"
    rel="nofollow">https:&#x2F;&#x2F;dai.studio&#x2F;ted&#x2F;ex-baron</a> that was
    used to generate the &quot;baron&quot; flight simulator.<p>Source: <a href="https:&#x2F;&#x2F;github.com&#x2F;dai-studio&#x2F;ex-baron"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;dai-studio&#x2F;ex-baron</a>
    (BSD 2-Clause)<p>Each typed element in the design describes detailed aspects of
    the game. This is the primary &quot;Context&quot; element. Just select an element
    to see it&#x27;s schema&#x2F;data.<p>&quot;Baron is an arcade biplane game set
    in a WWI-inspired, cartoon world. The player builds their aircraft in the hangar,
    takes off from an airfield, flies over a procedurally generated landscape under
    procedurally generated clouds, and lands again. There is no combat. Pillars: (1)
    Flying feels great: quick to learn, satisfying to master. (2) A readable, cheerful
    cartoon look: toon shading, ink outlines, bold colours. (3) Every flight is different:
    a seed generates terrain, clouds and airfields. (4) Instant play: opens in a browser
    tab with no install.&quot;<p>Try pasting the raw diagram into an agent, here is
    the prompt...<p>&quot;Build <a href="https:&#x2F;&#x2F;dai.studio&#x2F;ted&#x2F;ex-baron&#x2F;raw"
    rel="nofollow">https:&#x2F;&#x2F;dai.studio&#x2F;ted&#x2F;ex-baron&#x2F;raw</a>&quot;<p>You
    won&#x27;t get the identical game but all the specified details will be there
    in the end result. If you swap out some key dependencies... Unreal Engine vs three.js,
    you will get some wild result. Have fun and post your results. :)'
