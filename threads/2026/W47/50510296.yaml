  author: sgt
  text: "&gt; Maybe it&#x27;s all AI slop. None of them are fun games, they&#x27;re
    just tech demos.<p>Sure, probably, but as long as you&#x27;re having fun, and
    you get to experiment at a velocity (due to vibe coding) that is probably unprecedented.<p>I
    also think there may be some inherent problems with just supporting games in WebGL&#x2F;wasm
