  author: bruce511
  text: I&#x27;d counter this with two realities;<p>Firstly, most employers don&#x27;t
    specifically target &quot;best&quot;. Partly because &quot;best&quot; is hard
    to define, and includes measurements across multiple axles. And partly because
    it&#x27;s impossible to know you have just seen the &quot;best&quot; so leading
    to paralysis.<p>Typically companies thus target &quot;good enough&quot; and for
    lots of positions there are several candidates that fit that bill. Sure they&#x27;ll
    choose the one they <i>think</i> will be the best, but there&#x27;s no way to
    know for sure.<p>Secondly, and speaking generally here, for most of us, this is
    probably a good thing since it&#x27;s very likely there is a better candidate
    than me out there somewhere. If companies only hire &quot;the best&quot; then
    all us &quot;second best, still good enough &quot; folk would struggle a lot more.<p>Of
    course we all <i>think</i> we are the best possible option. Because we value our
    strengths and devalue our weaknesses. But objectively what are the odds that out
    of hundreds of applicants we&#x27;re the actual &quot;best&quot;?<p>This doubly
    so when so many high quality people are looking for jobs?
  score: 0
