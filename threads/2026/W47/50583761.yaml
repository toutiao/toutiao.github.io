  author: ITmind
  text: 'Look for a staffing agency like AppleOne or another reputable agency that
    has established relationships with different companies.<p>This is what worked
    for me. After working for the same company for about 14 years, my team was outsourced.
    I was laid off a couple of months before the pandemic. I decided to give entrepreneurship
    a try, started my business and worked as an IT consultant, but after landing only
    a few clients and paying so much in taxes and insurance, I realized I needed to
    return to the workforce.<p>The challenge was that potential employers could see
    my situation in one of two ways: either I had failed at running my own business,
    or I had a gap in my employment history of about 2 yrs.<p>After going through
    several interviews directly with companies and not landing a position, I decided
    to take a different approach. I went through a staffing agency with the goal of
    getting my foot in the door as a temporary employee or contractor. My thinking
    was that once a company had the opportunity to see my skills, experience, and
    work ethic firsthand, I would have a better chance of being hired permanently.<p>And
    that&#x27;s exactly what happened! Thank God, after six months as a contractor,
    I was offered a permanent position.'
