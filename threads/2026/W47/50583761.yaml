  author: Enginerrrd
  text: 'I don&#x27;t have experience in that niche per se, but rather as a civil
    engineering consultant.<p>There&#x27;s always a chicken&#x2F;egg problem trying
    to break into a space like that.  Once you have clients, you usually end up with
    TOO much work.  But until then, you&#x27;re starving.  It&#x27;s very much feast
    or famine.<p>My advice is this:<p>1.  Pound pavement! Knock on the doors, talk
    to people. Do all the networking. You will likely be laughably ineffective at
    this at first, but it&#x27;s still useful to get the practice reps in so that
    when you get in front of the right person, you&#x27;ll be polished. I got my first
    big client after taking a lawyer out to lunch, buying him a couple of scotches
    and straight up asking if he had any clients who needed engineering work.<p>2.  Embrace
    the Pareto principle and Focus on the whales.  Small jobs&#x2F;clients are almost
    a complete waste of time.  They&#x27;re the one who will give you trouble over
    your rate, payment issues, manipulative scope changes, etc.   And... they just
    don&#x27;t have the pile of money to throw your way.<p>3.  Don&#x27;t actually
    chase the whales directly, figure out who are the people who will refer clients
    to you.  These are the people who are INSANELY valuable and often don&#x27;t even
    realize it.   Treat them well, NEVER make them look bad, and keep the relationship
    fresh.<p>Once you&#x27;re in the space, there&#x27;s other skills you need to
    learn in the vein of that &quot;fuck you pay me&quot; article.  However, I would
    never recommend someone trying to break in to the space to not eat a shit sandwich
    with a smile to get their foot in the door.<p>Oh, and one more thing:  you&#x27;d
    be surprised how long it takes for a lead to develop into a job.  In my world
    that was often 6+ months.  So patience is key.'
