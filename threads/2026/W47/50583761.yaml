  author: taurath
  text: I had to get back into the industry last year after <i>4</i> years off for
    mental health and caregiving. I was able to get back in - 2 years isn’t that much.<p>But
    the problem is the front door in hiring is broken. Entirely. I didn’t receive
    almost ANY replies from hundreds of sent out resumes - I have household names
    and big public high scale launches and wins on my resume, but no FAANG and no
    degree.<p>I got 2 job offers. One was through a manager from 8 years prior who
    was working at a place. One was a recruiter who found me on LinkedIn. I got engagement
    when someone physically actually knew me, they were actually hiring,  and my skills
    overlapped.<p>My honest advice is to apply places and try that dance, get yourself
    in front of people, real people, and mainly 1-1. Work everyone you have ever worked
    with. If you’ve reviewed their PR, they need to know that you need a job. Be kind
    and genuinely catch up with them if you want to, but they are your PRIMARY resource
    to get a job and you can’t let shame get in your way.<p>Corporations in general
    are BROKEN right now in massive ways and the industry is going through a crisis.
    It will likely become better but whatever you have to do to survive do it.<p>Finally,
    it seems like solutions architects seem in demand lately, anyone who can help
    customers with solutions - SWEs can tend to do well if you have some people skills.
