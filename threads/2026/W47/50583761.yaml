  author: noprocrastedaga
  text: What should you do? Lie.<p>I’ve been on both sides of the job search in the
    past couple years. Like you, absolutely no luck with cold applications.<p>On the
    hiring side, opening a position got me a thousand of applications per day, all
    ChatGPT’d resumes from monkeys who likely couldn’t engineer their way out of a
    wet paper bag (beyond just grossly lying about experience, there’s also actual
    remote work fraud, either from the “overemployed” crowd if not outright scams
    or North Koreans). Unfortunately, in all that mess I’m sure there were really
    good legitimate candidates but there is no way for me to tell without talking
    to them, which was impossible considering the sheer scale of the spam onslaught.<p>My
    advice is twofold. 1) Lie - nobody <i>legitimate</i> would actually care about
    your 2-year career gap, yet due to the scale of the spam, automated tools have
    to be used to cull the incoming firehose, and those unfortunately do care. So
    lie and extend your last job, or make up some consulting gig, or whatever floats
    your boat. As long as you can walk the talk during the interview, you are good.
    As a hirer I couldn’t care less (and wouldn’t even have any reason to dig too
    deep) if you are otherwise competent and able to talk about your work and can
    demonstrate you are a good developer and not just a dumbass vibecoder ticket-mover.
    In the sea of shit we’re currently swimming, even a candidate I <i>know</i> is
    lying is fine as long as they’re otherwise competent.<p>2) cold applications are
    pretty much dead due to the aforementioned spam problem. So my recommendation
    is to polish up your LinkedIn (you do have 15 YOE of <i>real</i> experience after
    all, with people you worked with and stuff) and then reach out to strategic people
    at prospective companies. Don’t even ask for a job to begin with - offer consultancy,
    etc (the danger of asking for a <i>job</i> straight away is that they shut down
    the conversation and redirect you to the cold application page - a dead end).
    The point is to have a conversation with a human, to demonstrate you are a real
    person and not an idiot with a spambot. If the conversation goes anywhere you’ve
    just fast-tracked the whole bullshit application process (you might still be asked
    to submit it, but at that point it’s merely a formality and you’ve already got
    a contact that will follow up internally to make sure your application goes somewhere).<p>Also,
    if you’re at the stage where you’re considering a blue-collar job, target companies
    that could potentially benefit from IT skills or where you can use them to make
    your job easier if not make <i>their</i> job easier and get promoted that way.
    In a sense, you’re using the blue-collar job merely as a foot in the door to be
    able to show up and talk to people. While it’s unlikely this would yield good
    pay right away (and potentially not ever), it’s a good way to build connections
    and potentially get something done (remember that those companies don’t get IT
    people and might be stuck with a shitty MSP handling their IT. Having someone
    “good with computers” internally would be a godsend for them and a win-win situation).<p>Ultimately
    in the age of AI-assisted spam and no consequences for fraud, the hardest part
    is getting a respectable <i>human</i> connection. Lie (within reason) if you have
    to, to achieve that, then be yourself, and you’ll get somewhere.<p>Good luck!
