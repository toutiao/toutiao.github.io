  author: mlcruz
  text: "This also matches my experience.<p>Me and two of my colleagues left our relatively
    cushy jobs to start a tech and business consulting company, focusing mostly on
    mid market and enterprise sales. It is a kinda niche service (building internal
    knowledge graphs, ai integration etc).<p>I think our biggest shock was realizing
    that every single client would take several months of talks if we wanted to get
    reasonably paid and ensure a successful project.<p>Assessments, discovery, getting
    the buy in of every relevant stakeholder takes a lot of time, dinners and compromising.<p>Price
    negotiation is its own challenge, and until you have a few clients you also have
    a weaker negotiating position. \nThis means you are probably getting squeezed
    in your first contracts. 3-4 long deals fell due to prospects trying to buy us
    out as employees in the end of the sales process, wasting hundreds of hours of
    work.<p>If everything goes well then you are going to have some back and forth
    with legal teams before it gets signed.<p>Companies also go on their own time,
    and you are not going to be top priority for any of the people involved in the
    process.<p>Took us about 6 months of talks to close our first client. This also
    means we need to have sales running all the time, and capacity planning is incredibly
    challenging. Failed deals hurt a lot, since there was a large time and money commitment
    involved.<p>Honestly, i would not be able to do this alone, even as a reasonably
    well connected person. My main advice is to not start a business alone if you
    can. The only reason we survived is because my co-founders are great at their
    jobs.<p>Now that we are at least close to breaking even it feels good, but the
    first months were AWFUL."
