  author: gopher_space
  text: I&#x27;ve realized that my traditional job sources have decayed in quality,
    and that it&#x27;s possible to spend all day every day applying for positions
    I&#x27;m qualified for but wouldn&#x27;t enjoy at companies that will never call
    me back.  I&#x27;ve also realized that aggressive filtering still leaves me with
    more postings than I can <i>seriously</i> apply to.<p>Adding a &quot;value&quot;
    dimension to things like job sources, descriptions, and application processes
    helped quite a bit.  For example, an external freelance recruiter cold-calling
    me would be low-value while an internal recruiter I have a previous relationship
    with would be higher.  Using a service to process applications, requiring a Linkedin
    profile, leetcode in their interviews, company size, and so forth.  I&#x27;m enumerating
    and ranking the red flags I&#x27;ve run into based on time spent and result.  All
    geared towards eliminating contact with the sort of person who cares about a gap
    in your resume because they will waste my time.<p>Non-tech related job postings
    reduce the same way if you understand the flags in their domain.  Are you applying
    to jobs that want you to think inside a box?  Job posts that exist only as a legal
    requirement?  Roles that come with an assumption of age?  If you&#x27;re overqualified
    does that benefit your employer or introduce problems?
