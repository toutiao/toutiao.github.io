    Yes, it is correct modulo 1) an incorrect theorem statement of the Riemann hypothesis, 2) exploiting compiler bugs in the trusted computing base (i.e. all of the Lean compiler / the Rust compiler / the Aeneas Kraken x64 model), or 3) both CIC w/ Lean axioms (Lean, lean4lean, nomeda) and also ZF w/o infinity or choice and w/ an ω-chain of Tarski-style universes (con-leche) being inconsistent.
    A pretty robust guarantee! Obviously building on the extensive work of the Coq community in hammering out just exactly what a practical + consistent type theory looks like, but one certainly can't say that the Lean community hasn't done their efforts justice, at least here. The exact set-theoretic model that the con-leche implementations are providing their idealized model of Lean consistent with respect to seems a little bespoke, and I'd be curious if the notes about the ω-chain being unnecessary pan out (I must admit, I have no idea how a ω-chain differs from a normal universe hierarchy), but understanding/reducing those assumptions further seems like interesting future work.
