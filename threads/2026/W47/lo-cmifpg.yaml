  text: |-
    Are you suggesting that we shouldn't hold our breath for a shorter proof? :-)
    I think the difference is that Fermat underestimated the essential complexity of the problem; his probably-incorrect proof didn't fit in that margin, but it was certainly much shorter than modern correct proofs of FLT. Whereas Levent's proof overestimates the essential complexity: we now know the shortest solution is at most that long, and the record for the shortest proof can only go down.
    My gut feeling is that we'll find some simplifications pretty quickly, but we'll hit diminishing returns. Uneducated guess: maybe it'll shrink 10x? That would be a significantly shorter proof, but it would still be nearly a hundred megs uncompressed; good luck printing that in a textbook.
