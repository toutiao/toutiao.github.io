  author: bitshift
  text: |-
    Miller-Rabin is an interesting case because if you run the probabilistic version about 50 times or so, the chance of the algorithm failing is less than the chance of your hardware failing. If you get the wrong answer, it is more likely to be caused by a cosmic ray flipping a bit, etc, while your program was running.
    Compare with the deterministic version of Miller-Rabin, which if I understand correctly requires running 2(ln n)^2 iterations of the core algorithm (assuming RH). That surpasses 50 iterations as soon as you get to n=149. So yes, it would be "deterministic" but not meaningfully more deterministic than hardware in the grubby real world.
    Still exciting stuff, though. :-)
