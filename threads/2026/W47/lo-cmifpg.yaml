  text: |-
    OK so you were saying the opposite.  I think the status and conventions are all uncertain and upturned by AI, but the possibly-mistaken human proof could be more useful in some ways than the inscrutable machine proof.
    As Terence Tao said, math isn't just a series of true/false statements.  If you just memorized the true/false status of 10,000 different theorems, are you a mathematician?
    Once you know the grand theorem theorem is true, you can take it apart and proceed to "theory building", or building structures around this theorem that lead to more ideas.  And relating it to existing bodies of knowledge.
    The metaphor of the "the rising sea" is related - https://ncatlab.org/nlab/show/The+Rising+Sea
    Or the two ways to crack a nut: https://shreevatsa.net/post/grothendieck-approaches/
    I also think of it as related to "compression as intelligence" -- you have a mental picture of 100 related theorems, and can turn them around in your head, and draw new pictures.  Rather than just knowing a long sequence of tactics that leads to a single result.

    For an analogy in programming, maybe it's roughly like winning programming contests like ICFP or the Obfsucated C contest, versus building and maintaining the Linux kernel for 30 years.  The latter is more like theory building / a rising sea.  The former is more like concentrated cleverness or technical ability.
    Both are things that people do, and can complement each other.
