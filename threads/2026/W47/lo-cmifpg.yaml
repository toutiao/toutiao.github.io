    There is now a joint statement by the Lean and Mathlib communities, endorsed by the Lean FRO and the Mathlib Initiative, titled "Lean verification of the Riemann Hypothesis", in which they say:

    We have full confidence that Alpöge's proof of the Riemann Hypothesis is correct, and we congratulate him on this achievement.

    They refer to the four criteria posted on 2026-11-12 by the Xena Project in “…and the proof is checked in Lean”, concluding:

    The four criteria [...] are all satisfied.

    Edit: Note that Alpöge not only claimed the Riemann Hypothesis, but also the Generalised Riemann Hypothesis (for Dirichlet L-functions). My interpretation of the joint statement is that it does not say anything about the claim of GRH. I guess this is because the first criterion "Does the Lean statement match the informal statement?" is not checkable as quickly for GRH as it is for RH, simply because there is no statement of GRH in Mathlib, while there is one of RH. So there still is a some mismatch between what Alpöge claimed and what is subject of the joint statement.
