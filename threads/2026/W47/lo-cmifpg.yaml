  author: andyc
  text: |-
    I think you're missing that Lean checks the proofs?
    So you state the theorem in Lean.  And then you have 250,000 pages or 13 million lines of Lean code that proves it.  Lean has a theorem prover that tells you if this proof is correct (modulo bugs in Lean, some of which have been found and patched!)
    So you don't need to read anything to know if it's true or false.  That's a big and critical difference with the hand-written proofs of the ABC conjecture.
    On the other hand, if you want to turn this crazy complex code into something a human can understand, then you obviously start reading what the LLM did, and reading the Lean code.
    That is, it's not "rejected out of hand" because true/false is a result that is easy to understand.  But there is more understanding to follow -- theory building, versus theorem proving.
