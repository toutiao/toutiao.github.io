    I think being "first" to a proof needs to stop being viewed as the groundbreaking work in human endeavour now--worthy of million dollar prizes, etc.
    We really need to appreciate the first proof that human mathematicians can read and all appreciate and assert is correct.  And appreciate incremental improvements that shrink that proof down -- from hundreds of pages, to dozens, to "fits on a t-shirt".
    The 15 million line long Lean proof is almost useless--although it does give a roadmap of all the work that stil needs to get done before the job is actually finished.  But 99.9% of the work is still in the future.
