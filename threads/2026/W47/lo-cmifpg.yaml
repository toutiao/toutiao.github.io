    I'm not sure if this counts as one of the most important ones, but if my memory serves me correct, there are implications for prime number tests.
    There is a relatively slow polynomial algorithm that show definitively whether a number is prime or not (AKS), and there's another, faster algorithm (Miller-Rabin) that, if you run it a certain number of times, shows definitively whether a number is prime or not if the riemann hypothesis is true. Which means if it's true, we can check reliably whether numbers are prime in a faster way.
