    Details](#62-vulnerability-details-24)[6.3. Exploitability Validation](#63-exploitability-validation-25)[Closing
    Remarks](#closing-remarks-26)[About Xint](#about-xint-27)\n\n## **Introduction**\n\nnginx
    is one of the most widely deployed web servers in the world. Finding an unauthenticated
    remote code execution bug in it has long been a holy grail for security researchers.
    The Xint research team recently found five. Each one leads to remote code execution
    on its own, but they affect different configurations.\n\nXint also found a separate
    vulnerability in the Linux kernel which can be chained with any of the nginx vulnerabilities
    to gain root privileges on the host. Together, we call these six vulnerabilities
    **nginx2root**.\n\n**If you run nginx, update to** [**1.31.9**](https://github.com/nginx/nginx/releases#release-release-1.31.9)
    as soon as the fixed release becomes available. This article explains the root
    cause of each nginx2root vulnerability and summarizes our exploitability assessments.
    For exposure checks, see Section 2 and for patching and temporary mitigations,
    see Section 3.\n\n## **1. Executive Summary**\n\n### **What an attacker can do**\n\nThe
    most impactful of the five findings, CVE-2026-123007, allows an unauthenticated
    attacker to execute commands on an affected nginx server with HTTP/2 enabled.
    The commands run with the privileges of the nginx worker process that handles
    the request.\n\nWe chained this vulnerability with a separate flaw in the Linux
    kernel's SCTP subsystem to gain root privileges on the host. In our tests, the
    chain also escaped a Docker container running nginx and obtained root on the underlying
    host.\n\nIn the video below, we use CVE-2026-123007 to execute commands as the
    nginx worker inside a container, then use the kernel vulnerability to escalate
    to root on the host.\n\n![](https://image.inblog.dev?url=https%3A%2F%2Fsource.inblog.dev%2Fpost_image%2Ff0c88a3f-26ac-4b21-820f-c876095e8e5f%2F6691316b-689e-4d4f-8a39-d83344ccebf4&w=828&q=85)\n_nginx2root
    demo video_\n\nWe ran this demo on AWS, attacking the server over its public IP
    address. Demos for AWS, GCP, Azure, and bare-metal servers are available at .\n\n*
    * *\n\n### **Affected versions**\n\nEach one of the five nginx vulnerabilities
    are independent attack paths and do not need to be chained together. They differ
    in what configuration is affected.\n\n| \n\nCVE\n\n | \n\nAffected configuration\n\n
    | \n\nFirst affected release for this path\n\n | \n\nBlocked by disabling HTTP/2?\n\n
    |\n| --- | --- | --- | --- |\n| \n\n[CVE-2026-123007](https://www.cve.org/CVERecord?id=CVE-2026-123007)\n\n
    | \n\nHTTP/2 enabled\n\n | \n\n1.9.5\n\n | \n\nYes\n\n |\n| \n\n[CVE-2026-123634](https://www.cve.org/CVERecord?id=CVE-2026-123634)\n\n
    | \n\n`resolver`, a request-derived `proxy_pass` destination, and `mirror` with
    `mirror_request_body off`\n\n | \n\n1.13.4\n\n | \n\nNo\n\n |\n| \n\n[CVE-2026-123633](https://www.cve.org/CVERecord?id=CVE-2026-123633)\n\n
    | \n\nHTTP/2 with requests forwarded to an upstream (backend) server\n\n | \n\n1.19.7\n\n
    | \n\nYes\n\n |\n| \n\n[CVE-2026-121810](https://www.cve.org/CVERecord?id=CVE-2026-121810)\n\n
    | \n\nHTTP/3 with requests forwarded to an upstream (backend) server\n\n | \n\n1.25.0\n\n
    | \n\nNo\n\n |\n| \n\n[CVE-2026-113425](https://www.cve.org/CVERecord?id=CVE-2026-113425)\n\n
    | \n\nMail proxy using `proxy on` and `auth_http`\n\n | \n\n0.5.15\n\n | \n\nNo\n\n
    |\n\nFor CVE-2026-123634, the table shows the setup we tested, which uses the
    `mirror` directive. Other nginx features that create subrequests, such as SSI,
    may reach the same bug, so turning off `mirror` alone does not make a server safe.\n\nCVE-2026-123007
    has been present since nginx introduced HTTP/2 in 2015, more than a decade ago.
    Every official release from 1.9.5 through 1.31.8 contains the vulnerable code,
    including the `master` branch on Nov 10, 2026. Even servers running recent releases
    therefore need the same checks for patch status and HTTP/2 exposure as older installations.\n\n###
    **What to do**\n\nUpdate to 1.31.9 when it is available. Until then, disabling
    HTTP/2 on affected listening ports blocks CVE-2026-123007 and CVE-2026-123633.
    It does not block the other three nginx vulnerabilities. Check your configuration
    against the table above and apply the matching mitigations in Section 3.3.\n\n###
    **How we found them**\n\nWhile preparing for ZeroDay Cloud 2026, a Xint researcher
    found CVE-2026-123007. A few days later, a fully automated Xint scan found the
    other four without human guidance.\n\n### **nginx2root at a glance**\n\n| \n\nItem\n\n
