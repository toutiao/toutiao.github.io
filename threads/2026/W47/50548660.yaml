  author: siscia
  text: 'I build something similar, based on similar ideas: <a href="https:&#x2F;&#x2F;factory.redbeardlab.com"
    rel="nofollow">https:&#x2F;&#x2F;factory.redbeardlab.com</a><p>There is a [language](<a
    href="https:&#x2F;&#x2F;redbeardlab.github.io&#x2F;dotFactory&#x2F;" rel="nofollow">https:&#x2F;&#x2F;redbeardlab.github.io&#x2F;dotFactory&#x2F;</a>)
    that let express complex workflows.<p>The workflow can be pretty much anything,
    eg:<p>1. Clone repo A and B + Start OpenCode + Feed a prompt into it<p>2. Pick
    up the commit generated by opencode for both repo, and run CI<p>Another workflow
    I created is: every day at 3AM, check that the documentation of the website is
    up to date, if yes exit, if not update the documentation. Pass the updated documentation
    to an adversarial LLM and if it pass, merge it - otherwise loop with the feedback
    from the adversarial one.<p>You have a concept of trigger, which can be either
    a webhook, or a github PR or a github issue, or just a cron expression. Or just
    someone manually clicking.<p>There is a concept of secrets and config, so the
    user can create their own secrets to start codex-cloud, or opencode, or making
    custom API call.<p>There is also the concept of manual gate, so you can wait for
    an human to actually click a button.<p>Finally, it supports running containers.
    Useful if you want to call an obscure API from your workflow, you don&#x27;t have
    to wait for the platform owner to create a step for your API, but you can just
    run a container into it.'
  score: 0
