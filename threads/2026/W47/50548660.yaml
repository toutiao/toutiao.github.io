  author: codekarate
  text: this is a good question<p>you can customize this a lot based on your needs.
    You can create skills for each column in a factory board, select different models,
    and steer the agents as they are running.<p>Depending on how you have it set up,
    your agent will stop for you to approve plans, answer questions, etc.<p>In our
    factory, low risk&#x2F;low complexity items are more automated while higher risk&#x2F;higher
    comlpexity items need more supervision.<p>Mastra Factory provides fully working
    preview environments in a sandbox so you can quickly test UX&#x2F;UI changes in
    your app.
