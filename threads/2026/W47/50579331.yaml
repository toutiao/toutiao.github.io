    # We promoted developers into architects without informing them

    Nov 20, 2026

    5

    5

    Yesterday, I was debugging a performance problem with our Google Forms addon. It turned out my colleague had vibe coded the logging part, so that he could monitor the new installs every week. Monitoring new customers is the most important part of running a business, so he is absolutely right in doing that. Except, he was logging the user’s email and Google has severely restricted how much detail you can get about the user since last December. So, AI had written a series of try/catch statements:

    - First, try to get the email if the user gave consent to share it during installation.

    - If it fails, it would try to fetch his user ID.

    - If that fails, it would log an error saying the user has installed, but we don’t know his email or user ID.

    ### What is the right code for this?

    - Logged just the timestamp of the install instead of trying to fetch the email or user ID, and told the marketing team they won’t be able to send the follow-up email based on installation alone.

    - Or, if marketing wants the user’s email on install, you would have shown the welcome screen first and logged the email or user ID asynchronously from the browser, while the user is looking at the welcome screen. But calling your server from the addon’s welcome screen might require your server to bypass security and log an unauthenticated payload.

    ### Why AI won’t push back

    ### Your new job is to architect

    - Architecture that trades off performance for security and slows down the app.

    - Multiple versions of datamodel design with redundant tables, columns and code.

    ### Your future as a developer

    In our case, the right fix is simple. Log the timestamp, show the welcome screen first and tell marketing what they can’t get on install. But AI will never make that call for you, because it doesn’t know your users and it won’t push back on your requirements. That is the architect’s job. If you are a developer, the coding job is going away. But it doesn’t mean your job is going away. Non-developers who don’t understand architecture and design will end up with bad performance and unmaintainable database tables. So, stop missing the coding and become an architect[2]. Learn to push back on requirements, design the datamodel, constrain AI to it and review the code the way an architect reviews a developer’s code. You got promoted. Nobody told you, so I am telling you.

    Notes:[1] Ultimately, you have limited resources. Architecture is about trading off some requirements, so that your app can run with limited resources. Take CAP theorem as an example. You have to trade off consistency or availability or partition tolerance for your database. If you don't understand that tradeoff and ask AI to build a database that has all 3, it would reinvent Google Spanner++ and expect Google scale datacenter to run it. Or, AI will make the tradeoff for you and you end up with the same neutered architecture as every other non developer.[2] This post is trending on HN. Some have correctly pointed out that good developers already do architecture and bad architects propose ivory tower architecture that falls apart during implementation. I have built ivory tower architecture whenever I am handsoff. This will become more common with AI, if we don't debug its code or don't hand code critical parts of the app from time to time. So, don't stop coding completely, but it's not a full time job anymore.

    Like

