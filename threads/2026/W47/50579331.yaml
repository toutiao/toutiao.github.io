  author: mablopoule
  text: 'Agreed, and another point that I haven&#x27;t seen in the article : &#x27;architect&#x27;
    as a separate software engineering role was a bit of a bad word, even if everybody
    agreed that architecture was important.<p>It was mostly because in some companies
    there was a cast of &#x27;architect&#x27; who were seen as above coding, and who
    mostly delivered out of touch UML diagrams, or ill-fitting data-structure. The
    core of the issue was that even good programmers would rust and get incapable
    of understanding the ground truth if the organization discourage them to also
    be in the implementation side.<p>Here it&#x27;s not exactly the same thing with
    AI, since the loop is dramatically shorter, but the (lack of) feedback issue remains.<p>I
    really believe that my added value as a programmer was fundamentaly to evaluate
    technical tradeoff of the different options to solve a business issues, and them
    to implement them. Now with Claude code I&#x27;m infinitely faster at the implementation
    part, but I&#x27;m also eroding my capacity to evaluate those tradeoff.<p>Programming
    is a medium, and you also need to work with it from time to time in order to keep
    some level of competency. And yet in many companies we are basically forbidden
    to do that.<p>I feel that we have been given cars, but have also been forbidden
    to ever walk again; Sure the car is more efficient most of the time, but there&#x27;s
    a an almost-vital reason why we have to do jogging to compensate.'
