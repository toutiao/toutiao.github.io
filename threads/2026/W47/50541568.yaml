  author: WhyComboNadir
  text: 'This is me exactly, you nailed it on the CRT tube.<p>Just in case of further
    coincidence: I said &quot;no&quot; to every ENT who asked if it was pulsatile...
    except after about a year I started to notice that sometimes the random changes
    were actually heart rate sync&#x27;d... but just sometimes. They would have my
    look all the way to the left and the right to see if it changed, it didn&#x27;t.<p>Then
    I had a breakthrough in the last month:<p>First: I noticed that the sync&#x27;d
    sound would be there when I laid down in bed, and if I sit up half way it was
    gone.<p>Second: Driving through the desert a few weeks ago, daydreaming and staring
    up through my sunroof (of course on FSD), I could suddenly hear it.  If I looked
    to the right (about 80 degrees), and upward (about 45-50 degrees), it would start.
    It would go away, immediately when I returned my head to normal position.<p>Of
    course, I asked all my AIs, and the consensus is that rather than arterial pulsatile,
    it might be venous pulsatile.<p>So I decided to go ahead with a CT Angiogram of
    the head that my ENT had already ordered. (I had previously held off because the
    pulsatile was usually not present, so I didn&#x27;t want to expose myself to the
