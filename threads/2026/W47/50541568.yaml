  author: ajb
  text: This is probably good advice, I would add some caveats.<p>Psychological issues
    can be likened to an immune disorder, there is some trigger, but then the problem
    sustains itself and can continue even if the trigger is removed (eg, by getting
    a phobia of noises). So therapy can help with that, but psych professionals often
    assume their work is the complete solution; if there&#x27;s an underlying physical
    problem it&#x27;s worth getting that treated as well, if at all possible.<p>Like
    any profession, it tells a sweet story about itself, and does not live up to 100%
    of it. A more realistic view is that a therapist is like someone you might get
    to solve a damp or pest problem in your house - they need to make a living, and
    will try to make their solution fit your problem even if it doesn&#x27;t. You
    are still going to be the one who has to decide if you are getting good value
    from them - how long to try before seeing results, and  how long to continue once
    you&#x27;ve made progress (assuming you do).
