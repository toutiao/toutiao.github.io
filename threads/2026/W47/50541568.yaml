  author: EvanAnderson
  text: 'I&#x27;ve had this since I was a kid. I don&#x27;t believe I had any hearing
    trauma that would have triggered it. By way of being able to pinpoint a particular
    memory in time I know I was aware of it by third grade.<p>My daughter has it too
    (and described it to me when she was about 5). My wife and I were fanatical about
    protecting my daughter&#x27;s hearing (to the point that we bought kid-sized hearing
    protection earmuffs and had her wear them for fireworks, concerts, etc). I don&#x27;t
    think hers was trauma-induced either.<p>Because I&#x27;m a nerd I tested my hearing
    range when I was about 12 y&#x2F;o (using the SOUND statement in GW-BASIC on the
    family PC) and I could hear north of 16 KHz. Today I barely top 13 KHz. (I just
    checked w&#x2F; an online tone generator and simultaneously tortured a younger
    cow-orker who, it turns out, can hear 16.5 KHz.)<p>Point being: The sound of my
    tinnitus is above my current hearing range. The &quot;sound&quot; I&#x27;m &quot;hearing&quot;,
    were I to encounter a real source in the world, is imperceptible to me.<p>I can
    tune mine out so I don&#x27;t worry too much about it. I did visit a makeshift
    anechoic chamber at a science museum one time and that _really_ messed with my
    brain and made the tinnitus very loud. As long as I steer clear of stuff like
    that (the foam aisle at a local craft store, for example) it&#x27;s not debilitating.'
