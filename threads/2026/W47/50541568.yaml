  author: robrain
  text: '0. Don&#x27;t panic: seriously. Grabbing on to &quot;oh my god I&#x27;ve
    got tinnitus&quot; can be the cause of much of the ongoing problem. Start from
    a position of &quot;that&#x27;s interesting&quot;. Curiosity, not terror.<p>1.
    See a doctor to rule out physical causes. May just be earwax. They may recommend
    an MRI to check for acoustic neuroma (benign tumour) or other causes.<p>2. Tinnitus
    Retraining Therapy started by Jastreboff and Hazell is well-regarded. Some of
    it relates to point zero above: education and CBT to reduce the mental impact.
    There are also more sound-focused aspects. Best results come from working with
    an expert and availability is limited. The principles can be read about, usefully,
    but you need to go further than just learning.<p>3. Neuroplasticity can be a useful
    tool for some. A popular book for that is Rock Steady: Healing Vertigo or Tinnitus
    with Neuroplasticity.<p>4. General principle: Live. I don&#x27;t mean distract
    yourself or find work-arounds. I mean live. Do the stuff you ordinarily would.
    If you notice your tinnitus, note it and then move on. Like mindfulness and returning
    to the breath - you don&#x27;t beat yourself up, just notice and return to the
    breath. Focusing on solving the problem will make the problem worse - ask me how
    I know.<p>I used my reasonably good sense of frequency and a synth to work out
    my frequencies. Great sense of achievement. But no use to my &quot;treatment&quot;.
    Maybe it will be the missing piece for you.'
