  author: wordsunite
  text: I also have the kind that is multiple frequencies that sound like people are
    tuning CB radios constantly. I&#x27;ve had it for 6 years and tried many things
    that didn&#x27;t work. The thing that actually made it less stressful was what
    many have said in the main thread. Once you stop fighting, it becomes normal and
    then it&#x27;s not as bothersome. The bothersome part is when it starts tugging
    at your ability to do other things, or enjoy other things. Like when you&#x27;re
    at a movie theater and can&#x27;t enjoy the movie because you notice that you
    can still hear the sound even though the movie is so loud. Or where you&#x27;re
    trying to enjoy some peace and quiet and then the noise pulls you out of the relaxation
    and makes you question whether you&#x27;re sane or healthy. The sound hasn&#x27;t
    changed for me but the bothersome part is gone about 80% of the time now. It sounds
    stupid but daily (yes, every day) mindfulness meditation practice, for me specifically
    Andy Puddicombe&#x27;s original managing anxiety series on Headspace (the app
    is completely terrible at the moment, the original was clean and so much better)
    taught me that the fight, with any kind of anxiety or pain, is what can make things
    unbearable. It takes a while for the practice to make a difference but once it
    does, you&#x27;ll realize that during those times of quiet, you can really enjoy
    them even with the sounds present. It took a few stops and starts for me to fully
    buy into it, but once I consistently practiced, I almost missed the fact that
    I hadn&#x27;t been bothered by the sounds in quite a while.
