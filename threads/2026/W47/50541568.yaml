  author: brianrhea
  text: 'This is why I built this: I&#x27;ve been living with tinnitus for the past
    year and a half or so, and while there&#x27;s not a guaranteed cure, I&#x27;m
    taking a &quot;try anything that shows promise&quot; approach.<p>One such approach
    is audio notching: Playing audio with a gap right at your tinnitus frequency to
    trigger neighboring auditory neurons to quiet the overactive neurons responsible
    for tinnitus.<p>The browser version will play background noise (pink noise, ocean,
    forest, etc) with that frequency notched out. Or, if you install the macOS app,
    it will notch out all system audio.'
