  author: torben-friis
  text: 'For those of you who suffer tinnitus, specially if recent, I can&#x27;t recommend
    enough a  psychological therapy approach.<p>I recently got tinnitus (about a year
    ago) due to a badly treated ear infection. Most of my hobbies (reading, coding,
    studying) are done in quiet spaces, so the idea that I would never  hear silence
    again was devastating.<p>But as my doctor pointed out, a signal being there forever
    does not mean you hear it forever: You currently have clothes brushing against
    your skin and your ass being pressed against a chair, but it doesn&#x27;t occupy
    mental space.<p>This is consistent with research. We are currently very limited
    in means to solve the physical issue, but we are very far ahead in terms of improving
    the distress or perceived effect.<p>Nowadays I lie in bed in silence, just as
    peaceful as before. And sometimes this fact surprises me, and upon doing a double
    take, it wasn&#x27;t silence, the noise is there. But I do have to check to notice.
    It&#x27;s weird, much like how you don&#x27;t breathe manually until you notice
    and then you have to consciously breathe for a few seconds until you forget about
    it.'
