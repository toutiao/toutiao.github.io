  author: torben-friis
  text: 'The words to look for are cognitive behavioral therapy (oriented for tinnitus),
    the specific exercises and techniques will vary by professional, I suppose.<p>Part
    of what I trained for example is attention shifting, stuff like hearing two conversations
    at the same time and training the ability to move focus from one to the other,
    then shifting between sound and a different stimulus, like reading while a sound
    is on and switching attention from the text to the speech.<p>Then you focus on
    acknowledging the existence of your tinnitus without checking it, which was hard
    for me to split apart. Basically, calming the demand of your brain to pay attention
    to the screech without in doing so shifting focus to the sound itself.<p>An analogy
    that works for me is: Say that you&#x27;re on your phone and you get an instagram
    notification. You don&#x27;t want to open the app (focus on the sound) because
    it will distract you, BUT you don&#x27;t want to pretend the notification isn&#x27;t
    there either, because then the presence of the icon bothers you every few seconds.
    What you want is to acknowledge and dismiss without opening the app. Eventually
    you can dismiss with muscle memory without consciously registering it happened.<p>I&#x27;m
    telling you this anecdotally, but I absolutely do not recommend self learning,
    a professional helps immensely.'
  score: 0
