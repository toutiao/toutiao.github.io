  author: torben-friis
  text: 'I understand that one shouldn&#x27;t speak lightly and provide &quot;false
    hope&quot; magnifying results. But my problem was the opposite: My mental model,
    and probably a common one, was that any approach based on therapy was just stress
    management: In plain words, I thought I would still hear the damn noise, I would
    just learn to be content with that feeling.<p>I was wrong in thinking that way.
    My results don&#x27;t really match that experience. I truly, literally, don&#x27;t
    hear the noise, even if the physical cause remains, unless I concentrate on hearing
    it.<p>It hadn&#x27;t clicked for me that this was possible. But in hindsight it&#x27;s
    now obvious that this is how the mind works: I take cold baths regularly, the
    first ones were miserable and now they&#x27;re fine. But it&#x27;s not that I&#x27;ve
    become a tough guy that can ignore the cold; my first person perspective is that  it&#x27;s
    easier to handle because I literally, truly, don&#x27;t receive feelings of coldness
    as intensely. If any cold bath felt like the first I would have ditched the idea
    long ago; they don&#x27;t, luckily.<p>I&#x27;m not saying that my results are
    achievable for everyone. It&#x27;s anecdotal, and I am lucky that my particular
    hearing loss is very high pitched, so it doesn&#x27;t interfere with actual hearing.
    YMMV. But it&#x27;s important to understand what the range of success looks like,
    so people don&#x27;t dismiss the option outright.'
