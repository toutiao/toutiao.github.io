  text: |-
    The fact that smaller local LLMs are trained in data centers is a rounding error at the scale of a global industrial economy. When I've looked up the actual math, it came out to the equivalent of a small town's power draw over a few months. If we wanted, we could absolutely afford to train a few small LLMs a year.
    I do have a fondness for small, local LLMs. This is partly because they are under the user's control. But it's also because the ones that run on high-end gaming rigs and on entry-level server hardware still have real limitations. These limitations reward users for working with those LLMs more collaboratively (to varying degrees). Current generation frontier models reward the user for taking themselves out of the loop, or only engaging superficially. This leads to skill loss for too many users.
    Sadly, I don't think that local LLMs will be the story of the next few years. The hardware was affordable, but is no longer. But more importantly, the labs still show every sign that the capabilities of their internal models are improving at an accelerating pace, and we are approaching the point where frontier models may be able to start brute-forcing further AI research with minimal human supervision. (If you can solve the Riemann hypotheses and write code as well as Opus 5.5, you're already ahead of a lot of grad students working on AI.)
    I don't know where any of this might be going, but I can't imagine it going anywhere good. Programming models were cute toys 12 months ago and complete garbage 18 months ago. And now they can do things like port Half-Life to the Nintendo 64 with actual sound tracks. Too many people are assuming that progress ended, oh, a year ago. Not enough people are trying to figure out what happens if we have another year of progress like the one we just had. Meanwhile, Anthropic is currently showing a supraexponential trend of algorithmic improvements in pre-training efficiency.
    Attacking LLMs because they generate slop, or attacking them because they consume a fraction of the water of golf courses, seems to be missing one of the really big potential concerns here: What if AI works? And continues to improve from here?
