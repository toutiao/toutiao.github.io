    Reducing Rust to just the borrow checker and ownership semantics feel reductive. I don't think they are the most useful tool Rust gives for avoiding mistakes. That title possibly goes to sum types and pattern matching, but other features could claim that spot. But all of the tools that the language gives wouldn't be as impactiful without the borrow checker and ownership semantics because a GC would disqualify from use in many places. It's a necessary component.
    Looking at https://androidoffsec.withgoogle.com/posts/binder-fuzzing/ and the other Binder CVEs I could find in a quick search, they were all use-after-frees. It's an IPC system: it absolutely has tricky object lifetimes.
