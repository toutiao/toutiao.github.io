    I don't think the token cost of generating the initial code is necessarily the bottleneck or even the most important cost. Instead the quality of the generated code, and how well the model can maintain and make changes to the codebase over time, feel like the pertinent questions.
    In my experience, the frontier models have gotten a lot better at Rust compared to early 2025. I don't know how much of that comes from Rust-specific pre-/post-training and how much carries over from training in other domains/languages.
    I haven't asked frontier models to write enough Rust UI code to know how well they'd maintain a complex codebase built with a framework like GPUI over time. What I'd be curious to see measured is how well agents fix bugs and add new features - without introducing regressions or making the codebase hideous - in an existing UI app across a few different UI stacks. That would tell us more about the cost of the language + UI framework than the initial token cost alone.
