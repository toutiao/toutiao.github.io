    One of the things the web ecosystem has done really well is encapsulation of some of the hard parts of GUIs. If you want to build your own web framework, you don't have to worry about opening a native window, or rendering text, or making widgets accessible. You get all that for free! That lowers the barrier to entry and allows the crowd to thoroughly explore the solution space.
