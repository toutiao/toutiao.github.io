    I am reworking my previous side-project (ReactJS, ReactNative (for mobile), Java) into Rust everything where possible, and typescript for browser (now Svelte)
    The LLM I am using is $13 per month (5 hours a day limit) - GLM-5.3-flash. And I also run a local quantized Qwen model when my GLM limit expires.
    Agent choice is important, I am using Hermes for now (started with open code), and I tried Dirge -- but that one did not work for me, way too slow.
    I am not great yet at idiomatic Rust,  but I am a C++ programmer (and Java, and Erlang) , so generics, references, mutable+immutable -- I am very familiar with. I like Rust's idioms for initialization, returns, matching.
    I am glad sofar with the setup.
    I have to ask the LLMs multiple times to do architectural code review (I do this periodically) and spend effort on better logging, removing duplicate code through leveraging of generic programming and trates, etc.  It seems to work well.
    I am forcing myself to manually code some changes, though -- and it is quite hard, as I have to learn 'somebody else's code' (even though it was created from my prompts, directions, snippets, etc.).
    So for every like 2h of LLM effort -- it is about 8-12 hours for me to understand what was done (this is not a linear metric, actually growth with complexity) -- so overall LLM is not giving me the 'time advantage ', so to speak, as I still spend a lot of time in the code (but not on writing, more on comprehending/reviewing/testing changes)
    I got the LLM to do for me Rust Tauri + Svelte (so a desktop + web) app  -- this was a huge help, otherwise, I would probably just end up with a 'default' web app only, but having the LLM doing the Tauri boilerplate, then creating a bridge to integrate with Playwright for testing -- was a big help, it would take me months to figure that boilerplate out on my own (including idiomatic directory structure, build with CI/CD, etc)
    If I had to name a particular negative for Rust in the age of LLMs, it's that the compile+test-change cycle is very long for me. Crate building + linking takes minutes on my hardware, so it makes my brain switch to something else, and then I lose the train of thought.
    The OP article is a reference to Blitz, and it has a reference/overview of a bunch of rendering engines -- I never had a current picture, so this is a good reference to keep eyes on. This is a complex space with layout engines, constraint-based optimizers, and I think it is correct that the GUI kits are evolving into these things, rather than OS-specific UI API wrappers. Because at the end of the day, the OS specific wrapper APIs are going to be too complex to deal with when it relates to layout/theming. And coming up with type-safe ways of abstracting screen sizes, theming, user-interaction flow, valid-vs-invalid UI states (currently not done to my knowledge in Qt) - I think would be very useful.
    Rust, with a garbage-collection-free runtime but a strong type system and safety, should be good for this.
