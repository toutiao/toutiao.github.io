  text: Even ZGC now offers better predictablity than malloc&#x2F;free allocators
    (which are a long way from predictable as far latency goes). But some hard-realtime
    software uses (or at least used to) RTSJ, a hard-realtime version of Java, that
    separates the heap to a part that uses a GC and a part that uses nested arenas.
    It was a big deal twenty years ago, when I worked on such software. I don&#x27;t
    know how much it&#x27;s still used. Probably not much. C is still king in that
    world, and Ada too, to some extent.<p>It&#x27;s important to know that for hard
    realtime, even C alone isn&#x27;t enough, though, and you need special kernels.
    Ordinary OS schedulers aren&#x27;t predictable enough for hard realtime.
