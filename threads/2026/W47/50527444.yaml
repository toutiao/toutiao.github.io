  text: |-
    On that note, here&#x27;s my favorite little-known tip for running Docker&#x2F;Container JVM apps:<p>The Redhat image distros, like UBI and the JDK ones, have a really handy bash script, &quot;run-java.sh&quot;. It&#x27;s a wrapper script for best-practice and intelligent JVM runtime args inside of container envs:<p><pre><code>  &#x2F;opt&#x2F;jboss&#x2F;container&#x2F;java&#x2F;run&#x2F;run-java.sh
    </code></pre>
    It started life as fabric8&#x27;s run-java-sh, and it&#x27;s what the Dockerfile.jvm generated by Quarkus apps uses as its entrypoint.<p>The script handles, among other things:<p>- Heap sized as a percentage of the container&#x27;s memory limit via -XX:MaxRAMPercentage (default 80%, compared with JVM&#x27;s default of 25%). Tunalbe with JAVA_MAX_MEM_RATIO env.<p>- -XX:+ExitOnOutOfMemoryError, so an OOM kills the container and your orchestrator restarts it<p>- Defaults for GC and metaspace<p>- JAVA_DEBUG=true &#x2F; JAVA_DEBUG_PORT=*:5005 turns on JDWP without you having to edit the Dockerfile<p>- http_proxy&#x2F;https_proxy&#x2F;no_proxy env vars get translated into -Dhttp.proxyHost etc
