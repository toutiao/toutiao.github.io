  author: brunoborges
  text: 'Lots of details that teams miss when tuning the JVM on Kubernetes:<p>1. Default
    heap size varies: it can be 50% of the available memory for any amount of available
    memory up to 256mb; ~128mb for anywhere between 256 and 512; and then 25% for
    anything above 512mb;<p>2. The JVM will still do parallel threads even when CPU
    limit is 1,000 or below , which triggers CPU throttling much faster. Threads such
    as GC (even when it is SerialGC), ForkJoin pools, Database connection pools, HTTP
    server, and so on.<p>3. The JVM behaves MUCH better with 2,000 or more milicores,
    and a well sized heap. Having very small containers and dozens of replicas is
    worse than having slightly bigger containers (cpu&#x2F;memory limits) and fewer
    replicas, even with a different ratio (e.g. 6 replicas will perform worse than
    3 replicas, even when aggregated CPU and memory limits are the same).<p>I&#x27;ve
    been advocating on this for years [1].<p>[1] <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=wApqCjHWF8Q"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=wApqCjHWF8Q</a>'
