  author: pron
  text: 'That is just wrong. Moving GCs were invented because they&#x27;re more efficient
    than manual memory management. In fact, in his famous 1986 paper, <i>Garbage Collection
    Can Be Faster Than Stack Allocation</i>, Andrew Appel wrote: &quot;It is easy
    to believe that one must pay a price in efficiency for this ease in programming…
    But this is simply not true.&quot;<p>Moving GCs free you from the high overhead
    of malloc&#x2F;free runtimes, something that us old C and C++ programmers have
    had decades of experience with, and why our colleagues developed large, complex
    runtimes such as TCMalloc and jemalloc to remove some of that overhead, even though
    not nearly as much as moving GCs do.<p>The reason low-level languages don&#x27;t
    use moving collectors despite their superior efficiency is because they must give
    up on some performance optimisations for the abillity to interact with the hardware
    or OS directly, and that means that pointers must be stable machine addresses
    (this is why you need a richer FFI layer in Java). Moving collectors work in many
    ways like arenas. They don&#x27;t need to maintain free lists whenever an object
    is allocated or freed (in fact, they never free any object at all), and memory
    is freed in bulk. This is not the only performance that low-level languages leave
    on the table because above everything else they must be low level.<p>Every single
    language that <i>can</i> use moving collectors does (it&#x27;s also a matter of
    resources; moving collectors are hard to implement, especially the modern pauseless
    ones).<p>Sadly, people who are not compiler or memory allocator engineers don&#x27;t
    know that, so they believe &quot;popular wisdom&quot; disseminated by other non-experts.<p>P.S.<p>Re
    AI: It&#x27;s certainly possible that AI will be able to write good, efficient,
    large software some day, perhaps soon, but if it&#x27;s able to perform the global
    program transformations required to replicate the optimisations of a moving collector
    without one, it won&#x27;t need the simpler and more local optimisations done
    by a compiler, and will be able to work better without one, directly in machine
    code, in which case all compilers and programming languages are also done. In
    other words, moving GCs will not be a relic of the past before compilers are (or
    maybe roughly around the same time).'
