  author: pron
  text: 'That is not so simple. First, the differences among different GCs are bigger
    than between some GCs and no GC. Second, moving GCs - of the kind used in HotSpot
    (as well as V8 and .NET), but not Go or Python (which are as different from each
    other as they are from moving GCs) - do, indeed have a higher memory utilisation,
    but it&#x27;s not necessarily inefficient, because most of it comes into effect
    when CPU is under higher pressure than RAM (that&#x27;s when you get a larger
    young-gen, as the heap overhead is a function of the allocation rate, not of the
    live set which, in turn, means a high CPU usage). RAM and CPU are not independent
    resources; the most basic way to think about this is that your machine is exhausted
    when the <i>first</i> of CPU and RAM is exhausted. For example, I can take your
    car battery or I can take your petrol, but if I take your car battery when you
    don&#x27;t have petrol, I&#x27;m not impacting your use of the car, so I&#x27;m
    not really creating any &quot;inefficiency&quot;.<p>You are right, though, that
    in a very memory-constrained environment, usually embedded devices, you may want
    to lower memory consumption regardless of anything else, and in such environments
    moving GCs are probably not what you want (although other kinds of GC could be).<p>More
    here: <a href="https:&#x2F;&#x2F;youtu.be&#x2F;xr73mR7ii9M" rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;xr73mR7ii9M</a>'
