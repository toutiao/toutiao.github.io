  author: titzer
  text: No, manual memory management, with or without static ownership, is not inherently
    more efficient than GC. Bump pointer allocation is crazy fast. GC work is proportional
    to live data, not dead data. GC can do compaction and locality optimizations.
    Manual deallocation is proportional to dead data, unless you are doing bulk deallocation
    with regions. Stack allocation is crazy fast. It&#x27;s a little beyond what state-of-the-art
    compilers do by default, but it&#x27;s just pointer analysis that will also get
    better with AI optimizing and improving compilers.
