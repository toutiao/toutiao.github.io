  author: jodrellblank
  text: '&quot;&quot;&quot;If you&#x27;re looking for the next win, you don&#x27;t
    have a hotspot. The CPU profile might look even-Stevens across the board. Let
    me give you a really simple example of this, I used to work on the [Edge] browser
    and you could find yourself with a significant regression one week and you&#x27;re
    using way more CPU, and you look what the functions are and it&#x27;s the same
    functions as always. It&#x27;s layout and it&#x27;s style computation, and that
    code hasn&#x27;t changed a byte. It&#x27;s the same excellent layout engine, it&#x27;s
    the same excellent style engine, and yet the profiler will tell you you&#x27;re
    spending way more time in layout. What&#x27;s happened?<p>Somewhere in your code
    is a little whammy where someone invalidated a bunch of tree nodes which took
    about 8 nanoseconds and caused the layout engine to now do tons of computation
    that it didn&#x27;t have to do before. No profiler in the world is going to save
    you from this problem, it&#x27;s going to tell you that the problem is in the
    layout code. Well duh, thanks for that, <i>of course</i> the compute is in the
    layout code, it&#x27;s <i>always</i> in the layout code, <i>all we do</i> is layout
    and draw. So I have to find the 3 nanoseconds where somebody invalidated something
    that they have no business invalidating because it&#x27;s wrong. And the way you
    fix that is [to have a sense of how to check that you&#x27;re invalidating the
    right thing, regression testing, visualizations, logging, planning] and it could
    be literally 4 or 5 instructions dirtying the cache and that&#x27;s not going
    to show up in a profile.<p>[paraphrasing; Casey: if you&#x27;ve developed the
    whole browser without caring about this, at the end you&#x27;re going to find
    it very slow and not be able to squeeze any more performance out of the layout
    engine? Rico: Right, this is not something you can fix at the finish line, it
    needs a plan]&quot;&quot;&quot;<p>- Rico Mariani, interview: <a href="https:&#x2F;&#x2F;youtu.be&#x2F;48Rig6v-xYU?t=3615"
    rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;48Rig6v-xYU?t=3615</a>'
