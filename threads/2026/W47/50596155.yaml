  author: zodwick
  text: 'I would like to argue that one could make most codebases 50% faster if rewritten
    from scratch with performance in mind even in the same language.<p>Taking python
    as an example, one could use benefit of hindsight and make better decisions from
    the start ( offloading slow parts to C binaries, better DS decisions, eliminating
    bloat etc.. ) if they rewrite the same app in Python. This is kind of what happens
    when a program gets rewritten to another language ( Rust ) - better decisions
    are made from the start and less bloat is copied over.<p>Yes, obviously there
    are exceptions to this. But most of the time it is the choices we make that make
