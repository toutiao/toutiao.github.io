  author: rented_mule
  text: I rewrote a C++ batch process in Python 1.4 (this was 1997) and the Python
    version was ~10x as fast.<p>The port was pretty direct, function for function.
    It was even line for line where language and library differences didn&#x27;t offer
    an easier way. I was just trying to see if Python was so slow that we couldn&#x27;t
    consider using it in production, and this was the most speed critical batch we
    had.<p>I assumed the speed difference was a bug that was skipping work, but that
    seemed unlikely because the output was correct. It turned out to be a bug in the
    C++ code that was needlessly reproducing work (an issue with cache keys). The
    bug was extremely subtle. When I fixed the C++, there was very little difference
    in speed as the batch was I&#x2F;O bound when the cache was working.<p>So, adding
    to your point, sometimes you can greatly improve speed by rewriting in a slower
    language, even without performance in mind.
