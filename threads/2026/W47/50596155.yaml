  author: eterm
  text: You&#x27;ve received downvotes, but I&#x27;ll do you the kindness to actually
    answer you.<p>Firstly the obvious, LLMs aren&#x27;t perfect yet, they still make
    mistakes.<p>But even if they could achieve safe C by asking them to &quot;Write
    Safe C, Make no mistakes&quot;, there would still be a significant benefit to
    achieving safety by using Rust or a memory safe language.<p>LLMs work best when
    they have a combination of clear objective functions and guardrails. In this case,
    the compiler acts as a guardrail to keep it safe while trying to solve the problem
    that needs solving.<p>Having a compiler step prevents the LLM taking a &quot;shortcut&quot;.
    Despite models improving, they will still take shortcuts, sometimes absurd ones,
    to meet some definition of a &quot;job done&quot;.<p>The other massive benefit
    is cost and speed. Having an LLM analyze and reason about the safety is expensive
    and wasteful. Having this done at compile time is cheaper and quicker. The earlier
    in the feedback loop, the cheaper it will be.<p>Save your tokens for &quot;real&quot;
    work, not stuff you can check at compile time.
  score: 0
