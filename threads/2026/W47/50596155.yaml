  author: tialaramex
  text: In this particular topic (performance) Rust matters because it will deliver
    excellent performance. You could write a container -&gt; map -&gt; map -&gt; container
    flow in fifty memory safe languages, but probably it would be a bit slower than
    the nasty hack you&#x27;d write in C to convert the data in place. Rust isn&#x27;t,
    if you&#x27;re intrigued you will discover that Rust 1) figured out that the two
    containers must be the same size in memory so it can re-use the original container
    and 2) did the in-place conversion even though that wasn&#x27;t what you wrote,
    because it&#x27;s faster.<p>So magically the Rust was just as fast, but much more
    readable and when a junior (or an LLM) modifies it slightly so that the output
    container is bigger it won&#x27;t suddenly segfault due to that scary in-place
    conversion loop now being a bounds miss, the Rust won&#x27;t attempt the in-place
    conversion now that it can&#x27;t work.
