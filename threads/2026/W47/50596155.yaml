  author: WalterBright
  text: Over the many years I was writing code in C, I noticed that the original program
    design and data structures were very persistent, i.e. they were never reorganized.
    I suspect the cause is the tendrils of those choices found their way into everything,
    so reorganizing it was thoroughly impractical.<p>One of the problems, for C, is
    the use of . to access a field via a variable, and -&gt; to access a field via
    a pointer. To switch between a pointer and a variable in a struct means you&#x27;ve
    got to re-edit large quantities of code everywhere. The result is just too tedious.<p>This
    was the motivation in D for using . for both. It turns out, it is completely unnecessary
    for having both . and -&gt; as the compiler semantic pass can trivially figure
    it out. Eliminating this issue makes for much easier redesign of a data structure.
