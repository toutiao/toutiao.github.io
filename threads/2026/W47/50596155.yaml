  author: the8472
  text: Python and Ruby are single-threaded (yesyes, there&#x27;s noGIL python now),
    which in turn means they&#x27;re deployed as multi-process services, which means
    they must be stateless, which means there is a lot less you can keep in-memory
    and need to offload to external  stateful systems. And that&#x27;s how you get
    your bad architecture.<p>And python being interpreted and dogslow means any heavy
    computation you write in pure python needs to be offloaded too instead of just
    putting it on a threadpool, again making your architecture more complicated.<p>Add
    in serverless functions, which need startup, and now something that should have
    taken microseconds will take seconds.<p>Node is JITed at least, but still no shared-memory
    multithreading, so it still encourages all the architectural bloat.
