  text: Today I added Rust checked arithmetic which detects and protects math bugs
    such as integer addition overflow and division by zero.<p>Rust checked arithmetic
    is built into Rust&#x27;s standard library (std) via explicit methods on primitive
    integer types (such as checked_add, checked_sub, checked_mul, and checked_div),
    which return Option&lt;T&gt; and evaluate to None on overflow. There&#x27;s a
    known tradeoff of some speed, which is fine for my purposes because I need reliability
    more than raw speed.<p>I&#x27;m longtime C coder so I know how to do this in C.
    Rust strong types and static analysis make it so much easier to do correctly.
