  text: 'As always, it depends.<p>For example, PyTorch (and numpy IIUC) store matrices&#x2F;tensors
    as a 1D array of numbers. This is more memory efficient as all the data is colocated.<p>They
    use a technique to store the distance within the array to move when moving along
    each axis (strides). This allows for operations such as transpose to be swapping
    the array and stride values instead of performing an expensive array&#x2F;vector
    copy.<p>Another example: using string formatter or join instead of separate concatenations
    allows the compiler&#x2F;language to compute the size of the resulting string
    up front (if the language&#x2F;library supports that) rather than allocating on
    demand.<p>Another example: using a hash map&#x2F;set instead of an array to check
    for the presence of strings.'
