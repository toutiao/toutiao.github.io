  text: "&gt; Maybe companies will be more careful with handing out data to third
    parties if they can no-longer trust those third parties to keep the data secure
    and it becomes a reputational risk.<p>No no no, you&#x27;ve got it backwards.
    The reputational risk is <i>not</i> giving data to third parties. The more third-parties
    you involve, and the more you offload, the lower the reputational risk.<p>The
    purpose of many companies is not their product or their service, it&#x27;s <i>accountability
    laundering</i>. If you make it someone else&#x27;s problem, you don&#x27;t have
    to care. If JP Morgan had the leak instead, it would be much worse for them. Much,
    much worse. Now, a sane person would say &quot;well then JP Morgan why don&#x27;t
    you just design your systems to prevent a leak?&quot; but that&#x27;s not how
    risk-averse leaders see it.<p>They see it as &quot;the leak is inevitable&quot;.
    Now, do <i>you</i> want to leak the data, or do you want <i>someone else</i> to
    leak the data? There&#x27;s a secret third option which is &quot;don&#x27;t collect
    the data&quot; but nobody actually considers that. Realistically, you just outsource
    some operation to however the hell you like. Then, when things go wrong, you wipe
    your hands, maybe make a PR release about how you &quot;trusted them&quot;, and
    then move on to dump your operations into <i>another</i> third party. Fingers
    crossed this one doesn&#x27;t leak!"
