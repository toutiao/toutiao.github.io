  text: "&gt; &quot;Based on our  investigation so far, we believe the attackers accessed
    certain marketing data held by those vendors, which may include some customer
    names  and email addresses,&quot;<p>A big question that I think will increasingly
    be asked as this sort of thing becomes more widespread: Did these customers really
    give <i>informed</i> consent to their data being passed to these &quot;third party
    vendors&quot; that are getting breached?<p>Even with regulation such as CCPA and
    GDPR in Europe, a lack of meaningful consequences has meant a complete abdication
    of treating customer data as a liability.<p>Maybe companies will be more careful
    with handing out data to third parties if they can no-longer trust those third
    parties to keep the data secure and it becomes a reputational risk.<p>Of course
    that remains to be seen, this one will likely fade into noise and have little
    to no effect long term, but I am hopeful that meaningful attitude change to data
    will happen as an effect of the continuing vuln-pocalypse.<p>An alternate technical
    point of view: there&#x27;s also an argument for the need for a better way than
    emails or SMS for being contacted by companies with which we do business. If a
    contact grant was handled in a more privacy-preserving manner, then you could
    authorise companies to send you messages without giving up a form of identification,
    and this authority could then even be also appropriately delegated in a more secure
    way."
