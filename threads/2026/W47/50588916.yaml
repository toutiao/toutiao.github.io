  author: Aurornis
  text: "&gt; I&#x27;ve stopped trusting any of these influencer-benchmaxxers<p>The
    influencer competition for attention in the LLM space is wild. LLMs have emerged
    as <i>the</i> topic of 2026, so all of the influencers who were previously scattered
    around topics like web dev, backend dev, product management, cryptocurrency, and
    every other niche have all pivoted into the same LLM influencer space.<p>It’s
    like one big cage match where they’re all becoming increasingly cutthroat to fight
    for the dwindling scraps of attention in a crowded space.<p>For the first half
    of this year it was interesting to see most of them move in unison on the hot
    topic of the moment, competing to have the best guides, hottest takes, and best
    courses (which are always shockingly expensive and no better than free content,
    but they encourage everyone to get their employers to pay).<p>It was fascinating
    to watch them jump from topic to topic together, like when OpenClaw took off and
    they all had guides on personal agents or even created their own competing OpenClaw
    project. Or when MCP was the topic and everyone had the Ultimate Guide to MCP.<p>Then
    some time this year everyone realized the space was too crowded and switch to
    contrarian hot takes: Every new model release had influencers making videos about
    how it was terrible, awful, and shouldn’t have been released. All of the old buzzwords
    got new videos like MCP IS DEAD with influencers going in the opposite direction
    of what they said 6 months ago.<p>And now, the interpersonal drama is taking over.
    People like Theo are posting attacks and threats on others or bragging about blocking
    or getting blocked, which is the absolute last thing I want to read from supposed
    experts on a topic. Most sane people opt out of the influencer content after they
    realize how much it’s clickbait over quality, but all of these people also have
    rabid fan bases of people who can’t get enough drama and contrarian hot takes.<p>It
    can be hard to filter out the contrarian hot takes when they get dressed up as
    new benchmarks or supposed revelations (declaring a model has been nerfed is evergreen)
    and cross posted to other sites."
