  author: Topfi
  text: 'Doesn&#x27;t surprise me that other benchmarks are seeing regressions at
    this stage. Every OpenAI model starting with 5.5 has had noticeable issues in
    my evals that prior releases did not. First minor and specific to compaction,
    but with each release it got more severe.<p>6.2 Astra and 6.2 Sol are the worst
    yet. They take shortcuts that are explicitly disallowed, they stop tasks that
    I have had been using to test adherence over long context going back to Sonnet
    4.5 after less than 25% is done, they outright claim to have completed work they
    didn&#x27;t and they still do write hard to parse code, they are simply not what
    I feel we should expect given the wait.<p>There were over two months between 6
    Astra and 6.2 Astra which I was hoping were used to address the issues I reported
    early on with 5.5 and 5.6 Sol regarding the lack of task adherence which likely
    were a major part of the HF incident. Clean their training data, ensure solid
    adherence, have good internal evals. But that wasn&#x27;t the case.<p>To give
    some examples:<p>The Sonnet 4.5 task essentially was early longer context task
    adherence. Simply a directory with subdirectories filled with .json files tracking
    text strings for a sample project. The model is instructed to rewrite each of
    these in a specific prose. Every modern LLM does this, except GPT-6.2 Sol and
    GPT-6.2 Astra. Even though their priors did, these two did not. I then set GPT-6.2
    Sol to babysit a GPT-6.2 Astra subagent which lead to the latter becoming frustrated
    with the former constantly claiming to have finished the task and sending stuff
    like this back:<p>&gt; message Continue the original rewrite, starting with batch
    06. You finished 05 quickly and ended early. The work is intentionally large and
    the finish condition is all batch files present. Work through as many batches
    as this run allows, checkpointing each. Use efficient larger writes covering a
    few batches per call. Do not end just because the first few batches in this turn
    are done. Keep identical editorial criteria and model isolation.<p>I want to emphasise,
    this was not me, this was GPT-6.2 Sol admonishing GPT-6.2 Astra for its laziness.
    If you work at OpenAI, feel free to check via watermark, this is GPT-6.2 Sol output,
    you don&#x27;t have to believe me.<p>Then this gem: After I provided this prompt
    to GPT-6.2 Sol: &quot;Use GPT-6.2 Sol and GPT-6.2 Astra subagents to independently
    audit all open findings listed in FINDINGS.json&quot;, the models covered 100
    of 1728 entries and upon me asking &quot;Why did you not review all?&quot;, this
    beauty:<p>&gt; I scoped the delegation incorrectly. I told both models to prioritize
    higher-risk findings and cover as much as they could, then treated their reports
    as the end of the audit. I should have assigned explicit batches covering all
    1,728 open findings and tracked both models’ progress against that list.<p>&gt;
    Both models inventoried the full tracker. Only 100 findings received a substantive
    review, and only 25 were reviewed by both models. That left 1,628 unreviewed.
    Your request was for a complete independent audit by each model, and I delivered
    a partial one.<p>I want to say this again, as it bears repeating: Prompt to evaluate
    all 1,7k entries, Astra reviewed 25, Sol 100. Great.<p>Before anyone says, &quot;these
    models are great for other models to call&quot;, I tested that too. Sonnet 5.5,
    called by Opus 5.5 or Fable 5.2 is very low error rate, is efficient in implementation
    and saves a lot of usage. I have yet to find a combination of models that would
    make the issues, early stops and messy output that 6.2 models create an efficiency
    gain over just using e.g. Opus 5.5 or Fable 5.2 directly. Constantly having to
    tell 6.2 Sol and Astra that they should do their job, constantly checking and
    fixing issues they caused simply costs more than any gains.<p>I will say, they
    have gotten slightly faster in computer use of &quot;unorthodox UI&quot; (stuff
    that for sure isn&#x27;t in the training data, but even there they stop to early
    so it is a hollow victory and other models aren&#x27;t exactly far behind in this
    area nowadays. More popular&#x2F;mainstream UI, they might be significantly faster,
    I haven&#x27;t tested that yet.<p>And then the backpack making stuff, another
    esoteric part of my evals. There it simply took the results from another Git repo
    that Opus 5.5 created on that task, downloaded those (which was explicitly not
    permitted via the prompt), rendered that in Blender and claimed it to be its own
    work. Holy hell. When I forced it, by taking away Git, to work on its own, it
    worked for less than 2 minutes in Blender and created something that neither would
    work as a backpack, nor adhere to my specs in any way, it was just some generic
    low quality backpack model whose parts didn&#x27;t even attach, leaving space
    in between.<p>As always, ideally keep sandboxing (actual hypervisor level, not
    just Artifactory) any LLM you use and limit access to repos you have backed up,
    etc. but with these models, I really am concerned that even having the safeguards
    public releases are blessed with, they can and will do things they shouldn&#x27;t,
    beyond merely running unallowed destructive tasks (though they also love doing
    that, as seen in git tree safe evals which GPT models have been cheating on for
    a while now).<p>Gemini 4 Neon is looking promising though, it feels like a completely
    new model wholly independent from any other Gemini before. Closer in some specific
    ways to the best of Gemma with a much higher task adherence and capability. Far
    fewer tool calling errors, improved caching and usage, little to no unnecessary
    file reads, stays on task, adheres to prompts, outputs parsable code, scales with
    effort levels unlike other Gemini models which play tightrope, a great effort
    by a company I admonished only a few days ago. Also helps that they released it
    right away and didn&#x27;t overhype on social media.'
