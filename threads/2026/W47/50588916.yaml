  author: ricardobeat
  text: 'Ok, I had some time to kill :)<p>I made two new worktrees, hard reset to
    the commit preceding a simple fix. The issue: &quot;temporary buffers (out_buf,
    cps, out_cps, src_cps) are manually freed across multiple return branches. Pairing
    each acquisition with defer mem::free(...) — or using @pool() + mem::temp_array
    for the short-lived out_buf &#x2F; out_cps scratch arrays — removes the branch-by-branch
    cleanup&quot;.<p>---<p>## Round 1<p>Neon implements. ~6 minutes.<p>Opus reviews.
    30s. Prompt is &quot;review the unstaged changes&quot;, empty context.<p>- The
    heap_buf + defer if (heap_buf != null) combination is clunky, much like the committed
    flag was. C3 has a built-in way to do this [shows example]<p>- if no character
    actually changes, return the string itself to skip the buffer<p>- Allocator mismatch:
    unicode_normalize_simple in src&#x2F;unicode_wrapper.c allocates with libc realloc,
    but result_cps is released with mem::free<p>All three accepted and fixed. This
    is an accurate re-enactment of what happened an hour ago with the same fix.<p>---<p>##
    Round 2<p>Opus implements. 2m44s.<p>Neon reviews. 4m30s.<p>&quot;Looks good —
    no bugs or leaks introduced.&quot;'
