  text: |-
    This is an interesting approach for a library-level bypass of coherency restrictions -- for when you're designing a library and explicitly want to provide a default trait, but allow the user to override it explicitly if desired. I do not think the author makes a case for this being workable as a user-level bypass of coherency restrictions, however, and I don't understand why they bring up the conventional user-level orphan rule bypass of "use the newtype pattern", as such.

    Wrapping one or two types is fine.

    It's not, actually. To elaborate on the problem with the newtype design pattern: it is a design pattern. It has no first-class language support. Specifically, it means that the user has to either reimplement every single method on a new type, or dereference the wrapped type (the .0 mentioned in the article) whenever any method besides the new one is to be called. As always the case with design patterns, the lack of language support here (hence it being a design pattern) leads to boilerplate and verbosity. And since an external library's trait implementation is going to be implementing its trait on a specific type, the newtype pattern doesn't actually allow for slotting in your own trait impl within any other parts of the foreign library, like the "generic trait" pattern described in the article does.

    As an aside, my personal gripes with Rust's coherency restrictions fall into four camps:

    I want to locally (+ privately) implement an unimplemented foreign trait on a foreign type.
    I want to locally override a foreign trait on a foreign type.
    I want method call syntax for an arbitrary function so as to be nicer to chain.
    I want the namespacing that traits provide, to have functions share a name but differ in type.

    To this day, I do not understand why Rust's orphan rule prohibits #1. Allowing it wouldn't violate local coherency. Allowing it would only mean that a library update that adds an implementation of that foreign type produces a compile error. So what? A library update that changes the type signature of a function or method I am using produces a compile error, too.
    That Rust prohibits #2 makes sense, although I hate it -- it is breaking coherency. However, I do constantly wish that Rust had an explicit opt-in exception for this. I want to be able to explicitly override a default Display implementation for a foreign type, and re-use all the machinery that builds atop Display, even if this implementation has extra restrictions to stay private, or whatever.
    With regards to #3, that the standard library doesn't provide a blanket .apply(func, args...) bums me out.
    With regards to #4, I grudgingly respect that the lack of support there forces me into the pattern of creating a new trait for whatever functionality it is that I am abstracting over, despite the verbosity.

    Anyway, I think about the orphan rule a lot. It was nice to read this (even though it has annoying slop prose, presumably for translation -- I've got a translator built into my browser, buddy!), and think about it some more. The issue that the article is solving -- that you as a library author may want the user to be able to override your implementations of your traits -- never previously occurred to me.
