    For better or worse, we allow implementing foreign traits for foreign types. For example, impl From<Foo> for Vec<i32> is something any crate can write, even though From is a foreign trait, and Vec is a foreign type.

    WOW, that is a misleading first sentence. There is an unstated asterisk here: Rust allows impl ForeignTrait for ForeignType only if ForeignTrait is parametrized by a LocalType.
    Thanks for linking this RFC though, it was a good read. Although as I understand it -- it's not the relaxing of the orphan rule that the above article is utilizing, right? Rather, it seems to be presupposing that impl ForeignTrait<LocalType> for ForeignType is accepted, and extending it to the impl<T> ForeignTrait<LocalType> for ForeignType<T> case.
