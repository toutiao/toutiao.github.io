  text: To refer to this as a bypass of the orphan rule would be mistaken as it would
    give the impression that this is an accident or emergent property of the language.
    Instead this is an intentional feature of Rust that was deliberately implemented
    in order to relax the orphan rule and make more programs expressible. This is
    described in RFC 2451 and ironically the primary motivator that it mentions is
    to facilitate ORMs. https://rust-lang.github.io/rfcs/2451-re-rebalancing-coherence.html
