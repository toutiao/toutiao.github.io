  text: You might have heard about sRGB (the commonly used colorspace) not being linear,
    and that to get halfway between black and white (linear RGB of 50%), you get an
    sRGB value of around 74%.<p>But there is one place where sRGB is truly linear,
    and that is <i>signal voltage for a CRT display</i>.  50% of sRGB truly means
    50% of signal voltage (between the minimum and maximum voltages).
