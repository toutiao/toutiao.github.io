  author: reverheart
  text: Dynamic range is luminance range. Standard dynamic range (SDR) was ~[0, 200nits].
    High dynamic range (HDR) is higher, e.g. [0, 1000nits]. As John Carmack pointed
    out, human perception is non-linear. SDR uses color volumes that relies on Stevens&#x27;
    power law, which gamma correction approximates. For example, the SRGB and rec.709
    TFs are pretty much piecewise gamma 2.2. This curve is only accurate at low nit
    levels. Thus, at high nit levels, a new curve known as the &quot;perceptual quanitizer&quot;
    or PQ TF is used instead. This curve is ostensibly fine up to 10000nits.<p>Because
    luminance ranges can differ drastically, converting media intended to be viewed
    on, say, a 3000nits display to a 1000nits display require other global transformations.
    HDR metadata standards are different parameterizations of different global transforms.<p>If
    you&#x27;ve ever experienced problems with HDR media it is because human perception
    is not actually global nor is it rooted in physics. We know from Retinex theory,
    the spatial dampening of the lateral geniculate nucleus, the Barten CSF, the Gelb
    effect, the 2022 Los Alamos paper on the non-Riemannian nature of color, etc.
    that the human visual system (HVS) cares about local spatio-temporal relationships
    more than it cares about global luminance. Because HDR pipelines are built on
    global transforms, they can actually have the effect of crushing the local differentials
    the HVS really cares about. There&#x27;s a lot more to say on all of this, but
    that&#x27;s the gist of it.
