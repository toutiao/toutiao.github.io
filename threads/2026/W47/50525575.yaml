  author: Cloudef
  text: 'HDR is extra brightness on your display. In practice it&#x27;s kind of a
    mess, as both the hardware and software implementation has to be good. If you
    have cheap display, you&#x27;ll get something marketed as HDR even though it would
    look better with it turned off, as they likely use very big extra brightness zones,
    so it won&#x27;t end up looking right. On software side, unless it&#x27;s a console,
    the PC stack was not designed for HDR and it really takes co-operation of the
    whole stack to make it look correct on the display. For a while, for best result
    you had to basically bypass most of your display stack to get correct results.
    Valve&#x27;s been working on it for their own platform, and wayland has some experimental
    support.<p>EDIT: For TV, HDR works well assuming you don&#x27;t have cheap TV.'
