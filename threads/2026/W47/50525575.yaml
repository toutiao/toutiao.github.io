    popular and US export restrictions, people has put effort into stuff like PyTorch
    supporting other API&#x27;s, because there is enough industry pressure to have
    alternatives, the question is how long the CUDA moat can keep giving NVidia a
    hardware premium.<p>So, CUDA really wasn&#x27;t anything they embraced or extended
    (even if they did so with GL,etc), it&#x27;s their own API thus GP&#x27;s parallell
    to 3dfx&#x2F;Glide and the question is how long they can keep milking that moat
    (especially, since iroincally,  AI&#x27;s probably makes porting to other frameworks
