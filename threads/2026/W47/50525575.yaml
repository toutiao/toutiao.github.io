  author: magicalhippo
  text: 'Michael Abrash talks about it[1] in his Ramblings in Realtime[2], which covers
    a lot of the other tricks they did which still seems quite amazing to me still.<p><i>The
    surface-building inner loop is particular efficient, because it consists of nothing
    more than interpolating intensity, combining it with a texel and using the result
    to look up a lit texel color, and storing the results with a dword write every
    four texels. In assembly language, we&#x27;ve gotten this code down to 2.25 cycles
    per lit texel in Quake. Similarly, the texture-mapping inner loop, which overlaps
    an FDIV for floating-point perspective correction with integer pixel drawing in
    16-pixel bursts, has been squeezed down to 7.5 cycles per pixel on a Pentium,
    so the combined inner loop times for building and drawing a surface is roughly
    in the neighborhood of 10 cycles per pixel.</i><p>[1]: <a href="https:&#x2F;&#x2F;valvedev.info&#x2F;archives&#x2F;abrash&#x2F;chap68.html"
