  author: kllrnohj
  text: A full gamut isn&#x27;t unreasonable because of that. A full gamut is unreasonable
    because you&#x27;d need a larger number of subpixels to make that work. If you
    look at a CIE 1931 chromaticity diagram, no matter where you place your 3 points
    for 3 subpixels you will be unable to cover the full gamut. BT 2020 is basically
    an attempt at covering as much as possible and you can still see it misses huge
    amounts of visible colors. A wider gamut at that point requires additional color
    subpixels so it&#x27;s no longer a triangle.<p>And at least with current technology
    we are not at a point where sacrificing resolution or brightness for more coverage
    of the green end of the gamut is a wortwhile tradeoff.
