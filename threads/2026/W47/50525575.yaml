  author: AkBKukU
  text: I have two alternate observations, because VGA is an analog signal there are
    standards for what the voltages <i>should</i> be. But they were not always followed.
    Keep in mind that the first two Voodoo cards were also video switchers with a
    chip to output either the 2D passthrough or the internally generated 3D chip signal
    created by its own GENDAC.<p>1. I have a Voodoo 2 paired with an S3 Virge&#x2F;DX,
    the Voodoo 2 output level is lower. On a CRT I always have to make the image brighter
    when running a 3DFX game. Additionally, the V-Sync pulse is not the same as the
    Virge&#x2F;DX and the Voodoo 2 image is shifted up.<p>2. I have a Voodoo Rush
    which is the maligned hybrid model of 2D and 3D chipsets on a single card. It
    still uses the internal switching though. On this card the voltage issues are
    the opposite, the 2D output is significantly dimmer than the 3D which makes the
    3D game clip badly when running something until the image is adjusted again.<p>These
    problems are voltage level issues with the signal, not gamma. Adjusting gamma
    will not change the black or white voltage level of the signal. But a lower voltage
    signal may seem brighter as gamma is raised and the dynamic range is compressed.<p>&gt;
    we were so enthralled by the absolute performance of 3DFX that the color fidelity
    didn’t get as much attention as it should have.<p>I would say it&#x27;s more likely
    that they just didn&#x27;t notice and the varying outputs from different 3DFX
    cards, with different GENDAC&#x27;s, on differently calibrated CRTs just made
    it a total mess to try and and dial in something as imperceptible as a gamma level.
    Also keep in mind that around 1995-1996 adjusting the brightness of a CRT was
    as easy as twisting a few knobs on the front of it.
