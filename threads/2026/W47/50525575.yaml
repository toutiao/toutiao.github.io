  author: magicalhippo
  text: 'From what I can gather it&#x27;s mainly a holdover from Quake[1] and the
    limited colors afforded by an 8-bit palette.<p>The lightmaps and such support
    colored lighting, but by default the software renderer just used the max IIRC
    of the color channels as a monochrome light value.<p>Just for giggles I recently
    had Claude rewrite the software renderer for Quake 2 to support true-color output
    and so could enable `sw_colorlight 1` when using the software renderer. Doing
    so results in the same reddish tint as the GL renderer, but with the software
    renderer aesthetics.<p>I think you can set `sw_colorlight` to `1` even in the
    classic renderer, but it&#x27;ll look quite bad due to the limited colors afforded
    by the 8-bit palette.<p>Makes sense I guess, the plot takes place on Mars, so
    perhaps that&#x27;s why they went heavy on the red-orange.<p>edit: uploaded some
    screenshots to show the difference:<p>Classic SW with `sw_colorlight 1`: <a href="https:&#x2F;&#x2F;imglink.cc&#x2F;cdn&#x2F;fv5Z3WB_aS.jpg"
