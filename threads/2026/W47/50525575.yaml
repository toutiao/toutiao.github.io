  author: cccbbbaaa
  text: When it comes to colour spaces, there is no “one size fits all”.  Perceptual
    colour spaces are good for, well, perceptual transformations, but many transformations
    ought to be done in a linear colour space, eg. exposure, color calibration and
    white balance adjustment, etc.  This is how darktable operates (everything before
    the tonemapper is done in a linear colour space, everything after is done in a
    perceptual colour space such as JzAzBz or DT UCS 2022 [0], the latter being based
    on OKLab).  Experience has shown that choices made when designing a perceptual
    colour space can lead to subtle issues [1].  (JzAzBz has its own issues for such
    transformations, such as not modelling the Helmholtz-Kohlrausch effect [2].)<p>[0]
    <a href="https:&#x2F;&#x2F;eng.aurelienpierre.com&#x2F;2022&#x2F;02&#x2F;color-saturation-control-for-the-21th-century&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;eng.aurelienpierre.com&#x2F;2022&#x2F;02&#x2F;color-saturation-cont...</a><p>[1]
    <a href="https:&#x2F;&#x2F;ansel.photos&#x2F;en&#x2F;news&#x2F;color-controls-finally-correct&#x2F;#color-equalizer"
    rel="nofollow">https:&#x2F;&#x2F;ansel.photos&#x2F;en&#x2F;news&#x2F;color-controls-finally-correct&#x2F;...</a>
    (Issue caused by the DT UCS 2022 colour space, which is based on OKLab.)<p>[2]
    <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Helmholtz%E2%80%93Kohlrausch_effect"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Helmholtz%E2%80%93Kohlrausch_e...</a>
  score: 0
