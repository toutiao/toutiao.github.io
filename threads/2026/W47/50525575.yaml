  author: rasz
  text: 'In numbers:<p>VGA  default gamma y = 1 aka linear<p>3DFX default gamma y
    = 1.5<p>You might, like I did, think wtf is he talking about, default is linear
    and 3dfx bends it. But CRT monitors y = 2.2! When added up (multiply exponents)
    3dfx is closer to linear output than ordinary VGA. You would still have to set
    3dfx to 2.2 to get perfect linear output.<p>TLDR: Carmack is partially right.
    As he says even game developers were clueless. Nobody had to change their workflows.
    You could call glide grGammaCorrectionValue or even easier set DOS environment
    variable SST_GAMMA  to 1 to get Exact same color mapping as ordinary VGA.<p>Why
    did 3dfx boost that? deffo not to get linear output, if they wanted linear they
    would set 2.2. Probably a Color twist on loudness war, brighter better, or maybe
    felt bad half the bits would get wasted (crushed into near blacks) in 16bit rendering.'
  score: 0
