  text: |-
    Not passive, noise pollution.<p><pre><code>    Specifically, the left speaker transmits C-FMCW chirps sweeping from 18kHz to 21 kHz, while the right speaker transmits in the range of 21.5 kHz to 24.5 kHz. Each speaker transmitsC-FMCW chirps with  = 600 samples per chirp. With a 50 kHz sampling rate, the sweep period for each chirpis 600&#x2F;50000 = 0.012 sec (12 milliseconds). Assuming a speed of sound of 343 m&#x2F;s at room temperature (20◦C),and following the formula provided in 2, the resolution of the EchoMotion sensing system is approximately 0.343cm (or 3.43 mm), and the sensing range is about 205.8 cm (approximately 2 m).
    </code></pre>
