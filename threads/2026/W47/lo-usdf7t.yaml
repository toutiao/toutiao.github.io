  text: I do feel like it's worth keeping in mind Ruby was developed in Japan and
    the string design was developed at a time when Unicode adoption was very far from
    universal in Japan. Designing the string class specifically to ensure the precise
    byte value of strings is preserved unless absolutely necessary makes more sense
    in that context. By comparison, I remember reading a mailing list thread from
    early in the Python 3 days where a Japanese developer commented that it was going
    to be very difficult to work with paths in real-world systems because many of
    them had mixed-encoding paths for historical reasons that weren't valid in any
    specific encoding and couldn't safely be coerced to/from Unicode without losing
    information. (I believe all of that was resolved, possibly before 3.0 was released,
    but you can imagine why a language being designed around these kinds of usecases
    would have been much more defensive around them.)
