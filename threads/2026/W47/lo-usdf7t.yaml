  text: |-
    Ruby bends over backwards to hide the details of string encoding from the user, and to interpret them in a way that keeps control flow going. Correct Ruby string handling entails a lot of force_encoding! at interface boundaries. So I think if you specified one of the affected encodings in something like a Content-Encoding header, you could hit this path pretty easily (probably as part of Rack internals), though I don't know anything about how one would get shell after that.
    Source: long, long ago I helped implement the String class for a Ruby implementation, and it was one of the most maddening specs I've ever had to work with. "Strings are mutable blobs of bytes with a mutable tag describing their interpretation" is the wrong design, as Python learned.
