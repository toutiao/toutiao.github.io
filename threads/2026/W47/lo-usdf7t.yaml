    No, it's very real, because Rack allow to send strings in arbitrary encodings via multipart chunks.
    This behavior is likely to be removed from future versions of rack (currently in review). I already added a feature in Rails to monkey patch it out.
    Now this only allow triggering a single byte of overflow, but it's kinda crazy how agents are capable of turning that into an actual RCE.
