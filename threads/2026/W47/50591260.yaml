article:
  url: https://jespino.github.io/gopgext/
  title: gopgext — PostgreSQL extensions in Go
  fetch_status: success
  content: "Experimentalgopgext is experimental. Don’t use it in production: a bug
    in the generated code or the Go runtime runs inside the server, where it can crash
    it or corrupt data, and the API and generated SQL may change without notice.\n\n##
    Hello, world[#](#hello-world)\n\n    package main\n    \n    import (\n    \t\"strings\"\n
    \   \n    \t\"gopgext/pg\"\n    )\n    \n    // Hello returns a greeting for name.\n
    \   //\n    //gopgext:function immutable parallel=safe\n    func Hello(name string)
    string {\n    \treturn \"Hello, \" + name + \"!\"\n    }\n    \n    // Shout upper-cases
    s. An empty string raises an error.\n    //\n    //gopgext:function immutable
    parallel=safe\n    func Shout(s string) (string, error) {\n    \tif s == \"\"
    {\n    \t\treturn \"\", pg.Errorf(pg.CodeInvalidParameterValue, \"nothing to shout\")\n
    \   \t}\n    \treturn strings.ToUpper(s) + \"!\", nil\n    }\n    \n    func main()
    {} // runs once per backend, when PostgreSQL loads the library\n\n    gopgext
    init hello # creates hello/go.mod and hello/main.go\n    gopgext install hello
    # builds hello.so, hello.control, hello--1.0.sql and installs them\n    psql -c
    'CREATE EXTENSION hello' -c \"SELECT hello('world')\"\n    # hello\n    # ---------------\n
    \   # Hello, world!\n\nThe [tutorial](/gopgext/docs/tutorial/) walks through it
    step by step.\n\n## A sibling project[#](#a-sibling-project)\n\ngopgext uses the
    same approach as [gokm](https://jespino.github.io/gokm/), which builds Linux kernel
    modules from Go: a custom TinyGo target and runtime layer for the host, a C runtime
    compiled by the host’s own build system (PGXS here, kbuild there), and generated
    glue."
