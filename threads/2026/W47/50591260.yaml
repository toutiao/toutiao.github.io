  author: nonacosa
  text: Using TinyGo instead of standard cgo is what makes this practical inside a
    Postgres backend. With full Go, the runtime spawns background OS threads for scheduling
    and sysmon, which creates headaches around Postgres process-per-connection forks
    and signal handlers. TinyGo gives you a single-threaded C ABI binary that lives
    inside the backend without fighting the host lifecycle, even if it means giving
    up goroutines.
