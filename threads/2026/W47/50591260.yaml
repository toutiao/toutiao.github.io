  author: collabspherestu
  text: |-
    The trickiest part with writing Postgres extensions in Go usually isn&#x27;t the Cgo bindings—it&#x27;s the runtime friction with Postgres&#x27;s process model:<p>Signal handling conflicts: Postgres relies heavily on signals (SIGINT, SIGTERM, SIGUSR1) for query cancellations, latch wakeups, and statement timeouts. The Go runtime aggressively installs its own signal handlers for preemption and stack management, which can lead to subtle deadlocks or unhandled interrupts inside a backend process.
    Memory contexts vs. Go GC: Postgres manages memory via hierarchical memory contexts (CurrentMemoryContext, palloc), which automatically clean up on transaction aborts or errors (via longjmp). If Go code panics or a Postgres query gets cancelled mid-execution, reconciling Go’s GC-managed heap with Postgres memory lifecycles is notoriously tricky.
    Process-per-connection overhead: Postgres forks a new process per connection. Spinning up the Go runtime, GC threads, and runtime scheduler in every spawned backend worker can add noticeable memory and startup overhead under high connection counts.<p>Rust with pgrx has gained a lot of traction recently precisely because it has zero runtime and integrates directly into palloc and Postgres error handlers. Still, having pure Go tooling for teams with deep Go codebases is an interesting space to watch.
