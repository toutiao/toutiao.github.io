article:
  url: http://ricapar.net/ClawDOS/
  title: ClawDOS | An AI chat and coding harness for DOS, on a real IBM PC 5160 (8088
    at 4.77 MHz)
  fetch_status: success
  content: "[Ricapar/ClawDOS](https://github.com/Ricapar/ClawDOS \"ClawDOS on GitHub\")\n#
    [ClawDOS](http://ricapar.net/ClawDOS/)\n\n# ClawDOS\n\n**An AI coding agent for
    DOS.**  \n It runs on an IBM PC XT: an 8088 at 4.77 MHz, 640K of RAM, a CGA card.\n\n>
    **A (real) human’s note:**\n> \n> * * *\n> \n> **Backstory:** The IBM PC was my
    first computer. Rather, it was my parents’ first personal computer that I got
    to use at a very early age.\n> \n> It was already obsolete by the time I was old
    enough to use it, but at 5 years old it was a magical device that I could make
    do different things depending on what I typed.\n> \n> I learned how to type and
    use DOS so that I could launch some early “Learn the Alphabet” games that my mom
    had bought me. I learned some elementary-level use of BASIC, but at the time that
    didn’t progress much further than making some number guessing games and other
    small projects.\n> \n> From there, many years passed but I still have some of
