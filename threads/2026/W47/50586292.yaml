  author: networked
  text: |-
    Neat concept. I enjoyed the screenshots.<p>I took the same path with my for-fun&#x2F;learning GUI coding agent in Tcl&#x2F;Tk: <a href="https:&#x2F;&#x2F;wiki.tcl-lang.org&#x2F;page&#x2F;Featherweight" rel="nofollow">https:&#x2F;&#x2F;wiki.tcl-lang.org&#x2F;page&#x2F;Featherweight</a>. It shells out to curl for the networking.<p>I&#x27;ve just tried to get it to run on Windows XP SP3. (I have a VM for an old Canon all-in-one printer.) I grabbed a legacy Tcl 8.6.6 installer from <a href="https:&#x2F;&#x2F;github.com&#x2F;dbohdan&#x2F;tcl86-nsis-installer" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;dbohdan&#x2F;tcl86-nsis-installer</a> (mine) and a 2017 build of curl with certificates from <a href="https:&#x2F;&#x2F;winampplugins.co.uk&#x2F;curl&#x2F;" rel="nofollow">https:&#x2F;&#x2F;winampplugins.co.uk&#x2F;curl&#x2F;</a>. The harness was developed against curl 8 and didn&#x27;t work with 7.53.1. MiMo-V2.6-Flash, running in the same harness on modern Linux with Wine for `curl.exe`, found that the necessary change was minimal and only touched `--write-out`:<p><pre><code>  --- featherweight.tcl
      +++ featherweight.tcl
      @@ -2794,7 +2794,8 @@
                   --request POST \
                   --show-error \
                   --silent \
      -            --write-out &quot;\n%{http_code} %{exitcode} %{errormsg}&quot; \
      +            --write-out &quot;\n%{http_code} 0&quot; \
                   [dict get $config endpoint] \
    </code></pre>
    Here are two screenshots of the result. Featherweight is running in Tcl 8.6.6 on Windows XP.<p><a href="https:&#x2F;&#x2F;paste.dbohdan.com&#x2F;1ng3b5y-kb4yd&#x2F;greenshot-1.png" rel="nofollow">https:&#x2F;&#x2F;paste.dbohdan.com&#x2F;1ng3b5y-kb4yd&#x2F;greenshot-1.png</a>
    <a href="https:&#x2F;&#x2F;paste.dbohdan.com&#x2F;1ng3b5y-kb4yd&#x2F;greenshot-2.png" rel="nofollow">https:&#x2F;&#x2F;paste.dbohdan.com&#x2F;1ng3b5y-kb4yd&#x2F;greenshot-2.png</a>
