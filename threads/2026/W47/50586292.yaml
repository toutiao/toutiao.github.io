    my collection. It still has a working 20 MB hard drive, but that’s disconnected
    in favor of a PicoMEM that lets me emulate a hard drive off of an SD card, making
    experimentation and play much easier.\n> \n> **Old, meet new. New, meet old:**
    I love intersections of old and new technology. What better way to cross the two
    than building an AI coding agent to run on DOS on original hardware?\n> \n> And
    of course, what better to build it than an AI coding agent?\n> \n> I (read: Claude)
    built this for my own entertainment. I wanted to see how far I could push an AI
    coding agent to build something given out of the (modern) norm of constraints.
    Also, can that something it built then build other somethings? 100% of this repo
    is written by Claude, with the exception of the text within this box.\n> \n> As
    explained in more detail below, the harness runs on the native OS and hardware
    and relies on a “bridge” PC in order to handle TLS, which would’ve been more than
    what an 8088 could handle.\n\n![The ClawDOS opening screen](docs/images/opening.png)\n\nType
    `CLAWDOS` at the `C:\\>` prompt and talk to Claude. It reads and edits the files
    on your disk, writes programs, compiles them with Turbo C, runs them and looks
    at what they draw on the screen. It keeps notes between conversations and picks
    up where it left off.\n\nThe whole harness runs on the PC. `HARNESS.EXE` is a
    176 KB DOS program that speaks the Claude Messages API itself: it writes the requests,
    parses the streamed reply, runs the tools and keeps every conversation on its
    own disk. The 8088 does everything but TLS.\n\n## See it work\n\nEvery screen
    below comes from a 5160 at 4.77 MHz, emulated in 86Box. The conversations are
    with the live API.\n\n### From a sentence to a running program\n\n![ClawDOS writes,
    compiles and runs PRIMES.C](docs/images/coding.png)\n\nOne message: _“Write PRIMES.C:
    print the primes below 100. Compile it with Turbo C and run it.”_ ClawDOS reads
    its guide to the compilers on this machine, writes the source, then compiles,
    links and runs it in a single tool call. The answer is on the screen 64 seconds
    after Enter, 26 of them spent compiling, linking and running.\n\nThe compiler
    gets the machine to itself. For a build, ClawDOS saves its state and leaves memory,
    Turbo C runs with about 450K free, and the harness comes back on the same conversation
    with the program’s output in hand.\n\n### WarGames, written on the XT\n\nClawDOS
    wrote this tribute to the 1983 film on the PC itself: a vector world map, missiles
    arcing over the pole, a tic-tac-toe endgame, and a score for the PC speaker or
    an AdLib card. Five files of Turbo C, 15 KB of source, a`WG.EXE` under 10 KB.\n\n![GREETINGS
    PROFESSOR FALKEN. SHALL WE PLAY A GAME?](docs/images/wargames-1.png) ![Global
