    games played to a draw](docs/images/wargames-3.png) ![The only winning move is
    not to play](docs/images/wargames-4.png)\n\nHere it is running on the real 5160,
    filmed off its IBM monitor:\n\n[![Video: the WarGames demo running on a real IBM
    PC 5160 (YouTube)](docs/images/wargames-video.jpg)](https://www.youtube.com/watch?v=Jok7MQi-16Q)
    \ \n[▶ Watch the WarGames demo on YouTube](https://www.youtube.com/watch?v=Jok7MQi-16Q)\n\n###
    It remembers\n\nStart a new conversation and “your WarGames demo” is all it needs.
    ClawDOS opens the note it saved in `C:\\MEMORY`, finds the latest build, and recalls
