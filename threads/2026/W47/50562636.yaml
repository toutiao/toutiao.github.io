  content: "# [Chrome AI Features Wasting Much Bandwidth](https://perishablepress.com/chrome-ai-wasting-much-bandwidth/)\n\n♦
    Posted by [Jeff Starr](https://perishablepress.com/author/perish/) in [Tech](https://perishablepress.com/category/media/tech/
    \"Visit category archive\")\n\n Updated • [Leave a comment](https://perishablepress.com/chrome-ai-wasting-much-bandwidth/#respond)\n\n\U0001F50E
    Finally [solved the mystery](https://x.com/perishable/status/2123272927252738098
    \"Read X/Twitter post\"). At some point this year (around a few months ago), my
    bandwidth/data usage went thru the roof. Figured out it was Chrome’s recent features.
    Then got immediate bandwidth-relief after disabling all the “AI innovations” and
    “On-device” stuff. Here is a screenshot of the settings:\n\n[![](https://perishablepress.com/wp/wp-content/images/2026/chrome-ai-features.png)](https://perishablepress.com/wp/wp-content/images/2026/chrome-ai-features.png
    \"Click to view full-size image\")Find the Chrome AI settings under “AI innovations”\n\nI
    simply disabled everything on that settings page, and the needless bandwidth leakage
    **stopped immediately**.\n\nDon’t take my word for it. Fire up your favorite activity/network
    monitor. Watch the network activity while Chrome’s features are enabled, which
    they are **by default**. Note the continual bandwidth/data spend coming from Chrome,
    which if you care to monitor long-term adds up to _hundreds_ of GBs per month
    (depending on setup, usage, etc.).\n\nAfter watching the meter spin for a while,
    go into the Chrome settings and disable all the “AI innovations” and “On-device”
    stuff. Then return to the network monitor and watch it virtually flatline. **Problem
    solved**.\n\n### Commentary\n\nChrome should have left the resource hogs disabled
    by default. Someone do the math on how much energy and bandwidth is **absolutely
    wasted** by all the people (such as myself) who [never even touch the AI stuff](https://perishablepress.com/ai/
    \"Perishable Press AI Policy\").\n\nBefore I disabled the settings, Chrome was
    chewing up literally hundreds of s per month. Now multiply that by the number
    of Chrome users who aren’t using “AI whatever neat”, and you’re talking real numbers.
    Real _waste_. For something that serves absolutely no purpose, that’s a ridiculous
    spend.\n\nThat’s all for now, I’m off to try some new browsers. There are quite
    a few great Chrome-alternatives these days.\n\n[ai](https://perishablepress.com/tag/ai/
