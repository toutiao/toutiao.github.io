  text: Not at all.<p>One should definitely allow comparisons, I agree; it helps put
    things in perspective and can make for great arguments (but here, I think the
    argument would be rather weak anyway, at least because the AI industry wants to
    expand a lot).<p>But saying one shouldn&#x27;t worry about something bad because
    something else is also bad, or because something else is worse is where the whataboutism
    begins. It&#x27;s bad because it&#x27;s an attempt at derailing the discussion
    and the focus. Whataboutism is fundamentally out of topic but people get sucked
    into it. This is why whataboutism is bad in discussions.<p>OP didn&#x27;t say
    &quot;don&#x27;t worry&quot;, but hinting at people focusing on the wrong thing
    is quite close.<p>And yes, I&#x27;ll be pointing out attempts to shut down discussions
    about AI externalities and attempts to highjack AI discussions to animal agriculture
    (as someone who would pretty much like we reduce that a lot as well!).
