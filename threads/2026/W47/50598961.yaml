  author: rsfern
  text: This assumption is rooted in neural scaling theory, where it’s common to model
    performance with a power law in data and compute. I’m not a frontier lab insider,
    but like I said I think pushing on this compute power law is still the dominant
    strategy for increasing model performance. The labs are locked in an arms race
    so I think it’s reasonable to assume they continue scaling up until compute scaling
    asymptotes or a breakthrough in efficient modeling is found.<p>Nobody’s assuming
    chips stop getting more power efficient (I specifically mention this in my previous
    comment) but it’s a hard problem and I think its going to be tough to offset the
    increased demand for compute. If you consider the scaling trajectory so far I
    don’t think two more orders of magnitude is so unrealistic that we should be brushing
    off this conversation.
