  title: AI is becoming a disaster for the climate
  fetch_status: success
  content: "# AI is becoming a disaster for the climate\n\n### Two new studies reveal
    the exploding carbon emissions of the AI industry, while Silicon Valley pushes
    to kill communities’ means of protesting data centers and the impacts on human
    health mount.\n\n[\n\n](https://substack.com/@bloodinthemachine)\n\n[Brian Merchant](https://substack.com/@bloodinthemachine)\n\nAnthropic’s
    [initial public offering](https://www.reuters.com/legal/transactional/anthropic-prices-blockbuster-ipo-83-share-source-says-2026-11-18/)
    netted the company over $81 billion on the first day of trading, making it one
    of, if not _the_, largest IPOs in history. The leading AI company, just five years
    old, now officially boasts a net worth in the neighborhood of $1.3-$1.7 trillion,
    depending on how you do your accounting. I think this is a good time, as such,
    to point out that, per [a recent report](https://drive.google.com/file/d/1XqYn4IJWvo8fYfkzxUpbSXZ3vnzxs3L9/view),
    Anthropic also “has one of the worst recent records on fossil fuels, with analysis
    showing its upcoming data center projects could emit nearly 20 megatons of CO2-e
    a year.”\n\nDespite effectively positioning itself as a uniquely ethical AI company,
    Anthropic has been doubling down on fossil fuels to power its technology, both
    by turning to particularly polluting data centers, like xAI’s infamous Colossus
    plant in Memphis, for its compute needs, and embracing natural gas to power its
    own rapidly expanding array of in-house data centers.\n\nAnthropic, of course,
    is not alone. Despite all the whipsawing AI news of late—Jensen Huang’s ouster
    at Nvidia and [failed comeback bid](https://apnews.com/article/nvidia-jensen-huang-china-national-security-chips-3026bcbe04ab57b844884382e583422a),
    the [digital infrastructurapocalpyse](https://www.bloodinthemachine.com/p/how-ai-is-breaking-the-internet-and)
    of the last week, and the IPO, for starters—I was glad to see another study, on
    the climate impacts of the AI buildout, get some serious headlines. Even if those
    headlines were all of the ‘rather alarming’ variety, like the New York Times’,
    which went [“Carbon Emissions of Biggest U.S. Data Centers Already Rival Entire
    Countries, Study Reveals.”](https://www.nytimes.com/interactive/2026/11/16/climate/ai-data-center-pollution-carbon-emissions.html)\n\nI
    was less glad to see BAAJA, a permitting reform bill designed to overturn key
    environmental protections in the name of making it easier for developers to build
    energy infrastructure and data centers, pass the Senate. We’ll get into all this,
    and a bit more, including a cameo from a very special guest who might help prove
    that data center skepticism runs in the family, in today’s edition. As always,
    this work is made possible by my magnificent paid subscribers—thank you, thank
    you—who chip in a few bucks a month so I can keep the lights on. If you’re able,
    and you find value in this work, please consider upgrading, too. Okay! Onwards.\n\nFirst,
    let’s get to that Harvard University study that made waves right before the Anthropic
    IPO. The report examined the CO2 emissions of over 400 of the United States’ largest
    data centers. It found that more than half of the power used to run them, 54%,
    was generated by fossil fuels, and thus, combined, they emitted as much carbon
    pollution as a mid-sized nation.\n\n[\n\n](https://substackcdn.com/image/fetch/$s_!YSBb!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0ff5bd1b-4f3e-42b1-8209-327c4201f3d1_2528x882.png)\n\nHere’s
    [the New York Times:](https://www.nytimes.com/interactive/2026/11/16/climate/ai-data-center-pollution-carbon-emissions.html)\n\n>
    The largest data centers in the United States are responsible for an estimated
    25.7 million metric tons of carbon dioxide emissions annually — almost as much
    as entire countries like Bolivia or Denmark — according to new research.\n> \n>
    [The study](https://www.nature.com/articles/s41893-026-01985-7), published Monday
    in the journal Nature Sustainability, delivers the first peer-reviewed estimates
    of carbon dioxide emissions from the country’s biggest data centers since the
    start of the artificial intelligence boom. Its authors, a team led by researchers
    from Harvard University, examined the electricity consumption and carbon emissions
    of 403 data centers from May 2024 to April 2025.\n> \n> All told, those data centers
    used almost 2 percent of U.S. electricity, more than New York City and Los Angeles
    combined, and represented about 0.5 percent of U.S. carbon dioxide emissions.\n\nNow,
    if you think that finding sounds bad, then I hate to break it to you, but the
    actual emissions picture is probably much, much worse. For one thing, the survey
    ended in April of last year, and data center development has continued apace since
    then, with natural gas, and to a somewhat lesser extent, coal, supplying much
    of the new power demand. Furthermore, as [Emily Atkin](https://open.substack.com/users/547651-emily-atkin?utm_source=mentions)
    writes [at her great climate newsletter HEATED](https://heated.world/p/the-first-study-of-ai-data-centers),
    the study, for a number of key reasons, “gets nowhere near the actual amount of
    climate pollution” data centers actually emit. From Atkin’s piece:\n\n> One [issue]
    is the way the researchers counted the facilities’ emissions. To do this, they
    estimated how much electricity each data center used, then looked at how the grid
    in that part of the country makes its electricity—how much comes from gas, coal,
    renewables, and so on—to estimate how much CO₂ would be released to generate that
    much power.\n> \n> But not all data center electricity comes from the grid. Indeed,
    [an ever-increasing number of these massive data centers are also building their
    own, on-site fossil fuel plants](https://cleanview.co/reports/behind-the-meter-data-centers).
    For example, during the study period (May 2024 through April 2025), Elon Musk’s
    xAI got some of the electricity for its Colossus data center in Memphis from the
    grid—but it also got some of it [by burning gas in turbines right outside the
    building.](https://www.thebureauinvestigates.com/stories/2026-08-14/misaligned-colossus-musks-data-empire-anthropic)
    Lead author Gianluca Guidi confirmed that Colossus wasn’t among the 403 facilities
    studied.\n\nTLDR, the study doesn’t count the growing number of data centers,
    like Colossus, that use gas turbines on-site to power their plants. Furthermore,\n\n>
    “electricity consumption is not the only way these facilities heat the planet.
    For example, [the equipment that keeps the servers from overheating is leaking
    heat-trapping refrigerants](https://www.theguardian.com/environment/2025/oct/04/pfas-pollution-data-centers-ai)
    into the atmosphere. And when a data center runs on gas—as so many of them do—[methane
    can escape from wells and pipelines](https://www.theguardian.com/us-news/2026/nov/08/datacenters-fossil-fuel-pipelines-regulations)
    before the gas even reaches the power plant.\n\nFinally, due to their tracking
    methodology, the authors may have undercounted the number of data centers in operation
    at the time the study was carried out by a significant margin. As many as 250
    data centers may be absent from the count, as of 2025, Atkin argues. All of which
    is to say, the study should be viewed as the floor; the _minimum_ for how much
    greenhouse gas pollution data centers are emitting. And that is more than the
    entire country of Kenya.\n\nThe findings of the Harvard study comport rather disconcertingly
    with those of another recent report, [State of AI Climate Impact 2026](https://drive.google.com/file/d/1XqYn4IJWvo8fYfkzxUpbSXZ3vnzxs3L9/view),
    by the Australian climate researcher Ketan Joshi. Joshi’s report concludes that
    “The AI boom is already worsening greenhouse gas emissions,” and even more concerningly,
    that it is “potentially emitting more across its lifecycle than all international
    aviation.”\n\nAnd, surprise, it’s only slated to get worse in coming years if
    current development patt"
