    of Silicon Valley monopolies, gig apps, tech oligarchs, and AI, we should all
    be thinking a lot harder about who tech serves, and who it squeezes.<p>For a longer
    look at this newsletter&#x27;s mission, see this short introduction.<p>In my past
    life I was the technology columnist at the Los Angeles Times. Before that, I was
    the senior editor at Motherboard, the co-founder and editor of TERRAFORM, Vice&#x27;s
