  author: MrSkelter
  text: I care about climate change and the counter argument here falls flat.<p>AI
    is a new source of emissions focused primarily in regions where emissions controls
    have had some small effect. The new emissions from AI have wiped out years of
    progress.<p>Keening emissions from agriculture is a bigger more fundamental problem
    which is much harder to solve. If we say that because it’s a big problem we shouldn’t
    care about the smaller ones we are doomed to not taking the easiest wins.<p>Also
    greening the grind has knock on effects for emissions outside the AI space. If
    we were to insist all new power development was renewable we would drive a virtuous
    cycle which would eventually begin to remove carbon from agriculture.
