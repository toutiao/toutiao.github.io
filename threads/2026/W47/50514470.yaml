  author: roveo
  text: LLMs currently are a great demonstration of the wide difference between knowing
    things and applying them in practice. Knowledge contained in LLMs is vast, but
    latent.<p>Humans have a practically infinite &quot;context window&quot; (active
    memory), we make associations and vaguely remember that thing we heard about that
    might be useful here, let&#x27;s explore this thread (&quot;you&#x27;re absolutely
    right!&quot;). Agents, being powerful as they are, don&#x27;t do that, they pattern-match
    on the task and use the obvious solution, but don&#x27;t activate their latent
    knowledge until you point them in the right direction.<p>The obvious solution
    might be the best one in 80% of cases or if you don&#x27;t really care to get
    the best results (and it&#x27;s absolutely fine!), but if you do care in your
    particular case, you have to babysit your agents and really understand if they&#x27;re
    doing what you had in mind.
