  author: sureglymop
  text: I think it&#x27;s interesting because LLMs (at least if used in the terminal)
    quickly create their own scripts to do a certain task.<p>The issue is then, that
    those scripts are probably discarded after one use by the user, partly because
    the LLM doesn&#x27;t make them generalized enough and focuses on solving the one
    task at that time. Partly because, when the issue next arises, it <i>seems</i>
    cheap to the user to just have the LLM do it again.<p>I think these models could
    be trained&#x2F;fine tuned in a way to anticipate future issues or create general
    enough solutions but it would imply lowering their own use... so there might not
    be an incentive for that.
