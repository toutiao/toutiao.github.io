  author: CobrastanJorji
  text: This is why &quot;T-shaped&quot; knowledge is so valuable. You need depth
    in a given area. You should absolutely be an expert at the thing that you&#x27;re
    most immediately doing most of the time. But you should also have a great breadth
    of knowledge, especially within your field, and the reason is so that you recognize
    situations where a particular solution to a problem you encounter may be relevant.
    That gives you the opportunity to learn more about that solution.
