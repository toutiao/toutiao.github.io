  author: pmontra
  text: 'I fully agree and I add that this applies to every kind of job. I recently
    watched a plumber open and clean some pipes. I understood (at least at a superficial
    level) what he was doing and I&#x27;ve been able to complete the cleaning myself
    (he couldn&#x27;t for a number of reasons that don&#x27;t matter here.) Of course
    I&#x27;ve been clumsy and I took N times as long as he did but I finally got water
    again in my kitchen. Without watching him maybe I wouldn&#x27;t have trusted myself
    to open some connections or I would have taken hours or days to reason about what
    was going on and probably do a lot of useless work.<p>Going back to CS and IT,
    I found myself talking many times along the years with good software developers
    coming from a totally different education path (graphics, philosophy, agricultural
    science, etc) and they had blind spots in areas that I had been exposed to at
    least a bit at university. Examples: SQL, one of them knew perfectly well how
    the ORM of the day worked (some JS one 12+ years ago) but not why; networking,
    one of them knew only to enter the SSID and password and everything else was magic.'
