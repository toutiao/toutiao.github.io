  author: poopingatwork
  text: 'It&#x27;s all about how much crap you can fit in your head without going
    crazy.<p>Either you fill it with vertical knowledge (which sucks because now AI
    wipes out a lot of specialists), or you fill it with horizontal knowledge.<p>Vertical
    knowledge is the deep silo of learning that comes from doing more advanced techniques
    to deal with increasingly difficult problems.<p>Horizontal knowledge is knowledge
    about process and workflow: where does the thing created by vertical knowledge
    fit on the bigger picture? What systems are integrated from left to right to keep
    you successful?<p>It may be that a successful developer is now a specialist in
    general technology.<p>Silos between specialists were always talked about being
    broken down but the truth is breaking down a silo means asking your specialists
    to do more work. You don&#x27;t get to be a developer anymore, you must also take
    on operations for successful devops.<p>It may be that AI finally allows broken
    silos to be successful because AI removes a lot of friction that occurs when context
    switching between silos of specialists. And quality may mean more complex interactions
    and integrations, which increases difficulty of operations (notice a trend in
    outages lately?).<p>Then the question becomes: who is still creating quality with
    all these new tools?<p>Because at the end of the day, everyone wants maximum quality
    for the cheapest cost.'
