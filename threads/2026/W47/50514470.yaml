  author: PaulRobinson
  text: I’d say a SOTA LLM today has median depth of expertise over many, many disciplines,
    and slightly better than median expertise in a few key areas. “Jack of all trades,
    master of none”, springs to mind, but I’d say in the last 6 months it’s got above
    the median in some key areas.<p>The sweet spot is a true expert in a domain driving
    the LLM and keeping it honest, whether that be via agents&#x2F;skills or reviewing
    work. In software dev, there’s huge tranches of work at junior&#x2F;mid level
    where LLMs can just go, and anything where there is a clearly testable goal it
    can iterate on faster than a human expert, for example recent progresses in maths
    proofs.<p>But, I don’t think there’s an LLM out there that is an expert at everything.
    At least, not yet.
