  author: thomascountz
  text: You have to begin somewhere.<p>Going breadth-first instead of depth-first
    is a pedagogical choice and a good motivator which was less possible 20 year ago.
    Now, more than ever, being a generalist means you can actually <i>make</i> something
    end-to-end, and <i>making</i> doesn&#x27;t mean you need a professional machinist,
    industrial designer, or firmware engineer. Finally, this is a practical, not a
    lecture-based course. Most of what&#x27;s learned is in the lab where you&#x27;re
    expected to work and problem-solve.<p>If you look at the student portfolios from
    over the years, I&#x27;d say this course has done a lot of good taking this approach.
