  author: epiccoleman
  text: 'It&#x27;s funny because - yes, it does seem like it should be that way. But
    I feel like a huge amount of the value I&#x27;ve gotten from LLMs has been <i>specifically
    because</i> I&#x27;m a generalist type and I can sort of quickly cut through the
    space of possibilities.<p>Just <i>knowing what&#x27;s possible</i>, having been
    exposed to a bunch of ideas, libraries, tools, and, yes, reading too much Hacker
    News - seems like it&#x27;s allowed me to ask good questions, propose interesting
    experiments, and drive my own knowledge forward faster with LLMs.<p>I don&#x27;t
    know that it&#x27;s a particularly unique skill, but from personal experience  there
    seems to be a spectrum of ... creativity? Freedom of thought &#x2F; expression?
    And people who are kinda stuck in their ways seem to get less out of LLMs than
    people who have some idea of what they want and even some direction in mind, but
    just need the details made frictionless.<p>I think I&#x27;m not doing the best
    job expressing what I&#x27;m on about, so here&#x27;s an example - I have a little
    livecoding app[0], which I developed (vibe-coded) for a conference talk I gave
    in October[1]. It&#x27;s been a lot of fun to play with and has formed a good
    surface for lots of different experiments that never made it into the codebase
    - just throwaway ideas, etc.<p>So when all the hype about Jev was going a month
    or two ago, my experiment was &quot;can Jev sit in on the jam?&quot; And what
    I did was hook it up to the app - not to the &quot;musical context&quot; information
    that other agents (agents in the Elixir sense, not really the &#x27;llm agent&#x27;
    sense) in that app receive, but rather to the raw signal info that was coming
    out of the master audio node. And then Jev made a prediction about what note to
    play, and then that note was sent through WebMIDI to a VST on my machine so that
    Jev was almost like an outside &quot;guy&quot; soloing over the app&#x27;s music.<p>(Jev
    was a pretty boring soloist, because playing the &quot;most likely&quot; note
    every time is not especially exciting, but that&#x27;s beside the point here).<p>Maybe
    Claude &#x2F; Codex could have come up with that idea without me - surely the
    models know about all of those different tools &#x2F; options already. But I&#x27;d
    bet that if I hadn&#x27;t known what to ask for, I&#x27;d have gotten something
    less fun.<p>So, idk. Does that mark me out as some kind of special generalist
    who will forever be ahead of the permanent underclass because he reads too much
    HN? Probably not. But it&#x27;s at least a useful disposition in the LLM era.<p>[0]:
