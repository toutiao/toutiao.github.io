  author: renehsz
  text: 'It seems some people aren&#x27;t happy about the fact that this course only
    glosses over each topic, teaching students only superficial knowledge instead
    of doing a deeper dive on one or a few.<p>But let&#x27;s not forget that an overview
    of what’s even possible is extremely valuable in its own right. When these students
    are later faced with a problem X, they&#x27;ll remember that there was this thing
    called Y which might help. They won&#x27;t know the details, but at least they&#x27;ll
    know where to start looking.<p>This is especially important if you want to rise
    to managerial positions, and it might become more relevant now that AI agents
    are increasingly capable of implementing things: Solving problems is not all about
    <i>how</i> to do something, but also about knowing what <i>can</i> be done at
    all. Laypeople often have no idea what&#x27;s possible, but engineers do, which
    lets them be creative with their tools.<p>All of this is not to downplay the value
    of true in-depth knowledge of a specific subject. But those subject matter experts
    typically gain their expertise on the job, or at a later stage in their academic
    life when they conduct proper research. An overview course like this one doesn&#x27;t
    hurt even if many students will choose to specialize later on.'
