  author: qalmakka
  text: A gut feeling I&#x27;ve been having since the start of the LLM era is that
    horizontal knowledge (aka, knowing that stuff exists, can be done in certain way,
    being able to understand the details without knowing them intimately and being
    able to do it with a wide array of things) will start getting more and more important
    the further we go in, because if you know that stuff exist you can point an LLM
    at it or get it to go in a specific way that it wouldn&#x27;t take otherwise.
    LLM have a very strong tendency to just go from point A to point B, and they&#x27;re
    often limited to what you can prompt.<p>This is basically the opposite of the
    last 50+ years where vertical knowledge (being a savant in a certain very specific
    field) was seen as the most important thing to have in a super specialised world.<p>This
