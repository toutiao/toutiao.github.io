  author: ssl-3
  text: 'Once upon a time, headlight bulbs used to be more-standard than they are.  Or
    at least:  They were from my US perspective.<p>I&#x27;ve had cars with 9006&#x2F;9007
    headlight bulbs.  Those were OK, I guess, other than the polycarbonate housings
    that turn into a clouded quagmire of shit when exposed to sunlight.<p>My 2012
    Honda uses D2S headlight bulbs.  That&#x27;s a metal-halide part and it does not
    interchange with any other format, including other metal-halide parts.  Each  also
    requires both ballast and igniter assemblies.  (Once lit, the bulb itself runs
    on [IIRC] 35V.  But it takes a few kiloVolts to get it to initially arc over,
    vaporize some metallic salts, and start making light.  And none of those volts
    are the ~12V that the car&#x27;s electrical system produces.)<p>But at least it
    can use ~any regular D2S bulb.  More-modern cars often use LED assemblies that
    aren&#x27;t interchangeable between models at all.<p>But, yes:  For decades in
    sealed-beam automobile world, we had a couple of sizes for round, and a couple
    of sizes for rectangular, and these sizes included the whole light-producing assembly,
    with focusing elements and the whole shebang.  Some included a high-beam filament
    and some kept that separate, but:  Any of these were very normal (<i>standardized</i>)
    things that anyone could pick up at ~any place selling auto parts and swap out
    with a screwdriver and whatever it takes to remove some trim.<p>(I&#x27;ve lived
    long enough to have seen sealed-beam headlight assemblies on shelves at small-town
    grocery stores.  I have every confidence that if I rolled into the parking lot
    of such a store with a burnt-out halogen headlight in nineteen-eighty-something,
    then I&#x27;d be able to buy one and <i>borrow</i> enough basic hand tools to
    replace it in their parking lot in fairly short order.  I&#x27;d probably also
    have paid Way Too Much for the headlight assembly itself, but I&#x27;d have been
    very grateful anyway.  Convenience has a cost, even in matters of safety.)'
