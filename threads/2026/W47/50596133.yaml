  author: pmkary
  text: 'Correct. You can even go back to things like the Shaker furniture or the
    history of the suit, or money itself. My point is that it is interesting how maximizing
    profit will always lead to thinsg merging and so eventually you&#x27;ll reach
    a point of only one per category.<p>Think about it like this, 15~20 years ago,
    each company was building an operating system: Simbian, Windows Phone, Windows
    Mobile, various Linux based phones, Android, iOS, Blackberry OS, Palm OS, Firefox
    OS, Ubuntu&#x27;s Unity Mobile... But then with the rise of iOS&#x2F;Android,
    the cost of building something for each platform sky rocketed, you could have
    ten people each making the same tool for a different OS, or each making a different
    tool for the same OS. On the other hand it was easier to write one software for
    Android, and install Android everywhere, instead of having ten different apps
    for ten different OSes, and a company could install Android on their phones and
    have a smart phone, the other could make a whole operating system and only when
    all of the Anroid apps were available to their os it would have become feasible.<p>So
    efficiency and optimization always means the death of variety. You can have many
    programming languages with no good libraries, or a crappy JavaScript and C that
    have everything available to them... We all chose the latter.'
  score: 0
