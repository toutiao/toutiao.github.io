    (well, &quot;service station&quot; since I&#x27;m in .au).<p>There were &quot;step
    changes&quot;, like when headlights went from sealed beams to halogen bulbs in
    reflectors, You either had 6&quot; or 8&quot; sealed beams, or most likely H4
    halogen bulbs (or a single filament bulb I&#x27;ve forgotten if you had separate
    low&#x2F;high beam lights). If you had a headlight out, it mostly didn&#x27;t
    matter what model car you had, or of it was a Ford or a VW or a Leyland, they
    all used one of 4 types of bulbs and they were all interchangeable.<p>In my head,
    and this is more motorcycle specific than car specific, but likely indicative
    across the entire automotive industry, it was the early 2000s when that started
    to change. My 1991 and 1998 Hondas and my 1999 Ducati and my 2004 Cagiva all used
    H4 headlight globes and the same 10&#x2F;25W tail&#x2F;brake light globes. My
    2009 Yamaha was the first bike I owned where I had to buy headlight globes from
    Yamaha.
