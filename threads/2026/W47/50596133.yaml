  url: https://www.caranddriver.com/news/a74490092/toyota-nissan-honda-standardize-parts-lower-costs/
  title: Toyota, Nissan, and Honda to Standardize Parts to Lower Costs
  fetch_status: success
  content: "_Tomohiro Ohsumi|Getty Images_\n\n- [**Toyota**](https://caranddriver.com/toyota)
    **,** [**Nissan**](https://caranddriver.com/nissan) **, and** [**Honda**](https://caranddriver.com/honda)
    **will begin standardizing some vehicle parts in an effort to lower production
    costs, according to a report by** [_ **Automotive News** _](https://www.autonews.com/toyota/an-japan-industrywide-auto-parts-standardization-1119/)
    **.** \n- **The automakers will start with equalized quality criteria for steel,
    consistent protocols for plastics, and a universal color-coding scheme for wiring
    harnesses.**\n- **Discussions are starting with Japan’s domestic suppliers, though
    international suppliers will be looped in soon.**\n\nJapan’s three largest automakers
    have agreed to begin standardizing vehicle parts in an effort to reduce costs,
    according to _Automotive News_. The outlet reports that Japan Automobile Manufacturers
    Association chairman Koji Sato, who is also the vice chairman of Toyota, announced
    the decision at a news conference in Tokyo this week.\n\nIn the short term, the
    standardization efforts will begin with unified quality criteria for steel, consistent
    protocols for plastics and resins, and a universal color-coding scheme for wiring
    harnesses. In the long term, the Japan Automobile Manufacturers Association has
    plans to move to more components that cover the entire car. The three areas were
    chosen as the first to be standardized because they are parts that are generally
    not noticed by consumers, and they shouldn’t have an impact on any brand’s individual
    identity. All three are also areas that account for significant production costs
    for the automakers, meaning they can have an immediate impact.\n\n### For Sale
    Near You\n\nSee all results for [used Toyota for sale](/cars-for-sale/toyota)
    near 90011 ![](/_assets/design-tokens/fre/static/icons/arrow-right-regular.e879c19.svg)\n\n
    ![An Auto Parts Manufacturer Company in Binzhou](https://hips.hearstapps.com/hmg-prod/images/9a437d5d-fb1e-4298-b80d-345012dac005.jpeg?crop=1xw:0.844xh;0xw,0.105xh&resize=980:*
    \"An Auto Parts Manufacturer Company in Binzhou\")\n\n_CFOTO/Future Publishing
    via Getty Images|Getty Images_\n\nThe first discussions of standardization are
    set to include Japan’s domestic automotive parts suppliers, though international
    suppliers will be brought into the fold in time. The first standardization efforts
    are set to go into place next year, according to the _AN_ report.\n\nThe push
    to simplify and lower costs comes as Japan’s seven automakers, including Toyota,
    Nissan, Honda, Mazda, Subaru, Mitsubishi, and Suzuki, work to fend off the increasingly
    competitive list of Chinese automakers. The automakers are said to hope that they
    can channel the money saved by homogenizing into new innovations.\n\n“We all share
    this strong sense of crisis, creating a momentum for change,” Sato said. “Based
    upon our sense of a crisis, we decided to choose these three areas.”\n\n* * *\n\n##
    **➡️ Skip the lot. Let Car and Driver help you find your next car.**\n\n[Shop
    New Cars](/new-cars/)\n\n[Shop Used Cars](/cars-for-sale/)\n\n ![Headshot of Jack
    Fitzgerald](https://hips.hearstapps.com/rover/profile_photos/fac2a745-e58e-49fc-be50-42f30a2ea607_1775311013.file?fill=1:1&resize=120:*
    \"Headshot of Jack Fitzgerald\")\n[Jack Fitzgerald](/author/246465/jack-fitzgerald/)\nAssociate
    Editor, News\n\nJack Fitzgerald’s love for cars stems from his as yet unshakable
    addiction to Formula 1. After a brief stint as a detailer for a local dealership
    group in college, he knew he needed a more permanent way to drive all the new
    cars he couldn’t afford and decided to pursue a career in auto writing. By hounding
    his college professors at the University of Wisconsin-Milwaukee, he was able to
    travel Wisconsin seeking out stories in the auto world before landing his dream
    job at _Car and Driver_. His new goal is to delay the inevitable demise of his
    2010 Volkswagen Golf.\n\nWatch Next&nbsp;\n\n ![Video poster](https://hips.hearstapps.com/vidthumb/684709d5-fde9-48aa-a28f-3b990a931da9/089f8994-f7b0-4baf-88b5-7cd590a9aba5.jpeg?crop=1xw:1xh;center,top&resize=980:*
    \"Video poster\")\n\nAdvertisement - Continue Reading Below"
