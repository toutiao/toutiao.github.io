  author: AnthonyMouse
  text: "&gt; A sustainable hyperscale datacenter can be built. There just isn&#x27;t
    enough of an incentive as long as buying gas and polluting the air is cheaper
    (because the cost of both is externalized on society)<p>This is a misidentification
    of the problem. Generating power on-site with turbines is an <i>alternative</i>
    to bidding up the price of grid power that raises the short-term price of electricity
    for other consumers. If they&#x27;re doing one they&#x27;re not doing the other.<p>Moreover,
    small gas turbines and converted aircraft engines aren&#x27;t actually the thing
    with the lowest long-term operating costs, they&#x27;re just the thing you can
    plop out of a truck and turn on right away.<p>Which means the best thing might
    be to use turbines temporarily to avoid raising short-term electricity prices
    for ordinary people, but only for the time it takes to build some new non-carbon
    generation to replace them.<p>And the latter is what everybody really wants, because
    renewable energy isn&#x27;t just cleaner, it&#x27;s <i>cheaper</i>. It just takes
    longer to deploy, not least because the permits cost more and take longer than
    they ought to. Which means that if you really want to get rid of the turbines
    <i>and</i> the high electric bills, what you need is to make it faster to build
    new non-carbon generation."
