  author: bhouston
  text: 'My answer to this is simple.  Libraries are stores of knowledge &#x2F; optimization
    in the end.  Yes, an LLM could write everything from the OS up to the application,
    but that is wasteful in terms of tokens.  If you want something be done fast that
    is not trivial, it makes sense to lean on a library that already does the basics
    well.  And just built your unique aspect on top.<p>Who wants to re-write a glTF
    importer, a SSR algorithm, a UV unwrapped, a proper BRDF, etc.  That can cost
    a lot of tokens.  Might as well just bring that in and built on top of it your
    differentiator.<p>That said, inefficiencies in ThreeJS can come back to bite it
    long-term.  It should aim to get simpler and faster.<p>I&#x27;ve written about
    this here: <a href="https:&#x2F;&#x2F;ben3d.ca&#x2F;blog&#x2F;coding-agents-underestimate-the-cost-of-code"
    rel="nofollow">https:&#x2F;&#x2F;ben3d.ca&#x2F;blog&#x2F;coding-agents-underestimate-the-cost-o...</a>'
  score: 0
