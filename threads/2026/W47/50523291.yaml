  author: greggman65
  text: 'The question is why? LLMs will write this stuff without three.js just fine.<p>See
    4 examples I posted yesterday: <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50514583">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50514583</a><p>Without
    three.js the LLMs are more free to write whatever is appropriate for the specific
    project, instead of having to work around three.js:s architectural decisions when
    they don&#x27;t match the thing being made. They further don&#x27;t need any of
    three.s infra.<p>Whether or not those examples are AAA, they are proof IMO that
    the LLMs can do it without the libraries AND they can do it better without the
    shackles. Take the GTA like one above, the LLM split the city in 128 triangle
    chunks and culls them all on the GPU, taking inspiration from Nanite. Any feature
    you want they will happily recreate in 1 or 2 prompts. And no, you don&#x27;t
    need any special knowledge. You just need to ask the LLM to optimize over a few
    prompts and it will figure out solutions.<p>I know people will jump to three.js
    defense because it&#x27;s well loved and a great library. At the same time, so
    many people are acknowledging that so many libraries in general are no longer
    needed. See shopify getting rid of middleware because the LLM doesn&#x27;t needed
    it: <a href="https:&#x2F;&#x2F;shopify.engineering&#x2F;back-to-native" rel="nofollow">https:&#x2F;&#x2F;shopify.engineering&#x2F;back-to-native</a><p>It&#x27;s
    the same with 3d libraries and game engines. Epic sees the writing on the wall.
    They can tell that there&#x27;s much less need for Unreal today than ever and
    while Unreal is great and provides a ton of tools etc, every day LLMs get better
    at reproducing all of it, meaning they can see it has a shelf life. I think the
    same is true of most of these graphics libraries and game engines from the last
    15 years.'
