article:
  url: https://ben3d.ca/blog/building-the-aaa-lighting-pipeline-in-threejs
  title: Building the AAA Lighting Pipeline in Three.js
  fetch_status: success
  content: "[Part 2](/blog/aaa-quality-on-a-web-budget) picked a pipeline for indoor
    scenes: lightmaps, light probes and reflection probes, with SSR, SSGI and ambient
    occlusion on top. Here I measure Three.js against it one stage at a time: what
    the games require, what Three.js has, and what is missing.\n\n## The pipeline[#](#the-pipeline)\n\nThe
    pipeline has two parts. The setup fills three caches: lightmaps for static meshes,
    a light probe grid for moving objects, and reflection probes for each room.\n\n![The
    setup: three caches.](/api/images?slug=building-the-aaa-lighting-pipeline-in-threejs&imageName=pipeline-setup.svg&hash=24bcc85d2740dd153be1ec3ea231c5c819594bf5a6f5af360295373632b9a1e1)\n_The
    setup: three caches._\n\nEach frame then reads those caches and adds the screen-space
    work on top:\n\n![One frame of the pipeline.](/api/images?slug=building-the-aaa-lighting-pipeline-in-threejs&imageName=frame-pipeline.svg&hash=700e6835587f35f543069acee0d3a86b93f8ca69f2670e4c61efb8a5cd6628a6)\n_One
    frame of the pipeline._\n\n## Where things stand[#](#where-things-stand)\n\n|
    Stage | In Three.js | In review or drafted | Still to build |\n| --- | --- | ---
    | --- |\n| G-buffer | MRT prepass | [Octahedral normals](https://github.com/mrdoob/three.js/pull/35480)
    | |\n| Baked GI | `lightMap`, [unwrapper](https://threejs.org/examples/webgpu_unwrap.html),
    [baker](https://threejs.org/examples/webgpu_lightmap_baking.html), [ray radiosity](https://github.com/mrdoob/three.js/pull/35302),
    [denoiser](https://github.com/mrdoob/three.js/pull/35318), [HDR JPEG XL](https://threejs.org/examples/webgpu_loader_jpegxl.html)
    | [Seam stitching](https://github.com/mrdoob/three.js/pull/35425), [KHR\\_lightmap](https://github.com/KhronosGroup/glTF/pull/2679)
    (draft) | glTF JPEG XL and UltraHDR extensions, runtime BC6H |\n| Dynamic GI |
    `LightProbeGrid`, 8× faster bakes, multi-bounce, updates spread across frames
    | [DDGI visibility](https://github.com/mrdoob/three.js/pull/35174) (draft) | —
    |\n| Occlusion | GTAO, `builtinAOContext`, AO from `SSGINode` | [Bent normals
    and GTSO](https://github.com/mrdoob/three.js/pull/35052) (draft), [joint bilateral
    upsample](https://github.com/bhouston/three.js/pull/110) (draft) | Bent normals
    from `SSGINode` |\n| SSR | Stochastic GGX SSR, temporal accumulation, multi-bounce
    | [Previous-frame tracing](https://github.com/mrdoob/three.js/pull/35430), [Hi-Z
    tracing](https://github.com/bhouston/three.js/pull/155) (draft), [radiance and
    coverage output](https://github.com/bhouston/three.js/pull/169) (draft), [coverage
    in the denoiser](https://github.com/bhouston/three.js/tree/ssr-coverage) (draft)
    | Ray reuse, two-lookup history, skipping mirrors and matte pixels |\n| SSGI |
    `SSGINode`, bounce light and AO from one horizon search, composited over the finished
    image | [Previous-frame tracing](https://github.com/bhouston/three.js/pull/153)
    (draft) | Coverage output, a diffuse source for the BRDF |\n| Reflection probes
    | Single box-projected env map, PMREM | [Probe system](https://github.com/mrdoob/three.js/pull/35046)
    (draft), [cube arrays](https://github.com/mrdoob/three.js/pull/35053) | Probe
    normalization, 128² prefiltering |\n| BRDF integration | AO context, environment
    fallback | — | Pluggable indirect specular and diffuse, coverage cascade |\n|
    TRAA and TAAU | TRAA node, [TAAU node](https://threejs.org/examples/webgpu_upscaling_taau.html)
    | [Catmull-Rom history](https://github.com/mrdoob/three.js/pull/35447) (draft),
    [wider clip at rest and test harness](https://github.com/bhouston/three.js/pull/124)
    (draft) | TAAU in the full pipeline, texture mip bias, the TRAA refinements ported
    to TAAU |\n\nThe biggest remaining gaps are in the SSR, SSGI and BRDF rows: Hi-Z
    tracing and coverage for SSR, the same coverage for SSGI, and above all the pluggable
    indirect lighting that ties both cascades into the BRDF.\n\nIt has moved this
    fast because of the Three.js maintainers. Michael Herzog ([@Mugen87](https://github.com/Mugen87))
    has reviewed most of these PRs, and more than once has reworked one into a better
    design that fits how Three.js as a whole is built, adjusting the renderer's internals
    to make room for it. mrdoob has expressed strong support for many of them. I am
    very lucky to have both.\n\nSo far, though, these pieces have been proposed and
    reviewed one at a time. Nobody has been asked to sign up to the whole. This series
    is my attempt to put them together into one picture, so that each PR can be judged
    for where it fits as well as for what it does.\n\n## The pipeline, stage by stage[#](#the-pipeline-stage-by-stage)\n\n###
    The G-buffer[#](#the-g-buffer)\n\n**What the games require.** SSR, GTAO and the
    denoisers run in screen space before lighting, so they need per-pixel depth, normals,
    roughness, metalness and motion vectors. A deferred engine also stores base color
    and emissive, because its lighting pass reads only the G-buffer. Three.js renders
    forward and its beauty pass reads those from the material, so the G-buffer fits
    in 16 bytes per pixel. [Part 2](/blog/aaa-quality-on-a-web-budget) has the layout
    and the memory budget for the whole frame.\n\n**What Three.js has.** WebGPURenderer
    already renders a G-buffer prepass with multiple render targets, and the [SSR
    examples](https://github.com/mrdoob/three.js/pull/35432) use it today:\n\n    \n
    \   \n        const scenePass = pass( scene, camera );\n        scenePass.setMRT(
    mrt( {\n        \toutput: output,\n        \tdiffuseColor: vec4( diffuseColor.rgb,
