  author: soniczentropy
  text: 'It&#x27;s nice to see someone else saying this.  I have been trying to convince
    my friends for several months that off-the-shelf engines are a booby trap for
    indies now compared to finding the right libraries and having your buddy Claude
    assemble them into a bespoke engine.<p>I think Unreal is safe for a while just
    by virtue of having such an ungodly large amount of tools crammed into it that
    AAA studios actually using those tools are still better off starting from UE5
    that their new hires already know than scratch, but for indies, the ship has already
    sailed imo and most people just haven&#x27;t noticed yet.<p>For reference, my
    hobby graveyard has 20 years worth of crummy self-written game engines running
    the gamut from baby&#x27;s first SFML C++ asteroids clone to raycasting vulkan
    monstrosities in pure Rust.  I fed Kimi a list of crates I hand-picked and we
    planned the engine, then Deepseek Flash did all the work in a couple evenings.
    By the end of week 2, I had a fixed point deterministic physics engine, networking
    + client prediction + test suite ensuring determinism, an audio pipeline, immediate
    and retained mode GUIs, an editor build from them, a hybrid ECS, controller support,
    a custom hot-reloadable scripting language made to my exact specifications for
    prototyping, and a whole crate worth of integrations I told the AI it could build
    to help itself.<p>All the things I wanted, nothing I didn&#x27;t, performance
    screams, all the gamedev parts and knobs and features work exactly the way I want
    them to. Best part is I actually own this engine and will never have to pay anyone
    else a dime to use it or beg devs not to do X&#x2F;Y&#x2F;Z.  Total cost? 13%
    of a $10 OpenCode subscription&#x27;s usage for the month.  Total features I asked
    for that the AI could not provide: 0.  I would literally never go back to using
    off the shelf stuff now'
