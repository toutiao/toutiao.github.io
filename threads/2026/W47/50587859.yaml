  author: onionisafruit
  text: Massively increased travel budgets. Initially each agency individually sends
    agents to Lebanon Kansas (centrally located) with queries and updates. They write
    the result on a napkin and bring it back. Eventually that becomes resource-intensive,
    so somebody starts a query courier service that transports napkins across the
    country. One courier with big pockets can carry hundreds of napkin queries from
    all the agencies in a region. But that is still high latency. A competing service
    sets up an office in Lebanon. Agencies can email a photo of a napkin with a query
    on it. They take the photo into the server room, run the query and write the result
    on a fresh napkin to be photographed and sent in an email back to the agency.
    That’s the final stage. Everything is running efficiently. But what about all
    the diners and hotels in Lebanon built to serve the traveling agents? I don’t
    know. I guess it’s the price of progress.
