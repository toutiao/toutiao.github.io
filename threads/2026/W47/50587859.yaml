  author: EvanAnderson
  text: As Stuxnet showed us, and Ed Skoudis (of SANS fame) said during his keynote
    at DerbyCon 3:<p>&quot;At best, an air gap is a high-latency connection.&quot;<p>The
    usability of a truly air-gapped system rapidly approaches zero, so inevitably
    air-gapped systems end up growing contrivances and compromises that make them
    not air-gapped anymore.<p>&quot;The network is the computer&quot; might seem like
    trite marketing speak but seeing how the utility of computers has taken off as
    ubiquitous networking has become available speaks to the statement&#x27;s truth.
    The amount of utility the FBI could get out of an air-gapped system would be dramatically
    less.<p>Floppy diskette-based computer viruses in the 1980s were enough proof
    alone that air-gapping isn&#x27;t a panacea.
  score: 0
