  url: https://www.nytimes.com/2026/11/22/climate/cop31-climate-summit-ends-climate.html
  title: COP31 Talks Collapse in Turkey in a Clash Over Fossil Fuels - The New York
    Times
  fetch_status: success
  content: |-
    Advertisement

    The United Nations climate talks broke down on Sunday with no final agreement after long-building tensions paralyzed the negotiations, pitting nations seeking to wind down the era of fossil fuels against those aiming to prolong it.

    The European Union, as well as many smaller countries vulnerable to climate disasters and rising sea levels, rejected a proposed agreement they said stripped out crucial protections and favored countries that export oil, gas and coal. A group of oil producers, led by Saudi Arabia and including Russia, had blocked any mention of fossil fuels, the root cause of global warming.

    It was the first time U.N. climate talks broke down over a final agreement since COP15 in Copenhagen in 2009

    That the talks were derailed by something so elemental shows the vast challenges facing the global process for addressing climate change. After nearly two weeks of jockeying in a conference center in Turkey, sleep-deprived negotiators fought two days past the talks’ official deadline, rebooking flights and bargaining in closed-door meetings to see if Russia, Saudi Arabia and other Arab nations might loosen their opposition to language about fossil fuels.

    “It fails to meet the moment,” said Darragh O’Brien, Ireland’s minister of climate, environment and energy, speaking on behalf of the European Union.

    Darragh O’Brien, the Irish environment minister, center left, and Wopke Hoekstra, the European climate commissioner, at the talks on Sunday.Credit...Yasin Akgul/Agence France-Presse — Getty Images

    “We will not accept a COP that greenwashes fossil fuel.”

    He said it was “unconscionable that we would have a climate pact that makes no reference to fossil fuel.” As diplomats spoke, COP31 became the longest U.N. climate summit in history, surpassing one held in 2019 that went nearly 45 hours into overtime.

    Negotiators from more than 190 countries meet every year to advance the goals of the 2015 Paris Agreement. Their failure in Turkey was all the more striking given the backdrop of recent deadly heat waves in Europe, a glacier collapse in Nepal, and an El Niño-fueled run of record-breaking ocean temperatures.

    There have been just two previous times in three decades of annual global climate talks when nations failed to reach agreement, in Copenhagen and at COP6 in The Hague in 2000. Coming at a low point for global cooperation, the breakdown deepened doubts about whether the United Nations process is up to the task of confronting an overheating planet.

    Even in its best moments, that process hasn’t been easy. Many have questioned the viability of a system marked by lawyerly fights over wording and a long history of unrealized promises.

    It has been further complicated by the exodus of the United States under President Trump from the global effort to fight climate change. Some participants say that in that vacuum, other countries have staked out harder positions, leaving the process gridlocked. While one big fight centered on fossil fuels, developing countries also seethed about how much-needed funding to prepare for and deal with climate change has been slow to materialize.

    Countries in 2023 had clinched a celebrated agreement to “transition away” from coal, oil and gas — what organizers called the “beginning of the end” of the fossil fuel era. But in three COPs since then, no final agreement has directly mentioned fossil fuels. Canada is fast-tracking an oil pipeline. Australia has approved new projects that would last for decades. And the United States, under Mr. Trump, has used trade policy to promote fossil fuels abroad.

    “Fossil fuel-producing countries are banding together, no matter which part of the world they come from,” said Lynda Tabuya, Fiji’s climate and environment minister.

    Lynda Tabuya, Fiji’s climate and environment minister, at the conference venue on Wednesday.Credit...Yasin Akgul/Agence France-Presse — Getty Images

    That’s left countries that favor a transition to wind, solar and other clean energy to work outside the formal U.N. system, with a series of conferences and domestic pledges that gained some momentum in Antalya. Denmark, Spain and Portugal were among the nations that announced new fossil fuel phaseout plans this month.

    At the same time, a proposal in the failed text had called to increase the deployment of technology to capture and store carbon dioxide emissions.

    A group of Arab countries led by Saudi Arabia that had sought such language argued that it would be impossible to keep global temperatures at safe levels without this kind of technology. Critics called it a license for fossil fuel developers to continue burning coal, oil and gas rather than shift to renewables.

    The proposed text also included a target to expand the reach of electric power.

    Mohammad Ayoub, a Saudi delegate, speaking in a closing plenary, described the proposed text as a “package of solutions” that would have advanced climate goals.

    The talks, known this year as COP31, came two months after the United Nations acknowledged failure to meet the world’s most ambitious climate target: limiting temperature increase to 1.5 degrees Celsius above preindustrial levels. Some diplomats said the conference’s credibility would depend on mounting a response to that breach and to the intensifying heat waves, droughts and floods that will come with it.

    Holding temperatures to the “lowest possible overshoot” would require immediate cuts to greenhouse emissions, the United Nations has said.

    Mr. O’Brien and Wopke Hoekstra, the European climate commissioner, said they and the leaders of negotiating groups representing about 130 countries repeatedly tried to incorporate language that acknowledged a global effort to transition away from fossil fuels but were blocked by oil-producing nations.

    “There were no measures that were going to bridge that gap and get us back down toward 1.5,” Mr. Hoekstra said.

    Governments have been focused on bringing down the soaring costs of fuel, which have been driven sharply higher by the U.S. and Israeli war in Iran, disruptions in the Strait of Hormuz and refining bottlenecks.

    While climate negotiators worked in Antalya, Mr. Trump, President Xi Jinping of China and President Vladimir V. Putin of Russia met at a lakeside villa in Shenzhen, China, and agreed to “increase the production and supply” of petroleum. The United States, China and Russia represent three of the four largest emitters.

    In an unusual twist, two countries this year had a hand in running the event, with Turkey hosting but an Australian minister, Chris Bowen, in charge of shepherding negotiations. But as talks went past the deadline, it became hard for delegates to tell who was doing what. Organizers did not call all nations together to hash things out. Public communication stopped. Groups came in and out of backrooms. “It’s not effective and it can’t build consensus,” said Xolisa Joseph Ngwadla, a negotiator from Botswana. “The process is basically mismanaged.”

    Mr. Bowen said the overshoot of 1.5 degrees Celsius, coupled with concerns about energy security, had made nations’ “red lines more irreconcilable.”

    “The pressure in the system was very high,” Mr. Bowen said.

    The impasse at COP31 comes amid concerns that the consensus-based process is no longer functioning. Johan Rockström, the director of the Potsdam Institute for Climate Impact Research in Germany, wrote in an online post that a requirement for unanimity was the “real Achilles' heel” of the process and said a handful of countries were deliberately putting “spanners in the wheel.”

    Former Vice President Al Gore, who was in Turkey for the beginning of the talks, said it was “insane” that any individual country could “block the entire process.” Mr. Gore suggested supermajority voting.

