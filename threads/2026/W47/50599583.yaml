  author: jcranmer
  text: "&gt; Even the senate voting to enter a treaty might not be of much help,
    as there&#x27;s precedent for the president to withdraw from treaties without
    congressional approval.<p>There&#x27;s some complication here that&#x27;s often
    elided. Per the US Constitution, all treaties have to be ratified by the Senate,
    and it&#x27;s generally held that such treaties have to be abrogated by act of
    Congress (SCOTUS has never actually heard a case, since treaty abrogation is generally
    something they dodge as nonjusticiable in the first place).<p>However, a lot of
    &quot;treaties&quot; these days signed by the US are actually &quot;executive
    agreements,&quot; which bypass the need for ⅔ majority vote in the Senate. Since
    they&#x27;re made under the (potentially delegated) authority of the executive
    alone, they&#x27;re able to be abrogated by that same authority of the executive
    alone."
  score: 0
