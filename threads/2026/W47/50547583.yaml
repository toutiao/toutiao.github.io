  text: 'YOu have people here that wrote the sw; no need to guess.<p>They were read
    all the time. Example: The rockwell collins CNDU-800 had 2 databases of points,
    the primary and reversionary (something like that). The latter being max 200 super
    important &#x27;get home&#x27; waypoints and such, and they were loaded on boot.
    The Primary was just a collection of waypoints&#x2F;navaids&#x2F;airports, and
    those were dynamically seeked for if, for example, you modify your plan in flight.
    Because what computer could store 128MB of memory?<p>I forget the airframe, but
    for one project I modified the code on the 800 to function as a &#x27;black box&#x27;
    of sorts. We&#x27;d record GPS data and the like, to be used for mission debriefs
    and such in SW that I also wrote. This ended up used in all kinds of places I
    can&#x27;t talk about.'
