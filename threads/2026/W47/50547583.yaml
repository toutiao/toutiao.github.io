  author: RogerL
  text: 'Cool. I was in the game during the period when DTMs were still being used,
    and ended up doing sw mods to support the PCMCIA replacements, which was a real
    hair puller because of lack of documentation and difficulty in getting Windows
    to work with the cards (a lot of work was more on the pc side - planners&#x2F;loaders).<p>for
    others - the DTM was a solid black &quot;brick&quot; that weighed a few pounds
    and was maybe 128MB of solid state memory. About the size of a brick, but half
    as thick. Very expensive (I think we were paying ~6K at the time), with long lead
    times. The SCSI devices we used to read&#x2F;write from the PC were even harder
    to acquire; you had to get a spot on the manufacturing schedule, and we were a
    small defense contractor, so no real way to get moved up the list. Made for difficult
    contract deliveries, and of course absurdly expensive bids due to all of this.<p>Everyone
    was really excited to the change to PCMCIA, except the ones of us implementing
    it!<p>edit: i may be conflating a few memories, I do remember fighting with microSDs
    as well, I think. Trying to remember; I think the DTM &#x27;bricks&#x27; had a
    version that accepted a PCMCIA or micro card as the memory, so the interface hardware&#x2F;sw
    didn&#x27;t need to change. I have no idea if the DTMs are in use anymore.'
