  author: WarmWash
  text: Try it, but if there is a single Chinese chip in there, and trust me they
    do check (they have partnerships with major US electronics companies that do the
    authentication), you will get your door kicked down, and you will do prison time.
    <i>It doesn&#x27;t even matter if you honestly didn&#x27;t know</i>.<p>Trust me
    part of my company works in this field of legacy government stuff, and the gov
    is well aware of the overwhelming temptation to pass off cheap Chinese clones.
    You absolutely will be nailed to the cross for it. I have seen it happen a few
    times.<p>Sourcing parts like this is enormously difficult, because you also need
    to know the supply chain. Sometimes you can even spin up runs of legacy chips
    to meet order criteria. We have a catalog and fab that will make us new old chips
    that are 20-30 years out of production, but the MOQ is pretty high.<p>All that
    being said, the gov will pay $12,500 for a 256MB card from 2002.
