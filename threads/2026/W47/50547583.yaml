  author: jotux
  text: 'Another story:<p>PO came to me and asked if our card would work on their
    plane. We ship them a prototype and it doesn&#x27;t work. They ship it back and
    send along a card that does work in the plane. We test it, and the card is just
    faster. We get the designer of the data box (works at the prime) on the phone
    and talk to him. Explain that our card works within timing specs but isn&#x27;t
    working in the plane reader. He says something along these lines: &quot;Oh, our
    reader implements the communication specification just fine, but only for fast
    cards. When we designed the box we wanted to hit a certain read&#x2F;write speed,
    so we went out and bought a bunch and found the fastest cards and wrote our VHDL
    to talk to those cards.&quot; After we collected our jaws from the floor we updated
    our card to run a little faster and it started working. They had a lot of trouble
    finding commercial cards that worked.<p>And another:<p>One of the hardest parts
    to find for a PCMCIA card is stamped sheet metal cases. When we made prototypes,
    we bought case kits where the PCB just dropped in if you followed the PCB outline
    and used the right 68 pin connector. Around 2020 the companies that made them
    started to discontinue them, sent out a notice to offer final production batch
    ordering to do final lifetime buys. I BEGGED a bunch of groups to go order a few
    thousand, or tens of thousands and just put them in a closet somewhere (they were
    like $9&#x2F;each). No one could make the decision in time, they went obsolete.
    We ended up designing a new machined aluminum case with super tight tolerances
    and features and it was like 80% of the total $500 cost.'
  score: 0
