  author: t0mas88
  text: 'I have no experience with military aircraft, but on light business jets a
    similar setup is used for navigation data and terrain etc. You either have a normal
    SD card or a normal USB thumb drive to plug in. The vendor will of course sell
    you one with a 1000% price mark up, but they&#x27;re just normal SD cards &#x2F;
    thumb drives.<p>The reason is that there is a global cycle of updates, every 28
    days everyone switches to the new data. You need to load it into the computer
    before the effective date. See here: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Aeronautical_Information_Publication#AIRAC_effective_dates_(28-day_cycle)"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Aeronautical_Information_Publi...</a><p>Most
    systems I know will copy the critical navigation data into their internal storage,
    but the SD card can still be used for some things. These systems are designed
    and certified with graceful degradation in mind and for important things there
    will be a procedure or checklist to follow in case of degradation.<p>Something
    like &quot;Terrain warning system failed&quot; could show up if that data came
    from the SD card. You can keep flying with that, but you may not be allowed to
    start a flight if it happens before departure. Whether it&#x27;s allowed or not
    is documented by the plane manufacturer and operator procedures.'
