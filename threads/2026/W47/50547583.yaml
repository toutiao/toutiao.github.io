  author: jotux
  text: 'I think large businesses are pretty universal in advocating that regulation
    change (increase or reduction) in their favor.<p>In a previous (but different
    job from discussed here) I worked at a large company that had had a stringent
    regulatory body with a &quot;Industry-Wide Standards Board.&quot; The board had
    representatives from companies, including the one I worked for. They would regularly
    create internal efforts to capture regulation.<p>Example: They internally added
    requirements to all of their products that all communications on all data busses
    must be encrypted with a best-practices encryption standard. It took about a year
    of development to complete, and as soon as they were done they went to the board
    and demanded this critical security infrastructure be a requirement for all devices
    seeking certification. It was approved, and every other company had to start work
    to comply with it. It basically created a technical floor that small companies
    could never hope to reach.'
