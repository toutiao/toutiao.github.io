  author: jotux
  text: 'Yes, 100% agree. Another common problem we saw was that most major systems
    were owned by one specific contractor. Lockheed owns f-22, Boeing owns f-15, etc.
    Oftentimes there was some requirement to use the process as defined and delivered
    from the contractor. Want to update a document to remove step 7 from the data
    loading process? Welp, you&#x27;ll need to get them on contract to update the
    document, verify it, regenerated documentation, train users to stop doing step
    7, and reissue to the PO. That will only be $1.5M.<p>I&#x27;m not saying it&#x27;s
    bad that these processes are in place, they make sense for systems this large,
    expensive, complicated and important. But there once was a time where government
    employees owned a bunch of this and when there was a problem they could just go
    fix it. That has been eroded, and prime contractor dependency has been enshrined
    in the way we purchase and maintain these systems with the sole intent of giving
    more money to those contractors.<p>Pure regulatory capture: <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Regulatory_capture"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Regulatory_capture</a>'
