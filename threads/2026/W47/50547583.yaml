  author: stackghost
  text: Airworthiness-adjacent regulations are deliberately hard and bureaucratic
    to change, specifically to prevent techbros from &quot;moving fast and breaking
    things&quot; with safety-critical stuff they know nothing about.  This is considered
    a feature, not a bug.  The powers that be would rather waste millions of dollars
    than let a cavalier change slip through and cause a fatal accident.<p>As a casualty
    of this, changing parts in any material way often requires a full design review
    of the change, and for large defence programs like the F-22 this process can be
    prohibitive.
