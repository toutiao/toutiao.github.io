  author: bityard
  text: You&#x27;d be _amazed_ at the red tape and expense required to modernize any
    part of a military aircraft maintenance system. You have to understand, when the
    US military orders a new plane, they don&#x27;t buy only the plane. They buy the
    blueprints, parts manifest, pilot training curriculum, maintenance manuals, maintenance
    equipment, etc... literally just about everything except the manufacturing facility
    where they are built. Each aircraft is its own big program with tens of thousands
    of people employed by it at any given time. Changing even one small piece of it
    is a monumental undertaking.<p>Circa 2000, I worked in an avionics shop that serviced
    (among others) MH-53J helicopter navigation and autopilot systems. The test bench
    for this system was about 20-feet long end-to-end and was driven by a rack-mount
    IBM PC with an 8086 running MS-DOS. Storage was a 5MB (or so) pre-IDE hard drive
    with its own controller. These were... not reliable. And since we were a training
    base, getting new ones was just about impossible. When the drive died, much of
    the test bench was useless. I wanted so bad to swap out that drive with some kind
    of ISA-&gt;CompactFlash adapter, but _any_ unauthorized modifications to a test
    bench or procedure were strictly illegal, even if you knew what you&#x27;re doing.
  score: 0
