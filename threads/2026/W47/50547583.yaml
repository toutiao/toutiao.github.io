  author: Animats
  text: "The F-16 also uses PCMCIA cards.<p>It&#x27;s the right size for the job.
    It&#x27;s small enough to be easily carried around, and big enough that it can
    be handled while wearing heavy gloves.\nThey&#x27;re big enough to have labels
    on them. \nThe drive encloses and supports a PCMCIA card on five sides, and locks
    it into place, so it stays seated while fighter planes do fighter plane things.<p>PCMCIA
    cards were an excellent choice for military purposes.\nMicroSD cards are too tiny
    to handle with gloves or outdoors.\nIn this application, you want a visible label
    on the device, since the card contains mission specific data and there are other
    similar cards around.\nUSB drives supported only by their own connector are not
    well supported against G loads and vibration.<p>So they had a great solution.
    It just became obsolete because everybody wanted tiny laptops and phones."
