  author: jotux
  text: 'Cool coincidence. In a past job, I specifically made replacement PCMCIA cards
    for these (and other) planes. Instead of making cards with a controller and onboard
    storage, we made cards with an FPGA&#x2F;microcontroller and a microSD card soldered
    to the PCB. We did this specifically because these aircraft use (at least partially)
    broken implementations of the PCMCIA protocol, and we&#x27;d update the bus protocol
    per aircraft to work around the limitations. None of these planes can just go
    buy stuff off the street because some large portion just doesn&#x27;t work because
    their protocol isn&#x27;t fully implemented and isn&#x27;t flexible to deal with
    variance in timing&#x2F;speed&#x2F;etc.<p>A fun story: Our cards had whatever
    industrial-spec microSD card we could find (16GB, 32GB, etc.), and we&#x27;d internally
    limit the disk size to whatever the platform needed. Almost every aircraft had
    some specific number of MB they wanted because all of their CONOPS listed it,
    and they didn&#x27;t want to update documentation or software to put a different
    number there. We had a plane that could only use EXACTLY 128MB, but they were
    currently using 256MB cards and partitioning them to 128MB. We updated the disk
    size to present as 128MB so they could skip this step, and they specifically told
    us to put it back to 256MB because they didn&#x27;t want to update the commissioning
    process to remove the partitioning step.<p>It was rewarding work, and the card
    we designed was cheap (~$500 each, which is literally nothing for major platforms
    like this) and 100% US-designed and made (with the exception of ICs manufactured
    in the usual places). Still, the procedural and cultural practices of these program
    offices made it a real struggle to get traction and deploy them widely. Government
    acquisition is just generally designed around funding primes for current development
    and then paying through the nose for sustainment later. It was hard to design
    something for widespread sustainment use because by the time you were done and
    ready for production, a bunch of parts would be obsolete. Then you&#x27;d have
    to rev the design over and over. We were never allowed to stockpile anything,
    even if it was trivially cheap, to facilitate production later.'
