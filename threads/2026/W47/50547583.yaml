  author: burningChrome
  text: Heard a rather long conversation on some podcast about how govt used to have
    this capability of building really amazing things like the Hoover Dam and the
    Empire State Building and said with all the government regulation, we are just
    hamstrung from having that ability to build something amazing within budget and
    on time any more. They repeatedly cited the CA High Speed rail line, the Honolulu
    Rail Transit  and even the VA Electronic Health Record Modernization project.<p>I
    can see their point, but comparing projects in the 1930&#x27;s to those in 2026
    seems a bit dishonest. The lack of work safety equipment and rules back then allowed
    these projects to move fast, ignore safety and build both the Hoover Dam and Empire
    State building in record time. They were not without casualties because of this.
    Even OSHA wasn&#x27;t founded until the 1970&#x27;s.<p>I wonder if there will
    ever be a good balance; or if the amount of regulation has permanently hamstrung
    large scale software and engineering projects from getting done on time and on
    budget.
