  author: inamberclad
  text: Cool coincidence, since I&#x27;m writing a storage driver for an airplane
    at the moment! Software reuse is very difficult in aerospace since the hardware
    and software were both qualified in a very specific combination, in the context
    of an aircraft program, and any change or adaptation is a huge effort.<p>That
    means lots of &#x27;clean sheet&#x27; driver rewrites from a spec document for
    your specific environment and hardware, and lots of hand rolled drivers that work
    well enough, but not great, because the burden of certification is too much to
    justify incorporating fancy features, like driver interrupts or multiple speeds.
    Just hard-code exactly the settings you need for your project, you&#x27;ll save
    weeks of extra V&amp;V effort.
