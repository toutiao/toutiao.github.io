  author: jotux
  text: Without going into a ton of detail, I was working as a federal employee for
    a federal laboratory. Per regulation we couldn&#x27;t purchase anything not directly
    tied to an agreement, and we weren&#x27;t allowed to complete with industry.<p>Typical
    work would look like this:<p>A group would come to us and say, &quot;We use these
    cards, but they wear out and we need like 200 more to keep running for 15 more
    years, we talked to primes about fixing this problem for us but they said the
    only thing they&#x27;re willing to do is redesign the entire data handling infrastructure
    in the plane for $500M.&quot; So we&#x27;d get some tiny amount of money (like
    $200k) and redesign the card and make them ~20 prototypes. It&#x27;d work great,
    then they&#x27;d spend 3 years working on production contracts to try to get 200
    built for $100k. In 3 years, some part would go obsolete, they&#x27;d come back
    and give us $50k to update the design and test, then start the 3 years cycle to
    buy 200 again. Rinse and repeat.<p>If they would have just given us like $30k,
    we already knew which parts were high risk of going obsolete, we could have just
    bought everything necessary to build 1000 units and dropped them in storage, but
    federal regulation limited what was possible. SUPER frustrating to have something
    that solves a problem and watch it fall apart over crappy policy.<p>It&#x27;s
    sad to see this request, knowing that I was part of the team that designed a solution
    specifically to solve it, knowing it worked and tested it on the platform, but
    some part probably went obsolete and they never got enough manufactured to solve
    the problem permanently.
  score: 0
