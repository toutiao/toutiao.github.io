  author: jotux
  text: 'It&#x27;s a complicated morass of regulations in the FAR.<p>Color of money:
    We typically had RDT&amp;E funds that were specifically for research and development.
    We couldn&#x27;t use those funds to buy components for procurement or operations
    and maintenance items.<p>Speculative stockpiling: It&#x27;s just explicitly banned
    in the FAR.<p>Another big problem was the FAR is a gigantic mess of regulation
    that no one fully understands and it&#x27;s interpreted differently by every agency.
    Sometimes the agency is casual with interpretations and will let you do certain
    things, sometimes they&#x27;re terrified of getting anything wrong and ultra conservative.
    Because it&#x27;s so large you can generally find regulations and clauses to support
    acceptance AND denial for a lot of actions. More often than not the only thing
    procurement people cared about was CYA, and they could always find something in
    the FAR that justified denial.'
