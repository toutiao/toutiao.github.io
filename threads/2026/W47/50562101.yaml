  author: strenholme
  text: I actually turned off bug reports for my open source project, after some loser
    got abusive with me because I told him “that’s not a bug report, that’s a support
    request, and I won’t support you”.<p>The problem with bug reports is that the
    majority of them are feature requests.  Or they are support requests.  Very rarely
    are they actual bug reports.<p>So, I turned off bug reports.<p>The way I handled
    them before the age of bug tickets was to have a mailing list, and to tell people
    who emailed me privately to instead send an email to the list if they wanted support.  This
    way, the community as a whole could either support the person, or we could have
    a discussion about why I wasn’t going to implement their favorite pet feature
    “for fun and for free”.<p>Right now, in the age of AI-automated attacks based
    on 0-days, developers need to pause adding new features and make anything Internet-facing
    as secure as possible (I’m very lucky my little open source project has never
    had a remote code execution bug).
