       R2XXX D1R2X D1R4X L4XXX D1R4X L4XXX D1L1X R2XXX FL4XX FL2XX
       D1R5X U1R5X U1XXX U1XXX U2R4X R2XXX FL1XX FU1R4 U1R4X FU1L2
       U1R5X L3XXX FU1L4 L4XXX FU1R1 L4XXX U2L3X U1L4X FU1R1 L4XXX</code></pre>
