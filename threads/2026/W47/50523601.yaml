  author: donalhunt
  text: Results of Targeted Cryptanalysis<p>• Kasiski &amp; Periodicity Checks. Repeated
    letter sequences appear at exact intervals divisible by 20 and 100—most notably
    UNID WMQB (8 letters) separated by 200 characters, LCMH separated by 100 characters,
    and ZHHX separated by 20 characters. Despite these exact block-aligned distances,
    testing periodic polyalphabetic keys (Vigenère, Beaufort, and Variant Beaufort)
    up to length 150 produces no readable plaintext.<p>• Autokey Brute-Force. Testing
    all 1-letter and 2-letter primers across standard Vigenère, Beaufort, and Variant
    Beaufort autokey modes—as well as ciphertext-autokey shifts up to length 20—yields
    zero valid English matches.<p>• Digraph &amp; Polybius Square Elimination. The
    letter J appears 25 times (nearly uniform with the 19.2-letter average) alongside
    double-letter digraphs like WW, which rules out standard 5×5 grid ciphers such
    as Playfair, Bifid, and Four-Square.<p>• Transposition Elimination. Because the
    overall Index of Coincidence (0.0388) is flat across all 26 letters (M and W peak
    at 29 occurrences while F is lowest at 10), pure transposition ciphers (Columnar,
    Rail Fence, Route) are mathematically ruled out.
