  text: I had the same idea, but due to UDLR being used and also LR having values
    larger than 2 it already means that the turtle is likely not orientation-aware
    and instead moves in cardinal directions.<p>The F flag for some commands could
    indicate to start&#x2F;stop drawing.<p>There is also a singular 0 command which
    could indicate return to the origin.<p>This makes a lot of sense but everything
    I tried plotting looks pretty random.<p>There is also almost no closed loops (such
    that F could mean &quot;flood-fill this polygon&quot;). If it just means &quot;fill
    this pixel&quot; you just get 7 pretty random pixels.<p>If you assume an infinite
    canvas, no lines are drawn left to the origin, but the lines go above and below
    the origin. One could assume a fixed grid with the origin in a corner and wrapping
    on top&#x2F;bottom but I also did not find anything there when trying multiple
    layouts. Using a fixed square size and wrapping horizontally and vertically also
    seem to create uninteresting pictures no matter which corner you start in.<p>It
    also doesn&#x27;t seem to yield datamatrix or similar codes, so that&#x27;s also
    not it.
