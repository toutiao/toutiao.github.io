  author: kinduff
  text: This is a hallucination. This assumes plain Vigenère.<p>Three layers do decode:<p>1.
    In each 4-letter group the first letter is a random start. Successive differences
    mod 26 give three base-26 digits, a number V. V&gt;&gt;7 and V&amp;127 are two
    printable ASCII chars.<p>2. The resulting 250 chars are Z85, 50 five-char tokens.<p>3.
    That gives 50 uint32s, 41 distinct, all valid Unix times from 1998-05-12 to 2021-01-17,
    in bursts seconds apart. Which is a trap.
