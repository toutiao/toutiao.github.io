    like &quot;as it was desired to show&quot;? The Italian isn&#x27;t a relative
    clause, but the meaning looks basically the same.<p>The <i>Spanish</i> appears
    to mean something more like &quot;and now, it is shown&quot;, which is a completely
    different meaning expressed with unrelated words that happen to start with the
    same letters. (Spanish still has direct equivalents of all three Latin words²,
    but I don&#x27;t think <i>que era demostrando</i> even means anything.)<p>¹ In
    an English proof, you might see something like this:<p>&quot;We can then see that
    a = b &lt; c = d ≤ e, and therefore a &lt; e, which is <i>what we wanted to prove</i>.&quot;<p>QED
    stands for the &quot;what we wanted to prove&quot; part of that, except that there
    is no <i>we</i>; in the Latin, we simply make reference to the fact that something
    was supposed to be proven.<p>² Sticklers might argue that Spanish has lost Latin&#x27;s
    <i>quod</i> and replaced it with what is really a descendant of <i>quid</i>. They
    are almost the same word; <i>quid</i> is an interrogative form.
