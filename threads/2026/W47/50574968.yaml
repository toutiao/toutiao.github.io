  author: kypro
  text: If value here is a measure of utility, its not super useful on its own that
    something that was almost universally assumed to be true is now known to be true.<p>But
    with a problem as difficult and fundamental as the Riemann Hypothesis the thought
    has always been that in the process of solving it we&#x27;d be likely to develop
    or discover something that did have real world utility. At least this is often
    what happened in the past, the obvious example here being Newton developing calculus,
    a field of mathematics which can be applied to other problems beyond the narrow
    set of problems he was trying to solve.<p>What I find interesting about this,
    if the claim holds up, is whether this will assumption will remain true, or if
    the value of these AI proofs is going to significantly lower than those of human
    discoveries in the past.<p>Maybe a good analogy here is to think about how all
    of tools we humans have created has been ultimately in the pursuit of solving
    some problem. For the developers here, consider this – if ChatGPT had existed
    before React, would React ever have been developed? I mean, if an LLM can brute
    force the same result with just vanilla JS the need to develop frameworks and
    libraries to solve what was once difficult for a human to solve drops.<p>I&#x27;ll
    note that I&#x27;m playing devils advocate here as I think AIs would probably
    build something better than React had it not existed, but it&#x27;s something
    to think about at least. I suspect there&#x27;s a higher probability than some
    here are assigning that this proof ultimately ends up have relatively little utility.
