  author: keeda
  text: In broader context the “being nice” part seems like both of them talking past
    each other.<p>What happened was the two researchers, Buckmaster and Alpoge (from
    TFA) solved a significant subset of Navier Stokes (referenced as “Euler”) which
    set off rumors.<p>Through whatever game of Chinese Whispers ensued, OpenAI thought
    they had solved the full Navier Stokes problem, which they hadn’t. So OpenAI pointed
    their latest unreleased model at it, and it actually solved the full problem!!<p>Pure
    George Danzig vibes on that one.<p>So when this meeting happened, the OpenAI folks
    were surprised that these researchers had NOT solved the full problem, only the
    subset. Yet from their perspective, they were offering them credit for the full
    problem, and so “we’re being nice.” The Anthropic employee (Alpoge) was clearly
    an optics issue and so they felt they didn’t have to be <i>that</i> nice.<p>But
    the other researcher, Buckmaster, was suspicious that their work had been stolen,
    and so was understandably in a combative mood. You can see that from his perspective
    they were not being “nice”, they were trying to scoop them, possibly on stolen
    work, and then bribe them with shared credit.<p>But they had <i>not</i> solved
    the full problem, and academic plagiarism is a very serious allegation that can
    ruin careers of both the accused and the accuser. So from OpenAI’s perspective
    it was like, why would you accuse <i>us</i> of plagiarism when <i>you</i> yourself
    have not solved the full problem and when we’re willing to share undue credit
    for it??<p>This was made worse by the fact that OpenAI would not categorically
    deny if the others’ work had been used for training until much much later. This
    was terrible optics, but anyone who’s dealt with large scale data pipelines compounded
    by privacy issues knows that it gets very difficult to trace these things, so
    it takes time to make a definitive statement.<p>Alpoge somehow seemed less troubled
    by this whole episode, but I guess it’s because not only was he gonna be a multi-millionaire
    soon, he had Riemann stewing on his backburner.<p>I feel like when they finally
    make a movie out of all this, this scene would end up being a bit of comic relief.
