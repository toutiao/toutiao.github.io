  author: hgoel
  text: 'I&#x27;m not an expert in this area either, so I too will be waiting for
    experts to review things, but I will remain skeptical until then.<p>After the
    excitement of the Navier-Stokes solution, only for it to eventually seem to not
    really solve the full problem and leaving discourse about the problem in a very
    muddy state, I&#x27;d rather wait and see if it turns out this proof also makes
    some assumptions that ultimately limit its impact.<p>It is probably still some
    form of breakthrough, but I will expect it to not be as big as a full general
    proof of the Riemann Hypothesis, until proven otherwise.<p>Edit: A thought though,
    if this proof is correct and can&#x27;t be made much shorter than the current
    ~250k pages, I wonder if the result has more value as a sign that human accessible
    proofs to these kinds of hypotheses were stuck behind some mathematical abstraction&#x2F;tool
    that we haven&#x27;t quite discovered yet? Sort of like how you can brute force
    algebra with real numbers for working with AC circuits, but it&#x27;s pretty ugly
    and painful compared to using phasors. If so, maybe the real contribution from
    AI-driven high profile proofs would come from mathematicians studying the proofs
    and devising tools to make them more accessible.'
  score: 0
