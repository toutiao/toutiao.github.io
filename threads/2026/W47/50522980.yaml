  author: BeetleB
  text: <i>Any</i> institution that receives federal grants (including student loans),
    private or public, has to conform.<p>That&#x27;s Section 504 (overlaps with Title
    II). See <a href="https:&#x2F;&#x2F;www.ed.gov&#x2F;laws-and-policy&#x2F;civil-rights-laws&#x2F;disability-discrimination&#x2F;frequently-asked-questions-disability-discrimination"
    rel="nofollow">https:&#x2F;&#x2F;www.ed.gov&#x2F;laws-and-policy&#x2F;civil-rights-laws&#x2F;disabil...</a><p>&gt;
    Section 504 is a federal law that prohibits any entity that receives federal financial
    assistance (such as grants or student loans) from discriminating against persons
    with disabilities.<p>&gt; Title II of the Americans with Disabilities Act is a
    federal law that prohibits state and local governments (such as public school
    districts, public colleges and universities, and public libraries) from discriminating
    against persons with disabilities.<p>&gt; In general, Section 504 and Title II
    nondiscrimination standards are the same, and in general, actions that violate
    Section 504 also violate Title II. However, where Title II requirements exceed
    Section 504 requirements, public school districts, colleges and universities,
    and libraries must also comply with the Title II requirements.<p>I worked part
    time for over a year for the disability division of my university. My boss&#x27;s
    job was to assist professors in conforming when they provided online material
    (web sites, PDFs, etc), and also to ensure 3rd party providers (e.g. Blackboard)
    are in compliance. Nagging professors about this was part of his job.<p>He and
    his team worked with other universities and industry to come up with accessibility
    stuff for new technologies used in education.<p>This isn&#x27;t limited to education
    either. If you&#x27;re a private company receiving federal grants for research,
    you have to conform. Back in the late 00&#x27;s, they had a whole accessibility
    themed PyCon where this point was being hammered home (i.e. people coding in Django,
    etc need to be aware of web accessibility if they ever want government money).
