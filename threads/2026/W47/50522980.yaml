  author: pcompeau
  text: 'Hi! I&#x27;m Phillip Compeau, I teach in Carnegie Mellon&#x27;s Griffin School
    of Computer Science, and I run CS Learn, which launched today.<p>We&#x27;re releasing
    full semesters of lectures from current CMU computer science courses across a
    variety of topics, with one course premiering each day this week. More courses
    come in January.<p>Yes, MIT got here 25 years ago :). What I&#x27;m excited about
    is how we&#x27;re doing it: a few of our students built tools that automate a
    lot of the production work, so a small team can get a course out quickly and still
    have people review every lecture.<p>We&#x27;ll have lots more coming across a
    wide array of subjects. I&#x27;d love to know if there are topics you would like
    to see us cover!'
