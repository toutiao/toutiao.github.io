  content: "# [My Monitor Was Cutting My Download Speed by 75%](https://blog.tymscar.com/posts/studiodisplayethernet/)\n\nOscar
    Molnar8 min read (1684 words)\n#[networking](https://blog.tymscar.com/tags/networking/)&nbsp;
    #[debugging](https://blog.tymscar.com/tags/debugging/)&nbsp; #[apple](https://blog.tymscar.com/tags/apple/)&nbsp;
    #[macOS](https://blog.tymscar.com/tags/macos/)&nbsp; #[usb](https://blog.tymscar.com/tags/usb/)&nbsp;
    #[unifi](https://blog.tymscar.com/tags/unifi/)&nbsp;\n\nSomehow I am one of those
    few very lucky people to have the opportunity of owning a 2.5 gig symmetrical
    line for my internet. But one day, when I wanted to brag to my equally nerdy friends,
    shock and horror: 600 Mbps down? Luckily my upload speed was still 2.4 Gbps, so
    I didn’t lose all my bragging rights, but that’s weird, right? If anything, you’d
    expect the opposite!\n\n ![fast.com showing 622 Mbps download and 2.4 Gbps upload](/studio-display-ethernet/fast-com.png)\n\nMy
    ISP is pretty cool. It’s run by this one guy (Hey Keith!), and I know I can always
    message them and they respond promptly, as they did this time. We tried to run
    through a few debugging steps, they checked on their end, and everything was normal.
    I tried my work laptop too, same speed.\n\nI didn’t have time for debugging, because
    I needed to travel 2000 km to the other side of the continent for a family emergency.\n\n
    ![Map of Europe showing the route from the UK to Romania](/studio-display-ethernet/map.jpg)\n\nBut
    as soon as I got back, I got curious again. What could it be? In retrospect, I
    now know when it started: when I moved all my connections onto my [Studio Display
    XDR](/posts/studiodisplayxdr/). I wanted to have a one-cable setup, and the monitor
    offered me that. I’ve had it for half a year now, and I don’t think I’ve ever
    run a speed test through it. 600 Mbps was more than fast enough for me to never
    realise I wasn’t getting three quarters of the speed I was paying for \U0001F926\n\n##
    The setup[#](#the-setup)\n\n- MacBook Pro M3 Pro\n- 2026 Studio Display XDR, with
    everything plugged into it so switching laptops is one cable\n- UGREEN USB-C to
    2.5G Ethernet adapter, plugged into the display\n- UniFi Dream Router 7, the same
    one from my [WiFi 7 debugging post](/posts/wifi7speedhunt/)\n\n## What I thought
    was interesting[#](#what-i-thought-was-interesting)\n\nPings to other wired computers
    during a download would fail 10% of the time over Ethernet through the adapter
    plugged into my screen, and 0% of the time over Wi-Fi. What made it stranger was
    that there were no dropped frame errors in macOS’s logs at all. This was the big
    hint for me: the adapter was dropping them before the computer could know.\n\nI
    then plugged the adapter straight into my Mac instead of the monitor, and ran
    an iperf3 server on my UDR 7: 2.3 Gbps. So the cable, the router and the adapter
    are all fine? What about fast.com? Perfect speeds there too! 2.2 down and 2.3
    up when connected straight in. As soon as I connected it to the display, it was
    back to 600 down again.\n\nSo it’s the display, right? Well, I would find out:
    sort of yes, sort of no, which is why I wanted to write this blog post. I couldn’t
    find anything online explaining the exact cause, and it’s quite a cool reason.\n\n##
    The driver and flow control[#](#the-driver-and-flow-control)\n\nThe adapter uses
    a Realtek RTL8156B, which on macOS binds to Apple’s generic USB networking driver.
    But Realtek ship [their own driver on their website](https://www.realtek.com/Download/List?cate_id=585),
    so I thought I’d give that a go! I installed it and, to my surprise, it almost
    doubled the download speed to 1.1 Gbps, but that was still nowhere close to 2.5.
    First hint that it couldn’t just be the monitor’s fault.\n\nThen I tried [flow
    control](https://en.wikipedia.org/wiki/Ethernet_flow_control). I had never truly
    looked into this before, and I think it’s quite neat to know about if you were
    also ignorant of it like me. Basically, when a device receives Ethernet frames
    it can’t keep up with, it just drops them. With flow control (it’s something your
    router or switch has to support), it can send the sender a “pause” frame, and
    the sender then buffers the data on its side, instead of the receiver (the adapter
    in this case) on its side. I turned it on in my UniFi console and guess what,
    download jumped to around 2 Gbps, with upload still at full speed! Yay! Well,
    not so fast&mldr;\n\nI don’t like it always being on, because it can add latency
    to other systems like my gaming PC. Can you work around it? For sure, you can
    disable it on those computers, but it’s janky, and it’s another thing I need to
    remember when my [Sauerbraten](http://sauerbraten.org/) game starts lagging. I
    need fewer things to remember, considering I am 30 in a couple of months. My memory
    is not what it used to be.\n\n## But the upload was always fine[#](#but-the-upload-was-always-fine)\n\nYeah,
    isn’t that weird? First of all, it looks like the port can indeed do 2.5 in both
    directions. I already knew that, because I get much more than that from my external
    SSD through the monitor’s Thunderbolt port. So the issue is not the monitor again?
    But it has to be!\n\nWell, I had another idea. How about I connect to my Linux
    box, which is also on 2.5, and send perfectly smooth UDP traffic at a fixed rate
    with flow control off? Then I can check the chip’s own counter of dropped frames:\n\n|
    Sent | Lost behind the display | Frames/s reaching the Mac behind the display
    | Lost direct on the Mac |\n| --- | --- | --- | --- |\n| 1.46 Gbps | 0% | 123,800
    | 0% |\n| 1.75 Gbps | 0.05% | 148,600 | 0% |\n| 1.94 Gbps | 0.1% | 165,000 | 0%
    |\n| 2.03 Gbps | 2.7% | 168,000 | 0% |\n| 2.12 Gbps | 7.2% | 168,000 | 0% |\n|
    2.20 Gbps | 10.5% | 168,000 | 0.001% |\n| 2.28 Gbps | 13.5% | 168,000 | 0.02%
    |\n\nSo basically no drops whatsoever when connected straight to my Mac, but loads
    of drops after about 168k frames per second (roughly 2 Gbps). Remember that number.
    That number comes from the adapter’s own counters: however much I sent, the number
    of frames it managed to hand over to the Mac each second flattened out at about
    168,000, and everything above that was dropped.\n\nWhy did this not happen on
    my SSD? What was the only difference I could find? Bursts!\n\nWhen the Mac reads
    data from a USB 3 device, the device sends some packets, then has to wait for
    the Mac to say “lgtm, send more!”. The SSD enclosure sends 16 packets before needing
    a go-ahead message back. The RTL8156B in my Ethernet adapter sends 4.\n\nHere
    is a diagram of my best understanding of why this is an issue. I made this diagram
    100 times, and I think I can probably improve it more, but if it helps you understand
    the issue, I have done my job.\n\n![How the old adapter dropped frames behind
    the display](/studio-display-ethernet/bottleneck.svg)\n\nAs you can see, the speed
    of packets coming into the adapter is 2.5 Gbps. That’s what the router pushes
    in. The speed going out is around 2 Gbps. The reason is that if you add up the
    average time it takes to get the go-ahead through my monitor’s hub, which is around
    7.6 µs, to the average time it takes to send 4 KB, around 8.2 µs, you can find
    what the maximum speed is.\n\nWell, if the speed of the drain from my adapter
    to my Mac is half a gig slower than the speed of the input, then you can imagine
    the buffer getting filled more and more until it overflows. Those are dropped
    packets, which result in a hard backoff when the router resends them, so you drop
    loads in speed. And that’s the reason for all of this.\n\n## OK, well, what now?[#](#ok-well-what-now)\n\nI
    have a cupboard full of USB-C Ethernet adapters. Don’t ask.\n\n ![A pile of USB-C
    Ethernet adapters](/studio-display-ethernet/adapters.jpg)\n\nThe problem is they’re
    all 1 gig adapters, so any of the tests I made would not tell me anything, because
    the issues don’t start at 1 gig. They start at around 2&mldr; If I run my 2.5
    gig adapter at 1 gig speeds, I get 1 gig downloads with the official driver. If
    I run it at 1.5, I get 1.5. If I run it at 2, well, I"
