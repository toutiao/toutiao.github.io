  author: buybackoff
  text: For C# as is, what I really would appreciate is a frozen GC mode. Not zero
    GC, similar to Epsilon GC in Java. After initial state loading and forced GC,
    I would like to be able to apply a SustainedNoGC mode, that just does not even
    try to collect, no scanning, no pauses at all, it can only allocate. And notifications
    (an event) after some X bytes allocated, or just a reliable way to monitor the
    allocated size. The existing modes such as SustainedLowLatency or NoGCRegion are
    good but not enough. For some low latency workloads it&#x27;s OK to allocate many
    GBs and then pause explicitly.<p>Random forced pauses are the only problem that
    comes from GC, otherwise it&#x27;s great for throughput and just a nice feature,
    as a sibling comment says. No GC languages do not make code magically faster,
