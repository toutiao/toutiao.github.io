  text: The (Tracing) Garbage Collector abstraction isn&#x27;t really designed to
    be controlled though. You can understand the implementation and write code against
    that, but at that point, why not switch to something that you can genuinely control?<p>I&#x27;m
    not saying manage memory manually. You can switch to a language that is reference
    counted. Then at least that abstraction guarantees deterministic deallocation.<p>That
    comes with another set of trade-offs such as having to pay attention to atomic
    reference counts, making sure there&#x27;s no cycles, maybe even treating some
    graphs as arenas to avoid chained deallocations, but the abstraction itself is
    designed to be deterministic and is more easily controlled.
