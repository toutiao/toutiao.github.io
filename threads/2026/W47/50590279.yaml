  author: jaen
  text: Smart pointers ie. reference counting are a (not very good) form of GC...<p>Especially
    in multi-threaded settings, smart pointers perform poorly (compared to GC) due
    to requiring atomics on hot paths, and the alternative (epochs, hazard pointers,
    RCU) is <i>orders of magnitude</i> more complicated to get exactly right than
    just using GC.<p>This also explains why historically the most interesting concurrent
    data structures were first implemented in Java, not C++.<p>eg. Java got a <i>decent</i>
    concurrent hash table WAY before anything else - in 2003 vs. the 2006 initial
    release of Intel TBB, and the performance was not as good for all use cases. C++
    performance did not catch up until ~2017 with the release of folly::ConcurrentHashMap!
