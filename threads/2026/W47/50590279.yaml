  text: Don&#x27;t fall for the illusion that manual memory is the pinnacle of control.
    Because raw pointers cannot be moved, you can end up with a lot of external fragmentation
    - i.e. holes between your allocations. Also, the bookkeeping cost of malloc()
    and free() are not free, which also means that the latency of calling those functions
    is unpredictable. There&#x27;s a reason why embedded developers are very hesitant
    to use malloc()&#x2F;free() for hard real-time programs with time and memory constraints.<p>And
    at least with GC, you are guaranteed to surrender the possibility of double-free
    and use-after-free.
