    RFC822 has been obsoleted by RFC5322 which is much better ;-).
    Jokes aside, as cryptic as these specifications can sometimes be, I think it is quite remarkable that it is feasible to implement them today with few resources (we're not a big company or anything), with a modern design and implementation techniques, and this way be compatible with billions of devices, decades of emails, and an ecosystem used day-to-day all around the globe.
