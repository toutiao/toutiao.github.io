  text: |-
    The authors explain that the Dovecot testsuite helped them implement their own program. I wonder if their own efforts could in turn generate a cross-implementation testsuite that would be shared with other authors of email clients. This is tricky because the fuzzing effort concentrates on their internal AST structure for email (that it can be printed and reparsed correctly), and different implementations will use different internal ASTs for emails.
    Ideally there would exist a sort of standard/conventional format for "structured email addresses" that is an easy-to-parse sort of AST for email, independent of a specific library's implementation. Then the authors (or really anyone) could use their fuzzing testsuite to generate streams of (parsed email, structured email) pairs, that could be used for testing by any author of an email library -- assuming they have a parser from structured emails to their own internal AST.
