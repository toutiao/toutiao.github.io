  author: dannyw
  text: A Microsoft Azure page briefly claimed Sol runs with less looped transformer
    passes; and so you could speculate that Sol and Astra might share weights; but
    have different “loop” factors.<p>That would make a lot of sense from an inference
    optimisation perspective. The same prefill and decode machines can hold one set
    of weights, and serve both Astra and Sol requests.<p>At (multi-)terabyte-scale
    model weights, and when you have to offer not just the latest like Fable 5.2 but
    still serve 5.1, 5.0, etc; heck I think Opus 4.6 is still around; you really care
    about overall compute utilisation.<p>Idle GPUs are wasted GPUs; and even over
    the fastest interlinks you’re not hotswapping multi terabytes of weights.<p>With
    MoEs, there’s probably stuff you can play around with varying the number of active
    experts; or other clever optimisations.<p>Maybe Sonnet 5.5 could be just Opus
    5.5 with a different router and less active params? Who knows; I’m just theorycrafting
    now :)
