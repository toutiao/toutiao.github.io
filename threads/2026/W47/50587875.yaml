  author: db48x
  text: No, you’ve misunderstood. Any time the NIC signals that one or more packets
    have arrived the CPU must reply back to the NIC to give it a DMA buffer to copy
    the packet(s) into. By the time that reply arrived at the NIC it was already too
    late. The NIC could only buffer four packets and the fifth or even sixth packet
    had already arrived and been dropped. The NIC then sent the four packets it had
    to the DMA buffer and started over.<p>The monitor was not really at fault. All
    USB hubs must read USB packets on all of their ports and copy them over to the
    upstream port. Those packets must all go into a buffer first so they the hub can
    send them individually even when they arrive simultaneously. That introduced just
    enough delay to allow the NIC’s internal buffer to fill up. Any hub would have
    caused the same problem. The solution was to buy a NIC designed for a higher speed
    because it has a bigger internal buffer. That new NIC will probably have the same
    problem with USB hubs, but at 5Gbps instead of 2.5Gbps.
