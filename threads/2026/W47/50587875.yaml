  author: aaronmdjones
  text: It has nothing to do with the monitor&#x27;s support. The GP is correct; the
    fault is in the Ethernet adapter. Specifically, it doesn&#x27;t have a buffer
    large enough to sustain 2.5 Gbps when going via the monitor because the latency
    is too high. You&#x27;d have the same problem on many USB hubs and it would still
    be the Ethernet adapter&#x27;s fault. It could have used a larger buffer or it
    could send more data at a time to the host so that the buffer doesn&#x27;t fill
    up, but it doesn&#x27;t.
