    application&#x2F;tier owner would want to know. Those questions might be
    things like &quot;am I I&#x2F;O bound?&quot; or &quot;is the device I&#x27;m using being slow?&quot;.
    I wish people would realize that, rather than continue to place value in
    iowait as a metric for ANYTHING, and stop trying to work around it.<p>It sounds more like their position is &quot;iowait is a useless metric&quot; and that polling with io_uring completely breaks iowait metrics but fixing it would add a minor slowdown so they refuse to do so because they don&#x27;t think it&#x27;s a valuable metric to begin with.
