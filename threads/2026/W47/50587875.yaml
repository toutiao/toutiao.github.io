  text: "If it&#x27;s a call with a dozen people, media will flow through Meet&#x27;s
    server. Some group call servers do p2p for calls with two or three people, but
    approximately nobody does for a dozen.<p>Where I work, group call participants
    send about ~1Mbps of video, and maybe more for screen share, could be ~2Mbps.<p>So
    you&#x27;re looking at 15 Mbps inbound and 1 Mbps outbound for the call. Plus
    some overhead for congestion control. That&#x27;s not even 1% of your 2.5gbps
    connection. IIRC Meet uses higher limits, so <i>maybe</i> double it to 30 Mbps.<p>You
    don&#x27;t need gigabit for video conferencing, unless you&#x27;re running the
    conference out of your house. Or you have 20 people all on conferences. \nYou
    may want some QoS if your usage is near your bandwidth limits. Conferencing is
    sensitive to jitter and loss.<p>At my current ISP, speed is either 100M or 1G,
    so if you had 3+ people who conference simultaneously, 100M might well be limiting,
    so you would probably want 1G ... otoh, conferencing is usually bandwidth adaptive
    too, so it would still work, as long as everything plays nice with congestion."
