  author: bilegeek
  text: "&gt; tried a bunch of alternative schedulers<p>1. Have you tried enabling
    full preemption as well? I run Debian, and before I did that I had lots of stutters
    from any kind of background load thanks to dynamic preemption.<p>2. Even then,
    ZFS was causing stutters until I lowered it&#x27;s priority as well (spl_taskq_thread_priority=0)<p>3.
    On non-ZFS drives, try setting your I&#x2F;O scheduler to Kyber for NVME or BFQ
    for everything else. &quot;mq-deadline&quot; isn&#x27;t great for interactive
    use on a SATA SSD, even for non-boot drives, and even NVME sometimes stutters
    under &quot;none&quot; for some people.<p>&gt; I&#x27;m also not using swap at
    all.<p>4. zswap (combined with zstd compression, &quot;min_ttl_ms=1000&quot;,
    and &quot;vm.page-cluster=0&quot;) and &quot;defer+madvise&quot; memory compaction
    can help. (Something about the kernel really liking having swap on-hand.)<p>Steam
    runs shader compilations at batch policy and nice 19, so without RAM or I&#x2F;O
    bottlnecks even gaming shouldn&#x27;t be <i>too</i> bad (though from personal
    experience it still induces some stuttering). It&#x27;s just most distros are
    tuned horribly for this. (Not to sound flippant, I understand the frustration
