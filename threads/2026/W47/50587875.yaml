  author: nh2
  text: The article answers this<p>&quot;if the speed of the drain from my adapter
    to my Mac is half a gig slower than the speed of the input, then you can imagine
    the buffer getting filled more and more until it overflows. Those are dropped
    packets, which result in a hard backoff when the router resends them, so you drop
    loads in speed. And that’s the reason for all of this.&quot;<p>With diagram <a
    href="https:&#x2F;&#x2F;blog.tymscar.com&#x2F;studio-display-ethernet&#x2F;bottleneck.svg"
    rel="nofollow">https:&#x2F;&#x2F;blog.tymscar.com&#x2F;studio-display-ethernet&#x2F;bottleneck....</a><p>The
    monitor decides to send the adapter&#x27;s packets on at only 2 Gbit&#x2F;s, which
    leads to buffer overflow, thus packet loss, thus e.g. TCP congestion-control backoff.<p>The
    only thing we don&#x27;t know is _why_ the monitor chooses to limit the bandwidth
    to those 2.07 Gbit&#x2F;s (computed as the 4<i>1 KiB blocks per (7.6+8.2) µs).
    If it sent e.g. 8</i>1 KiB blocks, doubling the bandwidth, the problem wouldn&#x27;t
    happen.<p>That&#x27;d be between Apple and the monitor.
