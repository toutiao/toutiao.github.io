  text: 'The explanation is not that clear, but you missed the point. It is a networking
    issue known as &#x27;bandwidth-delay product&#x27;: the combination of latency
    and bandwidth is what limits the speed, and in this case the extra latency from
    the monitor hop was the culprit. Not the adapter. The faster adapter is a <i>workaround</i>.'
