  author: senko
  text: 'This reminds me of a (completely different, but felt equally) bizzare problem
    with ghostty (the terminal emulator) on Linux and Steam, specifically Baldur&#x27;s
    Gate 3.<p>At the start of the game after an update, BG3 compiles the (Vulkan)
    shaders. To avoid hammering the computer, it checks the load, including I&#x2F;O
    pressure, and then throttles itself. It turns out that Ghostty uses io_uring,
    and even if it&#x27;s not doing anything this somehow counts as pressure. This
    was made worse by the fact that I usually have a dozen or so Ghostty windows.<p>End
    result, BG3 compiles shaders using 1 core, throttled, instead of all available
    20 cores. Instead of a minute or so, it&#x27;d take several hours.<p>(For closure:
    I configured ghostty to use epoll instead. Probably not optimal but works around
    the problem.)'
