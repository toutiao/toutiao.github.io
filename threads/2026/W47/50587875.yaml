  author: swiftcoder
  text: "&gt; Even if his buffer was 100x larger<p>&quot;buffer&quot; was perhaps
    a poor choice of words on my part, because &quot;buffer&quot; is ambiguous. In
    this case I am referring to the notional &quot;transmit buffer&quot;, which is
    4 in the non-working case and raised to 8 in the working adapter.<p>&gt; &quot;I
    can see that instead of sending 4 1 KB packets per burst, it would send 8!&quot;<p>Increasing
    the number of packets in flight does not change the bandwidth, it only improves
    latency sensitivity (i.e. you can fire more data before requiring an ACK).<p>&gt;
    it seems wrong to claim it&#x27;s latency when it could also be improved by fixing
    the numerator.<p>Increasing the bandwidth without increasing the transmit buffer
    would not fix this issue. The adapter he ends up buying does both (allow 2x the
    packets in flight, and 2x the bandwidth).<p>The bottom line here is that the original
    adapter handles full duplex 2.5g when plugged into the laptop directly, and the
    SSD gets full duplex bandwidth in excess of 2.5g through the same intermediate
    link (i.e. the display), so both the adapter and the display have sufficient bandwidth.
    The added hop of latency however makes the short transmit buffer insufficient
    to cover the latency."
