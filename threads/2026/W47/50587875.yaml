  author: fancyfredbot
  text: Since lots of comments misunderstood the article, the extra latency from going
    through the monitor meant his laptop couldn&#x27;t acknowledge the packets quickly
    enough. That led a buffer on the ethernet adapter to fill and that led it to drop
    packets.<p>A different adapter which required less frequent acknowledgement fixed
    the problem for him.<p>It is quite a nice post which gets to the bottom of incredibly
    opaque behaviour of USB hubs.
