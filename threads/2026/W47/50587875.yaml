  text: No, the problem does not match the topics discussed in <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Bufferbloat"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Bufferbloat</a><p>The
    35 KiB buffer from the article is not very large, and the problem would exist
    unmodified if it was smaller.<p>As the article explains, &quot;if the speed of
    the drain from my adapter to my Mac is half a gig slower than the speed of the
    input, then you can imagine the buffer getting filled more and more until it overflows&quot;,
    and this would hold for any buffer, smaller or larger.<p>Bufferbloat causes primarily
    latency problems, not bandwidth problems.<p>Bandwidth problem would occur at most
    as secondary effects, e.g. if a packet is delayed by a buffer for so long that
    the sender-expected timeout for an ACK expires, it considers the packet lost,
    and throttles down sending. But that&#x27;s not happening here.
