  text: In traditional typography, i.e. for texts printed on paper, the reverse was
    typically used, i.e. the body text used a serif typeface, while the headings used
    a sans-serif typeface for contrast.<p>The origin of sans-serif typefaces was in
    advertising, e.g. in posters and product labels, so it was natural to adopt them
    for headings. In this context an advantage of sans-serif fonts it is that it is
    easy to change their weight, e.g. to make them bold or extra-bold, without this
    making them uglier.<p>With the passing to computer displays, which have much worse
    resolution than printed paper, this has changed, because sans-serif typefaces
    became preferred for body text, since they are less damaged by low-quality displays.<p>To
    preserve a higher contrast between body text and headings, with pages intended
    to be seen on digital displays it has become quite frequent to use this reverse
    combination, of sans-serif for the body text with a serif typeface for headings,
    which will be rendered at a higher quality even on bad displays.
