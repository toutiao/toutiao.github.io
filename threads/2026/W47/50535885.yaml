  author: rbehrends
  text: 'Yeah, there is a limit to how much you can get from capturing reasoning traces.
    (Traditional distillation of weights is not possible via the API.)<p>Patrick Toulme
    noted a while ago that the biggest advantage of that in his opinion came from
    bootstrapping the post-training process: <a href="https:&#x2F;&#x2F;xxcancel.com&#x2F;PatrickToulme&#x2F;status&#x2F;2069211575437627743"
    rel="nofollow">https:&#x2F;&#x2F;xxcancel.com&#x2F;PatrickToulme&#x2F;status&#x2F;206921157543762774...</a><p>At
    Thinking Machines, they explicitly said that they used open-weights models for
    bootstrapping post-training, including Kimi K2.5: <a href="https:&#x2F;&#x2F;thinkingmachines.ai&#x2F;news&#x2F;introducing-inkling&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;thinkingmachines.ai&#x2F;news&#x2F;introducing-inkling&#x2F;</a><p>Speaking
    of Thinking Machines, that&#x27;s another data point. Their Inkling Small 2 model
    is just a bit behind DeepSeek V4.1 Flash 1017 in benchmark, and in my tests, that
    seems to be accurate, but mostly because they used less training data for pre-training,
    so they have less of a knowledge base, while similar reasoning capabilities. (One
    of the most interesting parts of Inkling Small 2 is that their training must have
    been very cost-efficient, apparently using less, but higher quality training data.)<p>And
    we&#x27;re now seeing more and more Western near-frontier models from labs other
    than Anthropic and OpenAI to question whether distilling reasoning traces is really
    much of a difference maker.<p>Personally, my theory is that the gap is primarily
    due to Chinese labs having a harder time getting the necessary compute (especially
    top of the line GPUs) for training. These are, as far as I can tell, orders of
    magnitude differences in availability, so it wouldn&#x27;t be surprising that
    a large compute gap is reflected in capabilities (and also indirectly visible
    through model sizes).'
