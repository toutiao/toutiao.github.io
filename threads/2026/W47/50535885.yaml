  author: cmrx64
  text: "So you’ve been completely ignoring all the work on introspective awareness,
    situational awareness, training set ordering awareness (<a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2509.14223\"
    rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2509.14223</a>  &amp;
    <a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2403.09613\" rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2403.09613</a>),
    subliminal transfer (<a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2606.00995\"
    rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2606.00995</a>), workspace
    formation, learning mechanics&#x2F;theory of grokking, etc? The “objective” that
    mid and posttraining optimize is so powerful because pretraining already induced
    factorized worldmodels which have so much predictive and generative power that
    they snowball with even mild trajectory optimization (very different training
    objective than pretraining).<p><a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2602.02385\"
    rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2602.02385</a><p>(Functional)
    small-s latent self awareness is a reliable shortcut (this is a principle you
    can derive from proof theory, the metric is deductive distance and that induces
    geometric morphisms). State compression from accurate selfmodeling pays rent.<p><a
    href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2611.02047\" rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2611.02047</a><p><a
    href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2502.01954\" rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2502.01954</a><p>Phase
    transitions from statistical lookup to latent basin hopping: \n<a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2405.15071\"
    rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2405.15071</a><p>Posttraining
    finds (<a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2505.11711\" rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2505.11711</a>)
    and amplifies (<a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2504.07912\"
    rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2504.07912</a>) these
    lottery tickets.<p>The frontier moves fast, but &quot;LLMs are not self aware&quot;
    is folklore. By now the basic model-organism science explaining how and the extent
    to which this is wrong, is substantial.<p>LLMs lack reliable verbalized self knowledge,
    and constantly underestimate and undercut their own capability.\nThat&#x27;s a
    different problem.<p>The way “motor systems”  arise from simulation “perceptual
    systems”: <a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2605.25459\" rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2605.25459</a><p>And
    models know their own output distribution extremely intimately: <a href=\"https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2606.00545\"
    rel=\"nofollow\">https:&#x2F;&#x2F;arxiv.org&#x2F;abs&#x2F;2606.00545</a>.<p>The
    verbalized name tokens being an unreliable indicator is not justified by “because
    LLMs are not selfaware.”"
