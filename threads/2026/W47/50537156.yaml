  author: anamexis
  text: I think the point behind the words is that it is a <i>specific design pattern</i>
    based on building DSLs using method chaining. I don&#x27;t think pipelines, broadly,
    are an implementation of that design pattern. It&#x27;s a way to string together
    function calls in a way that they read left-to-right, yes, but the spirit of &quot;fluent
    interface&quot; is not just &quot;reads left-to-right.&quot; It&#x27;s a specific
