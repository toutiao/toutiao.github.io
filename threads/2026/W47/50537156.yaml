  author: hinkley
  text: I don&#x27;t want jQuery back, but I want something that works like it except
    in the opposite way on corner cases.<p>Now that ES and CSS5 are everywhere, the
    biggest feature of jQuery is list comprehensions on components. Data is also still
    good IMO but mostly the comprehensions.<p>jQuery decided that calling a function
    on an empty list should be a no-op, but my experience using it for a <i>very</i>
    interactive application was that nearly every time we wanted something to definitely
    happen or it was a bug, and the handful of times where an empty list was expected
    were easy to anticipate.<p>Because the general problem was that making a selector
    that continued to work correctly as features were added was a black art. Two of
    us wrote selectors that almost always worked, the rest of the team wrote ones
    that almost always broke and only very slowly onboarded our advice (also all of
    the stuff they already wrote was a ticking time bomb).<p>New features and especially
    tweaking the DOM tree to stay compatible with old corporate browsers would break
    existing functionality about a quarter of the time someone had to change the DOM
    structure to close a ticket and it was infuriating.<p>So what I want is that if
    .hide() is a no-op, throw an exception. And if I&#x27;m implementing the &#x27;select
    all&#x2F;unselect all&#x27; feature I know that the list might be empty, I can
    add a flag or wrap a conditional around it so I ignore the error.<p>Because those
    functions work on a very tight chunk of DOM that changes structure much much slower
    than the overall document structure, and also that code is quite close to the
    point of change if someone <i>does</i> change it, so has better chances of being
    remembered than something in the header.
  score: 0
