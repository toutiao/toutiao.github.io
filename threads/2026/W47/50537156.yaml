  author: moritzwarhier
  text: "Isn&#x27;t the point of a fluent interface that all functions (or methods)
    return the same interface, thus allowing for the desired chaining?<p>And obviously,
    this is a design pattern that fits when a suitable supertype exists or xan be
    easily defined.<p>Thus, void methods are already fit for pretty much the same
    interface, and everything with a return value that shouldn&#x27;t be of the type
    of that specific god-interface, doesn&#x27;t fit well into a fluent interface,
    e.g. count().<p>You can be insistent on the pattern and make count() return `this`
    instead of a number, but that&#x27;s where the pattern becomes blurry.<p>When
    I started web dev, fluent interfaces were everywhere, and the motivations, thinking
    about it, seem to converge about another, different thing: lazy evaluation.<p>This
    is what jQuery has in common with ORMs, I&#x27;d guess.<p>The development experience
    isn&#x27;t even the most important thing, it&#x27;s providing an abstraction between
    executing a query (hence jQuery) and chaining selectors.<p>Natrowing down snapshots
    is completely different from chaining selectors, and this is the common aspect
    between an ORM and a library working on the DOM.<p>Where it starts to feel icky,
    in both cases, is, when mutations are involved.<p>Then you have potential for
    confusion around when these mutations are commited.<p>In other words, since jQuery
    collections are, well not &quot;live&quot;, like getElementsByTagName, also not
    snapshots, like querySelectorAll is (snapshot regarding the reference, not what
    it points at, of course).<p>jQuery combined the best of both worlds for many everyday
    applications.<p>But mentally working through an applications with complex mutations
    only was fun if your colleagues were disciplined.<p>jQuery &quot;soup&quot; when
    using many mutations, leveraging the DOM as a snychronized shared state, and mixing
    in some confusing closures anf loops, was also real.<p>I admire jQuery, but also
    don&#x27;t miss debugging half-working giant files. Not a library issue, you can
    have similar issues with any library when working on dynamic frontend state.<p>Circling
    back to the point: I&#x27;m not sure whether a fluent \ninterface is ideal for
    DOM manipulation.<p>But in any case, jQuery was used way beyond &quot;DOM library&quot;.
    It was almost synonymous with &quot;JavaScript&quot; at some point, and putting
    huge blocks of imperative domain logic nested 5 closures deep into some event
    callback was an issue with jQuery just as it is an issue with React right now.<p>Same
    story, different day."
