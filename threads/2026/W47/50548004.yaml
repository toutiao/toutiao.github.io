  author: cduzz
  text: We&#x27;re all living in <i>the story of mel</i>.<p>At first, there were just
    big logic blocks and storage that did as they were told.<p>Later, in hardware,
    there were all sorts of optimizations built in where the logic would do its own
    thing -- so you&#x27;d get caches and speculative execution and even on-the-fly
    conversion from one instruction set to another.<p>This abstraction was also piled
    onto the runtime -- you&#x27;d write machine code, then assembly, then higher
    level languages; eventually you&#x27;d run in interpreted or just-in-time generated
    bytecode (hello to Java from UCSD p-System from the 70s and Burroughs machines
    in the 60s).  And of course... operating systems...<p>Now, we&#x27;ve got machines
    reading source code (and machine code, and everything in between) and they&#x27;ve
    got some ability to thing the thing to make it thing.  Sometimes correctly (enough
    to pass existing tests) and sometimes without the ability to express to the human
    what the thing they thinged was.<p>But, we&#x27;re all living in the land of mel
    and for some it&#x27;s always been better to go fishing than to pretend to participate.
