  author: thinkcontext
  text: So many impacted by cancer in this thread, I&#x27;ve also been in the position
    where you feel powerless when someone close to you is diagnosed.  I try to take
    opportunities like this to remind people that there are some types of cancer (and
    other conditions) that you can help other people with through a bone marrow transplant.<p>Cancers
    like leukemia, melanoma, lymphoma and conditions like aplastic anemia, immune,
    autoimmune disorders can be treated by infusing the patient with compatible bone
    marrow stem cells from a donor.  Finding a compatible donor can be difficult,
    on average in the general population its on the order of 1:10,000 to find a match.  For
    that reason there&#x27;s a registry that people can submit a cheek swab to.  In
    my case I joined the registry about 15 years ago when someone in my extended friend
    circle had leukemia.  A swab drive was organized to find her a donor, which eventually
    happened and she wound up beating it.  I didn&#x27;t match her but a few years
    ago I matched another patient and wound up donating.<p>In the US the registry
    is National Marrow Donor Program.  Signup on their website and they will send
    you a free swab kit.<p><a href="https:&#x2F;&#x2F;www.nmdp.org&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.nmdp.org&#x2F;</a>
