  author: tombert
  text: My favorite uncle died from pancreatic cancer when I was a teenager. I remember
    at the time I quickly looked up the survivability rates of pancreatic cancer and
    was immediately sad to see it was nearly zero [1].<p>For the next few months,
    there was a roller coaster of hearing about his new treatments, sometimes seeming
    effective where we would convince ourselves that he&#x27;s going to get better,
    only for him to take a turn for the worse.  This kept happening until, of course,
    he died.  I was sad he was dead but the combination of the cancer and the chemo
    seemed really miserable so I was at least happy he wasn&#x27;t in pain anymore.<p>This
    happened around the time Patrick Swayze died from pancreatic cancer, and a bit
    before Steve Jobs, and it was at least a little reassuring that this disease didn&#x27;t
    spare even obscenely wealthy people.   I hope we figure out better treatments
    for it, and this seems promising.<p>[1] At least when caught late, which it often
    is and was for him.
