  text: Right. The jaundice is due to obstruction of the CBT (common bile duct). The
    CBT carries bilirubin (dead red blood cells). Excess bilirubin shows up as jaundice.<p>The
    earlier one&#x27;s CBT is blocked, the better, as it results in earlier diagnosis.
