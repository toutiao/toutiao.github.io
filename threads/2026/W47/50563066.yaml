  author: bluGill
  text: Often, no symptoms in the early stages. By the time you notice something&#x27;s
    wrong, it&#x27;s likely too late. My dad was at stage three when they caught his
    and they told him He was lucky. Most people don&#x27;t notice anything wrong and
    he just had a minor thing that on surprise, he would have mentioned to a doctor.<p>Even
    when symptoms are noticed, most symptoms that people have can be any one of a
    number of things. Go look for constipation, then look up each symptom individually
    and see what all it can map to. Pretty much every symptom of the very common constipation
    is also the only symptom you&#x27;ll see of heart attack, liver cancer, liver
    disease, appendicitis, pancreatic cancer, pretty much anything goes wrong in the
    rib cage...<p>Spine would be the only exception. I don&#x27;t think Spine ever
    manifests quite that way. On the other hand, my leg pain turned out to be a tumor
    on the spine. Thankfully it wasn&#x27;t cancer.<p>Really, the best advice I can
    get is pay attention to what you feel like normally. If something&#x27;s unusual,
    get to a doctor. Most people who go to the ER for a heart attack symptom are not
    having a heart attack. We could save a lot of lives, and I mean a lot of lives,
    if more people would be going to the emergency room for heart attack symptoms
    even though most people who don&#x27;t go to the ER for such symptoms are correct
    they&#x27;re not having a heart attack and don&#x27;t need to be there.
  score: 0
