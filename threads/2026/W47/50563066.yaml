  author: devilbunny
  text: There&#x27;s not a &quot;test&quot; in the sense of a blood draw for pancreatic
    cancer. Diagnosis is made by getting a piece of tissue (not easy) and having a
    pathologist review it.<p>At a bare minimum, you will need to have a mass large
    enough to be seen on CT scan, and then an endoscopic biopsy (among GI scopes,
    the endoscopic retrograde cholangiopancreatography or ERCP is one of the most
    difficult). And even that may not get enough tissue for a diagnosis.<p>So, yeah,
    failure to diagnose it is common - largely because it&#x27;s <i>almost impossible
    to diagnose early</i>. I&#x27;m a doctor. We feel sick when these things happen.
    It&#x27;s horrible for our patients.
