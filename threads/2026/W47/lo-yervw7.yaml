    type\n- (libc) Wildan Mubarok fixed a `float_t` redefinition error when the same
    header is used in multiple places\n- (libc) Wildan Mubarok fixed `limits.h` constant
    suffixes\n- (libc) Wildan Mubarok fixed the `futimen"
