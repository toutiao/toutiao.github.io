  content: "# [This Month in Redox - October 2026](https://www.redox-os.org/news/this-month-261031/)\n\n#####
    By Ribbon and Ron Williams on \n\nRedox OS is a complete Unix-like general-purpose
    microkernel-based operating system written in Rust. October was a very exciting
    month for Redox! Here’s all the latest news.\n\n## Donate to Redox\n\nIf you would
    like to support Redox, please consider donating or buying some merch!\n\n- [Donate](https://www.redox-os.org/donate/)\n-
    [Patreon](https://www.patreon.com/redox_os)\n- [Merch](https://redox-os.creator-spring.com/)\n\n##
    Golang On Redox!\n\nWildan Mubarok ported the official Go programming language
    compiler after months of porting iterations. It supports both cross-compilation
    and self-hosted compilation of Go programs.\n\nThe Go compiler uses `relibc` and
    does not require an external compiler (GCC). During porting this compiler, it
    revealed issues in many parts of the system, such as the `range-tree` library
    fix mentioned below.\n\nThe Go compiler port is currently a fork, as upstreaming
    will be another effort.\n\n ![Golang Hello World program running on Redox](/img/screenshot/go-hello-redox.png)\n##
    Redox on Cloud Hypervisor!\n\nMJ Pooladkhay was able to boot Redox on [Cloud Hypervisor](https://www.cloudhypervisor.org/),
    as part of his [NLnet](https://nlnet.nl/)-funded work on Redox virtualization.
    This is an important step towards Redox as a web server in the cloud. He also
    added integration to the Redox build system, to simplify testing.\n\nHe wrote
    [this](https://www.redox-os.org/news/virtualized-redox/) article about this initial
    work.\n\nRead [this](https://doc.redox-os.org/book/cloud-hypervisor.html) page
    to learn how to use it.\n\n## WebKitGTK3 Video Support\n\nWildan Mubarok fixed
    the missing codecs in GStreamer using FFmpeg libraries for video playback in WebKit.\n\n-
    Mozilla Developer Network HTML5 video example\n ![HTML5 video example on WebKitGTK3
    demo web browser](/img/screenshot/webkitgtk3-html5-video.jpg)\n- YouTube\n ![YouTube
    on WebKitGTK3 demo web browser](/img/screenshot/webkitgtk3-youtube.jpg)\n## GIMP
    On Redox!\n\nWildan Mubarok ported GIMP after some months of work. As GIMP uses
    the recent Orbital backend of the GTK port, the experience may not be smooth in
    this initial port.\n\n ![GIMP running on Redox](/img/screenshot/gimp.png)\n##
    Servo 0.7 Update\n\nWildan Mubarok updated our Servo fork to version 0.7 after
    months of work to fix regressions and new bugs.\n\n ![Servo 0.7.0 running on Redox](/img/screenshot/servo-0.7.0.png)\n##
    Ratatui 3D Showcase\n\nRibbon tested the Ratatui 3D rendering of [Cornell box](https://en.wikipedia.org/wiki/Cornell_box)
    demo from [ratatui-3d](https://github.com/limlabs/ratatui-3d) project.\n\n ![3D
    Cornell Box demo running on COSMIC Terminal](/img/screenshot/ratatui3d-cornell-box.jpg)\n##
    NUMA Support Testing\n\nThe first real hardware NUMA tests on a Dell Poweredge
    R420 server were done, which confirms that EuclidDivisionLemma’s effort on NUMA
    support is complete enough to work.\n\nTests conducted by EuclidDivisionlemma,
    showed, on average, a 45.2% reduction in time taken on the NPB MG Workload.\n\n
    ![First NUMA benchmark](/img/screenshot/numa-bench1.jpeg)\n## Fixed RISC-V Dynamic
    Linking\n\nlbecher fixed RISC-V dynamic linking, which is the last CPU architecture
    using static linking in our build system.\n\nIt will allow our application testing
    in RISC-V to easily scale.\n\n## Initial Rootless Package Installation\n\nWildan
    Mubarok finished the first part of rootless package installation code, which allows
    the creation of system-wide paths mappings to user equivalent paths.\n\n## virtiofs
    On Redox!\n\nMJ Pooladkhay has completed the `virtiofs` driver and integrated
    it into the Redox build system. It’s now possible to share any directory on a
    Linux host with a Redox VM running under QEMU or Cloud Hypervisor.\n\nFor example,
    the `make qemu share=redox` command shares the Redox build system directory on
    Linux to Redox.\n\nRead [this](https://doc.redox-os.org/book/virtio-fs.html) page
    to learn how to use it.\n\n## NUMA Information Reporting\n\nEuclidDivisionLemma
    implemented NUMA hardware information reporting, exposed in `/scheme/sys/numa`
    resource.\n\n    NUMA nodes: 4\n    Node 0:\n    \tCPUs: 0 1 2 3 4 5 6 7 \n    \tMemory:
    8.00 GiB\n    Node 1:\n    \tCPUs: 8 9 10 11 12 13 14 15 \n    \tMemory: 4.00
    GiB\n    Node 2:\n    \tCPUs: \n    \tMemory: 8.00 GiB\n    Node 3:\n    \tCPUs:
    \n    \tMemory: 12.00 GiB\n\n## Simplified AI Policy\n\nJeremy Soller simplified
    the AI policy and the Board Of Directors approved, now it is:\n\n“Redox OS does
    not accept contributions generated by LLMs ([Large Language Models](https://en.wikipedia.org/wiki/Large_language_model)),
    sometimes also referred to as “AI”.”\n\n## Ring Buffers Project Summary\n\nAnhad
    Singh, Ibuki Omatsu, 4lDO2 and Ron Williams wrote a [technical report](https://www.redox-os.org/news/nlnet-rb-summary/)
    of the conclusion of the Redox Ring Buffers project.\n\n## Bootloader Improvements\n\n-
    (boot) MJ Pooladkhay fixed a UEFI exit failure bug due to a stale memory-map key
    to `ExitBootServices`\n\n## Kernel Improvements\n\n- (kernel) 4lDO2 reduced the
    x86 kernel binary file size in ~200 KiB by using naturally aligned kernel stacks
    on x86\n- (kernel) 4lDO2 did a code cleanup\n- (kernel) 4lDO2 fixed some code
    warnings\n- (kernel) Wildan Mubarok fixed a CPU context-wide deadlock in futex
    code\n- (kernel) Wildan Mubarok fixed thread lock ordering in futex code, which
    fixed a hang\n- (kernel) EuclidDivisionLemma implemented wrappers to `libredox`
    to ease the manipulation of scheduler CPU affinity.\n- (kernel) EuclidDivisionLemma
    fixed incorrect APIC ID reading\n- (kernel) EuclidDivisionLemma fixed more NUMA
    bugs\n- (kernel) EuclidDivisionLemma fixed some code warnings\n- (kernel) EuclidDivisionLemma
    did some refactoring and cleanup in NUMA code\n- (kernel) Radek Pietruszewski
    implemented RISC-V CPU information reporting\n- (kernel) bjorn3 fixed some code
    warnings\n- (kernel) Val Lorentz fixed some code warnings\n\n## Driver Improvements\n\n-
    (driver) Jeremy Soller created the `audiod` library to unify the audio buffer
    size handling of all sound drivers\n- (driver) MJ Pooladkhay fixed a bug with
    the device DMA memory lifetime being ended while the device was using it\n- (driver)
    The “beef” contributor fixed the Intel HD Audio driver’s Function Group Type parameter
    ID\n- (driver) bjorn3 did some code cleanup\n\n## System Improvements\n\n- (sys)
    Jeremy Soller added COSMIC Monitor and GTK3 demos to Redox `demo` variant\n- (sys)
    bjorn3 moved the Unix domain socket code from the `ipcd` daemon to a new daemon
    called` udsd` because this code was not related to Redox IPC, simplifying the
    system\n- (sys) bjorn3 did some code deduplication\n- (sys) Ibuki Omatsu replaced/unified
    the `fstat`, `unlinkat`, `flink`, and `frename` functions with `std_fs_call`\n-
    (sys) Ibuki Omatsu moved the `F_SETFD`, `F_GETFD`, and `F_DUPFD*` fcntl flags
    from `redox_syscall` to `libredox`\n- (sys) Wildan Mubarok fixed a TTY write panic
    in `getty` when a CLI application hangs\n\n## Relibc Improvements\n\n- (libc)
    Wildan Mubarok implemented `dladdr` and `dl_iterate_phdr` functions\n- (libc)
    Wildan Mubarok implemented POLLHUP, POLLERR, EPOLLHUP, and EPOLLER event codes\n-
    (libc) Wildan Mubarok added a initial `link.h` function group implementation\n-
    (libc) Wildan Mubarok added initial locale support: implemented decimal locale
    support in `strtod` function, implemented `setlocate` function and `LOCPATH`\n-
    (libc) Wildan Mubarok fixed TLS relocation alignment in LTO compilation\n- (libc)
    Wildan Mubarok fixed `EINTR` error handling behavior in futex and kill\n- (libc)
    Wildan Mubarok fixed the `scanf` function parsing invalid `%d`\n- (libc) Wildan
