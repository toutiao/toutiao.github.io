    While this is a real operating constraint I am missing evidence of a major airline problem. The article turns normal flight planning into something much more dramatic.<p>Step climbing is routine on long-haul aircraft, including widebodies. A fuel-heavy aircraft initially cruises lower, then climbs as it gets lighter. It isn’t continuously struggling uphill for hours.
    Lower than the eventual cruise altitude does not necessarily mean below the optimum altitude as the optimum changes with weight if my understanding is correct. And yes, the article acknowledges this, but then (imho misleadingly) treats those initial lower levels as an automatic efficiency penalty.<p>Also, yes, the XLR’s extra weight does involve trade-offs. But airlines evaluate fuel consumption over the whole mission, not how quickly an aircraft reaches 37,000 feet.<p>The article does not establish that carriers are experiencing this systematically. Its “2.5% per hour” fuel penalty has no clear calculation or baseline, and the claim that climbing above 32,000 feet leaves only “a few knots” of safe margin is presented without supporting performance data.<p>The “coffin corner” framing is particularly sensational.
