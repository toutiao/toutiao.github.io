  author: ajross
  text: No, the way the physics works is that the distance&#x2F;energy efficiency
    varies (to first order anyway) with the air temperature.  And it&#x27;s colder
    the higher you get, up to this funny layer called the tropopause where the temperature
    (somewhat oddly) stops varying with altitude at all.  And this altitude varies
    a little, but is always right around 36kft.<p>So as soon as jets were powerful
    enough to get there, they all wanted to fly at the tropopause, but no higher.
