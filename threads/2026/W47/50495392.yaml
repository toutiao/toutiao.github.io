  text: |-
    Also these intercooler-free turbofan propulsion plants have a big issue delivering good power at high altitude.<p>The <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Grob_Strato_2C" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Grob_Strato_2C</a> for example had a Continental IO-550 core surrounded by a total of 3 spools of turbocharging, and employed charge-air intercooling after each of the 3 compressors. It flew it&#x27;s endurance record at FL590 and it&#x27;s useful service ceiling was FL787.
    For economy and given that it was a turboprop, it only flew Mach 0.56, but that&#x27;s not directly connected to the utility of charge air cooling at high altitudes.<p>You could use a turbine core just as well instead of their 4-stroke gasoline engine.<p>One stage of intercooler might be quite effective for the modern 2-spool turbofan units if you want to make them fly higher?
    So that the default cruise height goes up from a reduced wing loading despite maintained&#x2F;typical MMO speed.
