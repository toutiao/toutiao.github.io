  author: sho
  text: Your ideas about the tropopause are a bit eccentric. 36kft is just a model
    average, it&#x27;s more like 25kft at the poles and 50-60kft at the equator. Large
    jetliners fly well below and above it all the time.<p>Temperature&#x27;s just
    one factor. Air density, lift-to-drag ratio, weight, speed and engine performance
    all matter. Thinner air reduces drag, but you still need to generate enough lift,
    and there&#x27;s a point beyond which the trade-off stops paying off. Business
    jets are generally lighter, with wings and engines designed for higher-altitude
    cruising, and regularly fly above 40kft, sometimes even 50kft.<p>The general max
    service height of airliners is an engineering trade-off between air density, lift-to-drag,
    weight, speed and engine efficiency. Air temp is part of it, but a small part,
    and there&#x27;s nothing magical about the tropopause.
  score: 0
