  text: Chronic pain often is not a useful signal. Consider that there is little correlation
    between back pain and what MRI or whatever modern diagnostic can show. One person
    where the diagnostic shows that nothing is wrong may suffer daily. Another with
    spine discs that are obviously damaged may suffer very little.<p>The same is with
    damaged meniscus. One can run with no pain. Another suffers at each walking step.
    Sometimes an operation can help, but it is rather invasive with non-trivial risk
    of complications. And given that meniscus does not heal by itself if a person
    can learn not to feel the pain, it can greatly improve quality of life.
