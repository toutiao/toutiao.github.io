  author: nickjj
  text: I found after a while, the tests were done visually. Looking for the spots
    with the most grooves or little pieces of terrain to anchor the front of your
    foot on. If something didn&#x27;t pop out immediately, I took it slower and evaluated
    the surrounding area to assess the risk in case I slipped. It was like going through
    a flow chart in real-time.<p>I slipped twice after ~260,000 steps where 80% of
    those steps were going uphill or downhill on mountains with a lot of mixed terrain
    (mud, running water, stepping on rocks over a creek, icy inclines, etc.).<p>Keep
    in mind, the two slips were I actually fell on my butt. I had a bunch of wobbly
    moments where it was possible to recover without falling. Basically the &quot;learning&quot;
    for me was trusting my body to be comfortable with a bunch of micro-slips where
    you can feel the ground shift below you, but by the time you take your next step,
    it recovers.
