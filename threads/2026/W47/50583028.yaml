  text: 'This is largely in line with Tim Galwey&#x27;s &quot;Inner Game&quot; books
    [0] specifically and Zen in general.<p>After reading many of Gallwey&#x27;s books
    and also Zen and the Art of Archery [1], I would summarize it all down into one
    sentence:<p>Western coaching focuses on telling your body what to do, Zen coaching
    focuses on observing what your body is doing.<p>e.g. this story from the Inner
    Game of Skiing [2] summarizes it well:<p>&quot;I didn&#x27;t tell people how to
    stand, shift their weight etc. I just told them:<p>- observe the angle of your
    skis to the ground<p>- flat on the ground is 1<p>- as far over as you can tilt
    is 10<p>- just feel what angle you are at as your are moving down the hill.<p>A
    young lady then came up to ask me &#x27;So what is the correct angle??&#x27;.
    I told her &#x27;There is no correct angle, just observe what angle your skis
    are.&#x27; &quot;<p>If you prefer a video example, this youtube video of Gallwey
