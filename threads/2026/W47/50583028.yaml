  author: iotage
  text: 'Over 20 years ago I quit smoking after being a pack and a half smoker since
    high school. I didn’t torture myself by trying to quit, by cutting down or using
    some aid like nicotine alternatives.<p>Instead, I simply ran through a simple
    mental exercise every time I started a cigarette. I imagined and felt the few
    things that I really didn’t like about smoking - the look and smell of an old
    full ashtray, the taste of a stale cigarette, the gagging feeling of a first daily
    cigarette one sometimes experiences, the feeling of smoke in my eyes etc. Every
    cigarette every time, and after that I would just carry on with my cigarette.
    I didn’t try to give up smoking.<p>After a few weeks I realized I was often stubbing
    out the cigarettes early, not through a conscience decision! A few weeks later
    I just … stopped wanting a cigarette, and haven’t wanted one since.<p>Today, for
    the first time I hear of Allen Carr’s technique. It’s not the same, but related
    and I’m amazed I never heard of it! Both it seems result in changing one’s core
    beliefs?<p>One note of warning: I think this technique could be really dangerous
    if applied to things like overeating etc.<p>Another important point I think is
    that I was in an environment conducive to stopping smoking - my wife hated it.
    If your in an environment where smoking is rewarded, like for example smoking
    with a buddy, or regular pub sessions, it surely would be less effective.<p>If
    anyone wants more info or advice on this, email me.'
  score: 0
