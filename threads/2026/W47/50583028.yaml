  author: bitwize
  text: I became familiar with <i>The Inner Game of Tennis</i> via a presentation
    by Alan Kay, who now seems like a distant echo from a bygone age, when computing
    technology was really intended as a tool to aid and augment human capability,
    rather than the jester in <i>Thus Spoke Zarathustra</i> as it dances and sparkles
    over and past us. In the presentation, Kay provides a short clip of that exact
    news story featuring Gallwey working with Molly, and notes that after the first
    few times saying &quot;hit&quot;, Molly&#x27;s arm begins to move despite her
    not yet intending to actually hit the ball!<p>I&#x27;ve noticed a similar phenomenon
    in martial arts. When I focused less on making my body do the correct technique,
    and instead imagined wireframe fighters similar to the ones in <i>Smash Bros.</i>
    games attacking me, and the technique I was performing was a countermove—I found
    that thinking about the imaginary opponent rather than my own body made my technique
    more correct, as my peers and instructors had noticed.
