  author: galaxyLogic
  text: 'I agree you shouldn&#x27;t focus on your cravings, you should forget about
    them, by focusing on something else. Then the cravings gradually diminish. But
    &quot;observing the craving&quot; can also mean you are craving less, because
    you are experiencing more the process of observing, rather than experiencing the
    craving so badly. It&#x27;s a tricck of the mind I believe.<p>The point is to
    understand that mechanism: You crave bad things not because of what you get from
    them in the end, but because of the excitement you feel when you are &quot;reaching
    out&quot; for them. It feels like something very valuable, is within your reach,
    and that gives you a great sense of excitement, which we enjoy. We want to stay
    in such a state, because moving away from it would make us feel we are giving
    up something very valuable.<p>I guess that is why people get addicted to gambling.<p>I
    underwent an operation in hospital and they wouldn&#x27;t let me drink anything
    for a long time before the operation. I wanted to drink so badly that I came up
    with a plan in my head:  Once I get out of this hospital I will refrain from drinking
    a whole day, just to be able to experience how good it feels when you then are
    actually able to drink.<p>Of course no such thing happened once I got out of the
    hospital, because I no longer had that enormous desire to drink anything. So I
    didn&#x27;t feel the need to make myself thirsty just to be able to quench my
    thirst.'
