  text: 'Sounds like the typical trap: you first need to separate the inner judge
    from the inner observer. Otherwise you just take your bully for a tour.<p>It is
    hard practice for those with adverse childhood experiences and the resulting internalized
    criticism to eventually be able to be aware of something without the negative
    stream of judgment and the subconscious desire to change and control it.<p>You
    either learn to tame the judge, or you have it act out on your environment, or
    more directly towards yourself. Your choice.<p>Book recommendation: <i>Sarah Peyton,
    Self-Resonance.</i><p><i>Jiddu Krishnamurti: On Awareness</i> <a href="https:&#x2F;&#x2F;kfoundation.org&#x2F;krishnamurti-the-first-and-last-freedom-on-awareness&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;kfoundation.org&#x2F;krishnamurti-the-first-and-last-free...</a><p><i>“Therefore
