  author: nickjj
  text: "&gt; Zen coaching focuses on observing what your body is doing.<p>Isn&#x27;t
    this basically how learning works for most physical things? Riding a bike, swimming,
    etc..<p>I just came back from a bunch of icy hiking in Salt Lake City (KubeCon
    was last week). I wanted to climb a bunch of mountains but I had no gear except
    rubber sole hiking sneakers. Almost every place I went had slippery ice and steep
    inclines, but it was all no problem. That would be Bell Canyon upper falls, Heugh&#x27;s
    Canyon, Neff&#x27;s Canyon to the meadow, Grandeur Peak from Church Fork, Lake
    Blanche, Donut Falls and Frary Peak. Some of these were done in the rain or after
    snow.<p>You very quickly get used to what type of traction you get on certain
    types of surfaces and then you make small adjustments to improve stability. It&#x27;s
    all trial and error and very dynamic. Maybe at the start you grab bushes for extra
    precaution, or you go super slow, or you crab walk down just to get a feel for
    how your footwear interacts with the ground.<p>How you shift your weight along
    with how much of your sneaker has contact on the ground play a big factor but
    it&#x27;s not something you can easily explain, you just need to do it and see
    how it goes."
