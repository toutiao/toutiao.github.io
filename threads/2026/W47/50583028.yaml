  author: thomastjeffery
  text: I think the missing part is the something you do <i>instead</i>.<p>I didn&#x27;t
    stop chewing my fingernails. I started clipping them.<p>There&#x27;s an industry
    of organizations that run &quot;porn addiction&quot; recovery programs. I think
    it&#x27;s irrelevant whether or not you believe watching porn is a good it bad
    thing to do. The question that these organizations never answer is, &quot;What
    should you do <i>instead</i>?&quot; The implication is that people who want to
    stop watching porn should become asexual. Not only is that ridiculous, it demonizes
    the person&#x27;s sexuality - a core part of their self - which gives an extreme
    amount of power and salience to the subject of avoidance; and pits them in a duel
    against their own self.<p>There is no victory without a victory condition.
