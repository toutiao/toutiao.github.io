  author: DenisM
  text: "“Habits” was the first answer for me. Habits obviate the need to spend willpower
    on mundane things, so I get more of it to spend elsewhere. Second effect is that
    having accomplished several things first thing in the morning rewards me with
    dopamine, which creates a credible promise of more dopamine for other things.
    Procrastination is lack of belief in the future dopamine fix.<p>Start with habits.
    “Atomic habits” is a good starting point."
