  author: b112
  text: LLMs have a bottleneck, human review.  And human review is absolutely required
    at this stage (the future is unknown).  A rust built LLM only reviewed SSL library
    would be a recipe for disaster.<p>Beyond that, when it comes to exceptionally
    complex APIs, forward thinking implementation, and revising the &#x27;way things
    are done&#x27;?  These are weak points for LLMs.  If you don&#x27;t know how to
    write OpenSSL(or its replacement), and don&#x27;t understand all its quirks, and
    the entire industry surrounding it, you cannot be the human driving the LLM successfully.<p>There
    is no way for a human to catch all the design mistakes an LLM will make, otherwise.<p>People
    seem to get upset, when I say this, for reasons I cannot fathom.  However, we
    need to have a mental model of how we trust LLM output, and the &#x27;new junior&#x27;
    is great for that.  Especially considering that every day, is a new day for an
    LLM, its context window always loses yesterday.<p>So consider LLMs as an eager,
    intelligent, incredibly well read junior, just out of college.  And on their third
    day of work.<p>Zero real world experience.  Constant review required.<p>Would
    you want that junior to design, build, and write test scripts for a library to
    underpin the entire internet?
