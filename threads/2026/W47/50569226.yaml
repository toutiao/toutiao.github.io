  author: amluto
  text: 'On a very very quick read, the bug is that EVP_EncodeBlock malfunctions if
    the input is larger than ~1.5GB.  EVP_EncodeBlock is a function that encodes base64.<p><a
    href="https:&#x2F;&#x2F;docs.openssl.org&#x2F;1.0.2&#x2F;man3&#x2F;EVP_EncodeInit&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;docs.openssl.org&#x2F;1.0.2&#x2F;man3&#x2F;EVP_EncodeInit&#x2F;</a><p>As
    a seasoned C programmer, I can immediately observe that the whole API is bad:
    the caller is expected to calculate the buffer length on their own, using a nontrivial
    formula, and the caller does not pass in the output buffer length, so the implementation
    cannot validate it.  But apparently OpenSSL 4 also implemented it wrong and wrote
    (possibly far) past the end of the buffer.<p>You should probably assume that,
    if you are running anything that can be convinced to use this API to encode a
    very long blob as base64, then you are in trouble. I don’t know why a modern server
    would do this.<p>BTW, OpenSSL seems to be a rather low quality implementation
    of a very low quality set of APIs.  Stay away.<p>edit: Fixed my size threshold,
    hopefully. I was thinking of unsigned ints, but this is a <i>signed</i> int. I
    have not looked at the code, just the description.'
