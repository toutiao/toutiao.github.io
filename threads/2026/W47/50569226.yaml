  text: |-
    aws-lc is a lot of assembly, which you kinda need anyway. Neither Rust nor C are fully suitable for cryptography because common optimizing compiler backends (LLVM, GCC, MSVC) can introduce branches (even if you wrote it in a branchless manner!), making the crypto code vulnerable to side-channel attacks.<p>So the options are<p><pre><code>  - write it in assembly
      - use a high-level language, then verify the generated assembly the compiler generates
      - write a new or modify an existing backend to support timing-independent code
    </code></pre>
    aws-lc does the first, some other crypto libs try to do the 2nd but I don&#x27;t know how solid that is and the 3rd one takes time.<p>base64 encode hopefully isn&#x27;t used in places where it would be a timing channel, so it could still benefit from a safe Rust impl. And at least it&#x27;s API could benefit from slices and Result
