    said it would be a staggered separation. It&#x27;s possible they stayed as long
    as possible to compensate for underperformance either of BE-4 or the boosters
    themselves. It&#x27;s also possible they separated too early. Centaur was behaving
    erratically, according to the telemetry based video, but it could have been a
    last ditch attempt to fix the trajectory, or something else malfunctioned after
    the stage 1 underperformance (either MECO or fairing separation).
