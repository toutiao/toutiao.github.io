  author: GMoromisato
  text: 'Eric Berger reports that the fault is likely in the booster stage, not the
    Centaur upper-stage and not the solid-rocket motors. The means it&#x27;s either
    the Vulcan rocket or (more worryingly) the Blue Origin BE-4 engines. If it&#x27;s
    the latter, this might also delay the next flight of New Glenn and possibly risk
    the timelines of the Artemis program.[1]<p>Irene Klotz reports that this set of
    BE-4 engines were modified after the New Glenn pad explosion. Specifically, they
    modified the oxygen valves, which were blamed for the hotfire anomaly (pro-tip:
    it&#x27;s always the fucking valves).[2]<p>The booster shut down about 40 seconds
    later than the expected timeline, which implies that it had an extra 40 seconds
    of fuel relative to expectations. It is possible that the modifications somehow
    caused an under-performance of the booster, which would doom the mission.<p>[1]
    <a href="https:&#x2F;&#x2F;x.com&#x2F;SciGuySpace&#x2F;status&#x2F;2122070802971385977"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;SciGuySpace&#x2F;status&#x2F;2122070802971385977</a><p>[2]
