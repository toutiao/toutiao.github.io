  author: adamweld
  text: I&#x27;ve been having some interesting discussions with friends about this
    exact topic, whether AI will be a boon to OSS, or the end of it.<p>I think that
    many tools, services, and programs will be more personalized, and maybe less shared.
    But that the core building blocks of the tools will stay open and continue to
    be refined by the community.<p>When I&#x27;m coding with AI, one of the main reasons
    it&#x27;s so capable is the ability to build off of languages, packages, and frameworks
    that are battle tested across many deployments. The end result is better if my
    (+ my agents) focus is on what&#x27;s new and different about what I want to create,
    not reinventing the wheel. So I&#x27;ll import a proven serial library rather
    than writing my own, pick the right programming language for my use case rather
    than writing in assembly.<p>With regards to your project and CAD, I think it&#x27;s
    a clean and efficient interface, and part I generated looked good. Personally
    I need more traditional CAD features for my day to day (drawings, multi part assemblies,
    hand editing) but it looks like a good tool for the right use cases.<p>To finish
    my open vs closed source thought - have you considered open sourcing your b-rep
    kernel? Your app may be the secret sauce, but the kernel is boring but vital core.
    Parasolid has been developed over the last 35 years and is the reference point.
    NVIDIA open sourced SMLib but it is buggy and incomplete. OCCT exists but doesn&#x27;t
    handle fillets well. Zoo spent two years with tens of developers building their
    kernel from the ground up (also unfortunately closed). There are a dozen new kernels
    written in Rust on github but none are complete.<p>I really think that if all
    of the smart people trying to roll their own kernel worked together and put effort
    into  really completing a good open source kernel, it would be the start of a
    cambrian explosion of CAD tools and AI enabled hardware engineering tools. Food
    for thought.
