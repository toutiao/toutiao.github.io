  author: ImPleadThe5th
  text: I took a few CAD courses and feel like I&#x27;m a pretty proficient user for
    my needs.<p>I found parametric CAD easy to intuit, but Blender very difficult.<p>Most
    parametric CAD has a &quot;2D first&quot; workflow. You pick a plane draw a 2D
    sketch, constrain it to some dimensions and extrude 3d shapes from it. I like
    that it requires me to provide dimensions because it anchors my model in some
    kind of &quot;reality&quot;. I feel this makes it both faster for me to get proportions
    right and allows me to play around with a tape measure to get an idea for what
    I&#x27;m making.<p>Later, if I decide to modify the measurements the effects ripple
    through the entire design. And as a developer, I find using variables to also
    be intuitive and allows for some level of &quot;generative&quot; experimentation.<p>Blender
    has a &quot;3D first&quot; approach where you are directly modifying mesh points&#x2F;normals&#x2F;faces.
    It feels less like working with rulers and pencils and more like working with
    clay.<p>Many cad softwares have Mesh manipulation as well, but I feel like a lot
    of &quot;getting started&quot; tutorials will focus on the Sketch -&gt; 3D workflow.<p>Maybe
    there is a way to do this &quot;unit based&quot; drawing with Blender. If so I&#x27;d
    love someone with more experience to share!<p>All that being said, playing in
    3D and getting a feel for proportions with exact measurements might help you with
    your artistic modeling as well. It likely won&#x27;t help you understand the tools
    better though.
