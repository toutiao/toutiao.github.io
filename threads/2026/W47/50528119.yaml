  author: rspeele
  text: Not exactly what you are looking for, but I recommend following the Solvespace
    tutorial. It&#x27;s short and simple and SolveSpace is a small download with a
    non-overwhelming number of features. It is harder to get lost in SolveSpace than
    in FreeCAD which is an absolute maze of &quot;workbenches&quot; and glued together
    features.<p><a href="https:&#x2F;&#x2F;solvespace.com&#x2F;bracket.pl" rel="nofollow">https:&#x2F;&#x2F;solvespace.com&#x2F;bracket.pl</a><p>It
    is worth getting comfy with parametric sketch-based CAD because it&#x27;s so powerful.
    It feels a lot like programming, really, in that by taking a good approach to
    modeling a part you can reduce or eliminate the amount of repetitive labor and
    make-this-line-up-with-that housekeeping you have to do.<p>And the fundamentals
    transfer over to FreeCAD, Fusion, Solidworks, etc. pretty easily in the same way
    that once you know Java you can learn Python, C#, etc.
