  text: 'I guess I never looked at the definition of wilt in relation to an item,
    but interesting.<p>Telling you things you probably already know, but, there&#x27;s
    designing an object and the representation of that (CAD) and then the creation
    of that in a real space and printing it (3D printing). The slicer that does the
    translation of how to go about printing that, is doing a lot of your interpretation
    and will define your quality of the item you are printing.<p>My understanding
    is, different slicers have different feature sets and work good&#x2F;better&#x2F;best
    with different printers. Inherently, the same CAD file printed by several different
    printers, with different infil and different configurations, beds, heat, filament
    will all have different feel and function in terms of quality.<p>I&#x27;m drawing
    a blank on the channel , but I&#x27;m positive there are a few YouTube channels
    that cover infil and how it affects the quality of a finished 3D print. Some of
    these concepts are no different than design principles for buildings and such
    that actual engineers™ learn and utilize.<p>Once you get comfortable with those
    concepts (e.g. using honeycomb infil in some parts that need to be more rigid
    vs solid for something you want to survive -- also note the infil percentages)
    that&#x27;s when you can combine that with how something pieces together and how
    to survive in different operating conditions.<p>To your question: experience is
    the hard, costly and pain in the butt way to do these things. Finding a YouTuber
    you like and watching their content and experiences of the outcome of something
    they designed and why they made the choices they did, is free and implementing
    those ideas should* be painless.<p>I know this isn&#x27;t as much of a thing anymore,
    but I guess the quality for printing overall with certain filaments so good quality
    people don&#x27;t mess with acetone baths for products anymore (I think it depends
    on filament). That finish  can also make things look a lot better quality as well.<p>Another
    variable in all of this that changes things is bed adhesion. If you don&#x27;t
    have a good starting ground, there&#x27;s nothing for everything else to connect
    to.'
