  author: zonkerdonker
  text: "Ill take a shot at answering. Im also an ME at a very AI forward company.<p>The
    hard part of mechanical design isn&#x27;t really the CAD. Ask any long time professional
    mechanical design engineer, and I can almost guaruntee you that they will tell
    you that they can CAD up a design faster than they can think it. There are AI
    tools that can absolutely help with some of the more tedious tasks in the process
    (2D specification and tolerancing, part families and variants, texture tables
    etc). \nThe difficult part of the job is synthesizing the massive number of variables
    and requirements and finding an optimal solution. Current models have been trained
    on all sorts of 3D, not just functional mechanical designs. AI doesnt know that
    a MIM steel part from vendor X can have a thinner wall thickness compared to a
    diecast steel part from vendor y, which would mean x grams of weight saving which
    cpuld be used to shore up a weak area on the other side of the part. It doesnt
    know that a sharp corner near an injection gate can cause porosity in some materials.
    It&#x27;s not good at designing strong parts in general. It doesnt know that the
    ID team wants a specific surface on an user-facing surface which requires draft
    angle minimums relative to the mold parting direction. And, if you take the time
    to gather all that data and then type it all out for a model, you would spend
    twice as long writing everything down in plain language as it would take to just
    CAD it up yourself.<p>It can take months to gather all of these requirements piece
    by piece from all teams across the org (rf design, thermal, structural and FEA,
    aerodynamics, environmental ratings, safety, etc etc), and as the design matures
    things change as well.<p>For professionals with training in the tools, CAD as
    it is now is already the most optimal method of getting a design into the computer,
    and that was never really the hardest part of the process anyway."
