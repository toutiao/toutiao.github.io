  author: YuechenLi
  text: There is no traditional 2D constraint solver for parallel&#x2F;perpendicular&#x2F;equal,
    etc. Instead, constraints are requirements generalized in code as Concepts and
    construction geometries (planes, axis, profiles, etc.) are unified as Concept
    Structs and erased at compile time like TypeScript, so over&#x2F;under-constraint
    for sketches doesn&#x27;t exist because the constraints are explicit and pre-resolved.<p>It&#x27;s
    easier if I show you some sample code.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;yuechen-li-dev&#x2F;Aetheris&#x2F;blob&#x2F;master&#x2F;fixtures&#x2F;Regression&#x2F;Decompile&#x2F;ctc-01.firmament"
