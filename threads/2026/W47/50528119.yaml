  author: dagmx
  text: CAD isn’t polygonal geometry be definition.<p>Polygonal geometry is harder
    for GenAI to do because it’s still largely diffusion based to look like an object
    and topology is just a polygonal projection over it. It’s roughly equivalent to
    the diffusion model generating the image inputs to photogrammetry (not quite but
    a trivialized explanation)<p>Meanwhile CAD is represented as a series of B-rep
    surfaces and operations. Both are largely more procedural and more akin to a programming
    language for models. Therefore it’s easier for an LLM to drive something towards
    an end result.<p>Then the CAD engines tessellator generates the polygons, but
    topology is not super important for CAD.<p>The best LLM CAD results I’ve seen
    even in academia are largely simplistic still though. The more data you put in
    , the better it’ll be able to match that but it’s sort of like giving it a very
    clear set of functions it can do to make something.
