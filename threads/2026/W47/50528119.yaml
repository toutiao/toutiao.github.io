  author: seemaze
  text: These are great! I&#x27;ve been using CAD for the better part of three decades,
    from AutoCAD R14 to 3DS Max, SketchUP, Rhino 3D, Solidworks, Vectorworks, and
    now OnShape.<p>Parametric solid modeling (OnShape in particular) is by far the
    most enjoyable (for me) of the conceptual frameworks which transform ideas in
    to geometry, though it seems one of the most difficult to intuit for newcomers.<p>I
    highly recommend anyone interested give it a shot, there&#x27;s never been a better
    time with more resources available to take advantage of the incredible capabilities
    of these tools.
