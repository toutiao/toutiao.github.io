  author: mafm
  text: There has been a recent explosion in open source cad options.<p>fluidcad appears
    to be a remarkably good option now - particularly for something that only started
    development about a year ago.<p>I have used freecad, solvespace and onshape for
    at least a hundred hours each to make some reasonably complex parts. fluidcad
    resolves pretty much everything I found painful about those options.<p>I have
    some more limited experience with build123d which is also nice, but just not as
    easy and interactive as fluidcad.<p>Fluidcad provides normal interactive 3d cad
    interface with tools like extrudes&#x2F;revolves&#x2F;sketches but explicitly
    generates code as an intermediate step to constructing geometry and the code can
    be edited and refactored easily.<p>The linking between the code and the gui works
    remarkably well in practice.<p>It’s far easier to manage parameters and constraints
    in fluidcad where they are written out explicitly and can be edited vs what happened
    in a gui-only interface like Onshape.<p>If you’re playing around with a semi-constrained
    sketch to understand kinematics onshape tends to “helpfully” add random constraints
    which is <i>really</i> annoying to identify and correct. In fluidcad everything
    is way more explicit and visible and clear.<p>I have only spent about 5 hours
    using fluidcad but it looks remarkably useful despite some minor rough edges.
    It’s pretty much exactly what I wanted onshape or build123d to be.<p>Solvespace
    is a <i>really</i> beautiful piece of software but quite limited. fluidcad has
    the same sort of nice vibes as solvespace but is way more powerful.
  score: 0
