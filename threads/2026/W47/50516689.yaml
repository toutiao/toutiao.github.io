  text: My company has a script to set up a repo in an expected pattern. The first
    thing you have to do is disable a bunch of logging that no one uses, as that can
    cripple the performance of your app. Then you have to go update a bunch of dependencies
    with security problems. Then you have to fix their git hooks.<p>Which is to say,
    standard does not imply good. A lot of times companies just standardize around
    how they did things most recently, which means they haven&#x27;t learned all the
    problems yet.
