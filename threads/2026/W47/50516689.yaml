  author: kstenerud
  text: I was with them right up until the admonition against standardizing the UI
    components. This is not an all-or-nothing proposition. You build a standardized
    library incrementally, and you slowly migrate codebases over to use them. I&#x27;ve
    seen some pretty horrendous UI mish-mash in what should appear to be a single
    application, because each piece was done independently and then stitched together.<p>You
    end up with drifting implementations that may or may not come from the same root
    at different points, where the same fix has to be applied multiple times as each
    team learns the lessons for what not to do, etc. Effectively what DRY is about.
