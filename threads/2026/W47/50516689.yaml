  author: jillesvangurp
  text: I got rid of about six years worth of technical debt on exactly this in our
    frontend last Friday. All it took was a few AI prompts. These types of issues
    are just melting away now.<p>Code duplication is fine as long the duplicates don&#x27;t
    drift apart. Keeping them in sync is a bit tedious for people. And people tend
    to cut corners. So there&#x27;s a potential to end up having to fix the same kinds
    of issues several times. But with AIs doing all the tedious work, staying on top
    of that is pretty doable. It&#x27;s more a question of whether that&#x27;s a good
    use of time and tokens. You could just make it fix things properly.<p>In the code
    base I mentioned, we had a few different component libraries that at some point
    were selected, used, and then later abandoned. We also had taken into use tailwind
    at some point but we never completed the upgrade to tailwind 4. And we had a bunch
    of manually styled html as well. It&#x27;s an application with a lot of different
    functionality, lots of different screens, etc. So there was a bit of pressure
    to not break things. I fixed all of that in a few prompts. The application still
    looks and feels the same but is much more consistent in terms of look and feel
    (we had several varieties of buttons and input fields with subtly different behavior).
    We found and fixed a few minor issues since then.
