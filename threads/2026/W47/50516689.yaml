  author: davnicwil
  text: this is my main point, yes.<p>N (initially) copied implementions does introduce
    the risk of &#x27;forgot to update this one&#x27; bugs, but these bugs are about
    as simple as it gets to find and fix.<p>Abstractions on the other hand introduce
    the risk of &#x27;what random thing am I going to break by changing this?&#x27;
    bugs which are typically much harder and more time consuming to find and fix.
    Further, the risk is recursive, as the fix might break yet another thing.<p>I&#x27;d
    maybe agree with the gp that instances of the former are as common as the latter.
    But to my original point, they just waste far less time.<p>I certainly know which
    class of bug I&#x27;d prefer to have to fix in a hurry, like a production incident,
    for example.
