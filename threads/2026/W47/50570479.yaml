  author: m4rtink
  text: Unless you can commit to fully support the full independently of Google, for
    ever, I am not sure just forking Android is a good idea.<p>The main point of Android
    right now are the apps that exist for it, the rest of it (graphics system, driver
    architecture, even system updates) is mediocre to shit level.<p>I think a much
    better option is to take mobile or even desktop Linux distro and make sure it
    has robust upstream support for the mobile hardware you care of. At the same time,
    work on Android emulation layer like Waydroid, to work as good as possible.<p>This
    way you have a long term sustainable hardware support model (sharing the effort
    with all other Linux distro communities) while still supporting the Android apps
    people care about.<p>This has been successfully by Valve for Windows games and
    apps on top of a regular Linux distro. And Jolla does the same for Android apps
    on Linux devices.
