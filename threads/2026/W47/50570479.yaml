  author: microtonal
  text: The sad thing is that they are always way behind on security updates. Old
    kernels, old firmware, old drivers, all full of known high&#x2F;critical CVEs.<p>And
    then you are missing out on up to 1.5 years of fixes for non-major&#x2F;critical
    vulnerabilities because they are still on Android 16 (only high&#x2F;critical
    vulnerabilities are in ASBs).<p>To make all of this worse, Google recently only
    started releasing fixes for some high&#x2F;critical vulnerabilities on the latest
    Android version (currently Android 17).<p>OEMs and Google somehow convinced people
    that having a recent ASB is enough, but it is only the tip of the iceberg.<p><i>I
    have virtually no google besides what I want (maps)</i><p>Well, except that &#x2F;e&#x2F;OS
    runs Google’s obfuscated DroidGuard binary in a privileged process to pass basic
    integrity. Yes, Google still has privileged access to your phone, unless you disable
    Play Integrity support in microG (which will break quite many apps). The even
    worse thing is that Google can send a unique DroidGuard blob just for you (since
    it is per request).<p>Moreover, &#x2F;e&#x2F;OS gives certain Google apps more
    privileges than the standard Android app sandbox (Google Maps being one of them).<p>Using
    it on a Fairphone eh? Well, you are also running proprietary Chinese TCL camera
    image processing blobs.<p>——<p>People who care about privacy and security do not
    use &#x2F;e&#x2F;OS. It is LineageOS with Murena’s cloud crap on top, along with
    a pile of hacks that weaken security and privacy.<p>Also, they are just very incompetent.
    E.g. Fairphone was hit by a bad bug where WiFi didn’t work on a lot of networks.
    When this was already known for months, Murena rolled out the same bug.
