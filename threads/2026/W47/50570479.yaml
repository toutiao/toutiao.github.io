  author: grapheneos
  text: ARM TrustZone is a CPU mode, not a secure element. It doesn&#x27;t provide
    the features of a secure element and isn&#x27;t used to implement the APIs Android
    uses from a secure element. Among other things, the lack of a secure element in
    many Android devices means disk encryption doesn&#x27;t truly work for the vast
    majority of users. Most users set a lock method such as a 6-8 digit PIN, which
    is entirely dependent on secure element rate limiting for encryption. The work
    factor implemented by key derivation including via the portion done in TrustZone
    requires at least a mediocre password to strengthen. The secure element provides
    a lot more than this and there are far security features missing with a Fairphone
    than only the secure element.<p>Fairphones don&#x27;t keep up with crucial privacy
    and security updates. They lag 1-2 months behind bare minimum incomplete backports
    to older releases from the start. The delay gets much longer over time. They lag
    years behind on complete patches which require keeping up with major Android releases.
    Android doesn&#x27;t even backport all of the High and Critical severity patches
    anymore. It hasn&#x27;t backported any of the Low and Moderate severity patches
    for years. Many Moderate severity patches are quite important privacy holes.<p>They&#x27;re
    providing bare minimum patches for the Android Security Bulletins which don&#x27;t
    cover hundreds of severe vulnerabilities for the Linux kernel. Fairphone 5 and
    earlier have an end-of-life Linux kernel branch so those essentially aren&#x27;t
    getting any of these. Google barely lists any in the Android Security Bulletins.
    Google want OEMs to ship LTS updates and move to new LTS branches but aren&#x27;t
    requiring it or including it in the patch level. Android Security Bulletins are
    deliberately incredibly incomplete to make it easier for OEMs to give the appearance
    of keeping up with the privacy and security patches. It&#x27;s a deliberate decision
    to make a lot of the Android ecosystem look a lot less bad than it is.<p>The vast
    majority of people buying those devices don&#x27;t realize they&#x27;re missing
    years of crucial privacy and security patches&#x2F;protections including ending
    up with an end-of-life Linux kernel without updates. They&#x27;re not making an
    informed decision because they&#x27;re misled about what&#x27;s being provided
    by Fairphone&#x27;s marketing. Fairphone claims to provide great long term updates
    but doesn&#x27;t actually do it.<p>&#x2F;e&#x2F; makes the privacy and security
    situation on Fairphones much worse. It drastically rolls back both privacy and
    security compared to AOSP. It has many of their own invasive services and heavily
    uses Google services by default anyway. It downloads and runs Google Play code
    with privileged access by default anyway. &#x2F;e&#x2F; and Murena repeatedly
    claim hardened devices mainly benefit criminals and pedophiles as part of trying
    to steer people away from GrapheneOS to their products. It isn&#x27;t a legitimate
    privacy project or product.<p>We posted more information about that here with
    links to far more:<p><a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50578396">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50578396</a><p>&gt;
    But their one phone with GrapheneOS support so far is very expensive.<p>There
    will be other supported devices at lower price points. The first device is a flagship
    since it&#x27;s the first one where they provide all of the essential security
    features and the required privacy&#x2F;security updates.
