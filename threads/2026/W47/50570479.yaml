  author: grishka
  text: Not really. For a while now, Android devices have had a hypervisor running
    in a &quot;trusted execution environment&quot;, which is at a permission level
    <i>above</i> the actual Android kernel. This is where all the bullshit &quot;security&quot;
    and remote attestation code runs. You never get to unlock this, a regular bootloader
    unlock only lets you boot an unsigned kernel with the TEE knowing that you&#x27;ve
    done it and snitching on you. That&#x27;s the whole reason SafetyNet is so hard
    to bypass these days. And of course, this is also the part that manages the bootloader
    lock state.<p>So at most, with a kernel exploit, you&#x27;re going to get a temporary
    root, and you don&#x27;t get to modify the system partition because the system
    will refuse to boot the next time because there are integrity checks. Something
    similar to PS4 and PS5 jailbreaks.
  score: 0
