  author: Andromxda
  text: GrapheneOS combines hardware and software-based security features to offer
    the best overall privacy and security. GrapheneOS has, for example been investing
    lots of time and effort into memory safety, long before hardware memory tagging
    existed in ARM chips, but hardened_malloc still can&#x27;t catch every memory
    corruption vulnerability (still a lot better than other &quot;hardened&quot; allocators).
    Combining it with MTE makes it very useful.<p>Other requirements, such as the
    7 year OEM update mandate, don&#x27;t just exist for security but also for longevity
    and avoiding e-waste, etc. Modern smartphone hardware is powerful enough to still
    be useful 7 years later, so customers should really be able to use their devices
    for that long. This means receiving full driver, HAL, and firmware updates from
    the manufacturer.<p>GSI builds may work for other Android forks that don&#x27;t
    care about the kernel, but GrapheneOS makes significant changes to the kernel,
    such as enabling the hardware tag-based Kernel Address Sanitizer (KASAN&#x2F;HWASan)
    (which isn&#x27;t enabled by default, even on devices that have the hardware),
    zero-on-free, as well as enabling BTI and SCS. This only works with a custom kernel,
    so it&#x27;s incompatible with GSIs.
