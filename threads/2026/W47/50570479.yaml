  text: What&#x27;s the point? If you look at the big picture, microG doesn&#x27;t
    offer much in terms of privacy (from what I understand it is (has?) been leaky
    with things like location, so that&#x27;s a privacy flaw), but is way less secure
    and offers far worse app compatibility.<p>It also doesn&#x27;t make sense to use
    microG if you look at the big picture because it&#x27;s only there for apps that
    rely on Google Play Services because they contain Google libraries.<p>Why would
    GrapheneOS, a project with limited resources, officially support microG when there&#x27;s
    a far better option?
