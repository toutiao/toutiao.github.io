  text: If I don&#x27;t get my paycheck, I immediately notice and can complain, and
    a human will be able to rectify whatever issue caused it. If I literally never
    got a paycheck again, we have decidedly non-mathematical ways of dealing with
    it (a legal system).<p>I don&#x27;t see the comparison here. Detecting issues
    in a 17 million line proof is not remotely trivial, if we accidentally build a
    bunch of math on a failed proof, we don&#x27;t have a retroactive way of getting
    all of that time and effort back.<p>I&#x27;m not saying that automated proofs
    like this aren&#x27;t worthwhile, but the parent comment did say &quot;functionally
    equivalent&quot;. The level of trust that&#x27;s needed in the people who used
    the system to produce the output is a pretty clear functional difference in my
    mind between payroll and huge generated proofs. I don&#x27;t think I need as much
    trust in someone who produces an automated proof as someone who claims that god
    told them something directly (since that&#x27;s a lot harder to believe in general),
    but I also don&#x27;t have a particularly large amount of trust in the average
    employee of Anthropic making a bold claim either.<p>There have always been a large
    number of people in the world (and still are!) that believe any number of things
    on the basis on faith rather than evidence, and it&#x27;s not crazy to draw a
    parallel between &quot;that religious authority says so&quot; and &quot;that Anthropic
    employee says so&quot;; for the overwhelming majority of people in the world,
    the claims are essentially both impossible to falsify, so at the end of the day
    we are still relying on trust (whether from that authority directly or from a
    consensus of other people we trust).
