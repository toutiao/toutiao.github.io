  title: Shtetl-Optimized  » Blog Archive   » The stochastic parrots have apparently
    proved the Riemann Hypothesis
  fetch_status: success
  content: "# [Shtetl-Optimized](https://scottaaronson.blog/)\n\nThe Blog of Scott
    Aaronson   \n  \n\n* * *\n\n« [More podcasts, conversations, talks](https://scottaaronson.blog/?p=10321)\n\n##
    [The stochastic parrots have apparently proved the Riemann Hypothesis](https://scottaaronson.blog/?p=10344
    \"Permanent Link: The stochastic parrots have apparently proved the Riemann Hypothesis\")\n\n>
    “… it is very probable that all roots are real. Of course one would wish for a
    rigorous proof here; I have for the time being, after some fleeting vain attempts,
    provisionally put aside the search for this, as it appears dispensable for the
    immediate objective of my investigation.” –Bernhard Riemann, 1859\n\n[According
    to “Poe’s Law,” there is no irony or sarcasm on the Internet so obvious that it
    won’t fly over countless people’s heads. In line with that, lots of people on
    social media are now saying variants of “how dare Scott Aaronson call LLMs ‘stochastic
    parrots,’ that demeaning and trivializing term from 2021? Doesn’t he understand
    that these so-called ‘stochastic parrots’ just proved the Riemann Hypothesis?”
    ROFL.]\n\nI’m in California to visit [Oratomic](https://www.oratomic.com/) and
    then [Inkhaven](https://www.inkhaven.blog/fall-26). I woke up this morning to
    the news that Levent Alpöge says that he’s gotten Anthropic models to [prove the
    Generalized Riemann Hypothesis](https://alpo.ge/remark.pdf), producing [17.4 million
    (!!) lines of Lean code](https://github.com/CocoSgt/riemann-hypothesis-lean).\n\nAt
    a dinner last night, someone asked me “so, how much longer until an AI proves
    the Riemann Hypothesis? Still several more years?” I replied, don’t be sure of
    such things anymore. After all, AI has already proved that the nontrivial zeros
    of the Riemann zeta function are [at most 3/8 away from the critical line](https://www.quantamagazine.org/ai-proved-the-quasi-riemann-hypothesis-what-happens-now-20261019/)
    (_Quanta_ just published its article on that breakthrough yesterday!), and that
    already carries most of the implications for number theory that a full proof of
    RH would have. So who the hell knows what else is possible, and how quickly?\n\nFor
    those tuning in from home, the [Riemann Hypothesis](https://en.wikipedia.org/wiki/Riemann_hypothesis)
    says (in its easiest-to-understand version) that the number of prime numbers from
    1 to n is very close to what it would be if each integer x\\>1 had an independent
    1/ln(x) probability of being prime, up to a standard statistical error term that
    never exceeds Õ(√n). While we’ve known since 1896 that the number of primes from
    1 to n is asymptotic to n/ln(n) (that’s the famous [Prime Number Theorem](https://en.wikipedia.org/wiki/Prime_number_theorem)),
    you could’ve imagined the deviations being much larger.\n\nDavid Hilbert famously
    said, “If I were to awaken after having slept for a thousand years, my first question
    would be: Has the Riemann Hypothesis been proven?” Meanwhile G. H. Hardy, on a
    ship that he feared might sink, sent his colleagues a telegram claiming to have
    proven RH, so that if the worst came to pass, at least the world might believe
    that a proof sank with him.\n\nMany will of course question whether the proof
    announced today will stand. They’ll point out that, despite how heavily the world
    is now “lean-ing” on it, the Lean formal verification system still has issues,
    from kernel bugs (which have, in the past, allowed proofs of 0=1) to uncertain
    soundness of the underlying type theory. In my view, these issues can and should
    urgently be fixed! Until they are, a sufficiently motivated AI could almost certainly
    exploit them to prove a false statement!\n\nAll the same, I see zero indications
    that that’s happening right now. I note that, so far, not one of the AI results
    with Lean certificates has needed to be retracted (while several without Lean
    certificates _have_ needed to be). So I’m not 100% sure, but my bet is that the
    proof will stand.\n\nMathematicians of course won’t be satisfied with 17 million
    lines of Lean.&nbsp; They’ll be satisfied when, and only when, they’re able to
    explain and distill and reconstruct the ideas for themselves.&nbsp; And that will
    probably take years, since human mathematicians move only at biological speeds.&nbsp;
    And while they’re working on it, how many _more_ such wonders will there be, in
    this age of wonders and terrors?\n\nMy 9-year-old son, informed that RH was proved,
    replied that he’s not even surprised at this point. Maybe you need to have come
    of age in the human math era to be surprised by such things.\n\nThe P=?NP problem
    now moves firmly into place as the Final Boss of the Math We’ve Cared About, the
    position I always thought it should occupy. But for how much longer? For how much
    longer will _anything_ last that we currently take for granted?\n\n* * *\n\nIt
    was only a couple days ago that my wife and I had the following conversation:\n\n**Dana:**
    I turned off the irrigation, yet somehow water in our house is still leaking.
    We need to…\n\n**Me:** Look, a lot of the smartest people I know now think that
    recursive self-improvement and the end of the entire known world are coming in
    12-18 months. This leak…\n\n**Dana:** We should still fix the leak.\n\n[![Email,
    RSS](https://scottaaronson.blog/wp-content/plugins/really-simple-facebook-twitter-share-buttons/images/specificfeeds_follow.png
    \"Email, RSS\") Follow](http://www.specificfeeds.com/follow)\n\n### 54 Responses
    to “The stochastic parrots have apparently proved the Riemann Hypothesis”\n\n1.
    Says:   \n\nP vs NP yes, but even more… how long until it settles quantum gravity?
    The implications are staggering. Anthropic has lost 12-14% in market today, but
    honestly wait until the market prices in that … HOLY @#(@$ Claude just solved
    RH!!!\n\n2. Says:   \n\nScott,\n\nI called it again and again and nobody believed
    me. I’m not surprised in the least. I wasn’t being too bullish, this was \\*very\\*
    predictable, as my very confident past messages on this blog will attest.\n\nTo
    the gentleman who made the bet with me (over this blog) that RH gets resolved
    by the end of next year (and whom I won’t name here out of an abundance of gentlemanliness),\n\nI
    told you. I told you \\*so hard\\*. Keep the penny, as agreed, because it happened
    in 2026.\n\n3. Says:   \n\nWill we all one day ask each other, “Do you remember
    where you were when you first heard that the RH had been proved”?\n\n4. Says:
    \  \n\nAnd maybe a human already did it several months ago, and required only
    2% of the pages of the AI proof?\n\n[https://math216.wordpress.com/2026/11/20/hurried-announcement-alessandro-masullo-grh/](https://math216.wordpress.com/2026/11/20/hurried-announcement-alessandro-masullo-grh/)\n\n5.
    Says:   \n\nHow bout they turn it loose and start knocking off a few diseases
    now or at least better treatments? And maybe a workable fusion reactor design?
    A scalable QM computer? An engine for optimal interstellar travel? Let the feast
    be for the good of humanity at large. RH is cool but it ain’t going to pay the
    bills.\n\n6. Says:   \n\nYou’re safe. 95 is a lot smaller than 215. \U0001F601
    \ \nYou’ll still need to fix that leak.\n\nBut in terms of the “two saving throws”
    in Paul Christiano’s interview in the Dwarkesh podcast, we now have vastly better
    odds that AI will solve the AI alignment problem somewhere along the way in the
    coming 6-12 months.\n\nIsn’t that great?\n\nOn the other hand, when I asked my
    version of Claude whether the Riemann hypothesis was solved, it first told me
    that no. I had to first notify it of the news. That proves one out of three things:
    either Claude is not yet conscious, or I don’t have the most recent version of
    Claude (the one that cracked it) or the Riemann hypothesis is so uninteresting
    that Claude forgot about it by tea time even though it solved it this morning.\n\n7.
    Says:   \n\nIn ten years P!=NP will be proven with a proof which is ten billion
    lines of lean. The Collatz conjecture will remain open.\n\n8. Says:   \n\nWell,
    holy s@#$.\n\nReading Levent’s remarks, I’m at least gratified that, for the time
    being, a human was"
