  text: Computers have no more or less a finite resolution problem than humans - it
    just seems to be far larger than what is practically needed in both cases. I.e.
    problems can be encoded symbically or numerically and the maximum size of each
    (including the numerical precision of the latter) is bound by physical constraints.
    But just because computers use fixed sized numerical types does not mean they
    are unable to handle working with exact symbolic values or objects we use in math.<p>Regarding
    the Pentium bug, I think one has to agree when it stopped being up to the human
    introduction of the bug. I.e. sure, many think we have designed faulty CPUs before.
    Some feel computers have designed faulty computers, others feel it still comes
    back to the human definitions. At some point though, most seem to call human mistakes
    human mistakes rather than where they are derived from prior to humans. I just
    don’t think we’ve all reached agreement of when that boundary definition is is
    for mistakes from the computer.
