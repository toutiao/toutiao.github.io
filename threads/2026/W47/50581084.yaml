  text: "&gt; Scott is likely seeing his career prospects disappear in front of his
    eyes<p>Why would he be seeing that?<p>The combination of a mathematician and lean
    is powerful, and the combination of a mathematician, lean, and AI is more powerful
    still.  Note that the mathematician is always part of that picture.  That is fundamental
    -- no software system, no matter how big and complicated, can actually solve <i>every</i>
