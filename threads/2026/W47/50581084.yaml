    of computer science).  If you read TFA he basically tells you what he is actually
    worrying about here:<p>&quot;the Lean formal verification system still has issues,
    from kernel bugs (which have, in the past, allowed proofs of 0=1) to uncertain
    soundness of the underlying type theory. In my view, these issues can and should
    urgently be fixed! Until they are, a sufficiently motivated AI could almost certainly
    exploit them to prove a false statement!&quot;<p>He is worried about the proof
    checking system and the possibility that an AI might exploit bugs in the proof
    checker, not the disintegration of his entire career because AI can &quot;just
