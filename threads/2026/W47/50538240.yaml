  author: mzs
  text: You can also mitigate Java4Shell by starting OpenJDK with either:<p>-XX:-UseBASE64Intrinsics
    to disable hardware-accelerated Base64 encoding and decoding, or<p>-XX:UseAVX=2
    to disable AVX-512. Apply this flag only on x86-64 hosts. OpenJDK on ARM doesn&#x27;t
    recognize it and will fail to start.
