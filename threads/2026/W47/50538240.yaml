  author: ievans
  text: |-
    Super impressive work by Calif as usual.<p>The exploit conditions are very specific but there are still going to be a lot of hosts impacted. We at Semgrep published some free detection scripts here: <a href="https:&#x2F;&#x2F;github.com&#x2F;semgrep&#x2F;detection-scripts&#x2F;tree&#x2F;main&#x2F;CVE-2026-114938" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;semgrep&#x2F;detection-scripts&#x2F;tree&#x2F;main&#x2F;CVE-2...</a><p>They look for these five conditions:<p><pre><code>  * HotSpot VM: any OpenJDK build, Oracle JDK, or GraalVM JDK. Only HotSpot generates the stub. OpenJ9 and GCJ are OK. Azul Prime (Zing), which replaces C2 with its own JIT, and any VM name not recognized as HotSpot are [?], never [!].
      * x86-64 JVM on an x86-64 host.
      * Version 17.0.6 or later, not at or above a version listed in FIXED_IN, and no newer than the newest releases checked (see below). Newer versions are [?]: they may carry the fix.
      * The JVM reports avx512_vbmi and avx512bw, and UseAVX &gt;= 3.
      * Base64 intrinsics are on and C2&#x2F;JVMCI can compile. These turn it off: -XX:-UseBASE64Intrinsics, -XX:DisableIntrinsic=_base64_decodeBlock, -Xint, -XX:TieredStopAtLevel below 4.</code></pre>
