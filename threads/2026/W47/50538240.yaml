  text: Not true.<p>AWS migrates live instances to new CPUs without needing to stop
    or reboot the guest.<p>When a migration is needed, the hypervisor begins copying
    blocks of memory to the new system, keeping track of what blocks are written inside
    the guest during the migration.  Once enough has been copied, it hibernates the
    guest, copies the remaining memory, then wakes it in the new system.  On a system
    that isn&#x27;t writing to large swaths of memory, it can take only a few milliseconds.  To
    the guest, it might appear that the CPU froze for a tiny bit of time, which could
    easily just look like a neighbor got noisy.
