  author: avidruntime
  text: 'To me, motivations should line up similarly to political motivations w&#x2F;r&#x2F;t
    pay: you want good people to be able to earn an honest living in their flavor
    of public service. If we throw the baby out with the bathwater on curbing political
    self-enrichment, paying politicians 0 dollars means that any would-be politician
    who is not already wealthy will never be incentivized to become a politician that
    is not profit seeking. How else will their bills be paid?<p>So when we brainstorm
    about ways to rethink journalists and their rewards, we should be incentivized
    in thinking about how to make the institutions more stable so that journalists
    can work on the content rather than working backwards from the content into a
    monetization strategy. For example: Looking at YouTube, we can see what happens
    when monetization is ad sharing: the incentive to create content that generates
    clicks becomes not only the best method of revenue, but it also becomes the loudest
    kind of content on the platform. Participants compete against one another and
    the broader ecosystem&#x27;s signal to noise worsens.<p>With respect to AI summaries,
    that to me is the easiest solve, and it pairs nicely with the hopeful end-game
    for AI, which is everyone having local models that they can use to summarize content
    they have access to. In this case, using AI does not kill the journalists revenue.<p>In
    truth we&#x27;re still in the era of destabilization via internet, and there aren&#x27;t
    a lot of ways to bring journalism to what it was without a lot of hard work.'
