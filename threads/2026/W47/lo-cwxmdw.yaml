  text: "Windows Settings UI to be wildly confusing\n\nThis is a strawman. The parent
    commenter explicitly said 'system administration and scripting', and the context
    it should be taken in is server and fleet admin, where tools like Active Directory
    (or Azure Entra ID or Intune or whatever they call it now), gpedit, and, of course,
    PowerShell absolutely shine. And for the record, KDE's, GNOME's, and now macOS'
    settings broadly use the same 'topics on small left pane, details in main pane'
    UI.\n\nI also find PowerShell to be overly verbose.\n\nI am very tired of this
    argument. People take one look at Get-ChildItem instead of ls and say 'too verbose!'
    (read in SpongeBob script for effect). And then they dismiss what is a damned
    good scripting and infra language.\nFirstly, there is a logic to every cmdlet:
    it is Verb-Noun. For interactive use, there are built-in aliases for frequently-used
    cmdlets, and interactive use accepts mixed-case. Most parameters are -Named, and
    there is a logic to this naming as well. These parameter names can be shortened
    to the first n letters, again, for interactive use. So one can absolutely write\nri
    -r -fo $env:localappdata/vcpkg \n\ninstead of\nRemove-Item -Recurse -Force $Env:LOCALAPPDATA\\vcpkg\n\nPowerShell's
    cmdlets all emit rich objects which can be introspected, parsed, and pipelined.
    It completely obviates cut, awk, sed, grep, cut, tail, etc. It has native JSON
    handling, and therefore also obviates jq.\nScripts, cmdlets, and functions have
    type-checking for declaring parameters. This then auto-generates help documentation
    and autocomplete. Functions have sane error-handling and can even throw exceptions,
    instead of returning some arbitrary unsigned short value.\nAll of these mean that
    PowerShell scripts can be maintained more easily. POSIX scripts, by their extreme
    brevity and honestly startling syntax are 'write-only. Anything above about 100
    lines starts to become very difficult to handle, with set -ex and miscellaneous
    hacks required.\nSince it runs on the CLR, it can natively call out to .NET methods.
    This also means that we can write a library with heavy business logic in C# or
    F#, produce a DLL, and write a wrapper script over said DLL in PowerShell and
    directly call out to methods in that DLL; no main function with args required.
    And of course, one can put a PowerShell script inside a .NET debugger and step
    line by line, column by column, just like C# and F#.\nPowerShell even has a style
    guide. This all makes PowerShell a scripting platform easily rivalling Python
    and completely blows most POSIX shells out of the water, whilst also being nice
    to use interactively. The one negative point with PowerShell is its startup time
    because it is tied to a CLR; the shortest I could get is a few hundred milliseconds,
    and UNIX shells, being native binaries, start up in a fraction of that.\n\nBut
    \"making software distribution significantly easier\"?\n\nFor the end-user, binary-first
    distribution is much easier than source-first distribution. The stable ABI of
    most Windows libraries means that one can compile for Windows 2000, and generally
    expect the same binary to run with little fuss on Windows 11. That is 26 years
    of binary compatibility that is not seen on any other platform. Windows Store
    is generally an aberration, but again, the infrastructure that underpins it—MSIX—is
    pretty slick and is competitive with the zoo of Linux package ecosystems.\nIf
    one really wants CLI package management, then winget import should work. One can
    set up a Windows dev environment basically as easily as pacman -S base-devel llvm
    with winget. There are some rough edges like packages spewing the desktop with
    shortcut icons, but I think that can be worked around and is in progress."
