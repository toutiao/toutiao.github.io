    judged that using billionaires&#x27; copyright under fair use is NOT legal if
    billionaires complain it would harm their financial interests, regardless of whether
    it <i>actually</i> would harm their interests.<p>4) The piratebay trial: Merely
    pointing people at copyrighted material, listing what is in a particular copyrighted
