article:
  url: https://nicolasbouliane.com/blog/death-by-ai
  title: AI is killing All About Berlin - Nicolas Bouliane
  fetch_status: success
  content: |-
    _Psst! There is [an update to this post](/blog/life-after-ai)._

    This is the traffic to [All About Berlin](/projects/all-about-berlin), the website that I run since 2017, and live from since 2020. After 7 years of growth, it has lost 70% 75% of its traffic to Google AI Overviews.

    When you Googled something, you used to get a link to my website. Now you get a page of ads, then an AI-generated answer trained on my content, then finally a link to my website. This has a devastating impact on traffic.

    _What it means to be first on Google_

    It’s hard to fund my work with only a quarter of my audience. Soon, I will need another way to pay my rent. Instead of writing new guides, I already spend my days preparing for that future.

    It’s not just about the money. I have poured 8 years of my life into making something good and useful. Strangers’ faces light up when they learn that I run All About Berlin. Local and federal government offices refer people to my guides. The Berlin immigration office uses my data _about themselves_. It inspired two government portals and a few similar websites in other cities.

    If my work just get mixed into an AI-generated answer, I lose my voice and my audience. My carefully chosen words lose their meaning. No one shakes my hand and buys me a beer. No one tells me how their citizenship application went.

    This is not an isolated case. Many website owners have reached out in private to commiserate. Some have paywalled their work. Others have given up and moved on. They keep the websites online, but they no longer update them. It’s just not worth it.

    It will get worse. Last week, Google has made two announcements: AI-generated answers will replace search results entirely, and they have ads in them. This is the future of the internet. No websites, just a chat box with ads.

    I don’t know where All About Berlin fits in that future.

    _This was also discussed on [Mastodon](https://berlin.social/@everton137@vivaldi.net/116613317083736027), [Hacker News](https://news.ycombinator.com/item?id=48283127), [LinkedIn](https://www.linkedin.com/posts/nicolasbouliane_ai-is-killing-all-about-berlin-when-you-activity-7463188286166138880-LSrq) and [Twitter](https://x.com/aboutberlin/status/2057423342496293243). If you are affected, [reach out](mailto:contact@nicolasbouliane.com). Let me know how you are doing. You are not going through this alone._

    * * *

