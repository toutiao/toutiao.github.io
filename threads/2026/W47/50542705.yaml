  author: jillesvangurp
  text: Getting people&#x27;s attention with things you do is a game that keeps on
    changing. I grew up before the internet was a thing. The way things work changing
    dramatically because of the internet has been a constant throughout my life.<p>The
    status quo of small websites scraping together revenue that largely depends on
    Google sending traffic their way is, for better or worse, no longer valid. Google
    is competing with AI agents now, which scrape together answers from websites and
    largely remove the need of going to these websites. Google is losing traffic to
    these agents and is itself trying to adopt a similar strategy.<p>I see people
    projecting a lot of morality here but what this boils down to is that people had
    a nice ride on Google driving traffic to websites for a while that is now disappearing.
    That&#x27;s unfortunate of course but it bounces the question back to these small
    websites about how they themselves are going to adapt and deal with their apparent
    dependence on Google driving traffic their way.<p>Part of that may be AI companies
    driving revenue to quality content. Google has done similar things historically
    through sponsored content, preferential treatment, etc. And part of this is content
    producers maybe having to find new ways of producing content and getting eyeballs
    on that content. There&#x27;s a lot of stuff competing for people&#x27;s attention
    out there. But people wanting to express themselves and finding ways to do so
    is a constant throughout history. I don&#x27;t have all the answers here of course;
    I don&#x27;t think anyone has. But I doubt people are going to be just passive
    consumers of information. They&#x27;ll want to express themselves and they&#x27;ll
    find new ways.<p>A lot of small websites were never about the money to begin with.
    I never got a single dollar for putting anything on stack overflow, Github, various
    public forums, etc. and I still did that. Stackoverflow imploded over the years.
    I noticed some big changes with Github where small projects like my own are largely
    ignored by AI agents. I have a few small projects that are definitely getting
    a lot less stars and PRs since about a year. Github wasn&#x27;t a thing until
    about 2010 of course. OSS existed and thrived before that. But perhaps not at
    the same scale.
