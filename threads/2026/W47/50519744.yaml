  text: "&gt; For example, the Julian calendar was not dropped in favor of the Gregorian
    instantaneously everywhere. Some countries, like Russia, continued using the Julian
    calendar into the 20th century.<p>An other fun one is that some of the transition
    schemes were... imaginative, let&#x27;s say. Famously Sweden didn&#x27;t want
    a hard break so in 1699 they decided that they would just skip leap days until
    they were on Gregorian. So they skipped the one in 1700, then promptly forgot
    the 1704 and 1708 ones because they were busy with the Great Northern War, as
    a result the scheme was cancelled by reverting to the Julian calendar, which they
    did by adding a second leap day in 1712 (which thus had a February 30th, and 367
    days). Sweden ended up doing the switch at once in 1753.<p>That&#x27;s calendaring
    rather than timezoning tho. Timezones really only became a factor once timekeeping
    was precise enough <i>and</i> times had to be communicated and synchronised across
    vast distances, which really came about with the railways (first formal &quot;time
    zone&quot; was the Railway Time of England&#x27;s Great Western Railway). Before
    that, cities and villages oft had their individual time based on apparent solar
    time at the location (aka a sundial). For instance Paris Mean Time was 9 minutes
    and 21 seconds ahead of London."
