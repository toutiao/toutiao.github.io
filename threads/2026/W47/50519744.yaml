  author: masklinn
  text: In fairness, Temporal largely follows the model originally defined by Joda,
    and refined in java.time. So I&#x27;d say that Java is probably one of the few
    languages with a well designed datetime library in the standard library.<p>Temporal
    does improve some things (it has more strict zoning &#x2F; less defaults, and
    improves serialization through RFC 9557), but some of the divergences are not
    necessarily improvements and rather divergences of opinion (e.g. java.time wilfully
    made non-ISO calendars second-class, Temporal makes them first class more like
    Joda, and it&#x27;s one of the things Colebourne — the lead author of Joda and
    java.time — strongly disagrees with[1], but the Temporal authors have pretty compelling
    reasons for it[2]).<p>[1] <a href="https:&#x2F;&#x2F;blog.joda.org&#x2F;2009&#x2F;11&#x2F;why-jsr-310-isn-joda-time_4941.html"
    rel="nofollow">https:&#x2F;&#x2F;blog.joda.org&#x2F;2009&#x2F;11&#x2F;why-jsr-310-isn-joda-time_4941...</a>
    <a href="https:&#x2F;&#x2F;github.com&#x2F;tc39&#x2F;proposal-temporal&#x2F;issues&#x2F;5"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;tc39&#x2F;proposal-temporal&#x2F;issues&#x2F;5</a>
