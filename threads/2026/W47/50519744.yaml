  author: hermitdev
  text: As someone who has worked with implementing date&#x2F;time functionality before,
    I&#x27;m empathize. Getting APIs &quot;right&quot; is hard, and getting it wrong
    is easy because there&#x27;s so many ways to get it wrong. Especially when you
    start getting into something like handling something like daylight saving time,
    which is inherently political and changes arbitrarily over time. I&#x27;ve spent
    most of my career in finance. I distinctly remember near shouting matches over
    what it meant to add &quot;1 day&quot; to a datetime. Does it mean adding 24 hours?
    Or, does it mean give me the same time of day tomorrow? What happens if tomorrow
    is the other side of a DST change? These seems like trivial questions, but matter
    if you&#x27;re talking about, say physical delivery of oil or gas at a set rate
    per hour.
