  author: kccqzy
  text: 'The one thing I don’t like in most datetime libraries is that for timezone
    names they all just defer to IANA time zone database. This database is a wonderful
    compendium of all time zones historically in use, but it is absolutely programmer
    oriented and not user oriented. There are two main problems: (1) it’s based on
    large cities; (2) it captures history faithfully.<p>The first problem is the bigger
    problem. If you are writing an app that asks the user for a zoned time, the user
    will want something like Nov 16 7pm eastern time. But EST is of course highly
    ambiguous and so is EDT. (The database actually gives EST to Panama Time and leaves
    EDT undefined.) The correct solution is either EST5EDT or America&#x2F;New_York.
    Neither is user friendly. The first string EST5EDT looks like gibberish to the
    average user. The second raises concerns in all other cities sharing the same
    timezone as New York. Why not have an entry for Philadelphia or Washington D.C.?
    Some even say it is inherently classist to pick the city with the biggest population,
    not the most important by some other metric. Is New York more deserving than our
    nation’s political capital? Why is Los Angeles more deserving than San Francisco,
    other than the fact that the maintainer of the database is physically in Los Angeles?
    This is an actual criticism in iOS calendar app on the now defunct Apple forums.
    If you want the user to pick a timezone you better make sure Eastern Time is an
    allowed option, and maybe also include all the cities and municipalities in the
    zone; that’s what the newest iOS does. But in any case almost every developer
    now hard codes a mapping from Eastern Time to America&#x2F;New_York if their audience
    is U.S. This feels like duplicative work better done in a library. The fact that
    a new library reaches 1.0 and doesn’t plan to add this might mean a lack of ambition
    to tackle this problem.<p>The second problem is the fact that the timezone definitions
    change according to the actual rules in effect in history. This is sometimes not
    what you want. Indeed I notice that most if not all date libraries use the proleptic
    Gregorian calendar (our current calendar system extended backwards); no library
    that I know of automatically switches to Julian calendars before the cutoff. Why
    this inconsistency? I’d argue that when most humans express a zoned time they
    expect the current rules to be extended backwards. People forget the daylight
    saving rules change in the 2000s when talking about times before that change and
    expect the current rules.<p>Not to be a detractor here for this library given
    the hard work of burntsushi, but we should aim higher.'
