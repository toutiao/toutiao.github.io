  text: I don&#x27;t agree that Java had the <i>same</i> problem. Java has had System.currentTimeMillis()
    since the beginning, and System.nanoTime() since 2005. Meanwhile, in Go, time.Now().Unix()
    performs a pointless timezone lookup and time.Since(foo) only uses the monotonic
    clock if foo has monotonic time, which is a hidden property of time.Time values
    that you can&#x27;t interrogate.<p>Of course, Go can always backtrack and expose
    the primitives, and Rust can always add a higher-level API, but as user of the
    languages, I&#x27;d rather have the latter problem than the former. It doesn&#x27;t
    help that Go&#x27;s zoned-time API isn&#x27;t very good either.
