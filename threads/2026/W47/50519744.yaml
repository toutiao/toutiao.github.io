  author: lambda
  text: The problem with this model is that then you try to build all of the libraries
    that you anticipate users are going to need in one big go before you release version
    1 of you language. Because you&#x27;re trying to do a lot at once, they don&#x27;t
    ask get the proper attention they deserve. Then, because of stability guarantees,
    you&#x27;re stuck only making backwards compatible changes in the future (or you
    risk either constant breaking changes, or big changes where a lot changes at once
    forking the ecosystem, like Python 2 to 3). So if you made any mistakes in the
    library, you&#x27;re stuck with them, only being about to deprecate but never
    really remove them.<p>The alternative is to keep a relatively small standard library,
    and a good package manager, to make it easier for people to iterate on API design
    in third party packages. Major version changes in a single library can have much
    less impact accross the ecosystem than standard library packages. Eventually you
    may get a de facto standard, and sometimes they are then later incorporated into
    the standard library.<p>This model isn&#x27;t without its downsides; it can sometimes
    mean fragmentation when standardization would help, sometimes these de facto standard
    libraries can become important enough that they run into the same ecosystem fragmentation
    issues on major releases. But it allows for more flexibility.<p>The latter model
    is what the Rust project decided on for everything outside of the most fundamental
    time types. Dates and times and timezones are notoriously hard to model in code,
    and easy to create API designs that are full of footguns, so this is a place where
    that extra freedom to iterate was more important than standardizing on an API
    early on.<p>That iteration has led to a number of different libraries, including
    time, chrono, and now jiff, allowing for exploring the space of API design to
    really get it right rather than being stuck with what was available early on.
  score: 0
