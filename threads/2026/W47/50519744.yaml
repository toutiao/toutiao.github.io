  text: In this particular matter, I can&#x27;t help but be biased against your perspective
    due to Go. In that language, the desire to meet the &quot;most common usescases&quot;
    has led to an IMO pathologically bad attitude towards doing this right. In Rust,
    only the bare primitives are exposed -- Instant, SystemTime, Duration -- but these
    at least allow for others to build better abstractions. Whereas, in Go, all of
    the primitives are kept hidden behind a &quot;good enough&quot; (it&#x27;s not)
    abstract API, and you have to break out O&#x2F;S-specific and&#x2F;or unstable
    code if you want to do things better, especially where monotonic time is concerned.
