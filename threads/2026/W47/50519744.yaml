    dependencies both expose a transitive dependency with different versions in their
    external APIs. (E.g. libA returns a Foo 1.0 and libB expects an argument of Foo
    2.0) Only library I&#x27;ve ever run into this with is raw-window-handle.<p>&gt;
    supply chain risks<p>&gt; enormous .cargo<p>These I agree with. Although honestly
    the supply chain risk is not as big with these foundational libraries as it would
    first appear, since they are almost all maintained by the same 5 rust compiler
    developers. Really the only difference is that they&#x27;re not in the rust-lang
    github organization and not shipped precompiled with the standard library
