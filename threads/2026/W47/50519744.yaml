  author: burntsushi
  text: IANA time zone identifiers are baked into RFC 9557, which extends RFC 3339.
    For sure, IANA identifiers are generally for programmers.<p>&gt; The second problem
    is the fact that the timezone definitions change according to the actual rules
    in effect in history. This is sometimes not what you want. Indeed I notice that
    sometimes all date libraries use the proleptic Gregorian calendar meaning our
    current calendar system extended backwards; no library that I know of automatically
    switches to Julian calendars before the cutoff. Why this inconsistency? I’d argue
    that when most humans express a zoned time they expect the current rules to be
    extended backwards. People forget the daylight saving rules change in the 2000s
    when talking about times before that change and expect the current rules.<p>Good
    question. One part of this answer is that the IANA tzdb does not only contain
    daylight saving time transitions. It also includes transitions from one offset
    to another, perhaps because daylight saving time was stopped or started. The other
    part of this answer is, I would guess, more pragmatic. Namely, we have structured
    data delineating time zone transitions back at least a century. If you go far
    enough back, then indeed, time zone transitions stop happening. We, however, do
    not, as far as I&#x27;m aware, have shared structured data delineating changes
    in calendar. This would also need to be organized by both location and time. For
    example, the Julian calendar was not dropped in favor of the Gregorian instantaneously
    everywhere. Some countries, like Russia, continued using the Julian calendar into
    the 20th century.
