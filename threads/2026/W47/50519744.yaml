    new project, so that the old project can still exist and receive updates.<p>I
    still say SemVer has done more harm than good for the industry... it normalized
    the idea that &quot;it&#x27;s ok to break compatibility, just bump the major version&quot;
    and then you have libraries on version 26 that break everything every time the
    author decides to feng shuei the code some more. Every major version bump should
    be thought of as a sort of &quot;grave marker&quot; indicating a place in history
    where the author messed up and had to admit the old design was literally broken,
    and every downstream dependent had to go through some amount of pain as a result.
    It shouldn&#x27;t be normalized.<p>You can say &quot;nobody&#x27;s forcing you
    to upgrade&quot; but, with the amount of vulnerabilities out there, yes, you often
    <i>are</i> forced to upgrade certain dependencies.<p>You can say &quot;just maintain
    the older versions too&quot;, and that would be absolutely great, if anyone really
    did this. In practice anything but the most recent major is neglected.<p>You can
    say &quot;I agree and that&#x27;s why I never release 1.0&quot;, and I&#x27;d
    say that&#x27;s a reasonable approach, but that just changes the problem to &quot;too
    many packages are pre-1.0&quot; and we&#x27;d have the same issue.<p>You can say
    &quot;that degree of compatibility is too difficult to expect out of open source
    maintainers&quot;, and my response is that there ought to be fewer open source
    maintainers. (For real. I&#x27;d rather have 1&#x2F;100th the number of crates
    in Cargo, if the ones that were there were all maintained by people who were serious
    about backwards compatibility.)<p>You say &quot;the API sucked and I hoped I could
    make it better&quot;, but the API <i>is</i> the library to anyone using it, and
    changing it means you&#x27;re literally changing what the library is, which means
    all existing code using the library has to change to meet your new opinion on
    what the better API is (an opinion many wouldn&#x27;t share, including and especially
    the original authors.) Why not just start a new project instead?"
