  author: skissane
  text: "&gt; why does a modern PC still wake up pretending to be a chip from 1978?<p>I
    don&#x27;t know why Intel and AMD are still doing this.<p>If they changed their
    CPUs to start in long mode (or even just 32-bit protected mode), nobody would
    notice except BIOS writers.<p>And BIOS writers expect to have to change their
    code to support new CPUs anyway. If Intel and&#x2F;or AMD made it an ultimatum,
    the BIOS vendors would comply.<p>I know Intel had a plan to remove real mode and
    16-bit support entirely, X86S, which they abandoned. But a lot of people opposed
    that because it would have harmed backward compatibility, including the ability
    to run older OS versions under virtualisation. Changing the physical CPU to no
    longer start in real mode would be invisible to everything except the BIOS, and
    even for the BIOS, only its early initialisation code would have to change."
