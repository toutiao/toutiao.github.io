  author: GeorgeTirebiter
  text: 'The way the IBM 1401 does it, because it&#x27;s a variable word-length machine
    (fields being delineated by Word Marks, which is a bit in each core location specifically
    for marking the end of a field &#x2F; instruction).<p>So the number &#x27;123&#x27;
    is stored in sequential memory locations:  x, x+1, x+2 with a word mark under
    the &#x27;1&#x27;.<p>To add (assembly: A X,Y)  e.g. &#x27;456&#x27; to said number
    at y, y+1, y+2 (in this case the 4 need NOT have a word mark (but usually does)
    because a word mark in either field ends the operation) the machine starts <i>at
    the high-order address</i>  -- so it starts at address x+2 and y+2, develops any
    carry, applies that to x+1 and y+1, adds, and finally moves to the hundreds digit,
    adding any carry from the tens. (The destination address holds the sum in this
    case, &#x27;456&#x27; goes to &#x27;579&#x27;)<p>Also, to move &#x27;123&#x27;
    somewhere, you specify the address of the &#x27;3&#x27; and the field is moved
    right-to-left to the destination  (decrementing the internal pointer, and stopping
    when finding a word mark).<p>So, it more or less was Big Endian, but was still
    able to use a serial ALU by starting at the highest address!'
