    combinations memorised, you could just use the menus.<p>But that meant 3 complete
    UIs. At the time, it was seen as a bloated mess to existing WP users.<p>WP 4.2
    was the sweet spot and ran from one 360kB floppy on an 8086. WP 5.1 needed a 286
    with a hard disk.<p>But that&#x27;s sort of my point...<p>At one point, if you
    were used to CP&#x2F;M, an IBM PC with an 8086 and two 360kB floppies was a powerful
