  text: 'In algebra &#x27;x&#x27; is used as &quot;the unknown&quot;, as in, &quot;solve
    for &#x27;x&#x27;.&quot;<p>So &#x27;x&#x27; is a textual wildcard, like &quot;*&quot;
    in DOS&#x2F;Unix shell commands.<p>x86 matches 8086, and 80186, and 80286, and
    80386, and 80486. Intel didn&#x27;t make an 80586, as mentioned upthread.<p>By
    the period of the 80286, everyone just called it the &#x27;286 for short. You
    had a 286, or a 386, or a 486.<p>Some digit followed by 86. So, collectively,
    x86.<p>In contrast, MOSTEK offered the 6502 but Commodore used the 6510, so 65xx
    was a thing although not so common.<p>On the Mac, Atari ST, Amiga, etc. the shorthand
    was 68k: this covered 68000, 68010, 68020, 68030, 68040, etc.<p>But in the 32-bit
    era, the early 16-bit Intel chips can&#x27;t run 32-bit code. So that&#x27;s the
    lowest common denominator: x86 means 386 or higher.<p>Also see Intel&#x27;s RISC
    chip family, on which Windows NT was originally written: i860.<p>86 * 10 = 860.<p>So
    it was codenamed N-Ten.<p>Dave Cutler and team got handed the planned portable
    version of OS&#x2F;2, called OS&#x2F;2 3.0, to the N-Ten. So it got called OS&#x2F;2
    NT -- the N10 version.<p>While it was underway, Windows 3 became a hit, so it
    was renamed &quot;Windows NT&quot; instead.'
