  text: "&gt; serious compute on the desktop.<p>The late great Guy Kewney wrote, I
    think in his original review of the IBM PC&#x2F;AT in 1984 or 1985 (so roughly
    when I was doing my &#x27;A&#x27; levels), something along the lines of...<p>&quot;I
    got this sudden feeling that sitting there right in front of me was... Raw. Computer.
    <i>Power.&quot;</i><p>The caps were his. The phrase has lived in my memory for
    40 years.<p>He also had a wonderful description of WordPerfect 5, that went something
    like...<p>&quot;I can only imagine the conversation at WP head office, when they
    sat down and tried to work out what they could do to top Wordperfect 4.2. And
    somehow, what came out of the meeting was: &#x27;so, what we have here is the
    world&#x27;s greatest bicycle. We know it, everyone says it. So what we&#x27;re
    going to do is: we&#x27;re going to put 11 more wheels on it.&quot;<p>These days
    WP 5.1 for DOS is held up as The Greatest DOS Word Processor Ever.<p>It was much
