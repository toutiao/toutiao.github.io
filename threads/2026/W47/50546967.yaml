  text: 'Yes, and it&#x27;s also consistent with normal bit numbering: bit n has place
    value 2^n, while byte n has place value 256^n. The vast majority of BE processors
    actually have LE bit numbering.<p>The only exception is IBM, which used both BE
    bit and byte numbering. (Bit 0 is the most significant bit, and its value depends
    on the width of the data in question --- exposing the major disadvantage of BE,
    i.e. a length-dependent term.)<p>An old adage I&#x27;ve heard and found useful:
    &quot;Little endian is Logical; Big endian is Backwards.&quot;'
