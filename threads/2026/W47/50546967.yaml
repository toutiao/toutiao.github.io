  author: chimpontherun
  text: 'Cool article, thanks!  Nitpick: the reason behind the little endianness _originally_
    was data access speed-up on 2200, not arithmetic.  The 2200 only had 8-bit arithmetic
    (as did 8008), but its address bus was processed low-to-high.  The arithmetic
    angle became relevant in 8080, with its 16-bit arithmetic.  Side benefit: casting
    between 8- and 16-bit data using the same address.<p>Another nitpick: the article
    says 8085 had multiplexed address&#x2F;data bus.  This is actually also true for
    8008, 8080 before it, and 8086, 8088, and 80186&#x2F;88 after it.'
