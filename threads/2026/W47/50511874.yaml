  author: tjeerdnet
  text: It does have a certain nostalgia seeing these screenshots, sort of comforting
    interfaces. UX-wise it could have probably been done (a lot) better, but there
    was no such thing widespread as UX-specialists as we have nowadays. In a certain
    way Visual Basic was the &#x27;AI&#x27; of easier software development, so it
    lowered the entry for people to start making things and having fun to be proud
    of what they could make. Quality was not the goal.<p>I am currently working at
    a place where the previous developer passed away a few years ago, but he was a
    die hard Visual Basic developer for around fifteen years, he must have started
    with Visual Basic somewhere around 2007. I have to maintain his code base and
    rarely make some minor adjustments to it. The application does what is needs to
    do, but the code base is hell. And some of these applications have been rewritten
    from scratch three or four times in a timespan of fifteen years and still it is
    hardly readable.<p>Ten levels deep of nested if-statements, semi human readable
    variables with funny 1337 coder names all over the place, functions having thousands
    of lines of code. I tried my best to understand some parts, but I gave up. I just
    throw Claude against it to let AI explain what the heck is going on in the code
    and also let Claude make fixes in it.<p>In the meantime I am rewriting it in another
    stack (Java) also with the help of AI. I have been developing mostly Java for
    25 years, but this year with agentic coding everything changed and AI is also
    a life saver to migrate away from Visual Basic.
