  author: cowlevel
  text: It wasn&#x27;t always that hard. VB made it <i>really</i> easy, but it was
    already quite reasonable in Win32 with a dialog resource editor - not a lot worse
    than some programs&#x27; command-line argument parsing.<p>However, for some reason,
    only Microsoft got it right???<p>I partially blame responsive design. It&#x27;s
    so much easier to just put the visual elements in the exact layout you want (absolute
    positioning) than to make sure it works on all different screen sizes, but we
    spent years preaching that absolute positioning was the devil.<p>Blame also lies
    on all the Linux GUI frameworks for being crap.<p>Blame also lies on the &quot;bucket
    of parts&quot; Linux philosophy - Linux IDEs aren&#x27;t nearly as integrated
    as Visual Basic was, since their dialog editor (if they have one) is a bolt-on
    to your existing process, and never something you <i>have</i> to use, and also
    the file format has to be compatible forwards and backwards and with forks. It
    has to be buildable headless which usually means generating a C++ source file
    which means you have to be able to edit the source file and the tool has to deal
    with that.<p>Blame also lies on the movement away from standardized GUI widgets,
    driven by the post-CSS web. These editors are good at laying out widgets, not
    at drawing random bitmaps everywhere.
  score: 0
