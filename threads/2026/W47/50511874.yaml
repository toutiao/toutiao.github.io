  author: FranOntanaya
  text: Visual Basic GUI was basically like turning the methods and properties of
    a typical OOP class into fields and buttons, it wasn&#x27;t so detached from the
    underlying API as nowadays where an interaction has to trigger a lot of different
    things (many that only exist because of ads, tracking and from having to synchronize
    front end and back end states).<p>Which also made it more natural to export an
    application as a DLL and compose it into another application, since you didn&#x27;t
    lose much logic that had leaked into the front end side.
