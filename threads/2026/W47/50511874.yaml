  text: I found out that nobody cares about desktop apps any more unless you&#x27;re
    on Mac.. but that discipline is also slowly losing to no less sloppy Electron
    apps and the web stack that consumes a tone of resources just for a single OK
    Message Box popup.<p>I moved away from Windows in the end of the 00s because of
    the love of native desktop apps OSX offered. Now.. I vibe-code better apps than
    big corps with that Electron thing.. and modern &quot;UX&quot; and I have invested
    in my own GUI toolkit that is portable so I can also port to Windows if I want...
    no problem.<p>Perhaps this is the way to come back to what was possible when we
    both were teenagers back then.<p>I find more people discover that and many apps
    are becoming smaller and uniquely crafted again (check ZigZag to replace Chrome...
    a sleek web browser compiled by a teenager in high school that brings webkit capability
    at 20MB executable bundle.)<p>I wrote my own media player that has nice winamp
    alike modern gui and a lot of features and as .app bundle is less than 1MB and
    consumes no more than 128MB of RAM while playing high quality flac files.<p>When
    I compare that to Spotify that eats 8GB after 1h... then maintaining my own digital
    library and stream from NAS just to have THE RIGHT user experience is exactly
    how you can coin that sentiment of past apps into modernity yourself buddy.<p>Build
