  text: |-
    I’m not sold on flattening the Code subtabs entirely; perhaps the problem is rather that it was poorly executed. “Code” itself is a tree/blobs view, then commits, branches and contributors are clearly Git things, license was definitely in the wrong place (it’s repository information, like the language stripes below), and Releases was badly misplaced (which people have long complained about) since it’s not a Git thing but a GitHub thing. Releases should definitely have been a top-level tab, but perhaps Code could be a reasonable tab with Files/Commits/Branches/Contributors subtabs that are actually subtabs rather than the mess that they are.
    Problem 8 is very, very wrong. “Without really losing anything” is nonsense.
    Problem 9 reinstates the language statistics from the repository home page that were removed without remark in Problem 6, and the commit information removed in Problem 8. It is, to some extent, fixing problems that it only just inflicted (though having a page with recent commits and statistics and releases—absent from his design—could be useful). But there’s a big problem with such an invasive change: it practically breaks a lot of existing links. People rely on README files being rendered at the repository root URL. You must have that at least present on the repository root, whatever else is there. Not necessarily a blocker.
    Problem 11… well, the clone link and instructions being hidden is a big deal. What’s there at present will be an utter, dismal failure in any usability testing. Something should have been done about that long, long ago. In the traditional “here’s a printout of a screenshot; you want to achieve X; where might you click to achieve that” form, I would expect a success rate of under 10%, quite possibly 0⁄100. Seriously, if you don’t know the answer because of having tried to find it at some point (probably because you remember it used to exist ten years ago): pick one and try to find it now. I expect you to fail. The feature might as well not exist for how well they’ve hidden it.
    Dated look: frankly, just go back to the 2013 screenshot and see how much better it was. The subtab problem wasn’t a problem, because the top-level stuff was a sidebar, and the subtabs that were there were in a semantically-meaningful hierarchy: Releases didn’t exist yet, and they weren’t shoehorning licence information into the wrong place. Most of the problems identified started in 2015.
