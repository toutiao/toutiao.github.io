  author: rramadass
  text: Generally when people say &quot;consciousness is an emergent property of life&quot;
    they mean &quot;at a certain scale and through specific combinations&quot;.<p>See
    also the recent discussion on <i>The Evolving Story of How Chemistry Became Biology</i>
    - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50482222">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50482222</a><p>The
    basic idea comes from &quot;Complex Systems Science&quot; (<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Complex_system"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Complex_system</a>)
    which studies systems as a whole whose properties cannot be predicted from knowledge
    of its components. The main factors to consider are scale, non-linearity, feedback
    loops, self-organization, adaptation&#x2F;evolution, network structures, emergence
    etc.<p>So for example, a single bacterium cannot be said to possess &quot;intelligence&quot;
    whereas a whole colony of them do in the sense that they seem to act as an integrated
    whole &quot;single&quot; organism.
