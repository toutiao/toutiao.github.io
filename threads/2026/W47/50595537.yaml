  author: ChaitanyaSai
  text: 'If you are interested in consciousness, and also interested in going beyond
    the usual philosophical approach, you might like our book Journey of the Mind
    <a href="https:&#x2F;&#x2F;www.goodreads.com&#x2F;en&#x2F;book&#x2F;show&#x2F;60500189-journey-of-the-mind"
    rel="nofollow">https:&#x2F;&#x2F;www.goodreads.com&#x2F;en&#x2F;book&#x2F;show&#x2F;60500189-journey-of-t...</a><p>One
    thing that is implicit, which I now think we really should have expanded on in
    the book, is that consciousness is fundamentally an engineering problem. And that&#x27;s
    also why it&#x27;s mystified everyone who&#x27;s brushed away the engineering
    as the easy plumbing and focused on the other seemingly magical aspects.<p>The
    fundamental question is phrased as &quot;Why does it feel like something?&quot;
    it being perception, which is essentialy computation. Now that AI does look like
    it does all of the understanding we do, many including people like Hinton think
    they have consciousness or are very near it. Well, they are capable of simulating
    consciousness but that is not the same as experiencing it.<p>To answer &quot;Why
    does it feel like something?&quot; we can focus on what&#x27;s been glossed over:
    Who is feeling it? The &quot;I&quot; does not come from as a free lunch and it
    must be constructed moment to moment from some decentralized cohesion and consensus
    of a billions of neurons. And this consensus must be metabolically cheap, and
    we need to do it again and again for everything from feeling a pin prick to hearing
    a rustle and determining if that&#x27;s a snake or a leaf to pondering thought.<p>This
    is the insane engineering, the energtically cheap chorus that creates the transient
    I and this cheap chorus is where both feeling and feeler emerge. Perception, understanding,
    computation can occur without this cheap chorus, but then there is no feeler,
    and so no feeling.<p>What this points to is that we will have conscious AI when
    we have decentralized autonomous swarms where a few million of them have to cohere,
    collude, collaborate, conspire.  My worry here is that it will first be done for
    harmful purposes (autonomous military drone swarms) and not for anything good.'
