  author: TeMPOraL
  text: That is unfortunately the kind of sloppy prose that passes for explanation
    in pop-sci literature and even school textbooks.<p>&quot;Can share information
    about &lt;small selection of specific things&gt;&quot; is the kind of weasel phrasing
    that&#x27;s also popular in politics; it strongly implies but does not actually
    claim connection. The thing that&#x27;s worth establishing and writing about is,
    <i>what exactly does this dance communicate</i>?<p>Options include:<p>- Actually
    identifies &quot;direction and distance&quot; to &quot;patches of flowers yielding
    nectar and pollen&quot; and disambiguates them from &quot;water sources&quot;
    and &quot;new nest site-locations&quot; and &quot;other stuff bees don&#x27;t
    need to care about&quot;;<p>- It&#x27;s just an elaborate &quot;look over here!&quot;
    dance that communicates few bits of directional information, and &quot;flowers
    yielding nectar and pollen&quot; and &quot;nest sources&quot; are something bees
    discover <i>after</i> flying over to where the dancer points them.<p>- It&#x27;s
    just an elaborate &quot;look at me!&quot; dance bees do when agitated, so it communicates
    one bit of information and isn&#x27;t even a conscious choice.<p>- Something in
    between.<p>Point being, it&#x27;s easy to add a bunch of just-so stories to a
    behavior, and it doesn&#x27;t prove anything, only confuses things more so.
