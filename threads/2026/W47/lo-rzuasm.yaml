  text: |-
    Corrupt communism.

    That's a strange way to criticize something. It's like saying "Do we have to keep criticizing dictatorships, because we also get that in authoritarian democracies like Russia."
    I'd argue in one system that's working as designed and in the other it isn't.
    Capitalism as the name implies is about prioritizing capital. And yup because of how capital works you will not accumulate much of it by good honest work, but by letting others do the work. There are many ways of doing that but the most effective ones boil down to having others generate your wealth.
    That however doesn't mean that even if the world around you prioritizes it you have to. Otherwise I think we'd have huge troubles with ambulances, firefighters, etc. But it's still a decision that goes strongly against many incentives, because even if you are an ambulance driver won't mean that if you have a health problem it will be taken care of if you don't have the capital to afford it.
    I think when people criticize capitalism in such ways it's a lot about the system's basic incentives.. It's what is optimized for. If it's capital it's not gonna be that.
    And everyone seriously studying economy will also learn that even the people that were essentially the first capitalist were aware of that but assumed that eg. a government will wield enough power to compensate shortcomings and early theoretical work also made it clear that it must do so. Fast forward to today and what you see is that individuals and corporations have the most capital and since the world is capitalist they also weird the most power. Which for example also diminishes the concept of democracy. Because if power is measured by money it's implicitly not wielded by people.
    So yeah I think people criticizing capitalism don't imply one should join the Soviet Union or something but that a system that has a bad design in terms of incentives.
    From planned obsolescence to hospitals only doing the most cost effective surgeries and companies forcing you into subscriptions the incentive is amassing more capital.
    Again this isn't something that capitalists aren't/weren't aware of. Things like monopolies and cartels used to have strict countermeasures implemented BY capitalists.
    It's just over time people over optimized so too say for rules. A problem that is so common in video games where there are also sensible rules until people optimize the fun out of them. Only in real life we are at a stage where the platers are able to influence and sometimes even freely change rules.  And if you optimize for capital you will change them to amass more capital.
    And there are the classic topics that you can also find in many games like buying all the finite stuff, be it land, natural resources, etc.  These are great ways to amass essential endless capital even if you don't lift a finger and nobody but you benefits and even for you it's "just" the number on your bank account going up.  That whole owning all the land/natural resources is that classic "means of production"thing that communists keep ranting on about. It's also not tied to capitalism per se, see serfdom and so on.
    Again that's stuff that capitalist and communist theorists agree on because it's plain obvious.
    But both are also very much overcome. We don't live in a world anymore where governments clearly have more power than individuals/organizations.
    But I think it's also clear that they current systemic incentives is causing more and more issues. And a lot of that people saw coming and everyone can see the trend. Since the current system is focused around capital the criticism is on capitalism. Maybe not on the version that was once imagined but the meaning of terms and related concept changes over time.
    So unless one establishes a term of that subset people will criticize capitalism. And side note. There are terms like neocapitalism and so on, so that even self declared capitalists had something to critiaize. They just fell out of fashion.
    But many political terms have that fate. I mean democracy pretty much reduced to going to a voting booth every couple of years. Communism went the other route and everyone means something completely different by it
