    I would push back on this in one way, while agreeing with the thesis completely. The world also needs communicators who can talk to multiple groups. This crystallized for me reading Neal Stephenson’s Anaethem, where the smart people who gave a shit wound up as this high priesthood living apart and not having any influence or say (iirc, it’s been a while). Or, as an example, on the first truly large project I ever lead, for the company’s largest client, I went into a status meeting and listed every single thing that wasn’t right. Once my confession was over, my wonderful project manager turned to the client and said, “That’s Tom’s way of saying things are going well and we are still on target.”
