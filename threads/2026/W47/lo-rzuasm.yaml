    Ayn Rand, is such an interesting writer. But she truly stands on the shoulders of giants of thought even tho she doesn't present it that way.
    Both her major titles Fountainhead and Atlas Shrugged have a central theme. What happens when you take shortcuts and don't do things in accordance to her moral philosophy that she tries to layout through monologues in the books. In Fountainhead, it is depicted in a individuals. In Atlas Shrugged its societies.
    She loves the concept of primary movers and that few people are the catalyst for actually getting shit done in this world. And to be clear she portrays the ideal man or society. As something to strive for as she said in forward in Atlas Shrugged. The ideal is typically not achievable but in the pursuit you can do some good things.
