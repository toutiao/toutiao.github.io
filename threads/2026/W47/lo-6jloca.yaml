    It’s a bit of a shame that this machine won’t see a lot of use, but I anticipate that will change as RISC-V adoption continues to grow.

    From my experience with these SoCs they really need a big leap in terms of quality and power to performance ratio. Even at rest these things tend to draw a lot of power.
