    ![](data:image/jpeg;base64,)\n\n#
    \n\nExecutive Summary\n\n- Wiz Research, Ikotas Labs, Metnir, Rapid7, and Xint
    independently uncovered two critical remote code execution vulnerabilities in
    NGINX, software used to receive and route traffic to production applications and
    APIs.\n\n- NGINX is a common default for the front door of modern web architectures,
    where it handles HTTPS and routes incoming traffic to the right application or
    API. As the [world's most widely used open-source web server](https://w3techs.com/technologies/overview/web_server),
    it powers [more than 225 million websites](https://www.netcraft.com/blog/september-2026-web-server-survey).\n\n-
    Successful exploitation could let attackers take control of affected NGINX servers,
    steal sensitive data, tamper with websites, or disrupt services.\n\n- The vulnerabilities,
    tracked as CVE-2026-123633 and CVE-2026-123007, are both rated Critical, with
    a CVSS 4.0 score of 9.2. The flaws are in NGINX itself. Websites and APIs can
    be exposed even when their own application code is secure. **Both vulnerabilities
    require HTTP/2 to be enabled on the affected NGINX server.** Additional conditions
    are described below. CVE-2026-123007 affects versions dating back to NGINX 1.9.5
    in 2015.\n\n- We reported our findings to F5, the company behind NGINX, and collaborated
    with its security team on remediation and coordinated disclosure. Organizations
    should identify affected deployments and apply the security updates when released.\n\n-
    We recommend updating affected NGINX deployments to the latest release which includes
    multiple security fixes.\n\n# \n\nResponsible disclosure timeline\n\n- **October
    21, 2026:** Wiz reports the HTTP/2 use-after-free vulnerability, later assigned
    CVE-2026-123633, to F5, including confirmed remote code execution with an ASLR
    bypass and a proposed fix. F5 confirms that another research team had previously
    reported the same vulnerability.\n\n- **November 10, 2026:** F5 supplies a patch
    for CVE-2026-123633 for review.\n\n- **November 16, 2026** : Wiz reports the second
    HTTP/2 vulnerability, later assigned CVE-2026-123007, to F5.\n\n- **November 17,
    2026** : F5 confirms that the second report matches CVE-2026-123007 and is included
    in the planned November 18 security release.\n\n- **November 18, 2026:** F5 security
    release and coordinated public disclosure.\n\n# \n\nOverview\n\nWiz Research,
    Ikotas Labs, Metnir, Rapid7, and Xint independently uncovered&nbsp; CVE-2026-123633
    and CVE-2026-123007, two critical unauthenticated remote code execution vulnerabilities
    in NGINX, and reported them to F5, the company behind NGINX. Successful exploitation
    can compromise the server running NGINX, allowing attackers to execute code, steal
    sensitive data, tamper with websites, or disrupt services.\n\nNGINX often handles
    traffic for several applications, so a single affected deployment can put multiple
    services at risk. The flaws are in NGINX itself and can affect websites even when
    their own application code is secure. **Both vulnerabilities require HTTP/2 to
    be enabled on the affected NGINX server.** Our testing of CVE-2026-123007 demonstrated
    code execution on NGINX serving ordinary static files, without a backend application
    or third-party modules.  \n  \nWiz Research used [Wiz Atlas](/blog/atlas-ai-vulnerability-researcher),
    the harness powering Wiz’s [AI Code scanning solution](/blog/introducing-wiz-ai-sast),
    to discover both vulnerabilities. Our researchers used Gemini 4 Carbon and ChatGPT
    5.6 Sol to validate the impact of both vulnerabilities, confirming that each could
    allow an unauthenticated attacker to execute code on the server. We reported our
    findings to F5 and worked with its security team on remediation and coordinated
    disclosure.  \n  \nThe integer underflow vulnerability dates back to NGINX 1.9.5
    in 2015, meaning it had been hiding in the code for more than a decade. The use-after-free
    vulnerability had been there for nearly six years. Like the [PHP2Shell](/blog/php2shell-php-rce)
    vulnerabilities we reported last month and[Java4Shell](https://calif.io/java4shell/),
    disclosed yesterday by Calif, these are memory-safety flaws that have historically
    been extremely difficult to discover and exploit. Finding them often requires
    tracing subtle interactions between memory operations and multiple code paths.
    For years, that complexity itself created a practical barrier. AI is fundamentally
    dissolving that barrier. As AI models get better at following those interactions,
    both researchers and attackers can uncover longstanding flaws in software that
    powers the internet and modern applications. The fact that multiple independent
    research teams uncovered the same vulnerabilities in both PHP and NGINX, after
    they had remained in the code for years, makes this shift particularly striking.
    And as AI capabilities advance, each new generation of models may uncover even
    more complex vulnerabilities that were previously beyond practical reach. Complexity
    can no longer be relied upon as a barrier to discovery or exploitation. This changes
    not only which vulnerabilities can be found, but how quickly longstanding risks
    can become real threats.\n\nOver time, finding and fixing these flaws can harden
    the software we all depend on. In the near term, faster discovery and a shorter
    window between disclosure and exploitation add to an already demanding workload
    for security teams. Turning a published fix into protection in production still
    takes substantial manual work, from validating patches to coordinating rollouts
    with service owners. We recommend focusing on how quickly you can reduce exposure
    in production. Identify deployments running the affected version and configuration,
    prioritize those an attacker can reach, and apply mitigations while patches are
    tested and rolled out.  \n  \nIn this post, we explain the vulnerabilities and
    their impact, and provide mitigation and detection guidance. Organizations should
    identify affected deployments and apply the security updates as soon as they are
    available. If upgrading is not immediately possible, temporarily disable HTTP/2.\n\n#
    \n\nWhat is NGINX?\n\nNGINX is the [world's most widely used open-source web server](https://w3techs.com/technologies/overview/web_server),
    powering [more than 225 million websites](https://www.netcraft.com/blog/september-2026-web-server-survey).
    It is commonly used as a [reverse proxy](https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy/)
    in front of websites and APIs. In this role, NGINX accepts incoming requests,
    forwards them to the appropriate application server based on its configur"
