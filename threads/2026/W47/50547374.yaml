  author: thaumaturgy
  text: Man, is it aggravating to read fantasies like this, as someone who&#x27;s
    trying to juggle a full-time job and hosted public services for other people at
    the same time.<p>There are two internets. One of them is open, less-commercial,
    and largely built and maintained by people whose first job is not the work they
    do to maintain this internet. That group includes a ton of open source software,
    millions of small servers scattered around the world (virtually private or otherwise),
    and is generally best-effort.<p>The other internet is fully commercialized, often
    ad-driven, fully integral to the data broker economy, and centralized behind a
    few companies that pay as few people as possible to satisfy the occasional PR
    statement that, &quot;we take security seriously and...&quot;.<p>The next stable
    equilibrium here is <i>not</i> &quot;we get a secure and open internet&quot;.
    The next stable equilibrium here is, &quot;we have no open internet, and the internet
    is now managed by just a few companies.&quot;<p>We&#x27;re already halfway there.
    Google and Microsoft combined already account for somewhere around 30% to 40%
    of email traffic. 30% of all websites are now behind Cloudflare. A few companies
    dominate social media traffic. Amazon and Shopify combined are half of US e-commerce.<p>Every
    single short-response-window exploit like this just pushes a few more percentage
    points of traffic into a handful of companies. Cheer for that, I guess.<p>When
    I have time to daydream, it&#x27;s increasingly about building a new, underground
    internet, and how best to disadvantage bots and BigCo conglomeration from the
    start.
  score: 0
