  author: Twirrim
  text: |-
    Even the US federal government (CISA and NSA) have been strongly advising companies to transition to memory safe languages for a couple of years now.  <a href="https:&#x2F;&#x2F;www.nsa.gov&#x2F;Press-Room&#x2F;Press-Releases-Statements&#x2F;Press-Release-View&#x2F;article&#x2F;3608324&#x2F;us-and-international-partners-issue-recommendations-to-secure-software-products&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.nsa.gov&#x2F;Press-Room&#x2F;Press-Releases-Statements&#x2F;Pre...</a>  (one of the goals of such advisories is it acts as a signal to the industry that in several years this will become a mandatory requirement around purchasing decisions)<p>We&#x27;ve literally decades of evidence that we cannot write software securely in languages that aren&#x27;t memory safe, for all sorts of reasons (and it&#x27;s wrong to look at it as a developer competence issue, even though sometimes that&#x27;s going to be the case, even extremely experienced and highly competent engineers write memory safety bugs in critical code we rely on day in day out.).  Not leaving yourself open to such problems is an entirely logical conclusion.  We know a large percentage of vulnerabilities in software are caused by it[1]<p>Pick a language that doesn&#x27;t have these risk factors, or pick an enforceable subset of one that makes such impossible.<p>&quot;Insanity is doing the same thing over and over and expecting different results.&quot;<p>[1] <a href="https:&#x2F;&#x2F;www.chromium.org&#x2F;Home&#x2F;chromium-security&#x2F;memory-safety&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.chromium.org&#x2F;Home&#x2F;chromium-security&#x2F;memory-safet...</a> 70% of Chrome vulnerabilities caused by it.
    Similar stories for Microsoft products <a href="https:&#x2F;&#x2F;github.com&#x2F;microsoft&#x2F;MSRC-Security-Research&#x2F;blob&#x2F;master&#x2F;presentations&#x2F;2019_02_BlueHatIL&#x2F;2019_01%20-%20BlueHatIL%20-%20Trends%2C%20challenge%2C%20and%20shifts%20in%20software%20vulnerability%20mitigation.pdf" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;microsoft&#x2F;MSRC-Security-Research&#x2F;blob&#x2F;mas...</a>
    and Mozilla: <a href="https:&#x2F;&#x2F;hacks.mozilla.org&#x2F;2019&#x2F;02&#x2F;rewriting-a-browser-component-in-rust&#x2F;" rel="nofollow">https:&#x2F;&#x2F;hacks.mozilla.org&#x2F;2019&#x2F;02&#x2F;rewriting-a-browser-compon...</a>.
    Curl is at 40%, and dropping because Daniel Stenberg has provided various helpers that avoid it (and I believe they&#x27;ve now migrated almost everything over to them) <a href="https:&#x2F;&#x2F;daniel.haxx.se&#x2F;blog&#x2F;2023&#x2F;12&#x2F;13&#x2F;making-it-harder-to-do-wrong&#x2F;" rel="nofollow">https:&#x2F;&#x2F;daniel.haxx.se&#x2F;blog&#x2F;2023&#x2F;12&#x2F;13&#x2F;making-it-harder-to-d...</a>, so there are definitely ways to do it, we just... don&#x27;t.
