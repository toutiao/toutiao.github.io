  author: samratkar
  text: Backup is a trust business. The entire product promise is &quot;your data
    is safe with us for years&quot;, and customers pay monthly for that promise whether
    or not they ever restore anything. Monetising the same customer data for advertising
    reads, to many customers, as the opposite of that promise, whatever the legal
    fine print says.<p>The opt-out pattern makes it worse. When a company with a retention-based
    model introduces data sharing and hides the off switch, it converts a quiet pricing
    or growth problem into a visible trust problem. Churn in backup products is normally
    low and slow; moves like this give a loyal, low-maintenance customer base an active
    reason to shop around, and backup is exactly the kind of product where switching,
    once started, tends to complete.<p>If the ad revenue per user is small relative
    to lifetime value, the maths on this looks bad even before reputational damage.
  score: 0
