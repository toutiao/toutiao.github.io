  text: I keep my passwords in a KeePass vault that syncs to multiple devices (computers,
    phones, tablets). I keep snapshots of the vaults so that if it gets corrupted,
    I can roll back to a previous daily version and not lose any data. And given I
    access the vault multiple times a day,  I&#x27;ll notice a corrupt vault file
    pretty rapidly.<p>Once a quarter, I rotate offsite buckets, so if my backup corrupts,
    I can restore from last quarter&#x27;s backup, otherwise I don&#x27;t test offsite
    restores, but I do run weekly metadata consistency checks in rustic (rustic check),
    but I don&#x27;t verify the data itself (--read-data). I do verify the data itself
    for my onsite backups weekly, where bandwidth is free.
