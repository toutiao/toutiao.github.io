  author: anal_reactor
  text: When I started backing up my data I instantly understood that backup service
    will browse it, so client-side encryption is absolute must-have. People who don&#x27;t
    do this shouldn&#x27;t be a part of this conversation. Rclone offers exactly this
    out-of-the-box, and it&#x27;s open-source.<p>Regarding encryption keys, you only
    need one. I memorized a long random password that also serves as encryption password
    for my computer (Linux) to the point I can enter it even when tripping balls (tested
    lol).<p>Testing restore... realistically you only need to do it like once a year
    maximum. I don&#x27;t recall the details, but either rclone does have some option
    for that, or I can simply restore and then diff. I have everything in one big
    bucket so it&#x27;s easy.<p>Things might get problematic if your data is a million
