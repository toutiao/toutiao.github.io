  author: munch-o-man
  text: good thing all my data with this is encrypted from my end haha.  Also, just
    gonna pimp out <a href="https:&#x2F;&#x2F;github.com&#x2F;afreidah&#x2F;s3-orchestrator"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;afreidah&#x2F;s3-orchestrator</a>
    shamelessly here...if you put it between your clients and the backend it is easy
    to have your data in multiple places and a cloud migration is as simple as having
    your clients make requests to b2 through s3-orchestrator, add your new backend
    you want to migrate to in the config and set the replication-factor to 2, your
    clients keep writing with no idea what is going on, meanwhile a replication worker
    is copying everything from b2 to the new backend without taking downtime.  Once
    replication reaches zero just drain the b2 backend so write stop going to it,
    and let it safely unwind itself, then remove it from the config.  migration done,
    basically zero downtime other than a quick service restart.
