  author: btown
  text: 'If I was asked to armchair-pattern-match, I&#x27;d say that there&#x27;s
    a combination of two things: (a) a wider fear-based environment where rapid modernization
    is being pushed heavily, and (b) an increase in tools that give false confidence
    on change management.<p>AI is tuned to speak confidently and ship independently;
    it is rare that it will suggest that one go back to a broad survey of stakeholders
    to ensure no Chesterton&#x27;s Fence is being torn down (<a href="https:&#x2F;&#x2F;fs.blog&#x2F;chestertons-fence&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;fs.blog&#x2F;chestertons-fence&#x2F;</a>). &quot;I&#x27;ve
    read the documentation and logs, and nothing suggests this system needs these
    legacy capabilities&#x2F;components&#x2F;capacity&quot; is something we hear all
    day, and it is a siren&#x27;s song if there ever was one.<p>Couple that with a
    general (and valid!) consensus that modernization of legacy systems must be accelerated
    for a variety of reasons - to mitigate this new and continuing &quot;Black October&quot;
    of hyper-agile agent-driven cyberattacks (whether the network is public or private);
    to have more flexible infrastructure for new features to stay ahead; to allow
    human teams to show their efficacy in a world where technology jobs are increasingly
    at risk - and you have a perfect storm where change management is no longer what
    it once was.'
  score: 0
