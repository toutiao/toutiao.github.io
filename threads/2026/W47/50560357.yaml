  author: nextaccountic
  text: 'You&#x27;re partially right, the body of a skill is just documentation. The
    actual innovation here is skill routing: agents load just the description of the
    skill, and load its body only when it&#x27;s necessary.<p>Nowadays skills are
    probably not needed in most cases. Agents can already decide to load documentation
    when it&#x27;s needed, even with no skills. (also it probably makes no difference
    to add a skill, or add a line to AGENTS.md saying to consult docs&#x2F;something.md
    or some website, apart from organization of the instructions, for human purposes).
    The value of skills is to provide a reminder of a list of procedures and other
    stuff that the human user consider important. So it&#x27;s possible that for some
    given session, the agent wouldn&#x27;t consider on their own to look up what&#x27;s
    new in Postgres 19, but was nudged into looking into it because of a skill.<p>The
    downside, of course, is bloating all sessions with a list of skill descriptions
    in context, even when the skill is not needed. That&#x27;s why people should generally
    curate the list of skills for each project.<p>Anyway yeah if you are thinking
    just about migrating a project to postgres 19, a skill is probably not a great
    fit (since we generally migrate just once). But since agents probably don&#x27;t
    have yet in their weights the new postgres 19 features, it&#x27;s probably a good
    thing to remind them of the new features if they work with postgres 19 every other
    session.'
