  content: "Science News\n\nfrom research organizations\n\n* * *\n\n# Energy drinks
    linked to 11 times more reports of cardiac arrest\n\nFULL STORY\n\n* * *\n\n![Energy
    Drinks Linked to Cardiac Arrest](/images/1920/cybersport-gamer-drinking-energy-drink.webp)\n_Popular
    energy drinks and stimulant supplements are raising heart health concerns after
    researchers uncovered strikingly higher rates of reported cardiac arrest and heart
    attacks, particularly among young adults. Credit: Shutterstock_\n  \n\nEnergy
    drinks and stimulant supplements are raising new concerns about heart health after
    researchers discovered a striking pattern in reports of serious cardiovascular
    emergencies. Products containing caffeine and other stimulants appeared far more
    frequently in reports of cardiac arrest, heart attacks, and other heart problems
    than products without these ingredients.\n\nThe findings were particularly concerning
    among younger adults. People ages 18 to 34 accounted for a substantial share of
    the reported heart problems involving caffeinated products, according to independent,
    preliminary research presented at the American Heart Association's Scientific
    Sessions 2026.\n\nResearchers emphasized that the findings do not establish that
    energy drinks or stimulant supplements caused these medical emergencies. However,
    the unusually high frequency of certain cardiovascular events in FDA safety reports
    suggests that these widely available products deserve closer examination.\n\n**Growing
    Concerns About Energy Drinks and Heart Health**\n\nThe energy drink industry has
    expanded rapidly, with sales more than doubling over the past decade and exceeding
    $20 billion in 2024. Despite their popularity, scientists still have limited information
    about the cardiovascular effects of energy drinks and supplements containing stimulants.\n\nExisting
    evidence suggests that consuming large amounts of caffeine can harm the cardiovascular
    system. Medical professionals have also documented cases of arrhythmias (irregular
    heart rhythms) and sudden cardiac death following the consumption of these products.
    Some of these incidents involved young adults who had no previously identified
    risk factors for heart disease.\n\nA 2026 American Heart Association Scientific
    Statement on caffeine and cardiovascular disease indicates that most adults can
    generally consume up to 400 mg of caffeine daily without significant safety concerns
    (the equivalent of up to 5, 8-ounce cups of regular black caffeinated coffee).\n\nHowever,
    caffeine concentrations can differ dramatically between products. Certain energy
    drinks provide up to three times as much caffeine per fluid ounce as brewed coffee,
    while some pre-workout supplements contain more than 12 times the concentration
    found in coffee.\n\nAnother concern involves how these products are regulated.
    The U.S. Food and Drug Administration (FDA) classifies energy drinks and stimulant
    supplements as foods or dietary supplements rather than medications. As a result,
    they are not subject to the same safety testing requirements that medications
    must meet before entering the market.\n\n\"These products are marketed as everyday
    pick-me-ups and sold next to soda and bottled water, so most people assume they
    carry no real risk,\" said study author Sai Samayamanthula, a fourth-year medical
    student at the University of Virginia School of Medicine in Charlottesville, Virginia.
    \"For many healthy people, if these products are consumed occasionally, the risk
    is probably small. However, individuals who consume energy drinks or other stimulant-containing
    supplements regularly can quickly exceed the recommended daily limit for caffeine,
    so it's important for people to know that there may be a risk of cardiovascular
    harm with these products.\"\n\n**FDA Reports Reveal Striking Differences in Cardiac
    Events**\n\nTo investigate possible cardiovascular safety concerns, researchers
    examined a federal database containing reports of suspected adverse reactions
    to foods and dietary supplements. They compared products containing caffeine and
    other stimulants with products that did not contain these ingredients.\n\nThe
    comparison group included commonly consumed products such as soft drinks, smoothies,
    vitamins, protein bars, and meal replacement shakes. Researchers examined reports
    involving people ages 13 and older submitted between 2017 and 2025.\n\nSeveral
    differences stood out in the analysis:\n\n- **Cardiac arrest:** Reports involving
    caffeine and stimulant products were approximately 11 times more likely to mention
    cardiac arrest than reports involving products without these ingredients.\n- **Heart
    attacks:** Heart attacks appeared about 4.5 times more frequently in reports associated
    with energy drinks and stimulant supplements.\n- **Abnormal heart rhythms:** Reports
    involving stimulant products were roughly four times more likely to include ventricular
    arrhythmias (abnormal rhythm in the heart's lower pumping chambers) or heart palpitations.\n-
    **Other cardiovascular symptoms:** The researchers also identified higher reporting
    frequencies for rapid heart rate (nearly 3 times more often), chest pain (2.71
    times more often) and fainting (about 2 times more often).\n- **Young adults:**
    Approximately 45% of cardiovascular event reports involving caffeine and stimulant
    products concerned adults between ages 18 and 34.\n- **Men and women:** Comparable
    patterns appeared in reports submitted for both sexes.\n\nThese differences describe
    how frequently certain medical problems appeared within the FDA reports. They
    do not mean that people consuming energy drinks face an 11 times greater actual
    risk of cardiac arrest or a 4.5 times greater risk of having a heart attack.\n\n\"Our
    findings support the case for more systematic safety monitoring of caffeine- and
    stimulant-containing products. In addition, healthcare professionals should remember
    to ask their younger patients who have palpitations, chest pain, or fainting spells
    if they recently or regularly consume these products,\" Samayamanthula said.\n\n**Why
    Young Adults May Be Particularly Vulnerable**\n\nOne of the most notable findings
    was the large proportion of cardiovascular reports involving younger adults. Researchers
    have not yet determined why the connection between stimulant products and reported
    heart problems appeared so frequently in this age group.\n\nSeveral explanations
    are possible. Younger consumers may use energy drinks and stimulant supplements
    more often, increasing the likelihood that these products appear in reports of
    medical emergencies.\n\nHow the products are consumed could also influence the
    pattern. Potential contributing factors include the circumstances surrounding
    their use (for example, consuming them before intense exercise or mixing them
    with alcohol or drugs). Some individuals may also have previously undiagnosed
    heart conditions that could make them more susceptible to cardiovascular complications.\n\nThese
    possibilities remain uncertain, and additional research will be needed to determine
    which factors, if any, help explain the unusually high reporting frequency among
    younger adults.\n\n**Do Energy Drinks Actually Cause Heart Attacks?**\n\nAlthough
    the results raise important questions about products containing concentrated caffeine
    and other stimulants, experts caution against interpreting the findings as proof
    of a direct cause.\n\n\"This study raises concerns that products with very high
    amounts of caffeine may be harmful to the cardiovascular system,\" said Gregory
    M. Marcus, M.D., M.A.S., FAHA, chair of the 2026 American Heart Association scientific
    statement on caffeine and cardiovascular disease. \"Although there are biological
    reasons why that connection could be possible, the study does not prove that caffeine
    products cause these events, because other factors may have influenced the results
    found in this analysis. More research is needed to understand whether these stimulant
    products are truly responsible for the reported heart-related events.\"\n\nMarcus
    did not participate i"
