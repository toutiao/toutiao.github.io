  text: |-
    Of course, there are rules and rules, and it heavily depends on the person.<p>I have colleagues (and friends) who drink 6-8 espressos a day. But usually, the people around them will ask whether that&#x27;s a little too much, etc.<p>For example, it&#x27;s very very common to have your coffee at home in the morning (using a moka pot, which can make it more diluted — or not, depending on how much coffee you use — or a capsule machine). Other people skip that and go to a bar for a cappuccino, but that&#x27;s basically just an espresso with milk.<p>I usually don&#x27;t drink coffee in the morning because I think it&#x27;s a placebo effect, but that&#x27;s another story.
    Then you might have one in the middle of the morning, one after lunch, one in the middle of the afternoon, and one after dinner.<p>Personally, I usually have one after lunch and one after dinner (two in total).<p>But having coffee at these different times is pretty common: breakfast, mid-morning, after lunch, and then in the afternoon or after dinner.<p>I don&#x27;t see huge regional differences when it comes to coffee (as far as I can remember, unlike food, which varies quite a lot depending on the region).<p>But, as a rule of thumb, based on my life experience, if you&#x27;re someone who drinks 4+ coffees a day, the people who care about you might start getting a little concerned (Not that much, but the conversation maybe pop out)
