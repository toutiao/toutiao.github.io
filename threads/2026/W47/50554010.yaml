  author: Spalau
  text: It is false that software doesn&#x27;t wear out. The way it wore out in the
    past was through the development of new versions that worked faster and had more
    useful features.<p>What happened with software is that innovation stalled. A lot
    of software lost features, such as when Excel allowed users to drag and drop data
    into a chart to add other series.<p>Instead, software focused on changing the
    interface aesthetic, changing the way it works, forcing users to retrain for no
    gain in productivity, and making them lose muscle memory. It broke compatibility
    without offering a better replacement, like MS Office abandoning VB integration.
    And instead of getting faster, new software gets slower despite demanding more
    hardware.<p>In the past, you could learn to use a program by reading the help
    files. Today, they don&#x27;t even include help files, or the help is useless.
