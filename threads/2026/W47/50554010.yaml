  title: 'Software companies are trying to kill home computing: lateblt — LiveJournal'
  fetch_status: success
  content: "# Software companies are trying to kill home computing \n \n \n If you
    use a computer or any other device which runs software on it, here's something
    which you might want to know: Software companies are not your friends, and in
    fact, they are trying to kill personal and home computing.  \n  \nThe reason for
    this is simple: Software companies, like any other business, are out to make money,
    but what's good for computer users is not good for software companies, and the
    reason for this is that software companies are not selling a physical product.
    \ \n  \nHardware companies are different. Hardware companies usually want to make
    good products, because they can get repeat sales. Hardware wears out, breaks,
    or simply gets replaced, and so in the hardware business, mostly the same laws
    of business and economics apply as in any other home-appliance business such as
    selling refrigerators, ovens, and washing machines. I say \"mostly\" because computer
    hardware is still experiencing some minor amount of technological development,
    particularly in the field of GPUs, but in contrast to the 1980s and 1990s, this
    development is no longer proceeding so rapidly that it's likely to fuel an upgrade
    cycle (a person today is not likely to buy a new computer because their old computer
    is obsolete, for the simple reason that computer hardware no longer advances quickly
    enough for a still-operating computer to become obsolete within its working lifetime),
    but people who want to have the absolute latest technology may still buy new hardware
    for that reason alone; this is a fairly small niche of hardcore technology enthusiasts,
    but such consumers may provide considerable revenue to companies like Nvidia,
    which specialize in bleeding-edge hardware. Most other hardware companies, however,
    are selling commodity hardware in an established market which is not likely to
    experience much growth or other change, and thus the business model works on the
    same principle as companies selling refrigerators: You're selling durable goods
    to people who are making a one-time purchase, but if your products are good, then
    you'll develop a reputation for quality, and so other people in the situation
    of making a one-time purchase will also buy your products. There _are_ some hardware
    companies which take the opposite approach, namely the thinking that if you sell
    fragile products which break quickly, then you can get more business because people
    will buy replacements more quickly, but the same principle applies here as in
    other businesses selling physical products, like the car business: If you develop
    a reputation for selling cheap junk which breaks quickly, then you'll lose a lot
    of business long-term, so _most_ hardware companies (at least those with widespread
    name-brand recognition) want to protect the value of their brand and sell good
    products which work well and last a long time. Business comes not from customers
    re-buying stuff to replace cheap junk which breaks quickly, but quite the opposite:
    From customers who need to replace hardware which worked well for long enough
    that they feel it's worth buying another product from the same brand. Hardware
    companies are selling a real, physical good which can't be copied but which can
    wear out with time, and so just as with companies who sell refrigerators and cars,
    this provides some steady level of business.  \n  \nThe same is not true for software
    companies. The problem with software is that if you make a really good product,
    it will only get bought once. Software doesn't wear out; it has no moving parts,
    and so one software program which does its task very well can keep functioning
    forever, in the way that a math formula never stops working. Of course, unlike
    hardware, software can also be copied, and software piracy is a serious problem
    as well, but even when customers buy a software product legitimately, the problem
    remains that if the software works well, it will only be bought once, and people
    may use it indefinitely without paying any money to the software company after
    that.  \n  \nIn the 1980s and 1990s, personal computing was still in its infancy,
    and no one had yet figured out what kinds of software people and businesses would
    or could use in their everyday work, so software companies could still make a
    living by being creative and introducing new features or even whole new types
    of programs. Today, however, patterns of software usage are long established:
    We know what kinds of programs people use and want to use, what kinds of features
    they use and don't use, and so there is not much room left for creativity or innovation,
    not much possibility remaining for creating new programs for people since all
    the software which the world needs has not only already been created, but in fact
    released as open-source software, given away for free on the Internet.  \n  \nIn
    other words, there is no need for any new software. How can a software business
    stay in business in an environment where there is no need for their products?
    How can _any_ business stay in business when the market for their product has
    dried up? In most cases, such a situation would signal the end of the industry:
    Typewriter companies hardly exist anymore, because computers with laser printers
    can produce printed pages faster and more easily than a person working with a
    typewriter. The typewriter market didn't evolve; it disappeared entirely. Okay,
    this isn't _strictly_ true; typewriters are still used in remote locations without
    electricity or in other situations where operating a computer is impractical,
    but this is such a niche usage that you probably haven't seen anyone productively
    using a typewriter in decades. The point still stands: When the need for a particular
    product disappears, the market for that product disappears, too. For the vast
    majority of users today, just as with typewriters, the need for new software disappeared
    decades ago, because all the software people need has already been written. So
    for software companies to remain billion-dollar businesses, they can't make their
    living selling things which people actually use or need. They need to make a living
    some other way.  \n  \nIn recent years, that \"other way\" has often focused on
    turning software into a service rather than a product: The phrase \"software as
    a service\" has become ubiquitous, and in fact, the tag \"as a service\" has become
    such a cliché that whole new industries have sprouted around the idea of selling
    something \"as a service\"; there's even [a Wikipedia article](https://en.wikipedia.org/wiki/As_a_service)
    which lists several such variants, including data-oriented products such as \"database
    as a service\", \"IT as a service\", \"desktop as a service\", and even \"DDoS
    as a service\" (the article lists several illegal cybercrime services which are
    being sold on a per-use basis), but also several things which are physical products,
    such as \"transportation as a service\" (which, in its most basic form, is just
    a new term for taxi rides and car rentals), \"energy storage as a service\" (which
    sounds like just a new term for paying the electric company, but is a bit more
    complicated than that because it focuses on having an on-site energy _storage_
    system, which can be a set of batteries or something larger and more complex than
    that), and even \"lighting as a service\" for people who don't want to own their
    own lighting fixtures. The idea of loaning out physical products as a service
    is not a new one, and historically has made sense for customers when it would
    be cheaper to rent something than to buy something. Perhaps the most common and
    familiar form of this business model is the car-rental business: If you're travelling
    somewhere on a short-term trip, it's obviously easier and cheaper to rent a car
    there for the duration of your stay rather than to buy a car there. Other more
    niche businesses have long-standing traditions, such as tuxedo rental: Most people
    rarely wear tuxedos except for special occasions such as weddings,"
