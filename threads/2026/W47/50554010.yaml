  author: Exmoor
  text: "&gt; Shrinking demand makes prices go down, not up.<p>In a simple supply&#x2F;demand
    scenario, yes, but when shrinking demand causes manufacturers to spread costs
    across a smaller market it can lead to higher prices. A good example is hard disk
    drives. As the market moved to SSDs the constant cost decreases that had been
    reliable for decades started stabilizing or even rising. I paid $15&#x2F;TB for
