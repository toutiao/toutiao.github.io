  author: EvanAnderson
  text: I think enthusiast computing is dying. Home users will be able to buy packaged
    laptops and some desktop PCs, but I think the era of enthusiasts building &quot;gaming
    rigs&quot; and such is coming to an end. I think it&#x27;s being ushered out by
    a feedback loop of high prices driving market contraction and, in turn, driving
    prices even higher as demand shrinks. Gaming will move to real-time streaming
    and there won&#x27;t be a need or a market for GPUs and high performance CPUs
    in the enthusiast market.<p>Home computing, in the context of having a marginally-powerful
    computer or phone &#x2F; tablet with minimal storage and RAM in the home, will
    continue just fine. Subscriptions for storage and applications are already becoming
    the norm, and with the skyrocketing cost of storage the market for large capacity
    storage targeted at enthusiast and home users will dry up, too.<p>The industry
    wants users to rent everything.<p>Storage rental is particular pernicious, to
    me, because being able to store your personally-created works in a manner that
    maintains confidentiality is to cornerstone of digital sovereignty. Being forced
    to store your data in systems that will use your data for model training is definitely
    desired by the industry. If they can con users into renting that storage and giving
    up their data to model training so much the better.
