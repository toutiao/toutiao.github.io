  author: webstrand
  text: I&#x27;ve never lived anywhere with low enough connection latency to accommodate
    real-time streaming of an action game, and my bare packet latency is 20ms to the
    nearest data-center (that I know of and can ping anyway). Add any latency in the
    input processing of the game, time to encode&#x2F;transfer&#x2F;decode the frame,
    and any local input latency on the client and you’re easily looking at an extra
    50-100ms over playing locally, which is well into the range people can actually
    feel in anything twitchy. Turn-based or slower games would probably be fine, but
    I don’t see shooters or fighting games moving to streaming for anyone who doesn’t
    happen to live next door to a data center.<p>There might be some unexploited latency-masking
    tricks in client-side cursors and client-side reprojection (the <i>timewarp</i>
    trick some VR uses to rotate the camera without receiving a new frame), but I
    suspect the legacy internet connectivity of rural and suburban homes in america
    will be a serious barrier to widespread adoption of real-time streaming. If local
    hardware gets priced out of reach, it could rather mean the end of gaming as a
    widely accessible hobby instead of a switch to real-time streaming?
