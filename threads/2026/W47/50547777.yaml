  text: 'Well wouldn&#x27;t you think the AI execution of this checklist will be way
    more thorough? Which isn&#x27;t everything, mind you. But to me it seems the risk
    is A) it doesn&#x27;t ask the right questions of the well-defined information
    it needs to gather and B) it doesnt have or cant get access to all the information
    it needs.<p>But in terms of executing on the check list I think it would consistently
    do much better.<p>If you have every asked AI to investigate some sort of mystery
    - like something no one truly knows the answer to - it is very good at gathering
    information and even forming good hypothesis. I&#x27;ve done this and when it
    usually gets to a dead end or gives up, you can find facts that it shares and
    ask more questions: &quot;You said X and Y. That makes me think of Z, which doesnt
    directly have to do with anything we talked about, but could it shed any new light?&quot;
    Etc. Just making connections and sparking new avenues to explore.<p>I have so
    say, it&#x27;s really, really fun to use AI for this sort of thing. To investigate
    novel problems. Doesn&#x27;t have to be full on scientific research. You will
