  text: No, they didn&#x27;t. Not standardized procedures. Surgical checklists specifically
    certainly did, though, no disagreement there. But everything else? Florence Nightengale
    popularlized a standardized &quot;hospital corners&quot; as a way to help ensure
    sanitation in hospitals in the 1800s. A+P grew up alongside pilot checklists.
    It&#x27;s just as fair to claim pilots borrowed from A+P as it is to claim A+P
    borrowed from pilots. Exacting manufacturing and industrial processes and procedures
    predate aviation by a few hundred years. Standardized military procedures predate
    aviation, too. They&#x27;re actually what aviation checklists derived from.<p>But
    even if all of those other fields did derive the standardization of procedures
    and checklists from aviation checklists, so what? My point isn&#x27;t that others
