    (juice 20% off) on any given day and those prices are in fact cheaper than they
    would be in Germany for the same product.<p>Germany had lower prices in general
    but if you stuck to sale prices, Austria was cheaper.  The thinking is that Germans
    will recognize a more expensive store and not go there again even if some stuff
    is cheaper sometimes.  Austrians are unconcerned and if they are price sensitive
    will buy what&#x27;s on sale and just wait (and if they&#x27;re well to do then
