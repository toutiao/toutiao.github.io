  author: GrantMoyer
  text: I have a bone to pick with Amazon. I believe their return process is intentionally
    obtuse to get customers to give up and eat the cost of Amazon&#x27;s poor quality
    control.<p>I bought a 15$ music CD sold and shipped by Amazon. They sent me wrong
    CD. The listing says it&#x27;s the edition with a bonus track, but they sent me
    the edition without a bonus track.<p>I&#x27;d like to have them send me the right
    item, so I look at the return process on the website, but there&#x27;s no option
    for &quot;you sent me the wrong thing&quot;; the closest is &quot;the item is
    defective&quot;, but that option specifically says they&#x27;ll send me the same
    item after they recieve my return, which is exactly what I don&#x27;t want. There
    is no &quot;something else&quot; option.<p>I look for a support email where I
    can make a request with the full details. The support website is a labyrinth,
    and there is no support email.<p>There is a chat option, so I use chat support
    and explain the situation. The support person says I have to wait 48 hours after
    recieving the item to begin a return, I point out that&#x27;s contrary to Amazon&#x27;s
    return policy. The support person doubles down and refuses to start a return.<p>There&#x27;s
    no support phone number, but there&#x27;s an option to request they call me. I
    make the request and am called by an automated phone system. It eventually connects
    me to a human support person. I describe the problem to the support person over
    the phone, and he redirects me to a different support person. I describe the issue
    again to the new support person, including that the &quot;defective item&quot;
    option on the website says I&#x27;ll be sent the same item. He explains that he
    cannot resolve my situation, so he reccomends that I file a return through the
    website with the &quot;defective item&quot; option anyway, but he can&#x27;t guaruantee
    they&#x27;ll send me the right item. He never mentions the supposed 48 hour cooldown
    period.<p>I file the return through the website, and drop off the item for return
    shipping the same day. A month and a half later, I recieve the replacememt item.
    It&#x27;s the same wrong item.<p>I request another callback from Amazon again
    the next day. When I get to a human support person, I explain that I was sent
    the wrong item, then sent the same wrong item again as a replacement. I&#x27;m
    transfered to a &quot;specialist&quot;. I confirm that I recieved the wrong item
    and replacement again. I&#x27;m told I need to upload a photo of the wrong item
    to a link they will send me by email. Immediately after the call, I take a photo
    and upload it at the link.<p>12 days later, I haven&#x27;t heard back. I request
    a callback for the third time. I explain the situation, and that I called 1 or
    2 weeks ago and submitted documentation. I&#x27;m told a return is the only option;
    Amazon will not send me the item I ordered. I double check that there&#x27;s no
    way to have the correct item sent, since I just want the CD I ordered, and the
    support person confirms it&#x27;s not possible. The support person opens a return,
    and I drop the item off for return shipping the same day. 12 days layer, Amazon
    refunds the money to my account.<p>Overall, the process took over two months,
    a chat session, three phone calls, and Amazon paying for shipping both ways two
    times, all for a 15$ CD, and in the end the problem wasn&#x27;t even resolved.
    Any sane company would have resolved the problem on the first contact with support
    with a simple &quot;oh yeah, oops, we sent the wrong item. We&#x27;ll send you
    the right one.&quot; I have not ordered anything from Amazon since.
