  author: arbuge
  text: One big issue with Amazon reviews is that people who never actually purchased
    a product can still leave reviews on them. The only difference with actual purchasers
    is that the latter get a tiny note on their review saying &quot;Verified Purchaser&quot;.
    I&#x27;ll hazard a wild guess that most people browsing on the website pay no
    attention to those. In any case, the total review score and star rating at the
    top of the listing, which everyone definitely pays attention to, is computed on
    the aggregate. Nobody is scrolling through a thousand plus reviews and working
    out in their head how many are verified purchasers and how many not.<p>Frequently
    disgruntled customers will leave dozens of one star reviews on a seller&#x27;s
    entire product line because they didn&#x27;t like one single product. Arguably
    competitors of that seller could be doing that too. There&#x27;s nothing to stop
    them. The reverse presumably works too and many defective products could be getting
    shady five star reviews. Allowing only verified purchasers to review products
    and deleting all unverified purchaser reviews would go a long way towards fixing
    things and re-establishing customer trust IMHO.
  score: 0
