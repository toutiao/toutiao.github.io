  author: amluto
  text: It’s that, plus another point.  Suppose a model showed up with a perplexity
    on the same dataset of approximately zero. I wouldn’t think “wow, this model is
    amazing”.  I would think “hmm, this model appears to be able to generate the entire
    dataset from just short prefixes”, which suggests that the dataset has been memorized.  After
    all, a real dataset will have nonzero entropy in the sense that there are genuine
    choices with multiple good outcomes in the making of the dataset.<p>Schematically
    (I don’t think this is quite a valid use of information theory) driving perplexity
    below the a priori entropy would mean something like the entropy of the data given
    the model weights is less than the entropy of the data.  And the model weights
    definitely post-date the data, and this would easily explained by the model weights
    depending on the data, which would suggest that the data wasn’t actually as held-out
    as intended.
