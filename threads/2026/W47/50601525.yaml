  author: famouswaffles
  text: We have long since known that there is a single factor that explains ~40%
    of the variation of cognitive tasks and abilities in humans (similar results can
    be found in other animals). We called that factor the general intelligence factor,
    or g.<p>Essentially, Humans who tend to have higher verbal skills also tend to
    have higher spatial skills, better memories, and faster processing speed. Someone
    with the cognitive ability to become an exceptional chemist might just as easily
    have become an exceptional mathematician or software engineer (all else being
    equal).<p>The knowledge and skills required are obviously different, but the underlying
    cognitive abilities that make someone successful in one intellectually demanding
    field often transfer to others.
