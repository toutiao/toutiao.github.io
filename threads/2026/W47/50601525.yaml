  author: akoboldfrying
  text: In theory you can represent any finite set of actions as a prefix code, and
    then repeatedly generate both possible next bits (1 or 0), predict the value that
    an optimal action beginning with that bit would lead to, and choose the bit value
    that scores higher. This can be extended to countably infinite sets of actions,
    where each action can be described by a finite-length bit sequence. That doesn&#x27;t
    get you all the way to continuity, but enables, for example, a single action to
    encode any finite number of numbers written out to any required level of precision,
    which should be enough for &quot;engineering purposes&quot;.<p>It seems to me
    that the effectiveness of such a system would depend heavily on actions being
    encoded &quot;well&quot;, so that at every bit position, the &quot;meanings&quot;
    of the subset of actions beneath that point in the tree are separated as well
    as possible by whether they begin with 1 or with 0.
