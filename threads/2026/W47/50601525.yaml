  author: ACCount39
  text: It could indeed, in theory. But in practice, perplexity-as-measured rises
    due to &quot;controlled mode collapse&quot; nature of RL training.<p>Things that
    are useful for base model &quot;next token prediction&quot; can be useless or
    even actively harmful (should I elaborate?) for CoT, so the model ends up suppressing
    them under RL pressure. Likewise, things that are useful for CoT can harm base
    model next token prediction.<p>But I bring up &quot;perplexity-as-measured&quot;,
    &quot;controlled collapse&quot; and &quot;suppression&quot; because I don&#x27;t
    believe that this &quot;ruins&quot; the model&#x27;s underlying prediction capabilities.
    Generally, it merely redirects them - brings them more in line with what we care
    about. It may well be that with a more elaborate training and measurement setup,
    RL would indeed improve the &quot;perplexity proxy&quot; metric.
