  author: chubot
  text: I thought that too, but models are trained on observation now, to increase
    agent performance.  This is new data that is separate from Internet crawls.  I
    think it&#x27;s done with reinforcement learning with verifiable rewards<p><a
    href="https:&#x2F;&#x2F;github.com&#x2F;opendilab&#x2F;awesome-RLVR" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;opendilab&#x2F;awesome-RLVR</a><p>Examples:<p>-
    When playing Go or chess, nobody may have written or published web pages with
    a particularly clever end game, but an agent can use CPU time to discover these
    games themselves, and learn from them.  Human Go players report learning strategy
    from what AlphaGo discovered.<p>- Agents use Unix shell and are trained with it.  So
    they can discover things and combine things that nobody has written about on the
    Internet, like how to debug a rarely used driver, or an interaction between two
    drivers.  And they can see patterns in all the drivers that humans may have a
    hard time even seeing, leaving aside the motivation to publish on the Internet.<p>This
    explains why the performance is so &quot;jagged&quot; - great on coding, math
    and closed games, but less good on things involving the real world.  We probably
    did hit a data wall, but then we got new sources of data.
