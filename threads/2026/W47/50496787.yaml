    ## Latest commit

    ## History

    ## Folders and files

    ## Repository files navigation

    Download for Mac or brew install --cask zigaowang/tap/zigzag Free and open source. macOS 15.4 or later.

    Your tabs in a sidebar, grouped into spaces. A native Mac app in Swift on WebKit, about 35 MB installed, with no account and no telemetry.

    ## Why I built it

    Hi, I'm Zigao, a high school student in Shanghai. I used Arc every day. When The Browser Company said it's shutting Arc down on December 22, I really didn't want to go back to tabs along the top, and the alternatives I tried were either Chromium forks or browsers built around AI. So I made my own, and I've used it as my main browser ever since.

    Why WebKit and not Chromium? I actually started by forking Helium. The source was about 100 GB and every build took 3 to 4 hours on my Mac, which isn't something I can keep up by myself. WebKit already comes with macOS, it's lighter on battery and memory, and Apple ships its security fixes with macOS updates. You still get Chrome extensions, installed straight from the Chrome Web Store.

    Why not Zen or Orion? I tried both before starting this, and they're good. Zen runs on Firefox, so it uses Firefox extensions and doesn't feel like a Mac app to me. Orion is closer, but it isn't open source. I wanted something that works like Arc, feels native, is open source, and runs my Chrome extensions.

    ## Coming from Arc

    Your Arc comes with you. File › Import from Another Browser…, pick Arc, and your spaces, pinned tabs, pinned folders, Favorites, history, passwords, sign-ins and extensions come over. Your open tabs can come too, split views and all, and wait to load until you click them; leave Open Tabs unchecked to start clean. If your spaces are on more than one Arc profile, each Arc profile comes over as a Zigzag profile of its own.

    1Password works. Install it from the Chrome Web Store inside Zigzag, like you would in Arc. It talks to the 1Password app. The first time, add Zigzag in 1Password › Settings › Browser. Bitwarden works too.

    It can't be switched off. There's no account, and Zigzag doesn't depend on a server of mine. The only things I host are the update feed and a short list of ad blocking fixes, and if they went away, Zigzag would keep working. Privacy lists everything Zigzag connects to on its own.

    ## See it

    More, in motion, at zigzagbrowser.com.

    ## What it does

    ## What's missing

    It's my everyday browser, but Zigzag is young and you'll find bugs. Things Arc users will notice:

    - No sync between Macs or to iPhone. Passwords sync through iCloud Keychain; spaces and tabs don't.

    - Space icons don't come over from Arc; pick them again in Zigzag. Space colors come over as the nearest Zigzag color.

    - No Boosts, Easels or Notes, and no AI built into the browser: AI apps can use Zigzag over MCP only if you turn it on.

    - A few Chrome extension APIs aren't there yet: the tab groups API, debugger settings, Chrome's own Google account sign-in (identity.getAuthToken), and the old request-blocking webRequest. Proxy extensions can set a fixed HTTP, HTTPS or SOCKS5 proxy but not a PAC script, so FoxyProxy's Proxy by Patterns mode doesn't work.

    - EasyList and the other built-in blocking lists update with Zigzag, not on their own; only uBlock Origin's lists do.

    - macOS 15.4 or later only.

    ## How it's built

    Zigzag is about 120,000 lines of Swift 6 and AppKit around WKWebView. There's no Chromium and no Electron: the engine is the WebKit that ships with macOS, which is why the app is small and why engine security fixes arrive with macOS updates rather than from me.

    The source is organized by feature: Sidebar, Tabs, Web, Extensions, Passwords, Import, Profiles, CommandBar, Desk (every tab at once), Peek, WebApps, Developer, MCP (AI apps), Settings, Window and Design (Zigzag's own drawn controls and design tokens). Over 2,000 tests cover importing, passwords, extensions, address handling, history, AI apps and the security fixes.

    ## Privacy

    No account, no analytics, no telemetry. Nothing about how you browse is sent to me. These are the only connections Zigzag makes on its own, apart from the pages you open:

    - Updates. Every few hours, and after your Mac wakes, Zigzag reads the update feed at zigzagbrowser.com. The request says Zigzag's version and nothing else; no system profile is sent. A new version downloads from there too.

    - Search suggestions. As you type in the address bar, the text goes to your search engine for suggestions, without cookies. Google, DuckDuckGo, Brave, Bing, Kagi and Ecosia offer them; with any other engine, nothing is sent. Turn them off in Settings › Search.

    - Site icons. Icons come from each site itself, also for pinned tabs, favorites and imported bookmarks you haven't opened yet.

    - Filter lists. At launch and then as they expire, every few hours to once a day, Zigzag downloads uBlock Origin's filter lists from uBlock Origin's own addresses (GitHub Pages, Cloudflare Pages or jsDelivr) and its scriptlets from Ghostery's CDN. It also downloads Zigzag's own short list of site fixes from zigzagbrowser.com. The requests carry no cookies, and nothing about you or your browsing.

    - Extensions. Installing one downloads it from the Chrome Web Store. At launch, at most once a day, Zigzag asks the store whether your extensions have updates, which sends their IDs and versions to Google.

    - Setup. The welcome screens show a few site icons from Google's icon service and load Wikipedia's front page as a preview.

    Translation runs on your Mac, with Apple's on-device Translation. Fraudulent website warnings are WebKit's own, the same as Safari's. Passwords stay in your Mac's Keychain and sync only through your own iCloud Keychain. Help › Report a Problem writes a report you can read first, and nothing is sent unless you send it.

    ## Install

    Download the DMG from zigzagbrowser.com, open it, and drag Zigzag to Applications. Or, with Homebrew:

    brew install --cask zigaowang/tap/zigzag

    Updates install by themselves. What changed in each version is in the release notes and CHANGELOG.md.

    ## Feedback

    - Bugs and ideas: open an issue, or Help › Send Feedback… in the app. For a bug, Help › Report a Problem… writes a report you can read before you send it.

    - Email: a@zigao.wang

    - Security problems: see SECURITY.md. Please don't post them in public issues.

    ## Build from source

    Requirements: macOS 15.4 or later, Xcode 26 or later, and XcodeGen.

    brew install xcodegen git clone https://github.com/ZigaoWang/zigzag.git cd zigzag xcodegen generate open Zigzag.xcodeproj

    Run the Zigzag scheme. Debug builds run as a separate app, "Zigzag Dev", with their own data, so they never touch your everyday Zigzag.

    Signing is set up for my team. To build on your Mac, change two things in project.yml and run xcodegen generate again:

    - DEVELOPMENT_TEAM: your own team ID (Xcode › Settings › Accounts shows it).

    - The Debug PRODUCT_BUNDLE_IDENTIFIER: one of your own, such as com.yourname.zigzag.dev, since wang.zigao.zigzag.dev is registered to my team.

    Run the tests:

    xcodebuild test -project Zigzag.xcodeproj -scheme Zigzag

