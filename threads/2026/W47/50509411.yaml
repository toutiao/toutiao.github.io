  author: DanHulton
  text: |-
    Decades of “root cause analysis” poisoning have ruined our ability to think about safety and reliability holistically.<p>There isn’t one root cause here or one person or entity at fault. Many things went wrong and bad choices were made by many people and entities to lead us to this point, and they ought to be all regarded seriously and addressed rigorously.<p>- Whomever at the hotel that approved this as the sole (or even primary) alert system is at fault.
    - The lack of training and experience this hotel employee had when in a position to make such a dangerous choice was at fault.
    - Ditto the alarm company - everyone involved in designing, approving, and implementing this system is at fault, as well as whatever process ensured that nobody had the experience or safety to be able to speak up about this dangerous design is at fault.
    - The regulatory system that allowed this design is at fault.
    - The health and safety inspection system that didn’t catch this risk is at fault.<p>I’m sure there’s more; I’m just spitballing here. But the point is that there’s no one person or thing to blame here, and no one fix. This should kick off a wave of personal and professional soul-searching and improvements.
