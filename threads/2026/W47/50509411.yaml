  title: 'Chlor: Phantasialand bekam wegen Outlook nichts mit'
  fetch_status: success
  content: "Sie befinden sich hier:\n\n- [WDR](/index.html)\n- [Mein NRW](/nrw/index.html)\n-
    [Rheinland](/nrw/rheinland/index.html)\n- [Rhein-Erft-Kreis](/nrw/rheinland/rhein-erft-kreis/index.html)\n\n[Video
    starten, abbrechen mit Escape](javascript:void(0); \"Video starten\")\n\n_IT-Panne
    Schuld für Chlorgasunfall im Phantasialand | WDR aktuell\nBildquelle: WDR\n\nWDR.
    \n46 Sek.. \nVerfügbar bis 15.11.2028._\n\n# Microsoft-Panne als Ursache: 15 Gäste
    im Phantasialand verletzt \n\nStand:\n\nWegen der Microsoft-Störung am Freitag
    bekam das Phantasialand nicht mit, dass zu viel Chlor im Pool war. 15 Gäste wurden
    verletzt.\n\nVon \n ![Logo des Westdeutschen Rundfunk](/wdr-logo-autoren-100~_v-square-xs.jpg)\nCaroline
    Jüngermann\n\n, [\n ![WDR-Reporterin Lara Burghardt](/personen/autor/lara-burghardt-102~_v-square-xs.jpg
    \"Lara Burghardt\")\nLara Burghardt\n\n](/personen/autor/autorin-lara-burghardt-100.html
    \"zur Autorenseite von Lara Burghardt\") und [\n ![WDR-Reporter Martin Heuchel](/personen/autor/martin-heuchel-102~_v-square-xs.jpg
    \"Martin Heuchel\")\nMartin Heuchel\n\n](/personen/autor/autor-martin-heuchel-100.html
    \"zur Autorenseite von Martin Heuchel\")\n\nDiesem Problem waren wir alle ausgesetzt:
    Am Freitag gab es eine Störung, die den US-Softwarekonzern Microsoft lahmgelegt
    hat. Unter anderem das E-Mail-Programm Outlook.\n\nBetroffen war auch das Phantasialand.
    Durch die Störung kamen keine Mails an, wie das Unternehmen dem WDR am Samstag
    mitteilte. So bekam niemand mit, dass das Wartungssicherheitssystem der Saunalandschaft
    längst per Mail Alarm geschlagen hat. Denn das automatischen Dosiersystem hatte
    zu viel Chlor in den Pool gepumpt.\n\n## Reizungen der Atemwege\n\nDadurch wurden
    Gäste im Hotel Ling Bao des Phantasialands in Brühl verletzt. Sie haben über gesundheitliche
    Probleme geklagt, nachdem sie den Pool besucht hatten. Der wurde zeitweise gesperrt,
    konnte inzwischen aber wieder freigegeben werden, wie die Feuerwehr am Samstag
    dem mitteilte.\n\nWegen der Beschwerden der Hotel-Besucher wurden Rettungskräfte
    und die Feuerwehr gerufen. 13 Gäste klagten über Reizungen der Atemwege, letztlich
    stieg die Zahl der Betroffenen auf insgesamt 15.\n\nZunächst hieß es, dass fünf
    Gäste ins Krankenhaus gebracht wurden, später wurde die Zahl auf vier korrigiert,
    eine Person davon blieb wegen einer mittelschweren Verletzung zur Beobachtung
    im Krankenhaus.\n\n## Überhöhter Chlorgehalt\n\nIm Hotel ergaben Tests der Einsatzkräfte
    einen Defekt des automatischen Dosiersystems für den Pool. Dies hatte zu einem
    deutlich überhöhten Chlorgehalt geführt. Das Wasser wurde daher ausgetauscht.\n\n##
    Verletzungen durch Chlorgas im Phantasialand\n\nWDR. 14.11.2026. 36 . Verfügbar
    bis 13.11.2028. WDR Online.\n\n[Audio starten, abbrechen mit Escape](javascript:void(0);
    \"Audio starten\")\n\n## Unsere Quellen:\n\n- Polizei [Rhein-Erft-Kreis](/nrw/rheinland/rhein-erft-kreis/index.html
    \"Übersicht Aktuelles aus dem Rhein-Erft-Kreis\")\n- Feuerwehr Rhein-Erft-Kreis\n-
    Pressemeldung Feuerwehr Brühl\n- Birgit Reckersdrees, Direktion Marketing und
    Sales Phantasialand\n\nSendung: WDR2, WDR-Aktuell, 14.11.2026, 18 Uhr   \nSendung:
    WDR Fernsehen, WDR aktuell, 15.11.2026, 12.45 Uhr\n\n- [Polizei & Feuerwehr](/nrw/uebersicht-gewalt-verbrechen-100.html
    \"Polizei & Feuerwehr\")\n- [Rhein-Erft-Kreis](/nrw/rheinland/rhein-erft-kreis/index.html
    \"Rhein-Erft-Kreis\")\n- [Rheinland](/nachrichten/rheinland/index.html \"Rheinland\")\n-
