  author: buran77
  text: Let&#x27;s not forget that we&#x27;re talking about people getting hurt, that&#x27;s
    the core topic here, yes? The most reasonable immediate cause for the people getting
    hurt is that there was too much chlorine in the water. Because the dosing system
    pumped too much chlorine AND the monitoring system failed to alert. Because it
    was set up to only use email AND the email failed. Because someone deployed a
    wrong config on MS&#x27;s cloud infra. And so on.<p>Not one but two of the hotel&#x27;s
    systems failed to operate properly. The chlorine pumping system pumped too much
    chlorine and the last resort alarm failed to alert.<p>As I said, there&#x27;s
    plenty of blame to go around as a matter of general principle. But for what happened
    here <i>the hotel</i> bears the responsibility towards their guests, not the pumping
    or monitoring system developers, not Microsoft. The only reason MS in the title
    is because that failure is big news these days.<p>On a technical note, even if
    they had a backup email provider they&#x27;d still be screwed because the people
    getting the alert were probably employees on the single provider (back to SPOF).
    SMS could have been a good parallel option. Ideally also some physical control
    panel that triggers an alarm when any safety critical condition occurs. On the
    chlorine pumping system, that shouldn&#x27;t be a dumb preprogrammed pump, it
    should come with it&#x27;s own sensors and detection loop independent of any external
    system, something that proactively stops it <i>before</i> it breaches the safety
    limits.
