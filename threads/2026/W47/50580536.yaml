  author: __aru
  text: Yeah, I&#x27;m surprised at how well its working for my handful of Android
    apps right now.<p>In my opinion, one of the biggest limitations right now is that
    it requires Steam as a dependency because it uses the same `Steam Play` compatibility
    infrastructure as Proton.<p>lepton shows up as another option in the compatibility
    tools dropdown in Steam, so you can use different versions of lepton for different
    apps too. So one day, we can maybe see something like Proton GE but for Android
    apps.<p>But it should be possible to eventually break that steam dependency, umu-launcher
    already does it for Proton-based gaming.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;Open-Wine-Components&#x2F;umu-launcher"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;Open-Wine-Components&#x2F;umu-launcher</a>
