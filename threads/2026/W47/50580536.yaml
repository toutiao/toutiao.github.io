  author: __aru
  text: Someone compiled an x86 port of Valve&#x27;s Lepton compatibility layer, its
    still a work in progress but is working for a few Android utility apps that I
    wanted on Linux.<p>I&#x27;d argue Lepton is potentially better than waydroid due
    to:<p>- podman containers, so no root required<p>- no awkward file permission
    issues<p>- per-app lepton containers are possible, for additional sandboxing<p>Its
    definitely still a WIP though, needs more refinement and improvements before I&#x27;d
    consider recommending it to regular nontechnical users.<p><a href="https:&#x2F;&#x2F;github.com&#x2F;pjohno&#x2F;lepton-x86_64"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;pjohno&#x2F;lepton-x86_64</a>
  score: 0
  posted_at: '2026-11-21T00:22:33Z'
- id: '50584490'
  parent_id: '50584342'
  author: yjftsjthsd-h
  text: Oh, that&#x27;s <i>excellent</i>; I  thought lepton was just a slightly extended
    waydroid but that&#x27;s notably different in a good way.
