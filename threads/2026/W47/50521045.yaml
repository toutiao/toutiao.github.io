  author: saghm
  text: 'I worry that this isn&#x27;t the right metric for diagnosing whether there&#x27;s
    a problem. I&#x27;d argue that we&#x27;ve had instances in the past where a massive
    increase in how accessible programming is ended up being a net gain in the long
    run for software even if the average quality went down (e.g., having computers
    move from giant room-sized mainframes that only companies and governments could
    afford to sitting in the living room on a table probably reduced the average quality
    because untrained amateurs could start write software even if they weren&#x27;t
    skilled enough to be employed). I could potentially be convinced that this isn&#x27;t
    the same and that it will end up being worse for software in the long run with
    a stronger argument, but &quot;software quality is going down in general&quot;
    isn&#x27;t convincing enough evidence for me.<p>All of this is also downstream
    of what I think is even more important, which is what&#x27;s better for society
    in general. Obviously low quality software is not better for society than high
    quality in a vaccuum, but I also don&#x27;t think there&#x27;s a single obvious
    objective answer for whether the influence of software on society is a net positive
    or negative today compared to, for example, when computers were all mainframes
    and all software was produced by people paid to write it. There are a lot of differences
    in society today compared to back then, and software certainly has some role in
    how we ended up here, but trying to attribute exactly what and how much is not
    an exact science.<p>This is a lot of words to basically say: if you&#x27;re confident
    that this is a problem, I think it&#x27;s important to state exactly why, since
    I think the interest parts of the discussion are in how you&#x27;ve concluded
    that.'
