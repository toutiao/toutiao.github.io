  author: fwlr
  text: I learned touch-typing by accident and without effort, when I bought a mechanical
    keyboard with blank keycaps. You can reproduce this effect for free with a permanent
    marker, whiteout correction fluid, a pack of small round stickers, etc. Block
    out half a dozen keys on Monday, by Friday your fingers will have learned where
    those keys are. Do another four or so each week and in a few months you are a
    touch-typist.
