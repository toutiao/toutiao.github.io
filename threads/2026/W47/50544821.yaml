  author: richardcrng
  text: 'This is fun, nice work! Just blitzed through a few things to try it.<p>I&#x27;ve
    got a background in pedagogy and I&#x27;m curious about the &#x27;sequencing&#x27;.<p>-
    I think it&#x27;s probably the right call to introduce letters incrementally<p>-
    I don&#x27;t know whether teaching nonsense, rare combinations is the right start<p>The
    interesting educational questions for me are:<p>- which are the right letters
    to expose people to at the start?<p>- what&#x27;s the right way to expose people
    to those letters?<p>e.g. some heuristics to consider off the top of my head:<p>1.
    look at common words in the English language<p>2. look at letters that occur frequently
    in those words<p>3. teach those letters<p>e.g. maybe `a` and `m` are plausible
    starters: `am`, `ma`, `mama`, `maam`, `ama` are not nonsense (vs `dj` or `fk`
    or whatever it was)<p>To motivate that more clearly:<p>- I&#x27;m a touch typer
    but I sometimes fumbled on e.g. &#x27;s;k;;l;;;;f;j` (to exaggerate) whereas when
    it starts being actual words, I fumbled far less on those.<p>- What this demonstrates
    is &quot;being able to touch type in a way that&#x27;s useful practically&quot;
    is a different skill to &quot;being able to touch type arbitrary character strings&quot;.<p>-
    i.e. I&#x27;m probably substantially slower at touch typing on very rare character
    combinations <i>and</i> that&#x27;s almost certainly less useful for a novice
    to learn<p>(From a learner engagement perspective, it&#x27;s also probably motivation-reinforcing
    when they&#x27;re actual words as much as possible)<p>Great work though! I&#x27;m
    a bit of a &#x27;sequencing&#x27; nerd when it comes to education; I think the
    core idea, theme + UIs etc are all very strong'
