  author: stalfie
  text: The intro with &quot;sdfjkl&quot; sequences and oddly specific instructions
    for finger positioning seems like a strange decision. It seemed like an intro
    trying to set up a game that only involved random strings of letters, like some
    strange custom control scheme. As someone who touch types at up to 100wpm, it
    somehow undid my muscle memory and made me second guess where the keys were, which
    felt bad. It wasn&#x27;t until after I quit and read the comments that I realized
    that there were actual words coming eventually.<p>I would cut the part with random
    letters and instructions of where to put your fingers. People who touch type already
    have their own unconscious technique, and any generic advice will fall flat. And
    non touch typers will never play or enjoy this game, or if they do any advice
    given there is not what will teach them. The only thing any tutorial will achieve
    is to make people like me bounce off immediately. Go straight to words, and then
    start cranking up the difficulty.
