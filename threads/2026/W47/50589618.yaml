  text: 'I was talking about this. This assembly code implementation of a lean-compatible
    checker is formally verified to be correct. The x86&#x2F;ARM&#x2F;Risc-V version
    of lean is not.<p>&gt; con-agua is con-leche reimplemented at the level of x86-64
    assembly: a close clone of con-ron&#x27;s checker, written in a small first-order
    language, compiled by a verified compiler, and shipped as one committed assembler
    file together with a C harness of about two hundred lines that reads the input
    and calls it.<p>&gt; The code the CPU executes is the code the theorem is about,
    so neither a compiler nor a language runtime is trusted; what is trusted is Kraken&#x27;s
    x86 semantics, the assembler and loader, and the C harness.<p><a href="https:&#x2F;&#x2F;arena.lean-lang.org&#x2F;checker&#x2F;con-agua&#x2F;"
