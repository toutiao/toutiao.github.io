  author: jlev1
  text: It’s the nature of mathematical ideas and methods that they are reducible
    to their component parts, so if you really want to, you can nearly always claim
    that something is just recombining existing knowledge. Motivated reasoning, from
    people dead-set on embellishing or downplaying a result, is hard to avoid here,
    so all you can really do is make an earnest and sincere judgment call based on
    the fine details of the mathematics.<p>For example, it is my opinion that the
    Jacobian conjecture counterexample was, in retrospect, easy and classical and
    hiding in plain sight, and that it’s a bit embarrassing we didn&#x27;t find it
    decades ago. (I wrote about the construction on my blog btw!) In contrast, the
    Unit Distance Conjecture counterexample seemed to me to use a stroke of genius
    by applying techniques from class field theory to approach what seemed like a
    problem in discrete geometry and combinatorics. It’s a neat, if annoying, feature
    of math that once we find a long-sought solution to an open problem, we reserve
    the right to retrospectively change our mind about the value of the problem if
    the solution turns out too easy or uninteresting. We just have to try to be fair
    and honest about it (the word “just” is doing some heavy lifting in this sentence).<p>Anyway,
    I don’t think “brute force recombination” is likely to be meaningfully the case
    here with GRH, though we won’t know for sure until the proof has been simplified
    and distilled. Alpöge’s sketch in his announcement yesterday included (IIRC) connections
    to the function field setting and new ideas about Fourier analysis.
