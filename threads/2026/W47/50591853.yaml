  author: jychang
  text: You&#x27;re not looking hard enough then. Modern optimized attention isn&#x27;t
    global GQA anymore, you&#x27;re losing a lot of entropy by throwing out half the
    bits.<p>For comparison, 2025 era Qwen3 32b would use 256 KiB&#x2F;token so 32
    GiB of KV cache at 128K context.<p>Modern Qwen 3.8 27b with GDN layers would use
    64 KiB&#x2F;token so 8 GiB of KV cache at 128K context.<p>Quantizing the KV cache
    to 8 bit on top of that is not as lossless as it was 1-2 years ago.<p>It gets
    really wild depending on the model. Deepseek 4.1 is at 890 bytes&#x2F;token. BYTES,
    not kilobytes. You lose a LOT of information per token if you try to quantize
    that.
  score: 0
