    fine. Similar approaches and good tool calling.<p>(In medium reasoning mode using
    the hybrid Q8 model rather than the Unsloth Q4)<p>At some point I will dig in
    and get it to write something more serious for me, test out its Go understanding,
    see how it gets along in Pi.<p>And, yeah — it is doing all of this without <i>any</i>
