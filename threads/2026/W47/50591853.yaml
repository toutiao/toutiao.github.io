  author: mapontosevenths
  text: KL divergence does not measure capability. It measures something closer to
    fact retrieval.<p>Using less compute causes your model to compute less. That can&#x27;t
    be avoided under any circumstances. It gets less capable in every case. The only
    question is whether it preserves the capability you cared about.<p>Worse, it&#x27;s
    a bit of a cheater in that you&#x27;ve optimized it to match the output of the
    parent on the tested logits... So that&#x27;s exactly what you get. Nothing else.
    You lose the long tail of knowledge AND capabilities.
