  author: dofm
  text: 'I find this claim a bit difficult to believe.<p>I like it. It is very good
    indeed for a small MoE, it writes nicely and it is quite unusual in &quot;personality&quot;,
    I suppose, but I find it difficult to believe it is <i>that</i> good, just based
    on my own interactive experiments.<p>I don&#x27;t really trust benchmarks at this
    point, or videos with &quot;insane&quot; in the title for that matter. But I do
    not yet believe it is better than Muse Glimmer in a practical sense as a general
    coding assistant, and from that I would be a little surprised if it really really
    outperforms Qwen 3.8 27B in the way their claims suggest.<p>Maybe it is more obvious
    in long-context work, but I am not sure that most coding agent tasks <i>are</i>
    like long-context one-shot Godot game prompts where success is a bit more open-ended,
    where solutions can be more broadly creative.<p>Most of the time we have specific
    constraints and a set of particular requirements that we need to reach step-by-step.
    I am not convinced it is going to be as good there.<p>I also think the interactive
    stuff matters, and this model is not as attentive or knowledgeable as Muse Glimmer
    (or in my less-detailed experience, Qwen 3.8 27B, though it is quite quick by
    comparison)<p>TML themselves say: <i>&quot;Inkling 2 Mini is not the strongest
    small model for multi-turn chat or for instructions with many constraints&quot;.</i><p>They
    also say it relies on tool-calling to fill a knowledge gap (which my own minimal
    tests bear out)<p>It is enormously promising and it appears to be quite creative;
    perhaps looping gives it that. But I am wary of seeing what I want to see, when
    a ~30B dense model is, on average, going to plod through and do better on many
    tasks because of better basic knowledge.<p>(Edited multiple times for clarity)'
