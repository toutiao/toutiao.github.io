  author: piltdownman
  text: UK law is frighteningly inconsistent in this regard, hiding behind the 2001
    EU Copyright Directive being shoe-horned badly into their existing legislation
    (CPDA 1988)<p>You cite the Messiah case from 2002 involving David Ball being fairly
    spurious legally. The knife cuts both ways in this regard.<p>The Mr.Modchips conviction
    in 2008 was quashed in the Court of Appeal with the ruling that prosecutors failed
    to prove that playing a pirated game on a modified Xbox or Nintendo console involved
    copying a &quot;substantial part&quot; of a copyrighted work into the console&#x27;s
    memory.<p><a href="https:&#x2F;&#x2F;www.casemine.com&#x2F;judgement&#x2F;uk&#x2F;5b46f2042c94e0775e7f05ee"
    rel="nofollow">https:&#x2F;&#x2F;www.casemine.com&#x2F;judgement&#x2F;uk&#x2F;5b46f2042c94e0775e7f05...</a><p>R
    v. Gilham (2009) then closed the loophole with an even more controversial interpretation
    of the &quot;little and often&quot; principle, ruling that even though a console&#x27;s
    RAM only holds tiny fragments of a game&#x27;s graphics and audio at any single
    millisecond, playing a game continuously creates transient copies that collectively
    infringe copyright.<p>Unfortunately they&#x27;ve gone full Nuclear since Brexit,
    with the last draconian ruling mandating blocks at ISP level for websites distributing
    RCM loaders and custom firmware tools for the Nintendo Switch. As such it is fairly
    clear-cut atm that hardware circumvention devices have no valid defense under
    UK law.<p><a href="https:&#x2F;&#x2F;www.eurogamer.net&#x2F;nintendo-wins-uk-high-court-case-to-block-piracy-websites"
    rel="nofollow">https:&#x2F;&#x2F;www.eurogamer.net&#x2F;nintendo-wins-uk-high-court-case-t...</a><p>I
    would be quick to contend, however, that this is more a reflection on UK Society
    and Culture as a whole rather than a bellwether for the appetites regarding consumer
    protections globally.
