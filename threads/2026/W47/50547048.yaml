  author: Zigurd
  text: One of the reasons we have abominations like DMCA is the phrase intellectual
    property.<p>The term &quot;intellectual property&quot; to refer to something protectable
    by copyright or patent is a mind virus. It isn&#x27;t property. The length of
    time that you are granted a monopoly by the government over an invention or copyrightable
    work can be arbitrarily set by the government. Anywhere from a minute to 1000
    years or beyond. That&#x27;s not how any other property works. So stop calling
    it property. It is the grant of a monopoly to reward you for creating something
    that will, after a reasonable interval, become free for anyone to use. That&#x27;s
    not how actual property works, and for good reasons.
