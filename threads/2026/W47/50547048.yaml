  author: judge2020
  text: 'Going to reply to myself here that apparently there is Universal City Studios
    v. Reimerdes, 82 F. Supp. 2d 211, 217 (S.D.N.Y. 2000)<p>&gt; Section 512(c) provides
    protection only from liability for copyright infringement. Plaintiffs seek to
    hold defendants liable not for copyright infringement, but for a violation of
    Section 1201(a)(2), which applies only to circumvention products and technologies.
    Section 512(c) thus does not apply here.<p>So in essence taking down a repository
    would not absolve GH of liability for the &#x27;trafficking&#x27; of said circumvention
    technology.<p>Although it looks like GitHub has their own policy for handling
    circumvention claims: <a href="https:&#x2F;&#x2F;docs.github.com&#x2F;en&#x2F;site-policy&#x2F;content-removal-policies&#x2F;dmca-takedown-policy"
    rel="nofollow">https:&#x2F;&#x2F;docs.github.com&#x2F;en&#x2F;site-policy&#x2F;content-removal-polic...</a><p>I
    do wonder if this extra circumvention review was undertaken by GitHub though,
    given I haven&#x27;t seem any evidence of the extra process happening (giving
    the repository owner a chance to respond or modify their repo &#x2F; referring
    the developer to legal consultation via GitHub’s Developer Defense Fund).'
