  author: piltdownman
  text: I&#x27;m not arguing, merely expanding the context for people catching up.<p>You
    can safely assume you&#x27;re preaching to the choir on these matters with Hacker
    News.<p>Your position, however, doesn&#x27;t represent an inviolable workaround.<p>Even
    if a foreign host ignores a DMCA notice, a copyright owner can still pursue infringement
    claims directly against a US developer in the US, or pursue it on similar local
    copyright laws in the host&#x27;s country.<p>As explicitly related to this case,
    17 U.S.C. § 1201 legislates that it is illegal to manufacture, offer to the public,
    provide, or otherwise traffic in circumvention tools. Writing the code, maintaining
    the repository, or uploading it from a computer inside the United States constitutes
    domestic conduct, giving U.S. courts jurisdiction regardless of where the remote
    server sits.
