  text: "&gt; Entirely due to self-inflicted bureaucracy.<p>You might know this, but
    in case you don&#x27;t, there is a very specific reason for this. GNU&#x2F;FSF
    has an ideological commitment to &quot;copyleft&quot; as a method to ensure software
    is always distributed with its source code and is freely modifiable.<p>The putative
    enforcement method for &quot;copyleft&quot; requires that <i>copyright</i> documentation
    and assignments be strictly tracked.<p>While you are correct that it is &quot;self-inflicted
    bureaucracy,&quot; I think people will read that with the connotation of &quot;(pointless)
    self-inflicted bureaucracy,&quot;  when that is simply not the case. GNU&#x2F;FSF&#x27;s
    Free Software (free-as-in-freedom) project is prone to failing for totally avoidable
    reasons without this documentation."
