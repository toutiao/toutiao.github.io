  text: Hmm. I think you’re suggesting that if the Falcon 9 design was publicly accessible,
    all other companies should be able to use it.<p>Honestly, I think a lot of the
    basics of the design are kinda out there, right? People generally know how the
    engines work, what propellant it uses, etc.<p>The hard part is integrating it,
    testing it, and operating it over time. No one did that before SpaceX. Unless
    you’re suggesting SpaceX also provide a complete design for the factories and
    complete operations too?<p>But at that point, what incentive does SpaceX have
    to keep innovating on rockets? SpaceX is very obviously an example of a company
    that is both innovating on a technological level, and trying very hard to innovate
    even further. In a field that has really struggled with innovation for decades.<p>In
    my view, we shouldn’t disrupt that process while it’s working and benefiting people.
    (Cheapest launch systems ever made, only reusable orbital launch system on the
    planet, etc etc etc.) We should go after monopolistic companies which are not
    innovating any more, and just jack prices and make products worse. We should go
    after SpaceX if they start doing that.<p>Also, just making it open doesn’t mean
    NASA could, say, build and operate Starship for cheaper if only they had the designs.
    They don’t need to have an assembly line of rockets, and without that they’ll
    never have the economies of scale to make it cheaper. NASA wants to pay someone
    else so they don’t have to worry about it, they want to run science missions and
    explore, not build a car. SpaceX wants to mass manufacture. Very different goals.
