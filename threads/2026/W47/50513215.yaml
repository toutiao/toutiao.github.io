    possible that they will run Qwen 4 Max at other reasoning levels in the future,
    or it&#x27;s possible that they never will. Regardless, it&#x27;s unlikely to
    be better at any reasoning level on a price&#x2F;performance basis than the GPT
    6.1 Sol&#x2F;GPT 6 Astra pareto frontier. It&#x27;s close enough to Claude Opus
    5.5 line at lower reasoning levels that it could potentially cross that if it
