  author: aenis
  text: "&gt; If they are not testing Chinese models with less than max thinking,
    then we should only compare them to other models also at max thinking.<p>Nah,
    there are interesting conclusions to be had in comparing various model&#x2F;effort
    level combinations, esp. when it comes to cost and time per task.<p>I have my
    own private benchmark suite; it involves algorithmic problems, the need for good
    visual understanding, and the ability to run long workloads unattended (as the
    agents need to run a few iterations, self-evaluate the results, and hand over
    the assignments when they feel they have succeeded). Chinese models do poorly
    on such problems, and running them at anything less than max efforts is pointless;
    they can&#x27;t even hand over the assignments graded against a mechanical set
    of tests they themselves can execute. Hand that same task over to, say, Sonnet
    medium and you have a weird outcome: excellent result, but way more time and tokens
    burned than, say, Opus 5.5 or Sol 6.1 running at high. I do those benchmarks just
    to be able to spot such patterns and then better choose the models for my real
    work - but i wouldn&#x27;t have caught it if I wasnt running various model&#x2F;effort
    combos."
