  author: rbehrends
  text: While I doubt that Qwen 4 Max can seriously compete with frontier models,
    the AA index has become all but useless, due to the introduction of new benchmarks
    in the aggregate which are of questionable value as a measure of &quot;intelligence&quot;
    [1]. AA has seemingly also abolished updating the Coding Agents Index, which was
    an okay benchmark for coding ability, and older models are completely absent from
    the v5 version of the full index.<p>[1] Especially Terminal-Bench-Science 0.1
    stands out. Example problems:<p>- <a href="https:&#x2F;&#x2F;hub.harborframework.com&#x2F;tasks&#x2F;terminal-bench-science&#x2F;rdkit-ic-constraints"
    rel="nofollow">https:&#x2F;&#x2F;hub.harborframework.com&#x2F;tasks&#x2F;terminal-bench-science...</a><p>-
    <a href="https:&#x2F;&#x2F;hub.harborframework.com&#x2F;tasks&#x2F;terminal-bench-science&#x2F;cilia-segmentation"
    rel="nofollow">https:&#x2F;&#x2F;hub.harborframework.com&#x2F;tasks&#x2F;terminal-bench-science...</a><p>Probably
    very relevant to people working in these fields, but it is honestly not surprising
    if a lab with limited compute will not train for these technologies, and it says
    pretty much nothing about more common use cases. I also suspect that this benchmark
    measures knowledge retrieval more than raw reasoning ability. This is where you
    really need a breakdown of capabilities and not an increasingly meaningless aggregate
    number.
