  author: smj-edison
  text: I&#x27;d argue that the rules are needed though, because at some point we
    have to partition reality and say &quot;x works this way, but y works more like
    this.&quot; So there&#x27;s definitely less vs more accurate models, but the more
    accurate ones can have unnecessary mental overhead that makes it difficult to
    keep track of other details. I&#x27;m currently studying chemistry right now,
    and I&#x27;ve come to appreciate the layering of models happening (lewis dot diagrams
    for non-important details, pi bond delocalization for a planar molecule, band
    gap for light frequency, etc).<p>Also QM simulation is not completely hopeless!
    I&#x27;m actually doing computational chemistry research, and we&#x27;re able
    to do reasonable approximations for around 70 atoms with a method called Density
    Functional Theory (DFT). And recent developments with machine learning have further
    given rise to Machine Learning Interatomic Potentials (MLIPs) (not to be confused
    with something like AlphaFold). Essentially it uses a GNN to predict the forces
    on all the atoms based on the current atomic arrangement, and then the simulation
    will advance through time by integrating (e.g. adding) the forces.
