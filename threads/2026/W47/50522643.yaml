  author: OgsyedIE
  text: A system, at least within the foundations of physics, is any open set considered
    worthwhile to study.<p>A dynamic system is a system considered in the context
    of some theory of physics that evolve in time, such as classical dynamics or electrodynamics.<p>A
    dynamical system is a submanifold of a jet bundle over the product space of some
    open set and a time manifold which is almost always R with the most common exception
    being S^1, typically written as J^1(R×M), considered with some regularity conditions
    that permit you to do analysis over any contour lines of your choosing in the
    dynamical system. Essentially, it&#x27;s a rigorous way to study what happens
    when you mix arbitrary differential equations and arbitrary differentiable manifolds,
    such as in the phase spaces of any random IRL shit.
