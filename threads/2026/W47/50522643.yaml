  text: The addition of the Latin-originating -al suffix to the Greek word dynamic
    was deliberately chosen in 1927 when dynamical systems where first widely accepted
    by mathematicians to be a useful way of framing things in order to specifically
    separate it from the dozen things in physics that already used the name dynamics,
    since the mathematicians looking to axiomatise the things we now call dynamical
    systems wanted to get physicists to stay away from it and let the math community
    keep it for themselves.<p>Back at that point in history there was a much fiercer
    rivalry between the two fields.
