  text: Your original statement was<p>&gt; Nothing in math or science can be proven
    with 100% certainty<p>We have plenty of statements in math that have been proven
    with 100% certainty. They <i>are</i> true, they are simply true with associated
    conditions. Those conditions may not accurately reflect our universe—in many cases
    we know for certainty that they do not—but they <i>are</i> true nonetheless.<p>As
    an example, we are certain of the truth of the Banach-Tarski theorem. Its conclusions
    are inapplicable and nonsensical in the physical world because objects in ℝ³ and
    objects existing in the spatial dimensions of our universe are not equivalent.
    This does not make it any less true.<p>Mathematical statements are true <i>under
    a given set of conditions</i>. Those conditions being a requirement of a given
    statement’s truth does not make it uncertain or less true.
