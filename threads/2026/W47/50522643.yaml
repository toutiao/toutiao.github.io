    # Chemistry is Actually Geometry

    ### Theoretical Biologists Should Know About Feinberg’s Deficiency Theorems

    [CasualPhysicsEnjoyer](https://substack.com/@casualphysicsenjoyer)

    When a set of molecules combine to make a different set of molecules, we get a **chemical reaction**. Reactions can release heat or change colour. They can form weird patterns. And most importantly, the concentrations of molecules in the reaction can evolve in surprising ways.

    Life itself **is** a chemical process. Biochemical reactions are complex, and yet appear to be very robust in a wide range of environments. To build synthetic forms with life-like behaviour, we would likely need theory that tells us how to manufacture the many quirks of chemical processes at will¹, or engineer _arbitrary_ properties at low cost. To do this, a model of complex chemical systems is required.²

    But this is difficult. Models of complicated biochemical processes involve huge numbers of differential equations and even more _parameters_; many of which we can't estimate. A model of the Krebs biochemical cycle might include hundreds of _ **rate constants,** _ which are the theoretical speeds at which each of the sub-reactions occurs. Unfortunately, if we experimented with such processes in a closed vat, it would be impossible to estimate these rate constants with any certainty.

    Large numbers of estimated parameters are bad. We should be looking for better abstractions that depend on fewer parameters. It is true that such abstractions might force us to sacrifice precision, and only leave us with qualitative predictions. But for processes that are as noisy as biology, this tradeoff seems worth it. We should be able to point to an abstract _structure_ behind a complex biochemical model and say 'we expect that this organism can adapt to _these_ scenarios, but not _those_'.

    As said in Martin Feinberg's _Foundations of Chemical Reaction Network Theory_ :

    > Since each new network of chemical reactions gives rise to its own complicated system of differential equations, it becomes apparent that, in the absence of an overarching theory, we would be forced to study complex chemical systems on a case-by-case basis, and each new case would be fraught with terrible analytical difficulties. What’s needed is a way of looking at things from a broader and more general perspective.

    Without theory we are blind to the landscape of what is actually possible.

    An increasingly natural abstraction for chemical processes is networks, geometry and topology. The goal of this essay is to describe some results in network science and geometry that can inform us about properties of chemical reactions through fewer parameters. I found Feinberg's seminal _Foundations of Chemical Reaction Network Theory_ quite dense for a beginner like me. In this essay I will be introducing the key results of this book from a less formal and more intuitive standpoint. I will assume knowledge of basic linear algebra, and include many examples. **Nothing I write below is original work**. It's my simplified model of what I have read in chemical reaction network theory, especially that of Martin Feinberg . All mistakes are mine.

    I hope essays of this form will help us reason about chemical reaction networks more easily, and therefore push us towards more abstract theories of biochemistry. Who knows, maybe biology is actually just geometry too.

    * * *

    ### Chemical systems have surprising behaviours

    Chemical systems have a wide range of surprising behaviours, illustrating demand for a more abstract model. One such behaviour is that they can **oscillate**. This is when the concentration, pH, or any other property of the reaction exhibits periodic cycles that are stable. The Belousov-Zhabotinsky and Briggs-Rauscher reactions are examples where the concentration of a substance in the reaction oscillates.

    The Belousov-Zhabotinsky reaction (Belousov 1959; Zhabotinsky 1964; Field, Körös & Noyes 1972) was one of the first chemical oscillators to be constructed. This is a chemical system that involves at least a bromate and an acid, and during this reaction the concentration of Br- oscillates. It was originally motivated by Boris Pavlovich Belousov when he tried to find a non-organic analogue to the Krebs cycle.

    The Briggs–Rauscher oscillator (Briggs & Rauscher 1973) is a chemical oscillator where the concentration of iodide and iodine in the system oscillates. The mechanism behind why has been revised several times in Noyes and Furrow (1982) , De Kepper and Epstein (1982) , and Schmitz and Furrow (2016) .

    [

    ](https://substackcdn.com/image/fetch/$s_!iOMP!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe7041259-2946-447c-99f3-02b2be01cfa4_643x556.jpeg)
    _*Oscillogram of iodide concentration in the Briggs–Rauscher reaction, recorded by Briggs and Rauscher in June 1972. Image: Thomas Briggs, via Wikimedia Commons, licence CC BY-SA 3.0._

    There are also chemical clocks where the pH in the system oscillates, as opposed to chemical concentrations. This happens in the urea–urease clock system (Hu et al. 2010) . Chemistry can also form patterns; the Liesegang rings system of pattern formation (Liesegang 1896) is a reaction-diffusion process that causes coloured stripes in a test tube.

    [

    ](https://substackcdn.com/image/fetch/$s_!4TTU!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faadecebf-fe28-426e-9252-6d881beca976_530x444.png)
    _Credit:orAndrás Büki_

    The Lotka-Volterra equations in ecology were originally motivated by Alfred Lotka's attempts to find a theory of oscillations in chemical networks . This was known as the Lotka network (Lotka 1920) .

    In biochemistry, we have cycles where some of the outputs are used again in the inputs. The Krebs cycle (Krebs & Johnson 1937) continuously recycles oxaloacetate. The Calvin cycle regenerates ribulose-1,5-bisphosphate (Bassham et al. 1954) .

    We also have oscillators in biochemistry. One of the earliest discovered examples of oscillatory behaviour in a biochemical system was glycolysis, discovered by Duysens and Amesz in 1957 . In this process, the metabolites from yeast (alcohol) exhibit oscillations. One such model of this was the Higgins–Sel'kov oscillator model (Higgins 1964; Sel'kov 1968) .

    Alan Rendall explains this from his blog

    > If yeast cells are fed with glucose they convert it into alcohol. Those of us who appreciate alcoholic beverages can be grateful to them for that. In the presence of a supply of glucose with a small constant rate alcohol is produced at a constant rate. When the supply rate is increased something more interesting happens. The output starts to undergo periodic oscillations although the input is constant. It is not that the yeast cells are using some kind of complicated machine to produce these. If the cells are broken down to make yeast extract the effect persists. In fact for yeast extract the oscillations go away again for very high concentrations of glucose, an effect not seen for intact cells. This difference is not important for the basic mechanism of production of oscillations.

    The KaiC phosphorylation cycle (Nakajima et al. 2005; Rust et al. 2007) is another biochemical oscillator. In this system, the fraction of the number of KaiC proteins with a phosphate group attached oscillates as well.

    Other strange behaviours I have found include 'futile cycles' (Hell & Rendall 2015) and 'bi-stability' (Gardner, Cantor & Collins 2000; Ferrell 2002; Craciun, Tang & Feinberg 2006) . We also have synchronisation across multiple cells. C.H. Waddington's systems from his multiple texts on development (Waddington 1956, 1957) exhibit positive feedback and autocatalysis. We have the Huang-Ferrell Model of MAPK Signaling (Huang & Ferrell 1996) .

