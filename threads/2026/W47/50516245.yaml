  text: |-
    Not at all equivalent to today’s coffee shops:<p>&gt; The social impact of coffeehouse culture shows most clearly when juxtaposed
    with earlier social norms. As Cowan (2005, pp. 101–105, 112) explains, coffeehouses,
    rather than alcohol-centered public houses, became key venues for elite exchange. In
    early seventeenth-century England, the virtuosi (natural philosophers and scholars)
    tended to gather in aristocratic great houses, where interactions were formal and
    exclusive. Coffeehouses, by contrast, encouraged informal, cross-class dialogue and,
    as such, challenged traditional pathways to intellectual recognition. For less wealthy
    aspiring virtuosi, coffeehouses provided unprecedented access to information and
    social networks.<p>&gt; <i>That access mattered more than the drink…</i><p>HN itself is probably filling that function to a degree.
