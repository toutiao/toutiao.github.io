  content: "Traders work on the floor of the New York Stock Exchange on Nov. 6, 2026.\n\nSpencer
    Platt | Getty Images\n\nStocks were slammed on Friday, closing out a brutal week
    for markets as the much-hyped [Anthropic](/quotes/ANT/) IPO caused investors to
    take profits on the artificial intelligence-led rally rather than revive it. The
    [Nasdaq Composite](/quotes/.IXIC/) turned negative for the year, and the [S&P
    500](/quotes/.SPX/) entered correction territory alongside the [Dow Jones Industrial
    Average](/quotes/.DJI/).\n\nThe tech-heavy Nasdaq shed 5.28% to close at 22,617.73.
    The index was down 2.7% year to date. The broad market S&P 500 dropped 3.7% to
    end at 6,910.39, while the blue-chip Dow fell 949.73 points, or 1.93%, to 48,147.33.
    Both the S&P 500 and Dow moved 10% below their closing records.\n\nThe [Nasdaq-100](/quotes/.NDX/)
    plummeted 5.6% and entered a bear market on an intraday basis, down 20% from its
    recent high.\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nNasdaq
    Composite, year-to-date\n\nAnthropic lost 8.5%, giving back a large chunk of its
    [17% jump in its Nasdaq debut](https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html)
    Thursday and pressuring the broader AI trade. Chipmakers [Advanced Micro Devices](/quotes/AMD/)
    and [Nvidia](/quotes/NVDA/) slid more than 13% and around 14%, respectively. Nvidia
    saw selling pressure increase after Reuters reported that the U.S. Securities
    and Exchange Commission is exploring possible accounting issues at the company.
    It also recorded its [longest weekly losing streak](https://www.cnbc.com/2026/11/20/nvidias-7-week-losing-streak-is-longest-since-2008-financial-crisis.html)
    since the 2008 financial crisis. [Micron Technology](/quotes/MU/) dropped almost
    14%.\n\nThose declines in tech built on the losses seen in Thursday's horrid session,
    where the major averages each lost more than 2%, and the Dow closing below the
    key 50,000 level for the first time since June.\n\n\"This is not just a valuation-driven
    correction. It's becoming broader,\" said Massimo Santicchia, head of U.S. equities
    at Procyon. \"Right now, it's definitely risk-off.\"\n\nThe losses are alarming
    investors who were hopeful that [Nvidia's earnings](https://www.cnbc.com/2026/11/17/nvidia-nvda-earnings-report-q3-2027.html)
    and [Anthropic's IPO](https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html)
    would revive enthusiasm for the AI trade. Now, the market looks to be on the cusp
    of a true capitulation after getting roiled in recent weeks with a series of negative
    headlines. [Signs of moderation](https://www.cnbc.com/2026/10/29/microsoft-google-ai-capex-estimates.html)
    in the capital expenditures splurge, Democratic wins in the 2026 midterms and
    Jensen Huang's ouster at Nvidia all [raised questions](https://www.cnbc.com/2026/11/13/nvidia-jensen-huang-resignation-ai-financing.html)
    about the future of the AI buildout.\n\nOn top of that, the [potential for more
    interest rate hikes](https://www.cnbc.com/2026/11/18/federal-reserve-governor-christopher-waller.html)
    from the [Federal Reserve](https://www.cnbc.com/federal-reserve/) is spooking
    traders as well.\n\nInvestors hid out in defensive areas of the market, with retailers
    such as [Walmart](/quotes/WMT/) and [Costco](/quotes/COST/) as well as others
    like [Johnson & Johnson](/quotes/JNJ/) and [Procter & Gamble](/quotes/PG/) seeing
    gains. Walmart gained more than 1%, while Costco, Johnson & Johnson and Procter
    & Gamble each rose around 1%.\n\n\"The stock market is going through an AI repricing,
    reflecting an environment of slowing data center buildouts, reduced funding sources
    for AI-related projects and a slower trajectory of technology-related earnings
    growth,\" said Richard Saperstein, chief investment officer at Treasury Partners.\n\nFor
    the week, the Dow fell 8%, notching its worst weekly performance since March 2020.
    The Nasdaq finished down about 10%, also posting its largest one-week pullback
    in more than six years. The S&P 500 decreased 8.6%, seeing its worst week since
    April 2025 in the wake of President Donald Trump's [sweeping tariffs announcement](https://www.cnbc.com/2025/04/02/trump-tariffs-live-updates.html).\n\n##
    Stocks tumble Friday\n\nThe three leading U.S. indexes experienced a massive sell-off
    on Friday.\n\nThe S&P 500 dropped 3.7% to close at 6,910.39, while the Nasdaq
    Composite plummeted 5.28% to 22,617.73. The Dow Jones Industrial Average declined
    949.73 points, or 1.93%, to 48,147.33.\n\n_— Sean Conlon_\n\n## 'Risk is to the
    downside' when below the 200-day moving average, BTIG says\n\nAll three major
    averages were trading below their 200-day moving averages on Friday, and BTIG
    believes more turmoil could be ahead.\n\n\"Generally speaking once something is
    below a 200 DMA, the risk is to the downside,\" said Jonathan Krinsky, the firm's
    chief market technician.\n\nThursday marked the sixth consecutive day of declines
    for the [S&P 500](/quotes/.SPX/), and Krinsky found that over the last 30 years,
    there are only three prior instances of six-day losing streaks that close below
    the 200-day moving average but not by more than 3%.\n\n\"The 'slightly' good news
    is that all three saw SPX higher five days later. The not so good news is that
    all of them saw meaningful downside after that small pop,\" he said.\n\nWhen assessing
    Thursday's performance, Wolfe Research found that the broad market index's \"violent\"
    reversal after its attempt to move back to its 200-day moving average at the open
    was succeeded by the \"worst breadth reading\" since last December, seeing decliners
    outnumber advancers by 12:1.\n\n\"Broken trends and deteriorating momentum remain
    significant headwinds,\" wrote technical analyst Rob Ginsberg in a Thursday note.
    \"The bulls need to mount a powerful defense here to stabilize the market and
    begin reversing the broader deterioration.\"\n\n_— Sean Conlon_\n\n## Gas prices
    fall ahead of Thanksgiving, but remain above last year\n\nA customer purchases
    gas at a station on September 15, 2026 in Chicago, Illinois. \n\nScott Olson |
    Getty Images\n\nThe national average for regular gasoline fell to $3.69 a gallon
    on Friday, down from $3.72 on Thursday, according to [AAA](https://gasprices.aaa.com/).
    Prices are still about 59 cents higher than a year ago.\n\nThe drop comes ahead
    of Thanksgiving next week, with[73 million people](https://newsroom.aaa.com/2026/11/aaa-thanksgiving-holiday-travel-forecast/)
    expected to take road trips.&nbsp;\n\n\"It's possible the national average will
    drop another 15 cents by next Thursday and avoid setting a new record,\" [according
    to AAA's post.](https://gasprices.aaa.com/gas-prices-keep-dropping-as-thanksgiving-approaches/)\n\n[Brent
    ​crude](/quotes/@LCO.1/) futures, the international benchmark, were up 0.64% to
    $92.57 a barrel on Friday, while U.S. [West Texas Intermediate](/quotes/@CL.1/)
    futures for December rose 0.93% to settle at $83.98 a barrel.\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nBrent
    and WTI prices - YTD\n\n_— Deena Zaidi and Nick Wells_\n\n## Humana upgraded to
    buy at TD Cowen\n\nIn this photo illustration, the Humana Inc. logo is displayed
    on a smartphone screen.\n\nRafael Henrique | SOPA Images | Lightrocket | Getty
    Images\n\nHumana shares rose 3% after TD Cowen upgraded the healthcare services
    company to buy from hold, raising the price target to $485, implying a 28% upside
    from the stock's Thursday close of $380.\n\n ![hide content](https://static-redesign.cnbcfm.com/dist/a54b41835a8b60db28c2.svg)\n\nHumana
    - YTD\n\n\"Taking into account 2026 performance, 2027 Medicare Advantage benefit
    design and 2028 Stars results, we see a relatively clear path towards a meaningful
    step-up in 2027 EPS growth and more than $40 EPS in 2028,\" the bank said in its
    note.\n\nAdjusted EPS estimates for 2026, 2027, and 2028 remain unchanged at $9.51,
    $18.41, and $40.42, respectively.\n\n_— Deena Zaidi_\n\n## Anthropic tops Vanguard's
    retail investor trading charts in debut\n\nDaniela Amodei, co-founder and president
    of Anthropic"
