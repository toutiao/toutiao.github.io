    It's just a different way of thinking. Once you've invested a lifetime learning how to speak and think in Microsoftian, why throw away that investment? It's an inherently less efficient and less reliable way of thinking, but it generally works well enough, most of the time, for most things. And then when you look at the alternative, with weird looking commands and arguments strung together, you get the bonus of an innate sense of superiority for your refined GUIs, remote GUI-based management, and even your proprietary shell. (I've lived and worked in both worlds.)
    The UNIX/Linux way isn't better because Windows people are stupid(er), but rather because there's no cost to or prohibition on experimentation, and eventually (ever so slowly) the better ideas emerge at a slightly higher rate outside of the Windows world. Windows, with one dominant company at the center of the universe, simply cannot evolve as efficiently, because doing so threatens that one dominant company. It's the "tragedy of the proprietary".
