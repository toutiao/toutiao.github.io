  text: |-
    Really interesting read, it shows how complicated a modern cloud system can get in terms of automated recovery systems and how those systems don't always do the right thing.
    I would be thinking about lead shedding as a mitigation. When you have more load coming in than a system can handle you're going to shed load one way or another. It's better to reject or aggressively rate limit requests than to let so much traffic in that the system crashes. Load shedding wouldn't have prevented the issue as they wouldn't have enforced a low enough limit, but once they discovered the limit it would have allowed them to get the systems back to manageable levels of load, avoiding a cascade and giving them some breathing room to find the root cause.

    This change was not caused by AI tooling.

    When I read these reports I try to guess what they are trying not to say. I suspect they have a human in the loop somewhere in the development process, so there probably isn't a scenario where they could blame AI as the singular cause. So I don't know if this statement says anything. They didn't choose a broader statement like "AI use was not a factor" or even "AI helped us recover". From what I hear they very likely had AI review the change even if it wasn't authored entirely by AI, so AI was very likely involved.
