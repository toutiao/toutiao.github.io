  author: jon-wood
  text: I think you&#x27;re probably overthinking things. Split your changeset into
    a series of commits each of which encapsulates one step along the way to achieving
    the overall goal of your changeset.<p>As an example, you might end up with &quot;Refactor
    to facilitate adding feature X&quot;, &quot;Data models for X&quot;, &quot;API
    endpoints for X&quot;, &quot;UI for X&quot;. Each of those would contain all the
    code&#x2F;tests&#x2F;documentation for each of those steps.<p>The nice thing about
    jj is that it makes it really easy to have a bunch of messy commits locally as
    your bouncing around the place, followed by squashing&#x2F;splitting things as
    appropriate. In practice that first refactor commit might only come into existence
    very late after you&#x27;ve built a bunch of endpoints and done some refactoring
    along the way.
