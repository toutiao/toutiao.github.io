  author: pdpi
  text: 'JJ, using the squash workflow, is brilliant for working with Claude<p>The
    workflow is straightforward: I create a named revision for the work I want to
    do, then an unnamed revision on top. I prompt Claude, changes land in the unnamed
    revision, I review those, squash the parts that I&#x27;m ready to accept, prompt
    some more to iterate on the parts that aren&#x27;t up to par yet. Rinse and repeat
    until the topmost (unnamed) revision is empty.<p>I instructed Claude that I use
    jj with the squash workflow, so it should never touch revisions with a non-empty
    description (I also needed to tell it to shut up about that check), and the whole
    thing flows pretty damn smoothly.'
