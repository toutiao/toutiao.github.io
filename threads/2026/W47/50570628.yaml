    Commits for me are settled patches. I don&#x27;t go around editing commits that much (and I have the tooling to make it trivial). Because for me, the patch inside has served it purpose. When I found a new purpose for it, the context has already been changed, so even when it saved me a bit of typing, I had to look at it anew.<p>So only the few commits around my current tasks are in flux. There&#x27;s not a lot, so rebasing is very easy, even with the git cli. Same with editing a span of commits. It becomes the workspace and thus can easily be modified. Everything else is just on hold. That&#x27;s why I like named branch. Because I look at it holistically instead of individual commits.<p>Maybe your workflow is different, and you are always doing surgical treatment to a complicated tree. But I never needed to do so. These days I&#x27;m even leaning towards a single patch for a feature or a fix. Way easier for communication.<p>EDIT<p>reply slowed down by HN moderation.
