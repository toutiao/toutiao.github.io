  author: danpalmer
  text: I agree that this was a factor in Mercurial dying, but I&#x27;m not sure this
    holds today. Mercurial performed significantly worse than git, that was a factor
    at the time, but in 2026 the perception is that git doesn&#x27;t perform well
    enough (see GitHub outages, GitLab writing on this topic, Anthropic developing
    their own VCS, etc). Even small teams I know (circa 10 committers) are finding
    Git to not scale to the speed they&#x27;re working at now.<p>JJ has the potential
    to be a substantial step forward in performance. This will depend on the backend
    to fully realise it, but a backend that prioritises scalability could vastly outperform
    git and GitHub&#x27;s storage.<p>I think in the post-Microsoft acquisition, post-Dear
    GitHub letter era, GitHub&#x27;s shine has worn off. I see a lot more use of GitLab
    for open source, a lot more use of various other forges. I don&#x27;t think it&#x27;s
    a requirement for a thriving open source project in the way it was for ~2010-2020.
  score: 0
