  text: |-
    I&#x27;ve used jujutsu for maybe half a year by now.<p>At first the auto-staging (or whatever it&#x27;s called) is annoying. It sure is if one is used to dump random files in the repository, that haven&#x27;t been ignored.<p>After some time, I realised it gives a lot of freedom. Working on something but not in a workspace, and need to do something else for the day? Just jump somewhere else. Everything will still be there when you get back.
