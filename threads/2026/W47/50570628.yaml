  author: pkuki
  text: "Shameless plug, but a bit related to jj:)<p>I recently created a project
    which utilizes FUSE to serve git files directly from object store without a checkout.
    Main motivation was to sepeedup a worktrees creation (I work on a huge monorepo).
    In my case it helps a lot - now I wait a second instead of a minute. \nBut then
    I realised there are other interesting features which having vfs opened:<p>- tree
    structure of related branches (simplest case of that are stacked PRs) which rebases
    itself<p>- live preview of merge state or any node of such tree<p>- on demand
    creation of a new branch which merges any of the existing ones very cheaply (e.g
    for a throwaway build check)<p>- quick and simple comand which shows conflicting
    files between selected worktree and all others<p>- agents gets notified about
    such conflicts when they happen<p>I was able to design it in a way so git sees
    those virtual workspaces as normal worktrees, and all git commands works exactly
    as you would expect. So I think for some people, especially on the very big repositpries,
    it might solve a few problems they try to solve with jj.<p><a href=\"https:&#x2F;&#x2F;github.com&#x2F;pkukielka&#x2F;gitfold\"
    rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;pkukielka&#x2F;gitfold</a><p>A
    few typical use cases: <a href=\"https:&#x2F;&#x2F;github.com&#x2F;pkukielka&#x2F;gitfold&#x2F;blob&#x2F;main&#x2F;docs&#x2F;guide.md\"
    rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;pkukielka&#x2F;gitfold&#x2F;blob&#x2F;main&#x2F;docs&#x2F;guide.md</a>"
