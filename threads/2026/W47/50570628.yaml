  text: I have a good story around these features.<p>At the start of the day, I resumed
    working on a feature; there&#x27;s no staging, so modifications I make are all
    stored as the current change.<p>Later that day I realised I needed to actually
    save the version of the feature that existed when I started work that morning.<p>So
    into the evolog I go (`jj evolog`). It&#x27;s a record of all commits that a change
    has been; I could scroll back through the recorded changes, find the first change
    made that day, and then &#x27;jj new&#x27; to create a change that represents
    that work.<p>It felt magical, to just be able to jump back to a project state
    that I didn&#x27;t explicitly record, then save it.
