    A bit odd but one can also push `@` to a remote (e.g. iterating on something and piggy backing on a CI-system), avoiding having to squash and then push.<p>Having a stack of PR&#x27;s, then rebasing it all to see a conflict, and only having to deal with it one is also magical.<p>Moving bookmarks around can be annoying.<p>Workspaces work fine, and there&#x27;s two options:<p>- the normal ones, where a full .git isn&#x27;t created. That works fine, unless having tooling that expects the workspace to also work as a git repository, in which case ..<p>- you can make the workspace collocated, less lightweight, but git tooling works
