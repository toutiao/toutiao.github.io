  author: bilkow
  text: 'Yes, for new that&#x27;s what `jj split -i` &#x2F; `jj commit -i` do by default.
    For existing that&#x27;s `jj squash -i`.<p>`-i` makes it interactive (you select
    the changes you want in the parent, using a TUI), but you can also pass the list
    of files as arguments. You can also choose which commit you want to split (for
    split) or move from, to (for squash), etc, with arguments. More info on them here:
    <a href="https:&#x2F;&#x2F;docs.jj-vcs.dev&#x2F;latest&#x2F;cli-reference&#x2F;#jj-split"
