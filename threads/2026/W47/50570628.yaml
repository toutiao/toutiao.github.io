  author: sundarurfriend
  text: 'I used jujutsu regularly for a while (several months) about a year ago. My
    conclusion, in short, was that the improvement over my lazygit based setup was
    small enough that it wasn&#x27;t worth the friction and small annoyances of jj.
    I&#x27;d still recommend trying it if you have the bandwidth for it, it just isn&#x27;t
    a strong recommend of &quot;this is undoubtedly better&quot;.<p>Longer version:
    if jj was what git had been originally, it would have saved millions of people
    a lot of pain and annoyance. It&#x27;s definitely a better tool than git originally
    was. By now, though, git has gotten reasonably better, and the ecosystem around
    it has become polished enough, that the nicer, well-thought out UI of jj isn&#x27;t
    as much of a slam dunk win anymore. It&#x27;s still pretty good to work with,
    but there were enough papercuts for it to be not worth it for me: missing docs
    and features due to immaturity (presumably&#x2F;hopefully to a lesser degree by
    now than back then), the friction of bookmarks interacting with branches in remote
    git forges, the fact that every throwaway file is committed right away (theoretically
    optional, practically assumed by every jj workflow out there) so you need to both
    ignore it and prune it out of history every time, there being `jj &lt;command&gt;`s
    and `jj git &lt;command&gt;`s that you need to remember which is which - all of
    these have understandable reasons and are small things, but overall added up to
    the fact that I felt myself dreading the jj-specific issues more than I enjoyed
    the upsides of it.'
  score: 0
