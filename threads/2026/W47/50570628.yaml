  author: danpalmer
  text: In my experience, git has a few workflows that work well, and you can wrap
    them to improve the UX. JJ on the other hand is just designed better – there are
    many more workflows that will work well in it, and you can mix and match them
    more effectively, and because it&#x27;s better designed there&#x27;s less need
    for wrappers to simplify the UX because the fundamentals are simpler.<p>That said,
    I think JJ will get better when it&#x27;s backing on to something that&#x27;s
    designed from scratch rather than backing on to git and forges like Git(Hub|Lab)
    which really restrict it.
