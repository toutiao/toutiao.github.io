  author: rbehrends
  text: "&gt; You should always use server-side CICD.<p>First, server-side CI is usually
    only running for the last commit, so if you have a series of commits pushed at
    once, this doesn&#x27;t really help.<p>Second, it&#x27;s not even so much about
    the validating a commit (which, for intermediate steps, it might not do), but
    so that each commit hangs together and a change as a logical unit doesn&#x27;t
    exist partly in one and partly in another commit [1].<p>Conceptually, the whole
    staging process flies in the face of the idea that a commit should represent an
    atomic repo change and feels more CVS-like.<p>&gt; That&#x27;s a UI problem. I&#x27;ve
    been manually selecting code with Magit for years and it&#x27;s very effective.<p>There
    are two counterpoints I would like to make here. One is that if you need additional
    tooling to work around a problem in an existing tool, that does not mean the original
    tool does not have a problem.<p>The other is that better tooling does not mean
    that the increased error rate from unnecessary manual steps goes away; it can
    mitigate it, but it does not do away with the consequences of e.g. inadvertent
    lapses of attention.<p>And realistically, in most cases it is just unnecessary
    extra work for no good reason.<p>[1] Mind you, there&#x27;s the problem that commits
    are really used for two different things, one is to capture conceptual steps and
    one is to to do quick save of the repo state, and no existing VCS does a good
    job of reconciling these two different purposes."
  score: 0
