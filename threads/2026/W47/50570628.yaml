  author: pkuki
  text: "FUSE isn&#x27;t new, but GitFS, EdenFS and VFS for Git solve a different
    problem: lazy fetching from a server. A checkout is cheap until something reads
    it - e.g agent trying to run rg over the whole tree. That problem is solved in
    gitfold.\nAlso gitfold does not need or try to change any existing git behavior,
    and is fully compatible with existing git binaries without any modifications.
    \nSo while used technology is the same, approach is from completely different
    angle."
