  author: LoganDark
  text: git has some rhyme and reason, but to me it&#x27;s like the imperative to
    jj&#x27;s declarative. jj feels like a React of version control, performing all
    the needed mutations automatically to arrive at the result you&#x27;ve specified,
    while git is still concerned about each individual mutation one at a time. There
    are layers you can add on top of git to achieve jj-like capability, and I often
    see people asking how jj has any benefit over such a layer.
