  author: CharlieDigital
  text: 'About 5 weeks ago now, I moved over to Paseo[0] (OSS, Apache 2.0, no affiliation)
    while trying a few other &quot;meta harnesses&quot;.<p>This turned out to be a
    very interesting experiment for me.<p>The agent profiles configuration was the
    most interesting.  It looked way too simple.  No tools, no real spec, no configuration
    of skills.  But actually, it somehow turned out way more useful&#x2F;powerful
    and subtly different from how the native harness models sub-agents.<p>I wrote
    about my setup and why I think it works[1].  The gist of it is that it is effectively
    a dynamic, multi-agent harness.  I know what you&#x27;re thinking: CC and Codex
    can do that, too.  But Paseo has a few interesting bits: it can use multiple providers,
    harnesses, and models; the agents can talk to each other or through a coordinator;
    it has a nice toolset for agents to use and well tuned skills.<p>So I have a full
    team set up and the lead orchestrator then automatically decides when it needs
    a Member of Technical Staff, a DBA, an End User Advocate, a UI Designer to provide
    input and feedback.<p>As I wrote in my blog post, the main wins I observe are
    that: 1) the autonomous output is better, higher quality, more detailed because
    of internal team critique, 2) I can spread my tokens better across OpenAI, Anthropic,
    and DeepSeek; it may not be overall more &quot;economical&quot;, but I can effectively
    &quot;stretch&quot; my sessions by distributing tokens.<p>I recommend checking
    out <a href="https:&#x2F;&#x2F;agentmgmt.dev&#x2F;" rel="nofollow">https:&#x2F;&#x2F;agentmgmt.dev&#x2F;</a>
    and finding the right meta-harness for you since I think that this setup of specialized
    agents has worked well for me.<p>[0] <a href="https:&#x2F;&#x2F;paseo.sh" rel="nofollow">https:&#x2F;&#x2F;paseo.sh</a><p>[1]
    <a href="https:&#x2F;&#x2F;chrlschn.dev&#x2F;blog&#x2F;2026&#x2F;10&#x2F;larping-with-agents-and-why-it-works&#x2F;"
