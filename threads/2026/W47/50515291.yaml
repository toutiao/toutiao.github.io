  author: drensin
  text: |-
    Hey folks.. Seeing lots of great comments (really) here, I wanted to chime in with a little background on EGM (and why we released it).<p>First Principles:<p>1) The code needs to be understandable by new human and new AI team members
    2) For #1 to be true - esp for the AI - there needs to be some record of _why_ the code was written&#x2F;generated the way it was.
    3) It&#x27;s probably best&#x2F;easiest if this context exists in source control next ot the code and needs to be audited regularly for drift.
    4) The cost of cleaning up a large tangle of wrong code is much more expensive than giving the AI enough guidance up front to avoid the tangle in the first place.<p>That&#x27;s why EGM (for better or worse) works the way it does.<p>Finally.. We don&#x27;t think EGM is anyone&#x27;s ending point in AI&#x2F;agentic&#x2F;etc development. We just wanted to make a useful _starting_ point for lots of people.<p>Also, EGM is what a lot of use day-to-day inside of Google so we thought it would be neat if we shared it with everyone else - in case that was useful.<p>-dave :-)
