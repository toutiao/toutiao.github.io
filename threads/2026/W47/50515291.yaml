    # Elephant-Goldfish Model

    EGM is an open-source plugin for AI assistants. You develop a plan with an assistant that knows the background. Reviewers that do not see the conversation then read the plan and report what is missing or unclear.

    - Drafting assistantKnows your goal, the background, and the whole conversation.

    ## Drafting assistant

    Knows your goal, the background, and the whole conversation.

    - Your written planThe only thing the reviewers read.

    ## Your written plan

    The only thing the reviewers read.

    - Fresh reviewersStart from zero and report what is missing or unclear.

    ## Fresh reviewers

    Start from zero and report what is missing or unclear.

    - The findingsYou check them and decide what to change.

    ## The findings

    You check them and decide what to change.

    ## Explainer

    See how the drafting assistant and fresh reviewers work together on a plan.

    ## An example

    An author knows things that the plan does not say. Reviewers without the conversation find those gaps.

    ### Study space opening plan

    The space opens on 3 March. Volunteers staff the desk1 during opening hours2. Students book rooms with the usual form. We keep the Friday rule3.

    - Who staffs the desk?The plan names no person and no rota.

    #### Who staffs the desk?

    The plan names no person and no rota.

    - When is the space open?The plan refers to opening hours but does not state them.

    #### When is the space open?

    The plan refers to opening hours but does not state them.

    - What is the Friday rule?The plan depends on a decision that the reader cannot see.

    #### What is the Friday rule?

    The plan depends on a decision that the reader cannot see.

    ## Where to start

    Bring a class project, a design brief, a delivery plan, or a software design. Write down the goal, constraints, and decisions a reviewer needs to understand.

    ## Install

    EGM runs as a plugin in these applications. You do not need to write software.

    Open the plugin page and select Install. This listing is desktop only.

    Open the plugin panel and add this marketplace.

    Run this command, then start a new session.

    Run this command, then start a new session.

    Run this command, then start a new session.

    Review support differs between applications. Read the install guide or view the source.

    The method comes from Dave Rensin’s article, Elephants, Goldfish, and the New Golden Age of Software Engineering.
