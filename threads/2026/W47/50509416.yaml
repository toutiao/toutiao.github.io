  text: At a previous job (many years ago) we used to run RabbitMQ. I hadn&#x27;t
    configured it originally, but I was certainly left with it in pieces when it entered
    split-brain mode in the face of some bizarre network failure.<p>So we had our
    application talking to two nodes of a cluster, both working normally without talking
    to each other (nevermind the fact that the connectivity between the machines was
    fine). Some workers picked up jobs, others didn&#x27;t. IIRC the app read requests
    from a queue and wrote replies to another one, so we&#x27;d have half of the jobs
    being picked up, and then half of the replies not being picked up (ergo, 75% of
    the requests failed). It was bizarre and nothing seemed to indicate there were
    issues with RabbitMQ itself. I don&#x27;t even remember how we figured it out
    at the time.<p>It&#x27;s been nearly 10 years, I&#x27;m sure that it&#x27;s better,
    that I was inexperienced, that the original setup wasn&#x27;t great. But that
    left me so sore on it that I have actively avoid it ever since.<p>Bonus points
    for having dealt with this while Django Celery apparently had two independent
    configuration mechanisms, and both were being used in this app. Fun times.
