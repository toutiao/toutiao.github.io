  text: The de-escalation is for when you come back out of the shelter and there are
    other survivors you have to interact with. If starving people with guns pull up,
    you could potentially convince them to let you join. Bigger groups are stronger.<p>Despite
    what the <i>Walking Dead</i> would have you believe, it won&#x27;t be total anarchy
    and looting. Neighbors will work together and support each other against outsiders.
    Groups will coalesce and co-operate. Humans are social, tribal creatures. We automatically
    form societies and tribes, especially during a calamity.
