  author: throw0101c
  text: See also perhaps the book <i>The Knowledge</i>:<p>&gt; <i>Human knowledge
    is collective, distributed across the population. It has built on itself for centuries,
    becoming vast and increasingly specialized. Most of us are ignorant about the
    fundamental principles of the civilization that supports us, happily utilizing
    the latest—or even the most basic—technology without having the slightest idea
    of why it works or how it came to be. If you had to go back to absolute basics,
    like some sort of postcataclysmic Robinson Crusoe, would you know how to re-create
    an internal combustion engine, put together a microscope, get metals out of rock,
    accurately tell time, weave fibers into clothing, or even how to produce food
    for yourself?</i><p>&gt; <i>Regarded as one of the brightest young scientists
    of his generation, Lewis Dartnell proposes that the key to preserving civilization
    in an apocalyptic scenario is to provide a quickstart guide, adapted to cataclysmic
    circumstances. The Knowledge describes many of the modern technologies we employ,
    but first it explains the fundamentals upon which they are built. Every piece
    of technology rests on an enormous support network of other technologies, all
    interlinked and mutually dependent. You can’t hope to build a radio, for example,
    without understanding how to acquire the raw materials it requires, as well as
    generate the electricity needed to run it. But Dartnell doesn’t just provide specific
    information for starting over; he also reveals the greatest invention of them
    all—the phenomenal knowledge-generating machine that is the scientific method
    itself. This would allow survivors to learn technological advances not explicitly
    explored in The Knowledge as well as things we have yet to discover.</i><p>* <a
