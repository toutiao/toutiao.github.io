  author: pigpop
  text: "&gt; It&#x27;s more like a war or pandemic that leaves half the population
    dead and society broke down<p>Half the population dead is still a doomsday scenario
    especially for a technological civilization. We are far more dependent on others
    than we were the last time any society saw that scale of death. If you&#x27;re
    thinking it would only take a decade or two to recover then I&#x27;d revise the
    estimate to maybe 10% of people killed. Those are heavy losses even for combat
    but not unrecoverable if that&#x27;s the extent of the death toll. 50% dead would
    get ugly really quickly. A lot of critical information and skill would be lost
    and you&#x27;d be short half the workforce needed to operate things the way they&#x27;re
    set up. Sure, there&#x27;d be less people and less demand for necessities but
    there&#x27;d probably be a lot more emergencies to deal with due to nothing working
    the way it should and everything being harder to accomplish.<p>Think how that
    would affect just fire departments as an example. Crew is only cut in half if
    you&#x27;re lucky, maybe they&#x27;re all gone if they are needed at home. More
    places are abandoned or unattended so fires that start get out of control. A lot
    of things are being done by people who are inexperienced or don&#x27;t have the
    right skills or who are overloaded with additional work so more accidents are
    going to happen, electrical fires, car accidents, heavy machinery accidents, house
    fires caused by improvised cooking methods if there are blackouts, maybe even
    intentional arson.<p>That&#x27;s only a fire department but everything would be
    affected. How do nuclear power plants fare with half the engineers and technicians
    to operate them? How do factories operate when half of the people who knew how
    to make new injection molds are dead? or the people who service the machines and
    equipment? what happens to medicine when half the surgeons die before they can
    pass on their skills? and so on for everything."
