  author: alwa
  text: 'One phenomenon I’d not thought of until I encountered it, but that seems
    obvious in retrospect: in the immediate course of an exogenous shock (like natural
    disaster or war or large-scale social disruption), people tend to really come
    through for their neighbors [0].<p>The most reliable pattern seems to be a temporary
    burst of social cohesion. To the extent that durable negative social outcomes
    materialize, they tend to (1) roughly follow the contours of the same new material&#x2F;social
    circumstances had they developed non-suddenly; and (2) take weeks and maybe months
    to overcome that initial swell of empathy.<p>In any case I agree that the human
    side is the important side—we owe a nod to communities like the Amish and religious
    orders who’ve done a lot of R&amp;D into social cohesion technologies during blue
    skies!<p>[0] (e.g. <a href="https:&#x2F;&#x2F;pmc.ncbi.nlm.nih.gov&#x2F;articles&#x2F;PMC7115229&#x2F;"
