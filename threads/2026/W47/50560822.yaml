  author: ltbarcly3
  text: If you read up on what it will actually be like after an &#x27;event&#x27;,
    the real question is whether or not society picks back up.  If it is a &#x27;The
    Road&#x27; scenario no amount of preparing will do much for you.  If it&#x27;s
    a &quot;Cultural Revolution&quot; then having food kept by, if it is secret, will
    be extremely useful.<p>In between you have things like large scale nuclear war
    or meteor impact, where you need to survive the total collapse just long enough
    for civilization to get up and running again, maybe 6 months to a year at most
    (read On Thermonuclear War for an analysis).  In the &#x27;in between&#x27; scenarios,
    you need to worry about water and food and shelter, and if you survive more than
    2 weeks post event you need to worry about all the people who are running out
    of food and water, because they will come knocking and at a minimum take all your
    food and water.  Unless you are somewhere very remote and ideally around large
    extended family so you can protect each other this is a very tricky problem and
    I have never seen a reasonable solution for it, at least for anyone that doesn&#x27;t
    live full time in a remote area.
