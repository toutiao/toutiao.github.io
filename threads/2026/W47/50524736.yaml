  author: fuzzfactor
  text: 'I&#x27;ve been having a seamless dual-boot experience with Windows 11 and
    Linux Mint Debian Edition, LMDE7.<p>As a preface to those Mint instructions, in
    Windows Disk Management I shrink the main Windows partition by about 20GB to 50GB,
    this creates some new &quot;unallocated space&quot; immediately following the
    normal Windows C: volume.<p>Then create a &quot;New Simple Volume&quot; in that
    unallocated space, but do not assign a drive letter and do not format.  This will
    be the sole Linux partition, no &#x2F;swap, no &#x2F;usr, none of that monkey
    business when you are <i>not replacing Windows</i>, merely adding Linux as an
    option to a &quot;virtually unchanged&quot; Windows PC.  You want Linux to occupy
    a single partition just like Windows does.  At the Command prompt in Windows Diskpart,
    next select the target HDD or SSD, then select the target Linux partition on that
    drive, and &quot;SET ID=4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709 which is the designator
    for Linux Root.  Also in Diskpart you can select the EFI volume and assign an
    alphabetical letter to the EFI volume so you can see the hidden folders and back
    up the Windows-specific \EFI\Boot\bootx64.efi file contained within.  Manipulating
    the &quot;hidden&quot; EFI files can only be done at the Command prompt (not the
    GUI) after assigning a drive letter like this, and after you reboot, that drive
    letter will be removed automatically and no more access to EFI unless you reassign
    a  drive letter again in CMD.<p>Then boot to the LMDE7 USB drive so you can install
    Linux to the unformatted partition.<p>In the Mint install wizard you will have
    to choose the &quot;Manual&quot; partitioning &amp; formatting option, which opens
    up infinite possibilities, but this simple dual-boot arrangement only takes a
    couple distinct settings.  In the displayed list of partitions, select that unformatted
    volume as &quot;root&quot;, indicated by the single slash &quot;&#x2F;&quot;,
    and choose to format it using ext2, ext3, or ext4.  Then in the small fat32 boot
    partition (where the Windows boot files are already residing in the &quot;hidden&quot;
    \EFI\Microsoft\ folder), <i>Do Not</i> format this partition, but select it as
    the ideal location for the Linux boot files, and designate it as &quot;&#x2F;EFI&#x2F;Boot&quot;.<p>That&#x27;s
    it.<p>After completion, Linux will be completely independent from Windows.  In
    the EFI boot volume there will be a new \EFI\debian\ folder alongside the \EFI\Microsoft\
    folder.  The only change to any Microsoft files (and it&#x27;s a &quot;big&quot;
    one) is within the \EFI\Boot\ folder which is a common folder to all the OS&#x27;s
    on that SSD.  When first powered up, \EFI\Boot\ is the folder that the UEFI firmware
    searches for so it can execute \EFI\Boot\bootx64.efi which then boots the PC.  On
    a plain Windows PC the bootx64.efi file is from Microsoft and points to \EFI\Microsoft\
    then Windows boots normally.  The Linux install process replaces bootx64.efi with
    a different bootx64.efi which points to \EFI\debian\ instead.  This is also a
    good time to use Windows to back up the Debian-specific bootx64.efi file.<p>Fortunately,
    the Mint install process runs a Grub routine including os-prober, which as the
    name implies, probes for other OS&#x27;s besides the Linux you are presently installing
    at the time.  And auto-adds any OS&#x27;s found, to the new Linux multi-boot menu.  So
    it reliably picks up a regular Windows installation and adds an entry for that
    Windows to the Linux bootmenu.  Basically that Windows bootentry points to the
    same old \EFI\Microsoft\ folder which is unchanged and then boots Windows normally
    when selected.<p>Unfortunately, os-prober has been commented out of the Grub files
    and the probe only functions upon OS installation.  So when Grub itself is re-installed
    or updated at a later time, intentionally or not, os-prober no longer runs by
    default and Windows will be auto-removed from the Linux bootmenu and you wonder
    where it went.  Windows is still there intact regardless and can be recovered
    by replacing the Linux bootx64.efi with the original Windows bootx64.efi that
    you backed up earlier.  But that would give you no more menu access to Linux.<p>To
    avoid this deficiency in the default Grub files, in Linux you need to edit the
    \etc\default\grub file to uncomment (remove the # hashmark from) the GRUB_DISABLE_OS_PROBER=false
    line.  This basically requires using sudo at the Linux command line since otherwise
    the file is read-only.'
