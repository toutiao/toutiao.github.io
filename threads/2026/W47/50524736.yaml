  author: GuB-42
  text: If the server is located reasonably close to you (same country&#x2F;state),
    you can expect a round trip latency of ~10ms, which is less than the latency of
    a top of the line competitive PC, and well under the limit of human perception
    for audio and visual feedback. So, viable in this universe.<p>In practice, there
    are a lot more variables, but under 40ms is achievable today with a good PC, a
    good connection, and a reasonably close server. That&#x27;s good enough for all
    but the fastest games with competitive gameplay, and cloud gaming is generally
    considered a better experience than a low-end PC.
