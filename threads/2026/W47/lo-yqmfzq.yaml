    One really clear turning point for Apple on a technical level was the switch from Objective-C to Swift. At the time it seemed like an exciting transition, bringing a stricter compiler and a syntax that younger web developers saw as familiar. But after going through years of churn to switch to this supposedly modern language, what did they actually gain? Objective-C was really elegant, and (unlike C++) a strict superset of C. Swift became bloated with features, including excessive type inference that made it look good on slides but absolutely tanked compile times.
    Francisco Tolmasky (part of the original iPhone team) talked about the many mistakes they made when introducing Swift, including not consulting the army of application developers within Apple itself before announcing it. It's a language made by LLVM compiler geeks that had little application-level experience, and had dubious features like declarative syntax bolted on afterwards. I'd argue this was actually their biggest mistake on the software side, because it affected their entire ecosystem across all of their products.
