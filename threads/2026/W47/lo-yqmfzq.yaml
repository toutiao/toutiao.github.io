  text: |-
    But after going through years of churn to switch to this supposedly modern language, what did they actually gain?

    A lot of performance. Objective-C imposes a lot of dynamic language overhead on top of C, which has some benefits, but makes it hard to devirtualize. I'd rather eat compile time than run time. And as the sibling comment points out, it's a lot more secure and appropriate for systems work.
    As David Chisnall will point out, Objective-C is a good language for the problems of the 90s, but we have a different set of problems now.
