    I hope you’ll find it useful! I just added (but have not yet released) live snapshot support. The idea here is that when something writes to your working copy (e.g. your editor or an agent), its work is snapshotted and shared within seconds without you needing to run any extra commands.
    It is possible to even have the working copies of other machines updated when that happens, if they have the same change checked out, but I’ve found that to be more aggravating than beneficial because it turns conflicting edits from “I’ll deal with it when I’m ready” into “I must deal with this now”.
