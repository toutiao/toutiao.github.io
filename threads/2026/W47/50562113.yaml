  author: deaux
  text: "&gt; That’s what people here said about Corbyn, but it doesn’t work that
    way. Voters often don’t like those positions in combination as advocated by a
    single “extreme” candidate, even if the policy positions poll well individually.<p>It
    does work that way. Corbyn was up against a very strong tory candidate. Starmer
    was up against an incredibly weak tory candidate. This explains almost the entirety
    of the gap. &quot;Candidate&quot; here includes &quot;party&quot;, rather than
    just the person, though it&#x27;s very much a combination of both.<p>This factor
    is consistently, enormously underrated in countries with effectively a two-party
    system such as the US and UK. It&#x27;s like how a football team losing 1-0 to
    Arsenal, to keep with UK analogies, is a better result than beating Kettering
    Town 1-0. People understand this for sports, but very few recognize the exact
    same in politics. The politician losing that first match actually did _better_
    than the second politician who won. Outside of people very deep into politics,
    this is barely ever recognized.<p>Another thing is that policy is very separate
    from image. The exact same policies can gain or lose votes depending on how they&#x27;re
    conveyed, the messaging, and the image cultivated by the politician in question.<p>&gt;
    I doubt this. What’s your basis for saying so?<p>Genuinely tons of research, this
    is not controversial. If you need some queries, &quot;political surveys policy
