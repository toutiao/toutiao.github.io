  author: natch
  text: Apple has significantly weakened its security assurances in a way that is
    arguably deceptive. They used to say nobody can access your data, not even Apple.
    Now they say Apple cannot access your data. People will point out that your key
    is created on your device, lives on your device, and never leaves your device,
    but that is just your key. Your key is likely a KEK (key encryption key) that
    opens another key (not “your” key, let’s call it the actual key) that your data
    is secured with. There can be other parties (UK government) with their own KEK
    that opens a copy of the actual key. In this scenario, Apple can have no access
    to a KEK that opens the actual key, but they are forced to make the wording change
    they did, if they want to stay honest.<p>I say the statement is arguably deceptive
    because it presents the same feel of assurance that the old one did, to most people.<p>Note
    John Ternus in a recent event (WWDC keynote if I recall correctly) used the old
    wording. I think this was a slip-up (I’d hate to think it was a calculated lie
    posing as a slip-up).
  score: 0
