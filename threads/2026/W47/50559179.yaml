    at Bob’s location. In this case, Bob would observe a modified or misleading signal
    rather than the one generated by Alice.<p>&gt; In a more elaborate scenario, Mallory
    could attempt to block the signal entirely by constructing the gravitational analog
    of a Faraday cage. This would require surrounding either Alice or Bob with a continuous
