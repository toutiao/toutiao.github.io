  author: kerblang
  text: It was <i>less</i> broken before open source allowed an architectural explosion,
    because the dependencies were too expensive. It took a lot of arguing to get management
    to splurge on a single library or other tool. A lot of astronaut-architect wannabes
    were constantly grumpy about mgmt that wouldn&#x27;t pay for the latest whiz-bang
    thingie.<p>The actual programming logic has certainly always been complex, but
    the integrations weren&#x27;t so bad. You could learn your very small toolset
    quickly and focus on ideas. Now, you have an ultra-massive toolchain to come to
    terms with, made up of free software and &quot;cloud&quot; architecture that starts
    off cheap and gets expensive later on.<p>Dependencies have always been the problem,
    but that problem has expanded in every direction, at every layer, approaching
    our own limits of comprehension. AI has allowed us to catch up, temporarily, but
    given the collective penchant for upping the ante, I expect the real supernova
    is yet to come.
