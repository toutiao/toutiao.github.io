  author: antonvs
  text: "&gt; Which is great for corporate accountability<p>This is a common take,
    but it&#x27;s most attractive for its cynicism, it doesn&#x27;t fully represent
    the reality.<p>Cloud vendors are also great for allowing corporations to implement
    systems that would be prohibitive for them to implement, operate, and maintain
    as reliably on their own. Even big enterprises often struggle to implement everything
    they need, that a cloud provider can provide out of the box.<p>I worked at a multi-billion
    $ subsidiary of a global Fortune 500 company that tried, as part of its move off
    mainframes, to &quot;go its own way&quot;, with their own hardware in Equinix
    data centers. The entire executive level of the IT team responsible for that effort
    - about five or six people - were eventually fired, along with much acrimony,
    because they couldn&#x27;t pull it off. There were plenty of warning signs, but
    the final straw came when there was a major security breach, which was unacceptable
    because this company had federal customers and were subject to all sort of federal
    regulations, including CFIUS because the parent company was non-US. (They once
    had to rewrite an entire major system from scratch because of a breach of CFIUS
    regulations that made the government consider their code to be potentially compromised.)<p>That
    may be an unusual case, but the point is that if even large, well-funded, established
    companies can get a lot of benefit from cloud systems, that goes double or more
    for smaller companies, companies in less attractive industries, etc. etc.<p>(Pointing
    this out sometimes triggers people who maintain servers themselves, especially
    here on HN, but the point is those people don&#x27;t work at the companies in
    question, and essentially don&#x27;t scale - i.e. it&#x27;s difficult to recruit
    enough of them and manage them and put together a durable system with enterprise-grade
    reliability that depends on having 10x sysadmins.)<p>And yes, &quot;shit, EVERYTHING
    is down today&quot; is a consequence of all this, but the alternative is generally
    much worse for individual companies."
