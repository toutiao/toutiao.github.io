  author: CharlieDigital
  text: 'You can be productive and guide AI to operate in a more compliant way: by
    writing down basically everything you know, every heuristic you have, documenting
    the correct patterns, documenting the framework level approach, explicitly spelling
    out what&#x27;s good code, writing down detailed specs for an agent to work on,
    writing the test plan, etc.<p>A lot of devs still think their job is to produce
    code; it&#x27;s actually to produce all of the guidance and structural scaffolding
    for the agents (&quot;the harness&quot;) to guide its behavior and output.<p>A
    concrete example: I wrote a small library[0] (MIT, OSS) that improves how agents
    write unit and integration tests.  This isn&#x27;t product code, but this makes
    the agent better at writing the tests it uses to verify its work.  (Tests become
    denser, more semantic, less context, type-checked setup, etc.). You can&#x27;t
    expect an agent to do this by itself; the human needs to produce the scaffolding.<p>[0]
    <a href="https:&#x2F;&#x2F;github.com&#x2F;zeeq-ai&#x2F;zeeq-biome" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;zeeq-ai&#x2F;zeeq-biome</a>'
