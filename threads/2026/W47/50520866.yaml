  author: Forgeties79
  text: SOP and documentation is everything. You don’t want it going out of bounds
    and coming up with its own solutions, which are often just inefficient facsimiles
    of random stuff it finds that seems to makes sense. You also run the risk of not
    understanding the solution it puts in front of you. With an ironclad SOP and quality
    documentation, you know when it is straying from the best paths, because they
    are laid out for both of you.<p>Plus your documentation can often work very well
    alongside whatever skills you have created over time, because you basically have
    two sources it is drawing on telling it to do the same thing. I find it leads
    to less off book behavior.<p>I’ve always been perplexed by how people see AI as
    this creative tool or something to innovate with. That’s not how I see it at all.
