    around ~10 web frameworks&#x2F;libraries<p>_not a single one was even close to
    being complete or mostly correct, even just for standard HTTP ~1.1 handling_!!!
    (The routing, path, header handling. Not any of the complex stuff in HTTP2, Quick
    etc.)<p>the problem isn&#x27;t using dependencies, that is the solution (not reinventing
    the wheel again).<p>And preferring reusing solutions which are more complete,
    practical testet and have more resources to maintain&#x2F;improve basic functionality
    is (in most situations) not &quot;anxious&quot; development, but (should be) common
    sense.<p>The amount of hidden complexity in even somewhat basic stuff like HTTP
    is enourmous, rewriting everything all the time is wasting billions across the
    industry all the time and (in general) increases the chance for bugs.<p>The problem
    isn&#x27;t &quot;using dependencies&quot; or small dependencies, but:<p>- availability
    (or lack) of high quality well maintained dependencies<p>- &quot;no one&quot;
    wanting to pay for software dependencies<p>- misguided tendencies for &#x27;clever&#x27;
    &amp; overengineered solution in one extreme (e.g. the stuff which lead to log4shell)<p>-
    misguided obsession with deceptive simplicity in artificial examples which lead
    to 1001 incomplete solutions because of the obsessiv simplicity doesn&#x27;t stop
    at cutting out over-engineering but also cuts out fundamental parts<p>- lack of
    widely adopted, effective, tooling &amp; infrastructure to trust dependencies.<p>-
    lack of tooling to more efficient reuse and compose working parts, the way we
    do programming seems just very fundamental broken.<p>- also a lot of legacy tech
    we are stuck with making many things unnecessary complicated<p>Also as a side
    note, number of packages != number of entities to trust. Weather you use 10 or
    1 package from the same source, maintained and published in the same way often
    makes little to no difference for supply chain security."
