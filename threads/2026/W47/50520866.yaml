  author: CharlieDigital
  text: 'It doesn&#x27;t have to be this way.<p>AI is great at following patterns.  AI
    is great at writing tests.  AI is great at doing work that humans would consider
    drudgery and then applying &quot;enough&quot; judgement to it.<p>The problem is
    that most software teams and most engineers are very, very bad at the thing that
    AI needs to succeed: technical writing.  Documenting the patterns, the rules,
    the heuristics, the SOP, the judgement; developers could barely be bothered to
    write comments before (which in the AI age are free, infrastructure-less memory
    that is always &quot;line-of-sight&quot; for the agent and can be used to enrich
    with keywords).<p>It&#x27;s not that AI is the problem, it&#x27;s that we humans
    are good at resolving these constraints in the real world at a human pace.  AI
    makes that pace impossible for a human to keep up as a trailing activity.  Rather
    teams need to invest more in technical writing and producing the corpus that AI
    relies on to learn the operational constraints and rules.'
