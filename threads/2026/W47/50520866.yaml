  author: flufluflufluffy
  text: 'I don&#x27;t think the point was to blame AI for PHP2Shell. It is that we&#x27;ve
    built up gigantic systems on shaky foundations: &quot;a highly complex system
    made of low quality parts, where a single error can compromise everything&quot;<p>Of
    course the shaky foundations were there before AI. And before the widespread proliferation
    of NPM packages etc... But those increase the ease and pace at which we can build
    on top of the shaky foundations, they increase the rate of so-called decoherence.
    And there are economic and organizational incentives to keep increasing that ease
    and pace. That makes it more and more likely that a problem in one of the shaky
    foundations (whether AI-created or not) causes a system-wide failure, and at the
    same time results in a more and more generalist tech workforce, making it harder
    and harder for an organization to respond appropriately when that happens:<p>&gt;
    I believe that tech companies risk losing their “organisational cognition” - their
    ability to think and respond as a coherent unit.<p>&gt; This is the real threat:
    a scenario where nothing in the system is done with intent, and nobody in the
    system has control. We generate complexity faster than we can tame it.'
