  author: adamddev1
  text: People keep believing that the big LLM players with somehow disprove Rice&#x27;s
    Theorem. &quot;Somehow we&#x27;ll be able to get AI to check if a program does
    X or Y.&quot; &quot;We&#x27;ll be able to have the machines verify things automatically.&quot;
    But this is is of course as hopeless as solving the Halting Problem. Theoretically,
    we know this is impossible.<p>Empirically, we can observe the breaking effects
    of this broken thinking. Code quality goes down, and apps go from being 99% to
    95% reliable. But that&#x27;s not a big deal, they say, that&#x27;s good enough...
    But when the quality of all the building blocks further down get degraded in the
    same way, you can&#x27;t keep track of which parts are broken, and which parts
    are dependable, and the whole thing comes crumbling down.<p>People keep saying,
    &quot;I can build an app with AI, therefore we can build everything with AI.&quot;
    This article talks about some potential anecdotes that could help to show that
    doesn&#x27;t work.
