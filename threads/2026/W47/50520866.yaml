  text: I&#x27;ve been using Linux since 1997, and I&#x27;ve never seen a Linux box
    being &quot;owned within 5 minutes of putting it on the Internet&quot;. These
    things simply didn&#x27;t happen in the early 2000s (it <i>did</i> happen with
    Windows 95&#x2F;98&#x2F;XP, though). The Linux kernel and Linux distributions
    had matured enough already at that time and surely didn&#x27;t crash regularly,
    neither as desktop OS nor as server.<p>Things were less convenient and generally
    harder to set up back in the days (we had to fight with XFree86 configurations,
    desktop environments were immature, a lot of hardware didn&#x27;t work due to
    lack of driver support, application software for many tasks were unavailable,
    there were barely any commercial games), but the kernel had excellent network
    support and scaled very well across multiple CPUs already (unlike Windows NT&#x27;s
    SMP support, let alone the single-CPU-only DOS ancestors). During the 2000s, the
    Top 500 list of supercomputers was slowly being taken over by Linux clusters,
    and that wouldn&#x27;t have happened if Linux would have been unstable. For developers,
    Linux was (and arguably still is) heaven on earth, and developers actually made
    sure that &quot;their&quot; system worked well for them. And it did.<p>There were
    many difficulties with software in the past, but Linux was rarely one of them.
