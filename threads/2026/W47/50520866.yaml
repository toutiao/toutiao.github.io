  author: swatcoder
  text: The timeline is very confused, but the arc is mostly right.<p>1. Consolidating
    internet-dependent projects to a few winning cloud vendors and a dozen winning
    SaaS providers, made all of those project have coincident failure points. Which
    is great for corporate accountability (&quot;it&#x27;s Amazon&#x27;s issue, not
    ours!&quot;) but bad for end users (&quot;shit, EVERYTHING is down today&quot;)<p>2.
    The movement to migrate fat local-first projects towards thin internet-dependent
    or server-hosted ones made almost <i>all</i> software share those same coincident
    failure paths. This was good for entrenching a subscription business model and
    brought some end user conveniences, but meant everything being down meant <i>everything</i>
    being down.<p>3. Anxious and lazy dependency-first development culture (&quot;you
    could never write that as well as some github rando&quot;) meant projects now
    had an order of magnitude more contributors but only reviewed and owned code for
    a surface level, making all these projects extremely vulnerable to supply chain
    failures and subject to constant maintenance churn.<p>4. Employment and team tenure
    continually fell so that most projects no longer have experienced owners and instead
    just temporary custodians.<p>You can find the <i>seeds</i> of many those problems
    in the 1990&#x27;s and earlier and you can even argue that some of them were inevitable
    (and even worthwhile) destinations for the industry as it evolved without an engineering
    guild to slow it down and insist on rigor or evidenced safety.<p>But anybody who&#x27;s
    been around for a few decades can attest to how these risky patterns rapidly grew
    into <i>norms</i> over the past 20 years and shifted the industry from one where
    any given software had some idiosyncratic bugs that users could learn to work
    around to one where all software had lots of bugs, many of them correlated across
    apps, whete failures would wash through and shut down (or make vulnerable) whole
    industries for hours or days, with effecrively nobody in particular to hold to
    account for any of it.<p>Software has never been in a pristine &quot;golden age&quot;,
    but the last 20 years built almost everything on one giant, shared house of cards
    that&#x27;s now teetering on the brink of collapse. Better or wose, it&#x27;s
    indisputably different than it was before.
