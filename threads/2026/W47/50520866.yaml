  author: skydhash
  text: "&gt; A lot of devs still think their job is to produce code; it&#x27;s actually
    to produce all of the guidance and structural scaffolding for the agents (&quot;the
    harness&quot;) to guide its behavior and output.<p>This basic reasoning is wrong
    and leads to “orchestration porn”. Thinking that you can laid down rules to automate
    software production like it’s a factory pumping out product.<p>What you forget
    is that software are grown iteratively, not guided down some assembly line. Every
    patch is a revision of what the software should do, not the next step od a workflow.<p>So
    stuff like patterns, architecture, tests,… are helpers for communicating the purpose
    of the software. They’re not really relevant to the software itself as the computer
    would be happy with just a single file.<p>You have a software that’s needed to
    fulfill some needs, you have a team of people where each brings expertise to build
    it. Workflows are built so that everyone how to contribute, what they can depends
    on, and what others need. When there’s a failure, we add the missing information.
    When there’s need to do some changes, we inform everyone impacted.<p>Everything
    is information and communication related. Information about the system and communication
    between everyone that interacts with the latter.<p>So devs do not think their
    job is to produce code. It is to take requirements written in ambiguous natural
    language, sometimes incomplete and contradictory, and to design a solution that
    is formally written while taking care that all statements are coherent.<p>Making
    things coherent (aka correct) is what takes the majority of our time. The other
    is gathering requirements. The actual typing of code is pretty much instinctive,
    just like you don’t check the orthography of words like “concrete” or “guide”,
    and rely on the spellchecker for more difficult one.<p>The “orchestration porn”
    part is that there’s no mention anywhere on how you think correctness and be improved
    or even maintained as part of your tool."
