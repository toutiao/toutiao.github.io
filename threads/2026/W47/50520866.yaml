  author: sharkbot
  text: 'I’d like to analogize the situation with the Kessler syndrome: the increasing
    density of satellites in low Earth orbit increases the probability that a cascading
    failure occurs, which would deny us access to LEO for centuries. The inciting
    incident could be intentional or could be accidental, but the result is the same.<p>The
    analogous situation is brewing. The depth and complexity of our computational
    infrastructure is increasing, and the impact of an incident is less and less likely
    to be contained solely to the affected system. Eg, a router replacement goes awry,
    and the entirety of the world’s aviation industry is broken for weeks.<p>Intentionality
    isn’t necessary: this is a systemic problem.'
