  author: swatcoder
  text: In this example, it&#x27;s not an alignment thing.<p>It&#x27;s more that its
    just reguritating the lazy, shallow garbage what would fare well in SEO or would
    be the most common reply in most online forums before. As digital signals to training
    and among inexpert RLHF reviewers, it has all the marks of being a good answer
    to the question as asked.<p>So of course models happily repeat it, even though
    it&#x27;s largely naive and wrong-headed and useless.<p>It&#x27;s the kind of
    question, with vague-but-typical phrasing, that most people don&#x27;t have good
    insight into but that many people feel like can speak to (bullshit to) anyway
    by transposing some trendy generalized answer.<p>In the real world, you ask 10
    people, get 6 of these shitty answers, and then 1 person who actually knows what
    they&#x27;re talking about chimes in and you go &quot;oh, yeah, that&#x27;s what
    I was looking for, thanks!&quot;<p>Because of how they work, LLM&#x27;s, even
    with RLHF, have a <i>very</i> strong bias towards giving one of those 6 shitty
    answers when presented with this kind of question.<p>The seeming fix right now
    is to train them to be more inquisitive, to prompt users to think about and provide
    more refining context after that first prompt reply. You see this espcially in
    Google&#x27;s AI Search responses already, where they try to present 2-3 refining
    questions in case the first bullshit answer didn&#x27;t hit the mark.
