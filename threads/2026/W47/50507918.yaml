  author: windyVector
  text: This is first time i&#x27;ve really felt like commenting here, but super interesting
    article.<p>Having tested both restricted and unrestricted models, certain queries
    which I know to have a solution can feel &#x27;gated&#x27; by the restricted models.
    Rather than simply saying &quot;I can&#x27;t answer that&quot;, they choose to
    answer a similar, but slightly different question, very much along the lines of
    what the article discusses. To me, this is a fault of RL avoiding these &quot;I
    can&#x27;t do that&quot; type responses while still remaining aligned.<p>When
    you do push them on the solution, the models will often start to get more defensive,
    but reveal their awareness of it (along the lines of &quot;Yes I know, but I can&#x27;t
    tell you&#x2F;do it&quot;). It is very interesting to imagine the amount of solutions
    a model might have to a given query, that end up (intentionally or unintentionally)
    gated because of this process.<p>I&#x27;d be interested to see if this behaviour
    of &quot;almost-answering&quot; the question is just emergent from these alignment
    policies.<p>try an unrestricted model afterwards, id also be interested to see
    how that changes creativity.
