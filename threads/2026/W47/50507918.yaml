  author: mhink
  text: One thing I&#x27;ve noticed is that even with fairly vague questions, the
    various models often tend to jump towards <i>producing an answer first</i> rather
    than trying to gain clarity about the specific situation. Claude will often produce
    a &quot;pat&quot; answer and only then ask for clarifications (or more likely,
    ask what else you&#x27;d like it to generate).<p>As you mentioned, the prompt
    itself is so vague that a knowledgeable human responder would likely ask a lot
    of questions to feel out the actual situation before making any actual recommendations
    or coming up with a plan. (But then, I also suppose it&#x27;s likely a knowledgeable
    human responder might just point out that the question is so vague that they can&#x27;t
    give good advice.)
