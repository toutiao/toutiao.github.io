  author: evolarjun
  text: Like many of the commenters it appears, my reaction to the incorrect solution
    to the problem was basically &quot;duh, that&#x27;s what they do&quot;. However,
    in reality I wouldn&#x27;t necessarily have realized that until I read further
    and new more about what the prompt was trying to do.<p>However, I think this is
    a reasonable explanation of a pattern I hadn&#x27;t really articulated, but that
    I&#x27;ve seen in my work as a biologist. I think most of us have learned to prompt
    around the inappropriate or generic answers to get an answer we&#x27;re  looking
    for, but you do have to know to do that. And sometimes I just give up because
    the LLM fails to listen and I get frustrated enough to just do things myself (though
    less so with the latest round of flagship models).<p>The issue the author describes
    is maybe not unexpected for people who work with LLMs in their field. But the
    issue is worth keeping in mind when prompting for something in a domain you&#x27;re
    not familiar with, and it&#x27;s not necessarily appreciated by people who are
    only casual users. Maybe there are solutions, but real humans don&#x27;t understand
    a question and answer a different one all the time, so I&#x27;m hopeful there&#x27;s
    a solution.
