  author: mike_hearn
  text: Permissions on macOS work better than any other desktop OS by miles, it&#x27;s
    not even close. But the GIMP is not a native Mac app and probably doesn&#x27;t
    do things the way it needs to for proper integration. Use Pixelmator or some other
    Mac graphics app and things work fine.<p>Apps ask you to manage the system settings
    dialog only when they&#x27;re requesting a very high level of system access and
    ship outside the app store. That describes a lot of apps that developers like
    to use (custom window managers etc), but not so many apps normal users will encounter.<p>When
    apps do uncover use cases that the permissions system isn&#x27;t a good fit for,
    Apple are pretty responsive about adapting the system in backwards compatible
    ways. For example, AI apps wanting full disk access because they want to read
    the internal files of a messaging app - not ideal, so Apple have introduced a
    way to grant access to only specific apps from a modal popup triggered when the
    app tries to do it, not from the system settings app.<p>The way this is <i>meant</i>
    to work, by the way, is that the messaging app cooperates with the apps that want
    access to messages by exposing an app over XPC. AI apps are going offroad because
    AI companies in such a mad scramble to ship features and because of the complicated
    web of corporate relationships - does Meta really want to grant OpenAI access
    to people&#x27;s WhatsApp messages on macOS or would they prefer to push users
    towards Meta Muse, etc. So AI apps bypass the genteel cooperative way and try
    to suck data out of the app&#x27;s internal files directly. Apple is standing
    in the middle trying to mediate this stuff in a reasonable way, and I think they&#x27;re
    doing a fine job.
  score: 0
