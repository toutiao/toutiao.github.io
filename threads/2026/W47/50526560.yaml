    put the last one somewhere else, except it only lets me pick the directory for
    where something called `Dropbox` is rather than rename it, and since I kind of
    hate having capital letter named directories I ended up deciding years ago that
    I&#x27;d just keep it next to Downloads and it would be less annoying).<p>On the
    MacBook my work gave me, there are a ton of extra directories that I would vastly
    prefer to relocate somewhere else in a combined way (Pictures, Videos, Documents,
    etc.) that I&#x27;d have to separately configure a bunch of things to not dump
    stuff in, which I could do, but then I&#x27;d <i>also</i> have to fix all of the
    half dozen permissions on every app \n require access to any them. This is all
    doable (I assume? maybe there&#x27;s truly no way to stop stuff from going into
    those directories by default, but I&#x27;m assuming that there&#x27;s probably
    some esoteric setting somewhere), but my point is that the way they&#x27;ve designed
    it not only adds a bunch of initial prompts for when you start using stuff on
    a system across directories that realistically do not have different security
    concerns, but they haven&#x27;t bothered to make it any easier if you ever want
    to change something in the future. I understand that this is a niche concern for
    power users, but it&#x27;s absolutely wild to me how MacOS continues to find new
    ways to get in the way of me compared to Linux as the years go on."
