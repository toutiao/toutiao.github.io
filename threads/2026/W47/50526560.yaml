  author: gbdubs
  text: |-
    This is a very poorly conceived API. If developers&#x27; use cases don&#x27;t fit cleanly into Apple&#x27;s (narrow) idea about how a hypothetical app should work, developers will continue to feel like they need to request these expansive permissions. A good filesystem permission API could include any of these which would make users WAY safer and enable developers to request far smaller scopes:<p>- Allow the developer to specify the common location(s) that they need access to. Rather than having to have the user select the folder they want to grant access to, have the developer say &quot;this app uses data in these 5 folders, do you want to grant that access&quot; - so much clearer, and useful in cases where an app has to integrate with other apps through the filesystem.
    - Readonly access. Allow an app to read your files but prevent writes or deletes.
    - Time limited access. Allow some kind of access and allow the user to auto-expire it rather than having to remember it exists.
    - Allow for negative access (i.e. allow labels or tags on directories to mark them as sensitive and prevent access by default - browsers could do this for their cookie stores, `~&#x2F;.ssh` could ship with it as a default, etc.)<p>Apple could have used this opportunity to think through the question of &quot;why do developers ask for filesystem access, and how can we allow legitimate usage through well scoped access controls&quot;, but instead they built a bad API that will (I would guess) not actually allow developers to be more judicious or achieve any of the user-safety benefits.<p>Apple needs to learn to talk to (and listen to) developers.
  score: 0
