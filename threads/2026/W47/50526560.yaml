  author: comex
  text: Apple tried the first thing first.  That was App Sandbox, and you can grant
    access to specific folders through the open dialog (or better yet, use the open&#x2F;save
    dialog to access individual files so that no broad permissions are needed at all).  But
    nobody adopted App Sandbox unless forced to.<p>Negative access is what came next,
    applied to all apps.  By default, an unsandboxed program can access everything
    except specific protected directories, and can request access to those directories
    too, e.g. Documents, Desktop, Photos, other apps&#x27; data.<p>Full Disk Access
    is the last resort that turns all of that off.  Or, well, was.<p>It&#x27;s also
    the only way to access Messages, which might be why certain AI apps request it.
