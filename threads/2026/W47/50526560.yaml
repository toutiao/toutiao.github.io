  author: simondotau
  text: Developers are important, but Apple understands that it must ultimately prioritise
    non-technical end users as their highest priority. Apple&#x27;s approach puts
    control in users&#x27; hands rather than allowing developers to define the scope
    of access. Moving from Full Disk Access to user-selected folders is a significant
