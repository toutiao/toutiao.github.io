  content: "# If an app asks for Full Disk Access or System & App Protection Override
    on your Mac\n\nStarting in macOS 27.3, when some apps ask for Full Disk Access
    or System & App Protection Override, you have the option to choose only specific
    protected folders or apps for the app to access. This puts you in control of what
    data is accessible to the app.\n\n## Why apps ask for these permissions\n\nApps
    that might ask for Full Disk Access or System & App Protection Override include
    backup apps, disk cleaners, file indexers, security apps, and others. While some
    of these apps operate best when granted broader access, others may ask for the
    same level of access even when they don't need it. It's important to understand
    the risks of granting&nbsp;broad access to any app, so you can&nbsp;make informed
    decisions about your own data and privacy.\n\nWhen you give an app Full Disk Access
    instead of choosing only specific protected folders for it to access, it can bypass
    system protections and access all of the files on your Mac, including your messages,
    emails, photos and videos, data from other user accounts, and more. It can read,
    change, delete, and export this data without asking.\n\nWhen you give an app System
    & App Protection Override, you can choose specific apps for it to control. If
    you allow it to bypass system protections instead, it can fully control your Mac
    and apps, which allows it to access all of your data. It can also see every window
    and app, including ones in the background, and capture every keystroke.\n\n##
    What you can do\n\nAn app might ask you to give it access to all of the files
    on your Mac, or to let it control your Mac. When you turn on access for the app
    in Privacy & Security settings, depending on the app, your Mac prompts you to:\n\n-
    Allow or not allow the app to have access. This option appears for some apps,
    such as backup apps that ask for Full Disk Access, and screen readers and voice
    control tools that ask for Accessibility.\n\n- Choose specific protected folders
    or apps for the app to access instead. This option appears for other apps that
    ask for Full Disk Access or System & App Protection Override. It allows the app
    to access only what you choose, while system protections stay in place for the
    rest of your data.\n\n## If your Mac prompts you to choose specific protected
    folders or apps\n\nTo keep more of your data protected, choose specific protected
    folders or apps for the app to access instead of bypassing system protections.\n\n
    ![Full Disk Access in System Settings while adding an app to the list. A dialog
    is shown with a button for giving the app access to a specific folder, and a button
    for granting the app access to all data on the disk.](https://cdsassets.apple.com/live/7WUAS350/images/macos/golden-gate/macos-27-golden-gate-privacy-and-security-full-disk-access-add-choose-protected-folder.png)\n###
    Choose specific protected folders or apps\n\nWhen your Mac prompts you, click
    Choose Folder or Choose Apps, then:\n\n- Check the app's setup instructions for
    information about which protected folders or apps it needs.\n\n- Choose only the
    protected folders or apps that it needs.\n\n- For System & App Protection Override,
    choose whether the app needs to ask for your permission before it controls each
    app. Use the menu next to each app to choose Ask First or At Any Time.\n\n- If
    you're not sure which protected folders or apps to choose, [contact the app developer](https://support.apple.com/en-us/102435).
    To stay protected, wait until you're sure which folders or apps that the app needs
    before giving access.\n\nYou can change which protected folders or apps that the
    app can access at any time.\n\n### If you're certain that an app needs Full Disk
    Access or System & App Protection Override\n\nBypassing system protections might
    expose your personal information to an app that doesn't behave as you expect.
    An app with Full Disk Access can read, change, delete, and export all of the files
    on your Mac, and an app with System & App Protection Override can fully control
    your Mac and apps.\n\nIf you're certain that the app is from a trustworthy source
    and needs this level of access, you can give it Full Disk Access or System & App
    Protection Override permissions by clicking Bypass System Protections:\n\n- Confirm
    each action that the app will be able to take: \n\n- If you're absolutely sure
    that you want to give the app Full Disk Access or System & App Protection Override,
    click Turn On Full Disk Access or Allow System & App Protection Override, then
    enter your password and click Modify Settings.\n\n## Change or remove an app's
    access\n\nYou can review app permissions in Privacy & Security settings, and change
    or remove them at any time.\n\n1. From the Apple menu, choose System Settings.\n\n2.
    Click Privacy & Security in the sidebar, then click Files & Folders, Full Disk
    Access, or System & App Protection Override.\n\n3. Change an app's access:\n\nIf
    you remove an app's access, the app might not work as expected.\n\nPublished Date:&nbsp;"
