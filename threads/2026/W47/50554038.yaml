  author: marcosdumay
  text: There&#x27;s no nastier implementation because the function isn&#x27;t there.<p>There&#x27;s
    nothing converting the case of a string in place. The iterator does not decide
    how many bytes the string has, it delivers one character at a time. It&#x27;s
    trivial to decide how many bytes a character has (it&#x27;s on the definition
    of your encoding), and it&#x27;s written down at the type definition.<p>Converting
    the case of an string in place is just a bad operation. It should not be done.
    So the Rust stdlib doesn&#x27;t do it. The idea that complexity has a fixed size
    is trivially wrong.
  score: 0
