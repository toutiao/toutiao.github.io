  author: pmontra
  text: Human writing systems themselves have that very same property. The stability
    of written language prevents them to adapt swiftly to changes to spoken language.<p>Knight
    &#x2F; night is an example for English. That k should be gone, right? Or all those
    silent -ment and e in French.<p>Enter the computer and I&#x27;m not surprised
    that German speakers end up mostly with SS because that&#x27;s what computers
    do when automatically upcasing words.<p>A lot of spelling changes are dictated
    by what&#x27;s available on keyboards. In Italian we accept E&#x27; as È because
    we don&#x27;t have that upper case character on our keyboard. Automatic uppercase
    on start of sentences fixed it where it&#x27;s available and mobile keywords show
    an È as an option of you long press a shifted e. But what if you are writing Italian
    in an English locale form field with a hardware keyboard (here with an OS with
    English locale) or you have to write È in the middle of a sentence or, go back
    30 or 40 years, you have to use a typing machine?<p>I&#x27;m am sure that every
    language that had to go through a phase of adapting to ASCII and to the limits
    on the layout of keyboards has similar stories to tell.
