  author: tialaramex
  text: "&gt; When the Rust end-user gets that nice Iterator, someone behind the scenes
    has to decode the string and decide how many bytes the new Iterator has.<p>The
    <i>Iterator</i> doesn&#x27;t have bytes in it, we&#x27;re not idiots, the Iterator
    is over Rust&#x27;s char type, a Unicode scalar value (a &quot;character&quot;
    if you don&#x27;t know the lingo)<p>What&#x27;s delivering value here is division
    of responsibility. Cutting a problem up into pieces each of which can be tackled
    by an expert. Uppercasing text, encoding characters as bytes, allocating memory,
    appending to a buffer, these are all distinct problems which a different expert
    can solve properly.<p>In that Ruby code you need to gather maybe a half dozen
    experts to agree how to write this function. Or, of course, one expert YOLOs the
    rest of it because every topic we don&#x27;t know much about is easy, right...<p>Rust
    does this division a <i>lot</i>. You as a programmer see String but when your
    String grows that&#x27;s not code in String where people who know about Unicode
    live, that&#x27;s RawVecInner&lt;A&gt; and that code doesn&#x27;t even know about
    characters or strings or any such thing, it just allocates enough space to store
    data."
