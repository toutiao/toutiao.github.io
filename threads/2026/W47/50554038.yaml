  author: tptacek
  text: There&#x27;s what I think is probably an awesome bug here.<p>Windows-1252
    encoding has a representation for lowercase German sharp &#x27;s&#x27; (ß), but
    not one for the uppercase. If you upcase a string containing a sharp &#x27;s&#x27;,
    it gets normalized to &quot;SS&quot;, which increases the length of the string
    by one character. The 1252 case conversion code doesn&#x27;t handle this; it looks
    like it checks for headroom in the buffer one character at a time. So if the last
    character of a string you upcase is ß, it looks like you get a one-byte overflow
    (of &#x27;S&#x27;).<p>If that&#x27;s really the bug (there&#x27;s a claimed RCE
    POC), the heap grooming for it must be really fussy! I couldn&#x27;t find any
    other character pairs that expand like this.<p>You can feed strings in 1252 to
    a Rails program through multipart POSTs, which get to pick their encodings.<p>The
    great thing about this bug, apart from how it illustrates how doomed we all are
    (if I&#x27;m right), is that it should by rights have the best vulnerability name
    of the year, because you get to work &#x27;ß&#x27; into it.
  score: 0
