    (Ada Logics) and Anthropic\n- GHSA-pvgc-g7gj-pv6h: Hiroya Fujinami and Hiroshi
    SHIBATA\n\n## History\n\n- Originally published at 2026-11-19 00:00:00 (UTC)\n\n###
