  text: |-
    This history of the 2000 ssh RCE is a very good reminder of what the pace of Internet security used to be like.

    The vulnerability was finally fixed in November 2000 with the release of OpenSSH 2.3.0.
    The first advisory was published four months later, on the 8th of February 2001 [#4][#5]. Most servers did not update OpenSSH and the Internet remained vulnerable for many months (and years).
