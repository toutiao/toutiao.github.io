    there are two problems here:<p>1) most garbage collectors are pretty lame and
    can&#x27;t even come close to the throughput&#x2F;efficiency of manually managed
    memory, and<p>2) the vast majority of software does not even come close to the
    frontier of what is possible with software, and therefore the thing that matters
    most is correctness.<p>Rust does a better job at correctness than most languages
    because the type system is so robust, and it does a better job at memory management
    than most languages because most languages do garbage collection so poorly.
