  author: tachim
  text: 'Tudor here, I work at Harmonic. Aristotle auto-formalizes your natural language
    specifications into theorems about the embedding of your program based on the
    formal semantics of the Rust mid-level IR. You can see the full docs here: <a
    href="https:&#x2F;&#x2F;aristotle.harmonic.fun&#x2F;docs&#x2F;software&#x2F;rust"
    rel="nofollow">https:&#x2F;&#x2F;aristotle.harmonic.fun&#x2F;docs&#x2F;software&#x2F;rust</a><p>For
    Verilog which is another language we support, for hardware, we compile the SVA
    assertions deterministically into Lean theorem statements about the compiled Lean
    embedding of the Verilog.'
