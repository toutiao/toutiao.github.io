  author: reenorap
  text: I was a huge NIN fan back in the day. I even had a DOS device driver that
    turned my “n” backwards like their logo. I know everything about the band that
    a fan from the 90s could know. The idea that Trent Reznor of the 90s would sell
    out and write Disney songs and then turn around and start singing his NIN songs
    at the same time would probably make the 90s version of him attempt suicide. At
    least whoever Trent Reznor was portraying to be in the 90s would have claimed
    that.<p>Like I said, if he has evolved, which all people are allowed to do, and
    he found God then great. But who he was in the 90s, the songs he wrote, the society
    he rejected and fought against versus who he is now are diametrically opposed.
    You can’t pick up your old songs and “evolve” them and pretend everything is okay.
    It’s a slap in the face to the fans who believed in his message of “Fuck this
    fake society”. If he left his songs in the past then I would be okay with it but
    to pick up his old songs and sing them nowadays makes me about as sad as I could
    ever be about a hero who may never have been who he claimed he was.
