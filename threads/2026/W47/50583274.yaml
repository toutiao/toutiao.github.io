  author: tjeerdnet
  text: Nice to see people talking about NIN here. For me it al started with Quake
    and the NIN logo on the ammo, but I did not have the original soundtrack of the
    game.<p>I really discovered their music later around 1999 I think. In my memory
    it started by finding something in music shared by people on Napster. Soon after
    that I was hooked and bought their early albums. As a teenager (19) I immediately
    found them unique in their style. Also the music video clips they made were pieces
    of art. I remember that I took some clips to school to play them on a computer
    when we had nothing better to do and my classmates were partially disgusted by
    the graphics of some of the videoclips. They thought that I was a bit insane.
    Turns out that it ended well and made good friends till  today. But not because
    or the videoclips ;)<p>Later albums have some songs that I like, but also lots
    of songs and albums that I don&#x27;t connect with.<p>The connection of ex guitarist
    Richard Patrick and his brother Robert Patrick as T-1000 in Terminator was always
    a cool fact for me. Also the fact that Trent liked to play Doom and was a big
    fan of it made me always think that he was also just an ordinary guy like we oldskool
    DOS-gamers were.
