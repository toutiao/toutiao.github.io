  author: leviathant
  text: Early shows were built around click tracks, often to help synchronize with
    lighting and video elements, but even as far back as 1999 the live band would
    make a point to play tracks like Starfuckers &#x27;live&#x27; - knowing it&#x27;s
    such a studio-heavy song, the point was to make a live version of it.<p>2005 saw
    them taking almost a garage-band approach to live playing. The Lights in the Sky
    tour in 2008 broke away further from synchronized video, instead using interactive
    LED screens (via Moment Factory), which further freed the band up to rotate their
    sets.<p>As a result, there&#x27;s actually a lot of live performance and improvisation,
    something you can verify across the nearly 2000 recordings at ninlive.com - 2017-2024
    tours in particular feature very dynamic setlists from night to night, and the
    Peel it Back shows famously open with Trent playing solo piano.
