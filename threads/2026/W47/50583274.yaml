  author: nylonstrung
  text: Yeah in some ways he&#x27;s a figure who in an alternative universe was destined
    to end up like Cobain or Layne Staley and probably would have been more celebrated
    than either had he died after Downward Spiral<p>I think he&#x27;s cooler for riding
    it out though, to me it doesn&#x27;t devalue any of his other work to see the
    Disney stuff for example. I like that someone whose art has always been rooted
    in transgression has been able to permeate the mainstream and win Oscars for it
    instead of just being relegated to 90s industrial fandom like Ministry for example<p>There&#x27;s
    a lot of things he&#x27;s done in his later career like open sourcing Ghosts,
    championing smaller acts like Saul Williams, giving The Slip and other music away
    for free and using Year Zero to push a politically critical ARG I think is creatively
    transgressive in the context of the industry without being self-destructive.<p>I
    just think there&#x27;s no universe where he could have stayed &quot;true&quot;
    to the original work without it feeling sad and weird for a 61 year old man or
    him just being a 27 club member who tragically passed too soon, a story which
    is common enough that it&#x27;s probably the least interesting or imaginative
    outcome<p>That said a lot of his newest work with Atticus is wack and I&#x27;d
    rather just hear more &quot;return to form&quot; content than ambient modular
    synth jams and jazz infused take on industrial rock for example
