  author: anarazel
  text: They&#x27;re durable but not transactional.<p>1) If you do BEGIN; SELECT nextval(&#x27;someseq&#x27;);
    ROLLBACK; the value from the rolled back transaction won&#x27;t be reused, despite
    the rollback.  That&#x27;s quite crucial for performance, as otherwise concurrent
    transactions would not be able to get a sequence value until the first transaction
    commits&#x2F;rolls back.<p>2) If you crash (PG or HW), some sequence values may
    never end up being used. For performance only every 32nd sequence advancement
    is WAL logged.
  score: 0
