  author: dbgobrrr
  text: Amazing release, really exciting features:<p>- REPACK CONCURRENTLY to reclaim
    disk space, which also affects performance.<p>- Logical replication of sequences
    - Fantastic addition. This is a missing piece in the major-version upgrade story
    which required extra scripting, and enable additional usecases.<p>- WAIT FOR LSN
    is a game-changer for read-replicas. For read-after-write, where the write goes
    to the master and the read hits a random replica. And also read-after-read, where
    each read may hit different replicas.<p>Add to that additional performance improvement
    and the plan advice extension, this makes 19 one of the most exciting releases
    of PostgreSQL.<p>Big big big kudos to the contributors, thank you!
  score: 0
