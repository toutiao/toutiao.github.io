  author: mb4nck
  text: First off, one does not need to upgrade to each major version, it is perfectly
    fine to jump over one or more major releases in one step.<p>Also, the definition
    of a major release in Postgres is no new features, and, by extension, no system
    catalog changes. When the Postgres system catalog changes, you need to make a
    major version upgrade (this is e.g. the case if you want to upgrade from Postgres
    19 beta3 to GA).<p>A lot of Postgres&#x27; reputation is on their solid minor
    releases, and they will not compromise that.
  score: 0
