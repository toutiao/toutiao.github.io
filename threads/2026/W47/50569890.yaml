  content: "## Quick Links\n\n- [Documentation](/docs/)\n- [Manuals](/docs/)\n  -
    [Archive](/docs/manuals/archive/)\n- [Release Notes](/docs/release/)\n- [Books](/docs/books/)\n-
    [Tutorials & Other Resources](/docs/online-resources/)\n- [FAQ](/docs/faq/)\n-
    [Wiki](https://wiki.postgresql.org)\n\n \n\n| E.1.&nbsp;Release 19 |\n| --- |\n|
    [Prev](release.html \"Appendix E. Release Notes\")&nbsp; | [Up](release.html \"Appendix E. Release
    Notes\") | Appendix&nbsp;E.&nbsp;Release Notes | [Home](index.html \"PostgreSQL
    19.0 Documentation\") | &nbsp;[Next](release-prior.html \"E.2. Prior Releases\")
    |\n\n* * *\n\n## E.1.&nbsp;Release 19 [#](#RELEASE-19)\n\n**Release date:&nbsp;**
    2026-11-19\n\n### E.1.1.&nbsp;Overview [#](#RELEASE-19-HIGHLIGHTS)\n\nPostgreSQL
    19 contains many new features and enhancements, including:\n\n- New [REPACK](sql-repack.html
    \"REPACK\") command that reclaims disk space and reorganizes table contents, which
    can improve query performance. `REPACK (CONCURRENTLY)` allows repacking without
    blocking reads and writes to the table.\n\n- [pg\\_plan\\_advice](pgplanadvice.html
    \"F.30. pg\\_plan\\_advice — help the planner get the right plan\") extension
    for controlling query planner decisions and [pg\\_stash\\_advice](pgstashadvice.html
    \"F.33. pg\\_stash\\_advice — store and automatically apply plan advice\") extension
    that applies plan advice automatically based on the query.\n\n- Better performance
    in many areas, including automatic scaling of the number of I/O worker processes,
    quicker foreign-key checks, and further planning and execution optimizations.\n\n-
    Logical replication can now be enabled without a server restart when [wal\\_level](runtime-config-wal.html#GUC-WAL-LEVEL)
    is set to `replica`.\n\n- Logical replication of [sequence values](logical-replication-sequences.html
    \"29.7. Replicating Sequences\").\n\n- Support for “read-your-writes” consistency
    on standbys via the new [WAIT](sql-wait.html \"WAIT\") command.\n\n- [Parallel
    autovacuum of table indexes](runtime-config-vacuum.html#GUC-AUTOVACUUM-MAX-PARALLEL-WORKERS)
    and [autovacuum prioritization](routine-vacuuming.html#AUTOVACUUM-PRIORITY \"24.1.6.1. Autovacuum
    Prioritization\") through a new scoring system.\n\nThe above items and other new
    features of PostgreSQL 19 are explained in more detail in the sections below.\n\n###
    E.1.2.&nbsp;Migration to Version 19 [#](#RELEASE-19-MIGRATION)\n\nA dump/restore
    using [pg\\_dumpall](app-pg-dumpall.html \"pg\\_dumpall\") or use of [pg\\_upgrade](pgupgrade.html
    \"pg\\_upgrade\") or logical replication is required for those wishing to migrate
    data from any previous release. See [Section&nbsp;18.6](upgrading.html \"18.6. Upgrading
    a PostgreSQL Cluster\") for general information on migrating to new major releases.\n\nVersion
    19 contains a number of changes that may affect compatibility with previous releases.
    Observe the following incompatibilities:\n\n- Add server variable [`password_expiration_warning_threshold`](runtime-config-connection.html#GUC-PASSWORD-EXPIRATION-WARNING-THRESHOLD)
    to warn about password expiration (Gilles Darold, Nathan Bossart) [§](https://postgr.es/c/1d92e0c2c)\n\n-
    Issue a warning after successful MD5 password authentication (Nathan Bossart)
    [§](https://postgr.es/c/bc60ee860)\n\n- Remove support (Thomas Munro) [§](https://postgr.es/c/a1643d40b)\n\n-
    Force [`standard_conforming_strings`](runtime-config-compatible.html#GUC-STANDARD-CONFORMING-STRINGS)
    to always be `on` in the database server (Tom Lane) [§](https://postgr.es/c/457620845)\n\n-
    Disallow carriage returns and line feeds in database, role, and tablespace names
    (Mahendra Singh Thalor) [§](https://postgr.es/c/b380a56a3)\n\n- Change the default
    index opclasses for [`inet`](datatype-net-types.html \"8.9. Network Address Types\")
    and [`cidr`](datatype-net-types.html \"8.9. Network Address Types\") data types
    from [btree\\_gist](btree-gist.html \"F.8. btree\\_gist — GiST operator classes
    with B-tree behavior\") to [GiST](gist.html \"65.2. GiST Indexes\") (Tom Lane)
    [§](https://postgr.es/c/b3b0b4571) [§](https://postgr.es/c/b352d3d80)\n\n- Disallow
    system columns from being used in [`COPY FROM ... WHERE`](sql-copy.html \"COPY\")
    (Tom Lane) [§](https://postgr.es/c/21c69dc73)\n\n- Change a [`json_array()`](functions-json.html
    \"9.17. JSON Functions and Operators\") call which returns no rows to return an
    empty array (Richard Guo) [§](https://postgr.es/c/8d829f5a0)\n\n- Cause transactions
    to pass their `READ ONLY` and `DEFERRABLE` status to [postgres\\_fdw](postgres-fdw.html
    \"F.40. postgres\\_fdw — access data stored in external PostgreSQL servers\")
    sessions (Etsuro Fujita) [§](https://postgr.es/c/de28140de)\n\n- Change default
    of [`max_locks_per_transaction`](runtime-config-locks.html#GUC-MAX-LOCKS-PER-TRANSACTION)
    from 64 to 128 (Heikki Linnakangas) [§](https://postgr.es/c/79534f906)\n\n- Remove
    server variable `io_workers` (Thomas Munro) [§](https://postgr.es/c/d1c01b79d)\n\n-
    Change to be disabled by default (Jelte Fennema-Nio) [§](https://postgr.es/c/7f8c88c2b)\n\n-
    Change [parallel vacuum](routine-vacuuming.html#PARALLEL-VACUUM \"24.1.7. Parallel
    Vacuum\") leaders and workers to share the cost-based vacuum delay limit (Bharath
    Rupireddy) [§](https://postgr.es/c/8628df889)\n\n- Rename column `sync_error_count`
    to `sync_table_error_count` in system view [`pg_stat_subscription_stats`](monitoring-stats.html#PG-STAT-SUBSCRIPTION-STATS
    \"Table 27.20. pg\\_stat\\_subscription\\_stats View\") (Vignesh C) [§](https://postgr.es/c/3edaf29fa)\n\n-
    Rename wait event _type_ `BUFFERPIN` to `BUFFER` and rename wait event `BufferPin`
    to `BufferCleanup` (Andres Freund) [§](https://postgr.es/c/6c5c393b7)\n\n- Remove
    wait event `BufferContent` and add more precise wait events `BufferShared`, `BufferShareExclusive`,
    and `BufferExclusive` (Andres Freund) [§](https://postgr.es/c/fcb9c977a)\n\n-
    Change index access method handlers to use a static [`IndexAmRoutines`](indexam.html
    \"Chapter 63. Index Access Method Interface Definition\") structure, rather than
    dynamically allocated ones (Matthias van de Meent) [§](https://postgr.es/c/bc6374cd7)\n\n-
    Remove optimizer hook get\\_relation\\_info\\_hook and add better-placed hook
    build\\_simple\\_rel\\_hook (Robert Haas) [§](https://postgr.es/c/91f33a2ae)\n\n-
    Change [psql](app-psql.html \"psql\")'s `\\crosstabview` command to honor the
    `\\pset null` setting (Chao Li) [§](https://postgr.es/c/4df5fe383)\n\n- Change
    [full text search](textsearch.html \"Chapter 12. Full Text Search\") and [pg\\_trgm](pgtrgm.html
    \"F.37. pg\\_trgm — support for similarity of text using trigram matching\") to
    use the database's locale provider for character classification when parsing text
    (Jeff Davis) [§](https://postgr.es/c/e113f9c102b)\n\n- Change how [fuzzystrmatch](fuzzystrmatch.html
    \"F.16. fuzzystrmatch — determine string similarities and distance\") functions
    handle non- characters (Peter Eisentraut, Jeff Davis) [§](https://postgr.es/c/e39ece034)
    [§](https://postgr.es/c/b96a9fd76f3)\n\n- Remove `MULE_INTERNAL` encoding (Thomas
    Munro) [§](https://postgr.es/c/77645d44e)\n\n### E.1.3.&nbsp;Changes [#](#RELEASE-19-CHANGES)\n\nBelow
    you will find a detailed account of the changes between PostgreSQL 19 and the
    previous major release.\n\n#### E.1.3.1.&nbsp;Server [#](#RELEASE-19-SERVER)\n\n#####
    E.1.3.1.1.&nbsp;Optimizer [#](#RELEASE-19-OPTIMIZER)\n\n- Allow `NOT IN` clauses
    to be converted to more efficient `ANTI JOIN`s when NULLs are not present (Richard
    Guo) [§](https://postgr.es/c/383eb21eb)\n\n- Allow more `LEFT JOIN`s to be converted
    to `ANTI JOIN`s (Tender Wang, Richard Guo) [§](https://postgr.es/c/cf74558fe)\n\n-
    Allow use of Memoize for `ANTI JOIN`s with unique inner sides (Richard Guo) [§](https://postgr.es/c/0da29e4cb)\n\n-
    Allow some aggregate processing to be performed before joins (Richard Guo, Antonin
    Houska) [§](https://postgr.es/c/8e1185910) [§](https://postgr.es/c/bd94845e8)
    [§](https://postgr.es/c/3a08a2a8b)\n\n- Improve hash join's handling of tuples
    with `NULL` join keys (Tom Lane) [§](https://postgr.es/c/1811f1af9)\n\n- Improve
    the planning of semijoins (Richard Guo) [§](https://postgr.es/c/24225ad9a)\n\n-
    Allow Append and MergeAppend to"
