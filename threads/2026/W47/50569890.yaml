  author: lfittl
  text: Personally I would say, for critical production systems, its still good to
    wait for the .1 release.<p>Part of why delaying is helpful is that more people
    will actually install the release than they do during the beta&#x2F;RC cycle,
    and (in my read) most of the delay of the release was not necessarily because
    of significant bugfixing of features that remained in 19 (though e.g. REPACK certainly
    had its fair share of fixes), but rather the Postgres committers being overly
    busy with some of the security fixes that just went into 18.7 and the other minors,
    combined with some late removals of features that warranted an extra beta and
    RC release.
