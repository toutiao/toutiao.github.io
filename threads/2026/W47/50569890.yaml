- id: '50581463'
  parent_id: '50572485'
  author: mb4nck
  text: For performance reasons, sequences have always been non-transactional in Postgres.
    This implies that they are not in the transaction log which is being replicated
    to standbys.<p>As I understand it, the new feature is not a continuous replication
    (for the above reason), but rather a one-off synchronization of the current sequence
    values of a leader to its followers, you&#x27;d need to run it again later for
    additional syncs.
