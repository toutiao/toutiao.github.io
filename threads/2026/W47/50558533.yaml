  author: decentralisedog
  text: Hey, eng lead for integrations at Element. Link previews in Element specifically
    is something we&#x27;ve specifically spent more time on this year, because up
    until recently it reeeeeeally sucked. There are literally 10s of changes made,
    so suggest having a look through our <a href="https:&#x2F;&#x2F;github.com&#x2F;element-hq&#x2F;element-web&#x2F;blob&#x2F;master&#x2F;CHANGELOG.md"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;element-hq&#x2F;element-web&#x2F;blob&#x2F;master&#x2F;CHANGE...</a>.<p>Off
    the top of my head we&#x27;ve:<p>- Changed the settings so you can now opt in
    to URL previews both for unencrypted and optionally encrypted rooms (so if you
    don&#x27;t mind the exposure over usability, that&#x27;s an option for you)<p>-
    We support bundled previews where the sender can send through the link preview
    via the message, avoiding recipients having to leak any information (if you trust
    the sender over your homeserver). This has just landed in the spec and will be
    part of the stable app shortly.<p>- We&#x27;ve added previews atop the composer
    before sending so you can check what is going to be sent, and choose to remove
    obnoxious previews.<p>- Numerous rounds of redesign on the design of previews
    themselves to be less ugly.<p>- The spec now allows you to send messages that
    explicitly state not to preview, so bots are  less noisy.
