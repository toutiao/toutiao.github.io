  author: everforward
  text: I don’t believe there’s a central coordinator (it wouldn’t be distributed
    then).<p>I think you’re missing that rooms are attached to servers, and you can
    join rooms that aren’t on your server.<p>If I go join a room with 50k people on
    another server, those 50k people need to pull an online status from my server
    and my server needs to pull all of theirs.<p>Multiply that by all the rooms 50k
    people have joined and you get a _lot_ of messages bouncing around.<p>It’s sort
    of hard to optimize without either a central and implicitly trusted cache, or
    giving up on trust entirely. Central cache is sort of obvious. You could go peer
    to peer but then you have to deal with “what if somebody modified their server
    to issue forged updates”. You could maybe sign them but I’m not sure how anyone
    would validate that without getting a pubkey from your server and now we’re back
    to scaling problems and have a new “storing a million pubkeys” storage issue.
