  author: jillesvangurp
  text: We tried it out for a few weeks earlier this year with a small team. It&#x27;s
    alright but there are some annoying defaults (no link previews by default being
    one of the more annoying ones). You have to opt in to that on every channel for
    every user. I get why they did that but basically usability and UX is thrown under
    the bus here because of some hypothetical privacy issues.<p>That&#x27;s nice if
    you are genuinely paranoid on this front (rightfully or otherwise) but really
    sucks if you want people to share links with each other (one of the big use cases
    we seem to have for using tools like this).<p>Related to that, a side effect of
    all the e2e encryption is that it&#x27;s really hard to give people or agents
    access to the full history of a channel. It&#x27;s not impossible but it involves
    jumping through some hoops. And of course a primary reason for us switching away
    from Slack was using AI agents in our chats more and experimenting with running
    some of our own bots and something that is sometimes referred to as a company
    brain.<p>Instead of fighting the tool we switched the tool. We picked Zulip around
    the same time the founders of that project were hired by Anthropic. For the migration,
    I gave AI access to my matrix keys and it moved over most of our channels to Zulip.
    Since Zulip has topics, I also made it group messages by topic.<p>I like Zulip
    so far. They could use a UX refresh in the client. It looks a bit dated and meh.
    But otherwise it does the job. With both Zulip and Matrix, I orchestrated the
    rollout and hosting with AI, including giving admin privileges to manage the whole
    thing. Works surprisingly well with both. But jobs like add this person to that
    channel and given them such and such rights are working flawlessly. We had some
    openclaw thing running for a while but we gave up on that (too much issues with
    that). But we have a lot of chatgpt scheduled automations and some scripts and
    skills that allow it to search through and post in Zulip channels. Very useful.<p>If
    you don&#x27;t want to self host, Zulip has a generous freemium tier as well in
    their managed hosting. Haven&#x27;t tried it but looks like a decent starting
    point if you want to try it out. You can migrate to self hosted later, if you
    want.
  score: 0
