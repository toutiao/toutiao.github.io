  author: kqr
  text: As someone else pointed out, <i>training</i> something like this requires
    much more hardware than running it.<p>It&#x27;s similar with other forms of machine
    learning, too. A logistic regression can make calibrated decisions in complex
    situations with nearly no compute at all, but training it on lots of data to give
    it good weights is more expensive. And even if we could submit a training batch
    job on 1990s hardware and wait a few years for it to complete, there&#x27;s a
    level of interactivity required at the start to explore one&#x27;s way to the
    right parameters and tokenisation etc. that probably wouldn&#x27;t have been economically
    feasible at the time.<p>In a wider sense, a general purpose computer is a general
    purpose computer. Hypothetically, we &quot;could have&quot; run transformers in
    the 1940s on vacuum tubes. It just would have (a) required much space, (b) produced
    much heat, and (c) required tube replacements all the time. We &quot;could have&quot;
    run transformers on human computers in the late 1800s or early 1900s – all the
    maths was there, I think? – but it would have been even slower!
