  author: piltdownman
  text: I mean take a step back and look at in context of the early 90s and it was
    fairly evident that we could. But it was just as evident that it was a research
    and sentiment dead-end.<p>1993 was the AI winter. Not dissimilar to the naive
    forecast and scope of the famous 1966 Summer Vision Project in MITs fledgling
    AI department, they had massively underestimated the complexity of the problem
    domain. Funding had dried up, and the LISP machine industry was circling the drain.<p>The
    jump from human mandated logic and decision trees was far in the future. The  original
    Neural Networks (Elman &amp; Jordan Networks -&gt; RNN) were crippled by context
    limitations due to stepping through the data in a linear fashion and hitting the
    vanishing gradient brickwall almost immediately.<p>An agentic AI could trivially
    can build and run a native Lisp interpreter or bytecode VM on both SNES and Sega
    Genesis hardware, and a human team could feasibly port an implementation over.
    The Genesis ran on a 68k with support for 24-bit address space and 32-bit registers,
    so it was easy to compile 68k C&#x2F;Assembly to reside within 64kb of RAM.<p>But
    it&#x27;s not &#x27;real&#x27; AI in the sense of Transformer or precursor Architecture.
    Without an FPU you&#x27;ve no avenue to do parallel matrix multiplication in any
    sort of reasonable cycle time, even if you managed to somehow deploy a 500mb Model
    into a custom cartridge and optimised the I&#x2F;O and swap to make it mechanically
    feasible. So you&#x27;re talking hours per token.<p>So the results were incredibly
    slow, erratic, with a tiny context window it still couldn&#x27;t retain context
    from, and all the use-cases for console gaming or add-ons like Sewing Machines
    were handled and implemented in a much saner and deterministic manner via State
    Machines.<p>So in short, we could have done so. Even limited to the knowledge
    of yesteryear. But why on earth would you have even considered it without the
    foresight of the contemporary industry outcomes? Even with the hindsight it&#x27;s
    simply a novelty... for now anyway.
