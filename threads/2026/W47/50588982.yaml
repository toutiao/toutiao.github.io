  author: lazide
  text: Outdoor and been around awhile? At least. On average? At least.<p>That amount
    is about 1&#x2F;5th of the volume of a 20 ft shipping container.<p>Easy for even
    a moderately busy indoor range to accumulate that, but they usually clean them
    more often.<p>I used to be a member of an outdoor range, and we had to pick vendors
    to do the mining. I forget the exact number, but 1k+ tons every 5 years or so,
    give or take. Especially the trap fields.<p>Roughly 1oz every shot adds up quick
    when it’s a busy range. Roughly a lb per person per round.<p>It’s quite dense
    and usually chemically non-reactive, so it doesn’t take up much space and is easy
    to ignore.<p>That and selling range brass for recycling made a big dent in the
    costs of running the place.<p>Zero measurable runoff or ground infiltration, too.<p>This
    was in CA Bay Area, so watched like a hawk by the green types.<p>We followed [<a
    href="https:&#x2F;&#x2F;www.epa.gov&#x2F;lead&#x2F;best-management-practices-lead-outdoor-shooting-ranges"
    rel="nofollow">https:&#x2F;&#x2F;www.epa.gov&#x2F;lead&#x2F;best-management-practices-lead-outd...</a>]
    at the time.<p>At least according to this hit piece, looks like an estimated 205
    million lbs&#x2F;year for shooting ranges in the US.<p>[<a href="https:&#x2F;&#x2F;static.ewg.org&#x2F;reports&#x2F;2001&#x2F;LeadPollutionAtOutdoorFiringRanges.pdf"
    rel="nofollow">https:&#x2F;&#x2F;static.ewg.org&#x2F;reports&#x2F;2001&#x2F;LeadPollutionAtOutdoorFi...</a>]<p>Based
    on that chart, it’s actually crazy how much lead the electrical industry releases.<p>Shooting
    is pretty obvious. But also the form of lead contamination from (outdoor) shooting
    is usually quite safe with only minimal care.<p>Indoors requires more care, due
    to lack of ventilation and more concentration in the air, but are also more heavily
    regulated because of it. Aerosolsized mercury and lead (from mercury fulminate,
    lead azide, or lead styphnate) primers ain’t great when concentrated.<p>It drops
    out quickly though, and the amounts are trivial if you aren’t literally breathing
    them right at the point of emission.<p>Lead from shooting is no PFAS. Leaded gas
    is terrible though.<p>(And yes, my handle is short for lead azide)
