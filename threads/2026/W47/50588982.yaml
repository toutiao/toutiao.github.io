  author: gpm
  text: The drums are in bunkers, you pump the concrete on top of the bunkers, not
    directly on top of the drums. You do it in stages waiting for the lower layers
    to cure so as to be able to build up a bigger mound (and you do the engineering
    work to figure out how big a mound you can make).<p>Boom pumps can pump concrete
    from ~80m away. The diesel engine is not loud and full of vibrations at that distance.
    If we needed to we could for a tiny fraction of the price of the healthcare and
    land damage this is going to do convert that equipment to run on electric motors
    instead of diesel.<p>We have extensive robotics at this point that can operate
    any equipment humans can at a distance. It is expensive. It does not require putting
    people at more risk.<p>And ultimately my point isn&#x27;t &quot;this is the best
    solution&quot; - it&#x27;s that what the army is doing (approximately nothing)
    is clearly not.
