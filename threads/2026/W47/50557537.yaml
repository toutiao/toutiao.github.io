  author: otoolep
  text: 'One detail: if you batch up your writes in the client, and send that batch
    through a Raft-based data plane system, you can get high throughput. But then
    you are paying with latency, as the clients have to wait until they have a batch
    worth of data before making the write request to the Raft-based system. rqlite
    calls this approach Bulk Requests[1].<p>[1] <a href="https:&#x2F;&#x2F;rqlite.io&#x2F;docs&#x2F;api&#x2F;bulk-api&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;rqlite.io&#x2F;docs&#x2F;api&#x2F;bulk-api&#x2F;</a>'
