  author: mightyham
  text: At the end of the day durable transaction commit in any OLTP database will
    always be slow because fsync is an expensive operation (~1000 IOPS on a decent
    SSD), so as you mentioned batching is the only way to make significant increases
    to throughput. That said, based on assorted benchmarks I&#x27;ve seen online,
    sqlite doesn&#x27;t even get close to max fsync IOPS because it has a ton of overhead.
    Other embedded systems like rocksdb or lmdb are going to give better performance.
  score: 0
