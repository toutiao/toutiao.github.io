  author: otoolep
  text: (Hi Phil!)<p>Correct, I read the post. Agreed, rqlite is not a great fit for
    high-throughput durable writes since all writes go through the Raft Leader. This
    is not specific to rqlite -- all systems which put Raft in the data plane[1] have
    the same challenge.<p>rqlite does offer a Queued Writes mode[2], which allows
    you to trade durability for much greater write throughput. The post mentions something
    similar -- async_write -- but their post claims they also make the data queryable
    before it is durable, unlike rqlite.<p>[1] <a href="https:&#x2F;&#x2F;youtu.be&#x2F;8XbxQ1Epi5w?t=2306"
    rel="nofollow">https:&#x2F;&#x2F;youtu.be&#x2F;8XbxQ1Epi5w?t=2306</a><p>[2] <a
