  text: I&#x27;m assuming failure in the entire stack. Even OpenSSH (it&#x27;s happened
    before).  One of the things we did was to segment or remove all personal information
    from the infrastructure - user tables are on a separate server; that server watches
    for more read requests than normal, and orders are written only to a separate
    journal. Basically... unless they get persistent, unnoticed root access, then
    we&#x27;re ok.<p>They&#x27;d need a lot of luck to notice that the first packet
    sent to their CNC will power down the entire VM.  Heck, I&#x27;m assuming the
    Proxmox host gets hacked - same thing. One weird packet and the power is cut.
    (digital loggers web power switch pro)
