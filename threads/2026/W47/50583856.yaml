  author: TeMPOraL
  text: "&gt; <i>Those systems weren&#x27;t secure yesterday either. AI just lowered
    the cost to track down the problems which have been hanging around this entire
    time.</i><p>I.e. they were secure.<p>A major problem with &quot;cyber security&quot;
    field is that, unlike in every other field dealing with security and safety, many
    of the practitioners in digital realm operate in abstract world of mathematics,
    and fail to grasp the fundamentals of reality - such as, that <i>there is no perfect
    security</i>.<p>In real life, security is denominated in dollars - securing costs
    money, especially when it degrades the value of the thing it secures (reduction
    in functionality or process efficiency); something is secure if it&#x27;s more
    expensive to attack than the value the attackers can reasonably gain from it,
    and securing doesn&#x27;t make sense past that point (or to the point the thing
    being secured stops providing net value).<p>So yes, it&#x27;s very much correct
    to say that due to costs of attacks going down, a previously secure system is
    insecure now."
