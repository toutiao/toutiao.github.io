  author: bordercontrol
  text: 'I have been working on web applications for 15+ years and work in IT security.
    I am also a long-term user of 1984. I host my domains there and promote their
    service.<p>What most likely happened here is that they didn&#x27;t have their
    software up to date. I highly doubt there was an undisclosed 0-click RCE involved
    in any of this. I have recently seen quite a few services I personally used that
    ran outdated versions of popular software and were vulnerable to some publicly
    disclosed RCE. I immediately notice these things, as I am auditing these types
    of services all the time. There is currently at least one major company in Switzerland
    that takes weeks to update their front end. They are vulnerable to RCEs all the
    time. This is nothing special currently.<p>Also, the talk of massive costs makes
    no sense. It&#x27;s something they have not seen in Iceland, maybe, but it&#x27;s
    normal, and the costs are extremely low, not millions. Probably just someone with
    a single Chinese AI subscription. Seeing complex attacks carried out extremely
    fast or with a huge number of requests doesn&#x27;t indicate high costs by any
    means.<p>I have personally also recently developed such an exploit in this challenge
    (and won): [<a href="https:&#x2F;&#x2F;brotli2bitcoin.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;brotli2bitcoin.com&#x2F;</a>](<a
    href="https:&#x2F;&#x2F;brotli2bitcoin.com&#x2F;" rel="nofollow">https:&#x2F;&#x2F;brotli2bitcoin.com&#x2F;</a>).
    It did take expertise to set up the agents (basically letting them do the exact
    same thing I would have done, using the same approach), but ultimately, it took
    37 minutes and, I think, would have cost me around 11 USD in tokens if billed
    at the API rate. I could have sped it up to maybe 5–10 minutes if I had been very
    dedicated and split the work further between agents. As I have a subscription,
    the effective cost was closer to a few cents.<p>I can&#x27;t say if they are willingly
    or unwillingly trying to deflect responsibility away from themselves, but until
    they prove that they were hit by an undisclosed RCE, this is just poor maintenance
    on their part. We need to start holding companies responsible for not updating
    their software on time. They shouldn&#x27;t be allowed to always play victim.
    The journalist should ask about their CI and when they last patched their software.
    That&#x27;s what would let us judge them.'
  score: 0
