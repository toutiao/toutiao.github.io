  text: "&gt; So yes, it&#x27;s very much correct to say that due to costs of attacks
    going down, a previously secure system is insecure now.<p>It&#x27;s more correct
    to say that previously insecure systems are being more frequently discovered and
    exploited now. If I always leave the door to my house unlocked, and as a result
    it gets broken into tomorrow, it wouldn&#x27;t be right to say that it was secured
    today. It was never secured and was always left unlocked and vulnerable, I&#x27;ve
