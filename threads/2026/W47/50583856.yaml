  author: TeMPOraL
  text: It&#x27;s not about luck, but economics.<p>If your neighborhood was safe to
    the point everyone felt okay with leaving doors unlocked, you&#x27;d feel everything
    is secure enough. When conditions changed (e.g. deterioration of policing, economic
    downturn, or even <i>population increase</i>), and burglaries become a thing in
    the area, it&#x27;s no longer secure.<p>There is no absolute security. Even your
    door lock is piss poor security for determined attacker[0] - it&#x27;s not really
    securing your home, it&#x27;s raising the cost (time) of the attack to the point
    your home is not an attractive target (relative to your neighbor, or a deli nearby,
    or cars, or...).<p>--<p>[0] - If someone cared enough to get in, they&#x27;d go
    through the window. Or drill the lock out of the door. Or tear the door out of
    the frame. Door locks are mostly security through <i>inconvenience</i>, but in
    most places, <i>that is secure enough</i>.
