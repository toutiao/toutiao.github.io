  author: TeMPOraL
  text: 'This kind of explanation is arguably doing <i>more harm than good</i>, for
    at least several reasons:<p>- The property of a problem being &quot;easy to check,
    but not easy to solve&quot; is an extremely useful one[0]. It&#x27;s also not
    inherent to NP problems. <i>Most problems that have this property are not NP</i>.<p>-
    The explanation omits entirely a different aspect, that&#x27;s closer to a characteristic
    of NP problems: that they&#x27;re all equivalent to each other mathematically,
    so if you find an efficient solution for one, you found it for all of them.<p>--<p>[0]
    - Especially so in the age of LLMs, as it&#x27;s almost a definition of &quot;what
    LLMs can beat humans at today&quot;&#x2F;what we can reliably use them for.'
