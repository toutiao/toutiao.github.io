    easy for you to tell whether they&#x27;re right.<p>&quot;Where are my keys?&quot;
    - NP.<p>&quot;Should I marry my girlfriend?&quot; - not NP.<p>(Where &quot;easy&quot;
    is defined as polynomial time.)"
