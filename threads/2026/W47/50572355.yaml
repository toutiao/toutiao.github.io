  author: danlitt
  text: I don&#x27;t think explaining NP is that bad. Most people can understand what
    an algorithm is, some basic problems like sorting a list or TSP. If you just want
    to distinguish polynomial-time from non-polynomial-time algorithms, it&#x27;s
    straightforward to give &quot;obviously bad algorithms&quot; (like brute-force
    search) and &quot;obviously better algorithms&quot; (pick your favourite) and
    to make that intuitive distinction precise.<p>Practical things like computer vulnerabilities
    are pretty easy to explain. I think anyone I know could understand what a buffer
    overflow is and why it&#x27;s bad. The computer is a dumb machine and clobbers
    whatever you tell it to.<p>Relativity and monty hall are much better examples,
    I think. Relativity is well-studied enough that the explanations available for
    teenagers are pretty good, and if you study them you can get a pretty comprehensive
    understanding. But you do have to study them. Both are vulnerable to a certain
    kind of passive understanding, where correct arguments and incorrect arguments
    can both sound equally convincing.
