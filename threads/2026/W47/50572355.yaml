  author: wat10000
  text: I think you could explain it as the fastest possible computer program for
    doing the task. Not the fastest made, but the fastest that ever could be made.<p>Then
    you can talk about how this optimal program behaves. If you double the size of
    the input (people can understand this in terms of file size), does the time double,
    or quadruple, or...? I wouldn&#x27;t mind trying to explain NP to a lay audience.
    I think you could get it across pretty well.<p>You can probably do Monty Hall
    by enumerating all of the possibilities. There are only nine possible combinations
    of where the car is and which door you choose. The difficulty, I think, comes
    from overanalyzing the problem, and a simpler explanation actually makes the job
    easier.<p>Relativity is a goo example though. I don&#x27;t understand relativity
    beyond the most superficial level. As far as I can tell, the teenager-level explanations
    of relativity <i>are not right</i>. They convey some aspects of relativity on
    a conceptual level, and even some basic things on a mathematical level, but they&#x27;re
    omitting important aspects of it. You might read <i>A Brief History of Time</i>
    (or whatever your favorite explainer is) and come away with an understanding of
    relativity, but your understanding will be some combination of wrong and extremely
    incomplete.
