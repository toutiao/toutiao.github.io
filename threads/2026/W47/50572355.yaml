  author: Frost1x
  text: Well I would push back on that claim because I don’t feel like you’re <i>reducing</i>
    things. You’re filling in gaps in understanding of something they already understand
    across the entire conceptual landscape it’s just masked by prior knowledge, they
    already know other concepts in detail and using a strategy to break a larger problem
    into smaller parts to make it digestible over time, you’re still dealing with
    the full set of complexity.<p>I think reductionism absolutely is possible in a
    lot of cases but I tend to agree with Stephen Wolfram’s concept of “computational
    irreducibility” or concepts we essentially know from compression in information
    theory (like Shannon entropy, Kolmogorov complexity) that there are limits to
    just how much you can reduce an idea or concept, and the bound for the human mind
    is likely much higher than those lower limit concepts.<p>Magnetic force is pointed
    out because it’s a more unique experience people don’t have a lot of prior knowledge
    and experience baked in that you can leverage as an assumption to reduce the concept,
    I think this holds true with lots of things. That isn’t to say we shouldn’t try
    to explain things simpler, just that that big caveat asterisk becomes ever more
    important when we use reductionist explanations. It’s not unlike when people try
    to explain spacetime curvature with a ball on a rubber sheet and things rotating
    around it… sure, that kind of gets at the idea, but there’s a huge asterisk that
    it’s simply not what’s really going on, it hints at the concept of curvature on
    a 2D plane you need to somehow conceptually extrapolate to other dimensions.
