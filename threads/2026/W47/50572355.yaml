  author: less_less
  text: No, neither of these.<p>Very roughly, P = &quot;easy to solve&quot;, and NP
    = &quot;easy to check whether a proposed solution is correct&quot;.  All problems
    in P are also in NP.  The P =? NP question is whether the reverse is also true.  A
    problem is &quot;NP-hard&quot; if it&#x27;s at least as hard (in some very particular
    sense) as every problem in NP, and it&#x27;s &quot;NP-complete&quot; if it&#x27;s
    NP-hard and also itself in NP.  It&#x27;s these NP-complete problems which are
    in some sense all equivalent to each other.<p>There are still a lot of technical
    details omitted here.  To scratch the surface:<p>&quot;Problem&quot; aka &quot;Language&quot;
    = &quot;yes-no questions about strings&quot;, so for example &quot;is this string
    the base-10 representation of a square integer?&quot; (in P, and therefore also
    in NP) or &quot;does this string represent a square grid of numbers that&#x27;s
    a Sudoku (generalized to allow larger grids than 9x9) with at least one solution?&quot;
    (in NP, and in fact NP-complete).  &quot;Easy&quot; = &quot;there exists a deterministic
    Turing machine which correctly answers the question on every input, and always
    runs in a number of steps which is less than some particular polynomial in the
    length of the input string&quot;.  (In the real world, though, &quot;polynomial-time&quot;
    is not the same thing as &quot;easy&quot;.)  A language L being NP-hard means
    that for any NP language M, there&#x27;s a polynomial-time deterministic Turing
    machine which maps M-inputs to L-inputs, where yes-instances map to yes-instances
    and no to no.  Swapping yes and no is not allowed.  For NP problems you only have
    to be able to check solutions in poly-time if the solution indicates that the
    answer is &quot;yes&quot;.  The corresponding family where you can check &quot;no&quot;
    quickly is called co-NP, and it is believed that NP != co-NP.  Etc etc etc.
  score: 0
