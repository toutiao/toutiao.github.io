  author: jan_m_savage
  text: 'The classical-Persian-speaking hakeems (sage) were of two categories: writing
    prose, and those writing poetry. The former (among them Ibn Sina [Avicenna], Razi,
    Alberoni, Al-khuarezmi [Algorithm named in his honor] would use prose because
    the topic needed a uniform deep treatment (philosophy, medicine, history [Baihaqi,
    e.g]). The explanations would start from simple and then build up into complex.<p>The
    latter group were poet-thinkers. They would write their findings (spiritual, mystical,
    social [social psychology, sociology, political science]) in poetic forms so elegant
    that these were at once both simple and complex. To the layperson with little
    insight and knowledge, they would make elementary sense and benefit them. But
    the more you knew, the more sophisticated you were, the deeper the meanings you
    could unearth.<p>So the latter group (Sanaii, Attar, Rumi, Nezami, Sa&#x27;adi,
    Hafez, I could go on) were masters of words and skill in presenting extremely
    rigorous ideas in the simplest, sweetest, most meaning-packed verses possible,
    without even appearing to break a sweat doing so. Rumi wouldn&#x27;t even write,
    he would be in states of mystic ecstasy and send forth verse after verse which
    were hurriedly copied by the apprentices (mursheds).<p>PS (I am just a lifelong
    student of &#x27;Oriental&#x27; languages.)'
