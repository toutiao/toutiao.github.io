    gift link\n\n## [If you can’t explain something in simple terms, you don’t understand
    it](/17/06/if-you-cant-explain-something-in-simple-terms-you-dont-understand-it)\n\n![Feynman
    Blackboard](/cdn-cgi/image/format=auto,fit=scale-down,width=1200,metadata=none//plus/misc/images/feynman-blackboard.jpg)\n\nIn
    the early 1960s, Richard Feynman gave a series of undergraduate lectures that
    were collected into a book called [the Feynman Lectures on Physics](https://www.amazon.com/exec/obidos/ASIN/0465023827/ref=nosim/0sil8).
    Absent from the book was [a lecture](https://www.youtube.com/watch?v=mcD-5UfY1g0)
    Feynman gave on planetary motion, but a later finding of the notes enabled David
    Goodstein, a colleague of Feynman’s, to write a book about it: [Feynman’s Lost
    Lecture](https://www.amazon.com/exec/obidos/ASIN/0393319954/ref=nosim/0sil8).
    From an excerpt of the book published in [a 1996 issue of Caltech’s Engineering
    & Science magazine](http://calteches.library.caltech.edu/563/2/Goodstein.pdf):\n\n>
    Feynman was a truly great teacher. He prided himself on being able to devise ways
    to explain even the most profound ideas to beginning students. Once, I said to
    him, “Dick, explain to me, so that I can understand it, why spin one-half particles
    obey Fermi-Dirac statistics.” Sizing up his audience perfectly, Feynman said,
    “I’ll prepare a freshman lecture on it.” But he came back a few days later to
    say, “I couldn’t do it. I couldn’t reduce it to the freshman level. That means
    we don’t really understand it.”\n\n[John Gruber writes](https://daringfireball.net/linked/2017/06/14/feynman-freshman-lecture)
    the simple explanations are the goal at Apple as well:\n\n> Engineers are expected
    to be able to explain a complex technology or product in simple, easily-understood
    terms not because the executive needs it explained simply to understand it, but
    as proof that the engineer understands it completely.\n\nFeynman was well known
    for simple explanations of scientific concepts that result a in deeper understanding
    of the subject matter: e.g. see Feynman explaining [how fire is stored sunshine](http://kottke.org/15/03/richard-feynman-fire-is-stored-sunshine),
    [rubber bands](http://kottke.org/13/09/richard-feynman-explains-rubber-bands),
    [how trains go around curves](http://kottke.org/13/04/why-dont-trains-need-differential-gears),
    and [magnets](http://kottke.org/10/02/richard-feynman-explains-magnets-sort-of).
    Critically, he’s also not shy about admitting when he doesn’t understand something…or,
    alternately, when scientists as a group don’t understand something. There’s the
    spin anecdote above and of [his explanation of magnets](http://kottke.org/10/02/richard-feynman-explains-magnets-sort-of),
    he says:\n\n> I really can’t do a good job, any job, of explaining magnetic force
    in terms of something else you’re more familiar with, because I don’t understand
    it in terms of anything else you’re more familiar with.\n\nFeynman was also quoted
    as saying:\n\n> I think I can safely say that nobody understands quantum mechanics.\n\nPretty
    interesting thing to hear from a guy who won a Nobel Prize for explaining quantum
    mechanics better than anyone ever had before. Even when he died in 1988 at the
    end of a long and fruitful careeer, a note at the top of [his blackboard](http://archives-dc.library.caltech.edu/islandora/object/ct1%3A483)
    read:\n\n> What I cannot create, I do not understand.\n\n- [Apple](/tag/Apple)\n-
