  author: streetfighter64
  text: I think it&#x27;s not really about making simple analogies, because they don&#x27;t
    really &quot;explain&quot; anything in the proper sense of the word. An analogy
    might make somebody feel like they understand it, but it doesn&#x27;t really give
    actual understanding (see pop sci explanations of quantum mechanics).<p>It&#x27;s
    more about breaking down stuff into simpler parts. For example, you want to explain
    a buffer overflow exploit in a web server. Then you&#x27;ll ask your audience,
    do you understand addressing &#x2F; memory allocation, and do you understand HTTP?
    If they say no to any of those, then you&#x27;ll have to explain e.g. memory allocation
    first. And if they don&#x27;t know how a CPU &#x2F; RAM &#x2F; caches operates,
    then you&#x27;ll have to explain that first. And maybe you&#x27;ll have to explain
    boolean algebra and how to build an adder from logic gates. And so on.<p>So I
    would claim that &quot;reductionism is always possible&quot;. More complex things
    just take longer to distill into less complex things, but it can always be done.
    The exception would be things that &quot;nobody really understands&quot;, like
    Feynman says about magnetism:<p>&gt; I really can’t do a good job, any job, of
    explaining magnetic force in terms of something else you’re more familiar with,
    because I don’t understand it in terms of anything else you’re more familiar with.
