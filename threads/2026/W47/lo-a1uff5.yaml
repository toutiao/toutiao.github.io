  text: This is actually one of the reasons to prefer Java to other memory-safe languages.
    Java has an explicit two-worlds abstract machine, where safe and unsafe code live
    in different places. Ten years ago, I showed that you can use CHERI to sandbox
    the native JNI code and ensure the integrity of the Java code even in the presence
    of arbitrary bugs in the native code (and use Java attributes to provide isolated
    sandboxes for different native things). Other folks have done the same with NaCl
    and other techniques. This is much easier with Java than, say, Rust where unsafe
    Rust (and FFI) can directly access Rust objects.
