  text: |-
    Lets compare Java to a few other options then.
    Say we have apps in

    Python
    Go
    Java

    And all of them have a transitive dependency tree of non-trivial depth.
    When you import somelib and call somelib.func(), might that call into native code? Probably. Python itself is slow and the ecosystem has tons of C extensions to deal with this.
    Go is a similar story. There is less reason to use CGO, but if you import "github.com/somebody/somelib" that might pull in some native code.
    Now for Java.
    In Java 8 java -jar app.jar has the same problem as Python and Go. Anything can be doing JNI and thats a potential problem.
    In Java 25 java -jar app.jar will print a warning at runtime if native code is called. At some point soon this warning will become a hard error.
    To address the warning you need to add java --enable-native-access=ALL-UNNAMED -jar app.jar, which says "anything in the jar can do native stuff." But if you are conscious of these issues you can always split things up into
    java -p <jars> ... MainClass. And in this configuration to use native code you need to write java -p <jars> --enable-native-access=somelib ... MainClass.

    the argument for Java specifically over other memory safe languages

    So the argument boils down to "you won't end up running native code by accident and, when you do, you can limit that superpower to what actually needs it and audit appropriately."

    The tangent about speed is just to say "and you probably won't have many libraries that need native code anyways." Which is the realm Go operates in too, I think.
    The rest of the module system protections are also cool. Put code in a module and you have a much stronger guarantee than many languages can provide about whether that code "definitely does what it says."
    This is important when you get nonsense like gadget chain attacks. You can limit what a bug in one part of the program can do to code in another. In the Java world we are kinda dismissive of it, but if we're going to start living in a "AI finds any critical security flaws in hours" world, that level of confidence that "No, assuming the VM is written right, this will not happen" is valuable.
