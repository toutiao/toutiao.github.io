  author: ramses0
  text: 'Initial feedback: it&#x27;s patently &quot;alright&quot; but having to manage
    things via copy-pasting them in to a non-VIM editor that&#x27;s not backed by
    git is a non-starter.<p>I can only imagine how seriously professional authors
    take their choice of text editors and their aversion to loss-of-text.  I could
    definitely see something like `git push remotes&#x2F;foolscap` or uploading zips
    because I&#x27;m never going to use your service as a primary data store with
    no local backups.<p>On the feedback that it gave (on the limited, single-doc that
    I uploaded) it was surprisingly decent, but the &quot;abstract adjacent threads&quot;
    is different than kindof a side-by-side &#x2F; pull-request style view (or inline
    comments&#x2F;annotations?) that I&#x27;d prefer.<p>The tooling has potential
    utility, but look a little closer at google doc&#x27;s stylings w.r.t. comments,
    replies, and &quot;resolving&quot; things.  Having to manage my document as a
    whole itself, and then a disassociated stream of &quot;issues&quot; is jarring.  I
    guess it&#x27;s nice that you can click on the &quot;issue header&quot; and get
    scrolled to a section, but I&#x27;d almost prefer a red&#x2F;yellow&#x2F;green
    gutter color indicator which opened the thread next to the particular issue&#x2F;paragraph
    instead of the reverse UX that you&#x27;ve currently got.<p>Thinking through,
    it&#x27;s almost like on a paragraph-by-paragraph basis (actually: an arbitrary
    selection), being able to open up a flyout thread saying&#x2F;showing: &quot;What
    have you already detected? Nothing? Once I&#x27;ve selected this chunk do you
    have any feedback? Well, I have a question about XYZ...&quot;<p>It&#x27;s almost
    like the &quot;free&#x2F;always-online&quot; writing partner.  Think about how
    you would naturally want to give feedback when reading someone else&#x27;s writing
    (select a blob, right-click, &quot;add comment...&quot;).  In some cases you&#x27;ll
    auto-apply those comments to the user&#x27;s writing, but in other cases make
    it easy for the user to invoke the AI to give commentary (an outsiders perspective),
    potentially with a style guide: &quot;reword =&gt; fact check =&gt; detect contradictions...&quot;'
