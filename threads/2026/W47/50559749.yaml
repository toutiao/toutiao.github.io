  text: 'Congrats on the launch<p>I&#x27;m working on something very similar: <a href="https:&#x2F;&#x2F;x.com&#x2F;klntsky&#x2F;status&#x2F;2123140693954900007"
    rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;klntsky&#x2F;status&#x2F;2123140693954900007</a><p>With
    AI reviews of prose, I noticed that you really have to keep separate nitpicking
    rules per document for them to be useful, so I focused my solution on that exactly.<p>You
    create a &quot;reader&quot; (an agent), and whenever an issue is flagged you are
    offered multiple way to change the rules to allow it, or you can set your own
    rules. The agent NEVER edits or proposes you text. You can edit manually and the
    flagged issue disappears.<p>Not sure if I will publish it though - that loop needs
    hours of dogfooding and I don&#x27;t write much.<p>Feel free to DM if you want
    to test it'
