  author: DimmieMan
  text: Solid is just JSX which is stock typescript tooling.<p>* Does not need any
    unique editor plugin like Svelte and Vue to provide a language server.<p>* Worked
    with Tsgo day 1.<p>* Works with oxfmt by default day 1.<p>* Works somewhat with
    oxlint out of the box day 1, eslint plugin is fully supported.<p>Svelte has a
    much more complicated build system and customised plugins that need regular upkeep,
    for basic usage it might just look like a vite plugin line and the eslint&#x2F;prettier
    config that gets generated as part of project init but as your app grows and you
    maintain it longer term you absolutely start feeling the deficiencies and weight
    of all the svelte tooling.<p>Solid has a compiler and an eslint plugin, but otherwise
    leverages the standard typescript tooling, it&#x27;s so much faster. Ryan&#x27;s
    looking at reactive script now but it was an extremely good decision to not take
    on the tooling maintenance of Svelte and Vue.
