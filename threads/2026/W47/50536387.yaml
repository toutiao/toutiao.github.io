  author: kilburn
  text: Vercel UI SDK is a &quot;headless&quot; UI tooklit. &quot;Headless UI&quot;
    is packaging of behavior that has to be implemented in javascript to get properly
    working widgets.<p>For instance, to implement a menu you have to support things
    like keyboard navigation and auto-closing when the user clicks elsewhere.<p>Gettings
    these sort of behaviors right across all browsers is oftentimes _hard_, and testing
    them properly is very time consuming. That&#x27;s why it&#x27;s useful to have
    it built and tested by a large company.<p>Traditionally, these behaviors came
    built-in with your &quot;UI Widget Library&quot; of choice (e.g.,  <a href="https:&#x2F;&#x2F;ant.design&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;ant.design&#x2F;</a>). However, widget libraries
    bring in their own style and subtle opinions. When you are aligned with those
    everything is great, but when you want to deviate visually or behaviorally then
    you have a hard time.<p>In contrast, &quot;headless UI&quot; packages these behaviors
    (and only the behaviors) as little snippets that you &quot;plug in&quot; to your
    own widgets&#x2F;components. Since how these behaviors get to be &quot;plugged
    in&quot; to components and how they can interact between them may be dictated
    by the UI framework&#x2F;library (e.g., react, astro, solid) the headless ui kits
    explicitly call those that they support.<p>For Vercel UI SDK specifically, you
    can check the list of behaviors they implement here <a href="https:&#x2F;&#x2F;ui-sdk.dev&#x2F;docs&#x2F;core&#x2F;behaviors"
    rel="nofollow">https:&#x2F;&#x2F;ui-sdk.dev&#x2F;docs&#x2F;core&#x2F;behaviors</a>
  score: 0
