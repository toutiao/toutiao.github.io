  title: Solid 2.0 - The Long Hold | Solid
  fetch_status: success
  content: "5 years is a long time to work on anything. It took 5 years from my first
    commit of Solid to 1.0, and it's been another 5 since then.\n\nA lot changes in
    5 years. Solid 1.0 made a bet that fine-grained reactivity, signals, was the right
    foundation for building user interfaces. Back then it was an unusual position.
    Today signals are everywhere. In Angular, in Svelte's runes, in Vue Vapor, and
    in a proposal before TC39 to put them in the language itself. It even pushed the
    conversation into React's compiler.\n\nMore recently that conversation has shifted
    to AI, arguably an even larger change in how we build. But Solid has always been
    about building the right things; the performant things. So for us the mission
    hasn't really changed all that much. The things that we identified as standout
    about our approach still stand out now. But instead of living in the shadow of
    more popular solutions Solid 2.0 carves out a path that others can follow. Deliberately
    this time.\n\nToday that solution reaches stable.\n\n## [Async Graph](#async-graph)\n\nIf
    fine-grained reactivity's greatest strength is knowing the shape of our application,
    that knowledge shouldn't end with the process, or the machine the code is running
    on. Real applications are distributed. Real applications are born from data that
    lives on a server. The coordination of these pieces should be intentional and
    by design.\n\nThis starts with bringing async into the graph. A computation can
    return a Promise or an async iterator, and everything downstream just understands:\n\nfunction
    Profile(props) {\n    \n    \n      const user = createMemo(() => fetchUser(props.id));\n
    \   \n    \n    \n    \n      return (\n    \n    \n        <Loading fallback={<Skeleton
    />}>\n    \n    \n          <h1 class={{ stale: isPending(user) }}>{user().name}</h1>\n
    \   \n    \n        </Loading>\n    \n    \n      );\n    \n    }\n\nThis allows
    authoring by affordance while automating the handling of race conditions. The
    introduction of async doesn't cause an app refactor. Speculative state is automatically
    rolled back without manually written processes ensuring the server remains the
    authority on truth.\n\nSolidStart introduce the world to server functions in early
    2022, and now they have found their way home to Solid's core, better than ever.
    Not only do they support highly capable RPC calls over Request/Response but persistent
    connections over Server Sent Events. And consuming it remains as simple as the
    code below.\n\nimport { live } from \"@solidjs/web/server-functions\";\n    \n
    \   \n    \n    \n    const stockPrice = live(async function* (symbol: string)
    {\n    \n    \n      \"use server\";\n    \n    \n      for await (const tick
    of subscribe(symbol)) yield tick.price;\n    \n    });\n    \n    \n    // in
    your component\n    \n    const price = createMemo(() => stockPrice())\n\nThis
    is only the beginning of what can be done with Server Functions and we will be
    announcing some new features (like reactive Server Components) in coming weeks
    that leverage this capability.\n\n## [Built to Be Written by Agents](#built-to-be-written-by-agents)\n\n\"But,
    we aren't writing the code anymore!\" We hear you. A system built on constraints
    by construction ends up with less code to maintain and less edge cases. What used
    to be considered a DX shortcoming of reactive frameworks are now their greatest
    strength. And Solid 2.0 goes all in.\n\nEvery framework now says it \"works great
    with AI\", and usually that means models have seen a lot of it. That's a statement
    about training data, not about the framework. The question that matters is what
    happens when the agent gets it wrong.\n\nIn most frameworks a reactive mistake
    is silent. The app runs, it's just wrong, and the framework can't tell you, because
    it can't see it either. Solid can. A fine-grained graph knows exactly what was
    read, where, and what will update. So Solid 2.0's development builds report mistakes
    as they happen, with a stable code, the location in your source, and the fix:\n\n[STRICT_READ_UNTRACKED]
    Reactive value read directly in an effect callback will not update. Move it into
    a tracking scope (JSX, a memo, or an effect's compute function).\n    in <App>
    › <Item> › effect\n    at http://localhost:5173/src/Item.tsx:12:19\n    [STRICT_READ_UNTRACKED]
    what it means and how to fix it: https://docs.solidjs.com/reference/solid-js/diagnostics/strict-read-untracked\n
    \   [STRICT_READ_UNTRACKED] agent repair guide: node_modules/solid-js/skills/reactivity-diagnostics/SKILL.md#strict_read_untracked\n\nThese
    handle everything from strict errors to helpful heuristics. Thanks to async in
    the graph we can detect waterfalls, poorly constructed effect loops, poorly scaling
    graph shapes like wide graph fanouts and fan-ins. Today along with linting rules
    we can provide the best in class direction for agents at compile and at runtime.\n\nThis
    area is still evolving as we learn more about how agents build applications with
    Solid. The hard part, defining the primitives and semantics, is done. We've integrated
    with new dev tooling, and Chrome's Performance Tracks. And this capability goes
    beyond development as this observability powers things like our updated Sentry
    plugin so you can get the same information on your production builds.\n\nWe've
    also been looking at alternative syntax. Solid 2.0 adds experimental support for
    [ReactiveScript](https://reactivescript.dev) and [TSRX](https://tsrx.dev), both
    aiming to use compilation to further improve agent authoring.\n\n## [One Framework
    for All](#one-framework-for-all)\n\nI've always been a big believer that React's
    super power is its composability. That it allowed the ecosystem to build on its
    humble pieces. However, we've learned a lot since 2013. At that point composable
    state, async patterns, and server rendering lacked the primitives to build upon
    and the ecosystem came up with their own solutions. This was fine for a while
    but tied React's hands and fractured their ecosystem. Something only a framework
    as popular as React could survive.\n\nNewer frameworks have taken more on themselves
    and tend to only have one metaframework, or one router. We respect React's original
    positioning but have updated it for 2026. It isn't about restricting the solution
    but giving developers the primitives to build upon in the way React originally
    did. Server functions are example of this. Supporting any router, and cache solution
    for Single-Flight Mutation is another.\n\nWe retired our metaframework SolidStart,
    since every primitive needed to build a Solid Metaframework is now provided by
    the core or by framework agnostic Vite plugins. We believe that building an opinionated
    layer like a metaframework shouldn't have you needing to re-implement everything
    again. We've taken care of the hard parts so you can focus on what you care about.
    And these days a lot of that work is going to be taken on by your agent. This
    means less to maintain but no loss in capability.\n\nAnd this makes it easier
    for the ecosystem. Solid 2.0 only requires one Clerk or Sentry plugin since we
    provide the primitives for Request/Response (built on web standards) and the hooks
    for observability that work across any library. We've already seen success with
    TanStack Query and Router being as capable as anything we've built first party,
    bringing in Tanner's impeccable attention to detail for the APIs people love to
    use.\n\n## [Less is More](#less-is-more)\n\nSomehow even though Solid 2.0 brings
    more capability to Solid, we've collapsed the surface area at almost every point.
    There are less primitives needed to be learnt, less ceremony around handling async.
    `createResource`, `batch`, `startTransition`, `on`, `produce`, `createComputed`,
    `createMutable` are all gone, because we no longer need them.\n\nThe equivalent
    code written for Solid 2.0 is shorter and clearer on intent. It informs our ability
    observe the runtime, provide better compiler errors, and removes the need for
    as many escape hatches (like `createEffect`) that can get us in trouble. This
    is something we believe important in an age"
