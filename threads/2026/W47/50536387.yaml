  text: |-
    I assume you mean `useEffect`.<p>That does not work because `loadTTS` is actually a hook, so its `useLoadTTS`, and hooks must be top level. I encourage you to look at the pastebin in my link, repeated here <a href="https:&#x2F;&#x2F;pastebin.com&#x2F;sjc3vXTd" rel="nofollow">https:&#x2F;&#x2F;pastebin.com&#x2F;sjc3vXTd</a><p>So, I must have<p><pre><code>    let provider = useGetUserPreference()
        let a = useLoadTTS_A()
        let b = useLoadTTS_B()
        let c = useLoadTTS_C()
        useEffect(() =&gt; {
          if (provider==&quot;a&quot;) a()
          if (provider==&quot;b&quot;) b()
          if (provider==&quot;c&quot;) c()
        })
    </code></pre>
    Oh hey, what&#x27;s that? I have to allocate memory for b and c even though only a is used? THANKS REACT.
