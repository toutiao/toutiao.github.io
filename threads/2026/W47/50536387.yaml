  author: AlexErrant
  text: The async graph is VERY cool. It does a great job of encapsulating async&#x27;s
    nature to cause &quot;colored&quot; functions by using the existing signal graph
    (which admittedly is its own color; but virtually every UI framework has similar
    coloring so at least Solid&#x27;s cutting a color&#x2F;making it composable).<p>Contrast
    that with React, where hooks are colored functions. You thought that hooks were
    just functions? Nope, if you have a hook, it MUST be called in a hook&#x2F;component...
    exactly like async. Did you want to load this TTS player conditionally? Hahah,
    you can&#x27;t. Have fun allocating memory for every TTS provider your app supports,
    even if the user uses only 1 player. <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=45257413">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=45257413</a><p>&quot;Thanks
    to async in the graph we can detect waterfalls, poorly constructed effect loops,
    poorly scaling graph shapes like wide graph fanouts and fan-ins.&quot; Incredibly
    cool. Apparently Tanstack Query has a waterfall detector <a href="https:&#x2F;&#x2F;github.com&#x2F;bamlab&#x2F;tanstack-query-detect-waterfall"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;bamlab&#x2F;tanstack-query-detect-waterfall</a>
    so the other frameworks have something similar, but it won&#x27;t work with their
    state graphs.
