  author: Edward40
  text: "&quot;Cost per pass&quot; is distinct from &quot;cost per successful task.&quot;<p>Cost
    per pass is simply the average cost per task divided by the pass rate.<p>If you
    draw a line from the origin to any harness on that chart, its slope (pass rate
    ÷ cost) represents passes per dollar. Cost per pass is the inverse of that slope,
    meaning the lowest cost per pass gives you the steepest line."
