  author: dcss_gardener
  text: You can steer it a lot with implicit context too, like ants following pheromones.
    If you put an empty docs&#x2F; dir in your repo agents will put documentation
    there without being told. If you put one inline test, they&#x27;ll write every
    test inline. If you seed a decision record they&#x27;ll record their decisions.
    If you have a lowercase sql query they&#x27;ll use lowercase sql. If you write
    a test for wcag AA contrast they&#x27;ll make ui with wcag AA contrast. And so
    on.<p>With some up front care you can create an environment where they mostly
    do what you want when you let them rip without oversight. As the codebase grows
    it becomes less likely they&#x27;ll see any one example, and more rarely expressed
    ones can get missed. And then codebase predating LLMs or designed without this
    consideration you just have to accept what you get or wrangle them manually.
