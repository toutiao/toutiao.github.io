  author: xyzzy_plugh
  text: I don&#x27;t like this framing.<p>For a given model, the best harness depends
    on the problem. As models become increasingly capable, the harness  appears to
    matter more than the model. This is perhaps controversial but allow me to explain.<p>Most
    of my problems are in a single domain, using specific tools and programming languages.
    I give whatever model de jour the specific tools it needs to solve the problem.
    I don&#x27;t let it execute arbitrary scripts or programs (though it can, if it
    really tries). I give it a restricted number of calls and I feed that information
    back into it (budget). I let it farm out work to other models, using the same
    harness. I give everything a budget, which is tracked and enforced, but it&#x27;s
    not real, and refills at different times.<p>This bespoke, specialized harness
    absolutely smokes any other mainstream harness for these tasks. Significantly
    faster, cheaper, more correct.<p>But I can&#x27;t build a mobile app with this
    harness, or make a movie.<p>These tests are doing the same thing. They measure
    a handful of scenarios. I can&#x27;t easily tell if those map to my needs or not.
    In my experience, very few of them do.<p>Can these general purpose harnesses solve
    my problems? Yes, if I&#x27;m willing to let the model churn for a long time and
    burn a lot of tokens. But that doesn&#x27;t feel like a sustainable practice.<p>Maybe
    I&#x27;m too early, maybe it&#x27;s premature to optimize the harness this way,
    but I&#x27;m spending fewer tokens than my peers and getting a lot more done,
    and that matters.
