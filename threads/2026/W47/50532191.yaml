  author: Majromax
  text: Saying that &#x27;steps per pass&#x27; explains cost seems nearly tautological.  Run
    costs are proportional to the number of tokens produced, and the number of tokens
    is strongly correlated to the number of steps.<p>The &#x27;steps per pass&#x27;
    criterion is also not something under the harness&#x27;s direct control in the
    way that its tool collection and system prompt (&#x2F;start tokens) are.  Even
    the cache hit rate is hard to control beyond a limit, since modern harnesses rarely
    rewrite history.<p>I&#x27;m also suspicious about the run-to-run variance between
    models.  Given the high variability within the presented results and the observation
    that failed runs (which can spin for a long time before delivering a wrong answer)
    account for a majority of the cost, I&#x27;m not sure that many of the conclusions
    here would hold up under a second sample.
