  author: contravariant
  text: I think Conway&#x27;s law applies. In an ideal situation your code mimics
    your organisational structure.<p>The places where you let an agent do its thing
    is bound by the (implicit) interface your prompt creates. In an <i>ideal</i> situation
    this interface is a simple isolated thing in your application.<p>If you just let
    it do its thing, expect a monolith. You shouldn&#x27;t rely on it coming up with
    interfaces that mesh well with what you had in mind, and each of those interfaces
    represents a decision that it took, restricting future iterations of the code.
    So a monolith is not only what you can expect, but also the best you can hope
    for.<p>If you want to let it cook, create more places for code that does a thing
    and you don&#x27;t care how.
