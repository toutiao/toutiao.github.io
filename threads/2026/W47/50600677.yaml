  author: andai
  text: "&gt;Pesticides? According to the WHO-UNEP report, prenatal exposure (as of
    2010) to a single family of these products (organophosphates) was, for example,
    responsible for more than 59,300 cases of intellectual disability per year in
    European Union (EU) countries. Due to maternal exposure to just this one category
    of pesticides, a European child born in 2010 lost, on average, about 2.5 IQ points,
    according to the panel of researchers brought together by WHO and UNEP.<p>&gt;Still
    based on population exposure levels in 2010, DDT – a highly persistent insecticide
    – although banned since the 1970s, was responsible for 56,700 annual cases of
    uterine fibroids in the EU, 28,200 cases of type 2 diabetes and 1,550 cases of
    childhood obesity. Even these figures provide only a small glimpse of the situation,
    as high-quality data are not available for the overwhelming majority of the approximately
    400 pesticides registered in Europe.<p>&gt;When it comes to plasticizers and industrial
    pollutants, the picture is no different. Exposure (in 2010) to DEHP in Europe
    caused 145,000 annual cases of endometriosis, 20,500 cases of diabetes and 53,900
    cases of obesity. Phthalates in general? They accounted for 618,000 annual cases
    of male infertility in Europe. Bisphenol A caused 42,400 cases of childhood obesity
    per year in Europe. And if anyone thinks the press exaggerates the issue of forever
    chemicals (PFAS, or &quot;per- and polyfluoroalkyl substances&quot;), the WHO-UNEP
    report reminds us that in the US, where 2018 data allow such an estimate, more
    than four million cases of obesity are attributable to the two most-studied PFAS,
    as well as 127,000 annual cases of childhood obesity and 14,000 cases of hypothyroidism."
