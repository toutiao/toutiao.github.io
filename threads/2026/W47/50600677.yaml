  author: codeforafrica
  text: I can share from personal experience that crime does not correlate with poverty
    but with wealth inequality.<p>I have lived one year in Entebbe which is in Uganda,
    south of Kampala. Entebbe is the location of Uganda&#x27;s largest airport, a
    Presidential residence, and it has the highest proportion of foreigners in Uganda.
    But it also has many poor people who either were there first, or came there from
    other areas in hope of finding work. The house we rented was from an African family
    that lived in the UK. Our neighbors were mixed. Some were affluent and some very
    poor. We were warned of crimes, and at least once I heard about a robbery not
    far from our home. We also had things stolen from our house. A very poor friend
    that I was visiting in a very poor neighborhood told me that their neighbors caused
    them trouble because the neighbors were jealous of my visits, thinking I would
    give my friend money. We had to stop meeting at their home. My own neighbors called
    me Africa Man for daring to walk through the streets at night without fear.<p>Then
    we moved to Tanzania. And the difference was noticeable. We live in a large city
    far away from Dar Es Salaam. There are very few foreigners here, and also very
    few wealthy locals. Most people seem to have a similar standard of living. Crime
    does exist. In the first neighborhood we lived in we were warned of occasional
    burglars roaming the area at night (we had a laptop stolen from our house because
    someone forgot to lock the door at night and the guy just walked in without waking
    anyone), but unlike Entebbe, there was no threat of robbers in the streets. Later
    we moved to another neighborhood a few km away, and there no warnings at all.
    Everyone still locks the doors at night but no one so far felt the need to tell
    me that I should watch out. I visit poor neighbors all the time, without issue.<p>So
    yes. Wealth inequality correlates with crime. And it makes sense. If everyone
    is poor, what is there to steal? At worst you get pickpockets trying to take your
    mobile phone.
  score: 0
