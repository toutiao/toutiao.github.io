    It's possible they'd allow it, but I'm not sure they'd also be happy about the storage requirements. Looking at my instance's statistics, I'd need about 3-4 GiB of container/package storage, which is well over the 100 MiB limit.
    Aside from that, having the private instance means I have a sort of escape hatch for e.g. running CI tests should Codeberg ever be unavailable for longer periods of time.
