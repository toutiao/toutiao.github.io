  text: |-
    While Codeberg allows for private repositories, this is limited to specific scenarios such as a private repository that supports a free-software project (e.g. a private project used for reporting security vulnerabilities). I have a few repositories used to build bootc server images/updates, and to track some private data (e.g. tasks to do around the house), none of which fall within the scope of what Codeberg allows.

    I would be shocked if anybody at Codeberg would object to you using private repos for this, especially since you're doing actual FOSS work on the platform and not just using it as free file hosting. I think the current policy on private repos is deliberately a bit vague specifically to allow for cases like this. Quoting the FAQ:

    If you are a contributor to free/libre software projects, we allow up to 100 MB of private content for your convenience. Use it for your personal notes, your side project or any other you want to keep private.

    (I don't mean to dissuade you from hosting your own Forgejo instance; I just wanted to point out that I don't think this would have been a problem.)
