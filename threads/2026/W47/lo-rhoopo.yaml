    While Git is distributed by design, this still feels like replacing one thing with another very similar thing - you're still at the mercy of a single Git hosting provider's uptime.
    Git's distributed nature makes it interesting to think about truly distributed, resilient repositories. It would be awesome if we could take better advantage of that. State synchronisation won't be a trivial problem to solve, though.
    Something like Radicle would be nice, but in a more mature and less complex form.
    In principle, moving away from GitHub is a good direction. We need more diversity in Git forge usage. I've always been puzzled by people new to Git conflating Git with GitHub.
