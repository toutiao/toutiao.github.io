    One of my biggest gripes with Forgejo is copying GitHub’s patterns all the way to the YAML soup for Actions. It ends up just being Microsoft, but leaner & open source. This isn’t differentiating enough to convince a lot of folks as it’s purely philosophical instead of being largely technically superior too since it’s usually copying their homework (I say this while strongly agreeing with that philosophy & considering Codeberg the closest thing I have to my ‘primary’ Git forge).
    But I think the Git distribution problem goes back to the fundamentals of being snapshot based. Ultimately without bolting an entire sidecar system to Git, some place has to be the canonical repository since things like patch order not distributing means you need to sync up with a single place. You can help (tho not eliminate) part of these concerns for distribution with Patch Theory (used by Darcs & Pijul) which allows the patches to commute & treats the patch/diff as a fundamental unit. I would rather see more efforts in this direction if wanting to be obviously counter to the Microslop platform since it can offer something technically superior. You can say there are less tools, but part of free software is pitching in to create these tools (I’ve made couple of Darcs things & want to make some Pijul ones too).
