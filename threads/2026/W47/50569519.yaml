  text: 'I’m curious: has the definition of AGI ever been agreed upon? Honestly, what
    people call ASI now seems to be what AGI used to mean. I’m not sure. People say
    AGI, but what is the reference point for AGI and what is the social consensus
    around it, and who set that standard?<p>In fact, working in IT, what I feel is
    that there are too many terms that are not defined and that each person uses differently.
    So it seems like rather than AI having advanced, someone arbitrarily set a finish
    line called AGI and then said we have reached it. Actually, in the books of singularity
    advocates, what they called AGI back then seems to be what we now call ASI.<p>Sometimes
    I think about this. How on earth can we measure an abstract concept like intelligence?
    The concept of intelligence we approach now seems to be about whether something
    can create problems and solve those problems. If so, what kind of intelligence
    does current AI have? Since we cannot directly face the abstract entity called
    intelligence, it seems like we are trying to guess its shape by looking at shadows.
    But whether current AI even has intelligence feels a bit difficult to say.<p>Even
    if I use the best frontier AI model accessible on the market, not the hidden latest
    models inside frontier labs, it still often makes wrong mistakes that humans would
    not make unless it works alongside humans. In programming, there are cases where
    AI tries to explicitly handle things that humans would implicitly pass over, and
    that actually makes things go wrong.<p>I’m not sure. Whether we should call this
    intelligence.'
