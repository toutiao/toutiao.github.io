  author: Animats
  text: |-
    <i>Similarly, coordinating thousands or millions of AGI instances into &quot;group agents&quot; or virtual agent economies could produce collective superintelligence. What is unclear today is how AI group intelligence could scale as we add more agents and compute, depending on how agents are organized.</i><p>We may not need &quot;collective superintelligence&quot;. Modest AI intelligence plus ordinary organization may be enough to do the job a company&#x27;s management does. An org chart where most of the boxes are AIs is a likely near future.<p>An organization of AIs has some advantages over a human organization, even if the AIs are not super-bright. They have far more communications bandwidth. They can ingest the info on a new subject very fast, as we see when Claude reads a Git repository. Onboarding a new AI is very fast. Layoffs are not a problem. The human resource problems go away along with the humans. So there&#x27;s a lot more organizational flexibility. Starting up a project means initializing some agent instances.<p>There&#x27;s a whole theory and practice of AI organizational behavior waiting to be developed.
    Whether it will be developed by humans or by AIs remains to be seen. It&#x27;s going to happen.
