  author: MykhailoSailor
  text: Both sides of this are partly right, and the 2023 memory crash explains a
    lot of it.<p>In early 2023 every NAND maker was losing money on each chip after
    prices collapsed. Samsung cut NAND output to around 50% of capacity by September
    2023, and Kioxia pushed its new Kitakami fab back from 2023 to 2024. After that,
    there were reports of Samsung and SK Hynix looking at converting some NAND lines
    to DRAM&#x2F;HBM, because that&#x27;s where the AI money is.<p>So it isn&#x27;t
    that nobody is building. It&#x27;s that NAND makers got burned badly two years
    ago, they&#x27;re adding capacity cautiously, and some of the floor space that
    could make flash is making HBM instead. A fab takes years to come online, so any
    new capacity started now shows up in 2027-2028 at the earliest.<p>That&#x27;s
    also why I&#x27;d be skeptical of &quot;second half of next year&quot; for retail.
    The memory market has always been boom and bust, and the bust usually comes from
    oversupply. Right now the makers are deliberately avoiding exactly that.
