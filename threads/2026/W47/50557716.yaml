  author: nostrademons
  text: 'The shell company is financed and owned by a group of investors alongside
    the company(ies) actually making the capital investment.  That&#x27;s the other
    big reason for using a SPV: you can access outside capital, which lets you leverage
    expansion faster than your own free cash flow can, and then gets to share in the
    upside.<p>If the market for AI disappears, the SPV becomes unprofitable for everyone,
    so they write it off and let it go bankrupt.  Who you gonna sue?  It&#x27;s not
    like it&#x27;s one person or one company behind the SPV, and the entity you actually
    contracted with is the now-nonexistent SPV.<p>(This, BTW, is the <i>whole purpose</i>
    behind the legal construct of the corporation: to allow multiple parties to pool
    financial resources behind a risky venture, limit their downside to the amount
    of invested capital, and shield them all from legal liability.)'
