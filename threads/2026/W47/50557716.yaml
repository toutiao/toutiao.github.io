  title: When Will Hard Drive Prices Come Down? The 2026-2028 Outlook | DriveVault
  fetch_status: success
  content: "It is the question we get asked more than any other right now, and it
    is the most searched phrase that brings people to this blog. So here is the straight
    answer: SSD prices should start to ease in the second half of 2027. Hard drives
    will take longer, probably into 2028, because the factories that make them have
    already sold that output.\n\nThat is not a guess. It comes from the analysts who
    track memory contract prices every quarter, and from what Seagate and Western
    Digital told their own investors this summer. Below we lay out the evidence, explain
    why spinning drives and SSDs are running on different clocks, and give you a realistic
    timeline with the signals to watch.\n\nWe have been following this since the start.
    Our [April explainer on the storage price surge](https://www.drivevault.io/blog/hard-drive-price-surge-2026.html)
    covered why prices took off. This article is the follow-up everyone keeps asking
    for: when does it end?\n\nWhile you wait, the cheapest terabyte is the one you
    already own. [DriveVault](https://www.drivevault.io/) scans each of your external
    drives once and keeps a searchable catalogue of everything on them, so you can
    see free space, spot duplicate project folders and find old files without plugging
    anything in. For a lot of people that audit pushes the next drive purchase back
    by months, which is exactly what you want when prices are at a record.\n\n**Waiting
    for prices to fall? Use what you have first.** DriveVault catalogues every drive
    you own so you can search them offline, find free space and spot duplicates before
    you buy. \n[Download Free](https://apps.apple.com/us/app/drivevault-offline-catalog/id6751731655?mt=12&platform=mac)\n
    ![DriveVault for macOS cataloguing and searching external hard drives offline](https://cdn.shopify.com/s/files/1/0287/7580/9072/files/Screenshot_2026-08-04_at_12.13.26.png?v=1785842056)\n\nThe
    short answer\n\nSSDs and flash\n\nSecond half of 2027\n\nNAND supply is forecast
    to catch up with demand from mid-2027. Expect a gradual slide, not a crash.\n\nHard
    drives\n\n2028 at the earliest\n\nCapacity is contracted into 2028 and no new
    factories are planned. Relief comes via bigger drives, slowly.\n\n## The Short
    Version\n\n- **Prices are still rising, just more slowly.** A year into the crisis,
    hard drives cost 134% more than in September 2025 and SSDs 129% more, in ComputerBase's
    tracking.\n- **SSDs should turn first.** TrendForce expects the NAND shortage
    to end in the second half of 2027.\n- **Hard drives are booked up.** Seagate has
    most of its data centre capacity allocated into 2028, and neither it nor Western
    Digital is building new factories.\n- **2024 prices are not coming back soon.**
    Contracts now include pricing, and AI demand is still growing.\n- **Need storage
    for work? Buy it.** Buying speculatively? Wait, and favour SSDs, which should
    get cheaper first.\n\n## Where Prices Stand in September 2026\n\nBefore looking
    forward, it helps to be honest about where we are. The German tech site ComputerBase
    has priced the same dozen popular drives every month since mid-September 2025,
    which makes its tracker one of the cleanest before-and-after records of this crisis.
    Its [one-year check, published today](https://www.computerbase.de/news/storage/speicherpreise-im-check-plus-370-prozent-plus-134-prozent-plus-129-prozent-nach-einem-jahr.99425/),
    shows hard drives averaging 134% above their pre-crisis prices, up from 129% a
    month earlier. SSDs are 129% higher, up from 126%. Both are new records.\n\n|
    Drive | Sept 2025 | Sept 2026 | Change |\n| --- | --- | --- | --- |\n| **Seagate
    IronWolf 4TB** (HDD) | €94 | €195 | +108% |\n| **WD Red Plus 8TB** (HDD) | €170
    | €349 | +105% |\n| **Toshiba MG09 18TB** (HDD) | €288 | €858 | +198% |\n| **Seagate
    BarraCuda 24TB** (HDD) | €308 | €804 | +161% |\n| **Kingston NV3 1TB** (SSD) |
    €50 | €144 | +189% |\n| **Samsung 990 Pro 4TB** (SSD) | €285 | €609 | +114% |\n\nSource:
    [ComputerBase price check](https://www.computerbase.de/news/storage/speicherpreise-im-check-plus-370-prozent-plus-134-prozent-plus-129-prozent-nach-einem-jahr.99425/),
    16 September 2026. German retail prices, excluding eBay and Amazon Marketplace
    sellers.\n\nThe pattern in that table matters. The biggest hard drives, the 18TB
    to 24TB models that data centres also buy, have risen fastest. The smaller desktop
    drives most creatives actually use have \"only\" doubled. If you are shopping
    for a [budget external drive](https://www.drivevault.io/blog/best-budget-external-hard-drives-2026.html),
    you are feeling the mild end of this.\n\nThe one encouraging detail: the monthly
    increases have shrunk to a few percentage points. Prices are still climbing, but
    the curve is flattening. That is usually the first stage before a market turns.\n\n##
    Why Hard Drives and SSDs Will Recover at Different Times\n\nMost coverage lumps
    \"storage prices\" together. That hides the most useful part of the answer, because
    hard drives and SSDs are made by different companies, in different factories,
    and sold in different ways.\n\n### SSDs follow the chip market\n\nSSDs are built
    from NAND flash chips made by Samsung, SK hynix, Kioxia, Micron, Sandisk and YMTC.
    Those chips are priced quarter by quarter in contract negotiations, and some trade
    on a spot market that moves weekly. When supply catches up, SSD prices can respond
    within a couple of quarters. They went up fast. They can come down reasonably
    fast too.\n\n### Hard drives follow multi-year contracts\n\nHard drives come from
    essentially two companies, Seagate and Western Digital, with Toshiba a distant
    third. Almost all of their output now goes to cloud providers on long-term agreements.
    Those agreements lock in volume and, crucially, price for years at a time. That
    is why hard drive prices rose later and more steadily than SSDs, and it is why
    they will be slower to fall.\n\n![Photographer offloading footage from a camera
    to a portable SSD on a laptop](https://images.unsplash.com/photo-1602526211905-6adc54adb8d2?auto=format&fit=crop&w=1600&q=80)\n_Portable
    SSDs are built on the same NAND flash that AI servers consume, so they are tied
    to the chip cycle. Photo: Samsung Memory on Unsplash._\n\n## The SSD Timeline:
    What the Analysts Say\n\nTrendForce is the most widely cited memory pricing firm,
    and its forecasts have been the best guide through this cycle. Here is how its
    view has shifted during 2026.\n\nAt the start of the year, it was forecasting
    [NAND contract prices rising 33 to 38% in a single quarter](https://www.trendforce.com/presscenter/news/20260105-12860.html),
    with client SSDs rising at least 40% as suppliers moved capacity to data centre
    drives. By July the tone had changed. Its third-quarter survey forecast a [much
    smaller 10 to 15% rise for NAND](https://www.trendforce.com/presscenter/news/20260703-13134.html),
    and said plainly that PC and smartphone makers had hit the limit of what they
    could afford to pay.\n\nThen came the forecast that actually answers the question.
    In its July NAND update, TrendForce said the market would run a [4 to 5% supply
    deficit through 2026, then move back into balance in the second half of 2027](https://www.trendforce.com/presscenter/news/20260721-13148.html).
    The reasons it gives are ordinary ones: manufacturers squeezing more bits out
    of existing fabs, steady output growth, and consumer demand staying weak because
    everything costs so much. It expects notebook shipments to fall around 10% this
    year and shrink again in 2027.\n\nNew supply is also arriving from China. YMTC
    reached [around 14% of global NAND shipments in the second quarter](https://www.tomshardware.com/pc-components/dram/chinas-ymtc-aims-to-become-the-worlds-largest-nand-maker-by-the-end-of-2027)
    and has told investors it wants to be the world's largest NAND maker by the end
    of 2027, backed by a planned $4.9 billion share listing. Even if it falls short
    of that target, that much extra flash entering the market is exactly the kind
    of pressure that pushes SSD prices down.\n\n**Balance is not the same as cheap.**
    TrendForce also warns that"
