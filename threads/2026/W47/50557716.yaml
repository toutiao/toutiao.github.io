  author: qlte
  text: This seems to misunderstood what a &quot;bubble&quot; is. A bubble does not
    nean that the underlying product is all fake&#x2F;hype&#x2F;useless&#x2F;etc.
    In fact, some of the most famous economic bubbles in history formed <i>because</i>
    the underlying technology was so obviously revolutionary.<p>Railroad Mania in
    the UK began in the first years of a gigantic effort to build railroad routes
    across the country. 20 years later, there were indeed thousands of miles of railroads
    built throughout Britain and had reshaped society just as had been predicted.<p>But
    the initial wave of enthusiasm and investments to capture value from speculative
    railroad route contracts still led to many people losing a lot of money after
    the bubble popped and contracts for routes were cancelled left and right. The
    railroad build out continued afterwards, but not in the exact way investors had
    been betting on.
