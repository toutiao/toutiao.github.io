  author: glenstein
  text: Can we count mammals and corvids separately if their common ancestor was already
    set on the path to intelligence? The amazing book Other Minds by Peter Godfrey
    Smith hinges it&#x27;s argument on minds evolving <i>twice</i>, on the fact that
    the common ancestor of humans and octopi was probably a simple worm-like creature
    that had little or nothing in the way of a brain or consciousness.<p>I have to
    imagine that corvids and mammals had a common ancestor with more working brain
    structure. Though maybe you can make the case that &quot;intelligence&quot; showing
    up later on isn&#x27;t the same thing as simply having a brain.<p>But it&#x27;s
    much more impressive to me that there&#x27;s convergent evolution from brainless
    to brain-having, than from brains to intelligent brains. Don&#x27;t get me wrong,
    it&#x27;s still awesome but doesn&#x27;t feel like an out of nowhere path for
    natural selection to take.
  score: 0
