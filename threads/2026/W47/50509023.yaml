  author: tsimionescu
  text: A very important fact to remember is that brains are not a requirement for
    intelligence (in the very broadest sense, not the more specific one used here),
    nor even neurons. All cells have some amount of computational power and can meaningfully
    react to their environment; a common example is white blood cells quickly adapting
    to pathogens to try to destroy them. Networks of cells are even more powerful,
    such as slime mould exploring the space around it until it detects nutrients and
    then channeling all resources in the direction of such nutrients. Plant roots
    have sophisticated sensory abilities detecting numerous kinds of chemicals in
    the soil, and actively search for nutrients and avoid contaminants. Even jellyfish,
    some of the simplest animals, long thought to be essentially passive, in fact
    detect and actively steer themselves towards prey.<p>Intelligence actually exists
    at all levels of life, and brains are just an apex of achievement, just like eyes
    are an apex achievement of light-sensing mechanisms that similarly exist all around
    the tree of life.
  score: 0
