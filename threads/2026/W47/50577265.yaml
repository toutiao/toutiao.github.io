  author: im3w1l
  text: I think we have to be careful how we use &quot;well aligned&quot; so that
    it doesn&#x27;t turn into &quot;no true scotsman&quot;. Let&#x27;s assume that
    a well aligned model will try its best to follow our values, given the knowledge
    it has. If we imagine a porcelain vase it will try its best not to knock it over,
    but if the floor is slippery it may still happen.<p>We can say then that a well
    aligned model will not try to bypass its restrictions by editing its own weights.
    But it may still accidentally disable them.
