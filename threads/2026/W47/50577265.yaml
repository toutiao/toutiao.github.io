  author: tb99
  text: It&#x27;s also interesting to look at how the agent does the fix. Appendix
    E5 shows what it&#x27;s doing:<p>- Find a common category of error (too many tokens).<p>-
    Calculate aggregated difference between states in examples in that error category
    and other examples.<p>- Update weights to push states along that difference direction
    toward the non-error states.<p>In other words, deprived of gradient descent as
    a tool, it approximates it. It&#x27;s clever, and it&#x27;s a neat experiment.
    It doesn&#x27;t show any superhuman insight into its weights -- with the same
    constraints, a human would likely take a similar approach. But it&#x27;s early
    days for self modification and it will be interesting to see if models get a deeper
    understanding of weights as they get smarter.
