  author: ozgung
  text: |-
    I have been working on weight-space-programming as a side project since the blog post. Here is what I understand:<p>- We normally train deep neural networks with back-propagation. We compute gradients to find out how to tweak the weights toward the desired output.<p>- That&#x27;s a fixed recipe. And it&#x27;s not the only way to tweak the weights. It&#x27;s just the best one that works in scale. The brain, for instance, does not do back-propagation, as far as we know.<p>- There are other known mathematical methods (mostly from Linear Algebra) to analyze the activations and compute what weights to change and how, to push the output to the desired way.<p>- A sufficiently advanced LLM knows about these methods and can analyze data like activation maps. With a specific target in hand, it can combine them into new constructions. (see [2] for some of the methods they used and I collected in a repo)<p>- So it&#x27;s not a fixed training for-loop anymore. It&#x27;s a dynamic &quot;training&quot; iteration. The LLM looks at the model&#x27;s outputs, reads some of its layers on chosen inputs, computes an edit, applies it and tests it.<p>- It&#x27;s dynamic because LLM chooses that to do and how to do it at each iteration by reasoning. I think that&#x27;s the most interesting part and could be a new paradigm.<p>- I also compared it with gradient training. On my target, training was better (details in [1]), but WSP can find its niche. Its biggest advantage is that it needs no backward pass: less memory, and the model only has to run inference. It needs no differentiable loss, it can enforce constraints directly instead of through a penalty term, and the edit is easier to interpret.<p>[1] <a href="https:&#x2F;&#x2F;medium.com&#x2F;@ozgungenc&#x2F;weight-space-programming-on-a-real-coding-agent-what-worked-what-didnt-52723245d623" rel="nofollow">https:&#x2F;&#x2F;medium.com&#x2F;@ozgungenc&#x2F;weight-space-programming-on-a-...</a>
    [2] <a href="https:&#x2F;&#x2F;github.com&#x2F;ozgung&#x2F;weightprog&#x2F;blob&#x2F;main&#x2F;docs&#x2F;methods.md" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;ozgung&#x2F;weightprog&#x2F;blob&#x2F;main&#x2F;docs&#x2F;methods....</a>
