    were even possible. Think of it in terms of latent space - at some point the model
    has come up with as optimal a representation of the “truth” of the universe as
    it’s ever going to get with its current weights and structure (ie global optimum).
    Tweaking weights from there only decreases performance. If you did this job right
    you found this optimum during training.<p>True self-modification that’s interesting
    would need to be able to incrementally update the structure or alter the dimensionality.<p>Now
