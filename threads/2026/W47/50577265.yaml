  author: MrMetric
  text: 'I believe the intended analogy is something like: Training on highly blurred
    or degraded images, with the baseline targets also being malformed but not as
    badly. Then, run the result on those baseline images and see if we get something
    better than any image we currently know how to capture.<p>With LLM-based AIs,
    we don&#x27;t actually have any ground-truth oracle for maximum-quality examples.
    We don&#x27;t even know how to measure <i>relative</i> quality accurately, and
    even if we did, different people disagree anyway. For example, a corporation may
    want their AI to be &quot;aligned&quot;, like how older versions of ChatGPT claimed
    large language models can&#x27;t do math (lol), or how Claude won&#x27;t tell
    you how to make thermite even though it&#x27;s widespread knowledge and you can
    get it from Wikipedia. Maybe <i>you</i> don&#x27;t want that kind of behavior.
    And maybe your friend just wants an AI that&#x27;s really good at ERP and doesn&#x27;t
    care how well it can do math.<p>But even if we can&#x27;t measure quality, we
    <i>can</i> attempt to break things and use the broken sample as a training target
