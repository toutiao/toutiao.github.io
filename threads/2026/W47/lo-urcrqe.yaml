  content: "![Avatar](/assets/mbacface-144.webp)\nPosts of varying effort on technology,
    cybersecurity, transhumanism, rationalism, self-improvement, DIY, and other stereotypical
    technologist stuff.\n\n# Janet Reno was talking about my friend Coolio (computer
    criminal)\n\n[war stories](/tag/war-stories/)[hacking](/tag/hacking/)[irc](/tag/irc/)[ddos](/tag/ddos/)\n\n
    Published on 16 Nov 2026 by mbacarella \n\nA war story from EFNet #goonies: the
    February 2000 DDoS attacks on Yahoo, eBay and buy.com, the teenager who launched
    them, and what happened to him afterwards\n\nAI disclosure: this story was written
    entirely by human hands, with AI doing proof-reading and light edits.\n\nNo, not
    the rapper Coolio, but rather [Dennis M. Moran](https://en.wikipedia.org/wiki/Dennis_Moran_%28computer_criminal%29).
    No dishonor intended for the real[Coolio](https://en.wikipedia.org/wiki/Coolio),
    the rapper, though arguably mine was harder.\n\nThere I was, standing on the couch
    in my basement, pointing at the TV. Janet Reno is giving a press conference on
    CNN, vowing to bring these cyber terrorists to justice. My jaw is open, I’m laughing.
    I can’t believe it. She’s talking about my friend Dennis “Coolio” Moran, a 17-year-old.\n\nBut
    let’s back up.\n\nWe were the #goonies on EFNet. We broke off from #doom, following
    our friend chunkk, the [legendary Doom player](https://www.doom2.net/history/history.html)
    (I still haven’t seen The Goonies movie though). Some of these people are still
    very close friends and at the time they were much closer friends than anyone I
    had IRL since they were computer elite and my local friends were all llamas. Above
    all, we were still very teenage and very dumb.\n\nThey were fond of robotripping,
    since it was all the drugs teenagers could afford. As a suburban kid from Queens
    from a loving supportive family I knew drugs were bad and would sit this stuff
    out. I had a job at a dialup ISP in Manhattan called nyct.net as a FreeBSD sys
    admin. I was moving up in the world.\n\nOthers, not so much. The most extreme
    robotripper and psychonaut on #goonies was Coolio. He was also a lot of fun. He
    basically never spoke ill of anyone. Everyone loved him. Girls would fall for
    him just watching him say stuff on IRC over my shoulder.\n\nHe was also the poorest
    friend I’ve ever had. He grew up in Wolfeboro, New Hampshire. His mom wasn’t in
    his life and his dad was, as far as I knew, a decent fellow, though they struggled
    to make ends meet and he had lived out of a tent for a period of his life. People
    mostly sort their friends and they get a picture of the world that’s very curated.
    Dennis (and indeed the rest of IRC) was my window out of my Queens NY bubble.\n\nWe
    did eventually hang out IRL. Dennis came to visit me in NYC and we went to Mindless
    Self Indulgence shows together, which were insanely fun. After one of them the
    (freakishly tall) lead singer Little Jimmy Urine was offering kisses for $5 (“VD
    free”). Dennis offered $20 over the heads of a bunch of clawing girls and he and
    Jimmy Urine made out.\n\nWhen he wasn’t talking about drugs or girls, he was talking
    about hacking. We were all dabbling in computer stuff. We loved Doom and Quake
    and we had aspirations about becoming game developers. I bought a book on C and
    installed DJGPP and was trying my best to learn, but lost interest in games and
    pivoted to networks and coding on Linux. And also hacking. Though it had been
    out for years, I had just caught up with that Phrack article about Smashing the
    Stack for Fun and Profit and was curious about how to apply it. Dennis was interested
    too, and we thought about how cool it’d be to write a PoC exploit together.\n\nDennis
    found out about a BIND vulnerability with no PoC. We wrote one together. It worked!
    We were pumped. I thought we should promote internet health by publishing the
    PoC, since that was how you got people to fix bugs in those days. Dennis goes
    quiet for a few days. Then he comes back. Bro had been busy, he hacked into all
    of the vulnerable servers and recruited them into an insane botnet. I was shocked.
    WTF was he going to do with this? I thought we were just learning and there he
    goes hacking into half of the DNS servers on the internet! At least he patched
    BIND for them afterwards.\n\nDennis reads about the [CD Universe extortion attempt](https://time.com/archive/6740163/extortion-on-the-internet)
    and sees a business idea. What if he combines his botnet with [smurfing](https://en.wikipedia.org/wiki/Smurf_attack)
    to do massive DDoS attacks? Then he could threaten to knock sites offline if they
    didn’t pay. I thought this sounded crazy but he insisted on trying. His reasoning
    was you can’t just cold email executives out of nowhere and try to extort them.
    You gotta build up a reputation first. So he flexed his muscle and took down Yahoo!\n\nHe
    would say “watch this” and the sites would go down. First Yahoo, then buy.com
    and eBay, then etrade.com.\n\nHe picked buy.com because it was the day of their
    IPO. What better way to show his power than ruin a company during the dot com
    bubble on their IPO day.\n\nIn our teenage chat room this all made sense. Like
    a lot of teenagers (and adults), Dennis thought wealth was often illegitimately
    acquired, and that it was only fair to take from the rich in the bullshit days
    of the dot com bubble. Thug life, kind of. Definitely worked on the girls, which
    was probably not healthy for him.\n\nTo learn more about his views on wealth maybe
    we should go back to Wolfeboro. I visited twice, once while he was in jail and
    once just to hang out and party, and it was absolutely nothing like where I was
    from in Queens. According to Google it’s a small town of 6,000 known as being
    full of lakefront summer homes. The part I saw was very much not summer homes.
    It was houses in the sticks. The rich, such as Mitt Romney, were vacationing in
    his town while his family was, at times, living in a tent.\n\nWhich brings us
    back to the basement. I’m standing on the couch, pointing at Janet Reno on the
    TV, laughing. She says they’ll find whoever did this. I know who did this. I know
    what he used, too, because I helped write it. Are we all going to jail??\n\nDennis
    wasn’t done though. He had previously rooted DNS servers and defaced [dare.com](https://attrition.org/mirror/attrition/1999/11/14/www.dare.com/)
    and [cwc.gov](https://attrition.org/mirror/attrition/1999/11/14/www.cwc.gov/),
    but took the opportunity to deface [rsa.com](https://attrition.org/mirror/attrition/2000/02/12/www.rsa.com/)
    after the DDoS attacks. He did recruit his friends on IRC to help him write ad
    copy for the defacements. I am sad to admit some of those are my words.\n\nHe
    was especially tickled by defacing RSA since they had just put out a press release
    advertising that they could help defend against his DDoS attacks. Rekt.\n\nThis
    played out over the course of a couple of days. Being teenagers on IRC, we didn’t
    exactly all keep his secret.\n\nWe were “infiltrated” by an assistant security
    officer at Stanford named David Brumley. He came on calling himself “aforce” and
    he reeked of How Do You Do Fellow Kids energy, but it still took us way too long
    to kick him out. It was all for naught anyway: he was tapping the ircd at Stanford,
    an EFNet server, and could read absolutely everything, private messages included.
    Coming into the channel was probably just to provoke us into revealing even more.
    Oh, uh, it also didn’t help that Dennis’s RSA defacement specifically taunted
    aforce, which directly linked someone in #goonies to the crime.\n\nOnce word got
    out that US digital infrastructure was being brought to its knees by a robotripping
    17-year-old, the intensity died down. They ultimately did arrest Dennis, and showed
    him a thick stack of IRC logs of teenagers bullshitting, which is as hilarious
    as it sounds. He admitted to defacing the web sites, and to getting into Army
    and Air Force computers at four military bases, but denied launching the DDoS
    attacks.\n\nAs it turned out, we were not all going to jail. Nothing happened
    to me. N"
