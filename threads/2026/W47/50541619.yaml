  text: 'I used Illumina&#x27;s Understanding Your Genome.  It was basically a marketing
    tool they had to convince execs across medical industry to use Illumina sequencers
    in a medical context.  You&#x27;d fly to San Diego, stay in a nice spa resort,
    get an iPad with the BAM file with your genome, a viewer app, and chat with genetic
    counsellors.  I know enough about genomics and health that I was really interesting
    to see if they could tell me anything about my health that I could act on.  Instead,
    they said I did not have a single mutation (variant) that was associated with
    a known disease&#x2F;genome relationship (at the time, 2014, there was far less
    information, but BRCA and APOE1 and a number of other variants associated with
    diseases were known).  The more I looked into how the counselors work, the less
    confident I was in their process (&quot;when we see a variant that isn&#x27;t
    in the database, we google it and skim recent papers&quot;).<p>As for privacy:
    I didn&#x27;t.  I uploaded my genome to PGP (Personal Genome Project)- I just
    noticed their website doesn&#x27;t seem to work anymore, and a few minutes of
    Googling suggest it is no longer easy to obtain (I kept a copy).  I also posted
    a link to HN (12 years ago) which makes it pretty easy to identify me.  I weighed
    the facts about genomes, identity, and health, and concluded that attempting to
    hide my genomics sequence was not an effective strategy.<p>As for you doing it,
    I honestly don&#x27;t know.  If your goal is to understand your disease (or diagnose
    yourself), genomic data is unlikely to provide you with anything accurate and&#x2F;or
    actionable.  Sorry I can&#x27;t be more optimistic- with some notable exceptions,
    genomic data is really not that useful for health insights.'
