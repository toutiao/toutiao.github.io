  author: tstactplsignore
  text: It is a negative control in the experiment. Shuffling is a better control
    than random because it accounts for the raw rates of amino acids in each protein.
    For example W is very rare, so Claude could beat a truly random generator just
    by guessing not W. But the signal seen on real sequences is much stronger than
    that, so it tells you that Claude is doing something more than just guessing &#x27;not
    W&#x27; on real sequences.
