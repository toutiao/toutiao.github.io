  author: spwa4
  text: 'DNA is a language, or at least a protocol. Just a <i>very</i> difficult one.
    All meaning is locked up in the shape of the Lennard-Jones 12-6 magnetic flux
    isosurface that is generated when you string the letters together from amino-acids.
    Probably justified to call that a bit more indirect than English.<p>And electrostatic
    interactions.<p>And some methylation.<p>And some phosphorisation (but now we&#x27;re
    getting deep into somewhat rare grammar)<p>Yeah, DNA is a language that is <i>way</i>
    too complicated for human minds to understand, although plenty of humans &quot;get
    the gist&quot; so to speak after looking at it for a few hours, but ... here&#x27;s
    some bad news: it&#x27;s only somewhat too complicated for LLMs. So why wouldn&#x27;t
    you train LLMs on them? Frankly, it&#x27;s the one language we have &quot;texts&quot;
    from that is actually difficult to understand for LLMs and ... well, it&#x27;s
    definitely improving their understanding.<p>(also we have quite a bit of DNA text
    that isn&#x27;t from the internet or books, it&#x27;s freely downloadable and
    unlike everything else LLM companies steal, actually not covered by copyright)'
