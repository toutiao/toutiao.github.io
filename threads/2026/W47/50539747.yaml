  author: xp84
  text: 'I support anyone’s noble attempts to avoid loss of information, and these
    forums do at least track the long history of reported issues with Apple products,
    so, good for them.<p>But if ever there was a more frustrating support forum, this
    one was it.<p>Only Apple could pull off something so audacious: hosting a support
    forum with zero paid representatives present, while still having almost every
    thread feature one or more responses written in a corporate tone that deliver
    the Apple talking points (and if necessary, even dismissing the user’s problem
    as a skill issue or a matter of opinion, rather than an egregious design flaw
    or bug).<p>All done by people so devoted to Apple that they perform this labor
    for decades without any form of compensation. Not even like coupons or something.
    I’ve been astounded by it since my first visit.'
