  author: wackget
  text: On one hand I deeply understand the desire to archive the years of human effort
    which went into asking and answering forum posts.<p>On the other hand, Apple should
    have voluntarily done the archiving. Predictably they didn&#x27;t and wouldn&#x27;t,
    because the only single thing these companies care about is profit and everything
    else can happily go to shit.<p>In a just world, Apple&#x27;s refusal to spend
    the absolutely miniscule amount of effort to archive the forum themselves would
    earn them a massive reputational stain and they&#x27;d face an enormous backlash
    for effectively spitting on the very people who allow them to exist.<p>That won&#x27;t
    happen, because consumers simply don&#x27;t care. Corporations have proven time
    and time again that consumers will tolerate - or even celebrate - being trampled
    upon as long as their new shiny baubles make them feel superior in some way.<p>It
    is a travesty that Apple&#x27;s support forum was created virtually exclusively
    by volunteers, and it&#x27;s a travesty that it&#x27;s up to other volunteers
    to ensure its ongoing survival.<p>Fuck Apple, squarely and truly and wholeheartedly.
    Fuck Apple.
