  author: jkhdigital
  text: 'I am of the opinion that even if this novel architecture doesn’t yield dramatic
    improvements in peak performance across broad classes of workloads, it may still
    be a welcome improvement in the legibility of software performance down the stack.<p>By
    this I mean: currently, transforming a program written in a typical high-level
    language to optimized ISA code involves what can only be described as black magic
    inside the compiler. If you don’t know the implementation details of modern superscalar
    OOO branch-predicting microarchitectures then you may have no clue why two very
    similar-looking functions could have dramatically different running times. Cue
    Matt Godbolt tech talk…<p>What I see as the more promising side of this type of
    development is a tighter coherence, and thus more transparency in expected runtime
    performance, between the software above the ISA and the hardware below it. Essentially
    we now have a linear machine with a linear source language, and with the popularity
    of Rust nowadays we actually have a critical mass of developers who are already
    used to applying ownership discipline in program design.'
