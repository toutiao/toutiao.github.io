  author: adrian_b
  text: The performance per watt of very slow CPUs is always very good, so that alone
    is not impressive unless much more data is provided to prove that is really better
    than what is typical.<p>On the other hand, the performance per area of the &quot;traditional&quot;
    CPU that is used for comparison, which I assume that it is some kind of RISC-V,
    is very poor, so that the performance per area of the new CPU is likely to be
    also poor, even if much better than that of the strawman.<p>Their &quot;traditional&quot;
    CPU has an area that is slightly bigger than that of Cortex-A720 made with a CMOS
    process almost twice as dense.<p>So if they were made with the same process, the
    &quot;traditional&quot; CPU and the new CPU would have an area somewhat bigger
    than a half of a Cortex-A720.<p>But Cortex-A720 is an out-of-order 4-wide superscalar
    core with advanced SIMD and scalable vector extensions, with a good branch predictor
    and with many other enhancements, for which the area ratio in the same process
    is expected to be much greater than 2 in comparison with the CPUs evaluated in
    TFA, while its performance must be several times greater than that of a 2-wide
    in-order CPU core.<p>So both the &quot;traditional&quot; CPU and the Frostbite
    CPU appear to have a much bigger area than expected for their performance.<p>Moreover,
    the performance of in-order CPUs is very sensitive to the benchmark selection
    and to the quality of the compiler optimizations.<p>So the performance obtained
    for the benchmarks selected by them, like FFT or LU decomposition, is expected
    to be much better than for benchmarks that would execute an application not dominated
    by such regular loops, but having lots of hard to predict branches, e.g. a compiler
    benchmark.<p>They say that the ISA will be published. At that time it will be
    easier to appreciate whether this CPU architecture is really innovative. For now,
    they have done a lot of work, by fully implementing the CPU core, but the data
    presented is not sufficiently convincing to demonstrate that it is indeed an architecture
    that will be able to compete with SOTA CPU cores, e.g. with those from the Arm
    company.
