  text: It is. In a sense it&#x27;s very similar to magic.<p>It&#x27;s a marvel that
    you can download a 12Gb file that&#x27;s basically a neural net smart enough to
    discuss any age of history, identify photos, etc, on a local chip - all in the
    space of 3 or 4 high res movie files.<p>That shouldn&#x27;t be possible; it means
    that we&#x27;ve found ways to <i>compress</i> knowledge into spaces smaller than
    logic would indicate we should able to, and now we have these tiny brains we can
    take around with us on a laptop that can recite history. When I was a kid there
    was an electronic encyclopedia you could buy, with condensed articles, and maybe
    a few megabytes of memory, and that was kind of &quot;magic&quot;  ...it made
    me think of Hari Seldon, or the Hitchhiker&#x27;s Guide.<p>I&#x27;m not sold on
