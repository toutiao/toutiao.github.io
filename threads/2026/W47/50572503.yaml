  author: kragen
  text: The second paragraph of the linked page contains their first performance claim.  It
    reads:<p>&gt; <i>On a set of 25 initially chosen workloads, including 15 held
    out until the final evaluation, we achieved a 4.59x performance-per-watt multiple
    when compared to a modern, silicon-proven superscalar (dual-issue, in-order) CPU
    core.</i><p>They do start claiming performance per area in the following paragraph,
    but that&#x27;s not an interesting claim for a couple of different reasons:<p>-
    As I said above, MISC designs get dramatically better performance per area than
    any mainstream CPU.<p>- We&#x27;re already in the dark-silicon era, where even
    the relatively low performance-per-area designs used in laptops and cellphones
    must thermally throttle on a regular basis to avoid burning themselves up, and
    contain many specialized accelerators used only a small fraction of the time (AES-NI,
    AVX-512, saturating 8-bit arithmetic, popcount, etc.) instead of additional small
    general-purpose cores that could run all the time.<p>Their claims would be a lot
    more interesting if they provided some kind of absolute numbers to compare against.
