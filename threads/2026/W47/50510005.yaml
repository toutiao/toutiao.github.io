    trade dates, purchases did −1.5%. No group of purchases (by party, size, account
    or disclosure delay) did clearly better than the index.<p>Not what you would have
    guessed, given that the topic was inspiring enough to make one person ask AI to
    vibe code a website to present the info. But negative results are results too
    and deserve to be reported.<p>Edit: Actually this is more fascinating than I originally
    thought. All the the abstracts for ALL of the &quot;research&quot; pages are finding
    no benefit! Everything on the site is carefully worded, included lots of language
    about &quot;even when it doesn&#x27;t prove anything&quot; as a mark of transparency.
    But <i>all</i> the abstracts of <i>all</i> the research find zero advantage from
    insider stock purchases. And nobody on the report card shows an advantage either.
    It&#x27;s still a perfectly legitimate thing for the site to be analyzing but
    hard not to notice that a site which would seem to be motivated by the possibility
    of identifying performance advantages is comprehensively <i>not</i> finding any.'
