  author: hunterpayne
  text: The way this data is presented and analyzed is pretty weird.  Normally, you
    measure investments by total dollar amounts.  This measures each trade equally
    with outliers excluded (by using median instead of mean).  These disclosures cover
    all trades, not necessarily trades with &quot;insider knowledge&quot;.  So this
    methodology is the same I would design to hide a small number of large &quot;insider
    trades&quot; inside a much larger body of &quot;non-insider&quot; trades.  It
    would be expected for that this second body of trades to be pretty bad (most people&#x27;s
    are).  And they are excluding the big paydays from insider knowledge and watering
    down their effects again a larger body of smaller regular trades.<p>Basically,
    this report is designed to hide the actual effect of insider trading.  It should
    also be noted that when a campaign ends, any money left over goes to the politician.  Finally,
    it should be noted that the net worth of people in Congress seems to go up on
    average by surprising degrees (say 10x or more of their base pay).  How much comes
    from each which type of windfall, its hard to say.
