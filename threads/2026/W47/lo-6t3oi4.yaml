    Thanks for the thoughtful response, but I am a bit dismayed that the take-away from the post was that Rust is too hard for humans. That wasn't my meaning at all.
    I think it is beyond dispute that Swift is an easier language than Rust, just like I think it is beyond dispute that Java is an easier language than C++. By "easy", I don't mean that Swift and Java are for dummies and Rust and C++ are for the rarefied elite. Rather, I think that Java and Swift make it easy to get stuff done without needing to struggle with difficult concepts and spend a lot of time learning. There is a reason why CS curriculums switched to Java for decades over demonstrably superior languages: it fast-tracks the route to tackling essential complexity without getting bogged down in the accidental complexity.
    If the take-away was "use Rust because you can just get the chatbots to vipe-slop it all for you", then I clearly wasn't communicating very effectively. No one should be creating software without understanding the code. Seriously, don't be this guy. I'll be following up with a heartfelt apology to any and all who interpreted my words as advocacy of that brand of (sadly, all-to-common these days) solipsism.
