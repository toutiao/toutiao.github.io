    Swift does the same things you describe, and with a lot less annoying boilerplate like “return Ok(…)” and “.map(…)” and the horrors of dealing with futures. It is So. Much. Easier. To write code with the exact same semantics.
    Rust people seem to disdain such ergonomics because they want every last detail to be expressed explicitly in code, like when you pass a reference or return an optional or clone a struct. Yes, the code doesn’t hide what’s going on (except for the “?” operator, or Deref conversions), but it is such a pain in the ass to keep writing that stuff, and to filter the meaning out of the noise when rereading code.
    The problem is that Swift sometimes has extra overhead in the machine code it generates, usually in the form of extra copying. So it’s not going to be 100% as fast or small as Rust. Honestly I’d take easier over as-fast-as-possible, except maybe in some inner loops, but that’s not a choice I get except by switching languages (which I did, to Rust, unwillingly.)
    The big problem with Swift is that it implicitly depends on a really big standard library — largely because of its overdesigned string API — and while that library can be swept under the rug on Apple platforms because it ships in the OS, other platforms don’t have that advantage, so when you build for those platforms you suddenly find your binary size jumps by 10 or 20 megabytes. (Not exaggerating.)
    (Another contributing factor is that some things about reflection apparently make it impossible to effectively dead-strip unused code, as I found out when Bloaty showed that my release-mode binary contained everything from the huge AsyncCollections (sp?) package even though I only used one or two bits of it.)
