    Some thoughts as a young programmer:
    I love Rust, and have for most of my programming career, so I rebuke the idea that Rust is too complex for humans. Its been stable for just over 11 years. People have been writing great software in Rust, with their monkey brains and meat fingers, for over half of my life, and many continue to do so.
    Actually, in my view, Rust has always been a particularly human-friendly language since it moves so many assumptions and invariants out of your brain and into the code where the compiler can prove them for you. Once you know the rules of Rust, there's a lot less mental load in understanding code because so much is guaranteed to you by the compiler. In fact, LLMs are only so good at writing Rust for these same reasons.
