  content: "This article explains how Elixir implements type inference and type narrowing
    using reverse arrows: a small set of composable ideas, rather than special cases
    hardcoded into the type checker.\n\nThanks to this work, the upcoming Elixir v1.21
    passes all tests in the[If-T: Type Narrowing Benchmark by Guo et al.](https://github.com/utahplt/ifT-benchmark).
    This means v1.21 can find even more sure bugs in existing Elixir programs and,
    once type signatures are introduced, narrowing will give us more precise types
    and fewer false positives.\n\n> The type system was made possible thanks to a
    partnership between [CNRS](https://www.cnrs.fr/)and [Remote](https://remote.com/).
    The development work is currently sponsored by[Fresha](https://www.fresha.com/),
    [Supermethod](https://www.supermethod.com/) and[Dashbit](https://dashbit.co/).\n\n##
    Type inference\n\nElixir performs type inference by refining the dynamic type.
    This is quite different from how inference and gradual typing are implemented
    in most type systems, so let’s break it down.\n\nIn many gradual languages, the
    dynamic type, often known as `any`, is a “black box” and can be used in any context.
    For example, imagine this Elixir function, where `x` starts with type `dynamic()`,
    as there is no type signature:\n\n    def using_x_as_number_and_binary(x) do\n
    \     IO.puts x * 2\n      IO.puts byte_size(x)\n      :ok\n    end\n\nThe program
    above uses `x` both as a number (more precisely, as `integer() or float()`in `x
    * 2`) and as a bitstring in `byte_size(x)`. In some gradual type systems, the
    type checker will accept the program above, even though it will crash at runtime,
    because the dynamic type can be used in any context.\n\nHowever, in Elixir, the
    `dynamic()` type can be refined, and the above will report the following typing
    violation:\n\n    warning: incompatible types given to Kernel.byte_size/1:\n    \n
    \       byte_size(x)\n    \n    given types:\n    \n        dynamic(float() or
    integer())\n    \n    but expected one of:\n    \n        bitstring()\n    \n
    \   where \"x\" was given the type:\n    \n        # type: dynamic(float() or
    integer())\n        # from: iex:3\n        x * 2\n    \n    └─ iex:4: Foo.using_x_as_number_and_binary/1\n\nAs
    you can see in the error message, Elixir infers that the type of `x` after`x *
    2` is a `dynamic(float() or integer())`. This means that `x` can be given to any
    function that accepts at least one of `float()` or `integer()`. However, because
    `byte_size(x)` expects a bitstring, we have a typing violation.\n\nThis is possible
    because `dynamic()` in Elixir actually means `dynamic(term())`, where `term()`
    is the top type. Then, as a variable is used throughout the code, its dynamic
    type is refined by intersecting its type with the arguments of the functions the
    code invokes. In other words, we go through the following steps:\n\n1. `x` starts
    as `dynamic(term())`\n\n2. `x` is given to `x * 2`. The left operand of `*` expects
    `integer() or float()`, which we then intersect with `term()`, and therefore `x`
    gains the type`dynamic(integer() or float())`\n\n3. `x` is given to `byte_size(x)`,
    which expects a bitstring. The intersection of `integer() or float()` with `bitstring()`
    is empty, which will lead to a typing violation\n\nNow, let’s take a look at this
    program:\n\n    def using_x_as_integer(x) do\n      IO.puts x * 2\n      IO.puts
    rem(x, 2)\n      :ok\n    end\n\nThis time, we pass `x` to the remainder function,
    `rem`, which expects all of its inputs to be integers. This means that, at the
    end of this function, Elixir will correctly infer that `x` can only be an integer,
    because `x` was refined from`dynamic(term())` to `dynamic(integer() or float())`
    and then only to `dynamic(integer())`. The inferred type for `using_x_as_integer`
    is a function, commonly written using the arrow notation: `dynamic(integer())
    -> :ok`.\n\nThe best part is that all dynamic types in Elixir are refined and
    therefore the type system is always doing its best to find bugs, even in the presence
    of dynamism. And the refinement itself is often quite precise, thanks to reverse
    arrows, which we will explore next.\n\n## Reverse arrows\n\nAn arrow is the type
    of a function: `integer() -> boolean()` is an arrow that says “given an integer,
    this function returns a boolean”. The type on the left of the arrow is its domain
    (what it accepts) and the type on the right is its codomain (what it returns).
    Every function has arrows, whether they come from a type signature you wrote or
    are inferred by Elixir from the function’s clauses.\n\nFunctions in Elixir can
    be typed with multiple arrows. As an exercise, let’s take a function that negates
    numbers, such as `negate(1)` returning `-1`:\n\n    def negate(number) when is_integer(number),
    do: 0 - number\n    def negate(number) when is_float(number), do: 0.0 - number\n\nYou
    could give it this type signature with a single arrow:\n\n    $ integer() or float()
    -> integer() or float()\n    def negate(number)\n\nHowever, this type says that,
    if you give it an integer, it may return a float, which is never the case! This
    signature is too broad. Instead, we could give it this signature with two arrows:\n\n
    \   $ integer() -> integer()\n    $ float() -> float()\n    def negate(number)\n\nThis
    precisely captures that, if you give it an integer, it returns an integer. If
    you give it a float, it returns a float. Multiple arrows are an excellent way
    to type functions with multiple clauses, which are common in both Erlang and Elixir.\n\nWith
    this in mind, and remembering that `rem` only works on integers (its type is`integer(),
    integer() -> integer()`), what do you believe is the inferred type of`x` in the
    function below?\n\n    def negated_remainder(x), do: rem(negate(x), 2)\n\nYou
    may think `x` is `dynamic(integer() or float())`, because that’s the domain of`negate`.
    However, `x` will once again be inferred to be `dynamic(integer())`, because Elixir
    propagates types through the arrows in reverse: it starts from what the outermost
    call expects and walks inwards, from results to arguments, until it reaches the
    variables. Let’s break it down.\n\n1. We start type checking the function and
    we find `rem(negate(x), 2)`. `rem` has a single arrow, `integer(), integer() ->
    integer()`, so we know that `negate(x)`must return an `integer()` for this to
    type check\n\n2. Now we type check `negate(x)`. `negate` has two arrows: `integer()
    -> integer()`and `float() -> float()`. Since its result must be an integer, we
    can discard the `float() -> float()` arrow, as it never returns an integer. The
    only remaining arrow is `integer() -> integer()`, so the argument of `negate`
    must be `integer()`\n\n3. Now we type check `x` itself. `x` starts with the type
    `dynamic(term())`. We then intersect it with `integer()`, resulting in `dynamic(integer())`\n\nIn
    other words, inference goes in two directions. Going forward, from arguments to
    results, arrows tell us what each call returns. Going in reverse, from results
    to arguments, arrows tell us what each argument must have been for the call to
    produce the expected result. As we give precise type signatures to our programs
    using multiple arrows, the type system will use these same arrows to infer precise
    types. As we will learn next, Elixir uses this technique to infer types from guards
