  author: program_whiz
  text: Or maybe the bitter lesson is a flawed over simplification.  Computer vision
    is only possible because we used intuition about significant features in vision
    to make it tractable for GPUs with custom designed kernels.  Tossing a generic
    model with more compute is pointless, it&#x27;s the invariants and assumptions
    that make the models effective.<p>Same for sequence modeling with attention, highly
    generic RNNs which can in theory model any sequence are just incapable, regardless
    of compute thrown at it.  And a ton of engineered features like tokens are required
    to make LLMs work (just using the pure data is not scalable).<p>Bitter lesson
    was only true back when the engineered features were hand made vs statistically
    derived, and then it stuck around making people think a bigger model is all we
    need to get to AGI, when the reality is the exact opposite.<p>Technically an N-layer
    nnet can model &quot;any function&quot; but tossing a 10T plain nnet will not
    even approach a 10M param model with proper features, structure, and design.  I
    call this the savory lesson (intuition and design matter)
