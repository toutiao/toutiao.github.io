  text: I love the idea, somehow, that these systems <i>had to be built</i> with domain
    knowledge integrated into the choices of layers and the order of algorithms, using
    rather brilliant discoveries for optimizing lines and edges, or whatever was relevant
    to the problem. That&#x27;s an order of specificity that&#x27;s lacking from our
    modern reliance on &quot;one shot&quot; solutions. Letting a one shot solver grind
    its brains against creating a custom solution to a specific set of transformations
    is kind if a closing of the circle when it comes to performance and resources
