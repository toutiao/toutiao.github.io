  author: calebkaiser
  text: 'Oh sorry--I wasn&#x27;t taking umbrage with any side in the argument, just
    sharing an interesting dynamic I see in startups.<p>On the article specifically,
    I think there&#x27;s some emotional truth it&#x27;s probably hitting on, but the
    slot machine comparison is fundamentally flawed. Slot machines have a programmed
    return-to-player percentage. There&#x27;s no such thing as playing a slot machine
    &quot;well&quot;, everyone pushes the same button and hopes that they&#x27;re
    an outlier. It&#x27;s entirely possible to use paid advertising well. Lots of
    businesses do so successfully.<p>I think the big distinction I&#x27;d draw is
    that in slot machines, the casino wins when you lose. That&#x27;s not the case
    with ad networks. In fact, networks that show poor ROI for everyone involved usually
    face an exodus of customers. See: Twitter&#x27;s ad revenue over the last couple
    of years.<p>That&#x27;s not to say that paid ads are a great channel for all companies.
    There&#x27;s a reason why Y Combinator advises young startups to hold off on paid
    until they have mature enough unit economics to use it effectively. But it&#x27;s
    not a rigged game in the way the article author makes it sound, in my opinion.'
