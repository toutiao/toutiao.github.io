  author: hatthew
  text: 'This analogy doesn&#x27;t hold at all. Casinos are engineered for the house
    to win and the customer to lose because the casino is paying the customer directly.
    They are disincentivized to let the customer win. If the customer always won,
    the casino goes out of business very quickly.<p>Ad auctions are completely different,
    since they are just a marketplace. A customer&#x27;s (advertiser&#x27;s) win comes
    from a third party, and the point of the ad platform is to connect that third
    party to the customer. The ad platform would <i>love</i> to be able to make every
    single customer win all the time. Although, if they did that, it would create
    a lot more demand and even out the ROI with increased ad prices. But that&#x27;s
    not the &quot;evil ad platform&quot; engineering the customers to always lose
    in the way casinos do, that&#x27;s simply basic supply&#x2F;demand economics.<p>COI
    disclaimer: My current job is a small part of an ads platform on a website you
    have heard of. I dislike ads but realize they are a necessity for running some
    parts of the internet.'
