  author: hatthew
  text: Sure, we can make some analogy between <i>ads</i> and <i>gambling</i>, and
    transitively apply that to ad platforms and casinos. But this article frames ad
    platforms as exploitative entities engineering advertisers to lose money, when
    the reality is that the ad platforms provide a marketplace, and via the consequences
    of supply and demand this marketplace can end up being negative ROI for some advertisers.<p>Ads
    have a positive EV while gambling has a negative EV, which completely changes
    how the entities hosting these products behave. Casinos try to get you to stay
    on by tricking you into thinking you have a positive EV, while ad platforms get
    you to stay on by genuinely trying to give you a positive EV. If you aren&#x27;t
    getting positive results on your ads, you genuinely have the agency to adjust
    your ads to try to get positive EV. Casinos are explicitly engineered to give
    you negative EV regardless of how you behave, and kick you out if you try to change
    that (e.g. card counting).<p>If we say that you shouldn&#x27;t buy the products
    of an ads platform because the platform tries to get you to buy more, we may as
    well say you shouldn&#x27;t buy the products of a grocery store because the store
    tries to get you to buy more.
