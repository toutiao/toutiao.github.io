    are not made of one or two sellers, there is no &quot;fully controlled&quot; about
    a free market, that&#x27;s the <i>point</i> of one.<p>To me, as with any (privately
    held) monopoly, it seems obvious that this is a bad thing, especially because
    the result means that businesses cannot grow and compete (if it were a matter
    of simply capacity and not variable <i>price</i>, then every business that could
    profit would).<p>Shipping containers operate off of normal supply&#x2F;demand
    - prices might go up as demand increases, but they are not auctioned (a non market
    force). I don&#x27;t think the comparison is relative here, but yes, if they were
    being auctioned, that would be potential cause for concern, too."
