  author: oever
  text: "&gt; if advertising didn&#x27;t work people wouldn&#x27;t use it.<p>Advertising
    works, and the unfortunate end result for fungible products is that the product
    price increases to pay for the advertising.<p>Producer A and B each cover half
    the market and compete on price. When A starts advertising to get more market
    share, the loss is for producer B who&#x27;s margin decreases due to smaller volume.
    B also starts advertising. To make ends meet A and B have to increase product
    price to cover the cost of advertising.<p>This is very simplified reasoning. The
    gist is: <i>because</i> advertising works, consumers have to pay more for their
    products. The more advertising there is, the more prices will increase <i>without</i>
    products becoming better."
