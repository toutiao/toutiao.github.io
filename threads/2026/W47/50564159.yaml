  author: calebkaiser
  text: The majority of cases where I see paid ads really crushing a company&#x27;s
    budget, particularly among startups, are kind of interesting because they often
    follow a really specific dynamic. This is anecdata though, so take with a grain
    of salt.<p>The startups I see lighting money on fire with performance marketing
    are usually coping with the quiet understanding that they simply don&#x27;t have
    product market fit. I&#x27;ve seen this come up a lot around fundraising cycles.
    A founder really wants to show a graph that goes up and to the right. Everyone
    on the team knows that their product simply doesn&#x27;t win in most deals and
    isn&#x27;t generating excitement among users, but no one feels comfortable saying
    they need to make major changes. And so, instead of investing a ton of marketing
    budget into a content marketing strategy or something more complex, you put that
    money into ads and you guarantee a &quot;result&quot;. Not a great result, nor
    a super meaningful one for your business, but if you set a Key Event in Google
    Ads for signups and then turn on the faucet with little discernment, you will
    get a lot of signups. And now you don&#x27;t have a low-quality signup problem,
    you have a &quot;mid-funnel&quot; problem. And a founder can delude themselves
    into thinking they just need to nurture these spam signups better, just need to
    get their onboarding right or &quot;realign their brand&quot;.<p>And then this
    kicks off a self-perpetuating cycle. Your next-quarter targets are super inflated
    by this quarter&#x27;s nonsense, but the only lever you have to hit such lofty
    goals is the same thing that inflated the numbers in the first place.<p>In ideal
    cases, you have a founding team that are simply intellectually honest enough to
    avoid this or stop it early, but it&#x27;s surprisingly common to see this play
    out. Marketing agencies are often a part of this as well, as they can&#x27;t really
    control how successful your product is once it&#x27;s in users&#x27; hands. So
    their best-case scenario is often to sell you on the outcomes they can control,
    and they can absolutely control top-of-funnel metrics (before getting into how
    their comp is structured).
