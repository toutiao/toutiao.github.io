    \ \n[[2] Comments](https://math216.wordpress.com/2026/11/20/hurried-announcement-alessandro-masullo-grh/#comments)&nbsp;\n\nHi
    everyone,\n\nI am at the American Mathematical Society Executive Committee and
    Board of Trustees meeting now, and about to chair an hours-long meeting, but this
    is urgent, so I will try to get this out quickly. Alessandro Masullo has a proposed
    proof of GRH, and Brian Conrad has been looking closely at it for months and gave
    extensive feedback which is being incorporated, and it is so far looking good.
    It is all human, with no AI. The hope was to bring Alessandro to Stanford for
    a year to polish the writing and then announce it after running it by enough people.
    Now it seems best to put out the current draft. I hope people quickly check it,
    formalize, fill any small gaps if they occur. I really hope it works. I have great
    faith in Brian’s judgement, and Brian has put a lot of thought into checking what
    Alessandro has done. There is a long story to tell, but right now I want to get
    the file out. Here it is.\n\n[The Music Of The Primes](https://math216.wordpress.com/wp-content/uploads/2026/11/the-music-of-the-primes.pdf)[Download](https://math216.wordpress.com/wp-content/uploads/2026/11/the-music-of-the-primes.pdf)\n\n###
