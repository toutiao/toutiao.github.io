  author: costeve00
  text: LLMs are genuinely useful as a research assistant in mathematics (and other
    domains). First and foremost, they allow for a very good concept-directed search,
    which allows for quickly finding useful results that would otherwise be almost
    impossible to find traditionally without having read a large amount of the literature
    yourself.<p>There have also been some really strong results from letting the LLMs
    try to answer questions directly (the Riemann Hypothesis paper from Alpöge, for
    example), but ultimately I believe that automated proof assistants will take over
    in that regard because they should be a lot more efficient at finding correct
    proofs given the same amount of compute.
