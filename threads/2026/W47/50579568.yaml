  author: jiggawatts
  text: Think of it as a (fuzzy) compiler.<p>Now think about complaining that someone
    &quot;merely pasted my code into a compiler and said that there are errors in
    my code.&quot;<p>That&#x27;s nuts, right? If a compiler -- a kind of proof engine
    -- finds errors, there are errors. Fix them! Don&#x27;t complain about the <i>usage</i>
    of a compiler, the errors were real, they&#x27;re there, they need to be fixed.<p>The
    fuzziness part is both useful and a liability, but the error rate is dropping.<p>Some
    numbers for you:<p>A year ago, I ran a huge legacy codebase through Gemini Pro
    2.5 and it spat out several thousand bugs, but manual inspection showed that 80%
    were false positives and only 20% were worth fixing.<p>I did a similar exercise
    with GPT 5.6 more recently, and the hit rate was 80% valid and 20% false positive.
    The human developer <i>got into an argument</i> saying that they thought all 100%
    were false positives. He lost. The AI could easily produce &quot;repro&quot; snippets
    that triggered every issue (mostly security vulnerabilities, but some correctness
    ones too).<p>These days, if you&#x27;re <i>publishing anything</i> with verifiable
    claims in it, and <i>not</i> running it through an AI first, it&#x27;s the direct
    equivalent of uploading open source code to GitHub without bothering to check
    that it compiles first.<p>It&#x27;s sloppy.
