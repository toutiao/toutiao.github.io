  author: maxgee
  text: 'Our account was recently banned from OpenAI for a CSAM violation. We had
    an autonomous agent using an image classifier switch to OpenAI (instead of a local
    model it should have been using) which was classifying user-uploaded content.
    After classifying over 100,000 images, OpenAI banned our account.<p>We asked for
    further information so we could report the uploader to the NCMEC and remove the
    content from our systems. They refused to give us any information about this incident,
    denied our appeal, and have so far, illegally refused our privacy requests for
    data about our account.<p>OpenAI does not care about fighting child sexual abuse,
    this is completely performative.<p>EDIT: These image uploads are up to 20+ years
    old, and are being served through Cloudflare with their CSAM scanning product
    enabled. We&#x27;ve received no notification of any problems from Cloudflare.
    Something on OpenAI&#x27;s system thinks that an image we sent to them for classification
    is CSAM, and they aren&#x27;t willing to elaborate or communicate about it at
    all. For reference, our website is <a href="https:&#x2F;&#x2F;ytmnd.com" rel="nofollow">https:&#x2F;&#x2F;ytmnd.com</a>'
  score: 0
