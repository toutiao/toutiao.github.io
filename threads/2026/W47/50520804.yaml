  author: uptrails
  text: I&#x27;ve done some work in this space and it&#x27;s mostly that Big Tech
    has regulators and parent advocacy groups <i>already very angry with them</i>
    and breathing down their necks, so they would rather lose customers than take
    a nuanced approach. The marginal value of having you as a customer is approximately
    zero, the regulatory risk of letting CSAM through is huge.<p>Another complicating
    factor is that it <i>really</i> blows to have humans look at stuff like that,
    so everyone would rather use automated classifiers; and if you assume good faith
    and share too much info with the affected parties, this will be exploited by the
    bad guys to gain insights into how the system works and how to circumvent it.<p>I
    don&#x27;t think there&#x27;s an elegant solution to this, other than &quot;don&#x27;t
    allow tech companies to get so big that they can afford not to care about individual
    customers&quot;.
  score: 0
