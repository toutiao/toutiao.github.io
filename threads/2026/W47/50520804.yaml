article:
  url: https://openai.com/index/strengthening-online-child-safety/
  title: Strengthening the fight against online child sexual abuse with new tools
    and support | OpenAI
  fetch_status: success
  content: "OpenAI\n\nNovember 16, 2026\n\n[Safety](/news/safety-alignment/)\n\n#
    Strengthening the fight against online child sexual abuse with new tools and support\n\nNew
    tools, practical guidance, and partnerships will help prevent, detect and respond
    to online child sexual exploitation and abuse.\n\nToday, we’re releasing a new
    tool to detect child sexual abuse material (CSAM), interventions that interrupt
    harmful behavior and point people toward help, practical resources for developers,
    and support for child-safety law enforcement investigators. These efforts build
    on our and our . For parents, the goal is simple: technology that helps keep children
    safe, with people in control.\n\nIt is [⁠(opens in a new window)](https://www.esafety.gov.au/sites/default/files/2026-02/Designing-for-Safety_Preventing-child-sexual-exploitation-and-abuse-online_CSEA-toolkit.pdf)
    [⁠(opens in a new window)](https://technologycoalition.org/programs/lantern/)
    that combatting online child predators requires coordination across many organizations.
    Individual companies like OpenAI have a responsibility to prevent our technology
    from being exploited by predators to harm children, and we also must work together
    with the broader industry, child safety organizations and law enforcement to advance
    our collective efforts to protect children online.\n\n## Helping more organizations
    detect abusive material\n\nWe’re building on our with the release of a new image
    classifier that can detect potential CSAM, including AI-generated material. This
    new classifier looks for visual signs of abuse, helping teams identify novel images
    that may not have been seen before. It returns scores that help reviewers decide
    which images may need attention first. This is the first CSAM classifier with
    broad availability that has a specific signal on indicating if CSAM may be AI
    generated.\n\nOur teams trained, evaluated, and designed the classifier for real-world
    deployment with assistance from the [⁠(opens in a new window)](https://www.missingkids.org/),
    a nonprofit that operates the CyberTipline, a centralized reporting hub for the
    online exploitation of children.\n\nWe’re offering access to the classifier to
    vetted organizations through the OpenAI API at no cost, making CSAM detection
    more accessible to child safety organizations and the broader industry, including
    those with teams of varying sizes.\n\nChild safety is an industry-wide issue that
    requires strong collaboration across organizations and a variety of solutions.
    We’ve engaged the [⁠(opens in a new window)](https://technologycoalition.org/)
    and [⁠(opens in a new window)](https://roost.tools/) to help us share access to
    this new tool, and we are strong supporters of tools developed by others such
    as [⁠(opens in a new window)](https://safer.io/) CSAM detection system. In addition,
    we recently began participating in the Tech Coalition's [⁠(opens in a new window)](https://technologycoalition.org/programs/lantern/),
    where we will share and receive signals relating to online child sexual exploitation
    and abuse to strengthen cross- platform collaboration.\n\nWe’ve tested the classifier
    internally and with early partners to measure how much abusive material it detects,
    how often it flags other images, and how it can support safety teams. Their feedback
    helped us identify weaknesses and improve the system.\n\n### Results\n\nEarly
    tests suggest the classifier can help reviewers focus on abusive images while
    reducing review of false positives. In an evaluation of user-uploaded images,
    we compared the new classifier with our current protections and found:\n\n- The
    new classifier could reduce review work: we estimated that it would flag **48%**
    fewer images while finding roughly the same number of abusive images as the existing
    tool.\n\n- Images flagged by the new classifier were about **twice as likely**
    to contain abuse.\n\nEarly access partners have also evaluated how the classifier
    supports their own safety teams. In [⁠(opens in a new window)](https://fal.ai/)’s
    testing on human-reviewed production images, reviewers confirmed **72%** of the
    classifier’s high-confidence flags as novel CSAM. [⁠(opens in a new window)](https://invideo.io/)’s
    testing showed one in four flagged cases led to a ban. In [⁠(opens in a new window)](https://www.safetykit.com/)’s
    evaluations involving drawings or animations that sexualize children, the classifier
    detected **90%** of cases.\n\nMore information about the classifier is available
    in the [⁠(opens in a new window)](https://deploymentsafety.openai.com/csam-image-classifier).
    Organizations interested in the classifier will be able to request access through
    [⁠](https://openai.com/form/csam-classifier-intake/). We’ll continue improving
    the classifier with feedback from those that use it.\n\n## Interrupting harmful
    behavior and pointing people toward help\n\nWe already , train our models to refuse
    requests for it, and take action against accounts that violate our policies. We’re
    building on those safeguards with new product warnings in ChatGPT that interrupt
    attempts to find abusive material, explain the consequences, and point people
    toward help to stop harmful behavior.\n\nThe warning makes clear that sexualizing
    children causes harm, including when the requested material is AI-generated. Alongside
    the warning, we’ll remove the flagged conversation and pause access to ChatGPT
    for 24 hours, while keeping specialist support available to help people stop harmful
    behavior. Repeated violations may lead to longer restrictions and ultimately account
    closure or reports to authorities.\n\n![ChatGPT warnings explain that sexualizing
    children is harmful and can be illegal, suspend the account for 24 hours, and
