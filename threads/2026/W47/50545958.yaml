  author: mdasen
  text: I think it&#x27;s partly about risk and what will get a prosecutor off your
    back and what a court might say &quot;c&#x27;mon, they&#x27;ve done enough.&quot;<p>By
    geoblocking users in France, they&#x27;ve probably blocked at least 95% of French
    users from being able to access their services, if not closer to 99%. By not having
    any nexus in France, it does reduce their exposure. Yes, Switzerland and France
    might cooperate on things, but going after Quad9 via Switzerland would involve
    convincing Swiss authorities that a) France is correct enough that Switzerland
    should want to comply, b) the steps Quad9 has taken aren&#x27;t enough, c) France
    should get to enforce this against a company that&#x27;s completely extra-territorial.<p>Yes,
    Switzerland could still side with France, but it definitely makes France&#x27;s
    job a lot harder. Even within a country, people often &quot;forum shop&quot; for
    a district or judge they think will be more favorable. Forcing France to get the
    Swiss to agree means getting a second party to also be so strict (or want to cave
    for diplomatic reasons).<p>As you say, it&#x27;s definitely not clear cut. It
    does make it harder. It does reduce their risk. It makes it more likely that France
    will just declare victory and move on. Sometimes it&#x27;s about making it not
    worth the fight. Would a French prosecutor&#x27;s career be better served trying
    to get Switzerland to agree to essentially enforce French law worldwide against
    a non-profit? Especially when they are geoblocking most French users already -
    basically complying with the ruling as much as technology realistically allows?
    I think they&#x27;d probably find that their efforts would be better spent elsewhere.
    If Quad9 were still serving DNS queries from France, a prosecutor would have a
    much stronger reason to go after them in Switzerland. At this point, it just feels
    like a prosecutor would see it as a waste of time - like worrying about the cost
    of an array offset in a loop when you&#x27;re doing a network call every loop,
    the network call&#x27;s cost is just going to be so much greater and you should
    be spending your time on what matters. That said, people aren&#x27;t always rational.<p>It
    doesn&#x27;t get them in the clear for certain, but I think it does reduce the
    risk substantially.
  score: 0
