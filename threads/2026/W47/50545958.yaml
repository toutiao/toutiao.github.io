  author: Grombobulous
  text: Quad9 wants people to think that this is government overreach, censorship,
    suppression of free speech, etc.<p>But what it is from an objective factual basis
    is a private company bringing litigation to civil court where Quad9 was the defendant,
    and Quad9 lost the case.<p>This is a dispute between private corporations with
    the government brought in as a civil law mediator.<p>From the perspective of the
    plaintiff, Quad9 was financially harming them, the court agreed, awarded damages,
    and gave orders to rectify that harm as a result.<p>This is not the French government
    telling Quad9 to do or not do something based on some kind of centralized speech
    censorship authority. This is Quad9 being upset that they lost their case and
    that they don&#x27;t really want to comply with court order, so like a deadbeat
    ex refusing to pay child support or take care of Timmy 3 days a week, they&#x27;re
    skipping town so they can avoid both options.
