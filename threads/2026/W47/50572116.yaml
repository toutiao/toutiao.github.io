    little money and&#x2F;or few possessions</i> which tends to exclude those who
    have cars and jobs. Poor is not the same as &#x27;lower class&#x27;, &#x27;not
    well to do&#x27;, &#x27;not affluent&#x27; or any such construct. Many countries
    have official &#x27;poverty thresholds&#x27; which are closer to &#x27;not well
    to do&#x27; than &#x27;actual poverty&#x27;, e.g. in the UK households are considered
    to be below the poverty line if their income is below 60% of the median household
    income after housing costs for that year [1]. That is not <i>poverty</i>, it is
    &#x27;not well to do&#x27;. The international poverty line lies somewhere around
    <i>$1.90 a day at 2011 international prices</i> [2]. The former &#x27;poverty&#x27;
    means those people can&#x27;t afford to go on a foreign holiday, the latter often
    means they can&#x27;t eat other than from garbage heaps.<p>Words have meaning.<p>[1]
    <a href="https:&#x2F;&#x2F;trustforlondon.org.uk&#x2F;data&#x2F;poverty-thresholds&#x2F;"
