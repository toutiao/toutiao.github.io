  author: combobyte
  text: The problem is that the majority of that acid rain falls into the Atlantic
    ocean, accelerating ocean acidification. The lower the pH of the oceans, the harder
    it is for CO2 to remained dissolved in ocean water, so more of it goes into the
    atmosphere.<p>So S02 cloud seeding will produce cooling to a point... but eventually
    you hit a tipping point where the amount of trapped carbon released from the oceans
    overwhelms any cooling effect. It&#x27;s also worth noting that the cooling effectiveness
    maxes out at 100% cloud cover, but that sulfuric acid concentrations in the ocean
    can continue to grow without a strict upper bound.
