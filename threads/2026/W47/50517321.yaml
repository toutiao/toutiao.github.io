  author: lokar
  text: Anytime you run a proxy system for a large number of clients you don’t control
    you need a way to cold start.  This means being able to allow traffic through
    (cheaply!) on a client basis, rejecting the rest.<p>This lets you start at a very
    small amount of load and gradually ramp up.  But you can’t reject randomly or
    goodput stays at zero and the backlog never decreases.
