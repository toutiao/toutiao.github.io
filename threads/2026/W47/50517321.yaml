  author: jakewins
  text: We had this conundrum early on when we were building the Neo4j DBaaS - there
    was zero chance to afford to run test environments as big as production.<p>We
    solved that by sharding customers, so about every 1000 database clusters got their
    own k8s cluster; production then could run hundreds of those “orchestras”, but
    we could afford to load test one of them and be relatively confident the test
    was valid for production.<p>This relied on the various cloud vendors running the
    front-line load balancers that took traffic and moved it into the shards though.
    I was about to say that seemed to be the case for Microsoft here as well, but
    actually it seems they load tested an individual server with different specs than
    prod.<p>Tricky problem though - it seems they reasoned if a lower specced server
    passed the load test, a much beefier prod server would handle the load too. Wrong,
    but you can see why someone made that assumption.
