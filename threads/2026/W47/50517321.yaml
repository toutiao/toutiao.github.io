  text: Selectively allowing IPs is a reasonable way to do it. If you think about
    it, it&#x27;s terrible, but it will get you going, and it&#x27;s pretty easy do
    something like start with allow nothing, then allow all ips under 2.0.0.0, then
    3.0.0.0, etc.<p>Distribution of users by &#x2F;8 isn&#x27;t very even and the
    order that customers will get online wouldn&#x27;t be an order anyone would pick,
    but it should be reasonable to implement and synchronize (if needed) and it lets
    you make progress.<p>You could do similar in IPv6, start allowing IPs under 2001::,
    and bump it up little by little... probably each increment would be the 2nd byte,
    but you do need to increase the first byte too ... or you could be a terrible
    person and drop ipv6 while you modulate ipv4 and only let ipv6 in when ipv4 is
    at 100%.<p>Works better the earliest you can apply it... if your whole stack passes
    through requests and the origin is looking at X-Forwarded-For (or similar) headers
    to drop requests, your whole stack worked on it for nothing... Which could be
    ok, but your frontends might be much happier if they just dropped SYNs from IPs
    when the request will fail.
