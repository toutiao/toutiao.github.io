  author: mike_hearn
  text: No big surprises here. Big outages at big firms seem to always look like this.<p>The
    electricity industry has this notion they call a black start, where they bring
    the grid online from zero. It&#x27;s a very difficult operation because you can&#x27;t
    start a generator straight into an offline grid otherwise it gets hit with full
    demand and can&#x27;t keep frequency in the right range, which can damage equipment.
    So they have to start by disconnecting all the loads and then bringing load blocks
    back in sequence, trying to roughly balance available generation with the size
    of the next block. In practice black starts are extremely rare, but they can happen
    after a cascading failure in which something causes some generating stations to
    trip, redirecting load onto the remaining stations which can&#x27;t handle it
    causing them to trip in turn. The entire grid can collapse in just 60 seconds
    or so once that kind of runaway failure starts.<p>This kind of outage is very
    analogous to a black start. A few servers get into trouble - maybe they&#x27;re
    in a crash loop or maybe their caches are cold - the load balancers shift traffic
    onto the remainder which then can&#x27;t handle the load either and so the failure
    cascades. Once a service is in this state sometimes the only remedy is to disconnect
    all load, bring the servers back to stability, then bring load blocks back online
    in small chunks, making sure to never hit anything with the full load immediately
    to ensure any caches or JIT compilers have time to warm up.<p>It&#x27;s the sort
    of thing that requires a bit of preparation because naive ways of doing it like
    just randomly dropping 90% of requests will yield a broken service for everyone.
    Ideally your LB can drop traffic by modulus of the session cookie or similar,
    so users are let back in atomically.<p>Black starting a service is obviously quite
    hard to practice, but is probably something that sufficiently well resourced SRE
    teams should try once a quarter or so on a test cluster. I used to be an SRE at
    Google and although we regularly started up new clusters and moved traffic around
    between them, actually starting an isolated service instance entirely from scratch
    was never something we practiced. I remember in a few cases teams discovered devs
    had introduced circular dependencies by accident, i.e. starting service X required
    service X to already exist, or it depended on service Y that in turn depended
    on X. Sometimes you can only find these things by practicing.
