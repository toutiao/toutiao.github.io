    easy to see how the implementation copies the list.\nIt's easy to see why we might
    have chosen this implementation over any other implementation: because this one
    is obvious.\n\n...but it's not tail recursive.\nSo we rewrote it like this, using
    a previously-defined tail recursive shallow-copying reverse:\n(define (list-copy
    l)\n    (reverse (reverse l)))\n\nIt's still relatively easy to convince yourself
    that this function does copy the list, but it's less obvious why we chose to use
    this algorithm over any other (because being tail recursive isn't explicitly mentioned
    anywhere).\n...but this iterates over the list twice. Can we do even better? Yeah,
    but it's gonna be gross:\n(define (list-copy items)\n  (let ((lose (lambda ()
    (error:not-a list? items 'LIST-COPY))))\n    (cond ((pair? items)\n\t   (let ((head
    (cons (car items) '())))\n\t     (let loop ((list (cdr items)) (previous head))\n\t
    \      (cond ((pair? list)\n\t\t      (let ((new (cons (car list) '())))\n\t\t\t(set-cdr!
    previous new)\n\t\t\t(loop (cdr list) new)))\n\t\t     ((not (null? list)) (lose))))\n\t
    \    head))\n\t  ((null? items) items)\n\t  (else (lose)))))\n\n(from MIT Scheme)\nThis
    list-copy is hard to understand, but it also performs the best. This is an instance
    of a general pattern: the more optimized something gets, the more difficult it
    becomes to understand. Another example could be made by comparing the naive byte-by-byte
    strcpy to the 64-bit wide register-SIMD version, to the full-blown vectorized
    version.\nThe usual solution to this is good interfaces (\"design by contract\"),
    but maybe all that really does is put layers of paint on top of the nasty, optimized
    code at the bottom?"
