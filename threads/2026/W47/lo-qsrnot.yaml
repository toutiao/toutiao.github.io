  text: 'In program-verification research there is this idea of specifying a function
    by refinement: by giving a simpler, more declarative implementation to serves
    as specification. In your example, you could write both the simplest and the most
    optimized version, and the contract/specification would be that they have they
    return the same output. This specification could be consumed by an automated verification
    of refinement relations (this is hard research, although LLMs may be able to do
    it now), or integrated in a test/debug build (which always runs both functions
    in tandem), or (in-between fully-static and runtime-only checks) possibly checked
    by model-checking or symbolic execution.'
