    I personally see it as a tool for scaling myself that trades off speed for quality. Getting even to an acceptable quality bar requires micromanagement. From what I have seen, hands off agent loops may eventually will tick all the boxes on a requirements matrix, but for any large project will end up too brittle to actually scale well, because of how bad both sides are at the up-front communication :)
