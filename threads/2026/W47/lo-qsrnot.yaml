  text: |-
    +1 to using refinement here
    More generally: it's definitely a common tradeoff between understandability and performance, but there are things you can do to mitigate the problems of optimized code:

    Put it behind a clean interface, as you mentioned.
    Keep both the interface and implementation stable. It's one thing to have a hard to understand implementation of list-copy. It's another thing altogether to keep changing it every few months, since each change represents new risk you're adding to the code. At least if you keep it stable, you can learn to trust it through other means (tests, you've never seen it fail in production, etc). None of these things help 100% (including the tips I mentioned in the talk), but they all help.
    Only use messy code when you have to (e.g. for perf reasons). Some codebases might look complicated like this not because it all has to be optimized, but because the author didn't know a better way. Certainly some of my code in my earlier days would have looked like that. Defaulting to understandable code in most cases and only reverting to harder code when you deliberately choose to can minimize the damage here.

    So all in all I wouldn't say things like DBC are just putting a layer of paint on nasty code. There may be perfectly valid reasons for the code to be what it is, but contracts and the like can at least add a kind of containment to the messiness.
    ("Messy" is probably an unfair word here. I'm just using it as shorthand for hard-to-understand, but that doesn't mean the code is bad per se).
