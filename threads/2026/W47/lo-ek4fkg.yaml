  text: |-
    Under what license? If I have licensed code under BSD and then it's used by a GPL project then (1) that project has relicensed code they don't own, and more importantly I cannot use any changes to that code as it is nominally GPL.
    On the other end: I release code under the GPL, and it is incorporated into BSD or MIT licensed project, and then a corporation that uses my GPL code via the copy that was relicensed under the BSD license?
    Or even more extreme: an open source project that is open source through saying it is public domain code - now that project is ostensibly making code under any OSS license public domain, making it free to use by anyone.
    Opensource is not a single thing, and people disagree about what they think the correct approach is.
    As I have said before, the reason corporations are pushing chatbot code is to launder OSS code and avoid any of the obligations that come with those licenses. It's why they're happy to use chatbots trained on OSS code but do not make their own code available for training: they know what the chatbots are doing, and they don't want other people using their IP, but are happy to steal the IP of OSS projects.
