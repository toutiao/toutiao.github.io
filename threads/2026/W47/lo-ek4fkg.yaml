  text: |-
    This comes up a lot, and every time I have to give the same reply: in Thaler v. Perlmutter, the human involved explicitly said that he considered the AI the sole creator and tried to get the copyright assigned to the model. This has zero relevance to the more common cases where the human will assert that they themselves are the author.
    The decision explicitly says this:

    The   Copyright   Office,   in   fact,   has allowed   the registration of works made by human authors who use artificial intelligence.    See Copyright  Registration  Guidance:   Works Containing  Material  Generated  by  Artificial  Intelligence,  88  Fed. Reg. 16,190, 16,192 (March 16, 2023) (Whether a work made with artificial intelligence is registerable depends “on the circumstances, particularly how the AI tool operates and how it was used to create the final work.”

    https://law.justia.com/cases/federal/appellate-courts/cadc/23-5233/23-5233-2025-03-18.html
