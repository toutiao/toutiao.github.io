    The   Copyright   Office,   in   fact,   has allowed   the registration of works made by human authors who use artificial intelligence.    See Copyright  Registration  Guidance:   Works Containing  Material  Generated  by  Artificial  Intelligence,  88  Fed. Reg. 16,190, 16,192 (March 16, 2023) (Whether a work made with artificial intelligence is registerable depends “on the circumstances, particularly how the AI tool operates and how it was used to create the final work.”

