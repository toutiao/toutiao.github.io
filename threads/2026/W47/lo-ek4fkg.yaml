  author: olliej
  text: |-
    Copyleft was invented to prevent closing up of code written by people who wanted their code to remain open

    No, copyright licenses like the GPL were created so that non-lawyers had a way of sharing software in a way that prevented companies from taking it and claiming that because it was public, it was public domain. Stallman started this because he did not like the fact that all software you got had no source code available, and wanted to be able to write code where the source was available without allow companies to take it and incorporate into their own software without giving it back That required significant legal work to ensure the license was sufficient to cover all the potential abuses of companies, and could be enforced (you can easily write unenforceable terms).
    The important thing is that if you remove copyright then you cannot own source code, if you cannot own it, you cannot restrict how it is used. e.g. absent copyright you roll back the entire concept of open source code to what companies want to be able to do: claim that public source code is public domain, and so they are free to use it as they want and not ever release the code they derive from it.
    The ability to copyright law is the only thing that gives any OSS license any ability to put requirements on users - even simple acknowledgement of the use of the code.
