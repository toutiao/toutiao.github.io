  author: rpdillon
  text: I&#x27;ve stayed pretty quiet about this, but as an early and enthusiastic
    Framework supporter, I cannot recommend them to anyone.<p>I bought the Framework
    13 before launch, and received a machine from the first batch. I later bought
    their main board upgrade kit and their screen upgrade kit and I did a full upgrade
    on the machine and rebuilt it. The reason I could justify that was that I would
    take the old main board and slip it into their Cooler Master case and use it as
    a spare machine.<p>But there was a bug in the Intel chip they used in that main
    board that prevented it from booting properly inside of the Cooler Master case,
    and going back and forth with support, what they wanted me to do was disassemble
    my other computers to troubleshoot the one that should have just worked. They
    didn&#x27;t offer a replacement. They didn&#x27;t allow me to send it in to have
    them fix it. When I explained that I didn&#x27;t want to disassemble my working
    machines to fix my broken machine, they stopped replying to me.<p>This, coupled
    with the horrendous battery issues in the first version of the Framework 13, led
    me to conclude another purchase from them would be a big mistake.<p>Still happy
    with all six of my System76 purchases.
