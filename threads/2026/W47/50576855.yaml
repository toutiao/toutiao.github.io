  text: I have a FW 16 (first gen with the AMD 7040). It&#x27;s still going strong
    after 3 years of daily use, mostly docked but stand-alone maybe one or two days
    a week.<p>I don&#x27;t use it on battery much but currently it&#x27;ll last maybe
