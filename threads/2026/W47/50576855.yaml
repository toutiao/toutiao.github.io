    worse than macbooks, maybe an hour or so less than my brother&#x27;s (new) intel
    ultra laptop.<p>Build quality has been pretty solid. Only things that have broken
    have been my fault (keyboard stopped working after the Nth spill, usb connector
    (for power) is a bit loose after years of sloppy aim) and have been a breeze to
    replace.<p>Perf-wise, my only complaint is that I wasn&#x27;t expecting usb bandwidth
    to be a bottleneck. Turns out I can&#x27;t drive 3x 4k screens and fast-charge
