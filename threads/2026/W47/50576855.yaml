  author: dapperdrake
  text: 'Depending on what you are going for you may want to add nohz_full,nosmt to
    your Linux grub kernel command line arguments and set noatime on ext4 filesystems
    in file &#x2F;etc&#x2F;fstab.<p>Turning off smt (and nohz_full; it’s not a network
    server) lets the cores clock down cleanly.  Got that trick from the intel manual
    and learned about clock domains from a Verilog programmer.  Has worked reliably
    on many Linux systems.<p>Even found that one of my i5 servers never had smt to
    begin with, which explained its more consistent performance.<p>Had been poking
    at this for at least 5 years prior with powertop(8) to no avail.<p>EDIT: nosmt
    also effectivle doubles ram cache size.  For my work the extra hyperthrrad is
    useless, because there are rarely mixed processes where some to integers and the
    others do floats.  Bottlenecked on ALU and cache, mostly matrix stuff.'
