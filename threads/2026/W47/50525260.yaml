  author: doodlebugging
  text: A lift spring on my old (1995) Chamberlain garage door broke one day. It basically
    shattered, sending a couple chunks of spring steel flying around the garage bouncing
    off of all the crap that I have &quot;stored&quot; out there. It was loud. We
    had no idea what had happened and I went outside trying to track the noise thinking
    that maybe a deer had run head-first into the garage door or...<p>Anyway, I decided
    based on the noises that it must involve something inside the garage. Good luck
    finding anything in there. I opened the door with the clicker remote and didn&#x27;t
    notice any issues so I walked the &quot;path&quot; through all the accumulated
    things that needed new homes and as I was making my way back out the door I saw
    an unusual chunk of steel on the floor and a pulley that I know had not been there
    the last time I was in the garage. I began visually searching everything inside
    the garage trying to match those items found on the floor and that is when I saw
    the spring dangling on one side of the door and the lifting cables drooping.<p>That&#x27;s
    when it hit me that I&#x27;m lucky our cars don&#x27;t fit in there any more.
    All the energy stored in that spring when it popped could&#x27;ve cost me a couple
    of windshields, some body panel damage, etc but since my garage collects unfinished
    projects instead of automobiles all of the flying garage door parts bounced off
    of boxes and the sheetrock walls and did not damage anything important.<p>We briefly
    considered calling a garage door installer to deal with it so that we could replace
    both of the doors (two-bay garage). They had replaced a door on my shop a few
    years back and were reasonably priced and that Chamberlain door has functioned
    perfectly. Since the only parts compromised were the springs, pulleys, and cables
    on one side of the door I decided not to replace the door. There are spring kits
    available that allow a DIY replacement in a few hours so I went that route. Very
    inexpensive.<p>After reading comments here I am so glad I did not buy new doors.
    The last door we bought was produced before all the enshittified cloud crap. I
    replaced the remote panel controller this summer with a new, cheap control panel
    that looked identical on the outside but is slightly different internally since
    it is a generic replacement for the OEM part. Works great.
