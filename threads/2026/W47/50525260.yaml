  author: doodlebugging
  text: Like you, I also had no idea that one of the springs could shatter suddenly.
    There is a lot of stored energy in that spring steel when the garage door is closed.
    My doors are older doors that use a spring configuration that is more dangerous
    than the modern doors. Modern garage doors use torsion springs I believe and the
    springs used are wound&#x2F;unwound around a durable rod so that if or when the
    spring fails, large parts are constrained from flying off in random directions.
    The old style spring setup had no means of preventing large chunks of spring steel
    from exploding into the garage and destroying things. If your garage doors use
    the old configuration you can make them safer by passing a cable through the center
    of the spring and firmly anchoring it at each end. That will prevent most of the
    spring from becoming airborne just as the torsion bar does in modern garage doors.
    My old doors had zero safety cables so I added a safety cable to each door when
    I replaced the springs that failed.<p>Springs do fail. They have a limited number
    of cycles that they are rated to deliver. Here is a useful link to help understand
    what type of spring that your doors use and how durable that it is.<p><a href="https:&#x2F;&#x2F;www.precisiondoor.net&#x2F;torsion-and-extension-springs"
    rel="nofollow">https:&#x2F;&#x2F;www.precisiondoor.net&#x2F;torsion-and-extension-springs</a><p>This
    was definitely not anywhere on my list of things to consider when we bought the
    house more than 20 years ago. I will be replacing the springs with a torsion spring
    system at some point in the future. Right now they have safety cables installed.
