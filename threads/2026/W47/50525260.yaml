  author: kusha
  text: 'A bit of context that didn&#x27;t make it into the writeup:<p>The 819LMB
    is a HomeKit based device, meaning by HomeKit spec it is supposed to function
    100% locally on your LAN with zero internet access. (most connect it to home assistant)<p>In
    their infinite wisdom, Chamberlain decided to cripple it anyway: if the garage
    door opener cannot reach their cloud, a firmware watchdog triggers a hard reboot
    every 30 minutes, taking down local HomeKit control along with it. Additionally,
    if you don&#x27;t block the internet the right way, it reboots every 10 minutes
    in addition to the 30 minute reboot.'
