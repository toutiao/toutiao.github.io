  author: joakleaf
  text: You could enable optimizations. Turbo Pascal generated pretty fast production
    code in general, and you could also disable run-time checks like range checking
    etc.<p>The generated code wasn&#x27;t perfect, but you could always use assembler
    for short routines that needed faster code (e.g. loop-unrolling, tighter register
    usage, or 80386 32-bit register code, which I think TP never supported). There
    were also tricks that would improve performance (I seem to remember that &#x27;repeat&#x27;&#x2F;&#x27;until&#x27;
    was faster than standard &#x27;for&#x27; loops).<p>To be honest, it was a very
    fast tool to work with (even on a 80286) -- The integrated debugger was a dream
    to work with for the time too.<p>I remember switching to C (both Turbo C and later
    gcc via DJGPP on both a 80386 and 80486). Compiling even standard C was agonizingly
    slow in comparison to TP, and you couldn&#x27;t iterate as fast as TP. It was
    like moving from having fun programming to plain torture.<p>I moved on to fully
    embrace C later (and C++). As the computers got more RAM and got faster, it became
    a lot better experience, but I never fully understood why C was popular as a general
    purpose language in the 80s and 90s. I doubt C was optimal for development time.<p>TP
    was a really balanced compromise in a lot of ways.
