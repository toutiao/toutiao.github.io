  text: There were optimizations already available.<p>Even if the basic ones that
    tend to be part of university compiler assignments, .e.g. peephole optimisations,
    constant propagation, inlining, bounds checking removal, redundant loads removal,....<p>See
    chapter 21 from Turbo Pascal 7 Language Guide, to use the last one for MS-DOS
    as example.<p>Similar build performance available in other languages, alongside
    a small set of optimisations.<p>It is a urban myth that we cannot have both, only
    because folks experience is tainted with C and C++ compilers.<p>If you want a
    good example of fast compilation times with optimisations enabled, check D reference
    compiler dmd, or to keep on the subject, FreePascal or Delphi 13.
