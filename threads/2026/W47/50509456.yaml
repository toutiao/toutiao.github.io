  author: hnlmorg
  text: Optimisations existed back then. But what Pascal did differently to a lot
    of modern languages was it only required a single-pass compiler and no macros.<p>On
    slow systems of the era, that vastly reduced the amount of work a compiler had
    to do to turn ASCII into machine code.<p>These days, compilers run macros, multiple
    passes of the source code. Often then building their own byte code or an interim
    machine representation, before turning that into machine code.<p>Those layers
    of abstraction aren’t without benefit. You get greater composability of code,
    greater portability, and so on and so forth. So they exist for a reason.
