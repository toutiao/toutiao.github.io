  text: 'My first compiler was for a Pascal-like language that started with just reading
    assembler in and spitting assembler out, and then I layered in blocks and expressions
    step by step and slowly rewrite the compiler itself from a basic text processor
    in assembler to a proper compiler, making use of each new feature as soon as I&#x27;d
    made sure it worked.<p>I wish I still had the code for it - because it had a very
    simple Wirth-style code generator it was predictable enough that you could even
    use registers directly in expressions. (M68k, so e.g. you could do &quot;x = D7.w&quot;
    to set the variable x equal to the low 16 bit word of register D7)<p>EDIT: Worth
    mentioning Randall Hyde&#x27;s &quot;High Level Assembly&quot;[1] here as an actually
