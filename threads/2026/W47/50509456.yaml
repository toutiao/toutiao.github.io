  author: joakleaf
  text: Pascal strings were traditionally indeed maximum 255 bytes. Later versions
    of TP has PChar which worked as C-string (max 64K chars).<p>Null-terminated requires
    that you have sentinel (null) at the end, instead of a length at the beginning.<p>Having
    a length (encoded as a byte at the beginning), means they are very easy and efficient
    to copy and concatenate, because unlike the null-terminated variant, you don&#x27;t
    have to search for the terminator which requires a conditional branch on each
    character until the length.<p>Conditional branches were really expensive on old
    CPUs, compared to the 8086&#x27;s rep movsb instruction, that could just copy
    a specific length of bytes. On the other hand, I suppose, other string-operations
    are more tricky, because you need to keep track of your position in the string
    as you iterate over it.<p>I&#x27;ve never thought null-terminated strings were
    a particularly neat design or easy to work with (there are pros and cons) -- But
    the 255 string limit was annoying, and I wished they would have had pascal strings
    up-to 64K in length (they could have used a word as length instead of a byte).<p>Malloc
    is by no means a &#x27;C&#x27; specific thing -- Turbo Pascal had getmem() to
    allocate memory on the heap.
