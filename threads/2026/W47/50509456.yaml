  content: "## TPC16\n\n# Turbo Pascal Compiler Written in Turbo Pascal\n\n## Pascal
    Compiler Source Code\n\nHave you ever wondered how can you start writing your
    own compiler? What lies beneath [Turbo Pascal](http://en.wikipedia.org/wiki/Turbo_Pascal),
    the most popular Pascal compiler? Would it be possible to get (equivalent) source
    code of some popular commercial compiler? If the answer is yes then you came to
    the right place. Here you can get a [Turbo Pascal 7](http://turbopascal.org/)
    command line compiler written in Turbo Pascal. This is not the \"original\" Borland
    source code of the Turbo Pascal since it was probably not written in Pascal. This
    is TPC16, a Turbo Pascal compiler written from scratch. It is completely source-code
    compatible with the Borland Turbo Pascal 7.0 command line compiler TPC.EXE. This
    means that it uses the same syntax and generates exactly the same compiled units
    and 16-bit code for x86.\n\n## Make your own Turbo Pascal Compiler\n\nThis source
    code shows all the beauty of the Pascal programming language and reveals all the
    tricks needed to build a fast and compact compiler for any language, not just
    Pascal. With this Turbo Pascal single pass compiler source code you will get:\n\n
    ![Turbo Pascal](/images/pages/turbo-pascal-5-5.gif)\n- Architecture of [symbol
    tables](http://turbopascal.org/symbol-tables)\n- Understanding of Turbo Pascal
    unit structure\n- Ultra fast [scanner](http://turbopascal.org/scanner)\n- Examples
    of [hash tables](http://turbopascal.org/symbol-tables-and-hash-functions) for
    fast keyword search\n- Plethora of data structures needed in any compiler\n- Algorithms
    for dealing with identifiers, scopes and units\n- [Parser](http://turbopascal.org/parser)
    to analyze a sequence of [tokens](http://turbopascal.org/extracting-tokens) and
    to check Pascal syntax\n- Example of compiler error reporting\n- Understanding
    of [expressions and calculations](http://turbopascal.org/processing-expressions)\n-
    Examples of arbitrary expression processing and code generation\n- Algorithms
    for generating complex code with limited set of registers\n- Example of in-line
    assembler compiler\n- Example of [intermediate code structure](http://turbopascal.org/intermediate-code)\n-
    Optimizing [code generator](http://turbopascal.org/generating-code)\n- Understanding
    how object files are imported\n- [Optimizing linker](http://turbopascal.org/linker)
    with excellent approach to resolve references\n- A working compiler compatible
    with Borland Turbo Pascal 7\n- Deep understanding of [Turbo Pascal internals](http://turbopascal.org/turbo-pascal-internals)\n\nWith
    TPC16 source code you will be able to fully understand how Turbo Pascal compiler
    works. The compiler is written in Turbo Pascal 7 which means that it can compile
    itself. At least in theory. Turbo Pascal consists of many units, some of which
    are quite big. Since the Turbo Pascal compiler is a DOS application it has limited
    memory. Therefore, it is not possible to compile TPC16 compiler with TPC.EXE directly.
    However, there is a simple workaround. You can compile it with BPC.EXE which is
    the same compiler for protected mode and has less memory limitations. The result
    of compilation is an executable file TPC16.exe which can be used to compile Turbo
    Pascal source files. It will create a Borland Turbo Pascal 7.0 binary compatible
    TPU or EXE files. The only exception to this is map file and debug info in exe
    file which are not implemented.\n\n## How can you get TPC16 source files?\n\nMost
    of the source code is published with comments on [Turbo Pascal](http://turbopascal.org/)
    website. Here you will be able to get all the internals of the compiler. However,
    if you would like to use this compiler for your own project and you need the complete
    TPC16 package with all source files then please continue reading. You can get
    TPC16 Turbo Pascal compiler source code for some small compensation. If you have
    ever tried to write a compiler or you have studied some compiler construction
    books then you know how hard it is to make a compiler that is fast, compact and
    has all the features needed. For the price you will pay for the TPC16 source code
    you will get all the data structures and algorithms needed to write any compiler.
    You get all the building blocks for compiler construction for only a fraction
    of the cost for any compiler development. Do not reinvent the wheel, analyze proven
    and tested code and learn tips and tricks in compiler design. All types, constants,
    variables, procedures and functions in the source code have meaningful names.
    Therefore, from the source code itself it is easy to understand what the code
    does. And since Pascal programming language is also easy to read, this source
    code can be read as an algorithm for every compiler building block.\n\n## What
    can you do with Turbo Pascal Compiler source files?\n\nYou can make your own compiler.
    You can extend features of Turbo Pascal or make a totally new compiler. The most
    important feature of this package is practical implementation of various algorithms
    together with proven data structures. A successful compiler implementation depends
    mainly on data structures and algorithms used. Therefore TPC16 source can be used
    as an inspiration on how to implement complex algorithms for your compiler. However,
    if you would like to develop your own compiler it would be better if you start
    with [TPC32](/compiler-design/tpc32-turbo-pascal-compiler-written-in-delphi).
    This is the same compiler that compiles with Delphi 7. TPC32 is no longer limited
    with segment:offset data structures. It features a new symbol table management
    and supports also long file names.\n\n## The difference between TPC16 and other
    compilers\n\n![Turbo Pascal 7](/images/pages/tp7.jpg)There are also some open-source
    compilers available. What is the difference between TPC16 and other compilers
    and why TPC16 is not free? TPC16 is 100% compatible with Turbo Pascal 7 on the
    source level (the files it compiles) and on the binary level (the files it produces).
    TPC16 shows compiler internals not found in other compilers and is an excellent
    companion to many popular books about compiler construction. If you are serious
    about making your own compiler then you should have TPC16. TPC16 exe file is available
    for free and can be found below in the demo version. TPC16 source files are not
    available for free because I put a lot of effort into writing the code and it
    took me some time to make it working and compatible with Borland Turbo Pascal
    on source and binary level. The price I ask for it is only a fraction of what
    these source files are worth. If you have ever tried to write a compiler then
    you probably know what I'm talking about. **TPC16 is the cheapest e-book on compiler
    design and implementation taking into account that it reveals the complete, working
    compiler**. There is no detailed text book included, all you have to do is examine
    the source code and follow the control flow of the compiler. You will be amazed
    how simple can complex tasks be. TPC16 is the best book on practical compiler
    construction.\n\n## What do you get with TPC16\n\nYou get [Pascal source code](http://turbopascal.org/turbo-pascal-internals)
    for main program and all units. You will be able to compile TPC16 command line
    compiler and make modifications according to your needs.\n\n    Program TPC16;\n
    \   \n    Uses\n      Strings,\n      Parser,\n      Scanner,\n      IOUtils,\n
    \     ResWords,\n      CommVars;\n    \n    begin\n      Writeln (GreetingString);\n
    \     CmdPtr := Ptr (PrefixSeg, $80);\n      CmdPtr [Byte (CmdPtr [0]) + 1] :=
    #0;\n      CmdPtr [0] := ' ';\n      CfgPtr := FileBuffer;\n      Get_TPL_CFG_Directory;\n
    \     Read_TPC_CFG;\n      CompilerModeOptions := [cmoCreateExeFile, cmoCompileToDisk];\n
    \     LinkerOptions := [];\n      CommandLineConditionalDefines := InitialConditionalDefines;\n
    \     StartOfSourceFileStructures := @FileStructure;\n      ProcessCompilerParameters;\n
    \     StrCopy (TempStr, GlobalModuleData^.LibraryName);\n      CurrentFileName
    := TempStr;\n      FindFilePath (T"
