    | Mirror of the FATE server repository |\n\n \n\n#### Release Verification\n\nAll
    FFmpeg releases are cryptographically signed with [our public PGP key](ffmpeg-devel.asc)
    and should be verified for authenticity.\n\n    pub rsa2048 2011-04-26 [SC]\n
    \       FCF986EA15E6E293A5644F10B4322F04D67658D8\n    uid [full] FFmpeg release
    signing key <ffmpeg-devel@ffmpeg.org>\n    sub rsa2048 2011-04-26 [E]\n\nTo verify
    a release:\n\n1. Import our public key into your local keyring: \n\n    $ curl
    https://ffmpeg.org/ffmpeg-devel.asc | gpg --import\n\n2. Download a release tarball
    and its corresponding signature. \n3. Verify the signature: \n\n    $ gpg --verify
    ffmpeg-4.3.2.tar.xz.asc ffmpeg-4.3.2.tar.xz\n    gpg: Signature made Sun 21 Feb
    2021 06:35:15 AEST\n    gpg: using RSA key FCF986EA15E6E293A5644F10B4322F04D67658D8\n
