    release signing key <ffmpeg-devel@ffmpeg.org>\" [full]\n\n Optionally, you can
    verify that git and tarball match, the only differences should be the absence
    of .git\\* files in the tarball and a VERSION file in the tarball containing the
    version. The git tags should be signed with [EDDSA key DD1EC9E8DE085C629B3E1846B18E8928B3948D64](git-tag-key.asc)\n\nA
    release that also has a `.pq.asc` file carries post-quantum signatures ([RFC 9980](https://www.rfc-editor.org/rfc/rfc9980))
