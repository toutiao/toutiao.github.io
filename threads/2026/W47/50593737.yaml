  author: simonask
  text: It&#x27;s because it is an unbelievably difficult and quite finicky thing
    to support, especially if the 3D canvas uses a different rendering API than the
    UI framework itself.<p>For example, say your UI is drawn with OpenGL, but you
    need an embedded Vulkan canvas. This takes a huge amount of API-specific code
    passing API-foreign texture handles and synchronization objects between contexts.
    You need to do this for every possible combination of APIs, and it&#x27;s not
    symmetrical (hosting Vulkan within OpenGL is different from hosting OpenGL within
    Vulkan).<p>Every desktop-class rendering API does have extensions for dealing
    with foreign APIs, but it&#x27;s a lot of work, to the point where rendering into
    shared memory from a subprocess is sometimes the most viable option.
