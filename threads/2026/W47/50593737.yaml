  author: raphlinus
  text: 'Thanks.<p>The point I&#x27;m making is a subtle one. I do think you can go
    very far with an immediate mode GUI paradigm, and it&#x27;s also certainly the
    case that most of the imguis you see are performant. But I still wouldn&#x27;t
    choose it for a design or productivity app.<p>Once you do all the caching of text
    layouts and building of intermediate trees for a11y, you no longer have a pure
    imgui, but rather a hybrid.<p>I&#x27;m going to try to get this point across in
    an analogy, apologies to people not familiar with the referent.<p>Let&#x27;s say
    you&#x27;re frustrated with the size and complexity of a modern C compiler like
    clang or gcc, and want to do something simpler. One of the design decisions is
    whether use SSA (static single assignment) as the basis for the intermediate representation.
    If you&#x27;re going for simplicity, you might quite reasonably choose to skip
    it; you can generate reasonably good code straight from the AST.<p>But then, you
    and your users get dissatisfied with merely reasonably good code, and want some
    of those optimizations that make production compilers generate actually fast code
    – constant folding, common subexpression elimination, strength reduction, etc.
    You can certainly implement them as AST transforms, but it gets difficult to track
    everything? You add a bunch of logic and eventually get those optimizations to
    work about as well as the SSA-based version in real compilers.<p>Another compiler
    designer has similar goals but uses a different strategy: dive in and do SSA from
    the beginning, which is not as simple at first, but then you can just do those
    optimizations &quot;from the book,&quot; without a lot of friction.<p>Basically
    what I&#x27;m saying is that I prefer the second compiler. It&#x27;s not to say
    the first can&#x27;t be made to work.'
