  author: __benny__
  text: I guess it depends what you define as an &quot;imgui&quot;. To me, I think
    it&#x27;s when the application describes the UI every frame. I don&#x27;t think
    purity of approach is very relevant though. I&#x27;m happy to concede that a hybrid
    approach is better - in all things, balance :)<p>If I understand the point of
    the analogy, it&#x27;s basically that when you bolt sophisticated optimizations
    onto a representation that wasn&#x27;t designed for them, the bookkeeping accumulates
    in an ad hoc way, while a representation purpose built for those transforms makes
    the same optimisations feel like they fall out of the structure. Would that be
    valid?<p>If so I would actually swap imgui&#x27;s and retained mode ui&#x27;s
    around. In an imgui, you can implement domain-specific caching and other performance
    optimisations for your bottlenecks, whereas in retained mode UI you&#x27;re building
    against a general system and you often need to resort to hacks to rescue performance,
    or design your data model in a way that is amenable to change detection. Memoization,
    keys and identity gymnastics, state sliced into atoms&#x2F;signals&#x2F;items,
    &quot;this component only depends on X&quot; annotations, Equatable conformances,
    Identifiable fake IDs, keeping structs small and pruned so the diff is cheap,
    splitting views so diff granularity lines up with actual change granularity, id
    resets to force identity, etc. Fixing performance in React is largely about reshaping
    your data model until it&#x27;s legible to the framework&#x27;s change detection.
    When you use fine-grained reactive systems you need to adopt the framework&#x27;s
    data stores and it ends up infecting your entire application. You cannot just
    pull in a dependency and use it&#x27;s state directly - you need to martial it
    into signals or stores or set up subscribers.<p>Whereas in an imgui it&#x27;s
    trivial to benchmark and if you notice that a list is performing a lot of work
    on each update cycle you can apply an optimisation that is impossible in a more
    general system.<p>SSA isn&#x27;t simply a retained representation of an AST. It&#x27;s
    a representation with properties that make particular analyses and transformations
    easier. What specific properties of a retained mode UI representation make the
    important operations of a design application easier, and what is the cost of obtaining
    those properties? If the answer is stable widget identity, incremental invalidation,
    persistent layout relationships, and accessibility object lifetimes, thats fine,
    but an immediate-mode system can introduce those capabilities selectively, without
    necessarily adopting the entire retained-mode programming model.<p>In other words,
    the question isn&#x27;t whether you need the equivalent of SSA, it&#x27;s if you
    need to make SSA the foundation of your entire application.<p>Fwiw I&#x27;m building
    a desktop application with Egui and Bevy and it&#x27;s been a breath of fresh
    air compared to building applications with classical retained-mode systems. An
    entire class of bugs and complexity regarding state management just goes away.
    Performance is ~3ms including the entire render pass (more than just UI), and
    all of the complex components that required caching and other performance optimisations
    would have had to be hand-rolled in a retained-mode system anyways - except with
    Egui those optimisations are simple to build. All of the state just lives in Bevy&#x27;s
    ECS without any real considerations for the UI, because the UI systems can just
    reach into the world and read it directly. Some parts of the UI live as entities
    with relationships forming a tree, so you might say that&#x27;s approaching a
    retained-mode system, but it&#x27;s implemented selectively where it&#x27;s useful
    - most of the UI is transient.<p>But to each their own - some people seem to &quot;click&quot;
