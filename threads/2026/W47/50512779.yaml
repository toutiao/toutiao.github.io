    # Nimony

    ## Efficient, expressive, elegant

    Get the nightly toolchain

    Built every day from nimony’s `master` branch.

    [Linuxx86\_64 · tar.xz](https://github.com/nim-lang/nimony-website/releases)[LinuxARM64 · tar.xz](https://github.com/nim-lang/nimony-website/releases)[macOSApple silicon · tar.xz](https://github.com/nim-lang/nimony-website/releases)[Windowsx86\_64 · zip](https://github.com/nim-lang/nimony-website/releases)

    Unpack, put `bin/` on your `PATH`, done — and with `nimony n` you do not even need a C compiler. [Download page](download.html) · [Build from source](install.html) · [Tools](tools.html)

    **Nimony** is a new compiler for Nim and the home of the **Nim 3** language: borrow checking, explicit nilability, sum types, checked generics and more, with **incremental** and **parallel** builds from the start. For how it relates to Nim 2, see the [FAQ](faq.html).

    Nimony for…

    Here is a taste of the language.

    * * *

    ## Sum types (algebraic data types)

    Variant objects no longer need a separate discriminator enum: tags live in the section, and **`case value of Tag(fields):`** pattern matching binds the fields for that arm — like expressions you’d write in ML-family languages, checked for exhaustiveness.

        typeExpr=refobjectcaseofLit:value:intofAdd,Sub:left,right:Exprproceval(e:Expr):int=caseeofLit(value):result=valueofAdd(left,right):result=eval(left)+eval(right)ofSub(left,right):result=eval(left)-eval(right)echoeval(Add(left:Lit(value:10),right:Lit(value:32)))# 42

    Shared fields can live outside the , variants can nest ( in a branch), and grouped matchers like appear where multiple tags share the same shape — see **Case in object** in the [manual](language.html).

    * * *

    ## Borrow checking — iterator safety and aliasing

    Nimony rejects classic footguns at compile time:

        procgrow(s:varseq[int];use:int)=s.addusevars=@[1,2,3]# for v in s:# grow(s, v) # Error: `s` is borrowed during iteration — no realloc under active borrows

    This follows **prefix exclusion** : while (or ) is borrowed, that path cannot be mutated until the borrow ends — sibling fields can still be updated.

    * * *

    ## Type checked generics

    By default generics are type checked: the code is checked when the generic is **defined** , not only when it is instantiated! Duck typing is still available, you get it via the pragma.

    The required operations are described via concepts:

        typeComparable=conceptproc`\<`(a,b:Self):boolprocmin[T:Comparable](a,b:T):T=ifa\<b:aelse:bechomin(3,7)echomin("b","a")

    Container-style concepts (e.g. ) work the same way with iterators and indexed access — see **Concepts** and **Generics** in the [manual](language.html).

    * * *

    # Latest news

    **2026-09-08** Nimony **0.6.2** has been released. It ships with a guest report from a user who spent a year porting real projects over. A Vulkan visualiser, a web framework, an embedded server: [Nim, one year in](version0_6.html).

    Older entries, including the [0.2 release](version0_2.html), live on the [News](news.html) page.
