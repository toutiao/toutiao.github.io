  author: netbioserror
  text: '1) From std, a fully Nim-native tiny regex engine (the tinyre package fills
    this need, and I think it should be the default; the default regex engine brings
    in PCRE as a dependency).<p>2) From std, compression (I pull the zippy package
    as a dependency, and have built against Brotli and other compression libaries;
    whether compression should be in std is I think something Araq may have commented
    on already).<p>Aside from that, nothing. Nim&#x27;s compiler has an extraordinarily
    powerful templating engine built-in called Source Code Filters: These build text
    replacement procedures at compile-time, and can handle most arbitrary Nim code,
    including generics and the compile-time `when` conditional, although certain sugary
    arrangements by the default parser can&#x27;t work (Nim code in SCF must be prepended
    with a # to mark it, and control flow blocks must have end markers). I use SCF
    primarily for HTML reports, which is one of my primary outputs.'
