  text: "ref counting is only performed if you use `ref` types, e.g.<p><pre><code>
    \ type \n    RefObj = ref object\n      foo: string\n      bar: int\n\n    ValueObj
    = object\n      foo: string\n      bar: int\n\n</code></pre>\n`RefObj` is ref
    counted equivalent to a shared_ptr in C++ land (non-atomic counter unless using
    --mm:atomicArc or Nim3&#x2F;Nimony has this as a default I believe). `ValueObj`
    is equivalent to struct in C, C++, etc."
