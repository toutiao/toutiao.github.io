  author: klibertp
  text: 'As others wrote, what makes it unpalatable for you is static typing. You
    simply cannot make working with arbitrary JSON as convenient in a statically typed
    language as in a dynamic language (like JS or Python). No matter what you do,
    in a static language you need to provide or recover&#x2F;generate the full type
    information of <i>anything</i> before you can use it (unless the language or the
    runtime system offers an escape hatch: some kind of &quot;dynamic&quot; type (but
    that means the language is now gradually typed) or strong reflection capabilities
    - which Nim doesn&#x27;t provide to my knowledge). On the other hand, Nim has
    macros, so typing your JSON payloads is as painless as it can possibly be in the
    presence of static types.<p>So it&#x27;s not really Nim&#x27;s characteristic
    to make working with arbitrary JSON (heterogeneous collections more generally)
    &quot;unpalatable&quot; - it&#x27;s common to (almost) all statically typed languages.
    While Nim looks a lot like a scripting language, it really isn&#x27;t. It can
    be used as one, and it&#x27;s much better for that than C, but it&#x27;s better
    used for apps and systems programming than for scripting, like all the other languages
    in its class (ie. Go, Crystal, OCaml; Rust and Java are also close).'
  score: 0
