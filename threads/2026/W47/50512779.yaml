  author: PMunch
  text: Nim is very strict about types, which is probably what you remember. Things
    that are typically expressed as a dictionary&#x2F;object in JavaScript and Python
    are better represented as a fully typed tree of objects in Nim. The language of
    course supports the data-structure dictionary&#x2F;hashmap&#x2F;table (called
    Table in Nim) which is &quot;anything hashable&quot; -&gt; &quot;any type&quot;
    lookup. This is what&#x27;s used for things like `myTable[&quot;hello&quot;] =
    5` for storing the number 5 for the key &quot;hello&quot;. However because of
    the strict types you can&#x27;t mix which types they map to without creating some
    sort of wrapper type that gives you the alternatives you&#x27;re allowed to use.
    Many people reach for Nims JsonNode type to fill this gap for small collections
    of string&#x2F;number&#x2F;array&#x2F;dictionary since it already is such a wrapper
    type.
