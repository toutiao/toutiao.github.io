  author: bscphil
  text: I use a little trick. Focus on your screen at the midpoint of the two asteroids.
    Place your pointer finger, pointing up, a short distance away from your nose in
    the direction of the screen. You&#x27;ll see two copies of your finger since you
    aren&#x27;t looking at it. Move your finger until the two copies of it are pointing
    at the same location on the two copies of the asteroid. Now, without moving your
    finger, look at it. The two asteroids will become three, with a new one in the
    middle. While keeping your eye positions locked on your finger, shift your focus
    to the third asteroid.<p>If you do this, different distances to the screen can
    make the trick a little easier or harder, but you should be able to dial it it
    any basically any distance.
