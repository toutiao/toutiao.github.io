  text: |-
    I&#x27;d suggest looking at their original issues and the reporting around it.<p><a href="https:&#x2F;&#x2F;www.theverge.com&#x2F;2021&#x2F;1&#x2F;11&#x2F;22224926&#x2F;google-union-700-members" rel="nofollow">https:&#x2F;&#x2F;www.theverge.com&#x2F;2021&#x2F;1&#x2F;11&#x2F;22224926&#x2F;google-union-700...</a><p><pre><code>    As a minority union, AWU can’t force Google management to come to the table to negotiate. But it can try to pressure executives by rallying members toward a cause. That’s exactly what happened last week, when AWU called on YouTube to permanently ban Trump in the wake of a raid on the US Capitol on January 6th.

        “YouTube refuses to hold Donald Trump accountable to the platform’s own rules by choosing only to remove one video instead of removing him from the platform entirely,” they wrote. The company “is avoiding the proactive action called for by both their workers and the broader public.”

    </code></pre>
    <a href="https:&#x2F;&#x2F;www.wired.com&#x2F;story&#x2F;googles-new-union-addressing-political-issues&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.wired.com&#x2F;story&#x2F;googles-new-union-addressing-pol...</a><p><pre><code>    ON JANUARY 4, a group of workers at Google parent company Alphabet said they had formed a union to influence the company’s approach to political and social issues. Three days later, the Alphabet Workers Union got its first chance. A crowd incited by President Trump had stormed the Capitol in Washington, DC, sparking recriminations in the capital and in the atomized home offices that now make up Silicon Valley. YouTube had deleted a video the president posted amid the violence on Wednesday. But unlike Facebook, Twitter, Snapchat, and Amazon-owned Twitch, YouTube did not suspend Trump’s account.

        The Alphabet Workers Union said YouTube’s response was “lackluster” and inadequate. In a statement, the group said Google was not enforcing its own policies, while the platform was being used to “spread hatred and extremism.” “YouTube will continue to function as a vector for the growth of fascist movements if it persists in prioritizing advertisers while exposing the public,” AWU wrote. Google did not respond to requests for comment, but told Fortune that the president’s account had not violated its three-strikes policy.

        The AWU is somewhat unusual in that it is affiliated with the Communications Workers of America but won’t seek recognition or collective bargaining rights through the National Labor Relations Board. “We will use our reclaimed power to control what we work on and how it is used,” AWU writes in its mission statement. “We will ensure Alphabet acts ethically and in the best interests of society and the environment.”
    </code></pre>
    ----<p>It wasn&#x27;t focused around workplace issues and instead was trying to force YouTube to deplatform Trump and have Google act in certain ways including the &quot;control what we work on and how it is used&quot; part.<p>AWU may have good and righteous issues... and some were workplace focused (termination and harassment)... but its largely been politically focused in its inception and messaging.<p>From HN back then:<p>A group of Google workers have announced plans to unionize  - <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=25630011">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=25630011</a> (1368 comments)<p>We’re Google Workers, and We Are Forming a Union <a href="https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=25629852">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=25629852</a> (94 comments duped to the above one)
