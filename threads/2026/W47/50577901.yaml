  text: They need 50% + 1 percent of the bargaining unit.  Including others (vendors,
    extended workforce, contractors) in that not only makes it so that you need more
    people, but also that those individuals have conflicting goals which the union
    cannot represent (FTEs may have a workplace issue that conflicts with vendors).<p>As
