    Sure, but the question is what is inadequate? I don't know anything about either of these cases, but I've definitely seen unions push for unreasonable results even when offered good conditions. In my home city, there's been a bin worker strike going on for a year or two now over certain roles that the union demands be kept. But the roles were never necessary in the first place and courts have ruled that these roles create unlawful gender pay discrimination (that's been a whole thing), the city council have offered equivalently paid roles or generous redundancy to all affected employees, and the number of jobs affected is less than two dozen. And in the meantime nobody's bins are being collected.
    I'm broadly pro union, I think it's very important to have representation of workers and collective bargaining is a good way of restoring power to employees where normally power lies with the employer. On the other hand, unions aren't perfect and sometimes what they want is unreasonable.
    Which is why I think there's a lot more value in the worker cooperative approach, where workers are their own employers, and so the antagonistic relationship that makes unions necessary can be completely bypassed. But that's a whole other discussion for another time.
