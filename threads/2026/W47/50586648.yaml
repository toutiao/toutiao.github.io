  author: btschaegg
  text: If you&#x27;re lucky that can just be viewing angle and timing. Pseudo-pupils
    on mantises for example let you &quot;elicit&quot; human-like expressions from
    them pretty easily as you control where you shoot from.<p>Shoot from straight
    on, they look surprised (pseudo-pupil in the middle of two large eyes), from above
    they have puppy dog eyes, from the side (if you nail it so the pupil is inside
    the color band) you get a suspicious squint, and from behind-ish you have them
    looking &quot;over their shoulder&quot; in a paranoid way.<p>Spiders are similar
    in that you pretty much always get a reflection of your flash and diffusor in
    their eyes. Nail the timing w.r.t. the spider&#x27;s pose and a jumping spider
    almost looks like a curious, happy puppy ;)
  score: 0
