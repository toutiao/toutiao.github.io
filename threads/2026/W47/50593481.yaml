  author: bradknowles
  text: My wife is a lawyer.  She has specialized in international law as it relates
    to financial institutions for decades.  She gets really bent out of shape by people
    who’ve just read the law books and think that they know everything there is to
    know.  These are the same type of people who are usually stupid enough to try
    to defend themselves in court.  Her sister’s ex-husband is one of those.<p>My
    wife always says that the law is like a tripod.  There is one leg that is formed
    by the laws as they are written down.  There is a second leg that is formed by
    the precedents and case law that have developed around the written law.  And then
    there is the third leg which is formed by the courts as they apply the law to
    individual cases.<p>And exactly how this works out is different by country and
    locality within that country.  That’s why each state in the US has their own bar
    exam, and their own bar associations.  That’s why most cities and other localities
    have their own bar associations, and they may have their own additional bar exams.<p>For
    example, in China, if all you did was read the laws as written in the books, you
    might think they have a very modern legal system, with lots of reasonable choices.  But
    I am told that the law in China is actually whatever the judge says it is, and
    their judgement is final.  So, you can ignore the other two legs of the tripod
    in China.  And who appoints those judges?  Who promotes those judges?  To whom
    do those judges all kowtow?<p>In France, the official laws are written only in
    French.  Anything you read in a different language is a translation, and not the
    actual law itself.  There are other differences up in France as well.<p>So, having
    a system that lets you search the written laws and the precedents that have formed
    around them, that is a very useful thing.  And it’s a very expensive service called
    LexisNexis.  And it’s even more useful if it lets you look at the history of the
    way that a particular judge has ruled on specific cases.  Which I believe that
    LexisNexis does.<p>If you can give me an API to the laws as they are written and
    nothing else, that might have some value for some people.  But it’s hard to compete
    against LexisNexis or other legal research tools in this space.
