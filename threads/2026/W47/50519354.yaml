  content: "[![TRMNL](/assets/trmnl--glyph-black-4ca602fd.svg) ![TRMNL](/assets/trmnl--glyph-white-9348e89a.svg)](/)\n\n[About](/about)[Blog](/blog)[Developers](/developers)[Integrations](/integrations)[For
    Business](/b2b)[Discover](/discover)[Case Studies](/case-studies)[Login](/login)[Sign
    up](/signup)\n\n[← Back to all posts](/blog)\n\n ![Introducing Frame](/rails/active_storage/blobs/proxy/eyJfcmFpbHMiOnsiZGF0YSI6MTk4MzE2MjUsInB1ciI6ImJsb2JfaWQifX0=--cb59235012a1ba80f223054f06a6f34190fa081f/trmnl-frame-workshop.jpg)\n\n#
    Introducing Frame \n\n### tl;dr\n\nour 3rd release, a full color 31.5\" ePaper
    display in a handmade wooden frame, is now available for pre-order. watch the
    short film:\n\nthe 1st batch is just ~470 units and i intend to ship at least
    a few by the end of 2026. most deliveries will happen early 2027. see [logistics](#logistics)
    for more details or [pre-order here](https://shop.trmnl.com/products/frame).\n\n###
    background\n\nin 2013 i founded ArtSpot. our vision was to give New Yorkers a
    bit of joy by exposing them to local art. we did this through informal agreements
    with dozens of cafes, small galleries, and restaurants. \"_let us curate art on
    your walls, get paid if someone buys it._\"\n\nand it worked. sort of. finding
    artists was easy, building the platform was easy. getting permission from venues
    was slow but straightforward. the problem was nobody actually bought the art.
    i remember the admin email notification that first time a piece was sold. it was
    a small painting of Janelle Monáe. the buyer was my friend, a gift to me. here
    it is, still in my possession.\n\nanyway ArtSpot failed. five years later i paid
    back my investors (+ 13% interest). but the vision never went away. i love making
    and consuming art.\n\n### opinionated platform\n\ni probably say \"_the most popular
    feature request since launch is \\_\\_\\_\\_\\_\\__\" too often. after saying
    no (and yes) to so many requests, it's tough to keep count.\n\nbut with certainty,
    one of our strongest convictions was about color. TRMNL is not a television. it
    is not a clock. we avoid trying to do too much.\n\nthen [grayscale happened](https://trmnl.com/blog/no-more-flicker).
    photos look great. art is possible. community member Clark debuted _Jaws_ (yes
    the movie), [1 frame at a time](https://x.com/clarklab/status/1921209108377788721).\n\nwhich
    got us thinking... maybe we were wrong about color. maybe it aligns with our vision
    and just maybe, it makes it even bigger.\n\n### introducing Frame\n\ntoday i'm
    thrilled to bury the lede and announce [Frame](https://shop.trmnl.com/products/frame).
    it's a 31.5 inch full color ePaper display, enclosed in a hand made wooden body
    that we manufacture ourselves. yes, we opened our own woodworking shop a few miles
    from HQ. a closer look at the workshop is coming soon.\n\nFrame gets all the same
    features as other TRMNL devices, with a few additional perks spanning both the
    web platform and the hardware itself. [watch the short film](https://youtu.be/RmoSjWDiMEE)
    or read along below.\n\n**Clock Sync**\n\noften requested, always ignored, until
    now. Frame will update at specified moments of the day versus a relative \"every
    N minutes\" cadence. this reduces screen flicker while also extending the battery
    life and adding continuity to your schedule.\n\n**Offline Mode**\n\nthe internet
    is cool but totally unnecessary. Frame's microSD port lets you run devices completely
    offline with zero personal information reaching our servers.\n\n**Dedicated Power
    (optional)**\n\nlike all TRMNL devices, a rechargeable battery is included (10-20k
    mAh available). but with Frame we added an extra USB-C port on the rear of the
    device, accessible with a small hole through the back panel for always-on connectivity.\n\n**Color
    Expertise**\n\nsome of my colleagues are snobs about ePaper dithering algorithms
    and LUTs (look-up tables). this is now your gain.\n\nover the past few months
    we've been developing Lazarus, a color conversion engine that we think provides
    Frame the best color matching on the market for any Spectra 6 display. it's also
    coming soon to our [4-color device](https://shop.trmnl.com/products/trmnl-bwry),
    and yes it will be open source for your own tuning pleasure.\n\n**Three Orientations**\n\nHang
    Frame in portrait or landscape orientation without additional hardware, both are
    built-in and flush mounted. You can optionally buy or build your own kickstand.\n\n**And
    More**\n\nwe're negotiating with some of our favorite community developers to
    build more Frame-centric features. paying homage to [ArtSpot](#background), we
    just created a Local Art plugin where anyone can [submit their work](https://trmnl.com/local-art/submit)
    and even sell it through the TRMNL platform.\n\n### transparent supply chain\n\nbefore
    TRMNL i spent 10 years in b2b software and knew nothing about making physical
    products for everyday people. nobody ever blasted me on reddit about injection
    mold flow lines or damaged UPS packages. at best i'd get a G2 review every 3 months.\n\nthis
    all changed in [July 2024](https://www.kickstarter.com/projects/usetrmnl/trmnl-the-e-ink-display-for-your-favorite-apps-and-news)
    and after shipping 60,000 devices to 79 countries we've gotten pickier about operational
    design. chief among these new requirements is doing as much production as possible
    in-house.\n\nhere are Frame's components and where they're sourced:\n\n| \n\n**Component**\n\n
    | \n\n**Location**\n\n | \n\n**Lead Times**\n\n | \n\n**Inventory**\n\n |\n| ---
    | --- | --- | --- |\n| \n\nEPD (31.5\" screen)\n\n | \n\nOverseas\n\n | \n\n2-3
    months\n\n | \n\n300 in warehouse, 200 en route\n\n |\n| \n\nPackaging\n\n | \n\nAlabama,
    USA\n\n | \n\n1-2 months\n\n | \n\nsamples received, design tweaks sent for larger
    batch\n\n |\n| \n\nWooden body\n\n | \n\nTRMNL shop, Pine Mountain, Georgia\n\n
    | \n\n1 week\n\n | \n\nmade-to-order pending wood species chosen at checkout\n\n
    |\n| \n\nUSB-C Charging Cable and Block\n\n | \n\nOverseas\n\n | \n\n3-4 weeks\n\n
    | \n\n500 in warehouse, includes American + European style adapters\n\n |\n| \n\nPlastic
    parts\n\n | \n\nTRMNL HQ, LaGrange, Georgia\n\n | \n\n1-2 days\n\n | \n\nmade
    daily from a growing fleet of 3D printers\n\n |\n| \n\nPCBA\n\n | \n\nOverseas\n\n
    | \n\n2-3 weeks\n\n | \n\n1,000 full assemblies (raw components) in warehouse,
    bulk pick & place order TBD\n\n |\n| \n\nFasteners\n\n | \n\nOverseas + USA\n\n
    | \n\n2-3 weeks\n\n | \n\n500 full assemblies ordered, en route next week\n\n
    |\n| \n\nRigid foam\n\n | \n\nOverseas + USA\n\n | \n\n1 week\n\n | \n\n50 in
    warehouse, 450 en route\n\n |\n| \n\nBatteries\n\n | \n\nOverseas\n\n | \n\n2-3
    weeks\n\n | \n\nSamples in warehouse, 800 ordered, en route next week\n\n |\n\nby
    reducing complexity, [learning from](https://trmnl.com/blog/on-x) past releases,
    and having everything we need either in stock or on order, i expect this to be
    our smoothest fulfillment cycle yet. as with other devices, all Frames are assembled
    by our own team and never outsourced.\n\n### logistics\n\nBatch #1 is available
    to customers in locations our USA warehouse already ships to: USA, Canada, Mexico,
    Australia. [pre-order here](https://shop.trmnl.com/products/frame).\n\nwe're open
    to shipping elsewhere, but Duty / Import fees could be quite high given the product's
    Customs value. **to participate in Batch #1 as a resident outside these countries**
    , [**go here**](https://docs.google.com/forms/d/e/1FAIpQLSc5oFPs4TqFvyo13ipocjO5n1eK545V58Q8_CwD8oVSXy0bRQ/viewform?usp=publish-editor).
    this option may be de-activated without notice if inventory sells out.\n\nin early
    2027 we plan to open a 2nd woodworking shop near our Berlin, Germany warehouse
    to offer postage- and Duty-free fulfillment from a TRMNL team near you.\n\n ![](/assets/trmnl--glyph-black-4ca602fd.svg)
    ![](/assets/trmnl--glyph-white-9348e89a.svg)\n\n## Ryan Kulp\n\nFounder"
