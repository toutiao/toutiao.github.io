  text: I have a second-hand Samsung Frame connected to an old laptop that periodically
    wakes up, generates a couple dozen images daily, and then transfers them to the
    Frame TV via the Samsung Frame’s WebSocket API. It automatically changes the picture
    every 30 minutes.<p>The &quot;Art Mode&quot; setting along with its matte finish
    makes it non-reflective, so it just acts like a nice little gallery on my wall.
