  author: KennyBlanken
  text: eInk is in fact susceptible to aging, burn-in, and wear.<p>It&#x27;s literally
    a mechanical device (well, I suppose, an electrostatic&#x2F;fluidic device, but
    still, it is not solid state...fairly large particles have to physically move&#x2F;rotate
    in a liquid layer), one that utilizes a voltage difference of up to 40v, too.<p>A
    color iEink screen even more sensitive because now you&#x27;re not just dealing
    with flipping particles or making them move closer or further from the surface,
    you&#x27;re doing it with four different particles. Similar to how SLC is more
    durable than TLC, which is more durable than QLC, etc.
  score: 0
