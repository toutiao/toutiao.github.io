  author: KennyBlanken
  text: The cost is not in favor of paper and hasn&#x27;t been for a decade or so.
    These devices have been in widespread use in Asia for a long time. Best Buy went
    to them a few years ago, Walmart is moving to them.<p>The devices are often optical,
    with overhead IR transmitters. The fact that you don&#x27;t know that shows how
    little you know about the market and thus should not be talking about it.<p>RF
    is also used, yes - various protocols ranging from proprietary to bluetooth LE.<p>Even
    if only one price per second can be transmitted, that&#x27;s 3600 items per hour,
    which means that in 24 hours, 86,400 items can be re-priced. You&#x27;d need several
    employees working non-stop to even hope to hit that rate.<p>As for the legal challenges
    they&#x27;re able to point to logs as well as information on the digital display
    showing when it was last updated. Also, updates are not necessarily live - they
    can push out updated pricing info and then activate it at a specific time or via
    secondary command.
