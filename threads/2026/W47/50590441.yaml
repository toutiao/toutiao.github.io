article:
  url: https://math.mit.edu/~drew/grh/
  title: 'RH Lean proof: verification files'
  fetch_status: success
  content: "# Verification files for the Lean proof of the Riemann Hypothesis\n\nAnnounced
    at [alpo.ge/remark.pdf](https://alpo.ge/remark.pdf) on 20 November 2026.\n\nAndrew
    Sutherland (MIT), checks run with Claude Code. Page last updated 2026-11-21 12:55
    UTC. Results below are as of that time and this page will be updated as the remaining
    checks finish.\n\n## Summary\n\nThe published Lean source compiles without errors,
    the five headline theorems depend only on the three standard axioms, every module
    has been replayed through the Lean kernel, two independently written kernels,
    nanoda and con-leche, accept the full exported proof, and lean4lean accepts every
    compiled module. con-leche's `--compare` mode, an independent implementation of
    Comparator's statement matching, confirms all five theorems against the challenge.
    The `lake comparator` run and the Lean-kernel replay of the export are still in
    progress.\n\n| Check | Result | Detail |\n| --- | --- | --- |\n| All 175,187 modules
    compile (Lean v4.33.1, Mathlib v4.33.1) | pass | zero errors; finished 16:43:21
    UTC |\n| `#print axioms` for the five theorems in `Main.lean` | pass | `propext`,
    `Classical.choice`, `Quot.sound` only ([audit.log](audit.log)) |\n| No axioms
    declared outside Lean core | pass | 15 axioms in the environment, all in `Init`
    |\n| Mathlib files identical to the official cache | pass | 8,322 Mathlib and
    378 dependency `.olean` files, byte for byte |\n| `leanchecker` kernel replay
    of every module | pass | 175,187 of 175,187; zero rejections; finished about 18:17
    UTC |\n| Challenge export equals the one published by [Deicyde/riemann-hypothesis](https://github.com/Deicyde/riemann-hypothesis)
    CI | match | sha256 bd484ac9…b2b9 |\n| nanoda (independent Rust kernel) on the
    full export | accepts | exit 0 at 19:05:45 UTC; 27 min 42 s on 80 threads ([nanoda.log](nanoda.log))
    |\n| Lean default kernel and Lean paranoid kernel on the export | running | single-threaded;
    no verdict yet |\n| `lake comparator` (Lean v4.36.0) end to end | running | statement
    comparison and axiom check already passed in one run; kernels in progress |\n|
    con-leche `master` (`cd2eceab`) on the full export | accepts | 1,468,418 declarations
    accepted in `--verified` mode; exit 0 at 21:19:04 UTC; 3 min 15 s on 64 threads
    ([log](con-leche-master.log)) |\n| con-leche `--compare` (branch `compare`, `5dc36dc1`):
    challenge against solution | accepts | all five theorems \"justified by the solution\";
    51,692 challenge declarations accepted; exit 0 at 21:19:12 UTC ([log](con-leche-compare.log))
    |\n| lean4lean (`67f63b0c`, built with Lean v4.33.1) on the compiled files, module
    by module | pass | 175,187 of 175,187; finished about 21:55 UTC. 175,182 passed
    with default settings. Five hit lean4lean's default step limit (\"deterministic
    timeout\") on `decide +kernel` computations and passed when rerun with the limit
    raised ([timeouts](lean4lean-default-fuel-timeouts.log), [reruns with flags](lean4lean-raised-fuel.log))
    |\n| con-leche and con-ron as bundled with Lean v4.36.0 | declined | exit 2, not
    a rejection: those older binaries do not support one reflexive inductive type
    in the proof. con-leche `master`, above, does. ([log](con-leche-bundled-4.36.log),
    [log](con-ron-bundled-4.36.log)) |\n| lean4lean bundled with Lean v4.36.0 | not
    applicable | cannot read a v4.33 core library (`unknown constant 'Decidable.intro'`)
    |\n\n## What was verified\n\nFive theorems, proved in the submission's `Main.lean`.
    Their statements are below exactly as they appear in the challenge file, which
    imports only Mathlib. All the mathematical notions in them (`riemannZeta`, `DirichletCharacter`,
    `DirichletCharacter.LFunction`, `IsPrimitive`) are Mathlib's.\n\n**1. The Riemann
    Hypothesis** , using Mathlib's own definition (`Mathlib/NumberTheory/LSeries/RiemannZeta.lean`):
    every zero of ζ other than the trivial zeros −2, −4, −6, … has real part 1/2.
    The condition `s ≠ 1` is there because Mathlib assigns ζ a conventional value
    at its pole.\n\n    def RiemannHypothesis : Prop :=\n      ∀ (s : ℂ) (_ : riemannZeta
    s = 0) (_ : ¬∃ n : ℕ, s = -2 * (n + 1)) (_ : s ≠ 1), s.re = 1 / 2\n    \n    theorem
    riemannHypothesis : RiemannHypothesis\n\n**2. The same statement written out**
    in the submission's own words. Lean accepts the two as equal by definition.\n\n
    \   theorem riemannZeta_eq_zero_re :\n      ∀ s : ℂ, riemannZeta s = 0 → (¬∃ n
    : ℕ, s = -2 * ((n : ℂ) + 1)) → s ≠ 1 → s.re = 1 / 2\n\n**3. No zeros to the right
    of the critical line, for every Dirichlet L-function.** For every modulus `N ≥
    1` and every Dirichlet character χ modulo N, primitive or not, L(χ, s) ≠ 0 whenever
    Re s \\> 1/2. The one excluded case is the trivial character at `s = 1`, where
    the L-function has its pole.\n\n    theorem LFunction_ne_zero_of_half_lt_re :\n
    \     ∀ (N : ℕ) [NeZero N] (χ : DirichletCharacter ℂ N) (s : ℂ),\n        1 /
    2 < s.re → (χ ≠ 1 ∨ s ≠ 1) → DirichletCharacter.LFunction χ s ≠ 0\n\n**4. Zeros
    in the critical strip lie on the critical line, for every Dirichlet L-function.**\n\n
    \   theorem LFunction_eq_zero_re :\n      ∀ (N : ℕ) [NeZero N] (χ : DirichletCharacter
    ℂ N) (s : ℂ),\n        0 < s.re → s.re < 1 → DirichletCharacter.LFunction χ s
    = 0 → s.re = 1 / 2\n\n**5. The same for primitive characters** , the form in which
    the Generalized Riemann Hypothesis for Dirichlet L-functions is usually stated.\n\n
    \   theorem LFunction_eq_zero_re_of_isPrimitive :\n      ∀ (N : ℕ) [NeZero N]
    (χ : DirichletCharacter ℂ N), χ.IsPrimitive →\n        ∀ s : ℂ, 0 < s.re → s.re
    < 1 → DirichletCharacter.LFunction χ s = 0 → s.re = 1 / 2\n\n**Scope.**\"GRH\"
    here means Dirichlet L-functions: all moduli and all characters. Dedekind zeta
    functions, Hecke L-functions and automorphic L-functions in general are not among
    the statements that were checked.\n\n## Arithmetic consequences\n\nAs a check
    that does not depend on Mathlib's definition of the zeta function, the proof was
    combined with [kimihiro64/Robin1984](https://github.com/kimihiro64/Robin1984)
    (commit `acab1a3`), an independent formalization of Robin's and Lagarias's criteria
    on the same Lean and Mathlib versions. Importing both gives two theorems about
    the divisor sum, with no hypotheses and no mention of zeta ([ArithSolution.lean](ArithSolution.lean);
    statements alone in [ArithChallenge.lean](ArithChallenge.lean), which imports
    only Mathlib):\n\n    theorem robin_inequality :\n        ∀ n : ℕ, 5040 < n →\n
    \         ((ArithmeticFunction.sigma 1 n : ℕ) : ℝ) <\n            Real.exp Real.eulerMascheroniConstant
    * (n : ℝ) * Real.log (Real.log (n : ℝ))\n    \n    theorem lagarias_inequality
