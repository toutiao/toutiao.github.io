  author: bonoboTP
  text: Not really. It&#x27;s enough if the 17M don&#x27;t exploit potential bugs
    in the Lean implementation. But there are multiple independent Lean implementations,
    some with Lean-based proofs of their own correctness (yes, it &quot;just&quot;
    kicks the can down the road by one, but the bugs would have to line up just right
    for this to be a problem, ie the verified implementation would have to have a
    bug that happens to be touched by the 17M, and that bug has to go unnoticed by
    the verification of the Lean implementation itself due to another bug in all other
    Lean implementations that let that bug pass), so the 17M would have to simultaneously
    exploit bugs in all of them, and I guess they weren&#x27;t all in-the-loop while
    developing the 17M lines.<p>One you accept the above, you don&#x27;t have to believe
    the &quot;17M does what it purports to do&quot; because the proof checker checks
    that. What you have to check is the encoding of the RH in Lean but that is a preexisting
    encoding, not one written by Claude just now, and that has been vetted by many
    experts already.
