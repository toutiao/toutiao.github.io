  author: Animats
  text: |-
    Nice. I didn&#x27;t realize that the US had lost its position in high-end machine tools, too.<p>Volume in the machine tool business is dependent on the derivative of product production. If product production is trending downward, machine tool sales drop to near zero. They&#x27;re long-lasting machines, usually good for many decades. There&#x27;s a sizable used market. The new replacement market is thus small. Machine tools become obsolete, but often, the big iron gets a new controller and goes on cutting metal.<p>Conversely, if product production is growing, as in China until recently, there&#x27;s a huge demand for new machine tools.<p>All those US medium-sized machine tool makers that made gear hobbing machines and such seem to be gone. Along with most of the people who were really into precision machining.
    You can&#x27;t do this stuff with Amazon warehouse level employees.<p>Robotic joints are an interesting case. They need a small 3-phase motor, which is a lot like a drone motor. They usually have a harmonic drive. And of course they have sensors and a controller. For a long time, robotic joints for mobile robots were put together mostly by grad students in tiny quantities using off the shelf components intended for other things. But at last, they&#x27;re a volume business. The practical engineering problems have been solved, and there are at least 18 humanoid robots good enough to have Youtube videos.<p>There are a lot of tradeoffs in robot joints, and there was a good article about those on HN a few months back. Harmonic drives that can handle overloads and back-driving are tough to make, but that&#x27;s now solved. Too much reduction, back-driving fails, and gear teeth break. Too little reduction, and the motors have to be too big. Motors often have to be overloaded temporarily, and need thermal monitoring to get away with that. Balancing all those issues requires components built specifically for the task. It&#x27;s mostly engineering cost. Once the design is right, those things are all variants of mass produced products. Which is why, once the volume gets into reasonable numbers, humanoid robots may not be that all expensive. Probably comparable to a car.
