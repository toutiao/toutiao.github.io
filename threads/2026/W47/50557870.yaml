  text: I agree, but with the caveat that whether or not we should use a particular
    language for a new project isn&#x27;t just a function of that language&#x27;s
    qualities in isolation.  There are many considerations including the ecosystem,
    community, global availability of developers, ease of installation and maintenance,
    documentation, tooling, and more.<p>There are languages out there which are probably
    much closer to some Platonic ideal on their own merits but, for whatever reasons
    of luck or appeal or historical accident, just never really developed enough of
    these secondary factors to make the language as attractive to adopt overall.<p>PHP
    does have a lot of warts and odd design decisions (or accidents), and I would
    prefer stronger type safety, but it&#x27;s coming along.  On a new project, with
