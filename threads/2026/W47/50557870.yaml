  text: |-
    Most excited about the ZTS overhead reduction. If you are unfamiliar PHP can run either with or without thread safety (think using pthreads in PHP requests).<p>If the overhead can be further reduced (and people have ideas) then it could be that we only need ZTS mode anymore in the future and that can open up one avenue for PHP to get native async support similar to the existing parallel extension: <a href="https:&#x2F;&#x2F;github.com&#x2F;krakjoe&#x2F;parallel" rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;krakjoe&#x2F;parallel</a><p>More &quot;hands-on&quot; is the stream error handling improvements. This greatly improves the old file stream APIs to now allow throwing exceptions instead of returning false on errors:<p><pre><code>  $context = stream_context_create([
        &#x27;stream&#x27; =&gt; [
            &#x27;error_mode&#x27; =&gt; StreamErrorMode::Exception,
        ],
      ]);

      try {
        $config = file_get_contents(&#x27;&#x2F;etc&#x2F;app&#x2F;config.json&#x27;, context: $context);
      } catch (StreamException $e) {
        &#x2F;&#x2F; handle error
      }</code></pre>
