  author: jmyeet
  text: I&#x27;m honestly disappointed at the number of snark comments on HN about
    PHP. It&#x27;s like posting 2007 memes. Yes, we all know the story of htmlspecialchars().
    We can make fun of &quot;global&quot; when we don&#x27;t realize &quot;global&quot;
    actually means &quot;request scoped&quot;. We get it.<p>I&#x27;ve always viewed
    PHP as having these ideal features:<p>1. A stateless functional core. It&#x27;s
    cheap to run and quick to start. Compare this to Java or even Python. There&#x27;s
    no loading a bunch of class libraries;<p>2. Every request has an environment created
    then torn down. That means it&#x27;s hard for a given request handler to leak
    memory or other resources. You compare this to, say, Java&#x27;s servlet API (which
    only really existed because the startup costs were too high) where resource leaking
    is a real problem and then you get into GC and STW pauses; and<p>3. Every request
    is single-threaded. This is ideal. Async network&#x2F;IO requests are handled
    via extensions. You should never need to spawn a thread in a request handler directly.
    You eliminate a whole class of bugs by doing this.<p>Is PHP perfect? No. The class
    separator as the backslash still offends me more than a decade later. I really
    wish Facebook&#x27;s Hack had become PHP because it&#x27;s got a vastly better
    type system, core collection classes (list, vec, dict) and it did things a decade
    ago that PHP is only added with this release (eg polling).<p>As for partial functions,
    the use case seems to be versioning? I actually prefer the Javascript polyfill
    method here where possible. Don&#x27;t make users care about this kind of stuff.
  score: 0
