  text: 'A UI should be reactive rather than proactive. Any state changes should be
    explicitly requested by the user, who naturally knows what they requested, making
    &quot;informative&quot; animations redundant.<p>However, there is one legitimate
    use for UI animations: making it easier for spectators to follow what&#x27;s happening.
    Spectators aren&#x27;t the ones making the requests, so they can be confused if
    things happen too fast. Most computer use is not done for the benefit of spectators,
    so animations should be disabled by default, but it&#x27;s beneficial to have
    the option of enabling them.'
