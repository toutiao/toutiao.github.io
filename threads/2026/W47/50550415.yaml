  content: "We are rolling out Genie 4 to eligible Google AI Ultra subscribers, offering
    more responsive, social, and interactive world generation. You can now use natural
    language to edit environments in real time, add native audio, and share your creations
    in our new community gallery. Visit the Project Genie website to start building
    your own worlds or join the waitlist if you are a Google AI Pro member.\n\n- We
    are rolling out Genie 4 to eligible Google AI Ultra subscribers for creating interactive
    worlds.\n- You can now modify environments in real time using text prompts and
    native audio features.\n- Our updated Genie 3 model supports longer sessions,
    panorama grounding, and linked world sequences today.\n- The new Project Genie
    agent helps you build custom worlds through simple natural language conversations.\n-
    You can publish your creations to our community gallery for others to explore
    and remix.\n\nWe are updating Project Genie to help you create and explore interactive
    digital worlds. With our new Genie 4 model, you can change weather, add characters,
    and hear adaptive audio in real time just by typing prompts. You can also use
    our new creative agent to build complex environments through simple conversation.
    If you subscribe to Google AI Ultra, you can start building, sharing, and remixing
    these custom worlds in our community gallery today.\n\n#### Explore other styles:
    \n\n- \n- \n-"
