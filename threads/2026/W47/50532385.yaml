  text: 'If I was working on web standards, I would focus on trying to make the browser
    able to do as much as possible without JavaScript. Having to use JS to post a
    form dynamically for example is extremely overkill and a security problem. If
    we could avoid it more often, we could use CSP headers and disable it on a lot
    more security critical sites. If doing accessibility is a problem without JS,
    well then there&#x27;s a great thing to get started on fixing.<p>Just read this
    article this morning which I think highlights the problem: <a href="https:&#x2F;&#x2F;www.newsweek.com&#x2F;cyber-attack-websites-affected-12725863"
    rel="nofollow">https:&#x2F;&#x2F;www.newsweek.com&#x2F;cyber-attack-websites-affected-1272...</a><p>I
