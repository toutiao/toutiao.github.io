  author: miguel-muniz
  text: I have hoped that browsers would at least create HTML element equivalents
    for the existing aria-roles, that way we can have their recommended behavior for
    free without the foot guns of having to implement that behavior ourselves.<p>Getting
    something standardized is a real mountain to climb, though. It&#x27;s hard to
    get right and if you don&#x27;t you have to live with it until the end of time
    since that is sort of the promise of the web browser platform.<p>Nowadays I don&#x27;t
    know how much any of this matters. It&#x27;s pretty trivial to tell an AI agent
    to pull an unstyled component library such as React Aria or Base UI, or assemble
    one yourself from primitives such as UI SDK. All of them likely more accessible
    then modern standards that may not even be well supported by the browser + os
    + screen reader combination that an end user uses.
