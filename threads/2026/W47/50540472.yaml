    consequence was that the mix of fixed assets we used internally had changed to
    include production systems we owned for the cloud business. We therefore modified
    our depreciation schedule to 3-5 years.<p>However the timeline is:<p>Mar 2024:
    CS-3 launches.<p>Jun 2024: First confidential IPO filing (DRS) sets equipment
    useful life at 1.5–3 years.<p>Aug 2024: Cerebras Cloud launches (followed by $383M
    in 2025 cloud CapEx).<p>Dec 22, 2025: Updated DRS still certifies a 1.5–3 year
    useful life, 16 months after launching the cloud, contradicting the statement
    in the blog.<p>Late Dec 2025: Signs the 750 MW OpenAI cloud deal (3.7-year average
    contract).<p>Apr 17, 2026: Public S-1 (weeks before the May 2026 IPO) doubles
    useful life to 3–5 years, boosting 1H 2026 gross margins from 24.0% to 29.9%.<p>---<p>So
    the blog is not having the right causal relationship here, if launching the developer
    cloud in August 2024 was the reason for extending useful life to 3–5 years, that
    change would have been in the December 2025 filing.<p>Real reasons probably touch
    upon their deal with OpenAI, which had to be taken on OpenAI&#x27;s terms because
    the IPO would not have happened with a 86% UAE-based G42 (which stalled the 2024
    IPO over China ties). Cerebras needed a big US anchor customer to go public, and
    OpenAI opted to buy cloud capacity rather than buy and run the hardware itself(you
    can guess why). Once you have to capitalize massive owned cloud infra for a 3.7-year
    contract right before an IPO, stretching hardware depreciation from 1.5–3 years
    to 3–5 years is kind of free because all other cloud providers use a 3–6 year
    schedule, so it&#x27;s easy to get an auditor to sign off on it.'
