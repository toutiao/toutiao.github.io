    5-7 year GPU economic depreciation schedule and divided it by a 3x thermal power-draw
    ratio to claim the wafers physically die in ~2 years.<p>However in the blog, Feldman
    writes:<p>&gt; By the next update of our S-1, we had set out to build a private
