  text: Author here. Pointing out that we can&#x27;t hold entire projects in our heads
    is not a made up excuse. And doing things like breaking things up into modular
    components that have specifications and tests is precisely how we combat cognitive
    complexity. That&#x27;s exactly the approach I am taking with Jolt where there
    is a large specification and conformance harness used to ensure semantic correctness
    of the language. <a href="https:&#x2F;&#x2F;github.com&#x2F;jolt-lang&#x2F;jolt&#x2F;tree&#x2F;main&#x2F;test&#x2F;conformance"
    rel="nofollow">https:&#x2F;&#x2F;github.com&#x2F;jolt-lang&#x2F;jolt&#x2F;tree&#x2F;main&#x2F;test&#x2F;conformance</a><p>Meanwhile,
    anybody who&#x27;s maintained a large scale software project knows that even with
    the best practices, problems can still be introduced into the codebase. Nobody
    is arguing against limiting context or doing as much as possible to ensure the
    contribution is doing the right thing. Yet, the idea that you can have full understanding
    of how the feature will interact with every edge case is frankly laughable.<p>The
    notion that you can architect a perfect codebase where context and scope of the
    effect of any change is always completely clear is idealistic in the extreme.
    Of course, we should strive to keep the code quality as high as possible, nobody
    is arguing against that. The reality is that large projects are complex, and nobody
    has come up with a way to write code in the way where it&#x27;s possible to perfectly
    control the scope of the effects of any one change. Every single large scale project
    out there has bugs, and regressions no matter how much the authors strive to make
    it perfect.
