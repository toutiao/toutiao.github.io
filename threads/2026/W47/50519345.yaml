    Was initially interested (I like languages that binds easily to C because of the nice libraries there, and I&#x27;m a fan of LISP), but the README is LLM-generated and the Makefile is unreadable. The there&#x27;s this part in the AI policy<p><pre><code>  It is simply not feasible for humans to keep the entirety of large projects in their heads all at once. When working on a project, one is constantly forgetting and relearning code along the way. The situation is even worse for projects where multiple people work together and no one knows what everyone else was thinking. We look at the code and try to build up sufficient context in our heads to make the necessary changes. When we misjudge that context or misunderstand existing code, we end up making mistakes.
    </code></pre>
    It&#x27;s a made up excuse because no one has ever tried doing that. Instead the core activity of software engineering (and engineering in general) is to break down things into modular components, ensure that they work well, produce specs, then assemble the result. Which is why no one read the source code for open(2) system call before using it. Instead they read the manpage and only when there&#x27;s an issue there&#x27;s a need to compare the specs with the implementation.<p>So it&#x27;s a matter of communication between humans. If person A is responsible for module  1 and person B&#x27;s module 2 depends on the former. It&#x27;s up to A to provide a proper spec to B. It&#x27;s not up to B to learn everything about module 1&#x27;s implementation and doing so is kinda foolish.<p>So something like<p><pre><code>  Any new code that is added is therefore always done with limited understanding.
    </code></pre>
    Is a red flag. The codebase and workflow should be that new additions should deal with a limited context (as in one PR shouldn&#x27;t touch unrelated things) at at time and the contributors should be able to come with a full understanding of what they are doing. If they cannot, it&#x27;s either a failure of the codebase, the docs, the workflows, or the contributors.
