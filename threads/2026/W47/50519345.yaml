  author: Jeaye
  text: I am the author of jank. Saying that jank &quot;does not aim to be a drop
    in replacement for Clojure&quot; may send the message that jank is not a full
    Clojure dialect. This is unclear at best. jank is a native Clojure dialect with
    seamless C and C++ interop and a strong native ecosystem story, including native
    project and dependency management.<p>I believe what you&#x27;re trying to say
    there, with &quot;drop in replacement&quot;, is that jolt emulates common Java
    interop forms in Clojure JVM such that code written for Clojure JVM doesn&#x27;t
    need to be ported to run on jolt. This a compelling feature which other dialects
    are tackling as well.<p>What I would mention as a key difference between jank
    and jolt, aside from the C++ story and native project management story, is that
    jolt is very much AI coded and jank is not. jolt doesn&#x27;t disclose this on
    its website or Github readme, but it&#x27;s something which clearly matters to
    a lot of people.
