  author: yogthos
  text: My understanding is that Jank is built to provide tight integration with C++,
    and does not aim to be a drop in replacement for Clojure. Jolt provides FFI for
    native ecosystem access, and aims to be a superset of JVM Clojure leveraging platform
    specific features like TCO and providing fibers built on top of continuations.
    It currently runs many existing Clojure libraries out of the box.
