  text: As the author mentions, the biggest threat is from customers becoming competitors.
    The problem space is stabilizing and this allows the biggest buyers of GPUs to
    work with companies like broadcom to make their own chips. Thanks to agents, they
    can also spin up their own abstraction layers and debug tools. CUDA is becoming
    less relevant, and the rate at which that is happening is about to go parabolic.<p>Surely
    Nvidia won’t stand still and will continue to compete, but the margins will collapse
    along with volumes.<p>AMD will probably suffer less, relatively speaking. Their
    failure to invest in software finally seems to be paying off now that LLMs can
    pick up their slack. But the growth currently priced in to their stock will never
    materialize and they’ll be seen as arriving just in time for the lights to go
    out.
