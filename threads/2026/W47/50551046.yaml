    for everything? In a Conway&#x27;s game of life setup which creates gliders, there
    is no distinct storage which describes how a glider is built and does nothing
    else - it&#x27;s in the behaviour of the whole system. When you spin 20 plates
    or juggle 7 balls, you don&#x27;t need that many hands nor do you think the total
    amount of storage is &quot;2 hands&quot; which allows only 4 states; it&#x27;s
    a dynamic ongoing task, never stopping, the balls never get stored.<p>Life isn&#x27;t
    a blueprint given to a factory and built from scratch, it&#x27;s a 4+ billion
    year continuous unbroken happening, of juggling, of plate-spinning, of people
    forking and patching a running LISP REPL. Life isn&#x27;t stopped and started
    anew every generation just because we talk about individual people being discrete
    entities and conceived at a specific point. A human egg cell is 3e17 atoms, it
    isn&#x27;t only &quot;storage and nutrients&quot;, and it is connected to the
    mother&#x27;s womb for millions of seconds which is not only &quot;a fuel supply&quot;.
    Single celled organisms can split in half, but that&#x27;s not how humans replicate.
    There&#x27;s a long period of the mother&#x27;s body &#x27;juggling&#x27; the
    development of the foetus.<p>From The Company of Biologists[1]:<p>&quot;&quot;&quot;Emerging
    evidence suggests that .. the placenta secretes a myriad of factors into the maternal
    and fetal circulations, which appear to be part of an active maternal-placental-fetal
    crosstalk. However, for most of these factors, their physiological function remains
    to be determined; examples of factors with known functions include plGF and sFLT1
    (Degnes et al., 2022). Both of these proteins regulate angiogenesis ..<p>Both
    term (Michelsen et al., 2019) and preterm (Schreiner et al., 2022) human placentas
    secrete an array of proteins of unknown function into the fetal circulation. Some
    of these proteins are predicted to be involved in the development of the brain,
    heart and lung and we speculate that, when born prematurely, infants are deprived
    of these important developmental regulating placental proteins, which may contribute
    to their poor outcomes (Schreiner et al., 2022).&quot;&quot;&quot;<p>Among other
    things like passive immunity from the mother&#x27;s antibodies, maternal thyroid
    hormone, cortisol, exosomes carrying microRNA.<p>[1] <a href="https:&#x2F;&#x2F;journals.biologists.com&#x2F;dev&#x2F;article&#x2F;150&#x2F;20&#x2F;dev202088&#x2F;333472&#x2F;Maternal-fetal-cross-talk-via-the-placenta"
    rel="nofollow">https:&#x2F;&#x2F;journals.biologists.com&#x2F;dev&#x2F;article&#x2F;150&#x2F;20&#x2F;dev202088...</a>
