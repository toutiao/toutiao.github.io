  author: TheOtherHobbes
  text: He played a huge show in Houston in 1986, so not exactly unknown.<p>I suspect
    synth music was big on the college circuit, not so much on commercial radio.<p>Kraftwerk
    were moderately well-known in niche circles, Tangerine Dream were known well enough
    to have a successful US tour in the 1970s before they branched out into movie
    scores in the 80s - which meant far more people had heard them than had heard
    of them. Vangelis became famous in the US on the back of the Blade Runner score,
    but most of his other albums remained a niche interest.<p>But Europe generally
    had a much bigger wave of synth artists, from symphonic-lite like TD, JMJ, and
    Vangelis in the 70s, to synth pop and industrial in the 80s, to various shades
    of synth dance and early rave in the 90s and 00s.<p>There was more cross-pollination
    with the classical and academic music scenes. Academic music in the US was much
    less porous, and much more polemically anti-pop and anti-melody. So aside from
    Switched on Bach, which was a hit as much as a novelty album as serious music,
    the mid-way space between abstract electronic experiments and pop was much emptier.
