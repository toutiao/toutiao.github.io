  author: coldpie
  text: I don&#x27;t know where the OP of this subthread is from, but I think there&#x27;s
    definitely a big US blind spot for early electronic music.  I&#x27;ve been into
    electronic music my whole life (born late 80s), but had never heard of JMJ before
    I started to dig into the history of synthesizers and so on.  Obviously he came
    up very quickly in that context, but before I went out of my way to learn the
    history, he had never crossed my radar.  Electronic music got zero air-time on
    the radio in the US, before it came in backwards through hip-hop and modern pop
    music in the 2000s.  So for the most part, anything heavily synthesizer-based
    from before 2000ish is seen as kind of specialist music in the US.  When I first
    heard about JMJ and read through his Wikipedia page I was surprised to learn someone
    I had never heard of lead some of the highest attendance concerts on the planet!
    Talk about a blind spot.
