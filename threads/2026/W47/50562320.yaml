  author: D_R_Farrell
  text: Thanks! This is a really interesting point. I think there are companies like
    Coframe that have a really compelling approach to self-improving websites and,
    there is a world where Onlook could do something similar but for real apps.<p>There
    is a ton of latent opportunity in stepping-in and allowing products to self-improve,
    but the primary challenge seems to be one of taste. Agents do make decent recommendations
    on what could be improved in a product, but the scope or &quot;level&quot; that
    they make recommendations seems to still be misaligned with what designers would
    like.<p>That&#x27;s a long way of saying that there seems to be an inherent &quot;understanding&quot;
    of a problem that convinces a designer to go with a particular solution as they
    discover solutions.
  score: 0
