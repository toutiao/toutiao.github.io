  author: krisodd
  text: Thanks! We think that’s where a lot of the value is.<p>Onlook works through
    ChatGPT or Claude, and connectors let that agent pull in outside context.<p>So
    if your notetaker or analytics tool has a connector, you can ask it to read what
    users said and try a design change against it right on the canvas.<p>It’s not
    automatic yet. You still point the agent at the source and judge the result, but
    closing that loop is something we’re keen on.
