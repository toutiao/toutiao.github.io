  author: D_R_Farrell
  text: Pen.dev chose to go the route of a specific file format for design in favor
    of building an editor around that, which is a more constrained approach in our
    opinion. Meaning that the work you do in the canvas is always a &quot;copy&quot;
    or &quot;mock&quot; of what is actually being implemented.<p>For Onlook our goal
    is to make everything you do truly 1:1 with no translation layer in between what
    you see and what will ship. It&#x27;s a small nuance but makes a big difference
    in the design process.<p>They certainly have an impressive product that is quite
    performant from what I remember.
