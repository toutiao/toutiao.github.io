  parent_id: '50563490'
  author: D_R_Farrell
  text: The key difference for Onlook is that we work on the real running application.
    Paper and Pen are excellent tools for working on abstractions of what you&#x27;d
    like to ship, but still are constrained in a way that favors the editor experience,
    not the building experience.<p>This is totally ok in our opinion – you want to
    choose the right tool for the job – we just think the job for designers is trending
    towards being right up against the real medium of code and how it gets represented
    when it ships.<p>Your point on the proprietary format is a good one. There are
    so many ways to build a design tool, and it felt like agents give us an opportunity
    to make an entirely new way to craft designs that doesn&#x27;t require a strict
    format. Why can&#x27;t we just select the thing we want to change and do it, regardless
    of what it is?
  score: 0
  posted_at: '2026-11-19T18:24:09Z'
- id: '50564063'
  parent_id: '50563514'
  author: D_R_Farrell
  text: Figma is of course the UI&#x2F;UX design industry leader that we&#x27;re all
    familiar with, but the flaw in their primary vector editing tool has been its
    disconnect from code. They are adding-on code-related features, but those features
    will always be secondary to their ultra-powerful editor as the foundation of their
    business.<p>Onlook will always be code-native and caters to the ways designers
    will need to work with code specifically, not vectors. That means being local-first,
    but also flexible for the challenges and diversity of code that will have to continue
    to be maintained in the future.<p>Onlook will feel a bit light to start when compared
    to Figma 1:1 on every feature, but the foundation enables us to focus on the future
    of designers coding and generating assets with AI, not drawing vectors.
  score: 0
