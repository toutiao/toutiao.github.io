  author: D_R_Farrell
  text: We&#x27;ve definitely seen a lot of success from tools that have introduced
    a native plugin. And so we are definitely going to follow up with our own.<p>One
    thing that is a bit different about how Onlook is built versus other design tools
    is that we are local first. And a core part of that is allowing agents to be run
    locally, but also to allow agents to design on top of real codebases. So before
    we do a plugin, we are looking into making it easier for codebases to be put up
    in the cloud.<p>I definitely want us to build a plugin though. It does seem like
    a lot of designers are moving their workflows into the frontier labs desktop apps
    and we want to make sure that we can accommodate people&#x27;s preferences for
    how they like to design.
