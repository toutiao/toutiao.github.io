  content: "## Latest commit\n\n## History\n\n## Folders and files\n\n## Repository
    files navigation\n\n### Onlook\n\nThe developer tool for Designers Onlook is a
    free, local-first editor where designers craft exceptional experiences in code
    → Download today\n\n\U0001F468‍\U0001F4BB\U0001F469‍\U0001F4BB\U0001F468‍\U0001F4BB
    We're hiring engineers and designers in SF! \U0001F469‍\U0001F4BB\U0001F468‍\U0001F4BB\U0001F469‍\U0001F4BB\n\n中文
    | Español | Deutsch | français | Português | Русский | 日本語 | 한국어\n\n# An Open-Source,
    Visual-First Canvas for Code\n\nCraft websites, prototypes, and designs with AI
    on a canvas built for creative work. See your real app running live, shape it
    visually, and let your own agent write the code. An open-source alternative to
    Figma, V0, Replit Agent, Base 44, Webflow, etc.\n\n## Why Onlook\n\n- \U0001F3A8
    Built for design. Onlook is the open-source developer tool for designers. You
    see your real app running live on a canvas, explore ideas side by side, and shape
    the interface visually instead of from a terminal. Design apps, websites, posters,
    graphics, and more with your local fonts and assets.\n\n- \U0001F916 Bring your
    own agent. We don't ship our own model. Connect the Claude Code or ChatGPT/Codex
    account you already have, and that agent does the work inside your project. Plug
    in more tools through MCP connectors to bring all of the context you need to your
    creative workflow. Work on multiple design tasks at once across repos and pages.\n\n-
    \U0001F4C1 Works on your real repo. Onlook opens any Git repository on your machine
    and runs your own dev server, so what you design is your actual product, not a
    mockup that someone has to rebuild later.\n\n- \U0001F5A5️ A desktop app, local-first.
    Onlook runs on your computer. Your code stays on your computer, and the source
    build needs no Onlook account, cloud keys, or .env file.\n\n- \U0001F4E4 Share
    what you make. Export artifacts as self-contained HTML, PNG, JPEG, or PDF to hand
    off, review, or post.\n\n- \U0001F9E1 Open source. Apache 2.0. Read it, fork it,
    and customize it yourself (we'd love to hear how you customize it!)\n\n## What
    you can do with Onlook\n\n- Design on your real codebase Live app on an infinite
    canvas Mobile, tablet, and desktop frames side by side Safe worktree copy, so
    your folder is never touched Parallel projects as tabs\n\n- Live app on an infinite
    canvas\n\n- Mobile, tablet, and desktop frames side by side\n\n- Safe worktree
    copy, so your folder is never touched\n\n- Parallel projects as tabs\n\n- Design
    with your own agent Bring your own Claude Code or ChatGPT/Codex plan Ask about
    any element on the canvas Agent arranges the canvas for you (variations, states,
    flows) Reference images on the canvas\n\n- Bring your own Claude Code or ChatGPT/Codex
    plan\n\n- Ask about any element on the canvas\n\n- Agent arranges the canvas for
    you (variations, states, flows)\n\n- Reference images on the canvas\n\n- Sketch
    and share Artifacts for quick HTML sketches outside your repo Export to HTML,
    PDF, PNG, and JPEG\n\n- Artifacts for quick HTML sketches outside your repo\n\n-
    Export to HTML, PDF, PNG, and JPEG\n\n- Ship it Import a GitHub repo Start entirely
    new codebases from scratch One-press pull requests, from checks to merge\n\n-
    Import a GitHub repo\n\n- Start entirely new codebases from scratch\n\n- One-press
    pull requests, from checks to merge\n\n## Getting Started\n\n\U0001F5A5️ Download
    the Desktop App (Recommended) – The fastest way to get started with Onlook.\n\n-
    macOS (Apple Silicon · Intel x64) → Download\n\n- Windows – Coming soon. Join
    the Windows waitlist here and be emailed when we have updates.\n\n- Linux – No
    Linux artifact is published and we're still gauging demand for Linux. Join the
    Linux waitlist here and be emailed when we have updates.\n\n\U0001F9D1‍\U0001F4BB
    Build from source – SOURCE_BUILD.md covers building and running Onlook on a Mac.
    No Onlook account or cloud keys needed.\n\n## How it works\n\n- Open a project.
    Point Onlook at any Git repository on your computer, or import one. Your code
    stays where it is.\n\n- Onlook runs your app. It starts your own dev server locally,
    the same way you would from a terminal.\n\n- See it live on a canvas. Your running
    app appears in frames on an open canvas, so you can look at pages, sizes, and
    ideas side by side.\n\n- Design with your agent. Describe what you want in chat.
    Onlook hands the request to the Claude Code or ChatGPT/Codex account you connected,
    and that agent edits the real files in your repo.\n\n- Watch it update. Changes
    show up on the canvas as your dev server reloads, and Git keeps track of everything
    that changed.\n\n- Share the result. Export artifacts as self-contained HTML,
    PNG, JPEG, or PDF.\n\nBecause Onlook runs your project with its own tooling, it
    works with all web frameworks or languages your dev server already supports.\n\n##
    An example workflow\n\n- Start a new empty project by clicking the \"New Draft\"
    button in the upper left corner of the projects page.\n\n- Use the input box in
    the lower right corner of the screen to write what you'd like to be designed in
    Onlook.\n\n- Answer clarifying questions from the agent, and wait for it to build\n\n-
    Click to select individual frames for context in follow-up prompts, or double-click
    on a specific element to use the inline chat and guide the AI to edit that specific
    element.\n\n- Prompt more ideas on one or multiple designs until you're ready
    to share your work with a colleague.\n\n- Select the frame you'd like to share,
    and ask the agent to convert it into an Artifact for exporting.\n\n- Export the
    artifact as HTML/CSS or as a PNG using the export button in the upper right corner
    of the frame.\n\n- Paste the exported artifact in Slack, email, or any messaging
    tool.\n\n## Our Tech Stack\n\n## Contributing\n\nIf you have a suggestion that
    would make this better, please fork the repo and create a pull request. You can
    also browse open issues.\n\nSee the CONTRIBUTING.md for instructions and code
    of conduct.\n\nTo report a security issue, follow SECURITY.md instead of opening
    a public issue.\n\n#### Contributors\n\n## Contact\n\n- Contact us: Discord -
    Email\n\n- Updates: Twitter - LinkedIn - YouTube - Substack\n\n- Project: https://github.com/onlook-dev/onlook\n\n-
    Website: https://onlook.com\n\n## Looking for the previous version of Onlook?\n\n-
    Onlook v1 (web): the browser-based version lives on the v1 branch of this repository.\n\n-
    Onlook Desktop (Electron, original): the first desktop version is at onlook-dev/desktop.\n\n##
    Usage data\n\nOnlook collects product usage analytics to help us improve the app.
    In the official download they are on by default; a build from source asks first.
