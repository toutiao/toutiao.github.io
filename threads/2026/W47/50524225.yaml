    I&#x27;ve been going to DEF CON for about 25 years now, and I&#x27;ve had this
    conversation countless times.<p>But in 2026, tptacek says it best in the comments
    here: <i>At this point, who knows?</i><p>Are we still telling kids to learn programming
    languages to become software developers? Perhaps system design is a more reasonable
    skill set.<p>That said, because this is the time to say it: security is still
    important, and it&#x27;s not -- and shouldn&#x27;t be -- fully automated.<p>The
    toolchain is changing just like it always has. I remember when interpreted languages
    replaced compiled ones, and people said that interpreters solved security. Then
