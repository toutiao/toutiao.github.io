    your prompts, and a security researcher discovered this by putting decoy URLs
    into their requests which were accessed by MiniMax.<p>More importantly, many providers
    (AtlasCloud, Novita and StreamLake were named but there seems to be more implied
    in the blog post) have been rerouting requests to MiniMax servers on the backend
    and not processing their own prompts.<p>The obvious question is whether OpenRouter
    has done any auditing on their inference providers. Based on the researcher&#x27;s
