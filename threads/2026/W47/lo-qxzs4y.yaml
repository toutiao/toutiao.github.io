  title: TODOs JJ Style | Ben C
  fetch_status: success
  content: "# TODOs JJ Style \n \n \n\n \n \n\n    _______________________\n    <
    todo: fill out cowsay >\n     -----------------------\n            \\ ^__^\n             \\
    (oo)\\ _______\n                (__)\\ )\\/\\\n                    ||----w |\n
    \                   || ||\n\n \n\nI love using [JJ](https://jj-vcs.dev) and recently
    I’ve found a cool way to handle TODOs that works for me.\n\n## In-Tree TODO is
    Kinda Annoying\n\nUsually I’ll put them in a `TODO.md` file which is pretty standard.
    But, I forget about this file quickly and am not very good at remembering to cross
    stuff off. Also since it’s in-tree I’ll often not want to update it, and then
    forget to do so later.\n\n## Empty Commits to the Rescue\n\nJJ has a cool feature
    where you can make empty changes, and even write descriptions for them before
    actually doing work. So what if I just make all the stuff I wanna do later as
    empty commits?\n\n![A JJ tree showing a branch of empty commits, the root is called
    “private: TODO base” and has many empty children with descriptions](/_astro/jj-todo-tree.CbZTp8jv_2gvqxu.webp)\n\nPretty
    nice! When I want to start working on something I’ll rebase it out of my TODO
    tree and onto some other change.\n\nI need to rebase my “TODO base” forward when
    i make changes, but because it’s empty it will never have conflicts and can pretty
    easily move around.\n\nTODOs that depend on other TODOs also naturally fit here,
    I just make new empty commits on top of other empty commits.\n\n## Keeping Them
    Private\n\nI have `git.private-commits` configured to make sure nothing with the
    `private:` prefix will get pushed. This ensures my TODOs stay on my local system.
    Of course, there are benefits to not doing this.\n\n    # In Home Manager...\n
    \   \n    programs.jujutsu.settings.git.private-commits = \"description('private:*')\";\n\nAnyway
    that’s about it, not very ground breaking but something I like."
