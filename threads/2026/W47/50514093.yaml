  author: wyager
  text: The point of shooting in a log format isn&#x27;t to make the footage look
    a certain way; it&#x27;s to reduce the degree to which quantization&#x2F;clipping
    throws away information you want to have in post.<p>If you film with a standardized
    transfer function like HLG or S-Log3, you should be able to apply the inverse
    OETF in your grading software and work in whatever color space you want (linear,
    ACEScct, etc.). If you want, you can just compress to rec.709 there! There&#x27;s
    really no need to squash to rec.709 in the camera.
