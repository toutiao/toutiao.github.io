  author: KaiserPro
  text: 'Strap in children, you&#x27;re about to get a stream of consciousness from
    someone who was there in the old days.<p>Unless I have missed something re.709
    is 8bit. rec 7.09 is the colourspace that most &quot;full HD&quot; screens can
    sorta reproduce in an &quot;accurate&quot; way (spoiler, most of them dont, but
    thats another issue. )<p>The author talks about cineon which is&#x2F;was a 10
    bit log format meant to record film &quot;properly&quot;. From what I remember,
    and how it was explained to me was: we want the detail in the blacks, because
    thats where we are keen to make changes. I never was involved in actual film processing
    so I don&#x27;t know what the frequency response of film is, all I know was that
    for the longest time it had greater dynamic range than digital(depending on the
    stock you were using).<p>Now what the author misses out in the talk about RED
    cameras is that actually their colour was a bit dodgy. Mind you, so were a lot
    of the other cameras at the time. (a lot of people were filming on canon 5dmk3,
    and then a whole range of other weird cameras)<p>With film, you&#x27;d send it
    to a DI lab to get scanned. You&#x27;d sit with the colourist, who&#x27;s team
    would have conformed the base grade to something normal, and then the colourist
    would do magic according to what you wanted (assuming you had enough headroom)<p>For
    film, you&#x27;d ever print out to film again, so keep that 10&#x2F;12bit colour,
    or dump out to DCP, which was, I seem to recall jpeg2000 (much like RED....)<p>Now
    for most of us, we don;t have that kind of cash, which, I suppose is the point
    of the article.<p>So, advice:<p>1) don&#x27;t shoot with RED. They are bastard
    cameras, some of them are colourblind (see the hobbit)<p>2) turn zebras on in
    your camera (they give you a visual warning of over&#x2F;under exposed areas in
    your shot)<p>3) use the live histogram. If you have massive peaks somewhere, you
    need to adjust.<p>4) light properly. film looks like film, mostly because of the
    lighting allowing you to grade the way you do.<p>5) shoot a macbeth chart in your
    scene, that way you can use the auto tools to make a base grade.<p>there is nothing
    wrong with log. Out of the camera it looks flat and a bit grey. find the macbeth
    chart, use the tooling to capture the output and set a base grade. Then drag a
    LUT in to make it look the way it should (there are loads of premade LUTs now,
    so go and grab a few and try them out. )<p>Digital cameras are wonderful, and
    with a bit of skill allow you to shoot sumptuous looking stuff without an entire
    team of set <i>and</i> in post. Log is fine, its a reasonable way to store the
    14+ bits of colour that mp4&#x2F;h265 cant really render. just make sure you have
    davinci or what ever adobe has set up to receive and correct the colour'
