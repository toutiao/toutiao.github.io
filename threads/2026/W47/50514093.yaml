  author: klodolph
  text: Yeah. I’m not really a professional here but I would say sensitometry is something
    of an interest of mine. Take what I’m saying with the appropriate grain of salt.<p>Your
    camera has some sensor which records some range of values. The range is a lot
    wider than your monitor can reproduce and generally follows some curve up to a
    maximum value, where the highlights clip.<p>Log is something of a fantasy in that
    it represents an idealized, mathematical idea of what your camera does, but it
    does not really correspond to what the sensor does or what the monitor displays.
    You can convert your video to log, or from log, but the log data itself is only
    really useful as an intermediate step when post-processing. I don’t think you
    need to capture in log. I would just go for some “regular” wide like Canon’s Wide
    DR.<p>YMMV, I am a little old-school about these things and there is a lot of
    stuff that I prefer to do in-camera. (Be warned that while doing things in post
    gives you flexibility to undo your work and change your mind, there are a lot
    of things you can’t reasonably do in post… even things that seem basic like white
    balance are better to do with lighting or filters, and if you don’t understand
    the sensitometry then you can easily end up with footage that you can’t rescue
    in post.)
