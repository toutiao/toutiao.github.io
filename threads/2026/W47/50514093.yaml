  author: KaiserPro
  text: log _was_ a compromise. It allowed one to do film scanning at the right level
    between precision and storage.<p>cineon, which is where you could argue that log
    came from, was a 10bit format to represent something that could have easily been
    16bit. The compromise was that you kept the precision in the blacks for recovery,
    but with the ability to actually handle the files on hardware at the time. (bear
    in mind that realtime 10bit colour playback at 2&#x2F;4k required a rack full
    of harddrives up until at least 2010 (see baselight 8 hardware))<p>I would hope
    there are 14 and 16 bit formats that come out of the camera that allow you to
    have some sort of linearish recording. Now that sensors are actually capable of
    capturing a dynamic range greater than top end film stock. However light isn&#x27;t
    linear, so log is actually closer to how we see than linear is.<p>What ever it
    is, there are many levels of hidden LUTs to get the camera to record in a way
    that its meant to. what ever you are doing involves fiddling someone else LUTs
