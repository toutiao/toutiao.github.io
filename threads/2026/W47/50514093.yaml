  author: manoDev
  text: It&#x27;s an issue because fixing exposure in post (= raising gain) will raise
    the noise floor as well. Since most noise is between shadows to midtones, this
    exaggerates artifacts from the footage (luma and chroma noise). It also creates
    more work in post since you don&#x27;t have consistent footage that maximized
    the dynamic range to begin with.<p>In the end, these various log encodings are
    manufacturer&#x27;s hacks to try and get smoother highlight rolloff independent
    of the skill of the operator.
