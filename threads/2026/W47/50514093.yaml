  author: whizzter
  text: 'I can kinda see &quot;both sides of it&quot;.<p>Technically, the issue if
    I&#x27;m getting is that the camera physically (or in teh encoding) will be better
    at capturing within a certain range that you adjusted for, having parts above
    or below that isn&#x27;t capture properly and if material is in those above or
    below ranges the output after grading will not have a good range of values (ie
    possibly introducing banding).<p>Underexposing probably feels like a &quot;safe
    fix&quot; rather than adjusting properly all the time since with more limited
    ranges it&#x27;d be easy to &quot;wash out&quot; with overexposure (irreparably
    removing things due to clipping), and with budgets cut it&#x27;s probably easy
    to just skimp on a lot of these &quot;details&quot; if the system &quot;is capable&quot;.<p>So
    it&#x27;s budgets&#x2F;speed&#x2F;creativity at shooting time vs material that
    might just not be good to work with in the end. (Also as he mentions some of these
