  author: PennRobotics
  text: 'Think about the Zoom F3 recorder (prosumer equipment) as quasi-Log.<p>The
    F3 has dual preamps: one low-gain and one-high gain. For quiet passages, you can
    really pick up a lot of detail with a low noise floor. For loud audio, the low-gain
    preamp takes over to avoid clipping (although the noise floor abruptly raises,
    so very subtle sounds previously audible to the high-gain preamp would be lost).
    Both preamps have a bit less dynamic range on their own compared to a professional
    recorder, but by having two gain stages, it can approximate the same dynamic range
    as, say, a Sound Devices recorder.<p>I don&#x27;t know for sure, but I&#x27;d
    expect (due to the nature of the ADC chips in the F3) that if you slowly increase
    the amplitude of a reference sine wave from -120 to +28 dBu, you&#x27;d see a
    lot of small increments in the waveform peaks while the high-gain preamp is active
    and then large increments until audio starts to clip at +24 dBu.<p>-----<p>The
    audio post-production professional&#x27;s equivalent of this log rant would be,
    &quot;Stop sending 32-bit floating point 192 kHz audio to post! Serious individuals
    only send unprocessed 24-bit WAV-format ISO tracks, at 48 kHz or---with prior
    approval in specific video settings--- 48.048 kHz.&quot;'
