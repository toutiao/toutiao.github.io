  author: voidpointer
  text: |-
    This is one of those problems that shouldn&#x27;t exist in theory, but reality doesn&#x27;t care.
    Self-taught videographers who may have a background in still-photography using camera-RAW are used to a workflow that captures (mostly) in linear space. They were limited by ISO noise but, with modern sensors, other than that they had so much data in the shadows that the only thing they had to fear was blown-out highlights. Hence the tendency to underexpose and just pull out the details in lightroom or whatever. They treat log as some kind of camera-RAW for video. Some camera manuals (Sony?) will tell you to &quot;overexpose&quot; log by one or two stops due to where the log-curve places midlle&#x2F;18% gray, and that is not what feels &quot;normal&quot; to those users in their viewfinders&#x2F;displays...
    If it is not a well-managed production, all other sorts of metadata problems compound. Source material may just be delivered as generic MP4 files that don&#x27;t necessarily carry all the information people are used to from the still&#x2F;RAW world, where your &quot;digital negative&quot; has all the information you could ever wish for in one neat place...
