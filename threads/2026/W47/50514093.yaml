  author: fps-hero
  text: I think it’s necessary to separate the art from the science.<p>A CCD captures
    light with a fixed exposure time and analog + digital gain. This gives you a raw,
    or in photographer speak, RAW frame. The issue being that the required bandwidth
    to store RAW frames of video is simply too high to be practical.<p>So, you need
    some form of compression. RED is a great example of seeing the problem and solving
    it. Now the issue is compressed RAW video is a patent minefield, and just recorded
    video equally so.<p>And so, we are resorting to tricks such as “log raw encoding”,
    or “just get the videographer to capture it right in the first place” just to
    get around the limitations of the storage format.<p>Honestly capturing images
    and displaying them accurately is such a mess that it’s a miracle that we have
    more than 8-bits of colour, and that was hard enough as it is. From a RAW Bayer
    frame to what you see on a monitor preview display is multiple layers of white
    balance, gain, equalisation, linear to gamma, and whatever your monitor decides
    to do with the digital signal it’s fed.
  score: 0
