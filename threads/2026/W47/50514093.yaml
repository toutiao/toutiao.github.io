article:
  url: https://digitalfilms.wordpress.com/2026/11/15/stop-filming-in-log/
  title: Stop Filming in Log – digitalfilms
  fetch_status: success
  content: |-
    [![](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_01.jpg?w=1024)](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_01.jpg)

    I may ruffle some feathers with that title; but after years as a colorist, log-encoded clips can be an unnecessary challenge. Using camera log profiles is often a crutch for location and studio set-ups. [Or it’s simply used because the internet tells you log = film. That’s just not true](https://digitalfilms.wordpress.com/2025/08/15/the-film-look-myth/). Many times a videographer will shoot log incorrectly – generally underexposed – expecting to ‘fix it in post’. The same issues apply to shooting in camera raw or HDR.

    In the video world, camera raw was introduced by the [RED Digital Cinema Camera Company](https://digitalfilms.wordpress.com/2012/02/18/a-red-post-production-workflow/) in 2007, borrowing from still photo concepts. Log (logarithmic) videography came to the forefront when [ARRI introduced the Alexa in 2010](https://digitalfilms.wordpress.com/2010/11/04/arri-alexa-post-part-1/), which offered a Log-C profile. ARRI’s camera raw format wasn’t post-friendly, so Log-C was a better fit. The goal of both manufacturers was to shoot video with a wide dynamic range that could be recovered and adjusted in post production.

    ARRI was able to do this with a mathematical approach that resulted in Log-C, which looked flat or with very, low contrast when viewed on a monitor. To correct this, a LUT file (color look-up table) was applied in post (or on-set) that used the inverse math to correct the image. However, ARRI cameras were and are generally used where there’s a specific color pipeline and workflow that’s discussed between production and post. A log image is also designed with a ‘sweet spot’. So if you under or overexpose the image, you will still encounter issues when you grade (color correct) the video.

    Other camera manufacturers followed suit, including even Apple and its iPhones. The down side of this covers many facets. First, there are a plethora of inconsistent log schemes among the camera manufacturers. Second, the workflow and discipline in big budget shoots doesn’t usually exist in the kind of run-and-gun shoots that use these smaller form-factor cameras. On many projects that I post, I don’t know the videographer, have never had a conversion prior to the shoot about the grade, and almost never get notes as to how the cameras were set up. This becomes very problematic with Sony camera in particular. But they are not alone.

    [![](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_04.jpg?w=1024)](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_04.jpg)

    The earliest digital films were shot using [Sony F900 (modified by Panavision)](https://pro.sony/en_NO/products/digital-cinema-cameras/hdw-f900r) and [Thomson Viper FilmStream cameras](https://en.wikipedia.org/wiki/Thomson_Viper_FilmStream_Camera). These gave us films like _Attack of the Clones_, _Collateral_, _Zodiac_, and _Benjamin Button_. The Sony image was basically a standard Rec. 709 profile, whereas the Viper used a different color science. While the image wasn’t log or raw as we know it today, it did generate a green cast that had to be corrected in the color grade.

    [![](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_02.jpg?w=1024)](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_02.jpg)

    In reality, film doesn’t have an equivalent to log or raw. Motion picture film negative is typically shot with proper exposure and then color corrected when going to print. A film timer does the color correction, but the tools and looks are nowhere near as surgical as modern video color correction. While film negative might be scanned in the Cineon color space, this isn’t exactly the same as video log. If the film was transferred using some type of film scanner ([like the modern Cintel Scanner from Blackmagic Design](https://www.blackmagicdesign.com/products/cintel)), then the result will be an image that’s close to standard or HDR video.

    [![](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_03.jpg?w=1000)](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_03.jpg)

    The Alexa’s introduction created many copy-cat cameras that each used different color profiles in log. These all required different LUTs (color look-up tables) to get you back to a Rec. 709 image. Quite frankly, I haven’t been too happy with the majority of these. The ARRI and Panasonic implementations look pretty good to me. Everyone else? Not so much.

    Unfortunately, Sony made things even more confusing by introducing various profiles, including camera raw, s709, several iterations of S-Log, S-Cinetone, and, of course, Rec. 709. I’ve worked various projects shot in S-Log and it’s always a toss-up whether or not you can grade a good-looking image from the footage. [Of these options, I like S-Cinetone the best](https://pro.sony/s3/2020/03/24095333/S-Cinetone-whitepaper_v2.pdf). [It can make a wonderful image](https://philipbloom.net/blog/fx9/).

    [![](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_06.jpg?w=1024)](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_06.jpg)

    From the [WhoIsMatt website](https://whoismatt.com/slog3-vs-s-cinetone-which-picture-profile-should-you-choose/), “According to Sony, the base S-Cinetone curve is Rec. 709, but adds some filmic qualities. It has high contrast tone in low luminance levels and low contrast tone in the high luminance levels. The black level is lower than s709 and Rec. 709. With a low highlight contrast, S-Cinetone will have softer and lighter highlights, but higher contrast levels in low luminance levels will give you a more saturated look.”

    Case in point. I’m currently editing and grading a project shot primarily with Sony A7S3 and FX9 cameras using a range of color settings. Some low contrast, some S-log of some sort. Zero info from the videographer. I’ve tried various Sony LUTs and color space conversions and none look as good as simply grading the shots manually. In fact, when I do apply a Sony LUT, I pick up noticeable noise artifacts in the shadow areas that simply isn’t there when I grade the shot without using a LUT.

    [![](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_05.jpg?w=1024)](https://digitalfilms.wordpress.com/wp-content/uploads/2026/10/df202656_nolog_05.jpg)

    This brings us to camera raw. Most users will only deal with camera raw from either [RED](https://www.reddigitalcinema.com) or [Blackmagic Design cameras](https://digitalfilms.wordpress.com/2024/04/04/blackmagic-cinema-camera-6k-goes-full-frame/). Each take different approaches, which have evolved over time. While camera raw can be useful in post, it’s not essential. If you shoot correctly with 709 in mind, then the raw result will fall right into line and be easily correctable, even if you don’t adjust the raw settings.

    If you question the idea of using Rec. 709 under the false belief that it’s only limited to 8-bit, you would be mistaken. [Rec. 709 can also be 10-bit, assuming the camera supports it and you are using the proper codec.](https://doom10.org/rec709-vs-rec2020-color-standards-explained/) Many of the small cameras record an H.264 or H.265 file. These files can be 8 or 10-bit. However, if you record in ProRes, ProResHQ, or ProRes4444, the signal can be 10-bit or higher. On top of that, these MP4 files (H.264/5) are highly compressed. This means if you record a log signal and then ‘expand’ it to full range, you run the risk of noise. Recording standard video in H.265 (10-bit) and then transferring it to ProRes for post will make your life so much easier in the edit and in the grade.

    I’ll wrap this up with HDR (high dynamic range). Understand that HDR video is not the sa
