  author: m4rtink
  text: This was mentioned on a talk commemorating the one light day for Voyager 1
    in the local planetarium.<p>While it is right what was generally said about the
    RTGs loosing power over time are the limiting factor,  its not due to not having
    enough power to not run the transmitter and&#x2F;or the computer.<p>Apparently
    its about the propulsion system, which is necessary for antenna pointing needing
    some minimal heating at both the fuel tank, fuel line and the necessary thrusters
    or else the hydrazine will freeze.<p>And once that happens, the thrusters will
    stop working, resulting in the antenna no longer pointing to Earth &amp; loss
    of contact.
