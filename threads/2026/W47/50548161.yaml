  author: binary0010
  text: Vibe coded means that you don&#x27;t oversee the code, review, it or otherwise
    do anything in regards to underlying code quality and managability, as well as
    no manually double-checking anything for accuracy or correctness.<p>So like internal
    isolated tools are often vibe coded. While large&#x2F;real projects typically
    use a form of agentic engineering.<p>So for this project it appears to be vibe
    coded &quot;hey Claude do all the deep research needed to build XYZ from scratch&quot;,
    and then no review or double-checking to clean up the missing&#x2F;hallucinated
    components&#x2F;etc.<p>So I know for me, agentic engineering is not that relevant
    - nearly all of us do it to varying degrees - but a basic Claude vibecode just
    means this is probably extremely inaccurate so not that interesting to look at.
