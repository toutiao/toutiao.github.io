  author: raj-shekhar
  text: 'I tried to find the exact root cause. NASA said they could not determine
    the cause of the chip failure with certainty, so we can only speculate.<p>This
    is what I found as part of my research:<p>NASA: &quot;Engineers can&#x27;t determine
    with certainty what caused the issue. Two possibilities are that the chip could
    have been hit by an energetic particle from space or that it simply may have worn
    out after 46 years.&quot; <a href="https:&#x2F;&#x2F;science.nasa.gov&#x2F;blogs&#x2F;voyager&#x2F;2024&#x2F;04&#x2F;04&#x2F;engineers-pinpoint-cause-of-voyager-1-issue-are-working-on-solution&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;science.nasa.gov&#x2F;blogs&#x2F;voyager&#x2F;2024&#x2F;04&#x2F;04&#x2F;engineers-...</a><p>IEEE
    Spectrum, citing project scientist Linda Spilker, reported that the memory readout
    showed &quot;a stuck bit, fixed at the same binary value&quot; in that 256-bit
    chunk: <a href="https:&#x2F;&#x2F;spectrum.ieee.org&#x2F;voyager-1" rel="nofollow">https:&#x2F;&#x2F;spectrum.ieee.org&#x2F;voyager-1</a><p>EE
    Journal reported JPL&#x27;s chief engineer naming the part as an RCA CD4061A,
    a 256 x 1-bit CMOS SRAM. Losing it took out 256 of the data computer&#x27;s 8,192
    words, which matches NASA&#x27;s &#x27;about 3%&#x27;: <a href="https:&#x2F;&#x2F;www.eejournal.com&#x2F;article&#x2F;jpl-software-update-rescues-failing-voyager-1-spacecraft&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;www.eejournal.com&#x2F;article&#x2F;jpl-software-update-rescue...</a>'
