  author: IAmNotACellist
  text: I&#x27;d be fascinated to know the exact nature of the failure. What analog
    processes cause a CMOS memory IC that we like to think of as being discrete to
    be consistently wrong at reading its stored values? I&#x27;d like to know all
    the way down to the interaction between the gates and traces. Did some pathway
    erode due to constant interchange of charge carriers? Did thermal cycles or stress
    cause one of the mechanical interconnects on the package to fracture and no longer
    conduct? If so, which one?<p>According to AI, one type of failure mode in those
    early aerospace CMOS chips was sudden parasitic current in the PNPN junction being
    caused by a high energy particle, shorting paths to ground melting metal. Though
    that sounds rare. Another option is a total ionizing dose of radiation over time,
    which creates electron-hole pairs in the gate oxide, leading to trapped positive
    charge. That makes NMOS get closer and closer to turning on when they shouldn&#x27;t,
    and PMOS requiring more voltage to turn on. It&#x27;s fascinating to me that there
    came a specific moment in time when the chip managed to work, and the next clock
    cycle it didn&#x27;t. I&#x27;d <i>love</i> to see the I_D vs. V_GS charts showing
    a before and after. So I had Claude make a plausible approximation. You can too
    by asking your AI agent of choice by basically just pasting in my comment!
