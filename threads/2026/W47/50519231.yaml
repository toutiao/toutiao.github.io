  author: anticorporate
  text: I have had a MyQ-enabled garage door opener for about a month now. I wanted
    a dumb one, but the installer company who replaced the garage door didn&#x27;t
    offer one. Instead, it&#x27;s just sitting there, denied Bluetooth and WiFi access
    until I get around to hooking up the z-wave dry contact relay controller (or perhaps
    ratgo, but I already have a spare relay sitting around).<p>A few weeks ago, I
    noticed my Apollo-1 Air quality sensor was seeing some strange behavior in the
    basement. Home Assistant showed an unexplained temperature spike and humidity
    drop a little before 1am.<p>I managed to figure out from other sensors that nothing
    was actually awry (no spikes in draw of nearby devices, no telltale gas signatures
    of the water heater kicking on, no motion or CO2 indicating human or other large
    animal presence). Was the board malfunctioning? Fortunately the device has an
    internal temperature sensor and an ambient sensor which are separate. Logging
    confirms the temperature spike originated on the board, probably from the WiFi
    chip.<p>But, why?<p>It turns out, after inspecting the signal a bit more, than
    the MyQ was broadcasting so loudly between the WiFi and BLE, screaming for someone
    to talk to it, that my air sensor was having to increase its power to still be
    able to communicate over all the noise. Switching to a different channel for the
    crappy old downstairs AP fixed it, but still, c&#x27;mon!<p>I&#x27;m a little
    wary of connecting any sort of ingress&#x2F;egress to my home to the network at
    all, even locally, but an honest appraisal of the basement is that smashing a
    window is probably a much bigger threat model than hacking the door opener. Or
    in other words, <a href="https:&#x2F;&#x2F;xkcd.com&#x2F;538&#x2F;" rel="nofollow">https:&#x2F;&#x2F;xkcd.com&#x2F;538&#x2F;</a>
