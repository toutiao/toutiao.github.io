  author: ubermonkey
  text: Years ago, the combination of my forgetfulness and our urban address led to
    some thefts -- turns out, the garage is far more secure if you remember to close
    it.<p>I looked around for some kind of device that would close it automatically,
    which apparently doesn&#x27;t exist -- with good reason, honestly. What I found
    was a weird little IoT box that functioned as a garage door opener, and which
    I could configure with an app on my phone to yell at us (via notifications) if
    we left the door open for more than 5 minutes.<p>An unsought side benefit that
    nevertheless became handy was that we could now control the garage door with our
    phones.<p>That app was, initially, pretty straightforward and clean -- but over
    time, fucking ADS crept in. I was about ready to shift platforms to avoid that
    crap when we moved across the country. We lived in our new place first in a rental
    while we house-hunted, so I did nothing there, but I absolutely planned to find
    an ad-free owner-respecting platform for my garage needs in the new house.<p>Except,
    well, the house we bought had (has) a pretty dang new opener, and it&#x27;s delightfully
    almost-silent, and it has the MyQ stuff <i>built in</i> already. So I&#x27;m right
    back where I started, cursing these craven weasels every time I use the app to
    get into the garage.<p>Somewhat ironically, though, our need for this tool has
    flipped. Now we live in a very secure neighborhood -- kids leave their bikes on
    their front lawns, etc -- so the &quot;yell at me if I leave it open&quot; function
    isn&#x27;t as important. OTOH, since I haven&#x27;t been able to find a suitable
    garage door opener that will mount cleanly on my motorcycles, using the phone
    to get into the garage has become the default.
