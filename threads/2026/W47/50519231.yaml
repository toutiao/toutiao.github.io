  author: dj68k
  text: 'Chalk me up to another happy user of Ratgdo. I got one of the older ESP8266-based
    ones whose Homekit firmware has been in &quot;maintenance mode&quot; by the developer
    due to its board having limited RAM and processing power to do the things they&#x27;re
    doing with the current boards. That was a bummer to find out since I&#x27;d had
    the thing for less than a year and I was using the &quot;dry contact&quot; system:
    manually wired magnetic switches on the door to tell the board whether the door
    is up, down, or in a state between (opening or closing). It&#x27;s a very, very
    old garage door opener.<p>Since the code was put in a &quot;best-effort basis&quot;
    for future updates, it&#x27;s gone from version 2.2 to 2.2.6 with numerous fixes.
    Most notable was software-configurable &quot;debounce&quot; functionality which
    finally solved my problem with the door tripping the magnetic reed switches several
    times quickly when the door comes to a stop and confusing the board about its
    current up&#x2F;down status.<p>I bring it up because I have tremendous enthusiasm
    for people who take an idea, a cheap microcontroller, and put together a solution
    for people who prefer to stick with older, simple appliances but still want some
    sort of smart functionality. People who &quot;make cool stuff and put it on the
    internet.&quot; That the creator disclosed that he&#x27;s putting his focus on
    the newer boards and will maintain&#x2F;fix issues with the older ones on a &quot;best-effort&quot;
    and then actually does it... it&#x27;s fantastic. Because of this continued support
    and fixes, I can&#x27;t recommend Ratgdo boards enough.'
  score: 0
