  text: I think an appreciation for static typing comes once you have to start working
    with code others wrote. I used to write a lot of clojure in my free time, but
    I think I liked it more because I was the only developer on those projects.<p>Working
    professionally in dynamic languages, especially those that use maps in place of
    objects&#x2F;records, I would spend a lot of time trying to figure out which keys
    were present in various input maps. Were they always available or only sometimes?
    I could either add verify checks at function callsites or trace the map all the
    way through my code and hope it didn&#x27;t originate from an undocumented API
    response.<p>A few years ago, we started migrating our code from Elixir to Scala.
    That involved a lot of work creating case class &quot;schemas&quot; for many records
    that used to be represented by maps. But now it&#x27;s clear at dev time what
    data each function receives as input. What fields are required and which are optional.
    I can write a quick bugfix in a large module that someone else wrote without spending
    a full day tracing data paths and looking at runtime traces.
