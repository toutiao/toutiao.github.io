  author: dapperdrake
  text: Clojure and hylang (python) help with understanding threading macros (-&gt;
    …), so basically more readable shell pipelines.<p>Hylang also had a good take
    on anaphoric macros in relation to threading macros.  Clojure makes it more obvious
    that explicitly passing in the anaphoric symbol at the call-site is better for
    maintainability.  This offers threading with arbitrary argument positions instead
    of forcing first or last position.<p>Clojure transducers finally broke the ice
    on common lisp series.  The CL side of this is horrifying.  SBCL seems to have
    dropped its sb-series contrib module.  But it moved us far enough along that we
    now have parenscript-series.  So upside all around.<p>Don’t know enough Fennel
    (Lua) or Elixir (Erlang) yet, to have any useful comments there.
