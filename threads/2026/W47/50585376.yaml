  author: podgorniy
  text: The interesting thing about Clojure, for me, is that for all its beauty and
    power, it’s so simple that there isn’t much variety in the articles you can write
    or the “gotchas” you can cover for a wide audience. Niche stuff that assumes you
    already know Clojure doesn’t catch on with a wider audience. Its strong points—“everything
    is data,” “REPL development,” “immutability and strong primitives,” and “paradigm
    shift”—get repeated so often that they become noise people just filter out.<p>There
    isn’t much room for yet another framework or another way to work with data (I’m
    looking at you, Node.js), so there isn’t much to talk about or write articles
    about.<p>In other words, the efficiency and simplicity of the language act as
    a barrier to its spread in a world where only repeated mentions get through. IDK,
    maybe this is for the better after all.
