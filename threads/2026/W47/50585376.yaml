  author: cypherpunk666
  text: I like Clojure &amp; Rich. And “it depends” and “everything is a trade-off”
    are true. But! The DB-25 vs. DB-9 example is bad, when he says adding a pin for
    each new feature is the metaphor, and it shows how static typing is bad. Remember
    that those connectors also require protocols to match across them. The do not
    in face restrict what the protocol is. DB-9 has been used for god knows how many
    different purposes, some utterly physically inconpatible. The only point is that
    he misses the fact that if you remove complexity (eg static typing) from one place
    to make it easier, it will just show up elsewhere (bugs, or more testing). There
    actually is a lot of essential complexity that cannot be magically dismissed.
    And to say coding for space proves static typing is bad (I am hyperbolizing his
    poibt prrhsps) is dumb given Arianne V88, sheesh. And you can bend a system to
    do unanticipated things without them breaking? Yeah, until the time you do that
    AND IT BREAKS. It is also kind of very wrong that static types help with getting
    an algorithm (eg hash table) right, whereas they are very useful for getting the
    shapes of information programming data right. Look at why people got sick of json-with-no-schema.
