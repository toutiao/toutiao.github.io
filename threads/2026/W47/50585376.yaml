  author: dapperdrake
  text: 'A little bit.<p>Clojure is a lisp-1 which, surprisingly, feels better to
    use than a lisp-2.  Much more intuitive.  (You can kind of also have a function
    call returning a function in the first position of a list and it just works.  Common
    Lisp doesn’t like that at all and you need funcall or apply.)<p>The immutable
    data structures and better array and hashmap syntax and ergonomic hashmap argument
    destructuring remove a lot of mental overhead.  Kind of like Python or JSON-in-Javascript.<p>Having
    slight syntax variation like square brackets for let bindings and one less level
    of nesting in let bindings makes it easier to read.  Still homoiconic, though.  So
    you get the best of both worlds.<p>The hygenic macros helped me design better
    anaphoric macros.<p>EDIT: typo'
