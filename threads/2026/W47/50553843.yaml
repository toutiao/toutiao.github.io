  author: nilkn
  text: There is a real scenario, whose probability I cannot accurately assess, in
    which the first company to build &quot;true&quot; superintelligence will essentially
    capture the bulk of the entire US economy -- and that it will do so faster than
    any government can meaningfully intervene. This superintelligence is not a product
    sold in a chatbot, but rather the internal capability represented by their most
    advanced unreleased models, mostly without alignment, running on the world&#x27;s
    largest GPU clusters, coordinating millions of copies. In this scenario, they
    don&#x27;t capture the economy simply by selling tokens, but by owning the internal
    capability to create (or replicate) any technology, product, or digital business
    on-demand faster and more cheaply than any other organization on Earth. Selling
    chatbot tokens would just be the &quot;bootloader&quot; to a future phase in which
    Anthropic simply enters into and takes over most markets faster than anyone else
    can do anything about it.<p>If possible to do, this is a vastly superior strategy
    to selling tokens, since token consumers can swap out token vendors. But if you
    simply recreate their entire product and technology lineups from scratch, faster
    and cheaper, and capture all their customers with superior products and prices
    (at least at first), then you own the market rather than selling tokens into it
    amongst other token vendors.<p>None of this is guaranteed to happen. But I do
    not see a way to rule it out as a possibility.
  score: 0
