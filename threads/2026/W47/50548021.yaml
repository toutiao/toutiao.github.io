    designed to go with the launch of the Nvidia&#x2F;Microsoft RTX Spark machines.<p>(Good
    Sam Witteveen video about it: <a href="https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=WJpeW9lCSUM"
    rel="nofollow">https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=WJpeW9lCSUM</a>
    )<p>But it would be good to see Microsoft themselves distilling an open weights
    model.<p>Like any vendor with a profit motive they do have to decide the obvious,
    though: how do you make money from it, when right now it could cost several hundred
    million dollars to train (even if you adjust the training of a larger proprietary
    model so you can distill the smaller one from it)?<p>There is, essentially, no
    way to keep an open weights model from being copied&#x2F;distilled&#x2F;extracted,
    and IMO what that tends to suggest is that open weights models will essentially
    gravitate to sort of uncontroversial, &quot;standard library&quot; tasks.<p>So
    I think it also means that Microsoft&#x27;s approach on open weights will ultimately
    be the same as Apple&#x27;s: they will focus their efforts on LLMs that meaningfully
    add function to their OS and can be decapitated to make similarly useful decision
    models.<p>Put another way: given the geopolitical angle of the last few weeks,
    I think it is possible that the open weights coding models we have now may be
    among the best we will ever get, until the nearly inevitable GPU&#x2F;tensor hardware
    glut arrives.<p>In the meantime, something else is clearly happening: much broader
    competition in the &quot;good enough&quot; models category, which is what we need
    to drive down the cost of inference hardware such that open source and open weights
    are feasible over the longer term.'
