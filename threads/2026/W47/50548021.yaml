    Hi,<p>John here from the team that built Microsoft Decision 1 and 1.1.<p>We compare ourselves to other decision models in our blog post on Microsoft&#x27;s Command Line blog from November 17 [1]. We name all of the public benchmarks we evaluated against in the post, and provide a breakdown by category.<p>We also are on the Artificial Analysis leaderboard, which is an independent third party assessment. On AA, we score 68, above Gemini Decision 1, GPT-6 Luna Decisions, and Jev 1.14. [2]<p>Our previous MD1 model from October is also benchmarked on JevBench, another independent benchmark for decision models. [3] On JevBench, we are 9th place for API models, ahead of Gemini Decision 1 and Jev 1.14. We look forward to seeing how the new MD1.1 scores on JevBench.<p>With regards to cost: Our models are the same price as Jev on a per-token basis. However, on both JevBench and Artificial Analysis benchmarks, our models use fewer tokens per task than Jev. For example, our cost score for MD1.1 on Artificial Analysis at $140 per 1M tasks compared to Jev&#x27;s $156 and Gemini&#x27;s $345. There are similar stats for latency, where our new MD1.1 model is 2x faster than our previous one.<p>[1] <a href="https:&#x2F;&#x2F;commandline.microsoft.com&#x2F;microsoft-decision-model-ga&#x2F;" rel="nofollow">https:&#x2F;&#x2F;commandline.microsoft.com&#x2F;microsoft-decision-model-g...</a>
