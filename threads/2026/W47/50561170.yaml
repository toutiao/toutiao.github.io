  author: m-i-l
  text: One of my children made some iron gall ink at school a few weeks ago, following
    Jane Austen&#x27;s personal recipe. They were fortunate enough to have a specialist
    researcher in historic inks guide them through the process, which must have made
    it a lot easier. The oak galls were collected locally (they had to get ones with
    holes which showed that the gall wasps were gone, although I think that was for
    conservation reasons), used a rusty nail for the iron oxide, cloves, gum arabic
    (not local:-), and a mix of small beer and strong beer. They tried it out in art
    class a couple of weeks later and it worked pretty well by all accounts.
