  author: tombert
  text: Man it gets worse every time I do it too, since now I write by hand so infrequently.<p>Pretty
    much as soon my mom bought me my own cheap laser printer to use when I was ~15,
    I&#x27;ve typed as much as I could because teachers genuinely could not read my
    handwriting when doing homework.  I got pretty good at using the free version
    of MathType in conjunction with OpenOffice.org to do my math homework (before
    I eventually learned TeX), all my reports were typed, and teachers were happy
    because they didn&#x27;t have to try and decipher what the hell it was that I
    was writing.   This was 20+ years ago or so, so they didn&#x27;t have to worry
    about LLMs doing my homework for me.<p>I have kept this pattern up into adulthood,
    to a point where I write with my hands so infrequently that it genuinely baffles
    me at how much my handwriting has degraded every time I am forced to write something
    by hand (e.g. filling out a form), as I am getting more and more out of practice
    as I age. I type faster than pretty much anyone I know, and as a result it&#x27;s
    rarely been much of a hindrance to me, fortunately.<p>Amusingly, I remember in
    fourth grade my teacher (who was a genuinely very kind and nice lady) pulled me
    aside and said something like &quot;Tom, you&#x27;re a smart guy, and I think
    you can do really well when you grow up, but if you don&#x27;t work on your handwriting
    then it&#x27;s going to hold you back in life because no one will be able to read
    what you write&quot;.  Even at the time computers were pretty well entrenched
    into the life of basically everyone in the western world, so I didn&#x27;t really
    agree with her.  I ended up being right, learning to type was probably the better
    time investment than penmanship, though I do think her heart was in the right
    place.
