  author: baruz
  text: The most difficult part about making iron gall ink is crushing the oak apples
    enough to where you can extract the acids. The “folk science” of iron gall ink
    is backed up by later scientific analysis. The original rich black color <i>does</i>
    fade to a beautiful brown, and should only be used on parchment or vellum, as
    the gallic and tannic acids are not archival on cellulose paper.<p>Most botanical
    dyes are, as you have found, not lightfast and will fade quickly. The simplest
    and most lightfast organic ink simply uses lampblack (fine soot) and gum arabic
    which is simple to mix, but making it yourself requires collecting and scraping
    fine soot. I just use Chinese ink sticks.<p>Stone? Do you mean mineral pigments?
    By my lights, once you start grinding and mulling mineral pigments and mixing
    them with gum to write with, you’re working with watercolor paints, not inks,
    and sourcing mineral rocks and grinding pigments from them rather than getting
    them pre-ground as I do sounds more tedious than making organic lampblack ink.
