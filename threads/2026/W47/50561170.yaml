  author: kragen
  text: |-
    &gt; <i>To make hynke. Take gall &amp; coporos &amp; or vitrial quartryn &amp; gumme of eueryche a quartryn oþer helf quartryn &amp; a halfe quartryn of gall more &amp; breke þe gall a ij oþer a iij &amp; put ham togedere eueryche one in a pot &amp; stere hyt ofte &amp; wyƷt wythinne ij wykys after Ʒe mow wryte þer wyþ. &amp; yf Ʒe have a quartryn of eueryche take a quarte of watyr yf halfe a quartryn of eueryche þan take half a quartre of watyr.</i><p>My paleography is not great, but I think this says, &quot;<i>To make ink</i>.  Take [oak] gall &amp; copperas [iron sulfate] or vitriol [sulfate, in case you didn&#x27;t know what &quot;coporos&quot; was], quarter-pint, &amp; gum; of each, a quarter-pint other half quarter-pint &amp; a half quarter-pint of gall more, &amp; break the gall a 2 other a 3 &amp; and put them [?] together each one in a pot &amp; stir it often &amp; wait.  Within 2 weeks after ye [???] write therewith.  &amp; if ye have a quarter-pint of every-each, take a quart of water if half a quarter-pint of each, then take half a quarter-pint of water.&quot;<p>&quot;Ʒ&quot; (<a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Ezh" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Ezh</a>, the dram symbol) is clearly an error of transcription, and I suspect it&#x27;s not the only one!<p>&quot;Other&quot; seems like it might be intended to give proportions for mixing: a quarter-pint to a half-quarter-pint, or 2 to 3, or whatever.  &quot;Everyche&quot; is an old abbreviation for &quot;every-each&quot;, meaning &quot;each&quot;.  It was completely normal to use lowercase Roman numerals like this (j, ij, iij, iv, v, vj, etc.) in recipes up to the 19th century, to the point that Cooley doesn&#x27;t bother to list them in his list of abbreviations (<a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;b28131423&#x2F;page&#x2F;n15&#x2F;mode&#x2F;1up" rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;b28131423&#x2F;page&#x2F;n15&#x2F;mode&#x2F;1up</a>), although he uses them frequently.<p>Incidentally, Cooley has several pages of recipes for iron gall ink starting at <a href="https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;b28131423&#x2F;page&#x2F;776&#x2F;mode&#x2F;1up" rel="nofollow">https:&#x2F;&#x2F;archive.org&#x2F;details&#x2F;b28131423&#x2F;page&#x2F;776&#x2F;mode&#x2F;1up</a>.  The version I have handy to quote from is a different edition (cooleyscyclopaed01cool), but, I think, still worth reading, among other things to see how Cooley thought of iron gall ink and its ingredients:<p>&gt; <i>INK. Syn. Atramentum, L, Coloured
    liquid employed for writing with a pen. Ink
    is made of various substances and colours; but
    at present we shall confine our attention to the
    tanno-gallic compounds, to which the term,
    when standing alone, is almost exclusively
    applied.</i><p>&gt; Prep. <i>1. Aleppo galls (well bruised), 4 oz. ;
    clean soft water, 1 quart ; macerate in a clean
    corked bottle for 10 days or a fortnight, or
    even longer, with frequent agitation, then add
    of gum Arabic (dissolved in a wine-glassful of
    water, 1¼ oz. ; lump sugar, ½ oz. ; mix well,
    and afterwards further add of sulphate of iron
    (green copperas, crushed small), 1½ oz. ; agi-
    tate occasionally for 2 or 3 days, when the
    ink may be decanted for use, but is better if
    the whole is left to digest together for 2 or 3
    weeks. When time is an object, the whole of
    the ingredients may at once be put into a
    bottle, and the latter agitated daily until the
    ink is made ; and boiling water instead of cold
    water may be employed.</i> Product. <i>1 quart of
    excellent ink, writing pale at first, but soon
    turning intensely black.</i><p>I&#x27;m guessing that &quot;Aleppo galls&quot; are galls from the Aleppo oak <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Quercus_infectoria" rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Quercus_infectoria</a> of which Wikipedia says, &quot;The galls from Quercus infectoria contain the highest naturally occurring level of tannin, approximately 50–70%,[6] as well as syringic acid, β-sitosterol, amentoflavone, hexamethyl ether, isocryptomerin, methyl betulate, methyl oleanate, and hexagalloyl glucose.[6][7] They also contain 2–4% each of gallic and ellagic acid that are polymerized to make tannins.[8][9][10]&quot;<p>Cooley does go on to describe other recipes for iron gall ink using unqualified &quot;Galls (bruised)&quot;, and then goes on to explain:<p>&gt; General Commentary. <i>According to the most
    accurate experiments on the preparation of
    black ink, it appears that the quantity of sulphate of iron should not exceed ⅓rd part of that
    of the galls, by which an excess of astringent
    vegetable matter, which is necessary for the
    durability of the colour, is preserved in the
    liquid. Gum, by shielding the writing from
    the action of the air, tends to preserve the
    colour ; but if much is employed, the ink flows
    languidly from quill pens, and scarcely at all
    from steel pens. The latter require a very
    limpid ink. The addition of sugar (especially
    of moist sugar) increases the flowing property
    of the liquid, but makes it dry more slowly,
    and frequently to pass into an acetous state,
    in which condition it acts injuriously on the
    pen. Vinegar, for a like reason, is not calculated for the menstruum, as it rapidly softens
    quill or horn, and corrodes iron and steel.</i><p>&gt; <i>To ensure the permanency of the colour of
    the tanno-gallic inks, the best Aleppo or blue
    nut-galls must alone be used. No second or
    inferior quality should be employed. A contrary practice, often adopted for the sake of
    economy, is nearly always followed by unpleasant results and often by considerable loss.</i><p>&gt; <i>The only improvement of importance which
    has been made in the manufacture of writing
    ink from the common materials, during the
    last few years, is the practice of first roasting
    the gall-nuts, which is now adopted by a few
    of the houses most celebrated for their copying ink. In this way a portion of pyrogallic acid is formed, which is very soluble in water,
    and strikes an intense bluish-black colour with
    the protosulphate or green sulphate of iron.
    From galls so treated an ink may be made to
    write black at once. Care must, however, be
    taken to avoid any loss of materials by
    volatilisation.</i><p>&gt; <i>To prevent any tendency to mouldiness in
    ink, a few bruised cloves, or a little oil of cloves, or, still better, a few drops of creasote
    (carbolic acid) may be added. The last two
    should be previously dissolved in a small quan-
    tity of strong vinegar, or rectified spirit.
    With the same intention some of the large
    makers allow the ink to become covered with
    a skin of &#x27;mould&#x27; in the cask, to render it
    less liable to undergo the same change when
    subsequently bottled. Formerly the practice
    was to add a little spirit for the same purpose.</i><p>&gt; <i>Sumach, logwood, and oak-bark are frequently substituted for galls in the preparation of common ink. When such is the case,
    only about ⅙ or ⅐th of their weight of
    copperas should be employed. Inks so made
    possess little durability.</i>
