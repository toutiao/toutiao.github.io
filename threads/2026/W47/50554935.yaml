  author: TeMPOraL
  text: The line was blurry because the best ones exploited bugs in game to introduce
    new game mechanics. A lot of that boiled to leveraging lack of bound checks (in
    many cases things like &quot;8 player limits&quot; were just enforced UI-side).<p>At
    some point, there was a brief moment - some 4-8 weeks AFAIR - when you could programmatically
    retile the underlying terrain grid and modify unit properties on the fly - this
    IIRC involved using the in-editor &quot;low code&quot; functions with unusual
    parameters (set Vespene Gas of &lt;player 200-something&gt; to &lt;very large,
    but highly specific number&gt; --&gt; some unit of player 1 starts dropping nukes
    instead of shooting bolts), people created some really amazing things with that
    for few weeks, before Blizzard patched it away, and the scene basically died overnight.
