  author: pumplekin
  text: |-
    One of the things that UT did really well (compared to similar games of the time) was it allowed a server to offload that in-game downloading to HTTP.<p>With Quake3 engine games for example, you could download maps and assets from the server, but it was really slow. You were doing it over the games protocol, and the framing, flow control and error correction were all awful.<p>Where as UT could do this, you could also setup the server with someting like<p>[IpDrv.HTTPDownload]
    RedirectToURL=http:&#x2F;&#x2F;myserver&#x2F;files&#x2F;<p>And the game client would use HTTP to fetch the files it needed, which was usually much faster.
