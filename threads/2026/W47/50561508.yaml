    Over Frontier AI Regulation\n\n- Your Model Is Not Your Moat\n\n- Richard Ho →
    Inside OpenAI’s First Chip\n\n- Joel Hron → Why Build Your Own AI Model When Frontier
    Models Already Exist?\n\n- Pete Warden → TinyML, Sensor-Driven AI, and Advances
    in Large Language Models\n\nSupport our work by subscribing to our newsletter\U0001F4E9\n\n###
    Transcript\n\nBelow is a polished and edited transcript.\n\nBen Lorica. All right.
    Today we have an old friend, Pete Warden of Useful Sensors, and their main website
    is actually at moonshine.ai. If you go to the website, you’ll see that they’re
    very much about voice on-device, and we will definitely talk to Pete about all
    things speech and all things edge computing. But I do want to take advantage of
    Pete being one of the OG deep learning engineers to get his sense of what’s going
    on these days. And with that, Pete, welcome back to the podcast.\n\nPete Warden.
    Thanks for having me, Ben.\n\nBen Lorica. All right. So I would say, Pete, I don’t
    know if this is a fair characterization, but one of the main thrusts of your work
    is the whole idea that local AI does not have to be compromised. In fact, it’s
    something that people should take more seriously. As I mentioned, we’ll definitely
    talk about your work on speech models on-device. But broadly speaking, Pete, for
    our audience that doesn’t really follow local models, where are we for someone
    who wants to run a model on a laptop, not a phone, just a laptop? What’s the state
    of ease of use? I guess one of the obstacles is that it’s always easier to use
    a cloud API, right? So where are we in terms of the tooling around local AI?\n\nPete
    Warden. Yeah. So at the moment, it’s like many open-source projects. Every year
    is going to be the year of the Linux desktop. I think there’s always going to
    be a bit of a lag in usability for the average user with this stuff, but I think
    there’s an even bigger lag in marketing because it’s very hard to make money off
    local models.\n\nThat means the big companies like Anthropic and OpenAI, and even
    the big tech companies generally, aren’t going to push that. If you give them
    a choice between a SaaS service that you can actually make money on and this other
    thing where you’re not even going to know that people are using it because they’re
    not contacting your service, every company is going to go for the one that has
    an easy subscription revenue model.\n\nThat means you have a massive amount of
    marketing around all of these tools that are basically a little text box on a
    website. And so it means that most people have never heard of these local models.\n\nNow,
    if you use something like Ollama, which is probably the most well-known, I think
    people will be pleasantly surprised by how straightforward it is to use and by
    the quality of the models. I saw some news recently that Anthropic is actually
    a bit concerned because people are turning to more specialized models versus always
    going for the most sprawling, expensive model that’s available.\n\nLocal models
    are actually doing very well in the benchmarks. They continue to be only a few
    months behind the capabilities of the big commercial Anthropic and OpenAI models.
    But I also believe that local models have gotten to the point where they can do
    the things that people want to use them for.\n\nWhat I’m really hoping is that
    it’s one of those situations, for those of us old enough to remember the dot-com
    boom, when people were paying thousands of dollars for SPARC servers or using
    Microsoft IIS and paying massive amounts of money because web servers were seen
    as such an arcane thing. Then, of course, Apache, Nginx, and all of these alternatives,
    once people actually had time to look around and the alternatives had a little
    bit of time to improve, just wiped the floor with the commercial alternatives.\n\nI
    don’t know if we’re going to quite get there, but that’s the pattern I’m seeing.\n\nBen
    Lorica. Yeah, my sense is that open models, whatever your definition of open is,
    mainly open weights, I guess, will ultimately prevail. It just seems like that
    makes a lot more sense to me.\n\nAs you mentioned, in the early days of Linux
    versus Solaris, or even Postgres and MySQL versus Oracle, it was far from clear
    that these open-source projects would ever get to the point of us having to take
    them seriously. But ultimately, I think they’re such important parts of the stack
    that the open alternatives are what people will opt for.\n\nSpeaking of which,
    Pete, you mentioned Ollama, right? And obviously, there are other alternatives.
    Let’s say, for the sake of argument, that they are in fact easy to install and
    use. As far"
