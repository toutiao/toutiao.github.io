  content: "### Pete Warden on Local AI, Open Models, Voice Interfaces, and the Future
    of Hardware.\n\nSubscribe: Apple • Spotify • Overcast • Pocket Casts • YouTube
    •  AntennaPod • Podcast Addict • Amazon •  RSS.\n\nPete Warden, co-creator of
    Moonshine Voice and a longtime deep learning engineer, joins me to discuss why
    AI increasingly wants to run locally rather than in the cloud. We explore the
    rapid progress of open-weight models, what it takes to run AI on laptops and in
    browsers, and how low-latency speech models could make voice a more natural interface.
    We also discuss specialized versus end-to-end models, the economics of local AI,
    and emerging hardware approaches that could challenge today’s GPU-centric infrastructure.
    [This episode originally aired on Generative AI in the Real World, a podcast series
    I’m hosting for O’Reilly.]\n\nInterview highlights – key sections from the video
    version:\n\n- Local AI Is More Capable Than Most People Realize Open Models, Quantization,
    and Running LLMs on Laptops Can Local AI Replace Cloud Models for Knowledge Work?
    Privacy, Personal AI, and Models Built Into Operating Systems Voice as a Computing
    Interface Beyond Siri and Alexa Why Latency Matters for Voice AI and User Experience
    How Local AI Changes the Economics of Applications Designing Voice Interfaces
    for Failure and Human Feedback Compound AI Versus End-to-End Speech Models Multimodal
    Models Versus Specialized Speech Models Running AI Models Directly in the Browser
    Why AI Wants to Be Local and Why Enterprises Need Control Apple, NVIDIA, and Rethinking
    GPUs for AI Inference High-Bandwidth Flash and the Future of AI Hardware\n\n-
    Local AI Is More Capable Than Most People Realize Open Models, Quantization, and
    Running LLMs on Laptops Can Local AI Replace Cloud Models for Knowledge Work?
    Privacy, Personal AI, and Models Built Into Operating Systems Voice as a Computing
