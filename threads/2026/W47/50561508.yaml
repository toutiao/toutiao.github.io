  author: j_w
  text: 'One important aspect is the VRAM on the cards, which Nvidia intentionally
    kept low on the gaming cards.<p>The 1080ti held it&#x27;s value so well for so
    long because it just had a ton of VRAM (for the time). Some argue that it was
    such a good value (see: lot of VRAM) that it made owners all but unwilling to
    upgrade.<p>1080ti was released in early 2017 for $600, then the 2080ti was the
    next card with 11GB of VRAM at $1000. It wasn&#x27;t until the 3080ti in 2021
    (at $1200), 3090 in late 2020 ($1500) when NVIDIA started to sell cards that had
    more VRAM.<p>Now top end gaming cards seem to just be 24GB of VRAM, with the rest
    at 12GB. But the prices kept going up even when normal RAM prices seemed to be
    going down (yes they are not the same thing, but still). We&#x27;ve long known
    that more VRAM = more detailed textures. NVIDIA just holds out on improving gaming
    cards and charges a ton for them.'
