  author: dofm
  text: "&gt; How do you things on mobile for example with your local models?<p>The
    same way you can screenshare or forward from your local Mac? Paseo, LM Studio
    and LM Studio Bionic all support this kind of tailscale-ish access to local models
    from phone apps. (Haven&#x27;t tried any of these myself)<p>I do, personally,
    have &quot;narrow scenarios&quot; for AI. I have to use it for work, and want
    to be informed and engaged on that level, but I want to keep it out of my personal
    life as much as is practical.<p>If you don&#x27;t, that&#x27;s fine, but I reframed
    my mass social media use down to an extremely minimal pattern in 2014 and I am
    healthier for it; I intend to keep the same distance from AI in my hobbies, for
    several of the same reasons.<p>Paradoxically, for me that has involved taking
    the control over it that local models offer. I use the smallest, simplest things
    that get the job done and I try to retain my engagement with my work.<p>It&#x27;s
    all pretty low-effort and low-tinkering; no more than setting up local VMs for
    dev work. Old M1 Max macbook, Unsloth, Pi, a model in the Muse Glimmer&#x2F;Qwen
    27B&#x2F;Nemotron Bolt sort of bracket.<p>Good enough to be a rubber duck that
    talks back, write the minimal kind of AI-generated support code I want, and teach
    me how it all works.<p>I might one day buy an M5 Pro Mac Mini, or an M5 Max Mac
    Studio, or stick an R9700 in a homebuild PC, or I might just use openrouter for
    the few things the Macbook won&#x27;t do.<p>I am a cynic: I believe AI has some
    value, but I also believe it should be a commodified technology rather than a
    branded SaaS subscription product, and it should demonstrate that value without
    me letting  a couple of large corporations FUD me into pushing it into every corner
    of my life at once, or simply handing over control of my job to it.<p>It is a
    matter of personal discipline, for me: I am going to resist the endless FOMO of
    new model benchmarks, learn how it works, keep it in a box, and take it out when
    I need it."
