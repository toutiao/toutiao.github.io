  author: nater5000
  text: First, I&#x27;ll say that I, too, care little about local AI. I <i>do</i>
    like toying around with local AI, and I <i>do</i> see how it can be a very important
    option in some contexts. I also loosely agree that it&#x27;s good for keeping
    frontier models on their toes, prevent this technology from being locked away
    behind a paywall, etc. But for me, as of now, they&#x27;re not very useful, and
    I use AI quite a bit.<p>However, I <i>do</i> think your perspective on local models
    is a bit narrow. For a lot of people, they want AI tools but do not need cutting
    edge AI. They&#x27;d prefer to just have their own AI which is capable enough
    and under their control. They&#x27;d run it on a small server at home and connect
    to it as needed for their work (including on their phone). It&#x27;s worth noting
    that much of the consumer-grade infrastructure definitely doesn&#x27;t exist for
    this, but one could blame the lack of consumer-grade hardware as the source of
    this rather than just a general lack of demand. You can definitely see people
    picking up on this by running their various assistants, like OpenClaw, on Mac
    Minis from their home. It&#x27;s definitely not accessible or cheap enough for
    most consumers at this point, but it&#x27;s also not impossible to imagine us
    getting to the point where it is more ubiquitous.<p>I&#x27;ll say, personally,
    that I run Qwen 3.8 27B on an RTX 3090 from my home server, and it operates pretty
    well for what it is. I&#x27;m certainly not giving up my Claude subscription anytime
    soon, but it is nice to have the option and I can chat with it directly on my
    phone securely (using Tailscale) and using a nice UI.<p>Regardless, I think the
    whole point of these kinds of discussions is to point out that, right now, local
    models aren&#x27;t viable, but not because they <i>can&#x27;t</i> be viable, but
    because companies are actively preventing them from being more viable. I can see
    for myself that they work well enough that proper investment could easily push
    them into the &quot;good enough&quot; territory for many users, and I suppose
    it is inevitable that more and more people will end up running local models in
    one way or another. But I definitely agree with the sentiment that most consumers
    simply do not care about it. They don&#x27;t want to deal with hardware, they
    don&#x27;t want to think about software, and they&#x27;re happy to pay $20 per
    month for a subscription that &quot;just works.&quot; I definitely don&#x27;t
    blame them.
  score: 0
