  author: scrlk
  text: Am I missing something because DEC apparently cracked this via expert systems
    in the 80s?<p>&gt; SID (Synthesis of Integral Design) was a logic synthesis program
    used to generate logic gates for the VAX 9000. From high-level behavioral and
    register-transfer level sources, approximately 93% of the CPU scalar and vector
    units, over 700,000 gates, were synthesized.<p>&gt; SID was an artificial intelligence
    rule-based system and expert system with over 1000 hand-written rules. In addition
    to logic gate creation, SID took the design to the wiring level, allocating loads
    to nets and providing parameters for place and route CAD tools. As the program
    ran, it generated and expanded its own rule-base to 384,000 low-level rules.<p>&gt;
    Initially it was somewhat controversial but was accepted in order to reduce the
    overall VAX 9000 project budget. Some engineers refused to use it. Others compared
    their own gate-level designs to those created by SID, eventually accepting SID
    for the gate-level design job. Since SID rules were written by expert logic designers
    and with input from the best designers on the team, excellent results were achieved.
    As the project progressed and new rules were written, SID-generated results became
    equal to or better than manual results for both area and timing. For example,
    SID produced a 64-bit adder that was faster than the manually-designed one. Manually-designed
    areas averaged 1 bug per 200 gates, whereas SID-generated logic averaged 1 bug
    per 20,000 gates. After finding a bug, SID rules were corrected, resulting in
    0 bugs on subsequent runs.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;VAX_9000#SID_Scalar_and_Vector_Processor_Synthesis"
