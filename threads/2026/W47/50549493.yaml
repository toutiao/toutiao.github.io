  author: bri3d
  text: I agree with this, and I think most of the posters here aren’t following.<p>LLMs
    are very good at RTL (all I can consider is that the parallel posters arguing
    otherwise haven’t tried a modern one against significant RTL?). It’s easy to verify,
    the optimization constraints are relatively straightforward, and there’s adequate
    simulation to build a good gym for it.<p>LLMs are not good at layout and floor
    planning and because there is near zero public data available, I’m not sure how
    well they’ll iterate. For PCB design they’re improving because while it’s a similarly
    thorny problem, the physical constraints (trace properties on a given substrate)
    are highly public and can be simulated and turned into an RL gym. For ASIC, any
    public PDK is 10-20 years old so making an RL gym becomes outrageously difficult
    on top of the fundamental problem (highly multivariate&#x2F;layered spatial optimization)
    being hard to solve.
