  author: throwawaycsdc3
  text: On an infinite time horizon, sure.  Maybe.  But unless you use these tools
    I don&#x27;t think you realize just how manual the whole process is.  For example,
    I&#x27;ve never had a chip be 100% DRC free.  I always have to go in and hand
    edit the database in the end to fix those last few nitty gritty nets.  Look at
    the TritonRoute paper [1], the open source router.  They&#x27;re claiming victory
    because they got a contrived benchmark down to &quot;unprecedented, extremely
    low level&quot; of &lt;20 DRCs errors, but not DRC free. And that&#x27;s a benchmark,
    not a real design.   So much of the EDA flow is about finding what is merely a
    valid solution, never mind optimized...<p>But can LLMs improve chip design?  Absolutely.  They&#x27;re
    improving chip design right now.  That gobs of TCL I referenced.  Claude is amazing
    at it.  And I&#x27;m working on structures that are way more complicated than
    I could previously do.  And I don&#x27;t really care if it&#x27;s not following
    good software engineering whatever because I&#x27;m going to run that code once
    and my product is a chip.  Not TCL code.<p>But am I going to prompt an LLM and
    it&#x27;s going to give me a competitive chip back?  Not any time soon.  I&#x27;m
    sure.<p>[1] <a href="https:&#x2F;&#x2F;vlsicad.ucsd.edu&#x2F;Publications&#x2F;Journals&#x2F;j133.pdf"
