  author: adrian_b
  text: Complete verification is only after the prototype circuits have been fabricated
    and measured in the lab.<p>The best case is normally that only the second batch
    of prototypes is good enough, after a redesign that has used the results from
    the physical verification of the first batch. Only in very lucky or very simple
    projects the first prototypes are already as good as desired. Unlucky projects
    may need multiple redesigns until reaching the project goals.<p>So from the first
    tape-out until the design process is completed, the time can be from a few months
    to a year (or even more for very complex designs, like a CPU or GPU).<p>Even the
    verification done on the computer before the tape-out can take many weeks, or
    even a few months for very complex devices, because not only the correctness of
    the digital blocks must be checked, but also the complete system, including analog
    blocks, which must be simulated many times, to find the worst cases corresponding
    to various combinations of manufacturing variability and aging, supply voltages
    and ambient temperature.
