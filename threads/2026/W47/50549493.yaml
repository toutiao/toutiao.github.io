  author: zackmorris
  text: It will be interesting to see if AI really starts innovating in circuit design
    or just continues doing the wrong things faster. But I&#x27;d bet that it will
    soon run circles around the status quo, and rightly so.<p>We&#x27;re way out on
    the long tail of a dead-end approach to computation that started in the late 1990s
    with GPUs when we chose to optimize SIMD at the expense of general-purpose computing.
    On top of that, Moore&#x27;s Law ended in roughly 2007 with the arrival of smartphones,
    when the industry chose cost and power minimization over compute maximization
    via a multicore approach.<p>Now only servers have access to highly multicore chips
    like AMD EPYC, at 10-100 times the cost and with poorer performance than if they
    maximized local&#x2F;shared memories with content-addressable caching. Apple&#x27;s
    M line of processors is ok, but its specialized cores just stand in the way of
    the higher abstractions available with symmetric multiprocessing, upon which specialized
    algorithms can be built. We&#x27;re still missing the multicore foundation.<p>I
    used Synopsys and Cadence back in college in the late 1990s to automatically place
    and route circuits from diagrams in SPICE (I think, my memory is foggy) and they
    already performed 80% as well as humans. I don&#x27;t remember if that was for
    chip area, speed or power. But the big players were obviously using tools at least
    as capable as whatever we were trained on.<p>Then in the 2000s I had hoped to
    do what OpenAI is doing and simulate small&#x2F;open CPU designs on FPGAs. But
    the economics just weren&#x27;t there. Even though some people like me (the poors)
    knew just exactly what could work, there was a tech winter between roughly the
    Dot Bomb around 2000 to the start of the Mobile Bubble in the early 2010s. So
    we didn&#x27;t have a way to communicate what was possible to the people with
    capital, without having to network to get through the gatekeeping. Which may be
    fun for enthusiasts, but it&#x27;s anathema to hackers wanting to get real work
    done.<p>I&#x27;d nearly given up all hope of progress until last year when AI
    went mainstream. Now I see 3 steps to the epiphany:<p>[x] Time<p>[ ] Money<p>[
    ] Resources<p>AI solves the time component, since specs (ideas) are orders of
    magnitude easier to create than implementations.<p>But money and resources may
    not be available for quite some time. It&#x27;s looking like the music may stop
    for AI funding next year, now that the election is over and the writing&#x27;s
    on the wall as far as doing things without consent goes. Regulation is coming,
    and with it perhaps the last AI winter, although admittedly I&#x27;m probably
    exaggerating.<p>So as usual, we may have to pull ourselves up by our bootstraps
    and skip the money step to provide resources directly to ourselves and the rest
    of humanity. There&#x27;s so much capital now that all it can do is inflate Wall
    Street. There&#x27;s little to no carryover onto Main Street. So in a very real
    way, it&#x27;s easier now to make money by borrowing and investing than going
    to a job. That&#x27;s a dangerous situation for any country, as it slips into
    being a giant casino of haves and have-nots. We&#x27;ll let the farms go under
    before raising taxes.<p>The interesting thing is that without my involvement,
    the universe went ahead and made AI without me, which is ..surprising. But automating
    problem solving was perhaps the hardest problem there was. The remaining problems
    are easier. We may be ready for Morris&#x27;s Law of Manifestation, where the
    time it takes to manifest whatever you can think of keeps halving. So whatever
    tech or medical breakthrough you&#x27;re wishing for will arrive in 12 years now,
    not 25. Then if you don&#x27;t get it, it arrives in just 6 more years. Then 3,
    then 2, then 1, then we reach the Singularity. So whatever all this is will certainly
    end by 2050. I just hope that whatever&#x27;s on the other side has less suffering
    rather than more.<p>Sorry this got so long. I&#x27;ve been thinking about it for
    a long time.
  score: 0
