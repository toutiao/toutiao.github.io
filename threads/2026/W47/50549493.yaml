  author: throwawaycsdc3
  text: Good ASIC design is not like FPGA design.  For FPGA design I think your analysis
    is spot on.  But FPGA design is configuring someone else&#x27;s ASIC.   ASIC design
    is circuit design, even if you&#x27;re describing the circuit with RTL, it&#x27;s
    still circuit design.  To differentiate that ASIC you need to transform the net
    lists into circuits that are actually interesting.  If you just use the defaults
    you&#x27;re unlikely to sell a single chip as your performance will almost certainly
    underwhelm.   In think in most ASICs I&#x27;ve worked on I have more TCL code
    driving the tools to make them do what I want them to do than I have RTL.  RTL
    is shockingly efficient at describing data flow.
