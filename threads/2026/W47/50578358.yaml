  author: QuesnayJr
  text: A lot of people have raised the possibility of math may plateau because humans
    no longer have the insights for new abstractions, but the truth is nobody knows.<p>Langlands
    is interesting because it is most conjectural (and not completely clear what the
    precise statements are -- hence &quot;program&quot; and not &quot;conjecture&quot;),
    but proving special cases turn out to be tremendously powerful.  One special case
    implied Fermat&#x27;s Last Theorem, for example.
