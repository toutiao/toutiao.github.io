    \"Subscribe to the What's new feed\")\n\n# Unforced Euler singularity, unforced
    Navier-Stokes singularity, and the Generalized Riemann&nbsp;Hypothesis\n\n20 November,
    2026 in [math.AP](https://terrytao.wordpress.com/category/mathematics/mathap/),
    [math.NT](https://terrytao.wordpress.com/category/mathematics/mathnt/) | Tags:
    [AI](https://terrytao.wordpress.com/tag/ai/), [incompressible Euler equations](https://terrytao.wordpress.com/tag/incompressible-euler-equations/),
    [Levent Alpöge](https://terrytao.wordpress.com/tag/levent-alpoge/), [Matei Coiculescu](https://terrytao.wordpress.com/tag/matei-coiculescu/),
    [Navier-Stokes equations](https://terrytao.wordpress.com/tag/navier-stokes-equations/),
    [Riemann hypothesis](https://terrytao.wordpress.com/tag/riemann-hypothesis/),
    [Tristan Buckmaster](https://terrytao.wordpress.com/tag/tristan-buckmaster/) |
    by [Terence Tao](https://terrytao.wordpress.com/author/teorth/)\n\nObviously these
    results will be reported widely in other outlets, but I will note them here, in
    decreasing order of how “digested” the results currently are:\n\n- Levent Alpöge,
    Tristan Buckmaster, and Matei Coiculescu, with heavy AI assistance, have written
    a [human-readable proof of the finite time blowup for the unforced incompressible
    Euler equations in three dimensions](https://cims.nyu.edu/~tristanb/cc.pdf), which
    is [formalized in Lean here](https://github.com/mcoiculescu/EulerBlowupPublic).\n-
    Levent Alpöge and Tristan Buckmaster, again with heavy AI usage, have generated
    a [proof of the finite time blowup for the unforced incompressible Navier Stokes
    equations in three dimensions, again with a Lean formalization](https://github.com/tristanbuckmaster/navier-stokes/).
    Here, the paper is technically human-readable and the general strategy of proof
    is broadly clear (following one of the expected paths to this result, namely to
    numerically build an approximate discretely self-similar solution and then use
    rigorous perturbation theory to convert this to an exact solution); but more work
    needs to be done to create a proper, professionally written proof.\n- Levent Alpöge,
    using an internal AI model, has generated an (enormous) Lean-only proof of the
    Generalized Riemann Hypothesis. [This Lean Zulip thread](https://leanprover.zulipchat.com/#narrow/channel/113488-general/topic/Discussion.3A.20Alp.C3.B6ge.20Proves.20the.20Riemann.20Hypothesis)
    is probably the best place to follow the efforts to verify the proof and extract
    the strategy of proof (which, from very initial analysis, appears to use the full
    power of modern developments on the Langlands program and arithmetic geometry).
    (UPDATE: the moderators of the Lean thread are now focusing the discussion on
    the Lean-related aspects of the proof only.) I imagine the digestion process will
    take some time, though in this case at least we have a human author to communicate
    with to assist with this task.\n\nSee also [Buckmaster’s Mastodon post](https://mastodon.social/@tristanbuckmaster/117649035783718539)
