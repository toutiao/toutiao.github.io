    reportedly planned mass-casualty sabotage attack in Poland to be blamed on Ukraine_\n\nRussian
    intelligence services reportedly planned to carry out a sabotage operation on
    Polish territory near the border with Russia's Kaliningrad Oblast in late October
    or early November which they intended to be blamed on Ukraine.\n\n**Source:**
    Polish newspaper [Rzeczpospolita](https://www.rp.pl/konflikty-zbrojne/art45490041-prowokacja-z-duza-liczba-ofiar-i-zrzuceniem-winy-na-ukraine-ustalilismy-co-powstrzymalo-rosje),
    as cited by European Pravda\n\n**Details:** The newspaper cited senior sources
    with ties to Poland's military and security services who are familiar with an
    operation carried out over the past two weeks to foil the Russian plot.\n\nAdvertisement\n\nAdvertisement\n\nAdvertisement\n\nAdvertisement\n\nRzeczpospolita
    said Warsaw had been warned of the planned operation by partner intelligence services,
    and Polish intelligence analysts had also identified signs of the threat.\n\n\"We
    had information about the specific sites that were to be attacked. The Russian
    plan envisaged mass casualties,\" one of the newspaper's sources said.\n\nDrawing
    parallels with the Gleiwitz incident, a German false-flag operation carried out
    on 31 August 1939, another source said: \"It was supposed to be something similar
    to Gleiwitz. Of course, those who crossed the border would most likely have been
    shot, or evidence that they had come from Ukraine would have been found on them.
    The aim was to stop aid to Ukraine.\"\n\nPolish intelligence services took action
    after Russian intelligence officers responsible for coordinating sabotage operations
    appeared on the Russian side of the border. Such operations are mainly planned
    and coordinated by Russia's military intelligence agency, the GRU.\n\nAdvertisement\n\nAdvertisement\n\nPolice
    forces in areas bordering Russia were reinforced by officers from other parts
    of Poland in late October for this reason. Border Guard posts also received reinforcements,
    and additional Internal Security Agency officers were deployed to the area. Special
    forces held exercises in the Warmian-Masurian region, where Poland's Territorial
    Defence Forces had also held exercises earlier.\n\n\"The aim was deterrence, but
    also to ensure the ability to take pre-emptive action,\" a source familiar with
    the details said.\n\nRzeczpospolita asked Tomasz Siemoniak, Poland's Minister-Coordinator
    of Special Services, whether the Russians had planned to carry out a terrorist
    attack in Poland at a location where large numbers of people might have been present.\n\n\"I
    don't know the answer to that question – you'd have to ask the Russians, and they
    don't usually admit to planning such actions. Even if we have such information,
    we don't share it,\" he replied.\n\nAdvertisement\n\nAdvertisement\n\nSiemoniak
    added, however: \"If we took certain measures, it was because we considered the
    threat to be real.\n\nIn my opinion, all the measures taken in this case were
    appropriate. The available evidence indicated that the threat had been assessed
    as real,\" the minister said.\n\n**Background:**\n\n- \n\n&nbsp;In early November,
    a special operations headquarters was established at Poland's National Police
    Headquarters for an operation being conducted in the Warmian-Masurian and Podlaskie
    voivodeships. Security forces were preparing for possible acts of sabotage on
    the border with Kaliningrad Oblast.&nbsp;\n\n- \n\n&nbsp;On 3 November, Polish
    Prime Minister Donald Tusk said that \"[suspicious activity](https://www.pravda.com.ua/eng/news/2026/11/03/8061046/)\"
    had been detected overnight on the Polish-Russian border.\n\n> &nbsp;\n> \n> **Subscribe
