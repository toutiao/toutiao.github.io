  author: dtgriscom
  text: 'Tech support for naive (no offense) customers is an art. A friend&#x27;s
    mom was a customer service rep for RCA TVs back in the day (way, way back in the
    day). Customers would call and complain that their TVs were doing nothing: no
    lights, nothing.<p>The standard response would be to ask them to pull the TV&#x27;s
    (non-polarized) plug, reverse it, and plug it back in. This was generally successful,
    NOT because the plug polarity mattered, but because the customer had actually
    forgotten to plug in their TV.<p>If the rep had said &quot;is your TV plugged
    in?&quot;, many customers would indignantly say &quot;Of course!&quot; without
    even checking. The &quot;reverse your plug&quot; request was more successful because
    it sounded like the customer was doing something intelligent. And, when they went
    to perform this task, they would discoverer that they&#x27;d forgotten to plug
    their TVs in. The customer could then report that the reversal worked, nobody
    would mention the unplugged TV, and everyone would be happy.'
