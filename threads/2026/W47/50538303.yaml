  author: lo_zamoyski
  text: You would hope, though we&#x27;ll have to see how management actually sifts
    the chaff from the wheat in practice.<p>Code reviews have been notoriously neglected.
    In the most charitable cases, this was the result of being too bogged down with
    work or some kind of implementation minutia or time-consuming plumbing to have
    enough time to actually review code with enough care. That and you aren&#x27;t
    necessarily rewarded for code reviews by mediocre companies, so there are perverse
    economic incentives. Which is disconcerting, because it creates a compulsion to
    produce without understanding, and understanding is more valuable than artifact.<p>Reading
    code is indeed more difficult, because the code&#x27;s intent, composition, and
    architecture must be pieced together and inferred with the help of context (formalized
    languages are infamously bad at communicating intent and most code in the world
    is full of mixed and half-baked abstractions that further serve to obfuscate that
    intent, and intent is the measure). So a good code review of anything substantial
    involves thoughtful effort.<p>Now that LLMs can catch all sorts of trivial anti-patterns,
    the need for good judgement and reasoning is hopefully made more conspicuous,
    because as we know, vibe coders will continue to brush off code reviews, and mediocre
    programmers will continue to perform them poorly.
