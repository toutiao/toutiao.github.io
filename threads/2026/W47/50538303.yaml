    it, but it feels dated because it actually takes time to do research instead of
    just rapidly changing direction based on feels, which is what developers are currently
    doing. It&#x27;s the intellectual rigor of javascript frameworks, but with slop
    cannons.<p>In particular, code review is <i>not</i> solved. Pointing another error-prone
    bot at the output of your first error-prone bot, and then pressing &quot;Enter&quot;
    if the test suite passes, is not a solution. But you have to do it, because the
    next guy will beat you to prod if you don’t. And before too long, I&#x27;m sure
    that pressing Enter will be the bottleneck...<p>Right now what we have is a prisoner’s
    dilemma, where you can’t be slower than the guy next to you. So we rationalize
    slop and call it innovation.
