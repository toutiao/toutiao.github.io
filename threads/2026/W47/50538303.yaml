  author: fingerlocks
  text: 'This is why we need to resurrect the neglected git-blame and go back to the
    days of git-before-GitHub. Way back in the old timey days of 2009-ish, just before
    the Dawn of the Pull Request, code reviews were seldom. Maybe you’d all get a
    conference room and talk about architecting some new thing or whatever, but none
    of this endless nit-picking bullshit that came later. And there were no branch
    protections, anyone could crap all over the main branch (nee: master) anytime
    they wanted. Boy, those were some wild times, let me tell ya!<p>Truth be told,
    it was the firm hand of the git blame-and-shame that kept our code civil and orderly.
    Binding contract written in blood was “the name on the blame owns the change”.
    If you pushed it, you owned it. For life.<p>Of course, mental health wasn’t so
    great back in those days, but I would take that over having my PR blocked all
    day because Chad, who’s only gift is somehow finding a new hill to die on every
    day, thinks zero is a “magic number” there’s no way he’s going to budge on this
    issue.'
