  author: wilkystyle
  text: With all respect to your personal experience, I could not possibly disagree
    more strongly with this.<p>In my own real world experience, the bottleneck has
    never been crafting the perfect specification up front. In fact, I have never,
    not even once, seen the initial specification for any real world software project
    of any mentionable size or scale survive unscathed to delivery. In reality, it
    is much like the old wartime maxim. &quot;No Plan Survives First Contact With
    the Enemy&quot;.<p>The real world is messy and unpredictable. Every single software
    project of significance that I have been a part of has always involved testing,
    validating, and reworking the assumptions in the initial design and spec, refining
    them to arrive at the final product.<p>Furthermore, this iterative process (pre-AI)
    used to involve one or more humans following the development story and understanding
    what design changes and corresponding trade-offs were happening along the way
    (and why they were being made). By the time there was a finished deliverable ready
    for review, the person involved was privy to the story of why the development
    shaped up the way it did. They were able to account for the big picture, adapt
    accordingly along the way, and be able to explain why things ended up the way
    they did.<p>IME, with fully-agentic PRs, AI tends to view the specification as
    gospel and to view every point of friction between the specification and the real
    world as something to be worked around or minimized. Where a real human would
    pause, zoom out, and consider the system and bigger picture, considering what
    design changes might be needed, the AI will assume that its job is to make the
    specification a reality at all costs.<p>You can of course mitigate this by staying
    more closely involved with the work as it&#x27;s being done, but this is of course
    slower than just throwing a spec over the wall and letting an agent run with it.
    It seems that people are far too eager to optimize for raw speed, and not nearly
    concerned enough with correctness or human understanding.<p>A sister comment mentioned
    a plethora of PRs that don&#x27;t solve the right problem. If you are swamped
    with PRs solving the wrong problem, the root cause is not that you didn&#x27;t
    foresee every future possibility or undiscovered devil in the details in order
    to create the right spec, the problem is that you thought you could come up with
    the right prompt at the outset and that an agent living in a clean digital world
    could make the journey all the way to a product fit for the messy real world on
    its own.
  score: 0
