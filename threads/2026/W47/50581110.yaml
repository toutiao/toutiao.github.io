  text: Very inspirational!<p>My optimistic hope for the AI revolution is that people
    with good ideas can realize them into spectacular products in ways that were impossible
    before, and this seems like a good example of that.<p>Consider the classic old
    scope-effort-time triangle. I think &quot;Slop&quot; is the result of locking
    the scope and reducing the time and effort. &quot;I made this in a weekend!&quot;<p>A
