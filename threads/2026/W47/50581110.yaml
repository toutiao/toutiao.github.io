    running also.<p>As for hooks. There are two: shell command and new chat. Former
    triggers when a shell command is about to be executed; the latter when there is
    a new chat. If you need more, drop me an email and I can try to support it.<p>As
    for supporting people&#x27;s pet workflows: DreamCoder is its own thing. I will
    endeavour to support a wide range of things, but it has its own rhythm, and that
    means adjusting to it.<p>&quot;Open in studio&quot; opens the designated primary
    agent. You can create another if you wish to control tool and prompts for your
    main chat agent.'
