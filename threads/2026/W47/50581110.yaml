  author: doright
  text: I&#x27;m not the person you&#x27;re responding to but thank you for your work
    on agent-shell. It&#x27;s made simple agentic coding within emacs a breeze for
    me. I moved off of agent-shell for very complex work (needing more than a few
    long-running agents) and use herdr for that instead. Some pain points I have encountered:<p>-
    With ACP&#x2F;Anthropic being used, I cannot interject a running prompt without
    cancelling the current run with C-c C-c. I can only &quot;queue&quot; messages
    which sends them when the agent is finished. But when I tried the CC harness,
    I liked how you could do Ctrl+Enter to immediately send the prompt interrupting
    any running step instead. It sounds more sensible than queuing up a lot of unrelated
    messages that can become outdated by the time the agent finishes the foreground
    task.<p>- The biggest issue with doing C-c C-c to interrupt a running agent, and
    why I avoid doing that to fix the above issue, is that (with ACP&#x2F;Anthropic
    endpoints at least) it kills running background processes too. There is no distinction
    between &quot;interrupt the foreground prompt&quot; and &quot;interrupt this or
    all background jobs&quot;. You cannot see a list of the background jobs (to my
    knowledge) and cannot pick which jobs to cancel, it cancels everything. Also agent-shell
    doesn&#x27;t notify you that it killed these background jobs either upon C-c C-c.
    So I would frequently lose work I thought was running for several hours.<p>- As
    far as I know, there is no way to move a foreground tool call to the background,
    like with the CC harness (Ctrl+B), so that I can prompt something else. It has
    to go into the queue.<p>- With herdr (and this might not be in scope of agent-shell),
    I liked agents being able to manage the session panes and send messages to each
    other. When I use agent-shell my impression is I am limited to one agent shell
    in one worktree.<p>- Related to the above issue, subagent output is interleaved
    with the foreground agent output and it becomes confusing to follow due to lack
    of agent identifiers. With herdr I can go to another agent, watch its output and
    send messages to it directly. With agent-shell I have less control and have to
    ask the main agent to communicate with them.<p>- (Also not sure if it&#x27;s in
    agent-shell&#x27;s scope) Suspend&#x2F;resume is more convenient with herdr, if
    I close emacs I lose the running agent sessions too and have to restore them all
    by hand. With herdr I can detach&#x2F;reattach even if my terminal process dies,
    and from cold startup one command restores both the pane layout and all the agent
    sessions automatically.<p>I&#x27;m pretty sure I&#x27;ve been using latest, but
    correct me if any of these have been fixed with a later release. Still, I can
    see how any number of these could be limitations with ACP over Anthropic&#x27;s
    proprietary harness, and that&#x27;s understandable.
