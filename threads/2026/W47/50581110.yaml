  author: wangguode
  text: |-
    Owning the harness rather than treating the model as a magic black box is where all the real reliability gains come from. Two primitives that made the biggest difference in our own agent harness:<p>1. Pre-tool AST&#x2F;command boundary checks before execution rather than relying on system-prompt warnings.
    2. Aggressive stdout&#x2F;stderr truncation (capping tool output tokens before context bloat triggers silent instruction drift).<p>Curious how DreamCoder handles long-running test output or background server logs inside the Emacs buffer loop without blowing up context.
