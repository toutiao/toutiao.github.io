  text: '&gt; DreamCoder is not an Emacs-related application. The reason is unfortunately
    one of economics and access: I want to build an AI coding harness for everyone.<p>I
    think this is an enormous mistake, and it will completely stop me from using this
    project. Being emacs compatible software would give this project a shared base
    of decades of composable interoperable software, and he ditched it. Now DreamCoder
    is completely indistinguishable from any other vibe coded bullshit IDE.<p>If the
    author is lurking, I implore you to re-port DreamCoder back to emacs. I share
    a similar vision, but I took another approach.<p>The problem is not emacs itself
    (one could simply customize emacs to be more palatable), but distribution. If
    emacs was web software, then it _would_ be &quot;for everyone&quot;. That&#x27;s
