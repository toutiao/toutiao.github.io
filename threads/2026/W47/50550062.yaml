  author: nephihaha
  text: |-
    I&#x27;ve seen umpteen films and TV series where they get some star in from elsewhere to play a Scottish role who butchers the accent. &quot;Braveheart&quot; is an obvious one. &quot;Highlander&quot; is another (although it is a fun film.)<p>The BBC does this kind of thing all the time often with horrific results. (The BBC does not provide a good service to Scotland but that&#x27;s a whole other rabbithole.)<p>There are exceptions: Jonny Lee Miller in Trainspotting, Johnny Depp in Finding Neverland, Maggie Smith in the Prime of Miss Jean Brodie (albeit an old fashioned Morningside accent), Emma Thompson and Simon Pegg (Abrams Trek) all spring to mind.<p>But most are about as good as Dick Van Dyke&#x27;s Cockney.<p>Some suggestions here...
    <a href="https:&#x2F;&#x2F;www.thenational.scot&#x2F;culture&#x2F;19613058.six-worst-scottish-accents-tv-film-history&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.thenational.scot&#x2F;culture&#x2F;19613058.six-worst-scot...</a>
  score: 0
