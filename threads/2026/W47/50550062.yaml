  author: nephihaha
  text: It&#x27;s a circular problem. In my experience most English speaking countries
    are inundated with American media so people understand various US accents (maybe
    not all).<p>But if you are not being exposed to a wide variety of other accents,
    then you will struggle to understand them. Americans don&#x27;t get much exposure
    to them. I hear Australian, NZ, Irish, Indian, South African, and various accents
    from England on a regular basis.<p>There are plenty of broad Scottish accents
    (although much less so than a century ago), but there are also plenty of Scots
    who can speak pretty clear English with Scottish intonation.
  score: 0
  posted_at: '2026-11-18T22:43:42Z'
- id: '50553507'
  parent_id: '50551470'
  author: nephihaha
  text: Trainspotting is a curious case. Jonny Lee Miller, who is not Scottish, does
    an excellent accent.<p>Ewan MacGregor, however, while great in the role is privately
    educated and I can hear that. A few folk commented on that at the time. He&#x27;s
    not very &quot;schemie&quot;.<p>Kelly MacDonald, also a great actor, but sounds
    more Glasgow than Edinburgh.<p>Ewen Bremner (Spud) is probably the closest.<p>The
    accents in the film of Trainspotting are less strong than in the book, I&#x27;d
    argue. They&#x27;re speaking Scottish English rather than any form of urban Scots.
    If they wanted to get it pitch perfect... i.e. 1990s Leith&#x2F;Edinburgh drug
    addicts then they should have been more nasal. That was a quirk of folk from that
    background. I knew a few.
