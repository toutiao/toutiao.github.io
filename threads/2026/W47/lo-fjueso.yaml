    Contracts were initially approved something like 100-16. Within WG21, there is consensus to have this feature. However, on the DIS stage it is no longer "one person = one vote" but "one country = one vote", and the opposition is geographically diverse and did an effective lobbying campaign, citing a paper by Bjarne et al that contains multiple factual errors and misrepresentation of the situation. That paper was then quoted as the reason for rejecting C++26 by multiple NBs, including ones that did not participate in the process before. That is why the first DIS failed.
