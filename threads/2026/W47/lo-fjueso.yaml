    [note: I wrote a different reply earlier but it was poorly worded and the example was not good either so deleted it to avoid noise]
    The syntax you would use normally is
    pre(x>0)

    But at build time you can configure contract enforcement into an "observe" or "ignore" mode (generally for adoption, etc where you don't know if there are existing issues and don't want instant trap on any failure, or to allow static analysis without whole module analysis).
    But even if you are not yet at the point where you don't yet want to enable contract enforcement globally, there are cases where you want to be able to say "this is a security critical invariant and must be enforced"
    e.g imagine something like this
    template <class T> struct Array {
        size_t count;
        T buffer[];
        static Array *allocate(size_t count) pre(count > 0);
        T &operator[](size_t idx) pre<enforced>(idx < count);
        ...
    }

    Allocating a zero length array is inefficient but not a safety problem, reading out of bounds is a security bug. So during adoption you might be perfectly happy to accept only getting failure logging rather than a trap. Then once you're comfortable with the state of your project you drop the observe/ignore flag that you're passing to the compiler and they all become enforced.
    Meanwhile if you don't want observe semantics you simply never build in that mode and the short pre (...) syntax just does the right thing by default.
