  text: |-
    I thought the problem was that those compiler flags don’t apply if you accidentally do anything UB

    One of the complaints about contracts was more precisely around what is called "mixed mode", where (approximately speaking) the same contract on a specific kind of functions function is compiled multiple times with different flags. This is technically not UB, but the standard did not guarantee exactly which flag(s) would be in effect in the final binary.
    More concretely, say you have pre(x > 0) on a function in a header file for some library you wrote. You want/need this to always be enforced so you specify the appropriate flag in your build files. If a downstream consumer decides to build against the same header and specify that contracts are to be ignored, under the right circumstances the linker may choose the version with ignored contract checks for use in your library, effectively stripping out the checks you specified.
    This behavior was a sticking point to say the least, and at least one NB (Romania IIRC) explicitly said so. A paper proposing something like enforced was rejected before the first failed NB vote, but I guess the failure changed enough minds to get a similar change through this time.

    it seems it then doesn’t address the reason people voted down the first proposal.

    There were multiple objections to the first draft standard. This change (supposedly) resolves some of them. Others (like "remove contracts entirely") were considered but the committee decided that no changes were warranted.
