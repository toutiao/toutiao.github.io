    The syntax is
    pre(x>0)

    But at build time you can configure contract enforcement into an "observe" mode (generally for adoption, etc where you don't know if there are existing issues and don't want instant trap on any failure). There are cases where library authors want to be able to say "this is a security critical invariant" and so not have the trapping behavior overridden by build settings. This is that explicit "ignore any build time rules that attempt to suppress trapping on contract violation".
