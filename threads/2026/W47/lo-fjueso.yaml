    What is the use case for wanting a default mode where the contract isn’t guaranteed to be enforced?

    I write C++ professionally, but have done a lot of Ada open source on the side.
    Ada has fantastic contract support, and you can enable/disable contracts on a per-module basis. Contracts can use slow checks but be in hot paths, so you can turn them off when shipping, but still have them there for documentation purposes and when running for debugging or development purposes. It's great to be able to look at only the spec for a module and know exactly what it lets you do from the pre/post aspects. Being able to use contracts with proofs in Ada's SPARK subset is just icing on the cake.
