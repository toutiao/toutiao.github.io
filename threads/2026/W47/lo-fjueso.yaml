  author: david_chisnall
  text: |-
    Take it from someone who learned Eiffel from Bertrand Meyer and realized first-hand that contracts add little value over assertions if they cannot be proven at compile-time.

    Assertions are contracts (they're the invariant part: contracts include preconditions, postconditions, and invariants).  The problem with C assertions in C++ is the on-definition rule (ODR).  This says that it's fine to have two definitions of the same symbol in different compilation units but they must the identical.  Identical is defined as having the same sequence of tokens.  So, imagine you have this trivial function that negates any twos complement number that can be safely negated:
    inline int negate(int x)
    {
       assert(x != INT_MIN);
       return -x;
    }

    If you compile without NDEBUG, this expands to something like:
    inline int negate(int x)
    {
       if !((x != INT_MIN)) { abort(); }
       return -x;
    }

    If you compile with NDEBUG, it instead expands to something like:
    inline int negate(int x)
    {
       return -x;
    }

    In C++, inline means that the function is defined in line and will be emitted in each compilation unit, but only one copy will be kept during linking.  This means it becomes a COMDAT in typical object models and the linker picks one.
    Now, consider what happens if you pop this function in a header and one compilation unit is compiled with NDEBUG defined and another without it.  This violates the one definition rule and is UB, but what can happen in practice?
    First, the simple case.  Both inline the function.  Both call it with INT_MIN as the argument.  One causes an abort, the other doesn't.  This is slightly confusing, but it's something you can reason about at the source level: in the compilation unit compiled with assertions enabled, the assertion fired and it's fine.
    But now the more complex case.  Neither inlines it.  The linker picks one at link time.  It picks the smaller one, on the basis that it's probably the best optimised one (PE/COFF lets you select policies for which should be picked for COMDATs, ELF doesn't).  So now the assertion doesn't fire anywhere.  But way, it's worse, because the compilation unit compiled without NDEBUG analysed the check and added some known-bits annotations to the function, so now calling code is optimised on the assumption that this function will never return a negative value for a negative argument.  Only it is called with INT_MIN, and negating that returns INT_MIN.  So now surrounding code is optimised on an assumption that is not valid.  That cascades outwards and no optimisation in that compilation unit is sound.
    To make this well defined, the simplest thing is to say that any inline function is replaceable.  This means every inline function is an optimisation barrier.  That would completely kill C++ performance in any compiler.
    P2900 contracts said that contract_assert, pre and post are special and that they don't violate ODR.  This introduces all of the above problems but now says that it's implementation defined how they are resolved.  The GCC implementers report said that all of the miscompilations that were trivial to introduce using contracts with mismatched semantics were 'just bugs' and could be fixed, but did not propose semantics for doing this in a way that preserved both the ability to reason at the source level and performance.
    This is one of the many reasons that I don't think P2900 should be allowed anywhere near the standard.  Your point is another.  In Rust, I've seen huge value from contracts that can be statically verified.  They let you make code that is unsafe in the language sense, but which is statically verified with bespoke proofs to preserve a bunch of properties beyond what 'safe' Rust guarantees and that are vital for security-critical code.  This was out of scope.
    I hope national bodies will vote down this DIS as well, but I suspect that they will blink first and we'll end up with a C++26 that causes immense long-term harm to the ecosystem as a result.
