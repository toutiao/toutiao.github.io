    The difference is that it is a case of "single person involved in choosing the compiler flags", thinking in terms of libraries somewhat muddies it I think, and I think putting the two side by side illustrates the issue directly.
    As far as contentiousness: there are a bunch of people who disagree with the exact tradeoffs made in P2900 (the contracts design and specification paper), but understand that these are tradeoffs, and that it's possible for reasonable people to disagree on the balance of those trade offs.
    P2900 was discussed a lot, and I would argue given a higher bar to climb than any other feature proposal I have witnessed. I voted in support for the inclusion of P2900 in C++26 multiple times, not because it has made the exact trade offs I would have chosen, but because the authors of the paper gave a sound technical rationale for why the particular tradeoffs had been made. This is not glib: I spent a lot of time questioning many of the design decisions that were made.
    What happened with C++26 is that a tiny minority of committee members would not accept that any design is subject to trade offs, and went to great lengths to override the technical consensus. We also learned that it is possible to do this with relatively little effort, so that's concerning.
    Please note that "consensus" does not mean a simple majority vote, but it also does not permit a method of perpetual objection (this is described at https://isocpp.org/std/standing-documents/sd-4-wg21-practices-and-procedures#consensus). IMO the people involved in this failed recognize that failing to convince other members of the committee were as bad as they felt does not mean that those concerns were not heard or recognized as potential problems. Again it is critical that people recognize that almost every feature involves tradeoffs, and there is seldom an objectively correct answer.
