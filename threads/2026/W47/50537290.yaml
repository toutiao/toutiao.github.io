  content: "Web browsers are ubiquitous, but how do they work? This book explains,
    building a basic but complete web browser, from networking to JavaScript, in a
    couple thousand lines of Python.\n\n![The cover for Web Browser Engineering, from
    Oxford University Press](im/cover.jpg)\n_The cover for Web Browser Engineering,\nfrom
    Oxford University Press_\n\n![The cover for Web Browser Engineering in Korean,
    from Hanbit](im/wbe-korean.jpeg)\n_The cover for Web Browser Engineering in\nKorean,
    from Hanbit_\n\n![The cover for Web Browser Engineering in Japanese, from O’Reilly](im/wbe-japanese.jpeg)\n_The
    cover for Web Browser Engineering in\nJapanese, from O’Reilly_\n\nFollow this
    book’s [blog](https://browserbook.substack.com/archive), [Mastodon](https://indieweb.social/@browserbook),
    or [Twitter](https://twitter.com/browserbook) for updates. There’s a [discussion
    forum](https://github.com/browserengineering/book/discussions) for the book on
    Github, or you can [email us directly](mailto:author@browser.engineering).\n\n#
    Part 1: Loading Pages\n\n1. [Downloading Web Pages](http.html)  \nURLs and HTTP
    requests\n2. [Drawing to the Screen](graphics.html)  \nCreating windows and drawing
    to a canvas\n3. [Formatting Text](text.html)  \nWord wrapping and line spacing\n\n#
    Part 2: Viewing Documents\n\n1. [Constructing an HTML Tree](html.html)  \nParsing
    and fixing HTML\n2. [Laying Out Pages](layout.html)  \nInline and block layout\n3.
    [Applying Author Styles](styles.html)  \nParsing and applying CSS\n4. [Handling
    Buttons and Links](chrome.html)  \nHyperlinks and browser chrome\n\n# Part 3:
    Running Applications\n\n1. [Sending Information to Servers](forms.html)  \nForm
    submission and web servers\n2. [Running Interactive Scripts](scripts.html)  \nChanging
    the DOM and reacting to events\n3. [Keeping Data Private](security.html)  \nCookies
    and logins, XSS and CSRF\n\n# Part 4: Modern Browsers\n\n1. [Adding Visual Effects](visual-effects.html)
    \ \nBlending, clipping, and compositing\n2. [Scheduling Tasks and Threads](scheduling.html)
    \ \nThe event loop and the rendering pipeline\n3. [Animating and Compositing](animations.html)
    \ \nSmooth animations using the GPU\n4. [Making Content Accessible](accessibility.html)
    \ \nKeyboard input, zooming, and the accessibility tree\n5. [Supporting Embedded
    Content](embeds.html)  \nImages, iframes, and scripting\n6. [Reusing Previous
    Computation](invalidation.html)  \nInvalidation, editing, and correctness\n\n#
    Conclusion\n\n1. [What Wasn’t Covered](skipped.html)\n2. [A Changing Landscape](change.html)\n\n#
    Appendix\n\n1. [Glossary](glossary.html)\n2. [Bibliography](bibliography.html)\n3.
    [About the Authors](about.html)\n4. [Contributors](/thanks)\n5. [List of courses
    taught from this book](classes.html)\n6. [One-page version](onepage.html)"
