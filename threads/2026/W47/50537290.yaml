  text: "&gt; On top of all of that, modern browsers also execute WebAssembly, a hardware-independent
    bytecode format for many other programming languages to target, and which may
    one day be co-equal to JavaScript on the web.<p>I skipped around a bit, but when
    I stumbled onto this opinion I backed out.<p>This is not the point of wasm at
    all. Wasm is there as a compatibility layer and for squeezing extra performance
    out of critical sections of code. The decisions to restrict its API access are
    very sensible. We can&#x27;t honestly still be confused about this in 2026.<p>I
    excused the python code since a serious browser is not the point, but I&#x27;m
    now suspicious of other intuition-building done throughout the rest of the book."
