  author: coreyp_1
  text: Nice.<p>I&#x27;m on the path to building a browser.  I had vaguely remembered
    this site from when it was listed before, but I couldn&#x27;t find it when looking
    again.  It&#x27;s bookmarked now. :)<p>I&#x27;m writing my own libraries (because,
    with AI, why not indulge in low-level fun?), and I&#x27;m almost to the layout
    engine.<p>So far (all C libraries), I can read multiple image formats, parse HTML&#x2F;XML
    and CSS, rasterize text and just about anything that can be required by CSS or
    SVG.  Fonts were fun... I can do TTF but not WOFF yet.  I can do some WASM, but
    no JS engine yet.  I do have my Regex engine, though.  (I had built WASM first
    because it&#x27;s being used for another project).  Still a long way to go.  Only
    approx 780K lines spread out across 30 or so libraries written so far.
