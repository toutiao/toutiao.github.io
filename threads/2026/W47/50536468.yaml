  author: colek42
  text: We should probably be measuring deployable merges to main.  The math just
    doesn&#x27;t work for pipeline based CI as you add more agents.<p>Three things
    matter.<p>1 -- How many non-conflicting changes can actually be made at one time
    (Fan Out)<p>2 -- How long a critical path takes<p>3 -- How many times you have
    to run that critical path.  Most orgs run it 2-3x, once before the PR in the agent
    loop, once in CI, and another in the MQ<p>This is why most orgs cant get past
    about 12 PRs an hour.
  score: 0
