  author: emscb
  text: When I trimmed my tests, I looked for ones that could be merged. Many unit
    tests shared the same setup and teardown, so when I merged their middle parts,
    that setup and teardown only had to run once. Even after merging, the tests still
    had to stay independent of execution order, so I checked that. In another case,
    some infrastructure checks were repeated across tests in one folder. For example,
    “the app needs environment variable A at startup” is already a test of its own,
    but every application-layer test also asserted it at the start. I kept that check
    in one place instead.
