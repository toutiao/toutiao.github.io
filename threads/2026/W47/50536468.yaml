  author: yonasb
  text: 'Good question! In terms of the what counts as a win for our agents: speed
    alone isn&#x27;t enough. A change only counts if the patched run and the unchanged
    run executed the same tests (same test IDs, same coverage).<p>Re-sharding is allowed
    because it only changes where tests run, not what runs. It has the same sort of
    parity check as other patches but it also has a cost check to make sure the change
    doesn&#x27;t increase runner time by more than 5% by default. We added the cost
    check after seeing the agents crush wall clock while 10x&#x27;ing costs on some
    test :)<p>Judging whether or not a test should be trimmed isn&#x27;t something
    our agents do yet, because as you alluded to, it&#x27;s hard. But we&#x27;re working
    on it! If you have any ideas or an approach that&#x27;s worked for you, would
    love to hear it.'
