  author: jwilliams
  text: '&gt; 3 -- How many times you have to run that critical path. Most orgs run
    it 2-3x<p>This is the one we went after. Our agents have to run tsc, lint and
    the unit tests before they push (it&#x27;s in a hook), and CI was then doing all
    three again from scratch. Now the agent records what it ran as a git trailer on
    the commit and the PR build skips those steps [1]. Anything headed to main still
    runs everything, so the trailer only has to be trusted on the intermediate pushes.<p>Builds
    went from ~10 minutes to 1.5 over a few weeks, and a good third&#x2F;half of that
    was this change. It tends to compound too - getting the build time down led to
    lower contention, warmer caches, faster throughput. All the usual queuing theory
    stuff.<p>[1] <a href="https:&#x2F;&#x2F;jonathannen.com&#x2F;dont-run-it-twice&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;jonathannen.com&#x2F;dont-run-it-twice&#x2F;</a>'
  score: 0
  posted_at: '2026-11-18T00:05:13Z'
