  text: |-
    Think of it like a recursive process which terminates for 0, but produces an infinite recursion for anything else.<p><pre><code>    repeat_digit(x) = x &#x2F; 10 + repeat_digit(x &#x2F; 10)
    </code></pre>
    Since 0 &#x2F; 10 = 0, 0.0 &#x2F; 10 = 0, and 0.000 &#x2F; 10 = 0, and 0 + 0.0 + 0.000 = 0, etc - we know that this produces 0 and could short circuit it to terminate - maybe clearer instead to write:<p><pre><code>    repeat_digit(x) =
            if x == 0 then 0
            else x &#x2F; 10 + repeat_digit(x &#x2F; 10)

        repeat_digit(0) = 0        ;; terminates
        repeat_digit(9) = 0.999... ;; never terminates</code></pre>
