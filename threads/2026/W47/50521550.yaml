  text: '<a href="https:&#x2F;&#x2F;math.stackexchange.com&#x2F;questions&#x2F;12906&#x2F;the-staircase-paradox-or-why-pi-ne4"
    rel="nofollow">https:&#x2F;&#x2F;math.stackexchange.com&#x2F;questions&#x2F;12906&#x2F;the-staircase...</a><p>I
    would say this is a good example where it&#x27;s geometrically &quot;proven&quot;
    that pi = 4.  It&#x27;s convincing enough where if someone didn&#x27;t already
    learn the value of pi, I might expect them to believe this proof.<p>The idea is
    that if you circumscribe a square around a unit circle and take its perimeter,
    you obtain 4.  If you &quot;invert&quot; the corners of the square until they
    hit the circle, the perimeter remains unchanged.  If you iterate infinitely, the
    sequence of polygons eventually converges to the circle.<p>In this case, the sequence
    truly does converge to a circle.  However, the subtle  detail is that, in the
    limit, this manner of measuring perimeter is the taxicab metric (and NOT the Euclidean
    metric), where pi actually does equal 4.  It&#x27;s not so obvious geometrically,
    but it shows that there&#x27;s a distinction between a sequence of curves and
    the corresponding sequence of lengths.<p>EDIT: Though, having said all this, I
    feel the proof given about 0.999... equaling 1 is rigorous, but I suppose there&#x27;s
    some subjectivity involved.'
