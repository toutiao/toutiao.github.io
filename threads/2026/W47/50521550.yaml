  text: This is purely a fact of notation though. 0.999... is defined to be a &quot;destination&quot;
    and not an ongoing process such as &quot;lim&quot;.<p>So you cannot take 0.999...
    to the infinity-th power to get it to zero, you still get one. The issue is that
    you need to couple the exponent to the length of digits because the rate at which
    the exponent grows decides whether you go to zero or one.
