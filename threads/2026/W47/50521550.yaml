  author: jeremyscanvic
  text: This is a good opportunity to remind a fun property about decimal expansions
    (&amp; expansions in other bases). One might intuitively think that real numbers
    have a unique decimal expansion but the fact that 1.000... = 0.999... disproves
    it. Still, it&#x27;s not too difficult to show that every real number admits a
    unique decimal expansion _unless_ it has one that ends with a sequence of zeros
    or a sequence of nines. In that case it has exactly two decimal expansions. This
    shows that 1.000... = 0.999... is the only such quirk, all the other cases are
    basically the same, 232.128000... = 232.127999... for instance.
