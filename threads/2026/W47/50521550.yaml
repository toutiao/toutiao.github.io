  author: sparkie
  text: |-
    The trouble is that definition isn&#x27;t clear. We&#x27;re told that `...` means &quot;repeat the last 3 digits&quot; - this isn&#x27;t the same as saying &quot;it refers to the number it approaches&quot; - in fact, mathematicians are the source of the confusion because they refuse to admit that repeating a decimal ∞ times is a way of expressing a limit.<p>For any finite N, we can say:<p><pre><code>    repeat_N_times(n : Nat, sum : Real, decimal : Real) =
            if n == 0 or decimal == 0 then 0
            else repeat_N_times(n - 1, sum + decimal, decimal &#x2F; 10)

        f(n, decimal) = repeat_N_times(n, 0, decimal)
    </code></pre>
    So eg,<p><pre><code>    f(_, 0.0) = 0 [for any N]

        f(1, 0.9) = 0.9
        f(2, 0.9) = 0.99
        f(6, 0.9) = 0.999999
    </code></pre>
    Obviously, if we give ∞ for n when the decimal is nonzero, the function never terminates, but, the sum also never reaches 1 - since each successive call only closes the gap by 9&#x2F;10th the difference between the previous sum and 1.<p>So, we can specify that<p><pre><code>    lim   f(n, 0.9) = 1
        n-&gt;∞
    </code></pre>
    In other words,<p><pre><code>    0.999... = lim   f(n, 0.9) = 1
                   n-&gt;∞
    </code></pre>
    But f(∞, 0.9) and 0.999... are two equivalent ways of expressing an &quot;infinitely repeated 9&quot; after the decimal point.<p>So does `...` refer to an infinitely repeated decimal, or does it not? Are f(∞, 0.9) and 0.999... equivalent?<p>If not, then 0.999... is clearly not <i>just</i> a &quot;repeated decimal&quot;, because that&#x27;s what `f(∞, _)` is - by inductive definition.<p>So, we should either stop calling `...` a &quot;repeating decimal&quot; or accept that repeating decimals represent limits.<p>If we accept that repeating decimals are limits (they are), then nobody need challenge that 0.999... = 1 - it&#x27;s obviously true.<p>Tell that to a mathematician and they say: NO! Repeating decimals are not limits!
