  text: "&gt; in fact, mathematicians are the source of the confusion because they
    refuse to admit that repeating a decimal ∞ times is a way of expressing a limit.<p>Nonsense.
    0.999... = 1 and other repeating decimals are commonly mentioned or shown when
    teaching limits and geometric series.  I am a mathematician, and have taught exactly
    this many times, as have my colleagues.<p>Technically the repeating part of the
    repeating decimal is notation for a geometric series with a negative power of
    10 as the common ratio, and the number being represented is the sum of the series,
    which is the limit of the sequence of partial sums (a limit!). Describing repeating
    decimals as series rather than limits does seem clearer though (the limit is of
    a sequence you&#x27;re not explicitly mentioning or seeing).<p>It&#x27;s also
    true that repeating decimals are rational numbers, a fact often taught well before
    limits. This is often a simpler way to think about them, and is what the algebraic
    proof at that of the article uses, showing 0.999... = 9&#x2F;9 = 1."
