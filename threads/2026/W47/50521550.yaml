  author: Sharlin
  text: "0.9… should not be seen as any kind of process. It’s simply another way of
    spelling 1, just like 4&#x2F;6 is another way of spelling 2&#x2F;3, as is -2&#x2F;-3.
    There’s nothing special, mysterious, or non-numeric about it. It’s simply another,
    redundant encoding of the same number.<p>Any place-value numeral is a shorthand
    for writing a particular geometric series. Only considering numbers between 0
    and 1:<p><pre><code>  0.abc… = a*10^-1 + b*10^-2 + c*10^-3 + …\n</code></pre>\nIf
    there exists one last nonzero digit in the place-value representation, there is
    one last nonzero term in the series, and the sum is trivial to compute.<p>But
    if the place-value string is infinite? Well, we know that infinite series can
    have finite sums, and in particular <i>all</i> of these place-value series converge
    and have finite sums [exercise: show why].<p>Specifically, the sum of a converging
    infinite series, and thus the value of the corresponding place-value expression,
    is defined as the <i>limit</i> of its finite prefix sums. The general formula
    for the sum of a converging geometric series such as 0.9… is<p><pre><code>  S
    = a &#x2F; (1 - r)\n</code></pre>\nwhere a is the first term and r the ratio of
    two consecutive \nterms. In this case S = 0.9…, a = 0.9 and r = 0.1. So<p><pre><code>
    \ 0.9… = 0.9 &#x2F; (1 - 0.1)\n\n       = 1\n</code></pre>\nIntuitively, the prefix
    sums of 0.9… are<p><pre><code>  0.9\n  0.99\n  0.999\n  0.9999\n  ...\n</code></pre>\nand
    it’s &quot;clear&quot; that the limit of this sequence at infinity is 1. And because
    0.9… is by definition that limit,<p><pre><code>  0.9… = 1.</code></pre>"
