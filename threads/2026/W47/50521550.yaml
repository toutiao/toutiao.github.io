  author: sparkie
  text: "It&#x27;s a process, because for any terminating number, if you multiply
    it by 10, it shifts a zero in on the right.<p><pre><code>  0.9 * 10 = 9.0\n</code></pre>\nBut
    for non-terminating numbers, they shift something non-zero in on the right when
    multiplied by 10.<p><pre><code>  0.999... * 10 = 9.999...\n</code></pre>\nAlso,
    consider something like:<p><pre><code>  1.999... &#x2F; 2\n</code></pre>\nFor
    any terminating sequence of .999, the result shifts a 5 in on the right<p><pre><code>
    \ 1.99 &#x2F; 2 = 0.995\n</code></pre>\nBut for non-terminating sequence, it shifts
    in another 9.<p><pre><code>  1.999... &#x2F; 2 = 0.999...\n</code></pre>\nHow
    do you explain this without a process?<p>---<p>Intuitively:<p><pre><code>  1 -
    0.9 = 0.1        (1 &#x2F; 10^1) [1 decimal place]\n  1 - 0.99 = 0.01      (1
    &#x2F; 10^2) [2 decimal places]\n  1 - 0.999 = 0.001    (1 &#x2F; 10^3) [3 decimal
    places]\n  1 - 0.9999 = 0.0001  (1 &#x2F; 10^4) [4 decimal places]\n</code></pre>\nThen
    for an infinite number of decimal places:<p><pre><code>  1 - 0.999... = 1 &#x2F;
    10^∞\n</code></pre>\nSo for 0.999... = 1, you have to convince someone that 1
    &#x2F; 10^∞ = 0<p>Which is true in standard analysis - there are no non-zero infinitesimals
    - but there are other number systems besides the reals which do have infinitesimals.<p>While
    I accept that 0.999... = 1 in standard analysis, it is not at all intuitive to
    me that 0.999... is a number and not a limit.<p>---<p>Suppose we write a function
    to produce a number with `n` 9s after the decimal point:<p><pre><code>    f&#x27;(n,
    sum, dec) = \n        if n == 0 || dec == 0 then sum \n        else f&#x27;(n
    - 1, sum + dec, dec &#x2F; 10)\n  \n    f(n) = f&#x27;(n, 0, 0.9)\n</code></pre>\nThen
    its clear that<p><pre><code>    f(1) = 0.9\n    f(2) = 0.99\n    f(3) = 0.999\n
    \   ...\n</code></pre>\nFor any `n`, the result will never reach `1`. Each successively
    larger `n` only ever closes 9&#x2F;10ths of the gap. There is no way to close
    that extra 1&#x2F;10th of the gap.<p>By definition of `...` meaning &quot;repeat
    the previous 3 digits an infinite number of times&quot;, we can accept that f(∞)
    = 0.999... - two different ways to specify the same thing - a non-terminating
    sequence of 9s after the decimal point.<p>It&#x27;s only intuitive to me then
    that:<p><pre><code>    lim   f(n) = 1\n    n-&gt;∞\n</code></pre>\nSince no single
    `n` can actually ever produce 1. Even f(∞) &lt; 1, as we didn&#x27;t include any
    clause that specifies if n = ∞, add in the additional, 1&#x2F;10th the difference
    between the sum and 1.<p>If you plot f(n), you will see quite clearly that it&#x27;s
    an asymptote that approaches 1 as n-&gt;∞<p>If repeated decimals are limits, it
    makes perfect sense. The claim that `0.999...` is not a limit, but just a number,
    is why its unobvious that 0.999... = 1"
