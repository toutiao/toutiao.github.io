  author: yubblegum
  text: 'The original post is playing with your head. Let&#x27;s do grown up math.<p>We
    define L_0, limit to zero in the Real domain. This is as close as you can get
    to 0. We define L_1, limit to(wards) 1 as that which leaves a difference of L0
    to 1. I.e. <i>L_1 := 1 - L_0</i>.<p>This L_1 is what is &#x27;pictorially&#x27;
    (even in the mind&#x27;s eye) imagined as representable by an infinite sequence
    of 9s in 0.999.... But it has a precise &quot;value&quot;: L_1. It is informative
    here to recognize that we <i>can not</i> do the same for L_0, since that is 0.000....
    and that &#x27;inability to visualize&#x27; right there should be meta information
    for you that &#x27;this is a formalism that is being pushed to its limits&#x27;.
    But we also have a precise definition for value of L_0 as noted. And we have defined
    L_1 in terms of (a &#x27;graspable&#x27; 1) and an hypothetical L_0.<p>Now <i>(N
    x L_1)</i> -- which requires the &#x27;shifty&#x27; shifting the digits bit in
    the mathematic schtick here to &quot;visualize&quot; -- also has a &#x27;precise&#x27;
    value:<p><i>N x L_1 = N x (1 - L_0) = N - NxL_0</i>.<p>So we now do the magic
    trick of substracting x (which is L_1) from Nx, that is N x L_1.  Amazing: Nx
    - x where x is L_1 gives us 9 - 9 x L_0, that is 9x! But in the &#x27;pictures&#x27;
    the &#x27;9 x L_0&#x27; terms is no longer seen! Hmm. Is that possibly because
    we can&#x27;t &quot;visually shift&quot; L_0 ? Is that possibly because we can&#x27;t,
    using the conceptual lens of digital numbers, &#x27;see&#x27; 9 times L_0?<p>Another
    way of looking at this is to ask if you are OK with considering L_0 to be 1&#x2F;ℵ0
    .  and .999... another way of saying 1 - 1&#x2F;ℵ0. Then multiplying the number
