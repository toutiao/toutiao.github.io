  author: sparkie
  text: |-
    Consider, intuitively:<p><pre><code>    1 - 0.9 = 0.1       (1 &#x2F; 10^1) [1 dp]
        1 - 0.99 = 0.01     (1 &#x2F; 10^2) [2 dp]
        1 - 0.999 = 0.001   (1 &#x2F; 10^3) [3 dp]
        1 - 0.9999 = 0.0001 (1 &#x2F; 10^4) [4 dp]
        ...
        1 - 0.999... = ???  (1 &#x2F; 10^∞) [∞ dp]
    </code></pre>
    For `n` digits after the decimal point, the difference between 1 and .9[n] is always 1&#x2F;10^n. Why would it not also be for infinity?<p>Lets <i>suppose</i> 1&#x2F;10^∞ is a number (obviously not a <i>real</i> number, but a number nonetheless). Call it ϵ<p><pre><code>    0.999... = 1 - ϵ
    </code></pre>
    Now, lets look at this common &quot;proof&quot;, using this<p><pre><code>    x = 0.999...
        10x = 9.999...      [by multiplying by 10]
        10x = 9 + 0.999...  [by splitting off the integer part]
        10x = 9 + x         [by definition of x]
        9x = 9              [by subtracting x]
        x = 1               [by dividing by 9]
    </code></pre>
    There&#x27;s a flaw here on the second line: The assumption that 10 * 0.999... = 9.999...<p><pre><code>    x = 0.999...
        x = 1 - ϵ            [by assuming ϵ is a number]
        10x = 10 - 10ϵ       [by multiplying by 10]
        10x = 9 + (1 - 10ϵ)  [by splitting off the integer part]
        10x = 9 + x - 9ϵ     [by definition of x]
        9x = 9 - 9ϵ          [by subtracting x]
        x = 1 - ϵ            [by dividing by 9]
    </code></pre>
    In the original proof, they&#x27;re silently adding 9ϵ to the result when multiplying by 10.<p><pre><code>   10x = 9.999... = 10 - ϵ
    </code></pre>
    Which of course is incorrect. 10*(1 - ϵ) = 10 - 10ϵ, by usual mathematical convention. Where did the additional 9ϵ magically appear from?<p>The original &quot;proof&quot; <i>assumes</i> that ϵ = 0 and therefore 10ϵ = ϵ<p>But if ϵ is not 0, then the proof falls apart, because 10ϵ != ϵ<p>So 0.999... = 1 <i>iff</i> ϵ = 0<p>Does 1&#x2F;10^∞ = 0?<p>For <i>real</i> numbers, it&#x27;s just a given. You must simply accept it and move on.
