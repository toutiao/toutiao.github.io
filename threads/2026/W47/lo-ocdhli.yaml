  text: |-
    I gave it a spin this morning... it has some good ideas (the timeline is great but hidden), but it fails to be an MVP product imo. It still struggles with a variety of problems that most other harnesses have moved past awhile ago and being localhost:<port> browser-based but keyboard driven is a design flaw I cannot wrap my head around.
    Then because of how complex the interactions are between things, there are states you can get the UI into that just don't really make sense and the terminology is so jargony it's pretty hard to figure out what anything means.  They have a tutorial at the start that doesn't really answer anything serious and when the UX is this complex it should be broken down by tree. The first time you turn on "winch mode" it should tell you what this does (I still don't really understand it)

    UI components are not adequately tested


    put it in "winch" mode (whatever that means)
    click the feedback button
    it breaks by not opening the feedback form
    I found multiple examples of this sort of broken flows in 30 minutes of toy work


    Approval flow is bad:


    start some work
    tab away
    tab back
    hit Alt+1 to try to approve command -> Browser macros take over because of focus, so you have to click back into the UI every time. For something that's supposed to be keyboard driven, it's pretty hostile to how people actually use keyboards


    There are no notifications when the harness needs you, so you don't know when it needs approvals, this one is flabbergasting
    The approvals system is incredibly broad-stroke, you cannot approve gh pr* for instance you just have to approve all ShellCommand's without any sort of safety checks, which is a mind blowing footgun for a modern LLM harness to ship as the default behavior. Even if you are the most competent LLM engineer in the world at some point due to how it's set up prompt fatigue will bite hard here.

    I would say this is indicative of a lot of the UX, there are just little details that are broken that should have been trivially solvable by a robust test harness + LLM assisted coding, but even beyond that the core of the product feels like a coding harness that was released in the gen1 wave of harnesses and that is pretty disheartening.
