  content: "By [Mickey&nbsp;Petersen](/about)[No comments](#comments)\n\nIt’s been
    a little bit quiet around these parts; sorry about that. I’ve been really busy
    for the past fifteen months with a major project that I am finally ready to formally
    release. So I’d like to talk about that project, and also a potted history of
    AI and Emacs.\n\nIt’s called [DreamCoder](https://www.dreamcoder.ai), an AI coding
    harness that is very different from the ones you’re probably familiar with already.\n\nI
    installed Claude Code a few days after its first release some time in May 2025.
    I put some coins in the slot machine and I put it to work building a complex piece
    of enterprise middleware I’d built several times in my career. Wow.. watching
    this thing chomp its way through the project with that chaotic, early Sonnet energy.
    It was far, far from perfect; it required a lot of human steering, input and correction,
    but the speed advantage was undeniable, and seeing it jump between disparate programming
    languages, frameworks and theoretical and practical programming from one turn
    to the next was just such a sight to behold.\n\nOne thing that struck me with
    Claude Code is that it was the first terminal application I’d used in a long time.
    I found it an odd choice for a coding agent; then everyone else copied them and
    made their own terminal coding agents.\n\nWhy on earth do I have to stare at a
    shoe rack-sized terminal window to do this? Sure there are GUI versions also;
    but the terminal interface remains the primary modality for most of these tools.
    Most GUIs, and most harnesses now have them also, are second-class citizens. And
    they all look the same. A boring sidebar with chat headings and a chat pane is
    what most of them look like.\n\nBut a serious coder needs more than that. Even
    a casual user will bristle when they try to copy and paste multi-line text in
    a terminal.\n\nSo in May 2025 I decreed that I would build a better harness, and
    surely now that I have AI this should not take more than 2 or 3 months to build.\n\nAnd
    so, after 15 months of work, and endless UI and backend iterations, culminating
    in a successful beta test, I am now ready to release DreamCoder, which is I think
    the acme of what a coding harness should be.\n\n![DreamCoder with chats, a code
    review and a terminal tiled side by side](/static/uploads/dreamcoder/first-look.webp)\n_DreamCoder
    is a frontier coding harness with a tiling window manager that runs in your browser
    on all 3 platforms._\n\nBefore I get into the meat and potatoes of all of that,
    I want to talk about AI history and Emacs’s role in it.\n\nLet’s roll back time
    to the 1950s.\n\n## Past\n\nEmacs and LISP, if you did not know, both have a special
    place in the annals of AI history.\n\nJohn McCarthy was an AI researcher at MIT,
    and in the 1950s he set out to create the _Advice Taker_, a piece of software
    that envelops a framework for what a basic human should know that he called _commonsense
    reasoning_ using “mathematical logic”. His postulation was that if we can express
    with symbolic precision all the aspects of what constitutes humanity like ordinary
    facts about life, that we can set in motion the rudiments of AI.\n\nIn the 50s
    there was little in the way of computer software that could do this. To formalize
    such a system you need a lot of data, rigorously formatted, and a method of manipulating
    the data. The data and code itself may intertwine _recursively_, and so an ordinary
    programming language would not work.\n\nTo help him achieve this, McCarthy created
    the LISt Processing (LISP) language made up of two facets: M-expressions, a functional
    language in the vein of Algol; and S-expressions, designed for symbolic data representation,
    and never intended as a method of writing code. S-expressions were dolled up with
    parentheses. M-expressions meanwhile used square brackets to visually separate
    the two. Uniquely, the language specification had an _eval_ feature that would
    prove that the language is also a universal Turing machine… if only McCarthy had
    the means to do so. It was theoretical because McCarthy lacked, in time, staff
    and money, what he needed build this recursive evaluator that can take as input
    its own world state and evaluate it alongside new expressions, a fact made even
    more apparent by the sheer complexity of his M-expression language and the limited
    resources he had at the time.\n\nSteve Russell who worked with him proved him
    wrong the way most young people do: by just doing it. Russell wrote the first
    LISP Interpreter with a working _eval_ function, but M-expressions got sidelined;
    the imperative, procedural nature of programming got squished into S-expressions
    instead. They had to hand roll the language on paper then punch it into cards
    and then batch run them. Eliding M-expressions was a simple matter of pragmatism.
    And so LISP was born. And through several accidents of history, M-expressions
    never gained traction. M-expressions live on in Wolfram’s Mathematica, but few
    other places.\n\nMuch later, McCarthy eventually conceded that,\n\n> “One can
    even conjecture that LISP owes its survival specifically to the fact that its
    programs are lists, which everyone, including me, has regarded as a disadvantage.”\n\nS-expressions
    were always intended as the storage format with a bridge language to manipulate
    them. But by pushing evaluation into the same symbolic representation format as
    the data, we have what we call LISP today. That is why LISP is so unique. Consider
    a simple calculator. `(+ 2 2)` can simultaneously represent an expression that
    we want to compute, _two plus two_, or perhaps a ledger of record of a calculation
    we have already done.\n\nMcCarthy never built the Advice Taker in its purest form.
    He and his team ran into many philosophical, mathematical and computational walls
    that kept them occupied for a long time.\n\nThe idea behind the Advice Taker was
    simple. If you want to go somewhere in your car, you can symbolically express
    this by building a chain of narrative facts – kinda like a flowchart, but as small
    snippets of rules and facts, not as one grand design.\n\nThe system would automatically
    resolve ambiguities, and all the logician had to do was capture the microcosm
    of the world he wished to represent:\n\n    (at me home)\n    \n    (walkable
    home car)\n    (walkable home driveway)\n    (drivable car shop)\n\nAnd so on.
    If you’re a student of Computer Science you’ll see echoes of Prolog here. The
    intent was simple: if we can symbolically express the world around us, we can
    _advise_ that symbolic world with real-life facts, and have the automaton that
    uses this reified symbolic world change with it.\n\nBut the axiomatic complexity
    of a world model would never survive an encounter with a 3-year-old child. Every
    axiom you write begets a new one — so you can walk to your front door? Well what
    if the door is locked? Or what if your car is parked on the street and not in
    your drive way?\n\nA rules-based order of the world is a tender, beautiful one;
    but it is hard to build. It’s a fractal of ever-more specific and pedantic rules
    that conspire against you, just as you think you have a soluble world, typed and
    ready.\n\nAnyone who has ever written Prolog knows exactly what _that_ feels like!\n\nI
    have my own personal story to add to this. In the 90s as a teenager I got a summer
    internship at a business that built banking software. They clearly didn’t know
    what to do with us teenaged interns, so on our first day they crammed us in a
    room and split us into teams and told us to build a flow chart for assembling
    a bike. Team exercise or something. Best one wins. We were told to be as specific
    and explicit as possible and account for as many conditions as we could think
    of, and the poor employees who had to mind us did their best to help. I distinctly
    recall losing because in my flowchart I forgot to open the box the disassembled
    bike came in.\n\nMcCarthy meanwhile eventually moved on and set up his own AI
    lab at Stanford, but the _idea_ of the Advice Taker lived on.\n\nIn the late 70s"
