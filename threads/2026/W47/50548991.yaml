  author: Confiks
  text: 'Buying through their own store or through their Amazon page should give you
    an unlocked flash path through the USB connection. I bought three (X3, X4 original,
    X4 Pro) and got three unlocked ones. Buying through Aliexpress might give locked
    version, which are still flashable OTA (and the newer ones through SD-card), which
    could be risky indeed if the bootloader gets mangled.<p>You might want to consider
    using Crosspoint&#x27;s affiliate link to support the project (I don&#x27;t have
    an affiliation myself): <a href="https:&#x2F;&#x2F;crosspointreader.com&#x2F;devices"
    rel="nofollow">https:&#x2F;&#x2F;crosspointreader.com&#x2F;devices</a>'
  score: 0
  posted_at: '2026-11-18T20:10:20Z'
- id: '50551516'
  parent_id: '50551461'
  author: Confiks
  text: 'For the Chinese market, they have a version where you can flash it with open
    firmware through their official firmware over Wifi or via SD-card. However with
    that version you can&#x27;t overwrite the firmware through USB directly. It&#x27;s
    risky because when you install a faulty bootloader, there is no recovery path.<p>I
    really have no idea why they made this choice specifically for that market. It
    causes a lot of understandable FUD.<p>If you buy the &#x27;international version&#x27;
    through their store, you&#x27;ll get a version that allows you to flash directly
    through USB, bypassing the bootloader entirely. There&#x27;s also Crosspoint&#x27;s
    affiliate link (I&#x27;m not affiliated) that leads to there: <a href="https:&#x2F;&#x2F;crosspointreader.com&#x2F;devices"
    rel="nofollow">https:&#x2F;&#x2F;crosspointreader.com&#x2F;devices</a>'
  score: 0
