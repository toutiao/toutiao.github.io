  author: abnry
  text: "There are four Fourier Transforms:<p>1. The (traditional) Fourier Transform
    for real-domain functions.<p>2. The Discrete Time Fourier Transform (DTFT) for
    integer-domain function.<p>3. The Continuous Time Fourier Transform (CTFT) for
    unit circle-domain (or periodic) functions, also known as Fourier Series decomposition.<p>4.
    The Discrete \n Fourier Transform (DFT) for finite integer domain functions.<p>You
    might say there are only three of these transforms because 2 and 3 are essentially,
    but not quite, inverses of each other.<p>But really there is only one Fourier
    transform. In a few senses actually. There&#x27;s character theory which unites
    them all based on the (topology and group structure of the) function domain. So
    reals, integers, unit circle, and finite integers are the function example domains.<p>But
    another way they are all united is with distributions and dirac delta functions.
    The dirac comb is very important for understanding it. Any time you have a discrete
    series, represent it as dirac impulses and apply the normal Fourier Transform
    (operating on distributions) maps it to the other transforms.<p>You can represent
    the DFT as a periodic sequence of impulses and just apply the normal transform.<p>You
    can also interpret the DFT as the DTFT operating on a finitely supported discrete
    sequence. The math is the same but you just compute it at a finite grid in frequency
    space. This is why zero padding increases your frequency resolution or interpolates
    in the frequency domain."
