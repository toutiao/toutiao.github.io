  text: DFT works great if you have a single with equal spacing in the time domain
    (e.g. you have a microphone, and you measure the signal every 1&#x2F;20k s or
    so).<p>If that&#x27;s not the case, rather than interpolating into a time grid,
    it&#x27;s often better to use a generalization of the DFT called the &quot;Lomb-Scargle
    Periodogram&quot;.<p>For example if you have a periodic process like measuring
    the distance between two planets, but you only get measurements at random timestamps,
    that&#x27;s the way to go.<p>See for example <a href="https:&#x2F;&#x2F;docs.astropy.org&#x2F;en&#x2F;stable&#x2F;timeseries&#x2F;lombscargle.html"
