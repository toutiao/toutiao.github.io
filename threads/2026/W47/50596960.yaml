    In the [previous post on this topic](https://eli.thegreenplace.net/2026/notes-on-discrete-time-fourier-series-and-transform/), we’ve seen how the Discrete-Time Fourier Series (DTFS) and transform (DTFT) are used to analyze infinite-duration periodic and non-periodic discrete signals. Now, it’s time to turn to realistic digital signal processing where signals are not only discrete, but also _finite in duration_.

    ## Analyzing signal samples

    Suppose we have samples of a signal - it’s a list of numbers:

    We want to analyze the frequencies present in this signal; in other words, to find the coefficients in a series of complex exponentials that reconstructs the signal. One option is to assume that is an infinite domain signal with zero values outside our samples, and then compute its DTFT:

    However, this is a _continuous function_ of frequency , so it’s difficult compute on an actual computer; we cannot evaluate and store it for all , so we have to choose which to compute it for. We'll soon see how this choice is made.

    ## The Discrete Fourier Transform (DFT)

    But there's an alternative way to look at the problem. We only have samples of the signal , so we can assume they represent a single period of a periodic signal. And in that case, we can use DTFS; recall that the coefficients of the series are:

    As we’ve seen in the [post on the DTFS](https://eli.thegreenplace.net/2026/notes-on-discrete-time-fourier-series-and-transform/), this series can be used to reconstruct a discrete, periodic signal _precisely_. Since our signal is finite and we assume it’s just one period of a periodic signal, it means we can also reconstruct precisely using a DTFS.

    This is the main insight behind the Discrete Fourier Transform (DFT). First, by convention [[1]](#footnote-1) we define:

    And then:

    This is called the Discrete Fourier Transform of . The term_transform_ may be a bit puzzling here - after all, we’re just using the series coefficients - so isn’t it more proper to just say _series_? Perhaps, though in mathematics a _transform_ has a pretty general meaning of "a mapping that takes a mathematical object and produces another object"; in that sense, "transform" is proper here because we take an object - and produce another object - .

    Moreover, DFT and DTFT are intimately related. Recall how we said earlier that the DTFT is tricky to compute because is a continuous variable? Well, the DFT gives us a way to _sample_ that variable into the discrete domain:

    So the DFT can be seen as exactly equally spaced samples of the DTFT.

    ## Computing the DFT

    Since the goal of this post is specifically to demonstrate _computable_methods of applying Fourier analysis to discrete digital signals, here’s the Python code to calculate the DFT of a signal:

        def dft(x):"""Return X[k] = sum\_n x[n] exp(-2 pi i k n / N)."""N=len(x)n=np.arange(N)X=np.empty(N,dtype=complex)forkinrange(N):weights=np.exp(-2j\*np.pi\*k\*n/N)X[k]=np.sum(x\*weights)returnX

    It shouldn’t be hard to see the correspondence between this code and the mathematical formula for . Python’s Numpy code is vectorized by default, so the array is computed in whole for every (because is an array of indices ).

    ## DFT and the complex roots of unity

    In my earlier post on the [complex roots of unity](https://eli.thegreenplace.net/2026/notes-on-the-complex-roots-of-unity), we’ve seen how powers of the roots of unity form an orthogonal basis for. Now let’s show the beautiful theoretical connection between this fact and the DFT.

    Recall that the -th roots of unity can be written as:

    Since all are just powers of , we can write them as:

    The conjugates of the roots of unity are roots of unity themselves:

    With being the same as , so when we enumerate all the roots of unity, we’re also enumerating their conjugates, just in a reversed order.

    With that in mind, let’s denote [[2]](#footnote-2) , and examine the sequence:

    The vectors formed by (element-wise) raising to integer powers from to can be collected into a matrix:

    In the [roots of unity post](https://eli.thegreenplace.net/2026/notes-on-the-complex-roots-of-unity), we’ve proven that the rows of this matrix form an orthogonal basis over. In other words, any vector in can be represented as a linear combination of the rows of .

    I hope you can see where this is going! Let’s consider the signal as a column vector in . The DFT of can be computed by multiplying by the matrix:

    Take a minute to convince yourself this is true, by working through the multiplication for a specific row , e.g. is computed via row-column multiplication the third row (counting from 0) of and .

    Our is called the _Fourier Matrix_ or the _DFT Matrix_. Previously we’ve seen Python code that directly computes the DFT; here’s a version that does this via the matrix multiplication approach:

        def dft\_matrix(N):"""Construct F[k, n] = W\_N\*\*(k\*n), where W\_N = exp(-2 pi i / N)."""# W\_N is a primitive N-th root of unity: W\_N\*\*N = 1.# Its powers give all N roots of z\*\*N - 1 = 0.root=np.exp(-2j\*np.pi/N)indices=np.arange(N)# Rows correspond to frequency bins k; columns to sample indices n.exponents=np.outer(indices,indices)returnroot\*\*exponentsdef dft\_via\_matrix(x):"""Compute the DFT as F @ x with the Fourier matrix"""returndft\_matrix(len(x))@x

    More than the computational convenience though, there’s theoretical elegance here. Back when we were [discussing the continuous Fourier series](https://eli.thegreenplace.net/2026/notes-on-fourier-series), we’ve seen how the trigonometric functions (or - equivalently - complex exponentials) form an orthogonal basis for square integrable functions.

    Here, we see a similar linear algebra connection in discrete time - the vectors formed from powers of complex roots of unity form an orthogonal basis in and can thus be used to represent any sequence of complex values.

    Which brings us to the next topic: reconstructing a signal from its DFT representation.

