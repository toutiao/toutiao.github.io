  author: uptrails
  text: 'I swear, one of the weirdest things about big corporations is how people
    believe that all the important decisions affecting them are made in the boardroom.<p>They
    overwhelmingly aren&#x27;t. We build our own hell: 99% of product decisions in
    places like Google or Microsoft come from your peers, line managers, and PMs.
    Your manager may talk to the top brass a couple of times in their life. Even big-ticket
    decisions like &quot;we need to lay off 10%&quot; don&#x27;t really come from
    execs, they come from some mid-level guy in finance who says &quot;our quarterly
    numbers are not looking too great&quot; - and even more uncomfortably, from the
    implicit, cumulative pressure from <i>employees</i> who want the value of their
    stock grants to keep climbing or they will start interviewing elsewhere.<p>I have
    some recent insights from a company that executed an &quot;everything must be
    AI&quot; pivot and sat in some of the department strategy meetings. It was mostly
    line employees who came up with ideas such as &quot;we need a dashboard to show
    token use across departments and give that to managers come performance review
    time&quot;. In the meantime, another AI maximalist faction was telling the execs
    (or outright lying, if you prefer) that the technology enabled them to 100x and
    it would be crazy not to mandate it.<p>Execs bear the blame insofar that they
    foster this sycophantic, over-eager corporate culture, but ultimately, the call
    is coming from inside the house.'
  score: 0
