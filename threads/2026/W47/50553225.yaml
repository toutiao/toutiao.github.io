  author: Arch-TK
  text: Putting aside copyright, since that wasn&#x27;t what the question was about,
    while agents can tend to end up verbatim reproducing someone else&#x27;s code
    in some cases, they do not make the patent problem worse.<p>It&#x27;s already
    basically impossible to tell if you are infringing on a software patent without
    someone or thing actively attempting to describe what your code is doing in vague
    ways and looking for applicable patents.<p>Software patents are often incredibly
    vague, and mostly describe completely unexciting solutions applied to somewhat
    specific problems. Whether you end up dealing with patent problems depends mostly
    on whether some patent troll happens to take interest in you in particular and
    whether they can understand your code&#x2F;project enough to match it up to some
    vague patent they happen to hold.<p>I don&#x27;t think software patents are to
    be completely abolished per se, but their period of action should be much shorter,
    and they should require some relatively high bar of scrutiny. Of course, that
    would never happen because it would cost too much, take too long and people would
    stop bothering to file such patents. Which is why it&#x27;s probably easier to
    just abolish the concept of patenting anything that describes a software solution
    to a problem.
