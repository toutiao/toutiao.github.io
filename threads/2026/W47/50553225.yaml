  author: jedjonesuk
  text: Reverse engineering is one of those areas where the depth of the knowledge
    and the trouble solving really shows up for me. Two things I reverse engineered
    this weekend:<p>1) My kid has a toy from china where you put a USB cartridge in
    and get stories in Chinese with pictures. This is itself a rip off of another
    product of which I forget the name. the cartridge is just a normal USB but the
    file on disk was just a .dat file so you could buy more stories online, and then
    download them. It figured out in about 15 min, they just had a combined format
    which just concat all of the input together with all text base 64 encoded. So
    manifest|pagetext|image1|image2 and everything just had to be just the right format
    and then it would work. It wrote a script to make a story from a folder input,
    but also wrote a skill to write a story, make pictures etc from the idea.<p>2)
    I was looking into a shelf my wife wanted, but didn&#x27;t want to spend the money
    on. I took the 4 or 5 product images from the websites, dumped them into Claude
    with mcp to freeCAD and an hour later it has completely recreated a working cad
    design of the product, produced a pdf on how to assemble it, and allows me to
    make edits and changes to tweak the product to my preferences. The interesting
    thing about this one is while following its work, it clearer identified the actual
    original product at some point despite there being zero obvious indicators in
    the pictures.
