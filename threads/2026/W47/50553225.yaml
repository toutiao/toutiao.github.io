  author: georgemcbay
  text: "&gt; I guess Android apps are just easy to reverse engineer or something.<p>Android
    apps are indeed easier than average to reverse engineer as they are effectively
    Dalvik (JVM-like) bytecode wrapped in a zip file format, and Dalvik&#x2F;JVM style
    bytecode is among the easiest compiled&#x2F;shipped executable formats to decompile
    to a usable source code representation.<p>More often than not the only protection
    they have is symbol&#x2F;function name obfuscation, which makes things a bit tedious
    for human reverse engineering but which doesn&#x27;t slow LLMs down much."
