  author: cyanydeez
  text: On llamacpp and other engines, you can inject a think budget which truncates
    at specified token count. You can also specify a message at the limit.  You can
    set this in the header, so a dynamic engineering harness could relax&#x2F;tighten.
    Combine with a decision model and some robust messages like, &quot;run a test
    to rule out items&quot; and all that would reduce.<p>I&#x27;ve noticed the same
    habit with qwen3.8-flash-next. no matter how much I tell it a problem I see, it
    often fills up it&#x27;s thinking with &quot;the user says this, but maybe they&#x27;re
    confused, etc&quot;. I eventually got vision mode turned on and that&#x27;s significantly
    cut down on UI based pathologic skepticism; I got it access to my browser and
    that&#x27;s further reduced it.<p>But nonetheless, if you can get them to test
    their thinking, they seem more grounded.
