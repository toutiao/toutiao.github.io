  author: Pokepokalypse
  text: So what you need to do is &#x2F;clear your session. You lose all the work
    you did.<p>(and if you need, before the &#x2F;clear, just have it save all its
    memory as an .md file you can use as input to the new session).<p>Start the new
    session, and describe what you want in very abstract terms. You can&#x27;t talk
    claude into murdering someone for you. But with enough understanding; you can
    ask claude to give you a knife, and put the person in front of you. You need to
    do the dirty work, but the complicated or tedious work can be done, up to but
    not including the act.<p>Ironically; Asimov wrote about this technique in one
    of his robot stories. (his robots were harnessed with a set of guardrails he called
    the three laws of robotics, back in the 1950&#x27;s; only a few years after the
    first transistor was invented).
