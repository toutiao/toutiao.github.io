  author: saidinesh5
  text: Yesterday night, i reverse engineered the cloud connection plugin to my cctv
    camera in about 2 hours with Gemini.<p>Started off with me searching for what
    Chinese OEM made the product. Then tried out existing GitHub projects to see if
    it works but they were failing.<p>Spent 15 minutes to write a script that started
    their desktop software on a different network namespace and ran tcpdump in it.
    Captured exactly only the things i needed without any noise. Turned out it was
    using a different server url and credentials than the GitHub projects. Opened
    Ghidra to inspect the dlls that matched the strings i was looking for.<p>After
    that, I got lazy and handed over the task to Gemini to find the username and key
    they use to authenticate with the servers. It took about 30 minutes or an hour.
    A lot of it was me changing models because the llm servers were busy. It simply
    wrote a little script that ran through various strings it fetched from the binary
    to see if it can generate the authentication credentials.<p>Now my Home Assistant
    will be detecting if my car is parked in the parking lot or not. Life is good.
