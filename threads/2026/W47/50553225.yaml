  author: Retr0id
  text: "&gt; This is variation of scientific method and it significantly helps agents
    when they are getting stuck on some problem. Stops it going in circles. By forcing
    it to do definitive experiments. No endless guessing and trying random things.<p>These
    &quot;guessing loops&quot; are my main annoyance when REing with Claude (mostly
    Opus 4.8, due to the restrictions on newer models). On harder&#x2F;larger targets,
    I have to <i>constantly</i> babysit it and tell it to &quot;stop guessing&quot;.<p>For
    truly black-box reverse engineering, yes, hypothesis-testing is the way to go
    (it&#x27;s all you <i>can</i> do). But in most cases all the information is available
    to arrive at an answer deterministically, it just needs to be worked through meticulously.
    As an experienced human I have strong intuitions and I can work much faster under
    a &quot;guess and check&quot; model, but I prefer to use Claude as an &quot;unstoppable
    RE juggernaut&quot; with superhuman patience and determination, tracing method
    invocations all the way from A to distant subsystem B (for example).<p>Another
    big win for hardware RE is from tasking the LLM with writing unicorn emulation
    harnesses, e.g. for bootroms and firmwares. It&#x27;s pretty good at the classic
    &quot;figure out which MMIO needs to be stubbed&#x2F;simulated next to progress
    the boot&quot; loop, although sometimes it tries to take egregious purpose-defeating
    shortcuts."
