    malleable[2] piece of software<p>- Imbue&#x27;s Studio[3] looks pretty accessible
    and fun from a user perspective<p>My theory of change: make open-source more powerful
    than the closed alternatives, e.g. a single connected database that powers tasks,
    messages and projects.<p>-&gt; Connected context wins in the age of agents! Repo
