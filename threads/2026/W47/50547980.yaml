  author: iFreilicht
  text: I think I get what you&#x27;re saying, but it feels the only part that&#x27;s
    missing for regular users to understand the appeal is to have some sort of discovery
    mechanism for tools (and of course a good catalogue of high-quality tools to choose
    from), similar to the App Store. Patchwork is in a way just an OS with apps, it
    just offers vast new affordances around how those Apps can interact with each
    other.<p>Patchwork isn&#x27;t the first tool with this idea, but it&#x27;s the
    first that is truly open for user modification. Look at the adoption of Notion
    and the lesser known Microsoft Loop. I feel like many people can instantly understand
    the value if you just show a few good examples.<p>Of course, writing your own
    tools or scripts is another level below that, but you don&#x27;t really need that
    for Patchwork to be useful. HyperCard or Excel also have vast programming and
    automation capabilities but are still useful without ever touching those.
