  author: JoshTriplett
  text: 'I use Zulip every day, and it works incredibly well. There <i>are</i> still
    rough edges, but it&#x27;s improving regularly.<p>The model of having threads
    within channels provides great organizational help. But also, these days, if you
    <i>want</i> to have a &quot;general chat&quot; in a channel that isn&#x27;t in
    a thread, you can optionally do that. (I&#x27;d recommend not jumping to that
    just because you&#x27;re coming from Slack&#x2F;Discord and not accustomed to
    threads; give yourself some time to try them. But it can be useful for a subset
    of channels; some people like it or casual&#x2F;social channels, for instance.
    I personally like threads for those too, though.)<p>Also, the integration and
    API are <i>easy</i>, and bots and similar are easy to write. You can also arrange
    to have emails turn into posts on a channel.<p>Despite what the site says, you
    don&#x27;t <i>have</i> to self-host. The software is Open Source, and you absolutely
    can if you want to. But you can also use the hosted version, either free or paid,
    and save yourself the trouble, knowing that you can always move to self-hosted
    later.<p>I use the app on mobile, but just use the web version on desktop, in
    a pinned tab.<p>(Disclaimer: I&#x27;m on the board of the Zulip Foundation.)'
