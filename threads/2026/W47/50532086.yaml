  author: sfink
  text: I mostly agree, but I don&#x27;t think that&#x27;s quite it either. For me,
    OSS is neither a way for me to make money, nor a way to prevent other people from
    making money. The latter is closer, but it&#x27;s not other people making money
    off of what I create that bothers me, it&#x27;s that users have to pay someone
    else in order to use what I created.<p>I think of OSS as a way to get value into
    the hands of users and for them to not have to pay someone else for it. I honestly
    wouldn&#x27;t be too bothered if they had to pay <i>me</i>, but I relinquish that
    payment because not paying me means more users and more use, and I have the privilege
    of a decently paying tech job, so for my personal cost&#x2F;benefit analysis the
    free software wins. (And yes, I default to GPL not MIT&#x2F;BSD.) And it&#x27;s
    not just the direct users of my software that I care about, it&#x27;s also the
    overall ecosystem of freely available and modifiable software that I want to contribute
    to.<p>It also doesn&#x27;t bother me when other people use OSS as an anti-competition
    mechanism. That&#x27;s a different reason to do something that happens to resemble
    what I&#x27;m doing. It doesn&#x27;t contradict or interfere with what I&#x27;m
    doing nor my reasons for doing it.
