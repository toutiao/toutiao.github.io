  author: zahlman
  text: Unfortunately, that&#x27;s not how capitalism works. Given that the cost of
    distribution is trivial and the underlying good (the software) not only has perfect
    &quot;resale value&quot; but can trivially be duplicated, your first customer
    has every motive to undercut you (even if they don&#x27;t outright give it away).
    If they still charge something, the logic applies recursively. Supply is effectively
    unlimited once the first copy exists, thus price goes to zero. If you use force
    of law to prevent this, you don&#x27;t actually have OSS but just a &quot;source-available&quot;
    license.
