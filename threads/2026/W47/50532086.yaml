  author: fork-bomber
  text: I personally think that there&#x27;s nothing wrong with vibe coding so long
    as there are as close to watertight ways, checks and balances to verify that the
    output is correct. And the best way to do that is to invest domain specific expertise
    in coming up with as comprehensive a test schema as possible.<p>If the test schema
    passes and if your original articulation of intent was correct, then what you
    have is already very good. From that point onwards, it&#x27;s the question of
    accelerating development by just reviewing the output of the LLM and getting it
    into the right shape.<p>The combination of the review of the output of the LLM
    and the review of the test schema and its output, that is going to be a lot quicker
    to do than coding everything from scratch with a proper design paradigm.
