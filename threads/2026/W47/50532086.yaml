  author: linsomniac
  text: "&gt;My open source projects were barely sustainable<p>AI can help with that!
    \ Give an agent some rules, like via a skill for the project, and then point it
    at the PR&#x2F;Issue for triage to determine if it&#x27;s one that fits the rules
    for auto-closing (already reported and decided WONTFIX, for example).  Have it
    run this across all your repos.<p>Have the AI tooling do the heavy lifting of
    reproduction and benchmarking.  One of my projects is fairly complicated and one
    user ran into some problems which he could describe the situation that caused
    it, but was light on any other details: my apt package cache was slow to serve
    the PHP update to his users.  I asked AI to try to reproduce it: Set up a repo,
    set up different versions of my cache, have a client pull it, put an updated package
    in there, and have a client pull it again under different configurations.  This
    could have taken me hours to do myself.  AI did it with ~2 minutes of my effort.<p>&gt;I
    have not organized my life around triaging annoyances<p>Then don&#x27;t.  AI can
    help with the triaging.  Or, I give you permission: Close the repo for contributions.
    \ If you don&#x27;t have time to maintain it, let people know, so they can fork
