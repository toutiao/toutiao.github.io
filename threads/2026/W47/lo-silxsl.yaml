    The GraalVM family of language implementations are all based on partial evaluation. You can get really good performance out of dynamic languages using these techniques if you can reliably detect when things have been invalidated.
    Depending on the context that might be, “Somebody touched a prototype,” or you might separate parts of the process of method lookup and evaluation and try to specialise on the resolved method.
    Working on TruffleRuby was one of the most fun things I’ve done in my career, some things that are normally the hardest to optimise were beautifully simple.
