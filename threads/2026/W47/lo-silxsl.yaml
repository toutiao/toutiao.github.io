  text: |-
    Calling through pointer cannot be collapsed unless you manage to provably evaluate all mutations of said pointer at compile time. But only if the pointer can truly hold an arbitrary value.
    If you can prove that are e.g. two distinct values the pointer can point to you can specialize the rest of the program for both of those instead and branch into correct "world" instead of keeping calling through the pointer. This obviously leads to an explosion of combinations if done eagerly.
    With some good heuristics, if you can e.g. spot program selecting a different SIMD backend and then just keeps using it, specializing for each variant would be a huge boost for performance.
    Sometimes you don't have enough information at the compile time. E.g. you do not know how hot the pointer you'd be calling through really is. Could be once at startup. Could be 100k times per second. If you run the program interpreted (or instrumented) on typical workload, you can determine how hot the loops actually are and thus use this profile to guide your specializations.
    This allows you to see through e.g. the monkey patching for your typical workload. Profile says the program runs for a while using one pointer but then switches to another pointer and then heavily uses that. So you retain the call-through-the-pointer situation but also specialize for the monkey-patched situation that actually carries most of the workload and reap the performance benefits.
