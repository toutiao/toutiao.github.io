  text: As a contributor to an OSS project that uses Coverity, yes, we do. The problem
    is that for a lot of these projects the first time you run any SAST on it you
    get about 5,000 results. A common approach for commercial users for dealing with
    this is that you fix all the critical ones and then mark the rest as the baseline
    and only fix new stuff beyond that point, because you don&#x27;t have the budget
    or time to fix all 5,000 issues. For OSS I don&#x27;t know the approach there,
    although in our case with security-focused devs with OCD we fixed everything before
    continuing.
