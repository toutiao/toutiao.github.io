article:
  url: https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html
  title: "[Announce] GnuPG Security Advisory for GPGME (T8557,CVE-2026-129975)"
  fetch_status: success
  content: "# [Announce] GnuPG Security Advisory for GPGME (T8557,CVE-2026-129975)\n**Werner
    Koch** [wk at gnupg.org](mailto:gnupg-announce%40gnupg.org?Subject=Re%3A%20%5BAnnounce%5D%20GnuPG%20Security%20Advisory%20for%20GPGME%20%28T8557%2CCVE-2026-129975%29&In-Reply-To=%3C87eccf4c1c.fsf%40jacob.g10code.de%3E
    \"[Announce] GnuPG Security Advisory for GPGME (T8557,CVE-2026-129975)\")  \n_Fri
    Nov 20 19:01:51 CET 2026_\n\n- **Messages sorted by:** [[date]](date.html#517)[[thread]](thread.html#517)[[subject]](subject.html#517)[[author]](author.html#517)\n\n*
    * *\n\n    Hello!\n    \n    We are pleased to announce the availability of a
    new GPGME release:\n    version 2.3.1. This version fixes a *critical security
    bug* found in\n    all prior versions. We also release a new Gpg4win versions
    and and\n    GnuPG Desktop and GnuPG VS-Desktop versions which all make use of
    GPGME.\n    \n    \n    Description\n    ===========\n    \n    By using an OpenPGP
    key containing a crafted very long user id it is\n    possible to trigger a double
    free. This double free can be used\n    exfiltrate data from applications by sending
    for example signed data.\n    Exploiting this bug to mount an Remote Code Execution
    attack (RCE) can't\n    be ruled out. Thus an immediate update is highly suggested.\n
    \   \n    Our internal ID is T8557 ([https://static.dev.gnupg.org/T8557](https://static.dev.gnupg.org/T8557))\n
    \   The CVE-id is CVE-2026-129975.\n    \n    This vulnerability was discovered
    by Johan Carlsson and we were informed\n    by GitLab on 2026-11-12. Initially
    we set 2026-11-25 for a coordinated\n    disclosure; due to the new Ruby2Shell
    bug GitLab had to update earlier\n    and thus we also disclosed the GPGME bug
    on 2026-11-20.\n    \n    The root cause for this bug are two GPGME internal functions
    to read the\n    status lines and key listings from gpg. Initially a buffer of
    1024\n    bytes is allocated which is reallocated if more space is required. When\n
    \   reallocating the pointer to the new buffer is used by the function but\n    it
    is only assigned back to the context object at the end of the\n    function. Thus
    if the function returns early due to an read error or\n    other events the context
    is not updated and keeps the stale pointer to\n    the freed memory. Eventually
    the context is released and the memory\n    freed a second time. Due to other
    allocations in between the common\n    double free checks of memory allocators
