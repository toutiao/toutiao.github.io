article:
  url: https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html
  title: "[Announce] GnuPG Security Advisory for GPGME (T8557,CVE-2026-129975)"
  fetch_status: success
  content: "# [Announce] GnuPG Security Advisory for GPGME (T8557,CVE-2026-129975)\n**Werner
    Koch** [wk at gnupg.org](mailto:gnupg-announce%40gnupg.org?Subject=Re%3A%20%5BAnnounce%5D%20GnuPG%20Security%20Advisory%20for%20GPGME%20%28T8557%2CCVE-2026-129975%29&In-Reply-To=%3C87eccf4c1c.fsf%40jacob.g10code.de%3E
    \"[Announce] GnuPG Security Advisory for GPGME (T8557,CVE-2026-129975)\")  \n_Fri
    Nov 20 19:01:51 CET 2026_\n\n- **Messages sorted by:** [[date]](date.html#517)[[thread]](thread.html#517)[[subject]](subject.html#517)[[author]](author.html#517)\n\n*
    * *\n\n    Hello!\n    \n    We are pleased to announce the availability of a
    new GPGME release:\n    version 2.3.1. This version fixes a *critical security
    bug* found in\n    all prior versions. We also release a new Gpg4win versions
    and and\n    GnuPG Desktop and GnuPG VS-Desktop versions which all make use of
    GPGME.\n    \n    \n    Description\n    ===========\n    \n    By using an OpenPGP
    key containing a crafted very long user id it is\n    possible to trigger a double
    free. This double free can be used\n    exfiltrate data from applications by sending
    for example signed data.\n    Exploiting this bug to mount an Remote Code Execution
    attack (RCE) can't\n    be ruled out. Thus an immediate update is highly suggested.\n
    \   \n    Our internal ID is T8557 ([https://static.dev.gnupg.org/T8557](https://static.dev.gnupg.org/T8557))\n
    \   The CVE-id is CVE-2026-129975.\n    \n    This vulnerability was discovered
    by Johan Carlsson and we were informed\n    by GitLab on 2026-11-12. Initially
    we set 2026-11-25 for a coordinated\n    disclosure; due to the new Ruby2Shell
    bug GitLab had to update earlier\n    and thus we also disclosed the GPGME bug
    on 2026-11-20.\n    \n    The root cause for this bug are two GPGME internal functions
    to read the\n    status lines and key listings from gpg. Initially a buffer of
    1024\n    bytes is allocated which is reallocated if more space is required. When\n
    \   reallocating the pointer to the new buffer is used by the function but\n    it
    is only assigned back to the context object at the end of the\n    function. Thus
    if the function returns early due to an read error or\n    other events the context
    is not updated and keeps the stale pointer to\n    the freed memory. Eventually
    the context is released and the memory\n    freed a second time. Due to other
    allocations in between the common\n    double free checks of memory allocators
    may not be triggered.\n    \n    \n    Impact\n    ======\n    \n    All software
    using a GPGME version prior to 2.3.0 either as shared\n    libary, DLL, or statically
    linked is affected. Examples of software\n    using GPGME are\n    \n     - Gpg4win\n
    \    - GnuPG Desktop\n     - GnuPG VS-Desktop\n     - Most mail clients\n     -
    Many XMPP clients\n     - Samba\n     - Flatpack\n    \n    \n    Solution\n    ========\n
    \   \n    Please update your GPGME shared library to version 2.3.1. If you need
    a\n    DLL you may take it from from the updated Gpg4win version.\n    \n    For
    statically linked binaries remmeber to build them against GPGME\n    2.3.1.\n
    \   \n    If for some reasons GPGME can't be updated, you may patch your GPGME\n
    \   version using the attached patch which likley applies cleanly even to\n    very
    old versions.\n    \n    There is no need to udpate GPGMEPP or GPGMEQT.\n    \n
    \   \n    Noteworthy changes in version 2.3.1 (2026-11-19)\n    ================================================\n
    \            [compared to version 2.2.0]\n    \n     * New constants GPGME_PK_MLKEM,
    GPGME_PK_MLDSA, and GPGME_PK_DLTHM.\n       Add mappings for algos used bei backends.
    [rMa85fa49236]\n    \n     * Fix a double free in the status line read code.\n
    \      [T8557,CVE-2026-129975]\n    \n     * Interface changes relative to the
    2.2.0 release:\n     ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n     GPGME_PK_DLTHM
    NEW.\n     GPGME_PK_MLKEM NEW.\n     GPGME_PK_MLDSA NEW.\n    \n     Release-info:[https://dev.gnupg.org/T8427](https://dev.gnupg.org/T8427)Getting
    the Software\n    ====================\n    \n    Please follow the instructions
    found at <[https://gnupg.org/download/](https://gnupg.org/download/)> or\n    read
    on:\n    \n    The GPGME source code compressed using BZIP2 and its OpenPGP signature\n
    \   are available here:[https://gnupg.org/ftp/gcrypt/gpgme/gpgme-2.3.1.tar.bz2](https://gnupg.org/ftp/gcrypt/gpgme/gpgme-2.3.1.tar.bz2)(1393k)[https://gnupg.org/ftp/gcrypt/gpgme/gpgme-2.3.1.tar.bz2.sig](https://gnupg.org/ftp/gcrypt/gpgme/gpgme-2.3.1.tar.bz2.sig)A
    sufficient patch to solve the security bug for older versions is\n    attached.
    Note that version 2.3.0 was never publicly available.\n    \n    \n    \n    Debian
    Packages\n    ===============\n    \n    We also provide Debian style packages
    for a couple of Debian variants.\n    See[https://repos.gnupg.org/deb/gnupg/trixie/](https://repos.gnupg.org/deb/gnupg/trixie/)or
    use the menu to switch\n    to other distros/releases.\n    \n    \n    Windows
    Installer\n    =================\n    \n    A new version of Gpg4win (5.1.2),
    our full featured Windows installer,\n    including the fixed version of GPGME,
    the Kleopatra GUI, and a PDF\n    reader has also been released. Head over to[https://gpg4win.org/](https://gpg4win.org/)Checking
    the Integrity\n    ======================\n    \n    See[https://gnupg.org/download/integrity\\_check.html](https://gnupg.org/download/integrity_check.html)The
    checksum for gpgme is:\n    \n    1134a407b50204ee6fb9efaa6e1451c2460e543e gpgme-2.3.1.tar.bz2\n
    \   \n    \n    *Thank you all*\n    \n       Your GnuPG hackers\n    \n    \n
    \   p.s.\n    This is an announcement only mailing list. Please send replies only
    to\n    the gnupg-users at gnupg.org mailing list.\n    \n    * List of Release
    Signing Keys:\n      To guarantee that a downloaded version has not been tampered
    by\n      malicious entities we provide signature files for all tarballs and\n
    \     binary versions. The keys are also signed by the long term keys of\n      their
    respective owners. Current releases are signed by one or more\n      of these
