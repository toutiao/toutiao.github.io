    I don't think this is that odd.

    have request buffering off in your reverse proxy in front

    From what I can tell, nginx is a bit of an outlier in having request buffering, and all of Traefik, Envoy (thus by extension many k8s gateway implementations), and HAProxy have it off by default. (I expect the mix of Traefik + Envoy will cover a lot of k8s setups.) The article also states that whether or not this affects it depends on the target in question: "Request buffering is not a general mitigation. Elasticsearch runs from one complete request, so this setting does not stop that chain."

    use AVX512 on the host

    The article says "AMD EPYC and Ryzen: Zen 4 or newer", and Zen 4 came out in 2022. As some arbitrary examples, Hetzner's CPX VPSs seem to currently all be at least on Zen 4 Genoa, and Netcup seems to already have Zen 5 VPSs available (and G11 was already Zen 4).

    use java + base64

    Their initial testing describes pre-auth RCE on the default setups for Keycloak, Jira, Confluence, Artifactory, and Jenkins; and post-auth for Elasticsearch, Gerrit, and Kafka. I don't think this is that rare, per se. At minimum, it probably affects a decent number of cloud infrastructure setups.
