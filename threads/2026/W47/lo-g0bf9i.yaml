    I think something that might help is a metric for the likelihood of mass exploitation. Afaik CVSS  only measures complexity and CIA impact. A non-exhaustive list of questions that would be helpful to ask about a vulnerability:

    Does the exploit need to be tailored per application that uses the library/system?
    Does the exploit need to be tailored per build?
    Does it require mulitiple consecutive requests to the same process?
    Does it network latency hinder reliability of the exploit?
    How common is the configuration?

    (I think the claim inflation was inevitable. Relying on the person/org who found the vulnerability to correctly assess it's seriousness is a flawed approach. Even if ignoring commercial incentives, in the excitement of finding a serious vulnerability in a popular piece of software, it's difficult for a researcher to be perfectly objective.)
