  text: This is really useful, thanks! The other day I bought a small screen and didn&#x27;t
    know what to do with it so I made an assistant that talks to my bot:<p><a href="https:&#x2F;&#x2F;m.youtube.com&#x2F;shorts&#x2F;3FseVyAG5uM"
    rel="nofollow">https:&#x2F;&#x2F;m.youtube.com&#x2F;shorts&#x2F;3FseVyAG5uM</a><p>I
    used microwakeword too, and training my own wakeword was pretty simple (basically
    just recording a few tens of samples). Highly recommended.<p>I also wanted to
    be able to issue some voice commands for lights and other things in my home with
    low latency, so I added a short-circuit plugin that runs right after recognition.
    If the recognized command matches one of the regexes, it&#x27;s immediately executed,
    which has a latency of under a second. Otherwise, it gets sent to my assistant,
    which usually will tweak the regex (or add a new one) to improve the whole system
    as it fails.
