  content: "# Rebuilding my voice assistant pipeline [https://blog.platypush.tech/article/Rewriting-my-voice-assistant-pipeline](https://blog.platypush.tech/article/Rewriting-my-voice-assistant-pipeline)\n\n[\U0001F4DD](https://blog.platypush.tech/article/Rewriting-my-voice-assistant-pipeline.md
    \"Raw Markdown\")\n\n### Swapping openwakeword for microwakeword and making voice
    detection smarter\n\n ![Author photo](https://static.platypush.tech/images/logo-256.png)[Fabio
    Manganiello](https://fabiomanganiello.com)\n\n[#platypush](/tags/platypush)[#voice](/tags/voice)[#voiceassistant](/tags/voiceassistant)[#microwakeword](/tags/microwakeword)[#openai](/tags/openai)\n\n
    ![.](https://s3.platypush.tech/static/images/voice-assistant-pipeline.png)\n\n-
    [Wake word detection: a new assistant.microwakeword plugin](#wake-word-detection-a-new-assistantmicrowakeword-plugin)\n-
    [Speech-to-text: assistant.openai, with a much better ear](#speech-to-text-assistantopenai-with-a-much-better-ear)\n-
    [Responses and context: the openai plugin](#responses-and-context-the-openai-plugin)\n-
    [Text-to-speech: tts.openai](#text-to-speech-ttsopenai)\n- [The full configuration](#the-full-configuration)\n-
    [What changed on the code side](#what-changed-on-the-code-side)\n- [Caveats](#caveats)\n\nI
    [wrote an article](https://blog.platypush.tech/article/Local-voice-assistant)
    a couple of months ago describing how I rebuilt my old voice assistant pipeline
    in [Platypush](https://platypush.tech).\n\nAnd I wrote earlier articles describing
    my journey through self-hosted voice assistants - [in 2024](https://blog.platypush.tech/article/The-state-of-voice-assistant-integrations-in-2024)
    (with [Picovoice](https://picovoice.ai)), [in 2020](https://blog.platypush.tech/article/Build-custom-voice-assistants)
    (diving into the legacy [`assistant.google`](https://docs.platypush.tech/platypush/plugins/assistant.google.html)
    integration, the now defunct `assistant.alexa` integration, the now defunct Snowboy
    integration, the now defunct DeepSpeech integration and Picovoice) and the [original
    article in 2019](https://blog.platypush.tech/article/Build-your-customizable-voice-assistant-with-Platypush)
    describing the Google Assistant integration.\n\nFor a couple of months I used
    the voice pipeline described in my latest article as my main driver, but after
    getting used to the robustness of commercial voice assistants I was unhappy with
    the high rates of false positives/negatives of my self-hosted pipeline, as well
    as its lack of robustness in detecting start/end of speech, especially in noisy
    environments and using cheap microphones.\n\nAfter a bit of experimentation, I
    decided to swap and fine tune a few parts, and after a couple of days of trying
    the results are satisfying enough for me to write a short article about it.\n\nThe
    resulting pipeline is:\n\n## Wake word detection: a new `assistant.microwakeword`
    plugin\n\nUntil recently I used [`assistant.openwakeword`](https://docs.platypush.tech/platypush/plugins/assistant.openwakeword.html),
    which wraps [openWakeWord](https://github.com/dscripka/openWakeWord).\n\nIt works,
    but the project has been quiet for a while and all of its pre-trained models are
    `v0.1` files from 2023, mostly trained on synthetic speech.\n\nIn practice I was
    getting both false positives (the hotword triggering on background noise) and
    false negatives (the hotword not detected unless I was close to the microphone).\n\nI
    added a new plugin, [`assistant.microwakeword`](https://docs.platypush.tech/platypush/plugins/assistant.microwakeword.html),
    on top of [microWakeWord](https://github.com/kahrendt/microWakeWord) through the
    [`pymicro-wakeword`](https://pypi.org/project/pymicro-wakeword/) Python bindings.\n\n`microWakeWord`
    is the engine used by ESPHome and Home Assistant Voice, its models are actively
    maintained, and the built-in models (`okay_nabu`, `hey_jarvis`, `hey_mycroft`,
    `alexa`) ship with the package — no download required.\n\nThe current official
    models are provided under the [ESPHome micro-wake-word-models repository](https://github.com/esphome/micro-wake-word-models).\n\nCustom
    models are supported too: drop a `microWakeWord` JSON manifest (with its `.tflite`
    model) in the plugin's models directory and reference it by name.\n\nThe plugin
    exposes the same API as `assistant.openwakeword` (same `models`, `detection_threshold`,
    `frame_duration`, `patience_frames`, `input_device`, `input_volume` parameters,
    same `list_models` action, same `HotwordDetectedEvent`), so switching is a matter
    of just changing the configuration to point to the new plugin:\n\n    assistant.microwakeword:\n
    \     models:\n        - alexa\n\nA few design notes:\n\n- Without an explicit
    `detection_threshold`, each model uses the `probability_cutoff` from its own manifest
    (0.9 for `alexa`), which is the value the model was validated against.\n- Models
    already smooth their output over a sliding window, so unlike openwakeword, `patience_frames`
    defaults to 0 here.\n- The audio thread never touches the TFLite models directly:
    it queues frames (and a reset marker) to the main thread, because `MicroWakeWord.reset()`
    reloads the interpreter and isn't safe to call concurrently.\n- Like `assistant.openwakeword`,
    the plugin releases the audio device when another assistant plugin starts a conversation,
    and re-acquires it when the conversation ends.\n\n## Speech-to-text: `assistant.openai`,
    with a much better ear\n\n`assistant.openai` records audio when a conversation
    starts and transcribes it through Whisper.\n\nThe tricky part has always been
    _end-of-speech detection_: knowing when the user has finished talking. The previous
    implementation used a per-frame boolean from WebRTC VAD, and any single frame
    classified as speech would reset the silence timer. With even a bit of background
    noise, phrases would only end when the maximum conversation duration was hit.\n\nThe
    audio preprocessing layer (`AudioPreprocessor`, shared by the STT integrations)
    has been reworked:\n\n- **[Silero VAD](https://github.com/snakers4/silero-vad)
    as the primary backend** (through [`onnxruntime`](https://onnxruntime.ai), no
    [PyTorch](https://pytorch.org) required), with WebRTC VAD and a plain RMS-based
    detector as fallbacks. To get an idea of Silero VAD's performance compared against
    other solutions for speech activity detection, take a look at the insightful article
    [_One voice detector to rule them all_](https://thegradient.pub/one-voice-detector-to-rule-them-all/).
    The Silero model is downloaded on first use into the Platypush workdir and checksum-verified:\n\n
    \   assistant.openai:\n      # auto = silero -> webrtc -> energy, depending on
    what's installed\n      vad_backend: auto\n\n- **Hysteresis + sliding window**
    : a frame becomes speech above the VAD threshold and stays speech until its score
    drops by a margin, and the per-frame decisions are smoothed by majority vote over
    a 0.5s window. A single noise burst can no longer keep a conversation alive.\n\n-
    **Adaptive noise floor** : the background noise level is tracked over time, and
    frames that aren't louder than `noise_floor_factor` (default 2.0, ~6 dB) times
    the floor are never considered as speech.\n\nOn a synthetic benchmark (Piper-generated
    phrases mixed with babble and burst noise), the old settings kept conversations
    open for 6–10 seconds after the speech had ended; the new pipeline ends them 1.0–1.6
    seconds after the last word, which is the configured [`conversation_end_timeout`](https://docs.platypush.tech/platypush/plugins/assistant.openai.html#platypush.plugins.assistant.openai.AssistantOpenaiPlugin.start_conversation)
    plus the smoothing lag.\n\nSince the changes on Platypush have been performed
    directly in the [`AudioPreprocessor`](https://git.platypush.tech/platypush/platypush/src/branch/master/platypush/plugins/assistant/_audio.py)
    also used by other native speech-to-text engines, other speech-to-text plugins
    also benefit from them - e.g. if you use [`assistant.vosk`](https://docs.platypush.tech/platypush/plugins/assistant.vosk.html)
    for full on-device detection.\n\n## Resp"
