  text: As I understand it, the issue on iOS is Siri’s access to screen content. It&#x27;s
    useful to be able to e.g. read Hacker News in Safari and be able to say, “Hey
    Siri, what do these three obscure acronyms in the comment at the top of my screen
    stand for?” Unfortunately, when iOS 27 was first released, there was no way to
    exclude an app like Signal from this feature. So if you had Signal open and you
    triggered Siri to ask an unrelated question, you could inadvertently send a screenshot
    of your Signal chat to the cloud.<p>Thankfully, Signal pushed and Apple responded
    pretty quickly. Now we can tighten up our settings via:<p><pre><code>  Settings
    &gt; Siri &gt; Excluded Apps</code></pre>
