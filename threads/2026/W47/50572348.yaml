  author: TFNA
  text: I have followed digital privacy and nation-level-actor interception stories
    since the European Parliament&#x27;s ECHELON report over a quarter-century ago,
    and to me it is a given that no strong state like the USA would permit a truly
    secure app being used at a societal scale. I use Signal myself, but am under no
    illusions.<p>The developers might be bona-fide idealists and the E2EE encryption
    might be reliable (if only when compiling the app from source oneself), but it
    feels obvious that the US authorities would gain access to things like contact
    metadata or forcing a compromised build on request. The app is leaky in this regard,
    and Signal rents cloud infrastructure which enables covert shenanigans with the
    server, like compromising the infamously vulnerable Intel SGX which is the only
    thing keeping people&#x27;s contact lists (uploaded by default to the server)
    private.
  score: 0
