  text: |-
    I&#x27;m going to take a guess. But we&#x27;d have to guess unless we are the actual Apple designers. But I&#x27;d wager that the thing is that Apple doesn&#x27;t see themselves as part of the user&#x27;s threat model. So them being able to see your content is not a privacy issue. There&#x27;s reason to act that way, after all, they have control of the hardware and core software and that is a high level of access. Even for fully open source systems you still have to have lots of trust.<p><pre><code>  &gt; Across linux
