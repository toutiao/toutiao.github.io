  author: questionedon
  text: It turns out that good privacy tech doesn&#x27;t rely on jurisdictions.<p>It&#x27;s
    a stupid take that the country matters. If the tech is sound and trustless, it
    won&#x27;t matter what country the company is based in.<p>Similarly &quot;digital
    sovereignty&quot; is stupid. E2EE is what matters. And SimpleX shows that you
    can essentially add highly effective client-side metadata encryption.<p>For content
    privacy, you&#x27;re much better off with an E2EE file service hosted in North
    Korea than non-E2EE file service in Switzerland.
