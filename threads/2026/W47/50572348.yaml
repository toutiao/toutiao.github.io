    Yes, but you do need to go to great lengths to do this. The reason is because there&#x27;s so many things that subtly can extract data. If you want to prevent a system that can take screenshots, then you have to disable screenshots entirely. You have to disable screenreaders. That&#x27;s all possible, but does interfere with user experience, all because you&#x27;re concerned about someone potentially hijacking that system. Truthfully that&#x27;s not in most users&#x27; threat models. Similarly you&#x27;d have to disable all USB ports and capabilities because a USB device can control your system (see rubber ducky). And many more. To give you a small example, go install noscript into your browser (or install the tor or mullvad browser and put on the strict security settings and browse the internet). It increases privacy and security, but it does come at a big UX cost.
