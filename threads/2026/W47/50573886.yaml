  text: That&#x27;s obvious. People claim they understand every line of code their
    agents write, but there&#x27;s understanding...and then there&#x27;s understanding.
    A cursory idea of how code works does not mean the same deep understanding of
    the solution nor does it give the feeling of the &#x27;lightbulb&#x27; when a
    thorny problem is solved.<p>For a long time in coding, we&#x27;ve constantly been
    piling on technical debt, even before AI. With frameworks, layers, etc. But AI
    is a quantum leap that makes the problem far worse.<p>Note that compilers that
    go from C to assembly&#x2F;machine code are a lot different because C for instance
    (or Rust, Python), etc. still exposes all of the core abstracted logic. AI does
