  author: fusslo
  text: We&#x27;ve stopped reviewing code for code&#x27;s sake. We review code to
    keep the codebase clean and consistent.<p>Before agentic development, the cost
    was large for changes at the review stage. Often the person writing the code didn&#x27;t
    have the right context or experience to make the best choice. So reviewing would
    often blow up a pull request. Which sucked. Eventually every engineer would have
    AI generate a PR. People would review, blow it up, and the engineer would copy&#x2F;paste
    the feedback into AI to generate another PR.<p>But now, we use reviews to enforce
    design decisions and get feedback from the other people who couldn&#x27;t be involved
    in the initial design (for example if a new feature interacts with a module owned
    by another team).<p>The actual nuts-and-bolts of how the code is written is mostly
    unimportant. It was a large mentality shift for the company<p>We spend LOTS of
    time on the design, verification, testing. The verification and testing is built
    first. Agents take the input of the problem, design document, and current codebase
    to generate code. It iterates by running the verification tools. Then it runs
    the testing tools.<p>The better we make the tools for AI, the better the product
    code is. We&#x27;ve automated gathering power readings, timing reports, wifi&#x2F;ble
    sniffing, smoke tests, feature tests, corner cases, robots for pressing buttons,
    static analysis tools, unit tests, customer styled system tests... tools to emulate
    cell phones, servers, etc...
