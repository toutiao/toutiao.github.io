  author: deltarholamda
  text: Understanding &quot;beneath&quot; is a good idea. I used the free version
    of Grok to generate some Ansible scripts. I don&#x27;t use Ansible often enough
    to be really adept, and I appreciated some help.<p>It was pretty good, understood
    what I wanted to do, and broke it up in playbooks&#x2F;roles&#x2F;etc. quite well.
    But then it did things like continuously overwrite the LetsEncrypt cert for each
    domain with the next one in a loop. It understood &quot;this needs to be a loop&quot;
    and how to optimize that loop, but not that it was going to overwrite each domain&#x27;s
    key with the next.<p>I&#x27;m a pretty good sysadmin, so I recognized this and
    could take what it did and fix it, but it required a deeper understanding of the
    underside of nginx&#x2F;LetsEncrypt and the filesystem to even see what it was
    doing.<p>Of course, once you run the playbook, test a domain and see its SSL cert
    is all jacked up you&#x27;ll go looking for WTF happened, but just blindly taking
    the output as given meant it was horribly broken.<p>It may be that Ansible, by
    its nature, is a bit sui generis because it touches so many unconnected domains,
    and therefore is harder than outputting Python. I don&#x27;t know. But one needs
    more than a surface level understanding of those domains if you want to catch
    the LLM being stupid.
