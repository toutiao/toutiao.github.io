  text: I do wonder about this. I’ve landed on:<p>1. Anything that’s boring to write
    - aka I’m not learning, done it before, I can quickly review - I offload to agents.
    And still review entirely since it’s my reputation behind it, but I’ve found it
    to be relatively pain free to review.<p>2. Anything that I don’t know what it’s
    gonna look like, I do my normal planning but with a lot of agent review involved
    up front. At the end of this, I more or less know the code that’s gonna be written
    and thus don’t type it myself. I still do line by line review and spend a lot
    of time on things I don’t understand. It still feels like the same process (wrt
    understanding) when I had typed and then reviewed what I typed.<p>I still (from
    what I can tell) have the same mental model I did when I hand typed the code,
    even though for the most part I’m not. I am worried if I’m losing something, but
    so far it seems ok. It’s also certainly not a 10x speedup.
