  author: bengold14
  text: I think most people at this point just don&#x27;t review code. Which is a
    shame, because:<p>1. It was good for collaboration. Sharing how you are changing
    the codebase pushes everyone to row in the same direction, and provides a sense
    of team ownership.<p>2. It was good as a push for engineers to take pride in their
    work. Knowing someone is watching gives you subconsciously an extra reason to
    not cut corners. And when you spend effort not cutting corners you expect that
    in your teammates, which is a (potentially) virtuous circle.<p>3. It was good
    for catching mistakes. When code was expensive this was important.<p>Everyone
    thinks of code review as primarily relevant for 3, and since code is no longer
    expensive they think it is unimportant and you can skip it. But 3 isn&#x27;t dead,
    its importance has just shifted from code to architecture. It is still an expensive
    mistake to screw up architecture and have other engineers build upon that flaw.
    Re-architecting with live users, data and&#x2F;or hardware is not as simple as
    fixing a code bug, and it deserves attention to catch mistakes. Collaboration
    &amp; pride are also still important.<p>This is the reason that instead of stopping
    review, we need to change what abstraction we review. Code is no longer the right
    tool for understanding applications in most cases.<p>(disclosure I work in this
    space and run <a href="https:&#x2F;&#x2F;www.archme.io" rel="nofollow">https:&#x2F;&#x2F;www.archme.io</a>
    which is working to solve the above)
