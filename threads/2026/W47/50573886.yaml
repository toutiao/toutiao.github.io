  author: noduerme
  text: 'What you&#x27;re building is very clever, and the hypothesis behind it makes
    a certain sense if you believe that the future paradigm is not in reviewing things
    line by line. But... I don&#x27;t think it truly replaces #3 in your list.<p>The
    best parallel I can think of is, whenever I design databases with lots of tables
    and relationships, I keep a nicely organized MySql Workbench flowchart to go along
    with them and review. It&#x27;s good to have that higher level abstraction as
    a map. The thing is, <i>implementation details still matter</i>. Bad triggers
    or foreign keys lead to deadlocks. So if you&#x27;re a dev and you&#x27;re looking
    at this flowchart as the map of your codebase, you may still not familiar with
    the actual code, and I think that&#x27;s a liability.<p>&gt;&gt; When code was
    expensive<p>You&#x27;re dead right when you say re-architecting with live users
    is harder than fixing a code bug. But poor code implementation can masquerade
    as something that fits within your architecture until it&#x27;s too late. The
    7th example on your website shows someone trying to fix a bad implementation:
    This card renders before POST is completed, what rolls it back if POST fails?
    That&#x27;s like a <i>kablooey</i>. I bet that&#x27;s not a one-off problem. Even
    though your architecture looks good in the flowchart, everything about how it&#x27;s
    handling server calls is wrong. The wrong tools or methods were chosen to implement
    it.<p>This is where not reading the code as it&#x27;s written can give the illusion
    that things are alright, when really there are broken states and you&#x27;ll need
    to rebuild fundamental systems from the ground up... systems that you don&#x27;t
    really understand now, because you didn&#x27;t read the code in the first place.<p>When
    people say &quot;code is cheap now&quot; the idea is, no big deal, we can just
    ask the LLM to do that when it crops up. The thing is, &quot;code is cheap&quot;
    is like &quot;talk is cheap&quot;. It&#x27;s not cheap when you specify something
    vaguely and the misunderstanding leads to a catastrophic result. E.g. talk isn&#x27;t
    cheap when the president is ordering an airstrike on the wrong target. &quot;Yup,
    that looks like a mountain in Afghanistan&quot; isn&#x27;t sufficient. Precision
    in language matters in life, even for small things, because you want to make sure
    everything is understood and implemented correctly. And you can&#x27;t know if
    it was implemented correctly if you&#x27;re not reading the actual code.<p>When
    I order at the drive through, even though it shows me on the screen what I asked
    for, I still check the bag before I drive away. But if I had no idea what the
    contents of the bag were supposed to look like, because my ability to distinguish
    french fries from nuggets had atrophied, if I just peeked inside and went &quot;oh,
    looks alright,&quot; then at some point I&#x27;m going to end up with the wrong
    order. That&#x27;s no big deal if I&#x27;m just ordering for myself, but what
    if I&#x27;m ordering for 50 people?<p>I don&#x27;t know. Sorry for the rant. I
    think what you&#x27;re building looks like a nice tool, and I&#x27;d like to experiment
    with it, although I&#x27;d really only want to use it offline. But I don&#x27;t
    know whether it would fix the atrophy problem or aggravate it.'
