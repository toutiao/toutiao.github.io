    My parents have a 30 year old Bosch garage door opener (the section was taken over by Somfy 15 years ago), and the remote controls, after that time and daily use, were broken at some point. Buying a replacement from Somfy costs hundreds of euros per remote control, which is definitely unreasonable, but in the end the Bosch controller uses a proprietary encoding for which no aftermarket solutions exist.
    I looked what was available on the market and bought a simple 'chinese' remote controlled relays, which I hooked up to the trigger contacts on the opener in a separate small wall box, completely replacing the remote control bit of the opener. The setup itself took mere seconds and it just works. If the remote controls break after years, I just replace the relays, in case remote controls are not available any more; to be fair, though, the remote controls are rock solid and barely show any signs of use after years. For this reason learned to appreciate the simple 'modules' available to buy for these purposes.
    And this story contains another learning: Especially western companies have become too tightly self-integrated and arrogant in a way (as was demonstrated in the post), shoving their apps onto you, with ads, tracking, while often the core functionality doesn't work flawlessly. With standards like Home Assistant and Matter, small manufacturers can integrate themselves into a larger ecosystem, and the customer benefits from choice, lower prices due to competition and better modularity.
    For me as a tinkerer, this is also fun. With LLMs taking up more and more of the 'creative' process, it's nice to still have nichés where human ingenuity still reigns.
