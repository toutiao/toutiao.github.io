  author: LorenPechtel
  text: Probably not.<p>The problem is there is a minimum amount of material to make
    a bomb.  To some extent you can substitute higher pressure for less material but
    mostly you make a very small bomb by a lower multiplication factor causing less
    of the material to fission.  But that is inherently a random thing, the closer
    you get to not working the bigger the effect of a very minor difference early
    in the detonation.  Thus, while you can make a very small bomb you can&#x27;t
    predict it&#x27;s yield.
