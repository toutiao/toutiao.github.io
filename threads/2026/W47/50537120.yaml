  author: beloch
  text: This is one reason why weaponizing space is a bad idea.  Even hardened orbital
    weapon platforms will be easy to destroy with imprecise detonations, as shown
    here, so space-based weapon capabilities will be short-lived in any meaningful
    conflict.  However, their mere presence in orbit makes it far more likely that
    all other satellites will be destroyed, possibly even in minor conflicts.  A strike
    against offensive military satellites (with all civilian satellites in the area
    as collateral damage) would likely be viewed as less of a taboo than a strike
    against cities.<p>This is a bad path to go down.
