  author: gxd
  text: 'NWS has a more accurate fallout model, but it&#x27;s not real-time like Thousand
    Suns. I can&#x27;t speak of their general damage model because I couldn&#x27;t
    find many details on that. Its scenario editor appears to be very flexible but,
    to be honest, I don&#x27;t understand that product very well because of the UI.<p>I
    made Thousand Suns for basically one thing: simulate the impact of an all out
    war with a civilian focus. I modeled many aspects of this problem in much detail
    (the page has more info, as well as the scenario creation guide). Optimal trajectories,
    MIRVs, interceptions, radar modeling... It&#x27;s all there.<p>This all out scenario
    isn&#x27;t super plausible but I was interested in showing how destructive even
    a single submarine could be, and how alternative strategies make some difference
    but not that much!<p>I made the configuration file LLM friendly so you could get
    external sources and create different scenarios. The data model has allowance
    for power plants, ports, etc but they are not exposed yet. That would make the
    RISOP more interesting for inclusion but right now the counterforce is focused
    on nuclear threats and countervalue solely on civilian deaths (using the RISOP
    would allow more economic destruction with fewer deaths in theory).'
