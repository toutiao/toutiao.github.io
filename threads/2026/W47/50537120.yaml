  author: PaulHoule
  text: 'What I understand is that EMP hardening is a bear.  Like if there is the
    slightest crack or imperfection it will get through.  Also the effects are said
    to be a bit unpredictable.  Poorly protected hardware might survive if you get
    lucky,  well protected hardware might fail if you get unlucky.<p>Of course that&#x27;s
    an entirely different phenomenon:  X-Rays from an exoatmospheric explosion are
    absorbed in the atmosphere and cause a plasma explosion with widespread ionization
    and charge moving around...  with a huge RF electromagnetic effect.<p>The main
    effect that this paper is talking about is beta particles from decaying fission
    products get trapped in the magnetosphere and damage electronics for a sustained
    time.'
