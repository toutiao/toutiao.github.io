  author: srean
  text: Ha! Must you tease me so ?<p>This is one of my pet fascinations (nerd snipe
    pits) - deciphering transition curve markings along railway tracks while travelling
    by train, preferably peeling an orange [*]. These transition curves are usually
    some approximation of an Euler Spiral (aka Cornu Spiral, Clothoid), typically
    a cubic parabola. To compute the Euler spiral as a closed form one gets into Fresnel
    integrals. Cubic parabolas are a lot easier to compute and for short arc lengths
    almost indistinguishable.<p>These get used in roller-coasters too, for pretty
    much the same reason (to avoid the &quot;jerk&quot;)<p>What is not so well known
    is that Markov (of Markov chains) worked on the problem of optimal curves for
    joining straight railway tracks constrained by steering dynamics of trains. I
    think this was before his work on chains. His formulation was later rediscovered
    independently by Dubins.<p>[*] I am so glad you asked why an orange <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;1202.3033v1"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;1202.3033v1</a>
  score: 0
