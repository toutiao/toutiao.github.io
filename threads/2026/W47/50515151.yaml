  author: Sharlin
  text: A highway or railway curve between two straight segments is usually not a
    simple circle arc. If it were, the sudden discontinuity in higher derivatives
    (acceleration and jerk) at the transition point from straight to curved would
    feel uncomfortable, be harder to anticipate and slow down appropriately by a driver,
    and cause unwanted shear stresses to mechanical parts. So transition curves are
    used that smoothly vary the curvature from zero to that of the circular segment
    and back to zero again. The typical transition curve in engineering is called
    a clothoid, which is one of the squircle types mentioned in the article.<p>In
    digital graphic design curvature discontinuities don’t usually cause mechanical
    issues, but discontinuities in curved shapes can still look jarring – for whatever
    reason the visual system is rather good at detecting such sudden changes in shapes,
    even those that naively &quot;should&quot; look smooth.
  score: 0
