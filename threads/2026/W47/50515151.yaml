  author: alanbernstein
  text: On a rounded rectangle, the shape of the corner is continuous, but the curvature
    is not - it jumps from 0 to R. Rounded rectangles look fine, but if you&#x27;re
    attuned to it, this subtle discontinuity can look just a little bit off.<p>A squircle
    is one (actually several variations) approach to making the curvature continuous.<p>I
    would say it&#x27;s still a subjective aesthetic difference, but you can use math
    jargon to explain why you like one better than the other.
  score: 0
  posted_at: '2026-11-16T21:04:41Z'
- id: '50523316'
  parent_id: '50522334'
  author: YuechenLi
  text: A regular rounded rectangle is G1 continuous while a squircle (superellipse)
    is G2 continuous, which means that it is not only continuous on position and tangent
    for its outline, but the curvature rate of change for the outline is also continuous,
    so it&#x27;s smoother and doesn&#x27;t have hard difference between &quot;line&quot;
    and &quot;rounded corner&quot; on the shape.
  score: 0
