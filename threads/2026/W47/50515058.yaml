  title: "“…and the proof is checked in Lean” | Xena"
  fetch_status: success
  content: "[← A Modern Reorganization of&nbsp;Mathematics](https://xenaproject.wordpress.com/2026/11/11/a-modern-reorganization-of-mathematics/)\n\n##
    [“…and the proof is checked in&nbsp;Lean”](https://xenaproject.wordpress.com/2026/11/12/and-the-proof-is-checked-in-lean/)\n\nPosted
    on [November 12, 2026](https://xenaproject.wordpress.com/2026/11/12/and-the-proof-is-checked-in-lean/
    \"12:50 am\") by [xenaproject](https://xenaproject.wordpress.com/author/xenaproject/
    \"View all posts by xenaproject\")\n\nThis post is an attempt to explain in simple
    terms how to interpret claims of the form “this theorem is correct because it
    was checked in Lean”. The summary is: there is an important signal that can be
    extracted from Lean code, but if this code is AI-generated then you need to do
    some tests first. We explain the tests, and note that in many cases (such as the
    OpenAI theorem dump) these tests have not yet been systematically done.\n\n##
    Introduction\n\nLast month’s [theorem dump by OpenAI](https://github.com/openai/math)
    consisted of 722 mathematics papers, around 45% of which came with some Lean code.
    Three of the (non-Leanified) papers have since been retracted because of a sign
    error. Some people might say “well, the papers that come with Lean code are definitely
    correct because that’s how Lean works”. Others might say “well Lean had a [soundness
    bug](https://leodemoura.github.io/blog/2026-8-1-postmortem-for-kernel-soundness-bug-14576/)
    and could well have more, and AIs will reward hack, so Lean verification doesn’t
    tell us much at all”. The truth, unsurprisingly, is more subtle, and this post
    is an attempt to explain it.\n\nThis post is structured as a sequence of four
    questions that one needs to ask about a Lean repository, particularly if it is
    AI-generated, before one can start to make correctness claims of this form. And
    before I start, let me stress that for many of the papers in the OpenAI theorem
    dump, these questions have not yet all been answered affirmatively (but there
    is nothing stopping people from answering these questions, and I have no reason
    to believe that any of the tests below will fail, it’s just that people didn’t
    do them yet).\n\n## Question 1. Does the Lean statement match the informal statement?\n\nA
    Lean repository will typically have a “headline theorem statement”. This will
    be some computer code which defines the _statement_ (not the proof!) of a theorem.
    Note the huge difference here between the statement, and the proof. For example
    here is some fully-compiling Lean code which defines a mathematical statement.\n\n
    \   import Mathlib\n    \n    def FermatsLastTheorem : Prop := \n      ∀ a b c
    n : ℕ, n ≥ 3 → a^n + b^n ≠ c^n\n\nThis code imports Lean’s mathematics library
    `Mathlib` and then defines a mathematical statement which looks at first glance
    like it might be Fermat’s Last Theorem, but which actually is a trivially false
    statement because in Lean `ℕ` contains `0`, so `a = b = c = 0` and `n = 3` gives
    a counterexample. This does not stop the statement from compiling! It will however
    stop any _proof_ of this statement from compiling. Lean carefully distinguishes
    between the statement of a theorem and the proof of a theorem; humans are very
    good at referring to both ideas as “a theorem”.\n\nThe first question which one
    has to ask when judging a pdf which comes with some Lean code is: “what is the
    _statement_ of the theorem in the Lean code, and does this correspond to the actual
    theorem statement in the pdf?” For a human Lean expert, this is typically (but
    not always) an easy question to answer. For example any Lean-competent human mathematician
    would be able to read the two lines of code above and observe that this was a
    mis-statement of Fermat’s Last Theorem.\n\nThings are, however, not always as
    easy as this. Currently, because of deficiencies in available libraries, one may
    have to read many thousands of lines of code just to understand the _statement_
    of a formalised theorem. An example of this right now is a [PR to DeepMind’s Formal
    Conjectures repository](https://github.com/google-deepmind/formal-conjectures/pull/5538)
    containing a Lean formalisation of the statement of the Hodge conjecture. At the
    time of writing, the statement relies on over 10,000 lines of code sitting on
    top of `Mathlib`, because `Mathlib` (which is carefully human-expert-checked and
    which can be trusted) does not yet have the definitions of things like the cycle
    class map needed to make the statement. Another example is [Axiom’s recent announcement
    of a formally-verified proof of the classification of finite simple groups](https://axiommath.ai/research/the-enormous-theorem-formalized/).
    The statement which Axiom’s system proved is [here](https://github.com/TauCetiProject/TauCeti/blob/ff97e2dafb29b508b1229a5a7acbbca81ebcf3a1/TauCeti/GroupTheory/SpecificGroups/CFSG/Classification.lean#L52-L56)
    in Tau Ceti, an AI-generated library of Lean code. The file containing the statement
    imports over 250K lines of Lean code in Tau Ceti (over 900 files). Of these, around
    5600 lines of code are crucial because they contain all the relevant definitions
    (for example, all the definitions of the sporadic simple groups, most of which
    are still not in `Mathlib`). Without human checking, one does not really know
    for sure that this is definitely the correct statement of the classification (and
    note that I have not yet met any human who claims to have carefully checked that
    the definitions of the sporadic groups in Tau Ceti are correct). In fact by far
    the strongest evidence that we have that this statement is correctly formalized
    is that Axiom’s code proves it!\n\nIt is worth noting that of the 290 OpenAI theorems
    which come with Lean code, around 38 of them have the property that the Lean code
    **does not even state, let alone prove, the main theorem of the paper**. And OpenAI
    never claimed that it did! They just said “here is some Lean code which goes with
    this paper”. Sometimes the code just states and proves some intermediate results
    — my impression is that OpenAI decided to go live when some of the formalizations
    were incomplete, so just dumped what they had. To give a concrete example: [paper
    194](https://www.emergentmind.com/openai-math-explorer/results/194) claims to
    prove Lech’s multiplicity conjecture in commutative algebra, with no restriction
    on dimension, residue field or characteristic; this question has been open since
    1960. The headline theorem in [the corresponding Lean code](https://github.com/openai/math/blob/main/lean/ComparatorChallenges/DuttaDomain.lean)
    can be checked to be Corollary 5.4 of the paper — already an impressive achievement,
    but not the headline result.\n\n## Question 2: does the code compile?\n\nOnce
    you’re convinced that you understand the statement of the theorem which the Lean
    code purports to prove, you (or perhaps one of your friends who has access to
    a beefy machine, if the code base is huge) has to actually compile the code.\n\nWhen
    Anthropic [formalized a proof of Fermat’s Last Theorem in Lean](https://www.anthropic.com/research/formalizing-fermats-last-theorem),
    they asked me to take a look at the 13 million lines of code which they had generated.
    I downloaded it onto my machine, dumped it into a sandbox (because who knows what
    AI-generated code will do, it can in theory delete all your files) and attempted
    to compile it; I very quickly ran out of memory. I told Anthropic that I was unable
    to make any claims about what they had done until I could see the code base compiling,
    and they gave me temporary access to a machine with 96 cores and 500 gigs of ram.
    I could then compile the code.\n\nOf course, with a more reasonably-sized codebase
    it is possible to compile the code on a reasonably-sized machine. For example
    OpenAI’s resolution of the Navier-Stokes problem is 640K lines of code and compiles
    fine on my laptop.\n\nIt is probably worth stressing again: do not run random
    Lean code on your local machine unless you sandbox it first. Lean’s mathematics
    library is safe to r"
