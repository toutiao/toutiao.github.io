  author: lumost
  text: Saying that a &quot;formally verified&quot; program rules out any bugs is
    a bit of a reach. Formal verification only checks that the properties you claim
    are true are actually true in the absence of bugs in the proof logic.<p>Example
    bug<p>A verified network program ensures that &quot;data from two addresses are
    never commingled&quot;, but it does not verify that the NIC can&#x27;t overwrite
    control flow memory opening up RCE attacks&#x2F;other memory reads.<p>It certainly
    is harder to make bugs in formally verified software than the alternative, but
    it is not bug free.
