  author: red75prime
  text: 'If it is a Socratic question, I don&#x27;t understand what hidden complexity
    you are pointing to.<p>Lean axiomatization of natural numbers goes roughly like:
    0 is a natural number, for each natural number a, succ(a) is a natural number
    (plus some additional properties of succ that don&#x27;t matter for this proof:
    succ(a) != a and so on). succ corresponds to the intuitive notion of a next counting
    number (which number of things you get if you add another thing to the collection).
    Mathematical object designated as 0 corresponds the intuitive notion of nothing.
    Therefore succ(0) is the number of things that you get if you add a thing to nothing,
    that is 1. succ(succ(0)) is what you get after 1, that is 2.<p>Lean axiomatization
    of operation `+` is, basically, a set of rewriting rules that I apply in the proof.
    And it&#x27;s constructed in such a way as to correspond to the intuitive notion
    of counting two sets of things together.'
