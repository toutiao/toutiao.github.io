  author: YeGoblynQueenne
  text: "&gt;&gt; If it is a Socratic question, I don&#x27;t understand what hidden
    complexity you are pointing to.<p>All of it! What is a &quot;natural number&quot;?
    Why is 0 a natural number? What does it mean for a natural number to be the successor
    of another? What are those additional properties of succ that don&#x27;t matter
    for this proof? Incidentally, what is a proof? What is a &quot;Lean axiomatization
    (OMG)? What is an axiomatization (OMGOMG)?<p>And so on. Notoriously, the proof
    of 1 + 1 = 2 is on page 362 of Volume 1 of Principia Mathematica. That&#x27;s
    because if you really, really want to axiomatize arithmetic you have to do a hell
    of a lot of legwork beforehand and it&#x27;s not &quot;trivial&quot; at all to
    do so in a self-contained and consistent way.<p>For example, consider trying to
    get a five-year old to understand your proof. Would that make any sense to them?
    They know that 1 + 1 = 2 because they learned that at school. Can they understand
    the proof you&#x27;re trying to give here?<p>And btw, you didn&#x27;t really give
    a proof, it&#x27;s only a sketch proof and you didn&#x27;t even use the words
    &quot;by induction&quot;. I&#x27;m pretty sure you have to, at some point, say
    &quot;by induction&quot; and oh boy, try to explain <i>that</i> to a five-year
    old.<p>Edit: btw, lest this is thought of as pedantry, the point of automated
    theorem proves is that they work in this extremely anal way, i.e.t hey have to
    take all those &quot;trivial&quot; steps which human mathematicians normally don&#x27;t
    bother with. And that&#x27;s where they draw their power from and why we can rely
    on their proofs and trust them in a different way than we trust human proofs."
