  text: I think the deeper problem - an I am reading Computational Reflections by
    Cantwell Smith and that might be colouring my view - is that fundamentally it
    comes down to the interpretation of what the code or the math says.<p>The very
    meaning of interpretation in computer science is at odds with the use in philosophy
    of language and that is symptomatic.<p>We&#x27;re still fundamentally trying to
    advance Hilbert&#x27;s program. It&#x27;s like Göedel&#x27;s work hasn&#x27;t
    sunk in to our collective reasoning about reasoning. It just doesn&#x27;t seem
    possible to build a self contained correct and truthful system of symbolic logic.
    Truth is in the relationship of the system with other systems.<p>Automating mathematics,
    like automating software engineering, or automating automation, are all self contradictory
    propositions. Anything of what we build only ever means anything in how it interacts
    with us. I mean, people will go round and round in this forum discussing semantics
    and the meta implication of these unceasing discussions never seems to hit home.
    Namely, that there is no universal, truthful, correct, system of symbolic logic.
    It seems in fact impossible to have one. But the results that indicate this impossibility
    are built with a system of symbolic logic and the validity therein is contingent
    on people&#x27;s understanding and, like all symbolic logic systems (including
    the ones that states the limits to universal symbolic logic systems) they are
    bootstrapped from axioms one must chose at the start or by default and they can
    never be fully proved by the very system built atop them.
