  author: thechao
  text: 'Hey! Your comment really made me think about what a language would even <i>look
    like</i> that was &#x27;complete&#x27; rather than &#x27;sound&#x27;. It&#x27;s
    kind of an interesting problem. The issue is that our formalisms really aren&#x27;t
    set up to handle this question &quot;out of the box&quot;. I knocked together
    three different avenues of attack: (1) we could allow a complete but unsound concretization
    via abstract interpretation (the OG AI!); (2) we could allow complete but unsound
    extensions of a simply typed lambda calculus by shortcutting closure over µ-recursion,
    adding in untyped casts, or by unifying the cell model without providing access
    guarantees (effectless effect systems?); and (3) we could add the &quot;it&#x27;s
    about the same&quot; operator to the core Siek-Taha gradual type system. All three
    results are pretty goofy. I especially like the fact that (2) is shockingly similar
    to Haskell&#x27;s coercions and ... just plain old C (with a <i>lot</i> of hand
    waving).'
