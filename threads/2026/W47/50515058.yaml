  author: seanwilson
  text: "&gt; def FermatsLastTheorem : Prop := ∀ a b c n : ℕ, n ≥ 3 → a^n + b^n ≠
    c^n<p>&gt; This code imports Lean’s mathematics library Mathlib and then defines
    a mathematical statement which looks at first glance like it might be Fermat’s
    Last Theorem, but which actually is a trivially false statement because in Lean
    ℕ contains 0, so a = b = c = 0 and n = 3 gives a counterexample.<p>...<p>&gt;
    The first question which one has to ask when judging a pdf which comes with some
    Lean code is: “what is the statement of the theorem in the Lean code, and does
    this correspond to the actual theorem statement in the pdf?” For a human Lean
    expert, this is typically (but not always) an easy question to answer. For example
    any Lean-competent human mathematician would be able to read the two lines of
    code above and observe that this was a mis-statement of Fermat’s Last Theorem.<p>To
    add to this, if the statement is wrong, the proof steps and other theorem statements
    that appear in the full proof are going to follow a path that goes with the wrong
    statement so there&#x27;s further opportunities to see there&#x27;s a mistake.<p>Often
    problems with the statement make it suspiciously easy to prove, the proof takes
    a path that doesn&#x27;t make sense with the correct statement in mind, or it
    makes it impossible to complete the proof. In the above example, you would see
    from the easy counterexample found in the proof that the statement is wrong. The
    proofs aren&#x27;t a black box.<p>And if the proof is taking advantage of a bug
    in Lean somewhere to prove some faulty intermediate theorem, you can still scrutinise
    the path that takes the proof, the same as you would to find a problem in a flawed
    hand-written proof. The flaw would ripple through the rest of the proof.<p>It&#x27;s
    like if your high-level requirements for a computer program (the theorem statement)
    had a mistake and someone implemented it (the proof). The implementation is going
    to follow a path that implements that mistake. So by looking at individual function
    definitions that were implemented and what the code is doing, there&#x27;s opportunities
    to spot mistakes in the requirements like missing assumptions or parts that don&#x27;t
    make sense. This often happens when you&#x27;re trying to code something based
    on flawed requirements, where the problem becomes more obvious as you get into
    the details of the code. It&#x27;s the same with proofs."
