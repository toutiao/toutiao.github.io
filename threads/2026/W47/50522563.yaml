  author: xeubie
  text: Rust enums conflate the tag type with the union type that uses it. These should
    be separate things. In the example here, you can see that Rust gives no way to
    represent the tag type `{Human, Cat}`. In Zig there is an enum which is a set
    of tags, and a union which is backed by that enum and can have fields. It is obviously
    better to have these as separate concepts rather than conflating them. You often
    want the kind without the data, and Rust gives you no way to represent it. I&#x27;m
    not sure why I am bothering to rant about this but it&#x27;s one of my biggest
    annoyances with the language.
  score: 0
