  author: MomsAVoxell
  text: I have applied this for decades, with multiple languages under my belt, and
    multiple million-dollar projects on my CV, and meanwhile I have found another
    similar rule that I think also sharpens a developers mind:<p>Put Lua in things.<p>Now,
    before you anti-Lua types start jumping on that 0-indexed down-vote, let me explain.  Its
    not just about the language, its about the &quot;thing&quot; you&#x27;re putting
    it in, its about using the VM effectively, its about planning and using the stack
    properly. It&#x27;s about using one language to leverage the strengths - and discover
    the weaknesses - of other languages, runtimes, ABI&#x27;s.<p>Putting Lua in things
    is easy - and it is hard.  It teaches you how to treat other things with respect,
    and it teaches you how to disregard other things and &quot;Just Use Lua™&quot;.<p>You
    can learn the language - multiple variants of it.  You can learn the &#x27;things&#x27;
    you&#x27;re putting it in.  You can learn how a VM works, what byte code is, how
    it can be used effectively - and how it can be used counter-productively, too.<p>It
    will teach you the limits of a language - Lua, and C - and it will teach you the
    strengths of both (as well as Rust, and all the other things you can get an FFI
    scaffolding built around).<p>You can use Lua to produce your own domain specific
    language.  You can use it to (almost, or indeed completely) replace whatever other
    language the &quot;thing&quot; is using.  You can use it to minimize the impact
    of a VM and scripting and byte code - you can learn how to maximize these things
    as well.  You can learn byte code and you can leverage that understanding to learn
    machine language - two ends of a very similar (yet vastly different) spectrum.<p>You
    can learn how slow&#x2F;fast pieces of the system interact productively and effectively
    - you can learn how things get mightily messed up, also, if you use the wrong
    lubricant.<p>In the end, you may not even end up using it for productive things
    - but you might also do something extremely powerful. (I have.)  Either way, by
    applying this maxim and applying the skills needed to master doing it (or screw
    it up entirely), you can learn pretty much everything interesting there is to
    learn about software (besides LLM&#x27;s) in today&#x27;s modern stack madness
    .. and then some.<p>Seriously, give it a try.<p>The other one of these developer-tuning
    activities (there are a few), is to do a Linux From Scratch session at least twice
    a year.  Do it this year, but plan on doing it again next year as well.  Do it
    a few more times this decade.<p>Iterate.  Extend.  Ignite.
  score: 0
