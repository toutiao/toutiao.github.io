  author: QuantumNomad_
  text: At the beginning of my university studies (second or third semester), one
    of the homework assignments was to write a Sudoku solver. I spent a lot of time
    on it, prototyping it with JS and HTML so that I could visualize step by step
    how to solve Sudoku in general, implementing the techniques in code that I had
    previously been doing by hand when doing Sudoku puzzles in the past.<p>I am not
    sure if everyone else looked up techniques online or what for how to do it, or
    if they skipped that assignment, or made a very simplified solver that only handled
    some basic techniques. We hadn’t really learned much of anything yet in any of
    the classes of the course that would be useful for making a general solver. I
    thought I was supposed to figure it all out on my own, and that it should be able
    to handle any Sudoku puzzle that a person could solve. And in the end, despite
    many, many hours of working on it over many days it was still far from a complete
    solver. And I also didn’t have time to write it in the programming language we
    were using in the course. I was prototyping in JS and HTML because I wanted to
    see visually the sudoku puzzle and be able to switch between having the computer
    find next number and clicking on the number myself, to discover in detail how
    I was thinking when I was solving Sudoku puzzles, so that in turn I could implement
    those techniques in code.<p>I lost a little bit of motivation for the class with
    that, and dropped out of the class soon after because I found the class to be
    generally uninspiring and hard to stay motivated for, in spite of being interested
    in programming in general and having learned programming languages and made little
    programs of my own already since High School. Later I dropped out of the whole
    study, as I was struggling to study across most subjects and wasn’t passing enough
    classes to be able to continue.<p>My interest in programming continued, however,
    and I’ve been developing software both professionally and as a hobby with sometimes
    pretty good results during the years since, and having done so for companies both
    small and big, and in multiple different programming languages.<p>But I think
    the way I handled trying to implement the Sudoku solver is a way of working on
    things that I already had since before then and that I continued also later, and
    that that is also part of the reason that things go wrong for me when they do.
    Both professionally and also elsewhere in life.<p>The last job I had, I was laid
    off for not performing well enough. And I think in part I was still working on
    tasks at that job in some sort of wrong way all these years later, that may be
    similar in some ways to what I may have done wrong with for example that Sudoku
    solver assignment. And probably in many other cases too both before and after.<p>And
    now that AI is here I’m not really sure how to land a new job as developer at
    all. Even though I would like to. Combined with the sense that there is too much
    ups and downs in success rate of what I’ve been working on over the years to be
    able to present myself in an impressive manner to employers. I value honesty and
    integrity, and I find it difficult to really imagine that I could sell myself
    well at this point when I look back at my life so far, in spite of sometimes doing
    things well, because of the times that projects have not gone well.
