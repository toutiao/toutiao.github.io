  author: xeubie
  text: No, you can&#x27;t, because you&#x27;re misunderstanding my point. You can
    make an enum in rust that doesn&#x27;t contain data, but you can&#x27;t make an
    enum that is explicitly backed by a tag type. `#[repr(u8)]` lets the tag be a
    u8 with values like Human = 1, Cat = 4, but you can’t say &quot;Person&#x27;s
    tag is my PersonKind enum.&quot; Zig lets you do exactly that with `union(PersonKind)`.
    In Rust, PersonKind would always be a separate type you keep in sync by hand.
