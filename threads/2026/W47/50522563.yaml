      pub type Request = FileOp&lt;Inputs&gt;;

      pub struct Outputs;

      impl Payloads for Outputs {
          type Read = u8;
          type Write = ();
      }

      pub type Reply = FileOp&lt;Outputs&gt;;

      pub fn execute(request: Request) -&gt; Reply {
