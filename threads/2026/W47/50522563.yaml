  text: Yes, there is something you can do with separate types. You can name a variant
    without having a value of it. `discriminant` only works on an existing value,
    so to refer to &quot;cats&quot; you&#x27;d have to build a dummy `Cat`, and the
    result is opaque. You can&#x27;t match on it, iterate over it, or create one from
    a byte you parsed off the wire. This is so obviously worse, I can&#x27;t believe
    you bothered to ask.
