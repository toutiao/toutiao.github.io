  text: |-
    Yes, all correct. &quot;()&quot; the unit type, is a zero sized type (zst).<p>And you don&#x27;t have to have 1:1 type to enum discriminant:<p><pre><code>  trait Payloads {
          type Read;
          type Write;
      }

      enum FileOp&lt;P: Payloads&gt; {
          Flush,
          Read(P::Read),
          Write { data: P::Write },
      }

      struct Inputs;

      impl Payloads for Inputs {
          type Read = ();
          type Write = u8;
      }

      type Request = FileOp&lt;Inputs&gt;;

      &#x2F;&#x2F; enum item construction
      Request::Flush;
      Request::Read(());
      Request::Write { data: 42 };

    </code></pre>
    You can also make an item impossible to exist using the never type:<p><pre><code>  struct WriteOnly;

      impl Payloads for WriteOnly {
          type Read = !;
          type Write = u8;
      }</code></pre>
