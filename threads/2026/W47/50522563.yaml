  text: |-
    The AI (mid 90s) class I took in college was taught in lisp.  I recall that it was a program to identify the variables that would be needed in order to have it be a true statement (one of the functions named &#x27;hamletp&#x27; that identified structures that were `(or twobe not (twobe))` and rapidly resolve it to true).<p>When done with the assignment I asked the emacs fan in then lab to look at it and his comment was &quot;you write beautiful C in lisp.&quot;<p><a href="https:&#x2F;&#x2F;www.ee.torontomu.ca&#x2F;~elf&#x2F;hack&#x2F;real-programmers.html" rel="nofollow">https:&#x2F;&#x2F;www.ee.torontomu.ca&#x2F;~elf&#x2F;hack&#x2F;real-programmers.html</a><p><pre><code>    ... Besides, the determined Real Programmer can write FORTRAN programs in any language.
    </code></pre>
    ---<p>My first revelation with functional programming was when I was dabbling with Clojure based on a Coding Horror question with giving a person being given an algorithim more difficult than Fizzbuzz (which has been memorized)... compute e or pi were the ones that I thought of.<p>pi &#x2F; 4 = 1&#x2F;1 - 1&#x2F;3 + 1&#x2F;5 - 1&#x2F;7 ...<p>I was trying to figure out if I could use cycle to handle that and then the lightbulb for first class functions hit him.<p>The solution I came up with was:<p><pre><code>    (defn pi
          ([] (float (* 4 (pi 1 0.01 0 true))))
          ([term tol accum pn]
            (let
              [t (&#x2F; 1 term)
               a ((if pn + -) accum t)]
              (if (&lt; (* 4 t) tol)
                a
                (pi (+ term 2) tol a (not pn))
              )
            )
          )
        )
    </code></pre>
