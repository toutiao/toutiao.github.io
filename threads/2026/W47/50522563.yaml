  author: clownstrikelol
  text: Ok from reading through your other comments on this thread and the links out
    to Ada and Zig docs, I think what is roughly equivalent would be aliases of unit.<p>i.e.
    type Whatever = ()<p>That gets you a “tag” that is compile time enforced. You
    can explicitly match against these aliases and one alias will never == another
    alias (unless you explicitly write out a from &#x2F; into impl, and a deref impl
    to make it happen implicitly).<p>What you seem to be ultimately asking for is
    being able to use a tag that is freely floating around to determine the variant
    of a union. This would need to be explicitly handled inside an unsafe block though.<p>The
    “happy path” here explicitly ties them together. Letting them not be handcuffed
    together is not memory safe, and the compiler has no way to guarantee you’re reading
    a value correctly.<p>You can of course bypass all of that inside an unsafe block
    and pinky promise to the compiler you made no mistakes.
