  author: miki123211
  text: If libraries were invented in the 21st century, it would have been by a Silicon
    Valley entrepreneur &quot;disrupting the copyright monopollies&quot; with the
    innovative practice of &quot;book sharing&quot;. They would quickly be criticized
    by authors and journalists alike and banned by some local governments.<p>Libraries
    that required their members to pay fees did in fact exist historically. It&#x27;s
    how many libraries in the US got started. They were private enterprises meant
    to make money (or at least be self-sustaining non-profits relying on a mix of
    donations and fees), not government-run projects.<p>Libraries are an obvious workaround
    for the western copyright system[1]. Because this system lets us share existing
    book copies without the permission of the author, but doesn&#x27;t allow us to
    print new ones for free even when the capability exists, the obvious way to make
    books cheaper is to serially share them across many readers and have each pay
    the fraction of the price. This is essentially what these libraries did, with
    fees as a stand-in for the price sharing that simplified their operation.<p>[1]
    Yes, I&#x27;m aware that copyright isn&#x27;t exactly necessary for libraries
    to exist; high printing costs would do it too. I do think that they would be entirely
    unnecessary and almost extinct (in well-functioning 21st-century democracies)
    if not for copyright, given our printing costs.
  score: 0
