  author: commandersaki
  text: 'I didn&#x27;t find the answer that interesting:<p><i>Vint Cerf: In the early
    1970s, while we were developing this, we asked ourselves, should there be patents
    associated with it? Should there be other constraints? Should it be a licensable
    thing? The government does license technology that it has paid to develop, but
    it can also release it openly. And we went through a kind of analysis. Remember
    that we were thinking this would be a substrate for the American command and control
    system that would use computers to support command and control. And that we knew
    that it would have to be interconnected to our allies. So then in 1973, &#x27;74,
    we&#x27;re saying, well, who are our allies now in 1974? And there&#x27;s this
    list. And then we said, well, who were our allies 25 years before that? And it
    was a different list. And we said, who will our allies be 25 years from now? And
    we didn&#x27;t know. So we thought the only way we can be assured that the allies
    will have access to this is to simply open it up. So we published this openly.
    All the protocols were made available openly. We encouraged implementations and
    interoperability. Interoperability. Could I just say one thing about that word,
    interoperability? Literally, everything in my career has revolved around the ability
    of disparate and distributed systems to interwork with each other. And interoperability
    is its own reward. And so I think if there was any theme in my history and in
    my career, it&#x27;s been the seeking interoperability among disparate systems</i>'
  score: 0
