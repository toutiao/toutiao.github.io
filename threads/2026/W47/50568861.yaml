  author: lioeters
  text: "&gt; interoperability is its own reward<p>That was one of my favorite points
    of the interview. He found value in building relationships, improving the space
    between systems and how they work together. That explains why TCP&#x2F;IP was
    not patented - the reasoning was that the protocols needed to adapt to an unknown
    future when your allies could become enemies, or vice versa, so the best solution
    was to publish the invention and open it up to everybody.<p>&quot;Adversarial
    interoperability&quot; is a phrase I saw somewhere, and may apply here too."
