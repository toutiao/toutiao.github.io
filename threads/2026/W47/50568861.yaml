  author: keeda
  text: I would say the difference is in the high-level structure of the protocol
    and the guarantees it provides. You’re right that once the structure is established
    the components could be fungible, but depending on what guarantees are being promised,
    coming up with the structure can be very non-trivial.<p>Like, in security there
    are a zillion ways your protocol could be compromised even if there are no bugs
    in the code. I’m not familiar with the Signal protocol at all, but I do know the
    combination of guarantees it provides were unmatched until it came along.<p>On
    the flip side “protocol” is a broad term, encompassing even a basic file format
    or a message between a client and server (hence “<i>proto</i>bufs”!) where the
    only guarantee is “you will find this data at this location.” Those indeed are
    a dime a dozen, but they’re on the simpler end of the spectrum.
