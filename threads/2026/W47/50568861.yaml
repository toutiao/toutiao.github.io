    _Vint Cerf shows a plaque from the ARPANET’s Interface Message Processor, the refrigerator-sized computer that was the network’s packet switch. It was given to him when he left ARPA in 1982. The hardware dates from 1969._

    > “I’m worried that the 22nd century won’t know what happened in the 21st because all of our records will have evaporated or will be uninterpretable.”

