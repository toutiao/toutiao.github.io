    curl supports around 25 different url schemas according to the man page.  So another check might also be useful to look at which url schemes those vulnerabilities affected.   From a quick check there were definitely ones against SSH, IMAP, SMB, LDAPS etc. Maybe 15%-20% of them?
    From a quick check curl etc also supports a wider range of HTTP related features around auth and proxy handling.   It also looks like curl is much more tolerant of bad HTTP server designs, where the server responses are not strictly HTTP compliant, whereas reqwest seems to be pretty strict in terms of compliance. It'd be lovely (and probably a better outcome) if everything was compliant, but in reality that's just not things are , particularly in embedded stacks which aren't going to get overhauled.
    I'm not an expert in either, this was just a quick check. But yeah, looks like the attack surface on curl is huge compared to reqwest.
