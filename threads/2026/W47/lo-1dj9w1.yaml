    Part of the reason it's possible at all with Rust is that it's got good C<->Rust interop which makes incremental porting tractable (i.e. The downsides of rewriting are more mitigated the more incremental you can make it) and I'd say the tipping point is when continued development in C is more difficult than an incremental rewrite into Rust.
