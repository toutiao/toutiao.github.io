  text: |-
    So... I don't think you're being particularly kind in your response here but I'm going to engage a bit.

    I can understand waiting until it's supported in GCC, given the environments curl is used in. But the closest they get is advertising their stable ABI – which Rust can maintain for C interfaces.

    That's not the "closest". Have a look at https://doc.rust-lang.org/nightly/rustc/platform-support.html and look at what the definition of Tier 2 is. 32-bit ARM is everywhere in embedded devices and curl is all over the place on embedded devices. MIPS 32-bit and 64-bit are Tier 3. ARM themselves provide supported versions of GCC. Rust might be able to provide a stable C interface to the code, but they provide no serious support for the compiler actually working on a lot of common embedded platforms.

    Someone has been able to largely automate the process of migrating the codebase?


    No comments on the quality of the port

    And thanks to it being straight up vibecoded, the majority of the code there has never had a single human eyeball look at it. I'm not anti-LLM by any means, I use these tools daily, but... using an LLM to port 200kloc from one language to another and call it a drop-in replacement? C'mon now.

    Rewrites won't happen in Open Source because every project is run by one or more BDFL that like their existing codebase and programming in C.

    That's the beauty of Open Source in this case. We already have two examples (which Daniel did link to) where people have done the port. What the people who did that port have not done is... find any kind of critical mass of people who would rather use and work on that port over the existing C implementation.
    The thing I've never understood about the "rewrite it in Rust" (with or without an LLM) idea is that they're shooting themselves in the both feet:


    If I have a codebase that I've been working on for 20 years and know inside and out, there is very little probability that I would like to throw away all of that knowledge because someone else thinks I should. Expecting a maintainer to drop their well-known and grown codebase for an LLM-built version in a different language is pretty wild.


    It's adding very little net value. Yes, likely a decrease in memory-safety errors (+gross value). Also likely to be incompatibility bugs where the behaviour is different than what the C code did (--gross value).  Also a massive loss of institutional knowledge by the people who know the code the best (--gross value) and in this case, there's no one who does know the new codebase at all.


    My recommendation for someone who's proposing "rewriting something in Rust" is to, instead, start a new project that they're willing to own and maintain, and make it better than the code they're proposing replacing. Find the rough edges in the curl API and make them better. Don't try to convince the maintainer of the existing project to toss their life's work, try to convince the world that you've got a better library for making HTTP/etc (many!) requests from C or C++ code, or any language with a C FFI.

    I'm sure your community is nice and outsiders giving unwanted advice is irritating.

    I mean yes, but the problem isn't strictly the unsolicited advice, it's showing up and telling someone to do a massive amount of work (even if you use an LLM to "translate" from C to Rust, how long is it going to take you to a) actually trust that translation, and b) be anywhere nearly as proficient with the vibe-generated codebase as you are with the one you've been working on since last century) without any skin in the game.
