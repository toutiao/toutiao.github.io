    I compile packages for lots of less common platforms like SuperH, m68k, VAX, Alpha, et cetera, and of course people will gladly dismiss those as too niche to worry about.
    Instead, I'll give you an example of a device that's still widely used: I'm using dozens of PogoPlugs as VPN endpoints, firewalls, NAT routers, et cetera. The processor is earmv5, and while I've seen rust work (ish) for earmv6hf (which is already being treated as though the trip to the back of the barn will come any day), I've never seen it work properly for earmv4 or earmv5.
    Each PogoPlug is running the latest NetBSD with BIND 9.20, nmap, mtr, tinc, and all sorts of other utilities, and none of them have any issues with earmv5. But when I run across a rust or Go tool, there's just no way to use them.
    Also, I'm not going to put tools written in rust or Go on my aarch64 or amd64 machines, because what's the point of adding a tool to your toolbox that you can only use in certain places and not others? This is what, I think, a lot of rust proponents miss.
    One final thing worth noting is that number of rust dependencies needed for even basic tools is, well, rather large.
