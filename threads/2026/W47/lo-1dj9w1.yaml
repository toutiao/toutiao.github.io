    Rust has substantially caught up in platform support. There's Rust for Haiku, QNX. There's Rust for 68k and AVR. It can target BPF and NVPTX. Thanks to Rust's GCC backend, people even got Rust running on Dreamcast. People managed to build Rust for Windows XP and even 95. The platforms that are left out now are really really niche bottom of the barrel.
