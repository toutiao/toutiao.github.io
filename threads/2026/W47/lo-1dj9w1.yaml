    People seem to forget that rust isn't as portable as C, and until it gets quite a bit further, every request to rewrite something is a request to desupport many platforms.
    The same rewrite-everything-in-rust people are almost invariably OK with saying that only the important platforms and processor architectures matter, and haven't got a clue and/or simply don't care about the impact this would have on actual, running hardware out in the real world. Out of sight, out of mind. "It doesn't affect me."
    And, as we're seeing with the sudo rust rewrite and the coreutils rewrite, along with other corporate inspired pushes such as moving to x86-64 v2, 3 or 4, the people who have nothing to lose are fine with the rest of the world losing those things, even if it means problems for everyone.
    I wish the rewrite-everything-in-rust people would actually take the time to understand the effects of what they're pushing for.
