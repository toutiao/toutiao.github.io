    That's not the "closest". Have a look at https://doc.rust-lang.org/nightly/rustc/platform-support.html and look at what the definition of Tier 2 is. 32-bit ARM is everywhere in embedded devices and curl is all over the place on embedded devices.

    To be fair to them, the standards for Tier 1 blow GCC's testing out of the water. It's basically "someone is providing us a CI farm/cloud where we can run the compiler and test suite on it, bare-metal, and it's powerful enough that we gate accepting changesets on the completion of CI runs that include it".
    (Back before Microsoft started donating Azure capacity, I remember there was a period when CI was starting to become a bottleneck on Rust development.)
    In essence, I don't think it's possible for 32-bit ARM to be Tier 1 because I don't think anyone makes 32-bit ARM servers powerful enough and, if they do, apparently nobody is willing to pay to donate the capacity to get it to Tier 1.
    When they say "automated tests are not always run" about Tier 2, they mean it in the context of "merging changes into the main branch is blocked on all Tier 1 CI runs passing".
    According to https://www.gnu.org/software/gcc/testing/, how it works for GCC is:


    H.J. Lu has several automated Linux/ia32 and Linux/Intel64 testers which build GCC and run the GCC testsuite as well as SPEC CPU 2K/2006 with various optimization options. All test results are sent to the gcc-testresults mailing list and any regressions are sent to the gcc-regression mailing list.
    Several people perform regular builds and regression test runs and send their test results to the gcc-testresults mailing list.
    Jan-Benedict Glaw is running a build robot that tries to build various cross-targets (stage1 only) on some machines.


    It's akin to how you can't compare Rust vs. C or C++ CVE counts one-to-one because, by the standards of C or C++ developers, the people reporting Rust CVEs are hypochondriacs.
