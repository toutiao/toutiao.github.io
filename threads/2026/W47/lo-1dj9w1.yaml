    A good benchmark should be an established HTTP library in Rust, such as reqwest -- which according to the RustSec Advisory Database didn't ever have any reported vulnerability. Of course that's misleading too as this doesn't include transitive dependencies such as rustls

    I think that's misleading too :p It's sensible to put something like rustls out of scope, but reqwest has much more substantial dependencies. http had two high/critical vulns. hyper - a related HTTP library from the same author as reqwest - had several more. For HTTP/2, it seems to use h2, which had some low severity vulns too. QUIC is supported via quinn, which apparently has a high severity soundness bug.
    Apparently, because that's the one bug I decided to take a look at. It seems to have been making some unjustified assumptions about the layout of some structs - it doesn't seem like it ever approached being exploitable, yet it was slapped with Attack Complexity: Low, Confidentiality Impact: High, CVSS 7.5. This makes me doubt the accuracy of the other severities.
    But, back to the point - since Rust developers seem to split their software up into much tinier pieces than C developers, I don't think it makes sense to just look at the advisories for a single crate.

    ...but I'm also not sure how interesting a better comparison would be. I think it's fairly obvious that, on the long term, a HTTP library written in a memory safe language with a solid type system will be more robust than one written in C.
    Projects "rejecting" Rust probably don't do so because they aren't convinced of the benefits of better languages, but because they don't like the tradeoffs made by Rust et al (see: sibling threads). Comparing vulnerability counts won't change their opinion.
