    Rust has substantially caught up in platform support. There's Rust for Haiku, QNX. There's Rust for 68k and AVR. It can target BPF and NVPTX. Thanks to Rust's GCC backend, people even got Rust running on Dreamcast. People managed to build Rust for Windows XP and even 95. The platforms that are left out now are really really niche bottom of the barrel.
    Push to x86 with AVX is not Rust's fault. Rust can build for OG Athlon and i686.
    Rust requires a supported platform to have 2 maintainers and ability to run tests in CI, so the platforms that are unsupported don't meet the bar - they're so niche that they can't find more than one person willing to do the work or find a still-working hardware that could be used in CI.
