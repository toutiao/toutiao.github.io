  content: "![](https://daniel.haxx.se/blog/wp-content/uploads/2023/09/old-machine.jpg)\n\nFor
    a long time we have received repeated requests for, or questions about, a curl
    rewrite in rust. Often as a joke, but also seriously.\n\n![](https://daniel.haxx.se/blog/wp-content/uploads/2026/11/orly-rewriting-curl-in-rust.png)\n_A
    joke from years ago_\n\nIn this modern world of AIs, we have only been waiting
    for someone to prove it possible and now it seems we don’t have to wait anymore.\n\nThis
    fall seems to be the time of the curl-in-rust takes as we first saw [urlx](https://github.com/jonwiggins/urlx)
    appear a few months ago, claimed to be _a memory-safe, from-scratch reimplementation
    of curl and libcurl_ and now in November [curl, rewritten in Rust](https://github.com/kov/curl)
    – _a rewrite of curl and libcurl in Rust_. This second one confusingly enough
    not even using a different name.\n\nThis latter one [claims to have spent 8,600
    USD](https://claude.ai/artifact/K4BoWt35HQz1xWZBR3bMRD) to make it happen.\n\n##
    Writing code once was never the issue\n\nWriting code _once_ was never the big
    deal with software and it still isn’t. Sure, it’s fascinating that you can make
    a set of agents accomplish this in only a few weeks but let’s face it: it could
    do this because all the AIs of the world have trained on curl code for years.
    curl is extremely well documented, there are hundreds of existing open source
    application using its API and there are thousands of test cases to verify the
    implementation.\n\nThe C code sits there and all the AI needs to do is convert
    it to rust, then polish until the tests work.\n\n![](https://daniel.haxx.se/blog/wp-content/uploads/2021/04/I-could-write-curl-in-a-3-day-weekend.png)\n_A
    know-it-all person’s comment from years ago_\n\n## curl is the result of time\n\ncurl
    has come to be what it is thanks to many decisions, lots of time, many users,
    oceans of feedback and many iterations. Sure, recreating what curl is at any specific
    single moment in time is certainly doable. Doable, because we have made a perfect
    specification for that project.\n\n## Behind already\n\nDuring the time these
    agents converted 185,000 lines of C code into 340,000 lines of Rust code (I counted),
    we merged over 300 commits in the actual curl project. We actually improved curl
    during these a little more than three weeks. A little over 200 bugfixes actually.
    200 bugfixes that none of those rust rewrites have. We also fixed a few vulnerabilities.
    In another month we have done another 200 and maybe fixed a few more vulnerabilities.
    Will these clones keep up?\n\nThe constant tweaking, fixing, improving and extending
    is what makes a software project live, what makes it attractive to users and what
    makes it able to compete with alternatives.\n\nThat fixing, and occasional new
    feature, is a direct result of a working community of users, contributors and
    maintainers. That goes way beyond the source code or which language that is used.\n\nA
    primary reason it is hard to make a competing curl alternative is because of the
    development speed, the development team and the community around curl. It is not
    because of the chosen language it is implemented in. Only curl can boast decades
    of ABI and API stability and prove that we know this and can do it well – over
    time. An alternative that pops up today might be able to do it as well, and _in
    a few decades we will know if they could_.\n\n## C\n\nI know I’m repeating myself
    but: out of the 81 vulnerabilities we have confirmed in curl so far during 2026,
    14 were the result of mistakes that most likely would have been avoided had we
    used a memory-safe language such as rust. That’s 17.3%.\n\nA Rust implementation
    of curl would thus still have had 67 of those vulnerabilities.\n\n## No rewrites\n\nI
    don’t believe in rewrites into any language. I believe in constant and never-ending
    polishing, iterating and refactoring.\n\n## Those rewrites\n\nI should add that
    I have not been in contact with any of the people behind these rewrites, and if
    there are two I bet there are more that I just haven’t seen yet. I only know of
    them because people have pasted me links to their repositories.\n\nI don’t know
    what they will do with those projects going forward. Are they anything more than
    proof of concepts? I presume we will find out.\n\nThey can of course follow along
    our commits and convert them to rust on the fly if they want – we only do about
    11 commits per day on average. Or maybe they ignore the bugreports or maybe they
    take their projects in other directions?\n\nI wish them good luck whatever they
    decide!\n\n## How do I feel about them?\n\nSeveral people asked me this.\n\n_Imitation
    is the sincerest form of flattery that mediocrity can pay to greatness_. / Someone\n\nI’m
    amused. A little puzzled. Fascinated. They spent their money and effort on _that?_\n\n##
    4 thoughts on “Actual curl rewrites in rust” \n\n### Leave a Reply \n\nThis site
    uses Akismet to reduce spam. [Learn how your comment data is processed.](https://akismet.com/privacy/)"
