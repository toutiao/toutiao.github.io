    As someone with various bits of old open hardware that still work (eg. OpenPandora, Cubox i4-Pro, Rowetel IP04, WRT54G, etc.), I certainly can sympathize but, at the same time, as someone who's burned out multiple times trying to live up to my own standards for my creations, who now uses Rust as a crutch to avoid doing that again, I also can't.
    I'd suggest keeping an eye on rustc_codegen_gcc (progress reports)... the project to write a GCC backend for rustc as an alternative to the existing LLVM one and the Cranelift one in development, the .NET CLR one that appears to be on hiatus early in its development, and the Microsoft-internal one they're using to integrate with the MSVC toolchain.
    I imagine that should solve your earmv5 problem unless you're saying you're depending on old GCC in the same way my retro-hobby programming depends on decades-old releases of relevant compilers, in which case I very much sympathize with your plight and don't sympathize with being expected to stay on languages that put the burden on me.
    (There's also an effort to write a second Rust compiler in C++ so it can be merged into GCC's upstream, but I imagine that'll mainly be for projects like the Linux kernel and I question how many crates and applications which depend on them will actively work to maintain compatibility, given that we see the same "one supported compiler per platform, and only a handful of officially supported platforms" dynamic in C and C++)

    One final thing worth noting is that number of rust dependencies needed for even basic tools is, well, rather large.

    Two things to keep in mind there:
    First, it's misleading to compare raw dependency counts. https://wiki.alopex.li/LetsBeRealAboutDependencies goes into more detail, but:

    Rust projects tend to reuse what C project would vendor or rewrite (See the Gotta go deeper section)
    Because Rust's unit of compilation is the crate, not the file, and that's historically complicated parallel compilation and incremental rebuilds, and because Rust's ABI is unstable so it doesn't have precompiled libraries to mitigate the build-time and link-time costs of bigger libraries, and because Cargo is much lower-friction than dependency solutions in the worlds of C and C++, people tend to break their Rust projects into smaller pieces.

    Second, it's generally not the number of dependencies needed, but the number of dependencies used.
    For example, Clap is a popular argument parser that I tend to use, despite it being the heaviest option, because all the lighter alternatives are missing one of automatic --help generation, a #[derive]-based API (code generation off an annotated struct), and support for handling non-UTF8-able paths instead of just panicking (ASSERT-ing).
    However, if you don't want all that and you don't mind omitting support for things like -rav short argument coalescing, --foo=.../--foo ... format variability, and all the other little things we've come to expect out of a well-behaving Unixoid argument parser these days, it's perfectly possible to very concisely write a bespoke argument parser using loop, match, and slice patterns.
