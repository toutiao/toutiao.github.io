    As a rewrite-in-anything-better-than-C guy I agree the platform support for Rust is obviously below C, but instead of saying "it doesn't affect me" I would rather pour more resources into expanding platform support, in an effort to rewrite the world away from C.

    I know I’m repeating myself but: out of the 81 vulnerabilities we have confirmed in curl so far during 2026, 14 were the result of mistakes that most likely would have been avoided had we used a memory-safe language such as rust. That’s 17.3%.
