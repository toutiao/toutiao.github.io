    I find the following statement highly misleading, and possibly misinformed about Rust:

    out of the 81 vulnerabilities we have confirmed in curl so far during 2026, 14 were the result of mistakes that most likely would have been avoided had we used a memory-safe language such as rust. That’s 17.3%.
    A Rust implementation of curl would thus still have had 67 of those vulnerabilities.

    It seems to imply that the only benefit of Rust is preventing pure-memory-safety bugs (buffer overflows, use-after-free), which completely ignores the main benefits of the language:

    rich type system: e.g. expressing state machines with exhaustive pattern matching, modeling generic APIs with traits,
    seamless error handling: how many C vulnerabilities caused by swapping 0 and 1 as the success code? Here's a recent one: https://framapiaf.org/@davidrevoy/117564332564963206 (https://sshhole.com/ vulnerability),
    rich linting system,
    careful APIs in the standard library,
    etc.

    But the most misleading part is taking AI slop rewrites of Curl as the benchmark. A good benchmark should be an established HTTP library in Rust, such as reqwest -- which according to the RustSec Advisory Database didn't ever have any reported vulnerability. Of course that's misleading too as this doesn't include transitive dependencies such as rustls (5 low/medium vulnerabilities this year). And there may be an issue of under-reporting of vulnerabilities and/or staffing of the RustSec project. But I'd say the comparison is at best inconclusive (I cannot tell if reqwest had more or less relevant vulnerabilities than Curl this year).
    What I'd really like to see is a deep dive comparison of a sample of these vulnerabilities: take 10-20 Curl vulnerabilities from this year, and for each one have a fair assessment of whether it would be prevented by the Rust compiler, avoided by idiomatic Rust (i.e. going beyond what the compiler outright rejects), and whether similar bugs have slipped through actual libraries like reqwest.
    Of course, one could also argue that reqwest isn't as feature complete as Curl (I haven't checked  -- my anecdotal evidence is that reqwest has been sufficient for my side projects). But that would be a very different story as it would become a choice/tradeoff between more features vs. less attack surface.
