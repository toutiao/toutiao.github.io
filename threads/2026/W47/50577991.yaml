    example: the page for each piece links to other related pieces: the ones nearby
    in space, and nearby in time. Scroll to the bottom of <a href="https:&#x2F;&#x2F;klauria.art&#x2F;piece&#x2F;2026-08-29-fossek-farm"
    rel="nofollow">https:&#x2F;&#x2F;klauria.art&#x2F;piece&#x2F;2026-08-29-fossek-farm</a>
    to see the timeline and map.<p>That’s also generated by the server-side code reading
    the json.<p>So the source data for the website is the json + image files, and
    the pages themselves are build artifacts generated from the source. Any time I
    edit something, what’s actually happening is some change to the json and maybe
    the images.<p>So yes, this could be a static site where every page is rebuilt
    on my machine. Then the server side code would just be sending bytes from disk.
    But I wanted a nice CRUD UI for editing stuff. Hence the little cache dance.'
