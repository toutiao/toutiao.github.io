  author: showcaseearth
  text: Lovely work!! On “Where did you paint this?”, I&#x27;ve gotten this myself
    as I&#x27;ve painted off and on over the years too, mostly landscapes. It&#x27;s
    what drove me to start a side project years ago to put art on the map (consolidate
    specific viewpoints, photo comparisons, streetview, historic maps, etc). As those
    things go, I never got beyond a crude app while life competed for resources. Picked
    it back up this year, hoping to &quot;launch&quot; a first version soon. Mostly
    historical stuff because that&#x27;s what&#x27;s openly available, but maybe someday
    it could be a tool for placing my own and other artists&#x27; contemporary work!<p>I
    approached the same “static for everyone, dynamic for me” need from a different
    angle. Instead of building my own editor, I use self hosted Grist instance with
    customized widgets. Publishing means building a versioned snapshot of the catalog
    and pointing a tiny current.json at it. Old versions never change, so they cache
    forever and nothing needs invalidating. Staging and production are just two pointers,
    and rolling back means pointing back at the previous version.
