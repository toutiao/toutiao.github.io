  author: staplung
  text: For the curious, the generalized process of reordering and potentially rotating
    pages so that when printed and folded (and optionally gathered into signatures)
    is called impositioning. There is specialized software with a variety of options
    that will do this for an input document.<p>Bookbinder JS is a nice web-based tool
    that will do this for you too, though I&#x27;m not sure it covers the exact folding
    algorithm described in this article.<p><a href="https:&#x2F;&#x2F;momijizukamori.github.io&#x2F;bookbinder-js&#x2F;"
    rel="nofollow">https:&#x2F;&#x2F;momijizukamori.github.io&#x2F;bookbinder-js&#x2F;</a>
