  author: compiler-guy
  text: Similarly, the term printers use for a sheet that has been printed after imposition
    is a &quot;signature&quot;. Sometimes called a &quot;sig&quot; for short.<p>The
    result of the imposition here would be considered an &quot;eight-up sig&quot;,
    because you get eight usable pages on one side.<p>Books and magazines are typically
    bound from several signatures.
  score: 0
  posted_at: '2026-11-19T19:58:36Z'
- id: '50565636'
  parent_id: '50559719'
  author: ggm
  text: 'Done properly, for a signature to work you need different in-page offsets
    from the binding point for the left and right faces of &quot;outside&quot; and
    the innermost &quot;inside and outside&quot; sheets: the thickness of the paper
    affects the folding and so affects the offset of the page edge from the actual
    paper edge after guillotineing.<p>I fell down this rabbit hole about 3 decades
    ago playing with the various postscript n-up tools, and looking at the outcome.
    I was working with an A3 printer and hitting alignment problems on 16 page signatures.
    I do not think I worked out how to fix it, other than heuristical sub-adjustments.<p>After
    8 pages, the bend radius difference is probably 1-2mm so it&#x27;s definitely
    visible.'
  score: 0
