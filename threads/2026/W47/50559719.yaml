  text: Its interesting, I worked as a TA in the early aughts helping teach what was
    an intro to anthropology class. When I allowed a double sided 4X6 notecard, students
    did reliably well. When you didn&#x27;t allow the &#x27;cheat sheet&#x27; I would
    still find scraps of paper that had notes on them after tests. A majority of the
