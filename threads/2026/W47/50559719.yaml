  author: meowvia
  text: 'A fixed words-per-page number is hard because it swings a lot with type size,
    leading, margins, and how many headings or images break up the text. At 10pt with
    normal margins, each A6-ish page in this layout holds roughly 180-220 words of
    plain prose, but that&#x27;s a rough guide, not a layout rule.<p>For the markdown
    editor idea, I&#x27;d find a per-section word count more useful than a single
    estimate: split the draft at headings, show the running count against the page
    it will land on, and flag sections that overflow. That way you keep the estimate
    tied to the actual text, and the preview stays honest when a heading or a short
    paragraph pushes content onto the next page.'
