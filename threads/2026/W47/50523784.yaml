  author: logicallee
  text: 'There are a few more requirements:<p>- You may no longer send mail pretending
    to be a real person or company that you&#x27;re not.<p>In the past, it was possible
    to set yourself as any sender. This is no longer allowed.<p>- You may no longer
    send out canvassing emails that purport to express a business interest, investor
    interest, collaboration, or job offer if you are not prepared to immediately follow
    through.<p>That means no more job spam and scams where you are in no way in any
    position or have any interest in hiring someone.<p>Likewise, you may no longer
    send fake investor spam that you&#x27;re interested in investing in someone, whereas
    in reality you have zero ability or interest in doing so.<p>Interfering with other
    people&#x27;s business relationships has always been a serious offense. It is
    now a criminal liability. If someone is doing business with someone else, reaching
    out, or starting to, you may not under threat of criminal liability in any way
    interfere with that relationship - not even through attempting to influence or
    manipulate the recipient.<p>Regarding blocking or screening of certain mail that
    could be legitimate but may be lower value than some other mail that is more important:
    currently there is no guidance that every single sent or received mail must go
    through 100% of the time. We value that there is a certain bar or threshold, because
    when there isn&#x27;t then it&#x27;s a hundred spam calls a day, a hundred spam
    emails, evverything is spam.<p>However, the advice is, therefore, when something
    is allowed through, then you should be prepared to allow it to progress naturally.
    It doesn&#x27;t make sense to carefully curate relationships and what gets through,
    only to stop them if the recipient attentively reads the curated feed and engages
    with the sender on the terms they&#x27;ve set.<p>I really hate when I take the
    time to respond to someone who reached out to me, and then my response goes to
    a black hole.<p>Thank you for improving the Internet and cutting down on spam
    and scams.'
  score: 0
