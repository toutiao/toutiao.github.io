  text: If your hoster doesn&#x27;t allow you to control the reverse DNS for your
    assigned IP space it&#x27;s not a serious hoster.
  score: 0
  posted_at: '2026-11-17T17:48:07Z'
- id: '50536840'
  parent_id: '50529448'
  author: wahern
  text: You can do zone delegation of smaller than &#x2F;24 subnets using CNAME RRs
    as part of the hack. See <a href="https:&#x2F;&#x2F;kb.isc.org&#x2F;docs&#x2F;aa-01589"
    rel="nofollow">https:&#x2F;&#x2F;kb.isc.org&#x2F;docs&#x2F;aa-01589</a> But for
    a single &#x2F;32 I guess the delegation is a pointless step and you should just
    CNAME straight to another remote record, unless there&#x27;s something special
    about keeping all PTR record names under the .arpa hierarchy. (I forget if that&#x27;s
    an issue.)
  score: 0
  posted_at: '2026-11-17T19:27:32Z'
- id: '50538699'
  parent_id: '50528864'
  author: elric
  text: 'The duopoly I&#x27;m referring to is Google&#x2F;MS: they are very much gatekeeping
    email. Spamhaus&#x27; requirements seem to be aimed at protecting Google and MS,
    instead of actually addressing 2026 spam, which is (as far as I can tell on my
    servers) typically not sent by amateur setups...'
  score: 0
  posted_at: '2026-11-17T21:49:04Z'
- id: '50539924'
  parent_id: '50524916'
  author: Denatonium
  text: My ISP blocks inbound TCP&#x2F;25 but inexplicably leave outbound TCP&#x2F;25
    open. I am free to send out spam, but I&#x27;m not permitted to receive any directly.
  score: 0
  posted_at: '2026-11-17T23:50:11Z'
- id: '50540817'
  parent_id: '50529794'
  author: bertmuir
  text: Spamhaus generally apply strict or higher-effort requirements to bulk senders.
    Requirements applied to everyone are either setup basics, or not really affecting
    sender reputation (like the latest changes here, for small&#x2F;personal installs,
    they might have a small impact on IP reputation but really don&#x27;t matter much
    from what I&#x27;ve seen of this roll out so far).
  score: 0
  posted_at: '2026-11-18T01:42:27Z'
- id: '50540878'
  parent_id: '50538699'
  author: bertmuir
  text: Ah gotcha. Don&#x27;t forget Yahoo, they seem intent on one-upping Google
    every time there&#x27;s a guideline change.<p>I have seen a lot of amateur setups
    compromised this year so figured the changes are trying to address that as a growing
    source of spam.
  score: 0
  posted_at: '2026-11-18T01:50:46Z'
- id: '50540985'
  parent_id: '50530623'
  author: bertmuir
  text: Didn&#x27;t mean to suggest they only care about bulk sender, just that small&#x2F;personal
    setups aren&#x27;t getting materially hit by these changes.<p>I do think it is
    true that Spamhaus overwhelmingly care about bulk senders though, and for the
    most part, care about smaller setups only at the moment they show bulk sender
    patterns. I get this idea from their docs and having spoken with them over the
    years. Do you see it another way?
  score: 0
  posted_at: '2026-11-18T02:08:12Z'
