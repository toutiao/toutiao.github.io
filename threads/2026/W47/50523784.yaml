  author: wahern
  text: Have you asked, yet, about a PTR record? Not every ISP has a DNS system tied
    into a web portal for automated edits. Even some large ISPs still manange their
    zones through traditional zone files. But that doesn&#x27;t mean they don&#x27;t
    support modifying PTR records for customers. It may be just a matter of you putting
    in a request and some greybeard sysadmin resolving the ticket by firing up vi
    or emacs to edit one of their zone files. This might even be preferable because
    it&#x27;s more likely they&#x27;d be open to delegating d.c.b.a.in-addr.arpa to
    your own DNS server. That would allow you to add and modify PTR records without
    having to go through them each time, whether manually or through some bespoke
    web service.
