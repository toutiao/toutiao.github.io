  author: edelbitter
  text: This is not why these techniques are useful, though. They reduce plausible
    deniability and laundering-by-mixing. Because once you connected your unique (domain)
    name to your stuff, there is no &quot;oh, it must have been that other customer
    that used that address before me&quot; excuse any more. If everyone plays nicely
    and identifies their systems unambiguously, the question of who is responsible
    is clear. And thus, the reaction after detected misbehavior can be immediate and
    decisive.
