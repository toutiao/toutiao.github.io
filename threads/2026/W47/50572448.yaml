  author: walterschnitzel
  text: 'Hi HN, I’m Martin. I built NovumSignals because I was curious what people
    were launching without making a big announcement. Every day I scan around 100,000
    newly observed domains, looking for sites where someone has built a product.<p>Finding
    a site is only the first step. I also track what happens afterward: a team publishes
    pricing, opens up its app, or starts hiring. You see this in Traction section.<p>One
    thing I’m still working on is telling a new startup from an existing company launching
    a product on a fresh domain. If you spot one I’ve classified incorrectly, I’d
    love to know what gave it away.'
  score: 0
