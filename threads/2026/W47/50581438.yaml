  author: cmiles8
  text: Nvidia appears to have dug itself a hole it’s not going to be able to get
    out of. The vendor financing games work until they don’t, then they backfire spectacularly.<p>They
    know if they show a quarterly decline, or even just a big growth slowdown, the
    AI valuation boom will implode and everyone will return to regularly scheduled
    programming. Valuations of all these AI gems, including Anthropic, would then
    see an 70-80+% haircut with standard valuations for growth companies.<p>So to
    avoid that they’ve been signing increasingly questionable funding deals and allegedly
    pushing folks to take delivery of chips they don’t need because data center construction
    is hitting massive snags. Hence too the reports of GPUs sitting in warehouses
    collecting dust. It appears this is now all coming to a head and the next 12 months
    will be very interesting.<p>Early moves such as all the “Jensen was actually kinda
    not a nice guy” articles hitting the press today suggest the strategy may be throw
    Jensen under the bus and use that to try and clean up this mess and reset the
    company. Get your popcorn ready. Some are already calling this “Jenron.”
