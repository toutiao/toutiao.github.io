  author: cmiles8
  text: Legitimate vendor financing is a thing and generally accepted as OK. For example
    a car company giving loans to credit-worthy folks to buy a car. Or leasing cars
    to folks via similar mechanisms. If the risk is managed properly it’s a nice profit
    center since now you get car revenue plus loan interest.<p>What Nvidia has been
    doing is closer to a car company finding a bunch of broke folks that will require
    a small miracle to pay back the loan, and financing cars for all them, then telling
    the market demand for cars if off the charts. If magically somehow these folks
    can generate cash to pay for it one gets away with it. If not, then you have a
    mini-2008 financial crisis unfolding on your balance sheet.
