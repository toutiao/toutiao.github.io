  text: "&gt; There&#x27;s no real problem being solved.<p>There actually is. Humans
    are notoriously sloppy in following mundane, boring compliance bullshit tasks,
    and noting down freezer temperatures is what I&#x27;d say very high up on the
    list of bullshit tasks that are so pointless they&#x27;re demeaning to the human
    who has to be the eyes for the machine.<p>Connecting the freezers to a central
    logging facility now needs no human checking the freezer every hour and writing
    down the temperature on a sheet of paper no one will ever read. It is precisely
    what machines are made for. And since compliance is now automatic instead of a
    strong incentive for the human to just invent &quot;valid&quot; data and be done,
    actual outages can now be spotted much faster."
