  author: dlor
  text: I also found this independently ahead of disclosure and reported it to Oracle
    last Friday. My harness found it after a fuzzing run and then turned it into a
    full RCE chain in the target app I was actually scanning.<p>The harness itself
    doesn&#x27;t run with Internet access and I confirmed it didn&#x27;t access this
    PR directly, but who knows if this was in the training set itself.<p>Either way,
    these simultaneous disclosures are incredibly common now. The Ruby issue affecting
    Gitlab was not only known about for 6 months, it was publicly fixed for 6 months
    before someone turned it into an RCE. The fix sat on the Ruby dev branch, and
    it was never pulled into an actual Ruby release until after Gitlab disclosed their
    own 10.0 vulnerability through it.<p>It&#x27;s very common for reporters to not
    realize the impact of a bug, models are very good at turning bugs into RCE chains,
    and the volume everywhere now means security teams are basically only focused
    on RCEs.
