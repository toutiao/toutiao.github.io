  author: pron
  text: I work on the JDK, and while I have no involvement with this issue, knowing
    how we work, what has likely happened is quite the opposite. Bugs don&#x27;t slip
    through our triage, and every bug that leads to a VM crash, especially in the
    compiler backend, is flagged for security review by the security research team;
    once that happens, no public communication is done. I don&#x27;t know this is
    what happened here, but it is the most likely thing to have happened.<p>We&#x27;re
    not talking any large open source project here. We&#x27;re talking about a project
    that, like Linux, runs much of the world&#x27;s software infrastructure, and even
    bugs that could <i>potentially</i> be vulnerabilities need to be handled with
    great care.
