  author: aftbit
  text: Securely networking electrical grids offers improvements in reliability, which
    translates directly to safety. If the power goes off on a hot summer afternoon,
    people die. Networking enables faults to be detected and resolved faster, reducing
    the amount of time that the system stays in dangerous conditions.<p>Similarly,
    (securely) networking water treatment plants enables people to remotely verify
    that settings are where they&#x27;re supposed to be and adjust them to match changing
    sample reports or intake conditions, reducing the risk of over-treating or under-treating
    the water, both of which can have safety consequences.<p>On top of that, networking
    enables much greater efficiency. Rather than having a person sitting at every
    substation ready to throw a breaker, or more likely, ready to drive there (taking
    time), you can have them sitting in a control room that monitors the whole grid
    at once.<p>Much of modern life would be much more expensive and much less safe
    without networking.<p>We really shouldn&#x27;t throw the baby out with the bathwater.
    It is possible to build secure systems. It takes a certain degree of paranoia
    and dedication that humans find difficult, and a willingness and ability to respond
    quickly to unknown threats, but that doesn&#x27;t make it impossible.
  score: 0
