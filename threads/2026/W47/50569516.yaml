  author: QuentinM
  text: I would have loved REPACK CONCURRENTLY when we were generating millions of
    dead tuples an hour on our trading database …<p>Sadly it doesn’t support partitions
    yet, which is typical when reaching sufficient scale that bloat management really
    matters. People often mention disk space when talking about dead tuples, but the
    real killer is what’s hidden under - bloat in the ctid &amp; btree leaf linked
    lists make every lookup feel like table scans…!<p>Thankfully HOT (Heap-only Tuples)
    has saved us since. Virtually no dead tulles generated, and they get otherwise
    collected during regular ops like SELECT, amortizing cost over time, and preventing
    dangerous build up.
