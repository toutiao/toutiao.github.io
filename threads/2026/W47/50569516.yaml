  author: jzelinskie
  text: 'I haven&#x27;t used these extensions, but I like the direction of being able
    to extend Postgres by tailing its own internals (pg_squeeze approach) than triggers
    (pg_repack).<p>We (the SpiceDB developers) took a similar approach to solve a
    different problem a few years ago: implementing strict serializability in Postgres[0].
    By hooking into the transactions layer themselves (pg_xact), we could layer on
    our own MVCC reusing the real Postgres transactions to compute visibility and
    total ordering. When you can just tail the Postgres internals, you don&#x27;t
    even need to implement a Postgres extension, which can keep it portable across
    locked-down, managed Postgres offerings.<p>Do folks know of other clever implementations
    of behavior by &quot;spying&quot; on the Postgres internals?<p>[0]: <a href="https:&#x2F;&#x2F;m.youtube.com&#x2F;watch?v=_f6fHy4DWWM"
    rel="nofollow">https:&#x2F;&#x2F;m.youtube.com&#x2F;watch?v=_f6fHy4DWWM</a>'
