  author: fractorial
  text: As much as I wanted to say you’re wrong, you’re right. After reading TFA,
    the security boundary is not sound.<p>Wanting agents to act like you is wrong.
    You need to own that trust boundary. Build whatever tooling satisfies the contract
    that agents should have a “not”+&lt;you&gt; (or &lt;you&gt;+”-agent”) identity,
    and you actuate across that boundary explicitly.<p>For example, I have a second
    agent GitHub account that points at my human one. That allows me to write a trusted
    proxy that ACLs its identity tightly.<p>It cannot write to public repos ever.
    In the worst possible case, it externalizes to a private repo’s issue tracker.
    (Still has never happened in ~4 months)<p>Once you have this, you can let agents
    run free. But, it isn’t trivial to set up. Moreover, people don’t want to “do
    the work.”<p>All this assumes you abide by “never run untrusted agents on trusted
    hardware.”
