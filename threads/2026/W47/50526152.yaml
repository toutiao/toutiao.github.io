    does not do the interpretation, the most it can do is specify the reason for what
    it&#x27;s doing.<p>KeyContain will <i>deterministically</i> look at your request,
    if it&#x27;s on the list of built-in services it supports, and tell you what that
    request is doing in human language. And you can always inspect the raw request.
