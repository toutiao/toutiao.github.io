  author: TeMPOraL
  text: Many security professionals are the source of most nonsensical concepts, because
    they&#x27;re still approaching LLMs as if it was classical software that can be
    secured with enough hard, provable-in-abstract boundaries. This leads to nonsensical
    proposals (talking about W^X or &quot;control&#x2F;data plane separation&quot;,
    treating prompt injection as SQL injection, &quot;if only more effort was spent
    on securing it&quot;...), or proposals that defeat the entire value of LLMs (&quot;lethal
    trifecta&quot; framework is a breeding ground for such).<p>Truth is, LLMs are
    &quot;little people on a chip&quot; - they&#x27;re valuable exactly <i>because</i>
    they do <i>not</i> have any kind of &quot;control&#x2F;data&quot; separation (for
    fundamental reasons, reality doesn&#x27;t have such separation either), and that
    lets them handle &quot;people-shaped&quot; tasks that are infeasible to script.
    Flip side, they&#x27;re causing &quot;people-shaped&quot; problems and are vulnerable
    to same kinds of attacks people are, and need to be thought of accordingly.
  score: 0
  posted_at: '2026-11-17T09:38:04Z'
- id: '50529377'
  parent_id: '50526935'
  author: TeMPOraL
  text: So does not being paranoid.<p>What is your exact threat model for sharing
    your picture and name online? What wrong things do you expect to happen if your
    journal or psychiatry notes were to be read by ChatGPT?<p>The whole world went
    online over two decades ago, we&#x27;ve all lived with these risks for that long
    or more, so <i>we have the data</i> - and the data says, normies got the trade-offs
    roughly right by prioritizing convenience and expediency. Most of privacy discussion
    is just modern form of superstition.<p>There are certain occupations and groups
    of people that have legitimate needs for extra precautions, but those are <i>tiny</i>
    segments of the population - if you don&#x27;t already know you&#x27;re special
