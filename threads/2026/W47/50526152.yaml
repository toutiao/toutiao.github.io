  author: saagarjha
  text: Sure, my view on this is more or less that often the setup that creates this
    kind of situation often allows the agent to effectively mint a new key anyway.
    For example, if you have my browser cookie or something I may not want my agent
    to leak this on the web, but if I use it to authenticate network requests to the
    service transparently the model can just go into the account page and change my
    password or something, then leak that. In general it is not safe to hand an agent
    access to a service which is designed for human interaction and assume that it
    was properly secured such that persistent, transferrable access is not something
    that can be generated.
