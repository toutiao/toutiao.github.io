  author: saagarjha
  text: What I do on my machine is I basically do not allow for local exec at all,
    except in some very specific scenarios where I carefully design the environment
    and make sure that it seems reasonable before handing it to the agent. For example,
    I have a specific profiling task that requires performance counters. Normally
    my agents can spin up VMs to run commands without my permission but in this case
    the counters are not exposed in the VM, which basically means that this must be
    run outside of the VM. In this case I have configured my setup to be that the
    agent is allowed to write to a binary at a specific location, and I approve of
    it running one command (in this case, without my supervision even) that is basically
    xctrace sandbox-exec [very restrictive handwritten profile] [this binary]. In
    this way, it can run code on my machine and get the metrics it wants, but it can&#x27;t
    go &quot;oh let me write a program to go and poke around the host machine&quot;
    which it is prone to doing if you don&#x27;t restrict it this way.<p>I guess what
    I have done is the exact opposite in that I have designed an environment for agents
    and then I am using it as a hammer to solve all my problems, I have had almost
    exactly the same problem as you and the the way I typically solve it is that I
    have persistent SSH connections already supported in my harness, and I can arbitrarily
    expose whatever I want into the &quot;agent environment&quot; (which doesn&#x27;t
    necessarily need to even have an agent living there), and this environment is
    able to connect to the place that doesn&#x27;t have the credentials, and then
    I can set up a way for reverse access to work with this tunnel.
