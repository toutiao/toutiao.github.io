  parent_id: '50536905'
  author: tsergiu
  text: "&quot;intercept&quot; is too strong because we are not at the network layer.
    Your agent has to choose to use our service. But in practice, the only key in
    the agent&#x27;s environment is the keycontain one, so yes, it has no other way
    to get to any service except through keycontain. And yes we whitelist specific
    paths&#x2F;params (completely configurable), and you decide the level of risk
    you&#x27;re willing to take.<p>For low-risk operations, you can just give your
    agent free access. For high risk ones (as defined by your deterministic acls),
    you can require it to confirm with you before allowing the request through.<p>And
    for any of the built-in services keycontain supports, it will give you a (deterministic)
    plain English explanation of what the request will do. For anything not built
    in, you have to manually inspect the raw request."
