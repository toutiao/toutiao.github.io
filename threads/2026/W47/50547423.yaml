  text: 'I hope anyone using nginx should know that &#x27;nginx -s reload&#x27; reloads
    only config. And you don&#x27;t necessarily need to restart - nginx can be upgraded
    gracefully without breaking existing connections: <a href="https:&#x2F;&#x2F;nginx.org&#x2F;en&#x2F;docs&#x2F;control.html#upgrade"
    rel="nofollow">https:&#x2F;&#x2F;nginx.org&#x2F;en&#x2F;docs&#x2F;control.html#upgrade</a>
