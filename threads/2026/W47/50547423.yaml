  author: patryk_builds
  text: 'The most useful line on the page for operators is easy to miss: after updating,
    `nginx -s reload` does not load the new binary, you need a restart. I&#x27;d expect
    a fair number of hosts to be &quot;patched&quot; on disk and still running the
    old worker for weeks.<p>The other one is the caveat about version strings. Distro
    packages and container images backport fixes without changing the version, so
    `nginx -v` can&#x27;t confirm exposure or safety by itself. For anyone pinning
    an image tag like nginx:1.27-alpine, the question is whether that tag was rebuilt,
    and the only way to know is to pull again and compare digests.<p>On the 98.9%
    figure: the page is careful to call it version prevalence, which I appreciate.
    But the fourth condition in your checklist, external h2 negotiation, is measurable
    from outside with an ALPN probe. Did you run that against the same Shodan set?
    The share of affected-version hosts that actually negotiate h2 on a public port
    would be a much better estimate of real exposure.<p>I checked my own small server
    after reading this and it turned out not to matter, since the proxy in front is
    Caddy. What it did show me is that I couldn&#x27;t have answered &quot;which proxy,
    which version, is h2 on&quot; from memory, and that&#x27;s probably the common
    case for small deployments.'
