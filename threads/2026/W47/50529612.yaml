  author: ben_w
  text: 'Quite possibly. But, a thought I had some years back:<p>In the future when
    AI is able to do everything, there will not be one single super-AI that does it
    all, but a whole ecosystem of different AI. This is the same as how in the biological
    world, while there are various degrees of generalists, there&#x27;s no single
    cell, plant, or animal which does absolutely everything. If our body needs more
    blood, it makes more blood cells, it doesn&#x27;t repurpose intestine or skin
    for the task.<p>Similar argument in economics, comparative advantage: an AI which
    can do everything is best used for the things which only it and no other AI can
    do, and leaving to other (smaller, cheaper) AI relatively simple tasks like face
    recognition.<p>Even where AI can do this, that doesn&#x27;t mean the best solution
    is AI rather than a traditional API.'
