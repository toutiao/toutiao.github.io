  author: xnorswap
  text: |-
    It&#x27;s not the per-run costs I worry about, it&#x27;s the costs of churn.<p>As soon as Oracle Tests fail, the LLM has three options:<p>1. Rewrite the test - This undoes the benefit of the test in the first place
     2. Implement workarounds and quirks to match the oracle, often at the expense of recreating buggy behaviour
     3. Implement both corrected behaviour and quirks-mode behaviour to meet the oracle, raise further jobs to formalise the switch over and change of behaviour.<p>( And this &quot;change of behaviour&quot; might be a few pixels out of place! Or it could be a much more significant change. When trying to meet a goal, LLMs will often treat these with the same zeal. )<p>If you&#x27;re working interactively, you can catch it and steer it to what&#x27;s best for the feature. If you&#x27;re fully automating development, then you&#x27;re at the mercy of whatever the model does at that moment.<p>Oracle-based testing has its place, but I don&#x27;t think it&#x27;s good for large scale automated testing.<p>Also, you&#x27;re talking about $500&#x2F;release 2-3 times a week. That&#x27;s fine, that&#x27;s less than the cost of an employee.<p>Anthropic and others are talking about how to scale to merge 2000-3000 PRs per week.<p>At that scale, that cost per merge is $6M&#x2F;month, surely a cost you&#x27;d want to minimise if you can cut them by half with better type-checking, static analysis, and other cheap deterministic tests, even if that&#x27;s still a small cost of the whole project.<p>If nothing else, it&#x27;s pure waste. Our planet is (mostly metaphorically) burning, and I believe that more efficient IT processes and development practices would go a long way to helping mitigate some of that.
