  author: iacguy
  text: |-
    Big fans of OpenHands.<p>The main difference from our pov is that OpenHands is an agent with its own harness. We’re unopinionated on the harness and more focused on the infrastructure it runs in. In fact we started as one of the first “persistent” sandbox providers [1].
    OpenComputer runs the user’s Claude Code or Codex (you pick per thread), and you can bring your own ChatGPT&#x2F;Codex subscription.<p>Our focus is predominantly on building high perf specialised infra for cloud coding agents. eg: each Slack thread gets its own rootless Podman container, with state written to local disk and then persisted to a git backed store. That’s why it feels like Claude Code on your laptop: in our benchmark it opened PRs 3.3x faster than Devin, with first push in 24s vs a 62s average across the 4 most popular cloud agents [2]. It&#x27;s also cheaper at at scale, we&#x27;ve found, than an ephemeral sandbox per session [3].<p>[1] <a href="https:&#x2F;&#x2F;x.com&#x2F;utpalnadiger&#x2F;status&#x2F;2047436177016537251" rel="nofollow">https:&#x2F;&#x2F;x.com&#x2F;utpalnadiger&#x2F;status&#x2F;2047436177016537251</a>
