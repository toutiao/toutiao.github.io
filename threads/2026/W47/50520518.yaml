  author: toomanyrichies
  text: '“Heat” is one of my favorite films, but it’s interesting to see how it evolved.
    The 1981-85 window Mann’s lawsuit hinges on starts right when “Thief” came out,
    and watching them back to back, it’s easy to believe he was already writing Heat.<p>Frank
    (James Caan) and Neil McCauley live by the same rule: don’t get attached to anything
    you can’t walk away from.  Both break it by wanting a normal life anyway.  Frank
    has his wallet collage of a wife, kid, and house, and Neil has Eady.<p>The father-figure
    is there too. Leo (Robert Prosky) tells him &quot;I&#x27;ll be your father&quot;,
    and then treats him like property.  In Heat, Nate (Jon Voight) does Leo’s job
    but stays loyal, and the betrayal goes to Van Zant.  And oof, Willie Nelson was
    such a good get as Okla.<p>Both characters end with the main character dropping
    his rule for revenge. Frank burns down his house and business to go after Leo.
    Neil is on the way to the airport with Eady and doubles back to kill Waingro.<p>In
    between there’s L.A. Takedown, which is essentially the Heat script cut to 90
    minutes for an NBC pilot.  It even has most of the same character names- Vincent
    Hanna, Michael Cerrito, Chris Sheherlis, Lou Casals, Bosco, Kelso, etc.  They
    even cast Xander Berkeley, aka the guy in Heat who Hanna catches his wife sleeping
    with, as fucking <i>Waingro</i>!  The latter is more comical than anything [1].  There&#x27;s
    no Waingro like Kevin Gage.<p>And LA is as much a character in Heat as Miami was
    in Miami Vice, except instead of pastels it’s huge, empty at night, and everybody
    lives alone in it. Mann did the same thing with Chicago in Thief.<p>I&#x27;m really
    <i>not</i> looking forward to the sequel.  I read the book, and it was mediocre
    at best.  The whole thing feels like a cash-grab, and it&#x27;s annoying that
