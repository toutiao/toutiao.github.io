  author: gamblor956
  text: 'The issue, in a nutshell:<p>- US copyright law allows an author to terminate
    a copyright after 35 years...unless it was a &quot;work made for hire&quot; because
    then legally the &quot;author&quot; is the company that hired you, and this allowance
    is only granted to <i>individual</i> authors (meaning, actual humans, not solo
    authors).<p>- Mann wrote the script for his own &quot;loan-out company&quot; which
    is an arrangement common in entertainment (film and music both). The talent works
    for the loan-out company, and the loan-out company is who signs the contracts
    with movie producers, etc. This means that legally, script was a &quot;work for
    hire&quot; and the loan-out company is the author, so the 35-year termination
    allowance doesn&#x27;t apply. Courts have ruled consistently on this point.<p>-
    In order to win, Mann needs to prove that he wrote Heat before he formed his loan-out
    company, or else that he wrote it on spec and granted the rights to his own loan-out
    company. The problem is that he has no documentation of either, and moreover the
    WB screenplay purchase paperwork for Heat includes representations signed by Mann
    that the work was written as a work for hire.<p>- Mann is now claiming that he
    actually wrote Heat before he formed the loan-out company, and granted the rights
    to it after he finished it. The catch: there was no written grant, just allegedly
    an oral grant from himself...to himself...<p>In the past, Mann would have no chance
    of winning this case. But Trump appointed several hundred MAGA judges to the federal
    bench who don&#x27;t understand basic legal concepts so well and so it&#x27;s
    a tossup as to how this case will actually turn out.'
