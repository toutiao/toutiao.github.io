    and Login.gov could not because of a willful decision to deceive partner agencies
    about the capability.<p>&gt; Our evaluation found GSA misled their customer agencies
    when GSA failed to communicate Login.gov’s known noncompliance with the National
    Institute of Standards and Technology (NIST) Special Publication (SP) 800-63-3,
