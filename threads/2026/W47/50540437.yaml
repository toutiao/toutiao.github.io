article:
  url: https://consumerrights.wiki/w/ID.me_terms_required_for_IRS_sign-in
  title: ID.me terms required for IRS sign-in - Consumer Rights Wiki
  fetch_status: success
  content: |-
    From Consumer Rights Wiki

    Taxpayers who sign in to [Internal Revenue Service](https://en.wikipedia.org/wiki/Internal_Revenue_Service "wikipedia:Internal Revenue Service") (IRS) online services with [ID.me](/w/ID.me "ID.me"), a private-sector sign-in provider, use it under ID.me's own Terms of Service, which send disputes outside small claims court to a neutral arbitrator instead of a judge or jury unless the user opts out within 30 days of accepting them. ID.me's Privacy Policy says it "may use information for marketing purposes" & may transfer information in a sale, merger or other corporate transaction, though it says information from state or federal government identity verification is not used for marketing for ID.me Shop, its shopping-discount site, unless the user consents or meets another listed exception.

    [Login.gov](https://en.wikipedia.org/wiki/Login.gov "wikipedia:Login.gov"), which the U.S. government maintains, also works for IRS sign-in, & the IRS's Direct Pay service takes bank-account tax payments with "No sign-in required". ID.me replaced the traditional login for [Treasury](https://en.wikipedia.org/wiki/United_States_Department_of_the_Treasury "wikipedia:United States Department of the Treasury")'s savings-bond site [TreasuryDirect](https://en.wikipedia.org/wiki/TreasuryDirect "wikipedia:TreasuryDirect") on October 28, 2026, & on October 29, 2026 senators [Ron Wyden](https://en.wikipedia.org/wiki/Ron_Wyden "wikipedia:Ron Wyden") & [Elizabeth Warren](https://en.wikipedia.org/wiki/Elizabeth_Warren "wikipedia:Elizabeth Warren") asked Treasury & the IRS to explain why they continue to use ID.me "instead of the government-run Login.gov platform".

    ## Background
    [[edit](/index.php?title=ID.me_terms_required_for_IRS_sign-in&veaction=edit&section=1 "Edit section: Background") | [edit source](/index.php?title=ID.me_terms_required_for_IRS_sign-in&action=edit&section=1 "Edit section's source code: Background")]

    The IRS describes ID.me as "a private sector sign-in provider for secure access to government and non-government websites". ID.me's Terms of Service say the company provides "a level of assurance to businesses and government agencies" that a user's identity and attributes are verified "based upon widely-recognized standards", & that "ID.me does not charge members any fees for registering and/or using the Service or Website."

    The IRS sign-in page says taxpayers "need an ID.me or Login.gov account" to access tax information online. The IRS says it uses these sign-in providers "to protect your privacy and data through identity verification". One account covers the IRS online services: "Individual Online Account, Business Tax Account, Tax Pro Account, e‑Services and more". ID.me's Privacy Policy says some partners, "such as the IRS", may require identity verification "to a higher level of certainty" under [National Institute of Standards and Technology](https://en.wikipedia.org/wiki/National_Institute_of_Standards_and_Technology "wikipedia:National Institute of Standards and Technology") guidelines.

    Treasury's savings-bond site TreasuryDirect says it uses ID.me because it "aligns with Treasury security requirements and those used by the Internal Revenue Service". The IRS said on December 7, 2021 that it was "using ID.me to provide verification services". It announced on February 7, 2022 that it would "transition away from using a third-party service for facial recognition", & said on February 21, 2022 that taxpayers could still choose biometric verification "through ID.me’s self-assistance tool".

    ## Acceptance screen and continued-use rule
    [[edit](/index.php?title=ID.me_terms_required_for_IRS_sign-in&veaction=edit&section=2 "Edit section: Acceptance screen and continued-use rule") | [edit source](/index.php?title=ID.me_terms_required_for_IRS_sign-in&action=edit&section=2 "Edit section's source code: Acceptance screen and continued-use rule")]

    A user accepts ID.me's [Terms of Service](/w/Terms_of_service "Terms of service"), with the Credential Policy made available at that time, by selecting "I agree" or "taking another affirmative action clearly identified as acceptance when these Terms are presented to you". The Terms say ID.me's Credential Policy "gives further details of how we accomplish our identity proofing". The Terms say the company keeps a wallet for each user "that contains your identity and group affiliation information". ID.me's personal-information obligations are governed "at all times" by the Credential Policy & Privacy Policy.

    A taxpayer emailed consumer advocate Louis Rossmann a screenshot of the "UPDATED TERMS & CONDITIONS" screen the taxpayer said they saw while signing in to IRS.gov through ID.me, showing ID.me & IRS logos and one button, "Accept Terms & Continue".

    ID.me's Privacy Policy dated November 2, 2026 says by using the platform "you agree that ID.me. determines how personal information may be used" for the user's wallet. The policy's May 7, 2026 text lacked it.

    The current Terms, Version 10.1.0 dated November 13, 2026, count continued use after revised Terms take effect as "acceptance of those changes", "Unless we expressly state otherwise"; a user who disagrees may stop using the Service & close the wallet first. Version 10.0.3, dated March 3, 2023, said continuing use after notice "will indicate your agreement to all changes", "Unless otherwise noted by us". The Credential Policy, Version 10.1, published July 1, 2024, requires users to reaffirm acceptance of "the prevailing Terms of Service, Privacy and other Policies and any other required agreements" "at least once every 5 years" or face credential suspension.

    Public radio program _[Marketplace](https://en.wikipedia.org/wiki/Marketplace_(radio_program) "wikipedia:Marketplace (radio program)")_ reported that Nancy Kim, a professor emerita at Illinois Tech's Chicago-Kent College of Law, said she found nothing reassuring in ID.me's terms, pointing out that although they state ID.me won't sell data, ID.me can change them.

    ## Privacy policy and terms clauses
    [[edit](/index.php?title=ID.me_terms_required_for_IRS_sign-in&veaction=edit&section=3 "Edit section: Privacy policy and terms clauses") | [edit source](/index.php?title=ID.me_terms_required_for_IRS_sign-in&action=edit&section=3 "Edit section's source code: Privacy policy and terms clauses")]

    ### Marketing use
    [[edit](/index.php?title=ID.me_terms_required_for_IRS_sign-in&veaction=edit&section=4 "Edit section: Marketing use") | [edit source](/index.php?title=ID.me_terms_required_for_IRS_sign-in&action=edit&section=4 "Edit section's source code: Marketing use")]

    ID.me's Privacy Policy says:

    > We may use information for marketing purposes. We may use your information to send promotional messages and newsletters via email, or otherwise alert you to products or Services we think might be of interest to you, including for ID.me Shop.

    ID.me Shop, a page of deals & discounts, says it "is part of the Amazon Associates program and other affiliate programs" & "may earn money when you buy products through links on Shop".

    ### Corporate transactions
    [[edit](/index.php?title=ID.me_terms_required_for_IRS_sign-in&veaction=edit&section=5 "Edit section: Corporate transactions") | [edit source](/index.php?title=ID.me_terms_required_for_IRS_sign-in&action=edit&section=5 "Edit section's source code: Corporate transactions")]

    The policy also says:

    > We may share your information in connection with a corporate transaction. We may disclose or transfer your information as part of, or during negotiations for, any purchase, sale, lease, merger, or any other type of acquisition, disposal, or financing involving our brands.

    ### Arbitration and class-action waiver
    [[edit](/index.php?title=ID.me_terms_required_for_IRS_sign-in&veaction=edit&section=6 "Edit section: Arbitration and class-action waiver") | [edit source](/index.php?title=ID.me_terms_required_for_IRS_sign-in&action=edit&section=6 "Edit section's source code
