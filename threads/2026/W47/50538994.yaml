  text: Have you not been following these particular disputes? The issue is that sports
    broadcasters want <i>real-time</i> DNS blocking. The thing France is building
    an internet censorship regime over right now is <i>tennis matches</i>.<p>As for
    the age of copyright, what does that matter? Copyright is man-made instrument
    with a particular purpose. It has been and continues to be useful, indirectly,
    for advancing some public interests. It has also generated some very powerful
    stakeholders who have proven quite able to bend government for the purpose of
    their own further entrenchment. But the relative value of copyright as an instrument
    to other public goods is neither fixed nor determined in any way by the age of
