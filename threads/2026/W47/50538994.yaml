  author: microtonal
  text: I did use usenet, P2P, etc. in the day and as far as I can see this is not
    the reason at all.<p>In the early days, the local lobby&#x2F;legal organizations
    did pretty much immediately jump on peer-to-peer sharing and Usenet (I remember
    the Dutch Brein writing diatribes about copyright violation in the early 00s),
    but it was harder to enforce for various reasons. One of them being that local
    copyright laws were not really updated for the internet yet. Just to give an example,
    the Dutch law stated that you are able to make private copies of books, albums,
    etc. that you borrow (e.g. borrowing a book at the library and then copying it).
    This led to the legal interpretation that downloading copyrighted works from the
    internet was legal, only uploading wasn&#x27;t. I took until 2014 until this interpretation
    was changed.<p>Aside from that, it was hard for copyright enforcement organizations
    to identify &#x27;pirates&#x27;. Some ISPs fought having to give away private
    customer data nail and tooth.<p><i>The early-internet era was dominated by American
    media companies and culture.</i><p>This is really so factually wrong. This is
    the internet now. In the 90s and early 00s local media&#x2F;internet companies
    were <i>a lot</i> more dominant in Europe. E.g. in The Netherlands &#x27;De Digitale
    Stad&#x27; (a website where you could meet other people, build your own website)
    etc. were extremely popular in the 90s. Everybody was on the Dutch social network
    Hyves until the late 00s&#x2F;early 10s. I know it&#x27;s the same in other European
    countries (e.g. Germany had StudieVZ, etc.). The American internet hegemony really
    started at the mid to end 00s with Facebook, Youtube, etc.
