  author: gerdesj
  text: 'Quite.  The public DNS is absolutely the wrong way to go about this.  However
    there is nothing wrong with fiddling with DNS &quot;internally&quot; - that&#x27;s
    a different issue.<p>It&#x27;s all about truth and messaging.<p>DNS tells you
    where something is, no more and no less.  When queried, it points to the map and
    says: &quot;It&#x27;s there, off you trot&quot;.  DNS does not care what <i>is</i>
    there, it is just a guide.<p>DNS works over port 53&#x2F;udp+tcp and could be
    fiddled with in transit.  There is a variety of DNS called DNSSEC which, with
    care, can be trusted to be accurate (for your given value of accurate).<p>Messaging:  As
    I said, port 53&#x2F;udp+tcp could be fiddled with if DNSSEC is not in play.  There
    is also DNS over HTTPS or DoH.  Now the messaging channel is encrypted.  At this
    point you have the same confidence in security as you do when looking at https
    web sites.<p>Now, you can obviously use DoH DNS from anywhere in the world and
    it will look like ordinary web traffic.  Most browsers are already doing this.<p>Messing
    with DNS now in Europe is basically fiddling whilst Rome burns - bloody stupid
    and couterproductive.  Hamstringing a service such as Quad9 is at best ridiculous.'
  score: 0
