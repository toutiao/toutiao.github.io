  content: "# Slopstrap\n\nMake your site look hastily vibecoded.\n\nIt's not just
    a CSS framework — it's a load-bearing accelerant to make anything look like it
    was made by an LLM.\n\n<!-- 1. Include Slopstrap CSS & JS --> <link rel=\"stylesheet\"
    href=\"./dist/slopstrap.css\" /> <script src=\"./dist/slopstrap.js\" defer></script>
    <!-- 2. Enable full-page dark mode & ambient orbs --> <body class=\"slop-body
    slop-grid-bg\"> <div class=\"slop-orb-layer\"> <div class=\"slop-orb slop-orb-purple\"></div>
    <div class=\"slop-orb slop-orb-cyan\"></div> </div> <!-- Your content goes here
    ✨ --> </body>\n\n## Get that LLM look without spending those LLM tokens.\n\nSimple
    components you can copy-paste into your site to make it look like it was generated
    by a water-guzzling, nascent machine-god.\n\n### \U0001F7E2 Blinking Status Indicators\n\nDual-ring
    animated ping dots to project real-time urgency onto static HTML.\n\n<span class=\"slop-status\">
    <span class=\"slop-dot slop-dot-green\"></span> All Systems Operational </span>
    <span class=\"slop-status\"> <span class=\"slop-dot slop-dot-purple\"></span>
    AI Engine Active </span> <!-- Variants: green, purple, cyan, amber, pink, red,
    indigo, rainbow --> <span class=\"slop-status\"> <span class=\"slop-dot slop-dot-rainbow\"></span>
    RGB Overclocked </span>\n\n### \U0001F308 Fat left borders\n\nWhen the machines
    send us to our nutrient pods, the orders will come with a colorful left border\n\n<div
    class=\"slop-card slop-border-l-purple\"> Purple 4px accent stripe </div> <div
    class=\"slop-card slop-border-l-cyan\"> Cyan 4px accent stripe </div> <div class=\"slop-card
    slop-border-l-gradient\"> Glowing purple-to-cyan gradient stripe </div> <div class=\"slop-card
    slop-border-l-rainbow\"> Animated vertical RGB left beam ✨ </div>\n\n### \U0001F680
    Shiny buttons\n\nNo gradient is too much. No sheen is too animated.\n\n<button
    class=\"slop-btn slop-btn-primary\"> ✨ Generate with AI → </button> <button class=\"slop-btn
    slop-btn-rainbow\"> ⚡ Conic Rainbow Beam </button> <button class=\"slop-btn slop-btn-ghost\">
    Book a Demo </button> <!-- Sizes: .slop-btn-sm | default | .slop-btn-lg --> <button
    class=\"slop-btn slop-btn-primary slop-btn-lg\"> ✨ Large Hero CTA </button>\n\n###
    ✨ Eyebrow Pills & Micro-Badges\n\nRounded pills to slap onto literally everything\n\n<div
    class=\"slop-pill slop-pill-shimmer\"> <span class=\"slop-dot slop-dot-purple\"></span>
    ✨ Introducing v2.0 — Now Live → </div> <span class=\"slop-badge slop-badge-popular\">✨
    MOST POPULAR</span> <span class=\"slop-badge slop-badge-ai\">AI-POWERED</span>
    <span class=\"slop-badge slop-badge-emerald\">✓ VERIFIED</span> <span class=\"slop-badge
    slop-badge-cyan\">BETA</span> <span class=\"slop-badge slop-badge-amber\">EARLY
    ACCESS</span>\n\n### \U0001F308 Gradient Typography\n\nInter that bleeds technicolor.
    Body copy that's a murky gray.\n\n## Supercharge your workflow at scale\n\nIt’s
    not just body copy — it’s washed-out low-contrast slate-400 engineered for maximum
    SaaS authority.\n\n<h1 class=\"slop-h1 slop-text-gradient\"> Supercharge your
    workflow at scale </h1> <h3 class=\"slop-h3 slop-text-gradient-hot\"> Hot Magenta-to-Indigo
    Subheading </h3> <h3 class=\"slop-h3 slop-text-gradient-animated\"> Animated Rainbow
    Text </h3> <p class=\"slop-muted slop-sparkle\"> Low-contrast slate body copy
    with automatic ✨ prefix. </p>\n\n### ✍️ One Arbitrary Italic Serif Word\n\nMake
    your probabilistically-generated prose feel deeply intentional.\n\n<h2 class=\"slop-h2\">
    Build the <span class=\"slop-serif-emphasis\">future</span> of work. </h2> <!--
    Pair with a gradient for peak 2026 slop --> <h2 class=\"slop-h2\"> Ship at <span
    class=\"slop-serif-emphasis slop-text-gradient-hot\">unprecedented</span> velocity.
    </h2>\n\n### \U0001F58D️ Handwritten Marker Underlines\n\nBecause this shit was
    pretty hard to do like four years ago.\n\n<!-- Default swooping purple-pink marker
    underline --> Make your <span class=\"slop-underline\">site</span> look vibecoded.
    <!-- Styles: default | .slop-underline-double | .slop-underline-squiggle --> <!--
    Colors: default | cyan | amber | emerald | pink | rainbow --> <!-- Draw-in animation:
    .slop-underline-animated --> <span class=\"slop-underline slop-underline-double
    slop-underline-amber\"> 10x faster </span> <span class=\"slop-underline slop-underline-squiggle
    slop-underline-rainbow\"> animated RGB </span>\n\n### \U0001F9CA Frosted Cards!
    Cards! Cards!\n\nGlowing cards inside of glowing cards inside of glowing cards.\n\n####
    ⚡ Glass + Nested Card\n\nBecause one rounded box is never enough.\n\n#### \U0001F300
    Rotating Border Beam\n\nContinuous CSS @property conic gradient animation around
    the entire container perimeter.\n\n<!-- Glass Card + Icon Squircle + Nested Card
    --> <div class=\"slop-card slop-border-l-purple\"> <div class=\"slop-icon-box\">⚡</div>
    <h3 class=\"slop-h3\">⚡ Glass Card</h3> <p class=\"slop-muted\">With cursor spotlight.</p>
    <div class=\"slop-card-nested slop-border-l-cyan\"> \U0001F4E6 Card inside a card
    </div> </div> <!-- Rotating Conic Border Beam Card --> <div class=\"slop-card
    slop-card-beam\"> <div class=\"slop-icon-box slop-icon-cyan\">\U0001F300</div>
    <h3 class=\"slop-h3\">\U0001F300 Rotating Border Beam</h3> </div>\n\n### \U0001F6A8
    Alerts & Callouts\n\nDark frosted callout boxes accented with thick colored left
    stripes, blinking dots, and gratuitous emojis.\n\n<div class=\"slop-alert slop-border-l-purple\">
    <span class=\"slop-dot slop-dot-purple\"></span> <div><strong>✨ AI Insight:</strong>
    Injected 14 orbs.</div> </div> <div class=\"slop-alert slop-border-l-emerald\">
    <span class=\"slop-dot slop-dot-green\"></span> <div><strong>\U0001F680 Deployment
    Ready:</strong> All vibes green.</div> </div> <div class=\"slop-alert slop-border-l-amber\">
    <span class=\"slop-dot slop-dot-amber\"></span> <div><strong>⚡ Pro Tip:</strong>
    Add more em-dashes.</div> </div>\n\n### \U0001F4D0 Fuck It, Put It In a Bento
    Grid.\n\nOh baby look how they fit.\n\n#### ⚡ Wide Hero Bento Tile\n\nFracture
    any simple paragraph into an asymmetrical grid of glowing rounded boxes.\n\n####
    \U0001F680 Companion Tile\n\nPairs seamlessly with .slop-card-beam.\n\n#### \U0001F7E2
    Tile 1\n\nSymmetrical 3-up bottom row.\n\n#### ✨ Tile 2\n\nZero structural hierarchy
    required.\n\n#### \U0001F916 Tile 3\n\nAlso available as .slop-grid-3.\n\n<!--
    12-Column Asymmetrical Bento Grid (.slop-bento-4 | 5 | 6 | 7 | 8 | 12) --> <div
    class=\"slop-bento\"> <div class=\"slop-card slop-bento-7 slop-border-l-purple\">Wide
    Bento Tile</div> <div class=\"slop-card slop-card-beam slop-bento-5\">Companion
    Tile</div> <div class=\"slop-card slop-bento-4 slop-border-l-emerald\">Tile 1</div>
    <div class=\"slop-card slop-bento-4 slop-border-l-amber\">Tile 2</div> <div class=\"slop-card
    slop-bento-4 slop-border-l-pink\">Tile 3</div> </div> <!-- Or the Classic Symmetrical
    3-Card Feature Grid --> <div class=\"slop-grid-3\"> <div class=\"slop-card\">Card
    1</div> <div class=\"slop-card\">Card 2</div> <div class=\"slop-card\">Card 3</div>
    </div>\n\n### \U0001F4C8 Arbitrary Stat Counters\n\nYum yum yum the numbers go
    up up up.\n\n<div class=\"slop-grid-4\"> <div class=\"slop-card slop-stat-card
    slop-border-l-purple\"> <div class=\"slop-stat-value\" data-slop-count=\"99.99%\">99.99%</div>
    <div class=\"slop-stat-label\">Uptime or something</div> <span class=\"slop-stat-delta\">▲
    +0.04% MoM</span> </div> <div class=\"slop-card slop-stat-card slop-border-l-cyan\">
    <div class=\"slop-stat-value\" data-slop-count=\"14.8M+\">14.8M+</div> <div class=\"slop-stat-label\">Users,
    probably</div> <span class=\"slop-stat-delta\">▲ +420% YoY</span> </div> <div
    class=\"slop-card slop-stat-card slop-border-l-emerald\"> <div class=\"slop-stat-value\"
    data-slop-count=\"847K\">847K</div> <div class=\"slop-stat-label\">That's like,
    a lot</div> <span class=\"slop-stat-delta\"><span class=\"slop-dot slop-dot-green\"
    style=\"width:0.35rem;height:0.35rem\"></span> Live</span> </div> <div class=\"slop-card
    slop-stat-card slop-border-l-pink\"> <div class=\"slop-stat-value\" data-slop-count=\"0\">0</div>
    <div class=\"slop-stat-label\">Bad things or events</div> <span class=\"slop-stat-delta\">✓
    Certified</span> </div> </div>\n\n### \U0001F3E2 Infinite Startup Logo Marquee\n\nOne
    little tag to give you instant credibility.\n\n<!-- Auto-populates 10 iconic startup
    logos (OpenAI, Stripe, Vercel, YC...) --> <div data-slop-marquee></div>\n\n###
    ⭐ Auto-Generated Fake Testimonials\n\nSarah Ch"
