  text: 'I discovered Rationalist writings around the same time, and Overcoming Bias
    further back than that, and was initially enamored. But the more I read the less
    enamored I became. I was put off by a number of what I might call &quot;thought
    smells.&quot;<p>TL;DR: Know the quality of a tree by its fruit, and I am not impressed
    by the fruit, and TBH I thought the tree smelled funny anyway.<p>One thought smell
    was the way writers would assert premises as if they were axiomatic when they
    were not and proceed to reason from them to a conclusion without checking the
    result empirically. This is more like medieval Scholasticism than science. Of
    course heavier objects fall faster than lighter objects! Why bother doing the
    experiment? Isn&#x27;t it obvious?<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Scholasticism"
    rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Scholasticism</a><p>There&#x27;s
    a reason science is obsessed with taking small steps and doing a lot of observations
    and experiments, and relegating anything not so confirmed to the realm of speculation
    or hypothesis (a more precise and testable speculation). Science does this even
    if the math or reasoning look pretty because we&#x27;ve learned that it&#x27;s
    very easy to make mistakes in either reasoning or more often selection of premises
    and other inputs. A precise tree of reasoning fails if a single input is wrong.
    Any programmer knows this.<p>I think Rationalism is sort of a neo-Scholasticism,
    not in the specific sense of trying to reconcile ancient thought with Catholicism
    (though there&#x27;s a weird neo-Catholic strain in there somewhere) but in the
    sense of believing in reasoning from asserted truth to correct outcome. &quot;I
    am smart and my assertions feel right so I&#x27;m correct.&quot;<p>Another was
    a constant odor of biological determinism, crypto-racism, and IQ elitism. I don&#x27;t
    even consider myself a &quot;woke leftist&quot; per se. I dislike these things
    because I legitimately think they&#x27;re either wrong or irrelevant as the case
    may be. I don&#x27;t think it&#x27;s a coincidence that neoreaction and similar
    things emerged from these circles. (Yes I&#x27;m aware that many today disavow
    those things.) The soil was fertile.<p>Same with Longtermism which is just a rebrand
    of utilitarianism. I can make a solid Rational(tm) argument that killing everyone
    with a disability or a measured IQ below, say, 80, would improve long term utilitarian
    outcomes for the human race and would have a high probability of reducing suffering
    in the long term. I&#x27;m absolutely certain I could write a convincing Rationalist-style
    essay on this. Ready to push the button? There&#x27;s a reason this kind of pure
    utilitarian thought has a poor reputation in actual ethics circles.<p>Combine
    Scholastic-style &quot;sterile reasoning&quot; (reasoning without empirical feedback)
    with utilitarianism and weird absolutist reasoning processes and I don&#x27;t
    think that leads to a good place.<p>Lastly, there was this constant smell of what
    I now call &quot;intellectual edgelording.&quot; The way to win points seemed
    to be to assert something controversial (monarchism is good, actually!) and then
    show off your superior intellect by arguing that it&#x27;s good actually, and
    of course it also means that you are brave and free-thinking enough to look at
    it and everyone else is just a coward. It&#x27;s a good way to look smart via
    the same mechanism that makes shitty music sound more deep and profound to a 14
    year old if the musicians claim to worship the devil.<p>Forgive me for not taking
    absolute assertions of P(doom) combined with &quot;and we are the only ones who
    can save you, but that means we must control this hugely profitable powerful technology
    and ban open models and independent research for your own good&quot; very seriously
    when they come from this crowd.'
