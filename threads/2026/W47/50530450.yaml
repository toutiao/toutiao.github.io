    == Anthropic equity, the donated stake, and the accounts that pay Coefficient's grants == Claim: Anthropic's Series H release (May 28 2026) names Jane Street and D.E. Shaw Ventures among the investors; individual amounts are not disclosed. Why it matters: Fixes the Series H investor list that the panel and the $965B valuation rest on, and shows the firm-level Jane Street link to the lab whose staff METR names as donors. Source: [anthropic.com/news/series-h](https://www.anthropic.com/news/series-h)Claim: Forbes (Nov 7 2025, Phoebe Liu) put the Moskovitz–Tuna Anthropic stake at "an estimated $500 million". Why it matters: The only published dollar estimate of the donated stake; it is the left bar of the chart and the '$500M' in the title. Source: [forbes.com.au/news/billionai…](https://www.forbes.com.au/news/billionaires/this-billionaire-couple-has-a-plan-to-give-away-a-20-billion-facebook-fortune/)Claim: Forbes, quoting Cari Tuna: the stake "was moved into a nonprofit vehicle in early 2025" to "dispel any perception of conflict of interest". The vehicle is not named. Why it matters: Establishes that the stake was donated in early 2025 and that Tuna gave conflict-of-interest as the reason; the vehicle is unnamed, which is the question the rest of the stakes rows try to close. Source: [forbes.com.au/news/billionai…](https://www.forbes.com.au/news/billionaires/this-billionaire-couple-has-a-plan-to-give-away-a-20-billion-facebook-fortune/)Claim: Jaan Tallinn told Postimees (Feb 2026) that he is an Anthropic board observer rather than a director. Why it matters: Tallinn, METR's other large early funder through SFF, is an Anthropic board observer by his own account; the figure says 'observer', never 'director'. Source: [majandus.postimees.ee/841860…](https://majandus.postimees.ee/8418603/tabel-jaan-tallinna-osalusega-anthropicu-vaartus-on-nuud-enam-kui-kolmandik-triljonit)Claim: Forbes reports that Eric Schmidt's family office, Hillspire, bought 20% of D.E. Shaw & Co.; Schmidt's Forbes profile does not mention Anthropic. Why it matters: Links Schmidt, a Series A investor and METR supporter through Schmidt Sciences, to D.E. Shaw, whose venture arm joined Series H; the figure uses Forbes' exact 20%. Source: [forbes.com/profile/eric-schm…](https://www.forbes.com/profile/eric-schmidt/)Claim: An
