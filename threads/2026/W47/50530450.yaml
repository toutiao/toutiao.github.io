  author: api
  text: I would never argue that the odds of bad AI outcomes is zero. It’s a powerful
    technology and thus a large lever. I agree that I’m far more concerned with humans
    doing bad things with AI than sentient autonomous AI.<p>I don’t rank “doom” very
    high though. Bad things? Sure. But good things too. Big lever.<p>The huge issue
    I have with the safety crowd, especially this one, is that one of the scenarios
    I fear the most and also think is realistic is monopolization. I’m afraid of what
    happens if small numbers of people and governments completely monopolize powerful
    AI and then use it as a force multiplier to become kings of the world more or
    less.<p>My kids living under enhanced AI augmented absolute god kings is IMO a
    “doom” scenario almost on par with mass death.<p>This isn’t as far fetched as
    the other scenarios because we already know for a fact that humans behave this
    way. We have tons of historical examples. Even if they start benevolent, absolute
    power distorts the human mind and tends to make people lose touch with reality
    and lose empathy.<p>The safety measures the safetyists advocate — banning open
    models, regulating training, forcing research through gates they control — are
    precisely the measures most likely to lead to this outcome.
