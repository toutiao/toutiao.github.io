  author: SillyUsername
  text: MCP servers to me seems like a dead man walking technology and I don&#x27;t
    understand the point of it.<p>It adds security but...<p>- adds a single service
    which is another attack surface that can be compromised.<p>- adds another system
    that requires maintenance and securing to prevent compromise.<p>- takes machine
    resources<p>- duplicates a subset of what can easily be harness functionality<p>-
    duplicates services and security (usually) of existing APIs, or adds another layer
    on top.<p>Whereas ultimately an AI harness<p>- will improve and optimise its own
    skills performing the same MCP functions<p>- can use plugins<p>- can have harness
    centralised (common) security controls and behaviours<p>MCP becomes a false economy
    for our current AI implementations, it&#x27;s real purpose seems to be a crutch
    for small models that struggle to write their own skills that use existing APIs.
    The thing is this is a problem that is rapidly disappearing, but could also be
    performed by secured harness plugins.
