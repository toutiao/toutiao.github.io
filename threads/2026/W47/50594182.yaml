  text: "&gt; You can also use enumeration, which theoretically is complete (if you
    have infinite time and compute) [...] it should be possible to have a complete
    ordering of a type, which gives you the enumeration (some very clever PL person
    is going to pull out an example that makes me wrong here, please do so I can add
    a small note on it, or better write the note for me and I&#x27;ll just insert
    it here).<p>There&#x27;s no note to write; by referencing infinity you are theoretically
    correct. There is a practical problem with the argument when we don&#x27;t invoke
    infinity but that&#x27;s a separate issue.<p>Just to be clear there are multiple
    sizes of infinity and you are claiming that the size of the data types that we
    use in computation is the smallest of these, the &quot;countable&quot; infinity
    (the same infinity as the counting numbers 1, 2, 3, ... and the fractions 0&#x2F;1,
    1&#x2F;1, 1&#x2F;2, 2&#x2F;1, ...).<p>However, one countably infinite set is the
    set of all bytestrings: the first is the zero-length one, the second is the length-1
    bytestring containing a null byte, the third is the length-1 bytestring containing
    0x1, [...] the 257&#x27;th one is the length-1 bytestring containing 0xFF, the
    258th one is the length-2 bytestring containing 0x00 0x00, and so on.<p>All realizable
    data structures in your computer program are realizable because there&#x27;s a
    chunk of computer code that realizes them; compiling them (or bundling them with
    an interpreter, if they&#x27;re in an interpreted language) converts those numbers
    to a bytestring, so there&#x27;s a surjection from the infinity of bytestrings
    to the realizable data structures. All that needs to be proven is that there&#x27;s
    an infinity of realizable data structures, which honestly depends on your programming
    language and computation model -- technically a JavaScript string needs to be
    shorter than 2⁵³ - 1 UTF-16 code-points, so it&#x27;s not a strictly infinite
    structure, and if your pointers have 64-bit addresses then your memory model is
    imposing a finite size on pointer-constructed data structures too: but the point
    is that if you remove all of these constraints and graduate to an infinite memory
    model with infinite numbers of pointers, as long as you don&#x27;t introduce uncountable
    infinities on the way, then you get a bijection by the Cantor-Bernstein theorem
    and the number of data structures is a countable infinity.<p>Edit: forgot to complete
    the thought; on the other hand there is a <i>practical</i> problem because the
    number of bytes you have to generate to cover all bytestrings of length <i>n</i>
    scales as <i>n</i> × 256ⁿ which for all bytestrings of length 6 is already 1.5
    petabytes, even if you reduce it down to printable ASCII strings that only gets
    you about 20% more reachable length, so length-7 printable ASCII is 0.5 petabytes
    when enumerated. Or for comparison with an hour of Markov searching on my RTX
    4070 I can get hashcat to break an 8-character pronounceable password, as the
    limit of what I can test within the bounds of a testing setup with a highly optimized
    character-generation pipeline.<p>Meanwhile the bugs that you run into are in weird
    claims in a 400-byte JWT token or numbers that go over your precision limits when
    decoded from a 1KB JSON payload or a 10KB config file with duplicated keys that
    parses one way from this pipeline and a different way from some other pipeline,
    or a 10MB file blowing past some internal buffering limit and switching you from
    synchronous processing to streaming processing. 7 bytes ain&#x27;t gonna cut it."
