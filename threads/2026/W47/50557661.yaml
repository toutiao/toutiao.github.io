  author: vlovich123
  text: You are correct, compression doesn’t help reduce a model. That’s why quantization
    is inherently a lossy operation although there’s tricks to limit the perceived
    loss. That’s the only way to further compress the data.<p>One way to think about
    it is that if the weights were compressible, it’s a clear signal that better training
    could make the model smarter as there’s redundant information in the structure
    that could be used to store other meaning.<p>The other challenge with compressing
    weights of course is that you have to decompress them before you do math with
    them. Dequantizing weights is significantly cheaper and supports random access
    too (not that that matters too much but it helps in terms of leveraging SIMD techniques
    to do it in an embarrassingly parallel way)
