  author: mzhaase
  text: 'Zram vs Zswap: <a href="https:&#x2F;&#x2F;chrisdown.name&#x2F;2026&#x2F;03&#x2F;24&#x2F;zswap-vs-zram-when-to-use-what.html"
    rel="nofollow">https:&#x2F;&#x2F;chrisdown.name&#x2F;2026&#x2F;03&#x2F;24&#x2F;zswap-vs-zram-when-to-use-...</a><p>&gt;
    If in doubt, prefer to use zswap. Only use zram if you have a highly specific
    reason to.<p>&gt; In terms of architecture:<p>&gt; zswap sits in front of your
    disk swap, compresses pages in RAM, and automatically tiers cold data to disk.
    It integrates directly with the kernel&#x27;s memory management and distributes
    pressure gracefully.<p>&gt; zram is a compressed RAM block device with a hard
    capacity limit. When you put swap on it and it fills up, there is no automatic
    eviction, and the kernel has very little leverage to do anything about the situation.
    The system either OOMs or falls back to lower-priority swap, causing LRU inversion
    (see below). It only really makes sense for extremely memory-constrained embedded
    systems, diskless setups, or cases with specific security requirements around
    keeping private data off persistent storage. Swap on zram is also increasingly
    unsupported upstream.'
