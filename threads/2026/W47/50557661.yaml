  author: throw-qqqqq
  text: The max theoretical ratio of (byte-independent) compression can be approximated
    using the Shannon entropy.<p>Most quantized GGUFs have a very high Shannon entropy,
    so are almost perfectly compressed already. A Q4_K_M quantization is often around
    +7.90 bits&#x2F;byte and so is virtually incompressible.<p>Unquantized models
    (F16) are often around +7bits&#x2F;byte for comparison.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Shannon%27s_source_coding_theorem"
