  author: nukanse
  text: For a programmer, on many cases, it pays to compress the data, to improve
    RAM IO, because the alu may already be doing nothing meanwhile waiting for the
    data from ram, so you can use that time to decompress, process, compress, and
    store the result. A lot of code today is bottlenecked by IO. You spend a lot of
    effort optimizing with SIMD, processing the data super fast, and then the speed
    it&#x27;s wssted because there is not enough bandwidth to even send the result
    to ram. Modern cpu should include more hardware support for memory compression
  score: 0
