  author: cestith
  text: In most cases you&#x27;ll really want zswap rather than zram anyway.<p>There
    are plenty of scenarios in which servers are run with only nominal swap sizes
    or none at all and systems don&#x27;t run out of RAM.<p>Let me size my hypervisor
    cluster to demand and let the system decide where to place the guests. If the
    hypervisors are crashing due to full RAM, that&#x27;s down to planning or budget
    issues and not a reason to put additional unpredictable latency underneath the
    guests.<p>Let me size my SDI to UDP TS video streaming servers to the number and
    size of streams they&#x27;ll service. There&#x27;s not much in their memory pages
    that&#x27;s going to ever be idle enough to compress, so why boot the kernel configured
    to do that? It&#x27;s just risking extra packet IAT for buying not much benefit.<p>But
    in general, yes, <i>zswap</i> would be a good thing compared to swapping to a
    drive, unless you are mostly swapping things that are really truly idle a long
    time. Default swappiness on a lot of distros is around 60 by the way, and on servers
    it&#x27;s often set closer to 10 or 15.
