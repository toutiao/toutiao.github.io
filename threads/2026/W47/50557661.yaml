  author: acchow
  text: I&#x27;m learning about this now. Apparently it&#x27;s not as simple as comparing
    decompression speeds vs memory bandwidth.<p>Compression happens in 16KB pages.
    But memory reads can be 64-byte or 128-byte lines. So from a compressed page,
    the CPU cannot directly read a line from memory.<p>So to read even a single 8-byte
    line, the kernel will page fault, allocate a fresh 16KB page, decompress the entire
    16KB page into it, update the page tables, flush the TLB, then resume execution.
