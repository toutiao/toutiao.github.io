  author: RulerOf
  text: "&gt; As long as it terminates in WiFi or a standard Ethernet connector and
    passes IP traffic at the rate I paid for, I personally don&#x27;t care what the
    physical infrastructure beyond the demarc is.<p>I get that attitude, but coax
    connections are fragile in a way that fiber is not. Water infiltration, bad crimping
    jobs, unterminated ends in the neighbor&#x27;s house all cause signal degradation
    that is extremely time and labor intensive to identify and fix.<p>Cable is an
    excellent solution for distributing broadcast analog radio signals over a private
    line cheaply and efficiently, but two-way digital signals over the same medium
    aren&#x27;t as robust as their fiber-based counterpart.<p>ISP outages are one
    thing, but if you ever experience service degradation—and not a full outage, but
    tear-your-hair-out crap like &quot;my internet goes down for 15 seconds once every
    16 hours with no discernible pattern&quot;—and it ends up being some particularly
    coax-flavored problem, you&#x27;ll understand what I&#x27;m talking about."
