  author: martinald
  text: Well firstly, DOCSIS is becoming an increasingly niche technology, and niche
    technology in telecoms means expensive. There are probably 10,000x more (XGS)G-PON
    CPEs being manufactured than DOCSIS4.0 ones. I assume similar scale for PON headend
    equipment.<p>Secondly, PON basically has no powered equipment outside the &#x27;exchange&#x27;,
    which can serve 30k+ customers. DOCSIS requires loads of powered equipment, amplifiers,
    CMTS etc. This then costs money to power (and in high temps, cool) and more importantly
    breaks down more often. DOCSIS4.0 requires a lot of upgrades to the &#x27;last
    mile&#x27; part so most telcos have decided to just go the whole way and replace
    with PON instead of doing all that work and getting none of the operational cost
    savings.<p>The issue is the faster you push DOCSIS the more it shows up any problems
    in your last mile setup.
  score: 0
