  author: jiggawatts
  text: 'I have a &quot;fringe&quot; theoretical physics idea[1] that I&#x27;ve been
    grinding through various frontier models to see how far they can push this kind
    of thing. It&#x27;s a great test because it is sufficiently &quot;out there&quot;
    that they can&#x27;t memorise the answer, and it has absolutely brutal mathematics.<p>A
    simple cross-check is to get two models to advance the paper, and then have the
    other model validate it.<p>All of the Gemini 4 models -- including Neon -- consistently
    make simple, &quot;doofus&quot; errors like neglecting minus signs or doubling
    a scalar factor due to accidentally multiplying by it twice. Similarly, they often
    use two different sets of assumptions for a long mathematical argument involving
    multiple proofs, so the whole argument ends up invalid.<p>For comparison, these
    basic errors no longer occur with any of the recent Anthropic or OpenAI models,
    including every GPT 6 Sol or Astra model that I&#x27;ve tested.<p>Simply put,
    if you let Astra do 5-10 iterations in a row (~1 hour of work) and feed it to
    Gemini 4 Neon, it won&#x27;t spot any errors. Do the reverse of that and even
    GPT 6.2 Sol will tear Neon&#x27;s work to pieces.<p>PS: I suspect that Gemini
    models have a higher temperature setting, which makes their English sound more
    natural, but introduces errors that degrade their hard science capability.<p>[1]
    But not <i>crank</i> physics, which I would expect to &quot;trip up&quot; models
    trained on correct, valid physics and mathematics.'
