  author: postalcoder
  text: 'I don’t think anyone who have yet commented has used the actual model. But,
    to be fair to the commenters, google has made it very hard for them to do so without
    spending a ton of money.<p>Neon is a really good model. It’s currently my favorite
    model to use. Coding-wise, it’s equivalent to Opus 5.5&#x2F;Fable. Documentation-wise,
    it is great. If you have access to Neon have it take a crack at simplifying your
    agents.md. It’s the first model I’ve run that criticized the amount of ceremony
    in my instructions and suggested solid simplifications. It also makes clean edits
    to documents without leaving scars of the previous verbiage behind.<p>Art-wise,
    it’s more capable, in my experience, than Fable. I’ve been using fable&#x2F;opus
    heavily to make art assets for my application (I shared in a previous comment
    that procedural art has completely obviated gpt-image art for me) and I’ve started
    to run into a wall with how far I could iterate with fable. I had neon take a
    crack at the assets I struggled to improve and it did a grand job.<p>In terms
    of working together with a model and how it communicates to you, <i>I love this
    model</i>. The model knows how to clearly communicate to you. It is such a breath
    of fresh air over Opus and Fable which, despite the improvements, I feel is actively
    trying to damage my brain with its unnatural prose. It&#x27;s hard to describe
    how it feels to have a model that you feel respects your time and energy with
    proper writing, and the subsequent delight that arises from the feeling of wanting
    to engage in smaller details again.<p>Neon has a big model smell, but the miracle
    and irony is it’s <i>supposedly</i> based on a smaller base model than Carbon.
    On google’s model page, they previously wrote that Neon shares the same base model
    as Hydrogen! It is thought that Argon and Carbon share the same base model.<p>My
    impressions will probably change as I use this for longer than a day, but my initial
    impression is: I don’t know how google pulled this off.'
