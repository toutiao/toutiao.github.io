  author: jiggawatts
  text: 'A variant of the notion that the standard model of physics is &quot;simply&quot;
    the property of some high-dimensional algebra. For example, Cohl Furey proposed
    a few different variations of the Octonions such as the dual-Octonions and I believe
    most recently the Dixon algebra ℂ ⊗ ℍ ⊗ O. There are other groups investigating
    Lie algebras related to E8 and the like.<p>The idea is that the Standard Model
    is <i>soooo</i> close to a nice and neat algebra that it may just be possible
    that it simply &quot;pops out&quot; of one naturally. All of particle physics
    might just be a very simple mathematical rule, instead of a whole pile of things
    on top of other things that looks suspiciously like epicycles.<p>There&#x27;s
    a &quot;search&quot; by theoreticians for the equivalent algebraic change in perspective
    that Galileo did when he moved astronomy from overly complex 2D mathematics to
    a far simpler 3D algebra.<p>I have several notions that now -- thanks to AI --
    I can throw at the proverbial wall to see if they stick.<p>The one that I&#x27;ve
    been playing around with the longest is a real geometric  algebra with a total
    of nine dimensions: three temporal, three spatial, and three nilpotent (&quot;matter&quot;).
    I also sprinkled on some of my preferred postulates, such as making the theory
    MWI-flavoured, fully relational (no absolute clocks or rulers), etc.<p>I knew
    it <i>probably</i> wouldn&#x27;t work, but this algebra has an incredibly beautiful
    symmetry of three-by-three <i>and</i> it is &quot;just&quot; big enough to encompass
    the SM particle zoo including the three particle generations!<p>The idea was that
    the three temporal dimensions <i>might</i> explain the &quot;many worlds&quot;
    aspects of quantum mechanics.<p>It <i>almoooost</i> worked!<p>I got it to the
    point that all three frontier AIs agreed that it&#x27;s publication-worthy and
    one particular branch was &quot;ahead&quot; of Cohl Furey&#x27;s favored algebra,
    but... meh... it&#x27;s (provably) a dead end. Not to mention that everyone and
    their dog will be doing the same kind of thing with their <i>own</i> toy theory,
    so nobody will be interested in yet more AI slop output unless it makes a dramatic
    discovery.<p>Despite the dead end it was worth a go, especially given that trying
    is effectively free: I usually burn tokens on this right before using a &quot;reset&quot;
    that&#x27;s about to expire.'
  score: 0
