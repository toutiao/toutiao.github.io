    One nice pattern that has shown up for me a few times is that you can reuse the options struct for things that build upon what it's for. e.g. CopyString uses the same options struct as PushSize and just passes it through to the raw function.
    My only real gripe, and it's admittedly small, is that when compiling with gcc you need to globally disable -Woverride-init since gcc doesn't support surrounding the options parameter with pragmas like clang does. https://gcc.gnu.org/bugzilla/show_bug.cgi?id=60875
