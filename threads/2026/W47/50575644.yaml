  author: PaulHoule
  text: The poor adoption of PWAs is part of that disease.<p>I mean,  Web Workers
    is something only Google could love.  They could have provided an API that would
    let you give commands to the cache layer of the browser and it would have the
    speed and reliability of native code behind it and if the system wants to evict
    one piece of data from the cache to deal with storage pressure...  it can.  Instead
    they invented a Rube Goldberg machine which doesn&#x27;t really do anything and
    you have to write another Rube Goldberg machine inside the first Rube Goldberg
    to get &quot;offline operation as a service.&quot;  And you&#x27;ve got to deal
    with all the async programming difficulties and unreliability and I know for years
    all the storage operations you could back it with are awful.<p>Like I&#x27;m the
    guy who signs off on the ticket being done and I&#x27;ve been the guy who answers
    the pager when it goes off in 2 in the morning and even when I&#x27;m getting
    a stage demo ready for somebody who has the improv acting and stage magic skills
    to make a 20% done app look like... magic I have to get that 20% functionality
    working 100% in some certain sense and the Web Workers API screams &quot;you&#x27;re
    going to mess around with this forever and it&#x27;s never really going to work
    right&quot; whether the product is under or over baked or just right.<p>So the
    discussion about PWAs is another one of those discussions that SV has with itself
    without involving the other 99% of software developers and web users.  Google
    might have had a lot more luck pushing it had they involved a focus group of people
    in Minnesota or Dublin somewhere.<p>And of course that 1&#x2F;3-baked notifications
    API just raises my hackles,  like the first thing I am going to do with a new
    web browser is turn it off.  I mean,  every web site is already trying to spam
    me every way it can possibly spam me,  the last things I need are another pop-up
    menu that covers content,  another dialogue of any kind to close,  and the possibility
    that I&#x27;ll click the wrong button and get spammed.<p>(And in the &quot;iOS
