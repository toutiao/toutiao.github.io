  author: chaosharmonic
  text: I don&#x27;t disagree with you, but that goes both ways here too.<p>Chrome
    isn&#x27;t exclusive to one platform, and conversely Android doesn&#x27;t <i>force</i>
    you to use it across the entire operating system.<p>If Chrome is forcing Web standards
    even in places where no one wants them, the equal and opposite problem is that
    Safari has a long history of holding back Web standards that are inconvenient
    to them, and making the entire industry bend around them because their users don&#x27;t
    have the option to just install something else.<p>Part of the problem is actually
    that Apple also won&#x27;t <i>really</i> compete here. They want the vertically-integrated
    everything, and so WebKit everywhere other than their devices is a second class
    citizen. The support for its underlying stack anywhere else -- from Linux-based
    browsers like GNOME Web to runtimes like Bun using JavaScriptCore -- has come
    pretty much entirely from third parties, and there doesn&#x27;t really seem to
    be any sort of toolkit analogous to the CEF that could be used to embed it into
    other applications.<p>If anything, the only viable effort to make WebKit available
    across platforms was Chrome.
