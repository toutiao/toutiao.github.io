  text: "&gt; scope isn&#x27;t just a generic SBC with an ADC attached, it&#x27;s
    a huge amount of fully custom analog and digital circuitry that you need to work
    with,<p>Oscilloscopes are an interesting target for projects like this because
    a lot of the difficult low level work is cleanly separated from the UI. It’s in
    the FPGA bitstream or signal processing code that might be completely separate
    from the UI.<p>The UI app isn’t exactly trivial because handling large volumes
    of data at high speed on limited hardware never is, but it doesn’t require reimplementing
    the entire firmware stack of the scope.<p>That’s what makes me optimistic about
    these projects. There is a lot of room to fix the UI and make it expandable by
    the community."
