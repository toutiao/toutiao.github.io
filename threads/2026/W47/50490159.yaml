article:
  url: https://www.eevblog.com/forum/testgear/oos-an-open-operating-system-for-the-rigol-scopes/
  title: OOS - an open operating system for the Rigol Scopes - Page 1
  fetch_status: success
  content: "TITLE: OOS - an open operating system for the Rigol DHO800/DHO900 (Linux
    6.12 + Rust)  \n  \n**OOS: an open operating system for the Rigol DHO800/DHO900**
    \ \n  \nOOS replaces the software of a DHO800/DHO900 with a **Linux 6.12 kernel**
    and a **new scope application written in Rust**. It runs from the scope's own
    SD card, **next to the stock system** , and you can switch back at any time. Source,
    releases and guides: [github.com/dekajoule/oos](https://github.com/dekajoule/oos)
    (GPL).  \n  \n\n| ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/channels.png)
    | ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/pane-spectrum.png)
    |\n| _Two channels: 10:1 probe on the calibration signal, built-in generator_
    | _Square wave with its spectrum and peak list_ |\n| ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/eye.png)
    | ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/logic-analyser.png)
    |\n| _Eye diagram with TIE, bathtub and jitter breakdown_ | _Analog channel and
    three logic analyser lines_ |\n\nAll pictures are screenshots of a DHO924S running
    OOS.  \n  \n\n* * *\n  \n**Experimental software.** So far OOS has run on **one
    DHO924S** only, and some functions have never run on real hardware. Measurements
    made with OOS are not calibrated to any standard. You use it at your own risk;
    please read the [disclaimer](https://github.com/dekajoule/oos#disclaimer) before
    you install it.  \n  \nWhat OOS never touches: the FPGA flash, the factory calibration
    in , and the , and partitions. Its own self-calibration goes into its own files.
    \ \n  \n\n* * *\n  \n**What is in it**  \n  \n**Acquisition and trigger**  \n\n-
    Normal, peak detect, average, high resolution; memory depth up to 125 M points;
    1 ns/div up to roll and scan mode\n- Hardware trigger: edge, pulse, slope, video,
    pattern, duration, timeout, runt, window, delay, setup/hold, Nth edge\n- Protocol
    trigger on decoded bus events, zone trigger with boxes or polygons\n  \n**Measurement
    and maths**  \n\n- 35 automatic measurements with statistics, delay and phase,
    cursors, DVM and counter\n- A second pane under the plot: spectrum with peak list,
    results table, decoder events, or trends of two measurements\n- 8 math channels
    with free formulas (), filters, FFT; reference waveforms, mask test, CSV data
    logger\n  \n**Protocol decoders (25)**  \nUART, I2C, SPI, Quad-SPI, I3C, 1-Wire,
    SWD, JTAG, CAN, CAN-FD, LIN, FlexRay, SENT, ARINC 429, MIL-STD-1553, I2S, S/PDIF,
    DMX512, Modbus, USB LS/FS, USB PD, parallel and more; four at once, with an event
    table.  \n  \n**Analysers**  \n\n- Spectrum analyser with harmonics, THD, SNR,
    SFDR, waterfall\n- Eye diagram and jitter (TJ/RJ/DJ, DCD, DDJ, PJ), power analysis,
    Bode plot with the built-in or an external generator\n- Bandwidth test from a
    fast edge\n  \n**Logic analyser** (PLA2216, DHO900), **generator** (S models:
    sine, square, ramp, pulse, noise, DC, arbitrary, AM/FM/PM), **HDMI** as mirror
    or second workspace.  \n  \n**Remote control** over Ethernet or a WLAN stick:
    SCPI on port 5555 (Rigol-style subset, reads every sample), VXI-11, a web remote
    with live screen and touch on port 8080, LXI identification, MCP for AI assistants,
    and telnet (a root shell without password: keep the scope on a network you trust).
    \ \n  \n**System** : its own cold boot of the hardware (stock never has to run
    first), self-calibration, signed updates with trial start and automatic rollback,
    experimental overclocking of the sample clock.  \n  \n\n| ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/pane-results.png)
    | ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/pane-trend.png)
    |\n| _Results pane with statistics_ | _Trend of two measurements_ |\n| ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/labels.png)
    | ![](https://raw.githubusercontent.com/dekajoule/oos/main/docs/images/menu-system.png)
    |\n| _Measurements labelled on the trace_ | _System menu_ |\n\n  \n\n* * *\n  \n**Models**
    \ \n  \nOOS reads the model from the unit and adapts channels, logic analyser,
    generator and EXT trigger to it.  \n  \n\n| **Model** | **Channels** | **LA**
    | **Generator** | **Run OOS?** |\n| DHO802 / DHO812 | 2 | - | - | not yet |\n|
    DHO804 / DHO814 / DHO824 | 4 | - | - | a DHO804 runs it (user report) |\n| DHO914
    / DHO924 (also EDU) | 4 | yes | - | not yet |\n| DHO914S | 4 | yes | yes | not
    yet |\n| DHO924S | 4 | yes | yes | **yes, the development unit** |\n\n  \nDHO1000,
    HDO and MHO are different boards and not supported.  \n  \n\n* * *\n  \n**Installing**
    \ \n  \nEverything is in the [latest release](https://github.com/dekajoule/oos/releases/latest);
    you do not have to build anything.  \n\n- **From a USB stick** , scope closed:
    through _Storage \\> Upgrade_ of the stock system. Do the dry run first. So far
    only accepted on the DHO924S.\n- **On a second SD card** , scope opened: back
    up the original card, clone it, install . The original card stays in a drawer.
    A second card a few MB smaller than the original works too ().\n- **Updates**
    of a running OOS: the file through .\nStep by step: [wiki: Installation](https://github.com/dekajoule/oos/wiki/Installation).
    Going back to stock is one power cycle, or putting the original card back: [wiki:
    Updates and Going Back](https://github.com/dekajoule/oos/wiki/Updates-and-Going-Back).
    \ \n  \n**Building it yourself** works on macOS (Apple silicon) and on Linux,
    arm64 and x86-64; on a normal PC the kernel is cross-compiled in Docker: [wiki:
    Building](https://github.com/dekajoule/oos/wiki/Building). You can also run the
    GUI on your computer without a scope, with simulated signals.  \n  \n\n* * *\n
    \ \n**What would help**  \n  \n\n- **Reports from other models** than the DHO924S:
    what works, what does not, the start-up screen and \n- Real signals for the protocol
