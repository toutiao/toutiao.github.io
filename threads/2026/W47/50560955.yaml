  author: namibj
  text: |-
    You see, at least when we&#x27;re talking about summer heat AC, you can just build more of the panels and feed the much flatter baseload to industry that prefers to run the capital intensive machinery not only when the sun shines high during the summer.<p>If we&#x27;re talking about winter heating in for example German climates, you&#x27;d have to over build so much solar capacity to handle cold winters (even if we&#x27;re willing to turn on fuel burning supplementary heaters for a statistically single digit number of days per year) that you have severe excess in summer.<p>You&#x27;d turn most factories (those with decently high electricity draw per capital expenditure) off for about a month worth of days in winter, usually combining this with scheduled maintenance, and:<p>To further shift large amounts of country-scale power consumption from year-round&#x2F;winter to only sunny summer days:
    try to set up electrical refining of (purified) iron ore into (metallic) iron at larger solar farms where you could recycle their grid connection and their AC&#x2F;DC converters together with already normalized (for there) local batteries (to shift delivery of half the production from around noon to the night, which reduces the AC&#x2F;DC converter capacity and the AC grid connection&#x2F;transformer size requirements).
    There are realistic low-temperature electrolysis options for electro-chemically splitting the oxygen off of the iron (purified iron ore is iron oxide) like Siderwin [0] and even near-room-temperature options like Electra [1].<p>For scale, [0] claims replacing the production of the existing coal-based iron ore refining plants of Europe with Siderwin would require 471 TWh&#x2F;year in additional electricity in the grid; [2] claims the EU (without the overall insignificant island Malta, as it&#x27;s not connected to the continental grid in a way that&#x27;d be readily suited to inclusion in these common-measurement-definitions statistics) produced 2497.3 TWh in the entire year of 2024, of which 237.6 TWh were solar.<p>Thus, it&#x27;s overall &quot;not <i>that</i> much&quot; extra production capacity that&#x27;d even be spent on this (assuming an essentially-fully renewable grid, let&#x27;s call it 99% by yearly aggregate electricity production):
    during heavy solar days, you&#x27;d import solar power from the grid at night, aim for something like 5~30% yearly average utilization of the electricity-guzzling iron-deoxidizer, and feed excess summer production into the iron-deoxidizer day and night via the local batteries. There&#x27;s an overlap zone in grid daily solar yield, where you&#x27;d even import from other solar plants, depending on how expensive a kW of iron-deoxider capacity is vs. a kW of solar panel (with MPPT, but without AC inverter). Expensive solar and AC-grid means you&#x27;d import more on very sunny days (use the other solar plants instead of just discarding their power, as you&#x27;d run with no exported AC during daytime and suck the other plant&#x27;s batteries dry at night, with more local iron-deoxider kW than day-average peak solar kW; local batteries do the flattening of the local solar power across the day&#x2F;night cycle), while expensive iron-deoxidizer kW force you to run it more continuously across the summer months with only brief exceptions during some sporadic weeks of clouds (where you want big industry to just power through instead) despite this wasting solar power during summer daytime that can&#x27;t be stored in the local batteries and can&#x27;t be exported to the grid (on such peak sunny days, the plant would have to throttle the panels during the afternoon once it&#x27;s local batteries hit 100% around noon).<p>It&#x27;s around 1&#x2F;6th of current yearly electricity production; at say 33% duty cycle however it&#x27;d approximately look like 1&#x2F;2 of electricity production (during the third of the year where solar is in excess), so we&#x27;d be talking about a massive grid capacity impact. Hence the proposal&#x2F;suggestion to move it to the DC side of solar farms that are large enough to warrant the staffing&#x2F;infrastructure overhead.<p>[0]: <a href="https:&#x2F;&#x2F;industrydecarbonization.com&#x2F;news&#x2F;making-steel-with-electricity.html" rel="nofollow">https:&#x2F;&#x2F;industrydecarbonization.com&#x2F;news&#x2F;making-steel-with-e...</a>
    [1]: <a href="https:&#x2F;&#x2F;www.electra.earth&#x2F;our-technology&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.electra.earth&#x2F;our-technology&#x2F;</a>
    [2]: <a href="https:&#x2F;&#x2F;eepublicdownloads.blob.core.windows.net&#x2F;public-cdn-container&#x2F;clean-documents&#x2F;Publications&#x2F;Statistics&#x2F;Factsheet&#x2F;entsoe_sfs2024_web.pdf" rel="nofollow">https:&#x2F;&#x2F;eepublicdownloads.blob.core.windows.net&#x2F;public-cdn-c...</a>
