  text: Thankfully it&#x27;s not a zero sum game. We aren&#x27;t up against serious
    limits on how much solar power can be built.<p>If producing solar panels is profitable,
    then your purchase gives the manufacturer capital it can use to expand production.
    And your purchase demonstrates demand, encouraging expansion of production and
    attracting investment in expansion.<p>You also become part of economies of scale
    that reduce the cost for everyone.<p>And the industry also gains experience from
    your purchase, pushing it further along the experience curve[1] which tends to
    increase efficiency.<p>Buying solar panels to power your air conditioner probably
    improves the situation for everyone by some small amount. Of course, it&#x27;s
    possible that some other choice might improve the situation <i>more</i>, but most
    people aren&#x27;t going to feel guilt as long as they haven&#x27;t made the situation
