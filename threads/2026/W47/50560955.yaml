  author: eesmith
  text: Having grown up in the US South, I can tell you how -- most houses since the
    1960s were designed around A&#x2F;C, and are incredibly ill-suited if the A&#x2F;C
    doesn&#x27;t work.<p>I know this because I grew up in a house in Florida built
    in the 1950s, with no A&#x2F;C. Southern vernacular architecture includes high
    ceilings (so the heat rises above the people), lots of windows (to let the air
    go through and heat escape), and with the house raised off the ground (so cooling
    air flows underneath). While my house didn&#x27;t have it, another typical design
    element is a wraparound porch, to provide extra shade and let the windows stay
    open even when it rains.<p>If you build for A&#x2F;C in the South then you want
    a building with good insulation and little airflow, to save on power. If the A&#x2F;C
    doesn&#x27;t run then these places get very warm, humid, and stuffy. Nearly every
    house is built this way.<p>Further, if you are used to the chill that A&#x2F;C
    provides then your body doesn&#x27;t adjust to the heat.<p>The US Southwest has
    its own vernacular architecture. The days are hot and the night cool, so use thick
    adobe walls which take 12 hours for the heat of day to seep through. Close the
    windows in the morning to keep the cool in, open them at night to cool off, while
    the heat from the walls keeps the inside more moderate.
