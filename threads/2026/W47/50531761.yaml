    being, I think, that conformity can offer a decent default course to people when
    they’re new to any given nuanced or contentious social problem, or with limited
    vantage on the full consequences.<p>I don’t know, or want to know, why they don’t
    want a vehicle parked in this particular place between 7 and 11 AM on a Thursday.
    I <i>could</i> inquire further, and learn either that something legit happens
    then, or that it is in fact a pointless&#x2F;outdated rule that I could reasonably
    ignore.<p>But if I don’t care—and I don’t—I can go with the default and be reasonably
    confident I’m not accidentally being an asshole.<p>(To the motorcycle situation—the
    motorcycle club I had in mind eventually negotiated an informal arrangement with
    the precinct and the agitators amongst the residents: the cops would leave them
    alone if they’d take it out to the nearby industrial district. The particular
    triumphed over conformity! The specific over the general! …Though the resulting
    peace is contingent on conformity with this new, particular agreement… which will
    no doubt look stupid to some new guard amongst the bikers, who will no doubt demand
    “respect” by bringing it back to the residential strip… and so the cycle will
    renew… or, put another way, the specifics will evolve, as they generally do!)'
