  author: komali2
  text: 'Jump to &quot;criticisms.&quot;<p>The Tragedy&#x27;s original formulation
    is based on a false premise of land that was not Common but in fact had an owner
    who managed it. Overgrazing was due to mismanagement.<p>Meanwhile, land actually
    owned in Common has historically been managed very well, through informal techniques
    of social consequences for overuse.<p>The &quot;Tragedy of the Commons&quot; is
    usually used as a justification for more rigid management when the initial example
    is a false premise that indicated the <i>opposite</i> conclusion should be made.<p>Anyway
    this original article could probably just have been a Wikipedia link, but the
    question is right there: why should something be wrong simply because it&#x27;s
    bad if everyone does it?<p>When we pull it apart we realize we actually had been
    doing the argument&#x27;s work for it and engaging in a very normal debate about
    right vs wrong for individual actions. Example: what if everyone became teachers?
    Well there&#x27;d be no plumbers! No no of course we didn&#x27;t mean the formulation
    to cover those kinds of things, we meant, like, bad stuff, like parking in front
    of stores! If everyone did that it would be bad, so nobody should do it. Well
    except for pregnant people or disabled people or old people... And so on.'
