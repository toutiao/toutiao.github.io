  text: Perhaps think of <i>process</i> loopholes, in the same sort of way attackers
    look at security systems.<p>For example, if you park badly, civil parking enforcement
    officers patrol the streets.<p>...but if you park directly on a _pedestrian crossing_,
    in some jurisdictions that&#x27;s now a <i>criminal offence</i>, so only the police
    can prosecute it, not the civil parking enforcers. But the police have better
    things to do than enforce parking. So you raise the stakes significantly but you&#x27;re
    also more likely to get away with it. Double or quits. It goes without saying
    that you&#x27;re being an enormous arsehole.<p>The crux of the problem (aside
    from arseholes existing), is the inverse correlation - the <i>worse</i> an infraction
    is, the <i>less</i> it gets punished, because of the increased scrutiny and limits
    on who can prosecute as the severity of infraction increases.
