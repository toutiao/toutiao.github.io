  author: kstrauser
  text: 'If forced (or allowed) to pick, I agree totally. And sometimes situations
    get fuzzy. Once we needed to buy diapers and the store parking lot was packed.
    (Black Friday’s an awful time to have a plumbing leak.) Rather than circling for
    half an hour to look for a space, my wife hopped out and ran in so I could circulate
    for a few minutes. I parked along the curb way, <i>way</i> far away from the entrance,
    with no one closer than a few hundred feet from me, engine running for warmth,
    ready to move at a moment’s notice if a fire engine was coming or whatever. Soon
    a bored guard tapped on my window: “you can’t park here”. OK. I went back to alertly
    watching and waiting. He knocked again: “you can’t park here.” I’m not parked,
    the engine’s running, I’m not blocking anyone, and my wife’s coming out shortly
    with diapers. “Sir, you have to move your car.” Fine. I moved 10 feet and put
    it back in park. “Sir, you have to keep moving!” I put it in drive and crept along
    at 0.1 mph. “You have to move!” I <i>am</i> moving!<p>I’m certain he thought I
    was an asshole. I’m certain I thought he was pedantically enforcing the letter
    of a rule that the spirit didn’t require. My loophole helped me while not hurting
    or disturbing anyone else in any way, except for the guard’s annoyance. And 2
    minutes later, my wife came out and we went back home where the in-laws anxiously
    awaited our return.'
