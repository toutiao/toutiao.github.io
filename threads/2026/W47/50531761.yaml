  author: fwlr
  text: When applying the categorical imperative (“what if everyone acted in accordance
    with this belief?”) I have found it useful to look at it game-theoretically (is
    everyone acting this way a stable equilibrium? where does the equilibrium end
    up?) and also examine the counterfactual causal consistency (if everyone had been
    acting this way previously, would we have arrived at the current scenario? when
    thinking of exploiting a commons before others do, consider that the commons could
    not have accumulated into existence in the presence of others’ exploitation; the
    fact that you have the opportunity is evidence that you are not in a race to use
    that opportunity).
