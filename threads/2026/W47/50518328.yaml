  author: adastra22
  text: There is nothing about AFM which precludes it from being used on living things.
    This isn’t like SEM or other microscopy processes that require costing in a conductive
    material. It’s just a force probe. It’s just, as the article notes, getting things
    to sit still long enough for the photo that is difficult with living things.<p>TFA
    basically coats a surface with the molecular scale equivalent of superglue, then
    scans while everything is stuck in place. The bacteria will die of course, but
    not in the ~30min it takes to make the image.
