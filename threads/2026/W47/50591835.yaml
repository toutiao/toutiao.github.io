  author: jcranmer
  text: That&#x27;s narrower than you think it is. As it applies in US federal court:<p>&gt;
    The defense of entrapment by estoppel requires proof (1) “that a government agent
    actively misled him about the state of the law defining the offense,” (2) “that
    the government agent was responsible for interpreting, administering, or enforcing
    the law defining the offense,” (3) “that the defendant actually relied on the
    agent&#x27;s misleading pronouncement in committing the offense,” and (4) “that
    the defendant&#x27;s reliance was reasonable in light of the identity of the agent,
    the point of law misrepresented, and the substance of the misrepresentation.”<p>In
    short, entrapment requires that the government explicitly tell you that what you
    did was legal, that you <i>relied</i> on that information to decide to do it,
    and that such a reliance was reasonable.<p>I don&#x27;t know the precise details
    of what Nvidia did with regards to evading the chips sanctions, but I suspect
    it involves a lot more of Nvidia lobbying the government to be exempted, at which
    point the entrapment is less likely to apply.
