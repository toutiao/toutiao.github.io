  author: stuhood
  text: 'Yes! Search engines like Tantivy have long employed WAND to score across
    terms. The difference though is that WAND is not joining terms in descending order
    by score: rather, by doc-id.<p>This algorithm is closer to Fagin&#x27;s Threshold
    Algorithm (also mentioned in your link): the Threshold Algorithm was the first
    iteration of a rank join.'
