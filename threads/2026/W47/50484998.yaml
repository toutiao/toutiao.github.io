  author: jillesvangurp
  text: Searching what you stored is nice. But usually, you want to put some ETL (extract,
    transform, and load) in between your data base and search indices that enables
    you to enrich, transform, and improve data. If you are using vector search, this
    is also where you calculate your embeddings and run your data to elaborate tokenization
    pipelines. And you might do things like calculate categorizations and other classifications
    that you might use for filtering.<p>Search quality tuning inevitably involves
    iterating on how you index your data. The value of separation of where your database
    and search index live is that you can try out new indexing strategies and try
    different strategies.<p>I&#x27;ve been consulting on how to improve search quality
    for some time and sorting out ETL is usually the first thing I need to do for
    clients. A good question is &quot;when did you last reindex your data&quot;. If
    the answer is never, that usually means the clien is probably not able to do this
    easily and that they probably made a lot of mistakes when they set up their system
    first. I&#x27;ve helped quite a few clients like that.<p>ETL doesn&#x27;t have
    to mean bringing in a lot of complexity. A few simple python or whatever scripts
    can do the job. And many people don&#x27;t actually have a lot of data which means
    these scripts can run quickly. I&#x27;ve had clients where it only took a few
    seconds to rebuild their search indices.<p>ParadeDB seems premised on the notion
    of just skipping all this. IMHO this is usually a mistake and if you were to do
    this properly, you&#x27;d still end up with a separate db from which you index
    into ParadeDB. Of course, if you do that, you could question if you could not
    pick something else instead.
  score: 0
