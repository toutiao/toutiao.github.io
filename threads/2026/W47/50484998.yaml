  author: williamdclt
  text: 'while I mostly agree with you, you&#x27;re opposing &quot;teams who made
    mistakes while denormalising&quot; with &quot;teams who made no mistake while
    normalising&quot;. The biggest difference between these two scenarios isn&#x27;t
    that one is using denormalisation and the other normalisation, it&#x27;s that
    one made mistakes and the other didn&#x27;t.<p>In real life, the teams working
    on a supposedly-normalised data schema will also make mistakes: they will model
    their domain incorrectly, have information duplication without realising it at
    first, different interpretation of the same data (accessing the same data doesn&#x27;t
    mean they&#x27;ll interpret it the same way... or that it even _can_ be interpreted
    in a consistent way if not modelled correctly).<p>I do agree that denormalisation
    increases the chances of that happening. But IMO, there&#x27;s much more issues
    on data modelling than there is in denormalisation. If you have a solid model
    that is shared by everyone, you&#x27;ll have much fewer issues even with denormalisation
    than if you have a not-solid model that is not-shared by everyone even with normalisation.'
