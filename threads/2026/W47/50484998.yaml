article:
  url: https://www.paradedb.com/blog/joins
  title: Do We Still Have to Denormalize? Have Your Schema and Search It Too | ParadeDB
  fetch_status: success
  content: "# Do We Still Have to Denormalize? Have Your Schema and Search It Too\n\n
    ![Stu Hood headshot](/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fstu_headshot.ad88c2bc.jpeg&w=64&q=75&dpl=dpl_7omXgh8RD2B8upgsxyEvaMqph826)\n\nBy
    Stu Hood on October 27, 2026\n ![Do We Still Have to Denormalize? Have Your Schema
    and Search It Too](/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fhero.6fe23396.png&w=3840&q=75&dpl=dpl_7omXgh8RD2B8upgsxyEvaMqph826)\n\nSearch
    usually means returning results sorted by relevance (like BM25 or vector similarity),
    or summarizing results into **facets**. ParadeDB already [makes this fast](https://www.paradedb.com/blog/optimizing-top-k)
    when your data lives in a single denormalized table.\n\nBut in a relational database,
    data is usually normalized and factored out into separate tables, like `users`,
    `posts`, and `comments`. We call searching across multiple joined tables a **search
    join** , and making these queries fast is harder than it looks!\n\nHistorically
    this pattern left people either choosing speed, and denormalizing via a fragile
    ETL process into Elasticsearch, or choosing simplicity and accepting Postgres
    slowly scoring and joining millions of rows only to return a handful of results.\n\nWe've
    spent the last few months making search joins a first-class experience in ParadeDB,
    removing the need to choose between complexity and slow queries. In our StackOverflow
    benchmark, a multi-table search query is up to 1000x faster than vanilla Postgres
    (dropping a natural 3-table Top-K search from 2 minutes to 100 ms), without the
    burden of any additional infrastructure.\n\n## Why Search Pushes You to Denormalize\n\nTo
    see what a search join looks like in practice, consider StackOverflow's data model,
    which exercises both relational joins and search: `users` (2.3M rows), `posts`
    (20M rows), `comments` (29M rows), and `badges` (29.4M rows), all of which should
    be easily accessible from a search box or agent.\n\nYour instincts tell you that
    when you store this dataset in a database, most of it should be normalized: you
    don't want to denormalize users into their posts and comments and then need to
    update every post or comment they've ever made when they update their profile.
    When someone searches, you just want to write a single query that finds matches
    across `users`, `posts`, and `comments`, ordered by their combined relevance scores:\n\n
