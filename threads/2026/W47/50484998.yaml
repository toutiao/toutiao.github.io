  author: gopalv
  text: '&gt; Instead of joining the tables completely and sorting at the end, a Rank
    Join streams its inputs in descending score order (sorted access, or SA), building
    candidate result-sets as it goes.<p>Your algorithm feels like a variant of the
    WAND algorithm the Snowflake Top-K pruning paper [1] pulls from.<p>You can go
    distributed with this approach if you have a &quot;gossip&quot; protocol between
    workers to distribute the heap boundaries periodically.<p>Before the AI age, a
    &quot;papers we love&quot; group was a great thing within any company.<p>Now,
    Claude or Codex will know the SOTA literature around a topic like this and &quot;uniformly
    distribute&quot; the past into every single implementation of a similar idea.
    The future isn&#x27;t uniformly distributed, but the past is getting the treatment
    &amp; that&#x27;s good.<p>[1] - <a href="https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;2504.11540v1#S5"
    rel="nofollow">https:&#x2F;&#x2F;arxiv.org&#x2F;html&#x2F;2504.11540v1#S5</a>'
  score: 0
