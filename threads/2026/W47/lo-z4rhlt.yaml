  title: Redict is deprecated | Redict
  fetch_status: success
  content: "# [Redict is deprecated](/posts/2026-11-17-redict-deprecated/)  \n\n ![](/svg/calendar.svg)November
    17, 2026\n\nI must unfortunately announce that Redict is officially deprecated,
    and Redict 7.3.6 is the final release.\n\nI had hoped to rally the Redis diaspora
    around a copyleft initiative, to protect ourselves from future rug-pulls, and
    made Redict to serve this purpose. However, with the valkey project’s success,
    and Redis’s return to a copyleft license, Redict was not able to build a sustainable
    community.\n\nWe recommend that Redict users switch to [valkey](https://valkey.io/),
    which uses a permissive license but has better long-term prospects. We advise
    against switching back to Redis; though it is once again open source, and copyleft,
    it uses a contributor license agreement which will facilitate another rug-pull
    when Redis has a bad financial quarter.\n\nSwitching to valkey is straightforward:
    if you install from your package manager, simply install valkey and move your
    config file:\n\n    # mv /etc/redict.conf /etc/valkey.conf\n\nIf you use containers,
    simply pull the valkey container instead and ensure that it runs with the appropriate
    config file.\n\nThanks to everyone who has contributed to Redict, endorsed the
    fork as the future of Redis, and switched to it on their own machines. We had
    a good run :)"
