  text: |-
    The thing is that people who like AI have been successfully &quot;othered&quot; so thoroughly that no one cares that the internet has become an unwelcoming and often downright hostile place to hang out for us. Every day there is some new essay about how the thing we like is actually super bad and we shouldn&#x27;t like it. There&#x27;s some new argument about how people who use AI are actually massive dumbasses who can&#x27;t think for themselves anymore, or how people who use AI to make art aren&#x27;t actually being creative and are only contributing the global warming and water shortages. No one cares about what that does to our mental health, because we&#x27;re &quot;others&quot;. We&#x27;re evil, we&#x27;re shilling for corporations, we&#x27;re trying to destroy art and culture.<p>&quot;Hey, I wrote this useful app and thought I&#x27;d share it.&quot;
    &quot;No you didn&#x27;t write it, AI wrote it, you did nothing.&quot;
    &quot;Okay, sorry, well I built it with the help of AI.&quot;
    &quot;No you didn&#x27;t build it, AI built it, you did nothing.&quot;
    &quot;Well, I came up with the idea and I worked with AI to bring it into the world, is that better?&quot;
    &quot;Cool story, bro, how much water did you waste on the AI you used for that? Don&#x27;t you care that you&#x27;re destroying the environment just to make your little toy?&quot;<p>I&#x27;ve realized, probably similar to you, that the scales are extremely imbalanced, and it&#x27;s making us respond with the same hostility finally. If people want to go on the internet and write essays about how AI is terrible and the people who use it are also terrible, then it should be just as acceptable for us to go on the internet and mock, ridicule, and insult the people who are against it. But, yeah, it isn&#x27;t. If we get angry, we&#x27;re the problem. It&#x27;s not that we&#x27;re having a totally reasonable reaction to a completely unreasonable cultural moment where cruelty is celebrated so long as you believe you&#x27;ve got the moral upper hand.<p>We&#x27;re just expected to swallow it, getting chased out or banned from online spaces and communities we used to feel welcome in. I spent a decade making open source software and giving it away for free, but now if someone sees that I&#x27;m using AI as part of my hobby, I get insulted and ridiculed. I&#x27;ve been places that have Code of Conducts that say everyone should be welcoming, where I am promptly bullied and called incompetent for my AI usage (:waves at #ircv3 on libera:) and no one does a thing about it. Because I&#x27;m an &quot;other&quot; now, for using AI, the rules are not meant to protect me or you anymore.<p>It&#x27;s pretty gross and someday all these people will hopefully look back on this time and feel disappointed in themselves for so quickly turning on their fellow humans, just so they can feel superior for some reason or another. Every day they likely flush gallons and gallons of fresh water down the drain on showers and who knows what else, but the person who uses AI for any reason is the real problem. Time to write another essay about how people who use AI have no critical thinking skills and how I&#x27;m so superior for not wanting to use AI! Hopefully I don&#x27;t break my arms patting myself on the back too hard.
