  text: I know this seems strange, but it usually has to do with the scarcity of hands
    and relative abundance of books, and their life cycles in a library.<p>Hardback
    books can be lent out approximately 25 times before breaking and paperbacks much
    less - 5-8 times is normal. Libraries often try to protect the books by strengthening
    the spines and applying an extra layer on the cover and such, but this is more
    trouble to do and less worthwhile if the book is already used and has had a couple
    of lending cycles shaved off its lifetime. In most cases it will therefore be
    a better investment to sell a donation and buy new books of known quality and
    invest your limited man-hours in those.
