  author: jerf
  text: Any attempt to categorize &quot;all books&quot; into some system that by physical
    necessity will yield exactly one answer for where some book in some specific library
    will go will be poor. (That is, even if the DDS or some other system yields multiple
    valid categorizations for some particular book, in some specific library the book
    has to live in one specific place.) Some may be somewhat better than others, but
    &quot;poor&quot; is the best you can hope for. Even ontologies far more lively,
    rich, and constantly being kept up-to-date, like the systems for classifying scientific
    papers, fail to really correctly capture the full complexity of the real world.<p>In
    the 21st century we can use computers to sort on any number of dimensions and
    by any criteria we want and tell the user where the book is directly. Once we&#x27;ve
    embraced that, it frees the physical organization of the books being optimized
    for sheer findability by anyone, ever, into whatever other system we like. &quot;Hey,
    bookstores seem to have evolved this layout as the best way to introduce books
    to people over the decades&quot; is at least a decent start. I would expect the
    library would want to evolve some nuances on that based on the fact they&#x27;re
    not looking to maximize profits, but it&#x27;s probably a good start.
