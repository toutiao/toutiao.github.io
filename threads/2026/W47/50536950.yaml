  author: teraflop
  text: I don&#x27;t think anyone&#x27;s disputing that Dewey Decimal can place &quot;related&quot;
    books in different places. The question is whether this new proprietary system
    improves on it.<p>Like, consider the parent post&#x27;s example of &quot;a book
    about the history of gardening in England&quot;. That covers at least two topics,
    gardening and English history. If you choose to group all the gardening books
    together in one place, then you force the English history books to be scattered
    instead. This is just an inherent limitation of reducing a multi-dimensional &quot;topic&quot;
    space to a linear ordering.<p>The meaningful question is whether <i>on average</i>,
    this system is a more useful grouping than alternatives, based on how well it
    captures the &quot;related-ness&quot; that people actually care about, and how
    difficult it is for them to find what they&#x27;re looking for. You can&#x27;t
    answer that question by looking at the classification hierarchy alone. It&#x27;s
    an empirical question about how users interact with the system.
