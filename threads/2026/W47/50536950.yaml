  author: PaulHoule
  text: "I would like to see this claim justified:<p><pre><code>   In the Dewey Decimal
    System, a book on gardening could potentially be in \n   any of the four places
    in the system that contained gardening content. \n   With Wayfinder, it’s all
    in the same place.\n</code></pre>\nI think there is always a question of where
    to file something,  like a book about the history of gardening in England could
    be filed under gardening or the history of England.  You could do better than
    old systems but you&#x27;re not getting it right always.<p>I think the greatest
    embarrassment in Dewey and Library of Congress (LC) is how they handled computers.
    \ Dewey has a trash section at the beginning and computers wind up right after
    UFOs and bigfoot but oddly most occult subjects end up in the 130&#x27;s except
    for a tiny bit in the 398.4 but my witchy friends would be happy to know <i>The
    Spiral Dance</i> is filed at 299.<p>LC on the other hand puts almost everything
    about computers in QA76 except for some clusters in the TK area and some oddly
    general things in QA75.  (In LC <i>The Spiral Dance</i> is filed along with more
    lurid books on witchcraft that Dewey files at 133.4)  Instead of &quot;generic&quot;
    and &quot;math&quot; and in some alternate universe it would have been reasonable
    to put computers under electronics in 621.3 and in fact you might find a few books
    there about how gates are constructed in CMOS there if you&#x27;re lucky.<p>The
    trouble is that computers expanded to embrace everything so books like &quot;How
    to process your photographs in Adobe Lightroom&quot; ends up in the 0&#x27;s that
    really ought to be filed in the 600&#x27;s (photography as technology) or the
    770s (photography as art.)  Stuff like that ends up in 0&#x27;s in Dewey but in
    LC usually gets filed in the TRs,  though if it was like Dewey they&#x27;d file
    photography under the NDs.<p>The advantage a &quot;bookstore-like&quot; system
    has is that if it isn&#x27;t set in stone you can change it."
