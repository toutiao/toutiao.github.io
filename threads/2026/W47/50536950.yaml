  author: WorldMaker
  text: In the Dewey Decimal System the book&#x27;s publisher picks one that they
    think is most relevant to sales, but also maybe lists the other options, in the
    book&#x27;s frontmatter. Eventually the OCLC picks their favorite for WebDewey
    and the Library of Congress their favorite for the Library of Congress Dewey Program,
    though often they defer to OCLC.<p>But even in the history of paper catalogs books
    would often have secondary indexes in other parts of the taxonomy. Instead of
    walking the Dewey Decimal Numbers directly in the stacks you might walk to a card
    catalog that itself was organized by Dewey Decimal number, scroll through that
    and find a reference card to that book that would say &quot;See this other Dewey
    Decimal number for this book in the stacks&quot;. (Computerized catalogs make
    secondary indexes even more common, obviously.)<p>The Dewey Decimal taxonomy was
    never &quot;total&quot; or perfect, it was just often &quot;well indexed&quot;,
    for paper versions of good indexing.
