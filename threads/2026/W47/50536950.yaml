  author: fnordpiglet
  text: Libraries have been gutted to become basically entertainment and a place to
    use computers for free and watch YouTube. The books are nominally there because
    it’s a library. Instead the library more and more is becoming a community center,
    especially as fewer communities have community centers.<p>The web is part of it,
    the sense that if I can search google why do I need a book. AI I’m sure just reinforces
    this. Also though was a trend in making the library more accessible to more people
    - rather than a place of quiet study, the idea was to make them into a network
    of community centers with services like training, activities for kids, places
    for people to meet up, etc; and the books are distributed between branches in
    a region rather than being shelved in a central library.  The books on shelf tend
    to be the books that are either selected to be picked up by popular demand or
    to wait for demand at some branch and shipped to the other library. I’ve also
    found most truly useful books are always checked out with queues very deep. I
    have a book I’ve been in queue for to borrow for four months. This means the great
    books of reference or literature don’t show on the shelves because they literally
    never land on a shelf. They’re constantly in circulation or being held for pickup.<p>Finally
    the digital book thing really sucked money out of acquisition of paper books.
    The licensing for digital books is expensive and they end up with no lasting copies.
    To make it worse they also have limited licensing per title so you end up queuing
    again for titles people want to read or are high quality.<p>Digging under all
    this though you’ll find the real problem - a million priorities and competing
    demands, and less funding.
