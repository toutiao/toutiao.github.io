  text: 'There used to be an old bookstore just outside of Boston called the New England
    Mobile Book Fair. It had long ago ceased to be mobile, and was installed in some
    type of former industrial building consisting of a warehouse like room, winding
    passages, and former offices, 30k square feet in all (2,787 m2).<p>It was organized
    by broad genre (childrens, fiction, etc.), <i>publisher</i>, then author. Niche
    genres were scattered around in nooks or on certain walls. I don&#x27;t remember
    if imprints were handled as individual publishers or mixed in with the parent,
    or it was ad hoc (very likely!)<p>It was fun to browse, but unless you knew the
    publisher the only way to find certain titles or even types of books was to ask
    one of the staff who either knew off the top of their head or would do a lookup
    on a beat up old CRT terminal which listed the publisher.<p>But the selection
    was incredible. It might have been the biggest bookstore in New England outside
    of the Harvard Coop. The only comparable sprawling indie bookstores I&#x27;ve
    see are Powell&#x27;s in Portland Oregon and Strand in NYC.<p>Like 90% of bookstores
    in America, chain or indie or special like this one, Amazon killed it off.<p>Photos
    here:<p><a href="https:&#x2F;&#x2F;www.shelf-awareness.com&#x2F;issue.html?issue=1611#m14202"
    rel="nofollow">https:&#x2F;&#x2F;www.shelf-awareness.com&#x2F;issue.html?issue=1611#m14202</a><p><a
