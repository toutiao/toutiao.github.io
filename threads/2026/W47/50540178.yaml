  url: https://revscope.co/blog/search-seo-geo-2026/
  title: Google's AI Overviews cut clicks to websites by 40% - RevScope
  fetch_status: success
  content: "# Google's AI Overviews cut clicks to websites by 40%\n \n \n ![Line chart,
    September 2024 to August 2026. Google results showing an AI Overview rise from
    5.9% to 61.4%, while results showing a featured snippet fall from 9.0% to 0.4%.](/_astro/search-features-2024-2026.BZl2SRMo_Z24aVWv.webp)
    \n \n\nGoogle's AI answers are taking clicks from websites in the search results.
    In a randomized experiment, researchers hid AI Overviews from some US desktop
    users. Comparing them with users who still saw Overviews shows that an Overview
    cuts clicks to outside websites by about 40%. Those Overviews now appear on more
    than half the US keywords DataForSEO tracks, up from 6% two years ago. The industry's
    answer, GEO (generative engine optimization), has yet to show a way to compensate
    for the loss. While AI citations correlate with the same kind of link profile
    that goes with higher Google rankings, in March AI assistants sent websites just
    0.3% of their traffic.\n\n \n\nSearch engine optimization (SEO) still decides
    whether you can be found, but where an AI answer appears, a ranking brings 40%
    fewer visits than it used to. Generative engine optimization (GEO), the practice
    of getting your content cited in AI-written answers, looks mostly like SEO plus
    two additions: being present on the third-party sites AI answers draw from, and
    writing pages that are easy to quote. We found little evidence for any other tactic.\n\n
    \n## Google answers first\n \n\nAn AI Overview is a generated summary that Google
    places above the ordinary results, with links to the pages it drew on. In DataForSEO's
    monthly panel of 20 million keywords, the share of results showing one climbed
    from 5.93% in September 2024 to 61.43% in August 2026. The chart at the top of
    this post shows that climb. Over the same period the featured snippet, the quoted
    passage Google used to show at the top of a page, fell from 8.96% to 0.44%, and
    the discussions and forums block fell from 21.13% to 7.42%. Video results rose
    from 9.67% to 19.98%, though that is down from a peak of 31.05% in October 2025,
    and local map listings rose from 19.98% to 25.99%. DataForSEO's dataset covers
    190 million keywords, 165 million AI answers, and 1.1 billion backlinks, mostly
    for US English searches. Pew Research Center's data gives an independent check.
    Pew logged the searches of 900 US adults in March 2025, re-ran them in April,
    and found summaries on 18% of them. DataForSEO's figures for those months are
    14.67% and 17.63%, close to Pew's.\n\n \n\nYou can't reliably avoid Overviews
    by choosing different keywords. Between the fourth quarter of 2025 and the third
    quarter of 2026, the rate rose for every type of search intent:\n\n \n\n  | Search
    intent | Q4 2025 | Q3 2026 |\n| --- | --- | --- |\n   | Informational (looking
    something up) | 48.42% | 70.44% |\n | Commercial (comparing options) | 26.30%
    | 51.35% |\n | Navigational (looking for a site) | 17.04% | 34.03% |\n | Transactional
    (ready to buy) | 10.82% | 28.64% |\n  \n \n\nLow-volume keywords aren't safer
    either. In the third quarter of 2026, keywords with 201 to 300 monthly searches
    showed Overviews 58.59% of the time, against 48.62% for those above 600. A separate
    dataset, from June to September 2026, covers difficulty and price. The easiest
    keywords showed Overviews 60.64% of the time and the hardest 53.76%. Keywords
    costing advertisers more than $5 a click were at 49.55% and those under 25 cents
    at 50.54%, with a low of 42.63% between $0.51 and $1.00. More than half the result
    pages have no price data and show Overviews 60.06% of the time. The rate does
    vary by industry. Health is at 69.68% and finance at 68.80%, while apparel is
    at 37.48%, dining at 29.37%, and real estate at 22.27%.\n\n \n\nQueries are also
    getting longer, especially on desktop. Over a year, queries of five or more words
    grew from 29.3% to 34.8% of unique desktop queries and from 29.6% to 31.9% on
    mobile. Three and four word searches are still the most common.\n\n \n## What
    happens to the clicks\n \n\nThe strongest evidence is an experiment. Saharsh Agarwal
    and Ananya Sen gave US desktop Chrome users an extension that put each of them
    at random into a group. One group saw Google as usual, and another had AI Overviews
    hidden. The researchers then watched two weeks of real searches in January and
    February 2026. On searches that would show an Overview, the group that could see
    them averaged 0.37 clicks to outside websites per search, against 0.62 for the
    group that couldn't, which the authors report as a 39.8% reduction. Searches ending
    with no outbound click went from 54% to 73%. Clicks on ads didn't change, which
    suggests Google takes care not to cannibalize its own revenue. Across all searches,
    with and without an Overview, the authors put the loss at roughly 18.5% of the
    organic clicks a site gets from Google. The authors expect the loss to grow as
    Overviews appear on more searches. This is a randomized controlled trial, the
    most reliable kind of study for separating cause from correlation or coincidence.
    The effect was statistically significant for informational searches. The navigational
    and transactional samples were too small to settle anything. This is a working
    paper, not yet peer reviewed, and it covers desktop only. A separate preregistered
    experiment by Wang and colleagues, with 1,100 people, also found that removing
    AI Overviews and AI Mode raised clicks to publishers.\n\n \n\nObservational data
    points the same way. Pew found people clicked an ordinary result on 8% of visits
    to a results page with a summary and on 15% without one, and ended their browsing
    session on 26% against 16%. Pew's comparison isn't a controlled experiment, because
    the searches that draw a summary tend to be longer and phrased as questions.\n\n
    \n\nClick-through rate (CTR) is the share of people shown a result who click it.
    Across more than 2,000 websites in DataForSEO's panel, the desktop CTR of the
    first organic result fell from 17.83% in September 2025 to 7.43% in August 2026,
    a drop of 58%. Mobile fell from 25.17% to 20.80%, a drop of 17%.\n\n \n![Line
    chart of position 1 click-through rate by month, September 2025 to August 2026.
    Desktop falls from 17.8% to about 15% by February, drops to about 8% in March
    2026, and ends at 7.4%. Mobile falls from 25.2% to 13% by February, then recovers
    to 22.5% in May and ends at 20.8%.](/_astro/position-1-ctr.CBmYYIdO_ZkB0ks.webp)
    \n_Desktop lost nearly half its click-through rate in one month, March 2026, and
    stayed down. Mobile fell about as far\n    over five months, then recovered most
    of it. These figures come from Table A2 of the report._\n \n\nDesktop plunged
    from 15.18% to 7.94% between February and March 2026. AI Overviews can't easily
    explain that step since the report has them almost flat that month, at 42.79%
    and then 43.38%. A change in the format or quality of the Overviews might explain
    part of it, though that is speculation on our part. Mobile, meanwhile, sank to
    12.96% and then rebounded to 22.49% by May. The report itself says its data \"does
    not establish\" whether AI answers, layout changes, or changes in behavior are
    the cause. Its sample may also be shifting underneath it, since the unique desktop
    queries it counts fell by a third over the year, from 1.97 million to 1.32 million.
    Whatever the cause, a top ranking on desktop now earns less than half the clicks
    it did a year earlier.\n\n \n\nDataForSEO also estimates where clicks go on pages
    with and without an Overview. By its model, the first organic result holds 9 to
    16 points less click share on pages with one, though these are different searches
    on a single day's snapshot:\n\n \n\n  | Search intent | Position 1, no Overview
    | Position 1, with Overview | Overview's cited links |\n| --- | --- | --- | ---
    |\n   | Informational | 37.1% | 20.7% | 42.4% |\n | Navigational | 33.4% | 24.1%
    | 44.8% |\n | Transactional | 37.6% | 21.4% | 43.0% |\n | Commercial | 33.8% |
    21.1% | 42.2% |\n  \n \n\nThe click share for the Overview's cited links looks
    promising, but it comes from a model. Pew,"
