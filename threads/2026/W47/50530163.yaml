  author: jvvw
  text: I think children end up having phones for the journey to and from school.
    It&#x27;s the reason I think a lot of parents first get their children phones.
    If they are travelling a distance, on public transport or being picked up somewhere
    by parents then I can understand that. It&#x27;s hard for a school to say that
    the students can&#x27;t have phones for the travel to and from school.<p>The issue
    then becomes what happens to those phones during the day. If school have lockers,
    that is an option, but not all schools have a lockers.<p>In the case of one of
    the schools here, they don&#x27;t have enough lockers for everybody. That school
    had a &#x27;phones mustn&#x27;t be seen in lesson time&#x27; policy, but that
    obviously is too easy to abuse, with e.g. students going to the toilet in lessons
    or just accessing their phones anyway, which isn&#x27;t hard when they have the
    phone in their pocket.<p>They now have switched to lockable pouches that phones
    have to go in during the day and are locked during school hours (with an &#x27;unlocker&#x27;
    available when they leave school). This works better but requires quite a bit
    of staff time checking the pouches in the morning (students will do things like
    put calculators inside instead!) and costs money. I can see why not all schools
    have gone that route.
