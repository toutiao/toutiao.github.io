  author: dbspin
  text: That&#x27;s crazy to me. I vividly remember everyone I knew going from not
    having a phone (unless their parents were wealthy) to suddenly having one. For
    years kids would trade &#x27;free codes&#x27; to get around the price of texting
    - this was all &#x27;pay as you go&#x27; so you bought credit from stores to call
    and text. I suspect the mobile companies were leaking these &#x27;secret engineer
    codes&#x27; in order to boost the popularity of texting. But I did have some awareness
    that we were quite ahead of the US in adoption of mobile, based on TV shows and
    such at the time. Incidentally, prior to that literally no one I knew had a pager.
    Just didn&#x27;t penetrate at all here beyond drug dealers and emergency services.<p>At
    the same time, the reverse culture shock occurred in 2007 when I visited the US
    for the first time, and all the cyber cafes had gone. Replaced by wifi. I didn&#x27;t
    have a laptop at the time, or a wifi capable smart device, so I spent days searching
    for cyber cafes everywhere I visited. I remember using a gaming cafe in the University
    of Phoenix, and searching Korea town for one of NYC&#x27;s remaining cafes. The
    stress of getting around the city alone before having access to a device that
    could run google maps, was no joke.
