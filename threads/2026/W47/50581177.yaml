  title: And yet, it moves – Signore Galilei
  fetch_status: success
  content: "# And yet, it moves\n\nIt appears that Anthropic has just solved the Riemann
    Hypothesis, and I have Thoughts. So I’m going to start by telling you about a
    musical I saw last week.\n\n![](https://i0.wp.com/signoregalilei.com/wp-content/uploads/2026/11/Galileo_Musical_Cover_Art.jpg?resize=300%2C207&ssl=1)\n\nGiven
    my entire personality and identity, it was basically mandatory for me to see _Galileo_
    on Broadway. I went to the second day of previews. The musical itself is at least
    kind of a _Hamilton_ knock-off – with a stubborn main character, a friendship
    that goes wrong, family drama, and of course a historical setting with anachronistically
    modern tunes (though rock rather than hip-hop). Its greatest strength is its actors,
    especially Joy Woods as Galileo’s daughter Virginia and Jeremy Kushnier as Galileo’s
    friend/foil Bishop Barberini. A lot of it seemed to be pandering, but it was pandering
    exactly to me. I give it an 8.5 out of 10.\n\n![](https://i0.wp.com/signoregalilei.com/wp-content/uploads/2026/11/Large_1923_0668_0003_.jpg?resize=300%2C245&ssl=1)\n\n_A
    replica of Galileo’s telescope_\n\nThe best part of this current trend of historical
    musicals is that it brings across how so many parts of our history are kind of
    insane, in a way we don’t usually take the time to appreciate. _Hamilton_ is the
    story of a guerrilla uprising seizing control of the largest colony of the world’s
    most powerful empire, guided by Enlightenment philosophy of all things. _Galileo_
    is the story of a man literally seeing farther than anyone had before, and upending
    the nature of truth. We can find out what is true by just asking the natural world
    in the right way. These ideas are literally revolutionary.\n\nThe Riemann Hypothesis
    has been the crown jewel of unsolved mathematics since Fermat’s Last Theorem was
    solved in the 1990s. Myriad conjectures have been proven true conditional on the
    Riemann Hypothesis. That proof instantly unlocks an incredible amount of the universe
    of math – not unlike the telescope did for our universe.\n\nWhen I imagined the
    day the proof was announced, I’d pictured celebrations in nerd circles on par
    with the biggest I’ve ever seen – Mars rovers touching down, the LHC finding the
    Higgs boson, and the first picture of a black hole. Dancing in the streets, if
    you live on a very specific street.\n\n![](https://i0.wp.com/signoregalilei.com/wp-content/uploads/2026/11/330px-Perseverance_Landing_Skycrane.jpeg?resize=300%2C225&ssl=1)\n\n_Dare
    mighty things_\n\nInstead, the mood feels mournful, or bittersweet at best. The
    proof came from an inscrutable silicon mind, not one of us. Maybe we could have
    solved this one ourselves, but instead we gave up and checked the answer at the
    back of the book. Perhaps it’s beautiful and wondrous that the proof exists at
    all, but it’s not a crowning moment of human achievement. Revolutionary, perhaps,
    but not in the same way.\n\nLegends tell that after the Inquisition forced Galileo
    to formally recant his teachings on the Copernican system and the motion of the
    Earth, he muttered _Eppur si muove –_ “And yet, it moves”. Truth is not what others
    tell us. Truth is just how the world _is_.\n\nWe are staring down the end of our
    role in Galileo’s project. There might still be time for more human discoveries,
    but the window is closing. Someday soon, any discovery we happen to make ourselves
    will be because no one bothered to pass the question off to a powerful machine
    mind. That’s not the world I wanted, but it’s how the world is. It might be selfish
    and childish, but on days like today, I wish that progress would go no further.
    I wish that history would stop.\n\nAnd yet, it moves.\n\n###### [1](#sdfootnote1anc)
