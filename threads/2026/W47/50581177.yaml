  author: augment_me
  text: 1) How do you enforce a global compute ban when you can&#x27;t verify compliance?
    What kind of compute is banned? What is the limit of &quot;acceptable compute&quot;?
    When do we go from statistical models to &quot;AI&quot;. We can&#x27;t even define
    what intelligence is, this sounds a lot harder. How do you audit that this level
    of compute is held by everyone?<p>2) (western) Markets and govts operate on quarters
    earnings and the next election cycles. We kind of know this, this is just how
    the humans work (reaction not proaction). No rational state actor will trigger
    a guaranteed, immediate depression today to preempt some speculative labor disruption
    tomorrow, like this is impossible to imagine. And even if it is a bubble, capital
    always prefers to ride the upside and socialize the crash later rather than voluntarily
    liquidate itself, so you also have that force working against your opinion there.<p>3)
    Opinion polls are economically meaningless. It&#x27;s the same as with organic&#x2F;ecological
    foods, actual preferences are revealed at checkout. Do you pay the extra carbon
    offset when you book a flight? Or always buy the free-range, cruelty-free alternative?
    But animals get hurt, and the global warming will destroy the world!<p>100% Human-Made
    will simply be monetized as a luxury while 95% of the mass market just buys the
    cheaper, faster, AI-subsidized alternative, like people already do today.<p>4)
    What I was trying to say was that you&#x27;re completely free to try to name and
    shame. But the market will ignore you. Consumer boycotts fail against invisible
    B2B inputs because buyers can&#x27;t audit the supply chain and won&#x27;t pay
    a 20% markup for some perceived ideological purity. (slightly anecdotal off-topic,
    but I worked part-time at a hatchery during my bachelors, and the definition of
    organic chicken as minimally required by law was simply that the eggs hatch at
    the farm ground rather than in boxes with 500 other eggs). What is AI-processed
    is not even defined in this way yet.<p>5) Following my slightly cynical market
    analysis in the previous answers, you could say that right now your &quot;Looking
    for better options&quot; while continuing to collect the paycheck is the textbook
    definition of revealed market preference from 3) and 4).<p>You are pricing the
    survival of human civilization at slightly less than the friction cost of taking
    a pay cut or switching jobs. If you won&#x27;t absorb that cost yourself, you
    should think of the rational basis you have to expect millions of strangers to
    do it for you.<p>----<p>Finally, neither of your historical examples proves that
    moral coordination beats material incentives. Nuclear war was avoided via Mutually
    Assured Destruction a game-theoretic equilibrium of deterrence, not moral disarmament
    (we still have thousands of warheads).<p>Chattel slavery was only dismantled in
    the West after industrial capitalism made wage labor more efficient, and even
    then it required a brutal civil war, and not social norms.<p>----<p>I think you
    can&#x27;t beat Moloch with petitioning and moral ideals. You either extract enough
    surplus using the tools we have today while its not yet common knowledge in order
    to buy yourself a lifeboat(I think you are also doing this given your job), or
    just drown on principle idk.
