  text: 1. Government bans on training runs and owning large numbers of GPUs, enforced
    by imprisonment and suspension of access to computer hardware (much as happens
    to people caught violating computer security laws now).<p>2. Complete dismantling
    of the existing AI companies, again enforced by governments, on the grounds that
    every one of these companies is necessarily doing work that is ruining human societies
    at breakneck speeds. There is no fundamental right to make money by creating antisocial,
    dangerous, untrustworthy tools, however pragmatically useful they may be for removing
    programmers and mathematicians from the workforce.<p>3. Developing social norms
    that AI systems are long-term and big-picture very bad for humans in every respect,
    and that developing or using them is a betrayal of your family, friends, and the
    entire species. It may be fun to generate a lot of code, but the tradeoffs are
    brutally savage, and it&#x27;s very much the &quot;defect&quot; choice, IMO.<p>4.
    Naming and shaming  people who train AIs or use them.<p>5. Refusing to surrender
    our minds and capacity for independent thought to AI systems. Don&#x27;t use them
    for any purposes at all.<p>None of this is impossible - just brutally difficult.
    The hardest part is getting governments to coordinate a shutdown of the technology
    and enforcing hard limits on GPU ownership and usage. I&#x27;m not going to say
    that&#x27;s straightforward, but it&#x27;s also not known to be impossible.<p>I&#x27;m
    not entirely sure these are actually good ideas, and restraining people&#x27;s
    freedom disconcerts me deeply, but society is necessarily a trade-off between
    complete individual freedom and cooperative benefits for everyone. We don&#x27;t
    usually let individual people own rocket launchers or heavy machine guns, and
    in many ways these are more dangerous.<p>As someone whose employers have compelled
    me to use Claude daily, I can see the negative impacts these systems are having
