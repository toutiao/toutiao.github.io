  author: ggreer
  text: Machines such as excavators substitute for human labor. The more excavators
    you have, the fewer ditch diggers you want. But machines are also complements
    to labor. The more excavators you have, the more excavator operators you want.
    That&#x27;s how, despite machines making earlier jobs obsolete, people have still
    managed to collect wages from their labor.<p>Machine intelligence is different
    because it fully substitutes for human cognition. Similar to chess engines, at
    some point AI will get good enough that any human input is just adding noise.
    And the cost to run such machines will be much lower than the cost to feed, clothe,
    shelter, and educate a human. This means that almost everyone will be forced to
    retire, and they&#x27;ll have to live off investments, or get government welfare
    from taxes on machines.<p>On the bright side, if economic growth is no longer
    limited by the number of people and their capabilities, we should see very high
    economic growth rates. That means it won&#x27;t take much investment for a person
    to be able to afford a high quality of life indefinitely. Though all of this assumes
    that the machines will care about people (or at least obey laws made by people).
    If that&#x27;s not the case, then humanity would most likely go extinct.
