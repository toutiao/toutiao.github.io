    \n\n ![collisteru Avatar](https://1.gravatar.com/avatar/438f92ef310dce907a9f6edb7ecae300d538ef7a0b94c2c8abd569485bbf8cca?s=96&d=https%3A%2F%2F1.gravatar.com%2Favatar%2Fad516503a11cd5ca435acc9bb6523536%3Fs%3D96&r=G)\n\ncollisteru\n\nMathematicians,
