name: 'HN Archive Sync (hn-data branch)'
description: 'Attach .hn-archive as a worktree of the hn-data orphan branch, or commit+push changes'
inputs:
  mode:
    description: 'attach | push'
    required: true
    default: 'push'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        ARCHIVE=.hn-archive

        if [ "$MODE" = "attach" ]; then
          if git worktree list --porcelain | grep -q "refs/heads/hn-data$"; then
            echo "archive: hn-data worktree already attached"
          elif git ls-remote --exit-code --heads origin hn-data >/dev/null 2>&1; then
            echo "archive: attaching worktree to existing hn-data branch"
            git fetch origin hn-data
            git worktree add "$ARCHIVE" hn-data
          else
            echo "archive: creating orphan hn-data branch worktree"
            git worktree add --orphan -b hn-data "$ARCHIVE"
            printf 'snapshots/**/*.jsonl merge=union\n' > "$ARCHIVE/.gitattributes"
          fi
          # Another workflow may have pushed since our checkout — fast-forward.
          git -C "$ARCHIVE" pull --ff-only origin hn-data 2>/dev/null || true

        elif [ "$MODE" = "push" ]; then
          cd "$ARCHIVE"
          # Jobs that never commit before (hn-fetch) lack a git identity
          git config user.name >/dev/null 2>&1 || git config user.name "HN Archive Bot"
          git config user.email >/dev/null 2>&1 || git config user.email "hn-auto@yuedulijie.com"
          git add -A
          if git diff --cached --quiet; then
            echo "archive: no changes to push"
            exit 0
          fi
          git commit -m "archive: ${GITHUB_JOB:-local} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Push race (hn-fetch 3x/day vs hn-auto vs local sync) resolved by merge + retry.
          # fetch must use an explicit refspec: `git fetch origin hn-data` does NOT
          # update the remote-tracking ref in the actions/checkout environment, so a
          # bare branch fetch leaves the merge target stale (empty-retry loop).
          # --deepen: shallow clones graft newly fetched tips (no visible merge-base),
          # which made rebase replay the whole orphan chain into add/add conflicts
          # (run 40056343806 incident).
          for i in 1 2 3; do
            if git push origin HEAD:hn-data; then
              echo "archive: pushed"
              exit 0
            fi
            echo "archive: push attempt $i failed, merging remote..."
            git fetch --deepen=100 origin +refs/heads/hn-data:refs/remotes/origin/hn-data
            if ! git merge --no-edit origin/hn-data; then
              # threads/topics are whole-file rewrites by the archive scripts; hunk-level
              # auto-merge can produce syntactically broken hybrids. Resolve conflicts by
              # taking ours (CI copy — runner data dies with the VM); the remote side's
              # newer data is re-added by the registry state machine on later runs
              # (comments merge by id, re-runs never duplicate).
              git diff --name-only --diff-filter=U | while read -r f; do
                git checkout --ours -- "$f" && git add -- "$f" || git rm -f -- "$f"
              done
              git commit --no-edit
            fi
          done
          echo "::error::archive push failed after 3 attempts (next run re-adds)"
          exit 1

        else
          echo "::error::unknown mode '$MODE'"
          exit 1
        fi
