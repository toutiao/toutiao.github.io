name: HN Data Fetcher + Hot Trigger

# 与 hn-auto/hn-weekly 共写 hn-data（且 hot 触发会 dispatch auto），共享
# concurrency 组串行化防并发 push 竞态。排队不取消（详见 hn-auto.yml 注释）。
concurrency:
  group: hn-pipeline
  cancel-in-progress: false

on:
  schedule:
    # Every 3h (8 slots/day) — dense snapshots shrink hot-trigger latency;
    # daily budget (--daily-max) still caps LLM spend, not the fetch cadence.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # Cold archive worktree (hn-data branch) is the sole storage since phase 2;
      # snapshots/registry/threads are written there during the run.
      - uses: ./.github/actions/hn-archive
        with:
          mode: attach

      - name: Fetch HN lists (best + news, tiered sampling)
        run: bundle exec ruby scripts/hn-fetch.rb --lists --fetch-articles-simple --jobs 5

      # Secondary professional-community source; best-effort — must not block
      # the HN pipeline on lobste.rs hiccups.
      - name: Fetch Lobsters (secondary source)
        continue-on-error: true
        run: bundle exec ruby scripts/lobsters-fetch.rb --hottest

      - name: Poll watching threads (weekly liveness, resurrect on growth)
        run: bundle exec ruby scripts/hn-fetch.rb --poll-watching

      - name: Hot story trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # machine-readable stdout: only TRIGGER/UPDATE lines (summary goes to
          # stderr, which shows in CI log directly since $(...) captures stdout
          # only). hot-check emits at most ONE line per call (--per-run 1
          # default): two dispatches seconds apart cancel each other on the
          # shared concurrency group (pending-run replacement kills the older
          # one). TRIGGER -> new article (mode=url), UPDATE -> append update
          # section to the existing article (mode=update).
          OUTPUT=$(bundle exec ruby scripts/hn-fetch.rb --hot-check --daily-max 4 --update-max 2) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -E '^(TRIGGER|UPDATE) ' | while read -r KIND HN_URL; do
            [ -n "$HN_URL" ] || continue
            MODE=url
            [ "$KIND" = "UPDATE" ] && MODE=update
            echo "Dispatching $KIND: $HN_URL (mode=$MODE)"
            gh workflow run hn-auto.yml -f mode=$MODE -f hn_url="$HN_URL" || echo "dispatch failed (non-fatal)"
          done
          echo "$OUTPUT" | grep -qE '^(TRIGGER|UPDATE) ' || echo "No hot story today."

      - uses: ./.github/actions/hn-archive
        with:
          mode: push
