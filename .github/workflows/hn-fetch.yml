name: HN Data Fetcher + Hot Trigger
on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - uses: ./.github/actions/hn-cache/restore

      - name: Fetch HN data (simple HTTP)
        run: bundle exec ruby scripts/hn-fetch.rb --best --max 15 --fetch-articles-simple --jobs 5

      - name: Hot story trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # machine-readable stdout: only TRIGGER lines (summary goes to stderr,
          # which shows in CI log directly since $(...) captures stdout only)
          OUTPUT=$(bundle exec ruby scripts/hn-fetch.rb --hot-check --daily-max 2) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -E '^TRIGGER ' | while read -r _ HN_URL; do
            [ -n "$HN_URL" ] || continue
            echo "Dispatching hot trigger: $HN_URL"
            gh workflow run hn-auto.yml -f mode=url -f hn_url="$HN_URL" || echo "dispatch failed (non-fatal)"
          done
          echo "$OUTPUT" | grep -qE '^TRIGGER ' || echo "No hot story today."

      - uses: ./.github/actions/hn-cache/save
