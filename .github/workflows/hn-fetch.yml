name: HN Data Fetcher + Hot Trigger
on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - uses: ./.github/actions/hn-cache/restore

      - name: Fetch HN data (simple HTTP)
        run: bundle exec ruby scripts/hn-fetch.rb --best --max 15 --fetch-articles-simple --jobs 5

      - name: Hot story trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTPUT=$(bundle exec ruby scripts/hn-fetch.rb --hot-check --daily-max 2) || true
          echo "$OUTPUT"
          while read -r _ URL; do
            if [ -n "$URL" ]; then
              echo "Dispatching hot trigger: $URL"
              gh workflow run hn-auto.yml -f mode=url -f hn_url="$URL" || echo "dispatch failed (non-fatal)"
            fi
          done <<< "$OUTPUT"
          echo "$OUTPUT" | grep -q '^TRIGGER' || echo "No hot story today."

      - uses: ./.github/actions/hn-cache/save
