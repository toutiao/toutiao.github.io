name: HN Auto-Summarizer

on:
  schedule:
    # Two slots, one article each (--batch 1): spreads publishing across the
    # day instead of a single 2-article burst; hot triggers fill the gaps.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "AI 模型"
        type: choice
        required: false
        default: "minimax-cn-coding-plan/MiniMax-M3"
        options:
          - "minimax-cn-coding-plan/MiniMax-M3"
          - "google/gemini-3.5-flash"
          - "google/gemini-2.5-flash"
          - "deepseek/deepseek-v4-flash"
      mode:
        description: "运行模式 — auto 自动选择 / url 手动指定 / update 已发布文章追加更新段"
        type: choice
        required: false
        default: "auto"
        options:
          - "auto"
          - "url"
          - "update"
      hn_url:
        description: "HN 讨论 URL（mode=url 时必填）"
        required: false
        default: ""
      force_fetch:
        description: "强制重新抓取，忽略缓存"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # 三 HN workflow 共写 master/hn-data，共享组串行化（2026-10-25 双 dispatch
  # 40157635045/40157637103 同秒并发，后者 push non-FF 靠 recover 救回但 run 红）。
  # 排队不取消：生成中途取消 = LLM 花费随 runner 销毁。
  group: hn-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Configure Git
        run: |
          git config user.name "HN Auto-Summarizer"
          git config user.email "hn-auto@yuedulijie.com"

      - uses: ./.github/actions/setup-opencode

      # Cold archive (hn-data branch, sole storage since phase 2): skill reads
      # candidates/threads/heat from it and generation-time fetches write into it.
      - uses: ./.github/actions/hn-archive
        with:
          mode: attach

      - name: Fresh fetch (force only)
        if: ${{ inputs.force_fetch == 'true' }}
        run: |
          echo "Force fetch: refreshing HN data..."
          bundle exec ruby scripts/hn-fetch.rb --lists --fetch-articles-simple --jobs 5 --timeout 20 --force

      - name: Check API keys
        env:
          GOOGLE_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          echo "=== Google Gemini ==="
          if [ -n "$GOOGLE_KEY" ]; then
            for model in gemini-2.5-flash gemini-2.5-flash-lite \
                         gemini-3.1-flash-lite gemini-3.5-flash; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://generativelanguage.googleapis.com/v1/models/$model?key=$GOOGLE_KEY")
              printf "  %-30s %s\n" "$model" "$CODE"
            done
          else
            echo "  no key"
          fi
          echo "=== MiniMax (cn token plan) ==="
          if [ -n "$MINIMAX_KEY" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.minimaxi.com/v1/models \
              -H "Authorization: Bearer $MINIMAX_KEY")
            echo "  status: $CODE"
          else
            echo "  no key"
          fi
          echo "=== DeepSeek ==="
          if [ -n "$DEEPSEEK_KEY" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.deepseek.com/v1/models \
              -H "Authorization: Bearer $DEEPSEEK_KEY")
            echo "  status: $CODE"
            [ "$CODE" = "200" ] && echo "  OK" || echo "  WARN: HTTP $CODE"
          else
            echo "  no key"
          fi

      - name: Generate articles (opencode auto)
        id: generate
        timeout-minutes: 20
        continue-on-error: true
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          # Clean up any orphaned _articles/ from previous failed run
          git checkout -- _articles/ 2>/dev/null || true
          git clean -fd _articles/ 2>/dev/null || true
          # Today's article count before generation — fallback judges output by
          # comparing counts (a dirty-tree check breaks if the agent commits)
          YEAR=$(TZ=Asia/Shanghai date +%Y)
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "baseline=$(ls "_articles/$YEAR/" 2>/dev/null | grep -c "^${TODAY}-" || true)" >> $GITHUB_OUTPUT
          MODEL='${{ inputs.model }}'
          if [ -z "$MODEL" ]; then MODEL='minimax-cn-coding-plan/MiniMax-M3'; fi
          MODE='${{ inputs.mode }}'
          HN_URL='${{ inputs.hn_url }}'
          FORCE='${{ inputs.force_fetch }}'
          FLAGS=""
          [ "$FORCE" = "true" ] && FLAGS="--force"
          if [ "$MODE" = "url" ] || [ "$MODE" = "update" ]; then
            if [ -z "$HN_URL" ]; then
              echo "ERROR: mode=$MODE 但 hn_url 为空"
              exit 1
            fi
            UPDATE_FLAG=""
            [ "$MODE" = "update" ] && UPDATE_FLAG="--update"
            HN_CMD="/hn $HN_URL $UPDATE_FLAG $FLAGS"
          else
            HN_CMD="/hn --auto $FLAGS --batch 1"
          fi
          opencode run "$HN_CMD" --dir . \
            --dangerously-skip-permissions \
            --model "$MODEL" 2>&1

      - name: Fallback chain (Gemini -> DeepSeek)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          # 主模型失败或静默 no-op (无新文章) 时，依次回退；已有产出则跳过。
          # Judge by today's article count vs baseline — NOT git status: the agent
          # occasionally commits its output in-run, which empties the dirty-tree
          # check and made the fallback chain fire needlessly.
          # update 模式例外：不产新文件，只改既有文章 — 判定必须用 git status。
          YEAR=$(TZ=Asia/Shanghai date +%Y)
          TODAY=$(TZ=Asia/Shanghai date +%F)
          NOW=$(ls "_articles/$YEAR/" 2>/dev/null | grep -c "^${TODAY}-" || true)
          BASE='${{ steps.generate.outputs.baseline }}'
          [ -z "$BASE" ] && BASE=0
          PRODUCED=0
          [ "$NOW" -gt "$BASE" ] && PRODUCED=1
          RUN_MODE="${RUN_MODE:-auto}"
          if [ "$RUN_MODE" = "update" ] && [ -n "$(git status --porcelain -- _articles/)" ]; then
            PRODUCED=1
          fi
          if [ "$PRODUCED" = "1" ]; then
            echo "主模型已产出文章（今日 $NOW 篇 > 基线 $BASE），跳过回退"
            exit 0
          fi
          echo "主模型无产出，开始回退链..."
          force_flag=""
          [ '${{ inputs.force_fetch }}' = "true" ] && force_flag="--force"
          for MODEL in "google/gemini-3.5-flash" "deepseek/deepseek-v4-flash"; do
            PROV=${MODEL%%/*}
            if [ "$PROV" = "deepseek" ] && [ -z "$DEEPSEEK_API_KEY" ]; then echo "no DEEPSEEK_API_KEY, skip $MODEL"; continue; fi
            if [ "$PROV" = "minimax-cn-coding-plan" ] && [ -z "$MINIMAX_API_KEY" ]; then echo "no MINIMAX_API_KEY, skip $MODEL"; continue; fi
            if [ "$RUN_MODE" = "url" ]; then echo "url fallback 不支持"; exit 1; fi
            # Reset partial writes from previous attempt
            git checkout -- _articles/ 2>/dev/null || true
            git clean -fd _articles/ 2>/dev/null || true
            echo "=== Fallback: $MODEL ==="
            if [ "$RUN_MODE" = "update" ]; then
              CMD="/hn ${{ inputs.hn_url }} --update"
            else
              CMD="/hn --auto $force_flag"
            fi
            if opencode run "$CMD" --dir . \
              --dangerously-skip-permissions \
              --model "$MODEL" 2>&1 && [ -n "$(git status --porcelain -- _articles/)" ]; then
              echo "Fallback 成功: $MODEL"
              exit 0
            fi
          done
          echo "所有回退模型均无产出"
          exit 1

      - name: Validate & auto-repair article front matter (one-shot)
        if: ${{ !cancelled() }}
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: ruby scripts/hn-repair.rb

      - name: Show changes
        if: ${{ !cancelled() }}
        run: |
          echo "=== Articles ==="
          ls -la _articles/ 2>/dev/null | tail -5 || echo "(empty)"
          echo "=== Git status ==="
          git status --short -- _articles/ 2>/dev/null || true

      - name: Compute heat + trends projection
        if: ${{ !cancelled() }}
        run: ruby scripts/hn-heat.rb --all

      - name: Validate Jekyll build
        if: ${{ !cancelled() }}
        run: |
          # agent 可能已跑过 make build (Docker 容器 root 写出 _site)，必须清理后再验证
          sudo rm -rf _site .jekyll-cache .sass-cache
          bundle exec jekyll build

      - name: Commit date
        if: ${{ !cancelled() }}
        id: commit-date
        run: echo "commit_date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Detect git state
        if: ${{ !cancelled() }}
        id: git-state
        run: |
          if [ -n "$(git status --porcelain -- _articles/ _data/hn_trends.json _data/hn_trends_7.json _data/hn_trends_90.json)" ]; then
            echo "state=dirty" >> $GITHUB_OUTPUT
            echo "commit_opts=" >> $GITHUB_OUTPUT
            echo "push_opts=" >> $GITHUB_OUTPUT
          elif [ "$(git rev-list --count origin/master..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            echo "state=ahead" >> $GITHUB_OUTPUT
            echo "commit_opts=--amend --no-edit" >> $GITHUB_OUTPUT
            echo "push_opts=--force" >> $GITHUB_OUTPUT
          else
            echo "state=clean" >> $GITHUB_OUTPUT
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        id: auto-commit
        if: ${{ !cancelled() && steps.git-state.outputs.state != 'clean' }}
        with:
          commit_message: "feat: HN 自动摘要 ${{ steps.commit-date.outputs.commit_date }}"
          commit_user_name: "HN Auto-Summarizer"
          commit_user_email: "hn-auto@yuedulijie.com"
          file_pattern: "_articles/ _data/hn_trends.json _data/hn_trends_7.json _data/hn_trends_90.json"
          commit_options: ${{ steps.git-state.outputs.commit_opts }}
          push_options: ${{ steps.git-state.outputs.push_opts }}
          skip_dirty_check: true

      # git-auto-commit's push has no retry: if master advanced during the ~20min
      # generation window (local pushes / other runs / hot-dispatch queueing), the
      # push is rejected and the committed articles die with the runner (runs
      # 40055583472 / 40056343806). The commit already passed the build gate —
      # rebase onto the new remote and push again. --deepen: shallow clones graft
      # fetched tips, which would make rebase replay the whole visible history.
      # NOTE the !cancelled() prefix: an `if` without a status function is
      # implicitly `success() && ...`, which can never run after a failed step
      # (40094015438 — the recover step was skipped exactly this way).
      - name: Recover master push (concurrent push race)
        if: ${{ !cancelled() && steps.auto-commit.outcome == 'failure' }}
        run: |
          git fetch --deepen=100 origin +refs/heads/master:refs/remotes/origin/master
          if ! git rebase origin/master; then
            # Only the three trend projections can conflict here (whole-file rewrites
            # by hn-heat on both sides; article filenames never collide). Rebase
            # swaps ours/theirs: --theirs = this run's replayed side. Take it — the
            # projection computed with this run's articles; the next hn-heat --all
            # recomputes it wholesale anyway.
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --theirs -- "$f" && git add -- "$f" || git rm -f -- "$f"
            done
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:master

      # Persist generation-time archive writes (url-mode fetches, force fetch)
      # to the hn-data branch — previously these were lost with the runner.
      - uses: ./.github/actions/hn-archive
        if: ${{ !cancelled() }}
        with:
          mode: push
